- "For on-premise installations, before applying the update, back up your existing
  installation, including all applications, configuration files, databases and database
  settings, and so on.\n\nRed Hat recommends that you halt the server by stopping
  the JBoss Application Server process before installing this update. After installing
  the update, restart the server by starting the JBoss Application Server process.\n\
  \nThe References section of this erratum contains a download link. You must log
  in to download the update."
