title: boks_ksllogsd accepts a checksum algorithm name in the MD field of an 
  authenticated KSL start message. Affected releases verify that OpenSSL 
  recognizes the digest name but do not verify that the value fits in a fixed 
  16-byte checksum context field before copying it. An authenticated KSL client 
  can supply an oversized, OpenSSL-recognized digest name and write beyond the 
  end of the heap allocation.
