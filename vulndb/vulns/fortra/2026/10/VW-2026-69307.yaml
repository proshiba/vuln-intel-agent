title: Fortra BoKS Manager contains a command injection vulnerability in 
  crlserver. An authenticated user authorized to add CRL URLs through BCC, the 
  WSI REST or SOAP API, or the cacrl command-line interface could cause shell 
  command substitution to be processed by crlserver as root on the BoKS Master. 
  BCC and WSI provide network-accessible administration paths and do not require
  a local sudo or suexec rule; non-root use of cacrl requires such a rule.
