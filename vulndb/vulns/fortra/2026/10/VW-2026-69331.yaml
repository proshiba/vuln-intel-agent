title: Fortra BoKS Manager contains an out-of-bounds read vulnerability in the 
  custom TLS ClientHello parser used by boks_portmux. A remote unauthenticated 
  attacker can submit a malformed ClientHello and terminate boks_portmux. 
  Although the daemon is normally restarted automatically, repeated requests can
  sustain the service interruption.
