title: Alior Bank PrestaShop module "raty" for commercial partners is vulnerable
  to SQL Injection in the "hookActionObjectProductUpdateBefore", 
  "hookActionObjectCategoryUpdateBefore", and "hookActionObjectCategoryAddAfter"
  hook methods. The module inserts values of the POST parameters 
  "alior_product_promotion",  "alior_category_promotion" and 
  "alior_category_enabled" directly into SQL UPDATE queries without any 
  sanitization or validation. An attacker with access to the product or category
  add/edit functionality in the PrestaShop backoffice can inject arbitrary SQL, 
  potentially allowing unauthorized access to and modification of database 
  contents. This issue was fixed in versions: 9.0.7 and 8.1.11
