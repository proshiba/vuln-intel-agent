title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ravb: serialize PTP clock teardown\n\nravb_ptp_interrupt() can race with ravb_ptp_stop()
  and pass the clock to\nptp_clock_event() while ptp_clock_unregister() is freeing
  it. This can\nlead to a use-after-free.\n\nUse READ_ONCE() and WRITE_ONCE() for
  lockless access to the clock pointer.\nAtomically detach it with xchg() before disabling
  PTP interrupts, then\nsynchronize all IRQs which can invoke ravb_ptp_interrupt()
  before\nunregistering the detached clock.\n\nA handler which read the old pointer
  completes before the clock is\nunregistered, while later handlers read NULL and
  skip the event."
