title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  sony: fix UAF of ghl_poke_timer / ghl_urb at driver unbind\n\nFor GHL (Guitar Hero
  Live) dongles, sony_probe() arms a periodic timer:\nghl_magic_poke() (the timer
  callback) submits sc->ghl_urb, and the URB\ncompletion ghl_magic_poke_cb() re-arms
  the timer with mod_timer().\n\nsony_remove() drained the timer with timer_delete_sync()
  and then freed\nthe URB with usb_free_urb():\n\n\ttimer_delete_sync(&sc->ghl_poke_timer);\n\
  \tusb_free_urb(sc->ghl_urb);\n\ntimer_delete_sync() does not block re-arming, and
  while the URB is in\nflight the timer is not pending, so the sync delete is a no-op.
  A URB\ncompletion that runs after the delete re-arms the timer, and usb_free_urb()\n\
  only drops a reference -- it does not kill an in-flight URB. sc is\nallocated with
  devm_kzalloc() and freed once sony_remove() returns, so the\nre-armed ghl_poke_timer
  (embedded in sc) then fires on freed memory, a\nuse-after-free from timer softirq.
