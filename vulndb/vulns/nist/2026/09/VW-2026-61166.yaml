title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Fix error path at svm_migrate_copy_to_ram\n\nIf page migration from device to sys
  ram fails for some reasons driver needs\nrelease and unlock allocated system pages.
  To do that driver should use page\nphysical address, or pfn, then get struct page*.
  Current driver uses dma\naddress(for adev) that is not correct with IOMMU enabled,
  or even in general.\n\nThe patch releases and unlocks allocated system pages based
  on where migration\nfailed by struct page* of sys ram pages. Also dma_unmap correspodent
  system\nram pages at error path."
