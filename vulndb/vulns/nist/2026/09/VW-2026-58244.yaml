title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  plda: Fix IRQ domain leaks in the error paths of plda_init_interrupts()\n\nplda_init_interrupts()
  initializes IRQ domains and creates IRQ mapping but\ndoes not unwind them when later
  step fails.\n\nIf platform_get_irq() or either irq_create_mapping() fails\nin plda_init_interrupts(),
  the domains are never deinitialized. If\nirq_create_mapping() fails, port->intx_irq
  stays initialized.\n\nHence, remove the IRQ domains in the error path by calling\n\
  plda_pcie_irq_domain_deinit().\n\nSince plda_pcie_irq_domain_deinit() now disposes
  of the intx_irq and\nmsi_irq mappings itself before removing their domains, the
  msi_irq\nmapping failure path can go directly to err_irq_domain_deinit instead of\n\
  disposing of port->intx_irq separately first.\n\nThis issue was found by automated
  review of sashiko-bot\n\n[mani: commit log]"
