title: "org.apache.karaf.config.core.impl.ConfigRepositoryImpl#update(pid, properties),\n\
  which backs the \"config\" MBean and the config:* shell commands, derives the file\n\
  it writes a configuration to from caller-supplied input without checking that\n\
  the result stays inside ${karaf.etc}:\n\n  *  if the submitted property map contains
  a felix.fileinstall.filename entry, that value is turned directly into a File (getCfgFileFromProperty),
  so it can point to any absolute path the Karaf process can write to;\n  *  otherwise
  the configuration PID is concatenated verbatim into the target file name (generateConfigFilename():
  new File(karaf.etc, pid + \".cfg\")), so a PID containing \"..\" segments resolves
  outside ${karaf.etc}. createFactoryConfiguration() has the same issue via the factory
  PID/alias.\n\n\nBoth code paths are reachable by any caller holding the \"manager\"\
  \ role under Karaf's shipped command/JMX ACL (org.apache.karaf.command.acl.conf.cfg: \"\
  update = manager\"). Such a user can therefore write attacker-c"
