title: A vulnerability has been found in Cleo Harmony up to 5.8.1.10. Impacted 
  is the function LocalUserUtil.getNativeUserByAssertions of the component SAML 
  Authentication. Such manipulation of the argument Email leads to improper 
  authentication. The attack can be executed remotely. The exploit has been 
  disclosed to the public and may be used. Upgrading to version 5.8.1.11 is 
  recommended to address this issue. Upgrading the affected component is 
  recommended.
