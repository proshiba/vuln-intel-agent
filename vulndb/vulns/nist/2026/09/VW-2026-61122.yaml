title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix tree connection use-after-free in smb2_tree_connect()\n\nksmbd_tree_conn_connect()
  publishes a new tree connection in\nsess->tree_conns with a single reference and
  returns its pointer to\nsmb2_tree_connect(). The handler continues to initialize
  the object and\nbuild the response after publication. A concurrent session logoff
  can\nerase the connection and drop that reference, freeing the object while\nthe
  handler still uses it.\n\nBUG: KASAN: slab-use-after-free in smb2_tree_connect+0xe3d/0xf90\n\
  \  smb2_tree_connect (fs/smb/server/smb2pdu.c:2872)\n  handle_ksmbd_work\n  process_one_work\n\
  \  worker_thread\n  kthread\n\nAfter xa_store() succeeds, take a second reference
  before releasing\ntree_conns_lock. The original reference belongs to the xarray
  entry and\nthe second belongs to the creating smb2_tree_connect() handler.\n\nKeep
  the references balanced in every path:\n\n- On normal exit or an error after publication,
