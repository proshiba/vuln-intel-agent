title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  caiaq: Decoupling ep1_in_urb in caiaq dev\n\nThe epq_in_urb object belonging to
  the caiaq device is coupled within\nthe struct snd_usb_caiaqdev. After usb_submit_urb(epq_in_urb,
  GFP_KERNEL)\nexecutes successfully, epq_in_urb is successfully added to the urbp_list\n\
  queue of the dummy HCD driver (userspace specifies dummy_hcd as the HCD\nlayer driver
  for the caiaq USB device).\n\nWhen init_card() calls snd_usb_caiaq_send_command()
  which subsequently\nfails due to a timeout, and proceeds to call snd_card_free()
  to release\nthe card, the embedded ep1_in_urb object is also freed. When the dummy\n\
  HCD driver detects that the URB has been unlinked, it returns the URB\n(by usb_hcd_giveback_urb()),
  which triggers [1].\n\nDecouple the ep1_in_urb object from the struct snd_usb_caiaqdev
  and switch\nto using a pointer instead. Separately allocate and manage the memory
  for\nep1_in_urb to prevent the release of the snd_card memory object from\n"
