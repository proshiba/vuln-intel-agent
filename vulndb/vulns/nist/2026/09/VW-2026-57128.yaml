title: PocketMine-MP versions >= 4.20.0 before 4.22.3 (and before 5.2.1 in the 
  5.x branch) fail to validate NBT tag types in BlockActorDataPacket. A player 
  can crash the server by sending a packet containing sign NBT data with an 
  incorrect tag type, triggering an unhandled UnexpectedTagTypeException that 
  terminates the server process.
