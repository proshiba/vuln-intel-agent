title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  rmi: fix OOB access with undersized RMI reports\n\nThe hid-rmi driver sizes its
  writeReport/readReport buffer purely from\nthe report descriptor supplied by the
  device, with no minimum bound:\n\n\tdata->input_report_size  = hid_report_len(input_report);\n\
  \tdata->output_report_size = hid_report_len(output_report);\n\talloc_size = data->output_report_size
  + data->input_report_size;\n\tdata->writeReport = devm_kzalloc(&hdev->dev, alloc_size,
  GFP_KERNEL);\n\tdata->readReport = data->writeReport + data->output_report_size;\n\
  \nbut then reads and writes fixed offsets into it.  A device declaring a\n1-byte
  output and a 1-byte input report makes hid_report_len() return 2\nfor each, so alloc_size
  is 4, while rmi_set_page() -- reached\nunconditionally at probe time through rmi_input_configured()
  -- stores\nwriteReport[4] and rmi_hid_read_block() stores writeReport[0..5].  Since\n\
  readReport lives at writeReport + output_report_size, those stores"
