title: Moquette is a lightweight Java MQTT broker. Prior to 0.18.1, 
  H2PersistentQueue derives a session's message-map name as queue_ plus the 
  client ID and its metadata-map name as queue_ plus the client ID plus _meta. A
  durable session whose client ID ends in _meta can therefore make its message 
  map collide with another client's metadata map. The colliding sessions read 
  and write the same H2 MVStore map with incompatible value types, which can 
  corrupt queue head and tail data and cause message loss, misdelivery, failed 
  queue reloads, or exposure of queued content across sessions. This issue is 
  fixed in version 0.18.1.
