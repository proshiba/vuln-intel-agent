title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: validate IEs in cfg80211_wext_siwgenie()\n\nThe KASAN allocation trace
  shows that a malformed IE buffer is\nstored via SIOCSIWGENIE (cfg80211_wext_siwgenie())
  without any\nvalidation. The crash trace shows that a subsequent SIOCSIWESSID\n\
  triggers a connection attempt which calls cfg80211_sme_get_conn_ies()\nto process
  the stored IE buffer, causing:\n\n - An out-of-bounds read in skip_ie() which reads
  ies[pos+1]\n   (the length byte) past the end of the 1-byte buffer.\n\n - An integer
  underflow in the memcpy size argument when offs\n   returned by ieee80211_ie_split()
  exceeds ies_len, causing\n   unsigned subtraction to wrap to SIZE_MAX and triggering
  a\n   fortify panic.\n\nFix this by validating the IE buffer in cfg80211_wext_siwgenie()\n\
  before storing it.\n\n[drop unnecessary ie_len check, update commit message]"
