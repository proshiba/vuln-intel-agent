title: The Builderall Cheetah For Wp plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  disable() function in versions up to, and including, 3.0.2. The 
  wp_ajax_ba_cheetah_disable AJAX handler is registered without any capability 
  or nonce verification, and the target post_id is sourced directly from 
  user-controlled $_POST['ba_cheetah_data']['post_id']. This makes it possible 
  for authenticated attackers, with Subscriber-level access and above, to 
  disable the page builder layout on arbitrary posts by setting the 
  _ba_cheetah_enabled post meta to false, including on posts owned by other 
  users.
