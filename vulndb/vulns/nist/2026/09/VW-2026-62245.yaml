title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  Fix index_root heap OOB write in ntfs_ir_to_ib()\n\nntfs_ir_to_ib copies all entries
  from index_root into a freshly allocated\nindex_block_size-byte buffer without verifying
  that the entries fit in the\navailable space. The entries in index_root may be larger
  than the usable\nentry space in the index block.\n\nThis can cause OOB writes past
  the end of the allocation.\n\nThe validator ntfs_index_root_inconsistent() checks
  that entries are\nself-consistent within the IR value, but never cross-checks them
  against\nindex_block_size. There is no bounds check in ntfs_ir_to_ib() before the\n\
  memcpy.\n\nFixing this at the sink in ntfs_ir_to_ib() since\nntfs_index_root_inconsistent()
  validates the logical consistency of\nindex_root as a structure and a root with
  large entries is a structurally\nvalid root. The bug is a size conflict of ntfs_ir_to_ib().\n\
  Also, the validator is called once per inode load in\nntfs_read_locked_inode() while
  ntf"
