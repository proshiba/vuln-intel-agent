title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  core: Abort active target transfer on controller suspend\n\nWhen an SPI controller
  operating in target mode has a transfer in\nprogress at the time of system suspend,
  the suspend path proceeds\nwithout aborting the ongoing transfer. This can leave
  the hardware in\nan inconsistent state, potentially causing the system to hang or
  fail\nto resume cleanly.\n\nFix this by invoking the controller's target_abort callback
  from\nspi_controller_suspend() when the controller is in target mode and the\ncallback
  is registered. This ensures any active target transfer is\ncleanly terminated before
  the controller is suspended."
