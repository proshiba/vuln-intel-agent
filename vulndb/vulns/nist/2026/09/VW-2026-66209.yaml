title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  propagate reparse index insertion failure\n\nupdate_reparse_data() ignores the return
  value of\nset_reparse_index(). When index insertion fails, the code removes\nthe
  just-written reparse data as cleanup but still returns 0, so\nsymlink(2) (and WSL
  special file creation) reports success while\nno reparse data exists on disk. When
  there was no previous reparse\ndata (oldsize == 0), the failure was likewise silently
  ignored.\n\nPropagate the error to the caller."
