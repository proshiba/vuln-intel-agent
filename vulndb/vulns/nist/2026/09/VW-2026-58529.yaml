title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  dwc3: gadget: Fix use-after-free in dwc3_gadget_free_endpoints due to race condition\n\
  \nIn dwc3_gadget_init_endpoint, &dep->nostream_work is bound with\ndwc3_nostream_work,
  and dwc3_gadget_endpoint_stream_event can queue\nthis delayed work on system_percpu_wq
  when a DEPEVT_STREAM_NOSTREAM\nevent is received.\n\nIf we remove the gadget, dwc3_gadget_free_endpoints
  makes cleanup and\nthe memory allocated for dep with kzalloc() is released by kfree(dep),\n\
  while the delayed work mentioned above may still be pending or\nrunning. The sequence
  of operations that may lead to a UAF bug is as\nfollows:\n\nCPU0               \
  \                       CPU1\n\n                                          | dwc3_thread_interrupt\n\
  \                                          | dwc3_endpoint_interrupt\n         \
  \                                 | dwc3_gadget_endpoint_stream_event\n        \
  \                                  | queue_delayed_work(system_percpu_"
