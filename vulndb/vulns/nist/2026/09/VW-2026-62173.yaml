title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: skip double clone set expressions on element insert\n\nBoth the dynset
  and newsetelem path clone the existing set expressions\nwhen setting set element
  expressions if no override expressions are\nprovided. This results in a double clone,
  once to clone the template set\nexpressions then another clone on the new element.
  Add a flag to\nannotate if userspace provides a override expression (ie. expression
  of\nthe same type of the set but different configuration), otherwise borrow\nthe
  existing expression from the set. Add conditionals to release\nexpression iif they
  represent an override. Use this new override_exprs\nflag to dump the dynset expression
  override to userspace.\n\nThis simplifies the existing logic and it also fixes a
  bug with the\nconnlimit expression which results in a module refcount imbalance\n\
  WARNING splat when resorting on the default set expressions."
