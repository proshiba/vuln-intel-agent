title: A race condition in the document value layer of MongoDB Server can allow 
  concurrent server threads to operate on the same internal memory without 
  synchronization, leading to memory corruption. An authenticated user holding 
  ordinary read-write privileges on a database may be able to trigger this 
  condition over the normal client protocol, resulting in server termination and
  potential corruption of process memory with user-influenced content. 
  Successful use of this issue may impact the confidentiality, integrity, and 
  availability of the affected server process.
