title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau/dmem:
  fix callocated underflow on large folio split\n\nnouveau_dmem_folio_free() drops
  chunk->callocated once per freed folio,\nwhile a large (compound) device-private
  folio is only counted once when\nit is allocated.  When such a folio is split, the
  mm core invokes\n->folio_split() (nouveau_dmem_folio_split()) once for each new\n\
  sub-folio, but the hook only fixes up the sub-folio metadata and leaves\nchunk->callocated
  unchanged.\n\nEach resulting sub-folio is later freed separately, so after a split\n\
  the single allocation (+1) is met by N frees (-N), leaving\nchunk->callocated short
  by N-1.  On the first split/free cycle it\nunderflows: WARN_ON(!chunk->callocated)
  fires, the unsigned counter\nwraps and never returns to zero, so the chunk can no
  longer be\nreclaimed (nouveau_dmem_fini() also warns on the leaked count).\n\nAccount
  for the new sub-folio in the split hook, under the same lock as\nnouveau_dmem_folio_free(),
  so"
