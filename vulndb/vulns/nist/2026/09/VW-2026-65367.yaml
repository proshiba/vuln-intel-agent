title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmemcg:
  bypass the reclaim and oom killer for dying tasks once oom_reaper is done\n\nAt
  Meta, we are seeing instances where an OOM killed job is stuck in the\nexit path
  for several hours.  In one particular case, the job was stuck\nfor more than 8 hours
  and I had to manually remove the memory.max limits\nto allow the process to exit.\n\
  \nThe job was a single process job and had ~55 GiB memory.max and zswap\nenabled.\
  \  It had almost 0 anon in memory and ~111 GiB in zswap compressed\nto ~51 GiB zswap
  pool (i.e.  almost all of memory.current was zswap). \nNothing was left on the LRUs
  to reclaim.\n\nOn further inspection, I observed ~20k threads of that process stuck
  with\nthe following stack:\n\n[<0>] mem_cgroup_out_of_memory+0x4e/0xa0\n[<0>] charge_memcg+0x8bf/0x990\n\
  [<0>] mem_cgroup_swapin_charge_folio+0x4e/0x80\n[<0>] __read_swap_cache_async+0x10c/0x260\n\
  [<0>] swapin_readahead+0x116/0x3f0\n[<0>] do_swap_page+0x13c/0x1ce0\n[<0>] handle_mm_fau"
