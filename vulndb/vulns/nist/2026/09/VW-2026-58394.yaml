title: "In the Linux kernel, the following vulnerability has been resolved:\n\nefivarfs:
  Rate limit statfs() handler\n\nRavi reports that statfs() may be called by unprivileged
  users on the\nefivarfs mount point, which may result in a flood of calls to the\n\
  QueryVariableInfo() runtime service. These calls are disproportionately\ncostly
  on x86 systems where the variable store is backed by SMM, as each\nSMM entry requires
  a rendez-vous of all the CPUs.\n\nSo rate limit the calls to QueryVariableInfo()
  at twice per second, and\nreturn the most recently obtained value for calls that
  are elided."
