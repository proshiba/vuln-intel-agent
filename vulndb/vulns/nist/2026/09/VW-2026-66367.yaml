title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2, during federated authentication (OAuth/OIDC/SAML), a profile image 
  URL from the external identity provider is fetched without verifying the 
  target address. An actor who controls their profile at a connected provider 
  may cause the server to connect to internal network locations. Response timing
  and error patterns differ between reachable and unreachable targets, allowing 
  internal service probing. Worker processes may be blocked for several seconds 
  per request. Requires a configured external authentication provider where the 
  actor can modify their profile image URL. This issue is fixed in version 
  7.0.2.
