title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix request buffer leak in smb2_new_read_req()\n\nsmb2_new_read_req() allocates
  the request buffer with\nsmb2_plain_req_init() but only publishes it to the caller
  with\n*buf = req at the very end of the function. Two error returns sit in\nbetween:\n\
  \n\trc = smb2_plain_req_init(SMB2_READ, io_parms->tcon, server,\n\t\t\t\t (void
  **) &req, total_len);\n\tif (rc)\n\t\treturn rc;\n\n\tif (server == NULL)\n\t\t\
  return -ECONNABORTED;\n\t[...]\n\t\trdata->mr = smbd_register_mr(server->smbd_conn,\n\
  \t\t\t\t\t     &rdata->subreq.io_iter,\n\t\t\t\t\t     true, need_invalidate);\n\
  \t\tif (!rdata->mr)\n\t\t\treturn -EAGAIN;\n\nOn either of them the buffer is neither
  released nor handed back, so\nit is leaked. The caller cannot clean up after it:
  smb2_async_readv()\ndoes 'goto out' on a non-zero return, which skips the\ncifs_small_buf_release(buf)
  at async_readv_out, and buf has not been\nassigned at that point in any case.\n\n\
  The write path has never had this problem. smb2_as"
