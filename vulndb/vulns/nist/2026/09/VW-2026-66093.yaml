title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/ism:
  folio_put() after error\n\ndmb->cpu_addr was allocated via folio_alloc(). Use folio_put()
  instead of\nkfree() in the error exit of ism_alloc_dmb() to avoid slab allocator\n\
  corruption.\n\nWhile at it, reset dmb->cpu_addr after folio_put to avoid unintentional
  UAF\nby future callers."
