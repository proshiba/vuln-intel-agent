title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenrisc:
  fix arbitrary kernel memory access via or1k_atomic syscall\n\nsys_or1k_atomic()
  (syscall 244 in the \"or1k\" ABI) takes two user\npointers, v1 and v2, and swaps
  the words they point to in hand-written\nassembly.\n\n    l.lwz   r29,0(r4)\n  \
  \  l.lwz   r27,0(r5)\n    l.sw    0(r4),r27\n    l.sw    0(r5),r29\n\nThe pointers
  are not checked with access_ok(). The four memory\naccesses also have no exception
  table entries.\n\nA caller passes a kernel address as either pointer, and the syscall\n\
  reads from and writes to it directly.\n\nThis gives an unprivileged process a kernel
  read/write primitive. It\noverwrites kernel data such as the sys_call_table, gaining
  code\nexecution in kernel context.\n\nCheck both pointers before entering the critical
  section. Add fixups\nfor the four memory accesses so faults on valid but unmapped
  user\naddresses return -EFAULT.\n\n[shorne@gmail.com: fix comment style]"
