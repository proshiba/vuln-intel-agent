title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  defer publishing granted locks to prevent UAF/double-free race\n\nIn smb2_lock(),
  mid-batch granted locks are published to connection-wide\n(conn->lock_list) and
  file-wide (fp->lock_list) lists immediately upon\nvfs_lock_file() success, while
  also remaining tracked on the stack-local\nrollback_list.\n\nIf a subsequent element
  in the same SMB2_LOCK request array fails\nvalidation or execution, the thread jumps
  to out: and walks\nrollback_list to undo previously granted locks. However, because
  the\ngranted lock was already published to conn->lock_list, a concurrent\nUNLOCK
  request on the same connection can find the lock object and\nkfree() it before the
  rollback loop executes.\n\nWhen the granting thread subsequently walks rollback_list,
  it\ndereferences and frees the already-freed ksmbd_lock structure, resulting\nin
  a Use-After-Free and Double-Free (on both ksmbd_lock and struct\nfile_lock).\n\n\
  Fix this by deferring the publicati"
