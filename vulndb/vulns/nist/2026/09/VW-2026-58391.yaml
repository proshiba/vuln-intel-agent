title: "In the Linux kernel, the following vulnerability has been resolved:\n\next2:
  Fix lost inode updates for IS_SYNC inodes\n\next2_setsize() and ext2_xattr_set2()
  had a construct like:\n\n\tif (IS_SYNC(inode)) {\n\t\tsync_inode_metadata(inode,
  1);\n\t} else {\n\t\tmark_inode_dirty(inode);\n\t}\n\nwhich leads to lost inode
  updates for IS_SYNC inodes because\nsync_inode_metadata() does anything only if
  the inode is already dirty\nand hence inode updates may be simply lost. Fix the
  problem by\nunconditionally marking the inode dirty and *then* call\nsync_inode_metadata()."
