title: surya 0.22.1 screenshot server contains an unauthenticated arbitrary file
  read vulnerability in the /info, /page, and /process routes that accept raw 
  file_path parameters. Attackers can read any image or PDF file on the host by 
  supplying arbitrary file paths to Image.open or pypdfium2.PdfDocument, 
  obtaining rendered contents as base64 and using /info as an existence oracle.
