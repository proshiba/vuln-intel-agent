title: The Co-Authors, Multiple Authors and Guest Authors in an Author Box with 
  PublishPress Authors plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via the ‘profile_fields_user_email_value_prefix’ parameter in all 
  versions up to, and including, 4.15.0 due to insufficient input sanitization 
  and output escaping. This makes it possible for authenticated attackers, with 
  Author-level access and above, to inject arbitrary web scripts in pages that 
  will execute whenever a user clicks on a link.
