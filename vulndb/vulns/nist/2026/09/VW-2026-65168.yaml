title: A weakness has been identified in Intelliants Subrion CMS up to 4.2.1. 
  This vulnerability affects the function iaUsers::authorize of the file 
  front/login.php of the component Login Page. This manipulation of the argument
  $_SERVER['HTTP_REFERER'] causes open redirect. The attack is possible to be 
  carried out remotely. The exploit has been made available to the public and 
  could be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
