title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1:
  create serial pool adding rdev to array with serialize_policy=1\n\nThe following
  bug has been observed with kernel 7.1.3 after adding a new\nrdev to an existing
  RAID1 array with serialize_policy enabled:\n\n  Oops: 0002 [#1]\n  CPU: 0 UID: 0
  PID: 19639 Comm: ext4lazyinit Not tainted 7.1.3-1-default\n  RIP: _raw_spin_lock_irqsave+0x27/0x50\n\
  \  CR2: 0000000000004960\n  Call Trace:\n   wait_for_serialization+0xb9/0x260 [raid1]\n\
  \   raid1_make_request+0x762/0xaff [raid1]\n   md_handle_request+0x1c9/0x2e0 [md_mod]\n\
  \nThe raid1.c code calls wait_for_serialization() if the MD_SERIALIZE_POLICY\nis
  set, and wait_for_serialization assumes that rdev->serial is\ninitialized. Normally
  this will be the case for arrays that have\nthe serialize_policy sysfs attribute
  set to 1.\n\nBut when a new rdev is added to an existing array in bind_rdev_to_array(),\n\
  the condition at mddev_create_serial_pool() causes creation of rdev->serial\nto
  be skipped. F"
