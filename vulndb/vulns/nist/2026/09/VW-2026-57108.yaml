title: GitPython before 3.1.60 fails to properly validate the git directory 
  location, allowing attackers to impersonate the git directory using tracked 
  files like gitdir, commondir, and HEAD. Attackers can execute arbitrary code 
  by placing a malicious pre-commit hook in the tracked hooks directory that 
  executes when a victim calls index.commit() on a cloned or opened repository.
