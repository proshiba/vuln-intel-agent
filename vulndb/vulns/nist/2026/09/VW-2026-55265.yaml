title: "A race condition vulnerability in Arm Ltd Bifrost GPU Kernel Driver, Arm Ltd
  Valhall GPU Kernel Driver, Arm Ltd Arm 5th Gen GPU Architecture Kernel Driver allows
  a local non-privileged user process to perform improper GPU memory processing operations
  to cause a denial of service or disclose sensitive information.\n\n\n\nThis issue
  affects Bifrost GPU Kernel Driver: from r12p0 through r49p5, from r50p0 through
  r51p0, from r54p1 through r54p2; Valhall GPU Kernel Driver: from r19p0 through r49p5,
  from r50p0 through r54p3, r55p0; Arm 5th Gen GPU Architecture Kernel Driver: from
  r41p0 through r49p5, from r50p0 through r54p3, r55p0."
