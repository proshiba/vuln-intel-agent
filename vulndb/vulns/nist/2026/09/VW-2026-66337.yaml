title: "RabbitMQ is a messaging and streaming broker. From 3.13.0 until 4.3.3, 4.2.9,
  4.1.14, 4.0.23, and 3.13.18, JWKS Fetch Ignores HTTP Response Status Code - Signing
  Key Destruction Causes Authentication DoS (CWE-252). the JWKS key fetching mechanism
  in uaajwt.erl does not validate the HTTP response status code when downloading signing
  keys from the OAuth2 provider's JWKS endpoint. Non-200 responses (including 4xx
  and 5xx errors) are processed identically to successful responses. When the JWKS
  endpoint returns an error response with a valid-JSON body that lacks a keys field,
  all previously cached signing keys are destroyed, causing a persistent authentication
  denial of Files: deps/rabbitmqauthbackendoauth2/src/uaajwt.erl, lines 50-63 deps/rabbitmqauthbackendoauth2/src/uaajwks.erl,
  lines 5-7 deps/rabbitmqauthbackendoauth2/src/rabbitoauth2provider.erl, lines 98-107
  Bug 1: HTTP status code ignored (uaajwt.erl:50-63): The Erlang httpc module returns
  {ok, {{HttpVersion, StatusCode, ReasonPhrase"
