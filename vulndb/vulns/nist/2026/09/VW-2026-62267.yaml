title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  detach blocked lock requests before freeing\n\nA file_lock retained by ksmbd for
  byte-range lock bookkeeping can still\nbe part of the VFS blocked-request graph.
  In particular, the VFS can\nchain a new waiter below an already blocked request
  through\nflc_blocked_requests. The ksmbd_file reference count does not cover that\n\
  graph.\n\nBoth __ksmbd_close_fd() and the cross-request unlock path free these\n\
  retained file_lock objects directly. If a dependent waiter is still\nattached, locks_release_private()
  hits\nBUG_ON(!list_empty(&flc->flc_blocked_requests)). The same lifetime\nmismatch
  can leave a freed ksmbd_lock reachable through its request-local\nllist.\n\nDetach
  the file_lock from the blocked-request graph before freeing it in\nthe close, cross-request
  unlock, and rollback paths. locks_delete_block()\nalso wakes requests chained below
  the object. Remove llist when a\ncompleted lock is published so a globally visible
  ksmbd_loc"
