title: A vulnerability was detected in valkey-io valkey up to 9.5.4/9.1.0. 
  Affected by this vulnerability is the function createSlotImportJob of the file
  src/cluster_migrateslots.c of the component Slot Migration. The manipulation 
  of the argument job_name results in out-of-bounds read. The attack can be 
  executed remotely. The exploit is now public and may be used. Upgrading to 
  version 9.0.5 and 9.1.1 addresses this issue. The patch is identified as 
  f4dc3ca09eb650c2fe14060090a41c524eca803f. Upgrading the affected component is 
  advised.
