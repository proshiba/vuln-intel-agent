title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  zynqmp_dma: fix race between runtime PM and device removal\n\nIn zynqmp_dma_remove(),
  runtime PM was disabled only after checking\nstate and doing a manual suspend. This
  can race with runtime PM in the\nremove/unbind (rmmod) path.\n\nDisable runtime
  PM first, then suspend only if the device is not already\nsuspended. To prevent
  any further runtime PM transitions."
