title: isomorphic-git before 1.42.0 contains a prototype pollution vulnerability
  in the getRemoteInfo function that allows a malicious Git server operator to 
  pollute Object.prototype by advertising crafted ref names containing 
  '__proto__' path segments during ref negotiation. Attackers controlling a Git 
  server can advertise a specially crafted ref such as '__proto__/corsProxy' to 
  reroute all subsequent network operations through an attacker-controlled 
  proxy, causing isomorphic-git to invoke the victim's onAuth callback and 
  transmit credentials to the attacker when the victim calls getRemoteInfo with 
  an attacker-supplied URL.
