title: Improper validation of non-secure (NS) pointers in multiple TrustZone-M 
  non-secure callable (NSC) entry functions allows an attacker executing in the 
  non-secure world to supply pointers to secure memory. The secure firmware 
  subsequently dereferences these attacker-controlled pointers without verifying
  that they reference non-secure memory, resulting in unintended disclosure of 
  secure memory contents. This violates the isolation guarantees provided by Arm
  TrustZone-M and can be leveraged as a memory disclosure or corruption 
  primitive that may enable recovery of sensitive cryptographic material.
