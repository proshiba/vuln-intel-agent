title: undici's BalancedPool constructor passes its entire options object 
  through an internal deep-clone that serializes and reparses the value as JSON.
  Because JSON cannot represent functions, any function-valued TLS option, such 
  as a caller-supplied checkServerIdentity callback or a custom connector inside
  the connect option, is silently discarded before it reaches the TLS layer. As 
  a result a peer whose certificate the application's custom checkServerIdentity
  was written to reject, but which still passes Node's default hostname and 
  chain checks, is accepted when reached through BalancedPool. The Client, Pool,
  and Agent dispatchers are not affected because they extract the connect and 
  tls options before cloning. This affects undici versions from 7.24.1 up to 
  7.29.1 and from 8.0.0 up to 8.10.2, and only when the application supplies a 
  function-valued connect or tls option to BalancedPool. Users should upgrade to
  undici 7.29.1 or 8.10.2.
