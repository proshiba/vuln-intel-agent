title: MaxKB is an open-source AI assistant for enterprise. Prior to version 
  2.10.6-lts, function-library code running under the LD_PRELOAD sandbox can 
  invoke ctypes.CDLL from an importlib.abc.MetaPathFinder callback so the dlopen
  call-stack heuristic sees a Python import frame, then use unhooked dlsym with 
  RTLD_NEXT to resolve glibc's real syscall and bypass the sandbox syscall 
  blacklist. An authenticated workspace member can consequently read or write 
  files, execute processes, or access networks as the sandbox user. This issue 
  is fixed in version 2.10.6-lts.
