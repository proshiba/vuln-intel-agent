title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  cap tx_queue_len at S16_MAX to prevent oversized ring allocations\n\nSeveral subsystems
  allocate ring buffers sized by dev->tx_queue_len\nwith no upper bound. An unprivileged
  user (via unshare -Urn) can set a\nhuge tx_queue_len and exhaust global memory with
  ring allocations:\n\n- pfifo_fast: pfifo_fast_init() and pfifo_fast_change_tx_queue_len()\n\
  \  allocate 3 skb_array rings of tx_queue_len entries each.\n- tun: tun_queue_resize()
  and the queue-attach path resize ptr_rings\n  to tx_queue_len on the NETDEV_CHANGE_TX_QUEUE_LEN
  notifier.\n- tap (macvtap/ipvtap): tap_queue_resize() and tap_init() resize/init\n\
  \  ptr_rings to tx_queue_len on the same notifier.\n\nnetif_change_tx_queue_len()
  is the single entry point for IFLA_TXQLEN,\nsysfs, and the SIOCSIFTXQLEN ioctl.
  Cap new_len at S16_MAX (32767)\nthere so the oversized value is rejected at set
  time. This takes\neffect whether the device is up or down, before dev->tx_queue_len
  is\n"
