title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  validate symlink target length in NFSv4 CREATE\n\nnfsd4_decode_create() accepts
  an unbounded cr_datalen from the wire for\nNF4LNK symlink targets, allowing a client
  to force a kmalloc of up to\nthe maximum RPC payload size (several MiB) per COMPOUND
  op that persists\nuntil compound teardown.  The VFS rejects oversized targets with\n\
  ENAMETOOLONG, but the allocation has already occurred.\n\nReject cr_datalen == 0
  early with nfserr_inval and cr_datalen greater\nthan NFS4_MAXPATHLEN (PATH_MAX)
  with nfserr_nametoolong to bound the\nallocation."
