title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatchdog:
  msc313e: Fix clock leak and spurious timer in settimeout()\n\nmsc313e_wdt_settimeout()
  unconditionally calls msc313e_wdt_start() which\nintroduces two severe bugs:\n\n\
  1. If the watchdog is already active, calling start() again will\n   increase the
  reference count of the clock again.  However stop() is\n   only called once, the
  reference count is unbalance.\n2. If the watchdog is stopped, calling settimeout()
  will start\n   the hardware timer accidentally.\n\nFactor out the register-writing
  logic into a helper function.  Only call\nit in settimeout() if the watchdog is
  running.  Otherwise, simply update\n`wdev->timeout`."
