title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  do not use make_bad_inode() in ocfs2_read_inode_block_full()\n\nThis reverts commit
  58b6fcd2ab34 (\"ocfs2: mark inode bad upon validation\nfailure during read\").\n\
  \nSince 'make_bad_inode()' resets inode type to S_IFREG, doing this for\ndirectory
  inode during active VFS lookup is likely to confuse the latter,\nincluding VFS_BUG_ON_INODE()
  triggered in this case."
