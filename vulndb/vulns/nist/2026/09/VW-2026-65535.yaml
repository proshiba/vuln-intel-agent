title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/pm:
  bound pp_dpm_set_pp_table() memcpy\n\nThe powerplay path allocates hardcode_pp_table
  once with kmemdup(...,\nsoft_pp_table_size). memcpy(..., size) used the sysfs store
  count (up to\nPAGE_SIZE) with no upper bound, causing heap overflow. Reject\nwrites
  where size exceeds soft_pp_table_size."
