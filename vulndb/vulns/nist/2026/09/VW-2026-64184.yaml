title: The WP Yelp Review Slider plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Yelp Review Text (imported via 
  wpyelp_download_source) in all versions up to, and including, 9.2 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. The malicious payload 
  originates from an anonymous Yelp reviewer on a public platform and requires 
  no WordPress account; it is introduced into the database during the site 
  administrator's ordinary use of the plugin's Download Reviews feature, making 
  the effective attacker unauthenticated.
