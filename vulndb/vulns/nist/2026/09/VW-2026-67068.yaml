title: 'A security vulnerability has been detected in zhistaredu StarTraining up to
  3.8.1. This issue affects some unknown processing of the file application.yml. Such
  manipulation of the argument xss.enabled leads to cross site scripting. It is possible
  to launch the attack remotely. Attacks of this nature are highly complex. The exploitability
  is assessed as difficult. The exploit has been disclosed publicly and may be used.
  Not independently exploitable: a defense-in-depth absence that amplifies CVE-2026-100880.
  The vendor was contacted early about this disclosure but did not respond in any
  way.'
