title: A weakness has been identified in Omega Solution HRM OS up to 20260717. 
  This affects an unknown function of the file /role-permission/permission of 
  the component Role Permission API. Executing a manipulation of the argument 
  roleId can lead to missing authentication. The attack may be launched 
  remotely. The exploit has been made available to the public and could be used 
  for attacks. The vendor was contacted early about this disclosure but did not 
  respond in any way.
