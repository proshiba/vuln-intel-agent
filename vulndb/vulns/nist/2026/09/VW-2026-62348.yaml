title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Release the export reference when reaping open stateids\n\nnfs4_put_stid() releases
  the svc_export tracked in\nnfs4_stid.sc_export, but free_ol_stateid_reaplist() frees
  open and\nlock stateids by calling ->sc_free() directly, bypassing that path.\n\
  An open stateid takes an sc_export reference in nfs4_open() and a\nlock stateid
  takes its own in init_lock_stateid(); both reach\nfree_ol_stateid_reaplist() through
  their normal teardown, the open\nstateid via release_open_stateid() and the lock
  stateid via\nnfsd4_release_lockowner(), each through put_ol_stateid_locked().\n\
  The reference is therefore never dropped, pinning the export and\nblocking unmount
  for the lifetime of the stateid.\n\nRelease sc_export in free_ol_stateid_reaplist()
  the way\nnfs4_put_stid() does. ->sc_free() runs once per stateid, and a\nstateid
  reaches free_ol_stateid_reaplist() or nfs4_put_stid() but\nnever both, so the reference
  is dropped exactly once. Revoked"
