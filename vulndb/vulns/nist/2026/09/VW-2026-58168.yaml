title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  pcxhr: initialize mutexes before requesting threaded IRQ\n\npcxhr_probe() requests
  pcxhr_threaded_irq() before initializing\nmgr->lock, even though the threaded handler
  takes that mutex.\n\nInitialize the manager locks before request_threaded_irq()
  so an\nearly interrupt cannot run against uninitialized mutex state during\nprobe."
