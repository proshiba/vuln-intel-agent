title: A vulnerability has been found in Abdurrab5 online-makeup-store. Affected
  is the function confirm_logged_in/confirm_user of the file functions.php of 
  the component Admin Handler. Such manipulation of the argument adminid leads 
  to missing authorization. The attack may be performed from remote. The exploit
  has been disclosed to the public and may be used. This product utilizes a 
  rolling release system for continuous delivery, and as such, version 
  information for affected or updated releases is not disclosed. The vendor was 
  contacted early about this disclosure.
