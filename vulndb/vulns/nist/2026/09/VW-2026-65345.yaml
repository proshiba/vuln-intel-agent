title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclocksource/drivers/timer-sun4i:
  Advertise a real minimum delta\n\nsun4i_clkevt_next_event() compensates for the
  timer stop/start\nsynchronization delay by programming evt - TIMER_SYNC_TICKS into
  the\nhardware interval register. The clockevent device currently advertises\nTIMER_SYNC_TICKS
  as min_delta_ticks, so the clockevents core is allowed\nto call set_next_event()
  with evt == TIMER_SYNC_TICKS.\n\nThat programs a zero-tick interval. With oneshot/highres/nohz
  timer\noperation this can leave the next event stuck, which was observed as a\n\
  boot hang on Allwinner D1 after the clockevents core started reusing\nforced minimum-delta
  events.\n\nAdvertise one extra tick instead, so the smallest event accepted by the\n\
  core still programs at least one hardware tick after the synchronization\ncompensation."
