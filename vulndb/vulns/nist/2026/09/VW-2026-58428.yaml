title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: clear setuid/setgid bit on write with cifsacl/modefromsid/posix extensions\n\
  \nWhen a file has the setuid or setgid bit set and is written to, the VFS\nstrips
  those bits and issues a setattr with ATTR_KILL_SUID/ATTR_KILL_SGID\ntogether with
  an ATTR_MODE carrying the already-cleared mode.\n\nBoth cifs_setattr_unix() and
  cifs_setattr_nounix() unconditionally dropped\nATTR_MODE in that case:\n\n\t/* skip
  mode change if it's just for clearing setuid/setgid */\n\tif (attrs->ia_valid &
  (ATTR_KILL_SUID|ATTR_KILL_SGID))\n\t\tattrs->ia_valid &= ~ATTR_MODE;\n\nThis is
  fine for the default mount, where the mode is only emulated via\nthe DOS read-only
  attribute and cannot represent the setuid/setgid bits\nanyway.  However, with the
  \"cifsacl\" or \"modefromsid\" mount options the\nmode is stored on the server through
  an ACL (id_mode_to_cifs_acl()), with\nthe SMB3.1.1 POSIX extensions the mode is
