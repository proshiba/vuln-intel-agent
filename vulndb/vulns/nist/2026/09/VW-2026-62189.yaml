title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fix a resource leak in copy_net_ns() error handling path\n\nCurrently, preinit_net()
  does two things:\n\n  (1) call ns_common_init() which might fail\n  (2) initialize
  resources which does not fail\n\nHowever, preinit_net() is returning early when
  (1) fails, and copy_net_ns()\nis jumping to the dec_ucounts: label. As a result,
  resources allocated by\nnet_alloc() are leaking. We need to call key_remove_domain()
  and\nnet_passive_dec() in order to release resources allocated by net_alloc().\n\
  \nWe cannot simply jump to the put_userns: label when preinit_net() failed,\nfor
  (2) is not yet done. But we can reorder (1) and (2), for there is no\ndependency
  between (1) and (2). Therefore, this patch decouples (1) from\npreinit_net() and
  changes preinit_net() back to a void function, and calls\nns_common_init() after
  preinit_net() succeeded. Then, we can jump to\nimmediately after ns_common_free()
  of the put_userns: label."
