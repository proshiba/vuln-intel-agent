title: sprintf-js through 1.1.3 passes unbounded precision specifiers to 
  toFixed, toExponential, and toPrecision methods without validation, causing 
  uncaught RangeError exceptions. Attackers who control format strings can 
  inject precision values exceeding ECMAScript limits to abort calling 
  operations with minimal payload.
