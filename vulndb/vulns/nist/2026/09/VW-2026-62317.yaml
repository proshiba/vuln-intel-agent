title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  validate orphan slot during inode read\n\nPatch series \"ocfs2: validate active
  orphan slots during inode read\".\n\nOCFS2 trusts active ordinary and append-DIO
  orphan slots read from dinodes.\nA corrupted slot can therefore index osb_orphan_wipes
  or the slot-local\nsystem-inode cache outside their allocations before the corruption
  is\nreported.\n\nPatch 1 validates the ordinary orphan slot used by inode wipe processing.\n\
  Patch 2 validates the append-DIO orphan slot used by DIO completion and\norphan
  recovery.  Both checks reject corrupt metadata at the existing inode\nvalidation
  boundary.\n\n\nThis patch (of 2):\n\n[BUG]\nA corrupted dinode with OCFS2_ORPHANED_FL
  can carry an\ni_orphaned_slot outside the mounted filesystem slot range.\nocfs2_wipe_inode()
  uses it to index osb_orphan_wipes before looking\nup the orphan directory, causing
  an out-of-bounds memory access.\n\nBUG: KASAN: slab-use-after-free in ocfs2_get_system_file_inode+0x"
