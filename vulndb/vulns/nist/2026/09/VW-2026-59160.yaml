title: In Eclipse Ankaios versions 0.1.0 through 1.0.2, the agent creates 
  workload files and Control Interface named pipes (FIFOs) under a predictable 
  path derived from the agent name and a hash of the workload's runtime 
  configuration. If a directory or FIFO already exists at that path when the 
  agent (re)starts, the agent reuses it based only on an existence and/or 
  file-type check, without validating its owner or permissions. A local, 
  unprivileged user with write access to the same base directory (by default 
  under `$TMPDIR/ankaios`, e.g. shared `/tmp`) can pre-create this path 
  hierarchy, including the two Control Interface FIFOs, before the agent starts.
