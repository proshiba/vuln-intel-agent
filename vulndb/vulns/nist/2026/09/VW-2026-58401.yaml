title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  validate non-resident attribute offsets\n\nntfs_attr_update_meta() shifts the attribute
  name when converting between\nnon-sparse and sparse attributes. Converting to sparse
  also adds the\ncompressed_size field before the name and mapping pairs, requiring
  eight\nadditional bytes in the attribute record.\n\nHowever, the validator does
  not check that name_offset is within safe\nboundaries for these operations or that
  the additional space is available.\nA malicious MFT record could set name_offset
  such that:\n\n1. The name is positioned at the very end of a non-sparse attribute.\n\
  \   Converting to sparse would shift the name forward by 8 bytes,\n   writing beyond
  the attribute boundary.\n\n2. The name overlaps with the mapping pairs, causing
  corruption during\n   conversion.\n\nAdd validation to ensure:\n- For named attributes,
  name_offset is within valid bounds\n- Name does not extend beyond the attribute
  or overlap with mapping pairs\n"
