title: An authorization flaw in the REST API repository details endpoint (GET 
  /service/rest/v1/repositories/{repositoryName}) in Sonatype Nexus Repository 3
  allowed an account holding read or browse permission on a group repository to 
  retrieve metadata for member repositories on which it held no direct 
  permission, by requesting the endpoint directly for the member repository 
  name. For proxy repositories, the disclosed metadata includes the configured 
  remote URL, which may reveal internal upstream hostnames. This includes the 
  anonymous user if it has been granted this permission; whether the anonymous 
  user holds this permission depends on the role and permission configuration of
  the specific installation.
