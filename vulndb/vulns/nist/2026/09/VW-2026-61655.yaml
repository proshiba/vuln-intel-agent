title: A vulnerability was determined in GPAC 26.07.0. This affects the function
  rmt_client_handle_ws_frame of the file src/utils/rmt_ws.c of the component 
  WebSocket Handler. Executing a manipulation of the argument payload_size can 
  lead to heap-based buffer overflow. It is possible to launch the attack 
  remotely. The exploit has been publicly disclosed and may be utilized. 
  Upgrading to version abi-16.26 is able to mitigate this issue. This patch is 
  called 37bccbb30cf53a0e1a084cea9a1ce422b3ddfe12. Upgrading the affected 
  component is recommended.
