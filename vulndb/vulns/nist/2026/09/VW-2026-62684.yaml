title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  qcom-geni: do not advance stale DMA completions\n\nThe qcom GENI serial DMA TX completion
  path advances the transmit fifo by\nthe number of bytes recorded in port->tx_remaining.\n\
  \nIf uart_flush_buffer() runs after the hardware has completed a DMA\ntransfer but
  before the DMA completion interrupt has been handled, the\nserial core resets the
  transmit fifo while port->tx_remaining still\ndescribes the old DMA transfer.\n\n\
  A previous fix avoided advancing an empty fifo by checking that the fifo\nlength
  is at least tx_remaining. That still does not distinguish the old\nDMA payload from
  new bytes written after the flush. If userspace writes\nnew data before the stale
  DMA completion interrupt is handled, the fifo\ncan again contain at least tx_remaining
  bytes and the stale completion\ncan advance and discard those new bytes.\n\nMark
  an in-flight DMA transfer stale when the transmit fifo is flushed.\nThe later completion
  still unprep"
