title: A security vulnerability has been detected in SabyasachiRana WebMap up to
  8b95fe4dc301a3c09ddf145b895de0bf9f8d2a25. This affects the function 
  nmap_newscan of the file functions_nmap.py of the component New Nmap Scan 
  Handler. Such manipulation of the argument target/params leads to os command 
  injection. The attack may be launched remotely. The exploit has been disclosed
  publicly and may be used. The name of the patch is 
  3d52f65803a2716bff14d938352c6fef45b0cfb6. A patch should be applied to 
  remediate this issue. This issue got fixed with a silent patch.
