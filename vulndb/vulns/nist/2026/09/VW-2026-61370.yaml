title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Have show_event_filters/triggers files take trace array ref\n\nThe newly added files
  show_event_filters and show_event_triggers that show\nall filters or triggers that
  are set within the trace array do not take a\nreference for the trace array it is
  showing. Without taking a reference,\nthe trace_array may be freed via \"rmdir\"\
  \ while a task is reading one of\ntheses files. Those files iterate all the events
  within an instance\n(trace_array) and nothing prevents that instance from being
  freed while\nits data is being read. This causes a use-after-free crash.\n\nHave
  the open of both those files take the trace_array reference via the\ntrace_array_get()
  that prevents the trace_array from being freed while the\nfiles are opened."
