title: A vulnerability was detected in Freedesktop Poppler 26.07.0. This issue 
  affects the function SampledFunction::SampledFunction of the file 
  poppler/Function.cc of the component SampledFunction. The manipulation of the 
  argument BitsPerSample results in integer overflow. The attack may be 
  performed from remote. The exploit is now public and may be used. The project 
  was informed of the problem early through a bug report but has not responded 
  yet.
