title: 'A vulnerability was identified in Advantech WISE-6610-NB, WISE-6610-EB, WISE-6610-TB,
  WISE-6610-JB, WISE-6610-CB, WISE-6610-EL-NB, WISE-6610-EL-EB, WISE-6610-EL-TB, WISE-6610-EL-JB,
  WISE-6610-EL-CB, WISE-6610P-DEA, WISE-6610P-DNA and WISE-6610P-DTA 1.2.1_20251110.
  Affected is an unknown function of the file /cgi-bin/luci/admin/openvpn_apply of
  the component Background Management. Such manipulation of the argument delete_file
  leads to os command injection. The attack can be executed remotely. The exploit
  is publicly available and might be used. Upgrading to version 1.2.4_20260821 is
  able to address this issue. It is advisable to upgrade the affected component. The
  vendor explains: "The delete operation has been redesigned to map the requested
  file type to a fixed allowlisted path, require a numeric tunnel ID, reject invalid
  requests, and use the native filesystem API (fs.unlink) instead of constructing
  a shell command from request data."'
