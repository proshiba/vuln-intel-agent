title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a missing authorization vulnerability in playlistsFromUser.json.php 
  that allows unauthenticated attackers to read private playlists by requesting 
  another user's identifier. Attackers can retrieve Favorite and Watch Later 
  playlists belonging to other users due to improper cache keying that conflates
  requests across different user contexts.
