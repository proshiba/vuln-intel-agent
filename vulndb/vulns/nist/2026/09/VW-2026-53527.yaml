title: "The API Publisher component previously used a non-cryptographic pseudorandom
  number generator (PRNG) to create shared secrets for Webhook HMAC validation. This
  PRNG lacks sufficient entropy for security-sensitive operations, allowing a sophisticated
  attacker to predict future secrets. This enables malicious actors to forge event
  payloads with valid HMAC signatures, bypassing the API Gateway's authenticity verification.\n\
  \nSuccessful exploitation could allow an attacker to predict shared secrets used
  for Webhook HMAC validation and forge event payloads with valid signatures. This
  may enable bypassing API Gateway authenticity checks, leading to unauthorized event
  injection, data manipulation, or downstream system compromise."
