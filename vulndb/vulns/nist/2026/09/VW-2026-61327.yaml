title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  skip the zoned limits update if the zone info query failed\n\nnvme_query_zone_info()
  returns either a negative errno or a positive\nNVMe status code, but nvme_update_ns_info_block()
  only tests for the\nnegative case:\n\n\tret = nvme_query_zone_info(ns, lbaf, &zi);\n\
  \tif (ret < 0)\n\t\tgoto out;\n\nIf the device fails the Identify Namespace (I/O
  Command Set specific)\ncommand, or the Identify Controller command issued by\nnvme_set_max_append(),
  the positive status falls through and setup\ncontinues with the zero-initialized
  zone info.  nvme_update_zone_info()\nthen marks the queue zoned with chunk_sectors
  and ns->head->zsze set to\nzero.\n\nblk_validate_zoned_limits() does not check chunk_sectors,
  so the limits\ncommit succeeds.  blk_revalidate_disk_zones() does reject the zero
  zone\nsize, but by then the limits are live and nothing rolls them back, so\nI/O
  keeps being submitted to a zoned queue with a zero zone size and\ndisk_zone_no() "
