title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix recursive ww_mutex acquire in amdgpu_devcoredump_format\n\nWhen dumping IB contents
  from a hung job, amdgpu_devcoredump_format()\nacquired the VM root PD's reservation
  via amdgpu_vm_lock_by_pasid() and\nthen, for each IB, called amdgpu_bo_reserve()
  on the BO backing the IB.\nBoth reservations are reservation_ww_class_mutex objects
  and neither\nused a ww_acquire_ctx, which trips lockdep:\n\n  WARNING: possible
  recursive locking detected\n  --------------------------------------------\n  kworker/u128:0
  is trying to acquire lock:\n  ffff88838b16e1f0 (reservation_ww_class_mutex){+.+.}-{4:4},\n\
