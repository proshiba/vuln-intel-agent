title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  roccat: free buffered reports when destroying device\n\nroccat_report_event() duplicates
  each report with kmemdup() and stores\nthe allocation in a circular-buffer slot.
  The allocation is released only\nwhen that slot is reused.\n\nThe device destruction
  paths free struct roccat_device without releasing\nreports still stored in cbuf[].
  This makes those allocations unreachable\nand leaks up to ROCCAT_CBUF_SIZE report
  buffers per device.\n\nAdd a small destructor that frees every buffered report before
  freeing the\ndevice, and use it in both paths that can destroy a registered device."
