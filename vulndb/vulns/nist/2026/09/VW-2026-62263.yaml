title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4:
  remove callback IDR entry on client allocation failure\n\nnfs4_alloc_client() allocates
  an NFSv4.0 callback identifier before it\nfinishes setting up the client. If any
  later initialization step fails,\nthe error path frees the nfs_client directly with
  nfs_free_client(). That\nbypasses nfs_put_client(), which is where the callback
  IDR entry is\nremoved during normal teardown.\n\nA failed allocation can therefore
  leave cb_ident_idr pointing at a freed\nnfs_client. A later NFSv4.0 callback lookup
  by cb_ident would find the\nstale pointer and take a reference to it.\n\nMake the
  callback IDR removal helper callable by the allocation failure\npath, and remove
  the callback identifier before freeing the client.\n\nThis was found by a local
  static-analysis checker for publish-before-free\nlifetime bugs and confirmed by
  manual inspection."
