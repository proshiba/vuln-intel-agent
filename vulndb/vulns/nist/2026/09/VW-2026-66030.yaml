title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/intel:
  Prevent drain_pebs() reentry\n\nThe PEBS buffer is shared by all events on a CPU,
  so drain_pebs() must\nnot be reentered. If so, one instance may observe stale buffer
  state and\npotentially access out-of-bound memory.\n\nMost invocations happen in
  NMI context, which naturally prevents reentry.\nHowever, drain_pebs() is also reachable
  from process context via\nintel_pmu_drain_pebs_buffer().\n\nIn those paths, the
  PMU is often already disabled, but not guaranteed.\nFor example, __intel_pmu_pebs_disable()
  only disables the target counter,\nso other active counters can still raise a PMI
  and interrupt an in-flight\ndrain_pebs(). Here is an example,\n\n__perf_addr_filters_adjust()\n\
  \  perf_event_stop()\n    __perf_event_stop()\n      x86_pmu_stop() (event->pmu->stop)\n\
  \        intel_pmu_disable_event()\n          intel_pmu_pebs_disable()\n       \
  \     __intel_pmu_pebs_disable()\n              intel_pmu_drain_large_pebs()\n \
  \          "
