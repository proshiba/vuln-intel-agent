title: "Affected versions of MISP’s interactive CLI shell implement access control
  independently from the normal web application, causing several authorization inconsistencies.\n\
  \n\nThe patch shows that CLI access could differ from the web application in multiple
  security-sensitive areas:\n\n - feed listings did not enforce the same lookup_visible
  restrictions for non-host-organisation users;\n - feed detail access did not enforce
  the same host-organisation/site-admin authorization as FeedsController::view();\n\
   - Feed.headers, which can contain HTTP authorization credentials, could be exposed
  instead of being hidden or masked;\n - server synchronization authkey values were
  not explicitly hidden from CLI detail output;\n - sharing-group detail access did
  not consistently use SharingGroup::checkIfAuthorised();\n - the use command could
  establish context for a record without first proving that the user was authorized
