title: A vulnerability was identified in java-json-tools json-patch up to 1.13. 
  This affects the function CopyOperation.apply/MoveOperation.apply of the file 
  src/main/java/com/github/fge/jsonpatch/CopyOperation.java of the component 
  Copy Move Operations. The manipulation leads to improper access controls. 
  Remote exploitation of the attack is possible. The exploit is publicly 
  available and might be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
