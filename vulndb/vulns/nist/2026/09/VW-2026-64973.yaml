title: Formie is a Craft CMS plugin for creating forms. Prior to 2.2.23 and 
  3.1.31, Formie's formie/sent-notifications/get-resend-modal-content control 
  panel action in SentNotificationsController::actionGetResendModalContent 
  accepts a request-supplied notification ID without permission or object-level 
  authorization checks. Any authenticated user able to invoke the action can 
  enumerate notification IDs and read recipient headers and complete HTML email 
  bodies containing submitted form data, even without the sent-notification 
  viewing permission. This issue is fixed in versions 2.2.23 and 3.1.31.
