title: "Grafana OSS and Grafana Enterprise did not safely resolve symbolic links when\n\
  extracting plugin archives. A crafted plugin archive can chain relative symbolic
  link\nentries to escape the plugin installation directory, writing arbitrary files
  and an\nexecutable backend binary outside that directory. The dropped executable
  runs with the\nprivileges of the Grafana server process, resulting in remote code
  execution.\n\nPlugin archives are extracted before their signature is verified,
  so a valid plugin\nsignature does not prevent the write. An operator can therefore
  be affected by\ninstalling a plugin that appears legitimate, as well as by installing
  a plugin from an\narbitrary archive using grafana-cli, the GF_INSTALL_PLUGINS environment
  variable, or\npreinstall configuration.\n\nGrafana Enterprise is affected because
  it includes the same plugin extraction code as\nGrafana OSS."
