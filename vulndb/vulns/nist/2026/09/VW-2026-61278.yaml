title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Take srcu when importing watchpoint data\n\n__import_wp_info() backs up the
  original guest memory contents of a\nwatchpoint with read_guest_abs(), which is
  kvm_read_guest() and therefore\nresolves the memslot via __kvm_memslots(). That
  requires kvm->srcu (or\nkvm->slots_lock) to be held, otherwise a concurrent memslot
  update can\nfree the memslots array under us once its SRCU grace period has elapsed.\n\
  \nAs this is not fast path, following lock ordering (mutex first, then\nsrcu) take
  the big hammer and hold the srcu for the full import."
