title: Improper Restriction of Excessive Authentication Attempts in the 
  administration login of pH7Software pH7Builder (pH7 Social Dating CMS) through
  19.2.0. The CAPTCHA escalation flag is stored in the PHP session as 
  captcha_admin_enabled and the CAPTCHA form element is only built when that 
  flag is present, so a remote unauthenticated attacker who obtains a new 
  session before each login attempt is never presented with the challenge.
