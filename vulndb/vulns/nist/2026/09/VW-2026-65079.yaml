title: A vulnerability was found in sfturing hosp_order up to 
  627f426331da8086ce8fff2017d65b1ddef384f8. This issue affects the function 
  getProperties of the file 
  ssm_pro/src/main/java/cn/sfturing/utils/MailUtil.java. Performing a 
  manipulation results in cleartext transmission of sensitive information. The 
  attack can be initiated remotely. The complexity of an attack is rather high. 
  The exploitability is assessed as difficult. The exploit has been made public 
  and could be used. Continious delivery with rolling releases is used by this 
  product. Therefore, no version details of affected nor updated releases are 
  available. The project was informed of the problem early through an issue 
  report but has not responded yet.
