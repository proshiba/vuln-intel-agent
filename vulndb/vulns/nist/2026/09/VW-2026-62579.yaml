title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix potential use after free in ib_dealloc_pd_user()\n\nWhen accessing a PD via
  the netlink path the only synchronization\nmechanism for the said PD is rdma_restrack_get().\n\
  Currently, rdma_restrack_del() is invoked at the end of\nib_dealloc_pd_user(), which
  is too late, since by that point\nvendor-specific resources associated with the
  PD might already be\nfreed. This can leave a short window where the PD remains accessible\n\
  through restrack, leading to a potential use-after-free.\n\nFix this by moving the
  rdma_restrack_begin_del() call to the start of\nib_dealloc_pd_user(), ensuring that
  the PD is removed from restrack\nbefore its internal resources are released. This
  guarantees that no new\nusers hold references to a PD that is in the process of
  destruction.\n\nIn addition, this change preserves the intended inverted order\n\
