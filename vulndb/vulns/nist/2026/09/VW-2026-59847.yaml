title: An issue was discovered in Keyfactor SignServer before 7.6.0. The 
  attribute ATTRIBUTESFILE in PKCS11CryptoToken can be set to a readable file 
  but not an accepted file (i.e., recognized with attributes). In this case, an 
  error is thrown which - together with the error - also prints the content of 
  the file to the application server log. This gives a user that has both 
  SignServer admin access and access to read the output of the server log (i.e.,
  if remote syslog shipping is configured), the possibility to read the content 
  of files accessible by the local user JBoss.
