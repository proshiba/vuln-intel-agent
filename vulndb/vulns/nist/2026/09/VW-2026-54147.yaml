title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/ionic:
  avoid OOB TX partner lookup for hwstamp RXQ\n\nThe dedicated hardware timestamp
  RX queue is allocated with q->index\nequal to lif->ionic->nrxqs_per_lif. The normal
  txqcqs array only\ncontains the regular queue pairs, so using that index to set
  rxq->partner\ncan read one entry past txqcqs[] and then write through the derived\n\
  pointer.\nOnly link RX/TX partners for normal queue-pair indexes. Leave the hwstamp\n\
  RX queue unpaired, and make the XDP_TX path abort cleanly if an RX queue\nhas no
  TX partner."
