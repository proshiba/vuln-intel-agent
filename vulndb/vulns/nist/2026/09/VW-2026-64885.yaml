title: Missing upper bound on the key derivation iteration count accepted during
  SCRAM authentication to a backend server in PgBouncer through 1.25.2 allows a 
  malicious or compromised PostgreSQL backend to cause uncontrolled CPU 
  consumption in PgBouncer. The resulting key derivation cannot be interrupted 
  in frontend builds such as PgBouncer. Because PgBouncer serves all clients 
  from a single process, one backend can in this way stop it from serving 
  traffic for every other database and client it is pooling, so the failure of a
  single backend is not contained.
