title: A vulnerability was detected in Tonec Internet Download Manager up to 
  6.42 Build 63 on Windows. The impacted element is an unknown function of the 
  file idmwfp.sys of the component Kernel Driver. The manipulation results in 
  improper access controls. Attacking locally is a requirement. Internet 
  Download Manager for Windows up to and including 6.42 Build 63 installs 
  idmwfp.sys, a Windows kernel driver that exposes the \.\IDMWFP device 
  interface to authenticated local users. The device object is created with an 
  access control descriptor equivalent to D:P(A;;GA;;;AU), granting 
  Authenticated Users generic access to the driver. The driver's IOCTL 0x12C028 
  handler accepts registry-operation subcommands 0x0C through 0x0F and processes
  caller-controlled registry paths and values. These handlers do not 
