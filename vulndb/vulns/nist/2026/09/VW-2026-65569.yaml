title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrds:
  filter RDS_INFO_* getsockopt by caller's netns\n\nThe RDS_INFO_* family of getsockopt(2)
  options reads several\nfile-scope global lists that are not per-netns:\n\n  rds_sock_info
  / rds6_sock_info,\n  rds_sock_inc_info / rds6_sock_inc_info        -> rds_sock_list\n\
  \  rds_tcp_tc_info / rds6_tcp_tc_info            -> rds_tcp_tc_list\n  rds_conn_info
  / rds6_conn_info,\n  rds_conn_message_info_cmn (for the *_SEND_MESSAGES and\n  *_RETRANS_MESSAGES
  variants),\n  rds_for_each_conn_info (for RDS_INFO_IB_CONNECTIONS)\n           \
  \                                     -> rds_conn_hash[]\n\nThe handlers do not
  filter by the caller's network namespace.\nrds_info_getsockopt() has no netns or
  capable() check, and\nrds_create() has no capable() check, so AF_RDS is reachable
  from\nan unprivileged user namespace. As a result, an unprivileged\ncaller in a
  fresh user_ns plus netns can read the bound address\nand sock inode of every RDS
  socket on the hos"
