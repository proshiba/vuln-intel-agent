title: xmldom is a pure JavaScript W3C standard-based (XML DOM Level 2 Core) 
  DOMParser and XMLSerializer module. From 0.9.0-beta.1 until 0.9.12, HTML-mode 
  parsing through DOMParser.parseFromString() mishandles a mixed-case closing 
  tag for the script, style, textarea, or title raw-text elements. 
  parseHtmlSpecialContent, selected by isHTMLRawTextElement or 
  isHTMLEscapableRawTextElement, uses a case-sensitive indexOf() and then calls 
  substring() with a missing-close result of negative one, causing unstable 
  parser progression and quadratic output amplification. A small untrusted 
  text/html document can consequently consume disproportionate CPU and memory 
  when parsed and serialized. This issue is fixed in @xmldom/xmldom version 
  0.9.12.
