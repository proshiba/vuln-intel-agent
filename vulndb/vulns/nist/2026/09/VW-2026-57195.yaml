title: Rara One Click Demo Import plugin for WordPress before 1.3.5 contains an 
  arbitrary file upload vulnerability that allows authenticated attackers with 
  Administrator privileges to upload arbitrary PHP files by passing a false 
  value to wp_handle_upload() that disables WordPress core's file type 
  validation checks across all three file parameters in the 
  process_uploaded_files() function. Attackers can upload a malicious PHP file 
  to the uploads directory and execute it over HTTP to achieve remote code 
  execution in the web server process, with the uploaded file persisting on disk
  even after plugin deactivation and leaving no media library record to evade 
  standard integrity checks.
