title: Nexus Repository 3 contains a sensitive information disclosure 
  vulnerability in the capability read API. An account holding the 
  nexus:capabilities:read privilege can retrieve the plaintext shared secret 
  configured on a webhook capability, which is intended to be masked from all 
  API responses. This issue affects Nexus Repository 3 versions 3.2.0 through 
  3.95.x, and is fixed in version 3.96.0.
