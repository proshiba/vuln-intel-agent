title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  check truncate permission under inode lock\n\nnfsd_setattr() checks whether a size
  update needs NFSD_MAY_TRUNC\nbefore it takes inode_lock(). The comparison uses the
  file size sampled\nby that unlocked read, but the actual ATTR_SIZE update is applied
  later\nunder inode_lock() by notify_change().\n\nThis leaves a TOCTOU window for
  append-only files. If a client sends a\nSETATTR that does not shrink the file at
  the time of the unlocked\nsample, a concurrent append can extend the file before
  nfsd_setattr()\ntakes inode_lock(). notify_change() then applies a real truncation\n\
  without the NFSD_MAY_TRUNC check that rejects IS_APPEND(inode). The VFS\ntruncate
  syscall paths perform their own append-only checks before\ncalling notify_change(),
  so NFSD must make this decision against the\nlocked size it is about to change.\n\
  \nSplit the write-count acquisition from the truncation permission check.\nKeep
  get_write_access() before the locked "
