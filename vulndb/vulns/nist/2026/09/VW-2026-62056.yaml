title: vm2 before 3.11.8 contains an incomplete fix for Error.cause sanitization
  that allows sandbox escape when revisited host-wrapped AggregateError objects 
  are caught within a single exception handler traversal. Attackers can exploit 
  cycle detection bypass in handleException to access unsanitized host proxies 
  embedded in the errors array, enabling full remote code execution and process 
  information disclosure from the sandbox.
