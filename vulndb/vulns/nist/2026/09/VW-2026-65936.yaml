title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/crypto:
  Fix missing scrub of temp buffers with PAES algorithm\n\nIn function ctr_paes_do_crypt()
  there is a buffer used to process\nremaining bytes < AES_BLOCK_SIZE. This buffer
  was not scrubbed and\nthus could lead to expose of unwanted data. Rework the code
  to\nexplicitly scrub the buffer at the end of the function to avoid\nexposure of
  maybe sensitive data.\n\nIn function __xts_2keys_prep_param() change the existing
  scrub to\nclean the whole param block instead of just the key field."
