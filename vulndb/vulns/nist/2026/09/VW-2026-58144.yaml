title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtlwifi: rtl8192du: check QoS TID before indexing tids\n\nrtl92du_tx_fill_desc()
  uses ieee80211_get_tid() to read the QoS TID\nfrom the 802.11 header and then uses
  it as an index into\nsta_entry->tids[]. ieee80211_get_tid() returns the low 4-bit
  QoS TID\nvalue, so the result can be in the range 0..15.\n\nrtlwifi only allocates
  MAX_TID_COUNT entries for sta_entry->tids[], and\nMAX_TID_COUNT is 9. A QoS TID
  greater than 8 therefore indexes past the\naggregation state array. Keep the default
  RTL_AGG_STOP state for\nout-of-range TIDs, matching rtl92cu_tx_fill_desc().\n\n\
  This issue was detected by our static analysis tool and confirmed by\nmanual audit.
  UBSAN validation for the same bug pattern reports an\narray-index-out-of-bounds
  access with index 10 for type\n'rtl_tid_data [9]'."
