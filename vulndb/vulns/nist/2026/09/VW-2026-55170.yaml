title: The WPML Multilingual CMS plugin for WordPress is vulnerable to 
  time-based SQL Injection via the ‘elementIds’ parameter in all versions up to,
  and including, 4.9.5 due to insufficient escaping on the user supplied 
  parameter and lack of sufficient preparation on the existing SQL query.  This 
  makes it possible for authenticated attackers, with Subscriber-level access 
  and above, to append additional SQL queries into already existing queries that
  can be used to extract sensitive information from the database. This 
  vulnerability is exploitable due to an authorization bypass where the 
  registered authorization callback fails to execute, allowing any authenticated
  user regardless of role to access administrative translation functionalities.
