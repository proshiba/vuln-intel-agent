title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  reject stale cookies with mismatched verification tags\n\nsctp_unpack_cookie() skips
  cookie expiration checks whenever an\nassociation already exists.  This is broader
  than the exception in\nRFC 9260 Section 5.2.4.\n\nFor an existing association, Section
  5.2.4 permits an expired State\nCookie only when both Verification Tags in the cookie
  match the current\nassociation.  Otherwise, the packet SHOULD be discarded and a
  Stale\nCookie ERROR MUST be sent.\n\nThe broad check lets an expired Action A restart
  cookie reach\nsctp_sf_do_dupcook_a().  In a runtime test with the default 60 second\n\
  cookie lifetime, replaying such a cookie after 65 seconds returned a\nCOOKIE-ACK
  and restarted the association.\n\nCheck cookie expiration unless both Verification
  Tags match.  This\npreserves the Action D exception for a lost COOKIE ACK while
  rejecting\nexpired cookies in all other cases."
