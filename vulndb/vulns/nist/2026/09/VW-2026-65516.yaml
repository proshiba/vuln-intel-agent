title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: validate connectionless PSM length\n\nConnectionless L2CAP frames carry a
  two-byte PSM at the start of the\npayload.  l2cap_recv_frame() currently reads that
  PSM unconditionally\nafter validating only the outer L2CAP length.\n\nA malformed
  connectionless frame with a zero- or one-byte payload can\ntherefore make the parser
  read beyond the advertised skb payload and use\ntailroom bytes as part of the PSM.\
  \  A VHCI-backed QEMU reproducer\ninjected a one-byte connectionless payload and
  reached the unchecked\nread.\n\nReject connectionless frames that cannot contain
  the PSM before reading\nor pulling it.  This preserves all valid connectionless
  frames while\ndropping only structurally incomplete packets."
