title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  register configfs subsystem after creating default devices\n\nIn null_init(), configfs_register_subsystem()
  currently runs before\nregister_blkdev(), so when null_blk is built as a module,
  a racing mkdir()\n+ poweron from userspace can reach null_add_dev() while null_major
  is still\n0. __add_disk() then hits WARN_ON(disk->minors) (major=0 with minors!=0)\n\
  and fails:\n\n[root@fedora ~]# [ 2366.521436] WARNING: block/genhd.c:476 at __add_disk+0x8a7/0xde0,\n\
  [ 2366.523552] Modules linked in: null_blk(+) nft_fib_inet nft_fib_ipv4 nft_fib_ipv6
  nft_fib\n[ 2366.529081] CPU: 26 UID: 0 PID: 1600 Comm: sh Not tainted 7.2.0-rc1+
  #66 PREEMPT(full)\n......\n[ 2366.547251] Call Trace:\n[ 2366.547575]  <TASK>\n\
  [ 2366.547831]  ? _raw_spin_lock+0x84/0xe0\n[ 2366.548260]  add_disk_fwnode+0x114/0x560\n\
  [ 2366.548739]  null_add_dev+0x102d/0x1b80 [null_blk]\n[ 2366.549310]  ? __pfx_null_add_dev+0x10/0x10
  [null_blk]\n[ 2366.549906]  ? mutex_lock+0xd"
