title: MISP contains a Cross-Site Request Forgery (CSRF) vulnerability in the 
  UserSettingsController. The actions setTheme, setHomePage, and 
  eventIndexColumnToggle were explicitly added to the Security component's 
  unlockedActions list, which disabled all CSRF validation (both token and 
  field-hash checks) for those endpoints. Because these endpoints accept POST 
  requests and modify per-user application state (theme selection, default 
  homepage URL, and event index column visibility), an attacker who can induce a
  logged-in MISP user to load a malicious page (e.g., via a crafted link, 
  embedded image, or auto-submitting form) can forge requests that alter the 
  victim's settings without their knowledge or consent. The most impactful 
  action is setHomePage, which allows an attacker to redirect the victim's 
  default landing page to an arbitrary attacker-controlled URL, potentially 
