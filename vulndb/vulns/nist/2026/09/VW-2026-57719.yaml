title: 'AnythingLLM is an application that turns pieces of content into context that
  any LLM can use as references during chatting. In 1.16.1 and earlier, the manager
  role can store meta_page_title or meta_page_favicon through /api/admin/system-preferences,
  and MetaGenerator inserts those values into production homepage HTML without escaping
  attribute values or text content. The values pass unchanged through server/models/systemSettings.js
  and reach MetaGenerator.generate() in server/index.js. #assembleMeta() in server/utils/boot/MetaGenerator.js
  concatenates the stored values into HTML. When an administrator visits the homepage
  /, injected JavaScript can read the administrator JWT and use it to create API keys,
  access or modify workspace and chat data, delete users, and perform other administrator
  actions. server/endpoints/admin.js accepts the manager-controlled settings before
  server/models/systemSettings.js returns them unchanged. No fixed version is available
  as of this review.'
