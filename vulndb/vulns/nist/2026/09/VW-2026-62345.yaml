title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-pci:
  release descriptor pools on probe failure\n\nThe per-NUMA-node descriptor DMA pools
  are created lazily from\nnvme_init_hctx_common() once the admin tag set is allocated,
  but they are\nonly destroyed in nvme_remove() via nvme_release_descriptor_pools().
  Any\nprobe failure after the admin tag set has been allocated unwinds through\n\
  the out_disable label and nvme_pci_free_ctrl(), neither of which releases\nthe pools,
  leaking the dma_pool objects.\n\nRelease the descriptor pools in the out_disable
  error path. It must not\nbe added to nvme_pci_free_ctrl(), as that would double-free
  against\nnvme_remove() on the normal teardown path."
