title: Improper parameter handling in NeuVector allows any authenticated user 
  who holds the namespaced Runtime Policies (write) permission or anyone with 
  access to NeuVector’s internal gRPC certificate key pair the ability to inject
  OS commands in the privileged enforcer container, which can lead to the 
  complete compromise of the worker node. This affects NeuVector 5.4 before 
  5.4.11, NeuVector 5.5 before 5.5.4, NeuVector 5.6 before 5.6.2 and potentially
  older versions.
