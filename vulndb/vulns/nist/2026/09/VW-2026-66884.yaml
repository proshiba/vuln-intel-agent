title: Contrast is a confidential-computing runtime for Kubernetes. In versions 
  before 1.18.0, the guest kernel's ACPI/AML handling is vulnerable to an AML 
  injection attack ("BadAML"). ACPI tables containing AML bytecode are passed 
  from the untrusted host (QEMU) to the guest firmware (OVMF) and on to the 
  Linux kernel, whose AML interpreter executes them. An attacker controlling the
  host — an assumed adversary in Contrast's threat model — can craft a table 
  with malicious, Turing-complete AML bytecode that the guest kernel interprets 
  with access to the full guest memory, including private pages, resulting in 
  arbitrary code execution and disclosure or modification of confidential guest 
  data. The issue affects the AMD SEV-SNP platforms Metal-QEMU-SNP and 
  Metal-QEMU-SNP-GPU; Metal-QEMU-TDX is not affected because ACPI table contents
  are measured into RTMR 0 by OVMF on Intel TDX. Version v1.18.0 mitigates the 
  attack by sandboxing the kernel AML interpreter so that it cannot read or 
