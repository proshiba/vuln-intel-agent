title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a stored cross-site scripting vulnerability in the user 
  'donationLink' profile field. User::setDonationLink() (objects/user.php) 
  stores the value and save() validates it only with filter_var(..., 
  FILTER_VALIDATE_URL), which accepts strings such as 
  http://evil.example/"onmouseover=alert(document.domain)//, while 
  getDonationLink() applies only strip_tags() and does not encode double quotes.
