title: A vulnerability was detected in Rizwan17 inventory-management-system up 
  to bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. This vulnerability affects the 
  function storeCustomerOrderInvoice of the file includes/manage.php. Performing
  a manipulation of the argument pro_name[] results in sql injection. The attack
  can be initiated remotely. The exploit is now public and may be used. 
  Continious delivery with rolling releases is used by this product. Therefore, 
  no version details of affected nor updated releases are available. The project
  was informed of the problem early through an issue report but has not 
  responded yet.
