title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/sva:
  Set handle->dev before the SVA handle is visible\n\niommu_attach_device_pasid()
  installs the new SVA attach handle in the\ngroup PASID lookup before iommu_sva_bind_device()
  returns. A concurrent\nbind can therefore find and reuse the same handle after iommu_sva_lock
  is\ndropped.\n\nhandle->dev was initialized after dropping iommu_sva_lock. This
  leaves a\nwindow where a racing bind can return a handle whose dev pointer is still\n\
  NULL. A subsequent iommu_sva_unbind_device() can then dereference it via\nhandle->dev->iommu_group.\n\
  \nInitialize handle->dev before releasing iommu_sva_lock so any visible SVA\nhandle
  is fully initialized."
