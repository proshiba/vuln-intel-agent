title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: cros_usbpd-charger: bound the EC-reported port count\n\ncros_usbpd_charger_probe()
  reads two port counts from the EC and uses\none of them, num_charger_ports, as the
  loop bound when populating a\nfixed-size array:\n\n\tstruct port_data *ports[EC_USB_PD_MAX_PORTS];\t
  /* 8 entries */\n\t...\n\tfor (i = 0; i < charger->num_charger_ports; i++)\n\t\t
  charger->ports[charger->num_registered_psy++] = port;\n\nBoth num_usbpd_ports (from
  EC_CMD_USB_PD_PORTS) and num_charger_ports\n(from EC_CMD_CHARGE_PORT_COUNT) are
  u8 values reported by the EC. The\nonly validation is a sanity check that compares
  the two EC-reported\nvalues against each other:\n\n\tif (num_charger_ports < num_usbpd_ports
  ||\n\t    num_charger_ports > num_usbpd_ports + 1)\n\t\treturn -EPROTO;\n\nIt never
  checks either count against EC_USB_PD_MAX_PORTS, the size of\nthe ports[] array.
  A malfunctioning, malicious or compromised EC that\nreports num_usbpd_ports == num_charger_ports "
