title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark tracing_multi trampolines as ftrace managed\n\nSince tracing_multi link does
  not set ftrace_managed, it would fail to\nrelease the tracing_multi link when attaching
  tracing_multi link and\nthen attaching fentry link.\n\n[    3.714215] WARNING: kernel/bpf/trampoline.c:1727
  at bpf_trampoline_multi_detach+0x20b/0x240, CPU#1: test_progs/97\n...\n[    3.733170]\
  \  bpf_tracing_multi_link_release+0x14/0x30\n[    3.733890]  bpf_link_free+0x58/0x130\n\
  [    3.734414]  bpf_link_release+0x23/0x30\n\nFix it by setting 'ftrace_managed
  = true' in register_fentry_multi()."
