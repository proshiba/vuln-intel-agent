title: "An issue was discovered in HAProxy 3.3.0 through 3.4.4 and in 3.5-dev1 through
  3.5-dev5. Exploitation requires an HTTP/3 frontend: HAProxy must be built with QUIC
  support and configured with a QUIC bind listener, and the affected traffic must
  reach a backend over HTTP/1.1 using chunked transfer coding on a reused connection.
  Under those conditions, when an HTTP/3 request carries no Content-Length header,
  the HTTP/3 multiplexer credits the length declared in a DATA frame header to the
  stream endpoint's known-input-payload estimate at the moment the frame header is
  decoded, before the payload has been received, and that declared length is emitted
  verbatim as the HTTP/1.1 chunk size. A remote unauthenticated client that declares
  more payload than it delivers and then ends the stream causes HAProxy to announce
  a chunk larger than the bytes it writes and to return the connection to the idle
  pool in a desynchronized state. The result is potential HTTP request smuggling on
  reused backend conn"
