title: "A cross-site request forgery (CSRF) vulnerability existed in the cullEmptyEvents
  action of MISP. The endpoint performed a state-changing and irreversible operation
  while accepting HTTP GET requests.\n\n\nBecause bodyless GET requests are not subject
  to CakePHP's CSRF validation, an attacker could cause an authenticated MISP user
  with sufficient privileges to invoke the endpoint simply by causing their browser
  to load a crafted URL, for example through an embedded image or other automatically
  requested resource.\n\n\nSuccessful exploitation triggers the deletion of published
  empty events. The deletion is particularly significant because the operation uses
  skipBlocklist, meaning the removed events do not leave blocklist entries that could
  prevent or track their subsequent synchronization. This can result in unintended
  and potentially irreversible deletion of MISP event records without explicit user
  interaction.\n\n\nThe vulnerability was addressed by restricting cullEmptyEvents
  to HTTP POST reque"
