title: Arc Search for Android before version 1.12.10 does not display a 
  fullscreen notification when a page enters fullscreen mode while the app is 
  running in the background. A remote attacker can exploit this via a specially 
  crafted website to render fake UI elements, such as a spoofed address bar, 
  misleading the user about the origin of displayed content and increasing the 
  risk of phishing.
