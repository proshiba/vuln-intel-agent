title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  validate new EOF for zero range\n\nWhen FALLOC_FL_ZERO_RANGE is used without FALLOC_FL_KEEP_SIZE,\n\
  smb3_zero_range() may extend EOF without checking RLIMIT_FSIZE, allowing\nthe file
  to grow beyond the caller's file-size limit.\n\nFix this by calling inode_newsize_ok()
  before sending the zero-range\nrequest when the operation would extend EOF.\n\n\
  Reproducer, using a file on a CIFS mount:\n\n\tbash -c '\n\t        FILE=/mnt/cifs/repro\n\
  \n\t        trap \"\" SIGXFSZ\n\t        ulimit -f 3072\n\n\t        truncate -s
  2M \"$FILE\"\n\t        fallocate --zero-range -o 0 -l 4M \"$FILE\"\n\t        echo
  \"fallocate rc=$?\"\n\t        stat -c \"file size=%s\" \"$FILE\"\n\t'\n\nBefore
  this change, the operation succeeds despite the 3 MiB limit:\n\n\tfallocate rc=0\n\
  \tfile size=4194304\n\nAfter this change, fallocate fails and leaves the file at
  2 MiB."
