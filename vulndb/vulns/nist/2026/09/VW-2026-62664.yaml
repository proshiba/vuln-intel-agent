title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hfi1:
  Preserve unit 0 on allocation failure\n\nhfi1_free_devdata() assumes that the device
  was inserted into the unit\ntable and unconditionally erases dd->unit. If xa_alloc_irq()
  fails, the\nzero-initialized unit remains zero, so full cleanup can remove an\n\
  unrelated device from index 0.\n\nRelease only the rdmavt allocation and return
  immediately while the unit\ntable has not acquired the device."
