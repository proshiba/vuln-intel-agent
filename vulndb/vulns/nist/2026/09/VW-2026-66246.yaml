title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix xmit_frame/xmit_buf leaks on mgnt-frame error paths\n\nissue_beacon(),
  issue_probersp() and issue_asocrsp() obtain a management\nxmit_frame together with
  its xmit_buf from the driver's fixed-size\nmanagement-TX pools via alloc_mgtxmitframe().
  On the normal path the frame\nis handed to dump_mgntframe(), which transfers ownership
  and eventually\nreturns both objects to their pools (the frame and, for beacons,
  the buf\nin rtl8723bs_mgnt_xmit(); other bufs via the pending-xmitbuf/TX-completion\n\
  path).\n\nSeveral error/edge paths return early after a successful\nalloc_mgtxmitframe()
  but before dump_mgntframe(), so ownership is never\ntransferred and neither object
  is freed:\n\n  - issue_beacon(): beacon larger than 512 bytes\n  - issue_probersp():
  cur_network->ie_length > MAX_IE_SZ\n  - issue_probersp(): kzalloc() of the SSID
  scratch buffer fails\n  - issue_asocrsp(): pkt_type is neither ASSOCRSP nor REASSOCRSP\n\
  \nBec"
