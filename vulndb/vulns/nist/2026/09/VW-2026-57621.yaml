title: "The Sierra Wireless HL78xx modem GNSS driver (drivers/modem/hl78xx/, later
  drivers/modem/vendor_standalone/hl78xx/) embeds a generic struct gnss_nmea0183_match_data
  match_data inside struct hl78xx_gnss_data. The generic NMEA0183 match helper (drivers/gnss/gnss_nmea0183_match.c)
  requires that context to be the first member because its callbacks cast user_data
  directly to struct gnss_nmea0183_match_data . In the affected releases match_data
  was the second member (after const struct device dev), so it sat at a non-zero offset
  while gnss_nmea0183_match_init() initialized it at the correct address. The registered
  NMEA handlers instead pass the whole device data object (data->devices.gnss->data,
  offset 0), producing an offset-shifted type confusion between where state is initialized
  and where the parse callbacks read and write it.\n\nWhen NMEA sentences from the
  GNSS receiver are parsed, the GGA/RMC callbacks write parsed fix data into the wrong
  location within the struct, and the GSV callback"
