title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  processor: validate MADT IOAPIC entry bounds\n\nThe IOAPIC hotplug lookup parses
  both MADT and _MAT records directly.\nThe MADT walk previously used a subtable's
  declared length to advance\nthe cursor after only locating a generic header.  The
  _MAT path likewise\npassed a generic header to the IOAPIC helper.\n\nValidate that
  a current record has a complete generic header, that its\ndeclared length is contained
  in the available record range, and that a\ntyped IOAPIC record contains the full
  fixed IOAPIC body before reading\nits fields.  Use the same relation for both MADT
  and _MAT provider\npaths."
