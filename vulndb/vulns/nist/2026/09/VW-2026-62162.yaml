title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  fq: clamp quantum and initial_quantum in change path\n\nThe fq change path accepts
  TCA_FQ_QUANTUM in [1, INT_MAX] and\nTCA_FQ_INITIAL_QUANTUM up to INT_MAX, while
  fq_init() already clamps to\n[1, 1<<20]. A user can override the init clamp via
  tc qdisc change,\nrestoring the small-quantum deficit spin that the init clamp prevents.\n\
  \nNarrow iq_range.max to 1<<20 so TCA_FQ_INITIAL_QUANTUM is rejected at\nparse time.
  Clamp TCA_FQ_QUANTUM to [256, 1<<20] in fq_change() and\nfq_init() quantum to [256,
  1<<20] for tiny-MTU devices.\n\nConditions to recreate the bug:\n  CONFIG_NET_SCH_FQ=y.
  Requires CAP_NET_ADMIN (namespace-local via\n  unshare -Urn suffices).\n\n  tc qdisc
  add dev dummy0 root fq\n  tc qdisc change dev dummy0 root fq quantum 1 stab data
  32768 size_log 15 cell_log 0"
