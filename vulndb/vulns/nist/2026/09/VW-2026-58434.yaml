title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix extent map leak in NOCOW direct I/O write\n\nbtrfs_dio_iomap_begin() calls btrfs_get_extent(),
  which returns an\nextent map reference that must be dropped on all exit paths.\n\
  \nFor direct writes into a NOCOW range, btrfs_get_blocks_direct_write()\nkeeps using
  that extent map and asks btrfs_create_dio_extent() to\nallocate the ordered extent.
  If that fails, for example because\nbtrfs_alloc_ordered_extent() fails, the function
  returns the error\nwithout dropping the input extent map. The PREALLOC path avoided
  this by\ndropping the input extent map before replacing it with the newly created\n\
  one.\n\nCheck the error from btrfs_create_dio_extent() before replacing the\nmap
  and drop the input extent map on failure."
