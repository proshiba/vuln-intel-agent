title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_input:
  stop callbacks before unregistering input device\n\nvirtinput_remove() unregisters
  the input device before resetting the\nvirtio device. virtinput_recv_events() drops
  vi->lock around input_event(),\nso clearing vi->ready does not stop a callback that
  passed the entry check.\nIt can still use vi->idev, requeue buffers and kick the
  queue.\n\nReset first, as virtinput_freeze() already does. With the preceding core\n\
  change, reset waits for callbacks before input_unregister_device() can\nfree vi->idev.
  Recheck vi->ready after taking the lock again: keep draining\ncompleted events so
  an input packet is not truncated, but stop requeueing\nbuffers and kicking the queue.\n\
  \nWith evdev attached, input_unregister_handle() currently waits for an RCU\ngrace
  period, which also waits out IRQ callbacks. This masks the lifetime\nbug on PCI
  and MMIO, but does not protect sleepable callbacks on other\ntransports."
