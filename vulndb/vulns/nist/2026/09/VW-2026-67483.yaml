title: Bitwarden Server 2025.6.0 before 2026.5.0 declares the @ExternalId 
  parameter of the User_ReadBySsoUserOrganizationIdExternalId stored procedure 
  as NVARCHAR(50) while the column it queries stores NVARCHAR(300), silently 
  truncating the SSO login identifier on SQL Server deployments and allowing a 
  user whose identity-provider identifier begins with another organization 
  member's full 50-character identifier to authenticate as that member and 
  obtain a victim-scoped access token.
