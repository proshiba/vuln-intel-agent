title: Alchemy is an open source content management system engine written in 
  Ruby on Rails. Prior to 7.4.15, 8.0.15, 8.1.14, and 8.2.6, the unauthenticated
  GET /api/pages/nested endpoint implemented by Api::PagesController#nested in 
  app/controllers/alchemy/api/pages_controller.rb returns an unfiltered page 
  tree because it performs no authorization and does not scope descendants by 
  the caller's ability. Anonymous callers can retrieve restricted and 
  unpublished page metadata that the sibling show action denies. When 
  elements=true is supplied, PageTreeSerializer also returns element and 
  ingredient content from restricted pages because PageTreePreloader and the 
  serializer do not apply an ability check to those records. This issue is fixed
  in versions 7.4.15, 8.0.15, 8.1.14, and 8.2.6.
