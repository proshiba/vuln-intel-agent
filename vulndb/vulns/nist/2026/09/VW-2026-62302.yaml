title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  use DEFINE_MUTEX for the file-scope mutex\n\nIn null_init(), mutex_init(&lock) currently
  happens after\nconfigfs_register_subsystem(), which exposes the nullb subsystem
  to\nuserspace. A racing mkdir() into /sys/kernel/config/nullb/ can reach\nnull_find_dev_by_name()
  -> mutex_lock(&lock) before the mutex is\ninitialized, trigger warning:\n\n[  123.137788]
  DEBUG_LOCKS_WARN_ON(lock->magic != lock)\n[  123.137796] WARNING: kernel/locking/mutex.c:159
  at mutex_lock+0x171/0x1c0, CPU#13: mkdir/1301\n[  123.140090] Modules linked in:
  null_blk(+) nft_fib_inet nft_fib_ipv4\n......\n[  123.154926] Call Trace:\n[  123.155172]\
  \  <TASK>\n[  123.155419]  ? __pfx_mutex_lock+0x10/0x10\n[  123.156181]  ? __pfx__raw_spin_lock+0x10/0x10\n\
  [  123.156571]  nullb_group_make_group+0x20/0x100 [null_blk]\n[  123.157011]  configfs_mkdir+0x47b/0xc70\n\
  [  123.157337]  ? __pfx_configfs_mkdir+0x10/0x10\n[  123.157719]  ? may_create_dentry+0x242/0x2e0\n\
  [  123.158"
