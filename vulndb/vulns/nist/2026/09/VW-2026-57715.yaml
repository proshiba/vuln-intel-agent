title: Tesseract is an open source OCR engine. In version 5.5.3 and earlier, the
  callback form of GenericVector::read in src/ccutil/genericvector.h reads the 
  independent int32 fields reserved and size_used_ from a .traineddata model 
  without a cap or an invariant check. reserve(reserved) allocates the backing 
  array, but the callback loop writes size_used_ elements. A crafted 
  TESSDATA_INTTEMP component with version_id 4 or later can therefore set 
  reserved to a small value and size_used_ to a large value when 
  fontinfo_table_.read(fp, read_info) is called from src/classify/intproto.cpp, 
  causing a heap out-of-bounds write of FontInfo structures, heap corruption, a 
  crash, or potentially controlled corruption. No fixed release is available as 
  of this review.
