title: The Registration Form for WooCommerce WordPress plugin before 1.1.3 does 
  not validate that the form referenced during registration is a legitimate 
  registration form, reading the permitted-role allow-list from an arbitrary 
  attacker-controlled post instead. A user able to create a post (Contributor 
  and above) can therefore register a new account with an arbitrary role, 
  including Administrator, leading to full site takeover. This is an incomplete 
  fix of CVE-2026-54807.
