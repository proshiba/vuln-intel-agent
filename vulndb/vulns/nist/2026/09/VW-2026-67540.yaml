title: Exposure of privileged IPC functionality in Progress Telerik Fiddler 
  Everywhere before version 8.2.0 allows a local, low-privileged attacker who 
  can modify application launch parameters and persuade a user to start the 
  application to replace the application UI or settings with attacker-controlled
  content. Successful exploitation could result in disclosure of OAuth 
  authentication tokens, execution of locally accessible programs, or 
  unauthorized modification of application-generated configuration files.
