title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  drop the stateid, not the stateowner, on seqid_op replay retry\n\nIn nfs4_preprocess_seqid_op()
  the stateid is obtained from\nnfsd4_lookup_stateid(), which holds a reference on
  the nfs4_stid\n(sc_count) but takes no reference on the stateowner. openlockstateid()\n\
  merely casts that stid and likewise takes no reference.\n\nWhen nfsd4_cstate_assign_replay()
  returns -EAGAIN (the replay owner is\nbeing torn down, RP_UNHASHED) it has not taken
  a stateowner reference on\nthat path. The error handling nevertheless called\nnfs4_put_stateowner(stp->st_stateowner),
  dropping an so_count reference\nthe function never acquired -- risking a stateowner
  refcount underflow and\nuse-after-free -- while leaking the sc_count reference held
  on the stid.\nThe leaked stid reference can also stall a concurrent\nnfsd4_close_open_stateid()
