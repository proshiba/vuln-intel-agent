title: MISP contains an HTML injection vulnerability in the 
  MISPElementHTMLFormatterTool component, which is responsible for rendering 
  MISP element references (attributes, objects, and tags) into inline HTML 
  during PDF report export via the convert_markdown_to_pdf module. The 
  attribute(), objectAttribute(), object(), and tag() methods interpolated 
  user-controlled fields (attribute type, attribute value, object name, object 
  relation, tag name, tag colour, and tag text colour) directly into HTML 
  templates without applying HTML entity encoding. An authenticated user with 
  the ability to create or modify MISP attributes, objects, or tags could embed 
  arbitrary HTML markup in these fields. When a report containing such elements 
  was exported to PDF, the unescaped content was rendered as live HTML rather 
  than inert text, potentially injecting script tags, breaking the document 
  structure, or altering the visual content of the exported report. 
