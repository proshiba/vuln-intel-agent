title: A vulnerability was found in FlowiseAI Flowise up to 3.0.2. This 
  vulnerability affects the function axios.post of the file 
  packages/server/src/controllers/evaluations/index.ts of the component 
  Evaluations Endpoint. The manipulation of the argument Host/X-Forwarded-Proto 
  results in server-side request forgery. The attack may be launched remotely. 
  The exploit has been made public and could be used. Upgrading to version 3.1.3
  is able to resolve this issue. The patch is identified as 
  700137738bcaebefd4709021f6d6b0abcd7df0ac. It is recommended to upgrade the 
  affected component. This vulnerability only affects products that are no 
  longer supported by the maintainer.
