title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/mellanox:
  mlxbf-pmc: Check ACPI_COMPANION() against NULL\n\nEvery platform driver can be forced
  to match a device that doesn't match\nits list of device IDs because of device_match_driver_override(),
  so\nplatform drivers that rely on the existence of a device's ACPI companion\nobject
  need to verify its presence.\n\nmlxbf_pmc_probe() passes the result of ACPI_COMPANION()
  to\nacpi_device_hid(), which dereferences it, so force-binding the driver to\na
  device without an ACPI companion leads to a NULL pointer dereference.\n\nAccordingly,
  add a requisite ACPI_COMPANION() check against NULL to the\nmlxbf-pmc driver and
  return -ENODEV when the companion is missing."
