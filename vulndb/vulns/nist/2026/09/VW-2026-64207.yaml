title: LibreOffice can import WMF graphics, which may be embedded in documents. 
  A heap buffer overflow existed when importing a text record that carries its 
  own character advance widths. The count of advance values and the length of 
  the text were read separately from the file and were not required to agree, so
  drawing the text walked the advance array by character position and ran past 
  its end when the array was the shorter of the two. In fixed versions an 
  advance array shorter than its text is ignored.
