title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix ABBA deadlock in ext4_xattr_inode_cache_find()\n\nSyzbot/stress-ng reported
  an ABBA deadlock in ext4 when exercising\nconcurrent xattr workloads (using the
  ea_inode mount/format option).\n\nThe deadlock occurs between the running transaction
  and the eviction\nthread:\n- Task 1 (stress-ng): Holds a reference to a shared mbcache_entry
  (ce)\n  and calls ext4_xattr_inode_cache_find() -> ext4_iget() to retrieve\n  the
  corresponding EA inode. Since the EA inode is currently being\n  evicted, ext4_iget()
  blocks in __wait_on_freeing_inode() waiting for\n  eviction to complete.\n- Task
  2 (eviction thread): Currently evicting the same EA inode in\n  ext4_evict_ea_inode().
  It calls mb_cache_entry_wait_unused(oe) which\n  blocks waiting for Task 1 to release
  the reference to the mbcache_entry.\n\nTo break this deadlock, implement a new ext4_iget()
  configuration flag\nnamed EXT4_IGET_NOWAIT. When set, perform a non-blocking lookup
