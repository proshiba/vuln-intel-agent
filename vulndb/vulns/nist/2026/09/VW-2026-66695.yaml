title: Budibase before 3.45.0 fails to properly scope the GET /api/chat-links 
  endpoint by workspace, allowing builders to enumerate chat identity link 
  records across all workspaces in a tenant. Attackers with builder access to a 
  single workspace can retrieve sensitive chat identity linking data including 
  user IDs and external chat service identifiers from other workspaces they have
  no permission to access.
