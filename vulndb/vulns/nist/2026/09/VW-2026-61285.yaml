title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  nVM: Ensure INVVPID is emulated on the correct physical CPU\n\nWhen emulating INVVPID,
  KVM executes INVVPID on the physical CPU using\nvpid02 (instead of the L1 assigned
  VPID), after doing some validations\non the operands. However, it is possible that
  the physical CPU KVM\nexecutes INVVPID on is different from the CPU L2 is running
  on.\n\nFor example, in the following scenario:\n- L2 runs on CPU #1 and exits to
  L1 (vmx->nested.vmcs02.cpu=1)\n- L1 migrates to CPU #2 and executes INVVPID\n- KVM
  executes INVVPID on CPU #2\n- L1 migrates back to CPU #1 and runs L2 (vmx->nested.vmcs02.cpu=1)\n\
  \nThe TLB entries on CPU #1 are never invalidated, because INVVPID was\nexecuted
  on CPU #2, and vmcs02 never ran on a different pCPU (i.e.\nvmx_vcpu_load_vmcs()
  will *not* request KVM_REQ_TLB_FLUSH).\n\nEnsure that INVVPID is being executed
  on the same pCPU that L2 last ran\non, and if not, fallback to clearing last_vpid=0
  to trigger a full VPID\n"
