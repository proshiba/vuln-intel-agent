title: "Attacker model / Preconditions: a loaded `TXM_MODULE_USER_MODE | TXM_MODULE_MEMORY_PROTECTION`
  module issuing kernel dispatch calls, on a build with `TX_ENABLE_EVENT_TRACE`.\n\
  \n\n\nA user-mode, memory-protected module can register an arbitrary function pointer
  as the global trace-full callback. The kernel calls it directly — no validation,
  no trampoline — from privileged kernel code when the trace buffer wraps.\n\n\n\n\
  An invalid pointer faults the kernel (DoS). A pointer into the module's own code
  was observed running with kernel privilege (`CONTROL.nPRIV = 0`), confirmed at runtime
  with a register capture inside that code."
