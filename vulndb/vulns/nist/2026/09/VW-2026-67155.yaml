title: A security vulnerability has been detected in mathurvishal 
  CloudClassroom-PHP-Project up to 5dadec098bfbbf3300d60c3494db3fb95b66e7be. 
  Affected is an unknown function of the file updateresultdetails.php. Such 
  manipulation of the argument editid leads to sql injection. The attack can be 
  launched remotely. The exploit has been disclosed publicly and may be used. 
  This product does not use versioning. This is why information about affected 
  and unaffected releases are unavailable. The vendor was contacted early about 
  this disclosure but did not respond in any way.
