title: "A typo in the MISP ACLComponent access control configuration caused the ACL
  rule for the previewEventAttributes action to reference the permission string 'theming_enabled*'
  (with a trailing asterisk) instead of the correct 'theming_enabled'. In the MISP
  ACL system, the array values define which role or permission grants access to a
  given controller action. The adjacent entry previewEventObjects correctly uses ['theming_enabled'],
  confirming the intended restriction. The malformed key 'theming_enabled*' does not
  match any valid permission identifier, causing the access control check for previewEventAttributes
  to malfunction. Depending on the ACL evaluation logic, this could result in either
  unauthorized users gaining access to the previewEventAttributes endpoint (authorization
  bypass) or legitimate users being denied access (availability impact). \n\nThe previewEventAttributes
  endpoint exposes event attribute data within MISP so an authorization bypass could
  expose sensitive indicator and"
