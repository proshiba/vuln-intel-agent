title: 'Vulnerability in the Oracle Hyperion Data Relationship Management product
  of Oracle Hyperion (component: Access and security).   The supported version that
  is affected is 11.2.26.0.000. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via HTTPS to compromise Oracle Hyperion Data Relationship
  Management.  Successful attacks require human interaction from a person other than
  the attacker. Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Hyperion
  Data Relationship Management accessible data and unauthorized ability to cause a
  partial denial of service (partial DOS) of Oracle Hyperion Data Relationship Management.
  CVSS 3.1 Base Score 7.1 (Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L).'
