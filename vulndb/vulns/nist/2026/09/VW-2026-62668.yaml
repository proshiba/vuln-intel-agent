title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Avoid reprocessing the current packet after the QP enters the error state\n\nWhen
  do_complete() finds the QP in the error state it returns\nRESPST_CHK_RESOURCE. \
  \ Before commit 49dc9c1f0c7e (\"RDMA/rxe: Cleanup\nreset state handling in rxe_resp.c\"\
  ) this was the flush loop:\ncheck_resource() had an error-state branch that fetched
  each remaining\nrecv WQE and completed it with IB_WC_WR_FLUSH_ERR, without touching\n\
  the current packet.  That commit removed the error-state branch from\ncheck_resource()
  (draining is now done at rxe_receiver() entry) but\nkept the do_complete() error-state
  return.\n\nAs a result, when a QP moves to the error state while a packet is\nbeing
  completed - e.g. an rdma_cm disconnect racing with receive\nprocessing - the responder
  state machine loops back into the request\nprocessing chain with the already-completed
  packet still in hand:\ncheck_resource() fetches a fresh recv WQE, execute()/send_data_in()"
