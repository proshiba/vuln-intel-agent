title: The MPG – Multiple Page Generator, Bulk Landing Pages & Programmatic SEO 
  plugin for WordPress is vulnerable to generic SQL Injection via URL Path in 
  all versions up to, and including, 4.2.1 due to insufficient escaping on the 
  user supplied parameter and lack of sufficient preparation on the existing SQL
  query. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. This is only exploitable when the [mpg_spintax] shortcode 
  is rendered in site-wide content such as a footer or template part, as the 
  vulnerable code path is only reached when the shortcode is active on the 
  requested page.
