title: The Awesome Support plugin for WordPress is vulnerable to Missing 
  Authorization in versions up to, and including, 6.3.9. This is due to a 
  missing capability check on the wpas_do_mr_deny_user() function, which unlike 
  its counterpart wpas_do_mr_activate_user() does not enforce 
  current_user_can('edit_users') or current_user_can('edit_user', $user_id), 
  relying solely on a nonce that is not scoped to the target user. This makes it
  possible for authenticated attackers, with subscriber-level access and above, 
  to set the mr_user_denied flag on any user account — including administrators 
  — permanently blocking their moderated activation and dispatching a denial 
  notification email to the victim.
