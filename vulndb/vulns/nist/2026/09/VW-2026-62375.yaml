title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  check if root is readonly when setting posix acl\n\nFor a filesystem which has btrfs
  read-only property set to true, all\nwrite operations including acl and xattr should
  be denied. However, acl\ncan still be set even if btrfs ro property is true.\n\n\
  This happens because no function on the set_acl code path checks the root\nis readonly
  or not. It was checked in btrfs_setxattr_trans() but got\nremoved in commit 353c2ea735e4
  (\"btrfs: remove redundant readonly root\ncheck in btrfs_setxattr_trans\")\n\nThat
  commit didn't check if all the callers properly check the root's\nread-only flag.
  A previous fix is commit b51111271b03 (\"btrfs: check if\nroot is readonly while
  setting security xattr\").\n\nAlways check if the root is read-only before performing
  the set acl\noperation."
