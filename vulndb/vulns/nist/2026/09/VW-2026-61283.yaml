title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: hyper-v: Clamp stimer deadline to avoid livelock\n\nFix an issue where userspace
  or the guest can program an Hyper-V\nsynthetic timer to have a deadline in the past
  via integer overflow,\npreventing the CPU from making progress and triggering an
  RCU stall.\n\nHyper-V's SynIC exposes 4 per-vCPU synthetic timers to the\nguest,
  which are emulated by KVM. Each is programmed through the\nHV_X64_MSR_STIMERi_CONFIG
  and HV_X64_MSR_STIMERi_COUNT MSRs. Depending\non CONFIG, COUNT represents either
  the absolute expiration time or the\nperiod of a periodic timer, both expressed
  in 100ns ticks. These timers\nmay be set both by the guest (WRMSR) and the host
  (KVM_SET_MSRS).\n\nWhen the timer is enabled, stimer_start() translates COUNT to
  an\nabsolute monotonic deadline and arms an hrtimer. If COUNT is set to a\nvalue
  close to U64_MAX, the deadline calculation can overflow.\n\n    ktime_add_ns(ktime_now,
  100 * (stimer->exp_time - time_now)"
