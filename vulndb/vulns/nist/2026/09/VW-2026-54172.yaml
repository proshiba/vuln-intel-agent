title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  restore nofs context unconditionally in xfs_trans_roll\n\nWhen __xfs_trans_commit()
  fails in xfs_trans_roll(), the NOFS context\nis cleared but only restored in the
  success path.  This leaves the\nerror path without nofs protection, causing a circular
  lock dependency\nbetween xfs_nondir_ilock_class and fs_reclaim:\n\n       CPU0 \
  \                   CPU1\n       ----                    ----\n  lock(&xfs_nondir_ilock_class);\n\
  \                               lock(fs_reclaim);\n                            \
  \   lock(&xfs_nondir_ilock_class);\n  lock(fs_reclaim);\n\nFix this by moving xfs_trans_set_context()
  before the error check so\nthat nofs context is always restored on the new transaction."
