title: A flaw was found in submariner. In cert-auth mode, the connection 
  configuration is built using free-form strings from the Custom Resource 
  Definition (CRD) without proper validation. A malicious cluster can exploit 
  this by publishing a CableName that includes newlines and ipsec.conf 
  directives. This allows an attacker to inject arbitrary configuration 
  parameters or execute commands through leftupdown hooks, leading to remote 
  code execution as root on the gateway node.
