title: The iubenda | All-in-one Compliance for GDPR / CCPA Cookie Consent + more
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via Comment 
  Content via AdSense Regex Rewrite in all versions up to, and including, 3.13.4
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. This 
  vulnerability only manifests when the 'Secondary' parser engine is active 
  (parser_engine=default); it does not exist under the default 'new' DOM-based 
  parser engine.
