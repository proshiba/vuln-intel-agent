title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix potential UAF when reading bpf link info\n\nIn bpf_link_show_fdinfo and bpf_link_get_info_by_fd,
  link->prog is\naccessed without holding any locks. If the prog is concurrently replaced\n\
  via bpf_link_update, the old prog can be freed, leading to a potential\nUAF issue.\n\
  \nFix this by accessing link->prog under RCU protection to safely fetch\nthe pointer
  and guarantee its lifetime while reading its fields."
