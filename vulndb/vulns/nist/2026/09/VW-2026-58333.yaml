title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  fix use-after-free in __rpc_clnt_handle_event and __rpc_clnt_remove_pipedir\n\n\
  Normal client creation goes through rpc_setup_pipedir(), which records\nclnt->pipefs_sb,
  but the mount-event path in __rpc_clnt_handle_event()\ncalls rpc_setup_pipedir_sb()
  directly and never refreshes that field.\nThe umount path also removes the directory
  without clearing\nclnt->pipefs_sb.\n\nAfter a late pipefs mount or any remount,
  rpc_clnt_remove_pipedir()\ncompares the current superblock against a stale pipefs_sb
  pointer and\nskips cleanup, leaving pipefs dentries whose inode private data still\n\
  points at a freed rpc_clnt, leading to a potential use-after-free during\nsubsequent
  rpc_info_open() or rpc_show_info() calls.\n\nFix this by properly updating clnt->pipefs_sb
  upon mount events and\nclearing it during unmount or failure paths."
