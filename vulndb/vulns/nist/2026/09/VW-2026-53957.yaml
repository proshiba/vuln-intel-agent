title: "An authorization flaw in MISP allowed an authenticated user to submit a sharing_group_id
  without verifying that the user was authorized to use the referenced Sharing Group.\n\
  \nIn several attribute and Galaxy Cluster creation and editing workflows, validation
  of the submitted Sharing Group was performed only when the request explicitly set
  the distribution field to 4 (\"Sharing Group\"). An attacker could therefore craft
  a request containing a sharing_group_id while omitting the distribution parameter,
  or otherwise avoiding the distribution == 4 condition, causing the Sharing Group
  authorization check to be skipped.\n\nThis could allow a user with permission to
  create or modify the affected MISP objects to associate data with a Sharing Group
  that they are not authorized to use. Depending on the affected object's existing
  distribution settings and subsequent processing, this could bypass intended information-sharing
  boundaries and result in unauthorized placement or distribution of data to mem"
