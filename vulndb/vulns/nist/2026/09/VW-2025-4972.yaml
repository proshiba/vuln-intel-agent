title: "A remote code execution (RCE) vulnerability exists in Google Cloud Data Fusion.\n\
  A user with permissions to upload artifacts to a Data Fusion instance can execute
  arbitrary code within the core AppFabric component. \nThis could allow the attacker
  to gain control over the Data Fusion instance, potentially leading to unauthorized
  access to sensitive data, modification of data pipelines, and exploration of the
  underlying infrastructure.\n\nThe following CDAP versions include the necessary
  update to protect against this vulnerability:  *   6.10.6+\n  *  6.11.1+\n\n\n\n\
   Users must immediately upgrade to them, or greater ones, available at:  https://github.com/cdapio/cdap-build/releases
  ."
