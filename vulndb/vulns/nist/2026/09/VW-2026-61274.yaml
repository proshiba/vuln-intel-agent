title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Correctly handle end of VA space TLBI invalidation\n\nOur TLB invalidation
  by VA code is based on comparing two ranges,\none defined by the TLB, and one defined
  by the TLBI instruction.\n\nEach range is defined by a start and a size. However,
  the way the\ncomparison is done doesn't account for address rollover, as it\ncompares
  an address with (base + size). This works nicely until\nthis expression represent
  the last page/block in the TTBR1 VA space,\nas the result is a big fat 0. And a
  failed TLB invalidation.\n\nRewrite the comparison in a way that is immune to the
  address\nrollover (making the end address inclusive instead of exclusive),\nand
  move this into a common helper that is used by both VA and IPA\ninvalidations, as
  suggested by Hyunwoo Kim (although the IPA version\ndidn't suffer from this particular
  problem, obviously)."
