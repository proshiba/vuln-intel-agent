title: A stored Cross-Site Scripting (XSS) vulnerability exists in the 
  announcement preview component of REBUILD 4.4.3. Although the announcement 
  content undergoes HTML escaping on the server side, the client-side preview 
  code reverses the escaped entities using jQuery's `html().text()` method and 
  subsequently injects the result into the DOM. An administrator or attacker 
  capable of controlling the announcement content can exploit this vulnerability
  to execute arbitrary JavaScript code in the browsers of users viewing the 
  affected pages "which may include the dashboard, activity feed, or login page,
  depending on the announcement's visibility settings.
