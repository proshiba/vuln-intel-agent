title: "NetX Secure TLS accepts an empty application-data record without verifying
  its message authentication code. In `_nx_secure_verify_mac`, a decrypted application
  record whose length equals the negotiated MAC size is treated as valid and returns
  success after advancing the receive sequence number. The received MAC is never generated
  or compared.\n\n\n\nEmpty TLS application-data records are legal, and are commonly
  emitted by TLS 1.0 implementations as a BEAST mitigation."
