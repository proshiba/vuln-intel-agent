title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Fix transport device teardown lookup\n\nSCMI transport devices are deliberately
  excluded from normal SCMI bus\nmatching so protocol drivers cannot bind to the internal
  transport\nchildren. However, scmi_device_destroy() uses the same protocol/name\n\
  lookup to find devices that must be unregistered during channel teardown.\n\nSplit
  the match helper so driver matching still skips transport devices,\nwhile explicit
  child lookup can find them for teardown. Use a shared\ntransport-device name prefix
  macro for both matching and name generation.\n\nSince transport-device names are
  derived from direction and protocol ID,\nreject duplicate protocol channel setup
  before creating or finding a\ntransport device. This prevents malformed firmware
  with duplicate\nprotocol child nodes from reusing an existing transport device and
  then\ndestroying it when the duplicate IDR insertion fails."
