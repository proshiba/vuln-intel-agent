title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  Fix NULL deref in status_show() during queue probe\n\nWhen vfio_ap_mdev_probe_queue()
  creates the sysfs attribute group,\nthe queue's driver data has not yet been set.
  A concurrent read of\nthe 'status' attribute can therefore call dev_get_drvdata()
  and\nget NULL, which is then passed directly to\nvfio_ap_mdev_for_queue() where
  q->apqn is unconditionally\ndereferenced, causing a NULL pointer dereference.\n\n\
  Fix this by acquiring the update locks before calling\nsysfs_create_group(). The
  status_show() function acquires\nguests_lock before reading the driver data, so
  any concurrent\nread will block until after dev_set_drvdata() has been called\n\
  and the update locks are released.\n\nAs a bonus, the APQN no longer needs to be
  read from the queue\nstruct after allocation — it can be read directly from apdev\n\
  before allocation and stored in a local variable, which is then\nassigned to q->apqn
  once the allocation succeeds."
