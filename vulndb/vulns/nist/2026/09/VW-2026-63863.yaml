title: temporalio/sqlparser accepts SQL containing deeply nested unary 
  expressions and can return a correspondingly deep abstract syntax tree without
  enforcing an applicable nesting limit. The library's String and Walk 
  operations recursively traverse that tree. An application that parses 
  attacker-controlled SQL and later formats or walks the returned tree can 
  encounter a runtime-fatal Go stack overflow that terminates the process; Go 
  panic recovery cannot contain this condition. Temporal Server passes 
  caller-controlled query input through the affected parser in archival, 
  visibility, and worker-query paths. In affected validation paths, the Server 
  recursively formats an invalid expression while constructing an error. In a 
  supported authenticated deployment, a caller with namespace read permission 
