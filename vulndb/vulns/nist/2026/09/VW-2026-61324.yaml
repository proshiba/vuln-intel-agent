title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  reject unsolicited H2CData PDUs\n\nnvmet_tcp_handle_h2c_data_pdu() accepts an H2CData
  PDU after only checking\nthat its TTAG is a valid in-range command index and that
  the command's\ndata buffers are mapped. It never checks that the target has actually\n\
  solicited that data by sending an R2T for the command.\n\nA remote host can abuse
  this. It submits a write command that takes the\nR2T path and, before the target
  transmits the R2T, sends an H2CData PDU\nfor that command's tag. The data completes
  the command early, and when\nthe command then fails synchronously (e.g. a length
  mismatch caught by\nnvmet_check_transfer_len()), it is completed a second time.
  Each\ncompletion calls nvmet_tcp_queue_response(), so the same command is added\n\
  to queue->resp_list twice while it is still linked; the second llist_add()\nmakes
  the node point to itself (lentry->next == lentry).\n\nnvmet_tcp_process_resp_list()
  then walks that self-refere"
