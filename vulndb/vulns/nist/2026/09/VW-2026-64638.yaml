  upload. It is possible to initiate the attack remotely. The exploit has been 
  made public and could be used. This product is using a rolling release to 
  provide continious delivery. Therefore, no version details for affected nor 
  updated releases are available. The vendor was contacted early about this 
  disclosure but did not respond in any way.
