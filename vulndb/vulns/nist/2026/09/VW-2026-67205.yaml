title: A vulnerability was determined in Thinkware U3000 up to 1.02.04. This 
  impacts the function PUT_FILE of the file /tmp/wpa_supplicant.conf of the 
  component TCP Service. Executing a manipulation of the argument path can lead 
  to improper access controls. The attack may be launched remotely. The exploit 
  has been publicly disclosed and may be utilized. The vendor was contacted 
  early about this disclosure but did not respond in any way.
