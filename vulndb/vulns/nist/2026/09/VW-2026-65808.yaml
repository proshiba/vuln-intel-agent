title: The GeoDirectory – WP Business Directory Plugin and Classified Listings 
  Directory plugin for WordPress is vulnerable to Stored Cross-Site Scripting 
  via Text-type Custom Field (e.g., 'phone') in all versions up to, and 
  including, 2.8.181 due to insufficient input sanitization and output escaping.
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page. The payload must be stored in a 
  text-type custom field (such as a phone field) via the AJAX geodir_save_post 
  endpoint, using entity-encoded angle brackets (e.g., &lt;img src=x 
  onerror=alert(1)&gt;) to bypass the strpos()-gated tag-stripping check.
