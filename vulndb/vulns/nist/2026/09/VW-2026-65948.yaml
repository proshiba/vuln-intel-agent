title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninet:
  frags: invalidate queues before flushing them\n\nfqdir_pre_exit() flushes the skbs
  from incomplete queues without\nchanging their completion state. A fragment which
  found a queue before\nhigh_thresh was cleared can then acquire the queue lock and
  reuse stale\nreassembly metadata. A queue concurrently killed after fqdir->dead
  is\nset can instead become INET_FRAG_COMPLETE|INET_FRAG_HASH_DEAD while\nstill holding
  its old skbs; skipping it because it is complete leaves\nthose references behind
  until asynchronous fqdir teardown.\n\nFor IPv6, stale metadata can make ip6_frag_reasm()
  use the old\nnhoffset with a new skb and access memory out of bounds. The resulting\n\
  heap corruption can be leveraged for local privilege escalation when\nunprivileged
  network namespaces are available. Unflushed fragments can\nalso keep conntrack references
  alive after the conntrack per-net\ncleanup point.\n\nKill each incomplete queue,
