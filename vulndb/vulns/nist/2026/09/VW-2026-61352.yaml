title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-buf:
  dma-heap: don't publish fd before copy_to_user() succeeds\n\nDMA_HEAP_IOCTL_ALLOC
  allocates a dma-buf and installs an fd into the\ncaller's fd table via dma_buf_fd()
  -> fd_install() before\ndma_heap_ioctl() copies the result back to userspace.  If
  the trailing\ncopy_to_user() fails, userspace never learns the fd number, but the\n\
  fd (and the underlying dma-buf reference) are already visible to\nother threads
  in the same process and are leaked for the lifetime of\nthe process.\n\nThe obvious
  \"close it on the failure path\" fix is unsafe: once\nfd_install() has run, another
  thread can already dup() the fd, send\nit via SCM_RIGHTS, or close() it and let
  its number be reused, so a\nsubsequent close_fd() from the ioctl path can operate
  on an unrelated\nfile.  This was pointed out by Christian König on v1 [1].\n\nRestructure
  the allocation path so that fd_install() is the last,\nunfailable step of a successful
  ioctl:\n\n  1. heap->ops-"
