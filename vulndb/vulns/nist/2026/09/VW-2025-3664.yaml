title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Prevent access to vCPU events before init\n\nAnother day, another syzkaller
  bug. KVM erroneously allows userspace to\npend vCPU events for a vCPU that hasn't
  been initialized yet, leading to\nKVM interpreting a bunch of uninitialized garbage
  for routing /\ninjecting the exception.\n\nIn one case the injection code and the
  hyp disagree on whether the vCPU\nhas a 32bit EL1 and put the vCPU into an illegal
  mode for AArch64,\ntripping the BUG() in exception_target_el() during the next injection:\n\
  \n  kernel BUG at arch/arm64/kvm/inject_fault.c:40!\n  Internal error: Oops - BUG:
  00000000f2000800 [#1]  SMP\n  CPU: 3 UID: 0 PID: 318 Comm: repro Not tainted 6.17.0-rc4-00104-g10fd0285305d
  #6 PREEMPT\n  Hardware name: linux,dummy-virt (DT)\n  pstate: 21402009 (nzCv daif
  +PAN -UAO -TCO +DIT -SSBS BTYPE=--)\n  pc : exception_target_el+0x88/0x8c\n  lr
  : pend_serror_exception+0x18/0x13c\n  sp : ffff800082f03a10\n  x29: ffff800082f03a10
  x2"
