title: The Forminator Forms  WordPress plugin before 1.57.2.1 does not perform a
  nonce, capability or ownership check before running a one-time payment-field 
  migration during the construction of one of its admin screens, and that 
  construction happens on every wp-admin request for any logged-in user. Any 
  authenticated user, including a Subscriber with no permissions in the 
  Forminator Forms  WordPress plugin before 1.57.2.1, can therefore rewrite the 
  saved field configuration of any form on the site, including a live payment 
  form.
