title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Zero dport diagnostics buffer to avoid info leak\n\nqla2x00_do_dport_diagnostics()
  allocates the qla_dport_diag response\nbuffer with kmalloc_obj() (non-zeroing) and,
  on success, copies the full\nsizeof(*dd) back to user space via sg_copy_from_buffer().
  The inbound\nsg_copy_to_buffer() only fills as many bytes as the user request payload\n\
  provides, and qla26xx_dport_diagnostics() zeroes only dd->buf. The\noptions and
  unused[] fields are therefore copied out uninitialized,\nleaking kernel heap contents
  to user space.\n\nAllocate with kzalloc_obj(), matching qla2x00_do_dport_diagnostics_v2()."
