title: "CrowdStrike released a security update to address a vulnerability in the Falcon
  sensor for Windows. The vulnerability only exists when the Microsoft Office File
  Malicious Macro Removal Windows policy setting is enabled and customers remain protected
  through the Cloud Anti-malware for Microsoft Office Files settings.\n\n\n\n\nAn
  update is available immediately for versions 7.34 and above, 7.32 LTS, and 7.16
  for Windows 7/2008 R2 systems. The Falcon sensor for Mac, Linux, and Legacy Systems
  are not affected. \n\n\n\n\nThis vulnerability could expose an arbitrary file write
  to protected locations from an unprivileged context, potentially leading to local
  privilege escalation.\n\n\n\n\nThe CrowdStrike Laroux Malware Cleanup Tool, based
  off of the same feature in the CrowdStrike Falcon sensor for Windows, is also affected.
  An update for this tool is also available immediately."
