title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhsi:
  omap_ssi_core: fix missing DMA mask setup for SSI controller device\n\nThe OMAP
  SSI driver uses a synthetic HSI controller device allocated via\nhsi_alloc_controller(),
  which does not go through the normal OF/platform\ndevice initialization path.\n\n\
  As a result, the embedded struct device does not have a DMA mask\ninitialized by
  default.\n\nAfter recent DMA API hardening changes, dma_map_sg() and related helpers\n\
  now require a valid dma_mask to be present, otherwise the driver may\ncrash or trigger
  warnings when attempting DMA mapping operations.\n\nFix this by explicitly initializing
  the DMA mask for the SSI controller\ndevice and setting a 32-bit DMA mask, which
  matches the hardware\ncapabilities."
