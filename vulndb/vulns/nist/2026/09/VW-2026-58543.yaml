title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/vmscan:
  report RCU-tasks quiescent states in shrink_lruvec()\n\nI am seeing some rcu_tasks
  stalls in the Meta fleet during reclaim.\n\n  INFO: rcu_tasks detected stalls on
  tasks:\n\t0000000088620d09: .. nvcsw: 6735/6735 holdout: 1 idle_cpu: -1/8\n\ttask:GlobalCPUThread
  state:R  running task  pid:2552016 tgid:2524552\n  Call Trace:\n   shrink_lruvec\n\
  \   mem_cgroup_iter\n   shrink_node\n   do_try_to_free_pages\n   try_to_free_pages\n\
  \   __alloc_frozen_pages_noprof\n   alloc_pages_noprof\n   pte_alloc_one\n   __pte_alloc\n\
  \   handle_mm_fault\n\nNothing promises direct reclaim returns in bounded time,
  and the scan loop\nin shrink_lruvec() only calls cond_resched(), which is a no-op
  on\nPREEMPTION kernels.  Involuntary preemption is not a Tasks-RCU quiescent\nstate,
  so the reclaiming task never reports one and becomes a holdout.\n\nUpgrade it to
  cond_resched_tasks_rcu_qs(), which reports a quiescent state\neven when cond_resched()
  does nothing.\n\nPS"
