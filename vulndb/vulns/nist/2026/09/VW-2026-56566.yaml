title: The Okta Privileged Access client URL handler does not insert an option 
  terminator before appending the target value to the command-line arguments. 
  When a scaleft:// protocol handler link contains a value beginning with a 
  hyphen, the underlying CLI framework interprets it as a command-line flag, 
  causing unintended modification of the SSH client's behavior.
