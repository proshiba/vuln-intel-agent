title: Incorrect Authorization (CWE-863) in project name normalization 
  (ProjectUtil.stripGitSuffix) and ProjectCache eviction logic 
  (ProjectCacheImpl) in Gerrit Code Review versions 2.16.0 through 3.12.9, 
  3.13.0 through 3.13.8, and 3.14.0 through 3.14.2 allows an authenticated user 
  (or an unauthenticated user if the repository was previously public) to cause 
  unauthorized disclosure of private repository content and durable restoration 
  of revoked project-owner administrative privileges via crafted requests using 
  repeated .git suffixes (such as project.git.git) across REST APIs, Gitiles, or
  SSH Git commands. Because Gerrit strips only a single terminal .git suffix 
  when constructing the logical ProjectCache key while JGit (FileKey.lenient) 
  resolves the suffixed alias to the same canonical bare repository on disk, 
  revoking read access or removing owner rules on the canonical project name 
  fails to evict the cached alias ProjectState during the cache validity window,
