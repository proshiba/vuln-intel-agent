title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm/pat:
  Take cpa_lock around large-page collapse\n\nLoading and unloading modules concurrently
  on several CPUs on a KASAN\nbuild, with a short delay injected at the CPA page-table
  lookup to\nwiden the window, faults within minutes:\n\n  BUG: KASAN: use-after-free
  in __change_page_attr+0x7cc/0x7e0\n  Write of size 8 at addr ffff888181139718 by
  task modprobe\n  ...\n  The buggy address belongs to the physical page:\n   pfn:0x181139
  ... page_type: f2(table)\n\ncpa_collapse_large_pages() rebuilds a leaf PMD from
  its 4K PTEs and\nfrees the old PTE-table pages, while __change_page_attr() fetches
  a\nPTE pointer from a lockless lookup_address_in_pgd_attr() and writes\nit with
  set_pte_atomic() only later. When module text is served from\na shared large ROX
  mapping the two run on the same PMD:\n\n  CPU A (module load)              CPU B
  (module finalize)\n  -------------------              -----------------------\n\
  \  execmem_make_temp_rw\n   set"
