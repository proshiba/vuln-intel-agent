title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel:
  ethosu: Ensure SRAM size is 0 on mapping failure\n\nOn a mapping failure of the
  SRAM, the SRAM size is left as non-zero. The\nprobe will succeed as the error return
  is not checked since having SRAM is\nnot a hard requirement. The non-zero size allows
  jobs to access SRAM which\nis left pointing to physical base address 0x0."
