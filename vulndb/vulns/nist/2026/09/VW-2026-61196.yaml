title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  validate MOVE_RANGE destination size\n\nF2FS_IOC_MOVE_RANGE checks the source range,
  but not the destination end\nbefore updating i_size. A source hole can expose this:
  __clone_blkaddrs()\nskips NULL_ADDR entries and returns success, so the caller can
  still extend\nthe destination inode with unchecked pos_out + len.\n\nReject destination
  overflow and use inode_newsize_ok() before extending\nthe destination inode."
