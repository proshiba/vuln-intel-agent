title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  ahci: fail probe if BAR too small for claimed ports\n\nWhen an AHCI controller is
  disabled in BIOS, its HOST_CAP register may\ncontain a bogus value, e.g. 0xFFFFFFFF.\n\
  \nSince CAP.NP (Number of Ports) is a zeroes based 5-bit register field,\na value
  of 0x1f means 32 ports. If CAP.NP claims more ports than can\nphysically fit within
  the mapped BAR region, accessing port registers\nbeyond the BAR boundary causes
  a kernel panic.\n\nAdd validation in ahci_init_one() to check that the BAR size
  is\nsufficient for the number of ports claimed in CAP.NP. The check\ncalculates
  the required MMIO size as:\n\n  required_size = 0x100 (global registers) + max_ports
  * 0x80\n\nIf required_size exceeds the actual BAR size, the probe fails with\n-ENODEV,
  preventing the panic and providing a clear error message.\n\n[cassel: commit log]"
