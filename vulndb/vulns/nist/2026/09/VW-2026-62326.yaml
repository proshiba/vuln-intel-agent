title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  xilinx: formatter_pcm: fix stream_data leak on open error\n\nIn xlnx_formatter_pcm_open(),
  stream_data is allocated and\nadata->play_stream or adata->capture_stream is assigned
  early.  If a\nlater step, such as snd_pcm_hw_constraint_step() or\nsnd_pcm_hw_constraint_integer(),
  fails, the function returns the error\nimmediately.  ALSA does not call the close
  callback when open fails, so\nstream_data is leaked and the stream pointer is left
  dangling, pointing\nto a substream that ALSA frees.  A later interrupt would then
  call\nsnd_pcm_period_elapsed() on the freed substream.\n\nFree stream_data and clear
  the stream pointer on the error paths."
