title: The ‘/password/guardarClau/recover’ endpoint accepts the ‘usuariId’ 
  parameter, which specifies the account whose password is to be changed. The 
  JWT token for the recovery process is not validated against the user specified
  in that parameter. An unauthenticated attacker could manipulate the identifier
  and reset the password for any account, including administrative accounts, 
  which could allow them to take control of the account.
