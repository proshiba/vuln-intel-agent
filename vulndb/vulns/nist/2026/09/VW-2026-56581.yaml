title: "`OpenTelemetry.Resources.Host` NuGet package, which provides OpenTelemetry
  resource detectors for host, is affected by an untrusted search path vulnerability
  on macOS. Prior to version 1.16.0-beta.2, the `host.id` resource attribute detector
  launches the `sh` and `ioreg` executables by bare name rather than by absolute path,
  so both are resolved through the `PATH` environment variable. A local attacker who
  is less privileged than the host application, and who can influence `PATH` or write
  to a directory that appears in `PATH` ahead of the system directories, can have
  an arbitrary binary executed in the application's security context, resulting in
  local code execution/privilege escalation. This vulnerability only affect macOS
  hosts - Linux and Windows hosts are unaffected. Version 1.16.0-beta.2 contains a
  patch. No known workarounds are available."
