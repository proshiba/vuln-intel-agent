title: "The open-vsx.org deployment returned Access-Control-Allow-Origin reflecting
  the requesting origin together with Access-Control-Allow-Credentials: true on the
  authenticated /user/ endpoints. A page on any origin could therefore issue credentialed
  requests to the service in a logged-in user's browser and read the responses.\n\n\
  \n\nThis exposed /user (login name, avatar, homepage, tokens URL), /user/tokens,
  /user/namespaces, /user/extensions, /user/search/{name} and /user/namespace/{name}/members,
  and — because /user/csrf was readable the same way — allowed the CSRF protection
  on write endpoints to be defeated. Chaining the two, an attacker page could call
  /user/token/create and exfiltrate a personal access token carrying publish and delete
  rights over the victim's namespaces.\n\n\n\nThe headers were emitted by the CDN/edge
  layer, not by the application: the Open VSX software sets allowCredentials(true)
