title: Discourse is an open-source discussion platform. Prior to 2026.1.8, 
  2026.6.3, 2026.7.2, and 2026.8.0, the video placeholder component allowed 
  crafted HTML to cause an attribute breakout and inject an attacker-controlled 
  event handler. An authenticated user with default trust-level posting 
  privileges could store the crafted placeholder in a post. When another user 
  opened the post and clicked the video play overlay, the handler could execute 
  arbitrary JavaScript in the viewer's session. Default Content Security Policy 
  settings block inline event handlers, but instances with CSP disabled or 
  relaxed could allow the script to read page content and make authenticated 
  requests as the viewer. This issue is fixed in versions 2026.1.8, 2026.6.3, 
  2026.7.2, and 2026.8.0.
