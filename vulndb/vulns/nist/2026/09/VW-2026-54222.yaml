title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_tcm: keep port count until LUN teardown completes\n\ntcm_usbg_drop_nexus()
  permits session removal once tpg_port_count\nreaches zero. However, usbg_port_unlink()
  currently decrements that\ncount from the fabric_pre_unlink() callback, before core_dev_del_lun()\n\
  waits for active se_lun references to drain.\n\nIf removal of the last LUN races
  a nexus removal, the latter can observe\na zero port count and call target_remove_session().
  This frees\nsess_cmd_map while an in-flight struct usbg_cmd, including its work
  item,\ncan still be accessed.\n\nOverlapping the last-LUN unlink with nexus removal
  reproduces this\nlifetime violation as a DEBUG_OBJECTS \"free active\" warning for\n\
  usbg_cmd_work, followed by a target-core BUG/Oops.\n\nThe generic target-core unlink
  path has no callback after\ncore_dev_del_lun() completes. Add an optional fabric_post_unlink()\n\
  callback and use it for the f_tcm port count. The count now remains\nnonz"
