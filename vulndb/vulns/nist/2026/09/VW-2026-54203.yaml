title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qcom-rng - Remove crypto_rng interface\n\nqcom-rng.c exposes the same hardware through
  two completely separate\ninterfaces, crypto_rng and hwrng.  However, the implementation
  of this\nis buggy because it permits generation operations from these interfaces\n\
  to run concurrently with each other, accessing the same registers.  That\nis, qcom_rng_generate()
  synchronizes with itself but not with\nqcom_hwrng_read().  This results in potential
  repetition of output from\nthe RNG, output of non-random values, etc.\n\nFortunately,
  there's actually no point in hardware RNG drivers\nimplementing the crypto_rng interface.\
  \  It's not actually used by\nanything besides the \"rng\" algorithm type of AF_ALG,
  which in turn is\nnot actually used in practice.  Other crypto_rng hardware drivers
  are\nlikewise being phased out, leaving just the hwrng support.\n\nThus, remove
  it to simplify the code and avoid conflict (and confusion)\nwith the hwrng inte"
