title: "A flaw was found in the Ansible Automation Platform automation controller.
  The\nexternal logging (rsyslog) configuration is generated by interpolating\nuser-controlled
  settings — LOG_AGGREGATOR_HOST, LOG_AGGREGATOR_MAX_DISK_USAGE_PATH\nand LOG_AGGREGATOR_RSYSLOGD_ERROR_LOG_FILE
  — into an rsyslog RainerScript config\nfile without neutralizing RainerScript syntax.
  A privileged (superuser) user can\ninject rsyslog directives, including an omprog
  action, causing arbitrary command\nexecution inside the control-plane rsyslog component.
  This allows disclosure of\nthe controller SECRET_KEY and database credentials, decryption
  of all stored\ncredentials, and full compromise of the control plane."
