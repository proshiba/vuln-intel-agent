title: "In the Linux kernel, the following vulnerability has been resolved:\n\necryptfs:
  release message context on send failure\n\necryptfs_send_message_locked() moves
  a message context from the free\nlist to the allocated list before sending the request
  to the userspace\ndaemon.\n\nIf ecryptfs_send_miscdev() fails, the context is left
  on the\nallocated list and cannot be reused. Move it back to the free list on\n\
  failure and clear the caller's pointer."
