title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  sensor: custom: Fix field sysfs group cleanup on failure\n\nhid_sensor_custom_add_attributes()
  creates one sysfs group for each\ncustom sensor field. If sysfs_create_group() fails
  after some groups\nhave already been created, the function returns the error without\n\
  removing the previously created groups.\n\nAdd a local unwind path to remove the
  groups that were already created.\nWith enable_sensor exposed only after the field
  attributes are ready,\nthis path can free sensor_inst->fields without leaving enable_sensor\n\
  able to access pointers into that array."
