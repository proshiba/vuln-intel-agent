title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/pwrctrl:
  tc9563: Fix parsing the integrated Ethernet MAC Endpoint node\n\nDSP3 has an integrated
  Ethernet MAC Endpoint which has its own set of\nconfig registers for configuring
  settings such as ASPM. The Endpoint device\nhas two physical functions and those
  two functions share the same settings.\n\nParse the Endpoint node under DSP3 instead
  of parsing both functions.  The\nexisting parsing logic also has one OOB issue as
  parsing both functions\nwill result in accessing past the tc9563_pwrctrl->cfg array."
