title: Vaultwarden through 1.37.3 omits organization membership status 
  validation from three cipher access-restriction queries, allowing revoked and 
  not-yet-confirmed members to retain read, write, delete, and attachment access
  to organization ciphers. Attackers with revoked or pending membership can 
  exploit missing status filters in get_user_collections_access_flags, 
  get_group_collections_access_flags, and is_in_full_access_group to access 
  protected cipher data server-side.
