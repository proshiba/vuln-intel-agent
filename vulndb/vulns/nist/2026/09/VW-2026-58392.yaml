title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  skip sufficiently large global buffers when resizing\n\nz_erofs_gbuf_nrpages is
  advanced only after every global buffer has been\ngrown. If a resize fails after
  some buffers were enlarged, a retry\nrevisits those enlarged buffers.\n\nRetrying
  the same size then returns -ENOMEM because alloc_pages_bulk()\nhas no pages to add
  and the unchanged return value is treated as a\nfailure. Retrying an intermediate
  size allocates a temporary pointer\narray smaller than gbuf->nrpages and copies
  more existing pointers than\nthe array can hold.\n\nSkip buffers that already satisfy
  the request. Once all remaining\nbuffers have caught up, advancing z_erofs_gbuf_nrpages
  again describes\nthe guaranteed minimum size across the pool."
