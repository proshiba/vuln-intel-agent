title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject MEM_ALLOC BTF accesses past object bounds\n\nBTF struct walks relax the struct-size
  check for accesses through a\ntrailing flexible array. That is valid for ordinary
  BTF type walking, but\nPTR_TO_BTF_ID | MEM_ALLOC values point to objects allocated
  with the static\nBTF type size.\n\nWhen walking a MEM_ALLOC object, reject the access
  before applying the\nflexible-array relaxation if the access range extends past
  the struct size.\nApply the same policy to struct ID matching so kfunc and kptr
  type checks\ndo not walk past the allocated object bounds either."
