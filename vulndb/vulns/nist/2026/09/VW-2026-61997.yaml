title: admin3 through 3.0.0 fails to invalidate existing sessions when disabling
  a user account, allowing attackers to retain authenticated access with 
  original permissions. Attackers can continue using bearer tokens issued before
  account disablement to authenticate requests, as the AuthInterceptor never 
  re-validates the user's locked status and session expiry resets on each 
  request.
