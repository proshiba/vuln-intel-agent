title: "MISP contains an insecure direct object reference vulnerability in the processModuleResultsData
  method of the Event model. When processing module results, the code iterates over
  EventReport entries supplied in the resolved data and saves each one. Unlike the
  adjacent attribute and object processing loops, the report loop did not unset the
  client-supplied 'id' field before calling save(). Because the MISP EventReport model's
  create() method does not strip the id field, an authenticated user with permission
  to submit module results could include an 'id' value referencing an existing report
  belonging to a different event. Upon save(), the ORM would update that existing
  row rather than insert a new one, allowing the attacker to \n\n - read the content
  of another event's report by reparenting it into their own event\n - overwrite the
  report's fields with attacker-controlled data\n - change the report's event_id to
  redirect ownership. \n\n\n\n\nThis constitutes an authorization bypass through a
  user-"
