title: PJSIP is a free and open source multimedia communication library written 
  in C. Prior to commit 673b978, a remote out-of-bounds read and write can occur
  in the SDP negotiator when the remote payload-type map maintenance feature is 
  enabled. assign_pt_and_update_map() in pjmedia/src/pjmedia/sdp_neg.c uses 
  payload-type numbers taken from a remote SDP offer or answer to index 
  fixed-size internal tables without sufficient bounds validation, so a crafted 
  remote SDP can cause memory access outside those tables. The practical impact 
  is memory corruption and denial of service; code execution is not 
  demonstrated. This path is only reached when 
  PJMEDIA_SDP_NEG_MAINTAIN_REMOTE_PT_MAP is enabled. The default is disabled, so
  default builds are not affected; the feature is an interoperability option 
  that integrating products may enable. This issue has been patched via commit 
  673b978.
