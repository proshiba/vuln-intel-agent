title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-cgroup:
  skip dying blkg in blkcg_activate_policy()\n\nWhen switching IO schedulers on a
  block device, blkcg_activate_policy()\ncan race with concurrent blkcg deletion,
  leading to a use-after-free in\nrcu_accelerate_cbs.\n\nT1:                     \
  \          T2:\n                                  blkg_destroy\n               \
  \                   kill(&blkg->refcnt) // blkg->refcnt=1->0\n                 \
  \                 blkg_release // call_rcu(__blkg_release)\n                   \
  \               ...\n                                  blkg_free_workfn\n      \
  \                            ->pd_free_fn(pd)\nelv_iosched_store\nelevator_switch\n\
  ...\niterate blkg list\nblkg_get(blkg) // blkg->refcnt=0->1\n                  \
  \                list_del_init(&blkg->q_node)\nblkg_put(pinned_blkg) // blkg->refcnt=1->0\n\
  blkg_release // call_rcu again\nrcu_accelerate_cbs // uaf\n\nFix this by checking
  hlist_unhashed(&blkg->blkcg_node) before getting\na referen"
