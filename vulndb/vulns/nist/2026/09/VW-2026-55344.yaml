title: A weakness has been identified in aircheng-org iWebShop-5 up to 5.15. The
  affected element is the function member_list of the file 
  controllers/member.php. This manipulation of the argument Search causes sql 
  injection. The attack is possible to be carried out remotely. The exploit has 
  been made available to the public and could be used for attacks. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
