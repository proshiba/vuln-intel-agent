title: "Protocol::HTTP2 versions before 1.14 for Perl allow memory exhaustion via
  closed streams that stream_state never removes from the connection stream table.\n\
  \nWhen a stream reaches the CLOSED state, stream_state returns the concurrency slot
  and clears most of the stream's keys, but the entry itself stays in the connection
  stream table and nothing in the distribution removes it. Stream identifiers increase
  monotonically, so a peer can open and close streams on one connection indefinitely,
  each close leaving a residual entry that is retained for the life of the connection.\n\
  \nSETTINGS_MAX_CONCURRENT_STREAMS does not bound this. That setting caps how many
  streams are live at once and is enforced, while the growth is made of streams the
  cap has already released, so it accumulates with concurrency never exceeding one.
  The client keeps the same table and grows the same way against a hostile server.\n\
  \nMeasured against a server built on this module, roughly 920 bytes are retained
  per closed stream f"
