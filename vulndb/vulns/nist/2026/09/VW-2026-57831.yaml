title: 'Suricata is a network Intrusion Detection System, Intrusion Prevention System
  and Network Security Monitoring engine. Starting in version 8.0.0 and prior to version
  8.0.5, LDAP transaction state could store an unbounded number of responses. Because
  LDAP can be processed over UDP, crafted traffic may cause Suricata to consume excessive
  memory, potentially resulting in denial of service. Version 8.0.5 contains a fix.
  As a workaround, disable LDAP application-layer parsing where it is not required.
  Alternatively, use a rule like `alert ldap any any -> any any (sid: 1; ldap.responses.count:
  >1024; bypass;)`.'
