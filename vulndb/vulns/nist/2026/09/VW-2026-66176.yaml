title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: fix chan mode for LE_CONN_REQ + EXT_FLOWCTL pchan\n\nl2cap_new_connection()
  sets default value of channel mode to match the\nparent channel.  l2cap_le_connect_req()
  left this at the default, and\ncreated L2CAP_MODE_EXT_FLOWCTL channels if listening
  pchan has that\nmode.  This causes FLAG_DEFER_SETUP channels to reply to\nL2CAP_LE_CONN_REQ
  with L2CAP_ECRED_CONN_RSP, which is incorrect.\n\nIt can also result to stack OOB
  write (of l2cap_alloc_cid determined\nvalues) in l2cap_ecred_rsp_defer(), as l2cap_le_connect_req()
  does not\nlimit maximum number of deferred channels or check for duplicate ident.\n\
  \nFix by setting chan->mode correctly in l2cap_le_connect_req().\n\nAlso check channel
  mode in l2cap_ecred_rsp_defer(), and do WARN_ON_ONCE\ninstead of OOB write to make
  it less brittle."
