title: "A hard-coded\ncryptographic key vulnerability exists in the web module of
  TP-Link Archer\nAX55 v4. A LAN attacker who captures an HTTP login session may use
  the known\nshared RSA private key to decrypt the administrator password; the\nweakened
  AES session key further reduces the effort required to\ncompromise session confidentiality.\n\
  \n\n\n\n\nSuccessful\nexploitation may disclose the administrator password captured
  from an HTTP\nlogin session and compromise session confidentiality."
