title: "In the Linux kernel, the following vulnerability has been resolved:\n\nptp:
  netc: fix period truncation and potential divide-by-zero in PEROUT\n\nThe max_period
  bound in net_timer_enable_perout() was computed as:\n\n  max_period = (u64)NETC_TMR_DEFAULT_FIPER
  + integral_period;\n\nwhich exceeds U32_MAX when integral_period > 0 (e.g. 0x100000002
  for\nthe default 333333333 Hz clock). A period_ns that passes this check but\nexceeds
  U32_MAX is then silently truncated when stored into the u32\nstruct netc_pp::period
  field.\n\nA truncated value of zero can reach netc_timer_set_perout_alarm(), where\n\
  the local u32 period variable would also be 0, causing a divide-by-zero\nin roundup_u64(delta,
  period) whenever the stime < min_time branch is\ntaken (which always happens for
  a start time of {0, 0}).\n\nAdditionally, netc_timer_enable_periodic_pulse() and\n\
  netc_timer_enable_fiper() both compute:\n\n  fiper = pp->period - integral_period;\n\
  \nA zero pp->period results in an unsigned wraparound to 0xFFFFFFFD,\nmis-programm"
