title: KubeEdge is an open source system for extending native containerized 
  application orchestration capabilities to hosts at Edge. From 1.16.0 until 
  1.21.2, 1.22.2, and 1.23.1, the DecompressTarGz function in 
  keadm/cmd/keadm/app/cmd/util/common.go joins archive entry names to the 
  extraction destination without sufficient validation. During keadm join or 
  installation on Windows edge nodes, an archive influenced through a 
  compromised, replaced, or untrusted download source can contain 
  parent-directory components, Windows-style backslashes, absolute paths, or 
  drive-prefixed paths that escape the intended directory. The affected keadm 
  process can consequently write or overwrite files with its own privileges, 
  potentially modifying configuration, executable, or service files and enabling
  persistent system modification or code execution. This issue is fixed in 
  versions 1.21.2, 1.22.2, and 1.23.1.
