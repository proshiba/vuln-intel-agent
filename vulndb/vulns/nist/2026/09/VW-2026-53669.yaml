title: Gardens v2 is a modular governance framework that enables communities to 
  create and manage multiple governance pools with customizable parameters and 
  voting mechanisms. Prior to 0xc9d4e0dacd937364793278180551e59d93cd43f9, 
  StreamingEscrow.claim() correctly rejects withdrawals while an escrow is 
  disputed, but the permissionless syncOutflow() path performs the same 
  excess-balance transfer without checking disputed. After a streaming proposal 
  is challenged, anyone can call syncOutflow() to transfer escrowed SuperTokens 
  to the proposal beneficiary while the dispute is pending. If the proposal is 
  later rejected, those tokens cannot be recovered by drainToStrategy(). This 
  issue has been patched in 0xc9d4e0dacd937364793278180551e59d93cd43f9.
