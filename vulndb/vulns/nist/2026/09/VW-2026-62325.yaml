title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirewire:
  core: fix memory leak in error path of build_tree()\n\nIn the error path of build_tree(),
  node instances can remain in the local\nlinked list when the function returns.\n\
  \nWhenever an invalid value is detected in the self ID sequence, each\nallocated
  node instance is either an entry in the linked list or an\nentry in the ports array
  of its parent node. Therefore, the allocate\nnode instances can be safely released
  by traversing the linked list from\nits head.\n\nRelease the remaining node instances
  with for_each_fw_node() before\nreturning to the caller."
