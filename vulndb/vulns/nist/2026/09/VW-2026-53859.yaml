title: MOOS-IvP through 24.8.1 contains a buffer overflow vulnerability in 
  StringToIvPFunction() where dimension, piece, and degree counts from encoded 
  BHV_IPF payloads are used as allocation sizes and loop bounds without 
  validation. Attackers can supply crafted payloads with mismatched dimension 
  values to write attacker-controlled doubles past the end of the IvPBox weight 
  array, causing memory corruption and potential code execution.
