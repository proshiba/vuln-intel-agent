title: An improper certificate/host key validation vulnerability was discovered 
  in the Smart Polling functionality, which established encrypted connections to
  target devices without validating the remote host's identity, and no option 
  was provided to enable it. A man-in-the-middle attacker positioned between a 
  sensor and a polled device can, during a polling session, impersonate the 
  device and intercept the communication, including the credentials used to 
  access it. The captured credentials can then be replayed to authenticate 
  against the device itself or against other devices sharing the same 
  credentials, allowing the attacker to access and tamper with the device's data
  and to disrupt its operations.
