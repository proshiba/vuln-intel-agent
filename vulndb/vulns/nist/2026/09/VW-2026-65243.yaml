title: A flaw was found in the Admin REST API of Keycloak, an identity and 
  access management solution. The endpoints used to retrieve groups associated 
  with a specific role do not properly check for individual group visibility 
  permissions. This allows a delegated administrator with basic search 
  privileges to view detailed information about all groups assigned to a role, 
  bypassing intended security restrictions that should limit their view to 
  specific groups.
