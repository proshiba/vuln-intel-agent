title: AVideo through commit c91b5975d contains a server-side request forgery 
  vulnerability in the EPG parser that allows authenticated uploaders to fetch 
  arbitrary internal URLs. An attacker can supply an internal URL via the 
  epg_link parameter during video upload, which is validated only for syntax and
  later fetched server-side during EPG generation without SSRF protection 
  checks.
