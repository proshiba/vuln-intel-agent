title: A flaw was found in kube-compare. When processing a 'container://' 
  reference path, the tool incorrectly executes an untrusted container image's 
  entrypoint instead of merely extracting data from a stopped container. This 
  allows a remote attacker to achieve arbitrary code execution on the operator's
  workstation. If the Docker daemon requires elevated privileges, the untrusted 
  code may execute with root-mediated daemon privileges, posing a significant 
  security risk.
