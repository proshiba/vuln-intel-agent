  extension through 2.0.1 for TYPO3. It fails to verify whether a specified 
  content element identifier is permitted by the plugin. This enables an 
  unauthenticated user to display various content elements, leading to an 
  insecure direct object reference (IDOR) issue with the potential to expose 
  internal content elements.
