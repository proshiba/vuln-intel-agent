title: Improper Neutralization of Input During Web Page Generation ('Cross-site 
  Scripting') in Apache Roller 6.1.5 allows a user with media-upload rights to 
  store active content on Roller's origin, because the media upload feature 
  trusts the upload-supplied content type and serves the stored file back with 
  that type. A victim who opens the uploaded file executes the stored script. 
  Media uploads are disabled by default; only installations that enable them are
  affected, and the shipped type restrictions do not block active content once 
  uploads are on. Users are recommended to upgrade to Apache Roller 6.1.6 or 
  later, which derives the stored type from file content and serves non-image 
  media as a download.
