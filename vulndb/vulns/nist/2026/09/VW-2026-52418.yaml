title: "Allocation of Resources Without Limits or Throttling vulnerability in ash-project
  ash_typescript allows an unauthenticated attacker to exhaust the BEAM atom table
  and abort the node via client-supplied RPC field names.\n\nAshTypescript.FieldFormatter.convert_to_field_atom/2
  in lib/ash_typescript/field_formatter.ex converts a client-supplied field name to
  an atom with String.to_atom/1 when no matching atom already exists. It delegates
  first to parse_input_field/2, which resolves the name with String.to_existing_atom/1
  and falls back to returning the plain string; convert_to_field_atom/2 then mints
  an atom from that string rather than treating the name as unknown.\n\nRPC field
  selection reaches it for every requested field name through AshTypescript.Rpc.FieldProcessing.FieldSelector,
  which resolves each name before checking that the field exists, with no allowlist,
  length bound, or rate limit. Atoms are never garbage collected, so each distinct
  name mints a permanent one and the VM aborts on"
