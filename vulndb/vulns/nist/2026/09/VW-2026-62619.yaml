title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ufs: core: Avoid possible memory reclaim deadlock in TX EQTR context\n\nTX EQTR
  may run while devfreq gear scaling has quiesced the UFS\ntagset. In that context,
  functions ufshcd_tx_eqtr(), __ufshcd_tx_eqtr()\nand ufs_qcom_get_rx_fom() allocate
  memory with GFP_KERNEL. If direct\nreclaim is triggered, reclaim/writeback can depend
  on I/O to UFS\ndevice. Because the queue is quiesced, this can cause deadlock.\n\
  \nUse memalloc_noio_save/restore() in ufshcd_tx_eqtr() to cover all\nallocations
  in the TX EQTR call tree, including:\n\n - params->eqtr_record in ufshcd_tx_eqtr()\n\
  \n - eqtr_data in __ufshcd_tx_eqtr()\n\n - params in ufs_qcom_get_rx_fom()\n\nThis
  is preferred over tagging individual call sites with GFP_NOIO, as it\nautomatically
  covers any future allocations added anywhere in the call tree\nwithout requiring
  each caller to be aware of this constraint.\n\n[mkp: fix label as suggested by Bart]"
