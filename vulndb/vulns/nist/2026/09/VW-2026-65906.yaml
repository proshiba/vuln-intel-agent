title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix one-byte OOB read in smb2_parse_native_symlink()\n\nWhen parsing a share-root
  relative native symlink, memcpy copies\nsmb_target+1 (skipping the leading separator)
  but uses\nstrlen(smb_target)+1 as the length, reading one byte past the\nallocated
  buffer.\n\nThis fixes the following KASAN splat when accessing an SMB symlink\n\
  with a target of '\\a\\b':\n\n  BUG: KASAN: slab-out-of-bounds in smb2_parse_native_symlink+0x4f5/0xca0\n\
  \  Read of size 5 at addr ffff88800878fe21 by task netfsfuzz-execu/1\n  CPU: 1 UID:
  0 PID: 1 Comm: netfsfuzz-execu Tainted: G N\n  7.2.0-11943-g2709dd5ae32f-dirty #1
  PREEMPT(lazy)\n  Hardware name: QEMU Ubuntu 24.04 PC v2 (i440FX + PIIX, arch_caps
  fix,\n  1996)\n  Call Trace:\n   <TASK>\n   dump_stack_lvl+0x7b/0xa0\n   print_report+0xd0/0x630\n\
  \   kasan_report+0xe5/0x120\n   kasan_check_range+0x105/0x1b0\n   __asan_memcpy+0x23/0x60\n\
  \   smb2_parse_native_symlink+0x4f5/0xca0\n   parse_reparse_point+0x68a/0x1"
