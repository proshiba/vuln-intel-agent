title: Svelte devalue is a JavaScript library that serializes values into 
  strings when JSON.stringify isn't sufficient for the job. Prior to 5.9.2, 
  devalue.parse does not reject out-of-bounds indices that are greater than or 
  equal to values.length in src/parse.js. A specially crafted untrusted payload 
  can make the parser alternate between array representations, producing 
  quadratic work as the payload grows and causing denial of service in 
  applications that parse untrusted devalue data. This issue is fixed in version
  5.9.2.
