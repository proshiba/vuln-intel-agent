title: A security vulnerability has been detected in moxi159753 Mogu Blog v2 up 
  to 5.2. The impacted element is the function FileOperation.unzip of the file 
  /networkDisk/unzipFile of the component ZIP File Handler. Such manipulation of
  the argument fileUrl leads to path traversal. The attack may be launched 
  remotely. The exploit has been disclosed publicly and may be used. The vendor 
  was contacted early about this disclosure but did not respond in any way.
