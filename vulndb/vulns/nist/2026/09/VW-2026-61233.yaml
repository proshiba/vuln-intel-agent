title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  saa7164: fix cleanup on resource allocation failure\n\nsaa7164_dev_setup() adds
  the device to the global saa7164_devlist before\nrequesting the PCI BAR memory regions.\n\
  \nIf get_resources() fails, saa7164_dev_setup() decrements the device count\nand
  returns an error, but leaves the device on saa7164_devlist. The probe\nerror path
  then frees the device, leaving a dangling entry on the global\nlist.\n\nReuse the
  existing MMIO mapping error path to remove the device from\nsaa7164_devlist and
  decrement the device count before returning.\n\nAlso release BAR0 if it was successfully
  requested but the BAR2 request\nfails."
