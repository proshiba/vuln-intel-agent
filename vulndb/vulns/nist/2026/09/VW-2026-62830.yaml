title: A security vulnerability has been detected in Dromara mayfly-go up to 
  1.11.5. The affected element is an unknown function of the file 
  server/internal/ai/api/ai.go of the component AI Assistant. The manipulation 
  leads to missing authorization. Remote exploitation of the attack is possible.
  The exploit has been disclosed publicly and may be used. The identifier of the
  patch is 74bcb926eb4f5f94e7681144d7bf2168a0ec7cde. Applying a patch is the 
  recommended action to fix this issue. The whitelist bypass is one-token wide. 
  Any compound command containing curl, wget or sed auto-runs without approval; 
  approval is granted by the same session user (self-approval). This issue got 
  fixed with a silent patch.
