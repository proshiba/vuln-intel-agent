title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to 3.6.15 and 3.7.2, 
  packages/renderer/MdToHtml/rules/fountain.ts passes HTML generated by the 
  vendored fountain.js renderer into note output without sanitizing it. A 
  malicious Fountain code block can therefore execute script when Fountain 
  rendering is enabled in desktop or mobile clients, or when a note is published
  through Joplin Server where Fountain rendering is enabled by default. The 
  script can read content subsequently loaded in the reused note viewer or, when
  published notes are served from the same domain as server content, access data
  available to an authenticated browser in the server origin. This issue is 
  fixed in versions 3.6.15 and 3.7.2.
