title: "Use of a One-Way Hash with a Predictable Salt vulnerability in team-alembic
  AshAuthentication allows readers of the audit store to recover the client IP addresses
  that the audit log add-on's :hash privacy mode is meant to pseudonymise.\n\nAshAuthentication.AddOn.AuditLog.IpPrivacy.hash_ip/1
  computes a single unkeyed :crypto.hash(:sha256, salt <> ip) and truncates the result
  to 16 hexadecimal characters. The salt is read from the :audit_log_ip_salt or :secret
  application config keys, and falls back to the constant \"default-salt-change-in-production\"\
  \ published in the library source when neither is set, with nothing warning that
  the default is in use. The IPv4 space is only 2^32 values and SHA-256 is fast, so
  the whole hash table is precomputable and every stored value maps back to its source
  address. Truncating to 16 characters does not help, and even a configured salt leaves
  the hash cheap enough to enumerate once it leaks.\n\nThis issue affects ash_authentication:
  from 4.12.0 before 4.15.0"
