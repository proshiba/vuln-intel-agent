title: An integer overflow was found in Corosync's handling of membership commit
  token messages. The length-validation check for these messages can be bypassed
  on 32-bit systems due to an integer overflow in the calculation of the 
  expected message length, allowing a crafted network packet to trigger an 
  out-of-bounds memory access that crashes the Corosync daemon. This results in 
  a denial of service for the affected cluster node. The overflow does not occur
  on 64-bit systems, where the length calculation is correctly performed in 
  64-bit arithmetic.
