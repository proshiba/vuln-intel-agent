title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: reject a tree connect response whose byte count is too small\n\nCIFSTCon()
  bounds its strnlen() over the byte area with the server's\nByteCount minus two,
  which for ByteCount 0 or 1 goes negative as an int\nand converts to a huge size_t.\
  \  The later subtraction wraps the __u16\nbytes_left, and that is what bounds cifs_strndup_from_utf16():
  a bound of\nup to 65535 against a ~16 KB cifs_req_poolp object runs off the end
  of the\nslab object, and the bytes reach userspace through tcon->nativeFileSystem\n\
  in /proc/fs/cifs/DebugData.\n\nReject a byte area too small for what the parser
  consumes.  Two bytes is\nthe least it can consume, and no conformant response carries
  fewer.  The\nnew trace point is the 129th smb_eio_trace entry, which __mode(byte)\n\
  cannot represent, so the attribute goes with it."
