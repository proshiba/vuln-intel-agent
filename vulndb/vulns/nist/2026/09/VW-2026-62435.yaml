title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  validate auto buf reg before taking uring_cmd\n\nWith UBLK_F_AUTO_BUF_REG, invalid
  sqe->addr can fail after\nublk_fill_io_cmd() has set UBLK_IO_FLAG_ACTIVE. The uring_cmd
  is\ncompleted while the tag stays active, which can hang teardown.\n\nSplit validation
  from buffer apply so the check has no side effects,\nthen take the uring_cmd and
  store the already-validated buffer. Apply\nthe same order in FETCH so io->buf is
  not written before __ublk_fetch()\nstate checks."
