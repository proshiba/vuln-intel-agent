title: The Datalogics Ecommerce Delivery – Datalogics plugin for WordPress is 
  vulnerable to authorization bypass in all versions up to, and including, 
  2.6.65. This is due to the plugin not properly verifying that a user is 
  authorized to perform an action. This makes it possible for authenticated 
  attackers, with subscriber-level access and above, to create and cancel real 
  shipping orders through the external logistics API using the store's stored 
  authentication token, modify arbitrary WooCommerce order post meta on any 
  order, overwrite the plugin's stored API token, and trigger shipping 
  notification emails to customers.
