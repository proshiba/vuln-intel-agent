title: Notepad++ is a free and open-source source code editor. Prior to 8.9.8, 
  the NPPM_SAVESESSION handler in PowerEditor/src/NppBigSwitch.cpp converts 
  lParam to a sessionInfo pointer and dereferences its nbFile, files, and 
  sessionFilePathName members without checking for null. A process running at 
  the same or a higher Windows integrity level on the same desktop can send 
  NPPM_SAVESESSION with a null lParam, immediately terminating Notepad++ and 
  causing denial of service and loss of unsaved documents. This issue is fixed 
  in version 8.9.8.
