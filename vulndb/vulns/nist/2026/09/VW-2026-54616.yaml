title: The JetFormBuilder WordPress plugin before 3.6.5.2 does not sanitize a 
  request parameter before rendering it as message content, allowing 
  unauthenticated users to execute arbitrary shortcodes registered on the site 
  on any page displaying a form. Escaping is applied to that content before a 
  later shortcode-expansion pass rather than after it, so the escaping can be 
  bypassed.
