title: The Newsletter – Send awesome emails from WordPress plugin for WordPress 
  is vulnerable to Reflected Cross-Site Scripting via the 'nn' parameter in all 
  versions up to, and including, 9.3.8 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that execute if they can successfully 
  trick a user into performing an action such as clicking on a link. Successful 
  exploitation requires the victim to be a logged-in administrator, as the 
  antibot check auto-passes for authenticated users, routing the unsanitized 
  payload through the administrator-visible output branch of dienow().
