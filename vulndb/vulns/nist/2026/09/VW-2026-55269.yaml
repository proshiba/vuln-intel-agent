title: OpenBSD before commit 1ee99df contains an inverted comparison 
  vulnerability in the ieee80211_michael_mic_failure() function within 
  sys/net80211/ieee80211_crypto_tkip.c that allows unauthenticated attackers 
  within RF range to trigger denial of service by sending two malformed TKIP 
  frames separated by more than 60 seconds. Attackers can exploit the reversed 
  TKIP MIC failure countermeasure window check to deauthenticate all associated 
  TKIP stations and block reassociation for up to 90 seconds, while 
  within-window MIC failures that should engage countermeasures are silently 
  discarded, leaving key-recovery attempts undetected.
