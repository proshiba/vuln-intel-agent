title: Opencast is a free, open-source platform to support the management of 
  educational audio and video content. Prior to versions 19.7 and 20.2, the 
  default security configuration in etc/security/mh_default_org.xml accepts a 
  client-selected JSESSIONID from the ;jsessionid= URL path parameter and does 
  not replace it when the victim logs in. An unauthenticated attacker can send a
  crafted link to a victim whose browser has no active Opencast session cookie, 
  wait for the victim to authenticate, and then reuse the known identifier as 
  the victim's authenticated session. This can expose the victim's data and 
  actions and can produce full administrative account takeover when the victim 
  is an administrator. This issue is fixed in versions 19.7 and 20.2.
