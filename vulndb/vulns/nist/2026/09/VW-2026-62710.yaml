title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211_hwsim: avoid NULL skb in stop queue drain\n\nmac80211_hwsim_stop() drops
  any frames left in data->pending. The loop\ncurrently checks skb_queue_empty() and
  then dequeues separately.\n\nThat split is racy with TX status handling, which can
  remove a pending\nframe under the queue lock. If the last entry is removed after
  the empty\ncheck, skb_dequeue() returns NULL and the stop path passes that NULL
  skb\nto ieee80211_free_txskb().\n\nUse skb_dequeue() as the loop condition instead.
  The dequeue result is the\nobject that stop owns and frees, and a concurrent status
  completion that\nempties the queue simply makes the loop terminate."
