title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  fix dc_lock leak on GPU reset error paths\n\nOn GPU reset, dm_suspend() takes dc_lock
  and leaves it for dm_resume()\nto drop. If amdgpu_dm_commit_zero_streams() or dm_dmub_hw_init()
  fails,\nthe function returns with the lock still held. The matching resume path\n\
  is then skipped, so every later dc_lock take hangs.\n\nRelease the cached DC state
  and unlock before returning the error."
