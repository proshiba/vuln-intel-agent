title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Keep refcount_acquire nullable for borrowed RCU kptrs\n\nbpf_refcount_acquire()
  is fallible for a borrowed reference because the\nobject may have reached a zero
  refcount. The verifier therefore keeps\nKF_RET_NULL on the return value unless the
  argument is an owning reference.\n\nAn RCU-protected load of a local kptr is marked
  MEM_ALLOC, but it only\nreceives NON_OWN_REF when the pointee contains a graph node.
  A refcounted\nobject without a graph node consequently looks like an owning reference\n\
  even though the loaded register has no acquired reference state. If the\nprogram
  drops the last real reference while remaining in the RCU critical\nsection, refcount_inc_not_zero()
  returns NULL while the verifier treats the\nresult as non-NULL.\n\nOnly classify
  the argument as owning when it is backed by a verifier-tracked\nreference. This
  retains the non-NULL return for pointers from bpf_obj_new(),\nbpf_kptr_xchg(), or
  an earlier success"
