title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/rocket:
  Fix error path handling in rocket_job_run()\n\nIn rocket_job_run(), after taking
  an extra fence reference for\njob->done_fence via dma_fence_get(), the error paths
  have three bugs:\n\n- The dma_fence reference held by job->done_fence is never released,\n\
  \  causing a reference leak.\n- pm_runtime_get_sync() increments the usage counter
  even on failure,\n  but the error path does not decrement it, leaking the runtime
  PM\n  reference and preventing the NPU from suspending.\n- A valid but unsignaled
  fence is returned to the DRM scheduler,\n  which triggers WARN(\"Fence ... released
  with pending signals!\")\n  when the scheduler drops its reference.\n\nFix by replacing
  pm_runtime_get_sync() with pm_runtime_resume_and_get()\nwhich auto-balances the
  usage counter on failure, releasing both fence\nreferences on error, and returning
  ERR_PTR(ret) instead of the\nunsignaled fence.\n\n[tomeu: Refactored error paths
  to use consolidated go"
