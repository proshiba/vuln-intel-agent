title: A flaw in MongoDB's JSON Schema validation error generation code allows 
  an authenticated user with readWrite privileges to crash the mongod server. 
  When a BSON document containing an array with a malformed numeric field name 
  fails a $jsonSchema items type constraint, the error generation path performs 
  unsafe numeric conversion on the user-controlled field name without proper 
  exception handling, resulting in an uncaught exception that terminates the 
  server process. This is possible because incoming wire protocol BSON 
  validation does not enforce that array element field names are valid, in-range
  numeric indices.
