title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: disconnect on CSA to channel 0\n\nThe refactor for the CSA parsing erroneously
  equates channel\nzero and no information present, leading it to ignore a CSA\non
  an AP that advertises a switch to that (invalid) channel.\nThis leads to not disconnecting,
  which we should. For Intel\ndevices, this can lead to a firmware crash.\n\nFix this
  by using an int type for the channel number as well\nas the opclass, and using a
  (negative) value that cannot be\nencoded in the element to indicate it's not present."
