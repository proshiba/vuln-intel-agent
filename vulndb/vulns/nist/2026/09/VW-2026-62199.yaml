title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  do not leak an hci_conn when a second LE connect is rejected\n\ncreate_le_conn_complete()
  decides whether the failed connection is\nstill pending by comparing it against
  hci_lookup_le_connect(), which\nreturns the first LE connection in BT_CONNECT. That
  is the same\nconnection only while at most one is pending.\n\nTwo can be pending.
  Connections created on the passive scan path sit\nin BT_CONNECT with HCI_CONN_SCANNING
  set and are invisible to\nhci_lookup_le_connect() until hci_le_create_conn_sync()
  clears the\nflag when their command is issued, so the -EBUSY guard in\nhci_connect_le()
  does not prevent a second connection from being\nqueued while the first is still
  on the scan path. Whenever two\nconnections are in BT_CONNECT at once, the lookup
  may return one\nconnection while create_le_conn_complete() is reporting the failure\n\
  of the other; the early exit then drops the error and hci_conn_failed()\nnever runs
  on the conn"
