title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  sgi-gru: remove interrupt-context page-table walks\n\nThe GRU TLB miss handler walks
  a process's page tables without holding\npage-table locks or a reference to the
  mapped page. It also uses a kernel\npage-table accessor on user page tables and
  supports only PMD-level large\nmappings on x86-64.\n\nRemove the direct walker.
  Send interrupt faults directly to user polling\nmode so the existing call-OS fallback
  retries them in process context.\n\nRemove the mmap-lock failure statistic that
  can no longer be incremented."
