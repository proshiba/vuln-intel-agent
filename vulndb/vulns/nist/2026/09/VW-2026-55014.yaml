title: A security flaw has been discovered in java-json-tools jackson-coreutils 
  2.0. This vulnerability affects the function TreePointer.tokensFromInput of 
  the file src/main/java/com/github/fge/jackson/jsonpointer/TreePointer.java of 
  the component JSON Pointer parser. The manipulation results in allocation of 
  resources. The attack can be executed remotely. The exploit has been released 
  to the public and may be used for attacks. The project was informed of the 
  problem early through an issue report but has not responded yet.
