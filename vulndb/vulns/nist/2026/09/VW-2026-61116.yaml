title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  reject restart table growth beyond U16_MAX entries\n\nDuring $LogFile replay, log_replay()
  indexes the transaction table by the\ntransact_id taken from the log record header.\
  \  check_log_rec() only\nverifies that transact_id is non-zero and properly aligned,
  not its\nmagnitude, so a crafted image can request an arbitrarily large index.\n\
  \nalloc_rsttbl_from_idx() grows the table to cover that index via\nextend_rsttbl(),
  which passes the new entry count to init_rsttbl():\n\n\trt = init_rsttbl(esize,
  used + add);\n\nused + add is computed as u32 but init_rsttbl() takes a u16, and
  the\ncount is stored in struct RESTART_TABLE as a __le16.  When used + add\nexceeds
  U16_MAX it is truncated, init_rsttbl() allocates a table far\nsmaller than the index
  requires, and alloc_rsttbl_from_idx() then\ndereferences and writes at the original,
  untruncated offset -- an\nout-of-bounds access past the allocation, reachable by
  mounting a\ncrafted NT"
