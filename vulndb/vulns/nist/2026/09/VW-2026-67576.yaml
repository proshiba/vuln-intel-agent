title: "The /datasources/unauth-datasource endpoint does not properly enforce data
  source authorization. An authenticated user can invoke this endpoint to obtain information
  about data sources they are not authorized to access. This may expose data source
  configuration and other sensitive metadata, depending on the fields returned by
  the endpoint.\n\n\n\nThis issue affects Apache DolphinScheduler: before 3.4.3.\n\
  \n\n\nUsers are recommended to upgrade to version 3.4.3, which fixes the issue."
