title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent client use-after-free during blocked-lock reaping\n\nA bare lock owner --
  its only remaining reference a blocked lock on\nnn->blocked_locks_lru -- holds a
  raw pointer to its nfs4_client but\nno reference keeping the client alive. When
  the per-net laundromat\nreaps such a lock, freeing the nbl drops the owner reference\n\
  held through flc_owner, and the final nfs4_put_stateowner()\ntakes the client's
  cl_lock. Because the laundromat detaches the\nnbl first, __destroy_client() no longer
  finds it, so a concurrent\nforce_expire_client() can free the client before nfs4_put_stateowner()\n\
  runs, dereferencing cl_lock in freed memory.\n\nPin the client with cl_rpc_users
  before dropping\nnn->blocked_locks_lock, and skip clients already expiring, whose\n\
  blocked locks __destroy_client() frees while holding an owner\nreference. Take nn->client_lock
  outside nn->blocked_locks_lock.\nEvery other site holds nn->blocked_locks_lock as
  a leaf"
