  Fix UAF when probe runs concurrent to dyn ID removal\n\nDynamic IDs are only guaranteed
  to be valid when dynids.lock is held,\nas remove_id_store() can free the node. Thus,
  make a copy in\npci_match_device(). Also, clarify that the id parameter is only
  valid\nduring probe."
