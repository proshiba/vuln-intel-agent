title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: fix OOB write in snd_usbmidi_us122l_output()\n\nThe snd_usbmidi_us122l_output()
  picks a count of 2 on anything slower\nthan high speed and never relates it to ep->max_transfer.\
  \  The URB\nbuffer holds exactly max_transfer bytes, so a device declaring a one\n\
  byte bulk endpoint takes two bytes from snd_rawmidi_transmit(), and the\nmemset
  that pads the rest computes 1 - 2 in int and wraps to SIZE_MAX.\n\nOnly 0x800e and
  0x800f are pinned to nine bytes.  The US-122MKII at\n0x0644:0x8021 falls to the
  default and takes usb_maxpacket(), which the\nUSB core only clamps downward.\n\n\
  The akai and novation output ops in this file were given the same guard\nrecently.\
  \  Do the same here."
