title: rclone before 1.75.1 fails to confine names from server and third-party 
  listing responses to the listed directory, allowing path traversal sequences 
  in object names. Attackers can craft special names containing forward slashes 
  and parent directory references to potentially write outside the destination 
  root, though downstream protections in the local backend currently block 
  actual file escape.
