title: "Path Equivalence vulnerability in Erlang/OTP inets httpd allows a remote unauthenticated
  attacker to read files inside a mod_auth protected directory by prefixing the request
  path with an extra slash.\n\nhttpd_request:validate_uri/1 normalises the request
  URI with uri_string:normalize/1, which performs RFC 3986 dot-segment removal but
  does not collapse empty path segments, so a doubled slash survives. mod_alias:real_name/3
  concatenates the document root with that URI, and mod_auth:secret_path/3 then decides
  whether the result lies inside a protected directory block by running the configured
  directory path as an unanchored regular expression against it. The doubled slash
  breaks the contiguous substring the regex needs, so the request is treated as unprotected
  and no authentication challenge is issued, while mod_get opens the same path and
  the operating system collapses the doubled slash and returns the protected file.
  The same path mismatch also evades the per-path accounting in mod_secur"
