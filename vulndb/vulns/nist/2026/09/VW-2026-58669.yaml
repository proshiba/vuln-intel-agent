title: Freeciv versions before 3.2.6 contain a heap buffer overflow in 
  worklist_load() when processing savegame files with declared worklist lengths 
  exceeding the fixed array bound of 64 elements. Attackers can craft malicious 
  savegame files that write past the entries array into adjacent heap-allocated 
  struct fields, potentially corrupting memory when a user or server operator 
  loads the file.
