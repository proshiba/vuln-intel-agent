title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, Jira search accepts a 
  forbidden project clause because it checks only for the presence of project 
  syntax, Confluence search uses an incomplete case-sensitive space check, and 
  Jira board APIs omit project-filter enforcement. These paths expose issues, 
  boards, or pages outside JIRA_PROJECTS_FILTER or CONFLUENCE_SPACES_FILTER when
  the operator credentials have broader access. The advisory traces the 
  vulnerable input and processing flow through jira_search, confluence_search, 
  get_board_issues, get_agile_boards, JIRA_PROJECTS_FILTER, and 
  CONFLUENCE_SPACES_FILTER, which identify the affected entry points, controls, 
  and code paths. This issue is fixed in version 0.22.0.
