title: Nodemailer versions 9.1.0 through 10.0.4 contain a quadratic time 
  complexity vulnerability in the addressparser component when parsing email 
  addresses with RFC 5322 comments. Attackers can craft malicious email headers 
  with comment-separated atoms to consume excessive CPU and block the Node.js 
  event loop for several seconds, causing denial of service.
