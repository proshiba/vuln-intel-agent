title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  validate ef->size covers the record's name and value\n\nWhen an EA record has a
  non-zero ef->size, ntfs_read_ea() only checks\nthat the record fits in the remaining
  buffer (ea_size > bytes), not that\nef->size is large enough to hold the record's
  own name_len + 1 + elength.\n\nA crafted image can pass validation with, e.g., ef->size
  = 24 but\nelength = 0xffff. ntfs_get_ea() then trusts elength and copies it out
  of\nthe undersized record, reading past the kmalloc(info->size) allocation\nand
  leaking heap memory to userspace via getxattr():\n\n BUG: KASAN: slab-out-of-bounds
  in ntfs_get_ea (fs/ntfs3/xattr.c:302)\n Read of size 65535 at addr ffff888100794550
  by task exploit\n  __asan_memcpy (mm/kasan/shadow.c:105)\n  ntfs_get_ea (fs/ntfs3/xattr.c:302)\n\
  \  ntfs_getxattr (fs/ntfs3/xattr.c:848)\n  __vfs_getxattr (fs/xattr.c:441)\n  vfs_getxattr
  (fs/xattr.c:474)\n  do_getxattr (fs/xattr.c:800)\n  path_getxattrat (fs/xattr.c:868)\n\
  \  do_s"
