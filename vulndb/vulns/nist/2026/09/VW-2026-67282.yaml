title: A vulnerability was identified in Tencent AI-Infra-Guard up to 
  4.5.2/4.6.2. This affects the function startsWith of the file 
  skill_scan/tools/dir/dir_actions.py of the component File Access. The 
  manipulation leads to path traversal. The attack needs to be performed 
  locally. The exploit is publicly available and might be used. Upgrading to 
  version 4.6.0 is able to mitigate this issue. The identifier of the patch is 
  ac0384edc9dbea3b226edefcf50613bd8509134f. You should upgrade the affected 
  component.
