title: SGLang through 0.5.20 in prefill/decode disaggregation mode fails to 
  validate duplicate bootstrap_room fields in /generate requests with Mooncake 
  KV transfer backend. Unauthenticated attackers can send concurrent requests 
  with identical bootstrap_room values to crash scheduler processes or hang 
  other users' requests until transfer timeout.
