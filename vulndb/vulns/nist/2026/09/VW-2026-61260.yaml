title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Fix acpi_package_ids[] array overflow\n\nWith LoongArch virt machine, a typical
  setting is one core per socket,\nthere will max 256 sockets (packages) on one VM.
  With PPTT acpi table,\narray acpi_package_ids[] will be overflowed.\n\nHere change
  the array size of acpi_package_ids[] with the max value of\nMAX_PACKAGES and KVM_MAX_VCPUS."
