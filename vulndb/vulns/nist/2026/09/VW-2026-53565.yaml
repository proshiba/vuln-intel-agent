title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  TC, Check if flow is PEER before acquiring devcom lock\n\nIn case __mlx5e_add_fdb_flow()
  fails in lower levels, the flow is\ndeleted via mlx5e_tc_del_flow(), and mlx5e_tc_del_flow()
  is acquiring\nESW devcom lock without condition. In addition, in case of peer_flow,\n\
  __mlx5e_add_fdb_flow() is called while holding ESW devcom comp lock.\nThis results
  in an AA deadlock.\n\nTo fix this, introduce a new PEER flag that is set on flows
  created as\npeer flows (the duplicate flows on peer devices), and check it in\n\
  mlx5e_tc_del_flow() before acquiring ESW devcom lock.\n\nLockdep splat:\n============================================\n\
  WARNING: possible recursive locking detected\n============================================\n\
  \ Possible unsafe locking scenario:\n       CPU0\n       ----\n  lock(&comp->lock_key#2);\n\
  \  lock(&comp->lock_key#2);\n *** DEADLOCK ***\nCall Trace:\n <TASK>\n dump_stack_lvl+0x69/0xa0\n\
  \ print_deadlock_bug.cold+0xbd/0xca\n _"
