title: Warpgate is an open source SSH, HTTPS and MySQL bastion host for Linux. 
  Prior to 0.25.6, api_get_recording_stream in 
  warpgate-admin/src/api/recordings_detail.rs protects 
  /@warpgate/admin/api/recordings/{uuid}/stream only with session authentication
  and omits require_admin_permission for AdminPermission::RecordingsView. Any 
  authenticated regular user who identifies an active recording can subscribe to
  its WebSocket and receive real-time terminal input and output from proxied 
  SSH, MySQL, or PostgreSQL sessions, including credentials, commands, and other
  sensitive data belonging to users and administrators. This issue is fixed in 
  version 0.25.6.
