title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/erdma:
  complete object teardown when the destroy command fails\n\nerdma_destroy_qp(), erdma_destroy_cq(),
  erdma_dereg_mr(), and\nerdma_destroy_ah() returned early when erdma_post_cmd_wait()
  failed,\nleaking the queue buffers, MTTs, doorbells and the STAG, QPN, CQN and AHN\n\
  identifiers. A command timeout clears ERDMA_CMDQ_STATE_OK_BIT and\npermanently disables
  the command queue, so no retry can succeed; the RDMA\ncore keeps the object after
  a failed destructor and forced uverbs cleanup\nthen nulls the pointers, making the
  resources unreachable.\n\nWarn on failure but release every software-owned resource
  and return\nsuccess, since during terminal destruction the hardware command result
  is\nonly diagnostic."
