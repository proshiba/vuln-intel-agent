title: "Inefficient algorithmic complexity in the Erlang/OTP asn1 OBJECT IDENTIFIER
  decoder allows a remote unauthenticated attacker to cause denial of service by sending
  a crafted OID during the TLS handshake.\n\nThe BER OID decoder asn1rtt_ber:dec_subidentifiers/3
  in lib/asn1/src/asn1rtt_ber.erl and the equivalent PER helper asn1rtt_per_common:dec_subidentifiers/3
  in lib/asn1/src/asn1rtt_per_common.erl accumulate a base-128 subidentifier into
  an unbounded integer using (Av bsl 7) + H per continuation byte. Each shift and
  addition on the growing accumulator is linear in the number of bits already accumulated,
  giving quadratic total work in the size of a single subidentifier. The JER helper
  asn1rtt_jer:json2oid/1 in lib/asn1/src/asn1rtt_jer.erl exhibits the same class of
  unbounded-integer parsing when decoding a dot-separated OID from JSON. A DER-encoded
  OBJECT IDENTIFIER with one very large arc (approximately 262 KB of continuation
  bytes) consumes roughly 13 seconds of CPU on typical hardware.\n"
