title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Skip vport under deletion in report ID acquisition\n\nqla24xx_report_id_acquisition()
  format-1 handling walks ha->vp_list under\nvport_slock, takes a vref_count on the
  matching vport and calls\nqla_update_host_map() to register its port id.\n\nA vport
  teardown via qla24xx_vport_delete() sets VPORT_DELETE, then\nqla24xx_disable_vp()
  removes the vport from the host_map btree and zeroes\nvha->d_id (RESET_AL_PA). The
  vport is only unlinked from vp_list later,\nin qla24xx_deallocate_vp_id(), which
  clears vp_map[idx] (RESET_VP_IDX)\nbut does not touch host_map. In the window in
  between, report ID\nacquisition can still find the vport on vp_list and call\nqla_update_host_map();
  with d_id already zeroed it takes the\nbtree_insert32() path and re-inserts the
  dying vport into host_map.\nNothing cleans that entry afterwards, so once scsi_host_put()
  frees the\nvha a later host_map lookup dereferences freed memory.\n\nSkip a vport
  t"
