title: "A flaw was found in the OCAPI modules (ocapi_command, ocapi_info) of the\n\
  community.general Ansible collection. The shared OCAPI request helper disables\n\
  TLS certificate validation on every request and the modules expose no parameter\n\
  to re-enable it, while sending HTTP Basic-Auth credentials to an https endpoint.\n\
  An attacker positioned on the network path between the Ansible controller and the\n\
  OCAPI-managed storage/enclosure device can present any certificate, intercept the\n\
  session, capture the credentials, and tamper with responses."
