title: "When Ethernet bridging is enabled (CONFIG_NET_ETHERNET_BRIDGE), eth_bridge_input_process()
  in subsys/net/l2/ethernet/bridge/bridge_input.c decides how each frame received
  on a bridge member interface is handled. For frames that must also be delivered
  to the local stack, the code called eth_bridge_handle_locally() and returned NET_OK.
  That helper does not consume the packet — it only calls bridge_iface_recv() (via
  virtual_recv()), which returns NET_CONTINUE without taking ownership of pkt.\n\n\
  The NET_OK verdict then propagates through ethernet_recv() up to processing_data()
  in subsys/net/ip/net_core.c, where NET_OK is interpreted as \"the packet was consumed,
  do not free it.\" Because no consumer actually took ownership, the RX net_pkt is
  never returned to the pool and is leaked. The concretely reproducible leak occurs
  for frames whose EtherType has no registered L3 handler when CONFIG_NET_ETHERNET_FORWARD_UNRECOGNISED_ETHERTYPE
  is set (default y when CONFIG_NET_SOCKETS_PACKET is enabled): "
