title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/rockchip:
  analogix_dp: fix unchecked bound endpoint name length\n\nrockchip_dp_drm_encoder_enable()
  uses sprintf() to format a device tree\npath into a 32-byte stack buffer. Device
  tree paths are not limited to\nthis size, so a sufficiently long path can overflow
  the buffer.\n\nUse snprintf() with the destination size to truncate the generated
  name\nand keep the writes within bounds."
