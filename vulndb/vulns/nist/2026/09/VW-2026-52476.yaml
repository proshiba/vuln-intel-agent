title: A vulnerability in the Lutece Core XSL export management module up to 
  version 7.1.7, which allows authenticated administrators to execute code 
  remotely. The XML/XSLT processing configuration does not enable secure 
  processing mode (FEATURE_SECURE_PROCESSING), allowing Java extension functions
  to be executed from malicious XSL stylesheets. An attacker with administrator 
  privileges can upload a manipulated XSL transformation file and trigger its 
  execution during user export operations, resulting in the execution of 
  arbitrary code on the server.
