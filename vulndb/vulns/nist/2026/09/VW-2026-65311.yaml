title: BentoPDF is a client-side PDF toolkit that is self hostable. In 2.8.6 and
  earlier, deserializeWorkflow() accepts the Timestamp node's tsaUrl control 
  from imported JSON without schema or destination validation. When a user 
  imports the crafted workflow and runs it against a PDF, timestampPdf() sends 
  an RFC 3161 TimeStampReq containing the PDF's SHA-256 MessageImprint to the 
  attacker-selected endpoint. The default self-hosted configuration does not set
  VITE_CORS_PROXY_URL, so the request bypasses the proxy's ALLOWED_TSA_HOSTS 
  checks and is sent directly. The disclosed digest can confirm that a document 
  matches a known file and can correlate the same document across users without 
  revealing its contents. This vulnerability is fixed in 2.8.7.
