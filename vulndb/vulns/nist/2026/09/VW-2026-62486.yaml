title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: validate RX band_idx before dereferencing phys[]\n\nband_idx comes
  from a 2-bit descriptor field (0-3) and was used directly\nto index dev->mt76.phys[]
  (size __MT_MAX_BAND == 3) and dereference the\nresult. A corrupt or reserved descriptor
  value could index out of bounds\nor hit a NULL phy on parts with fewer bands. Reject
  invalid band indices,\nmirroring mt7996_rx_get_wcid()."
