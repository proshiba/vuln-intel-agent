title: A flaw was found in the StreamsHub Console for Apache Kafka. 
  Tenant-supplied Kafka client properties from the Console custom resource are 
  copied into the console-api AdminClient configuration without filtering 
  security-sensitive keys, allowing a Console CR author to set config.providers 
  and bootstrap.servers to exfiltrate the console-api ServiceAccount token to an
  attacker-controlled broker.
