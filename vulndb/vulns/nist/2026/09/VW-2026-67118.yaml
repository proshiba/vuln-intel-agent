title: In Google fuse-archive versions prior to 1.24, an attacker who can 
  prepend a directory to PATH or write a malicious binary to an 
  attacker-controlled or writable directory appearing in PATH can hijack the 
  execution pathway. This allows the attacker to execute arbitrary local code 
  under the security context of the user running the fuse-archive process. The 
  issue was partially mitigated in version 1.22 and fully resolved in 1.24 via 
  refined selective PATH filtering.
