title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  kcm: Hold RCU read lock while running BPF parser\n\nkcm_parse_func_strparser() calls
  bpf_prog_run_pin_on_cpu() which\nprevents CPU migration, but does not establish
  an RCU read-side\ncritical section. Consequently, BPF map operations can trigger\n\
  WARN_ON_ONCE(!bpf_rcu_lock_held()) when called from the KCM strparser\nprogram.\n\
  \nHold the RCU read lock while running the program."
