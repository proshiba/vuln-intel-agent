title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: lp8727: fix use-after-free in lp8727_release_irq()\n\nlp8727_isr_func(),
  the threaded IRQ handler, is the only caller that arms\npchg->work via schedule_delayed_work().\
  \  lp8727_release_irq() currently\ncancels the work before freeing the IRQ, so an
  IRQ delivered in between\ncan re-arm the work through the threaded handler.  After
  .remove returns\nthe devm layer frees pchg while lp8727_delayed_func() may still
  run and\ndereference it.\n\nFree the IRQ first so the threaded handler is quiesced
  and can no longer\nqueue work, then cancel the delayed work to drain the final generation.\n\
  \nThis issue was found by an in-house static analysis tool."
