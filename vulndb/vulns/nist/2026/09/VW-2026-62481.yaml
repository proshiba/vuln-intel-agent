title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: fix out-of-bounds access in mmio copy helpers\n\nmt76_mmio_write_copy() and
  mt76_mmio_read_copy() iterate up to\nALIGN(len, 4), so a length that is not a multiple
  of four reads past the\nsource buffer (write_copy) or writes past the destination
  (read_copy).\nCopy the aligned body in the loop and handle the remaining tail through
  a\n4-byte bounce buffer, keeping the register access width unchanged."
