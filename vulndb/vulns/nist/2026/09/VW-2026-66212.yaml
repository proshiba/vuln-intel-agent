title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  put the chained BO when its mapping fails\n\namdxdna_cmd_set_error() looks up the
  first BO of a command chain, which\ntakes a reference, and drops it at the end of
  the function. The mapping of\nthat BO is established in between, and the failure
  path returns without the\nput, so the reference is leaked.\n\nOrdinary use does
  not reach it. The chain has been submitted before any of\nthis runs, so aie2_cmdlist_fill_slot()
  has already called\namdxdna_cmd_get_op() on that BO and amdxdna_gem_vmap() has cached
  its\naddress. What makes it reachable is that the BO is resolved again by\nhandle
  here, and the handle is userspace's to recycle: closing it after\nsubmission and
  importing a dma-buf whose exporter implements no vmap onto\nthe same id leaves amdxdna_gem_get_obj()
  returning an object this cannot\nmap, since prime_import() types every import AMDXDNA_BO_SHARE."
