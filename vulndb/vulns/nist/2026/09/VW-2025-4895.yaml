title: A vulnerability has been found in youlaitech youlai-mall 1.0.0/2.0.0. 
  Affected by this vulnerability is the function getMemberById of the file 
  /mall-ums/app-api/v1/members/. The manipulation of the argument memberId leads
  to improper access controls. The attack is possible to be carried out 
  remotely. The exploit has been disclosed to the public and may be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
