title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmemcg:
  move LRU size accounting on reparenting instead of copying it\n\nWhen a memory cgroup
  is offlined its LRU folios are reparented to the\nparent.  lruvec_reparent_lru()
  splices the child's lists into the\nparent's and credits the parent with the child's
  per-zone\nlru_zone_size[], but never clears the child's copy, so the size is\ncopied
  rather than moved.  lru_gen_reparent_memcg() does the same for\nMGLRU.\n\nThe parent
  is left correct, credited with exactly the folios it took\nover.  The stale value
  sits on the child and nothing will correct it:\nfolio->memcg_data now resolves to
  the parent, so every later\nupdate_lru_size() for those folios goes there.\n\nDying
  cgroups are not freed immediately and mem_cgroup_iter() still\nwalks them, so shrink_lruvec()
  keeps being called on them.\nget_scan_count() reads the phantom counter through
  lruvec_lru_size() and\nthe scan loop then grinds through nr[] in SWAP_CLUSTER_MAX
  steps against\na"
