title: pgAdmin 4's Webserver authentication source is intended to accept an 
  identity asserted by the web server or reverse proxy in front of pgAdmin, 
  delivered through the WSGI/CGI environment. WebserverAuthentication.get_user()
  read config.WEBSERVER_REMOTE_USER from request.environ and, when that returned
  nothing, fell back to reading the same name directly from the inbound HTTP 
  request headers via request.headers.get(). An inbound HTTP header is written 
  by whoever sends the request, so any client able to reach pgAdmin could supply
  that header itself and be authenticated as any username it named, including an
  existing Administrator, without presenting a password or any other credential.
  The environment lookup could also be satisfied by a client-supplied header 
  whenever WEBSERVER_REMOTE_USER was configured to an HTTP_-prefixed or 
  hyphenated name such as HTTP_X_FORWARDED_USER or X-Forwarded-User, since WSGI 
  servers place inbound headers into the environment under exactly those names. 
