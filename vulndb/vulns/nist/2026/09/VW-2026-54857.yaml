title: "Affected versions of MISP contain inconsistent authorization checks across
  dashboard widgets that display organisation information.\n\n\nSeveral organisation-related
  widgets did not honor Security.hide_organisation_index_from_users. As a result,
  authenticated users without the perm_sharing_group permission could enumerate organisations
  even though the normal organisation index was intentionally hidden from them.\n\n\
  \nThe affected widgets included paths that:\n\n\n\n  *  \nreturned organisation
  names and identifiers;\n\n\n  *  \ncould expose additional organisation database
  fields through JSON export because unrestricted find('all') queries fetched full
  rows;\n\n\n  *  \naccepted limit=0 or negative values in a way that could effectively
  remove the result limit and return the entire organisation table.\n\n\n\n\n\nA related
