title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,lsm:
  Drop bpf_prog_free from sleepable_lsm_hooks\n\n__bpf_prog_put_rcu() is the call_rcu()
  callback for non-sleepable programs.\nsecurity_bpf_prog_free() called from there
  fires bpf_prog_free in softirq;\nif a sleepable LSM prog is attached to that hook,
  might_fault() BUGs:\n\n  BUG: sleeping function called from invalid context\n  in_atomic():
  1, irqs_disabled(): 0, non_block: 0, pid: 5038\n  preempt_count: 101, expected:
  0\n  Call Trace:\n   <IRQ>\n   __bpf_prog_enter_sleepable+0x1cd/0x320 kernel/bpf/trampoline.c:1255\n\
  \   bpf_trampoline_6442549705+0x53/0xd7\n   security_bpf_prog_free+0xde/0x130 security/security.c:5465\n\
  \   __bpf_prog_put_rcu+0xab/0xd0 kernel/bpf/syscall.c:2365\n   rcu_do_batch kernel/rcu/tree.c:2617
  [inline]\n   handle_softirqs+0x236/0x800 kernel/softirq.c:622\n   </IRQ>\n\nThe
  call_rcu/call_rcu_tasks_trace split reflects the freed program's\nsleepability,
  not that of any attached observer.\n\nsecurity_bpf_prog_free("
