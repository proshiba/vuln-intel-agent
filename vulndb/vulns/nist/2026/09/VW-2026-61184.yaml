title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  Fix init ordering in amdgpu_vram_mgr_init()\n\ndrmm_cgroup_register_region() is
  called before INIT_LIST_HEAD() and\ngpu_buddy_init() in amdgpu_vram_mgr_init().
  If it fails, the function\nreturns early and bypasses those initializations.\n\n\
  Since adev->mman.initialized is set to true before amdgpu_vram_mgr_init()\nis called,
  a failure triggers amdgpu_ttm_fini(), which calls\namdgpu_vram_mgr_fini(), which
  then:\n\n - Calls list_for_each_entry_safe() on reservations_pending and\n   reserved_pages,
  whose list_head::next pointers are zero-initialized\n   (NULL). The loop does not
  recognize them as empty and dereferences NULL.\n\n - Calls gpu_buddy_fini(), which
  iterates free_trees[] unconditionally\n   via for_each_free_tree(). Since mm->free_trees
  is NULL\n   (never allocated), this dereferences NULL.\n\nBoth result in a kernel
  panic on the module load error path.\n\nFix by moving drmm_cgroup_register_region()
  to after the list a"
