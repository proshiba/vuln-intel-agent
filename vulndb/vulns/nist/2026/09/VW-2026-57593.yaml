title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a cross-site request forgery vulnerability in 
  view/logArchive.json.php that allows unauthenticated attackers to archive 
  application logs by making GET requests without CSRF token validation. 
  Attackers can craft malicious pages that trigger administrators' browsers to 
  request the endpoint, copying sensitive application logs to a publicly 
  accessible zip file and truncating the live log to remove forensic evidence.
