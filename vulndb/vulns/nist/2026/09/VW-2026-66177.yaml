title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_core: Fix race condition during device registration\n\nIn hci_register_dev(),
  the power_on work item is queued to\nhdev->req_workqueue before initializing hdev->adv_monitors_idr
  and\nregistering the MSFT extension via msft_register(). For devices marked with\n\
  quirks such as HCI_QUIRK_RAW_DEVICE, the HCI_UNCONFIGURED flag is set on\nthe device.
  When the power_on work item runs concurrently on another CPU,\nhci_power_on() detects
  that the device is unconfigured and immediately\ninvokes hci_dev_do_close(), which
  calls msft_do_close().\n\nConcurrently, msft_register() allocates the msft structure
  and exposes it\nto hdev->msft_data prior to calling mutex_init(&msft->filter_lock).
  If\nmsft_do_close() executes while hdev->msft_data is already assigned but the\n\
  mutex has not yet been initialized, mutex_lock(&msft->filter_lock) operates\non
