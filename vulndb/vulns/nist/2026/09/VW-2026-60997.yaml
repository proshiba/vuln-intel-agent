title: A security flaw has been discovered in ag-ui-protocol ag-ui 0.3.0. 
  Affected is the function urllib.request.urlopen of the file 
  integrations/aws-strands/python/src/ag_ui_strands/utils.py of the component 
  Multimodal Content. The manipulation of the argument Value results in 
  server-side request forgery. The attack can be executed remotely. The patch is
  identified as bf0c34df34cbb4b1992bc37c9bfffe6dd54bb189. It is advisable to 
  implement a patch to correct this issue.
