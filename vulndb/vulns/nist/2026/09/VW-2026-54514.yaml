title: "Improper Validation of Specified Quantity in Input vulnerability in ash-project
  ash allows an attacker to store a value of arbitrary size in an attribute whose
  length constraint should bound it.\n\nAsh measures string length with Elixir's String.length/1,
  which counts Unicode graphemes, in the max_length and min_length constraints of
  Ash.Type.String (apply_constraints/2 in lib/ash/type/string.ex), in Ash.Resource.Validation.StringLength,
  and in the string_length expression function. A grapheme carries an unbounded number
  of combining marks, so a base character followed by a million combining acute accents
  is one grapheme and megabytes of data, and satisfies max_length: 2. Where the data
  layer imposes no independent limit (ETS, Mnesia, or a Postgres text column) the
  whole value is persisted, so an attacker can write an entire request body into an
  attribute declared with a small maximum and grow storage without bound.\n\nThe counting
