title: KubeEdge is an open source system for extending native containerized 
  application orchestration capabilities to hosts at Edge. From 1.0.0 until 
  1.21.2, 1.22.2, and 1.23.1, Reader.Read in pkg/viaduct/pkg/packer trusts the 
  32-bit PackageHeader.PayloadLen received through the CloudHub viaduct 
  message-processing path and allocates that amount of memory before validating 
  an upper bound. An authenticated malicious or compromised edge peer can 
  repeatedly send crafted headers with excessive declared lengths, causing 
  memory exhaustion, CloudHub process termination or restart loops, and 
  temporary disruption of cloud-edge communication. This issue does not provide 
  unauthenticated access or direct code execution. This issue is fixed in 
  versions 1.21.2, 1.22.2, and 1.23.1.
