title: Snipe-IT versions >= 7.0.12 and <= 8.6.3 contain an authorization bypass 
  in the Livewire importer component (App\Livewire\Importer, mounted at the 
  imports.index route). The component only checked the broad 'import' ability at
  mount time, while its files() and activeFile() computed properties queried the
  imports table with no owner or company scope. As a result, any authenticated 
  non-superuser holding the import permission could view every Import record on 
  the instance (original filename, file_path, filesize, import_type and creation
  timestamp) and could invoke the selectFile($id) Livewire action with any 
  auto-incrementing Import ID to load another user's record, exposing its stored
  preview data (header_row column headers and first_row, the first data row of 
  the CSV). Because import CSVs commonly contain personal data, asset serial 
  numbers and license keys, this discloses sensitive information; in Full 
  Multiple Companies Support (FMCS) deployments the disclosure also crosses 
  company/ten
