title: A security flaw has been discovered in ramon-victor freegpt-webui up to 
  098db3dfeb41555c2ca9269df0f13e10ec1c35dc. This issue affects the function 
  getJailbreak of the file server/config.py of the component Jailbreak Mode. The
  manipulation results in race condition. It is possible to launch the attack 
  remotely. The attack requires a high level of complexity. The exploitability 
  is assessed as difficult. The exploit has been released to the public and may 
  be used for attacks. This product takes the approach of rolling releases to 
  provide continious delivery. Therefore, version details for affected and 
  updated releases are not available. This vulnerability only affects products 
  that are no longer supported by the maintainer.
