title: A vulnerability was determined in Fengoffice Feng Office up to 
  3.11.13.11. Affected by this vulnerability is the function getTitle of the 
  file application/views/task/add_task.php of the component Task Title Output. 
  Executing a manipulation of the argument og_objects.name can lead to cross 
  site scripting. The attack may be launched remotely. The exploit has been 
  publicly disclosed and may be utilized. The vendor was contacted early about 
  this disclosure but did not respond in any way.
