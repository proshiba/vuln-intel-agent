title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject writes through untrusted BTF pointers\n\ncheck_ptr_to_btf_access() lets program-type
  btf_struct_access callbacks\nvalidate writes before the default BTF access path
  rejects non-read\naccesses. That bypasses the read-only policy for untrusted BTF
  pointers\ncreated by helpers such as bpf_rdonly_cast().\n\nReject non-read accesses
  through PTR_UNTRUSTED BTF pointers at the\ncommon entry point, before the callback
  branch to handle all cases."
