title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  reject out-of-range nseconds in NFSv3 SETATTR and create ops\n\nA client can send
  an NFSv3 SETATTR, CREATE, MKDIR, SYMLINK or MKNOD\ncarrying an atime or mtime whose
  nseconds field is out of range. The\nvalue is well-formed on the wire and decodes
  cleanly into a valid\nuint32, but it is not a valid timespec64: tv_nsec must be
  less than\nNSEC_PER_SEC.\n\nNothing in the setattr path clamps it. notify_change()
  runs the time\nthrough timestamp_truncate(), which does not reduce tv_nsec below\n\
  NSEC_PER_SEC when the filesystem supports nanosecond granularity\n(s_time_gran ==
  1), and the inode atime/mtime setters store it verbatim\n(only ctime is normalized,
  via inode_set_ctime_to_ts()). The\nun-normalized value then corrupts on-disk metadata:
  ext4's\next4_encode_extra_time() shifts tv_nsec left by EXT4_EPOCH_BITS, which\n\
  overflows the 32-bit extra field and clobbers the seconds-epoch bits, so\nthe stored
