title: Laravel-Mediable 7.0.0 before 7.0.2 contains an incomplete patch for 
  CVE-2026-49972 in which the .pht extension is absent from the 
  forbidden_extensions blocklist in config/mediable.php. The blocklist 
  introduced to address CVE-2026-49972 includes phpt but omits pht, which Apache
  executes as PHP via the default FilesMatch directive on Debian and Ubuntu 
  systems. An attacker can upload a .pht file that passes all validation in 
  MediaUploader::verifyExtension() and File::sanitizeFileName() because pht is 
  not present in the blocklist, causing the file to be written to disk and 
  executed as PHP when requested, enabling remote code execution with the 
  privileges of the web server process.
