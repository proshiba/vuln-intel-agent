title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  dm1105: fix missing error check for dma_alloc_coherent\n\nThe return value of dm1105_dma_map(),
  which handles DMA memory allocation,\nis ignored in dm1105_hw_init(). If dma_alloc_coherent()
  fails, the driver\nwill proceed using a NULL pointer for DMA transfers, leading
  to a kernel\noops or invalid hardware access.\n\nFix this by checking the return
  value and propagating -ENOMEM on failure."
