title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Fix crash passing ERR_PTR to kthread_stop()\n\nIn test_ringbuffer()'s out_free cleanup
  loop, the check\n`!rb_threads[cpu]` only catches NULL entries and misses entries
  that\nhold an ERR_PTR.\n\nrb_threads[] is static, so unassigned slots are NULL.
  But when\nkthread_run_on_cpu() fails for a cpu, it stores ERR_PTR(-ENOMEM) (or\n\
  -EINTR) in rb_threads[cpu] before the creation loop jumps to out_free.\nThat entry
  is non-NULL, so the old `!ptr` check does not break, and the\ncleanup proceeds to
  call kthread_stop() on the ERR_PTR. kthread_stop()\nthen dereferences the bogus
  pointer, crashing the kernel during the\nlate_initcall self-test.\n\ncrash logs:\n\
  \  BUG: kernel NULL pointer dereference, address: 000000000000001c\n  Oops: 0002
  [#1] SMP NOPTI\n  CPU: 1 PID: 1 Comm: swapper/0 Not tainted 7.2.0-rc6-dirty #7 PREEMPT(lazy)\n\
  \  RIP: 0010:kthread_stop+0x2e/0x220\n  RBX: fffffffffffffff4\n  CR2: 000000000000001c\n\
  \  Call Trace:\n   <TASK>"
