title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  scarlett2: Use a private URB for the notification endpoint\n\nscarlett2_init_notify()
  used mixer->urb, which\nsnd_usb_mixer_status_create() allocates for the UAC2 status
  interrupt\nendpoint and mixer.c manages. On a device with that endpoint, the\n\"\
  already in use\" check fires on the status URB and returns 0 for\nsuccess without
  doing anything. No notification URB is submitted, and\ncmd_done is left zeroed because
  it is initialised past that check and\nnowhere else. scarlett2_usb_init() then issues
  SCARLETT2_USB_INIT_1\nand wait_for_completion_timeout() would crash adding to the
  zeroed\nwait.head.\n\nUse a separate URB in scarlett2_data, as done for FCP, and
  initialise\ncmd_done in scarlett2_init_private(). mixer.c was also freeing the URB\n\
  in snd_usb_mixer_free() and resubmitting it in\nsnd_usb_mixer_activate(), so scarlett2
  must now do both: add\nscarlett2_cleanup_urb(), called from private_free and private_suspend,\n\
  and a priv"
