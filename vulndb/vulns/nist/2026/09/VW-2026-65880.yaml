title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  accurately adjust free_sections during free_segment_range\n\nIn free_segment_range(),
  MAIN_SECS(sbi) is temporarily reduced by `secs`\nto restrict block allocation to
  the safe remaining main area while valid\nblocks in the truncated range are evacuated
  by GC.\n\nHowever, FREE_I(sbi)->free_sections tracks the total number of free\n\
  sections across the whole filesystem. If any sections within the\ntruncated range
  were already free upon entering free_segment_range(),\nfailing to deduct them from
  free_sections causes the filesystem to\noverestimate available free sections in
  the active, reduced main area.\nThis leads to inconsistent free section accounting
  during GC data\nmigration and can trigger unexpected allocation failures or assertion\n\
  errors when space is tight.\n\nFix this by calculating the number of already-free
  sections in the\ntruncated range, deducting them from free_sections upon entering\n\
  free_segment_range(), and rest"
