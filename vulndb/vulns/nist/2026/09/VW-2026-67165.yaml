title: Missing Authentication for Critical Function in Apache Roller 6.1.5 
  allows an unauthenticated remote attacker to persistently change a site-global
  configuration value (the frontpage weblog selection) on any installed 
  instance, because the setup action remains anonymously reachable after 
  installation and persists configuration without an authorization check. No 
  optional feature or non-default configuration is required; the result can 
  redirect or break the site's public frontpage, with administrative recovery 
  available. Users are recommended to upgrade to Apache Roller 6.1.6 or later, 
  which restricts the write to global administrators.
