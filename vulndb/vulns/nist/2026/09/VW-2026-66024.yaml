title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  fix tcp stream corruption with large pages\n\nrds_message_map_pages() assigns PAGE_SIZE
  bytes to every\nscatterlist entry, even when total_len ends in a partial page. The
  RDS\ncongestion map is defined as 8192 bytes, so on systems with PAGE_SIZE\ngreater
  than 8192 the scatterlist maps bytes beyond the end of the\ncongestion map.  RDS-TCP
  transmits the SG contents according to those\nlengths, so the extra bytes become
  part of the TCP RDS stream and are\ninterpreted as subsequent RDS message headers,
  corrupting the stream.\n\nLimit the final scatterlist mapping to the number of bytes
  remaining.\nThis has no effect on systems with a 4K page size and allows RDS-TCP
  to\nbe used on systems with 16K and larger page sizes.\n\nThe RDS selftest, which
  previously hung on 16K pages, now passes."
