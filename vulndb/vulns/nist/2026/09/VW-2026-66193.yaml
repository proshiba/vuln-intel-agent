title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  fix stale page cache in insert/collapse range\n\nsmb3_insert_range() and smb3_collapse_range()
  use\ntruncate_pagecache_range() to invalidate the affected page cache.\nHowever,
  if off or old_eof is not page-aligned, the boundary pages are\nonly partially zeroed
  and remain uptodate. As a result, the client may\nreturn stale data after a successful
  insert/collapse range operation.\n\nFor example, with 4K pages:\n\n    page 0  \
  \        page 1          page 2\n    0------4K       4K------8K      8K------12K\n\
  \       ^                                ^\n    off=2K                       old_eof=10K\n\
  \nPage 1 is removed from the page cache, while the boundary pages are\nonly partially
  zeroed. After COPYCHUNK moves the data on the server,\nthese cached pages may still
  return stale data.\n\nThis can be reproduced on a CIFS mount:\n\n    bash -c '\n\
  \            FILE=/mnt/scratch/repro\n\n            # Use a 6 KiB file so EOF is
  not page-aligned"
