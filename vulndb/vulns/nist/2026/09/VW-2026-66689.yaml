title: stoatchat before 0.15.5 fails to validate that MFA tickets belong to the 
  authenticated user, allowing attackers to bypass MFA by using their own valid 
  ticket with another user's session token. Attackers can obtain a ticket from 
  their own account and use it with a victim's session token to disable TOTP, 
  view recovery codes, or perform other sensitive operations without providing 
  the victim's credentials.
