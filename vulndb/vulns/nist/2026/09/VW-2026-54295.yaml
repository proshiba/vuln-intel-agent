title: Emlog is an open source website building system. Prior to version 2.6.16,
  Emlog CMS Pro contains a blind SQL injection in 
  User_Model::getUserDataByLogin(). The $account parameter is directly 
  interpolated into SQL queries without any filtering. The vulnerability is 
  reachable through the auth cookie validation path, where $username is 
  extracted from the cookie and passed unfiltered into SQL — guarded only by an 
  HMAC signature that requires AUTH_KEY to forge. This issue has been patched in
  version 2.6.16.
