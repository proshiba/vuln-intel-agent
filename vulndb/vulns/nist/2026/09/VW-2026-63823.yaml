title: A vulnerability was detected in BioStar VALKYRIE AURORA 2.10.2411.0800. 
  This vulnerability affects the function sub_1105C of the file BS_RVSIO64.sys 
  of the component IOCTL Handler. The manipulation of the argument 
  PhysicalAddress results in write-what-where condition. The attack needs to be 
  approached locally. The exploit is now public and may be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
