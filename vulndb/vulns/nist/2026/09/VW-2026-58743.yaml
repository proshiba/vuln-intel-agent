title: joi before versions 17.13.8 and 18.2.9 contains a prototype pollution 
  vulnerability in the messages compilation function that accepts __proto__ as 
  an error code. Attackers can supply __proto__ keys in custom messages to 
  replace the returned object's prototype, breaking downstream code relying on 
  Object.prototype methods.
