title: Netdata is an open source observability tool. Prior to 2.10.4, the 
  setuid-root ndsudo helper command fail2ban-client-status-socket in 
  src/collectors/utils/ndsudo.c accepts a caller-controlled --socket_path from 
  the low-privileged netdata service account. The account can direct root 
  fail2ban-client to a malicious UNIX socket, and fail2ban/client/csocket.py 
  CSocket.receive() passes the returned data to pickle.loads(), allowing 
  attacker-controlled code to execute as root on systems with fail2ban-client 
  installed. This issue is fixed in version 2.10.4 and nightly build 
  2.10.0-782-nightly.
