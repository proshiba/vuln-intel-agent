title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tls:
  Fail tls_sw_splice_read() after a failed async decrypt\n\nWhen an async decrypt
  fails, tls_decrypt_done() records the error in\nctx->async_wait.err and calls tls_err_abort(),
  which stores it in\nsk_err. tls_sw_recvmsg() and tls_sw_read_sock() each read\n\
  async_wait.err once they hold the reader lock and fail the call: a\nrecord that
  did not authenticate breaks the connection.\n\ntls_sw_splice_read() has no such
  check, and sk_err does not stand in\nfor one. tls_rx_rec_wait() tests sk_err only
  inside the loop it\nskips whenever a record is already parsed, and the first reader
  to\nreach sock_error() clears it, while async_wait.err persists. A\nsplice therefore
  keeps delivering records on a connection that\nrecvmsg() and read_sock() refuse
  to read.\n\nRead async_wait.err in tls_sw_splice_read() as the other two readers\n\
  do."
