title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix XDR padding calculation in ff_encode_getdeviceinfo\n\nnfsd4_ff_encode_getdeviceinfo()
  computes the da_addr_body reservation\nas 16 + netid_len + addr_len, but the subsequent
  xdr_encode_opaque()\ncalls emit 8 + round_up(netid_len, 4) + round_up(addr_len,
  4) bytes.\nThe mismatch means the declared da_addr_body length exceeds the actual\n\
  encoded data by 2-8 bytes on every flexfile GETDEVICEINFO reply,\nleaking stale
  reply-page content to the client and mis-aligning the\nsubsequent version list decode.\n\
  \nUse xdr_align_size() for each string length to match what\nxdr_encode_opaque()
  actually writes."
