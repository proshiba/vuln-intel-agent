title: "A vulnerability in the TLS library of Cisco IOS XE Software could allow an
  unauthenticated, adjacent attacker to exhaust the available memory of an affected
  device.\r\n\r This vulnerability is due to improper management of memory resources
  during TLS connection setup. An attacker could exploit this vulnerability by repeatedly
  triggering the conditions that cause the memory increase. This could be done in
  a variety of ways, such as by repeatedly attempting Extensible Authentication Protocol
  (EAP) authentication when local EAP is enabled on an affected device or by using
  a machine-in-the-middle attack and resetting TLS connections between the affected
  device and other devices. A successful exploit could allow the attacker to exhaust
  the available memory on an affected device, resulting in an unexpected reload and
  a denial of service (DoS) condition."
