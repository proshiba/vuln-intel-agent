title: A security flaw has been discovered in netease-youdao LobsterAI 
  2026.6.15/2026.8.28/2026.9.3/2026.9.4. Impacted is the function 
  OpenClawConfigSync.buildBrowserConfig of the file 
  src/main/libs/openclawConfigSync.ts of the component Browser Network 
  Configuration. The manipulation results in server-side request forgery. It is 
  possible to launch the attack remotely. The exploit has been released to the 
  public and may be used for attacks. The reported GitHub issue was closed 
  automatically due to inactivity.
