title: A vulnerability has been found in java-json-tools json-patch up to 1.13. 
  Affected by this vulnerability is the function JsonPatch.apply of the file 
  src/main/java/com/github/fge/jsonpatch/JsonPatch.java of the component Patch 
  Operation Handler. The manipulation leads to resource consumption. It is 
  possible to initiate the attack remotely. The exploit has been disclosed to 
  the public and may be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
