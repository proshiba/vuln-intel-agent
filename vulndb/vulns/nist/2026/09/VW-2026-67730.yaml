title: An improper access control vulnerability in TeamViewer Full Client, Host,
  and related affected modules on Windows, Linux, and macOS allows an 
  authenticated remote attacker to bypass user-configured permission settings 
  during session establishment. By modifying access control parameters for 
  restricted features, an attacker can perform actions that were explicitly 
  denied by the victim's configuration. This may result in unauthorized actions 
  and potentially lead to remote code execution on the target system.
