title: Windows ML CLI is a command line tool for building portable, performant, 
  and high-quality AI models for Windows ML. Prior to 0.4.0, the 
  src/winml/modelkit/serve/cli_api.py component exposes WinML CLI commands 
  through a localhost HTTP API without authentication and configures the 
  allow_origins setting as a wildcard in both 
  src/winml/modelkit/serve/cli_api.py and src/winml/modelkit/serve/app.py. A 
  malicious website loaded by a user can send cross-origin requests to 
  /v1/cli/build or /v1/cli/config and set the trust_remote_code parameter to 
  true, which is converted to the --trust-remote-code command-line flag without 
  validation. This reaches AutoConfig.from_pretrained with 
  trust_remote_code=True in src/winml/modelkit/loader/_autoconfig.py and imports
  Python code from an attacker-controlled model repository, resulting in 
  arbitrary code execution as the server user. This issue is fixed in version 
  0.4.0.
