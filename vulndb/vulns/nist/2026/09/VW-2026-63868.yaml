title: "Temporal Server compiles a Worker Controller Instance module into its Worker
  Service, and that module registers a compute provider named subprocess whose function
  is to launch a worker by running a command on the machine hosting the Worker Service.
  The program name and the argument vector that provider executes are taken from the
  compute provider configuration supplied in the caller's request rather than from
  operator configuration. An authenticated caller holding only a write role in a single
  namespace can therefore configure a worker deployment version so that the Worker
  Service executes a command of the caller's choosing on its own host, under the account
  the server process runs as. Execution is immediate rather than deferred: the configuration
  handler invokes every provider using the invoke strategy directly after validating
  the submitted specification, so no scaling decision, task arrival, or unusual request
  sequence is required. Because the Worker Service process holds the persis"
