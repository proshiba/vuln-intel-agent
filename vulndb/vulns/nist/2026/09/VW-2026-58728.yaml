title: A vulnerability was found in vvbbnn00 WARP-Clash-API up to 
  c7bf2360073959861219b422e51ae86411051b46. This affects the function 
  doUpdateLicenseKey. The manipulation results in race condition. The attack can
  be launched remotely. The attack requires a high level of complexity. The 
  exploitability is reported as difficult. The exploit has been made public and 
  could be used. This product does not use versioning. This is why information 
  about affected and unaffected releases are unavailable. The vendor was 
  contacted early about this disclosure but did not respond in any way. This 
  vulnerability only affects products that are no longer supported by the 
  maintainer.
