title: SQLBot is an intelligent Text-to-SQL system based on large language 
  models and RAG. Prior to 1.9.0, the POST /api/v1/datasource/parseExcel 
  endpoint in backend/apps/datasource/api/datasource.py uses attacker-controlled
  multipart filename data when selecting where uploaded content is stored, 
  writes the content before spreadsheet parsing and validation finish, and can 
  transform a double-extension filename into a Python source file. An attacker 
  able to submit a crafted multipart upload can use these behaviors to place 
  attacker-controlled content in /opt/sqlbot/app/alembic/versions/ even when a 
  spreadsheet parsing failure after the file write causes the endpoint to return
  an error. The planted file remains on disk, and subsequent SQLBot startup or 
  migration processing causes Alembic to import the module and execute its 
  module-level statements in the SQLBot application runtime. This issue is fixed
  in version 1.9.0.
