title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, validate_safe_path defaults 
  its base directory to os.getcwd(), and affected Confluence attachment call 
  sites omit base_dir, allowing attacker-selected writes within the working 
  directory. This Python module overwrite can provide code execution when the 
  application later imports the modified module, bypassing the remediation 
  tracked as CVE-2026-27825. This issue is fixed in version 0.22.0.
