title: A vulnerability was determined in Forma LMS up to 4.1.43. This impacts 
  the function UserselectorAdmController::getDataTask of the file 
  /appCore/ajax.adm_server.php?r=adm/userselector/getData of the component 
  Multi-User-Selector AJAX Endpoint. This manipulation of the argument Name 
  causes sql injection. The attack may be initiated remotely. The exploit has 
  been publicly disclosed and may be utilized. The vendor was contacted early 
  about this disclosure but did not respond in any way.
