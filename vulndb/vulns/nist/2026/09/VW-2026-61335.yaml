title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  pcm: Fix race between non-atomic ops and trigger-start\n\nWe protect the races of
  the concurrent state transitions between\natomic PCM ops, but the checks between
  the non-atomic ops (hw_params,\nhw_free and prepare) and the atomic ops aren't perfect;
  there is a\ncheck of the conflicting PCM state at the beginning of hw_params & co,\n\
  but the atomic PCM ops can be still issued during the non-atomic PCM\noperations.\
  \  An example such scenario is that a thread A re-issues the\nPREPARE or HW_PARAMS
  for the already prepared stream, while another\nthread B triggers the PCM start
  in the middle of the prepare\noperation.  Although this usually doesn't lead to
  much serious issues,\nit can give some inconsistency as reported by syzkaller (such
  as\nODEBUG warning).\n\nThere are various atomic PCM ops, and basically the only
  problem is\nthe PCM start as it operates from the PREPARED state.  Other trigger\n\
  commands (stop, etc) are for the run"
