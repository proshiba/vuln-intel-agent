title: "When a request to the Airflow core API carries both a session cookie and an
  explicit `Authorization: Bearer` token, Airflow resolves the caller from the cookie
  and ignores the bearer token, inverting the intended precedence of bearer over cookie.
  The request then executes -- and is recorded in the audit log -- as the cookie's
  principal rather than the identity the client explicitly presented.\n\nOnly Apache
  Airflow 3.3.0 and 3.3.1 are affected. Earlier releases do not contain the code path
  that caches the cookie-derived user, and are not vulnerable.\n\nExploiting this
  requires an attacker to first place a valid session cookie of their own into the
  victim's browser or client: for example by cookie tossing from a sibling subdomain,
  through cross-site scripting in a separate application sharing a parent domain,
