title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix null dereference in nfsd4_setattr for deleg timestamp attrs\n\nWhen a SETATTR
  request includes FATTR4_WORD2_TIME_DELEG_ACCESS or\nFATTR4_WORD2_TIME_DELEG_MODIFY
  in the attribute bitmap, nfsd4_setattr()\nsets deleg_attrs=true and calls nfs4_preprocess_stateid_op()
  to validate\nthe stateid.\n\nIf the client supplies the NFSv4 \"one stateid\" (all-0xFF
  bytes),\ncheck_special_stateids() returns nfs_ok without populating the output\n\
  nfs4_stid pointer, because the special-stateid path in\nnfs4_preprocess_stateid_op()
  jumps to done: with s==NULL, and the\n\"if (s)\" block that would set *cstid is
  skipped. The local variable `st`\nremains NULL.\n\nBack in nfsd4_setattr(), the
  if (deleg_attrs) block then unconditionally\ndereferences st->sc_type (at offset
  4 from NULL), causing a kernel oops.\n\nThis is remotely triggerable by any NFSv4
  client: send COMPOUND [PUTROOTFH,\nSETATTR(ONE_STATEID, {bmval2=FATTR4_WORD2_TIME_DELEG_ACCESS,
  ...})]."
