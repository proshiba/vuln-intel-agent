title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qrtr: fix node refcount leak on ctrl packet alloc failure\n\nqrtr_send_resume_tx()
  calls qrtr_node_lookup() which takes a\nreference on the returned node. If the subsequent
  call to\nqrtr_alloc_ctrl_packet() fails due to memory allocation failure, the\n\
  function returns -ENOMEM without calling qrtr_node_release() to\nrelease the node
  reference.\n\nAdd qrtr_node_release(node) before returning on the allocation failure\n\
  path to properly release the reference."
