title: A security issue exists in MongoDB server's JSON Pointer parser used 
  during $jsonSchema query filter processing. When a find command includes a 
  specially crafted $jsonSchema filter field, the parser processes the input 
  without enforcing adequate limits on iteration count or total allocation size,
  resulting in significant memory amplification. Under concurrent request load, 
  the cumulative memory consumption can exhaust available heap memory, causing 
  the server's out-of-memory handler to terminate the mongod process and deny 
  service to all connected clients.
