title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Do not save/restore percpu base register in rethook trampoline\n\nThe rethook trampoline
  saves $r21 ($u0), the percpu base, into its frame\nat entry and restores it at exit.
  Inbetween rethook_trampoline_handler()\nmay schedule via preempt_enable_notrace().\n\
  \nIf the task migrates to another CPU, the frame's $r21 holds the old\nCPU's percpu
  base, and restoring it poisons $r21 on the new CPU. Until\nthe next user->kernel
  transition heals $r21, all this_cpu_*() accesses\n(runqueues, RCU per-CPU data,
  timer tick programming, FPU ownership)\nhit the wrong CPU's percpu area.\n\nUnder
  kretprobe-heavy preemptible load this can corrupt scheduler and\ntimer state: scheduling-while-atomic
  splats, wrong-CPU RCU warnings,\nWARN_ON_ONCE(rq != this_rq()) in nohz_balance_exit_idle(),
  and CPUs\nparking in the idle loop with the constant timer never re-armed (hard\n\
  lockup). Reproduces on a Loongson-3A6000 with kretprobes on VFS paths\nplus h"
