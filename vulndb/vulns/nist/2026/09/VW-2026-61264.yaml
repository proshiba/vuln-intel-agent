title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  KVM: Preserve memslot arch flags on KVM_MR_FLAGS_ONLY\n\nkvm_arch_prepare_memory_region()
  computes new->arch.flags, i.e. whether\na memslot is KVM_MEM_HUGEPAGE_CAPABLE or
  KVM_MEM_HUGEPAGE_INCAPABLE,\nonly for KVM_MR_CREATE and KVM_MR_MOVE, and returns
  early for every\nother change. But the generic code allocates a zeroed memslot for
  every\nchange and never copies old->arch, so after a KVM_MR_FLAGS_ONLY update,\n\
  e.g. toggling KVM_MEM_LOG_DIRTY_PAGES for live migration, the active\nmemslot has
  arch.flags == 0.\n\nWith both flags clear, fault_supports_huge_mapping() falls through
  to\nthe alignment check on the HVA range alone, which no longer verifies\nthat the
  GPA and HVA have the same offset within a PMD. A memslot that\nwas marked KVM_MEM_HUGEPAGE_INCAPABLE
  because of a GPA/HVA offset\nmismatch can then be mapped with PMD entries on read
  faults, and since\nkvm_map_page() aligns the gfn and the pfn independently, the
  guest"
