title: AppFlowy-Cloud through 0.9.64 fails to validate workspace membership when
  establishing WebSocket connections in the establish_ws_connection_v2 handler, 
  allowing authenticated users to bind sessions to workspaces they do not belong
  to. Attackers can send sync Manifest messages with victim object identifiers 
  to read full document or database state from collaborations in other 
  workspaces without victim involvement.
