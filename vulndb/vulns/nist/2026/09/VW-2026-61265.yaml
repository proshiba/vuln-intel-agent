title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  KVM: Free init resources if kvm_init() fails\n\nkvm_loongarch_init() calls kvm_loongarch_env_init()
  to allocate the\nper-CPU kvm_context (vmcs) and kvm_loongarch_ops and to register
  the\nperf callbacks, and then calls kvm_init(). If kvm_init() fails its\nresult
  is returned directly, but since module_init() does not run the\nmodule_exit() stuff
  on failure, so kvm_loongarch_env_exit() is never\ncalled and those resources are
  leaked.\n\nSo call kvm_loongarch_env_exit() when kvm_init() fails, matching the\n\
  teardown-on-failure pattern used by riscv_kvm_init()."
