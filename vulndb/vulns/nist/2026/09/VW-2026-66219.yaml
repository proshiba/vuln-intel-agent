title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix REG INVARIANTS VIOLATION on speculative pointer arithmetic\n\nTake the following
  unprivileged program as an example:\n\n\tr0 = bpf_map_lookup_elem(...)\t/* PTR_TO_MAP_VALUE,
  offset 0 */\n\t...\n\t14: r0 += r1\t\t\t/* r1 is a bounded scalar */\n\t15: r9 =
  r0\n\nLoading it triggers a verifier warning from reg_bounds_sanity_check():\n\n\
  \tverifier bug: REG INVARIANTS VIOLATION (alu): const subreg tnum out\n\tof sync
  with range bounds r64={.base=0x0, .size=0x0}\n\tr32={.base=0x0, .size=0xffffffff}
  var_off=(0x0, 0x0)\n\nWhat happens:\n\n1. Processing insn 14 (r0 += r1) in adjust_ptr_min_max_vals(),
  the new\n   offset is computed into dst_reg's var_off and 32/64-bit ranges.\n\n\
  2. Because pointer registers do not track 32-bit subregister bounds,\n   __mark_reg32_unbounded()
  first sets r32 to the full range; r32 is\n   re-derived from the offset at the end
