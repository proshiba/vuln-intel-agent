title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: twl4030_charger: cancel workers via devm\n\nbci is devm-allocated. Two workers
  (bci->work and bci->current_worker)\ndereference it. twl4030_bci_remove() disables
  charging and masks\ninterrupts. It cancels neither worker. A worker pending at remove()
  can\nrun after devm frees bci.\n\nThe USB transceiver comes from devm_usb_get_phy_by_node().
  devm\nunregisters its notifier only after remove() returns. A cancel_work_sync()\n\
  in remove() can then race a notifier reschedule. devm_work_autocancel()\nand devm_delayed_work_autocancel()
  avoid that. They cancel the workers\nduring devm release, before bci is freed.\n\
  \nThe current_worker is registered first, since devm will cancel in\nreverse order
  and bci->work can reschedule current_worker.\n\n[Move comment about order into the
  commit message]"
