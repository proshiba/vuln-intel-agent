title: A security flaw has been discovered in Open5GS up to 2.7.7. Affected by 
  this vulnerability is an unknown functionality of the file lib/pfcp/handler.c 
  of the component PFCP Message Handler. Performing a manipulation results in 
  denial of service. Remote exploitation of the attack is possible. The exploit 
  has been released to the public and may be used for attacks. The patch is 
  named 028e1dbb5e3271035ccee906ef417a97fc523f71. Applying a patch is the 
  recommended action to fix this issue. CVE-2025-29339 describes a different 
  assertion failure vulnerability in Open5GS UPF.
