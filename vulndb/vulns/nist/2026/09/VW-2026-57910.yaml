title: The WP Photo Album Plus plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'HTTP_X_FORWARDED_FOR' parameter in all versions 
  up to, and including, 9.2.08.003 due to insufficient input sanitization and 
  output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The nonce failure path for the 
  getshortcodedrenderedfenodelay action serves as the log-write trigger rather 
  than an access barrier — a deliberately failed nonce check causes wppa_log() 
  to record the attacker-supplied X-Forwarded-For value to disk, making the 
  exploit fully reachable by unauthenticated callers via the wp_ajax_nopriv_wppa
  endpoint.
