title: Maravel, a PHP framework oriented towards dependency injection, prior to 
  version 10.73.1 has a side-channel information disclosure issue. When a route 
  was compiled with dynamic placeholders (e.g., `/api/v1/users/{id}`), the raw 
  string placeholder key was mistakenly registered into the flat static route 
  checklist. An attacker scanning endpoints could intentionally pass the literal
  template syntax (e.g., `GET /api/v1/users/{id}`) to force an unexpected match 
  against the static map. Because the dynamic tree engine was bypassed, no 
  arguments were captured. This forced modern PHP 8+ versions to throw a native 
  `ArgumentCountError`, resulting in a 500 Internal Server Error instead of a 
  uniform 404 Not Found. By tracking which fuzz patterns exploded into a 500 
  error, a malicious actor could programmatically profile and map out internal 
  route parameter names and controller schemas. Version 10.73.1 contains a 
