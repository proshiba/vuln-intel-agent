title: The Location Manager plugin for WordPress is vulnerable to generic SQL 
  Injection via 'latitude' and 'longitude' REST API Parameters in all versions 
  up to, and including, 2.3.38 due to insufficient escaping on the user supplied
  parameter and lack of sufficient preparation on the existing SQL query. This 
  makes it possible for unauthenticated attackers to append additional SQL 
  queries into already existing queries that can be used to extract sensitive 
  information from the database. The injection is triggered when the 
  orderby=lat_lon parameter is supplied, and affects multiple publicly 
  accessible REST endpoints including geodir/v2/locations/cities, /regions, 
  /countries, and /neighbourhoods via both the get_locations() and 
  get_neighbourhoods() functions.
