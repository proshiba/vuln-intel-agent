title: A vulnerability was detected in rowboatlabs rowboat up to 0.9.1. The 
  impacted element is the function request.text/req.json of the file 
  apps/rowboat/app/api/composio/webhook/route.ts of the component Composio 
  Webhook Endpoint. The manipulation results in denial of service. It is 
  possible to launch the attack remotely. The exploit is now public and may be 
  used. Upgrading to version 0.9.2 is sufficient to resolve this issue. 
  Upgrading the affected component is recommended. The legacy Next.js app was 
  deleted at 0.9.2 rather than patched, leaving no security control behind.
