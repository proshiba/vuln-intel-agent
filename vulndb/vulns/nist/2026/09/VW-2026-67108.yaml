title: 'A vulnerability was identified in ООО НПО Ритм GEOritm up to 2.45.1. This
  affects an unknown part of the file /restapi/objects/obj-groups of the component
  REST API. Such manipulation of the argument objectId leads to missing authentication.
  The attack can be launched remotely. The exploit is publicly available and might
  be used. Upgrading to version 2.46 is able to mitigate this issue. It is advisable
  to upgrade the affected component. The vendor confirms: "In August 2026, NPO Ritm
  received an official vulnerability notification from the Russian Federal Service
  for Technical and Export Control (FSTEC Russia). The vulnerability was registered
  under identifier BDU:2026-11235. Following our internal investigation, we confirmed
  the vulnerability and implemented the necessary security fixes. The vulnerability
  has been fixed on our hosted GEO.RITM server at geo.ritm.ru. The fix has also been
  included in GEO.RITM version 2.46, which is already being distributed to our customers."'
