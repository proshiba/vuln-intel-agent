title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Flush context cache with correct SID when tearing down aliases\n\ndomain_context_clear_one()
  and device_pasid_table_teardown() are both\ninvoked once per DMA alias of a device.
  Each function locates the context\nentry using the bus/devfn pair provided by the
  pci_for_each_dma_alias()\ncallback, then calls intel_context_flush_no_pasid(), which
  constructs a\ndevice-selective context-cache invalidation from info->bus and\ninfo->devfn
  (that is, always the requester ID of the device itself).\n\nAs a result, for every
  alias other than the device’s own RID, the context\nentry that was just cleared
  in memory is never invalidated in the context\ncache. Hardware may continue using
  that stale cached entry. In the\nscalable-mode teardown path, intel_pasid_free_table()
  can then free the\nPASID directory still referenced by that stale entry, allowing
  the IOMMU\nto walk freed memory.\n\nFix this by passing the source ID of the entry
  bein"
