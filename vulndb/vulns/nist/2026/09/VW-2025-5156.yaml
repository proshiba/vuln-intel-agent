title: A vulnerability was found in aizuda snail-job up to 1.6.0. Affected by 
  this vulnerability is the function QLExpressEngine.doEval of the file 
  snail-job-common/snail-job-common-core/src/main/java/com/aizuda/snailjob/common/core/expression/strategy/QLExpressEngine.java.
  The manipulation results in injection. The attack can be launched remotely. 
  Upgrading to version 1.7.0-beta1 addresses this issue. The patch is identified
  as 978f316c38b3d68bb74d2489b5e5f721f6675e86. The affected component should be 
  upgraded.
