title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix sd_ndr.data memory leak in ksmbd_vfs_set_sd_xattr\n\nndr_encode_v4_ntacl() allocates
  sd_ndr.data via kzalloc() at entry.\nIf any subsequent ndr_write_*() call returns
  error during encoding,\nthe allocated sd_ndr.data won't be freed and causes memory
  leak.\n\nMove kfree(sd_ndr.data) into out label to ensure the buffer gets\nreleased
  on all success and error return paths."
