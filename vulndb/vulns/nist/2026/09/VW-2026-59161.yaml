title: A flaw has been found in subhajitkhan online-clinic-management-system up 
  to e9ee77a8827a1446220fa07ee693dc4d9a29a578. This affects an unknown part of 
  the file doctorlogin.php. Executing a manipulation of the argument 
  doc_mail/doc_pswd can lead to sql injection. The attack can be executed 
  remotely. The exploit has been published and may be used. This product 
  implements a rolling release for ongoing delivery, which means version 
  information for affected or updated releases is unavailable. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
