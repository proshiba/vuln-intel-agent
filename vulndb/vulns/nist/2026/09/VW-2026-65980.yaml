title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  sprd: validate compress buffer sizes against fixed allocations\n\nsprd_platform_compr_open()
  allocates the stage 0 IRAM buffer (32K data\narea) and the stage 1 DDR buffer (2M
  data area) with fixed sizes, but\nsprd_platform_compr_copy() derives all copy lengths
  from the user\ncontrolled runtime->fragment_size and the write() count, never\n\
  comparing them against the physical buffer sizes. The compress core\nonly checks
  fragment_size * fragments for an u32 overflow in\nsnd_compress_check_input(), so
  a local user can configure a logical\nbuffer of up to ~4GB via SNDRV_COMPRESS_SET_PARAMS,
  far exceeding the\nfixed allocations.\n\nA fragment_size larger than the 32K IRAM
  data area makes the stage 0\ncopy_from_user() overflow past the IRAM allocation,
  and a buffer_size\nlarger than the 2M DDR buffer makes the wrapping copy at the
  end of\nsprd_platform_compr_copy() write fully user controlled data past the\nbuffer.
  No SNDRV_PCM_TRIGGER"
