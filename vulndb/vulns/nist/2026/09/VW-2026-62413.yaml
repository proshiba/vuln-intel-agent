title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  o2hb: quiesce negotiate handlers and timeout work\n\nHeartbeat regions publish struct
  o2hb_region as the private data for the\nNEGO_TIMEOUT and NEGO_APPROVE o2net handlers
  as soon as make_item()\ncreates the configfs region.  The approve handler can call\n\
  o2hb_arm_timeout(), so a peer can touch the region timeout work before\ndev_store()
  has finished building the heartbeat runtime, or after teardown\nhas started to shut
  that runtime back down.\n\nThe final configfs put also has to keep reg alive until
  the last in-flight\no2net callback drops its handler reference. \no2net_unregister_handler_list()
  blocks future handler lookups, but it does\nnot wait for sc_rx_work that already
  passed o2net_handler_get().  That\ndrain needs to cover local listener teardown
  as well, where the o2net\nordered workqueue may already be inside destroy_workqueue().\n\
  \nFix the lifetime rule in both directions.  Initialize the region delayed\nworks
  befor"
