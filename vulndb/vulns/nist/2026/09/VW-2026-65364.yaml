title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  fix potential use of uninitialized apm_filtered bitmap\n\nThe DECLARE_BITMAP(apm_filtered,
  AP_DEVICES) macro allocates the bitmap\non the stack without zero-initializing it.\n\
  \nIn vfio_ap_mdev_hot_plug_cfg(), the vfio_ap_mdev_filter_matrix() function\nis
  only called to initialize and populate apm_filtered if either\nfilter_adapters or
  filter_domains is true. If the hot plug configuration\nchange only adds control
  domains (meaning filter_cdoms is true, but\nfilter_adapters and filter_domains are
  both false),\nvfio_ap_mdev_filter_matrix() is bypassed.\n\nConsequently, apm_filtered
  is passed to reset_queues_for_apids() with\nuninitialized stack garbage. This can
  cause reset_queues_for_apids() to\ninterpret arbitrary stack garbage bits as valid
  APIDs to reset, potentially\nperforming unintended guest hardware queue resets.\n\
  \nFix this by zero-initializing the apm_filtered bitmap at the beginning of\nvfio_ap_mdev_hot_plug_cfg("
