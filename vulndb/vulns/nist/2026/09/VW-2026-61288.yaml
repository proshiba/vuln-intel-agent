title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  nVMX: Always flush vpid02 on first use\n\nMake sure vpid02 is always flushed on
  first use by setting last_vpid=0\nwhen allocating vpid02.  nested_vmx_transition_tlb_flush()
  will always\ndetect a VPID change on first VM-Enter after VMXON, because VPID=0
  in\nvmcs12 is not allowed if L1 enables VPID.\n\nThis avoids using stale TLB entries
  from a previous lifetime of the\nVPID, that might have been associated with a different
  vCPU (or a\ncompletely different VM).\n\nNote that last_vpid is already being initialized
  as 0 when the vCPU is\ncreated, but it is not reset when vpid02 is freed on VMXOFF.
  Hence, the\nproblem can only occur if L1 does VMXOFF -> VMXON, runs an L2, and KVM\n\
  happens to reuse a VPID that has TLB entries on the physical CPU."
