title: The s2Member – Excellent for All Kinds of Memberships, Content 
  Restriction Paywalls & Member Access Subscriptions plugin for WordPress is 
  vulnerable to Remote Code Execution in all versions up to, and including, 
  260814 via the 'first_name' parameter parameter. This is due to insufficient 
  sanitization of the first_name parameter via esc_refs(), which strips only 
  regex backreferences and not PHP tags, before substitution into the eval'd 
  Signup Tracking Codes template, combined with disclosure of the site-global 
  proxy verification key that allows PayPal postback verification to be 
  bypassed. This makes it possible for unauthenticated attackers to execute code
  on the server. Successful exploitation requires that the site administrator 
  has configured a Signup Tracking Codes template containing the %%first_name%% 
  placeholder (a documented, GUI-supported feature) and that the attacker has 
  obtained the site-global proxy verification key, which is exposed in plaintext
  in the JSON response of any
