title: passport-saml-encrypted through 0.1.13 contains an XML signature wrapping
  vulnerability where signature verification and assertion extraction use 
  independent XPath lookups with no cross-validation. Attackers holding any 
  validly signed SAML message can prepend a forged unsigned assertion that gets 
  accepted as the verified identity while the genuine signature validates 
  against the original assertion.
