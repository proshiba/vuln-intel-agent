title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rtl2832_sdr: release URBs and stream buffers on start_streaming() failure\n\nrtl2832_sdr_start_streaming()
  calls rtl2832_sdr_alloc_stream_bufs(),\nrtl2832_sdr_alloc_urbs() and rtl2832_sdr_submit_urbs()
  in sequence and\nshares a single err: label that only unlocks the mutex and returns.\n\
  When alloc_urbs() succeeds but submit_urbs() fails, or when alloc_urbs()\nitself
  returns -ENOMEM after alloc_stream_bufs() has already succeeded,\nthe URBs and/or
  the coherent DMA stream buffers stay allocated while\nstreaming reports failure
  to vb2. Two latent defects follow on the next\nVIDIOC_STREAMON:\n\n1) rtl2832_sdr_alloc_stream_bufs()
  unconditionally resets dev->buf_num\n   to 0 and overwrites dev->buf_list[]/dev->dma_addr[],
  permanently\n   leaking the coherent DMA memory allocated by the previous attempt.\n\
  \n2) rtl2832_sdr_alloc_urbs() never resets dev->urbs_initialized and only\n   increments
  it. After a second successful pass urbs_i"
