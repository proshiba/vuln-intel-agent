title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: mvm: fix off-by-one in TXF key sanitiser\n\niwl_mvm_frob_txf_key_iter()
  tracks the last matched byte position\nin loop variable 'i'. When a full key match
  is found (match ==\nkeylen), 'i' points at the last byte of the matched key. The\n\
  memset start offset should therefore be i + 1 - keylen, not\ni - keylen; the current
  code zeroes one byte before the match\nand leaves the final key byte un-sanitised."
