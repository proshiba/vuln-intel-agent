title: Gardener implements the automated management and operation of Kubernetes 
  clusters as a service. Prior to 1.142.6, 1.143.3, 1.144.2, and 1.145.0, the 
  customverbauthorizer admission plugin's mustCheckProjectMembers manage-members
  check compares changes to User subjects but does not account for Group or 
  ServiceAccount subjects in Project.spec.members. A project administrator who 
  lacks manage-members permission can add arbitrary Group or ServiceAccount 
  subjects, including the system:authenticated Group, and thereby grant broad 
  project access. The resulting access can include Shoots, Secrets, and cloud 
  provider credentials. This issue is fixed in versions 1.142.6, 1.143.3, 
  1.144.2, and 1.145.0.
