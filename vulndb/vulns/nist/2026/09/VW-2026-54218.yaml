title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  fix AO info use-after-free in tcp_ao_connect_init()\n\ntcp_v4_connect() adds a SYN-SENT
  socket to the ehash before calling\ntcp_connect().  If TCP-AO is configured, tcp_connect()
  first verifies that\na key matches the peer and the bound device's current L3 master.\n\
  tcp_ao_connect_init() later resolves the L3 master again and removes keys\nwhich
  do not match it.\n\nThe socket lock does not stabilize the bound device's VRF membership.\n\
  Detaching the device from its VRF between the initial validation and the\nL3-master
  calculation in tcp_ao_connect_init() can therefore make the\nvalidation succeed
  while initialization observes the default L3 domain and\nremoves the only key. \
  \ The subsequent AO lookup then fails, so the no-key\npath clears tp->ao_info and
  frees it directly.\n\nThe receive path can find the socket in the ehash and load
  tp->ao_info\nunder RCU before acquiring the socket lock.  A reader which loaded
  the old\npointer can"
