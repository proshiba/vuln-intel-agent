title: A vulnerability has been found in olivier-ls PHP-FTS up to 1.1.3. This 
  affects the function SearchEngine::matchesSingleFilter of the file 
  src/SearchEngine.php of the component Filter Matching. The manipulation leads 
  to incorrect comparison. Remote exploitation of the attack is possible. The 
  exploit has been disclosed to the public and may be used. Upgrading to version
  1.1.4 is able to mitigate this issue. The identifier of the patch is 
  0b2fae333d6b022da7ed4c43e2d41aa03f91dff3. It is suggested to upgrade the 
  affected component. The vendor was contacted early, responded in a very 
  professional manner and quickly released a fixed version of the affected 
  product.
