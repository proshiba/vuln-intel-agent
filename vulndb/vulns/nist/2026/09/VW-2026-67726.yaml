title: "Issue summary: The first concurrent use of the same X.509 certificate by\n\
  several threads may cause its cached extension data to be freed while\nanother thread
  is still using it.\n\nImpact summary: A remote, unauthenticated peer could crash
  a multi-threaded\nTLS client, or a multi-threaded TLS server that requests client\n\
  certificates, if the first certificate chains built to the same trusted CA\ncertificate
  are built by several connections at the same time. This is a\nuse-after-free read,
  which is likely to crash the process, resulting in a\nDenial of Service.\n\nCWE:
