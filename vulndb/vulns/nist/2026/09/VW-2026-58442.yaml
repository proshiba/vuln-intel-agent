title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  bound copied dentry name length in NFS export get_name\n\nceph_get_name() copies
  the MDS-supplied name into the caller's\nNAME_MAX-sized buffer with memcpy(name,
  rinfo->dname, rinfo->dname_len)\nand then writes name[rinfo->dname_len] = 0, without
  checking dname_len\nagainst NAME_MAX. A malicious or buggy MDS that returns a LOOKUPNAME
  reply\nwith dname_len > NAME_MAX overflows the buffer. __get_snap_name() copies\n\
  rde->name / rde->name_len the same unchecked way.\n\nImpact: a malicious or compromised
  Ceph MDS overflows the NAME_MAX name\nbuffer in a client's NFS-export get_name path,
  a slab out-of-bounds write\nreported by KASAN. Reachable when a CephFS mount is
  re-exported over NFS.\n\nAdd ceph_export_copy_name(), which rejects lengths above
  NAME_MAX with\n-ENAMETOOLONG before the copy, and use it in both ceph_get_name()
  and\n__get_snap_name()."
