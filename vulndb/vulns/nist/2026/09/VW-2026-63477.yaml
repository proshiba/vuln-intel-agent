title: The WP Recipe Maker plugin for WordPress is vulnerable to Arbitrary 
  Shortcode Execution in all versions up to, and including, 10.8.1. The 
  vulnerability exists because `WPRM_Metadata::sanitize_metadata()` recursively 
  calls `do_shortcode()` on every scalar field of the recipe's structured 
  metadata array — including the `reviewBody` field, which is populated verbatim
  from the `comment_content` of approved `wprm-comment-rating` comments — 
  without sanitizing or stripping shortcode tokens before execution; the 
  subsequent `wp_strip_all_tags()` and `strip_shortcodes()` calls operate only 
  on the output string after execution has already fully occurred, providing no 
  protection against server-side shortcode invocation. This makes it possible 
  for unauthenticated attackers to execute arbitrary registered WordPress 
