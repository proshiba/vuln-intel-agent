title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/uverbs:
  Guard legacy bundles without method_elm\n\nThe legacy write() path dispatches through
  a uverbs_api_write_method, but\nthe uverbs_attr_bundle passed to provider code does
  not have an ioctl\nmethod element. If malformed provider input causes the common
  uverbs\nvalidation code to emit an error message, uverbs_get_handler_fn()\ndereferences
  the uninitialized method_elm pointer.\n\nInitialize method_elm explicitly for legacy
  bundles and make\nuverbs_get_handler_fn() return NULL when no ioctl method is present.
  The\nlegacy dispatcher continues to use its local write method, while the ioctl\n\
  path continues to use the registered ioctl handler."
