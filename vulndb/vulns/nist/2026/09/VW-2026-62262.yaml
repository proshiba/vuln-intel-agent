title: "In the Linux kernel, the following vulnerability has been resolved:\n\npnfs/blocklayout:
  Fix device leaks on parse failure\n\nbl_parse_concat() and bl_parse_stripe() allocate
  a child device array and\nthen parse each child in turn.  If parsing a child fails,
  the failed child is\nnot counted in nr_children and the parent may be left with
  a children array\nthat bl_free_device() will not release when nr_children is zero.\n\
  \nRelease the failed child and the already parsed children before returning the\n\
  error.  Also make bl_free_device() release the child array whenever the\nchildren
  pointer is set, so that partially initialised concat or stripe\ndevices are cleaned
  up correctly.\n\nbl_parse_scsi() can also fail after assigning d->bdev_file and
  dropping the\nfile reference.  Clear the pointer after fput() so that an outer cleanup
  path\ndoes not put it again."
