title: Acode is a powerful text and code editor for Android. From 1.11.6 until 
  1.12.7, com.foxdebug.acode.rk.exec.terminal.TerminalService is declared as an 
  exported service in src/plugins/terminal/plugin.xml without a binding 
  permission, and src/plugins/terminal/src/android/TerminalService.java does not
  verify the caller. Any installed Android application can bind the service and 
  send MSG_EXEC with an attacker-controlled cmd value, which the terminal 
  implementation passes to ProcessBuilder with sh -c inside Acode's UID. This 
  allows a zero-permission local application to execute commands with access to 
  Acode private data, remote credentials, Storage Access Framework grants, and 
  runtime permissions without additional interaction at attack time. This issue 
  is fixed in version 1.12.7.
