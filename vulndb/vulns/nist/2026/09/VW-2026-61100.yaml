title: In NLnet Labs Unbound up to and including 1.26.0, a vulnerability was 
  found in that can progressively corrupt heap memory and under certain systems 
  and compilation options could lead to remote code execution. The vulnerability
  starts when CNAME synthesis during an upstream response needs to 
  enforce(rewrite) a max TTL value in the packet buffer. Coupled with a 
  compression pointer that points to the overwritten value and invalidates the 
  domain name, it leads to an error path that does not properly move the buffer 
  position and allows for the heap buffer overflow. Since this is heavily 
  reliant on heap memory layout, results are memory corruption that eventually 
  leads to a crash and under specific systems and compilation options remote 
  code execution.
