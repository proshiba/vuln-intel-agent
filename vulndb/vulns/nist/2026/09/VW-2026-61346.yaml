title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  lock mutex in ceph_mds_check_access()\n\nMDS session OPEN handling replaces mdsc->s_cap_auths
  under\nmdsc->mutex, freeing the previous array and its strings.\n\nceph_mds_check_access()
  traverses this array without holding the\nmutex.  A concurrent session reopen can
  therefore free the array while\nit is being inspected, resulting in a use-after-free
  like this:\n\n  Unable to handle kernel paging request at virtual address 003aaad64b2c8bb9\n\
  \  [...]\n  Internal error: Oops: 0000000096000004 [#1]  SMP\n  Modules linked in:\n\
  \  CPU: 56 UID: 2953037534 PID: 1253231 Comm: php-cgi8.4 Not tainted 6.18.45-i2-ampere
  #1146 NONE\n  [..]\n  pc : ceph_mds_check_access+0xd4/0x550\n  lr : ceph_mds_check_access+0xc8/0x550\n\
  \  [...]\n  Call trace:\n   ceph_mds_check_access+0xd4/0x550 (P)\n   ceph_atomic_open+0x138/0xbe8\n\
  \   path_openat+0xa24/0xfa8\n   do_filp_open+0x94/0x158\n   do_sys_openat2+0x88/0xf8"
