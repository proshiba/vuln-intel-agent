title: A security flaw has been discovered in Rizwan17 
  inventory-management-system up to bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. 
  Affected by this vulnerability is the function DBOperation.addCategory of the 
  file includes/process.php of the component AJAX Backend. The manipulation of 
  the argument userid results in missing authentication. The attack may be 
  performed from remote. The exploit has been released to the public and may be 
  used for attacks. This product utilizes a rolling release system for 
  continuous delivery, and as such, version information for affected or updated 
  releases is not disclosed. The project was informed of the problem early 
  through an issue report but has not responded yet.
