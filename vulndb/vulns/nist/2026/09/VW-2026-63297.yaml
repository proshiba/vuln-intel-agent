title: LubeLogger is a self-hosted, open-source, web-based vehicle maintenance 
  and fuel mileage tracker. Prior to 1.6.8, an authenticated user could submit 
  caller-controlled recordIds to the DuplicateRecordsToOtherVehicles endpoint 
  while naming destination vehicleIds the user could edit. The endpoint 
  authorized the destination vehicles but fetched source records in 
  Controllers/VehicleController.cs without checking UserCanEditVehicle for each 
  existingRecord.VehicleId. This missing source-vehicle authorization allowed 
  service, collision, upgrade, fuel, tax, supply, note, odometer, reminder, 
  plan, inspection, and equipment records belonging to another user to be copied
  into an attacker-controlled vehicle, exposing record contents and attachment 
  paths and creating persistent copies. This issue is fixed in version 1.6.8.
