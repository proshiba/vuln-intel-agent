title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd:
  recheck spare changes before starting sync\n\nremove_spares() and remove_and_add_spares()
  modify the array's rdev\nconfiguration. These operations are only safe after the
  array has been\nsuspended.\n\nmd_start_sync() checks whether spare configuration
  changes are needed\nbefore taking reconfig_mutex. However, the rdev state can change
  before\nthe mutex is acquired, so the initial check can become stale. In that\n\
  case, md_choose_sync_action() may remove or replace rdevs while normal\nI/O is still
  accessing them.\n\nThe race can occur as follows:\n\nraid10d          Worker   \
  \                   Normal IO\n____________     _______________________     ______________________\n\
  \n                                             raid10_write_request()\n        \
  \                                     wait_blocked_dev()\nset Blocked\nset Faulty\n\
  \                                             Skip Faulty rdev\n               \
  \                              r"
