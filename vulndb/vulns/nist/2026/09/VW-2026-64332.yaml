title: "Nuclei is a vulnerability scanner built on a simple YAML-based DSL. From 3.0.0
  until 3.10.0, the nuclei/mysql JavaScript library does not enforce the local-file
  sandbox when a JavaScript template supplies the allowAllFiles MySQL DSN option.
  An untrusted javascript: template scanning an attacker-controlled MySQL-compatible
  endpoint can cause the server to issue LOAD DATA LOCAL INFILE requests for arbitrary
  paths, after which the scanner's MySQL client reads the files and returns their
  contents to the server even though -allow-local-file-access is disabled. JavaScript
  templates can run unsigned and without the -code flag on affected versions, and
  the bypass affects CLI and SDK deployments that accept untrusted templates. This
  issue is fixed in version 3.10.0."
