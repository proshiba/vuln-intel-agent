title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a cross-site request forgery vulnerability in deleteHistory.json.php 
  and finishAll.json.php that allows unauthenticated attackers to mutate live 
  history by making GET requests without CSRF token validation. Attackers can 
  craft malicious pages that trigger administrator browsers to delete all live 
  transmission history or mark streams as finished when an admin visits the 
  attacker-controlled site.
