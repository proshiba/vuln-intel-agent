title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Don't fall back to a freed smmu after devm_krealloc()\n\n__tegra241_cmdqv_probe()
  uses devm_krealloc() to grow @smmu into the larger\ntegra241_cmdqv, which frees
  the original @smmu once it relocates. A failure\nafter that returned NULL, and the
  caller then dereferenced the freed @smmu\non its fallback path.\n\nReturn an int
  and take @smmu by reference instead, then update *smmu to the\nreallocated pointer
  after devm_krealloc() succeeds, so the caller and its\nfallback path both use the
  live @smmu rather than the freed original."
