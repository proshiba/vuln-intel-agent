title: "Issue summary: OpenSSL QUIC stack does not enforce connection\nlevel flow
  control for streams. Remote peers may send more bytes\nas long as they fit within
  the stream flow control limits.\n\nImpact summary: A malicious remote peer may exploit
  the lack of connection\nflow control for streams to make the QUIC stack receive
  ~100MB of memory\ninstead of 768 KiB (default flow control window size).\n\nCWE:
  CWE-770: Allocation of Resources Without Limits or Throttling\n\nDescription: The
  local QUIC stack advertises two flow control limits\nto its remote peer: stream
  flow control limit and connection flow\ncontrol limit. The remote peer must follow
  both limits when transmitting\nstream data.\n\nWhenever the local QUIC stack receives
  a stream frame, it validates\nthat the size of the received stream frame stays within
  flow control limits.\nIf either limit is exceeded (stream level or connection level),
  then\nthe QUIC stack must close the connection with a flow control error.\n\nThe
  vulnerable OpenSSL QUIC stack en"
