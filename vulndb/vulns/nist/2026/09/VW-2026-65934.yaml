title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/crypto:
  Map EBUSY to EIO when key conversion fails repeatedly\n\nWhen hardware persistently
  returns -EBUSY after exhausting retries,\nthe error propagates to crypto_finalize_*_request().
  The crypto API's\ncompletion wrapper treats -EBUSY as a queueing status and swallows
  it,\npreventing the completion callback from firing. This causes callers\nusing
  crypto_wait_req() to block indefinitely.\n\nTranslate persistent -EBUSY to -EIO
  after retry exhaustion to ensure\nproper error propagation and callback invocation."
