title: Concrete CMS before 9.5.3 evaluated the authorization check for an 
  Express entry submission against the entity of the posted form rather than the
  entity identified by the dashboard route. As a result, a user permitted to add
  entries to one Express object could create entries in a different Express 
  object outside their authorization scope, potentially polluting protected 
  datasets, triggering workflows, or injecting content into administrative 
  processes. The dashboard submit route resolved the mutated entity from the 
  attacker-controlled route ID while the permission check validated the 
  independently posted form's entity, and the submission proceeded because the 
  two entities were never compared. The Concrete CMS security team gave this 
  vulnerability a CVSS v4.0 score of 5.1 with vector 
  CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:L/VA:N/SC:N/SI:N/SA:N. Thanks 
  Yonatan Drori from Tenzai for reporting.
