title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix potential use after free in ib_free_cq()\n\nWhen accessing a CQ via the netlink
  path the only synchronization\nmechanism for the said CQ is rdma_restrack_get().\n\
  Currently, rdma_restrack_del() is invoked at the end of\nib_free_cq(), which is
  too late, since by that point\nvendor-specific resources associated with the CQ
  might already be\nfreed. This can leave a short window where the CQ remains accessible\n\
  through restrack, leading to a potential use-after-free.\n\nFix this by moving the
  rdma_restrack_del() call to be before the freeing\nof the vendor-specific resources
  ensuring that the CQ is removed from\nrestrack before its internal resources are
  released.\nThis guarantees that no new users hold references to a CQ that is in\n\
  the process of destruction."
