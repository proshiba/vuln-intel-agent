title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  riscv: Fix extable handling for arena load_acquire\n\nemit_atomic_ld_st() returns
  1 to have build_body() skip the zext after\na sub-word load_acquire. The caller
  does \"ret = ret ?:\nadd_exception_handler(...)\", which skips add_exception_handler()
  on any\nnon-zero ret, so the extable entry is missing and a faulting\nPROBE_ATOMIC
  load_acquire oopses.\n\nREG_DONT_CLEAR_MARKER leaves rd stale on fault, and the
  verifier still\nthinks the load overwrote it, so a program can leak it through a
  map.\n\nCheck ret >= 0 before calling add_exception_handler(), and pass rd for\n\
  LOAD_ACQ so the fault zeroes rd like a PROBE_MEM load. Return ret\nunchanged for
  the zext skip."
