title: A security vulnerability has been detected in gouguoa up to 5.10.0/6.0.1.
  This vulnerability affects the function update of the file 
  app/home/controller/Index.php of the component edit_personal Endpoint. Such 
  manipulation of the argument position_id leads to dynamically-determined 
  object attributes. The attack can be executed remotely. The exploit has been 
  disclosed publicly and may be used. Upgrading to version 6.0.3 is able to 
  resolve this issue. Upgrading the affected component is advised.
