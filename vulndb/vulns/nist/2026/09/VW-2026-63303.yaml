title: SysReptor is a fully customizable pentest reporting platform. Prior to 
  2026.61, authenticated users of SysReptor Professional can upload image files 
  whose formats cause image processing to invoke Ghostscript, allowing embedded 
  PostScript to operate in the shared temporary directory. An attacker can 
  combine that behavior with a race involving GnuPG configuration files in 
  temporary subdirectories to cause GnuPG to copy attacker-controlled Python 
  code into the application code directory. The injected code executes with the 
  privileges of the SysReptor application process after a worker restart. The 
  Community edition is not affected. Version 2026.58 contains a partial 
  mitigation, and this issue is fully fixed in version 2026.61.
