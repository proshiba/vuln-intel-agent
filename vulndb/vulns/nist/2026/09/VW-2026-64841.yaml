title: scim-patch is a library for applying SCIM patch operations. Prior to 
  0.9.2, navigate() reads inherited properties and assign() uses prototype-chain
  membership checks while resolving attacker-controlled SCIM PATCH paths. A path
  or one of the dotted value keys beginning with an inherited property such as 
  toString can therefore traverse into a shared built-in function object and add
  attacker-controlled properties, causing process-global mutation that may 
  affect application logic reading inherited-method properties. This issue is 
  fixed in version 0.9.2.
