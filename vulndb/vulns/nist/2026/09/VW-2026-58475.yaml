title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix clock domain mismatch in clients_still_reclaiming()\n\nclients_still_reclaiming()
  computes a deadline from nn->boot_time\n(CLOCK_REALTIME, ~1.7 billion) but compares
  it against\nktime_get_boottime_seconds() (CLOCK_BOOTTIME, seconds since boot).\n\
  The comparison is always false — it would take ~54 years of uptime\nfor BOOTTIME
  to exceed the REALTIME-derived deadline.\n\nThis means any client can hold the server
  in grace indefinitely by\nsending CLAIM_PREVIOUS OPEN requests, blocking all non-reclaim\n\
  operations for all other clients.\n\nAdd boot_time_bt (CLOCK_BOOTTIME) alongside
  the existing boot_time\nand use it for the deadline computation. boot_time (CLOCK_REALTIME)\n\
  is preserved for its cl_boot clientid-nonce role."
