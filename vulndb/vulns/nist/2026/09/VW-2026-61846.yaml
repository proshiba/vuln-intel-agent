title: A flaw was found in quay-builder-qemu. A remote attacker could exploit 
  this by compromising the upstream `Noelware/docker-manifest-action` used in 
  the release workflow, which is pinned to a mutable branch. This allows the 
  attacker to inject arbitrary code, leading to the exfiltration of sensitive 
  registry credentials or the publication of malicious images. The workflow also
  exposes the default GitHub token, increasing the severity of the compromise.
