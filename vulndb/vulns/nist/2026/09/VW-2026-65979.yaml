title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  sti: initialize IRQ lock before requesting IRQ\n\nuni_reader_init() registers the
  shared IRQ before initializing\nreader->irq_lock. A pending interrupt can invoke
  the handler while the\nlock is still uninitialized.\n\nInitialize the lock before
  registering the IRQ so the interrupt path\nalways sees valid lock state."
