title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: goku_udc: avoid NULL deref of dev->driver in INT_USBRESET log\n\ngoku_irq()
  handles a number of bus events under a single ep0 path.\nIt already guards the gadget
  driver suspend/resume callbacks against a\nNULL ->driver:\n\n\tif (dev->gadget.speed
  != USB_SPEED_UNKNOWN\n\t\t\t&& dev->driver\n\t\t\t&& dev->driver->resume) {\n\t\t\
  spin_unlock(&dev->lock);\n\t\tdev->driver->resume(&dev->gadget);\n\t\t...\n\t}\n\
  \nbut the very next branch unconditionally dereferences dev->driver\nwhen an INT_USBRESET
  arrives:\n\n\tif (stat & INT_USBRESET) {\n\t\tACK(INT_USBRESET);\n\t\tINFO(dev,
  \"USB reset done, gadget %s\\n\",\n\t\t\tdev->driver->driver.name);\n\t}\n\nIf the
  controller raises INT_USBRESET before any gadget driver has\nbeen bound (or after
  one has been unbound), dev->driver is NULL and\nthe printk dereferences NULL.\n\n\
