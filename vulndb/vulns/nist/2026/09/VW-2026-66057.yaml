title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_input:
  reset device if input_register_device() fails\n\nProbe marks the device DRIVER_OK
  with virtio_device_ready() before\ncalling input_register_device(). If registration
  fails, the error path\ncleared vi->ready and called del_vqs() while the device was
  still live,\nso the device could keep DMA to queues that were already torn down.\n\
  \nMatch remove/freeze: call virtio_reset_device() on that path before\ntearing down
  the virtqueues."
