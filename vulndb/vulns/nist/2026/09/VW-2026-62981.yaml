title: A security vulnerability has been detected in marcopiovanello 
  yt-dlp-web-ui up to v4. This issue affects the function NewGenericDownload of 
  the file server/internal/downloaders/generic.go. Such manipulation of the 
  argument params leads to command injection. It is possible to launch the 
  attack remotely. The exploit has been disclosed publicly and may be used. The 
  name of the patch is c7ad3bd79c7c520a7d17e7f2ba19d962be8e7897. A patch should 
  be applied to remediate this issue.
