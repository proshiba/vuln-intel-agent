title: Budibase versions 3.41.0 before 3.45.0 contain an authentication bypass 
  in the OIDC/SSO login path of @budibase/server. In sso.authenticate, when no 
  existing user matches the incoming SSO subject, the server looks up pending 
  user invites by the IdP-asserted email address alone — without validating an 
  invite code and without an email_verified check (the email_verified gate 
  protects only the existing-account lookup). An attacker who can register at an
  IdP that the tenant trusts for OIDC and assert a victim's invited email 
  address (even with email_verified=false) claims the pending invite and 
  inherits all of its granted privileges, including builder and admin.global, 
  with no admin exclusion. This results in takeover of the invited principal 
  and, for admin invites, full tenant compromise (access to all apps, 
  datasources including production credentials, and automations); the invite is 
  consumed, denying onboarding to the legitimate invitee.
