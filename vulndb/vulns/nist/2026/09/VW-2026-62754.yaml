title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/rockchip:
  analogix_dp: Fix OF node reference leak via auto cleanup\n\nSashiko reported a reference
  leak in rockchip_dp_drm_encoder_enable(),\nthe of_get_child_by_name() function does
  not call of_node_put() in a\nsymmetrical way [1].\n\nFix the device node reference
  leak by using __free(device_node) to\nautomatically manage of_node_put() for all
  device nodes."
