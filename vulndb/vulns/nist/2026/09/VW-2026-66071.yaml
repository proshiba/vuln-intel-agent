title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd:
  Fix ineffective error check in nested domain allocation\n\namd_iommu_pdom_id_alloc()
  returns an int: a domain ID on success, or the\nnegative errno from ida_alloc_range()
  when the ID space is exhausted or\nmemory is short.  amd_iommu_alloc_domain_nested()
  stores that return value\nin gdom_info->hdom_id, which is a u32, and only then tests
  it:\n\n\tgdom_info->hdom_id = amd_iommu_pdom_id_alloc();\n\tif (gdom_info->hdom_id
  <= 0) {\n\nThe assignment discards the sign, so -ENOSPC becomes 0xffffffe4 and the\n\
  test never fires.  The nested domain is then set up with a host domain ID\nthat
  was never allocated, instead of the allocation failing with -ENOSPC.\n\nKeep the
  value in an int, test it there, and store it only once it is\nknown to be valid,
  which is what the other amd_iommu_pdom_id_alloc()\ncallers already do."
