title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost-vdpa:
  protect config_ctx from being freed under the config callback\n\nvhost_vdpa_config_cb()
  loads v->config_ctx and signals it without taking\na reference and without holding
  any lock:\n\n\tstruct eventfd_ctx *config_ctx = v->config_ctx;\n\n\tif (config_ctx)\n\
  \t\teventfd_signal(config_ctx);\n\nVHOST_VDPA_SET_CONFIG_CALL replaces that field
  and drops what is normally\nthe last reference to the old context:\n\n\tswap(ctx,
  v->config_ctx);\n\n\tif (ctx)\n\t\teventfd_ctx_put(ctx);\n\neventfd_ctx_put() drops
  the last kref and frees the context immediately,\nwith no RCU grace period, so a
  callback that has already loaded the\npointer goes on to dereference freed memory.\
  \  The two sides share no\nlock: the ioctl runs under vhost_dev.mutex, while the
  parent invokes the\ncallback from its own interrupt or workqueue context.\n\nThis
  is not the reopen refcount underflow fixed by commit f6bbf0010ba0\n(\"vhost-vdpa:
