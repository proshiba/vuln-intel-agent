title: "MISP contains a session fixation vulnerability in the CustomAuth authentication
  (a custom configuration) flow. When a user was successfully authenticated through
  CustomAuth, MISP stored the authenticated user identity in the existing session
  without first rotating the session identifier.\n\n\nAs a result, if an attacker
  can cause a victim to use a session identifier known to the attacker before authentication,
  that same session identifier remains valid after the victim successfully authenticates.
  The attacker could subsequently reuse the fixed session identifier to access the
  victim's authenticated MISP session, potentially gaining the privileges associated
  with the victim's account.\n\n\nThe issue occurs because __customAuthentication()
