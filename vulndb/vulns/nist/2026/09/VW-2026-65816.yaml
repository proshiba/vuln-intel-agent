title: The WP Maps – Google Maps,OpenStreetMap,Mapbox,Store 
  Locator,Listing,Directory & Filters plugin for WordPress is vulnerable to 
  Local File Inclusion in all versions up to, and including, 4.9.8 via the 
  'page' parameter parameter. This makes it possible for authenticated 
  attackers, with subscriber-level access and above, to include and execute 
  arbitrary .php files on the server, allowing the execution of any PHP code in 
  those files. This can be used to bypass access controls, obtain sensitive 
  data, or achieve code execution in cases where .php file types can be uploaded
  and included.
