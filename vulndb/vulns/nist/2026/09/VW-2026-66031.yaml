title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/core:
  Allow list_del during perf_event_overflow()\n\nA PMU might use perf_sched_cb_inc()
  and perf_sched_cb_dec()\ninterface to get the PMU call back function pmu::sched_task\n\
  invoked at schedule in and schedule out. This is achieved\nby walking along the
  list anchored by sched_cb_list.\n\nThe following scenario might lead to a list corruption.\n\
  \n   perf_pmu_sched_task()\n      for_each_list_entry(..., &sched_cb_list)\n   \
  \   +--> __perf_pmu_sched_task()\n           +--> event->pmu->sched_task())\n  \
  \              +--> PMU_push_sample()\n                     +--> perf_event_overflow()\n\
  \                          +--> __perf_event_overflow()\n                      \
  \         +--> pmu->stop()\n                                    +--> perf_sched_cb_dec()\n\
  \                                         remove entry from sched_cb_list\n    \
  \                                     while list node in use.\n\nThis happens when
  ioctl(fd, PERF_EVENT_IOC_REFR"
