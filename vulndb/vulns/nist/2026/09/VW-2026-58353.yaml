title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip6_tunnel:
  use skb_cow_head() in ip6_tnl_xmit()\n\nip6_tnl_xmit() may need to expand headroom
  before it can push the\nouter IPv6 and optional encap headers. It currently does
  that with\nskb_realloc_headroom(), copies skb->sk ownership, consumes the original\n\
  skb, and then continues processing with the replacement skb kept only in\nits local
  variable.\n\nThat is safe only if the helper cannot fail afterwards. But this helper\n\
  still has post-reallocation error exits. collect_md tunnels reject\nnon-NONE encap
  after the replacement, and ip6_tnl_encap() can also fail\nlater. In those cases
  the helper returns an error to its callers while\nthe caller still only has the
  original skb pointer.\n\nBoth ip6_tnl_start_xmit() and the IPv6 GRE paths free the
  caller skb on\nerror, so they can end up freeing an skb that ip6_tnl_xmit() already\n\
  consumed.\n\nUse skb_cow_head() instead. It provides the required headroom and\n\
  writability without privately"
