title: MaxKB is an open-source AI assistant for enterprise. From version 2.0.0 
  through 2.9.2, a lowest-role workspace member denied access to a tool by 
  WorkspaceUserResourcePermission can still bind its identifier through 
  tool_ids, skill_tool_ids, or mcp_tool_ids and execute it through the agent or 
  workflow dispatch path. The dispatch path does not reapply the per-tool grant 
  enforced by dedicated tool routes, and tool execution decrypts server-side 
  init_params, allowing the caller to receive credentials carried by the denied 
  tool. No fixed version is available as of this review.
