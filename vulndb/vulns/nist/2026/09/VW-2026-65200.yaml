title: The MasterStudy LMS WordPress Plugin  WordPress plugin before 3.7.50 does
  not validate one of its display-style settings before using it to build a 
  template path, allowing users with the Contributor role and above to include 
  and execute arbitrary local PHP files on the server. An equivalent path was 
  corrected in an earlier release and this one was not, so the issue persists in
  versions the earlier advisory reports as fixed.
