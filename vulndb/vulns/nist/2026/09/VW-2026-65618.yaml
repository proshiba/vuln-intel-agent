title: Python Social Auth is a social authentication/registration mechanism. 
  Prior to version 5.0.0, the SAML backend accepted SAML responses on the 
  Assertion Consumer Service endpoint without verifying that they matched a 
  previously issued `AuthnRequest`. Applications using SAML account association 
  could allow an attacker with a valid account on a trusted IdP to link the 
  attacker's SAML identity to a logged-in victim's local account. The attacker 
  could then authenticate through SAML and gain access to the victim's account. 
  The issue affects applications using the SAML backend together with 
  authenticated account association. The issue has been fixed in version 5.0.0 
  by validating SAML responses against stored `AuthnRequest` IDs.
