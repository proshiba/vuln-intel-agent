title: SmartLife app dynamically generates fresh SmartLife application 
  authentication parameters inside its runtime process. Using the acquired 
  SmartLife application authentication parameters, an attacker can directly call
  the backend interface /account/verify.serv to obtain the real account ID 
  corresponding to a registered email address. By spoofing the application 
  authentication information together with the target account ID, the attacker 
  can reset the password of the target account.
