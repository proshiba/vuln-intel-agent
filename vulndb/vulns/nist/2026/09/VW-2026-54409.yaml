title: In xmlIO in libxml2 before 2.15.4, an inconsistency in 
  xmlOutputWriteCallback and xmlBufUse causes negative lengths to reach write 
  callbacks, aka a lack of a check for integer overflow before calling 
  writecallback. This has security relevance for many types of uses of that 
  length value within a callback.
