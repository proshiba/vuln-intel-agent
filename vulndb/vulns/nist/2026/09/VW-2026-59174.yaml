title: A weakness has been identified in Portabilis i-Educar up to 2.10. 
  Affected is an unknown function of the file FinalStatusImportService.php of 
  the component Final Status Import. Executing a manipulation of the argument 
  school_id can lead to improper authorization. The attack can be executed 
  remotely. The exploit has been made available to the public and could be used 
  for attacks. Upgrading to version 2.11.0 is able to address this issue. 
  Upgrading the affected component is advised. The vendor explains, that "[t]he 
  reported attack vector was tested against the corrected code, and the 
  previously described behavior could no longer be reproduced".
