title: A vulnerability exists in the Credential Manager component that may allow
  for unauthorized administrative access. An unauthenticated remote attacker 
  could exploit this vulnerability on a device in its factory-default or 
  post-ZTP state before any administrator has configured credentials by 
  providing a predictable factory-default password. Successful exploitation 
  could result in full administrative control of the affected device during the 
  initial setup process.
