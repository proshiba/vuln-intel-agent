title: FreePBX is an open source IP PBX. Prior to version 17.0.9, authenticated 
  users who are authorized to access the GraphQL api module interface of FreePBX
  are able to execute arbitrary shell commands. Authenticated access to the api 
  module is required. The PBX API module's documentation generator accepts an 
  authenticated host parameter and uses it to build a shell command. The code 
  path validates the generated OAuth access token before execution, but it does 
  not validate or escape host. Compromise results in authenticated arbitrary 
  shell command execution as the FreePBX web/PBX service user (typically 
  asterisk.). This issue has been patched in version 17.0.9.
