title: SiYuan before v3.8.2 contains a stored cross-site scripting vulnerability
  in the search asset preview feature that fails to escape indexed asset content
  before inserting it into the DOM using innerHTML. Attackers who can place 
  crafted text assets in a workspace can execute JavaScript in the SiYuan origin
  when victims preview the assets, enabling authenticated API requests and 
  workspace manipulation.
