title: 'HAPI FHIR is a complete implementation of the HL7 FHIR standard for healthcare
  interoperability in Java. Prior to version 6.9.12, SHCParser in org.hl7.fhir.r5/src/main/java/org/hl7/fhir/r5/elementmodel/SHCParser.java
  can consume attacker-controlled Smart Health Card JWT content whose header contains
  zip: "DEF" and whose small raw-DEFLATE payload expands to a very large value. SHCParser.decodeJWT()
  passes the decoded payload to SHCParser.inflate(), which accumulates all decompressed
  bytes in a ByteArrayOutputStream without an output-size limit before JSON parsing,
  and SHCParser.decompress() contains the same unbounded pattern. An application or
  validator service that accepts attacker-supplied SHC content can therefore suffer
  excessive heap allocation, severe garbage-collection pressure, request failure,
  process instability, or process termination. This issue is fixed in version 6.9.12.'
