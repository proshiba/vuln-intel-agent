title: Bludit CMS through 3.22.0 contains a missing authorization vulnerability 
  that allows authenticated users holding the Author or Editor role to read the 
  full content of private drafts and scheduled posts belonging to any other 
  user, including administrators, by exploiting the content-get-list AJAX 
  endpoint in bl-kernel/ajax/content-get-list.php. Attackers can send an 
  authenticated GET request to the admin AJAX endpoint with the draft parameter 
  set to true, triggering getList() without ownership constraints and returning 
  serialized page objects site-wide, exposing pre-publication material and 
  sensitive notes stored in administrator-owned drafts.
