title: "MISP contains an authorization flaw in the Organisation model's captureOrg
  method. When the $force parameter is set to true, the method unconditionally overwrites
  organization metadata fields without verifying that the invoking user holds sufficient
  privileges. A user with a sharing group (SG) editor role can trigger this code path,
  allowing them to modify organization metadata that should be restricted to site
  administrators or users with sync permissions.\n\nAccording to the commit message,
  this could lead to blueprint-based sharing group manipulation, meaning an attacker
  with SG editor access could alter organizational attributes in ways that influence
  how sharing groups and blueprints behave across the MISP instance. \n\nThe vulnerability
  requires an authenticated user with at least SG editor privileges and network access
  to the MISP web interface. The impact is primarily on the integrity of organization
  records and, potentially, on the integrity of sharing group configurations derived"
