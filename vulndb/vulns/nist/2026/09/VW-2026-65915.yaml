title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Prevent queue stop with deferred completions\n\nWhen the driver receives a burst
  of packets, it can mark a BD with the\nNO_CMPL bit to defer completions. The expectation
  is that the last\npacket in the ring will have this bit unset and the completion
  generated\nby that packet will cleanup that packet and the ones preceding it. This\n\
  helps to reduce the number of completions fired.\n\nThe suppressed completions are
  controlled by the driver and the number\nof packets with suppressed completions
  scales with the size of the ring.\nSW USO packets, on the other hand, have an upper
  bound on the maximum\nnumber of BDs which can be consumed which does not scale with
  the ring\nsize.\n\nSo, for small rings it is possible that: a burst of packets is
  handed to\nthe driver, the driver defers completions for all of the packets because\n\
