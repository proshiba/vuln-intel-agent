title: "MISP has a file-handling vulnerability that could let certain authenticated
  users make the server read files or access internal network services.\n\nWhen importing
  an XML file, MISP did not properly verify that the uploaded content was actually
  XML. Because of this, a user with permission to modify data could upload a file
  containing a local file path or a web address instead.\n\nIf a local file path was
  supplied, MISP could read that file from the server. If a URL was supplied, MISP
  could make a request to that address, including systems that may only be reachable
  from inside the organization’s network.\n\nThe vulnerability could therefore expose
  sensitive local files and allow unauthorized requests to internal services.\n\n\
  Exploitation required a valid MISP account with modify permissions, but no additional
  user interaction was needed.\n\nVersion affected: <2.5.47"
