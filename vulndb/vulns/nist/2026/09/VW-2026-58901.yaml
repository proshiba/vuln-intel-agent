title: A vulnerability was found in GPAC up to f1219cde. This affects the 
  function gf_svg_attributes_copy of the file scenegraph/svg_attributes.c of the
  component MP4Box. Performing a manipulation results in buffer over-read. The 
  attack is only possible with local access. The exploit has been made public 
  and could be used. Upgrading to version abi-16.23 mitigates this issue. The 
  patch is named afca1f1181668d85941d51ed1adf647807d5d975. Upgrading the 
  affected component is recommended.
