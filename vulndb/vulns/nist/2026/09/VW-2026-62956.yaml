title: snappy-java through 1.1.10.8 contains a buffer overflow vulnerability in 
  typed Snappy.uncompress*Array methods that allocate output arrays by dividing 
  uncompressed length by element size but pass the undivided length to native 
  code. Attackers controlling compressed input can cause misaligned length 
  values to write past array bounds with attacker-controlled bytes, corrupting 
  heap memory.
