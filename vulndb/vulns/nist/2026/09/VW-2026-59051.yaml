title: "Insufficiently Protected Credentials vulnerability in Apache Syncope.\n\n\
  Audit events, when sent to the configured store, are not sufficiently masked for
  the sensitive values they might carry on their payloads, thus allowing administrators
  to access such sensitive values.\n\n\n\n\n\nThis issue affects Apache Syncope: from
  3.0.0-M0 through 3.0.16, from 4.0.0-M0 Through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\
  \n\nUsers are recommended to upgrade to version 4.0.8 / 4.1.3, which fix this issue."
