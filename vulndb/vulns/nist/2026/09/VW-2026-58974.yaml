title: Joomla Extension - regularlabs.com - Privileged stored XSS via link 
  option in Articles Anywhere extension for Joomla < 20.0.0 - Articles Anywhere 
  accepts link options such as onclick and onmouseover. In affected versions, 
  those options become real HTML event attributes without checking the article 
  author's trust level. The plugin syntax survives Joomla's normal Author 
  content filter because the executable HTML is generated later.
