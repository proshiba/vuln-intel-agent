title: Capgo before 12.244.1 contains a cross-tenant integrity vulnerability in 
  the metadata-cleaning worker that trusts image object keys from mutable 
  database rows without validating ownership. An authenticated attacker can 
  place a victim tenant's image key in a row they control, causing the 
  service-role worker to download and re-upload that object with sanitized 
  metadata. Attackers can silently modify metadata in cross-tenant image objects
  by supplying known victim keys during authorized row updates, bypassing 
  storage access controls through the confused-deputy metadata worker.
