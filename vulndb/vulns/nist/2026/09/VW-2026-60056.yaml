title: Concrete CMS 9 through 9.5.2 does not perform an authorization check in 
  three actions of the Boards data source dashboard controller (update, 
  update_data_source, and delete_data_source), which resolve a 
  ConfiguredDataSource directly from an attacker-supplied identifier without 
  confirming the requester's edit permission on the owning board. A user granted
  edit_board_settings on a single board was therefore able to modify or 
  permanently delete the configured data sources of any other board on the site,
  halting the affected board's content feed and resetting its custom weighting. 
  The CSRF token that guards these actions was validated but bound to the action
  name rather than to the target object, so a token legitimately obtained for 
  one board could be replayed against another board's ConfiguredDataSource 
  identifier and did not constrain access. The Concrete CMS security team gave 
  this vulnerability a CVSS v4.0 score of 2.1 with vector 
  CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:N/VI:L/VA:L/SC:N/S
