title: "When audit logging is enabled (zookeeper.audit.enable=true), an unauthenticated
  attacker can inject arbitrary fields into Apache ZooKeeper's audit log by sending
  a digest authentication request with tab characters (\\t) embedded in the username.
  Because the audit log uses tab-separated key=value format, the injected tabs are
  parsed as legitimate field separators, allowing the attacker to spoof audit results
  (e.g., injecting result=success), forge operation types, and corrupt forensic evidence.\n\
  \nA log injection vulnerability in Apache ZooKeeper allows a client that can call setACL to
  inject forged key-value fields into zookeeper_audit.log. When audit logging is enabled,
  the server serializes attacker-controlled digest ACL ids into the acl= audit field
  without escaping tab characters. Because audit events are emitted as tab-separated key=value records,
  a crafted ACL id can make one successful setAcl event appear to contain forged fields
