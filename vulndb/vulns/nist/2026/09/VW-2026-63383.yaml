title: CordysCRM is an open source AI-powered customer relationship management 
  system that supports private deployment. Prior to 1.7.4, GET 
  /pool/lead/get/{id} in PoolClueController.get and GET /pool/account/get/{id} 
  in PoolCustomerController.get use bare pool-read permission checks without the
  CsPermission resourceId binding that enforces per-record data scope. An 
  authenticated user with the ordinary CLUE_MANAGEMENT_POOL:READ or 
  CUSTOMER_MANAGEMENT_POOL:READ permission can supply another record's id and 
  cause unscoped primary-key getters to return leads or accounts owned by other 
  users, departments, or organizations. Exposed data includes contact names, 
  phone numbers, owner and department attribution, and custom field values. This
  issue is fixed in version 1.7.4.
