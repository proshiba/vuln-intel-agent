title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_conn: fix the SCO setup context lifetime\n\nhci_setup_sync() queues a conn_handle_t
  with a NULL destroy callback, so\nthe context is only freed if hci_enhanced_setup_sync()
  actually runs. An\nentry that is cancelled instead is leaked, as\n_hci_cmd_sync_cancel_entry()
  does not release entry->data when there is\nno destroy callback, and hci_cmd_sync_clear()
  cancels every pending entry\nwhen the controller is unregistered.\n\nThe context
  also stores a bare hci_conn pointer, so the connection can be\nfreed while the work
  is queued. The dequeue in hci_conn_del() does not\ncover it either, as it matches
  on entry->data == conn and entry->data is\nthe wrapper here. Same problem as commit
  2f5d635ad590 (\"Bluetooth:\nhci_sync: hold conn in hci_connect_acl/le_sync() callbacks\"\
