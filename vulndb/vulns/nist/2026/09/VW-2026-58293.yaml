title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Fix subbuf resize race with ring_buffer_alloc_read_page()\n\nring_buffer_alloc_read_page()
  is racy with ring_buffer_subbuf_order_set,\nit can allocate a reader page with an
  outdated order. This isn't a big\nissue, the user can still re-allocate a new reader
  page and try again.\n\nHowever, what is more problematic is if the value of subbuf_order\n\
  changes in the middle of ring_buffer_alloc_read_page(). In that case,\nbpage->order
  might not match the actual allocated memory.\n\nUse bpage->order for the allocation
  to prevent this race."
