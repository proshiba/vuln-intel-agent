title: "Insufficient Session Expiration vulnerability in OAuth token issuance in hexpm
  hexpm allows a user whose organization membership or session has ended to keep reading
  the organization's private packages and their documentation tarballs via a retained
  refresh token.\n\ngenerate_refresh_token/4 in lib/hexpm/oauth/jwt.ex signs the refresh
  token with the same iss, aud and scope claims as the access token, so it carries
  the same repository:<org> scopes. The CDN service that serves private repositories
  verifies the signature and time claims and then authorizes from the scope claim,
  with no database lookup and no way to tell the two token kinds apart. Removing a
  member or revoking a session therefore takes effect at the CDN only when the 30
  day refresh token expires, instead of after the 30 minute access token lifetime.
  Access is read-only and limited to organizations the account belonged to when the
  token was granted.\n\nThis issue affects hex.pm: from 2025-10-10 before 2026-09-22."
