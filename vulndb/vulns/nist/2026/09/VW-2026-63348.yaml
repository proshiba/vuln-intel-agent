title: Chanjet CRM contains an unauthenticated SQL injection vulnerability that 
  allows remote attackers to execute arbitrary SQL queries by manipulating the 
  site_id GET parameter in the webservice endpoint. Attackers can exploit the 
  lack of input sanitization or parameterization through UNION-based injection 
  techniques to extract sensitive data from the underlying database. 
  Exploitation evidence was first observed by the Shadowserver Foundation on 
  2023-10-18.
