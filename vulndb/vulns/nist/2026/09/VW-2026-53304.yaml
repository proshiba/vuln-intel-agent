title: Craft CMS versions >= 5.0.0-RC1 and < 5.10.11 contain a missing 
  authorization vulnerability in AssetsController::actionReplaceFile. When a 
  request supplies sourceAssetId and targetFilename but omits assetId, the 
  target asset is resolved by folder and filename after the permission checks 
  execute, so the replacePeerFiles permission is never enforced. An 
  authenticated low-privilege author with only the replaceFiles permission on a 
  shared folder can overwrite the content of a peer's asset file (located in the
  same folder) with attacker-controlled bytes. Fixed in 5.10.11.
