title: The Custom Contact Forms plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 7.16. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to permanently force-delete arbitrary 
  posts of any post type (including pages, administrator-authored posts, and 
  WooCommerce products) and write arbitrary ccf_field_* post meta onto any post 
  regardless of ownership or post type. The top-level form ID is checked via 
  edit_post/publish_posts, but the nested fields[].ID and choices[].ID paths 
  processed by _create_and_map_fields() and _create_and_map_choices() carry no 
  equivalent capability or post-type guard, leaving those sinks fully exposed 
  while delete_item() and delete_submission() contain explicit post-type 
  restriction fixes demonstrating the developer's awareness of scoping 
  requirements.
