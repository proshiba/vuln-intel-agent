title: A vulnerability was found in dgtlmoon changedetection.io up to 0.60.7. 
  This affects the function static_content of the file 
  changedetectionio/flask_app.py of the component Screenshot Handler. Performing
  a manipulation of the argument filename results in path traversal. It is 
  possible to initiate the attack remotely. The attack is considered to have 
  high complexity. The exploitability is reported as difficult. The exploit has 
  been made public and could be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
