title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: fix dma mapping leak in stmmac_tso_xmit()\n\nIn stmmac_tso_xmit(), if the
  DMA mapping of an skb fragment fails, the\nframe is dropped but the DMA mappings
  already created for the linear\npart and for the fragments mapped before the failure
  are never\nunmapped, leaking DMA mappings.\n\nFix the leak by walking back over
  the descriptors used by the frame and\nreleasing each of them with stmmac_free_tx_buffer().
  Moreover, release\nthe descriptors with stmmac_release_tx_desc() unmapping the DMA
  buffers."
