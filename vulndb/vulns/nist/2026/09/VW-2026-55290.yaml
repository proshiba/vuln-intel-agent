title: Snipe-IT before 8.7.0 streams the SQL entry from an uploaded backup 
  archive directly into the MySQL/MariaDB command-line client (`mysql`) without 
  the --binary-mode flag, so the client interprets lines beginning with 
  backslash commands such as `\!` as local shell commands. An authenticated 
  superadministrator who uploads a crafted ZIP backup (POST 
  /admin/backups/upload) and triggers a restore (POST 
  /admin/backups/restore/{filename}) without the optional `clean` sanitizer 
  parameter — which is not applied by default because DB_SANITIZE_BY_DEFAULT is 
  false — can execute arbitrary OS commands as the web application's 
  operating-system user, exposing application secrets (including database 
  credentials and APP_KEY) and allowing modification of application-writable 
  files and data. Version 8.7.0 adds the --binary-mode flag to the client 
  invocation.
