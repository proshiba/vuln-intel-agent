title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. From 2.4.0 until 2.5.1, the POST 
  /users/totp/disable and POST /users/totp/backup-codes endpoints accept the 
  account password as the sole reauthentication factor after a 2.4.0 refactor 
  regressed the two-factor check introduced for CVE-2026-45749. In 
  src/backend/database/routes/user-totp-routes.ts, verifyTotpReauth returns 
  success when bcrypt.compare validates the password, while each endpoint 
  chooses password or totp_code as an interchangeable credential. An attacker 
  who has a victim's authenticated session and knows the password can disable 
  TOTP or regenerate and invalidate backup codes without an authenticator or 
  valid second factor, weakening the account to single-factor authentication. 
  This issue is fixed in version 2.5.1.
