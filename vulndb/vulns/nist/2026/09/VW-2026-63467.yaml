title: The WPComplete plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via 'empty' Shortcode Attribute in all versions up to, and 
  including, 2.9.9.0 due to insufficient input sanitization and output escaping.
  This makes it possible for authenticated attackers, with contributor-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page. This requires the premium version 
  of the software in order to exploit. Please note this only affects the pro 
  version.
