title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  loongson2: Fix sg iteration in data reorder functions\n\nIn ls2k0500_mmc_reorder_cmd_data()
  and ls2k2000_mmc_reorder_cmd_data(),\nthe for_each_sg() macro already iterates over
  the scatterlist entries,\nwith 'sg' pointing to the current entry. However, the
  code incorrectly\nuses '&sg[i]' and 'sg_dma_len(&sg[i])' inside the loop, which
  treats\n'sg' as an array base and indexes it again, leading to access of\nwrong
  sg entries (or out-of-bounds if the list is not an array)."
