title: A vulnerability was identified in spatie Scotty up to 1.4.2. Affected is 
  the function SelfUpdater::update of the file app/Updater/SelfUpdater.php of 
  the component Self Update Handler. Such manipulation leads to download of code
  without integrity check. It is possible to launch the attack remotely. 
  Upgrading to version 1.4.3 is able to address this issue. The name of the 
  patch is 4b4e11bfc98e3a2159bb2b3d9b040293fcc44744. It is advisable to upgrade 
  the affected component.
