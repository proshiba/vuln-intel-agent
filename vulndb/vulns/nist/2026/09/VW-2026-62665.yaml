title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rvt:
  Return NULL after port allocation failure\n\nrvt_alloc_device() deallocates the
  IB device when its port array cannot\nbe allocated but then returns the pointer
  to the released allocation.\nCallers treat any non-NULL value as valid and dereference
  it, resulting\nin a use-after-free.\n\nReturn NULL immediately after deallocation
  so callers can propagate the\nallocation failure."
