title: 'A vulnerability was detected in sequa-ai sequa-mcp up to 1.0.13. This affects
  the function redirectToAuthorization of the file src/helpers/node-oauth-client-provider.ts
  of the component OAuth Server Discovery. Performing manipulation results in os command
  injection. Remote exploitation of the attack is possible. The exploit is now public
  and may be used. Upgrading to version 1.0.14 is able to mitigate this issue. The
  patch is named e569815854166db5f71c2e722408f8957fb9e804. It is recommended to upgrade
  the affected component. The vendor explains: "We only promote that mcp server with
  our own URLs that have a valid response, but yes if someone would use it with a
  non sequa url, this is a valid attack vector. We have released a new version (1.0.14)
  that fixes this and validates that only URLs can be opened."'
