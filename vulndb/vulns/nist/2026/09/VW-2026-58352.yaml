title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip6_gre:
  fix hardware header length for NBMA tunnels\n\nip6gre_tnl_link_config_route() accumulates
  the lower device's hardware\nheader length into dev->hard_header_len whenever header_ops
  is set. This\nis incorrect for both users of header_ops.\n\nip6gretap and ip6erspan
  have a fixed Ethernet hardware header length.\nFor an NBMA ip6gre tunnel, ip6gre_header()
  creates only the GRE header,\nthe optional FOU or GUE header, and the outer IPv6
  header. The lower\ndevice header is headroom needed later, not part of the tunnel
  device's\nhardware header.\n\nKeep the lower device header in needed_headroom. Set
  hard_header_len to\nthe tunnel header length only for ARPHRD_IP6GRE devices with
  header_ops,\nand leave the fixed Ethernet header length unchanged for tap and erspan\n\
  devices."
