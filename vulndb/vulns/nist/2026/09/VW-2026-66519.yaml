title: "The @openclaw/slack npm package before 2026.8.1 contains an authorization
  flaw in its Slack download-file handler: when a file lacks the share metadata used
  to prove it belongs to the requested conversation, the conversation-authorization
  check fails open. An authenticated caller restricted to a single conversation who
  knows or obtains a file identifier can therefore download file contents from outside
  that conversation's scope, disclosing data across configured conversation boundaries.
  The issue does not allow listing arbitrary Slack files and does not bypass Slack
  authentication itself. The issue is fixed in version 2026.8.1."
