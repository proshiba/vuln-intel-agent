title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: sof-audio: Fix error path in sof_widget_setup_unlocked()\n\nIf either tplg_ops->dai_config
  or widget_kcontrol_setup fail during widget\nsetup we would double decrement the
  use_count of the widget because the\nsof_widget_free_unlocked() would be called
  twice, similarly the core_put\nwould be invoked twice as well.\n\nSince the use_count
  and core_put() is handled within the widget_free\nfunction we need to return without
  falling through the pipe_widget_free\nlabel.\n\nThe fixes tag is picked to the last
  change around this part of the code\nwhich is adequately old enough for backporting
  purposes."
