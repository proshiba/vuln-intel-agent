title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu:
  Fix dev_iommu memory leak when device_add fails in iommu_mock_device_add\n\niommu_mock_device_add()
  first calls iommu_fwspec_init(), which on\nsuccess allocates both dev->iommu (via
  dev_iommu_get()) and\ndev->iommu->fwspec. If the subsequent device_add(dev) call
  fails,\nthe error path only calls iommu_fwspec_free(dev), which frees\nfwspec but
  leaves dev->iommu still allocated.\n\nThis triggers the following kmemleak report
  when fuzzing with Syzkaller:\n\nBUG: memory leak\nunreferenced object 0xffff888011e0a200
  (size 192):\n  comm \"syz.1.1695\", pid 24885, jiffies 4295222527\n  hex dump (first
  32 bytes):\n    00 00 00 00 00 00 00 00 00 00 00 00 ad 4e ad de  .............N..\n\
  \    ff ff ff ff 00 00 00 00 ff ff ff ff ff ff ff ff  ................\n  backtrace
  (crc 25df5bb3):\n    kmemleak_alloc_recursive include/linux/kmemleak.h:44 [inline]\n\
  \    slab_post_alloc_hook mm/slub.c:4575 [inline]\n    slab_alloc_node mm/slub.c:4899
  [inline]\n"
