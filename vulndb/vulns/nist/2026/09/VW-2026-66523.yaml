title: OpenClaw (npm package 'openclaw') versions >= 2026.4.5 and < 2026.8.1 can
  lose the originating requester's restrictions and untrusted provenance when 
  session-derived text is persisted to session memory. In deployments where 
  session-memory capture and dreaming are enabled, a restricted external sender 
  whose messages are admitted with limited tools can persist instructions that 
  are later supplied to an unattended background (dreaming) agent holding 
  broader file and command capabilities, allowing actions beyond the authority 
  of the original turn and affecting files, commands, or services available to 
  that agent. Exploitation requires the content to be captured, selected for 
  later processing, and followed by the model. The issue is fixed in 2026.8.1.
