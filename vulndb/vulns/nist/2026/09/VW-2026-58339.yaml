title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  route to a populated pool in svc_pool_for_cpu()\n\nsvc_set_num_threads() spreads
  the requested threads evenly across the\nservice's pools (base = nrservs / sv_nrpools).\
  \  When a service runs\nfewer threads than it has pools -- e.g. an nfsd configured
  with fewer\nthreads than the host has NUMA nodes while running in \"pernode\" or\n\
  \"percpu\" mode -- the trailing pools are left with no threads at all.\n\nsvc_xprt_enqueue()
  selects a pool from the CPU servicing the transport,\nqueues the transport on that
  pool's sp_xprts, and only wakes a thread\nfrom the same pool.  Each thread services
  exclusively its own pool, so a\ntransport that lands on a threadless pool is enqueued
  on sp_xprts and\nnever picked up: the connection hangs indefinitely.\n\nHave svc_pool_for_cpu()
  skip pools that currently have no threads,\nfalling back to the next populated pool.\
  \  This trades NUMA locality for\na guarantee that the work is actually serviced.\
  \  sp_"
