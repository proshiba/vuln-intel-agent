title: "The WP Crowdfunding plugin for WordPress is vulnerable to generic SQL Injection
  via 'wpneo_reward' Post Meta in all versions up to, and including, 2.2.1 due to
  insufficient escaping on the user supplied parameter and lack of sufficient preparation
  on the existing SQL query. This makes it possible for authenticated attackers, with
  shop manager-level access and above, to append additional SQL queries into already
  existing queries that can be used to extract sensitive information from the database.
  This is a second-order injection: a Shop Manager writes the malicious payload once
  via the WooCommerce REST products endpoint (POST/PUT /wp-json/wc/v3/products/{id}),
  and the injected query executes on every subsequent public page view that renders
  the campaign rewards sidebar."
