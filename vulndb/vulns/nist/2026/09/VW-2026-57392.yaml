title: "Pandora contains a path traversal vulnerability in its archive extraction
  worker. When processing a specially crafted archive or disk image, attacker-controlled
  file paths could be used without ensuring that the resulting destination remained
  within the intended extraction directory.\n\nAn attacker able to submit a malicious
  file for analysis could use path traversal sequences or crafted paths to cause extracted
  content to be written outside the designated extraction directory, potentially overwriting
  files accessible to the Pandora worker process. Successful exploitation could result
  in unauthorized modification of application or system files, denial of service,
