title: On affected platforms running Arista EOS, an unauthenticated attacker who
  is network-adjacent to the switch and able to connect to a device with PIM 
  Sparse Mode and MLAG configured, can send malformed messages that cause the 
  Pimsm agent to terminate unexpectedly. The Pimsm agent is automatically 
  restarted, but repeated attacks can cause the agent to restart continuously, 
  resulting in a sustained denial of service.
