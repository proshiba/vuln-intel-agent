title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  don't let rds_conn_shutdown() consume a concurrent drop\n\nrds_conn_shutdown() finishes
  by moving the path from\nRDS_CONN_DISCONNECTING to RDS_CONN_DOWN, and also accepts\n\
  RDS_CONN_ERROR as the starting state of that final transition, so that\na FIN processed
  in softirq context during the teardown does not derail\nthe shutdown into a noisy
  error path.\n\nBut consuming that RDS_CONN_ERROR also consumes the shutdown pass
  that\ncame with it: rds_conn_path_drop() sets RDS_CONN_ERROR and then queues\ncp_down_w,
  and a pass that starts on a path already in RDS_CONN_DOWN\nis a no-op.  For the
  FIN case that is harmless - the socket the FIN\narrived on is the very socket the
  teardown just released.  It is not\nharmless for a dropper that attached something
  to the path first.\n\nrds_tcp_accept_one() is such a dropper.  Its path claim in\n\
  rds_tcp_accept_one_path() transitions RDS_CONN_DOWN ->\nRDS_CONN_CONNECTING, and
  a concurrent drop -"
