title: "Description\n\nThree separate mechanisms allowed a web page on an unrelated
  origin to read responses that Storm's HTTP\ncomponents served to an authenticated
  user.\n\nThe Logviewer reflected the request's `Origin` header back in `Access-Control-Allow-Origin`
  while also\nsending `Access-Control-Allow-Credentials: true`. The published security
  model documents a permissive\n`Access-Control-Allow-Origin: *` posture as accepted,
  which is safe precisely because browsers refuse to\nhonour `*` together with credentials;
  reflecting the concrete origin removes that protection.\n\nThe shared CORS filter
  used by the UI, the Logviewer and DRPC was configured with a response header name\n\
  where an initialisation parameter name was expected. The container ignored the setting
  and applied its own\ndefaults, which allow credentials.\n\nFinally, the UI and Logviewer
  wrapped API responses in a caller-supplied JSONP callback for every GET\nrequest.
