title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  detach failed sprout device from transaction update list\n\nWhen creating the first
  metadata chunk for a sprout filesystem,\ncreate_chunk() adds the new device to the
  transaction dev_update_list\nthrough device->post_commit_list.\n\nIf the subsequent
  system chunk creation fails, btrfs_init_new_device()\naborts the transaction and
  releases the device while post_commit_list is\nstill linked. This triggers a warning
  in btrfs_free_device() and leaves\nthe transaction list referencing freed memory.\n\
  \nDetach the device while holding chunk_mutex before releasing it."
