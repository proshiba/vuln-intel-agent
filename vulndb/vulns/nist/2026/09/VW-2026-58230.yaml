title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  via-sdmmc: stop card-detect handling on probe failure\n\nrequest_irq() registers
  the SD card-detect interrupt and the probe enables\nit before mmc_add_host() runs.
  If mmc_add_host() fails, the error path only\nunmaps the registers and returns:
  the interrupt stays registered, so the\nhandler keeps running against the host once
  it is freed. via_sdc_isr()\ndereferences sdhost and its MMIO base and schedules
  carddet_work, which\nvia_sdc_card_detect() also runs against freed memory through
  its\ncontainer_of() dereference.\n\nAdd a probe-error path that disables and frees
  the interrupt and cancels\ncarddet_work before unmapping. carddet_work can re-enable
  the device\ninterrupt via via_reset_pcictrl(), which restores PCIINTCTRL, so mask
  it\nagain after cancelling the work.\n\nThis issue was found by an in-house static
  analysis tool and confirmed by\nmanual code review."
