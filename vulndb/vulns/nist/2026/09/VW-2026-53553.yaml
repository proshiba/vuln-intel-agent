title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mce:
  Set up the polling timer before CMCI discovery\n\nI hit the following on one of
  my machines:\n\n  mce: CPU0 BANK15 CMCI inherited storm\n  ------------[ cut here
  ]------------\n  ODEBUG: assert_init not available (active state 0) object: (____ptrval____)
  object type: timer_list hint: 0x0\n  WARNING: lib/debugobjects.c:632 at debug_object_assert_init+0x178/0x230,
  CPU#0: swapper/0/0\n  CPU: 0 UID: 0 PID: 0 Comm: swapper/0 Not tainted 7.2.0-rc5
  #3 PREEMPTLAZY\n  RIP: 0010:debug_object_assert_init+0x18f/0x230\n  Call Trace:\n\
  \   <TASK>\n   __mod_timer\n   mce_timer_kick\n   cmci_discover\n   intel_init_cmci\n\
  \   mce_intel_feature_init\n   mcheck_cpu_init\n   identify_cpu\n   identify_boot_cpu\n\
  \   arch_cpu_finalize_init\n   start_kernel\n\nA second splat follows right after,
  from timer_setup() finding that same\ntimer already queued:\n\n  ODEBUG: init active
  (active state 0) object: (____ptrval____) object type: timer_list hint: stub_timer+0"
