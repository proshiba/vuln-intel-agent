title: The Nokri - Job Board WordPress Theme for WordPress is vulnerable to 
  Privilege Escalation via Account Takeover in all versions up to, and 
  including, 1.6.6. This is due to insufficient reset token validation in the 
  `nokri_reset_password()` function, which allows empty attacker-supplied reset 
  tokens to match empty or unset `sb_password_forget_token` user meta values. 
  This makes it possible for unauthenticated attackers to reset the password of 
  any user, including administrators, and gain access to their account.
