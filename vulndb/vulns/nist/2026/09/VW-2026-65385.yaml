title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/irq:
  Fix missing r2 clobber in PCREL inline assembly\n\nIn CONFIG_PPC_KERNEL_PCREL mode,
  r2 is no longer reserved for the TOC\npointer and is available as a caller-saved
  register [0].\n\nBoth call_do_irq() and call_do_softirq() use inline assembly to
  call\nfunctions with stack switching, but fail to list r2 in their clobber\nlists.
  This causes the compiler to assume r2 is preserved across these\ncalls, leading
  to register corruption when the called functions\n(__do_irq and __do_softirq) clobber
  r2.\n\nAs a result of this kernel crash during interrupt handling is seen and\n\
  the kernel fails to boot:\n\nBUG: Unable to handle kernel data access on write at
  0xc000000404697638\nFaulting instruction address: 0xc0000000000181ec\nOops: Kernel
  access of bad area, sig: 11 [#1]\nNIP [c0000000000181ec] __do_IRQ+0x6c/0xc0\n\n\
  With older GCC, the compiler would conservatively allocate\ncallee-saved registers
