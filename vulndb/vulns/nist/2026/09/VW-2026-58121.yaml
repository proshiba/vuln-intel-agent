title: GetSimple CMS is a content management system (CMS), and GetSimple CMS CE 
  is the community edition of that CMS. A logic flaw in GetSimple CMS (v3.4.0a 
  and below) and GetSimpleCMS-CE (v3.3.22 and below) allows unauthenticated 
  attackers to create a new administrator account. The application features an 
  automated security control designed to delete the sensitive `admin/setup.php` 
  file post-installation. However, this control is neutralized by a 
  self-exclusion bug within the deletion logic, leaving the setup script 
  accessible for unauthorized account creation even after a legitimate 
  installation is completed. As of time of publication, no known patched 
  versions are available.
