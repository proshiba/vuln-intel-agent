title: PyJWT is a Python implementation of JSON Web Token standards. Prior to 
  2.14.0, PyJWT get_signing_key_from_jwt is affected because unknown kid misses 
  force refreshes without a negative cache or minimum refresh interval. This 
  occurs when unauthenticated tokens repeatedly use the same unknown kid or 
  varying kid values absent from the cached JWKS. As a result, each cache miss 
  causes PyJWKClient to refresh the JWKS. Consequently, attacker traffic can 
  amplify outbound requests to the configured JWKS endpoint. This issue is fixed
  in version 2.14.0.
