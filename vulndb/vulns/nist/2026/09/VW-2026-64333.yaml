title: 'Nuclei is a vulnerability scanner built on a simple YAML-based DSL. From 3.0.0
  until 3.10.0, the workflow template loading path does not enforce the -file capability
  gate when resolving file: protocol templates referenced by a workflow. An untrusted
  unsigned workflow can therefore load a file-protocol template and read local files
  from the scanner host even when the operator has not enabled file templates. The
  issue affects CLI users running workflows with -w and SDK integrations that accept
  end-user workflows while relying on the default file-access restriction. This issue
  is fixed in version 3.10.0.'
