title: WACRM is a self-hostable CRM template for WhatsApp. In version 0.7.0 and 
  earlier, the profiles_update row-level security policy in 
  supabase/migrations/017_account_sharing.sql permits authenticated users to 
  modify their own account_role and account_id, allowing a viewer to 
  self-promote or move into another tenant and then access or modify tenant 
  resources. Separately, match_ai_knowledge_fts and match_ai_knowledge_semantic 
  in supabase/migrations/030_ai_knowledge.sql run as SECURITY DEFINER, accept a 
  caller-controlled p_account_id, and omit an is_account_member check, allowing 
  an authenticated non-member to read another tenant's knowledge-base chunks. 
  This vulnerability is fixed with commit 
  e01f7ed37184f972ace8fb2da5c3e37e56a6050f.
