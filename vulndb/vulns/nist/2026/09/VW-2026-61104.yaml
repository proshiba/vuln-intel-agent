title: "Apache Airflow FAB provider: changing a user's password through the Admin
  user-edit PATCH endpoint does not invalidate that user's existing database-backed
  sessions. An attacker who already holds a copy of the victim's session cookie keeps
  full access as that user after the password change, so the password reset does not
  evict them. Affects deployments using the FAB auth manager with database-backed
  sessions; an administrator (or the user themselves) performing a routine password
  change is the trigger, and no attacker interaction with the endpoint is needed.\n\
  \nThis is a second, independent route to the outcome addressed by CVE-2026-82311,
  which corrected an identifier comparison in the session-invalidation helper. That
  fix does not repair this endpoint, because the PATCH path never calls the helper
  at all. Deployments that applied the CVE-2026-82311 fix must also upgrade for this
  one.\n\nUsers of apache-airflow-providers-fab are recommended to upgrade to version
  3.9.0 or later, which fixe"
