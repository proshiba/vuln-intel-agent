title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  force complete the MES ring fences on reset\n\nThe MES scheduler ring has no drm
  scheduler (no_scheduler = true), so it is\nskipped by the force-completion loop
  in amdgpu_device_pre_asic_reset(). It uses\na polling fence whose hw value lives
  in wb (GTT) memory and survives a MODE1\nreset, while fence_drv.sync_seq keeps advancing
  for every packet.\n\nWhen the reset is triggered because MES itself stopped responding,
  the\ntimed-out packets advance sync_seq past the last hw fence value MES wrote.\n\
  After resume the first MES submission polls forever on a seq that is never\nwritten
  back, failing the resume and wedging the box on a second reset:\n\n  amdgpu: MES
  ring buffer is full.\n  amdgpu: *ERROR* ring gfx_0.0.0 test failed (-110)\n  amdgpu:
  resume of IP block <gfx_v11_0> failed -110\n  amdgpu: GPU reset end with ret = -110\n\
  \nForce complete the MES scheduler ring fences together with the scheduler rings\n\
  so their hw fence is"
