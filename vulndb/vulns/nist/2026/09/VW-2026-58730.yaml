title: A vulnerability was identified in vvbbnn00 WARP-Clash-API up to 
  c7bf2360073959861219b422e51ae86411051b46. Affected is the function 
  get_surge_subscription of the file services/subscription.py of the component 
  Subscription Handler. Such manipulation of the argument key leads to improper 
  access controls. The attack may be launched remotely. The exploit is publicly 
  available and might be used. This product operates on a rolling release basis,
  ensuring continuous delivery. Consequently, there are no version details for 
  either affected or updated releases. The vendor was contacted early about this
  disclosure but did not respond in any way. This vulnerability only affects 
  products that are no longer supported by the maintainer.
