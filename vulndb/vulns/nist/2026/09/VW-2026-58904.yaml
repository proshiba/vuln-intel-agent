title: A security flaw has been discovered in GPAC up to f1219cde. Affected by 
  this vulnerability is the function stbl_GetSampleInfos of the file 
  isomedia/stbl_read.c of the component MP4Box. The manipulation results in 
  reachable assertion. The attack must be initiated from a local position. The 
  exploit has been released to the public and may be used for attacks. Upgrading
  to version abi-16.23 addresses this issue. The patch is identified as 
  49dee5cad329cfed310c1682703df7daa47df31a. It is advisable to upgrade the 
  affected component.
