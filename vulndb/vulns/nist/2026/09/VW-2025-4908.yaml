title: The EPROLO Dropshipping plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  wp_ajax_eprolo_delete_tracking and wp_ajax_eprolo_save_tracking_data AJAX 
  endpoints in all versions up to, and including, 2.3.1. This makes it possible 
  for authenticated attackers, with Subscriber-level access and above, to modify
  and delete tracking data.
