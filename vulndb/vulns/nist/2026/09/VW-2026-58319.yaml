title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Reject oversized Read segments at decode time\n\nThe RPC/RDMA Read list decoder
  stores wire-supplied segment\nlengths without validation. xdr_count_read_segments()
  checks\n4-byte alignment for non-zero position values but does not\ncap the segment
  length.\n\nAn oversized rs_length reaches svc_rdma_build_read_segment(),\nwhich
  derives nr_bvec from it and can drive a large dynamic\nbvec allocation before verifying
  that enough rq_pages remain.\nIf the post-allocation page-overrun guard fires, the
  freshly\nacquired rw context is not returned, leaking the resource.\n\nReject any
  segment whose length exceeds the receive context's\npage budget during Read list
  decoding, consistent with how\nxdr_check_write_chunk() bounds Write segment counts
  against\nrc_maxpages. Also return the rw context on the existing\npost-allocation
  overrun path in svc_rdma_build_read_segment(),\nkeeping that defensive guard balanced."
