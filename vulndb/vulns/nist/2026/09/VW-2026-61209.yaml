title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix FCE trace use-after-free during firmware dump\n\nqla2x00_free_fce_trace()
  freed and cleared ha->fce while holding only\nfce_mutex. The firmware-dump consumers
  qla27xx_fwdt_entry_t264() and\nqla25xx_copy_fce() read ha->fce (NULL check followed
  by a copy of the\nbuffer) under hardware_lock and never take fce_mutex. A debugfs
  FCE\ndisable could therefore free the DMA buffer between a dump's NULL check\nand
  its copy, resulting in a use-after-free.\n\nUnpublish ha->fce under hardware_lock,
  then release the lock and free\nthe DMA buffer (dma_free_coherent() may sleep).
  A concurrent dump either\ncompletes its check and copy with the buffer still valid,
  or observes\nha->fce == NULL and skips it."
