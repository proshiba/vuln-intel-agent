title: A security flaw has been discovered in JusticeRage Manalyze 1.0.0. 
  Impacted is the function PE::_parse_relocations of the file manape/pe.cpp of 
  the component PE Parser. Performing a manipulation of the argument BlockSize 
  results in integer underflow. The attack requires a local approach. The patch 
  is named c372b6bbca9d8c63812be50596fefa4a79c65fd0. It is recommended to apply 
  a patch to fix this issue.
