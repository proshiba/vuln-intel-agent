title: Peppermint through 0.5.5 contains an authorization bypass vulnerability 
  in the GET /api/v1/auth/user/:id/logout endpoint that allows authenticated 
  attackers to delete sessions for any user by supplying arbitrary user IDs. 
  Attackers can forcibly log out any user including administrators by calling 
  the logout handler with another user's ID, since the endpoint performs no 
  authorization checks to verify the caller owns the target account.
