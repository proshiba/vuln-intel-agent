title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_core: use skb_get() instead of skb_clone() for req_skb\n\nBT enable fails intermittently
  with -ETIMEDOUT (-110).  The kernel log\nshows the HCI Read Local Version command
  was sent and the firmware\nreplied with status 0x00 (logged by hci_req_cmd_complete()
  BT_DBG),\nbut the waiter in __hci_cmd_sync_sk() never woke up and timed out\nafter
  10 s:\n\n  bluetooth hci0: Opcode 0xfc00              // __hci_cmd_sync_sk\n  bluetooth
  hci0: opcode 0xfc00 plen 1       // hci_cmd_sync_add\n  bluetooth hci0: skb len
  4                  // hci_cmd_sync_alloc\n  bluetooth hci0: length 1           \
  \        // hci_req_sync_run\n  Bluetooth: hci0 cmd_cnt 1 cmd queued 1     // hci_cmd_work\n\
  \  Bluetooth: hci0 type 1 len 4               // hci_send_frame\n  Bluetooth: opcode
  0xfc00 status 0x00       // hci_req_cmd_complete\n  <-- req_skb NULL: req_complete_skb
  not set,\n      hci_cmd_sync_complete() never called,\n      req_status stays HCI_RE"
