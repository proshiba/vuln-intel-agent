title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninterconnect:
  Fix use after free in icc_get() and of_icc_get_by_index()\n\nIn of_icc_get_by_index()
  and icc_get(), if the dynamic allocation for\npath->name fails via kasprintf(),
  the error handling path directly\ncalls kfree(path) to free the path object and
  returns an error.\n\nHowever, prior to this point, path_find() calls path_init(),
  which\nalready links the path's requests into the req_list of the respective\ninterconnect
  nodes via hlist_add_head(). Directly invoking kfree(path)\nleaves dangling pointers
  in the hlist. A subsequent call to icc_get()\nor icc_set_bw() will traverse or modify
  these corrupted lists, triggering\na slab use afterfree.\n\nKASAN report showing
  the vulnerability when reproducing via debugfs:\n\n  BUG: KASAN: slab-use-after-free
  in path_find+0x6f8/0xcfc\n  Write of size 8 at addr fff000000d43f748 by task sh/1\n\
  \  ...\n  Call trace:\n   kasan_report+0xac/0xfc\n   path_find+0x6f8/0xcfc\n   icc_get+0x148/0x380\n\
  \  "
