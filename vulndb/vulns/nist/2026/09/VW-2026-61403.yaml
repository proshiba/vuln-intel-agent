title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Don't hand out the flat CCS storage as usable VRAM\n\nget_flat_ccs_offset() reads
  the base of the flat CCS storage from the\nhardware, scales it by the number of
  enabled L3 nodes, and rounds the\nresult up to 128K.  Everything below that offset
  is then handed to the\nVRAM allocator as usable memory.\n\nRounding a limit that
  means \"usable memory ends here\" upwards publishes\nwhatever lies between the real
  base and the rounded one as free memory,\nand that memory belongs to the compression
  hardware.  The scaled value\nhas no reason to be 128K aligned, and on a Battlemage
  G21 with 16 GiB it\nis not:\n\n\tflat CCS base: raw 0x3fafff800, rounded 0x3fb000000\n\
  \nso the last 2 KiB of page 0x3fafff000 is CCS storage, in the allocator's\npool.\
  \  Whatever is allocated there gets that tail overwritten by the\ncompression hardware,
  which needs no page-table entry, no buffer object\nand no GPU submission to do it,
  and does it before userspace "
