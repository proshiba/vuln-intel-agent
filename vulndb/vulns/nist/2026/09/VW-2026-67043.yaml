title: "A vulnerability in the DHCP snooping feature of Cisco IOS XE Software could
  allow an unauthenticated, remote attacker to cause BOOTP packets to be forwarded
  between VLANs, resulting in a denial of service (DoS) condition. \r\n\r This vulnerability
  is due to improper handling of BOOTP packets on Cisco Catalyst 9000 Series Switches.
  An attacker could exploit this vulnerability by sending BOOTP request packets to
  an affected device. A successful exploit could allow an attacker to forward BOOTP
  packets from one VLAN to another, resulting in BOOTP VLAN leakage and potentially
  leading to high CPU utilization. This makes the device unreachable (either through
  console or remote management) and unable to forward traffic, resulting in a DoS
  condition. \r\n\r Note: This vulnerability can be exploited with either unicast
  or broadcast BOOTP packets.\r\n\r   There are workarounds that address this vulnerability."
