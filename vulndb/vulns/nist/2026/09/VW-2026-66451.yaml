title: RustDesk versions before 1.5.0 fail to properly validate file transfer 
  permissions on incoming file clipboard messages in the Cliprdr message handler
  on Linux and macOS. Authenticated remote peers with disabled file transfer 
  permissions can place files onto the host clipboard and retrieve copied files 
  and contents from the process-wide clipboard cache.
