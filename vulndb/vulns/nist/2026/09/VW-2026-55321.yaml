title: A use-after-free security issue in the cursor management component of 
  MongoDB Server allows an authenticated user to cause a denial of service. 
  Under specific timing conditions during cursor operations, a stale pointer to 
  a freed resource may be retained and subsequently dereferenced during cursor 
  cleanup, leading to a server process crash.
