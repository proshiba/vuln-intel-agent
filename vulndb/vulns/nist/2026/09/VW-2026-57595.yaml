title: AVideo through revision c3edcc274c389816d434acadac07ee78eaf330c1 (master,
  2026-08-23) incompletely sanitizes sensitive user fields in the APIName=video 
  response. Video rows include columns joined from the video owner's user 
  record, and API::get_api_video() calls removeSensitiveUserFields() only when 
  the caller is neither authenticated nor using a valid API secret; it never 
  compares User::getId() with the row's users_id. As a result, any low-privilege
  authenticated account can request another user's video and receive the owner's
  email address, account name (user), and isAdmin, canUpload and canStream 
  flags, which are removed for guests and should be returned only to the owner 
  or to callers with a valid API secret. No patched version was available at the
  time of the advisory.
