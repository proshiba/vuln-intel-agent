title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-direct:
  return struct page from dma_direct_alloc_from_pool()\n\nCommit 5b138c534fda (\"\
  dma-direct: factor out a dma_direct_alloc_from_pool\nhelper\") changed dma_direct_alloc_from_pool()
  to return the CPU address\nfrom dma_alloc_from_pool(). That fits dma_direct_alloc(),
  but\ndma_direct_alloc_pages() also uses the helper and expects a struct page *.\n\
  \nFix this by making dma_direct_alloc_from_pool() return the struct page *\nagain,
  and pass the CPU address back through an out-parameter for the\ndma_direct_alloc()
  caller."
