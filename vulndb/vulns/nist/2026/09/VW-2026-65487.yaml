title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  Fix acl.sd_buf memory leak and invalid sd_size error handling\n\n1. When ndr_decode_v4_ntacl()
  fails, the code jumped to free_n_data\n   which only freed n.data, skipping kfree(acl.sd_buf)
  and leaking\n   the buffer. Zero-initialize struct xattr_ntacl acl, reorder error\n\
  \   labels to out_free to release acl.sd_buf on all error paths.\n\n2. if (acl.sd_size
  < sizeof(struct smb_ntsd)) is true, original code\n   returned success without freeing
  sd_buf and left stale *pntsd.\n   Set rc = -EINVAL before jumping to out_free to
  return error code and\n   free buffer."
