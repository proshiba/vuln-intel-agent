  on the SMC socket before dropping\nlgr->conns_lock, so the connection stays alive
  while the CDC slot is\nfetched:\n\n        sock_hold(&smc->sk);\n        read_unlock_bh(&lgr->conns_lock);\n\
  \        /* pre-fetch buffer outside of send_lock, might sleep */\n        rc =
  smc_cdc_get_free_slot(conn, to_lnk, &wr_buf, NULL, &pend);\n        if (rc)\n  \
