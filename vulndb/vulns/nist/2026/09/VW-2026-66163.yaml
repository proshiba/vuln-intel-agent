title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  fbtft: make dirty_lock IRQ-safe\n\nfbtft_mkdirty() can be reached from the fbcon
  rendering path while\nprocessing printk() in hardirq context. Meanwhile, dirty_lock
  is also\ntaken by fbtft_deferred_io() in workqueue context with local interrupts\n\
  enabled.\n\nLockdep reports a possible IRQ lock inversion involving dirty_lock and\n\
  console_owner. A hardirq can interrupt a CPU holding dirty_lock and\nenter the console
  rendering path, which can attempt to acquire\ndirty_lock again.\n\nThe following
  lockdep report was observed on an RK3566 system with\nCONFIG_PROVE_LOCKING enabled:\n\
  \n  WARNING: possible irq lock inversion dependency detected\n  swapper/2/0 just
  changed the state of lock:\n  (console_owner){-...}-{0:0}\n  but this lock took
  another, HARDIRQ-unsafe lock in the past:\n  (&par->dirty_lock){+.+.}-{2:2}\n\n\
  \  CPU0                    CPU1\n  ----                    ----\n  lock(&par->dirty_lock);\n\
  \                         local_"
