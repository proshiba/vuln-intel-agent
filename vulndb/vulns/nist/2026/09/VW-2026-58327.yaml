title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  Reject short RFC 4121 MIC tokens in gss_krb5_verify_mic_v2\n\ngss_krb5_verify_mic_v2()
  reads the token ID at ptr[0..1], the flags\nbyte at ptr[2], and padding at ptr[3..7],
  then passes\nptr + GSS_KRB5_TOK_HDR_LEN and cksum_len to gss_krb5_mic_build_sg().\n\
  None of these accesses check read_token->len first.\n\nThe minimum safe token size
  is GSS_KRB5_TOK_HDR_LEN (16) plus\nctx->krb5e->cksum_len (12-24, depending on the
  enctype).  All callers\naccept shorter tokens from the wire:\n\n - gss_unwrap_resp_integ()
  enforces only an upper bound\n   (offset + len <= rcv_buf->len) before allocating\n\
  \   mic.data = kmalloc(len) and passing it to gss_verify_mic().\n   A malicious
  NFS server can therefore supply a short checksum\n   opaque, producing a small slab
  allocation that the Kerberos MIC\n   verifier reads past.\n\n - gss_validate() enforces
  only len <= RPC_MAX_AUTH_SIZE (400)\n   before passing the wire-supplied length
  to\n   gss_valida"
