title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  Fix NPD issue on partial unmap of an evicted BO\n\nThis commit fixes the NULL pointer
  dereference issue that would have\nhappened on the split of GPU mapping due to partial
  unmap of an evicted\nBO. There is a logic to handle the partial unmap of huge pages
  when the\nGPU mapping is split. That logic was not being completely skipped for\n\
  the VMA of an evicted BO and that resulted in a NPD possibility for the\n'bo->backing.pages'
  pointer, which is set to NULL when pages of a\nBO are released on eviction.\n\n\
  Following dump was seen when a partial unmap was exercised for an\nevicted BO.\n\
  Unable to handle kernel paging request at virtual address 0000000000002000\nMem
  abort info:\n  ESR = 0x0000000096000004\n  EC = 0x25: DABT (current EL), IL = 32
  bits\n  SET = 0, FnV = 0\n  EA = 0, S1PTW = 0\n  FSC = 0x04: level 0 translation
  fault\nData abort info:\n  ISV = 0, ISS = 0x00000004, ISS2 = 0x00000000\n  CM =
  0, WnR = 0, TnD = 0, TagAcc"
