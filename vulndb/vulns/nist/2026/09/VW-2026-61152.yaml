title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/core:
  avoid infinite kdamond_merge_regions() internal loop\n\nPatch series \"mm/damon:
  unurgent fixes for infinite loop, NULL de-ref and\nraces\", v1.1.\n\nSashiko found
  a few issues in DAMON that could cause infinite loop, NULL\ndereference and monitoring
  results degradation.  The first two sounds\nscary but the infinite loop happens
  only under unreasonable user setup. \nThe NULL dereference is only in a unit test.\
  \  Monitoring results\ndegradation is trivial since it is only best-effort, and
  those happens\nfrom only unlikely races.  Still those are bugs that better to fix
  if\npossible.  Fix those.\n\n\nThis patch (of 6):\n\nDue to online parameter update
  like events, the number of DAMON regions\ncould be higher than the user-set upper
  limit.  kdamond_merge_regions()\nrepeats merge regions until the number meets the
  limit, while doubling the\nmerge threshold up to the theoretical maximum threshold.\
