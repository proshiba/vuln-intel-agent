title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix OOB read/write from unvalidated DataOffset in coalesce_t2()\n\ncoalesce_t2()
  computes data pointers directly from server-supplied\nDataOffset fields with no
  validation against buffer bounds:\n\n  data_area_of_tgt = (char *)&pSMBt->hdr.Protocol
  +\n                     get_unaligned_le16(&pSMBt->t2_rsp.DataOffset);\n  data_area_of_src
  = (char *)&pSMBs->hdr.Protocol +\n                     get_unaligned_le16(&pSMBs->t2_rsp.DataOffset);\n\
  \  data_area_of_tgt += total_in_tgt;\n  ...\n  memcpy(data_area_of_tgt, data_area_of_src,
  total_in_src);\n\nA small DataOffset can push a pointer below the actual byte area,\n\
