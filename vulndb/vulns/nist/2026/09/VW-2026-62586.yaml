title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/erdma:
  Fix CEQ tasklet use-after-free on removal\n\nEach CEQ interrupt handler only schedules
  eqc->tasklet. The tasklet calls\nerdma_ceq_completion_handler(), which reads the
  DMA-coherent EQ ring\nthrough get_next_valid_eqe() and updates eq->dbrec through
  notify_eq().\n\nerdma_ceqs_uninit() frees each CEQ IRQ and then destroys its EQ.\n\
  free_irq() prevents another hard IRQ and waits for an in-flight handler,\nbut it
  does not drain a tasklet that the handler already scheduled. The\ntasklet can therefore
  access eq->qbuf or eq->dbrec after\nerdma_eq_destroy() frees them.\n\nClearing ceq_cb->ready
  does not synchronize with a tasklet that already\npassed the check at the start
  of erdma_ceq_completion_handler().\n\nKill the tasklet after free_irq(), when no
  handler can schedule it again,\nand before erdma_ceq_uninit_one() releases the EQ
  buffers."
