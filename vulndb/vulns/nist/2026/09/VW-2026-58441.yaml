title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  bound MDSCapAuth path and fs_name decode in handle_session()\n\nhandle_session()
  decodes the MDSCapAuth records carried by a\nCEPH_SESSION_OPEN message (msg_version
  >= 6). For each record the\nmatch.path and match.fs_name byte strings are read by
  first decoding a\n32-bit length and then copying that many bytes with the bare\n\
  ceph_decode_copy(). Unlike the surrounding fields, which all use the\n_safe decode
  variants, these two copies are not preceded by a\nceph_decode_need() bounds check,
  and the enclosing MDSCapAuth and\nMDSCapMatch struct_len fields are skipped rather
  than enforced as an\nupper bound. A length larger than the bytes remaining in the
  message\nfront makes ceph_decode_copy() read past the end of the front buffer.\n\
  \nThe message front is a dedicated allocation (ceph_msg_new2() ->\nkvmalloc), so
  the over-read runs off that object. A malicious or\ncompromised MDS can trigger
  this with the first post-connect message "
