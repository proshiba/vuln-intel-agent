title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix use-before-check of ReparseDataLength in reparse_buf_ptr()\n\nreparse_buf_ptr()
  reads buf->ReparseDataLength before checking that\ncount covers the full fixed header:\n\
  \n    buf = (struct reparse_data_buffer *)((u8 *)io + off);\n    len = sizeof(*buf);\
  \                          /* 8 bytes */\n    rdlen = le16_to_cpu(buf->ReparseDataLength);
  /* offset 4, 2 bytes */\n\n    if (count < len || count < rdlen + len)      /* check
  comes after */\n\nstruct reparse_data_buffer has ReparseDataLength at offset 4.\
  \  If a\nserver returns OutputCount < 6, the read at offset 4-5 reaches past\nthe
  end of the received data.  The off+count bounds against iov_len\nwere already validated,
  but that does not protect against count being\nsmaller than sizeof(*buf).\n\nSplit
  the check: verify count >= sizeof(*buf) before reading\nReparseDataLength, then
  verify count covers the data region."
