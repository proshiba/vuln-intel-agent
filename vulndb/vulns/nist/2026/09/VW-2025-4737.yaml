title: "An improper access control vulnerability exists in multiple WSO2 products
  due to insufficient permission enforcement in certain internal SOAP Admin Services
  and System REST APIs. A low-privileged user may exploit this flaw to perform unauthorized
  operations, including accessing server-level information.\n\nThis vulnerability
  affects only internal administrative interfaces. APIs exposed through the WSO2 API
  Manager's API Gateway remain unaffected."
