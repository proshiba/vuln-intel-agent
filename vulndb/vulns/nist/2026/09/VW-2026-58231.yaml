title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  via-sdmmc: cancel card-detect work on remove\n\nDisabling the device interrupt and
  freeing the IRQ prevents new card-detect\nwork from being queued, but carddet_work
  already queued by the handler can\nstill run after via_sd_remove() returns. via_sdc_card_detect()
  recovers the\nhost through container_of() and dereferences its MMIO base; once remove()\n\
  returns the host can be freed, so that work would touch freed memory.\n\nCancel
  carddet_work after freeing the IRQ and before cancelling\nfinish_bh_work, which
  the card-detect handler can also queue. carddet_work\ncan re-enable the interrupt
  through via_reset_pcictrl(); mask it again\nafterwards.\n\nThis issue was found
  by an in-house static analysis tool and confirmed by\nmanual code review."
