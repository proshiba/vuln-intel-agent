title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Validate num_sge/cur_sge before indexing wqe->dma.sge[]\n\nFor a user QP, qp->sq.queue
  is a ring the application writes directly,\nso rxe_post_send() takes the is_user
  branch and only schedules send_task\nwithout validating the WQE. rxe_requester()
  consumes it in place via\nreq_next_wqe() and calls copy_data(), which indexes\n\
  &wqe->dma.sge[cur_sge] with the attacker-controlled num_sge/cur_sge.\nOnly the kernel
  path bounds num_sge (validate_send_wr()); the user WQE\nis never checked, so a local
  unprivileged user can post a WQE with an\nout-of-range cur_sge or oversized num_sge
  and force an out-of-bounds\nread of the per-WQE sge array in copy_data() (vmalloc
  OOB read, local\nDoS).\n\nBound num_sge to qp->sq.max_sge in rxe_requester() before
  use, the way\nget_srq_wqe() already guards SRQ entries, and bound cur_sge only when\n\
  the WQE carries payload (dma.resid): copy_data() returns early on a\nzero-length
  copy before touching d"
