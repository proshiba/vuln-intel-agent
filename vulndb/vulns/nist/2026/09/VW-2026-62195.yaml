title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_ife: Only operate on Ethernet frames\n\nact_ife encapsulates/decapsulates the
  original Ethernet header and uses\nskb->dev->hard_header_len as the length of that
  header. That is only\ncorrect for Ethernet devices: on a device where hard_header_len
  does not\nmatch the L2 header that was actually pulled (PPP reports PPP_HDRLEN\n\
  while nothing is stripped on ingress), the ingress skb_push()/skb_pull()\nuse the
  wrong length and can hit skb_under_panic when headroom is tight.\n\nIFE is Ethernet-only
  by design - it builds an outer ethhdr, rewrites\nh_source/h_dest/h_proto, and calls
  eth_type_trans() on decode - so\ninstead of trying to make the offsets work for
  arbitrary link types,\nsimply drop packets that do not carry an Ethernet header.\n\
  \nChecking skb->dev->type alone is not enough. We have to cater for a\ncorner case
  where mirred can redirect an skb from a non-Ethernet device\nto an Ethernet one,
  and skb->dev then says n"
