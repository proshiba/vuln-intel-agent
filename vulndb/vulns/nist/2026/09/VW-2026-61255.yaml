title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cec: disable delayed work before freeing an interrupted transmit\n\ncec_transmit_msg_fh()
  drops adap->lock to wait for a blocking transmit in\nwait_for_completion_killable().
  If that wait is interrupted by a signal,\ncancel_delayed_work_sync() can run before
  the CEC kthread arms the reply\ntimeout via schedule_delayed_work(&data->work) in
  cec_transmit_done_ts().\nThe work is then armed after the cancel, and the data is
  freed with its\ndelayed_work still pending:\n\n  ODEBUG: free active (active state
  0) object: ... hint: cec_wait_timeout\n\nUse disable_delayed_work_sync(): it cancels
  the work and disables it, so\nthe later schedule_delayed_work() becomes a no-op
  and the work cannot be\nre-armed. The data is freed right after, so it need not
  be re-enabled."
