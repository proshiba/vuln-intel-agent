title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  Do not WARN on remotely-controlled oversized SGL allocations\n\nWhen fuzzing the
  nvme target code, I tripped a kernel warning in\nnvmet_tcp_map_data() because the
  length passed into the allocator is\ncontrolled by the remote initiator.\n\nA remote
  initiator that sends a command with an SGL claiming a huge\nnumber, can create a
  scatterlist and iovec allocation of over 1 million\nentries, which causes the backing
  kmalloc call to exceed MAX_PAGE_ORDER\nand then the page allocator will trip on
  a WARN_ON_ONCE_GFP() message:\n\n  WARNING: mm/page_alloc.c:5280 __alloc_frozen_pages_noprof\n\
  \  Workqueue: nvmet_tcp_wq nvmet_tcp_io_work\n  ...\n  sgl_alloc_order\n  nvmet_tcp_map_data\n\
  \  nvmet_tcp_try_recv_pdu\n\nAs it's never good to trip a kernel warning remotely
  due to many systems\nhaving panic-on-warn enabled, let's silence it by just add
  GFP_NOWARN to\nthe allocation flags."
