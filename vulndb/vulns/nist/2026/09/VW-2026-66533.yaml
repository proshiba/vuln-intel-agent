title: OpenClaw (npm package `openclaw`) before 2026.8.1 incorrectly enforces 
  sender tool policies during session-memory filename generation. In affected 
  versions, filename generation created an embedded helper that retained tools 
  which the originating sender's policy had removed. When session-memory 
  filename generation was enabled for an agent reachable by lower-trust senders,
  model-mediated instructions could cause the helper to invoke tools outside 
  that sender's effective policy; the demonstrated impact was the creation of 
  persistent scheduled work. Exploitability depends on the model acting on the 
  injected instruction and on which tools the helper exposes. The issue is fixed
  in 2026.8.1; as a workaround, disable session-memory filename generation for 
  agents reachable by lower-trust senders.
