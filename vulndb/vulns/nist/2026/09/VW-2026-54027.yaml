title: "Robots::Validate versions from 0.3.2 before 0.3.11 for Perl allow unbounded
  outbound DNS queries per validation via a forward-confirmation loop that does not
  bound the names it queries.\n\n_check_dns issues one PTR query for the client address,
  keeps the returned names matching the rule's domain, and issues a forward query
  for each until one resolves back to that address. Nothing bounds that list, and
  a client controls the reverse zone for its own address, so it chooses how many names
  the PTR answer holds. Net::DNS refetches a truncated answer over TCP by default,
  so the 512-byte UDP payload does not cap it either.\n\nAny client whose User-Agent
  matches a rule with a domain reaches _check_dns. Each forward name is distinct and
  client-chosen, so every query misses the local cache and is resolved against the
  authoritative servers for that domain. The queries are synchronous, so the caller
  is held until all of them answer or time out."
