title: SSH.NET is a Secure Shell (SSH) library for .NET. Prior to 2026.0.0, 
  ScpClient places caller-supplied remote paths into the command used to run scp
  on the server, and the default RemotePathTransformation.DoubleQuote 
  transformation cannot safely quote every remote command interpreter. When an 
  application passes an attacker-controlled path to a shell-based server, shell 
  metacharacters not neutralized by the active IRemotePathTransformation can 
  execute commands as the authenticated SSH user. Exploitation requires a 
  shell-based server and a path crafted for that shell's parsing rules; 
  non-shell servers and paths fully neutralized by the selected transformation 
  are not affected. RemotePathTransformation.ShellQuote is available for POSIX 
  shells, while SftpClient avoids a remote shell entirely. This issue is fixed 
  in version 2026.0.0.
