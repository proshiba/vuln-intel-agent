title: CordysCRM is an open source AI-powered customer relationship management 
  system that supports private deployment. From 1.7.0 until 1.7.4, POST 
  /account-pool/page allows an authenticated caller with MODULE_SETTING_UPDATE 
  to place an arbitrary database function in SortRequest.name because 
  CustomerPoolController.page omits Spring request validation, 
  SortRequest.getName relies on an incomplete blacklist, and the 
  CommonMapper.xml sort fragment inserts ${sortName} into an ORDER BY clause. 
  Functions such as extractvalue and updatexml bypass the blacklist and can 
  expose database values through an error oracle when the query returns at least
  one row. This issue is fixed in version 1.7.4.
