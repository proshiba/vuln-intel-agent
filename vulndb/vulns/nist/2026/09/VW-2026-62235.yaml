title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/ast2700-intc:
  Avoid allocating in the irq_domain activate() callback\n\nThe interrupt core calls
  the irq_domain_activate() callback from\n__setup_irq() with desc->lock held and
  interrupts disabled. Both\naspeed_intc1_irq_domain_activate() and aspeed_intc0_resolve_route()
  test a\ncompatible string with fwnode_device_is_compatible().\n\nfwnode_device_is_compatible()
  invokes fwnode_property_match_string(), which\nallocates with GFP_KERNEL. That's
  obviously not possible with interrupts\ndisabled and a raw spinlock held.\n\nBoth
  call sites are only ever handed OF nodes, so use\nof_device_is_compatible() instead:
  it walks the property in place and does\nnot allocate."
