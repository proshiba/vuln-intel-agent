title: 'Vulnerability in the Siebel CRM Deployment product of Oracle Siebel CRM (component:
  Server Infrastructure).  Supported versions that are affected are 17.0-26.7. Easily
  exploitable vulnerability allows low privileged attacker with access to the physical
  communication segment attached to the hardware where the Siebel CRM Deployment executes
  to compromise Siebel CRM Deployment.  Successful attacks of this vulnerability can
  result in  unauthorized access to critical data or complete access to all Siebel
  CRM Deployment accessible data and unauthorized ability to cause a hang or frequently
  repeatable crash (complete DOS) of Siebel CRM Deployment. CVSS 3.1 Base Score 7.3
  (Confidentiality and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:H).'
