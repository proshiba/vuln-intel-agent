title: "In the Linux kernel, the following vulnerability has been resolved:\n\necryptfs:
  reject oversized encrypted_key_size in parse_tag_3_packet\n\nparse_tag_3_packet()
  set encrypted_key_size from the Tag 3 packet body\nwithout bounding it against ECRYPTFS_MAX_KEY_BYTES
  (64). When\nencrypted_key_size > 64, decrypt_passphrase_encrypted_session_key()\n\
  sets decrypted_key_size = encrypted_key_size and performs two\nout-of-bounds writes:\n\
  \n1. crypto_skcipher_decrypt() writes encrypted_key_size bytes into\n   decrypted_key[64]
  via scatterlist, overflowing into the parent\n   ecryptfs_auth_tok struct.\n2. memcpy(crypt_stat->key,
  decrypted_key, decrypted_key_size) writes\n   into crypt_stat->key[64], corrupting
  root_iv, keysig_list, and\n   mutexes in ecryptfs_crypt_stat.\n\nOnly AES-192 (cipher
  code 0x08) enables this because it sets\ncrypt_stat->key_size = 24 independently
  of encrypted_key_size,\nallowing crypto_skcipher_setkey() to succeed while encrypted_key_size\n\
