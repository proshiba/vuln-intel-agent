title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Hold vport reference in qla24xx_report_id_acquisition()\n\nIn the format
  1 path, the virtual port is located on ha->vp_list while\nholding vport_slock, but
  the lock is dropped before vp is used:\nqla_update_host_map() is called and VP_IDX_ACQUIRED/REGISTER_FC4_NEEDED/\n\
  REGISTER_FDMI_NEEDED are set on vp. No reference is taken across that\nwindow, so
  a concurrent qla24xx_deallocate_vp_id() can tear the vport\ndown and free it, leading
  to a use-after-free.\n\nTake a vport reference (vref_count) under vport_slock when
  the matching\nvp is found, and drop it after the last use of\nvp. qla24xx_deallocate_vp_id()
  waits for vref_count to reach zero before\nunlinking and freeing the vport, so the
  pointer stays valid. This\nmatches the reference idiom already used by the other
  ha->vp_list\ntraversals."
