title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_mass_storage: fix null pointer dereference in fsg_common_set_num_buffers()\n\
  \nPreviously fsg_num_buffers_validate() was removed as it was not\nnecessary due
  to Kconfig setting the limits for n from 2 to 256 with\ndefault as 2. However, setting
  the page content in such a way that\nkstrtou8() reflects n value as either 0 or
  1 bypasses these\nrestrictions leading to a null pointer dereference if n is 0.
  Fix\nthis by adding a check for n < 2 and returning -EINVAL if n is\neither 0 or
  1 consistent with Kconfig logic."
