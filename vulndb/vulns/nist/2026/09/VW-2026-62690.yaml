title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  dell-wmi-base: Fix handling of ultra performance key\n\nThe commit message of commit
  5fbd827eb9c2 (\"platform/x86: dell-wmi: Recognise or support new switches\")\nstates
  that the ultra performance key contains additional data\nafter the type and code
  fields. The event data passed to\ndell_wmi_process_key() is already parsed, so \"\
  buffer\" already\nstarts after those two fields.\n\nUse the correct index for accessing
  the first data field to avoid\na potential buffer overread."
