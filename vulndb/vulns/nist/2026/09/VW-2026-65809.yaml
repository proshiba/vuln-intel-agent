title: The Better Messages – Chat Rooms, Group Chat, Private Messages & AI Chat 
  Bots plugin for WordPress is vulnerable to generic SQL Injection via 
  'group_id' Message Meta Parameter in all versions up to, and including, 3.0.4 
  due to insufficient escaping on the user supplied parameter and lack of 
  sufficient preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. Exploitation requires the 
  BuddyBoss Platform plugin to be installed with its Social Groups component 
  disabled, a state that persists on any site that has previously toggled the 
  Groups component off since BuddyBoss does not drop the wp_bp_groups table upon
  deactivation.
