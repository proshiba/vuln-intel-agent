title: "A vulnerability in the GUI of Cisco Identity Services Engine (ISE) could allow
  an authenticated, remote attacker with administrative privileges to upload files
  to an affected device.\r\n\r\nThis vulnerability is due to improper validation of
  the file copy function. An attacker could exploit this vulnerability by sending
  a crafted file upload using the Cisco ISE GUI. A successful exploit could allow
  the attacker to upload arbitrary files to an affected system."
