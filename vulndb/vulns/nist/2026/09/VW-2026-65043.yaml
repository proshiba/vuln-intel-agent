title: A denial-of-service flaw was found in gnome-remote-desktop. An 
  unauthenticated remote attacker can open RDP connections without completing 
  the handshake and retain the connection-throttling slots indefinitely because 
  no pre-authentication handshake deadline is enforced. By exhausting the global
  connection limit, an attacker can prevent new RDP clients from connecting 
  until a holding socket is closed.
