title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bcmasp: fix tx_spb_ring_full() checking same slot cnt times\n\nThe loop initialised
  next_index from intf->tx_spb_index on every\niteration, so incr_ring() always produced
  the same result and only\none slot was ever tested.  Move the initialisation before
  the loop\nso each iteration advances next_index and the function correctly\nchecks
  that cnt consecutive descriptor slots are available before\nallowing a new transmission."
