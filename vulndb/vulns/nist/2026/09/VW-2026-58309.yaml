title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Replace SCX_RQ_BAL_KEEP with a dispatch verdict return\n\nSCX_RQ_BAL_KEEP tells
  the pick to keep running the previous task, a leftover\nfrom when balancing and
  picking were separate operations. An rq-level flag\nonly works while dispatches
  and picks pair up one to one, which core\nscheduling breaks: selections interleave
  through dispatch's lock drops and a\npick can consume a stale flag, keeping a task
  that has since been dequeued.\nFixing core scheduling support requires the decision
  to travel with the\ndispatch that made it. Make scx_dispatch_sched() and balance_one()
  return an\nexplicit verdict instead and drop the flag's plumbing from the tools
  autogen\nenum headers.\n\nAlso factor the pick-side invocation, its follow-up queueing
  and the\npost-dispatch checks out of do_pick_task_scx() into dispatch_pick(). No\n\
  functional changes intended.\n\nv2: Drop the SCX_RQ_BAL_KEEP plumbing from the tools
  autogen enum headers\n    "
