title: "An incorrect authorization vulnerability in MISP allowed authenticated users
  to delete attributes from events despite lacking the required perm_modify or perm_modify_org
  permissions.\n\nThe affected attribute deletion paths relied on organization membership
  checks performed by MispAttribute::deleteAttribute() but did not consistently enforce
  MISP's event modification authorization rules. Consequently, a user belonging to
  the organization associated with an event could potentially delete individual attributes
  or perform bulk attribute deletion even when their assigned role was not authorized
  to modify the event.\n\nThis created an inconsistency between attribute editing
  and deletion: editing an attribute correctly used MISP's ACL::canModifyEvent() authorization
  logic, whereas the affected deletion operations could bypass these permission checks.\n\
