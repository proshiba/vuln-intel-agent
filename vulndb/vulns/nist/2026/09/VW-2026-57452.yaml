title: "A remote attacker can craft an Openwire RemoveSubscriptionInfo command to
  cause the deletion of a queue on the Artemis broker before the connection authentication
  and authorization stage or at any time thereafter. \n\n\n\nThis issue affects Apache
  Artemis: from 2.50.0 through 2.56.0; Apache ActiveMQ Artemis: from 1.0.0 through
  2.44.0.\n\n\n\nUsers are recommended to upgrade to version 2.57.0, which fixes the
  issue."
