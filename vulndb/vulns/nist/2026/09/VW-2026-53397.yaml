title: "Description\n\nNGINX JavaScript (njs) and QuickJS (qjs) engines have a vulnerability
  when a js_access handler performs asynchronous request body processing and an exception
  is thrown during asynchronous access-control evaluation before an explicit access
  denial is returned. An unauthenticated attacker can exploit this vulnerability by
  sending a crafted HTTP request that triggers an error condition in the access validation
  logic. This may cause the js_access phase to fail open, allowing the request to
  proceed instead of being denied, resulting in an authentication or authorization
  bypass and unauthorized access to protected resources.\n\nImpact\n\nThis vulnerability
  may allow remote attackers to bypass js_access controls. There is no control plane
  exposure; this is a data plane issue only.\n\n\n\n\nNote: Software versions which
  have reached End of Technical Support (EoTS) are not evaluated."
