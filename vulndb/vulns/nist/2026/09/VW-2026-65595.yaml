title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  davinci: avoid NULL deref of host->data in IRQ handler\n\nmmc_davinci_irq() returns
  early only when both host->cmd and\nhost->data are NULL:\n\n  if (host->cmd == NULL
  && host->data == NULL) {\n          ...\n          return IRQ_NONE;\n  }\n\nSo we
  may legitimately reach the rest of the handler with\nhost->data == NULL (and therefore
  data == NULL). The DATDNE branch\nalready guards against this with an explicit \"\
  if (data != NULL)\"\ncheck, but the subsequent TOUTRD (\"read data timeout\") and\n\
  CRCWR/CRCRD (\"data CRC error\") branches dereference data\nunconditionally:\n\n\
  \  if (qstatus & MMCST0_TOUTRD) {\n          data->error = -ETIMEDOUT;        <--
  NULL deref\n          ...\n          davinci_abort_data(host, data);\n  }\n\n  if
  (qstatus & (MMCST0_CRCWR | MMCST0_CRCRD)) {\n          data->error = -EILSEQ;  \
  \         <-- NULL deref\n          ...\n  }\n\nIf either bit is set in qstatus
  while host->data is NULL, the kernel\nwill crash inside the"
