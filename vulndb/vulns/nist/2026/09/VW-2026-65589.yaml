title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Fix OOB memory exposure in get_wave_state()\n\nThe get_wave_state() function for
  v9 trusts cp_hqd_cntl_stack_size and\ncp_hqd_cntl_stack_offset values read directly
  from the MQD, which are\nwritten by GPU microcode and fully attacker-controlled
  on the\nCRIU-restore path (via AMDKFD_IOC_RESTORE_PROCESS with H3).\n\nthis leads
  to an unbounded copy_to_user() that can leak adjacent\nGTT/kernel memory. If offset
  > size, integer underflow produces a ~4 GiB\nread length, if size is set to 1 MiB
  against a 4 KiB allocation, we leak\n1 MiB of adjacent kernel memory (other queues'
  MQDs, ring buffers, KASLR\npointers).\n\nFix by clamping both cp_hqd_cntl_stack_size
  to the actual allocated\nbuffer size (q->ctl_stack_size) and cp_hqd_cntl_stack_offset
  to the\nclamped size before performing arithmetic and copy_to_user().\n\nThis ensures
  we never read beyond the allocated kernel BO regardless of\nattacker-supplied MQD
  field values."
