title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  nfp: drop the replaced rule from the list when reprogramming fails\n\nnfp_net_fs_add()
  replaces an existing rule by deleting it from the\nhardware, decrementing nn->fs.count
  and programming the new one.  If\nnfp_net_fs_add_hw() fails the old entry stays
  on nn->fs.list - only the\nsuccess path reaches list_replace() - so the list is
  one longer than\nnn->fs.count, and it advertises a rule whose hardware entry has
  already\nbeen torn down.\n\nnn->fs.count is what ETHTOOL_GRXCLSRLCNT reports, so
  userspace then sizes\nits buffer one entry short of what the GRXCLSRLALL walk wants
  to write.\nThat used to overwrite one u32 past the allocation; since the walk is\n\
  bounded it is a permanent -EMSGSIZE instead, as nothing ever resyncs the\ncounter."
