title: "StringListPathField.to_internal_value() calls\n              os.path.exists()
  on unbounded user-supplied paths.\n              200 vs 400 response reveals existence
  of arbitrary\n              absolute paths on the controller-web pod. Tenant\n \
  \             superuser can confirm /etc/tower/SECRET_KEY, k8s\n              service-account
  token, receptor sockets, ConfigMap\n              mount points. Mainly impactful
  on managed AAP\n              (ansiblecloud.com) where tenant admin != host admin."
