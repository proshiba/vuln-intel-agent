title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfat:
  release buffer head after rebuilding parent\n\nfat_scan_logstart() leaves the matching
  directory entry's buffer head in\nsinfo.bh for the caller to release, just like
  fat_scan().\n\nfat_rebuild_parent() uses the directory entry to rebuild the parent
  inode\nfor the nostale_ro NFS export path, but does not release sinfo.bh after a\n\
  successful scan.  Release it once fat_build_inode() has consumed the\ndirectory
  entry data."
