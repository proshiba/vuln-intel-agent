title: Caddy is an extensible server platform that uses TLS by default. In 
  version 2.11.3 and earlier, in modules/caddyhttp/fileserver/staticfiles.go, 
  fileHidden() uses case-sensitive filepath.Match checks, so case variants can 
  bypass hide rules on case-insensitive filesystems or when mixed-case paths 
  coexist and expose files intended to be hidden.
