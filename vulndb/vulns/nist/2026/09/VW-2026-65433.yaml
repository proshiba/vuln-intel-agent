title: Bento4 1.6.0.0 contains an integer underflow vulnerability in 
  AP4_AvccAtom::Create() and AP4_HvccAtom::Create(). A specially crafted MP4 
  file containing an avcC or hvcC atom with a declared size smaller than the 
  atom header size can cause the payload-size calculation to wrap to a large 
  unsigned value. The resulting invalid buffer allocation and copy operations 
  can cause application termination, leading to denial of service.
