title: Livewire is a full-stack framework for Laravel. From 3.0.0-beta.1 until 
  3.8.3 and 4.3.4, the dot-notated query-string parser in 
  js/plugins/history/index.js, including fromQueryString() and 
  insertDotNotatedValueIntoData(), accepts the __proto__, constructor, and 
  prototype path segments and creates inherited objects. Client-side state 
  handlers then access effects.html, effects.js, effects.xjs, and 
  effects.scripts without Object.prototype.hasOwnProperty.call(), allowing 
  inherited attacker-controlled state to be treated as trusted effects. An 
  unauthenticated attacker can craft a URL that, when opened by a user, executes
  arbitrary JavaScript in the affected application's origin. Exploitation 
  requires user interaction and does not bypass server-side authorization or 
  grant privileges beyond the affected user. This issue is fixed in versions 
  3.8.3 and 4.3.4.
