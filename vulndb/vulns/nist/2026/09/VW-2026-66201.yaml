title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  leave HasEA flag untouched on setxattr failure\n\nIn ntfs_set_ea(), the exit path
  unconditionally updates the HasEA\nflag based on ea_info_qsize. When an error occurs
  before\nea_info_qsize is updated, NInoClearHasEA() hides existing on-disk\nEAs until
  the inode is evicted.\n\nOnly update the flag on success."
