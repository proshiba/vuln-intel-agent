title: Joomla Extension - j2commerce.com - Missing authorization on Apps 
  controller delegation chain in J2Store 1.0.0-3.3.21, 4.0.0-4.0.21, 4.1.0-4.1.6
  - `J2StoreControllerApps`'s `appTask` delegation path instantiates app-plugin 
  controllers with no ACL check anywhere in the code. It currently returns 403 
  only as a side effect of `fof.xml`'s wildcard-deny resolving under the 
  singularised ACL key `app`, which has no explicit allow rule — not because of 
  any deliberate check. Behind that path, 
  `applocalizationdata::getInstallerTool()` used a caller-influenced table name 
  with no allow-list, both to select a `#__j2store_*` table for truncation and 
  to build a path to SQL files it then executes — a path-traversal-capable file 
  read/execute.
