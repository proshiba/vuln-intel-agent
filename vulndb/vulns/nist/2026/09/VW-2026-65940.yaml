title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlandlock:
  Fix use-after-free of the source's parent directory\n\ncurrent_check_refer_path()
  reads old_dentry->d_parent without holding a\nreference nor a lock on it, and then
  dereferences it in\ncollect_domain_accesses() and in the audit record.\n\nA reference
  on a child does not pin its parent: __d_move() reassigns\ndentry->d_parent and drops
  the reference the child held on its former\nparent.  hook_path_rename() is not affected
  because the rename path\ncalls lock_rename() before the hook, so the source cannot
  be reparented\nunder it.  hook_path_link() has no such protection: filename_linkat()\n\
  holds a reference on the source dentry but neither locks nor references\nits parent,
  so a concurrent rename(2) can reparent the source while\nsecurity_path_link() runs,
  and the former parent can then be removed and\nfreed while the hook walks it.\n\n\
  A process can trigger this after entering a Landlock domain that handles\nat least
  one filesyst"
