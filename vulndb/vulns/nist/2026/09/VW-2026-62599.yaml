title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hfi1:
  Propagate sdma_txinit_ahg() errors\n\nset_txreq_header_ahg() ignores the return
  value of sdma_txinit_ahg().\n\nIf sdma_txinit_ahg() fails, it returns before initializing
  tx->txreq.\nHowever, set_txreq_header_ahg() ignores the error and returns the AHG\n\
  change count, causing the caller to continue processing the request as\nthough initialization
  had succeeded.\n\nPropagate sdma_txinit_ahg() failures to the caller and abort request\n\
  processing when initialization fails.\n\nFound by Linux Verification Center (linuxtesting.org)
  with SVACE."
