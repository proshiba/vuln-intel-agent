title: vm2 NodeVM versions before 3.12.1 contain a sandbox escape vulnerability 
  where the DANGEROUS_BUILTINS denylist omits child_process despite blocking 
  other host-spawning modules. Attackers can require child_process and execute 
  arbitrary commands on the host system when NodeVM is configured with 
  builtin:['*'] or explicit child_process allowance.
