title: A weakness has been identified in Netcore NR289-GE 1.4.5102. The affected
  element is the function password-check of the file /bin/boa of the component 
  Authentication. Executing a manipulation of the argument Username can lead to 
  stack-based buffer overflow. The attack may be launched remotely. The exploit 
  has been made available to the public and could be used for attacks. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
