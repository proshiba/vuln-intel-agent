title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  uclogic: fix use-after-free of inrange_timer on remove\n\nuclogic_remove() cancels
  the pen in-range timer and then stops the\ndevice:\n\n\ttimer_delete_sync(&drvdata->inrange_timer);\n\
  \thid_hw_stop(hdev);\n\ntimer_delete_sync() only guarantees the timer is idle at
  that instant.\nuclogic_raw_event_pen() keeps delivering pen reports until hid_hw_stop()\n\
  stops the transport several lines later, and every report with\npen->inrange ==
  UCLOGIC_PARAMS_PEN_INRANGE_NONE re-arms the timer:\n\n\tmod_timer(&drvdata->inrange_timer,
  jiffies + msecs_to_jiffies(100));\n\nA report landing between the timer_delete_sync()
  call and the transport\nteardown in hid_hw_stop() re-arms inrange_timer after it
  was cancelled.\nuclogic_remove() then returns and the devm drvdata is freed, while\n\
  hid_hw_stop() has already freed the input device drvdata->pen_input\npoints at,
  so when the timer fires ~100 ms later\nuclogic_inrange_timeout() dereferences freed
  memory --"
