title: Cross-Site Scripting (XSS) vulnerability due to inadequate input 
  sanitisation in the client-side rendering engine of the 1millionbot AI Chat 
  Platform. An unauthenticated remote user could cause external hyperlinks to be
  rendered in the web interface by sending messages containing Markdown syntax 
  and certain unsanitised content blocks. The impact is limited to the user’s 
  own interactive session; no compromise of internal infrastructure, access to 
  third-party data or impact on administrative panels has been identified.
