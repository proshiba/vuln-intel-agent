title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  fix race between interrupt and resend\n\nAfter commit f8fce75fedf7 (\"fuse: clear
  intr_entry in fuse_resend and\nfuse_remove_pending_req\") the WARN_ON(!list_empty(&req->intr_entry))
  in\nfuse_request_free() still triggers due to the following race:\n\nIn request_wait_answer()\n\
  \  if (test_bit(FR_SENT, &req->flags)) -> returns true\n\nIn fuse_chan_resend()\n\
  \  clear_bit(FR_SENT, &req->flags)\n\nIn request_wait_answer()\n  queue_interrupt(req)\n\
  \nFix by:\n\n - move clearing FR_SENT inside fpq->lock\n\n - move setting FR_PENDING
  inside fiq->lock\n\n - recheck FR_SENT after acquiring fiq->lock in fuse_dev_queue_interrupt()"
