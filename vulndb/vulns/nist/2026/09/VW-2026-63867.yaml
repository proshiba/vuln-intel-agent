title: "Temporal Server decided whether a Workflow completion callback was internal
  by reading a caller-supplied HTTP header. An authenticated caller holding only write
  permission in a single namespace could attach a completion callback whose URL host
  matched the configured callback address allowlist, whose URL path was any Temporal
  HTTP API route, and whose header map contained a non-empty header named source.
  When the History service delivered that callback, the non-empty source header caused
  it to re-target the request at the local frontend client and rewrite only the scheme
  and host, preserving the caller's path, query, and request body. Where an internal
  frontend is deployed with its HTTP API enabled, that client resolves to the internal
  frontend, which authorizes every request as a system administrator without requiring
  authentication information. The result is that the server performs an attacker-chosen
  state-changing HTTP POST against its own administrative API on the caller's behalf, "
