title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/migrate:
  report RCU-tasks quiescent states in migrate_pages_batch()\n\nmigrate_pages_batch()
  unmaps each folio before moving it, and every\nunmap runs the mmu_notifier invalidate
  callbacks.  On KVM hosts\ntry_to_migrate() ends up in kvm_mmu_notifier_invalidate_range_start()
  ->\ntdp_mmu_zap_leafs(), which is expensive, so unmapping a large batch keeps\n\
  the CPU busy for a long time.\n\nThe loop already calls cond_resched(), but on PREEMPTION
  kernels that is\na no-op, and involuntary preemption is not a Tasks-RCU quiescent
  state.\n\nA long batch therefore never reports a quiescent state, and the\nmigrating
  task (e.g. kcompactd) becomes a Tasks-RCU holdout, stalling the\nTasks-RCU grace
  period for minutes, which is common at Meta fleet:\n\n  INFO: rcu_tasks detected
  stalls on tasks:\n  0000000055349ecc: .. nvcsw: 1157401/1157401 holdout: 1 idle_cpu:
  -1/56 task:kcompactd0      state:R  running task\n  Call Trace:\n   tdp_mmu_zap_leafs\n\
  \  "
