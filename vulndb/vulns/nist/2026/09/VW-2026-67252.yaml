title: Improper link resolution in the migration receive path in Canonical LXD 
  versions 4.0 and later (fixed in 4.0.14, 5.0.10, 5.21.8 and 6.10) on Linux 
  allows an authenticated client that can create instances or custom storage 
  volumes in a project, or a malicious migration source server, to write 
  attacker-controlled files to arbitrary paths on the target host as root, 
  leading to full host compromise. The attacker does this with a crafted rsync 
  or btrfs send stream that plants a symlink in the transferred volume, such as 
  rootfs or root.img, and then writes through it.
