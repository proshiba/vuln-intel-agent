title: MISP's UiBeta theme collection view 
  (app/View/Themed/UiBeta/Collections/view.ctp) performed a secondary query of 
  member events by UUID without applying the caller's access control list (ACL).
  The CollectionsController::view() action correctly resolved collection element
  UUIDs through Event::fetchSimpleEvents($user, ...), which enforces per-user 
  event ACL. However, the view template independently re-queried the same UUIDs 
  using only an Event.uuid IN (...) condition, omitting the 
  createEventConditions() authorization filter. Because collection element UUIDs
  are stored without server-side authorization against the referenced event 
  (CollectionElementsController::add() accepts whatever UUID the collection 
  owner posts), an authenticated user with view access to a collection could 
  retrieve full details of events they are not permitted to read. The exposed 
