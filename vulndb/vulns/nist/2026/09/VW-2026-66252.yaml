title: "The AIL Framework's username timeline feature is vulnerable to stored cross-site
  scripting (XSS). Usernames imported from chats and crawled forums are stored without
  character restrictions. When an authenticated analyst views the username timeline,
  the application renders these stored usernames into the DOM using D3's html() method
  in the tooltip. Because the username value (d.obj) is interpolated directly into
  an HTML string without sanitization, a crafted username containing HTML event handlers
  (e.g., <img src=x onerror=alert(1)>) will execute arbitrary JavaScript in the analyst's
  browser when the analyst hovers over the corresponding timeline entry. The attack
  requires the victim to be an authenticated analyst with access to the timeline view
  and to interact with the malicious timeline entry (hover). Successful exploitation
  can lead to session hijacking, data exfiltration, or unauthorized actions performed
