title: A security vulnerability has been detected in ShopEx ECShop up to 2.5.1. 
  This vulnerability affects the function flow_update_cart of the file 
  /flow.php?step=update_cart. The manipulation of the argument rec_id leads to 
  sql injection. The attack can be initiated remotely. The exploit has been 
  disclosed publicly and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
