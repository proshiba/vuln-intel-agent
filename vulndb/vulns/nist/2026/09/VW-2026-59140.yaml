title: A flaw was found in GIMP. When processing a specially crafted lighting 
  preset file, the Lighting Effects filter does not properly validate the number
  of light sources. This can lead to an out-of-bounds write, corrupting memory. 
  An attacker could exploit this by convincing a user to open a malicious preset
  file, potentially causing a crash or enabling arbitrary code execution.
