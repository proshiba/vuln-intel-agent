title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Remove VM-wide VNCR mapping counter\n\nThe global VNCR mapping counter is
  used to decide whether an L1\nprovided VNCR page is mapped in L0 on any CPU at the
  point of\ndealing with a TLB invalidation. It is incremented when a mapping\nis
  made in the fixmap, and decremented when unmapped.\n\nAs it turns out, this tracking
  has several flaws:\n\n- we are trying to invalidate TLBs, and the mapping is only
  an\n  opportunistic consequence of the TLB. Checking this counter to\n  decide whether
  a TLB needs to be invalidated may result in missed\n  invalidations.\n\n- an L1
  vcpu invalidating its own TLB (a very likely case) will not\n  succeed in invalidating
  the VNCR pseudo TLB because that page is\n  not mapped in L0 at this stage.\n\n\
  Given that this tracking fails at delivering the minimum guarantees\nthat are required
  and is only a performance optimisation, remove it\ncompletely."
