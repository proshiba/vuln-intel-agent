title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  stm32: dcmi: fix some error handling bugs in probe()\n\nThere are a few issues here:\n\
  \n1) After we assign:\n        chan = dma_request_chan(&pdev->dev, \"tx\");\n  \
  \ Then the error paths need to clean up before returning.  The first\n   error path
  does a direct return.\n2) The error paths check \"dcmi->mdma_chan\" but that is
  not assigned\n   until later so it results in memory leaks.  Test \"mdma_chan\"\n\
  \   instead.\n3) The error handling calls dma_release_channel(dcmi->dma_chan) before\n\
  \   \"dcmi->dma_chan\" has been assigned which leads to a NULL pointer\n   dereference.\
  \  Use the \"chan\" variable instead.\n\nI also moved the call to dma_release_channel()
  after the call to\ndma_release_channel() so it mirrors the allocation code better."
