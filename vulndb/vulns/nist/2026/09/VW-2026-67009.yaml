title: Sylius versions before 1.12.25, 1.13.17, 1.14.20, 2.1.16, and 2.2.9 fail 
  to include firewall identification in JWT tokens issued by separate Admin and 
  Shop API endpoints. Attackers can register a shop customer account using an 
  administrator's email address and obtain a token that the Admin API resolves 
  to that administrator, granting full administrative access.
