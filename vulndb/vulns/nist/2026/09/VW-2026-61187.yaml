title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  protect critical_task_priority updates with s_umount\n\nThe sysfs store path already
  takes s_umount for GC thread control\nentries, and ckpt_thread_ioprio is covered
  as well.\n\ncritical_task_priority also updates checkpoint or GC kthread scheduling\n\
  state, but it is not covered by that serialization. It can race with\nremount or
  teardown paths that are stopping those threads.\n\nProtect critical_task_priority
  sysfs writes with s_umount too."
