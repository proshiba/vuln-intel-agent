title: "In the Linux kernel, the following vulnerability has been resolved:\n\nparisc:
  eisa: Fix infinite loop when parsing invalid IRQ value\n\nWhen an invalid value
  is passed via the \"eisa_irq_edge=\" kernel\ncommand line parameter (e.g. \"eisa_irq_edge=16,5\"\
  ), eisa_irq_setup()\nprints an error message and continues without advancing the
  current\nposition.  As a result the same invalid value is parsed again and\nagain,
  causing an infinite loop while the kernel boots.\n\nAdvance to the next comma-separated
  entry, or stop parsing when there\nis no next entry, before continuing so that the
  remaining entries are\nprocessed normally."
