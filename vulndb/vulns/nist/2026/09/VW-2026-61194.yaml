title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  limit recovery filename logging to stored length\n\nF2FS stores recovery filenames
  as a length plus a fixed-size i_name\nbuffer.  The buffer is not NUL-terminated,
  but recover_inode() and\nrecover_dentry() print it with %s.\n\nFor a 255-byte filename,
  recovery logging can read past i_name into the\nfollowing raw inode fields.\n\n\
  Print the name with a precision bounded by i_namelen and F2FS_NAME_LEN."
