title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  fsl_micfil: balance mclk enable/disable\n\nhw_params() enables mclk unconditionally
  and hw_free() disables it\nunconditionally, but the PCM core does not guarantee
  1:1 pairing:\nhw_free() can run without hw_params(), and hw_params() can be called\n\
  multiple times from the SETUP state. This triggers an \"already\ndisabled\" WARN()
  in the first case and leaks an enable reference in\nthe second, leaving the clock
  ungateable.\n\nGuard both sides with the existing mclk_flag, as fsl_sai.c does with\n\
  mclk_streams."
