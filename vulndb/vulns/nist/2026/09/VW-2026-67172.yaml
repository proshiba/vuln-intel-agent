title: Improper Neutralization of Input During Web Page Generation ('Cross-site 
  Scripting') in Apache Roller 6.1.5 allows a remote attacker to perform 
  reflected cross-site scripting through the optional LDAP comment 
  authenticator, which writes request parameter values into its HTML form 
  without escaping. This affects only sites configured to use 
  LdapCommentAuthenticator, and a victim whose session has already loaded the 
  authenticator form must follow a crafted link. Users are recommended to 
  upgrade to Apache Roller 6.1.6 or later, which escapes the reflected values.
