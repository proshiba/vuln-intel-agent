title: A security vulnerability has been detected in Uasoft badaso up to 2.9.7. 
  Affected is the function forgetPassword of the file 
  src/Controllers/BadasoAuthController.php of the component Token Handler. Such 
  manipulation leads to weak password recovery. The attack can be executed 
  remotely. This attack is characterized by high complexity. The exploitability 
  is told to be difficult. The exploit has been disclosed publicly and may be 
  used. The vendor was contacted early about this disclosure but did not respond
  in any way.
