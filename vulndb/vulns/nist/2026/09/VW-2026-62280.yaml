title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  retain connection for pending notify work\n\nDeferred CHANGE_NOTIFY work keeps an
  async message ID after the original\nrequest work is released. A durable handle
  can outlive its connection, so\nthe connection teardown can destroy its async IDA
  before the handle close\nreleases the pending notify work.\n\nGive the synthetic
  deferred work a connection reference. Release it after\nthe async ID in ksmbd_free_work_struct().
  This keeps the async IDA alive\nuntil the deferred work is released, even when the
  original connection has\nalready left the connection list.\n\nDuring server shutdown
  there is no client to receive a cleanup response.\nSkip the write and only release
  the pending work."
