title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  Wrap user-invoked calls to fb_set_var() in helper\n\nHandle fbcon during display
  updates in fb_set_var_from_user(). Check\nwith fbcon if the mode change is possible,
  update hardware state and\nfinally update fbcon. Update all callers.\n\nOnly the
  FBIOPUT_VSCREENINFO ioctl currently does all steps. Other\nmode-changes callers
  in sysfs and driver code are missing fbcon-related\nsteps.\n\nWith the new helper,
  ps3fb and sh_mobile_lcdcfb no longer maintain\nfbcon state themselves."
