title: A flaw was found in NetworkManager-fortisslvpn, the FortiSSLVPN plugin 
  for NetworkManager. The nm-fortisslvpn-service improperly handles 
  carriage-return/line-feed (CR/LF) characters in VPN connection profile 
  credentials. A local unprivileged user can exploit this by crafting a 
  malicious VPN profile to inject additional configuration directives. This can 
  lead to arbitrary code execution with root privileges when the crafted VPN 
  connection is activated.
