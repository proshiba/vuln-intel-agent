title: mport is the MidnightBSD Package Manager. Prior to 2.7.8, 
  do_actual_install() in libmport/bundle_read_install_pkg.c used path-based 
  lstat(), chown(), stat(), and chmod() operations while installing package 
  files. A local attacker with write access to a target directory could replace 
  a checked file with a symlink before privileged ownership or mode changes were
  applied, redirecting those changes to an attacker-selected path and 
  compromising filesystem integrity or permissions. This issue is fixed in 
  version 2.7.8.
