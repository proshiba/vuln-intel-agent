title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  initialize policy rwsem before sysfs publication\n\ncpufreq_policy_alloc() initializes
  policy->rwsem after\nkobject_init_and_add() has created the policy sysfs directory
  and its\ndefault attributes. A sysfs access can therefore reach a policy callback\n\
  before the semaphore has been initialized.\n\nInitialize policy->rwsem before publishing
  the policy kobject so sysfs\ncallbacks always see an initialized semaphore."
