title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: Do not treat master device as a duplicate target\n\ni3c_master_search_i3c_dev_duplicate()
  searches the bus for another I3C\ndevice with the same PID as the reference device.\
  \  The search can match\nmaster->this, causing the controller itself to be returned
  as a\nduplicate.\n\nSince the controller is not a target device, it cannot be a
  duplicate of\none.  Exclude master->this from matching so that the function only\n\
  returns real duplicate target devices."
