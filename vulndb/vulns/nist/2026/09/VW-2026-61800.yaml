  multiple GraphQL resolvers, allowing tag-based access restrictions to be 
  bypassed. Attackers can query the list, tree, tags, searchTags, and links 
  resolvers to retrieve restricted page metadata including titles, descriptions,
  paths, and tag information without proper authorization.
