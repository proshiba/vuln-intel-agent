title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau:
  unsubscribe the channel-kill event before the fence context\n\nnouveau_channel_del()
  tears the fence context down first and only drops\nthe channel-kill subscription
  later, in the middle of the nvif object\nteardown:\n\n\tif (chan->fence)\n\t\tnouveau_fence(chan->cli->drm)->context_del(chan);\n\
  \t...\n\tnvif_object_dtor(&chan->vram);\n\tnvif_event_dtor(&chan->kill);\n\nThe
  subscribed handler is nouveau_channel_killed(), which calls\nnouveau_channel_kill()
  and from there nouveau_fence_context_kill() on\nchan->fence. A kill event delivered
  in that window takes fctx->lock and\nwalks fctx->pending on a fence context that
  context_del() has already\nfreed.\n\nNothing reaches this below Fermi today, because
  the subscription is\ngated on FERMI_CHANNEL_GPFIFO and nothing kills a channel there.
  On\nFermi and newer the window is real but narrow, since a kill has to land\nexactly
  while the channel is being destroyed. That is reason enough on\nit"
