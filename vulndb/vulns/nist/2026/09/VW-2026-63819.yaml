title: A flaw has been found in WuzhiCMS up to 4.1.0. This affects an unknown 
  function of the file /index.php?m=member&v=Login of the component Login. This 
  manipulation of the argument forward causes open redirect. The attack can be 
  initiated remotely. The exploit has been published and may be used. The only 
  sanitization is remove_xss(), an XSS keyword/entity scrubber. The vendor was 
  contacted early about this disclosure but did not respond in any way.
