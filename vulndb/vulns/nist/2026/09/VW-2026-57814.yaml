title: "A SQL injection vulnerability exists in the JasperReports-based reporting
  feature of multiple versions of OpenNMS Meridian and Horizon. A low-privileged authenticated
  user (ROLE_USER) can run the shipped, default-enabled online reports \"Maintenance
  contracts expired\" (AssetManagementMaintExpired) and \"Maintenance contracts strategy\"\
  \ (AssetManagementMaintStrategy) via the reporting REST API (POST /rest/reports/{id})
  and supply a DATE_FORMAT parameter that the report templates substitute literally,
  un-escaped, into their SQL queries. This lets an attacker execute arbitrary SQL
  against the OpenNMS database and read arbitrary data, including database-stored
  secrets such as provisioning and notification credentials and SNMP community strings.\n\
  \n\n\nThe solution is to upgrade to Meridian 2024.3.13, 2025.0.10 and Horizon 36.0.4
  or newer. Meridian and Horizon installation instructions state that they are intended
