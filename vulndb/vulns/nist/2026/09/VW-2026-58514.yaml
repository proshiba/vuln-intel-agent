title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  vicodec: fix out-of-bounds write in FWHT encoder\n\nvidioc_s_fmt_vid_out() sizes
  the encoder CAPTURE buffer from the\ncompressed descriptor pixfmt_fwht, whose sizeimage_mult
  is 3:\ncoded_w * coded_h * 3 + sizeof(struct fwht_cframe_hdr). fwht_encode_frame()\n\
  encodes one plane per component, and an incompressible plane takes the\nFWHT_FRAME_UNENCODED
  path in encode_plane(), copying the plane verbatim.\n\nFor a 4-component pixel format
  all four planes are full resolution\n(width_div == height_div == 1), so a frame
  that forces every plane\nthrough the unencoded fallback writes\nsizeof(struct fwht_cframe_hdr)
  + 4 * coded_w * coded_h bytes, overrunning\nthe plane by coded_w * coded_h, which
  can result in corruption\nof adjacent kernel heap memory.\n\nBump pixfmt_fwht.sizeimage_mult
  from 3 to 4, matching the largest\ncomponents_num among the supported raw formats,
  so the capture buffer is\nalways large enough for the unencoded fallbac"
