title: oRPC is an tool that helps build APIs that are end-to-end type-safe and 
  adhere to OpenAPI standards. Prior to 1.14.8, the @orpc/server CORS plugin in 
  packages/server/src/plugins/cors.ts copies a client's incoming Vary request 
  header into the response instead of controlling Vary as a response-only header
  and using Origin for request-origin variation. In deployments behind a shared 
  cache, CDN, or reverse proxy that keys responses using Vary, a client can 
  inject arbitrary variation values, pollute cache keys, and cause inconsistent 
  CORS enforcement for other clients. Default non-cached configurations have no 
  established direct confidentiality, integrity, or availability impact. This 
  issue is fixed in version 1.14.8.
