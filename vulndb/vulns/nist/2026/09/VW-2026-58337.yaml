title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  Check svc pool percpu counter allocation\n\n__svc_create() initializes three per-pool
  percpu_counter stats and\nignores every return value. On SMP, percpu_counter_init()
  fails when\n__alloc_percpu_gfp() cannot satisfy the allocation, leaving the failed\n\
  counter with fbc->counters == NULL and its embedded raw_spinlock_t,\nlist_head,
  and count never initialized. __svc_create() returns the\nhalf-constructed svc_serv
  to nfsd, lockd, or the NFS callback service\nanyway.\n\nOnce that service is live,
  the hot-path increments in\nsvc_xprt_enqueue(), svc_handle_xprt(), and\nsvc_pool_wake_idle_thread()
  reach a counter whose backing pointer is\nNULL. The pointer is a per-cpu offset,
  so the access does not fault:\nit resolves to offset zero of the current CPU's per-cpu
  area and\nsilently corrupts whatever variable lives there. A\n/proc/fs/nfsd/pool_stats
  read walks the same NULL per-cpu storage and\nreturns garbage, and on CONFIG_DEBUG_SP"
