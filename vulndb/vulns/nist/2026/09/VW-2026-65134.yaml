title: Insufficient input sanitization of shell metacharacters in the Brocade 
  SANnav CLI scripting component permits authenticated users to break out of 
  restricted execution contexts on managed switches. An attacker with command 
  execution permissions can leverage this flaw to run unauthorized shell 
  commands across target fabric switches, bypassing command allow-lists and 
  obtaining full administrative switch access. This vulnerability affects all 
  Brocade SANnav versions before 3.0.1a.
