title: 'Vulnerability in the Oracle Agile PLM MCAD Connector product of Oracle Supply
  Chain (component: CAX Client).   The supported version that is affected is 3.6.
  Easily exploitable vulnerability allows low privileged attacker with logon to the
  infrastructure where Oracle Agile PLM MCAD Connector executes to compromise Oracle
  Agile PLM MCAD Connector.  While the vulnerability is in Oracle Agile PLM MCAD Connector,
  attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all Oracle Agile PLM MCAD Connector accessible
  data as well as  unauthorized read access to a subset of Oracle Agile PLM MCAD Connector
  accessible data. CVSS 3.1 Base Score 7.3 (Confidentiality and Integrity impacts).  CVSS
  Vector: (CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:L/I:H/A:N).'
