title: Improper Neutralization of Special Elements in Output Used by a 
  Downstream Component in the colour control escape code handler in kitty from 
  0.47.3 before 0.49.0 allows a program writing to the terminal to execute an 
  arbitrary command in the user's shell, because color_control() in 
  kitty/window.py answers a query for an unrecognised field name by placing that
  field name into the reply, and write_escape_code_to_child() in kitty/screen.c 
  then writes the reply to the pseudoterminal master, where it is not 
  distinguishable from input typed by the user, without neutralising it for the 
  shell that reads it. The payload is reduced to printable ASCII before the 
  field name is echoed, which is the restriction introduced in 0.47.3 as the fix
  for CVE-2026-54057, and the record and field separators ; and = are consumed 
  as delimiters, but every other printable character survives, which is 
