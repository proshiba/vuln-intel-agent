title: Strapi versions 4.x through 4.26.2 and 5.x before 5.48.1 contain a stored
  cross-site scripting vulnerability in the content manager WYSIWYG preview 
  component that fails to strip script tags from rich text. An Author-role user 
  can store malicious script tags in rich text fields that execute in an Editor 
  or Super Admin's session when the preview pane is expanded, enabling account 
  takeover.
