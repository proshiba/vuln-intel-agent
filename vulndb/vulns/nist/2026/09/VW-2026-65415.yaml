title: MongoDB Compass can interpolate a database name without escaping into the
  initial input of its embedded MongoDB shell when a user opens the shell from 
  that database's view. A user with privileges to create databases on a server 
  that a Compass user connects to may, under specific conditions, have content 
  evaluated as shell input within the Compass process, with that process's 
  privileges. This requires the Compass user to open the shell for the affected 
  database.
