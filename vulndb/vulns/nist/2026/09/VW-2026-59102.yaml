title: Alior Bank PrestaShop module "raty" for commercial partners is vulnerable
  to SQL Injection in the toggleCategoryPromotionAction method. The module 
  inserts value of the POST parameter "status" into SQL UPDATE queries without 
  any sanitization or validation. An attacker with access to the product or 
  category add/edit functionality in the PrestaShop backoffice can inject 
  arbitrary SQL, potentially allowing unauthorized access to and modification of
  database contents.
