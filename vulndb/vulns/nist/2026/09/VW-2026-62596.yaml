title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/gic-v3-its:
  Prevent leak in its_vpe_irq_domain_alloc()\n\nWhen its_irq_gic_domain_alloc() fails,
  the following\nits_vpe_irq_domain_free() fails to invoke its_vep_teardown() for
  the\ncorresponding interrupt, which leaks the resource.\n\nInvoke its_vpe_teardown()
  in the error handling path to avoid the leak.\n\n[ tglx: Massaged change log ]"
