title: SysReptor is a fully customizable pentest reporting platform. Prior to 
  2026.55, an unauthenticated holder of a public note share link receives 
  project-wide collaborative editing metadata because the public share consumer 
  joins the same collaboration group as authenticated project members and 
  forwards client information, connection, awareness, and deletion events 
  without consistently restricting them to the shared note subtree. The 
  disclosed metadata can identify project members through usernames and names 
  and reveal the identifiers and live editing activity of notes that were not 
  shared. The content of non-shared notes remains protected, and the issue does 
  not grant write access. This issue is fixed in version 2026.55.
