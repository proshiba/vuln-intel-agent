title: "Issue summary: A CMP client that requests certificate revocation on the basis\n\
  of a PKCS#10 CSR may dereference a NULL pointer and terminate abnormally when\n\
  processing a crafted revocation response. \n\nImpact summary: The NULL pointer dereference
  happens on a read which \nleads to a crash and a Denial of Service for the affected
  client application.\n\nCWE: CWE-476: NULL-pointer dereference\n\nDescription: A
  CMP client revoking a certificate has to tell the server which\ncertificate to revoke,
  and may do so by supplying a PKCS#10 CSR instead of the\ncertificate itself or its
  issuer name and serial number. This is\n'openssl cmp -cmd rr -csr <file>' on the
  command line, or\nOSSL_CMP_exec_RR_ses() with the certificate supplied via\nOSSL_CMP_CTX_set1_p10CSR()
  through the API.\n\nA CSR does not contain the issuer name and serial number of
  the certificate,\nso the client does not send them. A server may optionally name
  the\ncertificate it revoked in its response, and the client then compares that\n\
  name agains"
