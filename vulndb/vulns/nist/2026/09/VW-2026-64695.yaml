title: "The Directorist: AI-Powered Business Directory, Listings & Classified Ads
  WordPress plugin before 8.9.5 does not scope one of its REST collection endpoints
  to the requesting user, allowing users with a subscriber-level account to read every
  customer's order and payment records.\n\nVersions 8.8.1 to 8.9 are not affected.
  The endpoint was scoped correctly in 8.8.1 and the unscoped behaviour was reintroduced
  in 8.9.1."
