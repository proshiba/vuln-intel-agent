title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipmi:
  si: Fix NULL pointer dereference after failed registration\n\ntry_smi_init() allocates
  new_smi->si_sm and later calls\nipmi_register_smi_mod(), which maps to ipmi_add_smi().\n\
  \nDuring ipmi_add_smi(), the upper IPMI message handler obtains the\ninitial BMC
  device information through __bmc_get_device_id(). This can\nfail if the BMC does
  not return a successful response to the Get Device\nID command.\n\nWhen the BMC
  returns a nonzero completion code, the device-id helper\nretries the command and
  eventually returns -EIO if the device ID still\ncannot be fetched.\n\nOn this failure
  path, ipmi_add_smi() logs \"Unable to get the device id\"\nand goes to out_err_started,
  where it invokes the lower driver's\nshutdown callback. try_smi_init() then logs
  the returned registration\nfailure:\n\n ipmi_si IPI0001:00: IPMI message handler:
  Unable to get the device id: -5\n ipmi_si IPI0001:00: Unable to register device:
