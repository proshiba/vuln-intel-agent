title: "When the broker is processing message-based management requests, sent by an
  authenticated messaging client that is authorized with MANAGE permission to perform
  management-via-messaging, the parameter processing can trigger Java deserialization
  of certain method parameters that the broker will not utilise. The permitted types
  allow to craft a payload causing excessive computation and pinning the processing
  thread, leading to denial of service.\n\n\n\n\nThis issue affects Apache Artemis:
  from 2.50.0 through 2.56.0; Apache ActiveMQ Artemis: from 1.3.0 through 2.44.0.\n\
  \n\n\nUsers are recommended to upgrade to version 2.57.0, which fixes the issue."
