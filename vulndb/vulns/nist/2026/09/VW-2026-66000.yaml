title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usbusx2y: fix in04_last array size mismatch with in04_buf\n\nThe in04_last array
  in struct usx2ydev is declared as char[24], but\nin04_buf is allocated as sizeof(struct
  us428_ctls) which is 21 bytes.\nIn i_usx2y_in04_int(), when ctl_snapshot_last ==
  -2 (initialization\npath):\n\n    memcpy(usx2y->in04_last, usx2y->in04_buf, sizeof(usx2y->in04_last));\n\
  \nThis copies 24 bytes from a 21-byte slab allocation, reading 3 bytes\npast the
  end of the source object.\n\nIntroduce a USX2Y_IN04_SIZE constant defined as sizeof(struct\n\
  us428_ctls) and use it consistently for the in04_last array, the\nin04_buf allocation,
  the URB transfer length, and the comparison loop,\nreplacing the bare 24 and 21
  literals throughout."
