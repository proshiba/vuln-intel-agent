title: HomeBox is a home inventory and organization system. Prior to 0.26.0, the
  default-on BlockBogonNets and BlockCloudMetadata notifier SSRF protections in 
  backend/internal/sys/validate/notifier_url.go do not inspect IPv4 destinations
  embedded in the NAT64 prefixes 64:ff9b::/96 and 64:ff9b:1::/48. An 
  authenticated user can submit a generic:// notifier through POST /v1/notifiers
  or POST /v1/notifiers/test, and on a Homebox instance that egresses through 
  NAT64/DNS64, the gateway can translate an accepted IPv6 destination to cloud 
  metadata, localhost, or another internal IPv4 host. The notifier test path 
  returns delivery result information, and Shoutrrr propagates the response, 
  providing feedback that can disclose retrieved metadata such as temporary 
  credentials. Without NAT64 egress, the crafted IPv6 destination is not 
  routable, but the guard still incorrectly classifies it as safe. This issue is
  fixed in version 0.26.0.
