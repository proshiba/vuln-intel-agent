title: A vulnerability has been found in Krayin laravel-crm up to 2.2.5. The 
  impacted element is the function Storage::download of the file 
  packages/Webkul/Admin/src/Config/acl.php of the component attachment-download 
  Endpoint. The manipulation of the argument ID leads to improper control of 
  resource identifiers. The attack may be initiated remotely. The exploit has 
  been disclosed to the public and may be used. Upgrading to version 2.2.6 is 
  sufficient to resolve this issue. The identifier of the patch is 
  13d6988cda8d69ece45ee1890effc90a7f21cdc1. It is suggested to upgrade the 
  affected component.
