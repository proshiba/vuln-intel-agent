title: "CubeCart is an ecommerce software solution. Prior to 6.7.5, the _errorMessage
  method in classes/gui.class.php uses strip_tags to permit anchor elements in error,
  information, and warning messages while retaining unsafe href values and onclick
  event handlers. Attacker-controlled search or input data that reaches a GUI message
  can carry a javascript: URI or event handler through the filter, and viewing or
  interacting with the rendered anchor executes JavaScript in the victim's browser
  session, enabling session exposure or unauthorized application actions. This issue
  is fixed in version 6.7.5."
