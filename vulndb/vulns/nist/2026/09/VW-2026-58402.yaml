title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  reject invalid MFT LCNs from boot sector\n\nThe NTFS boot sector stores the MFT
  and MFTMirr locations as unsigned\n64-bit LCNs, but parse_ntfs_boot_sector() decoded
  them into an s64.\n\nA crafted high-bit value could therefore become negative and
  pass\nthe existing upper-bound check. The invalid value then propagated into\nthe
  MFT zone allocator and could result in an out-of-bounds access to\nlcn_empty_bits_per_page."
