title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Free histogram var refs regardless of how often they are referenced\n\nUsing the
  same variable three or more times in one hist trigger leaks the\nvariable reference
  and its strings when the trigger is removed.\n\ncommit 656fe2ba85e8 (\"tracing:
  Use hist trigger's var_ref array to destroy\nvar_refs\") made a trigger's var_refs[]
  array the only owner of a var ref:\ndestroy_hist_field() returns early for HIST_FIELD_FL_VAR_REF,
  so the field\nexpressions never destroy one. One entry, freed once, no count needed.\n\
  \ncommit 8bcebc77e85f (\"tracing: Fix histogram code when expression has same\n\
