title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  don't enable DAX on new encrypted files\n\nCurrently, when a new encrypted regular
  file is created, the call to\next4_set_inode_flags(inode, init=true) in __ext4_new_inode()
  is made\nbefore EXT4_INODE_ENCRYPT is set.  As a result, it can set S_DAX if the\n\
  filesystem is mounted with \"-o dax=always\".\n\nEXT4_INODE_ENCRYPT then actually
  gets set a bit later in\n__ext4_new_inode(), when it calls fscrypt_set_context()
  which calls\next4_set_context().  ext4_set_context() sets EXT4_INODE_ENCRYPT and\n\
  calls ext4_set_inode_flags(inode, init=false) to set S_ENCRYPTED too.\n\nThis was
  intended to clear S_DAX as well.  However, this was broken by\ncommit 043546e46dc7
  (\"fs/ext4: Only change S_DAX on inode load\").  This\ncauses data written to the
  file to bypass encryption, also causing\nxfstests failures such as generic/548 (when
  \"-o dax=always\" is used).\n\nFix this by simplifying the flow by making __ext4_new_inode()
  set\nEXT4_INODE_ENCRYPT"
