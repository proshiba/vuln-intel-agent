title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  transfer the pmd dirty bit to the folio on zap\n\nzap_huge_pmd_folio() propagates
  the pmd young bit to the folio for the\nfile case, but not the dirty bit.  The pte
  path does propagate it, in\nzap_present_folio_ptes() and so does the pmd split path,
  in\n__split_huge_pmd_locked().\n\nFor most file mappings the omission is harmless,
  because writing to a\nshared file mapping goes through page_mkwrite(), which dirties
  the folio. \ntmpfs is different: it has no page_mkwrite(), and vma_wants_writenotify()\n\
  is false for it, so a *read* fault on a MAP_SHARED tmpfs mapping installs\na writable
  pmd via do_read_fault().  do_read_fault() does not call\nfault_dirty_shared_page(),
  so subsequent stores through that mapping set\nonly the hardware dirty bit in the
  pmd and never call folio_mark_dirty(). \nA shmem folio allocated by a fault is marked
  uptodate but not dirty (see\nthe clear: block in shmem_get_folio_gfp()), so PG_dirty
  i"
