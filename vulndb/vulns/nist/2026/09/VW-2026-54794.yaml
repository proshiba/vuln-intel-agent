title: In Eclipse Ankaios versions 0.1.0 through 1.0.1, the agent does not limit
  the length declared by a workload in a length-delimited protobuf message 
  received through the Control Interface FIFO. A workload granted Control 
  Interface access can specify an excessive message length, causing an unbounded
  memory allocation that may abort the Ankaios agent process. This results in 
  loss of orchestration services for workloads managed by the affected agent.
