title: "Improper Privilege Management vulnerability in Apache Syncope.\n\n\n\n\n\n\
  Delegations can be created or updated with Roles not owned by the delegating User,
  or not for the same Realm subtree under the delegation management was granted for.\n\
  \n\n\nThis issue affects Apache Syncope: from 3.0.0-M0 through 3.0.16, from 4.0.0-M0
  Through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\n\nUsers are recommended to upgrade
  to version 4.0.8 / 4.1.3, which fix this issue."
