title: A vulnerability was detected in GPAC up to f1219cde. Affected by this 
  vulnerability is the function gf_node_get_field of the file 
  scenegraph/base_scenegraph.c of the component MP4Box. Performing a 
  manipulation results in heap-based buffer overflow. The attack is only 
  possible with local access. The exploit is now public and may be used. 
  Upgrading to version abi-16.23 addresses this issue. The patch is named 
  49dee5cad329cfed310c1682703df7daa47df31a. The affected component should be 
  upgraded.
