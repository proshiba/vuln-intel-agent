title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/mbox:
  Clamp mailbox output allocation to the payload size\n\nCXL_MEM_SEND_COMMAND bounds
  the user's in.size to the mailbox payload\nsize but leaves out.size unbounded, then
  cxl_mbox_cmd_ctor() calls\nkvzalloc(out.size). A large out.size drives a huge allocation,
  above\nINT_MAX it WARNs and taints, and with panic_on_warn=1 it panics.\n\nThe transport
  __cxl_pci_mbox_send_cmd() already clamps the response copy\nto min(out.size, payload_size,
  device len), so the output buffer is\nnever written beyond payload_size. Clamp the
  allocation to payload_size\ntoo, matching the RAW path."
