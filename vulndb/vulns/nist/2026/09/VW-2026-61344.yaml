title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkprobes:
  Protect kprobe_blacklist with RCU\n\n__within_kprobe_blacklist() traverses kprobe_blacklist
  without holding\nkprobe_mutex. When a module is unloaded, kprobe_remove_area_blacklist()\n\
  removes blacklist entries and immediately frees them with kfree().\nA concurrent
  call to within_kprobe_blacklist() can therefore dereference\nfreed memory.\n\nFurthermore,
  within_kprobe_blacklist() can be called in atomic or\nnon-preemptible contexts where
  the sleeping kprobe_mutex cannot be taken.\n\nProtect kprobe_blacklist with RCU.
  Use guard(rcu)() and\nlist_for_each_entry_rcu() for traversal, list_add_tail_rcu()
  for\ninsertions, list_del_rcu() for deletions, and kfree_rcu() to reclaim\nentries
  safely after a grace period."
