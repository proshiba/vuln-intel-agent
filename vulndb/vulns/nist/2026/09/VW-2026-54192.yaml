title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  usbfs: fix use-after-free of usb_device in usbdev_release()\n\nusbdev_release()
  drops its reference to the struct usb_device before\ndraining the list of completed
  async URBs, but that drain path reads back\nthrough the same object: free_async()
  calls dec_usb_memory_use_count()\nfor any URB whose buffer came from the usbfs mmap()
  region, and its first\nstatement is bus_to_hcd(ps->dev->bus).\n\nAfter a disconnect
  the usbfs reference can be the last one, in which case\nusb_put_dev() frees the
  device and the subsequent loop reads offset 80 of\nfreed memory and uses the result
  as a struct usb_hcd *, which\nhcd_buffer_free_pages() then dereferences.\n\nThis
  is reachable by an unprivileged process that has read/write access to\na /dev/bus/usb
  node: mmap() the fd, submit one URB with a buffer inside the\nmapping, wait for
  the device to be unplugged, then munmap() and close().\nIt reproduces on every attempt
  rather than being a race, be"
