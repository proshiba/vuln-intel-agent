title: "Improper neutralization of special elements used in an OS command in the task
  synthesis component in projen before 0.103.0 might allow context-dependent attackers
  to execute arbitrary commands on a developer workstation or continuous integration
  runner via shell metacharacters in project configuration values and repository file
  names that are interpolated into generated task definitions.\n\n\n\nTo remediate
  this issue, users should upgrade to version 0.103.0 and then re-synthesize the project
  so that .projen/tasks.json is regenerated with the corrected task definitions. Upgrading
  alone is not sufficient because the generated task definition file is committed
  to the repository."
