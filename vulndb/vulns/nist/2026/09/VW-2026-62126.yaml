title: ExifReader is a JavaScript Exif information parser. Prior to 4.41.1, 
  ExifReader parses attacker-controlled HEIC or AVIF ISO-BMFF files in 
  getItems() within src/image-header-iso-bmff-iloc.js and trusts iloc itemCount 
  and extentCount values while allocating an extent object for every nested-loop
  iteration. When offsetSize, lengthSize, baseOffsetSize, and indexSize are 
  zero, the extent fields consume no input bytes and the buffer offset does not 
  advance, but the parser can still allocate up to itemCount multiplied by 
  extentCount objects without an allocation budget. A small malicious iloc box 
  can therefore cause hundreds of megabytes of heap growth or exhaust system 
  memory, terminating a Node.js process and denying service to web, desktop, or 
  mobile applications that parse untrusted images. The zero field widths are 
  valid ISO-BMFF values indicating absent fields, so the vulnerable parser must 
  bound work rather than relying on offset advancement. The issue is fixed in 
  version 4.41.1.
