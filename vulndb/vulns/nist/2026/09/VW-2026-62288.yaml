title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  Do not skip lock checks for single-byte ranges\n\ncheck_lock_range() uses inclusive
  ranges. Its callers pass the end\noffset as start + length - 1, so start == end
  represents a valid\nsingle-byte range rather than an empty range.\n\nThe start ==
  end shortcut therefore skips mandatory byte-range lock\nchecks for one-byte reads,
  writes, copychunk operations and one-byte\ntruncate ranges. A conflicting lock covering
  that byte is not checked\nand the operation is allowed to proceed.\n\nRemove the
  shortcut. The truncate size == inode->i_size case is already\nhandled by only calling
  check_lock_range() when the new size differs\nfrom the current file size."
