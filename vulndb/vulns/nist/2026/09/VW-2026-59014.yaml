title: Joomla Extension - joomshaper.com - Unauthenticated CAPTCHA Bypass via 
  Request-Controlled CAPTCHA Configuration in SP Page Builder Pro 5.1.4 - 6.9.0 
  - The optin_form addon read the CAPTCHA type, the expected answer and the 
  enabled flag from the request rather than from the stored addon configuration.
  Verification reduced to md5($captcha_question) != $captcha_answer with both 
  operands supplied by the attacker, so any value passed.
