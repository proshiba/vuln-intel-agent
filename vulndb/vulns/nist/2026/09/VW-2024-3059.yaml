title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm/ident_map:
  Use gbpages only where full GB page should be mapped.\n\nWhen ident_pud_init() uses
  only GB pages to create identity maps, large\nranges of addresses not actually requested
  can be included in the resulting\ntable; a 4K request will map a full GB.  This
  can include a lot of extra\naddress space past that requested, including areas marked
  reserved by the\nBIOS.  That allows processor speculation into reserved regions,
  that on UV\nsystems can cause system halts.\n\nOnly use GB pages when map creation
  requests include the full GB page of\nspace.  Fall back to using smaller 2M pages
  when only portions of a GB page\nare included in the request.\n\nNo attempt is made
  to coalesce mapping requests. If a request requires a\nmap entry at the 2M (pmd)
