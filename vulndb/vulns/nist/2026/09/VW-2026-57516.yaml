title: "A heap-based buffer overflow vulnerability in the PC bridge protocol decoder
  of BoschSensortec COINES_SDK (versions 2.10 through 2.12.2) allows attackers to
  cause a denial of service (process crash) or potentially execute arbitrary code.
  \r\n\r\nThe bridge decoder ({{bridge_decoder.c}}) trusts the packet length field
  provided by the external device and forwards it to the host response queue ({{mqueue_add_data}})
  without validating the bounds of the destination buffer. \r\n\r\nA malicious or
  compromised USB or Bluetooth Low Energy (BLE) peripheral can advertise a payload
  size up to ~3 KB, which exceeds the default queue slot size of 255 bytes. \r\n\r\
  \nThis results in an unbounded heap overwrite ({{memcpy}}), corrupting adjacent
  heap metadata on the host system when processing the device's response."
