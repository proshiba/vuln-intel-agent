title: Axios is a promise-based HTTP client for the browser and Node.js. From 
  1.0.0 until 1.20.0, the dispatchRequest function normalizes inherited 
  Object.prototype.headers from a replacement request configuration. A separate 
  same-process prototype-pollution flaw sets Object.prototype.headers, and 
  trusted request interceptors return a new ordinary configuration without an 
  own headers property. After the interceptor chain, dispatchRequest resolves 
  the inherited headers during normalization. Downstream request processing can 
  observe attacker-controlled headers, including authorization-related values. 
  This issue is fixed in version 1.20.0.
