title: FreePBX is an open source IP PBX. Prior to versions 16.0.4 and 17.0.6, 
  the FreePBX Music on Hold (MoH) module contains a critical security flaw that 
  allows authenticated attackers to execute arbitrary system commands with the 
  privileges of the Asterisk service. Authentication with an existing FreePBX 
  administrator account is required. The root cause lies in the fact that the 
  module accepts a POST parameter that defines a custom Asterisk application, 
  which is then stored in the database without any sanitization. Later, this 
  data is written directly to the musiconhold_additional.conf configuration file
  without validation. Since Asterisk reads this configuration file and executes 
  the specified application, an attacker can inject arbitrary commands that will
  be executed with Asterisk's permissions. This issue has been patched in 
  versions 16.0.4 and 17.0.6.
