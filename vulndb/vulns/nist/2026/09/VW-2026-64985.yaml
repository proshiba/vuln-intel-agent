title: Joomla Extension - joomshaper.com - Authenticated, Privileged SQL 
  Injection in Coupon Bulk Update in Easy Store extension 1.0.0-3.0.0 - The 
  coupon bulk update task 
  (administrator/index.php?option=com_easystore&task=coupon.couponBulkUpdate) 
  took input IDs and directly concatenated them into raw SQL IN (...) clauses in
  ProductCoupon.php and CouponsModel.php without sanitization or 
  parameterization. An authenticated administrator could manipulate the query 
  through injected SQL syntax. Resolved by strictly casting all IDs to integers 
  (array_map('intval', ...)) and adopting parameterized ->whereIn() query 
  construction.
