  vulnerability in the portal.cgi component's password change functionality. The
  application improperly neutralizes special elements in the http_passwd_hidden 
  and http_passwdConfirm_hidden parameters, allowing an authenticated attacker 
  to execute arbitrary commands on the underlying operating system with root 
