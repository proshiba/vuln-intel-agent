title: MariaDB Connector/J is used to connect applications developed in Java to 
  MariaDB and MySQL databases. Prior to 2.7.14, 3.3.5, 3.4.3, and 3.5.9, 
  ClientMessage.readPacket processes a server-initiated LOCAL INFILE protocol 
  packet 0xfb without enforcing allowLocalInfile=false. When an application 
  sends a LOAD DATA LOCAL INFILE COM_QUERY, a rogue or man-in-the-middle server 
  can echo the same filename and cause the connector to transmit that file 
  despite the disabled option. The server cannot redirect the request to an 
  arbitrary path and can receive only the exact file already selected by the 
  application, so exploitation requires an application that actively loads 
  sensitive data over an untrusted connection. This issue is fixed in versions 
  2.7.14, 3.3.5, 3.4.3, and 3.5.9.
