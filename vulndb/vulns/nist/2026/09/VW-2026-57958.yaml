title: WeenyGenius, a computer lab management system developed by Howyar 
  Technologies, has a Missing Authentication vulnerability. Unauthenticated 
  attackers on the same network can easily spoof student or teacher endpoints. 
  Impersonating a student can disrupt normal classroom operations, whereas 
  impersonating a teacher can induce student computers to initiate connections, 
  thereby gaining remote control over the student endpoints.
