title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mctp: hold a reference to the route device in mctp_route_lookup()\n\nmctp_route_lookup()
  uses rt->dev without holding a reference on it.\nmctp_route_lookup_single() returns
  the route under RCU only, so the\nroute's device can be torn down concurrently:
  mctp_dev_put() drops the\nlast reference and synchronously kfree()s mdev->addrs.\
  \  mctp_dev_saddr()\nthen reads rt->dev->addrs[0], giving a use-after-free reachable
  by an\nunprivileged local AF_MCTP user on the receive/forwarding path (no\nCAP_NET_RAW
  required):\n\n  BUG: KASAN: slab-use-after-free in mctp_route_lookup\n  Read of
  size 1 at addr ... by task mctp_uaf/...\n   mctp_route_lookup\n   mctp_pkttype_receive\n\
  \  Freed by task ...:\n   kfree\n   mctp_dev_put\n   mctp_dev_notify\n\nIn the same
  window mctp_dst_from_route() -> mctp_dev_hold() also\nincrements a refcount that
  has already reached zero\n(\"refcount_t: addition on 0 ... mctp_dev_hold\").\n\n\
  This reintroduces the use-after-fre"
