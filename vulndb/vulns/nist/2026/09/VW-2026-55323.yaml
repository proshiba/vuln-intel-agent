title: A security issue in the MongoDB Server's storage engine integration layer
  allows an authenticated user with collection creation privileges to cause a 
  persistent denial of service. Insufficient validation of user-supplied storage
  configuration options permits values that, once persisted to durable metadata,
  trigger a fatal assertion failure when the metadata is subsequently read by 
  diagnostic operations. The corrupted metadata persists across server restarts 
  and is replicated to other cluster members, requiring manual operator 
  intervention to restore service.
