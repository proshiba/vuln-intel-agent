title: "Affected versions of MISP incorrectly filter dashboard templates that are
  restricted to a specific permission flag.\n\n\nDashboardsController::listTemplates()
  allowed a template when either:\n\n\n\n - its restrict_to_permission_flag matched
  one of the current user’s permission flags, or\n\n - restrict_to_permission_flag
  equaled integer 0\n\n\n\n\n\n\nHowever, restrict_to_permission_flag is a varchar.
  MySQL therefore performed numeric coercion when comparing the column against integer
  0. Strings such as perm_site_admin convert numerically to zero, making expressions
  such as perm_site_admin = 0 evaluate true and causing the “unrestricted” branch
  to match permission-restricted templates as well.\n\n\n\nVersion affected: ≤2.5.45"
