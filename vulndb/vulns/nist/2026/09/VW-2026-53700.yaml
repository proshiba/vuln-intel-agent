title: "In the current development version of Eclipse aeriOS, for which no official
  release has yet been published, the Federator component disables TLS certificate
  validation for outbound HTTPS connections by default. When the TLS_CERTIFICATE_VALIDATION
  environment variable is unset or set to false, the component configures its HTTP
  transport to skip TLS certificate verification.\n\n\n\n\nAs a result, an attacker
  able to intercept network communications between the Federator and external services
  could impersonate those services and intercept sensitive information transmitted
  over HTTPS, including OAuth client credentials and bearer tokens.\n\n\n\n\nThe issue
  has been addressed by enabling TLS certificate validation by default. The TLS_CERTIFICATE_VALIDATION
  environment variable is now set to true in the default configuration provided by
  the Helm chart and Docker Compose deployment."
