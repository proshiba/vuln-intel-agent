title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/server:
  fix tree connection leak in smb2_tree_connect()\n\nSee the procedure below:\n\n\
  \  smb2_tree_connect\n    ksmbd_tree_conn_connect\n      xa_store(&sess->tree_conns,
  tree_conn->id, tree_conn)\n      ksmbd_counter_inc(KSMBD_COUNTER_TREE_CONNS)\n \
  \     ksmbd_share_tree_conn_inc(sc)\n    ksmbd_iov_pin_rsp // fail\n    status.ret
  = KSMBD_TREE_CONN_STATUS_NOMEM\n    // do not disconnect tree_conn\n\nDisconnect
  the new tree connection if ksmbd_iov_pin_rsp() fails."
