title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs3:
  fix out-of-bounds read in ntfs_dir_emit() and hdr_find_e()\n\nThe bounds check in
  ntfs_dir_emit() compares fname->name_len (a\ncharacter count) against e->size (a
  byte count) without accounting\nfor the 2-byte-per-character UTF-16LE encoding or
  the ATTR_FILE_NAME\nheader size:\n\n  if (fname->name_len + sizeof(struct NTFS_DE)
  > le16_to_cpu(e->size))\n\nThis computes: name_len + 16 > e_size\n\nThe correct
  check must account for the ATTR_FILE_NAME header (66 bytes\nbefore the name) and
  the UTF-16LE character size (2 bytes each):\n\n  sizeof(NTFS_DE) + offsetof(ATTR_FILE_NAME,
  name) +\n  name_len * sizeof(short) > e_size\n\nWhich computes: 16 + 66 + name_len
  * 2 > e_size\n\nThe correct calculation already exists as fname_full_size() in ntfs.h\n\
  and is used in cmp_fnames(), namei.c, and fslog.c, but was not used\nin the readdir
  path.\n\nA crafted NTFS image with an index entry containing a small e->size\nbut
  large fname->name_len bypasses "
