title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_uac1_legacy: remove broken string configfs attributes\n\nThe UAC1_STR_ATTRIBUTE
  macro defines configfs show/store handlers for\nthe fn_play, fn_cap, and fn_cntl
  string options. The store function\ncontains an inverted null check on the kstrndup()
  return value.\n\nThis means every write attempt returns -ENOMEM on success and\n\
  dereferences a NULL pointer on allocation failure. The attributes\nhave been broken
  and unused for many years.\n\nRemove the UAC1_STR_ATTRIBUTE macro and the three
  attributes it\ngenerated. The internal defaults (FILE_PCM_PLAYBACK, FILE_PCM_CAPTURE,\n\
  FILE_CONTROL) set in f_audio_alloc_inst() are unaffected."
