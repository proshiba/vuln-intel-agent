title: CubeCart is an ecommerce software solution. Prior to 6.7.5, the reset_id 
  download-counter action and delete_card stored-payment-card action in 
  admin/sources/orders.index.inc.php use state-changing GET requests and are 
  omitted from the protection map in admin/skins/default/csrf.inc.php. A remote 
  attacker can induce an authenticated administrator to issue one of these 
  requests without a validated session token, causing unintended resets of 
  electronic download usage counters or deletion of stored customer payment-card
  tokens. This issue is fixed in version 6.7.5.
