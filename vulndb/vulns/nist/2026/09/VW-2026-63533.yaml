title: The TikTok plugin for WordPress is vulnerable to authorization bypass in 
  all versions up to, and including, 1.4.1. This is due to the plugin not 
  properly verifying that a user is authorized to perform an action. This makes 
  it possible for unauthenticated attackers to overwrite the merchant's stored 
  TikTok integration access token in wp_options, hijacking the site's TikTok 
  Business and product catalog integration. Successful exploitation requires the
  attacker to supply a valid TikTok OAuth auth_code issued for the merchant's 
  registered TikTok app, as the plugin's token exchange must receive a 
  message='OK' response from TikTok's API before the stored access token is 
  overwritten.
