title: 'OpenClaw is an npm-distributed gateway application. In versions >= 2026.7.1
  and < 2026.8.1, Synology Chat attachment delivery could lose DNS pinning: the Gateway
  validated a single DNS result for a supplied file URL but then passed the original
  hostname to the Synology NAS, where it could resolve to a different destination.
  When attachment delivery accepted a remotely influenced hostname, an attacker could
  use DNS rebinding to make the NAS fetch a private or otherwise policy-denied resource
  and return its contents to the addressed conversation (server-side request forgery).
  Practical impact depends on NAS routing, resolver behavior, and the response available
  at the private destination. The issue is fixed in 2026.8.1; as a workaround, disable
  remote URL attachment forwarding in Synology Chat.'
