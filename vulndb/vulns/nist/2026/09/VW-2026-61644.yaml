title: MikroORM is a TypeScript ORM for Node.js based on Data Mapper, Unit of 
  Work and Identity Map patterns. Prior to 6.6.16 and 7.1.7, the shared SQL 
  layer validates the field key of an orderBy clause but does not validate its 
  direction value before AbstractSqlPlatform.getOrderByExpression concatenates 
  it into an ORDER BY clause. Applications that bind attacker-controlled request
  data to the direction in em.find(), em.findOne(), em.findAndCount(), 
  QueryBuilder.orderBy(), or QueryBuilderHelper.getQueryOrderFromObject() can 
  permit a raw SQL fragment that performs blind or boolean extraction of data 
  available to the database account. The BaseMySqlPlatform and MsSqlPlatform 
  fallthrough paths have the same behavior, affecting SQLite, PostgreSQL, MySQL,
  MariaDB, MSSQL, libSQL, and Oracle drivers, while MongoDB is not affected. 
  This issue is fixed in versions 6.6.16 and 7.1.7.
