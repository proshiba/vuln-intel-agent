title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  bound xattr value length in __build_xattrs()\n\n__build_xattrs() decodes the MDS-supplied
  xattr blob one attribute at a\ntime. For each attribute it reads a 32-bit name length,
  advances past the\nname bytes, reads a 32-bit value length, records the value pointer,
  and\nadvances past the value bytes. The two length fields are read with\nceph_decode_32_safe(),
  but the value bytes themselves are advanced over\nwith a bare \"p += len\" and no
  ceph_decode_need() check that \"len\" bytes\nremain in the blob.\n\nFor every attribute
  except the last, the next iteration's\nceph_decode_32_safe() on the following name
  length implicitly verifies\nthat the previous value did not run past the blob end.
  The final\nattribute has no successor, so its decoded value length is never checked\n\
  against the blob bounds. A malicious or compromised metadata server can\nset the
  last attribute's value length larger than the bytes actually\npresent in the blob.\n"
