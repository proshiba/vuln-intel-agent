title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix use-after-free of the LLC qentry in smc_llc_srv_add_link()\n\nsmc_llc_srv_add_link()
  keeps add_llc pointing into the queue entry:\n\n  add_llc = &qentry->msg.add_link;\t\
  \t\tsmc_llc.c:1482\n  ...\n  smc_llc_save_add_link_info(link_new, add_llc);\tsmc_llc.c:1494\n\
  \  smc_llc_flow_qentry_del(&lgr->llc_flow_lcl);\t\tsmc_llc.c:1495\n  ...\n  u8 *llc_msg
  = smc_link_shared_v2_rxbuf(link) ?\n\t(u8 *)lgr->wr_rx_buf_v2 : (u8 *)add_llc;\t\
  smc_llc.c:1504\n  smc_llc_save_add_link_rkeys(link, link_new, llc_msg);\tsmc_llc.c:1506\n\
  \nsmc_llc_flow_qentry_del() kfree()s the entry, so on a link without a shared\n\
  v2 receive buffer the pointer handed to smc_llc_save_add_link_rkeys() is\nalready
  freed. Before the Fixes: commit that branch always used\nlgr->wr_rx_buf_v2 and add_llc
  was not used after the free.\n\nReproduced on an unpatched tree over rxe, with KASAN,
  kasan_multi_shot\nand a link forced to max_recv_sge == 1: the entry is freed and
  read by\nthe s"
