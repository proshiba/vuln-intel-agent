title: Kyverno before 1.16.2 contains a server-side request forgery (SSRF) 
  vulnerability in the APICall feature. The URL field in a Policy's ServiceCall 
  configuration is not validated, so a user with namespace-level Policy creation
  permissions can direct Kyverno to make HTTP requests to arbitrary internal 
  resources (e.g., cloud metadata endpoints such as 169.254.169.254 or other 
  tenants' resources). Because Kyverno executes these requests using its 
  cluster-wide high-privilege ServiceAccount (a Confused Deputy problem), the 
  responses—potentially including other tenants' secrets and cloud IAM 
  credentials—are returned in the PolicyReport and can be read by the attacker, 
  breaking multi-tenant isolation.
