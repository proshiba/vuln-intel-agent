title: "ClawHub (openclaw/clawhub) application/backend contains a server-side request
  forgery vulnerability in the public profile preview's image fetching. The preview
  accepts a user-supplied image URL and checks the textual hostname against private-address
  patterns, but does not validate or pin the resolved network destination, so a public-looking
  hostname can resolve to an internal address or change resolution between validation
  and connection (DNS rebinding). A maintainer-run local harness demonstrated an outbound
  connection to an owner-controlled loopback listener; access to production internal
  services, credential disclosure, and code execution were not demonstrated. The issue
  was confirmed at revision cbfee7343ddc867316dd9b3de6fa8856730f9f41; the complete
  historical affected range was not established. Fixed by PR #3683, included in revision
  8c2de6c506bb4efabe3f0c2ffb8370b9e23d4650, which was deployed to clawhub.ai on 2026-09-11;
  self-hosted deployments should update to that revision or a"
