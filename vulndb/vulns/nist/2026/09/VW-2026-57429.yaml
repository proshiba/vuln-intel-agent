title: A flaw has been found in Rizwan17 inventory-management-system up to 
  bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. This issue affects some unknown 
  processing of the file index.php of the component Login Page. Executing a 
  manipulation of the argument msg can lead to cross site scripting. The attack 
  can be launched remotely. The exploit has been published and may be used. This
  product does not use versioning. This is why information about affected and 
  unaffected releases are unavailable. The project was informed of the problem 
  early through an issue report but has not responded yet.
