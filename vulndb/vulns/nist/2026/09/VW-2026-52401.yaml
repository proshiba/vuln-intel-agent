title: A vulnerability was found in hyperledger-firefly firefly up to 1.4.0. The
  impacted element is the function ValidateOptions of the file 
  internal/events/webhooks/webhooks.go of the component Webhook Subscription. 
  Performing a manipulation of the argument url results in server-side request 
  forgery. Remote exploitation of the attack is possible. The exploit has been 
  made public and could be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
