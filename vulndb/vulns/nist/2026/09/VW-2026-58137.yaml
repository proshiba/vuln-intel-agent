title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: cancel mlo_pm_work on stop\n\nmt7925 queues mlo_pm_work with a 5 second
  delay during multi-link\npower-save setup and never cancels it on the stop path.
  If the device is\ntorn down inside that window, the work outlives the teardown and
  its timer\nfires afterwards, trying to queue onto the workqueue that is already
  gone:\n\n  workqueue: cannot queue mt7925_mlo_pm_work [mt7925_common] on wq phy0\n\
  \  WARNING: kernel/workqueue.c:2283 at __queue_work+0x59/0xa0, CPU#1: swapper/1/0\n\
  \   call_timer_fn+0x2a/0x140\n   __run_timers+0x203/0x330\n   run_timer_softirq+0x86/0xf0\n\
  \nmt7921 already has its own stop callback, so add one for mt7925 that\ncancels
  the work before calling mt792x_stop(). mt7925_ops backs both the\nPCIe and USB drivers,
  so this covers both."
