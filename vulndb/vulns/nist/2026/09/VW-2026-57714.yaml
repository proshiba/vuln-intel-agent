title: Improper neutralization of special elements in data query logic in the 
  GridFS component of the MongoDB Go Driver can cause a caller-supplied 
  structured file identifier to be interpreted as a query condition rather than 
  as a literal identifier. An authenticated user who can influence the 
  identifier passed by an affected application may cause all GridFS file chunks 
  in the affected bucket to be removed, rendering stored file content 
  unreadable.
