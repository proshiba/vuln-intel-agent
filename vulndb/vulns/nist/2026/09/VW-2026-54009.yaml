title: Grav Admin (getgrav/grav-plugin-admin2) versions <= 2.0.19 contain a 
  stored cross-site scripting vulnerability in the tHtml() function 
  (src/lib/stores/i18n.svelte.ts), which substitutes untrusted parameters such 
  as usernames into translation templates before parsing the result as markdown.
  Grav's server-side username validation (DataUser::isValidUsername) blocks 
  filesystem-dangerous characters but not <, >, ", or ', allowing an attacker to
  register a username containing an HTML payload. When an administrator views a 
  UI surface that renders the username through tHtml()—such as the two-factor 
  force-disable confirmation prompt or the 'page is locked' editor notice—the 
  payload executes in their authenticated session. Fixed in 2.0.21.
