title: A vulnerability has been found in Dvidelabs flatcc up to 0.6.3. The 
  impacted element is the function fb_clear_parser of the file 
  src/Compiler/semantics.c. The manipulation leads to memory leak. It is 
  possible to initiate the attack remotely. The exploit has been disclosed to 
  the public and may be used. The identifier of the patch is 
  8dbc3419738da066151991fd2bf1d0c85591dea2. It is suggested to install a patch 
  to address this issue.
