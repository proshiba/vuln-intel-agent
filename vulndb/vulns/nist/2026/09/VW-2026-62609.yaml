title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/v3d:
  Associate BOs with every job that accesses them\n\nA submission can expand into
  a chain of jobs (e.g. bin + render + cache\nclean). Implicit synchronization in
  v3d_submit_lock_reservations() is gated\non each job's bo[], but the BO list was
  only ever attached to the last job\nof the chain. When that last job is a trailing
  CACHE_CLEAN job, the job\nthat actually consumes the BOs (that is, a RENDER or CSD
  job) was left with\nbo_count == 0 and picked up no implicit dependencies. It could
  therefore\nbe dispatched to the hardware and read a BO while another context was
  still\nwriting it, leading to data corruption.\n\nAttach the BOs to the job that
  consumes them, so (1) it acquires the\ncorrect implicit dependencies during reservation
  locking and (2) they are\nkept mapped until the end of the submission. Give it references
  to all\nconsuming job's BOs through v3d_job_reference_bos() instead of looking the\n\
