title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvdimm/btt:
  reject an arena whose nfree is below the lane count\n\nThe BTT info block's nfree
  field, the number of reserve free blocks, is\nread from the medium without validation.\
  \  btt_freelist_init() and\nbtt_rtt_init() size the per-lane freelist[] and rtt[]
  arrays by nfree,\nbut the I/O path indexes them by the lane from nd_region_acquire_lane(),\n\
  which is bounded by nd_region->num_lanes (ND_MAX_LANES), not by nfree.\nA crafted
  or foreign arena whose nfree is below the lane count makes\nfreelist[lane]/rtt[lane]
  run past the allocation: an out-of-bounds write.\n\nbtt.rst documents the nlanes
  = min(nfree, num_cpus) invariant, which the\ncode does not currently honor: num_lanes
  is ND_MAX_LANES regardless of\nnfree.  Reject an arena whose nfree is below num_lanes
  at discovery,\nbefore the per-lane arrays are allocated, enforcing that invariant."
