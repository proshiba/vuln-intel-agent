title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsamples/damon/mtier:
  handle damon_stop() failure\n\ndamon_sample_mtier_stop() assumes its damon_stop()
  call will always\nsuccessfully stops the two DAMON contexts.  Hence it deallocates
  the two\nDAMON contexts after the damon_stop() call.  However, if a given context\n\
  is already stopped, damon_stop() fails and returns an error while letting\nthe DAMON
  contexts that have not yet stopped keep running.  This kind of\nunexpected early
  DAMON context stops could happen due to memory allocation\nfailures in kdamond_fn().\
  \  Because damon_sample_mtier_stop() just\ndeallocates all DAMON contexts with damon_target
  and damon_region objects\nthat are linked to the contexts, the execution of the
  unstopped DAMON\ncontext (kdamond) ends up using the memory that freed (use-after-free).\
  \ \nFix the issue by separating the damon_stop() to be invoked per context.\n\n\
  Note that DAMON_SYSFS also allows multiple DAMON contexts execution.  But,\nit calls
  damon"
