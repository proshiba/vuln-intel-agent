title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  properly decrypt filenames in vmalloc() buffers\n\nThe fscrypt subsystem uses the
  scatterlist crypto API, inheriting its\nrequirement that any buffers are in the
  linear mapping region. However,\nthe messenger client uses kvmalloc() to create
  buffers for messages,\nwhich will occasionally place those buffers in the vmalloc()
  region when\nphysical memory fragmentation doesn't permit a large enough kmalloc().\n\
  The various callers of ceph_fname_to_usr() directly pass (slices of) raw\nmessages
  from the MDS without considering that the messages may be in\nvmalloc() buffers,
  resulting in oopses especially on non-x86 platforms\n(see 'Closes:' for more details
  and a reproducer).\n\nMake ceph_fname_to_usr() explicitly tolerant of vmalloc()-allocated\n\
  fname->ctext, fname->name, and/or oname->name buffers, using `tname`\n(which, when
  non-null, must be a linear address; when null, is briefly\nallocated as necessary)
