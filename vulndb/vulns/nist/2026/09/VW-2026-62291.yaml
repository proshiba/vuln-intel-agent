title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fix deadlock in complain-mode change_hat\n\nThe use of change_hat when in complain
  mode can cause a deadlock\nwhen the hat doesn't exist and a new learning profile
  is created\nfor the missing profile. This is because change_hat() has taken\nthe
  lock to search the hat list and creating the new learning\nprofile needs to take
  the lock to add it to the list.\n\nFrom the bug report:\n\nOriginally found in 7.0.0
  in LTS ubuntu 26.04 with pam_apparmor + su\nin complain mode set to change hats.\
  \  Then verified in newest\navailable vanilla kernel I've compiled to see if still
  present:\n\n7.2-rc7 vanilla -> affected\n\nchecked also some other kernels:\n6.18.44
  vanilla -> affected\n6.12.95 with debian patches -> unaffected\n\nOn systems without
  bug (for example 6.12.95 debian) it just prints:\n\naa_change_hat rc=0\n\nOn systems
  with bug, the executable always hangs, prints nothing and\nbecomes unkillable. \
