title: A vulnerability was found in agentverus agentverus-scanner up to 0.8.1. 
  Affected by this vulnerability is the function isSecurityDefenseSkill of the 
  file dist/scanner/analyzers/context.js. Performing a manipulation results in 
  reliance on untrusted inputs in a security decision. The attack must be 
  initiated from a local position. The exploit has been made public and could be
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
