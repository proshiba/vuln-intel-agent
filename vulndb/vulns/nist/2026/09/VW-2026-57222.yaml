title: eprosima Fast DDS is a C++ implementation of the DDS (Data Distribution 
  Service) standard of the OMG (Object Management Group). Prior to versions 
  2.6.12, 2.14.6, 3.2.4, and 3.4.3, Fast DDS’s implementation of SQL‑based 
  content filtering (DDSSQLFilter) allows any participant in a DDS domain to 
  remotely crash other Fast DDS participants by sending a single crafted SEDP 
  `DATA` submessage whose `PID_CONTENT_FILTER_PROPERTY.filterExpression` 
  contains a deeply nested filter expression. Versions 2.6.12, 2.14.6, 3.2.4, 
  and 3.4.3 fix the issue.
