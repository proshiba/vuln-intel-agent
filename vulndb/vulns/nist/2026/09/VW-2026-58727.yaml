title: A vulnerability has been found in vvbbnn00 WARP-Clash-API up to 
  c7bf2360073959861219b422e51ae86411051b46. The impacted element is the function
  authorized. The manipulation of the argument SECRET_KEY leads to missing 
  authentication. The attack can be initiated remotely. The exploit has been 
  disclosed to the public and may be used. Continious delivery with rolling 
  releases is used by this product. Therefore, no version details of affected 
  nor updated releases are available. The vendor was contacted early about this 
  disclosure but did not respond in any way. This vulnerability only affects 
  products that are no longer supported by the maintainer.
