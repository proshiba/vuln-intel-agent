title: "The MotoPress Hotel Booking plugin for WordPress is vulnerable to Stored Cross-Site
  Scripting via the Stripe Webhook event object 'id' in all versions up to, and including,
  6.2.4 due to insufficient input sanitization and output escaping. This makes it
  possible for unauthenticated attackers to inject arbitrary web scripts in pages
  that will execute whenever a user accesses an injected page. The premium Stripe
  webhook listener only verifies the webhook signature when an optional Stripe signing
  secret has been configured; because that secret is empty by default, a forged webhook
  is accepted without cryptographic verification, and the attacker-controlled event
  object 'id' (e.g. a forged 'refund.created' refund id) is written unescaped into
  the payment log and later echoed unsanitized when an administrator views the payment.
  An attacker must know a valid Stripe PaymentIntent ID for an existing payment to
  route the forged webhook to a payment record. Note: The vulnerable webhook handler
