title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mana_ib:
  drain QP references after partial table insertion\n\nmana_table_store_ud_qp() publishes
  a QP at its send-queue id before\ninserting the receive-queue id, dropping the XArray
  lock between the two\nxa_insert_irq() calls. A concurrent completion handler can
  look up the QP\nand take a transient reference. When the second insertion fails,
  the\nrollback erased only the send-queue entry and returned, leaving both the\n\
  initial table reference and the transient reference outstanding while RDMA\ncore
  frees the QP, causing a use-after-free.\n\nDrain the reference as normal destruction
  does: drop the initial reference\nand wait for qp->free, releasing the QP only after
  every concurrent lookup\nreturns its reference."
