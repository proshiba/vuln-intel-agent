title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  require every boolean value to be defined\n\np_bools.nprim comes from the policy
  image independently of how many\nbooleans follow it, and cond_index_bool() fills
  bool_val_to_struct[] at\nvalue - 1, so a count larger than the values present leaves
  NULL entries.\nEvery user of that array then walks it by index and dereferences
  each\nentry: cond_evaluate_expr() on the access-vector path,\nsecurity_get_bools()
  and security_get_bool_value() behind selinuxfs, and\nsecurity_set_bools(). A sparse
  class value is absorbed by\npolicydb_class_isvalid() and its siblings; booleans
  have no such\npredicate, and no consumer that could use one.\n\nReject a boolean
  value that no boolean defines, once, where the array is\nbuilt. Conforming policies
  define every boolean they declare and are\nunaffected."
