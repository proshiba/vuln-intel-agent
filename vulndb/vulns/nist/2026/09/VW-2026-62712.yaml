title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-rdma:
  fix response resource leak on queue teardown\n\nWhen an nvme target with rdma transport
  is removed while I/Os are in\nflight, a response can be posted but its send completion
  is never\ndelivered before the connection is torn down. As a result\nnvmet_rdma_send_done()
  and nvmet_rdma_release_rsp() are never called for\nthe response, and this leaks
  the allocated RDMA read/write context and\nrequest SGLs.\n\nThese leaks are recreated
  by running blktests nvme/061 with the rdma\ntransport and the siw driver. Kernel
  kmemleak feature reports them as\nfollows:\n\n  unreferenced object 0xffff88812bc490c0
  (size 32):\n    comm \"kworker/2:1H\", pid 409, jiffies 4307744490\n    backtrace
  (crc 89afd339):\n      __kmalloc_noprof+0x5f9/0x890\n      sgl_alloc_order+0x7b/0x380\n\
  \      nvmet_req_alloc_sgls+0x290/0x4f0 [nvmet]\n      nvmet_rdma_map_sgl_keyed+0x241/0x12e0
  [nvmet_rdma]\n      nvmet_rdma_handle_command+0x73e/0xb80 [nvmet_rdma]\n      __"
