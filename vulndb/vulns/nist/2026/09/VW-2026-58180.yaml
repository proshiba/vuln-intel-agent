title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  unregister the connection before draining the rx tasklet\n\nsmc_conn_free() calls
  smc_ism_unset_conn() only while the link group is\nstill on its device list, and
  never sets conn->killed.\nsmc_lgr_terminate_sched() unlinks the group immediately
  and defers killing\nits connections to a work item, so a connection freed in that
  window keeps\nits smcd->conn[] slot with both gates in smcd_handle_irq() open, and
  the\ndevice can re-arm the receive tasklet after tasklet_kill() has returned. On\n\
  the DMB-nocopy path the ghost send buffer is freed right after that drain,\nso the
  re-armed tasklet dereferences it.\n\nUnregister unconditionally and drain before
  the detach at both teardown\nsites, mirroring rmb_desc, which smc_buf_unuse() releases
  after the drain.\nClear conn->sndbuf_desc before freeing it as well, so a reader
  that samples\nthe pointer cannot get one that is already freed."
