title: Hono is a Web application framework that provides support for any 
  JavaScript runtime. Prior to 4.13.5, Hono's query helpers treat a question 
  mark after a literal hash fragment as the start of a query string, so the 
  application can read request parameters that browsers, new URL(), reverse 
  proxies, filtering rules, parameter allow and deny lists, access logging, 
  request validation, and other middleware do not observe. The Cache Middleware 
  removes the fragment when building its cache key, allowing a response 
  influenced by parameters inside the fragment to be stored under a key that 
  omits those parameters and later served to other users. This can bypass 
  filtering and auditing, poison cached responses, and enable stored cross-site 
  scripting when an affected parameter is reflected into cached HTML without 
  escaping. Exploitation requires a runtime and intermediary path that passes a 
