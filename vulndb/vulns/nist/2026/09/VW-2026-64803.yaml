title: "Improper Check for Certificate Revocation vulnerability in Apache Tomcat.
  Both the OpenSSL and OpenSSL-FFM TLS implementations ignore CRLs when certificate
  uses a keystore.\n\n\n\nThis issue affects Apache Tomcat: from 11.0.0-M1 through
  11.0.25, from 10.1.0-M1 through 10.1.58, from 9.0.0-M1 through 9.0.121.\n\n\n\n\
  The following versions were EOL at the time the CVE was created but are \nknown
  to be affected: from 8.5.0 through 8.5.100. Other unsupported versions may also
  be affected.\n\n\n\nUsers are recommended to upgrade to version 11.0.26, 10.1.59,
  9.0.122, which fixes the issue."
