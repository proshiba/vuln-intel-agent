title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  clear cdev pointer after cdev_add() failure\n\ntty_cdev_add() drops the cdev reference
  when cdev_add() fails, but\nleaves driver->cdevs[index] pointing to freed memory.\n\
  tty_unregister_device() later passes that stale pointer to cdev_del(),\ncausing
  a use-after-free.\n\nClear the slot after dropping the reference."
