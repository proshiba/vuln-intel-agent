title: The Tauri updater plugin's 'check' IPC command accepts an allowDowngrades
  boolean parameter directly from frontend JavaScript code. When set to true, it
  replaces the version comparator from "update must be newer" to "update must be
  different." Because the default permission set grants allow-check to the 
  webview, any XSS in the app frontend can invoke this command and bypass the 
  only anti-rollback protection the updater offers. Combined with another bug, 
  this enables downgrade attacks without even needing to fake a higher version 
  number.
