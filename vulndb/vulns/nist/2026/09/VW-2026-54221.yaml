title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SEV: Allocate full pages for {DE,EN}CRYPT ops on SNP-enabled hosts\n\nWhen {de,en}crypting
  memory of an SEV or SEV-ES guest on an SNP-enabled\nhost via a temporary buffer,
  allocate a full 4KiB page for the buffer to\nensure the page containing the buffer
  is wholly owned by KVM, i.e. won't\nbe concurrently allocated and accessed by other
  kernel code while KVM is\nusing the buffer to {de,en}crypt memory.  On SNP-enabled
  platforms, when\nsending SEV/SEV-ES commands that trigger firmware writes to memory,
  the\nto-be-written page(s) must be (temporarily) assigned to Firmware (as\nrequired
  by the SNP architecture, to guard against using such commands as\ngadgets to attack
  SNP guests).  See snp_map_cmd_buf_desc() and friends.\n\nUnfortunately, transferring
  ownership of a page to Firmware makes the page\ninaccessible to software, and thus
  writes generate RMP #PF violations.  If\nKVM uses a sub-page allocation for its
  temporary buffer,"
