title: A heap-based buffer overflow was found in the DHCPv6 and TFTP response 
  builders of libslirp. When the host is configured with a small interface MTU, 
  a guest-supplied DHCPv6 CLIENTID option or TFTP blksize option can overflow 
  the reply buffer with attacker-controlled content and length, resulting in 
  denial of service and potentially arbitrary code execution in the host 
  process. The default interface MTU is not affected.
