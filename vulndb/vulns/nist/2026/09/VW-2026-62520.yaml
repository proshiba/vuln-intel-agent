title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix overreads in ath12k_wmi_process_csa_switch_count_event()\n\nThere is
  no policy entry for WMI_TAG_PDEV_CSA_SWITCH_COUNT_STATUS_EVENT, so\nthe parse infrastructure
  does not enforce a minimum length for the event\nstruct. Additionally, the num_vdevs
  field is taken directly from firmware\nand used as a loop bound over the vdev_ids
  array without checking that it\nfits within the TLV payload. Either condition can
  cause an out-of-bounds\nread.\n\nAdd a TLV policy entry for WMI_TAG_PDEV_CSA_SWITCH_COUNT_STATUS_EVENT
  so\nthe parse infrastructure enforces a minimum length for the fixed-size event\n\
  struct. Add a helper ath12k_wmi_tlv_data_len() to recover the payload\nlength of
  a parsed TLV from the header preceding its data pointer. Use it\nin ath12k_wmi_process_csa_switch_count_event()
  to bound num_vdevs before\nthe loop.\n\nCompile tested only."
