title: Nautobot is a Network Source of Truth and Network Automation Platform. 
  Prior to 2.4.37 and 3.1.8, a user with extras.add_relationship or 
  extras.change_relationship permission can store HTML or JavaScript in a 
  Relationship description, and a user with dcim.add_modulefamily or 
  dcim.change_modulefamily permission can store it in a Module Family name. 
  Nautobot assigns these values to form field help_text rendered by 
  render_field.html through Django's |safe filter without adequate 
  neutralization. The stored content executes in the authenticated browser 
  session of any user, including an administrator or superuser, who opens an 
  affected create or edit form. This can enable actions as the victim, session 
  or token theft, and further privilege escalation. This issue is fixed in 
  versions 2.4.37 and 3.1.8.
