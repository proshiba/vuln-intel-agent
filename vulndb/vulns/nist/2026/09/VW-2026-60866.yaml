title: 'Vulnerability in the Oracle Agile PLM product of Oracle Supply Chain (component:
  Application Server).   The supported version that is affected is 9.3.6. Difficult
  to exploit vulnerability allows unauthenticated attacker with access to the physical
  communication segment attached to the hardware where the Oracle Agile PLM executes
  to compromise Oracle Agile PLM.  Successful attacks of this vulnerability can result
  in  unauthorized creation, deletion or modification access to critical data or all
  Oracle Agile PLM accessible data as well as  unauthorized access to critical data
  or complete access to all Oracle Agile PLM accessible data. CVSS 3.1 Base Score
  6.8 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N).'
