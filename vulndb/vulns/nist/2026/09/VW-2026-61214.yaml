title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Bound image count in qla2x00_update_fru_versions()\n\nqla2x00_update_fru_versions()
  copies the user-supplied BSG request into\na fixed 256-byte stack buffer (bsg[DMA_POOL_SIZE])
  and then iterates\nlist->count times over the qla_image_version array embedded in
  that\nbuffer, advancing the image pointer each iteration. count is taken\ndirectly
  from user input with no upper bound, while only (DMA_POOL_SIZE\n- sizeof(list->count))
  / sizeof(struct qla_image_version) = 6 entries\nactually fit. A larger count walks
  the image pointer off the end of the\nstack buffer, reading adjacent kernel stack
  memory and sending it to the\ndevice via qla2x00_write_sfp().\n\nReject requests
  whose declared count does not fit in the buffer."
