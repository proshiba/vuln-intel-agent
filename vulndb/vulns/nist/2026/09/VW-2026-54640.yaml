title: A vulnerability was found in Mstfakts College-Management-System. This 
  issue affects the function mysqli_query of the file Front-end/university.php 
  of the component Search Handler. The manipulation of the argument 
  book_name/book_author results in sql injection. The attack may be performed 
  from remote. The exploit has been made public and could be used. This product 
  utilizes a rolling release system for continuous delivery, and as such, 
  version information for affected or updated releases is not disclosed. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
