title: Improper link resolution before file access in the quarantine restoration
  process of WatchDog Anti-Virus 1.8.640 on Windows allows local, low-privileged
  attackers to cause a quarantined file to be written to an arbitrary filesystem
  location by creating a directory junction at the original file path and 
  persuading an administrator to restore the file. This may enable modification 
  of protected files or SYSTEM-level code execution through DLL hijacking.
