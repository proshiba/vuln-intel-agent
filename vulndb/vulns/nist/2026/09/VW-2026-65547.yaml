title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  preserve non-DOS attribute bits in system.dos_attrib\n\n[BUG]\nA corrupted ntfs3
  image can hit a NULL function pointer call in\ngeneric_perform_write() after toggling
  system.ntfs_attrib and then\noverwriting system.dos_attrib on the same file.\n\n\
  BUG: kernel NULL pointer dereference, address: 0000000000000000\n\\#PF: supervisor
  instruction fetch in kernel mode\n\\#PF: error_code(0x0010) - not-present page\n\
  PGD bed5067 P4D bed5067 PUD 0\nOops: Oops: 0010 [#1] SMP KASAN NOPTI\nRIP: 0010:0x0\n\
  Code: Unable to access opcode bytes at 0xffffffffffffffd6.\nRSP: 0018:ffff88801025f988
  EFLAGS: 00010246\nCall Trace:\n generic_perform_write+0x409/0x8c0 mm/filemap.c:4255\n\
  \ __generic_file_write_iter+0x1bb/0x200 mm/filemap.c:4372\n ntfs_file_write_iter+0xcd9/0x1c20
  fs/ntfs3/file.c:1253\n new_sync_write fs/read_write.c:593 [inline]\n vfs_write+0x63b/0xf70
  fs/read_write.c:686\n ksys_write+0x133/0x250 fs/read_write.c:738\n __do_sys_write
  fs/read_writ"
