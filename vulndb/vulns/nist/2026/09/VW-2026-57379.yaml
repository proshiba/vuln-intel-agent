title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.6.41 until 0.11.1, get_user_by_oauth_sub and 
  get_user_by_scim_external_id in backend/open_webui/models/users.py used JSON 
  contains matching that compiled to SQL LIKE substring matching on SQLite. An 
  OAuth subject containing percent or underscore wildcard characters could 
  resolve to a different stored identity, potentially selecting an administrator
  account and issuing the attacker that account's session; PostgreSQL 
  deployments were not affected. This issue is fixed in version 0.11.1.
