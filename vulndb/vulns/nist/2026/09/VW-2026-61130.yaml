title: "Information disclosure via SetWatches reconnect replay in Apache ZooKeeper
  due to missing ACL check. An attacker can discover ACL-restricted paths by registering
  exists-watches on non-existent paths, then reconnecting after the paths are created
  with restricted ACLs. Issue is caused by incomplete fix for CVE-2024-23944 (ZOOKEEPER-4799). The
  fix added ACL checking to WatchManager.triggerWatch(). However, DataTree.setWatches()
  — the SetWatches/SetWatches2 reconnect replay handler — still calls watcher.process(event)
  with null ACL, bypassing the check entirely. It's important to note that only the
  path is exposed by this vulnerability, not the data of znode, but since znode path
  can contain sensitive information like user name or login ID, this issue is potentially
  critical.\n\nUsers are recommended to upgrade to version 3.9.6, 3.8.7 which fixes
  the issue."
