title: "The Shopping Cart & eCommerce Store plugin for WordPress is vulnerable to
  generic SQL Injection via the 'product_order' parameter in all versions up to, and
  including, 5.9.2 due to insufficient escaping on the user supplied parameter and
  lack of sufficient preparation on the existing SQL query. This makes it possible
  for authenticated attackers, with administrator-level access and above, to append
  additional SQL queries into already existing queries that can be used to extract
  sensitive information from the database. This is a second-order SQL injection: the
  payload is written to the ec_pageoption table via the ec_ajax_save_page_options
  handler — which applies no sanitization to raw $_POST values — and is later retrieved
  with stripslashes() (bypassing WordPress magic-quotes protection) before being concatenated
  directly into SQL on every store page render."
