title: "A JWT signature verification vulnerability affects Kong components that perform
  JWT validation for MCP OAuth2 or DataKit integrations inside Kong API Gateway Enterprise.
  The affected code does not properly validate that the JWT signing algorithm is compatible
  with the type of key used for verification.\n\n\n\nAs a result, an unauthenticated
  remote attacker may be able to craft a forged JWT that is incorrectly accepted as
  valid, leading to authentication bypass and potential compromise of confidentiality,
  integrity, and availability."
