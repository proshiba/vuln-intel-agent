title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  use RCU iterator to dump route exceptions\n\nrt6_nh_dump_exceptions() uses hlist_for_each_entry()
  to iterate over\nRCU-protected exception lists. The caller holds rcu_read_lock(),
  but does\nnot hold rt6_exception_lock, so rt6_insert_exception() can concurrently\n\
  add an entry with hlist_add_head_rcu().\n\nKCSAN reports this race (irrelevant details
  omitted):\n\n  ==================================================================\n\
  \  BUG: KCSAN: data-race in rt6_insert_exception / rt6_nh_dump_exceptions\n\n  write
  (marked) to 0xffff8a7c44c59620 of 8 bytes by interrupt on cpu 5:\n    rt6_insert_exception+0x3bb/0x760\n\
  \    __ip6_rt_update_pmtu+0x4fe/0x750\n    ip6_sk_update_pmtu+0x19a/0x3b0\n    udpv6_err+0x3ff/0x800\n\
  \    icmpv6_notify+0x1e1/0x440\n    icmpv6_rcv+0x8c0/0xab0\n    ip6_protocol_deliver_rcu+0x616/0x840\n\
  \    ip6_input_finish+0xb9/0x160\n    ...\n    entry_SYSCALL_64_after_hwframe+0x77/0x7f\n\
  \n  read to 0xffff8a7c44c59620 of 8 by"
