title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: hold dev->mt76.mutex while disabling tx worker in SER\n\nmt7996_mac_reset_work()
  parked the tx worker and disabled the RX/TX NAPIs\nbefore taking dev->mt76.mutex.
  mt76_worker_disable()/_enable() are plain\nkthread park/unpark, not refcounted,
  and __mt76_set_channel() toggles the\nsame worker and the MT76_RESET bit under the
  mutex. An L1 SER racing a\nchannel switch could therefore have the worker unparked
  and MT76_RESET\ncleared while the reset path resets the DMA rings, corrupting descriptors\n\
  or tokens. Take the mutex before disabling the worker, as mt7915 does."
