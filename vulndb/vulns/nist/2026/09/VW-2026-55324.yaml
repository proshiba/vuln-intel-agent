title: A heap out-of-bounds read security issue exists in the query planning 
  component of MongoDB Server. An authenticated user with database read and 
  write privileges can trigger the security issue through crafted query 
  operations, causing the server to read memory beyond allocated buffer 
  boundaries. The revealed memory contents may be partially observable through 
  diagnostic query statistics output.
