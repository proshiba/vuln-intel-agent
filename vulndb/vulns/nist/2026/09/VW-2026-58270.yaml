title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-tcp:
  reject a read that transferred too few bytes\n\nnvme_tcp_recv_data() completes a
  request once the current C2HData PDU\nhas been consumed. Nothing compares the total
  bytes received against\nthe length the command asked for: struct nvme_tcp_request
  has no\nreceive-side counter, queue->data_remaining is per queue, and\nblk_mq_end_request()
  completes for blk_rq_bytes(rq) unconditionally\nwith no residual concept anywhere
  above.\n\nA controller can therefore answer a 4096-byte read with 512 bytes and\n\
  have it reported as a complete read; user space then gets 4096 bytes of\nwhich 3584
  are whatever was already in the page. I reproduced that with\na test target.\n\n\
  Count the bytes received and refuse to complete a successful read whose\ncount does
  not match, at the two NVME_TCP_F_DATA_SUCCESS paths and in\nnvme_tcp_process_nvme_cqe().
  The success test shifts req->status right\nby one, because the driver keeps the
