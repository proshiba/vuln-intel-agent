title: A vulnerability was determined in 0x4m4 HexStrike AI up to 
  d689933ff579d839c676c82b231f8e98326c5f04. The impacted element is an unknown 
  function of the file hexstrike_server.py of the component API Command 
  Endpoint. This manipulation causes missing authentication. The attack can be 
  initiated remotely. The exploit has been publicly disclosed and may be 
  utilized. Continious delivery with rolling releases is used by this product. 
  Therefore, no version details of affected nor updated releases are available. 
  The project was informed of the problem early through an issue report but has 
  not responded yet.
