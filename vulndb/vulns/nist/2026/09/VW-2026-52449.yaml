title: The Support Genix – Helpdesk, AI Chatbot, Knowledge Base & Customer 
  Support Ticketing System plugin for WordPress is vulnerable to Authentication 
  Bypass leading to Administrator Account Takeover in all versions up to, and 
  including, 1.4.52 via the `guest_ticket_login()` function and its `p` 
  parameter. This is due to the site-wide AES-256-CBC encryption key being 
  derived from only three two-digit `wp_rand(10, 99)` values and a Unix 
  timestamp via `md5()` — yielding approximately 19.5 bits of entropy — combined
  with a deterministic IV derived from the password, no authentication tag on 
  the ciphertext, and no capability check, nonce, or session validation on the 
  publicly reachable `/sgnix/?p=<token>` endpoint. This makes it possible for 
