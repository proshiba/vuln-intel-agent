title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndax/fsdev:
  clear vmemmap_shift when binding static pgmap\n\nClear pgmap->vmemmap_shift for
  static DAX devices. When rebinding a static\ndevice from device_dax (which may set
  vmemmap_shift based on alignment) to\nfsdev_dax, the stale vmemmap_shift persists
  on the shared pgmap. Explicitly\nzero it before devm_memremap_pages() so the vmemmap
  is built for order-0\nfolios as fsdev requires."
