title: A vulnerability has been found in Freshwork up to 1.2.3. This impacts an 
  unknown function of the file /api/v2/logout. Such manipulation of the argument
  post_logout_redirect_uri leads to open redirect. The attack can be executed 
  remotely. The exploit has been disclosed to the public and may be used. 
  Upgrading to version 1.2.3 will fix this issue. You should upgrade the 
  affected component. The vendor was contacted early about this disclosure but 
  did not respond in any way.
