title: "A flaw was found in Ansible Automation Platform's automation-controller (AWX).\n\
  The Bulk Job Launch API (POST /api/v2/bulk/job_launch/) authorizes the\nrequested
  instance_groups with only a read-level permission check, whereas the\nstandard single-job
  launch path requires use-level permission on the same\nfield. A principal that holds
  read (but not use) permission on an instance\ngroup -- for example the built-in
  read-only System Auditor role -- together\nwith execute permission on a job template
  can launch bulk jobs onto instance\ngroups they are not authorized to use, bypassing
  execution-placement\nisolation."
