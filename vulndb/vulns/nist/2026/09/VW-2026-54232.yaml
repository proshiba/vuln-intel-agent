title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix responder UAF on IB_QP_MAX_DEST_RD_ATOMIC modify_qp\n\nrxe_qp_from_attr() handles
  IB_QP_MAX_DEST_RD_ATOMIC outside the\nIB_QP_STATE path, so it holds no state_lock
  and runs while the responder\ntask rxe_receiver() (recv_task on rxe_wq) is live.
  A modify_qp() setting\nonly that attribute calls free_rd_atomic_resources() then\n\
  alloc_rd_atomic_resources(), swapping qp->resp.resources[] while\nrxe_prepare_res()/find_resource()
  walk it; free_rd_atomic_resources()\nalso leaves the cached pointer qp->resp.res
  dangling. A local\nunprivileged user can race the free/realloc into a use-after-free
  in\nrxe_receiver() (local DoS).\n\nDrain recv_task around the swap with rxe_disable_task()/rxe_enable_task(),\n\
  as rxe_qp_reset() already does when tearing this array down, re-enabling\nonly after
  alloc_rd_atomic_resources() succeeds so the responder never\nresumes against a NULL
  qp->resp.resources on the ENOMEM path. Also clear\nqp->resp."
