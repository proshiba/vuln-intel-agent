title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix BPF_F_CPU validation for sparse CPU IDs\n\nBPF_F_CPU stores the target CPU ID
  in the upper 32 bits of the map\noperation flags. bpf_map_check_op_flags() currently
  compares that ID\nwith num_possible_cpus(), which is the number of possible CPUs
  rather\nthan a bound on CPU IDs.\n\nOn an arm64 QEMU guest with a CPU device-tree
  hole, the possible CPU\nmask was 0,2-3. A userspace program using raw bpf() syscalls
  creates\na BPF_MAP_TYPE_PERCPU_ARRAY and performs update and lookup operations\n\
  for each CPU by setting BPF_F_CPU and the CPU ID in the flags.\n\nWith the old check,
  CPU 1 is incorrectly accepted while valid CPU 3 is\nrejected with -ERANGE. The CPU
  1 update then reaches the per-CPU map\naccess path and triggers:\n\n  Unable to
  handle kernel paging request at virtual address ...\n  pc : __pi_memcpy_generic+0x5c/0x22c\n\
  \  lr : bpf_percpu_array_update+0x2dc/0x2e8\n  Call trace:\n    __pi_memcpy_generic\n\
  \    bpf_map_update_value\n  "
