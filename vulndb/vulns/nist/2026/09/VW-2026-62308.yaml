title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: validate topology volume range before allocation\n\nSOF treats the topology
  mixer min and max values as non-negative indices\ninto its volume table. It stores
  them in signed fields, allocates max + 1\nentries through an int argument, and later
  indexes the table with the\nstored range.\n\nAn inverted range is invalid, while
  a maximum at or above INT_MAX cannot\nbe represented safely after the increment
  or in the signed fields.\nValidate the complete range before storing it or allocating
  the table."
