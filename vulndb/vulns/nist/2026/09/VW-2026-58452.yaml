title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent lock owner use-after-free during client teardown\n\n__destroy_client() releases
  a client's open owners, but a lock owner\nwhose only reference is a blocked lock
  (nbl) stays on\ncl_ownerstr_hashtbl.  client_has_state() does not count a bare owner,\n\
  so DESTROY_CLIENTID can reach __destroy_client() with such owners\npresent.\n\n\
  __destroy_client() then walks the table, calling remove_blocked_locks()\non each
  owner without a reference.  Freeing a blocked lock drops the\nowner reference held
  via flc_owner.  The per-net laundromat reaps\nblocked locks from nn->blocked_locks_lru
  independently of client state.\nThe two paths share blocked_locks_lock only for
  the list splice, not\nthe owner's lifetime.  The laundromat therefore frees the
  owner as\n__destroy_client() dereferences it, a NULL dereference in\nremove_blocked_locks().\n\
  \nnfsd4_release_lockowner() holds a reference across the same call;\n__destroy_client()
  does not.  Hold"
