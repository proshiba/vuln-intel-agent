title: An information exposure vulnerability in the job scheduling component of 
  SANnav allows sensitive credentials to be written to application logs in plain
  text. When scheduled support save jobs or related operational tasks are 
  executed, sensitive parameters including external server passwords and archive
  protection keys are logged without proper masking. A local or authenticated 
  user with access to application logs or support bundles can view these 
  cleartext credentials, potentially leading to unauthorized access to remote 
  backup targets or protected archives.
