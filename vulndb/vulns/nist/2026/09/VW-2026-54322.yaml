title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  release readahead folios on iterator preparation failure\n\nnetfs_prepare_read_iterator()
  batches readahead folios in put_batch so that\nthe folio references can be dropped
  after the I/O iterator has been\nprepared.\n\nIf rolling_buffer_load_from_ra() fails
  after earlier folios have been\nbatched, the function returns immediately and leaves
  those references held.\nRelease the batch before returning the error."
