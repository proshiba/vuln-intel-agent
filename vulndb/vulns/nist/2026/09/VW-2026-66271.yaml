title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix mismatched free of HalData in rtw_sdio_if1_init()\n\npadapter->HalData
  is allocated via vzalloc(), but incorrectly freed\nusing kfree() in the rtw_sdio_if1_init()
  error path. Using kfree() to\nrelease this vmalloc-backed buffer can lead to memory
  corruption.\n\nUse rtw_hal_data_deinit() to pair the free correctly and free\nHalData
  with vfree().\n\nThe bug was first flagged by an experimental static analysis tool
  we\nare developing for kernel memory-management bugs. Manual inspection\nconfirms
  that the issue is still present in current mainline.\n\nAn x86_64 allyesconfig build
  showed no new warnings. As we do not have\nsuitable RTL8723BS SDIO hardware to test
  with, no runtime testing was\nable to be performed."
