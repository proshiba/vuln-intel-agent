title: "MISP contains an improper TLS certificate validation vulnerability in CurlClient.
  The CurlClient::$verifyPeer property was not explicitly initialized and therefore
  defaulted to null. When passed to cURL, this value effectively disabled TLS peer
  verification unless the calling code explicitly enabled it.\n\n\nAs a result, HTTPS
  connections made through affected CurlClient instances could accept certificates
  that were not issued by a trusted certificate authority. An attacker capable of
  intercepting or manipulating network traffic between a MISP instance and a remote
  HTTPS service could impersonate the remote endpoint and perform a man-in-the-middle
  attack.\n\n\nSuccessful exploitation could allow an attacker to observe sensitive
  information transmitted by MISP, including authentication material or exchanged
  threat intelligence, and to modify responses returned to the MISP instance. The
