title: "In the Linux kernel, the following vulnerability has been resolved:\n\neventfs:
  Initialize ei->children and ei->list in init_ei()\n\neventfs_create_dir() allocates
  the eventfs_inode and initializes it with\ninit_ei(). But this does not initialize
  the eventfs_inode list_heads. If\nthe eventfs_create_dir() fails due to memory pressure,
  it will call\nfree_ei() before it initialized the lists, and that checks to make
  sure\nthe eventfs_inode has no children. But because the list wasn't\ninitialized,
  it will give a false warning.\n\nFix it by moving the list initialization into init_ei().\n\
  \n[ Rewrote change log ]"
