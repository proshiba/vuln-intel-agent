title: ClipBucket v5 before 5.5.3-#182 contains a file upload vulnerability that
  allows authenticated users to achieve remote code execution by uploading a PHP
  file with valid image magic bytes through the photo upload endpoint. The 
  FileUpload::manageFile() function in fileupload.class.php fails to update the 
  file extension after MIME validation, allowing an attacker-controlled .php 
  extension to persist on disk and execute as PHP via PHP-FPM when the uploaded 
  file is retrieved.
