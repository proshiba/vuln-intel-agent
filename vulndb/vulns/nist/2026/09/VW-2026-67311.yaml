title: A vulnerability was found in deepseek-ai deepseek-harness up to 
  0.1.0-rc.7. Impacted is the function run_code of the component Code Mode 
  Sandbox. The manipulation results in sandbox issue. The attack can be executed
  remotely. The vendor's own code, SAFETY.md, and design notes all explicitly 
  state the worker is "containment, not a security boundary". The vendor was 
  contacted early about this disclosure but did not respond in any way.
