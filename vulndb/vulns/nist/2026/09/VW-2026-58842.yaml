title: A vulnerability was identified in wxiaoqi Spring-Cloud-Platform 
  3.0.1/3.1.0. This vulnerability affects the function 
  PermissionService.checkUserPermission of the file 
  /rpc/service/PermissionService.java of the component Permission Service. The 
  manipulation leads to missing authorization. Remote exploitation of the attack
  is possible. The exploit is publicly available and might be used. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
