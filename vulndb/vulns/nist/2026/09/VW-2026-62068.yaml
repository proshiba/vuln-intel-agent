title: vm2 before 3.11.7 exposes Node's shared Buffer pool to sandboxed code, 
  allowing disclosure of host memory used by Buffer.from, Buffer.concat, and 
  related allocations. Sandboxed code can read and write to host-realm buffers 
  by acquiring ArrayBuffers from small allocations, leading to sensitive data 
  exposure and potential denial-of-service.
