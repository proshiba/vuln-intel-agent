title: Chartbrew is an open-source web application that can connect directly to 
  databases and APIs and use the data to create charts. Prior to 5.2.2, 
  Chartbrew's runQuery() implementation in 
  server/modules/ai/orchestrator/tools/runQuery.js attempts to enforce read-only
  database access with a blocklist containing only seven SQL keywords. An 
  authenticated user with AI feature access can submit dangerous statements or 
  database functions that are absent from the read-only keyword blocklist, 
  causing them to execute without SQL injection or keyword-obfuscation 
  techniques. Depending on the database engine, configuration, and database-user
  privileges, this can expose or write files, access internal network resources,
  change database privileges, execute commands, or alter data. This issue is 
  fixed in version 5.2.2.
