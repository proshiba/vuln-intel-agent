title: Snipe-IT before 8.7.0 fails to properly gate access to encrypted 
  custom-field values in asset form templates for listbox, textarea, 
  markdown-textarea, and date/datetime picker elements. Authenticated users with
  assets.edit, assets.checkin, assets.checkout, or assets.audit permissions can 
  read plaintext encrypted custom field values by opening asset forms, bypassing
  the assets.view.encrypted_custom_fields permission check.
