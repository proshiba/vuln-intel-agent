title: The Simple Ajax Chat – Add a Fast, Secure Chat Box plugin for WordPress 
  is vulnerable to Stored Cross-Site Scripting via Chat Message in all versions 
  up to, and including, <= 20260811 due to insufficient input sanitization and 
  output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The nonce protecting chat message submission is 
  publicly visible on the chat page, rendering it ineffective as an 
  authentication barrier and allowing fully unauthenticated attackers to submit 
  malicious messages that are stored persistently and rendered to all visitors 
  on every page load.
