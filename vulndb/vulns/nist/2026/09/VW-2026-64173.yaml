title: "Net::IDN::Punycode versions before 2.590 for Perl allow an out-of-bounds read
  via integer overflow of the delta accumulator in encode_punycode.\n\nThe XS backend
  keeps the punycode delta, and the digit index derived from it, in a signed int.
  The accumulation `delta += (m-n) * (h+1)` has no overflow check, so a large enough
  code point wraps the delta and the digit index leaves the range of the 36-entry
  digit table. The bound before the final table access tests only for an index above
  36, so a negative index passes it, as does 36 itself. Perl strings hold code points
  beyond the Unicode range, and one such code point overflows the accumulation on
  its own. Valid input wraps it as well, for example 1927 ASCII letters followed by
  U+10FFFF. The conversion functions encode a label before they check its length,
  so a long label reaches the encoder through the documented API.\n\nOnly the XS backend
  is affected.\n\nEncoding an attacker-supplied string copies a byte from outside
