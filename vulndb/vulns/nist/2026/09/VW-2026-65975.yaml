title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  zero-initialize policy cpumask before sysfs publication\n\ncpufreq_policy_alloc()
  allocates policy->cpus with alloc_cpumask_var(),\ni.e. without __GFP_ZERO, unlike
  the sibling related_cpus and real_cpus\nmasks. With CONFIG_CPUMASK_OFFSTACK=y the
  mask is a separate\nkmalloc_node() allocation, so its bitmap holds whatever the
  slab allocator\nleft behind:\n\n  cpufreq_online()\n    cpufreq_policy_alloc()\n\
  \      alloc_cpumask_var(&policy->cpus)    /* bitmap is uninitialized */\n     \
  \ kobject_init_and_add()              /* policy%u/ appears in sysfs */\n    cpufreq_policy_online()\n\
  \      cpumask_copy(policy->cpus, cpumask_of(cpu))  /* first valid value */\n\n\
  This leaves a window in which the sysfs attributes are already reachable\nwhile
  policy->cpus is still garbage. show()/store() gate on\npolicy_is_inactive(), i.e.
  cpumask_empty(policy->cpus), so a non-zero\nbitmap makes them run the attribute
  callbacks on a policy that is not\nin"
