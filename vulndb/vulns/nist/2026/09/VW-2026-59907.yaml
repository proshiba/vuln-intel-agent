title: FreeRDP server versions before 3.31.0 contain a use-after-free 
  vulnerability in the DRDYNVC parser that dereferences a channel pointer after 
  releasing the synchronization lock. Authenticated clients can race AUDIN 
  channel closure messages against DRDYNVC data parsing to trigger 
  heap-use-after-free when accessing freed channel objects.
