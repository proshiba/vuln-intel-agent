title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  RFCOMM: serialize security confirmation handling\n\nrfcomm_security_cfm() looks
  up a session on session_list and then walks\nits DLC list without holding rfcomm_mutex.
  Since RFCOMM session teardown\nuses rfcomm_mutex, krfcommd can close and free the
  same session and DLCs\nconcurrently:\n\n  hci_rx_work                    krfcommd\n\
  \  -----------                    ---------\n  rfcomm_session_get()\n          \
  \                       rfcomm_lock()\n                                 rfcomm_session_close()\n\
  \                                   rfcomm_dlc_unlink()\n                      \
  \             rfcomm_session_del()\n                                     kfree(s)\n\
  \                                 rfcomm_unlock()\n  walk s->dlcs\n\nThe callback
  can then read a freed session list head and touch freed DLCs\nwhile updating their
  flags or timers.\n\nSerialize the session lookup and DLC traversal in rfcomm_security_cfm()\n\
  with rfcomm_mutex. "
