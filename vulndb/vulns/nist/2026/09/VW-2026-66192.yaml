title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  invalidate fscache for fallocate range operations\n\nsmb3_zero_range(), smb3_punch_hole(),
  smb3_insert_range(), and\nsmb3_collapse_range() modify file contents through server-side
  range\noperations. These operations discard the affected page cache, but leave\n\
  the FS-Cache cookie valid, so a later read may return data cached before\nthe range
  operation.\n\nFix this by invalidating FS-Cache after outstanding I/O has completed\n\
  and before modifying the file on the server.\n\nRun the following as root on a CIFS
  mount with fsc enabled and an active\nCacheFiles backend:\n\n        bash -c '\n\
  \                MNT=/mnt/cifs\n                FILE=\"$MNT/repro\"\n\n        \
  \        # Generate four 1 MiB random blocks: [A][B][C][D].\n                dd
  if=/dev/urandom of=/tmp/src bs=1M count=4 status=none\n\n                # Expected
  contents after zeroing B: [A][zero][C][D].\n                cp /tmp/src /tmp/expected\n\
  \                dd if=/"
