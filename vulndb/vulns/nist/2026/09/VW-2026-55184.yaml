title: "A client may issue HTTP/2 requests to a Jetty server that result in blocking
  writes that are never unblocked, eventually causing all threads to be blocked and
  the whole server to become unresponsive.\n\n\n\n\nThis is caused by a race condition
  in the server when handling RST_STREAM frames and GOAWAY frames sent by the client.\n\
  \n\n\n\nThe race condition \"resets\" the HTTP2Flusher.terminated, previously set
  to a non-null value, to the null value, allowing entries to be enqueued in the flusher
  that however will never be processed. These unprocessed entries are the ones that
  would unblock the write-blocked threads."
