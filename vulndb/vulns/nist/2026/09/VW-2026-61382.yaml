title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: qcom-pmic: cancel reset_work on stop\n\npdphy_stop() disables IRQs but leaves
  reset_work pending.  If the IRQ\nhandler schedules it just before disable_irq(),
  the work runs after\nremove() frees the struct via devm.\n\nCall cancel_work_sync()
  after disabling IRQs to close the window.\n\nThis issue was found by an in-house
  static analysis tool."
