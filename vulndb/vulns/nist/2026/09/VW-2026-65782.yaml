title: MinIO through 7aac2a2 does not verify that every x-amz-* header present 
  on a request also appears in the client-supplied X-Amz-SignedHeaders list. 
  extractSignedHeaders() in cmd/signature-v4-utils.go iterates only the claimed 
  list and never enumerates the headers that actually arrived, and thus a header
  that arrives unsigned is neither hashed into the canonical request nor 
  rejected. Because cmd/api-router.go dispatches CopyObject on the presence of 
  x-amz-copy-source alone, the holder of a presigned PUT URL scoped to a single 
  object can add that header to the unmodified URL and cause a server-side copy,
  executed as the signer, of any object the signing key can read. A grant to 
  write one object becomes a read of every bucket that key can reach. Amazon S3 
  rejects the equivalent request with HTTP 403 AccessDenied. The minio/minio 
  GitHub repository was archived in April 2026; pgsty/silo before 1233254 is 
  also affected.
