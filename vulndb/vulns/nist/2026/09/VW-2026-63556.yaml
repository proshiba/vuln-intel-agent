title: 'A security vulnerability has been detected in grimmory-tools grimmory up to
  3.3.3/3.4.1. Affected is the function AppSettingController.getAppSettings of the
  file backend/src/main/java/org/booklore/controller/AppSettingController.java of
  the component Settings API Endpoint. Such manipulation leads to incorrect authorization.
  The attack can be launched remotely. The exploit has been disclosed publicly and
  may be used. The name of the patch is 2b66ca6df8110f6b512e030b54c16b9fbe318f17.
  Applying a patch is advised to resolve this issue. PR #2558, merged as 53abc8b,
  moved the OIDC secret into a dedicated setting, but did not by itself restrict GET
  /api/v1/settings.'
