title: A vulnerability was found in 0717376 cowork_bench up to 
  d943e75bc0fc8e3b27141979300cd8cbcd1e890d. Affected by this vulnerability is 
  the function ControlFlowNode of the file 
  local_servers/pdf-tools-mcp/pdf_tools_mcp/server.py of the component 
  pdf-tools-mcp. Performing a manipulation of the argument pdf_file_path results
  in server-side request forgery. It is possible to initiate the attack 
  remotely. The exploit has been made public and could be used. This product is 
  using a rolling release to provide continious delivery. Therefore, no version 
  details for affected nor updated releases are available. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
