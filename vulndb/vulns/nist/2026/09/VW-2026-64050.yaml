title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to 3.7.2, Joplin Desktop for Windows 
  omits publisherName from packages/app-desktop/package.json, so the generated 
  app-update.yml causes NsisUpdater.verifySignature() to skip comparison of a 
  downloaded update's Authenticode signer with Joplin's signer. An attacker who 
  controls the update delivery path can replace the update metadata and 
  installer, and the client accepts an installer signed by another publisher or 
  left unsigned after the user approves installation. Successful exploitation 
  runs attacker-controlled code with the user's privileges and can compromise 
  notes, credentials, and local data. This issue is fixed in version 3.7.2.
