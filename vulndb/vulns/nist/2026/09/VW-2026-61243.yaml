title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  i2c: ov7740: fix use-after-destroy in remove\n\nThe ov7740_remove() function had
  a severe teardown order bug where it\ndestroyed the driver's mutex before freeing
  the V4L2 control handler\nwhich relies on that mutex, leading to a use-after-destroy
  kernel panic.\nFurthermore, the driver explicitly called v4l2_ctrl_handler_free()
  and\nmutex_destroy() sequentially, but then called ov7740_free_controls()\nwhich
  invokes both of them a second time, resulting in a double-free.\n\nThis patch fixes
  the issue by unregistering the subdevice first, and\nrelying exclusively on ov7740_free_controls()
  to safely tear down the\nmutex and control handler in the correct order."
