title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix nfsd_file leak on inter-server COPY setup failure\n\nWhen nfsd4_setup_inter_ssc()
  fails, nfsd4_copy() returns\nnfserr_offload_denied directly, bypassing the out:
  label where\nrelease_copy_files() would drop the nf_dst reference taken by\nnfs4_preprocess_stateid_op().
  Each failed inter-server COPY\nleaks one nfsd_file, pinning file/inode/dentry/vfsmount.\n\
  \nFix by setting status and jumping to out: instead of returning\ndirectly."
