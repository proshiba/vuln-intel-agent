title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent client use-after-free during admin state revocation\n\nA stateid holds only
  a bare pointer to its nfs4_client; a stateid\nreference does not pin it.  The client
  survives only because\n__destroy_client() drains its stateids before free_client()
  runs.\n\nnfsd4_revoke_states() drops nn->client_lock across revoke_one_stid(),\n\
  which dereferences the client to revoke a stateid and read\nclp->cl_minorversion.\
  \  A teardown racing the dropped lock can free\nthe client first.\n\nPinning cl_rpc_users
  under client_lock blocks the DESTROY_CLIENTID and\nEXCHANGE_ID teardown, which refuses
  while cl_rpc_users is non-zero.\nforce_expire_client() ignores it: once its wait
  for cl_rpc_users to\nreach zero has passed, a later pin goes unnoticed.\n\nUnder
  client_lock, skip a client whose cl_time is already zero --\nforce_expire_client()
  clears it there before waiting -- otherwise pin\ncl_rpc_users before dropping the
  lock.  The walk then either"
