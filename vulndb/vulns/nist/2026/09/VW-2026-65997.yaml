title: "In the Linux kernel, the following vulnerability has been resolved:\n\nufs:
  create the root dentry after loading cylinder metadata\n\nufs_fill_super() installed
  sb->s_root before it loaded the cylinder\ngroup structures for a writable mount:\n\
  \n\tsb->s_root = d_make_root(inode);\n\t...\n\tif (!sb_rdonly(sb))\n\t\tif (!ufs_read_cylinder_structures(sb))\n\
  \t\t\tgoto failed;\n\nWhen ufs_read_cylinder_structures() failed, the error path
  freed the\nin-core superblock information and set sb->s_fs_info to NULL while\n\
  sb->s_root stayed installed. get_tree_bdev() then reached\ndeactivate_locked_super(),
  and because s_root was present,\ngeneric_shutdown_super() called sync_filesystem()
  and the put_super\noperation. Both dereference UFS_SB(sb), which is now NULL, so
  a mount\nthat fails only while reading the cylinder groups oopses during\nteardown.
  A crafted image whose first cylinder group cannot be read\nreaches this path.\n\n\
  Load the cylinder group metadata first and create the root dentry last,\nso the
  superblock is publishe"
