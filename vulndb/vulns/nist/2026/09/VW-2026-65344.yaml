title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  skip device-private PMDs in madvise_free_huge_pmd\n\nmadvise_free_pte_range() checks
  pmd_trans_huge(*pmd) unlocked, then\nmadvise_free_huge_pmd() takes pmd_trans_huge_lock().\
  \  pmd_is_huge()\nreturns true for a device-private PMD, so orig_pmd can be device-private\n\
  and enter the !pmd_present() branch.\n\nSkip device-private PMDs in that non-present
  branch and continue to out\nbefore calling pmd_folio().  Downgrade the check to
  VM_WARN_ON_ONCE() so\nan unexpected PMD softleaf logs a warning rather than panicking.\
  \  Drop the\nthp_migration_supported() guard: it expands to\nIS_ENABLED(CONFIG_ARCH_SUPPORTS_PMD_SOFTLEAF),
  and both\npmd_is_migration_entry() and pmd_is_device_private_entry() already return\n\
  false when that config is not selected, so the guard suppresses only the\ncase where
  the warning would already be silent.\n\nPotential trigger: an HMM-based GPU driver
  races with madvise(MADV_FREE):\nmigrate_vma_pages() flip"
