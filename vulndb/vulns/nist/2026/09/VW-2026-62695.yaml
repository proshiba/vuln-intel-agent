title: "In the Linux kernel, the following vulnerability has been resolved:\n\nprintk:
  Fix possible console use-after-free\n\nWhen emitting a record via legacy printing,
  it is possible that a handover\nto another legacy printing context occurs. When
  a context has performed a\nhandover, the console SRCU read lock is released and
  the pointer to the\nconsole struct might now be invalid. Therefore, after calling\n\
  nbcon_legacy_emit_next_record() or console_emit_next_record(), it is\nnecessary
  to check if a handover occurred _before_ further @con usage.\n\nSashiko pointed
  out that console_flush_one_record() was not doing this.\n\nIn console_flush_one_record(),
  after emitting a record, move the further\nusage of @con after the handover check."
