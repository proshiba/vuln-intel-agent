title: A vulnerability was identified in GPAC up to f1219cde. The impacted 
  element is the function gf_sg_mfurl_del of the file scenegraph/vrml_tools.c of
  the component MP4Box. The manipulation leads to null pointer dereference. 
  Local access is required to approach this attack. The exploit is publicly 
  available and might be used. This product adopts a rolling release strategy to
  maintain continuous delivery. Therefore, version details for affected or 
  updated releases cannot be specified. Upgrading to version abi-16.23 is 
  sufficient to resolve this issue. The identifier of the patch is 
  49dee5cad329cfed310c1682703df7daa47df31a. It is recommended to upgrade the 
  affected component.
