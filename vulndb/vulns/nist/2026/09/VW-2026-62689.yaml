title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  lg-laptop: Fix LED resource handling\n\nThe event notification callback might access
  kbd_backlight even\nwhen it was not successfully registered with the LED subsystem.\n\
  The same happens inside acpi_remove(), where the LED devices are\nunregistered unconditionally.\n\
  \nFix this by tracking the availability of the kbd_backlight LED\ndevice and use
  devm_led_classdev_register() to let devres take\ncare of unregistering the LED devices
  during removal. For this\nthe parent device of the LED devices is changed to the
  native\nplatform device."
