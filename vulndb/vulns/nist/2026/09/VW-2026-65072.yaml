title: "A server-side request forgery flaw was found in the Ansible Automation Platform\n\
  automation-controller email notification backend. The email backend passes the user-supplied
  SMTP\nhost and port from a notification template directly to the SMTP client without
  validating that\nthe target is not an internal, loopback, link-local, or reserved
  address. An authenticated user\nwith organization notification-admin permission
  can create or modify an email notification\ntemplate pointing at an arbitrary internal
  address, trigger a test, and have the controller task\nprocess open a raw TCP connection
  to that address. The resulting connection error is reflected\nback through the notification
  record, providing a three-state internal port-scan oracle (open,\nclosed, filtered)
  over the control-plane's cluster network, including the in-cluster Kubernetes\n\
