title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  hwsim: serialize pib updates to fix double-free\n\nhwsim_update_pib() does an unserialized
  read-swap-free of phy->pib:\n\n\tpib_old = rtnl_dereference(phy->pib);\n\t...\n\t
  rcu_assign_pointer(phy->pib, pib);\n\tkfree_rcu(pib_old, rcu);\n\nIt assumes the
  RTNL is held, but ->set_channel is not always called\nunder it: the mac802154 scan
  worker changes channels via\ndrv_set_channel() without the RTNL. Such an update
  can race an\nRTNL-held one on the same phy; both read the same pib_old and both\n\
  kfree_rcu() it, double-freeing the object. With SLUB percpu sheaves\nbatching kfree_rcu(),
  this surfaces as a KASAN invalid-free in\nrcu_free_sheaf().\n\nstruct hwsim_phy
  has no lock for pib. Add one and make the swap atomic\nwith rcu_replace_pointer()
  under it, dropping the misleading\nrtnl_dereference()."
