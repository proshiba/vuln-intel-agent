title: Dasel is a command-line tool and library for querying, modifying, and 
  transforming data structures. From 3.0.0 until 3.11.1, 
  parsing/json/json_reader.go decodeValue, decodeObject, and decodeArray, and 
  parsing/xml/reader.go parseElement, recurse once per input nesting level 
  without a depth guard. Deeply nested attacker-controlled JSON or XML supplied 
  through parsing.Format(...).NewReader(...).Read(data), the command-line 
  interface, or the parse selector function can exhaust the Go goroutine stack 
  and raise an unrecoverable fatal error that terminates the entire process. The
  XML input-size limit does not prevent depth exhaustion, and defer or recover 
  cannot intercept the failure. This issue is fixed in version 3.11.1.
