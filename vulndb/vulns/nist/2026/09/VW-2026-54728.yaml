title: A weakness has been identified in projeto-siga siga up to 11.1.1. 
  Affected by this issue is the function DownloadExterno.getUrl of the file 
  sigaex/src/main/java/br/gov/jfrj/siga/vraptor/ExUtilController.java of the 
  component HTML-to-PDF Endpoint. This manipulation of the argument html causes 
  server-side request forgery. The attack may be initiated remotely. The exploit
  has been made available to the public and could be used for attacks. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
