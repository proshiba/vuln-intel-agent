title: A flaw was found in the SAML Redirect Binding implementation of Keycloak,
  an open-source identity and access management solution. The issue occurs 
  because the custom DEFLATE compression and decompression helpers fail to 
  release native zlib memory after use. An unauthenticated attacker can exploit 
  this by sending repeated malformed SAML requests, leading to native memory 
  exhaustion and a denial of service.
