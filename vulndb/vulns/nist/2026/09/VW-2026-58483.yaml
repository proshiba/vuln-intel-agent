title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  check nfsd4_acl_to_attr() return value in nfsd4_create()\n\nnfsd4_create() stores
  the return value of nfsd4_acl_to_attr() in\nstatus, but the switch(create->cr_type)
  block unconditionally\noverwrites it in every branch. ACL translation errors are
  silently\ndiscarded, and the CREATE proceeds without the requested ACL.\n\nAdd an
  early exit check after nfsd4_acl_to_attr(), matching the\npattern already used in
  nfsd4_setattr().\n\n[ cel: prefer NFS4ERR_BADTYPE over NFS4ERR_ATTRNOTSUPP ]"
