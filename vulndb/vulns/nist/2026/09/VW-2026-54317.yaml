title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  cap LZMA stream pool size\n\nfs/erofs/decompressor_lzma.c sizes the module-global
  MicroLZMA stream\npool from num_possible_cpus() when the lzma_streams module parameter
  is\nunset, then z_erofs_load_lzma_config() preallocates one image-supplied\ndictionary
  per stream, accepting dictionaries up to 8 MiB.  On high-CPU\nsystems, a small EROFS
  image can pin hundreds of MiB of vmalloc-backed\ndecoder state until the erofs module
  is unloaded.\n\nImpact: An EROFS image mounted by the system can pin up to 8 MiB
  of\nvmalloc memory per LZMA stream, either as intended or unexpectedly.\n\nBound
  the default stream count by a new\nCONFIG_EROFS_FS_ZIP_LZMA_DEFAULT_MAX_STREAMS
  option, default 16, so the\nworst-case default preallocation is 128 MiB if the number
  of CPUs is no\nless than 16 while preserving the existing per-image dictionary limit.\n\
  An explicit lzma_streams module parameter is still honoured as-is, so\nadministrators
