title: An improper access control vulnerability exists in x-ui 0.3.2. Any 
  authenticated panel user can modify the xray configuration template through 
  the settings interface and trigger a panel restart, causing the xray 
  management gRPC service, which is bound to loopback by default, to be 
  regenerated and bound to non-loopback addresses. This expands the reachable 
  surface of the management interface beyond its intended local-only boundary.
