title: "In the Linux kernel, the following vulnerability has been resolved:\n\nOPP:
  Fix cleanup ordering\n\nCommit 173e02d67494 (\"OPP: Initialize scope-based pointers
  inline\")\nadded initialization for all pointers. In some cases, the ordering was\n\
  changed so that *opp_table was initialized after *opp. This also changes\nthe order
  of the registered cleanup functions.\n\nWhen the cleanup happens, this can cause
  use-after-free errors when the\nlast reference is released and the release function
  _opp_kref_release\ntries to access the already freed opp->opp_table.\n\nInitialize
  *opp_table before *opp again to fix this and ensure the\ncorrect cleanup order."
