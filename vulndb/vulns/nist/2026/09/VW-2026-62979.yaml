title: The RT Mega Menu – Mega Menu Builder for Elementor & Gutenberg plugin for
  WordPress is vulnerable to Stored Cross-Site Scripting via 'pointer_menu_item'
  Block Attribute in all versions up to, and including, 1.5.2 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for authenticated attackers, with contributor-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The payload bypasses wp_kses_post filtering applied
  to post content on save because it contains no HTML tags and survives intact 
  inside the block comment's JSON attributes, reaching the walker unescaped at 
  render time.
