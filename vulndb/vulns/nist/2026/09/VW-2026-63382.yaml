title: CordysCRM is an open source AI-powered customer relationship management 
  system that supports private deployment. In version 1.7.3, 
  ApprovalResourceService.sendWebHook reads WebHookConfig.webHookUrl from stored
  approval-node configuration and passes it through 
  ApprovalFlowService.updateApprovalPostField to HttpClientUtils without the 
  SSRF validation used by the optional testConnect path. A user with 
  PROCESS_SETTING_ADD can configure an internal URL through POST 
  /approval-flow/add and cause the server to request it when POST 
  /approval-action/approve executes the approval action, enabling cloud metadata
  access, internal network reconnaissance, and interaction with reachable 
  internal services. This issue is fixed in version 1.7.4.
