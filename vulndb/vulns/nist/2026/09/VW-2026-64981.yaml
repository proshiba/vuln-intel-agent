title: "A flaw was found in Red Hat Ansible Automation Platform's automation-\ncontroller.
  The Project scm_url field is not validated against values that\nbegin with a dash
  and is stored and passed verbatim to the git SCM module.\nBecause the module runs
  git ls-remote with the URL as a positional argument and\nwithout a \"--\" separator,
  a git project URL such as \"--upload-pack=<command>:x\"\nis interpreted by git as
  the --upload-pack option and executed via a shell. A\nuser with permission to create
  or modify a project in a single organization can\nthereby execute arbitrary commands
  on the control-plane task pod, with output\nreflected through the project update
  stdout endpoint, leading to cross-tenant\ncompromise and in-cluster lateral movement"
