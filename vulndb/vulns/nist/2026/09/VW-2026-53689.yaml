title: "A vulnerability in MISP's event template handling allowed an authenticated
  user with permission to create or modify event templates to bypass validation of
  the template definition field.\n\nThe EventTemplate::beforeValidate() method only
  performed semantic validation when the supplied definition was already represented
  as an array. If a caller instead supplied a pre-encoded string, including malformed
  JSON or JSON representing an unexpected data type, the value bypassed validateDefinition()
  and only needed to satisfy the generic notBlank validation rule. As a result, an
  invalid event template definition could be stored persistently in the database.\n\
  \nWhen event templates were subsequently retrieved, EventTemplate::afterFind() attempted
  to decode the stored definition using JsonTool::decode() without handling decoding
  failures. A definition containing invalid JSON could therefore trigger an exception
  during retrieval. Because the event template index is available to all authenticated
  users"
