title: "In the current development version of Eclipse aeriOS, for which no official
  release has yet been published, the Identity Manager (IdM) deployment included insecure
  default configurations and credentials for security-sensitive services.\n\n\n\n\n\
  The Helm chart exposed the Keycloak service and its PostgreSQL backing database
  through Kubernetes NodePort services by default, while the Docker Compose deployment
  similarly exposed PostgreSQL on all network interfaces. The deployment included
  fixed default credentials for the Keycloak administrator and PostgreSQL database
  user, and the previous Helm chart configuration did not provide adequate secret
  management for these credentials. In addition, predefined application users with
  known credentials were provided for development and testing without sufficiently
  warning operators against their use in production environments.\n\n\n\n\nAn attacker
