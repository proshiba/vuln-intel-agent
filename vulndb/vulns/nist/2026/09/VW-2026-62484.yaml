title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: avoid nss underflow in mt7915_mcu_get_sta_nss\n\nIf a peer's VHT/HE
  MCS map has no supported spatial stream (all fields\n0x3), the loop exits with nss
  == 0 and the function returned (u8)-1 (255),\nwhich was then written into the firmware
  sta_rec_bf beamforming fields.\nClamp the result to 0."
