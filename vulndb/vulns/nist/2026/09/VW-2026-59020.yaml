title: "Insertion of sensitive information into log file vulnerability in Apache Syncope.\n\
  \n\n\nWhen AES key of non-standard length (not 16/24/32 bytes) is configured, Syncope
  will pad the provided value with random characters. The resulting key value is logged.\n\
  \n\n\nThis issue affects Apache Syncope: from 3.0.15 through 3.0.16, from 4.0.3
  through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\n\n\nUsers are recommended to upgrade
  to version 4.0.8 / 4.1.3, which fix this issue."
