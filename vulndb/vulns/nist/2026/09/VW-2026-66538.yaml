title: OpenClaw (npm package 'openclaw') before 2026.8.1 contains an 
  access-control bypass in the Microsoft Teams integration. When groupPolicy is 
  set to allowlist, a missing or unsupported configured access group produces a 
  denied group-resolution result that is not rejected by the final 
  message-admission check, so a Teams member who is not on the allowlist can 
  still trigger the configured agent despite the administrator's group boundary.
  The impact depends on the conversations, tools, and data available to that 
  agent. The issue is fixed in version 2026.8.1.
