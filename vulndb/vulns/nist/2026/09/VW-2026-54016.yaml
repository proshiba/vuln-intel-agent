title: OpenPanel before 2.3.0 contains a cross-tenant broken object level 
  authorization vulnerability in the report.getLayouts and report.resetLayout 
  tRPC procedures that fail to scope dashboard queries to the caller's project. 
  Authenticated attackers can supply their own projectId with a victim 
  organization's guessable dashboardId to read confidential report definitions 
  or permanently delete dashboard layouts across tenant boundaries.
