title: A flaw has been found in OpenClaw up to 2026.9.5. Affected is the 
  function createCanvasHostHandler of the file 
  extensions/canvas/src/host/server.ts of the component Canvas Host Route. 
  Executing a manipulation can lead to denial of service. The attack can be 
  launched remotely. The exploit has been published and may be used. Fix 
  suggestion's "streaming/size-limit" was never shipped - latest 2026.9.5 still 
  buffers the whole file via readFile() (src/canvas/serve.runtime.ts:17,114), 
  unlike the sibling WS path which caps at 64KB. The vendor was contacted early 
  about this disclosure.
