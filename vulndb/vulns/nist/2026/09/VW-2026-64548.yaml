title: SIPGO is a library for writing SIP services in the GO language. Prior to 
  1.4.3, WSConnection.Read in sip/transport_ws.go creates a wsutil.Reader 
  without setting MaxFrameSize, allowing NextFrame to accept a client-controlled
  header.Length before ParseMaxMessageLength is applied. An unauthenticated WS 
  or WSS peer can send a frame header declaring an extremely large payload, 
  causing an oversized allocation or a makeslice length panic before the payload
  is read and crashing or exhausting memory in the server process. This issue is
  fixed in version 1.4.3.
