title: vikunja before 2.6.0 fails to validate team access when attaching teams 
  to projects, allowing authenticated users to enumerate all teams and members. 
  Attackers can attach arbitrary team IDs via the project teams endpoint to 
  retrieve complete team rosters including member names and admin flags for 
  unauthorized teams.
