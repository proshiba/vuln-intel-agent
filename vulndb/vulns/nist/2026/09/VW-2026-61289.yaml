title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  pressure: dps310: fix NULL pointer dereference on ACPI probe\n\nWhen the device
  is enumerated through its ACPI HID (IFX3100),\ni2c_client_get_device_id() returns
  NULL: the ACPI-derived client name\ndoes not match the driver's i2c_device_id table.
  dps310_probe() then\ndereferences that NULL pointer in \"iio->name = id->name\"\
  \ and crashes the\nkernel during probe.\n\nThe IIO device name is always \"dps310\"\
  , so set it directly and drop the\nnow-unused device-id lookup."
