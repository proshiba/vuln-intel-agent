title: The MemberDash plugin for WordPress is vulnerable to Insecure Direct 
  Object Reference in all versions up to, and including, 1.8.5 via the 'id' 
  parameter due to missing validation on a user controlled key. This makes it 
  possible for unauthenticated attackers to change the password of any WordPress
  user, including administrators, by supplying an arbitrary user ID during 
  registration, and take over their account without any notification sent to the
  victim.
