title: A vulnerability was identified in mahonelau kykms up to 
  8f130c2d85842d5b44caae78cc46d65e505949f7. The impacted element is the function
  QueryGenerator.doMultiFieldsOrder of the file QueryGenerator.java of the 
  component SqlInjectionUtil. The manipulation of the argument column leads to 
  sql injection. Remote exploitation of the attack is possible. The exploit is 
  publicly available and might be used. This product follows a rolling release 
  approach for continuous delivery, so version details for affected or updated 
  releases are not provided. The vendor was contacted early about this 
  disclosure but did not respond in any way.
