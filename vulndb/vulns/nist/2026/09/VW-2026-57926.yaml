title: A cross-namespace authorization flaw in multicluster-observability-addon 
  allows a user with permission to modify a managed cluster’s 
  ManagedClusterAddOn configuration to reference ClusterLogForwarder or 
  OpenTelemetryCollector resources outside the permitted namespace. If those 
  resources reference Secrets, the add-on may copy the referenced Secrets to the
  attacker-controlled managed cluster.
