title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/intel/uncore:
  Fix uncore_box ref/unref ordering\n\nIn uncore_event_cpu_online(), uncore_box_ref()
  was called before\nuncore_change_context().  uncore_box_ref() gates on box->cpu
  >= 0,\nbut box->cpu is still -1 at that point because uncore_change_context()\n\
  has not run yet.  As a result, the box is never initialized on the\nfirst CPU to
  come online in a die, leaving it permanently\nuninitialized in the single-CPU-per-die
  case.\n\nThus, box->refcnt is one count below the true value, and in the CPU\noffline
  path, the box will be torn down on the second-to-last CPU.\n\nIn uncore_event_cpu_offline(),
  uncore_box_unref() was called after\nuncore_change_context(), so box->cpu is already
  -1 when the collector\nCPU goes offline, which prevents it from tearing down the
  box.\n\nFix by swapping the call order in both paths so that\nuncore_box_{ref,unref}()
  runs at the point where box->cpu reflects\nthe correct context.\n\nMove allocate_boxes"
