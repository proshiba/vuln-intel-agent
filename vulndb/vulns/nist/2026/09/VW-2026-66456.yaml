title: Esri LERC is an open-source image or raster format which supports rapid 
  encoding and decoding for any pixel type. A Heap based Out-of-Bounds Write via
  Integer Overflow in LERC versions 4.1.0 and earlier may allow a remote, 
  unauthenticated attacker who can pass specifically crafted attacker controlled
  imagery to an application that uses LERC to crash the application, leading to 
  a denial of service.
