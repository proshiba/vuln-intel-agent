title: Concrete CMS below 9.5.4 did not validate the user timezone value 
  (uTimezone) on write and rendered it without output encoding on the Dashboard 
  user management page, where Date::getTimezoneDisplayName() returns any 
  non-IANA value unchanged. A stored cross-site scripting payload saved in this 
  field executed in an administrator's browser when they viewed the affected 
  user in the Dashboard, running script in the admin session (for example to 
  read CSRF tokens, create administrator accounts, or change site settings). In 
  Concrete CMS 9.5.3 the field became reachable by unauthenticated visitors 
  through public registration; in Concrete CMS below 9.5.3,  the same field was 
  reachable by any authenticated user through the account profile editor. 
  Exploitation required concrete.misc.user_timezones to be enabled (off by 
  default), and the unauthenticated path additionally required public 
  registration to be enabled. The Concrete CMS security team gave this 
