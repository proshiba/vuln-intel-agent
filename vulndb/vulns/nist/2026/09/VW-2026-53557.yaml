title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  remove CAP_SYS_RAWIO zero-padding in dev_validate_header\n\ndev_validate_header()
  reads dev->hard_header_len directly when\nzero-padding short link layer headers
  for CAP_SYS_RAWIO holders:\n\n    if (capable(CAP_SYS_RAWIO)) {\n        memset(ll_header
  + len, 0, dev->hard_header_len - len);\n        return true;\n    }\n\nPacket send
  paths call dev_validate_header() on skbs whose headroom was\nallocated from an earlier
  hard_header_len read. If the device is\nreconfigured so that dev->hard_header_len
  increases before validation,\nthe memset writes past the reserved buffer, an out-of-bounds
  write.\n\nThis out-of-bounds write is masked in some SOCK_RAW paths today because\n\
  the same concurrent increase can first make skb_push() exceed the\nreserved headroom
  and trigger skb_under_panic(). Remove the zero-padding\nbranch before making those
  hard_header_len reads consistent, so the\nsnapshot fixes do not turn a loud panic
  into a silent ove"
