title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal/drivers/rcar:
  Fix error checking in probe()\n\nThis code accidentally calls thermal_zone_device_enable()
  before checking\nwhether thermal_zone_device_register_with_trips() failed.  Move
  the call\nuntil later to avoid an error pointer dereference of \"priv->zone\".\n\
  \nThe driver works differently depending on if we are using OF thermal or\nnot.\
  \  We use thermal_add_hwmon_sysfs() if we are using OF thermal and\ncall thermal_zone_device_enable()
  if not.  We can share same error check\nfor if either of these fail.\n\nMoving the
  thermal_zone_device_enable() call is a bit cleaner as well.\nThe original code used
  a three step process to cleanup:\n1. Call thermal_zone_device_unregister() to cleanup.\n\
  2. Set priv->zone to an error pointer to preserve the error code.\n3. Set priv->zone
  to NULL to avoid a second call to\n   thermal_zone_device_unregister() in the rcar_thermal_remove()\n\
  \   function.\n\nNow we can just do a direct goto error_un"
