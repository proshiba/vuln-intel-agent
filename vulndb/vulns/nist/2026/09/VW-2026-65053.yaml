title: RabbitMQ is a messaging and streaming broker. Prior to versions 3.13.15, 
  4.0.20, 4.1.11, and 4.2.6, parse_array_primitive/2 for constructor 0x45 
  (list0) returns an element with byte-width B = 0. The enclosing array32 parser
  at line 148 reads a 4-byte Count from the wire and loops Count times consuming
  B bytes each , with B = 0, no input is consumed and the loop builds a list of 
  Count empty elements bounded only by the 32-bit field. The SASL-mechanisms / 
  SASL-init frame is parsed by amqp10_framing:decode_bin/1 from 
  rabbit_amqp_reader.erl:412 before authentication completes. The pre-auth 
  incoming_max_frame_size (default 8192 bytes) caps the frame, not the Count 
  field, so a 19-byte payload with Count = 0xFFFFFFFF is accepted. No 
  max_heap_size is set on the reader process. An unauthenticated network 
  attacker can crash any RabbitMQ node that has the AMQP 1.0 listener enabled 
