title: "In the Linux kernel, the following vulnerability has been resolved:\n\nforcedeth:
  fix off-by-one when saving/restoring non-PCI config space\n\nnv_suspend() and nv_resume()
  walk the non-PCI configuration space with\n\n\tfor (i = 0; i <= np->register_size/sizeof(u32);
  i++)\n\nwhich runs one iteration too many. saved_config_space is declared as\n\n\
  \tu32 saved_config_space[NV_PCI_REGSZ_MAX/4];\n\nand NV_PCI_REGSZ_VER3 is equal
  to NV_PCI_REGSZ_MAX (0x604), so on a VER3\ndevice register_size/sizeof(u32) is exactly
  the array length and the last\niteration addresses one element past the end.\n\n\
  The element it lands on is np->name_rx[0..3]: saved_config_space[] is\nfollowed
  immediately by char name_rx[IFNAMSIZ + 3], and char needs no\npadding. Nothing observable
  is corrupted by that, because nv_request_irq()\nrewrites name_rx with sprintf()
  before it is ever passed to request_irq().\nThe bug is the out-of-bounds access
  itself, which UBSAN reports and which\nCONFIG_UBSAN_TRAP=y turns into a trap that
  aborts the runnin"
