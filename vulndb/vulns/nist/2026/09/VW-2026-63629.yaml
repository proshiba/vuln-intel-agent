title: openEQUELLA versions before 2026.1.0 contain a remote code execution 
  vulnerability in FreeMarker template compilation due to an unsandboxed 
  TemplateClassResolver configuration. Authenticated attackers can inject 
  malicious template expressions through collection summaries, dashboard 
  portlets, or MIME templates to instantiate dangerous classes like 
  freemarker.template.utility.Execute and invoke Runtime.exec for arbitrary 
  command execution.
