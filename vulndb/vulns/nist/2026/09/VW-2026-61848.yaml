  vulnerability in the WebFetchTool component where the _validate_url() function
  fails to block internal IP ranges and private addresses. Attackers can send 
  messages instructing the bot to fetch cloud metadata endpoints, localhost 
  services, and RFC 1918 addresses to extract IAM credentials and internal 
  service data.
