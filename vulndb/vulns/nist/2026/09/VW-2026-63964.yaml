title: HomeBox is a home inventory and organization system. Prior to 0.26.0, 
  MaintenanceEntryRepository.Update and MaintenanceEntryRepository.Delete in 
  backend/internal/data/repo/repo_maintenance_entry.go use UpdateOneID(id) and 
  DeleteOneID(id) without verifying that the maintenance entry belongs to the 
  authenticated user's active group. An authenticated low-privileged user who 
  knows or enumerates another tenant's maintenance-entry UUID can overwrite that
  record or permanently delete it. This issue is fixed in version 0.26.0.
