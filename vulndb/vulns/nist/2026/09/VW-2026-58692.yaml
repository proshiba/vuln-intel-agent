title: A flaw has been found in IOBit Uninstaller 15.5.0.11. Affected by this 
  issue is the function sub_11838 of the file IURegistryFilter.sys of the 
  component IOCTL Dispatch Handler. This manipulation causes null pointer 
  dereference. The attack requires local access. The exploit has been published 
  and may be used. Identical IURegistryFilter.sys ships across multiple IObit 
  families. The vendor was contacted early about this disclosure but did not 
  respond in any way.
