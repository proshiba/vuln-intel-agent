title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  KVM: Validate MSI data before routing it to EIOINTC\n\npch_msi_set_irq() passes
  e->msi.data straight into eiointc_set_irq() as\nthe irq number. The MSI data comes
  from userspace, that either via a\nKVM_IRQ_ROUTING_MSI entry set with KVM_SET_GSI_ROUTING
  (used by irqfd\nand KVM_IRQ_LINE) or directly via KVM_SIGNAL_MSI, and is never checked\n\
  against EIOINTC_IRQS.\n\neiointc_set_irq() uses the value with __set_bit()/__clear_bit()
  on the\n256-bit isr bitmap, eiointc_update_irq() then indexes sw_coremap[] and\n\
  the per-cpu coreisr/sw_coreisr bitmaps with it. Therefore a data value\n>= 256 reads
  and writes memory past the end of those arrays, i.e. any\nprocess holding a VM fd
  can corrupt kernel memory beyond the allocation\nof loongarch_eiointc.\n\nReject
  MSI data that doesn't fit in the EIOINTC irq space. The DMSINTC\npath is unaffected
  as it decodes the vector from the address and masks\nit."
