title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: validate default EEPROM firmware size\n\nThe default EEPROM firmware
  is parsed and copied as a full EEPROM\nwithout checking its length. A truncated
  file can make the driver\nread beyond the firmware buffer during variant validation
  or the\nfallback copy.\n\nReject files shorter than MT7996_EEPROM_SIZE before parsing
  or\ncopying the firmware."
