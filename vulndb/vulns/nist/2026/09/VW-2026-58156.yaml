title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  fix use-after-free and invalid seg operations in kset_replay()\n\nIn kset_replay,
  when key->seg_gen is stale (key->seg_gen <\nkey->cache_pos.cache_seg->gen), cache_key_put(key)
  is called but then\nkey->cache_pos.cache_seg is accessed as the argument to cache_seg_get().\n\
  This is a use-after-free on the freed key memory. Although mempool\nrecycled memory
  is not immediately reclaimed or overwritten in practice,\nthis is still a potential
  UAF bug.\n\nAdditionally, for expired invalid keys, setting the cache->seg_map bit\n\
  and calling cache_seg_get() is unreasonable since the corresponding\nsegment data
  is no longer valid.\n\nFix both issues by moving cache_seg_get() and __set_bit()
  after the\ngen check, so they only execute for valid keys, and using continue to\n\
  skip invalid keys."
