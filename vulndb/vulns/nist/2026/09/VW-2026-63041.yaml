title: The FileBird – WordPress Media Library Folders & File Manager plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via image alt text in 
  all versions up to, and including, 6.5.6 due to insufficient input 
  sanitization and output escaping. This makes it possible for authenticated 
  attackers, with Author-level access and above, to inject arbitrary web scripts
  in pages that will execute whenever a user accesses an injected page.
