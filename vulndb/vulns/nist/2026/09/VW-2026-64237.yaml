title: "In MISP, the CollectionsController add() method enforced the sharing-group
  usability authorization check and element capture only when the HTTP request method
  was POST. However, the underlying CRUDComponent::add() method persists data on both
  POST and PUT requests. As a result, an authenticated user could issue a PUT request
  to the collections/add endpoint, bypassing the sharing-group authorization check
  entirely. This allowed the creation of a collection with distribution=4 (shared
  with a specific sharing group) targeting a sharing group that the user was not authorized
  to use. The bypassed check would normally verify that the current user has access
  to the specified sharing group before allowing the collection to be associated with
  it.\n\nThe security impact is that an authenticated user can place collection data
