title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  serial: option: fix slab OOB read in interrupt URB callback\n\nThe interrupt URB
  buffer is allocated in setup_port_interrupt_in() based\non the endpoint's wMaxPacketSize:\n\
  \n    buffer_size = usb_endpoint_maxp(epd);\n    port->interrupt_in_buffer = kmalloc(buffer_size,
  GFP_KERNEL);\n\nWhen a USB device declares wMaxPacketSize = 8 on its interrupt IN\n\
  endpoint, the buffer is allocated from kmalloc-8 cache (exactly\n8 bytes).\n\nIf
  the device sends a short packet (actual_length < wMaxPacketSize),\nthe URB completes
  with status == 0 and the callback proceeds to read:\n\n    data[sizeof(struct usb_ctrlrequest)]\n\
  \nwhich evaluates to data[8], accessing 1 byte beyond the allocated 8-byte\nbuffer.
  This results in a slab out-of-bounds read.\n\nFix this by adding the missing bounds
  check: first verify that the\nactual length is large enough to contain the struct
  usb_ctrlrequest\nheader before accessing req_pkt->bRequestType and req_pkt->bReque"
