title: Apache NiFi 2.9.0 through 2.11.0 provide Connector configuration update 
  and verification REST API methods that do not enforce authorization checking 
  on Assets and Secrets referenced in proposed configuration. Updating or 
  verifying a Connector configuration step can apply Asset and Secret 
  references, but framework authorization was limited to write privileges on the
  Connector itself. As a result of the missing authorization, an authenticated 
  user authorized to modify a Connector, but not authorized to read a referenced
  Parameter Provider, could apply Secret values backed by that Parameter 
  Provider. The same methods also accepted Asset identifiers without verifying 
  that the Asset belonged to the Connector being configured. Apache NiFi 
  installations that do not implement different levels of authorization across 
  Connectors and Parameter Providers are not subject to this vulnerability, 
  because the framework enforces write permissions on the Connector as the 
  security boundary. Upgrading to A
