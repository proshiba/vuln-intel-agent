title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Clean up channels on setup failure\n\nscmi_channels_setup() can fail after
  the common BASE channel or earlier\nprotocol channels have already been registered
  in the TX/RX IDRs.\n\nRoute this failure through the existing channel cleanup label
  so the\ntransport channels, transport devices and IDR state created before the\n\
  failure are released before the probe error path frees the SCMI instance\nID."
