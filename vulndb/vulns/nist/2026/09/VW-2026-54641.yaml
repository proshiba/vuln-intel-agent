title: A vulnerability was determined in Mstfakts College-Management-System. 
  Impacted is an unknown function of the file Front-end/login.php. This 
  manipulation of the argument email causes improper authentication. It is 
  possible to initiate the attack remotely. The exploit has been publicly 
  disclosed and may be utilized. This product is using a rolling release to 
  provide continious delivery. Therefore, no version details for affected nor 
  updated releases are available. The project was informed of the problem early 
  through an issue report but has not responded yet.
