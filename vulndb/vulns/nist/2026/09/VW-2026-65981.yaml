title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel:
  ethosu: Ensure SRAM region size matches job\n\nIt is possible for userspace to set
  the job SRAM size to 0, but then still\nhave SRAM accesses in the command stream.
  When the job SRAM size is 0,\nsetting the region base register is skipped and a
  stale base address from\na prior job is used.\n\nCheck the region size against the
  job's SRAM size instead of just the size\nof the SRAM. The job's SRAM size was already
  checked against the total SRAM\nsize."
