title: "Incorrect Authorization vulnerability in Apache Syncope.\n\n\n\nAny search
  requests are transformed into SQL, Neo4J or Elasticsearch / Opensearch queries,
  depending on the actual deployment configuration.\nAn important component of such
  transformation is the Realms filter, which ensures that the search results are matching
  the requester's permissions.\nFor non-recursive search requests it is possible that
  such Realms filter is rendered as empty, thus voiding any restriction on requester
  privileges.\n\n\n\n\n\nThis issue affects Apache Syncope: from 3.0.0-M0 through
  3.0.16, from 4.0.0-M0 Through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\n\nUsers are
  recommended to upgrade to version 4.0.8 / 4.1.3, which fix this issue."
