title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Reject Write/Reply chunks with segcount 0\n\nA peer can send a Write or Reply chunk
  whose segcount field is zero.\nxdr_check_write_chunk() only rejects segcount > rc_maxpages,
  so zero\npasses the range check, and xdr_inline_decode(stream, 0) returns the\n\
  current (non-NULL) cursor without advancing. The function returns\ntrue and pcl_alloc_write()
  then links a struct svc_rdma_chunk with\nch_segcount == 0 onto rc_write_pcl or rc_reply_pcl.\n\
  \nAn earlier patch in this series made pcl_for_each_segment() safe for\nch_segcount
  == 0, so this no longer drives the memory walk it used\nto. Rejecting the malformed
  frame at the decode boundary is still\nworthwhile as defense in depth: it keeps
  degenerate zero-segment\nchunks off the parsed chunk lists entirely, so any future
  consumer\nthat walks ch_segments directly cannot observe one, and it makes the\n\
  zero-floor easy to backport to trees where the macro change is more\nintrusive.
  RFC "
