title: "An Improper Authentication vulnerability in the Apache Doris Frontend (FE)
  meta service allows an unauthenticated remote attacker to access internal metadata
  service endpoints.\n\n\n\nThe affected endpoints relied on client-supplied node
  information for authentication without providing sufficient authentication of the
  requesting party. Under certain network configurations, a remote attacker may be
  able to bypass the intended access control and access internal FE metadata interfaces,
  potentially exposing sensitive cluster information.\n\n\n\nThis issue affects Apache
  Doris: from 2.0.0 through 2.0.*, from 2.1.0 through 2.1.*, from 3.0.0 through 3.0.*,
  from 3.1.0 through 3.1.*, from 4.0.0 before 4.0.8, and from 4.1.0 before 4.1.4.
  Versions 1.2.x and earlier are not affected by this header-trust vulnerability.\n\
  \n\n\n\nUsers are recommended to upgrade to a fixed release (4.0.8 or 4.1.4), which
  fixes the issue."
