title: A vulnerability was identified in ChangeWeDer crm up to 
  c07bd4c97141521af6475034bc58523beed51bbd. This vulnerability affects the 
  function top.upstudy.crm.utils.LoginUserUtil.releaseUserIdFromCookie. The 
  manipulation leads to improper authentication. The attack can be initiated 
  remotely. Continious delivery with rolling releases is used by this product. 
  Therefore, no version details of affected nor updated releases are available. 
  The project was informed of the problem early through an issue report but has 
  not responded yet.
