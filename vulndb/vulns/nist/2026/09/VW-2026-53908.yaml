title: A weakness has been identified in Dolibarr up to 21.0.4/22.0.5/23.0.3. 
  Affected by this issue is some unknown functionality of the file 
  htdocs/core/filemanagerdol/connectors/php/config.inc.php of the component 
  Legacy File Manager. Executing a manipulation can lead to improper access 
  controls. The attack can be launched remotely. The exploit has been made 
  available to the public and could be used for attacks. Upgrading to version 
  23.0.4 can resolve this issue. This patch is called 
  ef6631e9bd5ec4b8cec0e88f1796d3d10dad02ec. It is suggested to upgrade the 
  affected component.
