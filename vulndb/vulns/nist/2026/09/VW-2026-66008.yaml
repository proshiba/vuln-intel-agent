title: "In the Linux kernel, the following vulnerability has been resolved:\n\nreboot:
  fix cad_pid use-after-free race\n\ncad_pid is a single kernel-wide struct pid pointer.
  proc_do_cad_pid()\nreads it and passes it to pid_vnr() without protecting the lifetime
  of\nthe referenced struct pid. A concurrent writer can replace cad_pid and\ndrop
  the final reference to the old struct pid after the reader has\nloaded the pointer
  but before pid_vnr() has finished dereferencing it,\ncausing a use-after-free.\n\
  \nkill_cad_pid() has the same lifetime race when it passes cad_pid to\nkill_pid().\n\
  \nAt the time this issue was reported, an unprivileged user could reach the\nsysctl
  through user and PID namespaces because cad_pid was registered in\npid_table[].
  Moving cad_pid back to the global reboot sysctl table\ncorrected that namespace
  and permission mismatch, but did not fix the\nunderlying lifetime race.\n\nFix this
  by treating cad_pid as an RCU-protected pointer at both read\nsites and by waiting
  for a grace period before dro"
