title: "The AIL Framework tag selector component (var/www/static/js/tags.js) is vulnerable
  to stored cross-site scripting (XSS). A user with the ability to create a custom
  tag could embed an HTML payload containing JavaScript event handlers (e.g., <img
  src=x onerror=alert(1)> or <svg onload=...>) in the tag name. When another authenticated
  user opened a page containing the tag selector, the malicious tag name was inserted
  into the DOM using jQuery's html property, causing the embedded script to execute
  in the victim's browser context.\n\nThe vulnerable code paths affected both the
  suggestion/combo-item rendering (_renderComboItems) and the selected-tag rendering
  logic. In both cases, the display value derived from the tag's displayField was
