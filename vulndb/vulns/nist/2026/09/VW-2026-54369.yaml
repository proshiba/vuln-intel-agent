title: 'nebula-mesh is a self-hosted control plane for Slack Nebula mesh VPN. From
  version 0.6.0 to before version 0.7.2, non-admin operators (role user) can set allow_private:
  true on their own managed webhook subscription (POST/PATCH /api/v1/webhook-subscriptions).
  No admin check exists on this field. At delivery time, allow_private switches the
  dispatcher to an unguarded HTTP client, bypassing the private/loopback/link-local
  SSRF guard — letting a low-privilege operator make the server request internal addresses.
  This issue has been patched in version 0.7.2.'
