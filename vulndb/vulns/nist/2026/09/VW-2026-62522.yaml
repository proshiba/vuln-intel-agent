title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  davinci: switch to managed controller allocation\n\nThe controller is allocated
  with the non-managed spi_alloc_host() while\nthe interrupt is registered with devm_request_threaded_irq().\
  \  During\nremoval, spi_bitbang_stop() only unregisters the controller; the\nsubsequent
  spi_controller_put() then frees the controller together with\nits embedded davinci_spi
  devdata, which is the IRQ handler's dev_id.\nThe devm_request_threaded_irq() release
  action (free_irq()), which\ndrains the handler, does not run until after .remove()
  returns.  A late\nor latched interrupt can therefore reach davinci_spi_irq() and\n\
  dereference already-freed memory.\n\nSwitch to devm_spi_alloc_host() so that the
  devres LIFO order releases\nthe controller only after free_irq() has drained the
  handler, and drop\nthe now-redundant spi_controller_put() from .remove().  The probe
  error\npath is simplified to direct returns.\n\nThe clock is acquired with devm_clk_ge"
