title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  mcast: use copy-on-write RCU updates in ip6_mc_source()\n\npmc->sflist is read locklessly
  under rcu_read_lock() by\ninet6_mc_check() during packet reception in the UDP and
  RAW\nmulticast receive paths.\n\nip6_mc_source() mutated psl->sl_addr and psl->sl_count
  in-place\nwhen adding or removing a source filter. Additionally, when expanding\n\
  the filter buffer, newpsl was published via rcu_assign_pointer()\nbefore writing
  the new source into the array.\n\nBecause 16-byte struct in6_addr writes are not
  atomic and array\nshifting is not synchronized with RCU readers, concurrent readers
  in\ninet6_mc_check() could read torn IPv6 addresses or observe\nduplicated/missed
  source entries.\n\nFix this by switching ip6_mc_source() to copy-on-write RCU updates:\n\
  allocate and fully populate newpsl before publishing it via\nrcu_assign_pointer(),
  and reclaim the old filter via kfree_rcu(),\nmatching ip6_mc_msfilter().\n\nAlso
  remove the now unused IP6"
