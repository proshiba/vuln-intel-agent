title: 'OpenClaw (npm package openclaw) before 2026.8.1 could include deterministic
  hashes computed over the original, unredacted configuration in redacted configuration
  responses. When the Gateway password had low entropy and the remaining configuration
  values were reconstructable, these hashes acted as offline password verifiers: a
  caller able to obtain the redacted configuration (for example via config.get) could
  test password candidates offline without going through the rate-limited Gateway
  authentication path. Recovering the password could grant the documented shared-secret
  operator authority. Secret references were not affected in the same way. The issue
  is fixed in 2026.8.1.'
