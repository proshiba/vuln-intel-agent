title: XenForo before 2.3.13 contains an unauthenticated information disclosure 
  vulnerability that allows unauthenticated attackers to retrieve private unfurl
  records by supplying predictable auto-increment primary key IDs to the unfurl 
  endpoint. Attackers can enumerate or predict result IDs and query the endpoint
  without any session, user, or visibility checks to obtain rendered preview 
  HTML, original URLs, and query strings from private conversations and other 
  restricted content.
