title: Snipe-IT versions before 8.7.0 contain a stored cross-site scripting 
  vulnerability in DepartmentPresenter::formattedNameLink() where department 
  names are rendered unescaped in the fallback branch for users without 
  departments.view permission. Users with departments.edit permission can inject
  malicious scripts into department names that execute in the browsers of all 
  department members when they load their My Assets page.
