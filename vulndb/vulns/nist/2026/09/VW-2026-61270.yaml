title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Sign-extend VA for range-based TLBI invalidation\n\nWhen the decode_range_tlbi()
  helper was moved to be used for S1 TLBIs,\nthe required sign extension was omitted.
  Add it.\n\nAs a result, special care must be taken to not overflow PA bits when\n\
  this is used for S2 invalidation."
