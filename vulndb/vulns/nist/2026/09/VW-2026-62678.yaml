title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  fix UAF when probe runs concurrent to dyn ID removal\n\nDynamic IDs are only guaranteed
  to be valid when usb_dynids_lock is held,\nas remove_id_store can free the node.
  Thus, make a copy in\nusb_probe_interface. Clarify the documentation that the id
  parameter is\nonly valid during the probe.\n\nUSB serial has the same pattern, but
  it does not need fixing as the IDs\ncannot be removed via sysfs."
