title: Tencent AI-Infra-Guard's skill-scan component excludes compiled Python 
  bytecode files from analysis by hardcoding __pycache__ directories and 
  .pyc/.pyo/.pyd extensions into skip lists across multiple scanning surfaces. 
  Attackers can distribute skills with benign Python source files alongside 
  malicious compiled bytecode that executes on import while the scanner reports 
  a safe verdict, enabling code execution when operators install the skill.
