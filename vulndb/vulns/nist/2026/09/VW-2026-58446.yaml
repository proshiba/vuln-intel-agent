title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  reject buckets with mismatched CRUSH ids\n\ncrush_decode() stores bucket data by
  array slot, and the mapper later\nderives the per-bucket workspace index from the
  decoded bucket id. A\nmalformed map can therefore make one bucket reuse another
  bucket's\nworkspace by encoding an id different from -1 - slot.\n\nFor uniform buckets,
  the second replica selection expands the source\nbucket's permutation into that
  aliased workspace buffer. If the source\nbucket is larger than the aliased bucket,
  the write runs past the smaller\npermutation array and can escape the kvmalloc'd
  CRUSH workspace. KASAN\nreports a slab OOB write of 4 bytes in bucket_perm_choose().\n\
  \nReject buckets whose encoded id does not match their array slot. Valid\nCRUSH
  maps already use the canonical negative id corresponding to the\nbucket slot, so
  this restores the invariant expected by\nwork->work[-1 - in->id] without changing
  valid map behavior."
