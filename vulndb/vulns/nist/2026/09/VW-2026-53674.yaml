title: "A flaw was found in Rancher Manager. When a non-administrative caller supplied
  a label selector naming a different user, the ext.cattle.io/v1 Token store dropped
  its internal owner filter instead of returning an empty result. Any authenticated
  user could therefore list and watch every other user's tokens, disclosing token
  metadata and the stored salted hash of the bearer token.\n\n\n\nThis issue affects
  Rancher: before 2.15.1."
