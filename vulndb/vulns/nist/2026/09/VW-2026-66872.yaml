title: vm2 before 3.12.2 does not apply host-side Promise rejection handling in 
  the sandbox-to-host construct trap. In BaseHandler, the apply trap calls 
  markHostPromiseHandled() on the returned value, but the adjacent construct 
  path returns the result of Reflect.construct without the same sanitization. If
  an embedder exposes a constructable host function whose constructor returns a 
  native rejected Promise, an untrusted script executed via VM.run can invoke it
  with `new` and ignore the result; the rejected host Promise crosses the bridge
  unhandled and, under Node's strict unhandled-rejection policy, is promoted to 
  an uncaught exception that terminates the host process.
