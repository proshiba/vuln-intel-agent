title: Concrete CMS versions 9.0.0 to 9.5.2 is vulnerable to Stored XSS in Board
  Custom Slot dialog. The custom_slot save_template endpoint authorizes the 
  request only against the target board instance (canEditBoardContents()) and 
  then persists the client-supplied selectedTemplateOption[collection] verbatim,
  rather than rebuilding the content object collection server-side and verifying
  that each item belongs to the authorized board's data pool. A user with 
  permission to edit the contents of at least one board instance can therefore 
  store a forged summary object whose description field carries a 
  JavaScript-bearing HTML payload. The default summary template renders the 
  description field without output encoding, so the payload executes in the 
  browser of any user who views the affected board slot, including anonymous 
  front-end visitors and dashboard users who preview the resulting rule or 
  block. This can enable session or action takeover and escalation toward an 
  administrator. Concrete CMS versio
