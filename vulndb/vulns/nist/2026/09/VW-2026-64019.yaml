title: Warpgate is an open source SSH, HTTPS and MySQL bastion host for Linux. 
  From 0.23.0 until 0.27.3, HTTP API token authentication resolves 
  ConfigProvider::validate_api_token into RequestAuthorization::UserToken 
  without enforcing the owning user's allowed_ip_ranges against the trusted 
  client address in warpgate-protocol-http/src/common.rs. An attacker holding a 
  leaked, phished, or exfiltrated X-Warpgate-Token can therefore use it from a 
  prohibited network location. Deployments without allowed_ip_ranges are 
  unaffected, and HTTP target proxying plus SSH, MySQL, PostgreSQL, RDP, VNC, 
  and Kubernetes paths do not accept this vulnerable HTTP token flow. This issue
  is fixed in version 0.27.3.
