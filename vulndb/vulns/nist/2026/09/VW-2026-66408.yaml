title: Zammad is a web based open source helpdesk/customer support system. In 
  7.0.3 and 7.1.1, under certain conditions, Zammad's verification of inbound 
  PGP-signed email can mark a message as carrying a valid ("Good") PGP signature
  from a registered sender key, even though the displayed message content is not
  actually covered by that signature. As a result, the inbound article may be 
  stored with a successful signature status that does not reflect the 
  authenticity of the shown content. This can mislead agents who rely on the 
  signature indicator when assessing the trustworthiness of incoming mail. This 
  issue is fixed in version 7.1.2.
