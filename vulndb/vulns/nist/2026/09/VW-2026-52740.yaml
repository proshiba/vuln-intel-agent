title: "Multiple Cisco products are affected by a vulnerability in the Snort 3 Detection
  Engine that could allow an unauthenticated, remote attacker to cause the Snort 3
  Detection Engine to restart, resulting in an interruption of packet inspection.\r\
  \n\r This vulnerability is due to incomplete parsing of the SSL handshake ingress
  packets. An attacker could exploit this vulnerability by sending crafted SSL handshake
  packets. A successful exploit could allow the attacker to cause a denial of service
  (DoS) condition when the Snort 3 Detection Engine restarts unexpectedly."
