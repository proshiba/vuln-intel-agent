title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: midi2: remove default configfs groups on teardown\n\nf_midi2_alloc_inst()
  creates default configfs child groups for the\ndefault endpoint and default block
  using configfs_add_default_group(),\nsetting their internal refcount to 1.\n\nHowever,
  during function teardown in f_midi2_free_inst() or EP cleanup\nin f_midi2_ep_opts_release(),
  configfs_remove_default_groups() is\nnever called, therefore never dropping the
  refcount and leaking struct\nf_midi2_ep_opts and f_midi2_block_opts.\n\nAdd the
  missing configfs_remove_default_groups() in the afformentioned\nfunctions to free
  the structs properly."
