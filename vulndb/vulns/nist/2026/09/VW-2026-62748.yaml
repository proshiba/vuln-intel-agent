title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc4-topology: Return error for invalid number of formats\n\nWhen the number
  of input or output formats is zero,\nsof_ipc4_widget_setup_comp_src() and sof_ipc4_widget_setup_comp_asrc()\n\
  print an error and jump to the cleanup label. At that point 'ret' is\nstill 0, because
  the earlier sof_ipc4_get_audio_fmt() call succeeded, so\nthe function returns success
  and the caller never finds out that the\nwidget setup actually failed.\n\nSet ret
  to -EINVAL before the goto so the error gets reported."
