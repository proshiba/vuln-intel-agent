title: UVdesk core-framework before 1.1.7 contains an improper privilege 
  management vulnerability in the editAgent endpoint that allows agents with 
  agent-management privilege to escalate their own role to administrator. 
  Attackers can submit their own account identifier with a role parameter set to
  ROLE_ADMIN to gain full administrative control over agents, tickets, and mail 
  configuration.
