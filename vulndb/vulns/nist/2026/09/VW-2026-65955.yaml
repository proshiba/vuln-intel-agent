title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  cttimeout: prevent UAF during module unload\n\nnf_ct_set_timeout() protects the
  timeout hook dereference and policy lookup\nwith rcu_read_lock(). cttimeout_exit(),
  however, unregisters the per-net\noperations before it clears the hook.\n\nThis
  allows the following interleaving:\n\n  CPU 0                              CPU 1\n\
  \  cttimeout_exit()                   nf_ct_set_timeout()\n    unregister_pernet_subsys()\
  \         rcu_read_lock()\n      kfree(pernet)                     h = nf_ct_timeout_hook\n\
  \                                        h->timeout_find_get()\n               \
  \                           nfct_timeout_pernet()\n\nThe hook still points to ctnl_timeout_find_get()
  when CPU 1 looks up the\nalready freed per-net timeout list. KASAN reported:\n\n\
  \  BUG: KASAN: slab-use-after-free in ctnl_timeout_find_get\n  Read of size 8 by
  task poc/90\n  Call Trace:\n   ctnl_timeout_find_get+0x271/0x2a0 [nfnetlink_cttimeout]\n\
  \   nf_ct_se"
