title: "In the Linux kernel, the following vulnerability has been resolved:\n\nzram:
  fix out-of-bounds access in read_block_state()\n\nread_block_state() calculates
  nr_pages before taking dev_lock.  If the\ndevice is reset and reinitialized with
  a smaller disksize before lock\nacquisition, nr_pages still describes the old table.\
  \  The subsequent loop\ncan then call slot_lock() past the end of the newly allocated
  table.\n\nRead disksize after acquiring dev_lock and checking that the device is\n\
  initialized.  The read lock then keeps the table and its bound stable for\nthe duration
  of the scan."
