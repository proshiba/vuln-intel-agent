title: Tesseract is an open source OCR engine. In version 5.5.3 and earlier, 
  Plumbing::DeSerialize in src/lstm/plumbing.cpp rejects excessively large 
  network stacks but accepts a zero-length stack for NT_SERIES, NT_PARALLEL, or 
  NT_REVERSED layers in a crafted .traineddata model. During LSTMRecognizer 
  initialization in src/lstm/lstmrecognizer.cpp, 
  CacheXScaleFactor(XScaleFactor()) reaches Series::CacheXScaleFactor in 
  src/lstm/series.cpp, which dereferences stack_[0] on the empty vector and 
  invokes a virtual method through an invalid Network pointer. This causes a 
  deterministic crash and denial of service at model load. No fixed release is 
  available as of this review.
