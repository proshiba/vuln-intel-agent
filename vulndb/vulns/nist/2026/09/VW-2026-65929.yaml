title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Clear stale peer app data after address list changes\n\nafs_fs_probe_fileserver()
  fetches the current endpoint state under\nserver->fs_lock, but leaves old_alist
  as NULL.  Consequently,\nafs_set_peer_appdata() treats every address list replacement
  as initial\nsetup and only binds the new peers; it never unbinds peers removed from\n\
  the old list.\n\nAn address refresh can therefore proceed as follows.  CPU 0 replaces\n\
  server S's list and drops Pold without clearing Pold->app_data.  The\nserver destroyer
  then clears only S's current peers and lets S reach its\nRCU callback.  After the
  callback frees S, CPU 1 handles a callback\nthrough an RxRPC connection that still
  pins Pold, reads Pold->app_data,\nand calls afs_use_server() on the freed object.\n\
  \nKASAN reported:\n\n  BUG: KASAN: slab-use-after-free in afs_find_server+0x3c/0xa0\n\
  \  Read of size 4 at addr ffff8881013e1af0 by task krxrpcio/7001/74\n  Call Trace:\n\
  \   afs_find_server+0x3c"
