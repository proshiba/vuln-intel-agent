title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_nat_sip: rewind offset when NAT shrinks the packet\n\nsashiko says:\n If map_addr()
  changes the packet length, such as when the public NAT IP\n string is shorter or
  longer than the internal IP, coff will still point to\n the offset relative to the
  pre-mangled packet.\n If the packet shrinks, coff could overshoot the correct position,\n\
  \ potentially causing the next ct_sip_parse_header_uri() call to silently\n skip
  bytes and miss subsequent Contact headers. Could this lead to a\n failure to NAT
  those subsequent headers and leak internal network details?"
