title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: bq256xx: drain usb_work before freeing the charger\n\nThe USB-PHY notifier
  queues usb_work, whose handler calls\npower_supply_changed(bq->charger). The reset
  devm action only unregisters\nthe notifier and was registered before the power supplies,
  so devm frees\nbq->charger on unwind before the action runs; a usb_work still queued
  can\nthen dereference it.\n\nRegister the reset action after the power supplies,
  so it unregisters\nthe notifiers and drains usb_work before the supplies are released.\n\
  Initialize usb_work and obtain the PHY references before registering\nthe notifiers,
  so the worker cannot run before the supplies exist.\n\nFound by static analysis."
