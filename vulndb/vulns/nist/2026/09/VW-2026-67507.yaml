title: A vulnerability was found in mwasikz robo-cafe-rms up to 
  228c44a02823f04e85db32b7137809a2856148fc. The impacted element is an unknown 
  function of the file frontend/update-account.php of the component Edit Profile
  Feature. Performing a manipulation of the argument Name/Address/City results 
  in cross site scripting. Remote exploitation of the attack is possible. The 
  exploit has been made public and could be used. This product follows a rolling
  release approach for continuous delivery, so version details for affected or 
  updated releases are not provided. The vendor was contacted early about this 
  disclosure but did not respond in any way.
