title: The Auto Upload Images plugin for WordPress is vulnerable to Limited 
  Server-Side Request Forgery in all versions up to, and including, 3.3.2 via 
  the downloadImage function. This makes it possible for authenticated 
  attackers, with contributor-level access and above, to make web requests to 
  arbitrary locations originating from the web application. The plugin uses 
  wp_remote_get() rather than wp_safe_remote_get(), and the validate() method 
  only rejects URLs whose host matches the site's own hostname, failing to block
  requests to private, loopback, or link-local addresses (e.g., 127.0.0.1, 
  10.0.0.0/8, 169.254.169.254). Attackers can trigger this by embedding a 
  crafted <img> tag with a src attribute pointing to internal network hosts in 
  post content and submitting it for processing.
