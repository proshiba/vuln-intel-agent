title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  validate seg_id fields from persistent memory\n\ncache_pos_decode(), cache_key_decode()
  and the last-kset branches of\ncache_replay(), the writeback worker and the GC worker
  take a cache\nsegment id from the cache device metadata and index cache->segments[]\n\
  with it without checking it against cache->n_segs. That metadata is only\nCRC-protected
  with a fixed public seed, so whoever supplies the cache\ndevice on a table load
  (CAP_SYS_ADMIN) controls the id; an out-of-range\nvalue forms a wild pcache_cache_segment
  pointer that is dereferenced and\nwritten through -- an out-of-bounds read and write
  driven by on-disk data.\n\nAdd cache_seg_id_valid() and reject an out-of-range id
  at each decode\nsite, failing the operation with -EIO instead of indexing past the
  array.\nBound the id against the initialized-segment count (cache_info.n_segs)\n\
  rather than the physical device total. A forged cache_info.n_segs below\nseg_num
  otherwi"
