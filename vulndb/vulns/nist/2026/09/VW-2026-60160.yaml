title: Http4s is a Scala interface for HTTP services. Prior to 0.23.35 and 
  1.0.0-M47, The CookieJar client middleware stores a response cookie’s Domain 
  attribute without checking that it domain-matches the host that supplied the 
  cookie or rejecting public suffixes. A malicious or compromised server 
  contacted through the same CookieJar can plant a cookie for another domain, 
  and the jar later sends that cookie to the victim domain, enabling session 
  fixation or overwriting security-sensitive cookies. The patch validates the 
  Set-Cookie domain against the response origin, although public-suffix 
  rejection remains unimplemented. This issue is fixed in versions 0.23.35 and 
  1.0.0-M47.
