title: InvoicePlane is a self-hosted open source application for managing 
  invoices, clients, and payments. Prior to 1.7.2, InvoicePlane's 
  User_Controller compares the session user_type value with the required role by
  using PHP's loose inequality operator. Under a non-standard session backend 
  that returns unexpected scalar types, type juggling can cause a value that is 
  not strictly the required role to pass the authorization check. This can 
  permit authentication or authorization bypass in affected session 
  configurations. This issue is fixed in version 1.7.2.
