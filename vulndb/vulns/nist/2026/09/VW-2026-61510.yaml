title: RabbitMQ amqp091-go is a Go AMQP 0.9.1 client. Prior to 1.13.0, 
  Channel.dispatch in channel.go, confirms.confirm in confirms.go, and 
  Connection.dispatch0 in connection.go synchronously send publisher 
  confirmations, flow-control events, consumer cancellations, returned messages,
  including NotifyConfirm events and connection block notifications, to 
  application-provided channels. If a listener channel is unbuffered, full, or 
  not drained promptly, the sole reader goroutine blocks and stops processing 
  frames, acknowledgments, deliveries, and heartbeats. Broker-driven event 
  bursts can therefore cause connection stalls, missed heartbeats, deadlocks, 
  and disconnection. This issue is fixed in version 1.13.0.
