title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MSFT: validate evt_prefix_len against the response length\n\nread_supported_features()
  only checks that the response covers the fixed\npart of struct msft_rp_read_supported_features,
  which is 11 bytes:\n\n\tif (skb->len < sizeof(*rp)) {\n\t\tbt_dev_err(hdev, \"MSFT
  supported features length mismatch\");\n\t\tgoto failed;\n\t}\n\nevt_prefix[] is
  a flexible array member and rp->evt_prefix_len is an\nunvalidated u8 taken straight
  out of that response, so\n\n\tmsft->evt_prefix = kmemdup(rp->evt_prefix, rp->evt_prefix_len,\n\
  \t\t\t\t   GFP_KERNEL);\n\ncopies up to 255 bytes from a reply that may have carried
  none of them.\nWhat is copied is data the controller never sent, and it is then
  used to\nmatch incoming vendor events in msft_vendor_evt().\n\nThis is not an out-of-bounds
