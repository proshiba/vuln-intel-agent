title: "The Asset CleanUp: Page Speed Booster plugin for WordPress is vulnerable to
  Server-Side Request Forgery in all versions up to, and including, 1.4.0.5 via the
  'page_url' parameter. This makes it possible for authenticated attackers, with administrator-level
  access and above, to make web requests to arbitrary locations originating from the
  web application and can be used to query and modify information from internal services.
  This vulnerability is only reachable when the plugin's dom_get_type setting has
  been configured to 'wp_remote_post' by an administrator."
