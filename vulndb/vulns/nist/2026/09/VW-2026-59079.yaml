title: "Affected versions of MISP serve uploaded SVG images inline without a restrictive
  browser sandbox.\n\n\nThe commit explains that SVG files are XML documents rather
  than passive bitmap images. While scripts inside SVG do not execute when the SVG
  is rendered through a normal <img>, they can execute when the SVG is navigated to
  directly or embedded as a document. In that case, malicious <script> elements, event
  handlers, or javascript: URLs execute on the MISP origin with the viewer’s session.\n\
  \n\nThe affected use cases include:\n\n\n\n - organisation SVG logos;\n - event-report
  SVG pictures.\n\n\n\n\n\n\nImportantly, the vulnerable behavior is on the serve
  path, not merely the upload path: the patch notes that a malicious SVG uploaded
  while SVG support was enabled could remain dangerous even after uploads were later
  disabled.\n\n\n\nVersion affected: ≤2.5.45"
