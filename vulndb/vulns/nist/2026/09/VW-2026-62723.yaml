title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qat - cancel work on re-enable SR-IOV timeout\n\nThe QAT reset worker queues SR-IOV
  reenable work using a work_struct and\ncompletion embedded in an on-stack adf_sriov_dev_data.
  If the completion\nwait times out, the reset worker can return while device_sriov_wq
  still\nholds or executes the stack-backed work item.\n\nCancel the work on the device_sriov_wq
  on timeout before the stack frame\nunwinds."
