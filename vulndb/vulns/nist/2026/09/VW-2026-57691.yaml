title: FileRun before 2026.3.0 contains a SQL injection vulnerability that 
  allows delegated or simple administrators to execute arbitrary SQL by 
  submitting the description parameter as an array, causing the 
  getValuesString() method in DB/DP.php to interpolate raw array values directly
  into an INSERT statement without parameterization. Because the underlying PDO 
  connection uses emulated prepared statements enabling stacked queries, 
  attackers can manipulate the df_users_permissions table to escalate a 
  delegated administrator account to superuser privileges, and may additionally 
  achieve code execution via unsanitized path values passed to require_once in 
  the logs listing component.
