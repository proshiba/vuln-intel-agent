title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/mmu: WARN and clear role.invalid when creating a child shadow page\n\nExplicitly
  clear role.invalid when deriving a child shadow page's role from\nits parent to
  harden against bugs elsewhere in KVM, as violating KVM's\ninvariant that invalid
  pages are NOT on the list of active MMU pages leads\nto use-after-free due to __kvm_mmu_prepare_zap_page()
  using list_add()\ninstead of list_move() when processing an invalid shadow page,
  i.e. makes a\nbad situation far worse.\n\nYell loudly if the parent is invalid,
  as it means KVM has missed a validity\ncheck, i.e. KVM is attempting to map memory
  using an invalid/obsolete root,\nbut continue on as the child is otherwise still
  a valid shadow page.\n\n  ==================================================================\n\
  \  BUG: KASAN: slab-use-after-free in __kvm_mmu_get_shadow_page+0x1817/0x1860 [kvm]\n\
  \  Write of size 8 at addr ff11000153dd1368 by task repro/853\n\n  CPU: 1 UID: 1000
  PID:"
