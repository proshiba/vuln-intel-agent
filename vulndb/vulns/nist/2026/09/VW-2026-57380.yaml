title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.7.0 until 0.11.1, the built-in knowledge search tool 
  passed the caller's readable knowledge identifiers through a metadata filter, 
  but the search methods in eleven shipped vector backends ignored that filter. 
  An authenticated user on an affected backend could enumerate the identifiers, 
  names, and descriptions of inaccessible knowledge bases from the shared 
  collection, although the associated document text remained in separate 
  collections. This issue is fixed in version 0.11.1.
