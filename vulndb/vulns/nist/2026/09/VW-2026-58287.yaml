title: "In the Linux kernel, the following vulnerability has been resolved:\n\norangefs:
  skip leading spaces before parsing client debug masks\n\norangefs_prepare_cdm_array()
  sizes each client debug keyword buffer\nwith strcspn(cds_head, \" \"), but then
  parses the keyword with %s. The\n%s conversion skips leading whitespace, while strcspn()
  does not.\n\nIf a client debug entry starts with a space, the allocation can be
  sized\nfor an empty keyword while sscanf() copies the following non-empty token.\n\
  This can write past the end of the allocated keyword buffer.\n\nSkip leading spaces
  before computing the keyword length so the allocation\nmatches the string parsed
  by sscanf()."
