title: RabbitMQ amqp091-go is a Go AMQP 0.9.1 client. Prior to 1.13.0, 
  readLongstr in read.go returns an empty string and a nil error when a declared
  AMQP longstr length exceeds 0x7FFFFFFF instead of returning ErrSyntax. The 
  function leaves the declared field bytes unread, while readTable treats the 
  operation as successful and continues parsing from the wrong offset. A 
  malicious or compromised broker can provide an oversized longstr in a table 
  field and desynchronize subsequent AMQP parsing, causing attacker-controlled 
  trailing bytes to be interpreted as later fields or frames and disrupting 
  connection integrity and availability. This issue is fixed in version 1.13.0.
