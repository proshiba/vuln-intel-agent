title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbus:
  mhi: ep: Fix device refcount leak in the error path of MHI device creation\n\nmhi_ep_create_device()
  takes one device reference for the UL channel and\nanother for the DL channel after
  allocating the transfer device. These\nreferences are normally released by mhi_ep_destroy_device()
  before the\ndevice itself is removed.\n\nIf dev_set_name() or device_add() fails,
  the error path currently drops\nonly one reference. The remaining channel references
  keep the device\nfrom being released and leave the channels associated with a device
  that\nwas never registered.\n\nRoute both failures through a common unwind path
  that drops the DL\nchannel reference, the UL channel reference, and the initial
  reference\nfrom device_initialize()."
