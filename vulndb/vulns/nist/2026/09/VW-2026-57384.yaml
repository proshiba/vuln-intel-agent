title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.8.11 until 0.11.1, 
  src/lib/components/chat/FileNav/PortPreview.svelte rendered terminal port 
  content in an iframe sandbox containing both allow-scripts and 
  allow-same-origin. Because the terminal proxy serves that content from the 
  Open WebUI origin, an authenticated user with access to a shared terminal 
  server could host script on a previewed port and take over a victim's account 
  when the victim opened the preview. This issue is fixed in version 0.11.1.
