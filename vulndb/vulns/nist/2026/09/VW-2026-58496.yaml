title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  Reset write verifier when async COPY writeback fails\n\nAsync COPY captures nn->writeverf
  at request time and reports it to\nthe client via CB_OFFLOAD after the worker kthread
  completes. When\nthe post-copy vfs_fsync_range() or filemap_check_wb_err() in\n\
  _nfsd_copy_file_range() reports an error, the worker correctly\nleaves NFSD4_COPY_F_COMMITTED
  clear so that CB_OFFLOAD encodes\nwr_stable_how as NFS_UNSTABLE, but the server's
  write verifier is\nnot rotated.\n\nA client that receives NFS_UNSTABLE in CB_OFFLOAD
  follows up with\nCOMMIT to make the copied data durable. With the verifier\nunchanged,
  COMMIT returns the same value the client just received\nvia CB_OFFLOAD, and the
  client concludes the copy is durable --\nsilently dropping the data whose writeback
  in fact failed. This\nviolates the UNSTABLE+COMMIT durability contract (RFC 7862
  section\n15.1, RFC 8881 section 18.32) and matches the bug just fixed in\nnfsd_vfs_write()
  and"
