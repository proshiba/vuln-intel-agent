title: 'The Gravity Forms plugin for WordPress is vulnerable to Arbitrary File Upload
  in all versions up to, and including, 3.0.2. This is due to insufficient validation
  of multi-file upload chunk state in the `GFAsyncUpload::upload()` function, where
  public form state URL hashes can be reused as chunk continuation hashes and attacker-controlled
  temporary filenames are accepted before sanitization. This makes it possible for
  unauthenticated attackers, when a public form contains a File Upload field with
  Multiple Files enabled, to upload a valid PNG/PDF polyglot to an attacker-selected
  public `.php` or `.html` filename in the Gravity Forms temporary upload directory.
  This can lead to remote code execution on WordPress systems that use NGINX or other
