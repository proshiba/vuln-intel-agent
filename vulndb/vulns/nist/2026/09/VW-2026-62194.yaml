title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mana: Cap MSI-X vectors to the device MSI-X table size\n\nmana_gd_query_max_resources()
  sizes gc->num_msix_usable from resp.max_msix\nand the CPU count, but never from
  the device MSI-X table. On a 1792 vCPU\nM-series VM that yields 1793 while the table
  has 1024 entries, and\nmana_gd_setup_remaining_irqs() then walks indices 1..1792,
  running off the\nend of the region mapped by msix_map_region():\n\n  BUG: unable
  to handle page fault for address: ff8e347f8b99800c\n  RIP: 0010:msix_prepare_msi_desc+0x7a/0x90\n\
  \  RAX: 0000000000004000 RBX: ff4330cb164ea780 RCX: ff8e347f8b998000\n  Call Trace:\n\
  \   <TASK>\n   __msi_domain_alloc_irqs+0x13a/0x440\n   msi_domain_alloc_irq_at+0x149/0x1b0\n\
  \   mana_gd_setup+0x351/0x890\n   mana_gd_probe+0x274/0x390\n   </TASK>\n\nRAX is
  index 1024 * PCI_MSIX_ENTRY_SIZE, one entry past the table.\n\nmsi_insert_desc()
  does range check the index, but only against the MSI\ndomain hwsize, which matches
  the table only "
