title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkasan:
  fix cache shrink race with CPU hotplug\n\nkasan_quarantine_remove_cache() first
  invokes per_cpu_remove_cache() on\nall online CPUs.  Each callback moves objects
  belonging to the cache from\ncpu_quarantine to the CPU's shrink_qlist, where they
  can later be freed\nfrom task context.\n\nkmem_cache_destroy() invokes the quarantine
  removal path while holding\ncpus_read_lock(), but kmem_cache_shrink() does not.\
  \  The latter can\ntherefore race with CPU offlining as follows:\n\n  kmem_cache_shrink()\
  \             CPU hotplug\n  -------------------             -----------\n  on_each_cpu()\n\
  \    CPU1 moves objects to\n    CPU1's shrink_qlist\n  on_each_cpu() returns\n \
  \                                 CPU1 goes offline\n                          \
  \        kasan_cpu_offline()\n                                    drains cpu_quarantine\n\
  \                                    leaves shrink_qlist untouched\n  for_each_online_cpu()\n\
  \    skips CPU1\n\nThe obje"
