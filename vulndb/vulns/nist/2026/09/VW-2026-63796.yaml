title: A flaw has been found in 06ketan slideshot up to 4.4.0. This impacts the 
  function render_slides of the file packages/cli/src/renderer.ts. This 
  manipulation of the argument htmlPath causes path traversal. The attack is 
  possible to be carried out remotely. The exploit has been published and may be
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
