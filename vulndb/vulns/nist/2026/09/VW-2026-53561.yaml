title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  ensure socket is owned by ovpn before deref sk_user_data\n\nSome subsystems, like
  BPF SOCKMAP, set sk_user_data without\nactually setting the encap_type.\n\nFor this
  reason, we must make sure that the type is the\none ovpn expects before dereferencing
  sk_user_data.\n\nFailing to do so may lead to out-of-bounds reads."
