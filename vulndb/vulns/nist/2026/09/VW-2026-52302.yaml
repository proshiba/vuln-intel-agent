title: "The I3C IBI subsystem in drivers/i3c/i3c_ibi_workq.c hands out statically-allocated
  work nodes through a free-list i3c_ibi_work_nodes_free implemented as a plain sys_slist_t,
  which provides no synchronization. The allocation helpers (i3c_ibi_work_enqueue,
  i3c_ibi_work_enqueue_target_irq, i3c_ibi_work_enqueue_hotjoin, i3c_ibi_work_enqueue_controller_request,
  i3c_ibi_work_enqueue_cb) called sys_slist_get() directly from ISR context, while
  the workqueue handler i3c_ibi_work_handler() returned nodes with sys_slist_append()
  from the workqueue thread, with no lock on either side.\n\nBecause sys_slist_get()
  and sys_slist_append() are neither atomic nor interrupt-safe, an IBI interrupt that
  fires while the workqueue thread is mid-append (or a truly parallel access under
  CONFIG_SMP) races on the shared list. This corrupts the list linkage: a node may
  be handed to two consumers, a node may be lost, or the head/tail pointers may be
  left inconsistent so sys_slist_get() returns a stale or garbage poi"
