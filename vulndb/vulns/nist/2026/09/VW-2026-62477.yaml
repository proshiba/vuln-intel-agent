title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: cancel reset and rc work on device unregister\n\nBoth drivers cancelled dump_work
  on unregister but left reset_work and\nrc_work to be flushed only by destroy_workqueue()
  in mt76_free_device(),\nwhich runs after the hw is unregistered and the hardware
  stopped. A\nreset_work that fires in that window calls ieee80211_restart_hw() and\n\
  re-arms mac_work on an unregistered hw, and rc_work touches station state\nbeing
  torn down. Cancel both up front, alongside dump_work."
