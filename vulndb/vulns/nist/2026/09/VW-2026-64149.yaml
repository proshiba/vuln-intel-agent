title: The CMP – Coming Soon & Maintenance Plugin by NiteoThemes plugin for 
  WordPress is vulnerable to unauthorized modification of data that can lead to 
  privilege escalation due to a missing capability check on the 
  'cmp_ajax_import_settings' AJAX action in all versions up to, and including, 
  4.1.17. This makes it possible for authenticated attackers, with Editor-level 
  access and above, to update arbitrary options on the WordPress site. This can 
  be leveraged to update the default role for registration to administrator and 
  enable user registration for attackers to gain administrative user access to a
  vulnerable site.
