title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate ipc response length before dereferencing its fields\n\nipc_validate_msg()
  computes the expected message size by reading length\nfields out of the response
  buffer supplied by the userspace ksmbd daemon\n(payload_sz, session_key_len, ngroups,
  ...).  Those fields are read before\nthe buffer is verified to be large enough to
  contain the struct they belong\nto, so a short response makes the read land past
  the end of the allocation.\n\nhandle_response() sizes entry->response purely from
  the netlink attribute\nlength (nla_len()) and only guards the leading handle read,
  so the daemon\ncan install a response as small as the kmalloc-8 object seen below.\
  \  When\nipc_msg_send_request() then calls ipc_validate_msg() for a\nKSMBD_EVENT_RPC_REQUEST,
  the cast to struct ksmbd_rpc_command reads\nresp->payload_sz at offset 8 of an 8-byte
  allocation:\n\n[ 3697.841381] ==================================================================\n\
  [ 3"
