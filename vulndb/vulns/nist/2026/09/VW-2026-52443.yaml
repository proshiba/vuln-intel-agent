title: The Live Composer – Free WordPress Website Builder plugin for WordPress 
  is vulnerable to Stored Cross-Site Scripting via the 'custom_id' shortcode 
  attribute of the dslc_modules_section and dslc_modules_area shortcodes in 
  versions up to, and including, 2.1.19. This is due to insufficient input 
  sanitization and output escaping on the user-supplied attribute, which is 
  concatenated into the HTML id="" attribute of the rendered <div> element in 
  the dslc_modules_section_front() and dslc_modules_area_front() functions 
  without esc_attr(). This makes it possible for authenticated attackers, with 
  Contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page.
