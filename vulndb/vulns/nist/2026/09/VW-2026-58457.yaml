title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  close shrinker/GC/fsnotify vs per-net shutdown race in filecache\n\nThe shrinker,
  GC worker, and fsnotify/lease callbacks can unhash an\nnfsd_file from the rhashtable
  and then call\nnfsd_file_dispose_list_delayed() to move it to the per-net dispose
  list.\nIf nfsd_file_cache_shutdown_net() runs concurrently, its rhashtable walk\n\
  misses the already-unhashed file, and its drain of the per-net dispose\nlist can
  run before the file has been queued.  The file then sits on\nthe per-net list with
  no thread to drain it, leaking both the file and\nits associated state.\n\nThe GC
  worker and shrinker already hold nfsd_gc_lock while walking the\nLRU, but in the
  original code they release it before calling\nnfsd_file_dispose_list_delayed().\
  \  The fsnotify/lease path\n(nfsd_file_close_inode) has no synchronization at all.\n\
  \nFix this by:\n\n  1. Widening nfsd_gc_lock in both nfsd_file_gc() and nfsd_file_lru_scan()\n\
