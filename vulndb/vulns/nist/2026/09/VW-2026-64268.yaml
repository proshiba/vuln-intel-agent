title: "When a BIG-IP APM access policy and an OAuth profile are configured on a virtual
  server, specific malicious traffic can lead to remote code execution (RCE). This
  vulnerability is only present when BIG-IP APM is configured as an OAuth Authorization
  Server. Deployments using APM strictly as an OAuth Client / Resource Server (without
  OAuth authorization server profiles configured) are not affected by this vulnerability.\n\
  \nImpact:\nThis vulnerability allows an unauthenticated attacker to perform remote
  code execution. The BIG-IP system in Appliance mode is also vulnerable. This is
  a data plane issue; there is no control plane exposure.\n\n \n\n\nNote: Software
  versions which have reached End of Technical Support (EoTS) are not evaluated."
