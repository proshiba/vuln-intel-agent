title: "When a BIG-IP APM access policy and an OAuth profile is configured on a virtual
  server, specific malicious traffic can lead to Remote Code Execution (RCE).\n\n\
  Impact:\nThis vulnerability allows an unauthenticated attacker to perform remote
  code execution. The BIG-IP system in Appliance mode is also vulnerable. This is
  a data plane issue; there is no control plane exposure.\n\n \n\n\nNote: Software
  versions which have reached End of Technical Support (EoTS) are not evaluated."
