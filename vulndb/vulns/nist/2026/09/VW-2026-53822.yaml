title: Colord is a tiny yet powerful tool for high-performance color 
  manipulations and conversions. Prior to 2.9.4, synchronous CSS color string 
  matchers in src/colorModels/rgbString.ts, src/colorModels/hslString.ts, 
  src/colorModels/hwbString.ts, src/colorModels/lchString.ts, and 
  src/colorModels/cmykString.ts use the ambiguous numeric regular expression 
  ([+-]?\d*.?\d+), allowing the same digits to be divided between overlapping 
  quantifiers in quadratically many ways when malformed input is rejected. An 
  attacker who can supply an unbounded color string to colord(), getFormat(), 
  isEqual(), mix(), or contrast(), including through a request body, JSON field,
  or uploaded stylesheet, can block the processing thread with a multi-kilobyte 
  payload. The affected matchers are parseRgbaString, parseHslaString, 
  parseHwbaString, parseLchaString, and parseCmykaString. This issue is fixed in
  version 2.9.4.
