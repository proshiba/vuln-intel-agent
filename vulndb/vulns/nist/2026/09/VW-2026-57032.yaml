title: The Eventin – Event Calendar, Event Registration, Tickets & Booking (AI 
  Powered) plugin for WordPress is vulnerable to authorization bypass in all 
  versions up to, and including, 4.1.22. This is due to the plugin not properly 
  verifying that a user is authorized to perform an action. This makes it 
  possible for authenticated attackers, with subscriber-level access and above, 
  to bypass payment for paid events, fraudulently mark orders as completed, 
  deplete ticket inventory, and trigger confirmation emails for tickets never 
  purchased. This is exploitable by unauthenticated attackers because the 
  wp_rest nonce is publicly emitted on every frontend page, and the order 
  creation endpoint mints and returns an order_access_token to any caller 
  possessing that nonce — giving unauthenticated users all credentials required 
  to reach the privileged update_booking_status branch.
