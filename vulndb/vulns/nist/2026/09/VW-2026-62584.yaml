title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix use after free in ib_query_qp()\n\nWhen querying a QP via the netlink flow the
  only synchronization\nmechanism for the said QP is rdma_restrack_get(), meanwhile
  during the\nQP destroy path rdma_restrack_del() is called at the end of the\nib_destroy_qp_user()
  function which is too late, since by then the\nvendor specific resources for said
  QP would already be destroyed, and\ntill the rdma_restrack_del() is called this
  QP can still be accessed,\nwhich could cause the use after free below.\n\nFix this
  by moving the rdma_restrack_begin_del() to the start of the\nib_destroy_qp_user(),
  which in turn waits for all usages of the QP to be\ndone then removes it from the
  database to prevent access to it while it\nis being destroyed.\n\nRIP: 0010:ib_query_qp+0x15/0x50
  [ib_core]\nCode: 48 83 05 5d 8e b9 ff 01 eb b5 66 66 2e 0f 1f 84 00 00 00 00 00
  0f 1f 44 00 00 48 c7 46 40 00 00 00 00 48 c7 46 78 00 00 00 00 <48> 8b 07 48 8b
  80 88"
