title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Add DIRECT_MAP_PHYSMEM_END definition\n\nget_free_mem_region() and mhp_get_pluggable_range()
  bound their search\nto DIRECT_MAP_PHYSMEM_END. LoongArch does not define it, so
  the fallback\nin include/linux/mm.h applies: under CONFIG_SPARSEMEM_VMEMMAP it is\n\
  (1ULL << MAX_PHYSMEM_BITS) - 1, a compile-time constant that does not\nadapt to
  the CPU's physical address space bits (cpu_pabits, probed from\nCPUCFG1).\n\nThe
  vmemmap window only covers physical space below 2^(cpu_pabits+1)\n(i.e. VMEMMAP_SIZE),
  so on CPUs with fewer physical address bits than\nMAX_PHYSMEM_BITS the fallback
  allows get_free_mem_region() to return\na ZONE_DEVICE region outside the vmemmap
  window; vmemmap_populate() then\nwraps the memmap range around and maps it into
  low memory, silently\ncorrupting the page tables. The same search also picked the
  top-of-\naddress-space region that crashed memmap_init_zone_device() with amdkfd\n\
  on Loongson-3C6000 in 6.16 "
