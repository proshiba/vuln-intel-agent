title: "MISP contains an access control flaw in the EventReports functionality. The
  replaceSuggestionInReport action, which allows modification of suggestion content
  within an event report, was incorrectly mapped to the wildcard permission ('*')
  in the ACLComponent, making it accessible to any authenticated user regardless of
  their assigned permissions. All analogous report-modification actions correctly
  required the perm_add permission, while read-only actions such as downloadAsPDF
  appropriately used the wildcard. \n\nAn authenticated user without the perm_add
  permission could invoke the replaceSuggestionInReport endpoint to alter report suggestion
  data, violating the intended authorization model. \n\nThis constitutes an improper
  authorization weakness that could lead to unauthorized modification of event report
  content, potentially corrupting shared threat intelligence data or injecting misleading
  information into reports relied upon by other analysts and automated consumers."
