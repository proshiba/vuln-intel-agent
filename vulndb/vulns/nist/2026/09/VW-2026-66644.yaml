title: "SiYuan before v3.8.4 does not validate the sender or restrict recipients in
  the 'siyuan-send-windows' IPC handler of the Electron main process (app/electron/main.js).
  The handler ignores event.sender and forwards any received payload to every BrowserWindow
  returned by BrowserWindow.getAllWindows(), including windows belonging to other
  opened workspaces. A renderer connected to an attacker-controlled remote kernel
  can therefore send {cmd: \"lockscreenByMode\"} and have it delivered across the
  workspace boundary; a sibling workspace window whose lockScreenMode is set to 1
  invokes lockScreen(). Repeated messages allow the remote workspace to repeatedly
  lock unrelated local workspace windows, causing a limited denial of service. No
  confidentiality, integrity, or code-execution impact was observed."
