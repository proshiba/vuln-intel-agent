title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: don't force read-only on transient -EAGAIN from reloc merge\n\nOn a zoned
  FS, btrfs_delayed_refs_rsv_refill() returns -EAGAIN whenever\nthe over-committed
  metadata plus the zone_unusable bytes exceeds the\nusable size in a metadata block-group
  to avoid heavy over-commit of\nmetadata and early ENOSPC in one transaction.\n\n\
  If this happens while doing reclaim, the transaction is getting aborted.\n\nTreat
  -EAGAIN as a soft, retryable condition in case of block-group\nreclaim."
