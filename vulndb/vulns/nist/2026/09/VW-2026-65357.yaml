title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd:
  fix swapped arguments in nlmsvc_match_ip()\n\nWhen releasing locks by server IP
  address via /proc/fs/nfsd/unlock_ip,\nnlmsvc_unlock_all_by_ip() calls nlm_traverse_files()
  with the server\nsockaddr as the opaque @data argument:\n\n\tnlm_traverse_files(server_addr,
  nlmsvc_match_ip, NULL);\n\nThe match callback is later invoked from nlm_traverse_locks()
  as:\n\n\tmatch(lockhost, host);\n\nwhere the first argument is the nlm_host that
  owns the lock, and the\nsecond argument is the @data that was originally passed
  down (here the\nserver sockaddr).  This is the convention every other match callback\n\
  relies on (nlmsvc_mark_host(), nlmsvc_same_host(), nlmsvc_is_client()):\narg1 is
  the real nlm_host, arg2 is the caller-supplied reference value.\n\nnlmsvc_match_ip()
  has had these two arguments reversed ever since the\nunlock-by-IP feature was introduced
  in commit 4373ea84c84d (\"lockd:\nunlock lockd locks associated with a given server
  ip\"):\n\n\t"
