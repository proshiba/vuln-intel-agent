title: "A persistent unsafe URL injection vulnerability exists in the MISP dashboard
  ButtonWidget configuration. Dashboard widget URLs were validated only when the widget
  was rendered and were not validated when the configuration was saved. As a result,
  an authenticated user able to modify dashboard widget settings could persist arbitrary
  URL values, including URLs using the javascript: scheme, through either of the dashboard
  settings persistence paths.\n\nA malicious javascript: URL stored in a dashboard
  button could potentially result in client-side script execution in the MISP security
  context if the value reached a rendering or navigation path without the existing
  runtime validation. Such execution could allow an attacker to perform actions with
  the privileges of the affected user or access information available to their MISP
  session.\n\nThe practical exploitability of this issue is reduced by the fact that
