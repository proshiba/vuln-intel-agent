title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the Confluence and Jira 
  upload_attachment implementations accept an unconstrained file_path and open 
  the referenced server-local file. A permitted MCP caller can upload sensitive 
  host files to an Atlassian destination and then retrieve their contents. The 
  advisory traces the vulnerable input and processing flow through 
  upload_attachment, file_path, and CVE-2026-27825, which identify the affected 
  entry points, controls, and code paths. This issue is fixed in version 0.22.0.
