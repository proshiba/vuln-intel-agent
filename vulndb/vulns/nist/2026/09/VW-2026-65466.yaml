title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: mvm: fix out-of-bounds tid_data access in BA notif\n\nmvmsta->tid_data
  was indexed by the TFD loop counter 'i' instead of\nthe actual TID value 'tid'.
  This writes lq_color into a random tid_data\nslot unrelated to the BA entry.\nSince
  multi-TID blockack is not really in use, 'i' was always 0 and no\nharm was done.\n\
  Add a out-of-bound check before accessing the array."
