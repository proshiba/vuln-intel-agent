title: Discourse is an open-source discussion platform. Prior to 2026.1.8, 
  2026.6.3, 2026.7.2, and 2026.8.0, attacker-controlled upload filenames used in
  chat message excerpts were rendered as unescaped HTML. A user able to upload a
  file and send chat content could place markup in a filename that was then 
  interpreted by chat channel lists, chat summary emails, pinned message bars, 
  reply previews, thread previews, and other excerpt renderers. The issue 
  allowed trusted-HTML injection that altered rendered excerpt content, but 
  JavaScript execution was not demonstrated with default Content Security Policy
  settings. The advisory states that no confidentiality, integrity, or 
  availability impact was identified, while its structured scoring metadata 
  separately assigns low integrity impact. Sites that disable or relax the 
  default CSP have increased exposure. This issue is fixed in versions 2026.1.8,
  2026.6.3, 2026.7.2, and 2026.8.0.
