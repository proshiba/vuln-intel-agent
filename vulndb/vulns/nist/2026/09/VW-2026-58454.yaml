title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  release OPEN-decoded posix ACLs via op_release\n\nnfsd4_decode_createhow4() calls
  nfsd4_decode_fattr4(), which allocates\nrefcounted struct posix_acl objects via
  posix_acl_alloc() and stores\nthem in open->op_pacl and open->op_dpacl. These pointers
  must be\nreleased once the OPEN compound finishes.\n\nWhen nfsd4_decode_open_claim4()
  returns a non-seqid-mutating error,\nthe dispatcher short-circuits before op_func
  runs:\n\n    nfsd4_proc_compound()\n      if (op->status && op->opnum == OP_OPEN)\n\
  \          op->status = nfsd4_open_omfg(...)\n              if (!seqid_mutating_err(ntohl(op->status)))\n\
  \                  return op->status;   /* nfsd4_open() never runs */\n      ...\n\
  \      opdesc->op_release(&op->u)  /* must still release op_pacl/op_dpacl */\n\n\
  Before this change OP_OPEN had no .op_release in nfsd4_ops[], and the\nrelease pair
  lived inside nfsd4_open() at its out_err: label. On the\nshort-circuit path nfsd4_open()
  is never"
