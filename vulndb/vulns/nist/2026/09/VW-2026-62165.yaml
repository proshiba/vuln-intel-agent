title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_htb: limit htb_classify inner-class filter hops\n\nhtb_classify() follows each
  filter-selected inner class by switching\nto cl->filter_list, but never bounds the
  number of hops. A filter on\nan inner class can point back to itself or to another
  inner class that\npoints back, creating an infinite loop in the packet classification\n\
  path with the qdisc lock held and BH disabled — a soft lockup / panic\nfrom a single
  packet.\n\nBound the traversal with a hop counter and drop the packet with a\nrate-limited
  warning once the bound is exceeded. The counter is\nincremented at the point the
  inner filter chain is picked up, after the\nTC_ACT_* switch has consumed the classifier
  verdict, so a terminal\nTC_ACT_QUEUED/STOLEN/TRAP on the last permitted chain still
  sets *qerr\nto __NET_XMIT_STOLEN and the packet is not charged as a drop by this\n\
  qdisc or its parent.\n\nThe bound is TC_HTB_MAXDEPTH, taken from HTB's own parameters
  rath"
