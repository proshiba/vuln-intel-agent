title: Deserialization of Untrusted Data in Apache Roller 6.1.5 allows an 
  unauthenticated remote attacker to cause deserialization of 
  attacker-controlled bytes, because the XML-RPC endpoint accepts vendor 
  extension types that are deserialized during request parsing, before 
  authentication. The servlet is mapped unconditionally, so parsing occurs even 
  when the global XML-RPC feature is set to disabled; no non-default 
  configuration is required for this path. This can lead to remote code 
  execution. Users are recommended to upgrade to Apache Roller 6.1.6 or later, 
  which disables the extension types and rejects requests when the XML-RPC 
  feature is disabled.
