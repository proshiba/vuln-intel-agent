title: AVideo through 29.0 (current revision e01e41ecc) contains a stored 
  cross-site scripting vulnerability. The unauthenticated view-counter endpoint 
  objects/videoAddViewCount.json.php reaches VideoStatistic::save(), which 
  writes the caller's User-Agent (via getUserAgentInfo(), which returns 
  unrecognized agent strings verbatim) directly into the `app` column of the 
  videos_statistics table without invoking the sanitizing setter setApp(); 
  normalizeApp() only truncates the value to 45 characters. The video owner's 
  and administrator's statistics page (view/videoViewsInfo.php) renders this 
  field in a DataTables 1.12.1 column with an unescaped renderer, and DataTables
  assigns cell content using innerHTML, so attacker-supplied HTML is parsed and 
  executed in the privileged user's authenticated session when the statistics 
  page is viewed. No patched version was available at the time of the advisory.
