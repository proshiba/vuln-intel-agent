title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: bq24257: fix use-after-free on remove\n\nThe STAT-pin interrupt is devm-managed,
  so it stays armed until the devm\ncleanup that runs after remove() returns. remove()
  cancels\nbq->iilimit_setup_work while the threaded handler can still fire; that\n\
  handler reschedules the work and dereferences bq, so the work runs\nagainst freed
  memory once devm frees bq.\n\nMake the delayed work device-managed with devm_delayed_work_autocancel(),\n\
  registered before the interrupt request. The devm cleanup then releases\nthe interrupt
  first, so the handler can no longer reschedule the work,\nand cancels the work before
  bq is freed. The explicit\ncancel_delayed_work_sync() in remove() is no longer needed
  and is dropped.\n\nFound by static analysis."
