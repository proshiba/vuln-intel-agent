title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix uncancelled rxrpc OOB message handler\n\nFix AFS to cancel its OOB message processing
  (typically to respond to\nsecurity challenges).  Also move OOB message processing
  to afs_wq so that\nit's also waited for and make the OOB handler just return if
  the net\nnamespace is no longer live."
