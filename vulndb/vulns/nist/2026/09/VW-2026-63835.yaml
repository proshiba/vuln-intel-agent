title: A vulnerability was found in BioStar BIOS Update Utility 1.9.7.3. This 
  issue affects the function sub_110BC of the file BSMEM64_W10.sys of the 
  component IOCTL Handler. The manipulation of the argument PhysicalAddress/Size
  results in write-what-where condition. Attacking locally is a requirement. The
  exploit has been made public and could be used. The vendor was contacted early
  about this disclosure but did not respond in any way.
