title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix swap entry corruption when clearing uffd-wp at fork()\n\ncopy_hugetlb_page_range()
  clears the uffd-wp bit of migration and hwpoison\nentries with huge_pte_clear_uffd_wp(),
  which operates on the present-PTE\nbit position.  Swap entries keep the uffd-wp
  state elsewhere -- the\nmigration branch reads and sets it with pte_swp_uffd_wp()
  and\npte_swp_mkuffd_wp() -- and the present-PTE position falls into the swap\npayload.\
  \  On x86-64 it lands in the inverted swap offset, where a\nnaturally-aligned hugetlb
  PFN always has the affected bit set, so the\nclear advances the encoded PFN by two
  pages.\n\nNo userfaultfd needs to be involved: the clear is guarded only by the\n\
  child VMA not being uffd-wp registered, so a plain fork() with an\nin-flight hugetlb
  migration entry (or a poisoned hugetlb page) corrupts\nthe entry copied into the
  child.  Instrumenting the clear and forking\nafter MADV_HWPOISON on a 2MB anon hugetlb
  page sho"
