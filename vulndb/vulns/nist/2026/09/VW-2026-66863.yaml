title: "The Ultra Addons for Contact Form 7 plugin for WordPress is vulnerable to
  Arbitrary File Upload due to insufficient file type validation in the 'uacf7_wpcf7_mail_components'
  function in all versions up to, and including, 3.5.50. This makes it possible for
  unauthenticated attackers to upload arbitrary files on the affected site's server
  which may make remote code execution possible. Note: This is only exploitable when
  the plugin's PDF Generator module is enabled, which is disabled by default."
