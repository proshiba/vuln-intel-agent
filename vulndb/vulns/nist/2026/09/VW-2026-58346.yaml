title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmodule:
  validate string table section types\n\nIn elf_validity_cache_sechdrs, section sizes
  and offsets are validated,\nunless the section type is SHT_NULL or SHT_NOBITS.\n\
  \nLater, elf_validity_cache_secstrings and elf_validity_cache_index_str\naccess
  the section name table (.shstrtab) and symbol string table\n(.strtab) headers without
  first ensuring that their types are\nSHT_STRTAB. If a section type is SHT_NULL or
  SHT_NOBITS, sh_offset has\nnot been validated and may reference out-of-bounds memory
  when\ndereferenced in elf_validity_cache_secstrings or\nelf_validity_cache_strtab.\n\
  \nValidate that both string section headers are of type SHT_STRTAB before\ncaching
  them."
