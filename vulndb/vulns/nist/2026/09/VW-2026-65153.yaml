title: A security vulnerability has been detected in weiqingwen 
  spring-boot-forum up to 538eecc3c6b85fdf0768ab4e8354b48c0c17d94f. Affected is 
  the function validate of the file 
  src/main/java/com/qingwenwei/util/NewUserFormValidator.java of the component 
  Avatar Upload. The manipulation of the argument Username leads to path 
  traversal. The attack can be initiated remotely. The exploit has been 
  disclosed publicly and may be used. Continious delivery with rolling releases 
  is used by this product. Therefore, no version details of affected nor updated
  releases are available. The vendor was contacted early about this disclosure 
  but did not respond in any way.
