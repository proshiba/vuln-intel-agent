title: 'A vulnerability was determined in star7th showdoc up to 3.9.1. This vulnerability
  affects unknown code of the file web_src/public/editor.md/editormd.js of the component
  API Page Save Endpoint. Executing a manipulation can lead to cross site scripting.
  The attack may be launched remotely. The exploit has been publicly disclosed and
  may be utilized. Upgrading to version 3.9.2 is able to resolve this issue. This
  patch is called a8ea1520850b4242f395247f72e87e597506cef0. Upgrading the affected
  component is recommended. The vendor confirms: "The fix [...] sets Mermaid `securityLevel`
  to `strict`, disables `htmlLabels`, and sanitizes rendered SVG with DOMPurify."'
