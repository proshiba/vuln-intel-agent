title: Dell SCG 5.0 Appliance versions prior to 5.36.00.16 and Dell SCG 5.0 
  Application versions prior to 5.36.00.00, contains an Execution with 
  Unnecessary Privileges vulnerability. An unauthenticated attacker with local 
  access could potentially exploit this vulnerability, leading to Protection 
  mechanism bypass. This vulnerability is considered critical because a 
  low-privileged operator with SSH access to the SCG host can gain root-level 
  access to the host without requiring a password by leveraging the exposed 
  Docker socket. Additionally, an attacker who compromises a service running 
  within the orchestrator container can access the same socket and escape the 
  container boundary to obtain host-level control. Dell recommends that 
  customers upgrade at the earliest opportunity.
