title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/pagewalk:
  fix stale walk->action escaping walk_pmd_range()\n\nIf ->pmd_entry() sets walk->action
  = ACTION_AGAIN, the pmd_none() check is\nretried.  The PMD entry may be cleared
  at the point of retry.\n\nIn this case, if walk->ops->install_pte is not specified,
  the code\ncontinues to the next PMD entry in the range without resetting\nwalk->action
  to ACTION_SUBTREE.\n\nThis leaves walk->action erroneously set to ACTION_AGAIN,
  which is\nincorrect.\n\nThis was incorrect but not problematic up until commit 3b89863c3fa4\n\
  (\"mm/pagewalk: fix race between concurrent split and refault\") which\nupdated
