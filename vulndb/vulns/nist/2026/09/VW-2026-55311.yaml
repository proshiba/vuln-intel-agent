title: A security issue exists in MongoDB's LDAP authorization integration where
  pooled LDAP connections can retain stale authentication identities after user 
  authentication under certain configurations. Subsequent authorization queries 
  may execute under an unintended LDAP identity rather than the expected one. 
  This can result in incorrect role assignments based on the LDAP directory's 
  access control configuration, potentially allowing an authenticated user to 
  acquire elevated privileges that were not intended by the deployment's 
  authorization policy.
