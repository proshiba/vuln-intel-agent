title: zstd-jni versions before 1.5.7-14 fail to validate closed state in 
  setDict, setLongMax, setLevel and setRefMultipleDDicts methods of stream 
  classes. Attackers can call these methods on closed streams to write through 
  freed native pointers, corrupting unrelated objects or crashing the JVM.
