title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  validate plane degamma LUT size for private color prop\n\nUnlike the CRTC degamma
  path, which is guarded by\namdgpu_dm_verify_lut_sizes(), the per-plane degamma LUT
  size was never\nvalidated before use. __set_dm_plane_degamma() passed the user-supplied\n\
  size straight into __is_lut_linear() and, for a non-linear LUT, into\n__set_input_tf()
  -> __drm_lut_to_dc_gamma(), the latter always iterating\nMAX_COLOR_LUT_ENTRIES entries
  regardless of the actual LUT size.\n\nA malformed AMD_PLANE_DEGAMMA_LUT blob (e.g.
  a single entry) could thus\ntrigger a divide-by-zero in __is_lut_linear() or an
  out-of-bounds read in\n__drm_lut_to_dc_gamma(). Reject any plane degamma LUT whose
  size does not\nmatch MAX_COLOR_LUT_ENTRIES, mirroring the invariant the code already\n\
  asserts a few lines below (and which the CRTC path enforces).\n\nThe AMD_PLANE_DEGAMMA_LUT
  property is only exposed on builds with\nAMD_PRIVATE_COLOR defined."
