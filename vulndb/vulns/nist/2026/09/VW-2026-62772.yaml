title: WireGuard Portal, or wg-portal, is a web-based configuration portal for 
  WireGuard server management. From 2.2.0 until 2.3.0, the authenticated GET 
  /api/v0/ws statistics WebSocket in 
  internal/app/api/v0/handlers/endpoint_websocket.go subscribes to 
  TopicPeerStatsUpdated and TopicInterfaceStatsUpdated and forwards every 
  TrafficDelta event without per-user authorization in handleWebsocket(). A 
  low-privilege user can enumerate peer public keys through EntityId and monitor
  BytesReceived and BytesTransmitted values for peers belonging to other users. 
  The same connection exposes interface_stats and interface names that the REST 
  API limits to administrators. Tunnel content, AllowedIPs, and user identities 
  remain authorization-gated. This issue is fixed in version 2.3.0.
