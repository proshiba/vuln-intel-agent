title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915:
  Guard against NULL driver_data in i915_pci_probe()\n\npci_match_device() can return
  the dummy pci_device_id_any entry\nwhen a device is force-bound via sysfs driver_override,
  in which\ncase ->driver_data is unset (NULL). i915_pci_probe() casts it to\nstruct
  intel_device_info * unconditionally and dereferences\nintel_info->require_force_probe,
  causing a NULL-ptr-deref.\n\n(cherry picked from commit 2727922084672cc274ecea726ea00363c2893731)"
