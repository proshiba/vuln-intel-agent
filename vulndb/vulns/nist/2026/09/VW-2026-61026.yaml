title: The WP Import Export Lite WordPress plugin before 3.9.33 does not 
  validate a path taken from stored, user-supplied data before recursively 
  deleting the directory it resolves to, allowing users to whom an administrator
  has delegated a WP Import Export Lite WordPress plugin before 3.9.33 
  capability to delete arbitrary directories, and every file within them, 
  including outside the web root.
