title: Improper neutralization of input in Apache Roller 6.1.5 allows an 
  anonymous remote attacker to store a crafted comment-author URL that can 
  execute script in the session of a weblog moderator or global administrator 
  when the comment management page is viewed. This affects sites that permit 
  comments on at least one weblog and whose moderator subsequently reviews the 
  submitted comment; no non-default server setting is required. Users are 
  recommended to upgrade to Apache Roller 6.1.6 or later.
