title: A flaw has been found in Trusted Domain Project OpenDMARC up to 1.4.2. 
  Affected by this vulnerability is the function opendmarc_spf_ipv6_explode in 
  the library libopendmarc/opendmarc_spf.c of the component SPF Parser. This 
  manipulation of the argument cp causes null pointer dereference. It is 
  possible to initiate the attack remotely. The exploit has been published and 
  may be used. The vendor was contacted early about this disclosure but did not 
  respond in any way.
