title: 'Nuclei is a vulnerability scanner built on a simple YAML-based DSL. From 3.0.0
  until 3.10.0, the DAST template loading branch does not apply the unsigned code-template
  signature check before accepting a template that contains both a fuzzing: block
  and an unsigned code: block. When an operator enables -dast, an untrusted multiprotocol
  template can place an unsigned code request into the execution queue and run arbitrary
  shell commands even without -code or a valid cryptographic signature. The issue
  affects CLI DAST scans and SDK integrations that enable DAST while accepting attacker-supplied
  templates. This issue is fixed in version 3.10.0.'
