title: GestSup versions before 3.2.62 fail to properly sanitize HTML email 
  bodies in the IMAP LOGIN connector, allowing unauthenticated attackers to 
  store arbitrary JavaScript in ticket descriptions and replies. Attackers can 
  send emails to the monitored mailbox containing script tags and event handlers
  that execute in technician browsers, enabling ticket data theft and 
  unauthorized actions.
