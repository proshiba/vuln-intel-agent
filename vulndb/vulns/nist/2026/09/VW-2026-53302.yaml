title: Craft CMS versions >= 5.0.0-RC1 and < 5.10.11 fail to perform an 
  independent authorization check in ElementsController::actionDeleteForSite(). 
  The method loads an element with checkForProvisionalDraft enabled and runs the
  deletion authorization check against the user's own provisional draft (which 
  only verifies draft ownership), then propagates the deletion to the canonical 
  element without re-checking permissions. As a result, an authenticated user 
  who has viewEntries, viewPeerEntries, saveEntries, savePeerEntries, and 
  editSite permissions but lacks the deleteEntriesForSite permission can 
  hard-delete a canonical entry's site record (and, for single-site entries, the
  full element and content), which is irrecoverable via Craft's recycle bin.
