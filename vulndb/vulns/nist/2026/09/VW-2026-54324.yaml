title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  remove fscache backend entirely\n\nEROFS over fscache was introduced to provide
  image lazy pulling\nfunctionality. After the feature landed, the fscache subsystem
  made\nnetfs a new hard dependency, which is unexpected for a local filesystem\n\
  and has an kernel-defined caching hierarchy which could be inflexible\ncompared
  to the fanotify pre-content hooks. Therefore, this feature has\nbeen deprecated
  for almost two years.\n\nAs EROFS file-backed mounts and fanotify pre-content hooks
  both upstream\nfor a while and already providing equivalent functionality (erofs-utils\n\
  has supported fanotify pre-content hooks), let's remove the fscache\nbackend now.\n\
  \nThe main application of this feature is Nydus [1], and they plan to move\nto use
  fanotify pre-content hooks in the near future too.\n\nI hope this patch can be merged
  into Linux 7.2, which is also motivated\nby newly found implementation issues [2][3]
  that are not worth\ninvestigatin"
