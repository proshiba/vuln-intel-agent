title: Faust.js is a headless WordPress toolkit. Prior to 1.8.11, the FaustWP 
  WordPress plugin authenticates only the ciphertext in its token envelope and 
  excludes the 16-byte initialization vector from the HMAC in 
  WPE\FaustWP\Auth\encrypt() and WPE\FaustWP\Auth\decrypt() in 
  plugins/faustwp/includes/auth/functions.php. A logged-in non-administrator who
  obtains an authorization code from GET /generate can modify the 
  unauthenticated initialization vector so that CBC decryption changes the token
  type and user identifier while the HMAC remains valid. This can produce an 
  access token for an Administrator and permit full WordPress REST API access, 
  administrator-account creation, plugin installation, and arbitrary code 
  execution. This issue is fixed in repository version 1.8.11.
