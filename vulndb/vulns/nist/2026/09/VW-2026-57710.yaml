title: Improper neutralization of special elements in data query logic in the 
  embedded-document relation handling of the MongoDB integration for Laravel can
  cause a caller-supplied embedded record identifier to be interpreted as a 
  query condition rather than as a literal identifier. An authenticated user who
  can influence such an identifier may delete all embedded documents in a 
  targeted record or overwrite an embedded document other than the intended 
  target.
