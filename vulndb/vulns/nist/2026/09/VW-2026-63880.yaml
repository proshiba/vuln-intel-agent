title: A vulnerability has been found in Hyve5 Leantime up to 3.9.8. Affected by
  this issue is some unknown functionality of the file 
  /app/Domain/Dashboard/Templates/show.blade.php of the component Project 
  Dashboard. Such manipulation leads to cross site scripting. The attack may be 
  performed from remote. The exploit has been disclosed to the public and may be
  used. "EDIT perm" needed to plant; fires cross-user for anyone viewing the 
  project dashboard since the poisoned label name is echoed raw. The vendor was 
  contacted early about this disclosure but did not respond in any way.
