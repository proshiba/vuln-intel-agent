title: Contrast (Edgeless Systems) through 1.20.0 performs unanchored suffix 
  matching when selecting per-registry configuration in the imagepuller. 
  Config.registryFor strips a single trailing dot and then uses 
  strings.HasSuffix(hostname, fqdn) without requiring a DNS label boundary, so a
  registry entry such as [registries."ghcr.io."] is also applied to any host 
  whose name merely ends in that byte sequence, including attacker-registered 
  domains such as evilghcr.io. When an image or layer is pulled from such a 
  sibling domain, the imagepuller sends the configured Authorization header 
  (basic auth, registry token, or identity token), trusts the configured custom 
  CA bundle, follows the configured mirror, and honours insecure-skip-verify 
  (disabling TLS verification) for that host. Image integrity is not affected, 
  as image bytes remain pinned by digest in the policy and are validated after 
  the pull. Configurations that use a leading dot (e.g., 
  [registries.".example.registry"]) are unaffected.
