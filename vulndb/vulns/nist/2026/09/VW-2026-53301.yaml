title: Craft CMS versions before 5.10.11 contain an authorization bypass 
  vulnerability in ElementsController::actionDuplicate() that allows 
  authenticated users with createEntries permission to delete peer provisional 
  drafts. Attackers can exploit the deleteProvisionalDraft parameter to delete 
  another user's unsaved draft without proper authorization checks, gaining 
  access to the victim's in-progress content.
