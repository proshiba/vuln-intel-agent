title: A vulnerability was identified in GPAC 26.08-DEV. This vulnerability 
  affects the function gf_rtp_parse_ttxt of the file src/ietf/rtp_depacketizer.c
  of the component RTP Depacketizer. Such manipulation of the argument size 
  leads to out-of-bounds read. It is possible to launch the attack remotely. 
  Upgrading to version abi-16.26 is able to resolve this issue. The name of the 
  patch is 6bb0f64b4d1039c0fecd14ee2c1ee861d8661a68. The affected component 
  should be upgraded.
