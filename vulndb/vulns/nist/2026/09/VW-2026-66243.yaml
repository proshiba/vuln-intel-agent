title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix transaction overflow during writeback\n\nCommit 95ad8ee45cdb (\"ext4: correct
  the reserved credits for extent\nconversion\") was correct to note that we need
  to reserve enough credits\nfor all extents possibly underlying a large folio. However
  it was too\neager to reduce the number of reserved credits. Extent conversion may\n\
  not only need to touch several leaf extent blocks, it may also need to\nsplit extents
  - for example a single large unwritten extent may need to\nbe split into many small
  written ones in case of sparse folio dirtying.\nThis can thus result not only in
  extent leaf modifications but also in a\nneed to allocate new extent tree nodes.
  As a result the reserved\ntransaction credits were not sufficient in some corner
  cases. Use\next4_meta_trans_blocks() for correct upper bound credit estimate."
