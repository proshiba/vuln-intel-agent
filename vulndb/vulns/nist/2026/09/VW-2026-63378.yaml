title: CordysCRM is an open source AI-powered customer relationship management 
  system that supports private deployment. Prior to 1.7.2, GET 
  /mcp/form/config/{formKey} calls McpController.getMcpField without 
  authentication because ShiroFilter.addPublicPathFilters marks /mcp/** as 
  anonymous and the controller has no permission annotation. An unauthenticated 
  caller can obtain field names, types, required flags, default values, options,
  validation rules, and binding sources for CRM modules, allowing reconstruction
  of the application data model and more targeted attacks against other inputs. 
  This issue is fixed in version 1.7.2.
