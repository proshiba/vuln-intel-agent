title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: bound TLV walk in mt7996_mcu_get_chip_config\n\nThe response TLV loop
  advanced by tlv->len without a minimum, so a\ntheoretical firmware response containing
  a zero-length TLV could spin\nforever, hanging the CPU during device probe.\nThe
  u32 payload was also read without bounds checking.\nReject a short fixed field,
  stop on a TLV whose length underruns the\nheader or overruns the skb."
