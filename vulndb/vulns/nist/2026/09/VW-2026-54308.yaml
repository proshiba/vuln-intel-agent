title: SolidInvoice is an open-source invoicing platform. Prior to version 
  3.0.1, the REST API authenticator accepts bearer tokens via a `?token=` URL 
  query parameter as a fallback to the `X-API-TOKEN` header. This causes 
  long-lived API credentials to be recorded in server access logs, proxy logs, 
  browser history, and HTTP Referer headers sent to third-party origins. Version
  3.0.1 fixes the issue.
