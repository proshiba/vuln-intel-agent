title: "Authorization bypass through User-Controlled key vulnerability in Apache Camel
  K.\n\n\n\nAn authorization vulnerability in custom resource resolution allows a
  tenant to reference secrets by name in the operator namespace, potentially exposing
  secrets belonging to other tenants or operator components.\n\n\n\nThis issue affects
  Apache Camel K: from 2.0.0 before 2.9.3, from 2.10.1 before 2.10.2.\n\n\n\nUsers
  are recommended to upgrade to version 2.9.3, 2.10.2 or 2.11.0, which fixes the issue."
