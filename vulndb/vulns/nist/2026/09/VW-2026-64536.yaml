title: MPXJ is an open source library to read and write project plans from a 
  variety of file formats and databases. From 7.3.0 until 16.5.0, reading a 
  suitably crafted Primavera P3 PRX or SureTrak STX file can cause MPXJ to write
  files to arbitrary locations in the filesystem. This issue is fixed in version
  16.5.0.
