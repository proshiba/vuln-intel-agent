title: "Allocation of Resources Without Limits or Throttling vulnerability in elixir-mint
  mint allows a remote HTTP server to exhaust memory on the client host and cause
  a denial of service.\n\nTwo HTTP/1 response-parser states accumulate server data
  without any cap. In lib/mint/http1.ex, decode_status_line/4 stores the unconsumed
  data in conn.buffer when the status line is incomplete, and decode_body/5 does the
  same for an unterminated chunk-extension line. Both wait for a CRLF the server never
  has to send, and conn.buffer is prepended to every subsequent socket message. The
  :max_header_list_size budget is wired only into decode_headers/5 and decode_trailer_headers/4,
  so neither of these states is covered by it. A malicious server, or one reached
  through an attacker-controlled redirect or a fetched URL, streams bytes indefinitely
  until the BEAM node is killed by the operating system out-of-memory handler. The
  chunk-extension variant is reached after a valid status line and a complete, valid
  hea"
