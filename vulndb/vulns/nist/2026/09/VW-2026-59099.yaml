title: A flaw was found in GIMP's PSP (Paint Shop Pro) file loader. When 
  processing a compressed selection channel, a heap-based buffer overflow can 
  occur due to a mismatch between the allocated buffer size and the amount of 
  data decompressed. A remote attacker could exploit this vulnerability by 
  crafting a malicious PSP file. Opening this file in GIMP could lead to a crash
  or arbitrary code execution.
