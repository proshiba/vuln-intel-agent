title: The WPForms – AI Form Builder for WordPress – Contact Forms, Payment 
  Forms, Survey Form, Quiz & More plugin for WordPress is vulnerable to 
  Reflected Cross-Site Scripting via 'page_title' POST Parameter via 
  {page_title} Smart Tag in all versions up to, and including, 2.0.2 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. This is only exploitable on forms whose admin-authored 
  confirmation message places the {page_title} Smart Tag inside an HTML 
  attribute context.
