title: ConvertX 0.17.0 contains an arbitrary file read vulnerability in the 
  xelatex converter that allows authenticated users to read files by uploading 
  LaTeX files with input directives. Attackers can upload .tex files containing 
  \\input{path} or \\verbatiminput{path} directives to have the TeX engine read 
  arbitrary files accessible to the server process and include them in 
  downloadable PDF output.
