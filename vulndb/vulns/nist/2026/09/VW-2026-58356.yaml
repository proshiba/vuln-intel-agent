title: "In the Linux kernel, the following vulnerability has been resolved:\n\njbd2:
  check need_resched() when skipping busy checkpoint buffers\n\njournal_shrink_one_cp_list()
  skips busy checkpoint buffers when called\nwith JBD2_SHRINK_BUSY_SKIP.  The continue
  statement on this path also\nskips the need_resched() check at the end of the loop
  body.\n\nConsequently, when a checkpoint list contains mostly busy buffers, the\n\
  shrinker can walk the entire list while holding journal->j_list_lock,\neven when
  a reschedule has been requested.  Large checkpoint lists under\nmemory pressure
  can therefore cause long lock hold times and leave other\nCPUs spinning on j_list_lock,
  resulting in soft lockups or RCU stalls.\n\nRoute the busy-buffer path through the
  need_resched() check so that the\nshrinker can release j_list_lock and reschedule
  promptly, restoring\nparity with the clean-buffer path, which already checks need_resched().\n\
  This does not change which checkpoint buffers are eligible for removal."
