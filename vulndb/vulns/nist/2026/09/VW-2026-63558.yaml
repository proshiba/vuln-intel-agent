title: 'A vulnerability was detected in grimmory-tools grimmory up to 3.3.3/3.4.1.
  Affected by this vulnerability is the function streamFileToResponse of the file
  backend/src/main/java/org/booklore/controller/KoboController.java of the component
  Download Endpoint. Performing a manipulation of the argument bookId results in authorization
  bypass. The attack may be initiated remotely. The exploit is now public and may
  be used. Issue #2431 is closed as completed, but its only comment states that the
  issue “has already been reported elsewhere.” No fixing commit or pull request is
  identified there.'
