title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  fix interlaced ztailpacking pclusters\n\nOn-disk sizes of interlaced pclusters should
  be block-aligned, and\nztailpacking interlaced pclusters should be invalid at all.\n\
  \nCurrently, mkfs.erofs won't generate any interlaced pcluster with\nztailpacking
  enabled, so this doesn't affect any existing valid\nfilesystems.\n\nHowever, crafted
  images can contain invalid interlaced ztailpacking\npclusters, resulting in an out-of-bounds
  read from a kmap'd page and\ncopying irrelevant kernel memory into userspace-visible
  page cache."
