title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  backtrack_insn(): Handle ld_{abs,ind} subprog exit edge\n\nNicholas Carlini reported
  a bug in precision backtracking mechanism\nfor BPF_LD | BPF_{IND,ABS} instructions.
  These instructions are\nmodelled as two branches:\n- fallthrough;\n- implicit exit
  from current subprogram.\n\nThe implicit exit case was not handled by the backtrack_insn()\n\
  function. When backtracking such a path backtrack_insn() did not\ncall bt_subprog_enter(),
  which meant that backtracking continued\nmanipulating precision marks in a caller
  frame, while looking at\ninstructions in a callee frame.\n\nThis lead to segmentation
  faults during verification (see the\nselftest), or unsound state pruning."
