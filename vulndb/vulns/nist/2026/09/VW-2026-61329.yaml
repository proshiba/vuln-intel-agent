title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-tcp:
  check the data direction of a C2HData PDU\n\nnvme_tcp_handle_c2h_data() finds the
  request by command id and checks\nthat it has a payload, but it does not check that
  the command asked for\ndata to be read.  A controller that answers a write command
  with C2HData\ntherefore reaches nvme_tcp_recv_data(), where _copy_to_iter() hits\n\
  WARN_ON_ONCE(i->data_source) and returns 0.  The receive path turns that\ninto -EFAULT
  and resets the controller.\n\nNo data is copied, so this is not memory corruption.\
  \  What a controller\ngets is a kernel warning it can raise at will, which is fatal
  on a host\nbooted with panic_on_warn.\n\nThe send path already knows the direction
  - it consults rq_data_dir()\nwhen it builds a command - and nvme_tcp_handle_r2t()
  checks the length\nand the offset of the request it names.  The C2HData path does
  not check\nthe direction at all.\n\nReject a C2HData PDU whose command is not a
  read.  Rejecting it fails\nthe"
