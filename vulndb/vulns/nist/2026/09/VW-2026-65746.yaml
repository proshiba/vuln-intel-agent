title: Uncontrolled Resource Consumption (CWE-400 / CWE-407) in the ANTLR 3 
  search query parser (QueryParser / Query.g) in Gerrit Code Review versions 
  2.0.19 through 3.12.9, 3.13.0 through 3.13.8, and 3.14.0 through 3.14.2 allows
  an unauthenticated remote attacker (or an authenticated user if anonymous read
  access is disabled) to cause a persistent denial of service (CPU exhaustion 
  and HTTP worker thread pool starvation requiring a server restart) via crafted
  search queries containing deeply nested parentheses sent to query evaluation 
  endpoints (/changes/?q=, /accounts/?q=, /groups/?query=, /projects/?query=, 
  /Documentation/?q=, /changes/{id}/query?expression=, or SSH gerrit query). 
  Because syntactic predicates in conditionOr and conditionAnd recurse via 
  conditionBase without memoization prior to capability or visibility checks and
  worker threads do not abort when the client disconnects, a small number of 
  requests (such as 25 requests matching default httpd.maxThreads) can 
  permanently pin all
