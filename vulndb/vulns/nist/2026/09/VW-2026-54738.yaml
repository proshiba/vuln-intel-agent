title: A vulnerability was determined in Advantech WISE-6610-NB, WISE-6610-EB, 
  WISE-6610-TB, WISE-6610-JB, WISE-6610-CB, WISE-6610-EL-NB, WISE-6610-EL-EB, 
  WISE-6610-EL-TB, WISE-6610-EL-JB, WISE-6610-EL-CB, WISE-6610P-DEA, 
  WISE-6610P-DNA and WISE-6610P-DTA 1.2.1_20251110. This affects the function 
  basicstation_apply of the component Basic Station Certificate-Deletion 
  Handler. This manipulation of the argument act causes command injection. The 
  attack can be initiated remotely. The exploit has been publicly disclosed and 
  may be utilized. Upgrading to version 1.2.4_20260821 is able to mitigate this 
  issue. Upgrading the affected component is advised. The vendor was contacted 
  early, responded in a very professional manner and quickly released a fixed 
  version of the affected product.
