title: "The Velocity template engine, utilized by the affected product, accepts and
  processes template syntax without sufficient sanitization or validation of user-controlled
  input. This allows an authenticated administrator to inject arbitrary template syntax.\n\
  \nSuccessful exploitation enables an attacker with administrative privileges to
  execute arbitrary template code on the server. This can lead to significant security
  consequences, including remote code execution, manipulation of data, and unauthorized
  access to sensitive information."
