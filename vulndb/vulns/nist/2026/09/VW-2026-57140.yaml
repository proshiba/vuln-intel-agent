title: VLC media player copies an RTSP response line into a fixed buffer without
  guaranteeing termination and then treats that buffer as a C string. 
  RtspReadLine in modules/access/rtsp/access.c calls strncpy with the full 
  buffer length, which writes no terminator when the source line is at least as 
  long as the destination, and rtsp_get in modules/access/rtsp/rtsp.c allocates 
  that buffer as BUF_SIZE bytes and passes it to strdup. When a server returns a
  line of 4096 bytes or more, strdup measures its length past the end of the 
  allocation and copies adjacent heap bytes until an incidental zero byte. 
  Because the affected line is the Session header, the disclosed bytes are 
  retained as the session identifier and sent back to the server on every 
  subsequent request, so the operator of a hostile server reads heap memory from
  the client rather than inferring it. The attacker controls the line length and
