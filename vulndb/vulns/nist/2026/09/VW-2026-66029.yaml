title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_route: free emptied bucket on filter move\n\nroute4_change can move an existing
  filter to a different top-level\nbucket: route4_set_parms recomputes the handle
  from TCA_ROUTE4_TO/\nFROM/IIF, and the handle-mismatch check is gated on the 'new'
  flag, so\nfor an existing filter the new handle may differ from the old one and\n\
  land in a different bucket. When this happens, the filter is unlinked\nfrom the
  old bucket, but the bucket itself is never freed once it goes\nempty. The stale
  empty bucket remains in head->table[], causing\nroute4_delete to report *last=false
  even after the last live filter is\ngone. That pins the empty tcf_proto and causes
  a leak.\n\nFix this by refcounting the filters linked to a bucket and freeing the\n\
