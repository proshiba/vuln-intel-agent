title: A vulnerability was found in RaspAP raspap-webgui up to 3.5.5. Affected 
  by this issue is the function PluginInstaller::addSudoers of the file 
  src/RaspAP/Plugins/PluginInstaller.php of the component sudo Configuration. 
  Performing a manipulation results in improper privilege management. The attack
  may be initiated remotely. The exploit has been made public and could be used.
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
