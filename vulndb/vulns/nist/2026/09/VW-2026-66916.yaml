title: The Download Manager WordPress plugin before 7.5.6 does not sanitise and 
  escape data submitted through its email-locked download subscription form 
  before outputting it back in an admin page, which could allow unauthenticated 
  attackers to perform Stored Cross-Site Scripting attacks against 
  administrators. This affects the commercial Pro edition only; the free 
  Download Manager WordPress plugin before 7.5.6 published under the same slug 
  does not ship the affected feature.
