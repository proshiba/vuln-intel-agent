title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2 and 7.1.0, zammad's HTML sanitizer (HtmlSanitizer::Strict) blocks 
  external URLs in  to prevent remote content loading, but the srcset attribute,
  also allowlisted for , is not subject to the same check. This oversight allows
  an attacker to embed arbitrary external URLs in the srcset attribute just by 
  sending an e-mail, effectively bypassing the external content protection. When
  an agent views the ticket containing the malicious srcset, the browser will 
  silently load the attacker-controlled URL, resulting in the leakage of the 
  agent's IP address, User-Agent, Referer, and the exact time the ticket was 
  viewed. HtmlSanitizer::Strict got extended to block external URLs in the 
  srcset attribute of  tags. This was done to prevent tracking pixels and 
  external content loading, which could compromise user privacy. This issue is 
  fixed in versions 7.0.2 and 7.1.0.
