title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ufs: debugfs: Reserve space for a string terminator\n\nufs_saved_err_write() copies
  user input into a zero-initialized stack\nbuffer and passes it to kstrtoint(). A
  write that fills the entire buffer\noverwrites its only terminator.\n\nReject an
  input whose length leaves no room for the trailing NUL."
