title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_event: validate LE Set CIG Parameters response\n\nThe Command Complete dispatch
  validates only the fixed part of the LE Set\nCIG Parameters response. After that
  part is pulled from the skb,\nhci_cc_le_set_cig_params() trusts num_handles and
  reads each entry in the\ntrailing handle array.\n\nMatching num_handles against
  the command's num_cis does not guarantee\nthat the response contains the advertised
  handles. A truncated response\nfrom a malfunctioning controller can therefore make
  the handler read\nbeyond the skb data.\n\nValidate that the remaining skb data contains
  all advertised handles.\nInclude this in the existing response validation so malformed
  responses\nalso follow the established CIG failure handling."
