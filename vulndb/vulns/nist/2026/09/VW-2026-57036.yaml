title: The PublishPress Capabilities – User Role Editor, Access Permissions, 
  User Capabilities, Admin Menus plugin for WordPress is vulnerable to Privilege
  Escalation in all versions up to, and including, 2.50.0. This is due to the 
  `addPluginCapabilities()` function unconditionally granting the Editor role 
  all 15 `manage_capabilities_*` capabilities — including `manage_capabilities`,
  `manage_capabilities_roles`, `manage_capabilities_settings`, and 
  `manage_capabilities_backup` — via a hard-coded `$eligible_roles = 
  ['administrator', 'editor']` assignment that runs automatically on the first 
  `admin_init` after plugin activation with no administrator opt-in, persisting 
  the grants directly to the database. This makes it possible for authenticated 
  attackers with Editor-level access to elevate their privileges to a site-wide 
  capability manager, enabling them to create, rename, and delete non-system 
