title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtlwifi: rtl8192du: Fix possible memory leak in rtl92du_init_sw_vars()\n\nThe memory
  allocated inside rtl92du_init_shared_data() is not freed in\nany of the subsequent
  error paths in rtl92du_init_sw_vars().\nFix that by adding a call to rtl92du_deinit_shared_data()
  in the error\npath."
