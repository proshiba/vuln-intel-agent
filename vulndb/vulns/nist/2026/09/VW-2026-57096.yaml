title: Dell SCG 5.0 Appliance versions prior to 5.36.00.16 and Dell SCG 5.0 
  Application versions prior to 5.36.00.00, contains an Insufficient 
  Verification of Data Authenticity vulnerability. An unauthenticated attacker 
  with remote access could exploit this, leading to unauthorized access. This 
  vulnerability is considered critical as an unauthenticated attacker can 
  repeatedly reuse a captured request to generate ADMIN access and refresh 
  tokens. Since there is no nonce validation or time limit on requests, the 
  attack can be performed indefinitely. Dell recommends customers to upgrade at 
  the earliest opportunity
