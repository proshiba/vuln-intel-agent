title: A vulnerability was identified in ipa-lab HackingBuddyGPT up to 0.5.0. 
  This affects the function ssh_run_command of the file 
  src/hackingBuddyGPT/extensions/ssh_run_command.py. Such manipulation leads to 
  os command injection. The attack can be launched remotely. The exploit is 
  publicly available and might be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
