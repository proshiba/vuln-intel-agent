title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  mxs-dcp - fix source scatterlist length access\n\nmxs_dcp_aes_block_crypt() uses
  sg_dma_len() without mapping the source\nscatterlist with dma_map_sg() first. Therefore,
  sg_dma_len() is invalid\nand could return zero or a stale DMA length, causing encryption
  and\ndecryption to process the wrong number of bytes when\nCONFIG_NEED_SG_DMA_LENGTH=y.\n\
  \nUse the original scatterlist length instead."
