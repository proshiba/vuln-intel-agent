title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  sensor: custom: Fix use-after-free in enable_sensor\n\nenable_sensor_store() can
  call set_power_report_state(), which\ndereferences sensor_inst->power_state and
  sensor_inst->report_state.\nThese pointers refer to entries in sensor_inst->fields.\n\
  \nCreate the field attributes before exposing the enable_sensor sysfs\nattribute,
  so enable_sensor cannot be accessed before the state it\ndepends on has been initialized.\n\
  \nOn remove, delete enable_sensor before freeing the field attributes,\nso a concurrent
  sysfs write cannot dereference freed memory through\npower_state or report_state."
