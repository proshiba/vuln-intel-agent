title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-tcp:
  fix host memory disclosure on R2T for a read command\n\nnvme_tcp_handle_r2t() does
  not check the direction of the request the\nR2T refers to. A malicious controller
  can send an R2T for a READ and\nthe host will answer it: nvme_tcp_setup_h2c_data_pdu()
  builds the\nH2CData header and nvme_tcp_try_send_data() sends the request's data\n\
  buffer. That buffer is the READ destination, so its contents go to the\ncontroller.\n\
  \nThe command then completes normally and nothing is logged.\n\nAgainst a test controller
  that answers every READ with an R2T, a 4096\nbyte buffered read returned all 4096
  bytes, split over two R2Ts. The\npages contained stale kernel data, including an
  array of struct page\npointers.\n\nReject an R2T for a request that is not a write."
