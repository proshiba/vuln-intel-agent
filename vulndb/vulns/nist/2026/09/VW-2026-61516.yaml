title: Pocketbase is an open source web backend written in go. Prior to 0.22.48 
  and 0.39.7, PocketBase's panic-recovery middleware covers regular request 
  handling but not internal child and worker goroutines. A panic in one of these
  internal goroutines can escape recovery and terminate the server process, 
  causing a denial of service. The remediation introduces routine.SafeWrap to 
  convert recovered panics into regular errors and applies it to the affected 
  internal worker functions. This issue is fixed in versions 0.22.48 and 0.39.7.
