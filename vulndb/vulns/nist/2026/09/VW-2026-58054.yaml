title: "The two built-in name-finder patterns exposed by\nopennlp.tools.namefind.RegexNameFinderFactory
  - DEFAULT_REGEX_NAME_FINDER.EMAIL\nand DEFAULT_REGEX_NAME_FINDER.URL - contain ambiguous
  nested quantifiers. An\napplication that obtains these finders through\nRegexNameFinderFactory.getDefaultRegexNameFinders(...)
  and then applies them to\nuntrusted text through RegexNameFinder.find(String[])
  or RegexNameFinder.find(String)\ncan be driven into super-linear backtracking or
  into unbounded matcher recursion by a\nsmall crafted input.\n\n\n\n\n\nFor the EMAIL
  pattern, a long run of local-part characters that is never followed by an\n@ forces
  the matcher to re-scan to end-of-input from every starting offset. Cost grows\n\
  quadratically with input length: an input of approximately 32 KB consumes several
  seconds\nof CPU in a single find() call and returns no match, and each doubling
  of the input\nmultiplies the cost roughly four-fold.\n\n\n\n\n\nFor the URL pattern,
  the query-string sub-expression nests a capturing repet"
