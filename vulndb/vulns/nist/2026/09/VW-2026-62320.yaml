title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclocksource/drivers/samsung_pwm:
  Switch to raw_spinlock_t type\n\nSamsung PWM timer might be used as a clock source
  on some legacy systems.\nWhen PREEMPT_RT is enabled on ARM, regular spinlock is
  converted to a\nsleeping lock (mutex-based), which must not be used in atomic context\n\
  such as hard interrupt handlers. Switch the samsung_pwm_lock to the\nraw_spinlock,
  which remains a true non-sleeping spinlock even\nunder PREEMPT_RT."
