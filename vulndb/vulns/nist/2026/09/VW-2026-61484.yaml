title: zlt2000 microservices-platform through 6.0.0 contains a missing 
  authorization vulnerability where the zlt.security.auth.urlPermission.enable 
  flag defaults to false, disabling all permission checks after authentication. 
  Authenticated users with no roles can access administrative APIs including 
  user management, role assignment, and Elasticsearch index operations by 
  bypassing the disabled authorization enforcement.
