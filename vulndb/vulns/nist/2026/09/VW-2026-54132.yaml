title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_event: fix LE list UAF on reset\n\nhci_cc_reset() clears the LE accept and resolving
  lists without taking\nhdev->lock. Other command-complete handlers serialize updates
  to these\nlists with that lock, and the debugfs readers hold it while walking them.\n\
  \nThis permits the reset completion and a debugfs read to interleave as\nfollows:\n\
  \n  hci_rx_work                 debugfs reader\n  -----------                 --------------\n\
  \                              lock hdev->lock\n                              fetch
  current entry\n  list_del(entry)\n  kfree(entry)\n                             \
  \ read entry fields\n\nThe reader then dereferences a freed list entry and may follow
  its stale\nnext pointer.\n\nKASAN reported:\n\n  BUG: KASAN: slab-use-after-free
  in white_list_show+0x15f/0x180\n  Read of size 1 at addr ffff8881015dab16 by task
  poc/95\n\n  Call Trace:\n   white_list_show+0x15f/0x180\n   seq_read_iter+0x3ff/0x1190\n\
  \   seq_read+0x2"
