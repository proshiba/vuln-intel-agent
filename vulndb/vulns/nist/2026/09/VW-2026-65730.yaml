title: A vulnerability was determined in chonkie-inc littrs 0.6.1/0.6.2. 
  Impacted is the function Sandbox::mount of the file crates/littrs/src/lib.rs. 
  Executing a manipulation of the argument relative can lead to path traversal. 
  The attack may be performed from remote. The exploit has been publicly 
  disclosed and may be utilized. The vendor was contacted early about this 
  disclosure but did not respond in any way.
