title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/ethosu:
  fix job completion fence cleanup\n\nethosu_ioctl_submit_job() allocates done_fence
  before validating buffer\nhandles. Errors after allocation call ethosu_job_err_cleanup(),
  which frees\nthe job but leaks the uninitialized fence.\n\nA scheduler dependency
  error also lets ethosu_job_run() return before\ndma_fence_init(). Normal cleanup
  then passes a zeroed refcount to\ndma_fence_put().\n\nRelease done_fence in the
  common cleanup path and use\ndma_fence_was_initialized() to distinguish initialized
  fences from raw\nallocations.\n\n[robh: also fix goto]"
