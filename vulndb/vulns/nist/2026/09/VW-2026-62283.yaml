title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  smbdirect: release pending child sockets outside the handler lock\n\nsmbdirect_socket_destroy()
  releases the listener's pending/ready child\nsockets while still holding the listener's
  handler lock, the\n&id_priv->handler_mutex taken via rdma_lock_handler(), not\n\
  sc->listen.lock, and before the listener's own rdma_destroy_id().\nThat ordering
  has one real consequence and one cosmetic one.\n\nThe real one: smbdirect_socket_release()
  drops the child's last\nreference, which destroys the child's cm_id.  Doing that
  before the\nlistener's rdma_destroy_id() lets _cma_cancel_listens(), running from\n\
  the listener's _destroy_id(), walk an already freed child id_priv,\nwhich KASAN
  catches as a slab-use-after-free during listener shutdown:\n\n[ 4758.909130] BUG:
  KASAN: slab-use-after-free in __mutex_lock+0x1469/0x1560\n[ 4758.911450] Read of
  size 1 at addr ffff88821c381db4 by task ksmbd.control/1652\n[ 4758.913262] Call
  Trace:\n[ 4758.913267"
