title: vm2 versions 3.10.1 through 3.11.6 contain a sandbox escape reachable 
  from a default `new VM()` sandbox when running on Node.js 26. 
  WebAssembly.compileStreaming and WebAssembly.instantiateStreaming can produce 
  a raw host-realm Promise that rejects with a host-realm error object; by 
  controlling Symbol.species via Promise.prototype.finally, sandbox code 
  receives that raw host error, walks from the host error constructor to the 
  host Function constructor, and recovers the real host `process` object, 
  gaining host Node.js capabilities (e.g. access to host modules such as fs) in 
  the context of the process running the sandbox. No NodeVM, require permission,
  host object injection, or otherwise unsafe configuration is required. This is 
  a bypass of the fix for GHSA-6j2x-vhqr-qr7q, which removed the JSPI entry 
  points WebAssembly.promising and WebAssembly.Suspending. The issue is fixed in
  3.11.7.
