title: A vulnerability was determined in langgenius dify 1.13.0. Affected is the
  function router.replace of the file 
  web/app/(shareLayout)/components/splash.tsx of the component Splash Layout. 
  This manipulation of the argument redirect_url causes cross site scripting. 
  The attack is possible to be carried out remotely. The exploit has been 
  publicly disclosed and may be utilized. The vendor was contacted early about 
  this disclosure but did not respond in any way.
