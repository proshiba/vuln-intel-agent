title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  macb: put the \"mdio\" child node reference on success\n\nmacb_mii_init() holds
  the reference returned by of_get_child_by_name()\nfor macb_mdiobus_register() and
  drops it only on the error paths, so\nevery successful probe leaks a node reference.
  On a CM5, overlay\nremoval after four bind cycles reports\n\n  OF: ERROR: memory
  leak, expected refcount 1 instead of 5\n\nDrop the reference after registration,
  where __mdiobus_register() has\nalready taken its own for the lifetime of the bus."
