title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  skip the VMID 0 flush for VRAM\n\nClear-on-release only runs on VRAM, which amdgpu_ttm_map_buffer()
  reaches\nvia its direct MC address without programming a GART window, yet the wipe\n\
  still forces a VMID 0 flush. On GFX11 (e.g. Navi33) that spurious SDMA\nflush can
  wedge the engine; only flush when a GART window is actually used.\n\nv2: Let amdgpu_ttm_map_buffer()
  return whether the VMID 0 flush is needed,\n    and drive the clear and copy paths
  from that. (Christian)\nv3: Make the vm_needs_flush output parameter mandatory instead
  of\n    allowing NULL. (Christian)\n\n(cherry picked from commit a306e406e570b74318ff7d80e5b07b540ca1d3a9)"
