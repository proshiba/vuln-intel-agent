title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Flush LSC untyped L1 dataport cache after rcs/ccs batches\n\nemit_render_cache_flush()
  sets PIPE_CONTROL0_HDC_PIPELINE_FLUSH to\nflush the L2/HDC data cache before fence
  signalling, but it never\nrequests a flush of the LSC untyped L1 data cache via
  the 'Untyped\nData-Port Cache Flush Enable' bit in PIPE_CONTROL DWord0[11].\n\n\
  Per the Bspec, in 3D pipeline mode HDC Pipeline Flush is documented to\nalso flush/invalidate
  the untyped L1 cache, but only depending on how\nHDC_CHICKEN0[13:11] is programmed.
  Starting with MTL, this coupling\nbetween HDC Pipeline Flush and the untyped L1
  cache flush no longer\nholds in practice, regardless of how HDC_CHICKEN0 is programmed,
  so\nrelying on it is not safe on newer platforms such as BMG. Mesa's Vulkan\ndriver
  (anv) has been assuming the kernel flushes both caches between\nsubmissions, and
  hit user-visible corruption in apps such as Llama.cpp\nbecause of this gap; it now
  works around it"
