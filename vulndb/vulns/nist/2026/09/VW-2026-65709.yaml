title: "An uncontrolled search path element in InsightVM assessment content in Rapid7
  Insight Agent on Windows allows a local, low-privileged user to execute arbitrary
  code as SYSTEM via a planted executable resolved from the machine PATH.\n\nAssessment
  content at or below version 0.0.261.0 included a check that invoked the `code` command
  without a fully qualified path from a process running as SYSTEM. The command was
  resolved against the machine PATH environment variable at execution time. Where
  the machine PATH contained a directory writable by non-administrative users and
  ordered ahead of the legitimate Visual Studio Code installation, a local user could
  place an executable named `code` in that directory and cause the agent to execute
  it with SYSTEM privileges.\n\nThe version range above refers to InsightVM assessment
