title: "FatPipe MPVPN, WARP, and IPVPN appliances running the end-of-life firmware
  version 10.1.2r60p100 contain a stack-based buffer overflow in /usr/sbin/auth_user_pass.
  An unauthenticated remote attacker with access to the affected management interface
  can submit a crafted authentication request that reaches an unchecked copy into
  a fixed-size stack buffer, potentially allowing arbitrary code execution as root.\n\
  \nThe affected management interface is disabled by default and must be affirmatively
  enabled by the customer before the endpoint becomes reachable. FatPipe recommends
  restricting management access to trusted administrative networks and using WAN access
  control lists to limit access to trusted sources.\n\nCustomers running the affected
  end-of-life firmware can contact FatPipe Support for help confirming their firmware
  version and upgrading to a current supported release at https://www.fatpipeinc.com/support/support,
  support@fatpipeinc.com, or +1 800-724-8521 (option 3)."
