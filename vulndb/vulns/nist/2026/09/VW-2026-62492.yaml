title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt792x: fix use-after-free in mt76_rx_poll_complete\n\nA use-after-free issue
  occurs in mt76_rx_poll_complete due to a race\ncondition. The STA has already been
  removed, but the rx_status still\nhad a pointer to the wcid in the STA.\n\nSet the
  links' wcid pointers to be NULL for a MLD in\nmt7925_sta_pre_rcu_remove()\n\nBUG:
  KASAN: invalid-access in mt76_rx_poll_complete+0x280/0x470\nCall trace:\ndump_backtrace+0xec/0x128\n\
  show_stack+0x18/0x28\ndump_stack_lvl+0x40/0xc8\nprint_report+0x1b8/0x710\nkasan_report+0xe0/0x144\n\
  do_bad_area+0x120/0x260\ndo_tag_check_fault+0x20/0x34\ndo_mem_abort+0x54/0xa8\n\
  el1_abort+0x3c/0x5c\nel1h_64_sync_handler+0x40/0xcc\nel1h_64_sync+0x7c/0x80\nmt76_rx_poll_complete+0x280/0x470\n\
  mt76_dma_rx_poll+0x114/0x51c\nmt792x_poll_rx+0x60/0xf8\nnapi_threaded_poll_loop+0xe0/0x450\n\
  napi_threaded_poll+0x80/0x9c\nkthread+0x11c/0x158\nret_from_fork+0x10/0x20"
