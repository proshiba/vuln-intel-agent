title: An inefficient regular expression complexity issue in the in-memory query
  evaluation component of the Mongoid library may allow an unauthenticated party
  to cause excessive processing within an embedding application process. 
  Applications that place user-supplied text into a pattern-matching query 
  condition on an embedded association may become unresponsive.
