title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2, a broken access control vulnerability exists in Zammad's GraphQL 
  API. An authenticated user can access taskbar item data belonging to another 
  user by crafting a request with the target user's taskbar identifier. The 
  taskbar feature stores transient state for active user sessions, including 
  auto-saved ticket drafts. Under certain conditions, the authorization check 
  for taskbar item access is not enforced, allowing a user to read another 
  user's taskbar item data. This vulnerability is fixed in 7.0.2.
