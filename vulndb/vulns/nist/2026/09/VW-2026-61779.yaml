title: OpenTelemetry-Go is the Go implementation of OpenTelemetry. Prior to 
  version 0.21.0, the exporters/otlp/otlplog/otlploggrpc package loads 
  OTEL_EXPORTER_OTLP_LOGS_CERTIFICATE, OTEL_EXPORTER_OTLP_CERTIFICATE, and 
  related client certificate environment variables through loadEnvTLS into 
  cfg.tlsCfg, but newGRPCDialOptions does not apply cfg.tlsCfg when creating 
  gRPC transport credentials. The environment-only TLS path instead uses 
  credentials.NewTLS with system roots and no configured client certificate, 
  bypassing intended private CA pinning and mutual TLS unless the application 
  also supplies WithTLSCredentials. A network attacker able to intercept or 
  spoof the collector connection with a system-trusted certificate can read or 
  alter log telemetry. This issue is fixed in version 0.21.0.
