title: "A vulnerability in the Network-Based Application Recognition (NBAR) feature
  of Cisco IOS XE Software could allow an unauthenticated, remote attacker to cause
  an affected device to reload, causing a denial of service (DoS) condition.\r\n\r
  This vulnerability is due to improper handling of malformed Control and Provisioning
  of Wireless Access Points (CAPWAP) packets. An attacker could exploit this vulnerability
  by sending malformed CAPWAP packets through an affected device. A successful exploit
  could allow the attacker to cause the device to reload unexpectedly, resulting in
  a DoS condition."
