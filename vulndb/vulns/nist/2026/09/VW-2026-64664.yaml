title: A vulnerability was identified in TDuckCloud tduck-platform up to 5.3. 
  This vulnerability affects the function 
  PaginationInnerInterceptor.concatOrderBy of the file 
  tduck-api/src/main/java/com/tduck/cloud/api/config/MybatisPlusConfig.java of 
  the component Pagination Inner Interceptor. The manipulation of the argument 
  orders[0].column leads to sql injection. The attack can be initiated remotely.
  The exploit is publicly available and might be used. The identifier of the 
  patch is ea7f0fae7cb0fd998a3284c11addce689350cd69. It is suggested to install 
  a patch to address this issue.
