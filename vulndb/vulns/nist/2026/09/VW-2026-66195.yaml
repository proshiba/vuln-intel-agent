title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  validate new EOF for insert range\n\nsmb3_insert_range() does not check if the new
  file size\n(i_size + len) is valid. This allows FALLOC_FL_INSERT_RANGE to bypass\n\
  RLIMIT_FSIZE, exceed s_maxbytes, or produce a size outside the loff_t\nrange.\n\n\
  Use check_add_overflow() to calculate the new EOF. Validate it with\ninode_newsize_ok()
  before modifying the file.\n\nReproducer, using a file on a CIFS mount:\n\n\tbash
  -c '\n\t\tFILE=/mnt/cifs/repro\n\n\t\ttrap \"\" SIGXFSZ\n\t\tulimit -f 3072\t\t\
  # RLIMIT_FSIZE = 3 MiB\n\n\t\t# A regular write is stopped at 3 MiB.\n\t\tdd if=/dev/zero
  of=\"$FILE\" bs=1M count=4 status=none\n\t\tstat -c \"size after write: %s\" \"\
  $FILE\"\n\n\t\t# Insert 2 MiB into a 2 MiB file.\n\t\ttruncate -s 2M \"$FILE\"\n\
  \t\tfallocate -i -o 0 -l 2M \"$FILE\"\n\t\tstat -c \"size after insert: %s\" \"\
  $FILE\"\n\t'\n\nBefore this change, the regular write stops at the 3 MiB limit,
  but\ninsert range grows the file to 4 MiB:\n\n\tdd: error writing '/mnt/cifs/repro':
  Fil"
