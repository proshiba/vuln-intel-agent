title: XenForo before 2.3.13 contains a multi-factor authentication bypass 
  vulnerability in the passkey TFA provider that allows an authenticated 
  attacker to complete login as another user by submitting their own registered 
  passkey credential during the WebAuthn assertion step. The passkey 
  verification path performs a global credential lookup without validating that 
  the matched credential belongs to the user whose login is pending, enabling an
  attacker who knows a target account's password to sign the challenge with 
  their own passkey and bypass multi-factor authentication on both public forum 
  and ACP login paths.
