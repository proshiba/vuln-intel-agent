title: n8n is an open source workflow automation platform. Prior to 2.37.7 and 
  2.38.1, the OAuth token endpoint bound an authorization code's first access 
  token to the consented resource but did not bind its refresh token. Refreshing
  checked only that the requested resource was registered, not that it matched 
  the original grant. An OAuth client approved for one workflow could substitute
  a different workflow URL in the resource parameter and obtain a valid token 
  for an unapproved workflow accessible to the consenting user. This issue is 
  fixed in versions 2.37.7 and 2.38.1.
