title: "In the Linux kernel, the following vulnerability has been resolved:\n\nqede:
  Fix NULL pointer dereference in TPA fragment processing\n\nUnder memory pressure,
  the qede driver encounters NULL pointer\ndereferences when processing TPA continuation
  fragments.\n\nCommit 8a8633978b84 (\"qede: Add build_skb() support.\") accidentally\n\
  dropped the assignment of tpa_info->buffer.data in qede_tpa_start().\n\nWhen memory
  pressure causes an SKB allocation failure in qede_tpa_start(),\nthe driver sets
  tpa_start_fail = true and attempts to recycle the physical\npage later in qede_tpa_end()
  via qede_reuse_page(). However, because\nbuffer.data was left uninitialized (NULL),
  qede_reuse_page() pushes a\n\"ghost\" BD (valid DMA mapping but NULL data pointer)
  back into the\nactive Rx ring.\n\nThe next time the hardware uses this ring slot,
  it passes a NULL page\nto qede_fill_frag_skb(), causing a kernel panic.\n\nExample
  crash from production system:\n BUG: unable to handle kernel NULL pointer dereference
  at 0x8\n RIP: qede_fill_"
