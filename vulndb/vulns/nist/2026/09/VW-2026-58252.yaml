title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: max17040: propagate register read errors\n\nmax17040_get_vcell() and max17040_get_soc()
  ignore errors returned by\nregmap_read().  When an I2C transfer fails, the uninitialized
  register\nvalue is converted and reported to userspace as a valid voltage or state\n\
  of charge.  The polling worker can also replace the cached state of charge\nwith
  the bogus value and emit a spurious change event.\n\nPropagate read errors through
  the power supply get_property callback and\nkeep the last valid cached state of
  charge when polling fails."
