title: "Improper Control of Generation of Code ('Code Injection') vulnerability in
  Apache Camel K.\n\n\n\nA YAML injection vulnerability in custom resource configuration
  allows an authorized CR author to inject arbitrary Kubernetes objects, potentially
  enabling unauthorized resource creation with the privileges of the operator.\n\n\
  \n\nThis issue affects Apache Camel K: from 2.0.0 before 2.9.3, from 2.10.1 before
  2.10.2.\n\n\n\nUsers are recommended to upgrade to version 2.9.3, 2.10.2 or 2.11.0,
  which fixes the issue."
