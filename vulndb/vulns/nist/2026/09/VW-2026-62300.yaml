title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  free global tag_set on init error path\n\nIf shared_tags is enabled, null_setup_tagset()
  allocates the global tag_set\nvia null_init_global_tag_set(). If device creation
  later fails, err_dev\ndestroys the default devices and calls unregister_blkdev(),
  but never frees\nthe global tag_set. Since module init failed, null_exit() is never
  invoked,\nso the global tag_set's tags and maps are permanently leaked.\n\nFree
  the global tag_set in err_dev, matching null_exit() which does\nif (tag_set.ops)
  blk_mq_free_tag_set(&tag_set)."
