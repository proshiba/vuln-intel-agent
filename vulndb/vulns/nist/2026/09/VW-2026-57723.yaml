title: zstd-jni versions 1.4.8-4 through 1.5.7-13 fail to validate negative 
  length parameters in ZstdInputStreamNoFinalizer.read(), allowing attackers to 
  trigger infinite loops. Attackers can pass negative length values to cause the
  read method to spin indefinitely while holding the stream monitor, blocking 
  all other threads from accessing the stream.
