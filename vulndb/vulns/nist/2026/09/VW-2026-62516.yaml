title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/chrome:
  cros_ec_debugfs: Unregister panic notifier\n\ncros_ec_debugfs_probe() registers
  notifier_panic with the EC panic\nnotifier chain. The remove path tears down debugfs
  and the console log,\nbut leaves the notifier registered. A later panic notification
  can call\nback into the removed instance and queue work that accesses released\n\
  data.\n\nUnregister the panic notifier before tearing down the debugfs and\nconsole
  log state.\n\nThis issue was found by a static analysis tool."
