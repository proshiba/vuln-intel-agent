title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  fix slab-out-of-bounds write in ni_create_attr_list()\n\nni_create_attr_list() allocates
  a fixed buffer of al_aligned(record_size)\n(== record_size) bytes and then walks
  every attribute of the primary MFT\nrecord, writing one ATTR_LIST_ENTRY per attribute
  and advancing the cursor\nby le_size(name_len), with no check against the end of
  the buffer; the\ntotal size is only computed after the loop.\n\nA minimum-size resident
  attribute occupies SIZEOF_RESIDENT (0x18 = 24)\nbytes on disk, but an unnamed attribute
  expands to le_size(0) (0x20 = 32)\nbytes in the list.  Because the number of attributes
  in a record is not\nbounded (mi_enum_attr() accepts arbitrarily many equal-type,
  nameless\nminimum-size attributes), a crafted record packed with such attributes\n\
  produces a list larger than record_size and overflows the heap buffer.\n\nThis is
  reachable from a crafted, loop-mounted NTFS image: opening the file\nand adding
  an attribut"
