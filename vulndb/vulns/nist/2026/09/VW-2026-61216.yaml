title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Initialize NVMe abort_work once at submission\n\nqla_nvme_fcp_abort() and
  qla_nvme_ls_abort() ran INIT_WORK() on\npriv->abort_work immediately before schedule_work().
  INIT_WORK()\nreinitializes the work_struct, resetting its list head and clearing
  the\npending bit. If an abort is issued more than once for the same command\n(for
  example, concurrent transport teardown and a timeout-driven abort),\nthe second
  INIT_WORK() reinitializes a work item that is already queued,\nwhich can corrupt
  the workqueue list and lead to crashes or a looping\nworker.\n\nInitialize priv->abort_work
  once at command submission, next to the\nexisting per-command spin_lock_init(&priv->cmd_lock),
  and leave only\nschedule_work() in the abort paths. schedule_work() already does
  nothing\nwhen the work item is still pending, so a repeated abort no longer\ndisturbs
  an in-flight work item. The command is not returned to the\ntransport until the
  final k"
