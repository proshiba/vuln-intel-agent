title: 'Joomla Extension - joomshaper.com - Unauthenticated PII Exposure via IDOR
  in Guest Checkout in Easy Store extension 1.0.0-3.0.0 - The checkout.searchGuestUser
  endpoint allowed querying guest checkout records solely by supplying an email address.
  The server returned complete shipping details (full name, phone number, street address,
  city, postal code, and country) directly from the #__easystore_guests table with
  no authentication, session validation, or ownership checks. An unauthenticated attacker
  could iterate through email lists to enumerate guest customers and harvest sensitive
  Personally Identifiable Information (PII). Resolved by removing the unauthenticated
  server-side guest lookup endpoint entirely and migrating autofill functionality
  to client-side localStorage protected by explicit user consent.'
