title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  validate on-media seg_num against the cache device size\n\nseg_num is read from
  the crc32c-only superblock, so whoever supplies the\ncache device on a table load
  (CAP_SYS_ADMIN) controls it. It sizes\ncache->segments[] and is the value every
  later on-media segment id is\nbounded against, yet it is never checked against the
  device. Because\ncache_dev->mapping is the direct map of the pmem, CACHE_DEV_SEGMENT()
  for\na segment id past the device resolves to ordinary kernel memory beyond\nthe
  mapping; a new-cache init reaching such an id has cache_seg_init() ->\ncache_dev_zero_range()
  memset() 12 KiB over that memory -- an\nout-of-bounds write into the kernel heap
  at table load. A zero seg_num\nmakes the segment allocations ZERO_SIZE_PTR.\n\n\
  Reject a seg_num that is zero, larger than the device can hold, or larger\nthan
  PCACHE_CACHE_SEGS_MAX before it is used."
