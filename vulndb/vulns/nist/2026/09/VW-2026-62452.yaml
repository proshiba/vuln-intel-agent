title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  generic: free maps on pinctrl_generic_to_map() failure\n\npinctrl_generic_to_map()
  parses DT configuration and allocates pinctrl\nmaps via pinctrl_utils_reserve_map().\n\
  \nIf subsequent steps (such as pinctrl_utils_add_map_mux(),\npinctrl_generic_add_group(),
  pinconf_generic_parse_dt_config(), or\npinctrl_utils_add_map_configs()) return an
  error, *maps may contain\npartially allocated map entries. Returning the error directly
  without\nfreeing *maps leaks the allocated mapping memory across all drivers\nthat
  rely on pinctrl_generic_to_map().\n\nFix this by calling pinctrl_utils_free_map()
  and resetting *maps,\n*num_maps, and *num_reserved_maps in the error path of\npinctrl_generic_to_map()."
