title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark sched_process_wait argument as nullable\n\ndo_wait() passes wo->wo_pid to the
  sched_process_wait tracepoint.\nkernel_wait4() leaves wo_pid NULL for wait4(-1),
  and\nkernel_waitid_prepare() does likewise for waitid(P_ALL).\n\nbtf_ctx_access()
  currently types argument 0 as PTR_TO_BTF_ID |\nPTR_TRUSTED. Without PTR_MAYBE_NULL,
  the verifier accepts an unchecked\ndereference. Trusted pointer loads have no fault
  protection, so a wait for\nany child can then cause a NULL pointer dereference in
  JITed BPF code.\n\nAdd sched_process_wait to raw_tp_null_args[] with argument 0
  marked\nnullable. The verifier rejects an unchecked dereference while preserving\n\
  access after the program checks the pointer for NULL."
