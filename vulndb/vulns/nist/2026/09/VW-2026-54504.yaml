title: AVideo with YPTSocket plugin enabled contains a cross-site scripting 
  vulnerability allowing unauthenticated attackers to execute arbitrary 
  JavaScript in other users' browsers via the websocket callback mechanism. 
  Attackers can send crafted socket messages with callback names resolving to 
  global functions like avideoConfirmHTML that accept untrusted data and assign 
  it to innerHTML, achieving script execution in the victim's origin without 
  authentication or user interaction.
