title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  reject out-of-range evcn in mi_enum_attr()\n\nIn mi_enum_attr(), the start/end VCN
  validation for non-resident\nattributes is:\n\n\tif (svcn > evcn + 1) goto out;\n\
  \nWhen evcn is U64_MAX the \"evcn + 1\" expression wraps to 0 and any svcn\npasses
  the check. For evcn values close to U64_MAX (but not equal to it)\nthe right-hand
  side is still a meaningless near-wrap upper bound, so a\nmalformed on-disk attribute
  with svcn == 0 and evcn near U64_MAX can pass\nmi_enum_attr() unrejected.\n\nVCN
  (virtual cluster number) is a cluster index, so any valid evcn is\nbounded by the
  volume's total cluster count, which ntfs3 holds in\nsbi->used.bitmap.nbits (set
  up in ntfs_init_from_boot() before any caller\nof mi_enum_attr() runs). Reject evcn
  values that fall outside this range.\n\nHowever, an empty non-resident attribute
  (no allocated clusters) is\nlegitimately encoded with svcn == 0 and evcn == -1 (U64_MAX),
  e.g. via\nattr->nres.evcn = cpu_"
