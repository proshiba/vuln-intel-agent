title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack: use get_unaligned_be32() in tcp_sack()\n\nThe timestamp-only fast
  path dereferences the option stream as\n*(__be32 *)ptr, which assumes 4-byte alignment
  that the TCP option\nstream does not guarantee. Use get_unaligned_be32() instead,
  which\nreads the value safely and already returns host byte order, so the\nhtonl()
  on the comparison constant can be dropped.\n\nThis matches the existing get_unaligned_be32()
  use later in the same\nfunction."
