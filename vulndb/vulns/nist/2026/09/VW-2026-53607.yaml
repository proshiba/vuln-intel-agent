title: WWBN AVideo contains a broken access control vulnerability in the 
  unauthenticated feed/index.php endpoint that disables per-video visibility 
  checks when a program_id parameter is supplied. Attackers can enumerate 
  playlist identifiers and retrieve unlisted and group-restricted videos by 
  requesting the RSS feed with any visible playlist id, including empty 
  playlists that return the entire site's hidden video catalogue.
