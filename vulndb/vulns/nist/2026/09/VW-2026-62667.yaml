title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrash_dump:
  release keyring reference at the correct time\n\nrestore_dm_crypt_keys_to_thread_keyring()
  gets a reference to the user\nkeyring before restoring the saved dm-crypt keys.\n\
  \nThe same keyring reference is then passed to add_key_to_keyring() for each\nsaved
  key, but add_key_to_keyring() drops that reference on every call.\nThis is only
  balanced when exactly one key is restored. With multiple\nkeys, the keyring reference
  is dropped too many times and may trigger a\nrefcount underflow or use-after-free.\n\
  \nWhen more than five keys are restored, a refcount underflow/use-after-free\nwarning
  can be triggered.\n\nThe early error paths after lookup_user_key() also return without
  dropping\nthe keyring reference.\n\nKeep ownership of the keyring reference in\n\
  restore_dm_crypt_keys_to_thread_keyring(), drop it once on all exit paths,\nand
  make add_key_to_keyring() only use the reference without consuming it."
