title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: fix out-of-bounds write in l2cap_ecred_connect\n\nl2cap_chan_connect() tries
  to ensure there are no more than\nL2CAP_ECRED_CONN_SCID_MAX pending ECRED channels,
  so they fit in the\nsame L2CAP_ECRED_CONN_REQ that l2cap_ecred_connect() constructs.\n\
  \nHowever, the check only counts deferred channels.  If 6 L2CAP sockets\nare connected
  at the same time in order DDDDND (D=deferred,\nN=non-deferred), the last can bump
  the total to max+1.  It results to\none __le16 written out of bounds of the scid
  array, and an invalid\nECRED_CONN_REQ being sent.\n\nFix by leaving room for the
  non-deferred pending ECRED channels in the\ncounting in l2cap_chan_connect(), so
  the limit can't be exceeded.\n\nMove counting under same critical section where
  the channel is added.\nAlthough race conditions involving this appear unreachable,
  it's easier\nto see.\n\nAlso add WARN_ON_ONCE check in l2cap_ecred_defer_connect()
  to make this\nless brittle."
