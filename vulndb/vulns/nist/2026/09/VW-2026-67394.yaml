title: '@grpc/grpc-js implements the core functionality of gRPC purely in JavaScript,
  without a C++ addon. Prior to 1.13.6 and 1.14.5, when an application method handler
  throws an uncaught error, the server includes its error message in the status message
  sent to the client. The thrown error message is transmitted to the client, causing
  sensitive information disclosure when the message contains sensitive data. This
  issue is fixed in versions 1.13.6 and 1.14.5.'
