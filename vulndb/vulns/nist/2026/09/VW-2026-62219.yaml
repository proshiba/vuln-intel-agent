title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  free pending qentry in smc_llc_flow_stop() before memset\n\nsmc_llc_flow_stop()
  resets a flow struct with a blind memset:\n\n\tspin_lock_bh(&lgr->llc_flow_lock);\n\
  \tmemset(flow, 0, sizeof(*flow));\n\tflow->type = SMC_LLC_FLOW_NONE;\n\tspin_unlock_bh(&lgr->llc_flow_lock);\n\
  \nIf flow->qentry is non-NULL at this point the pointer is overwritten without the\n\
  allocation being freed, leaking one kmalloc object.\n\nA late-arriving duplicate
  CONFIRM_LINK or ADD_LINK_CONT message can set\nflow->qentry after the legitimate
  message has been consumed by the waiter via\nsmc_llc_flow_qentry_clr() (which NULLs
  the pointer but leaves flow->type\nnon-zero) but before the flow completes and smc_llc_flow_stop()
  runs.  In that\nwindow the duplicate is stashed into flow->qentry, and then lost
  when\nsmc_llc_flow_stop() zeros the struct.\n\nCall smc_llc_flow_qentry_del() inside
  the lock before the memset.\nsmc_llc_flow_qentry_del() already checks flow->qe"
