title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Fix requested device removal race\n\nscmi_protocol_device_unrequest()
  drops scmi_requested_devices_mtx while\nnotifying listeners but continues to retain
  the per-protocol list head.\nWhen two SCMI drivers for the same protocol unregister
  concurrently, one\nthread can remove the final request and free the list head while
  the other\nis running its notifier. The latter then dereferences the freed list
  head\nafter reacquiring the mutex and can free it a second time.\n\nComplete the
  list and IDR updates, including freeing an empty list head,\nbefore dropping the
  mutex. Keep the blocking notifier outside the critical\nsection and retain only
  the detached request across the callback."
