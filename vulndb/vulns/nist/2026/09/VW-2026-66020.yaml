title: "In the Linux kernel, the following vulnerability has been resolved:\n\nconfigfs:
  pin the symlink target's dirent instead of chasing ->ci_dentry\n\ncreate_link()
  reads the target's configfs_dirent from\nitem->ci_dentry->d_fsdata, relying on the
  item reference taken by\nget_target().  That reference pins the item, not its dentry:
  the dentry is\npinned by DCACHE_PERSISTENT, which configfs_remove_dir() releases
  via\nsimple_rmdir() while the item is still alive.  A symlink racing with rmdir\n\
  of its target can therefore find ->ci_dentry freed and its dirent\nreleased, triggering
  WARN_ON(!atomic_read(&sd->s_count)) in configfs_get().\n\nTake the dirent in get_target()
  as well, under ->d_lock and atomically\nwith the item reference, and pass it down
  to create_link().  A hashed\ndentry has not been killed yet, so its ->d_fsdata reference
  keeps the\ndirent alive there."
