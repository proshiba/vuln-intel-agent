title: "A flaw was found in the memcached cache plugin of the community.general Ansible\n\
  collection. Although its documentation states that records are stored in JSON\n\
  format, the plugin performs no explicit serialization and relies on\npython-memcached,
  which pickles values on write and unpickles them on read.\nBecause memcached is
  unauthenticated and cache keys are predictable, an attacker\nable to reach a network-exposed
  or shared memcached instance can write a crafted\npickle payload that is deserialized
  and executed on the Ansible controller when\nthe poisoned fact cache is next read,
  leading to remote code execution."
