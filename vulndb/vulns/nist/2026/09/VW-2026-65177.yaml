title: A vulnerability was identified in java110 MicroCommunity up to 2.0. 
  Affected is the function QueryServiceSMOImpl.fallBack of the file 
  BusinessApi.java of the component fallBack API Endpoint. Such manipulation of 
  the argument fallBackSql leads to sql injection. The attack may be launched 
  remotely. The exploit is publicly available and might be used. The project was
  informed of the problem early through an issue report but has not responded 
  yet.
