title: Sync-in Server is an open-source platform for file storage, sharing, 
  collaboration, and syncing. Versions prior to 2.4.1 contain an observable 
  timing discrepancy in the login endpoint because authentication attempts for 
  nonexistent accounts return without performing the bcrypt comparison used for 
  existing accounts. An unauthenticated attacker can measure response times to 
  enumerate valid usernames or email addresses, facilitating 
  credential-stuffing, password-spraying, and phishing attacks. Version 2.4.1 
  contains a patch.
