title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Starting in version 8.0.0 and 
  prior to version 8.0.5, when certain detection transforms are chained, the 
  decompress transform pipeline could read from an inspection buffer after it 
  had been reallocated and freed. The issue is reached during network traffic 
  processing, but requires a malicious rule as Suricata will crash whatever the 
  traffic. Version 8.0.5 contains a fix. As a workaround, avoid rules that chain
  `gunzip` or `zlib_deflate` with `max-size` bigger than 4096 after another 
  transform.
