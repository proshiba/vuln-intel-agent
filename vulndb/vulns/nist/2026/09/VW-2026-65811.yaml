title: The BA Book Everything plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via first_name Parameter in all versions up to, and 
  including, 1.8.27 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  An unauthenticated attacker can obtain the valid order_id, order_num, and 
  order_hash credentials required to reach the vulnerable action_to_pay() 
  handler simply by placing a guest booking through the public 
  [babe-booking-form] shortcode, making the full exploit chain reachable without
  any account.
