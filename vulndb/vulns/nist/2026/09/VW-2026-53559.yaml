title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  remove WARN_ON_ONCE() from sk_mc_loop()\n\nsk_mc_loop() can be called for sockets
  that are neither AF_INET\nnor AF_INET6 (e.g. AF_PACKET sockets when sending packets
  via raw/packet\nsocket over virtual devices such as VRF or ipvlan).\n\nIn such cases,
  sk_family is not AF_INET/AF_INET6 and sk_mc_loop() falls\nthrough the switch statement
  and triggers WARN_ON_ONCE(1).\n\nNon-INET sockets do not support IP_MULTICAST_LOOP
  or IPV6_MULTICAST_LOOP\noptions, so loopback should default to true without generating
  a warning."
