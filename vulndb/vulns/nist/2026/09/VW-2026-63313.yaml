title: http-cache-semantics through 4.2.0 fails to properly validate 
  security-zeroed cache entries when processing client max-stale directives, 
  allowing unauthenticated attackers to retrieve cached responses belonging to 
  other users. Attackers can request the same URL with a large max-stale value 
  to obtain another user's Set-Cookie session credentials from shared-cache 
  entries that were deliberately zeroed for security reasons.
