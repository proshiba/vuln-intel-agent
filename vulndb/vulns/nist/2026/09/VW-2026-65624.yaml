title: Decepticon is an autonomous hacking agent for red teams. Versions prior 
  to 1.1.17 wrap web crawl results — the output of agent reconnaissance against 
  target services — into LLM messages without neutralizing ChatML special-token 
  literals. Under the BYOK (Bring Your Own Key) deployment model, users 
  configure their own LLM credentials to any OpenAI-compatible endpoint. Most 
  open-source and self-deployed model providers (vLLM, SGLang, Ollama, LM 
  Studio, text-generation-webui, etc.) do not filter special-token literals from
  user content in their default configurations. Those literals are parsed into 
  structural role-boundary token IDs, meaning an attacker string planted in a 
  target web page forges a new operator turn the model treats as authoritative, 
  bypassing Decepticon's agent guardrails and resulting in arbitrary command 
  execution inside the Kali Linux sandbox. Version 1.1.17 patches the issue.
