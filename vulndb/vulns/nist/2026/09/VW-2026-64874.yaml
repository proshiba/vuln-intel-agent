title: CyberPanel v1.9.1 contains a path traversal vulnerability in the compress
  method exposed through the /filemanager/controller endpoint. An authenticated 
  remote attacker with ownership of any configured domain can supply absolute or
  otherwise out-of-scope file paths in the listOfFiles JSON property, together 
  with attacker-controlled basePath and compressedFileName values, in a 
  method=compress request. Because the application validates only domain 
  ownership and does not canonicalize or restrict these paths to the authorized 
  site directory, the backend appends them to zip or tar archive commands and 
  executes them as the website externalApp user, allowing disclosure of 
  arbitrary readable files through the generated archive.
