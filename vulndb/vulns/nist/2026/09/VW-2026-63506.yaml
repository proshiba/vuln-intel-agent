title: The PDF Builder for WooCommerce. Create invoices,packing slips and more 
  plugin for WordPress is vulnerable to authorization bypass in all versions up 
  to, and including, 2.0.11. This is due to the plugin not properly verifying 
  that a user is authorized to perform an action. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to retrieve 
  invoice numbers, formatted invoice numbers, and creation timestamps for 
  arbitrary WooCommerce orders by supplying any OrderNumber and InvoiceId values
  with a garbage nonce.
