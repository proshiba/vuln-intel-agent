title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipmr:
  account multicast table and route memory\n\nA netadmin in a user+net namespace can
  create many IPv4 and IPv6\nmulticast routing tables with MRT_TABLE and MRT6_TABLE.
  Each unseen\nid allocates an mr_table via the shared mr_table_alloc(), links it\n\
  into the per-net list, and leaves it until netns teardown. Those\nobjects were not
  charged to memcg, so the host unreclaimable slab\ngrows with the table count.\n\n\
  Account mr_table allocations with GFP_KERNEL_ACCOUNT and mark the\nIPv4/IPv6 MFC
  caches SLAB_ACCOUNT. This matches the established\nhandling of IP addresses, routes
  and alternate interface names.\n\nUnresolved MFC entries are still allocated from
  softIRQ with\nGFP_ATOMIC and are not charged. They expire after 10 seconds and are\n\
  bounded by the socket receive queue; see commit 0079ad8e8dc3\n(\"ipmr: remove hard
  code cache_resolve_queue_len limit\")."
