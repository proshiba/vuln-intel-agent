title: "Issue summary: The DTLS retransmission logic does not correctly handle\na
  handshake message write that is suspended part-way through.\nThe retransmitted message
  can be read past the message buffer and\nthe retransmission overwrites the internal
  state the suspended write\nneeds to resume correctly.\n\nImpact summary: The retransmitted
  message can disclose a heap memory\nto the peer as plaintext handshake data or cause
  a crash and a Denial\nof Service when the read reaches an unmapped memory region.\n\
  \nCWE: CWE-125: Out-of-bounds Read\n\nDescription: DTLS handshake messages can be
  written out in multiple\nfragments, and a write can suspend mid-message (returning
  WANT_WRITE)\nif the underlying transport temporarily cannot accept more data. While\n\
  such a write is suspended, the DTLS retransmission timer may\nindependently fire
  and ask the retransmission logic to resend an\nearlier, already-acknowledged-as-sent
  message from its retransmit\nqueue.\n\nThe retransmission logic reused the same
