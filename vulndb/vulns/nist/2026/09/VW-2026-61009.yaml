title: A vulnerability was determined in gedelumbung HospitalManagement up to 
  c2d45543789a3887067d3915f69d44cfc2cf76a8. Affected by this vulnerability is 
  the function generate_index_pasien of the file 
  application/models/app_global_admin_model.php. Executing a manipulation of the
  argument cari can lead to sql injection. It is possible to launch the attack 
  remotely. The exploit has been publicly disclosed and may be utilized. This 
  product takes the approach of rolling releases to provide continious delivery.
  Therefore, version details for affected and updated releases are not 
  available. The project was informed of the problem early through an issue 
  report but has not responded yet.
