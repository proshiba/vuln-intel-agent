title: "Apache Airflow Keycloak provider: from Airflow 3.3 the Keycloak auth manager
  takes a user's identity from the signed Airflow session token but takes the Keycloak
  access and refresh tokens used for every authorization decision from separate, unauthenticated
  cookies, and never checks that the two describe the same subject. A user who holds
  any valid Airflow login of their own, together with another subject's Keycloak access
  or refresh token obtained out of band, can pair the two: Airflow then authorizes
  requests with the foreign token's privileges while the session identity, audit log
  and cache keys continue to name the attacker's own account. The refresh path re-issues
  an Airflow session token for the original identity carrying the foreign tokens,
  so the mismatched pairing survives across sessions.\n\nAffects deployments running
  Airflow 3.3 or later with the Keycloak auth manager. Earlier versions carried the
