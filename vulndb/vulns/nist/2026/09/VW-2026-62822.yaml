title: Traccar is an open source GPS tracking system. Prior to 6.14.0, an 
  authenticated, non-readonly user with access to an object usable in a 
  permission pair can submit DELETE /api/permissions with an extra 
  attacker-controlled JSON key. Permission(LinkedHashMap<String, Long>) in 
  src/main/java/org/traccar/model/Permission.java validates only the first two 
  keys, but DatabaseStorage.removePermission() in 
  src/main/java/org/traccar/storage/DatabaseStorage.java concatenates every map 
  key into the SQL WHERE clause as a column identifier. The extra key therefore 
  becomes attacker-controlled SQL and provides a blind boolean or error oracle 
  that can extract arbitrary database values, including administrator email, 
  password hashes, and salts, or conditionally delete permission rows. 
  Unauthenticated requests are rejected. This issue is fixed in 6.14.0.
