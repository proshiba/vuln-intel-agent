title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: honor forceuid/forcegid when mapping SIDs to uid/gid\n\nWhen the administrator
  mounts with forceuid or forcegid (uid=/gid=\nmount options), they expect all files
  to appear owned by the specified\nuser/group.  However, several code paths unconditionally
  called\nsid_to_id() to overwrite cf_uid/cf_gid with server-provided values,\nignoring
  the administrator's explicit override:\n\n  - smb311_posix_info_to_fattr() (stat
  via POSIX extensions)\n  - cifs_posix_to_fattr() (readdir via POSIX extensions)\n\
  \  - parse_sec_desc() (CIFS ACL ownership mapping)\n\nThis allowed an untrusted
  server to dictate local file ownership even\nwhen the mount was configured to force
  specific uid/gid values.\n\nFix all three call sites to check CIFS_MOUNT_OVERR_UID
  and\nCIFS_MOUNT_OVERR_GID before calling sid_to_id(), following the\nsame pattern
  already used by cifs_unix_basic_to_fattr() for unix\nextensions."
