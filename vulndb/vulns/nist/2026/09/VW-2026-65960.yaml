title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: tag_brcm: legacy FCS: request needed tailroom\n\nThe legacy FCS tagger calculates
  the CRC over skb->len bytes starting at\nskb->data. When a nonlinear skb reaches
  the tagger, this reads past the\nlinear head into unrelated slab memory.\n\nThe
  tagger appends an Ethernet FCS but does not declare that tailroom. As a\nresult,
  DSA leaves NETIF_F_SG and NETIF_F_FRAGLIST enabled on the user\nport, and nonlinear
  skbs can reach the CRC calculation.\n\nDeclare the required tailroom. DSA will then
  clear those features and the\nnetworking core will linearize skbs before the tagger
  runs.\n\nA KASAN-enabled dsa_loop test using this tagger reports:\n\n  BUG: KASAN:
  slab-out-of-bounds in crc32_le\n  Read of size 1 at addr ffff8880397086c0 by task
  exp/135\n\n  Call Trace:\n   crc32_le (lib/crc/crc32-main.c:38)\n   brcm_leg_fcs_tag_xmit
  (net/dsa/tag_brcm.c:343)\n   dsa_user_xmit (net/dsa/user.c:942)\n   dev_hard_start_xmit
  (net/core/dev.c:3937)\n  "
