title: A security vulnerability has been detected in projeto-siga siga up to 
  11.0.2.10/11.0.2.13/11.1.1. This affects the function 
  ExAutenticacaoController.autenticar of the file 
  sigaex/src/main/java/br/gov/jfrj/siga/vraptor/ExAutenticacaoController.java of
  the component Authentication Flow. Such manipulation of the argument cod/jwt 
  leads to missing authorization. The attack may be launched remotely. The 
  exploit has been disclosed publicly and may be used. The project was informed 
  of the problem early through an issue report but has not responded yet.
