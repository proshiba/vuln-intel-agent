title: The DevKit Pro plugin for WordPress is vulnerable to Missing 
  Authorization in versions up to, and including, 2.3.0. This is due to a 
  missing capability check and missing nonce validation in the 
  DPDEV_install_themes_func() function registered on the 
  wp_ajax_DPDEV_install_themes action. This makes it possible for authenticated 
  attackers, with Subscriber-level access and above, to install arbitrary theme 
  ZIP packages containing PHP files that are extracted into the web-accessible 
  wp-content/themes/ directory, which may make remote code execution possible.
