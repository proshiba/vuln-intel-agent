title: "The ADC API requires each driver to reject a sampling sequence whose destination
  buffer is too small: the buffer_size field of struct adc_sequence in include/zephyr/drivers/adc.h
  documents that \"the driver must ensure that samples are not written beyond the
  limit and it must return an error if the buffer turns out to be not large enough\"\
  . The NXP MCUX LPADC driver did not honour that contract. mcux_lpadc_start_read()
  in drivers/adc/adc_mcux_lpadc.c performed no buffer-size check at all before assigning
  data->buffer = sequence->buffer. Each completed conversion then stores one 16-bit
  sample per enabled channel per sampling round through an unbounded *data->buffer++:
  in mcux_lpadc_isr() for interrupt-driven builds, and in mcux_lpadc_dma_callback()
  for DMA-driven builds on releases that have the DMA path. A sequence selecting two
  channels with a two-byte buffer, for example, has its second sample written past
  the end of the buffer.\n\nOn a build with CONFIG_USERSPACE, adc_read() and adc_rea"
