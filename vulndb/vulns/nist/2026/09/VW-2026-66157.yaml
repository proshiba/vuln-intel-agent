title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  mpt3sas: Avoid out-of-bounds cpumask_of_node() call in _base_assign_reply_queues()\n\
  \ndev_to_node() can return NUMA_NO_NODE (-1) on systems without NUMA\ntopology information
  for the PCI device, such as single-socket boards\nthat don't expose device-to-node
  affinity. Passing -1 directly into\ncpumask_of_node() indexes node_to_cpumask_map[-1],
  an out-of-bounds\narray read caught by UBSAN:\n\n  UBSAN: array-index-out-of-bounds
  in arch/x86/include/asm/topology.h:72:28\n  index -1 is out of range for type 'cpumask
  *[1024]'\n\nFall back to cpu_online_mask when no NUMA node is available, rather
  than\nassuming dev_to_node() always returns a valid node index."
