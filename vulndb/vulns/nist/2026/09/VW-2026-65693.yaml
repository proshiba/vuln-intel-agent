title: code16 Sharp is a Laravel-based framework for building content-management
  and administrative interfaces. Versions before 9.22.5 contain a stored 
  cross-site scripting vulnerability in the rich-text editor because the HTML 
  sanitizer permits the `srcdoc` attribute on iframe elements. Although markup 
  inside `srcdoc` is HTML-encoded during sanitization, browsers decode attribute
  entities before interpreting the iframe document, allowing an authenticated 
  user with permission to edit an Editor field to store executable JavaScript 
  that runs when another user views the content. Successful exploitation can 
  result in session hijacking, unauthorized actions, account takeover, privilege
  escalation, or disclosure of administrative data. Version 9.22.5 patches the 
  vulnerability by removing `srcdoc` from the permitted iframe attributes. As a 
  workaround, applications that cannot upgrade should manually sanitize all 
  Editor field content and remove every iframe `srcdoc` attribute before storing
  or render
