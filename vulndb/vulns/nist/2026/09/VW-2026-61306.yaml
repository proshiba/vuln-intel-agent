title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  mcast: linearize skbuff for packet generation\n\nbatadv_mcast_forw_packet() and
  batadv_mcast_forw_scrape() is not only\ncalled (indirectly) by the unsharing+linearizing
  batadv_recv_mcast_packet()\nhandler. When it is called (indirectly) by batadv_mcast_forw_mcsend()
  then\nit will be unshared but not linearized. The SKB_LINEAR_ASSERT() can\ntherefore
  cause a fatal BUG().\n\nThe linearization should happen during the expansion of
  the head because\nthe scrape function can be hit already during the initial\nbatadv_mcast_forw_mode()
  selection code:\n\n* batadv_interface_tx\n* batadv_mcast_forw_mode\n* batadv_mcast_forw_mode_by_count()\n\
  * batadv_mcast_forw_push()\n  -> calls batadv_mcast_forw_expand_head() before everything
  else\n* batadv_mcast_forw_push_tvlvs()\n* batadv_mcast_forw_push_dests()\n* batadv_mcast_forw_push_adjust_padding()\n\
  * batadv_mcast_forw_scrape()"
