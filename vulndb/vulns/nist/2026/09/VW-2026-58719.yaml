title: A vulnerability was found in Fengoffice Feng Office up to 3.11.13.11. 
  Affected is the function update_system_module_order/update_dimension_order of 
  the file application/controllers/MoreController.class.php of the component 
  Reorder Handlers. Performing a manipulation of the argument modules/dims 
  results in sql injection. The attack may be initiated remotely. The exploit 
  has been made public and could be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
