title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Zero mailbox struct in qla2x00_get_firmware_state()\n\nThe mbx_cmd_t is
  allocated on the stack but left uninitialized.\nqla2x00_mailbox_command() has several
  early-return paths (PCI permanent\nfailure, device failed, EEH busy, ISP abort pending,
  mailbox access\ntimeout, purge mbox) that return without writing the input mailbox\n\
  registers back into mcp->mb[]. qla2x00_get_firmware_state() then\nunconditionally
  copies mcp->mb[1..6] (and mb[12]) into the caller's\nstates[] array regardless of
  the return value.\n\nOn such a failure the copied values are uninitialized kernel
  stack\nmemory, which is then exposed to userspace via the fw_state and\nmpi_fw_state
  sysfs handlers. Zero the mailbox struct so a failed query\nyields deterministic
  zeroed state instead of leaking stack contents."
