title: CliInvoke and its formerly named `AlastairLundy.CliInvoke` package are 
  .NET libraries for invoking command-line programs and wrapping executable 
  processes. `CliInvoke` versions 2.0.0 through 2.8.4, 2.9.0 through 2.9.3, 
  2.10.0 through 2.10.4, and 3.0.0-alpha.1 through 3.0.0-beta.1, as well as 
  `AlastairLundy.CliInvoke` versions 2.0.0-alpha.1 through 2.0.0, contain an 
  argument-injection vulnerability in `RunnerProcessFactory` on the 2.x line and
  `RunnerConfigurationFactory` on the 3.x line. These factories combine runner 
  arguments, a caller-controlled target, and caller-controlled arguments into 
  one `ProcessStartInfo.Arguments` string, allowing a double quote in the target
  or an argument to terminate an operating-system-level quoted region and inject
  unintended elements into the runner’s argument vector, potentially resulting 
