title: A flaw was found in the theme localization endpoints of the 
  keycloak-services component, which is the core service responsible for 
  authentication flows and theme management in Keycloak. The issue occurs 
  because the system accepts arbitrary locale tags from unauthenticated requests
  and stores them in a permanent in-memory cache without limits. An attacker can
  exploit this by sending a large number of unique locale tags, eventually 
  causing the server to run out of memory and crash.
