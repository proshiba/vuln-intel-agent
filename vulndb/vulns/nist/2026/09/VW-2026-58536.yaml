title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix use-after-free with same-name named triggers\n\nWhen two hist triggers on different
  events are registered with the same\nname=, the second one reuses the first as named_data.\
  \  Both are added to\ntr->hist_vars by save_hist_vars() during event_hist_trigger_parse(),\n\
  because save_hist_vars() is called before event_trigger_register() while\nthe named
  reuse is only detected later, in hist_register_trigger().\n\nIn the named-data branch
  hist_register_trigger() then frees the second\nhistogram's hist_data via destroy_hist_data(),
  but never removes its\ntr->hist_vars list entry, leaving a dangling pointer and
  leaking the\ntrace_array reference it holds.\n\nA later hist trigger that references
  a variable makes find_var_file()\nwalk tr->hist_vars and dereference the freed hist_data.\
  \  The bug is\nreproducible from userspace by writing three hist triggers to tracefs:\n\
  \n  cd /sys/kernel/tracing\n  echo 'hist:keys=common_pid:x=common_p"
