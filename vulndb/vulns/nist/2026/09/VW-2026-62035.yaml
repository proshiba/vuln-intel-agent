title: "Improper Authentication vulnerability in team-alembic AshAuthentication allows
  an attacker holding a sign-in token for one authenticated resource to be signed
  in as a user of a different resource.\n\nAshAuthentication.Strategy.Password.SignInWithTokenPreparation.extract_primary_keys_from_subject/2
  parses the JWT sub claim (for example user?id=1) with URI.parse/1 and keeps only
  its query string, discarding the path segment that names the subject the token was
  issued for. Nothing else restores that binding: AshAuthentication.Jwt.verify/3 checks
  the signature, exp, nbf, jti and the library-version claims, the purpose check only
  requires sign_in, and the remaining comparison is over primary-key field names,
  which are identical across resources. The WebAuthn sign-in and remember-me preparations
  carry copies of the same helper and drop the path in the same way. The magic link
  sign-in path pins the subject name against the resource and is not affected.\n\n\
  This issue affects ash_authentication: fr"
