title: A vulnerability has been found in Open5GS up to 2.8.0. Affected by this 
  issue is the function smf_n4_handle_session_report_request of the file 
  src/smf/n4-handler.c of the component PFCP Session Report Request Handler. The
  manipulation leads to reachable assertion. The attack may be initiated 
  remotely. The identifier of the patch is 
  e5f0c06d0f2d9613b003daa1cfa3ba8a4bd157e9. It is suggested to install a patch 
  to address this issue.
