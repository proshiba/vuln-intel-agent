title: OmniRoute is an open-source AI gateway providing a single endpoint for 
  multiple model providers. In 3.8.49 and earlier, the OmniRoute POST 
  /api/acp/agents custom ACP agent endpoint accepted attacker-controlled binary 
  and versionCommand values and used only a self-consistency check before 
  execFileSync executed the selected interpreter and arguments. The same request
  called refreshAgentCache, and resolveVersionProbe accepted the matched command
  before the execFileSync sink ran it. The tokenizeVersionCommand function and 
