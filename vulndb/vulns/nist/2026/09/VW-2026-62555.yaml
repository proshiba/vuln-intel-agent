title: "In the Linux kernel, the following vulnerability has been resolved:\n\nliveupdate:
  Remember FLB retrieve() status\n\nLUO keeps track of successful retrieve attempts
  on an FLB. It does so\nto avoid multiple retrievals of the same FLB. Multiple retrievals
  cause\nproblems because once the FLB is retrieved, the serialized data\nstructures
  are likely freed and the FLB is likely in a very different\nstate from what the
  code expects.\n\nAll this works well when retrieve succeeds. When it fails,\nluo_flb_retrieve_one()
  returns the error immediately, without ever\nstoring anywhere that a retrieve was
  attempted or what its error code\nwas. If the user attempts to retrieve another
  file registered with the\nsame FLB, LUO will attempt to call the FLB's retrieve()
  callback again.\n\nThe retry is problematic for much of the same reasons listed
  above. The\nFLB is likely in a very different state than what the retrieve logic\n\
  normally expects (e.g. some KHO pages may have already been restored and\nfreed).\n\
