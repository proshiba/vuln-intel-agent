title: Parse Server versions <= 8.6.87 and >= 9.0.0 < 9.10.1-alpha.7 contain an 
  authentication bypass in the built-in LDAP authentication adapter. The adapter
  forwarded the client-supplied password to the directory without verifying that
  a password had been supplied, and treated any non-error response from the 
  directory as proof of authentication. A zero-length credential turns an LDAP 
  simple bind into the unauthenticated authentication mechanism described in RFC
  4513 section 5.1.2, which some directories (including Active Directory in its 
  default configuration) answer with success while mapping the connection to 
  anonymous. As a result, an unauthenticated attacker who knows a directory 
  username can obtain a valid session token for that account, resulting in 
  account takeover. Only deployments that enable the LDAP authentication adapter
  are affected, and deployments whose directory refuses unauthenticated simple 
  bind (such as a stock OpenLDAP configuration) are not exploitable. The issue 
  is fix
