title: Lantronix SLC8000 before firmware v9.7.0.3, EMG8500/EMG7500 before 
  firmware v9.7.0.1, and all firmware versions of SLB882 contain a server-side 
  request forgery vulnerability in the WebSSH/WebTelnet listener that allows 
  unauthenticated attackers to cause the affected device to establish SSH 
  connections to attacker-controlled endpoints. The custom shellinaboxd uses the
  rooturl parameter from the web connection to determine its own IP address; by 
  modifying this parameter an attacker redirects the SSH terminal connection to 
  an arbitrary host or IP. Attackers can use this capability to enumerate or 
  communicate with internal network endpoints that would otherwise be 
  inaccessible.
