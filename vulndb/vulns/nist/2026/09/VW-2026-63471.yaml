title: The Divi Essential plugin for WordPress is vulnerable to sensitive 
  information exposure in versions up to, and including, 5.8.1 via the 
  dnxte_get_database_tables and dnxte_get_database_data AJAX actions. The 
  handlers  only conditionally verify a nonce (the check runs solely when the 
  'nonce' POST parameter is present and can be trivially bypassed by omitting 
  the parameter) and never call current_user_can() or otherwise enforce a 
  capability. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to enumerate every table in the WordPress 
  database and read up to a caller-controlled number of rows from any table — 
  including wp_users (usernames, emails, hashed passwords), wp_usermeta (session
  tokens, secret keys), and wp_options (privileged settings, API keys, 
  credentials stored by other plugins).
