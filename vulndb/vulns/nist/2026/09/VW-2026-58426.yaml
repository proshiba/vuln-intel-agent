title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: clear ce->tgthint in free_tgts()\n\nWhen free_tgts() frees all structures
  in ce->tlist, ce->tgthint\nis left pointing to one of the freed cache_dfs_tgt structures.\n\
  \nIf ce->tgthint is not reset before it is used later, it results\nin a use-after-free.\n\
  \nSet ce->tgthint to NULL in free_tgts() after the elements are\nfreed to reflect
  that no elements remain."
