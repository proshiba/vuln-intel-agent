title: Snipe-IT before 8.7.0 does not apply the CheckUserIsActivated middleware 
  to the `api` middleware group in app/Http/Kernel.php, and deactivating a user 
  does not revoke that user's Passport personal access tokens. As a result, 
  although a deactivated account is correctly refused at web login, its existing
  API token continues to authenticate and to grant read and write access to the 
  REST API (assets, users, licenses, etc.) at the account's prior permission 
  level until the token expires. A deactivated account that retains 
  user-management permissions can re-activate itself through the API, 
  permanently defeating the deactivation control.
