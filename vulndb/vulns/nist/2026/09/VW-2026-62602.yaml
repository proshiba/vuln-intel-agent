title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma: Serialize channel state checks\n\npause() and resume() read and update
  channel state without holding vc.lock,\nwhile the interrupt handlers update the
  same state under it. Take the same\nlock around those state checks so that request,
  status, and configured stay\nconsistent.\n\nFor example, pause() can observe EDMA_ST_BUSY
  right before the interrupt\nhandler completes the final descriptor and moves the
  channel to\nEDMA_ST_IDLE, and then record EDMA_REQ_PAUSE on an already idle channel.
  No\nfurther interrupt will acknowledge the request, and since issue_pending()\n\
  requires EDMA_REQ_NONE, the channel is wedged for good: terminate_all()\nleaves
  the stale request behind, so even reconfiguring the channel does not\nrecover it.\n\
  \nissue_pending() already runs under vc.lock, but it tests configured before\ntaking
  it. Move that test under the lock as well, so configured, request,\nand status are
  evaluated as one channel-st"
