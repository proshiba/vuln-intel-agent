title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrust:
  devres: fix race between concurrent revokers\n\nThere is a potential race condition
  when two paths try to revoke a\nDevres concurrently.\n\nThe driver core's devres_release_all()
  calls Revocable::revoke() via the\nrelease callback, while Devres::drop() calls
  revoke_nosync() on another\nCPU.\n\nThe revoker that does not claim the is_available
  swap returns\nimmediately, but the revoker that did may still be executing\ndrop_in_place()
  on the inner data. This can cause a use-after-free when\nthe other revoker's caller
  proceeds to drop adjacent resources that\ndrop_in_place() still references (e.g.,
  Devres<DmaMappedSgt> racing with\nSGTable freeing the backing sg_table and pages).\n\
  \nFix this by adding a Completion. The release callback signals the\nCompletion
  after revoke() finishes, and Devres::drop() waits for it when\nit loses the is_available
  swap. This ensures the wrapped object is fully\ntorn down before Devres::drop()
  returns."
