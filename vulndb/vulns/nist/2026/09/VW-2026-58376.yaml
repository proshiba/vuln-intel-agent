title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  libata-scsi: fix DSM TRIM for sector sizes larger than 2048 bytes\n\nata_scsi_write_same_xlat()
  translates a SCSI WRITE SAME command with the\nUNMAP bit set into an ATA DATA SET
  MANAGEMENT TRIM command.  The TRIM\ndescriptor is built by ata_format_dsm_trim_descr()
  into the 2048-byte\nata_scsi_rbuf staging buffer, and the number of bytes copied
  is compared\nagainst the logical sector size by the caller:\n\n\tsize = ata_format_dsm_trim_descr(scmd,
  trmax, block, n_block);\n\tif (size != len)\t\t/* len == sdp->sector_size */\n\t
  \tgoto invalid_param_len;\n\nata_format_dsm_trim_descr() clamps the copy length
  to ATA_SCSI_RBUF_SIZE\n(2048).  On a device whose logical sector size exceeds that
  (e.g. a 4Kn\ndevice, where sector_size == 4096) the function can never return more
  than\n2048, while the caller expects it to return sector_size.  The comparison\n\
  therefore always fails, so every TRIM is rejected with \"Parameter list\nlength
  error\" and WAR"
