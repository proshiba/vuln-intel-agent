title: Flowise is a low-code platform for building LLM applications. In versions
  up to and including 3.1.3, the POST /api/v1/node-load-method/:name endpoint is
  mounted without any route-level permission check and invokes component 
  loadMethods with an attacker-controlled nodeName, loadMethod, inputs, and 
  credential value. The selected credential is resolved by raw Credential.id via
  getCredentialData() and decrypted without verifying Credential.workspaceId 
  against the caller's active or shared workspace, unlike other credential read 
  paths which are workspace-scoped. As a result, an authenticated low-privilege 
  user (or workspace API key) in one workspace can supply a credential ID owned 
  by another workspace and cause Flowise to act as a confused deputy, performing
  third-party provider calls with the victim workspace's credential and 
  returning provider metadata to the attacker. Statically identified affected 
  load methods include Google Drive listFiles, Google Sheets listSpreadsheets, 
  and AWS Dyna
