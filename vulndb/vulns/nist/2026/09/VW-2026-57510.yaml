title: A flaw was found in the Device Authorization Grant flow of Keycloak, an 
  identity and access management solution. The issue occurs because the token 
  redemption process fails to check if a user account is currently locked due to
  brute-force protection. If an attacker has an active session for a locked 
  account, they can complete the device login process and receive new security 
  tokens. This allows the attacker to maintain access to the account even when 
  it should be temporarily disabled to prevent unauthorized entry.
