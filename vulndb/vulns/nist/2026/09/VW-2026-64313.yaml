title: radare2 is a UNIX-like reverse engineering framework and command-line 
  toolset. Prior to 6.2.0, radare2's Lua 5.3 bytecode function parser was 
  vulnerable because the Lua 5.3 bytecode function parser read fixed 
  function-metadata fields immediately after a function-name string without 
  checking the remaining buffer length. The vulnerability is triggered by 
  opening or inspecting a crafted Lua 5.3 bytecode file whose function-name 
  string ends at the input-buffer boundary. The parser read two integers and 
  three one-byte fields beyond the allocated input buffer. This can cause 
  invalid parser results or process termination; no attacker-observable memory 
  disclosure has been demonstrated. This issue is fixed in version 6.2.0.
