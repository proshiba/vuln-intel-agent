title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  reject invalid block index in GC ioctl\n\nSyzbot reported list corruption caused
  by a double list_add_tail() call on\nbh->b_assoc_buffers within nilfs_lookup_dirty_data_buffers().\n\
  \nAnalysis revealed that the root cause was the insertion of a page/folio\nwith
  a page index of ULONG_MAX into the page cache via the GC ioctl.\nfilemap_get_folios_tag(),
  called by nilfs_lookup_dirty_data_buffers(),\nrepeatedly detects a dirty folio with
  a page index of ULONG_MAX due to\nindex wrap-around, leading to duplicate processing
  of dirty buffers.\n\nAs a preparatory step, the GC ioctl loads the page/folio of
  the block to\nbe moved during GC and inserts it into the page cache based on information\n\
  in the nilfs_vdesc structure passed as an argument.  Normally, this does\nnot cause
  issues because the user-space GC library configures the\nnilfs_vdesc structure properly.\
