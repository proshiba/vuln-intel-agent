title: OpenPanel fails to enforce read-only project access level on 26 of 29 
  mutating procedures, allowing read-level members to modify, delete, and 
  publish project data. Attackers with explicit read-only access can delete 
  reports and dashboards, schedule entire projects for deletion, publish private
  analytics to public share links, and modify alerting rules by exploiting 
  missing access level validation in mutation resolvers.
