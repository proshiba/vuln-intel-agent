title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvdpa_sim_net:
  check TX pull result before RX copy\n\nvringh_iov_pull_iotlb() returns a signed
  byte count.  A failed TX pull is\ncurrently added to the unsigned byte counter and
  then passed as a size_t\nlength to receive_filter() and vringh_iov_push_iotlb().\
  \  A negative error\ncan therefore become a large length in the RX path.\n\nHandle
  non-positive pull results before every length use.  Count the TX\nerror and complete
  the consumed TX descriptor with zero bytes.\n\nI found this bug myself, though the
  patch was written with AI assistance."
