title: "A cross-site request forgery (CSRF) vulnerability exists in MISP due to form-security
  and CSRF protections being disabled based on whether an incoming request was identified
  as a REST request.\n\nMISP's REST detection can be influenced by request properties
  such as the URL suffix or the HTTP Accept header. Because Accept: application/json
  can be supplied by a cross-origin page without requiring a CORS preflight, an attacker
  could cause a request originating from another website to be treated as REST traffic.
  MISP would consequently disable its normal form-security and CSRF validation even
  though the request was authenticated using the victim's existing browser session.\n\
