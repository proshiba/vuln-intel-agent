title: A flaw was found in libsoup. The soup_uri_decode_data_uri() function 
  incorrectly treated base64 data-URI payloads as NUL-terminated strings when 
  calling g_base64_decode_inplace(). If the percent-decoded payload contained 
  embedded NUL bytes, the decoded length could remain uninitialized and be used 
  as the size of the returned GBytes. This can lead to an out-of-bounds read or 
  application crash when processing a crafted data URI.
