title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mm_init:
  deferred_grow_zone(): fix out-of-range first_deferred_pfn\n\nWith CONFIG_DEFERRED_STRUCT_PAGE_INIT
  enabled, deferred_grow_zone()\ninitializes struct pages early in boot to satisfy
  an allocation.\n\nWith a large CMA reservation in place, the ranges deferred_init_memmap()\n\
  finds may not add up to the allocation it was asked for, and the function\nends
  up initializing the memory map of the entire zone and still falls\nshort.\n\nThat
  is fine in itself: the function accounts for it and leaves the\ncaller to decide
  whether it now has enough memory.\n\nHowever, the update of pgdat->first_deferred_pfn
  that tracks where\nuninitialized memory map starts could overflow.\n\nIf the node's
  RAM end is not aligned on PAGES_PER_SECTION boundaries and\nsome deferred struct
  pages were initialized, pgdat->first_deferred_pfn\nwould point past the end of the
  node's memory.\n\ndeferred_init_memmap() later picks up from pgdat->first_deferred_pfn
  and"
