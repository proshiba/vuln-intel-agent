title: "Description\n\nThe DRPC server kept a map from function name to request queue
  and created an entry the first time a\nfunction name was seen. No code path ever
  removed an entry: request cleanup removed the request from its\nqueue, and the shutdown
  path drained queues, but the queue object and its map entry remained for the life
  of\nthe process.\n\nFunction names come from the client and are not constrained
  to functions any topology has registered, so the\nnumber of retained entries is
  bounded only by the number of distinct names an attacker chooses to send, and\n\
  each retained entry holds the name itself. `drpc.authorizer` is unset by default,
  so no credentials are\nrequired to reach the endpoint.\n\nThe retained state is
  permanent rather than a transient load spike, so the effect accumulates until the
  DRPC\nserver exhausts its heap.\n\nMitigation\n\nUpgrade to 3.1.0, where a function's
  queue is removed once nothing is waiting in it.\n\nUsers who cannot upgrade immediately
  should configure `drpc.authorizer"
