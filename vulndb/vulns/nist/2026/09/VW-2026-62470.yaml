title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  x86: Fix trampoline stack size for 128-bit arguments\n\nbtf_distill_func_proto()
  accepts a function argument up to 16 bytes, so a\n128-bit scalar such as __int128
  reaches the x86 trampoline with\narg_size == 16. But the current implementation
  assumes an __int128\nargument only needs one register, so the register save area
  is\nunder-allocated and save_args() overwrites adjacent stack slots.\n\nCompute
  the register count from arg_size for all arguments to fix it."
