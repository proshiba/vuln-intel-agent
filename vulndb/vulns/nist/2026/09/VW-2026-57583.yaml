title: "capgo.app (npm package `capgo`) through version 12.207.1 does not compare
  the caller's role rank against the requested role in the validateInvite() function
  of supabase/functions/_backend/private/invite_new_user_to_org.ts. The POST /private/invite_new_user_to_org
  endpoint only requires the org.update_user_roles permission for org_super_admin
  invitations, so an authenticated user holding only the org.invite_user permission
  (e.g., an org_member) can invite an external user as org_admin or org_billing_admin.
  When the invited account accepts the invitation via POST /private/accept_invitation,
  ensureOrgMembership creates the role binding using the Supabase service-role key,
  which bypasses the prevent_role_binding_priority_escalation and check_org_user_privileges
  database triggers. This allows privilege escalation resulting in full administrative
