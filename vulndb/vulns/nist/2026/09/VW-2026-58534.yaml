title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndevice
  property: fix infinite loop in fwnode_for_each_child_node()\n\nWhen iterate over
  children of a fwnode that has a secondary fwnode,\nfwnode_get_next_child_node()
  can enter an infinite loop if the secondary\nfwnode has more than one child.\n\n\
  \                       Parent        Child\n      (Primary fwnode)   FWa:   {FWa1,
  FWa2, FWa3}\n    (Secondary fwnode)   FWb:   {FWb1, FWb2}\n\nIn this case:\n\n ┌─>
  fwnode_get_next_child_node(FWa, FWa1)\n │    - fwnode_call_ptr_op(FWa, get_next_child_node,
  FWa1) returns FWa2\n │\n │   ...\n │\n │   fwnode_get_next_child_node(FWa, FWa3)\n\
  \ │    - fwnode_call_ptr_op(FWa, get_next_child_node, FWa3) returns NULL\n │   \
  \ - fwnode_call_ptr_op(FWb, get_next_child_node, FWa3) returns FWb1\n │\n │   fwnode_get_next_child_node(FWa,
  FWb1)\n │    - fwnode_call_ptr_op(FWa, get_next_child_node, FWb1) returns FWa1\n\
  \ └────┘\n\nThis cause fwnode_for_each_child_node() to loop indefinitely, reapeatedly\n\
  output {FWa1, FW"
