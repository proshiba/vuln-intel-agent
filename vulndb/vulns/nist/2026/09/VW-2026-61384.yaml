title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: hd3ss3220: track VBUS enable state per consumer\n\nregulator_is_enabled()
  reports the aggregate regulator state, not\nwhether this consumer holds an enable
  reference. If another consumer\nenables VBUS first, the driver can skip its own
  regulator_enable() call\nand later attempt to drop a reference it never acquired,
  triggering an\nunbalanced regulator disable warning.\n\nTrack successful enable
  and disable calls locally. Keep the state\nunchanged when an operation fails so
  a later role or ID notification\nretries the operation while this consumer keeps
  balanced references."
