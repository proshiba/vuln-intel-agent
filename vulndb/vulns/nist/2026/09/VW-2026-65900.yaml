title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: avoid using uninitialized SIDs in cifs_posix_to_fattr()\n\ncifs_posix_to_fattr()
  ignores the return value of posix_info_parse().\nWhen a malformed POSIX directory
  entry is encountered (e.g. invalid\nSID lengths from an untrusted server), posix_info_parse()
  returns -1\nwithout populating the 'parsed' struct.  The uninitialized stack\nmemory
  in parsed.owner and parsed.group is then passed to\nsid_to_id(), which processes
  the garbage bytes and passes them to\nrequest_key() to construct a SID string, potentially
  leaking kernel\nstack contents to the userspace idmap daemon.\n\nFix this by checking
  the return value and skipping the SID-to-id\nmapping when parsing fails.  The remaining
  fattr fields (timestamps,\nmode, etc.) are populated directly from the 'info' pointer
  so they\nare unaffected."
