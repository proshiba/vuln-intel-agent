title: "In the Linux kernel, the following vulnerability has been resolved:\n\nisofs:
  fix out-of-bounds page array access on empty zisofs block\n\nzisofs_uncompress_block()'s
  empty-block fast path returns\npcount << PAGE_SHIFT, ignoring the incoming poffset,
  unlike the\ndecompression path which returns bytes produced relative to poffset.\n\
  zisofs_fill_pages() uses that return to advance its page cursor, so when\nthe zisofs
  block size is below PAGE_SIZE and a sub-page block leaves\npoffset partway into
  a page, a following empty block over-counts and\nadvances pages[] one element past
  its end, after which\n\"if (poffset && *pages)\" reads pages[1] out of bounds. \
  \ rock.c only\nrejects a block-size shift > 17, so a crafted \"ZF\" Rock Ridge record
  can\nset it below PAGE_SHIFT; the bug is reached by an ordinary read() of a\ncompressed
  file on such a mounted ISO9660 image.\n\nReturn the byte count relative to poffset
