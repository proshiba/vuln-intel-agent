title: The Customer Reviews for WooCommerce plugin for WordPress is vulnerable 
  to authorization bypass in all versions up to, and including, 5.120.0. This is
  due to the plugin not properly verifying that a user is authorized to perform 
  an action. This makes it possible for unauthenticated attackers to permanently
  delete arbitrary attachments from the Media Library — including 
  administrator-owned product images, logos, and documents — by injecting their 
  IDs into a review that is later trashed and purged. Exploitation requires a 
  public review-form link (a 13-hex formId distributed to customers via e-mail),
  which exposes the nonce needed to reach the handler without any WordPress 
  account or session.
