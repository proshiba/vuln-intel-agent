title: Http4s is a Scala interface for HTTP services. Prior to 0.23.35 and 
  1.0.0-M47, the DigestAuth server middleware removes fresh nonces and stops 
  eviction at the first stale nonce because its stale-nonce comparison is 
  inverted. On an application that protects at least one route with DigestAuth, 
  an unauthenticated attacker can repeatedly trigger authentication challenges, 
  causing the persistent nonce map to grow until the JVM exhausts heap memory. 
  This issue is fixed in versions 0.23.35 and 1.0.0-M47.
