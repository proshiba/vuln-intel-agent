title: NUUO Network Video Recorder 2.0.0 is vulnerable to arbitrary file read. 
  In up.php, the url parameter submitted by the user via POST is received, and 
  fopen() is used to open the URL in binary read-only mode. The content is then 
  written to the /tmp/ directory, with the filename derived from basename() of 
  the URL. This operation requires no authentication.
