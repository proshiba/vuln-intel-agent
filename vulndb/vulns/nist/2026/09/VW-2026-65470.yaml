title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  flush dirty data before punching a hole\n\nPunching a hole after a large buffered
  write may leave the range\nreported as data. Reproduce it with:\n\n  xfs_io -f \\\
  \n    -c \"pwrite -b 3m -S 0x61 0 3m\" \\\n    -c \"fpunch 1m 1m\" \\\n    -c \"\
  seek -h 0\" \\\n    -c \"seek -d 1m\" \\\n    /mnt/test/repro\n\nPunching 1 MiB
  at offset 1 MiB should produce:\n\n  0          1 MiB       2 MiB       3 MiB\n\
  \  |  DATA    |   HOLE    |   DATA    | EOF\n\nInstead, the entire file is reported
  as data. SEEK_HOLE(0) returns EOF,\nand SEEK_DATA(1M) returns 1M.\n\nThis happens
  because a dirty folio spanning the punched range can be\nwritten back after the
  punch and refill the hole.\n\nFix this by flushing and waiting for dirty data in
  the punched range\nbefore invalidating the page cache and issuing FSCTL_SET_ZERO_DATA.\n\
  \nThe xfstests generic/539 pass against Samba/ksmbd with this change."
