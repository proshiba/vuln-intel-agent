title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Reject out of range DT protocol IDs\n\nSCMI protocol IDs carried in message
  headers are limited by\nMSG_PROTOCOL_ID_MASK. The DT parsing paths noticed protocol
  IDs\noutside that range, but only logged an error and then kept processing\nthe
  invalid value.\n\nThat lets a malformed 32-bit DT reg value reach helpers which
  take a u8\nprotocol ID, where it can be truncated and/or treated as a different\n\
  protocol.\n\nFor channel setup, two different out-of-range values can also be used
  as\ndistinct IDR keys while aliasing the generated SCMI protocol identity.\n\nSkip
  DT protocol nodes whose reg value does not fit the SCMI protocol ID\nfield before
  setting up channels or creating protocol devices."
