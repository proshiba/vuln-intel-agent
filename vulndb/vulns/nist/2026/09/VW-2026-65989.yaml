title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Take the reference before publishing the named histogram trigger\n\nevent_hist_trigger_named_init()
  puts the trigger on the global\nnamed_triggers list and only then takes the reference
  on the trigger it\nshares its histogram with:\n\n\tdata->ref++;\n\n\tsave_named_trigger(data->named_data->name,
  data);\n\n\tret = event_hist_trigger_init(data->named_data);\n\tif (ret < 0) {\n\
  \t\tkfree(data->cmd_ops);\n\t\tdata->cmd_ops = &trigger_hist_cmd;\n\t}\n\n\treturn
  ret;\n\nevent_hist_trigger_init() fails when alloc_hist_pad() cannot allocate, and\n\
  nothing takes the trigger back off the list on the way out.\nevent_hist_trigger_parse()
  frees it, and the next lookup by name reads the\nfreed object:\n\n BUG: KASAN: slab-use-after-free
  in find_named_trigger+0xac/0xc0\n Read of size 8 at addr ffff888009346860 by task
  init/1\n  find_named_trigger+0xac/0xc0\n  hist_register_trigger+0xc1/0xa00\n  event_hist_trigger_parse+0x3146/0x6af0\n\
  \  event_trigger_write+0xce/0"
