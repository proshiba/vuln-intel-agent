title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disable preemption in __bpf_get_stack\n\nget_perf_callchain() returns a per-CPU
  perf_callchain_entry buffer and\nreleases its recursion slot via put_callchain_entry()
  before returning,\nso nothing keeps the entry reserved while __bpf_get_stack() consumes\n\
  it below.\n\nA preemptible BPF program (e.g. a non-sleepable raw tracepoint program\n\
  on a PREEMPT kernel, which runs under migrate_disable() but not\npreempt_disable())
  can be scheduled out between obtaining the entry\nand the copy. Another task scheduled
  on the same CPU then reuses the\nsame per-CPU buffer and overwrites trace->nr with
  a larger value.\ncopy_len is then computed from the inflated trace->nr and can exceed\n\
  the caller's buffer, causing an out-of-bounds write in the memcpy()\nand in the
  build_id path.\n\nThe rcu_read_lock() taken here alone does not prevent this. It
  is\nonly taken on the may_fault path, and under CONFIG_PREEMPT_RCU it does\nnot
  disable preemption; i"
