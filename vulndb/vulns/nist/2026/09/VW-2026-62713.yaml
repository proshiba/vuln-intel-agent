title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-apple:
  Use acquire/release for queue enabled state\n\napple_nvme_init_queue() initializes
  queue state and then marks the queue\nenabled. The interrupt and request paths check
  enabled before using that\nqueue state.\n\nThe old wmb() after WRITE_ONCE(enabled,
  true) does not publish the\nearlier initialization before enabled becomes visible.
  Use a release store\nwhen enabling the queue and acquire loads when testing it.\n\
  \nAlthough the shutdown-side enabled accesses are not used for publishing\nqueue
  initialization, use helpers for them as well for consistency."
