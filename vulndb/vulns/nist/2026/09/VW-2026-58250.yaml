title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/cpum_cf:
  Handle CPU hotplug via prepare/dead callbacks\n\nThe command 'perf stat -e cycles
  -- <command>' crashes the kernel\nwhen CPUs are hotplug added during that run.\n\
  \nRoot cause is the allocation of struct cpu_cf_events at first\nevent initialization.
  The allocation is dynamic and the first\nevent that has task context creates such
  a structure for\neach online CPU. This is not sufficient. CPUs may be offline\n\
  during event creation and can be set online during the\nperf run time. For example
  commands\n\n # echo 0 > /sys/devices/system/cpu/cpu1/online\n # perf stat -e cycles
  -i -- stress-ng -t10s --matrix X\n # sleep 1\n # echo 1 > /sys/devices/system/cpu/cpu1/online\n\
