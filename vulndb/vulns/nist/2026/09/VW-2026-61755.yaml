title: "Improper validation of pod identifier uniqueness in aws-network-policy-agent
  in Amazon EKS Network Policy Agent before v1.4.0 might allow an authenticated remote
  user to bypass NetworkPolicy enforcement on co-located pods in other namespaces
  via crafted pod and namespace names that produce pod identifier collisions.\n\n\n\
  \nTo remediate this issue, users should upgrade to Amazon EKS Network Policy Agent
  1.4.0 or later and Amazon VPC CNI Managed Add-on v1.22.4 or later (which includes
  Network Policy Agent v1.4.0)."
