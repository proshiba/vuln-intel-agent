title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix readdir position truncation on 32-bit kernels\n\nIn ocfs2_dir_foreach_blk_el(),
  the directory cookie position is\nrebuilt with\n\n\tctx->pos = (ctx->pos & ~(sb->s_blocksize
  - 1)) | offset;\n\n`ctx->pos` is loff_t (signed 64-bit), while `sb->s_blocksize`
  is\nunsigned long.  On 32-bit kernels unsigned long is 32-bit, so the mask\n\n\t
  ~(sb->s_blocksize - 1)\n\nis computed as a 32-bit unsigned value (e.g. 0xfffff000
  for a 4 KiB\nblock size).  In the AND expression with the 64-bit `ctx->pos`, that\n\
  unsigned operand is zero-extended to 64 bits per the usual arithmetic\nconversions,
  yielding 0x00000000fffff000.  The high 32 bits of\n`ctx->pos` are silently cleared,
  even though directory size is\nallowed to exceed 4 GiB.\n\nWhen readdir() crosses
  the 4 GiB boundary on a 32-bit kernel the\nposition is reset back into the first
  4 GiB block, making the\nre-validation path re-enumerate already-returned dirents
  indefinitely.\n\nThis is ocfs2_di"
