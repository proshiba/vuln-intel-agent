title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-tcp:
  fix usage of page_frag_cache\n\nnvme uses page_frag_cache to preallocate PDU for
  each preallocated request\nof block device. Block devices are created in parallel
  threads,\nconsequently page_frag_cache is used in not thread-safe manner.\nThat
  leads to incorrect refcounting of backstore pages and premature free.\n\nThat can
  be catched by !sendpage_ok inside network stack:\n\nWARNING: CPU: 7 PID: 467 at
  ../net/core/skbuff.c:6931 skb_splice_from_iter+0xfa/0x310.\n\ttcp_sendmsg_locked+0x782/0xce0\n\
  \ttcp_sendmsg+0x27/0x40\n\tsock_sendmsg+0x8b/0xa0\n\tnvme_tcp_try_send_cmd_pdu+0x149/0x2a0\n\
  Then random panic may occur.\n\nFix that by serializing the usage of page_frag_cache."
