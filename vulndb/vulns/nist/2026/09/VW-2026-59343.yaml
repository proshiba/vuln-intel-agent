title: A flaw was found in NetworkManager-l2tp. The plugin writes 
  attacker-controlled VPN connection properties (vpn.data and vpn.secrets 
  values) unescaped into a generated ipsec.conf file that pluto loads as root. A
  local unprivileged user can create and activate their own L2TP VPN profile 
  containing a newline-injected leftupdown directive; pluto executes that 
  command as root when the IKE security association is established, resulting in
  local privilege escalation. This is the same bug class as CVE-2018-10900 
  (NetworkManager-vpnc).
