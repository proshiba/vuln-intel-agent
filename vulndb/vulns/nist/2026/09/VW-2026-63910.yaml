title: GoCD is a continuous deliver server. Prior to 26.1.0, GoCD can return 
  unmasked credentials that administrators stored in the userinfo portion of 
  source control material URLs through several read-only APIs available to 
  regular authenticated users. Although GoCD recommends dedicated username and 
  password fields or secret-management plugins, legacy configuration permits 
  credentials in material URLs, and not every mixed-use API consistently applies
  URL masking for every material type. An authenticated user with access to an 
  affected pipeline can obtain credentials embedded in its material URL, while 
  dedicated password fields remain encrypted and are not exposed by this issue. 
  This issue is fixed in version 26.1.0.
