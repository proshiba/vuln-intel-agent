title: "If an attacker-controlled authoritative server can produce a negative answer
  that is exactly 65536 bytes, then a flaw in `named` results in a negative cache
  entry of 0 bytes. When this entry is subsequently read, `named` aborts.\nThis issue
  affects BIND 9 versions 9.11.0 through 9.18.50, 9.20.0 through 9.20.27, 9.21.0 through
  9.21.25, 9.11.3-S1 through 9.18.50-S1, and 9.20.9-S1 through 9.20.27-S1."
