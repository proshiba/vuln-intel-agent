title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the expression compiler sanitizer resolved through 
  dynamically scoped this and did not reject reserved class member names. A 
  class field named __sanitize could rebind the sanitizer and reach the Function
  constructor, enabling backend code execution and editor-preview JavaScript 
  execution. The affected AST hook is PrototypeSanitizer in 
  packages/workflow/src/expression-sandboxing.ts. This issue is fixed in 
  versions 1.123.76, 2.37.7 and 2.38.2.
