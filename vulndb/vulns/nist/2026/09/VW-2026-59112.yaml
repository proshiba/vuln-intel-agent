title: "Description\n\nWhen launching a Docker or OCI worker, the setuid-root `worker-launcher`
  first changes ownership of the\nentire worker directory to the untrusted topology
  user, and only afterwards reads and acts on the command\nfile that the supervisor
  wrote into that same directory. The file is opened without `O_NOFOLLOW` and without\n\
  re-verifying its owner, so between the ownership change and the read the tenant
  can replace its contents.\n\nFor the Docker path the parsed command is executed
  with real uid 0, and the command sanitiser is not a\nprivilege boundary: it admits
  `-v` with an arbitrary source, `--device`, `--cap-add`, `--security-opt`,\n`--user`
  and `--net`, and copies positional arguments through verbatim. A rewritten file
  therefore yields an\nattacker-authored, root-equivalent container invocation with
  the host filesystem available.\n\nFor the OCI path the same rewrite window applies,
  and mount validation is structural only, with no\nsource or destination allow-list,
