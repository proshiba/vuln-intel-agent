title: "An incorrect authorization check in Apache DolphinScheduler allows an authenticated
  user with only read permission for a project to modify a workflow instance in that
  project through the PUT /projects/{projectCode}/workflow-instances/{id} endpoint.
  The endpoint does not enforce the write permission required for this operation,
  allowing the user to make unauthorized changes to workflow instances.\n\n\n\nThis
  issue affects Apache DolphinScheduler: before 3.4.3.\n\n\n\nUsers are recommended
  to upgrade to version 3.4.3, which fixes the issue."
