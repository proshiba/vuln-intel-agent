title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qualcomm: rmnet: restore skb->dev on deaggregated frames\n\nrmnet_map_deaggregate()
  allocates each sub-frame with alloc_skb() and\nleaves skb->dev NULL. __rmnet_map_ingress_handler()
  assigns\nskb->dev = ep->egress_dev only on the data path, but a MAP command frame\n\
  is dispatched to rmnet_map_command() before that, so rmnet_map_send_ack()\nruns
  netif_tx_lock(skb->dev) on a NULL device. An unprivileged user\nreaches this by
  unsharing a user+net namespace, creating an rmnet link\nover a tap device with INGRESS_DEAGGREGATION
  and INGRESS_MAP_COMMANDS,\nand writing an aggregated frame carrying a flow-control
  command to the\ntap fd.\n\nRestore the assignment dropped by 378e25357ac7, so every
  skb leaving\nrmnet_map_deaggregate() has a valid device.\n\n  BUG: KASAN: null-ptr-deref
  in _raw_spin_lock (kernel/locking/spinlock.c:158)\n  Write of size 4 at addr 00000000000004b4
