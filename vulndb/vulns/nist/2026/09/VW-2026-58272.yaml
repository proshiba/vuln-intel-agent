title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-tcp:
  do not accept C2HData based on blk_rq_payload_bytes() alone\n\nCommit 25e5cb780e62
  (\"nvme-tcp: fix possible crash in write_zeroes\nprocessing\") established that
  blk_rq_payload_bytes() must not be read\nwithout first checking blk_rq_nr_phys_segments(),
  and recorded the\nresult in nvme_tcp_setup_cmd_pdu() as req->data_len. The receive
  side\nwas left as it was.\n\nThe two differ for REQ_OP_WRITE_ZEROES, which has no
  physical segments\nbut a non-zero blk_rq_bytes(), so setup leaves req->iter untouched\n\
  while the receive gate lets a C2HData through and nvme_tcp_recv_data()\ncopies into
  whatever the previous command on that tag left there. The\ndriver-private area is
  zeroed only when the tag set is allocated.\n\nReproduced with a test target that
  leaves a residual iterator on a tag\nand then sends a C2HData for a WRITE_ZEROES
  command on the same tag:\n\nBUG: KASAN: wild-memory-access in _copy_to_iter+0x642/0x1330\n\
  Write of size 512"
