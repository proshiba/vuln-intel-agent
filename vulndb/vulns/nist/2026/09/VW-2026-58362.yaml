title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  apple-soc: Fix OPP table cleanup\n\napple_soc_cpufreq_init() adds OPP tables from
  firmware, but\nsome failure paths do not remove them. The driver also uses\ndev_pm_opp_remove_all_dynamic(),
  which is not the right cleanup\nhelper for OPP tables loaded from firmware.\n\n\
  Use the cpumask OPP helper after the policy CPU mask has been\npopulated. Pair it
  with the matching cpumask remove helper on\nfailure paths and in apple_soc_cpufreq_exit().
  This also removes\nthe separate dev_pm_opp_set_sharing_cpus() call, as the cpumask\n\
  helper loads the DT OPP tables for all CPUs in the policy."
