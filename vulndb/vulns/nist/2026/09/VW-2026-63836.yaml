title: A flaw was found in the Authorization Services component of Keycloak, an 
  open-source identity and access management solution. The issue occurs in the 
  policy evaluation endpoint, which is used by administrators to test how access
  policies apply to specific users. Due to missing authorization checks, a 
  delegated administrator with limited viewing privileges can access the full 
  profile and role information of any user in the realm, even if they are not 
  permitted to view user details. This could lead to the exposure of sensitive 
  information such as email addresses and assigned security roles.
