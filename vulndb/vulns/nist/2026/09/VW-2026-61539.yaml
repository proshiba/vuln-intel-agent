title: FileRise before version 3.28.0 contains a privilege escalation 
  vulnerability that allows authenticated low-privilege attackers to gain 
  unauthorized read and write access by exploiting improper session isolation 
  between the WebDAV interface and the web application session context. 
  Attackers can combine valid Basic-Auth credentials with an active admin 
  PHPSESSID cookie to bypass authorization boundaries, as the WebDAV layer 
  incorrectly inherits elevated privileges from an ambient web session rather 
  than enforcing independent stateless authentication per RFC 4918.
