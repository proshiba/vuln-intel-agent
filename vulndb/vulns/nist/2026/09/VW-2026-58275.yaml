title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd:
  pin next file across nlm_inspect_file lock-drop\n\nnlm_traverse_files() pins the
  current file with f_count++ across\na mutex_unlock for nlm_inspect_file(), but nothing
  pins the saved\nnext pointer.  A concurrent nlm_release_file() can kfree the next\n\
  file during the unlock window, and the iterator dereferences freed\nmemory on the
  next loop step.\n\nPin both current and next before the lock-drop.  Advance by\n\
  swapping the pinned cursors at the end of each iteration so next\nis always held
  alive across the unlock.\n\nAlways call nlm_file_release() after dropping the iteration
  pin,\nregardless of whether the file matched the predicate.  Use\nnlm_file_inuse(),
  which does a live walk of the inode lock list,\nrather than the cached f_locks field,
  so skipped files that never\nran nlm_inspect_file() are evaluated correctly.\n\n\
  Because every file in a hash bucket is now pinned and released,\nfiles skipped by
  the is_failover_file predicat"
