title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4.1:
  zero referring call lists before decoding\n\ndecode_cb_sequence_args() allocates
  csa_rclists with kmalloc_objs(), so\neach referring_call_list starts uninitialized.
  decode_rc_list() assigns\nrcl_refcalls only when rcl_nrefcalls is nonzero. A valid
  list with zero\nreferring calls therefore leaves the pointer uninitialized, and\n\
  nfs4_callback_sequence() later passes stale slab contents to kfree().\n\nAllocate
  csa_rclists with kzalloc_objs() so every rcl_refcalls member is\nNULL from the beginning,
  including valid empty referring call lists."
