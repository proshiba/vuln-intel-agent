title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: qcom-pmic-typec: disable cc_debounce_dwork on stop\n\ncc_debounce_dwork is
  queued from the set_cc() and start_toggling()\ncallbacks, which run from TCPM's
  kthread worker.  port_stop() returns\nbefore tcpm_unregister_port() destroys that
  worker.  Flushing the worker\nduring unregister may therefore run a callback which
  queues the delayed\nwork after port_stop() has returned.\n\nThe delayed work can
  then run after devres has freed pmic_typec_port.\n\nUse disable_delayed_work_sync()
  in port_stop() to cancel a pending\ninstance and prevent the TCPM callbacks from
  queueing another one.\n\nThis issue was found by an in-house static analysis tool."
