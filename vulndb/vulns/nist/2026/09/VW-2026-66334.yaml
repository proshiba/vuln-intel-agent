title: 'RabbitMQ is a messaging and streaming broker. From 4.0.0 until 4.3.3, 4.2.9,
  4.1.14, and 4.0.23, Shovel does not format state logged by the crash reporter and
  can leave unencrypted credentials in a crash dump file. the shovel worker genserver
  processes does not implement the formatstatus/2 callback. When these processes crash
  (e.g., due to network partitions, connection failures), the OTP SASL error handler
  writes the full process state , including plaintext AMQP passwords and URIs , to
  the error log. This is particularly severe for the shovel worker, which stores deobfuscated
  plaintext URIs (including amqp://user:password@host format) in its genserver state
  for the entire process Automatic Credential Exposure: Shovel worker crashes (common
  during network partitions) automatically write plaintext upstream/downstream passwords
  to error logs No Special Configuration Needed: Unlike DEBUG logging, SASL error
  reports are always active Broad. This issue is fixed in versions 4.3.3, 4.2.9, 4.1'
