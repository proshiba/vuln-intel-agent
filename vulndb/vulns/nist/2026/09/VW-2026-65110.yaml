title: RabbitMQ is a messaging and streaming broker. Prior to versions 4.0.22, 
  4.1.11, 4.2.6, and 4.3.0, accept_content/2 at line 56 calls 
  rabbit_stream_manager:create_super_stream/... directly after is_authorized 
  (which only checks the management tag + vhost access via is_authorized_vhost).
  The stream-protocol equivalent (rabbit_stream_reader.erl create_super_stream 
  handler) calls rabbit_stream_utils:check_super_stream_management_permitted/4 
  which enforces configure on the exchange and each partition queue. The HTTP 
  handler omits this call entirely. A user with management tag and vhost access 
  , but no configure permission on any resource , can create super-streams (an 
  exchange + N partition stream queues + bindings) via the HTTP API. The native 
  stream-protocol path enforces configure on each resource; the HTTP path does 
  not, creating a privilege escalation from 'can view' to 'can create persistent
  cluster-wide resources.' Preconditions include rabbitmq_stream_management 
  plugin enabled manage
