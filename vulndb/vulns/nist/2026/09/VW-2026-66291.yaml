title: InvoicePlane is a self-hosted open source application for managing 
  invoices, clients, and payments. Prior to 1.7.2, InvoicePlane stores and 
  serves uploaded image attachments without stripping EXIF metadata. When an 
  administrator uploads an image through invoice attachments, quote attachments,
  or another attachment feature and shares it with another user, the recipient 
  can retrieve embedded GPS coordinates, timestamps, and device information. The
  preserved metadata can disclose private location and device details across 
  users. This vulnerability is fixed in 1.7.2.
