title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvsock:
  don't check the listener's sk_err in vsock_accept()\n\nSyzbot reported an issue
  which can be reproduced with these steps:\n\tr0 = socket(AF_VSOCK, SOCK_STREAM,
  0)\n\tbind(r0, {VMADDR_CID_ANY, PORT})\n\tconnect(r0, {VMADDR_CID_LOCAL, PORT})
  -> -1, EPROTO (self-connect)\n\tlisten(r0, backlog)                   -> 0\n\tr1
  = socket(AF_VSOCK, SOCK_STREAM, 0)\n\tconnect(r1, {VMADDR_CID_LOCAL, PORT}) -> 0\n\
  \taccept(r0)                            -> -1, EPROTO (stale sk_err)\n\nBasically,
  it creates a socket (r0) and triggers a self-connect after\nbinding it. This self-connect
  fails with EPROTO because it loops back\nto r0 while the socket is still in the
  TCP_SYN_SENT state, causing it\nto be incorrectly dispatched to the connecting-client
  path. The\nunexpected packet type encountered there sets sk_err to EPROTO.\n\nAfter
  that, it invokes a listen() call on the same socket. This\nlisten() call succeeds
  because the kernel's listening path never"
