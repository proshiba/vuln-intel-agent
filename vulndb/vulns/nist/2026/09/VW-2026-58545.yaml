title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/migrate_device:
  clear stale mapping after freeing swapcache\n\n__migrate_device_pages() reads the
  folio mapping before calling\nfolio_free_swap().  When folio_free_swap() succeeds,
  the folio is removed\nfrom the swap cache, but the saved mapping still points to
  swap_space.\n\nPassing the stale mapping to folio_migrate_mapping() makes it use
  the\nmapped-folio path for a folio that is no longer in swapcache.  It can then\n\
  operate on swap_space.i_pages with invalid reference accounting,\neventually triggering
  a folio reference count BUG.\n\nAfter a successful split, nr still contains the
  number of pages in the\noriginal large folio, although each resulting page is now
  a separate\norder-0 folio.  Reset nr to 1 so each split folio is processed separately,\n\
  including its own swapcache removal and mapping lookup.\n\nRefresh the saved mapping
  after folio_free_swap() so the current folio\nstate is used during migration."
