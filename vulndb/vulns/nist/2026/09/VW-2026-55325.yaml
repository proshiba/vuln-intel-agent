title: Improper handling of case sensitivity in the configuration validation 
  component of MongoDB Server may cause the authorization subsystem to remain in
  a default disabled state during server startup. An unauthenticated user with 
  network access to a deployment where this condition occurs can perform 
  arbitrary administrative operations, resulting in full impact of data 
  confidentiality, integrity, and availability.
