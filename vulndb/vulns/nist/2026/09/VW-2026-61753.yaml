title: Apache NiFi 1.5.0 through 2.11.0 provide REST API methods that replace 
  the entire contents of a Process Group using a client-supplied flow 
  definition, covering Process Group flow replacement together with versioned 
  flow update and rebase operations. Framework authorization for these methods 
  was limited to read and write privileges on the Process Group itself, unlike 
  the corresponding asynchronous update request methods, which also authorize 
  the components encapsulated in the Process Group along with referenced 
  Controller Services, Parameter Contexts, and Parameter Providers. As a result 
  of the missing authorization, an authenticated user with write access to a 
  Process Group could supply a flow definition that modifies or removes 
  components in descendant Process Groups protected by more restrictive access 
  policies, and could bind components to Controller Services and Parameter 
  Contexts without authorization for those referenced components. Existing 
  verification checks limited the impact
