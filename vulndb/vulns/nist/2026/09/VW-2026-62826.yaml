title: Frappe HR is an open-source human resources management solution (HRMS). 
  Prior to 16.7.0, an authenticated user with the HR User role can inject SQL 
  through filters in the Salary Payments Based on Payment Mode report. In 
  hrms/payroll/report/salary_payments_based_on_payment_mode/salary_payments_based_on_payment_mode.py,
  get_conditions constructs filter clauses from user-controlled values and 
  get_data incorporates those clauses into a string-formatted SQL query, 
  allowing extraction of arbitrary database data. This issue is fixed in 16.7.0.
