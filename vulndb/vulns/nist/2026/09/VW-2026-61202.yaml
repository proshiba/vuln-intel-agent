  \nYou may download the oc tool and use it to inspect release image metadata for
  x86_64, s390x, ppc64le, and aarch64 architectures. The image digests may be found
  at https://quay.io/repository/openshift-release-dev/ocp-release?tab=tags.\n\nThe
  sha values for the release are as follows:\n\n      (For x86_64 architecture)\n\
  \      The image digest is sha256:9bde31879df303de7db7c100878393a520215f33815d0d9b188e3b4436c876a7\n\
  \n      (For s390x architecture)\n      The image digest is sha256:41d57f38fe018b5dcfb3698eb4630f406ec7546f67819d55acd134c3a2e5827a\n\
  \n      (For ppc64le architecture)\n      The image digest is sha256:160d848722ca2e69777f512ff36adbd5485854b9905e0813aceecf83d549f5a2\n\
  \n      (For aarch64 architecture)\n      The image digest is sha256:b040b4af870284b4fcec18283bac700a5d3a0162cec2101a235dfa9a5f005b14\n\
  \nAll OpenShift Container Platform 4.22 users are advised to upgrade to these updated
  packages and images when they are available in the appropriate release channel.
  To check for available updates, use the OpenShift CLI (oc) or web console. Instructions
  for upgrading a cluster are available at https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html-single/updating_clusters/index#updating-cluster-cli."
- "For details on how to apply this update, which includes the changes described in
  this advisory, refer to:\n\nhttps://access.redhat.com/articles/11258\n\nThe system
  must be rebooted for this update to take effect.\n\nRed Hat recommends treating
  all kernel errata as security-relevant. Given the kernel's fundamental role, any
  bug has a higher chance of impacting system security, even if that impact only becomes
  clear after a fix is published. Therefore, Red Hat prioritizes delivering fixes
  that improve our customers' overall security posture.\n\nBecause of this proactive
  approach, a patch may be associated with a CVE assignment at a future date. Retroactive
  CVE assignments are always documented in the corresponding errata and on Red Hat's
  CVE pages. We strongly advise against delaying updates, as doing so may leave your
  system exposed when protections are already available."
- To install this SUSE Security Update use the SUSE recommended installation 
  methods like YaST online_update or "zypper patch".
