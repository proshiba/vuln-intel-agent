title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Bound rsp_info_len to avoid OOB sense-data read\n\nIn qla2x00_status_entry(),
  the FWI2 status path advances sense_data and\nshrinks par_sense_len by rsp_info_len:\n\
  \n\tif (IS_FWI2_CAPABLE(ha)) {\n\t\tsense_data += rsp_info_len;\n\t\tpar_sense_len
  -= rsp_info_len;\n\t}\n\nrsp_info_len is a 32-bit value taken directly from the
  target's FCP\nresponse (sf.rsp_data_len), while par_sense_len is the IOCB data area\n\
  size (28 bytes for 24xx, 60 bytes for 29xx). A hostile or buggy target\nreporting
  an rsp_info_len larger than par_sense_len makes the unsigned\nsubtraction underflow
  to a huge value and advances sense_data out of\nbounds.\n\nThe underflowed par_sense_len
  then defeats the cap in\nqla2x00_handle_sense():\n\n\tif (sense_len > par_sense_len)\n\
  \t\tsense_len = par_sense_len;\n\tmemcpy(cp->sense_buffer, sense_data, sense_len);\n\
  \nso the memcpy reads up to SCSI_SENSE_BUFFERSIZE bytes from the\nout-of-bounds
  sense_data pointer, leaking adjace"
