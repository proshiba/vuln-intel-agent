title: webpy web.py 0.76 is vulnerable to Insufficient Session Expiration. The 
  application's session management relies on periodic cleanup to expire sessions
  instead of checking the last-access time when a session is loaded. As a 
  result, an expired session whose record has not yet been cleaned up can still 
  be replayed and used, allowing an attacker holding a previously valid session 
  cookie to continue accessing protected resources after the configured idle 
  timeout.
