title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  cap advertised IP tunnel headroom\n\nIP tunnel devices derive their advertised needed_headroom
  from lower\noutput devices. A stack of user-created devices can make the derived\n\
  value larger than the 16-bit skb header offsets can represent. Once IP\noutput reserves
  it, skb head expansion can wrap those offsets.\n\nThe runtime transmit path already
  caps a growing needed_headroom at 512.\nApply the same cap when tunnel configuration
  publishes needed_headroom\nderived from a lower output device.\n\nCapping the advertised
  value is safe: IP tunnel transmit still expands\nthe skb when a packet needs more
  headroom. A nonsensical stacked\nconfiguration can therefore incur an extra reallocation,
  but it cannot\npublish an unbounded reservation to upper layers."
