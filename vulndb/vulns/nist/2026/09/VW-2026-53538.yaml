title: Unrestricted file upload vulnerability in the CSV file upload 
  functionality of the Ocsreports admin_info endpoint. The application validates
  files solely based on the name provided by the client, without properly 
  checking their content or securely restricting the permitted file types. This 
  allows a user with administrator privileges to upload PHP files to a directory
  accessible via the web interface. If the file is subsequently processed by the
  server, an attacker could execute arbitrary code with the privileges of the 
  account used by the web service.
