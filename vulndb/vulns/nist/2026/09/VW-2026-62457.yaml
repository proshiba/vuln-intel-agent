title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: fix P2P action frame handling without device vif\n\nSome P2P action frame
  paths assume the P2P device vif is always\navailable. That is not true when userspace
  sends non-P2P public action\nframes through the primary interface, or when action-frame
  abort runs\nafter the P2P device vif has not been created.\n\nFall back to the primary
  vif when aborting an action frame without a P2P\ndevice vif, and guard P2P device
  saved IE access before using it for\npeer channel search."
