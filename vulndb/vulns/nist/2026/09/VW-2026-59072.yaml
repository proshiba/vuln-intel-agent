title: laradashboard through 1.2.2 contains a missing authorization 
  vulnerability in the Local License API endpoints that allows any authenticated
  user to read, overwrite, and delete premium module license keys. Attackers 
  with low-privileged accounts can access GET /api/admin/licenses/show, POST 
  /api/admin/licenses/store, and POST /api/admin/licenses/remove endpoints to 
  disclose confidential license keys, inject attacker-controlled values, or 
  delete stored licenses entirely.
