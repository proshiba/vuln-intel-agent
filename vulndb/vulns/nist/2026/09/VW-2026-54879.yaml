title: A flaw was found in 389-ds-base. The Cockpit 389 Console's LDAP editor 
  constructs an ldapsearch command by embedding an LDAP entry's distinguished 
  name (DN) into a shell command string without proper escaping. An LDAP user 
  with delegated privileges to create or rename directory entries could craft a 
  malicious DN containing shell metacharacters. When a Cockpit administrator 
  subsequently views the entry in the 389 Console, the embedded shell command 
  executes with root privileges on the directory server host.
