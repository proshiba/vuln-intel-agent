title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, OAuthConfig writes a 
  plaintext fallback file containing access and refresh tokens under the user's 
  .mcp-atlassian directory using process-default permissions. On systems with a 
  permissive umask, same-group or other local users and processes can read the 
  persisted tokens and reuse the associated Atlassian access. The advisory 
  traces the vulnerable input and processing flow through 
  OAuthConfig._save_tokens, ~/.mcp-atlassian/oauth-<client_id>.json, 
  access_token, and refresh_token, which identify the affected entry points, 
  controls, and code paths. This issue is fixed in version 0.22.0.
