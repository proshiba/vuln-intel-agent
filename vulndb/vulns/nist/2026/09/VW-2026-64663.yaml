title: "OpenEye Apex Network Video Recorder (NVR) firmware 3.2.9.376 contains an OS
  command injection vulnerability in recbackup. An authenticated administrator can
  supply crafted backup-area configuration input that is passed to a shell command,
  allowing commands to execute with the privileges of the nvr user. The underlying
  design has been present since at least firmware 2.2.3.4.\n\nUpgrade to version 3.5.4."
