title: The Frontend Admin by DynamiApps plugin for WordPress is vulnerable to 
  Authentication Bypass to Account Takeover in all versions up to, and 
  including, 3.29.12. This is due to the pre_update_value function lacking any 
  capability or ownership check, and ActionPost::conditions_logic() 
  short-circuiting its current_user_can('edit_post') authorization gate whenever
  the post ID is non-numeric — such as the string user_1 — allowing 
  unauthenticated form submissions to be routed to arbitrary user records 
  without restriction. This makes it possible for unauthenticated attackers to 
  overwrite any user's registered email address, including an administrator's, 
  and then leverage WordPress's native password-reset flow to fully take over 
  the targeted account.
