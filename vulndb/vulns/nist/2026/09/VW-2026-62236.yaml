title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/renesas-rzg2l:
  Fix loss of interrupt\n\nrzg2l_clear_irq_int() and rzg2l_clear_tint_int() perform
  a\nread-modify-write on the ISCR/TSCR status registers to clear the bit\nfor the
  interrupt just handled. Since these registers are\nwrite-0-to-clear per bit, this
  is racy:\n\nIf another interrupt's status bit gets set between the read and the
  write,\nthat bit is written back as 0 by the software-constructed value, clearing\n\
  an interrupt that hasn't been serviced yet and losing it.\n\nThis can be reproduced
  by triggering multiple interrupts at once, e.g.:\n\n  gpioset -c gpiochip0 355=0
  353=0 328=0 352=0\n\nFix this by writing back only the bit being cleared, with all
  other bits\nset to 1, instead of read-modify-writing the whole register.  Since
  1-bits\nare left unchanged by hardware, concurrently-set status bits for other\n\
  interrupts are preserved."
