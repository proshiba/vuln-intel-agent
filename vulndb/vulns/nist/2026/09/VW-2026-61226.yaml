title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  zoran: Avoid freeing a registered video_device twice\n\nzoran_init_video_device()
  installs zoran_vdev_release() as the\nvideo_device release callback through zoran_template.
  After\nvideo_register_device() succeeds, video_unregister_device() drops the\nregistered
  video_device reference and the V4L2 core eventually invokes\nthat release callback,
  which kfree()s the video_device.\n\nzoran_exit_video_devices() called video_unregister_device()
  and then\nkfree(zr->video_dev), so device teardown could free the same\nvideo_device
  twice.\n\nRemove the direct kfree() and clear the cached pointer after\nunregistering.
  The pre-registration failure path keeps its manual free\nbecause the video_device
  was not registered there.\n\nThis issue was found by a static analysis checker and
  confirmed by\nmanual source review."
