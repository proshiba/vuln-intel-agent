title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: sc2731_charger: cancel work on remove\n\nThe USB notifier and initial charger
  detection can schedule info->work.\nThe remove path unregisters the notifier, but
  does not cancel queued or\nrunning work before the devm-allocated driver data is
  released.\n\nSet the platform drvdata used by remove, then cancel the work after\n\
  unregistering the notifier.\n\nThis issue was found by a static analysis tool."
