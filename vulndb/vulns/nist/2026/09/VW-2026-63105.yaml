title: The Complianz GDPR/CCPA Cookie Consent Banner plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via Comment Content via Elementor 
  Cookie Blocker Regex in all versions up to, and including, 7.5.4 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. Successful 
  exploitation requires an administrator to approve the attacker's comment, and 
  the site must have both the Elementor plugin installed and Complianz 
  configured with the Twitter or Facebook cookie/script blocker enabled.
