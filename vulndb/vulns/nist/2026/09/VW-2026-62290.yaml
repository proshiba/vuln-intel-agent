title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (coretemp) Fix core_data leak on CPUs without PTS\n\npdata->core_data is allocated
  in init_temp_data() when the first core\ntemp_data of a package is created, but
  it is only released from\ndestroy_temp_data(), and only in the branch that handles
  the package\ntemp_data.\n\nPackage temp_data is created solely when the CPU supports\n\
  X86_FEATURE_PTS. On a CPU without it, coretemp_cpu_online() never calls\ncoretemp_add_core()
  with pkg_flag set, so pdata->pkg_data stays NULL.\ncoretemp_cpu_offline() then skips
  the removal of the package interface,\ndestroy_temp_data() is never called for package
  data, and the array is\nstill allocated when coretemp_device_remove() frees the
  platform data\nthat pointed at it.\n\nRelease the array in coretemp_device_remove().
  destroy_temp_data() sets\npdata->core_data to NULL when it frees it, so the added
  kfree() is a\nno-op on CPUs that do have PTS.\n\nTested on an Intel Core i5-1135G7.
