title: SGLang versions through 0.5.20 contain an unbounded memory allocation 
  vulnerability in handle_staging_req() that fails to validate chunk_idx from 
  ZMQ STAGING_REQ frames in prefill/decode disaggregation deployments. Attackers
  with access to the decode engine's internal ZMQ rank port can send a frame 
  with an extremely large chunk_idx value, causing the scheduler to allocate 
  memory until the system runs out and terminates the process.
