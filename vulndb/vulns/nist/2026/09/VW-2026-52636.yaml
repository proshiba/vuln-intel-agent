title: A flaw was found in rpm. A local attacker could supply a specially 
  crafted `.gem` filename containing RPM macro syntax. When a user or automated 
  workflow invokes `rpmuncompress -x` on this file, the macro expansion occurs 
  during command construction. This allows the attacker to execute arbitrary 
  commands with the privileges of the invoking account, leading to a compromise 
  of confidentiality, integrity, and availability.
