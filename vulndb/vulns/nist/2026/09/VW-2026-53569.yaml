title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  xilinx: formatter_pcm: pass aud_drv_data to irq handlers\n\nThe irq handlers take
  a struct device pointer and call\ndev_get_drvdata() to obtain the driver data. \
  \ However, the driver\ndata is only set at the end of probe, after devm_request_irq(),\n\
  so an interrupt taken in between causes the handlers to pass a\nNULL pointer to
  readl() and crash.\n\nPass the private data directly as the devm_request_irq() argument\n\
  instead of the device pointer, matching what the handlers expect."
