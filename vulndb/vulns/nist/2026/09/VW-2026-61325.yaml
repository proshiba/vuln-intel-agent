title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  fix out-of-bounds write when receiving an over-long PDU\n\nnvmet_tcp_try_recv_pdu()
  reads a PDU header into the fixed 128-byte\nqueue->pdu union, then computes the
  remaining payload length as\n\n\tqueue->left = hdr->hlen - queue->offset + hdgst;\n\
  \nand reads that many more bytes into &queue->pdu + queue->offset, without\never
  bounding the result against sizeof(queue->pdu).\n\nA struct nvme_tcp_icreq_pdu is
  itself 128 bytes, exactly the size of the\nunion. Once a header digest has been
  negotiated (hdgst = 4), a second\nICReq passes the hlen == nvmet_tcp_pdu_size()
  check but yields\nqueue->left = 128 - 8 + 4 = 124, so bytes 8..132 are written into
  the\n128-byte buffer -- 4 bytes past its end, over queue->hdr_digest and\nqueue->data_digest.
  Those bytes are attacker-controlled (an ICReq\ncarries no digest), and the duplicate
  ICReq is only rejected later,\nafter the overflow. A remote unauthenticated host
  can thus corrupt\nkernel "
