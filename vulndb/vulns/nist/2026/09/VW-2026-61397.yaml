title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  sony: clean up device list on probe failure\n\nsony_input_configured() adds some
  controllers to sony_device_list before\nHID core registers their input devices.
  input_register_device() can fail\nafter the callback returns successfully. sony_probe()
  then observes that\nHID_CLAIMED_INPUT is clear and unwinds, but only stops the HID
  hardware.\nThe devres-managed sony_sc is freed while its list node remains linked,
  so\nthe next matching controller traverses freed memory.\n\nInitialize the list
  node and device ID to inactive states. Make list\nremoval idempotent and run the
  driver-private cleanup on every probe\nfailure path. This also makes a second cleanup
  safe when\nsony_input_configured() already unwound a partial initialization before\n\
  sony_probe() handles the missing input claim.\n\nFound by 0sec (https://0sec.ai)
  using automated source analysis;\nverified against the HID input registration and
  probe unwind paths."
