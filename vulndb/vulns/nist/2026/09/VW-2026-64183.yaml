title: The HUSKY – Products Filter for WooCommerce Professional plugin for 
  WordPress is vulnerable to Local File Inclusion in all versions up to, and 
  including, 1.4.4 via the 'shortcode' parameter parameter. This makes it 
  possible for unauthenticated attackers to include and execute arbitrary .php 
  files on the server, allowing the execution of any PHP code in those files. 
  This can be used to bypass access controls, obtain sensitive data, or achieve 
  code execution in cases where .php file types can be uploaded and included. 
  This vulnerability is exploitable by unauthenticated users because the only 
  access control is a nonce check against woof_front_nonce, which is publicly 
  emitted into inline JavaScript on every front-end page and is therefore 
  obtainable by any site visitor without authentication.
