title: Bludit CMS through 3.22.0 contains an authorization bypass vulnerability 
  that allows authenticated users with the Author role to enumerate and delete 
  media files belonging to pages owned by other users, including administrators,
  by supplying arbitrary uuid parameters to unprotected AJAX endpoints. 
  Attackers can retrieve page UUIDs for all users via the content-get-list 
  endpoint and then submit crafted POST requests to the list-images and 
  delete-image endpoints in bl-kernel/ajax/ to access and destroy media files 
  outside their own pages, bypassing the IMAGE_RESTRICT isolation control.
