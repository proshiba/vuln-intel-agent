title: OpenClaw (npm package 'openclaw') versions >= 2026.6.6 and < 2026.8.1 
  apply the SMS webhook invalid-request rate limit before Twilio signature 
  verification and identify clients only by the raw proxy socket address. In 
  deployments where the SMS/Twilio webhook sits behind a trusted reverse proxy 
  or tunnel so that multiple external clients share one socket address, an 
  unauthenticated remote sender can exhaust the shared pre-authentication 
  rate-limit budget with invalid requests, causing subsequent correctly signed 
  Twilio callbacks to receive HTTP 429 responses. The result is temporary 
  inbound SMS loss while the shared window remains exhausted; the attacker 
  cannot forge a callback or access message data. Fixed in 2026.8.1.
