title: Bifrost HTTP transport before 2.0.0 accepts an enabled custom plugin 
  whose path is an HTTP URL through unauthenticated POST /api/plugins when 
  management authentication is disabled (the default, 
  governance.auth_config.is_enabled=false). The shared-object loader treats an 
  http-prefixed path as a download URL, writes the body to a temporary .so, and 
  passes it to Go's plugin.Open. After a successful open, optional Init runs 
  immediately with the supplied config as the Bifrost process user. On 
  documented dynamically linked builds (DYNAMIC=1 / no static-link flags), which
  the vendor requires for custom Go plugins, plugin.Open is expected to succeed 
  and this is unauthenticated remote code execution. On the published statically
  linked Docker image, plugin.Open fails with Dynamic loading not supported, so 
  that build class is only server-side request forgery. Attack complexity is 
  High because the attacker cannot force RCE on the default static image and a 
