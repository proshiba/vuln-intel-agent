title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Unrequest devices if driver registration fails\n\nscmi_driver_register()
  requests protocol devices before registering the\ndriver. If driver_register() fails,
  those requests remain in the global\nIDR and retain pointers to the module's ID
  table. Once the failed module\nload releases that storage, later request matching
  or SCMI device creation\ncan dereference the stale pointers.\n\nUnrequest the complete
  protocol table before returning the registration\nfailure. At this point table registration
  succeeded, so every entry is\nowned by the current registration attempt."
