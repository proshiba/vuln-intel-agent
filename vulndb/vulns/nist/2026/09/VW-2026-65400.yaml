title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  bcm2835: Don't remove an unregistered GPIO chip\n\nIf the devm_pinctrl_register()
  function fails,\nbcm2835_pinctrl_probe() calls gpiochip_remove()\nbefore gpiochip_add_data()
  has registered the GPIO chip.\n\nThis means that upon failure the gpio_chip.gpiodev\n\
  \ is NULL resulting in a null pointer dereference\ninside the gpiochip_remove()
  function.\n\nRemove the unnecessary function call to gpiochip_remove().\nNo GPIO
  cleanup is required because the GPIO chip\nhas not yet been registered. Without
  this change there\nis potential for a kernel panic upon registration failure"
