title: A weakness has been identified in iFlytek astron-agent up to 1.0.7. 
  Affected is an unknown function of the file 
  console/backend/commons/src/main/resources/mapper/ChatBotMarketMapper.xml of 
  the component getBotList API endpoint. Executing a manipulation of the 
  argument sortDirection can lead to sql injection. It is possible to launch the
  attack remotely. Upgrading to version reward-1575 is able to address this 
  issue. This patch is called 6702be70ae802b1048f5fbec91e690e7b71a4165. You 
  should upgrade the affected component.
