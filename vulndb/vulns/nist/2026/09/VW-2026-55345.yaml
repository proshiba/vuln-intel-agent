title: A security vulnerability has been detected in aircheng-org iWebShop-5 up 
  to 5.15. The impacted element is the function uploadFile of the file 
  controllers/pic.php. Such manipulation of the argument outerSrc/selectPhoto 
  leads to cross site scripting. The attack may be performed from remote. The 
  exploit has been disclosed publicly and may be used. The project was informed 
  of the problem early through an issue report but has not responded yet.
