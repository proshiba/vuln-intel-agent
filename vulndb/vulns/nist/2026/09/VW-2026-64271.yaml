title: A vulnerability was found in mtrano APENCMS up to 
  6546096d354153309693efabb9a0d824628ed4f5. The affected element is the function
  eval of the file cms/weasel.php of the component Template Engine. The 
  manipulation of the argument $_CMS['site'] results in code injection. The 
  attack may be performed from remote. The exploit has been made public and 
  could be used. This product utilizes a rolling release system for continuous 
  delivery, and as such, version information for affected or updated releases is
  not disclosed. The vendor was contacted early about this disclosure but did 
  not respond in any way.
