title: nDPI 5.1.0 contains a memory access issue in the DNS dissector and 
  serializer deserialization code. Specially crafted network input can cause 
  byte-buffer addresses at odd offsets to be cast to uint16_t or wider integer 
  pointers and directly dereferenced without alignment checks. This results in 
  undefined behavior and can cause process termination in UBSan-instrumented 
  builds or on strict-alignment architectures, leading to denial of service.
