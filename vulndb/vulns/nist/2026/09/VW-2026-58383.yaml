title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhugetlb:
  only adjust reservation during unmapping if mapcount is 0\n\nSince df7a6d1f6405,
  __unmap_hugepage_range can adjust reservations.  In\nthe case of folio mapped in
  both a parent and a child, if the parent\nunmaps the range first, the reservation
  adjustment will result in an\nunderflow of the reserved count.  Once the child unmaps
  the range, the\ncount is restored.  Change __unmap_hugepage_range() to check the
  mapcount\nbefore adjusting the reservation."
