title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  always drain cache_cleaner before destroying a cache_detail\n\nsunrpc_destroy_cache_detail()
  only cancels the global cache_cleaner\ndelayed_work when cache_list is empty.  During
  per-netns teardown\ncache_list is never empty because init_net's caches remain registered,\n\
  so the cancel never fires.  After unlink, the caller proceeds to\ncache_destroy_net()
  which kfrees the cache_detail while cache_clean()\nmay still hold a dangling pointer
  to it.  The result is a\nuse-after-free: cache_dequeue() takes cd->queue_lock on
  freed memory,\nand cache_put() dereferences cd->cache_put as a function pointer
  from\nfreed slab.\n\nDrop the list_empty guard so that cancel_delayed_work_sync()
  always\nruns, ensuring any in-flight cache_clean() completes before the\ncache_detail
  is freed.  Re-arm the cleaner afterwards if other caches\nare still registered."
