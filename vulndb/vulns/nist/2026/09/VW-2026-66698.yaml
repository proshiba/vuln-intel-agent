title: Budibase server before 3.45.0 contains a cross-tenant information 
  disclosure vulnerability in the GET /api/applications/:appId/appPackage 
  endpoint that allows authenticated users to read another tenant's application 
  metadata and source code. Attackers can supply a victim tenant's app id to 
  retrieve sensitive application details including navigation structure, role 
  names, internal screen URLs, JavaScript snippets, and user identifiers without
  authorization checks.
