title: n8n is an open source workflow automation platform. Prior to 2.37.7 and 
  2.38.2, the OAuth Dynamic Client Registration endpoint bounded redirect_uris 
  but accepted arbitrarily large client_name and grant_types values. An 
  unauthenticated remote caller could repeatedly persist oversized values in 
  oauth_clients and exhaust database storage. The affected validation is in 
  packages/cli/src/modules/oauth-server/oauth-server.service.ts, including 
  MAX_CLIENT_NAME_LENGTH and MAX_GRANT_TYPES. This issue is fixed in versions 
  2.37.7 and 2.38.2.
