title: "In the Linux kernel, the following vulnerability has been resolved:\n\nidpf:
  disable DIM work before freeing q_vectors\n\nidpf never drains the Tx/Rx DIM works
  before freeing the memory they\nlive in.  tx_dim and rx_dim are embedded in struct
  idpf_q_vector, they\nare queued from the NAPI poll via net_dim(), and idpf_vport_intr_rel()\n\
  ends with kfree(rsrc->q_vectors).  Nothing in the driver cancels them.\n\nidpf_tx_dim_work()
  and idpf_rx_dim_work() then run on freed memory:\nidpf_vport_intr_write_itr() writes
  the ITR register through\nq_vector->intr_reg.tx_itr / rx_itr, void __iomem pointers
  loaded out of\nthe freed q_vector.  No configuration is needed to get there --\n\
  IDPF_ITR_IS_DYNAMIC() is defined as (itr_mode) and idpf_vport_alloc()\ninitialises
  both modes to IDPF_ITR_DYNAMIC.\n\nDraining after idpf_vport_intr_napi_dis_all()
  is not enough on its own.\nidpf_net_dim() is called from inside the\n\"if (napi_complete_done(napi,
  work_done))\" branch of the poll, and\nnapi_complete_done() has already cleared"
