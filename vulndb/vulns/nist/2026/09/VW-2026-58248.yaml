title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/dasd:
  Do not complete a failed ESE read as successful\n\ndasd_int_handler() completes
  an NRF read of an unallocated ESE track by\ncalling ese_read() and unconditionally
  marking the request\nDASD_CQR_SUCCESS. dasd_eckd_ese_read() can return an error
  before it has\nzeroed the destination buffer: a failed sense-data parse or a current\n\
  track outside the requested range both return early, leaving the\ndestination pages
  untouched. The request is still completed successfully,\nso the block layer is handed
  stale / uninitialized memory instead of\nzeros.\n\nCheck the ese_read() return value
  and fail the request through the normal\nerror path instead of forcing DASD_CQR_SUCCESS."
