title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  clamp the tail kset read to the segment data region\n\nThe tail-kset read in cache_replay(),
  the writeback worker and the GC\nworker bounds its length by PCACHE_SEG_SIZE - seg_off,
  the raw segment\nsize rather than the data region. A tail near the segment end reads
  past\nthe segment data into the following control area.\n\nClamp the read to cache_seg_remain(),
  the data region."
