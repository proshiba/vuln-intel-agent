title: A security vulnerability has been detected in moltis-org moltis up to 
  20260818.10. The affected element is the function 
  vault_unlock_handler/vault_recovery_handler of the file vault.rs. Such 
  manipulation leads to missing authentication. The attack can be launched 
  remotely. The exploit has been disclosed publicly and may be used. Upgrading 
  to version 20260819.01 is sufficient to fix this issue. The name of the patch 
  is 3b92dd64d5648f829968cf48bf67dc3113852fef. Upgrading the affected component 
  is advised.
