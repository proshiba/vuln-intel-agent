title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btintel_pcie: validate packet_len before skb_put_data\n\nbtintel_pcie_submit_rx_work()
  reads packet_len from rfh_hdr without\nchecking if it exceeds the RX buffer size.
  An oversized packet_len\ncan lead to an out-of-bounds read in skb_put_data().\n\n\
  Validate packet_len to ensure it is non-zero and does not exceed\nBTINTEL_PCIE_BUFFER_SIZE
  - sizeof(*rfh_hdr), logging an error when\ninvalid.\n\nThis issue was reported by
  Claude Mythos. It can be simulated either by\nusing customized firmware configured
  to return an invalid packet_len or\nby modifying rfh_hdr->packet_len in the driver
  before calling\nbtintel_pcie_submit_rx_work()."
