title: When a Tauri application uses the dialog plugin's file or folder picker, 
  an attacker with JavaScript execution (XSS) can force the scope expansion to 
  be recursive, granting read/write access to an entire directory tree after a 
  single user click on a normal-looking OS file dialog. The user has no 
  indication that recursive access was granted, and the expanded scope cannot be
  revoked for the lifetime of the application.
