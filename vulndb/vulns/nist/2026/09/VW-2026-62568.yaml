title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: Avoid buffer overread in ath11k_wmi_tlv_op_rx()\n\nCurrently, in ath11k_wmi_tlv_op_rx(),
  the firmware buffer is read\nwithout first verifying that the buffer has enough
  data to hold a\nheader. This could result in a buffer overread.\n\nAdd an upfront
  length check before dereferencing skb->data as a\nwmi_cmd_hdr. The check is placed
  before the trace_ath11k_wmi_event()\ncall to preserve the existing trace semantics
  (tracing the full raw\nWMI event including the header), unlike the analogous ath12k
  fix which\ncould use skb_pull_data() directly.\n\nCompile tested only."
