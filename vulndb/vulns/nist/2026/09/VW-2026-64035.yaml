title: Tautulli is a Python based monitoring and tracking tool for Plex Media 
  Server. Prior to 2.17.2, the newsletter cron field stored in the newsletters 
  table is inserted by data/interfaces/default/newsletter_config.html into a 
  JavaScript string without safe JSON encoding. An administrator or caller with 
  the Tautulli API key can store a crafted cron value, and an administrator who 
  later opens the newsletter configuration modal passively triggers script 
  execution in the Tautulli web context. The stored value persists in the 
  database and can continue to execute after credential rotation until it is 
  removed. This issue is fixed in version 2.17.2.
