title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the Git node validated the repository parameter for fetch 
  or pull, but setUpstream wrote a branch..remote value into repository 
  configuration without validating it. A later fetch or pull resolved the remote
  from that configuration instead of the checked parameter. An authenticated 
  workflow editor could therefore point Git at any local repository readable by 
  the n8n process and receive its contents through 
  packages/nodes-base/nodes/Git/GenericFunctions.ts. This issue is fixed in 
  versions 1.123.76, 2.37.7 and 2.38.2.
