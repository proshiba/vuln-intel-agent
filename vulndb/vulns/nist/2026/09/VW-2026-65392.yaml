title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  RSI: fix field-spanning write warning in attestation token init\n\nThe challenge
  is passed in registers a1 through a8. However, copying to\n&regs.a1 makes FORTIFY
  treat the destination as the single a1 field,\nresulting in a field-spanning write
  warning. [1]\n\nOverlay the SMCCC register structure with an RSI-specific argument\n\
  layout and copy the challenge into an explicit 64-byte array. This keeps\nthe existing
  a1-a8 argument encoding while giving the copy a correctly\nsized destination object.\n\
  \n[1]\nmemcpy: detected field-spanning write (size 64) of single field \"&regs.a1\"\
  \ at ./arch/arm64/include/asm/rsi_cmds.h:119 (size 8)\nWARNING: ./arch/arm64/include/asm/rsi_cmds.h:119
  at rsi_attestation_token_init+0xdc/0xf8 [arm_cca_guest], CPU#0: cat/3314"
