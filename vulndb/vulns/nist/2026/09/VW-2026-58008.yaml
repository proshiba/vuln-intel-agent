title: Headroom compresses data before the data reaches a large language model. 
  Prior to version 0.35.0, the Headroom WebSocket server does not validate the 
  `Origin` header of incoming client WebSocket requests before forwarding the 
  request to the upstream server, allowing malicious WebSocket clients to 
  perform arbitrary LLM requests without authentication. This can be exploited 
  by a malicious WebSocket client executed in a traditional or headless browser 
  such as lightpanda, if the browser has access to the Headroom proxy and the 
  OpenAI API key is stored in the `OPENAI_API_KEY` environment variable. Version
  0.35.0 fixes the issue.
