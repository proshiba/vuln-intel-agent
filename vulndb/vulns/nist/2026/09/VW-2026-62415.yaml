title: "In the Linux kernel, the following vulnerability has been resolved:\n\nARM:
  9485/1: mm: acquire mmap write lock around show_pte() for user faults\n\nWhen CONFIG_DEBUG_USER=y,
  and cmdline \"user_debug=31\" is set,\na user fault may trigger show_pte() without
  any lock.\nIf another thread in the same process concurrently calls munmap(),\n\
  the page table pages may be freed while show_pte() is still traversing\nthem, causing
  a use-after-free in show_pte().\n\nIf CONFIG_ARM_LPAE=y, this may cause a kernel
  panic if the pages table\nof PMD are freed when show_pte() is running.\n\nAcquire
  mmap_write_lock() around show_pte() for user faults to fix the\ncontention.\n\n\
  For user faults, additionally restrict that show_pte() is called only\nwhen the
  addr is a user-space address (addr < TASK_SIZE). This is because\nthe lock of tsk->mm
  only protects the virtual memory of user address space,\nfurthermore, dumping the
  page tables of a kernel-space address for user\nfaults is unnecessary and may have
  security implications.\n\nKe"
