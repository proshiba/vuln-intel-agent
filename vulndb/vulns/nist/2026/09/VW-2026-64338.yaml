title: Netdata is an open source observability tool. Prior to 2.10.4, an 
  authenticated child agent can send an oversized CHART SLOT value that 
  str2ull_encoded passes to pluginsd_rrdset_cache_put_to_slot in 
  src/plugins.d/pluginsd_internals.h. The accepted slot drives reallocz to 
  request an approximately 16 GiB chart-pointer array, and allocation failure 
  invokes fatal and aborts the parent Netdata agent, repeatedly disabling 
  centralized monitoring while stream access persists. This issue is fixed in 
  version 2.10.4 and nightly build 2.10.0-782-nightly.
