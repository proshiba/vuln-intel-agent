title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  RFCOMM: Validate MTU in rfcomm_apply_pn() to prevent infinite loop\n\nrfcomm_apply_pn()
  accepts the MTU value from a remote PN (Parameter\nNegotiation) frame without checking
  for zero. When the remote peer\nsends an MTU of zero, d->mtu is set to 0. This causes
  the sendmsg\npath to enter an infinite loop when fragmenting data, as each fragment\n\
  has size == min_t(size_t, len, 0) == 0, so the remaining length never\ndecreases.
  The infinite allocation of zero-length skbs exhausts all\nsystem memory.\n\nFix
  by clamping d->mtu to RFCOMM_DEFAULT_MTU when the negotiated\nvalue is zero, consistent
  with the initial value assigned in\nrfcomm_dlc_alloc()."
