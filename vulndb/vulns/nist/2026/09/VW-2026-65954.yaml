title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_log: unregister loggers before per-net teardown\n\nnf_log_syslog and nfnetlink_log
  unregister their per-network namespace\noperations before unregistering their global
  logger backends. This\nleaves a window where a sysctl or netlink writer can rebind
  the still-\nregistered logger after the per-net pre-exit callback cleared the old\n\
  selection.\n\nThe race looks like this:\n\n  CPU 0                             \
  \    CPU 1\n  ----                                  ----\n  unregister_pernet_subsys()\n\
  \    nf_log_unset(net, logger)\n      net->nf.nf_loggers[pf] = NULL\n\n        \
  \                                lock nf_log_mutex\n                           \
  \             find logger in loggers[][]\n                                     \
  \   net->nf.nf_loggers[pf] = logger\n                                        unlock
  nf_log_mutex\n\n  nf_log_unregister(logger)\n    lock nf_log_mutex\n    loggers[pf][type]
  = NULL\n    unlock nf_log_mutex\n  "
