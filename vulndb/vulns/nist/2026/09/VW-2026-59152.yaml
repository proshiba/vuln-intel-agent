title: A security vulnerability has been detected in GNU Binutils 2.47. Affected
  by this vulnerability is the function elf_x86_64_relocate_section of the file 
  bfd/elf64-x86-64.c of the component ld. Such manipulation of the argument roff
  leads to buffer overflow. An attack has to be approached locally. The exploit 
  has been disclosed publicly and may be used. Upgrading to version 2.48 
  addresses this issue. The name of the patch is 
  471130b39c03623ec6d78ece377ff4da3f6bfe7b. It is recommended to upgrade the 
  affected component.
