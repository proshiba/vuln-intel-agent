title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  usbtv: keep device alive while ALSA card exists\n\nThe ALSA PCM callbacks store
  the driver state in pcm->private_data. An\nopen PCM file can outlive USB disconnect
  because usbtv_audio_free() uses\nsnd_card_free_when_closed(). The disconnect path
  can then drop the V4L2\ndevice reference and free struct usbtv before ALSA releases
  the substream,\nso a later close dereferences freed memory in snd_usbtv_pcm_close().\n\
  \nTake a V4L2 device reference for the ALSA card and drop it from the card\nprivate_free
  callback. This keeps struct usbtv valid until ALSA has closed\nthe remaining files
  and freed the card."
