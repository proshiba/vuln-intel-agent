title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/features:
  Serialize multi-part Get/Set Feature transfers\n\nA Get or Set Feature payload larger
  than the mailbox payload size is\nsplit into several mailbox commands. mbox_mutex
  only serializes\nindividual mailbox commands and is dropped between iterations of
  these\nloops. Nothing serializes the multi-part transfer as a whole.\ncxl_get_feature()
  and cxl_set_feature() are reachable concurrently\nfrom fwctl (per-fd RPCs run under
  a read-held registration lock) and\nfrom the EDAC scrub/ECS/repair paths, so two
  transfers to the same\nmailbox can interleave their parts and corrupt the device's
  transfer\ncontext.\n\nAdd a per-mailbox feat_mutex and hold it across the whole
  transfer in\nboth functions. It nests outside mbox_mutex (which is taken inside\n\
  cxl_internal_send_cmd()), and is taken nowhere else, so no lock-ordering\ninversion
  is introduced."
