title: Casdoor through 4.4.0 contains an authorization bypass vulnerability in 
  the /api/mcp endpoint that allows attackers with any application's clientId 
  and clientSecret to gain unrestricted access to user administration across all
  organizations. Attackers can enumerate user records including password salts 
  and email addresses, create administrator accounts, modify existing users, and
  delete them in any organization by supplying legitimate credentials from a 
  single application.
