title: The Contact Form by Supsystic plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting via IP Address Header in all versions up to, and 
  including, 1.10.2 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  An unauthenticated attacker can first call the 'updateNonce' action — which is
  accessible without authentication due to its absence from the plugin's 
  permission list — to obtain a valid nonce, then submit a contact form with a 
  malicious payload in a spoofed IP header such as X-Forwarded-For.
