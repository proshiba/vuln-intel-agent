  limit on chunked request.\n\nThis issue affects OTP from OTP 17.0 before OTP 27.3.4.17,
  from OTP 28.0 before OTP 28.5.0.6, and from OTP 29.0 before OTP 29.0.6, corresponding
  to inets from 5.10 before 9.3.2.7, from 9.4 before 9.6.2.3, and from 9.7 before
  9.7.2. Whether OTP before OTP 17.0, corresponding to inets before 5.10, is affected
  is unknown."
