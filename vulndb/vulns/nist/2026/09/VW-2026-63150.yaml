title: rustls-webpki (rustls/webpki) versions 0.101.0 through 0.103.11 and 
  0.104.0-alpha releases before 0.104.0-alpha.6 ignore X.509 name constraints 
  that apply to URI names, causing such constraints to be accepted rather than 
  enforced. Because name constraints are restrictions on otherwise properly 
  issued certificates, the flaw is only reachable after successful signature 
  verification and requires a misissued certificate to exploit; the library also
  provides no API for asserting URI names, and URI name constraints are 
  otherwise unimplemented. Versions 0.103.12 and 0.104.0-alpha.6 reject URI name
  constraints unconditionally.
