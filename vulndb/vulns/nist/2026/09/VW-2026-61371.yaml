title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxhci:
  fix lost bounce buffers on TDs spanning several ring segments\n\nWhen a TD reaches
  a link TRB with data that is not aligned to the\nendpoint's wMaxPacketSize, xhci_align_td()
  stages the unalignable tail\nthrough the bounce buffer of the ring segment holding
  that link TRB.\nxhci_unmap_td_bounce_buffer() later unmaps it and, for IN transfers,\n\
  copies the data back into the URB's buffer.\n\nThe enqueue path records the segment
  that was bounced in td->bounce_seg,\nunder the assumption that a TD never spans
  more than two ring segments.\nThat assumption does not hold: a TD large enough to
  span three or more\nsegments crosses several link TRBs and can be bounced at each
  of them.\nOnly the last one survives in td->bounce_seg, so every earlier bounce\n\
  buffer is neither copied back nor DMA unmapped.\n\nThe URB still completes with
  actual_length equal to the requested length\nand no error, so the transfer looks
  successful while a wMaxPack"
