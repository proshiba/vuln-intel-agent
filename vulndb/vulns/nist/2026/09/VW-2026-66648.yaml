title: SiYuan versions before v3.8.4 contain a path traversal vulnerability in 
  the setNotebookIcon endpoint that allows authenticated administrators to 
  create arbitrary directory trees and write files outside the workspace 
  boundary. Attackers can supply directory traversal sequences in the notebook 
  parameter to escape the workspace data directory and write conf.json files to 
  arbitrary locations accessible by the kernel process.
