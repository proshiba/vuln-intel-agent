title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  sunplus: fix error handling in sp_uphy_init()\n\nFix the error paths of sp_uphy_init()
  to undo exactly what each stage\ndid: return directly if clk_prepare_enable() fails,
  release only the clock\nif reset_control_deassert() fails, and jump to err_reset
  if\nupdate_disc_vol() fails so the clock and reset are not leaked."
