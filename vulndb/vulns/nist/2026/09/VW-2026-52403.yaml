title: 'A vulnerability was determined in QVidium Opera11 3.3.2a26-Ax4x-opera11. This
  affects an unknown part of the file /cgi-bin/net_tr.cgi of the component CGI Script.
  This manipulation of the argument ipaddr causes command injection. The attack may
  be initiated remotely. The exploit has been publicly disclosed and may be utilized.
  The vendor explains: "QVidium has now closed its doors and no longer will be able
  to sell products or provide support." This vulnerability only affects products that
  are no longer supported by the maintainer.'
