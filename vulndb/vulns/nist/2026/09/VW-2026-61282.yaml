title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Fix length check __import_wp_info()\n\nstruct kvm_hw_breakpoint::len is a
  __u64 that is fully controlled by user\nspace. This is then assigned to wp_info->len,
  which is an int. The bounds\ncheck is done on the truncated value while the allocation
  uses the\nuntruncated one:\n\n\twp_info->len = bp_data->len;\n\t[...]\n\tif (wp_info->len
  < 0 || wp_info->len > MAX_WP_SIZE)\n\t\treturn -EINVAL;\n\n\twp_info->old_data =
  kmalloc(bp_data->len, GFP_KERNEL_ACCOUNT);\n\nUse the validated value for the allocation
  as intended. Without this\nfix userspace can trigger >4GB allocations which will
  fail and result\nin a WARN due to MAX_PAGE_ORDER."
