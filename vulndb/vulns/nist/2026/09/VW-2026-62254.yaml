title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_net:
  Fix resize of the RX ring\n\nWhen a AF_XDP socket is attached, the virtnet_rx_resize\n\
  should resize the rq->xsk_buffs XSK buffer array. Otherwise,\nwhen the size grows,
  the virtnet_rx_resume() causes a write\npast the end of the array. This is easily
  reproducable with\n\n    ethtool -G ens3 rx 32\n    ./xdpsock -i eth0 -q 0 -r -z
  &\n    ethtool -G eth0 rx 256"
