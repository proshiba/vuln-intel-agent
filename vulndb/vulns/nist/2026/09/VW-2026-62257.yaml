title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhinic3:
  Fix skb linearization mismatch and drop skb when skb_checksum_help() failed\n\n\
  Previously, hinic3_send_one_skb() cached the skb fragment count before\ncalling
  hinic3_tx_offload(). If hinic3_tx_csum() falls back to\nskb_checksum_help() for
  unsupported tunnel packets, the skb may be\nlinearized. Continuing to build the
  TX descriptor with the stale\nfragment count leads to a descriptor mismatch, which
  can trigger\nout-of-bounds DMA reads or IOMMU faults.\n\nFurthermore, the old code
  ignored the return value of skb_checksum_help(),\ntransmitting corrupted packets
  with incomplete checksums upon failure.\n\nFix this by:\n1. Moving the hinic3_tx_offload()
  call before calculating 'num_sge' to\n   ensure the correct fragment count is used
  if the SKB is linearized.\n2. Propagating skb_checksum_help() errors and returning\n\
  \   HINIC3_TX_OFFLOAD_INVALID to properly drop the skb."
