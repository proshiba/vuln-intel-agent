title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-ctrls: validate HEVC EXT SPS RPS counts\n\nThe HEVC SPS control carries the
  short-term and long-term RPS counts\nthat decoder drivers use to walk the matching
  EXT SPS dynamic arrays.\nReject SPS values that exceed the HEVC limits of 64 short-term
  sets and\n32 long-term references so drivers cannot later index beyond those\ncontrols.\n\
  \nAlso reject EXT SPS ST RPS entries whose negative or positive picture\ncounts
  exceed the 16-entry arrays, or whose combined delta-POC count\nexceeds the HEVC
  DPB maximum."
