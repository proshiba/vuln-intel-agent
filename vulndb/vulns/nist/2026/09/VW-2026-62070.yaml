title: vm2 versions from 3.9.6 before 3.11.7 fail to properly restrict access to
  accessor properties on frozen objects, allowing sandboxed scripts to bypass 
  vm.freeze() and vm.readonly() protections. Attackers can use 
  Object.getOwnPropertyDescriptor() or __lookupSetter__() to extract and invoke 
  host object setters directly, mutating properties the embedder explicitly 
  marked read-only.
