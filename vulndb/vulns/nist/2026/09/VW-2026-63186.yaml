title: hickory-resolver versions before 0.26.2 fail to propagate bogus DNSSEC 
  proof states through the Resolver::lookup() and Resolver::lookup_ip() APIs, 
  allowing invalid records to be returned as successful results. Attackers 
  controlling the answering zone or positioned on the network path can have 
  forged DNS records accepted as validated, bypassing DNSSEC authentication 
  checks.
