title: A vulnerability was found in mathurvishal CloudClassroom-PHP-Project up 
  to 5dadec098bfbbf3300d60c3494db3fb95b66e7be. Affected is an unknown function 
  of the file loginlinkstudent.php. Performing a manipulation of the argument 
  umail results in missing authentication. Remote exploitation of the attack is 
  possible. The exploit has been made public and could be used. This product 
  follows a rolling release approach for continuous delivery, so version details
  for affected or updated releases are not provided. The vendor was contacted 
  early about this disclosure but did not respond in any way.
