title: The Create plugin for WordPress is vulnerable to generic SQL Injection 
  via the 'order_by' parameter in all versions up to, and including, 2.5.3 due 
  to insufficient escaping on the user supplied parameter and lack of sufficient
  preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with author-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. The REST endpoint permission 
  callback defaults to the publish_posts capability, meaning any Author-level 
  user or above can reach the vulnerable code path without any additional 
  preconditions.
