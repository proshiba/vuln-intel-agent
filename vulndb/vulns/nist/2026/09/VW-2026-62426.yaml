title: "In the Linux kernel, the following vulnerability has been resolved:\n\nremoteproc:
  fix OOB read via signed offset in rsc_table_for_each_entry()\n\ntable->offset[i]
  is a u32 from firmware, but was stored into a signed\nint.  A crafted offset like
  0xFFFFFFF0 becomes -16, placing hdr 16 bytes\nbefore the table buffer.  The subsequent
  avail check was bypassed\nbecause the negative int was promoted to a large size_t
  in the\nexpression \"table_sz - offset - sizeof(*hdr)\", yielding a large positive\n\
  avail and letting the out-of-bounds hdr->type read proceed undetected.\n\nStore
  the offset as u32 and validate it with unsigned comparisons before\nany pointer
  arithmetic."
