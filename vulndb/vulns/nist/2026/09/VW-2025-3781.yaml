title: A weakness has been identified in Portabilis i-Educar 2.10. This affects 
  an unknown function of the file /intranet/public_distrito_cad.php. This 
  manipulation of the argument nome causes cross site scripting. The attack is 
  possible to be carried out remotely. The exploit has been made available to 
  the public and could be used for attacks. Upgrading to version 2.12 mitigates 
  this issue. It is recommended to upgrade the affected component. The vendor 
  explains, that "[t]he reported attack vector was tested against the corrected 
  version, and the previously described XSS behavior could no longer be 
  reproduced".
