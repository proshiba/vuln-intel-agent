title: "In the Linux kernel, the following vulnerability has been resolved:\n\naf_unix:
  Update last skb marker in manage_oob().\n\nFahad Alharbi reported that blocking
  recv(MSG_PEEK) could hog CPU\ndue to OOB skb.\n\nIn the following cases, manage_oob()
  skips OOB skb(s) and returns\nNULL for the last recv(MSG_PEEK):\n\n  socketpair(AF_UNIX,
  SOCK_STREAM, 0, sk);\n\n  1) skb -> OOB skb -> NULL\n     send(sk[0], \"ab\", 2,
  MSG_OOB);\n     recv(sk[1], buf, 0, MSG_PEEK);\n\n  2) skb -> consumed OOB skb ->
  NULL\n     send(sk[0], \"ab\", 2, MSG_OOB);\n     recv(sk[1], buf, 1, MSG_OOB);\n\
  \     recv(sk[1], buf, 0, MSG_PEEK);\n\n  3) consumed OOB skb -> OOB skb -> NULL\n\
  \     send(sk[0], \"a\", 1, MSG_OOB);\n     recv(sk[1], buf, 0, MSG_OOB);\n    \
  \ send(sk[0], \"b\", 1, MSG_OOB);\n     recv(sk[1], buf, 1, MSG_PEEK);\n\nThen,
  @copied is 0 in unix_stream_read_generic() (zero-length buffer,\nor non-OOB skb
  is not yet consumed), and unix_stream_data_wait() is\ncalled.\n\nHowever, it returns
  immediately because @last is not updated in\nunix_stream_r"
