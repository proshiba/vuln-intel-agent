title: WWBN AVideo through commit e01e41ecc (no patched version available) 
  contains a broken access control flaw in objects/userVerifyEmail.php. The 
  script disables the login requirement ($global['ignoreUserMustBeLoggedIn'] = 
  1), takes users_id directly from the query string, and calls 
  User::sendVerificationLink() with no session requirement, no CSRF/global 
  token, no relationship check between caller and target, and no 
  enforceRateLimit() call. The only intended throttle is keyed to the caller's 
  own session, so cookie-less requests are never limited. An unauthenticated 
  remote attacker can therefore cause an arbitrary number of verification emails
  to be sent to any account ID, and can enumerate accounts and their 
  verification status from the three distinct JSON responses ("Verification 
  Sent", "Already verified", "Unknown error"). In addition, 
  createVerificationCode() invokes $user->setRecoverPass() and saves the user, 
  so each anonymous request writes a live password-recovery token onto the targ
