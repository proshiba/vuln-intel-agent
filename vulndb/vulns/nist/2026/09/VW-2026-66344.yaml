title: "RabbitMQ is a messaging and streaming broker. From 3.13.0 until 3.13.19, 4.0.24,
  4.1.15, 4.2.10, and 4.3.5, RabbitMQ OAuth credential refresh retains revoked runtime
  tags. when an existing AMQP connection refreshes from an OAuth token that grants
  the impersonator tag to a valid same-username token that no longer grants that tag,
  RabbitMQ updates the OAuth backend implementation (token/scopes/expiry) but leaves
  the connection's runtime #user.tags unchanged. rabbitaccesscontrol:checkuserid/2
  then still honors the stale impersonator tag, so the connection (including newly
  opened channels) can continue publishing messages with a foreign AMQP userid after
  that privilege should have been revoked. A fresh connection using the downgraded
