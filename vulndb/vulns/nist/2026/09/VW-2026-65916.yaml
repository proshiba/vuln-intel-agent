title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Bound SW TPA IDs to prevent crashes\n\nFW supports up to 1024 concurrent TPAs, so
  the FW TPA ID is in the range\n0..1023 (see commit ec4d8e7cf024 (\"bnxt_en: Add
  TPA ID mapping logic for\n57500 chips.\")). bnxt_alloc_agg_idx is intended to wrap
  the FW ID down to a\nsoftware ID which is used to index rxr->rx_tpa, and to generate
  a mapping\nbetween FW IDs and the wrapped software ID.\n\nOn a 57608 with firmware
  version 233, the firmware advertises 32\nconcurrent TPAs. As of the commit under
  fixes, bp->max_tpa on this NIC\nis set to 32.\n\nIf the software ID from bnxt_alloc_agg_idx
  is above 31, this results in\nan invalid address being loaded on this line:\n\n\
  \  tpa_info = &rxr->rx_tpa[agg_id];\n\nbecause rx_tpa is allocated with only bp->max_tpa
  (32) entries. Writes\nto tpa_info later in the code are out of bounds.\n\nThis bug
  results in a crash at boot:\n\nOops: general protection fault, kernel NULL pointer
  dereference 0x8: 0000 [#1] "
