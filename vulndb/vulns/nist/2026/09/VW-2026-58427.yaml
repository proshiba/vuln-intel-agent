title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix UAF and buffer leak in cifs_check_trans2() for malformed secondary T2\n\
  \nWhen a valid primary TRANSACT2 response has been received (mid->resp_buf\nset,
  mid->multiRsp true) and a subsequent secondary response causes\ncifs_check_trans2()
  to return false -- either because the SMB header is\ninvalid (malformed != 0) or
  because check2ndT2() rejects the PDU --\nhandle_mid() overwrites mid->resp_buf with
  the new buffer (leaking the\nprimary buffer) and, because mid->multiRsp is set,
  skips the\nserver->smallbuf/bigbuf NULL-out.  When the user thread frees\nmid->resp_buf,
  server->smallbuf or server->bigbuf is left dangling; the\ndemux thread reuses it
  for the next packet, resulting in a use-after-free.\n\nCombine both early-exit conditions
  and, when mid->multiRsp is already\nset, abort the pending transaction inline: set
  multiEnd, call\ndequeue_mid() with malformed=true, and return true so handle_mid()
  exits\nwithout touchin"
