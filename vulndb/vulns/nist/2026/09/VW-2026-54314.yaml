title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  isotp: fix timer drain order, wakeup handling and tx_gen ordering\n\nThis patch
  is a follow-up to commit cf070fe33bfb (\"can: isotp: serialize\nTX state transitions
  under so->rx_lock\") which addresses following\nsashiko-bot findings:\n\n- isotp_sendmsg():
  drain so->txfrtimer first so a stale callback can't\n  re-arm echotimer after the
  claim\n\n- isotp_release(): wake so->wait after forcing ISOTP_SHUTDOWN so a\n  sleeping
  sendmsg() claim isn't stranded\n\n- isotp_sendmsg(): have both wait_event_interruptible()
  calls in\n  isotp_sendmsg() also wake on ISOTP_SHUTDOWN and do not return claim
  to\n  IDLE to avoid corrupting a concurrent isotp_release() process.\n\n- isotp_sendmsg():
  handle potential claim of a new transfer when\n  the wait_event_interruptible()
  call returns in CAN_ISOTP_WAIT_TX_DONE\n  mode. Don't touch timers and states of
  the new transfer if a new thread\n  incremented so->tx_gen before getting the lock
  at err_event_dr"
