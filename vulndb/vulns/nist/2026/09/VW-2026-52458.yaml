title: A security vulnerability has been detected in invoiceninja Invoice Ninja 
  up to 5.13.26. This vulnerability affects the function Purify::isHostSafe of 
  the file app/Services/Pdf/Purify.php of the component invoices Endpoint. The 
  manipulation of the argument notes leads to server-side request forgery. It is
  possible to initiate the attack remotely. The exploit has been disclosed 
  publicly and may be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
