title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: don't queue packet path object notifications\n\nAll file:line references
  below are against v7.2-rc4 (ac5b0e5651b1). The\ntrace was captured on 7.2.0-rc6-kasan72rc6
  (075b74841bd0), where the same\nlines apply.\n\nnft_obj_notify() is exported and
  reached from the packet path. Its only\nin-tree caller is nft_quota_obj_eval() (net/netfilter/nft_quota.c:68),\n\
  which notifies with GFP_ATOMIC while evaluating a rule for a transiting\npacket,
  holding no mutex.\n\nSince commit 67cc570edaa0 (\"netfilter: nf_tables: coalesce
  multiple\nnotifications into one skbuff\") that notification is no longer sent\n\
