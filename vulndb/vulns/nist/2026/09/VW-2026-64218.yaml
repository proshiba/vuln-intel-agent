title: A vulnerability has been found in dgtlmoon changedetection.io up to 
  0.60.7. The impacted element is the function check_authentication of the file 
  changedetectionio/flask_app.py of the component Authentication Hook. Such 
  manipulation leads to improper authentication. The attack may be performed 
  from remote. The exploit has been disclosed to the public and may be used. The
  vendor was contacted early about this disclosure but did not respond in any 
  way.
