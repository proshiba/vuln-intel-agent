title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvdimm:
  pmem: keep PREFLUSH before data writes\n\npmem_submit_bio() records a REQ_PREFLUSH
  error, but continues to copy the\nbio data and can later overwrite the error with
  a successful REQ_FUA flush.\nThat lets data writes run after a failed preflush and
  can complete the bio\nsuccessfully despite the failed ordering barrier.\n\nRun the
  REQ_PREFLUSH flush synchronously before touching the bio data and\ncomplete the
  bio with the flush error if it fails. Keep asynchronous flush\nchaining for REQ_FUA.
  At that point, data copy has completed and the parent\nbio can wait for the chained
  flush bio."
