title: A flaw was found in libsoup. A malicious HTTP/2 server or a 
  Man-in-the-Middle (MITM) attacker can exploit a heap use-after-free 
  vulnerability in the HTTP/2 client implementation. This occurs when a GNOME 
  application uploads a file using HTTP/2, and the server sends a GOAWAY frame 
  while the file body is being read asynchronously. This can lead to memory 
  corruption, potentially resulting in information disclosure or arbitrary code 
  execution.
