title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix kmap_local leak in write_mft_record_nolock() error paths\n\nwrite_mft_record_nolock()
  maps the MFT record folio with\nkmap_local_folio(), but the pre_write_mst_fixup()
  and\nbio_add_folio() failure paths jump to the error label without\nunmapping it.
  kmap_local mappings are stack-ordered per task, so\nleaking one corrupts the nesting
  for any outer mapping.\n\nUnmap the folio on those error paths too."
