title: "If a BIND resolver sends a query for a DNSSEC-signed authoritative zone, and
  the authoritative server replies with a valid wildcard answer and signed NSEC3 proof,
  followed by an unsigned NSEC at the same owner name, it will trigger an unexpected
  program exit.\nThis issue affects BIND 9 versions 9.11.0 through 9.18.50, 9.20.0
  through 9.20.27, 9.21.0 through 9.21.25, 9.11.3-S1 through 9.18.50-S1, and 9.20.9-S1
  through 9.20.27-S1."
