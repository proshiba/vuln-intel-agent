title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  add fh_want_write() for early-verified SETATTR in nfsd_proc_setattr()\n\nThe BOTH_TIME_SET
  branch calls fh_verify() early so setattr_prepare()\ncan inspect the dentry. This
  causes nfsd_setattr() to skip\nfh_want_write(), so notify_change() runs without
  a mount write\nreference.\n\nAdd the missing fh_want_write() call after the early
  fh_verify()."
