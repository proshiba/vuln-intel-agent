title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf:
  RISC-V: store available counter mask as bitmap\n\nThe available-counter mask was
  a single unsigned long, but iteration\nuses RISCV_MAX_COUNTERS, which is 64. On
  RV32 that reads past the object.\nFilling with an unsigned-long bit at index 32
  and above is also wrong.\n\nUse DECLARE_BITMAP and set_bit/bitmap helpers. Walk
  each bitmap word\ninto CFG_MATCH when checking events, when allocating an index,
  and when\nstopping all counters. Set the counter base to i times BITS_PER_LONG.\n\
  Share the CFG_MATCH ecall through a small helper so the 32-bit argument\nsplit is
  not duplicated. On qemu-system-riscv32 the probe bitmap has bits\nabove XLEN set,
  so the first word alone is not enough.\n\n[pjw@kernel.org: updated to apply; fixed
  checkpatch.pl issues]"
