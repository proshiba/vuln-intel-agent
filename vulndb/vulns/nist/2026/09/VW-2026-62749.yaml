title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  roccat: bound device-supplied profile index\n\nkone_keep_values_up_to_date() and
  kone_profile_activated() use an\n8-bit, device-supplied profile value as an index
  into the 5-element\nkone->profiles[] array without a range check. A malicious USB
  device\nclaiming the Roccat Kone id can send a switch-profile event (or a\nstartup_profile
  read at probe) with an out-of-range value and make the\ndriver read out of bounds;
  the result is exposed via the actual_dpi\nsysfs attribute.\n\nReject out-of-range
  indices in both paths.\n\nThis was found with static analysis and confirmed with
  the KUnit test\nadded in the following patch (KASAN: slab-out-of-bounds)."
