title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  size fh_verify server sockaddr slot by xpt_locallen\n\nThe nfsd_fh_verify and nfsd_fh_verify_err
  tracepoints declare the\nserver sockaddr slot sized by xpt_remotelen but fill it
  from\nxpt_local using xpt_locallen:\n\n    TP_STRUCT__entry(\n            ...\n\
  \            __sockaddr(server, rqstp->rq_xprt->xpt_remotelen)\n            ...\n\
  \    )\n    TP_fast_assign(\n            ...\n            __assign_sockaddr(server,
  &rqstp->rq_xprt->xpt_local,\n                              rqstp->rq_xprt->xpt_locallen);\n\
  \            ...\n    )\n\nWhen xpt_locallen exceeds xpt_remotelen, __assign_sockaddr's
  memcpy\nwrites past the reserved ring-buffer slot. In the reverse direction\n(xpt_locallen
  < xpt_remotelen) the slot is oversized and the\nunwritten tail leaks prior ring-buffer
  contents to trace consumers.\n\nThe write-past-end case is reachable on NFS/UDP.
  svc_xprt_set_remote()\nis only called from svc_tcp_accept() (net/sunrpc/svcsock.c)
  and from\n"
