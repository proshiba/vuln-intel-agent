title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigmp:
  convert struct ip_sf_list to RCU\n\nCommit 23d2b94043ca (\"igmp: Add ip_mc_list
  lock in ip_check_mc_rcu\")\nadded spin_lock_bh(&im->lock) to ip_check_mc_rcu() to
  prevent a\nuse-after-free while iterating im->sources during concurrent deletions.\n\
  \nHowever, ip_check_mc_rcu() is called from RCU read-side critical\nsections in
  packet receive and route lookup fast paths (e.g.\n__mkroute_output(), ip_route_input_rcu(),
  and __udp4_lib_rcv()).\n\nWhen igmpv3_send_cr() or igmpv3_send_report() holds &pmc->lock
  and\ncalls add_grec() -> igmpv3_newpack() -> ip_route_output_ports(),\nan XFRM policy
  matching a multicast destination triggers\nxfrm_tmpl_resolve_one() -> xfrm4_get_saddr()
  -> __mkroute_output() ->\nip_check_mc_rcu(). This attempts to acquire &im->lock
  while &pmc->lock\nis already held on the same CPU, triggering a lockdep recursive
  locking\nwarning / deadlock.\n\nFix this by converting IPv4 struct ip_sf_list to
  RCU, mirroring the\nIP"
