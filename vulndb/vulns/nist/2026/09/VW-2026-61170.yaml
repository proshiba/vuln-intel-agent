title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  clamp the isolation index for rings outside a partition\n\nadev->isolation[] has
  one slot per partition, but a ring that is not\nassigned to one keeps AMDGPU_XCP_NO_PARTITION,
  which is ~0, so indexing\nthe array with it is out of bounds. SDMA submissions hit
  this on both\nthe isolation enforcement and the VM flush path and trip UBSAN.\n\n\
  Fall back to the first slot the way the cleaner shader path already\ndoes, and stop
  taking the address before the ring type check that makes\nit relevant."
