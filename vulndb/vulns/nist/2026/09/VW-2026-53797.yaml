title: UnoPim before 2.1.3 fails to include integration store, update, and 
  key-generation routes in its ACL map, allowing any admin user to bypass 
  permission checks. Attackers with minimal admin privileges can create OAuth 
  API integrations, mint client credentials, and escalate permissions by 
  exploiting missing authorization validation in the Bouncer middleware.
