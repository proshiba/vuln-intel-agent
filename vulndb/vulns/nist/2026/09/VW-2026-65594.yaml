title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  mediatek: paris: bypass pinctrl GPIO layer in set GPIO direction\n\npinctrl_gpio_direction_input()
  / pinctrl_gpio_direction_output() take\nthe pinctrl mutex. This causes a gpiochip
  operations to need to sleep.\nWorse yet, the .can_sleep field in the gpiochip is
  not set. This causes\nthe shared GPIO proxy to trip over, as it uses gpiod_cansleep()
  to check\nwhether it can use a spinlock or needs a mutex. In this case, it ends\n\
  up taking a spinlock, then calls pinctrl_gpio_direction_output(), which\ntakes a
  mutex. This causes a huge warning.\n\nWhile this class of Mediatek hardware does
  not have separate clear/set\nregisters, the pinctrl context has a spinlock that
  is taken whenever\na register read-modify-write is done. Also, once the GPIO function
  is\nselected / muxed in, further GPIO operations do not involve pinctrl\noperations
  or state. The GPIO direction and level values do not require\ntoggling the pinmux
