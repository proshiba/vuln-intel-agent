title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  Fix use-after-free in siw_accept()\n\nsiw_accept() looks up the QP supplied by userspace.
  If that QP is\nalready in RTS, the function jumps to error cleanup before associating\n\
  the incoming CEP with it.\n\nThe cleanup tests whether qp->cep is non-NULL and assumes
  the current\ncall installed the association. However, qp->cep can point to the CEP\n\
  of an existing connection. The cleanup then drops a reference from the\nincoming
  cep, not qp->cep. Once the incoming endpoint loses its\nremaining references, this
  can free it before the subsequent cep->qp\nstore, causing a use-after-free. It also
  clears the existing QP\nassociation.\n\nOnly release the association reference when
  qp->cep is the incoming\nCEP. This preserves an existing association and avoids
  accessing the\nfreed endpoint."
