title: "net_ipv6_send_ns() in subsys/net/ip/ipv6_nbr.c allocates a transmit net_pkt
  for a Neighbor Solicitation. When it is called with a data packet pending on an
  unresolved neighbor and that neighbor's pending_queue is already non-empty (an NS
  is already outstanding), the function appends the data packet and returns early
  without ever sending the NS via net_send_data() or releasing it with net_pkt_unref().
  The freshly allocated NS net_pkt and its attached TX buffers are held only by a
  local variable and are leaked permanently, never returning to CONFIG_NET_PKT_TX_COUNT
  / CONFIG_NET_BUF_TX_COUNT.\n\nThe leaking branch sits on the normal IPv6 transmit
  path: net_ipv6_prepare_for_send() (called from net_if.c) invokes net_ipv6_send_ns()
  for any outbound or forwarded IPv6 packet whose next hop is not yet in the neighbor
  cache. An on-link (adjacent) attacker can drive it deterministically by sending
  a burst of request packets (for example ICMPv6 echo requests or UDP datagrams) that
  all spoof a single"
