title: OpenClaw (npm package `openclaw`) before 2026.7.1 fails to restrict 
  owner-only infrastructure tools exposed through the chat.send endpoint. In 
  Gateway deployments using authentication modes that honor caller identity and 
  narrower operator scopes, a write-scoped non-owner caller can start a chat 
  turn whose tool inventory includes the `gateway` and `cron` tools, causing the
  agent to invoke owner-only configuration or scheduling operations, including 
  persistent state changes. Practical impact depends on the tools selected by 
  the model and the caller's ability to steer the turn. Shared-secret token and 
  password callers are treated as fully trusted operators under OpenClaw's 
  security model and are outside the scope of this issue. The issue is fixed in 
  2026.7.1; as a workaround, restrict chat.send to administrators in 
  identity-bearing deployments and remove `gateway` and `cron` from affected 
  agent tool policies.
