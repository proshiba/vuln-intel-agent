title: The Bread plugin for WordPress is vulnerable to information exposure in 
  versions up to and including 2.9.12. This is due to the lack of authentication
  and authorization checks on the settings export functionality 
  (download_settings function) which is registered on the plugins_loaded hook 
  and explicitly allows execution on non-admin (public) pages. The function 
  exports all plugin configuration settings including the protection_password 
  field, which is stored in plaintext. This makes it possible for 
  unauthenticated attackers to retrieve the PDF protection password by accessing
  the /?export-meeting-list=1 endpoint.
