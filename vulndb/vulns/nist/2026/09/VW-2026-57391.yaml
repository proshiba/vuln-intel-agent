title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.5.0 until 0.11.1, the message-chain reconstruction helper 
  in backend/open_webui/utils/misc.py advanced through a chat history by map key
  but tracked visited entries using each message body's optional id field. An 
  authenticated user could store id-less messages in a parent cycle and trigger 
  a non-terminating walk that blocked the async event loop, grew memory until 
  termination, and remained persistent across process restarts. This issue is 
  fixed in version 0.11.1.
