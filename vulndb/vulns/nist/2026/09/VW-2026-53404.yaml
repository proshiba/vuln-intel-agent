title: "A vulnerability exists in NGINX JavaScript where a malformed HTTP response
  received by ngx.fetch() can crash an NGINX worker when trusted JavaScript reads
  Response.statusText. Exploitation requires control or influence over the fetched
  HTTP response.\n\nImpact:\nThis vulnerability may allow remote attackers to cause
  a denial-of-service (DoS) on the NGINX system. There is no control plane exposure;
  this is a data plane issue only.\n\n\n\n\nNote: Software versions which have reached
  End of Technical Support (EoTS) are not evaluated."
