  reject oversized tx_queue_len at netlink parse time\n\nrtnl_create_link() assigns
  IFLA_TXQLEN directly to dev->tx_queue_len\nwithout going through netif_change_tx_queue_len(),
  so a device created\nwith \"ip link add ... txqueuelen 500000\" bypasses the S16_MAX
  cap and\nstill triggers the oversized ring allocations in pfifo_fast, tun and\n\
  tap. The veth peer nest (rtnl_nla_parse_ifinfomsg()) and the\nRTM_NEWLINK-on-existing-device
  path reach the same sinks.\n\nEnforce the cap in ifla_policy instead: IFLA_TXQLEN
