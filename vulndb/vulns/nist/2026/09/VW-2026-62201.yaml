title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btnxpuart: Validate the FW dump header length\n\nnxp_process_fw_dump() pulls the
  ACL header off the frame and then reads\nseq_num and buf_len from a struct nxp_fw_dump_hdr
  placed at skb->data,\nwithout checking that the ACL payload is long enough to contain
  it.\n\nh4_recv_buf() collects HCI_ACL_HDR_SIZE bytes of header followed by the\n\
  number of payload bytes named in that header, so skb->len is 4 + dlen\nwith dlen
  supplied by the controller and possibly smaller than the 8\nbyte dump header, or
  zero. A short frame with connection handle 0xfff\ntherefore reads both fields from
  beyond the received data.\n\nBeyond the read itself, buf_len is what terminates
  a dump: a value of\nzero makes the driver call hci_devcd_complete() and reset the\n\
  controller, so a truncated frame can end a dump early.\n\nUse skb_pull_data() to
  validate and pull the FW dump header before\naccessing its fields. Warn and reject
  the chunk if the header is\n"
