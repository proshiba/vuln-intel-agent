title: "When using the Direct XIP\nupdate strategy, the main application image starts
  other cores (i.e. radio\ncore), based on the currently active slot without additional
  verification. The\nMCUboot in the bare (upstream) configuration assumes that if
  there is at least\na single slot for each image available, the system is bootable
  and continues\nthe boot process. This may lead to a situation when MCUboot picks
  different\nslot for different images (i.e. (a) for the main application and (b)
  for the\nradio image), boots the main application (from slot (a)) that afterwards
  starts\nthe radio image by providing an address of the unauthenticated slot ((a)\n\
  instead of (b))."
