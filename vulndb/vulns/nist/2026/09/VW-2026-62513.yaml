title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd:
  remove REQ_NOWAIT support from raid1/10/456\n\nREQ_NOWAIT support in md personalities
  that can block internally is\nfundamentally incomplete. While reads can avoid some
  blocking paths,\nwrite requests can still encounter cases where one mirror succeeds
  while\nanother returns -EAGAIN. At that point md cannot distinguish queue\npressure
  from a real device failure, so it can neither record a bad\nblock nor safely retry
  the write without REQ_NOWAIT, leaving mirrors\nwith divergent data.\n\nRather than
  continue advertising REQ_NOWAIT support for personalities\nthat cannot implement
  it correctly, remove it from raid1, raid10 and\nraid456. Keep REQ_NOWAIT for linear
  and raid0, which only remap bios to\ntheir underlying devices; stacked limits will
  still clear the feature if\nany component device lacks REQ_NOWAIT support."
