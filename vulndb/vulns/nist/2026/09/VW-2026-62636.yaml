title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndax:
  read holder_ops once in dax_holder_notify_failure()\n\ndax_holder_notify_failure()
  reads dax_dev->holder_ops twice without\nREAD_ONCE() -- once for the NULL check
  and once for the indirect\nnotify_failure() call. A concurrent fs_put_dax() can
  clear holder_ops\nbetween the two reads, so the check can observe a non-NULL pointer
  while\nthe call dereferences NULL. (kill_dax() also clears holder_ops, but only\n\
  after synchronize_srcu(), so it cannot race a reader that is inside\ndax_read_lock();
  fs_put_dax() does no such synchronization.)\n\nFetch holder_ops once into a local
  with READ_ONCE() so the NULL check and\nthe indirect call observe the same value."
