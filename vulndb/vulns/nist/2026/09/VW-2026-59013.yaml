title: "Joomla Extension - joomshaper.com - Authenticated Privileged SQL Injection
  in the Content Plugin of SP Page Builder (Free and Pro) 5.2.1 - 6.9.0 - plgContentSppagebuilder::onContentAfterSave()
  read jform[attribs][sppagebuilder_article_id] from the request and concatenated
  it directly into the WHERE view_id = ... clause of a query against #__sppagebuilder
  without quoting or type casting. Joomla's ARRAY input filter does not sanitise element
  values, as InputFilter::clean() returns (array) $source with the elements untouched,
  so the entire payload could be delivered in a single POST field. The affected block
  also executed before the com_content.article context test, so it ran on every onContentAfterSave
  event regardless of which component triggered the save. An attacker could perform
  time-based blind SQL injection to read arbitrary database contents, including the
  #__users and #__session tables."
