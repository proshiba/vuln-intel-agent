title: AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 contains 
  an open redirect in objects/playlistSort.php. Because the endpoint is not a 
  *.json.php script, AVideo's automatic CSRF guard 
  (autoCSRFGuard()/forbidIfIsUntrustedRequest()) does not run, and when the 
  request includes the sort parameter the script issues a Location header set to
  the unvalidated $_SERVER['HTTP_REFERER'] value without calling 
  isSafeRedirectURL(). A remote unauthenticated attacker can therefore induce a 
  logged-in user who can manage the targeted playlist to submit a cross-origin 
  POST with a crafted Referer, causing the victim's playlist to be reordered and
  the victim's browser to be redirected from a trusted AVideo URL to an 
  attacker-controlled site for phishing. No patched version is available.
