title: The WP BackItUp Community Edition plugin for WordPress is vulnerable to 
  Directory Traversal in all versions up to, and including, 2.1.0 via the 
  'backup_file' parameter parameter. This makes it possible for authenticated 
  attackers, with administrator-level access and above, to read the contents of 
  arbitrary files on the server, which can contain sensitive information. The 
  basename() normalization present in the handler only executes when the 
  traversed target path does not exist, providing no protection against reads of
  existing files.
