title: S2OPC through 1.7.3 contains a null pointer dereference in 
  msg_subscription_publish_bs__alloc_notification_message_items() where a failed
  allocation for DataChangeNotification is overwritten by a successful 
  allocation for EventNotificationList. Attackers can trigger heap allocation 
  failures on sessions with both data-change and event notifications to cause 
