title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring:
  defer eventfd signaling when queued from a wakeup handler\n\nio_req_local_work_add()
  signals the CQ ring eventfd inline when it is the\none to push the first entry onto
  ->work_list. For DEFER_TASKRUN rings that\nadd is frequently done from a waitqueue
  wakeup handler, where an\narbitrary waitqueue lock is held.\n\neventfd_signal_mask()
  only refuses to recurse when current->in_eventfd\nis set, but that bit is set by
  eventfd_signal_mask() itself. If the wake\nchain starts somewhere else, signal goes
  out inline and can feed back\ninto epoll.\n\nAdd IOU_F_TWQ_IN_WAKE, set it on the
  task_work add done from the three\nwaitqueue callbacks, and use it to force io_eventfd_signal()
  down the\nexisting call_rcu_hurry() deferral instead of signaling inline."
