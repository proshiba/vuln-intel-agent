title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject key-less BTF for hash maps\n\nmap_check_btf() allows a key-less BTF (btf_key_type_id
  == 0) only for\nmaps that have a ->map_check_btf callback, and leaves the actual\n\
  decision to that callback. Hash maps used to have no ->map_check_btf,\nso a key-less
  BTF was rejected outright.\n\nThat changed when htab and rhtab gained a ->map_check_btf
  to register a\ndtor - htab in commit 1df97a7453ee (\"bpf: Register dtor for freeing\n\
  special fields\") and rhtab in commit 6905f8601298 (\"bpf: Allow special\nfields
  in resizable hashtab\"). Neither looks at the key, so a key-less\nhash map now passes
  map_check_btf() and gets created. Reading it back\nthrough bpffs feeds the key type_id
  0 into btf_type_seq_show();\nbtf_type_by_id() returns the void type, kind_ops[BTF_KIND_UNKN]
  is NULL,\nand btf_type_show() dereferences it:\n\nRIP: 0010:btf_type_show+0x223/0x2e0
  kernel/bpf/btf.c:8232\nRSP: 0018:ffffc9000399f868 EFLAGS: 00010206\nRAX: dffffc0000"
