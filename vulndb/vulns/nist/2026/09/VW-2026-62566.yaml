title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix buffer_head leak in ext4_init_orphan_info\n\next4_init_orphan_info() reads orphan
  file blocks with ext4_bread()\nand stores the returned buffer_head in oi->of_binfo[i].ob_bh.\n\
  \nIf ext4_bread() succeeds but the orphan block magic or checksum\nvalidation fails,
  the function jumps to out_free. However, the old\nout_free loop starts releasing
  buffers from i - 1, so the current\nbuffer_head at index i is skipped.\n\nThis leaks
  the buffer_head reference obtained by ext4_bread() on the\nbad magic and bad checksum
  error paths.\n\nFix this by tracking the number of successfully read buffer_heads
  and\nreleasing exactly those buffer_heads on the error path."
