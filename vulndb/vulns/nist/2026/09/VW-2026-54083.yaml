title: llmware 0.4.6 contains an SQL injection vulnerability in the 
  collection-database layer (llmware/resources.py) where filter and lookup 
  values are directly string-interpolated into SQL WHERE clauses without 
  parameterization or escaping, in both the SQLite and PostgreSQL backends. The 
  filter validator only checks keys against an allow-list and never sanitizes 
  values. Attacker-controlled filter values reaching the public API via 
  Library.block_lookup and Query.text_query_with_custom_filter / 
  text_query_by_author_or_speaker can neutralize the intended filter to disclose
  rows the caller was scoped out of (cross-document/cross-collection 
  disclosure); on PostgreSQL the flaw permits boolean- and UNION-based SQL 
  injection.
