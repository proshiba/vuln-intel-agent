title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, Dokploy organization members without Git provider access can retrieve
  plaintext provider credentials through github.one, gitlab.one, gitea.one, and 
  bitbucket.one because those protected procedures return full provider rows 
  without applying getAccessibleGitProviderIds or an organization check. The 
  application.one route also returns nested GitHub, GitLab, Gitea, and Bitbucket
  relations from findApplicationById with GitHub App private keys, OAuth tokens,
  client secrets, webhook secrets, and app passwords even when 
  hasGitProviderAccess is false. A member with application read access or a 
  provider identifier can therefore bypass per-member provider assignment and 
  use the exposed credentials to access private repositories or manipulate 
  external workflows. This issue is fixed in version 0.29.13.
