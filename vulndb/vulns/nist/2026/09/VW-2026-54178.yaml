title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/rsrc:
  fix folio size overflow in io_vec_fill_bvec()\n\nio_vec_fill_bvec() computes the
  folio size with a plain int 1:\n\n\tunsigned long folio_size = 1 << imu->folio_shift;\n\
  \nimu->folio_shift is unsigned int and comes from folio_shift() of the\nfolio backing
  the registered buffer, so it can be 32 or more on a 64 bit\nkernel. Shifting int
  1 that far is undefined, and on x86 and arm64 the\ncount is taken modulo 32, so
  a shift of 34 yields 4 rather than 16G.\nEvery other folio_shift shift in this file
  already uses 1UL.\n\nThe result is that the segment estimate and the fill loop disagree.\n\
  io_estimate_bvec_size() sizes the bvec array with the real shift:\n\n\tmax_segs
  += (iov[i].iov_len >> shift) + 2;\n\nso a 1M iovec on a 16G folio is charged 2 segments,
  while\nio_vec_fill_bvec() then walks the same iovec in folio_size chunks of 4\n\
  bytes and writes res_bvec[bvec_idx] a quarter of a million times, past\nthe end
  of the array it was g"
