title: "The product's web portals allow external links to be opened in a new browser
  tab. In certain configurations, the originating window retains access to the newly
  opened page, allowing interaction between the two browser contexts when navigating
  to external destinations.\n\nThis vulnerability could allow an attacker to manipulate
  the original trusted application window after a user clicks a malicious external
  link. This manipulation can lead to users being redirected to phishing pages, enabling
  credential theft, or facilitating other unauthorized actions within the context
  of the trusted site."
