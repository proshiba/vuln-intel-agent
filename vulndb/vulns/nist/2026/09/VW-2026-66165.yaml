title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  sr: restore network header before routing and forwarding\n\nipv6_srh_rcv() runs
  with skb->data at the Segment Routing Header (SRH)\nwhile skb_network_header() points
  at the IPv6 header.\n\nWhen segments_left > 0, ipv6_srh_rcv() previously restored
  the skb->data\nposition by pushing sizeof(struct ipv6hdr), assuming the SRH immediately\n\
  followed the fixed IPv6 header. If another extension header (such as a\nHop-by-Hop
  options header) precedes the SRH, skb_network_offset()\nremained negative.\n\nThis
  led to two problems:\n1. During ip6_route_input(), fib6_rules_early_flow_dissect()
  invokes\n   __skb_flow_dissect() which passes the negative skb_network_offset()\n\
  \   to flow dissection, breaking BPF and C flow dissector logic.\n2. If forwarded
  via ip6_forward() or redirected via act_mirred, downstream\n   handlers (like sch_fragment()
  or neighbour output) pass the negative\n   offset as an unsigned length, triggering
  OOB memcpy or buf"
