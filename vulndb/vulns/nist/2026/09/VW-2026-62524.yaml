title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix return status of RMI log page on allocation failure\n\nnvmet_execute_get_log_page_rmi()
  leaves 'status' holding NVME_SC_SUCCESS\n(set by the successful nvmet_req_find_ns()
  call) when the kzalloc() for\nthe log buffer fails. It then jumps to the out label
  and completes the\nrequest with a success status, so the host is told the command
  succeeded\nwhile no data was transferred.\n\nInitialize 'status' to NVME_SC_INTERNAL,
  matching the smart log handler,\nso an allocation failure is reported as an internal
  error."
