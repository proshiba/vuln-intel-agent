title: XenForo before 2.3.13 contains a missing authorization vulnerability in 
  the ACP cache-rebuild dispatcher that allows limited administrators with only 
  the rebuildCache permission to perform unauthorized approval queue actions by 
  supplying an arbitrary job class and actor user ID in the POST body. Attackers
  can invoke the approval queue job under any user identity to approve queued 
  user registrations without holding the required approval-queue or moderator 
  permissions, causing the moderation log to attribute actions to an 
  impersonated account.
