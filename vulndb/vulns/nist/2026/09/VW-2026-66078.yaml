title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  ets: clamp quantum in parse and fallback paths\n\nets_qdisc_change() falls back
  to psched_mtu() with no floor for bands\nwithout an explicit quantum. With a crafted
  size table qdisc_pkt_len\nreaches ~2 GiB, so a zero psched_mtu on a headerless device
  makes the\ndeficit-refill loop spin under the qdisc lock.\n\nMove the floor into
  ets_quantum_parse() so explicitly configured quanta\nare also clamped to [256, 1<<20],
  not just the fallback path.\n\nConditions to recreate the bug:\n  CONFIG_NET_SCH_ETS=y.
  Requires CAP_NET_ADMIN (namespace-local via\n  unshare -Urn suffices).\n\n  tc qdisc
  add dev dummy0 root ets bands 3 strict 2 quanta 1 1"
