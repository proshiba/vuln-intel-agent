title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  E-Switch, prevent mc_list repopulation during vport disable\n\nIn mlx5_esw_vport_disable(),
  move esw_apply_vport_rx_mode() ahead\nof esw_vport_change_handle_locked() so vport->allmulti_rule
  is\nNULL before the change handler observes it.\n\nDuring FW-fatal recovery the
  disable runs while dev->state ==\nINTERNAL_ERROR. The promisc query inside esw_update_vport_rx_mode()\n\
  fails and returns early, leaving vport->allmulti_rule intact, so\nesw_update_vport_mc_promisc()
  runs and adds MLX5_ACTION_ADD entries\nto vport->mc_list whose flow rules are then
  installed in the FDB\nby esw_add_mc_addr(). esw_destroy_legacy_table() tears down
  the\nFDB with those refs still held, corrupting the sub-tree and\nleaving dangling
  flow_rule pointers in vport->mc_list.\n\nTwo-stage failure on `echo 1 > /sys/bus/pci/devices/<bdf>/reset`:\n\
  \n  refcount_t: underflow; use-after-free.\n   tree_put_node+0xef/0x110 [mlx5_core]\n\
  \   clean_tree+0x44/0xd0 [mlx5_"
