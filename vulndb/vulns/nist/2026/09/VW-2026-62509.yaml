title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  qcom: scm: Fix NULL dereference in IRQ handler before __scm is published\n\nIn qcom_scm_probe(),
  devm_request_threaded_irq() is called before\nsmp_store_release(&__scm, scm). Two
  paths can dereference __scm before\nit is published, both causing a NULL pointer
  dereference.\n\nThe IRQ handler receives scm via its data argument but passes only
  wq_ctx\nto qcom_scm_waitq_wakeup() and qcom_scm_get_completion(), which then\ndereference
  __scm directly. Thread scm through both functions so the IRQ\nhandler path never
  touches __scm.\n\nNon-atomic SMC calls made during probe (e.g. from qcom_tzmem_init
  via\nqcom_scm_shm_bridge_enable) can return WAITQ_SLEEP, causing\nqcom_scm_wait_for_wq_completion()
  to run before __scm is published and\ndereference it. Add platform_set_drvdata(pdev,
  scm) early in probe and\nchange qcom_scm_wait_for_wq_completion() to take the device
  pointer and\nuse dev_get_drvdata() to reach scm, removing any depende"
