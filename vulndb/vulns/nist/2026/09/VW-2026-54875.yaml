title: "Affected versions of MISP permit unauthenticated or weakly constrained request
  paths to perform persistent work without adequate input bounds or rate limiting.\n\
  \n\nThe users/forgot password-reset endpoint accepted an attacker-controlled email
  value without first imposing a reasonable length bound or validating its format.
  That value was then used to create an audit log entry and queue a password-reset
  job, causing the supplied value to be persisted more than once per request. The
  commit explicitly states that an unbounded unauthenticated request field was stored
  twice per call with no throttle.\n\n\nThe fix adds:\n\n\n\n  *  \na maximum email
  input length of 1024 bytes;\n\n\n  *  \nemail-format validation before persistent
  work;\n\n\n  *  \na per-source pre-authentication request budget;\n\n\n  *  \nHTTP
  429 responses when that budget is exceeded;\n\n\n  *  \na 15-minute cooldown for
  API-access request emails;\n\n\n  *  \nPOST-only handling and CSRF protection for
  the API-access request endpoint.\n\n\n\n\n\nThe new flood"
