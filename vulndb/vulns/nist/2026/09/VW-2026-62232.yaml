title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/gic-v5:
  Check get_logical_index() return value in MADT IAFFID parsing\n\nIn gic_acpi_parse_iaffid()
  a given MADT GICC entry might not correspond\nto a logical cpu recognized by the
  kernel, resulting in the cpu variable\ninitialization to an error value.\n\nCurrently,
  the get_logical_index() return value is not checked for failure,\nwhich might result
  in out-of-bounds memory corruption while trying to\nindex a per_cpu variable array.\n\
  \nAdd a check to evaluate get_logical_index() return value."
