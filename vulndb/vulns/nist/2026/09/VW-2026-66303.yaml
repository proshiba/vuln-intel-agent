title: InvoicePlane is a self-hosted open source application for managing 
  invoices, clients, and payments. Prior to 1.7.2, InvoicePlane's Cron::recur() 
  method writes an invalid cron key from the URL path directly to the 
  application log without neutralizing CRLF characters. An unauthenticated 
  requester can place forged log lines into the audit trail by supplying a 
  crafted cron_key value. The injected entries can corrupt forensic records and 
  interfere with log-based monitoring. This issue is fixed in version 1.7.2.
