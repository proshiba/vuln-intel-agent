title: Vector is a high-performance observability data pipeline. From 0.10.0 
  until 0.57.0, the file sink renders its templated path from event fields and 
  opens the result without confining it to an intended directory. When an 
  untrusted source supplies an event field used by the path template, the value 
  can contain an absolute path or parent-directory traversal, causing Vector to 
  create parent directories and create or overwrite files outside the intended 
  location with the Vector process privileges. The resulting file write can 
  modify sensitive files and can lead to code execution when a scheduled task, 
  authorization file, or subsequently executed script is targeted. This issue is
  fixed in version 0.57.0.
