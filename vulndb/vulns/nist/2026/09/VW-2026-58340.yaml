title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  svcauth_gss: enforce krb5 token minimum length\n\nsvcauth_gss_unwrap_priv() validates
  only an upper bound on the\nwire-supplied opaque length before handing the buffer
  to\ngss_unwrap():\n\n    if (len > xdr_stream_remaining(xdr))\n            goto
  unwrap_failed;\n    offset = xdr_stream_pos(xdr);\n    ...\n    maj_stat = gss_unwrap(ctx,
  offset, offset + len, buf);\n\nThe wire value `len` flows unchanged as the upper
  bound into the\nkrb5 unwrap path, so a len in [0, 16] passes this check and is\n\
  handed to gss_unwrap(). For a krb5 v2 context that lands in\ngss_krb5_unwrap_v2(),
  which reads the 16-byte RFC 4121 token\nheader fields at ptr+4 and ptr+6 and then
  calls rotate_left()\nbefore any integrity check. With a sub-header length the header\n\
  reads run past the token, and _rotate_left()'s `shift %= buf->len`\npath can divide
  by zero when buf->len has been driven to zero by\nthe truncated token. A header-only
  token (len == 16) is eq"
