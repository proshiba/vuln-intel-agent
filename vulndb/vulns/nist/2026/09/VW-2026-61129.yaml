title: "A SAML authentication bypass vulnerability affects the Kong SAML plugin when
  the validate_assertion_signature option is explicitly set to false. This option
  is enabled by default. When disabled, the plugin may extract the SAML identity from
  an unsigned assertion and authenticate the user without verifying a valid cryptographic
  signature.\n\n\n\nAs a result, an unauthenticated remote attacker may be able to
  submit a crafted SAML response and impersonate arbitrary users, including administrators"
