title: "Improper link resolution before file access ('link following') vulnerability
  in the `tar` source plugin of Apache BuildStream running on Python < 3.12 allows
  malicious source tarballs to write files on the host, with the privileges of the
  user running BuildStream, via symlinks as part of source fetching.\nThe impact of
  this issue is mitigated by:\n\n* BuildStream projects should only use trusted sources
  in their elements as otherwise the build output can also not be trusted\n* Tracking
  a source tarball pins its SHA256 hash, which prevents MITM attacks of users that
  are fetching an already tracked project\n* When running on Python >= 3.12, BuildStream
  >= 2.3.0 already makes use of the Python `tarfile` filter functionality, which blocks
  the symlink escape\n\nUsers are recommended to upgrade to version 2.8.1, which fixes
  this issue."
