title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  harden gss_krb5_unwrap_v2 against short tokens\n\ngss_krb5_unwrap_v2() reads the
  EC and RRC header fields at ptr+4 and\nptr+6 before validating that the token is
  at least GSS_KRB5_TOK_HDR_LEN\n(16) bytes long, and its rotate_left() helper passes
  buf->len - base\nto xdr_buf_subsegment() without verifying that base <= buf->len.
  When\na caller hands in a sub-16-byte token, or a token whose declared len\nleaves
  base past the end of the buffer, three distinct failures follow:\n\n    gss_krb5_unwrap_v2(offset,
  len, buf)\n      ptr = buf->head[0].iov_base + offset\n      ec  = *(ptr + 4)  \
  \            /* OOB read on short head */\n      rrc = *(ptr + 6)              /*
  OOB read on short head */\n      rotate_left(offset + 16, buf, rrc)\n        xdr_buf_subsegment(buf,
  &subbuf,\n                           base, buf->len - base)   /* u32 wrap when base
  > len */\n        _rotate_left(&subbuf, shift)\n          shift %= buf->len    \
  \     /"
