title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost:
  invalidate vring access on IOTLB transitions\n\nWhen VIRTIO_F_ACCESS_PLATFORM changes,
  cached vring pointers and IOTLB\nmetadata are interpreted in a different address
  space. Keeping them\nacross the transition can leave stale ring mappings in use.\n\
  \nClearing d->iotlb before taking the VQ locks also lets a worker observe\na transient
  NULL d->iotlb and fall back to d->umem while translating a\ndescriptor.\n\nAdd a
  common vhost_clear_device_iotlb() helper for vhost-net and\nvhost-vsock. Take all
  VQ mutexes in index order before dropping the\ndevice-wide IOTLB, invalidate each
  VQ's cached ring access and metadata,\nclear pending IOTLB messages, and free the
  old table after the handoff.\nThis serializes the transition with workers and prevents
  mixed address\nspace mappings.\n\nOn the first direct-to-IOTLB transition, invalidate
  the cached vring\naddresses. When an existing device IOTLB is replaced, preserve
  the\nGIOVA ring addresses"
