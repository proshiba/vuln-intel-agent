title: FreeRDP versions before 3.31.0 contain an information disclosure 
  vulnerability in the RDPGFX server's ResetGraphics PDU serializer that fails 
  to initialize padding bytes in the fixed 340-byte wire format. Attackers can 
  receive uninitialized heap memory including live pointers and GLib function 
  addresses transmitted in the PDU, defeating heap ASLR and disclosing the GLib 
  module base address.
