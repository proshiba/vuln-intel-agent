title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq/amd-pstate:
  handle missing policy in dynamic EPP callbacks\n\ncpufreq_cpu_get() returns NULL
  when no cpufreq policy is associated with\nthe requested CPU, for example because
  the CPU is offline or the policy\nhas already been torn down.  Both amd_pstate_power_supply_notifier()
  and\namd_pstate_profile_set() acquire a policy via cpufreq_cpu_get() and then\n\
  pass that pointer to amd_pstate_get_balanced_epp() and\namd_pstate_set_epp(), which
  dereference it unconditionally.  A racing\nCPU hotplug or driver teardown can therefore
  lead to a NULL pointer\ndereference on either of these dynamic EPP paths.\n\nThe
  third cpufreq_cpu_get() caller in this file, amd_pstate_verify(),\nalready handles
  the NULL case.  Bring the two new callers in line with\nthat pattern: return NOTIFY_OK
  from the power-supply notifier (matching\nthe other \"nothing to do\" exits) and
