title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: bound dirent name against end of SMB response in cifs_filldir\n\ncifs_filldir()
  copies the entry name out of an SMB1 TRANS2_FIND_FIRST /\nFIND_NEXT response using
  a length (de.namelen) supplied by the server.\nThe kmalloc'd SMB response buffer
  is bounded, but nothing checks that\nde.name + de.namelen still lies inside that
  buffer before the eventual\nfilldir64() -> verify_dirent_name() -> memchr() reads
  namelen bytes.\n\nA hostile SMB1 server that returns an oversized FileNameLength
  in a\ndirectory entry therefore causes memchr() to read past the end of the\nresponse
  slab buffer. Reachable from any user who can list a directory\non a CIFS mount served
  by an attacker-controlled server (getdents64()\non the mounted directory):\n\n \
  \ BUG: KASAN: slab-out-of-bounds in memchr+0x71/0x80\n  Read of size 1 at addr ffff88800e0640cc
  by task poc/115\n  Call Trace:\n   dump_stack_lvl+0x64/0x80\n   print_report+0xce/0x620\n\
  \   kasan_repor"
