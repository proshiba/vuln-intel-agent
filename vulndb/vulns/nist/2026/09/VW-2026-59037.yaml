title: A vulnerability was determined in taisan tarzan-cms 1.0.0. This issue 
  affects the function openConnection of the file 
  com/tarzan/cms/modules/admin/service/biz/ThemeService.java of the component 
  Theme Download Function. Executing a manipulation of the argument httpUrl can 
  lead to server-side request forgery. The attack may be launched remotely. The 
  exploit has been publicly disclosed and may be utilized. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
