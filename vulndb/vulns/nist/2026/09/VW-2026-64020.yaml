title: 'Warpgate is an open source SSH, HTTPS and MySQL bastion host for Linux. Prior
  to 0.27.6, the response_mode=form_post SSO return path in warpgate-protocol-http/src/api/sso_provider_list.rs
  uses serde_json::to_string inside ReturnToSsoPostResponse without neutralizing a
  script-closing sequence. The vulnerable value can enter the script block through
  the attacker-controlled next redirect parameter stored by warpgate-protocol-http/src/api/sso_provider_detail.rs
  or through IdP-derived error messages that make_redirect_url concatenates without
  URL encoding. The IdP-derived path is reachable when the attacker controls a configured
  identity provider, or when the attacker controls the email or username claim on
  an attacker-controlled account and the configured identity provider permits the
  required unvalidated claim format. A victim must complete the form_post SSO flow
