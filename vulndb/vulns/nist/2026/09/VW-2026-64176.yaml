title: "Net::IDN::Punycode versions from 2.302 before 2.590 for Perl leak the output
  buffer on every rejected label in decode_punycode.\n\nThe XS backend allocates the
  scalar it returns before it validates the input, sizing the buffer at twice the
  input length. The scalar is released only on the success path, so each of the three
  croaks that reject a label leaves the scalar and its buffer allocated. Nothing bounds
  the label length in the to-Unicode direction, since the 63-byte DNS limit is checked
  only when converting to ASCII.\n\nOnly the XS backend is affected.\n\nA sender who
  supplies invalid labels grows the process by twice the label length per rejected
  call, with no successful call needed."
