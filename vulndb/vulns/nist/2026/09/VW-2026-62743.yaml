title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/fair:
  Fix overflow in update_tg_cfs_runnable()\n\nA divide-by-zero crash is observed when
  running hackbench:\n\n   [14697.488452] CPU: 112 UID: 0 PID: 124791 Comm: hackbench
  Not tainted 7.1.0-rc2+\n   [14697.492627] RIP: 0010:propagate_entity_load_avg+0x35f/0x3e0\n\
  \   [14697.506799]  <TASK>\n   [14697.507411]  __dequeue_task+0x2b4/0xc70\n   [14697.508677]\
  \  dequeue_task_fair+0x36/0x370\n   [14697.509047]  dequeue_task+0x101/0x2f0\n \
  \  [14697.509426]  __schedule+0x1b1/0x1a00\n   [14697.510868]  anon_pipe_read+0x3da/0x450\n\
  \   [14697.511400]  vfs_read+0x361/0x390\n   [14697.512053]  __x64_sys_read+0x19/0x30\n\
  \nThe divide-by-zero happens here:\n\n  if (scale_load_down(gcfs_rq->load.weight))
  {\n           load_sum = div_u64(gcfs_rq->avg.load_sum,\n                      \
  \        scale_load_down(gcfs_rq->load.weight));\n  }\n\ngcfs_rq->load.weight is
  an insane large value and is truncated\nto the lower 32 bits by div_u64, which happen
  to be 0.\n\n"
