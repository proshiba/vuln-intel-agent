title: On a multi-user system, a user with an active local login session could 
  downgrade a system-wide Flatpak app to an older version by removing the app's 
  remote ref via the unprivileged system-helper RemoveLocalRef method, causing 
  the anti-downgrade check to fail to find a reference date. A malicious local 
  user could use this to expose other users of the same system to an app version
  with unfixed vulnerabilities.
