title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw88: Add NULL check for chip->edcca_th in rtw_fw_adaptivity_result()\n\nIt was
  recently reported that rtw_fw_adaptivity_result()\nin fw.c dereferences rtwdev->chip->edcca_th
  without\na NULL check. The issue is that devices with the\n8821CE chip don't define
  edcca_th in their chip\ninfo. As a result, when rtw_fw_adaptivity_result()\ntries
  to dereference it, the kernel triggers an oops.\n\nAdd a NULL check for edcca_th
  before dereferencing\nit in rtw_fw_adaptivity_result() in fw.c. Placing\nthe check
  at the function entry avoids logging any\ngarbage values.\n\nThis change does not
  address the root cause for\nthis behavior, but it prevents the NULL dereference\n\
  and the resulting oops while a more permanent solution\nis developed.\n\nTested
  on a 8822CE chip which defines edcca_th, so\nthis issue is not present on it, but
  it still uses\nthis driver and I can verify there are no regressions."
