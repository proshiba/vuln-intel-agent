title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  fix missing barrier when checking io-uring readiness\n\nfuse_block_alloc() reads
  fch->initialized and then fch->io_uring.\nfch->io_uring is set before fch->initialized,
  ordered by the smp_wmb()\nin fuse_chan_set_intialized(), but fuse_block_alloc()
  has no matching\nread barrier between the two loads.\n\nThis may lead a CPU to observe
  fch->initialized=1 but fch->io_uring=0,\nand skip the check that blocks request
  allocation until the io-uring\nqueues are ready. This can reintroduce the lock-order
  inversion deadlock\nthat commit 3393ff964e0f prevents.\n\nAdd an smp_rmb() barrier
  to pair with the smp_wmb() in\nfuse_chan_set_initialized() to prevent this."
