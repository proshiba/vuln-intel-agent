title: "A flaw was found in the automation-controller API. The\n                 \
  \ unauthenticated health-check endpoint /api/v2/ping/\n                  (ApiV2PingView,
  AllowAny) over-serializes RBAC-gated\n                  automation-mesh data into
  its anonymous response, exposing the\n                  full instance inventory
  (node hostnames, node types, UUIDs,\n                  heartbeats, capacities, and
  exact versions), all instance-group\n                  names and membership, the
  deployment install UUID, and the\n                  active control node. A remote,
  unauthenticated attacker can use\n                  this to map the control plane
  and fingerprint software versions\n                  for targeted attacks. This
  flaw affects confidentiality only;\n                  it does not expose secrets,
  credentials, or tenant data."
