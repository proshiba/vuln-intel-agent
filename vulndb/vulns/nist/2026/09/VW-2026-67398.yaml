title: LiteLLM contains a weak authentication vulnerability that allows an 
  attacker holding a valid JWT from the configured identity provider to 
  authenticate as any existing user by exploiting an email-based fallback lookup
  in the JWT authentication flow without verifying the email_verified claim. 
  Attackers can present a token with an unverified email address matching a 
  victim's account to inherit the victim's role, including proxy_admin 
  privileges, and permanently overwrite the victim's stored identity binding to 
  retain persistent unauthorized access to administrative endpoints exposing API
  keys and user management.
