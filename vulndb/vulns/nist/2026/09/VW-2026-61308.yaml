title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  rawnand: validate ONFI extended parameter page sections\n\nnand_flash_detect_ext_param_page()
  allocates the length declared by the\nONFI parameter page, then treats the data
  as a fixed header followed by\nvariable-length sections. It reads that header and
  advances over sections\nwithout first proving that the fixed page and each current
  section fit in\nthe allocation.\n\nReject pages shorter than the fixed header, track
  the remaining variable\narea while walking sections, and require the ECC section
  to contain every\nfield read from struct onfi_ext_ecc_info. Use device-scoped diagnostics\n\
  that identify the malformed ONFI section."
