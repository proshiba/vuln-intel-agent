title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix OOB in free_rd_atomic_resources()\n\nfree_rd_atomic_resources() iterates using
  qp->attr.max_dest_rd_atomic.\nUpdating max_dest_rd_atomic before freeing the old
  array can make the\nfree path walk past the old allocation and trigger a slab out-of-bounds\n\
