title: Novu provides an API for sending notifications through multiple channels.
  Prior to 3.18.0, Novu accepts chat webhook URLs from subscriber 
  credentials.webhookUrl, channel endpoint endpoint.url, event 
  payload.webhookUrl, and event overrides.webhookUrl, then passes the selected 
  endpoint.url through send-message-chat.usecase.ts to raw HTTP requests in the 
  Slack, Discord, Mattermost, Microsoft Teams, Grafana On-Call, Ryver, 
  Rocket.Chat, GetStream, and Zulip providers. An authenticated user can supply 
  an internal or otherwise restricted destination because these paths do not 
  apply normalizeOutboundHttpUrl, assertSafeOutboundUrl, or the DNS-pinned 
  safeOutboundJsonRequest protection used by the generic webhook providers. The 
  Novu worker can consequently issue attacker-directed POST requests to internal
  network services and cause interactions or actions supported by those 
  services. This issue is fixed in version 3.18.0.
