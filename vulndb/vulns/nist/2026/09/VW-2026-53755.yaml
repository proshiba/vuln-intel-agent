title: "Improper neutralization of special elements used in an OS command (CWE-78)
  in the blueprint resynthesis framework in Amazon Web Services codecatalyst-blueprints
  before 0.3.156 might allow a user with permission to commit to a repository in the
  project to execute arbitrary commands in the blueprint resynthesis environment via
  shell metacharacters in the owner field of a [local] merge strategy entry in a crafted
  .ownership-file.\n\n\n\nVersion 0.3.156 removes shell interpretation of the owner
  field, running the command directly rather than through a shell, and rejects values
  outside an allowlisted command form. This eliminates shell metacharacter command
  injection. To remediate this issue, users should upgrade to version 0.3.156 or later.\n\
  \n\n\nNo action is required for use of the Amazon CodeCatalyst service. Resynthesis
