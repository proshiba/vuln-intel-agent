title: Temporal Server did not bound the work performed while searching for a 
  Schedule's next action time. An authenticated caller with namespace write 
  permission could create or update a Schedule that combines a fine-grained 
  cadence with an exclusion calendar that rejects every candidate time, causing 
  the server to evaluate excluded candidates without a per-search work budget. 
  This can consume excessive CPU in Frontend and Schedule worker components. A 
  persisted specification can also cause its backing Schedule Workflow to 
  repeatedly fail and retry, allowing CPU consumption to continue without 
  additional requests until the Schedule is deleted or its backing Workflow is 
  terminated. Repeated or parallel exploitation can deny service. The issue 
  affects availability only; it does not expose or modify Workflow data.
