title: A weakness has been identified in jaychouchannel 
  Tourism-Management-System up to 8122bf020d91199eddfff3ee02d1632a70a9a132. 
  Affected is an unknown function of the file 
  travel/src/main/java/com/controller/CommonController.java of the component 
  CommonDao. Executing a manipulation of the argument 
  table/column/xColumn/yColumn can lead to sql injection. The attack can be 
  launched remotely. The exploit has been made available to the public and could
  be used for attacks. This product does not use versioning. This is why 
  information about affected and unaffected releases are unavailable. This patch
  is called d44ec3aa0bd2a72c8800e3befb0a9a96a6491b86. A patch should be applied 
  to remediate this issue.
