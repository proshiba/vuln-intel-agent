title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Unlink NVMe unsol ctx before freeing on LS reject error\n\nqla_nvme_xmt_ls_rsp()
  obtains uctx, which was linked into\nfcport->unsol_ctx_head by qla2xxx_process_purls_iocb()
  and is still linked\nwhen the NVMe transport calls back to transmit the LS response.
  On the\nerror (out:) path the function frees uctx with kfree() but never removes\n\
  it from the list. This leaves a freed node in fcport->unsol_ctx_head: the\nnext
  list_add_tail() for that fcport writes through the freed node, and a\nsubsequent
  list_del() can corrupt the list or panic.\n\nUnlink uctx with list_del() before
  kfree() on the error path, matching the\nother free sites in qla_nvme_release_lsrsp_cmd_kref()
  and\nqla2xxx_process_purls_pkt(). qla2x00_rel_sp() in the failure path only\nreturns
  the SRB to its pool and does not invoke sp->put_fn, so the out:\npath is the sole
  free and uctx is always still linked there."
