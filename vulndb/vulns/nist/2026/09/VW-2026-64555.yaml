title: An out-of-bounds read vulnerability exists in the schema lexer of flatcc 
  4c3b999e. When an exact-length FlatBuffers schema buffer ends with a digit, 
  the integer digit-scan loop in lex() advances past the end of the input buffer
  and dereferences the out-of-bounds pointer. A specially crafted schema can 
  trigger a one-byte heap buffer over-read, resulting in application crash and 
  denial of service.
