title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  validate attr entry pointer before field access\n\nxfs_attr3_leaf_verify_entry()
  accesses lentry/rentry fields (namelen,\nvaluelen) before checking if the entry
  pointer itself is within bounds.\nIf nameidx is crafted to point near the end of
  the buffer, these field\naccesses can read out-of-bounds before the bounds check
  at\nname_end > buf_end is performed.\n\nAdd explicit bounds checks for entry pointers
  before accessing their\nfields. Use offsetof() to check that the start of the flexible
  array\nmember (nameval/name) is within bounds, which ensures all preceding\nfields
  are safe to access."
