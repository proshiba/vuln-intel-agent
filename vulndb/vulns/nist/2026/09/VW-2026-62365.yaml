title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: free the mesh send cancel command when it is cancelled\n\nmesh_send_cancel()
  queues the pending command with a NULL destroy\ncallback, so it is only freed if
  send_cancel() runs. A cancelled entry is\nleaked, as _hci_cmd_sync_cancel_entry()
  does not release entry->data when\nthere is no destroy callback, and hci_cmd_sync_clear()
  cancels every\npending entry when the controller is unregistered. Nothing else reclaims\n\
  it either: mgmt_pending_new() does not put the command on\nhdev->mgmt_pending.\n\
  \nThe leak also pins the socket reference taken by mgmt_pending_new(), so\nthe mgmt
  socket is never released.\n\nFree the command from a destroy callback."
