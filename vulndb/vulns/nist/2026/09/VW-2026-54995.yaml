title: '@sap/cds-mtxs NPM library does not perform sufficient checks on certain functionality
  used in multitenant CAP applications with extensibility enabled. An unauthenticated
  attacker could send specially crafted requests to obtain sensitive credentials and
  abuse them to replace or delete tenant data. Successful exploitation can result
  in a high impact on availability and integrity of the application. There may also
  be partial impact to the confidentiality of business data.'
