title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to 3.7.2, Joplin Server's GET 
  /items/:id/content route in packages/server/src/routes/index/items.ts loads 
  item content from an attacker-supplied internal server ID without checking 
  whether the signed-in user owns or can access that item. Any authenticated 
  user who obtains or guesses another user's item ID can read the corresponding 
  note or item content when end-to-end encryption does not protect it. This 
  issue is fixed in version 3.7.2.
