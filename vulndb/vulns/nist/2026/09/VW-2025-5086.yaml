title: "In WODESYS WD-R608U router (also known as WDR122B V2.0 and WDR28) due to lack
  of validation in the langGet parameter in the adm.cgi endpoint, the malicious attacker
  can execute system shell commands.\n\nThe vendor was notified early about this vulnerability,
  but didn't respond with the details of vulnerability or vulnerable version range.
  Only version WDR28081123OV1.01 was tested and confirmed as vulnerable, other versions
  were not tested and might also be vulnerable."
