title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.9.0 until 0.11.1, backend/open_webui/models/calendar.py 
  stored the calendar event meta.alert_minutes value without type validation and
  the shared upcoming-event scheduler compared that value numerically. An 
  authenticated user with the calendar permission could store a non-numeric 
  alert_minutes value that raised an exception and aborted the instance-wide 
  alert pass, suppressing all users' reminders while the event remained in the 
  lookahead window. This issue is fixed in version 0.11.1.
