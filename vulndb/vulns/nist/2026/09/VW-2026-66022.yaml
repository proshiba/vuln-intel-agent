title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunvdc:
  unmap LDC cookies when the descriptor send fails\n\n__send_request() maps the request's
  pages into the LDC channel's map\ntable (ldc_map_sg()), fills in the descriptor
  and marks it\nVIO_DESC_READY before ringing the doorbell via __vdc_tx_trigger().\n\
  When the trigger fails, the error path only prints a message: the\ndescriptor stays
  READY and the cookies are never unmapped. The\nmapping is normally released in vdc_end_one()
  when the peer completes\nthe descriptor - but a descriptor whose doorbell was never
  sent will\nnever complete, and since dr->prod is not advanced on failure, the\n\
  reset path (vdc_requeue_inflight(), which walks [cons, prod)) never\nvisits it either.
  The map table entries are leaked permanently.\n\nSince commit a11f6ca9aef9 (\"sunvdc:
  Do not spin in an infinite loop\nwhen vio_ldc_send() returns EAGAIN\") trigger failures
  occur in\npractice under load, so every resulting I/O error also leaks one\nrequest's
  wort"
