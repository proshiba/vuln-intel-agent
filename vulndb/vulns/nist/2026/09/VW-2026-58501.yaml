title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  remove flawed WARN_ON_ONCE from nfsd_mode_check\n\nThe header for commit e75b23f9e323
  (\"nfsd: check d_can_lookup in\nfh_verify of directories\") details the assumption
  that justified\nadding the WARN_ON_ONCE to nfsd_mode_check(), that assumption is\n\
  invalid (in the case of NFS reexport).\n\nWhen NFSD exports an NFS filesystem it
  is very possible for\nnfsd_mode_check() to encounter a @dentry that doesn't have\n\
  i_op->lookup (see nfs_fhget()'s NFS_ATTR_FATTR_MOUNTPOINT and\nNFS_ATTR_FATTR_V4_REFERRAL
  handling, and d_flags_for_inode()).\n\nSo remove nfsd_mode_check()'s WARN_ON_ONCE().
  The nfserr_notdir\nreturn on that branch must stay. It guards the subsequent\nlookup_one_unlocked()
  -> __lookup_slow() path, which calls\ninode->i_op->lookup() with no NULL check,
  so returning nfserr_notdir\nis what keeps a client LOOKUP into such a @dentry from
  dereferencing\na NULL method pointer."
