title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Don't predict JMP32 pointer vs zero comparisons\n\nConsider the following program:\n\
  \n        r1 = map_value;      /* low 32 bits are zero at runtime */\n        r6
  = 0xdead000000000000;\n        if w1 != 0 goto l1;\n    l0: r1 += r6;\n        r2
  = *(u64 *)(r1 + 0);\n        exit;\n    l1: r6 = 0;\n        goto l0;\n\nAt the
  moment is_branch_taken() reports the jump as always taken,\nbecause it does not
  distinguish between BPF_JMP and BPF_JMP32\ncomparisons when processing 'if w1 !=
  0 ...'."
