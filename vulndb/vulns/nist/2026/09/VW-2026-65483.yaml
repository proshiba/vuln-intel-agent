title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rsi: avoid reading TKIP MIC keys for non-TKIP ciphers\n\nrsi_hal_load_key() copies
  tx_mic_key and rx_mic_key from data[16] and\ndata[24] whenever key data is present.
  Those offsets are only part of\nthe 32-byte TKIP key layout. Shorter keys used by
  other ciphers, such as\nCCMP, do not provide those bytes, so the unconditional copies
  can read\npast the supplied key buffer.\n\nOnly copy the MIC keys for TKIP, and
  reject malformed TKIP keys that are\nshorter than the expected 32-byte layout.\n\
  \n[drop useless length check]"
