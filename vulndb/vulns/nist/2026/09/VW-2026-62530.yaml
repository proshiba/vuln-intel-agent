title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix BUG in nilfs_copy_dirty_pages() on dirty state mismatch\n\nSyzbot reported a
  kernel BUG triggered within nilfs_copy_dirty_pages(),\nwhich copies dirty DAT file
  folios/pages to its shadow page cache.  The\nBUG occurs when a retrieved dirty folio/page
  unexpectedly loses its\n'dirty' status.\n\nThis issue arises because, since the
  commit referenced below, the 'dirty'\nflag of a folio/page can be cleared asynchronously
  after the filesystem\ndetects metadata corruption and transitions to read-only mode.\n\
  \nResolve the issue by returning an -EROFS error if the filesystem has\ntransitioned
  to read-only mode.  Also change the behavior to issue a\nkernel warning only once
  instead of triggering a kernel BUG when this\nunexpected 'dirty' state is detected
  while the filesystem is not in\nread-only mode."
