title: The Cookie Banner for GDPR / CCPA – WPLP Cookie Consent plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via the 
  'wpl_user_preference' parameter in all versions up to, and including, 4.4.1 
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. The 
  consent-logging AJAX endpoint is registered for unauthenticated users and its 
  required nonce (wpl_consent_logging_nonce) is publicly emitted via 
  wp_localize_script on the frontend, meaning any unauthenticated site visitor 
  can plant a payload without any prior authentication or privileged access.
