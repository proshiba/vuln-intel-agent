title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  tree-checker: validate names in ROOT_REF and ROOT_BACKREF\n\nROOT_REF and ROOT_BACKREF
  items contain a struct btrfs_root_ref followed\nby the subvolume name. Several readers
  assume that this layout is already\nvalid and then use the on-disk name length directly.
  A corrupted item can\ntherefore make those readers address bytes outside the item,
  and\nBTRFS_IOC_GET_SUBVOL_INFO can copy too many bytes into its fixed-size UAPI\n\
  name buffer.\n\nValidate ROOT_REF and ROOT_BACKREF items in tree-checker before
  any reader\nuses them. Reject records that do not contain a non-empty name, whose\n\
  name_len does not exactly describe the remaining item payload, or whose\nname exceeds
  BTRFS_NAME_LEN.\n\nFor BTRFS_IOC_GET_SUBVOL_INFO, copy only the validated on-disk
  name_len\ninstead of deriving the copy length from the item size. The ioctl result
  is\nzeroed when allocated. That leaves the existing trailing zero byte\nuntouched."
