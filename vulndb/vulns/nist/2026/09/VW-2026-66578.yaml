title: 'OpenClaw is an npm-distributed agent gateway. In versions before 2026.7.1,
  the global Active Memory toggle mutations could omit owner checks. An authorized
  non-owner external-channel sender could therefore persistently enable or disable
  Active Memory for the Gateway, disabling memory recall for future sessions or re-enabling
  global recall where the owner expected it to remain disabled. The issue is limited
  to persistent global on/off mutations; session-level controls and read-only status
  remain governed by existing command policy. The issue is fixed in version 2026.7.1.
  (Suggested title: "OpenClaw before 2026.7.1 missing owner authorization check on
  Active Memory global toggles".)'
