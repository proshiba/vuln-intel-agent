title: zlt2000 microservices-platform through 6.0.0 contains an authorization 
  bypass vulnerability in the search-center service that allows authenticated 
  attackers to read any Elasticsearch index by specifying the index name in POST
  /search/{indexName} and GET /agg/requestStat/{indexName}/{routing} path 
  variables. Attackers can query arbitrary indices including sys_user to 
  retrieve sensitive user records and password hashes without proper access 
  controls.
