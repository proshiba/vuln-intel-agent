title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Don't free the live ring's TPA state on queue restart failure\n\nbnxt_queue_mem_alloc()
  shallow copies the live RX ring into the clone:\n\n  memcpy(clone, rxr, sizeof(*rxr));\n\
  \nthe code currently clears pointers that the clone owns (such as\nrx_agg_bmap),
  but rx_tpa and rx_tpa_idx_map are left pointing at memory\nof the live ring that
  was cloned.\n\nIf an allocation failure happens later and the err_free_tpa_info
  label\nis taken, the live ring's memory can be freed while still in use.\n\nFix
  this by initializing the clone's pointers to NULL to prevent live\nring state from
  being freed inadvertently."
