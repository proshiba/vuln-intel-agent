title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/sysfb:
  ofdrm: Fix integer overflow in fb_size calculation\n\nThe framebuffer size calculation
  `fb_size = linebytes * height` can\noverflow when both values are large (e.g., 46341
  * 46341 > INT_MAX).\nSince linebytes and height are both int types, the multiplication
  is\nperformed as int * int, which results in undefined behavior on overflow.\n\n\
  Use check_mul_overflow() to detect and prevent this overflow, consistent\nwith the
  approach used in simpledrm.c and corebootdrm.c."
