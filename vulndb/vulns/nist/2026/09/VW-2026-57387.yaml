title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.10.0 until 0.11.1, DELETE /api/v1/knowledge/{id}/delete in
  backend/open_webui/routers/knowledge.py authorized deletion against the 
  knowledge base but then removed its administrator-owned external connection 
  without a separate administrator check or a check for other dependent 
  knowledge bases. A non-administrator with write access to one external 
  knowledge base could delete shared instance configuration and make every other
  knowledge base using that connection unavailable. This issue is fixed in 
  version 0.11.1.
