title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  do not dereference an unset send buffer on the SMC-D teardown path\n\nsmc_close_stream_wait()
  calls smc_tx_prepared_sends() from inside its\nsk_wait_event() condition, and sk_wait_event()
  evaluates that condition\nonce with the socket lock released. smcd_buf_detach()
  clears\nconn->sndbuf_desc from smc_conn_kill() under lock_sock(), so a link group\n\
  terminating while a socket waits there leaves the helper dereferencing\nNULL, faulting
  out of close(). SIOCOUTQ reads the field by hand, and\nsmc_close_cancel_work() drops
  the lock across two cancel_*_sync() calls.\n\nSample the pointer once in the helper,
  report nothing prepared while it is\nunset, and bound the ioctl the same way. The
  receive tasklet dereferences\nthe field directly in smc_cdc_msg_recv_action(), not
  through this helper;\n1/2 is what keeps it from running that late."
