title: "pgAdmin 4's Backup tool appended the client-supplied 'database' field from
  the /backup/job/<sid>/object request to the pg_dump argument vector as a bare trailing
  positional argument, without validation. Because pg_dump parses its options with
  getopt_long, which permutes arguments, a value beginning with a dash was interpreted
  as an option rather than as a database name. A value such as --file=/absolute/path
  therefore overrode the storage-confined --file that pgAdmin had constructed earlier,
  causing pg_dump to write its output anywhere the pgAdmin process could write, outside
  the user's File Manager storage directory. This yields arbitrary file creation and
  overwrite as the operating-system account running pgAdmin, which can destroy pgAdmin's
  own configuration database and, depending on the target chosen, be escalated further.\n\
  \nThe same field additionally permitted connection-string injection. libpq expands
  a database name containing an equals sign into a full connection string, and key"
