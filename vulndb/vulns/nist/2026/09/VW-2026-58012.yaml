title: A flaw was found in the Dynamic Client Registration service of Keycloak, 
  an open-source identity and access management solution. The issue occurs when 
  a user with the view-clients role accesses the client registration endpoint to
  retrieve client details. Due to a failure to mask sensitive information, the 
  service returns the client's confidential secret in cleartext. This could 
  allow a read-only administrator to obtain full access to the affected client's
  account and potentially escalate their privileges within the realm.
