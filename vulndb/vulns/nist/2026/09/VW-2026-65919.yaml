title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Handle buffer allocation failure in bnxt_rx_ring_reset()\n\nbnxt_rx_ring_reset()
  frees the ring buffers and then reallocates them,\nignoring the result.\n\nbnxt_alloc_one_rx_ring()
  can fail in bnxt_alloc_one_tpa_info_data(), which\nreturns -ENOMEM on the first
  failed allocation and leaves the remaining\nrxr->rx_tpa[] entries zeroed.\n\nThe
  error isn't propagated up, so the loop in bnxt_rx_ring_reset\ncontinues and at the
  end the code re-enables TPA with partially\nunallocated rx_tpa array.\n\nThis means
  that when the agg_id from hardware is mapped to a SW index in\nrxr->rx_tpa[], an
  uninitialized slot can be chosen which would hand a\nzero DMA address to the device.\n\
  \nFix this by falling back to a global reset, which is what the existing\ncode already
  does when other functions fail, but unlike the other\nfailure cases this particular
  failure has to return because TPA can't\nbe re-enabled since the allocation failed."
