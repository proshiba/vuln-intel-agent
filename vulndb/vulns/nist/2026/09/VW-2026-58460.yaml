title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  hold rcu across localio cmpxchg retry\n\nnfsd_file objects are freed via call_rcu
  (filecache.c:296), and\nnfsd_file_slab is created without SLAB_TYPESAFE_BY_RCU\n\
  (KMEM_CACHE(nfsd_file, 0) at filecache.c:789), so the slab page\nbacking a freed
  nfsd_file becomes freely reclaimable once the RCU\ngrace period elapses.\n\nThe
  again: retry block in nfsd_open_local_fh() loads a pointer with\ncmpxchg and then
  calls nfsd_file_get(new) (which is\nrefcount_inc_not_zero) without holding rcu_read_lock.
  The sole caller\nnfs_open_local_fh() drops rcu_read_lock before invoking this helper,\n\
  so no outer reader-side critical section covers the load.\n\n    CPU 0 (nfsd_open_local_fh)\
  \        CPU 1 (nfsd_file_put_local)\n    -----                             -----\n\
  \    new = cmpxchg(pnf, NULL, ...)\n                                      nf = xchg(pnf,
  NULL)\n                                      nfsd_file_put(nf)\n               \
  \                      "
