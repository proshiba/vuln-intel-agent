title: The Rename wp-login.php to anything you want plugin for WordPress is 
  vulnerable to time-based SQL Injection via 'log' (Username) Parameter in all 
  versions up to, and including, 2.0.1 due to insufficient escaping on the user 
  supplied parameter and lack of sufficient preparation on the existing SQL 
  query. This makes it possible for unauthenticated attackers to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. WordPress core applies 
  wp_unslash() to the 'log' POST value before dispatching the wp_login_failed 
  action, stripping magic-quotes backslash escaping and allowing a raw single 
  quote to reach the plugin's handler unimpeded.
