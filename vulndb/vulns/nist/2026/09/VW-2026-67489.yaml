title: An authenticated LimeSurvey Community Edition 7.3.0 user allowed to 
  create surveys can use their own survey as an authorized context while 
  supplying question or answer identifiers belonging to another user's survey. 
  The REST survey-patching endpoint checks the attacker's permission against the
  survey ID in the request URL, but the vulnerable persistence operations 
  resolve the target object independently by its global qid or aid and never 
  verify that it belongs to that authorized survey.
