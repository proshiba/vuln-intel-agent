title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  Reject krb5 v2 wrap tokens with oversized ec field\n\ngss_krb5_unwrap_v2() sets
  buf->len to a logical\nlength, which can be much smaller than head[0].iov_len\n\
  (the allocated receive-page capacity).  It then calls\nxdr_buf_trim() with a trim
  length derived from the 16-bit\n\"extra count\" (ec) field in the Kerberos v2 token
  header.\n\nThe ec field is authenticated by the post-decrypt memcmp()\nagainst the
  encrypted header copy, so a randomly-mutated\nvalue is rejected.  However, any peer
  holding a valid GSS\ncontext can legitimately encrypt a token whose ec exceeds\n\
  the plaintext length.  Per RFC 4121, such a token is\nstructurally malformed.\n\n\
