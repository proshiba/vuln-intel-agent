title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Keep kick_sync waiting on the rq's own CPU\n\nkick_sync_wait_bal_cb() assumes it
  runs on the rq's CPU from the\n__schedule() tail: the snapshots it compares against
  live in that CPU's\npercpu area and the busy-wait runs with the rq lock dropped
  and IRQs\nenabled.\n\nHowever, dispatch can now drop the rq lock while the callback
  sits queued,\nand rq lock takers in that window (the sched class change paths, the
  scx\ntask iterator) flush pending balance callbacks on release, running the\ncallback
  on a foreign CPU. Such a run compares against unrelated snapshots\nand can deadlock
  when the executing CPU is itself a wait target.\n\nBail on a foreign CPU and leave
  the wait state alone. The wait only observes\nprogress that the resched kicks already
  guarantee and the rq's next wait\npicks up the stale cpus_to_sync bits."
