title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. From 8.0.0 until 8.0.6, the 
  HTTP/1 parser limits decompression work per transaction but does not limit how
  many small brotli compression bombs a single flow can submit. With 
  response-body-decompress-layer-limit enabled, repeated compressed responses 
  make the decompression paths in rust/htp perform expensive work for every 
  transaction, degrading packet processing and potentially causing loss of 
  monitoring visibility or denial of service. This issue is fixed in version 
  8.0.6.
