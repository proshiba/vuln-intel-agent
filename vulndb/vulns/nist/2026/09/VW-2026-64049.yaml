title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. From 1.4.0 until 3.7.2, 
  packages/renderer/MdToHtml/rules/katex.ts enables KaTeX's trust option for 
  note content, allowing a note author to place a \href URL into rendered output
  without passing Joplin's normal URL allowlist. On Windows, clicking a link 
  whose target is an attacker-controlled UNC path causes pathExists() to 
  initiate SMB authentication and disclose the current user's NTLMv2 
  challenge-response without a warning. The unfiltered URL can also invoke other
  registered URL handlers, but the credential disclosure through KaTeX \href is 
  the distinguishing demonstrated impact. This issue is fixed in version 3.7.2.
