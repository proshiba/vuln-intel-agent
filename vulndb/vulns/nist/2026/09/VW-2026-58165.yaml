title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  virmidi: Check card index validity at probe\n\nvirmidi driver blindly trusts that
  the given devptr->id value is\nwithin the proper card index range at probe.  It's
  OK for the devices\nthe driver itself creates at the module probe time, but if the
  device\nis bound manually via sysfs interface, this could be -1 as \"none\", and\n\
  this leads to OOB access for index[] and other parameters.\n\nAdd a sanity check
  for the card index and warn/correct it if it's a\nvalue out of the range."
