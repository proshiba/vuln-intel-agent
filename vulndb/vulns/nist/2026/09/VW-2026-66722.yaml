title: froxlor through 2.3.10 disables a user's two-factor authentication 
  immediately upon an unauthenticated-triggerable GET request to the 2FA 
  management page (e.g. /customer_index.php?page=2fa&action=delete), with no 
  confirmation, re-authentication, or CSRF token. The global CSRF middleware 
  only covers POST/PUT/PATCH/DELETE requests, and the session cookie is set to 
  SameSite=Lax, so a cross-site top-level navigation (link click or redirect) 
  carries the victim's session and silently clears type_2fa/data_2fa. Both the 
  customer and admin 2FA handlers are affected. An attacker who lures a 
  logged-in panel user into following a crafted link reduces that account to 
  password-only authentication, which can be chained with a compromised password
  for account takeover. Fixed in 2.3.12.
