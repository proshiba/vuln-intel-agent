title: Horilla is an HR and CRM software. Prior to 1.6.0, the search parameter 
  at /employee/employee-filter-view is reflected by jQuery .html() in 
  employee/templates/employee_nav.html without HTML neutralization. An external 
  attacker can craft and deliver a link that causes JavaScript to execute when 
  an authenticated employee or administrator reaches the employee filter, 
  allowing access to browser-visible session data and actions with the victim's 
  application privileges. This issue is fixed in version 1.6.0.
