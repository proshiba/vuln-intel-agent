title: Keycloak provides a feature called mTLS holder-of-key binding which 
  ensures that a token can only be used by the client that originally requested 
  it by binding it to their digital certificate. A flaw was discovered where the
  new Standard Token Exchange V2 feature does not check for this certificate. 
  This allows an attacker with stolen client credentials to obtain a standard, 
  unrestricted token that bypasses these security protections.
