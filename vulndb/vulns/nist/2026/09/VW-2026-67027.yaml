title: Fleet-maintained app install and uninstall scripts for macOS are 
  generated from Homebrew cask metadata. In manifests generated before 
  2026-08-19, the script generator escaped this metadata at some interpolation 
  sites but not all of them, so cask metadata containing shell metacharacters 
  (for example $(...) command substitution) could be carried into scripts that 
  execute as root on managed macOS hosts. An attacker who could land crafted 
  metadata in an upstream Homebrew cask — without needing any Fleet credentials 
  — could achieve arbitrary command execution as root on managed macOS hosts 
  that install or uninstall the affected Fleet-maintained app; exploitation 
  required the crafted metadata to pass both upstream Homebrew cask review and 
  Fleet's review of the automated ingestion pull request. The fix 
  (fleetdm/fleet#51324) landed in Fleet's ingestion pipeline on 2026-08-19 so 
  that all manifests generated on or after that date escape cask metadata at 
