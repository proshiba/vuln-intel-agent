title: A security vulnerability has been detected in ramon-victor freegpt-webui 
  up to 098db3dfeb41555c2ca9269df0f13e10ec1c35dc. Affected is the function 
  _conversation of the file server/backend.py of the component Backend 
  Conversation API. Such manipulation of the argument model leads to missing 
  authentication. The attack may be launched remotely. The exploit has been 
  disclosed publicly and may be used. This product operates on a rolling release
  basis, ensuring continuous delivery. Consequently, there are no version 
  details for either affected or updated releases. This vulnerability only 
  affects products that are no longer supported by the maintainer.
