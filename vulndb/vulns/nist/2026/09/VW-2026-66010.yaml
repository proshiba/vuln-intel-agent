title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  fix fib6 walker UAF on seq stop\n\nipv6_route_iter_active() treats a walker in FWS_U
  at the table root as\nalready unlinked. fib6_del_route() can move a still-linked
  walker into\nthat same state when the current leaf is the last route at the root,\n\
  so ipv6_route_native_seq_stop() skips fib6_walker_unlink(). The seq\nprivate object
  can then be freed while it remains on\nnet->ipv6.fib6_walkers. A later route deletion
  walks the dangling list\nand uses the freed walker.\n\nUse the list head as membership
  state and reinitialize it when\nunlinking. Keep the existing w->node check so a
  never-started iterator\nwith a zeroed private object is not treated as linked.\n\
  \nThe same stop helper is used by /proc/net/ipv6_route and by the BPF\nipv6_route
  iterator. The BPF show path only widens the race."
