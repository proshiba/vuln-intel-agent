title: "Dancer2 versions before 2.2.0 for Perl serve a layout as a page when an equivalent
  spelling of its path misses the guard in the AutoPage handler.\n\nThe handler compares
  the request path against the layout directory name as text, while the lookup that
  follows canonicalises it. A doubled slash, a dot segment, a percent-encoded slash,
  or a different capitalisation on a case-insensitive filesystem therefore misses
  the guard.\n\nThe handler is off by default, enabled with auto_page. The layout
  wrapping every page is already public, so this discloses one of the application's
  other layouts."
