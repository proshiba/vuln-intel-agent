title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent client use-after-free during NFSv4.0 revoked-state cleanup\n\nnfs40_clean_admin_revoked()
  takes a stateid reference under\nclp->cl_lock, drops nn->client_lock, and calls\n\
  nfsd4_drop_revoked_stid(), which dereferences the stateid's client\nthrough s->sc_client->cl_lock.\
  \  The stateid reference does not pin the\nclient, so a teardown racing the dropped
  lock can free the client\nwhile nfsd4_drop_revoked_stid() is still using it.\n\n\
  This cleanup runs from the laundromat, so a periodic sweep can race\nforce_expire_client()
  driven by a write to the clients/<id>/ctl file.\n\nSkip a client that is already
  expiring and otherwise pin it with\ncl_rpc_users under client_lock before dropping
  the lock, matching\nnfsd4_revoke_states()."
