title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Let driver decide buffer size at AMDKFD_IOC_GET_DMABUF_INFO ioctl\n\namdkfd driver
  needs allocate buffer to return bo metadata to user space. The\nbuffer size is controlled
  by user currently. It is a potential security issue\nthat hostile value (e.g. 2
  GiB) lets any render-group user trigger order-MAX\nallocation/OOM in kernel context.\n\
  \nThis patch first finds bo metadata size. If the size is smaller than user\nprovided
  value drive can safely allocate buffer in kernel space and copy to\nuser space buffer.
  If not, driver will let user know, not allocate and copy.\nUser will redo with new
  buffer in user space.\n\nThis patch lets driver decide buffer allocation size to
  avoid potential hostile\nsize from user space.\n\n(cherry picked from commit f54ce9e8cbd3abe0eda3a285f54dc4f572fe589a)"
