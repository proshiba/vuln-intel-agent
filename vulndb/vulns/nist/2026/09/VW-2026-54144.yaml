title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex:
  Fix race in futex_pivot_pending() during private hash resize\n\nA task performing
  a custom private hash resize can remain blocked in\nuninterruptible sleep indefinitely.\
  \  The hung-task detector reports:\n\n  INFO: task futex-resizer:314 blocked for
  more than 10 seconds.\n  task:futex-resizer state:D stack:14824 pid:314 tgid:312
  ppid:311\n\n  Call Trace:\n   __schedule+0x521/0xf30\n   schedule+0x22/0xa0\n  \
  \ futex_hash_allocate+0x3db/0x490\n   __do_sys_prctl+0x6f5/0xbd0\n   do_syscall_64+0xf9/0x530\n\
  \   entry_SYSCALL_64_after_hwframe+0x77/0x7f\n\n  Kernel panic - not syncing: hung_task:
  blocked tasks\n\nfutex_pivot_pending() allows the resize request to continue when\n\
  either no replacement hash is pending (hash_new == NULL) or the current\nhash reference
  count has reached zero.\n\nAfter the final-reference wake, another futex task can
  complete the\npivot between the two observations:\n\n  T1                      \
  \            T2\n\n  futex_ha"
