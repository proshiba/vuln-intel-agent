title: A security flaw has been discovered in YunaiV/zhijiantianya ruoyi-vue-pro
  up to 2026.08. Affected by this vulnerability is the function 
  validOAuthClientFromCache of the file 
  yudao-module-system/src/main/java/cn/iocoder/yudao/module/system/service/oauth2/OAuth2ClientServiceImpl.java
  of the component OAuth2 Client. The manipulation of the argument redirect_uri 
  results in open redirect. The attack can be launched remotely. The exploit has
  been released to the public and may be used for attacks. The vendor was 
  contacted early about this disclosure but did not respond in any way.
