title: The Qi Addons For Elementor plugin for WordPress is vulnerable to 
  Reflected Cross-Site Scripting via the 's' parameter in all versions up to, 
  and including, 1.11 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. Exploitation requires the Table of Contents widget to be placed
  on a template that renders on the WordPress search-results page (e.g., a 
  sitewide header or footer template) with the 'Limit ToC to Main Page Content' 
  option left at its default value of No, so the widget scans the search-results
  heading that reflects the unsanitized `s` parameter.
