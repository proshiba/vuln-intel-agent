title: "A flaw was found in Red Hat Ansible Automation Platform's automation-\ncontroller.
  The setting that formats the log message emitted for API 4XX errors\nis an administrator-controlled
  Python format-string template that is rendered\nwith a live user object as an argument.
  Because Python string formatting permits\nattribute and item traversal on its arguments,
  an administrator can craft a\ntemplate that walks from the user object into the
  application settings and reads\nthe Django secret key and the database password.
  The formatted message is written\nto a logger that can be forwarded to an external
  log aggregator, whose destination\nis also administrator-controlled, allowing the
  secrets to be sent off the host. An\nauthenticated administrator can thereby obtain
  the master encryption key used to\nprotect all stored credentials and the database
  service password, enabling offline\ndecryption of every stored credential, forgery
  of user sessions, and direct\naccess to the controller database."
