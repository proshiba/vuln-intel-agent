title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  fix reversed sequence option serialization\n\nhton_seq() expects the host-order
  source first and the unaligned\nnetwork-order destination second. The version 1
  sync sender passes these\narguments in reverse for both sequence blocks. This leaves
  24 bytes of the\nkmalloc-backed message unwritten. It may disclose stale heap data
  and\nreplace the live connection sequence state with values read from the\nbuffer.\n\
  \nPass the connection sequence state as the source and the message payload as\n\
  the destination for both blocks."
