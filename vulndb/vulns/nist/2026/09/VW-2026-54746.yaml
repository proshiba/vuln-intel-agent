title: "The ftp and scp tasks of Apache Ant can download files from a remote server.
  A malicious server can provide relative paths that allow it to write outside of
  the dedicated target directory for the download, making it possible to overwrite
  files of the attacker's choice using the permissions of the user running Ant in
  versions prior to Ant 1.10.18. \n\n\n\n\nIn order to exploit this vulnerability,
  the server would either have to be malicious or be subject to a machine-in-the-middle
  attack. Additionally in the case of scp or the ftp task using ftps the server must
  pass the server identity checks performed by the tasks.\n\n\n\n\nFor ftp tasks not
  using ftps a malicious server could act as a machine-in-the-middle to provide malicious
  files.\n\n\n\n\nStarting with Ant 1.10.18 both tasks will prevent writing outside
  of the destination directory by default. An option is available to disable this
  behavior in the unlikely case that the  old behavior is required by existing build
  files.\n\n\n\n\nMitigations:\n\n\n\n\nUse"
