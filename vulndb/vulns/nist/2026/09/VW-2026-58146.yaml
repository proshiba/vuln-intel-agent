title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  iaa - unmap dst before software fallback on decompress\n\nOn a hardware analytics
  error, decompress retries through the software\nfallback, which writes req->dst
  with the CPU while it is still mapped\nDMA_FROM_DEVICE. With SWIOTLB active the
  later dma_unmap_sg() copies the\nstale bounce buffer over req->dst, corrupting the
  result.\n\nUnmap before the fallback runs. The async path unmaps inline; the sync\n\
  path signals the retry with -EAGAIN so iaa_comp_adecompress() runs the\nfallback
  after unmapping."
