title: A flaw was found in Netty's StompSubframeDecoder component. A remote 
  attacker can exploit this vulnerability by sending a specially crafted STOMP 
  frame body without its terminating null byte. This causes the decoder to 
  allocate a ByteBuf (a buffer for bytes) that is never released, leading to a 
  permanent memory leak. Over time, this uncontrolled memory consumption can 
  result in a Denial of Service (DoS) for the application using the affected 
  STOMP codec.
