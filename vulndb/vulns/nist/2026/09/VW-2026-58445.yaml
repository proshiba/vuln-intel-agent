title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix UAF in __kick_flushing_caps() on cf entry freed during unlock\n\nlist_for_each_entry()
  iterates ci->i_cap_flush_list but drops\ni_ceph_lock to send cap messages.  During
  the unlock window,\nhandle_cap_flush_ack() can acquire i_ceph_lock, detach cf entries\n\
  with tid <= flush_tid from the list, release i_ceph_lock, and free\nthem via ceph_free_cap_flush()
  outside any lock.  When the original\nthread reacquires i_ceph_lock and the for-loop
  macro advances via\ncf = list_next_entry(cf, i_list), it dereferences cf->i_list.next\n\
  on freed memory.\n\nThe race timeline:\n\n  __kick_flushing_caps()             \
  \ handle_cap_flush_ack()\n  -----------------------             -----------------------\n\
  \  holds i_ceph_lock        <---\n  iterates to cf (tid=10)\n  prepares FLUSH message\n\
  \  drops i_ceph_lock        <---\n  __send_cap() ── FLUSH(tid=10)\n\t          \
  \                    MDS sends FLUSH_ACK(tid=10)\n                           --->\
  \    "
