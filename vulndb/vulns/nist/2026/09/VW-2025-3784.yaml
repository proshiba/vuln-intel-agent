title: 'A vulnerability was detected in Portabilis i-Educar up to 2.10. Affected by
  this vulnerability is an unknown functionality of the file /intranet/agenda_preferencias.php.
  Performing a manipulation of the argument cod_agenda results in sql injection. The
  attack may be initiated remotely. The exploit is now public and may be used. Upgrading
  to version 2.12 addresses this issue. Upgrading the affected component is advised.
  The vendor confirms: "The reported attack vector was tested against the corrected
  code, and the previously described SQL Injection behavior could no longer be reproduced."'
