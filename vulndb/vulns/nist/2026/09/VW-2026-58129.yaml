title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmack:
  fix cred UAF in smack_file_send_sigiotask()\n\nWhen inspecting the credentials of
  another task, objective credentials\n(->real_cred, accessed with __task_cred())
  must always be used.\n\nAccessing ->cred on a non-current task is forbidden unless
  that task is\nbeing created or destroyed; a task is allowed to change its own ->cred\n\
  pointer with no synchronization, and changing ->cred should only affect the\ncurrent
  syscall.\n\nsmack_file_send_sigiotask() was accessing both sets of credentials:
  First\ntsk->cred, then __task_cred(tsk).\n\nFix it, always access the objective
  credentials here.\n\nI have tested that this bug can lead to a KASAN-reported UAF
  of struct cred\nin smack_file_send_sigiotask(), and that this fix prevents the race."
