title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Validate Read chunk positions before reconstruction\n\nThe RPC/RDMA Read chunk position
  field is supplied by the remote\nclient and stored verbatim in the parsed chunk
  list.\nxdr_count_read_segments() checks only 4-byte alignment; it never\ncompares
  the position against the received inline body length.\n\nIn the single-chunk path,
  svc_rdma_read_complete_one() splits the\nhead and tail kvecs at ch_position. A position
  past the inline\nbody underflows the tail length, exposing adjacent slab memory
  to\nthe upper XDR decoder.\n\nIn the multi-chunk path, svc_rdma_read_multiple_chunks()
  computes\ngap lengths between chunks as unsigned subtractions from\nch_position.
