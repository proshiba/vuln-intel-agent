title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/omap:
  dsi: Do not copy isr table\n\nTo be able to unregister stuff from isrs, the corresponding
  table was\ncopied.  Nobody seems to unregister stuff that way, so it does not help.\n\
  But there are stack-allocated objects passed to these isrs giving chances\nof UAF
  of these objects if irqs are unregistered while they are handled,\nso better do
  not copy that table."
