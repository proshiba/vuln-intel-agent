title: ESP32-audioI2S versions 3.4.4 through 4.0.0 contain a heap-based 
  out-of-bounds read vulnerability in the read_ID3_Header function due to a 
  shadowed length parameter in ID3 synchronized-lyrics processing. Attackers can
  craft malicious MP3 files or HTTP audio streams with oversized frame size 
  declarations to read past allocated buffer boundaries, causing device crashes 
  or exposing adjacent heap memory.
