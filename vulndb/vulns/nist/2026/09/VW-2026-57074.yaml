title: "Potential problem for users of the org.apache.parquet.crypto.keytools package
  in Apache Parquet, versions 1.12 to 1.18. \nThis package enables users to encrypt
  Parquet files via an envelope encryption mechanism that wraps (encrypts) data keys
  via a Key Management Service (KMS). \nOn the reader side, the KMS URL can be application-controlled
  or file-controlled.\nIf the user does not leverage application control for this
  parameter, a file-controlled KMS URL is forwarded to a pluggable KmsClient implementation.\
  \ \nIf the pluggable implementation does not perform host validation, a KMS token
  can be sent to a malicious host set by an attacker in the file.\n\nBefore the problem
  is fixed, users are recommended to leverage application control for KMS URL parameter
  in readers (versions 1.12-1.18).\nAfter the problem is fixed (presumably in version
  1.19), the upgrade will disable file-controlled KMS URL by default. Users of the
  KMS URL parameter \nwill have two options then: leverage application control "
