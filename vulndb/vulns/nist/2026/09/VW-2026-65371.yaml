title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  policy_int make sure list heads are initialized before fail path\n\nIf profile create
  fails before policy_init is complete the list heads\nare not properly initialized
  causing profile_free() sanity checks to\ntrigger the following splat.\n\nAppArmor
  WARN aa_policy_destroy: (((!list_empty(&policy->profiles) && (&policy->profiles)->prev
  != ((void *) 0x122 + (0xdead000000000000UL))))):\nWARNING: security/apparmor/lib.c:509
