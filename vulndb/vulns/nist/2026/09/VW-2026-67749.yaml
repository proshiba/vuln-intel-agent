title: A flaw was found in libsoup. When reassembling fragmented WebSocket 
  messages into a GByteArray, libsoup did not adequately cap total message size 
  against the limits of the underlying buffer type. A remote peer could send 
  fragments that caused size truncation while the implementation still used the 
  full length, leading to heap corruption or a crash.
