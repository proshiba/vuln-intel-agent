title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the HTTP transport accepts 
  requests without a verified user identity and downstream fetcher construction 
  falls back to the operator's globally configured Jira or Confluence 
  credentials. A network client that can reach the MCP endpoint can invoke 
  Atlassian tools as the operator, including read and write operations available
  to that account. The advisory traces the vulnerable input and processing flow 
  through UserTokenMiddleware, AtlassianOpaqueTokenVerifier, _get_fetcher, and 
  streamable-http, which identify the affected entry points, controls, and code 
  paths. This issue is fixed in version 0.22.0.
