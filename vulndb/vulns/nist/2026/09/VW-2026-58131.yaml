title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm:
  tpm_i2c_nuvoton: disable IRQ on wait timeout\n\ni2c_nuvoton_wait_for_stat() enables
  the IRQ before waiting for the\ninterrupt handler to report a status change. If
  the wait times out, or is\ninterrupted before the handler runs, the function returns
  without\nbalancing the enable_irq() call.\n\nDisable the IRQ before leaving the
  failed wait path. Also preserve an\ninterrupted wait's original error code instead
  of converting it to\n-ETIMEDOUT inside the helper."
