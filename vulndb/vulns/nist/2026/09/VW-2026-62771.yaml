title: Many Notes is a Markdown note-taking web application designed for 
  simplicity. Prior to 0.16.0, the ZIP vault import implemented in 
  app/Actions/ProcessImportedVault.php accepts archive filenames containing 
  parent-directory traversal segments. An authenticated user can write arbitrary
  files outside the importing user's vault and into other users' vaults, 
  including overwriting existing files. Disguised SVG content can be placed in 
  another user's vault and execute stored cross-site scripting when the victim 
  opens that vault. This issue is fixed in version 0.16.0.
