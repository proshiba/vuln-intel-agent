title: A weakness has been identified in Yohann0617 oci-helper up to 3.2.4. This
  issue affects the function addCfg of the file 
  src/main/java/com/yohann/ocihelper/service/impl/OciServiceImpl.java of the 
  component OCI Configuration Upload. Executing manipulation of the argument 
  File can lead to path traversal. It is possible to launch the attack remotely.
  The exploit has been made available to the public and could be exploited. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
