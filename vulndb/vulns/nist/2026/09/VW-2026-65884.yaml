title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (asus_rog_ryujin) Validate HID report lengths\n\nrog_ryujin_raw_event() parses response
  headers and payload fields without\nfirst checking that they are present in the
  received report. A short report\ncan therefore make the driver consume uninitialized
  bytes from the HID\ntransport buffer and expose them as sensor values through sysfs.\n\
  \nValidate the response header and the fields used by each response type\nbefore
  parsing them."
