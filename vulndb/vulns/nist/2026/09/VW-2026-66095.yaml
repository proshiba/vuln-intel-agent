title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: mcast: properly convert mglist to rcu\n\nSashiko reported a bug [1] that
  br_multicast_del_port_group unlists the\nport group not using proper rcu helper
  that preserves the next pointer and\nafter that immediately frees the port group
  without waiting for rcu grace\nperiod. The only rcu walker of mglist is br_multicast_list_adjacent()
  and\nit turns out that function has always been buggy because mglist was never\n\
  properly converted to RCU. Fix it by converting it to rcu and moving its\ninitialization
  after eth_addr's. Initializing p->next can use\nRCU_INIT_POINTER because we have
  a barrier from the hlist_add_head_rcu call\nlater, besides we're initializing an
  unpublished structure anyway.\n\n[1] https://netdev-ai.bots.linux.dev/sashiko/#/patchset/20260826014200.362304-1-littleddfu%40gmail.com"
