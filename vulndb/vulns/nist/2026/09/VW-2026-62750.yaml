title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  core: quiesce input in hid_hw_stop() to prevent use-after-free\n\nA driver's probe
  calls hid_device_io_start() to enable input delivery,\nthen fails at a later initialization
  step and unwinds via hid_hw_stop().\nThe unwind frees struct hidraw via hidraw_disconnect()
  while in-flight\nHID reports may still be running on another CPU, dereferencing
  the\nfreed object through hidraw_report_event(). syzbot reports the\nresulting use-after-free
  for the corsair-psu HID driver.\n\nEdward Adam Davis posted a per-driver fix for
  corsair-psu that adds\nan explicit hid_device_io_stop() before hid_hw_stop() in
  the probe\nerror path (\"hwmon: prevent packets from going to driver for probe\"\
  ,\n2026-04-28). Auditing the tree shows 15 drivers call\nhid_device_io_start();
  7 also call hid_device_io_stop() and 8 do not:\n\n  drivers calling hid_device_io_start()
  without a matching\n  hid_device_io_stop() before hid_hw_stop():\n    drivers/hwmon/corsair-p"
