title: "The file write tool in Amazon Kiro IDE versions before 1.0.242 might allow
  remote unauthenticated actors to inject crafted instructions into the agent's context.
  When a user runs the agent in a crafted repository as an untrusted workspace, sending
  any message can cause agent modifications to auto-loaded global configuration paths.\n\
  \n\n\nWe recommend you upgrade to Kiro IDE version 1.0.242 or later. Users who ran
  the agent in an untrusted workspace on an earlier version should also review the
  global Kiro configuration directory (~/.kiro) for entries they did not create."
