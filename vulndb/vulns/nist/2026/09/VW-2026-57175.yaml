title: "Snipe-IT 8.5.0 through 8.6.3 contains an open redirect vulnerability in its
  SAML assertion-consumer endpoint (SamlController::acs, POST /saml/acs). The endpoint
  wrote the RelayState POST parameter directly into Laravel's url.intended session
  key with only CR/LF characters stripped, and LoginController later issued redirect()->intended(),
  which passes an absolute URL through to the Location header unchanged. An unauthenticated
  attacker who induces a user of a SAML-SSO-enabled instance to visit a crafted IdP-initiated
  SSO link can therefore cause the victim's browser to be redirected to an arbitrary
  absolute external URL immediately after a successful authentication, which the advisory
  notes facilitates credential-harvesting phishing. No account on the target instance
  and no compromise of the identity provider are required. Only deployments with SAML
  SSO enabled are affected. Fixed in 8.7.0 (commit d30b73d, PR #19386), which validates
  RelayState via a new Helper::sameOriginUrl check befo"
