title: "Certain KGUARD DVR devices running vulnerable firmware expose a system command
  execution service on all network interfaces without requiring authentication. A
  remote unauthenticated attacker with network access to the affected service can
  execute arbitrary system commands on the device, potentially resulting in complete
  compromise of the DVR.\n\nThe vulnerability is known to have been exploited in the
  wild by the Mirai_ptea (Rimasuta) and Mirai_aurora botnets for malware propagation
  and subsequent DDoS activity. The vulnerability was reported to affect firmware
  dating from 2016, while firmware released after 2017 appears to mitigate the issue
  by restricting the affected service to the localhost interface (127.0.0.1) instead
  of exposing it on all interfaces (0.0.0.0).\n\nThe affected-device list reported
  by Netlab includes many D1004NR, D1008NR, D1016NR, D1104, D1104NR, D1108NR, D1116NR,
