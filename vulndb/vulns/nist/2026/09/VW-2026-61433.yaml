title: "WNC T-Mobile 5G Box IDU router is vulnerable to OS command injection vulnerability.
  The vulnerability exists within the /cgi-bin/portal.cgi endpoint, specifically through
  the cli_cookie POST parameter. The cli_cookie parameter value is directly concatenated
  into a find command string without proper sanitization. This allows a remote, unauthenticated
  attacker to inject and execute arbitrary shell commands as root on the underlying
  operating system.\n\nThis issue has been fixed in firmware version 1.1.0.651412"
