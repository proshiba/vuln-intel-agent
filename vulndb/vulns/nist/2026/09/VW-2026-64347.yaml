title: LightRAG provides simple and fast retrieval-augmented generation. Prior 
  to 1.5.5, _validated_addresses in lightrag/parser/markdown/parser.py evaluates
  the literal resolved address with ipaddress.is_global without consistently 
  classifying an IPv4 address embedded in an IPv6 transition wrapper. A caller 
  who can upload a Markdown or textpack document can supply an external image 
  URL using NAT64 64:ff9b::/96 or an IPv4-compatible form that embeds a 
  loopback, private, or cloud-metadata IPv4 address. On a deployment with 
  compatible NAT64 or DNS64 routing, _download and _build_guarded_opener accept 
  the wrapper and fetch the internal resource, whose body is then ingested. 
  Current interpreter behavior already blocks some RFC 8215 and 6to4 forms, but 
  the fixed guard handles all documented wrappers without becoming more 
  permissive than the standard library. This issue is fixed in version 1.5.5.
