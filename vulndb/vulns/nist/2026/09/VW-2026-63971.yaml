title: Graylog is a free and open log management platform. From 6.3.0 until 
  6.3.14, 7.0.9, and 7.1.4, the view update API for saved searches and 
  dashboards permits a user with edit permission but without entity ownership to
  include a shareRequest that grants owner permissions to an arbitrary account. 
  The selected account can then delete the saved search or dashboard or remove 
  the original owner's access. Graylog Cloud was patched before the advisory was
  published. This issue is fixed in versions 6.3.14, 7.0.9, and 7.1.4.
