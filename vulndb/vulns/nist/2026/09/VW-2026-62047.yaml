title: "Time-of-check Time-of-use (TOCTOU) Race Condition vulnerability in team-alembic
  AshAuthentication allows an attacker holding a leaked magic link to replay its single-use
  token and authenticate as the target subject. A magic link configured with single_use_token?,
  which is the default, is meant to be redeemable exactly once, but nothing serialises
  the token's validity check against its consumption, so concurrent redemptions of
  one token all succeed and each yields a full user token.\n\nSign-in verifies the
  JWT with Jwt.verify/4 and revokes it only afterwards: AshAuthentication.Strategy.MagicLink.SignInPreparation
  revokes in a Query.after_action callback, and AshAuthentication.Strategy.MagicLink.SignInChange
  in an after_transaction hook that runs once the sign-in has already committed. AshAuthentication.TokenResource.Actions.revoke/3
  writes the revocation as an upsert, so a concurrent duplicate revocation silently
  succeeds instead of conflicting and no request ever loses the race.\n\nThis is"
