title: Scoold is a Q&A and a knowledge sharing platform for teams. Prior to 
  1.69.0, users with personal API tokens can retrieve replies from questions in 
  private spaces they cannot access because 
  src/main/java/com/erudika/scoold/api/ApiController.java in 
  ApiController.getPostReplies() does not apply canAccessSpace before returning 
  data from GET /api/posts/{id}/answers. The issue is reachable when 
  scoold.api_user_access_enabled and scoold.api_enabled are true and a token 
  holder knows or enumerates a private question identifier. Under those 
  conditions, the question endpoint can deny access while the answers endpoint 
  returns the private reply bodies, exposing confidential team or project 
  discussions. This issue is fixed in version 1.69.0.
