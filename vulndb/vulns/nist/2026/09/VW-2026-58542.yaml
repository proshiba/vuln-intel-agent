title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  memcg: stop reclaim when a limit update is superseded\n\nkernfs serializes file
  operations only per open file, so separate open\nfiles can update the same memory.high
  or memory.max file concurrently. \nBoth handlers store the new limit before synchronous
  reclaim, but continue\nto use the writer's local target in the reclaim loop.  If
  another writer\nraises or removes the limit, the first writer can continue reclaiming\n\
  toward a stale target.\n\nFor memory.max, this can leave the writer looping indefinitely
  once\nreclaim retries are exhausted.  The OOM path sees sufficient margin under\n\
  the current limit and returns true without killing, while the writer still\ncompares
  usage against its stale target and records another OOM event.\n\nCheck the current
  limit at the start of each reclaim iteration and stop if\nit no longer matches the
  writer's target.\n\nReproducer:\n\nPopulate a cgroup with anonymous memory and disable
  swapping.  Lowe"
