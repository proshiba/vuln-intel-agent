title: SAP NetWeaver Business Client does not perform sufficient validation when
  processing certain locally stored data during application startup. An attacker
  with low privileges on the local system could replace this data with specially
  crafted content. When the application is next launched, the crafted content is
  processed and could lead to arbitrary code execution in the context of the 
  user. This results in a high impact on confidentiality, integrity and 
  availability of the application.
