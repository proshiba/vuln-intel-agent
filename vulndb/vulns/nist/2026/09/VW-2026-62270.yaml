title: "In the Linux kernel, the following vulnerability has been resolved:\n\nm68k:
  nfcon: Do not call console_is_registered() in nfcon_device()\n\nSince 7c2af0f634f1
  (\"tty: tty_io: use console_list_lock for list\nsynchronization\") show_cons_active()
  calls the .device() method under\nthe console_list_lock, but console_is_registered()
  tries to acquire\nconsole_list_lock as well, causing a deadlock.  It should not
  be\nnecessary to check console_is_registered() here since the function\nshould not
  be called in the fist place when the console is not\nregistered."
