title: KubeEdge is an open source system for extending native containerized 
  application orchestration capabilities to hosts at Edge. From 1.21.0 until 
  1.21.2, 1.22.2, and 1.23.1, ConfigUpdateJob processing in 
  edge/pkg/taskmanager/actions/configupdatejob.go concatenates authenticated 
  user-controlled updateFields values into the keadm config-update command and 
  executes it through a system shell. A user with permission to create or modify
  ConfigUpdateJob resources can include shell metacharacters in the complete 
  --set value and cause arbitrary commands to execute on an enrolled target edge
  node with the privileges of the KubeEdge process handling the job. This issue 
  is fixed in versions 1.21.2, 1.22.2, and 1.23.1.
