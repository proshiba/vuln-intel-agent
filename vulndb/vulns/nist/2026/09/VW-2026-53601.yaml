title: A vulnerability was found in NousResearch hermes-agent 0.18.0. This 
  vulnerability affects the function resourceBufferFromUrl of the file 
  apps/desktop/electron/main.ts of the component Electron Main Process. 
  Performing a manipulation results in allocation of resources. The attack may 
  be initiated remotely. copyImageFromUrl() entry point no longer reachable on 
  current main. That function did exist at v2026.8.3 but was removed by 
  v2026.8.19. The modern copy-image path is Electron-native 
  event.sender.copyImageAt().
