title: A flaw has been found in coollabsio Coolify up to 4.1.2. The affected 
  element is an unknown function of the file 
  app/Http/Middleware/CanUpdateResource.php of the component Route-Level 
  Middleware. Executing a manipulation can lead to missing authorization. The 
  attack may be launched remotely. The exploit has been published and may be 
  used. Upgrading to version 4.2.0 is sufficient to fix this issue. This patch 
  is called 39ae16de4248075de8c08f3259114e064b20d52d. It is advisable to upgrade
  the affected component.
