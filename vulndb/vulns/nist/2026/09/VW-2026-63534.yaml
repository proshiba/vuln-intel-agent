  Information Exposure in all versions up to, and including, 2.1.4 due to the 
  'ysleadgen_get_captured_data' AJAX action being accessible to unauthenticated 
  users. This makes it possible for unauthenticated attackers to retrieve all 
  captured form submission data, including personally identifiable information 
  (PII) such as names, email addresses, and message content submitted through YS
  LeadGen forms.
