title: A flaw was found in Quarkus HTTP security. An unauthenticated attacker 
  can exploit a discrepancy in how paths are normalized between the security 
  matcher and HTTP request dispatchers. This allows the attacker to craft a URL 
  that the security matcher considers public, but which is then routed to a 
  protected endpoint, leading to an authorization bypass and potential 
  unauthorized access to sensitive information.
