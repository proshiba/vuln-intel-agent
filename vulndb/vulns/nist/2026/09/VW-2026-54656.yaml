title: "When performing transfers via libcurl’s multi interface, pooled TLS\nconnections
  can outlive their originating easy handles. In OpenSSL 3 provider\nconfigurations,
  libcurl attaches an allocated library context to the easy\nhandle's state and passes
  it to OpenSSL without acquiring an ownership\nreference; destroying the easy handle
  prematurely frees this context while the\nactive connection retains a dangling pointer,
  leading to a heap-use-after-free\nupon subsequent I/O or post-handshake operations."
