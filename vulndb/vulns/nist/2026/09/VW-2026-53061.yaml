title: SVGO, short for SVG Optimizer, is a Node.js library and command-line 
  application for optimizing SVG files. From version 1.0.0 until versions 2.8.4,
  3.3.5, and 4.1.0, the opt-in removeScripts plugin, named removeScriptElement 
  in versions 2 and 3, incompletely filters executable links in 
  plugins/removeScripts.js and lib/svgo/tools.js. The plugin does not recognize 
  namespace-prefixed SVG anchor elements such as svg:a with href or namespaced 
  *:href values, and it does not remove ASCII tab, line-feed, or carriage-return
  characters before checking URL schemes. Browsers remove those characters 
  before parsing a scheme, allowing an executable link to pass the plugin's 
  check. When an application processes attacker-controlled SVG input and serves 
  the result in an active browser context, a victim who activates the surviving 
  link can execute script in the SVG's origin, expose data, modify content, or 
  perform actions as the victim. This issue is fixed in versions 2.8.4, 3.3.5, 
  and 4.1.0.
