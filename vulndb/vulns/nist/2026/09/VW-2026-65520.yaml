title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  quiesce DMA before freeing resources\n\npdsc_teardown() frees DMA buffers but does
  not disable bus mastering,\nleaving the device able to perform DMA after the buffers
  are freed.\nThis can lead to use-after-free if the device writes to freed memory.\n\
  \nAdd pci_clear_master() to pdsc_teardown() to disable bus mastering\nbefore freeing
  resources, ensuring all DMA is quiesced.\n\nAdd pci_set_master() to pdsc_setup()
  to re-enable bus mastering,\nwhich is needed for the firmware recovery path since
  pdsc_teardown()\nnow disables it."
