title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  qgroup: fix a wrong length calculation in qgroup_free_reserved_data()\n\nIn that
  function, we round down the start position and round up the\nending position.\n\n\
  But during the calculation of @len, we use \"round_up(start + len,\nsectorsize)\"\
  , which is the rounded up end position, not the rounded up\nlength.\n\nWhich results
  a much larger length, and later we are still using\n\"start + len\", which is completely
  incorrect.\n\nFix it by declaring a local @aligned_start and @aligned_len and use
  them\ninstead."
