title: "mH-DEVELOPER smart home module is vulnerable to Denial of Service due to uncontrolled
  resource consumption. The Express bodyParser is configured with a 250 MB limit for
  JSON and URL-encoded request bodies. An authenticated attacker on the LAN can send
  large request bodies that exhausts buffers in RAM, causing out-of-memory conditions
  and crashing the fh-node process, resulting in denial of service. The successful
  attack depends on the current memory usage of the device which is not under full
  control of the attacker. Critically, due to CVE-2026-82930 all endpoints can be
  queried unauthenticated, so any user on LAN can perform this attack.\n\n\nThis issue
  was fixed in version 3.0.30"
