title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: max17040: synchronize work cancellation on suspend\n\nmax17040_work() requeues
  itself after every poll. cancel_delayed_work()\nonly cancels a pending instance
  and does not wait for a callback that is\nalready running.\n\nIf system suspend
  races with the polling callback, the callback can\ncontinue accessing the fuel gauge
  and requeue itself after the suspend\ncallback returns.\n\nUse cancel_delayed_work_sync()
  to ensure polling is quiesced before\nsuspend completes."
