title: "OS command injection in the advanced-rule parser of ConfigServer Security
  & Firewall allows a remote attacker who controls a configured allow/deny feed to
  execute arbitrary commands as root, due to insufficient validation of feed-supplied
  rule data.\n\nThe vulnerability affects versions of the software originally distributed
  by ConfigServer, as well as versions of the WebPros-maintained fork that contain
  the vulnerable code. WebPros has addressed the vulnerability in version 16.30. Other
  forks or independently maintained versions of ConfigServer Security & Firewall (CSF)
  may also be affected and should be evaluated independently."
