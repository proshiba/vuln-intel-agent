title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  amd: isp4: release partial allocations in isp4if_alloc_fw_gpumem()\n\nisp4if_alloc_fw_gpumem()
  allocates several GPU memory pools in sequence.\nIf one of them fails, it jumps
  to error_no_memory and returns -ENOMEM\nwithout releasing the pools that were already
  allocated, leaking them.\n\nRelease the already-allocated pools before returning.
  isp4if_gpu_mem_free()\nis a no-op on pools that were not allocated, so calling\n\
  isp4if_dealloc_fw_gpumem() here safely frees exactly the pools that\nsucceeded.\n\
  \nisp4if_gpu_mem_free() previously logged an error for a NULL entry, which\nis a
  normal case during partial-allocation cleanup, so make it silent."
