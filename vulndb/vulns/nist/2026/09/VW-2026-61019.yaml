title: The Bold Page Builder plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'shortcode_content' parameter of the 
  bt_bb_shortcode shortcode in all versions up to, and including, 5.9.6. This is
  due to a bypassable security filter (bt_bb_save_pre) that can be circumvented 
  via null byte injection, combined with insufficient output sanitization of 
  base64-decoded content in the bt_bb_raw_content shortcode handler. This makes 
  it possible for authenticated attackers, with Contributor-level access and 
  above, to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses an injected page.
