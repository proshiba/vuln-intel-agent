title: Klever-Go is the Go implementation of the Klever blockchain protocol. 
  Prior to 1.7.20, the native marketplace function core/kapp/market/market.go 
  Buy does not check IsClaimed before accepting a bid. A seller can use the 
  Claim seller-accept branch to settle a resting-bid auction while leaving the 
  claimed order loadable with a future EndTime and stale CurrentBid and 
  CurrentBidder values. A later bidder can submit a higher bid, be debited, and 
  cause the previous bidder to receive a refund even though the NFT has already 
  been delivered. Because Claim and CancelOrder reject the later bidder when 
  IsClaimed is true, the later bidder cannot obtain the NFT or recover the 
  funds. This issue is fixed in version 1.7.20.
