title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  llcp: read llcp_sock->local under the socket lock in getsockopt\n\nnfc_llcp_getsockopt()
  read llcp_sock->local before lock_sock(sk) and\nthen dereferenced the cached pointer
  inside the locked region.\nllcp_sock_bind() assigns and clears llcp_sock->local
  under the same\nsocket lock, dropping the last reference on its error path. A\n\
  getsockopt() racing an in-flight bind() can observe the pointer, block\non lock_sock(),
  and then dereference a freed nfc_llcp_local once bind()\nhas unwound.\n\nMove the
  llcp_sock->local read and the NULL check inside the\nlock_sock(sk) region so bind()
  cannot mutate or free the pointer between\nthe load and the use."
