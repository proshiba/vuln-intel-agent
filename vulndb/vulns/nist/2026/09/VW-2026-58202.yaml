title: "In the Linux kernel, the following vulnerability has been resolved:\n\nslip:
  fix use-after-free in sl_sync()\n\nslip_devs[] stores bare net_device pointers and
  takes no reference on\nthem.  sl_sync() and sl_alloc() walk that table from slip_open()
  under\nrtnl_lock(), while an entry is dropped by sl_free_netdev(), which\nsl_setup()
  installs as dev->priv_destructor.\n\npriv_destructor is called from netdev_run_todo(),
  which deliberately\nruns with the RTNL semaphore released so that it can sleep while
  waiting\nfor the device refcount to drop:\n\n\t/* Snapshot list, allow later requests
  */\n\tlist_replace_init(&net_todo_list, &list);\n\n\t__rtnl_unlock();\n\t...\n\t
  \tif (dev->priv_destructor)\n\t\t\tdev->priv_destructor(dev);\t/* slip_devs[i] =
  NULL */\n\t\tif (dev->needs_free_netdev)\n\t\t\tfree_netdev(dev);\n\t\t...\n\t\t
  /* Free network device */\n\t\tkobject_put(&dev->dev.kobj);\n\nSo rtnl_lock() does
  not serialise slip_open() against the teardown at\nall.  sl_sync() can load slip_devs[i]
  while the entry is still published\nand deref"
