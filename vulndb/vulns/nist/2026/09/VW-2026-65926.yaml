title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rkvdec: bound HEVC tile loops and PPS id to the array capacity\n\ncompute_tiles_uniform()
  and compute_tiles_non_uniform() loop over\nnum_tile_columns_minus1 + 1 / num_tile_rows_minus1
  + 1 entries, and\nassemble_hw_pps() writes one COLUMN_WIDTH / ROW_HEIGHT register
  per tile\nand indexes priv_tbl->param_set[] by pic_parameter_set_id, all taken from\n\
  the untrusted PPS. Use the bounded v4l2_hevc_pps_num_tile_columns() /\nv4l2_hevc_pps_num_tile_rows()
  helpers for the tile loops, and bail out of\nassemble_hw_pps() before indexing priv_tbl->param_set[]
  with an\nout-of-range pic_parameter_set_id, so the writes stay within the hardware\n\
  tables."
