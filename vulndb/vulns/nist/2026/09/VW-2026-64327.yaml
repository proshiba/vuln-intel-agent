title: "MISP ships with PHP's phar stream wrapper registered in both its web entry
  point and its console entry point. \n\nThe phar stream wrapper causes PHP to treat
  a phar archive as a directory, which has two security consequences:  \n\n - any
  filesystem operation on a caller-influenced path that resolves to a phar archive
  triggers an implicit unserialize() call, creating a deserialization sink;\n - a
  relocated application root can reach executable code inside an uploaded phar file,
  enabling arbitrary code execution as the web user.\n\n\n\n\nNo component of MISP,
  the vendored CakePHP framework, or any runtime-loaded library reads or constructs
  phar archives. The wrapper therefore serves no legitimate purpose in the MISP runtime
  and exists solely as an available primitive for an attacker who can influence a
  filesystem path argument."
