title: "In the Linux kernel, the following vulnerability has been resolved:\n\nppp_async:
  drop the errored frame instead of resetting its headroom\n\nppp_receive_nonmp_frame()
  prepends a two-byte direction tag before running\nthe pass/active BPF filters:\n\
  \n\t*(__be16 *)skb_push(skb, 2) = htons(PPP_FILTER_INBOUND_TAG);\n\nNothing on the
  receive path guarantees those two bytes of headroom. The\nframe-error path in ppp_async's
  process_input_packet() resets a reused skb's\nheadroom to zero while claiming to
  restore it to a freshly allocated state -\nbut a fresh skb from dev_alloc_skb()
  carries NET_SKB_PAD:\n\n\terr:\n\t\tif (skb) {\n\t\t\t/* make skb appear as freshly
  allocated */\n\t\t\tskb_trim(skb, 0);\n\t\t\tskb_reserve(skb, - skb_headroom(skb));\n\
  \t\t}\n\nap->rpkt still points at that skb, so the next frame is reassembled into
  it\nwith no headroom at all. A peer that sends a bad-FCS frame followed by one\n\
  beginning ff 03 then leaves a single byte of headroom by the time the filter\ntag
  is pushed, which lands one byte below skb->h"
