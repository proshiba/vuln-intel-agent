title: Capgo.app before 12.264.5 does not enforce upload expiry or build 
  lifecycle state in the /build/upload/:jobId TUS proxy endpoint. When a native 
  build request is created, an upload_expires_at timestamp (one hour) and a 
  'pending' status are stored in build_requests, but the upload proxy loads only
  app_id, owner_org, builder_job_id, and upload_path and checks only the 
  app.build_native permission before forwarding POST, PATCH, and HEAD requests 
  to the internal builder. As a result, an authenticated caller holding 
  app.build_native permission for the app can continue writing to the build 
  upload session after the stored expiry has passed or after the build has moved
  beyond the upload phase, unless the separate builder service independently 
  rejects the request. The issue is fixed in 12.264.5.
