title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disallow interpreter fallback for gotox insn\n\nThe interpreter does not recognize
  the BPF_JMP|BPF_JA|BPF_X insn, which\nis used for insn_array map. Thereafter, it
  would hit the BUG_ON() in\n___bpf_prog_run() at run time.\n\n[    2.563726] BPF
  interpreter: unknown opcode 0d (imm: 0x0)\n[    2.564557] ------------[ cut here
  ]------------\n[    2.565206] kernel BUG at kernel/bpf/core.c:2349!\n[    2.565882]
  Oops: invalid opcode: 0000 [#1] SMP PTI\n\nSet jit_required as true when insn_array
  map is used in the prog in\norder to disallow interpreter fallback for gotox insn
  in\ncore.c::__bpf_prog_select_runtime()."
