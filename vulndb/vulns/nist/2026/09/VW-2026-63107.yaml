title: An out-of-bounds write vulnerability exists in some of the Ethernet 
  switches because of improper validation of the username field length during 
  Web login processing. This may allow a remote attacker to submit a specially 
  crafted overly long input, triggering a buffer overflow that can cause the 
  authentication process to crash and result in a Denial of Service (DoS) 
  attack.
