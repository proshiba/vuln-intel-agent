title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  fq_pie: clamp default quantum to avoid signed overflow\n\nfq_pie_init() sets q->quantum
  = psched_mtu(qdisc_dev(sch)) without\nclamping. A device with a huge MTU (e.g. dummy
  with max_mtu == 0\naccepting MTU 2147483634) makes psched_mtu() return 0x80000000,
  which\noverflows the signed flow->deficit to INT_MIN in fq_pie_qdisc_dequeue(),\n\
  causing an infinite loop and soft lockup. Emulate fq_pie_policy which\nis already
  bounded to [1, 1 << 20]; clamp the default to [256, 1 << 20].\n256 matches fq_codel's
  floor and is a sane minimum for a DRR quantum.\n\nConditions to recreate the bug:
  a device whose MTU (plus\nhard_header_len) wraps psched_mtu() into the sign bit
  (e.g. a dummy\ndevice with max_mtu == 0 accepting MTU 2147483634). Requires\nCAP_NET_ADMIN
  in a user namespace."
