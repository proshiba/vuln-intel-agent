title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  magicmouse: prevent unbounded recursion in magicmouse_raw_event()\n\nmagicmouse_raw_event()
  handles DOUBLE_REPORT_ID (0xf7) packets, which pack\ntwo touch reports into one,
  by splitting the packet and calling itself on\neach half. The only guard against
  runaway recursion is a \"size < 1\" check,\nwhich stops zero-sized calls but does
  not bound the recursion depth.\n\nA malicious HID device that matches this driver
  can send a report starting\nwith DOUBLE_REPORT_ID and filled with the sequence [0xf7,
  0x00]. Each level\nconsumes two bytes and recurses on the remainder, so an incoming
  report of\nup to HID_MAX_BUFFER_SIZE (16 KiB) drives roughly 8000 nested calls.
  That\neasily exhausts the 16 KiB kernel stack, leading to a stack overflow: a\n\
  panic with CONFIG_VMAP_STACK, or memory corruption without it.\n\nA double report
  only ever wraps two normal reports; it is never\nlegitimately nested. Refuse to
  re-enter the DOUBLE_REPORT_ID case"
