title: Horilla is an HR and CRM software. From 1.0.0 until 1.6.0 and 2.0.0, the 
  get_mail_preview handlers in recruitment/views/actions.py and 
  employee/not_in_out_dashboard.py render a user-controlled body at 
  /recruitment/get-mail-preview/ and /employee/get-employee-mail-preview with 
  the full request object in the Django template context. An authenticated user 
  with a valid CSRF token can use template attribute traversal to read 
  request.user.password, request.META, and related-user attributes, exposing 
  password hashes, personal data, and server request metadata. Django template 
  restrictions prevent arbitrary code execution through this primitive, so the 
  demonstrated impact is information disclosure and possible offline password 
  cracking or account compromise. This issue is fixed in versions 1.6.0 and 
  2.0.0.
