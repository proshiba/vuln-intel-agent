title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  media: ipu7: fix pm_runtime refcount leak in ipu7_resume()\n\nipu7_resume() calls
  pm_runtime_get_sync() before resuming the device.\nIf the runtime PM resume fails,
  the usage count remains incremented, but\nthe error path returns without dropping
  the reference.\n\nUse pm_runtime_resume_and_get() instead, which balances the usage
  count\non failure and avoids the leak. Keep returning 0 on error, as resume\ncallbacks
  should not propagate failures to the PM core, matching the\nbehaviour of the ipu6
  driver."
