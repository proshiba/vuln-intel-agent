title: "SolidInvoice is an open-source invoicing platform. Prior to version 3.0.1,
  the `DataGrid` LiveComponent deserializes a `context` prop value using PHP's `unserialize()`
  after receiving it from the client. Because the prop is marked `writable: true`,
  an authenticated attacker can supply an arbitrary PHP serialized payload. Version
  3.0.1 fixes the issue."
