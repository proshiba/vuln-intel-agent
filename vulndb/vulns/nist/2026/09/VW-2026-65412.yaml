title: Improper neutralization of special elements in data query logic in the 
  cache lock implementation of the MongoDB integration for Laravel can cause a 
  caller-supplied lock owner value to be evaluated as an aggregation expression 
  rather than as a literal value. An authenticated user who can influence the 
  owner value an application uses when acquiring or restoring a lock may take 
  over or prematurely expire a lock held by another process, which can lead to 
  duplicated or conflicting operations.
