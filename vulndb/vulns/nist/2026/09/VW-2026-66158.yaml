title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbonding:
  alb: fix uninitialized transport header access in alb_determine_nd()\n\nalb_determine_nd()
  uses icmp6_hdr(skb) to inspect ICMPv6 headers.\nHowever, in xmit paths (e.g. packets
  sent via AF_PACKET / raw sockets\nor forwarded packets), skb->transport_header is
  not guaranteed to be\ninitialized. While pskb_network_may_pull() ensures the packet
  data is\nlinear starting from the network header, it does not set or adjust the\n\
  transport header offset.\n\nDereferencing icmp6_hdr(skb) can therefore access out-of-bounds
  memory.\n\nFetch the icmp6hdr directly after ipv6hdr following pskb_network_may_pull(),\n\
  and reload ipv6hdr in case pskb_may_pull() reallocated skb->head.\nAlso remove the
  unused bond argument from alb_determine_nd()."
