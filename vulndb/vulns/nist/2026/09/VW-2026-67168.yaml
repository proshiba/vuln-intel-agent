title: Improper Restriction of XML External Entity Reference in Apache Roller 
  6.1.5 allows a weblog administrator to read files readable by the Roller 
  process and reach internal network addresses by importing a crafted OPML 
  document, because the bookmark import parser does not disable external entity 
  resolution. No non-default configuration is required; the import is reached 
  through the administrator bookmark-import action. Users are recommended to 
  upgrade to Apache Roller 6.1.6 or later, which uses a hardened parser that 
  disables external entities and document type declarations.
