title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau/uvmm:
  fix NULL deref unwinding an OP_MAP_SPARSE op\n\nEach bind_job_op is zeroed by kzalloc_obj()
  in bind_job_op_from_uop(),\nand the OP_MAP_SPARSE case in nouveau_uvmm_bind_job_submit()
  only creates\na region, so op->ops stays NULL for a successfully processed sparse
  map.\n\nIf a later op in the same job fails, the reverse unwind loop revisits that\n\
  op and calls drm_gpuva_ops_free(&uvmm->base, op->ops) unconditionally.\ndrm_gpuva_ops_free()
  dereferences its argument right away\n(list_for_each_entry_safe on &ops->list),
  so a NULL op->ops oopses. The\npath is reachable by any render-node fd holder, since
  NOUVEAU_VM_BIND is\nDRM_RENDER_ALLOW.\n\nGuard the free with IS_ERR_OR_NULL(), as
  nouveau_uvmm_bind_job_cleanup()\nalready does for the identical free."
