title: "Baserow 2.3.3 contains a SQL injection vulnerability in the index() formula
  function. A low-privileged authenticated user who can create or modify formula fields
  can provide an undocumented fourth argument that is treated as a SQL template and
  interpolated directly into a PostgreSQL expression.\n\n\n\nThe vulnerable expression
  is executed when Baserow recalculates formula field values. Because the generated
  SQL runs through Baserow's database connection, the injected SQL executes with the
  privileges of the Baserow PostgreSQL role rather than the permissions of the authenticated
  application user.\n\n\n\nThis issue affects Baserow: 2.3.3."
