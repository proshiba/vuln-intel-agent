title: "Specifying tblproperties('avro.schema.url'=' http://...' ) or with a 'file:///'
  URI on a table in Impala 2.0.0 to 4.5.1 on all platforms allows an attacker to trigger
  a GET request to internal endpoints they may not have access to but that Impala
  does and the response my be exposed via parsing error messages.\nUsers are recommended
  to upgrade to version 4.5.2, which fixes this issue."
