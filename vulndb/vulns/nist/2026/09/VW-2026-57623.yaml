title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to versions 7.0.16 and 
  8.0.5, Suricata's HTTP/2 decompression path could grow the decompressed 
  response-body buffer without an effective upper bound. A crafted HTTP/2 DATA 
  payload using a high compression ratio, such as gzip, deflate, or brotli 
  compressed data, could cause Suricata to allocate excessive memory while 
  decompressing the payload. Versions 7.0.16 and 8.0.5 contain a fix. As a 
  workaround, disable HTTP2.
