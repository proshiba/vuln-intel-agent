title: A security vulnerability has been detected in a2aproject a2a-python up to
  1.1.3. This affects the function _dispatch_notification of the file 
  src/a2a/server/tasks/base_push_notification_sender.py of the component Push 
  Notification Sender. The manipulation of the argument push_info.url leads to 
  server-side request forgery. Remote exploitation of the attack is possible. 
  Upgrading to version 1.1.4 is able to mitigate this issue. It is suggested to 
  upgrade the affected component.
