title: "An improper authorization check in Apache DolphinScheduler allows an authenticated
  user to use the batch-copy and batch-move endpoints to operate on workflows in projects
  for which they lack the required permissions. This may allow the user to copy or
  move workflows from unauthorized projects.\n\n\n\nThis issue affects Apache DolphinScheduler:
  before 3.4.3.\n\n\n\nUsers are recommended to upgrade to version 3.4.3, which fixes
  the issue."
