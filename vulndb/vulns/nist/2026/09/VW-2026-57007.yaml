title: "The Payment Plugins for PayPal WooCommerce WordPress plugin before 2.0.26
  does not verify that a stored payment method belongs to the user attaching it, allowing
  any authenticated user, such as a subscriber, to bind another customer's stored
  card to their own account and then charge or delete it.\nExploitation requires the
  attacker to already know the payment provider's identifier for the victim's stored
  method, which the Payment Plugins for PayPal WooCommerce WordPress plugin before
  2.0.26 does not expose."
