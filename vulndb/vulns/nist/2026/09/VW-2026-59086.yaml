title: "Description\n\nA submitted topology carries two lists of blobstore keys, `dependency_jars`
  and `dependency_artifacts`,\nwhich the client fills in after uploading the corresponding
  blobs. Nimbus performed no validation of their\ncontents on the submission path,
  yet acts on them in two places.\n\nDuring cleanup of a finished topology, Nimbus
  deletes the keys named in those lists, and the deletion is\nperformed as the Nimbus
  subject, for which the blobstore short-circuits its ACL check. A submitter who\n\
  listed a key belonging to another topology, such as its `-stormjar.jar`, could therefore
  cause\nthat blob to be deleted when their own topology was cleaned up.\n\nSeparately,
  on acquiring leadership a Nimbus compares the dependency keys of all active topologies
  against\nthe blobstore contents and surrenders leadership if any is missing. A single
