title: froxlor versions before 2.2.5 fail to validate newline characters in 
  subdomain redirect URLs, allowing authenticated customers to inject arbitrary 
  nginx or Apache configuration directives. Attackers can supply URLs containing
  literal newlines that are written verbatim into vhost config files during cron
  rebuild, enabling web server configuration corruption, denial of service, or 
  hijacking of HTTP responses across hosted domains.
