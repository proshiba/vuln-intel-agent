title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  fix resume-vs-remove race\n\nIf the user issues the resume ioctl and the remove
  ioctl at the same\ntime, it may be possible that the device is resumed after it
  is suspended\nin __dm_destroy. The result is that the table is destroyed without\n\
  calling the postsuspend method.\n\nDm targets expect that they may be removed only
  after the postsuspend\nmethod method was called. If we break this expectation, it
  can cause\nmisbehavior in various targets. For example - in the dm-integrity target,\n\
  the reboot notifier is not unregistered, leading to use-after-free.\n\nFix this
  bug by refusing to resume if the device is being destroyed."
