title: WWBN AVideo through commit 9c39d8c8 contains an incomplete authentication
  bypass in encryptPass.json.php that allows unauthenticated attackers to 
  compute valid HMAC tokens using the public site URL and current time. 
  Attackers can forge authentication tokens by computing hash_hmac with the 
  site's base URL as the key and submit arbitrary passwords to receive encrypted
  hashes, enabling offline precomputation attacks against stolen password 
  databases.
