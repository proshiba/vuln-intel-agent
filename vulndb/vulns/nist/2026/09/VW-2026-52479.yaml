title: A flaw has been found in ICP DAS UA-2200 and UA-5200 up to 20260704. The 
  affected element is the function ArmAngstromInstructionSet of the file 
  /CGI?RestApi=SetHostname. Executing a manipulation of the argument 
  ParameterArray can lead to command injection. The attack can be executed 
  remotely. The exploit has been published and may be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
