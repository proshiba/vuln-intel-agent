title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Handle VNCR TLB invalidation race with vcpu_put() VNCR unmapping\n\nWhile
  VNCR TLB invalidation always occurs under the MMU lock,\nvcpu_put() doesn't, while
  it unmaps the VNCR page.\n\nThe problem is that the invalidation evaluates vncr_tlb::cpu
  to\ndecide whether an unmapping needs to take place (cpu != -1) before\nperforming
  it. On the other hand, this_cpu_reset_vncr_fixmap()\nunconditionally unmaps if L1_VNCR_MAPPED
  is set.\n\nThese two obviously can race, with a TOCTOU pattern on the TLBI\npath,
  and a BUG_ON() on the vcpu_put() path. And the two can end-up\ncalling vncr_fixmap(-1),
  with extra lethal effects.\n\nMove the reset of vncr_tlb::cpu to -1 to a common
  function, and make\nthis update atomic so that only a single thread can reset the
  field\nand perform the corresponding unmap. The vcpu_put() still need to\nunconditionally
  unmap the current VNCR to close another ugly race.\n\nFinally, the assignment of
  vncr_tlb::cp"
