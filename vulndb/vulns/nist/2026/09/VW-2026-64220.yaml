title: A vulnerability was determined in dgtlmoon changedetection.io up to 
  0.60.7. This impacts the function static_content of the file 
  changedetectionio/flask_app.py of the component visual_selector_data. 
  Executing a manipulation of the argument filename can lead to path traversal. 
  It is possible to launch the attack remotely. The exploit has been publicly 
  disclosed and may be utilized. Distinct from CVE-2026-25527, which fixed a 
  different parameter (group) in the same function. The vendor was contacted 
  early about this disclosure but did not respond in any way.
