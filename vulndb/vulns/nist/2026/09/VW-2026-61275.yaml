title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: keyop: use mmu_lock to read gmap->asce\n\nEvery other dat_* consumer in this
  file (kvm_s390_get_skeys,\nset_skeys, get_cmma_bits, set_cmma_bits, MEM_CLR_CMMA,\n\
  kvm_s390_fixup_prefix, kvm_test_age_gfn, kvm_age_gfn) reads\nkvm->arch.gmap->asce
  *inside* the mmu_lock read-side. keyop is the only\noutlier.\n\ngmap->asce is mutated
  under write_lock(mmu_lock) by gmap_set_limit()\nand keyop might use a stale asce
  value for walking as KVM_S390_KEYOP\nand KVM_S390_VM_MEM_LIMIT_SIZE can run concurrently.
  This can result\nin memory corruption."
