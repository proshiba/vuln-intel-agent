title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix slab-out-of-bounds in nilfs_direct_propagate after truncation\n\nShuangpeng
  Bai reported that KASAN detected a slab-out-of-bounds error\nin nilfs_direct_propagate()
  during testing.\n\nAnalysis revealed that after truncating a file, a node block
  immediately\nbelow the B-tree root was not deleted.  Instead, it remained in the
  B-tree\nnode cache in a dirty state.  The log writer subsequently detected this\n\
  block and incorrectly invoked nilfs_direct_propagate() on it, which is\ndesigned
  to handle only data blocks in direct mapping.\n\nB-tree nodes in the cache are managed
  by virtual block numbers, and their\nlogical keys typically exceed the range expected
  by direct mapping.\nConsequently, processing such a node as a direct mapping entry
  triggers\na slab-out-of-bounds access.\n\nThe root cause is that when a B-tree mapping
  collapses into a direct\nmapping during truncation, an intermediate node block pointed
