title: AVideo through c3edcc274c389816d434acadac07ee78eaf330c1 uses 
  cryptographically weak uniqid() values for RTMP publish keys in 
  LiveTransmition, reducing key entropy to approximately one million 
  possibilities per creation second. Attackers who know the channel creation 
  time can brute-force the five-digit microsecond component to forge valid 
  stream keys and broadcast content as the channel owner.
