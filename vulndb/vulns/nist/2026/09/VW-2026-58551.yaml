title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fix out-of-bounds write when null terminating a label vec\n\naa_vec_unique() null
  terminates at vec[n - dups] when VEC_FLAG_TERMINATE\nis passed. If the components
  are all distinct no duplicates are dropped,\ndups is 0 and the terminator goes to
  vec[n], so the caller has to provide\nroom for n + 1 entries.\n\naa_label_strn_parse()
  sets up its vector with vec_setup(profile, vec, len,\ngfp) and then calls aa_vec_unique(vec,
  len, VEC_FLAG_TERMINATE), but\nvec_setup() does not reserve the terminator entry.
  Up to LOCAL_VEC_ENTRIES\nit uses the local array of LOCAL_VEC_ENTRIES pointers,
  above that it\nallocates exactly len pointers. The terminator therefore lands one
  entry\npast the end of the local array when len is LOCAL_VEC_ENTRIES, and one\n\
