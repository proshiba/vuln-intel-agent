title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  fdp: bound the device-reported read length and fix an skb leak\n\nfdp_nci_i2c_read()
  takes the next packet length from two device-supplied\nbytes and never validates
  it. The value is a u16 used as the\ni2c_master_recv() count into a 261-byte on-stack
  buffer: a malicious,\ncounterfeit or malfunctioning controller (or an i2c bus interposer)
  can\ndrive it far past the buffer for a stack out-of-bounds write that\nclobbers
  the canary and return address, or below the minimum frame size\n(directly, or by
  truncating the computed sum) so the header/LRC strip\nand the next length read run
  past a short receive. Reject a length\noutside [FDP_NCI_I2C_MIN_PAYLOAD, FDP_NCI_I2C_MAX_PAYLOAD],
  as a\ncorrupted packet already is, and force resynchronization.\n\nThe same loop
