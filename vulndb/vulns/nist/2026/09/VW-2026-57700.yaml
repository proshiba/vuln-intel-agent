title: Tesseract is an open source OCR engine. In version 5.5.3 and earlier, 
  RecodedCharID::DeSerialize in src/ccutil/unicharcompress.h validates length_ 
  but accepts negative code_ values from a crafted .traineddata recoder 
  component. UnicharCompress::ComputeCodeRange in src/ccutil/unicharcompress.cpp
  can consequently produce code_range_ equal to zero, after which SetupDecoder 
  indexes is_valid_start_ with the negative code on a size-zero vector. The 
  resulting out-of-bounds bit write uses a large wrapped index and reliably 
  causes a wild-address crash or allocation failure on the default LSTM engine. 
  No fixed release is available as of this review.
