title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark bpf_btf_find_by_name_kind() as sleepable\n\nWhen bpf_btf_find_by_name_kind()
  finds a type in module BTF, it\nreturns a new BTF object fd through __btf_new_fd().
  This reaches\nanon_inode_getfd(), which can sleep while allocating or expanding
  the\ncurrent task fd table.\n\nThe helper prototype does not set might_sleep, so
  the verifier allows\nthe helper in non-sleepable contexts such as BPF timer callbacks.
  The\nfd allocation can then sleep in softirq context and install the fd into\nthe
  interrupted task.\n\nMark the helper as sleepable. This preserves calls from the
  main body\nof a sleepable syscall program while rejecting calls from its\nnon-sleepable
  regions."
