title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  llcp: avoid userspace overflow on invalid optlen\n\nnfc_llcp_getsockopt() casts
  optval to (u32 __user *) for put_user(), so\nthe kernel always stores 4 bytes regardless
  of the caller-supplied\noptlen. The existing min_t(u32, len, sizeof(u32)) only clamps
  the length\nreported back to userspace; it does not constrain the store. A call
  with\noptlen < 4 therefore writes past the user buffer, violating the\ngetsockopt(2)
  contract for all five supported optnames.\n\nReject any call with optlen < sizeof(u32)
  up front. 'len' is int, so a\nplain size comparison would promote a negative optlen
  to size_t and slip\npast the check; an explicit 'len < 0' test is added first to
  catch\nnegative values before the size compare."
