title: CrewAI before fb2323b offers a Python blocklist approach that operates at
  the wrong level of abstraction, a different vulnerability than CVE-2026-2275. 
  Import-time blocking of module names does not address the availability of 
  Python's complete object graph. For example, calling ctypes.CDLL(None) loads 
  the C library without relying in any import statements. In other words, a 
  within-process sandbox cannot merely account for the import system and instead
  must account for the complete runtime of the Python interpreter.
