title: "Improper verification of cryptographic signature vulnerability in Apache Syncope.\n\
  \n\n\nWhen SRA is configured for OAuth 2.0 without JWKS set URI assigned, an attacker
  can forge arbitrary JWTs to impersonate any user identity and permissions, gaining
  full access to services proxied by SRA.\n\nThis issue affects Apache Syncope: from
  3.0.0-M0 through 3.0.16, from 4.0.0-M0 through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\
  \n\n\nUsers are recommended to upgrade to version 4.0.8 / 4.1.3, which fix this
  issue."
