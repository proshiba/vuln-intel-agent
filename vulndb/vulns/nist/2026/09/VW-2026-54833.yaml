title: A security flaw has been discovered in light0011 cms 
  c774dce31c6df0055568a8d5c53d964d99be199d/f72cf46f601efb2a0618c3814cc2f61380b38930.
  Affected by this issue is the function Upload::upload of the file 
  ThinkPHP/Library/Think/Upload.class.php. Performing a manipulation results in 
  unrestricted upload. The attack is possible to be carried out remotely. The 
  exploit has been released to the public and may be used for attacks. This 
  product adopts a rolling release strategy to maintain continuous delivery. 
  Therefore, version details for affected or updated releases cannot be 
  specified. The project was informed of the problem early through an issue 
  report but has not responded yet.
