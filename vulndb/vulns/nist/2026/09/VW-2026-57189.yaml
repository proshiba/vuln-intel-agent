title: Snipe-IT before 8.7.0 fails to validate username case sensitivity during 
  SAML authentication, allowing attackers to authenticate as different users by 
  registering IdP accounts with accent or case variants of victim usernames. 
  Attackers can exploit the default utf8mb4_unicode_ci database collation to 
  bypass username matching and achieve account takeover through federated login 
  paths including SAML, LDAP, and OAuth.
