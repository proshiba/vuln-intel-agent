title: "Authentication Bypass by Capture-replay in ZenHive mpp allows an attacker
  holding a captured subscription activation credential to charge the payer repeatedly.\n\
  \nThe payer signs a Tempo KeyAuthorization over the chain id, key type, key id,
  expiry, limits and scopes only, with nothing tying it to the challenge that prompted
  it. MPP.Methods.Tempo.KeyAuthorization.verify/3 in lib/mpp/methods/tempo/key_authorization.ex
  pins each of those signed fields against the subscription request, and the access
  key it pins is a static per-endpoint server key, so one signed authorization verifies
  against every challenge the server issues for the same subscription terms. MPP.Methods.Tempo.Subscription.activate/4
  deduplicates activations by challenge id, so presenting the captured credential
  under a fresh challenge produces a different dedup key, claim_activation succeeds,
  and the subscription transaction is built and broadcast again. Each replay charges
