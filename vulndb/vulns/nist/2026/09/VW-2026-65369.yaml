title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/secretmem:
  properly account locked pages\n\nsecretmem accounts folios by treating memory as
  if it were mlock()'d and\nthus limited by the RLIMIT_MEMLOCK limit.\n\nHowever the
  folios are unevictable and remain so until the inode is\nevicted, eliminating usual
  mlock() semantics - mapping folios then\nunmapping them does not clear their unevictable
  state, since it depends on\nAS_UNEVICTABLE, not PG_mlocked.\n\nA user can therefore
  easily work around the RLIMIT_MEMLOCK limit - simply\nmap then unmap and VmLck no
  longer counts the secretmem range.  Worse,\nfolios are not accounted in the process's
  RSS, meaning the OOM killer\nwon't know to kill the process.\n\nRepeatedly mapping/unmapping
  (or forking) can then result in the\nconsumption of all available system memory
  with unevictable folios and\ncause system instability.\n\nA secretmem fd can be
  passed between processes and over fork so a\nper-process limit simply does not make
  sense, so f"
