fixed_versions:
- 'AVEVA recommends that organizations evaluate the impact of these vulnerabilities
  based on their operational environment, architecture, and product implementation.
  Customers using affected product versions or affected PIMBoards project files should
  take the following actions to mitigate the risk of exploit: Apply AVEVA Pipeline
  Integrity Monitor 2025 SP1 P2 Security Update and migrate old project files. For
  project files that cannot be migrated (e.g. backups or transient copies), evaluate
  the risk of potential password leakage from these files and implement stricter read
  access controls to protect these unsafe files.'
- 'Important: PIMBoards Project Files migration from older versions to AVEVA Pipeline
  Integrity Monitor 2025 SP1 P2 is one-way due to the changes in password hashing
  algorithms and end-user managed encryption keys.'
- Require AVEVA Pipeline Integrity Monitor PIMBoards users to change their 
  passwords.
