title: "The CompressionFilter class uses ZLib to deflate and inflate data sent and
  received. When we inflate incoming data, the filter does not control the resulting
  size, and create a buffer no matter what.\n\nSome compressed data may have a compression
  ration greater than 1 thousand, leading to an exhaustion of the application memory,
  as we don't control the deflated size.\n\n\n\n\nThe fix adds such a control by allowing
  the application developer to provide a fixed size limit, which when reached throws
  an exception. It also allows the user to provide a compression ratio that should
  not be exceeded, protected the application from small inflated files that inflate
  in gigantic files, but with a grace limit for the resulting size (1Mb) to avoid
  false positive (like a very small file inflating with a high ratio, but resulting
  with a acceptable size, like a few thousands bytes)\n\n\n\n\nFor application using
  this feature, it is highly recommended to create the CompressionFilter and to pass
