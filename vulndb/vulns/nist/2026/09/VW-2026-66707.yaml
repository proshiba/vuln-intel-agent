title: Adminer 6.0.0 through 6.0.1, when the official ClickHouse driver plugin 
  (plugins/drivers/clickhouse.php, rewritten in 6.0.0) is loaded, is vulnerable 
  to pre-authentication server-side request forgery. An unauthenticated attacker
  can submit auth[driver]=clickhouse with auth[server] set to an arbitrary URL 
  (for example http://127.0.0.1:18089), causing the Adminer server to issue an 
  HTTP POST containing 'SELECT version()' to that host. In rootQuery(), if the 
  target returns a status outside 200-299 (other than 401/403), the raw HTTP 
  response body is assigned to the connection error and rendered on the login 
  page, so the attacker receives the full response body of the internal service.
  This enables internal network/port reconnaissance and disclosure of sensitive 
  information contained in internal error pages (stack traces, internal 
  hostnames, file paths, configuration identifiers). Fixed in Adminer 6.0.2.
