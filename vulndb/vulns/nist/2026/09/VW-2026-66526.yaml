title: OpenClaw (npm package 'openclaw') before 2026.8.1 does not apply the 
  originating sender's global or per-agent toolsBySender policy when handling 
  outbound attachments. A sender that has been explicitly denied filesystem read
  tools can still cause a known local file to be read and returned via a 
  final-response media directive or a message attachment, disclosing local file 
  contents to an admitted requester whose agent turn did not include the read 
  tool. Exploitation requires knowledge or derivation of a useful host path and 
  a delivery flow that accepts local attachments. The issue is fixed in version 
  2026.8.1.
