title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Don't dereference trace_event_file in deferred trigger free\n\nThe enable_event
  trigger defers trace_event_put_ref() to the\ntrigger free kthread, but the trace_event_file
  can already be freed\nwhen the instance is removed.\n\nKeep the trace_event_call
  directly in enable_trigger_data so the\ndeferred free does not access the freed
  trace_event_file."
