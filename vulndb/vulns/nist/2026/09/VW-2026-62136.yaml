title: "pgAdmin 4's File Manager save_file endpoint, which backs saving from the Query
  Tool and ERD, validated the requested path with Filemanager.check_access_permission()
  and then opened the file for writing with a plain open() call. CVE-2026-7819 had
  previously hardened the separate file upload path by opening its target with O_NOFOLLOW,
  so that the kernel refuses to follow a symbolic link at the final path component,
  but save_file was left on an unprotected open(). A symbolic link already present
  when the check ran was rejected by the check itself; the remaining exposure was
  a link substituted at the final path component in the interval between the check
  and the write, at which point the write followed the link and landed outside the
  user's storage directory, creating or overwriting an arbitrary file as the operating-system
