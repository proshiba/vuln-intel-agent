  can run into the following\nscenario, as observed by our testing:\n\n - a station
  interface is connected on some channel\n - the P2P-Device does a remain-on-channel
  (ROC) on that channel\n - the ROC ends, and the P2P-Device is removed from the binding,\n\
  \   but the phy_ctxt pointer is left around as a PHY cache so we\n   don't need
  to recalibrate to the channel again and again in\n   case it's not shared\n - a
