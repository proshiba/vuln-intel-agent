title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ipa: fix stalled modem TX queue after runtime resume\n\nipa_start_xmit() unconditionally
  stops the TX queue before calling\npm_runtime_get(), relying on the wake scheduled
  by runtime resume\n(ipa_modem_wake_queue_work()) to restart it once power is ACTIVE.\n\
  But that work is queued from within the runtime resume callback,\nbefore the device's
  power state reaches RPM_ACTIVE, so it can run\nwhile the device is still RPM_RESUMING.\
  \  The wake is then consumed\ntoo early: the transmit it restarts stops the queue
  again,\npm_runtime_get() returns -EINPROGRESS without arranging any future\nwake
  (deferred_resume exists only for RPM_SUSPENDING), and after the\nresume completes
  nothing is left to wake the queue.  Transmit stalls\npermanently: packets pile up
  in the qdisc behind the stopped queue,\nthe device runtime-suspends, and since the
  netdev registers no\nndo_tx_timeout the watchdog never fires.  Observed on SM7635\n\
