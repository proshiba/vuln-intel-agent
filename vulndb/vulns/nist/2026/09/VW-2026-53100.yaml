title: WWBN AVideo contains a path traversal vulnerability in the API 
  get_api_login_code endpoint that allows unauthenticated attackers to delete 
  arbitrary .log files by supplying directory traversal sequences in the code 
  parameter. Attackers can exploit this to destroy audit logs and probe for file
  existence on the server, with the vulnerability enabling both file deletion 
  and information disclosure about the filesystem.
