title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau/uvmm:
  fix premature region free on failed OP_UNMAP_SPARSE\n\nIn nouveau_uvmm_bind_job_submit()'s
  OP_UNMAP_SPARSE arm, op->reg is set\nfrom nouveau_uvma_region_find(), which only
  looks the region up and takes\nno reference; a region's sole reference is its membership
  in\nuvmm->region_mt. Two failure paths leave op->reg set: the -ENOENT check\nwhen
  the region is busy, and the drm_gpuvm_sm_unmap_ops_create() failure.\nThe sibling
  nouveau_uvmm_sm_unmap_prepare() failure just below clears\nop->reg; these two do
  not.\n\nunwind_continue steps back one op, so the failing op is skipped by the\n\
  unwind loop and its op->reg stays set. nouveau_uvmm_bind_job_cleanup()\nthen enters
  its if (op->reg) branch and calls nouveau_uvma_region_remove()\nand nouveau_uvma_region_put()
  on it, dropping the tree's sole reference\nand freeing a region this job never created.
  The comment above the\ncleanup loop documents the broken invariant: op->reg "
