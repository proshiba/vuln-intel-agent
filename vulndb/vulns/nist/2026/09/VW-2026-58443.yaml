title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  reject export_targets ranks >= CEPH_MAX_MDS in mdsmap decode\n\nMDSMap export_targets
  entries are monitor controlled. check_new_map()\nuses each entry as a bit number
  in a fixed stack bitmap, so a rank\noutside the protocol namespace can make set_bit()
  write past the end of\nthe array.\n\nReject ranks outside CEPH_MAX_MDS while decoding
  the map. Do not\nvalidate against possible_max_rank here because maps may legitimately\n\
  reference ranks beyond a temporarily reduced max_mds."
