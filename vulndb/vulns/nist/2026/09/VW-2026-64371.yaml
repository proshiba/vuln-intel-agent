title: Softaculous Virtualizor before 3.2.9 (Patch 9) and 3.0.0 contains an 
  authorization bypass vulnerability in the billing module handler that allows 
  unauthenticated remote attackers to modify any tenant's account balance by 
  supplying crafted act and from_billing_module parameters to the admin panel 
  dispatcher. Attackers can send a POST request with arbitrary uid and balance 
  values in the billing_data field to trigger an unauthenticated parameterized 
  UPDATE against the users table, enabling account balance manipulation and 
  potential automated service suspension for targeted accounts.
