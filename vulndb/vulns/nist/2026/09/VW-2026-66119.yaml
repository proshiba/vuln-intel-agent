title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  spectrum_ptp: Fix napi_gro_receive() call from GC workqueue context\n\nCurrently
  mlxsw_sp1_ptp_ht_gc_collect() is run from the PTP\ngarbage-collection workqueue,
  rather than the NAPI poll context. For any\nunmatched PTP entries carrying an SKB,
  it calls\nmlxsw_sp1_ptp_unmatched_finish() -> mlxsw_sp1_ptp_packet_finish(). For\n\
  ingress packets, this calls mlxsw_sp_rx_listener_no_mark_func(). The end\nof that
  function is the following:\n\n    skb->protocol = eth_type_trans(skb, skb->dev);\n\
  \    napi_gro_receive(mlxsw_skb_cb(skb)->rx_md_info.napi, skb);\n\nThe napi pointer
  is one that was placed in the SKB control block when the\ntrapped packet was received
  in the NAPI context. Later, when the GC reaps\nthe unmatched entry (up to MLXSW_SP1_PTP_HT_GC_TIMEOUT
  later), the call to\nnapi_gro_receive() mutates the NAPI instance's GRO list, which
  is unsafe\nif the poll is running concurrently on another CPU.\n\nIn mlxsw_sp1_ptp_ht_gc_collect"
