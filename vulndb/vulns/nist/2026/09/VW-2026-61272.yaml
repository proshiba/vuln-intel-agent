title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Make VNCR invalidation participate in MMU invalidation retry\n\nA VNCR TLB
  invalidation can occur on one vcpu while another vcpu is\nfaulting in this same
  page. Without correctly handling this, we can\nend up with the following scenario:\n\
  \n- vcpu A walks the PTs to translate VNCR\n- before vcpu A is able to grab the
  MMU lock to insert the TLB,\n  vcpu B updates the S1 PTs with an invalid entry,
  and issues\n  a TLBI S1E2 for this VA\n- vcpu A inserts the TLB for something that
  is now invalid\n\nThis isn't a new problem, and we manage S2 by having the MMU notifier\n\
  to bump up mmu_invalidate_seq on invalidation so that the fault can be\nreplayed.\n\
  \nWe can perform something similar here, and extend invalidate_vncr_va() to\nupdate
  the same counter, clearly indicating that the context has\nchanged under our feet.
  This is safe as the invalidation always happen\nwhile holding the MMU lock for write,
  and that we sample the sequence"
