title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: pegasus: don't rely on id table pointer arithmetic\n\nThe current code is broken
  when dynamic ID is involved; in such cases\nusb_device_id parameter of probe lives
  on the heap and the pointer\narithmetic will get an index that is wildly out of
  bound. Instead of\nkeeping a side table for additional information, use driver_info
  field of\nthe usb_device_id.\n\nThe dynamic ID parsing code needs to be updated
  for this; convert it to\njust write to the reserved entry for dynamic ID and remove
  the weird loop."
