title: Plate is a rich-text editor with AI and shadcn/ui. Prior to 53.3.11, and 
  in the discontinued 54.0.0-beta.0 through 54.0.0-beta.1 builds, Plate core 
  HTML deserialization APIs parse supplied HTML strings in the active document. 
  When an application passes untrusted or cross-user HTML to these APIs, certain
  HTML attributes can trigger browser behavior before the HTML is converted into
  editor nodes. This can allow attacker-controlled script to execute in the 
  consuming application's origin when another user loads the deserialized 
  content. This issue is fixed in version 53.3.11.
