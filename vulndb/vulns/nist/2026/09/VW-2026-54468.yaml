title: The Abandoned Cart Pro for WooCommerce plugin for WordPress is vulnerable
  to Privilege Escalation in all versions up to, and including, 10.7.1. This is 
  due to missing capability checks and nonce verification on multiple AJAX 
  actions including wcap_save_connector_settings, wcap_send_manual_email, 
  wcap_abandoned_cart_info, and wcap_change_manual_email_data. This makes it 
  possible for authenticated attackers, with subscriber-level access and above, 
  to modify SMTP connector settings to route administrator recovery emails 
  through an attacker-controlled server and intercept auto-login links to gain 
  full administrative access. The plugin's auto-login feature must be enabled, 
  which is the default configuration.
