title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  s2255: check firmware size before reading trailing marker\n\ns2255_probe() reads
  a 4-byte marker and version from the last 8 bytes\nof the firmware blob (fw->data[fw_size
  - 8] and [fw_size - 4]). If the\nfirmware file is shorter than 8 bytes, fw_size
  - 8 underflows and the\naccess reads out of bounds. Validate the firmware size before
  indexing."
