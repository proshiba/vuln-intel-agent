title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex:
  Prevent rcuwait use-after-free during requeue PI\n\nOn PREEMPT_RT, FUTEX_CMP_REQUEUE_PI
  can trigger a KASAN report\n(slab-out-of-bounds) in futex_requeue_pi_complete()
  invocation of\nrcuwait_wake_up().\n\nThe futex_q used by futex_wait_requeue_pi()
  is allocated on the waiter's\nstack. An early wakeup can race with a PI requeue
  as follows:\n\n        waiter                          requeue task\n        ------\
  \                          ------------\nfutex_wait_requeue_pi()\n  futex_do_wait()\n\
  \    schedule()\n                                       futex_requeue\n        \
  \                                 futex_proxy_trylock_atomic()\n               \
  \                            futex_requeue_pi_prepare()\n                      \
  \                      Q_REQUEUE_PI_NONE -> Q_REQUEUE_PI_IN_PROGRESS\n* timeout/
  signal wakes waiter *\n  futex_requeue_pi_wakeup_sync()\n   Q_REQUEUE_PI_IN_PROGRESS
  -> Q_REQUEUE_PI_WAIT\n                            "
