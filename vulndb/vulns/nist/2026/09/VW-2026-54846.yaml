title: LibreNMS before 26.8.0 contains an authentication bypass vulnerability in
  the REST API that allows unauthenticated attackers to access protected 
  endpoints by sending numeric values instead of string tokens. Attackers can 
  exploit MySQL type coercion by sending small integers like 0 through 9 to 
  match token hashes, gaining access to API functionality including device 
  credentials and administrative features that enable remote code execution 
  through alert templates.
