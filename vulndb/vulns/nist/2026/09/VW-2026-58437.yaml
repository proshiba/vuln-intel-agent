title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  do not repeat ceph_trim_dentries() if no progress possible\n\nceph_cap_reclaim_work()
  re-queues itself for as long as\nceph_trim_dentries() returns -EAGAIN, which happens
  whenever a lease\nwalk exhausts its `nr_to_scan` budget.  This creates a busy loop
  that\nconsumes CPU without making any progress when there is nothing to\nreclaim:
  with no cap pressure (`count==0`) and every scanned lease\nstill valid, each pass
  runs the full scan budget down to zero and\nreturns `-EAGAIN`, only to be queued
  again immediately.\n\nThe dir-lease walk made this worse.  When `expire_dir_lease`
  is\n`false` (i.e. we have no intention of reclaiming dir leases),\n__dir_lease_check()
  returned `TOUCH` for every valid lease.  `TOUCH`\nmoves the dentry to the tail of
  the list and resets `di->time` via\n__dentry_dir_lease_touch(), so a walk over N
  valid leases pointlessly\nrewrote the list, refreshed the timestamps (preventing
