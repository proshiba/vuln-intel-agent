title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Reject non-SCSI SRB on status IOCB fast path\n\nqla2x00_status_entry()
  filters out non-TYPE_SRB entries and the\nSRB_NVME_CMD, SRB_BIDI_CMD and SRB_TM_CMD
  types, then falls through to a\nSCSI fast path that assumes the command is an SRB_SCSI_CMD.
  The first\nthing on that path, qla_chk_edif_rx_sa_delete_pending(), and the\nsubsequent
  handling both evaluate GET_CMD_SP(sp), i.e. sp->u.scmd.cmd.\n\nThe srb u union overlays
  the SCSI command pointer with other command\nlayouts (bsg_job, iocb_cmd). If firmware
  delivers an unexpected\nSTATUS_TYPE IOCB for a non-SCSI handle, sp->u.scmd.cmd can
  read as a\nnon-NULL garbage pointer, bypassing the NULL checks in\nqla_chk_edif_rx_sa_delete_pending()
  and at the cp == NULL test, and\nleading to a wild pointer dereference.\n\nReject
  any SRB whose type is not SRB_SCSI_CMD before entering the fast\npath. The outstanding_cmds
  slot is left untouched so a genuinely\nnon-SCSI command still co"
