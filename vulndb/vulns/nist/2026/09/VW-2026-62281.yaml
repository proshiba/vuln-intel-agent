title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  free preauth sessions on connection teardown\n\nSMB3.1.1 multichannel binding preserves
  the preauthentication hash in a\npreauth_session between the NTLM negotiate and
  authenticate requests.\nThe binding NTLM negotiate allocates this object and returns\n\
  STATUS_MORE_PROCESSING_REQUIRED. If the client disconnects before it sends\nthe
  authenticate request, neither the authenticate nor error cleanup paths\nfree the
  object.\n\nRelease any remaining preauthentication sessions when tearing down the\n\
  connection. Initialize the list when allocating the connection so that this\ncleanup
  is safe regardless of the negotiated dialect."
