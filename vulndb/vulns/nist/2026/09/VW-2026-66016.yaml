title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/amd_node:
  Fix PCI device reference counting in amd_smn_init()\n\nThe local \"root\" pointer
  is a temporary variable used during the device\nsearch. Therefore, refcount related
  to the search iterators should be cleaned\nup after the search is complete.\n\n\
  Use the __free() cleanup macro to ensure the refcount is decremented when the\n\
  temporary pointer goes out of scope.\n\nAdditionally, increment the refcount when
  caching a root pointer. This ensures\nthe in-use refcount is separate from the temporary
  search refcounting.\n\nFinally, drop the redundant \"root = NULL\" before the second
  search loop. The\npci_get_class() iterator always decrements the refcount of its
  \"from\"\nargument, so the first loop can only fall through with \"root\" already
  NULL."
