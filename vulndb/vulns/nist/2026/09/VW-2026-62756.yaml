title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/bridge:
  synopsys: dw-dp: Support unregistering the AUX channel\n\nThe DisplayPort AUX channel
  gets initialized and registered during\ndw_dp_bind(), but it is never unregistered,
  which may lead to resource\nleaks and/or use-after-free.\n\nAdd the missing dw_dp_unbind()
  function to allow the users of the\nlibrary to handle the required cleanup, i.e.
  unregister the AUX adapter."
