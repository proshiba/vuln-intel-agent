title: A stored Cross-Site Scripting (XSS) vulnerability in the notification 
  template functionality of the endpoint /ocsreports/?function=notification. A 
  user with administrator privileges can input malicious HTML content which is 
  subsequently stored and displayed without proper sanitisation when other 
  administrators access the template customisation view, allowing JavaScript 
  code to be executed within the application’s security context and potentially 
  compromising the sessions of other users with administrative privileges.
