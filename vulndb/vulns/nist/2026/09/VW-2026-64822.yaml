title: "Initialization of a resource with an insecure default vulnerability in Apache
  Tomcat Native enabled insecure options by default  including ALLOW_CLIENT_RENEGOTIATION,
  NO_EXTENDED_MASTER_SECRET, IGNORE_UNEXPECTED_EOF and ALLOW_NO_DHE_KEX.\n\n\n\nThis
  issue affects Apache Tomcat Native: from 2.0.0 through 2.0.15, from 1.3.0 through
  1.3.8. Earlier unsupported versions may also be affected.\n\n\n\nUsers are recommended
  to upgrade to version 2.0.16 or 1.3.9, which fix the issue."
