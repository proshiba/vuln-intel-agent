title: A security flaw has been discovered in Trusted Domain Project OpenDKIM up
  to 2.11.0. The impacted element is the function dkim_process_set of the file 
  dkim.c of the component Tag Tokenizer. Performing a manipulation results in 
  use of less trusted source. The attack may be initiated remotely. The exploit 
  has been released to the public and may be used for attacks. The vendor was 
  contacted early about this disclosure but did not respond in any way.
