title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: pcie: null RX pointers after free\n\nWhen iwl_pcie_tx_init() fails after
  RX init, nic init unwinds via\niwl_pcie_rx_free().\n\nThe freed RX members stayed
  non-NULL on the live transport object,\nso later teardown or retry could touch stale
  RX state.\nSet rx_pool, global_table, rxq, and alloc_page to NULL after free\nto
  make repeated cleanup and retry paths safe."
