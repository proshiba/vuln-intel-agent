title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  fix NULL deref in NIX TM tree debugfs read path\n\nrvu_dbg_nix_tm_tree_display()
  dereferences pfvf->sq_ctx without\nchecking whether the SQ context has been allocated.
  Reading\n/sys/kernel/debug/octeontx2/nix/tm_tree for a NIX LF whose transmit\nqueues
  are not set up triggers a kernel oops.\n\nGuard the read path the same way rvu_dbg_nix_tm_tree_write()
  already\ndoes and return -EINVAL with a seq_file message when sq_ctx is NULL."
