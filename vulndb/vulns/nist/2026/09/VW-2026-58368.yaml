title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-io:
  clone the source bio instead of copying its biovec\n\nFor DM_IO_BIO requests, do_region()
  built each destination bio by walking\nthe source bio's biovec and re-adding the
  pages one at a time, tracking\nthe remaining transfer in sectors. The vector lengths
  are byte granular\nand need not be sector aligned (e.g. a misaligned O_DIRECT buffer
  split\nacross pages), so the sector-based accounting could lose a sub-sector\nfragment:
  to_sector() truncated the remainder and the outer loop spun\nforever submitting
  empty bios, hanging the I/O.\n\nThere is no need to rebuild the biovec at all. The
  destination reads into\n(or writes from) exactly the same pages as the source bio,
  so the bio can\nsimply clone the source's biovec with bio_alloc_clone() and remap
  it to\nthe target device. The clone inherits the source's iterator and alignment,\n\
