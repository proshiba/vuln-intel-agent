title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  fix SMI event cross-process information leak\n\nkfd_smi_ev_enabled() skips the suser
  privilege check when pid=0.\nPROCESS_START, PROCESS_END, and VMFAULT events are
  emitted with\npid=0 while carrying another process's PID and command name, so any\n\
  /dev/kfd user in the render group can monitor all GPU workloads.\n\nPass the target
  process PID into kfd_smi_event_add() for these events\nso the existing per-client
  filter restricts delivery to the owning\nprocess or CAP_SYS_ADMIN subscribers."
