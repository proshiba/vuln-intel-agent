title: "In the Linux kernel, the following vulnerability has been resolved:\n\nDrivers:
  hv: vmbus: Skip VMBus module cleanup for non-nested root partition\n\nThe VMBus
  module initialization function, hv_acpi_init(), currently\ndoes nothing when running
  in the root partition and root is not nested\nin another VM. But the initialization
  function reports success, so the\nVMBus module is indeed loaded. VMBus functionality
  is not actually\nneeded, but the VMBus module must be loaded so that hv_vmbus_exists()\n\
  can answer correctly. Furthermore, the mshv_root dependency on the\nVMBus module
  is needed as described in the commit message for\n840b740a35bf (\"mshv: Add conditional
  VMBus dependency\").\n\nLoading the VMBus module without actually initializing it
  causes\nfailures if the module should later be unloaded. The module unload code\n\
  tries to clean up things that were never initialized, resulting in\nmemory faults
  and a panic.\n\nFix this by having VMBus module exit function perform the same\n\
  check for non-nested root"
