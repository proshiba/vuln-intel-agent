title: Joomla Extension - ordasoft.com - Unauthenticated SQL Injection in 
  Vehicle Manager (Free) < 6.5.8 - site/vehiclemanager.php reads the order_field
  and order_direction sort parameters at three separate anonymous-reachable 
  frontend entry points (category listing, search, and the all-vehicles listing)
  through a sanitizing function that applies real escaping, but the value is 
  then placed into an unquoted ORDER BY clause, where escaping has no protective
  effect.
