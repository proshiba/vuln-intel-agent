title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  meson: Keep link pointers valid on realloc failure\n\nmeson_card_reallocate_links()
  grows the DAI link and private data\narrays with two consecutive krealloc() calls
  and updates the owner\npointers only after both calls have succeeded.\n\nA successful
  krealloc() may move the data: it frees the old block and\nreturns a new one. When
  that happens for the link array and the second\nkrealloc() then fails, card->dai_link
  still points to the block that\nkrealloc() already freed, and the error path frees
  the new block too.\nThe probe error path then calls meson_card_clean_references(),
  which\ndereferences card->dai_link and kfree()s it again, resulting in a\nuse-after-free
  and a double free.\n\nCommit card->dai_link and card->num_links right after the
  first\nkrealloc() succeeds, so the pointer always refers to a valid allocation\n\
  that meson_card_clean_references() can walk and free. krealloc() with\n__GFP_ZERO
  zero-initializes the adde"
