title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Zero queue and stack outputs on lock failure\n\nQueue and stack pop/peek helpers
  accept an uninitialized output buffer\nbecause the verifier expects the helper to
  initialize it. The empty-map\nerror path clears the buffer, but a failed lock acquisition
  returns\n-EBUSY without writing it.\n\nClear the output before returning -EBUSY
  so BPF programs cannot observe\nuninitialized stack contents after a failed helper
  call."
