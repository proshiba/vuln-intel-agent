title: "Issue summary: The OpenSSL QUIC server, when configured to not preform address\n\
  validation, can be forced to count incoming packets multiple times in its\nunvalidated
  credit computation, leading to a violation of the RFC 9000\nunvalidated connection
  amplification limit of 3 times the amount of data\nreceived.\n\nImpact summary:
  A remote attacker able to spoof packets to a server using the\nOpenSSL QUIC implementation
  might use the server for an amplification of\na DDoS attack.\n\nCWE: CWE-440: Expected
  Behavior Violation \n\nDescription: OpenSSL's QUIC stack, when operating as a server,
  enforces client\naddress validation (RFC 9000, Section 8), to confirm the peer address
  is not\nused for a traffic amplification attack.  If this feature is disabled on
