title: Hirschmann HiOS Switch Platform devices contain a denial-of-service 
  vulnerability in the integrated web server due to missing validation of 
  HTTP(S) content. A remote unauthenticated attacker can send a specially 
  crafted HTTP(S) request to a specific endpoint that is processed incorrectly, 
  causing the device to perform an unintended reboot and resulting in a 
  temporary denial-of-service condition. This vulnerability has been addressed 
  in versions 07.1.12, 08.7.10, 09.0.13, 09.3.03, 10.3.08, and 10.5.00.
