title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Take trace_array reference when opening options file\n\nThe options files do not
  take the trace_array reference for the options\nthey represent. This could cause
  a use-after-free kernel crash if one of\nthese files is opened by one task and another
  task removes the instance\nthat the option is for. Because it doesn't take a reference
  upon opening,\nit will not stop the removal which will free the options descriptor
  that\nis being used.\n\nAs the options are somewhat dynamic in their creation at
  boot up, each\nfile represents a flag in the trace_array. The trace_array has an
  array of\nindexes to represent each of these flags that is stored in the\ntrace_flags_index
  array. The address of the index array element is used to\npass to the inode->i_private
  pointer. Then that element is read which\nholds the index (which represents the
  flag) and then the index is used to\ncalculate the trace_array descriptor from its
  trace_flags_in"
