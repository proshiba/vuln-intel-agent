title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  retry verity reads for not-uptodate Merkle folios\n\nbtrfs_read_merkle_tree_page()
  can find a folio in the mapping that is not\nuptodate.  After taking the folio lock,
  the current code treats that state\nas a read error and returns -EIO.\n\nThat can
  make a previous transient read failure sticky.  If the failed read\nleft a not-uptodate
  folio in the mapping, later callers find that folio and\nfail instead of retrying
  the read.\n\nKeep the existing page-cache insertion and locking order, but retry
  the\nMerkle item read when a not-uptodate folio is found in the mapping.  Also\n\
  unlock the folio when read_key_bytes() fails so that a later caller can\nlock it
  and retry the read."
