title: Snipe-IT before 8.7.0 fails to properly enforce the viewKeys 
  authorization gate in CSV export and API index endpoints, allowing 
  authenticated users with only licenses.view permission to access product keys.
  Attackers can download all license keys in bulk via CSV export or validate 
  candidate keys through API response discrepancies without needing the viewKeys
  permission.
