title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  bla: fix freeing of claims on meshif deletion\n\nWhen the mesh interface is getting
  deleted, then\nbatadv_bla_del_backbone_claims() (via batadv_bla_purge_backbone_gw())
  could\nmake sure that all claims gets removed. But this function is only executed\n\
  when bat_priv->bla.claim_hash is not NULL. And since batadv_bla_free() is\nalways
  setting it to NULL before it is (indirectly) called, it was never\nactually executed.\n\
  \nBut the batadv_bla_purge_claims() -> batadv_handle_unclaim() is at the\nmoment
  too fragile because the BLA code is not handling the rehashing in\nbatadv_bla_update_orig_address().
  The stored backbone address doesn't have\nto be the one actually used for the hash
  bucket selection during the\ninitial adding of the backbone. The batadv_handle_unclaim()
  can therefore\nfail to find the respective backbone for the unclaim and then stop
