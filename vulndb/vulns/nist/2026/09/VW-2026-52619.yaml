title: 'xmldom is a pure JavaScript W3C standard-based (XML DOM Level 2 Core) DOMParser
  and XMLSerializer module. Prior to @xmldom/xmldom versions 0.8.14 and 0.9.11, and
  in xmldom version 0.6.0 and earlier, Document.createElement(tagName) stores an unvalidated
  element name and XMLSerializer.serializeToString() emits that name verbatim. The
  requireWellFormed: true path did not validate the element qualified name or synthesized
  xmlns:PREFIX declaration, so attacker-controlled tag names could inject attributes,
  elements, or processing instructions into serialized XML or HTML and could cause
  cross-site scripting when browser-consumed. The unchecked values violate the XML
  QName constraint, and default serialization and creation-time createElement() behavior
  remain permissive. This issue is fixed in @xmldom/xmldom versions 0.8.14 and 0.9.11;
  no fixed version is available for xmldom.'
