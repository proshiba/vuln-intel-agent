title: In wsl-pro-service before 0.1.19ubuntu3, the service component which runs
  as root inside each WSL instance attaches the instance to Ubuntu Pro by 
  executing the pro client with the Ubuntu Pro token passed as a command-line 
  argument (pro attach <token>). On systems where /proc is mounted without 
  process-hiding mitigations (such as hidepid), which is the default in WSL, an 
  unprivileged local user or process in the same WSL instance can read the token
  from /proc/<pid>/cmdline while the attach process is running. The leaked token
  could then be used to attach other machines to the victim's Ubuntu Pro 
  subscription and gain unauthorized access to Ubuntu Pro services.
