title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  reject undersized MTUs in ip_do_fragment()\n\nip_do_fragment() subtracts the IPv4
  header length from the effective\nMTU and passes the resulting payload MTU to ip_frag_next().\n\
  \nIf the effective MTU is smaller than hlen + 8, ip_frag_next() rounds\nthe fragment
  payload length down to zero. The fragmentation state then\nnever makes forward progress:
  state->left, state->ptr and state->offset\nstay unchanged while ip_do_fragment()
  keeps allocating and transmitting\nheader-only fragments until the softlockup detector
  fires.\n\nThis is reproducible with a route installed using \"mtu lock 20\", but
  it\nis also reproducible without route MTU lock, for example by forwarding a\npacket
  to a device whose MTU is 20.\n\nFix it in ip_do_fragment() by rejecting mtu < hlen
  + 8 with -EMSGSIZE,\nmatching the existing IPv6 fragmentation check."
