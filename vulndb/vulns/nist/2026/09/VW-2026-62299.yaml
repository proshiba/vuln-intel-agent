title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  free zones array on device power-off\n\nnull_init_zoned_dev() allocates dev->zones
  when a zoned device is powered\non, but null_del_dev() never frees it on power-off;
  dev->zones is only\nfreed later in null_free_dev(), when the configfs directory
  is removed. If\nthe device is powered off and then on again, null_init_zoned_dev()\n\
  allocates a new array and overwrites the dev->zones pointer, leaking the\nprevious
  allocation each power cycle.\n\nFree dev->zones in null_del_dev() via null_free_zoned_dev()
  to solve it.\nAnd calling null_free_zoned_dev() in null_free_dev() is no longer
  necessary\nbecause every caller already invokes null_del_dev() first: via\nnullb_group_drop_item()
  before nullb_device_release(), in the\nnull_add_dev() error path of null_create_dev(),
  and in null_destroy_dev().\nRemove the redundant call.\n\nAnd take &lock around
  zone_cond_store() in the two store wrappers to\nserialize dev->zones check-and-deref
  a"
