title: Apache Airflow's asset queued-events DELETE endpoints checked the 
  caller's Dag-axis permission with `READ` instead of `EDIT`. Any authenticated 
  user who could read a Dag could therefore delete that Dag's queued asset 
  events, silently suppressing asset-triggered scheduling for it — a 
  state-changing action gated on a read-only permission. Deployments are 
  affected whenever asset-triggered scheduling is in use and Dag read access is 
  granted more widely than Dag edit access, which is the normal RBAC 
  arrangement; no special configuration is required. Upgrade to apache-airflow 
  3.3.2 or later.
