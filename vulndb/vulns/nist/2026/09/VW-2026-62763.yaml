title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: Fix recursive locking during device registration\n\ni3c_master_register_new_i3c_devs()
  registers newly discovered devices\nwhile holding i3c_bus_normaluse_lock(), a down_read().\
  \  device_register()\ncan immediately probe the device, and probe callbacks typically
  invoke\nI3C helpers that take i3c_bus_normaluse_lock() again, leading to a\nrecursive
  acquisition of the same rwsem.  rwsems do not support recursive\nread locking and
  can deadlock when a writer is waiting.  See the\n\"Recursive read locks\" section
  of Documentation/locking/lockdep-design.rst.\n\nFor example, with Intel LPSS I3C,
  LOCKDEP generates a WARNING like:\n  # echo intel-lpss-i3c.0 > /sys/bus/platform/drivers/mipi-i3c-hci/unbind\n\
  \  # echo intel-lpss-i3c.0 > /sys/bus/platform/drivers/mipi-i3c-hci/bind\n  WARNING:
  possible recursive locking detected\n  kworker/5:1/94 is trying to acquire lock:\n\
  \  ffff88811c810d78 (&i3cbus->lock){++++}-{4:4}, at: i3c_device_ma"
