title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/ionic:
  Embed counter driver data in rdma_counter allocation\n\nCommit 7e53b31acc7f (\"\
  RDMA/core: Create and destroy rdma_counter using\nrdma_zalloc_drv_obj()\") requires
  drivers implementing counter ops to\nembed struct rdma_counter in a driver-specific
  struct, register its size\nvia INIT_RDMA_OBJ_SIZE, and provide a counter_init callback.\n\
  \nThe ionic driver was merged without this adaptation, causing a NULL\npointer dereference
  in alloc_and_bind() since rdma_zalloc_drv_obj()\nallocates zero bytes when size_rdma_counter
  is unset.\n\nConsolidate struct ionic_counter into a new struct ionic_rdma_counter\n\
  that embeds struct rdma_counter, replace the xarray with a lightweight\nida for
  ID allocation, and add the required counter_init and\nINIT_RDMA_OBJ_SIZE declarations."
