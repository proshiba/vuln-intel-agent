title: "Affected versions of MISP rely on CakePHP request-method override processing
  in a way that can disable CSRF and form-security validation.\n\nCakePHP honors a
  _method field or X-HTTP-Method-Override header by rewriting the effective request
  method. For override values outside the normal write verbs POST, PUT, PATCH, and
  DELETE, CakePHP also clears the parsed request body. MISP’s security component then
  determines whether to perform _validatePost() and _validateCsrf() based on whether
  request data remains. With a value such as:\n\n\n_method=GET\n\nthe body becomes
  empty before those checks run, so both protections are skipped. A cross-site form
  containing only that override can therefore reach actions whose parameters are taken
  from the URL rather than the request body\n\nVersion affected: ≤2.5.45"
