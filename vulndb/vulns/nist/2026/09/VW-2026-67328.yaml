title: Bluehood monitors local bluetooth activity. Prior to version 0.7.1, when 
  auth_enabled is set in Bluehood, only the HTML page handlers enforced session 
  validation. The /api/* handlers (settings, devices, groups, per-device 
  endpoints including /api/device/{mac}/notes) called no auth check at all. A 
  network attacker reachable on the dashboard port could read Bluetooth tracking
  data and modify application state — including the heartbeat URL, prune 
  retention, device groups, and per-device notes — without a session cookie. 
  This issue has been patched in version 0.7.1.
