title: "In the Linux kernel, the following vulnerability has been resolved:\n\nARM:
  9484/1: enable interrupts when unhandled user faults are triggered\n\nPREEMPT_RT
  requires interrupts to be enabled when sending signals.\n\nWhen do_DataAbort()/do_PrefetchAbort()
  triggers unhandled user faults,\nthat is `inf->fn()` return a non-zero value, and
  the interrupts are not\nenabled within the hook function, force_sig_fault() will
  be called\nwith interrupts disabled.\n\nThis can be triggered by user programs executing
  the bkpt instruction,\nwith kernel config CONFIG_PERF_EVENTS=n.\n\nEnable interrupts
  in do_DataAbort()/do_PrefetchAbort() when unhandled\nuser faults are triggered to
  fix the issue."
