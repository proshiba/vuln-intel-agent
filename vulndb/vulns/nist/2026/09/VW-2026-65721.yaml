title: Krayin CRM through 2.2.6 contains a stored client-side template injection
  vulnerability that allows authenticated attackers to execute arbitrary 
  JavaScript in other users' browsers by injecting Vue.js template expressions 
  into the product name field. Attackers can craft a product name containing 
  double-brace template syntax that reaches the Vue template compiler, enabling 
  prototype chain traversal to retrieve the Function constructor and execute 
  attacker-supplied JavaScript in the application origin for every user who 
  views the affected product record.
