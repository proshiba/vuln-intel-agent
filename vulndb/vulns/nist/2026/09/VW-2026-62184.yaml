title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sfq: clamp quantum to avoid signed overflow soft lockup\n\nsfq_init() sets q->quantum
  = psched_mtu(qdisc_dev(sch)) (unsigned). A\ndevice with a huge MTU (e.g. dummy with
  max_mtu == 0 accepting MTU\n2147483634) makes psched_mtu() return 0x80000000, so
  slot->allot = INT_MIN\nand INT_MIN + INT_MIN toggles between INT_MIN and 0 forever,
  spinning\nsfq_dequeue() under the qdisc lock.\n\nClamp the quantum to [256, 1 <<
  20] so the refill loop terminates. The\nlower bound also covers q->quantum == 0
  (psched_mtu() returning 0),\nwhich spins sfq_dequeue() identically. sfq_change()
  already rejects a\nnegative quantum, so only the init path was exposed.\n\nConditions
  to recreate the bug: a device whose MTU (plus\nhard_header_len) wraps psched_mtu()
  into the sign bit (e.g. a dummy\ndevice with max_mtu == 0 accepting MTU 2147483634).
  Requires\nCAP_NET_ADMIN in a user namespace."
