title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlib/test_hmm:
  fail dmirror_fault() when the mirrored mm is gone\n\ndmirror_fault() is called from
  the dmirror_read() and dmirror_write()\nretry loops after dmirror_do_read() or dmirror_do_write()
  finds a missing\ndevice page table entry.\n\nIf the mirrored mm has already exited,
  mmget_not_zero() fails.  The\ncurrent code returns 0 in that case, which tells the
  caller that faulting\nsucceeded even though no page was faulted and no device page
  table entry\nwas installed.  The caller then retries the same address, hits -ENOENT\n\
  again, and can loop forever without making progress.\n\nReturn -EFAULT instead,
  so the ioctl fails when the mirrored mm is no\nlonger faultable."
