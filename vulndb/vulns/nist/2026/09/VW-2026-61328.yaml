title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  add missing SRCU grace period in error path\n\nnvme_alloc_ns() error path at out_unlink_ns
  removes ns from the\nnamespace head siblings list with list_del_rcu(&ns->siblings)
  but\ndoes not wait for SRCU readers before freeing the namespace struct.\nMultipath
  code iterates the head->list under srcu_read_lock() in\nnvme_find_path() and nvme_mpath_revalidate_paths(),
  so a concurrent\nreader can still hold a reference to ns when kfree(ns) runs.\n\n\
  The normal removal path in nvme_ns_remove() correctly calls\nsynchronize_srcu(&ns->head->srcu)
  after list_del_rcu() to wait for\nin-progress readers. Add the same grace period
  in the error path."
