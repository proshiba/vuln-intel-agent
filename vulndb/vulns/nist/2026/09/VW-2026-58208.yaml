title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipmi:
  ipmb: validate write message length\n\nipmb_write() read message fields before validating
  the length byte.\n\nA zero or short write can read uninitialized stack bytes.\n\n\
  A length smaller than the SMBus header underflows the block write length.\n\nRequire
  a non-empty buffer and the minimum IPMB request length.\n\nAlso require the length
  byte plus payload before parsing the message."
