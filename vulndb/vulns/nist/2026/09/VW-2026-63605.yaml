title: A vulnerability was found in aiyiyi121 SxDevOps 1.0/1.1. Affected by this
  issue is the function generate_host_task of the file backend/aiops/services.py
  of the component Command Handler. Performing a manipulation of the argument 
  command results in command injection. Remote exploitation of the attack is 
  possible. The patch is named 2b4bf8585c3e731e7a8af30801ea46680bc783f9. 
  Applying a patch is the recommended action to fix this issue. The vendor was 
  contacted early, responded in a very professional manner and quickly released 
  a fixed version of the affected product.
