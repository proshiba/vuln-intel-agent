title: "The Kaon AR2140X router improperly issues session cookies in responses to
  unauthenticated HTTP requests. This vulnerability allows a remote attacker to obtain
  a valid session identifier without providing credentials, resulting in an authentication
  bypass. With this access, the attacker can perform unauthorized actions on upgrade-related
  functionalities. These actions can be abused to force the router to issue GET requests
  to arbitrarily chosen domains.\n\nThis issue was identified in firmware versions
  up to 4.2.17. Status of newer versions remains unknown."
