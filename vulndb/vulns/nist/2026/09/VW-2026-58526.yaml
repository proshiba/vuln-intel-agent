title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: u_audio: Fix use-after-free on sound card disconnect\n\ng_audio_cleanup()
  invokes snd_card_free_when_closed() to initiate sound\ncard teardown and immediately
  frees the underlying struct snd_uac_chip\ncontext. However, snd_card_free_when_closed()
  returns asynchronously\nwhile ALSA control elements (kctls) remain open in userspace.\n\
  \nWhen userspace control applications access or close these open file\ndescriptors,
  kctl callbacks attempt to dereference kctl->private_data\npointing to &uac->c_prm
  or &uac->p_prm within the freed uac structure,\nresulting in a use-after-free (UAF)
  memory corruption.\n\nFix this issue by deferring the destruction of struct snd_uac_chip
  until\nall references to the ALSA sound card are released. Register a custom\ncard->private_free
  callback (u_audio_card_free) during g_audio_setup()\nthat frees uac and its associated
  playback/capture request and ring\nbuffers only when the sound card reference"
