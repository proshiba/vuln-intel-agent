title: OpenClaw (npm package 'openclaw') versions >= 2026.5.12 and < 2026.8.1 do
  not immediately invalidate Canvas HTTP authorization when a paired node is 
  revoked. Node revocation invalidates the WebSocket client, but Canvas HTTP 
  authorization continues to accept and renew the previously granted capability 
  until WebSocket close cleanup completes. As a result, a revoked paired node 
  can continue exercising its Canvas capability against the capability's 
  configured routes during the close grace period. The issue is fixed in 
  2026.8.1; as a workaround, restart the Gateway after revoking a node that has 
  Canvas access.
