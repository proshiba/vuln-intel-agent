title: rustls-webpki versions before 0.103.10 and 0.104.0-alpha.5 contain faulty
  CRL authority-matching logic that compares only the first distributionPoint 
  against each CRL's IssuingDistributionPoint, ignoring additional 
  distributionPoints. Attackers with a compromised trusted issuing authority can
  present revoked certificates that pass revocation checks under 
  UnknownStatusPolicy::Allow, or cause incorrect errors under the default deny 
  policy.
