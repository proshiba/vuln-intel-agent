title: WWBN AVideo contains a SQL injection vulnerability in the sort column 
  parameter of the get.json.php endpoint with APIName=channels that allows 
  unauthenticated attackers to order results by arbitrary database columns 
  including users.password and users.recoverPass. Attackers can exploit this 
  ordering oracle to infer password hash values and recovery tokens, and trigger
  SQL errors that disclose the full query statement and database schema.
