title: The Tutor LMS – eLearning and online course solution plugin for WordPress
  is vulnerable to authorization bypass in all versions up to, and including, 
  4.0.8. This is due to the plugin not properly verifying that a user is 
  authorized to perform an action. This makes it possible for authenticated 
  attackers, with subscriber-level access and above, to permanently delete 
  arbitrary WordPress posts — including pages, courses, quizzes, and WooCommerce
  products — via wp_delete_post( $id, true ). The exploit chain requires the 
  attacker to first trigger the profile-photo upload flow to obtain an authored 
  wp_posts attachment row, then create a Tutor topic reparented to that 
  attachment, before invoking the lesson deletion handler against any target 
  post ID.
