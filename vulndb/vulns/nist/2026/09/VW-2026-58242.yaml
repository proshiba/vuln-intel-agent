title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/msm:
  Unwind probe state on registration failure\n\nmsm_iommu_probe() adds its devm-managed
  IOMMU object to\nqcom_iommu_devices before adding the IOMMU sysfs device and registering\n\
  it with the IOMMU core.\n\nIf iommu_device_sysfs_add() fails, probe returns with
  the object still on\nqcom_iommu_devices. The driver core then releases the devm
  allocation,\nleaving a dangling list entry that later list walks may dereference.\n\
  \nIf iommu_device_register() fails, the same dangling list entry remains\nand the
  sysfs device is left registered as well.\n\nUnwind the sysfs device and global list
  entry in reverse setup order on\nthe corresponding failure paths."
