title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  defrag: fix deadlock between defrag and delalloc space reservation\n\nWhile running
  fsstress with autodefrag and flushoncommit, hit a deadlock\ndue to the fact that
  defrag reserves delalloc space while it's holding\ndirty and locked folios, besides
  the extent range lock. The stack traces\nare the following:\n\n   [958.624] task:kworker/u50:3\
  \   state:D stack:0     pid:20365 tgid:20365 ppid:2      task_flags:0x4208060 flags:0x00080000\n\
  \   [958.626] Workqueue: events_unbound btrfs_async_reclaim_metadata_space [btrfs]\n\
  \   [958.627] Call Trace:\n   [958.628]  <TASK>\n   [958.628]  __schedule+0x4be/0x10f0\n\
  \   [958.629]  ? preempt_count_add+0x69/0xa0\n   [958.630]  schedule+0x26/0xd0\n\
  \   [958.631]  wait_current_trans+0x102/0x160 [btrfs]\n   [958.632]  ? __pfx_autoremove_wake_function+0x10/0x10\n\
