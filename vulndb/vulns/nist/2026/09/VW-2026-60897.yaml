title: 'Concrete CMS before 9.5.3 contained a stored cross-site scripting vulnerability
  in SVG file handling. When SVG processing was set to the non-default "Reject files
  containing potentially harmful elements" mode (concrete.file_manager.images.svg_sanitization.action
  = reject), uploaded SVGs were checked only against a small built-in blocklist covering
  the script element and on* event-handler attributes; the broader enshrined/svg-sanitize
  pass still ran, but its result was discarded, so vectors it would have stripped,
  such as a javascript: URI in an xlink:href, were stored unmodified and executed
  when the file was opened directly. A user able to upload files could thereby run
  arbitrary JavaScript in the browser of any user who viewed the file. The default
  sanitize mode was not affected. The Concrete CMS security team gave this vulnerability
  a CVSS v4.0 score of 1.8 with vector CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:A/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N.
  Thanks Oriol Ortiz for reporting.'
