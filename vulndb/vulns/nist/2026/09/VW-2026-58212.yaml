title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  hp-bioscfg: pass validated element count to package parsers\n\nThe per-type package
  parsers are handed the wrong element count.\n\nhp_init_bios_package_attribute()
  validates obj->package.count and then\ncalls one of the five hp_populate_*_package_data()
  wrappers (string,\ninteger, enumeration, ordered list, password). Each wrapper forwards
  a\ncount to its hp_populate_*_elements_from_package() parser, but instead\nof forwarding
  the validated obj->package.count it derives the count\nfrom elements[0]. elements[0]
  is the NAME field and is always an\nACPI_TYPE_STRING, so reading ->package.count
  from it in fact reads\n->string.length through the union acpi_object. The parsers
  thus bound\nthemselves against the length of the name string rather than against\n\
  the real number of elements in the package.\n\nThis is safe today because hp_init_bios_package_attribute()
  refuses any\npackage that has fewer than the type's element count"
