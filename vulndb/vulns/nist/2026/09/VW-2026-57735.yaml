title: barebox is a bootloader. In barebox from version 2016.03.0 to before 
  version 2026.03.1 (and the corresponding backport to 2025.09.3), an attacker 
  could exploit a FIT signature verification vulnerability to trick the 
  bootloader into booting different images than those that were verified as part
  of a signed configuration. mkimage(1) sets the hashed-nodes property of the 
  FIT signature node to list which nodes of the FIT were hashed as part of the 
  signing process as these will need to be verified later on by the bootloader. 
  However, hashed-nodes itself is not part of the hash and could therefore be 
  modified to allow booting different images than those that have been verified.
  This issue has been patched in barebox versions 2026.03.1 and backported to 
  2025.09.3.
