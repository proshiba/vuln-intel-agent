title: "In the Linux kernel, the following vulnerability has been resolved:\n\nubifs:
  fix out-of-bounds read in signature length check\n\nubifs_sb_verify_signature()
  bounds the on-disk ubifs_sig_node->len field\nbefore handing the signature payload
  to verify_pkcs7_signature(), but the\ncheck has the wrong sign:\n\n\tif (le32_to_cpu(signode->len)
  > snod->len + sizeof(struct ubifs_sig_node))\n\nThe signature bytes start sizeof(struct
  ubifs_sig_node) (UBIFS_SIG_NODE_SZ,\n64 bytes) into the node, so the payload is
  at most\n\n\tsnod->len - sizeof(struct ubifs_sig_node)\n\nbytes long. Adding the
  header size instead of subtracting it accepts a\ndeclared length up to 2 * UBIFS_SIG_NODE_SZ
  larger than the node actually\nholds -- past the end of c->sbuf, which is vmalloc(c->leb_size).\n\
  verify_pkcs7_signature() -> pkcs7_parse_message() -> asn1_ber_decoder()\nis then
  handed that inflated length and reads beyond the allocation while\nwalking the DER
  headers. The node length comes straight from the mounted\nimage, so a crafted si"
