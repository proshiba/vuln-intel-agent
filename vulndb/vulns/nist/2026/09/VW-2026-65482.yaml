title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: validate assoc response length before status and IE access\n\ncfg80211_rx_assoc_resp()
  initialises the status and response-IE fields\nof cfg80211_connect_resp_params from
  the management frame before\nproving that the frame is long enough for those offsets.
  S1G and\nregular association responses also have different IE offsets, but the\n\
  S1G path only patched resp_ie after the unsafe initialiser had already\nrun.\n\n\
  Defer resp_ie, resp_ie_len, and status to after the link-iteration\nloop. Use a
  bool to remember whether the frame is S1G, then validate\nthe appropriate minimum
  length and set all three fields in a single\nif/else block. Funnel short-frame and
  SME-reject cleanup through a\nshared free_bss label for the abandon paths."
