title: The Pochipp plugin for WordPress is vulnerable to Reflected Cross-Site 
  Scripting via the 'keyword' parameter in versions up to, and including, 
  1.20.2. This is due to insufficient output escaping , which reads 
  $_GET['keyword'], applies only sanitize_text_field() (which strips tags but 
  leaves double quotes intact) and interpolates the value directly into the 
  value attribute of the search input via a PHP heredoc, without esc_attr(). 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that execute if they can successfully trick a user with 
  upload_files capability (Author or above) into performing an action such as 
  clicking on a specially crafted link to /wp-admin/media-upload.
