title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Fix old_data leak in guest debug error path\n\n__import_wp_info() allocates
  a per-watchpoint old_data buffer to back up\nthe original guest memory contents.
  If a later watchpoint of the same\nKVM_SET_GUEST_DEBUG request fails to import,
  kvm_s390_import_bp_data()\njumps to the error label, which frees the wp_info array
  but not the\nold_data buffers of the entries that were imported successfully. Up
  to\nMAX_BP_COUNT - 1 buffers of up to MAX_WP_SIZE bytes are leaked per failed\n\
  request, and the request can be repeated.\n\nCreate error handling for cleaning
  up all created old_data memory\nareas."
