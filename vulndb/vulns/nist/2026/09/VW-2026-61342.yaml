title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mempolicy:
  fix sleeping allocation in alloc_pages_bulk_weighted_interleave()\n\nsyzbot reported
  a sleeping function called from invalid context splat in\nbucket_table_alloc().\n\
  \nWhen rhashtable_insert_slow() rehashes the table under rcu_read_lock(), it\ncalls
  bucket_table_alloc(..., GFP_ATOMIC | __GFP_NOWARN).  If the bucket\ntable allocation
  uses vmalloc, __vmalloc_node_range_noprof() invokes\nvm_area_alloc_pages() -> alloc_pages_bulk_mempolicy_noprof()
  with the\npassed GFP_ATOMIC flags.\n\nIf the current task has an MPOL_WEIGHTED_INTERLEAVE
  mempolicy,\nalloc_pages_bulk_weighted_interleave() is called and currently hardcodes\n\
