title: AI Agent Automation is a modular AI agent workflow automation platform 
  with schedulers, tools, and observability. Prior to 0.9.1, 
  backend/src/controllers/memory.controller.js authenticates requests but 
  listMemories, deleteMemory, and clearAgentMemory use a caller-supplied agentId
  or memory _id without verifying through the related Agent that the record 
  belongs to req.user. An authenticated attacker who knows or obtains another 
  user's identifiers can read victim AgentMemory content, including conversation
  history, agent context, task data, embeddings, and metadata, delete an 
  individual victim memory, or clear all memory belonging to a victim agent. 
  This breaks tenant isolation and causes unauthorized disclosure and data loss.
  This issue is fixed in version 0.9.1.
