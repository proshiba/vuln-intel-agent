title: n8n versions before 1.123.73, 2.35.4, and 2.36.2 contain a remote code 
  execution vulnerability in the Git node. The node reset a fixed list of 
  command-bearing configuration keys before each operation, but that list did 
  not cover the content-filter and merge-driver key families. A repository with 
  local configuration setting one of those keys together with a matching 
  attribute pattern causes git to execute the configured command during an 
  ordinary Add, Commit, Checkout, or Pull operation. The command runs as the n8n
  process user.
