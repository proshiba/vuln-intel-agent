title: FreeRDP versions before 3.31.0 contain a heap-based buffer overflow in 
  nego_send_negotiation_request when processing Server Redirection PDU messages 
  with attacker-controlled LoadBalanceInfo fields. A malicious RDP server can 
  trigger the overflow by sending an arbitrary-length field that gets written to
  a fixed 512-byte buffer without validation, causing client crashes or 
  potential code execution when chained with memory disclosure.
