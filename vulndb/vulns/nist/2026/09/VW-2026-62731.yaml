title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  xilinx_dma: Fix channel idle state management in AXIDMA and MCDMA interrupt handlers\n\
  \nFix a race condition in AXIDMA and MCDMA irq handlers where the channel\ncould
  be incorrectly marked as idle and attempt spurious transfers when\ndescriptors are
  still being processed.\n\nThe issue occurs when:\n1. Multiple descriptors are queued
  and active.\n2. An interrupt fires after completing some descriptors.\n3. xilinx_dma_complete_descriptor()
  moves completed descriptors to\ndone_list.\n4. Channel is marked idle and start_transfer()
  is called even though\n   active_list still contains unprocessed descriptors.\n\
  5. This leads to premature transfer attempts and potential descriptor\n   corruption
  or missed completions.\n\nOnly mark the channel as idle and start new transfers
  when the active list\nis actually empty, ensuring proper channel state management
  and avoiding\nspurious transfer attempts."
