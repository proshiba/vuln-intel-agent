title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  asus-wireless: Fail probe when there is no ACPI match\n\nEvery platform driver can
  be forced to match a device that does not match\nits list of device IDs because
  of device_match_driver_override(), so\nplatform drivers that rely on the existence
  of a device ACPI companion\nobject need to verify its presence.\n\nasus_wireless_probe()
  returns success when acpi_match_acpi_device()\nfinds no match, leaving behind an
  input device that never reports\nanything because the notify handler is not installed.\
  \  Worse, when the\ndriver is force-bound to a device without an ACPI companion,
  probe\nstill succeeds and stores a NULL companion pointer, which\nasus_wireless_remove()
  later passes to acpi_dev_remove_notify_handler(),\nleading to a NULL pointer dereference
  on unbind.\n\nReturn -ENODEV when the device does not match the ID table.  This
