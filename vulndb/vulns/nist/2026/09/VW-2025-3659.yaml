title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  platform: exynos4-is: Add hardware sync wait to fimc_is_hw_change_mode()\n\nIn fimc_is_hw_change_mode(),
  the function changes camera modes without\nwaiting for hardware completion, risking
  corrupted data or system hangs\nif subsequent operations proceed before the hardware
  is ready.\n\nAdd fimc_is_hw_wait_intmsr0_intmsd0() after mode configuration, ensuring\n\
  hardware state synchronization and stable interrupt handling."
