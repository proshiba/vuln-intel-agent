title: Kyverno before 1.18.0 contains a server-side request forgery 
  vulnerability in apiCall.service.url that allows authenticated users to send 
  arbitrary HTTP requests by injecting user-controlled input through variable 
  substitution. Attackers can target internal services, cloud metadata 
  endpoints, and loopback addresses, with response data reflected in admission 
  error messages enabling non-blind data exfiltration.
