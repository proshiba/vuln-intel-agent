title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxdp:
  fix zero-copy frame layout\n\nxdp_convert_zc_to_xdp_frame() clones an XSK packet
  into an order-0 page\nand advertises PAGE_SIZE as its frame size.  It allows the
  copied frame\nto occupy the page tail needed by skb_shared_info and records zero\n\
  headroom even when metadata separates the frame header from packet data.\nAn AF_XDP
  zero-copy packet redirected through cpumap can therefore make\nthe skb overlap skb_shared_info
  or place it beyond the allocated page.\n\nLimit the copied layout to SKB_WITH_OVERHEAD(PAGE_SIZE)
  and include the\nmetadata length in frame headroom.  Redirect callers already handle
  a\nNULL conversion result.\n\nBUG: KASAN: slab-out-of-bounds in skb_gro_receive\n\
  Write of size 4 at addr ffff88800cf37004 by task cpumap/1/map:1/146\nCall Trace:\n\
  \ skb_gro_receive (net/core/gro.c:174)\n udp_gro_receive (net/ipv4/udp_offload.c:812)\n\
  \ inet_gro_receive (net/ipv4/af_inet.c:1539)\n dev_gro_receive (net/core/gro.c:515)\n\
  \ gro_re"
