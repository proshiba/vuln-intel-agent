  were distributed with unauthorized modifications introduced through a supply chain
  compromise. The modified builds could cause devices meeting specific targeting conditions
  to perform unintended actions. Only devices that met these conditions and installed
  the compromised versions were affected. The Live Update client has already reached
  End-of-Support (EOS) in October 2021, and no currently supported devices or products
  are affected by this issue.'
