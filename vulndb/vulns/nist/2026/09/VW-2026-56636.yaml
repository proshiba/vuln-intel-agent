title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, a Log Streaming event destination could reference a 
  generic HTTP credential and decrypt whichever credential ID it named without 
  an ownership check. A user with a custom global role carrying Log Streaming 
  scopes could select a credential belonging to another project and send its 
  decrypted secret to an attacker-controlled endpoint. The affected 
  authorization boundary is 
  packages/cli/src/modules/log-streaming.ee/destinations/destination-credentials-access.ts
  and the credential:read scope. This issue is fixed in versions 1.123.76, 
  2.37.7 and 2.38.2.
