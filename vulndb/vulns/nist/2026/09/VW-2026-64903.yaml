title: orval versions before 8.29.0 contain a code injection vulnerability in 
  the @orval/hono generator that fails to escape OpenAPI path values in 
  single-quoted route literals. Attackers can craft an OpenAPI document with an 
  apostrophe in a static path segment to inject arbitrary JavaScript code that 
  executes when the generated TypeScript module is imported.
