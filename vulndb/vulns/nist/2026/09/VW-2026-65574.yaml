title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  8250: fix possible ISR soft lockup\n\nThere are rare cases in which the host gets
  stuck in the ISR because it\nis flooded with messages during the startup phase.\n\
  \nThe reason for the soft lockup in the ISR is the missing FIFO error IRQ\n(FIFOE)
  handling. Not handling it and reporting IRQ_HANDLED triggers\nthe IRQ immediately
  again.\n\nFix this by adding a check for the FIFOE status and clearing the FIFO\n\
  if no data is ready (DR).\n\nThis behavior was observed on an AM62L device which
  uses the OMAP 8250\ndriver. Fix it for all 8250 drivers, since the OMAP driver's
  special\nIRQ setup handling may trigger this behavior more frequently, but it\n\
  is not ensured that other 8250 drivers aren't affected."
