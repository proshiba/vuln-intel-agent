title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix retry exhaustion in simple ring buffer reader swap\n\nsimple_ring_buffer_swap_reader_page()
  starts with retry set to 8 and\npost-decrements it only after a failed link replacement.
  On the final\nattempt, a successful replacement leaves retry at zero, while a failed\n\
  replacement leaves it at -1.\n\nThe current !retry test reverses both outcomes.
  It returns an error after\na successful final replacement, leaving the link update
  complete but the\nreader bookkeeping unfinished. After a failed final replacement,
  it\nfalls through and updates the head and reader pointers as though the\nreplacement
  succeeded, which can corrupt the ring.\n\nTreat only a negative counter as exhaustion
  and return the documented\n-EBUSY error."
