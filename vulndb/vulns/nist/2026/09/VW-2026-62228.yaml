title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  mtpav: shut down output timer before card teardown\n\nsnd_mtpav_output_timer() rearms
  chip->timer while holding\nchip->spinlock and accesses the card-private mtpav state.\n\
  \nsnd_mtpav_free() currently takes the same lock and calls\ntimer_delete() when
  the timer is active. This only removes a\npending timer; it does not wait for a
  callback that is already\nrunning and does not prevent the callback from rearming
  the timer.\n\nA callback running on another CPU can therefore continue after\nsnd_mtpav_free()
  releases the lock and access the card-private\nstate while the card is being torn
  down. It can also rearm the\ntimer after timer_delete() has returned.\n\nCall timer_shutdown_sync()
  without holding chip->spinlock. This\nwaits for any running callback to finish and
  prevents further\nrearming before the card-private mtpav state is released."
