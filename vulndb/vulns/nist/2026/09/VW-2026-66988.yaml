title: "Under WOLFSSL_SMALL_CERT_VERIFY, ProcessPeerCertParse() runs the certificate
  signature check separately from the parse to keep peak memory down, then merges
  the two results, but it merged the signature result back only when the parse returned
  0, so any parse error hid it. ParseCertRelative() reaches its validity-date, name-constraint
  and critical-extension checks only after ConfirmSignature() has passed, so splitting
  the signature check out inverts the precedence that makes \"override date errors\"\
  \ a sound policy, and ASN_SIG_CONFIRM_E is never surfaced anywhere. The attacker
  needs no key material from the real PKI and no CA compromise: a self-made certificate
  carrying the expected subject name, the trusted CA's subject as its issuer, arbitrary
  bytes where the signature goes, a validity window in the past and the attacker's
  own key pair is sufficient. Affected builds define WOLFSSL_SMALL_CERT_VERIFY, which
  is off by default, is not set implicitly by any platform or preset header, and is "
