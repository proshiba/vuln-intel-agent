title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fix unconfined user namespace restriction forced stack\n\nIf a task is already confined
  by a stack the unprivileged transition\nrestriction on unconfined is not correctly,
  applied. This results in\nan escape if two transitions through an unconfined profile
  can be\nexecuted.\n\nFix this by pushing the check into the per profile label build.
  The\ncheck will always be done against unconfined and result in a stack of\njust
  the unconfined component when necessary."
