title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix transaction use-after-free in raid stripe insertion\n\nIf allocation of a RAID
  stripe extent fails,\nbtrfs_insert_one_raid_extent() aborts and ends the transaction
  before\nreturning -ENOMEM.\n\nbtrfs_finish_one_ordered(), the production caller
  through\nbtrfs_insert_raid_extent(), still owns the transaction handle. It handles\n\
  the error by aborting the transaction and then reaches the common exit\npath, which
  ends the transaction again.\n\nThe premature end can free the handle and drop its
  transaction reference.\nTransaction cleanup can then free the transaction before
  the caller's\nsecond abort accesses the handle and transaction, resulting in\nuse-after-free.\n\
  \nKeep the abort at the failure site, but let the caller's common exit path\nend
  the transaction once, after it has finished using both objects."
