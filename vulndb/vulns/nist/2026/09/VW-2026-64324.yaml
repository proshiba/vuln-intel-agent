title: Databasement before 1.7.14 validates invitation tokens only when the 
  acceptance page loads, caching the authorization decision without re-checking 
  token validity during acceptance. Attackers with a leaked or forwarded 
  invitation link can load the page while pending, then accept the invitation 
  after the legitimate user has already accepted it to overwrite the account 
  password and gain authenticated access to managed database credentials and 
  secrets.
