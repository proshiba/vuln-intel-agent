title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix potential deadloop in prepare_compress_overwrite()\n\nJan Prusakowski reported
  a kernel hang issue as below:\n\nWhen running xfstests on linux-next kernel (6.14.0-rc3,
  6.12) I\nencountered a problem in generic/475 test where fsstress process\ngets
  blocked in __f2fs_write_data_pages() and the test hangs.\nThe options I used are:\n\
  \nMKFS_OPTIONS  -- -O compression -O extra_attr -O project_quota -O quota /dev/vdc\n\
  MOUNT_OPTIONS -- -o acl,user_xattr -o discard,compress_extension=* /dev/vdc /vdc\n\
  \nINFO: task kworker/u8:0:11 blocked for more than 122 seconds.\n      Not tainted
  6.14.0-rc3-xfstests-lockdep #1\n\"echo 0 > /proc/sys/kernel/hung_task_timeout_secs\"\
  \ disables this message.\ntask:kworker/u8:0    state:D stack:0     pid:11    tgid:11\
  \    ppid:2      task_flags:0x4208160 flags:0x00004000\nWorkqueue: writeback wb_workfn
  (flush-253:0)\nCall Trace:\n <TASK>\n __schedule+0x309/0x8e0\n schedule+0x3a/0x100\n\
  \ schedule_preempt_disabled+"
