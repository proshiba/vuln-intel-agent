title: "Apache Airflow FAB provider: resetting a user's password does not delete that
  user's existing database-backed sessions, despite documented behaviour that it does.
  The cleanup compares the string identifier Flask-Login stores in the session against
  the user's integer database identifier, so the comparison never matches and no session
  is removed. An attacker who already holds a copy of the victim's session cookie
  keeps access as that user after the password change, so the reset does not evict
  them.\n\nAffects deployments using the FAB auth manager with `[fab] session_backend=database`.
  The trigger is an administrator (or the user) running the supported password-reset
  command as a containment action after a session cookie has been compromised; the
  secure-cookie backend is out of scope, as it documents that it cannot centrally
  delete sessions.\n\napache-airflow-providers-fab 3.9.0 also fixes CVE-2026-86462,
