title: A path traversal vulnerability in the SPO extension of MetaGPT 0.8.1 
  allows an attacker to read arbitrary files via the FILE_NAME value used by 
  set_file_name() and load_meta_data() in metagpt/ext/spo/utils/load.py. The 
  vulnerable code joins the attacker-controlled FILE_NAME value with the 
  settings directory and opens the resulting path without validating that the 
  resolved path remains within the intended directory.
