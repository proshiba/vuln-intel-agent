title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  skbuff: don't touch shared zerocopy state in skb_tx_error()\n\nskb_tx_error() completes
  the zerocopy uarg and clears\nSKBFL_ALL_ZEROCOPY, and skb_zcopy_downgrade_managed()
  clears\nSKBFL_MANAGED_FRAG_REFS. Both live in skb_shinfo(), which every clone\n\
  shares, while the caller only owns the reference it is about to drop.\nThrough a
  clone it tells the producer its pages are free and drops\nSKBFL_SHARED_FRAG for
  an skb that is still in flight.\n\nOpen vSwitch reaches this with a non-last OVS_ACTION_ATTR_RECIRC:\n\
  clone_execute() sends a skb_clone() into ovs_dp_process_packet() while\ndo_execute_actions()
  keeps forwarding the original, and skb_clone()\ndoes not privatise the frags here
  -- skb_orphan_frags() returns early\non SKBFL_DONT_ORPHAN. A flow miss on the clone
  then strips the marker\nfrom the packet still being forwarded, and a later local
  ESP delivery\ndecrypts in place over frags it does not own privately.\n\nSkip it
  for a cl"
