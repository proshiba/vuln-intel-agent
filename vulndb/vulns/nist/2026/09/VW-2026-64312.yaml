title: radare2 is a UNIX-like reverse engineering framework and command-line 
  toolset. Prior to 6.2.0, radare2's binary property-list Unicode parser was 
  vulnerable because the binary-property-list Unicode parser underallocated an 
  uninitialized UTF-8 destination and did not guarantee NUL termination. The 
  vulnerability is triggered by running the explicit pFB or pFBj commands on 
  untrusted binary property-list data. The json encoder treated the converted 
  data as a nul-terminated c string and could continue reading beyond the 
  allocation. This can cause disclosure of uninitialized or adjacent heap 
  contents in JSON output and possible process termination. This issue is fixed 
  in version 6.2.0.
