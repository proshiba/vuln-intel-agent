title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark the zero register precise for a register-form NULL check\n\ncheck_cond_jmp_op()
  accepts \"if rA <op> rB\" as a NULL check for a\nnullable pointer rA when rB is
  a scalar known to be zero,\nlifts PTR_MAYBE_NULL from rA in the corresponding branch
  and does not\nmark rB precise. Consider the following program:\n\n  r0 = bpf_get_prandom_u32();\n\
  \  r6 = 1;                  /* the r6 == 0 path is explored first */\n  if (r0 ==
  0) goto 1f;\n  r6 = 0;\n1:\n  r0 = bpf_map_lookup_elem(map, &0);  /* absent, NULL
  at runtime */\n  if (r0 == r6) goto 2f;   /* taken as a NULL check for r0      \
  \ */\n  *(u8 *)(r0 + 0);         /* verifier: map value; runtime: zero */\n2:\n\
  \  return 0;\n\nThe r6 == 0 path is explored first and the dereference is accepted.\n\
  The r6 == 1 path is pruned at the checkpoint recorded for (1),\nso the comparison
  is never verified with a non-zero r6. At runtime a\nfailed lookup returns NULL,
  NULL != 1 takes the non-NULL edge an"
