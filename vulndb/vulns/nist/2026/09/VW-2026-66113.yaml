title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject legacy packet loads from callbacks\n\ncheck_ld_abs() models a failed BPF_LD_ABS
  or BPF_LD_IND in a\nsubprogram as an implicit return with R0 set to zero. It calls\n\
  prepare_func_exit() to explore this synthesized path.\n\nWhen the load is reached
  directly from a synchronous callback,\nprepare_func_exit() enforces the callback
  return contract and marks R0\nprecise. R0 is not derived from a real instruction
  on this path, so\nprecision backtracking reaches the callback call with R0 still
  requested\nand triggers the \"callback unexpected regs\" verifier bug. A privileged\n\
  program loader can therefore cause a verifier warning and an -EFAULT\nBPF_PROG_LOAD.\n\
  \nThese legacy packet-load instructions are deprecated. Reject them from\ncallbacks
  rather than complicating their implicit-return model. Check all\nactive frames before
  constructing the implicit return so nested static\nsubprograms cannot hide the callback
  context.\n\nGlobal fun"
