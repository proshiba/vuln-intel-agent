title: ArduinoBLE enables Bluetooth Low Energy connectivity on certain Arduino 
  models. Versions prior to 2.0.2 contain a missing bounds check in the ATT 
  layer write request handler that allows a remote, unauthenticated BLE client 
  to corrupt memory in the ATTClass global object. Devices running ArduinoBLE 
  with one or more characteristics configured with the BLEEncryption property 
  are affected. The fix is included starting from the 2.0.2 release.
