title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  preserve VFS inherited POSIX ACL mask\n\nThe VFS initializes a child's POSIX ACL
  from the parent's default ACL and\nthe requested creation mode. Do not mutate the
  parent ACL or overwrite the\nchild's VFS-computed access and default ACLs afterwards.\n\
  \nThis preserves restrictive ACL_MASK entries and prevents SMB object creation\n\
  from widening effective permissions."
