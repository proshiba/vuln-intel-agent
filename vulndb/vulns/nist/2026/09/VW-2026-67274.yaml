title: "A cross-tenant authorization issue was discovered in SUSE Rancher Fleet. During
  agent-initiated cluster registration, cluster labels supplied by the registering
  agent, including labels in the reserved management.cattle.io/ namespace such as
  the cluster display name label, were applied to the resulting upstream Cluster object.
  Because Fleet resolves GitRepo and Bundle targets from those cluster labels, a party
  able to register a cluster into a Fleet workspace namespace shared with other tenants
  could cause its own cluster to satisfy targeting rules that administrators intended
  for a different cluster.\nThis affects SUSE Rancher Fleet 0.16 before 0.16.1, 0.15
  before 0.15.6, 0.14 before 0.14.10, 0.13 before 0.13.15, 0.12 before 0.12.19 and
  older versions."
