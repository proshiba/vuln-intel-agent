title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  verisilicon: hantro: bound G2 HEVC tile loop to the buffer capacity\n\nprepare_tile_info_buffer()
  writes one entry per tile into the tile_sizes\nDMA buffer, sized for a grid equal
  to the PPS uAPI array capacity. Use the\nbounded v4l2_hevc_pps_num_tile_columns()
  / v4l2_hevc_pps_num_tile_rows()\nhelpers so the loops stay inside the buffer."
