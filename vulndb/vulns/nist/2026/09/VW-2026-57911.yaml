title: "The Floating Chat Widget: Contact Chat Icons, Telegram Chat, Line Messenger,
  WeChat, Email, SMS, Call Button – Chaty plugin for WordPress is vulnerable to Reflected
  Cross-Site Scripting via the 's' parameter in all versions up to, and including,
  3.5.9 due to insufficient input sanitization and output escaping. This makes it
  possible for unauthenticated attackers to inject arbitrary web scripts in pages
  that execute if they can successfully trick a user into performing an action such
  as clicking on a link. WordPress's server-side HTML encoding of the 's' search parameter
  in the &lt;title&gt; element is bypassed because the browser DOM API decodes HTML
  entities when jQuery's .text() method reads document.title, returning literal special
  characters that are then embedded unescaped into the constructed HTML attribute
  value."
