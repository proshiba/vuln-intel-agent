title: The Hummingbird – Speed Optimization, Caching, Minify, Compress & CDN 
  plugin for WordPress is vulnerable to Remote Code Execution in all versions up
  to, and including, 3.21.0 via the log_msg() function in 
  core/modules/class-page-cache.php. The page-cache debug log is written to 
  wp-content/wphb-logs/page-caching-log.php, a directly web-accessible PHP file 
  that is supposed to be protected by a leading '<?php die(); ?>' header. That 
  header is guarded by class_exists( 'Filesystem' ), which can never match 
  because class_exists() resolves string arguments in the global namespace while
  the class is Hummingbird\Core\Filesystem; when the log is created during a 
  front-end request the header is therefore omitted entirely. get_cookies() then
