title: A vulnerability was determined in aaPanel BaoTa up to 11.8.0. The 
  affected element is the function panelTask.bt_task._unzip of the file 
  /www/server/panel/class/panelTask.py of the component Unzip Handler. Executing
  a manipulation of the argument Password can lead to os command injection. The 
  attack may be performed from remote. The exploit has been publicly disclosed 
  and may be utilized. The vendor was contacted early about this disclosure but 
  did not respond in any way.
