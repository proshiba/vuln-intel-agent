title: A security vulnerability has been detected in SerenityOS up to 
  3d83e4509fd20d7438e1ae8470ffe668c136229c. Affected by this vulnerability is 
  the function decode_bmp_pixel_data of the file 
  Userland/Libraries/LibGfx/ImageFormats/BMPLoader.cpp of the component LibGfx. 
  The manipulation of the argument height leads to integer overflow. The attack 
  is possible to be carried out remotely. The attack's complexity is rated as 
  high. The exploitation appears to be difficult. The exploit has been disclosed
  publicly and may be used. This product adopts a rolling release strategy to 
  maintain continuous delivery. Therefore, version details for affected or 
  updated releases cannot be specified. The identifier of the patch is 
  007041bb2dd6d140c9e707caddfb0a49ecf96469. Applying a patch is the recommended 
  action to fix this issue. This was reproducible with a minimal 55-byte PoC via
  the standard image-decode fuzz target but evidence for an actual exploitable 
  defect is thin.
