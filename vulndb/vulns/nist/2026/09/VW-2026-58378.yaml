title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  APEI: GHES: fix ARM section length accounting after header\n\nIn ghes_handle_arm_hw_error(),
  after skipping the cper_sec_proc_arm\nheader with (err + 1), the remaining length
  was reduced by sizeof(err)\n(pointer size) instead of sizeof(*err) (structure size).\n\
  \nThat overestimates the bytes left for cper_arm_err_info records and can\nlet the
  parser read past the CPER section when err_info_num is large\nenough relative to
  error_data_length.\n\nUse sizeof(*err) so the length accounting matches the pointer
  advance\nand the earlier sizeof(*err) size check."
