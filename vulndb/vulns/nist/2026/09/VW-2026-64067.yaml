title: MaxKB is an open-source AI assistant for enterprise. In 2.10.2-lts and 
  earlier, management chat-record routes authorize the path application_id but 
  load records using global chat_id and chat_record_id values without confirming
  that the chat belongs to the authorized application. A normal user in the same
  workspace who knows the chat_id of a persisted non-debug record for a victim's
  published application can place it under a separate attacker-owned application
  path to read victim chat records. An attacker with an owned knowledge base and
  document can also use add_knowledge to copy victim answers while updating the 
  victim record's improve_paragraph_id_list. No fixed version is available as of
  this review.
