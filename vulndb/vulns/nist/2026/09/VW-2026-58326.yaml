title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  wait for in-flight client TLS handshake callback\n\nxs_tls_handshake_sync() gives
  xs_tls_handshake_done() a reference to the\nlower transport before submitting the
  handshake request. On timeout or\nsignal, the synchronous waiter drops that reference
  after calling\ntls_handshake_cancel().\n\nhandshake_req_cancel() returns false when
  handshake_complete() has\nalready marked the request complete. In that case the
  completion callback\ncan still be running, so dropping the callback-owned reference
  in the\nwaiter can free the lower transport before xs_tls_handshake_done() stores\n\
  xprt_err or drops its own reference.\n\nIf cancellation loses to completion, wait
  until xs_tls_handshake_done()\nsignals handshake_done and let the callback release
  its reference. This\nmirrors the server-side handshake lifetime handling and keeps
  the timeout\nor signal return value unchanged."
