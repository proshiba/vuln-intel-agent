title: "Insufficient Session Expiration vulnerability in team-alembic AshAuthentication
  allows an attacker who obtains a victim's OAuth2 state value to replay the callback
  and sign that victim into an attacker-controlled account.\n\nAshAuthentication.Strategy.OAuth2.Plug.callback/2
  clears the stored session_params through a rebinding step inside its with chain,
  conn <- delete_session(conn, session_key). Elixir evaluates the else block in the
  scope enclosing the with, so every failure path (the provider returning ?error=access_denied,
  an invalid code, a token-exchange error, or a registration or sign-in failure) reaches
  store_authentication_result/2 holding the original connection and the session entry
  is never removed. The value the module's own comment describes as protection against
  a CSRF-related attack is therefore consumed only when authentication succeeds, and
  survives a cancelled or failed attempt until the next request phase or session expiry.\n\
  \nThis issue affects ash_authentication: from"
