title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Serialize NVMe unsol ctx list with a per-fcport lock\n\nThe fcport->unsol_ctx_head
  list is modified from several contexts without\na common lock. Entries are added
  in qla2xxx_process_purls_iocb() from the\nresponse queue ISR (under the qpair qp_lock),
  while they are removed from\nqla2xxx_process_purls_pkt() (DPC/purex worker), qla_nvme_xmt_ls_rsp()\n\
  (NVMe-FC transport callback) and qla_nvme_release_lsrsp_cmd_kref() (SRB\ncompletion).
  The qpair qp_lock cannot serialize this per-fcport list since\nmultiqueue adapters
  add entries through different qpairs, so a concurrent\nadd and delete (or two concurrent
  deletes) can corrupt the list pointers.\n\nIntroduce a dedicated per-fcport spinlock,
  unsol_ctx_lock, initialized in\nqla2x00_alloc_fcport(), and take it around every
  list_add_tail()/list_del()\non unsol_ctx_head. The add nests under the existing
  qp_lock; no delete path\ntakes qp_lock, so the lock order is consistent a"
