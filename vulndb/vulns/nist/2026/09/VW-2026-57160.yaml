title: Snipe-IT versions before 8.7.0 fail to sanitize the category EULA text 
  field before rendering it in checkout confirmation emails. Attackers with 
  low-privilege permissions can inject markdown image syntax or raw HTML img 
  tags pointing to local files or remote URLs, which the mail auto-embed library
  resolves server-side and returns as email attachments, exfiltrating sensitive 
  files like .env credentials and enabling SSRF attacks.
