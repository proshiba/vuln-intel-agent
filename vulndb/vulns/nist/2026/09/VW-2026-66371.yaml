title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.1.2, a security filter that protects Zammad's AI Agent configuration can 
  be bypassed by entering specially crafted text into one of an AI Agent's 
  fields. An administrator with permission to create or edit AI Agents could 
  exploit this to run arbitrary commands on the server that hosts Zammad, 
  potentially reading, modifying, or destroying all data stored on that server. 
  No interaction from other users is needed; the malicious code runs 
  automatically the next time the affected AI Agent processes a ticket. This 
  issue is fixed in version 7.1.2.
