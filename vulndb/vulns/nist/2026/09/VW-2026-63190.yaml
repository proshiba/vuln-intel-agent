title: xdg-dbus-proxy incorrectly filters D-Bus broadcast messages, bypassing 
  configured path, interface, and member restrictions. This allows a sandboxed 
  Flatpak application to intercept broadcast signals on the D-Bus session bus 
  and AT-SPI bus that should be restricted, potentially exposing sensitive 
  information to unauthorized applications.
