title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  hyperv: validate initial device info bounds\n\nThe Hyper-V synthetic HID host supplies
  SYNTH_HID_INITIAL_DEVICE_INFO\nmessages that contain a HID descriptor followed by
  the report descriptor\nbytes. mousevsc_on_receive_device_info() trusts bLength and\n\
  wDescriptorLength without checking that the received packet contains both\nbyte
  ranges.\n\nA malformed host or backend message can therefore make the guest read\n\
  past the received VMBus packet while copying the report descriptor. Pass\nthe received
  initial-device-info size into the parser and reject\ndescriptor lengths that exceed
  the packet.\n\nImpact: A malicious Hyper-V host or backend can crash a guest by
  sending\na short initial device-info message with an oversized HID report\ndescriptor
  length."
