title: "In MISP's UsersController login() method, the pre-authentication database
  query used for the TOTP (two-factor authentication) verification branch did not
  include the User.disabled column in its SELECT fields list. The query selected only
  User.password, User.totp, and User.hotp_counter. When the TOTP branch subsequently
  accessed $unauth_user['User']['disabled'], the key was absent from the result set,
  producing a PHP 'Undefined array key' warning and causing the expression to evaluate
  as null (falsy). As a result, the disabled-user guard in the TOTP branch was effectively
  a no-op: a disabled, TOTP-enrolled user could proceed to the TOTP verification step
  rather than being rejected at that point. \n\nThe commit message explicitly states
  this was 'harmless in practice' because the subsequent identify() call re-validates
  the user and would still reject a disabled account. \n\nThe practical security impact
