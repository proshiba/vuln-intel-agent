title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: unlink TWT flow if the MCU rejects the agreement\n\nThe flow is added
  to dev->twt_list before sending the agreement to the\nfirmware, but the error path
  leaves it linked while flowid_mask is\nnever set. The flow slot can then be reused
  and memset while still on\nthe list, corrupting twt_list, and station removal leaves
  a dangling\nentry behind that mt7915_mac_twt_sched_list_add() later walks."
