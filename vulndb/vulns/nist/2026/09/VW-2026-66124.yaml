title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  Intel: avs: Clean up the bus when fetching ML caps fails\n\nsnd_hdac_ext_bus_get_ml_capabilities()
  may fail and its return code\nshall be checked and accounted for. Address the issue
  by updating the\nerror-path for avs_pci_probe().\n\nAt the same time, if the function
  in question succeeds but the next part\nof avs_pci_probe() fails, the hlink list
  shall be cleaned up before\nleaving the scope."
