title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix races in cifsd thread creation\n\nThe cifsd demultiplex thread can run
  and access tcp_ses before the parent\nthread has finished populating tcp_ses, which
  the worker thread accesses\nlocklessly.\n\nAlso, the kthread_run macro may start
  the thread before returning the\nthread pointer. Because the pointer is part of
  the structure that the\nthread can access, if the kernel is preempted after the
  thread is spawned,\nbut before the thread pointer is populated and the thread attempts
  to exit,\nit will sleep, waiting for a SIGKILL signal.\n\nFix this by moving creation
  of the thread to after all of tcp_ses'es\nfields are populated, and spawning the
  thread last, using a split\nkthread_create/wake_up_process logic."
