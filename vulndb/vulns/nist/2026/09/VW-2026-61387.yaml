title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb-storage:
  ene_ub6250: fix race between scan work and probe\n\nene_ub6250_probe() calls usb_stor_probe2(),
  which starts the usb-storage\ninfrastructure and schedules the delayed scan work.\
  \  The driver then\ncalls ene_get_card_type(), which sends an ENE command through\n\
  ene_send_scsi_cmd() and the usb-storage bulk transfer helpers.\n\nBoth the delayed
  scan work, through usb_stor_Bulk_max_lun(), and\nene_get_card_type() use us->current_urb.\
  \  The scan work serializes this\naccess with us->dev_mutex, but the ENE card-type
  probe does not.  If the\nscan work runs while ene_get_card_type() is still using
  us->current_urb,\nusb_submit_urb() warns that the URB is already active.\n\nSerialize
  ene_get_card_type() with us->dev_mutex, matching the locking\nused by the scan path."
