title: Without NO_SESSION_CACHE_REF, wolfSSL_get_session() does not return a 
  session object but a ClientSession reference of the form {row, index, 
  hash(sessionID)} into the process-global SessionCache, and 
  ClientSessionToSession() validates it against that hash alone. Because the TLS
  1.2 session ID is chosen by the server and sent in clear, AddSessionToCache() 
  matches any other server's session on the same ID and overwrites the 
  client-side entry with that server's master secret, cipher suite and version, 
  while the handle continues to resolve; nothing on the write path compares the 
  peer, the application's server ID or the WOLFSSL_CTX. Resuming through the 
  handle then produces an abbreviated handshake in which no Certificate message 
  is sent, so neither chain verification nor wolfSSL_check_domain_name() runs, 
  and the attacker is accepted as the original server for the whole of that 
  connection. Affected builds are those leaving NO_SESSION_CACHE_REF, 
  NO_SESSION_CACHE, NO_CLIENT_CACHE and TITAN_SES
