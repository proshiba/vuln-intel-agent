title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  qcom: snps-femto-v2: Fix possible NULL-deref on early runtime suspend\n\nRuntime
  PM must be enabled before creating the PHY, since phy_create()\nonly enables runtime
  PM on the PHY device if it is already enabled on\nthis parent device. However, the
  runtime PM callbacks dereference the\nhsphy instance, which is not yet ready, leaving
  a window where a suspend\ncallback may trigger a NULL pointer dereference.\n\nTake
  a runtime PM usage reference with pm_runtime_get_noresume() before\nenabling runtime
  PM and release it once the PHY has been created, so that\nno runtime suspend can
  run before the PHY is ready. This also prevents a\nshort window where an unnecessary
  runtime suspend can occur.\n\nUse the devres-managed version to ensure PM runtime
  is symmetrically\ndisabled during driver removal for proper cleanup."
