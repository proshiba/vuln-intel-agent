title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Publish channel state before callbacks\n\nTransport setup can enable callbacks
  before the setup routine returns.\nmailbox_chan_setup() registers the mailbox client
  with\nmbox_request_channel(), and the mailbox controller startup path can enable\n\
  interrupt delivery before SCMI mailbox channel state has been published.\nSimilarly,
  smc_chan_setup() requests the optional A2P completion IRQ before\nthe SMC transport
  has made its cinfo pointer visible.\n\nIf a pending or spurious callback fires in
  those windows, the transport RX\ncallback can dereference a NULL transport cinfo
  pointer. Publishing only\nthe transport-private pointer is not sufficient either:
  an early callback\ncan enter the SCMI core before scmi_chan_setup() has assigned\n\
  cinfo->handle.\nThe core derives scmi_info from cinfo->handle in the RX path, so
  a NULL\nhandle can still fault even when the transport-private cinfo is valid.\n\
  \nAssign cinfo->handle be"
