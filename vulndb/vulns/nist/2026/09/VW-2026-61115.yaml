title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  fix out-of-bounds read in read_log_rec_buf()\n\nread_log_rec_buf() copies a log
  record into a caller buffer starting at\n\n\tu32 off = lsn_to_page_off(log, lsn)
  + log->record_header_len;\n\nlog->record_header_len (and log->data_off, used for
  the following pages)\ncomes verbatim from the on-disk restart area and is only checked
  for\n8-byte alignment in is_rst_area_valid(), so off can exceed\nlog->page_size.
  \"tail = log->page_size - off\" then underflows and\nmemcpy() reads past the page_size-sized
  buffer returned by\nread_log_page(), spilling adjacent slab memory into the replay
  buffer.\n\nThis is reachable by mounting a crafted NTFS image:\n\n BUG: KASAN: slab-out-of-bounds
  in read_log_rec_buf+0x216/0x580\n Read of size 64 at addr ffff88800a877ff8 by task
  exploit/127\n  read_log_rec_buf fs/ntfs3/fslog.c:2299\n  log_replay fs/ntfs3/fslog.c:4216\n\
  \  ntfs_loadlog_and_replay fs/ntfs3/fsntfs.c:324\n  ntfs_fill_super fs/ntfs3/super.c:13"
