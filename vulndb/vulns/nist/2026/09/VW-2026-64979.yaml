title: "A flaw was found in Red Hat Ansible Automation Platform's automation-\ncontroller.
  Four debug views that trigger the internal task, dependency, and\nworkflow schedulers
  are configured to allow any user (including unauthenticated\nclients) and are routed
  in production builds because their URL include is not\ngated on the debug setting.
  An unauthenticated remote attacker can repeatedly\ninvoke these endpoints to acquire
  the cluster-wide scheduler advisory lock;\nbecause the legitimate scheduler acquires
  the same lock without waiting, the\nattacker causes real scheduler runs to be skipped,
  stalling job dispatch for\nall tenants, while also consuming controller web workers.
  The debug root view\nadditionally discloses the list of debug endpoints to unauthenticated
  callers."
