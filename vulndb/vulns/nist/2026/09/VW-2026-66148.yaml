title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zstd: fix lost wakeup when waiting for a workspace\n\nA writer can sleep forever
  in zstd_get_workspace() even though a workspace\nis free.  When zstd_alloc_workspace()
  fails, the task is queued on\nzwsm->wait and schedules unconditionally, never re-testing
  the pool.\nzstd_put_workspace() publishes the workspace and then calls cond_wake_up(),\n\
  which only wakes when a sleeper is already visible, so a workspace returned\nbetween
  the failed allocation and prepare_to_wait() wakes nobody.  The\nwindow is wide:
  zstd_alloc_workspace() goes through kvmalloc() and may\nenter reclaim.\n\nOnly a
  max level workspace triggers the wakeup and one is deliberately kept\nallocated
  as the fallback every waiter waits for, so once its wakeup is\nlost the writer stays
  in TASK_UNINTERRUPTIBLE until some other task happens\nto return one.  Re-check
  the pool after prepare_to_wait() has published the\nwaiter, and use the workspace
  if one turned up."
