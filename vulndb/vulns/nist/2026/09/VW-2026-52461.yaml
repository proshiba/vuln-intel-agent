title: The BetterDocs – AI Documentation, Knowledge Base, Docs, Wikis, FAQ with 
  Chatbot plugin for WordPress is vulnerable to Stored Cross-Site Scripting via 
  Heading 'id' Attribute in Post Content in all versions up to, and including, 
  4.8.1 due to insufficient input sanitization and output escaping. This makes 
  it possible for authenticated attackers, with contributor-level access and 
  above, to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses an injected page. The exploit survives wp_kses_post because 
  entity-encoded quotes in a heading id attribute are treated as a single 
  legitimate attribute value at save time; the dangerous payload only 
  materialises after process_content_for_toc() calls html_entity_decode() on the
  stored content and the broken id is extracted by a lazy regex before being 
  echoed unescaped into the Table of Contents output.
