title: "An issue was discovered in Bosch Sensortec COINES_SDK versions 2.0 through
  2.11. \r\n\r\nThe host streaming API function {{coines_read_stream_sensor_data()}}
  fails to validate the boundaries of the caller-provided destination buffer.\r\n\r\
  \nInternally, the stream processing mechanism in {{comm_intf_process_stream_response()}}
  discards the requested {{number_of_samples}} argument and copies the entirety of
  the streaming ring buffer's accumulated data into {{coines_stream_rsp_buf}}.\r\n\
  \r\nSubsequently, {{coines_read_stream_sensor_data()}} unconditionally executes
  a {{memcpy}} of the ring buffer size into the caller-provided buffer without verifying
  if the destination memory allocation is large enough.\r\n\r\nA malicious or compromised
  hardware board connected via USB or BLE can exploit this by streaming a high volume
  of sensor samples, causing a heap or stack-based buffer overflow on the host desktop
  environment.\r\n\r\nThis can result in a Denial of Service (DoS) or potential arbitrary
  code execution on t"
