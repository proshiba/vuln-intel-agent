title: Improper neutralization of special elements in data query logic in the 
  MongoDB integration for Laravel can cause an array supplied to an explicit 
  equality filter to be interpreted as a query condition rather than as a 
  literal value. This affects the three-argument `where` method when the 
  operator is `=` or `eq`, as well as the `find` and `delete` methods that use 
  that code path. An attacker who can cause an affected application to supply an
  operator-shaped array to one of these APIs may obtain a document other than 
  the intended target or delete documents beyond the intended target.
