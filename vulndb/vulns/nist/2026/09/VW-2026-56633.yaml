title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the legacy expression engine generated source text by 
  calling the mutable global JSON.stringify while printing synthetic string 
  literals and interpolating timezone data. An expression could replace 
  JSON.stringify and cause later generated source to contain executable 
  attacker-controlled code. The affected code-generation paths include 
  packages/@n8n/expression-runtime/src/bridge/isolated-vm-bridge.ts and 
  packages/@n8n/tournament/src/ExpressionBuilder.ts, and the issue does not 
  affect the vm expression engine. This issue is fixed in versions 1.123.76, 
  2.37.7 and 2.38.2.
