title: '`@bsv/wallet-toolbox` provides BRC-100 wallet signing and storage components,
  while `@bsv/wallet-toolbox-client` and `@bsv/wallet-toolbox-mobile` provide client-focused
  distributions for standard and mobile applications using wallet storage services.
  A vulnerability in these packages causes transactions created through a remote `StorageClient`
  to trust output locking scripts returned by the storage provider without verifying
  that they match the outputs requested by the caller. A malicious or compromised
  storage provider can substitute a recipient script or inject an additional output,
  causing the wallet to sign and broadcast a transaction that redirects funds while
  the application and user interface continue to display the intended recipient. Source
  and npm publication history indicate that stable versions `@bsv/wallet-toolbox`
  and `@bsv/wallet-toolbox-client` from 1.1.47 through 2.3.3, and `@bsv/wallet-toolbox-mobile`
  from its initial 1.3.21 release through 2.3.3, are affected. All th'
