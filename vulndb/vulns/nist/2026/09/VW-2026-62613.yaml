title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  ad525x_dpot: use driver core groups for sysfs files\n\nad_dpot_probe() creates per-RDAC
  sysfs files manually and then\noptionally creates the command sysfs group. This
  leaves probe responsible\nfor rolling back partial sysfs state and makes remove
  responsible for\nmatching every file that probe created.\n\nMove the device attributes
  into driver core dev_groups for the I2C and\nSPI drivers and use an is_visible()
  callback to expose only the\nattributes supported by the probed device. With this
  shape, the driver\ncore creates the sysfs files only after probe succeeds and removes
  them\nbefore the remove callback frees the driver data."
