title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  add missing read barrier to rpc_status_get dumpit seqcount retry\n\nThe hand-rolled
  seqcount-like protocol in nfsd_nl_rpc_status_get_dumpit()\nis missing a read memory
  barrier (smp_rmb) before its second counter\ncheck.  The standard kernel read_seqcount_retry()
  includes smp_rmb()\nto ensure that all data reads complete before the counter is
  re-checked.\n\nWithout this barrier, on weakly-ordered architectures (ARM, POWER),\n\
  the CPU may reorder field reads past the second counter check, making\nthe retry
  logic ineffective: it could observe a consistent counter pair\nwhile reading fields
  that have been concurrently modified by the writer.\n\nAdd smp_rmb() before the
  second counter check to order the field reads\nahead of it, matching the barrier
  semantics of the standard seqcount\nread-side.  The begin-side smp_load_acquire()
  already pairs with the\nsmp_store_release() in nfsd_dispatch(); with the smp_rmb()
  now ordering\nthe fiel"
