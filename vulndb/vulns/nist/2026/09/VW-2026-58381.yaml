title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/rocket:
  initialize job domain before cleanup paths\n\nrocket_ioctl_submit_job() releases
  rjob through rocket_job_put() on\nallocation error paths. rocket_job_cleanup() unconditionally
  calls\nrocket_iommu_domain_put(job->domain), but job->domain is assigned only\n\
  after task copying and BO lookups. A failure before that assignment can\ntherefore
  clean up a job with a NULL domain pointer.\n\nTake the per-file domain reference
  before the first error path can release\nrjob. Also clear rjob->tasks after freeing
  it in rocket_copy_tasks(), so\nthe common cleanup path cannot free the task array
  again after a task-copy\nerror."
