title: Nagios XI versions prior to 2024R1.1.3, under certain circumstances, 
  disclose sensitive user account information (including API keys and hashed 
  passwords) to authenticated users who should not have access to that data. 
  Exposure of API keys or password hashes could lead to account compromise, 
  abuse of API privileges, or offline cracking attempts. CVE-2024-13995 
  addresses a similar vulnerability with a potentially incomplete fix for the 
  underlying problem in earlier versions.
