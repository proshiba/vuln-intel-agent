title: zstd-jni versions 1.2.0 through 1.5.7-13 contain an out-of-bounds read 
  vulnerability in the ZstdDictDecompress constructor because offset and length 
  arguments are never validated against the dictionary array bounds. Attackers 
  can supply arbitrary offset or length values to read memory past the end of 
  the supplied array, potentially causing JVM termination.
