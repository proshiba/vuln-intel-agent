title: In AVideo through 29.0, the autoCSRFGuard() function maintains a 
  hardcoded allowlist of exempt basenames tested without directory context, 
  allowing plugin files matching core filenames to inherit CSRF exemptions. The 
  LoginWordPress plugin file login.json.php inherits an exemption and 
  unconditionally logs out authenticated users on cross-site POST requests 
  before validating credentials.
