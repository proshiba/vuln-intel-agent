title: phpseclib is a PHP secure communications library. Prior to 3.0.57 and 
  4.0.1, pure-PHP X25519 scalar multiplication in 
  phpseclib/Math/PrimeField/Integer.php performs data-dependent conditional 
  modular reductions in add() and subtract(). During the Montgomery ladder in 
  phpseclib/Crypt/EC/BaseCurves/Montgomery.php, the reduction behavior of each 
  step depends on the secret scalar prefix, creating per-step timing and libgmp 
  call-count observations that can reveal a reused 251-bit clamped private 
  scalar. The phpseclib/Crypt/EC/Formats/Keys/MontgomeryPrivate.php derivation 
  path invokes the pure-PHP multiplication without a native-engine check, while 
  phpseclib/Crypt/EC/Formats/Keys/PKCS8.php reaches it when ext-sodium is 
  unavailable. Exploitation requires a reused or long-lived X25519 private key, 
