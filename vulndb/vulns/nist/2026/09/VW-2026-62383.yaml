title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm_mpam:
  Fix a NULL pointer dereference on unbinding after an error interrupt\n\nIf a user
  unbinds an MSC after mpam_disable() has been run in response\nto an error interrupt
  then a dereference of a NULL pointer occurs as\nmpam_disable() sets the drvdata
  to NULL. Add an early return to the driver\nremove callback to avoid this."
