title: OpenClaw before 2026.9.4 contains an incorrect authorization 
  vulnerability in the mcp.app.view method that allows read-scoped operators to 
  execute MCP App tools requiring operator.write scope. Attackers with 
  operator.read tokens can obtain a standalone ticket from mcp.app.view and 
  redeem it at the MCP app view endpoint to invoke state-changing tools without 
  proper authorization checks.
