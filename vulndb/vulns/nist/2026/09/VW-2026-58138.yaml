title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: bound the device EEPROM address before the EFUSE copy\n\nmt7915_mcu_get_eeprom()
  copies a fixed EFUSE block into the driver's\ndev->mt76.eeprom.data buffer at the
  offset reported by the MCU response\n(res->addr, a device-controlled __le32) without
  checking it against the\nbuffer size. A malicious or malfunctioning device can report
  an arbitrary\naddress and drive a 16-byte out-of-bounds write past eeprom.data.\n\
  \nReject a response whose address would place the copy outside eeprom.data\nbefore
  deriving the destination pointer. Devices that echo the requested\nin-bounds offset
  are unaffected."
