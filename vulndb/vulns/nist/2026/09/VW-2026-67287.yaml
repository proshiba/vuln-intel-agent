title: "A vulnerability has been identified within Rancher Manager where the Fleet
  agent wrote resources to downstream clusters using its own cluster-admin credentials
  instead of the ServiceAccount pinned to the deployment. It affects multi-tenancy
  environments where different tenants share the same downstream clusters, for example
  different privileged or untrusted teams inside the same organization. This could
  lead to overwritten configuration files.\n\nThis issue affected SUSE Rancher Fleet
  0.16 before 0.16.2, 0.15 before 0.15.7, and 0.14 before 0.14.11."
