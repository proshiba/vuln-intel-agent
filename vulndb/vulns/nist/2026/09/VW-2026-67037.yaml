title: utcp-gql before 1.1.1 and utcp-websocket before 1.1.1 contain server-side
  request forgery vulnerabilities due to incomplete application of 
  CVE-2026-44661 fixes. The GraphQL plugin uses a vulnerable prefix check 
  allowing bypass URLs like http://127.0.0.1.attacker.example, while the 
  WebSocket plugin performs no URL validation despite documented security 
  requirements. Attackers can force connections to internal services and cloud 
  metadata endpoints by supplying malicious tool URLs in call templates, and 
  receive configured API keys and OAuth tokens sent to attacker-controlled 
  hosts.
