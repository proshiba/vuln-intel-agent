title: Kimai versions from 2.61.0 before 2.63.0 fail to disable admin-only 
  work-contract preferences for low-privilege users in the PATCH 
  /api/users/{id}/preferences endpoint. Although the web interface gates these 
  employment-contract fields behind the contract_other_profile admin permission,
  the WorkContractPreferenceSubscriber (introduced in 2.61.0) registers the 
  preferences as enabled without a permission check, so an authenticated regular
  user can use the API to modify their own admin-only work-contract data. The 
  issue is fixed in 2.63.0 by applying the same permission check to the API 
  endpoint.
