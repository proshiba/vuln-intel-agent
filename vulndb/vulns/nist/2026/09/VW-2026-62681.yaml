title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: configfs: fix out-of-bounds read of qw_sign\n\nos_desc_qw_sign_show() passes
  OS_STRING_QW_SIGN_LEN as the input\nlength to utf16s_to_utf8s(), but that argument
  counts UTF-16 code\nunits while OS_STRING_QW_SIGN_LEN (14) is the byte size of qw_sign[].\n\
  The array holds only OS_STRING_QW_SIGN_LEN / 2 (7) code units, so the\nconversion
  reads up to 7 units (14 bytes) past the end of qw_sign[]\ninto the following members
  of struct gadget_info when the stored\nsignature fills the array without a NUL terminator,
  exposing those\nbytes through the configfs attribute.\n\nThe store path halves the
  count for its input bound but passes the\nfull byte count as the utf8s_to_utf16s()
  output limit; use the\ndestination code-unit count in both directions."
