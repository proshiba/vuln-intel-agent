title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  pm8001: Use rollback index when freeing MSI-X vectors\n\npm8001_request_msix() unwinds
  previously registered handlers with\nfree_irq() when request_irq() fails. The rollback
  loop uses the failing\nindex i for every iteration instead of the already registered
  vector\nindex j.\n\nThat passes the wrong IRQ/dev_id pair to free_irq() and leaves
  the\nearlier handlers installed. Use j for both pci_irq_vector() and the\nmatching
  irq_vector entry in the rollback loop."
