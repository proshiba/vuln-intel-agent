title: 'A vulnerability was detected in cosmicstack-labs mercury-agent up to 1.1.13.
  Affected is the function checkShellCommand of the file src/capabilities/permissions.ts
  of the component Shell Command Execution. The manipulation results in incorrect
  behavior order: validate before canonicalize. The attack may be launched remotely.
  The exploit is now public and may be used. The project was informed of the problem
  early through an issue report but has not responded yet.'
