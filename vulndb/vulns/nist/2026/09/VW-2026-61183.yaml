title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  avoid force-completing uninitialized UVD rings\n\nuvd_v7_0_sw_init() does not initialize
  the UVD decode ring for an\nSR-IOV VF. However, amdgpu_uvd_resume() unconditionally
  force-completes\nthe decode ring when restoring its fence sequence.\n\nSkip fence
  completion when the fence driver is not initialized."
