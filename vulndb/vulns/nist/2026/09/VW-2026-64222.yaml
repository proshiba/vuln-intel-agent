title: "MISP's WorkflowsController exposed the moduleStatelessExecution action in
  the Security component's unlockedActions list. In CakePHP, listing an action in
  unlockedActions disables both the CSRF token check and the field hash validation
  for that action. Because moduleStatelessExecution executes a workflow module's exec()
  method with caller-supplied input and parameters, the absence of CSRF protection
  allowed an attacker to craft a cross-site form post (or equivalent cross-origin
  request) that, when submitted by an authenticated site administrator, would cause
  the administrator's browser to invoke the action on the MISP instance. \n\nThe attacker
  could select any workflow module to execute, including action modules that write
  blocklist and warninglist entries, and supply arbitrary input and parameters of
  their choosing. This constitutes a cross-site request forgery (CSRF) vulnerability
  with high integrity impact on the MISP instance's security-related data. \n\nThe
  vulnerability was identifie"
