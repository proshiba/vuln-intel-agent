title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to 7.0.17 and 8.0.6, HTTP
  SWF decompression with the non-default swf-decompression feature and an unsafe
  decompress-depth can use the configured depth when allocating in 
  src/util-file-decompression.c instead of limiting the allocation to the Flash 
  file's actual data requirement. A crafted SWF response can therefore trigger 
  an integer-related heap buffer overflow and crash Suricata; the default 
  disabled feature and default depth are not affected. This issue is fixed in 
  versions 8.0.6 and 7.0.17.
