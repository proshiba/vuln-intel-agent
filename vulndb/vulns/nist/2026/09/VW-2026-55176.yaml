title: "A flaw was found in hawtio-operator. The operator's ClusterRole grants secrets:
  [create, get, list, update, watch] across all namespaces. While the operator uses
  a controller-runtime label-selector cache as a memory optimization, the ServiceAccount
  token authorizes read access to every Secret in the cluster. The operator also bypasses
  the cache via direct API calls. Compromise of the operator pod would yield read
  access to every Secret in the cluster, including bootstrap tokens, cloud credentials,
  and other operators' secrets."
