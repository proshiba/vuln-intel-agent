title: An incorrect numeric conversion in the JSON parsing component of the 
  MongoDB C Driver's BSON library may cause an unusually large text value to be 
  silently shortened, or the corresponding field to be omitted, while the 
  parsing operation still reports success and returns no error. An 
  unauthenticated party who can supply the input processed by an application 
  that uses this component may cause that application to hold data that does not
  match what was submitted, which may result in unintended alteration of data.
