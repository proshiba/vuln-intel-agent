title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  do not cancel a policy conversion that never started\n\nsel_write_load() calls selinux_policy_cancel()
  when sel_make_policy_nodes()\nfails, and that helper dereferences the outgoing policy
  to cancel its\nsidtab conversion. On the first policy load there is no outgoing
  policy:\nsecurity_load_policy() returns early for that case, before it converts\n\
  anything, and state->policy is still NULL. A first load that fails while\nbuilding
  the selinuxfs tree therefore takes a NULL dereference in\nselinux_policy_cancel(),
  reached from a write(2) to /sys/fs/selinux/load.\n\nSkip the cancel when there is
  no old policy, mirroring the check\nsecurity_load_policy() already makes before
  it converts."
