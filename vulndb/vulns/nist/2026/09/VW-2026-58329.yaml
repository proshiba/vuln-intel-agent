title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  reject duplicate CREDS_VALUE options\n\ngssx_dec_option_array() walks the wire-supplied
  option array and, for\nevery entry whose name matches CREDS_VALUE, calls\ngssx_dec_linux_creds()
  on the same struct svc_cred. That helper\nunconditionally installs a fresh groups_alloc()
  result into\ncreds->cr_group_info without releasing whatever pointer was already\n\
  there:\n\n    for (i = 0; i < count; i++) {\n        ... decode name ...\n     \
  \   if (length == sizeof(CREDS_VALUE) &&\n            memcmp(p, CREDS_VALUE, sizeof(CREDS_VALUE))
  == 0) {\n            err = gssx_dec_linux_creds(xdr, creds);\n            ...\n\
  \        }\n    }\n\nA reply that carries two CREDS_VALUE entries therefore overwrites\n\
