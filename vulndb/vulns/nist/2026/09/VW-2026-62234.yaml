title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  visconti: Make sure clk_init_data is fully initialized\n\nThe clk_init_data structure
  contains several mutually-exclusive members\nfor different methods to specify the
  possible parents of a clock,\nprompting drivers to initialize only the members they
  need.  However,\nnot initializing all members may cause subtle issues, which are
  only\nexposed when CONFIG_INIT_STACK_ALL_PATTERN or CONFIG_INIT_STACK_NONE is\n\
  enabled.\n\nvisconti_clk_register_gate() fills in init.parent_data, and assumes
  that\ninit.parent_names is NULL.  However, the latter in uninitialized, and\nthus
  may cause a crash.\n\nMake sure all members are fully initialized, to fix such bugs,
  and to\navoid future breakage when converting drivers to a different method for\n\
  specifying the parents."
