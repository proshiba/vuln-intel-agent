title: A security flaw has been discovered in MantisZip up to 0.4.5. Affected by
  this issue is the function Path.Combine of the file MainWindow.UI.cs of the 
  component Preview. The manipulation results in path traversal. It is possible 
  to launch the attack remotely. The exploit has been released to the public and
  may be used for attacks. The project was informed of the problem early through
  an issue report but has not responded yet.
