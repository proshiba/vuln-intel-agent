title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: validate rx/tx MLME callback frame lengths before access\n\ncfg80211_rx_mlme_mgmt()
  and cfg80211_tx_mlme_mgmt() call tracepoints\nbefore rejecting frames shorter than
  the frame-control field. After\nthat, they only require len >= 2 before dispatching
  into subtype\nhandlers that assume their fixed fields are present.\n\nThe frames
  that trip this are not shorter than 2 bytes; they are short\nrelative to their subtype.
  mwifiex is a concrete in-tree example on the\nlength side: mwifiex_process_mgmt_packet()
  only requires a 4-address\nieee80211_hdr plus the 2-byte firmware length prefix
  before handing the\nframe to cfg80211_rx_mlme_mgmt(). After stripping the length
  prefix and\nremoving addr4, pkt_len can be exactly 24: a bare 3-address management\n\
  header with no reason-code body. The existing WARN_ON(len < 2) does not\nfire on
  such a frame, and cfg80211_process_deauth() then reads\nu.deauth.reason_code as
  a two-byte acce"
