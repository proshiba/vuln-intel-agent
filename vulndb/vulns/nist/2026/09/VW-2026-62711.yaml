title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncgroup/cpuset:
  Make nr_deadline_tasks an atomic_t\n\nThe nr_deadline_tasks variable in the cpuset
  structure was introduced by\ncommit 6c24849f5515 (\"sched/cpuset: Keep track of
  SCHED_DEADLINE task\nin cpusets\"). It is reported by sashiko [1] that nr_deadline_tasks\n\
  can currently be modified by inc_dl_tasks_cs() under rq->lock and\nby cpuset_attach()
  under cpuset_mutex. So if both updates happen\nsimultaneously, the nr_deadline_tasks
  variable can be corrupted leading\nto incorrect operations down the road.\n\nFix
  that by changing its type to atomic_t so that nr_deadline_tasks\nare always atomically
  updated. This fix patch is a low hanging fruit.\nIt can handle some of the races
  between a concurrent sched_setscheduler()\nand cpuset_can_attach()/cpuset_attach()
  calls, but not all of them like\nthe other issue raised by sashiko [2]. This will
  be handled hopefully\nin a future follow up patch.\n\n[1] https://sashiko.dev/#/patchset/20260626"
