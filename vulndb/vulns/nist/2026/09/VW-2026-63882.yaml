title: A vulnerability was determined in ST Engineering iDirect Evolution and 
  Velocity WebServer Evolution. This vulnerability affects unknown code of the 
  file /authorize of the component HTTP Request Handler. Executing a 
  manipulation of the argument Success can lead to http response splitting. It 
  is possible to launch the attack remotely. The exploit has been publicly 
  disclosed and may be utilized. The validated environment is an EOL X7 (or an 
  un-modelled legacy Evolution 21.x), and current supported releases (X10, X11, 
  Velocity 5.x+) have no validated evidence of impact.
