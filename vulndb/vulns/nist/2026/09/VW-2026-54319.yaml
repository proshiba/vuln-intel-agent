title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Fix wrong hwpt passed to iommufd_auto_response_faults on replace\n\niommufd_hwpt_replace_device()
  calls:\n\n\tiommufd_auto_response_faults(hwpt, old_handle);\n\npassing the *new*
  hwpt together with the handle of\nthe device's *old* domain. This should be a parameter
  mismatch:\n\n1. Semantically, iommufd_auto_response_faults(x, handle) scans\n  \
  \ x->fault's deliver list and response xarray for groups matching\n   \"handle\"\
  . A group is queued under the hwpt that was attached at\n   fault-delivery time.
  old_handle is fetched *before* the domain switch,\n   so its group lives on old->fault,
  not on the new hwpt->fault.\n\n2. Historically, the first argument was \"old\".
  The routine was\n   introduced by commit b7d8833677ba (\"iommufd: Fault-capable
  hwpt\n   attach/detach/replace\") as __fault_domain_replace_dev() in\n   fault.c,
  correctly calling iommufd_auto_response_faults(old, curr).\n   Commit fb21b1568ada
