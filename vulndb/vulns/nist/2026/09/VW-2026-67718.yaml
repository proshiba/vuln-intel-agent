title: "Issue summary: A non-constant-time optimized implementation of scalar\npoint
  multiplication is used for SM2 private key operations on ARM64 and\nRISC-V platforms.\n\
  \nImpact summary: An attacker able to measure the time taken by, or to observe\n\
  the cache-line access pattern of SM2 signing or decryption on an affected\nplatform
  can learn information about the secret scalar.\n\nCWE: CWE-208: Observable Timing
  Discrepancy\n\nDescription: On ARM64 and RISC-V processors, the SM2 curve uses an
  optimized\nscalar multiplication implementation whose conditional branches and table\n\
  look ups are chosen according to the bits of the secret scalar. The execution\n\
  time and the cache-access pattern therefore depend on the long-term private\nkey
  (during SM2 decryption) or the per-signature nonce (during SM2 signature\ngeneration),
  forming a timing and cache side-channel.\n\nFIPS Impact: no\nSM2 is not a FIPS algorithm
  and the optimized SM2 implementation is not part\nof the FIPS module.\n\nOpenSSL
  4.0, 3.6, 3.5 and 3.4 are "
