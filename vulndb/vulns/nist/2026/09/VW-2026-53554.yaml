title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRevert
  \"drm/amdgpu: fix aperture mapping leak\"\n\ndevres teardown is LIFO. The aperture
  devres node was registered after\nthe DRM device node, so devres_release_all() unmaps
  the aperture before\nthe DRM device release callback fires amdgpu_device_fini_sw().
  IP\nsw_fini callbacks (e.g. vcn_v4_0_sw_fini) write to fw_shared through a\npointer
  derived from aper_base_kaddr, causing a kernel page fault on\nprobe failure / rollback:\n\
  \n  BUG: unable to handle page fault ... PMD 0\n  RIP: vcn_v4_0_sw_fini+0x7b/0x170
  [amdgpu]\n  Call Trace:\n    amdgpu_device_fini_sw\n    amdgpu_driver_release_kms\n\
  \    devm_drm_dev_init_release\n    devres_release_all\n\nThis reverts commit d871e99879cb5fd1fa798b006b4888887e63a17a.\n\
  \n(cherry picked from commit 336e0cd576817ac64a4b394ca2b3680029f3e37f)"
