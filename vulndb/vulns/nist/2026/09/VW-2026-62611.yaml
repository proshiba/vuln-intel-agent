title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  mtdswap: Avoid freeing registered blktrans device twice\n\nIn mtdswap_add_mtd(),
  debugfs setup failure after successful blktrans\nregistration can free mbd_dev twice.\n\
  \nadd_mtd_blktrans_dev() initializes the blktrans device reference and\npublishes
  the disk. Once that succeeds, del_mtd_blktrans_dev() tears the\ndisk down and drops
  the blktrans reference; when that reference reaches\nzero, blktrans_dev_release()
  frees the mtd_blktrans_dev.\n\nThe debugfs failure path called del_mtd_blktrans_dev(mbd_dev),
  then fell\nthrough the common cleanup label and called kfree(mbd_dev) again. Clear\n\
  the local pointer after deregistration so the common cleanup can still\nrelease
  the mtdswap state without freeing the blktrans object twice.\n\nThis issue was found
  by a static analysis checker and confirmed by\nmanual source review."
