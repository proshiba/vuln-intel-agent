title: "The userspace verifier z_vrfy_rtio_sqe_copy_in_get_handles() in subsys/rtio/rtio_syscalls.c
  (subsys/rtio/rtio_handlers.c before v4.3.0) validated the RTIO object handle and
  the sqes input array, but not the handle out-parameter. On the first loop iteration
  it executed *handle = sqe, storing the kernel address of the newly acquired submission-queue
  entry through a pointer taken verbatim from user mode, with no K_SYSCALL_MEMORY_WRITE
  check in front of it.\n\nAny user-mode thread that has been granted a struct rtio
  kernel object can invoke the syscall with an arbitrary address in handle. That is
  the ordinary way an unprivileged thread uses the RTIO API, for example via sensor_read_async_mempool()
  or the async ADC helpers, which call rtio_sqe_copy_in_get_handles() internally.
  The store happens in supervisor mode before any submission-entry validation, so
  it fires regardless of whether the SQE contents are subsequently rejected. Only
  builds with CONFIG_USERSPACE and CONFIG_RTIO are affected; "
