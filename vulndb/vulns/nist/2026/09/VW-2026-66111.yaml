title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Don't resurrect a scalar id dropped by collect_linked_regs()\n\ncheck_cond_jmp_op()
  copies the compared registers into\nenv->{false,true}_reg{1,2} before collect_linked_regs()
  runs and copies\nthose snapshots back into both branch states afterwards.\n\ncollect_linked_regs()
  records at most LINKED_REGS_MAX members of a\nlinked registers group in the jump
  history and calls clear_scalar_id()\nfor every member that does not fit. The compared
  register is not exempt\nfrom that.\n\nAs a consequence, sync_linked_regs() might
  adjust ranges for more\nregisters than bpf_bt_sync_linked_regs() can propagate precision
  to.\n\nCollect the linked registers before the snapshots are taken instead.\nThis
  might lead to some unnecessary clear_scalar_id's, but from\nprevious testing situations
  with many linked registers are\nextremely rare."
