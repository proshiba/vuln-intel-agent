title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  processor: Unregister cpufreq notifier on init failure\n\nacpi_processor_driver_init()
  registers the cpufreq policy notifier before\nregistering the ACPI processor driver
  and setting up CPU hotplug state.\n\nIf driver_register() or cpuhp_setup_state()
  fails, the error path only\nunregisters the ACPI processor driver and the idle driver.
  The cpufreq\nnotifier remains registered even though initialization failed.\n\n\
  Mirror the module exit path on the init failure path and unregister the\ncpufreq
  notifier when it has been registered."
