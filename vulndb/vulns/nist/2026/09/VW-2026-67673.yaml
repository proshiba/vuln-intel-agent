title: "The scriptPath parameter is incorporated into a /bin/sh -c command without
  sufficient neutralization of shell metacharacters, allowing shell command substitution
  and execution.\n\nAn authenticated user can exploit this behavior by creating a
  resource whose filename contains shell command substitution syntax, such as $(...),
  and subsequently supplying the resulting path to the Alert Script plugin's /test-send
  endpoint. When the alert script is executed, the shell interprets the injected command,
  resulting in arbitrary command execution with the privileges of the DolphinScheduler
  service process.\n\n\n\nThis issue affects Apache DolphinScheduler: before 3.4.3.\n\
  \n\n\nUsers are recommended to upgrade to version 3.4.3, which fixes the issue."
