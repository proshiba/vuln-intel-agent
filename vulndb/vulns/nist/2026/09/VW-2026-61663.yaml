title: Concrete CMS before 9.5.3 exposed a legacy Express entry search endpoint 
  that returned entry result JSON without invoking the canViewExpressEntries() 
  permission check applied by the normal dashboard and CSV Export flow. An 
  unauthenticated visitor who knew or discovered an Express entity identifier 
  could enumerate that entity's entry search results, disclosing attribute 
  values intended to be restricted to privileged users. For Express entities 
  that do not support entry-specific permissions (i.e., 
  supportsEntrySpecificPermissions() returns false), per-entry permission 
  filtering is additionally disabled via EntryList::ignorePermissions(). The 
  Concrete CMS security team gave this vulnerability a CVSS v4.0 score of 6.3 
  with vector CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N. 
  Thanks Daniel Powell for reporting.
