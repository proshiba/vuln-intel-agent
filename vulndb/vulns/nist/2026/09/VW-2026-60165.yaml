title: Incorrect privilege assignment in the admin user-management component of 
  Webkul Bagisto 2.4.9 allows an authenticated backend user holding only the 
  settings.users.edit permission to escalate to full administrator. The 
  user-update endpoint (route admin.settings.users.update, 
  UserController::update()) does not verify that the actor is permitted to grant
  the requested role, does not prevent a user from changing their own role, and 
  does not restrict assignment to roles whose permission set is a subset of the 
  actor's own. By submitting a request that sets role_id to the Administrator 
  role for their own account, a low-privileged administrator gains every 
  admin-panel capability, including store configuration, payment gateway 
  credentials, and customer PII.
