title: "In the Linux kernel, the following vulnerability has been resolved:\n\nzram:
  fix slot lock bit position on big-endian 64-bit\n\nThe slot lock is a bit operation
  on the whole __lock word, which flags and\nac_time alias as two u32s.  On little-endian
  the lock bit lands in the\nposition ZRAM_ENTRY_LOCK reserves in flags, so the aliasing
  works out.  On\n64-bit big-endian it lands in ac_time instead: with\nZRAM_TRACK_ENTRY_ACTIME
  enabled, storing the access time from\nmark_slot_accessed() or slot_free() wipes
  out the held lock bit, letting\nanother CPU take the same slot lock; an access time
  value with that bit\nset makes the slot look locked forever.\n\nShift the lock bit
  into the flags half of the word on big-endian 64-bit."
