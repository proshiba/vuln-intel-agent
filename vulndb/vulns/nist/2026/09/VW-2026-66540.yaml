title: OpenClaw (npm package 'openclaw') before 2026.8.1 does not correctly 
  enforce per-chat tool policies for Codex app-server runtime tools. A 
  conversation-level tools.allow rule filtered OpenClaw tools but did not 
  restrict the shell, process, file, and patch tools owned by the Codex runtime.
  When a lower-trust conversation was assigned to a Codex runtime and restricted
  with a per-chat tool allowlist, a participant able to trigger that agent could
  still reach native command and file tools, bypassing the configured allowlist.
  The practical impact depends on the runtime's host permissions and sandbox 
  configuration. The issue is fixed in 2026.8.1.
