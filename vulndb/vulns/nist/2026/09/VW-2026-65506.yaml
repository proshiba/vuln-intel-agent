title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: xgmac2: disable RBUE in default RX interrupt mask\n\nEnabling the RX Buffer
  Unavailable (RBUE) interrupt is counterproductive\nand can trigger a MAC interrupt
  storm under heavy RX pressure. When the\nDMA runs out of RX descriptors it fires
  RBUE continuously until software\nrefills the ring.\n\nHowever, RBUE is redundant:
  the normal RX completion interrupt (RIE)\nalready triggers NAPI, which processes
  completed descriptors and refills\nthe ring, causing the DMA to resume. The RBUE
  handler itself only sets\nhandle_rx - the same outcome as RIE.\n\nOn Agilex5 under
  heavy RX pressure, the MAC interrupt (which includes\nRBUE) was observed firing
  1,821,811,555 times against only 2,618,627\nactual RX completions - a ~695x ratio
  - confirming the severity of the\nstorm.\n\nRBUE does not provide OOM recovery.
  If page_pool is exhausted,\nstmmac_rx_refill() cannot advance the DMA tail pointer,
