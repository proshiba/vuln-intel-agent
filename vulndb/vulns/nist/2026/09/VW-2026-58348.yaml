title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid10:
  fix still_degraded being inverted in raid10_sync_request()\n\nCommit fe6a19d40ceb
  (\"md/md-bitmap: merge md_bitmap_start_sync() into\nbitmap_operations\") converted
  still_degraded from int to bool, but\ninverted the assignment in the loop that checks
  whether the array will\nstill be degraded after the current device is recovered:\n\
  \"still_degraded = 1\" became \"still_degraded = false\".\n\nAs a result, recovering
  a device while another mirror is still missing\ncalls md_bitmap_start_sync() with
  degraded == false, which clears bitmap\nbits that the still-missing device needs.\
  \  When that device is re-added,\nits bitmap-based recovery finds the bits already
  cleared and skips every\nregion written while the array was degraded, so it is marked
  In_sync\nwhile holding stale data: silent corruption.\n\nReproducer (raid10 near=2,
  4 disks, internal bitmap):\n - fail and remove one disk of each mirror pair\n -
  write to the degraded array\n -"
