title: libp2p-rendezvous through 0.17.1 fails to validate registration TTL 
  values in discovery responses, allowing attackers to trigger timer arithmetic 
  overflow. A malicious rendezvous server can send a discovery response with an 
  unbounded TTL value that causes the client node process to panic when 
  computing the expiry timer.
