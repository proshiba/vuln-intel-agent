title: "A flaw was found in Red Hat Ansible Automation Platform's automation-\ncontroller.
  The HTML view of job, ad hoc command, project update, and inventory\nupdate standard
  output escapes HTML metacharacters but does not remove ANSI\nterminal escape sequences
  before conversion to HTML. An ANSI OSC 8 hyperlink\nsequence in the output is expanded
  into an HTML anchor whose href is not scheme-\nfiltered or escaped, so a low-privileged
  user who can produce output -- or an\nexternal party whose data a playbook echoes
  -- can embed a javascript: link that\nis rendered into a text/html response with
  no Content-Security-Policy. When a\nhigher-privileged user views the output page
  and clicks the link, attacker-\ncontrolled JavaScript executes in their authenticated
  session, allowing actions\nas that user up to full platform takeover."
