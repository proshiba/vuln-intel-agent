title: AVideo through version 29.0 contains an unauthenticated SQL injection 
  vulnerability in the User_Location plugin's regions.json.php and 
  cities.json.php endpoints. The country and region GET parameters are passed 
  directly into SQL queries without escaping or prepared statement binding, 
  allowing unauthenticated attackers to execute UNION-based SQL injection to 
  read arbitrary database contents including password hashes and sensitive data.
