title: Filament is a collection of full-stack components for accelerated Laravel
  development. From 4.0.0 until 4.12.5 and 5.7.5, 
  packages/panels/src/Auth/Pages/Login.php presents the multi-factor 
  authentication challenge before evaluating canAccessPanel(). For an account 
  that canAccessPanel() denies, submitting the correct password renders the MFA 
  challenge while an incorrect password returns the generic authentication 
  failure, allowing an unauthenticated attacker to confirm whether a candidate 
  password is valid for that account. When email-based MFA is configured, the 
  correct-password path also sends a login code to the account holder. The issue
  applies only to accounts that have MFA enabled and are denied panel access. 
  Authentication is not bypassed because canAccessPanel() still runs after the 
  challenge, and no session is created. This issue is fixed in versions 4.12.5 
  and 5.7.5.
