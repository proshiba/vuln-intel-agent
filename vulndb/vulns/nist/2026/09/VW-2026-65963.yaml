title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Check resize_disabled before publishing the new subbuf order\n\nring_buffer_subbuf_order_set()
  stores the new order and only then walks\nthe CPUs, returning -EBUSY if any of them
  has resizing disabled. A user\nmapped buffer has resizing disabled, and __rb_map_vma()
  reads\nbuffer->subbuf_order without buffer->mutex, so an mmap of an already\nmapped
  CPU racing the failing order change sizes the mapping with the\nnew order and inserts
  pages past the sub-buffer into the VMA.\n\nCheck the CPUs before storing the new
  order."
