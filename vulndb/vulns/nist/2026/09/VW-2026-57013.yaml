title: The Masteriyo LMS  WordPress plugin before 3.4.0 does not perform any 
  authorization check before returning a course enrolment record over its REST 
  API, allowing unauthenticated users to read any learner's enrolment status, 
  timestamps and course-progress data by walking sequential record identifiers. 
  A related gap lets any enrolled user retrieve other learners' enrolment 
  records as well.
