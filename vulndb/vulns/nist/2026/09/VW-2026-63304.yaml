title: SysReptor is a fully customizable pentest reporting platform. Prior to 
  2026.68, the password authentication flow for protected shared notes does not 
  rotate the session identifier after successful authentication, allowing 
  session fixation. An attacker who can obtain an unauthenticated SysReptor 
  session cookie, place it in a victim's browser, and know the shared-note URL 
  where the victim authenticates can reuse the fixed session after the victim 
  enters the correct password and access that shared note. The main SysReptor 
  login flow is not affected. This issue is fixed in version 2026.68.
