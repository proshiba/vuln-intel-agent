title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Unregister device notifier before IDR teardown\n\nThe requested-devices
  notifier looks up protocol fwnodes from the\nactive_protocols IDR. During remove,
  unregister the notifier before\nreleasing and destroying active_protocols so no
  notifier callback can race\nwith the IDR teardown.\n\nKeep the bus notifier registered
  until after the protocol state is torn\ndown, matching the existing remove ordering
  for SCMI bus users."
