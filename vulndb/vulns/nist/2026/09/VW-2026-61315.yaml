title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  Fix control domain removal in vfio_ap_mdev_cfg_remove\n\nThe vfio_ap_config_remove
  function uses the bitmap_andnot function to clear\nbits from the matrix_mdev->matrix.adm
  bitmap (specifies the control domains\nassigned to the mdev). This prevents the
  explicitly unplugged control\ndomains from being removed the KVM guest. The bitmap_and
  function is used\ninstead."
