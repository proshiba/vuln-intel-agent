title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  RCU-protect cl_cb_session to fix use-after-free on session teardown\n\nAfter a DESTROY_SESSION
  the per-session teardown path can free a\nsession while rpciod still holds an inflight
  callback rpc_task that\ndereferences clp->cl_cb_session.  nfsd4_probe_callback_sync()
  flushes\ncl_callback_wq, but once nfsd4_run_cb_work() has called\nrpc_call_async()
  the rpc_task lives on rpciod; flushing the workqueue\ndoes not wait for it.  rpc_shutdown_client()
  does drain rpciod tasks,\nbut uses a 1-second wait_event_timeout — tasks stuck in
  rpc_delay()\n(e.g. 2-second NFS4ERR_DELAY retries) can outlive the drain.\n\n  \
  \  destroy path                       rpciod\n    ------------                 \
  \      ------\n    unhash_session(ses)\n    nfsd4_probe_callback_sync(clp)\n   \
  \   flush_workqueue(cl_callback_wq)\n      /* returns; rpc_task still live */\n\
  \    nfsd4_put_session_locked(ses)\n    free_session(ses) -> kfree(ses)\n      \
  \                     "
