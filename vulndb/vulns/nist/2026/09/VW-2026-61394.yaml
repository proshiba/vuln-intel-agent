title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent client use-after-free during export state revocation\n\nnfsd4_revoke_export_states()
  has the same use-after-free as\nnfsd4_revoke_states(): it drops nn->client_lock
  across\nrevoke_one_stid() and the following read of clp->cl_minorversion, but\n\
  the stateid reference it holds does not pin the client.  A teardown\nracing the
  dropped lock can free the client while revoke_one_stid()\nstill dereferences it.\n\
  \nexportfs -u drives this path through NFSD_CMD_UNLOCK_EXPORT, so an\nadministrator
  removing an export can race a client expiry.\n\nSkip a client that is already expiring
  and otherwise pin it with\ncl_rpc_users under client_lock before dropping the lock,
  matching\nnfsd4_revoke_states()."
