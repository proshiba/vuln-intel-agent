title: A security flaw has been discovered in ZSPACE Q2C NAS up to 1.1.0210050. 
  Affected by this vulnerability is the function zfilev2_api.SafeStatus of the 
  file /v2/file/safe/status of the component HTTP POST Request Handler. The 
  manipulation of the argument safe_dir results in command injection. The attack
  may be performed from remote. The exploit has been released to the public and 
  may be exploited. The vendor was contacted early about this disclosure and 
  confirmed the existence of the vulnerability. A technical fix is planned to be
  released.
