title: "Apache Airflow FAB provider: the Authentik OAuth path in the FAB auth manager
  does not validate the issuer or audience claims of the id_token it accepts. An attacker
  holding a token that the same Authentik identity provider minted for a different
  client application can present it to Airflow and be authenticated as the user it
  names, because the audience claim is never checked. Affects deployments using the
  FAB auth manager with Authentik OAuth where the same Authentik instance also serves
  other applications; the attacker needs a valid token for any of those other applications,
  not for Airflow.\n\nCVE-2026-75156 corrected the same missing validation on the
  Azure AD path in this file; the Authentik path was left unchanged and is fixed here.
  Deployments that applied the CVE-2026-75156 fix and use Authentik must also upgrade
  for this one.\n\nUsers of apache-airflow-providers-fab are recommended to upgrade
  to version 3.9.0 or later, which fixes the issue."
