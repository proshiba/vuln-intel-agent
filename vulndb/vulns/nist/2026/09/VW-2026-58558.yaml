title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  fix user path of nested backing files\n\nbacking_file_open() derives the path to
  be stored in the new backing\nfile from user_file->f_path.  This is incorrect when
  user_file itself\nis a backing file, which is the case for nested stacking filesystems,\n\
  e.g. overlayfs mounts where the lowerdir of one overlayfs is the merged\ndirectory
  of another.  Since commit def3ae83da02 (\"fs: store real path\ninstead of fake path
  in backing file f_path\") the f_path of a backing\nfile holds the real path of the
  intermediate layer, not the path that\nthe user opened.\n\nCommit 924577e4f6ca (\"\
  ovl: Fix nested backing file paths\") fixed this\nfor such configurations by passing
  file_user_path() from\novl_open_realfile().  However, commit 6af36aeb147a (\"lsm:
  add\nbacking_file LSM hooks\") changed the first argument of\nbacking_file_open()
  from the user path back to the user file and\nderived the path from user_file->f_path
  again, silently re-introducin"
