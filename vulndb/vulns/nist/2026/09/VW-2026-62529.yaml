title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/cxgb4:
  Fix dereg_skb leak and double free in write_tpt_entry()\n\nWhen the device is in
  the fatal error state, write_tpt_entry() returns -EIO\nbefore handing the caller's
  preallocated skb to the transmit path; its\nallocation-failure returns do the same.
  c4iw_dereg_mr() ignores the error\nand frees mhp, leaking mhp->dereg_skb. c4iw_get_dma_mr()
  instead frees the\nskb a second time after dereg_mem() already consumed it, a double
  free.\n\nMake write_tpt_entry() the sole owner of a non-NULL skb, freeing it on\n\
  every return preceding handoff to c4iw_ofld_send(): fatal error, tpt and\nstag allocation
  failure. c4iw_ofld_send() consumes the skb on success and\nerror alike, so drop
  the redundant kfree_skb() in c4iw_get_dma_mr() after\ndereg_mem()."
