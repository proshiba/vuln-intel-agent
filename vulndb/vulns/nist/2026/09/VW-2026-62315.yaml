title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSquashfs:
  check block offset is not negative\n\nIf a negative offset is read off disk (for
  example the offset into the\ndecompressed fragment block), this will cause squashfs_copy_data()
  to\nperform an out of bounds access.\n\nFix by checking if offset is negative, and
  returning 0.  This matches\nexisting behaviour where an offset beyond the block
  returns 0 bytes\ncopied.\n\nTo trigger this out of bounds access requires a crafted
  Squashfs\nfilesystem and CAP_SYS_ADMIN to mount it.  Unprivileged users will not
  be\nable to mount such a filesystem, but once mounted, an unprivileged user\ncan
  trigger the out of bounds access by reading the crafted file with the\nnegative
  offset."
