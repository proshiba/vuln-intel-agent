title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  em28xx: fix use-after-free of dev_next->devlist on disconnect\n\nWhen a device with
  has_dual_ts=1 is probed and the is_audio_only path\nis taken, both dev and dev->dev_next
  are added to the global\nem28xx_devlist via em28xx_init_extension(). However, during
  disconnect,\nem28xx_close_extension(dev) only calls list_del(&dev->devlist), leaving\n\
  dev->dev_next->devlist still linked in the global list. When dev_next is\nsubsequently
  freed via kref_put(), its devlist entry becomes a dangling\npointer in em28xx_devlist.
  The next device probe that calls\nem28xx_init_extension() triggers a list corruption
  BUG when list_add_tail\ndetects the freed node.\n\nThis bug was exposed by commit
  a368ecde8a50 (\"USB: core: Fix duplicate\nendpoint bug by clearing reserved bits
  in the descriptor\") which clears\nreserved bits in bEndpointAddress during endpoint
  parsing. This causes\nfuzzed endpoint addresses like 0xf3 to be normalized to 0x83,
  which\n"
