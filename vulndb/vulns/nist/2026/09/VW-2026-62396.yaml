title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware_loader:
  do not queue completed sysfs fallback requests\n\nfw_load_sysfs_fallback() calls
  device_add() before adding the fw_priv to\npending_fw_head. device_add() publishes
  the fallback loading interface, so\na userspace helper which discovers the device
  by scanning sysfs can write 0\nto the loading attribute and complete the request
  before it is queued as\npending.\n\nIn that interleaving firmware_loading_store()
  calls fw_state_done() while\npending_list still points to itself, so it cannot remove
  an entry from\npending_fw_head. The subsequent unconditional list_add() then queues
  an\nalready-completed fw_priv. Once the request is released, pending_fw_head\ncan
  retain a pointer to freed memory and the next fallback request can\nfault while
