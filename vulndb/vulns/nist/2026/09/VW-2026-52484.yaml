title: An Apache-proxied Dogtag CA REST endpoint exposed by IdM (POST 
  /ca/rest/certrequests) returns HTTP 500 with internal Java stack traces for 
  unauthenticated malformed requests. The same unauthenticated error path emits 
  large multi-line stack traces into the CA debug log, creating a 
  log-amplification resource exhaustion vector (disk growth and I/O contention) 
  without requiring authentication.
