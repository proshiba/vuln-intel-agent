title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/erdma:
  Hold QP references for AE and CM processing\n\nAE QP fatal events and iWARP CM paths
  load QPs from dev->qp_xa\nand then use or reference them outside the xarray lock.\n\
  erdma_destroy_qp() can drop the destroy-path reference and free QP\nresources while
  such a lookup is in flight.\n\nAdd erdma_qp_get_by_qpn() to acquire a kref under
  the xarray\nlock with kref_get_unless_zero(). Remove the QP from the xarray\nbefore
  dropping the destroy-path reference so no new lookup can acquire\nit while destruction
  waits for existing users."
