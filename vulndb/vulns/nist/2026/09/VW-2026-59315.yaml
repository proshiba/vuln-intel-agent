title: A security vulnerability has been detected in cosmicstack-labs 
  mercury-agent up to 1.2.0. This impacts the function checkShellCommand of the 
  file src/capabilities/permissions.ts of the component Shell Command 
  Permission. The manipulation leads to incorrect privilege assignment. The 
  attack may be initiated remotely. The exploit has been disclosed publicly and 
  may be used. The project was informed of the problem early through an issue 
  report but has not responded yet.
