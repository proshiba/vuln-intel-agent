title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  caiaq: Fix potential double-free at error path\n\nThe fix for caiaq driver's resource
  management to handle the errors\ntries to release the resources in a common destructor
  call, but as a\nsashiko review for another patch suggested, some of the audio\n\
  resources such as URBs have been already freed, and this may lead to a\ndouble-free.\n\
  \nFor addressing the double-free, call the common destructor function\nfrom each
  place, and assure that the resource pointers get cleared."
