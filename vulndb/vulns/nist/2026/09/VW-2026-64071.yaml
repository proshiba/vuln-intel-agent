title: MaxKB is an open-source AI assistant for enterprise. In 2.7.0 through 
  2.10.4-lts, POST /chat/api/{application_id}/chat/{chat_id}/share_chat verifies
  that a conversation exists but does not verify that it belongs to the 
  authenticated chat_user_id or to the application bound to the caller's token. 
  An attacker with any chat token and a known victim chat_id can create an 
  unauthenticated public ChatShareLink exposing the victim's conversation and 
  can create PublicFileAccess state that makes associated files retrievable 
  without credentials, with no available revoke path. No fixed version is 
  available as of this review.
