title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix XDR length calculation in nfsd4_ff_encode_layoutget\n\nThe XDR buffer size calculation
  in nfsd4_ff_encode_layoutget() has\nmultiple errors that can result in either an
  out-of-bounds write or\nleaking uninitialized kernel memory to the client:\n\n -
  fh_len doesn't account for XDR padding on the file handle data\n - uid and gid lengths
  use \"8 + len\" but xdr_encode_opaque() actually\n   writes \"4 + xdr_align_size(len)\"\
  \ bytes\n - ds_len omits the flags and stats_collect_hint fields (8 bytes),\n  \
  \ while len's header constant overestimates by 8 bytes -- these\n   partially cancel
  but leave a net mismatch\n\nThe worst case occurs with short strings (e.g. uid=0,
  gid=0 with an\nodd-sized file handle), where the function writes up to 5 bytes past\n\
  the reserved XDR buffer. Conversely, when string lengths happen to be\n4-byte aligned,
  the reservation is too large and stale buffer content\nis sent to the client.\n\n\
  Fix this by breaking out"
