title: Mail is an internet library for Ruby designed to handle email generation,
  parsing, and sending. Prior to 2.9.1, Mail::Utilities.q_value_decode and 
  Mail::Utilities.b_value_decode used a single String#match and an overly greedy
  charset capture to decode only the first RFC 2047 encoded-word and mishandle 
  surrounding or subsequent text. A crafted malformed encoded-word in an address
  display name or local part could cross ? delimiters and make decoded From, To,
  or Reply-To header values differ from the raw values inspected by a human 
  reviewer or downstream parser, enabling apparent sender or recipient spoofing,
  phishing, or authorization-check bypass. This issue is fixed in version 2.9.1.
