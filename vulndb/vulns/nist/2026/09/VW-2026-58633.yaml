title: The Royal Addons for Elementor – Addons and Templates Kit for Elementor 
  plugin for WordPress is vulnerable to Sensitive Information Exposure in all 
  versions up to, and including, 1.7.1066 via the 'wpr_keyword' parameter. This 
  makes it possible for unauthenticated attackers to extract arbitrary postmeta 
  values from all published posts via character-by-character substring matching 
  across the entire wp_postmeta table. The required nonce is emitted publicly 
  via wp_localize_script on any frontend page that loads a Royal Elementor 
  widget, meaning no authenticated session or prior action is needed to obtain 
  it.
