title: "LaunchConfigurationBaseSerializer.scm_branch has no\n              validate_scm_branch()
  leading-dash check, unlike\n              Project/JobTemplate/JobLaunch serializers.
  Schedule and\n              WFJT Node accept --upload-pack=/bin/id as scm_branch.\n\
  \              Currently blocked at runtime by jobs.py:1502 ValueError\n       \
  \       check (defense-in-depth), but the API validation gap\n              means
  sole reliance on a task-layer guard. Refactoring\n              that guard away
  would promote this to RCE."
