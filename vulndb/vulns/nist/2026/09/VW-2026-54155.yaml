title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  pci-epf: fix use-after-free in nvmet_pci_epf_exec_iod_work()\n\nnvmet_pci_epf_exec_iod_work()
  submits an I/O command with req->execute()\nand then waits for the command to complete
  and transfers the data back\nto the host. This wait is not needed for commands that
  do not transfer\ndata from the device to the host. To decide whether that wait is
  needed,\nit reads iod->data_len and iod->dma_dir after calling req->execute().\n\
  \nHowever, once req->execute() is called, the command may complete\nasynchronously
  on another CPU. For commands that do not require a\ndevice-to-host data transfer,
  nvmet_pci_epf_queue_response() calls\nnvmet_pci_epf_complete_iod() directly, which
  can free the iod before it\nreads iod->data_len and iod->dma_dir, resulting in the
  KFENCE use-after-\nfree:\n\n BUG: KFENCE: use-after-free read in nvmet_pci_epf_exec_iod_work+0x288/0x798
  [nvmet_pci_epf]\n\n Use-after-free read at 0x00000000fdfa6d03 (in kfence-#63):"
