title: 'xmldom is a pure JavaScript W3C standard-based (XML DOM Level 2 Core) DOMParser
  and XMLSerializer module. Prior to @xmldom/xmldom versions 0.8.15 and 0.9.12, and
  in xmldom version 0.6.0 and earlier, Document.createProcessingInstruction(target,
  data) in lib/dom.js accepts an unvalidated target, while the requireWellFormed:
  true serializer checks only for a colon and the reserved case-insensitive xml name
  on 0.9.x and performs no target check on 0.8.x. Because serialization emits <?target
  data?>, a target containing >, ?, whitespace, or another invalid XML-name character
  can break the processing-instruction boundary and inject XML structure. This issue
  is fixed in @xmldom/xmldom versions 0.8.15 and 0.9.12; no fixed version is available
  for xmldom.'
