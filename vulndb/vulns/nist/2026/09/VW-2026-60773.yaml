title: 'Vulnerability in the PeopleSoft Enterprise PRTL Interaction Hub product of
  Oracle PeopleSoft (component: Enterprise Portal).   The supported version that is
  affected is 9.1. Easily exploitable vulnerability allows low privileged attacker
  with network access via HTTP to compromise PeopleSoft Enterprise PRTL Interaction
  Hub.  While the vulnerability is in PeopleSoft Enterprise PRTL Interaction Hub,
  attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in  unauthorized access to critical data
  or complete access to all PeopleSoft Enterprise PRTL Interaction Hub accessible
  data. CVSS 3.1 Base Score 7.7 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N).'
