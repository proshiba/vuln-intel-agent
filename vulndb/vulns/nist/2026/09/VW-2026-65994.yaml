title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/user_events:
  Don't destroy fields when event removal fails\n\ndestroy_user_event() destroys the
  event's fields before attempting to\nremove the trace event call. If user_event_set_call_visible()
  fails,\ne.g. because the event is still enabled and trace_remove_event_call()\n\
  returns -EBUSY, the event is left registered with an irreversibly\ndestroyed field
  list. Any subsequent interaction with the event then\noperates on an empty field
  list while it is still fully visible in\ntracefs.\n\nMove the field destruction
  after the call removal, and splice the\nfield list back onto the event when the
  removal fails so the event\nremains in a consistent state."
