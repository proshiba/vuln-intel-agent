title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm/pat:
  Acquire init_mm read lock on attribute changes to avoid UAF\n\nA previous commit
  protected against races between ptdump and CPA collapse,\nhowever one still exists
  between attribute changes and collapse as reported\nby Denis V. Lunev (linked).\n\
  \nWhen an attribute change arises, a lockless page table walker obtains a PTE\n\
  entry, which is later written to via set_pte_atomic():\n\n  ...\n  -> change_page_attr_set_clr()\n\
  \  -> __change_page_attr_set_clr()\n  -> __change_page_attr()\n\t-> _lookup_address_cpa()\n\
  \t-> lookup_address_in_pgd_attr()\n\t-> [ lockless page table walker ]\n  -> set_pte_atomic()\n\
  \nThere is nothing preventing a concurrent CPA collapse which can free the\nPTE
  that was retrieved here, resulting in a use-after-free.\n\nWith the mmap write lock
  taken on init_mm over CPA collapse, resolve this\nrace by acquiring an mmap read
  lock on init_mm over\n__change_page_attr_set_clr().\n\nThis locks across the whole
  operation ov"
