title: Concrete CMS Area API's block-create endpoint in versions 9.2.0 to 9.5.2 
  did not invoke the block type controller's validate() method on submitted 
  data, which, for file-referencing blocks such as hero_image and gallery, is 
  where the referenced file is authorized against the user's file-manager 
  visibility. As a result, an authenticated user holding the block-add scope 
  could store, and cause the page to render, a reference to a file that the 
  file-manager authorization policy would otherwise reject, disclosing that 
  file's URL and preview to the editor and to visitors of the affected page. 
  Under public file storage, the URL and thumbnail are exposed directly; under 
  private storage, the disclosure is limited by the permission-checked download 
  URL. The Concrete CMS security team gave this vulnerability a CVSS v4.0 score 
  of 5.1 with vector 
  CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:L/VA:L/SC:N/SI:N/SA:N. Thanks 
  riodrwn for reporting.
