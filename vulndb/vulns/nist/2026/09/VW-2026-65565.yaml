title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  addrconf: fix temp address generation after prefix deprecation\n\nWhen a router
  temporarily deprecates an IPv6 prefix (either by sending a\nRouter Advertisement
  with Preferred Lifetime = 0 or by letting the\nlifetime expire) and later restores
  it, the kernel permanently loses its\nability to generate temporary privacy addresses
  (RFC 8981) for that\nprefix.\n\nThis happens because the address worker attempts
  to generate a\nreplacement temporary address when the current one nears expiration.
  As\nthe base prefix is deprecated already, the generation fails after\nmarking the
  temporary address as already having spawned a replacement\n(ifp->regen_count++).\n\
  \nWhen the router eventually restores the prefix, the temporary address\nbecomes
  active again. However, once it naturally expires, the address\nworker sees this
  temporary address already tried to generate one and\nskips the regeneration.\n\n\
  Fix the issue by resetting the regen_count "
