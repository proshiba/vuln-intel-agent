title: ITFlow provides an IT documentation, ticketing and accounting system for 
  small managed service providers. Prior to version 26.07, an authenticated user
  with module_support write permission and access to a credential record can 
  perform time-based blind SQL injection through the expires parameter of the 
  share_generate_link handler in agent/ajax.php. sanitizeInput applies 
  string-context escaping, but expires is inserted unquoted into the 
  item_expire_at MySQL INTERVAL expression, allowing a crafted expression and 
  interval unit to execute conditional database queries whose results are 
  inferred from response delays. This can expose password hashes, SMTP 
  credentials, API keys, encrypted vault data, and database metadata and support
  administrative takeover after credential cracking. This issue is fixed in 
  version 26.07.
