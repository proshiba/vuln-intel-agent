title: An access control vulnerability was discovered in the Credentials Manager
  functionality due to insufficient validation of user privileges. A remote 
  authenticated user with limited privileges can view a limited subset of the 
  available entries in the Credentials Manager. The actual credential values are
  not directly visible, but the user can delete entries or edit their 
  properties. An attacker who deletes or edits an entry can disrupt 
  authentication for dependent devices, and one who manipulates an entry's 
  configuration may be able to indirectly obtain the credentials.
