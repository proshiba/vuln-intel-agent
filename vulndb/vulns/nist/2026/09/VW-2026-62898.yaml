title: The Booking for Appointments and Events Calendar – Amelia plugin for 
  WordPress is vulnerable to unauthorized access and modification of data due to
  a missing ownership verification on /users/customers/<id> endpoint  in all 
  versions up to, and including, 2.4.4. This makes it possible for authenticated
  attackers, with wpamelia-provider role, to view and modify arbitrary 
  customers, including password reset. Takeover of WordPress user accounts, with
  the roles up to Editor, is also possible if that user had made an Amelia 
  booking. This vulnerability affects only the Premium version of the plugin, 
  where the Employee Panel is present.
