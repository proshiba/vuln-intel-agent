title: A flaw has been found in subhajitkhan online-clinic-management-system up 
  to e9ee77a8827a1446220fa07ee693dc4d9a29a578. Affected by this vulnerability is
  the function session_start of the file adminappview.php. Executing a 
  manipulation of the argument adminmail can lead to authorization bypass. The 
  attack may be launched remotely. The exploit has been published and may be 
  used. This product operates on a rolling release basis, ensuring continuous 
  delivery. Consequently, there are no version details for either affected or 
  updated releases. The project was informed of the problem early through an 
  issue report but has not responded yet.
