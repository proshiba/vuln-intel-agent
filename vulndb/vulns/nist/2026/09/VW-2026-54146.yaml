title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex/pi:
  Reject cross-mm private futex owners\n\nA private futex key borrows the waiter's
  mm without taking an mm_users\nreference. Nevertheless, attach_to_pi_owner() currently
  accepts an owner\nfrom a different address space and copies the private key into
  the owner's\nPI state.\n\nWhen that owner exits, exit_pi_state_list() uses the saved
  key to find the\nhash bucket and acquires a reference to the waiter's private hash.
  If the\nlast user of the waiter's mm exits concurrently, futex_hash_free() frees\n\
  the hash while the owner still uses its bucket and reference.\n\nPrevent this by
  validating in attach_to_pi_owner() that, for private\nfutexes, the owner mm and
  waiter mm are the same. Perform the check with\nthe owner's pi_lock held and after
  validating owner::futex::state to\nserialize against a concurrent PI-state exit
  cleanup.\n\n[ tglx: Amended comment ]"
