title: An out-of-bounds read in the BSON decoding component of the MongoDB PHP 
  driver may allow an unauthenticated party who supplies specially formed input 
  to have a small amount of adjacent process memory copied into an error message
  that is returned to application code. This may result in unintended disclosure
  of limited memory contents.
