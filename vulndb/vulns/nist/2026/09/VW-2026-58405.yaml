title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  bound page_lcns[] index by the log record\n\nThe copy_lcns loop and the redo shorten
  loop index page_lcns[] at j + i,\nwhere i runs up to the log record's lcns_follow.
  That count is checked only\nagainst the record's own length, not the target entry,
  so check_dp_table()\n(which validates the entry's lcns_follow) does not cover it:
  the copy_lcns\nentry may even be freshly allocated after that check, and find_dp()
  bounds j\nbut not i. A crafted record thus overflows page_lcns[] of an otherwise
  valid\nentry.\n\nAdd dp_range_ok() and reject, before each loop, any record whose
  run does\nnot fit the entry. These are the only two page_lcns[] accesses indexed
  by\nthe record rather than the entry, so together with the entry validation\nevery
  access is now bounded.\n\n[almaz.alexandrovich@paragon-software.com: original patch
  contained changes to the problem already handled, applied partly]"
