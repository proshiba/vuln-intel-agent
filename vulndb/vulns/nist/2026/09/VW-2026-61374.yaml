title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB read / stack overflow in rtw_get_wps_attr()\n\nrtw_get_wps_attr()
  walks WPS attributes inside a WPS IE taken from\na wireless management frame. For
  each candidate attribute it only\nchecks that the fixed 4-byte attribute header
  (2-byte ID + 2-byte\nlength) fits inside the IE:\n\n\tif (attr_ptr + 4 > wps_ie
  + wps_ielen)\n\t\tbreak;\n\tu16 attr_id = get_unaligned_be16(attr_ptr);\n\tu16 attr_data_len
  = get_unaligned_be16(attr_ptr + 2);\n\tu16 attr_len = attr_data_len + 4;\n\nattr_data_len
  (and therefore attr_len) is read directly from the\nwire and is never checked against
  the remaining bytes in the IE\nbefore being used as the size of:\n\n\tmemcpy(buf_attr,
  attr_ptr, attr_len);\n\nSince attr_len is fully attacker controlled (0 to 65535+4),
  this is\nboth a heap OOB read of wps_ie, and, more seriously, a stack buffer\noverflow
  at several call sites where buf_attr is a single-byte\nstack variable, e.g. rtw_get_wps_attr_cont"
