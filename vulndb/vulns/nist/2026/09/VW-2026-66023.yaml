title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: fix TX descriptor availability check for TSO traffic\n\nstmmac_tso_xmit()
  estimates the number of free TX descriptors required by\na TSO skb as:\n\n\t(skb->len
  - proto_hdr_len) / TSO_MAX_BUFF_SIZE + 1\n\nwhich assumes the payload is split into
  TSO_MAX_BUFF_SIZE chunks. This\nunderestimates the descriptors actually consumed
  by stmmac_tso_allocator(),\nsince each fragment is mapped individually and so it
  needs at least one\ndescriptor regardless of its size. Moreover, one descriptor
  is used for\nthe L2/L3/L4 headers and, when the MSS changes, one more is consumed
  for\nthe MSS context descriptor.\nFor a highly fragmented TSO skb the check can
  therefore pass even when the\nring has too few free slots. stmmac_tso_allocator()
  then writes past the\navailable descriptors, overwriting descriptors still owned
  by the DMA\nengine, corrupting the TX ring.\nAdd stmmac_tso_get_num_desc() to compute
  the exact number of descriptors\nneeded "
