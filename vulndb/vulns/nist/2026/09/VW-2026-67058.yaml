title: "Obot is an open-source AI agent/MCP platform. In all versions up to and including
  commit d7e6970, the Docker quickstart command documented in the README starts the
  container listening on 0.0.0.0:8080 with authentication disabled by default. When
  authentication is disabled, every request is mapped to a synthetic \"nobody\" user
  that holds the Owner and Admin roles, so any unauthenticated party who can reach
  the exposed port obtains full administrative access to the Obot API and UI, including
  the ability to register and launch attacker-controlled MCP servers. Because the
  quickstart also mounts /var/run/docker.sock into the container, the MCP runtime
  backend reachable this way has access to the host's Docker control surface. The
  fix is documentation-only: the quickstart now enables authentication, and operators
  who followed the previous instructions should set OBOT_SERVER_ENABLE_AUTHENTICATION=true
  before exposing the host to any untrusted network."
