title: Warpgate is an open source SSH, HTTPS and MySQL bastion host for Linux. 
  From 0.25.0 until 0.27.6, the browser SSH path in 
  warpgate-web-ssh/src/manager.rs handles RCEvent::HostKeyUnknown without the 
  presenting hop identity and instead passes ssh_options.host and 
  ssh_options.port for the final target to KnownHosts::trust. In Prompt and 
  AutoAccept modes, a jump host key can therefore be stored for the target 
  address. A machine later presenting the jump host key at the target address 
  can be accepted as the target, allowing interception of user traffic and a 
  newly issued certificate when certificate authentication is used. The native 
  SSH path is unaffected because it tracks each hop separately. This issue is 
  fixed in version 0.27.6.
