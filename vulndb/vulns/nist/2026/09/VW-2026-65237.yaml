title: A security vulnerability has been detected in O2OA up to 9.5.3/10.0.2. 
  This vulnerability affects the function list of the file 
  o2server/x_base_core_project/src/main/java/com/x/base/core/project/connection/CipherConnectionAction.java
  of the component Cipher Connection Handler. Such manipulation of the argument 
  fileUrl leads to information disclosure. It is possible to launch the attack 
  remotely. The exploit has been disclosed publicly and may be used. The vendor 
  was contacted early about this disclosure but did not respond in any way.
