title: "The experimental USB host stack allocates a per-device configuration-descriptor
  buffer, udev->cfg_desc, from the dedicated usb_device_heap in usbh_device_set_configuration()
  (subsys/usb/host/usbh_device.c). On three failure paths — a failed full-length GET_DESCRIPTOR(CONFIGURATION)
  read, a mismatch between the short and full descriptor reads, and a rejected descriptor
  in parse_configuration_descriptor() — the buffer was released with k_heap_free()
  but the pointer was left dangling. The cleanup in usbh_device_free() is guarded
  only by if (udev->cfg_desc != NULL), so it frees the same block a second time.\n\
  \nThe path is driven entirely by the attached peripheral: usbh_device_connect()
  calls usbh_device_init(), which ends in usbh_device_set_configuration(), and on
  failure usbh_device_connect() calls usbh_device_free(). On v4.4.x this happens during
  the same enumeration, with no unplug required; on v4.1.0–v4.3.x the second free
  instead arrives via dev_removed_handler()/dev_connected_handler("
