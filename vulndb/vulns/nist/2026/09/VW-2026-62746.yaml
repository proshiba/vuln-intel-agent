title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  rt700-sdw: always drain jack work on remove\n\nrt700_sdw_remove() drains jack_detect_work
  and jack_btn_check_work only\nwhen rt700->hw_init is true. That state bit is cleared
  by\nrt700_update_status() when the SoundWire slave becomes UNATTACHED, but a\njack
  work item can already have been queued by rt700_interrupt_callback()\nor rt700_jack_init()
  while the device was initialized.\n\nDo not use hw_init as the remove-time guard
  for draining these work\nobjects. The delayed works are initialized during rt700_init(),
  so remove\ncan cancel them unconditionally and pair the object lifetime with the\n\
  codec-private data lifetime instead of a mutable hardware state bit.\n\nThis issue
  was found by our static analysis tool and then confirmed by\nmanual review of the
  SoundWire status, interrupt and remove paths. The\nremove path should drain work
  based on whether the work object exists, not\non a runtime hardware state bit that
  can change "
