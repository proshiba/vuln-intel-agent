title: "The Directorist: AI-Powered Business Directory, Listings & Classified Ads
  WordPress plugin before 8.9.5 does not properly verify a listing's ownership before
  deleting it, allowing authenticated attackers with Subscriber-level access and above
  to delete arbitrary listings, including ones belonging to other users.\n\nThis is
  an incomplete fix of CVE-2023-1889 / CVE-2023-35052: a separate, unaddressed listing-deletion
  path allows the same impact, from at least version 3.1.0 through the current release."
