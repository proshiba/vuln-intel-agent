title: A vulnerability was detected in taosir WTCMS up to 
  01a5f68a3dfc2fdddb44eed967bb2d4f60487665. Impacted is the function fetch of 
  the file /index.php. Performing manipulation of the argument content results 
  in code injection. It is possible to initiate the attack remotely. The exploit
  is now public and may be used. This product is using a rolling release to 
  provide continious delivery. Therefore, no version details for affected nor 
  updated releases are available. The vendor was contacted early about this 
  disclosure but did not respond in any way.
