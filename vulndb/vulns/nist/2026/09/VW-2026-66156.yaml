title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/rt,dl:
  Skip migrate-disabled tasks when picking a push candidate\n\nA migrate_disable()'d
  RT task cannot be moved to another CPU, but the\nscheduler still keeps such a task
  on that CPU's pushable list\n(rq->rt.pushable_tasks) and still marks the runqueue
  RT-overloaded\n(rq->rt.overloaded = 1). So the RT balancer keeps treating this CPU
  as\nhaving a task to move away, and keeps trying to move the task, but the\npush
  can never succeed. When the head is pinned, push_rt_task() does not\ngive up either.
  It falls back to pushing rq->curr instead, using the\nper-CPU stopper, as added
  by commit a7c81556ec4d (\"sched: Fix\nmigrate_disable() vs rt/dl balancing\").\n\
  \nThe CPU spends tens of milliseconds in this retry loop. The core is\nisolated
  for real-time work, but during the loop nearly half of its time\nis consumed by
  pushes that cannot succeed.\n\nAn ftrace capture of the affected CPU, with sched_switch
  enabled and\ncommit 94894c9c477e"
