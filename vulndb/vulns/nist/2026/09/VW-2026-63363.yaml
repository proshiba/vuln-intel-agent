title: CordysCRM is an open source AI-powered customer relationship management 
  system that supports private deployment. Prior to 1.7.0, the POST 
  /account-pool/page endpoint allows an authenticated caller with 
  MODULE_SETTING:UPDATE to place a crafted sort.name value into a dynamic SQL 
  ORDER BY expression without strict server-side validation of the sorting 
  field. The resulting time-based blind SQL injection can confirm database 
  expression execution, infer database metadata and sensitive values, and 
  introduce database delays that degrade service. This issue is fixed in version
  1.7.0.
