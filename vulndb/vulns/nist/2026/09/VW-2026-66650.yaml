title: SiYuan before v3.8.4 contains an authorization omission in the siyuan-get
  IPC handler that allows remote-kernel renderers to access native clipboard 
  formats by invoking clipboardReadMathML, clipboardReadOffice, and 
  clipboardReadWPS commands with matching plaintext. Attackers controlling 
  remote renderer content can obtain MathML formulas, Office bytes, and WPS 
  bytes from local clipboard during user-mediated paste operations.
