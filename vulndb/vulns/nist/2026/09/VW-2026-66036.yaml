title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  reset HTB scheduler topology before freeing queues\n\nHTB offload programs NIX_AF_TLxX_TOPOLOGY
  on QoS-allocated scheduler\nqueues via otx2_qos_txschq_set_parent_topology(), but
  teardown freed\nthose queues without clearing TOPOLOGY.  The AF only restores PARENT
  and\nSCHEDULE on free, so PRIO_ANCHOR/RR_PRIO settings can survive in the\nshared
  scheduler pool and affect later allocations.\n\nAdd otx2_qos_reset_schq_topology()
  and otx2_qos_free_hw_schq() to zero\nTL4 through TL2 TOPOLOGY before each schq is
  returned to the AF during\nhierarchy teardown and cfg rollback.  Skip the aggregation
  level (TL1):\nit is a per-tx-link queue shared by the PF, default Tx hierarchy and
  VFs,\nand is not freed back to the AF by nix_txschq_free_one()."
