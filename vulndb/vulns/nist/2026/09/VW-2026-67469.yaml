title: "The native BSD-socket layer recorded a pending asynchronous socket error by
  type-punning it into struct net_context's void user_data field (ctx->user_data =
  INT_TO_POINTER(-status) in zsock_accepted_cb(), zsock_received_cb(), zsock_connected_cb()
  and zsock_close_ctx() in subsys/net/lib/sockets/sockets_inet.c), reading it back
  with POINTER_TO_INT(). That same field is owned by the network stack for listening
  TCP contexts: net_tcp_accept() stores the parent context pointer there and the TCP
  core passes it back to the registered accept callback. A failed accept therefore
  left a small integer (an errno value) where the stack expected a struct net_context
  .\n\nWhen the network interface carrying a listening TCP socket goes down, close_tcp_conn()
  in subsys/net/ip/tcp.c invokes the accept callback with -ENETDOWN and the context's
  user_data. In v4.3.0 the callback was not disarmed afterwards, so a second interface-down
  event forwarded the previously stored errno to zsock_accepted_cb(), which der"
