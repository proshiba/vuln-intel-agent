title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrtc:
  pcf8563: fix clock provider leak on unbind\n\npcf8563_clkout_register_clk() registers
  the CLKOUT clock provider with\nof_clk_add_provider(), but nothing ever unwinds
  it: there is no\nof_clk_del_provider() call and the driver has no remove callback.
  Each\nof_clk_add_provider() allocates a struct of_clk_provider, takes a\nreference
  on the OF node and adds an entry to the global of_clk_providers\nlist, none of which
  is released when the device is unbound. Every\nbind/unbind (or module reload) therefore
  leaks a provider structure and\nan of_node reference.\n\nThe clock itself is already
  device-managed (devm_clk_register()); only\nthe provider registration was not. Use
  devm_of_clk_add_hw_provider() so\nthe provider is removed automatically on unbind.
  Tie it to the parent\ni2c device, whose OF node carries the #clock-cells and clock-output-names\n\
  properties (the RTC class device has no OF node of its own)."
