title: 'ClawHub (openclaw/clawhub application/backend) contains a missing authorization
  check in the changelog preview feature. A signed-in caller can invoke the public
  skills:generateChangelogPreview action for a skill they are not authorized to access;
  the previous version is read without the file-read authorization enforced on normal
  content access, and up to 8,000 characters of quarantined content may be submitted
  to the AI provider and reflected in the preview returned to the caller, disclosing
  restricted skill content. The issue was confirmed at revision cbfee7343ddc867316dd9b3de6fa8856730f9f41;
  the complete historical affected range was not established. It is fixed by PR #3682,
  included in revision 8c2de6c506bb4efabe3f0c2ffb8370b9e23d4650, which was deployed
  to clawhub.ai on 2026-09-11; self-hosted deployments should update to that revision
  or a later descendant. The npm CLI and OpenClaw runtime are separate products and
  are not affected.'
