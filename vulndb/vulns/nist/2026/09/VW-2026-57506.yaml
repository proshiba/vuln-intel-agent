title: "Improper neutralization of directives in dynamically evaluated code ('eval
  injection') vulnerability in Apache Camel K.\n\n\n\nAn improper neutralization of
  directives in dynamically evaluated Maven configuration allows tenant-controlled
  repository content to influence code execution within the operator pod, potentially
  enabling tenants to execute arbitrary code with the privileges of the operator.\n\
  \n\n\nThis issue affects Apache Camel K: from 2.0.0 before 2.9.3, from 2.10.1 before
  2.10.2.\n\n\n\nUsers are recommended to upgrade to version 2.9.3, 2.10.2 or 2.11.0,
  which fixes the issue."
