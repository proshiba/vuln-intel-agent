title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/kmemleak:
  avoid soft lockup when scanning task stacks\n\nPatch series \"mm/kmemleak: avoid
  soft lockup when scanning task\", v3.\n\nkmemleak_scan() scans every task stack
  under one rcu_read_lock() with no\nreschedule point, which can trip the soft lockup
  watchdog on hosts with\nvery many threads.\n\nThat prints the following message,
  depending on the workload+host\nconfiguration:\n\n      watchdog: BUG: soft lockup
  - CPU#35 stuck for 22s! [kmemleak:537]\n       scan_block\n       kmemleak_scan\n\
  \       kmemleak_scan_thread\n       kthread\n\nPatch 1 walks the tasks with find_ge_pid()
  so the scan reschedules between\ntasks\n\nPatches 2-3 let the scan loops stop early
  once a scan is interrupted.\n\n\nThis patch (of 3):\n\nkmemleak_scan() walks every
  thread and scans its kernel stack under a\nsingle rcu_read_lock() with no reschedule
  point.  On a host with very many\nthreads -- amplified by KASAN/lockdep in debug
  builds -- this loop can hog\na CPU "
