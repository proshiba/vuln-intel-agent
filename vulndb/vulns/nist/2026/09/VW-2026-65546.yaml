title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  validate index entry key bounds\n\n[BUG]\nA malformed NTFS directory index entry
  can advertise a key_size larger\nthan the bytes actually present in its NTFS_DE
  payload. Directory lookup\nthen passes that malformed key to cmp_fnames(), which
  can read past the\nend of the kmalloc'ed index buffer.\n\nBUG: KASAN: slab-out-of-bounds
  in fname_full_size fs/ntfs3/ntfs.h:590 [inline]\nBUG: KASAN: slab-out-of-bounds
  in cmp_fnames+0x1ea/0x230 fs/ntfs3/index.c:46\nRead of size 1 at addr ffff88801c313018
