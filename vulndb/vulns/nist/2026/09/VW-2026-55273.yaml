title: In affected Snowflake drivers, WORKLOAD_IDENTITY authentication requests 
  a cloud workload-identity token and attaches it to the login request without 
  verifying that the configured host is a Snowflake endpoint. An attacker who 
  can modify the connection configuration can cause the driver to mint a fresh 
  attestation and send it to a host they control. The captured token can be 
  replayed to Snowflake for its remaining lifetime in accounts where that 
  workload identity is already registered. On Azure, the token audience is also 
  taken from connection configuration. Combined with an attacker-controlled 
  host, the driver can request a Managed Identity access token scoped to a 
  non-Snowflake Azure resource and deliver it to the attacker. That path is the 
  only case in which impact extends beyond Snowflake; it is bounded by the token
  lifetime and the managed identity’s permissions. Successful exploitation 
