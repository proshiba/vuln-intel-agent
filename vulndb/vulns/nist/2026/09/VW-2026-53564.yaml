title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Check sk_state before sk_protocol in bpf_tcp_*_syncookie\n\nbpf_tcp_gen_syncookie
  and bpf_tcp_check_syncookie accept a socket pointer\n'sk' with argument type ARG_PTR_TO_BTF_ID_SOCK_COMMON.
  However, they access\nsk->sk_protocol without validating whether 'sk' represents
  a full socket.\n\nFix this issue by checking sk->sk_state != TCP_LISTEN before inspecting\n\
  sk->sk_protocol in both bpf_tcp_gen_syncookie and bpf_tcp_check_syncookie.\nSince
  mini-sockets are never in the TCP_LISTEN state, the condition\nshort-circuits and
  prevents dereferencing fullsock-specific fields."
