title: "A security vulnerability has been detected in dromara orion-visor up to 2.5.7.
  This affects the function HostKeyServiceImpl.encryptKey of the file orion-visor-modules/orion-visor-module-asset/orion-visor-module-asset-service/src/main/java/org/dromara/visor/module/asset/service/impl/HostKeyServiceImpl.java.
  The manipulation leads to use of hard-coded cryptographic key\r . The attack is
  possible to be carried out remotely. The exploit has been disclosed publicly and
  may be used. The project was informed of the problem early through an issue report
  but has not responded yet."
