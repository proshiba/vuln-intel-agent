title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmpls:
  reload header after pskb_may_pull()\n\nmpls_select_multipath() calls mpls_multipath_hash()
  to choose a nexthop\nwhen an MPLS route has multiple nexthops.  While walking the
  MPLS label\nstack, the hash routine caches hdr for the current label.  After finding\n\
  the bottom-of-stack label, it calls pskb_may_pull() before reading the\ninner IP
  header.\n\nIf an skb is constructed with the inner IP header in nonlinear data and\n\
  insufficient tailroom in the linear head, pskb_may_pull() calls\npskb_expand_head()
  to replace the skb head and free the old one.  This\nleaves hdr pointing to freed
  memory.  The IPv6 path can invalidate hdr\nagain when it performs a second pull
  for the larger header.\n\nThe issue was found through static analysis.  A reproducer
  sending a legal\nGeneve packet through a bareudp/MPLS multipath setup triggered
  the same\nKASAN report in 2 of 2 unpatched runs:\n\n  BUG: KASAN: slab-use-after-free
  in mpls_select_multipa"
