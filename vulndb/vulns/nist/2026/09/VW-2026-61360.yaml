title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/core:
  handle region split failure in apply_min_nr_regions()\n\ndamon_apply_min_nr_regions()
  repeatedly split each region until its size\nbecomes small enough to meet the user-defined
  low limit of the number of\nregions.  The loop assumes the split operation (damon_split_region_at())\n\
  will always succeed and create the new region.  But the operation could\nsilently
  fail for memory allocation failures, for example.\n\nIf such failure happens and
  the region was the last region, the linked\nlist-based next region fetching returns
  invalid pointer.  As a result,\ninvalid memory dereference and corruption could
  happen.  Even if the\ncorner case is handled, it imposes stress to the allocator
  by trying split\nregions for other targets.  Fix the issue by breaking all the loops
  for\nany region split failure.\n\nThis means there could be a min_nr_regions violation.\
  \  It will only rarely\nhappen since the allocation is arguably too small "
