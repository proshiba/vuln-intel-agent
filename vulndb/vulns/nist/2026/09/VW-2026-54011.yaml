title: The Grav Form plugin (getgrav/grav-plugin-form) versions 8.0.6 through 
  9.1.19 select the reCAPTCHA version to validate based solely on which response
  field key is present in the submitted payload. On a site configured for 
  reCAPTCHA v3, an anonymous attacker can place their v3 token under the v2 
  field name (g-recaptcha-response instead of token), causing validation to use 
  the v2 branch, which never applies the score threshold or verifies the 
  expected action. This results in a complete bypass of reCAPTCHA v3 bot 
  protection. The issue is fixed in version 9.1.20.
