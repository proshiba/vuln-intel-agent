title: OpenClaw's Matrix integration (npm package @openclaw/matrix) versions >= 
  2026.2.2 and < 2026.8.1 lowercase complete Matrix user IDs — including 
  historical localparts and the case-sensitive server-name portion — when 
  deriving the OpenClaw authorization identity. As a result, distinct 
  authenticated Matrix accounts can normalize to the same authorization 
  identity. A Matrix participant controlling a colliding account identifier (a 
  protocol-valid identifier that differs from the configured one only by 
  characters OpenClaw case/Unicode folds; display-name matching is not required)
  can inherit allowlist, owner-command, exec-approval, or plugin-approval 
  authority configured for another account. The issue is fixed in 2026.8.1.
