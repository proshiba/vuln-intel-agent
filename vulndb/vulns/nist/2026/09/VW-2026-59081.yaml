title: "Improper Encoding or Escaping of Output vulnerability in Apache Syncope.\n\
  \n\n\nAuthenticated users can store a spreadsheet formula payload in one of their
  own plain attributes. When such users are included in a CSV export and the generated
  CSV file is opened by a spreadsheet application, the formula may be executed.\n\n\
  \n\n\n\nThis issue affects Apache Syncope: from 3.0.0-M0 through 3.0.16, from 4.0.0-M0
  Through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\nUsers are recommended to upgrade
  to version 4.0.8 / 4.1.3, which fix this issue."
