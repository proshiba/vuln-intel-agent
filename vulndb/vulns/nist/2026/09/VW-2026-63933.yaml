title: Hatchet is a platform for orchestrating background tasks, AI agents, and 
  durable workflows at scale. Prior to 0.91.1, the SNS UnsubscribeConfirmation 
  handler in internal/integrations/ingestors/sns/sns.go calls http.Get() on 
  payload.UnsubscribeURL after VerifyPayload() even though BuildSignature() 
  excludes UnsubscribeURL, allowing an authenticated Hatchet tenant to replace 
  that field in an otherwise valid AWS-signed message with an internal URL. The 
  server-side request can reach EC2 Instance Metadata Service, internal 
  services, and internal HTTP APIs, potentially exposing IAM credentials or 
  network-accessible data and functionality. This issue is fixed in version 
  0.91.1.
