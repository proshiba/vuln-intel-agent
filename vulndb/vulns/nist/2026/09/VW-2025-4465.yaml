title: "An authentication bypass in the Palo Alto Networks PAN-OS software enables
  an unauthenticated attacker with network access to the management web interface
  to bypass the authentication otherwise required by the PAN-OS management web interface
  and invoke certain PHP scripts. While invoking these PHP scripts does not enable
  remote code execution, it can negatively impact integrity and confidentiality of
  PAN-OS.\n\nYou can greatly reduce the risk of this issue by restricting access to
  the management web interface to only trusted internal IP addresses according to
  our recommended  best practices deployment guidelines https://live.paloaltonetworks.com/t5/community-blogs/tips-amp-tricks-how-to-secure-the-management-access-of-your-palo/ba-p/464431
  .\n\nThis issue does not affect Cloud NGFW or Prisma Access software."
