title: "Apache Karaf's shell/SSH command security is enforced by per-scope ACL configuration
  files (etc/org.apache.karaf.command.acl.<scope>.cfg). SecuredSessionFactoryImpl.checkSecurity() resolves
  the roles required for an invocation and, when no ACL rule matches the command,
  fails open: ACLConfigurationParser.Specificity.NO_MATCH sets passCheck = true. The
  safety valve for this, karaf.secured.command.compulsory.roles, ships commented out
  in etc/system.properties, so an unmatched command is allowed for any authenticated
  user.\n\n\nThe shipped org.apache.karaf.command.acl.config ACL (assemblies/features/standard/src/main/feature/feature.xml,
  mirrored into instance/.../etc/org.apache.karaf.command.acl.config.cfg) has no install entry.
  It restricts delete to admin, restricts edit/property-*/update on the jmx.acl.*, org.apache.karaf.command.acl.* and org.apache.karaf.service.acl.* PIDs
  to admin, and allows manager for everything else, but config:install was simply
