title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  clear cp_flags bits individually in rds_conn_path_reset()\n\nrds_conn_path_reset()
  wipes the whole flag word with a plain\ncp->cp_flags = 0 store.  Every other accessor
  of that word uses\natomic bitops, and some of them can run concurrently with the
  reset:\nRDS_LL_SEND_FULL is set from rds_send_xmit() and cleared from the\ntransport
  completion paths, neither of which holds anything that\nexcludes the shutdown worker.\
  \  A plain store racing an atomic\nread-modify-write on the same word is a data
  race, and whichever\nside loses has its update silently discarded.\n\nClear the
  two bits the reset is actually responsible for instead.\nRDS_IN_XMIT and RDS_RECV_REFILL
  need no store at all here: they\nbelong to the caller, rds_conn_shutdown(), which
  waits for both to be\nclear before calling the transport shutdown and this reset.\n\
