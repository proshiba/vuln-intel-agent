title: NanoSVG commit 239e102ec contains an incorrect numeric conversion 
  vulnerability in the rasterizer's nsvg__addActive() function. A specially 
  crafted SVG document containing sufficiently large geometry coordinates can 
  cause fixed-point-scaled edge coordinates to exceed the range representable by
  int. The rasterizer subsequently converts these values to int without range 
  validation, resulting in undefined behavior and possible process termination, 
  leading to denial of service.
