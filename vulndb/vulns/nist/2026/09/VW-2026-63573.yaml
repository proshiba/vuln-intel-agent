title: Suricata before 8.0.7 has a DoH2 type confusion that can cause an invalid
  free, because cleanup code for the HTTP2 state is executed even though the 
  actual state is HTTP1 (when there is a DoH2 request with an HTTP1 to HTTP2 
  upgrade). This requires app-layer.protocols.doh2 to be enabled, which is the 
  default in 8.x versions.
