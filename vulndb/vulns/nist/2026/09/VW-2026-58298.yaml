title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/ucma:
  Lock the handler in ucma_set_ib_path()\n\nucma_set_ib_path() calls ucma_event_handler()
  straight from the write()\npath, without the handler lock that keeps ctx->file stable
  while a uevent\nis queued.  The handler re-reads ctx->file for every dereference:\n\
  \n\tmutex_lock(&ctx->file->mut);\t\t\t/* file A */\n\tlist_add_tail(&uevent->list,
  &ctx->file->event_list);\t/* file B */\n\tmutex_unlock(&ctx->file->mut);\t\t\t/*
  file B */\n\twake_up_interruptible(&ctx->file->poll_wait);\t/* file B */\n\nA concurrent
  ucma_migrate_id() reassigns ctx->file while the SET_OPTION\ncaller sleeps in mutex_lock(),
  so the list_add_tail() lands on file B's\nevent_list while only file A's mutex is
  held, racing every other user of\nthat list:\n\n  BUG: KASAN: slab-use-after-free
  in __list_add_valid_or_report+0x1aa/0x1c0\n  Read of size 8 at addr ffff888153c6a418
  by task poc_corr/486\n  Call Trace:\n   __list_add_valid_or_report+0x1aa/0x1c0\n\
  \   ucma_event_handler+"
