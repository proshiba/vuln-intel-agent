title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  pci-epf: put CQ ref on create_cq mapping failure\n\nnvmet_pci_epf_create_cq() calls
  nvmet_cq_create(), which takes a\nreference on the controller and installs the completion
  queue. If the\nsubsequent PCI address-space mapping fails or returns a too-small
  partial\nmapping, the function jumps to err_internal / err_unmap_queue without\n\
  calling nvmet_cq_put(). The matching put in nvmet_pci_epf_delete_cq() is\ngated
  on NVMET_PCI_EPF_Q_LIVE, which is only set after the mapping\nsucceeds, so teardown
  never releases these references. A remote PCI host\nthat drives Create IO CQ commands
  with a failing PRP1/pci_addr therefore\nleaks the CQ and a controller reference
  on each attempt.\n\nDrop the CQ reference on the mapping-failure paths. The err_internal
  and\nerr_unmap_queue labels are only reachable after nvmet_cq_create() has\nsucceeded,
  so this pairs the create/put correctly."
