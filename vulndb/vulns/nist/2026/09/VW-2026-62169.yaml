title: "In the Linux kernel, the following vulnerability has been resolved:\n\nslip:
  remove slip_hangup() to fix use-after-free in slip_receive_buf()\n\nJaeyoung Chung
  and Eulgyu Kim reported a slab-use-after-free read\nin slip_receive_buf() when racing
  against tty hangup.\n\ntty_ldisc_hangup() calls ld->ops->hangup() while holding
  only\na read lock on tty->ldisc_sem (via tty_ldisc_ref()).\nBecause slip_hangup()
  simply called slip_close(), it ran concurrently\nwith reader functions such as slip_receive_buf().\n\
  \nslip_close() unregisters and frees the net device and its private\nstruct slip,
  causing concurrent reader threads in slip_receive_buf()\nto dereference freed memory.\n\
  \nLine discipline close() is already guaranteed to be called under\nthe write lock
  of tty->ldisc_sem during hangup processing\n(in tty_ldisc_reinit() or tty_ldisc_kill()).\n\
  \nRemove slip_hangup() so teardown is serialized cleanly by slip_close()."
