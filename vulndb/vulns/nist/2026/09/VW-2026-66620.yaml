title: Flowise through 3.1.4 exposes GET /api/v1/upsert-history/:id and PATCH 
  /api/v1/upsert-history without route-level permission checks, and the backing 
  service performs no workspace or ownership validation. getAllUpsertHistory() 
  returns UpsertHistory rows selected solely by an attacker-supplied chatflowid,
  and patchDeleteUpsertHistory() deletes rows by an attacker-supplied array of 
  record UUIDs. As a result, any authenticated low-privilege user or valid API 
  key can read or delete document-store upsert history belonging to other users 
  and other workspaces whenever the target chatflowId (which is exposed publicly
  in /chatbot/<chatflowId> share links) or row ids are known. The retrievable 
  flowData and result fields contain embedding, record-manager and vector-store 
  node configuration, including per-node paramValues. No patched version is 
  available.
