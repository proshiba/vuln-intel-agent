title: "A missing authorization vulnerability exists in the `query-dynamic-sub-workflows`
  API of Apache DolphinScheduler. The API does not properly verify whether the authenticated
  user has permission to access the workflows being queried.\n\n\n\nAn authenticated
  user who does not have permission to access a specific project can invoke the API
  with parameters referencing workflows belonging to that project and retrieve workflow
  information. This allows users to access workflow data outside their authorized
  project scope, resulting in unauthorized information disclosure.\n\n\n\nThis issue
  affects Apache DolphinScheduler: from 3.2.0 before 3.4.3.\n\n\n\nUsers are recommended
  to upgrade to version 3.4.3, which fixes the issue."
