title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf:
  Fix use-after-free when perf mmap() revival races with the last munmap()\n\nperf_mmap_close()
  drops rb->mmap_count *without* holding\nevent->mmap_mutex (the refcount_dec_and_test()
  right before the\nrefcount_dec_and_mutex_lock() of event->mmap_count). A concurrent\n\
  perf_mmap_rb() can slot its entire \"revival\" path into that window\n(perf_mmap
  holds event->mmap_mutex for its whole duration, including\nrb_alloc):\n\n  munmap
  side (perf_mmap_close)          mmap side (perf_mmap_rb)\n  -----------------------------------\
  \    --------------------------------\n  rb->mmap_count 1 -> 0   (no lock)     \
  \ (holds event->mmap_mutex)\n                                         inc_not_zero(rb->mmap_count)
  fails\n                                         ring_buffer_attach(event, NULL)\n\
  \                                         rb_alloc() + attach new rb\n         \
  \                                refcount_set(&event->mmap_count, 1)\n  lock; event->"
