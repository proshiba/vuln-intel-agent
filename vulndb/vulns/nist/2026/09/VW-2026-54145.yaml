title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex/pi:
  Plug private futex exec() race\n\nThe check for private futexes whether the waiter's
  mm, which is stored in\nthe futex_key and copied into the pi_state, is the same
  as the owner's mm\nis not sufficient for exec(). exec() has a gap where the mm check
  fails to\ngive the correct answer:\n\n  exec()\n  ...\n    exec_release_mm()\n \
  \     futex_exec_release()\n        tsk::futex::exit_state = EXITING;\n        cleanup_robust_list();\n\
  1)      tsk::futex::exit_state = OK;\n    ...\n    old_mm = tsk::mm;\n2)  tsk::mm
  = ->mm;\n\nBetween #1 and #2 the check for the mm is wrong as that mm is about to
  be\nswapped out and eventually freed.\n\nPlug this gap by:\n\n  1) Setting tsk::futex::exit_state
  to FUTEX_STATE_DEAD in\n     futex_exec_release()\n\n  2) Setting tsk::futex::exit_state
  to FUTEX_STATE_OK after\n     the mm has been switched.\n\nFrom a futex point of
  view the task is dead after it finished the robust\nlist cleanup up to the point
