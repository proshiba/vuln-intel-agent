title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Force requesting ACS when tboot is enabled\n\nCurrently the conditions of requesting
  ACS in detect_intel_iommu()\ndon't include tboot, leading to a possible misconfiguration
  with ACS\ndisabled (e.g. due to user opts) while iommu is later forced on by\ntboot_force_iommu().\n\
  \nFix it by checking tboot in detect_intel_iommu()."
