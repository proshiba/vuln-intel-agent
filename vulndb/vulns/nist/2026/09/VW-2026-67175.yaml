title: A vulnerability has been found in Trusted Domain Project OpenDMARC up to 
  1.4.2. This affects the function opendmarc_policy_parse_dmarc in the library 
  libopendmarc/opendmarc_policy.c. The manipulation of the argument 
  fo/rf/ri/pct/sp/adkim/aspf/rua/ruf leads to handling of exceptional 
  conditions. Remote exploitation of the attack is possible. The exploit has 
  been disclosed to the public and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
