title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntls:
  reject the combination of TLS and sockmap\n\nTLS and sockmap (BPF psock) integration
  hides a lot of latent bugs.\nBugs which may be more or less relevant for real users
  but they\nare definitely exploitable.\n\nWe could not find anyone actively using
  this integration so let's\nreject this config. Adding a TLS socket to a sockmap
  was already\nrejected by sk_psock_init() through the inet_csk_has_ulp() check.\n\
  We need to reject the attempts to configure the TLS keys (rather\nthan adding the
  ULP itself) because checking prior to the ULP\ninstallation is tricky without risking
  a race with sockmap getting\nadded in parallel (sockmap does not hold the socket
  lock).\n\nThis patch is a minimal rejection of the feature. Subsequent patch\nin
  the series will do a light dead code removal. Full cleanup would\nrequire a major
  rewrite of the Tx path, we don't need skmsg any more."
