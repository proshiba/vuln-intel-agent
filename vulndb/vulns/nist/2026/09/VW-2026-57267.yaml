title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxhci:
  dbgtty: Fix unregister on tty_register_driver() failure\n\nIf tty_register_driver()
  fails, it drops the reference, but fails to set\nthe global dbc_tty_driver to NULL,
  causing the unregister to be called\nagain when module exits.\n\nOn module unload
  dbc_tty_exit() only gates its cleanup on the driver\npointer being non-NULL, so
  it operates on the already-freed driver:\n\n    module_init(xhci_hcd_init)\n   \
  \   xhci_hcd_init()\n        xhci_dbc_init()                       [return value
  ignored]\n          dbc_tty_init()\n            tty_register_driver() fails\n  \
  \            tty_driver_kref_put()           -> driver freed\n              (dbc_tty_driver
  left dangling)\n    ...\n    module_exit(xhci_hcd_fini)\n      xhci_hcd_fini()\n\
  \        xhci_dbc_exit()\n          dbc_tty_exit()\n            if (dbc_tty_driver)\
  \               -> true (dangling)\n              tty_unregister_driver()      \
  \   -> use-after-free"
