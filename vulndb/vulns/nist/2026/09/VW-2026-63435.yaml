title: Cotonti through 1.0.0 derives password recovery validation tokens from 
  md5(microtime()) in users.passrecover.php, creating a predictable token space 
  of approximately one million values per second. Unauthenticated attackers can 
  read the server Date header, precompute candidate tokens within a narrow time 
  window, and probe them against the passrecover authentication endpoint to 
  reset any account password including administrators.
