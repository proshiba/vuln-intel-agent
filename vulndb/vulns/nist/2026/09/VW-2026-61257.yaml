title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  airspy: use vb2_video_unregister_device() on disconnect to fix NULL deref\n\nairspy_disconnect()
  clears s->udev under v4l2_lock, but\nairspy_stop_streaming() unconditionally calls
  airspy_ctrl_msg() and\nairspy_free_stream_bufs() afterwards. If a streaming user
  closes the\ndevice after disconnect, stop_streaming() runs and dereferences the\n\
  NULL s->udev:\n\n  airspy_stop_streaming()\n    airspy_ctrl_msg(s, CMD_RECEIVER_MODE,
  0, 0, NULL, 0)\n      usb_sndctrlpipe(s->udev, 0)         /* NULL deref */\n   \
  \ airspy_free_stream_bufs(s)\n      usb_free_coherent(s->udev, ...)     /* NULL
  deref */\n\nThe airspy driver uses vb2_fop_release() in its file_operations, so\n\
  replace video_unregister_device(&s->vdev) with\nvb2_video_unregister_device(&s->vdev)
  and move it before clearing\ns->udev. vb2_video_unregister_device() releases the
  vb2 queue, which\nsynchronously runs airspy_stop_streaming() if streaming is active,
  so\nthe URBs, coherent D"
