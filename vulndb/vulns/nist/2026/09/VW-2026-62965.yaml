  JBIG2Stream::rewind of the file poppler/JBIG2Stream.cc. This manipulation causes
  null pointer dereference. It is possible to initiate the attack remotely. The exploit
  has been published and may be used. Upgrading to version 26.08.0 is recommended
  to address this issue. Patch name: 5e49250f13b0390edeb3f90eb4c02c9941f97067. Upgrading
  the affected component is advised.'
