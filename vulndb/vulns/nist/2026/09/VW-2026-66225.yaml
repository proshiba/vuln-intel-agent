title: "In the Linux kernel, the following vulnerability has been resolved:\n\nEDAC/device_sysfs:
  Use kstrtouint() for poll_msec to prevent truncation\n\nThe poll_msec sysfs store
  file uses simple_strtoul() which accepts an unsigned\nlong, but the target field
  (poll_msec) is unsigned int. On 64-bit systems,\na value > UINT_MAX is silently
  truncated when stored.\n\nFix the mismatch by using kstrtouint() instead. This rejects
  values larger\nthan UINT_MAX at parse time, making truncation impossible. Also add
  a check\nfor value < 1 to reject the 0-delay case, which would cause the poll work
  to\nspin without delay and consume 100% CPU."
