title: A security vulnerability has been detected in 0x4m4 HexStrike AI up to 
  d689933ff579d839c676c82b231f8e98326c5f04. The impacted element is the function
  FileOperationsManager of the file hexstrike_server.py of the component API 
  Files Endpoint. The manipulation of the argument filename leads to path 
  traversal. The attack may be initiated remotely. The exploit has been 
  disclosed publicly and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
