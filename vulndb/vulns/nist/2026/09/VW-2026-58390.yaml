title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfanotify:
  fix use-after-free of file range info\n\nfsnotify_pre_content() builds its file_range
  on the triggering task's\nstack. fanotify_alloc_perm_event() saves a pointer to
  range.pos in the\nheap-allocated permission event so copy_range_info_to_user() can
  report\nthe offset later.\n\nThe event reader can set the event state to FAN_EVENT_REPORTED
  and then\nsleep while preparing the file descriptor. If a signal interrupts the\n\
  triggering task at that point, fanotify_get_response() changes the state\nto FAN_EVENT_CANCELED
  and returns. This unwinds the file_range stack\nframe while the reader still owns
  the event. The reader then dereferences\npevent->ppos and copies the stale stack
  value to userspace.\n\nKASAN reported:\n\n  BUG: KASAN: use-after-free in fanotify_read+0x293e/0x2970\n\
  \  Read of size 8 at addr ffff88811434fc50 by task fanotify_inotif/95\n  Call Trace:\n\
  \   fanotify_read+0x293e/0x2970\n   vfs_read+0x177/0xa20\n   ksys_read+0xf"
