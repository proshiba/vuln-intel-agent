title: "Fabric.js loadFromJSON Server-Side Request Forgery Vulnerability. This vulnerability
  allows remote attackers to disclose sensitive information on affected installations
  of Fabric.js. Interaction with this library is required to exploit this vulnerability
  but attack vectors may vary depending on the implementation.\n\nThe specific flaw
  exists within the implementation of the loadFromJSON method. The issue results from
  the lack of proper validation of a URI prior to accessing resources. An attacker
  may be able to leverage this vulnerability to gain improper access to network resources.
  Was ZDI-CAN-29318."
