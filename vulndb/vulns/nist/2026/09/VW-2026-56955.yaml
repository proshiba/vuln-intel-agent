title: The Repeater Fields for Gravity Forms plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via Repeated Multi-Input Sub-Field Values in 
  all versions up to, and including, 3.0.4 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. This vulnerability only affects multi-input 
  sub-field types within a repeater (such as Name, Address, and Checkbox 
  fields), as scalar single-input field values are escaped with esc_html() at 
  the output stage in version 3.0.4.
