title: "The Time-aware GPIO syscall verification handler z_vrfy_tgpio_pin_read_ts_ec()
  in drivers/timeaware_gpio/timeaware_gpio_handlers.c validated only the port device
  object and passed the caller-supplied timestamp and event_count output pointers
  to the driver without a K_SYSCALL_MEMORY_WRITE() check. The other handlers in the
  same file (z_vrfy_tgpio_port_get_time(), z_vrfy_tgpio_port_get_cycles_per_second())
  already performed that check, so the omission left one syscall unguarded.\n\ntgpio_pin_read_ts_ec()
  is declared __syscall, so with CONFIG_USERSPACE=y an unprivileged user-mode thread
  that has been granted access to the TGPIO device object can invoke it with arbitrary
  pointer values. tgpio_intel_read_ts_ec() in drivers/timeaware_gpio/timeaware_gpio_intel.c
  bounds-checks only the pin index and then unconditionally performs timestamp = ...
  and event_count = ..., executing two 8-byte stores in supervisor mode at addresses
  chosen by the user-mode caller.\n\nThe result is a write-what-where prim"
