title: A Broken Object Level Authorization vulnerability exists in Grashjs Atlas
  CMMS prior to v1.6.0. An authenticated user from one tenant can read and 
  modify another tenant's company record by changing only the numeric ID in the 
  /company/{id} endpoint. The application does not enforce tenant-level 
  ownership checks when accessing or updating company objects, allowing 
  cross-tenant access and modification of company profile data.
