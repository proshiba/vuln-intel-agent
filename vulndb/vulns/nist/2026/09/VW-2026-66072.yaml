title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd:
  Do not reallocate GA log buffers on resume\n\nCommit c5e1a1eb9279 (\"iommu/amd:
  Simplify and Consolidate Virtual APIC\n(AVIC) Enablement\") moved the GA log allocation
  from iommu_init_pci()\nto enable_iommus_vapic(), which is called on every resume.\n\
  \niommu_init_ga_log() assigns iommu->ga_log and iommu->ga_log_tail\nunconditionally.
  Each resume therefore replaces the boot-time pointers\nand leaks both old allocations.
  The function also uses GFP_KERNEL from a\nsyscore resume callback, where interrupts
  are disabled and the non-boot\nCPUs are offline.\n\nReturn early if both buffers
  are already allocated. Clear the pointers\nin free_ga_log() so a partial allocation
  failure cannot leave ga_log\ndangling."
