title: Grav is a flat-file CMS. In versions 2.0.19 through 2.0.24 — and in 2.0.0
  through 2.0.18 and 1.7.x only where content Twig has been explicitly enabled —
  page content authored by a user holding only page-write permission is rendered
  through a Twig sandbox that allowlists get_cookie(), which returns any cookie 
  sent with the current request, including the visitor's session cookie. Because
  the read occurs server-side via filter_input(INPUT_COOKIE, ...), the HttpOnly,
  Secure and SameSite attributes offer no protection. Grav then stores the 
  finished post-Twig output in a page-content cache keyed only on page identity 
  and the configuration checksum, with no session, user or request dimension and
  no bypass for authenticated visitors. A page published by a page-write user 
  can therefore capture the session identifier of the next administrator who 
