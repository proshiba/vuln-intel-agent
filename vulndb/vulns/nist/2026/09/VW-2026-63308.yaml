title: Cocos AI is a confidential computing system for running AI workloads 
  inside trusted execution environments. In versions up to and including 0.8.2, 
  the intra-handshake attested TLS (aTLS) AMD SEV-SNP verification path does not
  enforce attestation freshness when the expected reportData value is nil, 
  empty, or omitted, leaving the SEV-SNP policy ReportData unset so the verifier
  accepts unrelated or stale Evidence not bound to the current connection. A 
  relying party that uses this path without an expected reportData as a trust or
  authorization decision can be induced to trust an unintended attestation 
  context; a supplied non-empty reportData is still validated. The issue is 
  fixed in version 0.9.0.
