title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark signal tracepoint siginfo arguments as scalar\n\nThe signal_generate and signal_deliver
  tracepoints declare their info\nargument as a struct kernel_siginfo pointer. btf_ctx_access()
  therefore\ntreats it as a trusted pointer for tp_btf programs.\n\nSignal delivery
  also uses SEND_SIG_NOINFO and SEND_SIG_PRIV as special\nvalues for this argument.
  Those values are zero and one respectively,\nand are not pointers. A tp_btf program
  can currently dereference either\nvalue and fault the kernel. In particular, signal_generate
  can run from\ntimer interrupt context, turning the fault into a kernel panic.\n\n\
  Record both tracepoints in raw_tp_null_args[] and mark argument one as\na non-pointer.
  This preserves scalar access to the cookie while rejecting\ndirect and helper-mediated
  pointer use. Merely marking it nullable would\nnot suffice because SEND_SIG_PRIV
  is nonzero."
