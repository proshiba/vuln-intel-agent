title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Wait for RCU callbacks before unloading ib_core\n\nput_gid_ndev() is queued with
  call_rcu() and implemented in ib_core.\nStopping the workqueues does not drain callbacks
  already queued, so RCU\ncould invoke it after the module code has been unloaded.\n\
  \nsynchronize_rcu() does not wait for callbacks. Wait for them after all\nproducers
  have stopped."
