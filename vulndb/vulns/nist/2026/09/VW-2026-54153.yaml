title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  serialize mode sysfs access with lock_fb_info()\n\nshow_mode(), show_modes(), and
  store_mode() access fb_info->modelist\nand fb_info->mode without holding lock_fb_info().
  store_modes() takes\nlock_fb_info() while replacing the modelist and freeing the
  old one.\n\nA concurrent reader or writer can load a pointer to an old modelist\n\
  entry before store_modes() frees it, then dereference freed memory or\nstore a stale
  freed pointer in fb_info->mode.\n\nTake lock_fb_info() in show_mode(), show_modes(),
  and store_mode() to\nserialize with store_modes(). In show_mode(), copy the mode
  to the\nstack and format after dropping the lock. In store_mode(), split\nactivate()
  into a _locked variant to avoid double-locking, and hold\nthe locks for the modelist
  walk, mode conversion, activation, and\nfb_info->mode assignment together."
