title: 'The EmbedVideo Extension is a MediaWiki extension which adds a parser function
  called #ev and various parser tags for embedding video clips from various video
  sharing services. Prior to 4.1.0, with $wgEmbedVideoRequireConsent disabled (not
  the default), the urls for videos are passed into an iframe src attribute without
  sanitization. When given a malformed url or id, the src attribute can be escaped
  via double quotes, allowing for html/javascript injection. Version 4.1.0 contains
  a patch.'
