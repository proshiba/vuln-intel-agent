title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  fix integer overflow in MFT cluster validation\n\nIn ntfs_init_from_boot(), the
  boot sector's MFT cluster numbers are\nvalidated against the volume size with:\n\
  \n\tif (mlcn  * sct_per_clst >= sectors ||\n\t    mlcn2 * sct_per_clst >= sectors)\n\
  \t\tgoto out;\n\nmlcn and mlcn2 are u64 fields read directly from the boot sector.\n\
  sct_per_clst is bounded above by 4096 (true_sectors_per_clst() plus\nthe is_power_of_2()
  check below it), but the multiplication is done\nin u64 and wraps when mlcn (or
  mlcn2) is large enough -- e.g. mlcn\nnear 2^62 with sct_per_clst == 4 wraps to 0,
  which compares below\nany non-zero 'sectors', so the check is bypassed and the malformed\n\
  record is accepted.\n\nThe accepted mlcn is then used unchanged in\n\n\tsbi->mft.lbo
  = mlcn << cluster_bits;\n\nIn practice the resulting reads fail at the block layer
  (sb_bread()\nreturns NULL via grow_buffers()'s check_mul_overflow() guard), so\n\
  today this manifests as mount fa"
