title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  ssd1307fb: defer I2C transfers from damage callbacks\n\nThe fbdev damage callbacks
  may run from fbcon while printk has disabled\npreemption.  They currently update
  the display synchronously, which enters\nthe sleeping I2C transfer path from atomic
  context.\n\nA complete report from an RK3566 system follows:\n\n  [  258.129004]
  watchdog: watchdog0: watchdog did not stop!\n  [  258.129067] BUG: scheduling while
  atomic: systemd/1/0x00000003\n  [  258.129076] Modules linked in: algif_hash algif_skcipher
  af_alg bnep\n  binfmt_misc lz4hc lz4 zram snd_soc_hdmi_codec brcmfmac_wcc hci_uart\n\
  \  fb_ssd1306(C) fbtft(C) btqca btrtl btintel btsdio snd_soc_simple_card\n  motorcomm
  pwm_fan snd_soc_simple_card_utils ssd130x_spi nls_iso8859_1\n  ssd130x btbcm drm_shmem_helper
  display_connector brcmfmac ssd1307fb\n  brcmutil bluetooth cfg80211 rfkill snd_soc_rockchip_i2s_tdm\n\
  \  snd_soc_rk817 hantro_vpu snd_soc_core snd_compress snd_pcm_dmaengine\n"
