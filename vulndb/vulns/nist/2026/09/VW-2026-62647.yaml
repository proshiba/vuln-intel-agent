title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Drop handle on protocol bind failures\n\nThe SCMI bus notifier acquires
  an SCMI handle when the driver core emits\nBUS_NOTIFY_BIND_DRIVER, before invoking
  the protocol driver probe\ncallback. The protocol probe path only checks whether
  sdev->handle is\nset.\n\nIf device_link_add() fails after the handle has been acquired,
  the\nprotocol device can still bind with a valid handle but without the\ndependency
  link to the SCMI parent. A concurrent parent unbind can then\nmiss the child and
  tear down the SCMI instance while the child still\nholds a handle into it.\n\nIf
  the protocol driver probe later fails, for example with\n-EPROBE_DEFER, the driver
  core emits BUS_NOTIFY_DRIVER_NOT_BOUND rather\nthan BUS_NOTIFY_UNBOUND_DRIVER. The
  SCMI notifier only released the\nhandle on BUS_NOTIFY_UNBOUND_DRIVER, so each failed
  protocol-device bind\nleaked the SCMI instance users refcount and left sdev->handle
  set after\nthe failed pr"
