title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Null out freed pointers in qla2x00_mem_alloc() error path\n\nWhen qla2x00_mem_alloc()
  fails, qla2x00_probe_one() jumps to\nprobe_hw_failed and calls qla2x00_mem_free().
  Several error labels in\nqla2x00_mem_alloc() freed adapter members (elsrej.c, purex_dma_pool,\n\
  flt, sfp_data, loop_id_map, async_pd, sf_init_cb, ex_init_cb, npiv_info)\nbut left
  the pointers dangling. qla2x00_mem_free() then freed them a\nsecond time. Worse,
  for the dma_pool members it issued\ndma_pool_free(ha->s_dma_pool, ...) after s_dma_pool
  had already been\ndestroyed and set to NULL at fail_s_dma_pool, dereferencing a
  NULL pool.\n\nClear each freed pointer (and its DMA handle) in the error labels
  so the\nsubsequent qla2x00_mem_free() skips them."
