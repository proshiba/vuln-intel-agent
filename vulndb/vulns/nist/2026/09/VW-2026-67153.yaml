title: A security flaw has been discovered in aaPanel BaoTa up to 11.8.0. This 
  affects the function get_domain_status of the file 
  /www/server/panel/mod/project/domain/domainMod.py of the component Domain 
  Handler. The manipulation of the argument get results in sql injection. It is 
  possible to launch the attack remotely. The exploit has been released to the 
  public and may be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
