title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: fix ext PHY use-after-free on register error path\n\nAfter mt7915_register_ext_phy()
  succeeded, a failure of the main PHY\nmt7915_init_debugfs() or mt7915_coredump_register()
  unwound through\nfree_phy2, which called ieee80211_free_hw() on the ext PHY hw while
  it\nwas still registered with mac80211, since mt76_unregister_device() only\nunregisters
  the main hw. Unregister the ext PHY (thermal + phy + hw)\nfirst and skip the redundant
  free."
