title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix use-after-free in trace_pipe read on sub-buffer order change\n\nWriting to buffer_subbuf_size_kb
  calls ring_buffer_subbuf_order_set(),\nwhich frees every sub-buffer of the ring
  buffer, including the reader\npage, and replaces them with newly allocated ones.\n\
  \nReaders of trace_pipe hold pointers into those pages. ring_buffer_peek()\nlooks
  up an event under cpu_buffer->reader_lock but returns the event\npointer after dropping
  the lock, and peek_next_entry() then calls\nring_buffer_event_length() and ring_buffer_event_data()
  on it. If the\nsub-buffer order is changed in that window, the reader dereferences\n\
  freed memory:\n\n  BUG: KASAN: use-after-free in ring_buffer_peek+0x3e0/0x430\n\
  \  Read of size 1 at addr ffff88802a4cf010 by task syz-executor989/6002\n\n  Freed
  by:\n   free_buffer_page kernel/trace/ring_buffer.c:398 [inline]\n   ring_buffer_subbuf_order_set+0x1325/0x18e0
  kernel/trace/ring_buffer.c:7444\n   buffer_subbuf_s"
