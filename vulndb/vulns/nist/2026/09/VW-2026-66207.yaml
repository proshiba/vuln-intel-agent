title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  only count successfully cleared runs when freeing clusters\n\nntfs_cluster_free_from_rl_nolock()
  adds a run's length to nr_freed\nwhenever the error bookkeeping condition is false,
  which includes\ncases where ntfs_bitmap_clear_run() actually failed - e.g. a second\n\
  run failing with the same errno as an earlier one, or any failure\nafter a non-ENOMEM
  error was already recorded. Since a failed\nntfs_bitmap_clear_run() rolls back its
  partial modifications, no\nbits were cleared for that run, yet its length still
  inflates\nvol->free_clusters, corrupting statfs output and the allocator's\nfree
  space gate.\n\nOnly count runs whose bitmap clear succeeded."
