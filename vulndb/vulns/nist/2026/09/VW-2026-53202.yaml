title: The SigmaForms Pro – AI Generated Forms plugin for WordPress is 
  vulnerable to arbitrary file deletion due to insufficient file path validation
  in the delete_submission_files function in all versions up to, and including, 
  1.4.11. This makes it possible for unauthenticated attackers to delete 
  arbitrary files on the server, which can easily lead to remote code execution 
  when the right file is deleted (such as wp-config.php). The malicious path 
  traversal URL is submitted via form upload field and stored in the database, 
  with deletion triggered when an administrator deletes the submission record 
  from the admin panel.
