title: radare2 is a UNIX-like reverse engineering framework and command-line 
  toolset. Prior to 6.2.0, radare2's ELF PN_XNUM handling was vulnerable because
  the ELF parser allocated the program-header array using the resolved PN_XNUM 
  count but several consumers still iterated with the original e_phnum value of 
  65535. The vulnerability is triggered by processing a crafted ELF file with 
  e_phnum = 0xffff and a much smaller resolved count in shdr[0].sh_info. 
  Consumers iterated beyond the allocated program-header array. This can cause a
  heap out-of-bounds read and process termination, resulting in denial of 
  service; memory disclosure and code execution have not been demonstrated. This
  issue is fixed in version 6.2.0.
