title: AzuraCast before 0.23.8 contains a command injection vulnerability in the
  Liquidsoap config generation for live recording that fails to quote the 
  streamer username in process.run calls. Authenticated station users with 
  Streamers and Profile permissions can set a username containing shell 
  metacharacters and trigger command execution as the Liquidsoap process user 
  when recording closes.
