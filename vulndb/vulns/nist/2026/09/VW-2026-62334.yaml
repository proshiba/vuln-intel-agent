title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  pn533: hold a reference to the request skb during send_frame\n\n__pn533_send_async()
  publishes the command and then calls\ndev->phy_ops->send_frame(). Once dev->cmd
  is set, an incoming frame\ncan be matched to this command: the I2C threaded IRQ
  runs\npn533_recv_frame(), which queues cmd_complete_work, and\npn533_send_async_complete()
  frees cmd->req with consume_skb().\n\nOn the I2C transport, pn533_i2c_send_frame()
  still dereferences the same\nskb after i2c_master_send() returns, so a completion
  that races the\nsend can free the skb while the transport is still using it.\n\n\
  The request skb is owned by the command object and may be freed by\ncommand completion
  at any time after dev->cmd is published, so the\ntransport send path must not assume
  it stays alive. Hold a temporary\nreference to the request skb across the send_frame()
  call so the\ntransport always sees a live skb even if completion races the send.\n\
  Add a pn533_send_cmd_"
