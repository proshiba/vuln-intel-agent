title: Missing Authorization in Apache Roller 6.1.5 allows an authenticated user
  to read, modify, or delete weblog content belonging to other weblogs through 
  the legacy XML-RPC Blogger and MetaWeblog APIs, because the handlers 
  authenticate the caller but do not verify the caller's permission on the 
  weblog or entry actually affected. Only installations that enable the 
  non-default global XML-RPC setting are affected; the per-weblog API flag 
  defaults to enabled for UI-created weblogs. Users are recommended to upgrade 
  to Apache Roller 6.1.6 or later, which applies an explicit per-method 
  permission check, or to keep the XML-RPC feature disabled.
