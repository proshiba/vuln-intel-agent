title: MarketKing plugin for WordPress before 2.1.72 contains a missing 
  authorization vulnerability in the marketking_duplicate_product AJAX action 
  that allows authenticated attackers with subscriber-level access or higher to 
  duplicate any vendor's product by supplying an arbitrary product ID. Attackers
  can bypass ownership verification to copy any vendor's product listings, 
  including private product metadata, and assign the duplicated copy to their 
  own vendor account without the victim's knowledge or consent.
