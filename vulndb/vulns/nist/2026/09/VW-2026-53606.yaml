title: WWBN AVideo fails to properly validate access controls on the public 
  channel page, allowing unauthenticated visitors to view unlisted and 
  group-restricted videos through hardcoded visibility flags and an undefined 
  property. Attackers can access the channel endpoint to retrieve sensitive 
  video content that should be hidden, including full URLs to unlisted videos 
  and thumbnails of member-only content, regardless of the operator's 
  hidePrivateVideos setting.
