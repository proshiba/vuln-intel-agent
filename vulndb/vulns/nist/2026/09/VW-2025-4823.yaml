title: Grav is a file-based Web platform. Prior to 1.8.0-beta.27, A Denial of 
  Service (DoS) vulnerability has been identified in Grav related to the 
  handling of scheduled_at parameters. Specifically, the application fails to 
  properly sanitize input for cron expressions. By manipulating the scheduled_at
  parameter with a malicious input, such as a single quote, the application 
  admin panel becomes non-functional, causing significant disruptions to 
  administrative operations. The only way to recover from this issue is to 
  manually access the host server and modify the backup.yaml file to correct the
  corrupted cron expression. This vulnerability is fixed in 1.8.0-beta.27.
