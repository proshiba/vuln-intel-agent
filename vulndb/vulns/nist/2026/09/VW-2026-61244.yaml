title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  i2c: ov02a10: fix endpoint parsing use-after-free\n\nThe ov02a10_check_hwcfg() function
  calls fwnode_handle_put(ep)\nimmediately after allocating and parsing the endpoint.
  However, it\nsubsequently calls fwnode_property_read_u32() using the same 'ep'\n\
  handle, leading to a potential use-after-free.\n\nAdditionally, reading the optional
  'ovti,mipi-clock-voltage' property\nused to overwrite the 'ret' variable. If the
  property was missing,\n'ret' would become negative, and this failure code would
  be incorrectly\nreturned at the end of the function, causing probe to fail entirely.\n\
  \nFix the use-after-free by moving fwnode_property_read_u32() before\nthe endpoint
  is parsed and freed. Avoid the error leak by not\nassigning the result of fwnode_property_read_u32()
  to 'ret'."
