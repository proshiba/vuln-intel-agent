title: "An unauthenticated client can drain the RTSP server's packet pool with a couple
  of dozen requests\n\n\n\nthat carry a Session header the parser cannot convert.\n\
  \n\n\nThe Session branch returns the raw NetX error code instead of an RTSP status
  code:\n\n\n\n```c\n\n\n\n/* addons/rtsp/nx_rtsp_server.c:2754 */\n\n\n\nstatus =
  _nx_utility_string_to_uint(field_value_ptr, field_value_length, &session_id);\n\n\
  \n\nif (status)\n\n\n\n{\n\n    return(status);      /* NX_INVALID_PARAMETERS /
  NX_SIZE_ERROR / NX_OVERFLOW */\n\n\n}\n\n\n\n```\n\n\n\nEvery other branch of the
  same function maps its failure to an RTSP status first. The CSeq branch\n\n\n\n\
  eighteen lines earlier does exactly that (line 2736 returns NX_RTSP_STATUS_CODE_BAD_REQUEST).
  The\n\n\n\nraw code then reaches `_nx_rtsp_server_error_response_send` (nx_rtsp_server.c:1234),
  which does not\n\n\n\nrecognise it, takes a path that returns without releasing
  the response packet it already allocated,\n\n\n\nand the block never goes back to
  the pool.\n\n\n\nSix requests with an empty Session header aga"
