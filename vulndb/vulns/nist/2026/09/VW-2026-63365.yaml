title: FluidSynth is a software synthesizer based on the SoundFont 2 
  specifications. From 1.1.2 until 2.5.6, the FluidSynth command handler accepts
  a pitch_bend_range command whose channel argument is not bounds checked before
  the supplied value is written through the selected synth channel. An 
  out-of-range channel can therefore cause an out-of-bounds heap write, leading 
  to denial of service or possible code execution. The issue is remotely 
  reachable when the TCP server is enabled through new_fluid_server() or 
  fluidsynth -s, and it is locally reachable through malicious commands 
  delivered to the FluidSynth shell on standard input. Applications that do not 
  use the shell, command handler, or TCP server are not affected. This issue is 
  fixed in version 2.5.6.
