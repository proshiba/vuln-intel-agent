title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuio:
  Fix stale info pointer in failed registration path\n\nAfter device_add(), the UIO
  device is visible to userspace and /dev/uioX\ncan be opened. If a later setup step
  fails, __uio_register_device()\nunwinds the device but leaves idev->info pointing
  at the caller-owned\nstruct uio_info.\n\nThat is unsafe when an opener races with
  the failed registration path.\nThe open file keeps a reference to the uio_device,
  while the caller sees\nregistration failure and may free its struct uio_info. Later
  file\noperations can then follow idev->info and dereference freed memory.\n\nHandle
  post-device_add() failures like unregister: remove UIO attributes\nwhile the info
  pointer is still valid, then clear idev->info under\ninfo_lock and wake existing
  waiters/async users before removing the\ndevice and minor. This makes already-open
  file descriptors observe the\nsame \"device gone\" state as normal uio_unregister_device()."
