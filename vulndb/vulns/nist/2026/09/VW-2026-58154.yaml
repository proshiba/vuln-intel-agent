title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: adi: initialize the lock before enabling interrupts\n\nadi_i3c_master_probe()
  requests the IRQ and unmasks REG_IRQ_PENDING_CMDR\nbefore the controller's IBI state,
  transfer queue list and transfer\nqueue lock are initialized.  A pending CMDR interrupt
  can therefore run\nadi_i3c_master_irq() and take master->xferqueue.lock before the
  dynamic\nlock has been initialized.\n\nThis issue was found by our static analysis
  tool and then manually\nreviewed against the current tree.\n\nThe grounded PoC kept
  the probe ordering and the IRQ path\nadi_i3c_master_probe() -> adi_i3c_master_irq()
  -> xferqueue.lock, with a\npending CMDR interrupt arriving after REG_IRQ_PENDING_CMDR
  is unmasked.\nLockdep reported:\n\n  INFO: trying to register non-static key.\n\
  \  you didn't initialize this object before use?\n  lock_acquire+0xbb/0x290\n  _raw_spin_lock_irqsave+0x36/0x60\n\
  \  adi_i3c_master_irq+0x32/0x56 [vuln_msv]\n  adi_i3c_master_probe+0x5a/0xf47"
