  and escape content submitted with a post before outputting it in the pages it generates,
  allowing users with a role as low as Contributor to perform Stored Cross-Site Scripting
  attacks against any user viewing or previewing the affected page.\nThe Content Mask
  WordPress plugin before 1.8.5.6's option to restrict its use by role does not prevent
