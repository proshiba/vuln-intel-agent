title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Stop remote reader update when page swap fails\n\nThe remote swap_reader_page callback
  can return -EBUSY when the writer\nmoves the head before the remote catches it,
  particularly during an event\nstorm on a small buffer. __rb_get_reader_page_from_remote()
  currently\nwarns about that failure but continues with the unchanged reader ID and\n\
  rearranges the local page list as though the swap succeeded.\n\nHandle the callback
  failure as a recoverable error. Report it with\npr_warn_ratelimited() and return
  NULL. Callers already handle a NULL reader\npage as a failed attempt. This avoids
  splicing the same page as both the\nprevious and new reader without flooding the
  log under contention."
