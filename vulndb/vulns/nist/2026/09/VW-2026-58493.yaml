title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  set SC_STATUS_FREED in nfsd4_drop_revoked_stid for delegations\n\nnfsd4_drop_revoked_stid()
  handles FREE_STATEID for admin-revoked\ndelegations but does not set SC_STATUS_FREED
  before releasing cl_lock.\nrevoke_delegation() uses this flag to detect whether
  FREE_STATEID has\nalready processed the delegation -- without it, the freed delegation
  is\nadded to cl_revoked via list_add(), producing a use-after-free when\ncl_revoked
  is later traversed in __destroy_client().\n\nThe SC_STATUS_REVOKED path in nfsd4_free_stateid()
  (line 7983) already\nsets SC_STATUS_FREED correctly. Apply the same pattern to the\n\
  SC_STATUS_ADMIN_REVOKED path in nfsd4_drop_revoked_stid()."
