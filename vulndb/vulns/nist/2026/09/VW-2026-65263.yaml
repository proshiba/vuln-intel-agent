title: Aureus ERP through 1.6.0 stores uploaded SVG files on its public disk and
  serves them from the application origin, allowing authenticated users to 
  upload malicious SVG files containing JavaScript. Attackers can craft SVG 
  files with script elements that execute in the application's origin when the 
  file URL is opened directly, enabling session cookie theft and CSRF token 
  exfiltration.
