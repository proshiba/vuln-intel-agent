title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  scope session state changes to bound connections\n\nksmbd_all_conn_set_status()
  treats every connection whose transient\nbinding flag is set as belonging to the
  target SessionId.  A logoff or\nsession replacement can consequently move an unrelated
  connection to\nNEED_RECONNECT or NEED_SETUP.\n\nPass the target session itself and
  select connections using either the\nconnection-local session xarray or the session's
  permanent channel list.\nUse the same association test while waiting for requests
  to drain.\n\nSerialize session-wide status changes under request_lock and do not\n\
  overwrite EXITING or RELEASING. Protect the shutdown transition with the\nsame lock
  so a concurrent session update cannot revive a closing\nconnection."
