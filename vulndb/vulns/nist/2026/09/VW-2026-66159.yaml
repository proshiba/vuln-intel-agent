title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  restore active device pointers after failed sprout\n\nbtrfs_init_new_device() switches
  latest_dev and possibly s_bdev from the\nseed device to the new sprout device before
  creating the first writable\nchunks.\n\nIf chunk creation or the subsequent sprout
  setup fails, the error path\nreleases the new device without switching those pointers
  back.\nbtrfs_show_devname() can then dereference the freed latest_dev and crash.\n\
  \nRestore the active device pointers to the latest seed device before\nremoving
  and releasing the failed sprout device."
