title: "Bifrost registers MCP clients through its management API. A stdio client is
  a command plus args. Bifrost starts that program in the gateway the moment the client
  is added. No MCP handshake required.\n\n\n\nThe default is governance.auth_config.is_enabled=false.
  Auth off means every caller is a local admin. One unauthenticated POST /api/mcp/client
  is enough to run a program as the Bifrost process user (appuser on the official
  image).\n\n\n\n transports/v2.1.0 refuses an unauthenticated stdio registration
  with 403. transports/v2.0.0 still allows it."
