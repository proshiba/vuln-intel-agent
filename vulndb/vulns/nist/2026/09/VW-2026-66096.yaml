title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: mv88e6xxx: bound the policy rule dump by the caller's buffer size\n\nmv88e6xxx_get_rxnfc()
  uses rxnfc->rule_cnt as the write index while\ndumping the policy IDR, clobbering
  the input value before it has been\nlooked at.  That input is the number of entries
  the caller had room for.\nETHTOOL_GRXCLSRLALL requires no CAP_NET_ADMIN and the
  ioctl sizes the\nbuffer from the rule_cnt userspace passes in, so once an admin
  has\ninstalled policy rules any user can ask for fewer slots than there are\nrules
  and run off the end of the allocation.  A rule_cnt of 0 leaves the\nbuffer pointer
  NULL and the walk dereferences it.\n\nCount into a local so the caller's limit survives
  the walk, and stop with\n-EMSGSIZE once it is reached."
