title: 'Nozomi Networks Labs identified a CWE-345: Insufficient Verification of Data
  Authenticity vulnerability in the firmware upgrade mechanism of the Advantech EKI-1242EIMS
  in firmware version V1.06.01. The device accepts firmware images through the authenticated
  web management interface without performing any cryptographic signature or certificate
  verification. An authenticated administrator-level attacker can install arbitrary
  modified firmware on the device, enabling full persistent compromise of the platform.'
