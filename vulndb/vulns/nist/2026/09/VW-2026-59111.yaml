title: "Description\n\nThe setuid-root `worker-launcher` binary adjusts ownership
  and permissions of worker directories by walking\nthe tree with FTS and calling
  `lchown` and `chmod` on each entry's full pathname while running with an\neffective
  uid of 0. Both syscalls re-resolve the path at the time of the call, after FTS has
  classified the\nentry, and the trees being walked are owned and writable by the
  untrusted topology user.\n\nA tenant running code on a supervisor node could therefore
  replace an intermediate directory component with\na symbolic link between classification
  and the privileged operation, redirecting the root-owned `lchown` or\n`chmod` at
  an arbitrary file on the host. The operation is repeatable at will, since crashing
  a worker\nforces a relaunch and blob updates re-run the walk, so a failed attempt
  costs the attacker nothing.\n\nThis crosses the boundary that `supervisor.run.worker.as.user`
