title: MISP contains a stored cross-site scripting (XSS) vulnerability in the 
  Overmind theme's statistics views. The event General card (event_general.ctp) 
  and the server/feed preview card (preview_general.ctp) constructed donut chart
  legend labels by directly concatenating object name or category keys into an 
  innerHTML string without HTML-encoding. Because MISP object names (e.g., 
  attribute names, event names, or server/feed identifiers) are 
  user-controllable by any authenticated user with sufficient permissions to 
  create or modify such objects, an attacker could craft a name containing 
  malicious markup (for example, a script tag or event-handler attribute). When 
  any other user viewed the affected Overmind dashboard, the injected markup 
  would be interpreted as live HTML/JavaScript in the victim's browser, 
  executing in the context of the MISP application origin. This could allow 
