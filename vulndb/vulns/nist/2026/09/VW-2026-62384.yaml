title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf:
  arm_pmuv3: Zero initialize hw_id branch stack field\n\nPERF_SAMPLE_BRANCH_HW_INDEX
  is supported by BRBE so hw_id is passed to\nuserspace, but it's never set by the
  BRBE driver. Zero initialize it as\nit should be according to the docs:\n\n   *
  For the architectures whose raw branch records are\n   * already stored in age order,
  the hw_idx should be 0.\n\nIt's probably too risky to remove PERF_SAMPLE_BRANCH_HW_INDEX
  from BRBE\nnow in case anyone is setting it and reading the value, but zero\ninitializing
  the whole struct also protects against the same issue with\nnew fields that are
  added in the future."
