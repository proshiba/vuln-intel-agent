title: A weakness has been identified in winston-dsouza Ecommerce-Website up to 
  87734c043269baac0b4cfe9664784462138b1b2e. Affected by this issue is some 
  unknown functionality of the file /includes/header_menu.php of the component 
  GET Parameter Handler. Executing manipulation of the argument Error can lead 
  to cross site scripting. The attack can be executed remotely. The exploit has 
  been made available to the public and could be exploited. This product 
  implements a rolling release for ongoing delivery, which means version 
  information for affected or updated releases is unavailable. The vendor was 
  contacted early about this disclosure but did not respond in any way.
