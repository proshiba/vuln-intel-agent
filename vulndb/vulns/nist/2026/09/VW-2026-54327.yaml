title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  sun6i-dma: Fix reclaim descriptors while terminating DMA\n\nWhen terminating DMA
  transfers, active descriptors are not properly\nreclaimed. Only cyclic descriptors
  were handled, leaving non-cyclic\ndescriptors and their LLI chains to be permanently
  leaked.\n\nFix by using vchan_terminate_vdesc() which handles both cyclic and\n\
  non-cyclic descriptors by adding them to desc_terminated queue for\nproper cleanup.\n\
  \nAdd pchan->desc != pchan->done check to prevent double-adding completed\ndescriptors,
  which would corrupt the list."
