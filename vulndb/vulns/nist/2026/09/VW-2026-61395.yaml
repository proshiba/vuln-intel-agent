title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Guard admin state-revocation walks with NFSD_NET_UP\n\nWriting to /proc/fs/nfsd/unlock_filesystem,
  or sending the\nNFSD_CMD_UNLOCK_FILESYSTEM or NFSD_CMD_UNLOCK_EXPORT netlink command,\n\
  walks the NFSv4 client hash tables to revoke open state and cancel\nasync COPY operations.\
  \  All three handlers gate that walk on\nnn->nfsd_serv, but a listener added via
  portlist or netlink\nlistener_set sets nn->nfsd_serv before any nfsd thread starts.\n\
  nfsd_startup_net() has not yet allocated nn->conf_id_hashtbl, so the\nwalkers dereference
  a NULL table.  A local administrator with\nCAP_SYS_ADMIN can crash the kernel this
  way without ever starting the\nserver.\n\nnn->nfsd_serv is set when the service
  is created, which precedes\ntable allocation.  NFSD_NET_UP instead brackets the
  window where the\ntables are live: set at the end of nfsd_startup_net() and cleared
  in\nnfsd_shutdown_net() after they are freed, both under nfsd_mutex.\nGating the
