title: DeepSeek Harness before 0.1.2-alpha.1 contains an authentication bypass 
  vulnerability in its local HTTP control-plane API that allows attackers to 
  gain full agent control by supplying a spoofed Host header, as the server 
  validates only the client-supplied Host header value rather than the actual 
  TCP connection origin. Attackers can exploit this flaw to invoke privileged 
  commands such as commands/execute with danger-full-access permissions, 
  escalate session approval policies to unconfined execution, and retrieve all 
  stored conversations without any credential or API key.
