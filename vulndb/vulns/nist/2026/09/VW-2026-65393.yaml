title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix potential use after free in uverbs_free_dmah()\n\nWhen accessing a dmah via
  the netlink path the only synchronization\nmechanism for the said dmah is rdma_restrack_get().\n\
  Currently, rdma_restrack_del() is invoked at the end of\nuverbs_free_dmah(), which
  is too late, since by that point\nvendor-specific resources associated with the
  dmah might already be\nfreed. This can leave a short window where the dmah remains
  accessible\nthrough restrack, leading to a potential use-after-free.\n\nFix this
  by moving the rdma_restrack_begin_del() call to the start of\nuverbs_free_dmah(),
  ensuring that the dmah is removed from restrack\nbefore its internal resources are
  released. This guarantees that no new\nusers hold references to a dmah that is in
  the process of destruction.\n\nIn addition, this change preserves the intended inverted
  order\nbetween create and destroy routines: resources are added to\nrestrack at
