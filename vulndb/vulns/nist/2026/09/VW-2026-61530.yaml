title: A security vulnerability has been detected in PbootCMS up to 3.2.24. This
  vulnerability affects the function UserController::del/UserController::mod of 
  the file apps/admin/controller/system/UserController.php of the component User
  Management. Such manipulation leads to cross-site request forgery. The attack 
  may be performed from remote. The exploit has been disclosed publicly and may 
  be used. Upgrading to version 3.2.25 is able to resolve this issue. The name 
  of the patch is c25241a0964742cefb7f698efbb6c38b868d6ff7. It is advisable to 
  upgrade the affected component.
