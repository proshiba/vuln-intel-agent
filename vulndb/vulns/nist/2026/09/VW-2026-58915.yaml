title: A vulnerability has been found in 0x4m4 HexStrike AI up to 
  d689933ff579d839c676c82b231f8e98326c5f04. Impacted is an unknown function of 
  the file hexstrike_server.py of the component Execute Endpoint. The 
  manipulation of the argument code/script leads to os command injection. It is 
  possible to initiate the attack remotely. The exploit has been disclosed to 
  the public and may be used. This product is using a rolling release to provide
  continious delivery. Therefore, no version details for affected nor updated 
  releases are available. The project was informed of the problem early through 
  an issue report but has not responded yet.
