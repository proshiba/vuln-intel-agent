title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  Dont send random pad bytes in RESET/ACTIVATE messages\n\nThe interface name is passed
  in a fixed length (TIPC_MAX_IF_NAME) buffer.\nReplace the strcpy(data, l->if_name)
  with memcpy() so that the\npad bytes are actually written (l->if_name[] is zero
  padded)\nrather than sending random bytes from the skb to the remote system.\n\n\
  Replace two other strcpy() with strscpy()."
