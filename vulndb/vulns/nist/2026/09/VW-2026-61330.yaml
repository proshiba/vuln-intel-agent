title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-fc:
  fix double free of fabrics options when nvme_add_ctrl() fails\n\nnvmf_create_ctrl()
  owns the fabrics options and frees them whenever\n->create_ctrl() returns an error,
  so a transport must not free them on\nits own error paths.  nvme-fc tracks this
  by testing ctrl->ctrl.opts in\nnvme_fc_ctrl_free(), which requires nvme_fc_init_ctrl()
  to clear that\npointer on every error exit.\n\nThe coupling is implicit, and commit
  1a9e218195a5 (\"nvme: split device\nadd from initialization\") broke it by adding
  a second error exit.  When\nnvme_add_ctrl() fails, nvme_fc_init_ctrl() jumps to
  out_put_ctrl:, past\nthe \"ctrl->ctrl.opts = NULL\" that only sits on the fail_ctrl:
  path, so\nnvme_fc_ctrl_free() frees the options and nvmf_create_ctrl() frees them\n\
  a second time:\n\n  BUG: KASAN: slab-use-after-free in nvmf_free_options+0x30/0x190\n\
  \   nvmf_free_options+0x30/0x190 drivers/nvme/host/fabrics.c:1284\n   nvmf_create_ctrl
