title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/server:
  call ksmbd_proc_cleanup() on module init failure\n\nWhen a later initializer fails,
  the unwind chain releases resources\ncreated after procfs and then jumps directly
  to class_unregister().\nReturning an error from module_init() leaves the proc tree
  and its\nper-CPU counters allocated."
