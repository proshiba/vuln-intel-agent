title: "Affected versions of MISP contain improper authorization checks in the freetext
  feed preview functionality. The preview performed correlation lookups against attributes
  from events without applying the requesting user's ACL, allowing restricted event
  correlations and associated event information to be exposed to users who could not
  otherwise access those events. The vulnerable queries were scoped only by attribute
  values and deletion status rather than MISP's event, organization, sharing-group,
  attribute, and object-level access controls.\n\n\nThe same preview functionality
  also returned cross-feed correlation information without properly restricting the
  feed list to feeds visible to the caller. This exposed metadata for feeds that were
  not marked lookup_visible; one affected response additionally included the configured
  feed URL even though that value was not required by the feature.\n\nThe fixes apply
