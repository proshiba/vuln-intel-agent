title: "Ghostscript for Windows is vulnerable to local privilege escalation through
  PostScript resource file hijacking. Due to the application searching for PostScript
  resource files in predictable paths under C:\\\\gs\\\\ that do not exist by default
  on Windows installations, combined with Windows default ACLs allowing any authenticated
  user to create directories at the root of C:\\\\, an attacker who is an authenticated
  local user can create the expected directory structure and plant a malicious PostScript
  file. When any user or service subsequently runs Ghostscript, the planted file is
  automatically loaded and executed with the full privileges of the Ghostscript process.
  This results in full compromise of Ghostscript process context, as well as running
  arbitrary code on the machine with Ghostscript process privileges.\n\n\nThis issue
  was fixed in version 10.08.0."
