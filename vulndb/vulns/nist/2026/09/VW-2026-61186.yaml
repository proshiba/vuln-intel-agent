title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix valid block count leak on data block allocation failure\n\nIn __allocate_data_block(),
  when allocating a new data block\n(dn->data_blkaddr == NULL_ADDR), inc_valid_block_count()
  is\ncalled first to increment total_valid_block_count and i_blocks.\nIf the subsequent
  f2fs_allocate_data_block() fails, the function\nreturns the error directly without
  rolling back the\nalready-incremented block counts, causing a permanent leak.\n\n\
  Fix this by calling dec_valid_block_count() to undo the\nincrement before returning
  the error. The condition\nold_blkaddr == NULL_ADDR precisely identifies the case
  where\ninc_valid_block_count() was called."
