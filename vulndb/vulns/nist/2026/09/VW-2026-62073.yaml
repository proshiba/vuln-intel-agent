title: vm2 versions 3.11.4 through 3.11.6 incompletely filter Node.js registered
  internal symbols across the sandbox boundary. The extraction filters in 
  lib/setup-sandbox.js and the cross-realm symbol checks and write traps in 
  lib/bridge.js use a fixed list of known dangerous registered symbols that 
  omits nodejs.stream.disturbed and nodejs.stream.errored, which are exposed on 
  host WebStream prototypes on newer Node.js releases (validated on Node.js 
  v25.8.0). When the embedder exposes a host WebStream object and the host 
  stream/web module to the sandbox, sandbox code can obtain the real host 
  symbols via Object.getOwnPropertySymbols(streamWeb.ReadableStream.prototype) 
  and use them as write keys on host stream objects, corrupting host-visible 
  stream state — for example making stream.Readable.isDisturbed() return false 
  for an already-consumed stream. This can bypass host logic that relies on 
  Node's public stream-state helpers to enforce one-shot body consumption, 
  reject errored streams, or decide
