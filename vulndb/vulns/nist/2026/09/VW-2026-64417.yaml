title: A security flaw has been discovered in Moonshot AI Kimi Code up to 
  0.31.0. The affected element is an unknown function of the file 
  agent-core-v2/src/agent/mcp/config-loader.ts of the component MCP 
  Configuration Loader. The manipulation results in os command injection. The 
  attack may be launched remotely. The exploit has been released to the public 
  and may be used for attacks. Upgrading to version 0.31.1 is sufficient to fix 
  this issue. It is recommended to upgrade the affected component. Beyond the 
  trust prompt, the fix resolves fd/stty binaries to absolute paths specifically
  "so untrusted workspaces cannot plant bare-name executables before 
  confirmation," fixing a secondary $PATH path-planting vector alongside the 
  primary untrusted-.mcp.json auto-spawn.
