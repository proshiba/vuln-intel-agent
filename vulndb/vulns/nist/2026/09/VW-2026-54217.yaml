title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tcp-ao:
  fix use-after-free of current_key on reconnect to another peer\n\ntcp_inbound_ao_hash()
  is called before bh_lock_sock_nested() is taken,\nwith only rcu_read_lock() held.
  On the fast path for established\nsockets, if the rnext_keyid sent by the peer differs
  from\ncurrent_key->sndid, the key the peer asked for is looked up and stored\nin
  current_key. The lookup is inside the RCU read side, but current_key\noutlives it.\n\
  \nWhen the socket is disconnected and connect() is called again for\nanother peer,
  tcp_ao_connect_init() unlinks every key that does not\nmatch the new peer and frees
  it with call_rcu(). If current_key points\nat such a key, it is cleared to NULL.\n\
  \nThe fast path reads sk_state only once on entry, so a softirq that got\ninto it
  while the socket was still established can update current_key\nafter that loop has
  already run. The update is inside the RCU read side,\nso it comes before the call_rcu()
