title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  llcp: bound SNL TLV parsing to the skb and add length checks\n\nnfc_llcp_recv_snl()
  walked the SNL TLV list using a u16 offset/length\npair derived from skb->len, without
  bounding reads to the actual skb\ndata. Three problems followed:\n\n  - For a short
  frame (skb->len < LLCP_HEADER_SIZE), tlv_len underflowed.\n  - The per-TLV header
  (type, length) was read without checking that two\n    bytes remained.\n  - A declared
  TLV length could run past the end of the buffer, and an\n    SDREQ with length ==
  0 made \"service_name_len = length - 1\" underflow\n    (size_t), driving an out-of-bounds
  read in the following strncmp() /\n    nfc_llcp_sock_from_sn(). The SDRES case likewise
  read tlv[2]/tlv[3]\n    without a length check.\n\nA nearby NFC device can reach
  this without authentication; LLCP link\nactivation happens automatically after NFC-DEP.\n\
  \nWalk the TLV list by pointer, bounded by skb_tail_pointer() over the\nlinear skb
  data, and"
