title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7921: validate CLC firmware records\n\nThe CLC region is supplied by firmware,
  but the loader trusts the\nregion count and each record length. A malformed image
  can make the\nregion table pointer precede the firmware buffer, make the record
  loop\nfail to advance, or index phy->clc past its end. Validate the table and\n\
  record bounds before dereferencing or copying."
