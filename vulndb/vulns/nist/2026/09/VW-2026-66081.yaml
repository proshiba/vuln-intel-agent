title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sfq: clamp quantum in change path\n\nsfq_change() accepts any non-negative quantum
  (only rejects\n(int)ctl->quantum < 0). With a crafted size table qdisc_pkt_len reaches\n\
  ~2 GiB, so quantum=1 makes the deficit-refill loop spin ~2^31 times\nunder the qdisc
  lock (a soft lockup / denial of service).\n\nAdd max(256U, ...) matching fq_codel_change().
  Reject quantum > 1<<20\nwith -EINVAL, matching fq_codel_change() and the init clamp.\n\
  \nConditions to recreate the bug:\n  CONFIG_NET_SCH_SFQ=y. Requires CAP_NET_ADMIN
  (namespace-local via\n  unshare -Urn suffices).\n\n  tc qdisc add dev dummy0 root
  sfq\n  tc qdisc change dev dummy0 root sfq quantum 1 stab data 32768 size_log 15
  cell_log 0"
