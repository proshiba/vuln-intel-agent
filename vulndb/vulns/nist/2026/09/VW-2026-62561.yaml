title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  Fix skb double-free in xfrm_dev_direct_output()\n\nA return value other than 1 from
  local_out() means that the skb has been\nconsumed or its ownership was transferred.
  xfrm_dev_direct_output()\nnevertheless frees the skb on this path, causing a double-free
  when\nnetfilter drops the packet and invalidating any other owner.\n\nReturn the
  local_out() result directly, matching the ownership handling\nin xfrm_output_resume()."
