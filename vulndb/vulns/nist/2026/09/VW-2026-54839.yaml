title: "Affected versions of MISP contain insufficient validation of server-side outbound
  HTTP destinations in feed retrieval and TAXII discovery functionality.\n\n\nIn feed
  processing, redirects were followed without validating the redirect scheme or destination.
  The original request headers were reused across redirect hops, meaning authentication
  headers or API credentials configured for a feed could be forwarded to a different
  host. Redirects could also target internal network resources, resulting in SSRF.
  The fix adds redirect validation, blocks internal destinations for cross-host redirects,
  strips configured feed credentials before following redirects to another host, and
  pins validated DNS results to prevent re-resolution after validation.\n\n\nThe TAXII
  discovery endpoint had a related incomplete SSRF defense. It used gethostbyname()
  and compared the result against only a few literal addresses. This missed cases
  including IPv6 loopback (::1), numeric host encodings such as 0x7f000001, and po"
