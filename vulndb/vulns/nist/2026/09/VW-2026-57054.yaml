title: "Several Newfold plugins are vulnerable to Authentication Bypass. The vulnerability
  exists because the plugins bundle the wp-module-data module. In the module, the
  `authenticate()` method — registered on the `rest_authentication_errors` filter
  and therefore evaluated for every unauthenticated REST API request — performs an
  HMAC-style Bearer token comparison that degenerates when `HiiveConnection::get_auth_token()`
  returns `false`: PHP coerces `strrev(false)` to `strrev('')`, collapsing the secret
  salt to the publicly known constant `hash('sha256', '') = e3b0c44...`, while all
  remaining hash inputs (HTTP method, request URL, raw request body, and the `X-Timestamp`
  header) remain fully attacker-controlled. This makes it possible for unauthenticated
  attackers to compute a valid Bearer token entirely offline, pass the token equality
  check, and have `wp_set_current_user()` invoked against the first administrator
