title: Bludit CMS through 3.22.0 contains a mass assignment vulnerability that 
  allows authenticated users with the Author role to modify privileged page 
  fields reserved for administrators by injecting reserved parameters into a 
  content save request. Attackers can submit reserved fields such as type and 
  username through the Pages::edit() function in bl-kernel/pages.class.php, 
  which iterates all fields declared in dbFields without per-field 
  authorization, enabling an Author to convert pages to static site-wide 
  navigation entries or transfer page ownership to arbitrary accounts.
