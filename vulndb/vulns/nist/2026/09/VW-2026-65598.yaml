title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/sysfs:
  Add CAP_SYS_ADMIN check to __resource_resize_store()\n\nCurrently, the __resource_resize_store()
  allows writing to the\nresourceN_resize sysfs attribute to change a BAR's size without
  checking\nfor capabilities, currently relying only on the file access check.\n\n\
  Resizing a BAR modifies PCI device configuration and can disrupt active\ndrivers.\
  \  After the upcoming conversion to static attributes, it will also\ntrigger resource
  file updates via sysfs_update_groups().\n\nAdd a CAP_SYS_ADMIN check to prevent
  unprivileged users from performing BAR\nresize operations."
