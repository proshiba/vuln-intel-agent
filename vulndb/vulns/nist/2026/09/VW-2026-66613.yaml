title: 'ClawHub (openclaw/clawhub) application/backend contains a flaw in the skill
  report moderation flow: four distinct ordinary authenticated accounts can report
  a visible skill and trigger automatic hiding (moderationStatus: hidden) of that
  skill from the catalog without any moderator decision. Because the reporter quota
  counts only reports filed against visible targets, the same accounts can repeat
  the process against additional skills; official skills are not exempt. The issue
  was confirmed at revision cbfee7343ddc867316dd9b3de6fa8856730f9f41; the complete
  historical affected range was not established. The fix (PR #3681) is included in
  revision 8c2de6c506bb4efabe3f0c2ffb8370b9e23d4650; self-hosted deployments should
  update to that revision or a later descendant. The npm CLI and OpenClaw runtime
  are separate products and are not affected.'
