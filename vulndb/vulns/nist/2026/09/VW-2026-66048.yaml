title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  ice: don't dereference pointers from TP_printk()\n\nAfter forwarding net-next during
  the v7.3 merge window we started\nseeing:\n\n  TRACE EVENT ERROR: Event ice_tx_dim_work
  has double dereference in TP_printk: REC->q_vector->tx.tx_ring->q_index\n  WARNING:
  kernel/trace/trace_events.c:420 at test_double_dereference.cold+0x39/0x4b\n\nthis
  is due to extra checks added in tracing subsystem in\ncommit b5cc230af5e5 (\"tracing:
  Warn when an event dereferences a pointer in TP_printk()\").\n\nPrinting happens
  long after the event was recorded, by which point\nthe pointers may be invalid (the
  ring or the dim instance).\nCopy the eight scalars into the event instead."
