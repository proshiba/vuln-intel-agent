title: "In the Linux kernel, the following vulnerability has been resolved:\n\necryptfs:
  hold msg ctx list lock when cleaning daemon queue\n\necryptfs_exorcise_daemon()
  drops queued messages from a dying daemon\nwithout holding ecryptfs_msg_ctx_lists_mux,
  but\necryptfs_msg_ctx_alloc_to_free() requires that lock.\n\nTake the list lock
  while moving the queued contexts back to the free\nlist to avoid racing with other
  global msg ctx list users."
