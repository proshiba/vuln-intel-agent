title: GNU libextractor before 1.15 contains a stack-based buffer overflow 
  vulnerability in the process_star_office function that sizes a variable-length
  stack array from attacker-controlled OLE2 stream data. Attackers can craft 
  malicious StarOffice documents that allocate up to 4 MB on the stack, causing 
  stack overflow and crashing any application extracting metadata from the 
  document.
