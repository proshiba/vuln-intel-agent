title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btintel: bound firmware ID by TLV length\n\nThe firmware ID is treated as a NUL-terminated
  string even though the\nTLV length is its only boundary. If the value does not contain
  a NUL\nterminator, snprintf() can read beyond the received response.\n\nLimit the
  conversion to the advertised TLV value length."
