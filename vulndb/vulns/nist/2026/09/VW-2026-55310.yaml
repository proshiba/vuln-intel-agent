title: The $regexFindAll expression can be used by an authenticated user who can
  run aggregation pipeline stages to crash a MongoDB server (mongod). Under 
  certain specific conditions the  regex match can start in the middle of a 
  multi-code-unit character, triggering an assertion during query execution.
