title: 'Suricata is a network Intrusion Detection System, Intrusion Prevention System
  and Network Security Monitoring engine. Prior to versions 7.0.16 and 8.0.5, Suricata
  could repeatedly perform expensive parsing of large HTTP `Content-Disposition` headers
  during HTTP response body processing. Crafted HTTP traffic could cause excessive
  CPU usage and denial of service. Versions 7.0.16 and 8.0.5 contain a fix. As a workaround,
  use a rule like `alert http1 any any -> any any (sid: 1; http.request_header; content:
  "Content-Disposition:"; startswith; bsize: > 8192; bypass;)`.'
