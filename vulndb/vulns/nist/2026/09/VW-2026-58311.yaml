title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/core:
  Handle pick_task() releasing the rq lock\n\nCore scheduling's pick_next_task() breaks
  when a ->pick_task()\nimplementation can release the rq lock. The selection state
  derived on entry\nis only valid while the lock is held continuously. Once a pick
  can drop the\nlock, an interleaving selection can invalidate all of it: the single-CPU\n\
  fast path can commit an uncookied pick although the core went cookied during\nthe
  release, and forceidle committed by the interleaving selection skews the\nrestarted
  pass's accounting.\n\nFix it by restarting the whole selection when a pick returns
  RETRY_TASK\nafter releasing the lock: a single restart point above the state derivation\n\
  replaces the per-loop restart labels, so a retry picks up state committed by\ninterleaving
  selections and accounts and resets forceidle like a fresh\nselection would.\n\n\
  need_sync and fi_before latch across retries. Clock validity can't be\nre-derived
