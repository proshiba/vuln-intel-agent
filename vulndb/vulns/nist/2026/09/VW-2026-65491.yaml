title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  au1000: move free_irq out of the close-time spinlocked section\n\nau1000_close()
  calls free_irq() while aup->lock is still held with\nspin_lock_irqsave(). free_irq()
  can sleep because it takes the IRQ\ndescriptor request mutex, so it does not belong
  inside the close-time\nspinlocked section.\n\nThis was found by our static analysis
  tool and then confirmed by manual\nreview of the in-tree au1000_close() .ndo_stop
  path. The reviewed path\nkeeps aup->lock held across the MAC reset, queue stop and\n\
  free_irq(dev->irq, dev).\n\nA directed runtime validation kept that ndo_stop carrier
  and the same\nfree_irq(dev->irq, dev) operation under the driver lock. Lockdep reported\n\
  \"BUG: sleeping function called from invalid context\" and \"Invalid wait\ncontext\"\
  \ while free_irq() was taking desc->request_mutex, with\nau1000_close() and free_irq()
