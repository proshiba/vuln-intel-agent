title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  validate and share PSP fw_pri_buf copies via psp_copy_fw\n\nChange psp_copy_fw from
  void to int: return -ENODEV when drm_dev_enter\nfails, and -EINVAL when the image
  size is zero or larger than the\n1 MiB PSP private buffer.\n\nReplace open-coded
  memset/memcpy into fw_pri_buf with psp_copy_fw."
