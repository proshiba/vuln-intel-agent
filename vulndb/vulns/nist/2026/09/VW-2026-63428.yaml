title: A flaw was found in cockpit-files. A local unprivileged attacker can 
  exploit a race condition during directory creation with owner assignment. By 
  controlling a writable parent directory, the attacker can replace a newly 
  created directory with a symbolic link (symlink) before the ownership change 
  operation (chown) is applied. This allows the attacker to redirect the 
  ownership change to an arbitrary file, potentially leading to information 
  disclosure or unauthorized modification of sensitive files.
