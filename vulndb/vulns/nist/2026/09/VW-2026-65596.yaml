title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngenirq/proc:
  Size interrupt directory names for 10-digit interrupt numbers\n\n/proc/irq/<n>/
  directory names are built in `char name[10]` buffers\nwith `sprintf(name, \"%u\"\
  , irq)`.\n\nTen-digit IRQ numbers already need 11 bytes including the trailing NUL,
  and\ncurrent sparse-IRQ configurations allow interrupt numbers in that range.\n\n\
  Size the temporary name buffer for the current decimal form and switch\nto bounded
  formatting when creating or removing the proc entry."
