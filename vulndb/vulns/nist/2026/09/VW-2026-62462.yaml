title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: reject out-of-range link ids in mt76_vif_link()\n\nmt76_vif_link() indexes
  mvif->link[] without validating link_id, but\ncallers pass mvif->deflink_id / msta->deflink_id,
  which hold\nIEEE80211_LINK_UNSPECIFIED (0xf) until the first link has been added.\n\
  Since IEEE80211_MLD_MAX_NUM_LINKS is 15, that reads one element past the\nend of
  the array, aliasing mt76_vif_data.offchannel_link.\n\nReachable via mt7996_set_tsf()/mt7996_offset_tsf()
  and\nmt7996_net_fill_forward_path(). Bounds check link_id and return NULL,\nmatching
  mt7996_sta_link() and mt7996_sta_link_protected()."
