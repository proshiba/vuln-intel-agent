title: hono before 4.13.7 fails to HTML-escape plain strings rendered by 
  hono/jsx as a child or fallback of Suspense, as a string child of 
  ErrorBoundary alongside an asynchronous sibling, as the single child of a 
  Context.Provider, or as the root value passed to renderToString() or 
  renderToReadableStream() from hono/jsx/dom/server. These paths stringify their
  input and treat the result as already-escaped markup, so an attacker who 
  controls such a string during server-side rendering can inject arbitrary HTML 
  and execute script under the application's origin.
