title: GFI Exinda AI and ClearView before 7.6.5 contains a path traversal 
  vulnerability in the diagnostic file deletion handler. The 
  unlink_or_email_file() function accepts parameters prefixed with v_file_row_ 
  and appends their values directly to a base directory path without sanitizing 
  for directory traversal sequences. An authenticated attacker with Admin 
  privileges can delete arbitrary files from the system in the context of root.
