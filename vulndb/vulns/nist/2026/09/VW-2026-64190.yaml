title: "Allocation of Resources Without Limits or Throttling vulnerability in Erlang/OTP
  ssh allows an authenticated remote attacker to exhaust node memory by repeatedly
  opening session channels that are never assigned a handler.\n\nThe \"session\" clause
  of ssh_connection:handle_msg/4 checks only minimal_remote_max_packet_size before
  calling setup_session/5, which unconditionally builds a #channel{} record and stores
  it in the ETS channel cache. The max_channels daemon option is consulted only by
  ssh_channel_sup:max_num_channels_not_exceeded/2, which counts supervisor children,
  so a channel that never gets a shell, exec, or subsystem handler is invisible to
  the limit and setting the option to a finite value does not mitigate the attack.
  RFC 4254 section 5.1 permits many session channels per connection, and each record
  costs only a few hundred bytes, so a single authenticated connection can accumulate
  channels until the node runs out of memory and the emulator terminates, affecting
