title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt76x02: do not WARN on invalid rx descriptor length\n\nThe MPDU length in
  the rx descriptor comes from the hardware. In\nmonitor mode with the fcsfail filter
  enabled, the hardware passes up\ncorrupted frames, and a corrupted frame can report
  a length larger\nthan the received buffer. The bounds check correctly discards such\n\
  frames, but its WARN_ON_ONCE wrapper means any over-the-air garbage\nframe taints
  the kernel, and panics it on the first such frame when\npanic_on_warn is set.\n\n\
  Drop the WARN and discard the frame silently, matching what\ncommit c2d4c8723dbf
  (\"mt76x2: remove some harmless WARN_ONs in tx\nstatus and rx path\") did for the
  neighboring rx and tx status paths.\n\nObserved immediately on rx with an MT7612U
  in fcsfail monitor mode\non a busy channel."
