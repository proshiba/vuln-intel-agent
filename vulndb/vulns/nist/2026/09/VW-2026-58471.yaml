title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix layout fence worker double-reference race\n\nThe workqueue core clears WORK_STRUCT_PENDING
  before the callback\nis invoked, so delayed_work_pending() in lm_breaker_timedout()
  can\nreturn false while the fence worker is already running. This lets\nthe breaker
  take a duplicate sc_count reference and schedule a new\nworker that coalesces with
  the in-progress one. The extra reference\nis never put, leaking the layout stateid.\n\
  \nReplace the racy delayed_work_pending() check with an\nls_fence_inflight boolean
  set atomically with\nrefcount_inc_not_zero() under ls_lock, and cleared under ls_lock\n\
  before the final nfs4_put_stid() on the dispose path; the retry\npath intentionally
  retains it.  Remove the self-rearm\nmod_delayed_work() at the top of the worker."
