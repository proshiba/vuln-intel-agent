title: The Hide My WP Ghost WordPress plugin before 7.0.11 does not verify that 
  a request is a genuine WooCommerce request before disabling its firewall, 
  threat-detection and login/URL-hiding protections, treating the mere presence 
  of an attacker-suppliable request parameter as sufficient, which allows 
  unauthenticated attackers to disable those protections and re-expose the 
  concealed login and admin URLs on any request.
