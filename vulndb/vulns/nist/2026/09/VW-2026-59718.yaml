title: A vulnerability has been found in GPAC up to f1219cde. This issue affects
  the function gf_url_concatenate_ex of the file utils/url.c of the component 
  URL Handler. The manipulation leads to heap-based buffer overflow. An attack 
  has to be approached locally. Upgrading to version abi-16.23 is capable of 
  addressing this issue. The identifier of the patch is 
  afca1f1181668d85941d51ed1adf647807d5d975. It is advisable to upgrade the 
  affected component.
