title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB read in rtw_restruct_wmm_ie()\n\nrtw_restruct_wmm_ie() scans
  in_ie for a WMM IE with:\n\n\twhile (i < in_len) {\n\t\t...\n\t\tif (i + 5 < in_len
  && in_ie[i] == 0xDD && ...) {\n\t\t\t...\n\t\t\tbreak;\n\t\t}\n\t\ti += (in_ie[i
  + 1] + 2); /* to the next IE element */\n\t}\n\nWhen the \"i + 5 < in_len\" match
  check fails simply because i is\nwithin 5 bytes of the end of the buffer (i.e. no
  WMM IE was found\nnear the tail of in_ie), execution falls through to\n\"i += (in_ie[i
  + 1] + 2)\", which reads in_ie[i + 1]. If i == in_len\n- 1 at that point, this is
  a 1-byte out-of-bounds read of an\nattacker-influenced IE buffer built from association/scan
  data.\n\nCommit a75281626fc8f (\"staging: rtl8723bs: fix potential\nout-of-bounds
  read in rtw_restruct_wmm_ie\") added the \"i + 5 <\nin_len\" guard to the match
  condition itself, but did not add an\nequivalent guard before the fallthrough advance,
  so the same class\nof OOB read remained reachable "
