title: "A server-side request forgery issue due to improper validation of equivalent
  address representations in the port forwarding to remote hosts functionality in
  Amazon AWS Systems Manager Agent (SSM Agent) before 3.3.4851.0 on all platforms
  might allow an authenticated remote user to bypass the remote destination denylist
  and reach link-local endpoints, potentially obtaining the temporary IAM role credentials
  of a managed instance and acting with that role's permissions from outside the instance,
  via a crafted destination host value that uses an alternate representation of a
  denied link-local address.\n\n\n\nTo remediate this issue, users should upgrade
  to version 3.3.4851.0 or later."
