title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexit:
  hold a reference to thread_pid across proc_flush_pid\n\nCommit 0a36bad01731 (\"\
  release_task: kill the no longer needed\nget/put_pid(thread_pid)\") removed the
  reference around proc_flush_pid().\nIt assumed that free_pids(post.pids) at the
  end of release_task() would\nkeep thread_pid alive until then.\n\nThat assumption
  is wrong.  __change_pid() only records a detached PID in\npost.pids when pid_has_task()
  is false for every PIDTYPE.  If another task\nstill uses the exiting task's PID
  as its process group or session ID,\n__unhash_process() removes the exiting task's
  PIDTYPE_PID link but leaves\nthe PID out of post.pids.  release_task() therefore
  holds no reference to\nit after dropping tasklist_lock.\n\nThe other task can then
  remove the remaining PIDTYPE links.  Its\nfree_pids() call schedules delayed_put_pid(),
  and the RCU callback can free\nthe PID before the first release_task() reaches proc_flush_pid().\n\
  \nAn unprivileged repro"
