title: Dobase is an open-source, self-hosted workspace with installable tools. 
  Versions prior to 2026.06.03 have a one-click stored DOM-based cross-site 
  scripting (XSS) vulnerability in the public, unauthenticated shared-folder 
  image gallery. A file's `name` is fully attacker-controlled and is never 
  sanitized. It is round-tripped through an ERB-escaped `data-name` attribute, 
  decoded back to its raw value by `el.dataset.name`, and then re-injected into 
  `innerHTML` by the `public-gallery` Stimulus controller with no escaping. Any 
  authenticated workspace member who can share a Files folder can store a 
  payload; the victim is anyone with the public share link (no authentication 
  required). The global Content-Security-Policy is sent report-only (not 
  enforcing), so an inline `onerror` handler executes — this is an executing 
  XSS, not a CSP-mitigated injection. Version 2026.06.03 fixes the issue.
