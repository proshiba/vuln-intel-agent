title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. From 1.8.0 until 2.5.1, 
  authenticated Termix users can access the server-stats API without per-host 
  authorization. GET /status returns statuses for hosts the requester cannot 
  access, GET /status/:id accepts an attacker-supplied numeric host identifier, 
  and POST /clear-connections permits a regular user to clear the global SSH 
  connection pool. The affected src/backend/ssh/server-stats.ts routes expose 
  host online or offline state and lastChecked timestamps and can disrupt other 
  users' active sessions or pooled connections. Unauthenticated requests remain 
  blocked, but authentication alone does not preserve tenant isolation. This 
  issue is fixed in version 2.5.1.
