title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  rockchip: rockchip_pdm: Handle runtime PM resume failures in set_fmt\n\nrockchip_pdm_set_fmt()
  calls pm_runtime_get_sync() before accessing\nhardware registers, but ignores its
  return value.\nIf the runtime resume fails, the function continues to perform register\n\
  accesses while the device state is undefined.\nReplace pm_runtime_get_sync() with
  pm_runtime_resume_and_get() and\nreturn early on failure to avoid unpowered register
  accesses."
