title: A security issue in MongoDB Server allows an authenticated user with 
  write privileges to trigger a persistent fatal assertion crash by sending 
  specially crafted retryable write commands. The crash state is durably 
  persisted, causing the server process to repeatedly crash on restart and 
  potentially propagating to additional nodes in a sharded cluster. Manual 
  intervention is required to restore service availability.
