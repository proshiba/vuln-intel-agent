title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  keembay - Initialize completion before requesting IRQ\n\nkmb_ocs_aes_probe() requests
  the device IRQ before initializing\nirq_completion. Once the handler is registered
  it can run immediately,\nand ocs_aes_irq_handler() unconditionally calls complete().
  An\ninterrupt in this window would therefore use an uninitialized\ncompletion.\n\
  \nInitialize the completion before requesting the IRQ, as the sibling\nOCS HCU and
  ECC drivers already do."
