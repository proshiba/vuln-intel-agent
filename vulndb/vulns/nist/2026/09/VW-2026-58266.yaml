title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix stream->outcnt underflow on duplicate RECONF responses\n\nA cached RECONF chunk
  may contain more than one request parameter.  A\nduplicate response can therefore
  find and process the same ADD_OUT request\nagain while another parameter is still
  outstanding, rolling back outcnt\ntwice and possibly underflowing it.\n\nTrack outstanding
  request types as bits and clear each bit after its first\nresponse.  Later responses
  for the same request are then ignored."
