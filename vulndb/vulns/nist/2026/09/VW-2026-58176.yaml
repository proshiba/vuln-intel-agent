title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmfd:
  qnap-mcu: keep the reply buffer alive past a command timeout\n\nqnap_mcu_exec()
  publishes an on-stack buffer to the receive path:\n\n\tunsigned char rx[QNAP_MCU_RX_BUFFER_SIZE];\n\
  \t...\n\treply->data = rx;\n\treply->length = length;\n\nand qnap_mcu_receive_buf()
  writes into it from the serdev receive path,\nwhich runs out of flush_to_ldisc()
  and is not serialized against\nqnap_mcu_exec() at all. bus_lock cannot cover it,
  because qnap_mcu_exec()\nholds that mutex across wait_for_completion_timeout().\n\
  \nOn a timeout qnap_mcu_exec() returns with reply->data still pointing at\nits own
  frame. A reply that arrives late, or an unsolicited message from\nthe MCU, is then
  written into a stack frame that has been left, corrupting\nwhatever runs next on
  that stack. The same applies when qnap_mcu_write()\nfails, since that path returns
  without touching the reply state either.\n\nMove the receive buffer into struct
  qnap_mcu. It is 37 bytes and the\ns"
