title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  cs35l33: drain threaded IRQ before runtime suspend\n\ncs35l33_runtime_suspend()
  currently switches the codec into\nregcache_cache_only(true) and powers it down
  without first quiescing the\nthreaded IRQ registered by devm_request_threaded_irq().
  That leaves a\nwindow where cs35l33_irq_thread() can still run after suspend has
  closed\noff live register access.\n\nA running system can reach this during runtime
  PM while the driver still\nhas critical fault IRQs unmasked. If the threaded handler
  runs in that\nwindow, it reads volatile INT_STATUS_1/2 after cache_only has been\n\
  enabled, ignores the regmap_read() failures, and can still drive the\nAMP_SHORT_RLS,
  CAL_ERR_RLS, OTE_RLS, and OTW_RLS release paths.\n\nUse disable_irq() before entering
  cache_only/power-off so any in-flight\nthreaded handler is drained and no new IRQ
  thread can run during the\nsuspended state. Re-enable the IRQ only after runtime_resume()
  has\nrestored live reg"
