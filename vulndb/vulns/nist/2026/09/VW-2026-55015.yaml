title: 'A weakness has been identified in vgmstream up to r2117. This issue affects
  the function sscanf of the file src/meta/txth.c of the component txth-txtp. This
  manipulation causes stack-based buffer overflow. The attack is possible to be carried
  out remotely. The exploit has been made available to the public and could be used
  for attacks. Patch name: 4669d37a6af94866f6f0628678f9f90d46954e8b. To fix this issue,
  it is recommended to deploy a patch.'
