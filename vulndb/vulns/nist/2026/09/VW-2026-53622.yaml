title: n8n versions before 2.34.1 contain a server-side request forgery 
  vulnerability in the legacy request helper function exposed to Code and 
  Function nodes. The validation logic checks the uri property for SSRF safety 
  while the underlying HTTP client uses the url property when both are present, 
  allowing attackers to bypass validation by supplying a safe uri alongside a 
  malicious url to access internal addresses.
