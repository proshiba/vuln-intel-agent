title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/drm_exec:
  fix up contended obj when num_objects is 0\n\ndrm_exec_prepare_array() silently
  returns success without calling\ndrm_exec_lock_contended() when num_objects is zero.
  This breaks the\ninvariant upheld by drm_exec_lock_obj(), where every entry point
  into\nthe locking sequence must first attempt to lock any previously\ncontended
  object before proceeding.\n\nDrivers that chain multiple drm_exec_prepare_array()
  calls per\ndrm_exec_until_all_locked() iteration (e.g. amdgpu's userq signal/wait\n\
  ioctls, which prepare separate read and write BO arrays) can pass an\nempty array
  for one of the two calls. If contention is hit while\npreparing the non-empty array,
  exec->contended is set and the loop\nretries; on retry, the empty-array call preceding
  it is a no-op that\nnever clears exec->contended, so drm_exec_retry_on_contention()\n\
