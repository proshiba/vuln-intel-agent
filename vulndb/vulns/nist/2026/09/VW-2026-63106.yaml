title: The Master Addons for Elementor – Elementor Addons, Widgets, Mega Menu 
  Builder, Popup Builder, Widget Builder & Template Kits plugin for WordPress is
  vulnerable to authorization bypass in all versions up to, and including, 
  3.2.2. This is due to the plugin not properly verifying that a user is 
  authorized to perform an action. This makes it possible for authenticated 
  attackers, with contributor-level access and above, to modify the title and 
  metadata of arbitrary WordPress posts or permanently delete arbitrary 
  WordPress posts by supplying an attacker-controlled popup_id. The required 
  nonce is emitted on the edit-jltma_popup admin screen, which is accessible to 
  Contributors because the jltma_popup custom post type is registered with 
  capability_type='post'.
