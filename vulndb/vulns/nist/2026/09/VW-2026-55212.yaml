title: XenForo before 2.3.13 contains a server-side request forgery 
  vulnerability in the PayPal REST webhook handler that allows unauthenticated 
  attackers to cause the server to make outbound HTTP requests to arbitrary 
  destinations by supplying a crafted certificate URL in webhook headers without
  scheme, hostname, or allowlist validation. Attackers can submit a crafted POST
  to the PayPal webhook callback endpoint to reach internal network resources 
  including cloud instance metadata services, potentially disclosing IAM 
  credentials or enabling secondary internal service exploitation.
