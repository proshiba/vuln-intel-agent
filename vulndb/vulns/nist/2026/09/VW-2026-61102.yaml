title: Novel vulnerabilities to launch algorithmic complexity attacks on DNSSEC 
  have been researched under the term 'ReTrap'. These result in degradation of 
  service when malicious zones are used to serve the algorithmic complexity 
  vulnerabilities. NLnet Labs Unbound up to and including 1.26.0 is vulnerable 
  to some of them. TagTrap, where  the triple(Zone, Algo, KeyTag) matching 
  mechanism introduces a significant attack vector when resolvers handle 
  malicious responses containing numerous mismatched DNSKEY, RRSIG, and DS 
  record. DelegationTrap, where constructing the chain-of-trust requires 
  iterative validation of DNSKEY and DS records from the root zone downward. For
  deeply nested domains, this results in significant computational overhead. 
  NsecTrap, where  responses with excessive invalid NSEC records compel the 
  resolver to validate each one. AdditionalTrap, where Unbound by default would 
  try to DNSSEC validate the ADDITIONAL section as well. This can be exploited 
  to waste validation resource
