title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  Fix hot-unplug skipped when last AP adapter or domain removed\n\nThe vfio_ap_mdev_hot_unplug_cfg()
  function uses the return value of\nbitmap_andnot() to determine whether the guest
  APCB needs to be updated.\nHowever, bitmap_andnot() returns false when the resulting
  destination\nbitmap is empty. This means that if the only adapter, domain or control\n\
  domain assigned to an mdev is removed from the host's AP configuration,\nthe bit
  is correctly cleared from the shadow APCB, but bitmap_andnot()\nreturns false because
  the result is an empty bitmap. Consequently,\ndo_hotplug remains 0 and vfio_ap_mdev_update_guest_apcb()
  is never called,\nleaving the KVM guest with stale hardware access to the unplugged
  AP\ndevices.\n\nFix this by replacing the bitmap_andnot() return value check with\n\
  bitmap_intersects() to determine whether the shadow APCB actually\noverlaps with
  the removal mask. If there is an intersection, call\nbitmap_an"
