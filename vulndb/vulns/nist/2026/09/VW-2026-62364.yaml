title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: free the HCI command when it is cancelled\n\nmgmt_hci_cmd_sync() queues the
  pending command with a NULL destroy\ncallback, so it is only freed if send_hci_cmd_sync()
  runs. A cancelled\nentry is leaked, as _hci_cmd_sync_cancel_entry() does not release\n\
  entry->data when there is no destroy callback, and hci_cmd_sync_clear()\ncancels
  every pending entry when the controller is unregistered. Nothing\nelse reclaims
  it either: mgmt_pending_new() does not put the command on\nhdev->mgmt_pending.\n\
  \nThe leak also pins the socket reference taken by mgmt_pending_new(), so\nthe mgmt
  socket is never released.\n\nFree the command from a destroy callback. The now-empty
  done label is\nreplaced by a direct return."
