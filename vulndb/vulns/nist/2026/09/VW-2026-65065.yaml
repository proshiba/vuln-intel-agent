title: "A flaw was found in the automation-controller notification\n             \
  \     subsystem. Although NotificationTemplate.notification_\n                 \
  \ configuration is protected from API filtering, its recipient\n               \
  \   value is copied in clear text into the unprotected\n                  Notification.recipients
  field on every send. Because the\n                  credential-types endpoint is
  listable by any authenticated\n                  user and the API filter backend
  traverses object relations\n                  without per-hop authorization, a user
  with no privileges can\n                  use a relational filter as a boolean count-oracle
  to recover,\n                  character by character and across organizations,
  the secret\n                  recipient values of other tenants' notifications —
  including\n                  PagerDuty service keys and Slack/Mattermost/RocketChat/Webhook\n\
  \                  bearer-token URLs. This flaw affects confidentiality."
