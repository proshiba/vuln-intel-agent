title: "ServiceNow has remediated an authorization bypass security issue that was
  identified in the ServiceNow AI Platform. This security issue, if exploited, could
  enable an authenticated user to access data within the ServiceNow AI Platform that
  the user otherwise would not be entitled to access, potentially enabling further
  unintended access.\n\n\n\n\n\nServiceNow deployed an update to hosted instances,
  and ServiceNow provided the update to our partners and self-hosted customers. We
  are not currently aware of malicious exploitation against ServiceNow instances.
  We recommend customers promptly apply appropriate updates or upgrade to a patched
  release if they have not already done so."
