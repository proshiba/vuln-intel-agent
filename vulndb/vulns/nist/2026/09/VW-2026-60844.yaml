title: 'Vulnerability in the Oracle Hyperion Data Relationship Management product
  of Oracle Hyperion (component: Access and security).   The supported version that
  is affected is 11.2.26.0.000. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via HTTP to compromise Oracle Hyperion Data Relationship
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  update, insert or delete access to some of Oracle Hyperion Data Relationship Management
  accessible data as well as  unauthorized read access to a subset of Oracle Hyperion
  Data Relationship Management accessible data and unauthorized ability to cause a
  partial denial of service (partial DOS) of Oracle Hyperion Data Relationship Management.
  CVSS 3.1 Base Score 7.3 (Confidentiality, Integrity and Availability impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L).'
