title: Acrobat Reader versions 24.001.30264, 20.005.30793, 25.001.20982, 
  24.001.30273, 20.005.30803 and earlier are affected by an out-of-bounds read 
  vulnerability when parsing a crafted file, which could result in a read past 
  the end of an allocated memory structure. An attacker could leverage this 
  vulnerability to execute code in the context of the current user. Exploitation
  of this issue requires user interaction in that a victim must open a malicious
  file.
