title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  uvesafb: unregister connector callback on init failure\n\nuvesafb_init() registers
  the v86d connector callback before registering\nthe platform driver. If platform_driver_register()
  fails, the function\nreturns the error directly and leaves the connector callback
  registered.\n\nThe later platform-device failure path already unregisters the callback.\n\
  Add the same cleanup before the final return when platform-driver\nregistration
  fails.\n\nThis issue was identified during our ongoing static-analysis research
  while\nreviewing kernel code."
