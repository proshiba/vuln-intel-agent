title: RabbitMQ is a messaging and streaming broker. From 3.13.0 until 3.13.15, 
  4.0.20, 4.1.11, and 4.2.6, the Web STOMP WebSocket handler enforced neither 
  max_frame_size nor login_timeout before authentication, allowing an 
  unauthenticated client to keep a connection alive with a slow stream of small 
  frames and accumulate unbounded pre-authentication state. The 
  rabbitmq_web_stomp plugin must be enabled, and no authentication is required 
  to reach the vulnerable path. This issue is fixed in versions 3.13.15, 4.0.20,
  4.1.11, and 4.2.6.
