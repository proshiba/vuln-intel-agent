title: "Allocation of Resources Without Limits or Throttling vulnerability in ash-project
  ash_authentication_oauth2_server allows an unauthenticated attacker to exhaust database
  storage and memory.\n\nThe /authorize endpoint is unauthenticated by design. With
  Client ID Metadata Documents enabled, resolve_client/3 in AshAuthentication.Oauth2Server.CIMD
  fetches the document for each new URL-shaped client_id and upserts a client row,
  with no cap on the number of rows, no expiry or garbage collection, and no length
  bound on the fetched fields; the document was also placed in CIMD.Cache before validation,
  so even rejected documents held cache memory until their TTL. An attacker serving
  valid documents at many distinct URLs creates one permanent client row per URL,
  each able to carry multi-megabyte strings, growing storage and memory without bound.\n\
  \nThis issue affects ash_authentication_oauth2_server: from 0.3.0 before 0.3.1."
