title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  validate usa_ofs before preserving the update sequence number\n\nWhen ntfs_mft_record_alloc()
  reuses a free mft record it reads the old\nupdate sequence number straight from
  the on-disk record:\n\n     usn = *(__le16 *)((u8 *)m + le16_to_cpu(m->usa_ofs));\n\
  \nHere m points into the raw $MFT page-cache folio, which still holds\nunvalidated,
  MST-protected bytes: the folio is read by a plain\niomap_read_folio() and neither
  post_read_mst_fixup() nor\nntfs_mft_record_check() has run on it (both work on private
  copies).\nm->usa_ofs is therefore an untrusted u16, and a corrupted record can put\n\
  it past the end of the record so the two-byte read lands outside the\nfolio.  Reading
  such a record while creating a file gives, under KASAN:\n\n   BUG: KASAN: use-after-free
  in ntfs_mft_record_alloc+...\n   Read of size 2 at addr ...\n    ntfs_mft_record_alloc
  -> __ntfs_create -> ntfs_create -> path_openat\n\nOnly preserve the old update sequence "
