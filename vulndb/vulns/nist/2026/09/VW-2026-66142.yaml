title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  Remove conflicting altnames for dying netns in __dev_change_net_namespace().\n\n\
  syzbot reported the warning in cfg80211_pernet_exit(). [0]\n\nThe repro does the
  following:\n\n  1. create two device in root netns and non-root netns\n  2. assign
  the same altname for the two devices\n  3. remove the non-root netns\n\nSince commit
  7663d522099e (\"net: check for altname conflicts\nwhen changing netdev's netns\"\
  ), cfg80211_switch_netns() and\ncfg802154_switch_netns() fail if init_net has a
  device with the\nconflicting altname.\n\ndefault_device_exit_net() had the same
  issue and commit d09486a04f5d\n(\"net: fix removing a namespace with conflicting
  altnames\") fixed it.\n\ncfg80211_pernet_exit() and cfg802154_pernet_exit() need
  the same fix.\n\nLet's generalise the fix by removing conflicting altnames for dying\n\
  netns in __dev_change_net_namespace().\n\n[0]:\ncfg80211_switch_netns(rdev, &init_net)\n\
  WARNING: net/wireless/core.c:1871 at cfg80211_pern"
