title: The WP OAuth Server ( Login with WordPress ) WordPress plugin before 
  6.4.0 does not bind the OpenID Connect identity assertion it issues to the 
  authorization grant being exchanged, returning instead the assertion belonging
  to whichever user authenticated most recently, which allows users with the 
  Subscriber role and above to obtain a validly signed identity assertion for 
  another user, including an administrator, and authenticate as them at any 
  application that uses the site for single sign-on.
