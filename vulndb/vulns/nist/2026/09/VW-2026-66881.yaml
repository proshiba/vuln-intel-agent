title: Contrast through 1.20.0 contains a panic vulnerability in the 
  transit-engine endpoint's ciphertextContainer.UnmarshalJSON function that 
  fails to validate decoded ciphertext length before slicing. An authenticated 
  workload with a valid mesh certificate can trigger a runtime panic by 
  submitting a short base64-encoded ciphertext, causing log spam and request 
  failures without crashing the process.
