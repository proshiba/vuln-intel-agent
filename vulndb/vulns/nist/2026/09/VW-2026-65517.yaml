title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-fc:
  Do not cancel requests in io target before it is initialized\n\nA new nvme-fc controller
  in CONNECTING state sees admin request timeout\nschedules ctrl->ioerr_work to abort
  inflight requests. This ends up\ncalling __nvme_fc_abort_outstanding_ios() which
  aborts requests in both\nadmin and io tagsets. In case fc_ctrl->tag_set was not
  initialized we\nsee the warning below. This is because ctrl.queue_count is initialized\n\
  early in nvme_fc_alloc_ctrl().\n\nnvme nvme0: NVME-FC{0}: starting error recovery
  Connectivity Loss\nINFO: trying to register non-static key.\nThe code is fine but
  needs lockdep annotation, or maybe\nlpfc 0000:ab:00.0: queue 0 connect admin queue
  failed (-6).\nyou didn't initialize this object before use?\nturning off the locking
  correctness validator.\nWorkqueue: nvme-reset-wq nvme_fc_ctrl_ioerr_work [nvme_fc]\n\
  Call Trace:\n <TASK>\n dump_stack_lvl+0x57/0x80\n register_lock_class+0x567/0x580\n\
  \ __lock_acquire+0x330"
