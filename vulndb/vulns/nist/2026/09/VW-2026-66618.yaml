title: Flowise through 3.1.4 does not enforce authorization on the BullMQ admin 
  dashboard. When the server runs in queue mode with the dashboard enabled and 
  not in cloud mode (MODE=queue, ENABLE_BULLMQ_DASHBOARD=true, and !isCloud()), 
  the /admin/queues mount is protected only by the verifyTokenForBullMQDashboard
  middleware, which validates the JWT but performs no role, permission, or 
  workspace/organization scoping check; the mount also lies outside /api/v1/* so
  the global API gate does not apply. As a result, any authenticated user — 
  including the lowest-privileged member of any tenant — can reach the full 
  Bull-Board UI and view all queues and job payloads across the entire instance,
  including chat inputs and overrideConfig (which may carry credentials and 
  prompts), chatflow.flowData graph definitions with custom function source 
  code, credential IDs and system prompts, chatIds, files, and the originating 
