title: A vulnerability has been found in ningzichun student-management-system up
  to 98760f5711cf6dc8b4adca53a9e207ca49b02ebf. Affected by this issue is the 
  function echo of the file admin/fun/addLog.php. The manipulation of the 
  argument reason/detail leads to cross site scripting. The attack can be 
  initiated remotely. The exploit has been disclosed to the public and may be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
