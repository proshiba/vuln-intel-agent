title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm:
  fix race between partial drm_dev_register() failure and ioctl\n\nIf drm_dev_register()
  fails after registering a minor (e.g. render minor\nregistered, primary minor fails),
  userspace could have opened the first\nminor and entered a drm_dev_enter() critical
  section. Since the\nunplugged flag was never set, the ioctl proceeds while the error
  path\ntears down device resources.\n\nFix this by introducing drm_dev_synchronize_unplug(),
  which sets the\nunplugged flag and waits for the SRCU barrier, ensuring all in-flight\n\
  drm_dev_enter() critical sections complete before cleanup proceeds; call\nit on
  the error path of drm_dev_register()."
