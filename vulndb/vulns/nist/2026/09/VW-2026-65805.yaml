title: The HT Contact Form – Drag & Drop Form Builder for WordPress plugin for 
  WordPress is vulnerable to Stored DOM-Based Cross-Site Scripting via 
  'form_data' Rich Text Field via Draft Save/Resume in all versions up to, and 
  including, 2.10.1 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  Exploitation requires tricking a user into clicking an attacker-supplied draft
  resume URL, which the attacker constructs using the draft_key and access_token
  returned directly in the save response.
