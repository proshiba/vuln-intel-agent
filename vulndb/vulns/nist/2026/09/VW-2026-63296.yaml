title: LubeLogger is a self-hosted, open-source, web-based vehicle maintenance 
  and fuel mileage tracker. Prior to 1.6.8, authenticated non-administrative 
  users could reach HandleTranslationFileUpload and influence the name passed 
  from Controllers/FilesController.cs to RenameFile in Helper/FileHelper.cs. 
  RenameFile constructed newFilePath with string replacement and moved the 
  uploaded file without verifying the resolved absolute path remained under the 
  web root or data directory. A crafted upload name could therefore move an 
  uploaded file outside the intended storage directory, enabling unauthorized 
  file placement or overwrite with the privileges of the application process. 
  This issue is fixed in version 1.6.8.
