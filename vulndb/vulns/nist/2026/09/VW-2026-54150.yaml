title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  magicmouse: do not keep a stale msc->input if no input is claimed\n\nmagicmouse_input_mapping()
  caches the first hid_input's input_dev in\nmsc->input while the report descriptor
  is parsed, and the rest of the\ndriver treats a non-NULL msc->input as proof that
  an input device was\nregistered.\n\nThat does not hold on the hid-input error path.
  If hidinput_connect()\nfails -- for instance because input_register_device() returns
  an error --\nit unwinds through hidinput_disconnect(), which frees every input_dev
  it\ncreated, including the one cached in msc->input.\n\nThe failure does not abort
  the probe. hid_connect() only skips the claim:\n\n\tif ((connect_mask & HID_CONNECT_HIDINPUT)
  && !hidinput_connect(hdev,\n\t\t\t\tconnect_mask & HID_CONNECT_HIDINPUT_FORCE))\n\
  \t\thdev->claimed |= HID_CLAIMED_INPUT;\n\nand the \"device has no listeners\" bailout
  below it does not fire for this\ndriver, which sets ->raw_event; on the USB Magic
  Mouse 2 / Magic"
