title: The Online Scheduling and Appointment Booking System – Bookly plugin for 
  WordPress is vulnerable to unauthorized modification of data due to a missing 
  capability check on the 'updateAddon' function in all versions up to, and 
  including, 27.2. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to update any plugin with a main file of 
  'main.php' to its latest version.
