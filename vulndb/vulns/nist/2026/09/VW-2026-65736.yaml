title: Espruino 2v29 (commit bffc6d0) contains a stack-based buffer overflow 
  vulnerability in the JavaScript error stack-trace handling path on 64-bit 
  builds. A remote attacker can supply JavaScript input that triggers an 
  exception and reaches jslPrintTokenLineMarker(), which passes the address of a
  4-byte int column variable to jsvGetLineAndCol() as a size_t pointer. 
  jsvGetLineAndCol() performs an 8-byte write through the mismatched pointer, 
  overwriting adjacent stack memory.
