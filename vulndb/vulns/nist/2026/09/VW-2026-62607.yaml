title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject arena frees below the arena base\n\nbpf_arena_free_pages() accepts scalar
  arena addresses. The runtime\nmasks the address to the low 32 bits and reconstructs
  a full user\naddress from the arena base before returning the range to the arena\n\
  free tree.\n\nWhen the scalar value is below the low 32 bits of the arena base,\n\
  full_uaddr falls below user_vm_start. The existing upper-end clipping\nthen turns
  this into an out-of-range free-tree offset. A later\nallocation can reuse that offset
  and return an address below the arena\nmapping.\n\nReject such frees before computing
  the clipped range."
