title: mppx is a TypeScript interface for machine payments protocol. Prior to 
  0.8.2, the fee-payer cosigning path in src/tempo/internal/fee-payer.ts copied 
  a client-supplied access_list from a 0x78 FeePayerEnvelope without validating 
  its length or contents. Because EIP-2930 access-list entries consume intrinsic
  gas even when the listed addresses are never used, a client could add 
  fabricated address-only entries and cause the server fee_payer wallet to pay 
  unnecessary transaction fees. The demonstrated 180-entry list remained within 
  the 500,000 gas policy cap, 16 KB header limit, and RPC simulation budget 
  while increasing the fee by approximately 9.4 times. This issue is fixed in 
  version 0.8.2.
