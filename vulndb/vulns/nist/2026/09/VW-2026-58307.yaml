title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Fix rq->core_pick corruption under core scheduling\n\nCore scheduling's pick_next_task()
  picks what to run on every SMT sibling of\nthe core in a single pass under the shared
  core-wide rq lock. The selection\nstate is consistent only while the lock is held
  continuously, so\n->pick_task() originally could not release it. However, since
  4c95380701f5\n(\"sched/ext: Fold balance_scx() into pick_task_scx()\"), sched_ext
  runs\ndispatch from inside the pick and dispatching can drop the rq lock. To\nsupport
  this, pick_next_task() has been updated to restart the whole\nselection when a pick
  returns RETRY_TASK after releasing the lock.\n\nWhen selections on the same core
  interleave through the dropped lock, they\ncorrupt each other's state: one clears
  the other's rq->core_pick leading to\na NULL deref, or invalidates its keep-the-previous-task
  decision leaving a\ndequeued task running, which deadlocks the next wakeup and matches
