title: CubeCart is an ecommerce software solution. Prior to 6.7.5, 
  admin/sources/maintenance.index.inc.php places administrator-controlled 
  tablename values into ALTER TABLE, CHECK TABLE, and ANALYZE TABLE statements 
  without validating the identifiers or escaping embedded backticks. An 
  authenticated administrator can terminate the quoted identifier with a closing
  backtick and introduce attacker-controlled structural SQL, potentially 
  compromising database confidentiality, integrity, and availability within the 
  application's database privileges. This issue is fixed in version 6.7.5.
