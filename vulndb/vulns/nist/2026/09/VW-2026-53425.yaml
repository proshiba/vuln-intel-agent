title: PREVAIL is a Polynomial-Runtime EBPF Verifier using an Abstract 
  Interpretation Layer. Prior to version 0.2.4, the prevail eBPF verifier 
  accepts ALU32 ADD and SUB instructions that operate on pointer-typed registers
  without checking the is64 flag. Because ALU32 arithmetic zero-extends the 
  32-bit result, the upper half of any pointer is silently destroyed at runtime,
  yet prevail marks the program as verified safe. Any caller that can submit an 
  eBPF program for verification — including unprivileged users on kernels that 
  permit BPF program loading — can produce a program that passes verification 
  but faults or misbehaves at runtime. This issue has been patched in version 
  0.2.4.
