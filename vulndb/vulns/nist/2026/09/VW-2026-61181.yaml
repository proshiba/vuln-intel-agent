title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  fix firmware control interface bounds checks\n\npanthor_init_cs_iface() and panthor_init_csg_iface()
  validate firmware\ncontrol interface offsets with 32-bit arithmetic and the size
  of the host\nwrapper structures. The offsets are derived from firmware-provided
  strides,\nso the arithmetic can wrap before the bounds check, and the host wrapper\n\
  size is not the size of the firmware control interface being mapped.\n\nUse 64-bit
  arithmetic for the computed offsets and validate against the\nactual firmware control
  interface structure sizes with subtraction-based\nbounds checks. Also validate that
  the shared section is large enough for\nthe global control interface before using
  it."
