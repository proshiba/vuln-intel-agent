title: SiYuan versions from v2.1.0 before v3.8.4 contain a cross-site request 
  forgery vulnerability in the CheckAuth lock-screen pass-through branch that 
  grants administrator access to loopback requests without validating Origin 
  headers. Attackers can craft malicious web pages that force victims to 
  terminate the kernel process, read workspace configuration and proxy settings,
  and trigger administrative actions via zero-credential cross-origin requests 
  from the victim's browser.
