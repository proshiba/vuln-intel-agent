title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject resilient lock operations in rbtree callbacks\n\n__bpf_rbtree_add() keeps
  parent and link pointers live across calls to the\nprogram-supplied comparison callback.
  The verifier therefore requires the\nroot's lock to remain held throughout the callback.\n\
  \nThe helper path enforces this rule for bpf_spin_lock() and\nbpf_spin_unlock(),
  but the resilient lock kfunc argument path does not.\nSince resilient locks may
  protect BPF rbtree roots, a callback can release\nthe root lock and let another
  CPU remove and free the node referenced by\nthe in-progress tree walk. The walk
  then resumes using freed pointers.\n\nReject resilient lock kfuncs in an rbtree
  comparison callback, matching\nthe existing policy for the spin lock helpers. Resilient-lock-protected\n\
  trees remain valid when their comparison callbacks leave lock state alone."
