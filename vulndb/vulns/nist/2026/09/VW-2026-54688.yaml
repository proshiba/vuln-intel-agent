title: A vulnerability was found in openagents-org openagents up to 
  0.8.19/0.9.3.post20. Impacted is the function test_default_model of the file 
  sdk/src/openagents/sdk/transports/http.py. Performing a manipulation of the 
  argument base_url results in server-side request forgery. The attack may be 
  initiated remotely. The exploit has been made public and could be used. 
  Endpoint and both sinks unchanged since filing; only the file moved 
  (e277dd1a). Maintainer closed as inapplicable yet the identical unguarded code
  still ships in 0.9.3.post20. Sibling admin endpoints do call the 
  shipped-but-unused-by-this-handler _require_admin().
