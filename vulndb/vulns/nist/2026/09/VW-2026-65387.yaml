title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlocking/lockdep:
  Fix NULL pointer dereference in __lock_set_class()\n\nregister_lock_class() can
  return NULL when the lock class pool is\nexhausted, graph_lock() fails, or key validation
  fails. However,\n__lock_set_class() uses the return value directly in pointer arithmetic\n\
  without a NULL check:\n\n  class = register_lock_class(lock, subclass, 0);\n  hlock->class_idx
  = class - lock_classes;\n\nIf class is NULL, this computes a wild offset that corrupts\n\
  hlock->class_idx. The subsequent reacquire_held_locks() call will\ninvoke hlock_class()
  with this corrupted index, leading to a NULL or\nout-of-bounds pointer dereference.\n\
  \nAdd the missing NULL check, consistent with how __lock_acquire() already\nhandles
  this case at the same call site."
