title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - fix F55 transmitter electrode count typo\n\nDuring F55 sensor detection,
  the transmitter (TX) electrode count was\nincorrectly assigned the value of the
  receiver (RX) electrode count\ndue to copy-paste typos.\n\nThis incorrect value
  was then propagated to the driver data and used\nby F54 to determine the diagnostics
  report size. On devices with more\nRX than TX electrodes, this inflated the perceived
  TX count, leading\nto incorrect report size calculations and potential out-of-bounds\n\
  buffer accesses.\n\nFix the typos by correctly assigning the TX electrode counts."
