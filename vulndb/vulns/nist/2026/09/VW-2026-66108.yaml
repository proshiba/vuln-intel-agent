title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Require MEM_PERCPU for percpu kptr stores\n\nmap_kptr_match_type() treats perm_flags
  as the set of register type flags\nthat a kptr field permits. Adding MEM_PERCPU
  to that set for\nBPF_KPTR_PERCPU does not require the source register to carry it,
  however.\nThe subset test consequently accepts both a plain bpf_obj_new() allocation\n\
  and a referenced kernel pointer into a __percpu_kptr map field.\n\nLoads from the
  field are always marked MEM_PERCPU. Consumers then treat the\nstored value as the
  cookie returned by bpf_percpu_obj_new(): per-CPU pointer\nhelpers relocate it, and
  map teardown selects the per-CPU free path. A plain\nallocation can therefore provide
  an arbitrary kernel read/write, while a\nkernel pointer can be relocated into an
  invalid address or sent through a\nmissing destructor.\n\nRequire the source MEM_PERCPU
  flag to match the destination field kind.\nThis preserves valid bpf_percpu_obj_new()
  stores and rejects bo"
