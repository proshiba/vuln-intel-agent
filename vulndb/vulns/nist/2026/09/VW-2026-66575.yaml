title: OpenClaw (npm package 'openclaw') before 2026.7.1 does not enforce the 
  administrator scope requirement on browser control when it is reached through 
  the node.invoke method, although direct browser.request access requires 
  administrator scope. In Gateway deployments that honor caller identity and 
  narrower operator scopes, a write-scoped caller with access to a connected 
  browser-capable node can inspect pages, navigate tabs, or interact with 
  browser-visible applications without the configured admin requirement; 
  practical impact depends on the browser profile and signed-in state. 
  Shared-secret token and password callers are considered fully trusted 
  operators under OpenClaw's security model and are not affected. The issue is 
  fixed in 2026.7.1.
