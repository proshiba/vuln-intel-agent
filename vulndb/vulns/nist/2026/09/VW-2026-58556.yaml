title: "In the Linux kernel, the following vulnerability has been resolved:\n\npidfd:
  hold exec_update_lock around namespace ioctl\n\nThe PIDFD_GET_*_NAMESPACE ioctls
  in pidfd_ioctl() perform a filesystem\ncredentials ptrace access check before handing
  out a namespace file\ndescriptor.  The accompanying comment states that the code
  \"mirrors nsfs\nbehavior\", but, unlike the corresponding procfs paths, it does
  so without\nholding the target task's exec_update_lock.\n\nproc_ns_get_link() and
  proc_ns_readlink() both take exec_update_lock for\nreading around the ptrace check
  and the namespace lookup, so that the\ncredentials used for the access decision
  match those of the task when its\nnamespace is read.  Without it, a caller can pass
  the check against the\ntarget's old credentials and then read the namespace after
  the target has\nexecve()'d a setuid binary and committed new credentials -- accessing\n\
