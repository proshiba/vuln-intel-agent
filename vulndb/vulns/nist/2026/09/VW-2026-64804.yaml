title: "Improper Authentication vulnerability in Apache Tomcat. When Jakarta Authentication
  was configured with SimpleAuthConfigProvider as the default provider and multiple
  web application used that provider, the realm for the first web application to authenticate
  a request would be used for all web applications.\n\n\n\nThis issue affects Apache
  Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M4
  through 9.0.121.\n\n\n\nThe following versions were EOL at the time the CVE was
  created but are \nknown to be affected: from 8.5.0 through 8.5.100. Other unsupported
  versions may also be affected.\n\n\n\n\nUsers are recommended to upgrade to version
  11.0.26, 10.1.60, 9.0.122, which fixes the issue."
