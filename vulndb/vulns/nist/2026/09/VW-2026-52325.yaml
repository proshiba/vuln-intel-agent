title: A vulnerability was identified in Doccano Open Source Annotation Tools 
  for Machine Learning Practitioners and Auto Labeling Pipeline Module to 
  Annotate a Document Automatically up to 1.8.5. Affected by this issue is the 
  function ExampleDetail of the file /v1/projects/1/examples/ of the component 
  Project Example Detail Endpoint. Such manipulation leads to improper access 
  controls. The attack may be launched remotely. The exploit is publicly 
  available and might be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
