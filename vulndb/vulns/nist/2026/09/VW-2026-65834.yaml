title: A flaw was found in the Fine-Grained Admin Permissions (FGAP v2) feature 
  of Keycloak, an identity and access management solution. The issue occurs when
  the system checks if a delegated administrator has permission to assign a 
  specific role to a user. Because the check does not look inside composite 
  roles to see what other permissions they contain, an administrator with 
  limited rights can assign a role that secretly includes full administrative 
  control. This allows the attacker to gain complete management access over the 
  entire realm.
