title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Require exactly one Stream ID for a vSID\n\ntegra241_vintf_init_vsid() maps a guest
  vSID to a single physical Stream ID\ntaken from master->streams[0], and only warns
  when the device does not have\nexactly one stream. A device with several streams
  gets only its first one\nmapped, so a guest vSID invalidation cannot reach the others'
  ATC and IOTLB\nentries; a device with none makes master->streams a ZERO_SIZE_PTR,
  read out\nof bounds.\n\nReject the mapping with -EOPNOTSUPP if master->num_streams
  is not one."
