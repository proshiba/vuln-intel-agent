title: "Description\n\nNimbus accepted the `uploadedJarLocation` argument of `submitTopology`
  / `submitTopologyWithOpts` as a\nserver-side path and opened it directly, without
  checking that it referred to a file the caller had\nactually uploaded. The intended
  flow is that a client first calls `beginFileUpload`, which returns a path\ninside
  the Nimbus inbox, and uploads the jar in chunks to that location; nothing bound
  submission to that\nflow, and the `uploaders` map populated by `beginFileUpload`
  was never consulted at submit time.\n\nAn authenticated user with topology submission
  rights could therefore submit any path readable by the\nNimbus daemon user as their
  topology jar. Nimbus copied the file into the topology's jar blob, and the\nblob
  ACL grants the submitting subject read access, so the contents could then be retrieved
  with the\nordinary blob download RPCs. Candidate targets include the Nimbus Kerberos
  keytab, Thrift and UI TLS\nprivate keys, and `storm.yaml` with the ZooKeeper authentication
  pa"
