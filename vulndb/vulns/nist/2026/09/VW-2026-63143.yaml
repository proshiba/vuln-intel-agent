title: ArcadeDB before 26.9.1 fails to enforce security-group types ACL entries 
  for TimeSeries types because the ACL resolver builds permissions from bucket 
  IDs, but TimeSeries types do not own normal record buckets. An authenticated 
  low-privilege user can read or insert TimeSeries samples despite explicit deny
  rules by exploiting the missing type-name-based access check that causes 
  permission lookups to fail open.
