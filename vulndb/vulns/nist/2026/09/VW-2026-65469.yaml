title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: mvm: validate TX_CMD response layout\n\nTX_CMD parsing uses frame_count
  to walk status entries and then\nread the trailing SCD SSN. Make the minimum-length
  check follow\nthat exact runtime layout calculation before parsing the payload.\n\
  \nFor new TX API, reject TX_CMD responses with frame_count != 1 and\nwarn/return
  in the aggregation handler to document that aggregated\naccounting is expected via
  BA notifications."
