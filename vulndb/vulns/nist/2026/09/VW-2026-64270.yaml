title: A vulnerability has been found in JosephChuks 
  php-file-manager-with-code-editor up to 3.0. Impacted is the function 
  file_put_contents of the file codeEditor.php of the component Save Handler. 
  The manipulation of the argument filename/content leads to unrestricted 
  upload. The attack is possible to be carried out remotely. The exploit has 
  been disclosed to the public and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
