title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix UAF in ODP init error-handling path\n\nrxe_odp_mr_init_user() stores &umem_odp->umem
  in mr->umem before\ncalling rxe_odp_init_pages(). If rxe_odp_init_pages() fails,\n\
  rxe_odp_mr_init_user() releases umem_odp and returns an error.\n\nrxe_reg_user_mr()
  then unwinds the error through rxe_cleanup(),\nrxe_mr_cleanup(), ib_umem_release(mr->umem).
  There is an\nIS_ERR_OR_NULL(umem) check at the start of ib_umem_release().\nBut
  since mr->umem is NOT reset to NULL in the error handling\npath of rxe_odp_mr_init_user(),
  the check passes and it reads\nalready-freed fields like umem->is_dmabuf, causing
  UAF.\n\nFix the UAF by clearing mr->umem after releasing the failed\nODP umem so
  the MR cleanup path does not release it again."
