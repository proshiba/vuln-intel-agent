title: "In the Linux kernel, the following vulnerability has been resolved:\n\namt:
  Don't support cross-netns setup.\n\nWhen a lower device is unregistered, amt_device_event()
  tries\nto unregister its upper AMT device, but it has two problems.\n\n  1. amt_lookup_upper_dev()
  looks up an upper device in the\n      lower device's netns only\n\n  2. amt_device_event()
  unregisters a single upper device only\n\nIf AMT device is created on a lower device
  in another netns,\nremoving the lower device triggers the splat below and gets\n\
  stuck until all upper devices are removed. [0]\n\nThe cross-netns setup seems unintentional
  considering 1. and\nthe following points:\n\n  * amt_link_setup() sets dev->netns_immutable
  to true\n  * skb_scrub_packet() is not called in the fast path\n  * iproute2 binary
  fails to find cross-netns lower device via\n    link-netns:\n      # ip -n ns1 link
  add amt0 link-netns ns2 type amt dev veth1\n      Cannot find device \"veth1\"\n\
  \nInstead of supporting it properly and preparing for per-netns\nnetdev u"
