title: Dub contains an open redirect vulnerability in the redir_url query 
  parameter that is accepted on every short link without validation or domain 
  allowlist enforcement. Attackers can append the redir_url parameter to any 
  short link to redirect visitors to arbitrary external URLs through the trusted
  Dub domain, bypassing destination blacklists and potentially enabling phishing
  attacks with link cloaking enabled.
