title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  qcom: qmp-usb-legacy: Fix possible NULL-deref on early runtime suspend\n\nThere
  is a small window where the runtime suspend callback may run\nafter pm_runtime_enable()
  and before pm_runtime_forbid(). In this\ncase, a crash occurs because runtime suspend/resume
  dereferences\nqmp->phy pointer, which is not yet initialized:\n        `if (!qmp->phy->init_count)
  {`\n\nThis can also happen if user re-enables runtime-pm via the sysfs\nattribute
  before qmp phy is initialized.\n\nSimilarly to other qcom phy drivers, introduce
  a qmp->phy_initialized\nvariable that can be used to avoid relying on the possibly
  uninitialized\nphy pointer."
