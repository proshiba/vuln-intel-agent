title: A weakness has been identified in Cesanta Mongoose up to 7.21. Affected 
  by this vulnerability is the function fn of the file 
  tutorials/mqtt/mqtt-server/main.c of the component MQTT Broker. Executing a 
  manipulation can lead to stack-based buffer overflow. The attack can be 
  launched remotely. The exploit has been made available to the public and could
  be used for attacks. Upgrading to version 7.22 addresses this issue. This 
  patch is called a9df523f76f43a38bd53b4232b9cfd4c16869e71. Upgrading the 
  affected component is advised.
