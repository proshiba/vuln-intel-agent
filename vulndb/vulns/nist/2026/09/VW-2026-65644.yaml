title: A vulnerability was identified in volotat Anagnorisis up to 0.4.11. 
  Affected by this issue is the function html of the file PlaylistManager.js of 
  the component Media Filename Handler. Such manipulation of the argument 
  file_path leads to cross site scripting. The attack can be launched remotely. 
  The exploit is publicly available and might be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
