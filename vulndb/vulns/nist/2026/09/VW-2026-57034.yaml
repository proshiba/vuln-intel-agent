title: A flaw was found in the key provider component of the keycloak-services 
  library, which is the core engine for the Red Hat Build of Keycloak. The issue
  occurs because a previous fix for path probing was incomplete, allowing a 
  realm administrator to still submit arbitrary filesystem paths as keystore 
  parameters. This can be used to determine the existence and readability of 
  files on the server, potentially exposing sensitive system information.
