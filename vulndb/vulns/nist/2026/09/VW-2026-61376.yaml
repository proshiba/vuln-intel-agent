title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  gadget: fix NULL pointer dereference in gadget_dev_ioctl()\n\ngadget_dev_ioctl()
  reads dev->gadget before acquiring dev->lock, but\ndev->state is checked after acquiring
  the lock. Therefore a concurrent\nbind can change the device state between these
  operations, which can\nleave ioctl with a stale NULL gadget pointer and causing
  a NULL pointer\ndereference at gadget->ops->ioctl.\n\nRead dev->gadget while holding
  dev->lock so that the gadget pointer\nand device state are sampled consistently."
