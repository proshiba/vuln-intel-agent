title: "In the Linux kernel, the following vulnerability has been resolved:\n\nubi:
  Fix rollback for explicit UBI device numbers\n\nubi_init_attach() rolls back module
  initialization failures by scanning\nubi_devices[0..i-1], where i is the mtd= parameter
  index. That assumes\nthe parameter index matches the UBI device number.\n\nThat
  assumption is not true when mtd= specifies an explicit ubi_num. A\nsuccessfully
  attached device can be stored at a higher ubi_devices[]\nslot, and a later failure
  can miss it during rollback.\n\nScan the full ubi_devices[] array and detach by
  the actual array index,\nmatching the way UBI devices are stored."
