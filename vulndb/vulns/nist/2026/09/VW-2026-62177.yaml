title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  release the internal TCP sock on IPPROTO_SMC socket creation failure\n\nIPPROTO_SMC
  sockets create an internal TCP sock (\"clcsock\") from the\nproto->init hook. When
  socket creation fails after proto->init has\nrun - e.g. a cgroup BPF program attached
  to BPF_CGROUP_INET_SOCK_CREATE\ndenies the socket - sk_common_release() only invokes
  sk_prot->destroy\nif it is set, but neither smc_inet_prot nor smc_inet6_prot defines
  it,\nand smc_destruct() returns early unless sk_state is SMC_CLOSED. As a\nresult,
  every failing socket(AF_INET, SOCK_STREAM, IPPROTO_SMC) call\nleaks one tcp_sock,
  so an unprivileged task able to attach a deny-all\nBPF_CGROUP_INET_SOCK_CREATE program
  to its own cgroup can grow kernel\nmemory unboundedly.\n\nAdd a .destroy hook to
  both protos that releases the clcsock via\nsmc_clcsock_release(). smc_sk_init()
  hashes the sock into the smc\nhashinfo before the clcsock is created, and smc_diag
  dumps walk that\nhash"
