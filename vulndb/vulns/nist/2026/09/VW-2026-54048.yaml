title: Blinko 1.8.7 contains an authorization bypass (IDOR) vulnerability in 
  multiple tRPC procedures (message.list, message.update, message.delete, 
  message.clearAfter in server/routerTrpc/message.ts and 
  conversation.clearMessages in server/routerTrpc/conversation.ts). Although 
  these procedures require authentication, they query the database by 
  caller-supplied conversation or message ID without verifying that the resource
  belongs to the requesting account. Any authenticated user can therefore read 
  another user's full AI chat history, modify individual message content, and 
  delete or wipe entire conversations by enumerating sequential integer IDs.
