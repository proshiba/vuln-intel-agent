title: A security issue in MongoDB Server's diagnostic reporting interface 
  allows an authenticated user with monitoring privileges to access 
  insufficiently protected credentials from concurrent administrative 
  operations. The same credentials are properly redacted in server log output, 
  but the diagnostic interface omits equivalent redaction. Successful 
  exploitation requires a valid authenticated session with monitoring-level 
  permissions and results in exposure of cleartext credentials that could enable
  impersonation of other users, including privileged accounts.
