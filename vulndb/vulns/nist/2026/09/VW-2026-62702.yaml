title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: r8a66597: avoid double free of ep0_req in probe error path\n\nIf usb_add_gadget_udc()
  fails, r8a66597_probe() jumps to err_add_udc\nand frees ep0_req, then falls through
  to clean_up2 where ep0_req is\nfreed again when it is non-NULL.\n\nRemove the redundant
  free from err_add_udc and keep the cleanup in\nclean_up2 so the request is released
  exactly once.\n\nIssue found using a prototype static analysis tool\nand confirmed
  by code review."
