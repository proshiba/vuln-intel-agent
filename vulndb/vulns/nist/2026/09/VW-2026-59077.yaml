title: "LangBot's plugin runtime (pip package langbot_plugin) through 0.4.17 starts
  a debug WebSocket server on 0.0.0.0:5401 (/plugin/ws) whose authentication is gated
  on plugin_debug_key, which defaults to an empty string and is never set by the upstream
  repository, Docker image, or docker-compose (which additionally publishes port 5401
  to the host); the key check is therefore skipped entirely. Any remote attacker able
  to reach the port can register an arbitrary \"debug plugin\" without credentials.
  Because events are broadcast to all initialized plugins without filtering, the attacker's
  plugin receives the full context of every IM message event (including private chats,
  message chains, and user/sender IDs in plaintext) and can inject forged replies,
  send messages as any configured bot, enumerate bot UUIDs, invoke configured LLM
  models, read knowledge-base contents, and register malicious tools that feed every
  user's LLM pipeline. Registering with \"prod_mode\": true causes later legitimate
