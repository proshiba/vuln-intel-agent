title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatchdog:
  msc313e: Fix NULL pointer dereference in PM callbacks\n\nmsc313e_wdt_probe() doesn't
  set the driver data for the platform device.\nAs a result, dev_get_drvdata() in
  msc313e_wdt_suspend() and\nmsc313e_wdt_resume() will return NULL, leading to a NULL
  pointer\ndereference afterward.\n\nSet the platform device driver data in msc313e_wdt_probe()."
