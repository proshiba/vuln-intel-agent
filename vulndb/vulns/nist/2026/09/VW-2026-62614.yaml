title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  bcm-vk: Use acquire/release for msgq_inited\n\nbcm_vk_sync_msgq() fills the message
  queue information and then sets\nmsgq_inited. Readers call bcm_vk_drv_access_ok()
  before accessing the\nmessage queues and their cached queue information.\n\natomic_set()/atomic_read()
  do not order those accesses. A reader can see\nmsgq_inited set while still seeing
  stale queue information. Use release\nwhen publishing the initialized queues and
  acquire when checking the gate.\n\nKeep the clear in bcm_vk_blk_drv_access() as
  atomic_set(). It closes the\ngate and does not publish queue state to readers."
