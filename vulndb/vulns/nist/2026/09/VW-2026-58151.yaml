title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  renesas: Check that the transfer is valid before accessing it\n\nThe Renesas I3C
  driver uses an asynchronous model to transfer data. It\nprepares a struct renesas_i3c_xfer,
  enqueues it, and waits for completion.\nThe interrupt handler dequeues the transfer,
  updates/uses it, and signals\nthe waiting thread.\n\nIf the completion times out,
  the waiting thread dequeues the transfer and\nfree it. If an interrupt fires after
  that, the handler may access freed\nmemory, leading to crashes.\n\nCheck that the
  transfer is still valid before accessing it in the\ninterrupt handler. With it clear
  any status flags and disable all\nthe interrupts to avoid triggering the same interrupts
  again."
