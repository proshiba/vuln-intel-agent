title: snappy-java through 1.1.10.8 contains an out-of-bounds write 
  vulnerability in Snappy.uncompress(ByteBuffer, ByteBuffer) because destination
  buffer capacity is never validated against decompressed size. Attackers can 
  supply valid compressed data that decompresses larger than the destination 
  buffer, causing writes past buffer boundaries and JVM termination.
