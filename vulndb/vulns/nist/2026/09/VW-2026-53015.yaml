title: Cypht before 2.12.2 contains a PHP object injection vulnerability that 
  allows authenticated attackers to execute arbitrary operating system commands 
  by supplying a crafted PHP object graph in the back_query GET parameter of the
  logout handler. Attackers can pass a base64-encoded serialized payload through
  this parameter, which is decoded and passed directly to unserialize() without 
  an allow-list, signature check, or type restriction, enabling gadget-chain 
  exploitation to achieve remote code execution as the web server process.
