title: "Improper Authentication vulnerability in team-alembic AshAuthentication allows
  an attacker to be signed in as another user by linking an OAuth2 identity to an
  account that is not theirs.\n\nAshAuthentication.Strategy.OAuth2.UserResolver.resolve/3
  matches an existing account using the register action's upsert_identity keys, then
  gates linking the incoming provider identity to it on email_trusted?/2, which reads
  only the provider's email_verified boolean and never compares the provider's email
  value with the matched account's email. That gate assumes the account was matched
  by its email field, so under any other upsert_identity it is vacuous and an attacker
  presenting their own verified email is attached to, and issued a session for, an
  account matched on some other attribute. The same unguarded gate applies in OAuth2.SignInPreparation
  on the registration_enabled? false path, where the account is matched by the sign-in
