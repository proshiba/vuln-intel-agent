title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btintel: validate version TLV value lengths\n\nbtintel_parse_version_tlv() verifies
  that a complete TLV is present in\nthe response, but it does not ensure that the
  value is long enough for\nthe specific TLV type. A short value can therefore cause
  an\nout-of-bounds read through get_unaligned_le16(), get_unaligned_le32(),\nor memcpy().\n\
  \nReject values shorter than the minimum required by each known TLV type.\nAlso
  reject responses that do not contain the Command Complete Status\nfield."
