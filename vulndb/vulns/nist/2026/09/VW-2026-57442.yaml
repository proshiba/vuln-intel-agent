title: The Advanced Contact form 7 DB plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 2.1.3. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with custom-level 
  access and above, to import forged CSV submission records into any Contact 
  Form 7 form managed by the plugin.
