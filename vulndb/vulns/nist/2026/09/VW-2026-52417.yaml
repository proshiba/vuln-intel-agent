title: "A path traversal vulnerability exists in Sage Employee Self Service’s custom
  logo functionality due to improper validation of file path parameters. By leveraging
  directory traversal sequences and their encoded variants, an attacker may bypass
  directory restrictions and access files outside the application's intended file
  system scope. Successful exploitation would require knowledge of valid file names
  and paths.\r\n\r\nDepending on the privileges of the affected component, exploitation
  could result in the disclosure of sensitive information, including configuration
  files, environment settings, application assets, and log data.\r\n\r\nThe vulnerability
  has been remediated through enhanced path validation and secure path resolution
  controls that prevent access to unauthorised locations."
