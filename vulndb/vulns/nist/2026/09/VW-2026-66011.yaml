title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/slab:
  take n->list_lock in __slab_try_return_freelist() to avoid race\n\nCommit ba7425312607
  (\"mm, slab: add an optimistic\n__slab_try_return_freelist()\") incorrectly assumed
  that nobody has freed\nan object to the slab as long as slab->freelist is NULL and
  cmpxchg\nsucceeds.\n\nHowever, as reported by Hyunwoo Kim [1], other CPUs might
  have freed\nan object to the slab, insert the slab to the partial list, then\nallocated
  an object from the slab, and be in the middle of removing\nthe slab from the list
  under n->list_lock.\n\nSince __refill_objects_node() puts the slab back on pc.slabs\n\
  outside n->list_lock, it might insert the slab into that list while\nthe slab is
  concurrently being removed from n->partial.\nThis led to a list corruption [1]:\n\
  \n  list_add corruption. next->prev should be prev\n  (ffff888100000248), but was
  dead000000000122.\n  (next=ffffea000416e410).\n  kernel BUG at lib/list_debug.c:29!\n\
  \  Oops: invalid opcode: 000"
