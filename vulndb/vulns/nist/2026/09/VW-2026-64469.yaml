title: pH7Software pH7Builder (pH7 Social Dating CMS) through 18.2.0 resolves 
  the client IP address in _protected/framework/Ip/Ip.class.php from the 
  HTTP_CLIENT_IP and HTTP_X_FORWARDED_FOR headers without verifying the request 
  comes from a trusted proxy. Because the admin login attempt counter and 
  lockout are keyed on this value, a remote unauthenticated attacker bypasses 
  IP-based throttling by sending a different X-Forwarded-For value per request
