title: IBM OPENBMC FW1120.00 through FW1120.01, FW1110.00 through FW1110.31, and
  FW1060.00 through FW1060.81 is affected by a vulnerability in the BMC firmware
  management interface. The host system can cause the BMC firmware management 
  service to crash or allow a limited amount of BMC internal memory to be read, 
  resulting in a confidentiality and availability impact to the managed system.
