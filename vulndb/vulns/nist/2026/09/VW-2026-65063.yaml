title: "A flaw was found in Ansible Automation Platform's automation-controller. The
  custom\nCredential Type environment-variable injector validates variable names against
  a\ndeny-list (an ANSIBLE_* prefix check plus a fixed ENV_BLOCKLIST) that omits\n\
  process-hijacking loader variables such as BASH_ENV, ENV, LD_PRELOAD, LD_LIBRARY_PATH,\n\
  PYTHONSTARTUP and GIT_SSH_COMMAND. Combined with the credential file injector, a\n\
  privileged user can write an attacker-controlled script into the execution environment\n\
  and point BASH_ENV at it, obtaining arbitrary code execution inside the\nexecution-environment
  container for any job that attaches a credential of that type."
