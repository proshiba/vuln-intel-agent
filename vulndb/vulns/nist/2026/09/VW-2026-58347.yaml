title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd:
  do overflow check for sb->bblog_shift in super_1_load()\n\nIn super_1_load(), sb->bblog_shift
  is an __u8 type value loaded from on-\ndisk superblock. It is used for badblocks
  API badblocks_set() by the\nfollowing sequence,\n\n 1930   rdev->badblocks.shift
  = sb->bblog_shift;\n 1931   for (i = 0 ; i < (sectors << (9-3)) ; i++, bbp++) {\n\
  \ 1932           u64 bb = le64_to_cpu(*bbp);\n 1933           int count = bb & (0x3ff);\n\
  \ 1934           u64 sector = bb >> 10;\n 1935           sector <<= sb->bblog_shift;\n\
  \ 1936           count <<= sb->bblog_shift;\n 1937           if (bb + 1 == 0)\n\
  \ 1938                   break;\n 1939           if (!badblocks_set(&rdev->badblocks,
  sector, count, 1))\n 1940                   return -EINVAL;\n 1941   }\n\nbb->bblog_shit
  is in range of 0-255, variable sector is 64bit width, for\nan invalid bb->bblog_shit,
  it is possible to make sector be overflowed\nby the following calculation,\n 1935\
  \           sector <<"
