  attackers with local access to execute arbitrary code by placing an arbitrary 
  file in the 'C:\Users<user>\AppData\Local\Temp' directory, which could lead to
  arbitrary code execution and persistence. This vulnerability is only 
  replicable in versions of Windows 11 and does not affect earlier versions.
