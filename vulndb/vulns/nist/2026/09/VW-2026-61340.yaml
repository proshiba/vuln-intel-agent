title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/intel:
  Fix kernel address leakages in LBR stack\n\nBefore Arch LBR gained CPL filtering
  support, a user-only branch stack\ncould still contain kernel addresses. As a result,
  kernel branch records\nmay be exposed to user space even when PERF_SAMPLE_BRANCH_USER
  is\nrequested.\n\nFor example, on Intel Tiger Lake, the following command can still
  report\nSYSRET/ERET entries with kernel-space from addresses:\n\n$ ./perf record
  -e cycles:p -o - --branch-filter any,save_type,u -- \\\n \t./perf bench syscall
  basic --loop 1000 | \\\n\t./perf script -i - --fields brstack|tr ' ' '\\n'| \\\n\
  \tgrep -E '0x[89a-f][0-9a-f]{15}'\n\n    Total time: 0.000 [sec]\n\n      0.219000
  usecs/op\n     4,566,210 ops/sec\n[ perf record: Woken up 1 times to write data
  ]\n[ perf record: Captured and wrote 0.551 MB - ]\n0xffffffff93c001c8/0x7f12a2b1d647/P/-/-/16959/SYSRET/-\n\
  0xffffffff93c001c8/0x7f12a2b1d5c2/P/-/-/17535/SYSRET/-\n0xffffffff93c01928/0x7f12a2861000/P/-/-/6"
