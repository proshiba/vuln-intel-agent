title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: avoid leaking refcount in cifs_queue_oplock_break()\n\ncifs_queue_oplock_break()
  unconditionally takes a reference on the\ntarget file before queueing cifs_oplock_break().
  Only that work item\ndecreases the reference counter again.\n\nIf another oplock
  break arrives while that work is still queued,\nqueue_work() will return false and
  not queue this second work item. As a\nresult, we will never reach the point to
  drop the file reference again\nand are leaking this reference. This can be triggered
  when interacting\nwith a slow-responding server.\n\nAs a result, later unmount operations
  for this file system will fail with\n\n  BUG: Dentry ... still in use (1) [unmount
  of cifs cifs]\n  VFS: Busy inodes after unmount of cifs (cifs)\n  kernel BUG at
  fs/super.c:777!\n\nFix this by only incrementing the reference count if the work
  has been\nqueued successfully. Taking it after queue_work() is safe because all\n\
  three callers hold tco"
