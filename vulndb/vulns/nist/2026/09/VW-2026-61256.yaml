title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cec: core: Fix kmemleak due to missed rc_free_device() call\n\nThe commit dccc0c3ddf8f
  (\"media: rc: fix race between unregister and\nurb/irq callbacks\") removed the
  implicit call to rc_free_device() from\nrc_unregister_device(). However, the commit
  missed to remove the NULL\nassignment of adap->rc that is now causing rc_free_device()
  to never be\ncalled on an allocated rc device.\n\nkmemleak reports following after
  e.g. dw-hdmi unbind:\n\nunreferenced object 0xffff00010ac10000 (size 4096):\n  comm
  \"kworker/u16:1\", pid 39, jiffies 4294897739\n  hex dump (first 32 bytes):\n  \
  \  20 23 4b 0a 01 00 ff ff 08 00 c1 0a 01 00 ff ff   #K.............\n    08 00
  c1 0a 01 00 ff ff 00 00 00 00 00 00 00 00  ................\n  backtrace (crc e11baccc):\n\
  \    kmemleak_alloc+0x38/0x44\n    __kmalloc_cache_noprof+0x4a8/0x5e0\n    rc_allocate_device+0x48/0x2a0\n\
  \    cec_allocate_adapter+0x3ac/0x800\n    dw_hdmi_cec_probe+0x264/0x634\n    platform_probe"
