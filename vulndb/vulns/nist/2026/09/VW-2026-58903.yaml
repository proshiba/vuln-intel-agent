title: A vulnerability was identified in GPAC up to f1219cde. Affected is the 
  function gf_sm_dump_command_list of the file scene_manager/scene_dump.c of the
  component MP4Box. The manipulation leads to reachable assertion. The attack 
  must be carried out locally. The exploit is publicly available and might be 
  used. Upgrading to version abi-16.23 is able to address this issue. The 
  identifier of the patch is afca1f1181668d85941d51ed1adf647807d5d975. Upgrading
  the affected component is advised.
