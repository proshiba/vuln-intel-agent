title: NetBSD contains a use-after-free and double-free vulnerability in 
  msg_recv_copyin() within the COMPAT_NETBSD32 compatibility layer due to a 
  missing return statement before the cleanup label on the success path. Any 
  local user able to execute a 32-bit binary on a 64-bit NetBSD system can 
  trigger a kernel panic or memory corruption by calling recvmsg() with 
  msg_iovlen between 9 and IOV_MAX, causing the kernel to access a freed iovec 
  buffer and subsequently free the same allocation a second time.
