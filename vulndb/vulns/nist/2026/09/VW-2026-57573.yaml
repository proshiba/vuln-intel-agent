title: ICEcoder versions through 8.1 contain a path traversal vulnerability in 
  the file-control endpoint due to a logic error in the document-root 
  confinement check. The File::check() validation function compares realpath() 
  to boolean true, which never succeeds, allowing authenticated attackers to 
  submit traversal sequences or absolute paths in the file parameter to read, 
  write, or delete files outside the configured document root.
