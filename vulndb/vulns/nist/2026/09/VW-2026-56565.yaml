title: The Okta Hyperdrive Agent writes the decoded SAML bearer assertion to a 
  local application log file at the default log level on every successful MFA 
  completion. This insertion of sensitive information into the log file makes a 
  live authentication credential readable by any local user with access to the 
  log file.
