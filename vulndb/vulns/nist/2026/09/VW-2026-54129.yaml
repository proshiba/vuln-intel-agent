title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: zero the sockaddr before returning it in getname\n\niso_sock_getname() fills
  a struct sockaddr_iso in place and returns its\nsize without clearing it first,
  so bytes it does not write are copied to\nuser space from the kernel stack. The
  getsockname(2) and getpeername(2)\npaths both run through do_getsockname(), which
  hands getname() an\nuninitialized sockaddr_storage on the stack and copies back
  up to the\nnumber of bytes getname() returns, so the driver has to initialize every\n\
  byte it accounts for.\n\nTwo ranges are left uninitialized:\n\n  - struct sockaddr_iso
  is 10 bytes but only 9 are written (family,\n    iso_bdaddr, iso_bdaddr_type), leaking
  the trailing pad byte on every\n    call.\n\n  - for a broadcast peer (BIS_LINK
  or PA_LINK) the returned length grows\n    by sizeof(struct sockaddr_iso_bc), but
