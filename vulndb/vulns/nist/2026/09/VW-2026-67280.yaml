title: A vulnerability has been found in deepseek-ai deepseek-harness up to 
  0.1.7-rc.2. Affected is an unknown function of the file 
  packages/sandbox/sandbox-local/src/profiles.ts of the component Landlock 
  Backend. Such manipulation leads to improper isolation or 
  compartmentalization. The attack must be carried out locally. The exploit has 
  been disclosed to the public and may be used. It is advisable to implement a 
  patch to correct this issue. The vendor was contacted early about this 
  disclosure but did not respond in any way.
