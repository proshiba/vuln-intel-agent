title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  convert nfsd_net boolean flags to unsigned long flags word\n\nnfsd_net contains
  several boolean fields that are accessed from\nconcurrent contexts without serialization.\
  \  In particular,\nnfsd4_end_grace() guards its drain path with a plain bool:\n\n\
  \    if (nn->grace_ended)\n            return;\n    nn->grace_ended = true;\n\n\
  The read and the write are independent, and nothing in struct\nnfsd_net serializes
  them.  At least two contexts can reach this\ncode with no lock held:\n\n    laundromat
  path\n      laundry_wq kworker\n        nfs4_laundromat()\n          nfsd4_end_grace()\n\
  \n    RECLAIM_COMPLETE path\n      nfsd compound kthread\n        nfsd4_reclaim_complete()\n\
  \          inc_reclaim_complete()\n            nfsd4_end_grace()\n\nBoth callers
  can observe grace_ended == false on different CPUs,\nboth store true, and both proceed
  into nfsd4_record_grace_done(),\nwhich invokes the active client_tracking_ops->grace_done
  callback.\nFor trac"
