title: "Affected versions of MISP do not consistently enforce the acting user's authorization
  when instantiating event templates.\n\n\nFor templates using distribution = 4, the
  template can specify a sharing_group_id. The instantiation path passed that value
  into event creation without verifying that the user instantiating the template was
  actually permitted to use the selected sharing group. The commit notes that Event::_add()
  only performed its own sharing-group authorization in another code path, leaving
  template instantiation able to write the identifier directly.\n\n\nThe same instantiation
  path also attached template-specified tags without checking the user's normal tagging
  permissions. In addition, it hardcoded local => 0, meaning tags marked local_only
  could be attached globally and consequently propagate through synchronization or
  export, contrary to their intended restriction.\n\n\nThe fix adds explicit SharingGroup::canUse()
  authorization for the acting user, applies the same tag-modificatio"
