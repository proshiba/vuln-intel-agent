title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  restore rq_status_counter to even on all nfsd_dispatch() exit paths\n\nnfsd_dispatch()
  sets rq_status_counter to an odd value once a request has\nbeen decoded, and back
  to an even value once it has been fully processed,\nforming a seq-lock like protocol
  with the lockless reader in\nnfsd_nl_rpc_status_get_dumpit().\n\nOnly the fully
  successful path restored the counter to even. The cache-hit\n(RC_REPLY), drop (RC_DROPIT
  / RQ_DROPME) and encode-error paths all return\nafter the odd-valued store without
  ever bringing the counter back to even.\nOnce one of those paths is taken, rq_status_counter
  is left odd: the next\nrequest's decode ORs in 1 (still odd) and only a subsequent
  successful\nencode restores even. While stuck odd, the dumpit reader treats the
  rqstp\nfields as stable and its retry check compares against the same unchanging\n\
  odd value, so it never detects concurrent mutation. This exposes actively\nmutating
