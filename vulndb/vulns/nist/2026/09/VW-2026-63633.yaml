title: An unauthenticated Remote Code Execution vulnerability was found in the 
  survey passthrough routing and Data Import processing logic, in which a 
  malicious user could potentially exploit it by manipulating HTTP requests to 
  access an unintended controller route from a public survey context and by 
  supplying a crafted file-path/stream parameter during import handling. If 
  successfully exploited, this could allow the attacker to remotely execute 
  arbitrary code on the REDCap server. The attacker does not have to be 
  authenticated in order to exploit this, but exploitation requires knowledge of
  a valid public survey hash. This vulnerability exists in REDCap 13.3.0 and 
  higher.
