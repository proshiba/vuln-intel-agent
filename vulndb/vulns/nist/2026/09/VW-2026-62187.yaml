title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  fq_codel: clamp default quantum and mtu\n\nfq_codel_init() sets q->quantum = psched_mtu(qdisc_dev(sch))
  without\nclamping. A device with a huge MTU (e.g. dummy with max_mtu == 0\naccepting
  MTU 2147483634) makes psched_mtu() return 0x80000000, which\noverflows the signed
  flow->deficit to INT_MIN in fq_codel_dequeue(),\ncausing an infinite loop and soft
  lockup. Emulate fq_codel_change()\nand constrain to [256, FQ_CODEL_QUANTUM_MAX].\n\
  \nThe same unclamped psched_mtu() is assigned to q->cparams.mtu a bit\nbelow, and
  fq_codel_change() never updates it. codel_should_drop()\ntests \"*backlog <= params->mtu\"\
  ; with mtu == 0x80000000 (~2 GiB) and\nthe default 32 MiB memory_limit, the test
  is always true, so CoDel is\nsilently and completely disabled (no drops, no ECN).
  Declare a single\nclamped mtu and assign both q->quantum and q->cparams.mtu from
  it,\nwhich also removes the double psched_mtu() call.\n\nConditions to recreate
  the bug"
