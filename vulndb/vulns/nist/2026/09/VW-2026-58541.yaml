title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/tdx:
  Fix off-by-one in port I/O handling\n\nhandle_in() and handle_out() in arch/x86/coco/tdx/tdx.c
  use:\n\n    u64 mask = GENMASK(BITS_PER_BYTE * size, 0);\n\nGENMASK(h, l) includes
  bit h. For size=1 (INB), this produces\nGENMASK(8, 0) = 0x1FF (9 bits) instead of
  GENMASK(7, 0) = 0xFF (8\nbits). The mask is one bit too wide for all I/O sizes.\n\
  \nFix the mask calculation."
