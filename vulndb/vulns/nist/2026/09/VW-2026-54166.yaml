title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  llcp: reject PDUs shorter than the LLCP header\n\nEvery LLCP PDU begins with a two-byte
  header (DSAP/SSAP + PTYPE), but the\nreceive path never checked that a frame is
  at least LLCP_HEADER_SIZE bytes\nbefore parsing it.\n\nnfc_llcp_rx_skb() reads the
  header via nfc_llcp_ptype()/nfc_llcp_dsap()/\nnfc_llcp_ssap(), which dereference
  pdu->data[0] and pdu->data[1], and a\nCONNECT or CC PDU then computes\n\n\ttlv_array_len
  = skb->len - LLCP_HEADER_SIZE;\n\nas a size_t and hands it to the TLV walk. When
  the frame is shorter than\nthe header the subtraction wraps to a huge value and
  the walk runs far\npast the buffer, an out-of-bounds read.\n\nA nearby NFC device
  can reach this without authentication; LLCP link\nactivation happens automatically
  after NFC-DEP.\n\nGuard the common receive choke point __nfc_llcp_recv(), shared
  by both the\ntarget (nfc_llcp_data_received()) and initiator (nfc_llcp_recv()) paths,
  so\na short skb is dropped before "
