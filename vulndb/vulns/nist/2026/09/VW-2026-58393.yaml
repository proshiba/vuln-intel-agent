title: "In the Linux kernel, the following vulnerability has been resolved:\n\nentry:
  Fix seccomp bypass after ptrace with TSYNC\n\nSashiko review pointed out the following
  issue.\n\nIf a thread is stopped in syscall_trace_enter() for ptrace, another\n\
  thread can install a seccomp filter with SECCOMP_FILTER_FLAG_TSYNC\n(e.g., via seccomp_attach_filter()).
  This will successfully set\nSYSCALL_WORK_SECCOMP on the stopped thread, but syscall_trace_enter()\n\
  evaluates a cached 'work' variable sampled on entry. Consequently,\nthe subsequent
  check for SYSCALL_WORK_SECCOMP misses the newly\nassigned flag, and the filter is
  silently bypassed.\n\nThis race condition could allow an unprivileged process to
  execute\na prohibited system call (e.g., execve) that the newly installed filter\n\
  was intended to block, especially since the tracer might have modified\nthe system
  call number during the ptrace stop.\n\nFix this by re-reading the syscall_work flags
  after ptrace handling,\nso that any new SYSCALL_WORK_SECCOMP flag set by ano"
