title: "In MISP, the Overmind event view enriches an event with its most recent attached
  report for preview purposes. The enrichment logic fetched the report using only
  the event ID as the lookup condition, without applying the report's own distribution/ACL
  constraints. Because MISP reports carry an independent distribution setting that
  can be more restrictive than the parent event's distribution, an authenticated user
  who had read access to the event could retrieve and view a report whose distribution
  explicitly excluded that user. Additionally, the query did not filter out soft-deleted
  reports, allowing retrieval of reports that had been administratively removed.\n\
  \nThe result is an unauthorized disclosure of threat-intelligence report content
  to users who should not have access under the report's own access-control policy.\n\
  \nThe vulnerability requires an authenticated MISP user with at least read access
  to the affected event."
