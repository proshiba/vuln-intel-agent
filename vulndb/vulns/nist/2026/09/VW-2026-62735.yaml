title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Copy per-CPU map value padding in copy_map_value_long()\n\nIn kernel, per-CPU map
  elements are stored with\nround_up(map->value_size, 8) bytes. On UAPI lookup paths,
  it copies the\nrounded size for each CPU into a temporary buffer.\n\nHowever, copy_map_value_long()
  passes 'map->value_size' to\nbpf_obj_memcpy(). When the map has special fields,
  bpf_obj_memcpy() copies\naround those fields with memcpy(), and does not copy the
  tail padding\nbetween 'map->value_size' and round_up(map->value_size, 8).\n\nThe
  temporary UAPI lookup buffers are allocated without __GFP_ZERO. As a\nresult, when
  the per-CPU map's value size is not equal to\nround_up(map->value_size, 8), UAPI
  LOOKUP_ELEM and its variants can return\nstale heap contents from that padding to
  user space. The same issue\napplies to bpf_iter for per-CPU maps.\n\nPass round_up(map->value_size,
  8) to bpf_obj_memcpy() from\ncopy_map_value_long(), so per-CPU maps both with and
  without"
