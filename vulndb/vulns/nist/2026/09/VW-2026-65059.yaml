title: Klever-Go is the Go implementation of the Klever blockchain protocol. 
  Prior to 1.7.20, core/kapp/validators/validators.go Register and the runtime 
  validator update path accept a submitted BLSPublicKey without curve, 
  prime-order subgroup, or nonzero validation. When a validator with a malformed
  key becomes eligible and is selected into a consensus group, MultiSigner.Reset
  and the corresponding signature verification creation path cannot deserialize 
  the group key and cancel the slot. This causes repeated missed rounds and 
  throughput degradation, and a network whose consensus group equals the 
  eligible validator set can halt completely. Genesis validation is not affected
  because that path already performs CheckPublicKeyValid. This issue is fixed in
  version 1.7.20.
