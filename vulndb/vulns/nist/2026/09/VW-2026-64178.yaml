title: "Net::IDN::Punycode::PP versions before 2.590 for Perl decode a truncated label
  to a name containing a character it never encoded in decode_punycode.\n\nThe pure-Perl
  decoder reads one digit at a time with four-argument substr and tests the result
  with defined to detect the end of the input. substr on an exhausted string returns
  the empty string rather than undef, so decoding continues past the end. The empty
  string converts to a digit value below the range, reducing the accumulator, and
  the decoder derives one extra code point and its position from it. The result is
  deterministic. The XS backend rejects the same label.\n\nNet::IDN::Punycode uses
  this backend wherever the XS does not build.\n\nThe two backends disagree about
  what such a label means, so a sender can pick a label that one installation resolves
  to a name and another rejects."
