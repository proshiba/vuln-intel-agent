title: ip-address is a library for parsing and manipulating IPv4 and IPv6 
  addresses in JavaScript. Prior to 10.7.1, the Address6 constructor, 
  Address6.isValid, and parse code in src/ipv6.ts accept unbounded strings and 
  expand invalid characters through RE_BAD_CHARACTERS into large diagnostics. 
  Material impact occurs only when an application accepts a very large 
  attacker-controlled field and passes it to Address6 parsing without an earlier
  length bound. Common URL and header limits, and common body-parser defaults, 
  generally constrain the effect; common defaults typically exclude 32 MiB 
  fields. Megabyte-scale fields can cause a synchronous stall and high transient
  memory use, approximately 16 MiB can trigger an invalid string length 
  exception, and process termination occurs at approximately 32 MiB. The 
  affected entry points include Address6.isValid and construction paths that 
  reach parse. This issue is fixed in version 10.7.1.
