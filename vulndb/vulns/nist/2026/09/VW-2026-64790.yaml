title: Reflected Cross-Site Scripting (XSS) in Microweber. The vulnerability 
  lies in the ‘group’ parameter of the ‘/admin/settings’ endpoint in the 
  administration panel. A successful exploit allows an attacker to trick an 
  authenticated user into executing malicious JavaScript code in their browser. 
  This enables the attacker to perform actions without the victim’s consent, 
  steal confidential information or hijack the user’s session.
