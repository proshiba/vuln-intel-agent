title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  copy request headers via a stack buffer for io-uring\n\nThe fuse-io-uring transport
  copies req->in.h out to the ring in\nfuse_uring_copy_to_ring() and req->out.h back
  in fuse_uring_commit().\nBoth headers live inside the fuse_request slab object,
  whose cache\n(fuse_req_cachep) is created without a usercopy whitelist, so copying\n\
  them directly to/from userspace trips CONFIG_HARDENED_USERCOPY and\npanics:\n\n\
  \  usercopy: Kernel memory exposure attempt detected from SLUB object\n  'fuse_request'
  (offset 56, size 40)!\n  kernel BUG at mm/usercopy.c:102!\n  Oops: invalid opcode:
  0000 [#1] SMP KASAN NOPTI\n  RIP: 0010:usercopy_abort (mm/usercopy.c:90)\n  Call
  Trace:\n   __check_heap_object (mm/slub.c:8268)\n   __check_object_size (mm/usercopy.c:197
  mm/usercopy.c:258 mm/usercopy.c:223)\n   copy_header_to_ring (fs/fuse/dev_uring.c:618)\n\
  \   fuse_uring_prepare_send (fs/fuse/dev_uring.c:776 fs/fuse/dev_uring.c:785)\n\
  \   fuse_uring_send_in_task"
