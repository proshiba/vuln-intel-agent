title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  preserve LZMA decoders on resize failure\n\nThe pool-resize path frees each stream's
  old decoder before allocating\nits replacement. If an allocation fails after some
  streams have already\nbeen replaced, the failed stream is put back on the list with
  state ==\nNULL. z_erofs_lzma_max_dictsize is still advanced as if the whole\npool
  had been resized.\n\nAn existing LZMA mount can select the broken stream and pass\n\
  NULL to xz_dec_microlzma_reset(). A retry at the same size also\nskip another resize
  attempt. Since the global maximum was advanced,\nthus, the invalid state is left
  unrepaired.\n\nAllocate each replacement before freeing the old decoder, temporarily\n\
  retaining one old decoder during allocation. Stop at the first failure\nand advance
  z_erofs_lzma_max_dictsize only after all streams satisfy\nthe request.\n\nRecord
  each stream's dictionary capacity so retries can skip streams\nalready enlarged
  before a partial failure."
