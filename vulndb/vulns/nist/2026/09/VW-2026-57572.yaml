title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Starting in version 8.0.0 and 
  prior to version 8.0.5, when Lua rule execution is enabled, the Lua sandbox 
  memory limit was not consistently enforced for new allocations. Certain Lua 
  allocation patterns could exceed `security.lua.max-bytes` without triggering 
  the intended memory limit, making the configured sandbox limit unreliable. 
  This requires Lua rules to be enabled and an affected Lua script/rule to be 
  loaded. Version 8.0.5 contains a fix. As a workaround, disable 
  `security.lua.allow-rules` unless Lua rules are required.
