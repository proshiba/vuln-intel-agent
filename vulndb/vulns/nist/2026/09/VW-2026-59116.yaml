title: "Description\n\nWhen ZooKeeper authentication is configured, Storm deliberately
  retains\n`storm.zookeeper.topology.auth.payload` in the topology configuration,
  because workers need it. Nimbus then\nserved that configuration verbatim to any
  caller holding read-only topology permissions, so a user whose\nonly grant was the
  ability to view a topology received its ZooKeeper credential.\n\nThat credential
  is not read-only. The cluster state implementation uses write-capable ACLs for worker\n\
  heartbeats, backpressure and error state, so a recipient can forge or remove that
  state for the topology\nconcerned. It is not a write credential on assignments.\n\
  \nThe same advisory covers the submission client, which logged the generated payload
  at INFO on every\nsubmission that generated one, and the SASL handlers, which logged
  it at DEBUG. The credential therefore\nalso reached any log aggregation or support
  bundle collected from the cluster.\n\nMitigation\n\nUpgrade to 3.1.0, where the
