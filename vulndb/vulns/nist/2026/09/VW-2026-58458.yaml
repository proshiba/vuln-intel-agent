title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  move nfsd_debugfs_init() after nfsd4_init_slabs() in init_nfsd()\n\nnfsd_debugfs_init()
  runs before nfsd4_init_slabs() in init_nfsd().\nIf the slab allocation fails, the
  bare \"return retval\" bypasses\nnfsd_debugfs_exit(), leaving orphan debugfs files
  with stale fops\npointers into the freed module text.\n\nMove nfsd_debugfs_init()
  to after the slab init succeeds, so the\nearly return has no debugfs state to clean
  up.\n\nSince debugfs is now the more recently initialized of the two, also\nupdate
  the unwind paths to match reverse-initialization (LIFO) order:\nrun nfsd_debugfs_exit()
  before nfsd4_free_slabs() in both the\ninit_nfsd() error path and exit_nfsd(). The
  nfsd debugfs files only\nreference module-global state and have no dependency on
  the slab\ncaches, so that reordering is a cleanup with no functional change."
