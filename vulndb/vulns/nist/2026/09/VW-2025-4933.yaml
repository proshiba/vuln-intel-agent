title: Strimzi provides a way to run an Apache Kafka cluster on Kubernetes or 
  OpenShift in various deployment configurations. From 0.47.0 and prior to 
  0.49.1, in some situations, Strimzi creates an incorrect Kubernetes Role which
  grants the Apache Kafka Connect and Apache Kafka MirrorMaker 2 operands the 
  GET access to all Kubernetes Secrets that exist in the given Kubernetes 
  namespace. The issue is fixed in Strimzi 0.49.1.
