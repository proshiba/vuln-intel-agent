title: "A vulnerability was detected in Portábilis i-Educar up to 2.7.5. Affected
  is an unknown function of the file \\intranet\\agenda_imprimir.php of the component
  HTTP GET Request Handler. The manipulation of the argument cod_agenda with the input
  \");'> <script>alert(document.cookie)</script> results in cross site scripting.
  The attack can be launched remotely. The exploit is now public and may be used.
  Upgrading the affected component is recommended. The vendor explains: \"This endpoint
  and the associated functionality are no longer present in the current i-Educar codebase,
  as the affected area was removed from the product. As a result, the previously reported
  attack vector (...) is no longer applicable to versions in which this functionality
  has been removed.\""
