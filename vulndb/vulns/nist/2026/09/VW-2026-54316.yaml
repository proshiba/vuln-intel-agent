title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pci: Validate AIBV and AISB before pinning guest pages\n\nThe AIBV holds one
  bit per MSI-X vector for a given function. The size of\nthe bit vector is derived
  from the NOI and the AIBVO. If the size of the\nAIBV exceeds a single page boundary,
  then reject the request as we cannot\nsafely pin the guest AIBV.\n\nSimilarly reject
  the request if the AISB address is not 8-byte aligned as\nthe architecture requires
  doubleword alignment for the summary bit address.\nSince the AISBO can address up
  to 64 bits, the size of the AISB can only be\n8 bytes for the function. This also
  ensures the AISB doesn't exceed a\nsingle page boundary."
