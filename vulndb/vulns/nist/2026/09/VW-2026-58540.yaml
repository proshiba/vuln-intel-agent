title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/user_events:
  Clear copied tracing state before fork duplication\n\ndup_task_struct() copies user_event_mm
  from the parent into the child,\nwithout grabbing a reference to it. user_event_mm_dup()
  should\nreplace it, but it leaves that copied pointer unmodified if\nuser_event_mm_alloc()
  fails.\n\nWhen the child exits, user_event_mm_remove() decrements a reference\n\
  the child never owned, which ultimately frees user_event_mm, while\nthe parent still
  as a stale pointer to it. This creates a UAF, which\nKASAN reports as:\n\n    BUG:
  KASAN: slab-use-after-free in\n    current_user_event_mm+0x51/0x1d0 Write of size
  4 at addr\n    ffff888005010d30 by task init/44\n\n    Call Trace:\n     <TASK>\n\
  \     kasan_report+0xce/0x100\n     kasan_check_range+0x10f/0x1e0\n     current_user_event_mm+0x51/0x1d0\n\
  \     user_events_ioctl+0x82e/0x15c0\n     __x64_sys_ioctl+0x139/0x1c0\n     do_syscall_64+0xce/0x450\n\
  \     entry_SYSCALL_64_after_hwframe+0x77/0x7"
