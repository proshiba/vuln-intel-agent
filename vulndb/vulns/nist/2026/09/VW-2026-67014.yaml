title: "Parse Server is an open-source backend server. In versions >= 9.0.0 < 9.10.1-alpha.10
  and >= 8.0.2 < 8.6.91, the code-based authentication adapters (GitHub, Google Play
  Games, Instagram, LINE, LinkedIn, Microsoft, QQ, Spotify, WeChat, Weibo) verify
  the client's authorization code with the external provider on signup and on provider
  linking, but not when authentication data is supplied together with a username and
  password on the login endpoint. As a result, a low-privileged authenticated user
  can attach an arbitrary, unverified provider identity to their own account without
  the provider ever being contacted, spoofing an external identity toward application
  logic that trusts the linked provider ID. An attacker can also pre-hijack accounts:
  by claiming the provider ID of a victim who has not yet linked that provider, the
  victim's later legitimate sign-in with that provider resolves to the attacker's
