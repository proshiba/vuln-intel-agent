title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: vgic-its: Don't dereference a NULL collection on ITT save\n\nMAPC with V=0
  drops ite->collection but leaves the ITE on the device's\nITT list, and vgic_its_save_ite()
  dereferences it unconditionally. A\nguest that issues MAPD, MAPTI and then MAPC(V=0)
  therefore oopses the\nhost when the VMM issues KVM_DEV_ARM_ITS_SAVE_TABLES to migrate
  it.\nThat sequence is UNPREDICTABLE per the architecture, but KVM already\nhandles
  the resulting state in the translate, MOVI and DISCARD paths.\n\nSave a zeroed entry,
  which vgic_its_restore_ite() reads back as\ninvalid. Skipping the ITE instead would
  leave the ITT slot holding\nwhatever is in guest memory, and restore rejects an
  entry naming a\ncollection the restored collection table does not have."
