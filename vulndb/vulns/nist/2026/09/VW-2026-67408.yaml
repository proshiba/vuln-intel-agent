title: PyJWT is a Python implementation of JSON Web Token standards. From 
  2.0.0a1 until 2.15.0, PyJWT PyJWKClient.get_signing_key_from_jwt is affected 
  because payload parser catches ValueError but not RecursionError. This occurs 
  when an attacker-controlled recursively nested payload reaches json.loads. As 
  a result, documented PyJWT exception handling does not contain the failure. 
  Consequently, an unauthenticated request can raise an exception that may 
  produce an HTTP 500 response. The advisory-defined affected implementation 
  also includes jwt/api_jwt.py, verify_signature=False. This issue is fixed in 
  version 2.15.0.
