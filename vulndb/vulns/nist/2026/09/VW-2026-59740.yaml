title: "The WSO2 Integrator MI VS Code extension fails to properly sanitize or validate
  user-supplied input when processing Micro Integrator projects opened from untrusted
  sources. This allows a crafted project to inject and execute arbitrary operating
  system commands through the unit test execution flow.\n\nSuccessful exploitation
  of this vulnerability could lead to the execution of arbitrary OS commands on the
  system where the VS Code extension is running. The extent of the impact is dependent
  on the privileges of the user account under which VS Code is operating. Exploitation
  requires the user to grant workspace trust to the malicious project and subsequently
  trigger the unit test execution."
