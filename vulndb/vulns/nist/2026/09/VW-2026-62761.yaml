title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: Fix use-after-free of master->this\n\nsysfs attribute callbacks for the
  master controller device dereference\nmaster->this.  However, master->this is freed
  in\ni3c_master_detach_free_devs() before the master device itself is\nreleased.\n\
  \nAs a result, sysfs accesses can dereference a freed master->this\npointer, leading
  to a use-after-free.\n\nKeep master->this alive until i3c_masterdev_release(), which
  is called\nafter the master device and its sysfs state are being torn down. Do not\n\
  free master->this as part of the normal device detach path.\n\nOn the error path
  in i3c_master_set_info(), reset master->this and\nbus.cur_master to NULL before
  freeing the allocated device."
