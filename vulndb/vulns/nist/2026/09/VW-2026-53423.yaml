title: PREVAIL is a Polynomial-Runtime EBPF Verifier using an Abstract 
  Interpretation Layer. Prior to version 0.2.4, in the Prevail eBPF verifier, 
  EbpfTransformer::add() silently skips offset-variable updates when the 
  destination register carries a non-singleton typeset (two or more 
  simultaneously possible pointer types). Subsequent bounds checks use the stale
  offset and accept out-of-bounds memory accesses, so a crafted BPF program 
  passes verification even though it would corrupt memory at runtime. This issue
  has been patched in version 0.2.4.
