title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/rw:
  end write accounting from ->ki_complete\n\nCommit b000145e9907 moved both the fsnotify
  calls and the write\naccounting out of the kiocb completion handler and into the\n\
  io_req_rw_complete() task_work. However, only the fsnotify part actually\nneeded
  to move as it may sleep. Ending the write accounting is just a\npercpu_up_read()
  on the superblock writers sem.\n\nDeferring it is a problem, because it makes dropping
  SB_FREEZE_WRITE\nprotection depend on the ring owner getting to running task_work.
  But\nthe task may be blocked in freeze_super(), causing it to never get to\nthat:\n\
  \n  task                             io-wq worker\n  --------------------------------------------------------------\n\
  \  io_write()\n    io_kiocb_start_write()         (takes sb_writers, hidden from\n\
  \                                    lockdep by __sb_writers_release)\n    write_iter()
  -> -EIOCBQUEUED\n  ioctl(FS_IOC_SHUTDOWN)\n    bdev_freeze()\n      fr"
