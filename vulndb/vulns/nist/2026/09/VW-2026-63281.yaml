title: Mongoid contains an unsafe reflection weakness in the document 
  persistence layer of its object-document mapping code. Input whose keys are 
  passed through from an unauthenticated party by an embedding application can 
  cause unintended internal method invocation instead of the intended array 
  field update. This may result in unintended removal of stored records and in 
  the embedding application becoming unresponsive.
