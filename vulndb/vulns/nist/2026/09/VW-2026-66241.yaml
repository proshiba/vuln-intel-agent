title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  hsr: free learned nodes on device setup failure\n\nhsr_dev_finalize() can fail after
  a lower-device RX handler has\nalready been registered (slave A is added before
  the failable slave B\nand interlink adds). RX handlers run in softirq regardless
  of the\nmaster's state, so frames received in that window can learn dynamic\nnodes
  into node_db, and the error unwind never releases them.\n\nFree both owned dynamic
  databases in the unwind, mirroring\nhsr_dellink(). proxy_node_db is provably empty
  on every current error\nexit (only interlink RX feeds it, and the interlink add
  is the last\nfailable step) and is freed for symmetry. The order is safe:\nhsr_del_port()
  unregisters each RX handler with synchronize_net()\nbefore hsr_del_nodes() runs,
  which removes remaining entries with\nlist_del_rcu() and defers their release with
  call_rcu() for readers\nalready under RCU."
