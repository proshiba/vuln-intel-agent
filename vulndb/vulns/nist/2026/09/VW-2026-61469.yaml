title: MikroTik RouterOS before 7.24 contains an out-of-bounds read 
  vulnerability in the userspace SMB daemon that allows unauthenticated 
  attackers to read beyond the end of the request buffer by supplying a crafted 
  uniPwdLen field value in a minimal SMB1 SessionSetupAndX frame. The 
  out-of-bounds read occurs in the SessionSetupAndX handler before any 
  credential validation, potentially exposing sensitive memory contents.
