title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/md-llbitmap:
  stop daemon timer rearm on destroy\n\nllbitmap_destroy() deletes pending_timer before
  flushing\nmd_llbitmap_io_wq. However, daemon_work can still be queued or running\n\
  after the timer has been deleted, and the daemon path can arm\npending_timer again
  when it finds dirty chunks that are not ready to\nflush yet.\n\nIf that happens
  during teardown, pending_timer can remain armed after\nllbitmap is freed and later
  dereference freed memory.\n\nAdd a BITMAP_SHUTDOWN bit to llbitmap->flags, set it
  before deleting\nthe timer, and make the timer and daemon paths stop queueing or
  rearming\nwork once teardown starts. Cancel daemon_work before flushing the shared\n\
  workqueue so no already queued daemon instance can race with the free.\nUse timer_shutdown_sync()
  so a daemon instance that passed the shutdown\ncheck before teardown cannot rearm
  the timer afterward.\n\nBITMAP_SHUTDOWN is a runtime-only state. Mask it out when
  reading an"
