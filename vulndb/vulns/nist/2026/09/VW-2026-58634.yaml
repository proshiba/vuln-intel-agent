title: The Smart Marketing SMS and Newsletters Forms plugin for WordPress is 
  vulnerable to generic SQL Injection via Parameter Name in all versions up to, 
  and including, 5.1.24 due to insufficient escaping on the user supplied 
  parameter and lack of sufficient preparation on the existing SQL query. This 
  makes it possible for authenticated attackers, with subscriber-level access 
  and above, to append additional SQL queries into already existing queries that
  can be used to extract sensitive information from the database. Exploitation 
  requires the plugin's sync feature to be enabled (options['enabled']) and 
  get_option('egoi_mapping') to be truthy, both of which reflect ordinary 
  configured states for the plugin's core contact mapping functionality.
