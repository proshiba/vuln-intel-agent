title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  imx6q: fix devres accumulation across driver rebind\n\nimx6_soc_volt is allocated
  with devm_kcalloc(cpu_dev, ...), where cpu_dev\nis the CPU device from get_cpu_device(0).
  That device is never unbound, so\nits devres list is never released, and imx6q_cpufreq_remove()
  does not free\nthe array either. Every probe therefore adds an allocation that stays
  for\nthe lifetime of the system.\n\nAllocate against the platform device instead.
  Its devres is released when\nthe driver is unbound, which is exactly the lifetime
  the array wants:\nimx6q_set_target() reads it, and nothing may reach that after\n\
  cpufreq_unregister_driver().\n\nThat makes the array actually go away on unbind,
  so also clear the\nfile-scope pointer in remove and on the failed-probe path, rather
  than\nleave it pointing at memory devres is about to release.\n\nTested by rebinding
  the driver on qemu's mcimx6ul-evk."
