title: "Authentication Bypass by Spoofing vulnerability in team-alembic ash_authentication
  allows an attacker who operates one identity-provider connection of a dynamic_oidc
  strategy to be signed in as a local user established through a different connection.\n\
  \nThe strategy is meant to keep each connection in its own identity namespace by
  writing every UserIdentity row's strategy field as \"<name>/<connection_id>\", but
  that namespacing never takes effect. __connection_id__ is populated only on the
  ephemeral runtime struct built per request in dynamic_oidc/plug.ex, and DynamicOidc.IdentityChange.change/3
  re-fetches the strategy from the compile-time DSL through Info.strategy_for_action,
  yielding the persisted struct whose __connection_id__ is its defstruct default of
  nil. OAuth2.identity_strategy_name/1 therefore falls back to the bare strategy name
  for both the identity write and the reads in oauth2/user_resolver.ex and oauth2/sign_in_preparation.ex.
