title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  fix NULL deref of af_xdp_zc_qidx on rep setup\n\naf_xdp_zc_qidx tracks receive queues
  using AF_XDP zero-copy and is\nallocated during PF/VF probe. Representors and other
  non-AF_XDP paths\nleave the pointer NULL, but several call sites used test_bit()
  on it\nunconditionally.\n\nSwitching to devlink eswitch mode creates representors
  and runs\notx2_init_hw_resources(), which reaches otx2_pool_aq_init() and oopses\n\
  when dereferencing the NULL bitmap. Add NULL checks before every\naf_xdp_zc_qidx
  test_bit() use in the RSS, ethtool, XSK, and pool init\npaths."
