title: GitPython before 3.1.62 does not validate the `path` field read from an 
  untrusted .gitmodules file when updating submodules. While a prior fix 
  (GHSA-hmq2-w58f-27jc) added Submodule._validated_name() to constrain the 
  `name` field, and GitPython's own containment guard 
  Submodule._to_relative_path() is applied in add() and move(), 
  Submodule.update() derives the absolute checkout location from the raw `path` 
  value without that guard. A .gitmodules entry containing directory traversal 
  components (e.g., path = ../../../tmp/escaped) can therefore cause directories
  to be created via os.makedirs() outside the repository working tree, populated
  from the submodule URL on the clone path, and removed via shutil.rmtree() when
  force_remove is used. Exploitation requires an application flow that updates 
  submodules at a non-HEAD commit (such as a historical-commit API); the common 
  clone-then-update flow re-derives the path from a canonical tree lookup and is
  not affected. The issue is fixed in GitPytho
