title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexfat:
  fix valid_size extension over a shared writable mapping\n\nWhen a shared writable
  mapping has its valid_size extended by a buffered\nwrite or a page fault, exfat
  zeroes the page-cache gap below the new\nvalid_size. A store through the mapping
  can race with this zeroing and be\noverwritten.\n\nFix this by zeroing the gap lazily.
  Drop ->map_pages so that every first\nwrite fault goes through exfat_page_mkwrite(),
  which advances valid_size to\ncover the faulting page. With fault-around enabled,
  a store could install a\nwritable PTE, skip ->page_mkwrite(), and land past valid_size
  without\nadvancing it. Extending valid_size one faulting page at a time also leaves\n\
  never-written pages in a large mapping alone.\n\nThe gap is filled with block granularity,
  zeroing only the not-uptodate\nblocks and preserving blocks that may hold data stored
  through the mapping.\nOn the buffered-write path the invalidate lock is held and
