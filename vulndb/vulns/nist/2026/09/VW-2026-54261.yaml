title: "In the Linux kernel, the following vulnerability has been resolved:\n\nalpha/PCI:
  Add security_locked_down() check to pci_mmap_resource()\n\nCurrently, Alpha's pci_mmap_resource()
  does not check\nsecurity_locked_down(LOCKDOWN_PCI_ACCESS) before allowing userspace
  to mmap\nPCI BARs.\n\nThe generic version has had this check since commit eb627e17727e
  (\"PCI:\nLock down BAR access when the kernel is locked down\") to prevent DMA\n\
  attacks when the kernel is locked down.\n\nAdd the same check to Alpha's pci_mmap_resource()."
