title: FreeRDP before 3.31.0 contains an out-of-bounds read vulnerability in the
  rdpdr_dump_packet function due to 32-bit unsigned integer wraparound in buffer
  bounds validation. A malicious RDP server can send a crafted RDPDR packet with
  computerNameLen set to 0xFFFFFFF0 to bypass bounds checks and trigger memory 
  reads past the packet buffer, causing client crashes or heap disclosure in 
  logs.
