title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Hold qpair lock when sending NVMe LS reject\n\nqla_nvme_ls_reject_iocb()
  allocates from and advances the request ring\nthrough __qla2x00_alloc_iocbs() (which
  assumes the hardware_lock is\nheld) and qla2x00_start_iocbs() (which advances the
  ring and rings the\nrequest-in doorbell), but takes no lock itself. Two of its callers\n\
  invoke it without the producer lock held:\n\n - qla_nvme_xmt_ls_rsp(), the NVMe-FC
  .xmt_ls_rsp transport callback, on\n   its error path, and\n\n - qla2xxx_process_purls_pkt(),
  run from the purex work/DPC context.\n\nBoth use ha->base_qpair, whose qp_lock_ptr
  is hardware_lock, so they can\nrun concurrently with normal I/O submission on the
  base ring and corrupt\nthe ring producer state, leading to duplicated or dropped
  commands. The\nthird caller, qla2xxx_process_purls_iocb(), runs inside\nqla24xx_process_response_queue()
  with the qpair lock already held and is\nsafe; that is also why the lock canno"
