title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Free transport channel on IDR failure\n\nIf transport channel setup succeeds
  but the following IDR insertion fails,\nthe error path destroys the transport device
  and frees the channel info\nwithout invoking the transport cleanup callback.\n\n\
  Call chan_free() before destroying the device so transport specific\nresources such
  as IRQs, mailbox channels and mapped shared memory are\nreleased consistently with
  the normal teardown path."
