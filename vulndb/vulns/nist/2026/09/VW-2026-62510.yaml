title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix stride mismatch in mac_phy_caps_parse()\n\nCurrently, in ath11k_wmi_tlv_mac_phy_caps_parse(),
  kcalloc() sizes the\nmac_phy_caps buffer as tot_phy_id * len, where len is clamped
  to\nmin(firmware_len, sizeof(struct wmi_mac_phy_capabilities)). The subsequent\n\
  memcpy() destination advances by sizeof(full struct) per slot via C\npointer arithmetic,
  not by the clamped len. When firmware sends short\nTLVs, the second and later slots
  are written past the end of the\nallocation.\n\nThe reader in ath11k_pull_mac_phy_cap_svc_ready_ext()
  also indexes the\nbuffer with full-struct pointer arithmetic, so the allocation
  must match\nthat stride.\n\nFix by using kzalloc_objs(), which derives the element
  size from the\npointer type, making allocation size and pointer stride provably\n\
  consistent regardless of what len the firmware provides.\n\nCompile tested only."
