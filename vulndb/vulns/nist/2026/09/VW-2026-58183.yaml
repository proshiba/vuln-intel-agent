title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix use-after-free in smc_rx_pipe_buf_release()\n\nsmc_rx_splice() hands RMB pages
  to a pipe and takes a socket reference\nper entry so the smc_sock stays alive until
  the reader finishes. The\nconnection does not: a concurrent close runs smc_conn_free(),
  which\nreleases the receive buffer back to the link group pool.\n\nsmc_rx_pipe_buf_release()
  tests sk_state before taking the socket lock.\nThe state can change between the
  test and the lock, and\nsmc_rx_update_cons() then dereferences conn->rmb_desc and
  walks\nconn->lgr, which smc_conn_free() has already released. On the\nis_reg_err
  path smcr_buf_unuse() frees the descriptor outright, so\nthis is a use-after-free.\n\
  \nTake the socket lock first and test conn->freed instead.\nsmc_conn_free() sets
  that flag before releasing anything, and every\ncaller holds the socket lock. The
