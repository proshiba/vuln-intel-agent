title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Invalidate RCU pointers after final spin unlock\n\nIn a sleepable BPF program, a
  spin lock can provide the only RCU protection\nfor a kptr. The final bpf_spin_unlock()
  ends that protection, but the\nverifier leaves the pointer valid. Another CPU can
  then free the object\nbefore the pointer is used. A capability-limited runtime PoC
  triggered a\ntask_struct use-after-free in __bpf_get_task_stack().\n\nRecord whether
  the program is in an RCU-protected context before releasing\nthe lock. Invalidate
  RCU-protected pointers only when the unlock leaves the\nfinal such context. This
  preserves valid pointers in non-sleepable programs\nand inside an explicit RCU read-side
  section."
