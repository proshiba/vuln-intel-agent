title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  defer rq_argp and rq_resp free until after RCU grace period\n\nsvc_rqst_free() frees
  rqstp->rq_argp and rqstp->rq_resp synchronously\nvia kfree(), but defers the rqstp
  struct free via kfree_rcu().  After\nsvc_exit_thread() calls list_del_rcu() and
  svc_rqst_free(), there is\na window where RCU readers that started before list_del_rcu()
  can still\ntraverse the thread list and find the rqstp.  These readers (e.g.\nnfsd_nl_rpc_status_get_dumpit())
  dereference rqstp->rq_argp, which has\nalready been freed — a use-after-free.\n\n\
  Fix this by moving the kfree of rq_argp and rq_resp into an explicit\ncall_rcu()
  callback alongside the struct free.  Resources not accessed\nby RCU readers (bvec,
  buffer pages, scratch folio, auth_data) remain\nsynchronously freed."
