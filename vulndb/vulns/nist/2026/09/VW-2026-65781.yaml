title: In Netgate pfSense Plus before 26.07 and pfSense CE before 2.9.0, a Local
  File Inclusion (LFI) vulnerability in the Dashboard (index.php) widget 
  sequence data handling allows an authenticated attacker to execute arbitrary 
  PHP code. To exploit this, an attacker with privileges to modify Dashboard 
  settings and write arbitrary files to the pfSense firewall system (e.g., 
  /tmp/test.widget.php) can submit a crafted widget sequence value containing a 
  path traversal payload (e.g., ../../../../../../../../../../../tmp/test). The 
  Dashboard will subsequently read and execute the arbitrary PHP file as if it 
  were a standard widget.
