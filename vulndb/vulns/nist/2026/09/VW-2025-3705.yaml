title: A weakness has been identified in nutzam NutzBoot up to 2.6.0-SNAPSHOT. 
  This affects the function getInputStream of the file 
  nutzcloud/nutzcloud-literpc/src/main/java/org/nutz/boot/starter/literpc/impl/endpoint/http/HttpServletRpcEndpoint.java
  of the component LiteRpc-Serializer. Executing a manipulation can lead to 
  deserialization. The attack may be launched remotely. This attack is 
  characterized by high complexity. The exploitability is reported as difficult.
  The exploit has been made available to the public and could be used for 
  attacks.
