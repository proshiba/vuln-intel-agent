title: Cap-go capgo.app fails to validate that principals in 
  channel_permission_overrides belong to the organization, allowing 
  authenticated app/org admins to grant channel permissions to non-member users.
  Attackers with admin privileges can insert override rows with arbitrary 
  external user UUIDs to grant channel-scoped permissions such as 
  channel.promote_bundle to users outside the organization.
