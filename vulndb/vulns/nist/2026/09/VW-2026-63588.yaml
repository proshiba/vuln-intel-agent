title: The Photo Gallery, Sliders, Proofing and   WordPress plugin before 4.5.0 
  does not verify that the requesting user is entitled to a given image record 
  before returning it, allowing users with the Contributor role and above to 
  read the stored metadata of any image on the site, including images in 
  galleries belonging to other users. The disclosed data includes the image's 
  stored EXIF subset, covering camera make and model and capture timestamp, 
  along with internal checksums and identifiers that the Photo Gallery, Sliders,
  Proofing and   WordPress plugin before 4.5.0's own capability-gated read path 
  reserves to administrators.
