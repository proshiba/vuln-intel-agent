title: Stored Cross-Site Scripting (XSS) vulnerability in StockAgile API and 
  management panel. The vulnerability is present on the server side in REST 
  endpoint '/inventory/configuration/serial-number-types' that allow the 
  injection and persistence of malicious JavaScript code through parameters such
  as ‘code’, ‘name’, and other text fields. The scripts that are entered are not
  filtered or validated correctly before being displayed on the web panel that 
  authenticated users can access. Exploiting this vulnerability could allow a 
  remote, previously authenticated attacker to execute arbitrary JavaScript 
  code.
