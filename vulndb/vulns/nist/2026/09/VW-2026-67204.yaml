title: A security vulnerability has been detected in refly-ai refly up to 1.1.0.
  This issue affects some unknown processing of the file 
  apps/api/src/modules/config/app.config.ts of the component JWT Token Handler. 
  The manipulation with the input test leads to hard-coded credentials. It is 
  possible to initiate the attack remotely. The exploit has been disclosed 
  publicly and may be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
