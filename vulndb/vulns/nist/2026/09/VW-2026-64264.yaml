title: "A reflected cross-site scripting vulnerability exists in x-ui 0.3.2. The management
  interface reflects the raw request URI into a client-side template binding expression
  used for sidebar menu highlighting. Server-side HTML entity escaping is ineffective
  in this context: the browser decodes the entities before the client-side framework
  evaluates the content as a JavaScript expression. A logged-in panel user who visits
  a crafted URL allows arbitrary script execution in the same-origin context of the
  management page, enabling data theft and unauthorized actions through the victim's
  session."
