title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Check load-acquire src ptr type before the load\n\ncheck_atomic_load() calls check_load_mem()
  before atomic_ptr_type_ok().\nFor a load-acquire that fetches into its own source
  register (dst_reg ==\nsrc_reg), check_load_mem() overwrites src_reg's type with
  the type of the\nloaded value, so the subsequent atomic_ptr_type_ok() no longer
  sees the\nsource pointer and fails to reject the disallowed types (ctx, pkt,\nflow_keys,
  sock).\n\nSince bpf_convert_ctx_accesses() does not rewrite atomic loads, the raw\n\
  access to the underlying kernel object is left in place. The destination\ntype is
  taken from the ctx access itself, so a load-acquire of the sk\nfield of struct __sk_buff
  for example leaves the register typed as\nPTR_TO_SOCK_COMMON_OR_NULL, which type_is_sk_pointer()
  does not match\neither, while it actually holds unconverted struct sk_buff bytes.
  Once\nthe NULL check has passed this is a type confusion, not just a leak of\nkernel"
