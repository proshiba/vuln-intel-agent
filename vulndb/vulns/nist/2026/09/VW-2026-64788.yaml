title: "Pake turns a website into a desktop application built on Tauri. Every application
  it generates inherits two settings from the upstream template, and together they
  hand native functionality to untrusted web content.\n\n\n\nThe first is in src-tauri/capabilities/default.json,
  which grants IPC access with \"remote\": { \"urls\": [\"https://*.*\"] }. That wildcard
  tells Tauri to accept IPC from any HTTPS origin, not just the site the application
  was built to wrap. The second is \"withGlobalTauri\": true in src-tauri/tauri.conf.json,
  which puts window.__TAURI__.core.invoke() in reach of ordinary page JavaScript.\n\
  \n\n\nTauri's access control list only checks plugin commands, the ones prefixed
  with plugin:. Commands the application registers itself through generate_handler!,
  known as app commands, are never checked against the ACL. So once an origin holds
  IPC access, it can call every app command with nothing else standing in the way.
  Pake registers download_file as an app command, and it does not appear in"
