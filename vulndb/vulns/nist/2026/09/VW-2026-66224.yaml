title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/virtio:
  use the DMA API for resource backing on Xen\n\nOn a Xen PV domain page addresses
  bear no relation to the real machine\naddresses the host would have to use to reach
  it.\nvirtio_ring.c handles this correctly, vring_use_map_api() returns true\nfor
  any xen_domain() regardless of VIRTIO_F_ACCESS_PLATFORM.\n\nvirtio-gpu makes the
  same decision independently, but its copy\nlooks only at the feature bit:\n\n\t\
  bool use_dma_api = !virtio_has_dma_quirk(vgdev->vdev);\n\nQEMU does not set iommu_platform
  on virtio-vga by default, so\nVIRTIO_F_ACCESS_PLATFORM is not negotiated, use_dma_api
  is false, and\nvirtio_gpu_object_shmem_init() describes the framebuffer's backing
  pages\nto the host with sg_phys().  Those are guest-physical addresses. In a PV\n\
  domain they resolve, on the host side, to pages belonging to some other\ndomain,
  so the host scans out unrelated memory.\n\nMove the decision into virtio_gpu_use_dma_api()
  and give it the\nxen_d"
