title: Steeltoe is an open source project that provides a collection of 
  libraries that helps users build cloud-native applications. Prior to 4.3.0, 
  the Steeltoe.Management.Endpoint /actuator/httpexchanges endpoint passes 
  recorded request URIs through MaskedUri, which masks URI user information but 
  does not inspect query strings. When 
  Management:Endpoints:HttpExchanges:IncludeQueryString is enabled, the 
  HttpExchangeRequest response can disclose OAuth tokens, password-reset tokens,
  signed-URL signatures, API keys, and other query-string secrets from prior 
  traffic to a caller that can reach the explicitly exposed endpoint. The 
  Steeltoe.Management.Endpoint.Actuators.HttpExchanges DEBUG logger also records
  these URIs, creating a second disclosure channel for users with log access. 
  This issue is fixed in version 4.3.0.
