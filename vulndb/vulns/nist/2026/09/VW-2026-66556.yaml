title: OpenClaw is an npm-distributed application. In versions >= 2026.4.25 and 
  < 2026.8.1, the workspace environment-variable filter did not block variables 
  ending in `_ENDPOINT`, so an untrusted workspace `.env` file could set 
  AZURE_SPEECH_ENDPOINT. Azure Speech preferred that value over the configured 
  region, so when a synthesis or voice-list request was made, the 
  attacker-selected endpoint received the operator's Azure Speech key in the 
  request header, allowing the key to be reused against the operator's Azure 
  Speech resource. Exploitation requires an operator to start OpenClaw in 
  attacker-controlled workspace content with Azure Speech configured with a key 
  and region and no trusted endpoint override set. The issue is fixed in 
  2026.8.1.
