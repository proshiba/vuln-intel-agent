title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  qcom: gdsc: tear down per-domain genpds in gdsc_unregister()\n\ngdsc_unregister()
  removes the OF provider entry and tears down the\nparent/subdomain wiring, but never
  calls pm_genpd_remove() on the\nindividual generic_pm_domain structures registered
  by gdsc_init():\n\n\tvoid gdsc_unregister(struct gdsc_desc *desc)\n\t{\n\t\tstruct
  device *dev = desc->dev;\n\t\tsize_t num = desc->num;\n\n\t\tgdsc_pm_subdomain_remove(desc,
  num);\n\t\tof_genpd_del_provider(dev->of_node);\n\t}\n\nThat leaves dangling entries
  on the global gpd_list. After a provider\nunbind/rebind cycle (deferred-probe replay
  during early boot, real\nmodule unload of a clk driver that owns GDSCs, or an OF-overlay
  tear-\ndown) the next gdsc_init() will end up trying to re-register a name\nthat
  is still in the list and pm_genpd_init() returns -EEXIST.\n\nWhile we are here,
  flip the order so the consumer-facing OF provider\nentry is the first thing removed
  -- otherwise a fresh\nof_genpd_"
