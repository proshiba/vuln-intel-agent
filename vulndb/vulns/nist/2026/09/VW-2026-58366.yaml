title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-era:
  fix shadowed superblock leak on take-snap failure\n\nmetadata_take_snap() bumps
  the live superblock refcount and then\ndm_tm_shadow_block() allocates a new block
  for the metadata snapshot.\nIf the subsequent dm_sm_inc_block() of writeset_tree_root
  or\nera_array_root fails, the function only unlocks the clone and\nreturns.  The
  newly allocated shadow block is never returned to the\nmetadata space map, so each
  failed take-snap permanently leaks one\nmetadata block.\n\nFree the clone with dm_sm_dec_block()
  on those error paths, matching\nthe final step of metadata_drop_snap()."
