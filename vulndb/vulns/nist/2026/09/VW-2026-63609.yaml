title: A security flaw has been discovered in aiyiyi121 SxDevOps 1.0/1.1. This 
  issue affects some unknown processing of the file backend/sxdevops/settings.py
  of the component Settings Handler. The manipulation results in hard-coded 
  credentials. The attack may be performed from remote. The patch is identified 
  as 2b4bf8585c3e731e7a8af30801ea46680bc783f9. Applying a patch is advised to 
  resolve this issue. The vendor was contacted early, responded in a very 
  professional manner and quickly released a fixed version of the affected 
  product.
