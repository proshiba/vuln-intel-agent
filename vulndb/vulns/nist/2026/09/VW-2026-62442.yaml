title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  logitech-hidpp: Fix FF device cleanup on init failure\n\nhidpp_ff_init() creates
  the input force-feedback device with\ninput_ff_create(), then allocates the HID++
  FF private data,\neffect ID array, and workqueue.\n\nIf any of those allocations
  fail after input_ff_create() succeeds,\nthe function returns an error without destroying
  the FF device.\nAdd an unwind path that frees the private allocations made by\n\
  hidpp_ff_init() and calls input_ff_destroy() for failures after\ninput_ff_create()
  succeeds."
