title: "A flaw was found in GDB's STABS debug format parser. The\nread_member_functions()
  function in gdb/stabsread.c contains a linked\nlist removal bug in the code that
  separates destructor and non-destructor\nmember functions of C++ classes. The bug
  causes the destructor entries to\nremain in the main function list while the list
  length counter is\ndecremented, resulting in an out-of-bounds write when the function
  list\nis copied to its final allocated array. An attacker can craft an ELF\nbinary
  with malicious .stab and .stabstr sections that triggers this\nout-of-bounds write
  when a user opens the file in GDB and performs any\nsymbol-inspection operation
  such as setting a breakpoint. The inferior\nprocess does not need to be executed.
  Under controlled conditions, this\nwas demonstrated to achieve execution of arbitrary
  commands within the\nGDB process."
