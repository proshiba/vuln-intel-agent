title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  ISST: Validate level in perf mask ioctls\n\nisst_if_get_perf_level_mask() and isst_if_get_base_freq_mask()
  use the\nuser-provided level as an index into perf_levels[] via\n_read_pp_level_info()
  and _read_bf_level_info(), but neither helper\nvalidates it first.\n\nThe adjacent
  level-info helpers reject levels above max_level before\nreading the same per-level
  register block. Add the same bounds checks to\nthe mask helpers, and reject disabled
  SST-PP levels in\nisst_if_get_perf_level_mask() to match isst_if_get_perf_level_info().\n\
  \nThis prevents out-of-bounds reads from the per-level offset table on\ninvalid
  ioctl input."
