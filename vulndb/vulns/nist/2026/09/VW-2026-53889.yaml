title: A security flaw has been discovered in light0011 cms 
  c774dce31c6df0055568a8d5c53d964d99be199d/f72cf46f601efb2a0618c3814cc2f61380b38930.
  This affects the function ChapterModel::searchChapter of the file 
  App/Home/Controller/ChapterController.class.php of the component Query 
  Builder. The manipulation of the argument content results in sql injection. 
  The attack can be launched remotely. The exploit has been released to the 
  public and may be used for attacks. This product does not use versioning. This
  is why information about affected and unaffected releases are unavailable. The
  project was informed of the problem early through an issue report but has not 
  responded yet.
