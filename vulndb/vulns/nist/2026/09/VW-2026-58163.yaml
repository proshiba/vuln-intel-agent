title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  validate geometry fields from on-disk cache_info\n\ncache_segs_init() iterates cache_info->n_segs
  times indexing\ncache->segments[], which is sized to the cache device geometry,
  and\nget_seg_id() takes each segment id from the on-media cache_info and the\nper-segment
  next_seg link. Both come from cache device metadata that is\nonly CRC-protected
  with a fixed public seed, so whoever supplies the\ncache device on a table load
  (CAP_SYS_ADMIN) controls them: an oversized\nn_segs or an out-of-range id drives
  an out-of-bounds access of\ncache->segments[] and a wild CACHE_DEV_SEGMENT() pointer
  into the device\nmapping -- an out-of-bounds read and write from on-disk data.\n\
  \nReject an n_segs that exceeds the device segment count and a segment id\nthat
  is out of range before either is used. Valid metadata is unaffected."
