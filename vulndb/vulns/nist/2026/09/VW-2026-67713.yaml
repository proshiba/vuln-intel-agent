title: "Issue summary: A certificate with many nameRelativeToCRLIssuer CRL\ndistribution
  points causes disproportionate heap growth when OpenSSL caches\nX.509 extensions.\n\
  \nImpact summary: Receiving a crafted certificate from a malicious peer can lead\n\
  to significant memory pressure and possible Denial of Service in clients or\nin
  servers that solicit client certificates.\n\nCWE: CWE-770: Allocation of Resources
  Without Limits or Throttling\n\nDescription: A certificate or a set of certificates
  that fits under the limit for\nsize of certificates accepted from the peer (~100
  KiB) can result in allocation\nof several hundred MiB of resident memory on the
  receiving side\nduring a normal TLS handshake.  This may be enough to crash the
  client or\nserver, if multiple concurrent connections lead to similarly large memory\n\
  allocations.\n\nThe fix postpones processing of the CRL distribution points extensions
  in\ncertificates to the time when the processed value is required for CRL processing.\n\
