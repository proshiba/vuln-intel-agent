title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkho:
  fix size calculation in kho_preserved_memory_reserve()\n\nkho_preserved_memory_reserve()
  calculates the size of a preservation by\ndoing 1 << (order + PAGE_SHIFT). Since
  the '1' is a 32-bit integer, it\ncan only be shifted by 31. That is, it will only
  work for preservations\nup to 2 GiB. Larger preservations will trigger undefined
  behaviour.\n\nWhile preservations larger than 2 GiB can't be obtained via folios\n\
  currently, they can be obtained via kho_preserve_pages().\n\nFor example, memblock
  reserve_mem uses kho_preserve_pages().\nReservations larger than 2 GiB are valid
  and will trigger this bug if\nproperly aligned.\n\nFix it by using 1UL for shifting."
