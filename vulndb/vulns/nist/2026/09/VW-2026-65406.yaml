title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngreybus:
  audio: bound the topology section sizes against the fetched size\n\ngb_audio_gb_get_topology()
  fetches a topology blob of a module-supplied\nsize, and gbaudio_tplg_parse_data()
  then walks it by adding the\nmodule-supplied size_dais, size_controls and size_widgets
  fields to\nform the control, widget and route section offsets. Those le32 sizes\n\
  are never checked against the fetched blob, so a module reporting a\nsmall topology
  size but large section sizes makes the offsets point\npast the allocation, and parsing
  reads out of bounds.\n\nReject a topology whose section sizes do not fit within
  the fetched\nsize before it is parsed."
