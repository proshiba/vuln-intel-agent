title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: lp8788-charger: fix use-after-free on remove\n\nlp8788_charger_remove()
  flushes charger_work before unregistering the\nIRQs. An IRQ thread can queue charger_work
  after flush_work() has\nreturned. The work can then run after devres frees pchg
  and dereference\nit in lp8788_charger_event().\n\nUnregister the IRQs first. free_irq()
  waits for any running threaded\nhandler, so no handler can queue more work afterwards.
  Then use\ncancel_work_sync() to cancel pending work or wait for running work to\n\
  finish.\n\nThis issue was found by an in-house static analysis tool."
