title: A vulnerability was determined in GPAC 26.08-DEV. The affected element is
  the function gf_node_deactivate_ex of the file 
  src/scenegraph/base_scenegraph.c of the component MP4Box. Executing a 
  manipulation can lead to use after free. The attack needs to be launched 
  locally. The exploit has been publicly disclosed and may be utilized. 
  Upgrading to version abi-16.24 is sufficient to fix this issue. This patch is 
  called e34f4ba349d55cd1849f0bcf4cf46552732e2db7. The affected component should
  be upgraded. This issue is distinct from CVE-2026-90827.
