title: "Uncontrolled Resource Consumption vulnerability in ash-project ash lets an
  attacker exhaust node memory by matching a filter that spans multiple to-many relationships
  in memory.\n\nAsh.Filter.Runtime matches a filter against an in-memory record by
  first expanding the record into combinations of its related rows. flatten_relationships/2
  (lib/ash/filter/runtime.ex) eagerly built the full Cartesian product across the
  filter's to-many relationship paths, so a record with K to-many relationships of
  M rows each materialized on the order of M^K scenarios before any predicate was
  checked. A filter or dataset that reaches several sizeable to-many relationships
  therefore allocates memory combinatorially and can exhaust the node. The fix streams
  the expansion lazily and short-circuits on the first matching scenario, bounding
  the work.\n\nThis issue affects ash: from 1.29.0-rc0 before 3.32.2."
