title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Zero initialize data structures for inject_pfault_token\n\n__kvm_inject_pfault_token()
  only sets .type and .u.ext.ext_params2 of\nthe on-stack struct kvm_s390_irq but
  the full ext substructure is copied\ninto the cpu local variable on inject. ext_params
  and pad contain stale\nstack values.\n\nInterrupt delivery only uses ext_params2,
  so nothing leaks to the guest,\nbut a host user can use the migration ioctls to
  get to the data.\n\nFix by zero-initializing the irq struct.\nDo the same for the
  inti data structure."
