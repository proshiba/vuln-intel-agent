title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  chemical: atlas-sensor: use iio_trigger_poll_nested() to fix remove UAF\n\nThe atlas
  driver requests its hardware data-ready IRQ with\ndevm_request_threaded_irq(); its
  threaded handler queues an irq_work,\natlas_work_handler(), that calls iio_trigger_poll(data->trig).\n\
  \nThe IRQ is devm-managed, so free_irq() runs from the devres unwind after\natlas_remove()
  returns without flushing that irq_work.  Once a buffer is\nenabled, conversion-complete
  IRQs keep firing and queueing it; a pending\nirq_work can therefore run after the
  unwind has freed atlas_data/indio_dev\nand the trigger, when atlas_work_handler()
  derives the atlas_data pointer\nvia container_of() and dereferences data->trig,
  a use-after-free.\n\nCall iio_trigger_poll_nested() directly from the threaded handler
  instead\nof bouncing through irq_work.  free_irq() then drains the threaded handler,\n\
