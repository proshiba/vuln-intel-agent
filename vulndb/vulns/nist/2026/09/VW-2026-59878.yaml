title: "Server-Side Request Forgery (SSRF) vulnerability in Slab safeurl allows an
  attacker who controls a validated URL to reach internal network destinations the
  library is configured to block.\n\nOnly IPv4 addresses are matched against the reserved
  ranges and the blocklist. Every other address is treated as matching nothing, so
  a destination that is rejected in its IPv4 form is accepted when written as an IPv6
  address, IPv6 entries in the blocklist never match, and a host that resolves to
  no IPv4 address is accepted regardless of where it points. Deployments that rely
  on the allowlist instead are unaffected, because there an unmatched address is rejected.\n\
  \nThis issue affects safeurl: from 0.1.0 onward."
