title: rclone is a command-line program to sync files and directories to and 
  from different cloud storage providers. Prior to 1.75.1, rclone core does not 
  reject parent-directory segments in source Object.Remote() values before 
  fs/list, fs/walk, fs/sync, and fs/operations pass those values to destination 
  backends. A flat-keyspace source object store populated with native non-rclone
  tooling can contain a raw .. key segment, and affected b2, swift, qingstor, 
  oracleobjectstorage, internetarchive, smb, storj, sftp, webdav, ftp, filelu, 
  shade, and sia destinations use path.Join(root, remote) before EncodeDot can 
  neutralize the segment. A copy or upload can therefore escape the configured 
  root into another bucket, share, or path reachable by the victim credential, 
  with sftp and smb potentially reaching other filesystem or share locations 
  under the same login authority. This issue is fixed in version 1.75.1.
