title: A security vulnerability has been detected in Rizwan17 
  inventory-management-system up to bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. 
  This affects an unknown part of the file includes/invoice_bill.php of the 
  component Invoice Generation. Such manipulation of the argument 
  order_date/invoice_no leads to missing authentication. It is possible to 
  launch the attack remotely. The exploit has been disclosed publicly and may be
  used. This product takes the approach of rolling releases to provide 
  continious delivery. Therefore, version details for affected and updated 
  releases are not available. The project was informed of the problem early 
  through an issue report but has not responded yet.
