title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Keep the entry count when the histogram stats allocation fails\n\nprint_entries()
  uses n_entries both as the number of sort entries and as\nits own return value,
  so the -ENOMEM it stores when the stats allocation\nfails overwrites the count that
  the cleanup still needs:\n\n\tn_entries = tracing_map_sort_entries(map, ...);\n\t
  if (n_entries < 0)\n\t\treturn n_entries;\n\t...\n\t\t\tif (!stats) {\n\t\t\t\t\
  n_entries = -ENOMEM;\n\t\t\t\tgoto out;\n\t\t\t}\n\t...\n out:\n\ttracing_map_destroy_sort_entries(sort_entries,
  n_entries);\n\ntracing_map_destroy_sort_entries() takes an unsigned int and loops
  up to\nit, so -ENOMEM arrives as 4294967284. It walks an array of at most\nmap->max_elts
  pointers and calls destroy_sort_entry(), which dereferences\nand frees, on whatever
  lies past the end.\n\nReading the hist file of a trigger with a .percent value,
  with that\nallocation forced to fail:\n\n  BUG: KASAN: vmalloc-out-of-bounds in
  tracing_map_destroy_sort_entries+0x"
