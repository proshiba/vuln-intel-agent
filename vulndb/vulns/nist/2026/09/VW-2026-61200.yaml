title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Hold vport_slock for host map update in report ID acquisition\n\nqla24xx_report_id_acquisition()
  format-1 handling drops vport_slock after\ntaking the vport reference and then calls
  qla_update_host_map() without\nthe lock. That reaches qla_update_vp_map(), which
  mutates the ha->host_map\nbtree via btree_insert32()/btree_update32()/btree_remove32()
  and is\ndocumented to require vport_slock to be held by the caller. Running it\n\
  unlocked can race concurrent host_map updates and corrupt the btree.\n\nThe format-2
  path in the same function already wraps its host_map update\n(SET_AL_PA) in vport_slock;
  the format-1 path is the lone outlier.\n\nHold vport_slock across the format-1 qla_update_host_map()
  call to honor\nthe documented locking contract. The vref_count taken in the loop
  keeps\nthe vport valid, so this only adds the missing host_map serialization."
