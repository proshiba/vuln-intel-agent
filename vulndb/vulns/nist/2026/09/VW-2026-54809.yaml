title: PocketMine-MP before 4.2.10 fails to validate the total length of 
  incoming chat message blobs before splitting them by newline characters, 
  allowing attackers to send large messages containing many newlines. Malicious 
  clients can send megabyte-sized chat packets and bombard the server with 
  thousands of such messages, causing server lockups lasting seconds or minutes.
