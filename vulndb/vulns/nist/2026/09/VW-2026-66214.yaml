title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Remove __counted_by from struct amdxdna_cmd_chain\n\nstruct amdxdna_cmd_chain contains
  a flexible array annotated with\n__counted_by(command_count). Since the structure
  is stored in shared\nAMDXDNA_BO_SHARE memory, userspace can modify command_count
  concurrently.\nIf command_count is changed to zero, the bounds check generated from\n\
  __counted_by may fail and trigger a kernel panic.\n\nRemove __counted_by to avoid
  relying on the userspace-controlled\ncommand_count for the flexible array bounds
  check."
