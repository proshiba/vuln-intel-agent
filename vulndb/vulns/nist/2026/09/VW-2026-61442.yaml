title: yshop-crm through 2.1.3 fails to enforce authorization checks on the 
  CrmFlowController deleteFlowStep endpoint, allowing any authenticated 
  back-office user to delete arbitrary approval workflow steps. Attackers can 
  invoke the DELETE /admin-api/crm/flow/delete-step endpoint without required 
  permissions to remove approval steps that control contract, receivable, and 
  invoice finalization processes.
