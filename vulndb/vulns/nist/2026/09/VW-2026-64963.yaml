title: Jawn is an open source JSON parser. Prior to 1.7.0, Jawn parse methods 
  accept arbitrarily deep JSON array and object nesting without a depth limit, 
  allowing a remote attacker who can submit untrusted JSON to grow parser 
  contexts until the JVM heap is exhausted. The resulting 
  java.lang.OutOfMemoryError is a fatal Scala error that is not ordinarily 
  handled by scala.util.Try or cats.effect.IO, causing denial of service. This 
  issue is fixed in version 1.7.0.
