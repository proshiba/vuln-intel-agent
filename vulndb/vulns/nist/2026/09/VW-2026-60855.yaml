title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.26.0.000.
  Easily exploitable vulnerability allows unauthenticated attacker with access to
  the physical communication segment attached to the hardware where the Oracle Hyperion
  Financial Management executes to compromise Oracle Hyperion Financial Management.  Successful
  attacks of this vulnerability can result in unauthorized ability to cause a hang
  or frequently repeatable crash (complete DOS) of Oracle Hyperion Financial Management
  as well as  unauthorized update, insert or delete access to some of Oracle Hyperion
  Financial Management accessible data. CVSS 3.1 Base Score 7.1 (Integrity and Availability
  impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H).'
