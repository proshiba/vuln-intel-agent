title: Contrast before 1.16.0 is susceptible to remote attestation relay 
  attacks. Contrast accepted any TEE attestation report that verified correctly 
  and contained the expected firmware patch levels and software measurements, 
  regardless of which machine produced it, so attestation was not bound to 
  specific, physically trusted hardware. An attacker who can both intercept 
  network traffic between the CLI and the Coordinator (or between the 
  Coordinator and an attested component) and forge reports or extract secrets 
  from any single TEE machine under their physical control can relay such a 
  report to impersonate a Contrast Coordinator or a Contrast workload, defeating
  identity verification in Contrast's attested TLS (aTLS).
