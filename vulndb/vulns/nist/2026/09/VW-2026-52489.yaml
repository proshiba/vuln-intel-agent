title: AVideo contains a missing authentication vulnerability in 
  plugin/Live/on_publish.php that allows unauthenticated attackers to mark 
  arbitrary scheduled broadcasts as failed by sending crafted POST requests with
  schedule identifiers. Attackers can exploit the unguarded RTMP callback 
  endpoint to modify scheduled broadcast status fields by supplying fabricated 
  stream keys matching the pattern -ps-<N>, silently canceling any scheduled 
  live broadcast without credentials or authorization.
