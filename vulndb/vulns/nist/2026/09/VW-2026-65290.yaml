title: IBM ContextForge MCP Gateway 1.0.0 through 1.0.8 was vulnerable to path 
  traversal in its Admin API log-download endpoint (`GET /v1/admin/logs/file`). 
  The path confinement check uses `str.startswith()` rather than proper boundary
  validation, allowing an authenticated admin to read `.log`, `.jsonl`, and 
  `.json` files outside the configured `LOG_FOLDER` by supplying a filename that
  resolves into a sibling directory whose absolute path shares the log 
  directory's string prefix.
