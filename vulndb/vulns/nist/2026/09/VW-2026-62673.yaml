title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Require a BPF cpumask for bpf_cpumask_populate()\n\nbpf_cpumask_populate() writes
  to its destination with bitmap_copy(), but\nthe destination is typed as struct cpumask
  *. That allows the verifier to\naccept borrowed cpumask pointers returned by read-only
  kfuncs, such as\nscx_bpf_get_online_cpumask(), as a writable destination.\n\nMake
  the destination a struct bpf_cpumask * so populate follows the same\nownership rule
  as the other mutating cpumask kfuncs. Query kfuncs continue\nto accept const struct
  cpumask * inputs."
