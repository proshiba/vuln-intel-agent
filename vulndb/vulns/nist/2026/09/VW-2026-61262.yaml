title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  BPF: Refactor jump offset calculation in tail call\n\nThe old macro-based jmp_offset
  calculation derives the jump distance\nfrom a stale prior-pass code stride, which
  can lead to wrong branch\noffsets and soft lockups under extra JIT passes.\n\nFix
  this by calculating the offset directly on the absolute target:\n\"ctx->offset[insn
  + 1] - ctx->idx\".\n\nTo avoid a false 16-bit range check abort during size estimation,
  add\na \"ctx->image == NULL\" guard to inject a safe dummy offset."
