title: SGLang through 0.5.19 in prefill/decode disaggregation mode with Mooncake
  KV transfer backend fails to validate bootstrap_room values, allowing 
  unbounded transfer state allocation. Unauthenticated attackers can reach the 
  decode engine's POST /generate endpoint and submit arbitrary bootstrap_room 
  values to exhaust prefill process memory until out-of-memory termination.
