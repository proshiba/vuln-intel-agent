title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/bng_re:
  return a timeout when firmware responses stall\n\n__wait_for_resp() documents that
  it returns a non-zero error when a\nfirmware command does not complete, and bng_re_rcfw_send_message()
  already\nmarks the firmware as stalled when the helper returns -ENODEV.\n\nHowever,
  the helper ignores wait_event_timeout() expiry.  If the response\nslot remains in
  use after the timeout and after the polled CREQ service\nattempt, the loop starts
  another full timeout period and can repeat\nforever.\n\nReturn -ENODEV after a timed
  out wait that still has no response.  The\nexisting caller then marks FIRMWARE_STALL_DETECTED
  and returns\n-ETIMEDOUT to the command issuer."
