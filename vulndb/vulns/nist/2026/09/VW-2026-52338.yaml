title: Wallos is an open-source, self-hostable personal subscription tracker. 
  Prior to version 4.9.6, POST 
  /endpoints/notifications/testemailnotifications.php accepts smtpaddress and 
  smtpport from POST body with zero SSRF validation. PHPMailer connects to 
  attacker-supplied host:port. Every other notification endpoint uses 
  ssrf_helper.php but email was missed. Any authenticated user can probe 
  internal network, cloud metadata. This issue has been patched in version 
  4.9.6.
