title: plone.app.dexterity is a content-type system for the Plone content 
  management system, and plone.app.contenttypes provides Plone’s Dexterity-based
  content types. Plone.app.dexterity versions through 3.2.2, 4.0.0 through 
  4.1.2, and 5.0.0, and plone.app.contenttypes versions through 3.0.11, 4.0.0 
  through 4.0.9, and 5.0.0 are vulnerable to denial of service because an 
  authenticated user can create content with excessively long titles, 
  descriptions, or uploaded-file names, causing Plone to become unresponsive and
  potentially making the resulting content difficult to edit or delete. The 
  vulnerability is patched in plone.app.dexterity versions 3.2.3, 4.1.3, and 
  5.0.1, and in plone.app.contenttypes versions 3.0.12, 4.0.10, and 5.0.1.
