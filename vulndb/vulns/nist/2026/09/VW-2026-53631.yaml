title: "In Eclipse Arrowhead versions from 5.0.0 to 5.2.1 when the MQTT API is enabled
  with the certificate authentication policy, CertificateMqttFilter parses an X.509
  certificate that the client sends inside the MQTT message payload (the authentication
  field of MqttRequestTemplate) and treats its Subject DN as the authenticated identity.
  The certificate is decoded with CertificateFactory.generateCertificate() but its
  signature is never verified and its issuer chain is never validated against any
  trust store. Authorisation is reduced to two string comparisons on attacker-supplied
  data: the DN-qualifier must equal \"sy\" or \"op\", and the cloud-name part of the
  CN must match the server's. Both values are public (the cloud name is in the server's
  own TLS certificate). An attacker who can publish to the MQTT broker can therefore
  mint a self-signed certificate with CN=Sysop.<cloud>.<org>.arrowhead.eu, dnQualifier=op,
  send it as the authentication field, and be authenticated as the cloud's system
  ope"
