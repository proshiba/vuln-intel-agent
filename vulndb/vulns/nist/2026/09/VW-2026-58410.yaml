title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  intel-thc-hid: intel-quickspi: validate report size before copy\n\nwrite_cmd_to_txdma()
  builds an output report in qsdev->report_buf, a heap\nbuffer allocated in quickspi_alloc_report_buf()
  to the device-descriptor\nderived max_report_len (a few hundred bytes for a touch
  controller).  It\ncopies the caller-supplied report into that buffer:\n\n    memcpy(write_buf->content,
  report_buf, report_buf_len);\n\nThe HID core caps a report at HID_MAX_BUFFER_SIZE
  (16384) by default, and\nquickspi_hid_ll_driver does not set max_buffer_size, so
  the length reaches\nthe driver unbounded.  A hidraw SET_REPORT/SET_FEATURE ioctl
  carrying a\nreport larger than max_report_len therefore overflows report_buf with\n\
  attacker-controlled length and content.\n\nRecord the report_buf allocation size
  and reject reports that do not fit\nbefore copying, matching the equivalent guard
  in the intel-quicki2c\nsibling (quicki2c_init_write_buf()) and the hid-goodix"
