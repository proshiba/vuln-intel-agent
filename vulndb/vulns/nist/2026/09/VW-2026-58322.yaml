title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Fix pcl_for_each_segment for empty chunks\n\nWhen a parsed chunk list contains a
  chunk whose ch_segcount is zero,\npcl_for_each_segment computes its inclusive upper
  bound as\n&chunk->ch_segments[ch_segcount - 1]. ch_segcount is u32, so the\nsubtraction
  wraps to 0xFFFFFFFF and the bound lands far past the\nch_segments flex array. The
  loop body then walks unrelated memory at\nsizeof(struct svc_rdma_segment) stride
  until it faults.\n\nA zero-segcount chunk is reachable from the wire:\nxdr_check_write_chunk()
  only rejects segcount values greater than\nrc_maxpages, and pcl_alloc_write() links
  a freshly allocated chunk\nonto rc_write_pcl/rc_reply_pcl before its segment-fill
  loop runs,\nso a Write or Reply chunk advertising zero segments leaves\nch_segcount
  == 0 on the list. When the transport has negotiated\nSend-With-Invalidate, svc_rdma_get_inv_rkey()
  iterates all four\nPCLs with pcl_for_each_segment and dereferences segment->rs"
