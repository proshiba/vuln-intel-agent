title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_u32: fix duplicate handle when node ID pool is exhausted\n\ngen_new_kid() falls
  back to returning max (htid | 0xFFF) when both\nidr_alloc_u32() ranges are full,
  instead of reporting an error.\nu32_change() trusts that value and inserts a new
  knode with a handle\nthat is already live in the hash table, breaking handle uniqueness\n\
  within the table's node ID space.\n\nThe handle was never reserved in ht->handle_idr,
  so every later error\npath that does idr_remove(&ht->handle_idr, handle) removes
  the\nreservation of a different, live knode, which is then reused — one\nfailed
  add compounds into further duplicates.\n\nThe 4095 limit is per (table, bucket)
  — ht->handle_idr is per hash\ntable and the range is derived from htid (bucketid),
  so a table with\ndivisor 256 can legitimately hold 256*4095 knodes.\n\nThe sibling
  helper gen_new_htid() has the same silent in-band failure:\nit returns 0 when the
  tp_c handle pool (1..0x7FF) "
