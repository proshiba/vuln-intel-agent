title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  fix racy access to FDP placement id array\n\nnvme_query_fdp_info() is called per-path
  and therefore prone to races.\n\nIt populates head->nr_plids/head->plids for fdp
  registration.\nBut nothing protects that pair from concurrent access - two paths
  scanning\nthe same namespace can race to populate it.\n\nAvoid the race by moving
  this initialization work to nvme_alloc_ns_head()\nwhich is called once per shared
  namespace."
