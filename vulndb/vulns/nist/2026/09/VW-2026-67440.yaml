title: SiYuan before v3.8.4 fails to enforce publish-access checks in the 
  getCurrentAttrViewImages endpoint, allowing publish readers to retrieve image 
  asset paths from unauthorized databases. Attackers can call the endpoint with 
  an unrendered database identifier obtained through related endpoints to leak 
  detached-row image asset paths and filenames that the rendering endpoint would
  deny.
