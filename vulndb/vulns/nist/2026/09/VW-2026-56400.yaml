title: Roo-Code through 3.54.0 contains an auto-approve bypass vulnerability in 
  the shell command parsing logic that allows attackers to execute denied shell 
  commands by exploiting the omission of the bash pipe operator from the command
  parser's operator token set. Attackers can craft a command line with an 
  allowlisted prefix followed by the stderr-redirecting pipe operator and a 
  denied command, causing the parser to approve the full pipeline while bash 
  executes the denied component with the agent's auto-execute privileges on the 
  developer's machine.
