title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4/pnfs:
  key the data server cache on the NFS version\n\nnfs4_pnfs_ds_add() keys the per-net
  data server cache on the multipath\naddress set alone, and struct nfs4_pnfs_ds records
  no version. That\nsuffices for the files layout driver, which always connects with
  version\n4, but flexfiles takes its version tuple from GETDEVICEINFO per device,\n\
  and one address can legitimately serve both NFSv3 and NFSv4.\n\nTwo deviceids on
  one address with different ds_versions[0].version\ntherefore share a single nfs4_pnfs_ds,
  and whichever mirror connects\nfirst pins ds_clp to its own version. The other one
  is handed that\nclient anyway, so it selects rpc_call_ops for a version the connection\n\
  does not speak, and the mismatched sequence-slot handling dereferences\nNULL.\n\n\
