title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Preserve special fields in recycled rhtab elements\n\nrhtab_map_update_elem() initializes
  special fields after obtaining an\nelement from bpf_mem_cache_alloc(). The allocator
  can return a fresh,\nzeroed unit, or recycle one from its RCU-pending lists before
  the\nregistered destructor has run.\n\nA BPF program can retain a map-value pointer
  after deleting its element\nand initialize and arm a timer through that pointer.
  If the deleted unit\nis recycled, check_and_init_map_value() clears the only pointer
  to the\ntimer. Neither a later deletion nor rhtab_mem_dtor() can then cancel it,\n\
  and the callback can run with its key and value pointing into freed memory.\n\n\
  Do not reinitialize special fields on insertion. Fresh allocator units are\nalready
  zeroed. For recycled units, the special fields are ownership state\nthat must remain
  visible to the eventual destructor. copy_map_value()\nalready skips those fields,
