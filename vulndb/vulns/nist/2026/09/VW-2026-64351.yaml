title: "Postiz generates security-sensitive credentials using `Math.random()` instead
  of a cryptographically secure source. The same helper is used for OAuth access tokens,
  authorization codes, client secrets, organization API keys, and PKCE verifiers,
  meaning these credentials depend entirely on V8’s deterministic xorshift128+ PRNG
  state.\n\nAn unauthenticated OAuth dynamic client registration endpoint exposes
  freshly generated client credentials, giving attackers enough consecutive PRNG output
  to reconstruct that internal state. Once recovered, they can deterministically derive
  past and future values produced by the same generator, potentially compromising
  credentials belonging to other users and organizations."
