title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/mlx5:
  Properly support implicit ODP rereg_mr\n\nDue to all the child mkeys in the implicit
  ODP configuration we cannot\nchange anything in place for the parent mkey. Instead
  the whole thing\nneeds to be rebuilt if any change is requested. If the user does
  not\nspecify a translation then force the implicit values which will then fall\n\
  through the logic into mlx5_ib_reg_user_mr() to allocate a completely new\nMR.\n\
  \nSince implicit children were also touching the mr->pd, this removes\nanother case
  where the access was racy."
