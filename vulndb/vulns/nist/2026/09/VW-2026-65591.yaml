title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/userq:
  pin mqd and fw object bo to avoid eviction\n\nmqd and fw objects are queue core
  objects which should remain\nvalid and never be unmapped and evicted for user queues
  to work\nproperly.\n\nDuring eviction if these buffers are evicted the hw continue
  to\nuse the invalid addresses and caused page faults and system hung."
