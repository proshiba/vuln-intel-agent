title: FreeRDP before 3.31.0 contains a denial-of-service vulnerability in the 
  URBDRC control-transfer request path that fails to validate OutputBufferSize 
  before forwarding to the libusb backend. A malicious RDP server can send a 
  control-transfer request with OutputBufferSize set to 65536, triggering a 
  reachable assertion that terminates the client process.
