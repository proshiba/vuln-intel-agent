title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: ucs1002: fix use-after-free on remove\n\nucs1002 has no remove callback,
  so unbind runs entirely through devm.\nThe alert IRQ handler queues the health_poll
  delayed work, and the work\nreschedules itself while the chip reports a bad-health
  condition.  devm\nfrees the alert IRQ, which only synchronizes the handler; it does
  not\ncancel the delayed work, which can then run after devm frees the driver\ndata
  and dereference it.\n\nRegister health_poll with devm_delayed_work_autocancel()
  before the\nalert IRQ is requested.  devm then frees the IRQ before cancelling the\n\
  work, so the handler can no longer queue it and the work is cancelled\nbefore the
  driver data is freed.\n\nThis issue was found by an in-house static analysis tool."
