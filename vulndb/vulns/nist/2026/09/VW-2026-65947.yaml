title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  6lowpan: fix NULL dereference in lowpan_newlink\n\nTUNSETLINK allows a TUN device
  to change its link-layer type to\nARPHRD_IEEE802154 without initializing ieee802154_ptr.
  lowpan_newlink()\nchecks only the device type before dereferencing the pointer,
  so an\nRTM_NEWLINK request can trigger a NULL pointer dereference.\n\nReject devices
  without ieee802154_ptr along with devices of the wrong type."
