title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  verisilicon: rockchip: reject AV1 frames exceeding the tile capacity\n\nrockchip_vpu981_av1_dec_set_tile_info()
  indexes the tile group entry\narray by tile1 * tile_cols + tile0, reading up to
  tile_cols * tile_rows\nentries, lays out one descriptor per tile in the AV1_MAX_TILES
  tile_info\nbuffer, and programs the real tile_cols / tile_rows into the hardware.\n\
  \nThe tile group entry control is a dynamic array sized to the number of\nentries
  userspace submitted, independent of tile_cols / tile_rows, so a\nframe that claims
  more tiles than entries reads past the array. A frame\nthat claims more than AV1_MAX_TILES
  tiles also leaves the hardware\nprogrammed for more tiles than the descriptor buffer
  holds.\n\nReject both in prepare_run(): tile_cols * tile_rows must not exceed the\n\
  submitted entry count or AV1_MAX_TILES. The entry count is read via\nv4l2_ctrl_find()
  (ctrl->elems). This mirrors the bound the mediatek AV1\ndecoder alrea"
