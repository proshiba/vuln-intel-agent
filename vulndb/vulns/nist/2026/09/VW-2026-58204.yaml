title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/iucv:
  filter frames in afiucv_hs_rcv() by ingress device\n\nafiucv_hs_rcv() selects a
  socket from iucv_sk_list by matching four 8-byte\nname fields in the transport header
  alone. No check is made against the\nnet_device the frame arrived on.\n\nThis can
  cause a frame arriving on any netdev to be delivered to an AF_IUCV\nsocket. Three
  problems follow.\n\nFirst, a frame arriving over HiperSockets can be delivered to
  a socket\nbound to the classic z/VM IUCV transport, which has iucv->hs_dev == NULL.\n\
  iucv_sock_bind() takes the classic path whenever the requested userid\nmatches iucv_userid,
  even on a guest that also has a HiperSockets device\ncarrying the same identifier.
  The child socket created by\nafiucv_hs_callback_syn() for such a match inherits
  hs_dev = NULL and\ntransport = AF_IUCV_TRANS_HIPER, so the first send() on it returns
  -ENODEV.\nThe socket delivered to accept() is unusable.\n\nSecond, a frame arriving
