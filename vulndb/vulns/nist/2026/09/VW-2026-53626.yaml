title: A CSV injection vulnerability exists in SYS600. Injected malicious 
  formulas can add or modify data to the spreadsheet, insert links, exfiltrate 
  data, and in some cases, depending on how the user has their environment 
  configured, execute malicious code on the user’s machine. To exploit this 
  issue attackers would need a way to create arbitrary log messages. This could 
  be achieved through normal functionality via SCIL scripts, a log injection 
  vulnerability, or via the SYS600 broker. This vulnerability affects all 
  Windows users regardless of their privilege level who can run the Notify 
  service and export the log.
