title: Scoold is a Q&A and a knowledge sharing platform for teams. Prior to 
  1.69.0, authenticated users who are not members of a private space can create 
  content in questions belonging to that space because 
  src/main/java/com/erudika/scoold/controllers/QuestionController.java in 
  QuestionController.reply() and 
  src/main/java/com/erudika/scoold/controllers/CommentController.java in 
  CommentController.createAjax() do not apply the canAccessSpace authorization 
  check used by the question read path. With scoold.is_default_space_public set 
  to false and private spaces in use, a user with a valid session and a known or
  enumerable question identifier can send requests to POST /question/{id} and 
  POST /comment, causing replies and comments to be stored in a thread the user 
  cannot read. This permits unauthorized modification of private discussions and
  can trigger notifications that reveal the existence or metadata of private 
  activity. This issue is fixed in version 1.69.0.
