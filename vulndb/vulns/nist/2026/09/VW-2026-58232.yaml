title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  ISST: Validate socket ID in clos_assoc ioctl\n\nisst_if_clos_assoc() validates the
  user-supplied socket_id with\n'socket_id > topology_max_packages()', but isst_common.sst_inst[]
  is\nallocated with topology_max_packages() entries, so the valid index range\nis
  [0, topology_max_packages()).  The '>' comparison lets\nsocket_id == topology_max_packages()
  pass and index one entry past the\narray.\n\nIn addition, isst_common.sst_inst[socket_id]
  is NULL for an in-range\npackage that has no bound TPMI SST instance, and the pointer
  is used\nwithout a NULL check.  Both the out-of-bounds entry and the NULL pointer\n\
  are then dereferenced by map_partition_power_domain_id() and the\nfollowing power_domain_info
  access.\n\nReject socket_id >= topology_max_packages() and a NULL sst_inst, matching\n\
  the checks already performed by get_instance()."
