title: A vulnerability was found in java-json-tools jackson-coreutils 2.0. 
  Affected by this vulnerability is the function BigDecimal.toPlainString of the
  file src/main/java/com/github/fge/jackson/JacksonUtils.java. Performing a 
  manipulation results in resource consumption. The attack may be initiated 
  remotely. The exploit has been made public and could be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
