title: Snipe-IT versions before 8.7.0 contain a broken access control 
  vulnerability in AssetModelPolicy where the files() method cascades from 
  assets.files permission, allowing authenticated users to upload and delete 
  file attachments on Asset Model records without the required models.files 
  permission. Attackers with only assets.files permission can mutate shared 
  model file attachments across company boundaries and bypass the dedicated 
  models.files permission intended to restrict file management on the shared 
  Asset Model catalog.
