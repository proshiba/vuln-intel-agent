title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/syscall:
  Fix syscall skip handling for seccomp and ptrace\n\nAfter enabling GENERIC_ENTRY
  on PowerPC, syscall_enter_from_user_mode()\nreturns -1 as a sentinel to signal that
  seccomp or ptrace has intercepted\nthe syscall and already set a return value via
  syscall_set_return_value().\nsystem_call_exception() was not handling this sentinel,
  and since -1UL\nis >= NR_syscalls, the code fell into the out-of-range path and
  returned\n-ENOSYS, overwriting the errno already placed in regs->gpr[3].\n\nThe
  naive fix of checking r0 == -1L before the NR_syscalls bounds check\nis ambiguous:
  a user legitimately calling syscall(-1) also produces r0 ==\n-1L, and a tracer intercepting
  such a call would have its injected return\nvalue silently discarded.\n\nFix this
  by introducing a thread flag that is set whenever\nsyscall_set_return_value() explicitly
  updates the return value. In\nsystem_call_exception(), check and clear this flag
  before disp"
