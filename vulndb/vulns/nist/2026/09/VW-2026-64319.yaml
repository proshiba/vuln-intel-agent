title: "A time-of-check to time-of-use (TOCTOU) race condition in the dynamic loader
  (ld.so) of the GNU C Library (glibc) versions 2.14 through 2.44 allows a local attacker
  to escalate privileges. When expanding $ORIGIN in DT_RPATH for setuid/setgid (AT_SECURE)
  programs, glibc validates the lexically normalized search path against the trusted
  directories but then opens the raw, un-normalized path. On systems where the Linux
  fs.protected_hardlinks sysctl is disabled, a local attacker who hard-links such
  a program into an attacker-controlled directory and wins a race to replace an intermediate
  path component with a symbolic link can direct the loader outside the trusted directory,
  causing it to load an attacker-controlled shared object and execute arbitrary code
  with the elevated privileges of the program.\n\nExploitation requires an installed
