title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkcov:
  fix data corruption and race conditions on PREEMPT_RT\n\nsyzbot is reporting KCOV
  state corruption on PREEMPT_RT kernels, for the\ntemporary storage used for saving/restoring
  remote KCOV state is currently\nallocated as the per-CPU area.\n\nOn PREEMPT_RT
  kernels, softirq handlers run as preemptible task threads\n(e.g., ksoftirqd). If
  a softirq context preempts a task running a remote\nKCOV session, it safely saves
  the task's state into the per-CPU area.\nHowever, if that softirq thread is subsequently
  preempted by a higher-\npriority softirq thread on the same CPU, the second softirq
  will overwrite\nthe same per-CPU area, permanently destroying the original task's
  KCOV\nstate.\n\nFix this data corruption by moving the temporary storage from the
  per-CPU\narea to the per-thread area. Since each softirq thread now owns its own\n\
  task context, nested softirq preemption no longer causes data overwrites.\n\nNote
