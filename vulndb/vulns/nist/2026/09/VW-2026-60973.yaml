title: 'Vulnerability in the Oracle GraalVM for JDK, Oracle GraalVM Enterprise Edition,
  Oracle GraalVM product of Oracle Java SE (component: Compiler).   The supported
  version that is affected is Oracle GraalVM for JDK 17: 23.0.13.1; Oracle GraalVM
  for JDK 21: 23.1.12.1; Oracle GraalVM Enterprise Edition: 21.3.19.1; Oracle GraalVM:
  25.0.4.1. Difficult to exploit vulnerability allows unauthenticated attacker with
  network access via HTTP to compromise Oracle GraalVM for JDK, Oracle GraalVM Enterprise
  Edition, Oracle GraalVM.  Successful attacks of this vulnerability can result in  unauthorized
  access to critical data or complete access to all Oracle GraalVM for JDK, Oracle
  GraalVM Enterprise Edition, Oracle GraalVM accessible data as well as  unauthorized
  update, insert or delete access to some of Oracle GraalVM for JDK, Oracle GraalVM
  Enterprise Edition, Oracle GraalVM accessible data and unauthorized ability to cause
  a partial denial of service (partial DOS) of Oracle GraalVM for JDK, Oracle G'
