title: simdjson 4.6.1 contains a one-byte out-of-bounds read vulnerability in 
  dom::parser::parse_unpadded(). A specially crafted truncated JSON document 
  whose final structural token closes a nested array or object can cause 
  json_iterator::walk_document() to access buf[len] after the input buffer has 
  been exhausted. This results in a heap out-of-bounds read and may cause 
  application termination, leading to denial of service.
