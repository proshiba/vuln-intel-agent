title: A vulnerability was identified in YunaiV/zhijiantianya ruoyi-vue-pro up 
  to 2026.08. Affected is the function updateDemoOrderPaid of the file 
  yudao-module-pay/src/main/java/cn/iocoder/yudao/module/pay/controller/admin/demo/PayDemoOrderController.java
  of the component Demo-order Payment Callback Handler. The manipulation of the 
  argument ID leads to improper authorization. The attack can be initiated 
  remotely. The exploit is publicly available and might be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
