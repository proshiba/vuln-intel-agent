  This issue affects some unknown processing of the file 
  App/Home/Controller/ChapterController.class.php of the component Chapter 
  Controller. Such manipulation of the argument content leads to authorization 
  bypass. The attack may be launched remotely. The exploit has been disclosed 
  publicly and may be used. This product operates on a rolling release basis, 
  ensuring continuous delivery. Consequently, there are no version details for 
  either affected or updated releases. The project was informed of the problem 
  early through an issue report but has not responded yet.
