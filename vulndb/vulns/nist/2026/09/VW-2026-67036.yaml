title: python-utcp versions before 1.1.4 contain a server-side request forgery 
  vulnerability in HttpCommunicationProtocol.call_tool that validates the 
  initial tool URL but follows HTTP redirects without re-validating the target. 
  Attackers controlling a tool endpoint can return a 302 redirect to internal 
  services, allowing the UTCP client to reach cloud metadata endpoints or 
  internal HTTP services and return their response bodies to the caller.
