title: A security flaw has been discovered in ag-ui-protocol ag-ui 0.3.0. The 
  affected element is the function create_strands_app of the file 
  integrations/aws-strands/python/src/ag_ui_strands/utils.py of the component 
  CORSMiddleware. The manipulation results in permissive cross-domain policy 
  with untrusted domains. The attack may be launched remotely. The attack 
  requires a high level of complexity. The exploitability is described as 
  difficult. Upgrading to version AGUI.Abstractions@0.0.6 is sufficient to fix 
  this issue. The patch is identified as 
  9b143b9668fa52c2054ede9d34a45ac4b4401089. It is suggested to upgrade the 
  affected component.
