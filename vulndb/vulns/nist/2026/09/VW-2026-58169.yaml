title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  mts64: Check card index validity at probe\n\nAlthough mts64 driver has a check of
  the given devptr->id value, it\ndoesn't check for a negative id, which is often
  given as \"none\" or\nsuch value when bound via sysfs.  This may lead to OOB access
  for\nindex[] and other parameters.\n\nAdd a sanity check for the card index and
  warn/correct it if it's a\nvalue out of the range."
