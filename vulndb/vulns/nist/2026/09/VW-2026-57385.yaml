title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.9.6 until 0.11.1, SafePlaywrightURLLoader in 
  backend/open_webui/retrieval/web/utils.py validated a user-controlled hostname
  in Python and then let the Playwright browser resolve it again in the sync and
  async request interceptors. An authenticated user controlling authoritative 
  DNS could return a public address to validation and an internal address to the
  browser, exposing responses from internal services or cloud metadata through 
  web search or URL ingestion. This issue is fixed in version 0.11.1.
