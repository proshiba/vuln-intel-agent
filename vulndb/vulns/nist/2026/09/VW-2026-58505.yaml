title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFS/localio:
  fix ref leak on nfs_uuid_add_file failure\n\nWhen nfs_uuid_add_file() races with
  nfs_uuid_put() tearing down\nuuid->net, it returns -ENXIO without publishing nfl->nfs_uuid
  via\nrcu_assign_pointer().  nfs_open_local_fh() then enters its error\nbranch and
  only releases the slot's file ref and its paired net\nref plus its own entry-time
  net ref, while the close path is a\nno-op:\n\n    nfs_close_local_fh()\n      nfs_uuid
  = rcu_dereference(nfl->nfs_uuid);\n      if (!nfs_uuid) { rcu_read_unlock(); return;
  }  /* always */\n\nnfsd_open_local_fh() returns localio holding a caller-owned +1\n\
  nfsd_file reference (from nfsd_file_get() after\nnfsd_file_acquire_local()) and
  an entry-time nfsd_net reference\n(from its first nfsd_net_try_get()) embedded as
  nf->nf_net.  Both\nare leaked on the failure path, pinning one nfsd_file (and the\n\
  underlying struct file, dentry, inode) and one nfsd_net_ref per\noccurrence, which
