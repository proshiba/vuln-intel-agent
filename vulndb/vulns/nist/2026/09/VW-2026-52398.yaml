title: A weakness has been identified in ShopEx ECShop up to 2.5.1. This affects
  the function check_img_type of the file admin/pack.php. Executing a 
  manipulation of the argument pack_img can lead to unrestricted upload. It is 
  possible to launch the attack remotely. The exploit has been made available to
  the public and could be used for attacks. The vendor was contacted early about
  this disclosure but did not respond in any way.
