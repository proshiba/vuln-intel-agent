title: A security flaw has been discovered in Qualitor up to 8.20.104/8.24.97. 
  Affected by this vulnerability is the function eval of the file 
  /html/st/stdeslocamento/request/getResumo.php. Performing a manipulation of 
  the argument passageiros results in code injection. Remote exploitation of the
  attack is possible. The exploit has been released to the public and may be 
  used for attacks. Upgrading to version 8.20.105 and 8.24.98 addresses this 
  issue. Upgrading the affected component is advised.
