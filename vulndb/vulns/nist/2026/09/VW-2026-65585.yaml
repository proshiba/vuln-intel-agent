title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: don't call ieee80211_handle_reconfig_failure when not needed\n\nIn case
  reconfiguration of NAN fails, we call\nieee80211_handle_reconfig_failure, that marks
  all interfaces as not in\nthe driver.\nThen, at the error path of the reconfig,
  cfg80211_shutdown_all_interfaces\nis called to destroy all the interfaces.\n\nIf
  we have any other interface but the NAN one, for example a BSS\nstation, then when
  its state (links, stations) will be removed, we\nwon't tell the driver about this,
  because we will think that the\ninterfaces are not in the driver, and then drivers
  might remain with\ndangling pointers to objects like stations and links (at least
  for\niwlwifi this is the case).\n\nieee80211_handle_reconfig_failure is meant to
  be called after we cleaned\nup the state in the driver, there is no reason to call
  it for NAN\nreconfiguration failure.\n\nFix the code to just warn in such a case,
  as we do in other error paths\nin reconf"
