title: A vulnerability was detected in Excalidraw up to 0.18.1. The impacted 
  element is an unknown function of the file packages/excalidraw/data/restore.ts
  of the component Imported File Handler. Performing a manipulation of the 
  argument customData.generationData.html results in cross site scripting. The 
  attack is possible to be carried out remotely. The exploit is now public and 
  may be used. The vendor was contacted early about this disclosure but did not 
  respond in any way.
