title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  clear tcon after cifsFileInfo_put() in cifs_file_set_size()\n\nWhen the else branch
  of cifs_file_set_size() finds a writable file handle\nvia find_writable_file(),
  it borrows tcon and server from the handle's\ntlink, attempts the handle-based set_file_size()
  RPC, and then releases\nthe handle with cifsFileInfo_put().\n\nIf set_file_size()
  fails, execution falls through to the path-based\nfallback, which reuses the borrowed
  tcon and server under the\n\"if (tcon == NULL)\" guard.  Since tcon is not NULL
  at that point, the\nguard is skipped.  If cifsFileInfo_put() dropped the last reference
  on a\ntlink that was already removed from the tlink tree (TCON_LINK_IN_TREE\ncleared,
  as happens during reconnection or session teardown),\ncifs_put_tlink() will have
  freed tcon; the subsequent set_path_size()\ncall is then a use-after-free.\n\nSetting
  tcon = NULL after cifsFileInfo_put() causes the existing guard\nto take the cifs_sb_tlink()
  path"
