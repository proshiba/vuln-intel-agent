title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  validate dirty page table on log replay\n\nEach DIR_PAGE_ENTRY ends in a page_lcns[]
  array whose length is the on-disk\nlcns_follow field. check_rstbl() validates the
  table bookkeeping but never\nchecks that this array fits in the entry, so a crafted
  lcns_follow lets the\nv0->v1 conversion memmove and later replay passes run off
  the entry.\n\nAdd check_dp_table() to reject, right after check_rstbl(), any entry
  larger\nthan its size claims via struct_size() (the same expression used to allocate\n\
  these entries, so the check is overflow-safe by construction). All consumers\ncan
  then trust lcns_follow as the real capacity. This covers every\npage_lcns[] access
  whose index is bounded by the entry itself (the\nconversion memmove, the HotFix
  store via find_dp(), and the self-bounded\nscan loops). Accesses whose index comes
  from the log record need a separate\nbound and are handled in a follow-up patch."
