title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Fix null pointer dereference in devcoredump cleanup\n\nIn xe_devcoredump_snapshot_free(),
  ss->gt may be NULL when the snapshot\nwas never fully populated (e.g., when cleanup
  is triggered without a\nprior capture). Guard the xe_guc_capture_put_matched_nodes()
  call with\nIS_ERR_OR_NULL() to prevent a null dereference.\n\nIn xe_devcoredump_free(),
  the deferred work is only queued when a\ncoredump is captured, so guard cancel_work_sync()
  with a check on\ncoredump->captured."
