title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/mmu: Check write tracking in all address spaces\n\nkvm_gfn_is_write_tracked()
  checks only the supplied memslot, but page\ntracking is per-address-space and shadow
  pages are shared across all\naddress spaces.  With SMM, a GFN can therefore be write-tracked
  in one\naddress space and appear untracked through the other.\n\nCheck the supplied
  slot first, then the slot for the other address space.\nThis ensures all callers
  honor write tracking regardless of the active\naddress space.  In particular, it
  prevents mmu_try_to_unsync_pages() from\nmarking an upper-level shadow page unsync
  and eventually triggering the\nBUG in pte_list_remove().\n\n[invert direction of
  the conditional. - Paolo]"
