title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  run deferred work on a module-owned workqueue\n\novpn queues several work items
  whose callbacks execute module text.\nThese works currently run on the global system
  workqueues, so module\nexit has no driver-owned drain point that guarantees the
  callbacks have\nfully returned before the module text can be freed.\n\nObject references
  protect the objects used by the callbacks, but they do\nnot prove that a workqueue
  function has returned. In particular, a\nworker can drop the final reference that
  unblocks device teardown while\nit is still executing ovpn code.\n\nAdd a module-owned
  workqueue and queue all ovpn work items on it. During\nmodule exit, unregister rtnl
  and netlink first, flush the workqueue so\nordinary ovpn workers finish, run the
  final RCU barrier, and destroy the\nworkqueue last. This keeps the workqueue available
  for cleanup work\nqueued from RCU callbacks, while ensuring no ovpn work item can
  outlive\nthe module te"
