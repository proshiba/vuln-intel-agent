title: Apache NiFi 2.11.0 supports migrating the contents of a 
  version-controlled Process Group into a Connector using REST API methods that 
  list eligible migration sources and submit migration requests. The framework 
  authorized both methods against the target Connector alone, without evaluating
  access to the Process Groups involved. The absence of Process Group 
  authorization allowed an authenticated user with read access to a Connector to
  enumerate the identifiers, names, and flow registry details of 
  version-controlled Process Groups outside the scope of granted read policies. 
  It also allowed a user with write access to a Connector to migrate a Process 
  Group without write access to that Process Group, copying the flow definition,
  referenced assets, and component state into the Connector, and leaving the 
  source Process Group disabled and renamed. Migration excludes sensitive 
