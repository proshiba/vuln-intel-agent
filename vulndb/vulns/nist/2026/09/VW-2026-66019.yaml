title: "In the Linux kernel, the following vulnerability has been resolved:\n\nconfigfs:
  unhash the dentry before dropping the item in rmdir\n\nconfigfs_get_config_item()
  treats a hashed dentry as proof that\nsd->s_element is a live config_item.  configfs_rmdir()
  breaks that:\nsimple_rmdir() leaves the dentry hashed, the last reference to the
  item is\ndropped right after, and the dentry is only unhashed by d_delete() once\n\
  ->rmdir() has returned.  configfs_symlink() resolves its target holding no\nlock
  on it, so get_target() can land in that window:\n\n  BUG: KASAN: slab-use-after-free
  in config_item_get+0x26/0x90\n   get_target fs/configfs/symlink.c:128 [inline]\n\
  \   configfs_symlink+0x4ab/0x1030 fs/configfs/symlink.c:185\n\nUnhash in configfs_remove_dir(),
  while the item is still guaranteed to be\nthere.  A reference obtained just before
  that stays harmless, as\ncreate_link() rechecks CONFIGFS_USET_DROPPING, already
  set by\nconfigfs_detach_prep().  Both configfs_unregister_subsystem() paths\nd_drop()
