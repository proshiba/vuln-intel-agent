title: The Tauri HTTP plugin validates requested URLs against the application's 
  configured scope allowlist only once, on the initial request. When the remote 
  server responds with an HTTP 3xx redirect, reqwest follows the redirect 
  internally without re-checking the new target URL against the scope. This 
  allows an attacker who controls an allowed URL (or finds an open redirect on 
  an allowed host) to reach disallowed destinations such as cloud metadata 
  endpoints, localhost services, or internal network hosts.
