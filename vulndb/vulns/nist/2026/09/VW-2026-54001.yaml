title: phpMyFAQ before 4.1.8 contains an authorization bypass vulnerability in 
  the question creation endpoint where the isAddingQuestionsAllowed() method 
  grants access to all callers when main.enableAskQuestions is enabled, ignoring
  the records.allowQuestionsForGuests setting. Unauthenticated attackers can 
  submit questions via the question/create API endpoint to bypass guest 
  submission restrictions and inject spam into the admin moderation queue.
