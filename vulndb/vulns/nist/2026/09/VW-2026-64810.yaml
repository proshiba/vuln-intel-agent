title: "Allocation of resources without limits or throttling vulnerability in Apache
  Tomcat allows an unauthenticated AJP request to pin an AJP processing thread leading
  to denial of service.\n\n\n\nThis issue affects Apache Tomcat: from 11.0.0-M1 through
  11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M1 through 9.0.121.\n\n\n\n\
  The following versions were EOL at the time the CVE was created but are known to
  be affected: from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109. Other unsupported
  versions may also be affected.\n\n\n\nUsers are recommended to upgrade to version
  11.0.26, 10.1.60 or 9.0.122, which fix the issue."
