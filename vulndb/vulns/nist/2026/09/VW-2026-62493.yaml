  mt76: fix handling channel context with different bands in mt76_switch_vif_chanctx()\n\
  \nWhen performing channel switches on different radios within a short\ntimeframe,
  channel contexts with different bands can be carried for\neach struct ieee80211_vif_chanctx_switch.\n\
