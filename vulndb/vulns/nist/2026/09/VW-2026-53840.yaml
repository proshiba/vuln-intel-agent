  of\nTP-Link Archer AX55 v4. When Mesh mode is enabled, a LAN attacker may submit\n\
  crafted input that causes the easymesh daemon to crash and may potentially\nachieve
  remote code execution on the device.\n\n\n\n\n\nSuccessful\nexploitation may cause
  the EasyMesh daemon to crash and may potentially allow\nremote code execution when
  Mesh mode is enabled. This\nmay result in high impact to the confidentiality, integrity,
  and availability\nof the affected device."
