title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the 
  confluence_upload_attachment and confluence_upload_attachments tools pass a 
  client-controlled file_path through 
  src/mcp_atlassian/confluence/attachments.py upload_attachment, and the 
  jira_update_issue attachments parameter reaches 
  src/mcp_atlassian/jira/attachments.py upload_attachment, without confining 
  either path to an approved server workspace. In a remote HTTP, SSE, or 
  multi-user deployment, absolute or traversing paths are resolved on the MCP 
  server and uploaded to Atlassian, allowing a client with write-tool access to 
  disclose server files, environment-held Atlassian credentials, or another 
  tenant's data. A local single-user stdio deployment does not cross this trust 
  boundary because the server runs in the caller's environment. This issue is 
  fixed in version 0.22.0.
