title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm/dsi:
  Drop dev_pm_opp_set_rate(0)\n\ndev_pm_opp_set_rate(0) removes the vote specified
  in required-opps but\ndoes not actually park the clock, making it run without the
  necessary\npower backing. Drop the explicit call to it.\n\nEvery call site of ops->link_clk_disable()
  is followed by\npm_runtime_put(), so the power vote will be rescinded if deemed
  safe.\n\nPatchwork: https://patchwork.freedesktop.org/patch/742783/"
