title: PJSIP is a free and open source multimedia communication library written 
  in C. Prior to commit 8d5956a, a heap buffer overflow exists in the PJLIB-UTIL
  HTTP client (http_client.c) when buffering an HTTP response body. This affects
  applications that use the PJLIB-UTIL HTTP client to receive a whole response 
  body at once (a completion callback with no incremental on_data_read 
  callback). When growing the response buffer, an incorrect size calculation 
  based on the server-supplied Content-Length can leave the buffer too small, 
  causing response data to be written past the end of the allocation. A 
  malicious or man-in-the-middle HTTP server can trigger this with a crafted 
  response; impact may range from unexpected application termination to memory 
  corruption. Applications that consume the response incrementally (via 
  on_data_read), or that only connect to trusted servers, are not affected. This
  issue has been patched via commit 8d5956a.
