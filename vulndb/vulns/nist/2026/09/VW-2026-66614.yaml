title: 'ClawHub (openclaw/clawhub) contains an incorrect authorization vulnerability
  in the ClawHub application/backend: an organization-owned skill retains the ownerUserId
  of its original publisher, and transfer and lifecycle authorization checks trust
  that historical user before requiring current organization privileges. An authenticated
  user who originally published an organization skill can therefore transfer, delete,
  or restore that skill — taking control of its trusted name and history — even after
  their organization privileges have been revoked or downgraded. The issue was confirmed
  at revision cbfee7343ddc867316dd9b3de6fa8856730f9f41; the complete historical affected
  range was not established. It is fixed by PR #3680, included in revision 8c2de6c506bb4efabe3f0c2ffb8370b9e23d4650,
  which was deployed to clawhub.ai on 2026-09-11; self-hosted deployments should update
  to that revision or a later descendant. The npm CLI and OpenClaw runtime are separate
  products and are not affected.'
