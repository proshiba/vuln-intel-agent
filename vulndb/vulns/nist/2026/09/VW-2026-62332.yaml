title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: Don't leak the extension cell pointer in the bounce payload\n\nThe bounce_error_event()
  embeds the failed event in the bounce payload\nby pointing data.ext.ptr at it. \
  \ When that event is a queued\nvariable-length event, its own data.ext.ptr holds
  the address of its\nfirst extension cell, put there by snd_seq_event_dup().  The
  payload\ngoes out verbatim through snd_seq_expand_var_event(), so the address\n\
  reaches userspace.\n\nThat is the same address commit 705dd6dcbc0e (\"ALSA: seq:
  Clear\nvariable event pointer on read\") removed from the event header.  The\nread
  path still clears it there, just above the call that expands the\npayload.\n\nEmbed
  a sanitised copy instead, treated exactly as snd_seq_read()\ntreats the header.\
  \  A stack copy is enough because delivery is\nsynchronous and snd_seq_event_dup()
