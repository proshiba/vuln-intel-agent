title: The zipMoney(Zip Co) Payments Plugin for WooCommerce WordPress plugin 
  before 2.4.0 does not perform any authorisation checks on one of its front-end
  request handlers, and does not restrict which option name a caller may supply,
  allowing unauthenticated users to delete arbitrary WordPress options. This can
  be used to destroy site and access control configuration, deactivate every 
  installed zipMoney(Zip Co) Payments Plugin for WooCommerce WordPress plugin 
  before 2.4.0, and take the site offline.
