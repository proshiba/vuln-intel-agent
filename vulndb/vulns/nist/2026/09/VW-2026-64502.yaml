title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the plaintext OAuth fallback 
  file containing refresh and access tokens is written with permissions 
  inherited from the process umask. Under common or permissive configurations, 
  other local users can read the backup and retain Atlassian access through the 
  refresh token. The advisory traces the vulnerable input and processing flow 
  through OAuthConfig._save_tokens_to_file, refresh_token, access_token, and 
  umask, which identify the affected entry points, controls, and code paths. 
  This issue is fixed in version 0.22.0.
