title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/kexec_file:
  Prevent kexec range truncation\n\nSashiko AI review pointed out the following issue.\n\
  \nThe __merge_memory_ranges() function incorrectly handles overlapping\nmemory ranges
  when merging them. Although sort_memory_ranges() sorts all\nranges by their start
  address in ascending order beforehand, the merge\nlogic remains defective in two
  ways:\n\n1. It compares the current range's start against the previous element (i-1)\n\
  \   instead of the running target index (idx)\n\n2. It unconditionally overwrites
  'ranges[idx].end' with 'ranges[i].end'.\n\nThis logic flaw leads to critical memory
  truncation when a larger memory\nrange completely subsumes subsequent smaller ranges.\n\
  \nFor example, consider a sorted input array with three ranges:\n  Range A (idx=0):
  [0x1000 - 0x9000]\n  Range B (i=1):   [0x2000 - 0x5000] (completely inside Range
  A)\n  Range C (i=2):   [0x6000 - 0x8000] (completely inside Range A)\n\n1. When
  i=1 (Range B):\n"
