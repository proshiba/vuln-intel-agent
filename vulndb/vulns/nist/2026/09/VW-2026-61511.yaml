title: RabbitMQ amqp091-go is a Go AMQP 0.9.1 client. Prior to 1.13.0, 
  Channel.recvContent in channel.go preallocates the message body slice with the
  uint64 ch.header.Size value supplied by an AMQP content header without capping
  the allocation to the negotiated Connection.Config.FrameSize value. A 
  malicious or compromised broker can send an extreme declared body size and 
  cause the Go runtime to attempt a correspondingly large allocation before body
  data is received. The allocation can exhaust memory and terminate the client 
  process. This issue is fixed in version 1.13.0.
