title: The TikTok WordPress plugin before 1.4.2 does not check that a request is
  authorised before acting on a sign-in code supplied in the URL, so any visitor
  can make the site redeem a code of their choosing against the advertising 
  platform, using the site's own credentials. It matches that code loosely, so 
  URLs that merely resemble the expected one trigger it too, and the callback 
  runs on every request to the site rather than only on the administrator's 
  sign-in.
