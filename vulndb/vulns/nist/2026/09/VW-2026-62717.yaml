title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  rk3288 - fail ahash requests on HASH idle timeout\n\nrk_hash_run() waits for RK_CRYPTO_HASH_STS
  to become idle after the\nfinal DMA transfer, but ignores the poll result. If the
  hash engine\nnever becomes idle, the driver still reads the digest registers and\n\
  finalizes the request with the previous success value.\n\nStore the poll result
  and finalize the request with the timeout error\nbefore reading the digest registers."
