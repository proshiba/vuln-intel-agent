title: pypdf is a free and open-source pure-python PDF library. Prior to 6.16.1,
  an attacker can craft a PDF that causes pypdf/_doc_common.py _get_outline to 
  consume long runtimes and large amounts of memory when retrieving document 
  outlines with large numbers of entries or deeply nested reused paths because 
  the traversal lacked global entry-count and nesting-depth limits. This issue 
  is fixed in version 6.16.1.
