title: Chartbrew is an open-source web application that can connect directly to 
  databases and APIs and use the data to create charts. Prior to 5.2.3, 
  Chartbrew's ClickHouse protocol in 
  server/sources/plugins/clickhouse/clickhouse.protocol.js calls 
  applySqlVariables() from server/sources/shared/sql/sql.variables.js without 
  enabling the escapeBackslash option. For a ClickHouse-backed chart with 
  variable binding, an attacker can supply a backslash before a quote so quote 
  doubling does not keep the value within its intended SQL string literal. 
  Public dashboards can expose this path without authentication, and successful 
  exploitation can execute arbitrary ClickHouse SQL to disclose data or, when 
  the database configuration permits, access files or internal network 
  resources. This issue is fixed in version 5.2.3.
