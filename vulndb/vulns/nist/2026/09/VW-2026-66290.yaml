title: InvoicePlane is a self-hosted open source application for managing 
  invoices, clients, and payments. Prior to 1.7.2-rc-1, InvoicePlane builds its 
  permitted template list by scanning a PHP template directory that can be 
  written through an administrator-controlled file-write capability. A malicious
  PHP file placed in the directory is automatically trusted by Mdl_templates and
  can be selected as public_invoice_template. When a public invoice is rendered,
  the guest View controller includes the trusted file and executes it with 
  web-server privileges. This issue is fixed in version 1.7.2-rc-1.
