title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-stats:
  fix a crash if allocation of per-cpu data fails\n\nIf \"dm_kvzalloc(percpu_alloc_size,
  cpu_to_node(cpu))\" fails, the code\njumps to the \"out\" label and calls dm_stat_free.
  dm_stat_free does\n\"for_each_possible_cpu(cpu) { dm_kvfree(s->stat_percpu[cpu][0].histogram,\n\
  s->histogram_alloc_size);\", which crashes with NULL pointer dereference\nif s->stat_percpu[cpu]
  is NULL.\n\nThis commit fixes the bug by testing s->stat_percpu[cpu] for NULL before\n\
  using it."
