title: A weakness has been identified in ZhongBangKeJi CRMEB up to 6.0.0. 
  Affected by this vulnerability is the function eval of the file 
  /adminapi/system/crontab/save of the component Custom Scheduled Task Feature. 
  This manipulation of the argument customCode causes os command injection. It 
  is possible to initiate the attack remotely. The exploit has been made 
  available to the public and could be used for attacks. Vendor documents this 
  as deliberate debug-only behavior. But isSafePhpCode blacklist offers no real 
  RCE containment.
