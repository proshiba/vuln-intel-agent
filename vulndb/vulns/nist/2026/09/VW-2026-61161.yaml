title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/pagemap:
  Fix folio allocation fallback and use-after-put\n\ndrm_pagemap_migrate_populate_ram_pfn()
  had two issues when populating\nRAM PFNs with higher-order folios:\n\n1. The higher-order
  vma_alloc_folio()/folio_alloc() calls did not pass\n   __GFP_NOWARN, so a THP allocation
  failure under memory pressure\n   would spam the kernel log, and there was no fallback
  path despite a\n   TODO comment stating one was needed. Add __GFP_NOWARN to the\n\
  \   higher-order allocation and, on failure, fall back to order-0\n   allocations
  for the entire range originally covered by the failed\n   higher-order allocation,
  leaving MIGRATE_PFN_COMPOUND unset for\n   those PFNs.\n\n2. In the free_pages error
  path, order was computed via\n   folio_order(page_folio(page)) *after* put_page(page)
  had already\n   dropped the reference, resulting in a use-after-free/put when that\n\
