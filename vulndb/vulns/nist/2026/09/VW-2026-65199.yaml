title: The Post Grid  WordPress plugin before 7.9.5 does not limit an expansion 
  of the WordPress allowed-HTML list to its own markup and applies it site-wide,
  allowing users with the Contributor role and above to store iframe, style and 
  input elements that are normally stripped from their content, leading to HTML 
  injection (phishing frames, CSS defacement and spoofed input forms) that 
  renders to any visitor and to administrators reviewing the content.
