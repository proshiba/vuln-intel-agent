title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpaa2-switch:
  rework FDB management on the bridge leave path\n\nOn bridge leave, the dpaa2_switch_port_set_fdb()
  function always\nallocates a new FDB for the port which is becoming standalone.
  In case\nno FDB is found, then the port leaving a bridge will continue to use the\n\
  current one.\n\nThe above logic does not cover the case in which there are multiple\n\
  bridges which have ports from the same DPSW instance. In this case, when\nthe last
  port leaves bridge #1, it finds an unused FDB to switch to, but\nthe old FDB is
  not marked as unused. Since the number of FDBs is equal\nto the number of DPSW interfaces,
  this will eventually lead to multiple\nports sharing the same FDB.\n\nFix this by
  changing how we are managing the FDBs on the leave path.\nInstead of directly allocating
  a new FDB, first verify if the current\nport is the last one to leave a bridge.
