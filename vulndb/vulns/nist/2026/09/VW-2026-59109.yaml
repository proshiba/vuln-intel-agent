title: "Description\n\nA topology's `topology.blobstore.map` lets the submitter choose
  a local name for each blob that the\nsupervisor localises. That name was used to
  build a path under the topology's working directory without\nnormalisation, in both
  `AsyncLocalizer` and `Container.createBlobstoreLinks`, and the symlink helper\n\
  force-deletes whatever already exists at the target before creating the link.\n\n\
  A submitter could therefore use `../` segments to direct that delete-and-symlink
  operation at an arbitrary\npath, as the supervisor user, on every node the topology
  is scheduled onto. The consequences include\nrecursive deletion of supervisor-owned
  content and planting a symlink that causes a subsequent worker\nlaunch to execute
  attacker-chosen code as another tenant's operating-system user, which defeats the\n\
  isolation that `supervisor.run.worker.as.user` is intended to provide.\n\nMitigation\n\
  \nUpgrade to 3.1.0, where the resolved target must lie inside the expected root
