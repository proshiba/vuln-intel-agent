title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix ALIGN() overflow in symlink_data() error context loop\n\nThe check added
  by commit 7d9a7f1f96cd (\"smb/client: fix possible\ninfinite loop and oob read in
  symlink_data()\") compared the post-ALIGN\nlength against the remaining buffer,
  but ALIGN() itself can overflow:\nfor ErrorDataLength near UINT32_MAX (e.g. 0xFFFFFFF9),
  ALIGN(x, 8)\nwraps to 0, so the subsequent bounds check passes, and the loop\nadvances
  by zero bytes leaving 'p' pointing into stale data.\n\nFix by checking the raw ErrorDataLength
  against the remaining space\nbefore applying ALIGN(), then checking again after.\
  \  Since raw_len is\nbounded by the buffer, raw_len + 7 cannot overflow, so the
  second check\nis an exact post-alignment bounds guard."
