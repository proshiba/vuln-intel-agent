title: Gladys Assistant before 5.1.0 contains a password reset link poisoning 
  vulnerability that allows unauthenticated remote attackers to obtain valid 
  password reset tokens for any account by exploiting the client-supplied origin
  parameter in the forgot_password endpoint without server-side validation. 
  Attackers can send a crafted request specifying an attacker-controlled origin,
  causing the victim to receive a poisoned reset link that discloses the session
  token to the attacker, enabling full account takeover including administrator 
  accounts.
