title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  core: hcd: fix possible deadlock in rh control transfers\n\n>From within the SCSI
  error handler memory allocations must not\ntrigger IO. Handling errors in UAS and
  the storage driver may\ninvolve resetting a device. The thread doing the reset itself\n\
  relies on VM magic. However, that is insufficient, as resetting\na device involves
  resuming it. Resumption as well as resetting\ninvolves conrol transfers to the parent
  of the device to be reset.\nThat may be a root hub. Hence usbcore must heed the
  flags passed\nto usb_submit_urb() processing control transfers to root hubs.\n\n\
  The problem exist since the storage driver has been merged."
