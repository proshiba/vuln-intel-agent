title: Open edX Platform enables the authoring and delivery of online learning 
  at any scale. Prior to commit 59bb6d6, the view function 
  set_course_mode_price() at 
  lms/djangoapps/instructor/views/instructor_dashboard.py:430 is decorated only 
  with @login_required and performs no course-level permission check. Any 
  authenticated user — including a learner account with zero course roles — can 
  issue a single POST request to overwrite the honor mode price and currency of 
  any course on the platform. The companion frontend modal was removed in a 
  prior cleanup, but the URL route and view remain live, making this an 
  unguarded orphan endpoint. This issue has been patched via commit 59bb6d6.
