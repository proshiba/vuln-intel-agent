title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  fq: add overflow bounds to quantum and initial quantum\n\nfq_init() computes quantum
  = 2 * psched_mtu() and initial_quantum = 10 *\npsched_mtu() with no overflow check.
  A device with a huge MTU (e.g. dummy\nwith max_mtu == 0 accepting MTU 2147483634)
  makes psched_mtu() return\n0x80000000; the 2 * and 10 * multiplications wrap to
  0 in 32-bit\narithmetic, so q->quantum == 0. Then in fq_dequeue() the credit-refill\n\
  loop adds 0 to f->credit (which stays <= 0) and goto begin loops\nforever under
  the qdisc lock, creating a soft lockup.\n\nClamp psched_mtu() to [1, 1 << 20] before
  multiplying so the product\ncannot wrap, then cap the result at 1 << 20, matching
  the bound already\nenforced on TCA_FQ_QUANTUM in fq_change().\n\nConditions to recreate
  the bug: a device whose MTU (plus\nhard_header_len) is large enough that 2 * psched_mtu()
  wraps (e.g. a\ndummy device with max_mtu == 0 accepting MTU 2147483634). Requires\n\
  CAP_NET_ADMIN"
