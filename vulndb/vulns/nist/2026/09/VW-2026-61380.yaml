title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: midi2: Fix null-pointer dereference in f_midi2_free_ep_reqs\n\nA null-pointer
  dereference occurs in f_midi2_free_ep_reqs() when attempting\nto clean up an endpoint
  that was never initialized.\n\nWhen configuring the MIDI 2.0 gadget via configfs
  and setting the block\ndirection to SNDRV_UMP_DIR_INPUT, the initialization of the
  midi1_ep_out\nendpoint is explicitly skipped during the gadget bind phase\n(f_midi2_bind()).
  As a result, the usb_ep->card field remains NULL.\n\nLater, when the host sets the
  alternate setting, f_midi2_set_alt()\nunconditionally stops both the IN and OUT
  endpoints by calling\nf_midi2_stop_eps(), which in turn calls f_midi2_free_ep_reqs()
  for both\nendpoints. When f_midi2_free_ep_reqs() is called for the uninitialized\n\
  midi1_ep_out, it attempts to dereference usb_ep->card to determine the\nnumber of
  requests to free, leading to a crash.\n\nFix this by using usb_ep->num_reqs instead
  of usb_ep->card->i"
