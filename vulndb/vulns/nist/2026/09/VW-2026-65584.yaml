title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  Don't sleep inside rds_ib_conn_path_shutdown\n\nNew rds rdma self tests exposed
  a hang when tearing down\nthe ib network configs.  This is caused by the shutdown
  worker\nthread sleeping on the wait_event call, which blocks other work\nitems in
  the queue. Fix this by changing wait_event to\nwait_event timeout, and looping until
  the wait check succeeds."
