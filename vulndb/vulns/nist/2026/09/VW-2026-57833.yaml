title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Starting in version 8.0.0 and 
  prior to version 8.0.5, a Lua rule that registers too many flow variables can 
  corrupt Lua detection state and may bypass Suricata's restricted Lua sandbox. 
  This requires an affected Lua script/rule to be loaded. Excessive flow 
  variables being registered may also cause Suricata to crash. Version 8.0.5 
  contains a fix. As a workaround, disable `security.lua.allow-rules` unless Lua
  rules are required.
