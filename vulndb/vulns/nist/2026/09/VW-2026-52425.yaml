title: "Generation of Error Message Containing Sensitive Information vulnerability
  in ash-project ash_typescript allows an unauthenticated attacker to read internal
  application data from an HTTP 500 response body.\n\nWhen a typed-controller route
  handler returns anything other than a %Plug.Conn{}, dispatch/3 in lib/ash_typescript/typed_controller/request_handler.ex
  passes the value to unexpected_return/2, which interpolates inspect(value, limit:
  50) directly into the response message. The limit option bounds elements per collection
  rather than the term as a whole, so a handler falling through with a term such as
  {:error, %User{}} or a changeset serialises its full field set, including hashed
  passwords, tokens, and tenant identifiers, into the JSON error returned to the caller.\n\
