title: Frigate is an open source network video recorder. Prior to 0.17.2, the 
  WebSocket handler in frigate/comms/ws.py forwards attacker-selected message 
  topics to the dispatcher without checking the authenticated user's role 
  because the nginx authentication subrequest does not provide role-aware 
  authorization to the handler. Any authenticated viewer can send admin-only 
  topics such as restart, notifications/set, and camera detection, recording, 
  snapshot, audio, motion, and enablement settings, causing service restarts or 
  disabling security monitoring functions. Authentication must be enabled and 
  valid viewer credentials are required. This issue is fixed in version 0.17.2.
