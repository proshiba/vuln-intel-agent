title: "A weakness has been identified in piskvorky gensim up to 4.4.0. The impacted
  element is the function Load of the file gensim/utils.py of the component Model
  Loader. This manipulation of the argument fname causes deserialization. It is possible
  to initiate the attack remotely. The exploit has been made available to the public
  and could be used for attacks. Maintainer closed #3663 same-day with no comment,
  PR, or fix; repo's last push (2025-11-01) predates the report, so the unsafe pickle.load
  in SaveLoad.load remains unguarded at develop HEAD."
