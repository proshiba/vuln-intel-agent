title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvdpa/mlx5:
  fix wrong list iterated in add_direct_chain error path\n\nIn add_direct_chain(),
  newly allocated direct MR entries are added to\nthe local list 'tmp', which is spliced
  into mr->head only on success.\nOn the error path, the cleanup loop was incorrectly
  iterating over\nmr->head instead of tmp.\n\nFix by iterating over 'tmp' in the err_alloc
  cleanup path."
