title: github.com/temporalio/tchannel-go did not reject TChannel call fragments 
  containing checksum metadata but no length-prefixed argument chunks. The 
  fragment reader left its chunk slice empty and then unconditionally selected 
  the first element. A network peer can supply such a malformed call fragment, 
  including as a direct initial call request after completing the standard 
  initialization handshake. On that inbound path, the resulting unrecovered Go 
  slice-bounds panic occurs on a library-created dispatch goroutine and 
  terminates the hosting process. This allows remote denial of service against 
  applications that expose the listener to untrusted peers. The impact is 
  limited to availability; no confidentiality or integrity impact was 
  identified.
