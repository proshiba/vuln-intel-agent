  gf_sg_vrml_field_clone() function of GPAC 2d7da22e (26.08-DEV). The 
  vulnerability occurs when cloning a PROTO default SFImage field with a NULL 
  source pointer. An attacker can provide a specially crafted input file that 
  triggers the condition, resulting in application crash and denial of service.
