title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: fix race l2cap_sock_cleanup_listen() vs. put_chan\n\nFor L2CAP sockets without
  owning sk->sk_socket, reading\nl2cap_pi(sk)->chan may race against concurrent l2cap_sock_kill()
  ->\nl2cap_sock_put_chan().  This excludes simultaneous proto_ops callbacks,\nbut
  access in l2cap_sock_cleanup_listen() has unsafe lockless read.\n\n [Task 1]   \
  \                      [Task 2 (hdev->workqueue)]\n l2cap_sock_release(parent) \
  \      l2cap_disconn_cfm\n   l2cap_sock_cleanup_listen        l2cap_conn_del\n \
  \    bt_accept_dequeue                l2cap_chan_del\n       lock_sock(sk)     \
  \               l2cap_sock_teardown_cb\n       bt_accept_unlink\n         bt_sk(sk)->parent
  = NULL\n       release_sock(sk) ----------------> lock_sock(sk)\n              \
  \                            parent = /* NULL */\n     lock_sock(sk) <---------------------
  release_sock(sk)\n                                          sock_set_flag(sk, SOCK_ZAPPED)\n\
  \         "
