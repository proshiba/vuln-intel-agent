title: A vulnerability was detected in Cobham SATCOM VSAT7090 Maritime Satellite
  Router up to 20260704. This issue affects the function c_set_reports_decode of
  the file mail-report.sh of the component JSON Parsing. The manipulation of the
  argument sender/recipients results in command injection. It is possible to 
  launch the attack remotely. The exploit is now public and may be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
