title: OpenClaw (npm package 'openclaw') versions >= 2026.3.28 and < 2026.8.1 
  contain a credential exposure issue in memory embedding failover. When remote 
  embedding fallback is configured and the primary embedding provider fails, the
  request can be sent to a different fallback provider while still reusing the 
  primary provider's configured API key, causing that credential to be 
  transmitted as a bearer token to an unintended vendor. The practical impact 
  depends on the configured providers, whether failover occurs, and the 
  privileges attached to the primary provider key. The issue is fixed in 
  2026.8.1; as a workaround, disable cross-provider embedding fallback or 
  configure each provider with separate, narrowly scoped credentials.
