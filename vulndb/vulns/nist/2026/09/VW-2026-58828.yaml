title: A security flaw has been discovered in kagisearch smallweb up to 
  0ecb9c48edbf98dc7e934b54fbac43869e64b4cf. The affected element is the function
  index of the file app/sw.py of the component Query String Rendering. 
  Performing a manipulation of the argument qs results in cross site scripting. 
  The attack is possible to be carried out remotely. This product adopts a 
  rolling release strategy to maintain continuous delivery. Therefore, version 
  details for affected or updated releases cannot be specified. The patch is 
  named 00b68144e583f20a6b67e29cf01bc07f57979ffb. It is recommended to apply a 
  patch to fix this issue. Exploitability requires a raw HTTP request carrying 
  unencoded double-quote characters in the query string - Werkzeug's 
  request.query_string returns the raw request-target, and ordinary browsers 
  percent-encode " as %22, so the payload only lands via netcat/curl-style raw 
  sockets.
