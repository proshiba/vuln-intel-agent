title: The TranslatePress – Translate Multilingual sites with AI Translation 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via 
  Translation Memory Suggestion Panel (v-html on suggestion.original) in all 
  versions up to, and including, 3.3.5 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. Unauthenticated attackers can seed the translation 
  dictionary's original column with executable HTML because the front-end 
  rendering pipeline decodes entity-encoded payloads via html_entity_decode() 
  before persistence, and the original column is deliberately exempt from kses 
  filtering — meaning no save-time sanitizer neutralizes the stored payload 
  before it is later rendered in an administrator's session.
