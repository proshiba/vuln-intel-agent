title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Add bounds check for CRAT subtype length\n\nThe CRAT parser validates that the subtype
  header fits within the image,\nbut does not verify that the advertised subtype length
  fits. A malformed\nCRAT table with an oversized length field causes out-of-bounds
  reads when\nkfd_parse_subtype() casts the header to specific subtype structures.\n\
  \nAdd validation that sub_type_hdr + length does not exceed the image\nboundary
  before parsing the subtype contents.\n\n(cherry picked from commit 48e1d1e6e8798aef0312e68d8e586021b5b3cf4d)"
