title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Fix offset arithmetic in read_chunk_range\n\nsvc_rdma_read_chunk_range() walks a
  Read chunk's segment list to\nbuild a sub-range starting at byte offset and spanning
  length bytes\nfor a Position-Zero or Call chunk. Two arithmetic defects in the\n\
  per-segment loop produce wrong DMA lengths and a u32 underflow:\n\n    pcl_for_each_segment(segment,
  chunk) {\n            if (offset > segment->rs_length) {\n                    offset
  -= segment->rs_length;\n                    continue;\n            }\n\n       \
  \     dummy.rs_handle = segment->rs_handle;\n            dummy.rs_length = min_t(u32,
  length,\n                                    segment->rs_length) - offset;\n   \
  \         dummy.rs_offset = segment->rs_offset + offset;\n\nFirst, the skip predicate
  uses '>' instead of '>='. When offset\nequals the segment's full rs_length, the
  segment is fully consumed\nand should be skipped, but the loop falls through into
  the body.\nThe result"
