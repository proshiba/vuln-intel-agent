title: "In the Linux kernel, the following vulnerability has been resolved:\n\norangefs:
  fix double-free of trailer_buf on readdir copy failure\n\nOn a readdir downcall,
  orangefs_devreq_write_iter() frees\nop->downcall.trailer_buf with vfree() when copy_from_iter_full()
  fails,\nbut does not clear the pointer before goto Efault. The waiter in\ndo_readdir()
  is then woken with a negative status and frees the same\npointer again on its r
  < 0 path, causing a deterministic double-free.\nA client holding /dev/pvfs2-req
  triggers it by sending a readdir\ndowncall whose declared trailer_size exceeds the
  bytes it supplies.\n\nClear the pointer after freeing so the readdir-side vfree()
  becomes a\nno-op."
