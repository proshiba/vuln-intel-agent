title: Scirius through 3.8.0 contains an arbitrary file write vulnerability in 
  the PCAP filestore upload endpoint that allows default User role users to 
  write attacker-controlled JSON content to filesystem paths. Attackers can 
  supply path traversal sequences in the uploaded document's _id field to escape
  the intended directory and write files with .json extension to arbitrary 
  locations as root.
