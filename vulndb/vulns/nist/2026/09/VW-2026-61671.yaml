title: A flaw has been found in Artifex MuPDF up to 
  b6d17493700c621c0e70036980a6ebd06d2202c9. Affected by this vulnerability is 
  the function pdf_open_filter of the file pdf-stream.c of the component PDF 
  Xref Loading. Executing a manipulation can lead to null pointer dereference. 
