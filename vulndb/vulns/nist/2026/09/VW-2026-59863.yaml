title: 'A flaw has been found in OpenClaw ClawScan up to 0.1.6. This affects an unknown
  function of the file internal/runner/static_scanner.go of the component Static Scanner.
  This manipulation causes incomplete comparison with missing factors. It is possible
  to launch the attack on the local host. The exploit has been published and may be
  used. Upgrading to version 0.1.7 mitigates this issue. Patch name: 9f6a6fbb9f1137345566d0ab44c73893dfe112fa.
