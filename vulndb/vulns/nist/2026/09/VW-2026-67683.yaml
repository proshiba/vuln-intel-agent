title: "An authentication bypass vulnerability exists in the protection of Actuator
  endpoints. The application determines whether authentication is required by matching
  the incoming request path against protected Actuator paths. By sending a specially
  crafted request containing a percent-encoded path, a remote unauthenticated attacker
  can cause the security check to fail to recognize the request as targeting a protected
  endpoint.\n\n\n\nAs a result, the attacker may bypass authentication and access
  otherwise restricted Actuator endpoints. Successful exploitation may expose operational
  or configuration information and, depending on the enabled endpoints and application
  configuration, allow access to sensitive management functionality.\n\n\n\nThis issue
  affects Apache DolphinScheduler: before 3.4.3.\n\n\n\nUsers are recommended to upgrade
  to version 3.4.3, which fixes the issue."
