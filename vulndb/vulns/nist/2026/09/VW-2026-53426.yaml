title: Boruta is a standalone authorization server that aims to implement OAuth 
  2.0 and Openid Connect up to decentralized identity specifications. Prior to 
  version 0.10.0, Boruta logged sensitive OAuth and OpenID Connect values in 
  business event logs. Logged values could include access tokens, refresh 
  tokens, authorization codes, agent tokens, direct-post codes, ID tokens, VP 
  tokens, and tokens submitted to introspection or revocation endpoints. An 
  attacker with access to Boruta logs, log aggregation systems, or the 
  administration log viewer could recover these credentials and use them until 
  expiration or revocation. This issue has been patched in version 0.10.0.
