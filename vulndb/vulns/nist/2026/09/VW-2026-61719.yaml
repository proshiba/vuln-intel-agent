title: On affected platforms running Arista EOS with VRRP enabled, the peer 
  device VRRP authentication credentials are logged in cleartext on the switch, 
  allowing an authenticated user with sufficient privileges to view agent trace 
  logs (or a system receiving forwarded log output) to obtain the peer device 
  VRRP authentication credentials without having access to the network segment 
  on which VRRP is running.
