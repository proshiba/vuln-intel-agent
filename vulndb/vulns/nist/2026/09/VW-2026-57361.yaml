title: money-pos 1.0 contains a stored Cross-Site Scripting (XSS) vulnerability.
  When processing returns, the backend fails to filter or escape the goodsName 
  parameter, directly concatenating it into the order log description; the 
  frontend subsequently renders this content using v-html. An attacker with 
  product creation privileges can inject a malicious JavaScript payload, causing
  unauthorized code execution when an administrator views the order logs.
