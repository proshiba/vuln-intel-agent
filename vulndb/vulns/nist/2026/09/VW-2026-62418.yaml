title: "In the Linux kernel, the following vulnerability has been resolved:\n\nARM:
  9481/2: breakpoint: CFI breakpoints only on demand\n\nThis removes the stub hw_breakpoint_cfi_handler()
  from ARM, making\nit not steal breakpoint type 0x03 (ARM_ENTRY_CFI_BREAKPOINT) unless\n\
  CFI is actively used in the kernel.\n\nWhen not instrumenting with CFI, or when
  a breakpoint is issued in\nuserspace, we fall through to return 1 from hw_breakpoint_pending()\n\
  \"unhandled fault\" so userspace can make use of this breakpoint.\n\nTested with
  LKDTM and this command line:\necho CFI_FORWARD_PROTO > /sys/kernel/debug/provoke-crash/DIRECT\n\
  still works as expected."
