title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: ab8500_fg: fix use-after-free on remove\n\nab8500_fg_remove() destroys the
  driver workqueue while the threaded\ninterrupt handlers are still armed; they are
  devm-managed and freed\nonly after ->remove() returns, so a handler that fires in
  that\nwindow queues work on the freed workqueue.\n\nTear the workqueue down through
  devm instead, registering its cleanup\nafter the power supply and before the interrupt
  requests.  devm then\nfrees the interrupts first, so the handlers can no longer
  queue work,\nbefore disabling the delayed and plain work items and destroying the\n\
  workqueue.  Disabling the items, rather than cancelling them, keeps\nthem disabled
  so no producer (including the power-supply\nexternal_power_changed callback) can
  requeue them.\n\nFound by an in-house static analysis tool."
