title: Taskview Community before 1.56.0 contains a missing authentication 
  vulnerability that allows unauthenticated attackers to register arbitrary 
  OAuth clients and take over user accounts by exploiting the OAuth 2.0 Dynamic 
  Client Registration endpoint, which is enabled by default and requires no 
  authentication. Attackers can send a POST request to the registration endpoint
  to obtain a client_id and client_secret, then craft a malicious authorization 
  link pointing to an attacker-controlled redirect URI to capture authorization 
  codes and exchange them for access tokens granting full API access to victim 
  account data.
