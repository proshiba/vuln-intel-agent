title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncsky:
  Fix a4/a5 restoration in syscall trace path\n\nThe syscall trace path reloads syscall
  arguments from pt_regs before\ncalling the syscall handler. On C-SKY ABIv2, the
  5th and 6th syscall\narguments are prepared as stack arguments before invoking syscallid.\n\
  \nThe current code adjusts sp before loading LSAVE_A4 and LSAVE_A5. Since\nthose
  offsets are relative to the original pt_regs base, loading them\nafter changing
  sp fetches the wrong slots. As a result, traced syscalls\nthat use the 5th or 6th
  argument may receive corrupted arguments.\n\nThis is visible with mmap2(), which
  takes six arguments. A small\nPTRACE_SYSCALL reproducer opens a file and maps one
  page with:\n\n  mmap(NULL, 4096, PROT_READ | PROT_EXEC, MAP_PRIVATE, fd, 0)\n\n\
  Before the fix, the traced child fails the mmap and exits with 12.\nAfter the fix,
  the mapping succeeds and the child exits with 0.\n\nFix the trace path by loading
  a4/a5 from pt_regs before changing sp"
