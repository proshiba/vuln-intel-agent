title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntick/broadcast:
  Plug clockevents replacement race\n\n朱恺乾 reported and decoded the following race
  condition when a broadcast\ndevice is replaced:\n\nCPUA\t\t\t\t\tCPUB\n __tick_broadcast_oneshot_control()\n\
  \   bc = tick_broadcast_device.evtdev;\n\t\t\t\t\ttick_install_broadcast_device(dev)\n\
  \        \t\t\t\tclockevents_exchange_device(cur, dev)\n\t\t\t\t\t   shutdown(cur);\n\
  \t\t\t\t\t   detach(cur);\n\t\t\t\t\t   cur->handler = noop;\n\t\t\t\t\t   tick_broadcast_device.evtdev
  = dev;\n\n  tick_broadcast_set_event(bc, next_event); <- FAIL: arms a detached device.\n\
  \nIf the original broadcast device has a restricted interrupt affinity mask\nand
  the last CPU in that mask goes offline then the BUG() in\ntick_cleanup_dead_cpu()
  triggers because the clockevent device is not in\ndetached state.\n\nThe reason
  for this is that tick_install_broadcast_device() is not\nserialized vs. tick broadcast
  operations.\n\nThe obvious cure is to serialize tick_install_broadcast_device()
  with\ntick_broa"
