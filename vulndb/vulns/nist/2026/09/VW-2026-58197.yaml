title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  l2tp: do not propagate multicast notification errors\n\nThe tunnel create, tunnel
  modify, session create, and session modify\nnetlink handlers send multicast notifications
  through helpers that can fail\nwhile allocating or encoding a message, or while
  multicasting it.\n\nFor tunnel and session create/modify, a notification is sent
  after the live\noperation has completed. Returning a best-effort notification error
  as the\ncommand result can therefore report failure for an operation that already\n\
  committed and can cause callers to retry and accumulate live objects.\n\nKeep sending
  notifications for listener visibility, but do not propagate\ntheir best-effort status
  as the command result. This also keeps the tunnel\nmodify command consistent with
  the other notification-only paths."
