title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-fc:
  fix invalid free in LS IOD error path\n\nnvmet_fc_alloc_ls_iodlist() advances iod
  while initializing the LS IOD\narray. If an rqstbuf allocation or response buffer
  DMA mapping fails,\nthe unwind loop decrements iod past the start of the array.
  The final\nkfree(iod) therefore frees an address before the allocated object.\n\n\
  This can be reproduced with nvme-fcloop and failslab by setting\nfail-nth to 6 before
  creating a target port. KASAN reports:\n\n  BUG: KASAN: invalid-free in nvmet_fc_register_targetport\n\
  \  Free of addr ffff88816cf8ff48 by task nvmet_fail_nth/9552\n\nFree the original
  allocation base stored in tgtport->iod instead. With\nthis fix applied, the same
  sysfs write with fail-nth=6 returns -ENOMEM\nwithout any KASAN report."
