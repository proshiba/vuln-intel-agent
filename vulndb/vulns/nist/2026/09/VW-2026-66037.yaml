title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (corsair-cpro) Remove debugfs entries when probe fails\n\nccp_debugfs_init() registers
  debugfs files whose private data is the devm\nallocated ccp.  If hwmon_device_register_with_info()
  fails right after it,\nccp_probe() returns without removing them: the HID core then
  frees ccp,\nand ccp_remove() is not called for a failed probe, so the files stay\n\
  behind.  Reading one of them dereferences the freed pointer.\n\nRemove the debugfs
  entries on that error path.  debugfs_remove_recursive()\nwaits for readers already
  inside the show callbacks, so ccp is no longer\nreachable through debugfs by the
  time probe returns."
