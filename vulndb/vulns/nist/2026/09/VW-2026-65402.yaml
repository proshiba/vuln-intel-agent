title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  renesas: phy-rcar-gen3-usb2: Fix devm action registration for disabled VBUS regulator\n\
  \ndevm_regulator_get_exclusive() initialises the regulator with\nenable_count =
  1, requiring the consumer to disable it before release.\n\nThe devm disable action
  was previously only registered when the caller\nexplicitly requested enable, so
  when the regulator was left in its initial\nenabled state without an explicit enable
  call, the cleanup path skipped\ndecrementing enable_count, triggering a WARN_ON
  during regulator\nrelease on device removal.\n\nFix this by always registering the
  devm disable action based on the actual\nenabled state via regulator_is_enabled(),
  regardless of whether the\ncaller requested an explicit enable. This covers both
  the explicitly\nenabled case and the initial state set by devm_regulator_get_exclusive()."
