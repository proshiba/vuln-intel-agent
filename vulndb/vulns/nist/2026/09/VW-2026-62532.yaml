title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix infinite loop in nilfs_clean_segments()\n\nsyzbot reported a hung task in nilfs_transaction_begin().
  This occurs\nbecause the cleaner ioctl falls into an infinite loop if\nnilfs_segctor_construct()
  repeatedly returns -EROFS (e.g. the device\nis remounted as read-only after an I/O
  error).\n\nCurrently in nilfs_clean_segments(), if err is non-zero, it logs the\n\
  error and sleeps but doesn't abort when it encounters a terminal error\nlike -EROFS.
  This causes the thread to loop forever.\n\nFix this by breaking out of the loop
  if nilfs_segctor_construct()\nreturns -EROFS. This matches the behaviour in\nnilfs_segctor_write_out(),
  which also handles -EROFS."
