title: zerox 1.1.20 contains an OS command injection vulnerability in the file 
  download mechanism where the temporary file extension derived from document 
  URLs is interpolated unsanitized into shell commands executed by poppler 
  utilities. Attackers can craft document URLs with malicious file extensions 
  containing command substitution syntax to execute arbitrary OS commands before
  document processing occurs.
