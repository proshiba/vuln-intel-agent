title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix UAF in check_new_map() on session freed during unlock\n\ncheck_new_map() iterates
  mdsc->sessions[] and for each active session\ndrops mdsc->mutex to perform per-session
  operations.  The forced-close\npath (rank removed from map) correctly takes a reference
  on s via\nceph_get_mds_session() before releasing mdsc->mutex, but three other\n\
  paths do not:\n\n  Path A (address changed):  mutex_unlock → mutex_lock(&s->s_mutex)\n\
  \  Path B (reconnect):        mutex_unlock → send_mds_reconnect(mdsc, s)\n  Path
  C (active transition): mutex_unlock → mutex_lock(&s->s_mutex)\n\nWithout the extra
  reference, another thread can acquire mdsc->mutex\nduring the unlock window, call
  __unregister_session() which drops the\nlast reference on s, and free it.  The original
  thread then accesses\nfreed memory via s->s_mutex.\n\nFix by adding ceph_get_mds_session(s)
  before each mutex_unlock and\nceph_put_mds_session(s) after the corresponding mutex_lock,
  m"
