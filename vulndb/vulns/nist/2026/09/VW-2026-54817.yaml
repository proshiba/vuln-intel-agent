title: The Flamingo plugin for WordPress is vulnerable to authorization bypass 
  in all versions up to, and including, 2.6.2. This is due to the plugin not 
  properly verifying that a user is authorized to perform an action. This makes 
  it possible for authenticated attackers, with contributor-level access and 
  above, to enumerate taxonomy terms including channel names derived from 
  Contact Form 7 form titles that may reveal internal form purposes, department 
  names, or workflow identifiers, as well as submission counts per channel and 
  contact tag names. The plugin's flamingo_map_meta_cap() filter restricts 
  access to Flamingo's admin UI but does not extend to WordPress core APIs such 
  as XML-RPC wp.getTerms and admin-ajax ajax-tag-search.
