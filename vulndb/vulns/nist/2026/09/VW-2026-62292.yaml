title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblock:
  mtip32xx: synchronize ioctls with device removal\n\nThe ioctl handlers only test
  REMOVE_PENDING before entering\nmtip_hw_ioctl(). Removal can set that bit immediately
  afterwards and free\ndd->port in mtip_hw_exit() while an ioctl still dereferences
  it. An already\nopen block device can reach the handlers while del_gendisk() is
  in\nprogress.\n\nSerialize both native and compat ioctls with removal. Set REMOVE_PENDING\n\
  before taking the mutex so new callers fail after an in-flight ioctl has\ndrained,
  and hold the mutex until the port has been torn down."
