title: Incorrect default permissions in the installation directory of WatchDog 
  Anti-Virus on Windows allow local, low-privileged users to modify, replace, or
  delete antivirus binaries and configuration files, because the installer 
  grants the Users group Full Control over C:\Program Files (x86)\Watchdog 
  Anti-Virus. This may disable antivirus protection or enable privileged code 
  execution if modified binaries are loaded by an elevated WatchDog process.
