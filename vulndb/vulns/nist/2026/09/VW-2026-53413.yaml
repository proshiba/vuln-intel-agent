title: Open edX Platform enables the authoring and delivery of online learning 
  at any scale. Prior to commit 00b7c3c, the endpoint accepts user-supplied 
  files[].url, performs a server-side fetch using "requests.get(url, 
  allow_redirects=True)". The fetched bytes are then returned inside a ZIP 
  response. This enables SSRF with response exfiltration. Redirect-following is 
  enabled, and there is no timeout in the vulnerable fetch path. This issue has 
  been patched via commit 00b7c3c.
