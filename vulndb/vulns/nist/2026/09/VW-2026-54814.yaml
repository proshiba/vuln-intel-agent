title: PocketMine-MP 3.x (before 3.27.0) does not implement Minecraft Bedrock 
  protocol encryption, so the server cannot verify that a connecting client 
  possesses the private key corresponding to its login token. An attacker who 
  captures a valid login from another player's session (for example by tricking 
  the player into connecting to an attacker-controlled server) can replay that 
  login to impersonate the victim and pass XBOX Live authentication until the 
  JWT token expires (typically 2-3 days). This affects servers directly 
  reachable over the internet that are not behind a proxy with encryption 
  enabled. Fixed in 4.0.0 and backported to 3.27.0.
