title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregulator:
  core: use system_freezable_wq for init complete work\n\nschedule_delayed_work()
  uses system_wq, which is non-freezable, allowing\nregulator_init_complete_work to
  run concurrently with system suspend. This\nwork fires ~30s after boot to disable
  unused regulators via I2C. When it\nraces with PM suspend, the I2C adapter may already
  be suspended, triggering\na -ESHUTDOWN warning in __i2c_transfer():\n\n  WARNING:
  ... at __i2c_transfer+0x36c/0x3c8\n  Call trace:\n   __i2c_transfer\n   i2c_transfer\n\
  \   regmap_i2c_write\n   _regmap_update_bits\n   regulator_disable_regmap\n   _regulator_do_disable\n\
  \   regulator_late_cleanup\n   regulator_init_complete_work_function\n   process_one_work\n\
  \nSwitch to system_freezable_wq so the work is frozen before any device\nis suspended,
  eliminating the race."
