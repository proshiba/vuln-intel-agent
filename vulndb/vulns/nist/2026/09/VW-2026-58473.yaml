title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix dentry ref leak on V4ROOT export filehandle lookup\n\nnfsd_set_fh_dentry() leaks
  the dentry reference from\nexportfs_decode_fh_raw() when the NFS3_FHSIZE or NFS_FHSIZE\n\
  switch cases detect NFSEXP_V4ROOT and goto out. The out: label\ncalls exp_put()
  but never dput(dentry), and fhp->fh_dentry was\nnever assigned so fh_put() cannot
  compensate.\n\nA crafted NFSv3 filehandle targeting a V4ROOT export's fsid\ntriggers
  the leak on every request."
