title: Chartbrew is an open-source web application that can connect directly to 
  databases and APIs and use the data to create charts. Prior to 5.2.2, 
  Chartbrew's runQuery() implementation in 
  server/modules/ai/orchestrator/tools/runQuery.js interpolates the AI tool's 
  row_limit parameter into a SQL LIMIT clause without runtime integer 
  validation. The read-only keyword check runs before this value is appended, so
  an authenticated user who can influence a model-generated non-integer 
  row_limit can add SQL that bypasses the earlier check. Successful exploitation
  can execute arbitrary statements against the connected database, including 
  reading or changing data and, where database permissions permit, accessing 
  files or executing operating-system commands. This issue is fixed in version 
  5.2.2.
