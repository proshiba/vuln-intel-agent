title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: don't clobber the extent buffer when zeroing it out\n\nOn a zoned filesystem
  a freed-but-still-dirty tree block is written out\nas zeros (EXTENT_BUFFER_ZONED_ZEROOUT)
  only to keep the zone write\npointer advancing. btree_csum_one_bio() implemented
  this by memzeroing\nthe extent buffer's own folios before submission.\n\nThat destroys
  the in-memory buffer while it may still be referenced. In\nparticular btrfs_free_tree_block()
  can run on it afterwards and reads\nthe header to add a delayed reference; once
  the header has been zeroed\nit frees bytenr 0 and corrupts the extent tree (the\n\
  btrfs_header_bytenr(buf) != 0 ASSERT in btrfs_free_tree_block(), or an\n\"unable
  to find ref\" abort). It is flaky and reproduces under fsstress,\ne.g. generic/461
  and generic/013.\n\nWrite the zeros to disk from the shared zero page instead and
  leave the\nextent buffer content untouched, so any later reference - including the\n\
  delayed referenc"
