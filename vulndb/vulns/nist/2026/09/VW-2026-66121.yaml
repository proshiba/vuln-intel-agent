title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bcmasp: clear txcb->last before writing each descriptor\n\nbcmasp_xmit() only wrote
  txcb->last = true for the final fragment\nof an SKB; non-final fragments left the
  field untouched.  If a\ndescriptor slot was reused while it still held a stale true
  from\na previous SKB (possible when tx_spb_ring_full() underreported\nfullness),
  bcmasp_tx_reclaim() would see last == true mid-SKB and\ncall dev_consume_skb_any()
  prematurely, freeing the sk_buff while\nits remaining fragments were still in flight.\n\
  \nUnconditionally clear txcb->last before the conditional set so every\ndescriptor
  slot starts from a known false state regardless of what a\nprior transmission left
  behind."
