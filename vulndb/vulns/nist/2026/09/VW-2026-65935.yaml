title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/crypto:
  Fix wrong return code to engine in asynch callbacks\n\nWhen crypto_finalize_hash_request()
  or\ncrypto_finalize_skcipher_request() explicitly completes a request, the\ndo_one_request
  callback must return 0 to indicate successful\nhandling. Returning a negative error
  code causes the crypto engine to\nassume the driver failed to take ownership and
  triggers a second\ncompletion via crypto_request_complete(), resulting in a double\n\
  completion. This pattern occurs in paes_s390.c 4 times and once in\nphmac_s390.c.\n\
  \nFixed in phmac_do_one_request() and all four paes do_one_request\ncallbacks (ecb,
  cbc, ctr, xts) by returning 0 after explicit\nfinalization instead of propagating
  the error code."
