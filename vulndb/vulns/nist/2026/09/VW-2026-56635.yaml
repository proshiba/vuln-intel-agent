title: n8n is an open source workflow automation platform. Prior to 2.37.7 and 
  2.38.2, the /rest/roles/:slug/assignments and 
  /rest/roles/:slug/assignments/:projectId/members endpoints checked only 
  whether the caller could manage the role type. A caller with 
  role:manageProject could name a project the caller could not list and obtain 
  member names and email addresses. The affected controller is 
  packages/cli/src/controllers/role.controller.ts, which omitted the 
  project:list scope check. This issue is fixed in versions 2.37.7 and 2.38.2.
