title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Fix subbuf resize race with ring buffer readers\n\ntrace_buffer subbuf_size is read
  lockless in ring_buffer_read_page() and\nring_buffer_read_start(), while it can
  simultaneously be resized with\nring_buffer_subbuf_order_set().\n\nInstead of trace_buffer::subbuf_size,
  use bpage::order in\nring_buffer_read_start() and ring_buffer_read_page().\n\nIn
  ring_buffer_read_start(), even with resize_disabled, there is still a\npossibility
  of a race with a buffer modification. Hold the trace_buffer\nmutex to synchronise
  with any pending ring buffer order modification.\n\ntrace_buffer::subbuf_size is
  now actually useless, remove it. Also,\ncreate accessors rb_subbuf_capacity() and
  rb_page_capacity() which\nreturn the actual size available for storing events, while\n\
  rb_subbuf_size() returns the actual subbuf page-size."
