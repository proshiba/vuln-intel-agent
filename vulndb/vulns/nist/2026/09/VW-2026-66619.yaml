title: "Flowise (npm packages `flowise` and `flowise-components`) through 3.1.4 looks
  up credentials by ID without filtering on the requesting user's workspace (findOneBy({
  id: credentialId }) with no workspaceId condition) in several code paths: getAllOpenaiAssistants/getSingleOpenaiAssistant
  (GET /api/v1/openai-assistants and /api/v1/openai-assistants/:id), uploadFilesToAssistant
  (POST /api/v1/openai-assistants-file/upload/), deleteAssistant (DELETE /api/v1/assistants/:id,
  reachable by first importing a poisoned assistant row via POST /api/v1/export-import/import),
  and the shared helper used by getVoices (GET /api/v1/text-to-speech/voices). An
  authenticated user of one workspace can supply a credential UUID belonging to another
  workspace, causing the server to decrypt and use that workspace's OpenAI or ElevenLabs
  API key on the attacker's behalf. No patched version was available at the time of
  publication."
