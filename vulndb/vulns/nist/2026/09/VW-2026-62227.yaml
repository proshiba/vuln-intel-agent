title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  fix NULL pointer dereference in __xsk_rcv()\n\nIn the __xsk_rcv() multi-buffer path,
  xsk_buff_alloc() is called in a\nloop without checking its return value. xsk_buff_can_alloc()
  only\ncounts fill queue entries without validating their addresses, so it\ncan succeed
  while xsk_buff_alloc() rejects all remaining entries and\nreturns NULL.\n\n  Oops:
  general protection fault, probably for non-canonical address\n   0xdffffc0000000000\n\
  \  KASAN: null-ptr-deref in range\n   [0x0000000000000000-0x0000000000000007]\n\
  \  RIP: 0010:__xsk_rcv+0x426/0xc20 (net/xdp/xsk.c:350)\n  Call Trace:\n   xsk_generic_rcv+0x26d/0x5f0\n\
  \   xdp_do_generic_redirect+0x3c5/0xcf0\n   do_xdp_generic+0x92f/0xe70\n   __netif_receive_skb_core.constprop.0+0xf7e/0x2b30\n\
  \nFix this with a two-stage transaction. First allocate and stage all\nbuffers required
  for the packet, recycling all staged buffers with\nxsk_buff_free() if any allocation
  fails. Only after this stage\nsuccee"
