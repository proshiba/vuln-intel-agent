title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/intel/pt:
  Fix stop/start with no update\n\nIf pt_event_stop() is called without PERF_EF_UPDATE
  flag, then\nperf_aux_output_end() is not called.  A subsequent call to pt_event_start()\n\
  will call perf_aux_output_begin() again which violates the rule against\nnesting
  and triggers a WARNING in perf_aux_output_begin().\n\nOriginally, pt_event_stop()
  was never called without PERF_EF_UPDATE,\nbecause the only code paths to do so are
  from event overflow, and Intel PT\ndoes not do that.\n\nHowever the introduction
  of group throttling by commit 9734e25fbf5ae\n(\"perf: Fix the throttle logic for
  a group\") meant that an Intel PT event\ncould be throttled if it was part of a
  group.  Throttling calls PMU\n ->stop() / ->start() callbacks without flags.\n\n\
  An example is when AUX area sampling is used. The following commands\nhit the issue:\n\
  \n  echo 10000 > /proc/sys/kernel/perf_event_max_sample_rate\n\n  perf record -F32000
  --aux-sample -e '{int"
