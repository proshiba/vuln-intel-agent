title: LearnPress WordPress Plugin before 4.4.6 contains a stored cross-site 
  scripting vulnerability that allows authenticated attackers with the 
  Instructor role to inject persistent malicious payloads by submitting 
  unsanitized input into quiz question answer title fields. Attackers can store 
  arbitrary JavaScript through the answer title parameter, which is rendered 
  through an unescaped HTML sink to execute in the browsers of any user who 
  views the affected quiz question, including students, other instructors, and 
  administrators.
