title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  thunderbolt: Release the Rx HopID that was handed out on mismatch\n\ntb_xdomain_alloc_in_hopid()
  passes the wanted HopID to ida_alloc_range()\nas the lower bound, so a taken id
  is not an error there: the allocator\nreturns the next free one above it. tbnet_connected_work()
  asks for the\npeer's transmit path, treats any other id as a failure and returns\n\
  without releasing what it got, so that allocation stays live for the rest\nof the
  XDomain connection with nothing left holding a reference to it.\n\nRelease the id
  when it is not the one we asked for, the same way the\nerror unwind at the end of
  the function releases the expected one."
