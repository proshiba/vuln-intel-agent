title: "Improper Validation of Specified Quantity in Input vulnerability in Erlang/OTP
  stdlib allows a remote attacker to degrade availability by supplying a URI whose
  port component is a very long run of digits.\n\nuri_string:get_port/1 passes the
  port substring to binary_to_integer/1 with no length bound, catching only error:badarg,
  so a syntactically valid port of up to roughly 1.26 million digits converts successfully
  and costs the calling process hundreds of milliseconds of arbitrary-precision arithmetic.
  The conversion is reached from every authority-parsing path in uri_string:parse/1,
  including the host, registered-name, and IPv4 and IPv6 forms. parse/1 is the documented
  interface for parsing URIs, so any application that parses an attacker-supplied
  URI is exposed without further configuration. The conversion function is documented
  to accept integers of any size, so bounding the input is the caller's responsibility.\n\
  \nThis issue affects OTP from OTP 21.0 before OTP 27.3.4.17, from OTP 28.0"
