title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  remove stale namespaces by NSID range during scan\n\nnvme_scan_ns_list() drops the
  stale namespaces in each gap in the\nreported NSID list one NSID at a time. Every
  iteration calls\nnvme_find_get_ns() to look the namespace up and removes it if it
  is\npresent. The loop runs once per NSID in the gap rather than once per\nnamespace
  actually present.\n\nNSIDs are 32-bit, so a target with a sparse NSID space can
  make a\nsingle gap spin the loop billions of times with nothing to remove.\n\n \
  \ watchdog: BUG: soft lockup - CPU#4 stuck for 26s!\n  Workqueue: nvme-wq nvme_scan_work
  [nvme_core]\n  RIP: 0010:__srcu_read_unlock+0xb/0x20\n  Call Trace:\n   nvme_find_get_ns+0x7d/0xb0
  [nvme_core]\n   nvme_scan_ns_list+0xe8/0x280 [nvme_core]\n   nvme_scan_work+0x18a/0x280
  [nvme_core]\n   process_one_work+0x197/0x380\n   worker_thread+0x2fe/0x410\n   kthread+0xe0/0x100\n\
  \nRename nvme_remove_invalid_namespaces() to nvme_remove_nsid_range()\nand give
  it a"
