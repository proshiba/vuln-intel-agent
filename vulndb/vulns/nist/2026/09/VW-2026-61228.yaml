title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-fwnode: Fix fwnode leak in v4l2_fwnode_parse_link\n\nIn v4l2_fwnode_parse_link(),
  the remote endpoint fwnode reference is\nacquired using fwnode_graph_get_remote_endpoint().
  This reference is\nproperly released in the error paths, but it is leaked on the
  success\npath.\n\nAdd the missing fwnode_handle_put() before returning 0 to prevent
  the\nreference leak.\n\n[Sakari Ailus: Fix subject prefix and coding style a little.]"
