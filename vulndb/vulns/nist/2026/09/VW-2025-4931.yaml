title: TUUI is a desktop MCP client designed as a tool unitary utility 
  integration. Prior to 1.3.4, a critical Remote Code Execution (RCE) 
  vulnerability exists in Tuui due to an unsafe Cross-Site Scripting (XSS) flaw 
  in the Markdown rendering component. Tuui allows the execution of arbitrary 
  JavaScript within ECharts code blocks. Combined with an exposed IPC interface 
  that allows spawning processes, an attacker can execute arbitrary system 
  commands on the victim's machine simply by having them view a malicious 
  Markdown message. This vulnerability is fixed in 1.3.4.
