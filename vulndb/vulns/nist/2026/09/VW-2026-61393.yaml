title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent client use-after-free during close_lru reaping\n\nAn nfs4_openowner left
  on nn->close_lru after its final CLOSE keeps\nits last closed stateid in oo_last_closed_stid,
  holding only a raw\npointer to its nfs4_client. The laundromat reaps timed-out entries,\n\
  drops nn->client_lock, and calls nfs4_put_stid(), which dereferences\nthe client
  through cl_lock. Nothing pins the client across that\nwindow, so a concurrent force_expire_client()
  can free it and\nnfs4_put_stid() reads freed memory. __destroy_client() hits the
  same\nrace, walking clp->cl_openowners without cl_lock.\n\nPin the client with cl_rpc_users
  before dropping client_lock, and\nskip clients already expiring. __destroy_client()
  then cleans up its\nown close_lru entries through release_last_closed_stateid(),
  so\nteardown no longer races the laundromat."
