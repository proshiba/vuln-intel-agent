title: Nezha Dashboard versions before 2.3.5 fail to restrict service monitor 
  task types to supported probe types, allowing authenticated users with 
  nezha:service:write scope to submit privileged task types through the service 
  API. Attackers can deliver command execution or Agent configuration tasks to 
  Agents within their authorization scope by exploiting the shared protobuf 
  Task.Type namespace between service monitors and privileged operations.
