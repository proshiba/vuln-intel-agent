title: Azkaban through 4.0.0 omits project permission checks in the 
  ScheduleServlet fetchSchedule action, allowing authenticated users to read any
  project's schedule configuration. Attackers can supply arbitrary project and 
  flow identifiers to retrieve sensitive schedule details including execution 
  times, cron expressions, flow parameters, and notification email lists without
  proper authorization.
