title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  ah6: validate routing header segments_left\n\nAH6 rearranges routing-header addresses
  before computing or verifying the\nICV. ipv6_rearrange_rthdr() assumes that segments_left
  is not larger than\nthe number of addresses described by the routing header's hdrlen
  field.\n\nThat assumption does not hold for raw IPv6 HDRINCL packets. A packet with\n\
  hdrlen equal to 2 describes one address, but can carry an arbitrary\nsegments_left
  value. With segments_left equal to 255, the function moves\nits address pointer
  4,064 bytes backwards and passes a 4,064-byte length to\nmemmove(), resulting in
  an out-of-bounds access.\n\nValidate the invariant locally before modifying the
  routing header or\nperforming any address-pointer arithmetic, and propagate malformed-header\n\
  errors to the existing AH6 input and output error paths."
