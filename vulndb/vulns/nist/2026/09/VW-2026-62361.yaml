title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  light: gp2ap002: Fix unbalanced runtime PM on repeated event writes\n\nThe IIO core
  does not filter duplicate writes to the event enable\nattribute, so writing the
  same value twice invokes\nwrite_event_config() twice. Enabling twice leaks a runtime
  PM\nreference, preventing the device from ever suspending again;\ndisabling twice
  underflows the usage count and triggers a\n\"Runtime PM usage count underflow\"\
  \ warning.\n\nBail out early when the requested state matches the current state.\n\
  While at it, switch to pm_runtime_resume_and_get() so a failed\nresume is propagated
  to userspace instead of silently marking the\nevent enabled."
