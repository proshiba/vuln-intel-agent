title: Jpom through 2.11.12 fails to validate workspace ownership when resolving
  repositoryId on the /build/branch-list endpoint, allowing authenticated users 
  to access repositories from other workspaces. Attackers can submit repository 
  identifiers from different workspaces to enumerate repository existence, 
  determine repository type, and execute git ls-remote commands using other 
  workspaces' stored credentials.
