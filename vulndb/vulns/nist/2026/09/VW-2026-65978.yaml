title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btqcomsmd: destroy RPMsg endpoints before freeing hci_dev\n\nThe command and ACL
  RPMsg endpoints store struct btqcomsmd as their\ncallback private data. The receive
  callbacks dereference btq->hdev\nwithout taking an hci_dev reference.\n\nThe current
  teardown order frees the hci_dev before destroying the RPMsg\nendpoints in both
  the hci_register_dev() error path and the driver remove\npath. If WCNSS delivers
  data in that window, the endpoint callback can\nrun with an already freed hci_dev
  and pass it to the Bluetooth core.\n\nFor qcom_smd endpoints, rpmsg_destroy_ept()
  closes the channel and clears\nthe callback under the channel recv_lock. The receive
  path holds the same\nlock while invoking the callback, so destroying the endpoints
  first both\nprevents new callbacks and serializes with any callback already running.\n\
  \nDestroy the command and ACL endpoints before hci_free_dev(). Keep\nhci_unregister_dev()
  first during remov"
