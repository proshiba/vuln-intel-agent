title: 'A flaw has been found in GPAC up to f1219cde. This issue affects the function
  gf_node_list_get_child of the file scenegraph/base_scenegraph.c of the component
  MP4Box. This manipulation of the argument Target causes null pointer dereference.
  The attack is possible to be carried out remotely. The exploit has been published
  and may be used. Upgrading to version abi-16.23 is capable of addressing this issue.
  Patch name: afca1f1181668d85941d51ed1adf647807d5d975. It is recommended to upgrade
  the affected component.'
