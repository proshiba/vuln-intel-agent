title: A vulnerability was found in FluentCMS up to 0.0.5. This affects the 
  function GetAccessible of the file 
  src/Backend/FluentCMS.Services/Permissions/PermissionManager.cs. Performing a 
  manipulation results in missing authorization. It is possible to initiate the 
  attack remotely. The exploit has been made public and could be used. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
