title: JeecgBoot 3.9.2 and earlier contains an authorization bypass 
  vulnerability in the SystemApiController component. An authenticated attacker 
  with any valid JWT token can access multiple API endpoints (including 
  queryAllUser, queryUsersByUsernames, queryUserById, and queryUsersByIds) to 
  retrieve sensitive information of all users, including real names, phone 
  numbers, email addresses, employee numbers, and role definitions, due to 
  missing fine-grained permission checks and incomplete data desensitization.
