title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  reject an unclaimed class value in security_get_classes()\n\nsecurity_get_classes()
  sizes an array by p_classes.nprim and fills it at\nvalue - 1, so a class value the
  policy never defines leaves a NULL.\nsel_make_classes() passes every entry to sel_make_dir(),
  reaching the same\nd_alloc_name() dereference as the permission array. The class
  symbol table\nis allowed to be sparse (policydb_class_isvalid() exists to absorb
  that),\nbut this getter builds its own array straight from the hash table and has\n\
  no such predicate.\n\nFail the lookup when a value went unclaimed instead of handing
  out the\nNULL. Conforming policies define every class they declare and are\nunaffected."
