title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: iscsi: Reserve a terminator byte for the login payload\n\niscsi_target_check_login_request()
  rejects a login PDU whose\nDataSegmentLength exceeds MAX_KEY_VALUE_PAIRS, but the
  test is '>' and\nlogin->req_buf is allocated with exactly MAX_KEY_VALUE_PAIRS\n\
  bytes. Since iscsit_get_login_rx() receives payload_length + padding\nbytes, where\n\
  \n\tpadding = ((-payload_length) & 3);\n\nany payload_length from 8189 to 8192 fills
  the whole 8192 byte\nbuffer. The write stays in bounds, but no byte is left for
  a NUL\nterminator.\n\nThe buffer is subsequently consumed as a C string. In the
  CHAP path\nchap_check_algorithm() calls kstrdup(a_str), and extract_param() calls\n\
  strstr(in_buf, pattern) followed by strlen_semi(), none of which take a\nlength.
  convert_null_to_semi() additionally rewrites every embedded NUL\nto ';', so even
  a payload made of well formed NUL separated key=value\nrecords is left without a
