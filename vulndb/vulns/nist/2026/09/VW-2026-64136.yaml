title: "Dancer2 versions before 2.2.0 for Perl do not strip CR and LF from response
  header names in headers_to_array.\n\nThe routine removes CR and LF from each header
  value but not from the name. A name carrying them therefore reaches the PSGI server
  intact. A server that does not validate keys writes it to the wire, so the bytes
  after the CRLF arrive as their own header line.\n\nThe application has to derive
  the header name from request data, not just the value.\n\nAn attacker who controls
  that data adds their own headers and splits the response."
