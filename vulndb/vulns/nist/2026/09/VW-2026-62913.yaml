title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. From 1.0.0 until 1.0.8.5, 
  saveGlobalElements() in admin/controller/editor/global-trait.php concatenates 
  the attacker-controlled file portion of data-v-save-global to the active theme
  directory before loadHTMLFile() and file_put_contents() operate on it. An 
  authenticated user with the default Editor role and editor/* permission can 
  submit crafted HTML to module=editor/editor&action=save and traverse to an 
  existing writable PHP file outside the theme directory. If the target is 
  web-accessible, editor-controlled PHP content executes in the web server 
  context; a shipped public/vadmin/index.php entrypoint can be used as an 
  execution trampoline rather than requiring a test-only file. This can permit 
  persistent webshell placement and compromise application confidentiality, 
  integrity, and availability. This issue is fixed in version 1.0.8.5.
