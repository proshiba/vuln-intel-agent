title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  haptic: don't write an uninitialized value to unhandled usages\n\nfill_effect_buf()
  initializes value only for the four haptic usages\nhandled by its switch, but writes
  it to field->value[] for every usage.\nAn unhandled usage can therefore receive
  either an uninitialized value\nor one left over from the previous usage. hid_output_report()
  then\nserializes that value into the effect's report buffer.\n\nSkip unhandled usages
  instead. This also matches switch_mode(), which\nonly updates fields it recognizes.\n\
  \nFound with Clang's -Wconditional-uninitialized."
