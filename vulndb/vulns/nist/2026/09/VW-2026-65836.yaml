title: The Zero Spam for WordPress plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Nested POST Array Keys via Contact Form 7 Integration
  in all versions up to, and including, 5.7.10 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. The payload is delivered by submitting a 
  Contact Form 7 request with a nested POST array key containing arbitrary HTML 
  or JavaScript — PHP parses the field name into a nested array key, which is 
  stored verbatim in the zerospam_log.submission_data column when Zero Spam 
  flags the submission as spam due to the absence of the 
  zerospam_david_walsh_key field.
