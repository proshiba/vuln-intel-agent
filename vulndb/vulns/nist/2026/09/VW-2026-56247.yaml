title: A flaw has been found in aircheng-org iWebShop-5 up to 5.15. This impacts
  an unknown function of the file controllers/admin.php of the component 
  Authentication Storage. Executing a manipulation of the argument Password can 
  lead to password hash with insufficient computational effort. It is possible 
  to launch the attack remotely. A high complexity level is associated with this
  attack. The exploitability is said to be difficult. The exploit has been 
  published and may be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
