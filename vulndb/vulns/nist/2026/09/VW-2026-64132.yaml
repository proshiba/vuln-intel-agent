title: A vulnerability was identified in OctoPrint 1.0.0. Affected by this 
  vulnerability is the function _validate of the file 
  src/octoprint/server/api/files.py of the component File Download API. Such 
  manipulation of the argument filename leads to path traversal. The attack may 
  be performed from remote. The exploit is publicly available and might be used.
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
