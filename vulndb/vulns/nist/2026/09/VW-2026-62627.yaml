title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: fix counter type in iwl_fwrt_dump_error_logs\n\nThe loop counter 'count'
  was declared as u8 while num_pc is u32.\nIf firmware advertises more than 255 PC
  entries the counter wraps\nback to zero and the loop never terminates potentially
  causing an\ninfinite loop or reading past the allocated pc_data array.\n\nChange
  the declaration to u32 to match num_pc."
