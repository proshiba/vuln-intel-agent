title: CordysCRM is an open source AI-powered customer relationship management 
  system that supports private deployment. Prior to 1.7.4, ShiroFilter 
  configures /attachment/preview/{id} and /pic/preview/{id} as anonymous, and 
  both routes call AttachmentService.getResource, which performs a bare 
  primary-key lookup without ownership, organization, or permission checks. An 
  unauthenticated caller who guesses or observes an id generated by 
  IDGenerator.nextStr can download files uploaded by users in other 
  organizations because the stored organization id is used only to locate the 
  file rather than authorize the caller. This issue is fixed in version 1.7.4.
