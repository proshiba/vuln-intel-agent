title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  stop processing a packet once its association is deleted\n\nsctp_endpoint_bh_rcv()
  looks the association up only when chunk->asoc is\nNULL, and caches the result in
  chunk->asoc and chunk->transport without\ntaking a reference.\n\nA packet that matches
  no association is handed to the endpoint, so a peer\ncan bundle COOKIE ECHO, SHUTDOWN
  and SHUTDOWN ACK in one packet. The\nCOOKIE ECHO creates the association, the SHUTDOWN
  chunk caches it, and\nwith the outqueue empty the SHUTDOWN ACK reaches sctp_sf_do_9_2_final(),\n\
  so the association and its transports are freed.\n\nThe endpoint loop has no counterpart
  to the asoc->base.dead check in\nsctp_assoc_bh_rcv(). The next chunk writes to last_time_heard
  in the freed\ntransport and is then passed to sctp_do_sm() with the freed association.\n\
  The transport is freed through RCU, so this needs the packet to come off\nthe socket
  backlog, where the loop runs in task context.\n\nThe endpoint loo"
