  peer can notify the local QUIC stack to change the\ndestination connection ID (a.k.a.
  CID) the local stack uses to\nidentify the connection at the remote peer. Each CID
  is associated\nwith a sequence number. The sequence number is transmitted\nin NEW_CONNECTION_ID
  and RETIRE_CONNECTION_ID frames to identify the CID\nwhich is being either associated
