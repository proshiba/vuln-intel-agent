title: "Issue summary: A malicious remote peer may flood the local QUIC\nstack with
  NEW_CONNECTION_ID frames by avoiding a limit check on\nhow many connection IDs the
  remote QUIC stack can use.\n\nImpact summary: The local QUIC stack sends a RETIRE_CONN_ID
  frame\nfor every NEW_CONNECTION_ID frame it receives. The RETIRE_CONN_ID\nframe
  is dispatched via the Control Frame Queue (CFQ). If the remote\npeer also withholds
  ACKs, then it can force the local stack\nto allocate ~400MB (depending on ACK delay).\n\
