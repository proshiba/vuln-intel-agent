title: "MISP contains an authentication bypass vulnerability in its LDAP and LinOTP
  authentication components due to insufficient validation of user-supplied credentials.\n\
  \nThe custom LdapAuthenticate and LinOTPAuthenticate components replace CakePHP's
  FormAuthenticate implementation but did not replicate its credential validation
  checks. As a result, empty or non-string values could reach the underlying authentication
  mechanisms.\n\nIn the LDAP authentication path, an attacker able to identify a valid
  directory user's email address could submit an empty password. The empty credential
  could be passed to ldap_bind(), where an LDAP server accepting unauthenticated binds
  may return a successful result for a valid distinguished name combined with an empty
  password. MISP could consequently treat the attacker as the corresponding authenticated
  directory user without verification of the user's password.\n\nThe issue also affected
  the LinOTP authentication component. Invalid credential types were not rejec"
