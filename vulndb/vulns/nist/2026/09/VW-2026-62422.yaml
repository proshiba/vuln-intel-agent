title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxen/xenbus:
  check otherend_id only after it has been initialized\n\nWhen device just got initialized
  (for example on module load), the\notherend_id field is initialized only after\n\
  xenbus_read_otherend_details() gets called. If xenstore watch triggers\nxenbus_dev_changed()
  before that, it might consider still zeroed\notherend_id field (not matching actual
  xenstore content) as a sign of\ndevice state reset. It can happen because xenstore
  watch are handled in\nanother thread (xenwatch), which can run in parallel to the
  initial\ndevice probe running at module load. In that case, it would call\ndevice_unregister(),
  which would deadlock against device probe from\nmodule init.\n\nFix this by considering
  dev->otherend_id change only after dev->otherend\nis set (which happen after otherend_id
  is initialized)."
