title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  macb: fix NULL pointer dereference on unbind with fixed-link\n\nWhen the device
  tree describes a fixed-link and has no \"mdio\" child\nnode, macb_mii_init() returns
  early without allocating the MDIO bus,\nleaving bp->mii_bus as NULL.\n\nTwo cleanup
  paths then dereference this NULL bus:\n\n1. On driver unbind, macb_remove() unconditionally
  calls\n   mdiobus_unregister(bp->mii_bus), which oopses:\n\n  Unable to handle kernel
  NULL pointer dereference at virtual address 00000000000004a8\n  pc : mdiobus_unregister+0x14/0xa4\n\
  \  lr : macb_remove+0x38/0xa4\n  Call trace:\n   mdiobus_unregister+0x14/0xa4 (P)\n\
  \   macb_remove+0x38/0xa4\n   platform_remove+0x20/0x30\n   device_release_driver_internal+0x1c8/0x224\n\
  \   unbind_store+0xb4/0xbc\n\n2. On the probe error path in macb_probe(), reached
  when\n   macb_mii_init() has succeeded but a subsequent step fails, the\n   err_out_unregister_mdio
  label runs the same unconditional cleanup.\n\nmdiobus_unregis"
