title: vm2 before 3.11.8 contains a sandbox escape vulnerability in NodeVM that 
  allows attackers to access the host __proto__ getter/setter through 
  console._stdout and console._stderr. Attackers can overwrite 
  EventEmitter.prototype.emit and trigger process events to execute code with 
  process context, bypassing code generation restrictions.
