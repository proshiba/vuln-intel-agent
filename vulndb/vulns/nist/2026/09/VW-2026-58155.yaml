title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  Fix unlocked dereference of dev->desc in i3c_device_get_supported_xfer_mode()\n\n\
  i3c_device_get_supported_xfer_mode() uses dev->desc to obtain the\nmaster controller.\
  \  However, dev->desc must not be dereferenced unless\nbus->lock is held, and this
  function does not take that lock.\n\nThe function only needs access to the master
  controller associated with\nthe device's bus.  Use dev->bus instead, which is always
  valid for the\nlifetime of the device and does not require dereferencing dev->desc."
