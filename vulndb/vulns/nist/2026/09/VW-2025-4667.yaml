title: "Ashlar-Vellum Cobalt LI File Parsing Integer Overflow Remote Code Execution
  Vulnerability. This vulnerability allows remote attackers to execute arbitrary code
  on affected installations of Ashlar-Vellum Cobalt. User interaction is required
  to exploit this vulnerability in that the target must visit a malicious page or
  open a malicious file.\n\nThe specific flaw exists within the parsing of LI files.
  The issue results from the lack of proper validation of user-supplied data, which
  can result in an integer overflow before allocating a buffer. An attacker can leverage
  this vulnerability to execute code in the context of the current process. Was ZDI-CAN-25476."
