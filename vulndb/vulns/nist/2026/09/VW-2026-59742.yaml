title: "Affected versions of MISP expose several state-changing controller actions
  without restricting them to POST.\n\n\nThe affected actions are:\n\n\n\n - EventReportsController::purgeUnusedPictures()\n\
  \n - NoticelistsController::enableNoticelist()\n\n - ServersController::removeOrphanedCorrelations()\n\
  \n - WorkflowsController::rebuildRedis()\n\n\n\n\n\n\nThe patch adds allowMethod(['post'])
  to each action, preventing them from being triggered through ordinary GET requests.\n\
  \n\nFor purgeUnusedPictures(), the corresponding UI previously used $.get(). The
  fix converts that request to POST and supplies X-CSRF-Token, while the controller
  enables header-only CSRF validation for that AJAX action.\n\n\nBecause GET requests
  can be induced cross-origin through links, images, redirects, or navigation, accepting
  GET for these state-changing operations can let an attacker trigger them using the
  authenticated victim's session.\n\nVersion affected: ≤2.5.45"
