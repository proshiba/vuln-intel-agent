title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/features:
  Reject Get Feature count larger than the output buffer\n\ncxlctl_get_feature() sizes
  its output buffer from the user's\nfwctl_rpc.out_len, but the device is told to
  write\ncxl_mbox_get_feat_in.count bytes into rpc_out->payload, which is a\nseparate
  user-controlled value. Nothing bounds count against out_len, so\na small out_len
  with a large count overflows the kvzalloc()'d buffer.\nA heap OOB write reachable
  from FWCTL_RPC.\n\nReject requests where count exceeds the available payload room,
  before\nallocating."
