title: "In the Linux kernel, the following vulnerability has been resolved:\n\nseg6:
  reset IP6CB after IPv6 decapsulation\n\ndecap_and_validate() pulls the outer SRv6
  headers and makes the inner\npacket the skb network header. The IPv6 control block
  still contains\nvalues collected while parsing the outer packet, including nhoff
  and\nextension-header flags.\n\nEnd.DX6 and End.DT6 route the inner IPv6 packet
  directly to the IPv6\ninput path. An unprivileged user can reach End.DT6 from a
  user and net\nnamespace by installing a local SID and injecting an outer packet
  with\nHop-by-Hop and Destination Options headers followed by an SRH and a\nminimal
  inner IPv6 packet.\n\nThe outer extension headers leave a large nhoff in IP6CB.
  After\ndecapsulation, ip6_protocol_deliver_rcu() uses that stale offset on the\n\
  inner packet and reads beyond the skb head. KASAN reports:\n\n  BUG: KASAN: slab-out-of-bounds
  in ip6_protocol_deliver_rcu\n  ip6_protocol_deliver_rcu+0x1118/0x1450\n  ip6_input_finish+0x11b/0x240\n\
  \  seg6_local_input"
