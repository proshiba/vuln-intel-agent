title: Weaver E-cology contains an unauthenticated SQL injection vulnerability 
  that allows remote attackers to execute arbitrary SQL queries by submitting 
  malicious input through the userIdentifiers GET parameter in the mobile plugin
  endpoint. Attackers can bypass space-based filter controls by wrapping SQL 
  keywords in parentheses to perform UNION-based injection and extract sensitive
  data including administrator credential hashes from the database. Exploitation
  evidence was first observed by the Shadowserver Foundation on 2022-07-28.
