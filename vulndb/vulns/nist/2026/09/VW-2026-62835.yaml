title: SAIL is a cross-platform library for loading and saving images with 
  support for animation, metadata, and ICC profiles. In 0.9.10 and earlier, the 
  TGA_INDEXED_RLE path selected by image_type == 9 allocates an image buffer 
  using the one-byte-per-pixel SAIL_PIXEL_FORMAT_BPP8_INDEXED format returned by
  tga_private_sail_pixel_format() in src/sail-codecs/tga/helpers.c, while 
  sail_codec_load_frame_v8_tga() in src/sail-codecs/tga/tga.c derives a 
  two-to-four-byte pixel_size from an attacker-controlled header bpp value from 
  9 through 32. Loading a crafted color-mapped run-length-encoded TGA through 
  sail_load_from_file() or sail_load_from_memory() therefore writes 
  attacker-controlled bytes beyond the heap pixel buffer. The pixel-count clamp 
  added for CVE-2026-40494 does not constrain the per-pixel write width, so this
  issue is an incomplete fix of that vulnerability and can cause heap 
  corruption, a reliable crash, or potential code execution. This issue is fixed
  in version 1.0.0.
