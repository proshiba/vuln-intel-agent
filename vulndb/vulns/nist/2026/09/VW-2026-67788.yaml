title: "The TFTP server accepts a DATA datagram of any size. The dispatcher rejects
  datagrams shorter than\n\n\n\nfour bytes (nxd_tftp_server.c:1037) and nothing anywhere
  checks an upper bound, in particular not\n\n\n\nagainst the protocol maximum of
  4 + NX_TFTP_FILE_TRANSFER_MAX. Two things follow from that one\n\n\n\nmissing check,
  both reachable before any authentication because TFTP has none.\n\n\n\nThe handler
  passes `nx_packet_length - 4` straight to FileX:\n\n\n\n```c\n\n\n\n/* addons/tftp/nxd_tftp_server.c:1863,
  1889 */\n\n\n\nstatus = nx_packet_copy(packet_ptr, &temp_ptr,\n\n              \
  \          server_ptr -> nx_tftp_server_packet_pool_ptr, NX_WAIT_FOREVER);\n\n\n\
  ...\n\n\n\nfx_file_write(&(client_request_ptr -> nx_tftp_client_request_file),\n\
  \n              packet_ptr -> nx_packet_prepend_ptr + 4,\n              packet_ptr
  -> nx_packet_length - 4);\n\n\n```\n\n\n\n`nx_packet_length` is the length of a
  chain, not of one contiguous buffer, so FileX copies past the\n\n\n\nend of the
  first packet:\n\n\n\n```\n\n\n\nERROR: AddressSanitizer: hea"
