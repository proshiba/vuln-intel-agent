title: OpenClaw for iOS versions >= 2026.7.1 and < 2026.8.11 do not enforce 
  saved Gateway TLS pins in the Control UI. While native connections enforced 
  the saved Gateway fingerprint, the authenticated Terminal and session 
  Dashboard WebViews omitted it. If a user had accepted a Gateway fingerprint, 
  an attacker able to redirect the same host and port and present a different 
  certificate that is accepted by iOS system trust can serve a replacement 
  Control UI page; opening the Terminal or a session Dashboard then allows that 
  page to read the injected Gateway token or password. The stolen credential can
  grant operator access, including reading sensitive Gateway state and invoking 
  host-capable tools. This issue is fixed in 2026.8.11.
