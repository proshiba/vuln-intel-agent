title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  pata_sl82c105: fix bridge revision use-after-free\n\npci_get_slot() returns a referenced
  PCI device. Commit 44c10138fd4b\n(\"PCI: Change all drivers to use pci_device->revision\"\
  ) replaced a\nconfiguration-space read with direct access to the cached revision
  field,\nbut left that access after pci_dev_put(). The bridge may therefore be freed\n\
  before its revision is read.\n\nRead the revision before dropping the reference."
