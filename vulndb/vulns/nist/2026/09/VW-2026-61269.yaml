title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: vgic-v3: take an LPI reference in vgic_v3_save_pending_tables\n\nvgic_v3_save_pending_tables()
  iterates dist->lpi_xa using xa_for_each()\nand dereferences the returned struct
  vgic_irq in the loop body without\nholding a reference on the LPI.\n\nThe xarray
  iterator only provides temporary RCU coverage while looking up\nthe current entry.
  That is not sufficient for this loop body, which reads\nfields from struct vgic_irq
  and performs guest memory accesses before the\niteration completes.\n\nA concurrent
  path can trigger this race: the irqfd cached injection path\n(vgic_its_inject_cached_translation)
  obtains a transient LPI reference\nvia vgic_its_check_cache() without holding kvm->lock,
  vcpu->mutex,\nconfig_lock, or its_lock. If guest ITS DISCARD then drops the cache
  and\nITE references under its_lock, the transient inject reference may become\n\
  the final one. When vgic_put_irq() drops it, the LPI is erased from\nlpi_xa and
  f"
