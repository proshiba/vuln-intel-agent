title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  wait for FR_FINISHED on abort_on_kill to prevent use-after-free\n\nThe abort_on_kill
  path in request_wait_answer() calls fuse_abort_conn()\nand returns without waiting
  for FR_FINISHED.  If fuse_dev_do_write() is\nconcurrently processing the same request
  (FR_LOCKED set), the caller\nfrees req->args while it is still being accessed, causing
  a\nuse-after-free.\n\nFix this by jumping to the existing wait_event(FR_FINISHED)
  instead of\nreturning early.  The wait will not hang because fuse_abort_conn()\n\
  ensures all requests are ended."
