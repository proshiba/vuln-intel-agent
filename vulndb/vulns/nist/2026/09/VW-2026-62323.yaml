title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  s390: Clear fetch destination on faulting arena atomic\n\nSame missing register
  clear as on riscv64. A RMW atomic on an arena pointer\nis converted to BPF_PROBE_ATOMIC
  and gets an exception table entry, but\nbpf_jit_probe_atomic_pre() only fills in
  the arena base and the probe\noffset, leaving probe->reg at the -1 that bpf_jit_probe_init()
  set, which\nbpf_jit_probe_post() writes into the entry and ex_handler_bpf() then
  reads\nback as \"there is nothing to clear\".\n\nThat is right for a plain BPF_{ADD,AND,OR,XOR},
  which only writes memory,\nbut an RMW carrying BPF_FETCH also reads the old value
  into a register:\nsrc_reg for BPF_{ADD,AND,OR,XOR} | BPF_FETCH and BPF_XCHG, and
  r0 for\nBPF_CMPXCHG. So on a fault over an unmapped arena page the program resumes\n\
  at the landing pad with whatever that register held before the atomic\ninstead of
  the 0 that every other BPF_PROBE_* access delivers.\n\nFill probe->reg in from bpf_atomic_load_"
