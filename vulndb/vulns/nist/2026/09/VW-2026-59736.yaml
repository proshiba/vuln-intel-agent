title: "Affected versions of MISP allow a collection element to be created from a
  bare UUID without consistently checking whether the acting user is allowed to access
  the referenced object.\n\n\nThe commit explains that collection elements themselves
  only store UUIDs, while the collection view later resolves those UUIDs into their
  underlying objects. Before this fix, the generic add() path could therefore persist
  a UUID for an Event or Galaxy Cluster that the caller could not normally read. The
  patch explicitly notes that this made collections a way to reference another organisation’s
  private data and had caused disclosure of organisation-only events in the beta collection
  view.\n\n\nThe fix centralizes authorization in __assertCanUseElements(). Event
  UUIDs are validated through Event::fetchSimpleEvent() under the current user’s ACL,
  while Galaxy Cluster UUIDs are checked through GalaxyCluster::fetchGalaxyClusters().
  The check is applied both to the CRUD add() path and to addElementToCollection().\n\
  \n"
