title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  initialise error in xfs_defer_finish_one()\n\nxfs_defer_finish_one() declares error
  without an initialiser and only\nassigns it inside the loop over dfp->dfp_work.\
  \  When that list is empty\nthe loop body never runs, control falls through to the
  \"Done with the\ndfp, free it\" path, and the function returns an indeterminate
  value.\n\nAn item-less pending item reaches this through xfs_defer_add_barrier(),\n\
  which xfs_reap_ag_blocks() uses on any CONFIG_XFS_ONLINE_REPAIR kernel.\nxfs_defer_finish_noroll()
  treats any non-EAGAIN return as fatal, so a\nnon-zero stack value turns a successful
  barrier into a\nSHUTDOWN_CORRUPT_INCORE in the middle of a repair.  Zero is the
  correct\nresult: reaching the free path means the item loop drained without a\n\
  non-zero error."
