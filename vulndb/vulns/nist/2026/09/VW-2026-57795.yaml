title: "A missing authorization vulnerability in OpenNMS Horizon allows configuration
  changes without authentication. The Spring Security policy for the /api/v2 REST
  API defines authorization rules for every HTTP method except PATCH, so the shipped
  @PATCH configuration endpoints for event configuration and SNMP data collection
  (which enable and disable event definitions and data-collection sources) are reachable
  with no authorization enforced. An unauthenticated attacker able to reach the web
  UI can disable event definitions and SNMP data collection, suppressing event and
  alarm generation and stopping metric collection - silently degrading monitoring
  and detection - with the change persisted and reloaded into the running system.\n\
  \n\n\nThe solution is to upgrade to Horizon 36.0.4 or newer. Meridian and Horizon
  installation instructions state that they are intended for installation within an
  organization's private networks and should not be directly accessible from the Internet."
