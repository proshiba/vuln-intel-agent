title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  mediatek: pllfh: Fix IO remapping leak in register_pllfhs error path\n\nWhen mtk_clk_register_pllfhs
  function fails to register a PLL, it\nunregisters all PLLs and cleans up itself
  in its error path before\nreturning, so the function callers don't need to do it.\n\
  \nBut contrary to mtk_clk_unregister_pllfhs function, that does almost\nthe same
  sequence, it does not free the IO memory mapped on fhctl node,\nleading to a leak.\n\
  \nFix this leak by factorizing the cleanup sequence in a new private\nfunction and
  use it both mtk_clk_register_pllfhs and\nmtk_clk_unregister_pllfhs functions.\n\n\
  Also, change the loop index start value to avoid the -1 operation on\nindex at each
  loop."
