title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm:
  st33zp24: Return zero on status read failure\n\nst33zp24_status() ignores the result
  of the transport read and returns\ndata even when no byte was received. The I2C
  transport, for example,\nskips i2c_master_recv() when the register-select write
  is short or fails,\nleaving data uninitialized. The resulting stack value can be
  interpreted\nas TPM_STS flags and let status checks complete spuriously.\n\nThe
  status callback cannot propagate a transport error. Return zero\nunless recv() reports
  exactly one byte. With no status bits set, callers\nretry or take their existing
  timeout or error path instead of acting on\nan invalid status value.\n\nThis issue
  was found by a static analysis checker and confirmed by manual\nsource review."
