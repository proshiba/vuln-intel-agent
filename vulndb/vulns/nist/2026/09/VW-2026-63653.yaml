title: Joomla Extension - OrdaSoft.com - Authenticated, Privileged Remote Code 
  Execution in OrdaSoft Joomla Gallery extension for Joomla < 6.2.7 - The 
  extensions updateOSGallery(), reached via task=update_osgallery, read a JSON 
  request body and called the value of a method field as a live PHP function, 
  passing the value of a package field as its single argument, with no 
  allow-list or is_callable() check of any kind. Any function name compatible 
  with a single argument was directly reachable, including system, exec, 
  shell_exec, and passthru.
