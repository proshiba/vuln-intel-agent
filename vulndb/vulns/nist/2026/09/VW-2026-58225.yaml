title: "Inclusion of functionality from an untrusted control sphere in the Kiro Powers
  feature in Amazon Kiro IDE before version 0.8.135 might allow remote unauthenticated
  actors to obtain sensitive information from a developer workstation. Crafted repository
  content can cause the agent to modify the workspace settings file, which redirects
  the Kiro Powers registry request to an actor controlled endpoint and sends workspace
  data to that endpoint when the Powers panel is opened.\n\n\n\nTo remediate this
  issue, users should upgrade to Kiro IDE version 0.8.135 or later. Users who opened
  a project in an earlier version should also rotate any credentials that were present
  in that project."
