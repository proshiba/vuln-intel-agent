title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Add checking nr_subbufs to persistent ring buffer validation\n\nSashiko reported
  that the code was using meta->nr_subbufs without making\nsure that it matched the
  nr_pages + 1 on data that was assuming the two\nwere the same.\n\nAdd a check to
  the persistent ring buffer validation code to make sure\nthat the saved nr_subbufs
  matches what we expect."
