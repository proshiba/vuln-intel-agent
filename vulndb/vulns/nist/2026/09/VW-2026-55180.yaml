title: SiYuan before 3.8.2 trusts the attacker-writable text/siyuan clipboard 
  MIME type and skips sanitization in the paste handler, allowing code execution
  in the Node-enabled desktop renderer. Attackers can craft malicious web pages 
  that write to the clipboard, and when pasted into SiYuan, injected scripts 
  execute with full Node.js access through the Electron main process.
