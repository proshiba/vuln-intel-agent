title: A vulnerability was detected in 2FastLabs agent-squad up to 1.1.4. 
  Affected by this vulnerability is the function AgentSquad.routeRequest of the 
  file agent-squad/typescript/src/orchestrator.ts of the component Streaming 
  Agent Response Workflow. The manipulation results in resource consumption. It 
  is possible to launch the attack remotely. The exploit is now public and may 
  be used. The project was informed of the problem early through an issue report
  but has not responded yet.
