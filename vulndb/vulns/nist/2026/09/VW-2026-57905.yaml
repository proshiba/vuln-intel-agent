title: The Woo PDF Invoice Builder plugin (also distributed as "PDF Builder for 
  WooCommerce") for WordPress is vulnerable to Insecure Direct Object Reference 
  in all versions up to, and including, 2.0.8. This is due to the InspectOrder()
  AJAX handler (woocommerce-pdf-invoice-ajax.php:513), registered on 
  wp_ajax_rednao_wcpdfinv_inspect_order, performing no capability check and no 
  nonce verification before loading an arbitrary order by the attacker-supplied 
  'OrderNumber' POST field and serializing its full WC_Order::get_data() and 
  meta to the response. This makes it possible for authenticated attackers with 
  Subscriber-level access and above to read every WooCommerce order on the site 
  — including billing/shipping address, email, phone number, payment method, 
  gateway transaction ID, and order totals — by iterating order IDs.
