title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  storage: realtek_cr: fix use-after-free on disconnect\n\nrealtek_cr_destructor()
  calls timer_delete() before the chip containing\nthe timer is freed. The timer callback
  may still be running and can\nrearm itself, resulting in a use-after-free.\n\nUse
  timer_shutdown_sync() to wait for the callback and prevent further\nrearming. Do
  this unconditionally because ss_en may be changed after\nthe timer is armed.\n\n\
  Move timer_setup() into init_realtek_cr() so the timer is initialized\nbefore any
  failure path can invoke the destructor.\n\nFound by static analysis."
