title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: bq25890: Fix power_supply reference leak\n\nbq25890_fw_probe() acquires
  a reference to a secondary charger using\npower_supply_get_by_name(), but the reference
  is not released on later\nprobe failures or on driver detach.\n\nIn particular,
  failures after bq25890_fw_probe() returns successfully,\nsuch as a failure in bq25890_hw_init(),
  also leak the reference.\n\nRegister a device-managed cleanup action immediately
  after acquiring\nthe secondary charger. This releases the reference on all subsequent\n\
  probe failures and on driver detach.\n\nFound by code review."
