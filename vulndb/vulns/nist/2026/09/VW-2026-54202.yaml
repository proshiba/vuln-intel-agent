title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  sun8i-ce - Remove crypto_rng interface\n\nSince the crypto_rng interface for hardware
  PRNGs is unused and is\nredundant with hwrng and the actual Linux RNG, it's being
  phased out.\nMost drivers for it were already removed.  Go ahead and remove the\n\
  sun8i-ce support which is one of the only remaining ones.\n\nNote that the sun8i-ce
  support for hwrng remains in place.  That is the\ninterface that actually matters.\n\
  \nAs usual for crypto_rng, this driver was also buggy: its ->generate()\nfunction
  had a use-after-free vulnerability due to using\nwait_for_completion_interruptible_timeout()
  without handling shutting\ndown the DMA operation if a signal is sent.  There's
  no point in fixing\nthis separately only to remove the code anyway, so this commit
  is marked\nwith Fixes and Cc stable."
