title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  stop retrying saturated xattr cache entries\n\next4_xattr_block_set() retries when
  a cache entry selected for reuse\nhas a saturated reference count after taking the
  buffer lock. The retry\nreturns to the mbcache lookup without making that entry
  ineligible, so\nit can select the same unusable entry indefinitely. A task spinning\n\
  there can hold the parent directory's i_rwsem and leave concurrent\nrmdir callers
  blocked.\n\nNormally a reusable entry has a reference count below\nEXT4_XATTR_REFCOUNT_MAX
  because the count and MBE_REUSABLE_B are\nupdated under the same buffer lock. A
  corrupted filesystem can violate\nthat invariant. The syzbot reproducer reports
  allocator and xattr\ncorruption before triggering this retry loop.\n\nCheck the
  untrusted on-disk count before incrementing it, avoiding\noverflow, and clear MBE_REUSABLE_B
  when it is already saturated. The\nnext lookup then skips the entry that was just
  proven unusable. This\nm"
