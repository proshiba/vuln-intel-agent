title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix potential use after free in ib_destroy_srq_user()\n\nWhen accessing a SRQ via
  the netlink path the only synchronization\nmechanism for the said SRQ is rdma_restrack_get().\n\
  Currently, rdma_restrack_del() is invoked at the end of\nib_destroy_srq_user(),
  which is too late, since by that point\nvendor-specific resources associated with
  the SRQ might already be\nfreed. This can leave a short window where the SRQ remains
  accessible\nthrough restrack, leading to a potential use-after-free.\n\nFix this
  by moving the rdma_restrack_begin_del() call to the start of\nib_destroy_srq_user(),
  ensuring that the SRQ is removed from restrack\nbefore its internal resources are
  released. This guarantees that no new\nusers hold references to a SRQ that is in
  the process of destruction.\n\nIn addition, this change preserves the intended inverted
  order\nbetween create and destroy routines: resources are added to\nrestrack at
  the end of succe"
