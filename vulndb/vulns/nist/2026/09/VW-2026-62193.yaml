title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  use wq_has_sleeper() in rds_cong_map_updated()\n\nrds_cong_map_updated() runs after
  a peer's congestion map has been\nrewritten (by rds_tcp_cong_recv() and rds_ib_cong_recv(),
  or the\nclear-all in the loopback and IB send-completion paths).  It bumps\nrds_cong_generation
  and then checks waitqueue_active() on\nmap->m_waitq and on rds_poll_waitq to decide
  whether anyone needs\nwaking.  atomic_inc() carries no ordering and waitqueue_active()
  is a\nplain load, so nothing orders the map and generation stores before\nthe wait
  queue reads.  The waiters do the mirror image: rds_cong_wait()\nadds itself to m_waitq
  and then tests the port bit, and rds_poll()\nregisters on rds_poll_waitq and then
  reads the generation.  That is\nthe store-buffering pattern described above waitqueue_active()
  in\ninclude/linux/wait.h - the updater can observe an empty wait queue\nwhile the
