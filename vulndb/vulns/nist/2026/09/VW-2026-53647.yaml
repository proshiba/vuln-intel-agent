title: ntopng is a web-based network traffic monitoring application. In versions
  6.7.0 through 6.7.260717, two REST v2 endpoints that manage ntopng's tag/badge
  feature — `POST /lua/rest/v2/delete/tag/tag.lua` and `POST 
  /lua/rest/v2/edit/tag/tag.lua` — perform no authorization check at all. Any 
  authenticated user, including a non-administrator ("unprivileged") account, 
  can delete or rename any tag in the system, including tags created by an 
  administrator. Version 6.7.260718 contains a fix.
