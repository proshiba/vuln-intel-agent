title: In NLnet Labs Unbound up to and including 1.26.0, a vulnerability was 
  found in the DNSSEC validator that enables denial of service and possible 
  remote code execution as a result of digesting DNSKEYs. A DNSKEY with an owner
  compression pointer to its own RDATA can overflow the digest buffer. Remote 
  code execution is possible through attacker controlled data. An adversary can 
  exploit the vulnerability by controlling a malicious zone and querying a 
  vulnerable Unbound.
