title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disallow interpreter fallback for arena-related insns\n\nSince the interpreter does
  not support the arena-related insns,\ninterpreter fallback should not be allowed
  for these insns in\ncore.c::__bpf_prog_select_runtime().\n\nCurrently, when the
  interpreter executes the arena ST/LDX/STX insns,\nit would hit the BUG_ON() in ___bpf_prog_run()
  at run time.\n\n[    2.579196] BPF interpreter: unknown opcode a2 (imm: 0x0)\n[\
  \    2.579998] ------------[ cut here ]------------\n[    2.580652] kernel BUG at
  kernel/bpf/core.c:2349!\n[    2.581314] Oops: invalid opcode: 0000 [#1] SMP PTI\n\
  \nSet jit_required as true when arena map is used in the prog to disallow\ninterpreter
  fallback for arena-related insns."
