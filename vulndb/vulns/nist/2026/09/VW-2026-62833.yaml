title: OmniBlocks is a monorepo for the OmniBlocks project. Prior to the June 6,
  2026 workflow remediation, .github/workflows/disc.yml runs for the issues 
  opened event and the issues edited event and invokes the createDiscussion 
  mutation whenever an issue is classified as off-topic, without recording that 
  the issue was already converted or otherwise suppressing duplicate runs. A 
  user who creates one off-topic issue and repeatedly edits its description 
  before conversion completes can therefore cause multiple discussions to be 
  created for the same issue, producing discussion spam and additional 
  moderation work. This issue is fixed with commit 
  627e0f0a16a7d74b09128106b57dd7e85d2545df.
