title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/dasd:
  Guard sysfs discipline callbacks against unallocated private data\n\nSeveral sysfs
  show/store handlers call a discipline callback that\ndereferences device->private,
  either directly or through the\nDASD_DEFINE_ATTR() macro. During dasd_generic_set_online()
  the discipline\nis assigned before check_device() allocates device->private, so
  an\nunprivileged read of one of these world-readable attributes in that window\n\
  dereferences a NULL pointer and panics.\n\nGuard the dereference inside each callback
  that actually touches\ndevice->private."
