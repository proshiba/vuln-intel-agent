  native) format. Prior to versions 1.88.6 and 1.96.2, any authenticated LiteLLM
  proxy user could redirect an outbound provider call to a destination the user 
  controls and cause the proxy to send its configured provider credentials to 
  that destination. Request validation in litellm/proxy/auth/auth_utils.py, 
  litellm/proxy/common_request_processing.py, 
  litellm/proxy/health_endpoints/_health_endpoints.py, 
  litellm/proxy/image_endpoints/endpoints.py, and 
  litellm/proxy/litellm_pre_call_utils.py used incomplete checks that did not 
  cover every sensitive parameter or inspect equivalent values across nested 
  request fields, path values, and bracket-notation form data. Routing and 
