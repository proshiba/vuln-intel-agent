title: "Incorrect privilege assignment in Temporary Elevated Access Management (TEAM)
  for AWS IAM Identity Center solution before version 1.5.1 might allow an authenticated
  remote user with application-level access to read, approve, modify, or revoke arbitrary
  access requests, thereby obtaining unintended temporary elevated access to the AWS
  accounts accessed using the TEAM deployment.\n\n\n\nThis issue has been addressed
  in TEAM version 1.5.1 or later. We recommend upgrading to the latest version and
  ensuring any forked or derivative code is patched to incorporate the new fixes."
