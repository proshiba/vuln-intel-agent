title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-integrity:
  replace forgeable discard filler with a keyed sector marker\n\nThe discard-block
  check in dm_integrity_rw_tag() treats a stored tag\nof all 0xf6 bytes (DISCARD_FILLER)
  as proof a block was discarded and\nskips HMAC verification. allow_discards is only
  accepted in\ndm-integrity's standalone mode. An attacker with raw write access to\n\
  the backing device, but without the integrity key, can stamp any block\nwith an
  all-0xf6 tag and have it served as authentic.\n\nAdd a new \"allow_discards_keyed\"\
  \ target argument that marks discarded\nblocks with a keyed checksum of (salt ||
  sector) instead, computed by\nintegrity_discard_checksum()."
