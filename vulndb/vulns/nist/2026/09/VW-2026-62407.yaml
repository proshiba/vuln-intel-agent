title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  imx6q: fix out-of-bounds write when probed more than once\n\nimx6_soc_volt is allocated
  fresh on every probe, sized to the number of\nARM OPPs:\n\n\timx6_soc_volt = devm_kcalloc(cpu_dev,
  num, sizeof(*imx6_soc_volt),\n\t\t\t\t     GFP_KERNEL);\n\nbut it is filled through
  soc_opp_count, which has static storage and is\nnever reset. A second bind after
  an unbind keeps indexing from where the\nfirst one stopped, and writes past the
  end of the new array.\n\nUnbinding and rebinding the driver on qemu's mcimx6ul-evk,
  under KASAN:\n\n  BUG: KASAN: slab-out-of-bounds in imx6q_cpufreq_probe+0x3b0/0xa34\n\
  \  Write of size 4 at addr c5e90480 by task binder/73\n   imx6q_cpufreq_probe from
  platform_probe+0x88/0xe4\n   platform_probe from really_probe+0x108/0x384\n   bind_store
  from kernfs_fop_write_iter+0x1b4/0x28c\n\nThe write lands one u32 past the end of
  the allocation.\n\nsoc_opp_count is only read a few lines below the loop that fills
  it, so it\nn"
