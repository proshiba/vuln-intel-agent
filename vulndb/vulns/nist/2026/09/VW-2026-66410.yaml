title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.1.2, an authenticated user with agent permissions can supply an arbitrary
  AI analytics run identifier to the ticket summarize endpoint and receive the 
  AI provider error message stored for that run, even if the run belongs to a 
  ticket the agent is not authorized to access. The disclosure is limited to the
  provider error string; ticket content is not exposed. This issue is fixed in 
  version 7.1.2.
