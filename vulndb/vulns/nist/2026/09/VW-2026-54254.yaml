title: In DocsGPT 0.15.0 and below, the application provides a custom prompt 
  feature that allows users to define prompt content used during chatbot 
  interactions. This functionality renders user-supplied prompt data using Jinja
  templates without input sanitization or sandboxing. An unauthenticated 
  attacker can inject malicious template expressions, leading to a server-side 
  template injection (SSTI) vulnerability that can be exploited to achieve full 
  remote code execution (RCE).
