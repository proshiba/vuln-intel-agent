title: Vulnerability involving incorrect access control in the 
  Tools::getRemoteAddr() function in PrestaShop, which allows the client’s IP 
  address to be spoofed via the X-Forwarded-For header when the application is 
  running behind a reverse proxy, load balancer or CDN. The application 
  incorrectly processes the IP address string and uses the address controlled by
  the visitor rather than the one provided by the trusted infrastructure, 
  allowing an unauthenticated remote attacker to cause the application to 
  interpret their connection as originating from an arbitrary IP address. This 
  condition allows IP-based controls, such as the maintenance mode allowlist, to
  be bypassed, as well as enabling the forgery of security and audit logs and 
  the evasion of third-party mechanisms that rely on the IP address, such as 
  geolocation checks, fraud detection or request throttling.
