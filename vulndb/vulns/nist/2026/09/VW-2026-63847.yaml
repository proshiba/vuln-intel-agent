title: "UrlUtil.getBaseUrl builds the absolute URLs in a response — download links,
  icons, asset and API URLs — from the X-Forwarded-Host, X-Forwarded-Proto and X-Forwarded-Prefix
  request headers, with no check on whether the sender was a trusted proxy, falling
  back to the client-supplied Host header.                                       \
  \                                            \n\n                              \
  \                                                                              \
  \                                                                              \
  \    \n\n\nThose responses are cached under keys that do not include the host (extension.json
  since 0.6.0, namespace.details.json since 0.9.0, sitemap since 0.14.5, latest.extension.version.vscode
  since 0.34.2). A single request carrying a forged header therefore places attacker-chosen
  URLs into an entry served to every other client for the lifetime of that entry —
  one hour by default, and cluster-wide where ovsx.redis.enabled is set.\n"
