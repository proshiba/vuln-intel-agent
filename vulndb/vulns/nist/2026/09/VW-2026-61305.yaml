  dat: avoid unaligned fault in IP extraction\n\nIndependent of the alignment of the
  ARP packet in the SKB, either the\nbatadv_arp_ip_src or the batadv_arp_ip_dst will
  have an unaligned access\n(on HW without native unaligned read support).\n\nUse
  get_unaligned() to handle this properly on all architectures."
