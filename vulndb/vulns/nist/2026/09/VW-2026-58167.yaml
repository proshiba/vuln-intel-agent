title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  portman2x4: Check card index validity at probe\n\nAlthough portman2x4 driver has
  a check of the given devptr->id value,\nit doesn't check for a negative id, which
  is often given as \"none\" or\nsuch value when bound via sysfs.  This may lead to
  OOB access for\nindex[] and other parameters.\n\nAdd a sanity check for the card
  index and warn/correct it if it's a\nvalue out of the range."
