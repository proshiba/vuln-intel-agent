title: yshop-crm through 2.1.3 contains an authorization failure in the GET 
  /admin-api/system/user/page endpoint where the @PreAuthorize annotation is 
  commented out, allowing authenticated back-office users without 
  system:user:list permission to enumerate all users. Attackers with valid 
  back-office credentials and a role with data scope ALL can retrieve the 
  complete user directory including login names, nicknames, departments, email 
  addresses, mobile numbers, and last login information.
