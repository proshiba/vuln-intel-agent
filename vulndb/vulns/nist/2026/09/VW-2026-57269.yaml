title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvlan:
  fix skb_under_panic and races when toggling HW VLAN offload\n\nToggling hardware
  VLAN TX offload (NETIF_F_HW_VLAN_CTAG_TX or\nNETIF_F_HW_VLAN_STAG_TX) on a lower
  device invokes vlan_transfer_features(),\nwhich dynamically changed vlandev->hard_header_len.\n\
  \nThis causes two issues:\n1. Lockless TX paths (e.g. packet_snd in af_packet.c,
  ip6_finish_output2)\n   read dev->hard_header_len without holding RTNL lock. Mutating\n\
  \   hard_header_len dynamically under RTNL creates a data race where upper\n   layers
  reserve insufficient headroom based on a stale hard_header_len,\n   resulting in
  skb_under_panic when vlan_dev_hard_header() is called.\n2. In addition, vlan_transfer_features()
  updated hard_header_len without\n   updating header_ops, causing a mismatch between
  allocated headroom\n   and header creation.\n\nAlways setting dev->hard_header_len
  = real_dev->hard_header_len and\ndev->needed_headroom = real_dev->needed_headroom
  + VLA"
