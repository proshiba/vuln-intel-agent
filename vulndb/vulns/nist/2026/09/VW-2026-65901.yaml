title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix heap overflow in DACL owner/group rewrite\n\nWhen id_mode_to_cifs_acl
  rewrites an existing DACL, it allocates a\nbuffer sized according to the on-disk
  DACL length reported by\ndacl_ptr->size. However, replace_sids_and_copy_aces may
  rewrite each\nACE with a new owner/group SID obtained from the cifs.idmap upcall.\n\
  Those SIDs can have up to SID_MAX_SUB_AUTHORITIES (15) sub-authorities,\nmaking
  each ACE up to 76 bytes (sizeof(struct smb_ace)).\n\nIf the original DACL contains
  short SIDs (e.g., 1 sub-authority) while\nthe replacement SIDs are long, the rewritten
  ACEs overflow the\nallocation.\n\nFix this by always budgeting for worst-case SID
  expansion: allocate\nsizeof(struct smb_acl) plus num_aces * sizeof(struct smb_ace),
  which\ncovers the smb_acl header and room for every ACE at maximum SID size.\nThis
  replaces the previous split logic that used dacl_ptr->size for\ncifsacl mounts but
  num_aces * sizeof(struct smb_ace) "
