title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  ice1712: Fix the card leak at probe error with the auto-cleanup\n\nsnd_ice1712_probe()
  performs multiple initialization steps after\nsnd_card_new(), but directly returns
  on failures from later steps\nwithout releasing the ALSA card, causing resource
  leaks when\nprobing fails.\n\nUse snd_devm_card_new() together with scope-based
  cleanup\nvia __free(snd_card_unref), and clear the card pointer after\nsuccessful
  registration to keep it alive."
