title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  reject invalid states in connection template sync records\n\nIPVS sync receivers
  validate protocol states before creating or updating a\nconnection. For connection
  templates, however, they only log states outside\nthe template state range and still
  store the value in the connection.\n\nA template can be returned by ordinary connection
  lookup. TCP and SCTP then\nuse the invalid state as an index into their transition
  tables.\n\nReject invalid template states in both sync protocol versions before\n\
  looking up or modifying a connection. The version 1 path handles both\nIPv4 and
  IPv6 records."
