title: A security vulnerability has been detected in Reader Tools PDF Reader App
  98.8 on Android. The affected element is the function 
  ActSplashNew.handleDeeplink of the component File Handler. The manipulation of
  the argument _display_name leads to path traversal. An attack has to be 
  approached locally. The exploit has been disclosed publicly and may be used. 
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
