title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  buffer: Tie IIO dma fence lock lifetime to the fence\n\nThe `iio_dma_fence` implementation
  currently uses a lock embedded in the\n`iio_dmabuf_priv`. But the `iio_dma_fence`
  can outlive the\n`iio_dmabuf_priv`, which can cause a use-after-free.\n\nTie the
  lifetime of the lock to the lifetime of the fence by embedding them\nin the same
  struct.\n\nWe can't just hold a reference to the `iio_dmabuf_priv` from the\n`iio_dma_fence`
  since `iio_buffer_dmabuf_release()` might sleep and the\nfence release callback
  is not allowed to sleep.\n\nNote that the `dma_fence` framework now has an internal
  lock that gets used\nwhen the passing `NULL` for `lock` in `dma_fence_init()`, but
  in order to\nallow this patch to be backportable use an external lock."
