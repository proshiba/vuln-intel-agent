title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix stale s2s_cp_stateids IDR entry for async COPY\n\nFor an async COPY, nfsd4_copy()
  called nfs4_init_copy_state() before\ndup_copy_fields(), so the s2s_cp_stateids
  IDR was pointed at\n&u->copy->cp_stateid -- memory in the per-rqstp COMPOUND buffer
  that is\nreused by the next request. dup_copy_fields() copies only the value into\n\
  async_copy, so the IDR slot dangled at the transient buffer for the whole\nbackground
  copy. Any IDR walker then dereferences reused request memory:\nthe laundromat reads
  cs_type from it and, if the bytes look like an\nexpired NFS4_COPYNOTIFY_STID, follows
  into\nrefcount_dec()/idr_remove()/kfree() on garbage; manage_cpntf_state() has\n\
  the same exposure via idr_find().\n\nDuplicate the fields first, then register the
  stateid on the stable\nasync_copy. result->cb_stateid is unchanged."
