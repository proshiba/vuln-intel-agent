title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Propagate RX ring init failures in bnxt_init_nic()\n\nbnxt_init_rx_rings() returns
  an error when bnxt_alloc_one_rx_ring()\nfails, but bnxt_init_nic() discards that
  return value and calls\nbnxt_init_chip(), which enables TPA.\n\nIf an allocation
  fails, this could leave rxr->rx_tpa[] partially zeroed\nand TPA would be enabled
  over an array with zeroed entries. This would\nlead to a zeroed DMA address being
  handed out if the agg_idx is\ntranslated to a SW index at a zeroed entry.\n\nFix
  this by propagating the error out of bnxt_init_nic(). Both callers\nalready check
  its return value and unwind with bnxt_free_skbs() and\nbnxt_free_mem(), which tolerate
  a partially initialized RX ring."
