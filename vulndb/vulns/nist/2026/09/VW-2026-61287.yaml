title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  nVMX: Ensure KVM_REQ_GET_NESTED_STATE_PAGES is cleared on VM-Exit\n\nAlways check
  and clear KVM_REQ_GET_NESTED_STATE_PAGES when emulating a\nnested VM-Exit to ensure
  the request is cleared, even when KVM was built\nwith CONFIG_KVM_HYPERV=n, as KVM
  subtly relies on the \"check\" to clear\nthe flag and thus avoid double-mapping
  the vmcs12 pages, e.g. if KVM\nmanages to bail from VM-Enter without processing
  the request, and then\nemulates VMLAUNCH or VMRESUME."
