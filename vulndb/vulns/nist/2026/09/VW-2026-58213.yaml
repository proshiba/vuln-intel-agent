title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  hp-bioscfg: fix off-by-one write in hp_get_string_from_buffer()\n\nhp_get_string_from_buffer()
  clamps the converted string length against\nthe destination buffer size with \"\
  size > dst_size\", so when the\nconverted length is exactly equal to dst_size, conv_dst_size
  is left\nat dst_size and the unconditional NUL terminator write\n\n\tdst[conv_dst_size]
  = 0;\n\nlands one byte past the destination buffer. This is the same shape of\n\
  bug as the previously fixed off-by-one in hp_convert_hexstr_to_str():\nthe buffer
  is sized correctly for the content, but the terminator\nwrite is never checked against
  that size.\n\nFix by changing the comparison to \">=\" so conv_dst_size is always
  left\nwith room for the terminator.\n\nAll fixed-size destinations that reach this
  function (path[512],\ncurrent_value[512], current_password/current_value[64], and
  the\nper-entry buffers in encodings[][512] and prerequisites[][512]) are\naffected."
