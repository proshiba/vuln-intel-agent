title: "Velociraptor stores the compiled VQL in the hunt object internally to avoid
  having to recompile the artifacts for each endpoint in the hunt. Although the field
  \"compiled_collector_args\" is an internal field, Velociraptor allowed the field
  to be set from a user API call. This allows another user who can schedule a hunt
  (minimal role of \"investigator\" ) to set the compiled VQL statements for the hunt
  bypassing any ACL checks that would normally be applied.\n\n\n\n\nThis flaw can
  then be escalated to allow the \"investigator\" user to run arbitrary VQL statements
  as an administrator user on the Velociraptor server."
