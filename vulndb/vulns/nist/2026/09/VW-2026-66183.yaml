title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  safely drain sessions during logoff\n\nSMB3 multichannel allows requests for one
  session to run on multiple\nconnections. Wait for all channels bound to a session
  before freeing\nshared session objects.\n\nA deferred byte-range lock remains counted
  as a running request and only\nwakes when its file closes. Wake blocked locks during
  the drain without\nunpublishing or modifying their file objects. Synchronous CANCEL
  requests\nmust invoke their cancellation callback to wake pending operations, while\n\
  CHANGE_NOTIFY completion remains specific to the asynchronous path.\n\nSerialize
  session teardown with channel registration and previous-session\ncleanup, and use
  atomic work-state transitions so LOGOFF, CANCEL, and\nconnection teardown invoke
  cancellation callbacks only once."
