title: A stack overflow vulnerability was found in gfs2-utils. The hash table 
  traversal code in metawalk.c uses alloca() with an exponentially-derived size 
  from the untrusted on-disk di_depth field without bounds validation. A crafted
  GFS2 filesystem image with a large di_depth value causes stack exhaustion and 
  a denial of service when processed by fsck.gfs2, gfs2_edit, or savemeta.
