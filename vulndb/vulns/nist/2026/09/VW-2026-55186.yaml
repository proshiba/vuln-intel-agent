title: "When guests are terminated, various pieces of cleanup need carrying out.\n\
  The cleaning up of PCI devices which were assigned to guests, and the\nassociated
  removal of tracking structures for IRQs used by the devices\noccurs relatively early
  in the process.  Unfortunately after that point\nthe guest about to be terminated
  could cause its device model (DM) to\nre-establish such tracking structures, by
  having it bind one or more IRQs\nanew.  While some of those tracking structures
  would still be cleaned up\nlater on, at least one would not be."
