title: Hamlib is a ham radio control library for radios, rotators, and 
  amplifiers. Prior to 4.7.2, the unauthenticated rigctld send_raw command on 
  TCP port 4532 reaches rigctl_send_raw() in tests/rigctl_parse.c, which writes 
  a NUL byte at buf[buf_len + 1] outside its 200-byte stack buffer, and 
  rig_send_raw() in src/rig.c, which copies reply_len - 1 bytes instead of the 
  actual nbytes received. A remote client can send the CR terminator with a 
  short payload to trigger both flaws in one command under the default 
  no-password configuration. The out-of-bounds write can crash the daemon or 
  corrupt adjacent stack memory, while the oversized copy can return up to 198 
  bytes of uninitialized stack data to the client. This issue is fixed in 
  version 4.7.2.
