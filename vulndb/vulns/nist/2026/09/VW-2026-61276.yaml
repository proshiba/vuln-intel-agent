title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Fix memory corruption by not reinjecting CK machine checks\n\nChannel-subsystem
  damage machine checks are for the host channel\nsubsystem. The guest channel subsystem
  is emulated in the userspace VMM.\nThere is no point in forwarding such machine
  checks into the guest.\n\nThis also simplifies the machine check reinjection and
  avoids kfree of a\nstack variable as reported by sashiko.  There might be still
  machine\nchecks that have the ck bit set with another bit (like instruction\ndamage),
  mask out the CK bit in s390_backup_mcck_info(), like the CP and\nED bits already
  are."
