title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject load-acquire from pointers requiring fault protection\n\nA BPF_LOAD_ACQ is
  not rewritten to a BPF_PROBE_MEM load by the verifier,\nunlike a regular BPF_LDX,
  so the JIT emits a plain load with no exception\ntable entry and a fault panics
  the kernel instead of being handled.\n\nReject the source pointer types that a BPF_LDX
  would have had that fault\nprotection applied to, i.e. the ones bpf_convert_ctx_accesses()
  turns\ninto BPF_PROBE_MEM: a bare PTR_TO_BTF_ID, PTR_TO_BTF_ID | PTR_UNTRUSTED,\n\
  PTR_TO_BTF_ID | MEM_ALLOC | PTR_UNTRUSTED and PTR_TO_MEM | MEM_RDONLY |\nPTR_UNTRUSTED.\n\
  \nThis is reachable e.g. by loading ->mm out of a trusted task_struct\nyields an
  untrusted pointer to mm_struct, and it is NULL for a kernel\nthread:\n\n  [...]\n\
  \  SEC(\"tp_btf/sched_switch\")\n  int BPF_PROG(demo, bool preempt, struct task_struct
  *prev,\n               struct task_struct *next)\n  {\n      struct mm_struct *mm
  = next->mm;  /* untrusted *"
