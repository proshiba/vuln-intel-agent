title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: Fix info leak and UAF in device unregister path\n\ni3c_master_unregister_i3c_devs()
  clears i3cdev->dev->desc before\ncalling device_unregister().  During device_unregister(),\n\
  device_del() emits a KOBJ_REMOVE uevent and unbinds the driver while\nthe device
  descriptor is still expected to be valid.  As a result,\ni3c_device_uevent() and
  a racing modalias_show() can observe a NULL\ndesc and fall back to an uninitialized
  stack struct i3c_device_info,\nleaking kernel stack contents in the generated modalias.\
  \  Driver\n.remove() callbacks may also encounter an unexpected NULL desc during\n\
  unbind.\n\nKeep desc valid until device_unregister() has completed.  Since\ndevice_unregister()
  drops the device reference and may free the device,\ntake an extra reference with
  get_device() before unregistering.  Clear\ndesc afterwards and release the extra
  reference with put_device().\nThis preserves the release-time invariant that desc
  mus"
