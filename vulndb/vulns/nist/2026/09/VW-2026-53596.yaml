title: LiME through 1.12.0 fails to validate the disk acquisition output path 
  and does not use O_NOFOLLOW when opening the operator-supplied path parameter,
  allowing unprivileged local users to overwrite arbitrary root-owned files. An 
  attacker who controls the output directory can create a symbolic link with the
  expected filename pointing to any root-owned file, and when the acquisition 
  runs in kernel context, LiME follows the link and truncates the target file 
  with the memory acquisition stream.
