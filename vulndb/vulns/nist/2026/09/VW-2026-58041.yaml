title: "Improper restriction of XML external entity references in the RemoteQueryCachePlugin
  in AWS Advanced JDBC Wrapper 3.3.0 through 4.2.0 might allow an actor with write
  access to the shared cache infrastructure to disclose sensitive files from application
  hosts that read cached query results, including stored database and IAM role credentials,
  via crafted XML data in a cached column value.\n\n\n\nTo remediate this issue, users
  should upgrade to version 4.3.0 or later."
