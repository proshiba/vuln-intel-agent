title: Emlog is an open source website building system. In versions 2.6.29 and 
  prior, the emUnZip() function extracts all ZIP entries via 
  ZipArchive::extractTo() without validating entry paths for ../ traversal 
  sequences. Only the first entry's subdirectory structure is checked. An 
  attacker can overwrite arbitrary files on the server filesystem, including 
  config.php for immediate RCE. At time of publication, there are no publicly 
  known patches.
