title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  detect a cycle in the last-kset chain during replay\n\ncache_replay() follows the
  on-media last-kset chain by next_cache_seg_id\nwith no cond_resched(). A forged
  chain that points back into a segment it\nhas already visited makes the replay loop
  follow it forever.\n\nCap the last-kset hops at cache->n_segs; a valid chain visits
  each segment\nat most once."
