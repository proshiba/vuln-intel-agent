title: vm2 versions from 3.11.0 before 3.11.8 fail to protect host TypedArray 
  and ArrayBuffer prototypes from sandbox mutation. Attackers can use 
  prototype-walking primitives to reach and modify host Uint8Array.prototype, 
  %TypedArray%.prototype, and ArrayBuffer.prototype, causing host-created typed 
  arrays to observe attacker-controlled properties after VM.run() returns.
