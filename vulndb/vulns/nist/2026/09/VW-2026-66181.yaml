title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  rate limit unmapped SID errors\n\nA client can include many structurally valid but
  unmapped SIDs in a DACL.\nLogging every mapping failure lets one request generate
  hundreds of kernel\nerror messages.\n\nRate limit the message to prevent an authenticated
  client from flooding\nthe kernel log."
