title: The mysqlnd wire protocol parser reads fields out of server packets 
  before checking that the packet still holds enough bytes for them. A malicious
  or compromised MySQL server can send a truncated packet and make the client 
  read past the end of the packet buffer, which is undefined behaviour and can 
  crash the process.
