title: OpenImageIO is a toolset for reading, writing, and manipulating image 
  files of any image file format relevant to VFX / animation. Prior to versions 
  3.0.16.0 and 3.1.11.0, processing a crafted BMP file through oiiotool or an 
  application linked to OpenImageIO can reach BMP palette handling in 
  src/bmp.imageio/bmpinput.cpp with an empty color table. 
  BmpInput::read_native_scanline then performs an invalid palette read while 
  decoding an RLE-compressed scanline, causing a process crash and denial of 
  service. This issue is fixed in versions 3.0.16.0 and 3.1.11.0.
