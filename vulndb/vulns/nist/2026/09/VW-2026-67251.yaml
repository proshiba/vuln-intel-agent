title: Improper link resolution in the recursive file pull feature of the LXD 
  CLI client in Canonical LXD versions 4.0.2 up to 6.9 (fixed in 4.0.14, 5.0.10 
  and 5.21.8) on Linux allows an attacker with root access inside a virtual 
  machine to write attacker-controlled files or directory trees to arbitrary 
  paths on the client host, with the operator's privileges. The attacker does 
  this by using a modified lxd-agent that returns inconsistent SFTP directory 
  listings and Lstat results.
