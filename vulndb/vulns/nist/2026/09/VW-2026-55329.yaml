title: Insufficient validation of storage engine configuration options in 
  MongoDB Server allows an authenticated user with write privileges to supply 
  crafted parameters during collection creation that override internal storage 
  metadata. This results in an out-of-bounds memory write in the server process,
  causing a denial of service via server crash, with potential for further 
  impact including arbitrary code execution.
