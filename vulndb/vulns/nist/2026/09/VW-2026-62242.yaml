title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvdpa_sim:
  fix cleanup after worker creation failure\n\nvdpasim_create() leaves vdpasim->worker
  as an ERR_PTR when\nkthread_run_worker() fails. The error path then drops the device\n\
  reference, which releases the partially initialized simulator.\n\nvdpasim_free()
  unconditionally passes the worker pointer to\nkthread_destroy_worker(), so the ERR_PTR
  is dereferenced and can trigger\na general protection fault.\n\nStore the worker
  error, clear the pointer, and only clean up the worker\nwhen it was successfully
  initialized. Also make the release path tolerate\npartially initialized objects
  by guarding virtqueue and IOTLB cleanup,\nsince the same release path can be reached
  from other initialization\nfailures.\n\nI found this bug myself, though the patch
  was written with AI assistance."
