title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/pagemap:
  dma-unmap pages before handling migration errors\n\ndrm_pagemap_migrate_unmap_pages()
  relies on the pages array to determine\nwhich pages require DMA unmapping. However,\n\
  drm_pagemap_migration_unlock_put_pages() clears the array as part of its\ncleanup,
  leaving drm_pagemap_migrate_unmap_pages() with no valid page\ninformation if it
  is called afterward.\n\nCall drm_pagemap_migrate_unmap_pages() before\ndrm_pagemap_migration_unlock_put_pages()
  so the pages array remains\nvalid during DMA unmapping."
