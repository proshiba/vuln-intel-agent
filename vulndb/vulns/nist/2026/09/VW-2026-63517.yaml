title: The Wow Elements Addons for Elementor plugin for WordPress is vulnerable 
  to Server-Side Request Forgery in all versions up to, and including, 1.11.2. 
  This is due to the plugin passing user-controlled input from the 'Changelog 
  File' setting directly to the wp_remote_get function without adequate 
  validation or sanitization of the URL. This makes it possible for 
  authenticated attackers, with Contributor-level access and above, to make web 
  requests to arbitrary locations originating from the web application and can 
  be used to query and modify information from internal services.
