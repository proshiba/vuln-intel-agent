title: Internally found bugs present in Thunderbird 154, Thunderbird ESR 153.1 
  and Thunderbird ESR 140.14. Some of these bugs showed evidence of memory 
  corruption or another security-relevant defect and we presume that with enough
  effort some of these could have been exploited. This vulnerability was fixed 
  in Firefox 155, Firefox ESR 115.40, Firefox ESR 140.15, Firefox ESR 153.2, 
  Thunderbird 155, Thunderbird 140.15, and Thunderbird 153.2.
