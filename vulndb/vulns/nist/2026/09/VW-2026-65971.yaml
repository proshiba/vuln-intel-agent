title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngenetlink:
  pin family module during policy dump\n\nThe generic netlink controller's policy
  dump keeps pointers to the target\nfamily's operation and policy tables in its callback
  state.  A dump may be\nsplit across multiple skbs and remain pending after the initial
  request.\n\nNetlink pins the module which owns the dump callback, but in this case\n\
  that is the controller's owner rather than the target family's owner.  The\ntarget
  family can consequently be unregistered and its module unloaded\nwhile a policy
  dump is pending.  Advancing the dump then dereferences\npolicy memory from the unloaded
  module.\n\nTake a reference to the target family's module when the dump starts.\n\
  Drop it from the error and done paths.  This matches the lifetime for which\nthe
  dump context retains the family and policy pointers."
