title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, Jira and Confluence upload 
  tools interpret caller-controlled path arguments on the MCP server and open 
  those files before sending them as attachments. In remote or multi-user 
  deployments, a permitted client can disclose host files without shell or 
  direct filesystem access. The advisory traces the vulnerable input and 
  processing flow through AttachmentsMixin.upload_attachment, 
  AttachmentsMixin.upload_attachments, file_path, file_paths, and jira 
  update_issue, which identify the affected entry points, controls, and code 
  paths. This issue is fixed in version 0.22.0.
