title: vLLM Mooncake connector through 0.29.0 fails to properly manage GPU KV 
  cache block ownership when concurrent child requests share a single transfer 
  ID in prefill/decode disaggregated deployments. Attackers can trigger GPU 
  memory exhaustion by submitting completion requests with multiple prompts, 
  causing orphaned KV cache blocks to accumulate until process restart and 
  eventually preventing legitimate requests from executing.
