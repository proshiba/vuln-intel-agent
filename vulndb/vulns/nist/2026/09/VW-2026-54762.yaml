title: A vulnerability was detected in BookStack up to 26.05.2. Affected by this
  issue is the function AttachmentController::getUpdateForm of the file 
  app/Uploads/Controllers/AttachmentController.php of the component Attachment 
  Edit Endpoint. The manipulation of the argument ID results in improper access 
  controls. The attack may be launched remotely. The exploit is now public and 
  may be used. The patch is identified as 
  4e406c41c4c8060a5795e74c66fb96362e54f400. It is advisable to implement a patch
  to correct this issue.
