title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, 
  JiraUserMixin._lookup_user_by_permissions uses the module-level requests.get 
  function instead of the fetcher's protected session. A caller-controlled 
  public Jira URL can redirect that unhooked request to an internal address, 
  bypassing the redirect checks added for CVE-2026-27826. The advisory traces 
  the vulnerable input and processing flow through 
  JiraUserMixin._lookup_user_by_permissions, requests.get, 
  self.jira._session.get, and _make_ssrf_safe_hook, which identify the affected 
  entry points, controls, and code paths. This issue is fixed in version 0.22.0.
