title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  afs: validate v2 image info bounds\n\nThe AFS v2 parser uses footer[8] to locate
  the image information block\ninside the current erase block, then uses the image
  information\nregion_count to walk entries from a fixed local array. The footer offset\n\
  and region count come from flash contents and are not checked against the\nerase
  block or the local image-info array before use.\n\nReject v2 entries whose image
  information offset would underflow the\nerase block calculation, and reject region
  counts that cannot fit in the\nlocal image-info array before walking region entries."
