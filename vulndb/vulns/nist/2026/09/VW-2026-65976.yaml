title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbootconfig:
  Fix integer overflow in initrd size check\n\nSashiko reported that in get_boot_config_from_initrd(),
  a crafted initrd\nwith a huge bootconfig size (such as 0xFFFFFFFF) can cause the
  pointer\narithmetic:\n\n    data = ((void *)hdr) - size;\n\nto wrap around on 32-bit
  systems (or when pointer subtraction overflows).\nBecause data wraps around, the
  subsequent bounds check:\n\n    if ((unsigned long)data < initrd_start)\n\nevaluates
  to false, bypassing the check. The kernel then calls\nxbc_calc_checksum(data, size),
  which attempts to read 4GB of memory,\nhitting unmapped pages and triggering a fatal
  kernel page fault during\nearly boot. Furthermore, on 64-bit systems with an initrd
  > 4.29 GB, an\nunbounded 32-bit size can similarly bypass the initrd_start check.\n\
  \nFix this by:\n1. Ensuring the initrd is at least large enough to contain the bootconfig\n\
  \   footer and verifying hdr is within the initrd bounds.\n2. Checking that size "
