title: "Use of HTTP Request With Sensitive Query String vulnerability in team-alembic
  AshAuthenticationPhoenix allows someone able to read access logs, proxy logs or
  browser history to recover a single-use sign-in token and authenticate as its owner.\n\
  \nAfter a successful password sign-in, AshAuthentication.Phoenix.Components.Password.SignInForm
  builds the sign_in_with_token path with the freshly issued user.__metadata__.token
  as a query parameter and redirects the browser to it with a GET. The token therefore
  travels in the request line, where web servers, reverse proxies, request telemetry
  and the browser's own history record it, all of which outlive the request and are
  ordinarily less protected than session storage. The redirect destination is restricted
  to a local path, so this is not an open redirect; the exposure is the retention
  of a live credential.\n\nThis issue affects ash_authentication_phoenix: from 1.7.0
  before 2.17.4 and from 3.0.0-rc.0 before 3.0.0-rc.11; ash_authentication: from 3."
