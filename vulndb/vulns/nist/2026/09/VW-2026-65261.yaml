title: DCMTK through 3.7.0 contains a heap over-read vulnerability in 
  ConcatenationLoader that copies pixel data frames without validating the 
  PixelData buffer length against the declared NumberOfFrames. Attackers can 
  craft malicious DICOM instances declaring more frames than the buffer contains
  to trigger heap over-reads that crash the application or leak adjacent heap 
  memory.
