title: githubtoplanguages generates a user's top GitHub languages as an SVG. The
  .github/workflows/discord-issue.yml workflow runs when an issue is opened or 
  closed and interpolates github.event.issue.title directly into the Bash 
  assignment for ISSUE_TITLE before shell parsing. An issue title containing 
  shell command-substitution syntax can therefore execute commands on the GitHub
  Actions runner before the title is included in the Discord notification sent 
  through DISCORD_WEBHOOK. Successful exploitation can manipulate or spoof 
  trusted bot notifications and may expose the Discord webhook secret or other 
  workflow environment data, depending on repository permissions. This issue is 
  fixed by commit 6bf9c3a9cb66c937b9047ca266b3d02f2bb11027.
