title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  synchronize heartbeat callbacks with o2net teardown\n\nPatch series \"ocfs2: harden
  heartbeat teardown races\".\n\nThis series fixes two OCFS2 heartbeat/o2net teardown
  races found by\nKASAN.\n\n\nThis patch (of 2):\n\nHeartbeat callbacks stay registered
  while configfs local-node teardown\nenters o2net_stop_listening().  A node-down
  event can still run through\no2net_disconnect_node() and o2net_set_nn_state() while
  teardown is\ndestroying o2net_wq, so the later queue/flush operations can hit a
  dead\nworkqueue.  KASAN has caught this as a slab-use-after-free in\n__queue_work()
  with the call chain:\n\nKASAN slab-use-after-free in __queue_work+0x56/0xa90\nRead
  of size 4\nCall trace:\n  dump_stack_lvl+0x66/0xa0\n  print_report+0xce/0x630\n\
  \  __queue_work+0x56/0xa90\n  srso_alias_return_thunk+0x5/0xfbef5\n  __virt_addr_valid+0x19f/0x330\n\
  \  kasan_report+0xe0/0x110\n  __queue_delayed_work+0x58/0x1e0\n  queue_delayed_work_on+0xb4/0xc0\n\
  \  o2net_set_nn"
