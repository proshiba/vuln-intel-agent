title: js-yaml is a JavaScript YAML parser and dumper. From 3.0.0 until 3.15.2 
  and 4.3.2, maxTotalMergeKeys in lib/js-yaml/loader.js and lib/loader.js does 
  not count empty mapping sources while processing the merge key <<. An attacker
  can alias a large sequence of empty mappings into many merge targets, causing 
  O(N * K) processing while totalMergeKeys remains unchanged and the configured 
  resource limit is never reached. A relatively small YAML document can 
  therefore cause prolonged CPU consumption in applications that parse untrusted
  YAML, and merge processing is enabled by default on these release lines. This 
  issue is fixed in versions 3.15.2 and 4.3.2.
