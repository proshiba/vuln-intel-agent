title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  xusbatm: don't rely on id table pointer arithmetic\n\nThe current code is broken
  when dynamic ID is involved; in such cases\nusb_device_id parameter of probe lives
  on the heap and the pointer\narithmetic will get an index that is wildly out of
  bound. xusbatm\ninitialize the USB device IDs dynamically so it can just use driver_info\n\
  too.\n\nEven with conversion, xusbatm still cannot support dynamic IDs, so also
  set\nno_dynamic_id."
