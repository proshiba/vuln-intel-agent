title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  Fix potential UAF in pec_store\n\nSashiko reports:\n\nIn pec_store(), a guard(mutex)(&hwdev->lock)
  is taken. If the chip write\noperation returns an error other than -EOPNOTSUPP,
  the code jumps to the\nput label, which calls put_device(hdev). If this drops the
  final reference,\nthe device is freed. When the function then returns, the guard
  cleanup\nfunction runs and attempts to unlock the freed mutex.\n\nUse scoped_guard()
  instead of guard() to avoid the problem."
