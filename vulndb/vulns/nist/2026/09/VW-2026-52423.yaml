title: "URL Redirection to Untrusted Site ('Open Redirect') vulnerability in ash-project
  ash_typescript allows an attacker who controls a path-parameter value to redirect
  a generated client's request, and the credentials attached to it, to an unintended
  route or an external origin.\n\nThe URL builders in lib/ash_typescript/typed_controller/codegen/route_renderer.ex
  replace each :param placeholder with a bare template interpolation and never call
  encodeURIComponent, so the value reaches executeTypedControllerRequest raw. A value
  containing ../ is normalised away by the fetch URL resolver and reaches a different
  route, while ? or # truncates the path and can smuggle or override query parameters.
  For a route whose path begins with a parameter, a value such as /evil.example.com/x
