title: "Catalyst::Seal versions before 0.03 for Perl allow one request to disable
  a path or route a later one past an authorization check via a dispatch memo keyed
  on the request path alone.\n\nCatalyst::Seal replaces the dispatcher's prepare_action
  with a version that memoises how a path resolved: which dispatch type matched, at
  which level, and what was left over as arguments. The key is the request path and
  nothing else. Action roles that match on the method, content type, scheme or query
  make that resolution depend on state the key does not carry, so the memo answers
  for a request it was not built from.\n\nA path that resolves to no action is memoised
  as well, and replaying that entry returns without consulting any dispatch type,
  so no action is set and the request fails. A GET of a path whose action is declared
  POST-only therefore disables that path for every later request, the correct POST
  included. An entry that did resolve replays the level the earlier descent reached.
