title: PassMark PerformanceTest before 11.1 build 1012, BurnInTest before 11.1 
  build 1000, and OSForensics before 11.1 build 1016 contain a privilege 
  escalation vulnerability in DirectIo64.sys that allows local users to issue 
  arbitrary IN and OUT instructions to any x86 I/O port due to missing allowlist
  or port validation on exposed IOCTLs. Attackers can obtain a device handle and
  write to sensitive ports including the PS/2 controller port, CPU reset ports, 
  CMOS configuration ports, and interrupt controller ports to cause an immediate
  system reset or other hardware-level manipulation from a standard user 
  account.
