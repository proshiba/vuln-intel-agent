title: A vulnerability was determined in dbgate up to 7.3.1. The impacted 
  element is the function createLink of the file 
  packages/api/src/controllers/archive.js of the component Archive Link 
  Creation. This manipulation of the argument linkedFolder causes path 
  traversal. The attack may be initiated remotely. The exploit has been publicly
  disclosed and may be utilized. The vendor was contacted early about this 
  disclosure but did not respond in any way.
