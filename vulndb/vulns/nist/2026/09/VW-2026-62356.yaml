title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/dma:
  Restore locking around msi_page_list\n\nUnlike a group's default domain, which is
  always freshly allocated\nand privately owned (iommu_group_alloc_default_domain()),
  VFIO type1's\nlegacy container merges any newly attached group into an existing\n\
  domain whenever their iommu_ops and cache-coherency enforcement match.\n\niommu_dma_get_msi_page()
  only asserts the caller's own group mutex is\nheld (iommu_group_mutex_assert()).
  On an IOMMU that publishes\nIOMMU_RESV_SW_MSI, e.g. ARM SMMU, a VM with two such
  devices assigned\nthrough the legacy container can have their guest drivers probe
  and\nallocate MSIs in parallel; each host-side VFIO_DEVICE_SET_IRQS lands\non a
  different device fd and group mutex, but both devices' domains\nare the same merged
  domain, so both can enter\niommu_dma_get_msi_page() concurrently and corrupt msi_page_list.\n\
  \ncommit 288683c92b1a (\"iommu: Make iommu_dma_prepare_msi() into a\ngeneric operation\"\
  ) dr"
