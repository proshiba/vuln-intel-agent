title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix a TOCTOU race in SCTP_CMD_TIMER_START\n\nThe SCTP_CMD_TIMER_START handler checks
  timer_pending() before calling\ntimer_reduce(). The timer can expire and detach
  between these operations,\ncausing timer_reduce() to rearm the timer without taking
  the association\nreference required for the newly armed timer.\n\nThe timer callback
  later unconditionally drops its association reference,\nwhich can leave the association
  reference count unbalanced and result in\nuse-after-free during association teardown.\n\
  \nUse the return value of timer_reduce() to determine whether the timer was\nactually
  armed. Take the association reference only when timer_reduce()\nsuccessfully starts
  a new timer, closing the race between checking the\ntimer state and rearming it.\n\
  \nThis issue was reported by Nico Yip (@_cyeaa_) working with TrendAI Zero\nDay
  Initiative."
