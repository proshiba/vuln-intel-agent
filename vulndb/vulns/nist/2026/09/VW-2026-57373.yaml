title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.6.27 until 0.11.1, backend/open_webui/utils/tools.py 
  captured a cookie jar from the enclosing connection loop instead of binding it
  to each external tool callable. When multiple tool servers were attached and a
  session or system OAuth connection was processed last, a request to a 
  different server configured for bearer authentication could include the 
  calling user's Open WebUI session cookies, allowing that server's operator to 
  reuse the session and take over the account. This issue is fixed in version 
  0.11.1.
