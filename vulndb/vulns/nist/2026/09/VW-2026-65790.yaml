title: A weakness has been identified in Sanluan PublicCMS up to 6.202506.e. 
  This vulnerability affects the function CmsContentAdminController of the file 
  publiccms-parent/publiccms-core/src/main/java/com/publiccms/controller/admin/sys/SysUserAdminController.java
  of the component exportExcel/exportData. This manipulation of the argument 
  userId/deptId causes authorization bypass. It is possible to initiate the 
  attack remotely. The exploit has been made available to the public and could 
  be used for attacks. The vendor was contacted early about this disclosure but 
  did not respond in any way.
