title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  em28xx: defer audio-only extension registration\n\nThe audio-only path registers
  extensions while probing the primary device.\nFor a dual-TS board, this happens
  before dev_next is created. The duplicate\ndevice inherits is_audio_only and is
  then independently inserted into\nem28xx_devlist.\n\nThe list is intended to contain
  only primary devices: extension operations\nreach the secondary device through dev_next.
  The independently linked\nsecondary can be freed during disconnect while its list
  node remains\nreachable, resulting in a use-after-free.\n\nDefer audio-only extension
  registration to the module-request work item. It\nruns only after probing has completed
  construction of the optional\nsecondary device, so only the primary is registered
  and extension callbacks\nreach the secondary through dev_next."
