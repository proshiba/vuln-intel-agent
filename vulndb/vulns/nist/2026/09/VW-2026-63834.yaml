title: A vulnerability has been found in xuxueli xxl-job up to 3.4.2/3.5.0. This
  vulnerability affects unknown code of the file 
  xxl-job-admin/src/main/java/com/xxl/job/admin/business/controller/JobInfoController.java
  of the component Task Management Interface. The manipulation of the argument 
  name/author leads to cross site scripting. It is possible to initiate the 
  attack remotely. The exploit has been disclosed to the public and may be used.
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
