title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/net:
  don't overconsume buffers when using MSG_TRUNC\n\nWhen a recv/recvmsg is issued
  with MSG_TRUNC and the incoming packet is\nlarger than the provided buffer, the
  net layer returns the full length\nof the packet rather than the number of bytes
  actually copied into the\nbuffer.  As a result, io_uring advances more of the provided
  buffer ring\nthan was actually filled.  Use the actual filled region size to consume\n\
  the buffer, but still return the full size to preserve MSG_TRUNC\nsemantics.\n\n\
  Take care with multishot, because that seems to already truncate the\nconsumption
  based on the available payload size.\n\nThis was reported in https://github.com/axboe/liburing/issues/1619.\n\
  \n[axboe: fold in size_t unsigned fix]"
