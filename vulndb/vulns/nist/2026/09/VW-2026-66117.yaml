title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  don't rewrite bpf_fastcall patterns entered by a jump\n\nmark_fastcall_pattern_for_call()
  must ensure that matched\n\"spill; call; fill\" instruction series is not interrupted
  by a jump.\nOtherwise the rewrite applied by bpf_remove_fastcall_spills_fills()\n\
  is not sound.\n\nRecord the instructions targeted by jumps in\ninsn_aux_data[*].jump_target
  when the CFG is built and use this flag\nto stop growing a pattern at such an instruction.
  Jumps to the first\nspill are fine.\n\nNote that existing insn_aux_data[*].jmp_point
  field can't be reused,\nas it marks subprogram return instructions."
