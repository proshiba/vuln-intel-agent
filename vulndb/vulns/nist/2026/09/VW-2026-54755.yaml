title: A security vulnerability has been detected in jaychouchannel 
  Tourism-Management-System up to 8122bf020d91199eddfff3ee02d1632a70a9a132. 
  Affected by this vulnerability is the function getOption of the file 
  travel/src/main/java/com/controller/CommonController.java. The manipulation of
  the argument tableName/columnName leads to information disclosure. The attack 
  may be initiated remotely. The exploit has been disclosed publicly and may be 
  used. This product uses a rolling release model to deliver continuous updates.
  As a result, specific version information for affected or updated releases is 
  not available. The identifier of the patch is 
  d44ec3aa0bd2a72c8800e3befb0a9a96a6491b86. To fix this issue, it is recommended
  to deploy a patch.
