title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  avoid NULL checkpoint thread access in sysfs\n\ncheckpoint_merge can be enabled
  even when no checkpoint merge thread is\nrunning. A read-only mount is one case:
  f2fs does not start\nf2fs_issue_ckpt there, but ckpt_thread_ioprio is still writable
  through\nsysfs.\n\nThe ckpt_thread_ioprio store path updates the saved ioprio value
  and,\nwhen checkpoint_merge is enabled, calls set_task_ioprio() for the\ncheckpoint
  thread. If cprc->f2fs_issue_ckpt is NULL, that dereferences a\nNULL task pointer.\n\
  \nProtect ckpt_thread_ioprio sysfs writes with s_umount as well, so the\ncheckpoint
  thread cannot disappear under the store path while updating\nits ioprio."
