title: "The ITE it51xxx I2C driver, when operating as an I2C target (slave) in buffer
  mode (CONFIG_I2C_TARGET + CONFIG_I2C_TARGET_BUFFER_MODE), copies host-supplied write
  data into the fixed-size data->target_in_buffer inside its target FIFO interrupt
  handler target_i2c_isr_fifo() in drivers/i2c/i2c_ite_it51xxx.c. The copy loop stores
  to target_in_buffer[i + data->w_index] and only checks data->w_index against sizeof(data->target_in_buffer)
  after the write has already completed, so the bounds check cannot prevent the overflow.\n\
  \nThe running index data->w_index accumulates count bytes on every FIFO-fill interrupt
  of an ongoing transaction and is reset to zero only on a STOP or timeout condition.
