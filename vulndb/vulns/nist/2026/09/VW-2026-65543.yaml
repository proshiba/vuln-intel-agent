title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: sja1105: flower: reject cross-chip redirect\n\ndsa_port_from_netdev() may return
  a valid port from a different switch\nchip. Programming another chip's port index
  into the local hardware\ncauses redirection to the wrong port, or an out-of-bounds
  access if the\nindex exceeds the local chip's port count.\n\nApply a minimal fix
  that adds a check to catch this case and adjusts the\nextack message. When cls->common.skip_sw
  is not set, the operation could\ninstead redirect to the upstream port and let the
  software or upstream\nswitch(es) handle the forward, but that is not addressed here."
