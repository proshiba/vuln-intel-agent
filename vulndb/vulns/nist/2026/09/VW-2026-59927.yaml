title: AVideo through 29.0 contains a blind server-side request forgery 
  vulnerability in the getHeaderContentTypeFromURL function that issues 
  get_headers() calls guarded only by format validation. Authenticated users 
  with canUpload permission can store attacker-chosen URLs as video links, 
  triggering vulnerable function execution on every video watch page render to 
  probe internal hosts using content-type oracles and timing-based detection.
