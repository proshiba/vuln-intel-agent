title: A weakness has been identified in Rizwan17 inventory-management-system up
  to bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. Affected by this vulnerability is
  the function createUserAccount of the file register.php of the component 
  Registration Handler. Executing a manipulation of the argument usertype can 
  lead to improper authorization. It is possible to launch the attack remotely. 
  The exploit has been made available to the public and could be used for 
  attacks. This product takes the approach of rolling releases to provide 
  continious delivery. Therefore, version details for affected and updated 
  releases are not available. The project was informed of the problem early 
  through an issue report but has not responded yet.
