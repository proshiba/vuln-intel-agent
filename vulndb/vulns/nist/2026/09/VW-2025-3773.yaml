title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/niu:
  Niu requires MSIX ENTRY_DATA fields touch before entry reads\n\nFix niu_try_msix()
  to not cause a fatal trap on sparc systems.\n\nSet PCI_DEV_FLAGS_MSIX_TOUCH_ENTRY_DATA_FIRST
  on the struct pci_dev to\nwork around a bug in the hardware or firmware.\n\nFor
  each vector entry in the msix table, niu chips will cause a fatal\ntrap if any registers
  in that entry are read before that entries'\nENTRY_DATA register is written to.
  Testing indicates writes to other\nregisters are not sufficient to prevent the fatal
  trap, however the value\ndoes not appear to matter. This only needs to happen once
  after power up,\nso simply rebooting into a kernel lacking this fix will NOT cause
  the\ntrap.\n\nNON-RESUMABLE ERROR: Reporting on cpu 64\nNON-RESUMABLE ERROR: TPC
  [0x00000000005f6900] <msix_prepare_msi_desc+0x90/0xa0>\nNON-RESUMABLE ERROR: RAW
  [4010000000000016:00000e37f93e32ff:0000000202000080:ffffffffffffffff\nNON-RESUMABLE
  ERROR:      000000"
