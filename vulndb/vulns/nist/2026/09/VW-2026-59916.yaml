title: FreeRDP before 3.31.0 contains an out-of-bounds read vulnerability in the
  URBDRC channel's func_get_ep_desc function that indexes interface arrays by 
  position instead of protocol field InterfaceNumber. A malicious RDP server can
  send a crafted SELECT_CONFIGURATION message with permuted InterfaceNumber 
  values to read past allocated heap memory and crash the client.
