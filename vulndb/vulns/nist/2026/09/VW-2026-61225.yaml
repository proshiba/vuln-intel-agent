title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  qcom: iris: use disable_irq() during power-off\n\nThe IRQ is registered as a threaded
  IRQ.\n\nUsing disable_irq_nosync() in iris_vpu_power_off() does not wait\nfor an
  already queued threaded IRQ handler to complete before\nreturning.\n\nAs a result,
  a threaded IRQ handler may still run after the VPU has\nbeen powered down and access
  hardware registers after power-off.\n\nReplace disable_irq_nosync() with disable_irq()
  so the power-off path\nwaits for any in-flight threaded IRQ handler to complete
  before\nreturning."
