title: 'RabbitMQ is a messaging and streaming broker. Prior to 4.3.5, an authenticated
  user who can bind a queue to a topic exchange and publish to it can use consecutive
  # segments in a binding key to make both topic matchers revisit the same trie-node
  and routing-key-suffix states without memoization. The matcher materializes duplicate
  destinations before deduplication, causing combinatorial CPU work and memory pressure
  that can disrupt routing for all tenants. This vulnerability is fixed in 4.3.5.'
