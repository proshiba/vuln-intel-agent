title: An insecure Apache configuration in ConfigServer Security & Firewall maps
  /usr/bin as CGI programs through the Messenger v3 HTTPS virtual host. A remote
  unauthenticated attacker whose address is blocked can request a mapped 
  executable and run arbitrary commands as the Apache user. The vulnerability 
  affects installations where CSF Messenger v3 and its HTTPS mode are enabled. 
  WebPros addressed the vulnerability in version 16.31.
