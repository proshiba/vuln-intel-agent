title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gud:
  validate TV mode names before creating enum property\n\nThe GUD protocol returns
  TV mode names as fixed-size\nGUD_CONNECTOR_TV_MODE_NAME_LEN entries and requires
  each name to be\nNUL-terminated.\n\ngud_connector_add_tv_mode() currently passes
  each fixed-size entry\ndirectly to drm_mode_create_tv_properties_legacy(), which
  eventually\nreaches drm_property_add_enum() and strlen(). If a device returns an\n\
  entry without a terminating NUL byte, strlen() reads past the end of\nthe slot and
  can run beyond the allocated buffer, triggering an\nout-of-bounds read.\n\nValidate
  that each returned TV mode name contains a NUL terminator\nwithin its fixed-size
  slot before passing it to the DRM property code.\nIf a malformed entry is found,
  reject the device response with -EIO.\n\nThis fixes the out-of-bounds read without
  changing the handling of\nvalid devices, and avoids silently truncating malformed
  protocol data."
