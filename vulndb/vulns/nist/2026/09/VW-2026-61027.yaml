title: The WP Import Export Lite WordPress plugin before 3.9.33 does not 
  validate a user-supplied file path before reading it and copying it into a 
  publicly accessible directory, allowing any user whose role an administrator 
  has granted the WP Import Export Lite WordPress plugin before 3.9.33's import 
  permission to disclose sensitive files from the server, including files 
  located outside the web root. The same code path also relaxes the file-system 
  permissions of any path it is given, whether or not the copy succeeds.
