title: A flaw was found in librsvg. When processing an SVG document containing 
  nested XML inclusions (Xincludes) with duplicate entity declarations, a 
  use-after-free error can occur. This vulnerability arises because the library 
  incorrectly frees an XML entity that is still in use by the parser. An 
  attacker could potentially exploit this to cause a denial of service or 
  execute arbitrary code.
