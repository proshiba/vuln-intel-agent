title: A path traversal vulnerability was found in pulpcore. The content upload 
  API accepts a 'file_url' parameter that allows users with file repository 
  privileges to specify a local file URL for Pulp to download and store. A URL 
  scheme validation check uses a string prefix comparison that only rejects URLs
  beginning with 'file://', but Python's URL parser recognizes the 'file:' 
  scheme without double slashes, creating a mismatch between what is validated 
  and what is dispatched to the file downloader. An authenticated user with 
  low-privilege repository permissions can supply a specially crafted URL using 
  relative path traversal sequences to read any file accessible to the Pulp 
  server process. In deployments that include Pulp Container, successful 
  exploitation allows an attacker to read the container registry token signing 
  private key and forge bearer tokens, granting unauthorized access to all 
  private container repositories in the affected registry.
