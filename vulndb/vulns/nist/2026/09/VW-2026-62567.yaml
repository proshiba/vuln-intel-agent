title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/bnxt_re:
  Clear VM_MAYWRITE on DBR/toggle page mmap\n\nbnxt_re_mmap() rejects VM_WRITE for
  the DBR_PAGE and TOGGLE_PAGE mmap\nflags, but a read-only mapping can still retain
  VM_MAYWRITE. nd later\nbe upgraded with mprotect(PROT_WRITE). This can bypass the
  write check\nthat only runs at mmap time.\n\nClear VM_MAYWRITE before vm_insert_page()
  in the shared DBR/toggle-page\nbranch, matching the existing policy that userspace
  writes are not\nexpected for these pages."
