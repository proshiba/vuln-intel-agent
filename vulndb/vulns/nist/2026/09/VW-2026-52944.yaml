title: sqlparse is a non-validating SQL parser module for Python. Prior to 
  0.6.0, sqlparse.format(sql, reindent=True) and sqlformat --reindent route 
  attacker-controlled parenthesized tuple lists through 
  ReindentFilter._get_offset() in sqlparse/filters/reindent.py, where 
  _flatten_up_to_token() repeatedly rebuilds and joins the statement prefix. 
  Thousands of offset calculations walk an expanding token tree, producing 
  quadratic CPU consumption for inputs that remain below MAX_GROUPING_TOKENS and
  causing request delays, reduced throughput, or worker starvation. This issue 
  is fixed in version 0.6.0.
