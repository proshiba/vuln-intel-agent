title: "Incorrect Authorization vulnerability in ash-project ash_typescript allows
  an unauthorized RPC caller to read attribute values that Ash field policies denied.\n\
  \nWhen a field policy denies an attribute, Ash substitutes %Ash.ForbiddenField{},
  which retains the real value in original_value because embedded resources must remain
  writable, and hides it from Inspect rather than removing it. AshTypescript.Rpc.ResultProcessor
  strips these markers to nil on its template-driven paths, but normalize_primitive/1
  in lib/ash_typescript/rpc/result_processor.ex had no such clause, so a marker fell
  through to the generic struct branch which calls Map.from_struct/1 and serializes
  every key, original_value included. The denied value is returned to the caller inside
  the marker that represents its own denial.\n\nThe simplest trigger is an action
  returning an embedded resource as a map, which routes through normalize_resource_struct/2
  with an empty template. normalize_value_for_json/1 is a public, unguarded en"
