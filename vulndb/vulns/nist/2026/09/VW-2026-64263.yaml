title: A horizontal privilege escalation vulnerability exists in x-ui 0.3.2. An 
  authenticated user can modify the inbound proxy configurations of other users,
  including remark, port, protocol, settings, enabled state, expiry time and 
  traffic quota, by submitting a request referencing the target resource 
  identifier. The update path fails to verify that the target resource belongs 
  to the requesting session user, allowing unauthorized cross-user modification 
  of data.
