title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUDF
  symlink pathComponent header OOB read\n\nudf_symlink_filler() can enter udf_pc_to_char()
  with a partial pathComponent header.\n\nValidate that enough input remains for a
  complete pathComponent header\nbefore accessing it. Reject malformed symlink data
  that would otherwise\nmake udf_pc_to_char() perform an out-of-bounds read."
