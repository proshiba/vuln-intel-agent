  This issue affects some unknown processing of the file 
  App/Common/Conf/config.php of the component Debug Mode. The manipulation of 
  the argument DB_DEBUG results in information disclosure. It is possible to 
  launch the attack remotely. The exploit is now public and may be used. This 
  product takes the approach of rolling releases to provide continious delivery.
