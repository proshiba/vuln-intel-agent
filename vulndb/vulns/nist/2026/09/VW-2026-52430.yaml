title: "Integer Overflow or Wraparound vulnerability in ash-project ash lets an attacker
  corrupt a stored vector and crash later reads of it by submitting a vector with
  more than 65,535 elements.\n\nAsh.Vector.new/1 (lib/ash/vector.ex) encodes a vector
  as <<dim::unsigned-16, 0::unsigned-16>> followed by the element floats, packing
  the element count into a 16-bit field without checking its range. A list of more
  than 65,535 elements wraps the dimension modulo 65,536, so the encoded header records
  a dimension that disagrees with the number of stored floats. from_binary/1 later
  reads binary-size(dim)-unit(32) from the wrapped header, so every read of the corrupted
  value misparses and raises, denying access to the affected record. The fix rejects
  any vector whose dimension exceeds 65,535.\n\nThis issue affects ash: from 2.14.13
  before 3.32.2."
