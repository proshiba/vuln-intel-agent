title: The Fancy Product Designer plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via 'productTitle' in '_fpd_data' Order Item Meta in all 
  versions up to, and including, 6.5.2 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The fpd_save_order AJAX action is registered for 
  unauthenticated users via wp_ajax_nopriv_fpd_save_order with no nonce or 
  capability check, and the strip_tags() sanitization applied at save time is 
  bypassed by submitting JSON unicode escape sequences (e.g. \u003c, \u003e), 
  which json_decode() silently converts back to literal angle brackets when the 
  order is rendered in the admin view.
