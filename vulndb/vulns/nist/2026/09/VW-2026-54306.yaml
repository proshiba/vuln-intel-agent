title: PJSIP is a free and open source multimedia communication library written 
  in C. Prior to commit 4472a31, a stack buffer overflow exists in the 
  PJLIB-UTIL telnet CLI front-end when rendering feedback for an entered command
  line. Several command-line handling paths write an attacker-influenced amount 
  of data into fixed-size buffers without sufficient bounds checking, so a long 
  command line can overflow them. This affects only applications that enable the
  telnet CLI front-end (e.g. pj_cli_telnet_create() / --cli-telnet-port). The 
  telnet CLI is an interactive administration interface with no authentication, 
  so any client able to reach it can already issue arbitrary CLI commands. A 
  malformed or overly long command line can overflow a fixed-size stack buffer 
  while rendering command-line feedback, which may lead to application 
  termination. Because reaching this code already requires access to the 
  unauthenticated CLI, the impact beyond that existing access is limited. 
