title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix UAF in async copy cancel and shutdown\n\nAn async copy could be freed or used
  after free while a teardown caller\n(OFFLOAD_CANCEL, nfsd4_shutdown_copy, nfsd4_cancel_copy_by_sb)
  raced the\ncopy kthread:\n\n  - find_async_copy() bumped copy->refcount but left
  the copy on\n    clp->async_copies, so the reaper's cleanup_async_copy() could run\n\
  \    release_copy_files() concurrently with a cancel/shutdown caller. Both\n   \
  \ put and NULL nf_src/nf_dst without a common lock, double-putting the\n    nfsd_file
  and freeing it early.\n\n  - nfsd4_do_async_copy() set NFSD4_COPY_F_STOPPED before
  its final uses\n    of the copy (nfsd_update_cmtime_attr() on copy->nf_dst,\n  \
  \  nfsd4_send_cb_offload()). nfsd4_stop_copy() treats a set STOPPED bit\n    as
  \"kthread done, skip kthread_stop()\", so a teardown caller ran\n    release_copy_files()
  -- which puts and NULLs nf_dst -- while the\n    kthread still dereferenced it (NULL/UAF).\n\
