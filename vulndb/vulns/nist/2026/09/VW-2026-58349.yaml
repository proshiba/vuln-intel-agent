title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibnvdimm/labels:
  Prevent integer overflow in __nd_label_validate()\n\nThe on-media namespace index
  field nslot is a u32 read from the DIMM\nlabel storage area.  __nd_label_validate()
  bounds it against the config\narea size, but sizeof_namespace_label() returns unsigned,
  so the product\nnslot * label_size is evaluated in 32-bit and wraps modulo 2^32
  before\nthe comparison.  A crafted nslot passes the bound and is then used as the\n\
  loop trip count in nd_label_data_init(), whose memset() walks off the end\nof the
  config_size buffer: an out-of-bounds write.\n\nThe field is not trusted -- it comes
  from the medium, or from userspace\nvia ND_CMD_SET_CONFIG_DATA.  Evaluate the product
  in 64-bit so the bound\ncheck is exact; conforming labels are unaffected.\n\nThe
  check was safe when introduced by commit 4a826c83db4e (\"libnvdimm:\nnamespace indices:
  read and validate\"): it multiplied by sizeof(struct\nnd_namespace_label), a size_t,
