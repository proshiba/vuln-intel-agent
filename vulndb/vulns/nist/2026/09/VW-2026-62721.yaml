title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  atmel-ecc - reject hardware ECDH without a public key\n\nThe hardware ECDH path
  in atmel_ecdh_compute_shared_secret() uses the\nprivate key stored in the device.
  However, the public key is cached only\nafter atmel_ecdh_set_secret() successfully
  generated that private key\nfor the current tfm.\n\natmel_ecdh_generate_public_key()
  already rejects requests when no public\nkey is cached. Add the same check to atmel_ecdh_compute_shared_secret()\n\
  to prevent the device from using a private key that was not generated\nfor the current
  tfm."
