title: "The Bluetooth Classic (BR/EDR) L2CAP receive handler bt_l2cap_br_recv() in
  subsys/bluetooth/host/classic/l2cap_br.c dispatched inbound data PDUs based only
  on the destination channel ID, without checking that the target channel had reached
  the BT_L2CAP_CONNECTED state. A dynamic channel is assigned its RX CID and added
  to the connection's channel list while still in BT_L2CAP_CONNECTING (and later BT_L2CAP_CONFIG)
  — before configuration completes and, for PSMs that require security, before the
  peer is authenticated (l2cap_br_conn_req()).\n\nBecause the channel is already findable
  by bt_l2cap_br_lookup_rx_cid() during this window, a remote peer within radio range
  can send a data PDU addressed to that CID and have it processed on a not-yet-established
  channel. The dispatch keys off channel fields (BR_CHAN(chan)->rx.mode, rx.mps) that
  are only initialized during configuration by l2cap_br_conf(); since channel objects
  are pooled and bt_l2cap_br_chan_del() does not reset rx.mode or the reassem"
