title: "PlaywrightCapture contains a server-side request forgery (SSRF) vulnerability
  in its favicon retrieval functionality. When only_global_lookup is enabled, the
  application validates the initial favicon URL to prevent requests to localhost,
  loopback, or other non-public network addresses. However, redirects followed by
  aiohttp were not subjected to the same validation.\n\n\nAn attacker able to influence
  the content of a page processed by PlaywrightCapture could specify a publicly reachable
  favicon URL that responds with an HTTP redirect to a local or otherwise restricted
  address, such as 127.0.0.1, localhost, or an internal network service. Because aiohttp
  automatically followed the redirect, the resulting request could bypass the application's
  local-address restrictions and cause the PlaywrightCapture host to issue HTTP requests
  to resources that should not be externally reachable.\n\n\nDepending on the services
