title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix NULL deref in tipc_named_node_up() on empty publication list\n\nUser-space applications
  can bind a large number of service addresses to\none or more sockets. Each binding
  of a local-scope service address inserts\none entry (publication) into the TIPC
  name table. If the number of these\npublications exceeds TIPC_MAX_PUBL (65535),
  protocol service types\n(such as node state and link state) are no longer inserted
  into the name\ntable. This causes two issues:\n\n1. User-space applications subscribing
  to node or link up/down events\n   stop receiving notifications.\n\n2. A NULL pointer
  dereference can occur:\n\n   BUG: kernel NULL pointer dereference, address: 00000000000000d0\n\
  \   ...\n   CPU: 0 UID: 0 PID: 0 Comm: swapper/0 Not tainted 7.2.0-rc4-default+
  #5 PREEMPT(full)\n   ...\n   RIP: 0010:tipc_named_node_up (./include/linux/skbuff.h:2251
  net/tipc/name_distr.c:195 net/tipc/name_distr.c:221)\n   ...\n   Call Trace:\n \
  \  <IRQ>\n   ti"
