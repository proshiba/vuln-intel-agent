title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix NULL deref on untransmitted RECONF completion\n\nsctp_process_strreset_outreq(),
  sctp_process_strreset_addstrm_out() and\nsctp_process_strreset_resp() complete a
  pending stream reconfiguration\nrequest by stopping the reconf timer on the transport
  it was sent on:\n\n\tt = asoc->strreset_chunk->transport;\n\tif (timer_delete(&t->reconf_timer))\n\
  \t\tsctp_transport_put(t);\n\nchunk->transport is assigned by __sctp_packet_append_chunk()
  when the\nchunk is appended to an outbound packet, and sctp_outq_flush_ctrl() arms\n\
  the reconf timer at that same point. A request already published in\nasoc->strreset_chunk
  but not yet transmitted has neither, so completing\nit dereferences NULL.\n\nTwo
  ways to get there. sctp_send_asconf_del_ip() sets\nasoc->src_out_of_asoc_ok without
  sending anything when the address being\nremoved is the association's last one,
  and sctp_outq_flush_ctrl() then\nleaves every non-ASCONF control chunk queued; as
  only\ns"
