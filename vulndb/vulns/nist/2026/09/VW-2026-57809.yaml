title: "An\nauthenticated directory traversal vulnerability in file upload functionality
  has\nbeen identified in Archer MR600 (v2, v3 & v5) and TL-MR6400 v8. Due to insufficient
  validation of user-supplied file\ninformation, an authenticated remote attacker
  with access to the affected\nupload functionality could upload a specially crafted
  file and cause it to be\nwritten outside the intended directory. \n\n\n\n\n\nSuccessful\n\
  exploitation could allow an authenticated remote attacker to write files to\nunintended
  locations, potentially overwriting or modifying files\naccessible to the affected
  service; arbitrary code execution has not\nbeen demonstrated."
