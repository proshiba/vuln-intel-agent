title: A vulnerability was determined in Freedesktop Poppler 26.07.0. This 
  affects the function FoFiTrueType::mapCodeToGID of the file 
  fofi/FoFiTrueType.cc. Executing a manipulation of the argument segCnt can lead
  to integer overflow. The attack can be launched remotely. The exploit has been
  publicly disclosed and may be utilized. This patch is called 
  ed2a5538cf0a8d3ff908191eda9b73f91a5f952a. It is advisable to implement a patch
  to correct this issue.
