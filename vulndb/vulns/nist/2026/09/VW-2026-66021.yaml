title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: iscsi: Fix hang for aborted WRITE_PENDING commands\n\nWhen a LUN_RESET aborts
  a WRITE command that is in the\nTRANSPORT_WRITE_PENDING state, the target core sets
  CMD_T_ABORTED and\nwaits for the frontend to finish processing.\n\nIf the initiator
  subsequently sends the remaining dataout PDUs,\n__iscsit_check_dataout_hdr() catches
  the payload, stops the dataout\ntimer if the sequence is final and finally dumps
  the data.  However, the\niSCSI target doesn't trigger the completion process for
  these aborted\ncommands. Because of this, the abort path hangs indefinitely in\n\
  target_put_cmd_and_wait(), leading to a deadlocked target worker thread.\n\nFix
  this by explicitly calling target_complete_cmd() when the final\ndataout PDU is
  received for an aborted WRITE command.\ntarget_complete_cmd() detects the CMD_T_ABORTED
  flag and cleanly routes\nthe command into target_abort_work, allowing the abort
  completion to\nsuccessfully unblo"
