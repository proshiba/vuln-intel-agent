title: "Traefik is a HTTP reverse proxy and load balancer. In versions >= v3.7.0 and
  <= v3.7.11, the Kubernetes ingress-nginx provider mishandles Ingresses that carry
  both an authentication annotation and the nginx.ingress.kubernetes.io/from-to-www-redirect
  annotation. For such Ingresses the provider creates an additional 'sibling' router
  that matches on the host alone, carries only the RedirectRegex middleware, and still
  points at the parent router's protected backend service. Because RedirectRegex is
  not a terminal handler, a request its pattern does not match is forwarded to the
  backend, and because the redirect pattern only accepts a numeric port while Traefik's
  host matcher canonicalizes the authority via net.SplitHostPort, a request with a
  non-numeric or empty port (for example 'Host: www.example.com:x') selects the sibling
  router, misses the redirect, and is proxied to the protected backend with none of
  the Ingress's annotation-derived middlewares applied. This discards not only authent"
