title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix crash passing ERR_PTR to kthread_stop()\n\nevent_test_stuff() calls kthread_run()
  and unconditionally passes the\nreturned task_struct pointer to kthread_stop().
  kthread_run() returns an\nerror pointer such as ERR_PTR(-ENOMEM) when kthread creation
  fails, for\nexample under memory pressure during the boot-time event self-test.\n\
  kthread_stop() then dereferences the invalid pointer, crashing the kernel.\n\nCheck
  the result of kthread_run() before passing it to kthread_stop(). Use\nWARN_ON()
  so that a failure to create the self-test thread does not go\nunnoticed, matching
  the ring-buffer self-test fix in commit\n91542863abad (\"ring-buffer: Fix crash
  passing ERR_PTR to kthread_stop()\")."
