title: A security vulnerability has been detected in GPAC up to f1219cde. 
  Affected by this issue is the function mpgviddmx_process of the file 
  filters/reframe_mpgvid.c of the component MPEG Video Reframer. Such 
  manipulation leads to heap-based buffer overflow. The attack can be executed 
  remotely. The exploit has been disclosed publicly and may be used. Upgrading 
  to version abi-16.23 can resolve this issue. The name of the patch is 
  afca1f1181668d85941d51ed1adf647807d5d975. Upgrading the affected component is 
  recommended.
