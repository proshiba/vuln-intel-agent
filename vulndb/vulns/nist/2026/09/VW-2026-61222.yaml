title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  chips-media: wave5: Resume device before setting EOS flag\n\nSetting the EOS flag
  talks to the firmware via send_firmware_command(),\nwhich accesses VPU registers.
  Both the STREAMOFF path\n(wave5_vpu_dec_job_abort()) and the V4L2_DEC_CMD_STOP path\n\
  (wave5_vpu_dec_stop()) can run while the device is runtime suspended, so\nthose
  register accesses hit powered-down hardware and the SoC raises an\nasynchronous
  SError, panicking the kernel:\n\n  SError Interrupt on CPU3, code 0x00000000bf000000
  -- SError\n   send_firmware_command+0x2c/0x160 [wave5]\n   wave5_vpu_dec_set_bitstream_flag+0x6c/0x80
  [wave5]\n   wave5_vpu_dec_update_bitstream_buffer+0x80/0xec [wave5]\n   wave5_vpu_dec_job_abort+0x44/0xa0
  [wave5]\n   v4l2_m2m_cancel_job+0x110/0x19c [v4l2_mem2mem]\n   v4l2_m2m_streamoff+0x24/0x140
  [v4l2_mem2mem]\n\nResume the device with pm_runtime_resume_and_get() around the
  EOS\nfirmware command and release it with pm_runtime_put_autosuspen"
