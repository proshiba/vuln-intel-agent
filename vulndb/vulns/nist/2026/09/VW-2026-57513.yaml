title: "A stack-based buffer overflow vulnerability exists in the Bosch Sensortec
  BHI360 SensorAPI(C-Library) in versions up to and including commit d6b200416a.\r\
  \n\r\nThe vulnerability is located within the FIFO parsing and debug logging subsystem
  inside the function bhi360_parse_debug_message() in bhi360_parse.c (lines 1852-1875).
  \r\n\r\nThe parser trusts the first payload byte of a debug frame as the message
  length (msg_length) and copies that many bytes into a fixed-size 17-byte stack buffer
  (debug_msg) via memcpy without performing any bounds checking.\r\n\r\nA locally
  or physically positioned attacker (e.g., via a malicious sensor, counterfeit hardware
  module, or a Man-in-the-Middle on the communication bus) can exploit this vulnerability
  by injecting a crafted debug frame with a length byte exceeding 16.\r\n\r\nThis
  corrupts adjacent stack data, including the saved return address.\r\n\r\nFurthermore,
