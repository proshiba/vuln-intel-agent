title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmailbox:
  qcom-cpucp: fix PREEMPT_RT self-deadlock in IRQ handler\n\nqcom_cpucp_mbox_irq_fn()
  calls mbox_chan_received_data() while holding\nchan->lock. Under PREEMPT_RT, spin_lock_irqsave()
  is converted to an\nrt_spinlock (rtmutex-based), which tracks ownership and can
  sleep.\n\nThe callback chain triggered by mbox_chan_received_data() eventually\n\
  reaches mailbox_clear_channel() -> mbox_send_message() -> add_to_rbuf(),\nwhich
  attempts to re-acquire the same chan->lock. Since rtmutex detects\nthe re-entrant
  lock attempt by the same owner, the thread blocks waiting\nfor a lock it already
  holds, causing a permanent deadlock.\n\nThis deadlock manifests as 'irq/N-apss_cpucp_mbox'
  stuck in D state\nwith the following call trace:\n  rt_spin_lock -> mbox_send_message
  -> mailbox_clear_channel ->\n  scmi_rx_callback -> mbox_chan_received_data [<- held
  chan->lock here]\n\nFix by saving chan->cl locally and clearing the HW interrupt
  register\ninsi"
