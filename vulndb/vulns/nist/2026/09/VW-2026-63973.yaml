title: "Email::Sender::Transport::Sendmail versions before 2.602 for Perl allow arbitrary
  command execution on Windows sending a message whose envelope address reaches the
  shell in _sendmail_pipe.\n\nOn MSWin32 the envelope sender and every recipient go
  into a single command string, which open() passes to a shell. Every other platform
  gets the list form, which runs sendmail directly. When the caller supplies no envelope,
  Email::Sender::Simple takes the recipients from the To and Cc headers and the sender
  from the From header.\n\nAn attacker who controls one of those header addresses
  runs commands as the sending process."
