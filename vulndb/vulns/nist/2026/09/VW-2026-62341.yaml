title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-apple:
  Destroy the admin queue on removal\n\nThe admin queue is allocated with blk_mq_alloc_queue()
  but never\ndestroyed. nvme_free_ctrl() only drops the last reference and\nblk_mq_exit_queue()
  and blk_sync_queue() never run: the hctx is never\nmoved to q->unused_hctx_list
  and the timeout timer and work stay armed on\na queue that is about to be freed
  which will eventually oops inside\nblk_mq_timeout_work().\n\nThis can only be triggered
  when the controller fails to come up and is\nthen immediately torn down again which
  is why no one ever ran into this\nbefore.\n\nLet's just copy what the pcie driver
  does: unquiesce and destroy the admin\nqueue before nvme_uninit_ctrl().\n\nWith
  this the following WARN followed by a panic no longer happens:\n\n  WARNING: block/blk-mq.c:4390
  at blk_mq_release+0x194/0x238, CPU#4: kworker/u34:4/119\n  CPU: 4 UID: 0 PID: 119
  Comm: kworker/u34:4 Not tainted 7.2.0-rc1-dirty #248 PREEMPT\n  Hardware name: "
