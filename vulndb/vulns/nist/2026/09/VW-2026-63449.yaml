title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. From 8.0.0 until 8.0.6, a 
  locally supplied detection rule that combines frame inspection without content
  and a transformed match without content can make src/detect-engine-prefilter.c
  select multiple non-prefilter frame engines while preparing signatures for 
  non-prefilter inspection. Loading the crafted rule, including in test mode, 
  can trigger a heap buffer overflow and crash Suricata; network traffic alone 
  cannot reach the flaw. This issue is fixed in version 8.0.6.
