title: WWBN AVideo through 29.0 contains an authentication bypass vulnerability 
  where the stored password hash is accepted as a valid login credential through
  two independent code paths in loginFromRequest() and encryptPasswordVerify(). 
  Attackers who obtain the stored users.password hash value can authenticate as 
  any user by submitting the hash directly to login endpoints, completely 
  bypassing password verification.
