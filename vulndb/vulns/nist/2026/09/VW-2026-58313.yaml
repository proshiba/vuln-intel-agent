title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: cancel pending mlo_pm_work\n\nIf the device is reset, suspended or
  unregistered within that window,\nthe pending work can still run and access vif/bss
  data that may already\nbe freed, or send MCU commands while the firmware is not
  available.\n\nAdd cancel_delayed_work_sync(&dev->mlo_pm_work) in all relevant teardown\n\
  and suspend paths:\n\n - mt7925_mac_reset_work()        (chip reset recovery)\n\
  \ - mt7925e_unregister_device()    (PCIe unbind)\n - mt7925_pci_suspend()      \
  \     (PCIe bus suspend)\n - mt7925_suspend()               (mac80211 suspend)\n\
  \ - mt7925u_suspend()              (USB bus / runtime suspend)\n\nThis ensures the
  work is stopped before the device state becomes\ninvalid."
