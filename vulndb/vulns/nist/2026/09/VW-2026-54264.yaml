title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Validate CRIU-restored IDs before idr_alloc\n\nThe KFD CRIU restore flow restores
  previously saved object IDs from\nuserspace.\n\nFor event restore:\n\n  kfd_criu_restore_event()\n\
  \      -> create_signal_event() / create_other_event()\n          -> allocate_event_notification_slot()\n\
  \              -> idr_alloc(..., *restore_id, *restore_id + 1, ...)\n\nFor BO restore:\n\
  \n  criu_restore_memory_of_gpu()\n      -> idr_alloc(..., bo_priv->idr_handle, ...)\n\
  \nIn both cases, the restored ID comes from userspace-provided CRIU data.\n\nidr_alloc()
  expects the ID range values to fit within signed int\nlimits. If a restored ID is
  larger than INT_MAX, it can trigger a WARN\nin the IDR layer.\n\nA kernel WARN is
  undesirable because it prints a warning trace and may\ncause a panic or reboot on
  systems with panic_on_warn enabled.\n\nSmatch reported these paths as allowing unchecked
  userspace values to\nreach idr_alloc().\n\nAdd INT_MAX validation be"
