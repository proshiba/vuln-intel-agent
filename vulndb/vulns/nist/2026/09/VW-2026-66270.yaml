title: A security flaw has been discovered in Open-Web-Analytics up to 1.8.1. 
  Affected is the function Event::loadFromArray of the file queue.php of the 
  component Remote Event Queue Endpoint. Performing a manipulation results in 
  deserialization. The attack can be initiated remotely. Upgrading to version 
  1.8.2 is able to address this issue. The patch is named 
  78c1222ec0e2119d84684032da1541120a2cdd23. The affected component should be 
  upgraded.
