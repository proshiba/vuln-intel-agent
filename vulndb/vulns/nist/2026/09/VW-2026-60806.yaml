title: 'Vulnerability in the Siebel CRM Development product of Oracle Siebel CRM (component:
  Integration - Scripting).  Supported versions that are affected are 17.0-26.7. Easily
  exploitable vulnerability allows low privileged attacker with network access via
  HTTP to compromise Siebel CRM Development.  Successful attacks of this vulnerability
  can result in unauthorized ability to cause a hang or frequently repeatable crash
  (complete DOS) of Siebel CRM Development as well as  unauthorized update, insert
  or delete access to some of Siebel CRM Development accessible data and  unauthorized
  read access to a subset of Siebel CRM Development accessible data. CVSS 3.1 Base
  Score 7.6 (Confidentiality, Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:H).'
