title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: charger-manager: register regulators before exposing sysfs\n\ncharger_manager_remove()
  and the err_reg_extcon probe error path free each\ncharger regulator with regulator_put()
  before tearing down the power_supply\nsysfs entries (power_supply_unregister()).
  charger_manager_remove() also\ncalls try_charger_enable(cm, false) after the regulator_put()
  loop. A\nconcurrent write to a charger's externally_control sysfs attribute that\n\
  lands between regulator_put() and power_supply_unregister() can run\ncharger_externally_control_store()
  and call try_charger_enable(), which,\nwhen charging is enabled, dereferences the
  already-freed consumer handle.\nWhen charging is enabled, try_charger_enable(cm,
  false) in .remove() also\ndereferences the freed handles directly. Both leave use-after-free
