title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: restore NET_IP_ALIGN in the RX DMA offset\n\nSince the RX path was converted
  to zero-copy, the page pool page is handed\nto the stack directly as the skb head,
  and the offset the DMA engine writes\nat is what determines the alignment of the
  packet headers.\n\nBefore the conversion the payload was copied into an skb obtained
  from\nnapi_alloc_skb(), which reserves NET_SKB_PAD + NET_IP_ALIGN. The\nconversion
  moved the headroom into stmmac_rx_offset() but did not carry\nover NET_IP_ALIGN,
  so on architectures where NET_IP_ALIGN is 2 the IP\nheader now lands misaligned:\n\
  \n  64 (NET_SKB_PAD) + 14 (ethernet) + 20 (IP) = 98\n\nSame for the XDP branch:\n\
  \n  256 (XDP_PACKET_HEADROOM) + 14 (ethernet) + 20 (IP) = 290\n\nOn ARM32 this is
  fatal, because ldm and ldrd trap on unaligned addresses\neven when CONFIG_HAVE_EFFICIENT_UNALIGNED_ACCESS
  is set.\n\nAny received echo request panics the machine, e.g:\n\n  Unhandled fault:
  alignment except"
