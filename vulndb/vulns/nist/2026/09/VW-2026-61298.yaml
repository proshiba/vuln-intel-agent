title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  buffer: Fix potential use-after-free in anonymous buffer release\n\nAn anonymous
  buffer handle holds a reference to the underlying IIO device.\nThe reference is
  dropped in the buffer handle's release function. If the\ndevice has been removed,
  either through unbind or hot-unplug, the buffer\nhandle might hold the last reference.\n\
  \nThe release function takes the mutex for the buffer using a guard, which\nmeans
  the unlock happens after all the code in the function, including\n`iio_device_put()`.
  If the anonymous buffer holds the last reference this\nmight free both the IIO device
  and the buffer, which contains the mutex,\nleading to use-after-free when the mutex
  is unlocked.\n\nFix this by using a scoped guard just around the buffer dmabuf list
  access,\nmaking sure the mutex is unlocked before releasing the IIO device.\n\n\
  Version 10 of the patch that introduced this issue used this exact scheme\nof first
  unlocking and then dropping"
