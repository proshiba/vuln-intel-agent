title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  account classifier filter allocations to memcg\n\nAllocations in the tc classifier
  *_change() paths (filter objects,\nper-CPU counters, and per-filter aux data) use
  plain GFP_KERNEL without\n__GFP_ACCOUNT, allowing unprivileged users to pin kernel
  memory outside\nmemcg charging. The shared tcf_exts_init_ex() action array allocation
  in\ncls_api.c was also uncharged; this patch closes it along with the\nper-classifier
  filter-object/percpu/aux allocations that remain\nunaccounted.\n\nAdd GFP_KERNEL_ACCOUNT
  to:\n- the shared tcf_exts_init_ex() action array (cls_api.c), common to every\n\
  \  filter of every classifier (32 pointers, 256 bytes);\n- the filter-object, per-CPU-counter,
  and per-filter aux allocations in\n  cls_basic, cls_bpf, cls_cgroup, cls_flow, cls_flower,
  cls_fw,\n  cls_matchall, cls_route and cls_u32;\n- the u32_init_knode() replace-path
  knode allocation (cls_u32.c), which\n  allocates the same struct tc_u_knode + "
