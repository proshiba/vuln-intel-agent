title: A flaw has been found in simalexan api-lambda-send-email-ses up to 
  bda6869aa81371d1e872242e74fe7d953edb818d. This issue affects the function 
  SES.sendEmail of the file template.yml of the component API Gateway Endpoint. 
  This manipulation of the argument 
  toEmails/ccEmails/replyToEmails/subject/message causes missing authentication.
  It is possible to initiate the attack remotely. This product is using a 
  rolling release to provide continious delivery. Therefore, no version details 
  for affected nor updated releases are available. The project was informed of 
  the problem early through an issue report but has not responded yet.
