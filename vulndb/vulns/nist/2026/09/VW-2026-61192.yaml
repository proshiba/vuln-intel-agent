title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix folio_nr_pages() race after put in large folio invalidate\n\nOur v6.18 based
  Android system is continuely suffering livelock and bad\npage stat as shown in[1]
  which related to broken xarray slot status. By\ninvestigating big folio operations
  within f2fs, we find below races and\nfix it by get the nr_pages before drop the
  refcount and folio_lock.\n\nf2fs_get_read_data_folio() calls f2fs_folio_put() before\n\
  folio_nr_pages() when invalidating a large folio from the page cache.\nThat unlocks
  the folio and drops the caller reference, leaving a window\nwhere a concurrent truncate
  or folio split can shrink the compound folio\nor free it before the invalidate range
  is computed. An undersized range\nthen leaves split sub-folios in mapping->i_pages,
  which can later\ninteract badly with truncate and reclaim (stale xarray entries
  and bad\npage state when folio->mapping no longer matches the mapping being\ntruncated).\n\
  \n[1]\nPID: 2594   "
