title: "Insufficient HTML sanitization in the Publisher Portal and Developer Portal
  allows untrusted user input to be rendered without proper encoding or neutralization.
  This enables the injection and execution of malicious JavaScript when affected API
  documents are viewed.\n\nSuccessful exploitation may result in the execution of
  malicious scripts within the user's browser context when viewing API documentation.
  Users with permissions to access the API documentation through these portals may
  be impacted, potentially allowing attackers to perform actions on behalf of the
  user, depending on their session privileges."
