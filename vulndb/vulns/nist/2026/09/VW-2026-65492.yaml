title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  validate inline dentry name lengths before conversion\n\nInline dentry conversion
  copies names out of the inline dentry area\nbefore checking that each recorded name
  length fits in the available\nfilename slots.\n\nA corrupted image can therefore
  make the conversion path read past\nthe inline filename storage while building the
  regular dentry block.\n\nValidate each inline dentry name length against the inline
  filename\narea before copying it."
