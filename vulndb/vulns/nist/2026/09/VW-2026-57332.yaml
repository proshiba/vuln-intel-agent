title: A vulnerability in the Thesycon DPC Latency Checker driver (dpc.sys) thru
  1.4.0 allows local unprivileged users to cause a denial-of-service (BSOD) 
  condition on Windows systems. The driver exposes an IOCTL interface 
  (0x81772008) that accepts user-controlled input without validating pointers 
  before passing them to kernel APIs. Specifically, it dereferences a 
  user-supplied pointer and uses the resulting value in a call to 
  ExSetTimerResolution, leading to an arbitrary kernel memory access. Exploiting
  this flaw results in a system crash.
