title: A weakness has been identified in GNU Binutils 2.47. This impacts the 
  function elf_link_add_object_symbols of the file bfd/elflink.c. Executing a 
  manipulation can lead to null pointer dereference. The attack needs to be 
  launched locally. The exploit has been made available to the public and could 
  be used for attacks. The project was informed of the problem early through a 
  bug report but has not responded yet.
