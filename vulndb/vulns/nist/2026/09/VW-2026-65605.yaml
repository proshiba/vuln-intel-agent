title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  spi-qcom-qspi: Fix incomplete error handling in runtime PM\n\nThe runtime PM functions
  had incomplete error handling that could leave the\nsystem in an inconsistent state.
  If any operation failed midway through\nsuspend or resume, some resources would
  be left in the wrong state while\nothers were already changed, leading to potential
  clock/power imbalances.\n\nReorder the suspend/resume sequences to avoid brownout
  risk by ensuring the\nperformance state is set appropriately before clocks are enabled
  and clocks\nare disabled before dropping the performance state.\n\nFix by adding
  proper error checking for all operations and using goto-based\ncleanup to ensure
  all successfully acquired resources are properly released\non any error."
