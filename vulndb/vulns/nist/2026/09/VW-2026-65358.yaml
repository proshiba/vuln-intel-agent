title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix boot panic with CONFIG_DEBUG_VM and HVO bootmem pages\n\nPatch series \"mm:
  Refactor bootmem gigantic hugepage allocation\", v4.\n\nThis series is split out
  from the earlier larger series \"mm: Generalize\nHVO for HugeTLB and device DAX\"\
  \ [1].  It collects the first 19 patches of\nthat series as a standalone set of
  fixes and preparatory cleanups around\nbootmem HugeTLB handling, sparse initialization
  ordering, and related\nvmemmap setup.\n\nThe first patches fix a few bugs found
  while reviewing the existing code,\nincluding incorrect bootmem HVO handling, wrong
  vmemmap registration\narguments, a powerpc compound-vmemmap tracking bug, and too-late\n\
  initialization of gigantic bootmem HugeTLB struct pages.\n\nThe rest of the series
  reorders early memory initialization so the\nrelevant zone state is available before
  sparse and HugeTLB boot-time setup\nruns, then simplifies the remaining bootmem
  gigantic hugepage allocation\npat"
