title: Feast is the open source feature store for AI and machine learning. Prior
  to 0.65.0, .github/workflows/pr_integration_tests.yml uses pull_request_target
  with the synchronize event and preserves ok-to-test, approved, or lgtm labels 
  across newly pushed commits, allowing a fork contributor to obtain approval 
  for a benign revision and then run changed code from refs/pull/${{ 
  github.event.pull_request.number }}/merge through privileged make targets. The
  job exposes GCP, AWS, and Snowflake credentials to that code, enabling runner 
  code execution, credential disclosure, and possible access to downstream cloud
  resources. An external label-removal integration could mitigate the condition,
  but no repository workflow provided that protection. This issue is fixed in 
  version 0.65.0.
