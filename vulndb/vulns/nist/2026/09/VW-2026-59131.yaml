title: "Ekia File Manager 1.2.7 exposes com.ekia.filecontrolmanager.OpenFileProvider
  as an exported Android ContentProvider without requiring caller permissions.\n\n\
  The provider maps the caller-controlled URI path directly to a filesystem path and
  passes it to new File(...). It then supports query(), openFile(), and delete() operations.
  Because the provider is exported and lacks android:permission, android:readPermission,
  or android:writePermission, another local application can access the provider authority
  and cause File Manager's process to read, create, overwrite, or delete files that
  are accessible to that process."
