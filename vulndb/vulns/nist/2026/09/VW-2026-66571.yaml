title: OpenClaw is an npm-distributed agent runtime. In versions >= 2026.2.26 
  and < 2026.7.1, PowerShell command analysis on Windows hosts running in exec 
  allowlist mode could approve an exact executable resolved from PATH but 
  subsequently execute a same-named executable located in the workspace 
  directory. If lower-trust content can place an executable with an approved 
  basename into an agent-writable workspace and steer an approved PowerShell 
  command that uses a bare executable name, OpenClaw may run the workspace file 
  instead of the allowlisted path, executing arbitrary code with the privileges 
  of the Gateway or node-host user. The issue does not require replacement of 
  the approved executable itself. Version 2026.7.1 contains a fix; as a 
  workaround, avoid bare executable names in approved PowerShell commands and 
  keep executable files out of agent-writable workspaces.
