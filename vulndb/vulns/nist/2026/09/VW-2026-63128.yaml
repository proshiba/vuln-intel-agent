title: OpenCVE is a vulnerability intelligence platform. Prior to 3.0.0, OpenCVE
  notification testing for Webhook and Slack integrations does not sufficiently 
  validate user-supplied HTTP or HTTPS destinations. An authenticated user with 
  permission to configure notification channels can trigger requests to hosts 
  reachable from the OpenCVE server, including internal network resources, 
  localhost interfaces, link-local addresses, and cloud metadata services, and 
  retrieve information from reachable HTTP services. This issue is fixed in 
  version 3.0.0.
