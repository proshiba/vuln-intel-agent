title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ipu6: Do not free aux device pdata after init\n\nipu6_bus_initialize_device() stores
  the isys/psys pdata pointer in\nstruct ipu6_bus_device and initializes the auxiliary
  device. After that\npoint, error unwinding must drop the auxiliary device reference
  and let\nipu6_bus_release() free both the bus device and adev->pdata.\n\nThe isys
  and psys init paths already call put_device() when MMU\ninitialization fails, and
  ipu6_bus_add_device() calls\nauxiliary_device_uninit() on auxiliary_device_add()
  failure. Both paths\ntherefore run the bus release callback. The extra kfree(pdata)
  in the\ncallers can release the same object a second time.\n\nRemove the manual
  pdata frees after the auxiliary device has been\ninitialized.\n\nThis issue was
  found by a static analysis checker and confirmed by\nmanual source review."
