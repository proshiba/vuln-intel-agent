title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: reject duplicate wiphy cipher suite entries\n\nDuplicate entries in wiphy->cipher_suites
  do not describe any\nadditional capability, but cfg80211 currently accepts them
  and leaves\nindividual consumers to deal with them.\n\nOne such consumer is the
  WEXT compatibility code, which appends a WEP\nkey length for each WEP cipher entry
  it sees. Repeated WEP entries can\ntherefore overflow the fixed iw_range::encoding_size
  array returned by\nSIOCGIWRANGE.\n\nReject duplicate cipher suite entries in wiphy_register()
  instead.\nThis keeps the cipher suite invariant in one place and makes malformed\n\
  wiphy descriptions fail early with -EINVAL, rather than relying on a\nsingle cfg80211
  user to handle duplicates correctly."
