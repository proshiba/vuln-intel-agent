title: OpenClaw (npm package 'openclaw') before 2026.7.1 is vulnerable to a 
  time-of-check time-of-use race condition in OpenShell local mirror filesystem 
  mutation operations. The remove, mkdir, and rename operations could act on a 
  different filesystem target after OpenClaw completed its sandbox path-safety 
  check, if the path is changed concurrently. An attacker able to win the race 
  can cause a sandboxed operation to delete, create, or rename a host path 
  outside the intended mirror root with the permissions of the OpenClaw process 
  user. This does not require an operator to have granted host filesystem access
  outside the sandbox. The issue is fixed in 2026.7.1.
