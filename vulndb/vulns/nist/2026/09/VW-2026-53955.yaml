title: Improper OCSP response validation in the Snowflake Python, Go, JDBC, and 
  Node.js drivers allowed a revoked TLS certificate to be accepted as valid, 
  because OCSP responses were not reliably bound to the certificate being 
  validated and definitive verification failures were treated as transient. A 
  man-in-the-middle attacker holding a revoked certificate and its private key 
  for a Snowflake or stage hostname could cause the driver to establish a TLS 
  session to the attacker-controlled endpoint anyway, allowing the attacker to 
  read and modify data transmitted within that connection. Successful 
  exploitation requires that on-path position and the corresponding private key,
  and impact is limited to data carried within the intercepted connection. The 
  fix is available in the patched versions listed above. Users must manually 
  upgrade.
