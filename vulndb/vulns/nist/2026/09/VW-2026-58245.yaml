title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  plda: Fix use-after-free of event IRQs during teardown\n\nplda_pcie_irq_domain_deinit()
  removes pcie->event_domain via\nirq_domain_remove(), but the per-event IRQs mapped
  from that domain\nare requested with devm_request_irq() in plda_init_interrupts().
  The\nactual free_irq() for a devm-managed IRQ is deferred by devres until\nafter
  the calling probe()/remove() function returns.\n\nThis means irq_domain_remove()
  can free the domain's internal data\nbefore the deferred free_irq() for IRQs still
  mapped into it has run.\nWhen devres later processes that deferred cleanup, it can
  end up\ndereferencing the already-freed domain.\n\nFree each event IRQ explicitly
  with devm_free_irq() before removing\nthe domain. This triggers the free immediately
  and removes the IRQ\nfrom the devres tracking list, so devres will not attempt to
  free it\na second time later.\n\nAlso dispose of the event, INTx, and MSI IRQ mappings
  with\nirq_dispose_mapping()"
