title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  digital: clamp SENSF_RES length to the destination buffer\n\ndigital_in_recv_sensf_res()
  memcpy()s resp->len bytes from a remote\nNFC-F device response into the NFC_SENSF_RES_MAXSIZE-byte
  target.sensf_res\nfield without an upper-bound check. A nearby malicious NFC-F device
  can\nsend an oversized SENSF_RES response to overflow the stack-local struct\nnfc_target.\n\
  \nClamp resp->len to NFC_SENSF_RES_MAXSIZE before the copy.\n\nFound by 0sec automated
  security-research tooling (https://0sec.ai)."
