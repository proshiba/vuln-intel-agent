title: temporalio/sqlparser can panic when Parse, ParseStrictDDL, or ParseNext 
  processes a MySQL version comment whose contents are empty or consist only of 
  one to five decimal digits. ExtractMysqlComment does not check the -1 result 
  returned by strings.IndexFunc before using it as a slice boundary. The 
  resulting Go runtime panic propagates unless the caller recovers it on the 
  parsing goroutine, so applications that parse attacker-controlled SQL can 
  terminate. Temporal Server exposes the affected parser through ListWorkers. 
  When that API is enabled, an authenticated caller with namespace read 
  permission can submit a malformed query that terminates the receiving Matching
  process. Repeated requests can sustain a denial of service. The issue affects 
  availability only; no confidentiality or integrity impact was identified.
