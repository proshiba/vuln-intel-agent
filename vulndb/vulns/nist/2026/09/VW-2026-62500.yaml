title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/dma:
  Check atomic pool allocation result directly\n\nThe non-blocking, non-coherent allocation
  path uses dma_alloc_from_pool(),\nwhich returns the allocated page and fills cpu_addr
  only on success.\n\nDo not rely on cpu_addr to detect allocation failure in this
  path. Check\nthe returned page directly before using it for the IOMMU mapping."
