title: ESF-IDF is the Espressif Internet of Things (IOT) Development Framework. 
  In 5.5.5, 6.0.1, and 6.1, the BlueDroid A2DP sink function 
  btc_a2dp_sink_handle_inc_media() reads a timestamp field from the received 
  media buffer before validating that the packet layout contains the field. A 
  paired BR/EDR audio source within radio range can send a malformed A2DP media 
  packet to a build with BlueDroid Classic Bluetooth and A2DP sink support 
  enabled, causing an out-of-bounds read into adjacent heap memory and limited 
  disclosure of heap contents. Arbitrary memory disclosure and code execution 
  are not established.
