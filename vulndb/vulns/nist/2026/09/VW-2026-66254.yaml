title: The Onion module in AIL Framework contained a performance shortcut in its
  URL extraction logic that accepted URLs as valid .onion targets based solely 
  on a length check (exactly 69 characters) and a suffix check (ending in 
  ".onion"), without performing proper hostname parsing or onion-domain 
  validation. An unauthenticated attacker who could publish or control web 
  content crawled by the framework could embed a crafted URL containing an IP 
  address or non-onion hostname with a path ending in ".onion" that satisfied 
  the length and suffix conditions. Such a URL would be extracted, its domain 
  naively sliced from the string, and queued as a legitimate onion crawler task.
  This allowed unauthenticated content publishers to inject arbitrary non-onion 
  targets into the crawler's task queue, influencing crawler behavior and 
  potentially directing it toward unintended network resources. The 
  vulnerability required no authentication, no user interaction, and only the 
