title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  asus: fix missing hid_is_usb() check\n\nto_usb_interface() can only be used on a
  hid_device whose parent is really\nUSB; uhid can create devices that identify as
  being on BUS_USB, but don't\nactually have a USB parent.\nFix the use of to_usb_interface()
  without a hid_is_usb() check.\n\nI have verified that it is currently possible to
  trigger a kernel splat due\nto this bug in an ASAN build, and that this commit fixes
  the issue."
