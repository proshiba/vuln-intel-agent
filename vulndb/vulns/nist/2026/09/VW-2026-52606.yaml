title: "Improper Validation of Specified Quantity in Input vulnerability in Erlang/OTP
  inets httpc allows a malicious or compromised HTTP server to degrade availability
  by returning a numeric header whose value is a very long run of digits.\n\nhttpc_handler.erl
  converts the server-supplied Content-Length with list_to_integer/1 before comparing
  it against max_body_size, so the size check cannot protect the conversion, and the
  option defaults to nolimit in any case. The same unbounded conversion appears in
  httpc_response:format_response/1 for Content-Length and in httpc_response:get_ms_from_retry_after/1
  for Retry-After, which is guarded only by a check that the first character is a
  digit. A value of up to roughly 1.26 million digits converts successfully and costs
  the requesting process hundreds of milliseconds of arbitrary-precision arithmetic
  per response. The conversion function is documented to accept integers of any size,
  so bounding the input is the caller's responsibility.\n\nThis issue affe"
