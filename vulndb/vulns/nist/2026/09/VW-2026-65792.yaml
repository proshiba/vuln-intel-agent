title: The OpenStation — Desktop Windows, Dock & Virtual Desktops for WP Admin 
  plugin for WordPress is vulnerable to authorization bypass in all versions up 
  to, and including, 1.1.7. This is due to the plugin not properly verifying 
  that a user is authorized to perform an action. This makes it possible for 
  authenticated attackers, with custom-level access and above, to read the 
  title, status, date, permalink, and a 300-character content excerpt of any 
  private, draft, pending, or future post, as well as the content and 
  AI-moderation verdicts of unapproved and spam comments. Any authenticated user
  with the 'read' capability can self-enable the required AI feature by visiting
  the /openstation/ portal and toggling their own ai.enabled setting via the 
  POST /desktop-mode/v1/os-settings endpoint, removing any practical barrier to 
  exploitation.
