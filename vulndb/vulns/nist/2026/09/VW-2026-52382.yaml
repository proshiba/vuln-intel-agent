title: A flaw has been found in sdcb chats up to 1.12.0. This impacts the 
  function DownloadPublic of the file 
  src/BE/web/Controllers/Chats/Files/FileController.cs of the component Signed 
  File Download Endpoint. This manipulation causes missing authentication. 
  Remote exploitation of the attack is possible. The attack's complexity is 
  rated as high. The exploitability is said to be difficult. The exploit has 
  been published and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
