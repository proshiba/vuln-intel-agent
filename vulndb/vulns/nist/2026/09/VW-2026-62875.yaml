title: NetBox Device Type Library is a collection of community-sourced device 
  type definitions for import into NetBox. The absence of tests/init.py and the 
  lack of --import-mode=importlib cause pytest prepend import mode to place the 
  tests directory at the front of sys.path during collection. An unauthenticated
  contributor can add a module such as tests/git.py that shadows GitPython when 
  tests/definitions_test.py executes from git import Git, Repo, or add 
  tests/conftest.py for automatic collection-time execution. Python imports and 
  runs the pull-request module before any test function, allowing arbitrary code
  execution on the GitHub Actions runner, test-result tampering, and access to 
  tokens or network resources exposed to the workflow. This module-shadowing 
  path is independent of the earlier pickle deserialization flaw and the 
  separately tracked NETBOX_DT_LIBRARY_URL issue. This vulnerability is fixed by
  commit b0d9a3dadd0a0a9d3c93b0b2777559fd4bad1037.
