title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  amba-pl011: keep console clock enabled for atomic writes\n\npl011_console_write_atomic()
  runs from nbcon atomic context, where\nsleeping is not allowed. It calls clk_enable(),
  which takes the common-clk\nenable_lock. Under PREEMPT_RT that is a sleeping lock:\n\
  clk_enable_lock() first tries spin_trylock_irqsave(), but on contention\nfalls back
  to spin_lock_irqsave(). Therefore, an atomic-context printk on\nan RT kernel with
  a clk-backed pl011 can trip:\n\n  BUG: sleeping function called from invalid context
  at spinlock_rt.c:48\n    __might_resched from rt_spin_lock\n    rt_spin_lock from
  clk_enable_lock\n    clk_enable_lock from clk_enable\n    clk_enable from pl011_console_write_atomic\n\
  \    ... from vprintk_emit\n\nThis was found and reproduced on PREEMPT_RT. Arm32
  and arm64 DT SoCs are\naffected; arm64 SBSA/ACPI has no clk, so clk_enable(NULL)
  short-circuits\nbefore the lock. In addition, write_atomic() may be invoked from
  NMI\n"
