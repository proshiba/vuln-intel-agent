title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlandlock:
  Require LANDLOCK_ACCESS_FS_MAKE_REG for whiteout creation\n\nWhiteout objects are
  used in the upper layer of an OverlayFS to\nindicate that the file with this name
  does not exist in the unified\nview, even if it is present in one of the lower layer
  file systems.\n\nFor the userspace implementations of OverlayFS (fuse-overlayfs),\n\
  whiteout objects can be created from userspace as well:\n\n* mknod(2) with S_IFCHR
  and makedev(0, 0)\n* renameat2(2) with RENAME_WHITEOUT,\n  creating the whiteout
  in the old place of the moved file.\n\nThis commit guards whiteout creation in both
  of these cases with\nLANDLOCK_ACCESS_FS_MAKE_REG.  Whiteout objects are *not* considered\n\
  character devices and are not bound to a driver.\n\nLANDLOCK_ACCESS_FS_MAKE_REG
  describes the same permission class as a\nwhiteout object: creating one is the only
  S_IFCHR creation that the VFS\nexempts from CAP_MKNOD, so it is as unprivileged
  as creating a regular\nfile"
