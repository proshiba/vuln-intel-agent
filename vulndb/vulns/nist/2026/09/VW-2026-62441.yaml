title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  synchronize input before cleaning up a failed probe\n\nhid_device_io_start() allows
  reports to run concurrently with probe. If\nthe probe subsequently fails, __hid_device_probe()
  releases driver\nresources and clears hdev->driver without first excluding those
  report\ncallbacks.\n\nFor example, a report may enter hidraw_report_event() while
  the failure\npath frees the associated hidraw object, leading to a use-after-free
  when\nthe report takes the object's list lock.\n\nStop input before performing failed-probe
  cleanup. This reacquires\ndriver_input_lock and waits for any report callback already
  in progress."
