title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Correctly cap TLBI Range to the architural limit\n\nTLB Invalidation by Range
  has a fairly powerful way of encoding pretty\nlarge ranges in a small number of
  bits. This range can be based on an\narbitrary VA, which means it is pretty easy
  for a guest to generate an\noverflow should the hypervisor be naive enough to add
  the range to the\nbase...\n\nMake sure the range is capped to the limit dictated
  by the address bit\nthat determines the VA range. For an IPA invalidation, this
  is further\ncorrected down the line to ignore the upper range."
