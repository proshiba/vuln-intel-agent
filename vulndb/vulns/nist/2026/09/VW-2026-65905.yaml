title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fail DACL rewrite when the new DACL exceeds 64K\n\nreplace_sids_and_copy_aces()
  and set_chmod_dacl() accumulate the size of\nthe DACL they build in a u16. That
  accumulator can wrap.\n\nvalidate_dacl() caps num_aces at (dacl_size - sizeof(struct
  smb_acl)) /\n20, i.e. 3276 for a maximally sized DACL, while each rewritten ACE
  can\ngrow to sizeof(struct smb_ace) (76 bytes) once its SID is replaced with\none
  carrying SID_MAX_SUB_AUTHORITIES sub-authorities. The worst case is\ntherefore sizeof(struct
  smb_acl) + 3276 * 76 = 248984 bytes, far beyond\nwhat a u16 can hold. A wraparound
  is reached with 863 ACEs.\n\nAfter the wraparound, ndacl_ptr->size becomes meaningless
  and the offset\nwill point anywhere in the ACE array. As a result, we will see\n\
