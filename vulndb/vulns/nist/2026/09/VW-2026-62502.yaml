title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/bitmap:
  resume array on backlog_store() error path\n\nbacklog_store() suspends the array
  before checking whether a write-mostly\ndevice exists. If no such device exists,
  the error path only unlocks\nreconfig_mutex and leaves the array suspended, blocking
  subsequent I/O.\n\nUse mddev_unlock_and_resume() to release both states."
