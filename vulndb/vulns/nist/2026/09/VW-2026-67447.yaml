title: ZoneMinder before 1.38.4 contains static buffer overflow vulnerabilities 
  in RemoteCameraHttp::GetResponse() that allow malicious HTTP cameras or 
  intercepting attackers to overflow fixed-size buffers by sending oversized 
  response headers. Attackers can send crafted HTTP responses with oversized 
  status messages, Connection headers, Content-Type values, or multipart 
  boundaries to corrupt parser state and crash the capture process or corrupt 
  memory.
