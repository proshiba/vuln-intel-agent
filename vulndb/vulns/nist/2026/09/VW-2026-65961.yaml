title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: use option bits for CFM/MRP frame handlers\n\nCFM and MRP register a global
  br_frame_type whose hlist_node is linked\ninto the per-bridge frame_type_list when
  the first MEP/MRP instance is\ncreated. Enabling the protocol on multiple bridges
  therefore inserts the\nsame node into multiple lists. Unregistering it on one bridge
  then\ncorrupts list state belonging to another.\n\nThese handlers can only be installed
  once per bridge, and they are\nuncommon. Track their per-bridge enable state with
  net_bridge option\nbits, which already live on the Rx hot cache line, and dispatch
  the\nmatching handler directly from the receive path. Check both bits\ntogether
  first as an unlikely case.\n\nRemove the generic frame_type_list and br_frame_type
  helpers, which\nhave had no other users since CFM and MRP were added. That shrinks\n\
  struct net_bridge by 8 bytes and drops the list walk from the fast\npath. When neither
