title: "Apache Airflow Keycloak provider: the unauthenticated token endpoint accepts
  a client-credentials grant for any confidential client registered in the Keycloak
  realm, not only the client configured for Airflow. No allowlist restricts which
  client ids may authenticate, so the credentials of an unrelated application that
  happens to share the realm are valid Airflow login credentials, and Airflow mints
  a signed session token for that application's service account. The endpoint also
  answers unauthenticated credential guesses against Keycloak under Airflow's identity.\n\
  \nAffects deployments using the Keycloak auth manager whose realm is shared with
  other confidential clients. The attacker needs valid credentials for any one of
  those clients, not for Airflow. Resource authorization is still evaluated per subject,
  so the access gained is whatever that service account holds, plus any endpoint gated
  only on being authenticated.\n\nUsers of apache-airflow-providers-keycloak are recommended
  to upgrade"
