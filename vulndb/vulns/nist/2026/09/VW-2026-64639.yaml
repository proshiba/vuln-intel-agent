title: A vulnerability was determined in Mstfakts College-Management-System. 
  This affects the function session_start of the file Front-end/server.php of 
  the component Authentication. Executing a manipulation can lead to session 
  fixiation. It is possible to launch the attack remotely. The exploit has been 
  publicly disclosed and may be utilized. This product takes the approach of 
  rolling releases to provide continious delivery. Therefore, version details 
  for affected and updated releases are not available. The project was informed 
  of the problem early through an issue report but has not responded yet.
