  conditional on an optional cert option, allowing attackers to bypass 
  authentication by submitting unsigned SAML responses. Attackers can post 
  forged SAML responses with arbitrary NameID and attributes to the assertion 
  consumer service endpoint to receive authenticated profiles without valid 
