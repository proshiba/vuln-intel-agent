title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw88: Fix potential memory leak in rtw_txq_push_skb()\n\nThe skb passed to the
  rtw_hci_tx_write() is expected to be freed when\nthe function fails, but the error
  path in rtw_txq_push_skb() does not\nfree the skb before returning. This can lead
  to a memory leak in\nrtw_txq_push() where a dequeued skb is passed to rtw_txq_push_skb()."
