title: 'A vulnerability was determined in GPAC 26.07.0. Affected by this issue is
  the function gf_node_del of the file scenegraph/base_scenegraph.c of the component
  MP4Box. This manipulation causes out-of-bounds read. The attack is restricted to
  local execution. The exploit has been publicly disclosed and may be utilized. Upgrading
  to version abi-16.23 can resolve this issue. Patch name: afca1f1181668d85941d51ed1adf647807d5d975.
  It is advisable to upgrade the affected component.'
