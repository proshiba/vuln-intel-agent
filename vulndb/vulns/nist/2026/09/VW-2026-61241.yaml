title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  platform: mtk-mdp3: Fix SCP device refcounting\n\nmdp_probe() first tries to get
  the SCP handle with scp_get(). When that\nfails, it falls back to looking up the
  SCP platform device with\n__get_pdev_by_id() and then reads its driver data.\n\n\
  The fallback lookup returns the platform device with a reference, just\nlike scp_get()
  does. However, the fallback path currently drops that\nreference immediately after
  platform_get_drvdata(). The driver later\nstill calls scp_put(mdp->scp) unconditionally
  from the probe error path\nand from mdp_video_device_release(), which drops the
  SCP device\nreference again.\n\nKeep the fallback reference until the existing scp_put()
  call, so that\nthe fallback path follows the same ownership rules as the scp_get()\n\
  path."
