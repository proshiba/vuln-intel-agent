title: Steeltoe is an open source project that provides a collection of 
  libraries that helps users build cloud-native applications. From 4.0.0 until 
  4.3.0, ConsulDiscoveryClient constructs ConsulServiceInstance objects by 
  parsing each registration's secure metadata with a strict Boolean conversion. 
  A principal that can register a Consul service can supply a secure value other
  than true or false, causing the exception from one instance to abort 
  construction of the entire instance list and make the targeted service 
  undiscoverable. When GetAllInstancesAsync enumerates all services, one 
  malformed instance can abort enumeration across every service. The outage 
  persists until the offending registration is removed. This issue is fixed in 
  version 4.3.0.
