title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: edif: Fix NULL pointer deref in RX SA delete check\n\nqla_chk_edif_rx_sa_delete_pending()
  obtains the SCSI command via\nGET_CMD_SP(sp) and immediately dereferences cmd->sc_data_direction.\n\
  That command pointer can be NULL: the firmware may post a status\ncompletion for
  a command that has already been returned or aborted.  The\ncaller qla2x00_status_entry()
  acknowledges this on the very same status\npath, re-fetching GET_CMD_SP(sp) and
  bailing out with the \"Command\nalready returned\" message when it is NULL -- but
  that check runs only\nafter qla_chk_edif_rx_sa_delete_pending() has already dereferenced
  the\npointer, so a NULL cmd crashes the kernel in interrupt context.\n\nReturn early
  when cmd is NULL, before touching cmd->sc_data_direction."
