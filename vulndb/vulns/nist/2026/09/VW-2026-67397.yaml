title: The ConvertPlus plugin for WordPress is vulnerable to Deserialization of 
  Untrusted Data in all versions up to, and including, 3.6.3 via the style 
  parameter of the cp_display_preview_modal AJAX action. The vulnerability 
  exists because the action's nonce guard is gated behind an isset() check and 
  fails open when the cp_admin_page_nonce parameter is omitted entirely, no 
  capability check is performed on the callback, and sanitize_text_field() — 
  applied to the $style value before it is concatenated directly into a 
  shortcode string evaluated by do_shortcode() — does not strip shortcode 
  delimiters, allowing an attacker to inject a second, fully attacker-controlled
  [smile_modal] invocation that causes smile_modal_popup() to pass 
  attacker-supplied base64-decoded bytes to maybe_unserialize() with no 
  allowed_classes restriction. This makes it possible for authenticated 
  attackers, with Subscriber-level access and above, to inject a PHP object. No 
