title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: uac: validate rate list length before storing\n\nUAC1 and UAC2 configfs
  rate-list attributes parse a comma-separated\nlist of sampling rates and store each
  parsed value in fixed-size arrays.\nThe arrays have UAC_MAX_RATES entries, but the
  store paths do not check\nthat the input contains at most that many tokens before
  writing through\nopts->name##s[i++].\n\nWriting more than ten rates therefore writes
  past the end of the\np_srates[] or c_srates[] array in struct f_uac1_opts or struct\n\
  f_uac2_opts.\n\nWith CONFIG_UBSAN_BOUNDS enabled, writing an 11-entry rate list
  to the\nUAC1 p_srate attribute reports:\n\n  UBSAN: array-index-out-of-bounds\n\
  \  drivers/usb/gadget/function/f_uac1.c:1669:1\n  index 10 is out of range for type
  'int [10]'\n  __ubsan_handle_out_of_bounds.cold\n  f_uac1_opts_p_srate_store\n \
  \ configfs_write_iter\n  vfs_write\n  ksys_write\n  do_syscall_64\n\nThe same reproducer
  against the UAC2 p_srate attribute reports:"
