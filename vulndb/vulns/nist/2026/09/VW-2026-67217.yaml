title: 'A security flaw has been discovered in dbgate up to 7.3.1. This impacts the
  function zipJsonLinesData of the file packages/api/src/utility/zipJsonLinesData.js
  of the component Create Connection Endpoint. Performing a manipulation of the argument
  filePath results in path traversal. Remote exploitation of the attack is possible.
  The exploit has been released to the public and may be used for attacks. PR #1530
  / commit 5f99b4d82 (7.2.5) hardened other export endpoints with checkSecureExportFilePath
  but omitted this endpoint. The vendor was contacted early about this disclosure
  but did not respond in any way.'
