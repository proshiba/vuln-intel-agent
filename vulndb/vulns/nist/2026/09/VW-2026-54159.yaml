title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-auth:
  zero the AUTH_RECEIVE response buffer\n\nnvmet_execute_auth_receive() allocates
  the response buffer with kmalloc()\nsized by the host-supplied AUTH_RECEIVE allocation
  length, but the\nDH-HMAC-CHAP builders write only a fixed-size message into it.
  The full\nallocation length is then copied to the wire by nvmet_copy_to_sgl(), so
  a\nremote initiator receives the bytes past the built message -- up to nearly\n\
  a page of uninitialized slab -- during the pre-authentication handshake.\n\nAllocate
  the buffer with kzalloc() so the unwritten tail is zeroed before\nit is sent; conforming
  responses are unaffected."
