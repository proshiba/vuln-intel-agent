title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvduse:
  return compat ioctl results directly\n\nThe compat handler handles VDUSE_IOTLB_GET_FD
  and VDUSE_VQ_GET_INFO, but\nthen calls the native handler. Their different command
  sizes make native\ndispatch return -ENOIOCTLCMD.\n\nFor GET_FD, this overwrites
  receive_fd()'s return value after the\ndescriptor is installed, leaking one fd per
  call. Return handled compat\nresults directly and use native dispatch only for other
  commands."
