title: libpcap BPF interpreter detects neither reaching the end of the filter 
  program buffer due to lack of a return instruction nor executing a jump 
  instruction with an offset that translates to a pointer outside of the buffer.  
  In particular uncommon use cases a crafted filter program can cause the 
  interpreter to try reading the OS process memory in the 32GiB around the 
  buffer on 64-bit architectures and in the entire address space on 32-bit 
  architectures.
