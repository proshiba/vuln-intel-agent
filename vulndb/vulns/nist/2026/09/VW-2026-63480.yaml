title: The The Forminator Forms – Contact Form, Payment Form & Custom Form 
  Builder plugin for WordPress is vulnerable to arbitrary shortcode execution in
  all versions up to, and including, 1.57.2. This is due to the software 
  allowing users to execute an action that does not properly validate a value 
  before running do_shortcode. This makes it possible for unauthenticated 
  attackers to execute arbitrary shortcodes.
