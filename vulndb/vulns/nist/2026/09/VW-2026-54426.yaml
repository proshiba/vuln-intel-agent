title: The Gravity Forms plugin for WordPress is vulnerable to Stored Cross-Site
  Scripting via Post Body Field Value in all versions up to, and including, 
  2.10.5 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. The exploit
  survives save-time sanitization because wp_kses_post allows the required HTML 
  tags and attributes, and the client-side tooltip script re-parses the 
  browser-decoded aria-label value as innerHTML while only stripping script 
  elements, leaving onerror and other event-handler attributes fully intact and 
  executable.
