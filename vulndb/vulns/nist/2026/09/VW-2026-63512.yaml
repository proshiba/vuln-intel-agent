title: The SSL Zen — SSL Certificate Installer & HTTPS Redirects plugin for 
  WordPress is vulnerable to Reflected Cross-Site Scripting via the 'host' 
  parameter in all versions up to, and including, 4.7.42 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. The vulnerability is only exploitable when in the 
  system_requirements stage.
