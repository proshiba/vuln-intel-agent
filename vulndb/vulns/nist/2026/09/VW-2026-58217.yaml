title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86/amd/pmc:
  Propagate SMU errors and validate S2D address\n\namd_stb_s2d_init() discards the
  return value of several S2D SMU commands.\nWhen the SMU refuses a command (e.g.
  \"SMU cmd failed. err: 0xff\") the\nfailure is only noticed indirectly - if at all
  - and reported as -EIO,\nmasking the real error.\n\nMore seriously, the S2D_PHYS_ADDR_LOW/HIGH
  return values are ignored, so\non failure phys_addr_low/hi are left uninitialised
  and the assembled\naddress is passed straight to devm_ioremap().  When the SMU leaves
  them at\nzero this maps physical address 0 and trips the ioremap-on-RAM warning:\n\
  \n  amd_pmc AMDI000B:00: SMU cmd failed. err: 0xff\n  ioremap on RAM at 0x0000000000000000
  - 0x0000000000ffffff\n  WARNING: CPU: 13 PID: 4592 at arch/x86/mm/ioremap.c:...\n\
  \nCheck the return value of each SMU command and propagate it, and reject a\nzero
  physical address before calling devm_ioremap()."
