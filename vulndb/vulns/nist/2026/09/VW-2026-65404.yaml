title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  octeon: add missing napi_disable in cvm_oct_rx_shutdown\n\ncvm_oct_rx_shutdown calls
  free_irq and netif_napi_del without\ndisabling the napi instance first. As the free_irq
  only waits\nfor completion of hard interrupt handlers, the napi poll\nfunction could
  still be active. If cvm_oct_remove proceeds to\nfree the plat structure (which holds
  the NAPI instances), the\nactive poll function will access freed memory, resulting
  in a\nuse-after-free crash."
