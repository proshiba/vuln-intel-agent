title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv,
  bpf: Fix missing sign-ext for signed 1-byte and 2-byte kfunc args\n\nOn RV64, the
  ABI requires sign-extension for signed 1-byte and 2-byte kfunc\nargs. However, the
  RV64 JIT currently does not perform sign-extension for\nsuch kfunc args.\n\nBefore
  commit 7ce090afbf72 (\"bpf: Infer zext_dst based on static register\nliveness analysis\"\
  ), state pruning could potentially omit zero-extension\nof 32-bit subregisters,
  which inadvertently masked the above issue by making\nthe args appear as if they
  had been properly sign-extended. After that\ncommit, the problem is exposed, causing
  the kfunc_call/kfunc_call_test4\nselftest to fail.\n\nFix this by extending the
  existing sign-extension logic to handle signed\n1-byte and 2-byte kfunc args as
  well."
