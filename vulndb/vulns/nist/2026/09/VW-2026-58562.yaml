title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  write-protect folios during data writeback\n\ncommit 095be159f3eb (\"btrfs: unify
  folio dirty flag clearing\") replaced\nthe folio_clear_dirty_for_io() call in extent_write_cache_pages()
  with a\nplain folio_test_dirty() check. Besides clearing the dirty flag,\nfolio_clear_dirty_for_io()
  also calls folio_mkclean(), which write-protects\nthe shared mmap PTEs mapping the
  folio. Note that we still do call\nfolio_clear_dirty_for_io() later in submit_one_sector()
  when we clear\ndirty on the last sector of the folio (the only sector for non-subpage\n\
  cases). But we lost this early call in extent_write_cache_pages().\n\nWithout the
  extra write-protection, a process with the file mmap-ed can\nmodify a sector while
  it is being used by writeback in a way that\nexpects a stable folio (checksumming,
  compressing, copying, etc...)\nwithout faulting, which manifests as a handful of
