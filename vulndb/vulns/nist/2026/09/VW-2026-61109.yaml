title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Handle negative S1 walk levels in VNCR TLB size evaluation\n\nComputing the
  effects of a TLB invalidation involves looking at\nthe size of the mapping cached
  by the TLB. For S1 mappings such as\nVNCR, this is deducted from the combination
  of the base granule size\nand the mapping level.\n\nHowever, this implies that the
  S1 MMU is *on*. When the MMU is off,\nwe indicate this with the level being set
  to a \"creative\" value of\n-127 (S1_MMU_DISABLED).\n\nThis ends-up being misinterpreted
  by pgshift_level_to_ttl() as it\ndoesn't handle negative levels at all (the level
  is immediately cast\nto a u8 and only the bottom two bits considered), leading to
  an\ninvalidation size of 0. Not helpful.\n\nTidy-up pgshift_level_to_ttl() to handle
  these negative levels, and\nttl_to_size() to always return SZ_1G when no valid TTL
  is present.\nThis allows the removal of open-coded checks for similar situations.\n\
