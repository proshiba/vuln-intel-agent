title: libarchive 3.8.x before 3.8.2 has a strcpy heap-based buffer overflow in 
  the gzip writer via the original-filename field to 
  archive_compressor_gzip_open in archive_write_add_filter_gzip.c, aka 
  GHSA-92wx-p669-8gr9. This relates to bsdtar. Exploitation envisions a 
  marginally plausible scenario in which original-filename is obtained from an 
  untrusted party. (original-filename is not derived from the input data.)
