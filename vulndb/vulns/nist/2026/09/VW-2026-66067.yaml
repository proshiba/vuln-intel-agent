title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_ring:
  fix stale descriptor flags after a failed packed add\n\nIn a packed ring the AVAIL
  and USED bits sit in the descriptor itself,\nso writing them makes that descriptor
  available. Those bit combinations\nflip meaning on every round of the ring, tracked
  by a wrap counter, so\ninvalidating or validating a descriptor means inverting both
  bits.\n\nCommit 1ce9e6055fa0 (\"virtio_ring: introduce packed ring support\") has\n\
  virtqueue_add_packed() make every descriptor of a chain available as it\nmaps the
  chain, and write the head last. The device consumes the ring in\norder and stops
  at a head that is not available yet, so it never reaches\nthe rest.\n\nWhen vring_map_one_sg()
  fails partway, unmap_release unmaps the segments\nand restores avail_used_flags,
  but the descriptors it wrote to in the\nring stay marked with AVAIL and USED bits.
  The head is now the only\nentry that keeps the device from consuming these stale
  entries.\n\nFor ex"
