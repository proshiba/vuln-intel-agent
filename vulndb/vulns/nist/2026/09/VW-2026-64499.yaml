title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, Jira and Confluence 
  attachment upload tools accept arbitrary local filesystem paths and send the 
  selected bytes to Atlassian. In HTTP or multi-user deployments, a caller can 
  cross the client-to-server filesystem boundary and disclose configuration, 
  credentials, mounted secrets, or other files readable by the MCP process. The 
  advisory traces the vulnerable input and processing flow through 
  jira_upload_attachment, confluence_upload_attachment, file_path, and 
  server-local filesystem, which identify the affected entry points, controls, 
  and code paths. This issue is fixed in version 0.22.0.
