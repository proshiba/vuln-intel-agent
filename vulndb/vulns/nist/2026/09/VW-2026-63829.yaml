title: A security vulnerability has been detected in BioStar Temperature Monitor
  Utility 1.2.1806.2200. Affected by this vulnerability is the function 
  sub_1105C of the file BS_HWMIO64_W10.sys of the component IOCTL Handler. Such 
  manipulation of the argument PhysicalAddress leads to write-what-where 
  condition. The attack needs to be performed locally. The exploit has been 
  disclosed publicly and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
