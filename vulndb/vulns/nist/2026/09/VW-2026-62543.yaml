title: "In the Linux kernel, the following vulnerability has been resolved:\n\nremoteproc:
  Prevent crash handling to race with rproc_del()\n\nThere's no synchronization between
  rproc_crash_handler_work() and\nrproc_del(), as such it's possible for a driver
  to be removed while\ncrash-handler work is scheduled, or even executing - resulting
  in\nuse-after-free issues.\n\nTo avoid this the scheduled work need to be cancelled
  and synchronized\nagainst before the removal proceeds.\n\nIn order to ensure that
  this doesn't race with the reporting, and\nthereby scheduling new work, a \"deleting\"\
  \ flag is introduced. This is\nsimilar to the RPROC_DELETE state that was introduced
  to ensure that\n\"start\" didn't race with rproc_del(), but the existing mechanism
  can not\nbe used as it's valid to call rproc_report_crash() in atomic context -\n\
  and the \"state\" is protected by a mutex.\n\nIn the event that work is cancelled
  the pm_stay_awake() is left\nunbalanced and need to be unrolled.\n\nThe blocking
