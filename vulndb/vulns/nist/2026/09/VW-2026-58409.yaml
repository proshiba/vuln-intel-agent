title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  intel-thc-hid: intel-quickspi: bound GET_REPORT response to the caller buffer\n\n\
  quickspi_hid_raw_request() receives the caller's buffer length in len, but\nquickspi_get_report()
  never sees it and copies the whole device-supplied\nresponse into buf regardless:\n\
  \n    memcpy(buf, qsdev->report_buf, qsdev->report_len);\n\nqsdev->report_len comes
  from the input report the touch controller returns,\nwhile buf is sized to whatever
  the caller asked hidraw for through\nHIDIOCGFEATURE or HIDIOCGINPUT.  A response
  larger than that overflows buf\nwith device-controlled content.\n\nThe intel-quicki2c
  sibling already passes the caller length down to\nquicki2c_get_report() and validates
  the response against it before the\ncopy.  Do the same here."
