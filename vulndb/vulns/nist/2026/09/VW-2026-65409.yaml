title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: Fix device_register() error path\n\nWhen device_register() fails in i3c_master_register_new_i3c_devs(),\n\
  put_device() is called to drop the reference taken by\ndevice_register().  That
  drops the last reference, so the device's\nrelease callback i3c_device_release()
  runs and frees the i3c_device.\n\nTwo problems follow from that:\n\ni3c_device_release()
  does WARN_ON(i3cdev->desc), so it warns because\ndesc->dev->desc still points back
  at the descriptor.  Clear it before\ncalling put_device().\n\nAfter put_device()
  frees the i3c_device, desc->dev is left pointing at\nfreed memory, so clear desc->dev
  as well.  That prevents, for example,\ni3c_master_unregister_i3c_devs() seeing desc->dev
  as non-NULL and\ndereferencing it."
