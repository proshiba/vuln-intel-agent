title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/probes:
  Fix use-after-free on field name/type of events with multiple probes\n\nThe fields
  of a probe-based dynamic event (kprobe, uprobe, eprobe and\nfprobe events) are created
  in traceprobe_define_arg_fields() by handing\nthe probe_arg name/type strings to
  trace_define_field(), which only\nstores the pointers without copying. Those strings
  are owned by the\ntrace_probe and are freed when that probe is removed.\n\nAn event
  can have several probes attached. The field list is defined\nonly once, by the first
  probe that registers the event, but it is kept\nalive by any surviving sibling probe.
  Deleting just that first probe by\nsymbol -\n\n  # primary A: fields are defined
  from A's args\n  echo 'p:kprobes/ev vfs_read  a1=$arg1' >  kprobe_events\n  # append
  B: shares A's event call\n  echo 'p:kprobes/ev vfs_write a1=$arg1' >> kprobe_events\n\
  \  # delete only A (matched by symbol), B survives\n  echo '-:kprobes/ev vfs_read'\
  \          "
