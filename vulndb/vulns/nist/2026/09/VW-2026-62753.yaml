title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/v3d:
  Clear queue->active_job when v3d_fence_create() fails\n\nThe run_job() callbacks
  for BIN, RENDER, TFU and CSD assign the incoming\njob to queue->active_job before
  calling v3d_fence_create(). If\nv3d_fence_create() fails, the callback returns NULL
  without clearing\nactive_job, leaving a dangling pointer.\n\nCreate a failure path
  in all run_job() callbacks that clears the active\njob before returning NULL. The
  BIN path takes queue->queue_lock around the\nclear as it races against v3d_overflow_mem_work();
  RENDER, TFU and CSD\npaths have no concurrent reader, so the clear is lock-free."
