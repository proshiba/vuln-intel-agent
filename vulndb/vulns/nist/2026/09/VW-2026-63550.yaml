title: rclone versions 1.56.0 through 1.75.0 contain a path traversal 
  vulnerability in the `rclone serve docker` volume plugin. newVolume() in 
  cmd/serve/docker/volume.go computes a volume's mountpoint as 
  filepath.Join(drv.root, name) from the attacker-supplied `name` field of a 
  Docker VolumeDriver.Create request without verifying that the result stays 
  within drv.root (default /var/lib/docker-volumes/rclone), and 
  checkMountpoint() then creates that directory with file.MkdirAll before 
  mounting. A volume name containing enough `..` components (e.g. 
  "../../../../../../etc") therefore resolves outside the base directory, 
  allowing anyone able to submit a VolumeDriver.Create request to the plugin 
  socket — normally the Docker daemon, or a workload that can request named 
  volumes in a multi-tenant orchestration setup — to make the privileged rclone 
  plugin process create a directory and mount a remote filesystem specified in 
  the same request at an arbitrary host path, shadowing or disrupting system 
