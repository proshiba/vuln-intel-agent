title: SysReptor is a fully customizable pentest reporting platform. Prior to 
  2026.68, an unauthenticated attacker who holds a public read-write note share 
  link can disclose an uploaded file or image from the same project by updating 
  the shared note to reference the target asset filename. The user-controlled 
  reference causes the shared-note authorization logic to treat the asset as 
  permitted, after which the attacker can download it. The attacker must know 
  the asset filename, and the issue does not permit cross-project access. This 
  issue is fixed in version 2026.68.
