title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  vnifilter: enforce exact length of GROUP/GROUP6 attributes\n\nThe VXLAN VNI filter
  entry policy declares the GROUP/GROUP6 address\nattributes as NLA_BINARY with only
  a maximum length, so validate_nla()\naccepts a payload shorter than the address.
  The GROUP consumer reads it\nwith nla_get_in_addr(), an unconditional 4-byte load,
  so a short\nattribute over-reads up to 3 bytes of uninitialised slab data, which
  are\nstored into remote_ip and echoed back via RTM_GETTUNNEL, disclosing\nkernel
  memory.\n\nSwitch both entries to NLA_POLICY_EXACT_LEN() so the validator rejects\n\
  any GROUP/GROUP6 that is not exactly 4 / 16 bytes; a valid address is\nalways sent
  at full width."
