title: A flaw was found in FreeIPA. The self-managed OTP token ACI does not 
  require authentication and does not restrict which attributes may be added 
  alongside the token entry. An unauthenticated LDAP client can exploit this, 
  combined with a related flaw in the underlying directory server's ACI 
  evaluation (tracked separately), to create an arbitrary attacker-controlled 
  Kerberos principal and have it added to the administrators group. This allows 
  a remote, unauthenticated attacker to obtain genuine FreeIPA 
  administrator-group membership and perform administrative operations against 
  the directory and, on SID-enabled deployments, other IdM services.
