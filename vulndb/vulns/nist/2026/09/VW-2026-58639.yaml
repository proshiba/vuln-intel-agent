title: The GEO my WP plugin for WordPress is vulnerable to Local File Inclusion 
  in all versions up to, and including, 4.5.5.3 via the 
  gmw_posts_locator_ajax_info_window_loader function. This makes it possible for
  unauthenticated attackers to include and execute arbitrary .php files on the 
  server, allowing the execution of any PHP code in those files. This can be 
  used to bypass access controls, obtain sensitive data, or achieve code 
  execution in cases where .php file types can be uploaded and included. In 
  environments where PEAR is installed with register_argc_argv enabled, this 
  file inclusion can be leveraged to write and execute arbitrary PHP code, 
  achieving full remote code execution.
