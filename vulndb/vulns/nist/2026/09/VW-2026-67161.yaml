title: Authentication Bypass by Capture-replay in Apache Roller 6.1.5 allows an 
  attacker who captures a valid WSSE digest authentication header to replay it 
  and gain the victim's AtomPub authority, because the authentication does not 
  enforce nonce uniqueness or timestamp freshness. Only installations that 
  enable the non-default AtomPub API with WSSE authentication and 
  plaintext-compatible password storage are affected. Users are recommended to 
  upgrade to Apache Roller 6.1.6 or later, which removes WSSE as an AtomPub 
  authentication method; existing installations configured for WSSE fail closed 
  until an administrator explicitly selects a supported authentication method.
