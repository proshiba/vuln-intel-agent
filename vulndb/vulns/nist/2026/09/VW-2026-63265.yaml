title: AnyCable is a realtime server for reliable two-way communication that 
  supports any backend. Prior to 1.6.15, the telemetry subsystem in 
  telemetry/config.go enables tracking with a hardcoded public authToken, while 
  clusterFingerprint in telemetry/telemetry.go reads the full configuration file
  and raw os.Args returned by anycableCLIArgs, including values supplied through
  --secret, --jwt_secret, and --http_rpc_secret. These inputs are passed to 
  generateDigest, where sha256.New produces the hexadecimal fingerprint that is 
  sent as telemetry. The available source therefore does not show raw 
  credentials leaving the process or establish the advisory's claimed 
  confidentiality loss, although the stable fingerprint is derived from 
  secret-bearing configuration and the default telemetry client uses publicly 
  known authentication material. This issue is fixed in version 1.6.15.
