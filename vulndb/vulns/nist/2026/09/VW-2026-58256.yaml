title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: qcom_battmgr: terminate the strings from firmware\n\nThe qcom_battmgr_sc8280xp_strcpy()
  takes a Pascal-style string when the\nfirmware sends one. Otherwise it copies all
  BATTMGR_STRING_LEN bytes and\nleaves the destination without a terminator.\n\nThose
  destinations are model_number, serial_number and oem_info, each\nBATTMGR_STRING_LEN
  and declared next to each other. They go out to user\nspace as val->strval, which
  power_supply_format_property() prints with\n\"%s\", so a firmware string that fills
  the whole field makes that read run\ninto the following members.\n\nUse strscpy()
  so the copy always terminates, the way the SM8350 path\nalready does for the same
  field."
