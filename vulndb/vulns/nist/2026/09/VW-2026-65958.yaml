title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mpls: clear inner_protocol when the last label is popped\n\nskb_mpls_push() records
  the pre-encapsulation network header once, gated\non !skb->inner_protocol. skb_mpls_pop()
  never clears that record, so it\noutlives the encapsulation it describes.\n\nOpen
  vSwitch can then re-push MPLS onto a packet whose\ninner_network_header still points
  at the older, deeper offset: push a\nlabel, pop every label, recirculate (ovs_flow_key_update()
  re-derives\nkey->eth.type and resets network_header, but leaves inner_*), then push\n\
  again. ovs_fragment() trusts the record:\n\n\tskb->network_header = skb->inner_network_header;\n\
  \nso skb_network_offset() goes negative. The bound check is signed:\n\n\tif (skb_network_offset(skb)
  > MAX_L2_LEN)\n\na negative offset passes it, and prepare_frag() widens the value:\n\
  \n\tunsigned int hlen = skb_network_offset(skb);\n\tmemcpy(&data->l2_data, skb->data,
  hlen);\n\nwhich is a ~4GiB memcpy out of a 30-byte per-CPU buffe"
