title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  llcp: bound the connect_sn TLV walk to the skb\n\nCommit 27256cdb290e (\"nfc: llcp:
  bound SNL TLV parsing to the skb and\nadd length checks\") fixed the unbounded TLV
  walk in nfc_llcp_recv_snl(),\nand commit d8bd2dedbde5 (\"nfc: llcp: fix OOB read
  and u8 offset wrap in\nTLV parsers\") subsequently bounded nfc_llcp_parse_gb_tlv()
  and\nnfc_llcp_parse_connection_tlv(). One sibling parser sharing the same\npattern
  remains unbounded: nfc_llcp_connect_sn().\n\nnfc_llcp_connect_sn() walks a TLV list,
  reading a two-byte header\n(type, length) followed by length bytes of value, without
  checking that\nthe two header bytes or the declared length stay within the buffer.
  It\nreturns a pointer to a service name of up to 255 bytes that may point\npast
  the end of the skb; it is subsequently consumed by memcmp() in\nnfc_llcp_sock_from_sn().
