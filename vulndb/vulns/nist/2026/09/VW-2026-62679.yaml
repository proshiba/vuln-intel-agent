title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: aspeed_udc: check endpoint DMA allocation\n\nast_udc_probe() allocates a
  coherent DMA buffer used as the backing store\nfor endpoint buffers. ast_udc_init_ep()
  derives per-endpoint buffer\npointers from udc->ep0_buf, so a failed allocation
  is dereferenced during\nprobe.\n\nCheck the allocation before endpoint setup. The
  existing probe error path\ncalled ast_udc_remove(), which unregisters the gadget
  unconditionally and\nis not safe before usb_add_gadget_udc() succeeds. Add a local
  cleanup\nhelper for probe failures so pre-registration failures only unwind the\n\
  resources that were actually initialized.\n\nThis was found by a local static analysis
  checker for unchecked allocator\nreturns while scanning Linux 6.16. The change was
  checked by applying it\nto current mainline and by running checkpatch. I do not
  have access to\nAspeed UDC hardware, so no runtime testing was performed."
