title: Worklenz through 3.0.0 fails to properly validate the sort-field query 
  parameter in pagination helper functions, allowing authenticated users to 
  inject arbitrary PostgreSQL expressions into ORDER BY clauses. Attackers can 
  use time-based and boolean-based blind SQL injection techniques to extract 
  sensitive database content including password hashes from other tenants. This 
  is an incomplete fix for CVE-2026-25947.
