title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Fix DPT allocation paths.\n\nRemove the fallback for VRAM to system memory, I tested
  it and that\ndoesn't work at all, only a black screen with pipe fault errors were\n\
  observed.\n\nOn systems with media GT, extra latency is added when accessing stolen\n\
  memory when the GT is in MC6. Since we additionally aren't counting how\nmuch memory
  is used for stolen and we could in theory fill up the\nentire stolen area with DPT's,
  avoid using stolen and only use the\ndefault memory region.\n\nUsing stolen may
  also result in random system hangs under load.\n\n(cherry picked from commit a196406a3831291598fe8e73245914f7acffdfe0)"
