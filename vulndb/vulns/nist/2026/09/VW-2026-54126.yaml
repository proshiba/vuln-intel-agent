title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex:
  Avoid private hash use-after-free on final put\n\nfutex_private_hash_put() drops
  the reference to fph before evaluating\nfph->mm for wake_up_var(). futex_ref_put()
  enables preemption again before\nreturning. If that put drops the final reference
  and the task is preempted,\nanother task can pivot to the replacement hash and free
  the old hash after\nan RCU grace period. The first task then reads fph->mm from
  the freed\nallocation when it resumes.\n\nKASAN reports a slab-use-after-free in
  futex_private_hash_put(), with the\nread at offset 24 in a freed kmalloc-512 allocation.
  The allocation and\nfree stacks point to futex_hash_allocate() and the RCU free
  path,\nrespectively.\n\nLoad the mm pointer while the fph reference is still held
  and pass the\nsaved value to wake_up_var(). wake_up_var() uses the pointer as a
  waitqueue\nkey and does not dereference the mm through it."
