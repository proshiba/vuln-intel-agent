title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: Detach sync cmd buffer on interrupted wait\n\nmwifiex synchronous commands
  keep the caller-provided data buffer in\ncmd_node->data_buf. Several callers pass
  stack-allocated objects there.\n\nIf wait_event_interruptible_timeout() is interrupted,
  the caller can\nreturn and release that stack object while the firmware command
  is still\nthe current command. A late firmware response then reaches the normal\n\
  response handler, which can copy data through cmd_node->data_buf into the\nstale
  stack address.\n\nThis fixes a stack corruption observed during repeated association
  and\ndisassociation cycles. The panic trace showed the command wait being\ninterrupted
  immediately before a bad pointer dereference:\n\n  cmd_wait_q terminated: -512\n\
  \  Unable to handle kernel paging request at virtual address 002c583837384662\n\
  \  Kernel panic - not syncing: stack-protector: Kernel stack is corrupted\n  ...\n\
