title: The The Divi theme for WordPress is vulnerable to arbitrary shortcode 
  execution in all versions up to, and including, 5.11.1. This is due to the 
  software allowing users to execute an action that does not properly validate a
  value before running do_shortcode. This makes it possible for unauthenticated 
  attackers to execute arbitrary shortcodes. When the 'Force Enable D4 Shortcode
  Framework' option is enabled, this includes invoking the et_pb_contact_form 
  shortcode to send email to an attacker-selected recipient with 
  attacker-controlled content.
