title: The WP Table Builder – Drag & Drop Table Builder plugin for WordPress is 
  vulnerable to Incorrect Authorization in all versions up to, and including, 
  2.2.1. This is due to an operator precedence bug in the post-type guard within
  the trash_table_bulk() and restore_table_bulk() functions that causes the 
  guard to never fire, combined with a permission callback that only verifies 
  plugin role membership without per-post-type or ownership checks. This makes 
  it possible for authenticated attackers, with subscriber-level access and 
  above, to trash or restore any post, page, or custom post type on the site by 
  supplying arbitrary post IDs.
