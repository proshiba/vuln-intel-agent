title: A vulnerability was found in Cleo Harmony up to 5.8.1.10. The affected 
  element is an unknown function of the file /api/connections of the component 
  JWT Refresh Token Handler. Performing a manipulation of the argument Bearer 
  results in improper privilege management. The attack is possible to be carried
  out remotely. The exploit has been made public and could be used. Upgrading to
  version 5.8.1.11 is sufficient to fix this issue. It is recommended to upgrade
  the affected component.
