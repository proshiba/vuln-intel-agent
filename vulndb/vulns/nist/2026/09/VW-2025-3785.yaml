title: A security vulnerability has been detected in Portabilis i-Educar up to 
  2.10. The impacted element is an unknown function of the file 
  educar_historico_escolar_lst.php. Such manipulation of the argument 
  ref_cod_aluno leads to sql injection. The attack can be executed remotely. The
  exploit has been disclosed publicly and may be used. Upgrading to version 2.12
  is sufficient to resolve this issue. It is advisable to upgrade the affected 
  component. The vendor confirms, that "[t]he reported attack vector was tested 
  against the corrected code, and the previously described SQL Injection 
  behavior could no longer be reproduced".
