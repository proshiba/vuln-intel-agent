title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Free guest debug data on vcpu destroy\n\nkvm_s390_clear_bp_data() is only
  called from\nkvm_arch_vcpu_ioctl_set_guest_debug(), i.e. when user space changes
  or\ndisables debugging. A vCPU that is destroyed while hardware breakpoints\nare
  still armed - the normal case when the VMM just exits or crashes -\nleaks hw_bp_info,
  hw_wp_info and all old_data buffers, since generic KVM\nfrees the vCPU right after
  kvm_arch_vcpu_destroy().\n\nThat is bounded by MAX_BP_COUNT entries, so roughly
  8 KiB per vCPU, but\nit is unbounded over VM lifetimes. The allocations are\nGFP_KERNEL_ACCOUNT,
  so the charge also outlives the exiting process and\npins dying memcgs.\n\nFix by
  clearing the debug data on vCPU destruction. Calling it\nunconditionally is fine:
  struct kvm_vcpu is zero allocated, so for a vCPU\nthat never enabled debugging the
  counters are 0 and the pointers NULL."
