title: CoreDNS is a DNS server written in Go. Prior to 1.14.7, the 
  DNS-over-HTTPS, DNS-over-HTTP/3, DNS-over-QUIC, and DNS-over-gRPC listeners in
  plugin/pkg/doh/doh.go, core/dnsserver/server_quic.go, and 
  core/dnsserver/server_grpc.go call dns.Msg.Unpack without the 
  dns.DefaultMsgAcceptFunc request policy used by UDP, TCP, and DNS-over-TLS. An
  unauthenticated client can send an RFC 2136 UPDATE that the proxy or forward 
  plugin passes unchanged to an update-capable upstream. If that upstream trusts
  CoreDNS's source address or connection and does not require an 
  attacker-unknown end-to-end TSIG, the request appears to originate from 
  CoreDNS and can add, replace, or delete DNS records, redirect traffic, take 
  over names, alter mail routing, or disrupt the writable zone. This issue is 
  fixed in version 1.14.7.
