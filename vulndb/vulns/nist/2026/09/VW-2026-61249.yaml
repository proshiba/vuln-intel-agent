title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cx23885: cancel NetUP CI work before teardown\n\nnetup_ci_exit() frees a netup_ci_state
  while its work item,\nnetup_read_ci_status(), may still be pending or running on
  the system\nworkqueue. The worker obtains the state with container_of() and\ndereferences
  it, so it must not outlive the state.\n\nnetup_ci_init() queues the initial status
  read, and CI GPIO interrupts\nsubsequently queue the same work from netup_ci_slot_status().
  During\nremove, cx23885_finidev() calls free_irq() before the CI device is\nunregistered.
  free_irq() prevents further IRQ handlers from running,\nbut does not drain work
  queued previously, so the worker can run after\nnetup_ci_exit() frees the state.\n\
  \nCall cancel_work_sync() before dvb_ca_en50221_release() and kfree().\n\nThis issue
  was found by an in-house static analysis tool."
