title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix out-of-bounds read in ext4_read_inline_dir()\n\next4_read_inline_dir() can read
  a dirent header past the end of its inline\nbuffer, triggering a slab-out-of-bounds
  read during getdents64():\n\n  BUG: KASAN: slab-out-of-bounds in __ext4_check_dir_entry\n\
  \  Read of size 2 at addr ffff88800f3dd23c by task exploit/148\n   ...\n   __ext4_check_dir_entry\n\
  \   ext4_read_inline_dir\n   iterate_dir\n\nThe dirent payload lives in a buffer
  of exactly inline_size bytes:\n\n\tdir_buf = kmalloc(inline_size, GFP_NOFS);\n\n\
  but iteration runs in a position space extra_offset bytes larger\n(extra_size =
  extra_offset + inline_size) so the synthetic \".\" and \"..\"\nland at their block-dir
  offsets. A dirent is formed at \"dir_buf + pos -\nextra_offset\", yet the ext4_check_dir_entry()
  length argument uses the\nlarger extra_size. A position whose dirent header would
  extend past\nextra_size is therefore accepted, and the rescan loop's rec_len probe
  and\next4_"
