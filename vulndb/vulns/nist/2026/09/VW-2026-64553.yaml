title: An invalid pointer release vulnerability exists in YARA 4.5.8 during 
  deserialization of compiled .yrc rule files. The vulnerability is caused by 
  insufficient validation of external-variable pointers, which may lead to 
  invalid free in yr_rules_destroy() or wild pointer access in 
  yr_object_create(). An attacker can provide a specially crafted .yrc file that
  causes memory corruption and application crash.
