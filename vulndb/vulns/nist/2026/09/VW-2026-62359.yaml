title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix mmap_lock leak in irq_work path\n\nstack_map_get_build_id_offset() introduced
  a per-CPU irq_work to defer\nmmap_read_unlock() from NMI context, and bpf_find_vma()
  later reused the\nsame mmap_unlock_work. Both callers only check whether the work
  is busy\nbefore taking mmap_lock, so a nested caller can reuse the slot before the\n\
  first caller queues it. Two read locks may then be acquired while only one\ndeferred
  unlock runs, leaking a read lock and blocking exit_mmap().\n\nReserve the per-CPU
  slot before mmap_read_trylock(). Use the same wrapper\nin stackmap and bpf_find_vma()
  so both callers release the reservation on\ntrylock failure. Keep rejecting the
  slot while the irq_work remains busy.\nRelease it after the irq_work callback unlocks
  the mm."
