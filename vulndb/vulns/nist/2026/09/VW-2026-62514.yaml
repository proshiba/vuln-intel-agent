title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbus:
  mhi: host: Fix controller cleanup on EDL sysfs failure\n\nmhi_register_controller()
  adds the controller device before creating the\noptional trigger_edl sysfs file.
  If sysfs_create_file() fails, the error\npath only drops the device reference and
  leaves the device registered.\n\nHence, call device_del() in the error path before
  put_device()."
