title: A vulnerability was identified in ZSPACE Q2C NAS up to 1.1.0210050. 
  Affected is the function zfilev2_api.CloseSafe of the file /v2/file/safe/close
  of the component HTTP POST Request Handler. The manipulation of the argument 
  safe_dir leads to command injection. The attack is possible to be carried out 
  remotely. The exploit is publicly available and might be used. The vendor was 
  contacted early about this disclosure and confirmed the existence of the 
  vulnerability. A technical fix is planned to be released.
