title: Snipe-IT is an IT asset/license management system. Prior to 8.7.0, the 
  uploaded-files API endpoint GET /api/v1/{object_type}/{id}/files/{file_id} 
  allows an authenticated user with file-management access to upload XML and 
  XSLT attachments and request them with the inline=true parameter. The 
  app/Http/Controllers/Api/UploadedFilesController.php show() path does not 
  apply the safe-inline allowlist used by the equivalent web controller, so the 
  browser can process an attacker-controlled xml-stylesheet reference and 
  execute JavaScript generated by the stylesheet in the Snipe-IT origin. A 
  victim who is authorized to view the object must open the attachment URL, 
  after which the script can read same-origin data and perform authenticated 
  actions with the victim's privileges. This issue is fixed in version 8.7.0.
