title: A security issue in MongoDB Server's query statistics serialization on 
  the router allows users with monitoring privileges to access unredacted search
  query text from other users' operations. An improper conditional check in the 
  serialization logic causes the data redaction mechanism to be bypassed when 
  processing search queries through the sharded cluster router. This results in 
  sensitive query literals being stored and made accessible through the query 
  statistics interface.
