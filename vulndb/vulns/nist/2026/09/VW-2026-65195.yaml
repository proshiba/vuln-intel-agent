title: "The wpForo Forum WordPress plugin before 3.1.6 does not restrict which classes
  may be instantiated when it deserializes a user-supplied profile field value, allowing
  authenticated users with Subscriber-level access and above to inject a PHP Object.\n\
  No POP chain is present in the wpForo Forum WordPress plugin before 3.1.6 itself;
  if one is present via another installed wpForo Forum WordPress plugin before 3.1.6
  or , this could lead to remote code execution, arbitrary file operations, or SQL
  injection. This is an incomplete fix of CVE-2026-49769."
