title: A weakness has been identified in Netcore NBR200V2 1.3.241127.071246. 
  Impacted is the function wan_config_set_vlan of the file /usr/bin/routerd of 
  the component WAN VLAN Reconfiguration. Executing a manipulation of the 
  argument vlan_wanX.ports can lead to buffer overflow. The attack may be 
  performed from remote. The exploit has been made available to the public and 
  could be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
