title: Cap-go capgo.app before 12.267.1 fails to validate target API key 
  privilege during rotation, allowing an apikey_manager to rotate a 
  higher-privileged org_super_admin sibling key and recover its plaintext 
  credential. Attackers with apikey_manager role can enumerate same-owner API 
  keys, rotate a stronger sibling through the PUT endpoint, and obtain the 
  replacement plaintext secret to authenticate as the higher-privileged 
  principal.
