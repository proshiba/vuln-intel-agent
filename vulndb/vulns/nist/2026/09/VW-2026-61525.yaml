title: Adenion Blog2Social plugin for WordPress before 9.1.0 allows 
  low-privileged users to modify the scheduled post records of other users. The 
  b2s_calendar_move_post AJAX handler in includes/Ajax/Post.php issues an UPDATE
  against the b2s_posts table using only the attacker-supplied b2s_id primary 
  key with no blog_user_id ownership constraint, allowing any user with the 
  edit_posts capability to reschedule, suppress, or alter the publication state 
  of any other user's scheduled social media post.
