title: The WPBot – AI ChatBot for Live Support, Lead Generation, AI Services 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via the 
  'conversation' parameter in all versions up to, and including, 8.7.3 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. The action is gated 
  only by a nonce that is localized into every public-facing page via 
  wp_localize_script, rendering the nonce check ineffective as an access control
  barrier for unauthenticated users.
