title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/proc:
  Use file_ns_capable() when checking config space read access\n\nproc_bus_pci_read()
  decides how much of the config space is readable based\non capable(CAP_SYS_ADMIN),
  which checks the credentials of the task calling\nread(), not the credentials of
  the process that opened the file.\n\nThe sysfs equivalent, pci_read_config(), has
  checked the credentials of the\nopening process since commit de139a339395 (\"pci:
  check caps from sysfs file\nopen to read device dependent config space\"), so a
  privileged process can\nopen the config space file and pass the file descriptor
  to an unprivileged\nprocess (for example, a process running a KVM guest with an
  assigned\ndevice), which can then read the entire config space.  The check was\n\
  subsequently routed through the LSM framework in commit 47970b1b2aa6 (\"pci:\nuse
  security_capable() when checking capablities during config space read\")\nand converted
  to the dedicated helper in commit ab0"
