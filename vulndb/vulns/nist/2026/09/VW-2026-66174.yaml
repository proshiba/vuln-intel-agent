title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/pagemap:
  Prevent double migration of device pages\n\nA device-private folio migrated to system
  memory by a CPU fault can\nremain reachable through the raw-PFN eviction path until
  migration\nfinalization drops the source reference.\n\nIf eviction selects the same
  device-private folio during this window,\nit can attempt to migrate the folio again.
  The second migration can leave\nan uncharged folio on an LRU list, causing folio_lruvec_lock_irqsave()
  to\nretry indefinitely and resulting in a soft lockup and RCU stall.\n\nMark successfully
  migrated device-private folios using a low bit of\ntheir zone_device_data before
  migration finalization. Make both CPU-fault\nand raw-PFN migration paths skip device-private
  folios carrying this\nflag.\n\nMask the flag when retrieving the drm_pagemap_zdd
  pointer and preserve\nit when a device-private folio is split. Keeping the state
