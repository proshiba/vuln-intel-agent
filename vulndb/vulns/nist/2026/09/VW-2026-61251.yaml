title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cobalt: Avoid freeing ALSA private data twice\n\nsnd_cobalt_card_create() stores
  cobsc in sc->private_data and installs\nsnd_cobalt_card_private_free() as sc->private_free.
  From that point,\nsnd_card_free(sc) releases cobsc through the ALSA card cleanup
  path.\n\nIf cobalt_alsa_init() fails after snd_cobalt_card_create(), the\nerr_exit_free
  path calls snd_card_free(sc) and then kfree(cobsc). That\nsecond free releases the
  same object again.\n\nRemove the explicit kfree(cobsc) and leave ownership with
  the ALSA card.\n\nThis issue was found by a static analysis checker and confirmed
  by\nmanual source review."
