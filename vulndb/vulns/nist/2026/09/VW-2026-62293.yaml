title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  avoid teardown retry loop on xarray allocation failure\n\n__ublk_shmem_remove_ranges()
  removes matching maple tree ranges in\nbatches, but first stores each range into
  a temporary xarray so that the\npages can be unpinned after dropping the maple tree
  lock.\n\nThat temporary xarray is filled under the maple tree lock with\nxa_store(...,
  GFP_ATOMIC). If the store fails before mas_erase(), the\ncurrent range is left in
  the tree and the helper returns false. The\nouter ublk_shmem_remove_ranges() loop
  then immediately retries the same\nrange. While the atomic allocation keeps failing,
  the teardown path has\nno forward progress.\n\nThe issue can be reproduced with
  radix_tree_node failslab injection after\na SHMEM_ZC buffer has already been registered:\n\
  \n  # Kernel config:\n  #   CONFIG_BLK_DEV_UBLK=y\n  #   CONFIG_DEBUG_FS=y\n  #\
  \   CONFIG_FAULT_INJECTION=y\n  #   CONFIG_FAULT_INJECTION_DEBUG_FS=y\n  #   CONFIG_FAILSLAB=y\n\
  \n  echo 10 > /p"
