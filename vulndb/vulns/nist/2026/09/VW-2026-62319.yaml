title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: midi: Serialize input teardown with event_input\n\nsnd_midi_input_event() must
  not be running while a rawmidi substream is\nclosing, since this can lead to the
  trigger state becoming out-of-step\nthrough this sequence in snd_rawmidi_input_trigger():\n\
  \n\tsnd_rawmidi_input_trigger(up=0)\n\t\t\t\t\tsnd_midi_input_event()\n\t\t\t\t\t
  -> snd_rawmidi_kernel_read()\n\t\t\t\t\t     -> snd_rawmidi_input_trigger(up=1)\n\
  \t  -> cancel_work_sync()\n\nwhich ends with the underlying device being active
  unexpectedly.\n\nWhen this is called from close_substream(), further input can re-trigger\n\
  the input event leaving it running after rawmidi_release_priv() has set\nrfile->rmidi
  to NULL which leads to:\n\n\tUnable to handle kernel NULL pointer dereference at
  virtual address 00000000000000b0\n\tCall trace:\n\t snd_midi_input_event+0x3c/0x134
  [snd_seq_midi] (P)\n\t snd_rawmidi_input_event_work+0x1c/0x2c\n\t process_one_work+0x150/0x3a4\n\
  \t worker_thread+0x190/0x318\n\nAppl"
