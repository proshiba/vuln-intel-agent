title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  PCI: Clear driver_data on all paths that free the acpi_pci_root\n\nacpi_pci_root_add()
  assigns the freshly allocated root to\ndevice->driver_data before dmar_device_add()
  and pci_acpi_scan_root().\nBoth failure paths reach the end: label where root is
  kfree()'d, but\nonly the pci_acpi_scan_root() path clears driver_data first.\n\n\
  When dmar_device_add() fails during a hot-add, root is freed while\ndevice->driver_data
  still points at it.  The ACPI core does not clear\ndriver_data on attach failure,
  so a later acpi_pci_find_root() call may\ndereference this dangling pointer.\n\n\
  acpi_pci_root_remove() has the same problem: it frees root without\nclearing device->driver_data,
  leaving a dangling pointer behind after\nthe root bridge is removed.\n\nMove the
