title: 'Suricata is a network Intrusion Detection System, Intrusion Prevention System
  and Network Security Monitoring engine. Prior to versions 7.0.16 and 8.0.5,IKEv2
  parser state could grow without bounds while storing client transforms. Repeated
  crafted UDP traffic may cause Suricata to consume excessive memory, potentially
  resulting in denial of service. Versions 7.0.16 and 8.0.5 fix the issue. Some workarounds
  are available. Disable IKE application-layer parsing if it is not needed. Alternatively,
  use a rule to bypass ike flows after the first packets like `alert ike any any ->
  any any (sid: 2; flow.pkts_toserver: > 256; bypass; noalert;)`.'
