title: A flaw was found in gss-ntlmssp. A memory leak occurs in the NTLM 
  target-info parser when a crafted NTLM CHALLENGE message contains duplicated 
  string-valued AV_PAIR entries. The parser allocates memory for each string 
  value but does not free the previous allocation when the same AV_PAIR type 
  appears more than once, leaking the earlier allocation. A malicious or 
  man-in-the-middle server can exploit this to cause gradual memory exhaustion 
  on the client during NTLM authentication, leading to a denial of service.
