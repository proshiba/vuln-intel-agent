title: Open edX Platform enables the authoring and delivery of online learning 
  at any scale. From Redwood until Ulmo and Verawood.1, the 
  add_additional_attributes_to_notifications function in 
  openedx/core/djangoapps/notifications/email/utils.py assigns notification 
  content without sanitizing discussion-title values produced by 
  get_notification_content in 
  openedx/core/djangoapps/notifications/base_notification.py. An enrolled 
  student can place CSS-capable markup in the post_title value supplied by 
  lms/djangoapps/discussion/rest_api/discussions_notifications.py. Digest and 
  batched-email rendering then passes that value through 
  openedx/core/djangoapps/notifications/templates/notifications/digest_content.html
  as safe HTML, allowing email-open tracking and content spoofing or phishing 
  when another learner opens a CSS-rendering client. The immediate-email path is
  not affected because it strips title markup and renders a separately sanitized
  body. This issue is fixed in Ulmo and Verawood.1.
