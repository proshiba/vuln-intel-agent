title: Lantronix SLC8000 before firmware v9.7.0.5, EMG8500/EMG7500 before 
  firmware v9.7.0.1, and all firmware versions of SLB882/SLCx-03/SLCx-02 contain
  a path traversal vulnerability in the web management portal upload endpoint 
  that allows authenticated attackers to write arbitrary data to any location on
  the device's filesystem, leading to remote code execution. The upload filename
  validation strips backslash characters but does not subsequently check for 
  forward slashes when a backslash is detected; by supplying a filename 
  containing both characters an attacker writes outside the intended upload 
  directory to any writable path. Attackers can use this vulnerability to 
  achieve complete loss of confidentiality, integrity, and availability on the 
  affected device and potentially impact downstream serial-connected devices.
