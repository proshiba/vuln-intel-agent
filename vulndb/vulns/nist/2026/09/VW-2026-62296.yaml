title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  serialize configfs attribute updates with device setup\n\nThe attribute store methods
  generated with NULLB_DEVICE_ATTR() refuse to\nchange the configuration of a live
  device by testing\nNULLB_DEV_FL_CONFIGURED, but that flag is only set by\nnullb_device_power_store()
  after null_add_dev() has returned, and the\nstore methods take no lock at all. configfs
  only serializes writes to\nthe same open file (buffer->mutex), so a write to any
  attribute can run\nconcurrently with null_add_dev() and change the device configuration\n\
  while it is being used.\n\nnull_add_dev() reads the configuration several times,
  e.g. dev->zoned is\nread once to set up the queue limits and once to initialize
  the zone\nresources:\n\n  CPU0: echo 1 > nullb0/power         CPU1: echo 1 > nullb0/zoned\n\
  \  nullb_device_power_store()\n    mutex_lock(&lock)\n    null_add_dev()\n     \
  \ if (dev->zoned) -> false\n        /* no BLK_FEAT_ZONED */       nullb_device_zoned_s"
