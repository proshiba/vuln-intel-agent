title: Craft CMS GraphQL entry mutation resolvers (saveEntry, deleteEntry) 
  read siteIddirectly from$argumentswithout passing 
  throughArgumentManagerprepareArguments(), which is the function that enforces 
  site-scope filtering via array_intersect against the GraphQL schema’s allowed 
  sites. The query path (ElementResolverprepareElementQuery) correctly 
  calls prepareArguments()`, so queries to unauthorized sites return empty. But 
  mutations bypass this entirely — an attacker with a token scoped to Site A can
  create, modify, or delete entries in Site B by passing siteId in the mutations
  argument.
