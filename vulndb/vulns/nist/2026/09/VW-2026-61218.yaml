title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix BSG job leak on validate flash image error path\n\nqla28xx_validate_flash_image()
  returns QLA_SUCCESS (0) unconditionally,\ntelling the FC BSG transport (fc_bsg_host_dispatch())
  that the driver\nowns and will complete the request. But bsg_job_done() is guarded
  by \"if\n(!rval)\", so on the error path (rval == -EINVAL) neither the driver nor\n\
  the transport completes the job. The request dangles until it times out,\nleaking
  block layer resources.\n\nCommit c2c68225b145 (\"scsi: qla2xxx: Fix bsg_done() causing
  double\nfree\") added the \"if (!rval)\" guard to a batch of BSG handlers. That
  is\ncorrect for handlers that also return the error code (the transport then\ncompletes
  the job once via fail_host_msg), but this function returns\nQLA_SUCCESS unconditionally,
  so the guard turned a correct single\ncompletion into a leak.\n\nAlways call bsg_job_done():
  bsg_reply->result is DID_OK and the error is\nreported in vendor_rsp[0],"
