title: "Insecure Direct Object Reference / missing object-level authorization in the
  Akia keyless entry cloud service. The unlock action is relying on a client-supplied
  room/door identifier that is not properly authorized server-side against the authenticated
  guest's booking. An authenticated guest could unlock rooms other than their own,
  resulting in unauthorized physical access to guest rooms at an affected property.\n\
  \n\n\n\nAs of 19th September 2026 the service is no more vulnerable to this attack
  (feedback received by the reporter). \n\n\n\n\nThe attack is remote but the effect
  is local to an affected property."
