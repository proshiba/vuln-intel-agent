title: "Affected versions of MISP do not consistently apply the existing authentication-failure
  logging throttle.\n\n\nTwo API authentication failure branches wrote directly to
  the Log model:\n\n - API requests with no authentication key;\n - requests supplying
  an API key with an incorrect length\n\n\n\n\nUnlike other authentication failures,
  these paths bypassed _shouldLog(), so every request could create another durable
  auth_fail entry.\n\nVersion affected: ≤2.5.45"
