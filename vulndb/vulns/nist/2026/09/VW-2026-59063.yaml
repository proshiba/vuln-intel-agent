title: A security vulnerability has been detected in marcobambini Gravity up to 
  0.9.7. This affects an unknown function of the file src/utils/gravity_json.c 
  of the component udp json-parser. Such manipulation leads to integer overflow.
  The attack may be performed from remote. The exploit has been disclosed 
  publicly and may be used. Upgrading to version 0.9.8 mitigates this issue. The
  name of the patch is 9b337c3eae5833c3956bed1fc01c21c14fd443f2. Upgrading the 
  affected component is recommended.
