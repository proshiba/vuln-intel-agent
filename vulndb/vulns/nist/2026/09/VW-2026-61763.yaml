title: Apache NiFi Registry 0.4.0 through 2.11.0 are subject to path 
  manipulation when storing extension bundle content using group, artifact, and 
  version coordinates from uploaded NAR manifests. The default file persistence 
  provider used coordinates as filesystem path components without rejected 
  parent-directory names, and the path-containment check compared an 
  unnormalized resolved path. An authenticated user authorized to write and 
  delete bundles in a bucket can upload a NAR with a crafted manifest resulting 
  in file system operations outside of the file persistence directory. Upgrading
  to Apache NiFi Registry 2.12.0 is the recommended mitigation, which rejects 
  parent-directory coordinates and requires a normalized path to remain a strict
  child of the storage root location.
