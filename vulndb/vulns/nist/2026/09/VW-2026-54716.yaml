title: A vulnerability was detected in sfturing hosp_order up to 
  627f426331da8086ce8fff2017d65b1ddef384f8. This impacts the function 
  orderRecordsService.cancelOrder of the file 
  ssm_pro/src/main/java/cn/sfturing/web/OrderController.java of the component 
  Order Cancellation. The manipulation of the argument ID results in 
  authorization bypass. The attack may be performed from remote. The exploit is 
  now public and may be used. This product utilizes a rolling release system for
  continuous delivery, and as such, version information for affected or updated 
  releases is not disclosed. The project was informed of the problem early 
  through an issue report but has not responded yet.
