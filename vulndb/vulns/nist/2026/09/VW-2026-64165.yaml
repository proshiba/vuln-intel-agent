title: The BM Content Builder plugin for WordPress is vulnerable to arbitrary 
  file deletion due to insufficient file path validation in the 
  ux_cb_remove_layout_ajax() and ux_cb_tools_export_ajax() functions in all 
  versions up to, and excluding, 3.17.1. This makes it possible for 
  authenticated attackers, with Subscriber-level access and above, to delete 
  arbitrary files on the server, which can easily lead to remote code execution 
  when the right file is deleted (such as wp-config.php).
