title: Nuclio is a "Serverless" framework for Real-Time Events and Data 
  Processing. From version 1.6.19 to before version 1.17.2, Nuclio's Dashboard 
  build pipeline does not sanitize the spec.build.tempDir field before using it 
  to construct a shell command. When the Kaniko container builder is enabled, a 
  user with function-create permission can inject shell metacharacters into this
  field and achieve arbitrary command execution inside the Dashboard container, 
  which runs with a Kubernetes service account holding wildcard access to 
  Secrets, Pods, Jobs, and Deployments in its namespace. This issue has been 
  patched in version 1.17.2.
