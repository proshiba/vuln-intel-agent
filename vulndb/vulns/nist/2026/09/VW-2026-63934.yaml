title: Hatchet is a platform for orchestrating background tasks, AI agents, and 
  durable workflows at scale. Prior to 0.91.1, 
  api-contracts/openapi/paths/v1/workflow-runs/workflow_run.yaml defines the GET
  /api/v1/stable/durable-tasks/{durable-task} endpoint implemented by 
  listDurableEventLog without requiring the target tenant as a parent resource, 
  allowing an authenticated user who obtains another tenant's durable task UUID 
  to read that task's event log. Disclosed data can include task display names, 
  workflow identifiers, user messages, wait conditions, branching logic, and 
  timing information. This issue is fixed in version 0.91.1.
