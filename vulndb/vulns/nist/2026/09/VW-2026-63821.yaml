title: A security vulnerability has been detected in QCMS up to 6.0.6. This 
  issue affects the function self_Tmp in the library Lib/Config/Controllers.php 
  of the component Content Detail Page. Such manipulation of the argument ID 
  leads to sql injection. The attack may be performed from remote. The exploit 
  has been disclosed publicly and may be used. Router uses raw REQUEST_URI 
  without URL decoding, so payloads must contain literal spaces - %20 never 
  decodes before route parsing. The support team of the vendor was contacted 
  early about this disclosure. Unfortunately, they responded just with 
  profanity.
