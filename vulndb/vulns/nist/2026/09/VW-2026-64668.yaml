title: A security vulnerability has been detected in Dask up to 2026.8.0. This 
  affects the function from_npy_stack of the file dask/array/core.py of the 
  component Loader. Such manipulation leads to deserialization. The attack can 
  be launched remotely. The exploit has been disclosed publicly and may be used.
  The project was informed of the problem early through an issue report but has 
  not responded yet.
