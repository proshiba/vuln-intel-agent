title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: realtek: use gpiod_set_value_cansleep for reset GPIO\n\nrtl83xx_reset_assert()
  and rtl83xx_reset_deassert() are only called from\nthe probe path, which may sleep
  and is not timing-critical.  When the\nreset GPIO is provided by a sleeping controller
  such as an I2C I/O\nexpander, gpiod_set_value() warns:\n\n  WARNING: drivers/gpio/gpiolib.c:4030
  at gpiod_set_value+0x44/0x80, CPU#1: kworker/u16:4/61\n  Hardware name: B&O MAP
  CA33 Rev f (UNKNOWN) (DT)\n  Workqueue: events_unbound deferred_probe_work_func\n\
  \  pc : gpiod_set_value+0x44/0x80\n  lr : rtl83xx_probe+0x1d8/0x3a0\n  Call trace:\n\
  \   gpiod_set_value+0x44/0x80 (P)\n   rtl83xx_probe+0x1d8/0x3a0\n   realtek_mdio_probe+0x24/0xa0\n\
  \   mdio_probe+0x38/0x78\n   really_probe+0xc4/0x3e0\n   __driver_probe_device+0x15c/0x1b8\n\
  \   driver_probe_device+0xb4/0x120\n   __device_attach_driver+0xb8/0x1a0\n   bus_for_each_drv+0x88/0xf0\n\
  \   __device_attach+0xa0/0x1d8\n   device_initial_probe+0x54/0x"
