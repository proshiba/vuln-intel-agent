title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  msm: Disable DMA for kernel console UART\n\nAt the moment, concurrent writes from
  userspace and the kernel to the\nconsole can trigger a race condition that results
  in an infinite loop of\nthe same messages printed over and over again. This is most
  likely to\nhappen during system startup or shutdown when the init system starts/stops\n\
  a large number of system services that interact with various kernel code.\n\nWhen
  userspace writes to the TTY device, the driver initiates an\nasynchronous DMA transfer
  and releases the port lock. At the same moment,\nthe kernel printk path might grab
  the port lock and re-configure the UART\ncontroller for PIO, without waiting for
  the DMA operation to complete. It\nseems like this collision results in zero progress
  being reported for the\nDMA engine, so the same text is printed to the console over
  and over again.\n\nFor the kernel console, we want a reliable output path that will
  be\nfunctional e"
