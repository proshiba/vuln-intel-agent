title: A flaw was found in hawtio-operator. The operator reads the OpenShift 
  Service CA private signing key from the openshift-service-ca namespace and 
  uses it to mint client certificates with a Subject Common Name (CN) supplied 
  by the author of a namespaced Hawtio custom resource. Because the operator 
  ships a ClusterRole that aggregates Hawtio CR permissions into the edit and 
  admin roles, any user with edit access in any namespace can obtain a 
  Service-CA-signed certificate with an arbitrary subject. This certificate can 
  be used to impersonate any in-cluster service identity to peers that trust the
  Service CA for client authentication, including Jolokia agents and other 
  Service-CA-trusting components.
