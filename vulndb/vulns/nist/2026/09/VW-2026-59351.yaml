title: A vulnerability has been found in FFmpeg up to 
  4.4.6/5.1.8/6.1.4/7.1.3/8.0.1. Affected by this issue is the function 
  setup_3x3 of the file libavfilter/vf_convolution.c of the component 
  Convolution Filter. Such manipulation leads to out-of-bounds read. The attack 
  can be executed remotely. The exploit has been disclosed to the public and may
  be used. Upgrading to version 4.4.7, 5.1.9, 6.1.5, 7.1.4, 8.0.2, 8.1.1 and 9.0
  can resolve this issue. The name of the patch is 8970658472/e24b9820b4. It is 
  suggested to upgrade the affected component.
