title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  fsl_audmix: rework runtime PM handling in probe\n\nAfter pm_runtime_enable() the
  AUDMIX block is powered off and stays\nsuspended until the first runtime resume.
  Register writes issued between\nprobe() and the first resume (e.g. from DAPM or
  ALSA control paths)\ntarget unpowered hardware and cause a system hang.\n\nFix this
  by calling pm_runtime_resume_and_get() immediately after\npm_runtime_enable() to
  power the hardware up and enable its clocks.\nRelease the reference afterwards with
  pm_runtime_put() to allow the\nruntime PM framework to suspend the device and switch
  the regmap to\ncache-only mode when idle.\n\nWhen CONFIG_PM is disabled or runtime
  PM is not enabled, pm_runtime_*\ncalls are stubs that do not power up the hardware.
  Handle this case\nexplicitly by calling fsl_audmix_runtime_resume() directly so
  the\nhardware is always initialised and its clocks are enabled, ensuring\nregister
  accesses succeed regardless of PM co"
