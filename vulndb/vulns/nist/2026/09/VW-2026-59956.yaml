title: Payload Plugins is a collection of plugins designed to enhance Payload 
  CMS. From 0.3.0 until 0.4.0, @jhb.software/payload-cloudinary-plugin 
  deployments with clientUploads enabled expose POST 
  /api/cloudinary-generate-signature, whose handler in 
  cloudinary/src/getGenerateSignature.ts passes attacker-controlled 
  body.paramsToSign directly to cloudinary.utils.api_sign_request without a key 
  allowlist, collection policy, timestamp freshness check, or configured-folder 
