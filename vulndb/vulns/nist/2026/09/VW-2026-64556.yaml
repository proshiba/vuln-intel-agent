title: An out-of-bounds read vulnerability exists in the schema lexer of flatcc 
  4c3b999e. When an exact-length FlatBuffers schema ends with an unterminated 
  quotation mark, the C-string scanning logic in lex() dereferences the input 
  pointer after it has reached the end of the buffer. A specially crafted schema
  can trigger a one-byte heap buffer over-read, resulting in application crash 
  and denial of service.
