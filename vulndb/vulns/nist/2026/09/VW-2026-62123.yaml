title: Steeltoe is an open source project that provides a collection of 
  libraries that helps users build cloud-native applications. From 4.0.0 until 
  4.3.0, EurekaDiscoveryClient deserializes the registry response as one unit, 
  and an unrecognized actionType or status, a non-Boolean 
  isCoordinatingDiscoveryServer, or a nonnumeric timestamp can abort the entire 
  response. A principal that can register or update an instance can cause all 
  connected Steeltoe clients to receive an empty or stale instance list until 
  the malformed registration is removed. The JsonInstanceInfoConverter, 
  BoolStringJsonConverter, and LongStringJsonConverter parsing paths are 
  affected. This issue is distinct from the earlier DataCenterInfo.name parsing 
  vulnerability. This issue is fixed in version 4.3.0.
