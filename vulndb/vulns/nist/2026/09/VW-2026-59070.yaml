title: LaraDashboard versions 0.9.0 through 1.2.2 fail to sanitize SVG file 
  content during media upload, allowing authenticated users with only the 
  media.create permission to upload malicious SVG files containing script tags. 
  When any user including administrators opens the stored SVG file served inline
  from the application origin, the embedded JavaScript executes in the dashboard
  context, enabling session hijacking and administrative account takeover.
