title: "Missing Authorization vulnerability in ash-project ash allows an actor to
  update records forbidden by resource policies through the atomic path of Ash.update_many/4.\n\
  \nAsh.update_many/4 runs as a single atomic statement (a data-layer update_many,
  for example a SQL MERGE) whenever an atomic strategy is used and the data layer
  supports it. Ash.Actions.Update.UpdateMany (lib/ash/actions/update/update_many.ex)
  took that path even under authorize?: true without applying the resource's policies,
  so the statement updated every row matched by primary key regardless of the policy
  filter that authorization would impose. An actor could therefore update records
  the policies forbid, such as rows belonging to another actor or tenant. The fix
  restricts the atomic path to data layers supporting changeset filters when authorizing,
  authorizes each changeset, and merges the resulting policy filter into each changeset
  so the statement only touches authorized rows.\n\nThis issue affects ash: from 3.29.0
  befor"
