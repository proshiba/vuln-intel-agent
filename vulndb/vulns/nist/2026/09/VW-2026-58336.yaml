title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  close backchannel before destroying callback service\n\nA backchannel receive can
  complete a request while the NFS callback\nservice is being torn down.  xprt_complete_bc_request()
  removes the\nrequest from bc_pa_list, drops bc_alloc_count, marks the request in
  use,\nand then asks xprt_enqueue_bc_request() to hand it to the callback\nservice.\n\
  \nIf teardown has already cleared xprt->bc_serv, xprt_enqueue_bc_request()\ncurrently
  returns without enqueueing or freeing the committed request.\nThe xprt_get() taken
  on entry is leaked as well.  If the producer wins\nthe race before bc_serv is cleared,
  it can also enqueue onto sv_cb_list\nafter nfs_callback_down() has stopped the callback
  threads, leaving the\nrequest linked to a svc_serv that is about to be freed.\n\n\
  Close the producer side before callback threads are stopped.  Add\nxprt_svc_shutdown_bc()
  to clear xprt->bc_serv under bc_pa_lock, and call\nit on callback shutdown and "
