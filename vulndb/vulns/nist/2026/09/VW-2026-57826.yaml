title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to versions 7.0.16 and 
  8.0.5, Suricata's IP defragmentation tracker lookup did not verify that an 
  existing tracker used the same IP address family as the packet being 
  processed. Under crafted fragmented IPv4/IPv6 traffic, an IPv6 fragment could 
  be associated with an IPv4 defragmentation tracker. This can lead to a remote 
  packet-triggered crash and denial of service when Suricata performs the 
  relevant defragmentation. Versions 7.0.16 and 8.0.5 contain a fix. As a 
  workaround, if using Suricata as an IDS with AF_PACKET, enabling AF_PACKET's 
  `defrag` option may prevent Suricata from seeing such fragmented packets.
