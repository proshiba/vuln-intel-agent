title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  fix race when loading and unloading a table\n\nIf the userspace calls two concurrent
  table load ioctls and one of them\nsucceeds and the other fails, there is a race
  condition because\ndm_setup_md_queue walks &md->table_devices without any lock.
  If the walk\nraces with dm_table_destroy -> free_devices -> dm_put_table_device,
  there\nis access to invalid memory.\n\nFix this race by extending the lock over
  the list walk."
