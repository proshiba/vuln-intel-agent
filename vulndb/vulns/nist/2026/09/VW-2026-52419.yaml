title: The WPLP Cookie Consent – Cookie Banner & Consent Management for GDPR, 
  CCPA & Google Consent Mode plugin for WordPress is vulnerable to arbitrary 
  file upload due to missing file type validation in the saas_upload_logo() 
  function combined with an authorization bypass on the WPLP connector REST 
  endpoints in all versions up to, and including, 4.4.1. This makes it possible 
  for unauthenticated attackers to upload arbitrary files on the affected site's
  server which may make remote code execution possible.
