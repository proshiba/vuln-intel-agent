title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: fix use-after-free of the flow table mask array\n\ntbl_mask_array_realloc()
  retires the old mask_array before it stops being\nreachable:\n\n\told = ovsl_dereference(tbl->mask_array);\n\
  \tif (old) {\n\t\t...\n\t\tcall_rcu(&old->rcu, mask_array_rcu_cb);\n\t}\n\n\trcu_assign_pointer(tbl->mask_array,
  new);\n\ncall_rcu() only waits for read-side critical sections already in flight.\n\
  tbl->mask_array still points at old between the call_rcu() and the\nrcu_assign_pointer(),
  so a reader entering ovs_flow_tbl_lookup_stats() in\nthat window picks up old in
  a fresh critical section that the pending\ngrace period does not cover.\n\ntbl_mask_array_realloc()
  runs in process context under ovs_mutex, so the\nwindow is preemptible and can outlast
  the grace period. Then\nmask_array_rcu_cb() frees old before the swap runs:\n\n\
  \  BUG: KASAN: slab-use-after-free in flow_lookup.constprop.0+0x2bf/0x2f0\n  Read
  of size 8 at addr ffff888020b3e018 by task poc/"
