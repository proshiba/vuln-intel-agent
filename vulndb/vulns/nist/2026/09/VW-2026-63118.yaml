title: A flaw was found in Netty's MqttDecoder. An unauthenticated remote 
  attacker can exploit this vulnerability by sending a specially crafted MQTT 
  CONNECT packet. The decoder fails to properly validate the 'Properties Length'
  against the 'Remaining Length', allowing an attacker to bypass size limits. 
  This leads to excessive memory and CPU consumption, resulting in a denial of 
  service (DoS) due to an OutOfMemoryError.
