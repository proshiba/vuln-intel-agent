title: "### Summary\r\nNetty's fix for CVE-2026-44248 is incomplete. The decoder checks
  if the MQTT packet's `Remaining Length` exceeds `maxBytesInMessage`, but fails to
  validate the `Properties Length` against the `Remaining Length`. An attacker can
  bypass the size limit by sending a small `Remaining Length` but an enormous `Properties
  Length`. This forces Netty to buffer and parse millions of properties, allowing
  an unauthenticated remote attacker to trigger excessive memory and CPU consumption,
  leading to OutOfMemoryError.\r\n\r\n### Details\r\nIn `io.netty.handler.codec.mqtt.MqttDecoder`,
  the `decodeProperties()` helper method reads `totalPropertiesLength` and attempts
  to parse that many bytes. If the buffer lacks the full length, a `Signal` is thrown.
  The `catch` block inside `decode()` only enforces `maxBytesInMessage` against `bytesRemainingBeforeVariableHeader`
  (the packet's `Remaining Length`).\r\n\r\nBy sending a `CONNECT` packet with a small
