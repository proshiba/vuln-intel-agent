title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  go7007: defer the ALSA v4l2 put until card release\n\ngo7007_snd_init() already
  takes a v4l2_device reference for the ALSA\nside, but go7007_snd_remove() drops
  it immediately after calling\nsnd_card_free_when_closed().\n\nThat is too early
  when a userspace process still has the capture PCM open.\nThe ALSA card and its
  PCM callbacks remain alive until the last file is\nclosed, so the release path can
  still reach struct go7007 through\npcm->private_data and call go7007_snd_hw_free()
  after the V4L2 release path\nhas freed the object.\n\nMove the matching v4l2_device_put()
  to the ALSA card private_free callback\nso the existing ALSA reference covers the
  whole deferred card lifetime."
