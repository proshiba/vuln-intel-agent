title: "OOM Denial of Service via Unbounded Map Pre-Sizing in Apache OpenNLP SymSpellModelSerializer\n\
  \nVersions Affected: \n\n- 3.0.0-M4\n- 3.0.0-M5\n\n(The opennlp-spellcheck extension
  was introduced in 3.0.0-M4. Releases 1.x and 2.x do not contain the affected code.)\n\
  \nDescription:\n\nThe SymSpellModelSerializer.create() method reads two 32-bit signed
  integer count fields (unigramCount and bigramCount) from a binary SymSpell model
  stream and passes each value directly to LinkedHashMap.newLinkedHashMap() after
  validating only that it is non-negative. No upper bound is applied, so the count
  is fully attacker-controlled when the model file originates from an untrusted source.\n\
  \nA crafted .bin model file in which either count field is set to Integer.MAX_VALUE
  (or any value large enough to exhaust the available heap) causes the map to be pre-sized
  to a capacity of 2^30 entries. The oversized backing array is allocated on the first
