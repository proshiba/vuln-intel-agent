title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPICA:
  Fix NULL pointer dereference in acpi_ns_custom_package()\n\nacpi_ns_custom_package()
  unconditionally dereferences the first element\nof the package to read the _BIX
  version number, without checking for\nNULL:\n\n    if ((*Elements)->Common.Type
  != ACPI_TYPE_INTEGER)\n\nWhen firmware returns a _BIX package whose first element
  is an\nunresolvable reference, ACPICA evaluates that entry to NULL.\nacpi_ns_remove_null_elements()
  does not strip NULL entries for\nACPI_PTYPE_CUSTOM packages (fixed-position format
  would break if\nelements were shifted), so acpi_ns_custom_package() sees the NULL\n\
  and causes a crash.\n\nAdd a NULL check for the first element (version field) before\n\
  dereferencing it. The caller then receives AE_AML_OPERAND_TYPE\ninstead of crashing."
