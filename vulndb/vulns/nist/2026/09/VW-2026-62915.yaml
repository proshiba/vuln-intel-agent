title: PoDoFo is a C++17 PDF manipulation library. From version 1.0.0 until 
  1.1.1, processing a crafted PDF with an Indexed color-space image can cause a 
  heap out-of-bounds read in PdfColorSpaceFilterIndexed::FetchScanLine in 
  src/podofo/main/PdfColorSpaceFilter.cpp. PODOFO_INVARIANT does not perform a 
  runtime check, so a pixel index greater than or equal to m_MapSize can address
  beyond m_lookup. PdfColorSpaceFilterFactory::TryCreateFromObject also 
  validates hival with an incorrect conjunction and no upper bound, allowing 
  malformed Indexed color-space metadata outside the expected range. The 
  resulting read can disclose adjacent heap data or crash the processing 
  application. This issue is fixed in version 1.1.1.
