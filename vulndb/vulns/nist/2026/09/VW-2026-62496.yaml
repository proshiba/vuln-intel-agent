title: "In the Linux kernel, the following vulnerability has been resolved:\n\niomap:
  release the folio batch on iomap callback failures\n\nA sashiko review of an unrelated
  patch points out that the folio\nbatch mechanism used for iomap zero range fails
  to release the batch\nin a couple error scenarios. If either calls to ->iomap_end()
  or\n->iomap_begin() fail, the direct return paths bypass the batch\ncleanup.\n\n\
  The ->iomap_end() case is not a practical issue at the moment\nbecause there is
  no user of the mechanism that returns an error from\nthis path. The ->iomap_begin()
  case is theoretically possible\nbecause XFS can invoke the fill helper and error
  out at various\npoints thereafter. This subtly complicates things because XFS does\n\
  not transfer iomap_flags to the iomap data structure in the error\npath.\n\nTo deal
  with both of these issues, first make sure to invoke the\ncleanup helper in the
  error path for either fs callback. Second,\nupdate the helper to clear the flag
  unconditionally and release the\nbatch"
