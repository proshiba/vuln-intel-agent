title: The JetFormBuilder — Dynamic Blocks Form Builder plugin for WordPress is 
  vulnerable to Privilege Escalation in all versions up to, and including, 
  3.6.2. This is due to the plugin not validating that a submitted form ID 
  belongs to a JetFormBuilder form before parsing the referenced post's content 
  as form schema and executing an Advanced Validation server-side callback. This
  makes it possible for unauthenticated attackers to create a new 
  administrator-level user account.
