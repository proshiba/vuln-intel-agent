title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Fix event length with forced 8-byte alignment\n\nWhen RB_FORCE_8BYTE_ALIGNMENT is
  true, rb_calculate_event_length()\nreserves the space of event->array[0] for placing
  the data length and\nrb_update_event() stores the data length in event->array[0]\n\
  accordingly. As a result the whole event length will add extra 4 bytes\nfor sizeof(event.array[0])
  unconditionally.\n\nBut ring_buffer_event_length() only subtracts the\nsizeof(event->array[0])
  for events larger than RB_MAX_SMALL_DATA +\nsizeof(event->array[0]). As a result,
  small events on architectures\nwith RB_FORCE_8BYTE_ALIGNMENT=true report a data
  length that is 4\nbytes larger than expected.\n\nTo fix it, add the RB_FORCE_8BYTE_ALIGNMENT
  as a condition to subtract\nthe size of that length field whenever RB_FORCE_8BYTE_ALIGNMENT
  is\ntrue.\n\nThis issue is observed in a riscv64 kernel with\nCONFIG_HAVE_64BIT_ALIGNED_ACCESS
  set to y, when we run ftrace selftest\ntrace_marker_r"
