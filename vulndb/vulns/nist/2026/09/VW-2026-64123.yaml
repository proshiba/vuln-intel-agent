title: vLLM through 0.29.0 contains a denial of service vulnerability in P2P KV 
  offloading when OffloadingConnector is configured with TieringOffloadingSpec 
  and a peer-to-peer secondary tier. Attackers can supply arbitrary remote host 
  and port values in kv_transfer_params to create unreachable peer sessions that
  retain ZeroMQ sockets until the context quota is exhausted, causing an 
  uncaught ZMQError that crashes EngineCore and stops all inference.
