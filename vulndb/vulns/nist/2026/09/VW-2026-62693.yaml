title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  RISC-V: Fix riscv_acpi_add_prt_dep() loop handling\n\nThe loop in riscv_acpi_add_prt_dep()
  includes error conditions that are\nhandled in a dubious - if not outright wrong
  - way, by continuining the\nloop (which skips and misses the entry pointer update
  to point to the next\nentry).\n\nRewrite the loop as a for loop (that handles the
  continuation correctly)\nand wrap the condition and update statements using helper
  functions to make\nit cleaner."
