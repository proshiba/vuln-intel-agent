title: A vulnerability was detected in marcobambini Gravity up to 0.9.7. This 
  impacts the function parse_number_expression of the file 
  src/compiler/gravity_parser.c of the component Number Parser. Performing a 
  manipulation results in out-of-bounds read. It is possible to initiate the 
  attack remotely. The exploit is now public and may be used. Upgrading to 
  version 0.9.8 will fix this issue. The patch is named 
  1b9bbf3ad5749e2a3434e6ad073c6e93c24207b6. It is recommended to upgrade the 
  affected component.
