title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  espintcp: fix UAF during close\n\nZDI reported and analyzed a race condition during
  close for espintcp\nsockets:\n\n    espintcp_close() frees emsg->skb via kfree_skb()
  without holding\n    any socket lock. Concurrently, the xfrm_trans_reinject work
  queue\n    invokes esp_output_tcp_finish() -> espintcp_push_skb() ->\n    espintcp_push_msgs()
  -> skb_send_sock_locked(), which reads the\n    same skb as a data source.\n\nFix
  this by adding a synchronize_rcu() call after resetting sk_prot,\nsince esp_output_tcp_finish()
  runs under RCU and won't use a socket\nwith sk_prot == &tcp_prot.  Simply taking
  the socket lock in\nespintcp_close() could lead to leaks, if esp_output_tcp_finish()\n\
  re-adds an skb in the slot we just freed. After this, the existing\nbarrier() is
  no longer needed."
