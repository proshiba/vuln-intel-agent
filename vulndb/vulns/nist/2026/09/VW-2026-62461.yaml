title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: fix out-of-bounds link array access in mt7996_tx()\n\nWhen mac80211
  leaves the link unspecified, mt7996_tx() substitutes the\nprimary link id of the
  station or vif. That value is\nIEEE80211_LINK_UNSPECIFIED (0xf) until the first
  link has been added,\nand it is then used unchecked to index vif->link_conf[],\n\
  mvif->mt76.link[] and sta->link[], all of which hold\nIEEE80211_MLD_MAX_NUM_LINKS
  (15) entries.\n\nClamp the primary link id to the default link before using it,
  and use\nthe clamped value for the link_sta fallback as well."
