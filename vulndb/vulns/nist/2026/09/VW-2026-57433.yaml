title: Velociraptor allows some sensitive artifacts to be gated by additional 
  permissions. For example, the Linux.Sys.BashShell artifact allows arbitrary 
  command execution on endpoints, and so it requires the EXECVE permission to 
  schedule. However, no such check was implemented for client monitoring 
  artifacts. Additionally there was no requirement that client monitoring 
  artifacts carry the CLIENT_EVENTS type. This allows any user who can schedule 
  client monitoring artifacts to also schedule otherwise restricted artifacts 
  (such as Linux.Sys.BashShell).
