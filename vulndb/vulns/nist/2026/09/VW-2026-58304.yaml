title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  fnic: Use GFP_ATOMIC for VLAN alloc under spinlock\n\nfnic_fcoe_process_vlan_resp()
  allocates a VLAN descriptor with\nkzalloc_obj() (default GFP_KERNEL) while holding
  vlans_lock via\nspin_lock_irqsave(). GFP_KERNEL may sleep, which is not allowed
  in this\natomic context and can trigger a sleeping-from-invalid-context warning\n\
  or deadlock.\n\nPass GFP_ATOMIC so the allocation is safe under the IRQ-safe spinlock."
