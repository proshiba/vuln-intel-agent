title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  intel/ipu6: fix async notifier cleanup leak on parse error\n\nisys_notifier_init()
  calls v4l2_async_nf_init() and then adds fwnode\nremote subdevs in a loop with v4l2_async_nf_add_fwnode_remote().
  If an\nendpoint parse or add fails partway through the loop, it jumps to\nerr_parse
  and returns without calling v4l2_async_nf_cleanup(), leaking\nevery v4l2_async_connection
  already added to the notifier's waiting\nlist.\n\nThe register-failure path just
  below already cleans up correctly, and\nthe caller only tears the notifier down
  (isys_notifier_cleanup()) once\nisys_notifier_init() has returned success. Clean
  up the notifier on the\nparse error path too."
