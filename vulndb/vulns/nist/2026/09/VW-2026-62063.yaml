title: vm2 versions from 3.11.3 before 3.11.7 expose the host tls module to 
  NodeVM sandbox code, allowing attackers to call tls.setDefaultCACertificates()
  and replace process-wide certificate authorities. Attackers with access to 
  allowed tls and url builtins can use URLSearchParams to create host-realm 
  arrays and manipulate the TLS trust store, enabling subsequent host HTTPS 
  clients to accept attacker-controlled certificates.
