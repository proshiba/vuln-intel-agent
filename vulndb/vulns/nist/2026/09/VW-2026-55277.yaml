title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 fails
  to validate ownership of live_restreams_id in resendRestreamer.json.php, 
  allowing authenticated users with canStream to access other users' restream 
  destinations. Attackers can broadcast their live stream to victim-configured 
  restream destinations by supplying arbitrary live_restreams_id values, 
  hijacking YouTube, Facebook, or Twitch streams using victim stream keys.
