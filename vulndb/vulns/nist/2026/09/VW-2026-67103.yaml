title: A vulnerability was detected in DevaslanPHP project-management 
  1.2.1/1.2.2/1.2.3/1.2.4/2.0.0-beta1. This affects the function whereRaw of the
  file app/Filament/Widgets/Timesheet/ActivitiesReport.php of the component 
  Timesheet Dashboard. Performing a manipulation of the argument filter results 
  in sql injection. The attack is possible to be carried out remotely. The 
  exploit is now public and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
