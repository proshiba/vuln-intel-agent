title: "Netty's HTTP/3 codec (io.netty:netty-codec-http3) versions 4.2.2.Final through
  4.2.17.Final builds the HTTP/3 :authority pseudo-header from the HTTP/1 Host header
  before considering the authority of an absolute-form HTTP/1 request-target. In HttpConversionUtil.toHttp3Headers(HttpMessage,
  boolean) — reached via Http3FrameToHttpObjectCodec(false) — a non-empty Host header
  takes precedence over the request-target authority, contrary to the HTTP/1.1 rule
  that a server receiving an absolute-form request-target must ignore the Host header.
  In a Netty-based HTTP/1-to-HTTP/3 gateway, proxy, or protocol bridge, a remote client
  can send a request such as \"GET https://trusted.example/admin HTTP/1.1\" with \"\
  Host: attacker.example\", causing components that validate, authorize, or route
  on the RFC-defined request-target authority to reach a different decision than the
  upstream HTTP/3 peer, which receives :authority derived from the conflicting Host
  header. This authority confusion can affect virtual-"
