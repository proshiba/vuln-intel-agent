title: 'XenForo before 2.3.13 contains a cross-site scripting vulnerability in the
  dynamic redirect handler that allows unauthenticated attackers to execute arbitrary
  JavaScript in the board origin by crafting a malicious javascript: URI that bypasses
  host validation. Attackers can embed the board hostname in the URI authority component
  and use percent-encoded newlines to evade server-side filters, causing authenticated
  users who perform a Follow action to execute attacker-supplied JavaScript in their
  browser.'
