title: A flaw was found in libtpms, a library that provides software TPM 2.0 
  emulation. When restoring TPM 2.0 state (for example during a virtual 
  machine's power-on or state/migration restore), a malformed state blob can 
  supply an oversized skip-block length that is not validated against the 
  remaining size of the input buffer. This can drive an internal size counter 
  negative, which bypasses a subsequent bounds check due to an unsafe 
  signed-to-unsigned conversion, causing the parser to read memory outside the 
  bounds of the heap buffer holding the state data. Successful exploitation can 
  crash the process hosting libtpms (such as swtpm), resulting in a denial of 
  service of the emulated TPM device and the virtual machine that depends on it.
  No data corruption or information disclosure was confirmed.
