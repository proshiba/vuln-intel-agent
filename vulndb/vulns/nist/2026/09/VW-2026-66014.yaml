title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/cfi:
  Fix FineIBT hash offset in cfi_get_func_hash()\n\nThe switch of the FineIBT preamble
  from \"subl $hash, %r10d\" to the\nshorter \"subl $hash, %eax\" moved the hash immediate
  from offset 7 to\noffset 5 of the preamble. fineibt_preamble_hash was updated to
  match,\nbut the open-coded offset in cfi_get_func_hash() was missed and it\nstill
  reads the hash at offset 7.\n\ncfi_get_func_hash() is used by the BPF JIT to give
  a struct_ops\ntrampoline the CFI hash of the stub function it stands in for. With\n\
  FineIBT the trampoline now gets the upper half of the real hash\nfollowed by the
  first two bytes of the next instruction, so the first\nindirect call from the kernel
  into a struct_ops program,\ntcp_init_congestion_control() calling ->init() of a
  BPF congestion\ncontrol for example, fails the FineIBT check and the kernel dies
  with\na CFI failure.\n\nMove the FineIBT preamble template and its offset defines
  above\ncfi_get_func_hash() and us"
