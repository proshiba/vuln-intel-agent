title: A flaw was found in Netty's `netty-handler-ssl-ocsp` component. A remote 
  attacker can exploit this vulnerability by providing an Online Certificate 
  Status Protocol (OCSP) response that omits the optional `nextUpdate` field. 
  This omission causes the OCSP validation to be silently skipped, leading to 
  applications proceeding with an unvalidated certificate. This can result in a 
  bypass of security controls where certificate validation is expected.
