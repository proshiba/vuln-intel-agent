title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix stride mismatch in mac_phy_caps_parse()\n\nCurrently, in ath12k_wmi_mac_phy_caps_parse(),
  kzalloc() sizes the\nmac_phy_caps buffer as tot_phy_id * len, where len is clamped
  to\nmin(firmware_len, sizeof(struct ath12k_wmi_mac_phy_caps_params)). The\nsubsequent
  memcpy() destination advances by sizeof(full struct) per slot\nvia C pointer arithmetic,
  not by the clamped len. When firmware sends\nshort TLVs, the second and later slots
  are written past the end of the\nallocation.\n\nThe reader in ath12k_pull_mac_phy_cap_svc_ready_ext()
  also indexes the\nbuffer with full-struct pointer arithmetic, so the allocation
  must match\nthat stride.\n\nFix by using kzalloc_objs(), which derives the element
  size from the\npointer type, making allocation size and pointer stride provably\n\
  consistent regardless of what len the firmware provides.\n\nTested-on: WCN7850 hw2.0
  PCI WLAN.HMT.1.1.c7-00108-QCAHMTSWPL_V1.0_V2.0_SILICONZ_UPSTREAM-3"
