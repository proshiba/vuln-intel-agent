title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  ubi: Release device reference on busy detach\n\nubi_detach_mtd_dev() obtains a device
  reference through ubi_get_device()\nbefore checking whether the UBI device is busy.
  The busy return path drops\nubi->ref_count but leaves the device reference held,
  so the device object\ncannot be released after a later detach.\n\nDrop the device
  reference before returning -EBUSY."
