title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix NULL-ptr-deref when showing a void BTF type\n\nbtf_modifier_show() resolves
  the modifier and then calls\nbtf_type_ops(t)->show() unconditionally. For the void
  type (type_id 0,\nBTF_KIND_UNKN) kind_ops[] has no entry, so ->show is NULL.\n\n\
  A \"const void\" (a modifier resolving to void) cannot be a map key or\nvalue -
  map_check_btf() rejects it because void has no size - so the map\ndump path does
  not reach it. But bpf_snprintf_btf() takes a type_id\nstraight from the BPF program,
  and passing such a \"const void\" from the\nvmlinux BTF NULL-derefs:\n\nKASAN: null-ptr-deref
  in range [0x0000000000000028-0x000000000000002f]\nRIP: 0010:btf_modifier_show (kernel/bpf/btf.c:2914)\n\
  Call Trace:\n <TASK>\n btf_type_show (kernel/bpf/btf.c:8251)\n btf_type_snprintf_show
  (kernel/bpf/btf.c:8321)\n bpf_snprintf_btf (kernel/trace/bpf_trace.c:1047)\n bpf_prog_test_run_raw_tp
  (net/bpf/test_run.c:829)\n __sys_bpf (kernel/bpf/syscall.c:4804)\n do_syscall"
