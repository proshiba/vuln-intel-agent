title: A vulnerability was detected in Dromara mayfly-go up to 1.11.5. The 
  impacted element is the function RunMachineScript of the file 
  server/internal/machine/api/machine_script.go of the component Machine Script 
  Feature. The manipulation of the argument params results in os command 
  injection. The attack can be executed remotely. The exploit is now public and 
  may be used. Exploitation needs no admin account. Any account holding 
  machine:script:run plus tag access reaches arbitrary command execution on 
  machines whose templates contain {{.param}} placeholders; the SSH exec layer 
  (Cli.Run) also applies no input filtering to any caller. The vendor was 
  contacted early about this disclosure but did not respond in any way.
