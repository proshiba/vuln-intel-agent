title: "In the Linux kernel, the following vulnerability has been resolved:\n\naf_packet:
  Don't send zero-byte data in tpacket_snd().\n\nsyzbot reported a WARNING in __dev_queue_xmit()
  triggered via tpacket_snd():\n\nskb_assert_len\nWARNING: at include/linux/skbuff.h:2753
  skb_assert_len\nWARNING: at __dev_queue_xmit+0x21bc/0x4970 net/core/dev.c:4781\n\
  \nCall Trace:\n <TASK>\n dev_queue_xmit include/linux/netdevice.h:3448 [inline]\n\
  \ packet_xmit+0x243/0x310 net/packet/af_packet.c:276\n tpacket_snd net/packet/af_packet.c:2907
  [inline]\n packet_sendmsg+0x28d6/0x4eb0 net/packet/af_packet.c:3134\n\nWhen sending
  0-byte packets via TPACKET ring buffer on devices with no\nhard header (e.g. dev->hard_header_len
  == 0), tpacket_fill_skb()\npopulates an skb with skb->len == 0 and returns 0. tpacket_snd()
  then\nforwards this empty skb to packet_xmit(), causing __dev_queue_xmit() to\n\
  hit skb_assert_len(skb).\n\nSimilar checks exist in packet_snd() via commit dc633700f00f\n\
  (\"net/af_packet: check len when min_header_len equals to 0\") "
