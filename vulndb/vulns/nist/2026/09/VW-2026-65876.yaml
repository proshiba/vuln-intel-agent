title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix soft lockup polling continuation IOCB signature\n\nqla27xx_copy_multiple_pkt()
  and qla27xx_copy_fpin_pkt() poll\nrsp_q->ring_ptr->signature for RESPONSE_PROCESSED
  (0xDEADDEAD) to decide\nwhether the next continuation IOCB has arrived, spinning
  on cpu_relax()\nwithout advancing the ring or decrementing the entry count while
  it has\nnot. response_t::signature lives at byte offset 60, but a continuation\n\
  IOCB (sts_cont_entry_t / struct sts_cont_entry_ext) carries raw FC frame\npayload
  at that offset (data[56..59]). A received frame whose payload\nbytes happen to equal
  0xDEADDEAD is therefore misread as \"not yet\narrived\", and the loop spins forever
  in interrupt/DPC context, causing a\nCPU soft lockup.\n\nThe poll is also unnecessary:
  callers of qla27xx_copy_multiple_pkt()\n(PT_LS4_UNSOL and the NVMe purls path) already
  gate on\nqla_chk_cont_iocb_avail(), which guarantees all entry_count IOCBs are\n\
  present before copyi"
