title: Redocly CLI makes OpenAPI validation, linting, and documentation 
  workflows easier. Prior to @redocly/cli 2.33.2, the split command constructs 
  output paths under --outDir from untrusted OpenAPI or AsyncAPI component names
  and x-codeSamples lang values without verifying that the resolved target 
  remains inside the selected directory. A description containing literal ../ 
  traversal segments in those fields can cause the split command to place or 
  overwrite files outside --outDir. Component data remains constrained to YAML 
  or JSON, and code-sample filenames remain based on the HTTP method, so this is
  not an unrestricted arbitrary-content file write. This issue is fixed in 
  @redocly/cli version 2.33.2.
