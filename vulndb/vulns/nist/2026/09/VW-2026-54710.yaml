title: "A weakness has been identified in liufee FeehiCMS up to 2.1.1. This impacts
  an unknown function of the file environments/prod/backend/config/main-local.php
  of the component Cookie Validation. This manipulation of the argument cookieValidationKey
  causes use of hard-coded cryptographic key\r . The attack is possible to be carried
  out remotely. The exploit has been made available to the public and could be used
  for attacks. The project was informed of the problem early through an issue report
  but has not responded yet."
