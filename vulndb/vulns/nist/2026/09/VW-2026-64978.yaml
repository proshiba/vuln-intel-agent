title: "A flaw was found in Red Hat Ansible Automation Platform's automation-\ncontroller.
  The provisioning-callback secret (host_config_key) is exposed to\nusers holding
  only the read-level view_jobtemplate permission -- both in the\njob template API
  representation and in the activity stream -- and the\nprovisioning callback endpoint
  trusts a client-supplied X-Forwarded-For\nheader to determine the calling host when
  the controller is deployed behind\nthe AAP gateway with an empty proxy allow-list.
  By reading the secret and\nspoofing X-Forwarded-For to match any host in the job
  template's inventory, a\nminimally privileged or unauthenticated remote attacker
  can launch the job\ntemplate against arbitrary managed hosts using the job template's
  credentials,\nresulting in privilege escalation and remote code execution on managed
  hosts."
