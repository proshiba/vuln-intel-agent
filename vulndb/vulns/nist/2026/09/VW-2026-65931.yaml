title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix double-unmap of directory block\n\nFix afs_edit_dir_remove() to use a cleanup
  function to unmap the block\npointed to by afs_dir_iter::block if it's left pointing
  to something rather\nthan manually kunmapping the blocks.  Manually kunmapping without
  clearing\niter.blocks can result in a double-kunmap if afs_dir_find_block() is called\n\
  twice in a row (which would be the case if the block being modified is not\nfirst
  in the hash chain)."
