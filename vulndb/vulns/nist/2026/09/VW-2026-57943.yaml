title: The Gutenverse News  WordPress plugin before 3.3.3 does not restrict the 
  extra HTML it adds to WordPress's allowed elements to the context it is meant 
  for, applying the same relaxed list to every sanitisation context including 
  untrusted comments, allowing unauthenticated users to store JavaScript that 
  will execute in the browser of any administrator who reviews the comment 
  queue, and of any visitor to the post once the comment is approved.
