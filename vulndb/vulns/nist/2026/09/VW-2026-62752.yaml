title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmack:
  fix incorrect task context in smack_msg_queue_msgrcv\n\nThe smack_msg_queue_msgrcv()
  function incorrectly checks\nthe permissions of the 'current' task instead of the\n\
  'target' task.\n\nIn the msgsnd() syscall path, if a receiver is already waiting,\n\
  the pipelined_send() optimization is used to push the message\ndirectly to the receiver
  task:\n\n    ipc/msg.c`pipelined_send():\n    ` smp_store_release(&msr->r_msg, msg)\n\
  \nIn this case, the 'sender' (current) task performs the check\non behalf of the
  'receiver' task (msr->r_tsk, passed as the\n'target' parameter):\n\n  ipc/msg.c`pipelined_send():\n\
  \  ` security_msg_queue_msgrcv(,, target := msr->r_tsk,,)\n\nHowever, smack_msg_queue_msgrcv()
  ignores the 'target' and\nchecks 'current':\n\n  smack_msg_queue_msgrcv(…)\n  `
  smk_curacc_msq(isp, MAY_READWRITE); // current task\n\n'current' MAY satisfy smack_msg_queue_msgrcv
  r/w requirement,\nbut 'target' (the receiver task) might NOT;\nas a result"
