title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpu:
  host1x: Avoid stack over-read in debug output helpers\n\nhost1x_debug_output() and
  host1x_debug_cont() used vsnprintf(), which\nreturns the length the formatted string
  would have reached with an\nunbounded buffer. That return value was passed straight
  to o->fn as\nthe number of bytes to emit.\n\nThis could cause a read past end of
  the output buffer if a call to\nhost1x_debug_* produced a string longer than 256
  bytes. This only\naffected the debugfs files as the printk debug sink ignores the\n\
  number of bytes. In practice, this is very unlikely to occur.\n\nFix by switching
  to vscnprintf(), which returns the number of bytes\nactually written."
