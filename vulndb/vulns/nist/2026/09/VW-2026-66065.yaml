title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_console:
  do not free control-out buffers on remove\n\n__send_control_msg() publishes &portdev->cpkt
  as the control-out\nvirtqueue cookie. remove_vqs() walks every virtqueue and passes
  leftover\ncookies to free_buf(), which treats them as struct port_buffer and\nreads
  sgpages.\n\nIf a control message is still on c_ovq when the device is unbound,\n\
  free_buf() reads past the ports_device object.\n\nKASAN reported slab-out-of-bounds
  in free_buf():\n\n\tfree_buf\n\tremove_vqs\n\tvirtcons_remove\n\tunbind_store\n\n\
  The object was the ports_device allocated in virtcons_probe().\n\nDrain c_ovq without
  freeing. The packet lives in portdev and is released\nwith it."
