title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. From 1.7.0 until 2.5.1, the POST 
  /credentials/:id/deploy-to-host endpoint resolves credential and target-host 
  records from attacker-controlled credentialId and targetHostId integer values 
  without checking that either record belongs to the requesting user. In 
  src/backend/database/routes/credentials.ts, differential errors reveal whether
  credential and host records exist and disclose each record's authType value. 
  Properly encrypted passwords and keys are not disclosed, but a 
  key-authenticated victim host can receive an outbound SSH connection attempt 
  using the attacker's public key. This issue is fixed in version 2.5.1.
