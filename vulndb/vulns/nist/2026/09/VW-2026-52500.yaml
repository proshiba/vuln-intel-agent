title: Kyverno versions v1.9.0 through v1.12.7 contain a policy exception 
  handling flaw. When a policy in enforce mode is combined with two 
  PolicyExceptions, the less restrictive exception takes precedence, allowing an
  attacker to bypass the policy by crafting a resource name that matches the 
  second exception's name pattern (e.g., '*ingress*'). This can be used to 
  circumvent policies such as one blocking hostPath volumes. Fixed in v1.13.0.
