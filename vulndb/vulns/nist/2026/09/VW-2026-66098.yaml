title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  nfp: bound the ntuple rule dump by the caller's buffer size\n\nnfp_net_get_fs_loc()
  dumps every entry of nn->fs.list into rule_locs[]\nwithout consulting cmd->rule_cnt,
  which is how many entries the caller\nhad room for.  ETHTOOL_GRXCLSRLALL requires
  no CAP_NET_ADMIN and the\nioctl sizes the buffer from the rule_cnt userspace passes
  in, so once an\nadmin has installed flow steering rules any user can ask for fewer
  slots\nthan there are rules and run off the end of the allocation.  A rule_cnt\n\
  of 0 leaves the buffer pointer NULL and the walk dereferences it.\n\nBail out with
  -EMSGSIZE when the buffer fills up, the way the other\nntuple capable drivers do,
  and report how many locations were filled so\na shrinking rule list does not leave
  the caller reading stale slots."
