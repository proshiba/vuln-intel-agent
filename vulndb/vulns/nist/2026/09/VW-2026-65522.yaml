title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  mediatek: mt8365-afe-pcm: fix possible NULL-pointer dereferences in mt8365_afe_suspend()\n\
  \nmt8365_afe_suspend() allocates the register backup buffer with\ndevm_kcalloc(),
  but does not check for allocation failure before using the\nreturned pointer. This
  may lead to a NULL pointer dereference when\naccessing afe->reg_back_up[i].\n\n\
  Add the missing NULL check and return -ENOMEM on allocation failure after\ndisabling
  the main clock.\n\nAlso propagate the return value of mt8365_afe_suspend() in\n\
  mt8365_afe_dev_runtime_suspend() so that the suspended state is not updated\nwhen
  suspend fails."
