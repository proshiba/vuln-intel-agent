title: A flaw was found in GIMP. When processing a specially crafted 
  GIMPressionist preset file, the plug-in does not properly validate vector 
  indices before writing into fixed-size arrays. This can lead to an 
  out-of-bounds write, corrupting memory. An attacker could exploit this by 
  convincing a user to load a malicious preset file, potentially causing a crash
  or enabling arbitrary code execution.
