title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau/dmem:
  fix mismatched DMA unmap size for large folios\n\nDevice-private THP migration maps
  migration buffers with page_size()\nand records that length in dma_info->size. \
  \ For a compound folio\npage_size() is PAGE_SIZE << order, but two teardown sites
  still pass a\nliteral PAGE_SIZE to dma_unmap_page():\n\n  - nouveau_dmem_migrate_to_ram()
  on the success path, and\n  - nouveau_dmem_migrate_copy_one() on the copy-error
  path.\n\nFor an order > 0 folio this unmaps less than was mapped, leaking the\n\
  remainder of the IOMMU/IOVA mapping.  The other unmap sites, in\nnouveau_dmem_migrate_chunk()
  and nouveau_dmem_evict_chunk(), already\nuse the saved size; use it here too."
