title: The Forminator Forms WordPress plugin before 1.57.2.1 does not verify 
  that a request came from a trusted proxy before preferring client-supplied 
  forwarding headers over the connecting address, and it uses that value both to
  enforce its per-visitor voting limit and to record who submitted an entry. 
  Unauthenticated visitors can therefore vote without limit on any poll and can 
  choose the address stored against every submission they make.
