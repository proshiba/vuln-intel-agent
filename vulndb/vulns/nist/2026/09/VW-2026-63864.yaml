title: github.com/temporalio/tchannel-go did not validate the one-byte 
  checksum-type field in inbound TChannel call frames. A network peer that can 
  reach a listener can complete the standard initialization handshake and send a
  call request with an unsupported checksum type. The parser uses that value as 
  an index into a four-entry checksum pool, causing an unrecovered Go panic on 
  the connection read goroutine and terminating the hosting process. This allows
  remote denial of service against applications that expose the listener to 
  untrusted peers. The impact is limited to availability; no confidentiality or 
  integrity impact was identified.
