title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  reject BPF_PSEUDO_FUNC reference to the main program\n\nfixups.c:jit_subprogs()
  rewrites BPF_PSEUDO_FUNC loads to contain real\nfunction addresses. This function
  is invoked from bpf_jit_subprogs()\nonly when env->subprog_cnt > 1. Meaning that
  for any program like\nbelow:\n\n  int main(void *ctx) {\n    void *ptr = main;\n\
  \    ...\n    bpf_timer_set_callback(..., ptr);\n    ...\n  }\n\nThe 'ptr' won't
  be ever converted to contain an address.\nIn combination with e.g. bpf_timer_set_callback()
  this would lead to a\nfunction call at a bogus address.\n\nInstead of complicating
  the implementation, just assume that no useful\nprogram needs main to be a sync
  or async callback and reject\nBPF_PSEUDO_FUNC loads for the main subprogram."
