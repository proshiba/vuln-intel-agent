title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix NULL pointer dereference in nvmet_execute_identify_ns_zns()\n\nWhen a host issues
  an Identify command with CNS 05h (I/O Command Set\nspecific Identify Namespace)
  and CSI 02h (ZNS) targeting a file-backed\nnamespace, nvmet_execute_identify_ns_zns()
  calls bdev_is_zoned() on\nreq->ns->bdev. A file-backed namespace has no block device,
  so\nreq->ns->bdev is NULL and bdev_is_zoned() dereferences it, oopsing.\n\nThe I/O
  command set is selected by the host-supplied CSI field and the\ncommand is routed
  here whenever CONFIG_BLK_DEV_ZONED is enabled,\nindependent of the namespace backing
  type, so any file-backed namespace\nis exposed.\n\nReject the command with Invalid
  Field when the namespace is not backed\nby a block device."
