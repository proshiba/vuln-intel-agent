title: Snipe-IT before 8.7.1 fails to validate the length of the note field in 
  the POST /account/accept/{acceptance} endpoint, allowing authenticated users 
  to submit unbounded input that reaches synchronous CommonMark rendering. 
  Attackers can submit large note values to exhaust PHP worker CPU and cause 
  denial of service through resource exhaustion in the markdown parsing 
  pipeline.
