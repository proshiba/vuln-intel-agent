title: Moquette is a lightweight Java MQTT broker. Prior to 0.18.1, 
  PostOffice.subscribe parses a shared-subscription filter through 
  SharedSubscriptionUtils.extractShareName before validating the complete 
  $share/{shareName}/{topicFilter} structure. A remote client can send a filter 
  such as $share/grp without a topic-filter portion, causing a 
  StringIndexOutOfBoundsException while calculating the share name. The 
  exception terminates command handling on the shared session event loop and can
  deny service to other client sessions assigned to that loop. This issue is 
  fixed in version 0.18.1.
