title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  thunderbolt: Mark the connection down when bringing it up fails\n\nEvery failure
  path in tbnet_connected_work() undoes its own work and\nreturns without clearing
  login_sent, so the connection still looks\nestablished. The next tbnet_tear_down()
  therefore takes its main branch\nand repeats a teardown that already happened: it
  stops rings that are\nalready stopped, which is a dev_WARN() and fatal under panic_on_warn,\n\
  and it releases net->remote_transmit_path even on the HopID mismatch\npath, where
  this connection never owned that id, silently freeing one\nthat someone else is
  still using.\n\nClear login_sent on those paths. That is enough for tbnet_tear_down()
  to\nleave the unwound state alone, and login_received has to stay set: it\nrecords
  that the peer has logged in and carries the transmit path it gave\nus, which nothing
  on this side can make the peer send again. Two things\nchange beyond keeping the
  teardown out of the way:"
