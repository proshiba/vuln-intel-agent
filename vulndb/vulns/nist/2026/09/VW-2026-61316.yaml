title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  fix stale pqap_hook pointer on error in vfio_ap_mdev_set_kvm()\n\nIn vfio_ap_mdev_set_kvm(),
  kvm->arch.crypto.pqap_hook is set to\n&matrix_mdev->pqap_hook before the update
  locks are acquired and the\nmdev list is checked for a conflicting assignment. If
  another mdev is\nalready attached to the same KVM instance, the function returns
  -EPERM\nwithout restoring the hook pointer, leaving kvm->arch.crypto.pqap_hook\n\
  pointing at the failing matrix_mdev instead of the mdev that legitimately\nowns
  the KVM.\n\nSince matrix_mdev->kvm is never set on this error path,\nvfio_ap_mdev_unset_kvm()
  will not clean up the hook when matrix_mdev\nis later closed. If matrix_mdev is
  subsequently freed, any PQAP\ninstruction executed by the guest will dereference
  the stale pointer\nthrough pqap_hook_rwsem, resulting in a use-after-free.\n\nSince
