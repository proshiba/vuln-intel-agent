title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  acomp - allocate async request context when cloning\n\nACOMP_REQUEST_ON_STACK()
  reserves only enough storage for the\nsynchronous fallback. When an async implementation
  is selected, callers\nclone that stack request before retrying, but acomp_request_clone()\n\
  currently copies only the stack-sized object. The clone therefore has no\nstorage
  for the async provider request context, and providers such as QAT\nwrite past the
  allocation through acomp_request_ctx(). KASAN does report\na slab OOB write.\n\n\
  Allocate a zeroed clone large enough for the runtime acomp request size,\ncopy only
  the bytes present in the source object, and preserve the\nexisting fallback-on-allocation-failure
  behavior. Use the runtime reqsize\nbecause an implementation may adjust it during
  tfm initialization."
