title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: pin DFS superblock in iterator callback\n\ntcon_super_cb() stores a raw
  superblock pointer, but __cifs_get_super()\ntakes its active reference only after
  iterate_supers_type() has dropped\ns_umount and its passive reference. Concurrent
  DFS automount expiry can\ntherefore free the superblock before cifs_sb_active()
  uses it.\n\nA deterministic KASAN test reproduces the race as:\n\n  BUG: KASAN:
  slab-use-after-free in cifs_sb_active+0x77/0x80\n\nThe same test passes with this
  change applied.\n\nTake the active reference in the callback while iterate_supers_type()\n\
  still holds s_umount shared. cifs_put_tcp_super() remains the matching\nrelease."
