title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  virtio_bt: avoid OOB read of build info string\n\nThe virtbt_setup_zephyr() sends
  the Zephyr vendor command 0xfc08 (Read\nBuild Information) and hands the response
  to bt_dev_info() and\nhci_set_fw_info() as a \"%s\" string starting at skb->data
  + 1, without\nchecking the length. A backend that answers with status only leaves
  that\npointer past the end of the received data, so the walk reads adjacent\nslab
  memory until it meets a NUL. Those bytes reach the kernel log and\nthe firmware-info
  debugfs file.\n\nTo fix this, print the string with a bounded \"%.*s\" limited to\n\
  skb->len - 1. A short or unterminated response then prints as much as\narrived instead
  of failing setup.\n\nThis mirrors commit dd068ef04412 (\"Bluetooth: bpa10x: avoid
  OOB read of\nrevision string in bpa10x_setup()\"), which fixed the identical pattern."
