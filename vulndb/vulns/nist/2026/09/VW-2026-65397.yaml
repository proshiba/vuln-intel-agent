title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: cap out-of-range rx MCS instead of leaving bogus rate\n\nath11k can receive
  HT/VHT/HE frames whose reported MCS is above the\nmaximum that can be expressed
  in the corresponding mac80211 rate space\n(e.g. an HE frame reported with MCS 12,
  while HE tops out at MCS 11).\n\nThe frame itself is valid and decodes correctly,
  but for such a frame\nath11k_dp_rx_h_rate() leaves rx_status->rate_idx set to the
  out-of-range\nvalue and never assigns rx_status->encoding, so it stays RX_ENC_LEGACY\n\
  from the ath11k_dp_rx_h_ppdu() initialization. Once that frame reaches\nmac80211
  it trips the rate sanity check and the frame is dropped with a\nsplat:\n\n  ath11k_pci
  0000:03:00.0: Received with invalid mcs in HE mode 12\n  WARNING: CPU: 0 PID: 0
  at net/mac80211/rx.c:5433 ieee80211_rx_list+0xb0a/0xe90 [mac80211]\n\nDropping the
  frame would discard otherwise valid data, so instead cap the\nreported MCS to the
  maximum the rate space can expres"
