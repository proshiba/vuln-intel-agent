title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  fix gssx_dec_option_array error path bugs\n\nFour coupled defects in the gssx XDR
  option-array decoder make the\nerror paths unsafe: a NULL deref in the caller, a
  refcount leak on\nthe decoded group_info, and a latent use-after-free that the leak\n\
  fix would otherwise expose.\n\ngssx_dec_option_array() sets oa->count = 1 before
  allocating\noa->data.  If that allocation fails, -ENOMEM is returned with\noa->count
  == 1 and oa->data == NULL.  All other error paths jump\nto free_oa: which frees
  oa->data and NULLs it but also leaves\noa->count == 1.  The caller trusts the count:\n\
  \n    gssp_accept_sec_context_upcall()\n      gssx_dec_accept_sec_context()\n  \
  \      gssx_dec_option_array()        /* fails, count=1 data=NULL */\n      data
  = res.options.data[0].value /* NULL deref */\n\nIndependently, free_creds: releases
  the partially decoded svc_cred\nwith a bare kfree(creds).  gssx_dec_linux_creds()
  installs a\ngroups_alloc() result into"
