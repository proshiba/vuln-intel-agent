title: "Use of Cache Containing Sensitive Information vulnerability in ash-project
  ash_authentication_oauth2_server allows a shared HTTP cache to serve one tenant's
  OAuth discovery metadata to another tenant's clients.\n\nThe RFC 8414 and RFC 9728
  metadata endpoints in AshAuthentication.Phoenix.Oauth2Server.ProtocolRouter return
  tenant-specific values (issuer, authorization_endpoint, token_endpoint, jwks_uri)
  when a tenant is set, but sent them with Cache-Control: public, max-age=3600 and
  no Vary. When the tenant is derived from something other than the URL (a header
  or the Host) and a shared cache sits in front, the cache key is the URL alone, so
  a stored response for one tenant is served to another for up to an hour. Affected
  clients may then send authorization codes and secrets to the wrong tenant's token
  endpoint and validate tokens against the wrong keys.\n\nThis issue affects ash_authentication_oauth2_server:
  from 0.1.3 before 0.3.1."
