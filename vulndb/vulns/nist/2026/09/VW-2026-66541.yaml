title: OpenClaw versions >= 2026.6.9 and < 2026.8.1 do not declare the native 
  chatId parameter as a delivery target in the Feishu unpin feature, so unpin 
  requests can bypass the shared same-provider cross-context target check. When 
  tools.message.crossContext.allowWithinProvider is disabled, an admitted 
  (authenticated) sender can remove a pin from another Feishu group that the 
  sender and the configured account are otherwise permitted to access, bypassing
  the intended cross-context message mutation policy. Feishu membership and 
  group authorization still apply, and the demonstrated impact is limited to 
  message mutation (pin removal). The issue is fixed in 2026.8.1.
