title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetconsole:
  take target_cleanup_list_lock in drop_netconsole_target()\n\ndrop_netconsole_target()
  unlinks the target while only holding\ntarget_list_lock. However, when the underlying
  interface has been\nunregistered, netconsole_netdev_event() moves the target from\n\
  target_list to target_cleanup_list, and netconsole_process_cleanups_core()\nwalks
  that list under target_cleanup_list_lock only.\n\nIf a user removes the configfs
  target at the same time the cleanup\nworker is iterating target_cleanup_list, list_del()
  can corrupt the list\nbecause the two paths take disjoint locks while operating
  on the same\nlist node.\n\nAcquire target_cleanup_list_lock around the list_del()
  so the unlink is\nserialised against netconsole_process_cleanups_core() regardless
  of\nwhich list the target currently belongs to. The state transition that\ndowngrades
  STATE_DEACTIVATED to STATE_DISABLED is left intact and is\nperformed under the same
  combined locki"
