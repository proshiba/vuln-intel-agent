title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: thunderbolt: Disable work before freeing tbt on remove\n\ntbt_altmode_remove()
  drops the plug and cable references without\ndraining tbt->work. The work function
  dereferences those references,\nand can also requeue itself in its error path. The
  VDM callbacks can\nqueue the same work item.\n\nDisable and drain tbt->work before
  dropping the references. This waits\nfor an existing invocation and prevents subsequent
  schedule_work()\ncalls from queueing it during teardown.\n\nThis issue was found
  by an in-house static analysis tool and confirmed\nby manual code review."
