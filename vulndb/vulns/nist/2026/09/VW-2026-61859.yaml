title: n8n is a workflow automation platform. In versions before 1.123.76, 
  2.37.7, and 2.38.2, the Git node validated a relative remote URL against the 
  configured repositoryPath but then invoked git with that path as its working 
  directory; git walked up to the enclosing repository's top level and resolved 
  the same relative URL from there. An authenticated user (member) who nested 
  the repository one level below the configured path could therefore make an 
  identical URL string pass the file-access check while git resolved it outside 
  the sandbox. A subsequent fetch or pull read a git repository outside 
  N8N_RESTRICT_FILE_ACCESS_TO and merged its objects into the user's own 
  repository, where their contents could be read back. The issue is fixed in n8n
  1.123.76, 2.37.7, and 2.38.2, which resolve the remote reference from the 
  directory git actually operates in before applying the sandbox check. As a 
  workaround, the Git node can be disabled by adding n8n-nodes-base.git to 
  NODES_EXCLUDE.
