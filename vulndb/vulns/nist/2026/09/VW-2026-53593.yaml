title: FreeRDP versions 3.0.0 through 3.30.0 (before 3.31.0) transmit 
  uninitialized heap memory in Save Session Info PDU reserved padding fields. 
  Three PDU writers in libfreerdp/core/info.c (rdp_write_logon_info_v2, 
  rdp_write_logon_info_plain, and rdp_write_logon_info_ex) use Stream_Seek 
  instead of Stream_Zero for reserved pad bytes (up to 576 bytes), leaving 
  previously freed heap contents in the outgoing PDU. Because the send buffer is
  allocated with malloc (not zeroed), stale heap data — which may include 
  cleartext credentials from prior sessions — can be sent to the receiving peer.
  FreeRDP-based servers using rdpUpdate::SaveSessionInfo and freerdp-proxy 
  (which forwards these PDUs) are affected, allowing disclosure of server/proxy 
  process memory to a downstream client.
