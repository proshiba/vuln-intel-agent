title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  acquire the fastpath locks in rds_conn_shutdown()\n\nrds_conn_shutdown() quiesces
  the transmit and receive-refill paths by\nwaiting for RDS_IN_XMIT and RDS_RECV_REFILL
  to be sampled clear, and\nthen runs the transport shutdown and rds_conn_path_reset().\
  \  Sampling\nthe bits clear is not the same as owning them: the moment after the\n\
  wait_event() returns, rds_send_xmit() can re-acquire RDS_IN_XMIT (or\nrds_ib_recv_refill()
  can re-acquire RDS_RECV_REFILL) and run\nconcurrently with the teardown.\n\nThe
  sender does recheck the connection state after taking the lock,\nbut that recheck
  is a classic store-buffering pattern: teardown writes\nthe state and reads the bit
  while the sender writes the bit and reads\nthe state.  acquire_in_xmit() is only
  an acquire operation, so on\nweakly ordered architectures both sides can miss each
  other's write,\nand the transmit path then runs while the transport zeroes its rings\n\
  (e.g. rds_ib_ring_"
