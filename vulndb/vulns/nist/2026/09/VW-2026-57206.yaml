title: zstd-jni before 1.5.7-14 performs 32-bit signed bounds checks on three 
  direct-ByteBuffer frame-size native methods, allowing out-of-bounds memory 
  reads via negative or overflowing offsets. Attackers can supply negative 
  offset values near Integer.MIN_VALUE to read unmapped memory, causing JVM 
  termination or extracting arbitrary frame size data from unintended memory 
  locations.
