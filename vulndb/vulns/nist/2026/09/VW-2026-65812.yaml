title: The GeoDirectory – WP Business Directory Plugin and Classified Listings 
  Directory plugin for WordPress is vulnerable to Stored Cross-Site Scripting 
  via the 'business_hours' parameter in all versions up to, and including, 
  2.8.183 due to insufficient input sanitization and output escaping. This makes
  it possible for authenticated attackers, with subscriber-level access and 
  above, to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses an injected page. This is possible because the AJAX save handler
  validates only post authorship and a nonce with no additional capability 
  check, allowing any subscriber-level user who owns a listing to exploit this 
  vulnerability.
