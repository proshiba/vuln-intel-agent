title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRISC-V:
  KVM: Fix PMU event info array size overflow\n\nSBI PMU EVENT_GET_INFO stores guest-controlled
  num_events * sizeof(*einfo)\nin a 32-bit integer. On RV64, num_events = 0x10000001
  makes 0x100000010\ntruncate to 16. KVM then allocates one entry but loops over the
  original\nnum_events, causing out-of-bounds reads and writes. A nested guest\ntriggered:\n\
  \nBUG: KASAN: slab-out-of-bounds in kvm_riscv_vcpu_pmu_event_info+0xa4/0x142\nRead
  of size 4 at addr ff600000074d46b0 by task init/1\nCall Trace:\n[<ffffffff8006471c>]
  kvm_riscv_vcpu_pmu_event_info+0xa4/0x142\n[<ffffffff800690c0>] kvm_sbi_ext_pmu_handler+0xca/0x268\n\
  [<ffffffff8006779e>] kvm_riscv_vcpu_sbi_ecall+0xec/0x1e6\n[<ffffffff8006008c>] kvm_riscv_vcpu_exit+0x48c/0x540\n\
  [<ffffffff8005ea0a>] kvm_arch_vcpu_ioctl_run+0x37e/0xc80\nAllocated by task 1:\n\
  \ __kmalloc_noprof+0x19e/0x4b0\n kvm_riscv_vcpu_pmu_event_info+0x72/0x142\n kvm_sbi_ext_pmu_handler+0xca/0x268\n\
  \ kvm_riscv_vcpu_sbi_eca"
