title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Fix CMD_SYNC use-after-free on teardown\n\narm_smmu_impl_remove() is registered
  as a devres action in\narm_smmu_impl_probe(), before arm_smmu_init_queues() allocates\n\
  smmu->cmdq.q.base. On a devres unwind, whether a failed probe or an\nunbind, the
  queue is freed first and arm_smmu_impl_remove() then runs\ntegra241_cmdqv_remove_vintf(),
  whose VINTF deinit issues a CMD_SYNC on\nthe freed memory.\n\nObserved during testing
  with a QEMU hack that makes the VCMDQ fail to\nenable, so the impl reset fails and
  probe aborts into the devres unwind:\n\n platform NVDA200C:00: tegra241_cmdqv: VINTF0:
  VCMDQ0/LVCMDQ0: failed to enable, STATUS=0x00000000\n platform NVDA200C:00: tegra241_cmdqv:
  VINTF0: VCMDQ0/LVCMDQ0: GERRORN=0x0, GERROR=0x4, CONS=0x0\n platform NVDA200C:00:
  tegra241_cmdqv: VINTF0: VCMDQ0/LVCMDQ0: uncleared error detected, resetting\n arm-smmu-v3
  arm-smmu-v3.0.auto: failed to reset impl\n arm-smmu-v3 arm-smmu-v3."
