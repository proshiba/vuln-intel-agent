title: The Filter Gallery plugin for WordPress is vulnerable to authorization 
  bypass in all versions up to, and including, 1.1.4. This is due to the plugin 
  not properly verifying that a user is authorized to perform an action. This 
  makes it possible for authenticated attackers, with subscriber-level access 
  and above, to delete any arbitrary Filter Gallery records — including all 
  associated filters, image mappings, settings, and details options — by 
  supplying attacker-controlled gallery IDs. The nonce bypass requires omitting 
  the nonce POST field entirely rather than submitting an invalid value, as a 
  present-but-invalid nonce is correctly rejected.
