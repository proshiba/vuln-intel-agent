title: A vulnerability was identified in Scada-LTS up to 2.7.8.1. Affected is 
  the function Common.getHomeDir of the file 
  br/org/scadabr/vo/exporter/ZIPProjectManager.java of the component Project 
  Import. Such manipulation leads to path traversal. The attack may be launched 
  remotely. The exploit is publicly available and might be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
