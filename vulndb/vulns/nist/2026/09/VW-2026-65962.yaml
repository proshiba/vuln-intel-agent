title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_api: release all action references on NEWACTION failure\n\nWhen a batched RTM_NEWACTION
  request replaces an existing action,\ntcf_idr_check_alloc() takes a temporary reference
  on it. If a later\naction fails to initialize, tcf_action_destroy() uses strict
  release\nsemantics to clean up the actions initialized so far. For an action\nbound
  to a filter, the strict check returns -EPERM without dropping\nthe temporary reference.\n\
  \nThis error also makes tcf_action_destroy() return before releasing\nsubsequent
  entries. Any new action initialized between the bound\naction and the failing entry
  is leaked together with its reserved\nIDR slot, preventing reuse of its index.\n\
  \nUse tcf_idr_release() to drop each reference held by the batch without\nrejecting
  bound actions. This allows cleanup to continue through all\ninitialized entries
  and preserves the module reference release when\nan action is destroyed. Explicit
  action deleti"
