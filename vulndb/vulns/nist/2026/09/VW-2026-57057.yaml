title: A flaw was found in bubblewrap. During sandbox setup, creating files or 
  directories under the new root can follow a parent symlink onto the host via 
  /oldroot, writing attacker-chosen paths outside the sandbox as the launching 
  user. This happens before the sandboxed process starts. This issue is 
  GHSA-pxhw-h44j-8pfx. It is fixed in bubblewrap 0.12.0.
