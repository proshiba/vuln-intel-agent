title: A security vulnerability has been detected in jofpin trape 2.0. This 
  vulnerability affects unknown code of the file core/user.py of the component 
  Telemetry Endpoint. Such manipulation of the argument vId leads to race 
  condition. The attack can be executed remotely. Attacks of this nature are 
  highly complex. It is stated that the exploitability is difficult. The exploit
  has been disclosed publicly and may be used. The project was informed of the 
  problem early through an issue report but has not responded yet.
