title: MPXJ is an open source library to read and write project plans from a 
  variety of file formats and databases. From 5.5.5 until 16.4.1, MerlinReader 
  creates a DocumentBuilder with default settings while parsing XML from the 
  ZTIMEINTERVALS column of a Merlin project SQLite database, leaving doctype 
  declarations and external entities enabled. A crafted database can cause the 
  parser to read an arbitrary local file, although MPXJ's subsequent handling of
  the parsed XML makes disclosure of the file contents unlikely. This issue is 
  fixed in version 16.4.1.
