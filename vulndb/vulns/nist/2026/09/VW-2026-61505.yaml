title: RabbitMQ amqp091-go is a Go AMQP 0.9.1 client. Prior to 1.13.0, 
  URI.String in uri.go concatenates CertFile, KeyFile, CACertFile, and 
  ServerName values directly into an AMQPS query string instead of encoding them
  as URL query parameters with url.Values. If an application accepts a TLS asset
  path containing ampersand or equals delimiters and later reparses the 
  serialized URI with ParseURI, the embedded delimiters can create or overwrite 
  connection options, including paths to TLS certificate, key, or CA files. This
  can corrupt connection configuration or select unintended local cryptographic 
  assets. This issue is fixed in version 1.13.0.
