title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fix cred UAF caused by begin_current_label_crit_section()\n\nAppArmor's begin_current_label_crit_section()
  is a scary function called\nfrom lots of LSM hooks (in particular VFS/socket-related
  ones) that checks\nif the label referenced by the current creds is marked FLAG_STALE,
  and if\nso, attempts to use aa_replace_current_label() to replace the creds with
  an\nupdated version that uses a new label.\n\nThe first problem with this is that
  it would directly lead to UAF of\n`struct cred` if anything in the kernel takes
  a pointer to the current\ncreds and accesses these past a security hook invocation
  that replaces\ncreds, like so:\n```\nconst struct cred *cred = current_cred();\n\
  alloc_file_pseudo(...);\nuid_t uid = cred->euid;\n```\nI don't know if anything
  in the kernel actually does this, but I think it\nis very surprising that this pattern
  could lead to UAF.\n\nThe second problem is that things go wrong when aa_replace_current_l"
