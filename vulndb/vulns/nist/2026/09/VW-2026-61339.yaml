title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  core: fix debugfs UAF on adapter removal\n\ni2c_del_adapter() frees the adapter's
  debugfs directory before it\nunregisters the adapter device, but the new_device
  sysfs attribute\nstays writable until device_del(). A write racing with removal
  still\nreaches i2c_device_probe(), which passes the freed adap->debugfs to\ndebugfs_create_dir()
  as the new client's parent:\n\n  BUG: KASAN: slab-use-after-free in lookup_noperm_common+0x407/0x430\n\
  \  Read of size 4 at addr ffff88803ef87810 by task syz.0.61/6090\n   lookup_noperm_common+0x407/0x430\n\
  \   simple_start_creating+0x9c/0x110\n   debugfs_start_creating+0xdb/0x1a0\n   debugfs_create_dir+0x24/0x350\n\
  \   i2c_device_probe+0x814/0xbf0\n\nIt's technically possible to create a client
  after i2c_deregister_clients\nhas run. That client will never be unregistered and
  make\nwait_for_completion hang.\n\nClose the window by removing the new_device attribute
  at the start of\ni2c_del_adapter(). device_r"
