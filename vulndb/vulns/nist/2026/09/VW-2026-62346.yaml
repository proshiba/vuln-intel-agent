title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFS:
  Return a delegation the client fails to record\n\nWhen an NFS server grants a delegation
  in an OPEN reply,\nnfs_inode_set_delegation() records it on the client. However,
  three\nof its error flows return without sending DELEGRETURN.\n\nA delegation can
  be relinquished only by DELEGRETURN (RFC 8881\nSection 20.2.4), so dropping one
  silently leaves the server believing\nthe client still holds it. If the server happens
  to recall that\ndelegation, the client answers CB_RECALL with NFS4ERR_BADHANDLE\n\
  because it has no record of the stateid. The server revokes the\ndelegation and
  moves it onto its cl_revoked list, because the client\nnever sends the FREE_STATEID
  that would drain it. Every subsequent\nSEQUENCE reply then carries SEQ4_STATUS_RECALLABLE_STATE_REVOKED,\n\
  and the client's state manager loops issuing TEST_STATEID across its\ndelegations
  without ever clearing the condition.\n\nThe window is easy to reach now that a server
  offer"
