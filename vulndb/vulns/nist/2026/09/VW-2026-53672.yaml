title: Hermes Agent 0.18.2 through 0.21.0, fixed in commit f6234d0, contains a 
  remote code execution vulnerability that allows attackers to execute arbitrary
  OS commands by supplying a malicious repository with a crafted .git/config 
  that sets core.fsmonitor to an attacker-controlled command. When a user opens 
  the malicious repository and sends any message, the agent triggers a git 
  status index refresh which executes the injected command in the user's process
  context, exposing the full environment including configured provider API keys.
