title: A security vulnerability has been detected in yanyutao0402 ChanCMS 3.3.0.
  The affected element is the function CollectController of the file 
  /cms/collect/getArticle. The manipulation of the argument taskUrl leads to 
  server-side request forgery. The attack may be initiated remotely. The exploit
  has been disclosed publicly and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
