title: "The Link Library WordPress plugin before 7.9.6 does not validate the destination
  of a user-supplied URL before falling back to an unprotected fetch when its safe
  request is rejected, allowing unauthenticated visitors to make the site issue requests
  to hosts on its internal network and to learn from the response whether an internal
  service answered.\n\nVersions below 7.8.8 are covered by CVE-2025-68600; this entry
  covers 7.8.8 through 7.9.5, where that fix was incomplete. Exploitation requires
  the site owner to have published the Link Library WordPress plugin before 7.9.6's
  public link submission form with reciprocal-link validation enabled."
