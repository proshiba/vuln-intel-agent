title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  don't free session slots that are still in use\n\nnfsd4_sequence() can free the
  very slot it is currently processing.\nWhen the session shrinker has reduced se_target_maxslots
  below\nse_fchannel.maxreqs, the shrink path checks three conditions before\ncalling
  free_session_slots():\n\n  1. se_target_maxslots < maxreqs  (shrink was advertised)\n\
  \  2. slot->sl_generation == se_slot_gen  (slot is up-to-date)\n  3. seq->maxslots
  <= se_target_maxslots  (client acknowledges)\n\nHowever, seq->slotid is never checked
  against se_target_maxslots.\nA client using a slot in the range [se_target_maxslots,
  maxreqs) can\nsatisfy all three conditions: its slot has the current generation\n\
  (set by a prior SEQUENCE), and it sends sa_highest_slotid <=\nse_target_maxslots
  to acknowledge the reduction.\n\nfree_session_slots() then kfrees every slot at
  index >=\nse_target_maxslots, including the caller's own slot. The function\ncontinues
  to write sl_seqid"
