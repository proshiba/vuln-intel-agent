title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.1.2, zammad's HTML sanitizer, which blocks remote images in ticket 
  articles and email views, can be bypassed using a shortened URL format that 
  omits the double slash after the scheme (for example a shortened HTTP URL 
  instead of a shortened HTTP URL). Modern browsers treat both forms as 
  equivalent remote URLs. As a result, an attacker who sends a crafted email or 
  ticket can cause the recipient's browser to silently load an image from an 
  external server, revealing when and by whom the ticket was opened. Zammad's 
  "remote content blocked" warning is not shown because the sanitizer does not 
  recognize the shortened form as remote. This issue is fixed in version 7.1.2.
