title: A weakness has been identified in dromara orion-visor up to 2.5.7. 
  Affected by this issue is the function ExposeApiAspect.beforeExposeApi of the 
  file ExposeApiAspect.java. Executing a manipulation can lead to hard-coded 
  credentials. The attack can be executed remotely. The exploit has been made 
  available to the public and could be used for attacks. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
