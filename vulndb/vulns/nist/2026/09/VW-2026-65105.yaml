title: RabbitMQ is a messaging and streaming broker. Prior to versions 3.13.15, 
  4.0.20, 4.1.11, 4.2.6, and 4.3.1, get_chunk_selector/1 calls binary_to_atom on
  the raw client-supplied <<"chunk_selector">> property from post-auth subscribe
  and resolve_offset_spec frames, with no whitelist and no existing guard. An 
  authenticated stream client with read access to any stream can crash the 
  broker node. Preconditions include rabbitmq_stream plugin enabled 
  Authenticated stream-protocol user with read access to at least one stream. 
  This issue is fixed in versions 3.13.15, 4.0.20, 4.1.11, 4.2.6, and 4.3.1.
