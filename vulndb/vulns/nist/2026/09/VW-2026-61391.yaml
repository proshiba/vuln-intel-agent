title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  fix division by zero in get_estimated_bw()\n\nget_estimated_bw() divides by link->dpia_bw_alloc_config.bw_granularity,\n\
  which is zeroed by reset_bw_alloc_struct() and only populated once\nDP_TUNNELING_BW_ALLOC_CAP_CHANGED
  has been handled.\n\nlink_dp_dpia_handle_bw_alloc_status(), the DPCD interrupt handler,\n\
  calls get_estimated_bw() whenever DP_TUNNELING_ESTIMATED_BW_CHANGED\nis set, independently
  of whether DP_TUNNELING_BW_ALLOC_CAP_CHANGED\nhas ever fired for that link. A connected
  USB4/DPIA tunneling device\nthat reports an estimated-bandwidth change before ever
  reporting a\ncapability change drives a division by zero in this IRQ path.\n\nlink_dpia_send_bw_alloc_request()
  already guards the same\nbw_granularity division; add the identical guard here rather
  than\nintroducing a new pattern.\n\n(cherry picked from commit f2a961457c33dc34223aad5c9e8971de34a4eed3)"
