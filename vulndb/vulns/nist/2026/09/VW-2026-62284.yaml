title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  smbdirect: destroy QP before mem pools on accept failure\n\nOn the rdma_accept_failed
  error path of\nsmbdirect_accept_connect_request(), the receive io posted just above
  is\nowned by the QP (recv_io is set to NULL after a successful post).  The\nerror
  path fell through to smbdirect_connection_destroy_mem_pools()\nbefore smbdirect_connection_destroy_qp(),
  so the mem pools and the\nrecv_io slab cache were destroyed while that recv_io was
  still\noutstanding on the QP.\n\nThe drain in smbdirect_connection_destroy_qp()
  (ib_drain_qp()) is what\nruns the recv completion that returns the recv_io to the
  free list, so\ndestroying the pools first leaves the object outstanding at\nkmem_cache_destroy()
  time (\"Slab cache still has objects\") and later\nfrees it into an already-destroyed
  mempool (mempool_free_bulk\nNULL-pointer dereference).\n\nGive rdma_accept_failed
  its own teardown that drains the QP first, then\ndestroys the mem pools, and re"
