title: Xibo is an open source digital signage platform with a web content 
  management system and Windows display player software. Prior to 4.4.3, missing
  Authorization in Module::settingsForm allows to view (not change) super 
  admin-restricted module settings and leak the full module entity. Exploitation
  of the vulnerability is possible on behalf of an authorized user who has 
  access to the Module View feature, which are not granted to non-admins as 
  standard. Users should upgrade to version 4.4.3 which fixes this issue. 
  Upgrading to a fixed version is necessary to remediate. Users unable to 
  upgrade should revoke such privileges from users they do not trust.
