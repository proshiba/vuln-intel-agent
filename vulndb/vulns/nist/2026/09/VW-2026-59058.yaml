title: "Improper neutralization of input during web page generation ('cross-site scripting')
  vulnerability in Apache Syncope.\n\n\n\nThe notification message, as optionally
  shown by Console's and Enduser's login pages can be instructed to display HTML tags
  with unsafe JS inline, via malicious HTTP link generation.\n\n\n\nThis issue affects
  Apache Syncope: from 4.0.4 through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\n\n\nUsers
  are recommended to upgrade to version 4.0.8 / 4.1.3, which fix this issue."
