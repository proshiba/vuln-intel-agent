title: Joomla Extension - regularlabs.com - Privileged stored XSS via rtla-alias
  option in Tabs & Accordions extension for Joomla < 3.1.0 - Tabs & Accordions 
  rewrites links matching an item alias into calls to its browser API. The 
  affected renderer places the alias inside a quoted JavaScript argument in an 
  HTML onclick attribute without securing both the JavaScript-string and 
  HTML-attribute contexts. A crafted data-rlta-alias value can therefore change 
  the generated handler.
