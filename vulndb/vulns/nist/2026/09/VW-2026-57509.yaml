title: A flaw was found in the skupper-router component of Red Hat Service 
  Interconnect, which is used to provide secure communication between 
  distributed services. The issue occurs when the router processes a specially 
  crafted network message using its AMQP field parser. Due to a lack of bounds 
  on recursion during parsing, the router can run out of stack memory and crash,
  leading to a denial of service for the interconnected network.
