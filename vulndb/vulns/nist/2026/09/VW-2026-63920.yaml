title: "Apache Airflow: the Core API logout endpoint revokes only a session token
  presented as the _token cookie. When a client logs out presenting its credential
  as an Authorization bearer header instead, the endpoint returns its normal logout
  response but revokes nothing, so the token remains valid until it expires. An attacker
  who already holds a copy of that token keeps the victim's access after the victim
  has logged out and believes the session ended; the default token lifetime is 24
  hours and is configurable.\n\nAffects API clients that authenticate with a bearer
  token rather than the browser session cookie. The attacker must already possess
  a copy of a valid token; obtaining one is outside the scope of this issue, and no
  privileges beyond the victim's own are gained.\n\nUsers of apache-airflow are recommended
  to upgrade to apache-airflow version 3.3.2 or later, which fixes the issue."
