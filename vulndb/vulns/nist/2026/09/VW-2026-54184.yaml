title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  FCP: Use a private URB for the notification endpoint\n\nfcp_init_notify() used mixer->urb,
  which snd_usb_mixer_status_create()\nallocates for the optional UAC2 status interrupt
  endpoint and mixer.c\nkills, resubmits and frees. On a device with that endpoint,\n\
  fcp_init_notify()'s \"already set up\" early return fires on the status\nURB and
  returns success without doing anything. No FCP notification\nURB is submitted, and
  cmd_done is left zeroed because it is\ninitialised past that early return and nowhere
  else. fcp_init() then\nissues init1_opcode and wait_for_completion_timeout() would
  crash\nadding to the zeroed wait.head. fcp_cleanup_urb() would also kill and\nfree
  mixer.c's status URB.\n\nUse a separate URB in fcp_data, and initialise cmd_done
  in\nfcp_init_private() where fcp_data is allocated. fcp_init_notify() is\nreached
  again after suspend via fcp_reinit(), and the URB kill path in\nfcp_notify() completes
  cmd_done, leaving"
