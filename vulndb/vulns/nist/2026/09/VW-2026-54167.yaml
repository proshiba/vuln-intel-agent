title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  llcp: fix OOB read and u8 offset wrap in TLV parsers\n\nnfc_llcp_parse_gb_tlv()
  and nfc_llcp_parse_connection_tlv() contain\nthree related bugs in their TLV parsing
  loops:\n\n1. 'offset' is declared u8 but tlv_array_len is u16. When TLV data\n \
  \  advances offset past 255 it silently wraps to zero, causing\n   infinite loops
  or double-processing of buffer data.\n\n2. Before reading tlv[0] (type) and tlv[1]
  (length) there is no\n   check that offset+2 <= tlv_array_len. A truncated TLV causes\n\
  \   an OOB read of one byte past the buffer end.\n\n3. After reading the length
  field, the value bytes are accessed\n   without checking offset+2+length <= tlv_array_len.
  A crafted\n   length=0xFF on a short buffer causes up to 255 bytes of OOB\n   read
  past the buffer end.\n\nBoth functions are reachable without authentication via\n\
