title: Rsyslog is a rocket-fast system for log processing. From 8.2110.0 until 
  8.2604.0, the optional imhttp module's parse_auth_header function in 
  contrib/imhttp/imhttp.c allocates a zero-byte heap buffer with calloc(0, len) 
  when an HTTP Basic Authorization value exceeds its fixed work buffer, then 
  passes that pointer to apr_base64_decode. An unauthenticated remote attacker 
  can send an oversized encoded credential to an imhttp endpoint configured for 
  Basic Authentication, causing decoded data to overwrite adjacent heap memory 
  before credential validation. Deployments that do not install, load, and use 
  imhttp with Basic Authentication are not affected. The demonstrated impact is 
  a process crash that interrupts log collection, and code execution has not 
  been demonstrated. This issue is fixed in version 8.2604.0.
