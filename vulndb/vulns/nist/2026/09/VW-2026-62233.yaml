title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/gic-v5:
  Clear per-CPU IRS data on teardown\n\nIRS affinity setup publishes an IRS pointer
  and IAFFID state in the\nper-CPU data before the remaining IRS initialization can
  fail. The\nerror path then frees the IRS data without clearing that published\n\
  state, leaving CPUs associated with freed memory.\n\nOn initialization failure and
  normal IRS teardown, clear the per-CPU\nIRS association by removing the stale pointer
  to irs_data. Also\ninvalidate the per-CPU IAFFID state for any CPUs that were tied
  to the\nIRS before it was freed."
