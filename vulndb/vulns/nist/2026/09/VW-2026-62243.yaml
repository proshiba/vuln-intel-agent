title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  serialize resident iomap reads with mrec_lock\n\nntfs_read_iomap_begin_resident()
  walks the MFT record through\nntfs_attr_lookup() -> ntfs_attr_find() without taking
  ni->mrec_lock,\nwhile ntfs_attr_record_resize(), ntfs_make_room_for_attr() and\n\
  ntfs_resident_attr_record_add() memmove() the same base_ni->mrec buffer\nunder that
  lock. map_mft_record() only takes a reference and does not\nserialize, so the reader
  can observe torn attribute length and offset\nfields while a writer is relocating
  the records.\n\nKCSAN reports the race between the mmap read fault path and both
  link()\nand unlink():\n\n  BUG: KCSAN: data-race in ntfs_attr_find / ntfs_attr_record_resize\n\
  \n  write to 0xffff888100af1018 of 4 bytes by task 96 on cpu 1:\n   ntfs_attr_record_resize+0xd2/0x130\n\
  \   ntfs_attr_record_rm+0xad/0x530\n   ntfs_delete+0x224/0x640\n   ntfs_unlink+0x14d/0x280\n\
  \   vfs_unlink+0x157/0x520\n\n  read to 0xffff888100af1018 of 4 bytes by task 95 "
