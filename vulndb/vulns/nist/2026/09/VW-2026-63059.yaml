title: 'The ShopLentor – All-in-One WooCommerce Growth & Store Enhancement Plugin
  plugin for WordPress is vulnerable to Reflected Cross-Site Scripting via Query-String
  Parameter Name in all versions up to, and including, 3.5.1 due to insufficient input
  sanitization and output escaping. This makes it possible for unauthenticated attackers
  to inject arbitrary web scripts in pages that execute if they can successfully trick
  a user into performing an action such as clicking on a link. The vulnerability is
  triggered via the WL: Product Horizontal Filter widget, which reflects attacker-supplied
  query-string parameter names from the current URL into option element value attributes
  without escaping, allowing payload breakout from the value="..." attribute context.'
