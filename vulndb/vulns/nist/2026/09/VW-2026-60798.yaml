title: 'Vulnerability in the Siebel Apps - Life Sciences product of Oracle Siebel
  CRM (component: Life Sciences).  Supported versions that are affected are 17.0-26.7.
  Easily exploitable vulnerability allows low privileged attacker with logon to the
  infrastructure where Siebel Apps - Life Sciences executes to compromise Siebel Apps
  - Life Sciences.  Successful attacks require human interaction from a person other
  than the attacker. Successful attacks of this vulnerability can result in takeover
  of Siebel Apps - Life Sciences. CVSS 3.1 Base Score 7.3 (Confidentiality, Integrity
