title: A flaw was found in GNOME Shell. When processing icons from a remote 
  search provider via D-Bus, the system fails to validate the icon's declared 
  dimensions against the actual data buffer size. A malicious or compromised 
  remote search provider could exploit this by providing oversized icon 
  dimensions, leading to an out-of-bounds read. This can cause the GNOME Shell 
  process to crash, disrupting the user's session, and potentially disclose 
  sensitive information from adjacent memory.
