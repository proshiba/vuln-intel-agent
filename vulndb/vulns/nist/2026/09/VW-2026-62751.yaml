title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/chrome:
  cros_ec_typec: Reject out-of-bounds PD cap count\n\ncros_typec_register_partner_pdos()
  copies the partner PDOs from the EC\nTYPEC_STATUS response into the fixed caps_desc.pdo[PDO_MAX_OBJECTS]
  array.\n\n\tmemcpy(caps_desc.pdo, resp->source_cap_pdos,\n\t       sizeof(u32) *
  resp->source_cap_count);\n\t...\n\tmemcpy(caps_desc.pdo, resp->sink_cap_pdos,\n\t\
  \       sizeof(u32) * resp->sink_cap_count);\n\nPDO_MAX_OBJECTS is 7. source_cap_count
  and sink_cap_count are u8 fields\nfrom the EC. The only check is that they are not
  both zero. If either is\nlarger than 7, the memcpy writes past the end of the array
  on the stack.\nA count of 255 overflows it by about 1 KB. The EC source arrays are
  only\nseven entries wide. A larger count reads past them too.\n\nThe ChromeOS EC
  firmware caps these counts today, so a compliant setup\ndoes not hit this. The kernel
  should still validate these values rather\nthan trust them.\n\nValidate the counts "
