title: A vulnerability was found in aaPanel BaoTa up to 11.8.0. Impacted is the 
  function merge_split_file of the file /www/server/panel/class/files.py of the 
  component File Merge Handler. Performing a manipulation of the argument 
  split_file_path results in command injection. The attack is possible to be 
  carried out remotely. The exploit has been made public and could be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
