title: "Issue summary: QUIC process may keep memory for QUIC packet\nbuffer for much
  longer period than necessary.\n\nImpact summary: Remote peer can exploit this vulnerability\n\
  by sending maliciously crafted packets, making the local\nQUIC stack to keep the
  memory for packet buffers allocated.\nThe time for which the memory remains allocated
  is entirely\nunder the control of the potentially malicious remote peer.\n\nCWE:
  CWE-770: Allocation of Resources Without Limits or Throttling\n\nDescription: To
  save copy operation from the packet buffer to the\nstream reassemble buffer the
  QUIC stack leaves the stream data\non the packet buffer waiting to be copied to
  a buffer provided\nby the local receiving application. The QUIC stack releases\n\
  a reference to the packet buffer only after the data are copied\nto the application
  buffer. This design is more efficient for\nlegitimate data transfers but enables
  an attacker to allocate a lot\nmore memory than actually required by the data kept
  in the receiving\nstream buffer."
