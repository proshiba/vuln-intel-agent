title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  add missing xa_destroy for sched_node_ids\n\nCommit 16dfa49406bc (\"ice: Introduce
  new parameters in ice_sched_node\")\nadded a sched_node_ids xarray to the port info
  structure, but never called\nxa_destroy on it.\n\nSince xarrays can allocate internal
  memory, this can result in a memory\nleak even if every element in the xarray has
  been removed.\n\nThe xarray is currently embedded in the port_info structure. This
  appears\nto have been done because its use is within functions that take the\nport_info
  as a primary argument.\n\nHowever, this complicates managing the lifecycle of the
  field. The\nport_info structure is allocated in ice_init_hw() using devm, and it
  is\nnot released until the devm cleanup when the driver is unloaded.\n\nThe ice_init_hw()
  function is called in many places, including devlink\nreload, and possibly during
  DDP load after updating the Tx scheduler\nlayout.\n\nAdding a call of xa_destroy
  to the ice_deinit_hw() caus"
