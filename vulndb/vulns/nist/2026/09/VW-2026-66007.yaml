title: "In the Linux kernel, the following vulnerability has been resolved:\n\nftrace:
  fork: Initialize function graph state before copy_exec_state()\n\ndup_task_struct()
  copies the parent's task_struct, including ret_stack.\nftrace_graph_init_task()
  clears the copied function graph state, but it\ncurrently runs after copy_exec_state().\n\
  \nFor non-CLONE_VM forks, copy_exec_state() allocates a new task_exec_state.\nIf
  that allocation fails, copy_process() reaches bad_fork_free and\nfree_task() calls
  ftrace_graph_exit_task(). Since the child still carries\nthe parent's ret_stack
  pointer, the unwind frees the parent's active\nfunction graph return stack. The
  parent subsequently accesses freed memory\nfrom function_graph_enter_regs().\n\n\
  KASAN reports:\n\n[   22.190920] ==================================================================\n\
  [   22.195899] BUG: KASAN: slab-use-after-free in function_graph_enter_regs+0xa76/0xb90\n\
  [   22.200747] Write of size 8 at addr ff110000054dc0a8 by task repro/1\n[   22.205134]\n\
  [   22"
