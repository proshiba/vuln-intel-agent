title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Unwind P2A receiver mailbox setup failure\n\nmailbox_chan_setup() can
  request an additional P2A receiver channel after\nsuccessfully acquiring the primary
  P2A channel. If that later request\nfails, the function returns immediately and
  leaves the primary channel\nallocated.\n\nUnwind the primary mailbox channel before
  returning the error so probe\ndeferral or other setup failures do not leave the
  channel busy for later\nprobe attempts."
