title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  validate banner payload length\n\nWhen parsing the Ceph messenger v2 protocol banner,
  the `payload_len` field\nis decoded from the banner prefix. If a client sends a
  banner with a\n`payload_len` of 0, the kernel sets up a 0-length socket read. This\n\
  violates an invariant in the state machine, triggering a warning in\n`populate_in_iter()`:\n\
  \n------------[ cut here ]------------\n!iov_iter_count(&con->v2.in_iter)\nWARNING:
  net/ceph/messenger_v2.c:3129 at populate_in_iter\nnet/ceph/messenger_v2.c:3129 [inline],
  CPU#1: kworker/1:3/5070\nWARNING: net/ceph/messenger_v2.c:3129 at ceph_con_v2_try_read+0x6634/0x6810\n\
  net/ceph/messenger_v2.c:3159, CPU#1: kworker/1:3/5070\n...\nCall Trace:\n <TASK>\n\
  \ ceph_con_workfn+0x1f5/0x14a0 net/ceph/messenger.c:1575\n process_one_work kernel/workqueue.c:3322
  [inline]\n process_scheduled_works+0xa8e/0x14e0 kernel/workqueue.c:3405\n worker_thread+0xa47/0xfb0
  kernel/workqueue.c:3486\n kthread+0x388/0x470"
