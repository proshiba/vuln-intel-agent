title: "In the Linux kernel, the following vulnerability has been resolved:\n\niomap:
  don't free integrity payload that doesn't exist\n\nfs_bio_integrity_alloc might
  not allocate a bio integrity payload if PI\nverification is disabled on the block
  device.  Check for that case before\ncalling fs_bio_integrity_free in iomap_bio_read_folio_range_sync
  to\navoid a NULL pointer dereferences.\n\nMake the branch cover the PI verification
  as well - while\nfs_bio_integrity_verify works without an integrity payload, it
  requires\none to actually do useful work."
