title: "RabbitMQ is a messaging and streaming broker. From 4.0.0 until 4.0.22 and
  4.1.14 and 4.2.7, Admin-only atom exhaustion: PUT /api/users tags list. settags/2
  maps rabbitdatacoercion:toatom/1 over the user's tags list. The 20 MB management
  body limit fits ~3-4M short tag strings. An administrator can crash the node in
  a single request by creating a user (or importing definitions) with ~1M unique tag
  administrator. This issue is fixed in versions 4.0.22 and 4.1.14 and 4.2.7."
