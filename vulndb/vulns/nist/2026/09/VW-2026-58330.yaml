title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  init gssp_lock before publishing proc entry\n\ncreate_use_gss_proxy_proc_entry()
  publishes /proc/net/rpc/use-gss-proxy\nvia proc_create_data() before init_gssp_clnt()
  runs mutex_init() on\nsn->gssp_lock.  Once the dentry is linked under proc_subdir_lock
  it is\nimmediately reachable from userspace, so a write that lands in the\nwindow
  drives set_gssp_clnt() into mutex_lock() on a zero-initialized\nstruct mutex.\n\n\
