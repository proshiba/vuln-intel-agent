title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  core: fix OOB read of field->usage in hid_set_field()\n\nhid_set_field() hands field->usage
  + offset to hid_dump_input() before\nthe guard that bounds offset:\n\n\thid_dump_input(field->report->device,
  field->usage + offset, value);\n\n\tif (offset >= field->report_count) {\n\t\thid_err(...);\n\
  \t\treturn -1;\n\t}\n\nUnder CONFIG_DEBUG_FS hid_dump_input() dereferences that
  pointer, with\nbuf = hid_resolv_usage(usage->hid, NULL).  The usage[] array is\n\
  allocated inline with the hid_field in hid_register_field() and holds\nfield->maxusage
  entries, so an offset past it reads off the end of the\nkvzalloc()ed allocation
  and into a neighbouring object.  Had the guard\nrun first, offset < report_count
  <= maxusage would already have confined\nthe pointer to the array.\n\nA caller supplies
  such an offset today.  picolcd_fb_send_tile()\nvalidates only report->maxfield before
  issuing\nhid_set_field(report->field[0], 11 + i, ...) for i = 0..31, so its\nof"
