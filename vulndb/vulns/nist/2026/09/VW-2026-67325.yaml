title: ip-address is a library for parsing and manipulating IPv4 and IPv6 
  addresses in JavaScript. Prior to 10.7.1, the isInSubnet and isHostInSubnet 
  methods in src/common.ts compare masked binary strings without validating that
  both operands use the same IP family. A cross-family containment check whose 
  leading address bits match makes the masked strings compare equal even though 
  IPv4 and IPv6 do not share an address space. An allowlist or denylist decision
  can therefore classify an address outside the intended range as contained. 
  This issue is fixed in version 10.7.1.
