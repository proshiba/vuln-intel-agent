title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  amd: isp4: fix self-deadlock in isp4sd_pwron_and_init() error path\n\nisp4sd_pwron_and_init()
  holds ops_mutex via guard(mutex) and, on any\ninit failure, jumps to err_deinit
  and calls isp4sd_pwroff_and_deinit().\nThat helper takes the same ops_mutex, re-acquiring
  a non-recursive mutex\nalready held by the current thread, so any init failure deadlocks.\n\
  \nUnwind the error path in stages instead, releasing only what each\nfailure point
  acquired. This also avoids the issues that an\nunconditional teardown would hit
  at the earlier failures, such as a\nruntime-PM underflow from pm_runtime_resume_and_get()
  and MMIO access\nwhile the device is unpowered."
