title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gud:
  NUL-terminate TV mode names read from the device\n\ngud_connector_add_tv_mode()
  reads a buffer of fixed-size mode names from\nthe USB device and passes pointers
  into it to\ndrm_mode_create_tv_properties_legacy(), which calls strlen() on each
  one.\nNothing guarantees the device NUL-terminates a name, so strlen() can run\n\
  past the end of a slot and, for the last mode, past the end of the\nallocation.\n\
  \nTerminate each name at the end of its slot before use."
