title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  mtdoops: free page bitmap when the backing MTD is removed\n\nmtdoops_notify_add()
  allocates oops_page_used when the configured MTD\ndevice is registered.  mtdoops_notify_remove()
  detaches from that device\nbut leaves the bitmap allocated.  If the same MTD device
  is later\nregistered again, the add path allocates a new bitmap and overwrites the\n\
  old pointer, leaking one vmalloc allocation per remove/add cycle.\n\nThis is only
  visible when the backing MTD device can disappear and be\nregistered again while
  mtdoops remains loaded, so the usual static MTD\ncase does not expose it.\n\nFree
  the bitmap after unregistering the dumper and flushing the pending\nworkers, then
  clear the pointer and page count before a later attach can\nallocate fresh state.\
  \  Clearing the pointer also keeps the module exit\npath from freeing the same bitmap
  a second time after a remove event."
