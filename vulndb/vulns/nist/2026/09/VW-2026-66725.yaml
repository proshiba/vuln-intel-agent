title: Froxlor through 2.3.10 is vulnerable to arbitrary file deletion via 
  symlink following in the FTP data deletion cron task. Cron task 8 
  (deleteFtpData), queued when an FTP account is deleted, calls 
  FileDir::makeCorrectDir() without the $fixed_homedir argument, so the symlink 
  component walk is skipped, and then executes 'rm -rf' as root on the resulting
  path with string-level guards only. Because makeCorrectDir() appends a 
  trailing slash, GNU rm dereferences a symlink used either as an intermediate 
  path component or as the final component. An authenticated customer who can 
  write to the FTP home directory can plant a symlink between task insertion and
  cron execution, causing the root cron job to recursively delete arbitrary 
  directory trees, resulting in cross-tenant data destruction and host denial of
  service. This issue is fixed in Froxlor 2.3.12.
