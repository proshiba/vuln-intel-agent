title: 'A vulnerability was determined in jaychouchannel Tourism-Management-System
  up to d984d172dceca907f8b447efbdb06dc233f7938d. Impacted is the function resetPass
  of the file UsersController.java of the component Password Recovery. This manipulation
  causes weak password recovery. The attack can be initiated remotely. The exploit
  has been publicly disclosed and may be utilized. Continious delivery with rolling
  releases is used by this product. Therefore, no version details of affected nor
  updated releases are available. Patch name: 9cb6215ac871f99a90cde763cf003e95ff282283.
  It is recommended to apply a patch to fix this issue.'
