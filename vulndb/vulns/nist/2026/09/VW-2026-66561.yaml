title: OpenClaw (npm package 'openclaw') before 2026.8.1 contains a server-side 
  request forgery vulnerability in its trusted-host DNS checks. For fetches that
  use the trusted-host DNS recheck, a trusted hostname that resolves to an 
  unspecified address (0.0.0.0 or ::) bypasses the SSRF destination validation. 
  An attacker who can influence DNS for an allowed hostname can therefore cause 
  a guarded fetch to reach a service bound only to loopback and disclose its 
  response; the practical impact depends on the reachable service and the data 
  it returns. Fixed in 2026.8.1.
