title: The WP Multi Store Locator Pro plugin for WordPress is vulnerable to 
  generic SQL Injection via the 'store_locatore_search_radius' parameter in all 
  versions up to, and including, 4.5.1 due to insufficient escaping on the user 
  supplied parameter and lack of sufficient preparation on the existing SQL 
  query. This makes it possible for unauthenticated attackers to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. The injection occurs in a 
  numeric, unquoted SQL context, meaning WordPress's wp_magic_quotes() 
  addslashes-based protection cannot neutralize the payload, and the AJAX 
  handler is registered on wp_ajax_nopriv_make_search_request with no nonce or 
  capability check, making it fully accessible without authentication.
