title: A vulnerability has been found in luben zstd-jni up to 1.5.7-13. This 
  vulnerability affects the function ZstdCompressCtx.loadDict of the file 
  ZstdCompressCtx.java of the component Dictionary Sharing. Such manipulation 
  leads to use after free. The attack can be executed remotely. The exploit has 
  been disclosed to the public and may be used. Upgrading to version 1.5.7-14 is
  able to resolve this issue. The name of the patch is 
  a560131d7834598afd9cea6b7c107bc88e915936. The affected component should be 
  upgraded. The vendor was contacted early, responded in a very professional 
  manner and quickly released a fixed version of the affected product.
