title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpaa2-switch:
  fix handling of NAPI on the remove path\n\nAll the NAPI instances for a DPSW device
  are attached to the first\nswitch port's net_device but shared by all ports. The
  NAPI instances get\ndisabled only once the last port goes down.\n\nThis causes an
  issue on the .remove() path where each port is\nunregistered and freed one at a
  time, causing the NAPI instances to be\ndeleted even though they are not disabled.\n\
  \nIn order to avoid this, split up the unregister_netdev() calls from the\nfree_netdev()
  so that we make sure all ports go down before we attempt\na deletion of NAPI instances.
  Also, make the netif_napi_del() explicit\nas it is on the .probe() path."
