title: The Search Atlas SEO – Premier SEO Plugin for One-Click WP Publishing & 
  Integrated AI Optimization plugin for WordPress is vulnerable to authorization
  bypass in all versions up to, and including, 2.6.23. This is due to the plugin
  not properly verifying that a user is authorized to perform an action. This 
  makes it possible for authenticated attackers, with subscriber-level access 
  and above, to overwrite the whitelabel settings password to an 
  attacker-controlled value, enabling them to unlock whitelabel-protected admin 
  settings tabs including whitelabel, general, and advanced configuration.
