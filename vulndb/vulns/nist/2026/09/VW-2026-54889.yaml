title: A flaw has been found in java-json-tools json-patch up to 1.13. Affected 
  is the function JsonMergePatch.fromJson of the file 
  JsonMergePatchDeserializer.java. Executing a manipulation can lead to 
  stack-based buffer overflow. The attack may be performed from remote. The 
  exploit has been published and may be used. The project was informed of the 
  problem early through an issue report but has not responded yet.
