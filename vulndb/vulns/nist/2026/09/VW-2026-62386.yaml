title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  etm4x: fix underflow for usage of (nrseqstate - 1)\n\nAccording to IHI006H Embedded
  Trace Macrocell Architecture\nSpecification[0], TRCSEQEVR<n> is implemented only
  when\nTRCIDR5.NUMSEQSTATE is 0b100, in which case n ranges from 0 to 2;\notherwise,
  TRCIDR5.NUMSEQSTATE is 0b000.\n\nIOW, the number of usage in the initialisation
  or setting\nTRCSEQEVR<n> with drvdata->nrseqstate - 1 in the loop could make\nunderflow
  issue when TRCIDR5.NUMSEQSTATE is 0b000.\n\nTherefore, introduce nr_seq_ctrls field
  and untie it from nrseqstate.\nAs part of this introduce ETM_MAX_SEQ_TRANSITIONS
  macro and\napply nr_seq_ctrls and above macro to TRCSEQEVR<n> relevant fields setup."
