title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  RFCOMM: take rfcomm_mutex for the deferred setup accept\n\nrfcomm_sock_recvmsg()
  completes a deferred setup by calling\nrfcomm_dlc_accept() without holding any RFCOMM
  lock:\n\n\tif (test_and_clear_bit(RFCOMM_DEFER_SETUP, &d->flags)) {\n\t\trfcomm_dlc_accept(d);\n\
  \t\treturn 0;\n\t}\n\nand rfcomm_dlc_accept() dereferences the session on its first
  line:\n\n\tstruct sock *sk = d->session->sock->sk;\n\nEvery other path that touches
  d->session runs under rfcomm_mutex:\nrfcomm_dlc_open(), rfcomm_dlc_close(), rfcomm_dlc_exists(),\n\
  rfcomm_dlc_send_rpn(), and the RFCOMM thread through\nrfcomm_process_sessions().
  rfcomm_connect_ind() is even documented as\n\"called under rfcomm_lock()\". This
  call site is the only one that skips\nit.\n\nThe RFCOMM_DEFER_SETUP bit looks like
  it serialises the accept against\nteardown, since __rfcomm_dlc_close() returns early
  when it wins the\ntest_and_clear. But rfcomm_recv_disc() forces the state first:\n\
