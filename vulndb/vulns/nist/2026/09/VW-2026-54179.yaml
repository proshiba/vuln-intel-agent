title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/cmd:
  fix iovec leak when the async cmd is not recycled\n\nAn io_async_cmd carries an
  iovec array in ->vec.iovec, allocated when the\nvec has to grow and kept across
  recycling through ctx->cmd_cache.  On two\npaths nothing frees it and io_clean_op()'s
  kfree(req->async_data) drops\nthe io_async_cmd without it.\n\nio_req_uring_cleanup()
  clears the async data flags only when\nio_alloc_cache_put() succeeds, and the cache
  holds IO_ALLOC_CACHE_MAX ==\n128 entries, so once it is full the put fails and the
  vec is left behind.\nAn NVMe passthrough workload gets there without doing anything
  unusual:\nnvme_uring_cmd_io() returns -EIOCBQUEUED, so the io_async_cmd stays\n\
  attached for the lifetime of the command and the live object count tracks\nthe queue
  depth.  Above 128 the puts start failing.\n\n->cleanup is the last chance to free
  an inherited vec, since\nio_req_uring_cleanup() returns early for an io-wq issued
  command and is\nnot call"
