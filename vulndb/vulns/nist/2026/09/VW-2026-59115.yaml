title: "Description\n\n`getNimbusConf` returned the complete daemon configuration
  without redaction after only a user-level\nauthorization check. Where the cluster
  is configured with them, that response includes\n`storm.zookeeper.auth.payload`
  and the keystore and truststore passwords for the Thrift, Netty and\nZooKeeper TLS
  configuration. The project masks passwords elsewhere before display, so the omission
  here is\ninconsistent rather than intended.\n\nThe UI endpoint `/api/v1/cluster/configuration`
  compounded this. It carried no `@AuthNimbusOp` annotation,\nand the authorization
  filter treated a missing annotation as \"no gate required\" and returned immediately,
  so\nthe endpoint applied no per-user check at all and proxied the request under
  the UI daemon's own principal.\nAny user able to pass `ui.filter` therefore received
  the full configuration, including principals that\nNimbus itself would have refused. \n\
