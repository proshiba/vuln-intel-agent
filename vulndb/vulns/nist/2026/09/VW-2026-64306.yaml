title: Lantronix SLC8000 before firmware v9.7.0.5, EMG8500/EMG7500 before 
  firmware v9.7.0.1, and all firmware versions of SLB882/SLCx-03/SLCx-02 contain
  an authentication bypass vulnerability in the web management portal upload 
  endpoint that allows unauthenticated attackers to read sensitive configuration
  files and upload files to arbitrary filesystem locations, leading to remote 
  code execution. The web configuration server constructs the session cookie 
  file path using snprintf with a fixed-size buffer; by supplying a cookie value
  of a specific length an attacker causes the path to truncate at the required 
  delimiter and leverages path traversal to redirect authentication validation 
  to an arbitrary on-disk file such as the local user database, bypassing all 
  session checks. Attackers can use this vulnerability to achieve complete loss 
  of confidentiality, integrity, and availability on the affected device and 
  potentially impact downstream serial-connected devices.
