title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/bnxt_re:
  Validate udata before executing commands\n\nThe destroy callbacks currently zero
  the udata output after tearing down\ndriver resources. If the userspace access fails,
  uverbs preserves the\nuobject and allows the destroy callback to run again, even
  though the\ndriver resource has already been freed.\n\nCall ib_no_udata_io() before
  teardown so udata failures are detected\nwhile the resource is still intact, then
  return success after teardown\ncompletes.\n\nAs part of this change, move ib_respond_empty_udata()
  to the start of\nthe create and modify flows. While this is not strictly required
  for\ngeneral create flows, as the core layer unwinds uobjects on failure, it\nis
  necessary for create AH. In _rdma_create_ah(), the HW object is\notherwise leaked."
