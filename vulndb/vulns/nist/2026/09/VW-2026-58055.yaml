title: "When tarfile extracts a link on a system that doesn't support links, it falls
  back to extracting a member from the archive. In this case, the filter function
  is run twice: once for the extracted member, and once with name set to the location
  of the link. For one of the calls, the return value was ignored. Instead, the member
  should be skipped if either call returns None."
