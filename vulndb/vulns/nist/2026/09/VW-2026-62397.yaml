title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Remove redundant VPD flash read in sysfs read path\n\nqla2x00_sysfs_read_vpd()
  called ha->isp_ops->read_optrom() a second time\nafter releasing optrom_mutex. The
  repeated read is redundant and, unlike\nthe first, runs without optrom_mutex held,
  exposing flash access to\nconcurrent optrom operations. Drop the duplicate call."
