title: "Insufficient Session Expiration vulnerability in team-alembic AshAuthentication
  and AshAuthentication Phoenix allows a revoked session to remain fully authenticated.\n\
  \nA resource configured with session_identifier :jti and require_token_presence_for_authentication?
  disabled stores its session value as <jti>:<subject>. The jti is there so that signing
  out can revoke that one session. Neither reader consults it: AshAuthentication.Plug.Helpers.authenticate_resource_from_session/4
  and AshAuthentication.Phoenix.LiveSession.on_mount/4 both split the value with split_identifier/2,
  discard the jti and pass the bare subject to AshAuthentication.subject_to_user/3,
  which reloads the record. The token-presence branch of each function does check
  its token, calling AshAuthentication.TokenResource.Actions.get_token/3 with the
  jti and the purpose user. Because the revocation record is never read, neither its
  revoked state nor its expiry constrains the session, so a session captured before
  sign-out keep"
