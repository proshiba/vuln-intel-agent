title: crawl4ai versions before 0.9.3 contain a DOM-based cross-site scripting 
  vulnerability in the Playground UI where the forceHighlightElement() function 
  assigns textContent back to innerHTML, re-parsing JSON responses as HTML. 
  Attackers can inject malicious scripts through crawled page content like the 
  page title to steal the operator's API token from sessionStorage and gain full
  server control.
