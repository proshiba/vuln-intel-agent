title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtlwifi: pci: fix error path in rtl_pci_probe()\n\nIn the last error path in rtl_pci_probe(),
  the cleanup functions are\nskipped due to a wrong goto label. Moreover, the successful
  call to\nrtl_init_rfkill(), ieee80211_register_hw(), rtl_debug_add_one() have to\n\
  be reverted. Fix this issue by updating the labels and adding the\nrelevant cleanup
  functions to the last error path."
