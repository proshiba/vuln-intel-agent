title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix RCU stall while reaping monitor destination ring\n\nWhile processing
  the monitor destination ring, MSDUs are reaped from the\nlink descriptor based on
  the corresponding buf_id.\n\nHowever, sometimes the driver cannot obtain a valid
  buffer corresponding\nto the buf_id received from the hardware. This causes an infinite
  loop\nin the destination processing, resulting in a kernel crash.\n\nkernel log:\n\
  ath11k_pci 0000:58:00.0: data msdu_pop: invalid buf_id 309\nath11k_pci 0000:58:00.0:
  data dp_rx_monitor_link_desc_return failed\nath11k_pci 0000:58:00.0: data msdu_pop:
  invalid buf_id 309\nath11k_pci 0000:58:00.0: data dp_rx_monitor_link_desc_return
  failed\n\nFix this by skipping the problematic buf_id and reaping the next entry,\n\
  replacing the break with the next MSDU processing.\n\nTested-on: WCN6855 hw2.0 PCI
  WLAN.HSP.1.1-03125-QCAHSPSWPL_V1_V2_SILICONZ_LITE-3.6510.30\nTested-on: QCN9074
  hw1.0 PCI WLAN.HK.2.7.0.1-01744-QC"
