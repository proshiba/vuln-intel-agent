title: novel-plus through 5.3.3 contains an authorization bypass vulnerability 
  in the BookController download endpoint that allows authenticated backend 
  accounts to export complete book text including paid chapters. Attackers can 
  supply a bookId and bookName to retrieve all chapter content without VIP or 
  purchase verification, bypassing the permission checks and data-scope limits 
  enforced elsewhere in the admin interface.
