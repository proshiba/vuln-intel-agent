title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Fix VINTF0 leak on the init-failure path\n\ntegra241_cmdqv_init_structures() allocates
  VINTF0 with kzalloc_obj(), inits\nit, and preallocates its logical VCMDQs. Two of
  its error paths leak.\n\nWhen tegra241_cmdqv_init_vintf() fails it returns before
  VINTF0 reaches the\ncmdqv->vintfs[] array, so the devres unwind on probe failure
  cannot reach\nit; free it directly there.\n\nA later VCMDQ preallocation failure
  instead leaves VINTF0 published, and so\nthis time the unwind does reach tegra241_cmdqv_remove_vintf(),
  which then\nfrees it from vintf->hyp_own. But tegra241_vintf_hw_init() sets that
  flag\nonly afterward, from a HW read-back, so the still-uninited VINTF0 reads as\n\
  guest-owned and leaks, with mutex_destroy() and ida_destroy() run on fields\nit
  never set up.\n\nDecide ownership from vintf->idx instead, the index assigned when
  its id is\nallocated: idx 0 is the kernel-owned VINTF0, while idx >= 1 marks a gues"
