title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  mux: Fix channel node leak on adapter add failure\n\ni2c_mux_add_adapter() takes
  a reference to the Device Tree channel node\nbefore registering the new adapter.
  If adapter registration fails, the\nerror path frees the private data without dropping
  that reference.\n\nRelease the channel node before freeing the private data."
