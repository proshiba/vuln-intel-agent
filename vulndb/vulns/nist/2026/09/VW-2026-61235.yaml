title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  s2255: bound JPEG frame size before copying into the buffer\n\ns2255_fillbuff()
  memcpy()s vc->jpg_size bytes of a captured JPEG/MJPEG\nframe into the vb2 plane.\
  \  vc->jpg_size is taken verbatim from the\nS2255_MARKER_FRAME header the device
  sends (pdword[4] in save_frame())\nand, unlike the frame payload length just above
  it, is never bounded:\n\n\tpayload = le32_to_cpu(pdword[3]);\n\tif (payload > vc->req_image_size)\t
  /* payload is checked ... */\n\t\treturn -EINVAL;\n\tvc->pkt_size = payload;\n\t
  vc->jpg_size = le32_to_cpu(pdword[4]);\t/* ... jpg_size is not */\n\nA malicious
  or malfunctioning device can therefore report a jpg_size\nlarger than the destination
  vb2 plane, and the memcpy() writes past it.\njpg_size is a signed int, so a value
  with the top bit set also turns\ninto a huge length.\n\nReject a frame whose jpg_size
  is negative or exceeds the plane size\nbefore copying it."
