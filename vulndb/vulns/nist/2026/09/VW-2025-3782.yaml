title: 'A vulnerability has been found in Portabilis i-Educar up to 2.10. This affects
  an unknown function of the file /intranet/educar_tipo_usuario_lst.php of the component
  Tipos de usuàrio Page. Such manipulation of the argument nm_tipo/descrição leads
  to sql injection. The attack may be performed from remote. The exploit has been
  disclosed to the public and may be used. Upgrading to version 2.12 mitigates this
  issue. Upgrading the affected component is advised. The vendor confirms: "The reported
  attack vector was tested against the corrected code, and the previously described
  SQL Injection behavior could no longer be reproduced."'
