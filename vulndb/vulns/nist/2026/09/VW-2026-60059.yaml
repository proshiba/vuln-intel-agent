title: "BlueZ A2DP Stack-based Buffer Overflow Remote Code Execution Vulnerability.
  This vulnerability allows network-adjacent attackers to execute arbitrary code on
  affected installations of BlueZ. An attacker must first obtain the ability to pair
  a malicious Bluetooth device with the target system in order to exploit this vulnerability.\n\
  \nThe specific flaw exists within the handling of the stream endpoints. The issue
  results from the lack of proper validation of the length of user-supplied data prior
  to copying it to a fixed-length stack-based buffer. An attacker can leverage this
  vulnerability to execute code in the context of root. Was ZDI-CAN-29429."
