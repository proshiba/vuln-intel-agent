title: "In the current development version of Eclipse aeriOS, which has not yet had
  an official release, the KrakenD instance included in the API Gateway component
  had the disable_jwk_security parameter hard-coded to true, with no option to override
  it through the Helm chart configuration. This setting disables TLS certificate verification
  when KrakenD retrieves the JSON Web Key Set (JWKS) used to validate bearer tokens,
  potentially allowing an attacker with the ability to intercept this communication
  to provide a malicious JWKS and compromise token validation.\n\n\n\n\nThe issue
  has been addressed by making the parameter configurable through the boolean Helm
  value krakend.config.disableJwkSecurity and setting its default value to false,
  ensuring that TLS certificate verification is enabled by default."
