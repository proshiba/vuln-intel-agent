title: "MikroTik RouterOS accepts malformed RSA/PKCS#1 v1.5 signatures during X.509
  validation. Because its trust store includes an e=3 root CA, an attacker controlling
  or redirecting an outbound RouterOS TLS connection can use the root’s public certificate
  - without its private key - to forge a trusted intermediate and issue certificates
  for arbitrary hostnames, enabling TLS server impersonation.\n\nThis issue was fixed
  in versions: 6.49.21 (Long-term), 7.23.4 (Long-term) and 7.24.2 (Stable)"
