title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent post-shutdown use-after-free in unlock_filesystem\n\nWriting a filesystem
  path to /proc/fs/nfsd/unlock_filesystem runs\nnfsd4_cancel_copy_by_sb() before nfsd_mutex
  is held and before the\nhandler confirms that nn->nfsd_serv is set. Once nfsd has
  shut down,\nnfs4_state_destroy_net() has freed nn->conf_id_hashtbl but left the\n\
  pointer intact, so the cancel helper iterates freed slab memory as an\narray of
  struct list_head and then dereferences a bogus nfs4_client\nwhen it takes clp->async_lock.
  A local administrator holding\nCAP_SYS_ADMIN can reach this use-after-free by stopping
  the server and\nthen writing to unlock_filesystem; KASAN reports a slab-use-after-free\n\
  read in nfsd4_cancel_copy_by_sb().\n\nnfsd4_revoke_states() walks the same state
  tables and for that reason\nalready runs only under nfsd_mutex with nn->nfsd_serv
  confirmed\npresent. Move the async COPY cancel into that protected section so\n\
  every NFSv4 state-"
