title: The Frontend Admin by DynamiApps WordPress plugin before 3.29.13 does not
  properly validate a user-controllable directory path before deleting files 
  within it, allowing unauthenticated attackers to delete index.php and 
  .htaccess files outside the intended directory, including the WordPress root, 
  which can render the site inoperable. Successful exploitation requires a 
  non-default form configuration.
