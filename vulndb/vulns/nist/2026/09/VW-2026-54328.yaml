title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/oa:
  Fix sync entry leak on OA config emit failure\n\nxe_oa_emit_oa_config() releases
  the sync entries and the syncs array\nonly on its success path. When it fails before
  the point of no return\n(fence allocation, config buffer allocation or batch submission),
  it\nreturns without touching stream->syncs.\n\nThe stream open path handles such
  failures in the caller, but\nxe_oa_config_locked() propagates the error without
  any cleanup, so the\nsyncs array and the fence references held by the parsed entries
  are\nleaked. The next config ioctl overwrites stream->syncs, making the\nmemory
  unreachable for good.\n\nClean up the parsed syncs when xe_oa_emit_oa_config() fails,
  matching\nthe cleanup done by the stream open error path.\n\n(cherry picked from
  commit 8af97b3da2cfce04e6b457c6eb17ed3c1daf912b)"
