title: A flaw was found in Netty netty-codec-smtp. The component does not 
  properly validate Carriage Return (CR) and Line Feed (LF) characters in the 
  SMTP command-name field. A remote attacker, if an application routes untrusted
  input into this field, can embed CR/LF characters to inject arbitrary SMTP 
  commands. This can lead to SMTP command smuggling, allowing for unauthorized 
  email relay or spoofing of sender/recipient addresses. While the impact is 
  significant, the real-world exploitability is considered lower as applications
  typically do not place user-controlled data in the command-name field.
