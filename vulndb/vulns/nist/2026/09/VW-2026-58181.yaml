title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  stop killed, freed and out_of_sync sharing a byte\n\nThe three connection state
  flags are single-bit bitfields, so they occupy\none byte of struct smc_connection
  and every store to one is a\nread-modify-write of the other two:\n\n    u8  killed
  : 1;\n    u8  freed : 1;\n    u8  out_of_sync : 1;\n\nThey are not written under
  a common lock. smc_cdc_msg_validate() sets\nout_of_sync from the receive tasklet,
  while smc_conn_kill() sets killed\nfrom process context under lock_sock(), and the
  receive path does not defer\nto the backlog when the socket is owned -- smc_cdc_msg_recv()
  takes only\nbh_lock_sock().\n\nGive each flag its own byte so a store no longer
  touches its neighbours.\nAll readers test them as booleans and are unchanged. struct
  smc_connection\ngrows by two bytes."
