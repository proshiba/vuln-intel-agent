title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Drain RCU callbacks during module teardown\n\ndevx_free_subscription() can remain
  queued after the last DevX event file\ndrops its module reference or an auxiliary
  driver detaches its devices.\nmlx5_ib can then unload before the callback runs.\n\
  \nRegistration error unwind has the same risk because driver registration\ncan attach
  existing devices before failing. Wait after all drivers have\nstopped."
