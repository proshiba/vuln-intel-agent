title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: harden DFS cache against invalid target hints\n\nCurrently, get_tgt_name()
  returns ERR_PTR(-ENOENT) when ce->tgthint is\nNULL, and dfs_cache_noreq_update_tgthint()
  assumes ce->tgthint is always\nvalid.\n\nIn preparation for clearing ce->tgthint
  in free_tgts(), harden callers\nof get_tgt_name() against ERR_PTR results and harden\n\
  dfs_cache_noreq_update_tgthint() against NULL pointer dereferences."
