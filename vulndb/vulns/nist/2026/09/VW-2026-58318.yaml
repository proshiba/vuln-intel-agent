title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Reject Read lists that exceed the page budget\n\nIndividual Read segment lengths
  are validated at decode time, but\nnothing prevents a requester from sending multiple
  segments whose\ncumulative length exceeds the rq_pages array budget. When one\n\
  segment fills the page array exactly, the runtime guard in\nsvc_rdma_build_read_segment()
  is bypassed because len reaches zero.\nA subsequent segment then accesses the NULL
  sentinel slot at\nrq_pages[rq_maxpages], resulting in a NULL pointer dereference
  during\nDMA mapping.\n\nAccumulate pages across all Read segments and reject the
  message at\ndecode time when the total would overflow the page budget."
