title: Flatpak creates temporary child repository directories under the user 
  cache with world-writable permissions (0777). On multi-user systems with a 
  permissive umask, other local users could read or modify the temporary 
  directory used while installing apps or runtimes, potentially causing 
  installation failures (denial of service); tampered content would fail 
  signature/digest verification rather than being trusted.
