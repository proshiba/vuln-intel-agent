title: Icinga 2 is an open source monitoring system. From 2.4 until 2.14.9, 
  2.15.4, and 2.16.2, the /v1/objects API writes attacker-controlled template 
  names into generated configuration without escaping them. An authenticated 
  ApiUser with an objects/create/* permission can inject Icinga 2 DSL 
  configuration, escape the intended object, create additional objects, and 
  exceed the user's assigned privileges. This issue is fixed in versions 2.14.9,
  2.15.4, and 2.16.2.
