title: An Insufficient Integrity Verification vulnerability in the ASUS ROG 
  peripheral driver installation process allows privilege escalation to SYSTEM. 
  The vulnerability is due to improper access control on the installation 
  directory, which enables the exploitation of a race condition where the 
  legitimate installer is substituted with an unexpected payload immediately 
  after download, resulting in arbitrary code execution. Refer to the "Security 
  Update for ASUS ROG peripheral driver" section on the ASUS Security Advisory 
  for more information.
