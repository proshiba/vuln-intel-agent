title: "In the Linux kernel, the following vulnerability has been resolved:\n\nima:
  Check for ERR_PTR from dentry_path() in validate_hash_algo()\n\ndentry_path() returns
  ERR_PTR(-ENAMETOOLONG) when the path exceeds the\nbuffer. validate_hash_algo() passes
  the result straight to\nintegrity_audit_msg() without checking. ERR_PTR is not NULL,
  so\nintegrity_audit_message() sees a valid pointer and calls strlen() on\nit, which
  faults:\n\n    BUG: unable to handle page fault for address: ffffffffffffffdc\n\
  \    RIP: 0010:strlen+0x30/0xa0\n    Call Trace:\n     audit_log_untrustedstring+0x19/0x30\n\
  \     integrity_audit_message+0x366/0x4f0\n     ima_inode_setxattr+0x512/0x5f0\n\
  \nCheck for IS_ERR() and use NULL instead, which makes the audit message\nskip the
  name= field instead of crashing."
