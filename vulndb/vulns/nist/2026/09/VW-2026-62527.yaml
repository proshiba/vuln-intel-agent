title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/cxgb4:
  free STAG index when TPT entry write fails\n\nwrite_tpt_entry() allocates a new
  STAG index with c4iw_get_resource() and\nbumps stats.stag.cur before programming
  the entry.  When\nwrite_adapter_mem() fails, it returns the error without releasing
  the index\nor reversing the statistic.  No MR is inserted into rhp->mrs, so\nderegistration
  never reclaims it, leaking the index until device teardown.\n\nRecord whether this
  call allocated the index and, on a failed write, return\nit to tpt_table and decrement
  stats.stag.cur.  Key the rollback on both the\nwrite error and that flag, not the
  error alone: a non-reset update carries\na caller-owned STAG that this call did
  not allocate and must not free."
