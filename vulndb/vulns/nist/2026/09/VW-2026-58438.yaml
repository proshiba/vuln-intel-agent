title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  cap delegated inode count in ceph_parse_deleg_inos()\n\nceph_parse_deleg_inos()
  decodes interval sets of delegated inode numbers\nfrom an MDS create-with-delegation
  reply. For each set it reads a 64-bit\nstart and a 64-bit len with ceph_decode_64_safe(),
  which only validates\nthat the eight bytes are present in the message, not the value,
  and then\nloops over len while inserting entries into s_delegated_inos.\n\nlen is
  fully attacker controlled. A malicious or compromised MDS can send\none huge interval,
  many intervals in one reply, duplicate intervals, or\nrepeated replies that accumulate
  delegated inodes on the same session.\nThe original code bounded none of these and
  could spin the insert loop or\ngrow the xarray without limit.\n\nBound both dimensions
