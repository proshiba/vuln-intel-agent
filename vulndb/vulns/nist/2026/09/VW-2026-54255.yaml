title: Cross-Site Scripting (XSS) vulnerability in the RSS Widget of Netgate 
  pfSense Plus (versions 26.03, 25.11.1) and pfSense CE (version 2.8.1) allows 
  remote authenticated attackers to inject arbitrary JavaScript via malicious 
  content in an RSS feed title. The injected script executes in the browser of 
  any authenticated user who views the dashboard, due to insufficient 
  sanitization of feed title data before rendering in the widget.
