title: Chamilo LMS before 1.11.42 and 3.0.0 contains a stored cross-site 
  scripting vulnerability that allows unauthenticated attackers to inject 
  malicious script payloads into survey answers by computing deterministic 
  invitation codes and bypassing authorization checks in the survey submission 
  endpoint. Attackers can submit crafted answers containing unescaped HTML 
  rendered in reporting views to execute arbitrary scripts in the browser 
  sessions of teachers or administrators, enabling persistent backdoor account 
  creation by exploiting the victim's authenticated session.
