title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  Add vm_bind region with kbo range overlap check\n\nWhen a VM is created, caller
  has to specify the range of the address space\ncarve-out set aside for mapping kernel
  BO's. That means vm_bind mappings of\nUM-exposed BO's should not intersect with
  that region, but at the moment\nwe're not checking this.\n\nAt first, I thought
  of giving these values to drm_gpuvm_init() through its\nreserve_{offset, range}
  arguments, but it turns out that is meant for VM\naddress spans that are not managed
  through the usual drm_gpuvm split/merge\ncircuit, so storing the end of the user
  VA range at VM creation time and\ndoing a quick check in the vm_bind ioctl path
  was the simplest workaround.\n\nThe new check also makes sure vm_bind range doesn't
  overflow the size of a\n64-bit unsigned integer. That was already being done further
  down the call\nstack inside drm_gpuvm_sm_map -> drm_gpuvm_range_valid, but it's
  best to\nfail early in the driver"
