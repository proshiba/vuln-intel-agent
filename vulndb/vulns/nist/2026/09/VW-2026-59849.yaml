title: Ghostscript before 10.08.0 contains a heap-based buffer overflow 
  vulnerability in the JPEG 2000 output adapter (base/sjpx_openjpeg.c) that 
  allows attackers to cause memory corruption by supplying a crafted PDF 
  containing a JPEG 2000 image with mismatched component subsampling factors. 
  When image components declare different subsampling values, the non-samescale 
  sub-byte-depth output path allocates a row buffer sized for packed output but 
  writes a full byte per output column regardless of bit depth, overflowing the 
  allocation and corrupting internal chunk-allocator metadata to achieve code 
  execution.
