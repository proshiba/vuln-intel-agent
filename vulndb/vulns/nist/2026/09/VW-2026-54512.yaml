title: Grav API plugin versions before 1.0.20 build password reset links from 
  the untrusted Host header in the forgot-password endpoint, allowing 
  unauthenticated attackers to redirect reset tokens to attacker-controlled 
  domains. Attackers can send password reset requests for any account with a 
  malicious Host header, intercept the reset token from victim emails, and 
  complete account takeover including super-admin accounts.
