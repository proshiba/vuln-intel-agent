title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  fix corruption of urgent data on multi-segment retransmit\n\nOn the normal xmit
  path, while in urgent mode we refuse to build a\nmulti-segment TSO packet, so every
  segment gets its own urg_ptr:\n\n\t/* tcp_write_xmit() */\n\tlimit = mss_now;\n\t
  if (tso_segs > 1 && !tcp_urg_mode(tp))\n\t\tlimit = tcp_mss_split_point(...);\n\n\
  The retransmit path has no such guard. __tcp_retransmit_skb() builds a\nsegs > 1
  skb and hands it to the GSO layer, which only advances th->seq\nper segment and
  copies urg_ptr verbatim:\n\n\t/* __tcp_retransmit_skb() */\n\tlen = cur_mss * segs;\t
  \t/* segs > 1, no urg_mode check */\n\t...\n\t/* tcp_gso_segment(): bumps seq only,
  urg_ptr is copied */\n\nurg_ptr is an offset from the segment's own seq, so a copied
  value points\nat a different place on each segment. The receiver rebuilds the absolute\n\
  urgent seq as seg.seq + urg_ptr, so it walks a moving urgent point instead\nof the
  one OOB byte:\n\n\tseg1  seq 1     urg_ptr 5001 ->"
