title: "Missing Authentication for Critical Function, Server-Side Request Forgery
  (SSRF), and Use of Hard-coded Credentials in ASUS Control Center allow an unauthorized
  user to obtain the encryption key via an HTTP request, causing a local service to
  enable SSH on port 2222. The attacker can then log in with the hardcode credentials to
  obtain a root shell, enabling direct reading, writing, and deletion of data on ASUS
  Control Center, as well as remote control of all servers, PCs, and workstations
  within the company.\nRefer to the 'Security Update for ASUS Control Center' section
  on the ASUS Security Advisory for more information."
