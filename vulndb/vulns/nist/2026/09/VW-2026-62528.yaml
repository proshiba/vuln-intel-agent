title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix stack out-of-bounds read in cc_params debugfs\n\nget_param() reads a congestion
  parameter as a u32 but formats it with the\nsigned \"%d\" into an 11-byte stack
  buffer. A value with bit 31 set, such as\n0x80000000, renders as \"-2147483648\\\
  n\" whose full length is 12. snprintf()\nstores only 11 bytes yet returns 12, so
  simple_read_from_buffer() treats 12\nbytes as valid and reads one byte past lbuf[].\n\
  \nSize the buffer for the widest unsigned decimal, format with \"%u\" to match\n\
  the u32, and use scnprintf() so the length passed to\nsimple_read_from_buffer()
  reflects the bytes actually stored."
