title: A vulnerability has been found in DevaslanPHP project-management 
  1.2.1/1.2.2/1.2.3/1.2.4/v2.0.0-beta1. Affected is the function 
  updateJiraProjects of the file /jira-import of the component Jira Import. The 
  manipulation of the argument host/username/token leads to server-side request 
  forgery. It is possible to initiate the attack remotely. The exploit has been 
  disclosed to the public and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
