title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix integer overflow of user QP buffer size\n\nset_user_buf_size() computes the
  QP buffer size by left-shifting the\nuser-supplied rq.wqe_cnt and rq.wqe_shift values
  as signed integers.\nA sufficiently large rq.wqe_cnt causes signed integer overflow,
  which\nis undefined behavior, and yields a small or negative buf_size, causing\n\
  ib_umem_get() to map a buffer smaller than the hardware will actually\nwrite into.\n\
  \nReplace the shifts and addition with check_shl_overflow() and\ncheck_add_overflow(),
  rejecting invalid user inputs.\n\nMoreover, guard the identical shift computing
  qp->sq.offset in\n_create_user_qp() before set_user_buf_size() is reached."
