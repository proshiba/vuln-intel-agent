title: cleanup_xml_node() in the SOAP XML parser recurses once per XML nesting 
  level with no depth limit. An unauthenticated attacker can post a SOAP request
  containing tens of thousands of nested elements to any SoapServer endpoint, 
  exhaust the stack and crash the process. The same unbounded recursion exists 
  in the SOAP value decoder and in the WSDL node search helper.
