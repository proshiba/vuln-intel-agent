title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: stop PMSR before P2P and NAN teardown\n\nPMSR request teardown must abort
  active measurements while the\nwireless_dev is still present in the driver. cfg80211_leave_locked()
  and\ncfg80211_stop_pd() already do this before invoking the driver's stop\ncallback,
  but cfg80211_stop_p2p_device() and cfg80211_stop_nan() do not.\n\nThose helpers
  are also called directly by nl80211, rfkill shutdown, and\nwireless_dev unregister
  paths. If one of these paths stops a P2P device\nor NAN interface with a pending
  request, it removes the mac80211\nsubinterface from the driver first. Subsequent
  request cleanup cannot\nreach the lower driver's abort callback, but cfg80211 frees
  the request\nregardless. Driver state can then retain a stale request and use it
  when\nit later reports a result.\n\nCall cfg80211_pmsr_wdev_down() before stopping
  the P2P device or NAN\ninterface. This keeps lower-driver request state and cfg80211
  request\nowners"
