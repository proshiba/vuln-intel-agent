title: SysReptor is a fully customizable pentest reporting platform. Prior to 
  2026.58, installations that enable password reset by email while configuring 
  ALLOWED_HOSTS with a wildcard accept an attacker-controlled Host header when 
  generating a password reset link. An unauthenticated attacker can request a 
  reset email whose link points to an attacker-controlled system, and a victim 
  who follows that link can disclose the reset token, allowing the attacker to 
  reset the victim's password and take over the account. Exploitation also 
  requires a configured email gateway and an email address for the victim, while
  some reverse proxy configurations may reject the hostile Host header. This 
  issue is fixed in version 2026.58.
