title: The Apache Airflow Teradata provider's compute-cluster example Dag 
  declared every one of its Dag Params as unconstrained free text and templated 
  them straight into the compute-cluster operators, which interpolate those 
  values into Teradata DDL. A user who is permitted to trigger that Dag - a 
  lower-trust role than the Dag author, and one that needs no Teradata 
  credentials of its own - could therefore supply SQL fragments that execute 
  under the connection the task runs as, and could additionally redirect the 
  task at any other connection defined in the deployment, because the connection
  id was itself a free-text Param. Only deployments that run this example Dag, 
  or a Dag copied from it, are affected; the provider's operator code is 
  unchanged. Users of apache-airflow-providers-teradata are recommended to 
  upgrade to version 3.7.0 or later, whose example constrains the Params to 
  validated identifiers and a closed value set and removes connection selection 
  and free-form option strings from tr
