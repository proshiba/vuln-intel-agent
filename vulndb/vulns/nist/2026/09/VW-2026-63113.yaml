title: A stored Cross-Site Scripting (XSS) vulnerability in the profile 
  management functionality of T-Systems’ TAO 2.0 suite. An authenticated user 
  could inject malicious HTML or JavaScript content into the fields containing 
  their personal data. The content entered is stored and displayed without being
  properly sanitised when another user, including administrative staff, views 
  the affected profile. Successful exploitation could allow JavaScript code to 
  be executed in the victim’s browser, access to information available within 
  the session, or the performance of actions using the victim’s permissions.
