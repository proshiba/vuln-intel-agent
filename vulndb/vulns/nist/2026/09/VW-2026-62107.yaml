title: A flaw was found in quarkus-websockets-next. This vulnerability allows a 
  remote attacker to cause a Denial of Service (DoS) by streaming messages over 
  a single connection faster than the application can process them. Due to 
  unbounded message buffering and a lack of read backpressure, this rapidly 
  exhausts heap space, leading to a java.lang.OutOfMemoryError that crashes the 
  Java Virtual Machine (JVM).
