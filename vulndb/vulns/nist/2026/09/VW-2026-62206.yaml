title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  process: Fix context switching MTE store-only tag check\n\nSCTLR_EL1.TCSO0 is set
  when user opt-in for MTE store-only tag check\nmode. However, it is not part of
  SCTLR_USER_MASK which imply that on\ncontext switch we never clear SCTLR_EL1.TCSO0,
  so we are leaking that\nsetting into another task.\n\nFix that by including SCTLR_EL1_TCSO0_MASK
  into SCTLR_USER_MASK"
