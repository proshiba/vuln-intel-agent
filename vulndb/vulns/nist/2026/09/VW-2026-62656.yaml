title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfsplus:
  validate thread record before delete key rebuild\n\nhfsplus_delete_cat() is called
  with str == NULL when the last open\nreference to an unlinked HFS+ hardlink backing
  inode is closed. In that\ncase, the function finds the catalog thread by CNID and
  rebuilds the\ncatalog key from thread.nodeName.\n\nThat reconstruction path reads
  thread.nodeName.length directly from the\ncatalog B-tree into fd.search_key and
  then copies length * 2 bytes into\nfd.search_key->cat.name.unicode. It does not
  first check that the found\nrecord is a thread record or that its size matches the
  thread name.\n\nA corrupted image can therefore provide an oversized thread name
  length\nand make hfs_bnode_read() write past the catalog search-key allocation.\n\
  \nRead the CNID record through hfsplus_brec_read_cat(), which bounds the\nrecord
  read to sizeof(hfsplus_cat_entry) and verifies that a thread\nrecord's size exactly
