title: A weakness has been identified in PbootCMS up to 3.2.22. This affects the
  function decode_string of the file 
  apps/admin/controller/content/ContentController.php of the component Template 
  Rendering. This manipulation of the argument Title causes cross site 
  scripting. The attack is possible to be carried out remotely. The exploit has 
  been made available to the public and could be used for attacks. The reported 
