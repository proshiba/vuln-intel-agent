title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: oa_tc6: Improve the error recovery\n\nWhen oversubscribed traffic causes
  lot of buffer overflow errors,\nprobably due to loss of data chunks, driver fails
  to find a\ndata chunk with end_valid bit set, before it runs out of sk buffer\n\
  space. As a result, assert is seen during skb_put.\n\nNow, check is made if skb
  buffer has enough tailroom for the\nincoming data before accepting. If there is
  no room, current\nframe is abandoned and it will start looking for a data chunk\n\
  with start_valid bit, that is a new frame.\n\nSK buffer allocation error is considered
  as recoverable error.\n\nrx_buf_overflow flag is too specific and no longer the
  only\ncondition this flag is used for. Therefore it is renamed as\nwait_until_start_valid.
  This is more appropriate as this flag\nis used to look for the next data chunk with
  SV bit set, after\nfailures like buffer overflow, buffer allocation failure, skb
  pointer\nvalidity besides buffer over"
