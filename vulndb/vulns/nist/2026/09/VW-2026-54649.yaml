title: PostgreSQL Anonymizer contains a SQL injection vulnerability in two 
  import functions. A user can create a malicious JSON document containing 
  specially crafted object names. If a superuser subsequently calls 
  anon.import_database_rules() or anon.import_roles_rules(), the malicious code 
  is executed with superuser privileges. The issue is fixed in PostgreSQL 
  Anonymizer 3.1.4 and later
