title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvduse:
  validate virtqueue alignment\n\nvduse_validate_config() only checks the upper bound
  of vq_align. Invalid\nvalues can therefore reach vring_create_virtqueue_map(). The
  split-ring\nhelpers use align - 1 as a bit mask, so the alignment must be a non-zero\n\
  power of two. A zero value makes vring_size() drop the descriptor and\navailable-ring
  part and vring_init() leave the used ring pointer NULL.\n\nThe VIRTIO spec requires
  the used ring to start at an address\naligned to at least 4 bytes. Reject values
  below VRING_USED_ALIGN_SIZE as\nwell as non-power-of-two values before they reach
  the virtio ring helpers.\n\nOpening a virtio-net device created with vq_align=0
  triggered:\n\nBUG: KASAN: null-ptr-deref in virtqueue_kick_prepare_split+0xe3/0x100\n\
  Read of size 2 at addr 0000000000000000 by task systemd-network/1062\n\nCall Trace
  (relevant frames):\n dump_stack_lvl\n print_report\n kasan_report\n __asan_load2\n\
  \ virtqueue_kick_prepare_split+"
