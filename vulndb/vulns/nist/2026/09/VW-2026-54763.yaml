title: A vulnerability has been found in ModelCloud GPTQModel up to 7.2.0. This 
  vulnerability affects unknown code of the file 
  gptqmodel/nn_modules/qlinear/tritonv2.py of the component Triton 
  dequantization kernel. Such manipulation of the argument g_idx leads to 
  out-of-bounds read. The attack can be executed remotely. The exploit has been 
  disclosed to the public and may be used. Upgrading to version 7.3.0 is able to
  resolve this issue. The name of the patch is 
  877c732f7d7dccd56a729844c6a5bd20f3aa8bb1. Upgrading the affected component is 
  recommended.
