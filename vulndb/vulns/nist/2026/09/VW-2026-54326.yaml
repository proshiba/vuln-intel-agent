title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  fix the checksum validations\n\nip_vs_in_icmp_v6() is missing checksum validation
  for ICMPv6\npackets from clients. In fact, as for TCP/UDP we should\nvalidate the
  checksum for ICMP packets only when we\nmangle the packets on MASQ or on reply for
  tunnel.\n\nAlso, Sashiko points out that handle_response_icmp() being\ncommon for
  IPv4 and IPv6 is missing the pseudo-header\ncalculation while validating ICMPv6
  messages from real\nservers which is a problem if checksum is not validated\nby
  the hardware.\n\nFix the problems by creating ip_vs_checksum_common_check()\nhelper
  and use it for TCP/UDP/ICMP both for IPv4 and IPv6.\nRely on the nf_checksum() for
  validating the ICMP messages\nbut use it also for TCP and UDP.\n\nUse correct IP
  offset for IP_VS_DBG_RL_PKT for TCP/UDP/SCTP.\n\nIPVS packets (TCP/UDP/SCTP/ICMP)
  do not need checksum\nvalidation on LOCAL_OUT (local clients or local real\nservers)
  and on FORWARD (traffic from servers on LAN"
