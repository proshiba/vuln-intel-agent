title: AVideo through 29.0 (commit c3edcc274c389816d434acadac07ee78eaf330c1) 
  fails to verify video access permissions in the set_api_comment function, 
  allowing authenticated users to post comments on password-protected and 
  group-restricted videos. Attackers can submit POST requests to the comment API
  endpoint with arbitrary video IDs to write comments on videos they cannot 
  watch.
