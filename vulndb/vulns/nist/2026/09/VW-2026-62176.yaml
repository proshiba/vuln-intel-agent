title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Reject page faults from non-fault-mode scratch VMs\n\nHaving scratch enabled does
  not make a VM capable of handling recoverable\npage faults. Allowing scratch VMs
  through the ASID lookup also admits\ndma-fence mode VMs.\n\nIf such a VM faults
  on an already valid VMA, the handler reports success\nwithout fixing the fault,
  causing the GPU to retry indefinitely.\n\nOnly allow fault-mode VMs through the
  ASID lookup. Fault-mode VMs using\nscratch remain supported, while faults from 3D
  VMs are rejected.\n\n(cherry picked from commit bfb24a06405b652d37831f3fb66b71d33a6605de)"
