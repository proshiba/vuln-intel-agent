title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/cirrus-qemu:
  Validate BAR0 size during probe\n\nThe `cirrus-qemu` driver relies on `CIRRUS_VRAM_SIZE`
  (4 MB) to validate\nframebuffer sizes. However, during PCI probe, the driver mapped
  BAR0\nwithout verifying that its size matches `CIRRUS_VRAM_SIZE`.\n\nIf a PCI device
  with a BAR0 smaller than 4 MB is bound to the driver, the\nmapped VRAM will be smaller
  than expected. Because validation checks assume\n4 MB VRAM, framebuffers larger
  than the mapped memory can be created.\n\nWhen the display plane is updated (e.g.
  during release),\n`cirrus_primary_plane_helper_atomic_update()` copies the framebuffer
  to\nVRAM using `drm_fb_memcpy()`. Writing past the end of the mapped I/O memory\n\
  causes a supervisor write page fault:\n\nBUG: unable to handle page fault for address:
  ffffc9000389c000\n...\nRIP: 0010:memcpy_toio+0x7c/0xe0 arch/x86/lib/iomem.c:110\n\
  ...\nCall Trace:\n <TASK>\n iosys_map_memcpy_to include/linux/iosys-map.h:285 [inline]\n\
  \ drm_"
