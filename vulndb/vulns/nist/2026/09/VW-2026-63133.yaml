title: "Imager versions before 1.036 for Perl exit the process reading a TGA with
  a colour map length of 32768 or more in tga_palette_read.\n\nThe reader unpacks
  the two-byte colour map length into a signed short, so a length of 32768 or more
  becomes negative. tga_palette_read() casts that value to size_t and asks mymalloc()
  for a size near SIZE_MAX. The allocation fails and Imager's allocator calls exit(3).\n\
  \nReading an attacker-supplied file through Imager->read() triggers an uncatchable
  exit."
