title: '** DISPUTED ** A vulnerability was found in zzdevelop lenosp up to 20230831.
  It has been classified as problematic. This affects an unknown part of the component
  Adduser Page. The manipulation of the argument username with the input <script>alert(1)</script>
  leads to cross site scripting. It is possible to initiate the attack remotely. The
  exploit has been disclosed to the public and may be used. The real existence of
  this vulnerability is still doubted at the moment. The associated identifier of
  this vulnerability is VDB-266127. NOTE: The vendor rejected the issue because he
  claims that XSS which require administrative privileges are not of any use for attackers.'
