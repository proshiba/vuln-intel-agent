title: The Fancy Product Designer plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Shortcode Order 'elements[].title' Parameter in all 
  versions up to, and including, 6.5.2 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The injected payload is written to the DOM via 
  innerHTML within the beforeElementAdd JavaScript event handler when processing
  the elements[].title field from the stored order JSON, meaning execution 
  occurs specifically when an administrator reviews shortcode orders in the 
  WordPress admin panel.
