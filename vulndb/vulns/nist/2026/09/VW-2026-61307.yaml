title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  fix stale receive device on merged fragments\n\nFragment reassembly reuses the skb
  from the highest-numbered buffered\nfragment as the merged packet. When that fragment
  was received on a hard\ninterface which is deleted before the chain completes, the
  merged skb can\nre-enter the receive path with a stale skb->dev and skb_iif.\n\n\
  batadv_batman_skb_recv() passes such merged packets through the normal\nreceive
  handlers again. DAT and bridge loop avoidance both derive the ARP\nheader length
  from skb->dev, so they can dereference the freed net_device\nbefore the packet reaches
  the local mesh interface.\n\nRefresh the receive device metadata from the current
  receive device before\nrunning the packet handlers. This keeps internally reinjected
  merged\nfragments consistent with the normal receive path after hard interface\n\
  teardown."
