title: "ServiceNow has remediated a missing authorization vulnerability that was identified
  in the ServiceNow AI Platform. This vulnerability could enable an unauthenticated
  user, in certain circumstances, to extract instance data beyond what was intended,
  resulting in privilege escalation.\n\n\n\n\n\nServiceNow deployed a security update
  to hosted instances and ServiceNow provided the update to our partners and self-hosted
  customers. We are not currently aware of malicious exploitation against ServiceNow
  instances. We recommend customers promptly apply appropriate updates or upgrade
  to a patched release if they have not already done so."
