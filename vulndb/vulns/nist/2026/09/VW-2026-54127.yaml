title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_aml: validate firmware segment lengths\n\naml_download_firmware() reads two
  lengths from the firmware header and\nuses them to build pointers before checking
  that the header and segment\ndata are present. A truncated or inconsistent firmware
  image can make\nthe driver read past firmware->data while constructing TCI commands.\n\
  \nReject images shorter than the header and ensure that the ICCM and DCCM\nranges
  fit within the loaded firmware before downloading either segment."
