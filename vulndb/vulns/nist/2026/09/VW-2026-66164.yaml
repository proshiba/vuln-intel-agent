title: "In the Linux kernel, the following vulnerability has been resolved:\n\naf_packet:
  Don't cast tpacket_hdr.tp_len to int in tpacket_parse_header().\n\nsyzbot reported
  BUG() in sock_sendmsg_nosec(). [0]\n\nThe problem is that tpacket_parse_header()
  casts user-provided\ntpacket_hdr.tp_len, which is u32, to int.\n\nIf the length
  is larger than INT_MAX, the following condition\nin tpacket_parse_header() passes,\n\
  \n  if (unlikely(tp_len > size_max))\n\nand any negative value can be returned to
  the caller, up to\nsock_sendmsg_nosec().\n\nThe repro set tpacket_hdr.tp_len to
  0xfffffdef, which is cast\nto -EIOCBQUEUED (-529), triggering BUG() in sock_sendmsg_nosec().\n\
  \n  *(uint64_t*)0x200000000008 = 0xfffffdef;\n  ...\n  syscall(__NR_write, /*fd=*/r[0],
  /*buf=*/0x200000000000ul, /*count=*/1ul);\n\nLet's define the local tp_len as u32
  in tpacket_parse_header().\n\n[0]:\nkernel BUG at net/socket.c:803!\nOops: invalid
  opcode: 0000 [#1] SMP KASAN PTI\nCPU: 0 UID: 0 PID: 5628 Comm: syz-executor176 Not
  tainted syzkaller #0 PREEMP"
