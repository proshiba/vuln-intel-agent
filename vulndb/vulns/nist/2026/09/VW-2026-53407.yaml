title: A flaw was found in util-linux. Restricted bind mounts take the source 
  path from fstab but do not pin that source before the privileged mount. A 
  local unprivileged user who can replace the authorized source or a writable 
  ancestor can redirect SUID mount(8) to bind another host directory. If the 
  fstab entry also sets X-mount.owner, X-mount.group, or X-mount.mode, root then
  changes ownership or mode on that redirected inode.
