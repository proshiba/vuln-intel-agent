title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: Complete cleanup after system-resume errors\n\nA failed system resume
  can leave the card unusable until reboot.\nusb_audio_resume() jumps to err_out when
  snd_usb_pcm_resume() or\nsnd_usb_mixer_resume() fails. The error path skips the
  out: block, which\nrestores D0 and decrements chip->num_suspended_intf.\n\nThe card
  stays in SNDRV_CTL_POWER_D3hot, so later control access blocks in\nsnd_power_ref_and_wait().
  USB core logs an interface resume callback error.\nIt does not retry that callback,
  so a later callback cannot complete the\nskipped cleanup.\n\nusb_audio_suspend()
  increments num_suspended_intf before returning success.\nA system-resume callback
  must consume the system-suspend count even if a\ncomponent resume fails. Otherwise,
  the stranded count skews later suspend\nand resume cycles.\n\nDo not apply this
  cleanup to runtime-resume errors. Runtime PM can retry\n-EAGAIN or -EBUSY without
  another suspend callback. Th"
