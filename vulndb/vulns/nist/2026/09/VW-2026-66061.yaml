title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvdpa_sim_blk:
  reject out-of-range sector starts\n\nvdpasim_blk_check_range() logs an invalid start
  sector but continues\nvalidating the request.  The subsequent unsigned capacity
  subtraction can\nunderflow and let an out-of-range buffer offset reach the data
  path.\n\nThe invalid offset is used by three request paths.  VIRTIO_BLK_T_OUT\n\
  copies guest data to blk->buffer + offset through\nvringh_iov_pull_iotlb(), causing
  an out-of-bounds write in\n_copy_from_iter() or memcpy().  VIRTIO_BLK_T_IN copies
  from\nblk->buffer + offset to the guest through vringh_iov_push_iotlb(),\ncausing
  an out-of-bounds read in _copy_to_iter().\nVIRTIO_BLK_T_WRITE_ZEROES passes blk->buffer
  + offset to memset(),\ncausing an out-of-bounds write.\n\nReject starts at or beyond
  the capacity before the subtraction.  Treat the\ncapacity boundary as invalid because
  the IN and OUT paths round byte counts\ndown to sectors for validation but later
  copy the original byte"
