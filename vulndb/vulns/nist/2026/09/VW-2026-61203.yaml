title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Avoid double completion in async IOCB timeout\n\nqla2x00_async_iocb_timeout()
  tries to abort a timed-out async IOCB. When\nqla24xx_async_abort_cmd() fails, both
  the SRB_LOGIN_CMD path and the\nSRB_CTRL_VP/default path scan outstanding_cmds[]
  for the SRB and then\ncall sp->done(sp, QLA_FUNCTION_TIMEOUT) unconditionally, without
  checking\nwhether the SRB was actually found and removed.\n\nIf the response ISR
  completes the same handle first, it removes the SRB\nunder qp_lock_ptr and runs
  sp->done() -> complete(sp->comp). The\nsubmitter qla24xx_control_vp() wakes from
  wait_for_completion(), clears\nsp->comp, drops its reference and returns, reclaiming
  the on-stack\ncompletion. The timer reference keeps the SRB alive across the timeout\n\
  handler, but not the submitter's stack. The timeout then issues a second\nsp->done()
  -> qla_ctrlvp_sp_done(), which evaluates \"if (sp->comp)\ncomplete(sp->comp)\";
