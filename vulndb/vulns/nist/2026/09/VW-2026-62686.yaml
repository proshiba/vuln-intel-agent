title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject rdonly/rdwr_buf_size kfunc arguments that exceed u32 max\n\ncheck_kfunc_args()
  detects a kfunc argument named rdonly_buf_size or\nrdwr_buf_size and stores reg->var_off.value
  into meta->r0_size, a u64,\nand does not bound it. check_kfunc_call() later copies
  that value into\nthe returned register's mem_size field:\n\n  meta->r0_size = reg->var_off.value;\n\
  \  ...\n  regs[BPF_REG_0].mem_size = meta.r0_size;\n\nregs[BPF_REG_0].mem_size is
  u32. A constant whose upper 32 bits are set\ngets truncated instead of causing a
  load-time rejection, so the verifier\nrecords a PTR_TO_MEM register with an approximately
  4 GiB mem_size for\nwhatever allocation the kfunc returned. A later access check
  against\nthat register uses the truncated, wrong bound.\n\nReject rdonly_buf_size/rdwr_buf_size
  values that exceed U32_MAX at the\npoint meta->r0_size is set."
