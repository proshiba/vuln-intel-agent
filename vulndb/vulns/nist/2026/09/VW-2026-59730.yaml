title: A security flaw has been discovered in GNU Binutils 2.47. This affects 
  the function _bfd_elf_eh_frame_section_offset of the file bfd/elf-eh-frame.c 
  of the component Eh Frame Handler. Performing a manipulation results in null 
  pointer dereference. The attack must be initiated from a local position. The 
  exploit has been released to the public and may be used for attacks. The 
  project was informed of the problem early through a bug report but has not 
  responded yet.
