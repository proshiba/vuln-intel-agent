title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  Intel: avs: Refactor and fix init_config access\n\nExisting code accesses enties
  found in ->init_configs array through\nindexes that are part of ->config_ids array.\
  \  Those two are limited by:\n->num_init_configs and ->num_config_ids respectively.\
  \  Using ID larger\nor equal to ->num_init_configs leads to out-of-bounds access:\n\
  \navs_path_module_send_init_configs()\nloop:\n\t(...) &acomp->tplg->init_configs[ids[i]]\n\
  \t\t\t\t\t^ out-of-bounds candidate\n\nRather than adding another if-statement,
  refactor the code.  There is no\nneed to store the IDs, have a list of pointers
  to actual config-entries\ninstead.  As the verification of ->init_config entries
  does not differ from\nverification of other types that are part of the topology.c
  file, simply\nreuse the code."
