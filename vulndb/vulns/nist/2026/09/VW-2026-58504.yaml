title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFS:
  fix delegation_hash_table leak when nfs4_server_common_setup() fails\n\nnfs4_server_common_setup()
  allocates server->delegation_hash_table\nfirst, but server->destroy - the only path
  that frees the table via\nnfs4_destroy_server() - is not assigned until the very
  end of the\nfunction. If any intermediate step fails (the is_ds_only_client()\n\
  check, nfs4_init_session(), nfs4_get_rootfh(), or nfs_probe_server()),\nthe function
  returns with server->destroy still NULL, so the caller's\nnfs_free_server() skips
  the destroy callback and the hash table is\nleaked (4 KiB per attempt with the default
  delegation watermark).\n\nThis is trivially reachable from userspace: every failed
  NFSv4 mount\nleaks one allocation. A client that persistently retries a mount that\n\
  cannot succeed leaks kernel memory without bound. Observed in\nproduction where
  a Longhorn backup poller retried mount.nfs4 against\nan NFSv3-only server roughly
  10 times per se"
