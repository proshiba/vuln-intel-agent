title: "Authentication bypass by spoofing vulnerability in Apache Syncope.\n\n\n\n\
  When the configured JWKS settings for internal JWT authentication are disclosed
  (at least protocol and key), an attacker can spoof another user's privileges after
  completing a successful authentication and obtaining a valid JWT.\n\nThis issue
  affects Apache Syncope: from 3.0.0-M0 through 3.0.16, from 4.0.0-M0 through 4.0.7,
  from 4.1.0-M0 through 4.1.2.\n\n\n\nUsers are recommended to upgrade to version
  4.0.8 / 4.1.3, which fix this issue."
