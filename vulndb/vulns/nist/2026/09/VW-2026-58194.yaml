title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  phylink: correctly validate returned PCS in phylink_inband_caps\n\nIn phylink_inband_caps(),
  the PCS returned by mac_select_pcs is only\nchecked if NULL but mac_select_pcs can
  also return an error pointer.\n\nThis can cause a kernel panic as phylink_pcs_inband_caps()
  only checks\nif passed PCS is not NULL and directly dereference ops from the phylink_pcs\n\
  struct.\n\nUse the IS_ERR_OR_NULL macro to address both case where the returned\n\
  PCS can be NULL or an error pointer and prevent a kernel panic."
