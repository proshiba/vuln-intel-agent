title: Frigate is an open source network video recorder. Prior to 0.18.0, the 
  prefix-matched location /api/go2rtc/api in 
  docker/main/rootfs/usr/local/nginx/conf/nginx.conf requires authentication but
  does not require an administrator role for GET requests, exposing the proxied 
  go2rtc API to viewer users. An authenticated viewer can request the streams, 
  config, log, and stack subpaths to obtain internal addresses, configuration 
  paths, application logs, goroutine stack data, and RTSP stream URLs that may 
  contain camera credentials. Non-GET methods remain blocked by limit_except 
  GET. This issue is fixed in version 0.18.0.
