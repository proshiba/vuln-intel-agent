title: Icinga 2 is an open source monitoring system. Prior to 2.14.9, 2.15.4, 
  and 2.16.2, parsing deeply nested JSON can exhaust the call stack because 
  nesting depth is not bounded. The affected JSON parsing paths are reachable by
  unauthenticated network clients through the Icinga 2 service on TCP port 5665,
  allowing a remote attacker to crash the process, while possible code execution
  has not been demonstrated. This issue is fixed in versions 2.14.9, 2.15.4, and
  2.16.2.
