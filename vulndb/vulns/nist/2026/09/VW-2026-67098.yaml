title: A vulnerability was determined in Privoce VoceChat Server up to 0.5.36. 
  This vulnerability affects the function open_graph::fetch of the file 
  src/api/resource.rs of the component open_graphic_parse Endpoint. Executing a 
  manipulation of the argument url can lead to server-side request forgery. The 
  attack can be launched remotely. The exploit has been publicly disclosed and 
  may be utilized. The vendor was contacted early about this disclosure but did 
  not respond in any way.
