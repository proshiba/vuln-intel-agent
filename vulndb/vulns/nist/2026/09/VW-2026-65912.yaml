title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  pm: kernel: drop pending ADD_ADDR when removing ID0\n\nThe in-kernel MPTCP path
  manager can leave a stale ADD_ADDR announcement\nentry alive when removing the id
  0 endpoint. This happens because the id 0\nremoval path does not tear down pending
  announcements, unlike the non-zero\nid path.\n\nWhen the PM later reselects id 0
  after adding another signal endpoint, it\nfinds the stale anno_list entry and hits
  WARN_ON_ONCE(mptcp_pm_is_kernel())\nin mptcp_pm_announced_alloc().\n\nRoot cause:
  asymmetry between removal paths.\n- Non-zero id path: mptcp_nl_remove_subflow_and_signal_addr()
  calls\n  mptcp_pm_remove_announced() to clean up.\n- Id 0 path: mptcp_nl_remove_id_zero_address()
  skips cleanup entirely.\n\nFix by making the id 0 path symmetric: call mptcp_pm_announced_remove()\n\
  and decrement add_addr_signaled before queuing the RM_ADDR.\n\nSubtle detail: signal
