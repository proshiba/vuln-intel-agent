title: A security flaw has been discovered in DeepSeek deepseek-harness up to 
  0.1.7-rc.2. The affected element is the function loadProfile of the file 
  packages/boot/app-boot/src/profile.ts of the component Bundle Patch Handler. 
  The manipulation of the argument dsh.bundle.patch results in path traversal. 
  The attack may be performed from remote. The attack requires a high level of 
  complexity. The exploitability is described as difficult. The exploit has been
  released to the public and may be used for attacks. The vendor was contacted 
  early about this disclosure but did not respond in any way.
