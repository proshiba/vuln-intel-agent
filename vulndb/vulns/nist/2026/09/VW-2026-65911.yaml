title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: reject short READ responses in CIFSSMBRead()\n\nCIFSSMBRead() reads DataLengthHigh,
  DataLength and DataOffset out of\nthe READ_RSP returned by the server without first
  checking that a\nwhole READ_RSP was actually received. The length of the response
  is\nrecorded in rsp_iov.iov_len, but nothing constrains it to be at least\nread_rsp_size
  before those fields are dereferenced.\n\nA malicious or compromised SMB1 server
  can return a response shorter\nthan the READ_RSP header, so that parsing the header
  itself reads past\nthe end of the receive buffer. SMB1 is not negotiated by default;\n\
  reaching this code requires an explicit vers=1.0 mount.\n\nReject the response unless
  it is at least read_rsp_size bytes long."
