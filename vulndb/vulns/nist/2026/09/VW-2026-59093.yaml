title: A vulnerability was identified in Soarkey StudentManagement up to 
  e08f7f1d5015af407aa4cca0ada3dea189b4937e. Affected is the function 
  RegisterServlet.doPost of the file code/WebContent/register.html of the 
  component Registration Workflow. Such manipulation of the argument level leads
  to improper privilege management. The attack can be launched remotely. The 
  exploit is publicly available and might be used. This product does not use 
  versioning. This is why information about affected and unaffected releases are
  unavailable. The project was informed of the problem early through an issue 
  report but has not responded yet.
