title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/mbox:
  Break poison list loop on an empty payload\n\nA device that returns count == 0 with
  CXL_POISON_FLAG_MORE set on every\niteration never advances nr_records, so the max_errors
  guard never\ntrips and the do/while loops forever while holding poison.mutex. That\n\
  hangs the sysfs-triggered scan thread and blocks all subsequent poison\noperations
  on the device. The existing \"Protect against an uncleared\n_FLAG_MORE\" guard was
  intended to bound a misbehaving device but does\nnot cover the count == 0 case.\n\
  \nStop the loop on an empty payload so a malfunctioning or malicious\ndevice cannot
  wedge the poison scan."
