title: "A flaw was found in Red Hat Ansible Automation Platform's automation-\ncontroller.
  Survey questions of type password are write-only and stored\nencrypted, displayed
  only as a placeholder on read. When a schedule or\nworkflow job template node is
  revalidated against a tightened survey\nspecification, the controller decrypts the
  stored password and includes its\nplaintext value in the minimum/maximum length
  validation error message\nreturned in the HTTP response. A user with the delegated
  JobTemplate Admin\nrole can tighten the survey length constraint and trigger revalidation
  of a\nschedule or node created by another, higher-privileged user, thereby\nrecovering
  that user's stored password in plaintext."
