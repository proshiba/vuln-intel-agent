title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  dwc: ep: Flush cached MSI write before unmapping the iATU\n\nThe MSI-X path already
  flushes any posted MSI-X write before tearing down\nits iATU mapping. That was added
  by commit c22533c66cca (\"PCI: dwc: ep:\nFlush MSI-X write before unmapping its
  ATU entry\") to make sure the write\nreaches the Root Complex before the outbound
  window that translates it\ndisappears.\n\nThe MSI path has the same problem but
  no equivalent flush. When the\nEndpoint driver caches an MSI target address and
  later observes that the\nRoot Complex has changed it, dw_pcie_ep_raise_msi_irq()
  unmaps the existing\niATU entry and reprograms it for the new address. Between the
  last MSI\nwritel() and the unmap there may still be a posted write sitting in the\n\
  fabric, and unmapping the iATU entry can drop or misroute that write.\n\nFix this
  by reading back from the mapped MSI window before the unmap. The\nreadback drains
  any posted MSI writes through the same iAT"
