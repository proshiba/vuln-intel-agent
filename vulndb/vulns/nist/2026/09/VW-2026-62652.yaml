title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Quiesce notifications before teardown\n\nscmi_notification_exit() clears
  and releases the notification instance,\nbut transport callbacks can still deliver
  incoming notifications until\nthe TX/RX channels are freed. During remove, an RX
  interrupt in that\nwindow can enter scmi_notify() while notification state is being
  torn\ndown and then dereference freed memory. The same ordering exists on the\n\
  probe error path after notification initialization.\n\nThe notification late-init
  worker has a separate lifetime issue: protocol\nevent registration queues ni->init_work
  on the system workqueue, so\ndestroying ni->notify_wq does not drain that work.
  If the devres group is\nreleased while init_work is still pending or running, the
  late-init worker\ncan dereference the freed notification instance.\n\nQuiesce the
  notification core before TX/RX channels are torn down, then\nclean up the channels
  before releasing the notificat"
