title: The The Welcomizer plugin for WordPress is vulnerable to Remote Code 
  Execution in all versions up to and including 2.8.1. This is due to missing 
  authorization checks on the twiz_ajax_callback AJAX action's 'savesection' 
  handler combined with the use of eval() to execute user-supplied 'custom 
  logic' code on the frontend. The AJAX handler at twiz-ajax.php verifies a 
  nonce but performs no current_user_can() capability check for the 
  ACTION_SAVE_SECTION case. Furthermore, the nonce is exposed to any 
  authenticated user through the directly-accessible twiz-ajax.js.php file which
  loads WordPress and outputs the nonce. This makes it possible for 
  authenticated attackers, with Subscriber-level access and above, to inject 
  arbitrary PHP code via the twiz_custom_logic POST parameter when saving a 
  section with output choice 'twiz_logic_output'.
