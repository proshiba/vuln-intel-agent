title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix reloc root cleanup in merge_reloc_roots()\n\nIf the root we got has zero root
  refs in its root item, we are resetting\nthe root's ->reloc_root without using barriers
  like we do everywhere else.\nSashiko complained about this while reviewing another
  patch, and it's\ncorrect (see the Link tag below).\n\nAlso, we should not clear
  BTRFS_ROOT_DEAD_RELOC_TREE from the root unless\nthe root points to the reloc root
  we have.\n\nFix this by using clear_reloc_root(), which issues the memory barrier\n\
  after setting the root's ->reloc_root to NULL and before clearing the bit\nBTRFS_ROOT_DEAD_RELOC_TREE
  from the root."
