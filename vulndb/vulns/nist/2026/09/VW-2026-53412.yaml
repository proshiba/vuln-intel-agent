title: Open edX Platform enables the authoring and delivery of online learning 
  at any scale. Prior to commit 3a5ac85, a security vulnerability has been 
  identified in the Open edX LMS platform's LTI (Learning Tools 
  Interoperability) Provider implementation. The validate_timestamp_and_nonce 
  function in lms/djangoapps/lti_provider/signature_validator.py does not 
  validate OAuth nonces or timestamps, allowing an attacker who captures a valid
  LTI launch request to replay it an unlimited number of times without 
  detection. This issue has been patched via commit 3a5ac85.
