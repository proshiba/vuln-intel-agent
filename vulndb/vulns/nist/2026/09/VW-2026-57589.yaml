title: AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 contains a
  stored cross-site scripting vulnerability in the AD_Server plugin's log.php 
  endpoint that fails to escape the label parameter before storage. An 
  unauthenticated attacker can inject malicious HTML through the label 
  parameter, which is later rendered unsanitized in the admin Ad Types report 
  using jQuery .html(), allowing execution of arbitrary JavaScript in an 
  administrator's browser session.
