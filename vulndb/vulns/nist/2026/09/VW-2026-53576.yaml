title: "In the Linux kernel, the following vulnerability has been resolved:\n\npmdomain:
  mediatek: fix remaining %pOF after of_node_put()\n\nscpsys_get_bus_protection_legacy()
  looks up several legacy bus\nprotection regmaps from device-tree nodes.\n\nTwo error
  paths put the device node before checking whether the regmap\nlookup failed, but
  still pass that node to dev_err_probe() with %pOF on\nfailure. If of_node_put()
  drops the last reference, the later %pOF\nformatting can dereference a freed device
  node.\n\nKeep the node reference until after the error message has been emitted
  in\nthe infracfg and SMI lookup paths. Also drop the SMI node before\nreturning
  when the SMI phandle is missing."
