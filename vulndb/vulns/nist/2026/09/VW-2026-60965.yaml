title: Netcore NR255-V firmware version 1.5.130703 contains a stored cross-site 
  scripting vulnerability in routing and NAT configuration CGI components 
  including routing_tab_add_cgi, routing_table_list_show_cgi, 
  route_policy_add_cgi, and route_policy_parame_show_cgi. Attackers can inject 
  persistent script payloads through these route and NAT configuration pages, 
