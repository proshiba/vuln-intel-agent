title: ImageMagick before 7.1.2-30 and 6.9.13-55 contains a 
  time-of-check-time-of-use (TOCTOU) vulnerability in the video decoder that 
  allows attackers to bypass path policy write restrictions via symlink swaps. 
  An attacker can replace a symlink between policy validation (check-time) and 
  the file write operation (use-time) to write to policy-denied locations.
