title: In affected versions of Nexus Repository 3, the script execution endpoint
  (POST /service/rest/v1/script/{name}/run) did not verify whether script 
  execution had been administratively disabled. An account holding 
  script-execution permission could continue to run previously-created scripts 
  even after an administrator set nexus.scripts.allowCreation=false, undermining
  the expectation that this setting fully blocks script execution.
