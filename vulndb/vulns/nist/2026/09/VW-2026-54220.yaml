title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntls:
  device: fix out-of-bounds write in tls_append_frag()\n\nFound with syzkaller and
  a local syzbot instance running on top of a\nnetdevsim TLS offload emulation; tls_device.c
  is otherwise only reachable\non a machine with a NIC that implements the offload.\n\
  \ntls_push_data() only checks whether the open record still has room for\nanother
  frag at the bottom of its loop, and the MSG_MORE early break\nskips that check.\
  \  The record survives to the next syscall with the frag\ncount it already had,
  and tls_append_frag() does not check either, so\nwith TLS_TX_ZEROCOPY_RO every splice(SPLICE_F_MORE)
  of a byte or two adds\na non-coalescing pipe page and num_frags walks off the end
  of\ntls_record_info.frags[MAX_SKB_FRAGS].  Once the record is pushed,\ntls_push_record()
  runs the same index over sg_tx_data[MAX_SKB_FRAGS] and\nthe sg_set_page() writes
  land on the destruct_work that follows it, which\nthe workqueue then calls.\n\n\
