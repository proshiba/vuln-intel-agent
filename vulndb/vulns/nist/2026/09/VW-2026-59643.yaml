title: A vulnerability was detected in GNU Binutils 2.47. The affected element 
  is the function _bfd_elf_strtab_delref of the file bfd/elf-strtab.c of the 
  component ELF String Table. The manipulation results in memory corruption. The
  attack requires a local approach. The exploit is now public and may be used. 
  The project was informed of the problem early through a bug report but has not
  responded yet.
