title: Cua computer-server versions before 0.3.42 skip authentication when the 
  CONTAINER_NAME environment variable is unset and bind to all interfaces by 
  default, allowing unauthenticated attackers to execute arbitrary commands. 
  Attackers can reach TCP port 8000 to run shell commands via the run_command 
  endpoint, read and write arbitrary files through file operation endpoints, and
  access interactive PTY shells without authentication.
