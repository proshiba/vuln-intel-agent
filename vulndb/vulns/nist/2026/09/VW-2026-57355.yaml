title: "An OS command injection weakness in the read-only enforcement of the SQL validation
  component in Amazon awslabs postgres-mcp-server before 1.1.7 might allow an unauthenticated
  actor to execute operating system commands on the host of a self-managed PostgreSQL
  server by placing a crafted COPY ... TO PROGRAM statement into content that is processed
  when an authenticated user interacts with the MCP server in its default read-only
  mode.\n\n\n\nTo remediate this issue, users should upgrade to version 1.1.7 or later."
