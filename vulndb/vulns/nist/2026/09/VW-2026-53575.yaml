title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/connector/hdmi:
  Fix out of bounds memory read\n\nA helper function was copying a given audio infoframe
  into the\nconnector's copy but using the size of the destination (a generic\ntarget,
  sized to accept many different data blocks) not the source (a\nvery specific type
  of data block). Thus, it was copying 60 bytes of\ndata from a 28 byte allocation.\n\
  \nFix that by using the source size instead, together with a build bug\non the source
  size actually being smaller than the destination.\n\nI hit this running KUnit tests
  under KASAN (while debugging something\nelse entirely). In the real world, it seems
  unlikely to cause an\nactual problem. It is a read not a write so it can't corrupt
  any\nmemory. However, it could potentially fall off the end of a page and\ncause
  an accvio bug."
