title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  bound num_export_targets array for mds info v2/v3\n\nceph_mdsmap_decode() in fs/ceph/mdsmap.c
  reads num_export_targets from\neach per-mds info record and advances the decode
  cursor by\nnum_export_targets * sizeof(u32) without first checking that many bytes\n\
  remain. The only upper-bound check that catches a runaway cursor\n(*p > info_end)
  is gated on info_v >= 4, because info_end is left NULL\nfor info_v 2 and 3. When
  the monitor sends an MDS map whose per-mds\ninfo version is 2 or 3 with an oversized
  num_export_targets, the cursor\nmoves past the message front buffer and the later
  export-targets loop\ncalls the unchecked ceph_decode_32() on out-of-bounds memory.\n\
  \nA kernel client processes CEPH_MSG_MDS_MAP from its monitor session\n(net/ceph/mon_client.c
  dispatches it; fs/ceph/super.c routes it to\nceph_mdsc_handle_mdsmap(), which sets
  end to the front buffer bound and\ncalls ceph_mdsmap_decode()). A malicious or compromised "
