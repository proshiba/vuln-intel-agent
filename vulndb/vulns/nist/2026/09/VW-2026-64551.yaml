title: Nautobot is a Network Source of Truth and Network Automation Platform. 
  From 3.0.0 until 3.1.8, the generic ApprovalWorkflowStageResponse create 
  endpoint does not enforce approver-group membership, change permission on the 
  object under review, or the one-response-per-user restriction applied by the 
  intended approve and deny actions. A user with only 
  extras.add_approvalworkflowstageresponse can submit approved responses 
  directly, while writable user and state fields permit responses to be 
  attributed to arbitrary users. These forged responses can satisfy 
  min_approvers, approve the workflow, and activate its gated ScheduledJob 
  without a legitimate approver. This issue is fixed in version 3.1.8.
