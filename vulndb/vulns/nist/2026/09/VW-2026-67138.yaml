title: Joomla Extension - regularlabs.com - Privileged stored XSS via 
  data-rlta-url attributes in Tabs & Accordions (Pro) 2.3.0 - 3.1.0 - Tabs & 
  Accordions Pro accepts a url option for an item and writes it to a generated 
  data-rlta-url attribute. The browser code passes that value to window.open() 
  when the item is activated. Affected versions do not reject browser URL 
  schemes which execute JavaScript. Joomla sees ordinary plugin syntax while 
  filtering the authored article; Tabs & Accordions creates the executable 
  browser behavior later while rendering the article.
