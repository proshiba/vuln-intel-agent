title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4.2:
  fix LAYOUTSTATS send buffer exhaustion\n\nencode_layoutstats_maxsz budgets XDR_QUADLEN(PNFS_LAYOUTSTATS_MAXSIZE),\n\
  i.e. 256 bytes, for the layoutupdate4 body written by the layout driver.\nThe flexfiles
  record can exceed that.\n\nff_layout_encode_ff_layoutupdate() emits, per data server,
  a netaddr4,\nan nfs_fh4, two ff_io_latency4, an nfstime4 and a bool.  A data server\n\
  whose filehandle is NFS_MAXFHSIZE bytes long already accounts for 132 of\nthose
  bytes, and the two ff_io_latency4 at 64 bytes each, the nfstime4\nand the bool add
  a further 144, so the body passes 256 bytes before the\nnetaddr4 is encoded at all.\
  \  encode_layoutstats() additionally writes\nthe deviceid4 and the layoutupdate4
  lou_type word, neither of which the\nmacro accounts for.\n\nThe filehandle and the
  address are both chosen by the server, through\nLAYOUTGET and GETDEVICEINFO, so
  it can drive the encoder past the\nend of the send buffer.  xdr_reserve_spac"
