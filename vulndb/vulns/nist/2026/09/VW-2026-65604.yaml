title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: avoid out-of-bounds access in monitor\n\nIn NAN, we don't know on what
  band the frame will be sent. Therefore we\nset info->band to NUM_NL80211_BANDS.
  However, this leads to out-of-bound\naccess in ieee80211_add_tx_radiotap_header
  when we try to access the\nsbands array.\n\nFix it by not accessing the array if
  the band is NUM_NL80211_BANDS.\nThis means that we will not report rate info for
  legacy rate in NAN.\nBut nobody really cares about it."
