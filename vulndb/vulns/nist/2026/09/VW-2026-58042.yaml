title: Laci Synchroni is a decentralized mod and appearance sync server and 
  plugin for Dalamud. Versions of the backend prior to 1.2.3 have an improper 
  authentication vulnerability in the application's OAuth2 login flow. The 
  application relies on client-side state by trusting the `UID` field inside the
  `Authentications` object of a user's local `config.json` file. By manually 
  editing this local file on their PC prior to logging in, a user can supply an 
  arbitrary UID. Because the server fails to validate that the authenticated 
  OAuth2 identity matches the requested UID, an attacker can fully impersonate 
  any target user and perform actions on their behalf. This issue has been 
  resolved in version 1.2.3. The patch modifies `AuthorizeOauthAsync` inside the
  `SecretKeyAuthenticatorService` to strictly bind the lookup of the requested 
  User ID (`requestedUid`) to the record of the successfully authenticated 
  identity (`primaryUid`). The server will no longer load or return session 
  tokens for a requested
