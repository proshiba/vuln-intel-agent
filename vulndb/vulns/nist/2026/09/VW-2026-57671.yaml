title: rclone is a command-line program to sync files and directories to and 
  from different cloud storage providers. From 1.49.0 until 1.75.1, the HTTP 
  backend attaches headers configured through --http-headers or headers= to 
  requests in backend/http/http.go, while its fshttp.NewClient client follows 
  redirects without a backend-specific http.Client.CheckRedirect policy. A 
  configured remote that redirects to another host can therefore cause custom 
  secrets such as X-Api-Key to be resent to that untrusted destination, and a 
  same-host HTTPS-to-HTTP redirect can expose Authorization or Cookie headers in
  cleartext. Listing, stat, download, mount, and serve operations can trigger 
  the leak during normal use. This issue is fixed in version 1.75.1.
