title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack_sip: fix OOB read in sip_skip_whitespace()\n\nsip_skip_whitespace()
  returns dptr unchanged when its own loop\nexhausts the buffer (dptr == limit), instead
  of NULL like its sibling\nsip_follow_continuation() returns on its own \"no more
  data\" path.\n\nct_sip_get_header() only checks for NULL after calling it:\n\n \
  \ dptr = sip_skip_whitespace(dptr, limit);\n  if (dptr == NULL)\n          break;\n\
  \  if (*dptr != ':' || ++dptr >= limit)\n          break;\n\nso a recognized header
  name followed only by spaces/tabs running to\nthe exact end of the SIP payload,
  with no colon, makes the very next\nstatement read one byte past the buffer.\n\n\
  Make both \"no more data\" outcomes return NULL, matching the\nconvention sip_follow_continuation()
  already uses and that both\nexisting callers already check for."
