title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  ensure nfsd_file_do_acquire() does not use a non-opened file\n\n->atomic_open is
  permitted to return success without actually opening\nthe file.  It indicates this
  by calling finish_no_open().\nThis means dentry_create() can return a file which
  hasn't been opened.\nThis is extremely unlikely as ->atomic_open handlers typically\n\
  use finish_no_open() only for already existing files, and dentry_create()\nisn't
  called in that case, and the parent being locked should prevent\nraces.\n\nHowever
  out of an abundance of caution it seems wise to teach nfsd to\nonly use the file
  returned by dentry_create() if FMODE_OPENED is set,\nindicating that it has in fact
  been opened."
