title: onefetch through 2.28.1 writes repository information field values to the
  terminal without removing control characters, allowing terminal escape 
  sequence injection. Attackers can embed ANSI/OSC escape sequences in project 
  manifest version and name fields to manipulate terminal output, rewrite window
  titles, hide text, or trigger emulator-specific behavior when victims run 
  onefetch.
