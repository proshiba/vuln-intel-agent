title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: mcast: fix use-after-free of a master VLAN's multicast context\n\nbr_multicast_toggle_one_vlan()
  clears BR_VLFLAG_MCAST_ENABLED under\nbr->multicast_lock before stopping a VLAN's
  multicast context.  That is\nthe teardown handshake: lockless readers gate on the
  flag through\nbr_multicast_ctx_should_use() -> br_multicast_ctx_vlan_disabled(),
  so\nonce it is cleared under the lock no reader can arm the context again.\n\nFor
  a master VLAN the handshake never runs.  __vlan_del() clears\nBRIDGE_VLAN_INFO_BRENTRY
  before calling br_vlan_put_master(), so\nbr_multicast_toggle_one_vlan(masterv, false)
  returns early on\n!br_vlan_is_brentry(vlan): the flag stays set and br->multicast_lock
  is\nnever taken.  br_vlan_put_master() then drains the context in\nbr_multicast_ctx_deinit()
  and frees the VLAN through call_rcu(), while a\nreader still inside rcu_read_lock()
