title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmshv:
  Fix race in mshv_irqfd_deassign\n\nmshv_irqfd_deactivate() and the hlist traversal
  of pt_irqfds_list\nrequire pt->pt_irqfds_lock to be held, but mshv_irqfd_deassign()\n\
  omits it. This races with the EPOLLHUP path in mshv_irqfd_wakeup(),\nwhich does
  take the lock before calling mshv_irqfd_deactivate().\n\nAdditionally, mshv_irqfd_deactivate()
  uses hlist_del() which poisons\nthe node pointers rather than resetting them. Since\n\
  mshv_irqfd_is_active() relies on hlist_unhashed() (checks pprev ==\nNULL), a poisoned
  node still appears active. If a concurrent path calls\nmshv_irqfd_deactivate() again
  on the same irqfd, the guard fails to\nprevent a double hlist_del() on poisoned
  pointers.\n\nFix both issues:\n- Add the missing spin_lock_irq/spin_unlock_irq around
  the list\n  traversal in mshv_irqfd_deassign(), matching mshv_irqfd_release().\n\
  - Use hlist_del_init() instead of hlist_del() so the node is properly\n  marked
  as unhashed after "
