title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Release current IOAS on xa_store() failure\n\niommufd_take_all_iova_rwsem() takes
  an object reference and the\niova_rwsem write lock before storing the IOAS in the
  temporary ioas_list\nxarray.\n\nIf xa_store() fails, the current IOAS has not been
  inserted into\nioas_list yet. iommufd_release_all_iova_rwsem() only unwinds IOAS\n\
  objects already present in that xarray, so it cannot release the current\nIOAS.\n\
  \nRelease the current IOAS rwsem and object reference before unwinding the\npreviously
  stored entries."
