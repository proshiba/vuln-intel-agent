title: mppx is a TypeScript interface for machine payments protocol. Prior to 
  0.8.2, FeePayerPolicy in src/tempo/internal/fee-payer.ts used 
  decodeFunctionData to validate fee-sponsored calldata but did not reject 
  trailing bytes. A client could append nonzero padding that increased intrinsic
  calldata gas while gas_limit and max_fee_per_gas remained within policy caps, 
  causing the server fee_payer wallet to pay substantially more than the decoded
  transaction required. The tested 16 KB header limit bounded the demonstrated 
  padding to about 5,500 bytes and produced approximately five times the normal 
  transaction fee. This issue is fixed in version 0.8.2.
