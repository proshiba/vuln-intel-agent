  companion code directories, allowing attackers to bypass security scanning by 
  shipping malicious __pycache__ entries alongside benign source files. 
  Attackers can execute arbitrary Python bytecode on import while the scanner 
  reports a CERTIFIED verdict with high trust scores in both static and semantic
  analysis modes.
