title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark NULL kptr stores precise\n\ncheck_map_kptr_access() permits a scalar store
  into an untrusted kptr\nfield only when the register is known to contain zero. Unlike
  other\nverifier checks whose outcome depends on a scalar value, it does not mark\n\
  that register precise.\n\nA state checkpoint reached with an imprecise zero can
  therefore prune a\nsecond path that reaches the store with an arbitrary nonzero
  scalar. The\nprogram can write attacker-controlled bits into the kptr field and
  load\nthem back as a PTR_TO_BTF_ID.\n\nCall mark_chain_precision() before accepting
  a known-zero register. This\nforces state equivalence to compare its scalar range
  and makes the verifier\nvisit and reject a path carrying a nonzero value."
