title: A vulnerability was identified in tsi-coop tsi-dpdp-cms up to 0.5.0. This
  affects an unknown part of the file InterceptingFilter.java of the component 
  Bootstrap Setup Endpoint. The manipulation leads to missing authentication. 
  The attack can be initiated remotely. The exploit is publicly available and 
  might be used. Upgrading to version 0.5.1 is able to mitigate this issue. 
  Upgrading the affected component is recommended.
