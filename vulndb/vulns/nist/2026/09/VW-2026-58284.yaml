title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  validate lengths in dlm_mig_lockres_handler\n\nA node receiving a DLM_MIG_LOCKRES
  message trusts several fields of the\npeer-supplied dlm_migratable_lockres without
  validation.  num_locks and\nlockname_len are bounded only on the sending side, and
  the message is\nnever checked to actually carry num_locks migratable_lock entries.\
  \  As a\nresult dlm_process_recovery_data() walks mres->ml[0..num_locks) past the\n\
  kmalloc(data_len) copy of the message (an out-of-bounds read that ends in\na BUG_ON
  panic), and dlm_init_lockres() copies lockname_len bytes into the\nfixed 32-byte
  o2dlm_lockname slab object (a heap out-of-bounds write). \nBoth are reachable by
  any node in the domain.\n\nValidate these fields right after dlm_grab(), before
  anything uses them --\nincluding the not-joined error path, which already prints
  mres->lockname\nwith the unbounded lockname_len as a %.*s precision.  Reject the
  message\nunless lockname_len <= DLM_LOC"
