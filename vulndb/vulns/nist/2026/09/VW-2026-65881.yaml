title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Bound VP index against VP_CTRL IOCB bitmap size\n\nThe VP control IOCB
  selects its target virtual port by setting one bit\nin vp_idx_map, a fixed 16-byte
  (128-bit) array in both\nvp_ctrl_entry_24xx and vp_ctrl_entry_24xx_ext. qla25xx_ctrlvp_iocb()\n\
  computes map = (vp_index - 1) / 8 and writes vce->vp_idx_map[map]\nwithout checking
  that map stays within the array.\n\nmax_npiv_vports is taken from firmware and only
  sanitized to a\nMIN_MULTI_ID_FABRIC-aligned boundary, so it can legitimately be
  191 or\n255, and qla24xx_control_vp() only rejects vp_index >= max_npiv_vports.\n\
  A vp_index above 128 therefore yields map >= 16 and an out-of-bounds\nwrite of up
  to 16 bytes past vp_idx_map, corrupting the trailing IOCB\nfields (or the adjacent
  request-ring slot on the 64-byte layout).\n\nReject a vp_index that cannot be represented
  in the IOCB bitmap in\nqla24xx_control_vp(), and add a defensive ARRAY_SIZE() guard
  in\nqla25xx_ctrl"
