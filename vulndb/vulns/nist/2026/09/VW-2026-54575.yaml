title: RouterOS WebFig contains an unauthenticated file-read vulnerability in 
  the /jsproxy path where a newly allocated session retains a stale 
  uninitialized principal pointer used for file authorization. An 
  unauthenticated attacker can prepare the allocator so that the file-serving 
  path dereferences this pointer with sufficient rights, then supply 
  parent-directory components in an encrypted URI to escape the WebFig file 
  namespace and disclose root-owned files, including configuration stores 
  containing credentials.This issue was fixed in versions: 6.49.21 
  (Long-term), 7.23.4 (Long-term) and 7.24.2 (Stable)
