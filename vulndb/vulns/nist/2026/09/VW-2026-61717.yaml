title: Redocly CLI makes OpenAPI validation, linting, and documentation 
  workflows easier. Prior to version 2.33.0 of @redocly/respect-core and 
  @redocly/cli, the respect command dynamically evaluates $faker runtime 
  expressions in Arazzo descriptions. A crafted expression can traverse 
  constructor, prototype, or __proto__ properties in 
  packages/respect-core/src/modules/context-parser/get-value-from-context.ts, 
  reach the JavaScript Function constructor, and execute arbitrary code when a 
  user processes an untrusted description. The executed code runs with the 
  privileges of the CLI process and can execute shell commands or read CI 
  secrets. Users processing only trusted, self-authored workflows are not 
  affected. This issue is fixed in @redocly/respect-core and @redocly/cli 
  version 2.33.0.
