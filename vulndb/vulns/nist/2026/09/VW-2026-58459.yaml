title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  initialize copy-notify stateid before publishing it\n\nnfsd4_copy_notify() finished
  initializing the cpntf state after\nnfs4_alloc_init_cpntf_state() had already linked
  it into the\ns2s_cp_stateids IDR and the parent's sc_cp_list, with cs_count == 1
  (the\nmembership reference) and none held for the caller. A racing\nOFFLOAD_CANCEL
  (crafted cl_id == nn->s2s_cp_cl_id plus the guessable\nso_id) could reach manage_cpntf_state()
  and free the entry, turning the\ncaller's subsequent cpn_cnr_stateid read and cp_p_stateid/cp_p_clid\n\
  writes into use-after-free. The owning clientid was also only recorded\nafter publication,
  so it could not gate an ownership check in that window.\n\nRecord cp_p_stateid and
  cp_p_clid inside nfs4_alloc_init_cpntf_state()\nbefore nfs4_init_cp_state() publishes
  the entry, and return it with an\nextra reference. The caller reads the stateid
  under that reference and\ndrops it with nfs4_put_cpntf_state(); on a l"
