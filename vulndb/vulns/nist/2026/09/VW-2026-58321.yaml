title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Reject connection when transport allocation fails\n\nhandle_connect_req() returns
  without action when\nsvc_rdma_create_xprt() fails to allocate the new transport.\n\
  The CM core returns 0 for CONNECT_REQUEST events, so it does\nnot destroy the new
  rdma_cm_id. Each allocation failure under\nmemory pressure leaks one rdma_cm_id,
  and a remote peer driving\nconnection attempts can amplify this.\n\nReject the connection
  by returning a non-zero status from the\nCM event handler, which tells the CM core
  to destroy the\norphaned cm_id."
