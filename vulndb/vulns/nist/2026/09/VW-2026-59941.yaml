title: gitoxide gix-transport before 0.59.2 fails to filter control characters 
  in git-daemon connect requests, allowing attackers to inject NUL/CR/LF bytes 
  via crafted git URLs. Attackers can inject extra NUL-delimited protocol fields
  to spoof virtual hosts or inject newlines into daemon requests and logs.
