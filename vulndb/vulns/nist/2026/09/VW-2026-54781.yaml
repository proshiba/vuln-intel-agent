title: "In Eclipse Ankaios versions v0.5.1 through v1.0.1, the agent-side Control
  Interface authorizer incorrectly evaluates multi-segment allow rules whose first
  path segment is a wildcard. An authenticated workload with access restricted by
  such a rule can submit a CompleteStateRequest or UpdateStateRequest with an empty
  field mask. The request may then be incorrectly authorized as matching the scoped
  rule, allowing the workload to read the complete cluster state or replace state
  outside its authorized subtree. This may result in unauthorized disclosure or modification
  of other workloads and cluster configuration. Only a rule consisting solely of *
  is intended to authorize an empty mask.\n\n\n\n\nMitigation: Until an update containing
  the fix is installed, avoid multi-segment Control Interface allow-rule filter masks
