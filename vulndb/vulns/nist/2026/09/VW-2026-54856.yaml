title: "Affected versions of MISP insufficiently validate URLs used by dashboard widgets,
  particularly the Button widget.\n\n\nThe widget's URL is stored configuration controlled
  by a user. The previous renderer considered a URL safe if it appeared relative or
  if its parsed hostname matched the configured MISP hostname. That logic failed to
  reject dangerous schemes and URL forms that browsers normalize differently from
  PHP's URL parsing.\n\n\nAs a result, values such as javascript: URLs or backslash-based
  authority forms could reach the generated anchor's href and execute script or navigate
  to an attacker-controlled origin when another user interacted with the widget. The
  upstream commit describes the issue as:\n\n\n“javascript: and backslash URLs reached
  the href (stored XSS)”.\n\n\nThe fix routes widget URLs through a shared DashboardURLValidator,
  rejects dangerous schemes, raw backslashes, control characters, and unauthorized
  absolute origins, and validates the URL both in the widget handler and render"
