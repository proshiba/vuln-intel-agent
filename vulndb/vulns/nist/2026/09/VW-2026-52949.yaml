title: Konga before 2.1.0 contains a privilege escalation vulnerability that 
  allows low-privileged local attackers to execute arbitrary code by planting 
  attacker-controlled OpenSSL configuration or library files in a hardcoded 
  filesystem path absent from default installations. On Windows, the missing 
  directory resides in a location writable by any authenticated local user, 
  enabling attackers to create the directory and place malicious files that 
  execute at the privilege level of the user or service account that launches 
  Konga, facilitating privilege escalation.
