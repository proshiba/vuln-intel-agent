title: TREK is a collaborative travel planner. Prior to 3.3.0, getSharedTripData
  in server/src/services/shareService.ts returns days, assignments, dayNotes, 
  and places through GET /api/shared/:token even when the trip owner disables 
  share_map. The client hides the map, but the public JSON response still 
  includes the itinerary and place names, coordinates, addresses, descriptions, 
  notes, and prices. Anyone holding the valid share token can therefore read 
  location and route information that the owner explicitly chose not to share, 
  although the random token remains required and the flaw does not permit 
  modification. This issue is fixed in version 3.3.0.
