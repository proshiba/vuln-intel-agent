title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  ft260: fix stack-use-after-return write in I2C read race\n\nft260_i2c_read() points
  dev->read_buf at a caller-supplied buffer\n(often an on-stack variable), arms a
  completion and waits up to five\nseconds for the device to return the data. The
  HID input callback\nft260_raw_event() runs in the input/IRQ path, independent of
  the\ndev->lock mutex held by the read path, and copies the device-supplied\npayload
  into dev->read_buf after a plain NULL check.\n\nThese two paths share read_buf,
  read_idx and read_len with no\nserialization. If the device delays its response
  until the read\ntimes out, ft260_i2c_read() resets the controller, clears read_buf\n\
  and returns, unwinding the stack frame the buffer lived in. A\nresponse that arrives
  at that moment lets ft260_raw_event() pass the\nNULL check and then memcpy() the
  device-controlled payload into the\nnow-freed stack location, a bounded but attacker-influenced\n\
  stack-use-after-return wri"
