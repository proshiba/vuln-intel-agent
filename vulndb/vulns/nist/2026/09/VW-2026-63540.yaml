title: The WordLift – AI powered SEO – Schema plugin for WordPress is vulnerable
  to Sensitive Information Exposure in all versions up to, and including, 
  3.54.10 via the JSON-LD REST API endpoints. This is due to the plugin 
  registering the /wordlift/v1/jsonld/ routes (jsonld/{id}, 
  jsonld/http/{item_id}, jsonld/post-meta/{meta_key}, jsonld/meta/{meta_key}, 
  and jsonld/{post_type}/{post_name}) with a permission_callback of 
  '__return_true' and the downstream converter retrieving the post via 
  get_post() without verifying the post status or the requesting user's 
  capabilities. This makes it possible for unauthenticated attackers to read the
  title, content/description, author, publication and modification dates, word 
  count, comment count, and other metadata of private, draft, and pending posts 
  by enumerating post IDs, bypassing WordPress core access controls.
