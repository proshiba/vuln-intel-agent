title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hfi1:
  Free RX data on late probe failure\n\nhfi1_init_dd() allocates the shared AIP/VNIC
  RX support before returning.\nIf hfi1_init() or hfi1_register_ib_device() later
  fails, init_one() tears\ndown the device data without calling hfi1_free_rx(). This
  leaks netdev_rx\nand its dummy netdev.\n\nFree the RX support after IB unregistration
  and before postinit_cleanup(),\nas done on normal device removal."
