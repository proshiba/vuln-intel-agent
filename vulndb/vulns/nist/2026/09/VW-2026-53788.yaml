title: "Creation of a temporary file in a directory with insecure permissions in the
  FPGA management tool installation component in AWS FPGA Development Kit (aws-fpga)
  before 2.3.4 might allow local users to execute arbitrary code with root privileges
  via crafted shell content placed at a predictable path in a world-writable temporary
  directory, which the installation step reads after elevating its own privileges.\n\
  \n\n\nTo remediate this issue, users should upgrade to version 2.3.4."
