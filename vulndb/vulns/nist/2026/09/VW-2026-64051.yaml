title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to 3.6.15 and 3.7.2, Joplin accepts 
  synchronized resource metadata whose id or file_extension contains 
  parent-directory or path-separator characters. BaseItem.unserialize() stores 
  the unvalidated fields, resourceFilename() concatenates them into a 
  destination path, and ResourceFetcher writes the attacker-controlled resource 
  blob outside the resource directory during background synchronization. An 
  attacker with write access to a configured sync target or shared notebook can 
  create or overwrite files at an attacker-chosen existing path without user 
  interaction. This issue is fixed in versions 3.6.15 and 3.7.2.
