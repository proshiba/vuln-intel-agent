title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  xhci: bail out of setup if the controller is inaccessible\n\nxhci_gen_setup() locates
  the operational registers using the capability\nlength read from the very first
  register:\n\n\txhci->op_regs = hcd->regs +\n\t\tHC_LENGTH(readl(&xhci->cap_regs->hc_capbase));\n\
  \nIf the controller is dead or has dropped off the bus, that read returns\n~0, HC_LENGTH()
  truncates it to 0xff, and op_regs ends up 0xff bytes\npast the page-aligned MMIO
  base, i.e. unaligned. The first access\nthrough it, xhci_halt() -> xhci_handshake()
  reading op_regs->status, is\nthen an unaligned readl() on device memory. arm64 faults
  on unaligned\ndevice accesses, so instead of xhci_handshake() catching the all-ones\n\
  value and returning -ENODEV, setup oopses:\n\n  xhci-pci-renesas 0005:08:00.0: Unable
  to change power state from D3cold to D0, device inaccessible\n  xhci-pci-renesas
  0005:08:00.0: xHCI Host Controller\n  xhci-pci-renesas 0005:08:00.0: new USB bus
  registered"
