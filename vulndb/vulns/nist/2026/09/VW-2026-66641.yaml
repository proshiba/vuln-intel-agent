title: Parse Server is an open source backend server. In versions prior to 
  8.6.90 and in versions from 9.0.0 prior to 9.10.1-alpha.9, the device token 
  deduplication logic for installation records does not validate the type of 
  client-supplied installation fields before using them to build database 
  queries. An unauthenticated remote attacker who knows only the public 
  application ID can submit non-string values in these fields to inject query 
  operators, causing the deduplication cleanup — which runs with elevated 
  privileges before class-level permissions are evaluated — to delete every 
  device registration in the application or an attacker-chosen subset of them. 
  No account, session token, master key, or user interaction is required. 
  Deleted registrations cannot be recovered on the server, so push notifications
  cannot be delivered until every client re-registers. Any deployment that 
  exposes the REST API to clients and uses push notifications is affected in its
  default configuration. Versions 8.6.9
