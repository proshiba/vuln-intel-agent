title: n8n is a workflow automation platform. In n8n versions before 1.123.76, 
  2.37.7, and 2.38.2, the source control push endpoint derived the set of files 
  to push from the file paths and status supplied in the client request payload 
  instead of from the server-side status computed for the requesting user. An 
  authenticated project-scoped user (e.g., a project admin) could therefore 
  reference files belonging to projects they have no access to and push a 
  deletion of those projects' workflows and credentials, resulting in 
  cross-project data destruction. Exploitation requires the Source Control 
  (Environments) enterprise feature to be licensed, enabled, and connected to a 
  remote repository. The issue is fixed in 1.123.76, 2.37.7, and 2.38.2.
