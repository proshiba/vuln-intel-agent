title: A flaw was found in FreeIPA. An unauthenticated remote attacker could 
  exploit a DOM Cross-Site Scripting (XSS) vulnerability in the FreeIPA/IdM Web 
  UI password reset page. By enticing a victim to click a specially crafted link
  and complete a password reset, the attacker could inject and execute arbitrary
  JavaScript code. This allows the attacker to perform actions within the 
  victim's authenticated session, potentially leading to full administrative 
  control if an IdM administrator is targeted.
