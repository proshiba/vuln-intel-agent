title: undici's cache interceptor documents that only safe HTTP methods are 
  cached, but its logic to skip caching is built by subtracting the configured 
  methods from the set of safe methods, so an unsafe method such as POST, PUT, 
  or DELETE is never placed in the skip list and instead falls through to the 
  full cache-read path. The response-storage gate also lacked a method check, so
  a response to an unsafe request that is heuristically cacheable or carries an 
  explicit Cache-Control directive is stored and later replayed from cache. 
  Because response headers from a remote origin are untrusted, an origin can 
  answer once with a cacheable status and then have the client's own subsequent 
  state-changing requests to that path served from the stale cache entry without
  ever reaching the origin, an integrity failure that occurs under the 
  interceptor's default configuration. This affects undici versions from 7.0.0 
  up to 7.29.1 and from 8.0.0 up to 8.10.2. Users should upgrade to undici 
  7.29.1 or 8.10.2.
