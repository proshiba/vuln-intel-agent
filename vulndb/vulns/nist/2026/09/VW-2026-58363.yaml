title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  array: reject an array block whose value size is not the caller's\n\narray_block_check()
  can only compare the header against itself, so a block\nwith value_size 4 and max_entries
  1018 is internally consistent and passes.\ndm-cache keeps two arrays -- mappings
  at 8 bytes and hints at 4 -- and the\nroots for both live in the superblock. Point
  the mappings root at a hint\nblock and __load_mappings() walks it through an info
  whose value size is 8,\nso element_at() strides 8 bytes over 4-byte entries and
  reaches offset 8160\nof a 4096-byte block.\n\nget_ablock() and __shadow_ablock()
  are the two places that hold the block\nand the caller at once. Reject there when
  the two value sizes disagree.\nArrays only ever read their own blocks, so this fires
  on crafted metadata\nonly."
