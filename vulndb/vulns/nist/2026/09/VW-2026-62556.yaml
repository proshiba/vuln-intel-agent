title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/region:
  Fix use-after-free in find_pos_and_ways() error path\n\nThe error path releases
  its reference to a switch decoder before\nlogging an error that includes the decoder
  name. If the released\nreference is the last one, the decoder can be freed before
  the error\nmessage accesses its name.\n\nDrop the reference after the error is reported."
