title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregulator:
  tps6594: Fix device node reference leaks in multiphase loop\n\nIn tps6594_regulator_probe(),
  the multi-phase configuration loop calls\nof_find_node_by_name() to find buck nodes
  by name, and of_get_parent()\ntwice to navigate to the PMIC parent node. None of
  the acquired node\nreferences (np, intermediate parent, np_pmic_parent) are ever
  released\nvia of_node_put(), causing a reference leak on every loop iteration.\n\
  \nAdditionally, of_find_node_by_name() can return NULL, but the result was\nimmediately
  passed to of_node_full_name() and of_get_parent() without a\nNULL check, which could
  lead to a NULL pointer dereference.\n\nFix this by:\n- Adding a NULL check for np
  after of_find_node_by_name()\n- Storing the intermediate parent node in a local
  variable np_parent\n- Calling of_node_put() on np, np_parent and np_pmic_parent
  at the\n  end of each loop iteration"
