  an include of\npinctrl-mtk-common-v2.h.\n\nHowever, pinctrl drivers relying on the
  v1 common driver include\npinctrl-mtk-common.h instead, which provides another definition
  of\nstruct mtk_pinctrl that does not contain an 'soc' field.\n\nSince mtk_eint_do_init()
