title: "When `CURLOPT_PINNEDPUBLICKEY` is configured alongside options that disable\n\
  standard peer verification (`CURLOPT_SSL_VERIFYPEER = 0` and\n`CURLOPT_SSL_VERIFYHOST
  = 0`), libcurl fails to enforce public key pinning on\nconnections established without
  a presented server certificate. Bypassing the\npinning check under these disabled-verification
  conditions allows\nunauthenticated connections to succeed when they should be rejected."
