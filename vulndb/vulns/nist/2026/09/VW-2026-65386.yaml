title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/xive:
  propagate IPI init errors to prevent use-after-free\n\nWhen xive_init_ipis() fails
  (e.g. irq_domain_alloc_irqs() fails),\nthe error path frees the global xive_ipis
  array.  However,\nxive_smp_probe() previously ignored this failure and proceeded
  to\ncall xive_setup_cpu_ipi(), which dereferences the already-freed\nxive_ipis pointer
  -- a use-after-free.\n\nNow that xive_smp_probe() returns int (previous patch),
  propagate\nthe error from xive_init_ipis() and xive_setup_cpu_ipi() through\nxive_smp_probe().\
  \  Check the return value in both pnv_smp_probe()\nand pSeries_smp_probe() so that
  IPI setup is aborted cleanly on\nfailure, avoiding the use-after-free."
