title: radare2 is a UNIX-like reverse engineering framework and command-line 
  toolset. Prior to 6.2.0, radare2's Mach-O Swift field-metadata parser was 
  vulnerable because a relative Swift field pointer could be lower than the 
  field-metadata section base, making subtraction produce a negative logical 
  index. The vulnerability is triggered by parsing Swift type and class metadata
  from a crafted Mach-O file. The derived index was used to read four bytes 
  immediately before the allocated field-metadata buffer. This can cause 
  incorrect metadata processing or process termination; no attacker-observable 
  memory disclosure has been demonstrated. This issue is fixed in version 6.2.0.
