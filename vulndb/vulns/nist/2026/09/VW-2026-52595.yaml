title: "The Erlang/OTP httpc HTTP client does not enforce a limit on the total size
  of response headers received from a server. The max_header_size option defaults
  to nolimit, and httpc_response:parse_headers/6 accumulates every header into a list
  before the length check runs (which only fires after the terminating CRLF CRLF is
  received).\n\nA malicious or compromised HTTP server can send an arbitrarily large
  number of headers, or headers with very large values, causing the client process
  to allocate unbounded memory until the system runs out of memory or the BEAM VM
  crashes. A proof-of-concept server sending 100,000 headers of roughly 4000 bytes
  each caused the client VM to allocate over 13 GB of memory in under 30 seconds.\n\
  \nAny application using httpc:request/4,5 to connect to untrusted servers is affected.
  No authentication is required: any server the client connects to (including via
  a redirect or man-in-the-middle) can trigger the exhaustion.\n\nThis issue affects
  OTP from OTP 17.0 before OTP"
