title: "Improper neutralization of special elements used in an OS command in yast2-samba-client
  allows an attacker who controls the content of an Active Directory directory tree
  - a rogue domain controller, or a directory user delegated the right to create objects
  - to execute arbitrary commands as root on a machine being joined to that domain.\n\
  This issue affects yast2-samba-client through 5.0.4."
