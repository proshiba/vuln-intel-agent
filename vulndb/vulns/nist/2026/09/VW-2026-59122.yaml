title: A vulnerability was detected in GPAC up to f1219cde. This vulnerability 
  affects the function gf_node_unregister of the file 
  scenegraph/base_scenegraph.c of the component MP4Box. The manipulation results
  in use after free. The attack can be executed remotely. The exploit is now 
  public and may be used. Upgrading to version abi-16.23 is able to resolve this
  issue. The patch is identified as 9eb40df4448b88d6a6ce3454657c06f47eff0b24. 
  Upgrading the affected component is recommended.
