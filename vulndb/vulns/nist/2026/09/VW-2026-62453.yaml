title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  coreboot: Validate table bounds\n\nThe existing coreboot_table_populate() bounds
  checks limit individual\nentries to the mapped length.  However, coreboot_table_probe()
  replaces\nthe platform resource length with header and table sizes supplied by\n\
  firmware before mapping the full table.\n\nA malformed table can overflow the 32-bit
  size addition or advertise an\nextent beyond the resource, causing the driver to
  map and parse memory\noutside the resource.  A resource shorter than the fixed header
  is also\nmapped as though it contained a complete header.\n\nReject resources shorter
  than the fixed header.  After validating the\nsignature, require a complete header,
  calculate the advertised extent\nwith overflow checking, and reject extents beyond
  the resource before\nremapping the table."
