title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  pidff: fix OOB write when hid->inputs is empty\n\nhid_pidff_init_with_quirks() derives
  its input_dev from\n\n\tlist_entry(hid->inputs.next, struct hid_input, list)\n\n\
  without first checking that hid->inputs is non-empty.  The list member\nof struct
  hid_input is at offset 0, so on an empty list list_entry()\nyields &hid->inputs
  itself and the following hidinput->input load reads\nan unrelated member of struct
  hid_device.  dev is then a type-confused\npointer, and force-feedback init writes
  through it: each\nset_bit(FF_*, dev->ffbit) stores 8 bytes at dev + 192, past the
  end of\nthe object dev actually aliases, and input_ff_create() adds further\nwrites
  of a heap pointer and two function pointers.\n\nUntil hid-universal-pidff the only
  caller was hid_pidff_init() from\nusbhid, which runs under HID_CLAIMED_INPUT and
  therefore always has at\nleast one hid_input.  universal_pidff_probe() starts the
  device with\nHID_CONNECT_DEFAULT & ~HID"
