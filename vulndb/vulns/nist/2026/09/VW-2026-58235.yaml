title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Fix UAF in selftest IOPF reporting\n\nIOMMUFD selftest TRIGGER_IOPF borrows an attach
  handle from\ngroup->pasid_array without synchronizing against PASID detach,\nthen
  a concurrent iommu_report_device_fault() can dereference\nthat borrowed handle's
  domain pointer after the detach erases\nthe handle and frees the backing struct
  iommufd_attach_handle.\nTRIGGER_IOPF then dereferences the freed handle, causing
  a UAF.\n\nFix by adding a iopf_rwsem in mock_dev to follow the expected design\n\
  of a real driver. Hold its read side across the whole\niommu_report_device_fault()
  call, and its write side around every\npath that attaches, detaches, or replaces
  a device domain.\nThis can block new reports and drains in-flight reports before
  an old\nattach handle or the IOPF fault parameter can be removed.\nAlso take the
  write side while registering a mock device, since\nit can invoke the mock driver's
  default-domain attach callback."
