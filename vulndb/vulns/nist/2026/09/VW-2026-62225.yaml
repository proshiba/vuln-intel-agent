title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetdevsim:
  update queue NAPI association on queue reset\n\nIn netdevsim, receive queues (struct
  nsim_rq) embed their own struct\nnapi_struct. When queue reset is performed (e.g.
  via queue_reset\ndebugfs), nsim_queue_start() swaps in a newly allocated struct
  nsim_rq,\nand nsim_queue_mem_free() later deletes and frees the old one.\n\nHowever,
  nsim_queue_start() failed to update the queue-to-NAPI mapping\nvia netif_queue_set_napi().
  As a result, dev->_rx[idx].napi continued to\npoint to the old NAPI struct. After
  the old queue was freed, a subsequent\nqueue dump via Netlink (NETDEV_CMD_QUEUE_GET)
  triggered a KASAN\nslab-use-after-free read in nla_put_napi_id() when accessing\n\
  rxq->napi->napi_id.\n\nFix this by calling netif_queue_set_napi() in nsim_queue_start()
  to\nassociate the new NAPI with the RX queue, and clear the association\nwith netif_queue_set_napi(...,
  NULL) in nsim_del_napi() during teardown."
