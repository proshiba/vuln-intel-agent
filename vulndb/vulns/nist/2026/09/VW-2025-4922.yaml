title: A weakness has been identified in TrippWasTaken PHP-Guitar-Shop up to 
  6ce0868889617c1975982aae6df8e49555d0d555. This vulnerability affects unknown 
  code of the file /product.php of the component Product Details Page. Executing
  manipulation of the argument ID can lead to sql injection. It is possible to 
  launch the attack remotely. The exploit has been made available to the public 
  and could be exploited. This product takes the approach of rolling releases to
  provide continious delivery. Therefore, version details for affected and 
  updated releases are not available. The vendor was contacted early about this 
  disclosure but did not respond in any way.
