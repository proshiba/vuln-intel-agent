title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid5:
  round bitmap stripes with sector division\n\nraid5_bitmap_sector_map() aligns the
  array range to full RAID5 stripe\nwidths before converting it to component sectors.
  That width is\nchunk_sectors multiplied by the number of data disks, and it is not\n\
  always a power of two.\n\nReproduce with a 4-disk RAID5, 1024-sector chunks, and
  three data disks.\nThe full-stripe width is 3072 sectors. For a one-sector write
  at array\nsector 3072, correct rounding gives array range [3072, 6144), which maps\n\
  to component range [1024, 2048). The old round_down()/round_up() logic\ninstead
  gives [1024, 4096), which maps to [0, 1024).\n\nUse sector_div() based arithmetic
  so the rounded range is aligned to the\nactual RAID5 stripe width.\n\nThe deterministic
  mapper test now reports the fixed component range as\n[1024, 2048), while the old
  mask-based range was [0, 1024)."
