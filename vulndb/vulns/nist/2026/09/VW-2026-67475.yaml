title: 'A flaw has been found in Trusted Domain Project OpenDMARC up to 1.4.2. Affected
  by this vulnerability is the function opendmarc_sp2_find_mailfrom_domain of the
  file libopendmarc/opendmarc_spf.c of the component SPF Macro Handler. This manipulation
  causes improper authentication. The attack is possible to be carried out remotely.
  The exploit has been published and may be used. Patch name: c48a74c758677fc5272a73eff15ffdbf8afda1a6.
  Applying a patch is the recommended action to fix this issue.'
