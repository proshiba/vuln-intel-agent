title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal:
  hwmon: Remove hwmon class device along with its parent\n\nThe current code creates
  one hwmon device per thermal zone type and that\ndevice is registered under the
  first thermal zone of the given type.\n\nThat turns out to be problematic when the
  thermal zone holding the\nhwmon device is removed.\n\nFor example, say that there
  are two ACPI thermal zones on a system\n\n /sys/devices/virtual/thermal/thermal_zone0/\n\
  \ /sys/devices/virtual/thermal/thermal_zone1/\n\nThe current code registers a hwmon
  class device for thermal_zone0 only:\n\n /sys/devices/virtual/thermal/thermal_zone0/hwmon0/\n\
  \nbecause the type is \"acpitz\" for both of them, but it adds a sysfs\nattribute
  that belongs to thermal_zone1 under it:\n\n /sys/devices/virtual/thermal/thermal_zone0/hwmon0/temp2_input\n\
  \nThere is also\n\n /sys/devices/virtual/thermal/thermal_zone0/hwmon0/temp1_input\n\
  \nwhich belongs to thermal_zone0.\n\nWhen thermal_zone0 is removed, say because
