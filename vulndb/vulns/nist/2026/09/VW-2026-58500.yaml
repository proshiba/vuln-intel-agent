title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4.1:
  fix layout segment leak on the pnfs_layout_process() forget path\n\nWhen the server
  returns a new layout stateid while a valid one is still\nheld, pnfs_layout_process()
  calls pnfs_mark_matching_lsegs_return() on\nthe on-stack free_me list and jumps
  to out_forget. Segments whose\nreference count drops to zero are unlinked from lo->plh_segs
  and moved\nto free_me by mark_lseg_invalid(); for an idle cached segment the layout\n\
  header holds the only reference, so this happens on the first decrement.\n\nout_forget
  never drains free_me -- only the success path calls\npnfs_free_lseg_list().\n\n\
  Commit 814b84971388 (\"pNFS/NFSv4: Fix a layout segment leak in\npnfs_layout_process()\"\
  ) added the drain; commit 08bd8dbe8882\n(\"pNFS/NFSv4: Try to return invalid layout
  in pnfs_layout_process()\")\nremoved it while switching the destination to lo->plh_return_segs,
  which\nis drained elsewhere. Commit fb700ef02676 (\"NFSv4.1: Simplify layout\nreturn"
