title: The Redux Framework plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the Media field filter values in versions up to, and 
  including, 4.5.13 This is due to insufficient input sanitization of nested 
  array values in the user_meta_save() function and unsafe output of filter CSS 
  values in the render() function without proper escaping. This makes it 
  possible for authenticated attackers, with subscriber-level access and above, 
  to inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page.
