title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cedrus: fix memory leak in cedrus_init_ctrls()\n\nIn cedrus_init_ctrls(), the V4L2
  control handler is initialized before\nallocating memory for ctx->ctrls. If this
  allocation fails, the function\nreturns -ENOMEM without freeing the previously allocated
  handler\nresources, leading to a memory leak.\n\nFix this by calling v4l2_ctrl_handler_free()
  on the ctx->ctrls allocation\nfailure path.\n\nThe bug was first flagged by an experimental
  analysis tool we are\ndeveloping for kernel memory-management bugs while analyzing\n\
  v6.13-rc1. The tool is still under development and is not yet publicly\navailable.
  Manual inspection confirms that the bug is still\npresent in v7.1.1.\n\nAn x86_64
  allyesconfig build showed no new warnings. As we do not have an\nAllwinner SoC or
  board with a Cedrus VPU available to test with, no\nruntime testing was able to
  be performed."
