title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix unit conversions in per_binval computation\n\nLOLLM noticed that we're doing
  the unit conversion in the per_binval\ncomputation backwards -- xfs_buf_inval_log_space's
  second parameter is\nsupposed to be in bytes, but max_binval is in units of fsblocks.\
  \  Hence\nthe conversion should be FSB -> B, not the other way around."
