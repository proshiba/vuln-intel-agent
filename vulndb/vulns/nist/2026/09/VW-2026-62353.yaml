title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Tear down scalable-mode context on probe failure\n\nintel_pasid_setup_sm_context()
  walks a PCI device’s DMA aliases via\npci_for_each_dma_alias() and programs a scalable-mode
  context entry for\neach RID. For a device with a dma_alias_mask, the callback is
  invoked\nonce for the device’s own RID and once for each alias bit, all with the\n\
  same pci_dev, so device_pasid_table_setup() runs for multiple RIDs.\n\npci_for_each_dma_alias()
  stops at the first callback error. Therefore, a\nfailure partway through the walk
  can leave context entries for already\nprocessed RIDs present and still pointing
  to the device’s PASID table.\n\nOn this error path, intel_iommu_probe_device() currently
  jumps directly\nto intel_pasid_free_table(), which frees the PASID table without\n\
  first tearing down those context entries. The IOMMU may then walk a\npresent context
  entry whose PASID table pointer references freed\nmemory.\n\nintel_iommu_release_dev"
