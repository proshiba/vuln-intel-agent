title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/features:
  Clamp Get Feature output size to the remaining buffer\n\ncxl_get_feature() reads
  a feature in a loop but passes a fixed size_out\nas the output capacity every iteration.
  On the last partial iteration\nthe buffer has less room left, so a device that returns
  more than asked\ncan overflow feat_out.\n\nUse the per-iter size data_to_rd_size,
  which already tracks the\nremaining room, as the output capacity."
