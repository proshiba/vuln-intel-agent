title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  packet: fix wrong transport_header when sending VLAN-tagged frame\n\nIn packet_parse_headers(),
  when processing a VLAN-tagged frame,\nskb_set_network_header() is called to advance
  network_header past the\nVLAN tag to the inner protocol header. skb_probe_transport_header()
  is\nthen called with skb->protocol still set to the outer VLAN EtherType\n(e.g.
  ETH_P_8021Q), while nhoff (derived from skb_network_offset())\nalready points past
  the VLAN tag to the inner protocol header.\n\nIn __skb_flow_dissect(), proto is
  initialized to ETH_P_8021Q and nhoff\npoints past the VLAN tag. When the dissector
  hits case ETH_P_8021Q, it\nreads a struct vlan_hdr at nhoff via __skb_header_pointer(),
  but that\noffset contains the inner protocol header (e.g. an IP header). The bytes\n\
  are misinterpreted as a VLAN header, yielding a garbage encapsulated\nEtherType
  that matches no known protocol. The dissector returns false,\nso skb_probe_transport_heade"
