title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/md-llbitmap:
  prevent create failure bitmap UAF\n\nllbitmap_create() publishes mddev->bitmap before
  reading the bitmap\nsuperblock. This is needed because llbitmap_read_sb() can initialize
  a\nnew bitmap and flush it through helpers that use mddev->bitmap.\n\nIf llbitmap_read_sb()
  fails, the old cleanup dropped bitmap_info.mutex\nand freed llbitmap before clearing
  mddev->bitmap. Readers such as\n/proc/mdstat rely on bitmap_info.mutex to keep the
  bitmap pointer stable\nwhile collecting bitmap stats, so they could observe the
  stale pointer\nafter the failed create path released the mutex.\n\nClear mddev->bitmap
  while still holding bitmap_info.mutex, then free the\nfailed llbitmap after dropping
  the mutex. This makes mutex-protected\nreaders see either a live bitmap or no bitmap."
