title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxhci:
  Prevent queuing new commands if xhci is inaccessible\n\nRefuse to queue a new command
  on the command ring if xHC is marked\ninaccessible with the HCD_FLAG_HW_ACCESSIBLE.\n\
  \nHCD_FLAG_HW_ACCESSIBLE is set and cleared in suspend and resume.\n\nAlso print
  a warning if xhci is being suspended with commands\nstill pending on the command
  ring."
