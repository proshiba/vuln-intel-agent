title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  initialize DRC hash table before registering shrinker\n\nshrinker_register() precedes
  the INIT_LIST_HEAD loop and the\ndrc_hashsize store. On weakly-ordered architectures
  (arm64, ppc),\na shrinker scan can observe drc_hashsize before the bucket list\n\
  heads are initialized, causing a NULL deref in the DRC shrinker\ncallback.\n\nMove
  bucket initialization and the drc_hashsize store before\nshrinker_register() so
  the hash table is fully initialized before\nit becomes visible to the shrinker."
