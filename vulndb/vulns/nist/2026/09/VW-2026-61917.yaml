title: The Choose User Role at Registration WordPress plugin before 1.3.3 does 
  not validate the role requested at registration against the roles an 
  administrator chose to offer, allowing unauthenticated users to request any 
  role, including administrator, and to be granted it once the request is 
  approved. Exploitation requires the Choose User Role at Registration WordPress
  plugin before 1.3.3's role selection feature and public account registration 
  to both be enabled.
