title: 'Vulnerability in the Oracle Agile Engineering Data Management product of Oracle
  Supply Chain (component: Engineering Communication Interface).   The supported version
  that is affected is 6.2.1. Easily exploitable vulnerability allows unauthenticated
  attacker with access to the physical communication segment attached to the hardware
  where the Oracle Agile Engineering Data Management executes to compromise Oracle
  Agile Engineering Data Management.  Successful attacks of this vulnerability can
  result in  unauthorized access to critical data or complete access to all Oracle
  Agile Engineering Data Management accessible data as well as  unauthorized update,
  insert or delete access to some of Oracle Agile Engineering Data Management accessible
  data. CVSS 3.1 Base Score 7.1 (Confidentiality and Integrity impacts).  CVSS Vector:
  (CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N).'
