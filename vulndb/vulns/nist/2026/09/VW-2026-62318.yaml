title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix max_qid race between configfs and controller allocation\n\nThe function nvmet_subsys_attr_qid_max_store()
  can race against\nnvmet_alloc_ctrl() when a subsystem's max_qid limit is modified.\n\
  \nSuppose max_qid is currently 64. If nvmet_alloc_ctrl() executes:\nctrl->sqs =
  kzalloc_objs(struct nvmet_sq *, subsys->max_qid + 1);\nand at this exact point,
  a userspace process changes max_qid to 128,\nnvmet_subsys_attr_qid_max_store() will
  set the new max_qid value. It\nattempts to delete active controllers to force a
  reconnect, but the\nnew controller won't be deleted because it hasn't been added
  to the\nsubsys->ctrls list yet.\n\nnvmet_alloc_ctrl() then proceeds and adds the
  new controller to the\nsubsys->ctrls list. Later, when nvmet_install_queue() is
  called, it\nwill see max_qid set to 128, but the memory allocated for sqs is only\n\
  sized for 64 entries. This results in a KASAN out-of-bounds warning\nand potential
  memory corrupti"
