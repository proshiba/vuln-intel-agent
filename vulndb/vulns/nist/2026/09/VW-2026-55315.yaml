title: A security issue was discovered in MongoDB where an authenticated user 
  with readWrite privileges could crash the mongod server process. By specifying
  a custom WiredTiger storage configuration option with an incompatible value 
  during collection creation, a user could cause a type confusion in the storage
  engine layer. When documents were subsequently read from the misconfigured 
  collection, the resulting mismatch in expected data format led to corrupted 
  memory interpretation and a server crash. The crafted collection configuration
  persists across restarts, requiring manual operator intervention to remediate.
