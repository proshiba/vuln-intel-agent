title: 'MDC is a tool to take regular Markdown and write documents interacting deeply
  with a Vue component. Prior to 0.22.1, @nuxtjs/mdc uses parseMarkdown with allowDangerousHtml
  enabled by default and relies on validateProps, validateProp, and unsafeLinkPrefix
  to remove executable URLs from untrusted Markdown. validateProp checks only attributes
  named href or src, allowing an SVG xlink:href value represented as xLinkHref to
  retain a javascript: URL that executes in the page origin when selected. The data:text/html
  denylist entries are also compared against url.protocol, which is only data:, so
  an iframe src containing data:text/html survives sanitization and executes in an
  opaque origin when loaded. Plain href javascript: URLs, srcdoc, object, script,
  and base elements are already blocked, making these two paths specific sibling gaps
  in the sanitizer. This issue is fixed in version 0.22.1.'
