title: MaxKB is an open-source AI assistant for enterprise. Prior to version 
  2.10.6-lts, the ToolExecutor LD_PRELOAD sandbox hooks execve, execvpe, and 
  execveat to prevent subprocess creation but does not hook fexecve. An 
  authenticated attacker able to execute tool code can call fexecve to start a 
  process outside the sandbox's intended subprocess policy. This issue is fixed 
  in version 2.10.6-lts.
