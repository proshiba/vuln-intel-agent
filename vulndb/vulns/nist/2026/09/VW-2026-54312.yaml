title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  use check_add_overflow for shader size+offset bound\n\nvmw_shader_define() validates
  the user-supplied shader window against\nits backing buffer with\n\n\t(u64)buffer->tbo.base.size
  < (u64)size + (u64)offset\n\ndrm_vmw_shader_create_arg::offset is __u64 in the uapi;
  when it is\nnear U64_MAX the unsigned addition wraps and the resulting tiny value\n\
  passes the check.  The unbounded offset is then stored in\nres->guest_memory_offset
  and forwarded to host SVGA shader-create\ncommands.\n\nUse check_add_overflow()
  to detect the wrap and compare the resulting\nendpoint against the buffer size."
