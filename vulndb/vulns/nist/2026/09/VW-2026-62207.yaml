title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  Fix the condition to enable over-io-uring\n\nThe existing condition in fuse_uring_cmd()
  is there only to avoid\ndisabling io-uring for connections that already run with
  it, missing\nwas a condition to refuse any IORING_OP_URING_CMD if the\nconnection/channel
  didn't get enabled because of missing FUSE_INIT\nreply flag FUSE_OVER_IO_URING.
  Without the reply flag the barrier in\nfuse_uring_ready() doesn't work and IO could
  already be going on and\ncause deadlock states (at a minimum one between fch->bg_lock
  and\nqueue->lock).\n\nThe change itself is trivial, but brings behavior change,\n\
  FUSE_OVER_IO_URING has to be set in the FUSE_INIT_REPLY by fuse servers\nto accept
  any IORING_OP_URING_CMD. Libfuse does that and the only\nnon-libfuse implementation
  I found (fractal-fuse) also does it.\nQemu patches for fuse-io-uring are not merged
  yet, as far as I know.\n\nMoved up is the smp_load_acquire(&fch->initialized) check,
  as a\nfuse-server"
