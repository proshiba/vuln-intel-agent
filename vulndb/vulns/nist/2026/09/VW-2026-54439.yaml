title: The SEO Flow by LupsOnline WordPress plugin before 3.0.3 does not 
  correctly validate the credential supplied with its API requests, allowing 
  unauthenticated users to be served as the administrator who configured the SEO
  Flow by LupsOnline WordPress plugin before 3.0.3 and take over the site. 
  Exploitation requires the SEO Flow by LupsOnline WordPress plugin before 3.0.3
  to have been configured, which is its normal operating state.
