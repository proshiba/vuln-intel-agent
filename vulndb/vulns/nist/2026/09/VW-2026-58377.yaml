title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  pfr_update: fix stack buffer overflow in query_capability()\n\nquery_capability()
  copies four ACPI buffer objects returned by the\nfirmware _DSM into fixed-size u8[16]
  fields in struct\npfru_update_cap_info using memcpy with the firmware-supplied length:\n\
  \n  memcpy(&cap_hdr->code_type,\n         elements[CAP_CODE_TYPE_IDX].buffer.pointer,\n\
  \         elements[CAP_CODE_TYPE_IDX].buffer.length);\n\nThe same pattern repeats
  for drv_type, platform_id, and oem_id.\nIf the firmware returns buffer.length >
  16 for any of these fields,\nmemcpy writes past the destination array.\n\nstruct
  pfru_update_cap_info is stack-allocated in pfru_ioctl().\n\nConfirmed with KASAN
  on 7.2-rc6: three stack-out-of-bounds reports\nare generated when a DSM returns
  64-byte buffers, with writes reaching\n44 bytes past the end of cap_hdr's [64, 156)
  frame window into\nadjacent stack redzones.\n\nIntroduce a helper pointer to out_obj->package.elements
  and use it\nto"
