title: "Eval injection in the JScript event-script dispatcher in Progressive Robot
  Ltd's hMailServer, versions 6.0.0 through 6.3.3 on Windows, allows a remote, unauthenticated
  attacker to run arbitrary JScript inside the hMailServer service process, with the
  privileges of the service account, via a password containing a backslash followed
  by an apostrophe, sent in any logon (SMTP AUTH, POP3, IMAP) that names an existing,
  active account. Exploitation requires a non-default configuration: event scripting
  enabled (off by default), the script language set to JScript (the default is VBScript),
  and an OnClientValidatePassword handler defined in the event script. The server
  wrote event values into the handler call as JScript string literals, escaping the
  apostrophe but not the backslash, so such a value closes the literal and the rest
  of it is parsed as script. The same flaw is reachable by a remote POP3 server through
  the message UID it returns, where an OnExternalAccountDownload handler is defined,"
