title: MOOS core-moos through 10.4.0 contains a buffer overflow vulnerability in
  CMOOSSerialPort::GetTelegram() that writes a NUL terminator one byte past the 
  serial telegram stack buffer. Attackers controlling the serial line can send a
  full-length telegram to trigger the off-by-one write, corrupting the stack and
  potentially enabling code execution.
