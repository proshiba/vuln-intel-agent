title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (gpio-fan) Fix use-after-free in alarm work\n\nfan_alarm_irq_handler() queues fan_data->alarm_work,
  but nothing\ncancels it.  fan_alarm_notify() dereferences fan_data and its hwmon\n\
  device.  On unbind, devres frees the interrupt, which only waits for\nthe handler
  itself, and then releases the hwmon device and fan_data,\nso a pending fan_alarm_notify()
  can run after those frees.\n\nReplace INIT_WORK() with devm_work_autocancel(), registered
  before\ndevm_request_irq().  The devres cleanup then frees the interrupt\nfirst,
  so no new work can be queued, and cancels the work while\nfan_data and the hwmon
  device are still alive.\n\nThis issue was found by an in-house static analysis tool."
