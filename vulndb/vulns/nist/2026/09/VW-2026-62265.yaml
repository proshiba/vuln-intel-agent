title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  bound smb_check_perm_dacl() ACE walks by DACL size\n\nsmb_check_perm_dacl() validates
  that the DACL fits inside the NT\nsecurity descriptor, but then bounds its two ACE
  walks by the\nremaining NTSD length (acl_size) rather than the DACL's declared\n\
  size (pdacl_size).\n\nWhen pdacl->size is smaller than the trailing NTSD buffer,
  bytes\nafter the declared DACL boundary - still inside the stored security\ndescriptor
  - are parsed as ACEs during access checks.  A crafted\nDACL can place an access-granting
  ACE beyond pdacl->size, and the\ncurrent code accepts it during SMB2_CREATE access
  validation, while\nparse_dacl() and smb_inherit_dacl() stop at pdacl_size.\n\nBound
  both ACE walks by pdacl_size to match the DACL boundary\nsemantics used elsewhere
  in the server.\n\nValidation:\n- semantic KUnit harness shows the post-boundary
  ACE is selected\n  before the fix and rejected (EACCES) after it\n- linux master
  (7.2-rc6), x86_64"
