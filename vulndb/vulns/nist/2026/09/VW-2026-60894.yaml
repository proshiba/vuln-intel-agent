title: Fireshare facilitates self-hosted media and link sharing. Prior to 
  version 1.6.16, two API endpoints that trigger outbound HTTP requests are 
  missing the @login_required decorator. An unauthenticated attacker can call 
  POST /api/test-discord-webhook or POST /api/test-webhook and cause the 
  Fireshare server to issue an arbitrary HTTP POST to any URL the attacker 
  supplies, including internal network addresses and cloud metadata services. No
  credentials, session cookies, or prior access are required. Version 1.6.16 
  contains a patch.
