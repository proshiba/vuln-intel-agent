title: A flaw was found in Dogtag PKI, as used by FreeIPA's certificate 
  authority component. The certificate profile import functionality does not 
  fully validate uploaded profile content beyond the profile ID. An 
  authenticated user with CA Administrator privileges can exploit Dogtag's 
  ExternalProcessConstraint mechanism to execute arbitrary commands with 
  attacker-controlled environment variables, achieving code execution as the 
  pkiuser account.
