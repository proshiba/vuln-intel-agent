title: A flaw was found in QEMU. The VAPIC setup hypercall in hw/i386/vapic.c 
  does not validate that the writable RAM alias remains within the option ROM 
  window. A privileged guest user on a Q35/KVM machine can position this alias 
  over locked SMRAM, bypassing chipset D_LCK protection and injecting code into 
  System Management Mode memory.
