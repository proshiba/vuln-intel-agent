title: VLC media player computes the size of a picture buffer with 32-bit 
  arithmetic and allocates from the wrapped result. In AllocatePicture in 
  src/misc/picture.c the running total is accumulated as i_bytes += p->i_pitch *
  p->i_lines, and both plane_t fields are declared int in include/vlc_picture.h,
  so the multiplication is evaluated at 32 bits and wraps before it is widened 
  to the size_t accumulator. The overflow check that precedes it divides in 
  64-bit arithmetic and therefore does not constrain the product, and the 
  subsequent comparison against PICTURE_SW_SIZE_MAX examines the already wrapped
  value, so both guards pass. aligned_alloc then reserves the small wrapped size
  while the decoder writes scanlines sized from the original dimensions. A 
  crafted PNG whose IHDR declares large width and height reaches this path 
  through the image demuxer, whose only size guard is on the input file's byte 
