title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  oc-tiny: switch to managed controller allocation\n\nThe controller is allocated
  with the non-managed spi_alloc_host() while\nthe interrupt is registered with devm_request_irq().\
  \  During removal,\nspi_bitbang_stop() only unregisters the controller; the subsequent\n\
  spi_controller_put() then frees the controller together with its\nembedded driver-private
  devdata, which is the IRQ handler's dev_id.  The\ndevm_request_irq() release action
  (free_irq()), which drains the\nhandler, does not run until after .remove() returns.\
  \  A late or latched\ninterrupt can therefore reach tiny_spi_irq() and dereference\n\
  already-freed memory (e.g. hw->base).\n\nSwitch to devm_spi_alloc_host() so that
  the devres LIFO order releases\nthe controller only after free_irq() has drained
  the handler, and drop\nthe now-redundant spi_controller_put() from .remove().  The
  probe error\npath is simplified to direct returns.\n\nThis issue was found by an
  in-house sta"
