title: "Paessler PRTG Network Monitor before version 26.2.120.1449 is affected by
  a reflected Cross-Site Scripting (XSS) vulnerability. When a request is made for
  a non-existent resource ending in \\\".htm\\\", the web interface returns an HTTP
  403 \\\"Forbidden Path\\\" error page that echoes the requested URL path into the
  HTML response body without proper output encoding or sanitization.\n\n\n\n\nAn unauthenticated,
  remote attacker can craft a URL containing an HTML/JavaScript payload in the path
  (e.g. https:////welcome.htm) and, once a victim with an active PRTG session opens
  the crafted link, execute arbitrary JavaScript in the security context of the PRTG
  web interface. Because the PRTG session cookie is not protected with the HttpOnly
  attribute, successful exploitation allows the attacker to read and exfiltrate the
  victim's session cookie, potentially leading to session hijacking."
