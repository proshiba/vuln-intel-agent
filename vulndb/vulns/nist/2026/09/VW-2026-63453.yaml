title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to 7.0.17 and 8.0.6, 
  src/flow-hash.c can treat an IPv4 and IPv6 flow as equal without comparing the
  IP family when their raw address words, ports, protocol, VLAN, recursion 
  level, live device, and hash bucket align. An IPv6 packet can therefore reuse 
  IPv4 flow state or the reverse, causing incorrect flowbit state, detection 
  bypass, or IP-only bypass. This issue is fixed in versions 8.0.6 and 7.0.17.
