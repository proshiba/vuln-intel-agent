title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  macb: destroy the phylink instance on the probe error path\n\nmacb_mii_init() creates
  a phylink instance on both of its success paths,\nbut the probe unwind frees the
  netdev without destroying it, so a failing\nmacb_alloc_tieoff() or register_netdev()
  leaks the instance.\n\nDestroy it at err_out_unregister_mdio, which is only reachable
  once\nmacb_mii_init() has succeeded, so bp->phylink is valid there."
