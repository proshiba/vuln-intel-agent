title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Validate BSG request_len before reading vendor_cmd[]\n\nThe FC BSG transport
  allocates job->request via memdup_user() using the\nexact user-supplied request_len.
  For FC_BSG_HST_VENDOR,\nfc_bsg_host_dispatch() only guarantees request_len covers
  msgcode and\nvendor_id; it does not account for the vendor_cmd[] flexible array.\n\
  \nqla2xxx then reads the command selector vendor_cmd[0] and, in several\nsub-handlers,
  vendor_cmd[1]/[2] or structures overlaid on the vendor\ncommand area without verifying
  request_len. A caller holding\nCAP_SYS_RAWIO can submit a short request whose vendor_id
  matches the\nhost, triggering out-of-bounds heap reads (KASAN-detectable, and able
  to\nmis-select a command or panic).\n\nAdd a central guard in qla2x00_process_vendor_specific()
  so the selector\nis always in bounds, restrict the early vendor_cmd[0] read in\n\
  qla24xx_bsg_request() to sufficiently long vendor messages, and add\nrequest_len
  check"
