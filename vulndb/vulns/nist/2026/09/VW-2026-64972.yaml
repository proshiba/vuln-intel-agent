title: "RunAdHocCommand.build_args() appends limit as bare\n              positional
  (args.append(limit)) instead of using\n              args.extend(['-l', limit])
  like RunJob. A limit beginning\n              with - is parsed as an ansible CLI
  option. Currently\n              limited to short-circuit flags (--version, --help)
  since\n              injected element displaces required pattern positional.\n \
  \             Would escalate if ansible-core ever defaults pattern."
