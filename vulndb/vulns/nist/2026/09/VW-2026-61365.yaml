title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  bsg: Fix TOCTOU in io_uring passthrough command setup\n\nscsi_bsg_uring_cmd() reads
  bsg_uring_cmd from the shared mmap'd SQE.\nUserspace can change a field after we
  check it and before we use it.\nrequest_len is the sharp case: it can grow past
  sizeof(scmd->cmnd) after\nthe bound check and overflow scmd->cmnd in copy_from_user().\n\
  \nREAD_ONCE() the SQE fields we check or use into locals before use."
