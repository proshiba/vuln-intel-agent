title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  clear PG_private_2 on copy-to-cache append failure\n\nnetfs_pgpriv2_copy_to_cache()
  marks the folio with PG_private_2 before\nnetfs_pgpriv2_copy_folio() appends it
  to the copy-to-cache rolling\nbuffer.\n\nIf the append fails, the folio is not queued
  for cache writeback, so\nthe PG_private_2 state and its reference must be released
  immediately."
