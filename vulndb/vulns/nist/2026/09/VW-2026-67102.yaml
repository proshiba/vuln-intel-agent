title: A security vulnerability has been detected in fuzui StudentInfo up to 
  fcc42a639ec7cef620651bfd0f07ebb660529e3f. The impacted element is an unknown 
  function of the file /StudentInfo/StudentHandler/moditypasswordstu of the 
  component Password Change Endpoint. Such manipulation of the argument sid/tid 
  leads to authorization bypass. The attack can be executed remotely. This 
  product implements a rolling release for ongoing delivery, which means version
  information for affected or updated releases is unavailable. The vendor was 
  contacted early about this disclosure but did not respond in any way.
