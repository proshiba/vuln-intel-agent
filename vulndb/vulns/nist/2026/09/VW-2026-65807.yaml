title: "Improperly Controlled Modification of Dynamically-Determined Object Attributes
  vulnerability in ash-project ash allows a user to set the value of a private action
  argument on the bulk destroy and bulk update paths.\n\nAction arguments declared
  with public?: false are meant to be set only by trusted server-side code (for example
  via Ash.Changeset.set_private_argument/3) and must not be settable from end-user
  input. CVE-2026-55736 fixed the non-bulk changeset path to strip private arguments
  from user-supplied parameter maps, but the bulk destroy and bulk update paths were
  not covered.\n\nAsh.Actions.Destroy.Bulk.base_changeset/5 and Ash.Actions.Update.Bulk.base_changeset/5
  match every key in the caller-supplied parameter map against all of the action's
  arguments with no public? check, then apply the matches to the base changeset. A
