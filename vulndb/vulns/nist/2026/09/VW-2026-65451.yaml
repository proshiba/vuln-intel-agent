title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  smbus: reject oversized block transfers in the common path\n\nThe SMBus block transfer
  length data->block[0] is validated in\ni2c_smbus_xfer_emulated() but that check
  runs too late for tracepoints\nand is skipped entirely when the adapter provides
  a native smbus_xfer\nimplementation. This allows user-controlled oversized block
  lengths to\nreach tracepoint memcpy calls and driver callbacks unchecked.\n\nAdd
  an early validation in __i2c_smbus_xfer() that rejects block\ntransfers whose caller-supplied
  length is zero or exceeds\nI2C_SMBUS_BLOCK_MAX before any tracepoint fires or driver
  callback\nruns. data->block[0] is filled in by the device on SMBus block reads,\n\
  so the check is scoped to operations where the length is actually\nsupplied by the
  caller. This is consistent with the existing -EINVAL\nconvention in the emulated
  path and protects all downstream consumers\nat once: the smbus_write tracepoint,
  all native smbus_xfer driv"
