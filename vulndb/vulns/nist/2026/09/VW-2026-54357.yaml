title: PassMark PerformanceTest before 11.1 build 1012, BurnInTest before 11.1 
  build 1000, and OSForensics before 11.1 build 1016 contain a privilege 
  escalation vulnerability in DirectIo64.sys that allows local users to clear 
  arbitrary bits at any physical memory address due to missing validation of the
  physical address parameter in an exposed IOCTL handler. Attackers can obtain a
  device handle and supply an arbitrary 64-bit physical address with a bit index
  to invoke MmMapIoSpace and clear bits in kernel code pages or page table 
  entries, enabling local privilege escalation or system compromise.
