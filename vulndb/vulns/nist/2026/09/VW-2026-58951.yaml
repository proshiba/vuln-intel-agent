title: A vulnerability has been found in GPAC up to f1219cde. Affected by this 
  issue is the function lsr_exec_command_list of the file laser/lsr_dec.c of the
  component MP4Box. The manipulation leads to reachable assertion. Local access 
  is required to approach this attack. The exploit has been disclosed to the 
  public and may be used. Upgrading to version abi-16.23 can resolve this issue.
  The identifier of the patch is afca1f1181668d85941d51ed1adf647807d5d975. The 
  affected component should be upgraded.
