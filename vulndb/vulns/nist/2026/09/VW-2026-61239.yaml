title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rc: sunxi-cir: Unregister rc device on probe failure\n\nAfter rc_register_device()
  succeeds, later probe failures must undo the\nregistration with rc_unregister_device().
  The current error path jumps to\nthe allocation cleanup label and only calls rc_free_device(),
  leaving the\nrc device registration and resources created by rc_register_device()\n\
  behind.\n\nAdd a registered-device unwind label for the IRQ lookup, IRQ request,
  and\nhardware initialization failure paths. Keep rc_free_device() for failures\n\
  before rc_register_device() succeeds."
