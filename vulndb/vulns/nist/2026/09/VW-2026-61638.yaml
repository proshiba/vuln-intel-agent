title: Stanza is a Stanford NLP Python library for tokenization, sentence 
  segmentation, NER, and parsing of many human languages. Prior to 1.14.0, 
  stanza.resources.common.unzip in stanza/resources/common.py passes downloaded 
  model and resource archives to zipfile.ZipFile.extractall without validating 
  member paths, and the vulnerable extraction path is reachable through 
  stanza.download and stanza.install_corenlp. A malicious archive containing 
  parent-directory traversal entries can write outside the intended model 
  directory, allowing files writable by the Stanza process to be overwritten and
  potentially enabling code execution through modified shell configuration, SSH 
  authorization data, Python packages, or executable scripts. This issue is 
  fixed in version 1.14.0.
