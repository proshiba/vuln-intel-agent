title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  mark a NULL call argument precise\n\ncheck_func_arg() allows bpf_register_is_null()
  for nullable arguments\nw/o marking the underlying scalar register precise. Hence
  a checkpoint\ncreated on such a path would prune against arbitrary scalar value.\n\
  \ncheck_helper_call() enforces second parameter of the\nbpf_get_local_storage()
  to be zero, w/o marking the underlying scalar\nregister precise. Hence a checkpoint
  created on such a path would\nprune against arbitrary scalar value.\n\nGrouping
  these two into one patch, as they share the same fixes tag."
