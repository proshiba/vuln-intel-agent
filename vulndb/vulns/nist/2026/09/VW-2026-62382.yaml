title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm_mpam:
  Disable driver unbind to avoid UAF\n\nWhen a user unbinds an MSC and that MSC is
  the only MSC left for a\ncomponent then the corresponding mpam_component will be
  freed. If the user\nthen goes on to read the schemata file in the resctrl filesystem
  then the\nmpam_component will be accessed from resctrl_arch_get_config() leading
  to a\nuse after free.\n\nAs the MPAM driver is not a module the unbind sysfs interface
  is the only\nway to trigger the remove. Instead of dealing with the complexity of\n\
  allowing some unused MSC to unbind just remove the unbind sysfs interface."
