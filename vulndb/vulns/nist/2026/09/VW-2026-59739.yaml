title: "The self-registration flow accepts user-supplied input for usernames without
  adequately preventing the disclosure of username existence. When a user attempts
  to register with an existing username, the system responds with an error message
  that explicitly indicates the username is already in use.\n\nThis behavior allows
  an attacker to discover valid usernames within the system. The discovery of valid
  usernames can facilitate subsequent attacks such as brute force, social engineering,
  and targeted phishing campaigns."
