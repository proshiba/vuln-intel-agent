title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  ljca: bound bank_num in ljca_enumerate_gpio()\n\nljca_enumerate_gpio() reads desc->bank_num
  from the device and loops\nvalid_pin[i] = get_unaligned_le32(...) for i < bank_num.
  valid_pin[]\nholds only LJCA_MAX_GPIO_NUM / 32 = 2 entries.\n\nTwo checks run before
  the loop. The reply length must match\nstruct_size(desc, bank_desc, bank_num). The
  product\npins_per_bank * bank_num must not exceed LJCA_MAX_GPIO_NUM. Neither one\n\
  bounds bank_num against the size of valid_pin[]. The reply is capped at\nLJCA_MAX_PAYLOAD_SIZE
  (60) bytes, so the struct_size check limits\nbank_num to 9. A device that reports
  bank_num 9 with pins_per_bank 7\nstill passes both checks. gpio_num is 63 and the
  reply is 56 bytes. The\nloop then writes nine u32 into the two entry array and overruns\n\
  valid_pin[] on the stack.\n\nA broken or malicious LJCA device can therefore overflow
  the stack.\nReject a bank_num that does not fit valid_pin[]."
