title: A weakness has been identified in mathurvishal CloudClassroom-PHP-Project
  up to 5dadec098bfbbf3300d60c3494db3fb95b66e7be. The impacted element is an 
  unknown function of the file loginlinkfaculty.php of the component Faculty 
  Authentication. Executing a manipulation of the argument fid/pass can lead to 
  sql injection. It is possible to launch the attack remotely. The exploit has 
  been made available to the public and could be used for attacks. This product 
  takes the approach of rolling releases to provide continious delivery. 
  Therefore, version details for affected and updated releases are not 
  available. The vendor was contacted early about this disclosure but did not 
  respond in any way.
