title: ClipBucket v5 before 5.5.3-#182 contains a blind SQL injection 
  vulnerability that allows authenticated users to extract arbitrary database 
  contents by submitting the msg_id parameter as an array to bypass the 
  clean_requests() sanitization function in ClipBucket.class.php. Attackers can 
  pass unsanitized array elements through the deletion handler in 
  private_message.php into cb_pm::delete_msg(), which interpolates the unescaped
  message ID directly into a SQL query string, enabling time-based blind SQL 
  injection to retrieve all user credential hashes and email addresses.
