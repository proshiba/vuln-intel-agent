title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-async: avoid deleting unlinked ASC entry on link error\n\nv4l2_async_match_notify()
  creates ancillary media links before adding\nasc->asc_subdev_entry to sd->asc_list.\n\
  \nIf ancillary link creation fails, the function jumps to\nerr_call_unbind while
  asc_subdev_entry has not been linked yet. Async\nconnections are zero-allocated,
  so the list entry still has NULL next\nand prev pointers on this path. Calling list_del()
  on it can therefore\ndereference NULL instead of returning the original link creation
  error.\n\nDo not delete asc_subdev_entry from err_call_unbind. There is no list\n\
  insertion to undo on this path; the bound callback and sub-device\nregistration
  are the operations that need to be rolled back."
