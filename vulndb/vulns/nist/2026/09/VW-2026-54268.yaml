title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  dts: renesas: ironhide: Describe inline ECC carveouts\n\nThe DBSC5 DRAM controller
  protects DRAM content using inline ECC.\nThe inline ECC utilizes areas of DRAM for
  its operation, which are\nin the DRAM address range, but must not be accessed or
  modified.\nDescribe the inline ECC carveout areas used by the DBSC5 controller\n\
  on this hardware as reserved-memory, which must not be accessed.\nInclude DRAM areas
  which are unprotected by ECC as well, those are\nparts of the DRAM which directly
  precede the ECC carveout.\n\nIn case of high DRAM utilization, unless the inline
  ECC carveouts\nare properly reserved, Linux may use and corrupt the memory used\n\
  by the DBSC5 DRAM controller for inline ECC, which would lead to\nthe system becoming
  unstable."
