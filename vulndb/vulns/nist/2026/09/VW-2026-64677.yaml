title: 'UTF8DataInputJsonParser._reportInvalidToken() in FasterXML jackson-core builds
  the offending-token text for its error message by appending Java identifier characters
  to a StringBuilder in a loop that has no upper bound. Unlike the three sibling parser
  implementations, including UTF8StreamJsonParser, it never consults ErrorReportConfiguration.getMaxErrorTokenLength()
  (default 256). A malformed token supplied to a parser created through JsonFactory.createParser(DataInput)
  is therefore accumulated in full. No StreamReadConstraints setting mitigates this:
  maxDocumentLength cannot be applied to DataInput sources at all, and maxStringLength
  does not cover this path because the accumulation bypasses ReadConstrainedTextBuffer.
  The reporter measured a 20,000,109-character exception message from a 20-million-character
  malformed token on the DataInput path, against 367 characters for identical input
  on the InputStream path. Scaling the payload drives the StringBuilder, which also
  incurs byte-to-c'
