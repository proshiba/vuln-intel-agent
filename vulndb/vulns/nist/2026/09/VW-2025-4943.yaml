title: A security vulnerability has been detected in UGREEN DH2100+ up to 
  5.3.0.251125. This impacts the function handler_file_backup_create of the file
  /v1/file/backup/create of the component nas_svr. The manipulation of the 
  argument path leads to command injection. The attack is possible to be carried
  out remotely. The exploit has been disclosed publicly and may be used. 
  Upgrading the affected component is advised.
