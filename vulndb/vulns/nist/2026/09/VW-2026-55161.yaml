title: It has been discovered that several AJAX routes used for the backend 
  localization wizard failed to perform authorization checks. This allowed 
  authenticated, low-privileged backend users to access information about 
  records and content elements that fall outside of their permitted range. 
  Exploiting this vulnerability requires a low-privileged backend user 
  account. This issue affects TYPO3 CMS versions 10.0.0-10.4.59, 11.0.0-11.5.53,
  12.0.0-12.4.48, 13.0.0-13.4.34 and 14.0.0-14.3.6.
