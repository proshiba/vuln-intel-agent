title: libp2p is a JavaScript implementation of the libp2p networking stack. 
  From 15.0.0 until 16.0.5, @libp2p/gossipsub uses the default StrictSign policy
  in packages/gossipsub/src/utils/buildRawMessage.ts, where validateToRawMessage
  verifies a signature with attacker-controlled msg.key but skips binding that 
  key to msg.from when the claimed author is an RSA peer ID that does not inline
  a public key. An unauthenticated attacker can place a victim RSA peer ID in 
  msg.from, sign the message with the attacker's private key, and supply the 
  attacker's public key in msg.key, causing the message to be accepted and 
  propagated as authored by the victim. Applications that trust message.from for
  validators, authorization, accounting, moderation, reputation, or audit 
  logging can process attacker-controlled data under false origin attribution. 
  The issue is fixed in version 16.0.5.
