title: Discourse is an open-source discussion platform. Prior to 2026.1.8, 
  2026.6.3, 2026.7.2, and 2026.8.0, authenticated users could supply unescaped 
  SQL LIKE metacharacters to upload-resolution patterns, causing wildcard input 
  to select unrelated upload records instead of matching a literal identifier. 
  The affected upload metadata, URL-lookup, and cooked-video-placeholder paths 
  could resolve uploads the user was not authorized to access. This allowed 
  disclosure of restricted metadata, including original filenames and 
  secure-upload paths, without modifying the upload records. This issue is fixed
  in versions 2026.1.8, 2026.6.3, 2026.7.2, and 2026.8.0.
