title: The Download Manager plugin for WordPress is vulnerable to Insecure 
  Direct Object Reference in versions up to, and including, 3.3.68 via the 
  duplicate() function hooked on admin_init. This is due to the handler only 
  verifying the generic 'edit_posts' capability and a plugin-wide static nonce 
  (NONCE_KEY) without any object-level authorization check against the targeted 
  wpdmpro package ID. This makes it possible for authenticated attackers, with 
  Author-level access and above, to duplicate arbitrary Download Manager 
  packages owned by other users (including administrators), which copies all 
  package metadata — including protected file references, role-based access 
  restrictions, and password lock settings — into an attacker-owned clone that 
  they can then edit to remove restrictions and download the previously 
  protected files.
