title: Flame through 2.4.0 contains an insufficient session expiration 
  vulnerability in the login endpoint that allows attackers with former admin 
  access to obtain tokens with arbitrary lifespans by supplying unvalidated 
  duration parameters. Attackers can mint near-permanent administrator tokens 
  that survive password changes, retaining full control of the dashboard since 
  tokens are verified only against a static JWT secret that is never rotated.
