title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  dapm: Fix off-by-one check on the second enum channel\n\nThe snd_soc_dapm_put_enum_double()
  rejects item[0] once it reaches\ne->items, but it lets item[1] be equal to it. \
  \ Both go on to\nsnd_soc_enum_item_to_val(), which indexes e->values with no bound
  of\nits own, so an enum with a value table reads one element past the end.\n\nThe
  indexing arrived with the MUX consolidation, which relaxed the\nitem[1] check in
  the same hunk.  The value MUX handler it deleted used\n>= there, and the snd_soc_put_enum_double()
  in soc-ops.c still does.\n\nOnly adav80x pairs a value table with two shifts, and
  its second\nchannel looks accidental, but the control does report two values.\n\
  Writing three into it reads off the end of adav80x_mux_values.  The\ncore catches
  that only under CONFIG_SND_CTL_INPUT_VALIDATION, which\ndefaults off."
