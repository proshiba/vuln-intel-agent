title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndebugfs:
  Fix lockdown check for mmap_prepare\n\nCommit 651fdda8406d (\"relay: update relay
  to use mmap_prepare\")\nchanged the `mmap` file operation to `mmap_prepare` for
  relayfs, but\nthe lockdown check in debugfs was not updated accordingly.\n\nThis
  prevents debugfs from being locked down when the kernel is in\nintegrity mode if
  a file uses `mmap_prepare` but not `mmap`.\n\nSince the conversion to `mmap_prepare`
  across the kernel is not yet\ncomplete, update the lockdown check to look for both
  `mmap` and\n`mmap_prepare` to ensure comprehensive coverage."
