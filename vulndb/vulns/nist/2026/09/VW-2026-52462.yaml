title: The Charitable – Donation & Fundraising Platform (Donation Forms, 
  Recurring Donations & Fundraising Campaigns) plugin for WordPress is 
  vulnerable to generic SQL Injection via 'order' Shortcode Attribute in all 
  versions up to, and including, 1.8.12.1 due to insufficient escaping on the 
  user supplied parameter and lack of sufficient preparation on the existing SQL
  query. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. The [charitable_donors] shortcode is accessible to 
  Contributor-level users via draft or pending post previews, providing an 
  authenticated but low-privileged entry point for exploitation.
