title: libconfini 1.16.4 contains a heap out-of-bounds write condition involving
  the bundled load_ini_buffer.h utility and strip_ini_cache(). The bundled 
  utility allocates exactly ini_length bytes, while strip_ini_cache() 
  unconditionally writes a NUL terminator at ini_source[ini_length], requiring 
  an additional writable byte. Applications using the bundled allocation pattern
  can trigger deterministic heap memory corruption when processing any non-empty
  INI input, resulting in denial of service.
