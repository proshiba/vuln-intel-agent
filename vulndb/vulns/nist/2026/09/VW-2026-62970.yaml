title: "Any authenticated user can lock or unlock files they do not own by targeting
  absolute WebDAV paths of other users. The DAV plugin resolves files from the absolute
  request URI without verifying that the path segment matches the authenticated session
  user. This enables:\n\nCross-user manual locks : attacker locks a victim's files,
  blocking writes (PUT/MOVE/DELETE, editor saves).\nLock-token disclosure: the app
  returns the lock token to unauthorized callers, enabling them to remove token-based
  locks (client locks) of other users."
