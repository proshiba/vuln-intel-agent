title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disallow interpreter fallback for BPF_ADDR_PERCPU insn\n\nThe BPF_MOV64_PERCPU_REG
  insn requires JIT to emit native code to for\n'dst_reg = src_reg + <percpu_base_off>'.\n\
  \nHowever, the interpreter ignores the 'off' at its ALU64_MOV_X label.\nThe 'off'
  indicates the insn is BPF_MOV64_PERCPU_REG insn. Then, when\nthe interpreter loads
  memory from the register, it will hit a page\nfault.\n\n[    2.545572] BUG: unable
  to handle page fault for address: ffffffffacaaf034\n[    2.546485] #PF: supervisor
  read access in kernel mode\n[    2.547167] #PF: error_code(0x0000) - not-present
  page\n[    2.547850] PGD 134e63067 P4D 134e63067 PUD 134e64063 PMD 10021c063 PTE
  800ffffeca550062\n[    2.548912] Oops: Oops: 0000 [#1] SMP PTI\n\nSet jit_required
  as true in order to disallow interpreter fallback in\ncore.c::__bpf_prog_select_runtime(),
  if any BPF_ADDR_PERCPU insn is\npatched to the prog.\n\nBTW, rename the helper bpf_map_supports_cpu_flags() "
