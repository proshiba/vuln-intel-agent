title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: fix MLD ID in MAC TXD and HIF TXP\n\nProblem:\nMCU command timeout
  while the firmware state is normal, and the\nfirmware keeps showing the error log
  \"ERROR!! NO PAUSE...\".\n\nRoot cause:\nIf the MLD_ID field in the TXD is neither
  the primary link id nor the\nsecondary link id, it may lead to a firmware busy loop
  when the third\nlink is in power saving mode.\n\nRemap frames directed to a third
  link to the primary link wcid. Since\nTX status events and txfree completions carry
  the wcid the firmware\nsaw, use the remapped wcid for packet id tracking and non-AQL
  packet\naccounting as well, while the frame keeps its original link context\nfor
  addressing, band and OMAC selection."
