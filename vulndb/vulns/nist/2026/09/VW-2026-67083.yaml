title: A vulnerability was found in Krayin laravel-crm up to 2.2.4. This affects
  an unknown function of the file 
  packages/Webkul/Installer/src/Http/Middleware/CanInstall.php of the component 
  admin-config-setup API Endpoint. The manipulation results in authorization 
  bypass. The attack may be launched remotely. The exploit has been made public 
  and could be used. Upgrading to version 2.2.5 mitigates this issue. The patch 
  is identified as 89f2916b6a46ff91bd1999ce38158fa0de8b9490. Upgrading the 
  affected component is recommended.
