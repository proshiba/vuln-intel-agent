title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix DM I2C teardown race\n\nDM I2C adapters can remain visible to userspace while
  DM teardown is\nalready in progress. A concurrent i2c-dev transfer may then enter\n\
  amdgpu_dm_i2c_xfer() after the backing DM state has been torn down,\nleading to
  a NULL pointer dereference.\n\nCreate a devres group around the DM I2C adapter lifetime
  and release it\nat the start of dm_hw_fini(), before HPD, IRQ, and DM state are
  torn\ndown. This removes the I2C adapters first and waits for in-flight users\n\
  to drain before the structures used by amdgpu_dm_i2c_xfer() disappear.\n\nThis fixes
  a teardown ordering race seen during device removal:\n\nBUG: kernel NULL pointer
  dereference\nRIP: amdgpu_dm_i2c_xfer+0x122/0x1c0 [amdgpu]\nCall Trace:\n__i2c_transfer\n\
  i2c_transfer\ni2cdev_ioctl_rdwr"
