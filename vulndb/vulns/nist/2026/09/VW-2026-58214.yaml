title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  hp-bioscfg: fix heap OOB read on empty password write\n\nvalidate_password_input()
  computes length = strlen(buf) and then\nchecks buf[length - 1] to strip a trailing
  newline, without checking\nthat length is nonzero first. Writing an empty string
  (a bare '\\n')\nto current_password or new_password gives length == 0, and\nbuf[length
  - 1] reads buf[-1], one byte before the heap allocation\nholding the copied input.\n\
  \nKASAN confirms this directly:\n\n  BUG: KASAN: slab-out-of-bounds in store_password_instance.constprop.0+0x223/0x2a0
  [hp_bioscfg]\n  Read of size 1 at addr ffff88811bd8da9f by task sh/13740\n  ...\n\
  \  store_password_instance.constprop.0+0x223/0x2a0 [hp_bioscfg]\n  current_password_store+0x14/0x20
  [hp_bioscfg]\n  ...\n  The buggy address is located 23 bytes to the right of\n \
  \ allocated 8-byte region [ffff88811bd8da80, ffff88811bd8da88)\n\nReproduced identically
