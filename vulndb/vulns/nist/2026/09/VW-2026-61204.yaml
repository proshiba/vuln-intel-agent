title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Quiesce response IRQ before freeing request queue\n\nqla2xxx_delete_qpair()
  deletes the request queue before the response\nqueue. qla25xx_delete_req_que() frees
  the request queue memory\n(kfree(req) in qla25xx_free_req_que()), but the response-queue
  MSI-X is\nonly released later, in qla25xx_free_rsp_que(). In that window the\nresponse
  interrupt can still fire, qla2xxx_msix_rsp_q() queues\nqpair->q_work, and qla_do_work()
  -> qla24xx_process_response_queue()\ndereferences the now-freed rsp->req (LOGINOUT/CT/ELS
  entries and the\nstatus path), a use-after-free.\n\nThe cancel_work_sync() added
