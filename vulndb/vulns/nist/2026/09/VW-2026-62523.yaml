title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-fc:
  unmap cmd_iu DMA on rsp_iu mapping failure in init_request\n\n__nvme_fc_init_request()
  maps cmd_iu and then rsp_iu for DMA. If the\nrsp_iu mapping fails, the original
  code only recorded the error and fell\nthrough: it left the already-mapped cmd_iu
  unmapped and still marked the\nop as FCPOP_STATE_IDLE before returning. Since blk-mq
  does not call\n.exit_request() when .init_request() fails, the cmd_iu mapping is
  leaked\nfor every op whose rsp_iu mapping fails.\n\nJump to an error path on rsp_iu
  mapping failure that unmaps cmd_iu and\nreturns the error without marking the op
  idle, so it stays in the\nFCPOP_STATE_UNINIT state set by the initial memset()."
