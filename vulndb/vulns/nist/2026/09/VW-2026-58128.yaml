title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntimekeeping:
  Check the return value of tk_get_aux_ts64 in __do_adjtimex()\n\nIf the auxiliary
  clock is disabled during tk_get_aux_ts64() but is enabled\nbefore tks->clock_valid
  is checked, then uninitialized stackdata will be\nused in the calculations and indirectly
  leaked to userspace.\n\nThe same race window also exists after this change and also
  for the core\ntimekeeper. But in these cases the only effect would be incorrect\n\
  adjustments and this is userspace's responsibility to avoid this."
