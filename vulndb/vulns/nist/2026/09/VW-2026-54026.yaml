title: GFI Exinda AI and ClearView before 7.6.5 contains an argument injection 
  vulnerability in the Tools Iperf Client functionality. The web_tools_cmd() 
  function constructs an iperf command using the server and options parameters 
  without sanitization, permitting injection of arbitrary iperf flags. An 
  authenticated attacker with Unprivileged (lowest-level) access can supply the 
  iperf -F flag to read an arbitrary file from the system and transmit its 
  contents to an attacker-controlled server.
