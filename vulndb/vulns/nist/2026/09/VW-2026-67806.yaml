title: "The `_nx_secure_x509_asn1_tlv_block_parse()` function parses ASN.1 TLV (tag-length-value)
  blocks out of DER-encoded data. It is the primitive underneath all X.509 certificate
  parsing in NetX Secure, and therefore runs on certificates supplied by a remote
  peer during the TLS handshake.\n\n\n\nThe function reads the one-byte ASN.1 tag
  from the caller's buffer *before* checking that the buffer holds at least one byte.
  When a caller passes a remaining length of zero, the guard correctly returns `NX_SECURE_X509_ASN1_LENGTH_TOO_LONG`,
  but the read has already happened one byte past the end of the buffer.\n\n\n\ncode:\n\
  \n\n\nnx_secure/src/nx_secure_x509_asn1_tlv_block_parse.c\n\n\n\n```\n\n\n\nUINT
