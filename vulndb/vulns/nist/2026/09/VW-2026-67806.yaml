  USHORT *tlv_type,\n\n                                          USHORT *tlv_tag_class,
  ULONG *tlv_length,\n                                          const UCHAR **tlv_data,
  ULONG *header_length)\n\n\n{\n\n\n\nUINT   current_index;\n\n\n\nUSHORT current_t"
