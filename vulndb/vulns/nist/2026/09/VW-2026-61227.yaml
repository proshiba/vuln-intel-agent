title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  video-i2c: fix kthread error pointer left in kthread_vid_cap on failure\n\nkthread_run()
  returns an ERR_PTR on failure, not NULL.\nWhen start_streaming() fails, data->kthread_vid_cap
  is left holding\nthis error pointer instead of being cleared.\n\nThis causes two
  subsequent bugs:\n1. A future call to start_streaming() sees a non-NULL kthread_vid_cap\n\
  \   and returns 0 (success) immediately, without actually starting the\n   capture
  thread.\n2. A call to stop_streaming() checks 'kthread_vid_cap == NULL' which\n\
  \   is false for an error pointer, and proceeds to call kthread_stop()\n   on the
  error pointer, leading to a kernel crash.\n\nFix this by resetting kthread_vid_cap
  to NULL on failure before\njumping to the error path."
