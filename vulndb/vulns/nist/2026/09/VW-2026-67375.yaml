title: Joomla Extension - ordasoft.com - Reflected Cross-Site Scripting in Real 
  Estate Manager (Free) < 6.7.9 -  The public property-detail page’s “leave a 
  review” form repopulates its title field directly from the request with no 
  escaping and no filtering function of any kind, unlike the adjacent comment 
  field on the same form, which at least receives partial tag-stripping. A " 
  character in the title query parameter breaks out of the HTML attribute the 
  value is placed in, allowing a following <script> element to execute in the 
  browser of anyone who loads the crafted link.
