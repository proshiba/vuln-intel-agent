title: "parse_write_op() in subsys/net/lib/lwm2m/lwm2m_message_handling.c handles
  inbound CoAP WRITE/CREATE requests that carry a Block1 option. For the first block
  of a transfer it called init_block_ctx() and then immediately stored the peer-selected
  block size with block_ctx->ctx.block_size = block_size before inspecting the return
  code. init_block_ctx() sets the caller's pointer to NULL and returns -ENOMEM when
  no entry of the static block1_contexts[] pool is free or timed out, so that store
  dereferences a NULL pointer.\n\nThe pool holds CONFIG_LWM2M_NUM_BLOCK1_CONTEXT entries
  (default 3) and an entry is only reclaimed once its transfer completes, fails, or
  ages past 30 seconds. A peer that reaches the client's LwM2M socket can therefore
  start three block-wise writes on three distinct object paths with the CoAP More
  bit set and leave them incomplete, then send the first block of a fourth write on
  a new path to reach the unguarded dereference. Reachability is gated only by the
  connected UDP so"
