title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma: Terminate all descriptors without callbacks\n\nThe DMA Engine client documentation
  says in the \"Terminate APIs\" section\nof Documentation/driver-api/dmaengine/client.rst:\n\
  \n\"No callback functions will be called for any incomplete transfers.\"\n\ndw-edma
  instead calls vchan_cookie_complete() when a deferred STOP reaches\nthe interrupt
  handler. This schedules a callback for the active descriptor\nand leaves other issued
  or submitted descriptors queued. A late callback\nafter dmaengine_terminate_sync()
  can dereference client state that has\nalready been freed, while leftover descriptors
  may later restart into\nreused buffers or leak.\n\nMove all issued and submitted
  descriptors to the terminated list whenever\ntermination completes. For a pending
  STOP, do this from both the DONE and\nABORT paths. Complete their cookies in order
  without scheduling callbacks.\n\nA STOP can remain pending until the running transfer
  raises"
