title: PostgreSQL Anonymizer contains a vulnerability that allows unprivileged 
  masked users to repeatedly call the anon.hash() function and collects (seed, 
  hash_output) pairs to perform an offline brute-force attack and deduce the 
  salt. A masked role can run a RESTRICTED function when the call is placed 
  inside the sub-select. The problem is resolved in PostgreSQL Anonymizer 3.2.3 
  and later versions
