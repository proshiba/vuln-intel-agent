title: "The nscd service in the GNU C Library 2.3.4 onwards may crash due to a \n\
  stack overflow when a malicious DNS server returns too large a response \nfor a
  DNS query, resulting in degraded DNS resolution for the system.\n\n\n\nExploitation
  of this bug needs a system that has nscd enabled and using \nan untrusted DNS server
  for name resolution, with the compromised DNS \nserver being capable of processing
  records large enough to result in a \nstack overflow in an nscd thread stack.  During
  experimentation, bind 9 \nwas unable to handle large records, but that could change
  in future or \nwith a different name server.  In typical installations, nscd is\
  \ \nexecuted in an isolated context as its own user without a shell, due to \nwhich
  any compromise of that service is isolated.\n\n\n\nThere is a remote possibility
  of nscd cache corruption if an attacker \nmanages to get the stack pointer into
  a desired point in the heap, \npotentially resulting in other caches in nscd being
  overwritten with \ncorrupt data through"
