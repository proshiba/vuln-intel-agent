title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  sensor-hub: Fix out-of-bounds write in sensor_hub_get_feature\n\nsensor_hub_get_feature()
  clamps its return value to the caller's buffer\nsize, but the copy loop still copies
  field->report_size / 8 bytes for\neach report value. A malicious HID descriptor
  can advertise a large\nfeature field size while an IIO caller supplies a small stack
  buffer,\nsuch as a single s32, causing an out-of-bounds write.\n\nHID core stores
  parsed report values in __s32 slots and clamps extracted\nvalues to 32 bits. Reject
  feature fields that require more than one slot\nper value, guard the total byte
  count calculation, and clamp each\nper-value copy to the remaining caller buffer."
