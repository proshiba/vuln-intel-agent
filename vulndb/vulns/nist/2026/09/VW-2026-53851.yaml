title: MOOS essential-moos through 10.0.1 contains an authentication bypass 
  vulnerability in pShare that accepts UDP datagrams from any source and 
  republishes them with the attacker-claimed identity intact. Attackers can send
  crafted UDP datagrams to pShare input routes to inject messages into the local
  MOOS community under spoofed identities, or send malformed datagrams to crash 
  the pShare process.
