title: Discourse is an open-source discussion platform. Prior to 2026.1.8, 
  2026.6.3, 2026.7.2, and 2026.8.0, the topic small-action and 
  nested-activity-log components interpolated the free-form action_code_who 
  value into mention-link href attributes without URL encoding. A quote-bearing 
  display name could terminate the intended URL attribute and inject 
  attacker-controlled elements into the trusted rendered markup. Although the 
  visible mention text was escaped, the unencoded path component allowed stored 
  HTML injection when another user viewed the affected topic action or activity 
  log. This issue is fixed in versions 2026.1.8, 2026.6.3, 2026.7.2, and 
  2026.8.0.
