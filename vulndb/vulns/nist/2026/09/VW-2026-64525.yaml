title: "Crypt::SelfCertificate versions from 1.01 through 1.05 for Perl contains malware
  which executes Python code from an obfuscated URL.\n\nThe generate_certificate runs
  a Python script saved as a certificate file.  The pyhton script attempts to retrieve
  code from a hardcoded http URL that is obfuscated with base64 encoding and run the
  response body directly.\n\nThe impact is that arbitrary code can be invoked as the
  user, without a dropped script being saved on the affected host.\n\nThe releases
  have no test scripts nor build hooks.  The intention may have been to trigger the
  payload after installation.\n\nFor version 1.01, the dropper script is in lib/Crypt/SelfCertificate/sample/validate.p12.\n\
  \nFor version 1.05, the dropper script is in lib/Crypt/SelfCertificate/sample/cert7.pem.\n\
  \nThe SHA-256 digests of the files are\n\n    fbff21f45ff748365062a5e36fb2d72558cad82a507a6f357f320b4fcdf07760
  Crypt-SelfCertificate-1.01.tar.gz\n    27b2d2d3174ad771474fff2521f5084ec231e9218ea8c832515aef1cbd5897bc
  lib/Crypt"
