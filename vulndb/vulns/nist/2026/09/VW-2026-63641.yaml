title: A vulnerability was detected in 0-Gaurav-0 nexus-mcp 
  aed0026e7ac1f23dc940e46e9fd3a2da6904f914. Affected by this issue is the 
  function child_process.exec of the file src/auth/browser.ts of the component 
  nexus_reauth MCP tool. The manipulation of the argument url results in command
  injection. The attack may be performed from remote. The exploit is now public 
  and may be used. This product utilizes a rolling release system for continuous
  delivery, and as such, version information for affected or updated releases is
  not disclosed. The project was informed of the problem early through an issue 
  report but has not responded yet.
