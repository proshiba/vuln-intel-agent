title: "An HTTP endpoint intended for provisioning enterprise and reseller organisations
  is reachable without any session. The authentication middleware is bound only to
  an explicit list of controllers, and the enterprise controller is not on that list,
  so no authentication runs for these routes.\n\nThe endpoint's only check is that
  the request body carries a token bearing a valid signature from the instance secret.
  It does not check what that token was issued for. Login tokens are signed with the
  same secret and carry no purpose, audience or expiry claim, so an ordinary user's
  own session token satisfies the check.\n\nPresented with such a token, the endpoint
  creates a new organisation holding the highest subscription tier, flagged as lifetime
  and with a channel allowance far above any sold plan, creates an organisation-owner
  account alongside it, and returns the new organisation's API key in the response
  body. That key is immediately valid against the public API."
