title: A vulnerability was found in OctoberCMS up to 4.1.19/4.2.25/4.3.4. The 
  impacted element is the function getSourcePathForResize of the file 
  modules/system/classes/ResizeImages.php. The manipulation of the argument 
  realSourcePath results in server-side request forgery. The attack may be 
  performed from remote. The exploit has been made public and could be used. 
  Upgrading to version 4.3.5 and 4.4.0 is sufficient to resolve this issue. The 
  patch is identified as 0e9736aa2c6d6bd3d60ff6ef9e0b4d32ce387f58. The affected 
  component should be upgraded.
