title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  cgroup: Fix storage null-ptr-deref after replacing prog\n\nSyzkaller reported a
  storage null-ptr-deref issue after replacing prog.\nThis occurs in the following
  scenario:\n1. prog A, an empty prog, is attached to a cgrp.\n2. prog B uses BPF_MAP_TYPE_PERCPU_CGROUP_STORAGE
  and calls the\n   bpf_get_local_storage helper.\n3. link_update is called to replace
  prog A with prog B.\n\nThe reason is that __cgroup_bpf_replace fails to alloc and
  assign the\nrequired cgrp storage for the incoming replacement prog. Consequently,\n\
  the new prog inherits an uninit storage, leading to null-ptr-deref panic\nwhen kick
  the new prog.\n\nFix this by rejecting a link update if new_prog's cgroup storage
  is\nincompatible with link->prog."
