title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  use the mount idmap for the owner check in f2fs_xattr_advise_set()\n\nf2fs_xattr_advise_set()
  calls inode_owner_or_capable() with &nop_mnt_idmap\nbefore allowing the \"system.advise\"\
  \ xattr to be set, instead of the idmap\nthat the VFS passes to the ->set() handler.\n\
  \nf2fs supports idmapped mounts, so on such a mount this checks the caller's\nfsuid
  against the unmapped on-disk owner rather than the mapped owner: the\nactual owner
  can be wrongly denied with -EPERM and an unrelated caller\nwrongly allowed.  Pass
  the handler's idmap instead."
