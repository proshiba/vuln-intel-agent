title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/features:
  Reject Set Features output buffer smaller than the header\n\ncxlctl_set_feature()
  sizes its output buffer from the user's\nfwctl_rpc.out_len but never checks it is
  large enough to hold even the\nfwctl_rpc_cxl_out header. With out_len == 0 , kvzalloc()
  returns\nZERO_SIZE_PTR, which passes the !rpc_out check, the subsequent\nrpc_out->size
  = 0 then writes through the poison pointer.\n\nReject requests whose output buffer
  can't hold the response header,\nbefore allocating. The Set Feature reply carries
  no payload, so the\nheader is all that is required."
