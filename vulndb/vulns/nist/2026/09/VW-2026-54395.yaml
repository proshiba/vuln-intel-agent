title: A flaw was found in Flatpak. A Time-of-check to time-of-use (TOCTOU) race
  condition exists in the `org.freedesktop.Flatpak.SystemHelper` component. This
  vulnerability occurs because a privileged `chmod` operation executes before 
  the OSTree repository validation within the `Deploy()` function. An attacker 
  can exploit this timing window to redirect symlinks to arbitrary files, 
  potentially leading to unauthorized file manipulation or information 
  disclosure.
