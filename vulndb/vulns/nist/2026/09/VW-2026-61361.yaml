title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsamples/damon/wsse:
  handle damon_start() failure\n\nPatch series \"samples/damon: handle damon_{start,stop}()
  failures\".\n\nAll DAMON sample modules are not correctly handling failures from\n\
  damon_start().  Among those, mtier also has an additional problem for\nhandling
  of damon_stop() failures.  wsse and prcl also have a problem in\ntheir damon_call()
  failure handling.  As a result, memory leaks, next\nDAMON operation disruptions,
  and use-after-free can happen.  Fix those.\n\nNote that only the damon_start() failure
  caused issues can reliably be\nreproduced.  Reproducing those issues require the
  admin permission,\nthough.\n\n\nThis patch (of 6):\n\ndamon_sample_wsse_start()
  callers assume it will clean up resources when\nit fails.  And the function does
  the cleanup for context buildup failures.\nHowever, it is not doing the cleanup
  for damon_start() failure.  As a\nresult, when damon_start() fails, it leaks the
  memory for DAMON context. "
