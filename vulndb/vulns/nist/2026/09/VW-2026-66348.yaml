title: A flaw was found in NetworkManager-iodine, the iodine VPN plugin for 
  NetworkManager. A local unprivileged user can exploit a vulnerability in how 
  the 'nameserver' setting is processed when establishing an iodine VPN 
  connection. By embedding shell metacharacters (special characters that can 
  execute commands) in the 'nameserver' value, an attacker can inject and 
  execute arbitrary commands. These commands run with root privileges before the
  application drops its elevated permissions, leading to local privilege 
  escalation.
