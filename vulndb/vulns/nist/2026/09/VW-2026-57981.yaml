title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a reflected cross-site scripting vulnerability in 
  plugin/Live/confirmLivePassword.php. The script interpolates the 
  unauthenticated GET parameter u (which is not covered by $securityFilter) 
  directly into an <img src="..."> attribute without URL- or HTML-encoding. A 
  remote attacker can craft a link containing a double-quote character in u 
  (with a non-empty key parameter and no valid c parameter) to close the src 
  attribute and inject an additional tag with an onerror handler, executing 
  arbitrary JavaScript in the site's origin in the browser of any user, 
  including an administrator, who opens the link. No patched version was 
  available at the time of the advisory.
