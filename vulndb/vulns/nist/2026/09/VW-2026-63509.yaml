title: "The Create plugin for WordPress is vulnerable to generic SQL Injection via
  the 'order' parameter in all versions up to, and including, 2.5.3 due to insufficient
  escaping on the user supplied parameter and lack of sufficient preparation on the
  existing SQL query. This makes it possible for authenticated attackers, with author-level
  access and above, to append additional SQL queries into already existing queries
  that can be used to extract sensitive information from the database. The vulnerable
  advanced-filter SQL branch is only entered when at least one of the following parameters
  is present in the request: linked_posts, created_after, created_before, missing_fields,
  post_id, a comma-separated type value, or exclude_type."
