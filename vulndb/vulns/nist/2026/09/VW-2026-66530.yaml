title: "OpenClaw (npm package 'openclaw') versions >= 2026.5.28 and < 2026.8.1 mishandle
  archive listings in the tar.bz2 skill installer: bounded command-output suffixes
  were treated as complete listings of the archive. A crafted .tar.bz2/.tbz2 skill
  archive can push prohibited entries out of both retained listings so that entry-count
  and size checks pass, and the archive is then extracted in full. If an operator
  approves installation of such a malicious or compromised skill archive, over-limit
  files or entry counts are persisted in the skill tools directory, consuming disk
  space or inodes. The issue bypasses OpenClaw's extraction budgets but does not by
  itself execute archive contents. Fixed in 2026.8.1."
