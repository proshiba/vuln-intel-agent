title: "In the Linux kernel, the following vulnerability has been resolved:\n\novl:
  fix double end_creating() on the casefold-mismatch path\n\novl_create_real() releases
  the new dentry twice when the casefold\nconsistency check fails.  The S_IFDIR branch
  calls end_creating() and\nsets err, then falls through to the common out: label
  which calls\nend_creating() on the same dentry again:\n\n\tcase S_IFDIR:\n\t\tnewdentry
  = ovl_do_mkdir(ofs, dir, newdentry, attr->mode);\n\t\terr = PTR_ERR_OR_ZERO(newdentry);\n\
  \t\tif (!err && ofs->casefold != ovl_dentry_casefolded(newdentry)) {\n\t\t\tpr_warn_ratelimited(...);\n\
  \t\t\tend_creating(newdentry);\t/* first */\n\t\t\terr = -EINVAL;\n\t\t}\n\t\tbreak;\n\
  \t...\n\tif (err)\n\t\tgoto out;\n\t...\n out:\n\tif (err) {\n\t\tend_creating(newdentry);\t
  /* second, same dentry */\n\t\treturn ERR_PTR(err);\n\t}\n\nend_creating() is end_dirop(),
  which does inode_unlock() on the parent\nand dput() on the dentry, so the parent
  directory's i_rwsem is unlocked\ntwice and the dentry is put twice.  The second
  unlock releases a lock\ntha"
