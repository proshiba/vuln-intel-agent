title: A weakness has been identified in chillzhuang SpringBlade up to 5.0.2. 
  This affects the function UserServiceImpl.userInfo of the file 
  blade-service/blade-system/src/main/java/org/springblade/system/service/impl/UserServiceImpl.java
  of the component user-auth-info Endpoint. This manipulation of the argument 
  userId causes authorization bypass. The attack can be initiated remotely. The 
  exploit has been made available to the public and could be used for attacks. 
  CVE-2026-56100 and CVE-2026-36765 are distinct issues. The vendor was 
  contacted early about this disclosure but did not respond in any way.
