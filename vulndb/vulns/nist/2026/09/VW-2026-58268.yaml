title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  drop a chunk if its transport was removed\n\nsctp_rcv() resolves the transport once
  per packet and leaves it in\nchunk->transport. The lookup reference, or the one
  sctp_add_backlog() takes\nif the socket is owned by userspace, keeps it around until
  the chunk has\nbeen processed.\n\nAn authenticated ASCONF DEL-IP can remove it in
  the meantime.\nsctp_assoc_rm_peer() takes the transport out of the association and
  calls\nsctp_transport_free(), which tags it dead and drops the reference the\nassociation
  held. There is a window on both paths: the packet can sit on\nthe socket backlog,
  and on the direct path the lookup completes before\nbh_lock_sock().\n\nThe DATA
  chunk in that packet puts the removed transport back into\nasoc->peer.last_data_from.
  Once the packet is done that reference goes\naway and the transport is freed by
  RCU, so the next delayed SACK carries\nthe pointer into the SACK chunk and sctp_outq_select_transport()
  reads "
