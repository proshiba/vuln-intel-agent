title: 'A vulnerability was determined in GPAC up to f1219cde. This vulnerability
  affects the function gf_node_changed_internal of the file scenegraph/base_scenegraph.c
  of the component MP4Box. This manipulation causes use after free. It is possible
  to initiate the attack remotely. The exploit has been publicly disclosed and may
  be utilized. Upgrading to version abi-16.23 is able to resolve this issue. Patch
  name: 9eb40df4448b88d6a6ce3454657c06f47eff0b24. Upgrading the affected component
  is recommended.'
