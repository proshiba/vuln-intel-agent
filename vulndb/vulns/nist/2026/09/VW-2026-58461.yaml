title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  gate nfs3 setacl by argp->mask\n\nnfsd3_proc_setacl() calls set_posix_acl() unconditionally
  for both\nACL_TYPE_ACCESS and ACL_TYPE_DEFAULT, passing argp->acl_access and\nargp->acl_default
  verbatim. The NFSv3 ACL decoder only populates\nthose pointers when the corresponding
  mask bit is set:\n\n    nfs3svc_decode_setaclargs()\n      if (args->mask & NFS_ACL)\
  \    decode into acl_access\n      if (args->mask & NFS_DFACL)  decode into acl_default\n\
  \      /* otherwise the pointer stays NULL (pc_argzero) */\n\n    nfsd3_proc_setacl()\n\
  \      set_posix_acl(.., ACL_TYPE_ACCESS,  argp->acl_access)\n      set_posix_acl(..,
  ACL_TYPE_DEFAULT, argp->acl_default)\n\nset_posix_acl(idmap, dentry, type, NULL)
