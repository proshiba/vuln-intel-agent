title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/nldev:
  validate dynamic counter attribute length\n\nRDMA_NLDEV_ATTR_STAT_HWCOUNTERS is
  a nested attribute whose children are\nconsumed directly with nla_get_u32(). The
  top-level policy validates only\nthe container, so it does not establish the fixed
  shape of each child.\n\nRequire every child payload to be exactly one u32 before
  reading it."
