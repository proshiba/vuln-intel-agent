title: A vulnerability was found in MSI Dragon Center up to 2.0.155.0. Affected 
  by this vulnerability is the function MmioWritePath in the library 
  NTIOLib_X64.sys of the component MMIO Write Path Handler. Performing a 
  manipulation of the argument count/elementSize results in integer overflow. 
  The attack requires a local approach. The exploit has been made public and 
  could be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
