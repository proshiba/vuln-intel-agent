title: "A DLL hijacking\nvulnerability exists in the GeoVision GV-Remote E-Map desktop\n\
  application. The application loads one or more dynamic-link libraries (DLLs)\nfrom
  an unsafe search path, allowing a local attacker to place a malicious DLL\nin a
  location searched before the legitimate library location. If\nsuccessfully exploited,
  an attacker with local write access to the affected\ndirectory could achieve arbitrary
  code execution in the security context of\nthe GV-Remote E-Map process."
