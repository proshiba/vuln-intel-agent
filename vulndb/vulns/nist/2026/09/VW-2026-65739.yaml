title: A security flaw has been discovered in jhen0409 react-native-debugger up 
  to 0.14.0. The impacted element is the function openDevTools of the file 
  electron/window.js of the component Open in Editor Handler. The manipulation 
  of the argument host results in os command injection. It is possible to launch
  the attack remotely. The exploit has been released to the public and may be 
  used for attacks. The vendor was contacted early about this disclosure but did
  not respond in any way.
