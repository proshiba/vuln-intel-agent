title: An uncontrolled recursion vulnerability in the Windows SIPA event log 
  parser of Google go-attestation versions up to and including 0.6.1 allows an 
  attacker to cause a denial of service (DoS). The 
  (*WinEvents).readELAMAggregation function recurses for every nested 
  elamAggregation sub-event without enforcing a maximum recursion depth limit, 
  while the size guard is bypassed on recursive execution paths. By submitting a
  crafted Windows event log containing deeply nested elamAggregation headers, an
  attacker can exhaust the goroutine call stack, triggering an unrecoverable 
  fatal runtime error (stack overflow) that immediately crashes the verifier 
  application.
