title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ti: vpe: quiesce overflow recovery before freeing streams\n\nThe VIP overflow recovery
  worker is armed from the hardirq handler when a\nFIFO overflow is detected, and
  the list-complete path looks the stream up\nthrough the VPDMA list private pointer.
  Both keep touching stream, port\nand device state; the recovery worker also resets
  the parser and VPDMA,\nrepopulates the descriptor list, and re-enables the per-list
  IRQs.\n\nvip_stop_streaming() masks and clears the per-list IRQs, but it neither\n\
  synchronizes the hardirq handler nor disables recovery_work. An overflow\nIRQ that
  has already queued recovery_work, or a list-complete IRQ in\nflight when the stream
  is torn down, can therefore still dereference the\nstream after its resources are
  released: the descriptor list is freed by\nvip_release_stream() on file release,
  and the stream itself by\nfree_stream() on unbind/remove.\n\nDrain the recovery
