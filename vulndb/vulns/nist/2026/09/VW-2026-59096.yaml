title: novel-plus through 5.3.3 contains an insecure default cache-management 
  password in the CacheController.refreshCache endpoint that allows anonymous 
  attackers to invalidate portal caches by supplying the hardcoded default value
  in the URL path. Attackers can trigger unauthorized cache invalidation by 
  accessing the cache/refresh endpoint with the known default password, forcing 
  unnecessary database queries to repopulate the cache.
