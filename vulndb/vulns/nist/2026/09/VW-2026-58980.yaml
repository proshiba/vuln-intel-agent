title: A weakness has been identified in 0x4m4 HexStrike AI up to 
  d689933ff579d839c676c82b231f8e98326c5f04. The affected element is the function
  subprocess.Popen of the file hexstrike_server.py of the component API Tools 
  Endpoint. Executing a manipulation of the argument 
  additional_args/target/username/password/scan_type/payload can lead to os 
  command injection. The attack can be launched remotely. The exploit has been 
  made available to the public and could be used for attacks. This product does 
  not use versioning. This is why information about affected and unaffected 
  releases are unavailable. A fix appears to be in progress.
