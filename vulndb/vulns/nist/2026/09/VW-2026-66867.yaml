title: Edgelesssys Contrast is a confidential-computing runtime for Kubernetes. 
  In versions 1.9.0 before 1.12.2, the initializer logs the full NewMeshCert 
  response — which contains the workload secret — to standard output at INFO 
  level. As a result, workload secrets are exposed to any Kubernetes user with 
  get or list permission on pods/logs. Because workload secrets are used for 
  encrypted storage and Vault integration, those must also be considered 
  compromised. This is a regression of GHSA-h5f8-crrq-4pw8.
