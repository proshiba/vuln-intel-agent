title: A weakness has been identified in Kamailio up to 
  5.8.8/6.0.7/6.1.4/6.2.0-dev1. The impacted element is the function shm_malloc 
  of the file src/modules/cdp/receiver.c of the component CDP Diameter Receiver.
  Executing a manipulation can lead to heap-based buffer overflow. It is 
  possible to launch the attack remotely. The exploit has been made available to
  the public and could be used for attacks. Upgrading to version 6.0.8 is 
  sufficient to resolve this issue. This patch is called 
  38711a3e788de0130d48cb485578c482b57d9351/4f62235b6f477b649c5cc18b0c81b4e26c949b98/4f62235b6f477b649c5cc18b0c81b4e26c949b98.
  You should upgrade the affected component.
