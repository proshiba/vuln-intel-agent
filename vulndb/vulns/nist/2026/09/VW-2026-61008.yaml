title: A vulnerability was found in vllm-project vLLM 0.26.0/0.27.0. Affected is
  the function 
  MoRIIOConnectorScheduler.request_finished/MoRIIOConnectorWorker.get_finished/MoRIIOWrapper._handle_release_message
  of the file 
  vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py of the
  component MoRIIO Acknowledgement Handler. Performing a manipulation of the 
  argument request_id/kv_transfer_params results in resource consumption. It is 
  possible to initiate the attack remotely. The project was informed of the 
  problem early through a pull request but has not reacted yet.
