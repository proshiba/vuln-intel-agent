title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  bound namelen in dlm_migrate_request_handler\n\nPatch series \"ocfs2/dlm: bound
  peer-controlled lengths in the o2dlm\".\n\nThe o2dlm receive handlers trust u8 length
  and count fields from the wire\nwithout bounding them, so a node in a DLM domain
  can corrupt or panic any\nother node with a malformed message.  Three defects:\n\
  \n  - dlm_migrate_request_handler() passes migrate->namelen unchecked to\n    dlm_init_mle(),
  which memcpy()s it into the 32-byte mname[] of an\n    o2dlm_mle slab object: a
  heap out-of-bounds write of up to ~215\n    attacker-controlled bytes.\n\n  - dlm_mig_lockres_handler()
  passes mres->lockname_len unchecked to\n    dlm_init_lockres(), which memcpy()s
  it into the 32-byte o2dlm_lockname\n    slab object: a heap out-of-bounds write
  of up to ~223 bytes.\n\n  - the same handler trusts mres->num_locks without checking
  that the\n    message is large enough to hold that many entries, so\n    dlm_process_recovery_d"
