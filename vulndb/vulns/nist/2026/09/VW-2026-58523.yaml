title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: uvc: fix dangling pointers in uvc_function_bind() and uvc_function_unbind()\n\
  \nIn uvc_function_bind() error path, we use usb_ep_free_request which\nuses uvc->control_req
  but does not set it to NULL afterwards. Thus,\nuvc->control_req is a dangling pointer
  causing a UAF. Also we do not set\nthe uvc->control_buf pointer to NULL after freeing
  it, which is another\ndangling pointer. Fix it by setting uvc->control_req to NULL
  after we run\nusb_ep_free_request() and uvc->control_buf to NULL after kfree. Do
  the\nsame for uvc_function_unbind()."
