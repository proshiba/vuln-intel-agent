title: A security vulnerability has been detected in samanhappy MCPHub up to 
  1.0.32. The impacted element is the function importTemplate of the file 
  src/services/templateService.ts of the component Template Import Endpoint. The
  manipulation leads to improper privilege management. Remote exploitation of 
  the attack is possible. The exploit has been disclosed publicly and may be 
  used. Upgrading to version 1.0.33 is sufficient to resolve this issue. The 
  identifier of the patch is 18a4467bc4ec6390b1f841d8a468a37e9922f837. It is 
  advisable to upgrade the affected component.
