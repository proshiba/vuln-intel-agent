title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphonet:
  pep: do not write beyond optlen in getsockopt\n\npep_getsockopt() clamps the reported
  length to the caller's buffer with\nmin_t(), but then stores the value with put_user(val,
  (int __user *)\noptval), which always writes sizeof(int) bytes. A getsockopt() call
  with\nan optlen smaller than sizeof(int) thus reports the clamped length yet\nwrites
  a full int, one to three bytes past the user buffer.\n\nWrite the value with copy_to_user()
  bounded by len, so at most optlen\nbytes are copied, matching the length reported
  back to userspace."
