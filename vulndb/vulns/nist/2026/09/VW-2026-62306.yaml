title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  scan: fix bus ID cleanup on device_add() failures\n\nWhen device_add() fails after
  acpi_device_set_name() has allocated an\ninstance ID and a new acpi_device_bus_id
  has been linked into\nacpi_bus_id_list, the rollback path only removes wakeup_list
  and\ndetaches the ACPI handle data.\n\nThat leaves the bus-ID bookkeeping behind
  and keeps the allocated\ninstance number consumed.\n\nMove the bus-ID cleanup and
  wakeup-list removal into a single helper.\n\nUse it from both the normal device
  teardown path and the device_add()\nrollback path. The wakeup list node is initialized
  before registration,\nso it can be deleted without checking whether the device is
  wakeup-\ncapable like in the original teardown path.\n\n[ rjw: Rename acpi_device_del_list()
  to acpi_device_cleanup() ]\n[ rjw: Subject and changelog edits ]"
