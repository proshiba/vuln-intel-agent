title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ipv6: Fix UDP length overflow with PMTU discover and big MTU\n\nThis commit bounds
  cork->base.fragsize to IP6_MAX_MTU for UDP sockets to\navoid a possible overflow
  of UDP length that triggers a WARN in\nudp_set_len_short when setsockopt IPV6_MTU_DISCOVER
  is set to\nIPV6_PMTUDISC_DO or IPV6_PMTUDISC_PROBE, and a large packet is sent over\n\
  a netdev with an unusually large MTU.\n\nSteps to reproduce (included in the new
  selftest):\n\n1. Set device MTU bigger than IP6_MAX_MTU. cork->base.fragsize will
  be\n   set to that MTU in ip6_setup_cork.\n2. Set IPV6_MTU_DISCOVER to IPV6_PMTUDISC_PROBE
  or IPV6_PMTUDISC_DO. It\n   lets maxnonfragsize be set to device MTU (cork->fragsize)
  in\n   __ip6_append_data, rather than to IP6_MAX_MTU.\n3. Send 65528 bytes of payload
  (+8 bytes of UDP header, +40 bytes of\n   IPv6 header). Device MTU allows it (it's
  only one byte bigger than\n   IP6_MAX_MTU, and the device MTU is bigger than that).\n\
  4. The UDP"
