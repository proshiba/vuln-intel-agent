title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  initialize _md in vxlan_xmit_one()\n\nIf a VXLAN device is configured with both
  VXLAN_F_COLLECT_METADATA and\nVXLAN_F_GBP, and a packet is transmitted through it
  using an external\nip_tunnel_info that lacks the IP_TUNNEL_VXLAN_OPT_BIT flag, md
  is left\npointing to the uninitialized _md stack variable:\n\n                if
  (test_bit(IP_TUNNEL_VXLAN_OPT_BIT, info->key.tun_flags)) {\n                   \
  \     if (info->options_len < sizeof(*md))\n                                goto
  drop;\n                        md = ip_tunnel_info_opts(info);\n               \
  \ }\n\nBecause IP_TUNNEL_VXLAN_OPT_BIT is not set, md is not updated and remains\n\
  pointing to _md. Later, vxlan_build_skb() is called with md, which\neventually calls
  vxlan_build_gbp_hdr():\n\n        if (vxflags & VXLAN_F_GBP)\n                vxlan_build_gbp_hdr(vxh,
  md);\n\nInside vxlan_build_gbp_hdr(), md->gbp is read:\n\n        if (!md->gbp)\n\
  \                return;\n        gb"
