title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mana: Reserve extra CQ slot for the fence completion CQE\n\nThe RX completion queue
  is sized to hold exactly one CQE per posted RX WQE.\nMANA_FENCE_RQ makes hardware
  post an additional CQE_RX_OBJECT_FENCE after\nthe packet CQEs. The current sizing
  reserves no extra slot for it and in\nrare cases, CQ has no guaranteed slot for
  the fence CQE when it is full of\npacket CQEs. This can lead to dropping the fence
  completion while the\ndriver waits holding RTNL lock throughout the timeout duration.\n\
  Reserve one extra CQE slot for CQE_RX_OBJECT_FENCE. mana_gd_alloc_memory()\nrequires
  queue_size to be a power-of-two and at least MANA_PAGE_SIZE;\nthe reservation pushes
  cq_size past a power-of-two, so round up the CQ size\nin mana_create_rxq()."
