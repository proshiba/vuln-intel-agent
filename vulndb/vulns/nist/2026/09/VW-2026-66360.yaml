title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2, this vulnerability breaks normal ticket isolation boundaries between
  agents. Any authenticated agent, even one with no active tickets assigned to 
  them, can view the titles, status, labels, and URL links of GitHub/GitLab 
  issues attached to any ticket in the system. This allows an internal user to 
  systematically view GitHub/GitLab issue data linked by other agents or 
  administrators across the organization by simply querying random or sequential
  ticket IDs. This vulnerability is fixed in 7.0.2.
