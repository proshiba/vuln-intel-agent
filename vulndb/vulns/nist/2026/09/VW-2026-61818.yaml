title: GoAdmin through 1.2.26 fails to properly anchor the logout pattern when 
  checking permissions, allowing authenticated users to bypass permission checks
  by appending a query parameter. Attackers can append a query string containing
  the admin prefix followed by /logout to reach administrative endpoints and 
  perform unauthorized actions including reading sensitive data and modifying 
  application state.
