  Solution for WordPress plugin for WordPress is vulnerable to Directory 
  Traversal in all versions up to, and including, 11.0.4 via the `user[name]` 
  Parameter. This makes it possible for unauthenticated attackers to read the 
  contents of arbitrary files on the server, which can contain sensitive 
  information. Exploitation requires "Embed images" option in AcyMailing 
  configuration being enabled.
