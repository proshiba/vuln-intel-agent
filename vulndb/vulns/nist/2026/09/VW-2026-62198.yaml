title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  honor XDP_TX_METADATA in zero-copy path\n\nThe zero-copy path reads TX metadata
  whenever the UMEM has metadata space,\neven if the descriptor does not set XDP_TX_METADATA.
  Pass descriptor\noptions through the metadata helpers and ignore metadata unless
  the option\nis set.\n\nThis does not fix the existing per-WQE metadata handling
  for mlx5 MPWQEs.\nOnly the descriptor that starts a session passes through\nxsk_tx_metadata_request()
  and configures offload state shared by the batch.\nMetadata on descriptors joining
  an open session is therefore not validated\nand does not configure its requested
  offloads. In addition, a non-NULL\nmetadata pointer from such a descriptor is treated
  as a timestamp\ncompletion request even when XDP_TXMD_FLAGS_TIMESTAMP is not set,
  so its\nmetadata union can be overwritten with an unrequested timestamp. Fixing\n\
  mixed metadata states within one MPWQE requires a separate change."
