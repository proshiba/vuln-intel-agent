title: The OCI delta stream parser read sizes as guint64 but passed them to GLib
  I/O and allocation functions expecting gsize (32 bits on 32-bit systems), 
  causing undersized allocations while subsequent operations use the original 
  64-bit size, leading to heap buffer overflows. An attacker controlling an OCI 
  registry can craft a delta stream that triggers this during flatpak 
  install/update, potentially achieving code execution on 32-bit systems.
