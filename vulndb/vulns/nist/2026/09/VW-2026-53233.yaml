title: reset_password.html parses query string parameters and uses the 'url' 
  parameter as a redirection target (window.location = url) after password 
  reset, optionally delayed by a 'delay' parameter. No validation or 
  allowlisting is performed on url, enabling an attacker to redirect users to an
  arbitrary external site after completion of the password-reset workflow.
