title: A vulnerability was determined in Netcore NBR100V2 1.3.240614.030928. 
  This affects the function uci.apply of the file 
  /usr/share/rpcd/acl.d/unauthenticated.json of the component ACL Handler. This 
  manipulation of the argument section causes missing authorization. It is 
  possible to initiate the attack remotely. The exploit has been publicly 
  disclosed and may be utilized. The vendor was contacted early about this 
  disclosure but did not respond in any way.
