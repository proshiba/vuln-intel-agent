title: A vulnerability was determined in krayin laravel-crm up to 2.2.5. This 
  affects an unknown part of the file 
  packages/Webkul/Admin/src/Http/Controllers/Settings/UserController.php of the 
  component User Management. Executing a manipulation of the argument role_id 
  can lead to improper privilege management. The attack can be executed 
  remotely. The exploit has been publicly disclosed and may be utilized. 
  Upgrading to version 2.2.6 is able to mitigate this issue. This patch is 
  called 5469d70336fbb25e8e513683e82b32982ce8aa82. Upgrading the affected 
  component is advised.
