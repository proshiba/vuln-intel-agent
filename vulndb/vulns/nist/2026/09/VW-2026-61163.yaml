title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  guard against NULL restore_mqd in CRIU queue restore\n\nBoth create_queue_cpsch()
  and create_queue_nocpsch() unconditionally\ncall mqd_mgr->restore_mqd() when a CRIU
  restore is in progress\n(qd != NULL), with no NULL guard. On any system where restore_mqd
  is\nnot implemented for the given queue type, a user holding\nCAP_CHECKPOINT_RESTORE
  can trigger a kernel NULL pointer dereference\nand panic the machine by issuing
  KFD_IOC_CRIU_OP_RESTORE with a\ncrafted queue restore object. Note that checkpoint_mqd
  is likewise\nunimplemented on GFX12, so no legitimate CRIU image can reach this\n\
  path — only a hand-crafted restore payload.\n\nAdd a NULL guard for restore_mqd
  immediately after mqd_mgr is\nresolved, unwinding via the existing error labels
  and returning\n-EOPNOTSUPP if the callback is not implemented. This mirrors the\n\
  existing checkpoint_mqd guard in checkpoint_mqd()."
