title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/ras:
  Fix cxl_rch_get_aer_info() out-of-bounds AER register read\n\ncxl_rch_get_aer_info()
  copies the RCH Downstream Port AER capability from\nthe RCRB MMIO block using a
  readl() loop bounded by sizeof(struct\naer_capability_regs). This struct is a software
  layout and its embedded\nstruct pcie_tlp_log is larger than the on-wire AER capability.
  As a\nresult the loop reads past the mapped AER register block.\n\nThe over-read
  also populates the software-only tail fields including\nheader_log.header_len. An
  out-of-range header_len passed to\npcie_print_tlp_log() can then loop past the header
  log buffer and cause\na second out-of-bounds read.\n\nThe read was correct when
  introduced, but struct pcie_tlp_log has since\ngrown (Header Log and TLP Prefix
  Log sizes, header_len and flit fields),\nso sizeof(struct aer_capability_regs) no
