title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: bound the device EEPROM address before the EFUSE copy\n\nmt7996_mcu_get_eeprom()
  derives the destination of the EFUSE/EXT block\ncopy from the address reported by
  the MCU response (event->addr, a\ndevice-controlled __le32) and clamps only the
  copy length, never the\ndestination offset into dev->mt76.eeprom.data. A malicious
  or\nmalfunctioning device can report an arbitrary address and drive an\nout-of-bounds
  write of up to MT7996_EXT_EEPROM_BLOCK_SIZE bytes past\neeprom.data.\n\nReject a
  response whose address would place the copy outside eeprom.data\nbefore deriving
  the destination pointer. Devices that echo the requested\nin-bounds offset are unaffected."
