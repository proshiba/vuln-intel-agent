title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a server-side request forgery vulnerability in the _json_decode 
  function that fetches remote URLs and local file paths without SSRF 
  validation. Unauthenticated attackers can POST file paths or HTTP URLs to 
  login.json.php to read local files or access internal services, with results 
  parsed as login credentials.
