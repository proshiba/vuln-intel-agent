title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  bound the free-cluster bitmap scan to the volume\n\nvol->lcn_empty_bits_per_page
  is sized from vol->nr_clusters at mount, but\nntfs_cluster_alloc() bounds its scan
  of that array by the size of $Bitmap.\nThose are independent on-disk quantities
  and the mount-time check only\nrejects a $Bitmap that is too small, so an image
  whose $Bitmap covers more\nclusters than the volume has lets the scan index past
  the array.  A run\nwhose LCN lies in that gap takes the allocator straight there,
  since the\ncaller passes the file's own last LCN as its locality hint.  KASAN reports\n\
  a slab out-of-bounds read when a file on such a volume is extended.\n\nClamp the
  scan to what that array covers, mirroring the max_index\ncalculation the mount-time
  scan already uses, and reject a decoded LCN\nat or beyond nr_clusters in the mapping
  pairs decoder.  Conforming\nvolumes are unaffected."
