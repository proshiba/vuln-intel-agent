title: Hugo versions from v0.161.0 through v0.165.0 run Node.js tools 
  (css.PostCSS, css.TailwindCSS, js.Babel) under the Node.js permission model to
  restrict file system reads to the project directory and configured mounts. 
  Because the Node.js permission model validates only the lexical path and 
  follows symbolic links that point outside the allowed set, Hugo did not detect
  symlinks escaping the sandbox. An attacker who can contribute content to a 
  Hugo project (for example via a pull request) can commit a symlink such as 
  assets/css/x.css -> /etc/passwd together with a PostCSS plugin that reads it, 
  allowing any file readable by the Hugo build process to be disclosed and 
  potentially embedded in the published site. This affects builds using the 
  default security configuration; projects that do not invoke Node.js tools are 
  unaffected. Fixed in v0.166.0, which scans allowed paths and fails the build 
  when a symbolic link resolves outside them.
