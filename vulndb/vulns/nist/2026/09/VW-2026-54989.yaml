title: SAP S/4HANA Finance (Advanced Payment Management) does not perform 
  sufficient Cross-Site Request Forgery protection on certain requests, due to 
  this an attacker with low privileges could craft a malicious link or page. If 
  an authenticated victim interacts with it, unintended actions could be 
  triggered on the web server on their behalf. This results in a low impact on 
  confidentiality and integrity. There is no impact on availability.
