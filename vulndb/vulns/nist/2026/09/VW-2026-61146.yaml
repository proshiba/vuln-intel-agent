title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  clear VM_MAYWRITE on read-only ublk char device mmap\n\nublk_ch_mmap() rejects mmap
  requests with VM_WRITE set, but never\nclears VM_MAYWRITE on the resulting read-only
  mapping. This allows\na userspace daemon to mmap the per-queue command buffer PROT_READ,\n\
  then upgrade it to PROT_WRITE via mprotect(), since VM_MAYWRITE was\nnever cleared.\n\
  \nThe command buffer holds struct ublksrv_io_desc entries that are\nkernel-written
  ABI; a writable mapping lets an unprivileged daemon\nprocess corrupt fields such
  as addr, op_flags, nr_sectors, and\nstart_sector.\n\nSame bug class as the drm/panthor
  and drm/vc4 VM_MAYWRITE fixes, and\nthe 2026-08-13 ptp/vmclock fix (a5edadbae57e).\n\
  \nVerified via mprotect() PoC: before the fix, a PROT_READ mapping can\nbe upgraded
  to PROT_READ|PROT_WRITE and a write into the command\nbuffer corrupts io_desc fields
  (confirmed under KASAN). After the\nfix, mprotect() returns -EACCES."
