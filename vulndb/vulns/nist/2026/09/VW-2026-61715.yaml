title: 'Wire provides gRPC and protocol buffers for Android, Kotlin, Swift, and Java.
  Prior to 6.4.5 and 7.0.0-alpha04, Wire protobuf readers do not consistently validate
  attacker-controlled lengths against the current logical message boundary before
  advancing cursors, pointers, limits, slices, or allocations. In Kotlin, ProtoAdapter.decode(ByteArray)
  and ProtoAdapter.decode(ByteString) use ByteArrayProtoReader32.internalNextLengthDelimited(),
  where a positive oversized length can wrap pos + length to a negative limit and
  escape the existing negative-length check. Related ProtoReader, ReadBuffer.readVarint(),
  ReadBuffer.verifyAdditional(count:), packed-repeated, nested-message, and ProtoDecoder.decodeSizeDelimited(_:from:)
  paths can cross logical boundaries, perform pointer arithmetic, reserve capacity,
  or convert an unrepresentable size before proving the requested bytes exist. An
