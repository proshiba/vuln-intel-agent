title: Wallos is an open-source, self-hostable personal subscription tracker. 
  Prior to version 5.0.0, Wallos allows authenticated users to inject arbitrary 
  iCalendar properties and events into their exported .ics feed by embedding raw
  CRLF sequences in subscription names or notes. Because the input validation 
  layer only encodes HTML metacharacters but never strips newlines, and the 
  export layer decodes those entities back before writing iCal output, an 
  attacker with any valid account can craft a subscription whose name breaks out
  of the current VEVENT block and inserts fully attacker-controlled calendar 
  events — including spoofed organizers, arbitrary email addresses in ATTENDEE 
  properties, and misleading event content — into any calendar application 
  subscribed to that feed. This issue has been patched in version 5.0.0.
