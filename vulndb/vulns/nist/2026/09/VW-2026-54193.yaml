title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: ensure tx headroom in usb_sdio_tx_prepare_skb\n\nmt7925_usb_sdio_tx_prepare_skb()
  pushes a TX descriptor and a USB\nheader onto every skb and assumes the headroom
  for them is already\nthere. That holds for locally generated traffic, where mac80211\n\
  reserves hw->extra_tx_headroom, but forwarded frames are sent through\nieee80211_8023_xmit(),
  which does not reserve it. Bridge a wired\ninterface to an mt7925u AP and the first
  forwarded frame that arrives\nshort panics the kernel:\n\n skbuff: skb_under_panic:
  len:415 put:4 tail:0x19b end:0x640 dev:wlan1\n kernel BUG at net/core/skbuff.c:212!\n\
  \ Call trace:\n  skb_panic+0x58/0x60 (P)\n  skb_push+0x58/0x60\n  mt7925_usb_sdio_tx_prepare_skb+0xf8/0x1b8
  [mt7925_common]\n  mt76u_tx_queue_skb+0xa0/0x1f8 [mt76_usb]\n  __mt76_tx_queue_skb+0x54/0xe8
  [mt76]\n  mt76_txq_schedule.part.0+0x204/0x478 [mt76]\n  mt76_txq_schedule_all+0x50/0x80
  [mt76]\n  mt792x_tx_worker+0x68/0x100 [mt792x_"
