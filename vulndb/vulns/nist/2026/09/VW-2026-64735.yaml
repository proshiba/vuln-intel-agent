title: The Getwid – Gutenberg Blocks plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting via the Google Maps block's 'customStyle' 
  attribute in all versions up to, and including, 2.1.3. This is due to the use 
  of eval() on user-controlled block content in the frontend JavaScript 
  mapStyles() function.  This makes it possible for authenticated attackers, 
  with Contributor-level access and above, to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page.
