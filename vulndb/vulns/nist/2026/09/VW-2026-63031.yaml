title: The Booking Calendar plugin for WordPress is vulnerable to Reflected 
  Cross-Site Scripting via the 'options' parameter in all versions up to, and 
  including, 11.8.2 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that execute if they can successfully trick a user into 
  performing an action such as clicking on a link. The nonce check is bypassed 
  by default because the 'booking_is_nonce_at_front_end' option ships disabled, 
  allowing unauthenticated requests to reach the vulnerable sink without any 
  verification.
