title: Incorrect Access Control in the HTTP API module in ZLMediaKit commit 
  9fd5152 allows remote attackers to achieve Remote Code Execution (RCE) via 
  unauthenticated access to the setServerConfig API endpoint, which permits 
  overwriting the ffmpeg.snap configuration parameter with arbitrary shell 
  commands. These commands are subsequently executed through the getSnap API 
  endpoint with the privileges of the ZLMediaKit process.
