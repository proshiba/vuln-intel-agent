title: "Affected versions of MISP inconsistently enforced email-address visibility
  in DashboardsController::listTemplates().\n\n\nThe query always fetched User.email,
  while redaction happened only inside the non-REST rendering branch. As a result,
  the same authenticated user who saw redacted data in the normal HTML interface could
  request the REST/JSON representation and receive template owners’ email addresses
  without the intended privilege check.\n\n\nThe fix moves the decision to a centralized
  User::canSeeEmails() authorization helper. Email addresses are now fetched only
  when the requester is a site administrator or the instance explicitly enables Security.disclose_user_emails.
  The same helper is also reused by other dashboard widgets to keep email-disclosure
  policy consistent.\n\nVersion affected: ≤2.5.45"
