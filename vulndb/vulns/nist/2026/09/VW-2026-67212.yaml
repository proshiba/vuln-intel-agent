title: "Inconsistent Interpretation of HTTP Requests ('HTTP Request/Response Smuggling')
  vulnerability in elixir-mint mint allows a malicious HTTP/1 server to desynchronize
  an intermediary and the Mint client on a pooled connection, poisoning the responses
  to subsequent requests that share the connection.\n\nmessage_body/1 in lib/mint/http1.ex
  selects chunked framing when chunked is the first coding listed in a response's
  Transfer-Encoding fields. RFC 9112 section 6.3 applies chunked framing only when
  chunked is the final coding, and otherwise reads the body until the server closes
  the connection. For a response such as Transfer-Encoding: chunked, gzip, an intermediary
  that follows the RFC treats every byte up to the close as the body, while Mint ends
  the body at the zero-length chunk and parses the remaining bytes as the response
  to the next request on the connection.\n\nMint also keeps the connection open after
  an HTTP/1.0 response, final or 1xx, that carries Transfer-Encoding and Connection:
  ke"
