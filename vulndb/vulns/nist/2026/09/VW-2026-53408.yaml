title: "Description\n\n\nNGINX JavaScript (njs) has a vulnerability in the XML module's
  namespace prefix list parser, reachable through the xml.exclusiveC14n() method.
  An unauthenticated remote attacker can trigger it when an affected NGINX configuration
  passes an externally controlled XML namespace prefix list to that method. Both the
  njs and the QuickJS (qjs) engines are affected. A crafted prefix list causes an
  out-of-bounds write past the end of a heap allocation. With the njs engine, which
  is the engine used when the js_engine directive is absent, this corrupts adjacent
  objects and crashes the NGINX worker. With the QuickJS engine, the same call additionally
  leaks the prefix list on every invocation, causing worker memory to grow across
  requests. The official nginxinc/nginx-saml reference implementation is affected
  during SAML signature verification. It reads InclusiveNamespaces/@PrefixList from
  an untrusted SAML message and passes it to xml.exclusiveC14n() before the signature
  has been veri"
