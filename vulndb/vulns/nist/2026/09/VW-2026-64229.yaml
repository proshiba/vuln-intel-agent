title: MarketKing plugin for WordPress before 2.1.72 contains a missing 
  authorization vulnerability in the marketking_send_refund AJAX action that 
  allows authenticated attackers with subscriber-level access or higher to 
  create refund requests against any order by supplying an arbitrary order ID. 
  Attackers can submit crafted AJAX requests targeting any order ID to create 
  fraudulent refund requests against orders they did not place, enabling 
  marketplace disruption and unauthorized interference with other users' orders.
