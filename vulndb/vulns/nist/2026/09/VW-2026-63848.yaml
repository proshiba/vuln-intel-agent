title: A vulnerability was found in CRI-O related to the container checkpoint 
  and restore feature. When CRI-O is configured to restore containers from 
  checkpoint archives, insufficient validation of restore metadata may allow a 
  user with sufficient privileges to perform unintended operations on the host 
  filesystem. Successful exploitation requires that container checkpoint and 
  restore functionality is enabled, which is not the default configuration. An 
  attacker must also be able to trigger restoration of a container from 
  untrusted checkpoint content.
