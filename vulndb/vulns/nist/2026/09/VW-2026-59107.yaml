title: TripleLift's ad rendering script (video-bundle.js) contains a DOM-based 
  cross-site scripting vulnerability that allows unauthenticated attackers to 
  execute arbitrary JavaScript in a publisher's domain by sending crafted 
  postMessage payloads without origin validation. Attackers can cause a victim 
  to visit an attacker-controlled page that sends malicious postMessage events 
  to a publisher page running the ad script, enabling session hijacking and 
  unauthorized DOM manipulation.
