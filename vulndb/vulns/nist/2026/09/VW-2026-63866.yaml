title: github.com/temporalio/ringpop-go enforces configured LabelOptions limits 
  when an application changes the local node's labels, but affected versions do 
  not apply those limits to label maps received in SWIM membership changes. A 
  network peer that can reach a live Ringpop TChannel listener can repeatedly 
  submit changes for distinct member addresses containing label keys, values, or
  counts that exceed the receiver's configured limits. Accepted labels are 
  retained in the member list and disseminated to peers, allowing memory and 
  gossip-bandwidth consumption to exceed configured bounds and potentially 
  making the hosting process unavailable. The fix validates peer-supplied label 
  maps before they are retained or disseminated. Availability only; no 
  confidentiality or integrity impact was identified.
