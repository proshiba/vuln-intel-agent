title: "vm2 versions 3.11.3 through 3.11.6 expose Node.js's host node:sqlite module
  to code running in NodeVM when that builtin is permitted, either explicitly or through
  builtin: ['*']. The module is wrapped with vm.readonly(), which prevents property
  assignment but leaves host-authority callables reachable; in addition, the resolver
  treats any request starting with 'node:' as a core-module request and the runtime
  strips only one 'node:' prefix, so a sandbox request for 'node:node:sqlite' resolves
  to the configured node:sqlite entry. Sandboxed code can therefore create an in-memory
  DatabaseSync with extension loading enabled and call DatabaseSync.loadExtension()
  on a native library bundled in the untrusted plugin package (path derived from __dirname).
  SQLite loads the library into the Node.js host process and invokes its native entry
  point, giving the sandboxed plugin arbitrary native code execution outside the sandbox
  with the host process's privileges. The issue is fixed in vm2 3.11.7."
