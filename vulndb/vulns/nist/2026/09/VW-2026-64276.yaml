title: "The findOrgImage method in MISP's OrgImgHelper constructs a filesystem path
  by concatenating a user-supplied organization identifier with a fixed image directory
  and a file extension, then calls file_exists() on the resulting path. The organization
  name field is attacker-controllable through event import, which sets Org.name. Because
  no validation was performed on the field value before path construction, an organization
  name containing directory traversal sequences (e.g., ../../etc/passwd) would cause
  the path to resolve outside the intended org-image directory. \n\nThis yields two
  security impacts: \n\n - an arbitrary file existence oracle, since file_exists()
  returns a boolean for any path the process can access.\n - an arbitrary file read
  limited to files with .png or .svg extensions, because the resolved filename is
  returned and subsequently rendered or served to the requesting user.\n\n\n\n\nThe
  vulnerability requires an authenticated user with the ability to create or import
