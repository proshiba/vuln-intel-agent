title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the /rest/active-workflows endpoint returned every active 
  workflow ID on the instance to any member regardless of sharing. Workflow 
  activation, deactivation, and publication push events were also broadcast to 
  clients that could not access the affected workflow, disclosing workflow IDs, 
  version IDs, and activation error details. The affected paths include 
  packages/cli/src/services/active-workflows.service.ts and 
  packages/cli/src/workflows/workflow-push-notifier.service.ts. This issue is 
  fixed in versions 1.123.76, 2.37.7 and 2.38.2.
