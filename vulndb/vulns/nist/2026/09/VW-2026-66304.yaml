title: InvoicePlane is a self-hosted open source application for managing 
  invoices, clients, and payments. Prior to 1.7.2, InvoicePlane's 
  Users::change_password() method accepts a user_id from the URL and updates 
  that account's password without an object-level authorization check. An 
  authenticated secondary administrator can target the primary administrator 
  account and replace its password without knowing the current password. The 
  attacker can then take over the primary account and access its data and 
  privileges. This issue is fixed in version 1.7.2.
