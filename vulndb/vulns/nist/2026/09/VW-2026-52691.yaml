title: A flaw was found in the AFP backend in gvfs. When mounting a share, a 
  malicious AFP server can cause the DSI read path to process a length that 
  exceeds the size requested by the client. The function does not verify the 
  server-provided length against the pre-sized reply buffer, causing the 
  operation to access past the intended boundaries. This issue allows a 
  malicious server to overflow a heap buffer and crash the gvfsd-afp process, 
  resulting in a denial of service.
