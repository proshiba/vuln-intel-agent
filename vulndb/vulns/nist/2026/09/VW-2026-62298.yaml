title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  reject per-device queue resize for shared tag set\n\nWhen shared_tags is enabled,
  null_setup_tagset() makes the device use the\nglobal tag_set, whose driver_data
  stays NULL. null_map_queues() therefore\nfalls back to the module-wide g_submit_queues/g_poll_queues
  instead of any\nper-device value.\n\nResizing submit_queues or poll_queues via configfs
  on such a device calls\nblk_mq_update_nr_hw_queues() on the shared set, shrinking\n\
  set->nr_hw_queues.  __blk_mq_realloc_hw_ctxs() only grows the\nq->queue_hw_ctx[]
  allocation, so on shrink it merely exits and NULLs the\nnow-excess hctx slots. null_map_queues(),
  however, keeps mapping CPUs with\nthe unchanged g_submit_queues/g_poll_queues, so
  mq_map[] ends up pointing\nat those NULLed hctx slots. blk_mq_map_swqueue() then
  dereferences the NULL\nhctx (hctx->cpumask), crashing the kernel:\n\n[  460.218374]
  KASAN: null-ptr-deref in range [0x0000000000000098-0x000000000000009f]\n[  460"
