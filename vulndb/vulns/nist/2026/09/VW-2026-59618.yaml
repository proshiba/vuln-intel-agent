title: A vulnerability has been found in GPAC 26.07.0. Affected is the function 
  gf_sg_dom_event_bubble of the file src/scenegraph/dom_events.c of the 
  component MP4Box. The manipulation leads to stack-based buffer overflow. The 
  attack can only be performed from a local environment. The exploit has been 
  disclosed to the public and may be used. Upgrading to version abi-16.23 is 
  able to address this issue. The identifier of the patch is 
  9eb40df4448b88d6a6ce3454657c06f47eff0b24. It is recommended to upgrade the 
  affected component.
