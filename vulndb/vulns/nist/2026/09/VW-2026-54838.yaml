title: "Affected versions of MISP expose organisation metadata through the dashboard
  organisation picker without applying the same visibility restrictions enforced by
  the normal organisation index and per-organisation view.\n\n\nThe affected endpoint
  returned fields including:\n\n\n\n  *  \norganisation ID;\n\n\n  *  \nUUID;\n\n\n\
  \  *  \nname.\n\n\n\n\n\nWhen Security.hide_organisation_index_from_users was enabled,
  normal organisation enumeration was restricted, but the dashboard picker still queried
  all organisations. This allowed authenticated users to discover organisations that
  should have remained hidden from them.\n\n\nThe fix calls Organisation::createConditions($this->Auth->user())
  and appends the resulting ACL conditions to the picker query. Ordinary users are
  thereby limited to organisations associated with events or proposals they can already
  see, plus their own organisation, while users with the appropriate sharing-group
  privilege retain broader visibility.\n\n\n\n\nVersion affected: ≤2.5.45"
