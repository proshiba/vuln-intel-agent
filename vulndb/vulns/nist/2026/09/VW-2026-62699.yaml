title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix vmlinux BTF prep race in bpf_get_btf_vmlinux\n\nbpf_get_btf_vmlinux() lazily
  parses the vmlinux BTF under the\nbpf_verifier_lock, but publishes the result through
  a plain store\nand re-checks it through a plain lockless load. Nothing orders\n\
  the stores initializing the struct btf inside btf_parse_vmlinux()\nagainst the store
  publishing the pointer: On a weakly ordered\narch, a concurrent first-time caller
  taking the lockless fast\npath could in principle observe the pointer before the
  parsed\ncontents are visible. The mutex_unlock() does not help such a\nreader given
  it only synchronizes with a later acquisition of the\nsame lock. Thus, publish the
  pointer with smp_store_release()\nand read it on the fast path with smp_load_acquire().\n\
  \nAcquire semantics are needed rather than a dependency-ordered\nREAD_ONCE(): btf_parse_vmlinux()
  also populates globals outside\nthe returned object (e.g. bpf_ctx_convert.t). An
  address\ndepen"
