title: "An improper authorization vulnerability exists in the handling of sub-workflow
  tasks. An authenticated user who does not have permission to access a target project
  can reference and invoke a workflow belonging to that project through a sub-workflow
  task.\n\n\n\nThe system does not properly verify whether the user has permission
  to execute the referenced workflow or access its project. As a result, the user
  can bypass project-level authorization controls and cause workflows in unauthorized
  projects to be executed.\n\n\n\nSuccessful exploitation may allow unauthorized execution
  of workflow tasks and access to the resources or data available to the target workflow.\n\
  \n\n\nThis issue affects Apache DolphinScheduler: before 3.4.3.\n\n\n\nUsers are
  recommended to upgrade to version 3.4.3, which fixes the issue."
