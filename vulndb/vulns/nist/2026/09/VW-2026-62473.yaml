title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix leak in ath11k_service_ready_ext_event()\n\nCurrently, during ath11k_service_ready_ext_event()
  processing,\nsvc_rdy_ext.mac_phy_caps can be allocated during TLV parsing. This
  is a\ntemporary allocation that is freed on the success path, but not on the\nerror
  path. If parsing succeeds far enough to allocate mac_phy_caps and\nthen fails on
  a later TLV, the allocation leaks. So free the allocation\non the error path.\n\n\
  Compile tested only."
