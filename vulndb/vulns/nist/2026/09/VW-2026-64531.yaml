title: LTSecurity LTK3500SF contains a hard-coded credentials vulnerability 
  where the root and guest account passwords are stored in /etc/shadow as weak 
  hashes recoverable with dictionary-based cracking tools. The recovered 
  credentials authenticate against the device's Telnet and SSH services and 
  grant root-level access to the operating system. These services are not 
  confirmed to start automatically at boot, so exploitation requires Telnet or 
  SSH to be running, whether enabled by the device configuration or started 
  manually.
