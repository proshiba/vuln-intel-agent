title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipack:
  ipoctal: fix UAF, null-ptr-deref, and use-after-free in cleanup on remove\n\nThree
  issues arise when the device is removed while a tty session is\nstill active:\n\n\
  1. UAF of struct ipoctal: the remove callback frees ipoctal via\n   kfree() while
  tty ops may still access it.  Fix by introducing\n   kref-based lifetime management
  — kref is taken in install() when\n   a tty is opened and released in cleanup()
  when the tty is finally\n   destroyed; remove() uses kref_put() instead of kfree().\n\
  \n2. NULL dereference in ipoctal_write_tty(): __ipoctal_remove()\n   frees xmit_buf
  via tty_port_free_xmit_buf() while a userspace\n   process may still hold the tty
  fd and call write().  Fix by\n   checking for NULL xmit_buf in ipoctal_write_tty().\n\
  \n3. UAF in ipoctal_cleanup(): ipack_put_carrier(ipoctal->dev)\n   dereferences
  ipoctal->dev after the ipack_device has been freed\n   by ipack_device_del().  Fix
  by caching ipoctal->carrier_owner"
