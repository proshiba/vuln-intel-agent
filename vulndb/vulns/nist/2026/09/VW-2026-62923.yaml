title: CubeCart is an ecommerce software solution. Prior to 6.7.5, the GDPR 
  tools in admin/sources/customers.gdpr.inc.php rely on page-level CC_PERM_READ 
  access and do not require CC_PERM_DELETE for the purge, no_order_purge, or 
  delete_guests commands. An authenticated administrator with read-only customer
  privileges can invoke these backend actions directly to bypass interface 
  restrictions and irreversibly delete customer records, accounts without 
  orders, or guest accounts, compromising data integrity and availability. This 
  issue is fixed in version 6.7.5.
