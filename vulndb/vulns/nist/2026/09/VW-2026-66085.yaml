title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix use-after-free race in sample_restore_put()\n\nConcurrent teardown of TC sample
  rules sharing the same restore\ncontext may re-read restore->count after dropping
  restore_lock.\nAt that point another thread may already have completed cleanup and\n\
  freed the restore object.\n\nUse the result of the refcount decrement while holding
  restore_lock to\ndetermine whether cleanup is needed."
