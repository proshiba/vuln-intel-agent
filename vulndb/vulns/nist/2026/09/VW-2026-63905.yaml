title: GoCD is a continuous deliver server. Prior to 26.1.0, the internal GoCD 
  UI /jobStatus.json API does not validate that a requested server-assigned job 
  ID belongs to the pipeline and stage named in the request. An authenticated 
  user can guess job IDs and retrieve status for jobs in pipelines the user 
  cannot otherwise view, including job names, state, progress timestamps, 
  assigned agent IP addresses and UUIDs, and associated stages and pipelines. 
  The response does not expose console output, artifacts, commands, variables, 
  or configuration. This issue is fixed in version 26.1.0.
