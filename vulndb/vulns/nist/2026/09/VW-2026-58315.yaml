title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  reject VAT indexes equal to the entry count\n\nUDF 1.50 virtual partition mapping
  uses the VAT as an array of physical\nblock mappings. s_num_entries stores the number
  of entries in that array,\nnot the highest valid index. The valid VAT indexes are
  therefore below\ns_num_entries.\n\nudf_get_pblock_virt15() currently rejects only
  indexes greater than\ns_num_entries. A crafted image can request index s_num_entries,
  pass the\nbounds check, and make the kernel read one entry past the allocated VAT
  table.\n\nChange the check to reject block >= s_num_entries, so the count is handled
  as\nan exclusive upper bound.\n\nA crafted UDF image reproduced this on origin/master
  commit\n0e35b9b6ec0ffcc5e23cbdec09f5c622ad532b53 with a KASAN slab-out-of-bounds\n\
  report in udf_get_pblock_virt15().\n\nTrail of Bits has a reproducer that triggers
  kernel panic demonstrating the bug, and can share it if needed."
