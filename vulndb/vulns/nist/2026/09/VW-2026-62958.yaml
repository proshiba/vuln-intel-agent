title: SOGo before 5.12.11 constructs password-reset links using the 
  client-supplied Origin header as the authority, allowing unauthenticated 
  attackers to redirect recovery tokens to attacker-controlled domains. 
  Attackers can submit password recovery requests with a malicious Origin header
  to have valid password-reset tokens mailed to victim recovery addresses within
  links pointing to attacker infrastructure, enabling account takeover.
