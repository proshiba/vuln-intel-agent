title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexfat:
  fix handling of damaged volume in exfat_create_upcase_table()\n\nWhen the size of
  the upcase table is set to zero in the dentry for any\nreason(e.g. corrupted media
  or misbehaving device), an integer overflow\ncauses the module to loop indefinitely.\n\
  \nIf the size of the upcase table is read zero, do not attempt to load the\ntable.
  Instead, fallback to loading the default upcase table. If the\nsize of the upcase
  table is zero or no upcase table is found, raise\nexfat_fs_error() to mark the volume
  read-only."
