title: zstd-jni versions 1.5.5-6 through 1.5.7-13 contain an out-of-bounds read 
  vulnerability in Zstd.getFrameContentSize that fails to validate negative 
  srcPosition arguments. Attackers can supply negative offset values that bypass
  bounds checks and reach the native frame-header parser, causing out-of-bounds 
  memory reads that lead to information disclosure or JVM crashes.
