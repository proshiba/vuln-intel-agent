title: ZITADEL is an open source identity management platform. From 3.0.0 until 
  3.4.13 and 4.16.1, ZITADEL Actions V1 enables the goja Node-compatible 
  require() registry without restricting its filesystem source loader. An 
  organization Action author with ORG_OWNER, org.action.write, and 
  org.flow.write permissions can run JavaScript at OIDC, SAML, and login-flow 
  trigger points and load files readable by the ZITADEL server process. This can
  disclose mounted configuration and secrets, including credentials stored 
  through ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH or 
  ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH, and recovered bootstrap credentials can 
  enable escalation from an organization administrator to an instance 
  administrator. The issue affects Actions V1, and host command execution is not
  established. This issue is fixed in versions 3.4.13 and 4.16.1.
