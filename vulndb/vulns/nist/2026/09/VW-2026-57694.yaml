title: 'rclone is a command-line program to sync files and directories to and from
  different cloud storage providers. From 1.70.0 until 1.75.1, the serve/start RC
  interface accepts per-server proxyOpt.AuthProxy settings, and the FTP and S3 constructors
  in cmd/serve/ftp/ftp.go and cmd/serve/s3/server.go incorrectly check the process-global
  proxy.Opt.AuthProxy value instead. When the global value is empty, the request-local
  authentication proxy is ignored: FTP falls back to the fixed filesystem with username
  anonymous and any password, while S3 with AuthKey serves the fixed RC fs rather
  than the backend selected by the proxy. The dedicated command-line servers that
  configure the global option are not affected. This issue is fixed in version 1.75.1.'
