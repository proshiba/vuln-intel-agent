title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/resctrl:
  Prevent use-after-free in rdtgroup_kn_put()\n\nA struct rdtgroup is reference counted
  via rdtgroup::waitcount. Callers that\nneed the structure to remain valid across
  a sleep (while waiting on acquiring\nrdtgroup_mutex) take a reference with rdtgroup_kn_get()
  and release it with\nrdtgroup_kn_put().\n\nThe release path is intended to serve
  as the fallback freer: if the count\ndrops to zero and the group has already been
  marked RDT_DELETED,\nrdtgroup_kn_put() frees the structure.\n\nThe bulk teardown
  paths free_all_child_rdtgrp() and rmdir_all_sub() resulting\nfrom a resctrl directory
  remove or resctrl fs unmount act as the primary\nfreer: they hold rdtgroup_mutex
  and free each rdtgroup whose waitcount is\nzero, otherwise they set RDT_DELETED
  and leave the freeing to the last waiter.\n\nThese two freers race. rdtgroup_kn_put()
  commits waitcount == 0 with\natomic_dec_and_test() outside rdtgroup_mutex, then
  reads rdtgroup::fla"
