title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  tun: bound receive headroom\n\ntun_get_user() uses tun->align both as skb headroom
  and when choosing how\nmuch packet data to keep linear. OVS can propagate an oversized
  headroom\nrequest from another port to TUN or TAP.\n\nWhen align is larger than
  the usable space in a one-page skb head,\nSKB_MAX_HEAD(align) underflows and the
  result becomes negative when stored\nin good_linear. That value later wraps when
  assigned to the size_t linear\nvariable, and tun_alloc_skb() can place skb->data
  outside the allocated\nhead.\n\nBound the headroom stored by TUN to the one-page
  skb-head budget and the\nlargest non-sentinel 16-bit skb header offset. Leave one
  linear byte for\nraw TUN and a complete Ethernet header for TAP, including NET_IP_ALIGN.\n\
  \nAlso pull the raw-TUN protocol byte and the TAP Ethernet header before\naccessing
  them, so these checks remain safe for nonlinear skbs supplied by\nother allocation
  paths."
