title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  release path refs on follow_down() error\n\nnfsd_cross_mnt() initializes a local
  struct path with mntget() and\ndget() before calling follow_down(). On a negative
  return the error\narm jumps to out without releasing those references:\n\n    err
  = follow_down(&path, follow_flags);\n    if (err < 0)\n            goto out;\n\n\
  follow_down() never drops the caller's entry-time refs on any error\nsub-case; for
  example a pre-cross d_manage() failure leaves path\nuntouched, so the mntget()/dget()
  taken on entry survive the call.\n\nEvery other early-exit arm in nfsd_cross_mnt()
  (other-namespace\nreturn, IS_ERR(exp2), and the success tail after the swap) already\n\
  calls path_put(&path); the err < 0 arm is the lone omission. The\nleak inflates
  mnt_count and d_count on each failed cross-mount,\nblocking umount and pinning dentries
  against the shrinker, and is\nreachable by any authenticated NFS client through
  nfsd_lookup_dentry\nor the NFSv4 R"
