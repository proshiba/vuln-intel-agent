title: "Improper handling of compressed data in the shared GZIP decompressor used
  for AMQP 0-8/0-9/0-9-1 and AMQP 0-10 message delivery, message conversion and HTTP
  management JSON rendering allows authenticated message producers to exhaust memory
  and disrupt broker availability via processing without a decompressed-output limit.\n\
  \nThis issue affects Apache Qpid Broker-J: through 10.1.0.\n\nUsers are recommended
  to upgrade to version 10.1.1, which fixes the issue."
