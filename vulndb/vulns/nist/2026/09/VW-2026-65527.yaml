title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhsr:
  broadcast netlink notifications in the device's net namespace\n\nThe HSR generic
  netlink family sets .netnsok = true. HSR devices can\nlive in network namespaces
  other than init_net.\n\nTwo async notifiers broadcast events with genlmsg_multicast().
  They\nare hsr_nl_ringerror() and hsr_nl_nodedown(). That helper delivers\nonly on
  the default genl socket in init_net. So the events always land\nin init_net. The
  network namespace of the device does not matter.\n\nThis has two effects. A listener
  in the device's own namespace never\nsees its own ring error and node down events.
  A privileged listener in\ninit_net receives events from HSR devices in other namespaces.
  The\npayload carries the peer node MAC (HSR_A_NODE_ADDR) and the slave port\nifindex
  (HSR_A_IFINDEX).\n\nSwitch both callers to genlmsg_multicast_netns(). Other families
  with\n.netnsok = true already do this. Examples are gtp, ovpn, team,\nbatman-adv,
  netdev-genl, ethtool an"
