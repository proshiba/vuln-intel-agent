title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  xprtsock: annotate shared socket callbacks with READ_ONCE/WRITE_ONCE\n\nxprtsock
  replaces and restores sk->sk_data_ready and\nsk->sk_write_space on live sockets
  with plain stores, and\nxs_udp_do_set_buffer_size() invokes sk->sk_write_space via
  a plain\nload. These callback pointers are shared with generic socket and\nprotocol
  paths that may read or invoke them concurrently, so xprtsock\nneeds the same READ_ONCE()/WRITE_ONCE()
  callback visibility contract\nthat the validated 4022 family applied elsewhere.\n\
  \nWhen SUNRPC takes over an AF_LOCAL, UDP, or TCP socket and later\nrestores the
  lower-socket callbacks during teardown, another CPU may\nstill hold an earlier callback
  snapshot. The plain replace/restore\npattern leaves the same visibility hole as
  the validated 4022 family,\nso a stale snapshot can still invoke xs_data_ready()
  or\nxs_udp_write_space() after the live callback fields have already been\nrestored
  to the lower-s"
