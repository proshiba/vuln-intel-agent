title: A vulnerability was identified in jaychouchannel 
  Tourism-Management-System up to 229956e20dbd4a80eeff14535e44d3099502af09. The 
  affected element is an unknown function of the file 
  travel/src/main/java/com/controller/UsersController.java of the component User
  Register Endpoint. Such manipulation of the argument UsersEntity leads to 
  improper privilege management. The attack can be launched remotely. The 
  exploit is publicly available and might be used. This product does not use 
  versioning. This is why information about affected and unaffected releases are
  unavailable. The name of the patch is 
  84d8ec384f669df3985293dab293bb7b477efa64. Applying a patch is advised to 
  resolve this issue.
