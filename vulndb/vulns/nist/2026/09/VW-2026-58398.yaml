title: "In the Linux kernel, the following vulnerability has been resolved:\n\necryptfs:
  pass packet set buffer size to parser\n\necryptfs_parse_packet_set() receives a
  pointer into the file header, but\nit calculates the remaining packet buffer size
  from PAGE_SIZE - 8.  For\nversion 1 headers the packet set starts later in the header,
  so this can\noverstate the available buffer.\n\nPass the actual packet set buffer
  length from the caller and calculate\nper-packet limits from the remaining bytes
  in that buffer.  Recompute the\nremaining length after consuming a tag 3 packet
  before parsing the\nfollowing tag 11 packet."
