title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix dp_link_peer dangling references on AP vdev rollback\n\nath12k_mac_vdev_create()
  for an AP vdev creates the bss self-peer via\nath12k_peer_create(), which finishes
  by calling\nath12k_dp_link_peer_assign() to publish the dp_link_peer in the\ndp_hw->dp_peers[peerid_index]
  RCU table, in the dp_peer's\nlink_peers[] array, and in the per-addr rhashtable.\n\
  \nIf a step after ath12k_peer_create() fails the function jumps to\nerr_peer_del,
  which open-codes a WMI peer_delete and waits for the\nunmap / delete_resp events.
  The wait_for_peer_delete_done() path\nrelies on ath12k_dp_link_peer_unmap_event()
  freeing the dp_link_peer\nwhen the unmap arrives, but err_peer_del never calls\n\
  ath12k_dp_link_peer_unassign() first. The published references in\nthe dp_hw RCU
  table, dp_peer->link_peers[] and the rhashtable are\nleft pointing at the dp_link_peer
  that unmap_event then frees,\nproducing dangling pointers and use-after-free on
  su"
