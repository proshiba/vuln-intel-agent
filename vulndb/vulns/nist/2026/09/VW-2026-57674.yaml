title: rclone is a command-line program to sync files and directories to and 
  from different cloud storage providers. Prior to 1.75.1, when backend/local 
  runs with --links, a source .rclonelink object can plant a symlink in the 
  destination and later directory metadata is applied through that path. 
  MkdirMetadata, writeMetadataToFile, and setTimes operate when 
  Directory.translatedLink=false, so os.Chown, os.Chmod, os.Chtimes, and 
  birth-time handling can bypass os.Root confinement and follow the symlink. An 
  attacker controlling source contents can therefore apply selected ownership, 
  permissions, modification times, or birth times to a file or directory outside
  the destination, with --metadata required for chmod and chown while 
  modification time is applied by the normal directory workflow. This issue is 
  fixed in version 1.75.1.
