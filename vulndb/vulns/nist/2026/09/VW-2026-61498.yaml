title: Keycloak provides a policy enforcer to protect applications by matching 
  incoming web requests against defined security policies. A flaw was found 
  where the enforcer fails to correctly normalize web addresses that contain 
  special encoded characters, such as those representing semicolons or directory
  traversal segments. An authenticated user can use these encoded characters to 
  trick the enforcer into applying a less restrictive security policy than 
  intended, potentially gaining unauthorized access to sensitive administrative 
  or private application endpoints.
