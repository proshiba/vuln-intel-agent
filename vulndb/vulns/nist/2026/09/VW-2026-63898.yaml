title: "When a user creates or edits a report inside an event, MISP can identify an
  existing report using its UUID without properly checking whether that report actually
  belongs to the same event.\n\nAs a result, a user who has editing rights on one
  event could potentially move a report from another event into their own event, as
  long as they know or can guess the report’s UUID. Once moved, they could view and
  change information that they were not originally allowed to access.\n\nThe vulnerability
  requires the attacker to have editor access to at least one event and to know or
  discover a valid report UUID.\n\nThe main impact is that private event reports could
  be exposed or modified across event boundaries, bypassing MISP’s normal access restrictions.\n\
  \nVersion affected: <2.5.47"
