title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  dac: m62332: Fix regulator reference count imbalance\n\nm62332_set_value() enables
  the Vcc regulator on every write of a\nnon-zero value and disables it on every write
  of zero, without tracking\nthe channel's current state. Because the regulator is
  reference counted,\nchanging a channel directly from one non-zero value to another
  enables\nit more than once, while a later write of zero disables it only once.\n\
  The reference count never returns to zero and the regulator is left\nenabled indefinitely.\n\
  \nOnly enable the regulator on the transition from zero to non-zero, and\nonly disable
  it on the transition from non-zero to zero, using the\npreviously stored channel
  value to detect the edge. Balance the\nregulator on the I2C error path so the reference
  count stays consistent\nif the write fails."
