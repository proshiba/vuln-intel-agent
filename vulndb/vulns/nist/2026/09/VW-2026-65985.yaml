title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/ivpu:
  Limit firmware log name prints to field size\n\nThe name in struct vpu_tracing_buffer_header
  is a fixed-size array\npopulated by the NPU firmware. It is expected to be NUL-terminated,\n\
  but nothing on the host side enforces this, so printing it with an\nunbounded string
  conversion would read past the field if the\nterminator is ever missing and expose
  adjacent bytes of the shared\ntracing BO through dmesg and the debugfs FW log output.\n\
  \nPrint at most as many characters as the name field holds, so the output\nnever
  runs past it even if the string is not NUL-terminated."
