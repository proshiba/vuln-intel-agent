title: 9Router is an AI router & token saver. Prior to 0.5.6, 9Router 
  deployments that allow requests to reach Next.js without the sanitizing 
  custom-server.js wrapper trust the client-supplied X-9r-Real-Ip header in 
  src/dashboardGuard.js when isLocalRequest decides whether 
  canAccessPublicLlmApi may skip API-key validation for /api/v1/* routes. A 
  remote unauthenticated attacker can set X-9r-Real-Ip to 127.0.0.1 and be 
  classified as a local client, including on the verified GET /api/v1/models 
  route. This permits unauthorized use of the instance owner's configured LLM 
  providers, consumption of paid credits, and enumeration of configured 
  providers and models. This issue is fixed in version 0.5.6.
