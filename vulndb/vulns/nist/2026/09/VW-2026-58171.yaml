title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  FCP: do not copy out an uninitialised init response\n\nfcp_ioctl_init() allocates
  its response buffer with kmalloc() and copies\nthe whole buffer back to userspace:\n\
  \n\tbuf_size = init.step0_resp_size + init.step2_resp_size;\n\n\tvoid *resp __free(kfree)
  =\n\t\tkmalloc(buf_size, GFP_KERNEL);\n\t...\n\tif (copy_to_user(arg->resp, resp,
  buf_size))\n\t\treturn -EFAULT;\n\nNothing clears the buffer, and the only writer
  of its leading\nstep0_resp_size bytes is the step-0 control transfer:\n\n\terr =
  snd_usb_ctl_msg(dev, usb_rcvctrlpipe(dev, 0),\n\t\tFCP_USB_REQ_STEP0,\n\t\tUSB_RECIP_INTERFACE
  | USB_TYPE_CLASS | USB_DIR_IN,\n\t\t0, private->bInterfaceNumber,\n\t\tstep0_resp,
  private->step0_resp_size);\n\tif (err < 0)\n\t\treturn err;\n\nusb_fill_control_urb()
  does not set URB_SHORT_NOT_OK, so a short or\nzero-length data stage completes with
  status 0 and snd_usb_ctl_msg()\nreturns a small actual_length.  The only check is
  err < 0, so a short\ntransfer is accepted"
