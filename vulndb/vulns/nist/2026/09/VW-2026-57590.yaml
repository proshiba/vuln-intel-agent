title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a cross-site request forgery vulnerability in the LoginControl plugin
  PGP key endpoints that lack CSRF token validation. Attackers can craft 
  malicious pages with image tags pointing to savePublicKey.json.php to replace 
  a logged-in victim's PGP 2FA public key, causing lockout or enabling account 
  takeover if the attacker knows the password.
