title: The Photo Gallery by 10Web – Mobile-Friendly Image Gallery plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via the Shortcode 
  Attributes in all versions up to, and including, 1.8.44 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with Author-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page.
