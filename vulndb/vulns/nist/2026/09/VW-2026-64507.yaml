title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the OAuth fallback token 
  directory and JSON file are created without explicit owner-only modes. Local 
  users or processes with access through the resulting group or world permission
  bits can read access and refresh tokens and reuse the associated Atlassian 
  session. The advisory traces the vulnerable input and processing flow through 
  ~/.mcp-atlassian, oauth-<client_id>.json, access_token, and refresh_token, 
  which identify the affected entry points, controls, and code paths. This issue
  is fixed in version 0.22.0.
