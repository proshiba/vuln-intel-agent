title: The Ibtana – Ecommerce Product Addons plugin for WordPress is vulnerable 
  to unauthorized post meta modification due to a missing capability check on 
  the 'iepa_use_gt_editor' AJAX action in all versions up to, and including, 
  0.4.7.7. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to update or delete arbitrary post meta 
  entries via the 'iepa_builder' meta key.
