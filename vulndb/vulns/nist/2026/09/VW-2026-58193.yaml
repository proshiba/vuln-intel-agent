title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ravb: avoid dereferencing an invalid PTP clock\n\nThe PTP clock is unavailable before
  the first open, so querying its\nindex can dereference a NULL pointer. Registration
  failures can also\nleave an error pointer in priv->ptp.clock.\n\nCache the PHC index
  separately and report -1 while no clock is\nregistered. Normalize registration errors
  to NULL and preserve the\nstatic timestamping capabilities."
