title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblock:
  validate user space vectors during extraction\n\nThe bio-based drivers don't necessarily
  check the alignment split, and\nstacking block drivers don't always handle a misalignment
  detected after\nsubmitting the bio. Validate user vectors against the device's\n\
  dma_alignment as the bio is built from the iov_iter, rejecting\nmisaligned early
  with -EINVAL."
