title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix invalid data access in ath11k_dp_rx_h_undecap_nwifi\n\nIn certain cases,
  hardware might provide packets with a\nlength greater than the maximum native Wi-Fi
  header length.\nThis can lead to accessing and modifying fields in the header\n\
  within the ath11k_dp_rx_h_undecap_nwifi() function for the\nDP_RX_DECAP_TYPE_NATIVE_WIFI
  decap type and\npotentially result in invalid data access and memory corruption.\n\
  \nKernel stack is corrupted in: ath11k_dp_rx_h_undecap+0x6b0/0x6b0 [ath11k]\nCall
  trace:\n ath11k_dp_rx_h_mpdu+0x0/0x2e8 [ath11k]\n ath11k_dp_rx_h_mpdu+0x1e0/0x2e8
  [ath11k]\n ath11k_dp_rx_wbm_err+0x1e0/0x450 [ath11k]\n ath11k_dp_rx_process_wbm_err+0x2fc/0x460
  [ath11k]\n ath11k_dp_service_srng+0x2e0/0x348 [ath11k]\n\nAdd a sanity check before
