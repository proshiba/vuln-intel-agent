title: The decompress package for Node.js extracts archives. Prior to 10.2.2 and
  11.1.4, the default decompress(input, output) API relies on lexical 
  containment checks that do not account for the kernel following a planted 
  symlink chain. An attacker can supply a crafted archive containing chained 
  symlink entries so that a later entry resolves outside the output directory. 
  This allows files outside output to be read or written, and overwriting 
  startup scripts or configuration can lead to remote code execution. The 
  maintained @xhmikosr/decompress package is fixed in 10.2.2 and 11.1.4, but the
  separately affected unmaintained decompress package remains unpatched through 
  4.2.1. This vulnerability results from a bypass of the incomplete hardening 
  for CVE-2026-53486. @xhmikosr/decompress is fixed in versions 10.2.2 and 
  11.1.4.
