title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables_offload: suppress WARN_ON_ONCE for ENOMEM in abort path\n\nIn nft_flow_rule_offload_abort(),
  WARN_ON_ONCE(err) is triggered on every\nerror during rollback, including -ENOMEM.
  Memory allocation failures are\nexpected under low-memory conditions and do not
  indicate a kernel bug.\n\nTrace for example:\nnft_flow_offload_chain() // FLOW_BLOCK_BIND\n\
  \  nft_flow_block_chain()\n    nft_chain_offload_cmd()\n      nft_block_offload_cmd()\n\
  \        ->ndo_setup_tc()\n        nsim_setup_tc()\n          flow_block_cb_setup_simple()\n\
  \            flow_block_cb_alloc() // fails to -ENOMEM\n\nThe warning was reproduced
  on the 5.10 stable kernel under memory pressure\nvia fault injection, but the underlying
  bug exists in mainline as well,\nas demonstrated by the ENOMEM trace above. The
  following splat was\ntriggered during nf_tables transaction processing:\n\nWARNING:
  CPU: 0 PID: 8567 at net/netfilter/nf_tables_offload.c:532 nft_flow_rul"
