title: "Inconsistent interpretation of HTTP/2 requests ('HTTP Request/Response smuggling')
  vulnerability in Apache Tomcat caused by a regression in fix for CVE-2026-41293
  can trigger request header mix-up.\n\n\n\nThis issue affects Apache Tomcat: from
  11.0.22 through 11.0.25, from 10.1.55 through 10.1.59, from 9.0.118 through 9.0.121.\n\
  \n\n\nUsers are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which
  fix the issue."
