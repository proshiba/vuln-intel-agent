title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  guard nfsd_serv deref in nfsd_file_net_dispose\n\nnfsd_file_net_dispose() is the
  consumer side of l->freeme: the nfsd\nservice thread loop calls it to drain entries
  that the filecache\ngarbage collector and shrinker append via\nnfsd_file_dispose_list_delayed().\
  \  During per-net teardown,\nnn->nfsd_serv is cleared before the filecache laundrette
  is shut\ndown, so the service thread can still run a dispose pass that finds\nmore
  than eight entries on l->freeme and dereferences a NULL\nsvc_serv:\n\n    nfsd service
  thread loop\n      nfsd_file_net_dispose(nn)\n        if (!list_empty(&l->freeme))
  {\n            ...\n            svc_wake_up(nn->nfsd_serv);   /* nn->nfsd_serv ==
  NULL */\n        }\n\nThe sibling helper nfsd_file_dispose_list_delayed() already
  documents\nthis ordering and caches nn->nfsd_serv into a local before testing it\n\
  for NULL.  nfsd_file_net_dispose() was introduced with the same raw\nsvc_wake_up(nn->nfsd_serv)
  call "
