title: Helicone's VaultManager.getDecryptedProviderKeyById() function in the GET
  /v1/vault/key/{providerKeyId} endpoint fails to validate the requester's 
  organization against the vault key's organization identifier. Attackers with 
  admin or owner privileges in any organization can retrieve decrypted upstream 
  provider credentials for other tenants, including plaintext OpenAI, Anthropic,
  and Bedrock API keys.
