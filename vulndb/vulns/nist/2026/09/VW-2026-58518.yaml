title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  renesas: Fix out-of-bounds access for newdevs mask\n\nWhen software initiates DAA
  (Dynamic Address Assignment), the controller\nreports the result via the NRSPQP
  (Normal Response Queue Port Register).\nThe data length field of the response descriptor,
  which is accessible\nthrough the NRSPQP register, indicates the number of devices
  remaining\nafter DAA. Consequently, when the bus is empty, this field contains the\n\
  maximum number of devices supported by the controller (8 for the Renesas\nI3C controller).\n\
  \nAdjust the condition that computes the newly discovered devices bitmask\nto prevent
  an out-of-bounds when the I3C bus is empty."
