title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/core:
  Make core-sched flips wait for in-flight selections\n\nCore scheduling's pick_next_task()
  operates on all sibling rqs under one\nacquisition of the shared core-wide lock.
  A ->pick_task() that releases the\nrq lock leaves every sibling __lock momentarily
  free, letting\n__sched_core_flip(false) complete mid-selection and rebind rq_lockp()
  under\nit. The selection resumes on the split locks, touching sibling state it no\n\
  longer protects, and __schedule() finally releases a lock that was never\ntaken
  while leaking the one that was.\n\nCount in-flight core-wide selections in the leader's
  rq->core_pick_in_flight\nand make __sched_core_flip() wait for the count to drain.
  The count only\nchanges under the shared lock, which the flip holds while sampling,
  so no\nother ordering is needed. The wait can repeat while selections overlap, but\n\
  the flip backs off between samples and flips are rare cookie-lifetime\nevents.\n\
  \nsched_core_cp"
