title: An incorrect numeric type conversion in the BSON document building 
  component of the MongoDB C++ Driver may cause a length value to be interpreted
  incorrectly. When an application supplies an extremely large, non-terminated 
  field name to the builder, the library may read memory outside the intended 
  buffer and terminate the calling process. No authentication is required, but 
  the calling application must pass the oversized name in a specific form.
