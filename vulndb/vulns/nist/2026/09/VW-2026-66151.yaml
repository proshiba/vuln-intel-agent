title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix the possible bioc_list memory leak during error\n\nThere are two possible ways
  to leak bioc memory on\nbtrfs_ordered_extent::bioc_list:\n\n- An error occurred
  for btrfs_insert_one_raid_extent()\n  Then the function btrfs_insert_raid_extent()
  immediately return\n  without freeing any bioc in the bioc_list.\n\n- An ordered
  extent hit an IO error\n  In that case the ordered extent will have BTRFS_ORDERED_IOERR
  set, and\n  skip the call on btrfs_insert_raid_extent() completely.\n\nFix the problem
  by:\n\n- Introduce a new helper, btrfs_cleanup_ordered_bioc_list()\n  Which will
  remove all bioc from the bioc_list, and release the bioc.\n\n- Call the above helper
  for btrfs_insert_raid_extent()\n  So that the cleanup helper is always called no
  matter what.\n\n- Call the above helper for btrfs_finish_one_ordered()\n  This is
  called just before the final release on the ordered extent.\n\nThis was reported
  by Sashiko when reviewing another pa"
