title: Sylius versions before 2.1.16 and 2.2.9 fail to validate payment amounts 
  during cart recalculation, allowing unauthenticated attackers to modify order 
  totals after gateway transaction initiation. Attackers can pay a small amount,
  enlarge the order after gateway capture, and have the system mark the inflated
  order as fully paid while the gateway captured only the original amount.
