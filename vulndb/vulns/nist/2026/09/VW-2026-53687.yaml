title: "A vulnerability in MISP's email-based one-time password (OTP) authentication
  flow allowed an attacker to perform an unrestricted number of OTP verification attempts.\n\
  \n\nThe email_otp() endpoint did not apply brute-force protection when validating
  submitted OTP values. An attacker who had reached the OTP verification stage, for
  example after successfully providing a user's primary authentication credentials,
  could repeatedly submit candidate OTP values while the same OTP remained valid.
  This significantly increased the feasibility of guessing the OTP and bypassing the
  additional authentication factor, potentially resulting in unauthorized access to
  the affected user's account.\n\n\nThe issue was exacerbated by the fact that the
  OTP is associated with the user rather than with an individual pending login session,
  allowing multiple concurrent sessions to attempt guesses against the same valid
  OTP.\n\n\nThe patch integrates the existing MISP brute-force protection mechanism
