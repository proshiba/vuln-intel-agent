title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Clamp MSI-X derived queue counts to avoid truncation\n\nha->msix_count
  is u16, but ha->max_req_queues, ha->max_rsp_queues and\nha->max_qpairs are u8. Deriving
  the queue count as\n\"ha->max_req_queues = ha->msix_count - 1\" therefore truncates:
  a board\n(or a misconfigured/malicious hot-plugged device) advertising 257 MSI-X\n\
  vectors yields msix_count - 1 == 256, which truncates to 0. An MSI-X\ncount of 1
  zeroes it as well, and in target mode the subsequent\n\"ha->max_req_queues--\" then
  underflows 0 to 255.\n\nWhen the count is 0, qla2x00_alloc_queues() calls\nkzalloc_objs(struct
  req_que *, 0), which returns ZERO_SIZE_PTR. That is\nnot NULL, so the allocation
  check passes and the following\n\"ha->req_q_map[0] = req\" dereferences ZERO_SIZE_PTR,
  corrupting memory\nor crashing the kernel.\n\nAdd qla_calc_queue_count() to clamp
  the derived value into\n[1, QLA_MAX_QUEUES - 1] so it always fits in u8 and is never
  zero, and\nuse it a"
