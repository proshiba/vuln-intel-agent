title: A security flaw has been discovered in ChangeWeDer crm up to 
  c07bd4c97141521af6475034bc58523beed51bbd. This issue affects the function 
  index of the file UserController.java of the component 
  top.upstudy.crm.controller.UserController. The manipulation results in missing
  authorization. The attack can be launched remotely. This product does not use 
  versioning. This is why information about affected and unaffected releases are
  unavailable. The project was informed of the problem early through an issue 
  report but has not responded yet.
