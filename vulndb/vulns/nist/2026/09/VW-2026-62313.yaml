title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  page_pool: fix UAF in __page_pool_release_netmem_dma on xa_cmpxchg race\n\nThis
  bug was discovered while testing the hns3 driver under channel\nreconfiguration
  (`ethtool -L` / `ethtool -G`) with iperf3 traffic on\narm64. The race is intermittently
  triggered when page_pool_destroy()\nruns page_pool_scrub() concurrently with page
  return via\npage_pool_put_netmem() on a different CPU. A WARN in\npage_pool_clear_pp_info()
  surfaced the dangling DMA index bits left\nby the cmpxchg loser, which led to the
  investigation.\n\npage_pool_scrub() iterates pool->dma_mapped via xa_for_each()
  with no\npage ref held. __page_pool_release_netmem_dma() currently reads and\nwrites
  netmem fields (dma_addr, DMA index bits in pp_magic) after\nxa_cmpxchg() returns.
  The unref path calls put_page() unconditionally\nregardless of the cmpxchg outcome;
  when it loses the cmpxchg, it still\nfrees the page before the scrub winner finishes
  these netmem accesses"
