title: "MISP's galaxy matrix statistics view (app/View/Users/statistics_galaxymatrix.ctp)
  renders the galaxy name directly into HTML output via sprintf() without any HTML
  encoding. An authenticated user holding the perm_galaxy_editor permission can create
  or modify a galaxy whose name contains arbitrary HTML or JavaScript markup. Because
  the value is interpolated verbatim into the page, any user who subsequently opens
  the galaxy matrix statistics page will have the embedded script executed in their
  browser context. This enables session hijacking, credential theft, data exfiltration,
  or the performance of arbitrary actions on behalf of the victim within the MISP
  application.\n\nVersion affected: <2.5.47"
