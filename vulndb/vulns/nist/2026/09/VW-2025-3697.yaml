title: A weakness has been identified in codingWithElias School Management 
  System up to f1ac334bfd89ae9067cc14dea12ec6ff3f078c01. Affected is an unknown 
  function of the file /student-view.php of the component Edit Student Info 
  Page. This manipulation of the argument First Name causes cross site 
  scripting. Remote exploitation of the attack is possible. The exploit has been
  made available to the public and could be exploited. This product follows a 
  rolling release approach for continuous delivery, so version details for 
  affected or updated releases are not provided. Other parameters might be 
  affected as well. The vendor was contacted early about this disclosure but did
  not respond in any way.
