title: Froxlor before 2.2.0 (affected up to and including 2.2.0-rc3) generates 
  /etc/pure-ftpd/db/mysql.conf with mode 0644 via the XML configuration 
  templates in lib/configfiles/, even though the file contains the Froxlor SQL 
  user's password. On systems where the parent directories are world readable 
  (the default on Debian 12), any unprivileged local user able to execute 
  commands or code on the host — including virtual users without SSH access who 
  can upload PHP/CGI scripts — can read the file and obtain the Froxlor database
  credentials. Database access can then be leveraged to alter an administrator's
  password hash and TOTP seed, log in as a Froxlor administrator, and ultimately
  gain root privileges. Only instances configured to use pure-ftpd are affected.
