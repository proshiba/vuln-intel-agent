title: The ixo Blockchain is a Layer 1 blockchain that runs on both Testnet and 
  Mainnet. Prior to version 8.0.0, the x/bonds module moved funds from an 
  address that was resolved from a DID verification method, without verifying 
  that the resolved address belonged to the transaction signer. Affected 
  handlers included MsgMakeOutcomePayment, MsgBuy, MsgSell, MsgSwap, and 
  MsgWithdrawShare, as well as the batch order processor. Because any account 
  may list an arbitrary blockchainAccountID as a verification method on a DID it
  controls (without the consent of that address's owner), an attacker could 
  register victims' addresses as verification methods on their own DID and then 
  move the victims' balances into a bond the attacker controlled — later 
  withdrawing and bridging the proceeds off-chain. This was exploited on ixo 
  mainnet (ixo-5) on 2026-06-20. The attack required no victim keys, signatures,
  or system compromise — any account holding a balance in a token a bond could 
