title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: access chan->conn safely in get/setsockopt\n\nSince commit b66774b48dd9 (\"\
  Bluetooth: L2CAP: Fix UAF in channel timeout by holding conn ref\")\nl2cap_chan::conn
  has held reference and remains non-NULL also after the\ncorresponding hci_conn is
  deleted.  In this state accessing various\nfields eg. hci_conn::hdev is invalid,
  which leads to KASAN crash in\nl2cap_sock_setsockopt() access of conn->hcon->hdev.\n\
  \nCheck l2cap_chan::conn.hcon corresponds to an alive hci_conn before\ntrying to
  use it in l2cap_sock.c.  Hold l2cap_chan_lock() in\ngetsockopt/setsockopt to ensure
  it stays alive, and to avoid data races\nin l2cap_chan fields."
