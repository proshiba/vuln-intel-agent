title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  drop dma_buf reference on foreign-fd prime import\n\nttm_prime_fd_to_handle() returns
  -ENOSYS when the imported fd's\ndma_buf->ops do not match the ttm_object_device's
  ops, but does so\nwithout releasing the reference acquired by dma_buf_get().  Any\n\
  unprivileged renderD client passing a non-vmwgfx prime fd through the\nDRM_VMW_GB_SURFACE_REF{,_EXT}
  path leaks one dma_buf reference per\ncall and indefinitely pins the foreign exporter's
  GEM resources.\n\nFunnel the error path through the existing dma_buf_put() so the\n\
  reference is always dropped."
