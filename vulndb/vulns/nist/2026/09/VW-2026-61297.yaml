title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  buffer: Make IIO DMA fence release RCU-safe\n\nThe `dma_fence` documentation states
  that if a custom release\nimplementation is provided, the `dma_fence` object must
  be freed in an\nRCU-safe way. The current `iio_dma_fence` implementation uses `kfree()`,\n\
  which might result in a use-after-free.\n\nRemove the custom `release` implementation.
  This makes the DMA fence core\nfall back to `dma_fence_free()`, which calls `kfree_rcu()`
  on the fence.\nThis requires that the fence be the first member of `struct iio_dma_fence`.\n\
  \nUsing the default release method for extended DMA fence structures is a\ncommon
  pattern."
