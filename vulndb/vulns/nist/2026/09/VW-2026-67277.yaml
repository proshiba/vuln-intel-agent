title: WarehousePG (WHPG) 7.x before 7.6.0-WHPG is affected by a missing 
  authorization vulnerability (CWE-862) in the built-in server-side file 
  functions pg_file_write(text,text,bool), pg_file_rename(text,text,text), 
  pg_file_unlink(text), and pg_logdir_ls(). These functions are executable by 
  any authenticated database role with no GRANT required, because the REVOKE 
  that contrib/adminpack applies to the equivalent functions was never carried 
  over to WHPG core when their catalog entries were repointed to the ungated 
  adminpack-derived implementations as part of Greenplum's merge to a PostgreSQL
  12 base. A non-superuser can use pg_file_write, pg_file_rename, and 
  pg_file_unlink to create, overwrite (append), rename, and delete files under 
  the data and log directories, and can use pg_logdir_ls() to enumerate log file
  names. Because postgresql.auto.conf resides in the data directory, a 
  non-superuser can append configuration directives such as 
  shared_preload_libraries or archive_command to it, result
