title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  defer vfree of compound ops to fix rpc_status UAF\n\nThe rpc_status netlink dumpit
  walks every in-flight svc_rqst under\nrcu_read_lock and, for NFSv4 requests, reads
  opnums out of\nargs->ops[]. But args->ops is a separate vmalloc buffer freed\nsynchronously
  by vfree() in nfsd4_release_compoundargs() at the end\nof every compound. The dumpit's
  rcu_read_lock pins the svc_rqst\nstruct itself (freed via kfree_rcu), but nothing
  defers the vfree\nof the ops buffer across the RCU grace period. A concurrent compound\n\
  completion can therefore free the buffer while the dumpit is reading\nit — a use-after-free
  on vmalloc memory.\n\nThe trailing seqcount recheck (smp_load_acquire of rq_status_counter)\n\
  cannot undo a load that already retired against freed memory.\n\nFix by replacing
  vfree(args->ops) with kvfree_rcu_mightsleep(), which\ndefers the free until after
  an RCU grace period. This makes the\nexisting rcu_read_lock in the dumpit suff"
