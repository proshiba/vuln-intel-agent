title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Fix this_rq() assumptions in dispatch kfuncs\n\nUnder core scheduling, dispatch
  runs from within the core-wide pick and can\ntarget a sibling rq, so ops.dispatch()
  may execute on a CPU different from\nthe dispatched rq's. Several kfunc paths assumed
  the two always coincide:\n\n- scx_dsq_move() decided whether an rq lock is held
  by testing this_rq()'s\n  rq flags and lock-danced accordingly. A dispatch for a
  sibling took the\n  unlocked-context branch and acquired the source rq lock on top
  of the\n  already held dispatched rq lock which could deadlock.\n\n- scx_bpf_sub_dispatch()
  dispatched this_rq() with its stashed\n  sub_dispatch_prev, which is NULL when dispatching
  for a sibling.\n\n- finish_dispatch(), scx_bpf_dsq_reenq() and scx_bpf_dsq_nr_queued()\n\
  \  resolved SCX_DSQ_LOCAL to this CPU's local DSQ rather than the dispatched\n \
  \ rq's. The latter two are callable from other rq-locked operations too,\n  where
  SCX_DSQ_LOCAL"
