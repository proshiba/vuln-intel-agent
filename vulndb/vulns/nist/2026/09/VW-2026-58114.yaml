title: An improper authentication vulnerability in the WS-Security 
  (wsse:UsernameToken) verification routine within the Sofia IPC daemon in 
  Xiongmai IP Camera XM530 firmware HMT.CM2005-v220608.1837 and earlier allows 
  remote attackers to bypass authentication and execute privileged ONVIF actions
  (including PTZ control, stream URL retrieval, and system reboot) via a crafted
  SOAP request supplying the admin username with any arbitrary password when the
  account's stored password is empty.
