title: A weakness has been identified in Rizwan17 inventory-management-system up
  to bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. Affected by this issue is some 
  unknown functionality of the file includes/DBOperation.php of the component 
  List Handler. This manipulation of the argument 
  category_name/brand_name/product_name causes cross site scripting. It is 
  possible to initiate the attack remotely. The exploit has been made available 
  to the public and could be used for attacks. This product is using a rolling 
  release to provide continious delivery. Therefore, no version details for 
  affected nor updated releases are available. The project was informed of the 
  problem early through an issue report but has not responded yet.
