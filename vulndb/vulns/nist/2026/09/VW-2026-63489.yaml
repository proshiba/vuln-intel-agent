title: The Ultra Addons for Contact Form 7 WordPress plugin before 3.5.51 does 
  not validate the type or extension of files uploaded through one of its form 
  fields, and stores them at a predictable public path with the attacker-chosen 
  extension intact, allowing unauthenticated users to upload arbitrary files. 
  The PHP handler shipped by default with the Debian and Ubuntu Apache packages 
  maps .phar to PHP alongside .php and .phtml, so on that stack the uploaded 
  file is executed and the issue leads to Remote Code Execution and full site 
  takeover. Where the host routes only .php to the PHP handler, the same file is
  instead served from the site's own origin with its script intact, leading to 
  Stored Cross-Site Scripting.
