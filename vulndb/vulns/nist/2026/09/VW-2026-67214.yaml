title: A security flaw has been discovered in Thinkware U3000 up to 1.02.04. 
  Affected by this vulnerability is the function GET_STATUS of the component TCP
  Service. The manipulation of the argument wifi_info results in information 
  disclosure. The attack can be executed remotely. The exploit has been released
  to the public and may be used for attacks. The vendor was contacted early 
  about this disclosure but did not respond in any way.
