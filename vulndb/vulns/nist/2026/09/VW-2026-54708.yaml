title: A vulnerability was identified in liufee FeehiCMS up to 2.1.1. The 
  impacted element is the function UeditorAction::init of the file 
  backend/widgets/ueditor/UeditorAction.php of the component UEditor Widget. The
  manipulation leads to unrestricted upload. Remote exploitation of the attack 
  is possible. The exploit is publicly available and might be used. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
