title: Hugo is a static site generator. In versions after v0.123.0 and before 
  v0.166.0, Hugo's symlink confinement checks stopped at the mount root itself, 
  so a theme or module checked into themes/ (or a vendored module) could contain
  a symlink at a mount root (for example themes/mytheme/assets -> 
  /some/dir/outside). Files behind such a symlink were readable during a site 
  build through resources.Get, resources.Match and similar functions, and could 
  be published to public/ via static mounts, bypassing the rule that theme and 
  module mount sources must be local paths. Modules fetched via Go modules are 
  not affected because Go module zips cannot contain symlinks, and this is not 
  an escalation for the main project, which may already mount absolute paths by 
  configuration. Fixed in v0.166.0, where symlinked mount roots and symlinked 
  directories between the mount root and the module directory are treated as 
  non-existent for all modules. As a workaround, inspect themes/ and vendored 
  modules for symlin
