title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usbusx2y: validate URB actual_length in interrupt callback\n\ni_usx2y_in04_int()
  processes the interrupt URB data without checking\nurb->actual_length.  A short
  transfer from a malfunctioning device\nwould cause the handler to process uninitialized
  heap data from the\nkmalloc-allocated in04_buf, which is then copied to the mmap-accessible\n\
  ctl_snapshot[] array.\n\nFix by using kzalloc() for in04_buf to zero-initialize
  the buffer,\nand adding an actual_length check to skip processing on short\ntransfers
  while still resubmitting the URB."
