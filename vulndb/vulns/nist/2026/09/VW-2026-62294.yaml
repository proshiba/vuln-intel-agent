title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-iocost:
  clear delay state when freeing policy data\n\niocg_kick_delay() turns sufficiently
  large debt into an explicit\nblock-cgroup delay with blkcg_set_delay(), setting
  blkg->use_delay to\n-1 and incrementing blkcg->congestion_count.  Clearing it again
  depends\non iocg_kick_delay() running from the period timer, the waitq timer or\n\
  the issue path.\n\nioc_pd_free() removes the iocg from active_iocgs and cancels
  its waitq\ntimer, and no further bios can arrive, so once it has run nothing is\n\
  left which can reduce the debt and clear the delay.  The blkcg stays\nmarked congested
  for the rest of its life.\n\nblk_cgroup_congested() then returns true for every
  task in that cgroup\nand its descendants: page_cache_sync_ra() cuts readahead to
  a single\npage, page_cache_async_ra() skips it altogether, and\n__folio_throttle_swaprate()
  takes swap_avail_lock and schedules a\nthrottle on anonymous folio allocation.\n\
