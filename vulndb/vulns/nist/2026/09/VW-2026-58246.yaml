title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/dasd:
  Propagate partial completion length across ERP recovery\n\ndasd_default_erp_postaction()
  copies the timing and device state from\nthe finished ERP request back to the original
  request but drops\nproc_bytes. A request that was partially completed, an ESE read
  of a\nnot-yet-allocated track returns fewer bytes than requested, and then\nrecovered
  through the ERP chain loses its partial-completion length.\n__dasd_cleanup_cqr()
  then sees proc_bytes == 0 and completes the whole\nrequest instead of requeueing
  the remainder, silently returning zeroed\ndata for the part that was never read.\n\
  \nCarry proc_bytes over to the original request like the other\nper-request state."
