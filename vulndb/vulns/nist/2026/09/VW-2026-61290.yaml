title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  light: ltrf216a: fix runtime PM reference leak in error path\n\nltrf216a_get_lux()
  acquires a runtime PM reference by calling\nltrf216a_set_power_state(data, true).
  However, if\nltrf216a_read_data() fails, the function returns immediately without\n\
  dropping the reference.\n\nThis leaves the runtime PM usage count unbalanced, preventing
  the device\nfrom autosuspending after a failed read.\n\nFix this by releasing the
  runtime PM reference before returning from the\nerror path."
