title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd:
  Fix undefined behavior in devid_write debugfs function\n\nWhen for_each_pci_segment()
  loop completes without finding a matching\nsegment, the pci_seg pointer is not NULL
  but points to an invalid memory\nlocation (the list head). Accessing pci_seg->id
  after the loop causes\nundefined behavior.\n\nFix this by handling the successful
  case inside the loop and returning\n-EINVAL after the loop if no matching segment
  is found."
