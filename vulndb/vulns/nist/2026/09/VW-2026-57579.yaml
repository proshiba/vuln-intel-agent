title: A security vulnerability has been detected in proma-ai Proma up to 
  0.19.37. Affected is the function resolveTargetPath of the file 
  apps/electron/src/main/lib/file-preview-service.ts of the component File 
  Preview Service. Such manipulation of the argument file_path leads to path 
  traversal. Local access is required to approach this attack. The exploit has 
  been disclosed publicly and may be used. Upgrading to version 0.19.52 is able 
  to address this issue. The name of the patch is 
  b7bf78ab74b1552c92fc98c7db9a8a8d92c631df. It is suggested to upgrade the 
  affected component. The PoC's candidateBasePaths parameter name does not match
  the current IPC API (0.19.52 uses FileAccessOptions with internal 
  getPreviewCandidateBasePaths()). The reporter likely targeted 0.16.3 where the
  IPC handler accepted raw string[] base paths. The core vulnerability - 
  basename-collision fallback - is independent of the parameter name and is 
  confirmed in source.
