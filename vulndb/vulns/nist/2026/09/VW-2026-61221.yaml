title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Zero SFP DMA buffer in FRU/I2C bsg handlers\n\nThe FRU and I2C bsg handlers
  stage their transfer in a DMA_POOL_SIZE\n(256-byte) bounce buffer obtained from
  dma_pool_alloc(), which does not\nzero the allocation. They initialize only a few
  leading bytes before\nhanding the buffer to qla2x00_write_sfp().\n\nqla2x00_write_sfp()
  can override the transfer length with a user-supplied\nvalue:\n\n\tif (len == 1)\n\
  \t\topt |= BIT_0;\n\tif (opt & BIT_0)\n\t\tlen = *sfp;\n\n*sfp is the first byte
  of the (user-controlled) payload, so len can grow\nup to 255. The device then DMA-reads
  len bytes from the 256-byte pool\nbuffer. Since only a small prefix was written\n\
  (e.g. MAX_FRU_SIZE == 36 bytes for a FRU version, one byte for a FRU\nstatus register),
  the hardware reads past the initialized region and\nwrites up to ~219 bytes of stale
  DMA-pool heap memory to the device\nflash.\n\nAllocate the buffer with dma_pool_zalloc()
  in all five FRU/I2C handl"
