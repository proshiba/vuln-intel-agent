title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  core: Add lock to usb_wakeup_notification()\n\nAdd a spin lock to usb_wakeup notification
  to prevent a race condition\nwith dereferencing freed memory. This could be hit
  by the xHCI driver as\nit calls this function from an IRQ and could race with the\n\
  hub_disconnect() function, which properly grabs this lock to protect the\nstate
  of the device."
