title: a vulnerability involving an unchecked search path element in Evope 
  Collector, versions prior to 1.1.7.13, allows a local attacker without 
  privileges to load a malicious DLL by placing a ‘wtsapi32.dll’ file in the 
  ‘C:\ProgramData\Evope\’ directory. The ‘Evope.Service.exe’ component, which 
  runs with ‘NT AUTHORITY\SYSTEM’ privileges, loads this DLL without properly 
  verifying its integrity or origin. Successful exploitation could allow code 
  execution with SYSTEM privileges and result in local privilege escalation.
