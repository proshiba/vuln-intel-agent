title: "OpenClaw (npm package 'openclaw') versions >= 2026.3.22 and < 2026.8.1 contain
  an approval-bypass flaw in the exec approval policy: the policy could trust a command-running
  wrapper without inspecting the command carried in its arguments. After an operator
  allowlisted or permanently approved a benign wrapper invocation, a later agent turn
  could substitute an arbitrary inner command and execute it with the OpenClaw process's
  host privileges without a further approval prompt. Exploitation requires the relevant
  wrapper to resolve on the host and a prior operator decision allowing that wrapper.
  Transparent shell carriers and opaque utilities such as process monitors, tracers,
  namespace tools, and proxy wrappers were affected through related trust-resolution
  gaps. Fixed in 2026.8.1."
