title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/log:
  Fix out-of-bounds read on empty message length\n\ndrm_log_draw_kmsg_record() accesses
  s[len - 1] to strip the trailing\nnewline, but len is unsigned int. If len is 0,
  the subtraction wraps\nto UINT_MAX, causing an out-of-bounds read.\n\nAdd an early
  return when len is 0."
