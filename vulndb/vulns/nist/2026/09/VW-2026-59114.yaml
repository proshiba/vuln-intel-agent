title: "Description\n\nNimbus validated `topology.blobstore.map` against the calling
  subject at submission time only. The rebalance\noperation accepts configuration
  overrides and stripped a small set of keys from them, but never re-ran that\nvalidation,
  so a caller authorised to rebalance a topology could introduce a blobstore map entry
  naming a\nblob whose ACL does not grant them access. Supervisors localise whatever
  key the map names, placing the\nblob's contents into the topology's working directory.\n\
  \nThe same advisory covers `listBlobs`, which performed no authorization check and
  passed no subject, unlike\nthe neighbouring `getBlobMeta` and `beginBlobDownload`
  operations. It therefore returned every key in the\nblobstore to any caller able
  to reach the Nimbus Thrift port, which provides the key names that make the\nabove
  practical. On its own the disclosure is metadata only.\n\nMitigation\n\nUpgrade
  to 3.1.0, where rebalance configuration overrides are validated exactly as submission-time\n\
  configuration"
