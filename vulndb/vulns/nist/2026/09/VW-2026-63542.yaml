title: The Empik for Woocommerce plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 1.5.1. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to modify arbitrary WooCommerce product 
  metadata, including Empik logistic class (_empik_logistic_klass), product 
  state (_empik_product_state, _empik_product_state_all_variants), and Empik 
  export and offer flags on any product in the store.
