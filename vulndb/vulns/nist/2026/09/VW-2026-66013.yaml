title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm/pat:
  Acquire init_mm write lock on collapse to avoid UAF\n\nx86 implements page attribute
  modification using its Change Page\nAttributes (CPA) mechanism.\n\nThis tracks properties
  of ranges such as cache mode through x86 page\nattributes, and as part of that logic
  manipulates kernel page tables.\n\nSince commit:\n\n  41d88484c71c (\"x86/mm/pat:
  restore large ROX pages after fragmentation\")\n\nranges of kernel page table entries
  can be collapsed into\nhuge page table entries as part of this logic.\n\nAs part
  of this collapse, it frees the page tables which the collapsed\nentries previously
  pointed to, and it does so without any relevant locks\nbeing held to preclude concurrent
  kernel page table walkers.\n\nThe only way this code can be reached is if CPA_COLLAPSE
  is specified, and\nthis is only set in set_memory_rox() via:\n\nset_memory_rox()\n\
  -> change_page_attr_set_clr()\n-> cpa_flush()\n-> cpa_collapse_large_pages()\n\n\
