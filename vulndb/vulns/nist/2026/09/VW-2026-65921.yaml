title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-ctrls: validate AV1 tile counts\n\nThe stateless AV1 decoders use tile_info.tile_cols
  and tile_rows as loop\nbounds and as indices into the mi_*_starts[] and *_in_sbs_minus_1[]\n\
  arrays, as the divisor for context_update_tile_id, and their product\nbounds the
  per-tile descriptor buffers, but std_validate_compound() does\nnot bound these u8
  fields. Reject a V4L2_CTRL_TYPE_AV1_FRAME whose\ntile_cols or tile_rows exceeds
  V4L2_AV1_MAX_TILE_COLS / _ROWS, or whose\nproduct exceeds V4L2_AV1_MAX_TILE_COUNT.
  A zero tile count is left to the\nconsuming driver so the zero-initialised control
  that existing userspace\nsubmits is still accepted."
