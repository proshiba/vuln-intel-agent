title: A vulnerability was detected in Trusted Domain Project OpenDMARC up to 
  1.4.2. Affected by this vulnerability is the function opendmarc_util_cleanup 
  in the library libopendmarc/opendmarc_util.c of the component DMARC Record 
  Parser. Performing a manipulation results in off-by-one. The attack may be 
  initiated remotely. The exploit is now public and may be used. The patch is 
  named b3b1da9264bc80324094a27c71e7369bdedc62ae. To fix this issue, it is 
  recommended to deploy a patch.
