title: A security flaw has been discovered in MODSetter SurfSense up to 0.0.36. 
  Impacted is an unknown function of the file 
  surfsense_backend/app/routes/editor_routes.py of the component Document Export
  Feature. Performing a manipulation results in server-side request forgery. The
  attack can be initiated remotely. The exploit has been released to the public 
  and may be used for attacks. Upgrading to version 0.0.36.3 is recommended to 
  address this issue. The patch is named 
  2faff7b3823322a9cb6797973e6caf089386c354. The affected component should be 
  upgraded.
