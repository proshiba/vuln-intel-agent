title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncuse:
  wait for pending RCU callbacks on module exit\n\nSince commit 053fc4f755ad (\"fuse:
  fix UAF in rcu pathwalks\"),\nfuse_conn_put() frees the fuse_conn through call_rcu()
  rather than\nsynchronously.  For cuse, fc->release is cuse_fc_release(), which\n\
  lives in the cuse module.  If the module is removed before the RCU\ngrace period
  ends, the callback jumps into freed module memory:\n\n      userspace / module unload\
  \      |        RCU softirq\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \ close(/dev/cuse)                    |\n  cuse_channel_release()             |\n\
  \   fuse_dev_release()                |\n    fuse_conn_put(fch->conn)         |\n\
  \     call_rcu(delayed_release) ------+---> callback queued\n                  \
  \                   |\n rmmod cuse                          |\n  cuse_exit()   \
  \                     |\n   cuse_channel_destroy()            |\n   ...        \
  \                       |\n   return  "
