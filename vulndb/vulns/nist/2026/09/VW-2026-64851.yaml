title: "WEBCON BPS is vulnerable to Insecure Direct Object Reference (IDOR) in the
  /api/vacations/{path} endpoint. The selectedPeople parameter in the Gantt vacation
  chart API does not validate whether the requesting user is authorized to access
  the requested users' data. An authenticated attacker can supply arbitrary user logins
  in the selectedPeople parameter to view vacation schedules of other employees, including
  managers and staff from other offices, regardless of business logic access restrictions,
  resulting in unauthorized disclosure of sensitive scheduling information.This vulnerability
  was fixed in versions: 2025.2.1.177 and 2026.1.1.20"
