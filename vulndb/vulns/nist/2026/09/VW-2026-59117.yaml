title: "Description\n\nThe worker's Netty message decoder is installed ahead of the
  SASL authentication handlers in the pipeline\nand acts on frames before any authentication
  has taken place. It allocated buffers sized from a\nlength field carried in the
  frame, so a single frame from an unauthenticated peer able to reach a worker\nslot
  port could drive a large allocation.\n\n`storm.messaging.netty.authentication` defaults
  to false, and the decoder runs before the handler that\nenforces it in any case,
  so no credentials are required. The attacker needs only TCP reachability to a\n\
  worker port.\n\nThe effect of a single frame at the default 768 MB worker heap has
  not been measured to distinguish\nsustained worker loss from transient garbage-collection
  pressure. The severity assigned to this advisory\nreflects the more conservative
  reading; consumers who require a precise figure should test against their own\n\
  worker heap configuration.\n\nMitigation\n\nUpgrade to 3.1.0, where frames are decoded
  only after the hands"
