title: "PaperCut Print Deploy is an optional component that integrates with PaperCut
  NG/MF which simplifies printer deployment and management. When the component is
  deployed to an environment, the customer has an option to configure the system to
  use a self-signed certificate. If the customer does not fully configure the system
  to leverage the trust database on the clients, it opens up the communication between
  clients and the server to man-in-the-middle attacks. \n\nIt was discovered that
  certain parts of the documentation related to the configuration of SSL in Print
  Deploy were lacking, which could potentially contribute to a misconfiguration of
  the Print Deploy client installation. PaperCut strongly recommends to use valid
  certificates to secure installations and to follow the updated documentation to
  ensure the correct SSL configuration. Those who use private CAs and/or self-signed
  certificates should make sure to copy their Certification Authority certificate,
