title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  sun8i-ss - Remove crypto_rng interface\n\nSince the crypto_rng interface for hardware
  PRNGs is unused and is\nredundant with hwrng and the actual Linux RNG, it's being
  phased out.\nMost drivers for it were already removed.  Go ahead and remove the\n\
  sun8i-ss support which is one of the only remaining ones.\n\nAs usual for crypto_rng,
  this driver was also buggy: its ->generate()\nfunction had a use-after-free vulnerability
  due to using\nwait_for_completion_interruptible_timeout() without handling shutting\n\
  down the DMA operation if a signal is sent.  Also, it had a buffer\noverread bug
  in the line 'memcpy(ctx->seed, d + dlen, ctx->slen);'.\nThere's no point in fixing
  these bugs separately only to remove the code\nanyway, so this commit is marked
  with Fixes and Cc stable."
