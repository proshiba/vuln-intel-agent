title: Tesseract is an open source OCR engine. In version 5.5.3 and earlier, 
  Classify::ReadNormProtos in src/classify/normmatch.cpp parses the NORMPROTO 
  component of a .traineddata file and uses std::istream::operator>>(char*) to 
  extract a whitespace-delimited token into a fixed 61-byte stack buffer without
  setting a stream width. The 100-byte line buffer can carry a token of up to 99
  characters, so a token longer than 60 characters writes up to 39 
  attacker-controlled bytes past the buffer during TessBaseAPI::Init of the 
  legacy engine, causing stack corruption, denial of service, and potentially 
  control-flow hijacking on affected standard-library implementations. Builds 
  using Apple's libc++ C++20 bounded array overload are incidentally protected, 
  while typical libstdc++ builds remain affected. No fixed release is available 
  as of this review.
