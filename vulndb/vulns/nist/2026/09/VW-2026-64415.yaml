title: A vulnerability was found in dgtlmoon changedetection.io up to 50389b07. 
  This vulnerability affects the function add_watch_ui_snapshot of the file 
  changedetectionio/blueprint/add_watch_ui/__init__.py of the component Preview 
  Endpoint. Performing a manipulation of the argument url results in server-side
  request forgery. The attack can be initiated remotely. The exploit has been 
  made public and could be used. Upgrading to version 0.60.1 is able to resolve 
  this issue. The patch is named 71d332d5a0d3da2a0fe89a392413bf4b7d27c84e. The 
  affected component should be upgraded. Was fixed upstream.
