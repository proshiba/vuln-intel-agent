title: Capgo CLI (npm package @capgo/cli) through 7.98.2 is affected by an 
  over-permissioned service account in its Android onboarding flow. When 
  onboarding via Google OAuth, the CLI invites the generated Google Play service
  account with the account-wide Play Console permission 
  CAN_MANAGE_DRAFT_APPS_GLOBAL (passed as developerAccountPermissions in the 
  Android Publisher API User create request), even though the user-facing flow 
  states the service account is invited into a single confirmed app with 
  release-only permissions. As a result, anyone who obtains the generated 
  service account key (PLAY_CONFIG_JSON) can create, edit, and delete draft apps
  across the entire Google Play developer account rather than being limited to 
  the selected package. No patched version was available at the time of 
  publication.
