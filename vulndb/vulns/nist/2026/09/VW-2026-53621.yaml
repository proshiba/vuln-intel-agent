title: n8n before 1.123.73, 2.35.4, and 2.36.2 contains a credential exposure 
  vulnerability in the Strapi, SeaTable, and Mailcheck nodes. These nodes send 
  their decrypted credentials to the authentication endpoint via the raw legacy 
  HTTP helper outside any error handling, causing the plaintext secret to be 
  persisted in execution error data. Any authenticated user can read the 
  plaintext secret from their own execution through the REST API, bypassing the 
  blank-value redaction enforced by the credentials API.
