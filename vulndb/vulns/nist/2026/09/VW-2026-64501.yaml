title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the Jira update_issue 
  attachments argument is converted into local paths and routed to the 
  attachment upload implementation without workspace validation. A caller can 
  make the MCP server read arbitrary local files and attach them to a Jira 
  issue, using the server as a confused deputy to exfiltrate the contents. The 
  advisory traces the vulnerable input and processing flow through jira 
  update_issue, attachments, upload_attachment, and file_path, which identify 
  the affected entry points, controls, and code paths. This issue is fixed in 
  version 0.22.0.
