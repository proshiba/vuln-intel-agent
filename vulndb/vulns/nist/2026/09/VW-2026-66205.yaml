title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  treat any nonzero dio zero-range return as an error\n\nntfs_dio_zero_range() returns
  either 0 or a negative errno from\nblkdev_issue_zeroout(); it never returns a positive
  value.  The\nzeroing failure check in ntfs_attr_fallocate() therefore never fired,\n\
  so a failed zeroing operation was silently ignored: the loop kept\ngoing, the newly
  allocated clusters were folded into initialized_size\nand the write could succeed
  leaving stale on-disk data.\n\nTreat any nonzero return as an error and abort the
  allocation."
