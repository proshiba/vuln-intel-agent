title: OpenZeppelin Contracts Wizard is a web application to interactively build
  a contract out of components from OpenZeppelin Contracts. Prior to 
  @openzeppelin/wizard 0.10.11, @openzeppelin/wizard-cairo 3.0.1, 
  @openzeppelin/wizard-stellar 0.6.2, and @openzeppelin/wizard-stylus 0.3.1, the
  setInfo code path prints info.securityContact and info.license verbatim into 
  single-line comments in generated Solidity, Cairo, Stellar/Soroban, and Stylus
  source. A line terminator ends the comment and causes following input to be 
  emitted as source declarations. Exploitation requires an integration to 
  populate these fields from untrusted input and a user to consume the generated
  source; normal self-service web, AI assistant, CLI, and self-hosted API use 
  does not cross that trust boundary, shared links cannot set the fields, and no
  code executes on a Wizard service. This issue affects generated-source 
  integrity only and is fixed in versions 0.10.11, 3.0.1, 0.6.2, and 0.3.1 of 
  the respective packages.
