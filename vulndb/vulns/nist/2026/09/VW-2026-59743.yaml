title: "Affected versions of MISP can record incorrect access-log data for requests
  that terminate in an exception.\n\n\nBecause CakeErrorController extends AppController,
  exception rendering runs the application startup path a second time. As a result,
  __accessMonitor() calls AccessLog::logRequest() twice for one HTTP request. The
  second deferred writer measures the error-controller execution instead of the original
  request and can overwrite the row created by the first pass. The corrupted fields
  include request duration, SQL query count, memory usage, and potentially the recorded
  query log.\n\n\nThe bug was masked because the same model instance retained the
  ID of the first saved row, causing the later save to issue an UPDATE rather than
  insert an obvious duplicate row.\n\nVersion affected: ≤2.5.45"
