title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  sd: Fix special_vec mempool leak when scsi_alloc_sgtables() fails\n\nsd_set_special_bvec()
  allocates a special payload page for UNMAP and\nWRITE SAME commands. If scsi_alloc_sgtables()
  fails afterward in\nsd_setup_unmap_cmnd() or sd_setup_write_same{10,16}_cmnd(),
  the SCSI\nmidlayer does not call uninit_command() because RQF_DONTPREP is not set\n\
  yet, leaking the page.\n\nCall sd_uninit_command() on error, and clear RQF_SPECIAL_PAYLOAD
  after\nfreeing the page."
