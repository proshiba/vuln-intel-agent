title: "In the MISP sachertortephp library, the Xml::build() static method in lib/Cake/Utility/Xml.php
  contains a logic error in the conditional that gates network-based XML fetching.
  The original condition was written as: $options['readFile'] && strpos($input, 'http://')
  === 0 || strpos($input, 'https://') === 0. Because PHP's && operator has higher
  precedence than ||, the expression is evaluated as ($options['readFile'] && strpos($input,
  'http://') === 0) || strpos($input, 'https://') === 0. As a result, when a caller
  explicitly sets the readFile option to false to disable file and URL reading, an
  input string beginning with https:// still satisfies the condition and triggers
  a network fetch via HttpSocket (configured to follow up to 10 redirects). The http://
  branch is correctly gated by the readFile flag, but the https:// branch is not.
  An attacker who can influence the $input parameter passed to Xml::build() can therefore
  force the application to issue an outbound HTTPS request to an atta"
