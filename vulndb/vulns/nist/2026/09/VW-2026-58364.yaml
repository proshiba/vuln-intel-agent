title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  array: validate array block headers on read\n\narray_block_check() validates blocknr
  and csum and nothing else, while\nnode_check(), next to it, has bounded the structural
  fields since both\nwere written. dm_array_cursor_next() takes its loop bound from
  the\non-disk nr_entries and element_at() is unguarded pointer arithmetic, so\na
  count larger than the block holds keeps the cursor in one block while\nthe index
  grows past it and the read walks off the dm-bufio buffer --\ndm_cache_load_mappings()
  drives it once per cache block at activation.\n\nCheck the header against itself:
  reject a zero value_size, require\nmax_entries to equal calc_max_entries() for that
  value_size and block\nsize, and require nr_entries to fit. Equality rather than
  an upper bound,\nsince a count below the real capacity trips BUG_ON() in fill_ablock()
  and\ntrim_ablock(). Metadata dm-array writes satisfies all three."
