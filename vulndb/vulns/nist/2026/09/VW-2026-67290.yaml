title: "The strncasecmp function in the GNU C Library 2.24 and later optimized for
  the Power8 architecture may read one byte beyond the input size limit, which may
  crash a program when that byte is not readable.\n\nThis condition may happen when
  the input strings to the strncasecmp function are attacker controlled in an application
  and they match all the way up to the edge of their page and the neighbouring page
  is either not mapped or is not readable."
