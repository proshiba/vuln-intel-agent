title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  fib: bound automatic table ID allocation\n\nfib_empty_table() probes every table
  ID from 1 until it finds a\nfree one.  IPv4 tables are stored in a 256-bucket hash
  table, so a\ndense set of IDs makes each probe walk a growing hash chain while\n\
  RTNL is held.\n\nAutomatic table assignment (\"ip rule ... table 0\") is an IPv4-only\n\
  legacy path.  Bound the automatically allocated ID to 4096 so the\nRTNL hold stays
  bounded, without changing lookups of explicitly\nspecified table IDs.\n\nThis changes
  user-visible behavior.  A table-0 rule previously\nreceived the lowest free ID in
  1..RT_TABLE_MAX (0xFFFFFFFF).  After\nthis patch the search stops at 4096 and the
  rule add fails with\nENOBUFS if that range is fully occupied.  Explicit table IDs
  above\n4096 remain usable.\n\nThe automatic path is unused in practice: it is IPv4-only,
  not\ndocumented by ip-rule, uncovered by kernel selftests, and both\nNetworkManager
  and systemd refuse table 0."
