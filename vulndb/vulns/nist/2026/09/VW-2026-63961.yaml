title: A flaw was found in the SmallRye Fault Tolerance library, which is used 
  by Quarkus to provide strategies like retries and circuit breakers for 
  microservices. The issue occurs when using the ApplyGuard or 
  ApplyFaultTolerance annotations, where the library fails to release internal 
  tracking objects after each request. This causes a steady increase in memory 
  usage that eventually leads to the application slowing down and crashing due 
  to lack of memory.
