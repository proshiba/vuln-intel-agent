title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  entry: Avoid unnecessary local_irq_disable() on kernel exit\n\nCurrently, when exiting
  to kernel mode, we attempt involuntary\npreemption. The preemption logic expects
  IRQs to be disabled, which is\nwhy we call local_irq_disable() before attempting
  preemption.\n\nHowever, depending on the context, local_irq_disable() may be\nunnecessary:\n\
  \n- __el1_irq(), the non-NMI EL1 IRQ path, already has IRQs disabled, so\n  local_irq_disable()
  is redundant.\n\n- irqentry_exit_to_kernel_mode_preempt() immediately returns when\n\
  \  exiting from an NMI-like context, so calling local_irq_disable()\n  beforehand
  is unnecessary work.\n\nFurthermore, it confuses the pNMI state tracking when we
  are in a\ncontext with interrupts disabled and the GIC_PRIO_PSR_I_SET bit is set\n\
  in the PMR, leading to a warning when\nCONFIG_ARM64_DEBUG_PRIORITY_MASKING=y:\n\n\
  \     WARNING: ./arch/arm64/include/asm/irqflags.h:63 at arm64_exit_to_kernel_mode+0xb8/0xc0,
  CPU#40"
