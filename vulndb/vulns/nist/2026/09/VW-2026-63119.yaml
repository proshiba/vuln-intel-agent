title: A flaw was found in Netty's Online Certificate Status Protocol (OCSP) 
  Client. The client fails to verify the 'id-kp-OCSPSigning' Extended Key Usage 
  (EKU) in OCSP responder certificates. A remote attacker, holding any valid 
  certificate issued by the same Certificate Authority (CA), can exploit this by
  forging 'GOOD' OCSP responses for revoked certificates. This bypasses 
  certificate revocation checks, allowing applications using Netty's OCSP Client
  to accept certificates that should have been revoked, leading to an 
  authorization bypass.
