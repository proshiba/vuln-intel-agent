title: A vulnerability has been found in aiyiyi121 SxDevOps 1.0/1.1. Affected by
  this vulnerability is the function paramiko.SSHClient.exec_command of the file
  backend/ops/host_tasks.py of the component TASK_RUN_COMMAND. Such manipulation
  of the argument command leads to command injection. The attack may be launched
  remotely. The name of the patch is 2b4bf8585c3e731e7a8af30801ea46680bc783f9. 
  It is advisable to implement a patch to correct this issue. The vendor was 
  contacted early, responded in a very professional manner and quickly released 
  a fixed version of the affected product.
