title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Clear Present bit before tearing down copied context entry\n\ncopied_context_tear_down()
  zeroes the 128-bit context entry with\ncontext_clear_entry() while the Present bit
  is still set, and only then\nissues the context-cache and IOTLB invalidations. \
  \ This leaves a window\nin which hardware can fetch a torn entry, with some fields
  already zeroed\nwhile Present is still set, leading to unpredictable behaviour or\n\
  spurious faults.  While x86 provides strong write ordering, the compiler\nmay reorder
  the writes to the two 64-bit halves of the entry, and the\nhardware fetch is not
  guaranteed to be atomic with respect to multiple\nCPU writes.\n\nThere is no cacheline
  flush before the invalidation either, so on an\nIOMMU without coherent access to
  the context table the zeroed entry may\nnot be visible to hardware at the point
  the invalidation is submitted.\n\nApply the same ownership handshake described in
  the VT-d spec, Section"
