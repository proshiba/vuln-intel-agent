title: "CopyAPIView (awx/awx/api/generics.py:873) sets permission_classes =\n(IsAuthenticated,),
  so DRF's get_object() performs no object-level\nRBAC. The get() handler (lines 988–991)
  explicitly guards with\nrequest.user.can_access(obj._class_, 'read', obj) — but
  post()\n(lines 1001–1010) does not. POST only checks:\n\ncan_access(model, 'add',
  create_kwargs_check)\n\ncan_access(model, 'copy_related', obj)\n\nFor JobTemplate,
  can_add (awx/awx/main/access.py:1465–1520) gates on\n\ninventory.use_role + project.use_role
  +\nexecution_environment.read_role — resource-level roles that do not\nimply read
  on the source JT — and can_copy_related (1522–1534) checks\nonly credentials.use_role.
  None of these imply the caller can read the\nsource JT."
