title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: free vif links after clearing wcid entries on full reset\n\nmt7996_mac_reset_vif_iter()
  queues non-default vif links for kfree_rcu\nwhile dev->wcid[] still holds pointers
  to the wcid embedded in each\nfreed link; mt76_reset_device() then dereferences
  those entries and\nruns mt76_wcid_cleanup() on them. If a grace period elapses in
  between,\nthe cleanup operates on freed memory.\n\nRun mt76_reset_device() first,
  so the wcid entries are cleaned up and\ncleared while the links are still valid."
