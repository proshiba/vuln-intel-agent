title: "ieee802154_send() in subsys/net/l2/ieee802154/ieee802154.c copies the outgoing
  packet into a single fixed 125-byte transmit buffer (tx_frame_buf_pool, sized IEEE802154_MTU).
  In builds with CONFIG_NET_L2_IEEE802154_FRAGMENT enabled (the default whenever CONFIG_NET_6LO
  is set), the branch taken when 6LoWPAN fragmentation is not required performed an
  unchecked net_buf_add_mem(frame_buf, pkt_buf->data, pkt_buf->len). The only guard
  was __ASSERT_NO_MSG() inside net_buf_simple_add(), which is compiled out without
  CONFIG_ASSERT, so an oversized packet silently overran the frame buffer.\n\nThe
  defect is not reachable from the radio: for NET_AF_INET6 packets ieee802154_6lo_encode_pkt()
  compares the whole packet length against IEEE802154_MTU and takes the fragmentation
  path when it does not fit, so every buffer copied on the unfragmented branch is
  within bounds. It is reachable through NET_AF_PACKET sockets bound to an 802.15.4
  interface: for NET_SOCK_RAW the 6LoWPAN block is skipped entirely and "
