title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  smbdirect: free completion queues with ib_free_cq()\n\nsmbdirect_connection_destroy_qp()
  creates the send and receive completion\nqueues with ib_alloc_cq_any(), which for
  IB_POLL_WORKQUEUE arms an\ninternal completion handler that runs ib_cq_poll_work()
  on a workqueue.\nTearing those CQs down with ib_destroy_cq() frees them without
  first\ncancelling that poll work.\n\nIf the provider posts a completion late --
  for example Soft-RoCE (rxe)\nposting an RNR error from rxe_receiver() after rdma_destroy_qp()
  -- the\nhandler re-queues ib_cq_poll_work() on the already-freed CQ, and a\nfollow-on
  access faults in rxe_req_notify_cq().\n\nUse ib_free_cq(), which cancel_work_sync()es
  the poll work before freeing\nthe CQ, so no completion handler can run against a
  freed queue.\n\n[ 1236.599526] ==================================================================\n\
  [ 1236.602142] BUG: KASAN: slab-use-after-free in ib_cq_poll_work+0xd0/0x1a0\n[
  1236"
