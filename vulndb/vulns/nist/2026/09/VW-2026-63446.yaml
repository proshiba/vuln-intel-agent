title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to 7.0.17 and 8.0.6, the 
  SMB parser can retain force-completed transactions on flows where Suricata 
  sees payload in only one direction, including async-oneside flows, because 
  cleanup waits for inspection in the unseen direction. The transaction creation
  paths in rust/src/smb can exceed the intended SMB_MAX_TX bound, and cleanup 
  repeatedly scans the growing list. Sustained one-directional SMB traffic can 
  therefore cause unbounded per-flow state and CPU and memory exhaustion. This 
  issue is fixed in versions 8.0.6 and 7.0.17.
