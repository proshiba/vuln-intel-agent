title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/eeh:
  Fix recursive locking on devices without EEH sensitive driver\n\nThe commit 1010b4c012b0
  (\"powerpc/eeh: Make EEH driver device hotplug\nsafe\") refactored the EEH code
  such that the pci_rescan_remove_lock is\nheld at the beginning of eeh_handle_normal_event()
  and the\neeh_reset_device() is called with that lock being held. Looks like the\n\
  commit missed to remove the existing lock/unlock inside eeh_rmv_device()\nwhich
  is no longer necessary. This is causing the eehd to hang on the\nlock which it actually
  holds when that code path is taken.\n\n[<0>] 0xc00000011c78f870\n[<0>] __switch_to+0xfc/0x1a0\n\
