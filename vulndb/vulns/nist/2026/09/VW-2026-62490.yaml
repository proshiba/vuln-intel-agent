title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt792x: Fix memory leak in SDIO TX path\n\nWhen tx_prepare_skb() returns an
  error in the SDIO TX path, the\nskb is not freed, leading to a memory leak. This
  can occur when\nzero-length frames (such as WNM NULL frames) are dropped to prevent\n\
  potential hardware TX hangs.\n\nFix this by properly releasing the skb with ieee80211_tx_status_ext()\n\
  when tx_prepare_skb() fails."
