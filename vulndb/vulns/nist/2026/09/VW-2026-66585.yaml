title: OpenClaw (npm package openclaw) before 2026.7.1 incorrectly binds Signal 
  approval reactions. In affected versions, a reaction intended to resolve a 
  structured approval request could instead attach to ordinary outbound text 
  when unrelated outbound messages and a pending approval are present in the 
  same conversation. As a result, an approver's reaction to unrelated text could
  be interpreted as approving or denying a pending host action; the practical 
  impact depends on the pending request, conversation timing, and the actions 
  available to the OpenClaw process. The issue does not change the authority of 
  correctly identified approvers. This is fixed in version 2026.7.1.
