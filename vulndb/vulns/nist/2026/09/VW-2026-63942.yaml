title: "The Intel SEDI IPM (inter-processor mailbox) driver in drivers/ipm/ipm_sedi.c
  handles an inbound message interrupt in ipm_event_dispose(). It read the peer-written
  doorbell register, extracted the payload length with IPC_HEADER_GET_LENGTH(), and
  passed that length straight to sedi_ipc_read_msg() to copy the message into struct
  ipm_sedi_context.incoming_data_buf, without checking it against the buffer size.
  The doorbell length field is 10 bits wide (IPC_HEADER_LENGTH_MASK is 0x03FF), so
  it can encode up to 1023 bytes, while incoming_data_buf is IPC_DATA_LEN_MAX (128)
  bytes. The bounds check in the underlying HAL sedi_ipc_read_msg() is a DBG_CHECK
  that compiles away unless CONFIG_DEBUG is set, so no check remained in a production
  image.\n\nThe doorbell register is written by the peer processor on the other side
  of the IPC link — for the intel_ish_5_* targets, the host CPU's ISH driver, reached
  through the device's memory-mapped register window. Host-side software with driver-level
  or raw B"
