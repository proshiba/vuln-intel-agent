title: rhwp is an HWP viewer and editor implemented in Rust and WebAssembly. 
  Prior to rhwp 0.7.15 and rhwp Chrome and Firefox extension 0.2.4, the browser 
  extensions use an all-URLs host permission to detect HWP and HWPX links on 
  visited pages, but the service workers do not validate message senders, URL 
  schemes, or destination addresses before privileged fetches. The affected 
  paths are rhwp-chrome/manifest.json, rhwp-chrome/content-script.js, 
  rhwp-chrome/sw/message-router.js, rhwp-chrome/sw/thumbnail-extractor.js, 
  rhwp-firefox/manifest.json, rhwp-firefox/content-script.js, 
  rhwp-firefox/sw/message-router.js, and rhwp-firefox/sw/thumbnail-extractor.js.
  An untrusted page can make the fetch-file and extract-thumbnail handlers 
  request localhost or private-network resources. When a target HWP or HWPX file
  contains an extractable PrvImage, the extension returns the preview as a data 
  URI in page-readable DOM, allowing page script to read it. The flaw also 
