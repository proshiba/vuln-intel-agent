title: "An argument-injection flaw was found in the Ansible Automation Platform automation-controller\n\
  system-job subsystem. The system-job template launch endpoint stores a user-supplied
  \"days\"\nvariable without running the integer validation defined elsewhere for
  that field, and the\ndispatcher flattens the management-command argument list into
  a single string with spaces before\nthe job runner re-splits it, so spaces in the
  value become additional command-line arguments.\nBecause system jobs are executed
  in-process on the control node without the container isolation\napplied to all other
  job types, an authenticated user with superuser privileges can inject\narbitrary
  arguments — including Python's path option — into the control-plane awx-manage process,\n\
  controlling its argument vector and the first entry of its module search path. Full
  remote code\nexecution requires an additional import gadget that is not present
  in the current management\ncommands, so the demonstrated impact is argument injection "
