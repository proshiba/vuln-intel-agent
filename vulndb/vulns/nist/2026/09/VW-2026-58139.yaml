title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7615: avoid waiting for mac work under the mt76 mutex\n\nmt7615_suspend()
  acquired the mt76 mutex and then called\ncancel_delayed_work_sync() on mac_work.\
  \  mt7615_mac_work() acquires the\nsame mutex via mt7615_mutex_acquire() at the
  top of the worker, so if\nmac_work is already running and blocked on the mutex,
  the suspend path\ndeadlocks waiting for the work it holds the mutex against.\n\n\
  Flush scan_work and mac_work before taking the mutex, matching the\nsuspend paths
  in mt7921 and mt7925.  scan_work only takes the mt76\nspinlock, but moving it keeps
  the sequence consistent.  This also keeps\nmac_work from running over an already
  suspended HIF, which the previous\nsplit (async cancel under the lock, sync cancel
  after release) would\nhave allowed."
