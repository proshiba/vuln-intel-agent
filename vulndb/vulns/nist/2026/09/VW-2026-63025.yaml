title: "The GPTranslate – Multilingual AI Translation Agent for WordPress: Translate
  Your Site with AI plugin for WordPress is vulnerable to Sensitive Information Exposure
  in all versions up to, and including, 2.34.6 via the enqueue_frontend_scripts. This
  makes it possible for unauthenticated attackers to extract the plaintext third-party
  AI provider API key (OpenAI, DeepL, xAI/Grok, Gemini, Claude, or Google Cloud Translation)
  — a credential granting billed account access — by fetching any public page and
  applying the inverse transformation bundled in the plugin's own public JavaScript
  asset. This exposure affects the default configuration (gpt-3.5-turbo in client
  mode) and all supported non-DeepSeek providers; only deepseek-* models and gpt-*
  models configured in server-proxy mode correctly suppress key emission."
