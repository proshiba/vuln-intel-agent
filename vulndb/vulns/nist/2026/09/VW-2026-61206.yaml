title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Don't query firmware state while chip is down\n\nqla2x00_fw_state_show()
  initializes rval to QLA_FUNCTION_FAILED and jumps\nto the out: label when the chip
  is down or EEH is busy. The out: block\nthen re-issued qla2x00_get_firmware_state()
  because rval != QLA_SUCCESS,\ndefeating the chip-down/EEH-busy guards and issuing
  a mailbox command\n(outside optrom_mutex) during ISP reset or PCI error recovery,
  which can\nhang the adapter. It also turned a normal in-lock mailbox failure into
  a\nsecond unsynchronized mailbox attempt.\n\nMake the out: fallback only mark the
  firmware state as unknown. The\nmailbox is now issued at most once, inside optrom_mutex,
  and only when\nthe chip is up and not EEH-busy."
