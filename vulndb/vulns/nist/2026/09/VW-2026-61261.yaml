title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  BPF: Move arena register slot below TCC context\n\nCurrently, the stack layout places
  the optional arena register slot\nabove the tail call counter context. When arena_vm_start
  is dynamically\nenabled, it shifts the relative offset of the tcc_ptr slot within
  the\nstack frame, causing hardcoded tracking macros to mismatch and leading\nto
  memory misalignment or corruption potentially.\n\nTo fix this, move the arena register
  save and restore sequences below\nthe tail call counter context slots in both build_prologue()
  and the\nepilogue.\n\nUpdate __build_epilogue() to insert a proper offset decrement
  to safely\nskip the unneeded tcc_ptr reading block while accurately aligning with\n\
  the relocated arena slot at the very bottom.\n\nWith this patch, the tcc_ptr slot
  is always positioned at a fixed\ndistance directly underneath the base callee-saved
  registers that is\nindependent of whether the arena features are on."
