title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  codecs: lpass-wsa-macro: Fix enum kcontrol accesses\n\nEAR SPKR PA Gain\" and the
  four \"WSA RX* Mux\" controls are enumerated,\nbut their get and put callbacks access
  the value through\nucontrol->value.integer.value[0] (a long) instead of\nucontrol->value.enumerated.item[0]
  (an unsigned int).\n\nThis same pattern was fixed in the sibling drivers by\ncommit
  bcfe5f76cc40 (\"ASoC: codecs: rx-macro: fix accessing array\nout of bounds for enum
  type\") and\ncommit 0ea5eff7c606 (\"ASoC: codecs: va-macro: fix accessing array\n\
  out of bounds for enum type\"), but wsa-macro was missed.\n\nOn 64-bit kernels with
  CONFIG_SND_CTL_DEBUG this trips the elem value\nsanity check and every read of these
  controls fails with -EINVAL."
