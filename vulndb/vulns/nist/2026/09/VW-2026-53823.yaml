title: node-csv is a full-featured CSV parser with a simple API that is tested 
  against large datasets. Prior to 7.0.2, csv-parse with the columns and 
  group_columns_by_name options enabled treats a duplicate __proto__ header as 
  an existing property in packages/csv-parse/lib/api/index.js, assigns an 
  attacker-controlled array through obj['__proto__'], and replaces the parsed 
  record object's prototype. A malicious CSV header can therefore inject 
  inherited array values into the returned record, hide those inherited values 
  from JSON serialization, and affect property enumeration and type or shape 
  checks in applications that process the record. This issue is fixed in version
  7.0.2.
