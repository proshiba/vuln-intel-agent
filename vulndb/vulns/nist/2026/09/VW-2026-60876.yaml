title: 'Vulnerability in the PeopleSoft Enterprise PeopleTools product of Oracle PeopleSoft
  (component: Integration Broker).  Supported versions that are affected are 8.61-8.63.
  Easily exploitable vulnerability allows low privileged attacker with network access
  via HTTP to compromise PeopleSoft Enterprise PeopleTools.  While the vulnerability
  is in PeopleSoft Enterprise PeopleTools, attacks may significantly impact additional
  products (scope change).  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all PeopleSoft Enterprise
  PeopleTools accessible data. CVSS 3.1 Base Score 7.7 (Integrity impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N).'
