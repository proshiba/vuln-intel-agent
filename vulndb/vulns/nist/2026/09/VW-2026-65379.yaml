title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/isolation:
  Defer freeing of cpumask memblock memory to initcall\n\nWhen testing a linux-next
  kernel with commit 59bd1d914bb5 (\"memblock:\nwarn when freeing reserved memory
  before memory map is initialized\"),\nthe following warning was hit when there was
  a \"nohz_full\" kernel boot\nparameter.\n\n  Cannot free reserved memory because
  of deferred initialization of the memory map\n  WARNING: mm/memblock.c:904 at __free_reserved_area+0xde/0xf0,
  CPU#0: swapper/0/0\n    :\n  Call Trace:\n   <TASK>\n   memblock_phys_free+0xcb/0x100\n\
  \   housekeeping_init+0x14c/0x170\n   start_kernel+0x207/0x450\n   x86_64_start_reservations+0x24/0x30\n\
  \   x86_64_start_kernel+0xda/0xe0\n   common_startup_64+0x13e/0x141\n   </TASK>\n\
  \nIOW, we shouldn't free memblock allocated memory so early\nin the boot process
  when memory map isn't fully initialized in\ndeferred_init_memmap().\n\nFix it by
  saving the housekeeping cpumask memblock memory to be\nfreed into a llist f"
