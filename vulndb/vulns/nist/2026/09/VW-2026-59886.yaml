title: OneNav v1.2.4 contains an authenticated arbitrary file deletion 
  vulnerability in the Api::upload() method in class/Api.php. An authenticated 
  administrator can submit a non-HTML upload filename matching an existing file 
  in the application's working directory. The application passes the 
  user-controlled filename to unlink() when rejecting the upload, potentially 
  causing file deletion and denial of service.
