title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  qcom: dispcc-eliza: Fix disp_cc_mdss_mdp_clk_src RCG stall on Eliza EVK\n\nEliza
  EVK (eliza-cqs-evk.dts) does not have display enabled, however its\nDisplay Clock
  Controller is enabled and references parent clocks from\nDSI PHYs, which causes
  clock reparenting issues during probe (init) and\nwarning on Eliza EVK:\n\n  disp_cc_mdss_mdp_clk_src:
  rcg didn't update its configuration.\n  WARNING: drivers/clk/qcom/clk-rcg2.c:136
  at update_config+0xd4/0xe4, CPU#1: udevd/273\n  ...\n    update_config (drivers/clk/qcom/clk-rcg2.c:136
