title: The W3 Total Cache plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Comment Content via LazyLoad Background Mutator in 
  all versions up to, and including, 2.10.5 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. This requires the "Lazy Load Images" feature
  with "Process background images" to be enabled, and the malicious comment to 
  be approved by a moderator before execution is triggered.
