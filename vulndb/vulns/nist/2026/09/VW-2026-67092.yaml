title: "A security flaw has been discovered in amirsanni Mini-Inventory-and-Sales-Management-System
  up to 81bf0b55f5933f3b0dbb1583204a612e06605b95. The impacted element is the function
  order_by of the file DB_query_builder.php of the component Database Query Builder.
  Performing a manipulation of the argument orderBy results in sql injection. Remote
  exploitation of the attack is possible. The exploit has been released to the public
  and may be used for attacks. This product follows a rolling release approach for
  continuous delivery, so version details for affected or updated releases are not
  provided. The project maintainer confirms: \"I stopped maintaining that project
  for a while now, so I'm not sure it's worth fixing.\" This vulnerability only affects
  products that are no longer supported by the maintainer."
