title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  drop recovered reloc root refs on recovery failure\n\nDuring relocation recovery,
  each fs root gets a reference to its relocation\nroot. If loading or adding a later
  root fails, or if the first transaction\ncommit fails, btrfs_recover_relocation()
  jumps to out_unset before\nmerge_reloc_roots() and clean_dirty_subvols().\n\nput_reloc_control()
  drops the list-owned relocation root references, but it\ndoes not clear fs_root->reloc_root
  or drop the references owned by those\npointers. Mount cleanup only drops them when
  BTRFS_FS_ERROR is set, so an\nerror such as -ENOMEM while processing a later root
  can leave references\nbehind.\n\nKeep temporary references to the fs roots associated
  during recovery. On\nfailure, clear their reloc_root pointers and drop the corresponding\n\
  references. Once the first transaction commit succeeds, drop only the\ntemporary
  fs root references and let the normal merge and cleanup paths\nhandle the relocat"
