title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Check pointer type for all atomic RMW paths\n\nAtomic RMW verification records an
  instruction pointer type only when the\ncurrent destination is PTR_TO_ARENA. A second
  path can therefore reach the\nsame instruction with an ordinary pointer without
  comparing it against the\nsaved arena type.\n\nThe post-verification fixup uses
  the saved type to rewrite the instruction\nto BPF_PROBE_ATOMIC for every path. Record
  the actual destination type for\nall atomic RMW paths so the existing mismatch check
  rejects incompatible\nuses of one instruction."
