title: Sentry is an error tracking and performance monitoring tool. From 23.11.0
  until 26.7.0, Sentry instances with the relocation feature enabled unsafely 
  deserialize a legacy database field while importing a user-supplied relocation
  archive. An authenticated user can craft an archive that causes arbitrary code
  execution in the import worker process. Self-hosted installations using the 
  default configuration are not affected because the relocation feature is 
  disabled by default. This issue is fixed in version 26.7.0.
