title: "An XML External Entity (XXE) vulnerability exists in the XML collector of
  multiple versions of OpenNMS Meridian and Horizon. When OpenNMS collects XML from
  a source whose response is attacker-controlled (for example a compromised monitored
  host or an HTTP man-in-the-middle position), the collector's XML parser resolves
  external entities and external DTDs. This allows an attacker to read files accessible
  to the OpenNMS service account, including database credentials, and to induce out-of-band
  requests.\n\n\n\nThe solution is to upgrade to Meridian 2024.3.13, 2025.0.10 and
  Horizon 36.0.4 or newer. Meridian and Horizon installation instructions state that
  they are intended for installation within an organization's private networks and
  should not be directly accessible from the Internet."
