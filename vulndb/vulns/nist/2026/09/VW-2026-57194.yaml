title: 'knowns (npm package) versions <= 0.29.1 contain a path traversal vulnerability
  in the Document API. The HTTP handler in internal/server/routes/docs.go normalizes
  the user-supplied document path with cleanDocPath(), which strips leading/trailing
  slashes and the .md suffix but does not neutralize ../ traversal sequences, and
  internal/storage/doc_store.go then builds the target path with filepath.Join(ds.docsDir(),
  filepath.FromSlash(doc.Path)+".md") without verifying that the resolved path remains
  inside the documents directory. In the default deployment, where the Management
  API is unauthenticated and bound to all interfaces, a remote unauthenticated attacker
  can supply a traversal payload (for example {"path": "../../../../tmp/knowns_pwn_marker"}
  to POST /api/docs, or an encoded path to GET /api/docs/...) to read, create, overwrite,
  or delete arbitrary files with a .md extension anywhere on the host filesystem and
