title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  pcm: Serialize PCM mmap with buffer reallocation to fix page UAF\n\nsnd_pcm_hw_params()
  and snd_pcm_hw_free() guard buffer reallocation\nwith an mmap_count check performed
  under the PCM stream lock, but the\nlock is released long before the buffer is actually
  freed:\nsnd_pcm_sync_stop(), constraint refinement and do_free_pages() all\nhappen
  in between.  snd_pcm_mmap_data(), on the other hand, takes no\nlock at all: it validates
  against the old buffer's state and\ndma_bytes, remaps its pages into the VMA, and
  only then increments\nmmap_count.\n\nA concurrent mmap() can therefore slip in between
  the check and the\nfree.  remap_pfn_range() installs writable PTEs for the old buffer's\n\
  pages without taking page references, and the subsequent\ndo_free_pages() returns
  those pages to the page allocator while the\nVMA still maps them.  This leaves a
  stale, writable mapping of freed\npages: a page-level use-after-free that can be
  leverag"
