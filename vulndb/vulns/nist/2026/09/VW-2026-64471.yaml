title: 'plone.app.portlets.portlets provides a Plone-specific user interface for plone.portlets,
  as well as a standard set of portlets that ship with Plone. Starting in version
  5.0.0 and prior to versions 5.0.8, 6.0.4, and 7.0.2, the Classic portlet (plone.app.portlets.portlets.classic)
  used its user-supplied template/macro fields to build a TALES path expression that
  was then evaluated by the TAL path() helper. Because the value was interpreted as
  a full TALES expression, a user able to add or edit a Classic portlet could supply
  a crafted value that escapes simple path traversal and is evaluated as arbitrary
  code. This is exploitable by any authenticated user who can configure a Classic
  portlet - which, with the default role map, includes regular users on their personal
  dashboard. The result is code execution in the context of the Plone process, i.e.
  a privilege escalation across the trust boundary between an authenticated web user
  and the server-side process. The problem has been patched in '
