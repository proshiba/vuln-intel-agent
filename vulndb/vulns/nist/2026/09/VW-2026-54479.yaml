title: Coolify through 4.3.17 contains an authentication bypass vulnerability in
  the OAuth callback handler that signs users into existing accounts based 
  solely on email address without verifying provider assertions or binding OAuth
  identities. Attackers can register a victim's email address on any enabled 
  OAuth provider to obtain authenticated sessions as that user, bypassing 
  password requirements and two-factor authentication.
