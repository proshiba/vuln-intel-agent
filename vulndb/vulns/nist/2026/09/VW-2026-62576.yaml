title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal:
  intel: int3400: clean up ODVP on probe failures\n\nevaluate_odvp() creates per-ODVP
  sysfs files before the thermal zone\nand later probe resources are registered. The
  current unwind path only\ncalls cleanup_odvp() from the late sysfs failure path,
  so failures after\nevaluate_odvp() but before that label, including\nthermal_tripless_zone_device_register()
  failures, leave the ODVP files\nand storage behind.\n\nMove the ODVP cleanup to
  the common ART/TRT unwind path so every failure\nafter evaluate_odvp() releases
  the ODVP state. Also clear the cached\nODVP pointers in cleanup_odvp(), because
  evaluate_odvp() can already call\nit for partial setup failures while probe continues."
