title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  harden gss_unwrap_resp_priv length checks\n\ngss_unwrap_resp_priv() validates the
  RPCSEC_GSS opaque length with\n\n    offset = (u8 *)(p) - (u8 *)head->iov_base;\n\
  \    if (offset + opaque_len > rcv_buf->len)\n            goto unwrap_failed;\n\
  \    maj_stat = gss_unwrap(ctx->gc_gss_ctx, offset,\n                          offset
  + opaque_len, rcv_buf);\n\nBoth operands are u32 and the sum is computed in u32.
  A reply with\nopaque_len near 0xffffffff makes offset + opaque_len wrap to a small\n\
  value that is below rcv_buf->len, so the bound check passes and\ngss_unwrap() is
  called with end < begin. The check also lacks a\nlower bound, so any opaque_len
  in [0, GSS_KRB5_TOK_HDR_LEN) is\naccepted and forwarded to gss_krb5_unwrap_v2(),
  whose pre-decrypt\nheader reads at ptr+4 and ptr+6 then run past the token.\n\n\
  A krb5p NFS server returning a crafted RPCSEC_GSS reply can drive\nthe client into
  out-of-bounds reads in gss_krb5_unwrap_v2() and"
