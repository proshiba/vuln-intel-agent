title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  control: Don't add invalid kcontrols to LED layer\n\nThe kcontrol LED state layer
  tries to track the all associated\nkcontrol elements with naive assumptions that
  they are readable.\nBut one can create a write-only element that has no get callback
  (even\na user element can do it), and this may lead to a NULL dereference at\nthe
  call chain of snd_ctl_led_notify(), as found by syzkaller.\n\nFor avoiding the Oops,
  add a sanity check of the kcontrol's info and\nget callbacks, and just skip the
  invalid kcontrols before assigning\nthe kctl to the LED layer."
