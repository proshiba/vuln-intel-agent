title: Netty's HTTP/3 codec (io.netty:netty-codec-http3) versions 4.2.0.Final 
  through 4.2.17.Final contain an uncontrolled resource consumption 
  vulnerability in the QPACK encoder-stream instruction decoder 
  (QpackEncoderHandler, installed on the peer-initiated unidirectional QPACK 
  encoder stream, type 0x02). The handler accepts an attacker-declared 
  string-literal length of up to Integer.MAX_VALUE (~2 GiB) for the Name Length 
  and Value Length fields of the "Insert With Literal Name" instruction (RFC 
