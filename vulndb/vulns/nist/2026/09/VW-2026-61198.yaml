title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Skip NVMe LS reject IOCB when FW not started\n\nqla_nvme_xmt_ls_rsp() bails
  out to the out: label when firmware is not\nstarted (!ha->flags.fw_started), but
  the out: path unconditionally calls\nqla_nvme_ls_reject_iocb(), which ends in qla2x00_start_iocbs()
  and an\nunconditional doorbell write to the request queue in-pointer register.\n\
  This rings the firmware doorbell and queues an IOCB that stopped or\nresetting firmware
  cannot consume, and touches MMIO during the reset/EEH\nwindow where fw_started is
  also clear.\n\nOnly emit the LS reject IOCB (and ring the doorbell) when fw_started
  is\nset; otherwise just clean up and return. The post-allocation failure\ncases
  (SRB alloc / qla2x00_start_sp() failure) run with firmware started\nand still send
  the reject. Apply the same guard to the reject emission\nin qla2xxx_process_purls_pkt()."
