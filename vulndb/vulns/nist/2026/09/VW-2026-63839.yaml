title: A flaw was found in the authentication session management of Keycloak, an
  identity and access management solution. The issue occurs when an 
  administrator enforces a stronger authentication flow, such as mandatory 
  two-factor authentication (2FA) setup, through a client policy. A user can 
  bypass this requirement by manually visiting a specific session restart web 
  link during the login process. This action clears the internal markers that 
  track the required security steps, allowing the user to log in with only a 
  password and gain access without completing the mandated 2FA setup.
