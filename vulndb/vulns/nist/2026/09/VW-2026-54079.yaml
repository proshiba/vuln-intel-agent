title: AgentScope through 2.0.7.post1 contains a path traversal vulnerability in
  LocalWorkspace.add_skill that copies arbitrary server directories into the 
  agent workspace via an unconfined source path parameter. Attackers can supply 
  any directory path in the skill_path request parameter to copy files into the 
  skills directory, making them accessible through the workspace skill listing.
