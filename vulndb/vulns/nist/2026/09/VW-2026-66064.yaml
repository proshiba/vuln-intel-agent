title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost/vdpa:
  reject VRING_NUM larger than device max\n\nvhost_vring_set_num() accepts any non-zero
  power-of-two queue size that\nfits in 16 bits. vhost-vdpa then passes that value
  to set_vq_num()\nwithout comparing it with get_vq_num_max().\n\nA process with access
  to /dev/vhost-vdpa-* can therefore configure a\nqueue larger than the device advertises.
  With vdpa_sim, the worker can\nwalk descriptors beyond the mapped descriptor ring.
  KASAN reports a\n16-byte out-of-bounds read, corresponding to one vring_desc, in
  the\nvringh IOTLB path:\n\n  BUG: KASAN: out-of-bounds in _copy_from_iter\n  Read
  of size 16\n  copy_from_iotlb\n  copydesc_iotlb\n  vringh_getdesc_iotlb\n  vdpasim_net_work\n\
  \nCache get_vq_num_max() immediately after reset. Some backends derive\nit from
  writable queue-size state, so querying it after SET_NUM may\nreturn the current
  size instead of the device capability. Invalidate\nthe cached value before reset
  so a failed reset l"
