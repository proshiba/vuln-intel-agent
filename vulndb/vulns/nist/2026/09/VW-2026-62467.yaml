title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: clear stale link state on full reset\n\nAfter a full chip reset, mac80211
  reconfig replays interface, link and\nchannel context setup. mt7996_vif_link_add()
  short-circuits when the\nlink_id is still marked in mvif->valid_links, a state introduced
  for\npostponing link teardown to interface removal. The reset path frees the\nlink
  structures without clearing those bits, so the replayed setup never\nre-creates
  dev_info/bss_info/STA records in the restarted firmware and\nnever re-registers
  the link wcid, leaving the device inoperative.\n\nThe reset path also leaks every
  allocated MLD index: per-link indices\nand the per-vif group/remap indices are re-allocated
  from scratch during\nreconfig, but the old bits stay set in the masks, so repeated
  full\nresets exhaust the index space.\n\nClear valid_links in the reset vif iterator
  and reset the MLD index\nmasks alongside the existing omac_mask clearing."
