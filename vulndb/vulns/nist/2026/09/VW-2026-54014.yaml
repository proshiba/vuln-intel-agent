title: Openpanel before 2.3.0 contains an unauthenticated full-read server-side 
  request forgery (SSRF) vulnerability in the GET /tools/site-checker endpoint 
  (apps/api/src/controllers/tools.controller.ts). The endpoint passes a 
  user-supplied url query parameter to fetchWithRedirects() and performs 
  server-side HTTP requests to arbitrary URLs without any SSRF/IP validation. An
  unauthenticated remote attacker can access cloud instance metadata endpoints, 
  probe internal services, scan internal network ports, and read returned 
  content (status code, page size, timing, and parsed HTML metadata), and leak 
  internal IP addresses (via getIPInfo() to a third party).
