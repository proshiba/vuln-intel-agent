title: "A security vulnerability was discovered in Fleet's Helm template preprocessing
  where templates evaluated by the Fleet controller could reach network resources
  outside the management cluster. A user who can supply bundle content to a repository
  referenced by a `GitRepo` resource can cause the Fleet controller to:\n- Disclose
  cluster metadata available to the templating context.\n- Reveal information about
  hosts reachable from the controller's network position.\nBecause the disclosure
  channel is name resolution, it may remain effective in environments where outbound
  traffic is otherwise restricted. The disclosed information is limited to values
  exposed to the Fleet templating context and to name resolution results. Integrity
  and availability of managed clusters are not affected.\n\nThis issue affects Fleet:\n\
  from 0.12.0 before 0.12.19, \nfrom 0.13.0 before 0.13.15, \nfrom 0.14.0 before 0.14.10,\
  \ \nfrom 0.15.0 before 0.15.6, and\nfrom 0.16.0 before 0.16.1."
