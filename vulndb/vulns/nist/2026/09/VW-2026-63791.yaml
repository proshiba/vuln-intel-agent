title: A vulnerability was identified in 03-lovepreetSingh MCP up to 
  f95d035c5317fad81af9828286631053ccb23546. This issue affects the function 
  create_file of the file app/api/mcp/route.ts. Such manipulation of the 
  argument filePath/content leads to path traversal. The attack can be launched 
  remotely. The exploit is publicly available and might be used. This product 
  does not use versioning. This is why information about affected and unaffected
  releases are unavailable. The project was informed of the problem early 
  through an issue report but has not responded yet.
