title: "The AIL Framework (ail-project/ail-framework) contains a stored cross-site
  scripting (XSS) vulnerability in two Jinja2 templates that render popovers for matched,
  tracked, or tagged content: var/www/templates/chats_explorer/block_message.html
  and var/www/templates/objects/item/show_item.html. In both templates, dynamic values
  associated with this content, including icon color, icon style, icon glyph, subtype,
  identifier, name, description, and matched value, are interpolated directly into
  the data-content HTML attribute of Bootstrap popover elements without appropriate
  output encoding. Because the popovers are configured with data-html=\"true\", the
  content is interpreted as HTML in the victim's browser. An authenticated attacker
  who can influence matched, tracked, or tagged content may inject arbitrary HTML
  or JavaScript into these values. When a victim displays the affected popover, the
  injected markup may execute in the victim's session, potentially enabling data exfiltration
  or actio"
