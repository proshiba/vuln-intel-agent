title: Joomla Extension - balbooa.com - Unauthenticated upload filename stored 
  XSS in Balbooa Forms < 2.4.3.4 - The public form upload endpoint validates the
  uploaded file's extension and detected MIME type, but stores the 
  attacker-supplied original multipart filename verbatim in 
  `#__baforms_submissions_attachments.name`. A later anonymous form submission 
  associates that temporary attachment with the newly created submission. When 
  an administrator opens the submission, the component's JavaScript retrieves 
  the stored attachment record and concatenates `file.name` directly into an 
  HTML string. The complete string is assigned to `innerHTML`.
