title: Craft CMS versions before 5.10.11 contain a broken access control 
  vulnerability in the element-indexes/save-elements endpoint that allows 
  control panel users to move entries into sections they cannot edit. Attackers 
  with limited section permissions can relocate or publish entries to 
  unauthorized sections by overwriting the sectionId attribute after initial 
  authorization checks, bypassing the destination section permission validation.
