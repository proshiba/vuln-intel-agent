title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  loongson: Fix error handling in ACPI property parsing\n\nIn loongson_card_parse_acpi(),
  the return value of\ndevice_property_read_string() for the `codec-dai-name` property
  was\nignored. If the property is missing or invalid, an uninitialized pointer\n\
  would be used later, potentially leading to undefined behavior.\n\nFix this by checking
  the return value and propagating the error\nappropriately."
