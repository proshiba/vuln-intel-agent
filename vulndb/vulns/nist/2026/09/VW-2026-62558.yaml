title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix CFI mismatch in task work callback\n\nBPF subprograms use the bpf_callback_t
  ABI, but task work invokes the\ncallback through a three-argument function pointer.
  This trips kCFI.\n\nStore and invoke the callback as bpf_callback_t."
