title: MONAI through 1.6.0 contains a remote code execution vulnerability in the
  bundle configuration engine that resolves _target_ values to arbitrary 
  importable callables without an allow list and passes $ expressions to Python 
  eval(). Attackers can publish a malicious bundle with crafted configuration 
  containing arbitrary code that executes when a victim loads the bundle using 
  monai.bundle.load() or monai.bundle.run().
