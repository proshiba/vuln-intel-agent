title: A vulnerability has been found in a2ui-project a2ui up to 0.10.7. 
  Affected by this vulnerability is the function httpx.get of the file 
  agent_sdks/python/a2ui_agent/src/a2ui/extensions/file_resolve/file_resolver.py
  of the component FileResolver. The manipulation leads to server-side request 
  forgery. It is possible to initiate the attack remotely. The identifier of the
  patch is 2bb8423060308bbdea8ba468dabed4fc256d18ea. To fix this issue, it is 
  recommended to deploy a patch.
