title: A weakness has been identified in andreashappe cochise up to 0.4.1. 
  Affected is the function asyncssh.connect of the file 
  src/cochise/ssh_connection.py of the component SSH Host Key Handler. Executing
  a manipulation can lead to improper certificate validation. The attack may be 
  launched remotely. The attack requires a high level of complexity. The 
  exploitability is told to be difficult. The exploit has been made available to
  the public and could be used for attacks. The project was informed of the 
  problem early through an issue report but has not responded yet.
