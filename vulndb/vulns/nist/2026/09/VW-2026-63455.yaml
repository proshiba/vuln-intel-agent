title: Open edX Platform enables the authoring and delivery of online learning 
  at any scale. From Aspen.1 until Ulmo and Verawood.1, 
  openedx/core/lib/extract_archive.py uses _is_bad_path to validate 
  safe_extractall targets by comparing resolved path strings with startswith 
  instead of comparing path components. A course author or staff user with 
  course import permission can submit a crafted .tar.gz archive through the 
  import_olx flow initiated by 
  cms.djangoapps.contentstore.views.import_export.import_handler. An archive 
  member can therefore escape into a sibling course staging directory whose name
  shares the attacker's base64 directory prefix, causing limited cross-tenant 
  file corruption. Zip archives are not practically affected because 
  ZipFile.extractall strips parent traversal segments, and the advisory does not
  establish arbitrary filesystem writes, file reads, or direct code execution. 
  This issue is fixed in Ulmo and Verawood.1.
