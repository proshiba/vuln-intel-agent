title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  E-Switch: fix use-after-free in mlx5_eswitch_termtbl_put\n\nIn mlx5_eswitch_termtbl_put(),
  the zero-ref cleanup check reads\ntt->ref_count after termtbl_mutex has been released.\
  \  Two concurrent\ncallers on the same mlx5_termtbl_handle race: one decrements
  ref_count\nto zero, removes the hash entry, and calls kfree(tt) while the other\n\
  has already dropped the mutex and is about to evaluate\nif (!tt->ref_count), producing
  a use-after-free.\n\nFix this by capturing the result of the decrement into a stack-local\n\
  last variable before dropping the mutex.  The cleanup decision is now\nmade entirely
  under termtbl_mutex, and tt is not touched after\nkfree."
