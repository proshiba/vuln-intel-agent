title: Cross-Site Request Forgery (CSRF) in the OrderConfirmController at GET 
  /order/confirm/{order_number} in Roskus Prospero Flow CRM before 5.15.11 
  allows an unauthenticated attacker to confirm any order on behalf of an 
  authenticated user by directing them to a crafted page. Laravel's 
  VerifyCsrfToken middleware enforces CSRF tokens only on POST, PUT, PATCH, and 
  DELETE requests; the Route::get declaration leaves this state-changing action 
  unprotected. Session cookies configured with SameSite=Lax are automatically 
  included in top-level cross-site navigation, so a single link click triggers 
  OrderConfirmController::confirm() and transitions the target order from 
  pending to confirmed without user authorization. Because order numbers are 
  sequential integers, an attacker can enumerate and confirm all existing orders
  in a single automated sweep.
