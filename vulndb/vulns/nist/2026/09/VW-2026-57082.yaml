title: "Improper input validation in TopicRegion in Apache ActiveMQ, Apache ActiveMQ
  Broker, and Apache ActiveMQ All on all platforms.\n\n\n\n\nAn authenticated client
  can spoof clientId when removing a durable topic subscription.\n\n\n\nThis issue
  affects Apache ActiveMQ Broker: before 5.19.11, from 6.0.0 before 6.3.2; Apache
  ActiveMQ All: before 5.19.11, from 6.0.0 before 6.3.2; Apache ActiveMQ: before 5.19.11,
  from 6.0.0 before 6.3.2.\n\n\n\nUsers are recommended to upgrade to version 6.3.2
  or 5.19.11 which fixes the issue."
