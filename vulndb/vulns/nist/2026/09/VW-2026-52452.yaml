title: The Master Addons for Elementor – Elementor Addons, Widgets, Mega Menu 
  Builder, Popup Builder, Widget Builder & Template Kits plugin for WordPress is
  vulnerable to Arbitrary File Upload in all versions up to, and including, 
  3.1.9 via the upload_template_kit function. This is due to incorrect 
  authorization on the upload_template_kit() AJAX handler, which requires only 
  upload_files capability instead of the manage_options required by all sibling 
  handlers, combined with missing per-entry file type filtering after ZIP 
  extraction. This makes it possible for authenticated attackers, with 
  editor-level access and above, to upload files that may be executable, which 
  makes remote code execution possible. Editors can satisfy the nonce 
  requirement because the required nonces are localized on the standard Pages 
  list screen, which is accessible to any user with the edit_pages capability.
