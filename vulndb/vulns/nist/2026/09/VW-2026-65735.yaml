title: LibRaw 0.22.0 contains an incorrect numeric conversion vulnerability in 
  LibRaw::parse_tiff_ifd() when processing TIFF tag 0x00fe (NewSubfileType). A 
  specially crafted RAW, TIFF, or DNG file can supply an attacker-controlled 
  NewSubfileType value outside the range of a signed int. The parser converts 
  this value and narrows it to int without performing range validation. This 
  out-of-range conversion triggers undefined behavior, resulting in process 
  termination and denial of service.
