title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Reject inline replies that overflow the pull-up buffer\n\nAn RPC-over-RDMA client
  can request a reply, such as an NFS READ\npayload, without providing a Write list
  or a Reply chunk to carry\nit. When such a reply needs more scatter/gather entries
  than the\ndevice's Send Queue supports, svc_rdma_pull_up_needed() selects\npull-up
  and svc_rdma_pull_up_reply_msg() linearizes the whole\nreply into sctxt->sc_xprt_buf.
  That buffer is only sc_max_req_size\nbytes, while the reply on this path is bounded
  only by the client's\nrequest, so svc_rdma_xb_linearize() copies past the end of
  the\nbuffer and corrupts adjacent slab memory. The oversized length is\nthen stored
  in sc_sges[0].length and posted, so the device also\nreads beyond the mapped region.\n\
  \nThe SGE-exhaustion branch is the only pull-up path that can exceed\nthe buffer:
