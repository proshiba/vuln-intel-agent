title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  x86: Fix per-CPU address resolution into an extended register\n\nThe destination
  of the per-CPU address MOV is encoded in ModRM.reg,\nwhich is extended by REX.R,
  but the REX prefix is built with\nadd_1mod(), which sets REX.B. REX.B extends ModRM.rm
  and SIB.base, and\nthis instruction addresses memory as disp32 with no base, so
  the bit\nhas no effect at all and the high register bit is simply lost.\n\nEvery
  is_ereg() destination therefore resolves to the wrong register,\npicking whichever
  one shares the low three bits:\n\n  R5 -> RAX    R7 -> RBP    R8 -> RSI    R9 ->
  RDI\n\nWith BPF_REG_5, whose reg2hex is 0, the emitted\n\n  65 49 03 04 25 <off>\t
  add %gs:<off>,%rax\n\nadds the per-CPU offset to RAX rather than R8. The destination
  keeps\nthe unadjusted address and RAX is clobbered, so the program goes on to\n\
  dereference a pointer that was never made per-CPU:\n\n  BUG: unable to handle page
  fault for address: 0000607e386a8894\n  RIP: bp"
