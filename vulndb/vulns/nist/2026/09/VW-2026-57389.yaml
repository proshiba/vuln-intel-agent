title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.10.0 until 0.11.1, DELETE 
  /api/v1/chats/{id}/messages/{message_id} used the chat-history deletion helper
  in backend/open_webui/models/chats.py to follow childrenIds without recording 
  visited message identifiers. An authenticated user could store a cyclic chat 
  tree and delete a message, causing a synchronous infinite loop on the server 
  request loop that blocked every user's requests until the process was killed. 
  This issue is fixed in version 0.11.1.
