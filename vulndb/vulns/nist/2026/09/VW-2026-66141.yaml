title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  use wq_has_sleeper() in release_in_xmit()\n\nrelease_in_xmit() clears RDS_IN_XMIT
  with clear_bit_unlock() and then\nchecks waitqueue_active() to decide whether anyone
  needs waking.\nclear_bit_unlock() is only a release operation: it orders the\ncritical
  section before the bit clear, but does not order the\nsubsequent plain load of the
  wait queue head after it.  The waiter\nside does the mirror image - it adds itself
  to the wait queue and\nthen tests the bit.  That is the classic store-buffering
  pattern: the\nreleasing CPU can read the wait queue as empty while the waiting CPU\n\
  still reads the bit as set, so the sleeper is never woken.\n\nThe waiters are rds_conn_shutdown()
  and rds_tcp_reset_callbacks(),\nboth in uninterruptible wait_event() with no timeout.\
  \  A lost wake-up\nstrands the shutdown worker on its single-threaded workqueue
  until\nsome other sender releases the bit again - and on a connection that\nis being
  torn do"
