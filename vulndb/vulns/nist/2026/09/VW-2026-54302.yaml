title: PJSIP is a free and open source multimedia communication library written 
  in C. Prior to commit a1b707c, a stack buffer overflow exists in the SRTP/SDES
  media transport when processing a=crypto attributes during SDP offer/answer 
  (sdes_encode_sdp() in transport_srtp_sdes.c). This affects applications with 
  SRTP enabled (use_srtp optional or mandatory, using SDES keying). During media
  negotiation, the crypto attributes from the remote SDP are collected into a 
  fixed-size array without bounding their number; a remote peer that includes an
  excessive number of a=crypto attributes in a single media description can 
  write past the end of that array on the stack. This is reachable from an 
  incoming SIP INVITE during offer/answer, before application-level 
  authentication. Impact may range from unexpected application termination to 
  control flow hijack/memory corruption. Applications that do not enable SRTP 
  are not affected. This issue has been patched via commit a1b707c.
