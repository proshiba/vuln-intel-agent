title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-cgroup:
  fix race between policy activation and blkg destruction\n\nWhen switching an IO
  scheduler on a block device, blkcg_activate_policy()\nallocates blkg_policy_data
  (pd) for all blkgs attached to the queue.\nHowever, blkcg_activate_policy() may
  race with concurrent blkcg deletion,\nleading to use-after-free and memory leak
  issues.\n\nThe use-after-free occurs in the following race:\n\nT1 (blkcg_activate_policy):\n\
  \  - Successfully allocates pd for blkg1 (loop0->queue, blkcgA)\n  - Fails to allocate
  pd for blkg2 (loop0->queue, blkcgB)\n  - Enters the enomem rollback path to release
  blkg1 resources\n\nT2 (blkcg deletion):\n  - blkcgA is deleted concurrently\n  -
  blkg1 is freed via blkg_free_workfn()\n  - blkg1->pd is freed\n\nT1 (continued):\n\
  \  - Rollback path accesses blkg1->pd->online after pd is freed\n  - Triggers use-after-free\n\
  \nIn addition, blkg_free_workfn() frees pd before removing the blkg from\nq->blkg_list.
