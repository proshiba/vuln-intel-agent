title: AnyIO is a high level asynchronous concurrency and networking framework 
  that works on top of either Trio or asyncio. In 4.14.0, AnyIO accepts the 
  POSIX extra_groups argument in anyio.run_process() and anyio.open_process(), 
  but open_process() forwards the group argument to the backend instead of 
  extra_groups. A caller that supplies extra_groups=[] to clear inherited 
  supplementary groups can therefore launch a child that retains the parent 
  process groups, undermining a privilege-dropping boundary. If group is also 
  supplied, the integer group value is passed where an iterable of supplementary
  groups is expected and the launch can fail with TypeError. This issue affects 
  POSIX applications that rely on AnyIO subprocess helpers to launch 
  less-privileged child processes. This issue is fixed in version 4.14.2.
