title: "vm2 3.11.6 is vulnerable to a sandbox escape leading to remote code execution
  in the host Node.js process. The fix for GHSA-m283-3h24-438v is incomplete: the
  bridge gate at lib/bridge.js:1624 identity-checks only the direct call target when
  deciding whether to rebuild/sanitise a rejected host Promise value. Registering
  the rejection handler through Function.prototype.call or .apply indirection (e.g.,
  p.then.call(p, undefined, cb)) makes the intercepted target host Function.prototype.call,
  so the sanitiser never runs and the raw host error reaches sandbox code with its
  own properties intact. If an embedder exposes a host-realm Promise to the sandbox
  (an async host function bridged via the sandbox option, or a NodeVM external module's
  async method) and that Promise rejects with an Error carrying a non-primitive own
  property referencing a host object (for example err.detail = process), untrusted
  code in the sandbox obtains a fully functional proxy to that host object and can
  execute arbit"
