title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  qcom: iris: handle runtime PM resume failure in core deinit\n\nCheck the return
  value of pm_runtime_resume_and_get() in\niris_core_deinit().\n\nIf runtime PM resume
  fails, skip hardware power-off operations but\nstill perform software teardown and
  state transition. Also skip the\ncorresponding pm_runtime_put_sync() call to avoid
  unbalanced runtime\nPM references."
