title: SQLBot is an intelligent Text-to-SQL system based on large language 
  models and RAG. Prior to 1.9.0, the POST /api/v1/datasource/previewData 
  endpoint in backend/apps/datasource/crud/datasource.py incorporates the 
  client-controlled table_name value into generated SQL without safe identifier 
  handling. An authenticated user can configure a datasource for SQLBot's 
  internal PostgreSQL service and submit a crafted table_name that remains a 
  SELECT operation under the read-only policy while invoking pg_read_file(), 
  pg_read_binary_file(), or pg_ls_dir(). In the default tested trusted loopback 
  authentication configuration, the internal connection accepts invalid 
  credentials and executes with PostgreSQL superuser privileges, allowing 
  filesystem content such as /etc/hosts and /etc/passwd to be returned in the 
  previewData API response and potentially exposing configuration, credentials, 
  authentication secrets, and source code. This issue is fixed in version 1.9.0.
