title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuprobes/x86:
  Move optimized uprobe from nop5 to nop10\n\nAndrii reported an issue with optimized
  uprobes [1] that can clobber\nredzone area with call instruction storing return
  address on stack\nwhere user code may keep temporary data without adjusting rsp.\n\
  \nFixing this by moving the optimized uprobes on top of 10-bytes nop\ninstruction,
  so we can squeeze another instruction to escape the\nredzone area before doing the
  call, like:\n\n  lea -0x80(%rsp), %rsp\n  call tramp\n\nNote the lea instruction
  is used to adjust the rsp register without\nchanging the flags.\n\nWe use nop10
  and following transformation to optimized instructions\nabove and back as suggested
  by Peterz [2].\n\nOptimize path (int3_update_optimize):\n\n  1) Initial state after
  set_swbp() installed the uprobe:\n      cc 2e 0f 1f 84 00 00 00 00 00\n\n     From
  offset 0 this is INT3 followed by the tail of the original\n     10-byte NOP.\n\n\
  \     After a previous unoptimization byt"
