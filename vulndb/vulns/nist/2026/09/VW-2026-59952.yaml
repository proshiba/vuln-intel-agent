title: "Koha Eval Code Injection Remote Code Execution Vulnerability. This vulnerability
  allows remote attackers to execute arbitrary code on affected installations of Koha.
  Authentication is required to exploit this vulnerability.\n\nThe specific flaw exists
  within the web service, which listens on TCP port 8081 by default. The issue results
  from the lack of proper validation of a user-supplied string before passing it to
  the eval function. An attacker can leverage this vulnerability to execute code in
  the context of the service account. Was ZDI-CAN-29165."
