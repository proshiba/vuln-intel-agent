title: "In the Linux kernel, the following vulnerability has been resolved:\n\njfs:
  add check read-only before txBeginAnon() call\n\nAdded a read-only check before
  calling `txBeginAnon` in `extAlloc`\nand `extRecord`. This prevents modification
  attempts on a read-only\nmounted filesystem, avoiding potential errors or crashes.\n\
