title: Nango before 0.71.6 contains a missing authentication vulnerability in 
  the runner tRPC server that allows unauthenticated attackers to execute 
  arbitrary JavaScript code by invoking the exposed start procedure without 
  credentials. Attackers with network access to the runner port can send 
  requests to the unauthenticated start procedure, bypassing the unenforced 
  RUNNER_SECRET_KEY environment variable, to achieve remote code execution 
  within the runner process.
