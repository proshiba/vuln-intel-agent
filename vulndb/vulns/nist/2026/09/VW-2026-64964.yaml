title: Jawn is an open source JSON parser. Prior to 1.7.0, Jawn's AsyncParser 
  can perform quadratic work when a single JSON token is delivered across many 
  small chunks because each absorb call rescans the incomplete token from the 
  start. A remote attacker who controls untrusted JSON input and its chunk sizes
  can exhaust CPU resources and cause denial of service in applications using 
  AsyncParser. This issue is fixed in version 1.7.0.
