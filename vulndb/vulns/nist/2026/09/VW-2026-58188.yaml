title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNTB:
  ntb_transport: Reject oversized TX buffers\n\nntb_process_tx() handles an oversized
  buffer by calling tx_handler()\nwith a NULL data pointer and returning success.
  ntb_netdev therefore\nneither frees the skb in its completion callback nor takes
  its enqueue\nerror path, leaking it.\n\nReject oversized buffers in ntb_transport_tx_enqueue()
  before acquiring\na queue entry and return -EMSGSIZE. The caller retains ownership
  of the\nbuffer, and the preceding netdev patch frees the skb when enqueue\nreturns
  this permanent error."
