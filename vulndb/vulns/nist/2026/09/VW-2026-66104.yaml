title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Cancel special fields when recycling rhtab elements\n\nrhtab_map_update_existing()
  and rhtab_delete_elem() call\nbpf_obj_free_fields() when replacing or deleting a
  value. These map\noperations can run from BPF programs in NMI context, where releasing
  a\nreferenced kptr or another complex field is not generally safe.\n\nArray and
  hash maps avoid that problem by cancelling only the asynchronous\nfields which can
  be stopped safely in the caller context. Other ownership\nstate remains attached
  to the allocation until its memory allocator\ndestructor performs the final cleanup.\n\
  \nUse bpf_obj_cancel_fields() for the corresponding rhtab paths as well. This\n\
  cancels timers, workqueues, and task work while allowing rhtab_mem_dtor() to\nrelease
  referenced kptrs when the allocation is eventually destroyed.\n\n[ kkd: Rebased,
  used direct helper calls, and rewrote the commit log ]"
