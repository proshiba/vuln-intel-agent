title: The Site Reviews WordPress plugin before 8.3.0 does not prevent request 
  data from being deserialized, and derives the key protecting that data by 
  padding out the site's WordPress nonce key, which makes the key publicly 
  computable on installs where that key is absent, left at its sample value, or 
  too short to be secret. This allows unauthenticated users to inject arbitrary 
  PHP objects on such installs. The Site Reviews WordPress plugin before 8.3.0's
  own code contains no chain onward from the injected object, so how far it 
  reaches depends on the other code present on the site.
