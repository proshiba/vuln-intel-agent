title: "Improper validation of certificate with host mismatch in the MQTT client TLS
  connection layer in AWS IoT Device SDK for Python 1.5.3 through 1.6.0 on Python
  3.7 and later might allow an adversary-in-the-middle actor to impersonate the AWS
  IoT Core endpoint, read device telemetry, and inject arbitrary MQTT messages that
  the device processes as authentic, via a certificate issued for an unrelated hostname
  by a certificate authority present in the device trust store.\n\n\n\nTo remediate
  this issue, users should upgrade to version 1.6.1."
