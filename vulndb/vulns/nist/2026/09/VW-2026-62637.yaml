title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndax/fsdev:
  use __va(phys) for kaddr in direct_access\n\nUse __va(phys) instead of virt_addr
  + linear_offset for the kaddr\nreturn in __fsdev_dax_direct_access(). The previous
  code added a\ndevice-linear byte offset to virt_addr (which is __va of ranges[0]),\n\
  but for multi-range devices with physical gaps between ranges, this\nlinear arithmetic
  crosses the gap and produces a wrong kernel virtual\naddress. Using __va(phys) where
  phys comes from dax_pgoff_to_phys()\nis correct for any range layout because the
  direct map translates\neach physical address independently.\n\nThis leaves dev_dax->virt_addr
  write-only, so remove the field\n(suggested by Dave Jiang)."
