title: The Forminator Forms  WordPress plugin before 1.57.2.1 does not apply the
  role validation it enforces elsewhere when a registration form is nested 
  inside an imported quiz, allowing a user who may import quizzes to publish a 
  live, publicly reachable form that grants any role, including administrator, 
  to anyone who submits it. The same user is refused an identical form through 
  both the ordinary form editor and the ordinary form import.
