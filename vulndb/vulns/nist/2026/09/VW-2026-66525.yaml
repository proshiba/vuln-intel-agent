title: OpenClaw (npm package 'openclaw') before 2026.8.1 fails to apply the 
  originating requester's effective tool policy during Active Memory automatic 
  recall. In deployments that use Active Memory together with requester-specific
  tool rules, deterministic and hidden recall paths can retrieve durable memory 
  and inject it into the agent's context even when toolsBySender explicitly 
  denies that requester access to the memory tools (memory_search, memory_get). 
  As a result, an admitted but denied sender can receive information derived 
  from durable memory in the agent's response without directly invoking any 
  memory tool. The issue is fixed in 2026.8.1.
