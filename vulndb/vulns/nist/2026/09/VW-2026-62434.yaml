title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2/cluster:
  keep heartbeat local node stable\n\no2nm_node_local_store() handles local=0 by stopping
  o2net and setting\ncl_local_node to O2NM_INVALID_NODE_NUM, but it leaves cl_has_local
  set. \nThat stale state makes o2nm_this_node() return 255, blocks a later local=1\n\
  attempt with -EBUSY, and can feed 255 to heartbeat users that call\no2nm_this_node()
  dynamically.\n\nClearing cl_has_local is required when the local node is reset.\
  \  But\nheartbeat threads can still be running at that point.  They pin the local\n\
  node config item at startup, yet o2hb_do_disk_heartbeat() and thread\nteardown re-read
  o2nm_this_node() for the local slot and for\no2nm_undepend_this_node().  Once local=0
  has cleared the live local-node\nstate, those dynamic reads return O2NM_MAX_NODES,
  which is also the\ninvalid node number 255.\n\nStore the local node number in the
  heartbeat region when the region\nstarts.  Use that stable node for heartbeat slot
  writes/ch"
