title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  steam: Reject short reads\n\nSteam Controller FEATURE reports encode the size of
  the message in the\nmessage itself. Previously we were trusting that the size reported
  matched\nthe size we actually read, leading to a potential issue with short reads.\n\
  Instead, we should actually verify the length of the read."
