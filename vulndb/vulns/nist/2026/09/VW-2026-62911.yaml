title: AI Agent Automation is a modular AI agent workflow automation platform 
  with schedulers, tools, and observability. Prior to 0.9.1, the executeStep 
  file-step implementation in backend/src/agents/executor.js passes the 
  user-controlled step.path value through path.resolve with process.cwd() and 
  then uses the resulting path for read or write operations without checking 
  that it remains in an approved workflow directory. An authenticated user who 
  can create or modify workflow file steps can supply traversal segments to 
  escape the intended workspace and read sensitive files or write and overwrite 
  files accessible to the backend process, including application-adjacent files 
  when process permissions allow. This issue is fixed in version 0.9.1.
