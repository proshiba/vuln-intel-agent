title: Adminer before 6.0.2 contains a cross-site scripting vulnerability where 
  the CONNECTION_ID() database result is interpolated into JavaScript without 
  proper escaping, allowing a malicious database server to execute arbitrary 
  JavaScript in the authenticated Adminer origin. In co-located deployments 
  where the database has FILE privileges and can write to the webroot, attackers
  can use the XSS to submit authenticated SQL requests that write PHP files via 
  INTO DUMPFILE, achieving remote code execution as the web server account.
