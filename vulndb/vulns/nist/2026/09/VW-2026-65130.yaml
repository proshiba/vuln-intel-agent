title: A flaw was found in openshift/console. An unauthenticated remote attacker
  can exploit a misconfiguration in the CatalogdHandler, which lacks proper 
  authentication, and the forwarding of the `openshift-session-token` cookie. 
  This allows the attacker to send requests to the in-cluster catalogd service, 
  leading to the disclosure of the internal operator-catalog index and providing
  a relay into the openshift-catalogd namespace.
