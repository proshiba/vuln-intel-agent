title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/features:
  bound fwctl command payload to the input buffer\n\nfwctl_cmd_rpc() copies cmd->in_len
  bytes into inbuf = kvzalloc(cmd->in_len)\nand passes inbuf and in_len to ->fw_rpc().
  The CXL callback cxlctl_fw_rpc()\nignores in_len and never checks the user-controlled
  op_size against it.\n\ncxlctl_set_feature() bounds op_size only from below\n(op_size
  <= sizeof(feat_in->hdr)) and then reads op_size - sizeof(hdr)\nbytes from feat_in->feat_data
  via cxl_set_feature(). With a small in_len\nand a large op_size the first memcpy()
  already reads past the\nkvzalloc(in_len) buffer; the out-of-bounds bytes are placed
  in the mailbox\npayload and sent to the device, and a large enough op_size can walk
  into\nunmapped memory and oops the kernel. The Get paths pin op_size to a fixed\n\
  size but likewise read the input struct without checking in_len.\n\nReject, at the
  single dispatch point, any request whose fixed header plus\nop_size does not fit
  in"
