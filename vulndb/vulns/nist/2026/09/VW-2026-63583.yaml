title: 'A flaw has been found in aiyiyi121 SxDevOps 1.0/1.1. Affected is the function
  subprocess.Popen of the file backend/aiops/services.py of the component MCP STDIO
  Server Management. This manipulation of the argument endpoint_or_command causes
  command injection. The attack may be initiated remotely. Patch name: 2b4bf8585c3e731e7a8af30801ea46680bc783f9.
  To fix this issue, it is recommended to deploy a patch. The vendor was contacted
  early, responded in a very professional manner and quickly released a fixed version
  of the affected product.'
