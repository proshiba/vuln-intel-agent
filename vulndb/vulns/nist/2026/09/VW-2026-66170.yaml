title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  mcast: fix RCU list diversion in ip6_mc_del1_src()\n\nWhen removing a source filter
  whose count reaches zero, ip6_mc_del1_src()\nunlinks psf from pmc->mca_sources.
  If the filter was previously active,\nthe code moved psf directly into pmc->mca_tomb
  by updating psf->sf_next.\n\nBecause pmc->mca_sources is traversed locklessly under
  RCU (e.g. by\nipv6_chk_mcast_addr()), mutating psf->sf_next before a grace period\n\
  elapses diverts concurrent readers to the tombstone list. Consequently,\nreaders
  miss remaining active sources in pmc->mca_sources and improperly\nexamine deleted
  tombstone entries.\n\nFix this by allocating a new tombstone node for pmc->mca_tomb
  (as done\nin sf_setstate()) and retiring the original psf via kfree_rcu()."
