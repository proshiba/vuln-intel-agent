title: The Tutor LMS – eLearning and online course solution plugin for WordPress
  is vulnerable to Insecure Direct Object Reference in versions up to, and 
  including, 4.0.7 via the tutor_quiz_builder_save AJAX action due to missing 
  validation that nested question_id, answer_id, deleted_question_ids[], and 
  deleted_answer_ids[] values in the submitted payload belong to a 
  quiz/topic/course the requester is authorized to manage. The handler only 
  validates the top-level course_id, topic_id, and (when supplied) 
  payload['ID'], but the nested identifiers are passed straight into 
  $wpdb->update/DELETE statements in QuizBuilder::save_questions(), 
  QuizBuilder::save_question_answers(), and QuizBuilder::handle_delete(). This 
  makes it possible for authenticated attackers, with Instructor-level access 
  and above, to overwrite the content and re-parent arbitrary quiz 
  questions/answers belonging to other instructors or administrators, and to 
  delete arbitrary quiz question and answer rows.
