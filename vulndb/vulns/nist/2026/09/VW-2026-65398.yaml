title: "In the Linux kernel, the following vulnerability has been resolved:\n\nremoteproc:
  qcom_wcnss: Fix handling the lack of PD regulators in v3\n\nThe changes introduced
  to handle single power domain platforms have\nswapped the info pointer increment
  from num_pd_vregs to num_pds, which\nwould shift the info pointer past the end of
  the array for pronto-v3,\nwhich does not list power domain regulators in vregs.\n\
  \nThis showed up as a difference between GCC- and LLVM-compiled kernels\non SDM632
  devices, where only with LLVM one would get the\n\"regulator request with no identifier\"\
  \ error, because the out-of-bounds\nmemory ended up being zeroed. Fix by skipping
  the increment when there\nare more power domains than regulators."
