title: 'Grav before 2.0.25 ships web server configuration samples whose access-control
  deny rules are matched case-sensitively. In webserver-configs/web.config (IIS),
  every deny rule (user_sensitive_folders, user_accounts, user_data, user_error_redirect,
  user_pages, system, vendor, ignore_folders) sets ignoreCase="false" on its URL Rewrite
  <match> element, overriding the IIS default of ignoreCase="true"; because these
  are rewrite matches rather than <requestFiltering> elements, there is no case-insensitive
  fallback. On IIS running over case-insensitive NTFS, an unauthenticated remote attacker
  can vary the case of a folder name or file extension (for example GET /user/CONFIG/system.YAML)
  so that no deny rule matches and the IIS static file handler resolves and returns
  the underlying file, disclosing sensitive data such as configuration secrets or
  account password hashes. Whether a bypassed file is actually returned depends on
