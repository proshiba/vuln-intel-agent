title: "The Listdom: AI-powered Business Directory with Classifieds Ads Listings plugin
  for WordPress is vulnerable to Stored Cross-Site Scripting via 'lsd[displ][style]'
  Parameter in all versions up to, and including, 5.8.1 due to insufficient input
  sanitization and output escaping. This makes it possible for unauthenticated attackers
  to inject arbitrary web scripts in pages that will execute whenever a user accesses
  an injected page. Exploitation requires the Listdom Pro add-on to be active and
  the 'Display Options Per Listing' displ setting to be enabled, both of which are
  non-default configurations."
