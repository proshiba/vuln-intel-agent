title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  fix xfrm_state_construct() auth-trunc leak\n\nattach_auth_trunc() can allocate x->aalg
  while leaving\nx->props.aalgo at zero when the selected auth algorithm has no\n\
  sadb_alg_id. One real case is cmac(aes).\n\nxfrm_state_construct() then treats !x->props.aalgo
  as \"no auth\nalgorithm attached yet\" and calls attach_auth(). That overwrites\n\
  x->aalg and loses the first allocation. Any later failure or teardown\nonly frees
  the replacement pointer.\n\nCheck whether x->aalg is already attached instead of
  inferring that\nstate from x->props.aalgo."
