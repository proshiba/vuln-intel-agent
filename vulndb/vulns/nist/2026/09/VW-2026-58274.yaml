title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd:
  fix NULL dereference on lockowner allocation failure\n\nnlmclnt_locks_init_private()
  installs NLM file lock operations even when\nnlmclnt_find_lockowner() fails to allocate
  a lockowner. nlmclnt_proc()\nthen returns -ENOMEM, but the VFS still tears down
  the partially\ninitialized file_lock and calls locks_release_private().\n\nThat
  invokes nlmclnt_locks_release_private(), which dereferences\nfl->fl_u.nfs_fl.owner
  and crashes because the owner was never installed.\n\nClear fl_ops before attempting
  to initialize the NLM private state, and\ninstall the NLM lock operations only after
  a lockowner has been allocated\nsuccessfully."
