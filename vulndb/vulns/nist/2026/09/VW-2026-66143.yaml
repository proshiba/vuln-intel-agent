title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbonding:
  do not clear curr_active_slave prematurely when releasing all slaves\n\nWhen releasing
  all slaves during bond destruction (all == true),\n__bond_release_one() unconditionally
  clears bond->curr_active_slave to\nNULL in every iteration.\n\nIf a backup slave
  is released before the active slave,\nbond_alb_deinit_slave() triggers rlb_teach_disabled_mac_on_primary(),\n\
  which increments the active slave dev promiscuity counter and sets\nbond_info->primary_is_promisc
  = 1.\n\nBecause bond->curr_active_slave was prematurely cleared to NULL when\nreleasing
  the backup slave, the subsequent iteration releasing the active\nslave evaluates
  oldcurrent as NULL, so bond_change_active_slave(bond, NULL)\nis skipped. Consequently,
  bond_alb_handle_active_change() is never called\nto decrement the promiscuity counter,
  permanently leaking promiscuous\nmode on the physical device after bond teardown.\n\
  \nWhen oldcurrent == slave, bond_change_active_slav"
