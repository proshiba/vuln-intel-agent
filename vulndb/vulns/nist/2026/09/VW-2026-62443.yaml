title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  asus: refactor the two workqueues and init sequence\n\nMultiple issues have been
  found within the hid-asus driver:\n- unchecked size in asus_raw_event()\n- unclean
  teardown of asus_probe on failure\n- possible use-after-free in asus_probe\n- multiple
  workqueue used for jobs where one was enough\n- sleeping calls in atomic context\n\
  - packets of incorrect size being sent to the keyboard controller\n\nJoin the two
  workqueues into one reusing the stopping mechanism\nof the brightness workqueue,
  use the joined workqueue to also\nmove the asus_wmi_send_event() sleeping call away
  from atomic\ncontext and add a size check in asus_raw_event()."
