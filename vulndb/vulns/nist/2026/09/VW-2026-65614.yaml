title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngfs2:
  fix quota init duplicate scan\n\ngfs2_quota_init() checks for duplicate quota_change
  IDs while holding\nqd_lock and the quota hash bucket bitlock. That path used\ngfs2_qd_search_bucket(),
  which takes a lockref reference via\nlockref_get_not_dead().\n\nOn PREEMPT_RT this
  may sleep, which is not allowed under the bucket\nbitlock, triggering \"sleeping
  function called from invalid context\".\n\nUse a no-ref bucket lookup in this path,
  then continue duplicate\nhandling without taking a lockref there.\n\nRefactor gfs2_qd_search_bucket()
  to build on top of the no-ref helper\nso lookup traversal stays in one place.\n\n\
  This patch fixes a bug reported by syzbot."
