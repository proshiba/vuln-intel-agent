title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sched: fix 32-bit backlog wrap in gred, bfifo and plug enqueue\n\ngred_enqueue(),
  bfifo_enqueue() and plug_enqueue() admit a packet when the\ncurrent backlog plus
  the packet length fits within the queue limit:\n\n  sch->qstats.backlog + qdisc_pkt_len(skb)
  <= sch->limit (gred default VQ)\n  gred_backlog+qdisc_pkt_len(skb) <= q->limit \
  \ (gred configured VQ)\n  sch->qstats.backlog + qdisc_pkt_len(skb) <= sch->limit
  (bfifo)\n  sch->qstats.backlog + skb->len <= q->limit             (plug)\n\nsch->qstats.backlog
  and q->backlog are u32, and qdisc_pkt_len()/skb->len\nare unsigned int, so all sums
  are computed in 32 bits and wrap at 2^32.\nOnce the true backlog exceeds 4 GiB the
  wrapped sum becomes small and\nadmission keeps succeeding, so the queue grows without
  bound and the kernel\ncan be driven to OOM.\n\nPromote the sums to u64 so admission
  stops once the true backlog exceeds\nthe limit.  The limit is u32, so the bounded
  queue stays b"
