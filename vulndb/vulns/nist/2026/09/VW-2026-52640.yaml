title: The FS-Poster plugin for WordPress is vulnerable to Remote Code Execution
  in versions up to and including 8.0.1. This is due to insufficient input 
  sanitization of the FFmpeg path parameter before passing it to the exec() 
  function, combined with missing authorization checks on the REST API 
  endpoints. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to execute arbitrary commands on the 
  underlying server.
