title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ufs: Avoid NULL CQE dereference when reporting invalid tags\n\nThe single-doorbell
  completion path can call ufshcd_compl_one_cqe() with a\nNULL CQE. If no command
  is associated with the completion tag, the warning\nmessage dereferences the CQE
  while reporting the error.  Avoid that\ndereference and include the invalid tag
  in the warning."
