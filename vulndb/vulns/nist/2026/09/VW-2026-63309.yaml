title: A flaw was found in cockpit-machines. This vulnerability allows a local 
  attacker with the ability to inspect process metadata to disclose a sensitive 
  Red Hat Subscription Management (RHSM) offline token. The token is exposed 
  when it is passed as a command-line argument to a helper script during the 
  token validation process. Successful exploitation could lead to the compromise
  of confidentiality, as the exposed token can be used to request access tokens.
