title: InvenTree is an Open Source Inventory Management System. Prior to 1.4.0, 
  privileged staff users who can author report or label templates can cause 
  WeasyPrint report rendering to retrieve attacker-selected resources through 
  the HTTP and HTTPS URL schemes or the local file URI scheme. The 
  HTML(string=html).write_pdf() path does not provide a restricted url_fetcher, 
  and attach_to_model=True stores the original generated PDF before later 
  processing, allowing fetched local files or internal HTTP response bodies to 
  be recovered from embedded attachments. This enables full-read server-side 
  request forgery, arbitrary local file disclosure including application 
  credentials, and possible compromise of a superuser account. This issue is 
  fixed in version 1.4.0.
