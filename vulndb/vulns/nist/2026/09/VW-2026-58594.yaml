title: aiosmtplib before 5.1.3 fails to properly validate email addresses 
  supplied by callers, allowing attackers to inject ESMTP parameters into MAIL 
  FROM and RCPT TO command lines. Attackers can craft malicious addresses 
  containing spaces and angle brackets to append parameters like AUTH, NOTIFY, 
  or ORCPT to envelope commands, forging authenticated identities or forcing 
  delivery notifications to third parties.
