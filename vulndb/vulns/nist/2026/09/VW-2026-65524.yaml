title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  balance: fix potential bg lookup failure in btrfs_may_alloc_data_chunk()\n\n[BUG]\n\
  Running btrfs balance can trigger a null-ptr-deref before relocating a\ndata chunk
  when metadata corruption leaves a chunk in the chunk tree\nwithout a corresponding
  block group in the in-memory cache:\n\n  KASAN: null-ptr-deref in range [0x0000000000000088-0x000000000000008f]\n\
  \  RIP: 0010:btrfs_may_alloc_data_chunk+0x40/0x1c0 fs/btrfs/volumes.c:3601\n  Call
  Trace:\n    __btrfs_balance fs/btrfs/volumes.c:4217 [inline]\n    btrfs_balance+0x2516/0x42b0
  fs/btrfs/volumes.c:4604\n    btrfs_ioctl_balance fs/btrfs/ioctl.c:3577 [inline]\n\
  \    btrfs_ioctl+0x25cf/0x5b90 fs/btrfs/ioctl.c:5313\n    ...\n\n[CAUSE]\n__btrfs_balance()
  iterates the on-disk chunk tree and passes the chunk\nlogical bytenr to btrfs_may_alloc_data_chunk()
  before relocating a data\nchunk. That helper then queries the in-memory block group
