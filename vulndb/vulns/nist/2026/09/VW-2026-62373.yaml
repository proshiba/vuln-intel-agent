title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: flush active metadata block group at btree_writepages() start\n\nbtree_writepages()
  writes the btree inode's dirty metadata in ascending\nlogical address order. On
  a zoned filesystem only one metadata and one\nsystem block group is active for writing
  at a time, and\ncheck_bg_is_active() (via btrfs_check_meta_write_pointer()) pivots
  the\nactive block group as writeback moves from one block group to the next.\n\n\
  If the active block group sits at a higher logical address than another\nblock group
  that also holds dirty metadata, the ascending walk reaches\nthe lower one first
  and, to write it, has to finish the active block\ngroup and activate the lower one.
  It cannot finish a block group that\nstill has unsent IO, and during WB_SYNC_ALL
  && !for_sync (commit)\nwriteback it deliberately refuses to wait for that IO under\n\
  fs_info->zoned_meta_io_lock, as that can deadlock. The pivot thus cannot\nissue
  the submission itself ei"
