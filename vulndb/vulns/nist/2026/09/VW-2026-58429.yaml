title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  use cifs_invalidate_cache() in cifs_do_truncate() for O_TRUNC\n\ncifs_do_truncate()
  is invoked from cifs_open() without i_rwsem, so it\ncannot use cifs_resize_file_locked()
  to perform a proper fscache cookie\nresize.  Instead, add cifs_invalidate_cache()
  after cifs_setsize().\n\ncifs_invalidate_cache() calls fscache_invalidate(), which
  works without\nholding i_rwsem: it unconditionally increments inval_counter and
  sets\nFSCACHE_COOKIE_NO_DATA_TO_READ, ensuring that stale cached data is not\nserved
  once the cookie is later activated by fscache_use_cookie().\nTruncation to zero
  leaves no valid cached data, making invalidation the\ncorrect semantic here."
