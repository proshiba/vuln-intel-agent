title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix exchange-range reflink flag clearing issue with INO1_WRITTEN\n\nWhen exchanging
  two full-file ranges, xmi_can_exchange_reflink_flags()\ncan move the reflink inode
  flag from the file that currently has it to\nthe other file, as long as exactly
  one side is marked.  This assumes\nthat the file contents, and therefore all shared
  extents, are exchanged.\n\nThat assumption is not true when XFS_EXCHMAPS_INO1_WRITTEN
  is set.\nxfs_exchmaps_can_skip_mapping() can skip hole and unwritten mappings\n\
  from file1, so an exchange can complete without moving every mapping\nthat the earlier
  flag-swap decision accounted for.  In that case the\npost-operation cleanup can
  clear the reflink flag from an inode that\nstill owns shared written extents.  Later
  writes then take the\nnon-reflink write path and may update blocks that should still
  have\nbeen protected by CoW, which shows up as data corruption between\nreflink-related
  files.\n\nFix this by "
