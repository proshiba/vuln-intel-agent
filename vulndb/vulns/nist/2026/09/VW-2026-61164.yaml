title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Fix the case that vm range is hole at svm_migrate_copy_to_vram\n\nWhen migration
  vm range is hole at cpu side(MIGRATE_PFN_MIGRATE set +\nMIGRATE_PFN_VALID unset)
  driver still allocates device pages. There is no\ndma map of src pages and migration.
  j is 0 and svm_migrate_copy_memory_gart()\nwill return an uninitialized r. That
  can trigger out_free_vram_pages to drop\nall VRAM just set up.\n\nInitialize r and
  only call the last svm_migrate_copy_memory_gart if j > 0.\n\nCurrent code postponed
  the last page to the final copy. This patch flushes on\nthe last page when reach
  to the end of current drm_buddy_block; avoids another\nsvm_migrate_copy_memory_gart."
