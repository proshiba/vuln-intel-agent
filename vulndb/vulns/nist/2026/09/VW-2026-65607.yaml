title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  chips-media: wave5: Fix Reports from Kernel Lock Validator\n\nhandle_dynamic_resolution
  change requires that the state_lock be acquired\nbased on the lockdep_assert_held.
  However, the\nhandle_dynamic_resolution_change call in initialize_sequence does
  not\nproperly obtain the lock before calling.\n\nSince the v4l2_ctrl_find and s_ctrl
  can sleep, they should not be called\nwhile a lock is already held. Store off the
  fbc_buf_count then properly\nupdate control once lock has been freed."
