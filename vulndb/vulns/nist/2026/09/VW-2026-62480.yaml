title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: unwind state on add_interface failure\n\nWhen mt76_wcid_alloc() fails,
  mt7915_add_interface() returned without\nclearing the vif_mask/omac_mask bits it
  had already set, without removing\nthe firmware dev info added earlier, and without
  clearing a monitor_vif\npointer to the vif mac80211 is about to free. mac80211 does
  not call\nremove_interface() for a failed add, so the indices and firmware dev\n\
  entry leaked permanently and testmode could dereference the stale\nmonitor_vif.
  Add a proper error unwind."
