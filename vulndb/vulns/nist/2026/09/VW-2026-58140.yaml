title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: pci: add .shutdown callback to stop rfkill polling on reboot\n\nSince the
  hardware rfkill polling was introduced, arm64 platforms can\npanic with an asynchronous
  SError during warm reboot:\n\n  SError Interrupt on CPU8, code 0x00000000be000011
  -- SError\n  Workqueue: events_power_efficient rfkill_poll [rfkill]\n    rtw89_pci_ops_read8+0x94/0x160
  [rtw89_pci]\n    rtw89_core_rfkill_poll+0x50/0x1e0 [rtw89_core]\n    rtw89_ops_rfkill_poll+0x40/0x68
  [rtw89_core]\n    ieee80211_rfkill_poll+0x3c/0x70 [mac80211]\n    cfg80211_rfkill_poll+0x40/0x2a0
  [cfg80211]\n    rfkill_poll+0x30/0x88 [rfkill]\n  Kernel panic - not syncing: Asynchronous
  SError Interrupt\n\nOn the reboot path the kernel only runs device_shutdown(), which
  calls\neach driver's .shutdown callback; .remove is not invoked.  The rtw89 PCI\n\
  driver had no .shutdown callback, so nothing stopped the rfkill polling\nwork while
  the platform was tearing the PCIe link down.  On"
