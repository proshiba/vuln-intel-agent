title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  serialize configfs attribute stores with the lock\n\nThe NULLB_DEVICE_ATTR _store
  takes no lock: apply_fn attributes\n(submit_queues, poll_queues) get dev->NAME written
  again after apply_fn\nreturns, outside its lock; APPLY=NULL attributes are entirely
  lockless.\nconfigfs only serializes stores per-open-file, so concurrent stores on\n\
  separate fds race.\n\nFor apply_fn attributes, once one store's apply_fn has reconfigured
  the\nhardware, a second (losing) store can still overwrite dev->NAME\nafterwards.
  This leaves dev->submit_queues out of sync with the live\nqueue count, which is
  later caught by the WARN_ON_ONCE() in\nnull_map_queues().\n\nFor !apply_fn attributes,
  power_store()'s null_add_dev() validates and\nbuilds the device under \"lock\" but
  only sets CONFIGURED afterwards. A store\nslipping in during this window can change
  a field mid-setup -- for example,\nzone_nr_conv can be pushed above nr_zones after
