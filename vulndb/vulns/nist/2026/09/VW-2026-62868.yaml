title: Speakr is a personal, self-hosted web application designed for 
  transcribing audio recordings. Prior to 0.8.21-alpha, the 
  csrf_exempt_for_api_tokens() before_request hook in src/app.py calls 
  csrf.exempt(view_func), permanently adding the selected view to Flask-WTF's 
  process-global exemption set. The is_token_authenticated() function in 
  src/utils/token_auth.py calls extract_token_from_request() and treats any 
  present token, including request.args.get('token'), as authenticated without 
  hashing the token, querying the database, or checking validity. A 
  network-reachable attacker can therefore send a false token to disable CSRF 
  protection for the targeted view for the worker lifetime. Because the 
  exemption applies to the view function across HTTP methods, a cross-origin GET
  to /account with a query token can poison CSRF state for a later 
  state-changing POST without triggering CORS preflight. This browser sequence 
  requires attacker-controlled content on a sibling subdomain under the 
  documente
