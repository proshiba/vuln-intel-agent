title: Improper neutralization of special elements in data query logic in the 
  polymorphic relation handling of the MongoDB integration for Laravel can cause
  a caller-supplied relation identifier to be interpreted as a query condition 
  rather than as a literal identifier. An authenticated user who can influence a
  stored relation identifier may cause an affected application to return a 
  document other than the intended relation target.
