title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btmtksdio: Fix out-of-bounds DMA read in the TX path\n\nbtmtksdio_tx_packet() rounds
  the transfer size up to the SDIO block size\nof 256 bytes, but hands the host controller
  the SKB buffer as is:\n\n\terr = sdio_writesb(bdev->func, MTK_REG_CTDR, skb->data,\n\
  \t\t\t   round_up(skb->len, MTK_SDIO_BLOCK_SIZE));\n\nOnly skb->len bytes hold packet
  data, so the controller reads up to 255\nbytes of uninitialised memory and sends
  it to the device over the SDIO\nbus. Depending on how much tailroom slack the SKB
  allocation happens to\ncarry, that read can also extend past the end of the buffer.\n\
  \nCompute the padded length up front, ensure the SKB has tailroom for it,\nand zero-fill
  the padding with skb_put_zero(). skb->len then covers the\npadding, so sdio_writesb()
  no longer needs to round up. byte_tx keeps\ncounting the header and the payload
  only, and the error path restores the\nSKB so that the caller can requeue it.\n\n\
  Writing behind "
