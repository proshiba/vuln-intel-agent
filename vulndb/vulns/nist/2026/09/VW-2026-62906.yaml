title: SQLBot is an intelligent Text-to-SQL system based on large language 
  models and RAG. Prior to 1.9.0, an authenticated user can supply a crafted 
  sheet["tableName"] value in the Excel datasource configuration submitted 
  through POST /api/v1/datasource/, and SQLBot stores that value without safe 
  identifier handling. When the same datasource is later removed through DELETE 
  /api/v1/datasource/{id}, the stored value is interpolated into datasource 
  cleanup SQL and executed by PostgreSQL. This second-order SQL injection can 
  invoke PostgreSQL COPY TO PROGRAM and execute arbitrary operating-system 
  commands with the privileges of the postgres process inside the SQLBot 
  container. This issue is fixed in version 1.9.0.
