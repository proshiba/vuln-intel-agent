title: AzuraCast before 0.23.8 contains a server-side request forgery and local 
  file read vulnerability in the AutoDJ remote playlist fetch 
  (backend/src/Radio/AutoDJ/QueueBuilder.php, getMediaFromRemoteUrl()). A user 
  with the station Media permission can create or update a playlist with 
  source=remote_url and remote_type=playlist whose remote_url points at a 
  file:// path or an internal/loopback/link-local HTTP endpoint. When AutoDJ 
  builds the queue, the backend passes the user-supplied URL directly to 
  file_get_contents() with no scheme allowlist and no private/loopback/metadata 
  IP policy (PHP allow_url_fopen is enabled by default, including in the Docker 
  image). Lines from the fetched resource are parsed as M3U/PLS entries, stored 
  in StationQueue.autodj_custom_uri, and returned by GET 
