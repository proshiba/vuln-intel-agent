title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-rdma:
  fix -EIO cleanup order in queue_rq\n\nOn -EIO, the RDMA queue_rq path reports a
  host path error and then\nstill cleans up the command and unmaps the SQE DMA. The
  path error\nhelper completes the request, so that is double cleanup and DMA unmap\n\
  after the request is already complete.\n\nUnmap the SQE first, then report the host
  path error. Skip the outer\ncommand cleanup on that path."
