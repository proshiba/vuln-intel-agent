title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninetpeer:
  randomize RB-tree node comparison using SipHash\n\nThe inetpeer rate limiting system
  stores peer entries in a Red-Black tree\nkeyed deterministically on the remote IP
  address. Because tree lookups walk\nthe RB-tree using standard lexicographical comparisons
  (inetpeer_addr_cmp),\nan off-path adversary can predict the exact topology of the
  tree and the\nsequence of nodes traversed during lookups (the gc_stack candidate
  list).\n\nBy combining deterministic tree traversal with aggressive garbage collection\n\
  (triggered when tree size exceeds inet_peer_threshold), an attacker can\nselectively
  force the eviction of targeted inet_peer nodes. When an evicted\nnode is subsequently
  re-created upon receiving a new packet, its rate-limiting\ntoken bucket (rate_tokens,
  rate_last) is reset to full capacity. This creates\na side-channel primitive allowing
  off-path attackers to bypass IP-keyed ICMP\nrate limits and infer open UDP ports
