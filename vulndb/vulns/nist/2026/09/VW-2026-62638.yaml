title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndax/fsdev:
  clear pgmap ops and owner on unbind\n\nfsdev_dax_probe() sets pgmap->ops = &fsdev_pagemap_ops
  and\npgmap->owner = dev_dax, but nothing ever clears them. For a dynamic\ndevice
  the pgmap is devm-allocated and freed on unbind, so this is\nharmless. For a static
  device the pgmap is the shared, long-lived one\nowned by the dax bus (kill_dev_dax()
  only NULLs dev_dax->pgmap for the\nnon-static case), and device.c's probe sets only
  pgmap->type, never\nclearing ops/owner.\n\nSo after fsdev unbinds a static device
  the stale fsdev_pagemap_ops\nsurvives on the shared pgmap. If the device is then
  rebound to\ndevice_dax (MEMORY_DEVICE_GENERIC, which installs no ->memory_failure),\n\
  or the fsdev_dax module is unloaded, a subsequent memory_failure on that\npgmap
  dispatches through the stale -- and possibly freed -- handler.\n\nRegister a devm
  action that clears pgmap->ops and pgmap->owner on unbind,\nsymmetric with setting
  them at probe, so"
