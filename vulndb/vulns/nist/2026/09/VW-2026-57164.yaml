title: Snipe-IT is an IT asset management application. In Snipe-IT master-branch
  builds after 8.6.3 (the code was never included in a tagged release), 
  SettingsController::downloadLocationScopingReport streams the FMCS 
  location-scoping mismatch report (GET 
  /admin/settings/location-scoping-report.csv) through a bare fputcsv() call 
  without applying League\Csv\EscapeFormula, unlike the other CSV exports which 
  honor config('app.escape_formulas'). An authenticated user with ordinary 
  create/edit rights can place a spreadsheet formula in free-text fields that 
  appear in the report (item name, asset tag, serial, item or location company 
  name, location name) and arrange for the record to be FMCS-mismatched so it is
  included in the export. When a superuser downloads the report and opens it in 
  Excel, LibreOffice Calc, or Google Sheets with formula evaluation enabled and 
  external-content warnings dismissed or disabled, cells beginning with =, +, -,
