title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: fix use-after-free of listener socket in iso_conn_ready\n\niso_conn_ready()
  looks up the BIS listener socket with iso_get_sock(),\nwhich takes a reference,
  and then, without re-checking its state,\ncreates a child socket from it:\n\n  \
  \  parent = iso_get_sock(hdev, ...);\n    if (!parent)\n        return;\n\n    lock_sock(parent);\n\
  \    sk = iso_sock_alloc(sock_net(parent), NULL, BTPROTO_ISO, ...);\n    ...\n \
  \   iso_chan_add(conn, sk, parent);\n    ...\n    release_sock(parent);\n    sock_put(parent);\n\
  \nIf the listener socket is closed concurrently, between iso_get_sock()\nand lock_sock(),
  the reference taken by iso_get_sock() may be the last\none: the close path drops
  the link-list reference, and once\niso_conn_ready() drops its own reference at the
  end of the function the\nsocket is freed.  The child socket, however, is already
  linked to the\nfreed parent, and a later disconnect of the child runs iso_chan_del()\n\
  -> bt_accept"
