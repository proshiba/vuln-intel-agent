title: SQLBot is an intelligent Text-to-SQL system based on large language 
  models and RAG. Prior to 1.9.0, an authenticated uploader can submit an 
  image/svg+xml assistant UI logo through PATCH /api/v1/system/assistant/ui, and
  SQLBot stores the SVG without sanitizing or validating embedded active 
  content. SQLBot later serves the file inline from the same application origin 
  through GET /api/v1/system/assistant/picture/{filename}. When another user 
  loads that generated resource, JavaScript embedded in the SVG executes in the 
  SQLBot web application context, resulting in stored cross-site scripting with 
  access to data and actions available to the victim's session. This issue is 
  fixed in version 1.9.0.
