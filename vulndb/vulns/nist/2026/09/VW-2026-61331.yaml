title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-fabrics:
  fix DHCHAP secret leak on parse failure\n\nnvmf_parse_options() duplicates dhchap_secret
  and dhchap_ctrl_secret\nwith match_strdup() before validating the DHHC-1: representation.\n\
  \nIf validation fails, the parser returns -EINVAL before the temporary\nstring in
  p is assigned to opts->dhchap_secret or\nopts->dhchap_ctrl_secret. nvmf_create_ctrl()
  subsequently frees opts,\nbut nvmf_free_options() cannot release the unassigned
  temporary string.\nEach rejected option therefore leaks one allocation.\n\nThis
  is easy to miss because valid secrets transfer ownership to opts\nand are freed
  normally, while the malformed-secret path still returns\nthe expected -EINVAL to
  userspace.\n\nWith CONFIG_NVME_HOST_AUTH enabled, the leak is reachable before the\n\
  required-option checks and transport lookup. No NVMe-oF target or\nworking transport
  connection is required; for example, repeatedly\nwriting\n\n\tdhchap_secret=BAD\n\
  \nor\n\n\tdhchap_ctrl_se"
