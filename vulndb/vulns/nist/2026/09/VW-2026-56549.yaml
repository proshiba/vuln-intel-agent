title: "HTML::FormHandler versions before 0.410002 for Perl render option group labels
  and radio button labels into HTML without escaping.\n\nThe Select, RadioGroup, CheckboxGroup
  and HorizCheckboxGroup widgets render a group label unescaped, Select into a label
  attribute and the other three into element content. RadioGroup also renders each
  radio button's own label unescaped.\n\nAny application whose option list is built
  from data rather than literals, using options_from, an options_fieldname method,
  or the DBIC model, allows attacker-influenced text in a label that can override
  the options or embed JavaScript in rendered pages."
