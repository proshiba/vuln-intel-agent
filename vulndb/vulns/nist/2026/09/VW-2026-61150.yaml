title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  zero pipe read compound padding\n\nCompound response handling extends the last response
  iov to an eight-byte\nboundary.\n\nsmb2_read_pipe() allocates only the payload size,
  so the alignment padding\ncan expose up to seven bytes of uninitialized kernel heap
  memory.\n\nAllocate the aligned size and clear the unused tail before pinning the\n\
  response buffer."
