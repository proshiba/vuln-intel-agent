title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Propagate TPA buffer allocation failures in bnxt_queue_mem_alloc()\n\nbnxt_alloc_one_tpa_info_data()
  returns -ENOMEM as soon as one allocation\nfails. This leaves the remaining rxr->rx_tpa[]
  entries zeroed.\n\nbnxt_queue_mem_alloc() discards that return value, so the partially\n\
  initialized ring is installed by bnxt_queue_start().\n\nSince the agg_id is picked
  by the hardware and bnxt_alloc_agg_idx maps\nit to a SW index in rxr->rx_tpa[],
  it is possible that an uninitialized\nslot can be chosen which would hand a zero
  DMA address to the device.\n\nFix this by checking the return value of bnxt_alloc_one_tpa_info_data\n\
  and unwinding, freeing the ring buffers."
