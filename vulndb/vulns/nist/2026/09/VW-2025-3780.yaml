title: A security flaw has been discovered in Portabilis i-Educar 2.10. The 
  impacted element is an unknown function of the file /usuarios/tipos/novo. The 
  manipulation of the argument name/description results in cross site scripting.
  The attack can be executed remotely. The exploit has been released to the 
  public and may be used for attacks. Upgrading to version 2.12 is sufficient to
  resolve this issue. Upgrading the affected component is recommended. The 
  vendor explains, that "[t]he reported attack vector was tested against the 
  corrected version, and the previously described XSS behavior could no longer 
  be reproduced".
