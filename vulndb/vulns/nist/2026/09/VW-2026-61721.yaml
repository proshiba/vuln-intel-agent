title: The RabbitMQ Java client library allows Java and JVM-based applications 
  to connect to and interact with RabbitMQ nodes. Prior to 5.34.0, 
  AMQConnection.start() applies Math.min(maxInboundMessageBodySize, frameMax) 
  after Connection.Tune negotiation even though AMQP defines frameMax value zero
  as unlimited and ConnectionFactory.DEFAULT_FRAME_MAX is zero. When the client 
  default and server-negotiated value are both zero, the result is passed to 
  Utils.framePayloadLimit(int), which interprets zero as Integer.MAX_VALUE and 
  disables the configured maxInboundMessageBodySize cap. A malicious AMQP 
  server, or a man-in-the-middle attacker able to modify Connection.Tune and 
  inject frames into the connection, can then send an oversized frame of any 
  frame type, causing Frame.readFrom() to allocate a large byte array before 
  content-level validation and potentially terminate the client process through 
  memory exhaustion. This issue is fixed in version 5.34.0.
