title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: GICv2: Don't WARN on out-of-range GICV_DIR INTID\n\nvgic_v2_deactivate()
  passes the INTID a guest wrote to GICV_DIR straight\nto vgic_get_vcpu_irq(), and
  treats a failed lookup as a \"can't happen\"\ncondition with WARN_ON_ONCE().\n\n\
  The guest can make it happen at will, though: for any INTID outside of\nthe implemented
  SGI, PPI and SPI ranges the lookup returns NULL, since\nGICv2 has no LPIs. A guest
  running with EOImode==1 writing such an INTID\nto GICV_DIR triggers the WARN, and
  panics hosts running with\npanic_on_warn.\n\nDrop the WARN and ignore failed lookups."
