title: Mini-XML 4.0.5 contains a memory leak vulnerability in mxml_load_data() 
  during malformed XML parsing. Specially crafted XML input can cause text nodes
  allocated by mxmlNewText() to become unlinked before a parse error transfers 
  control to the cleanup path. These orphaned nodes are not released, resulting 
  in a persistent memory leak on each parsing attempt. Repeated 
  attacker-controlled requests can cause cumulative memory exhaustion and denial
  of service.
