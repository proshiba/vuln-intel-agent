title: If a malicious SDK container declares an extension point with a crafted 
  `directory` path, and a developer runs `flatpak build-init --writable-sdk 
  --sdk-extension` with that SDK, attacker-chosen files could be written outside
  the working directory, since the target path is resolved via a function that 
  allows `..` traversal.
