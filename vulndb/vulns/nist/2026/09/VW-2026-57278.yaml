title: MaxSite CMS through 109.6 ships with a hardcoded session encryption key 
  in application/config/config.php that is never changed during installation, 
  allowing unauthenticated attackers to forge administrator session cookies. 
  Attackers can mint a malicious ci_session cookie with administrator privileges
  by computing an HMAC-SHA1 using the publicly known encryption key, bypassing 
  authentication checks in is_login() and mso_check_allow() functions.
