title: A vulnerability was found in coollabsio Coolify up to 4.1.0. This affects
  the function Github::redirect of the file /webhooks/source/github/redirect of 
  the component GitHub App Setup Handler. The manipulation of the argument state
  results in missing authentication. The attack can be executed remotely. The 
  exploit has been made public and could be used. Upgrading to version 4.1.1 
  mitigates this issue. The patch is identified as 
  fc89e357feed5180ed1ab5eb9cb330578f025539. The affected component should be 
  upgraded.
