title: A weakness has been identified in Zhonglun CloudPOS 3.0. Affected by this
  vulnerability is an unknown functionality of the file Program.cs of the 
  component Automatic Update. Executing a manipulation of the argument 
  version/url/packagekey/package name can lead to channel accessible by 
  non-endpoint. The attack can be launched remotely. Attacks of this nature are 
  highly complex. The exploitation appears to be difficult. The exploit has been
  made available to the public and could be used for attacks. The vendor was 
  contacted early about this disclosure but did not respond in any way.
