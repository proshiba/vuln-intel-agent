title: Docmost is open-source collaborative wiki and documentation software. 
  Prior to 0.80.1, the public avatar and logo image endpoint accepts 
  attacker-controlled fileName path segments and resolves them against local 
  storage without confinement to the intended image directory. An 
  unauthenticated attacker can traverse outside the avatar or logo directory and
  read local storage objects whose final basename satisfies the route's UUID 
  check. This issue is fixed in version 0.80.1.
