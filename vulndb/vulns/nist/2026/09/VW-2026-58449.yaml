title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Prevent client use-after-free during delegation revoke\n\nA delegation stateid holds
  only a bare pointer to its owning\nnfs4_client and does not keep it alive.  The
  client survives its\nstateids only because __destroy_client() drains cl_delegations
  and\ncl_revoked before free_client() runs.\n\nnfs4_laundromat() breaks that invariant:
  it unhashes an\nexpired delegation from cl_delegations, drops deleg_lock, then\n\
  revoke_delegation() relinks it onto cl_revoked under cl_lock.  In that\nwindow the
  delegation is on neither list, so client_has_state() can\nreport no remaining state.\n\
  \nEvery teardown path first requires cl_rpc_users to be zero, but\nthe laundromat
  holds no such reference.  A client whose recalled\ndelegation has just timed out
  can therefore reach free_client()\nwhile revoke_delegation() is still about to dereference
  cl_lock,\na use-after-free.\n\nPin the client with cl_rpc_users across the revoke
  so teardown blocks\nunti"
