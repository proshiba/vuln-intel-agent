title: Verizon Cloud for Android (com.vcast.mediamanager) before 26.7.10 
  contains a path traversal vulnerability that allows co-resident malicious 
  applications to write attacker-controlled bytes outside the intended staging 
  directory by supplying a crafted _display_name value containing path-traversal
  sequences through exported activities OneTouchUploadActivity and 
  PrintShopCloudActivity. Attackers can exploit the unsanitized filename 
  concatenation in the file-staging sink via ACTION_SEND or ACTION_SEND_MULTIPLE
  intents to achieve arbitrary file write and inject attacker-controlled content
  into the authenticated user's Verizon Cloud account without user interaction.
