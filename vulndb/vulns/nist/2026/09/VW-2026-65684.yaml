title: "An Authenticated Remote Code Execution via Arbitrary File Write in the Intermec
  Fingerprint Command Interface vulnerability in the web management interface in Honeywell
  PD45 Industrial Printer version F10.19.010040, allows an authenticated user with access to the admin or itadmin account to submit commands written in the Intermec Fingerprint programming language directly to the printer ’s internal command interpreter. \n\
  \n\nAn attacker could potentially exploit this vulnerability, leading to the execution
  of malicious files and commands. Honeywell also recommends updating to the most
  recent firmware version, Honeywell PD45 Industrial Printer firmware F10.22.030745,
  which includes a fix for this vulnerability."
