title: "Issue summary: SM2 signature generation uses non-constant-time arithmetic\n\
  on secret values, forming a timing side-channel.\n\nImpact summary: An attacker
  able to measure SM2 signing times may learn\ninformation about the per-signature
  secret nonce, which over many signatures\ncan, via a lattice / Hidden Number Problem
  attack, lead to recovery of the\nprivate key.\n\nCWE: CWE-208: Observable Timing
  Discrepancy\n\nDescription: SM2 signature generation computes the signature value
  using\nvariable-time BIGNUM operations on the secret nonce and the private key,
  so\nthe time taken to produce an SM2 signature depends on these secret values,\n\
  forming a timing side-channel.\n\nApplications performing SM2 signature generation
  are affected on all\nplatforms.\n\nFIPS Impact: no\nSM2 is not a FIPS algorithm."
