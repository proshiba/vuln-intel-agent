title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex:
  Fix race on the initial mm->futex.phash.ref allocation\n\nfutex_hash_allocate()
  allocates mm->futex.phash.ref without any locking.\nCommit d9b05321e21e (\"futex:
  Move futex_hash_free() back to __mmput()\")\nmoved the allocation here and assumed
  that the process has just a single\nthread at this point.\n\nCommit ee9dce44362b
  (\"futex: Drop CLONE_THREAD requirement for private\ndefault hash alloc\") widened
  need_futex_hash_allocate_default() to cover\nany CLONE_VM clone, but left out vfork
  because the parent is suspended and\ncannot race.\n\nThat no longer holds once vfork
  is nested. If a vfork child calls vfork\nagain and is then killed with SIGKILL,
  the parent is released from its\nvfork wait and runs concurrently with the grandchild
  in the same mm.\nNeither of them went through futex_hash_allocate_default().\n\n\
  When both call prctl(PR_FUTEX_HASH, PR_FUTEX_HASH_SET_SLOTS) at the same\ntime,
  each one sees mm->futex.phash.ref as NULL "
