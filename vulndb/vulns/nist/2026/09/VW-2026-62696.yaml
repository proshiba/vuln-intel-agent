title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject programs with inlined helpers if JIT is not available\n\nWhen an architecture
  (such as LoongArch, ARM64, and RISC-V) implements\nbpf_jit_inlines_helper_call(),
  the verifier skips rewriting the helper\ncall offset (insn->imm) in bpf_do_misc_fixups().
  This is because the\nhelper is expected to be inlined by the JIT compiler later.
  Therefore,\ninsn->imm remains as the raw helper enum ID.\n\nHowever, if JIT is disabled
  at runtime (net.core.bpf_jit_enable=0) or\nif JIT compilation fails dynamically
  (e.g., due to OOM), the program\nfalls back to the BPF interpreter.\n\nWhen the
  interpreter executes (__bpf_call_base + insn->imm) with the\nunpatched raw ID, it
  jumps into an invalid address space, triggering\nan instruction alignment fault
  or a kernel panic.\n\nAlthough these helpers have valid C implementations in the
  kernel, the\nomission of offset rewriting makes runtime interpreter fallback fatal.\n\
  \nFix this by setting 'prog->ji"
