title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a missing authorization vulnerability in 
  plugin/Scheduler/sendEmail.json.php that allows unauthenticated attackers to 
  access scheduler email jobs by providing a site-wide daily token. Attackers 
  can enumerate scheduler jobs, read private live titles and email addresses, 
  and trigger email sending by supplying any valid daily token obtained from 
  Live pages.
