title: copyparty contains a volume restriction bypass vulnerability in its SFTP 
  front end that allows authenticated SFTP users to create, remove, and truncate
  arbitrary paths outside permitted volume boundaries by exploiting three 
  handlers that bypass the xvol volflag enforcement. The _mkdir, _rmdir, and 
  _chattr handlers construct destination paths using vfs.get(), vn.canonical(), 
  and os.path.join() without invoking the chk_ap access check, enabling 
  attackers to traverse symlinks leaving a volume's top directory and perform 
  unauthorized file creation, deletion, or truncation via SSH_FXP_SETSTAT 
  operations on paths outside any volume the account is authorized to access.
