title: "Improper Validation of Specified Quantity in Input in ZenHive mpp allows an
  unauthenticated remote client to inflate the fee-payer's gas cost per sponsored
  payment by a large multiplier and to have the sponsor pay for provisioning an access
  key on the client's own account.\n\nWhen the server sponsors Tempo payments, MPP.Methods.Tempo.FeePayerPolicy.measure/3
  in lib/mpp/methods/tempo/fee_payer_policy.ex bounds the gas fields, the fee budget,
  the validity window and the access list of the client-signed 0x76 envelope, but
  does not check whether the envelope carries the optional key_authorization field.
  A client can attach a fully signed key authorization, provisioning a new access
  key with token spending limits on its own account, alongside the normal payment
  call. The key and each limit entry are persistent storage writes billed as intrinsic
