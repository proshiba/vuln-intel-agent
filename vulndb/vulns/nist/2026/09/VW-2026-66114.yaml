title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mark faultable stack helpers as sleepable\n\nThe faultable variants of bpf_get_stack()
  and bpf_get_task_stack() pass\nmay_fault=true into the common stack collection code.
  Resolving user-space\nbuild IDs may then call build_id_parse_file() and block on
  filesystem\nreads.\n\nNeither helper prototype sets might_sleep. Since prototype
  selection uses\nthe sleepability of the whole program, the verifier can still allow
  these\nhelpers from a non-sleepable region within that program, such as an\nexplicit
  RCU or preemption-disabled region. The task-stack helper can also\nbe called from
  a non-sleepable timer callback of a sleepable program.\n\nMark both faultable prototypes
  as sleepable. The existing helper context\ncheck then rejects these calls while
  continuing to allow them in genuinely\nsleepable contexts."
