title: MaxKB is an open-source AI assistant for enterprise. In 2.10.2-lts and 
  earlier, the /chat/api/mcp authentication path looks up an ApplicationApiKey 
  using only its secret and active status, without enforcing the is_permanent 
  and expire_time checks used by the standard chat API. A previously valid, 
  non-permanent application key that remains active after expiration can 
  initialize the MCP endpoint, list the published application's tool metadata, 
  invoke tools/call, and create durable application_chat and 
  application_chat_record state even though /chat/api/open rejects the same key.
  No fixed version is available as of this review.
