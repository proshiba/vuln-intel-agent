title: "Uncontrolled Resource Consumption vulnerability in ash-project ash lets a
  slow asynchronous read spin a scheduler thread at full CPU while the framework waits
  for it.\n\nAsh.Actions.Read.AsyncLimiter.await_at_least_one/1 (lib/ash/actions/read/async_limiter.ex)
  waited for concurrent async read tasks by polling each with Task.yield(task, 0)
  in a tight loop rather than blocking. While every outstanding task is still running
  (a slow related-data load or calculation), the loop returns immediately and repeats,
  busy-spinning and holding a BEAM scheduler at full CPU for the whole duration of
  the slow read; concurrent slow reads tie up further schedulers. The fix waits with
  Task.yield_many (a non-blocking sweep followed by a blocking wait with timeout:
  :infinity), so the process sleeps until a task completes instead of spinning.\n\n\
  This issue affects ash: from 2.19.0 before 3.32.2."
