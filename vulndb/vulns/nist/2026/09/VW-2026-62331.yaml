title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/cxgb4:
  Free debugfs on registration failure\n\nc4iw_alloc() creates the per-device debugfs
  tree (dev->debugfs_root via\nsetup_debugfs()), but it is removed only in c4iw_remove(),
  not in\nc4iw_dealloc().  When RDMA device registration fails, the registration\n\
  worker's err_dealloc_ctx path calls c4iw_dealloc() directly, bypassing\nc4iw_remove(),
  so the debugfs dentries leak and outlive the freed\nc4iw_dev.\n\nMove debugfs_remove_recursive()
  into c4iw_dealloc() so every path that\nfrees ctx->dev also removes its debugfs
  tree."
