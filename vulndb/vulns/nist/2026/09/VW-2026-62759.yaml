title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  validate the persisted dirty_tail chain at load\n\nThe writeback worker follows
  the persisted dirty_tail chain, which is\ndecoded from the cache device independently
  of the key_tail chain that\ncache_replay() walks and bounds. A crafted image, whose
  on-media fields are\nauthenticated only by a crc32c with a fixed seed, can aim dirty_tail
  at a\nchain of last ksets that never terminates, so cache_writeback_fn() re-arms\n\
  itself with no delay forever.\n\nWalk the dirty_tail chain once at load with the
  same hop cap cache_replay()\nuses and fail the table load with -EIO if it does not
  reach an end within\nn_segs hops."
