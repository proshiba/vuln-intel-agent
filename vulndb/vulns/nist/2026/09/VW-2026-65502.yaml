title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  hidpp: fix potential UAF in hidpp_connect_event()\n\nIf input_register_device()
  fails, we call input_free_device(), but keep\nstale pointer to the old device in
  hidpp->input, which could potentially\nlead to UAF. Fix that by resetting it to
  NULL before returning from\nhidpp_connect_event()."
