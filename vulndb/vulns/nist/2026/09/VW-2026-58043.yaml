title: SPIP before 4.4.18 contains an unauthenticated blind SQL injection 
  vulnerability in the public sitemap endpoint where the MySQL escaper 
  spip_mysql_cite() in ecrire/req/mysql.php returns values unescaped when the 
  target column is a date type and the supplied value matches the pattern of a 
  word character followed by an open parenthesis. Attackers can supply a crafted
  value such as a time-based payload through the annee parameter in 
  squelettes-dist/sitemap.xml.html to embed arbitrary SQL directly into the 
  generated query, enabling time-based and boolean-based blind SQL injection 
  that can expose arbitrary database content including the alea_ephemere secret 
  used to sign action nonces.
