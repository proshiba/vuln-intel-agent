title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix partial-write detection in nfsd_direct_write\n\nnfsd_direct_write() walks a
  list of write segments and, after each\nvfs_iocb_iter_write(), tries to detect a
  short write so the loop can\nstop before placing the next segment at a wrong file
  offset:\n\n    host_err = vfs_iocb_iter_write(file, kiocb, &segments[i].iter);\n\
  \    if (host_err < 0)\n            return host_err;\n    *cnt += host_err;\n  \
  \  if (host_err < segments[i].iter.count)\n            break;\t/* partial write
  */\n\nvfs_iocb_iter_write() runs the iter through ->write_iter(), which\nadvances
  the iter by the number of bytes written. By the time the\ncheck runs, segments[i].iter.count
  is the residual, not the original\nrequest length:\n\n    before write_iter: iter.count
  == original_len\n    after  write_iter: iter.count == original_len - host_err\n\n\
  The condition then reduces to host_err < original_len - host_err, so\nthe break
  fires only when less than half of the segmen"
