title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mglru:
  fix and remove redundant unevictable folio handling\n\nsort_folio() has a shortcut
  for moving folios that are no longer evictable\nbut are still sitting on a generation
  list.  However, this shortcut is\nbuggy.  It does not follow the PG_lru usage convention,
  and it has a more\nserious issue.\n\nUnevictable folios are not threaded on lists[LRU_UNEVICTABLE],
  so that\nfolio->lru can be reused to hold folio->mlock_count (see the comment in\n\
  lruvec_init()).  Hence lruvec_add_folio() skips the list_add() for them,\nand every
  other place that turns a folio unevictable initialises\nmlock_count explicitly:
  lru_add() sets it to 0, __mlock_folio() and\n__mlock_new_folio() set it to !!folio_test_mlocked(folio).\
  \  sort_folio()\nsets nothing, and the lru_gen_del_folio() right above it may have
  already\npoisoned folio->lru via list_del(), so mlock_count ends up aliasing\nLIST_POISON2,
  which reads as 0x122, i.e.  290.  The result is user\nv"
