title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Bound i2c->length in I2C bsg handlers\n\nstruct qla_i2c_access carries
  a 16-bit length field alongside a fixed\n64-byte buffer:\n\n\tstruct qla_i2c_access
  {\n\t\tuint16_t device, offset, option, length;\n\t\tuint8_t  buffer[0x40];\n\t\
  } __packed;\n\nqla2x00_write_i2c() and qla2x00_read_i2c() use the user-supplied\n\
  i2c->length without any bounds check. i2c is overlaid on a 256-byte\non-stack buffer
  and sfp is a 256-byte DMA-pool buffer, so a length up to\n65535 overruns both:\n\
  \n  - write: memcpy(sfp, i2c->buffer, i2c->length) over-reads the stack and\n  \
  \  over-writes the sfp heap buffer, and qla2x00_write_sfp() then DMAs\n    i2c->length
  bytes out of the 256-byte buffer.\n  - read: qla2x00_read_sfp() DMAs i2c->length
  bytes into the 256-byte sfp,\n    then memcpy(i2c->buffer, sfp, i2c->length) overflows
  the 64-byte\n    buffer inside the on-stack array.\n\nA caller holding CAP_SYS_RAWIO
  can use this to corrupt the heap and the\nkerne"
