title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Preserve unique-field state across nested structs\n\nbtf_find_struct_field() initializes
  a fresh seen mask for every recursive\ndescent. Unique special fields in different
  levels of the same aggregate\ntherefore do not see one another. The duplicate fields
  can reach\nbtf_parse_fields(), where they trigger an invariant WARN_ON_ONCE(). A\n\
  crafted user BTF can consequently trigger the warning before map creation\nchecks
  capabilities.\n\nInitialize the seen mask once in btf_find_field() and pass the
  same pointer\nthrough struct, datasec, and nested-struct walks. This gives the entire
  field\ntraversal one shared uniqueness state."
