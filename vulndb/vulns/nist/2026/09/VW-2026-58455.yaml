title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  reject out-of-range useconds in NFSv2 SETATTR/CREATE\n\nThe NFSv2 sattr decoder
  converts the wire useconds to nanoseconds in\nsvcxdr_decode_sattr():\n\n\tiap->ia_atime.tv_nsec
  = tmp2 * NSEC_PER_USEC;\n\ntmp2 is a u32 and NSEC_PER_USEC is 1000, so the product
  is computed in\nunsigned long. On ILP32 that is 32 bits, and an out-of-range useconds\n\
  value such as 4294968 wraps to tv_nsec == 704. The corruption therefore\nhappens
  during decode, before any proc function can inspect the value,\nand a later range
  check on tv_nsec would see an in-range result and\naccept it. Rejecting in the decoder
  yields an RPC GARBAGE_ARGS reply.\nNFSv2 defines no NFSERR_INVAL, so there is no
  NFS-level status to return\nfor a malformed time argument, and the check cannot
  move to the proc\nfunction the way the v3/v4 nsec range checks do.\n\nGuard the
  raw useconds before the multiplication and reject values\ngreater than 1000000.
  useconds == 1000000 is kept"
