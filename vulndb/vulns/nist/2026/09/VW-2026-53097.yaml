title: A vulnerability has been found in Casdoor up to 4.0.0. This affects an 
  unknown function of the file controllers/resource.go of the component 
  upload-resource API. Such manipulation leads to missing authentication. It is 
  possible to launch the attack remotely. The exploit has been disclosed to the 
  public and may be used. The vendor deleted the GitHub issue for this 
  vulnerability without any explanation. Afterwards the vendor was contacted 
  early about this disclosure via email but did not respond in any way.
