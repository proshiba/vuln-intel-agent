title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mana: restore the XDP program pointer when pre-allocation fails\n\nmana_xdp_set()
  publishes the new program into apc->bpf_prog before it\nallocates anything, because
  mana_pre_alloc_rxbufs() sizes the buffers\nfrom it via mana_get_rxbuf_cfg(). When
  that allocation fails the\nfunction returns the error directly, skipping the err_dealloc_rxbuffs\n\
  label which is the only place that restores the previous pointer.\n\nThe attach
  is reported as failed, so the BPF core drops the reference it\nheld for the caller
  and the program can be freed, while apc->bpf_prog\nstill points at it. The next
  consumer of mana_xdp_get() - typically\nmana_chn_setxdp() from mana_alloc_queues()
  on the following ifup, or\nafter a TX timeout reset - then calls bpf_prog_add()
  on freed memory.\n\nThis is reachable from an ordinary \"ip link set dev ethX xdp
  obj ...\"\nwhenever the per-queue RX buffer pre-allocation cannot be satisfied.\n\
  \nRestore the previous program"
