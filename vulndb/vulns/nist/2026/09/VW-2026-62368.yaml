title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: use proto_lock for l2cap_data to fix l2cap_disconn_ind\n\nhci_conn::l2cap_data
  is accessed without locks in l2cap_disconn_ind via\nhci_conn_timeout (disc_work)
  -> hci_proto_disconn_ind ->\nl2cap_disconn_ind.  This is UAF if the l2cap_conn is
  deleted\nconcurrently.\n\ndisc_work is disabled sync in hci_conn_del(), so we cannot
  take\nhci_dev_lock in disc_work.\n\nFix by using proto_lock to guard l2cap_data,
  in addition to hdev->lock\nwhich is held in other access paths."
