title: "A DHCP server, or anyone on the LAN who answers a DISCOVER first, can make
  the client read about a\n\n\n\nkilobyte past the end of the received message.\n\n\
  \n\nThe option walk keeps a pointer and an offset in step, and the only bound check
  uses the offset:\n\n\n\n```c\n\n\n\n/* addons/dhcp/nxd_dhcp_client.c:7538, 7572
  */\n\n\n\nwhile (i < length - 1)\n\n\n\n{\n\n    ...\n    size = *(++data);    \
  \  /* data moves 1: type -> length byte */\n    data += size + 1;      /* data moves
  size + 1 more          */\n    i += size + 1;         /* i moves only size + 1 \
  \            */\n\n\n}\n\n\n\n```\n\n\n\nA TLV option occupies size + 2 bytes. `data`
  is advanced by size + 2 in total, `i` by size + 1, so\n\n\n\nthe offset falls one
  byte behind the real read position for every option the walk skips. After\n\n\n\n\
  enough skipped options the check `i < length - 1` still holds while `data` is already
  past the end\n\n\n\nof the message, and the subsequent read of the type and length
  bytes comes from whatever follows.\n\n\n\nA single OFFER carrying a long run "
