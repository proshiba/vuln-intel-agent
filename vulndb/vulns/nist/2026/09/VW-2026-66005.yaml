title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Set the trace clock before registering the histogram trigger\n\nhist_register_trigger()
  puts the trigger on the global named_triggers\nlist in cmd_ops->init(), and only
  then sets the trace clock:\n\n\tif (data->cmd_ops->init) {\n\t\tret = data->cmd_ops->init(data);\n\
  \t\tif (ret < 0)\n\t\t\tgoto out;\n\t}\n\n\tif (hist_data->enable_timestamps) {\n\
  \t\tret = tracing_set_clock(file->tr, hist_data->attrs->clock);\n\t\tif (ret) {\n\
  \t\t\thist_err(tr, HIST_ERR_SET_CLOCK_FAIL, errpos(clock));\n\t\t\tgoto out;\n\t\
  \t}\n\nThe clock string is not checked anywhere before that call, so a named\ntrigger
  using common_timestamp with an unknown clock fails after it has\nalready become
  findable. event_hist_trigger_parse() then frees it\nwithout taking it off the list,
  and the next lookup by name reads the\nfreed object:\n\n ~# cd /sys/kernel/tracing/events/sched/sched_switch\n\
  \ ~# echo 'hist:name=foo:keys=common_pid:ts=common_timestamp:clock=bogus' > trigger\n\
  \ bash: echo: writ"
