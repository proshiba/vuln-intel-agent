title: "The account recovery (password reset) functionality in the vulnerability-lookup
  web application contains a time-of-check-to-time-of-use (TOCTOU) race condition
  in the consumption of single-use recovery tokens. The original implementation verified
  the token nonce against the stored digest and then consumed (cleared) it in separate
  database operations. Two concurrent HTTP requests presenting the same valid recovery
  token could both pass the verification check before either transaction committed,
  allowing both to set their own password on the target account. The last transaction
  to commit overwrites the first, enabling an attacker who possesses a valid recovery
  token to replace the legitimate user's password with one of their choosing.\n\n\
  A secondary defect in the same endpoint (confirm_account) allowed a valid recovery
  link to be used to set an empty or trivially short password (e.g., three characters).
