title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to 1.0.8.5, getThemeFolder() in 
  admin/controller/editor/revisions.php returns the attacker-controlled theme 
  parameter without sanitization, and backupFolder() concatenates it beneath 
  DIR_THEMES before editor/revisions/load or editor/revisions/delete operates on
  a named .html file. sanitizeBackupFileName() strips traversal characters only 
  from the separate file parameter and does not protect the theme directory 
  component. An authenticated user with the default Editor role and editor/* 
  permission can submit traversal sequences that redirect file_get_contents() or
  unlink() to a reachable backup subdirectory outside the web root. A valid 
  admin session and CSRF token are required, the read is limited to .html files 
  in backup directories, and deletion additionally requires filesystem write 
  permission. This can disclose sensitive exported site content or remove backup
  data. This issue
