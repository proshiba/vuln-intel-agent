title: ntopng is a web-based network traffic monitoring application. Prior to 
  6.7.260717, the vulnerability-scan endpoints 
  scripts/lua/rest/v2/add/host/to_scan.lua and 
  scripts/lua/rest/v2/exec/host/schedule_vulnerability_scan.lua accept the 
  scan_ports parameter without an administrator gate and pass it through 
  validateSingleWord, which permits shell metacharacters. 
  scripts/lua/modules/vulnerability_scan/vs_utils.lua then concatenates 
  scan_ports into an nmap command in nmap_scan_host and executes the command 
  through ntop.execCmd or ntop.execCmdAsync and popen. Any authenticated 
  non-admin user can execute operating-system commands as the ntopng process 
  account when nmap is available. Because the endpoints accept GET requests 
  while ntopng's CSRF validation applies to POST request bodies, an attacker can
  also trigger the command through a logged-in user's browser without possessing
  ntopng credentials. This issue is fixed in version 6.7.260717.
