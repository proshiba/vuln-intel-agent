title: "In the Linux kernel, the following vulnerability has been resolved:\n\nzram:
  fix out-of-bounds access in writeback_store()\n\nPatch series \"zram: fix stale
  scan bounds after reinitialization\".\n\nBoth writeback_store() and read_block_state()
  derive their table scan\nbounds from zram->disksize before acquiring dev_lock. \
  \ If the device is\nreset and reinitialized with a smaller disksize between that
  read and lock\nacquisition, the bound can describe the old table while the scan
  operates\non the new one.  This can lead to out-of-bounds slot accesses.\n\nMove
  both bound calculations under dev_lock so each bound remains\nconsistent with the
  table throughout its scan.  Keep the fixes separate\nbecause the affected interfaces
  originate from different commits and can\nbe backported independently.\n\n\nThis
  patch (of 2):\n\nwriteback_store() calculates the table scan bounds before taking
  dev_lock.\nA reset followed by reconfiguration with a smaller disksize can therefore\n\
  replace zram->table while writeback_store() "
