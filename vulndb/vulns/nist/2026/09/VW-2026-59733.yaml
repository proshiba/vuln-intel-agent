title: A vulnerability was detected in GNU Binutils 2.47. Affected by this 
  vulnerability is the function elf_x86_allocate_dynrelocs of the file 
  bfd/elfxx-x86.c of the component Dynamic Relocation Allocation. The 
  manipulation results in null pointer dereference. The attack requires a local 
  approach. The exploit is now public and may be used. Upgrading to version 2.48
  addresses this issue. The patch is identified as 
  d1268210b6f6/471130b39c0/283d3198bed/0a84e560216/a692a633d40. Upgrading the 
  affected component is recommended.
