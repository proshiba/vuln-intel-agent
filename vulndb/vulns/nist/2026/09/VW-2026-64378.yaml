title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, validate_url_for_ssrf checks 
  a hostname's resolved addresses, but Requests and urllib3 resolve the hostname
  again when connecting. A caller can use a short-lived DNS answer that is 
  public during validation and private during connection, preserving 
  unauthenticated access to internal or metadata endpoints despite the earlier 
  CVE-2026-27826 remediation. The advisory traces the vulnerable input and 
  processing flow through validate_url_for_ssrf, _check_dns_resolution, 
  socket.getaddrinfo, and _make_ssrf_safe_hook, which identify the affected 
  entry points, controls, and code paths. This issue is fixed in version 0.22.0.
