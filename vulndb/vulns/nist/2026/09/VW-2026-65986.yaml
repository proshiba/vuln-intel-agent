title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/ivpu:
  Validate firmware log buffer metadata\n\nThe tracing log headers parsed by fw_log_print_buffer()
  reside in\nDMA-shared BOs that the NPU firmware can write to.\n\nfw_log_from_bo()
  validated log->header_size and log->size, but\nfw_log_print_buffer() re-read those
  same fields from shared memory\nafterwards, allowing a TOCTOU where firmware changes
  them between the\ncheck and the use, and making the host dereference out-of-bounds\n\
  addresses while printing logs.\n\nSnapshot the validated values once with READ_ONCE()
  and pass them down\nexplicitly in a new struct ivpu_fw_log_desc instead of re-reading
  them\nfrom the shared struct."
