title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: Fix accept list UAF during suspend\n\nhci_update_event_filter_sync() walks
  hdev->accept_list while sending a\nsynchronous HCI command for each remote-wakeup
  device.  The suspend path\nholds hdev->req_lock, but accept-list updates are serialized
  by hdev->lock.\nConsequently, remove_device() can free the current list entry during
  the\ncontroller wait.\n\nThe following interleaving causes the use-after-free:\n\
  \n  hci_update_event_filter_sync()    remove_device()\n  fetch accept-list entry\n\
  \  hci_set_event_filter_sync()\n    wait for controller response    hci_dev_lock()\n\
  \                                    list_del()\n                              \
  \      kfree()\n                                    hci_dev_unlock()\n  read the
  freed list.next\n\nKASAN reported:\n\n  BUG: KASAN: slab-use-after-free in hci_suspend_sync+0x835/0x910\n\
  \  Read of size 8 at addr ffff88810bec8440 by task kworker/0:1/10\n  Workqueue:
  events vhci_susp"
