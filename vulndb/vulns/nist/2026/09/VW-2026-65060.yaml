title: Klever-Go is the Go implementation of the Klever blockchain protocol. 
  Prior to 1.7.20, indexer/common.go serializedDataForUpdateAccounts places the 
  attacker-controlled acc.Name value into an Elasticsearch _bulk JSON and NDJSON
  request without escaping it. The SetAccountName transaction accepts valid 
  UTF-8 account names containing quotes, backslashes, and newlines, and the 
  resulting name is stored in consensus account state. When an indexer processes
  the account, those characters can break the JSON string, reject a bulk batch, 
  or inject additional bulk actions that create, overwrite, or delete documents 
  in indices writable by the indexer. The persistent state value is replayed by 
  new or historical indexers, and direct access to the indexing host or 
  Elasticsearch port is not required. This issue is fixed in version 1.7.20.
