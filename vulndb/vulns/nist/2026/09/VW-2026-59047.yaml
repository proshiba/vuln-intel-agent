title: "Exposure of Sensitive Information to an Unauthorized Actor vulnerability in
  Apache Syncope.\n\nAn administrator with adequate entitlements can get access via
  REST to the list of existing Access Tokens, including their signed JWT body.\nThese
  values can be then used to perform further REST requests, impersonating users with
  higher administration entitlements.\n\n\n\n\n\nThis issue affects Apache Syncope:
  from 3.0.0-M0 through 3.0.16, from 4.0.0-M0 Through 4.0.7, from 4.1.0-M0 through
  4.1.2.\n\nUsers are recommended to upgrade to version 4.0.8 / 4.1.3, which fix this
  issue."
