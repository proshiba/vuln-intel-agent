  of the argument Content-Range causes out-of-bounds read. The attack requires local
  access. The exploit has been made available to the public and could be used for
  attacks. Upgrading to version abi-16.26 will fix this issue. Patch name: c74a3065038ede35c1c7b75fa493a69ef6bcdb84.
