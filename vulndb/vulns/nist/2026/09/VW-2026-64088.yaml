title: A flaw was found in libstoragemgmt. An attacker with control over a local
  or virtual storage device could provide specially crafted SCSI (Small Computer
  System Interface) Vital Product Data (VPD) page 0x80 data. This malformed 
  data, specifically an untrusted page length field, can lead to a stack buffer 
  overflow in the `_sg_parse_vpd_80()` function during serial number parsing. 
  Successful exploitation could result in a denial of service by crashing or 
  destabilizing the process querying the serial number.
