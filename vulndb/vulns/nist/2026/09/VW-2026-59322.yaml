title: "Zephyr's TLS socket layer in subsys/net/lib/sockets/sockets_tls.c keeps a
  single process-global array, client_cache, of cached client sessions that is shared
  by every TLS socket context. The functions that mutate and read it — tls_session_save(),
  tls_session_get(), tls_session_cache_reset(), and the settings restore handler —
  allocate, free, and dereference each entry's heap buffer (entry->session). Before
  the fix these accesses were serialized only by the per-socket context mutex ctx->lock
  (assigned per socket in ctx_set_lock()), which provides no mutual exclusion between
  different sockets touching the shared cache.\n\nBecause CONFIG_NET_SOCKETS_TLS_MAX_CLIENT_SESSION_COUNT
  defaults to 1, any two concurrent client sockets contend for the same slot. A thread
  in tls_session_get() reading entry->session inside mbedtls_ssl_session_load() can
  run concurrently with another thread in tls_session_save() that selects the same
  entry for reuse and executes mbedtls_free(entry->session) before reall"
