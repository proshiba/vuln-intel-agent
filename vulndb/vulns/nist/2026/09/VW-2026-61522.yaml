title: Backstage is an open framework for building developer portals. Prior to 
  1.14.6 and from 1.15.0 until 1.15.4, the @backstage/plugin-techdocs-node 
  package insufficiently validates mkdocs.yml supplied by an authenticated user 
  who can register or modify a TechDocs source. Unsafe Python YAML tags, 
  markdown_extensions names and configuration, theme options, and 
  extra_templates values can reach the documentation generator and cause 
  unintended code execution. The resulting impact is limited to the files, 
  credentials, network access, and other resources available to the TechDocs 
  backend or build container. This issue is fixed in versions 1.14.6 and 1.15.4.
