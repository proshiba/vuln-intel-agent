title: A security flaw has been discovered in sfturing hosp_order up to 
  627f426331da8086ce8fff2017d65b1ddef384f8. The affected element is the function
  modifyPassWord of the file 
  ssm_pro/src/main/java/cn/sfturing/web/CommonUserController.java of the 
  component Password Recovery. Performing a manipulation results in unverified 
  password change. Remote exploitation of the attack is possible. The exploit 
  has been released to the public and may be used for attacks. This product 
  follows a rolling release approach for continuous delivery, so version details
  for affected or updated releases are not provided. The project was informed of
  the problem early through an issue report but has not responded yet.
