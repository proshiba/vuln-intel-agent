title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  hhf: clamp quantum before hhf_change() to avoid overflow\n\nhhf_init() sets q->quantum
  = psched_mtu(qdisc_dev(sch)) with no overflow\ncheck. A device with a huge MTU (e.g.
  dummy with max_mtu == 0 accepting\nMTU 2147483634) makes weight * quantum overflow
  the signed deficit in\nhhf_dequeue(), spinning forever.\n\nClamp q->quantum before
  hhf_change() so both the opt and !opt paths see\na sane quantum. Without this, bare
  \"tc qdisc add ... hhf\" succeeds with\na clamped quantum but \"tc qdisc add ...
  hhf limit 1000\" (any option\npresent) fails with -EINVAL because hhf_change() re-validates
  the\nunclamped default (sch_hhf.c:559). 256 matches fq_codel's floor and is\na sane
  minimum for a DRR quantum.\n\nConditions to recreate the bug: a device whose MTU
  (plus\nhard_header_len) wraps psched_mtu() into the sign bit (e.g. a dummy\ndevice
  with max_mtu == 0 accepting MTU 2147483634). Requires\nCAP_NET_ADMIN in a user namespace."
