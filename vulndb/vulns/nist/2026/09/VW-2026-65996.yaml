title: "In the Linux kernel, the following vulnerability has been resolved:\n\nufs:
  validate cylinder group metadata before caching it\n\nufs_read_cylinder() copies
  the cylinder group index and the rotor\npositions straight from the on-disk group
  and caches them without any\ncheck:\n\n\tucpi->c_cgx    = fs32_to_cpu(sb, ucg->cg_cgx);\n\
  \tucpi->c_rotor  = fs32_to_cpu(sb, ucg->cg_rotor);\n\tucpi->c_frotor = fs32_to_cpu(sb,
  ucg->cg_frotor);\n\tucpi->c_irotor = fs32_to_cpu(sb, ucg->cg_irotor);\n\nThey are
  then used as indices during allocation and free:\n\n  - c_cgx indexes the cylinder
  summary array as\n    UFS_SB(sb)->fs_cs(ucpi->c_cgx), so a value past s_ncg writes
  a 32\n    bit count outside the s_csp allocation.\n\n  - c_frotor becomes a bitmap
  scan start, start = c_frotor >> 3, and\n    then length = ((s_fpg + 7) >> 3) - start.
  A start beyond the block\n    bitmap wraps the unsigned length to a huge value,
  so ubh_scanc()\n    walks far past the cylinder group buffers. c_irotor drives the\n\
  \    inode bitmap the same way.\n"
