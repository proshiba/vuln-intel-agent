title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregulator:
  as3722_get_regulator_dt_data: fix premature of_node_put leaving dangling of_node
  pointer\n\nIn as3722_get_regulator_dt_data(), of_get_child_by_name() acquires a\n\
  reference on np, which is then assigned to pdev->dev.of_node. The\nfunction immediately
  calls of_node_put(np), releasing the reference and\nleaving pdev->dev.of_node as
  a dangling pointer.\n\nRemove the of_node_put(np) call to let the device hold the
  reference."
