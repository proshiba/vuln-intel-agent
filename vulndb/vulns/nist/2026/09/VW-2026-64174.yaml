title: "Net::IDN::Punycode versions from 2.301 before 2.590 for Perl allow a heap
  use-after-free via a decoded code point that reallocates the output buffer in decode_punycode.\n\
  \nThe XS backend inserts each decoded code point into the string buffer of the scalar
  it returns. decode_punycode computes the insertion pointer first and only then grows
  the buffer when the code point does not fit. The growth reallocates the buffer and
  updates every pointer except the insertion pointer, so the move that follows and
  the write of the code point go through a freed pointer. The buffer starts at twice
  the label length, and a code point above U+FFFF takes four bytes in the output,
  so a label of such code points outgrows it and forces the reallocation.\n\nVersion
  2.301, the fix for CVE-2016-15059, introduced the defect. Only the XS backend is
  affected.\n\nDecoding an attacker-supplied punycode label reads and writes freed
  heap memory."
