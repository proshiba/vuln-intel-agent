title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  null-check fib6_node before accessing in __ip6_del_rt_siblings()\n\nsyzbot reported
  a null-ptr-deref in __ip6_del_rt_siblings() [0].\n\nThe stack trace hinted towards
  a null dereference of rt->fib6_node when\nfn->leaf is accessed in __ip6_del_rt_siblings().
  With\nRTNL_FLAG_DOIT_UNLOCKED set, inet6_rtm_delroute() operations run\nconcurrently
  without acquiring the RTNL lock. In ip6_route_del(), the\nroute lookup happens under
  rcu_read_lock() without acquiring\ntable->tb6_lock.\n\nBetween ip6_route_del() looking
  up the route and __ip6_del_rt_siblings()\nacquiring table->tb6_lock, another thread
  can modify the routing table.\nFor example, when an ECMP route is replaced via RTM_NEWROUTE
  with\nNLM_F_REPLACE, fib6_add_rt2node() unlinks all old siblings and sets\niter->fib6_node
  = NULL. A reproducer was found that triggers this [1].\n\nAdd a check to ensure
  rt->fib6_node is non-null before accessing it.\n\n[0]\nKASAN: null-ptr-deref in
  ran"
