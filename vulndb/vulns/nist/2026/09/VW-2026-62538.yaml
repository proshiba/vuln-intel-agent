title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Free the error IRQ before tearing down VINTFs\n\ntegra241_cmdqv_remove() tears each
  VINTF down first, then calls free_irq().\nTearing a VINTF down frees vintf0 and
  clears cmdqv->vintfs[0]. An error in\nthat window makes tegra241_cmdqv_isr() read
  the stale slot and hand it to\ntegra241_vintf0_handle_error(), which dereferences
  a NULL or freed pointer.\n\nFree the IRQ before tearing the VINTFs down. free_irq()
  waits for in-flight\nhandlers to finish and blocks new ones, so no ISR can observe
  a VINTF as it\nis torn down.\n\nNote: a user-owned VINTF (viommu) could outlive
  this teardown, which unmaps\ncmdqv->base and frees cmdqv->vintfs, so a later viommu
  close then touches\nfreed memory. This is neither introduced nor fixed here: a physical
  IOMMU\nis not a pluggable device, so iommufd by design holds no reference on the\n\
  one behind a viommu, and this teardown is not expected while that viommu is\nstill
  alive."
