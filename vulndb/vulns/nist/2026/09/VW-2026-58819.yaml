title: A flaw has been found in GPAC up to f1219cde. Affected by this issue is 
  the function gf_list_count of the file utils/list.c of the component MP4Box. 
  Executing a manipulation can lead to use after free. The attack is restricted 
  to local execution. The exploit has been published and may be used. Upgrading 
  to version abi-16.23 can resolve this issue. This patch is called 
  49dee5cad329cfed310c1682703df7daa47df31a. It is suggested to upgrade the 
  affected component.
