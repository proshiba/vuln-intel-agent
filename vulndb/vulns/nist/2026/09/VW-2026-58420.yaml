title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: restore the data_offset bound in is_valid_oplock_break()\n\nCommit 83bfbd0bb902
  (\"cifs: Remove the RFC1002 header from smb_hdr\")\nchanged the quantity this bound
  is measured against.  It used to be\nsrv->total_read minus the 4-byte RFC1002 preamble
  that total_read then\nincluded, so it was the SMB message length.  The same commit
  stopped\ncounting the preamble, and the mechanical substitution to\nsrv->total_read
  - srv->pdu_size left an expression that is identically\nzero: standard_receive3()
  reads MID_HEADER_SIZE() bytes and then exactly\npdu_length - MID_HEADER_SIZE() more,
  adding both to total_read.\n\nlen is therefore 0, the subtraction below it wraps,
  and no __u32\nDataOffset can exceed the result, so the check from commit 097f5863b1a0\n\
  (\"cifs: read overflow in is_valid_oplock_break()\") no longer rejects\nanything.\
  \  Use total_read, which is now the message length on its own."
