title: Nuclio is a "Serverless" framework for Real-Time Events and Data 
  Processing. Prior to version 1.17.4, the fix for unauthenticated OS command 
  injection in the nuclio dashboard on the local/Docker platform is incomplete. 
  The fix added validateFunctionName for function names and common.Quote() for 
  the named-resource shell command path, but the list-all resource path 
  (triggered when no specific resource name is provided) still interpolates the 
  resourceNamespace parameter unquoted into a /bin/sh -c command string. An 
  unauthenticated attacker can inject shell metacharacters via the 
  X-Nuclio-Function-Namespace, X-Nuclio-Project-Namespace, or 
  X-Nuclio-Function-Event-Namespace HTTP headers to achieve arbitrary command 
  execution inside the dashboard container. This issue has been patched in 
  version 1.17.4.
