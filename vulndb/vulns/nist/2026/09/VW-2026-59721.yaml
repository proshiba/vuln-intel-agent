title: A vulnerability was identified in GPAC up to f1219cde. The impacted 
  element is the function gf_node_list_insert_child of the file 
  scenegraph/base_scenegraph.c of the component Node Insertion. Such 
  manipulation leads to memory corruption. The attack can be launched remotely. 
  The exploit is publicly available and might be used. Upgrading to version 
  abi-16.23 is sufficient to resolve this issue. The name of the patch is 
  49dee5cad329cfed310c1682703df7daa47df31a. It is suggested to upgrade the 
  affected component.
