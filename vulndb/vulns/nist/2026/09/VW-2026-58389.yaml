title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  omapfb: panel-dsi-cm: initialize lock before registering display\n\ndsicm_probe()
  registers the display before initializing ddata->lock.\nOnce omapdss_register_display()
  publishes the display, another consumer\ncan reach a dsicm callback that takes this
  mutex while it is still\nuninitialized.\n\nInitialize the mutex before registering
  the display so the published\ncallbacks always see a valid lock."
