title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: initialize ptp_lock at probe time\n\npriv->ptp_lock is only initialized
  in stmmac_ptp_register(), which runs\nduring __stmmac_open(). However, the lock
  is also used while the\ninterface is down and has never been opened: tc_taprio_configure()\n\
  invokes the PTP gettime64() callback to compute the EST base time when\noffloading
  a TAPRIO schedule, and stmmac_get_time() takes\npriv->ptp_lock. Using an uninitialized
  rwlock is undefined behaviour.\nMove the rwlock_init() to __stmmac_dvr_probe(),
  together with the other\nprivate locks, so that ptp_lock is always valid regardless
  of the\ninterface state."
