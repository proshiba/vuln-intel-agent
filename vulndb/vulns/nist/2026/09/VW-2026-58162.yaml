title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  validate kset key_num and intra-segment bounds\n\nTwo more fields decoded from the
  cache device go unbounded. The kset\nkey_num drives cache_kset_crc() and the replay
  loop in cache_replay(),\nthe writeback worker and the GC worker, but only the magic
  and a\nfixed-seed CRC are checked first, so a non-last kset whose key_num exceeds\n\
  the PCACHE_KSET_KEYS_MAX buffer reads past its end before the CRC compare.\nA key's
  intra-segment offset and length in cache_key_decode() are taken\nverbatim, so a
  key running past its segment is replayed into the cache\ntree and the data CRC check
  and every later read hit then copy adjacent\npersistent memory into the caller's
  bio -- an out-of-bounds read that\nleaks to user space. Both fields are controlled
  by whoever supplies the\ncache device (CAP_SYS_ADMIN); the CRC seed is public.\n\
  \nAdd kset_onmedia_valid() to bound key_num before any kset read, and\nreject a
  key whose offset plus length"
