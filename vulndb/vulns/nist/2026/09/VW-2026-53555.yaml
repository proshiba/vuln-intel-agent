title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  initialise workingset state before folio split\n\nxas_try_split() adds __GFP_ACCOUNT
  for page-cache xa_nodes, but\n__folio_split() leaves the xa_state's xa_lru unset.\
  \  That lets a live,\nmemcg-charged xa_node exist without being linked into the
  mapping's\nshadow_nodes list_lru; when reclaim later walks the list_lru it trips\n\
  VM_WARN_ON(!css_is_dying()).\n\nUse mapping_set_update() to install both the workingset
  update callback\nand the shadow_nodes list_lru on the xa_state."
