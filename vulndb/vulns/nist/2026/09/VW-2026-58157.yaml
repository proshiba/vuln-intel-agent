title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  only hand out initialized cache segments\n\nget_cache_segment() scans the segment
  map up to cache->n_segs, the\nphysical device segment count, but cache_segs_init()
  only initializes\nthe first cache_info->n_segs segments. A crafted image with\n\
  cache_info->n_segs smaller than the device count leaves the remaining\npcache_cache_segment
  structs zeroed (segment.data == NULL), and the\nallocator can hand one to cache_kset_close(),
  which writes through the\nreturned segment's data pointer with no NULL check.\n\n\
  Bound the allocator's search to cache_info->n_segs so only initialized\nsegments
  are ever returned. A conforming cache sets n_segs equal to the\ndevice segment count,
  so this rejects nothing legitimate."
