title: fast-uri is a dependency-free RFC 3986 URI parser for Node.js, used by 
  Fastify and ajv, that added a mailto scheme parser in version 4.1.3. In 
  versions 4.1.3 and 4.1.4, the mailto parser compares each query field name to 
  the reserved names to, subject, and body while the name is still 
  percent-encoded, and decodes it only when storing it as a generic header, so a
  percent-encoded spelling of a reserved field name is not recognized as that 
  field at parse time but is re-emitted as the literal field name when the 
  parsed URI is serialized. An application that validates, logs, or displays the
  recipient list from the first parse and then serializes the URI and sends it 
  can silently gain an attacker-chosen recipient, and the subject and body 
  fields can be smuggled across the same roundtrip. The issue is fixed in 
  fast-uri 4.1.5, and users should upgrade to 4.1.5 or later. As a workaround, 
  do not act on a mailto URI that fast-uri has re-serialized without first 
