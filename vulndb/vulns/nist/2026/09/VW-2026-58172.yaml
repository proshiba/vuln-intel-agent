title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  bcd2000: clear the URB pointers on disconnect\n\nbcd2000_free_usb_related_resources()
  frees both URBs and leaves the\npointers behind:\n\n\tusb_kill_urb(bcd2k->midi_out_urb);\n\
  \tusb_kill_urb(bcd2k->midi_in_urb);\n\n\tusb_free_urb(bcd2k->midi_out_urb);\n\t\
  usb_free_urb(bcd2k->midi_in_urb);\n\nThe rawmidi device outlives that call.  A substream
  that is still open\nwhen the device is unplugged reaches bcd2000_midi_send() from
  the\ntrigger path on close.  That function writes to the freed URB and then\nhands
  it to the USB core:\n\n\tbcd2k->midi_out_urb->transfer_buffer_length = BUFSIZE;\n\
  \t...\n\tret = usb_submit_urb(bcd2k->midi_out_urb, GFP_ATOMIC);\n\nusb_kill_urb()
  does not stop a later submission either, so a submit that\nraces the disconnect
  can requeue the URB after it has been reaped.\nmidi_in_urb is exposed the same way:
  bcd2000_input_complete() resubmits\nit from the completion handler.\n\nKASAN on
  7.2.0-rc5 (arm64):\n\n  BUG: KASAN: slab-us"
