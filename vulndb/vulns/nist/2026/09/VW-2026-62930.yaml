title: "Authentication Bypass by Spoofing vulnerability in team-alembic ash_authentication
  allows an attacker who can plant a remember-me cookie in a victim's browser to replace
  that victim's authenticated session with one for the attacker's own account.\n\n\
  AshAuthentication.Plug.Helpers.sign_in_using_remember_me/3 skips re-authenticating
  an already-signed-in visitor by checking the session for \"<subject_name>_token\"\
  , but store_in_session/2 writes that key only when require_token_presence_for_authentication?
  is enabled and otherwise writes the bare subject name. At the default setting the
  guard therefore reads a key that is never written, its already-signed-in branch
  is unreachable, and the remember-me sign-in runs on every request through the per-request
  browser pipeline plug. A planted remember-me cookie is consequently honoured even
  for a visitor holding a live authenticated session, so whatever the victim enters
  afterwards lands in data the attacker controls. The read path in authenticate_re"
