title: "The default AEAD nonce provider for the PSA Internal Trusted Storage transform
  module, secure_storage_its_transform_aead_get_nonce() in subsys/secure_storage/src/its/transform/aead_get.c,
  stores its nonce counter in unsynchronized function-local static variables (s_nonce
  and s_nonce_initialized). Every ITS write obtains its AES-GCM or ChaCha20-Poly1305
  nonce here via secure_storage_its_transform_to_store().\n\nBecause the function
  held no lock, two threads calling it concurrently race on the shared statics: the
  initialization path (psa_generate_random() followed by memcpy()) and the non-atomic
  increment-then-copy path can each hand the same nonce value to two distinct encryption
  operations, and can lose increments so the counter repeats values it was designed
  never to repeat. The ITS layer (secure_storage_its_set() in subsys/secure_storage/src/its/implementation.c)
  performs no serialization of its own, so concurrent same-UID writes reach the racy
