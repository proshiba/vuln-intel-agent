title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwrng:
  xilinx-trng - propagate timeout before any data is read\n\nxtrng_readblock32() polls
  for 16-byte chunks but returns the number of\nbytes read even when the first poll
  times out. Its caller then treats a\nzero return as a short successful read, and
  partial reads for full\n32-byte blocks can make the tail copy use a fixed block
  offset rather\nthan the amount already produced.\n\nReturn the poll error when no
  data has been read, preserve partial\npositive returns after some data is available,
  stop the generator on all\ncollection exits, and append tail bytes at the current
  output count."
