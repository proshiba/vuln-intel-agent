title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpll:
  fix NULL deref in dpll_device_ops() during teardown race\n\nWhen the last owner
  of a dpll device unregisters while a foreign driver\nstill holds a pin on it via
  dpll_pin_on_pin_register(), the dpll object\nstays alive with an empty registration
  list. A pin notification queued\nbefore the unregister (e.g. ice reacting to zl3073x_i2c
  removal) then\nwalks pin->dpll_refs into dpll_device_ops(), which trips the WARN_ON
  and\ndereferences the missing registration. dpll_lock cannot help because the\n\
  notification work was queued before the unregistering driver took the\nlock.\n\n\
  Treat the empty registration list as a legitimate transient state. Make\ndpll_priv()
  and dpll_device_ops() return NULL in that case and make\nevery pin netlink path
  that resolves a device from a pin skip such\ndplls. dpll_cmd_pin_get_one() picks
  a ref with a live registration and\nreturns -ENODEV when there is none, the pin
  dumpit skips such a pin\ninstead of ab"
