title: wasm2c in WebAssembly wabt through 1.0.41 allows sandbox escape in some 
  situations that primarily involve 32-bit platforms, aka a "table flip" attack.
  It does not check the return value of calloc() in 
  wasm_rt_allocate_funcref_table() (wasm2c/wasm-rt-impl-tableops.inc). When the 
  funcref table allocation fails, table->data is left NULL while table->size 
  keeps the guest-declared element count; thus, bounds checks still pass and 
  table element accesses resolve to absolute memory addresses (i * 
  sizeof(wasm_rt_funcref_t)). This gives arbitrary read and write of host 
  process memory and - via table.get, table.set, and call_indirect - arbitrary 
  code execution, defeating the isolation that wasm2c exists to provide (a full 
  sandbox escape). wasm2c is used as an in-process sandboxing boundary by RLBox 
  and WasmBoxC, including in Firefox, which compiles the Graphite, Hunspell, 
  Ogg, Expat, and Woff2 libraries via wasm2c to contain untrusted font, media, 
  and XML input. Therefore, sandboxing in these app
