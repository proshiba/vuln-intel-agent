title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  clear CALLBACK_RUNNING on failed delegation recall queue\n\nnfsd_break_one_deleg()
  sets NFSD4_CALLBACK_RUNNING via test_and_set_bit\nat entry to serialize recall work,
  then calls nfsd4_run_cb() to queue\nthe recall.  When the queue attempt fails the
  refcount bump is undone,\nbut the RUNNING bit is left set.  The only site that clears
  the bit is\nnfsd41_destroy_cb() (fs/nfsd/nfs4callback.c), which runs from the\n\
  workqueue and is therefore unreachable when nothing was queued.\n\nThe bit becomes
  a permanent latch on dp->dl_recall.cb_flags: every\nsubsequent break_lease() on
  the same delegation hits the early-return\nguard in nfsd_break_one_deleg() and silently
  skips the recall, so the\ndelegation is never broken and the conflicting open or
  lock stalls.\n\nFix by clearing NFSD4_CALLBACK_RUNNING on the !queued branch alongside\n\
  the refcount_dec."
