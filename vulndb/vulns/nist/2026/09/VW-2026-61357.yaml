title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  bpf: serialize device reference release in struct_ops destroy path\n\n__hid_bpf_ops_destroy_device()
  and hid_bpf_unreg() can race on the\nsame registration reference, double-putting
  struct hid_device and\nfreeing it while hid_destroy_device() still uses it.  Serialize
  the\nremove/NULL decision under hdev->bpf.prog_list_lock so exactly one\npath releases
  each registration reference: unreg re-checks ops->hdev\nunder the lock and returns
  without putting when the destroy path\nalready cleared it; all put_device() calls
  happen after the lock is\ndropped, which is safe because a concurrent unreg then
  observes\nops->hdev == NULL under the lock.\n\nBackground: each successful attach
  (hid_bpf_ops_reg) acquires one\ndevice reference (hid_get_device()).  Two paths
  can release it:\n\n- device destruction: hid_destroy_device() -> hid_bpf_destroy_device()\n\
  \  -> __hid_bpf_ops_destroy_device(), which walks hdev->bpf.prog_list\n  under rcu_read_l"
