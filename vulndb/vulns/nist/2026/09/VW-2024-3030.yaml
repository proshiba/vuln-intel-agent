  Connector/ODBC).  Supported versions that are affected are 9.0.0 and prior. Easily
  exploitable vulnerability allows unauthenticated attacker with network access via
  multiple protocols to compromise MySQL Connectors.  Successful attacks of this vulnerability
  can result in  unauthorized update, insert or delete access to some of MySQL Connectors
  accessible data and unauthorized ability to cause a partial denial of service (partial
