title: A weakness has been identified in GNU Binutils 2.47. Affected is the 
  function bfd_putl64 of the file bfd/libbfd.c of the component ld. This 
  manipulation causes null pointer dereference. The attack requires local 
  access. The exploit has been made available to the public and could be used 
  for attacks. The project was informed of the problem early through a bug 
  report but has not responded yet.
