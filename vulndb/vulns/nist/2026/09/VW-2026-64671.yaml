title: Photoview through 2.4.0 contains an authorization bypass vulnerability in
  the shareAlbum GraphQL mutation that allows authenticated users to create 
  share links for albums owned by other users. Attackers can supply arbitrary 
  album IDs to generate working share tokens for victim albums, exposing photos 
  and sub-albums to anyone with the link while retaining indefinite control over
  token settings.
