title: A security flaw has been discovered in kvcache-ai mooncake up to 
  0.3.12/0.3.13.post1/0.3.14-rc1. This issue affects the function 
  ScopedSegmentAccess::MountSegment of the file segment.cpp of the component 
  MountSegment Request Processing. Performing a manipulation results in improper
  access controls. The attack is possible to be carried out remotely. The 
  exploit has been released to the public and may be used for attacks. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
