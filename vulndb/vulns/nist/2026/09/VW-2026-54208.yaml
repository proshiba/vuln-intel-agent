title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  seg6: clear IPv4 control block on IPIP decapsulation\n\nEnd.DX4 and End.DT4 decapsulate
  an IPv4 packet through\ndecap_and_validate() and send it directly to IPv4 routing.
  The inner\npacket therefore bypasses ip_rcv_core(), which normally clears IPCB\n\
  before IPv4 interprets skb->cb.\n\nThe skb instead retains IP6CB data from the outer
  packet. IP6CB and\nIPCB use the same skb->cb storage, so IP6CB(skb)->lastopt overlaps\n\
  IPCB(skb)->opt.optlen and srr, while IP6CB(skb)->nhoff overlaps rr and\nts.\n\n\
  The sender can make the stale optlen byte nonzero with a valid outer\nextension-header
  chain. The reproducers put an eight-byte Destination\nOptions header immediately
  after the 40-byte IPv6 header and before the\nSegment Routing Header. ipv6_destopt_rcv()
  records the sender-controlled\nDestination Options offset in both lastopt and nhoff,
  setting them to\n40. On the reproduced little-endian x86-64 kernel, IPv4 therefore
  sees\noptlen = 4"
