title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  revoke copy-notify stateids before dropping their reference\n\nCopy-notify stateids
  live in the s2s_cp_stateids IDR and on their parent\nstid's sc_cp_list, pinned by
  a single membership reference.\n_free_cpntf_state_locked() only unlinks an entry
  once its refcount reaches\nzero, so any revoke path that runs while a concurrent\n\
  find_cpntf_state()/manage_cpntf_state() holder has elevated cs_count drops\nthe
  reference without unlinking, leaving the entry discoverable with its\nmembership
  reference already consumed. A second revoke or a laundromat tick\nthen frees it
  while the reader still holds the pointer -- a\nKASAN-detectable use-after-free at
  the reader's nfs4_put_cpntf_state().\n\nThis affected all three revoke paths:\n\n\
  \  - The parent-stid drain (nfs4_free_cpntf_statelist()) repeatedly called\n   \
  \ _free_cpntf_state_locked() on the first list entry; a holder that had\n    bumped
  cs_count made it return early, so the next iter"
