title: MongoDB Server contains an incorrect authorization vulnerability in the 
  aggregation framework. An authenticated user with minimal privileges can craft
  a specially formatted aggregation request that causes the server's 
  authorization subsystem to evaluate a different operation than what is 
  actually executed, resulting in unauthorized read access to collection data 
  within the target database.
