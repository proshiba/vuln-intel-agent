title: SiYuan before v3.8.2 contains a stored cross-site scripting vulnerability
  in Bazaar package cards where the iconURL metadata is inserted directly into 
  HTML img src attributes without escaping. Attackers can inject malicious URLs 
  with event handlers that execute JavaScript in the authenticated SiYuan origin
  when users view Bazaar listings, enabling API requests and application state 
  manipulation.
