title: "OpenEye Apex Network Video Recorder (NVR) firmware 3.2.9.376 uses an administrator
  password-reset unlock-code design that lacks a per-device secret or other server-side
  cryptographic material. An attacker with physical-console access and access to the
  privileged password-reset workflow can forge a valid unlock code offline and use
  it to reset the administrator password. The underlying design has been present since
  at least firmware 2.2.3.4.\n\nUpgrade to version 3.5.4."
