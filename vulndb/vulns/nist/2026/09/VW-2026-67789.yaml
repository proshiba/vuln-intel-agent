title: "`_nx_icmpv6_validate_options()` scans the option area with `while (length
  > 2)` (`common/src/nx_icmpv6_validate_options.c:79`). An area whose size leaves
  a one- or two-byte residue exits the loop with that tail unexamined; the residue
  is not negative, so the function returns `NX_SUCCESS`. Its zero-length rejection
  never sees those bytes.\n\n\n\nEvery consumer then re-walks the same area, reading
  a two-byte option header at the residue and subtracting `nx_icmpv6_option_length
  << 3` with no zero check and no remaining-length check. Three outcomes follow, selected
  by bytes the attacker controls.\n\n\n\n**Zero length byte.** The walker subtracts
  zero and advances zero. All four handlers loop forever — `_nx_icmpv6_process_ra`
  (`nx_icmpv6_process_ra.c:245, :528`), `_nx_icmpv6_process_ns` (`:251, :329`), `_nx_icmpv6_process_na`
