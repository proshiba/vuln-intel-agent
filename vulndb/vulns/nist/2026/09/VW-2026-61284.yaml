title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/mmu: Consume the locked rmap value in the lockless rmap walk\n\n__kvm_rmap_lock()
  deliberately elides the rmap lock when it observes an\nempty rmap.  In that case
  kvm_rmap_lock_readonly() also re-enables\npreemption and returns zero, so the caller
  holds neither the rmap lock\nnor a preemption reference.  The elision documents
  the invariant it\nrelies on:\n\n\t * Elide the lock if the rmap is empty, as lockless
  walkers (read-only\n\t * mode) don't need to (and can't) walk an empty rmap, nor
  can they add\n\t * entries to the rmap.  I.e. the only paths that process empty
  rmaps\n\t * do so while holding mmu_lock for write, and are mutually exclusive.\n\
