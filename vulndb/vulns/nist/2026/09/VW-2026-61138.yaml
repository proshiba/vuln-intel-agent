title: "Apache Airflow FAB provider: deactivating a user account does not stop tokens
  issued to that account before deactivation. Password authentication correctly rejects
  the disabled account, but the Core API continues to accept an existing, unexpired
  token naming it, and lets that token mint a replacement — so the account keeps its
  role-scoped access indefinitely after an administrator has disabled it. The user
  replays their own legitimate credential; no signature forgery or privilege escalation
  is involved, and the access stays within the roles the account already held.\n\n\
  Affects deployments using Airflow 3 with the FAB auth manager and Core API token
  authentication, where an administrator deactivates an account whose row remains
  in the database and whose previously issued token has not expired. The trigger is
  administrative deactivation as a containment action, which silently fails to contain.\n\
  \nUsers of apache-airflow-providers-fab are recommended to upgrade to version 3.9.0
  or later, whic"
