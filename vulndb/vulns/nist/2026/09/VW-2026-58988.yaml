title: "Publishing limits the compressed size of a VSIX (ovsx.publishing.max-content-size,
  512 MB by default) but nothing limited how large an entry becomes when opened.\n\
  \n\n\n\nOn the first request to /vscode/unpkg/{namespace}/{extension}/{version}/{path},
  WebResourceService opened the entry with ZipFile.getInputStream() and passed the
  decompressed stream to Files.copy(), which ran to the end of the stream without
  counting bytes written. The result was cached under java.io.tmpdir, and that cache
  evicted by entry count (150), not by size, so it placed no bound on disk usage.\n\
  \n\n\n\nA publisher with access only to their own namespace could therefore upload
  a small, highly compressible VSIX and cause the server to write far larger files
  to the temp filesystem — repeating with different files or versions, since a repeat
  request is served from the cache.\n\n\n\n\nImpact observed: the temp filesystem
  filled; requests for files not already cached returned 500 with No space left on
