title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  verify run length exceeding volume boundary\n\nThe mapping pairs decoder validates
  that the starting LCN is within the\nvolume but does not check if the run extends
  beyond the volume boundary.\n\nA malformed NTFS image with a crafted mapping pairs
  array could cause\nthe kernel to access memory beyond the volume boundary, potentially
  leading\nto memory corruption and privilege escalation.\n\nAdd validation to ensure
  lcn + length stays within nr_clusters."
