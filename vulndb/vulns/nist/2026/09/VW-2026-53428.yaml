title: A user account with permission to deploy artifacts to a hosted Maven 
  repository could upload a POM file containing an oversized metadata field. 
  This causes future attempts to list or browse that repository's components to 
  permanently fail until an administrator repairs the underlying data. Only the 
  targeted repository is affected; other repositories and overall server health 
  remain unaffected.
