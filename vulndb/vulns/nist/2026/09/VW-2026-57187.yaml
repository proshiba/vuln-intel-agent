title: Snipe-IT before 8.7.0 fails to validate soft-deleted state in API 
  checkout endpoints, allowing authenticated users with checkout permissions to 
  bind live inventory to trashed targets. Attackers can submit POST requests to 
  hardware, component, or consumable checkout endpoints with soft-deleted user, 
  asset, or location IDs to create orphaned references that corrupt the asset 
  ledger and audit trails.
