title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Fix SCMI device destroy lifetimes\n\nscmi_child_dev_find() drops the reference
  returned by\ndevice_find_child() before returning the scmi_device pointer. A\nconcurrent
  unregister can then release the device while the destroy path\nis still using the
  returned pointer.\n\nMake the lookup helper return the device_find_child() reference
  and keep\nit until scmi_device_destroy() has finished unregistering the child.\n\
  \nAlso split device_unregister() in __scmi_device_destroy() so the SCMI bus\nID
  is not made reusable until after device_del() has removed the old\nscmi_dev.N name
  from sysfs. This avoids a new SCMI device reusing the\nsame ID while the old device
  is still registered.\n\nThe final device release callback is also a possible cleanup
  path when\nSCMI children are deleted by driver core recursion rather than\n__scmi_device_destroy().
  Release the SCMI bus ID from a common helper\nused by destroy, register-failure
  an"
