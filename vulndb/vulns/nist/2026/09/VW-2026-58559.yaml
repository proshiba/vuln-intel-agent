title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclocksource/drivers/nxp-pit:
  Fix IRQ leak on cpuhp_setup_state error path\n\nWhen cpuhp_setup_state fails after
  pit_clockevent_per_cpu_init has\nsuccessfully called request_irq, the error handling
  jumps directly to\nout_pit_clocksource_unregister without freeing the registered
  IRQ.\n\nThis leaks the IRQ line and, since kfree(pit) follows, leaves a\ndangling
  pointer registered as the interrupt handler's dev_id,\npotentially leading to a
  use-after-free if the IRQ fires afterwards.\n\nFix it by calling pit_clockevent_per_cpu_exit
  to properly release the\nIRQ before falling through to the existing cleanup chain."
