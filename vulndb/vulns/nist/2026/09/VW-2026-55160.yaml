title: Insertion of sensitive information into log files in the Snowflake 
  Python, Go, JDBC, Node.js, PHP PDO, and ODBC drivers allowed authentication 
  tokens, query-result encryption keys, pre-signed cloud-storage URLs, and SAML 
  assertions to be written to diagnostic logs in circumstances where the 
  available log redaction did not cover all affected log paths and data types. 
  An attacker with read access to the log destination, whether the local 
  filesystem, a log aggregation service, or a CI/CD artifact store, could obtain
  credentials and decryption keys that, if still valid at the time of access, 
  could be used to authenticate to the corresponding Snowflake account or 
  cloud-storage object. Successful exploitation requires read access to the log 
  destination, and impact is bounded by credential lifetime and object scope. 
  The fix is available in Snowflake Connector for Python v4.7.3, Snowflake Go 
  Driver v2.2.0, Snowflake JDBC Driver v4.3.4 (including the snowflake-jdbc-fips
  and snowflake-jdbc-thin)
