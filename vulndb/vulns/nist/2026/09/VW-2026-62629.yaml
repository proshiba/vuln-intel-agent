title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/bridge:
  tc358767: clamp the reported AUX read size to the request\n\ntc_aux_transfer() clamps
  an AUX read to the payload limit:\n\n\tsize_t size = min_t(size_t, DP_AUX_MAX_PAYLOAD_BYTES
  - 1, msg->size);\n\nAfter the transfer it replaces size with the byte count the
  controller\nreports in AUX_BYTES:\n\n\tif (size)\n\t\tsize = FIELD_GET(AUX_BYTES,
  auxstatus);\n\nAUX_BYTES is GENMASK(15, 8), so it can be up to 255. Nothing clamps
  it\nback to the request. tc_aux_read_data() reads that many bytes into the\n16-byte
  auxrdata stack buffer, then copies them into the caller buffer. A\nreported count
  of 255 makes the read run to 256 bytes and overruns both.\n\nThe controller should
  never report more than it was asked to transfer, so\nthis is defense in depth rather
  than a live hole. The reported count is\nonly lightly trusted, and the check is
  cheap. Clamp it back to the request,\nthe same way ti-sn65dsi86 does in commit aca58eac52b8
  (\"drm/bridge:\n"
