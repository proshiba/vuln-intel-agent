title: The Divi Ajax Filter plugin for WordPress is vulnerable to Local File 
  Inclusion in all versions up to, and including, 5.1.2 via the 
  'custom_loop_template' parameter parameter. This makes it possible for 
  unauthenticated attackers to include and execute arbitrary .php files on the 
  server, allowing the execution of any PHP code in those files. This can be 
  used to bypass access controls, obtain sensitive data, or achieve code 
  execution in cases where .php file types can be uploaded and included. This 
  vulnerability is only exploitable when the loop_templates parameter is set to 
  'custom-template'.
