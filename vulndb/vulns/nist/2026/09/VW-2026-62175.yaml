title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio-net:
  Ensure that TCP packets don't overflow gso_segs\n\nThe user can specify any gso_size
  in a packet crafted with an AF_PACKET\nPACKET_VNET_HDR socket, even smaller than
  TCP_MIN_GSO_SIZE = 8. At the\nsame time, GSO_MAX_SIZE = 8 * GSO_MAX_SEGS = 8 * 65535.
  When the user\ncrafts a packet with gso_size < 8, there is a risk for partial GSO
  to\noverflow the 16-bit gso_segs field when dividing the SKB length by\ngso_size.\n\
  \nAdjust gso_size of TCP packets to be at least TCP_MIN_GSO_SIZE = 8. Keep\ngso_size
  of UDP GSO packets, as gso_size=1 is valid and explicitly\ntested at tools/testing/selftests/net/tun.c:649."
