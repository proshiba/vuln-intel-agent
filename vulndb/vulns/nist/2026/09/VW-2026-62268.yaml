title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  safely discard unregistered deferred locks\n\nWhen vfs_lock_file() defers a lock,
  smb2_lock() puts its ksmbd_lock on\nrollback_list before allocating and registering
  the asynchronous work.\nIf either operation fails, rollback assumes that smb_lock->conn
  is\ninitialized and dereferences NULL. The deferred file_lock also remains\nlinked
  into the VFS blocked-lock state while it is freed.\n\nKeep the lock off rollback_list
  until async setup succeeds. On setup\nfailures, explicitly unblock and wake the
  deferred lock before freeing it\nand its ksmbd wrapper."
