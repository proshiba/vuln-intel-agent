title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Write ESR_EL2 for injected nested SError exceptions\n\nkvm_inject_el2_exception()
  writes ESR_EL2 for synchronous exceptions\nbut not for SError. enter_exception64()
  does not write ESR_ELx for any\nexception type, so the constructed syndrome is dropped.
  A guest L2\nhypervisor taking a nested SError observes stale ESR_EL2.\n\nThis affects
  both kvm_inject_nested_serror() and the EASE path in\nkvm_inject_nested_sea().\n\
  \nWrite ESR_EL2 for except_type_serror, matching except_type_sync."
