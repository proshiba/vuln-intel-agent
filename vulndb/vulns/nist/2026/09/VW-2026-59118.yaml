title: "Description\n\nThe Logviewer offers `logs.users` and `logs.groups` so operators
  can control who may read log content. For\ndaemon logs those settings were not applied:
  the access decision combined the \"this is a daemon log\" flag\nwith the authorizer
  result in a way that discarded the authorizer's answer whenever the flag was set,
  and\nthe daemon log page and download endpoints reached the handler without consulting
  an authorizer at all. Any\nuser able to pass the configured servlet filter could
  therefore read `nimbus.log`, `supervisor.log` and the\nother daemon logs on every
  reachable node, which contain other tenants' topology names, owners and\nconfiguration
  fragments.\n\nThe same advisory covers the log listing endpoints, which accepted
  a user argument and never applied it, so\n`/listLogs` and `/searchLogs` returned
  every tenant's topology and worker log file names regardless of the\ncaller. That
  part is metadata only.\n\nThere was no configuration that closed either behaviour.\n\
