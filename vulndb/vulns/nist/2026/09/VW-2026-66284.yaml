title: IBM Server Firmware FW1120.00 through FW1120.01, FW1110.00 through 
  FW1110.31, FW1060.00 through FW1060.81, and FW950.00 through FW950.H3 is 
  affected by a vulnerability in the ASMI web interface. An unauthenticated 
  attacker on the management network can send a malformed HTTPS request to ASMI,
  causing the web server to crash with possible memory corruption and generate 
  an error log. The ASMI web interface will restart automatically; however, 
  repeated exploitation could result in a sustained loss of access to the ASMI 
  management interface, resulting in an integrity and availability impact.
