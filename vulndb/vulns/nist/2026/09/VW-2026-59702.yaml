title: A flaw was found in hawtio-operator. The operator holds 
  routes/custom-host:create permission cluster-wide and writes the 
  tenant-supplied spec.routeHostName value from the Hawtio custom resource 
  directly into the Route spec without validation or authorization checks. A 
  namespace edit user, who normally cannot set custom Route hostnames, can use 
  the operator as a confused deputy to claim arbitrary externally-routable 
  hostnames, enabling subdomain takeover and, in combination with the auto-grant
  OAuthClient, OAuth redirect hijack.
