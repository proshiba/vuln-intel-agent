title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ibm: emac: mal: fix potential system hang in mal_remove()\n\nnapi_disable() is not
  idempotent and calling it on an already-disabled\nor unenabled NAPI context will
  cause the kernel to spin indefinitely\nwaiting for the NAPI_STATE_SCHED bit to clear.\n\
  \nIn mal_remove(), napi_disable() is called unconditionally. If no MACs were\nregistered,
  NAPI was never enabled. Also, if they were registered but\nsubsequently unregistered,
  NAPI was already disabled in\nmal_unregister_commac(). In either case, calling napi_disable()
  causes\nthe kernel to hang upon module removal.\n\nFix this by only calling napi_disable()
  in mal_remove() if the commac list\nis not empty (which implies NAPI is enabled)."
