title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: cortina: Count dropped frames as NAPI work\n\nThe RX loop only consumes
  budget when it successfully delivers a frame.\nError paths keep consuming descriptors
  without reducing the budget, so a\nstream of bad frames can process the entire receive
  ring in one poll.\n\nMove the budget accounting to a common end-of-frame path. This
  counts\neach completed frame as NAPI work whether it was delivered or dropped,\n\
  matching the behavior of the vendor driver."
