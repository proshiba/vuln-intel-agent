title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  check_cond_jmp_op(): properly infer if register is null\n\nNicholas Carlini reported
  a bug when verifier can incorrectly infer\nthat a pointer is non-null. The bug occurs
  when two pointers are\ncompared and one of them has a type w/o PTR_MAYBE_NULL flag,\n\
  but which allows a value to be NULL at runtime.\nHere is an example:\n\n  // `a`
  is PTR_TO_MEM | MEM_RDONLY | PTR_UNTRUSTED\n  // `a` is 0 at runtime.\n  // `b`
  is PTR_TO_MAP_VALUE | PTR_MAYBE_NULL\n  void *a = bpf_rdonly_cast(0, 0);\n  int\
  \  *b = bpf_map_lookup_elem(...);\n\n  if (a == b)\n    *b = 42;  // verifier does
  not catch null pointer dereference\n\nThis happens because of a special case in
  check_cond_jmp_op(),\nwhich attempts to strip PTR_MAYBE_NULL flags from pointer
  types,\nwhen processing comparisons like `rA == rB`, if either rA or rB can't\n\
  be null.\n\nThe non-null property is derived based on the absence of\nPTR_MAYBE_NULL
  flag on rA's or rB's type. But that is not suff"
