title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  sample writeback error cursor before async COPY loop\n\n_nfsd_copy_file_range()
  samples dst->f_wb_err into \"since\"\nafter the copy loop, then uses it to detect
  writeback errors\nvia filemap_check_wb_err() once vfs_fsync_range() returns.\nBecause
  the nfsd_file cache reuses a single struct file\nacross requests targeting the same
  inode, a concurrent\nCOMMIT or stable WRITE on dst advances dst->f_wb_err to the\n\
  current mapping->wb_err via file_check_and_advance_wb_err()\nduring its own vfs_fsync_range().
  If that advancement lands\nbetween the writeback error appearing in mapping->wb_err\n\
  and the COPY worker sampling \"since\", the worker captures\nthe already-advanced
  cursor, errseq_check() sees cur ==\nsince and returns zero, and NFSD4_COPY_F_COMMITTED
  is set\neven though writeback failed. CB_OFFLOAD then encodes\nwr_stable_how = FILE_SYNC4,
  the client treats the copied\ndata as durable, and the failure becomes silent data
  loss.\n\nS"
