title: "In the Linux kernel, the following vulnerability has been resolved:\n\nparams:
  fix charp corruption on allocation failure\n\nparam_set_charp() stores charp parameters
  in allocated memory after slab is\navailable, and releases the previous value when
  the parameter is updated.\n\nThe previous value is released before the replacement
  allocation succeeds.\nIf kmalloc_parameter() fails, the setter returns -ENOMEM with
  the parameter\nleft as NULL.\n\nFailing zswap's compressor update before zswap is
  initialized can later\ntrigger:\n\n  BUG: kernel NULL pointer dereference, address:
  0000000000000000\n  RIP: 0010:strcmp+0x10/0x30\n  Call Trace:\n    zswap_setup+0x3b1/0x490\n\
  \    zswap_enabled_param_set+0x5b/0xa0\n    param_attr_store+0x93/0xe0\n    module_attr_store+0x1c/0x30\n\
  \    kernfs_fop_write_iter+0x116/0x1f0\n\nAllocate and copy the replacement first,
  then replace the parameter value\nonly after allocation succeeds."
