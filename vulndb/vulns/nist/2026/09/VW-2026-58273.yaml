title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  zero the discard fallback page\n\nnvme_setup_discard() always maps sizeof(struct
  nvme_dsm_range) *\nNVME_DSM_MAX_RANGES = 4096 bytes as the DSM payload however many
  ranges\nthe command declares, because some devices ignore the 'Number of Ranges'\n\
  field - the Fixes: commit records two that read past the declared ranges.\nA single-range
  discard fills only the first 16 bytes.\n\nNormally the buffer comes from kzalloc()
  and the other 4080 bytes are\nzero.  When that allocation fails the code falls back
  to the\nper-controller ctrl->discard_page, which nvme_init_ctrl() obtains with\n\
  alloc_page(GFP_KERNEL) and nothing ever zeroes, so those 4080 bytes are\nwhatever
  the page last held and are handed to the controller.  Reaching\nit requires the
  kzalloc(GFP_ATOMIC | __GFP_NOWARN) to fail, that is\nmemory pressure; it is not
  remotely triggerable.  Failing the allocation\nunder KMSAN reproduces it, with the
  leaked tail full of vmemmap str"
