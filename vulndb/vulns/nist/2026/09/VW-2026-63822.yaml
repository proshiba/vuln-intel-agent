title: A security vulnerability has been detected in BioStar VIVID LED DJ 
  4.0.2411.1500. This affects the function sub_1105C of the file BS_LED64.sys of
  the component IOCTL Handler. The manipulation of the argument AssociatedIrp 
  leads to write-what-where condition. Local access is required to approach this
  attack. The exploit has been disclosed publicly and may be used. The vendor 
  was contacted early about this disclosure but did not respond in any way.
