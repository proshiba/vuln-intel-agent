title: Snipe-IT versions before 8.7.0 fail to HTML-escape the employee_num field
  in the acceptance PDF generator, allowing attackers with users.edit permission
  to inject img tags into TCPDF's writeHTML() function. Attackers can craft a 
  malicious employee_num value containing an img tag with an arbitrary HTTP(S) 
  URL to trigger server-side requests to internal services, cloud metadata 
  endpoints, or external targets when a victim signs an asset acceptance.
