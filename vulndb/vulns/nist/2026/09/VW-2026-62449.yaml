title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  core: do fallible allocations before the console can be registered\n\nserial_core_add_one_port()
  allocates uport->tty_groups after\nuart_configure_port(), which may register the
  console. If the allocation\nfails, the driver unwinds the port while its console
  remains registered.\nThe earlier uport->name allocation has a related failure path
  that leaves\nstate->uart_port linked to a port being freed.\n\nFailslab reproduced
  a NULL dereference in PL011 console output and a KASAN\nuse-after-free in i.MX console
  output after failed binds.\n\nAllocate the name and tty_groups before linking the
  port and configuring\nit. Reserve space for the optional driver attribute group
  because\nconfig_port() may populate uport->attr_group during configuration."
