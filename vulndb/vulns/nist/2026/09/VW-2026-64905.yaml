title: orval versions before 8.30.0 contain a code injection vulnerability in 
  the @orval/core factory generator that fails to escape date default values in 
  new Date() calls. Attackers can inject arbitrary expressions through 
  apostrophes in OpenAPI schema defaults to execute code with the privileges of 
  the consumer process when factoryMethods and useDates options are enabled.
