  authentication bypass vulnerability in LoginControl::verifyChallenge() that 
  uses loose comparison (==) instead of strict comparison (===) against unset 
  session values. Attackers with only a password can submit an empty request to 
  verifyChallenge.json.php to bypass PGP two-factor authentication and gain full
  authenticated access.
