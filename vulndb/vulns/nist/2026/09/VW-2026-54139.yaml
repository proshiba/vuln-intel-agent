title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  nintendo: register input device after capabilities are set\n\ninput_register_device()
  exposes the device to userspace immediately.\nIn joycon_input_create() it was called
  before joycon_config_rumble()\nconfigures the FF_RUMBLE capability and the memless
  force-feedback\ndevice, so a concurrent EVIOCSFF could dereference a NULL dev->ff.\n\
  \nRegistering early also means the initial udev event lacks button and\naxis information,
  which can make input managers ignore the device.\n\nMove input_register_device()
  to the end of joycon_input_create(), after\nall capabilities, the IMU input device
  and the force-feedback callbacks\nhave been configured."
