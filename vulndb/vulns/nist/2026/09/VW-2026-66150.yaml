title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: finish active block group cleanup if call_zone_finish() fails\n\ndo_zone_finish()
  clears BLOCK_GROUP_FLAG_ZONE_IS_ACTIVE before finishing\nthe zones. If call_zone_finish()
  then fails it returned early, leaving the\nnow inactive block group on fs_info->zone_active_bgs,
  leaking its\nreference, the BTRFS_FS_NEED_ZONE_FINISH waiters are never woken, and
  as\nits alloc_offset equals the zone capacity btrfs_zone_finish_one_bg() keeps\n\
  selecting it, spinning btrfs_zoned_activate_one_bg().\n\nFall through to the cleanup
  on failure too and return the error, but keep\nthe block group read-only as its
  zones are left inconsistent."
