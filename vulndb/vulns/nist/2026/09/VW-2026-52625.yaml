title: xmldom is a pure JavaScript W3C standard-based (XML DOM Level 2 Core) 
  DOMParser and XMLSerializer module. Prior to @xmldom/xmldom versions 0.8.15 
  and 0.9.12, and in xmldom version 0.6.0 and earlier, DOMHandler.startElement 
  in lib/dom-parser.js inserts every parsed attribute through setAttributeNode, 
  while NamedNodeMap.setNamedItem in lib/dom.js calls the linear getNamedItem or
  getNamedItemNS lookup for each insertion. A well-formed element with many 
  distinct attributes therefore requires quadratic comparisons during 
  DOMParser.parseFromString() and can stall a Node.js event loop before 
  application validation. This issue is fixed in @xmldom/xmldom versions 0.8.15 
  and 0.9.12; no fixed version is available for xmldom.
