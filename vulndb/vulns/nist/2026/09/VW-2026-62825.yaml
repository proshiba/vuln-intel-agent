title: TS3 Manager is modern web interface for maintaining Teamspeak3 servers. 
  Prior to 2.2.6, the /api/download handler in packages/server/routes/api.js 
  passes the attacker-controlled port query parameter to socket.connect(port, 
  host) and returns the resulting error.message through 
  res.status(400).send(error.message) as text/html without a Content Security 
  Policy. When a logged-in operator follows a crafted top-level link, the 
  reflected value executes in the manager origin. The token cookie set in 
  packages/ui/src/store/modules/query.js lacks HttpOnly, Secure, and an explicit
  SameSite attribute, allowing the script to read the token and call the 
  autofillform event in packages/server/socket.js. autofillform returns the 
  decoded JWT, including the cleartext ServerQuery password, enabling 
  operator-session hijacking and control of the managed TeamSpeak server when 
  the operator uses administrative ServerQuery credentials. A valid operator 
  session and user interaction are required. This issue is fix
