title: 'A weakness has been identified in a2aproject a2a-java 1.2.0. The affected
  element is the function BasePushNotificationSender.dispatchNotification of the file
  server-common/src/main/java/org/a2aproject/sdk/server/tasks/BasePushNotificationSender.java
  of the component Authorization Header Construction. This manipulation causes http
  response splitting. The attack can be initiated remotely. Upgrading to version 1.3.0
  is sufficient to fix this issue. Patch name: 247a655043f145f6f8e3853724b6a543eaa02001.
  You should upgrade the affected component.'
