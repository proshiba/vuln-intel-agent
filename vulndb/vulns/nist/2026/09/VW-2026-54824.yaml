title: A flaw was found in FreeIPA's idp-add command, where insufficiently 
  validated --organization/--base-url input reaches a constrained eval() call 
  before the corresponding LDAP access control check is enforced. This allows 
  any authenticated IPA principal, regardless of privilege level, to enumerate 
  and read the environment variables of the affected server process and to cause
  denial of service via memory exhaustion.
