title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_tcm: fix deadlock in usbg_make_tpg()\n\nusbg_make_tpg() held dep_lock
  while calling\nconfigfs_depend_item_unlocked(), which acquires the configfs root\n\
  inode lock when operating across subsystems. This creates a circular\nlock dependency
  with configfs_rmdir():\n\n  dep_lock -> configfs root inode lock -> su_mutex ->
  dep_lock\n\nIn usbg_make_tpg(), dep_lock only serialized the read of opts->ready,\n\
  which is a monotonic flag that transitions from false to true exactly\nonce (in
  tcm_set_name()) and never reverts. Remove dep_lock from\nusbg_make_tpg() entirely
  and use READ_ONCE/WRITE_ONCE to access\nopts->ready locklessly instead."
