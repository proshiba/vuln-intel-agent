title: "In the Linux kernel, the following vulnerability has been resolved:\n\nw1:
  ds28e17: reject an oversize length on an I2C block read\n\nw1_f19_i2c_master_transfer()
  is the master_xfer for the DS28E17 1-Wire\nto I2C bridge. On an I2C_M_RECV_LEN read,
  it takes the length from the\ndevice. The downstream slave puts a length byte in
  buf[0]. The driver\nthen reads that many bytes into buf[1] with w1_f19_i2c_read().\n\
  \nbuf[0] is controlled by the device and can be 0 to 255.\nw1_f19_i2c_read() only
  rejects a zero count. The caller buffer is\nI2C_SMBUS_BLOCK_MAX + 2, so 34 bytes.
  A length above 32 makes the read\nrun past it, up to about 222 bytes out of bounds.\n\
  \nThe SMBus core does check buf[0] against I2C_SMBUS_BLOCK_MAX. That\ncheck runs
  after master_xfer returns. By then the write is already\ndone. i2c-algo-bit rejects
  an oversize length before it copies, and\nreturns -EPROTO.\n\nReject a length above
  I2C_SMBUS_BLOCK_MAX at both RECV_LEN sites, the\nsame way i2c-algo-bit does."
