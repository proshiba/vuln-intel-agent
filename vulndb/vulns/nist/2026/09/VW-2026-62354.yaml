title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Fix iopf_refcount leak on RID domain replacement\n\nintel_iommu_attach_device()
  enables IOPF for the new domain but never\ndisables it for the old one.  device_block_translation(),
  called at the\nstart of the function, tears down translation but does not touch
  any IOPF\nstate; blocking_domain_attach_dev() has to call iopf_for_domain_remove()\n\
  explicitly before invoking it for exactly this reason.\n\nidentity_domain_attach_dev()
  has the same problem.  Its comment claims\nthat no PRI handling is needed because
  the device has been put in the\nblocking state, but the blocking state and the IOPF
  reference count are\nindependent of each other.\n\nAs a result, replacing a domain
  that has an iopf_handler with another\ndomain at RID level leaks a reference in
  info->iopf_refcount.  The count\nnever drops back to zero, so iopf_queue_remove_device()
  is never called\nand iommu_disable_pci_pri() triggers its WARN_ON(info->iopf_refcount"
