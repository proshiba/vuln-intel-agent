title: The NEX-Forms – Ultimate Forms Plugin for WordPress plugin for WordPress 
  is vulnerable to generic SQL Injection via the 'additional_params' parameter 
  in all versions up to, and including, 9.3.0 due to insufficient escaping on 
  the user supplied parameter and lack of sufficient preparation on the existing
  SQL query. This makes it possible for authenticated attackers, with 
  custom-level access and above, to append additional SQL queries into already 
  existing queries that can be used to extract sensitive information from the 
  database. The operator allowlist applied by get_table_records() when building 
  its own WHERE fragment is not enforced on the same tainted additional_params 
  array when it is forwarded to get_total_records(), leaving the SQL sink 
  unprotected.
