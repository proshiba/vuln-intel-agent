title: "A flaw was found in the Ansible Automation Platform automation-controller.
  The unauthenticated\nBitbucket Data Center webhook receiver skips HMAC signature
  verification for diagnostics:ping\nevents after it has already looked up the target
  template, causing the endpoint to return HTTP\n200 for a template that has a Bitbucket
  DC webhook configured and HTTP 403 otherwise. An\nunauthenticated remote attacker
  can use this response discrepancy as an oracle to enumerate\nwhich Job Template
  and Workflow Job Template IDs have Bitbucket DC webhooks configured, without\nknowing
  the secret webhook_key."
