title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  mcp2221: validate report size in mcp2221_raw_event()\n\nmcp2221_raw_event() never
  validates the size of incoming HID reports.\nIn the MCP2221_I2C_GET_DATA path it
  trusts the device-supplied data[3]\nas the copy length without checking that 4 +
  data[3] bytes actually\nexist in the received report. A malicious or misbehaving
  USB device can\nsend a short report with a large data[3], causing the memcpy to
  read\npast the valid report data in the HID transfer buffer and leak\nuninitialized
  kernel memory back to userspace through the I2C/SMBus\nread path.\n\nAdd a minimum
  size check at entry and validate that the source range\nfits within the received
  report before the copy."
