title: Snipe-IT before 8.7.0 fails to check the return value of 
  Storage::delete() in UploadedFilesController::destroy() and 
  Api\\UploadedFilesController::destroy(), allowing deletion requests to report 
  success while files remain on disk. Administrators performing attachment 
  deletions receive success responses and see files hidden from listings, but 
  the physical files persist on disk and remain accessible to anyone with 
  filesystem or backup access.
