title: An authorization bypass vulnerability was identified in GitHub Enterprise
  Server that allowed any authenticated user of the instance to read the raw 
  diff or patch of pull requests in private repositories without authorization. 
  Access tokens for raw pull request diffs and patches were scoped to the 
  repository name and pull request number rather than to a globally unique 
  repository identifier, so an attacker who created a repository and pull 
  request matching a target's repository name and pull request number could use 
  a token for their own repository to retrieve the private pull request's 
  contents. Exploitation required the attacker to know the target repository's 
  name and a valid pull request number. This vulnerability affected all versions
  of GitHub Enterprise Server prior to 3.22 and was fixed in versions 3.17.21, 
  3.18.15, 3.19.12, 3.20.8, and 3.21.6. This vulnerability was reported via the 
  GitHub Bug Bounty program.
