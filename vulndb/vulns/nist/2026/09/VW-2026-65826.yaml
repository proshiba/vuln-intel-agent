title: The Modula Image Gallery – Photo Grid & Video Gallery plugin for 
  WordPress is vulnerable to arbitrary file deletion due to insufficient file 
  path validation in the upload_image function in all versions up to, and 
  including, 3.0.2. This makes it possible for authenticated attackers, with 
  author-level access and above, to delete arbitrary files on the server. The 
  path restriction to wp-content/uploads is not an effective ownership boundary,
  as all user attachment files reside within that tree, and Authors trivially 
  satisfy the edit_post check on their own galleries.
