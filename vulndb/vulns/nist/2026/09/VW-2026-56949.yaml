title: The My Calendar – Accessible Event Manager plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via 'fallback' Shortcode Attribute 
  in all versions up to, and including, 3.8.3 due to insufficient input 
  sanitization and output escaping. This makes it possible for authenticated 
  attackers, with contributor-level access and above, to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  The bypass relies on hex-encoded shortcode attribute payloads (e.g. 
  \x3cscript\x3e), which wp_kses_post cannot strip on save because they appear 
  as literal backslash sequences rather than real HTML tags; WordPress core's 
  shortcode_parse_atts() then calls stripcslashes() at render time, decoding the
  escapes into real angle brackets before they reach the unescaped sink.
