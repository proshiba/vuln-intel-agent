title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregulator:
  fp9931: Fix VPOS/VNEG voltage selector table\n\nThe VPOSNEG_table[] mapping does
  not match the FP9931 datasheet.\n\nThe datasheet defines the VPOS/VNEG voltage mapping
  as:\n\n  00h-04h ->  7.04V (-7.04V)\n  05h     ->  7.26V (-7.26V)\n  06h     ->\
  \  7.49V (-7.49V)\n  ...\n  28h-3Fh -> 15.06V (-15.06V)\n\nHowever, VPOSNEG_table[]
  has two issues:\n\n1. Selector 0x00~0x04 should all map to 7.04V (5 entries), but
  the\n   table has 6 entries of 7.04V, causing all subsequent entries to be\n   shifted
  by one position.\n\n2. Selectors 0x29~0x3F should all clamp to 15.06V (23 entries),
  but\n   the table has only 41 entries. Any selector value above 0x28\n   would result
  in an out-of-bounds table access.\n\nFix both issues by removing the duplicate 7.04V
  entry and appending\nthe missing 23 clamped 15.06V entries, bringing the table to
  the\ncorrect size of 64 entries (0x00~0x3F)."
