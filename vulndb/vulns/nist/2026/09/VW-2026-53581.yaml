title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  reject a permission value exceeding the class permission count\n\nperm_read() bounds
  a permission value by SEL_VEC_MAX but never by the\nnprim of the owning class or
  common, which is taken verbatim from the\npolicy image.  security_get_permissions()
  then writes perms[value - 1]\ninto an nprim-sized kcalloc() array, so a class declaring
  fewer\npermissions than its largest permission value drives an out-of-bounds\nheap
  write.  The top-level symbol tables are validated this way; the\nnested per-class
  permission table is not.\n\nReject a permission whose value exceeds nprim, which
  is already set when\nperm_read() runs.  Well-formed policies are unaffected.\n\n\
  [PM: tweak comment for line length]"
