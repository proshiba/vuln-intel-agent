title: 'Joomla Extension - joomshaper.com - Missing Directory Confinement in Media
  Rename Allowing Arbitrary File Rename in SP Page Builder (Free and Pro) 4.0.0 -
  6.9.0 - The media rename task applied neither of the directory boundary checks used
  by the folder operations in the same controller, and its validation guard required
  only that either a media record exist for the supplied identifier or that the supplied
  path be present in #__spmedia, rather than both. The identifier and the path were
  consequently never checked against one another, so any valid media identifier could
  be paired with an unrelated filesystem path, and the STR input filter left traversal
  sequences intact. An attacker could rename files elsewhere in the installation,
  including renaming configuration.php to take the site offline.'
