title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/migrate_device:
  avoid out-of-bounds writes for compound folios\n\nmigrate_device_range() and migrate_device_pfns()
  clear the entries\nfollowing a compound folio so that the PFN arrays retain their\n\
  page-granular representation.\n\nIf a compound folio extends beyond the end of the
  caller-provided range,\nthe loops clear all following folio entries without limiting
  them to the\nnumber of slots remaining in the npages-sized array, causing an\nout-of-bounds
  write.\n\nDo not proceed with a compound folio if its page-granular representation\n\
  does not fit entirely in the remaining PFN array.  If this happens, drop\nany reference
  and lock acquired for the folio, clear the remaining\nentries, and stop collecting.\n\
  \nObserved with a KASAN x86 QEMU kernel using the HMM migrate_anon_huge_zero\nselftest.\
  \  Closing /dev/hmm_dmirror0 after migrating an anonymous huge\npage to device memory
  exercises:\n\n  dmirror_fops_release()\n    -> dmirror_device_"
