title: A weakness has been identified in mealie-recipes Mealie up to 3.25.1. 
  Affected is the function payload.model_dump of the file 
  mealie/routes/households/controller_group_recipe_actions.py of the component 
  Recipe Action Trigger. Executing a manipulation of the argument url can lead 
  to server-side request forgery. The attack can be executed remotely. The 
  exploit has been made available to the public and could be used for attacks. 
  Upgrading to version 3.26.0 is able to address this issue. This patch is 
  called fb221afa258c8dd2c4ac95b1996c33ef9db3f477. The affected component should
  be upgraded.
