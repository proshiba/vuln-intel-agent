title: "Missing Release of Resource after Effective Lifetime vulnerability in Erlang/OTP
  inets httpd allows an unauthenticated remote attacker to cause denial of service
  by sending a request with a chunked body whose chunk-size line is not a hexadecimal
  number. The worker serving the connection is never released and no timeout reclaims
  it, so repeating the request across connections occupies every available worker
  and denies service to legitimate clients. No authentication is required and the
  default configuration is affected.\n\nThe chunk-size line must arrive in a write
  separate from the headers. When the body accompanies the headers, httpd_request_handler:handle_body/3
  calls http_chunk:decode/3 inside a try ... catch throw:Error, so the {error, {chunk_size,
  _}} thrown by http_chunk:decode_size/4 is answered with 400 Bad Request. When the
