title: parsedmarc 9.0.6 before 11.0.1 writes forensic report sample files using 
  an output path derived from the email subject. When the subject consists 
  entirely of path traversal sequences, the filename sanitization function 
  produces an empty string, and a fallback to the raw unsanitized subject causes
  the resulting file to be written outside the intended samples directory. An 
  attacker who can cause a forensic failure report with a crafted Subject to be 
  processed can write a dot-prefixed file with attacker-controlled content to an
  ancestor directory of the configured samples output path. Exploitation 
  requires that file output for forensic report samples is enabled.
