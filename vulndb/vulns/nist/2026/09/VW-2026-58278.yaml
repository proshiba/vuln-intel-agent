title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenvswitch:
  Fix CT limit teardown use-after-free\n\nPacket processing uses CT limit state under
  RCU, while netns teardown\nfrees that state under ovs_mutex. The CT limit pointer
  was neither removed\nfrom readers nor protected by a grace period, allowing packet
  processing to\ndereference the freed state.\n\nAn unprivileged user can trigger
  this bug from a user and network\nnamespace, causing a slab-use-after-free in ovs_ct_execute()
  when the\nnetns is torn down.\n\nPublish the CT limit pointer through RCU, remove
  it before teardown, and\nwait for readers before freeing its contents. Keep ovs_mutex
  around\nindividual CT limit updates, and use the RCU read-side lock while GET\n\
  traverses the RCU-protected limit lists.\n\nNetns teardown detaches the RCU-protected
  CT limit state in the pernet\n.pre_exit callback while holding ovs_mutex.  The pernet
  core guarantees an\nRCU grace period between the .pre_exit and .exit callbacks,
  so the .exit\n"
