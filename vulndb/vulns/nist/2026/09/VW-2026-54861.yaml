title: The WP Fusion (Pro) plugin for WordPress is vulnerable to Privilege 
  Escalation in all versions up to, and including, 3.47.13. This is due to 
  insufficient authorization checks on the role parameter in the ThriveCart Auto
  Login handler's thrivecart() function. This makes it possible for 
  authenticated attackers, with Subscriber-level access and above, and who 
  possess the access_key, to create a new user account with administrator 
  privileges and gain full control over the WordPress site. The required 
  access_key is intentionally shared with ThriveCart customers as part of the 
  plugin's documented setup process, making it accessible to attackers who have 
  made a purchase. The vulnerability is only exploitable when the ThriveCart 
  Auto Login option is enabled.
