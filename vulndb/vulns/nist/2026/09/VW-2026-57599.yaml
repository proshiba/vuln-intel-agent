title: "Traefik is an HTTP reverse proxy and load balancer. In Traefik v1.x, v2.x
  through v2.11.55, and v3.0.0 through v3.7.11, header names are canonicalized only
  on dashes, so X-Auth-User, X_Auth_User and X.Auth.User are treated as three distinct
  headers by Traefik, while backends that derive variable names from header names
  (CGI, WSGI, PHP, NGINX and others) collapse them into a single variable. A client
  can therefore smuggle a dot-form alias of a header that Traefik manages past the
  middleware managing it — for example supplying X.Authenticated.User alongside the
  canonical X-Authenticated-User written by the ForwardAuth middleware — causing such
  a backend to read the client-supplied value instead of the identity Traefik asserted.
  In the tested configuration (PHP 8.2 built-in SAPI over an HTTP/1 backend path),
  Go's lexical header ordering makes the attacker-supplied value win deterministically,
  so a client that ForwardAuth admits as a low-privilege identity can be treated by
  the backend as "
