title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  gate nfs2 setacl by argp->mask\n\nThe NFSACL v2 SETACL path shares the decoder convention
  used by its\nv3 sibling: nfsaclsvc_decode_setaclargs() fills in argp->acl_access\n\
  only when NFS_ACL is set in the request mask and argp->acl_default\nonly when NFS_DFACL
  is set, leaving the other pointer NULL because\nthe argument buffer is zeroed up
  to pc_argzero before decode.\n\nnfsacld_proc_setacl() then hands both pointers to
  set_posix_acl()\nunconditionally. set_posix_acl(idmap, dentry, type, NULL) is the
  VFS\n\"remove this ACL type\" operation, so an omitted arm is\nindistinguishable
  from an explicit request to delete that ACL. A\nSETACL carrying only NFS_ACL silently
  strips the directory's default\nACL; mask=0 strips both.\n\nThis is the same defect
