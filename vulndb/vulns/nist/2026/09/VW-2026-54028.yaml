title: 'A weakness has been identified in StackStorm st2 up to 3.9.0. This issue affects
  the function assert_user_is_admin_if_user_query_param_is_provided of the file st2api/st2api/controllers/v1/actionexecutions.py
  of the component NoOp RBAC backend. This manipulation of the argument User causes
  improper privilege management. The attack is possible to be carried out remotely.
  The exploit has been made available to the public and could be used for attacks.
  Prior advisory CVE-2022-44009 was reported as a follow-up on the same sink, but
  this issue is distinct: it needs no Jinja RBAC und affects default install with
  RBAC disabled. The project was informed of the problem early through an issue report
  but has not responded yet.'
