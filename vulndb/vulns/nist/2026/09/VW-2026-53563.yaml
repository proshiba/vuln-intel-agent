title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  amba-pl011: synchronize DMA teardown\n\ndmaengine_terminate_all() does not wait
  for a running callback, so the TX\ncallback can still touch the TX buffer after
  it is freed. The RX poll\ntimer reads the RX buffers without the port lock.\n\n\
  Switch to dmaengine_terminate_sync() and delete the RX timer before\nfreeing the
  buffers."
