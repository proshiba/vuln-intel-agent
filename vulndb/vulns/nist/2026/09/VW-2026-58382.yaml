title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/rocket:
  fix NULL dereference and integer overflow in rocket_job_push()\n\nrocket_job_push()
  allocates a temporary array to hold all input and\noutput GEM object pointers:\n\
  \n    bos = kvmalloc_array(job->in_bo_count + job->out_bo_count,\n             \
  \            sizeof(void *), GFP_KERNEL);\n    memcpy(bos, job->in_bos, job->in_bo_count
  * sizeof(void *));\n    memcpy(&bos[job->in_bo_count], job->out_bos, ...);\n\nTwo
  bugs exist:\n\n1. Missing NULL check: if kvmalloc_array() fails, bos is NULL and\n\
  \   the subsequent memcpy() dereferences it, causing a kernel NULL\n   pointer dereference.\n\
  \n2. Integer overflow: in_bo_count and out_bo_count are both u32, set\n   directly
  from userspace-supplied in_bo_handle_count and\n   out_bo_handle_count with no prior
  validation. Their sum is computed\n   in u32 arithmetic and can wrap to a smaller
  value, causing the\n   allocation count passed to kvmalloc_array() to be smaller
  than\n   intended. S"
