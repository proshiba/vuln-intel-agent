title: The All Bootstrap Blocks WordPress plugin through 1.3.31 does not 
  validate a block attribute before using it to build a filesystem path that is 
  included at render time, allowing users with contributor-level access and 
  above to include arbitrary local files, disclose their contents, and execute 
  PHP where a local file containing PHP code can be reached. Exploitation 
  requires the plugin's Lightspeed subsystem to be enabled, which is not the 
  default.
