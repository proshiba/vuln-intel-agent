title: "The Paytium: Mollie payment forms & donations plugin for WordPress is vulnerable
  to Privilege Escalation in all versions up to, and including, 5.0.3. The 5.0.3 patch
  introduced a wp_hash()/hash_equals() signature gate on the pt-paytium-user-data
  field, but left a second filter — pt_cf_checkout_meta(), registered on the pt_meta_values
  hook after the signed builder — that copies every $_POST['pt_form_field'][*] key
  verbatim into the payment meta array without any signature verification; this allows
  the pt-user-role value it copies to overwrite the signed path's output, after which
  paytium_user_data_processing() reads the persisted _pt-user-role post meta and passes
  it directly as the role argument to wp_insert_user(). This makes it possible for
  unauthenticated attackers to register a new WordPress account with the administrator
  role and fully take over the site. Exploitation requires submitting a payment through
  a publicly-exposed [paytium] shortcode form and completing the resulting pay"
