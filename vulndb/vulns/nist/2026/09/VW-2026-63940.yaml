title: Hatchet is a platform for orchestrating background tasks, AI agents, and 
  durable workflows at scale. Prior to 0.106.1, the WorkerStatus gRPC polling 
  path in pkg/repository/durable_events.go passes caller-supplied durable task, 
  node, and branch identifiers to ListSatisfiedEntries without a tenant filter, 
  allowing an authenticated tenant worker that knows another tenant's 
  durable-task UUID to retrieve matching durable event-log records. The UUIDv4 
  requirement makes exploitation unlikely, and single-tenant deployments are 
  unaffected in practice. This issue is fixed in version 0.106.1.
