title: Kedro-Datasets provides data connectors for Kedro. From version 5.0.0 
  until 9.5.0, kedro_datasets_experimental.pytorch.PyTorchDataset in 
  kedro-datasets loads .pt model files with torch.load without enforcing 
  weights_only=True, and user-supplied load_args are silently dropped. On 
  PyTorch versions earlier than 2.6, a malicious pickle-backed model from an 
  attacker-influenced shared registry, downloaded checkpoint, or partitioned 
  external source can execute arbitrary code when a Kedro pipeline loads it. The
  issue affects only the opt-in kedro_datasets_experimental component and does 
  not affect users who load only trusted files. This issue is fixed in version 
  9.5.0.
