title: "Improper escaping of a request URL in  ConfigServer Security & Firewall allows
  an unauthenticated remote attacker to execute arbitrary commands as the CSF service
  account via shell command injection.\n\nThe vulnerability affects versions of the
  software originally distributed by ConfigServer, as well as versions of the WebPros-maintained
  fork that contain the vulnerable code. WebPros has addressed the vulnerability in
  version 16.30. Other forks or independently maintained versions of ConfigServer
  Security & Firewall (CSF) may also be affected and should be evaluated independently."
