title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  avoid unneeded actions on subflow reset\n\nOnce in a blue moon, the mptcp receive
  path can recursively call\nmptcp_data_ready() via state change under unlucky error
  conditions, and\nthen try to hold the data lock again.\n\nBreak the recursion loop
  explicitly checking for the exceptional\ncondition.\n\nAdd a new flag instead of
  using an existing one like 'closing', to exit\nearly in subflow_state_change(),
  and explicitly flush the RX queue at\nreset time.\n\nThis avoids unneeded processing
  to check for available data -- calling\nget_mapping_status() and more on a dying
  subflow -- but also in error\nreporting and worker scheduling.\n\nNote that we must
  consume the currently peeked skb before invoking\nmptcp_dss_corruption to avoid
  consuming it again after the eventual\nreset has freed it."
