title: BlueKitchen BTstack through 1.8.2 fails to validate the peer-reported 
  endpoint count against table bounds in A2DP stream endpoint discovery. A 
  bonded peer can send an AVDTP DISCOVER response with more endpoints than the 
  fixed table holds, causing out-of-bounds writes that corrupt adjacent static 
  objects and crash the process or sever event delivery.
