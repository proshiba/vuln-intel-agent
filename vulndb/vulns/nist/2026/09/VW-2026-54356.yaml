title: PassMark PerformanceTest before 11.1 build 1012, BurnInTest before 11.1 
  build 1000, and OSForensics before 11.1 build 1016 contain an improper access 
  control vulnerability in the DirectIo64.sys kernel driver that allows 
  unprivileged local users to perform privileged hardware operations by opening 
  a handle to the device object created without a security descriptor. Attackers
  can issue IOCTLs through the permissive default Windows ACL applied to the 
  device to access restricted hardware operations regardless of privilege or 
  integrity level.
