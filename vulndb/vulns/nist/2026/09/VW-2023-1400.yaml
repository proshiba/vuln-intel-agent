title: gatsby-plugin-sharp is a plugin for the gatsby framework which exposes 
  functions built on the Sharp image processing library. The gatsby-plugin-sharp
  plugin prior to versions 5.8.1 and 4.25.1 contains a path traversal 
  vulnerability exposed when running the Gatsby develop server (`gatsby 
  develop`). It should be noted that by default gatsby develop is only 
  accessible via the localhost 127.0.0.1, and one would need to intentionally 
  expose the server to other interfaces to exploit this vulnerability by using 
  server options such as --host 0.0.0.0, -H 0.0.0.0, or the GATSBY_HOST=0.0.0.0 
  environment variable. Attackers exploiting this vulnerability will have read 
  access to all files within the scope of the server process. A patch has been 
  introduced in gatsby-plugin-sharp@5.8.1 and gatsby-plugin-sharp@4.25.1 which 
  mitigates the issue by ensuring that included paths remain within the project 
  directory. As stated above, by default gatsby develop is only exposed to the 
