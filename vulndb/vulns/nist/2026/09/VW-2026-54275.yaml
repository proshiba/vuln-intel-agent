title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix buffer head management in ocfs2_read_blocks()\n\nIn ocfs2_read_blocks(), caller
  should't assume that buffer head returned\nby 'sb_getblk()' is exclusively owned
  and so 'put_bh()' always drops\nb_count from 1 to 0.  If it is not so, buffer head
  remains on hold and\nlikely to be returned by the next call to 'sb_getblk()' unchanged
  - that\nis, with BH_Uptodate bit set even if it has failed validation previously,\n\
  thus allowing to insert that buffer head into OCFS2 metadata cache and\nsubmit it
  to upper layers.  To avoid such a scenario, BH_Uptodate should\nbe cleared immediately
  after 'validate()' callback has detected some data\ninconsistency."
