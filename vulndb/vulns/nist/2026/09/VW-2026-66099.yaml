title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: bcm_sf2: bound the CFP rule dump by the caller's buffer size\n\nbcm_sf2_cfp_rule_get_all()
  walks the whole cfp.unique bitmap into\nrule_locs[] without consulting nfc->rule_cnt,
  which is how many entries\nthe caller had room for.  ETHTOOL_GRXCLSRLALL requires
  no CAP_NET_ADMIN\nand the ioctl sizes the buffer from the rule_cnt userspace passes
  in, so\nonce an admin has installed CFP rules any user can ask for fewer slots\n\
  than there are rules and run off the end of the allocation.  A rule_cnt\nof 0 leaves
  the buffer pointer NULL and the walk dereferences it."
