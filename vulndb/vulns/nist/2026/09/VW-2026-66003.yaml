title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Take trace_array reference when opening a tracer options file\n\nWhen a tracer option
  file is opened, it is passed a descriptor that points\nto an element on the trace_array's
  topts array. This element has\ninformation to find the trace array and other information.
  It uses this\nelement to take a reference of the trace_array so that the trace_array\n\
  does not get removed while this file is opened.\n\nUnfortunately, there's a race
  condition where the element itself could be\nfreed by the removal of the instance
  the trace_array represents causing a\nuse-after-free as this element that is used
  to find the trace_array to\nincrement its reference counter is also freed when the
  instance is\nremoved.\n\nTo solve this, add a trace_array_tracer_options_get() helper
  function that\nwill take the address of the element that is passed to the open function\n\
  by the inode->i_private pointer and search all the trace_arrays under a\nlock to
  fin"
