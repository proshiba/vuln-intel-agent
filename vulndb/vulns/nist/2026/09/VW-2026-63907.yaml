title: GoCD is a continuous deliver server. From 13.1.0 until 26.1.0, the 
  /go/api/support/process_list endpoint does not enforce its intended 
  administrator-only authorization. An authenticated internal user can query the
  endpoint while source control child processes are running and view 
  command-line arguments, usernames, remote material URLs, and internal material
  paths for materials the user cannot otherwise access. Exploitation depends on 
  unpredictable process timing, and credentials, environment variables, and 
  user-defined secrets remain masked or omitted. This issue is fixed in version 
  26.1.0.
