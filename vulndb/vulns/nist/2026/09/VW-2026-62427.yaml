title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/sysfs:
  Add lockdown checks to legacy I/O and memory handlers\n\nCurrently, the legacy I/O
  and memory sysfs handlers do not check\nsecurity_locked_down(LOCKDOWN_PCI_ACCESS),
  leaving the legacy_io and\nlegacy_mem files unprotected when the kernel is locked
  down.\n\nCommit eb627e17727e (\"PCI: Lock down BAR access when the kernel is locked\n\
  down\") added the check to pci_write_config(), pci_mmap_resource(), and\npci_write_resource_io()
  to prevent userspace from programming DMA-capable\nhardware that could be used to
  modify kernel code, but did not cover the\nlegacy handlers.\n\nAs a result, root
  can still write arbitrary I/O ports and map the legacy\nI/O and memory spaces while
  the kernel is locked down, which is the same\ncapability the lockdown is meant to
  remove.\n\nAdd the same check to pci_write_legacy_io(), pci_mmap_legacy_mem(), and\n\
  pci_mmap_legacy_io().\n\nThese generic handlers cover both architectures that define
  HAVE_PCI_LEGA"
