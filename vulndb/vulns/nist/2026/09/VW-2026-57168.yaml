title: "Snipe-IT versions <= 8.6.3 (fixed in 8.7.0) do not check the return value
  of storage write operations in ImageUploadRequest::handleImages(). Because Laravel's
  default disk mode does not throw on failure, a silently failed Storage::disk('public')->put(...)
  call still caused the application to delete the previous image via deleteExistingImage()
  and to reassign and persist the model's image reference to the new filename, destroying
  the existing image and leaving the database row pointing at a file that was never
  written. A mirror problem existed in deleteExistingImage(), where a failed Storage::delete()
  still nulled the model's image field, orphaning the file on disk. The condition
  is not directly attacker-controlled: it is triggered when any legitimate authenticated
  user submits an image upload while the storage backend transiently fails (for example
  an S3 network error, a local filesystem permission problem, or quota exhaustion).
