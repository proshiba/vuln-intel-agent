title: "A stack-based buffer overflow in the dynamic loader (ld.so) of the GNU C Library
  (glibc) versions 2.14 through 2.44 allows a local attacker to crash or corrupt the
  memory of setuid/setgid (AT_SECURE) programs.\n\nWhen such a program's DT_RPATH
  or DT_RUNPATH begins with $ORIGIN and is followed by NUL or '/' the loader both
  reads past the end of the path buffer and writes past the end of a stack-allocated
  internal buffer. The corrupted loader stack can lead to a loader crash (denial of
  service) and limited disclosure of process memory."
