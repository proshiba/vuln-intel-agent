title: A vulnerability was identified in dbgate up to 
  6.8.1/7.0.2/7.1.8/7.2.5/7.3.1. This affects the function saveUploadedFile of 
  the file files.js of the component save-uploaded-file Endpoint. Such 
  manipulation of the argument filePath/fileName leads to path traversal. The 
  attack may be launched remotely. The exploit is publicly available and might 
  be used. The vendor was contacted early about this disclosure but did not 
  respond in any way.
