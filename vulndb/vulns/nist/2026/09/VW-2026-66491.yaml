title: Horilla is an HR and CRM software. In 1.5.0-85 and earlier, 
  payroll/views/component_views.py does not consistently authorize access in 
  allowances_deductions_tab, view_single_allowance, and view_single_deduction 
  before loading records selected by emp_id, allowance_id, or deduction_id. An 
  authenticated employee can substitute those identifiers to read another 
  employee's salary structure, allowance and deduction amounts, personal loan 
  disbursements, and repayment schedules without owning the record or holding 
  payroll-view permissions. No complete fixed version is available as of this 
  review.
