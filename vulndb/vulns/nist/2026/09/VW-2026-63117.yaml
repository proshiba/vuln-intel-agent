title: A flaw was found in Netty's `RedisArrayAggregator` component. A remote 
  attacker can exploit this vulnerability by sending specially crafted nested 
  Redis (RESP) array headers. This can cause the `RedisArrayAggregator` to 
  eagerly preallocate a large amount of heap memory, leading to heap memory 
  exhaustion and a Denial of Service (DoS) for applications using `RedisDecoder`
  with `RedisArrayAggregator` on untrusted traffic.
