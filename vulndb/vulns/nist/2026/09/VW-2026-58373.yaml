title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  eir: Fix OOB read in eir_get_service_data()\n\neir_get_service_data() walks the
  advertising data for a Service Data\nfield with a matching UUID.  On a mismatch
  it advances:\n\n    eir += dlen;\n    eir_len -= dlen;\n\neir_get_data() reports
  dlen as the field's data length, but the field\nspans dlen + 2 bytes once its length
  and type bytes count, and more\nwhen non-Service-Data fields were skipped to reach
  it.  The pointer\nlands correctly on the next field.  eir_len does not, and the
  shortfall\ncompounds across fields until eir_get_data() reads the length and type\n\
  bytes of a \"field\" past the end of the buffer.\n\nFor an ISO broadcast sink that
  buffer is hcon->le_per_adv_data[], filled\nfrom the periodic advertising reports
  of a remote broadcaster.  A PA\npayload packed with mismatching Service Data fields
  walks off the array\ninto the rest of struct hci_conn.  A drifted field that matches
  the BAA\nUUID puts those bytes in is"
