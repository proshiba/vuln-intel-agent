title: OpenReception's appointment booking software provides an end-to-end 
  encrypted appointment booking platform. Prior to 1.1.1, POST 
  /api/auth/passkeys accepts a request-body userId and attacker-supplied passkey
  without an authenticated session, does not call 
  WebAuthnService.verifyRegistration, and does not bind enrollment to 
  locals.user.id. An unauthenticated attacker who knows the public tenant ID and
  the target staff email can use the public booking bootstrap and GET 
  /api/tenants/[id]/appointments/staff-public-keys to obtain candidate userId 
  values. The attacker first causes UserService.addAdditionalPasskey to store a 
  controlled public key for a candidate userId, then attempts login with the 
  target email; the login check compares verificationResult.userId with the 
