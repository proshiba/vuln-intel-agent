title: "Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')
  vulnerability in Apache Syncope.\n\n\n\n\n\nAn administrator with adequate entitlements
  can achieve execution of arbitrary SQL via stacked queries, leveraging unsanitized
  entityKey and opEvent parameters.\n\nThis issue affects Apache Syncope: from 3.0.0-M0
  through 3.0.16, from 4.0.0-M0 Through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\n\n\
  Users are recommended to upgrade to version 4.0.8 / 4.1.3, which fix this issue."
