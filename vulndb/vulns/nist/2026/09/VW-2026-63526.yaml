title: The WP Ghost (Hide My WP Ghost) – Security & Firewall plugin for 
  WordPress is vulnerable to Open Redirect in all versions up to, and including,
  7.0.02. This is due to the plugin not properly validating user input. This 
  makes it possible for unauthenticated attackers to redirect users to 
  potentially malicious sites if they can successfully trick them into clicking 
  on a specially crafted link. Exploitation requires tricking a logged-in user 
  into clicking a crafted logout URL; the victim is fully logged out via 
  wp_logout() before the malicious redirect is issued, making the logout 
  irreversible as part of the attack chain.
