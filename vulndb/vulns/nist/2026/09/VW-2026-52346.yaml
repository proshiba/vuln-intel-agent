title: Kirby is an open-source content management system. Prior to 4.9.5 and 
  5.5.2, depending on the release line, Kirby's media handler used incomplete 
  filesystem containment checks in src/Filesystem/Dir.php and 
  src/Filesystem/F.php through Kirby\Filesystem\Dir::realpath() and 
  Kirby\Filesystem\F::realpath(). The checks accepted a sibling directory whose 
  path shared the intended root's string prefix, such as /var/www/site2 next to 
  /var/www/site, because they did not require an exact match or a 
  DIRECTORY_SEPARATOR boundary. A remote attacker could use 
  Kirby\Cms\Media::thumb() to create and access thumbnails from image files in a
  PHP-readable sibling directory when that directory contained a valid .json 
  thumbnail job file, potentially exposing staging sites, backups, or other 
  internal sites and deleting the job file during processing. This issue is 
  fixed in versions 4.9.5 and 5.5.2.
