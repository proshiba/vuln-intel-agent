title: Improper input validation in Snowflake CLI versions prior to 3.27.0 
  allowed unsanitized user-controlled values to be interpolated into SQL strings
  that are executed as multi-statement queries. An attacker who is able to 
  supply a malicious project configuration file or craft command-line input can 
  cause Snowflake CLI to execute attacker-controlled SQL statements in the 
  context of the victim's Snowflake session and active role. Successful 
  exploitation requires either write or pull-request access to a project 
  repository whose CI/CD pipeline runs Snowflake CLI under an elevated service 
  account role, or the ability to supply untrusted input to CLI-wrapping 
  automation. Impact is limited by the privileges held by the configured 
  Snowflake role at execution time. The fix is available in Snowflake CLI 
  version 3.27.0, which also addresses several additional security findings. 
  Users must manually upgrade.
