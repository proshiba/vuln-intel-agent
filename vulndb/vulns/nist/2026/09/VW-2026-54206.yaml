title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  keep the last remote linked during FDB flush\n\nA non-nexthop FDB entry is expected
  to have at least one remote while it\nremains reachable through the FDB hash table.
  A filtered bulk flush\nviolates this invariant when every remote matches: It unlinks
  the last\nremote in vxlan_fdb_dst_destroy() and only afterwards tells vxlan_flush()\n\
  to destroy the parent FDB entry.\n\nAn RCU reader can find the parent during this
  interval.\nfirst_remote_rcu() then applies list_entry_rcu() to the empty list head,\n\
  producing an invalid remote pointer that the receive learning path can\nread from
  and write to.\n\nWhen a matching remote is the sole remaining remote, leave it linked
  and\nask the caller to destroy the entire FDB entry. vxlan_fdb_destroy() keeps\n\
  the remote attached while sending the deletion notification and removing\nthe parent
  from the lookup structures."
