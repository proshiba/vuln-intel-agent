title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/mes:
  Fix hung_queue_db_array loop limit for multi-XCC\n\nThe loop iterated only AMDGPU_MAX_MES_PIPES
  times, leaving entries\nuninitialized for multi-XCC GPUs. This causes null pointer
  dereferences\nwhen accessing arrays indexed by XCC ID >= 2. Extend the loop to cover\n\
  all XCCs (AMDGPU_MAX_MES_PIPES * num_xcc), matching other per-XCC\narrays."
