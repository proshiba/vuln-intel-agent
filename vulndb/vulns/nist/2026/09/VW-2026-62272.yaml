title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlwt_bpf:
  Restore reserved headroom after xmit program\n\nip_finish_output2() expands an skb
  to LL_RESERVED_SPACE(dev) before LWT\nxmit. An LWT_XMIT BPF program can then modify
  the skb head and still\nreturn BPF_OK, so bpf_xmit() rechecks the remaining headroom
  before the\nskb continues to neighbour output.\n\nThat recheck uses dst->dev->hard_header_len.
  This is not enough for the\nneighbour cached-header path: neigh_hh_output() copies
  the cached hardware\nheader using the aligned hh_cache size, HH_DATA_MOD for short
  headers or\nHH_DATA_ALIGN(hh_len) otherwise.\n\nOn Ethernet, hard_header_len is
  14 but the cached copy needs 16 bytes. If\nan LWT_XMIT BPF program calls bpf_skb_change_head(skb,
  1, 0), the skb can\nstill have 15 bytes of headroom after the program. The existing
  check\naccepts that, after which neigh_hh_output() hits its headroom warning and\n\
  drops the skb.\n\nUse LL_RESERVED_SPACE(dst->dev) in the post-BPF headroom check
  to"
