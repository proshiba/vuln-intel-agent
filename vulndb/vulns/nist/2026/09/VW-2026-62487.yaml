title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: fix non-AQL packet accounting for MLO stations\n\n__mt76_tx_queue_skb() overrides
  the wcid passed by the driver with\nsta->drv_priv, so the wcid might incorrectly
  be changed after TX,\ncausing wcid->non_aql_packets to be counted on the wrong wcid.
  For\nexample, on the AP side, if a station's setup link is the 5G link and\nthe
  station uses 2G to transmit a frame, the value of non_aql_packets\nis increased
  on the 5G wcid but decreased on the 2G wcid. Once the\ninflated counter exceeds
  MT_MAX_NON_AQL_PKT, the TX scheduler\npermanently refuses to service the station.\n\
  \nDrop the reassignment and account on the wcid used for transmission.\nThis also
  records the actual wcid in the queue entry."
