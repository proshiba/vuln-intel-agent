title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/sysfs:
  Fix out-of-bounds read in pci_write_legacy_io()\n\npci_write_legacy_io() loads 4
  bytes from the kernfs write buffer\nregardless of how many bytes userspace wrote:\n\
  \n  if (count != 1 && count != 2 && count != 4)\n          return -EINVAL;\n\n \
  \ return pci_legacy_write(bus, off, *(u32 *)buf, count);\n\nkernfs_fop_write_iter()
  allocates the buffer with kmalloc(len + 1),\nso a 1-byte write to the legacy_io
  sysfs file allocates 2 bytes and\nthe unconditional u32 load reads up to 2 bytes
  past the end of the\nallocation, which KASAN reports as a slab-out-of-bounds read.\n\
  Similarly, a 2-byte write overreads by 1 byte.\n\nThus, read only the number of
  bytes requested using get_unaligned_le16()\nand get_unaligned_le32() for the 2 and
  4 byte cases, interpreting the\nbuffer as little-endian to match the byte ordering
  of PCI I/O port\nspace.\n\nThe PowerPC implementation previously compensated for
  the generic\ncode's native-endian 32-bit loa"
