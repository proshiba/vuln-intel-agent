title: mcp-searxng is a Model Context Protocol server that gives AI assistants 
  web search and URL-reading capabilities through SearXNG. Prior to 1.7.1, 
  web_url_read in src/index.ts passes a caller-supplied URL to readUrlContent() 
  in src/url-reader.ts, where checkContentLength() treats a missing 
  Content-Length header as an inconclusive preflight and the normal and error 
  paths then consume the complete body with response.text(). A server that omits
  Content-Length can therefore bypass URL_READ_MAX_CONTENT_LENGTH_BYTES and 
  force unbounded memory use. The resulting string is also processed by 
  NodeHtmlMarkdown.translate(), increasing CPU consumption and allowing an 
  unauthenticated HTTP client to cause denial of service. This issue is fixed in
  version 1.7.1.
