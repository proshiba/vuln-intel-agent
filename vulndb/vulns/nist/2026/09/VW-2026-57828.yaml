title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to versions 7.0.16 and 
  8.0.5, DNP3 reassembly could buffer data without sufficient parser-level 
  bounds. Crafted DNP3 traffic may cause Suricata to consume excessive memory, 
  potentially resulting in denial of service. Versions 7.0.16 and 8.0.5 contain 
  a fix. As a workaround, disable DNP3 (which is not enabled by default) if it 
  is not needed, and/or define a limited `stream.reassembly.depth` (0 or absent 
  is unlimited).
