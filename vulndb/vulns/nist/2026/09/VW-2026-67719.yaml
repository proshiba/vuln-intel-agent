title: "Issue summary: A TLS server that calls SSL_set_SSL_CTX() to switch a\nconnection
  to a different SSL_CTX part way through a handshake may access\nmemory beyond the
  end of an internal array if the replacement context knows\nabout more provider signature
  algorithms than the context the connection was\ncreated from. Applications which
  never call SSL_set_SSL_CTX() are not\naffected.\n\nImpact summary: A remote peer
  may be able to cause a small out-of-bounds\nread, and in some circumstances a fixed-value
  out-of-bounds write, on the\nserver heap. This may lead to a Denial of Service.\n\
  \nCWE: CWE-787: Out-of-bounds Write\n\nDescription: A TLS connection records how
  many certificate slots it has\nwhen it is created, taken from the SSL_CTX that created
  it: the built-in\ncertificate types plus one slot for each provider TLS-SIGALG entry
  that\ncontext was aware of. That count sizes an internal array of per-slot\ncertificate
  validity flags.\n\nAn application may replace a connection's SSL_CTX part way through
  the\nhan"
