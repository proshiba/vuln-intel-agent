title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-integrity:
  fix buffer overflow with keyed discard\n\nSince commit 68c5c42567bc (\"dm-integrity:
  replace forgeable discard\nfiller with a keyed sector marker\"), integrity_metadata
  computes a\nchecksum for every discarded block into the \"checksums\" buffer.\n\
  integrity_sector_checksum always writes the whole digest. So if the tag\nsize is
  smaller than the digest size, the checksum of the last block\nthat fits into the
  buffer is written past the end of it. For example,\nwith hmac(sha256) and tag size
  16, a 4MiB discard writes 16 bytes past\nthe kmalloc'ed page.\n\nFix this by subtracting
  extra_space from the buffer size when computing\nmax_blocks, like we do for writes."
