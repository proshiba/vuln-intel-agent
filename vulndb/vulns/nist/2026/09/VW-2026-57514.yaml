title: "A stack-based buffer overflow vulnerability exists in the Bosch Sensortec
  BHI385 SensorAPI (C library) within the debug message parser function bhi385_parse_debug_message
  (located in bhi385_parse.c). \r\n\r\nThe function parses FIFO events and extracts
  an 8-bit message length directly from the attacker-controlled event payload (callback_info->data_ptr[0])
  without enforcing bounds checks or clamping the value.\r\n\r\nWhen copying the payload
  into a fixed-size stack buffer of 17 bytes (uint8_t debug_msg[17]) via memcpy, providing
  a length byte greater than 16 causes the function to write past the allocated stack
  boundary. \r\n\r\nThis memory corruption can be triggered by a malicious or compromised
  sensor or bus participant, leading to a firmware crash, Denial of Service (DoS),
  or potentially the execution of arbitrary code via adjacent stack data corruption."
