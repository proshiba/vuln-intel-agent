title: OpenMetadata through 2.0.2 contains a server-side request forgery 
  vulnerability in the URLValidator.validateURL function that fails to properly 
  resolve DNS hostnames and validate internal addresses. Users permitted to 
  create or update EventSubscription can set webhook destinations to internal 
  hosts, allowing the server to send requests to private networks and cloud 
  metadata endpoints while returning HTTP status codes that enable blind SSRF 
  probing.
