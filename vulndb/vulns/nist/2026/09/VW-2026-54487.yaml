title: Axolotl through 0.18.0 contains a remote code execution vulnerability in 
  the multipack patch path where trust_remote_code defaults to None instead of 
  False, causing the security guard to be bypassed. Attackers can execute 
  arbitrary Python code by crafting a malicious Hugging Face model repository 
  selected as base_model, which is loaded with hardcoded trust_remote_code=True 
  during AutoModelForCausalLM.from_pretrained.
