title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix uninitialized return value in netfs_unbuffered_write()\n\nIf preparation of
  the first subrequest fails,\nnetfs_unbuffered_write() exits its loop before ret
  is initialized. The\nempty-iterator check can do the same.\n\nFor synchronous writes,
  netfs_unbuffered_write_iter_locked() may then\nreturn an unrelated error instead
  of wreq->error. This is reachable\nthrough CIFS if cifs_prepare_write() fails to
  reopen the file or obtain\ncredits.\n\nInitialize ret to 0 so the caller returns
  wreq->error if no data was\nwritten, or the number of bytes already written otherwise.\n\
  \nFound with Clang's -Wconditional-uninitialized."
