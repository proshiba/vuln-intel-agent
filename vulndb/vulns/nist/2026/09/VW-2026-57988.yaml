title: "WWBN AVideo at commit c3edcc274c389816d434acadac07ee78eaf330c1 and earlier
  contains an XML injection vulnerability in plugin/AD_Server/VMAP.php, which is reachable
  without authentication when the AD_Server plugin is enabled. The script emits Content-Type:
  application/xml and writes the timeOffset and idTag values returned by AD_Server::getVMAPSFromRequest()
  directly into VMAP attributes without encoding. Those values originate from the
  base64- and JSON-decoded $_REQUEST['vmaps'] parameter, which is not covered by $securityFilter
  in objects/security.php. A remote attacker can craft a vmaps value (containing a
  non-empty VAST.campaing entry) and induce a user to open the resulting VMAP URL
  or a video page using it, injecting arbitrary <vmap:AdBreak> and <vmap:AdTagURI>/AdSource
  nodes into the generated XML. The player's IMA path (afterVideoJS -> PlayerSkins::setIMAADTag)
  then requests the attacker-supplied ad URLs, resulting in ad injection and cross-origin
  requests from the victim's play"
