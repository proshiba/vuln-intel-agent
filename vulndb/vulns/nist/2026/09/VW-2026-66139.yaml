title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/rds:
  acquire RDS_IN_XMIT in rds_tcp_reset_callbacks()\n\nrds_tcp_reset_callbacks() quiesces
  the transmit path by setting the\npath state to RDS_CONN_RESETTING and then waiting
  for RDS_IN_XMIT to\nbe sampled clear before swapping the underlying socket and calling\n\
  rds_send_path_reset().\n\nSampling the bit clear is not the same as owning it: rds_send_xmit()\n\
  can re-acquire RDS_IN_XMIT right after the wait_event() returns.  Its\nstate recheck
  after taking the lock is a store-buffering pattern (the\nresetter writes the state
  and reads the bit, the sender writes the\nbit and reads the state) and acquire_in_xmit()
  is only an acquire\noperation, so on weakly ordered architectures both sides can
  miss\neach other's write and the transmit path then runs concurrently with\nrds_send_path_reset()
  rewriting cp_xmit_* state - which is exactly\nwhat the comment above rds_send_path_reset()
  tells its callers to\nprevent.\n\nTake the lock instead, h"
