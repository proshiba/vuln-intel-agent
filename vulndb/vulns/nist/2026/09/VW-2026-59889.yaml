title: A security flaw has been discovered in WuzhiCMS up to 4.1.0. This affects
  the function member::setAvatar of the file 
  /index.php?m=member&f=user&v=setAvatar of the component Avatar Upload. The 
  manipulation of the argument File results in unrestricted upload. The attack 
  can be executed remotely. The exploit has been released to the public and may 
  be used for attacks. The project was informed of the problem early through an 
  issue report but has not responded yet.
