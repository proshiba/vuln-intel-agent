title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  nci: fix double completion race in nci_data_exchange_complete\n\nnci_close_device()
  and nci_rx_work can both call\nnci_data_exchange_complete() concurrently.  After
  commit 4527025d440ce8\n(\"nfc: nci: fix circular locking dependency in nci_close_device\"\
  ) moved\nflush_workqueue(ndev->rx_wq) after mutex_unlock(&ndev->req_lock),\nrx_work
  is no longer serialized with the explicit completion call in the\nclose path.  Both
  callers read the non-NULL callback pointer and invoke\nrawsock_data_exchange_complete(),
  which calls sock_put() -- but only one\nsock_hold() was taken, so the second sock_put()
  underflows the refcount\nand frees the socket while it is still in use.\n\nReplace
  the bare clear_bit(NCI_DATA_EXCHANGE) with\ntest_and_clear_bit() so that only the
  first caller proceeds to invoke\nthe callback."
