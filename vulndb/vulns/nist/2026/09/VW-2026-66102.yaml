title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Preserve inner map identity in callback frames\n\nCallback frame constructors initialize
  map-typed argument registers with\n__mark_reg_known_zero() and then restore map_ptr.
  This clears map_uid,\nwhich is the only field distinguishing inner maps that share
  an\ninner_map_meta template.\n\nWhen a timer callback invokes bpf_for_each_map_elem()
  on a second inner\nmap, both the saved first map and the second map value can reach
  the nested\ncallback as the same template with map_uid zero. bpf_timer_init() then\n\
  accepts pairing the timer from the second map with the first map.\n\nThe runtime
  records the first map in the timer without taking a reference.\nFreeing that map
  does not find the timer stored in the second map, so a\nlater timer callback dereferences
  the freed map.\n\nCopy map_uid from the same caller register as map_ptr when constructing\n\
