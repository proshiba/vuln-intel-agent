title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  fix use-after-free in ip6_finish_output2()\n\nip6_finish_output2() caches a pointer
  to the IPv6 destination\naddress (daddr) before invoking lwtunnel_xmit().  The LWT-BPF\n\
  transmit path or other encapsulation operations within\nlwtunnel_xmit() can reallocate
  the skb head, freeing the memory\nthat daddr points to.  When lwtunnel_xmit() returns\n\
  LWTUNNEL_XMIT_CONTINUE, the function continues to use the stale\ndaddr pointer to
  compute the nexthop and to look up or create the\nneighbour entry.  This results
  in a use-after-free read, which can\nleak sensitive kernel data, pollute the neighbour
  table with\narbitrary values, misdirect traffic, or crash the system.\n\nFix this
  by re-fetching the IPv6 header and the destination\naddress pointer after lwtunnel_xmit()
  returns\nLWTUNNEL_XMIT_CONTINUE, ensuring that the subsequent nexthop\ncomputation
  and neighbour lookup operate on valid memory."
