title: Joomla Extension - joomlart.com - Open mail relay via contact AJAX 
  endpoint in T4 Page Builder extension < 2.3.0 - The front-end JSON editor 
  endpoint exposes an action called contact that requires no authentication, no 
  CSRF token, no captcha (when no captcha plugin is enabled) and has no rate 
  limiting. The attacker fully controls the recipient, subject and HTML body, 
  and the mail is sent from the site's configured sender identity 
  (mailfrom/fromname).
