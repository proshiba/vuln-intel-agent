title: SigNoz versions 0.87.0 before 0.142.0 fail to escape user-supplied 
  telemetry field-key names in the v5 query_range API, allowing authenticated 
  users to inject SQL. Attackers with Viewer role or higher can embed backticks 
  and quotes in field names to break out of identifiers and string literals, 
  executing arbitrary ClickHouse SQL to read system tables and exfiltrate data.
