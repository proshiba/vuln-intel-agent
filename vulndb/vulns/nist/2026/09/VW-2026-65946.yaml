title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  cc2520: fix FIFOP work use-after-free\n\nThe FIFOP interrupt handler queues cc2520_fifop_irqwork.\
  \  On removal,\ncc2520_remove() only flushes the work.  The devm-managed FIFOP IRQ\n\
  remains active until after ->remove() returns and can queue the work\nagain after
  that flush, allowing it to run after the private data is\nreleased.\n\nDisable the
  work with disable_work_sync() instead of flushing it, so\nthe handler can no longer
  queue it once removal begins.  Destroy the\nbuffer mutex last, since the worker
  and the stop callback invoked\nthrough ieee802154_unregister_hw() both take it.\n\
  \nFound by an in-house static analysis tool."
