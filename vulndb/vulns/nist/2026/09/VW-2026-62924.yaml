title: WeGIA is a web manager for charitable institutions. Prior to 3.8.5, the 
  contribution request dispatcher in 
  web/html/contribuicao/controller/control.php accepts attacker-controlled 
  nomeClasse and metodo values without a complete controller and method 
  allowlist, exempts sensitive ContribuicaoLogController operations from 
  authentication, and constructs a controller include path without canonical 
  directory containment. An unauthenticated remote attacker can invoke 
  getContribuicoesLogJSON, sincronizarStatus, registrarFaturas, and other 
  sensitive methods to disclose contribution and donation records or trigger 
  financial workflow operations. A traversal-shaped nomeClasse value can also 
  cause require_once to include an accessible PHP or configuration file outside 
  the intended controller directory, exposing source code, credentials, or other
  sensitive local data. This issue is fixed in version 3.8.5.
