title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  invalidate the correct range after O_APPEND direct write\n\nfuse_direct_write_iter()
  captures pos before generic_write_checks(),\nwhich moves ki_pos to EOF for O_APPEND
  writes:\n\n  fuse_direct_write_iter()\n  {\n      pos = iocb->ki_pos;          \
  \ /* 0 (user-supplied)       */\n      generic_write_checks();       /* ki_pos ->
  EOF           */\n      fuse_direct_io();             /* writes at EOF, correct\
  \  */\n      invalidate(pos, pos + res);   /* [0, res) -- wrong       */\n  }\n\n\
  The post-write invalidation targets a stale range instead of the\nactual written
  range at EOF.\n\nThis can cause data inconsistency when the file size is not\npage-aligned.\
