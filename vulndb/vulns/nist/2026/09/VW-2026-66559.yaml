title: OpenClaw versions >= 2026.3.25 and < 2026.8.1 apply invalid-token rate 
  limiting for Synology Chat webhooks before authentication and key the limit on
  the raw proxy socket address. In deployments where OpenClaw sits behind a 
  trusted reverse proxy or tunnel and multiple external clients share a single 
  socket address, an unauthenticated sender can exhaust the shared invalid-token
  budget, causing subsequent legitimate Synology Chat webhook callbacks to be 
  rejected until the rate-limit window expires. The attacker cannot obtain a 
  valid token or read message data; the impact is temporary loss of channel 
  availability. Fixed in 2026.8.1.
