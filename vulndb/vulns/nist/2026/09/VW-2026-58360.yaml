title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/mce:
  Make the MCE notifier per-region\n\nFlavien Solt reported lifetime issues with the
  CXL MCE notifier, which\ncan lead to NULL dereferences and use-after-free in the
  MCE handler.\nThe notifier was registered per memory device and stored in 'struct\n\
  cxl_memdev_state', even though it only needs the region state (the\nregion's SPA
  range and its extended linear cache size).\n\nInstead of keeping the memory device
  and endpoint alive, the correct fix\nis to move the notifier into 'struct cxl_region'
  and register it from\ncxl_region_probe() as it should be a per-region notifier.
  Setup the\nregistration to only happen for regions that have an extended linear\n\
  cache as that is the only current usage.\n\nRemove cxl_port_get_spa_cache_alias()
  as it is now dead code.\n\n[ dj: Update dev_warn() when notifier fails due to kconfig.
  (Ben) ]"
