title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  check dir entry fits before reading the hash trailer in ext4_search_dir()\n\nFor
  casefolded encrypted directories ext4 stores an 8-byte hash trailer\nafter the name
  (EXT4_DIRENT_HASHES()), at an offset derived from\nde->name_len.  On the sb_no_casefold_compat_fallback()
  path ext4_match()\nreads that trailer, but ext4_search_dir()'s by-hand pre-check
  only tests\nde->name + de->name_len <= dlimit, which proves the name fits, not the\n\
  rounded trailer.  A crafted entry whose name ends at the block boundary\npasses
  the check while EXT4_DIRENT_HASHES(de) lands past the block end,\nso ext4_match()
  reads out of bounds on an ordinary lookup.  KASAN reports\nit as a use-after-free
  when the page after the directory block holds a\nfreed object:\n\n  BUG: KASAN:
  use-after-free in ext4_match (fs/ext4/namei.c:1435)\n  Read of size 4 at addr ffff888010458000
  by task exploit\n  Call Trace:\n   ext4_match (fs/ext4/namei.c:1435)\n   ext4_search_di"
