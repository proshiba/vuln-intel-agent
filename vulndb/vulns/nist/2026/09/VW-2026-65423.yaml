title: Snipe-IT is an IT asset/license management system. Prior to 8.7.0, a user
  with the customfields.create permission can store markup in CustomField.name, 
  and app/Presenters/AssetPresenter.php assigns that value as an unescaped 
  bootstrap-table header title. When another user opens an asset-list page 
  associated with the fieldset, the stored markup executes on page load in that 
  user's Snipe-IT session. This can expose same-origin data and perform 
  authenticated actions with the victim's privileges, including privilege 
  escalation when a superuser views the affected list. This issue is fixed in 
  version 8.7.0.
