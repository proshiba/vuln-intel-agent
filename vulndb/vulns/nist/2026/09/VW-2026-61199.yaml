title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Zero-init bsg stack buffers to avoid info leak\n\nSeveral bsg handlers
  stage their request/reply in an uninitialized 256-byte\non-stack buffer (uint8_t
  bsg[DMA_POOL_SIZE]) and fill it via\nsg_copy_to_buffer(), which only copies as many
  bytes as the user-supplied\nrequest payload. When the request is shorter than the
  structure, the\nremainder of the buffer is left holding stale stack data.\n\nqla2x00_read_fru_status()
  and qla2x00_read_i2c() then copy the full\nstructure back to the reply payload with
  sg_copy_from_buffer(), leaking the\nuninitialized stack bytes to user space. The
  write/update paths do not copy\nthe buffer back, but can feed uninitialized fields
  to the device.\n\nZero the stack buffer at declaration in all five handlers, mirroring
  the\nheap kzalloc() approach, so short requests can no longer expose stale\nmemory."
