title: uri-js through 4.4.1 contains a denial of service vulnerability in the 
  removeDotSegments function that loops infinitely when a path segment begins 
  with Unicode line or paragraph separators. Attackers can trigger this by 
  calling removeDotSegments directly or through normalize/resolve functions with
  IRI handling enabled, causing the Node.js event loop to block indefinitely 
  until heap exhaustion.
