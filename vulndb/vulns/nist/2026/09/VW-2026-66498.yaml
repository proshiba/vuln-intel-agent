title: The convert.base64-encode, convert.quoted-printable-encode and 
  convert.quoted-printable-decode stream filters accept a line-break-chars 
  option whose length is tracked separately from the string itself. The filter 
  constructors duplicate the value with pestrdup(), which stops at the first NUL
  byte, while keeping the original length. When the filter later emits a line 
  break it copies the recorded length out of the truncated allocation, reading 
  past its end and placing adjacent heap bytes into the filter output.
