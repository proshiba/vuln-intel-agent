title: lamp-cloud through 5.10.0 whitelists the path pattern /*/anno/** for 
  anonymous access, allowing unauthenticated attackers to read the server's full
  JVM system property map. Attackers can send POST requests to 
  /defGenProject/anno/getProperties to retrieve sensitive information including 
  JVM classpath, filesystem paths, operating system details, and startup 
  secrets.
