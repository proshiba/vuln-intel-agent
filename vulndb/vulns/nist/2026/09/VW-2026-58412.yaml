title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  mcp2221: clear rxbuf after I2C/SMBus transfer completes\n\nmcp_i2c_smbus_read()
  stores the caller-supplied buffer pointer in\nmcp->rxbuf for the duration of a transfer
  but never clears it when the\ntransfer finishes or times out. Once the caller frees
  or reuses the\nbuffer, mcp->rxbuf becomes a dangling pointer. A delayed or spurious\n\
  MCP2221_I2C_GET_DATA report can then drive mcp2221_raw_event() to\nmemcpy device
  data into the freed memory, causing a write\nuse-after-free.\n\nRoute all return
  paths through a single exit point that clears\nmcp->rxbuf and mcp->rxbuf_size, so
  that the existing !mcp->rxbuf guard\nin the raw_event handler can reject any report
  arriving after the\ntransfer has ended."
