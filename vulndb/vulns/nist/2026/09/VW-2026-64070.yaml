title: MaxKB is an open-source AI assistant for enterprise. Prior to 2.10.5-lts,
  authenticated workspace members can inject control characters into AWS Bedrock
  access_key_id and secret_access_key fields that _update_aws_credentials writes
  to /root/.aws/credentials without safe parsing. An attacker can append a new 
  AWS profile containing credential_process, then select that profile during a 
  later model-validation request so botocore executes an attacker-controlled 
  command as root. This vulnerability is fixed in 2.10.5-lts.
