title: Horilla is an HR and CRM software. Prior to 2.0.0, 
  HorillaListView.export_data in horilla_views/generic/cbv/views.py accepts an 
  authenticated user's columns POST parameter, takes field_tuple[1], 
  interpolates it into dynamic_fn_str as Python source, and passes the generated
  function definition to exec(). A crafted string that remains valid under 
  ast.literal_eval can inject Python syntax into a default argument evaluated 
  during function definition, allowing arbitrary operating-system commands to 
  execute with the application process privileges, including root privileges in 
  the shipped Docker image. This issue is fixed in version 2.0.0.
