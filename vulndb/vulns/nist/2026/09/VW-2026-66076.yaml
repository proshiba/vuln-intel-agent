title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject non-scalar bpf_loop iteration counts\n\nbpf_loop() declares its nr_loops
  argument as ARG_ANYTHING. Privileged\nprograms may pass pointer values to such arguments,
  so check_func_arg()\nlets a pointer-valued R1 reach the helper-specific checks.\n\
  \nSince commit bb124da69c47 (\"bpf: keep track of max number of bpf_loop\ncallback
  iterations\"), the verifier marks R1 precise and reads its upper\nbound to limit
  callback simulation. Precision backtracking only accepts\nscalar registers, so passing
  a pointer instead triggers the \"backtracking\nmisuse\" verifier warning. Kernels
  with panic_on_warn enabled subsequently\npanic.\n\nIntroduce ARG_SCALAR for helper
  arguments that only accept scalar values\nand use it for bpf_loop() nr_loops. Generic
  helper argument validation then\nrejects pointers before loop inlining and precision
  processing."
