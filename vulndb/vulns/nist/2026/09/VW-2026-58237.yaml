title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Avoid locking internal accesses during unmap\n\niommufd_access_notify_unmap() skips
  internal accesses because they do\nnot have an external unmap callback to invoke.\n\
  \nHowever, the current test calls iommufd_lock_obj() before checking\nwhether the
  access is internal. If iommufd_lock_obj() succeeds, the loop\nthen sees the internal
  access and continues, bypassing the matching\niommufd_put_object() used by the normal
  unmap path. This leaks the\nobject reference taken by iommufd_lock_obj().\n\nCheck
  for internal accesses first so skipped entries are never locked."
