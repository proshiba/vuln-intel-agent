title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sysfs: Fix NULL pointer dereference in device_del()\n\nA NULL pointer dereference
  in klist_put() occurs when a child device (such\nas a BNEP network device in bnep_session)
  is concurrently being\nunregistered while hci_conn_del_sysfs() reparents child devices.\n\
  \nThis is caused by a race condition between hci_conn_del_sysfs() and\nconcurrent
  child device unregistration (e.g. bnep_session calling\nunregister_netdev()). During
  device unregistration, device_del() snapshots\na non-NULL parent pointer. Concurrently,
  hci_conn_del_sysfs() finds the\nchild device using device_find_any_child() and calls
  device_move() to\nreparent it to NULL, which removes the node from its parent's
  klist and\nclears knode_parent. Subsequently, device_del() calls\nklist_del(&dev->p->knode_parent)
  using the stale parent snapshot, causing\nklist_put() to dereference knode_klist(n)->put
  on an already removed node,\nresulting in a NULL pointer dere"
