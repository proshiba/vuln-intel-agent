title: mport is the MidnightBSD Package Manager. Prior to 2.7.8, ping() in 
  libmport/ping.c accepted ICMP replies without validating icmp_id or icmp_seq 
  and parsed the reply using a fixed IP-header offset instead of ip_hl. A 
  network attacker able to inject or spoof visible ICMP replies could influence 
  mirror latency selection, while a malformed packet carrying IP options could 
  shift the ICMP header and trigger an out-of-bounds read. This issue is fixed 
  in version 2.7.8.
