title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  Fix missing lock required to access list of ap_matrix_mdev objects\n\nIn order to
  traverse or add/remove ap_matrix_mdev objects in the\nmatrix_dev->mdev_list, the
  matrix_dev->guests_lock mutex must be held.\nThere are two functions that access
  the list without holding the mutex:\n\nvfio_ap_mdev_probe function\n~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  The vfio_ap_mdev_probe function uses the matrix_dev->mdevs_lock\nmutex to guard
  the add of a newly created ap_matrix_mdev object to the\nmatrix_dev->mdev_list.
  This mutex does not protect list access; its purpose\nis to guard against concurrent
  access to fields contained in an\nap_matrix_mdev object. This could lead to kernel
  memory corruption or\nuse-after-free if another mdev is created or removed concurrently.\n\
  \nThe adding of an ap_matrix_mdev object to matrix_dev->mdev_list\nis now guarded
  by the matrix_dev->guests_lock which is the correct\nway to protect against concurrent
  mdev_l"
