title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/kexec_file:
  Fix null-ptr-def in extra size calculation\n\nA static Sashiko AI review identified
  a potential NULL pointer\ndereference in kexec_extra_fdt_size_ppc64().\n\nOn platforms
  without any reserved memory regions,\nget_reserved_memory_ranges() can return 0
  while leaving 'rmem'\nunallocated as NULL. Passing it directly leads to a kernel
  panic when\nevaluating 'rmem->nr_ranges'.\n\nAdd a NULL check for 'rmem' to prevent
  this crash."
