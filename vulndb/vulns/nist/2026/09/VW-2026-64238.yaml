title: In MISP, the queryEnrichment method in EventsController.php accepted a 
  module name parameter and iterated over the list of enabled modules to find a 
  match. If the specified module was not present in the enabled modules list, 
  the code silently continued processing using default parameters (format set to
  'simplified' and no module-specific configuration applied) rather than 
  rejecting the request. This allowed an authenticated user to trigger 
  enrichment or analysis processing through a module that was not explicitly 
  enabled or available on the instance, bypassing the intended module 
  availability controls. The lack of validation meant that module names outside 
  the enabled set were not rejected, potentially exposing functionality or data 
  processing paths that the administrator had not authorized for use.
