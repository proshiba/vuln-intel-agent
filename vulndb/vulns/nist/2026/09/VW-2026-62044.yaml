title: "Insertion of Sensitive Information into Log File vulnerability in team-alembic
  AshAuthentication allows disclosure of user password digests to readers of the audit
  store.\n\nThe audit_log add-on builds each entry's extra_data in AshAuthentication.AddOn.AuditLog.Auditor.build_extra_data/4,
  which takes :actor from the action callback context verbatim. Any audited action
  invoked with actor: set to a user record therefore deposits that record, including
  its hashed_password attribute, into the audit entry. The same module already collapses
  the audited identity to an opaque string via AshAuthentication.user_to_subject/1
  and filters params against the strategy's configured allow-list, so the actor is
  the only stored value that reaches the audit store unfiltered. Marking the attribute
  sensitive?: true does not help, because that redacts inspect/1 output rather than
  JSON encoding or raw-term storage.\n\nThere is no attacker-controlled trigger and
  no network disclosure path: entries accumulate from "
