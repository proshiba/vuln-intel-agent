title: A security vulnerability has been detected in GNU Binutils 2.47. Impacted
  is the function _bfd_write_merged_section of the file bfd/merge.c of the 
  component Section Merge. The manipulation leads to null pointer dereference. 
  The attack needs to be performed locally. The exploit has been disclosed 
  publicly and may be used. The project was informed of the problem early 
  through a bug report but has not responded yet.
