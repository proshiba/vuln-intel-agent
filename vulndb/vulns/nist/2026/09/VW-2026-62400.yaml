title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  renesas: rcar-gen2: Fix double of_node_put on phy creation failure\n\nfor_each_child_of_node_scoped()
  releases the node reference on scope\nexit, so the explicit of_node_put(np) in the
  devm_phy_create() error\npath drops it twice.\n\nDrop the redundant of_node_put()
  and let the scoped cleanup handle it."
