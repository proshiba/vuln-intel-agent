title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip:
  orphan prefetched skbs before multicast forwarding\n\nIPv4 and IPv6 input preserve
  an skb->sk association installed by\nbpf_sk_assign() so that local delivery can
  use the selected socket under\nRCU. Both address families can also prefetch a socket
  in UDP early demux.\nIn both paths (BPF and UDP early demux) a reference is not
  guaranteed to\nbe held on the socket.\n\nWhen a multicast packet is not locally
  deliverable, IPv6 hands the\noriginal skb to ip6_mr_input(). IPv4's ip_mr_input()
  similarly keeps the\noriginal skb when local delivery is not needed. Either path
  can put the\nskb on an unresolved multicast route queue or forward it after the\n\
  receive-side RCU section ends.\n\nAfter the prefetched socket is destroyed, a later
