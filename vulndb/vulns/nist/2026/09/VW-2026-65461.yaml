title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  validate idmap key payload length\n\nThe cifs.idmap key type stores its payload
  length in key->datalen, which\nis limited to U16_MAX.  Accepting a larger key payload
  truncates the\nrecorded length and can make later users interpret the payload using\n\
  inconsistent bounds.\n\nReject oversized preparsed payloads before allocating or
  copying them.\nThis keeps key->datalen consistent with the stored data for both
  inline\nand separately allocated idmap payloads."
