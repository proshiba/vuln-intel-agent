title: "On the first DTLS ClientHello, the parser copies a device-claimed session_id
  length and validates the\n\n\n\nciphersuite-list length against the total record
  length instead of the remaining bytes. An unauthenticated\n\n\n\npeer drives an
  OOB source read of up to 255 bytes, and those bytes are echoed verbatim into the
  outgoing\n\n\n\nServerHello, disclosing adjacent process memory over the network.
  The crash variant fires on the first\n\n\n\npacket."
