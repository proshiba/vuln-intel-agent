title: The Contact Form to DB by BestWebSoft – Messages Database Plugin For 
  WordPress plugin for WordPress is vulnerable to Stored Cross-Site Scripting 
  via cntctfrm_contact_dropdown Parameter in all versions up to, and including, 
  1.7.5 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. The 
  injected payload executes in the context of an administrator's browser session
  when they visit the plugin's message manager page at 
  /wp-admin/admin.php?page=cntctfrmtdb_manager, making it possible to compromise
  administrator-level sessions via a simple unauthenticated contact form 
  submission.
