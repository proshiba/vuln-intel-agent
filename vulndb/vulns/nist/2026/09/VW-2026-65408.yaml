title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix maximum allowed access checks\n\nThe DACL permission check looks for an ACE
  matching the current user and\nfalls back to the Everyone ACE. It does not consider
  an Authenticated\nUsers ACE, even though an authenticated session is a member of
  that\nwell-known group.\n\nAs a result, opening a file whose access is granted through
  S-1-5-11 can\nincorrectly fail with STATUS_ACCESS_DENIED. Treat an Authenticated
  Users\nACE as a fallback entry alongside Everyone.\n\nThe maximal access calculation
  also combines access masks from every ACE,\nregardless of whether its SID applies
  to the current user. This can grant\nrights belonging to an unrelated principal.
  Process only ACEs applying to\nthe user, Everyone, or Authenticated Users, and accumulate
  allowed and\ndenied masks in ACL order. Preserve explicitly requested access bits
  so\nthey are validated against the resulting maximal mask.\n\nWhen ACCESS_SYSTEM_SECURITY
  is denied, report S"
