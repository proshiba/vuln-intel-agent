title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-async: Unregister sub-device if asc_list is empty\n\nWhen my em28xx USB device
  that uses the i2c tvp5150 driver is\ndisconnected, it crashes.\n\nThe cause is that
  the tvp5150 i2c module uses v4l2_async, but\nthe em28xx driver does not since it
  predates v4l2_async.\n\nIn that corner case sd->asc_list is empty, so\nv4l2_async_unregister_subdev()
  never calls v4l2_device_unregister_subdev().\n\nModify the code so that, if sd->asc_list
  is empty,\nv4l2_device_unregister_subdev() is still called."
