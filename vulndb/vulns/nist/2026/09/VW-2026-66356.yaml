title: A vulnerability was determined in zhistaredu StarTraining up to 3.8.1. 
  This issue affects the function UserLoginService.createToken of the file 
  application.yml of the component JWT Token Handler. This manipulation of the 
  argument user_id/company_id causes use of hard-coded password. The attack is 
  possible to be carried out remotely. The exploit has been publicly disclosed 
  and may be utilized. The vendor was contacted early about this disclosure but 
  did not respond in any way.
