title: A vulnerability was detected in GPAC up to f1219cde. Affected is the 
  function gf_node_unregister of the file scenegraph/base_scenegraph.c of the 
  component MP4Box. Performing a manipulation results in reachable assertion. 
  Attacking locally is a requirement. The exploit is now public and may be used.
  Upgrading to version abi-16.23 is able to address this issue. The patch is 
  named 49dee5cad329cfed310c1682703df7daa47df31a. It is advisable to upgrade the
  affected component. This is not a duplicate of CVE-2021-46237 or 
  CVE-2021-46234.
