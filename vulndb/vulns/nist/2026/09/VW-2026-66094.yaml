title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: cx82310_eth: drop URB after 0xffff reboot sentinel to prevent partial_data
  heap overflow\n\nThe 0xffff length sentinel detects a router reboot and schedules\n\
  re-enabling of ethernet mode, but then falls through to the rest\nof the loop body.\
  \  The next check is\n\n\t} else if (len > CX82310_MTU) {\n\nwhich is the else of
  the just-matched if -- it never fires for\nlen == 0xffff.  The MTU bound that normally
  caps the\nincomplete-packet save path is silently bypassed.\n\nWith 0xffff > skb->len
  always true (rx_urb_size is 4096), the\nincomplete-packet branch saves dev->partial_len
  = skb->len bytes\ninto dev->partial_data.  partial_data is kmalloc(hard_mtu) =\n\
  kmalloc(CX82310_MTU + 2) = 1516 bytes, but skb->len after the\n2-byte header pull
  can be up to 4094.  A device that sends a\n4096-byte URB starting with [0xff 0xff]
  therefore copies 4094\ndevice-provided bytes into a buffer allocated for 1516 bytes,\n\
  exceeding its requested siz"
