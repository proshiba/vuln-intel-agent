title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: fix TX DMA mapping leak for AddBA req frames\n\nmt7996/mt7992 hand
  the firmware a HW MAC-TXP for AddBA req action frames\n(MT_TXD7_MAC_TXD, set in
  mt7996_mac_write_txwi_80211()), but are otherwise\nFW-TXP devices. On tx free mt76_connac_txp_skb_unmap()
  therefore decodes\nthe per-frame txp as a struct mt76_connac_fw_txp. For a MAC-TXP
  the\nfw_txp.nbuf byte aliases the AddBA TID word (MT_TXP1_TID_ADDBA), which is\n\
  always zero, so the unmap loop runs zero times and the skb DMA mapping in\nbuf[1]
  is never unmapped. buf[1].skip_unmap is set unconditionally, so the\ngeneric DMA-ring
  cleanup skips it as well.\n\nEach AddBA req therefore leaks one TX DMA mapping,
  roughly one per\n(re)association. With WED enabled these mappings are bounced through
  the\nWED swiotlb pool, so under continuous client reconnect churn the pool is\n\
  exhausted after ~1-2 days, after which DMA mapping fails for WED, the WiFi\nMCU
  and other on-SoC "
