title: OpenClaw (npm package `openclaw`) versions >= 2026.7.2 and < 2026.9.2 
  contain a race condition in the Discord realtime voice transcript path. 
  Concurrent control-classified voice transcripts could consume speaker context 
  belonging to another participant after an asynchronous control check, causing 
  a transcript to inherit another speaker's owner status. In Discord agent-proxy
  voice sessions using the affected realtime control path, an utterance from a 
  non-owner participant could reach the downstream agent boundary marked as 
  owner, so owner-sensitive behavior is applied to the wrong speaker. 
  Exploitation depends on concurrent transcript timing and on the tools and 
  commands available to the affected agent. The issue is fixed in 2026.9.2; as a
  workaround, disable Discord realtime voice for agents that distinguish owner 
  and non-owner senders.
