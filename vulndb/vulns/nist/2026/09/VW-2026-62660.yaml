title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/resctrl:
  Fix UAF from worker threads when domains are removed\n\nThe mbm_handle_overflow()
  and cqm_handle_limbo() workers read event counters\nand may sleep while doing so.
  They are scheduled via delayed_work embedded in\nstruct rdt_l3_mon_domain. Architecture
  allocates and frees these domains from\nCPU hotplug callbacks under cpus_write_lock(),
  and the workers acquire\ncpus_read_lock() to keep the domain alive across their
  access.\n\nA use-after-free can occur when a worker is blocked waiting for\ncpus_read_lock()
  while the hotplug core holds cpus_write_lock(): the\narchitecture frees the rdt_l3_mon_domain
  that contains the worker's\nwork_struct. When the worker unblocks, the container_of()
  it performs on the\nembedded work pointer dereferences freed memory.\n\nDrop cpus_read_lock()
  from the workers and instead drain pending and in-flight\nwork synchronously before
  the architecture can free the domain.  Since\narchitecture offlin"
