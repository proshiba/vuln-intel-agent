title: Tinyauth is an authentication and authorization server. Prior to 5.1.0, 
  an unauthenticated remote attacker can send POST /api/user/login requests with
  257 distinct nonexistent usernames to fill MaxLoginAttemptRecords and activate
  a global login lockdown. internal/controller/user_controller.go loginHandler 
  passes each attacker-controlled identifier to internal/service/auth_service.go
  RecordLoginAttempt, which invokes lockdownMode after the map reaches its cap. 
  IsAccountLocked checks that global state before validating unrelated accounts,
  causing valid users to receive HTTP 429 until auth.loginTimeout expires, 
  approximately 300 seconds by default. The attack can be repeated, but existing
  authenticated sessions are not invalidated. This issue is fixed in version 
  5.1.0.
