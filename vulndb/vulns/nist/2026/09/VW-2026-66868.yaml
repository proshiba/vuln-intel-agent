title: Contrast, Edgeless Systems' runtime for confidential containers on 
  Kubernetes, is affected in versions up to and including 1.9.0. The VOLUME 
  directive in a Dockerfile (config.volumes in the OCI image configuration) is 
  only a hint and is not handled specially by Kubernetes, but containerd adds a 
  mount point for it when Kubernetes sets none, requiring the runtime to be able
  to push arbitrary data to the Kata agent. As a result, on bare-metal Contrast 
  deployments (AKS deployments are not affected) that run an image declaring at 
  least one VOLUME for which no Kubernetes mount exists at that path, the 
  untrusted host can write arbitrary file trees below that mount point inside 
  the confidential container, compromising the integrity of a directory that is 
  typically important to the application's core functionality. Version 1.9.1 
  fixes the issue by disallowing this configuration in `contrast generate`.
