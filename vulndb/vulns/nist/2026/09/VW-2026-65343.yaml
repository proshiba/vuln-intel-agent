title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/madvise:
  skip device-private PMDs in cold and pageout walks\n\nmadvise_cold_or_pageout_pte_range()
  takes pmd_trans_huge_lock(), whose\npmd_is_huge() check returns true for a device-private
  PMD.  The subsequent\n!pmd_present() branch has a VM_BUG_ON() asserting migration
  is the only\nallowed non-present case; a device-private PMD trips it.\n\nSkip device-private
  PMDs in that non-present branch and continue to\nhuge_unlock before calling pmd_folio().\
  \  Downgrade the check to\nVM_WARN_ON_ONCE() so an unexpected PMD softleaf logs
  a warning rather than\npanicking.  Drop the thp_migration_supported() guard: it
  expands to\nIS_ENABLED(CONFIG_ARCH_SUPPORTS_PMD_SOFTLEAF), and both\npmd_is_migration_entry()
  and pmd_is_device_private_entry() already return\nfalse when that config is not
  selected, so the guard suppresses only the\ncase where the warning would already
  be silent.\n\nPotential trigger: an HMM-based GPU driver races with\nmadvise(MA"
