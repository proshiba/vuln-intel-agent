title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Check ancestor frames for rbtree callbacks\n\nbpf_rbtree_add() invokes its comparator
  while the caller holds the root\nlock. The native insertion code retains raw parent
  and link pointers across\nthe callback, so the verifier prohibits unlocking, consuming
  tree nodes,\nor changing RCU state from that callback.\n\nin_rbtree_lock_required_cb()
  only checks the innermost verifier frame.\nStatic subprogram calls are permitted
  while holding a spin lock, and such a\ncall pushes a frame without in_callback_fn
  set. Consequently, all callback\nrestrictions disappear in the nested frame. The
  subprogram can unlock the\ntree, remove and drop the node being compared, then relock.
  Native insertion\nresumes with the stale parent pointer and links freed memory into
  the tree.\n\nWalk all active frames for the rbtree callback instead. Benign static\n\
  subprograms remain permitted, while callback restrictions follow execution\ninto
  nested frames."
