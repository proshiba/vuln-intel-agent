title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRevert
  \"media: v4l2-dev: fix error handling in __video_register_device()\"\n\nThis reverts
  commit 2a934fdb01db6458288fc9386d3d8ceba6dd551a.\n\nThe intentions of that patch
  were good, but it doesn't work.\n\nThe idea is that if device_register fails, you
  have to do a put_device\nto let the ref counter release resources.\n\nHowever, the
  V4L2 API says that if video_register_device() fails, then\nyou have to call video_device_release(),
  which kfree()s the video_device\nstruct.\n\nBut the put_device() will already have
  freed the struct, so you end\nup in a double-free scenario.\n\nThere is not really
  a good way of fixing this without breaking\nvideo_register_device() into two parts,
  one that initializes everything,\nand one that does the actual device_register,
  and then converting all\nV4L2 drivers to this new model.\n\nThat is a massive job,
  and it is very unlikely that device_register\nwill fail.\n\nSo rather than ending
  up in a double-free scen"
