title: A vulnerability was identified in huanzi-qch base-admin up to 
  52816b760cd53244989fd664bbb2b3d4edbfdbf1. This issue affects the function Save
  of the file 
  base-admin-master\src\main\java\cn\huanzi\qch\baseadmin\common\controller\CommonController.java
  of the component Add User Handler. The manipulation of the argument Username 
  leads to cross site scripting. The attack can be initiated remotely. The 
  exploit is publicly available and might be used. Continious delivery with 
  rolling releases is used by this product. Therefore, no version details of 
  affected nor updated releases are available. The vendor was contacted early 
  about this disclosure but did not respond in any way.
