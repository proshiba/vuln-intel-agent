title: A vulnerability was found in Linksys RE6500, RE6250, RE6300, RE6350, 
  RE7000 and RE9000 1.0.013.001/1.0.04.001/1.0.04.002/1.1.05.003/1.2.07.001. 
  Affected by this vulnerability is the function 
  AP_get_wireless_clientlist_setClientsName of the file mod_form.so. Performing 
  manipulation of the argument clientsname_0 results in stack-based buffer 
  overflow. The attack can be initiated remotely. The exploit has been made 
  public and could be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
