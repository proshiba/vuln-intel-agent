title: A Server-Side Request Forgery vulnerability exists in sat_proxy.php in 
  Zenith Satellite Tracker 1.0. The script accepts an attacker-controlled 
  address URL parameter and passes it to curl_setopt(CURLOPT_URL) without host 
  or scheme validation. An unauthenticated remote attacker can leverage this to 
  make arbitrary HTTP and HTTPS requests from the server to internal networks or
  cloud metadata services, potentially obtaining sensitive information or 
  pivoting to further attacks.
