title: "In the Linux kernel, the following vulnerability has been resolved:\n\nesp:
  do not unref managed frag pages in esp_ssg_unref()\n\nesp_ssg_unref() releases the
  page references held on the source\nscatterlist after the AEAD operation completes.\
  \  It calls\nskb_page_unref() on every frag page for an out-of-place transform\n\
  (req->src != req->dst), and in the error path of esp_output_tail()\n(already_unref
  == true) on the request's own scatterlist.\n\nThis is wrong when the skb carries
  managed frags\n(SKBFL_MANAGED_FRAG_REFS).  Managed frags are owned by a zerocopy
  ubuf\nand the skb does not hold a per-frag page reference; io_uring SEND_ZC\nwith
  a registered buffer attaches the bvec pages this way via\nio_sg_from_iter().  The
  rest of the stack honours this invariant:\nskb_release_data() skips the per-frag
  unref when SKBFL_MANAGED_FRAG_REFS\nis set, and skb_zcopy_managed() is the guard
  used at the other unref\nsites.\n\nesp_ssg_unref() is missing that guard, so for
  a managed-frag skb it\ndrops a page reference t"
