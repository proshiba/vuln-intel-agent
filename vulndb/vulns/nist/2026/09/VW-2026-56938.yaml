title: The Mail Mint – Email Marketing, Newsletter, Email Automation & 
  WooCommerce Emails plugin for WordPress is vulnerable to SQL Injection via the
  'status' parameter in all versions up to, and including, 1.31.0 due to 
  insufficient escaping on the user supplied parameter and lack of sufficient 
  preparation on the existing SQL query. The $wpdb->prepare() call does not 
  protect against this injection because the attacker-controlled 
  $contact_filter_query fragment is concatenated into the SQL format string 
  before prepare() executes — prepare() only processes %s/%d placeholders and 
  cannot sanitize content already embedded in the format string. REST API JSON 
