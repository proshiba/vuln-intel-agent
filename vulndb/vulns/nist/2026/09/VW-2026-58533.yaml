title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  nsm: bound the device-reported response length\n\nnsm_sendrecv_msg_locked() stores
  the virtqueue used-ring length reported\nby the NSM device into msg->resp.len without
  bounding it to the response\nbuffer. A malicious or buggy backend can report a length
  larger than the\nresponse buffer; parse_resp_raw() then copies that many bytes out
  of the\nfixed buffer to user space, disclosing adjacent kernel heap (an\nout-of-bounds
  read). The request path already floors its length in\nfill_req_raw(); the response
  path lacks the symmetric check.\n\nClamp the stored length to the size of the response
  buffer. Well-behaved\ndevices report no more than the posted buffer size, so conforming
  traffic\nis unaffected."
