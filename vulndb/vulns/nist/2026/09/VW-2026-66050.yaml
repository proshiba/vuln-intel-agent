title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/debug:
  Fix NULL pointer dereference in debug_set_level()\n\nCommit a2cec6863709 (\"s390/debug:
  Add s390dbf kernel parameter\")\nincorrectly removed a null-id check from debug_set_level(),
  introducing\na possible NULL pointer dereference for debug-API users that put\n\
  debug_register() results unchecked into debug_set_level().\n\nFix this by moving
  the check from the internal _debug_set_level()\nvariant back to the external debug_set_level()
  wrapper."
