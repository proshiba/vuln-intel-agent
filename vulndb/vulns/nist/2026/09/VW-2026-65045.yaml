title: A one-byte out-of-bounds heap read flaw was found in GIMP's uncompressed 
  DDS image loader. When a user opens an uncompressed DDS image, the file-dds 
  plug-in performs an unconditional one-byte look-ahead after processing the 
  final pixel. This may cause the plug-in to crash if the byte immediately 
  following the pixel buffer is inaccessible; no information disclosure or code 
  execution has been demonstrated.
