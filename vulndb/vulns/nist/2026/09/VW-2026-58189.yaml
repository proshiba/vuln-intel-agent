title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNTB:
  ntb_transport: Fail TX enqueue when the QP link is down\n\nCommit f195a1a6fe41 (\"\
  ntb: Drop packets when qp link is down\") meant to\nmake ntb_transport_tx_enqueue()
  drop packets submitted while the QP link\nis down, but it only returns 0 without
  consuming the packet. Zero means\nsuccess by this function's contract, so ntb_netdev
  reports NETDEV_TX_OK\nand forgets the skb: nothing queued it, nothing frees it,
  and it leaks,\none skb for every transmit racing a link-down.\n\nReturn -ENOLINK
  instead, restoring the contract that a non-zero return\nleaves the buffer owned
  by the caller. With the preceding patch,\nntb_netdev frees the skb on non-retryable
  enqueue failures and returns\nNETDEV_TX_OK, so a packet racing with link-down is
  dropped without leaking\nor entering a busy retry loop."
