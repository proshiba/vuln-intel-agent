title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a stored cross-site scripting vulnerability in the LoginControl 
  plugin that fails to encode the User-Agent header before storing it in login 
  history. Attackers with any valid login account can inject malicious scripts 
  in the User-Agent header that execute in administrator browsers when viewing 
  the Login History page, allowing script execution within the administrator 
  session.
