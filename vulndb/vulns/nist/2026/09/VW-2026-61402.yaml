title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/page_alloc:
  don't spin_trylock() in NMI on UP\n\nPatch series \"mm/page_alloc: fixes for free_pages_nolock()
  on RT/UP\".\n\nPre-existing bugs found by Sashiko during review of this other series:\n\
  https://lore.kernel.org/all/20260703-alloc-trylock-v5-0-c87b714e19d3@google.com/\n\
  \nI have not reproduced these bugs, and I suspect there is no real-world\nuser that
  is affected by them.\n\n\nThis patch (of 2):\n\nAs noted in can_spin_trylock(),
  using this is unsafe in this context. \ncommit 620b46ed6ae17 (\"mm/page_alloc: return
  NULL early from\nalloc_frozen_pages_nolock() in NMI on UP\") fixed this on the alloc
  side\nbut missed the free side.\n\nImpact: If BPF programs using these features
  in NMI (probably tracing) are\npresent on non-SMP builds this might crash the kernel
  and is probably\nexploitable by local attackers for privilege escalation."
