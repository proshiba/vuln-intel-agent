title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  ptrace: Keep 'orig_x0' in-sync with x0 on syscall entry\n\nCommit e057b9477232 (\"\
  arm64: syscall: Ensure saved x0 is kept in-sync\nwith tracer updates\") attempted
  to resolve a long-standing issue with\nsyscall entry tracing, where a tracer is
  able to manipulate the first\nsyscall argument without being subjected to seccomp
  or audit checking.\n\nUnfortunately, that fix was incomplete [1], as it failed to
  update\n'orig_x0' between a tracer updating x0 during a seccomp ptrace exit\n(SECCOMP_RET_TRACE)
  and the seccomp filter being re-evaluated.\n\nRather than add hooks to the core
  seccomp code, instead move the\nsynchronisation code into the ptrace GPR and syscall
  setting code so\nthat 'orig_x0' is kept up to date with x0 whenever we're stopped
  on the\nsyscall entry path."
