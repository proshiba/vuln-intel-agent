title: 'A vulnerability was determined in FLVMeta up to 1.2.2. Affected by this vulnerability
  is the function amf_object_get of the file src/amf.c of the component AMF Object
  Parsing. This manipulation causes null pointer dereference. The attack may be initiated
  remotely. The exploit has been publicly disclosed and may be utilized. Patch name:
  52642f7dfb76ec7334016622dde60b1ae963d79b. To fix this issue, it is recommended to
  deploy a patch. The project maintainer doubts the security impact: "While I acknowledged
  the bugs and provided fixes, I have yet to see any way to exploit these alleged
  vulnerabilities."'
