title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix use-after-free on mm_struct in bpf_find_vma()\n\nbpf_find_vma() reads task->mm
  and calls mmap_read_trylock(mm) without\nholding a reference on the mm. On a foreign
  task, a concurrent exit_mm()\ncan free the mm_struct between the lockless read and
  the trylock,\nresulting in a use-after-free. mm_struct is not SLAB_TYPESAFE_BY_RCU.\n\
  \nFor the current task, task->mm is stable. For a foreign task, pin the mm\nunder
  task->alloc_lock and release it with mmput_async(), mirroring commit\nd8e27d2d22b6
  (\"bpf: fix mm lifecycle in open-coded task_vma iterator\").\nUse spin_trylock()
  instead of get_task_mm() so BPF context does not block\non alloc_lock. Reject irqs-disabled
  contexts and !CONFIG_MMU on the\nforeign-task path because dropping the mm reference
  is not safe there.\n\nRace:\n\n  CPU0 (BPF program)                  CPU1 (exiting
  task)\n  ============================        ==========================\n  bpf_find_vma(foreign_task):\n\
  \ "
