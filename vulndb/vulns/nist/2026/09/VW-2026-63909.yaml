title: GoCD is a continuous deliver server. From 16.1.0 until 26.1.0, the 
  internal material connection test APIs at /go/api/admin/internal/material_test
  and /go/api/internal/config_repos/*/material_test accept an arbitrary existing
  pipeline and pipeline-group context without sufficient validation. A pipeline 
  group administrator can invoke Test Connection for source control materials 
  outside the administrator's authorized pipeline group or configuration 
  repository and potentially use credentials from those materials. For GoCD 
  20.6.0 and later, the test context can also resolve external secrets managed 
  by secret-management plugins, including global reusable secrets with separate 
  permissions. This issue is fixed in version 26.1.0.
