title: MOOS ui-moos through 50b9c6c contains a buffer overflow vulnerability in 
  ScopeTabPane.cpp and ScopeGrid.cpp where client and variable names are 
  formatted into fixed 1024-byte buffers using sprintf without length 
  validation. Attackers can supply arbitrarily long MOOS identifiers that 
  overflow the buffers when an operator selects process list entries or pokes 
  variables, enabling code execution.
