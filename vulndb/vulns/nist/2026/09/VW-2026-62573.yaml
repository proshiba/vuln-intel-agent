title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  drain in-flight DIO before buffered write fallback\n\ngeneric/746 started failing
  intermittently on ext3 (no-extent inodes).\nThe test triggers 'Page cache invalidation
  failure on direct I/O'\nwarnings and subsequent fsync returns -EIO. Adding a 50ms
  delay\nbetween ext4_buffered_write_iter() and filemap_write_and_wait_range()\nin
  ext4_dio_write_iter() makes the race almost always reproducible.\n\nOn no-extent
  inodes, DIO writes to holes cannot use unwritten extents,\nso ext4_iomap_alloc()
  leaves m_flags=0 and ext4_map_blocks() returns 0.\nThe iomap layer then returns
  -ENOTBLK, causing fallback to buffered I/O.\n\nThe fallback path in ext4_dio_write_iter()
  calls\next4_buffered_write_iter() which dirties pages, then does flush and\ninvalidate.
  However, there's an unprotected window between\next4_buffered_write_iter() returning
  (with inode lock released) and\nthe subsequent flush+invalidate.\n\nConcurrent async
