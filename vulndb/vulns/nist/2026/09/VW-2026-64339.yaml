title: Netdata is an open source observability tool. Prior to 2.10.4, an 
  authenticated child agent can send an oversized DIMENSION SLOT value that 
  str2ull_encoded passes to pluginsd_rrddim_put_to_slot in 
  src/plugins.d/pluginsd_internals.h without an upper bound. prd_array_create in
  src/database/rrdset-pluginsd-array.h can then wrap the size_t allocation 
  calculation while retaining the original large array size, causing the 
  subsequent initialization loop to write beyond the undersized heap allocation 
  and crash the parent agent. This issue is fixed in version 2.10.4 and nightly 
  build 2.10.0-782-nightly.
