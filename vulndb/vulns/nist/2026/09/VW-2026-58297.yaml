title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/ucma:
  Lock the handler in ucma_write_cm_event()\n\nctx->file may only be changed under
  the handler lock and the xa_lock, which\nis what stops uevents being queued for
  a ctx while ucma_migrate_id() moves\nit to another file.  The CM core takes that
  lock before invoking\nucma_event_handler(), but the write() paths that queue uevents
  themselves\ndo not.\n\nucma_write_cm_event() re-reads ctx->file for each of its
  four dereferences,\nso ucma_migrate_id() can swap it mid-sequence:\n\n\tmutex_lock(&ctx->file->mut);\t
  \t\t/* file A */\n\tlist_add_tail(&uevent->list, &ctx->file->event_list);\t/* file
  B */\n\tmutex_unlock(&ctx->file->mut);\t\t\t/* file B */\n\twake_up_interruptible(&ctx->file->poll_wait);\t
  /* file B */\n\nThe window is the mutex_lock() itself: the writer sleeps in it while
  the\nmigration reassigns ctx->file.  The list_add_tail() then runs on file B's\n\
  event_list holding only file A's mutex:\n\n  list_add corruption. prev->next should
  be n"
