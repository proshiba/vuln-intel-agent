title: Improper input validation in the Vega expression function implementation 
  in OpenSearch Dashboards allows a remote authenticated actor with dashboard 
  write permissions to execute arbitrary JavaScript in the context of other 
  users' browser sessions by saving a crafted Vega visualization. The 
  checkForFunctionProperty validation routine failed to recurse into arrays of 
  objects, allowing a function property nested inside an array to bypass 
  validation.
