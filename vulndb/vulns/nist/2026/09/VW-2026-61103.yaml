title: "Ash field_policies are documented to protect against filter-based information
  disclosure: when a field the actor may not see is referenced in a filter, it is
  replaced with an expression that evaluates to nil, so a filter cannot be used as
  a yes/no oracle to read a value the actor cannot see.\n\nThis nilling was applied
  to attributes but not to calculations or aggregates. A user-supplied filter reference
  to a calculation or aggregate carries an Ash.Query.Calculation / Ash.Query.Aggregate
  struct, which the authorizer's reference replacement did not match (it only matched
  the Ash.Resource.* structs), so the filter ran against the real value.\n\nAs a result,
  an actor whose field policies forbid a calculation or aggregate can still filter
  by it (for example filter(secret_calc == \"x\") or filter(comment_count == n)) and
  learn the value from whether rows match — an oracle that recovers field-policy-protected
  values one probe at a time. Filtering is commonly exposed to lower-privileged actors
