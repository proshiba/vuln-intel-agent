  chips-media: wave5: Add timeout while stop_streaming\n\nWhen stop_streaming is called,
  an infinite loop may occur in some cases.\nAdd a bounded poll of the queue status:
  loop until the queues drain,\nsleeping briefly between polls, and bail out once
  VPU_DEC_STOP_TIMEOUT\nelapses."
