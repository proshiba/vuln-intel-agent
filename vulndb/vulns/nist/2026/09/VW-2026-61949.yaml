title: 'A flaw was found in flatpak-builder where Git hooks are not disabled when
  applying patch sources with use-git-am: true. An attacker who can provide a malicious
  source containing a Git post-applypatch hook can cause the hook to execute on the
  host during the build process, resulting in arbitrary code execution with the privileges
  of the user running flatpak-builder.'
