title: Net-SNMP through 5.9.5.2 contains a denial of service vulnerability in 
  the SMUX module where smux_accept() performs an unauthenticated blocking read 
  without timeout on newly accepted connections. An unauthenticated remote 
  client can connect to the SMUX listener and send no data, causing the 
  single-threaded snmpd main loop to block indefinitely and suspend all SNMP 
  processing.
