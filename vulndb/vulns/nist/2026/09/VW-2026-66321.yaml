title: RabbitMQ is a messaging and streaming broker. From 3.13.0 until 3.13.15 
  and 4.0.20 and 4.1.11 and 4.2.6, Atom table exhaustion via management API node
  field. pUT /api/queues/:vhost/:name (and the exchanges and bindings endpoints)
  accepts a node JSON field. The value goes through rabbitnodes:make → 
  listtoatom with no cluster membership check first. Each unique value 
  permanently leaks one atom. A March 2026 refactoring (ea61ce2563) introduced 
  safe helpers in rabbitmgmtnodes.erl (parsenodename, safeatom, and 
  requirenodename, using binarytoexistingatom) and fixed several callers (QQ 
  replica ops, wmauthattempts, wmnodememoryets, getsortreverse, and 
  rabbitfederationmgmt), but getnode/1 in rabbitmgmtutil.erl:880-885, the 
  primary vector used by directrequest/6, was not Roughly 900K requests crash 
  the VM via systemlimit, and all tenants lose Any user with the management tag 
  and one vhost, the lowest privilege This issue is fixed in versions 3.13.15 
  and 4.0.20 and 4.1.11 and 4.2.6.
