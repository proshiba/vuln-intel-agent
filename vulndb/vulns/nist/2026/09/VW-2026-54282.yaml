title: undici's dump interceptor reads and discards a response body up to a 
  configurable maximum size. When a response declares a Content-Length that 
  exceeds the maximum, the interceptor aborts cleanly, but when a response has 
  no Content-Length and is chunked, the interceptor instead signals completion 
  early once the accumulated size reaches the maximum, without pausing or 
  aborting the request. Because the underlying parser keeps delivering body 
  bytes, a second completion signal fires and trips an internal assertion, which
  aborts the request and tears down the connection. The application is left 
  observing a misleading successful status with an empty or truncated body while
  the connection has actually been disconnected. This affects undici versions 
  from 7.1.0 up to 7.29.1 and from 8.0.0 up to 8.10.2. Users should upgrade to 
  undici 7.29.1 or 8.10.2.
