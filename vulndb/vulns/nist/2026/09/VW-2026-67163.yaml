title: Improper Neutralization of Input During Web Page Generation ('Cross-site 
  Scripting') in Apache Roller 6.1.5 allows a user with authoring rights on a 
  weblog to store crafted content that is later written into the authoring UI's 
  JavaScript string literals and markup sinks without proper encoding, causing 
  the stored script to execute in another author's or administrator's browser. 
  No optional feature or non-default configuration is required; this affects 
  weblogs with multiple authors or administrators who are not mutually trusted. 
  Users are recommended to upgrade to Apache Roller 6.1.6 or later, which moves 
  those values out of JavaScript literals and writes them as text.
