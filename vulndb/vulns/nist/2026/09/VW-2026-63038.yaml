title: The LatePoint – Calendar Booking Plugin for Appointments and Events 
  plugin for WordPress is vulnerable to Insecure Direct Object Reference in all 
  versions up to, and including, 5.6.3 via the 
  LatePointAbilityDeleteBooking::execute due to missing validation on a user 
  controlled key. This makes it possible for attackers, with  LatePoint 
  Agent-level access and above, to read bookings and customer PII (full name, 
  email, phone, and notes) assigned to other LatePoint agents, and delete 
  arbitrary bookings by supplying any booking ID. This vulnerability is only 
  exploitable when an administrator has enabled the Abilities API toggles 
  (latepoint_abilities_api, latepoint_abilities_api_delete, and/or 
  latepoint_abilities_api_edit) in the plugin settings.
