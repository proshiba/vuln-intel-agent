title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix cpntf publish race in nfs4_init_cp_state\n\nnfs4_alloc_init_cpntf_state() published
  the new cpntf entry into the\ns2s_cp_stateids IDR (with cs_type set) in one s2s_cp_lock
  section, then\ntook the lock again to list_add() it onto p_stid->sc_cp_list. In
  the gap\nthe entry is reachable by so_id but cp_list is still {NULL,NULL} from\n\
  kzalloc. A racing OFFLOAD_CANCEL (so_id is echoed to the client as\ncnr_stateid,
  so any NFSv4.2 client can drive it) reaches\nmanage_cpntf_state() -> _free_cpntf_state_locked()
  and does list_del() on\nthe zeroed list_head, oopsing the server.\n\nFold the cs_type
  assignment and the list_add() into the same critical\nsection as idr_alloc_cyclic(),
  so a concurrent lookup either misses the\nentry or sees a fully linked cp_list.
  INIT_LIST_HEAD() the entry after\nallocation and switch _free_cpntf_state_locked()
  to list_del_init() so a\nstale unlink is a no-op. nfs4_init_copy_state() passes
  NULL p_stid a"
