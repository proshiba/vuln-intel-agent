title: "Joomla Extension - regularlabs.com - LFI / SSRF in Modules Anywhere 1.5.0
  - 9.0.5 for Joomla - Modules Anywhere Pro lets additional attributes on a module
  tag replace arbitrary parameters of the selected module. This feature is enabled
  by default in affected versions. The overrides are applied without checking who
  authored the content containing the tag. The security effect depends on how the
  selected module consumes the replaced parameter. Joomla's core Feed module provides
  a concrete affected path: its rssurl parameter is opened by the server and accepts
  local file: URLs as well as network URLs."
