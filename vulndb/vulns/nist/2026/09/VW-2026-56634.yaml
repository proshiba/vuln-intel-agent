title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the public OIDC login and callback endpoints completed 
  authentication even when OIDC was not the enabled active authentication 
  method. An Enterprise administrator who had configured and later disabled an 
  identity provider still exposed a working route that could issue valid 
  sessions. The affected logic is 
  packages/cli/src/modules/sso-oidc/oidc.service.ee.ts, including 
  generateLoginUrl and the callback flow that lacked assertOidcLoginEnabled. 
  This issue is fixed in versions 1.123.76, 2.37.7 and 2.38.2.
