title: OpenBMC's IPMI implementation, phosphor-net-ipmid, is vulnerable to a 
  logic flaw where the authorization context of an existing session can be 
  replaced with a target account while still maintaining the original integrity 
  and encryption keys. Several downstream vendors implement phosphor-net-ipmid 
  as their IPMI stack, such as NVIDIA and H3C. This issue effectively allows for
  privilege escalation without re-authentication.
