title: OpenAI Codex CLI for Windows, macOS, and Linux and Codex Desktop for 
  Windows and macOS automatically collected Git repository metadata without 
  disabling the repository-local core.fsmonitor setting. If a user opens or uses
  an attacker-prepared repository whose preserved .git/config sets 
  core.fsmonitor to an attacker-controlled filesystem-monitor helper, Git can 
  execute that helper while Codex collects repository metadata. The helper runs 
  outside Codex's command sandbox and without a user-approval prompt, allowing 
  attacker-controlled code to run with the user's privileges. The code can read,
  change, or delete the user's files and access other resources available to the
  user's account. An ordinary Git clone does not preserve the source 
  repository's local .git/config; exploitation requires a repository delivered 
  or copied with that configuration intact.
