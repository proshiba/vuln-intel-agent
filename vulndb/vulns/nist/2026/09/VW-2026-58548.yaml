title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mempolicy:
  skip non-present PMDs when queueing folios\n\nPatch series \"mm: handle device-private
  PMDs in walk callbacks\", v3.\n\nSince commit 368076f52ebe (\"mm/huge_memory: add
  device-private THP support\nto PMD operations\") a PMD may hold a device-private
  swap entry whenever an\nHMM-based GPU driver migrates an anonymous THP folio to
  device memory via\nmigrate_vma_pages().\n\npmd_trans_huge_lock() succeeds for such
  PMDs (pmd_is_huge() returns true\nfor any non-present, non-none huge PMD), so several
  MM walk callbacks that\nused to assume present THP or migration entry are now reachable
  with a\ndevice-private PMD.  The results range from a VM_BUG_ON() firing on debug\n\
  kernels, to an oops on a bogus vmemmap dereference, to silently isolating\nan unrelated
  live folio from LRU in the aliasing case.\n\n\nThis patch (of 3):\n\nqueue_folios_pmd()
