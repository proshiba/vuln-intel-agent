title: A flaw was found in cockpit-files. This vulnerability allows a local 
  attacker to exploit a timing issue, known as a symlink race condition, during 
  privileged file operations such as changing file ownership or permissions. By 
  manipulating directory entries and winning this race, the attacker can 
  redirect these operations to unintended files. This could lead to unauthorized
  changes in file ownership and permissions on arbitrary files, potentially 
  compromising system integrity and availability by altering system or 
  application states or rendering services unusable.
