title: vikunja versions before 2.6.0 contain a resource exhaustion vulnerability
  in the task-filter endpoint that accepts deeply nested filter expressions 
  without recursion depth limits. Authenticated attackers can supply thousands 
  of nested parentheses in the filter query parameter to exhaust memory and 
  terminate the API process.
