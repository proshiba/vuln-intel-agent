title: The nsenter --join-cgroup option opens the target cgroup.procs file as 
  root and leaves that file descriptor open across later namespace and 
  credential changes and across execve(). Because the kernel checks later cgroup
  migrations using the credentials from the original open, a program run in an 
  attacker-controlled target can inherit root's ability to move host processes 
  between cgroups. After a privileged operator uses --join-cgroup against that 
  target, an unprivileged user can migrate and terminate unrelated root 
  processes.
