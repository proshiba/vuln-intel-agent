title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmshv:
  Order pt_vp_array publish against irqfd assertion path\n\nmshv_partition_ioctl_create_vp()
  initialises a VP struct (allocations,\nmutex_init, init_waitqueue_head, page mappings)
  and then publishes the\npointer into partition->pt_vp_array.  Several ISR paths
  read this array\nlocklessly: the intercept ISR, the two scheduler ISRs, and\nmshv_try_assert_irq_fast()
  on the irqfd fast path.\n\nOf these, only mshv_try_assert_irq_fast() can structurally
  race the\npublish.  It runs from an eventfd waker without holding pt_mutex, and\n\
  MSHV_IRQFD does not require the target lapic_apic_id (== vp_index) to\nrefer to
  an existing VP at registration time.  A user can therefore\nregister an irqfd targeting
  a yet-to-be-created VP, then trigger\nmshv_try_assert_irq_fast() concurrently with
  MSHV_CREATE_VP for the\nsame index.  On weakly-ordered architectures the reader
  can observe a\nnon-NULL pointer in pt_vp_array before the initialising stores to"
