title: RabbitMQ amqp091-go is a Go AMQP 0.9.1 client. Prior to 1.13.0, readField
  in read.go reads the length of an AMQP byte-array field with type tag x into a
  signed int32 and passes the value directly to make when allocating the field 
  buffer. A malicious or compromised broker can encode a value such as 
  0xFFFFFFFF, which becomes -1 and causes a len out of range runtime panic. The 
  panic escapes the network reader goroutine and terminates the client process, 
  including during connection.start server properties or message header table 
  parsing. This issue is fixed in version 1.13.0.
