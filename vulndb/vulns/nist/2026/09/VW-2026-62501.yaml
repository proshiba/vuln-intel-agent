title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd:
  scope memalloc_noio to allocation critical sections\n\nStoring a memalloc_noio_save()
  token in mddev->noio_flags lets one task\nsave the token and another task restore
  it. With concurrent suspend sysfs\nwrites, task A can enter PF_MEMALLOC_NOIO, return
  to userspace still in\nthat scope, and later task B can restore A's saved token.\n\
  \nAvoid tying the token lifetime to mddev. Keep mddev_suspend() and\nmddev_resume()
  only responsible for array suspension, and enter\nPF_MEMALLOC_NOIO only in the MD
  paths that allocate memory after the array\nhas been suspended. Restore the token
  before resuming the array.\n\nA reproducer repeatedly writes suspend_lo and suspend_hi
  from concurrent\nworkers and checks each worker's /proc/self/stat flags before and
  after the\nsysfs write."
