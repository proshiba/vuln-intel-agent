title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  fix invalidate lock leak on open O_TRUNC DAX failure\n\nfuse_open() takes filemap_invalidate_lock()
  for a DAX truncate\n(dax_truncate = true) and releases it before the out_inode_unlock\n\
  label.  But when fuse_dax_break_layouts() fails, the goto\nout_inode_unlock skips
  the unlock and leaks the rwsem, so any later\nfault or truncate on the file stalls
  on the stale lock.\n\nfuse_dax_break_layouts() can fail with -ERESTARTSYS when a
  signal\ninterrupts the wait for busy DAX pages to drain:\n\n  open(\"file\", O_RDWR
  | O_TRUNC)\n  └─ fuse_open()\n     ├─ filemap_invalidate_lock()        # dax_truncate\n\
  \     └─ fuse_dax_break_layouts()\n        └─ dax_break_layout()\n           └─
  wait_page_idle()           # TASK_INTERRUPTIBLE\n              └─ fuse_wait_dax_page()\
  \    # unlock, schedule, re-lock\n                 └─ signal → -ERESTARTSYS\n  \
  \   goto out_inode_unlock               # <- lock leaked\n\nFix this by moving filemap_invalidate_unlo"
