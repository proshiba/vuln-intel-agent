title: Missing Authorization in the askpass escape code handler in kitty from 
  0.25.0 before 0.49.0 allows a local user other than the one running the 
  terminal to obtain the text typed into a prompt that kitty itself displays, 
  because handle_remote_askpass() in kitty/window.py opens the POSIX shared 
  memory object named in the escape code, parses a prompt definition out of it, 
  and writes the user's answer back into an object of that same name, without at
  any point checking that the object is owned by the user running kitty or that 
  its permissions exclude other users. The equivalent consumer of the same 
  SharedMemory class in the ssh kitten performs exactly that check; the askpass 
  path did not. The handler is reached through a device control string processed
  from the byte stream of the window, so the attacker must also cause bytes of 
