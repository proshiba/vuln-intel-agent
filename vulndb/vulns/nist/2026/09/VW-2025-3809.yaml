title: 'A vulnerability was found in Portabilis i-Educar up to 2.10. This issue affects
  some unknown processing of the file /matricula/[ID_STUDENT]/enturmar/. Performing
  a manipulation results in improper access controls. It is possible to initiate the
  attack remotely. The exploit has been made public and could be used. Upgrading to
  version 2.11.0 is capable of addressing this issue. It is suggested to upgrade the
  affected component. The vendor confirms: "The reported attack vector was tested
  against the corrected code, and the previously described improper access control
  behavior could no longer be reproduced."'
