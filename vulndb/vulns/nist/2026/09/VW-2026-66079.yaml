title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  drr: clamp quantum in change class\n\ndrr_change_class() rejects explicit quantum==0
  but falls back to\npsched_mtu() with no floor. With a crafted size table qdisc_pkt_len\n\
  reaches ~2 GiB, so quantum=1 (or a zero psched_mtu on a headerless\ndevice) makes
  the deficit-refill loop spin under the qdisc lock.\n\nAdd clamp_t(u32, quantum,
  256, 1<<20) after the zero reject and on the\nfallback path. The explicit-zero reject
  is preserved.\n\nConditions to recreate the bug:\n  CONFIG_NET_SCH_DRR=y. Requires
  CAP_NET_ADMIN (namespace-local via\n  unshare -Urn suffices).\n\n  tc qdisc add
  dev dummy0 root drr\n  tc class add dev dummy0 parent 1: classid 1:1 drr quantum
  1"
