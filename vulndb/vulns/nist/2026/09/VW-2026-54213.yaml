title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  avoid lock inversion in nat keepalive work\n\nnat_keepalive_work() walks the state
  table while xfrm_state_walk()\nholds net->xfrm.xfrm_state_lock. Its callback then
  acquires x->lock,\nwhich conflicts with the delete path taking the same locks in
  reverse\norder via xfrm_state_delete() and __xfrm_state_delete(). This creates\n\
  an AB-BA deadlock that is reported by lockdep when a NAT keepalive\nworker races
  with SA deletion.\n\nFix this by splitting the keepalive walk into two phases. First,\n\
  collect the candidate states while the walk holds xfrm_state_lock and\ntake a reference
  on each state. Then, after the walk completes, process\neach collected state and
  acquire x->lock without nesting it under\nxfrm_state_lock."
