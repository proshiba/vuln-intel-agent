title: "When libpsl support is enabled, libcurl fails to enforce the Public Suffix\n\
  List boundary check when processing a `Set-Cookie` header where the `Domain`\nattribute
  explicitly matches an origin host that is itself a public suffix\n(e.g., `Domain=co.uk`
  set by `co.uk`).\n\nInstead of coercing it into a strict host-only cookie, libcurl
  saves the\ncookie with wildcard domain scope (`.co.uk`). Consequently, the cookie
  is\ninappropriately included in subsequent outbound requests or HTTP redirects to\n\
  arbitrary sibling subdomains under the same public suffix (e.g.,\n`attacker.co.uk`)."
