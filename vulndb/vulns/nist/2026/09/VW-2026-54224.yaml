title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  fix invalidate lock leak on setattr writeback failure\n\nfuse_do_setattr() takes
  filemap_invalidate_lock() for a DAX truncate\n(fault_blocked = true) and releases
  it at the out:/error: labels.  But\nwhen a writeback flush is also needed, a write_inode_now()
  failure\nreturns directly and leaks the lock, so any later fault or truncate on\n\
  the file stalls on the stale rwsem.\n\nFor example, truncate(2) on a setuid file
  reaches fuse_do_setattr()\nwith both ATTR_SIZE and ATTR_MODE set:\n\n  truncate(2)\n\
  \  └─ do_truncate()\n     ├─ dentry_needs_remove_privs()         # S_ISUID\n   \
  \  └─ notify_change()                     # KILL_SUID -> ATTR_MODE\n        └─ fuse_setattr()\
  \                   # no killpriv:\n           │                               \
  \ #   ia_valid |= ATTR_MODE\n           └─ fuse_do_setattr()\n              ├─ filemap_invalidate_lock()\
  \  # IS_DAX && is_truncate\n              └─ write_inode_now()          # is_wb
  && ATTR_MO"
