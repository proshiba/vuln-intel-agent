title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnstree:
  check listing permission before taking a namespace reference\n\nlegitimize_ns()
  takes a reference on the candidate namespace before\nmay_list_ns() has decided whether
  the caller may see it. The\n__free(ns_put) cleanup on the denied path can drop the
  last reference to a\nmount namespace while we still hold the rcu read lock, and
  put_mnt_ns()\nmay sleep there. This is the same problem commit 2ec2aff3c8e2 (\"\
  ns: make\nsure reference are dropped outside of rcu lock\") fixed for the put_user()\n\
  path. Neither ns_requested() nor may_list_ns() needs a reference, both\nonly look
  at the namespace type and at the caller's own namespaces, so do\nthe checks first
  and take the reference last.\n\nSplat:\n\n  Voluntary context switch within RCU
  read-side critical section!\n  WARNING: kernel/rcu/tree_plugin.h:332 at rcu_note_context_switch+0x238/0x2a0,
  CPU#5: a/3442\n  CPU: 5 UID: 1000 PID: 3442 Comm: a Not tainted 7.0.0-30-generic
  #30-Ubuntu P"
