title: 'A vulnerability was found in FLVMeta up to 1.2.2. Affected is the function
  amf_string_new of the file src/amf.c of the component AMF String Processing. The
  manipulation of the argument length results in heap-based buffer overflow. The attack
  can be launched remotely. The exploit has been made public and could be used. The
  patch is identified as f412a33b9a84c2d1a9dee145a868feddbf64879e. A patch should
  be applied to remediate this issue. The project maintainer doubts the security impact:
  "While I acknowledged the bugs and provided fixes, I have yet to see any way to
  exploit these alleged vulnerabilities."'
