title: The EDD Product Catalog Feed by PixelYourSite plugin for WordPress is 
  vulnerable to unauthorized modification of data that can lead to a denial of 
  service due to a missing capability check on the wpeddpcf_delete_feed function
  in all versions up to, and including, 1.0.2. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to delete 
  arbitrary option values on the WordPress site. This can be leveraged to delete
  an option that would create an error on the site and deny service to 
  legitimate users.
