title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  dell-wmi-sysman: Don't hex dump attribute security buffer\n\nset_attribute() populates
  the security area of the BIOS attribute request\nbuffer with the current admin password
  via populate_security_buffer(), then\ndumps the whole request buffer with print_hex_dump_bytes().
  This can expose\nthe plaintext admin password in the kernel log.\n\nThe same issue
  was fixed for the password attribute path by\ncommit d1a196e0a6dc (\"platform/x86:
  dell-wmi-sysman: Don't hex dump\nplaintext password data\"). Remove the remaining
  dump from the BIOS\nattribute path."
