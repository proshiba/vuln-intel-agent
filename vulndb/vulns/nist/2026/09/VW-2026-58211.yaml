title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/waitid:
  honor task_work cancellation\n\nio_waitid_cb() may run through the fallback task_work
  path when\ntask_work_add() can no longer queue work to the originating task. The\n\
  fallback runs from a kworker and io_uring marks such task work as\ncanceled through
  tw.cancel.\n\nio_waitid_cb() currently ignores tw.cancel and calls __do_wait().\n\
  waitid is task-context dependent: __do_wait() performs child lookup\nrelative to
  current, and the retry path also uses\ncurrent->signal->wait_chldexit. If the callback
  runs from the fallback\nkworker, current is therefore not the task that submitted
  the request.\n\nHonor tw.cancel before entering __do_wait(). Complete the request
  with\n-ECANCELED and skip the siginfo copy, since canceled task work may run\nwithout
  the submitting task's userspace execution context.\n\nKeep the existing siginfo
  handling for normal waitid completion and\nexplicit cancellation."
