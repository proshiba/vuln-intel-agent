title: LaSuite Doc is a collaborative note taking, wiki and documentation 
  platform. From 4.8.2 until 5.4.0, GET /api/v1.0/documents/search/ accepts 
  sequential seven-digit document paths to scope descendant searches without 
  requiring the caller to possess the public document UUID. An unauthenticated 
  caller can submit an empty search query and iterate predictable path values to
  enumerate public document subtrees, obtaining document identifiers, titles, 
  creator data, timestamps, and tree metadata. Each disclosed identifier can 
  then be used through normal public-document endpoints to retrieve the document
  content, and differing 403 Forbidden and 404 Not Found responses reveal 
  whether a guessed path exists. Authenticated users can similarly discover 
  documents with authenticated link reach, while restricted documents remain 
  protected. This issue is fixed in version 5.4.0.
