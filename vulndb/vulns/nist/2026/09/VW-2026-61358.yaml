title: "In the Linux kernel, the following vulnerability has been resolved:\n\nftrace:
  Take trace_array reference before accessing its ftrace_ops\n\nThe trace instance
  files set_ftrace_filter and set_ftrace_notrace was\nupdated to work with specific
  trace instances (trace_arrays). The issue is\nthat when these files are opened,
  there is a small race window where it\nwill use the ftrace_ops from the inode->private
  pointer to get a reference\nto the trace_array and then take its reference. The
  problem is that the\nftrace_ops itself could be freed. If the rmdir on the instance
  happens at\nthe same time the set_ftrace_filter file is opened, the rmdir could
  have\nalso freed the ftrace_ops and referencing it will cause a use-after-free\n\
  bug and crash the kernel.\n\nInstead, pass in the trace_array as the file private
  data (NULL for the\ntop level instance), and then pass both the trace_array and
  the ftrace_ops\nto the ftrace_regex_open() function. If the trace_array is NULL,
  then it\njust uses the ftrace_ops without"
