title: OpenFGA is an authorization and permission engine built for developers. 
  Prior to 1.18.1, the ListUsers API could return a user that should have been 
  excluded when an authorization relation used an intersection containing a base
  but not excluded operand, the base was granted through a type-bound public 
  wildcard, and the excluded user also had a concrete tuple through another 
  intersection operand. In pkg/server/commands/listusers/list_users_rpc.go, 
  expandIntersection counted the concrete tuple and wildcard without first 
  rejecting entries in excludedUsersMap. Applications that used ListUsers to 
  enumerate or enforce access could therefore treat an excluded user as 
  authorized. This issue is fixed in version 1.18.1.
