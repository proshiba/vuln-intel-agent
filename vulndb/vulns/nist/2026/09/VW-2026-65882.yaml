title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix use-after-free of qpair work on queue teardown\n\nThe response queue
  MSI-X handler qla2xxx_msix_rsp_q() schedules\nqla_do_work() via queue_work(ha->wq,
  &qpair->q_work). qla_do_work()\ndereferences the qpair (vha, rsp) and takes qpair->qp_lock.\n\
  \nDuring teardown, qla2xxx_delete_qpair() deletes the response queue, which\ncalls
  free_irq() in qla25xx_free_rsp_que(), and then frees the queue and\nthe qpair. free_irq()
  waits for running hardirq handlers but does not\ncancel work already placed on ha->wq.
  A still-pending q_work then runs\nqla_do_work() against the freed qpair and response
  queue, causing a\nuse-after-free. This is especially likely during full adapter
  teardown,\nwhere destroy_workqueue(ha->wq) forces pending work to run after the
  queue\npairs have been freed.\n\nFlush the work item with cancel_work_sync() in
  qla25xx_free_rsp_que()\nafter free_irq() has released the interrupt (so no new work
  can be\nqueued)"
