title: Snipe-IT through 8.6.3 does not neutralize formula elements in the 
  "unaccepted assets" acceptance report CSV export. 
  ReportsController::postAssetAcceptanceReport builds the CSV by hand (stripping
  commas and joining rows manually) and, unlike the six sibling exports in the 
  same controller, never applies League\Csv\EscapeFormula or honors the 
  config('app.escape_formulas') setting. An authenticated low-privilege user 
  with ordinary create/edit rights on any record whose free-text fields appear 
  in the report (asset name/tag, company name, category, model, or assignee 
  display name) can set such a field to a value beginning with =, +, -, @, tab, 
  or CR. When a user with reports.view privileges requests the export (POST 
  /reports/unaccepted_assets) for a pending checkout acceptance referencing the 
