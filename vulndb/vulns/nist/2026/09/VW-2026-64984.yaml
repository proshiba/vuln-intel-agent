title: Joomla Extension - joomshaper.com - Authenticated, Privileged SQL 
  Injection in Media Image Deletion in Easy Store extension 1.0.0-3.0.0 -  The 
  media deletion endpoint 
  (administrator/index.php?option=com_easystore&task=media.deleteImage) parsed 
  the ids parameter as a comma-separated string and imploded it directly into 
  raw SQL IN (...) clauses in Media.php and MediaModel.php without integer 
  casting or parameterization. An authenticated administrator or attacker with 
  access to an admin session could inject arbitrary SQL statements.
