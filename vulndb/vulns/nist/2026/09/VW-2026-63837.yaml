title: A flaw was found in the Admin REST API of Keycloak, an open-source 
  identity and access management solution. The issue occurs because the API uses
  a per-request in-memory cache to resolve clients by their unique identifier 
  without verifying if the client belongs to the realm specified in the request 
  path. This allows an administrator with limited privileges to read or modify 
  sensitive client configurations in the master realm by accessing them through 
  a realm they control. Successful exploitation could lead to the exposure of 
  client credentials or the redirection of administrative login attempts to 
  malicious sites.
