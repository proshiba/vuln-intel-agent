title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Clear buf on error in __bpf_get_task_stack\n\nBoth bpf_get_task_stack and bpf_get_task_stack_sleepable
  helpers that\nuse __bpf_get_task_stack have buf defined as ARG_PTR_TO_UNINIT_MEM\n\
  argument and we should initialize the buf on every return path.\n\nAdding missing
  buf memset for __bpf_get_task_stack fail paths. This\nprovides deterministic buffer
  contents, which is useful when the buffer\nis used directly as a map key."
