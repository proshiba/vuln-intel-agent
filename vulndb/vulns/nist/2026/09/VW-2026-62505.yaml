title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix potential UAF in bpf_netns_link_update_prog\n\nIn bpf_netns_link_update_prog,
  the checks for old_prog and prog type\nare currently performed locklessly before
  acquiring netns_bpf_mutex.\nThis creates a race condition that can lead to a UAF
  issue.\n\nIf two threads concurrently execute BPF_LINK_UPDATE on the same netns\n\
  link, the following execution path can trigger a UAF:\n\nCPU0                  \
  \                        CPU1\nbpf_netns_link_update_prog\n  if (old_prog && old_prog
  != link->prog)\n    return -EPERM;\n                                           \
  \   bpf_netns_link_update_prog\n                                               \
  \ if (old_prog && old_prog != link->prog)\n                                    \
  \            ...\n                                                old_prog = xchg(&link->prog,
  new_prog);\n                                                bpf_prog_put(old_prog);\n\
  \  if (new_prog->type != link->prog->type)"
