title: authentik is an open-source identity provider. Prior to 2026.2.7, 
  2026.5.7, and 2026.8.2, authentik API serializers return stored credentials 
  when an account has view permission on an affected configuration, even when 
  that account is not authorized to change the configuration or read its 
  secrets. Affected configurations include one-time code delivery by mail or 
  SMS, outbound provisioning targets, device trust integrations, identity 
  sources, the Kubernetes outpost integration, applications using a client or 
  shared secret, and applications using a proxy provider. Deployments are 
  affected when view permission is granted to accounts that are not intended to 
  read these credentials; deployments where every viewer is permitted to read 
  them are not affected. This issue is fixed in versions 2026.2.7, 2026.5.7, and
  2026.8.2.
