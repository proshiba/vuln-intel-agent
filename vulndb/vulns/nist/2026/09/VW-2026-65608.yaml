title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: svc: Prevent IRQ storm from false SLVSTART on NPCM845\n\nOn NPCM845, when
  a target on the I3C bus gets stuck holding SDA low,\nthe controller reports a false
  Master Request (MR) in-band interrupt\nevent. The driver handles this by emitting
  a STOP condition to restore\nthe bus.\n\nHowever, the hardware quirk SVC_I3C_QUIRK_FALSE_SLVSTART
  indicates that\nemitting a STOP condition may spuriously set the SLVSTART interrupt\n\
  status bit. In the Master Request case, this creates a feedback loop:\nthe STOP
  triggers a new SLVSTART event, the IRQ handler fires again,\nthe controller still
  reports an MR type, another STOP is emitted, and\nthe cycle repeats indefinitely,
  resulting in an IRQ storm that can lock\nup the CPU.\n\nClear the SLVSTART status
  bit explicitly after emitting the STOP in the\nMaster Request IBI handler when the
  SVC_I3C_QUIRK_FALSE_SLVSTART quirk\nis set. This breaks the feedback loop without
  affecting normal SLVS"
