title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  NUL-terminate replaced sysctl value\n\nWhen writing to sysctls, proc_sys_call_handler()
  guarantees that the\nbuffer passed to proc handlers is NUL-terminated. If\nbpf_sysctl_set_new_value()
  replaces the pending sysctl value, it can\nhand a replacement buffer directly to
  proc handlers. However, the\nhelper currently copies only buf_len bytes into that
  buffer without\nappending a NUL terminator, leaving downstream parsers vulnerable
  to\nout-of-bounds access.\n\nFix this by appending a '\\0' after the replaced value
  to restore the\nexpected sysctl semantics. Since the helper already rejects buf_len\n\
  greater than PAGE_SIZE - 1, there is always room for the extra byte.\n\nReproduced
  in a QEMU x86_64 guest booted with KASAN while exercising\nthe sysctl replacement
  path with a cgroup/sysctl BPF program. The\nreproducer targets `/proc/sys/net/core/flow_limit_cpu_bitmap`,
