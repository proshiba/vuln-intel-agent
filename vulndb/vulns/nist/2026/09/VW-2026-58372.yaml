title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnx2x:
  fix double free in bnx2x_init_firmware() error path\n\nbnx2x_init_firmware() frees
  bp->init_ops, bp->init_data and\nbp->init_ops_offsets in its error path without
  setting them to NULL.\nThe cleanup function bnx2x_release_firmware() frees the same
  three\npointers unconditionally, so if init_firmware fails and\nrelease_firmware
  is later called (e.g. from __bnx2x_remove or through\nthe function state machine),
  all three are freed a second time.\n\nSet each pointer to NULL after kfree() in
  the error path so that the\nsubsequent kfree(NULL) in bnx2x_release_firmware() is
  a safe no-op."
