title: SAP Integration Suite does not sufficiently validate XML documents 
  accepted from untrusted sources in certain internal components. An attacker 
  with low privileges could submit specially crafted XML payloads containing 
  malicious external entity declarations. Successful exploitation could allow 
  the attacker to read sensitive file contents from the server and expose them 
  through monitoring or logging output, resulting in a high impact on 
  confidentiality. It could also lead to resource exhaustion, causing a low 
  impact on availability. There is no impact on integrity.
