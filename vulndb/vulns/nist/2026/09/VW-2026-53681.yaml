title: An integer wraparound in an allocation size calculation in the BSON 
  library's JSON parsing code can cause a buffer to be released while a 
  following copy operation still writes through the stale pointer. On builds 
  where sizes are 32 bits, an unauthenticated party able to supply a 
  sufficiently large JSON input to an application that links the library may 
  cause that application to terminate unexpectedly, resulting in denial of 
  service.
