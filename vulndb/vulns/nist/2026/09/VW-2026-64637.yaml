title: ReactPress is a publishing system for React developers. Prior to version 
  3.7.0, ReactPress API list endpoints build TypeORM `QueryBuilder` conditions 
  using unsanitized HTTP query parameter names as SQL column identifiers (e.g. 
  `` `article.${key}` ``). TypeORM parameterizes values but not column names, 
  allowing unauthenticated attackers to inject SQL through crafted query string 
  keys. Version 3.7.0 contains a patch. As a workaround, allowlist allowed 
  filter column names before interpolating into SQL.
