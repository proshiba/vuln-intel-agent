title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to versions 7.0.16 and 
  8.0.5, a malicious rule could potentially overwrite any file on the file 
  system on rule load or reload. Versions 7.0.16 and 8.0.5 fix the issue. Some 
  workarounds are available. Preprocess `load`+ `save` rules to disallow 
  absolute filenames for save, use Suricata's privilege dropping to limit 
  writable files, and/or configure landlock in suricata.yaml.
