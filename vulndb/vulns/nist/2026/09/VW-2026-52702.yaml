title: OpenAI Codex Desktop for Windows and macOS could execute 
  attacker-controlled Git hooks because automated Git operations trusted the 
  repository's local core.hooksPath setting. If a user opens an 
  attacker-prepared repository whose preserved .git/config points core.hooksPath
  to an attacker-controlled directory, Codex can run a malicious hook while 
  processing the repository. The hook executes outside Codex's command sandbox, 
  without user approval, and with the user's privileges, allowing it to read, 
  change, or delete the user's files and access other resources available to the
  user's account. An ordinary Git clone does not preserve the 
  attacker-controlled repository-local configuration required for exploitation.
