title: A vulnerability was identified in MapQuest Get Directions App 10.16.1 on 
  Android. This vulnerability affects the function getDataColumn of the file 
  ExpoShareIntentModule.kt of the component com.mapquest.android.ace. The 
  manipulation leads to path traversal. An attack has to be approached locally. 
  The exploit is publicly available and might be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
