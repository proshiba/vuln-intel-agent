title: Dasel is a command-line tool and library for querying, modifying, and 
  transforming data structures. From 3.0.0 until 3.11.2, 
  selector/lexer/tokenize.go parseCurRune advances the input index across 
  trailing whitespace and then reads the source at the exhausted index without 
  an end-of-input check. A selector ending in whitespace, including input passed
  through lexer.NewTokenizer(...).Tokenize() or dasel.Query, can therefore cause
  an index-out-of-range panic and terminate the process. This issue is fixed in 
  version 3.11.2.
