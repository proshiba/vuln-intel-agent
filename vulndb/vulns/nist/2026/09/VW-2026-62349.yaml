  nft_ct: move custom expectation support to helper\n\nOriginally, the ct expectation
  support called nf_ct_helper_ext_add() for\nconfirmed conntracks, which is invalid,
  triggering a splat. This was\nfixed by commit 1710eb913bdc (\"netfilter: nft_ct:
  skip expectations for\nconfirmed conntrack\") which restricted it to unconfirmed
  conntracks.\n\nHowever, early insertion of expectations into the expectations list
  when\nthe conntrack is unconfirmed leads to stale entries pointing to the\nwrong
