title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4:
  Fix incorrect argument passed to nfs4_delete_lease() in nfs4_add_lease()\n\nWhen
  nfs4_add_lease() races with a delegation return, it calls\nnfs4_delete_lease() to
  clean up. Previously, it passed priv,\nwhich can legitimately be NULL. Passing a
  NULL priv eventually\nleads to a NULL pointer dereference in generic_setlease()."
