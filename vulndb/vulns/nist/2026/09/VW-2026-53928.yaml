title: "PagerDuty alarm hook transmits the integration routing key over cleartext
  HTTP.\n\n\n\nPagerDuty serves this endpoint over HTTPS and will\nnormally answer
  plain HTTP with a redirect. That does not remove the exposure.\nThe initial POST
  -- including the JSON body containing the routing key -- is\nwritten to the socket
  unencrypted before any redirect response is received.\nRedirection affects only
  whether the request is retried securely, not whether\nthe first copy left the host
  in the clear.\n\n\n\nThis issue affects Apache SkyWalking: from 9.6.0 through 11.0.0.\n\
  \n\n\nUsers are recommended to upgrade to version 11.0.0, which fixes the issue."
