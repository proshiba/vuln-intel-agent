title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/sun4i:
  crtc: Propagate layer initialization error\n\nsun4i_crtc_init() returns plain NULL
  when layer initialization fails,\nwhile all its other error paths return an error
  pointer. The only\ncaller, sun4i_tcon_bind(), checks the result with IS_ERR() and
  happily\ncontinues with tcon->crtc set to NULL. sun4i_rgb_init() and\nsun4i_lvds_init()
  then dereference it in drm_crtc_mask(), which\noopses.\n\nReturn the error pointer
  instead."
