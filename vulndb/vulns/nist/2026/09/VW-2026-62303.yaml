title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmailbox:
  riscv-sbi-mpxy: validate RPMI notification lengths\n\nThe SBI return value controls
  how many bytes are copied from shared\nmemory into the RPMI notification buffer.
  It is not validated against\nthe negotiated shared-memory size before that copy.
  The event walker\nalso uses a reversed loop condition and can inspect a short event
  record.\n\nValidate the complete notification length before copying it, iterate
  only\nwhile a full event header remains, and stop when a declared event payload\n\
  extends beyond the copied notification data."
