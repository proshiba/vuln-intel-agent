title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  staging/ipu7: fix async notifier UAF on probe error path\n\nisys_register_devices()
  registers the V4L2 async notifier via\nisys_notifier_init(). If a subsequent probe
  step such as\nisys_fw_log_init() fails, isys_probe() jumps to the out_cleanup label\n\
  which only calls isys_unregister_devices(). That helper tears down the\nvideo devices,
  subdevices, V4L2 device and media device, but never\nunregisters or cleans up the
  async notifier.\n\nAs a result the notifier stays chained in the global notifier_list
  while\nthe enclosing struct ipu7_isys is freed by devres, leading to list\ncorruption
  and a use-after-free the next time the list is walked.\n\nThe remove path already
  does the right thing by calling\nisys_notifier_cleanup() before isys_unregister_devices().
  Mirror that on\nthe probe error path so the notifier is unregistered and cleaned
  up\nbefore the device is torn down."
