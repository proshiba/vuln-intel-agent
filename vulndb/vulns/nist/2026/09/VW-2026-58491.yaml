title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  validate nseconds in TIME_DELEG decode paths\n\nThe xdrgen-based TIME_DELEG_ACCESS
  and TIME_DELEG_MODIFY decode arms\nstore a raw uint32_t nseconds directly into tv_nsec
  without enforcing\nnseconds < NSEC_PER_SEC. The legacy nfsd4_decode_nfstime4 has
  this\ncheck but the TIME_DELEG paths do not. A malformed timespec can\npropagate
  through notify_change() to disk.\n\nAdd range checks in both nfs4xdr.c (SETATTR
  path) and\nnfs4callback.c (CB_GETATTR path)."
