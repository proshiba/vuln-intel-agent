title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  nci: fix use of uninitialized memory in CORE_INIT_RSP parsing\n\nnci_core_init_rsp_packet_v1()
  and nci_core_init_rsp_packet_v2() parse\nthe CORE_INIT_RSP packet without validating
  that the skb contains\nenough data. A malformed response (e.g. injected via virtual_ncidev)\n\
  can declare a large num_supported_rf_interfaces while providing\ninsufficient data,
  causing reads of uninitialized slab memory. This\nis later used in nci_init_complete_req(),
  triggering a KMSAN\nuninit-value warning.\n\nAdd skb length checks before accessing
  packet fields:\n- Validate the skb has at least 1 byte for the status field.\n-
  Validate the skb can hold the fixed-size header before parsing.\n- In v2, bounds-check
  each variable-length rf_interface entry and its\n  extension parameters within the
  parsing loop.\n- In v1, verify the skb is large enough for both the variable-length\n\
  \  rf_interfaces array and the trailing rsp_2 structure."
