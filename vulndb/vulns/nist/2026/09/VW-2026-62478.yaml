title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: reserve space for the CSA-abort countdown TLV\n\nWhen a CSA countdown
  is active, mt7996_mcu_beacon_cntdwn() emits two\nbss_bcn_cntdwn_tlv entries (the
  CSA countdown and the CCA-abort BCC), but\nMT7996_BEACON_UPDATE_SIZE only reserved
  one. With MBSSID enabled and a\nnear-maximum beacon template the extra 8 bytes could
  push the offload\ncommand past MT7996_MAX_BSS_OFFLOAD_SIZE and trigger skb_over_panic().\n\
  Reserve room for both countdown TLVs."
