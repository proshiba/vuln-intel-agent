title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_teql: restore skb->dev on the slave failure path\n\nteql_master_xmit() sets
  skb->dev = slave before calling the slave's\nndo_start_xmit(), but never restores
  it when that transmit fails. The\nskb then walks on to the next slave still pointing
  at the previous one.\n\nIf a later slave has no resolved neighbour, teql_resolve()
  hands the skb\nto neigh_event_send(), which queues it on that neighbour's arp_queue\n\
  with the stale skb->dev. skb->dev holds no reference, so deleting the\nprevious
  slave frees the net_device while the skb is still queued.\nWhatever runs next on
  that skb - arp_error_report() on timeout, or\nneigh_direct_output() -> dev_queue_xmit()
  once the neighbour resolves -\ncauses a UAF like the one below:\n\nBUG: KASAN: slab-use-after-free
  in __icmp_send (net/ipv4/icmp.c:914 (discriminator 2))\nRead of size 4 at addr ffff888106e100b0
  by task flood_packet/527\nCPU: 0 UID: 0 PID: 527 Comm: flood_packet Not taint"
