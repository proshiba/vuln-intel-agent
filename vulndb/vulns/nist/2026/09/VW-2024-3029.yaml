title: A vulnerability has been found in Secure Systems Engineering Connaisseur 
  up to 3.3.0 and classified as problematic. This vulnerability affects unknown 
  code of the file connaisseur/res/targets_schema.json of the component 
  Delegation Name Handler. The manipulation leads to inefficient regular 
  expression complexity. The complexity of an attack is rather high. The 
  exploitation appears to be difficult. Upgrading to version 3.3.1 is able to 
  address this issue. The name of the patch is 
  524b73ff7306707f6d3a4d1e86401479bca91b02. It is recommended to upgrade the 
  affected component.
