title: lamp-cloud through 5.10.0 contains an authorization bypass vulnerability 
  in FileAnyoneController that allows authenticated users to download arbitrary 
  attachments. Attackers can retrieve other users' stored files by supplying 
  valid attachment identifiers to the /anyone/file/down and 
  /anyone/file/download endpoints, as the application never validates file 
  ownership against the created_by column.
