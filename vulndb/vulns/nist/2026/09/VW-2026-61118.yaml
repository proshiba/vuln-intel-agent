title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  check rpc_sockaddr2uaddr() return value in rpcb_register_inet4/6\n\nrpcb_register_inet4()
  and rpcb_register_inet6() store the result of\nrpc_sockaddr2uaddr() into map->r_addr
  without checking it for NULL.\nrpc_sockaddr2uaddr() returns NULL when its final
  kstrdup() fails, and\nthe unchecked NULL is then carried into the synchronous RPCBPROC_SET\n\
  encode path: rpcb_register_call() -> rpc_call_sync() ->\nrpcb_enc_getaddr() -> encode_rpcb_string(),
  whose first statement is\nstrlen(string), dereferencing NULL and oopsing the kernel.\n\
  \nThe crash reproduces under failslab on v6.12; with KASAN the NULL\ndereference
  surfaces as a fault on the shadow of address zero:\n\n Oops: general protection
  fault, probably for non-canonical address\n       0xdffffc0000000000 [#1] PREEMPT
  SMP KASAN\n RIP: 0010:strlen (lib/string.c:409)\n Call Trace:\n  encode_rpcb_string
  (net/sunrpc/rpcb_clnt.c:890)\n  rpcb_enc_getaddr (net/sunrpc/rpcb_clnt.c:910)\n\
  \  "
