title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: reject out-of-bounds DataOffset in CIFSSMBRead()\n\nThe SMB1 synchronous
  read helper CIFSSMBRead() validates the server's\nDataLength against CIFSMaxBufSize
  and the caller's count, but never\nvalidates DataOffset. The copy source is formed
  as\n\n\t&pSMBr->hdr.Protocol + le16_to_cpu(pSMBr->DataOffset)\n\nand memcpy()'d
  for DataLength bytes with no check that the\n[DataOffset, DataOffset + DataLength)
  range lies within the response\nactually received from the server.\n\nA malicious
  or compromised SMB1 server can return a response carrying\nan in-range DataLength
  and a large DataOffset, driving the source\npointer past the end of the response
  buffer. The memcpy() then copies\nadjacent kernel heap into the caller's read buffer
  (information\ndisclosure), or reads unmapped memory and oopses (denial of service).\n\
