title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: clear wcid mask under mutex after RCU pointer clear\n\nmt7915_remove_interface()
  cleared the wcid mask bit with no lock held and\nbefore clearing the RCU wcid pointer.
  The mask is a non-atomic RMW shared\nwith the allocators, which all run under dev->mt76.mutex;
  on DBDC the two\nwiphys share one mt76_dev, so this raced add_interface/sta_add
  on the\nother band and could leak or double-hand-out a wcid. Clearing the bit\n\
  before the RCU pointer also let a concurrent allocation reuse the index\nand publish
  its wcid, which the subsequent NULL assignment then wiped.\nMove the clear into
  the existing mutex section, after the RCU pointer is\ncleared."
