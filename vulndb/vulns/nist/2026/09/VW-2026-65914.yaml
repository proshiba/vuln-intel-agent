title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  syncookies: remember the request backup flag\n\nInstead of using an uninitialised
  bit when copying the info in\nsubflow_ulp_clone().\n\nTo fix this, no need to extend
  the join_entry structure: backup is\ncoming from struct mptcp_subflow_request_sock,
  only one bit. Do the same\nhere by using one bit for both."
