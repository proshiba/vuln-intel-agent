title: A vulnerability was determined in GPAC up to f1219cde. This impacts the 
  function xmt_parse_element of the file scene_manager/loader_xmt.c of the 
  component MP4Box. Executing a manipulation can lead to reachable assertion. 
  The attack is restricted to local execution. The exploit has been publicly 
  disclosed and may be utilized. Upgrading to version abi-16.23 will fix this 
  issue. This patch is called afca1f1181668d85941d51ed1adf647807d5d975. It is 
  recommended to upgrade the affected component.
