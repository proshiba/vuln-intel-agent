title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: Fix fence cleanup in ffs_dmabuf_transfer() error paths\n\nThe error
  paths for endpoint-disabled (ESHUTDOWN) and request-allocation\nfailure (ENOMEM)
  in ffs_dmabuf_transfer() jump to err_fence_put which\ncalls dma_fence_put() on the
  fence. However, at that point the fence has\nonly been kmalloc'd — dma_fence_init()
  has not been called yet, so the\nrefcount and the fence ops are uninitialized. Calling
  dma_fence_put() on\nsuch an object leads to undefined behavior.\n\nUse kfree() instead,
  since the fence is just a plain allocation at this\nstage, and rename the label
  to err_fence_free to reflect the actual\ncleanup action."
