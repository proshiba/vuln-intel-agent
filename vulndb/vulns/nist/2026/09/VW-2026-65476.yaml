title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix use-after-free on reloc root after error in insert_dirty_subvol()\n\nIf during
  relocation we fail in insert_dirty_subvol() because\nbtrfs_update_reloc_root() returned
  an error, we will leave a root's\nreloc_root field pointing to a reloc root that
  was freed instead of NULL,\nresulting later in a use-after-free, or double free
  attempt during\nunmount.\n\nThe sequence of steps is this:\n\n1) During relocation
  the call to btrfs_update_reloc_root() in\n   insert_dirty_subvol() fails, so insert_dirty_subvol()
  returns the\n   error to merge_reloc_root() without adding the root to the list\n\
  \   rc->dirty_subvol_roots;\n\n2) Then merge_reloc_root() aborts the current transaction
  because\n   insert_dirty_subvol() returned an error;\n\n3) Up the call chain, merge_reloc_roots()
