title: Lantronix SLC8000 before firmware v9.7.0.2, EMG8500/EMG7500 before 
  firmware v9.7.0.1, and all firmware versions of SLB882/SLCx-03/SLCx-02 contain
  a stack-based buffer overflow vulnerability that allows authenticated 
  attackers to potentially execute arbitrary code by exploiting an undocumented 
  mfc eeprom read command that copies unbounded user input into a bounded stack 
  buffer before passing it to a system() call. Attackers can authenticate as any
  user to the terminal or CLI interface and supply an oversized input to trigger
  the overflow, potentially achieving complete loss of confidentiality, 
  integrity, and availability on the affected device and impacting downstream 
  serial-attached devices.
