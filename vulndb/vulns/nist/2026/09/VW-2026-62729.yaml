title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  xilinx_dma: Fix CPU stall in xilinx_dma_poll_timeout\n\nCurrently when calling xilinx_dma_poll_timeout
  with delay_us=0 and a\ncondition that is never fulfilled, the CPU busy-waits for
  prolonged time\nand the timeout triggers only with a massive delay causing a CPU
  stall.\n\nThis happens due to a huge underestimation of wall clock time in\npoll_timeout_us_atomic.
  Commit 7349a69cf312 (\"iopoll: Do not use\ntimekeeping in read_poll_timeout_atomic()\"\
  ) changed the behavior to no\nlonger use ktime_get at the expense of underestimation
  of wall clock\ntime which appears to be very large for delay_us=0. Instead of timing\n\
  out after approximately XILINX_DMA_LOOP_COUNT microseconds, the timeout\ntakes XILINX_DMA_LOOP_COUNT
  * 1000 * (time that the overhead of the for\nloop in poll_timeout_us_atomic takes)
  which is in the range of several\nminutes for XILINX_DMA_LOOP_COUNT=1000000. Fix
  this by using a non-zero\nvalue for delay_us. Use "
