title: Frappe ERPNext versions before 15.121.0 and 16.x before 16.34.0 contain 
  an information disclosure vulnerability in whitelisted timesheet endpoints 
  that fail to enforce doctype permissions. Authenticated attackers can call 
  get_projectwise_timesheet_data, get_timesheet_detail_rate, and get_timesheet 
  endpoints to enumerate and retrieve billable time logs including project 
  names, billing amounts, and work descriptions without proper authorization 
  checks.
