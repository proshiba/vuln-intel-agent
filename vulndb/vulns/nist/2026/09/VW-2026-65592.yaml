title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  perf: Retrieve path and source from event data\n\nETM perf callbacks currently use
  the per-CPU csdev_src pointer, which\ncan race with updates during device registration
  and unregistration.\n\nThe AUX setup already builds and stores the path in the event
  data.\nUse this path to retrieve the source instead of csdev_src to avoid\nthe race.\n\
  \nExport coresight_get_source() and add etm_event_get_ctxt_path() to\nretrieve the
  context's path and its source with READ_ONCE() /\nWRITE_ONCE() accessors. Give the
  comments to explain why this\napproach is safe when pause or resume callbacks preempt
  the disable\ncallback (e.g. via NMI)."
