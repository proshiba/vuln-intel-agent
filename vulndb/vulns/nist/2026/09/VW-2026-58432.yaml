title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  call pagecache_isize_extended() in cifs_setsize() when extending\n\ncifs_setsize()
  calls truncate_pagecache() but skips\npagecache_isize_extended() on extension. \
  \ truncate_setsize() shows\nthe correct pattern:\n\n  i_size_write(inode, newsize);\n\
  \  if (newsize > oldsize)\n      pagecache_isize_extended(inode, oldsize, newsize);\n\
  \  truncate_pagecache(inode, newsize);\n\npagecache_isize_extended() zeroes the
  tail of the page straddling old\nEOF.  Without it, dirty bytes in that region can
  be written back to\nthe server, exposing stale data in the newly extended range."
