title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  mpi3mr: Fix target device refcount leak in mpi3mr_sas_port_add()\n\nmpi3mr_get_tgtdev_by_addr()
  increments the target device kref when it\nreturns a device. If a subsequent error
  triggers a goto out_fail after\nthe tgtdev reference is acquired, the reference
  is never released\nbecause the out_fail path does not call mpi3mr_tgtdev_put().
  This\nprevents the target device structure from ever being freed.\n\nAdd a tgtdev
  put in the out_fail path, guarded by a NULL check since\ntgtdev is only acquired
  for SAS_END_DEVICE types and the same cleanup\npath is shared by earlier error cases
  where tgtdev is still NULL."
