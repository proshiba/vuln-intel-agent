title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: Reject descending VLAN tunnel ranges\n\nA pair of descending VLAN and tunnel
  IDs can pass the tunnel range span\ncheck. The VLAN subtraction produces a negative
  int, which is converted\nto unsigned when compared with the u32 tunnel ID subtraction.
  It can\ntherefore equal the wrapped tunnel ID delta.\n\nThe range loop then performs
  no iterations. Since the batched\nnotification handling added a post-loop error
  check, this leaves err\nuninitialized and makes the request's return value unpredictable.\n\
  \nReject descending VLAN ranges before comparing the spans. Valid\nascending and
  single-entry ranges remain unchanged, while malformed\ndescending ranges consistently
  return -EINVAL.\n\nThis issue was found by a static analysis checker and confirmed
  by\nmanual source review."
