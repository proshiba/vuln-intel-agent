title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to migrate all curseg types during free_segment_range\n\nIn free_segment_range(),
  the curseg evacuation loop only iterates up to\nNR_CURSEG_PERSIST_TYPE (0..5), missing
  non-persistent in-memory curseg\ntypes such as CURSEG_COLD_DATA_PINNED and CURSEG_ALL_DATA_ATGC.\n\
  \nEven though these in-memory curseg types are not saved in the on-disk\ncheckpoint
  header, they still occupy active physical segments at runtime.\nIf an active in-memory
  curseg happens to be allocated within the segment\nrange being truncated during
  filesystem shrink, failing to evacuate it\nwill cause subsequent writes to the curseg
  attempting out-of-bounds I/O\non the truncated storage range.\n\nFix this by expanding
  the curseg evacuation loop upper bound to\nNR_CURSEG_TYPE to ensure all active curseg
  types are safely migrated\nout of the target range."
