title: The Event Tickets and Registration plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  Stripe OAuth return endpoint in all versions up to, and including, 5.27.4. 
  This makes it possible for unauthenticated attackers to overwrite the site's 
  Stripe merchant credentials (access tokens, publishable keys, and account ID),
  diverting all subsequent payment processing to the attacker's Stripe account.
