title: A vulnerability was identified in seakee CPA-Manager-Plus up to 1.11.10. 
  This vulnerability affects the function CPAResource of the file 
  apps/manager-server/internal/http/controller/proxy/handler.go of the component
  HTTP Handler. The manipulation leads to improper authorization. It is possible
  to initiate the attack remotely. Upgrading to version 1.11.11 is able to 
  resolve this issue. The identifier of the patch is 
  842eec791377ddcbea5cd639bc065eaa4801d656. It is suggested to upgrade the 
  affected component.
