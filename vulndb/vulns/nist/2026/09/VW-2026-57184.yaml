title: Snipe-IT versions before 8.7.0 fail to enforce checkout authorization 
  when assignment fields are submitted to the asset update endpoint. 
  Authenticated users with edit permission but explicitly denied checkout 
  permission can reassign assets, bypass check-in procedures, and alter custody 
  records by submitting assigned_user, assigned_asset, or assigned_location 
  parameters to PATCH /api/v1/hardware/{id}.
