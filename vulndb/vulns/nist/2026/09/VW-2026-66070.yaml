title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (ltc4282) Make sure clk_init_data is fully initialized\n\nThe clk_init_data structure
  contains several mutually-exclusive members\nfor different methods to specify the
  possible parents of a clock,\nprompting drivers to initialize only the members they
  need.  However,\nnot initializing all members may cause subtle issues, which are
  only\nexposed when CONFIG_INIT_STACK_ALL_PATTERN or CONFIG_INIT_STACK_NONE is\n\
  enabled.\n\nltc428_clk_provider_setup() does not fill in any parent clocks, and\n\
  assumes that init.num_parents is NULL.  However, the latter in\nuninitialized, and
  thus may cause a crash.\n\nMake sure all members are fully initialized, to fix such
  bugs, and to\navoid future breakage when converting drivers to a different method
  for\nspecifying the parents."
