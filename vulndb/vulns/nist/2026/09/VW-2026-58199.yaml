title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bnxt: ring the doorbell when SW USO exits early\n\nWhen a burst of packets is handed
  down to the driver, the driver defers\nthe doorbell to the end by setting txr->kick_pending
  = 1. The normal TX\npath handles this, but the SW USO path can miss it if it returns\n\
  early.\n\nIf bnxt_sw_udp_gso_xmit runs but returns early with NETDEV_TX_BUSY and\n\
  txr->kick_pending was previously set to 1, then the TX queue can\nstall because
  the driver wrote some BDs but never wrote the doorbell.\nThe device won't know to
  do the TX which would generate the completion\nthat would wake the queue back up.\n\
  \nSimplify bnxt_sw_udp_gso_xmit to set txr->kick_pending in its success\ncase and
  check the flag on return. The added check after\nbnxt_sw_udp_gso_xmit returns ensures
  that any pending doorbells are\nwritten handling both successful USO and any early
  returns, which\nprevents the TX queue stall mentioned above.\n\nThis TX queue stall
  was observed on a pr"
