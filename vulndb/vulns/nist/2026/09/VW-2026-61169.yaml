title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  force complete the KIQ ring fences on reset\n\nLike the MES scheduler ring, the
  KIQ ring sets no_scheduler = true and uses a\npolling fence, so it is skipped by
  the force-completion loop in\namdgpu_device_pre_asic_reset(). Its hw fence value
  lives in wb (GTT) memory and\nsurvives a MODE1 reset while fence_drv.sync_seq keeps
  advancing, so after a\nreset the first KIQ submission can poll forever on a seq
  that is never written\nback.\n\nForce complete the KIQ ring fences too so their
  hw fence is realigned to\nsync_seq."
