title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-auth:
  Synchronize timeout work during SQ teardown\n\nnvmet_auth_sq_free() cancels auth_expired_work
  with\ncancel_delayed_work(). If the work has already started, cancellation does\n\
  not wait for the callback. Transport teardown can consequently free or\nreuse the
  queue containing struct nvmet_sq while\nnvmet_auth_expired_work() still accesses
  that SQ.\n\nAdd a teardown-specific helper that synchronously drains the delayed
  work\nbefore freeing authentication state, and use it from nvmet_sq_destroy().\n\
  Keep the non-synchronous helper for in-band authentication state cleanup,\nwhere
  the SQ owner remains alive."
