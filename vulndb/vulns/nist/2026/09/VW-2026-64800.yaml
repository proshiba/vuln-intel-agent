title: "The Reachy Mini daemon exposes an HTTP API for managing the robot. Its app
  installation endpoint, POST /apps/install in src/reachy_mini/daemon/app/routers/apps.py,
  has no authentication. The handler's only dependency is Depends(get_app_manager),
  which just hands back the manager object from application state, so nothing in the
  chain ever checks a credential.\n\n\n\nThe endpoint takes an AppInfo body naming
  a Hugging Face Space. The daemon downloads that Space and installs it as a Python
  package through install_package in src/reachy_mini/apps/sources/local_common_venv.py,
  using uv or pip. Installing a Python package runs the package's own build and setup
  code, so whoever chooses the Space chooses what code the robot runs. Anyone can
  publish a public Hugging Face Space, so this is not a meaningful restriction on
  the attacker.\n\n\n\nHow far this reaches depends on the model. In _resolve_bind_host
  in src/reachy_mini/daemon/app/main.py the daemon binds 0.0.0.0 when it runs as the
  wireless version "
