title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/cxgb4:
  Cancel reg_work before freeing device on remove\n\nc4iw_uld_state_change() queues
  reg_work to register the RDMA device.\nc4iw_remove() can free ctx->dev while this
  work is pending or running,\nleaving c4iw_register_device() accessing the freed
  device.\n\nCancel reg_work before removing the device.  The registration work can\n\
  tear down ctx->dev when registration fails, so do not unregister or\ndeallocate
  it again in that case.\n\nThis issue was found by an in-house static analysis tool."
