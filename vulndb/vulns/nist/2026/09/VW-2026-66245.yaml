title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/srpt:
  Fix srpt_alloc_rw_ctxs() unwind counters\n\nWhen srpt_alloc_rw_ctxs() fails partway
  through a multi-buffer indirect\ndescriptor, the unwind path destroys RDMA contexts
  but leaves stale\nn_rw_ctx and n_rdma values (and a dangling rw_ctxs pointer). Later\n\
  sq_wr_avail accounting in srpt_queue_response() or srpt_write_pending()\ncan then
  subtract the wrong number of send queue credits.\n\nReset the counters and clear
  rw_ctxs after freeing the heap\nallocation before returning an error."
