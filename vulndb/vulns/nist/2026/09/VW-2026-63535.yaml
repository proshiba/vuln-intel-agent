title: The YS LeadGen plugin for WordPress is vulnerable to authorization bypass
  and Stored Cross-Site Scripting via multiple AJAX endpoints in all versions up
  to, and including, 2.1.4 due to missing capability checks on popup management 
  actions. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to create arbitrary popups and inject 
  malicious JavaScript that executes when the popup is displayed, leading to 
  Stored XSS.
