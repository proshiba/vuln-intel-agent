title: "The jdbc shell command scope shipped no org.apache.karaf.command.acl.jdbc.cfg.
  Karaf's command guard (SecuredSessionFactoryImpl) treats a command with no matching
  ACL rule as allowed, so any authenticated shell session (including one holding only
  the viewer role) could run every jdbc:* command. jdbc:ds-create stores a fully attacker-controlled
  JDBC URL into a pax-jdbc-config factory Configuration with no validation. pax-jdbc-config reactively
  turns that into a live DataSource. Several JDBC drivers run code or SQL at connection
  time based on URL parameters (e.g. H2 INIT=RUNSCRIPT), so a viewer-level shell user
  could reach arbitrary code execution, bypassing the admin-role gate that already
  protects shell:exec. This is a privilege-escalation-to-RCE chain, not merely an
  \"admin misconfiguration\".\n\n\nThe same applies to jms:* shell commands."
