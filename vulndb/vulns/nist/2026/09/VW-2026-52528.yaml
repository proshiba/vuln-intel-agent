title: A security flaw has been discovered in zhongyu09 OpenChatBI up to 0.3.0. 
  Affected by this vulnerability is the function _validate_sql_safety of the 
  file openchatbi/text2sql/generate_sql.py. Performing a manipulation results in
  sql injection. The attack can be initiated remotely. Versions v0.2.0 through 
  v0.2.2 have no SQL safety validation at all, while v0.3.0 introduced a 
  validator and v1.0.0b1/main kept the same incomplete one with an optional 
  stricter mode. The vendor was contacted early about this disclosure but did 
  not respond in any way.
