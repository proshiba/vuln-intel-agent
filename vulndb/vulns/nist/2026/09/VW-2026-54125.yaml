title: A reflected cross-site scripting (XSS) vulnerability exists in EMX 
  Tecnologia Gestao X Business Suite 8.4 and earlier. The vulnerability is 
  caused by insufficient validation and sanitization of the mensagem parameter 
  in the /Configuracao/Imagens.aspx endpoint, allowing an unauthenticated 
  attacker to inject arbitrary JavaScript code that is reflected and executed in
  the context of a victim's browser.
