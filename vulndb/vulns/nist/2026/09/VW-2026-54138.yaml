title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  nintendo: stop device IO before hid_hw_stop on probe failure\n\nnintendo_hid_probe()
  calls hid_device_io_start() before joycon_init()\nand joycon_leds_create().  If
  either fails, the error path jumps to\nerr_close which calls hid_hw_close()/hid_hw_stop()
  without first calling\nhid_device_io_stop().\n\nhid_hw_stop() does not stop device
  IO, so hid_input_report() may still\nrun and access driver data that is being torn
  down, resulting in a\nuse-after-free.\n\nAdd an err_io_stop label that calls hid_device_io_stop()
  before\nhid_hw_close(), and point the two post-io_start error paths at it."
