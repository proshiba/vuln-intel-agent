title: DefaultBaseTypeLimitingValidator is the PolymorphicTypeValidator applied 
  automatically whenever @JsonTypeInfo is used without an explicitly configured 
  custom validator. It denies polymorphic resolution only for a fixed set of 
  "unsafe base types", and its isSafeSubType method returns true unconditionally
  for every base type outside that set. java.lang.Comparable was absent from the
  list despite being implemented by a very large fraction of JDK and application
  classes, comparable in breadth to java.io.Serializable, which is on the list 
  for that reason. An application declaring an @JsonTypeInfo-annotated property 
  or class with Comparable as its base type, and no custom 
  PolymorphicTypeValidator, will accept a type identifier for essentially any 
  class implementing Comparable. This yields an attacker-controlled object 
