title: "In the Linux kernel, the following vulnerability has been resolved:\n\npmdomain:
  mediatek: mfg: initialize prev_o in mtk_mfg_attach_dev()\n\nmtk_mfg_attach_dev()
  reads prev_o on the first iteration of its loop,\nin \"if (prev_o && prev_o->freq
  == o->freq)\", before prev_o is assigned\nat the end of the loop body. On that first
  iteration, evaluating prev_o\nreads an indeterminate value. If it is non-NULL, the
  condition\ndereferences a stale or invalid pointer, potentially faulting or\nincorrectly
  skipping the first OPP.\n\nInitialize prev_o to NULL. This matches the intent as
  well: there is no\nprevious OPP to compare against on the first iteration.\n\nFound
  with Clang's -Wconditional-uninitialized."
