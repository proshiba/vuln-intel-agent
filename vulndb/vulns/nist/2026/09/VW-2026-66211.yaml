title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel:
  ethosu: Don't read the U65 rounding mode as a storage mode\n\nBits 15:14 of NPU_SET_{IFM,OFM}_PRECISION
  select the activation storage\nmode on U85 only. On U65 the same field holds the
  rounding mode, and the\ncommand stream parser has read it as a storage mode since
  the driver was\nadded.\n\nThat went unnoticed while unknown values fell through
  the switch, but\nnow that they are rejected, every U65 command stream that asks
  for\nnatural rounding (2) fails CMDSTREAM_BO_CREATE with -EINVAL. Mesa emits\nit
  for average pooling, concatenation, split, unpack, strided slice, LUT\nand argmax,
  which is 72 failures of the Teflon test suite on an i.MX93.\nTruncating rounding
  (1) is misread as well: it picks the two-tile\naddress path and computes a bogus
  feature map size from tile bases the\ncommand stream never set.\n\nRead the field
  as a storage mode only on the hardware where it is one."
