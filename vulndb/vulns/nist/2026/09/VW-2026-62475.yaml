title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm:
  don't tear down KMS twice when KMS init fails\n\nWhen priv->kms_init() (mdp4_kms_init()
  / mdp5_kms_init()) fails partway\nthrough, both display drivers already tear their
  KMS state down via\nmdp4_destroy() / mdp5_kms_destroy() before returning the error.
  The\ncommon error path in msm_drm_init() then runs msm_drm_uninit() ->\nmsm_drm_kms_uninit(),
  which tries to destroy the very same KMS a second\ntime, which causes a use-after-free
  crash.\n\nBring MDP4/MDP5 in line with the DPU driver whose dpu_kms_init() doesn't\n\
  perform error cleanup on the failure. Let the common path own the\ncleanup, instead
  of freeing the KMS from their error paths.\n\nThe crash trace for the reference:\n\
  \n  __lock_acquire from lock_acquire (kernel/locking/lockdep.c:5906 kernel/locking/lockdep.c:5863)\n\
  \  lock_acquire from touch_wq_lockdep_map (kernel/workqueue.c:4094 (discriminator
  1))\n  touch_wq_lockdep_map from __flush_workqueue (kernel/workqueue.c:4"
