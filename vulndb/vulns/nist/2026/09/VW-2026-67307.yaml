title: "DBI versions before 1.654 for Perl incorrectly treat numeric values as strings
  in FetchHashKeyName.\n\nfetchrow_hashref uses the string pointer of the FetchHashKeyName
  attribute as the key name without stringifying it first. When FetchHashKeyName has
  been set to an integer (IV) or floating-point (NV) value, that pointer is invalid,
  so reading the key name triggers a segmentation fault.\n\nThis can be triggered
  with the following code:\n\n   my $dbh = DBI->connect( \"dbi:ExampleP:\", \"\",
  \"\",\n       { RaiseError => 0, PrintError => 0 } );\n   $dbh->{FetchHashKeyName}
  = 42;\n\n   my $sth = $dbh->prepare(\"select mode, size, name from .\");\n   $sth->execute;\n\
  \   $sth->fetchrow_hashref;"
