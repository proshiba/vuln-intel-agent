title: A flaw has been found in ag-ui-protocol ag-ui up to 2026-09-07. This 
  vulnerability affects the function FilterToolCallsMiddleware of the file 
  sdks/typescript/packages/client/src/middleware/filter-tool-calls.ts of the 
  component Middleware. Executing a manipulation can lead to incomplete cleanup.
  The attack may be launched remotely. Upgrading to version 2026-09-08 is able 
  to resolve this issue. This patch is called 
  c346119fe870b70f5c19738ee5119f3e1456e59d. It is suggested to upgrade the 
  affected component.
