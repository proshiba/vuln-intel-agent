title: 'When an application enables both OCSP and CRL revocation checking on one WOLFSSL_CTX
  or certificate manager, wolfSSL skips the CRL check for any peer certificate that
  carries no Authority Information Access OCSP URL, and accepts a certificate the
  loaded CRL lists as revoked. The soft-fail policy for a missing responder collapses
  the OCSP result onto success before the code decides whether the CRL fallback is
  still needed, so "no responder exists" becomes indistinguishable from "the responder
  answered good". Affected builds define both HAVE_OCSP and HAVE_CRL: --enable-ocsp
  --enable-crl directly, and implicitly --enable-all, --enable-distro, --enable-curl,
  --enable-nginx, --enable-haproxy, --enable-stunnel, --enable-lighty, --enable-wpas,
  --enable-strongswan, --enable-mosquitto, --enable-jni, --enable-openvpn and --enable-krb.
  An application is affected only if it calls both wolfSSL_CTX_EnableOCSP() (or wolfSSL_EnableOCSP()
  / wolfSSL_CertManagerEnableOCSP()) and wolfSSL_CTX_EnableCRL() ('
