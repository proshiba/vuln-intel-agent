title: WNC T-Mobile 5G Box IDU router is vulnerable to a command injection. The 
  vulnerability exists in the ping functionality within the /cgi-bin/portal.cgi 
  endpoint, specifically affecting the ping_ip, ping_size, and ping_times POST 
  parameters. The root cause is the failure to verify and sanitize user-supplied
  input before incorporating it into a system command. This allows an 
  authenticated attacker to execute arbitrary commands on the shell and gain 
  root access to the system.This issue has been fixed in firmware 
  version 1.1.0.651412
