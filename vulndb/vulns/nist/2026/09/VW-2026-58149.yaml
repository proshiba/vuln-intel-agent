title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: dvm: fix memory leak in iwl_op_mode_dvm_start()\n\nIn iwl_op_mode_dvm_start(),
  jumping to out_free_eeprom currently bypasses\nthe out_free_eeprom_blob label. Consequently,
  error paths triggered after\nsuccessfully parsing the EEPROM free priv->nvm_data
  but leak\npriv->eeprom_blob.\n\nFix this memory leak by reordering the error handling
  labels so\nthat out_free_eeprom falls through to out_free_eeprom_blob.\n\nThe bug
  was first flagged by an experimental analysis tool we are\ndeveloping for kernel
  memory-management bugs while analyzing\nv6.13-rc1. The tool is still under development
  and is not yet publicly\navailable. Manual inspection confirms that the bug is still\n\
  present in v7.1-rc6.\n\nAn x86_64 allyesconfig build showed no new warnings. As
  we do not have\nsupported Intel DVM wireless hardware and firmware to test with,
  no\nruntime testing was able to be performed."
