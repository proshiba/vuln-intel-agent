title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmailbox:
  qcom-cpucp: handle NULL data in send_data callback\n\nmailbox_clear_channel() calls
  mbox_send_message() with NULL data to\nnotify the remote side that the RX channel
  has been cleared.\nqcom_cpucp_mbox_send_data() blindly dereferenced the data pointer,\n\
  causing a NULL pointer dereference kernel panic when invoked from\nthis path under
  PREEMPT_RT.\n\nAdd an explicit NULL check and return early without writing to the\n\
  TX register, which is the correct behaviour for a channel-clear\nnotification."
