title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ufs: core: Validate string descriptors\n\nThe string descriptor length includes
  a two-byte header while the UTF-16\npayload starts after it. utf16s_to_utf8s() expects
  a count of UTF-16 code\nunits, not bytes. Passing the payload byte count can make
  it read beyond\nthe descriptor buffer.\n\nValidate that the payload has an even
  byte count, pass a code-unit count to\nthe converter, and allocate sufficient UTF-8
  output space.\n\nThe raw string buffer starts after the descriptor header but its
  size is\nbLength. Copying bLength bytes from that pointer can read beyond the\n\
  response buffer.\n\nAllocate a zeroed bLength-sized buffer and copy only the UTF-16\n\
  payload. This preserves the raw buffer size consumed by the RPMB device-ID\nABI
  while avoiding the overread."
