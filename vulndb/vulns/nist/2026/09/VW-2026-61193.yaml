title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix dentry folio leak in find_in_level\n\nfind_in_level() gets a dentry folio with
  f2fs_find_data_folio() before\ncalling find_in_block().  If find_in_block() returns
  an error, the\nfunction stores the error in res_folio and breaks out of the loop
  without\ndropping the dentry folio.\n\nThis leaks the folio reference on the find_in_block()
  error path.  Drop\nthe dentry folio before returning the error to the caller."
