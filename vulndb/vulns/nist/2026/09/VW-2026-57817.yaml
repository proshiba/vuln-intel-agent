title: IBM Langflow OSS 1.0.0 through 1.11.5 Langflow could allow an 
  authenticated attacker to access sensitive files belonging to other users due 
  to improper access control in the File/Read File component. When executing 
  flows through the /api/v1/run/advanced/{flow_id} endpoint, the application 
  allows component inputs to reference storage paths using arbitrary user or 
  flow identifiers without verifying ownership. An attacker with low‑privileged 
  authenticated access can supply a crafted file path pointing to another user’s
  storage namespace, causing the backend to read and return the contents of 
  files uploaded by other users. This vulnerability bypasses intended 
  authorization checks enforced by the file management API and may result in 
  unauthorized disclosure of sensitive user data.
