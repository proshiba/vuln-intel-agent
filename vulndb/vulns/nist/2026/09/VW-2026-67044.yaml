title: "A vulnerability in the bootloader of Cisco IOS XE Software for Cisco Catalyst
  9200 Series Switches, Cisco Catalyst ESS9300 Embedded Series Switches, Cisco Catalyst
  IE9310 and IE9320 Rugged Series Switches, and Cisco IE3500 and IE3505 Rugged Series
  Switches could allow an authenticated, local attacker with level-15 privileges or
  an unauthenticated attacker with physical access to an affected device to execute
  arbitrary code at boot time and break the chain of trust.\r\n\r This vulnerability
  is due to insufficient validation of software at boot time. An attacker could exploit
  this vulnerability by manipulating the loaded binaries on an affected device to
