title: Kimai before 2.63.0 contains an improper authorization vulnerability in 
  team access endpoints that allows authenticated users with team edit 
  permissions and read-only access to grant team access to customers, projects, 
  or activities. Attackers can exploit insufficient permission checks by sending
  POST requests to team access endpoints to modify access control lists for 
  entities they should not be able to modify.
