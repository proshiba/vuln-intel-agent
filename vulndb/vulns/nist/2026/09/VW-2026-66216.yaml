title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gud:
  validate GUD_ROTATION_0 is present in supported rotations\n\nThe rotation argument
  to drm_plane_create_rotation_property() is set to\nDRM_MODE_ROTATE_0, and the device
  reported rotation bitmask is used as\nthe supported_rotations argument. The driver
  never validates that\nGUD_ROTATION_0 is present, so a device that omits it from
  its\nGUD_PROPERTY_ROTATION triggers the\nWARN_ON(rotation & ~supported_rotations)
  in\ndrm_plane_create_rotation_property()\n\nFix this by skipping the creation of
  rotation property if the device\ndoesn't have the GUD_ROTATION_0 bit"
