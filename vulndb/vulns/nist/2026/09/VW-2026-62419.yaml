title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/srp:
  fix heap information leak on a truncated SRP_CRED_REQ\n\nsrp_recv_done() passes
  wc->byte_len to srp_process_rsp(). It passes\nnothing to srp_process_cred_req()
  and srp_process_aer_req(), which read\nfixed-size fields from the receive buffer
  without checking that those\nfields were received.\n\nThe buffer size is max_ti_iu_len,
  which comes from the login response\nand is not validated. A target that advertises
  8 and then sends an\n8-byte SRP_CRED_REQ makes the initiator read req->tag from
  beyond the\nend of the buffer. req->tag is copied into the SRP_CRED_RSP and sent\n\
  back, so those bytes reach the target. SRP_AER_REQ behaves the same way\nand also
  reads req->lun.\n\nThe leak is 8 bytes per response. max_ti_iu_len also decides
  which slab\ncache the buffer comes from. With 8 the buffer is a kmalloc-8 object
  and\nthe read is entirely outside it:\n\n  BUG: KASAN: slab-out-of-bounds in srp_recv_done+0x172b/0x1aa0\n\
  \  Read of size 8"
