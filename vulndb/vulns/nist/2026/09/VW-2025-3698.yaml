title: A security vulnerability has been detected in deco-cx apps up to 0.120.1.
  Affected by this vulnerability is the function AnalyticsScript of the file 
  website/loaders/analyticsScript.ts of the component Parameter Handler. Such 
  manipulation of the argument url leads to server-side request forgery. The 
  attack can be executed remotely. The exploit has been disclosed publicly and 
  may be used. Upgrading to version 0.120.2 addresses this issue. It is 
  suggested to upgrade the affected component.
