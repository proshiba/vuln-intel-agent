title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  bound the attribute-list entry in ntfs_read_inode_mount()\n\nThe $MFT attribute-list
  walk in ntfs_read_inode_mount() validates each\nentry only with \"(u8 *)al_entry
  + 6 > al_end\" and\n\"(u8 *)al_entry + le16_to_cpu(al_entry->length) > al_end\"\
  , but then reads\nal_entry->lowest_vcn (an __le64 at offset 8) and al_entry->mft_reference\n\
  (offset 16) -- fields beyond the 6 bytes proven in range. al_entry->length\nis attacker-controlled
  and only required non-zero, so a short entry (e.g.\nlength 8) placed at the tail
  passes both checks while the lowest_vcn /\nmft_reference reads fall past al_end.\n\
  \nal_end is ni->attr_list + attr_list_size (the on-disk size); the buffer is\nkvzalloc(round_up(attr_list_size,
  SECTOR_SIZE)), so the sector rounding\nusually absorbs the over-read -- but when
  attr_list_size is a multiple of\nSECTOR_SIZE there is no slack and a crafted $MFT
  attribute list produces an\nout-of-bounds read at mount time.\n\nValidat"
