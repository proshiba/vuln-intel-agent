title: Apache ActiveMQ Artemis before 2.34.0 contains an unsafe reflection 
  vulnerability in FederationStreamConnectMessage.getFederationPolicy(). The 
  method calls Class.forName(clazz).getConstructor().newInstance() where clazz 
  is read directly from the CORE protocol wire buffer without type validation. 
  An authenticated federation peer can send a FEDERATION_DOWNSTREAM_CONNECT 
  packet with a crafted class name, causing the broker to load and instantiate 
  arbitrary classes visible to the Artemis module classloader. Static 
  initializers (<clinit>) and no-argument constructors (<init>()) execute as 
  side effects before the type cast, enabling denial of service via 
  system-property poisoning, out-of-memory conditions via classloading, or 
  broker state manipulation.
