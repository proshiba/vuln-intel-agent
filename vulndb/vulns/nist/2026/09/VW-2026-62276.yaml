title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/server:
  abort initialization when proc setup fails\n\nksmbd_server_init() calls ksmbd_proc_init()
  before creating the\nremaining proc entries and server subsystems. ksmbd_proc_init()
  tears\ndown partial state on a procfs or percpu_counter allocation failure,\nbut
  returns void, so ksmbd_server_init() continues as if the counters\nwere usable.\n\
  \nOnce userspace starts the server, server_ctrl_handle_init() calls\nksmbd_proc_reset(),
  which reaches percpu_counter_set() with a NULL\nper-CPU counters pointer on SMP
  systems. The later ksmbd_proc_create()\ncalls also receive a NULL parent and may
  create entries in the /proc\nroot; ksmbd_proc_cleanup() cannot remove those entries
  because\nksmbd_proc_fs is NULL."
