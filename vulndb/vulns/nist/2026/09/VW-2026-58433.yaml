title: "In the Linux kernel, the following vulnerability has been resolved:\n\naudit:
  avoid dropping live tree ref on fsnotify rule autoremove\n\naudit_del_rule() is
  used for both netlink deletion templates and internal\nfsnotify autoremove.  The
  former passes a parsed template which owns a\ntemporary tree reference; the latter
  passes the installed entry itself.\n\nThe unconditional audit_put_tree() at the
  end of audit_del_rule() assumes\nthe template case.  For mixed AUDIT_DIR plus AUDIT_EXE
  rules, an fsnotify\nautoremove event therefore drops the installed rule's live tree
  reference.\nRepeating this across rules sharing the same tree can free the tree
  while\nanother rule still references it, and a later autoremove dereferences the\n\
  freed pathname while comparing rules.\n\nMove the temporary-tree put to audit_rule_change(),
  the caller that owns\ndeletion templates.  Keep it in the AUDIT_DEL_RULE cleanup
  so both\nsuccessful deletion and -ENOENT still release the parser-owned tree.\n\n\
