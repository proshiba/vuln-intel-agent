title: BentoPDF is a client-side PDF toolkit that is self hostable. In 2.8.6 and
  earlier, the certificate and timestamp CORS proxy in 
  cloudflare/cors-proxy-worker.js uses isPrivateOrReservedHost() to validate a 
  supplied hostname separately from the DNS resolution used by fetch(targetUrl),
  allowing an attacker-controlled hostname to resolve to an internal or reserved
  destination after validation. A certificate-like path can satisfy 
  ALLOWED_PATH_PATTERNS, and direct clients can forge the browser-oriented 
  Origin header. Deployments without PROXY_SECRET skip the optional signature 
  check, while the signature is an anti-abuse measure rather than a 
  destination-security boundary. The proxy has a 10 MB response limit and can 
  relay response bodies from reachable destinations. The advisory identifies 
  both the official Worker deployment and self-hosted instances as impacted 
  where the Worker execution environment can reach internal or reserved 
  destinations. This vulnerability is fixed in 2.8.7.
