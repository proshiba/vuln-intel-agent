title: An authenticated command injection vulnerability exists in OP5 Monitor 
  through version 7.1.9 via the 'cmd_str' parameter in the command_test.php 
  endpoint. A user with access to the web interface can exploit the 'Test this 
  command' feature to execute arbitrary shell commands as the unprivileged web 
  application user. The vulnerability resides in the configuration section of 
  the application and requires valid login credentials with access to the 
  command testing functionality. This issue is fixed in version 7.2.0.
