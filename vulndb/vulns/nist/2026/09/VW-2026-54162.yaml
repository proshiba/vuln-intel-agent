title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  nci: fix uninit-value in the RF discover/activated NTF handlers\n\nnci_rf_discover_ntf_packet()
  and nci_rf_intf_activated_ntf_packet() each\nparse a notification into an on-stack
  struct (nci_rf_discover_ntf /\nnci_rf_intf_activated_ntf) that is not initialised.
  The RF\ntechnology-specific parameters are only extracted when\nrf_tech_specific_params_len
  is non-zero, so a notification that reports a\nzero length leaves the rf_tech_specific_params
  union uninitialised - and\nboth handlers then pass it to nci_add_new_protocol(),
  which reads it:\n\n - discover:  nci_add_new_target() -> nci_add_new_protocol();\n\
  \ - activated: nci_target_auto_activated() -> nci_add_new_protocol().\n\nnci_add_new_protocol()
  uses nfca_poll->nfcid1_len as both a branch\ncondition and a memcpy() length and
  copies nfcid1/sens_res/sel_res into\nndev->targets, which is later exposed to user
  space via NFC_CMD_GET_TARGET.\n\n  BUG: KMSAN: uninit-value in nci_add_ne"
