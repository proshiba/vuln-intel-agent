title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  don't leak new_bp if xfs_btree_bload_drop_buf fails\n\nLOLLM observes that in xfs_btree_bload_prep_block,\n\
  xfs_btree_bload_drop_buf can hit an IO error if writing the delwri\nbuffer list
  to disk fails.  In this case, we fail to release new_bp,\nwhich means we lose a
  locked buffer.  Fix that."
