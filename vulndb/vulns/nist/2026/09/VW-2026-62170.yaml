title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  bound qdisc_pkt_len to prevent qdisc soft lockup\n\nqdisc_get_stab() accepts a user-supplied
  size table, and\n__qdisc_calculate_pkt_len() amplifies qdisc_pkt_len() through the\n\
  overhead, the size-table data (u16), and size_log (up to\nSTAB_SIZE_LOG_MAX). A
  crafted stab can therefore set qdisc_pkt_len()\nto ~1 GiB for an ordinary skb. Per-flow
  deficit schedulers such as\nDRR and ETS replenish one quantum per loop iteration;
  with a tiny\nquantum (1) they spin billions of times under the qdisc lock,\nproducing
  a soft lockup / RCU stall as illustrated by vega@nebusec.ai.\n\nCap the final qdisc_pkt_len()
  to QDISC_PKT_LEN_MAX so the size-table\namplification cannot drive deficit schedulers
  into an unbounded loop.\nA legitimate size table (e.g. qfq's overhead 999999999,
  which is\nhandled by dropping) is still accepted.\n\nIntroduce cap QDISC_PKT_LEN_MAX
  (1 << 20) = 1 MiB which is well above\nany legitimate single-skb wire length: "
