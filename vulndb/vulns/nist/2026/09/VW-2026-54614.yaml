title: A vulnerability was determined in diem-project diem up to 5.1.3. This 
  affects the function executeCommand of the file 
  dmAdminPlugin/modules/dmConsole/actions/actions.class.php of the component 
  dmConsole. This manipulation of the argument dm_command causes cross-site 
  request forgery. The attack may be initiated remotely. The exploit has been 
  publicly disclosed and may be utilized. The project was informed of the 
  problem early through an issue report but has not responded yet.
