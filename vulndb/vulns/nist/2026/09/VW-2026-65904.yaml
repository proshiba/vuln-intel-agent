title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix cifsFileInfo reference leak in deferred close\n\nWhen cifs_close() defers
  a close, it hands the cifsFileInfo reference\nof the closing struct file to the
  queued work. Each execution of\nsmb2_deferred_work_close() drops one such reference.\n\
  \ndeferred_close_scheduled can be false while the work is pending: the\nworkqueue
  clears PENDING when the callback starts to run, before the\ncallback clears the
  flag under deferred_lock. A close in that\ninterval requeues the running work, and
  the callback then clears the\nflag, leaving the requeued work pending with the flag
  down. A later\ncifs_open() can reuse the handle and its cifs_close() reaches the\n\
  same branch: queue_delayed_work() fails because the work is still\npending, but
  cifs_close() returns without dropping the closing file's\nreference. The cifsFileInfo
  count stays pinned and its tlink, dentry\nand server handle are leaked.\n\nCheck
