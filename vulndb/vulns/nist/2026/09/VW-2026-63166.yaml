title: "gptp_mi_qualify_announce() in subsys/net/l2/ethernet/gptp/gptp_mi.c walks
  the Path Trace TLV of a received IEEE 802.1AS Announce message, comparing each clock
  identity against the local one. The loop bound was taken solely from the attacker-controlled
  wire field announce->steps_removed (accepted up to 254), never from announce->tlv.len,
  which is the field that states how many identities the TLV actually carries. Because
  path_sequence is the flexible member of the wire TLV (struct gptp_path_trace_tlv)
  and GPTP_ANNOUNCE() yields a raw pointer into the received packet buffer, the memcmp()
  inside the loop can address memory well past the end of the received frame.\n\n\
  The stack's only length validation, GPTP_ANNOUNCE_CHECK_LEN(), requires the received
  gPTP payload to be exactly 68 + tlv.len bytes — so it does not constrain the loop,
  it guarantees the data is absent. An unauthenticated attacker on the same Ethernet
  segment can send a single Announce frame declaring tlv.len = 0 with steps_remov"
