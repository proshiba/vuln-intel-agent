title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  initialise args->total for parent pointer updates\n\nxfs_parent_da_args_init() builds
  an xfs_da_args from a zeroed\nxfs_parent_args (kmem_cache_zalloc), leaving args->total
  == 0.\nxfs_da_grow_inode_int() treats that field as a running block reservation\n\
  and subtracts from it; because it is an xfs_extlen_t (uint32_t), the\nfirst attr-fork
  growth wraps it to ~0U.  That defeats the free-space\ncheck in xfs_alloc_space_available(),
  and when it coincides with an AG\nthat has exactly zero available blocks the allocation
  is clamped to\nmaxlen 0 and returns -ENOSPC, which xfs_defer_finish_noroll() escalates\n\
  to a filesystem shutdown.\n\nSet args->total the way the log recovery path does\n\
  (xfs_attri_recover_work(), xfs_attr_item.c:706), in the add and replace\npaths that
  can grow the fork.  Removals and lookups never grow it, so\nthey leave the field
  alone, matching that switch."
