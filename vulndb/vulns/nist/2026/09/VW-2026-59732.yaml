title: A security vulnerability has been detected in GNU Binutils 2.47. Affected
  is the function elf_x86_64_common_section_index of the file bfd/elf64-x86-64.c
  of the component ELF Section Handler. The manipulation leads to null pointer 
  dereference. The attack needs to be performed locally. The exploit has been 
  disclosed publicly and may be used. Upgrading to version 2.48 is able to 
  address this issue. The identifier of the patch is 
  7322e9bc30cb282575a701c307851fd3d66fee68. It is suggested to upgrade the 
  affected component.
