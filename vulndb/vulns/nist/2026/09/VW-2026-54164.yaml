title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  nci: add data_len bound checks to activation parameter extractors\n\nnci_extract_activation_params_iso_dep()
  and\nnci_extract_activation_params_nfc_dep() read an inner length byte from\nthe
  NCI RF_INTF_ACTIVATED_NTF payload and use it to memcpy() into fixed\nkernel buffers,
  but neither function receives the caller-validated\nactivation_params_len.  A crafted
  NCI notification with\nactivation_params_len=1 and an inner length byte of up to
  20 (NFC-A) or\n50 (NFC-B) causes memcpy() to read that many bytes past the one valid\n\
  byte in the activation params region -- a slab out-of-bounds read of\nkernel memory
  adjacent to the NCI skb.\n\nThe sibling nci_extract_rf_params_*() family was given
  equivalent\nprotection by commit 571dcbeb8e63 (\"net: nfc: nci: Fix parameter\n\
