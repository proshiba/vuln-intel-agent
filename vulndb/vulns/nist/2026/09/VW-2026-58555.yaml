title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntimers/itimer:
  Zero-init old itimerval before copy to userspace\n\nOn native sparc64, struct __kernel_old_timeval
  contains a four-byte hole\nafter tv_usec because tv_sec is 64-bit while __kernel_suseconds_t
  is 32-bit.\nput_itimerval() fills only the named fields in a stack-allocated\n__kernel_old_itimerval
  and copies the entire object to userspace, so\ngetitimer() can expose the two padding
  holes.\n\nZero-initialize the aggregate before assigning the fields so implicit\n\
  padding is deterministic before it crosses the user/kernel boundary."
