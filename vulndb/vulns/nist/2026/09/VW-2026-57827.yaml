title: Suricata is a network Intrusion Detection System, Intrusion Prevention 
  System and Network Security Monitoring engine. Prior to versions 7.0.16 and 
  8.0.5, a protocol change while processing HTTP/2 traffic could lead to type 
  confusion in Suricata. Crafted traffic may cause Suricata to crash, resulting 
  in denial of service. Versions 7.0.16 and 8.0.5 contain a fix. As a 
  workaround, disable HTTP/2 parsing if it is not required.
