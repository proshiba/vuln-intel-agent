title: Kyverno before 1.16.4 automatically attaches the admission controller's 
  ServiceAccount token to outbound HTTP requests in apiCall service mode without
  explicit authorization headers. Attackers can exfiltrate the token by 
  directing apiCall requests to external or attacker-controlled endpoints, 
  gaining full control over Kyverno policies and cluster resources.
