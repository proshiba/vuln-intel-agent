title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, HTTP-exposed Jira and 
  Confluence upload tools pass a caller-provided file_path to local file 
  operations without restricting it to the workspace. A remote MCP caller with 
  tool access can cause the server to read sensitive local files and upload them
  as Atlassian attachments. The advisory traces the vulnerable input and 
  processing flow through streamable-http, upload_attachment, and file_path, 
  which identify the affected entry points, controls, and code paths. This issue
  is fixed in version 0.22.0.
