title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  libipw: fix key index receive bound checks\n\nlibipw_rx() reads skb->data[hdrlen
  + 3] to extract the WEP key index in\nboth the software-decrypt key selection path
  and the hardware-decrypted\nIV/ICV strip path. In both places the existing guard
  only checks\nskb->len >= hdrlen + 3, which proves bytes up to hdrlen + 2 but not
  the\nbyte at hdrlen + 3.\n\nRequire hdrlen + 4 bytes before reading that item in
  both paths. This is\na local source-boundary check only; it does not change the
  key index\nsemantics."
