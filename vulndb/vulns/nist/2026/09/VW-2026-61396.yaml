title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SEV: Forcefully invalidate SNP VMSA if its backing gmem page is zapped\n\nWire up
  a gmem_invalidate_range() call for SNP VMs, and use it to force\nvCPUs to reload/recheck
  their guest-provided VMSA if the backing gmem\npage is being invalidated, e.g. is
  being PUNCH_HOLE'd.  Use the same core\nlogic to handle invalidations as VMX does
  for the APIC-access page, as the\ntwo concepts are nearly identical: shove the physical
  address of a page\ninto the vCPU's control structure:\n\n 1. Snapshot the invalidation
  sequence counter\n 2. Grab the pfn (from guest_memfd in this case)\n 3. Acquire
  mmu_lock for read\n 4. Re-request reload if retry is needed, otherwise commit the
  change.\n\nNote, the re-request action in #4 is necessary as KVM's retry logic is\n\
  fuzzy, i.e. can get false positives.  If the guest_memfd page has been\ndropped,
  at some point a subsequent reload will fail to get a PFN from\nguest_memfd, and
