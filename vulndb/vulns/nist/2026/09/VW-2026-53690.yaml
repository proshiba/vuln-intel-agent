title: "OpenList a file list program that supports multiple storage. Prior to 4.2.3,
  OpenList's offline-download feature at POST /api/fs/add_offline_download with tool:
  \"SimpleHttp\" accepts an attacker-supplied URL and saves its bytes under a per-task
  temporary directory before transferring them to the user's destination storage.
  The temporary filename comes from the attacker-controlled Content-Disposition header,
  is passed from parseFilenameFromContentDisposition in internal/offline_download/http/util.go
  to filepath.Join(task.TempDir, filename) in SimpleHttp.Run in internal/offline_download/http/client.go,
  and is opened with os.Create without a containment check. Because filepath.Join
  cleans .. segments, a non-admin user with PermAddOfflineDownload on any path can
  traverse out of task.TempDir and create, truncate, or overwrite any file writable
  by the OpenList process whose parent directory already exists. The server/handles/offline_download.go
  AddOfflineDownload route uses normal user authen"
