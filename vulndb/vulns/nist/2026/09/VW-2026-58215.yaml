title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  hp-bioscfg: fix heap OOB read in sk_store() and kek_store()\n\nsk_store() and kek_store()
  strip a trailing newline from the sysfs\nwrite before allocating the key buffer:\n\
  \n\tlength = count;\n\tif (buf[length - 1] == '\\n')\n\t\tlength--;\n\tbioscfg_drv.spm_data.signing_key
  = kmemdup(buf, length, GFP_KERNEL);\n\nbut then pass the original \"count\" (not
  \"length\") as the copy size to\nhp_wmi_perform_query(), which memcpy()s that many
  bytes out of the\n\"length\"-sized allocation, reading one byte past it whenever
  the write\nends in a newline, the normal case for a shell \"echo\" into sysfs.\n\
  \nKASAN confirms this directly:\n\n  BUG: KASAN: slab-out-of-bounds in hp_wmi_perform_query+0x1e9/0x460
  [hp_bioscfg]\n  Read of size 28 at addr ffff88813c8e2b80 by task python3/16022\n\
  \  ...\n  sk_store+0xa7/0x240 [hp_bioscfg]\n  kernfs_fop_write_iter+0x3e1/0x5d0\n\
  \  ...\n  The buggy address is located 0 bytes inside of\n  allocated 27-byte region
  [ffff8"
