title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: isp1704_charger: cancel work on remove\n\nThe USB notifier and initial VBUS
  detection can schedule isp->work. The\nremove path unregisters the notifier and
  power supply, but does not wait\nfor queued or running work before tearing down
  the power supply state.\n\nCancel the work after unregistering the notifier. Do
  this before\nunregistering the power supply.\n\nThis issue was found by a static
  analysis tool."
