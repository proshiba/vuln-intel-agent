title: "Any host on the LAN can send two mDNS records and make the responder write
  past the end of its\n\n\n\ntransmit packet.\n\n\n\nThe string table stores each
  name in a slot rounded up to a multiple of four:\n\n\n\n```c\n\n\n\n/* addons/mdns/nxd_mdns.c:11436,
  11443, 11447 */\n\n\n\nmemory_len = ((memory_len & 0xFFFFFFFC) + 8) & 0xFFFFFFFF;\n\
  \n\n\n...\n\n\n\nlen = *((USHORT*)(p - 2));           /* slot size, not string length
  */\n\n\n\nif ((len == memory_len) && ... _nx_mdns_name_match(start, memory_ptr,
  memory_size) ...)\n\n\n\n```\n\n\n\nThe lookup that decides whether an incoming
  name is already stored compares the rounded slot size,\n\n\n\nso names of 12, 13,
  14 and 15 characters share one bucket. A second name in the bucket is answered\n\
  \n\n\nwith the pointer to the first, and the record then carries a string up to
  three bytes longer than\n\n\n\nthe length the caller accounted for. `_nx_mdns_packet_rr_add`
  (nxd_mdns.c:8911) sizes its only\n\n\n\nbound check from that stale length, and
  `_nx_mdns_name_string_encode` writes the real string.\n\n\n"
