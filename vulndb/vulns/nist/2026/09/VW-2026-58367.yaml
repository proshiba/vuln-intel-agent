title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-io:
  report non-retryable errors separatedly\n\nThe error codes BLK_STS_NOTSUPP and BLK_STS_INVAL
  should not cause leg\nfailure on dm-raid1. This patch changes the interface to dm-io,
  so that\nit reports two error bitmaps - error_bits and unsup_bits. The unsup_bit\n\
  bitmap tracks BLK_STS_NOTSUPP or BLK_STS_INVAL errors, the error_bits\nbitmap tracks
  all the other errors.\n\ndm-raid1 is changed so that it won't fail a leg if it receives
  an error\nin the unsup_bits bitmap.\n\nThis patch (with 62dc37a819a5) fixes misbehavior
  if the user uses\nunaligned bio vectors on dm-raid1."
