title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  universal-pidff: stop the device when force-feedback init fails\n\nuniversal_pidff_probe()
  starts the device with hid_hw_start() and then, if\nforce-feedback initialisation
  fails, returns the error through a label that\nonly does \"return error\".  The
  device is left started.\n\nThe HID core does not unwind on the driver's behalf.\
  \  __hid_device_probe()\nreleases the devres group, closes the report and clears
  hdev->driver:\n\n\tif (ret) {\n\t\tdevres_release_group(&hdev->dev, hdev->devres_group_id);\n\
  \t\thid_close_report(hdev);\n\t\thdev->driver = NULL;\n\t}\n\nThe hidraw character
  device that hid_hw_start() registered through\nhid_connect() is allocated with kzalloc()
  and added with cdev_device_add(),\nso it is not devres-managed and survives that.\
  \  With hdev->driver NULL,\nhid_device_remove() skips hid_hw_stop() as well, because
  it only unwinds\nwhile a driver is still attached.  The registration therefore outlives
  the\ndevice on both paths."
