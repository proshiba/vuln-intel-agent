title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtl8xxxu: fix use-after-free from rx_urb_wq on stop\n\nrtl8xxxu arms rx_urb_wq from
  the RX completion path:\nrtl8xxxu_rx_complete() hands the URB to rtl8xxxu_queue_rx_urb(),
  which\nqueues it on rx_urb_pending_list and, once the list grows past\nRTL8XXXU_RX_URB_PENDING_WATER,
  schedules rx_urb_wq.  The worker\nrtl8xxxu_rx_urb_work() drains rx_urb_pending_list,
  recovers priv through\ncontainer_of, and resubmits each URB through rtl8xxxu_submit_rx_urb(),\n\
  which anchors it on rx_anchor and dereferences priv->udev.\n\nrtl8xxxu_stop() cancels
  the sibling work items (c2hcmd_work, ra_watchdog,\nupdate_beacon_work) but never
  cancels rx_urb_wq, so a worker armed during\nthe last burst of RX traffic can run
  rtl8xxxu_rx_urb_work() after\nrtl8xxxu_disconnect() has called ieee80211_free_hw(),
  which frees priv,\nproducing a use-after-free.  The window opens under active RX
  traffic\n(pending count above the watermark) followed by a disconnect."
