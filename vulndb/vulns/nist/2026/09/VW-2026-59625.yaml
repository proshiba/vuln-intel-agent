title: A vulnerability was found in GPAC 26.07.0. Affected by this vulnerability
  is the function gf_node_unregister of the file scenegraph/base_scenegraph.c of
  the component MP4Box. The manipulation results in use after free. The attack 
  is only possible with local access. The exploit has been made public and could
  be used. Upgrading to version abi-16.23 addresses this issue. The patch is 
  identified as 9eb40df4448b88d6a6ce3454657c06f47eff0b24. Upgrading the affected
  component is advised.
