title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix fcache_disposal UAF by inlining dispose state into nfsd_net\n\nnfsd_file_dispose_list_delayed()
  defers fput() to nfsd service threads\nvia a per-net freeme queue, preventing the
  shrinker and GC worker from\nbearing the cost of closing files (see ffb402596147).\
  \  However, the\nqueue lives in a separately-allocated struct nfsd_fcache_disposal
  that\nis freed by nfsd_free_fcache_disposal_net() during per-net teardown.\nThe
  global shrinker, laundrette, and fsnotify callbacks can still be\ninside nfsd_file_dispose_list_delayed()
  dereferencing that pointer,\ncausing a use-after-free.\n\nInline the spinlock and
  freeme list directly into struct nfsd_net (as\nfcache_dispose_lock and fcache_dispose_list),
  eliminating the separately\nallocated struct nfsd_fcache_disposal entirely.  These
  fields now have\nthe same lifetime as the net namespace itself, so there is no dangling\n\
  pointer to chase.\n\nnfsd_file_cache_start_net() now just initi"
