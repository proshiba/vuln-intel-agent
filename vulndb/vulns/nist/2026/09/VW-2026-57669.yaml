title: "A missing S3 bucket ownership verification in the AWS Security Agent plugin
  in Amazon aws-agents-for-devsecops before 1.1.0 might allow remote attackers to
  obtain the private source archive of a scanned workspace, including credentials
  and infrastructure state contained in that archive, via a pre-registered storage
  bucket whose name is derived from a publicly known account identifier.\n\n\n\nTo
  remediate this issue, users should upgrade to version 1.1.0. Users should also verify
  that the scan output bucket in their account is owned by their own account, because
  upgrading does not release a bucket name that a third party has already registered."
