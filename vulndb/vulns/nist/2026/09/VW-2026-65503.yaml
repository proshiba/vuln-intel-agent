title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio-fs:
  avoid double-free on failed queue setup\n\nvirtio_fs_setup_vqs() allocates fs->vqs
  and fs->mq_map before calling\nvirtio_find_vqs(). If virtio_find_vqs() fails, the
  error path frees both\npointers and returns an error to virtio_fs_probe().\n\nvirtio_fs_probe()
  then drops the last kobject reference, and\nvirtio_fs_ktype_release() frees fs->vqs
  and fs->mq_map again. This leaves\ndangling pointers in struct virtio_fs and can
  trigger a double-free during\nprobe failure cleanup.\n\nSet fs->vqs and fs->mq_map
  to NULL immediately after kfree() in the\nvirtio_fs_setup_vqs() error path so that
  the later kobject release sees an\nuninitialized state and kfree(NULL) becomes harmless.\n\
  \nThis can be reproduced when a broken virtio-fs device advertises more\nrequest
  queues than the transport actually provides. In that case\nvirtio_find_vqs() fails
  while setting up the extra queue, and the probe\npath reaches the double-free cleanup
  sequen"
