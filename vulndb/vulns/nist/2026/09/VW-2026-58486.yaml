title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  block non-SAVEFH ops after FOREIGN PUTFH to prevent NULL deref\n\nWhen CONFIG_NFSD_V4_2_INTER_SSC
  is enabled, nfsd4_putfh() can return\nsuccess with fh_dentry and fh_export both
  NULL if fh_verify() returns\nnfserr_stale and putfh->no_verify is true. The NFSD4_FH_FOREIGN
  flag\nis set, but the compound dispatch loop only uses this flag to bypass\nthe
  nfserr_nofilehandle check -- it does not prevent subsequent ops\nfrom running with
  a NULL fh_dentry.\n\nA remote client can exploit this by crafting a COMPOUND that
  includes\nan inter-SSC COPY (which causes check_if_stalefh_allowed() to set\nno_verify=true
  on the saved PUTFH) with an additional op inserted\nbetween the source PUTFH and
  SAVEFH. For example, SETATTR calls\nfh_want_write() which dereferences fh_export->ex_path.mnt
  without\ncalling fh_verify() first, causing a NULL pointer dereference in the\n\
