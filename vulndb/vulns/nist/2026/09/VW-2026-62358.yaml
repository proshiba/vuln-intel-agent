title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fix integer overflow in verify_tags() bounds check\n\nverify_tags() validates the
  tagset table unpacked from a policy blob.\nFor each set it reads a count and checks
  that advancing the index by\nthat count stays inside sets.table[]:\n\n\tu32 cnt
  = tags->sets.table[i];\n\n\tif (i+cnt >= tags->sets.size) {\n\ni, cnt and sets.size
  are all u32, so i+cnt is evaluated modulo 2^32.\nsets.table[] is filled by unpack_tagsets()
  with aa_unpack_u32(), so\nevery entry is a raw unbounded 32-bit word taken from
  the policy blob,\nand verify_tags() is the function that is supposed to validate
  it.  A\ncount close to U32_MAX makes the sum wrap to a small value, the guard\n\
  passes, and the inner loop then walks sets.table[++i] past the end of\nthe kcalloc(size,
  sizeof(u32)) allocation.\n\nNote that sets.size is bounded by 65535, because unpack_tagsets()
  reads\nit with aa_unpack_array() as a u16, so the wrap cannot be reached by\ngrowing
  the table; it"
