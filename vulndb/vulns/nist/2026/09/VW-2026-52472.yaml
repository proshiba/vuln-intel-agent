title: The Welcart e-Commerce plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'custom_order' parameter in all versions up to, 
  and including, 2.12.1 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. The injected payload is delivered via the guest checkout form, 
  requiring no authentication, and executes when an administrator views the 
  affected order in the WordPress admin panel.
