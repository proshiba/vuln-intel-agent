title: Gargoyle router management utility versions 1.5.x contain an 
  authenticated OS command execution vulnerability in /utility/run_commands.sh. 
  The application fails to properly restrict or validate input supplied via the 
  'commands' parameter, allowing an authenticated attacker to execute arbitrary 
  shell commands on the underlying system. Successful exploitation may result in
  full compromise of the device, including unauthorized access to system files 
  and execution of attacker-controlled commands.
