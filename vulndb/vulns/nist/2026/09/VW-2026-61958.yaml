title: The NeuVector admission webhook silently excludes containers from policy 
  evaluation when their image path matches one of three hardcoded service mesh 
  sidecar images. Since the image path is entirely controlled by the workload 
  author, any user capable of deploying workloads can evade admission deny rules
  simply by naming their image path after one of these sidecar images.
