title: A vulnerability was identified in mathurvishal CloudClassroom-PHP-Project
  up to 5dadec098bfbbf3300d60c3494db3fb95b66e7be. The affected element is an 
  unknown function of the file managevideos2.php of the component Faculty Video 
  Management. Such manipulation of the argument V_Title/V_Url/V_Remarks leads to
  cross site scripting. The attack may be performed from remote. The exploit is 
  publicly available and might be used. This product utilizes a rolling release 
  system for continuous delivery, and as such, version information for affected 
  or updated releases is not disclosed. The vendor was contacted early about 
  this disclosure but did not respond in any way.
