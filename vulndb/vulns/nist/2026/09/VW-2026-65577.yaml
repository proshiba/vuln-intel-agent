title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusbip:
  vhci_hcd: fix NULL deref in status_show_vhci\n\nplatform_get_drvdata() can return
  NULL if a VHCI host controller's\nprobe failed (e.g. due to USB bus number exhaustion).
  status_show_vhci()\nchecked for a NULL pdev but not for a NULL hcd returned by\n\
  platform_get_drvdata(). Passing NULL to hcd_to_vhci_hcd() does not\nreturn NULL
  - it returns a pointer offset of 0x260, causing a NULL\npointer dereference when
  that value is subsequently dereferenced.\n\nAdd a NULL check on hcd before calling
  hcd_to_vhci_hcd(). Move\nstatus_show_not_ready() above status_show_vhci() to make
  it callable\nfrom the new error path without a forward declaration."
