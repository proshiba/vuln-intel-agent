title: "The ITE it82xx2 USB device-controller driver initialized its bus-suspend detection
  work with k_work_init_delayable(&priv->suspended_work, suspended_handler) inside
  it82xx2_enable() (the driver's .enable op) in drivers/usb/udc/udc_it82xx2.c. This
  work item is scheduled essentially continuously while the USB bus is active: the
  interrupt handler reschedules it on every SOF frame and suspended_handler() reschedules
  itself, so its timeout node is normally linked in the kernel timeout list / a workqueue
  pending queue.\n\nk_work_init_delayable() (kernel/work.c) unconditionally overwrites
  the entire k_work_delayable structure, including its timeout and queue linkage,
  with no busy check. Because it82xx2_disable() does not cancel the work, a normal
  disable-then-enable cycle re-runs api->enable() (udc_enable() only rejects a redundant
  enable, not a re-enable after disable) and re-initializes the still-pending work
  in place, corrupting the kernel timeout/workqueue linked lists and causing a kernel
