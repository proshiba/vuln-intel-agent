title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngtp:
  serialize PDP context updates\n\nPDP contexts can be deleted through GTP_CMD_DELPDP
  or while the GTP\nnetwork device is being unregistered. The latter is serialized
  by RTNL,\nbut the generic-netlink delete path only holds RCU.\n\nRunning both paths
  concurrently can therefore make both paths delete the\nsame PDP context. The issue
  was found through static analysis and\nreproduced on a KASAN-enabled kernel by a
  simple two-thread program\nracing GTP_CMD_DELPDP against RTM_DELLINK:\n\n  Oops:
  general protection fault, probably for non-canonical address\n  KASAN: maybe wild-memory-access
  in range\n         [0xdead000000000120-0xdead000000000127]\n  RIP: gtp_genl_del_pdp+0x1c1/0x420
  [gtp]\n  RBP: dead000000000122\n\nThe second deletion dereferenced the poisoned
  hlist pprev pointer.\n\nSerialize gtp_pdp_add(), gtp_genl_del_pdp(), and gtp_dellink()
  with a\nshared mutex. Keep the mutex held until the final use of a PDP context in\n\
  the NEWPDP "
