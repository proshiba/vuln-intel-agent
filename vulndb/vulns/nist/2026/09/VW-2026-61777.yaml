title: 'Marten is a .NET Transactional Document DB and Event Store on PostgreSQL.
  From version 7.0.0 until 9.13.0, several Marten LINQ and tenant-management paths
  interpolate runtime, potentially attacker-controlled strings into single-quoted
  SQL literals without escaping or parameterization. The primary confirmed vector
  is a dictionary indexer key used by Where filters in src/Marten/Linq/Members/Dictionaries/DictionaryItemMember.cs.
  Additional affected sinks include SelectParser.cs, DatabaseScopedTenantPartitions.cs,
  and DeleteAllForTenant.cs reached through IEventStore.DeleteProjectionProgressAsync,
  while DictionaryContainsKeyFilter.cs (Newtonsoft serializer only; System.Text.Json
  is not affected) handles ContainsKey calls. Events/Daemon/Internals/EventLoader.cs
  contains a related per-tenant partition-pruning literal that the advisory identifies
  as a defense-in-depth sink. A crafted single quote can escape the generated literal,
