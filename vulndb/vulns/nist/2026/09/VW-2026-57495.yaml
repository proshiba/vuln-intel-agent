title: The Form Maker by 10Web – Mobile-Friendly Drag & Drop Contact Form 
  Builder plugin for WordPress is vulnerable to Reflected Cross-Site Scripting 
  via the bulk_action parameter in all versions up to, and including, 1.15.46 
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that execute if they can successfully trick a user into performing an 
  action such as clicking on a link.
