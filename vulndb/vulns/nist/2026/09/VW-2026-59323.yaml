title: "The ITE IT82xx2 USB device-controller driver (drivers/usb/udc/udc_it82xx2.c)
  mishandles multi-packet OUT transfers on non-control endpoints. In work_handler_out()
  the active transfer buffer is obtained with udc_buf_peek() (which does not dequeue
  it); when a full max-packet-size packet arrives but the buffer still has tailroom
  (the transfer is not yet complete), the pre-fix code both re-arms the endpoint to
  keep filling that same buf via work_handler_xfer_continue() and simultaneously hands
  the same, still-being-filled buffer to the upper stack with udc_submit_ep_event().\n\
  \nBecause udc_submit_ep_event() transfers ownership of the buffer to the USB device
  stack (usbd_event_carrier() appends &buf->node to uds_ctx->ep_events, after which
  the class handler processes and net_buf_unref()s it), the driver continues to DMA
  subsequent host-controlled OUT packets into a buffer the upper stack may already
  have freed and recycled — a use-after-free write. In addition, since the buffer
