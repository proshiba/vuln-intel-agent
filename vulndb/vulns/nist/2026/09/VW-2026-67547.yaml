title: "Apache Karaf exposes a JMX MBeanServer guarded by KarafMBeanServerGuard, which
  enforces role-based access control (RBAC) on MBean operations invoked over the remote
  JMX connector (RMI registry/server, enabled by default on ports 1099 and 44444).
  The guard is implemented as a java.lang.reflect.Proxy around the MBeanServer, and
  only forwards a fixed list of operation names to the RBAC check, defined in MBeanInvocationHandler#guarded:\n\
  \n\n  private final List<String> guarded = Collections.unmodifiableList( Arrays.asList(\"\
  invoke\", \"getAttribute\", \"getAttributes\", \"setAttribute\", \"setAttributes\"\
  ));\n\n\n\n\nThe MBean lifecycle operations MBeanServer#createMBean, #registerMBean and #unregisterMBean are
  not in this list. Calls to these methods are forwarded directly to the underlying MBeanServer with
  no role check at all, regardless of the roles configured in etc/jmx.acl.*.cfg.\n\
