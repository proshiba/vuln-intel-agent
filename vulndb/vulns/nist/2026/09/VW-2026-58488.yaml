title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  widen nfsd_genl_rqstp address fields to sockaddr_storage\n\nstruct nfsd_genl_rqstp
  declares rq_daddr and rq_saddr as plain\n\"struct sockaddr\" (16 bytes). When an
  IPv6 NFS client is connected,\nnfsd_genl_rpc_status_compose_msg() casts these fields
  to\n\"struct sockaddr_in6 *\" (28 bytes) and reads sin6_addr at offset 8..24,\n\
  which extends 8 bytes past the end of the 16-byte sockaddr field into\nthe adjacent
  rq_flags member. The 16-byte nla_put_in6_addr then ships 8\nbytes of truncated IPv6
  address followed by 8 bytes of rq_flags to\nuserspace via the NFSD_A_RPC_STATUS_SADDR6/DADDR6
  netlink attributes.\n\nThis is reachable by any unprivileged process in the network
  namespace\nbecause NFSD_CMD_RPC_STATUS_GET uses GENL_CMD_CAP_DUMP without\nGENL_ADMIN_PERM.\n\
  \nFix by widening rq_daddr and rq_saddr to struct sockaddr_storage so the\nIPv6
  casts operate within bounds, copying sizeof(struct sockaddr_storage)\nbytes in the
  memcpy calls so "
