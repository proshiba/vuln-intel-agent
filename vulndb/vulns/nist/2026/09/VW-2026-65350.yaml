title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Fix unmatched rn_unregister on failed accept\n\nWhen svc_rdma_accept() takes the
  errout path before\nrpcrdma_rn_register() has succeeded, the existing cleanup block\n\
  calls rpcrdma_rn_unregister(dev, &newxprt->sc_rn) unconditionally.\nsvcxprt_rdma
  is kzalloc'd, so on that path sc_rn.rn_index is 0 and\nsc_rn.rn_done is NULL; the
  unregister therefore xa_erase()s another\ncaller's slot 0 and performs an unmatched
  kref_put() on the\nrpcrdma_device's rd_kref.\n\nThe same errout also brackets the
  cleanup with svc_xprt_get()/\nsvc_xprt_put() around the kref_init() birth reference.
  The kref\ngoes 1 -> 2 -> 1 and never reaches 0, so the svcxprt_rdma (and the\nnet/ns_tracker
  it pinned) is leaked on every failed accept.\n\nrpcrdma_rn_register() writes rn->rn_done
  last, only after xa_alloc()\nand kref_get() have both succeeded, so rn_done == NULL
  is a natural\n\"never registered\" sentinel. Guard rpcrdma_rn_unregister() with
  an\nearly return"
