title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma: Initialize IRQ data before requesting IRQs\n\ndw_edma_irq_request() passes
  struct dw_edma_irq to request_irq() before\ndw_edma_channel_setup() fills the back
  pointer. A shared interrupt can\ntherefore enter the handler with dw_irq->dw still
  NULL, leading to a\nNULL pointer dereference.\n\nSet the back pointer before installing
  each handler."
