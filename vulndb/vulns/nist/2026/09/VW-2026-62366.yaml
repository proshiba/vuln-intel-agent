title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: free the advertising instance on the failure and cancel paths\n\nadv_timeout_expire()
  hands a kmalloc()ed instance byte to\nhci_cmd_sync_queue() with a NULL destroy callback,
  and only\nadv_timeout_expire_sync() frees it. That leaks on two paths:\n\n - the
  return value is not checked, and hci_cmd_sync_queue() does not\n   take ownership
  when it fails (-ENETDOWN, -ENODEV, -ENOMEM);\n\n - a cancelled entry is not released,
  as _hci_cmd_sync_cancel_entry()\n   does not free entry->data when there is no destroy
  callback.\n   hci_cmd_sync_clear() cancels every pending entry when the controller\n\
  \   is unregistered.\n\nFree the buffer from a destroy callback, and in the caller
  when the entry\ncould not be queued at all."
