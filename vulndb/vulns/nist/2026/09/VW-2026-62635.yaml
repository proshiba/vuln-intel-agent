title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/renesas-irqc:
  Fix generic interrupt chip leak on remove\n\nThe driver allocates domain generic
  chips probe. However, on driver\nremoval, the generic chips are not automatically
  freed when the interrupt\ndomain is removed because the domain flags do not include\n\
  IRQ_DOMAIN_FLAG_DESTROY_GC.\n\nThis causes both the domain generic chips structure
  and the associated\ngeneric chips to be leaked. Additionally, the generic chips
  remain on the\nglobal list and may later be accessed by generic interrupt chip suspend,\n\
  resume, or shutdown callbacks after the driver has been removed,\npotentially resulting
  in a use-after-free and kernel crash.\n\nFix the resource leak by setting IRQ_DOMAIN_FLAG_DESTROY_GC
  on the\ninterrupt domain; this lets the interrupt domain core automatically\nrelease
  all generic chips when irq_domain_remove() is invoked, removing\nthe need for manual
  cleanup calls in error paths and remove callback."
