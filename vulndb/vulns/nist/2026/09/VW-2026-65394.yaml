title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  skip extra isize expansion during mount to prevent deadlock\n\next4_try_to_expand_extra_isize()
  is called from __ext4_mark_inode_dirty()\nwhile holding an active jbd2 handle. \
  \ During mount (!SB_ACTIVE), the\nexpand path may move xattrs to external blocks
  and release ea_inodes via\niput().  When !SB_ACTIVE, iput() calls write_inode_now()
  which acquires\ns_writepages_rwsem, creating a circular lock dependency:\n\n  s_writepages_rwsem
  --> jbd2_handle --> xattr_sem --> s_writepages_rwsem\n\nThis can be triggered via:\n\
  \n  ext4_process_orphan() -> ext4_truncate() -> ext4_mark_inode_dirty()\n    ->
  ext4_try_to_expand_extra_isize()\n\nor:\n\n  ext4_evict_inode() -> ext4_mark_inode_dirty()\n\
  \    -> ext4_try_to_expand_extra_isize()\n\nSkip expansion when !SB_ACTIVE.  This
  is a minor loss of functionality\n(extra isize won't grow for these inodes during
  mount), which e2fsck\ncan resolve later if needed."
