title: The LearnDash LMS plugin for WordPress is vulnerable to authorization 
  bypass in versions 4.25.0 - 5.1.6. This is due to the plugin not properly 
  verifying that a user is authorized to perform an action. This makes it 
  possible for unauthenticated attackers to enroll arbitrary users in paid 
  courses without payment verification, bypassing the entire payment system and 
  gaining unauthorized access to premium educational content.
