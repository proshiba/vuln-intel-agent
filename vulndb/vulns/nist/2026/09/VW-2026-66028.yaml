title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_api: Don't replay RTM_GETCHAIN in tc_ctl_chain().\n\nIf a netlink socket sends
  RTM_GETCHAIN requests repeatedly\nwithout recv()ing the responses, tc_ctl_chain()
  hogs CPU and\ntriggers Hung Task splat. [0]\n\nAs caught in the stack trace, netlink_attachskb()
  could confuse\ntc_ctl_chain() by returning -EAGAIN when the userspace netlink\n\
  socket's receive buffer is full.\n\nThe replay: label exists since commit 32a4f5ecd738
  (\"net: sched:\nintroduce chain object to uapi\") but was not used initially.\n\n\
  Since commit 9f407f1768d3 (\"net: sched: introduce chain templates\"),\nthe label
  is needed for RTM_NEWCHAIN because tcf_proto_lookup_ops()\nmay release RTNL to call
  request_module().\n\nHowever, the replay logic is unnecessary for RTM_GETCHAIN.\n\
  \nLet's apply the replay logic only for RTM_NEWCHAIN.\n\n[0]:\nINFO: task repro:1018
  is blocked on a mutex likely owned by task repro:1022.\ntask:repro           state:R\
  \  running task     sta"
