title: "MISP has a security issue that could let an attacker change threat-intelligence
  data through a logged-in user’s browser without that user knowingly approving the
  change.\n\nThe affected function did not properly enforce MISP’s usual protection
  against forged requests. Because of this, an attacker could create a malicious webpage
  that silently sends a request to MISP when visited by an authenticated user.\n\n\
  If successful, the attacker could change details of an attribute, such as its value,
  type, category, comment, distribution settings, or related timestamps.\n\nThe attack
  requires the victim to already be logged in to MISP and to visit an attacker-controlled
  page.\n\nThe main impact is unauthorized modification of threat-intelligence data,
  which could lead to incorrect indicators, wrong classifications, or altered sharing
  settings and reduce confidence in the accuracy of the information stored in MISP.\n\
  \nVersion affected: <2.5.47"
