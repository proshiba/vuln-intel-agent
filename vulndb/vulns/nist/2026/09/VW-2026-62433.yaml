title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  validate inline xattrs during inode block validation\n\nPatch series \"ocfs2: validate
  xattr entry bounds\", v7.\n\nThis series validates OCFS2 xattr entry name/value
  bounds when xattr\nmetadata is read and validated, before getxattr() or listxattr()
  can walk\nout-of-range entry arrays or offsets from corrupted metadata.\n\n\nThis
  patch (of 2):\n\nocfs2_validate_inode_block() verifies a dinode before OCFS2 users
  walk\nmetadata from it, but inline xattr metadata is still checked only in\noperation-specific
  consumers.  The existing ibody lookup helper validates\ninline header placement
  and entry count, but inode block validation does\nnot reject entry name/value bounds.\n\
  \nAdd a flat xattr entry validator and call it from inode block validation\nfor
  inline xattrs.  Keep the operation paths on their existing\nheader/count lookup
  checks; the full entry bounds check now runs when the\ninode block is validated
  at read time.\n\nReject corrup"
