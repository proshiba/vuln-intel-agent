title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  fix integer overflow in ftp helper port/address parsing\n\nip_vs_ftp_get_addrport()
  accumulates decimal digits into a __u16\n(hport) and into unsigned char (p[]) without
  checking for overflow.\nA crafted FTP PASV/EPSV response with an over-long port
  or address\noctet wraps the value, so the helper configures the data connection\n\
  with a truncated port/address.\n\nThe netfilter conntrack FTP helper had the same
  defect, fixed in\ncommit 2b413fc689ba (\"netfilter: nf_conntrack_ftp: avoid u16\n\
  overflows\"). Apply the equivalent fix here: widen the port accumulator\nto u32
  and reject values above 65535, and reject address octets above\n255."
