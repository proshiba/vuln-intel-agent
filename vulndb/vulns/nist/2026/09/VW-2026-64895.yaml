title: Moquette is a lightweight Java MQTT broker. Prior to 0.18.1, when a 
  configured authenticator or authorizator class cannot be loaded, 
  Server.initializeAuthenticator and Server.initializeAuthorizatorPolicy treat 
  the failure as though no custom class was configured and fall back to 
  AcceptAllAuthenticator or PermitAllAuthorizatorPolicy. A misspelled class 
  name, missing dependency, constructor failure, or classpath problem can 
  therefore start the broker with authentication or authorization disabled even 
  though the operator configured those controls. This issue is fixed in version 
  0.18.1.
