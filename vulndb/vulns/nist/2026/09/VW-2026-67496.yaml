title: A path traversal vulnerability in Flatpak's handling of the files/etc 
  directory during app deployment allows a malicious Flatpak app to cause 
  certain host system files (such as passwd, group, machine-id, or resolv.conf) 
  to be emptied or replaced with a symlink when the app is installed or 
  upgraded. In system-wide installations, the write is performed as root.
