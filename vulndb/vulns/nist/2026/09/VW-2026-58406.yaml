title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  fix info-leak on partial LZNT decompress in ni_read_frame()\n\nni_read_frame() decompresses
  an LZNT $DATA frame into the vmapped target\npages and then trusts decompress_lznt()'s
  return value:\n\n  unc_size = decompress_lznt(frame_ondisk, ondisk_size, frame_mem,\n\
  \                             frame_size);\n  if ((ssize_t)unc_size < 0)       \
  \ err = unc_size;\n  else if (!unc_size || unc_size > frame_size)  err = -EINVAL;\n\
  \ndecompress_lznt() stops as soon as the compressed stream is exhausted\n(e.g. a
  zero chunk header) and returns the number of bytes it actually\nwrote, which may
  be far less than frame_size. The bytes between unc_size\nand frame_size are never
  written. The only memset() that follows zeroes\nthe region beyond i_valid; when
  the frame lies entirely within the file's\nvalid size that memset() does not run,
  so the gap retains whatever was in\nthe just-vmapped pages. All pages are then marked
  uptodate and returned"
