title: Metaphor Creations Ditty (ditty-news-ticker) before 3.1.70 contains a 
  stored cross-site scripting vulnerability that allows authenticated users with
  Author-level privileges or higher to inject arbitrary HTML elements by 
  supplying malicious wrapper attribute values in layout tags. The 
  ditty_layout_render_tag_wrapper() function inserts caller-supplied wrapper 
  attribute values directly as HTML element names without allowlist validation, 
  bypassing wp_kses_post() sanitization because KSES runs at save time before 
  layout tag attributes are resolved at render time, causing the payload to 
  execute in the browser of any visitor viewing posts or pages embedding the 
  affected Ditty item.
