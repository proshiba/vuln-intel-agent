title: RabbitMQ amqp091-go is a Go AMQP 0.9.1 client. Prior to 1.13.0, 
  Connection.openTune in connection.go accepts a server-advertised FrameMax 
  below the AMQP frameMinSize value of 4096 bytes because the connection 
  negotiation loop does not enforce the protocol minimum. A malicious or 
  compromised AMQP broker can therefore advertise an extremely small FrameMax, 
  causing later client publications to be fragmented into excessive numbers of 
  frames and write operations. This can consume CPU and stall the client or its 
  host. This issue is fixed in version 1.13.0.
