title: A vulnerability has been found in D-Link DIR-X1860Z up to 
  1.0.2.220120.165402. Affected is the function 
  routerd.wificfg_get/routerd.get_rand_key of the component ubus JSON-RPC 
  interface. Such manipulation leads to information disclosure. The attack must 
  be carried out from within the local network. Upgrading to version 
  1.0.7.260821.161908 is able to address this issue. It is suggested to upgrade 
  the affected component. This vulnerability only affects products that are no 
  longer supported by the maintainer.
