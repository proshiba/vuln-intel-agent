title: In AVideo through 29.0, the CloneSite plugin is vulnerable to stored OS 
  command injection. In plugin/CloneSite/cloneClient.json.php (line ~270) the 
  stored SSH password is substituted into the command string `sshpass -p 
  '{password}' rsync ...` with a plain str_replace and no escaping, so a single 
  quote in the password breaks out of the quoted word and injects arbitrary 
  shell. The password is written through the admin-only endpoint 
  objects/pluginAddDataObject.json.php, whose only CSRF defense 
  (isUntrustedRequest()/forbidIfIsUntrustedRequest()) is a no-op when the 
  request source appears to be loopback — as happens behind a same-host 
  TLS-terminating reverse proxy with $global['trustedProxies'] unset — or when 
  an attacker-controlled application is co-hosted on the same hostname; on HTTPS
  the session cookie is issued with SameSite=None, so a cross-site POST carries 
