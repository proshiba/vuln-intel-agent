title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmodule/dups:
  Fix use-after-free in kmod_dup_req lifetime handling\n\nThe kmod dups code uses
  RCU to ensure that a kmod_dup_req instance is freed\nonly after it is no longer
  referenced. When releasing an instance, the\nkmod_dup_request_delete() function
  removes the kmod_dup_req from the\ndup_kmod_reqs list, waits via synchronize_rcu()
  and finally frees it.\nHowever, this doesn't work correctly because parallel users
  referencing the\ninstance in kmod_dup_request_exists_wait() don't enter an RCU read-side\n\
  critical section. This can result in a use-after-free.\n\nThe kmod_dup_request_exists_wait()
  function may need to hold a valid\nreference to a kmod_dup_req instance across a
  blocking wait until the\ncorresponding modprobe command completes. This makes it
  unsuitable for RCU.\n\nFix the issue by changing the lifecycle management of kmod_dup_req
  to use\nreference counting."
