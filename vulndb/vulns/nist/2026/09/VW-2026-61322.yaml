title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb_cma:
  fix null nodemask dereference in hugetlb_cma_alloc_frozen_folio\n\nalloc_buddy_hugetlb_folio_with_mpol()
  can pass a NULL nodemask to\nalloc_fresh_hugetlb_folio() as a fallback to allocate
  from all nodes.  If\norder is gigantic, alloc_fresh_hugetlb_folio() propagates the
  NULL\nnodemask down to hugetlb_cma_alloc_frozen_folio() via\nalloc_gigantic_frozen_folio().\n\
  \nAdditionally, hugetlb_cma_alloc_frozen_folio() previously attempted\nallocation
  on hugetlb_cma[nid] without verifying if nid is included in the\ncaller's nodemask.\
  \  Adding a node_isset(nid, *nodemask) check ensures the\ninitial preferred node
  allocation honors the memory policy / nodemask.\n\nHowever, hugetlb_cma_alloc_frozen_folio()
  dereferences the nodemask in\nnode_isset(nid, *nodemask) and for_each_node_mask(node,
  *nodemask),\nleading to a null pointer dereference kernel panic when nodemask is
  NULL.\n\nFix this by checking if nodemask is NULL in\nhugetlb_cm"
