title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mctp: i3c: serialize probe with bus removal\n\nmctp_i3c_probe() drops busdevs_lock
  after finding the matching bus. A\nconcurrent I3C_NOTIFY_BUS_REMOVE can then unregister
  and free the bus\nnetdev before probe passes its private data to mctp_i3c_add_device().\n\
  The latter consequently adds a list node through a freed mbus pointer.\n\nKeep busdevs_lock
  held until the device has been added. This also\nsatisfies the __must_hold annotation
  on mctp_i3c_add_device()."
