  function load_info/_read_torch_data of the file utils.py. Performing a 
  manipulation of the argument path results in deserialization. The attack can 
  be initiated remotely. The exploit is now public and may be used. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
