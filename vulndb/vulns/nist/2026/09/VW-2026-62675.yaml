title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/surface:
  acpi-notify: Check ACPI companion before use\n\nSince every platform driver can
  be forced to match a device that doesn't\nmatch its list of device IDs because of
  device_match_driver_override(),\nplatform drivers that rely on the existence of
  a device's ACPI companion\nobject should verify its presence.\n\nsan_probe() dereferences
  the result of ACPI_COMPANION() when installing\nthe GSBUS address space handler,
  so force-binding the driver to a device\nwithout an ACPI companion leads to a NULL
  pointer dereference.  The\ndereference was introduced when the probe function was
  switched from\nACPI_HANDLE() to ACPI_COMPANION().\n\nCheck the ACPI companion against
  NULL and return -ENODEV when it is\nmissing, like commit e4865a56d013 (\"ACPI: driver:
  Check ACPI_COMPANION()\nagainst NULL during probe\") does for the core ACPI platform
  drivers."
