title: A vulnerability was determined in QuantumNous new-api up to 1.0.0-rc.15. 
  Affected by this issue is some unknown functionality of the file 
  /api/usage/token/ of the component Revoked API Token Handler. Executing a 
  manipulation can lead to session expiration. The attack may be performed from 
  remote. The exploit has been publicly disclosed and may be utilized. Upgrading
  to version 1.0.0-rc.17 can resolve this issue. This patch is called 
  0d5995eb63f8801d32eb32fbe74b75b68752bfa9. The affected component should be 
  upgraded.
