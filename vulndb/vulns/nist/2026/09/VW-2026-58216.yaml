title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86/amd/pmc:
  Fix LPS0 and debugfs leaks when STB init fails\n\namd_pmc_probe() registers the
  LPS0 s2idle handler with\nacpi_register_lps0_dev() and creates the driver's debugfs
  directory before\ncalling amd_stb_s2d_init(), which is the last step in probe that
  can fail.\n\nWhen amd_stb_s2d_init() fails (for example the S2D telemetry region
  cannot\nbe ioremapped on a long-running system, or the SMU rejects the S2D setup)\n\
  the error path only calls pci_dev_put() and returns.  This leaves\namd_pmc_s2idle_dev_ops
  on the global lps0_s2idle_devops_head list and leaks\nthe debugfs directory, while
  the devm-managed resources backing the handler\nare torn down.\n\nReloading the
  module then walks the corrupted list in\nacpi_register_lps0_dev() and hits:\n\n\
  \  list_add corruption. next->prev should be prev, but was NULL.\n  kernel BUG at
  lib/list_debug.c:29!\n   acpi_register_lps0_dev+0x44/0x80\n   amd_pmc_probe+0x224/0x380
  [amd_pmc]\n   pla"
