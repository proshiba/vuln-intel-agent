title: KubeEdge is an open source system for extending native containerized 
  application orchestration capabilities to hosts at Edge. From 1.12.0 until 
  1.21.2, 1.22.2, and 1.23.1, the v1alpha2 NodeUpgradeJob handler in 
  edge/pkg/taskmanager/actions/nodeupgradejob.go concatenates authenticated 
  user-controlled spec.version and spec.image values into the keadm upgrade edge
  shell command. A user with permission to create or update NodeUpgradeJob 
  resources can supply shell metacharacters in either field, causing arbitrary 
  commands to execute on targeted edge nodes with the privileges of the upgrade 
  process and compromising node confidentiality, integrity, and availability. 
  This issue is fixed in versions 1.21.2, 1.22.2, and 1.23.1.
