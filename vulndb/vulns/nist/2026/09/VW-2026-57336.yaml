title: An issue was discovered in Cyrus IMAP before 3.12.4. JMAP snooze bypasses
  the destination-mailbox ACL. An authenticated user with insert permissions on 
  another user's snoozed mailbox could cause insertion of mail to that user's 
  inbox, or any other of their mailboxes whose id was known to the user, despite
  having no insert permissions to the target mailbox.
