title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix heap out-of-bounds read in nvmet_auth_negotiate()\n\nnvmet_execute_auth_send()
  allocates the DH-HMAC-CHAP message buffer with\nthe host-supplied transfer length
  (tl) and hands it to\nnvmet_auth_negotiate() without passing tl along. nvmet_auth_negotiate()\n\
  then reads the negotiate header and, for each of the halen hash\nidentifiers and
  dhlen DH group identifiers, indexes into the fixed\nidlist[60] array (hashes at
  idlist[0..halen), groups at idlist[30..]).\n\nNeither the transfer length nor halen/dhlen
  is validated. A malicious or\nnon-conformant host can report a tl smaller than the
  negotiate structure,\nor a halen/dhlen larger than the array (both are u8, up to
  255), making\nthe loops read past the end of the allocated buffer (heap out-of-bounds\n\
