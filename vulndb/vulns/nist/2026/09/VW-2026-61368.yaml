title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  Fix DMA mapping ownership on partial map failure\n\nIf RX mapping fails after TX
  mapping succeeds, __spi_map_msg() unmaps\nTX but leaves tx_sg_mapped set. If TX
  mapping fails on a later\ntransfer, mappings created for earlier transfers remain
  active.\n\nIn both cases, cur_{tx,rx}_dma_dev have not yet been updated because
  they\nare assigned only after every transfer has been mapped. The subsequent\nspi_unmap_msg()
  may therefore unmap the TX mapping again or release\nearlier mappings using a NULL
  or stale device. Using a NULL device can\ntrigger an oops. An empty SG table does
  not prevent the NULL dereference\nbecause dma_unmap_sg_attrs() accesses the device
  before checking the\nentry count.\n\nPublish both mapping devices before mapping
