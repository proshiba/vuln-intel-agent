title: Budibase before 3.45.0 contains an unauthenticated server-side request 
  forgery and credential exfiltration vulnerability in the Microsoft Teams 
  webhook endpoint that accepts forged Bot Framework activities with arbitrary 
  serviceUrl values. Attackers can submit a crafted POST request to inject an 
  attacker-controlled serviceUrl that is persisted and used for all subsequent 
  bot replies, causing the server to send live Microsoft OAuth access tokens in 
  Authorization headers to the attacker's host and enabling blind internal 
  network access.
