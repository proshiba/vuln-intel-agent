title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath10k: snoc: use memcpy_fromio() for MSA ramdump\n\nOn WCN3990/SNOC the MSA region
  is mapped with devm_memremap(MEMREMAP_WT).\nOn arm64 such a mapping is not Normal-cacheable,
  so unaligned accesses to\nit are not permitted. ath10k_msa_dump_memory() copies
  the region with a\nplain memcpy(), whose optimized __pi_memcpy_generic implementation
  issues\nwide/unaligned loads. This triggers an alignment fault (FSC=0x21) Oops in\n\
  ath10k_snoc_fw_crashed_dump() while collecting the devcoredump:\n\n  Unable to handle
  kernel paging request ... FSC=0x21: alignment fault\n  pc : __pi_memcpy_generic\n\
  \  lr : ath10k_snoc_fw_crashed_dump [ath10k_snoc]\n\nThe Oops both leaves the firmware
  RAM dump buffer zeroed (no dump is\ncaptured) and crashes the kernel, which in turn
  breaks modem SSR\nrecovery.\n\nUse memcpy_fromio(), which only performs accesses
  that are valid for such\na device-memory mapping. The generic memcpy_fromio() implementation
  aligns"
