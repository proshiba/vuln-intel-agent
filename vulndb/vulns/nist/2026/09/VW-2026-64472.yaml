title: js-toml is a TOML parser for JavaScript. Prior to 1.1.3, load() does not 
  bound nesting or dotted-key depth in the recursive parser at 
  src/load/parser.ts or the interpreter at src/load/interpreter.ts, so deeply 
  nested arrays, deeply nested inline tables, or long dotted keys can exhaust 
  the V8 call stack and throw a raw RangeError instead of the documented 
  SyntaxParseError. Applications that parse attacker-controlled TOML and handle 
  only SyntaxParseError can rethrow the unexpected exception, which can 
  terminate a worker or process and cause denial of service. The exception is 
  synchronous and catchable by consumers that handle all exceptions, and the 
  issue does not affect confidentiality or integrity. This issue is fixed in 
  version 1.1.3.
