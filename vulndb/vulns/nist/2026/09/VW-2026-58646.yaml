title: Flowise before 3.1.4 contains a broken access control vulnerability in 
  GET /api/v1/organizationuser that allows any authenticated organization member
  to retrieve the organization owner's full user record including bcrypt 
  password hash and temporary tokens. Attackers can query the endpoint with any 
  user ID to obtain the owner's credential hash for offline cracking, enabling 
  account takeover of the highest-privileged account.
