title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  Mark LVID buffer as uptodate before marking it dirty\n\nWhen an I/O error occurs
  while writing the Logical Volume Integrity\nDescriptor (LVID) buffer to the block
  device, the block layer's completion\nhandler (`end_buffer_write_sync()`) clears
  the `BH_Uptodate` flag on the\nbuffer. However, the buffer still contains valid
  LVID data in memory. If\nthe filesystem is subsequently remounted read-write or
  synced,\n`udf_open_lvid()` or `udf_sync_fs()` will modify the LVID buffer and call\n\
  `mark_buffer_dirty()`. This triggers a spurious\n`WARN_ON_ONCE(!buffer_uptodate(bh))`
  warning in `mark_buffer_dirty()`\nbecause the buffer is not marked uptodate, even
  though its in-memory\ncontents are valid and are about to be overwritten.\n\nTo
  prevent this spurious warning, unconditionally set the `BH_Uptodate`\nflag before
  calling `mark_buffer_dirty()` in `udf_open_lvid()` and\n`udf_sync_fs()`. This acknowledges
  that the in-memory buffer is val"
