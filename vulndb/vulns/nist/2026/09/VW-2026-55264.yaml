title: "Use After Free vulnerability in Arm Ltd Bifrost GPU Userspace Driver, Arm
  Ltd Valhall GPU Userspace Driver, Arm Ltd Arm 5th Gen GPU Architecture Userspace
  Driver allows a non-privileged user process to perform valid GPU processing operations,
  including via WebGL or WebGPU, to access already freed memory.\n\n\n\nThis issue
  affects Bifrost GPU Userspace Driver: from r42p0 through r49p5, from r50p0 through
  r51p0, from r54p1 through r54p3; Valhall GPU Userspace Driver: from r42p0 through
  r49p5, from r50p0 through r54p3, r55p0; Arm 5th Gen GPU Architecture Userspace Driver:
  from r42p0 through r49p5, from r50p0 through r54p3, r55p0."
