title: Improper Restriction of XML External Entity Reference in Apache Roller 
  6.1.5 allows a user with entry-editing rights on a weblog to cause the server 
  to parse an attacker-influenced trackback response with an XML parser that 
  does not disable external entity resolution, leading to disclosure of files 
  readable by the Roller process. The Trackback control is hidden in the 
  standard UI, but its action remains directly reachable, and no non-default 
  server configuration is required. Users are recommended to upgrade to Apache 
  Roller 6.1.6 or later, which removes the outbound trackback response parser.
