title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix listener task lifetime on netdev events\n\nThe listener thread exits when its
  listening socket is shutdown. The\nnetdevice notifier shuts down the socket before
  calling kthread_stop(), so\nthe task_struct can be freed before kthread_stop() gets
  its reference.\n\nCreate the listener in a stopped state and hold an extra task_struct\n\
  reference until kthread_stop_put() completes. Also stop and release\nlisteners before
  freeing their interface records during TCP teardown."
