title: "net_icmpv6_send_error() in subsys/net/ip/icmpv6.c implemented only one of
  the three RFC 4443 section 2.4 suppression rules (do not answer an ICMPv6 error
  with an ICMPv6 error). It did not check whether the triggering packet's source address
  identifies a single node (rule e.6) or whether the packet was sent to a multicast
  destination (rule e.3, whose only exceptions are Packet Too Big and Parameter Problem
  Code 2). Of the five call sites, only the port-unreachable path in subsys/net/ip/connection.c
  carried an equivalent guard of its own; the extension-header, unknown-next-header
  and fragmentation paths in subsys/net/ip/ipv6.c and subsys/net/ip/ipv6_fragment.c
  had none.\n\nAn unauthenticated attacker with access to the same link can exploit
  this in two ways. Sending a single IPv6 packet to the link-local all-nodes group
  ff02::1 carrying an unrecognized next-header value, with the source address spoofed
  to a chosen victim, causes every Zephyr node on the link to emit an ICMPv6 Parameter
  Pro"
