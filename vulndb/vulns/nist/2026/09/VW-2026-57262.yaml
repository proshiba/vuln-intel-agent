title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  core: fix number/pointer type confusion on long items\n\nWhen fetch_item() is called
  by hid_scan_report() on an item with\nHID_ITEM_TAG_LONG, it stores a pointer to
  the item data in\nitem->data.longdata instead of storing a value directly in\nitem->data.{u8/u16/u32}.\n\
  \nWhen item_udata() or item_sdata() encounters such an item, it incorrectly\nassumes
  that the item is in short format, and therefore returns the lower\npart of a kernel
  pointer reinterpreted as a number.\n\nWhen a HID device is connected whose descriptor
  contains a\nHID_GLOBAL_ITEM_TAG_REPORT_SIZE encoded in long format with size=4,
  this\ncauses the lower half of a kernel pointer to be printed into dmesg as a\n\
  number, like this:\n\n    hid (null): invalid report_size 107953555\n\nTo fix it,
  let item_udata() and item_sdata() verify that the item is in\nshort format.\n\n\
  Note that this bug only affects hid_scan_report(), while the main parsing\npass
  hid_parse_collections() "
