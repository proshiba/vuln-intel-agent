title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btusb: Fix UAF of btusb_data by rx_work\n\nbtusb_close() and btusb_flush() cancel
  data->rx_work with the\nasynchronous cancel_delayed_work(), so if btusb_rx_work()
  is already\nrunning on another CPU it keeps running after the cancel returns.\n\n\
  btusb_disconnect() calls hci_unregister_dev(), which invokes\nbtusb_close(), and
  then frees the btusb_data. A still running\nbtusb_rx_work() then dereferences the
  freed data:\n\n\twhile ((skb = skb_dequeue(&data->acl_q)))\n\t\tdata->recv_acl(data->hdev,
  skb);\n\nUse cancel_delayed_work_sync() instead. In btusb_close() the cancel also\n\
  has to happen after btusb_stop_traffic(), otherwise an URB completion\nracing with
  the cancel can requeue the work right after it has been\nwaited for."
