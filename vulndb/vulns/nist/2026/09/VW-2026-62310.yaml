title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  core: Fix use-after-free in snd_card_do_free()\n\nA use-after-free was detected
  in snd_card_do_free() when a sound card\nmanaged by devres is unbound while a user-space
  application still holds an\nopen file descriptor.\n\nFor managed cards, the memory
  is allocated using devres_alloc(), and its\nrelease function is set to __snd_card_release(),
  which calls\nsnd_card_free(). When the device is unbound, the unbind thread calls\n\
  snd_card_free(), which drops a reference to the card's device. If the user\nthread
  still has an open file descriptor, the reference count does not\nreach zero, and
  the unbind thread blocks on wait_for_completion(&released).\n\nWhen the user thread
  closes the file descriptor, it drops the final\nreference, invoking the device release
  callback release_card_device(),\nwhich calls snd_card_do_free(). snd_card_do_free()
  performs cleanup and\ncalls complete(card->release_completion). This wakes up the
  unbind threa"
