title: "Insertion of sensitive information into sent data vulnerability in Apache
  Syncope.\n\n\n\nAny authenticated user can query for the list of available OIDC
  providers configured for SSO with Console and Enduser. The returned payload contains
  all configuration settings, including client secrets, regardless of the entitlements
  owned by the caller.\n\n\n\nThis issue affects Apache Syncope: from 3.0.0-M0 through
  3.0.16, from 4.0.0-M0 through 4.0.7, from 4.1.0-M0 through 4.1.2.\n\n\n\nUsers are
  recommended to upgrade to version 4.0.8 / 4.1.3, which fix this issue."
