title: "Eclipse aeriOS Self-orchestrator versions prior to 1.2.1 contain a path traversal
  vulnerability in the REST API. User-controlled identifiers used to create, update,
  or delete Self-orchestrator resources were incorporated into filesystem paths without
  adequate validation or sanitization. An unauthenticated remote attacker able to
  access the Self-orchestrator API could therefore supply specially crafted identifiers
  containing path traversal sequences to write or delete JSON files outside the intended
  application directories, subject to the filesystem permissions of the Self-orchestrator
  process.\n\n\n\n\nThe impact is increased by the absence of authentication on the
  affected API and by the container running with elevated privileges in the affected
  deployment configuration.\n\n\n\n\nThe issue has been addressed in version 1.2.1
