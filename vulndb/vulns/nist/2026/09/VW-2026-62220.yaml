title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  free stashed qentry before overwrite in REQ_ADD_LINK to ADD_LINK transition\n\n\
  When smc_llc_event_handler() transitions the local LLC flow from\nSMC_LLC_FLOW_REQ_ADD_LINK
  to SMC_LLC_FLOW_ADD_LINK on arrival of an ADD_LINK\nrequest, it calls smc_llc_flow_qentry_set()
  unconditionally:\n\n\tif (lgr->llc_flow_lcl.type == SMC_LLC_FLOW_REQ_ADD_LINK) {\n\
  \t\tlgr->llc_flow_lcl.type = SMC_LLC_FLOW_ADD_LINK;\n\t\tsmc_llc_flow_qentry_set(&lgr->llc_flow_lcl,
  qentry);\n\t\t...\n\t}\n\nA CONFIRM_LINK or ADD_LINK_CONT arriving while flow->type
  is\nSMC_LLC_FLOW_REQ_ADD_LINK is stashed into flow->qentry via the\nSMC_LLC_CONFIRM_LINK
  / SMC_LLC_ADD_LINK_CONT handler (which stores into\nflow->qentry for any non-NONE
  flow type).  When the subsequent ADD_LINK\narrives, the REQ_ADD_LINK branch overwrites
  flow->qentry with the new pointer\nwithout first freeing the stashed allocation,
  leaking one kmalloc object.\n\nThe stashed entry has no consumer: smc_llc_wa"
