title: rclone is a command-line program to sync files and directories to and 
  from different cloud storage providers. Prior to 1.75.1, backend/local with 
  --links or links=true exposes symlink targets as .rclonelink objects, and 
  fs.RangeOption.Decode can pass an unchecked positive Range start through 
  Object.Open and openTranslatedLink. The function slices the target string as 
  linkdst[offset:], so a Range start larger than the target length causes a 
  deterministic slice-bounds panic when lib/http/serve exposes the object 
  through HTTP or WebDAV. Go net/http normally recovers the panic per 
  connection, causing request-level denial of service rather than terminating 
  the entire process. This issue is fixed in version 1.75.1.
