title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  check client ownership when cancelling a copy-notify stateid\n\nOn the OFFLOAD_CANCEL
  path (clp != NULL), manage_cpntf_state() freed the\ntarget cpntf state without checking
  ownership. The lookup key\nst->si_opaque.so_id is allocated cyclically (guessable)
  and the embedded\nclientid is the fixed per-net nn->s2s_cp_cl_id, so any authenticated\n\
  NFSv4.2 client could cancel and free another client's copy-notify\nstateid.\n\n\
  Compare the creating clientid recorded in state->cp_p_clid against the\nrequesting
  client's cl_clientid and return nfserr_bad_stateid on a\nmismatch instead of freeing
  the entry."
