title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). From 0.17.0 until 0.22.0, 
  validate_url_for_ssrf resolves the attacker-controlled X-Atlassian-Jira-Url 
  and X-Atlassian-Confluence-Url header host once at middleware time, but the 
  outbound request is built with the raw hostname and resolves it again at 
  connection time with no IP pinning. An attacker-controlled DNS-rebinding name 
  can return a public IP during validation and 169.254.169.254 or another 
  internal IP during connection, enabling unauthenticated server-side requests 
  to cloud metadata or internal services. The flaw spans 
  src/mcp_atlassian/utils/urls.py, src/mcp_atlassian/servers/main.py, and 
  src/mcp_atlassian/servers/dependencies.py; validate_url_for_ssrf returns only 
  a verdict rather than a pinned IP, UserTokenMiddleware processes the 
  attacker-controlled headers before fetcher creation, and the Jira and 
  Confluence fetchers use the raw hostname. This issue is fixed in version 0.22
