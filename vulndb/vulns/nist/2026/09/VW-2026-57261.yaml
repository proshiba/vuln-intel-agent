title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  host-generic: Fix NULL pointer dereference on 32-bit CAM systems\n\nOn 32-bit systems
  the config space is too large to ioremap in one go, so\npci_ecam_create() maps each
  bus segment separately and relies on the\n->add_bus callback (pci_ecam_add_bus)
  to populate the per-bus mapping in\ncfg->winp[]. pci_ecam_map_bus() then uses that
  mapping as the base for\nevery config access.\n\nThe generic ECAM ops (pci_generic_ecam_ops)
  already provide the ->add_bus\nand ->remove_bus callbacks, but the CAM (legacy)
  ops in pci-host-generic.c\ndo not. As a result, on a 32-bit host using \"pci-host-cam-generic\"\
  \ the\nper-bus mapping is never set up and the first config read dereferences a\n\
  NULL base, crashing during bus enumeration:\n\n Unable to handle kernel NULL pointer
  dereference at virtual address 00000800\n Oops [#1]\n CPU: 0 PID: 1 Comm: swapper
  Not tainted 6.9.7+ #43\n Hardware name: Digilent Nexys-Video-A7 RV32 (DT)\n epc
  : pci_generic_conf"
