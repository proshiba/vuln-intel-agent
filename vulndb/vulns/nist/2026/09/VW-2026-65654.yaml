title: "A vulnerability in the&nbsp;CLI of Cisco Identity Services Engine (ISE) and
  Cisco ISE Passive Identity Connector (ISE-PIC) could allow an authenticated, local
  attacker with administrative privileges to perform a command injection attack on
  the underlying operating system and elevate privileges to root.\r\n\r\nThis vulnerability
  is due to insufficient validation of user supplied input. An attacker could exploit
  this vulnerability by providing crafted input to a specific CLI command. A successful
  exploit could allow the attacker to elevate their privileges to root on the underlying
  operating system."
