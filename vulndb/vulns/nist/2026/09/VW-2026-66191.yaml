title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix soft lockup from unpadded ASCONF-ACK parameter iteration\n\nsctp_verify_asconf()
  walks ASCONF-ACK parameters with\nsctp_walk_params(), which advances by SCTP_PAD4(length),
  while the\nconsumer sctp_get_asconf_response() iterates the same parameters\nadvancing
  by the raw length, without padding. A single odd-length\nparameter desynchronises
  the two walks and makes the consumer\ninterpret attacker-controlled bytes at a misaligned
  offset.\n\nWhen those bytes yield a length of zero, the while loop over\nasconf_ack_len
  makes no progress, spinning forever in softirq\ncontext, and the watchdog reports
  a soft lockup. All reads stay\nwithin the received skb, so the lockup is a pure
  remote denial of\nservice. A remote peer can trigger it with a crafted ASCONF-ACK
  on\nan ADD-IP enabled association with an outstanding ASCONF (RFC 5061\nsection
