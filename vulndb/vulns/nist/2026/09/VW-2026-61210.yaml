title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix cs84xx use-after-free on host teardown\n\nqla84xx_put_chip() drops
  the last reference to ha->cs84xx and frees it via\n__qla84xx_chip_release() without
  clearing ha->cs84xx. During teardown it ran\nbefore scsi_remove_host(), which is
  what removes the 84xx_fw_version host\nsysfs attribute. A concurrent read of that
  attribute in the window between\nthe two calls executes qla24xx_84xx_fw_version_show(),
  which dereferences\nthe freed ha->cs84xx, resulting in a use-after-free.\n\nMove
  qla84xx_put_chip() to after scsi_remove_host() in both\nqla2x00_remove_one() and
  qla2x00_disable_board_on_pci_error(). Once\nscsi_remove_host() returns, the sysfs
  attribute is gone and kernfs has\ndrained any in-flight show(), so no reader can
  touch cs84xx; the put still\nruns before the host and ha are freed."
