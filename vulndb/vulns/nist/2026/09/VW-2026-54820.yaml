title: Dell SCG 5.0 Appliance versions prior to 5.36.00.16 and Dell SCG 5.0 
  Application versions prior to 5.36.00.00, contains a Missing Authorization 
  vulnerability. An unauthenticated attacker with remote access could 
  potentially exploit this vulnerability, leading to remote execution. This 
  vulnerability is considered critical because it allows an attacker to execute 
  commands remotely on a target system by sending a specially crafted request to
  the application, bypassing intended restrictions on code execution.Dell 
  recommends customers to upgrade at the earliest opportunity.
