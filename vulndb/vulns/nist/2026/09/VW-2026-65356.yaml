title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  initialize gigantic bootmem hugepage struct pages earlier\n\nGigantic bootmem HugeTLB
  pages are currently initialized from\nhugetlb_init(), but page_alloc_init_late()
  runs earlier and walks\npageblocks to determine zone contiguity.\n\nIf a bootmem
  HugeTLB region is marked noinit, set_zone_contiguous() can\nobserve still-uninitialized
  struct pages through\n__pageblock_pfn_to_page().  This may not trigger an immediate
  failure, but\nit can make set_zone_contiguous() compute the wrong zone contiguity
  state.\nIf extra poisoned-page checks are added in this path, such as\nPF_POISONED_CHECK()
  in page_zone_id(), it can also trigger an early boot\npanic.\n\nInitialize gigantic
  bootmem HugeTLB struct pages from\npage_alloc_init_late(), before zone contiguity
  is evaluated, so later page\nallocator setup only sees valid struct page state.\
  \  This also makes the\ninitialization order more natural, as struct pages should
  be initialized\nbe"
