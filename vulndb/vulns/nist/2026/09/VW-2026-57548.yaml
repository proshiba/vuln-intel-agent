title: Joomla Extension - joomshaper.com - Unauthenticated SQL Injection in 
  Property Search and Map Filtering in SP Property < 4.1.4 - The property search
  and listing query builders assembled several WHERE and ORDER BY clauses 
  (zipcode, sorting, price_range_dropdown, and psize_range_dropdown) by directly
  concatenating raw request parameters into SQL strings without quoting or type 
  casting. An unauthenticated remote attacker could execute boolean-based or 
  time-based blind SQL injection to extract sensitive data from the database.
