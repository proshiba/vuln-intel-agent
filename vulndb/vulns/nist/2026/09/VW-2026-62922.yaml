title: CubeCart is an ecommerce software solution. Prior to 6.7.5, 
  admin/sources/settings.index.inc.php directly concatenates the 
  administrator-controlled download_expire POST parameter into a raw UPDATE 
  statement for CubeCart_downloads without numeric validation. An authenticated 
  administrator can supply a comma-delimited value that changes the SET clause 
  because HTML sanitization does not neutralize SQL syntax, allowing 
  manipulation of database columns and potentially other data within the 
  application's database privileges. This issue is fixed in version 6.7.5.
