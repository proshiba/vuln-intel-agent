title: "Relative path traversal in the generated file manifest cleanup component in
  projen before 0.101.37 might allow context-dependent attackers to recursively delete
  files and directories outside the project directory that are writable by the environment
  running projen, via crafted entries in the version-controlled generated file manifest
  that is consumed during project synthesis.\n\n\n\nTo remediate this issue, users
  should upgrade to version 0.101.37. The corrected containment check is automatically
  applied by the projen runtime next time you run it."
