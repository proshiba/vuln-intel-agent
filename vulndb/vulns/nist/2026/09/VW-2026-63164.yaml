title: A flaw was found in the DERDecoder class within wildfly-elytron-asn1. A 
  remote attacker can exploit this resource exhaustion vulnerability by sending 
  a specially crafted DER (Distinguished Encoding Rules) payload. The decoder 
  attempts to allocate excessive memory based on an inflated length value 
  without proper validation, leading to Java Virtual Machine (JVM) memory 
  exhaustion. This results in a remote Denial of Service (DoS) for services that
  process untrusted DER/ASN.1 input, including SASL (Simple Authentication and 
  Security Layer) authentication mechanisms and X.500 certificate principal 
  parsing paths.
