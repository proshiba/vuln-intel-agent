title: Nuclio is a "Serverless" framework for Real-Time Events and Data 
  Processing. Prior to version 1.17.4, on the Nuclio local Docker platform, the 
  function namespace is interpolated—unvalidated—into a double-quoted docker ps 
  --filter "label=nuclio.io/namespace=<value>" command that is executed via the 
  host shell (/bin/sh -c). Because the default auth kind is nop 
  (unauthenticated), a remote attacker can inject arbitrary OS commands that run
  as root inside the dashboard container, which holds the Docker socket → host 
  compromise. This issue has been patched in version 1.17.4.
