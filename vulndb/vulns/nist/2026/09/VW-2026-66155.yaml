title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  ump: do not touch legacy_rmidi before it exists\n\nsnd_ump_parse_endpoint() sets
  ump->parsed on every exit, including\nerror, before the caller attaches the legacy
  rawmidi device.\nump_handle_ep_name_msg() then treats parsed as \"legacy_rmidi is
  live\"\nand calls ump_legacy_set_rawmidi_name(), which snprintf()s into\nump->legacy_rmidi->name.
  If a UMP packet arrives in that window\n(IRQ path from snd_ump_receive), legacy_rmidi
  is still NULL\n(KASAN null-ptr-deref in snprintf).\n\nGuard the legacy helpers.
  parsed only means endpoint info was\nparsed, not that legacy_rmidi exists."
