title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  virtio - bound the akcipher result length\n\nvirtio_crypto_dataq_akcipher_callback()
  sets the result length from the\ndevice-reported response length without bounding
  it to the destination\nbuffer, which was allocated for the original request length.\n\
  sg_copy_from_buffer() then reads that many bytes from the destination\nbuffer; a
  backend reporting a larger length over-reads adjacent kernel\nheap into the caller's
  scatterlist (an out-of-bounds read).\n\nClamp the reported length to the originally
  requested destination length.\nA conforming device reports no more than that, so
  valid results are\nunaffected."
