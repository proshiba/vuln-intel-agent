title: OpenClaw is an agent gateway distributed via npm. In versions >= 
  2026.4.10 and < 2026.7.1, persistent memory dreaming mutations omit owner 
  permission checks. An authorized but non-owner external-channel sender can 
  issue the persistent '/dreaming on' and '/dreaming off' commands to enable or 
  disable the Gateway's Memory Core dreaming behavior, disabling background 
  memory processing or re-enabling durable memory promotion where the owner 
  expected it to remain disabled; the practical confidentiality, integrity, and 
  availability impact depends on stored conversation material and subsequent 
  memory use. Read-only status and help commands remain governed by normal 
  command policy. The issue is fixed in version 2026.7.1. As a workaround, 
  disable dreaming commands in external channels or restrict channel command 
  access to owners.
