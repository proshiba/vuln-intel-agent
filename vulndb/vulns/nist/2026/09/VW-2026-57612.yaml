title: OpenPanel is an analytics platform. In all versions (no patched release 
  available at time of publication), the data importer fetches a caller-supplied
  URL with plain fetch instead of the project's existing SSRF guard 
  (apps/api/src/utils/safe-fetch.ts). In 
  packages/importer/src/providers/umami.ts, parseRemoteFile calls fetch() on 
  config.fileUrl, which is validated only by z.string().url(), so values such as
  http://127.0.0.1:9911/ or http://169.254.169.254/latest/meta-data/ are 
  accepted; the shared createFileImportConfig factory gives the plausible 
  provider the same field. An authenticated organization member — including a 
  default 'member' with no project_access rows, for whom the intended 
  access-level check is skipped because getProjectAccess returns boolean true 
  rather than a level object — can therefore make the server connect to any 
  address reachable from it. The resulting HTTP status and status text are 
  persisted as Import.errorMessage and returned by import.get to the same user, 
