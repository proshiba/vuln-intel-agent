title: A weakness has been identified in invoiceninja Invoice Ninja up to 
  5.13.26. This affects an unknown part of the file /vedor/profile/ of the 
  component Vendor Portal Profile Update. Executing a manipulation of the 
  argument vendor_contact can lead to authorization bypass. The attack may be 
  performed from remote. The exploit has been made available to the public and 
  could be used for attacks. Upgrading to version 5.13.27 is able to mitigate 
  this issue. This patch is called f86fd9697ce7bd0d28adbe2e6c5890780482ea90. The
  affected component should be upgraded.
