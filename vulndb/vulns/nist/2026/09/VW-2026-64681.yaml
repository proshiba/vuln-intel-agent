title: A security vulnerability has been detected in iFlytek astron-agent up to 
  1.0.6. Affected by this vulnerability is the function UrlCheckTool.checkUrl of
  the component debugToolV2 API endpoint. The manipulation of the argument 
  endPoint leads to server-side request forgery. The attack can be initiated 
  remotely. Upgrading to version reward-1575 addresses this issue. The 
  identifier of the patch is 45ee5fb647e9894e73b0d7720fa94a66e4540bbb. The 
  affected component should be upgraded.
