title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw88: pci: fix resource leak on failed NAPI setup\n\nrtw_pci_probe() allocates
  PCI resources through\nrtw_pci_setup_resource() before it sets up NAPI. If\nrtw_pci_napi_init()
  fails, the error path jumps straight to\nerr_pci_declaim and skips rtw_pci_destroy(),
  leaving the PCI\nresources allocated by rtw_pci_setup_resource() behind.\n\nAdd
  a dedicated cleanup label for the NAPI setup failure path so probe\ndestroys the
  PCI resources.\n\nThe bug was first flagged by an experimental analysis tool we
  are\ndeveloping for kernel memory-management bugs while analyzing current\nmainline
  kernels. The tool is still under development and is not yet\npublicly available.
  Manual inspection confirms that the bug is still\npresent in v7.1-rc7.\n\nAn x86_64
  allyesconfig build showed no new warnings. As we do not have a\nsuitable rtw88 PCI
  board to test with, no runtime testing was able to be\nperformed."
