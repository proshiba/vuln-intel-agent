title: A vulnerability was found in ningzichun Student Management System up to 
  98760f5711cf6dc8b4adca53a9e207ca49b02ebf. Affected by this vulnerability is 
  the function session_start of the file login.php. The manipulation results in 
  session fixiation. The attack can be launched remotely. The exploit has been 
  made public and could be used. This product does not use versioning. This is 
  why information about affected and unaffected releases are unavailable. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
