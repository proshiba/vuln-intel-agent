title: A failed X509_verify_cert call permanently plants an unverified attacker 
  CA in the shared CertManager, bypassing certificate validation in every 
  type-blind sibling consumer (native TLS, OCSP, CRL, direct CM verify). This 
  affects version 5.8.4 through 5.9.2 of wolfSSL with the macros (OPENSSL_EXTRA 
  && !NO_CERTS && !WOLFCRYPT_ONLY) defined or built with --enable-opensslextra 
  and the application is specifically making calls to the X509_verify_cert 
  function.
