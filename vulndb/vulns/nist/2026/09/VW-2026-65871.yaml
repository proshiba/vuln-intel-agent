title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm/pat:
  Allocate split page tables as kernel page tables\n\nA PTE is allocated directly
  without going through the standard page table\nallocation routines (such as pte_alloc_one_kernel())
  when the CPA code\nsplits a large page (__split_large_page()).\n\nThis means the
  page table constructor is never called nor is the page table\nmarked as a kernel
  page table.\n\nThe former results in the folio associated with the page table not
  being\nmarked as a page table (__pagetable_ctor() is never called thus neither is\n\
  __folio_set_pgtable()) nor are statistics updated to reflect\nit (lruvec_stat_add_folio()
  is never called).\n\nThe latter issue of failing to mark the page table as a kernel
  page\ntable (ptdesc_set_kernel() is never called) is far more problematic.\n\nSince
  commit:\n\n  5ba2f0a15564 (\"mm: introduce deferred freeing for kernel page tables\"\
  )\n\nkernel page table freeing has been batched and since the\nsubsequent commit:\n\
  \n  e37d5a2d6"
