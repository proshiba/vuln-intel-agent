title: "A vulnerability in the Thinkst Canary honeypot Redis service allows an unauthenticated
  remote attacker to execute a Denial-of-Service attack against the honeypot.\n\n\
  The vulnerability is accessible when the Redis service is enabled only.\n\nThe Canary
  is NOT affected if the Redis service is disabled.\n\nThinkst has addressed this
  issue on all supported platforms.\n\nNew update files to address this issue are
  available on all platforms except Docker. For Docker customers, a new Docker image
  has been published which includes the patch. Customers with automatic updates enabled
  already have updates in distribution. If automatic updates are disabled, customers
  are advised to update their Canaries.\n\nWorkarounds are available for customers
  unable to update at this time."
