title: A vulnerability was detected in Krayin laravel-crm up to 2.2.5. Impacted 
  is an unknown function of the file 
  packages/Webkul/Admin/src/Resources/views/components/layouts/index.blade.php 
  of the component Admin Settings Endpoint. Performing a manipulation of the 
  argument general.settings.footer.label results in cross site scripting. The 
  attack can be initiated remotely. The exploit is now public and may be used. 
  Upgrading to version 2.2.6 is recommended to address this issue. The patch is 
  named 6dbcf75b30dbd169ee81b7e9e00368099124efeb. You should upgrade the 
  affected component.
