title: A flaw was found in rpm. An attacker can exploit a command injection 
  vulnerability by influencing the path or filename of a tarball processed by 
  `rpmbuild -t*` to include shell metacharacters. This is particularly relevant 
  in automated build or continuous integration (CI) workflows that ingest 
  externally supplied artifact names. Successful exploitation allows for 
  arbitrary command execution with the privileges of the build user, which could
  lead to information disclosure or disruption of the build environment.
