title: Inadequate access control in Hiperdino’s REST v1.0 API. The public 
  endpoint ‘customer/check’ could allow an authenticated attacker to enter a 
  telephone number or an email address. When the value entered belongs to a 
  registered customer, the service returns the associated information (email 
  address and telephone number). No authentication is required beyond a static 
  bearer token, and there is no rate limiting or generic error handling. 
  Successful exploitation of this vulnerability could allow a remote attacker to
  enumerate a user’s contact details, although this would require obtaining a 
  valid static bearer token, constituting an information disclosure 
  vulnerability.
