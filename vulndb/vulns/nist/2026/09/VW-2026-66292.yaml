title: Piwigo is a full featured open source photo gallery application for the 
  web. Prior to 16.4.0, admin/themes_standard_pages.php validates uploaded logo 
  content by MIME type but reuses the attacker-controlled extension from 
  std_pgs_logo when constructing the stored filename. An authenticated 
  administrator can upload image content with a server-executable final 
  extension, causing the file to be placed in the web-accessible logo directory 
  and executed when requested if the web server handles that extension. This can
  permit arbitrary command execution, data disclosure, modification, 
  persistence, and service disruption. This vulnerability is fixed in 16.4.0.
