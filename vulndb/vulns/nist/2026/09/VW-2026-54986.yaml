title: SAP GUI for Java does not correctly enforce the trust level policy for 
  certain functions invoked from a connected backend system. A low-privileged 
  attacker could exploit this weakness by manipulating a connected backend 
  system to trigger affected functionality. This could allow arbitrary command 
  execution on the victim's machine, leading to a high impact on the 
  confidentiality, integrity, and availability of the affected system.
