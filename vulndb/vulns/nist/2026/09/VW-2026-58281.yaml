title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  cluster: don't sleep while holding o2hb_live_lock in o2hb_region_pin()\n\nPatch
  series \"ocfs2: cluster: o2hb_region_pin() fixes\", v2.\n\nThis series fixes three
  related issues in o2hb_region_pin(), all are from\nthe original implementation in
  commit: 58a3158a5d17 (\"ocfs2/cluster:\nPin/unpin o2hb regions\"):\n\n1) It is called
  with o2hb_live_lock (a spinlock) held, but the\n   underlying configfs_depend_item()
  sleeps (takes inode rwsem and\n   pins the filesystem).  This triggers BUG under\n\
  \   CONFIG_DEBUG_ATOMIC_SLEEP.\n\n2) When called from the configfs drop_item callback,
  it creates a\n   lock order inversion: parent inode_lock -> configfs root\n   inode_lock,
  which can deadlock against subsystem unregistration\n   paths taking root -> parent.\n\
  \n3) If pinning fails partway through o2hb_region_inc_user(), the\n   o2hb_dependent_users
  counter is leaked and partially-pinned\n   regions are never released, leaving heartbeat
  regions\n"
