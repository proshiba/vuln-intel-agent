title: The Photo Gallery by 10Web – Mobile-Friendly Image Gallery plugin for 
  WordPress is vulnerable to time-based SQL Injection via 'album_id' Shortcode 
  Attribute in all versions up to, and including, 1.8.44 due to insufficient 
  escaping on the user supplied parameter and lack of sufficient preparation on 
  the existing SQL query. This makes it possible for authenticated attackers, 
  with author-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. An Author-level user can store a SQL injection payload 
  inside a published post's shortcode attribute, causing the payload to execute 
  when any visitor renders the post; notably, the unsanitized value appears on 
  both sides of a UNION query, potentially doubling the observable time-based 
  delay.
