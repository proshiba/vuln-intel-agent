title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrapidio:
  mport_cdev: fix use-after-free in dma_req_free()\n\ndma_req_free() acquires buf_mutex
  through req->map, drops the mapping\nreference with kref_put(), and then dereferences
  req->map again to unlock\nthe mutex.\n\nIf kref_put() drops the last reference,
  mport_release_mapping() frees the\nmapping, and the subsequent mutex_unlock() dereferences
  a freed object. \nThis is a use-after-free.\n\nFix this by caching map and md before
  kref_put(), clearing req->map while\nholding buf_mutex, and using the cached md
  for mutex unlocking.\n\nThe bug is reachable from userspace via the RapidIO mport
  character device\ninterface."
