title: A weakness has been identified in AdithyaYelloju 
  Restaurant-Management-System up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. 
  Affected by this issue is the function mysqli_query of the file 
  admin/display_menu.php of the component Search Form. This manipulation of the 
  argument s1 causes sql injection. The attack can be initiated remotely. The 
  exploit has been made available to the public and could be used for attacks. 
  Continious delivery with rolling releases is used by this product. Therefore, 
  no version details of affected nor updated releases are available. The project
  was informed of the problem early through an issue report but has not 
  responded yet.
