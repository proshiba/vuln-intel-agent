status: active
title: Previously, after a channel has been established, a malicious peer could 
  send crafted messages that would deadlock the entire connection. Now, we 
  handle all RFC 4254 channel messages; global requests are handled explicitly. 
  Then, treat all other messages as a protocol error and tear the connection 
  down instead of buffering and blocking.
