title: A prototype pollution vulnerability in Software Mansion React Native 
  Worklets before 0.12.2 allows an attacker-controlled object containing a 
  __proto__ property to modify the prototype of an object created during 
  serialization in clonePlainJSObject in 
  packages/react-native-worklets/src/memory/serializable.native.ts. When 
  affected data is subsequently processed by React Native Worklets, the 
  malformed serialized object can cause the React Native application to crash. 
  This can result in a remotely triggered denial of service in applications that
  pass attacker-controlled data through the affected serialization path. In 
  applications where the attacker-controlled data is persisted, the denial of 
  service may persist across application restarts or repeated attempts to access
  the affected content.
