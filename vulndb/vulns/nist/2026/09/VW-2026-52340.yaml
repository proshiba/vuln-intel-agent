title: Wallos is an open-source, self-hostable personal subscription tracker. 
  Prior to version 4.9.6, Admin-configured OIDC token_url and user_info_url in 
  includes/oidc/handle_oidc_callback.php:18-49 are used directly in curl_init() 
  with zero SSRF filtering. Unlike logo/webhook URLs which have 
  validate_webhook_url_for_ssrf(), OIDC URLs bypass all protections. Admin sets 
  URL to http://169.254.169.254/latest/meta-data/ for cloud metadata access or 
  internal network pivoting. This issue has been patched in version 4.9.6.
