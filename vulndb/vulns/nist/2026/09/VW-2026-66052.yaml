title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: cortina: Fix budget accounting\n\nThe gmac_rx() function returns the remaining
  NAPI budget, but its\ncaller treats the return value as the number of packets received.
  An\nidle poll therefore reports a full budget and remains scheduled.\n\nReturn the
  number of received packets instead. Preserve the existing\nfree queue refill accounting
  by adding that count directly; continuing\nto subtract it from the budget would
  invert the refill behavior."
