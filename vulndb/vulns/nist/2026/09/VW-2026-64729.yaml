title: The Event Booking Manager for WooCommerce  WordPress plugin before 5.7.3 
  does not restrict its event listing query to events the requesting user is 
  permitted to read, so users with contributor-level access and above can 
  retrieve other authors' private, draft and trashed events, together with event
  detail the standard listing does not show them. This discloses private events 
  and their content that WordPress withholds from users lacking the 
  read_private_posts capability.
