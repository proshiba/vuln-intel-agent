title: "An OS Command Injection vulnerability in TP-Link Archer BE230 v1.2 and BE3600
  v1 (vpn modules) allows adjacent \n\nauthenticated \n\nattacker \n\nexecute arbitrary
  code. Successful exploitation could allow an attacker to gain full administrative
  control of the device, resulting in severe compromise of configuration integrity,
  network security, and service availability.\n\nThis CVE covers one of multiple distinct
  OS command injection issues identified across separate code paths. Although similar
  in nature, each instance is tracked under a unique CVE ID.\n\nThis issue affects
  Archer BE230 v1.2 < 1.2.4 Build 20251218 rel.70420."
