title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/ipoib:
  Drain RCU callbacks during module teardown\n\nIPoIB reclamation completions can
  be signaled from inside an RCU callback.\nTeardown can wake before the callback
  returns and unload ib_ipoib while its\ncode is still executing.\n\nClient registration
  failure can also remove already-added devices and queue\ncallbacks. Wait after client
  and workqueue teardown."
