title: Moquette is a lightweight Java MQTT broker. Prior to 0.18.1, 
  PostOffice.publishWill publishes a client's Last-Will message without applying
  the canWrite authorization and reserved-topic checks used for a normal 
  PUBLISH. A client can configure a Will for a topic that the client is not 
  permitted to write and cause the broker to publish the unauthorized message 
  when the client disconnects unexpectedly. This issue allows unauthorized 
  message injection into restricted topics. This issue is fixed in version 
  0.18.1.
