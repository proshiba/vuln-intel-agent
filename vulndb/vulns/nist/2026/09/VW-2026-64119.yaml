title: lamp-cloud through 5.10.0 fails to validate the employeeId parameter in 
  the /anyone/visible/resource endpoint, allowing authenticated users to read 
  any employee's roles and permissions. Attackers can supply arbitrary 
  employeeId values to enumerate other employees' role codes, permission codes, 
  and complete front-end router trees without authorization checks.
