title: A vulnerability was found in Freedesktop Poppler 26.07.0. The impacted 
  element is the function JBIG2Stream::readCodeTableSeg of the file 
  poppler/JBIG2Stream.cc. Performing a manipulation results in integer overflow.
  The attack can be initiated remotely. The exploit has been made public and 
  could be used. The patch is named eb87cf711563894649bd0c365baa479401dc6d51. To
  fix this issue, it is recommended to deploy a patch.
