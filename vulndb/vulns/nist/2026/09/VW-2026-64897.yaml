title: A weakness has been identified in Neethuharii CafeManagement. Impacted is
  an unknown function of the file CafePortalLogin.php of the component Login 
  Handler. This manipulation of the argument uname causes sql injection. It is 
  possible to initiate the attack remotely. The exploit has been made available 
  to the public and could be used for attacks. This product is using a rolling 
  release to provide continious delivery. Therefore, no version details for 
  affected nor updated releases are available. The vendor was contacted early 
  about this disclosure but did not respond in any way.
