title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  hp-bioscfg: fix password encoding bounds check\n\nThe password PSWD_ENCODINGS parser
  reads password_obj[elem + pos_values]\nwhile copying the supported password encodings
  from the ACPI package.\n\nThe outer loop only guarantees that elem is within password_obj_count.\n\
  The encoding count is bounded by MAX_ENCODINGS_SIZE, but that does not\nguarantee
  that the ACPI package contains enough entries for all\nelem + pos_values accesses.\n\
  \nA malformed package can therefore declare a non-zero encoding count\nwithout providing
  enough string objects, causing the parser to read past\nthe ACPI package array and
  pass an out-of-bounds string pointer and\nlength to hp_convert_hexstr_to_str().\n\
  \nAdd the same computed-index bounds check used by the other offset-based\npackage
  parsing loops before reading password_obj[elem + pos_values]."
