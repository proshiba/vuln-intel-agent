title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfpga:
  altera-cvp: Avoid out-of-bounds read in trailing byte write\n\nThe trailing byte
  path in altera_cvp_send_block() dereferences a u32\npointer even when only 1-3 bytes
  remain in the input buffer. If the buffer\nends at a page or scatterlist boundary,
  this can read past the valid image\ndata and fault.\n\nCopy the remaining bytes
  into a zero-initialized u32 before writing the\nfinal word so only valid bytes are
  read from the input buffer."
