title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/crypto:
  Fix handling of EBUSY in PHMAC when req is pushed to crypto engine\n\nWhen a request
  is transferred to the engine via\ncrypto_transfer_hash_request_to_engine() there
  are two return codes\nsignaling a successful transfer: EINPROGRESS and EBUSY. However
  the\ncorrect handling of EBUSY was missing and has been added as a return\ncode
  indicating a successful transfer to the crypto engine."
