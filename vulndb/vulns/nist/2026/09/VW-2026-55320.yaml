title: A security issue in MongoDB Server allows an authenticated user with 
  elevated internal privileges to bypass a disabled feature gate in the applyOps
  command by specifying an internal replication mode value that was not intended
  to be client-selectable. This bypass enables execution of container operations
  that are disabled by default in production configurations, allowing direct 
  storage-engine writes to arbitrary internal storage tables. The authorization 
  check for these operations validates only the operation's namespace, not the 
  actual storage target, enabling writes to unrelated internal metadata or other
  collections' data.
