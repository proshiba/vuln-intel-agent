title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  reject a command chain that carries no commands\n\nA chain whose command_count is
  zero passes the payload length check,\nbecause struct_size(payload, data, 0) is
  just the header. The fill loop\nthen does not run, so offset stays zero and the
  request is submitted with\na zero-length buffer.\n\nOn firmware without AIE2_NPU_COMMAND
  that ends at the opcode check, since\nop is still ERT_INVALID_CMD and aie2_get_chain_msg_op()
  answers\nMSG_OP_MAX_OPCODE. aie2_get_npu_chain_msg_op() answers\nMSG_OP_CHAIN_EXEC_NPU
  whatever it is given, so there the submission\ncontinues to drm_clflush_virt_range(cmd_buf,
  0), which reads the byte\nbefore the buffer and faults on the vmap guard page. EXEC_CMD
  is\nreachable by any process that can open the render node.\n\nReject the request
  instead."
