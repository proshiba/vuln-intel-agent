title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  pm: fix memory leak from alloc-during-teardown race\n\nmptcp_pm_destroy() empties
  msk->pm.anno_list and\nmsk->pm.userspace_pm_local_addr_list under msk->pm.lock during
  socket\nteardown, dropping the lock between the two.\n\nA concurrent userspace PM
  genl ANNOUNCE on the same msk holds a sock\nreference via mptcp_token_get_sock()
  and, in\nmptcp_pm_nl_announce_doit(), calls\nmptcp_userspace_pm_append_new_local_addr()
  and\nmptcp_pm_announced_alloc(). Both take msk->pm.lock briefly to add to\ntheir
  respective lists. Because the genl handler holds a sock reference,\nmptcp_pm_destroy()
  may run on the same msk via mptcp_disconnect(), which\ninvokes mptcp_destroy_common()
  without dropping the sock refcount,\nbefore the handler completes.\n\nIf the lock
  acquisitions interleave such that mptcp_pm_destroy() empties\na list first, the
  later alloc adds its entry to a list head that nothing\nelse iterates for this msk,
  and the entry leaks. km"
