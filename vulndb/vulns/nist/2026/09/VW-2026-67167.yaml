title: Exposure of Sensitive Information to an Unauthorized Actor in Apache 
  Roller 6.1.5 allows a weblog administrator to read files on the application 
  classpath, including Roller configuration files containing secrets, by 
  authoring a Velocity template that uses an include directive to load a 
  classpath resource outside the theme namespace. Roller treats weblog 
  administrators as untrusted and enables a Velocity sandbox, but the include 
  and parse directives are not confined by it. No non-default configuration is 
  required; this affects any weblog whose administrator can author templates. 
  Users are recommended to upgrade to Apache Roller 6.1.6 or later, which 
  confines includes to the active theme and removes classpath resource loading 
  from weblog rendering.
