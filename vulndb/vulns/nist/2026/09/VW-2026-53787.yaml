title: R2R through 3.6.6 contains a stacked SQL injection vulnerability that 
  allows unauthenticated attackers to execute arbitrary SQL statements by 
  manipulating the index name parameter in the vector index creation endpoint. 
  The index name is interpolated directly into a CREATE INDEX statement via 
  string formatting without identifier quoting or allowlist validation, enabling
  arbitrary DDL and DML execution through semicolon-separated statements under 
  the PostgreSQL superuser account.
