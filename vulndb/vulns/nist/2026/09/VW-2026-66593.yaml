title: The wp-review-slider-pro WordPress plugin before 12.7.12 does not perform
  a capability check on the AJAX handler that saves its review submission forms,
  and the nonce protecting it is generated for every visitor, allowing any 
  authenticated user, such as a subscriber, to overwrite a live form with field 
  values that are output without escaping on public pages, leading to Stored 
  Cross-Site Scripting.
