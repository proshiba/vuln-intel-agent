title: The Unlimited Elements For Elementor plugin for WordPress is vulnerable 
  to Reflected Cross-Site Scripting via 'formData[id]' Parameter in all versions
  up to, and including, 2.0.17 due to insufficient input sanitization and output
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that execute if they can successfully trick a 
  user into performing an action such as clicking on a link. The front-end AJAX 
  handler is registered on the public 'wp' action with no nonce, capability, or 
  referer check, and the raw attacker-controlled id value is interpolated 
  verbatim into an exception message that is echoed back without escaping; when 
  the response is served as text/html rather than application/json, the browser 
  parses the injected markup.
