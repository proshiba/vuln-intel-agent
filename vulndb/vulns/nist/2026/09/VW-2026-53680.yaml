title: A double free in the OpenSSL-based TLS certificate revocation checking 
  path of the MongoDB C Driver can be reached by a TLS endpoint that the client 
  already trusts. During the handshake, specially formed certificate data can 
  cause the same heap object to be released twice. An unauthenticated party 
  acting as the trusted endpoint may cause the connecting client application to 
  terminate unexpectedly.
