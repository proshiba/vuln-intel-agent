title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  clear opcnt on compound arg release to prevent OOB read\n\nnfsd4_release_compoundargs()
  resets args->ops to the inline iops[8]\narray when the dynamically-allocated ops
  buffer is freed, but leaves\nargs->opcnt at its original value (which can be up
  to 200 for NFSv4.1+\ncompounds).\n\nIf rq_status_counter is stuck at an odd value
  (which can happen when\nnfsd_dispatch() hits an error path after setting it odd),
  the RPC\nstatus dumpit handler reads min(opcnt, 16) entries from args->ops[].\n\
  Since iops only has 8 elements and is the last field in struct\nnfsd4_compoundargs,
  reading indices 8-15 accesses adjacent slab memory\nand leaks it to userspace via
  netlink.\n\nZero opcnt unconditionally in nfsd4_release_compoundargs() so stale\n\
  compound metadata is never exposed through the status interface.\n\n[ cel: Remove
  the kvfree_rcu_mightsleep() sleep from the exposure window ]"
