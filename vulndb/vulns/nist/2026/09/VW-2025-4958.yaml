title: FreePBX Endpoint Manager is a module for managing telephony endpoints in 
  FreePBX systems. Versions are vulnerable to authentication bypass when the 
  authentication type is set to "webserver." When providing an Authorization 
  header with an arbitrary value, a session is associated with the target user 
  regardless of valid credentials. This issue is fixed in versions 16.0.44 and 
  17.0.23.
