title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  bail out on bitmap errors in xrep_agfl_fill\n\nLOLLM also points out that the xagb_bitmap_set
  call in xrep_agfl_fill\ncan fail, but we don't check the result of xagb_bitmap_walk,
  so we\nsilently drop the error and proceed with inconsistent incore data.\nThat
  shouldn't be allowed."
