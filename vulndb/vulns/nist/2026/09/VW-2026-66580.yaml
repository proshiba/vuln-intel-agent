title: OpenClaw (npm package `openclaw`) before 2026.7.1 does not enforce the 
  documented owner-only requirement for persistent `/activation` policy changes 
  in group channels. An authorized non-owner channel sender can change whether 
  the agent requires mention-based activation, causing the agent to respond more
  broadly in the group (exposing its responses to additional group traffic) or 
  suppressing expected activation behavior until an owner restores the intended 
  setting. The issue is fixed in version 2026.7.1.
