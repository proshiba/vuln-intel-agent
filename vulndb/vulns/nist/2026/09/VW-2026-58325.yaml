title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Reorder rpcrdma_rn_unregister before rdma_destroy_id\n\nsvc_rdma_free() caches rdma->sc_cm_id->device
  before teardown,\nthen calls rdma_destroy_id(sc_cm_id) which frees the cm_id.\n\
  rpcrdma_rn_unregister() follows, but between those two calls\nthe transport's sc_rn
  entry is still installed in the device's\nrd_xa. A concurrent ib_unregister_device
  walk can dispatch\nsvc_rdma_xprt_done() against the now-freed sc_cm_id.\n\nMove
  rpcrdma_rn_unregister() before rdma_destroy_id() so the\ntransport's notification
  entry is removed from the xarray before\nthe cm_id it references is destroyed.\n\
  \nAlso guard the sc_cm_id dereference with a NULL check: the\nfollowing patches
  introduce paths that reach svc_rdma_free()\nwith sc_cm_id == NULL (listener create
  failure, ADDR_CHANGE\nreplacement failure)."
