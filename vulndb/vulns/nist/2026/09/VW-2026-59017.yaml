title: Joomla Extension - joomshaper.com - Missing Access Control in Menu Item 
  Creation in SP Page Builder (Free and Pro) 4.0.0 - 6.9.0 - The add-to-menu 
  routine invoked the com_menus item model's save() method directly. That model 
  does not perform authorisation itself, because the relevant checks reside in 
  the com_menus controller, and the only check applied was core.edit on 
  com_sppagebuilder. Users with no permissions whatsoever on com_menus could 
  therefore create menu items, and because the record identifier was taken from 
  the submitted jform[menuid] field, could also overwrite existing ones. The 
  home flag was read back from the database and preserved, so the site's home 
  menu item could be repointed while remaining the home item.
