title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/chrome:
  sensorhub: Bound the EC-reported sensor number\n\nEach EC FIFO event carries an
  8-bit sensor number (in->sensor_num).\ncros_ec_sensorhub_ring_handler() validates
  the FIFO event count, the\nper-read count and the ring bound, but not the sensor
  number, which\ncros_ec_sensor_ring_process_event() then uses unchecked to index\n\
  sensorhub->batch_state[] - allocated with only sensorhub->sensor_num\nentries. A
  sensor number of sensor_num or larger is an out-of-bounds\nread and write of batch_state[].\n\
  \nValidate the sensor number in the ring handler, where each event is read\nfrom
  the EC, and drop a malformed event before it is used."
