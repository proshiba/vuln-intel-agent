title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  keembay - Fix AEAD unregister count in error path\n\nregister_aes_algs() registers
  the AEAD algorithms before registering the\nskcipher algorithms.  If skcipher registration
  fails, the function unwinds\nthe earlier AEAD registration with crypto_engine_unregister_aeads(),
  but it\npasses ARRAY_SIZE(algs), which is the skcipher table size.\n\nUse ARRAY_SIZE(algs_aead)
  for the AEAD unwind path so the unregister helper\niterates over the same table
  that was registered.  Also clarify the nearby\ncomment: the crypto registration
  helpers clean up algorithms registered\nwithin the same call, while this function
  must still unwind earlier\nsuccessful registration steps."
