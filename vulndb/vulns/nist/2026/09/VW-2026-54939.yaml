title: "Improper path validation vulnerability in the Gleam compiler's handling of
  git dependencies allows arbitrary file system modification during dependency download.\n\
  \nDependency names from gleam.toml and manifest.toml are incorporated into filesystem
  paths without sufficient validation or confinement to the intended dependency directory,
  allowing attacker-controlled paths (via relative traversal such as ../ or absolute
  paths) to target filesystem locations outside that directory. When resolving git
  dependencies (e.g. via gleam deps download), the computed path is used for filesystem
  operations including directory deletion and creation.\n\nThis vulnerability occurs
  during the dependency resolution and download phase, which is generally expected
  to be limited to fetching and preparing dependencies within a confined directory.
