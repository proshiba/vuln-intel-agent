title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  rpl: fix NULL dereference of idev in ipv6_rpl_srh_rcv()\n\nipv6_rpl_srh_rcv() dereferences
  idev from __in6_dev_get() without a NULL\ncheck when reading idev->cnf.rpl_seg_enabled.\n\
  \nWhen the device's MTU drops below IPV6_MIN_MTU, addrconf_ifdown() clears\ndev->ip6_ptr
  through RCU_INIT_POINTER(). A packet that passed the idev\ncheck in ip6_rcv_core()
  can then reach ipv6_rpl_srh_rcv() with\ndev->ip6_ptr already NULL.\n\nReproduced
  by flooding the receiving interface with ping6 traffic while\nflapping its MTU between
  1500 and 1200:\n\n BUG: KASAN: null-ptr-deref in ipv6_rpl_srh_rcv+0xb3/0x1070\n\
  \ Read of size 4 at addr 00000000000006b4 by task ping6/394\n\n CPU: 2 UID: 0 PID:
  394 Comm: ping6 Not tainted 7.2.0-rc7-micro-vm-dev-00095-g24ef02f934ee #240 PREEMPT(full)\n\
  \ Call Trace:\n  <IRQ>\n  kasan_report+0xc6/0x100\n  ipv6_rpl_srh_rcv+0xb3/0x1070\n\
  \  ip6_protocol_deliver_rcu+0x759/0x9a0\n  ip6_input_finish+0xa8/0x1b0\n  ip6_input+0xe1/0x490\n"
