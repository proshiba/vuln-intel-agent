title: InvenTree is an Open Source Inventory Management System. Prior to 1.4.0, 
  the /api/importer/row/ and /api/importer/mapping/ endpoints do not scope 
  DataImportRow and DataImportColumnMap querysets to the owner of the associated
  DataImportSession. Any authenticated user, including an account with no 
  assigned roles, can supply another user's import session identifier and 
  retrieve that session's row_data and data fields together with its column 
  mappings. This exposes the full contents of data staged for import across 
  users, although the InvenTree threat model treats authenticated instance users
  as trusted. This issue is fixed in version 1.4.0.
