title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio:
  rtc: time out alarm requests\n\nRTC class operations run with rtc_device.ops_lock
  held. The virtio RTC\nalarm requests currently wait without a timeout for the device
  to return\ntheir requestq buffers.\n\nOn surprise removal, virtio-pci marks the
  virtqueues broken before\nunregistering the virtio device. If an alarm request is
  waiting when the\ndevice stops responding, viortc_remove() blocks in viortc_class_stop()\n\
  while trying to acquire ops_lock. The request cannot complete and device\nremoval
  hangs until the waiting task is signalled.\n\nUse the same 60-second timeout as
  clock read requests for alarm reads,\nalarm programming, and alarm interrupt enable
  requests. The existing\nmessage reference counting keeps a timed-out request alive
  until a late\nresponse or device teardown."
