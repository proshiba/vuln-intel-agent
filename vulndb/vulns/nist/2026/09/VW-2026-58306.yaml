title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Don't BUG_ON a destroyed DSQ in process_deferred_reenq_users\n\nscx_bpf_dsq_reenq()
  queues a deferred reenq (dru) that runs from\nrun_deferred(), not ops.dispatch().
  If the DSQ is destroyed before the dru\nruns, process_deferred_reenq_users() sees
  dsq->id == SCX_DSQ_INVALID and\nhits the BUG_ON. destroy_dsq() doesn't flush pending
  drus, so just skip.\n\ntj: Read dsq->id once with READ_ONCE(). Reading it separately
  in the INVALID\n    check and the BUG_ON would leave a window where destroy_dsq()
  can\n    invalidate the id between the two reads and still trigger the BUG_ON."
