title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: do not attach hif2 WED when the main WED attach failed\n\nIf the WED
  attach for the primary PCIe function fails, the probe path\nstill attached wed_hif2
  for the secondary function, leaving the device\nin an inconsistent half-WED configuration
  that crashes later. The hif2\ncall also re-enabled hwrro_mode, which the failed
  primary attach had\njust turned off.\n\nSkip the hif2 WED setup when the primary
  WED device is not active."
