title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: ucsi: displayport: Fix OOB altmode array index\n\nThe UCSI displayport driver
  indexes the connector's port altmode array\nwith the GET_CURRENT_CAM response after
  checking it is not 0xff. The\nport altmode array is UCSI_MAX_ALTMODES elements long.
  If the PPM\nreturns an invalid GET_CURRENT_CAM response above UCSI_MAX_ALTMODES
  and\nnot equal to 0xff, the kernel may crash with an array index OOB error.\n\n\
  Update the UCSI displayport driver to verify the current cam is less\nthan UCSI_MAX_ALTMODES
  before accessing the port altmode array."
