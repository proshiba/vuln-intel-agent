title: InvoicePlane is a self-hosted open source application for managing 
  invoices, clients, and payments. Prior to 1.7.2, InvoicePlane exposes 
  Invoices::delete() and Invoices::delete_invoice_tax() as state-changing routes
  without requiring POST and validating a CSRF token. When an authenticated 
  administrator loads attacker-controlled content that requests an affected 
  route, the application can delete an invoice or invoice tax record. The 
  cross-origin action can remove financial data without the administrator's 
  intent. This issue is fixed in version 1.7.2.
