title: "The CoAP link-format helper match_path_uri() in subsys/net/lib/coap/coap_link_format.c
  compares a registered resource path against the URI carried in a Uri-Query href=
  option. That URI is not NUL terminated, but the inner character loop advanced its
  index k once per path character without ever testing it against the option length
  len. When a registered path segment is longer than the supplied URI and the URI
  is a prefix of it, the loop reads uri[len] and beyond, past the end of the option
  value.\n\nThe path is reached from coap_well_known_core_get_len() and coap_well_known_core_get()
  via match_queries_resource(), i.e. by any unauthenticated GET /.well-known/core?href=/<prefix>
  request to a device that serves /.well-known/core (for the CoAP server subsystem,
  CONFIG_COAP_SERVER_WELL_KNOWN_CORE, default y) and has at least one resource that
