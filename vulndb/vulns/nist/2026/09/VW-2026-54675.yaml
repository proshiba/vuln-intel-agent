title: A security vulnerability has been detected in JeecgBoot up to 3.9.3. This
  vulnerability affects the function exportXls of the file 
  jeecg-boot/jeecg-boot-module/jeecg-boot-module-airag/src/main/java/org/jeecg/modules/airag/llm/controller/AiragModelController.java.
  Such manipulation of the argument credential leads to improper access 
  controls. It is possible to launch the attack remotely. The exploit has been 
  disclosed publicly and may be used. Upgrading to version 3.9.5 is able to 
  resolve this issue. The name of the patch is 
  a2be896f753936956ee6863b632b8e5a0231345c. You should upgrade the affected 
  component.
