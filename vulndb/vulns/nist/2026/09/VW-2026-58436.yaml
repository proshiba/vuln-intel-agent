title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix leaked inode reference on writeback abort at umount\n\nceph_dirty_folio() takes
  a wrbuffer claim on each newly dirtied folio: it\nbumps i_wrbuffer_ref (taking an
  ihold() on the 0->1 transition) and\nattaches the snap_context to folio->private.\
  \  That claim is released only\nby ceph_put_wrbuffer_cap_refs(), which for a submitted
  write runs from\nwritepages_finish().\n\nIn ceph_submit_write(), if ceph_inc_osd_stopping_blocker()
  fails -- which\nhappens during umount -- the request is aborted before submission:
  the\nalready-collected folios are only redirtied and unlocked, so\nwritepages_finish()
  never runs and the claim is leaked.\nredirty_page_for_writepage() -> folio_redirty_for_writepage()
  ->\nfilemap_dirty_folio() sets PG_dirty directly and does not go through\n->dirty_folio,
  so ceph_dirty_folio() is not re-entered to rebalance it.\nBecause every subsequent
  writeback also fails the osd_stopping_blocker,\ni_wrbuffer_ref neve"
