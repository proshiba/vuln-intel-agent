title: Docmost is open-source collaborative wiki and documentation software. 
  From 0.21.0 until 0.95.0, any authenticated workspace member with edit rights 
  to a space can upload an archive to the page-import feature whose ZIP 
  extraction routine does not limit total uncompressed size, per-entry size, or 
  entry count. The extractor writes entries to the server temp directory and 
  automatically extracts one nested ZIP, allowing an outer upload within the 
  default 200 MB limit to expand by multiple GB. The resulting disk exhaustion 
  can crash the import worker and degrade or take down the instance for all 
  tenants. This issue is fixed in version 0.95.0.
