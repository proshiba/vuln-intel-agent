title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  SCO: hold sk properly in sco_conn_ready\n\nsk deref in sco_conn_ready must be done
  either under conn->lock, or\nholding a refcount, to avoid concurrent close. conn->sk
  and parent sk is\ncurrently accessed without either, and without checking parent->sk_state:\n\
  \n    [Task 1]            [Task 2]\n                        sco_sock_release\n \
  \   sco_conn_ready\n      sk = conn->sk\n                          lock_sock(sk)\n\
  \                            conn->sk = NULL\n      lock_sock(sk)\n            \
  \              release_sock(sk)\n                          sco_sock_kill(sk)\n \
  \      UAF on sk deref\n\nand similarly for access to sco_get_sock_listen() return
  value.\n\nFix possible UAF by holding sk refcount in sco_conn_ready() and making\n\
  sco_get_sock_listen() increase refcount. Also recheck after lock_sock\nthat the
  socket is still valid.  Adjust conn->sk locking so it's\nprotected also by lock_sock()
  of the associated socket if any."
