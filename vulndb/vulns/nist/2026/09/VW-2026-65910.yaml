title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: reject userspace cifs.idmap descriptions\n\ncifs.idmap key descriptions
  carry authority-bearing fields (owner and\ngroup SIDs and uid/gid values in \"os:\"\
  /\"gs:\"/\"oi:\"/\"gi:\" form) that the\ncifs.idmap upcall helper treats as kernel-originating
  inputs.  Unlike\nits sibling cifs.spnego, the cifs.idmap key type has no vet_description\n\
  hook, so userspace can create keys of this type through\nrequest_key(2)/add_key(2)
  and supply those fields without CIFS origin.\nA request_key(2) call with a non-NULL
  callout then drives a root\nusermodehelper upcall (/sbin/request-key -> cifs.idmap)
  that consumes\nthe unvetted description in root context.\n\nOnly accept cifs.idmap
  descriptions while CIFS is using its private\nroot_cred to request the key.  id_to_sid()/sid_to_id()
  already run\nunder override_creds(root_cred), so the kernel-originated path is\n\
  unaffected.\n\nThis mirrors commit 3da1fdf4efbc (\"smb: client: reject userspace\n\
  cifs.spn"
