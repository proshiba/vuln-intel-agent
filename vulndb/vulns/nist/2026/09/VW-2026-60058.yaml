title: "libwebsockets HTTP/2 HPACK Path Header Parsing Out-Of-Bounds Write Remote
  Code Execution Vulnerability. This vulnerability allows remote attackers to execute
  arbitrary code on affected installations of libwebsockets. Authentication is not
  required to exploit this vulnerability.\n\nThe specific flaw exists within the parsing
  of HTTP/2 HPACK path header. The issue results from the lack of proper validation
  of user-supplied data, which can result in a write past the end of an allocated
  buffer. An attacker can leverage this vulnerability to execute code in the context
  of the current process. Was ZDI-CAN-31036."
