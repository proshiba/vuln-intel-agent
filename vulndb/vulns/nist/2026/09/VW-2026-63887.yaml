title: "MISP has a security issue that can let a user gain more access than their
  API key is supposed to allow.\n\nA read-only API key should only let someone view
  information. However, after logging in with such a key, a specific MISP function
  could accidentally restore the user’s normal account permissions. This means someone
  with a read-only API key could potentially gain write, delete, or even administrator
  access if their underlying account has those permissions.\n\nExploiting the issue
  requires a valid read-only API key and a single request to the affected function.\n\
  \nThe main impact is that MISP’s API key restrictions can be bypassed, allowing
  actions that the API key was specifically meant to prevent.\n\n\n\n\nVersion affected:
  <2.5.47"
