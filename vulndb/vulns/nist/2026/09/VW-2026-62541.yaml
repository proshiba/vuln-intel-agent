title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Synchronize the error ISR against VINTF (de)init\n\nA user VINTF is torn down by
  tegra241_cmdqv_deinit_vintf(), which runs from\nthe destroy callback and from the
  init-failure unwind in the alloc handler.\nIt clears the cmdqv->vintfs[] slot and
  lets the iommufd core free it, but\nnothing serializes that against the error interrupt:
  tegra241_cmdqv_isr()\nreads cmdqv->vintfs[idx] and dereferences the vintf. A concurrent
  error can\nmake the ISR read a slot mid-clear (a NULL deref) or use a vintf which
  is\nabout to be freed (a use-after-free).\n\ndeinit_vintf() also returns idx to
  the IDA before clearing the slot, so a\nconcurrent create that reuses idx can publish
  its new vintf into the slot,\nonly for this teardown to erase it again with the
  stale NULL store.\n\nOn the other end, tegra241_cmdqv_init_vintf() publishes a new
  vintf with a\nplain store to the cmdqv->vintfs[] slot, and the ISR dereferences
  fields of\na"
