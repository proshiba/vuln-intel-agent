title: WeGIA is a web manager for charitable institutions. Prior to 3.8.5, WeGIA
  maps InternoControle to an empty resource array in web/controle/control.php, 
  and verificarPermissao in web/dao/MiddlewareDAO.php treats that empty array as
  unconditional access for every authenticated user. The methods in 
  web/controle/InternoControle.php, including listarUm, alterar, and excluir, 
  accept user-controlled id or idInterno values without verifying ownership, 
  allowing a low-privileged user to read, modify, or delete another person's 
  records and expose personal, identity, address, medical, and family 
  information. The advisory notes that a self-referencing load bug can crash 
  this controller in the reported revision, but the empty-resource authorization
  pattern and affected methods remain the vulnerability under review. This issue
  is fixed in version 3.8.5.
