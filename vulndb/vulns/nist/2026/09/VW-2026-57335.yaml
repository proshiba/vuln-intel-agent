title: SkillTree is a micro-learning gamification platform. Prior to version 
  4.4.2, two independent code flaws combine into a single exploitable attack 
  chain, with three distinct exploitation paths of escalating impact. 
  `StringHighlighter.js` builds an HTML string by interpolating raw `value` 
  substrings directly into a template literal with no HTML entity encoding. 
  `HighlightedValue.vue` renders that string — and all unfiltered plain values —
  via Vue's `v-html` directive, which sets `innerHTML`. Separately, the account 
  registration endpoint accepts `firstName`, `lastName`, and `nickname` fields 
  and stores them without any HTML sanitization. An attacker self-registers with
  `firstName = "<img src=x onerror=alert(1)>"` (28 characters — within the 
  30-character field limit) and visits any quiz. The next time an administrator 
  opens the Quiz Runs page the payload executes in their browser. Three attack 
  paths exist with escalating impact. The first is basic cross-site scripting. 
