title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cx231xx: reject geometry changes while the VBI queue is busy\n\nvidioc_s_fmt_vid_cap()
  and vidioc_s_std() change the device-wide\ndev->width / dev->norm but only refuse
  the change when the *video* queue\n(dev->vidq) is busy. The VBI queue (dev->vbiq)
  shares that same geometry:\ncx231xx_init_vbi_isoc() latches dma_q->lines_per_field
  from dev->norm,\nthe VBI videobuf2 plane is sized from dev->width / dev->norm in\n\
  vbi_queue_setup() and vbi_buf_prepare(), and cx231xx_do_vbi_copy() then\nrecomputes
  the destination offset from the *live* dev->width and the\nlatched lines_per_field
  on every URB completion:\n\n\toffset = lines_completed * (dev->width << 1) + ...;\n\
  \tif (dma_q->current_field == 2)\n\t\toffset += dev->width * 2 * dma_q->lines_per_field;\n\
  \tmemcpy(plane + offset, p_buffer, lencopy);\n\nBecause the VBI node shares video_ioctl_ops
