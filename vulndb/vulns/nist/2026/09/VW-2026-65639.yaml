title: Discourse is an open-source discussion platform. Prior to 2026.1.8, 
  2026.6.3, 2026.7.2, and 2026.8.0, provider-controlled video titles in lazy 
  video embeds could be reparsed as HTML when Discourse generated notification 
  emails or chat summaries. A user with standard posting privileges could create
  a post for an enabled YouTube, Vimeo, or TikTok provider whose title contained
  markup, and the email and chat-summary rendering path would place that markup 
  into the output instead of treating it solely as text. Recipients using 
  HTML-capable email clients could see injected content, potentially including 
  event handlers, but the issue did not directly expose a Discourse browser 
  session or affect the forum page itself. Lazy video embeds must be enabled, 
  which is the default configuration. This issue is fixed in versions 2026.1.8, 
  2026.6.3, 2026.7.2, and 2026.8.0.
