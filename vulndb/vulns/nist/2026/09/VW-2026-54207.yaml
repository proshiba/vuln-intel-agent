title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  reject unrepresentable multicast TVLV offsets\n\nThe network and transport header
  fields in struct sk_buff are 16-bit\noffsets from skb->head, and U16_MAX is reserved
  as the unset transport\nheader value. batadv_tvlv_call_handler() sets both fields
  from a received\nmulticast TVLV without checking whether the TVLV end is representable.\n\
  \nIf the end offset exceeds the field's range, skb_set_transport_header()\ntruncates
  it so that the transport header precedes the network header.\nThe negative difference
  is then returned by skb_network_header_len() as\na large u32. batadv_mcast_forw_packet()
  consequently accepts an oversized\nmulticast tracker and accesses memory beyond
  the skb data.\n\nAdd skb_set_transport_header_careful(), an offset-aware counterpart
  to\nskb_reset_transport_header_careful(), which validates the final\nhead-relative
  offset before assigning it. Use the new helper in\nbatadv_tvlv_call_handler() and
  reject "
