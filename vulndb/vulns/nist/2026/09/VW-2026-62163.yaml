title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  reject non zerocopy devmem tx\n\nDevmem tcp tx doesn't work without zero-copy, however
  it's not currently\nenforced if NETIF_F_SG isn't present. In this case, tcp_sendmsg_locked()\n\
  will try the copy path and try to copy data from an iovec which consists\nof offsets
  into the dma-buf and would normally fail. Moreover,\nd9c56501c72fd (\"net: tcp:
  block mixing readable and unreadable frags\")\nrelies on that and assumes that the
  devmem binding is present IFF we're\nusing the zero-copy path, which can be used
  to mix net-iov and pages in\na single skb, and break invariants. Let's reject devmem
  tx without\nzero-copy.\n\nNote, the parameter check the patch is modifying is too
  loose, we can\ncreate an io_uring request with dmabuf_id and all ZC flags, but which\n\
  won't have the binding. We replace it with stricter validation."
