title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  fix cn20k mailbox lifetime on repeated rvu_mbox_init()\n\nrvu_mbox_init() is called
  separately for AF-PF mailboxes during probe\nand for AF-VF mailboxes when SR-IOV
  is enabled.  Each call used to\nallocate a new ng_rvu object, leaking the first
  allocation when the\npointer was overwritten on the second call.\n\nSharing one
  ng_rvu across both paths exposed several teardown bugs:\nthe error path freed all
  cn20k mailbox DMA and kfree()d ng_rvu even\nwhen only the failing init type should
  be unwound, leaving live AF-PF\nmailbox memory in use after an AF-VF init failure.\
  \  mutex_init() was\nalso re-run on the AF-VF path while AF-PF mailbox handlers
  could still\nhold rvu->mbox_lock.  Probe and SR-IOV failure paths did not release\n\
  cn20k mailbox DMA either, since cleanup only happened in rvu_remove().\n\nAllocate
  ng_rvu once with devm_kzalloc(), initialize mbox_lock in the\nsame block, unwind
  only the mailbox memory for the fai"
