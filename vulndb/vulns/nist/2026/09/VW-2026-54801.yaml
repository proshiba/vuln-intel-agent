title: "Affected versions of MISP validate the user-configurable homepage by checking
  only whether the supplied path begins with /. That check is insufficient because
  protocol-relative URLs such as //attacker.example also begin with / but resolve
  to an external origin in browsers.\n\n\nThe vulnerable homepage value can be stored
  as a user setting and later used by the post-login routing logic. The commit explicitly
  identifies //attacker.example as a payload that passed validation and was emitted
  to the Location header after login.\n\nThe fix introduces a shared InternalRedirectValidator
  that rejects URLs containing a host, scheme, userinfo, unsafe leading // or /\\\
  , malformed URLs, and control characters. It also revalidates homepage settings
  on read so legacy or internally written unsafe values cannot bypass the new storage-time
  validation.\n\nVersion affected: ≤2.5.45"
