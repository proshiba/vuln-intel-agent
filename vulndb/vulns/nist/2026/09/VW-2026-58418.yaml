title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  picolcd: clamp eeprom debugfs read to bytes actually received\n\npicolcd_debug_eeprom_read()
  trusts resp->raw_data[2] -- a length byte\nsupplied by the device in its REPORT_EE_DATA
  reply -- clamped only to\nthe caller's read() count:\n\n\tret = resp->raw_data[2];\n\
  \tif (ret > s)\n\t\tret = s;\n\tif (copy_to_user(u, resp->raw_data+3, ret))\n\n\
  It never checks resp->raw_size, the number of bytes picolcd_raw_event()\nactually
  copied into the 64-byte raw_data[] of the kmalloc'd struct\npicolcd_pending. A device
  (or a spoofed picoLCD) returning a length byte\nof 0xff, read with a count >= 255,
  makes copy_to_user() read past\nraw_data[] into adjacent slab memory and return
  it to userspace through\nthe debugfs \"eeprom\" file:\n\n\tBUG: KASAN: slab-out-of-bounds
  in _copy_to_user\n\tRead of size 255 ... picolcd_debug_eeprom_read+0x214/0x2f0 [hid_picolcd]\n\
