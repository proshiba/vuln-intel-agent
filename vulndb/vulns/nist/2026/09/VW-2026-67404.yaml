title: A security flaw has been discovered in Eleveo Quality Management 9.7.0. 
  This issue affects the function UtilsService.createAndSaveAudit of the file 
  /qm/cz.zoom.scorecard.webui.Scorecard/QMUtilsService of the component GWT RPC 
  Handler. Performing a manipulation results in information disclosure. The 
  attack is possible to be carried out remotely. The exploit has been released 
  to the public and may be used for attacks. The vendor was contacted early 
  about this disclosure but did not respond in any way.
