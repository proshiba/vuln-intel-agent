title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix readahead synchronisation issues by loading all folios upfront\n\nThere are
  some synchronisation issues that derive from the app thread\nadding more folios
  to the rolling buffer whilst the collector thread is\nlooking at them or trying
  to clear them, such as determining the setting of\nfront_folio_order when the next
  folio hasn't been added yet,\n\nThe reason for the rolling buffer approach is that
  loading the buffer\nupfront and then dropping all the refs just acquired is quite
  a slow\noperation, and loading progressively allows some of the cost to be deferred\n\
  until after at least some of the I/O is started.\n\nInstead, a better way is to
  load all the folios into the rolling buffer\nupfront - and then drop the refs later,
  once the I/O is in progress.  (Even\nbetter would be for the refs not to be there
  at all.)\n\nFix this by changing the rolling buffer loader to load all the folios\n\
  selected by the VM for readahead upfro"
