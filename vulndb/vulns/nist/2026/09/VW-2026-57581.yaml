title: "Capgo (Cap-go/capgo.app) contains an authentication bypass affecting all versions
  (no patched version available at time of publication). The Edge authorization path
  allows a password-only Supabase aal1 session to exercise privileged RBAC permissions
  even when the account has a verified MFA factor that has not been used for the session:
  the Edge JWT middleware (foundJWT() in supabase/functions/_backend/utils/hono_middleware.ts)
  accepts the JWT without validating its assurance level, and the direct RBAC path
  (checkPermission()/checkPermissionPg() in supabase/functions/_backend/utils/rbac.ts
  calling public.rbac_check_permission_direct()) authorizes by user ID without passing
  or checking the session aal, unlike the public.verify_mfa() control which correctly
  requires aal2. An attacker who knows only the victim's password can therefore authenticate,
  mint a persistent app-scoped app_admin API key that remains valid after the aal1
  session is logged out, and perform privileged operations such "
