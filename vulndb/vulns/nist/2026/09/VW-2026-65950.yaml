title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  vfb: defer cleanup until the last reference\n\nFBIOGETCMAP takes a shallow snapshot
  of info->cmap and performs the\nusercopy after dropping info->lock. vfb_remove()
  frees the colormap\nimmediately after unregistering the framebuffer, even when an
  open file\nstill holds a reference to fb_info. A concurrent driver unbind can\n\
  therefore free the colormap while the ioctl copies it to userspace.\n\nKASAN reports:\n\
  \n  BUG: KASAN: slab-use-after-free in _copy_to_user\n  Read of size 512 by task
  poc/125\n\n   _copy_to_user (./include/linux/instrumented.h:129 ./include/linux/uaccess.h:201
  lib/usercopy.c:24)\n   fb_cmap_to_user (./include/linux/uaccess.h:230 drivers/video/fbdev/core/fbcmap.c:211)\n\
  \   do_fb_ioctl (drivers/video/fbdev/core/fb_chrdev.c:114)\n\n   Allocated by task
  1:\n   fb_alloc_cmap_gfp (./include/linux/slab.h:973 ./include/linux/slab.h:1290
  drivers/video/fbdev/core/fbcmap.c:108)\n   vfb_probe (drivers/video/fbdev/vfb.c:45"
