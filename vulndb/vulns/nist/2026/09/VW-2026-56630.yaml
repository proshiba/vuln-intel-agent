title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the GitHub Trigger generated a webhook secret but 
  discarded it when GitHub returned HTTP 422 and the node reused an existing 
  webhook. Workflow static data then retained webhookId without webhookSecret, 
  and X-Hub-Signature-256 verification accepted deliveries without a stored 
  secret. The affected logic includes 
  packages/nodes-base/nodes/Github/GithubTriggerHelpers.ts and the 422 webhook 
  reuse path. This issue is fixed in versions 1.123.76, 2.37.7 and 2.38.2.
