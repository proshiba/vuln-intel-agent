title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm:
  Fix user-space data loss with MADV_FREE and THP\n\nSome of users of Polars (a data
  analytics library) have lost production\ndata from this bug. They seem to have just
  the right combination of\nhuge pages, MADV_FREE and heavy reclaim pressure.\n\n\
  pmd_modify() masks the old value with (_HPAGE_CHG_MASK & ~_PAGE_DIRTY),\nsilently
  discarding the hardware dirty bit.  The subsequent\npmd_mksaveddirty() call is supposed
  to transfer _PAGE_DIRTY into\n_PAGE_SAVED_DIRTY when write-protecting, but the dirty
  bit was already\nstripped from the value, so there is nothing left to transfer.\n\
  \nContrast with pte_modify(), which keeps _PAGE_DIRTY_BITS in its mask,\nand pud_modify(),
  which keeps _HPAGE_CHG_MASK untouched: pmd_modify()\nis the odd one out.  Any pmd_modify()
  on a writable, dirty PMD loses\nthe dirty state.\n\nOne visible consequence is data
  loss with MADV_FREE on PMD-mapped THP:\n\n    memset(buf, 0x5A, size);         \
  \ // PMD-mapped "
