title: Use of hardcoded cryptographic keys in Circutor SGE-PLC1000/SGE-PLC50 
  v9.0.2. The affected firmware contains a hardcoded static authentication key. 
  An attacker with local access to the device can extract this key (e.g., by 
  analysing the firmware image or memory dump) and create valid firmware update 
  packages. This bypasses all intended access controls and grants full 
  administrative privileges.
