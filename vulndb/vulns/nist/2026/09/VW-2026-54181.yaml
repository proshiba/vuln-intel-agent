title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix NULL pointer dereference in nvmet_execute_identify_nslist()\n\nWhen a host issues
  an Identify command with CNS 07h (Active Namespace ID\nList for a specific I/O Command
  Set), nvmet_execute_identify_nslist() is\ncalled with match_css set. The command-set
  filter dereferences req->ns,\nbut this handler never calls nvmet_req_find_ns(),
  so req->ns is always\nNULL (nvmet_req_init() resets it to NULL). As soon as an enabled\n\
  namespace with an NSID greater than the requested value exists,\nreq->ns->csi dereferences
  a NULL pointer and oopses.\n\nBesides the crash, the comparison is logically wrong:
  to filter the list\nby command set it must test the command set of the namespace
  being\niterated, not a single fixed value. Use the loop variable ns->csi."
