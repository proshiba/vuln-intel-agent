title: "A vulnerability exists in Google  Apigee's JavaCallout policy https://docs.apigee.com/api-platform/reference/policies/java-callout-policy\
  \  that allows for remote code execution.\n\nIt is possible for a user to write
  a JavaCallout that injected a malicious object into the MessageContext to execute
  arbitrary Java code and system commands at runtime, leading to unauthorized access
  to data, lateral movement within the network, and access to backend systems.\n\n\
  The Apigee hybrid versions below have all been updated to protect from this vulnerability:\n\
  \  *  Hybrid_1.11.2+\n  *  Hybrid_1.12.4+\n  *  Hybrid_1.13.3+\n  *  Hybrid_1.14.1+\n\
  \  *  OPDK_5202+\n  *  OPDK_5300+"
