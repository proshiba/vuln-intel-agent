title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau/uvmm:
  clear the dirty flag when unwinding an OP_UNMAP_SPARSE\n\nA successful OP_UNMAP_SPARSE
  marks its region dirty with\nnouveau_uvma_region_dirty() and defers the teardown
  to\nnouveau_uvmm_bind_job_cleanup(); it does not remove the region from\nuvmm->region_mt.\n\
  \nIf a later op in the job fails, the unwind path never clears reg->dirty\n(set
  in one place, cleared nowhere) and sets op->reg = NULL, so cleanup\nskips the teardown.
  The region is left in the tree with dirty set and its\ncompletion never signalled.
  Later binds over that range then fail\npermanently -- -ENOENT or -EINVAL from the
  dirty checks, or an unkillable\nwait_for_completion() in bind_validate_region()
  -- for the lifetime of\nthe uvmm.\n\nClear reg->dirty when the unwind reverts the
  sparse unmap, restoring the\nregion to the state it was found in."
