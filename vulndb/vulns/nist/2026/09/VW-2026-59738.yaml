title: "The SMS OTP flow fails to adequately handle error messages, allowing an attacker
  to infer the existence of registered user accounts based on the responses received
  during the OTP initiation process.\n\nThis weakness can be exploited by an attacker
  to discover valid usernames within the system. The impact is amplified for accounts
  that have not configured a mobile number, as the enumeration is specifically tied
  to this condition. The discovery of these usernames can facilitate subsequent brute
  force attacks, social engineering attempts, and information leakage, potentially
  leading to reputational damage, loss of customer trust, and regulatory non-compliance."
