title: "In Eclipse Ditto versions [1.3.0, 3.9.6], the ImplicitThingCreationMessageMapper
  of the connectivity service builds a CreateThing command by substituting placeholder
  values (e.g. {{ header:device_id }}) resolved from inbound message headers into
  a pre-configured JSON \"thing\" template as raw, un-escaped strings, and then parses
  the resulting string as JSON. Because the placeholder engine performs no JSON escaping
  and is unaware of the surrounding JSON string context, a resolved value containing
  a double-quote character can break out of its string and inject additional JSON
  structure.\n\n\n\n\nWhen a connection is configured to use this mapper with a template
  that reflects a header whose value a publishing device can control (for example
  an MQTT 5 user property, an AMQP 1.0 application property, or a Kafka record header),
  an attacker able to publish on that connection can inject an inline _policy object.
