title: "A vulnerability in the CLI of Cisco IOS Software and Cisco IOS XE Software
  could allow an authenticated, local attacker to cause an affected device to reload
  unexpectedly, resulting in a denial of service (DoS) condition.\r\n\r This vulnerability
  is due to a buffer overflow. An attacker with a low-privileged account could exploit
  this vulnerability by using crafted commands at the CLI prompt. A successful exploit
  could allow the attacker to cause the affected device to reload, resulting in a
  DoS condition."
