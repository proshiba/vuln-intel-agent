title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4/flexfiles:
  fix NULL dereference for NFSv4.0 data servers\n\nflexfiles accepts NFSv4.0 data
  servers, but two NFSv4 code paths assume\nthe data server client has a session.
  Unlike NFSv4.1+, an NFSv4.0 client\nhas no session (clp->cl_session is NULL; it
  uses clp->cl_slot_tbl), so\nI/O to a v4.0 flexfiles DS oopses:\n\n  - nfs4_init_ds_session()
  dereferences clp->cl_session->session_state\n    while seeding the DS lease. It
  also only seeds cl_lease_time when\n    NFS4_SESSION_INITING is set; without a session
  that never happens, so\n    cl_lease_time stays 0 and nfs4_renew_state() busy-loops,
  requeuing\n    every 5 seconds. Seed the lease whenever there is no session and\n\
  \    return before touching session state.\n\n  - ff_layout_async_handle_error_v4()
  dereferences\n    clp->cl_session->fc_slot_table on every DS I/O error. Fall back
  to the\n    v4.0 transport slot table (clp->cl_slot_tbl) when there is no session."
