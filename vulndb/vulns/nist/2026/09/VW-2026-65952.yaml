title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  autofs: fix memory leak in autofs_fill_super()\n\nIn autofs_fill_super(), we create
  a new inode using\nautofs_new_ino(), however, if we fail to create root_inode,\n\
  (that is, root_inode failure path), we return -ENOMEM without\nfreeing the new inode(ino)
  that we created causing a memory leak.\nFix this by adding autofs_free_ino() to
  free the inode we created\nin root_inode failure path before returning ENOMEM."
