title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  verisilicon: rockchip: guard VPU981 AV1 divisor and tile buffer\n\nrockchip_vpu981_av1_dec_set_tile_info()
  divides context_update_tile_id by\ntile_info->tile_cols and writes one descriptor
  per tile into the tile_info\nDMA buffer, which holds AV1_MAX_TILES entries; tile_cols
  and tile_rows\ncome from the bitstream. Guard the division against a zero tile_cols
  by\ninitialising the context-update values to zero and computing them only\nwhen
  tile_cols is non-zero, and stop the descriptor writes once the\ntile_info buffer
  is full. The tile geometry written to the hardware\nregisters is left unmodified;
  the per-dimension and total tile bounds are\nenforced by the control validation."
