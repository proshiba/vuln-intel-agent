title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: fix double hif2 init on the non-WED path\n\nmt7915_pci_init_hif2()
  was called unconditionally and again inside the\nWED-inactive branch. The helper
  increments the global hif_idx, writes the\nPCIe RECOG_ID register and takes a get_device()
  reference via\nmt7915_pci_get_hif2(), while removal only drops one reference. On
  non-WED\ndual-hif hardware this double-incremented hif_idx, wrote RECOG_ID twice
  and\nleaked a device reference. Only the call inside the WED-inactive branch is\n\
  correct; drop the unconditional one. hif2 is already initialised to NULL."
