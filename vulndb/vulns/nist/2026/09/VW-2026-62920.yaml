title: "CubeCart is an ecommerce software solution. Prior to 6.7.5, admin/sources/products.index.inc.php
  reads the description, description_short, and spec_copy rich-text fields from $GLOBALS['RAW']['POST']
  and removes only script elements before the values are stored and rendered through
  Smarty templates. An administrator with product-editing rights can store event-handler
  attributes, SVG content, or javascript: URIs that bypass this filter, causing persistent
  JavaScript execution when a storefront visitor or another administrator views the
  product content and enabling session exposure or unauthorized browser-context actions.
  This issue is fixed in version 6.7.5."
