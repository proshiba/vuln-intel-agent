title: The MailerLite – Signup forms (official) plugin for WordPress is 
  vulnerable to unauthorized modification of data due to a missing capability 
  check on the forms() method of the AdminController class in all versions up 
  to, and including, 1.7.21. This makes it possible for authenticated attackers,
  with Contributor-level access and above, to create or delete arbitrary signup 
  forms.
