title: froxlor is a server administration panel. In versions 2.3.10 and earlier,
  Validate::validateUrl rejects carriage return and line feed characters only in
  the path, query and fragment components returned by parse_url, and never 
  inspects the userinfo (user:pass@) components. This is an incomplete fix for 
  GHSA-c3p2. An authenticated low-privilege customer with subdomain-create 
  rights (no admin or change_serversettings privilege required) can supply a 
  subdomain redirect URL that carries a CR/LF payload in the userinfo portion 
  (e.g. http://user%0areturn 200 "pwned";%0a@evil.com/). The value passes 
  validation, survives IDNA encoding, and is written verbatim into the generated
  nginx or Apache vhost configuration, allowing the attacker to break out of the
  emitted directive and inject arbitrary web-server configuration lines. froxlor
