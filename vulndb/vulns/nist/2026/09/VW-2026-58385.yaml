title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfsnotify:
  Fix stale object mask after concurrent mark updates\n\nWhen a mark gets a new event
  bit, fanotify and inotify may avoid\nrecalculating the object mask if the cached
  aggregate already contains that\nbit. This is racy with a recalculation triggered
  by a concurrent update to\nanother mark on the same connector.\n\nThe concurrent
  scan can read the mark before the new bit is added, while\nthe updater reads the
  old aggregate before that scan publishes its result.\nThe updater then skips recalculation
  and the scan publishes a mask without\nthe bit, leaving the object mask stale after
  both updates complete.\n\nThis can be reproduced with two fanotify groups watching
  the same inode:\none thread removes FAN_MODIFY from one existing mark while another
  thread\nadds FAN_MODIFY to the other mark. After both fanotify_mark() calls return,\n\
  writes can fail to produce FAN_MODIFY for the group whose mark now contains\nthe
  bit. This was reprod"
