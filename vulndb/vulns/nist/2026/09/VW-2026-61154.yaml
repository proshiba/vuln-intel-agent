title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrpcrdma:
  arm rn_done before publishing the notification\n\nrpcrdma_rn_register() inserts
  @rn into rd_xa with xa_alloc() before\nstoring the caller's callback in rn->rn_done.
  The xarray makes @rn\nreachable to rpcrdma_remove_one(), which walks rd_xa and invokes\n\
  rn->rn_done(rn) for every registered notification. A device removal\nthat races
  a fresh registration can therefore observe @rn with\nrn_done still NULL, because
  the notification objects are zero\nallocated by their owners, and call through a
  NULL function pointer.\n\nStore rn->rn_done before xa_alloc() publishes @rn. The
  xarray's\nstore-side and load-side ordering then guarantees that any CPU which\n\
  finds @rn in rd_xa also observes the armed callback.\n\nrpcrdma_rn_unregister()
  treats a non-NULL rn_done as the sentinel\nfor a completed registration, so the
  early store must not survive a\nfailed registration. Clear rn_done again when xa_alloc()
  fails.\nWere it left set, the fail"
