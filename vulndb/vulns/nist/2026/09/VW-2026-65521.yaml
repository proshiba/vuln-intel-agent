title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rtrs-srv:
  Fix integer underflow in process_read and process_write\n\nusr_len is read from
  a network-supplied message field (le16_to_cpu)\nand used to compute data_len = off
  - usr_len without validating that\nusr_len <= off. A malicious RDMA client can send
  usr_len > off causing\nan integer underflow, resulting in data_len wrapping to a
  huge size_t\nvalue which is then passed to the rdma_ev callback as a memory length,\n\
  leading to out-of-bounds memory access.\n\nFix by reading and validating usr_len
  <= off before rtrs_srv_get_ops_ids()\nin both process_read() and process_write(),
  ensuring the early return\npath acquires no reference and has no resource leak."
