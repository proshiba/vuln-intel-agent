title: SAP UI5 does not sufficiently validate the parent frame's origin against 
  the configured allowlist. An unauthenticated attacker could host a malicious 
  page to bypass framing restrictions. If an authenticated victim visits the 
  attacker's page and interacts with it, the attacker could trick the victim 
  into performing unintended actions, resulting in a low impact on integrity. 
  There is no impact on confidentiality and availability.
