title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix BUG_ON in nfsd4_alloc_layout_stateid on racing delegation revoke\n\nnfsd4_alloc_layout_stateid
  reads fp->fi_deleg_file without holding\nfi_lock when the parent stateid is a delegation.
  A concurrent delegation\nrevoke via the laundromat can clear fi_deleg_file under
  fi_lock, causing\nnfsd_file_get() to return NULL and triggering the BUG_ON.\n\n\
  This race is client-reachable: two NFS clients can trigger it by having\none hold
  a delegation while another opens the same file to force a\nrecall. When the first
  client doesn't respond to the recall, the\nlaundromat revokes it. A concurrent LAYOUTGET
  from any client using the\ndelegation stateid hits the race window.\n\nFix this
  by taking fi_lock around the fi_deleg_file read in the\nSC_TYPE_DELEG path, matching
  the locking discipline of the\nfind_any_file() arm, and replacing the BUG_ON with
  a graceful error\nreturn that cleans up the partially-initialized layout stateid."
