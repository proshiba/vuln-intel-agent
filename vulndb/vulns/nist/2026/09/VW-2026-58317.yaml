title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Use svc_xprt_put to free listener on create failure\n\nsvc_rdma_create() calls kfree(cma_xprt)
  when\nsvc_rdma_create_listen_id() fails. svc_xprt_init() has already\nacquired a
  net namespace reference via get_net_track(); kfree\nbypasses svc_xprt_free() which
  releases it.\n\nReplace the kfree() with svc_xprt_put() so the kref_init birth\n\
  reference drops to zero and svc_xprt_free() dispatches\nsvc_rdma_free() to clean
  up properly. sc_cm_id is still NULL\nat that point; the preceding patch added the
  necessary NULL\nguard in svc_rdma_free().\n\nsvc_xprt_free() also drops the module
  reference via\nmodule_put(), but the caller _svc_xprt_create() does the same\non
  xpo_create failure, double-putting the single\ntry_module_get() it acquired. Take
  a compensating\n__module_get() before the svc_xprt_put() to keep the count\nbalanced,
  matching the convention in svc_rdma_accept()'s error\npath."
