title: Incorrect authorization in the custom storage volume creation endpoint in
  Canonical LXD versions 5.0.0 and later (fixed in 5.0.10, 5.21.8 and 6.10) on 
  Linux allows an authenticated client with permission to create custom volumes 
  in a project to copy, and so read, any custom storage volume from any other 
  project on the server, including its snapshots and configuration. The client 
  does this with a crafted request that sets a source volume and source.project 
  but omits source.type.
