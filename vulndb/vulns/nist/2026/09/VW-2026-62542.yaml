title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Publish an LVCMDQ only after it is fully initialized\n\ntegra241_vintf_init_lvcmdq()
  stores the freshly allocated vcmdq pointer to\nthe vintf->lvcmdqs[] array, before
  tegra241_vcmdq_alloc_smmu_cmdq() builds\nthe vcmdq->cmdq. The error ISR dereferences
  that cmdq, so a latched LVCMDQ\nerror (e.g. one inherited across a kexec) firing
  in this window would make\ntegra241_vintf0_handle_error() pass the still-zeroed
  arm_smmu_cmdq down to\n__arm_smmu_cmdq_skip_err(), dereferencing NULL queue register
  pointers.\n\nDrop the store from tegra241_vintf_init_lvcmdq() and publish the vcmdq
  at\nthe end of the allocation instead, with an smp_store_release() that pairs\n\
  with an smp_load_acquire() in the ISR, which can see a fully built LVCMDQ\nor NULL.\n\
  \nThe user-owned LVCMDQ allocation moves accordingly, publishing the vcmdq\nonce
  tegra241_vcmdq_hw_init_user() succeeds, using a plain store since a\nuser VINTF's
  lvcmdqs[] has no"
