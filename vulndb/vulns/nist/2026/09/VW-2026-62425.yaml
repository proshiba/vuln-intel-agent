title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  cgroup: Fix invalid storage access after __cgroup_bpf_attach failed\n\nA potential
  invalid storage access issue can occur after replacing a\ncgroup bpf prog.\n\nThis
  occurs in the following scenario:\n1. prog1 with storage is attached to a cgroup
  in multi-attach mode.\n2. prog1 is replaced with prog2 using BPF_F_REPLACE in multi-attach\n\
  \   mode, but fails midway (e.g. in bpf_trampoline_link_cgroup_shim or\n   update_effective_progs).\n\
  3. A new prog3 is attached to the cgroup in multi-attach mode.\n\nThe reason is
  that __cgroup_bpf_attach overwrites pl->storage with the\nnew storage prior to attachment
  completion. When attachment fails\nmidway, the cleanup path calls bpf_cgroup_storages_free(new_storage)
  to\nfree the newly allocated storage, but fails to restore pl->storage back\nto
  old_storage.\n\nConsequently, the still-active prog1 holds invalid or dangling storage\n\
  pointers, leading to an invalid memory access when prog1 execute"
