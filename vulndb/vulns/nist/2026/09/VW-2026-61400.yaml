title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: Fix Use-After-Free in AIO error path\n\nIn ffs_epfile_write_iter()
  and ffs_epfile_read_iter(), when ffs_epfile_io()\nfails with an error other than
  -EIOCBQUEUED, the io_data structure (`p`) is\nfreed. However, for AIO operations,
  the kiocb cancel function was already\narmed and kiocb->private was set to `p`.\n\
  \nIf a concurrent cancel operation (such as sys_io_cancel()) executes after\nffs_epfile_io()
  fails but before the function frees `p`, a Use-After-Free\ncan occur when the cancellation
  handler accesses the freed pointer.\n\nTo securely fix this race condition, we must
  properly un-arm the\ncancellation. Invoking `kiocb->ki_complete()` does exactly
  this by\nacquiring `ctx->ctx_lock` and safely removing the kiocb from the active\n\
  sequence. In doing so, it ensures that a parallel io_cancel can no longer\ndiscover
  the kiocb, effectively closing the race window.\n\nWe then return -EIOCBQUEUED to
  notify the VFS layer t"
