title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Roll back partial protocol table registration\n\nscmi_protocol_table_register()
  can leave earlier requests registered when\na later entry in the same ID table fails.
  Each request retains a pointer\nto the driver's ID table, so a failed module load
  can leave a dangling\npointer after the module storage is released.\n\nUnrequest
  only the successfully registered prefix, in reverse order,\nbefore returning the
  failure. Leave the failed entry and the remaining\nentries untouched because matching
  requests can be owned by another\ndriver."
