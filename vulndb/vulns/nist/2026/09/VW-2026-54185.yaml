title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/iommufd:
  Fix NULL pointer deref in iommufd_ioas_change_process when racing with iopt_map_file_pages\n\
  \niommufd_ioas_change_process() iterates every IOAS area while only\nholding every
  IOAS iova_rwsem, so it assumes every area has a non-NULL\npages pointer. That assumption
  can be false when it runs concurrently\nwith iopt_map_file_pages().\n\niopt_map_pages()
  executes in two phases. It first creates the area and\ninserts it into the interval
  tree under iova_rwsem, with area->pages\nstill NULL. It then drops iova_rwsem and
  later fills area->pages\nunder domains_rwsem. This leaves a window between area
  creation and\narea->pages fill where a concurrent iommufd_ioas_change_process()\n\
  can observe the area and dereference a NULL area->pages pointer,\nleading to a NULL
  pointer dereference:\n\nBUG: kernel NULL pointer dereference, address: 00000000000000c0\n\
  #PF: supervisor read access in kernel mode\n#PF: error_code(0x0000) - not-present"
