title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: at91_udc: drain polled-VBUS timer/work before udc is freed\n\nIn polled-VBUS
  mode (board.vbus_pin && board.vbus_polled), probe arms a\nself-restarting cycle:
  at91_vbus_timer() schedules vbus_timer_work, and\nat91_vbus_timer_work() calls at91_vbus_update()
  and re-arms the timer via\nmod_timer(). Both recover the same udc through container_of
  and dereference\nit on every iteration.\n\nNeither teardown path cancels this cycle.
  udc is devm-allocated, so it is\nfreed after at91udc_remove() returns, and is likewise
  freed when probe\nfails and devres runs. A timer callback or work item that is pending
  or\nrunning at either point dereferences the freed udc.\n\nAdd at91_udc_shutdown_vbus_timer()
  and call it from at91udc_remove() and\nfrom the usb_add_gadget_udc() failure path
  in probe; the remaining probe\nerror paths fail before the timer is armed. timer_shutdown_sync()
  waits\nfor a running callback and clears timer->function, w"
