title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  don't return -EINVAL for successful nested thaw\n\nCommit 7366f8b6fc6a (\"fs: handle
  freezing from multiple devices\")\nreplaced the freeze_holders bitmask with per-holder
  counters to allow\nnested freezes. In the bitmask version, a thaw that released
  a shared\nhold while another holder remained returned 0. Since the rework,\nthaw_super_locked()
  drops the freeze reference via freeze_dec() but\nthen returns -EINVAL when other
  freezers remain, misinforming the\ncaller: the thaw did succeed, the superblock
  just stays frozen for the\nremaining holders.\n\nThis breaks bdev-initiated freezing.
  When a filesystem is frozen with\nFIFREEZE and additionally frozen via bdev_freeze()
  -- which nests by\ndesign, see fs_bdev_freeze() -- the subsequent bdev_thaw() receives\n\
  -EINVAL from the holder op although its freeze reference was dropped,\nand therefore
  keeps bd_fsfreeze_count elevated. Then device-mapper's\nunlock_fs() ignores bdev_thaw()'s
  re"
