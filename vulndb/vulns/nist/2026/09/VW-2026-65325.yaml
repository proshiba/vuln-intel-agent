title: NanoSVG commit 239e102ec contains an incorrect numeric conversion 
  vulnerability in nsvg__pathArcTo() when parsing SVG arc commands. A specially 
  crafted SVG document containing extreme arc radius values can cause 
  intermediate arc calculations to produce a NaN delta angle. The function 
  subsequently converts this NaN value to int without validating that it is 
  finite and representable, resulting in undefined behavior and process 
  termination, leading to denial of service.
