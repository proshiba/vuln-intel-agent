title: A denial of service flaw was found in Poppler's Splash backend. A crafted
  PDF with tiling-pattern geometry approaching the int32 boundary can cause 
  SplashOutputDev::tilingPatternFill to compute an attacker-controlled repeat 
  count that drives an excessively long loop in the pattern-fill scanline 
  routine, without a corresponding memory allocation. An attacker could exploit 
  this by supplying a malicious PDF to an application that renders it via 
  Poppler's Splash backend, causing the rendering process to consume 100% CPU 
  for an attacker-controlled, extended duration.
