title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sparx5: fix sleep in atomic context in MAC table access\n\nsparx5_set_rx_mode()
  runs with netif_addr_lock_bh held and iterates\ndev->mc via __dev_mc_sync(), which
  per address calls sparx5_mc_sync() /\nsparx5_mc_unsync() -> sparx5_mact_learn()
  / sparx5_mact_forget().  These\ntake sparx5->lock, a mutex, and then poll the MAC
  access command\nregister with readx_poll_timeout(). A mutex may block, which is
  not\nallowed from atomic context.\n\nConvert the driver to the new .ndo_set_rx_mode_async
  callback introduced\nin commit 3554b4345d85 (\"net: introduce ndo_set_rx_mode_async
  and\nnetdev_rx_mode_work\"). The async callback is invoked from process\ncontext,
  so the mutex and sleeping completion poll can remain.\n\nObserved with CONFIG_PROVE_LOCKING,
  CONFIG_DEBUG_SPINLOCK,\nCONFIG_DEBUG_MUTEXES and CONFIG_DEBUG_ATOMIC_SLEEP enabled:\n\
  \n  BUG: sleeping function called from invalid context at kernel/locking/mutex.c:591\n\
  \  in_atomic(): 1, irq"
