title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  bound the persisted tail-position offset\n\ncache_pos_decode() takes the persisted
  key_tail and dirty_tail seg_off from\nthe cache device and addresses within the
  segment with it. A seg_off at or\npast the segment data_size, controllable by whoever
  supplies the device\n(CAP_SYS_ADMIN), reads past the segment data.\n\nReject a decoded
  seg_off that is not below the segment data_size."
