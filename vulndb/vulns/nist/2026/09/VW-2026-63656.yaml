title: A vulnerability was found in AdithyaYelloju Restaurant Management System 
  up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. This affects the function 
  mysqli_query of the file admin/add_table.php. The manipulation of the argument
  table/members/price results in sql injection. It is possible to launch the 
  attack remotely. The exploit has been made public and could be used. This 
  product takes the approach of rolling releases to provide continious delivery.
  Therefore, version details for affected and updated releases are not 
  available. The project was informed of the problem early through an issue 
  report but has not responded yet.
