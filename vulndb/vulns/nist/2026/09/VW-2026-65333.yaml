title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  Zero rpc_gss_wire_cred at svcauth_gss_decode_credbody() entry\n\nsvcauth_gss_decode_credbody()
  writes the caller's\nrpc_gss_wire_cred field by field and assigns gc_ctx.len only
  on\nthe success tail.  The caller storage is svcdata->clcred, which\nlives in the
  per-svc_rqst gss_svc_data and is reused across\nrequests.  Early decode failures
  leave partially decoded state\nmixed with residue from the prior request.\n\nThe
  trailing body_len tightness check is the sharpest case:\nxdr_stream_decode_opaque_inline()
  has already written gc_ctx.data\nwith a borrowed inline pointer into the current
  request's XDR\npages, but gc_ctx.len retains its prior value.  Once the request\n\
  pages are released the pooled clcred carries a dangling pointer\npaired with a stale
  length.\n\nZero the caller's rpc_gss_wire_cred at function entry so that\nevery
  early-return path leaves a deterministic all-zero cred.\nOn the trailing tightness-check
  path, gc_ctx."
