title: "MISP contains a DOM-based cross-site scripting (XSS) vulnerability in the
  contextual menu JavaScript component. The ContextualMenu class populates HTML <option>
  elements by assigning user-controllable values to the innerHTML property. Because
  innerHTML parses and renders HTML markup, any untrusted string supplied as the option
  text (value.text or value) is interpreted as live DOM content rather than plain
  text. An attacker who can influence the data rendered in the contextual menu can
  inject arbitrary HTML or JavaScript that executes in the victim's browser within
  the MISP application origin. This may allow session hijacking, data exfiltration,
  or unauthorized actions performed on behalf of the authenticated user.\n\nVersion
  affected: <2.5.47"
