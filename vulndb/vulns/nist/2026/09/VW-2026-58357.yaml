title: "In the Linux kernel, the following vulnerability has been resolved:\n\njbd2:
  bound shrinker scans by examined checkpoint buffers\n\nThe jbd2 shrinker currently
  accounts only checkpoint buffers that it\nsuccessfully releases against nr_to_scan.\
  \  Busy buffers therefore do not\nconsume the scan budget.\n\nIf a checkpoint transaction
  contains mostly busy buffers, the shrinker\ncan scan its entire checkpoint list
  while holding journal->j_list_lock.\nLarge checkpoint lists can result in excessive
  lock hold times and leave\nother CPUs spinning on j_list_lock, causing soft lockups
  or RCU stalls.\n\nPass nr_to_scan into journal_shrink_one_cp_list() and decrement
  it for\nevery buffer examined, including busy buffers.  Pass NULL from checkpoint\n\
  cleanup paths so their existing full-list behavior is preserved.\n\nThis restores
  the scan-budget semantics that existed before\njournal_shrink_one_cp_list() was
  changed to always scan a complete\ncheckpoint list."
