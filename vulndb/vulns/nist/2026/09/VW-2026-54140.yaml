title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  nintendo: fix out-of-bounds read in joycon_ctlr_read_handler()\n\njoycon_ctlr_read_handler()
  casts an incoming HID input report to\nstruct joycon_input_report and parses it,
  guarding the cast only with a\n12-byte length check:\n\n\tif (size >= 12) /* make
  sure it contains the input report */\n\t\tjoycon_parse_report(ctlr, (struct joycon_input_report
  *)data);\n\nstruct joycon_input_report is 49 bytes: a 13-byte header followed by
  a\nunion whose IMU arm is 36 bytes. For an IMU report joycon_parse_report()\n->
  joycon_parse_imu_report() walks that union (struct offsets 13..48),\nso a report
  of exactly 12 bytes with data[0] == JC_INPUT_IMU_DATA passes\nthe guard yet is read
  up to 37 bytes past its declared length. The\nover-read bytes are decoded into accelerometer/gyroscope
  values and\nforwarded to userspace through the \"(IMU)\" input device, leaking\n\
  driver-internal memory. data[0] and size are fully controlled by a\nmalicious or
  spoofe"
