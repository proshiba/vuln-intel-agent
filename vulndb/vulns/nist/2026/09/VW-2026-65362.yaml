title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  meson: vdec: fix NULL pointer deref in vdec_try_fmt_common\n\nWhen VIDIOC_TRY_FMT
  is called with an unsupported pixel format on the\nOUTPUT queue, vdec_try_fmt_common()
  falls back to V4L2_PIX_FMT_MPEG2.\nHowever, if a distro has locally patched MPEG2
  support out (as it has\nbeen broken for some time) the platform format table does
  not contain\nMPEG2 so find_format() returns NULL and the subsequent dereference
  of\nfmt_out->max_width triggers a NULL pointer dereference.\n\nFix this by falling
  back to the first format in the platform's format\narray instead of hardcoding V4L2_PIX_FMT_MPEG2.
  This is always valid\nsince every platform defines at least one format."
