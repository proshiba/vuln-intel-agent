title: PassMark PerformanceTest before 11.1 build 1012, BurnInTest before 11.1 
  build 1000, and OSForensics before 11.1 build 1016 contain an information 
  disclosure vulnerability in DirectIo64.sys that allows unauthenticated local 
  attackers to dump complete physical memory contents by supplying a 
  caller-controlled file path to an exposed IOCTL. Attackers can issue a single 
  IOCTL call to trigger the driver to iterate all physical memory ranges via 
  MmGetPhysicalMemoryRanges and map each page through ZwMapViewOfSection on the 
  PhysicalMemory section object, writing a full RAM image to an 
  attacker-specified path in the SYSTEM context, bypassing user-mode ACLs and 
  exposing LSASS working set, process memory, and cryptographic material from 
  all running processes.
