title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  drop ESP-in-TCP packets with no ingress device\n\nESP-in-TCP receives records through
  the TCP strparser. handle_esp()\nrestores skb->dev from the saved skb_iif before
  passing the packet into\nthe XFRM input path.\n\nQueued TCP data can be processed
  after the original ingress device has\nbeen removed, for example during veth or
  net namespace teardown. In that\ncase dev_get_by_index_rcu() returns NULL. The XFRM
  IPv4 and IPv6 input\npaths both expect skb->dev to be valid while building the route
  lookup,\nso queued ESP-in-TCP data can dereference a NULL device.\n\nDrop the packet
  if the saved ingress device can no longer be resolved.\nSuch a packet can no longer
  be routed through the normal XFRM receive\npath, and this preserves the existing
  behaviour for packets whose ingress\ndevice still exists."
