title: A flaw has been found in sfturing ssm_pro up to 
  627f426331da8086ce8fff2017d65b1ddef384f8. Affected is an unknown function of 
  the file ssm_pro/src/main/java/cn/sfturing/web/OrderController.java of the 
  component Order Endpoint. This manipulation of the argument 
  hospitalName/officesName/doctorName causes cross site scripting. It is 
  possible to initiate the attack remotely. The exploit has been published and 
  may be used. The project was informed of the problem early through an issue 
  report but has not responded yet.
