title: A vulnerability was determined in tsi-coop tsi-dpdp-cms up to 0.5.0. 
  Affected by this issue is some unknown functionality of the file web.xml of 
  the component Admin Console/DPO Compliance Console. Executing a manipulation 
  can lead to missing authentication. It is possible to launch the attack 
