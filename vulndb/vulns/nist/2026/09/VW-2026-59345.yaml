title: Skipper is an HTTP router and reverse proxy for service composition. 
  Prior to 0.27.35, the opaAuthorizeRequestWithBody filter in 
  filters/openpolicyagent/openpolicyagent.go can allow an oversized declared 
  Content-Length request to bypass a deny-on-presence Rego policy because 
  ExtractHttpBodyOptionally leaves OPA with an empty parsed_body while 
  forwarding the complete request body upstream. This incomplete remediation of 
  CVE-2026-50197 affects deployments that authorize request-body content and 
  exceed -open-policy-agent-max-request-body-size, which defaults to 1 MB. 
  Policy logic that does not reject input.attributes.request.http.truncated_body
  can therefore fail open and permit a forbidden payload to reach the protected 
  service, while small bodies and the previously fixed chunked-body case are 
  evaluated normally. This issue is fixed in version 0.27.35.
