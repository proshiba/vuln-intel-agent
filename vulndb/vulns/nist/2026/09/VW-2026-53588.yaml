title: A vulnerability was identified in langgenius dify 1.13.0. Affected by 
  this vulnerability is the function router.replace of the file 
  web/app/(shareLayout)/webapp-signin/components/mail-and-password-auth.tsx of 
  the component WebApp Sign-In. Such manipulation of the argument redirect_url 
  leads to cross site scripting. The attack may be performed from remote. The 
  exploit is publicly available and might be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
