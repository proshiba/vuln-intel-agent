title: "In the Linux kernel, the following vulnerability has been resolved:\n\nzram:
  set default primary compressor in zram_destroy_comps()\n\nPatch series \"zram: fix
  zram issues reported by sashiko\".\n\nSashiko drove by and reported [1] a couple
  of zram issues:\na possible BUG_ON() in zlib code due to missing winbits range\n\
  validation and one possible NULL-ptr dereference in zcomp.\nBoth are low risk yet
  still worth fixing.\n\n\nThis patch (of 2):\n\nzram_destroy_comps() resets all compressors
  and leaves them set to NULL,\nincluding the primary one, which is invalid device
  state, as now\ncomp_algorithm_show()->strcmp() can be called on a NULL compressor.\
  \  Set\ndefault primary compressor in zram_destroy_comps()."
