title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: cros_usbpd: Limit port counts to EC_USB_PD_MAX_PORTS\n\nCurrently the cros_usbpd-charger
  driver probe iterates based on raw\ncharger port count returned by the embedded
  controller. The only check\nis against the number of USB PD ports which the embedded
  controller\nalso defines. A malicious embedded controller could return an inaccurate\n\
  port count (up to 255) resulting in an out of bounds write and\nsubsequent memory
  corruption.\n\nUpdate helper functions in cros_usbpd-charger to limit port counts
  to\nEC_USB_PD_MAX_PORTS."
