title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  part: reject MTDPART_OFS_RETAIN in mtd_add_partition()\n\nmtd_add_partition() does
  not reject the special offset value\nMTDPART_OFS_RETAIN (-3), which leads to a WARN_ON
  in\nadd_mtd_device() when called through the BLKPG ioctl on NAND\ndevices. The RETAIN
  value depends on cur_offset being the end of\nthe previous partition, but in the
  dynamic partition path\ncur_offset equals the offset argument itself, causing undefined\n\
  behavior.\n\nCommit 5daa7b21496a (\"mtd: prepare partition add and del functions\n\
  for ioctl requests\") introduced mtd_add_partition() and correctly\nrejected MTDPART_OFS_APPEND
  (-1) and MTDPART_OFS_NXTBLK (-2),\nsince those special offsets rely on cur_offset
  tracking the\nprevious partition's end. However, commit 1a31368bf92e (\"mtd: add
  a flags\nfor partitions which should just leave smth. after them\")\nlater added
  MTDPART_OFS_RETAIN (-3) for the static\npartition table path without updating mtd_add_partition()
