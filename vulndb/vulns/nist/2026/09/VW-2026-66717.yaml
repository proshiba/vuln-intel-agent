title: Kyverno before 1.19.1 contains a namespace isolation bypass in the 
  apiCall context entry of namespaced Policy resources due to inconsistent path 
  interpretation between validation and execution. A low-privilege tenant can 
  use percent-encoded dot-segments in urlPath to bypass namespace checks and 
  read resources from other namespaces using the Kyverno admission controller's 
  ServiceAccount credentials.
