title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: fix flow mask use-after-free on flow deletion\n\nThe commit in the
  Fixes tag below made so flow->mask free is scheduled\nvia RCU right after it is
  removed from the flow table.  The pointer\nstays in the flow structure and it can
  be accessible while in the same\nRCU critical section.  This is done to avoid requiring
  ovs_mutex for\nthe ovs_flow_free().\n\nHowever, while removing the flow during processing
  of CMD_DEL, we do\nnot take RCU read lock before the removal, and ovs_flow_cmd_fill_info()\n\
  uses the flow->mask pointer afterwards.  The RCU read lock is taken,\nbut it's already
  late at that point.  The comment on that line\nacknowledges that the lock is cosmetic
  and doesn't serve a real purpose.\n\nThis leads to use-after-free if the RCU grace
  period passes between\nremoval and the filling.  It is a short race window, but
  it is there\nand can lead to a real crash in case memory allocation for the info\n\
