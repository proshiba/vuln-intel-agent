title: GoCD is a continuous deliver server. From 18.7.0 until 26.1.0, the Get 
  Template Config API compares HTTP method names case-sensitively when selecting
  authorization filters. A lower-privileged authenticated user can send a 
  request with nonstandard HTTP method capitalization to retrieve a pipeline 
  template by name without the required view permission and read its 
  configuration. API operations that modify data are not affected, secure 
  variables remain encrypted, and deployments whose reverse proxy rejects 
  non-uppercase HTTP methods are not affected. This issue is fixed in version 
  26.1.0.
