title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (corsair-cpro) Create debugfs entries after hwmon registration\n\nccp_debugfs_init()
  registers debugfs files whose private data is the devm\nallocated ccp.  It runs
  before hwmon_device_register_with_info(), so when\nthat registration fails, ccp_probe()
  returns with the files still in\nplace.  The HID core then frees ccp, and ccp_remove()
  is not called for a\nfailed probe, so nothing removes them later either.  Reading
  one of the\nfiles dereferences the freed pointer.\n\nCreate the debugfs entries
  only after the hwmon device has been\nregistered, so no failing path can leave them
  behind.\n\nThe two version queries stay where they are.  They send USB commands\n\
  without holding ccp->mutex, which is only safe as long as nothing else\ncan call
  send_usb_cmd(); once the hwmon device is registered its\ncallbacks can do so concurrently.\
  \  Only the debugfs creation moves, and\nit is told which queries succeeded."
