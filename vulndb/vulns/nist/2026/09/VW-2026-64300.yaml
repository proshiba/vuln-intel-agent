title: Lantronix SLC8000 before firmware v9.7.0.3, SLC9000 before firmware 
  v9.7.0.2, EMG8500/EMG7500 before firmware v9.7.0.1, and all firmware versions 
  of SLB882 contain a server-side request forgery vulnerability in the 
  WebSSH/WebTelnet listener that allows unauthenticated attackers to cause the 
  affected device to establish SSH connections to attacker-controlled endpoints.
  The custom shellinaboxd builds its SSH connection target using a snprintf call
  with user-supplied input; by supplying an overlong username string an attacker
  causes the device IP suffix to be truncated, redirecting the resulting 
  connection to an arbitrary host. Attackers can use this capability to 
  enumerate or communicate with internal network endpoints that would otherwise 
  be inaccessible.
