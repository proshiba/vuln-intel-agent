title: "Improper Validation of Specified Quantity in Input vulnerability in Erlang/OTP
  eldap allows a malicious or compromised LDAP server to degrade availability by returning
  a referral URL whose port component is a very long run of digits.\n\neldap:parse_port/2
  passes the port substring straight to list_to_integer/1 with no length bound. The
  surrounding try ... catch only rejects a value that fails to parse, so a syntactically
  valid port of up to roughly 1.26 million digits converts successfully and costs
  the caller hundreds of milliseconds of arbitrary-precision arithmetic per referral.
  The conversion function itself is documented to accept integers of any size, so
  bounding the input is the caller's responsibility. Reaching the flaw requires the
  application to pass a server-supplied referral to eldap:parse_ldap_url/1, which
  eldap never calls itself: referral strings are returned to the caller unparsed.\n\
  \nThis issue affects OTP from OTP 17.0 before OTP 27.3.4.17, from OTP 28.0 before
  OTP 28.5.0"
