title: 'Nuclei is a vulnerability scanner built on a simple YAML-based DSL. From 3.0.0
  until 3.10.0, the DAST/fuzz payload path in pkg/fuzz/parts.go can evaluate substituted
  runtime data more than once, creating a second evaluation pass that allows response
  content captured by an internal: true extractor in one protocol step to be reinterpreted
  as template syntax in a later fuzz step. This vulnerability is an incomplete fix
  for CVE-2026-41645: the prior remediation made expressions.Evaluate() single-pass
  within one call but did not prevent DAST/fuzz callers from evaluating substituted
  output again. When -env-vars is enabled, a malicious scan target can return marker-shaped
  content that resolves against the template variable map and discloses scanner-host
  environment variables such as credentials, API keys, or tokens. The vulnerability
