title: A vulnerability has been found in cheshire-cat-ai Cheshire Cat AI up to 
  1.9.2. This affects the function _authorize_http_key of the file 
  core/cat/factory/custom_auth_handler.py. The manipulation of the argument 
  user_id leads to missing authentication. The attack may be initiated remotely.
  The exploit has been disclosed to the public and may be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
