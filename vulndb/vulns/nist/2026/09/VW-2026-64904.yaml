title: orval versions 8.14.0 through 8.28.1 contain a code injection 
  vulnerability in the @orval/effect generator that converts OpenAPI schema 
  defaults into template literals. Attackers can inject arbitrary JavaScript 
  expressions via schema defaults containing ${...} syntax, which are executed 
  at module scope when the generated code is built or imported.
