title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix percpu map update indexing with sparse CPU IDs\n\nPer-CPU array, hash, and cgroup
  storage map updates without BPF_F_CPU\nor BPF_F_ALL_CPUS use a value buffer whose
  per-CPU slots are packed in\npossible-CPU order. The buffer is sized as:\n\n  round_up(value_size,
  8) * num_possible_cpus()\n\nThe update paths iterate over possible CPUs, but use
  the logical CPU ID\nto calculate the source offset:\n\n  value + size * cpu\n\n\
  This only works when possible CPU IDs are contiguous starting at zero.\n\nFor example,
  with a possible CPU mask of 0,2-3, the buffer contains\nthree slots corresponding
  to CPUs 0, 2, and 3. CPU2 is therefore\nexpected to use slot 1 and CPU3 slot 2.
  Instead, the current code uses\nslots 2 and 3 respectively, causing incorrect per-CPU
  values and an\nout-of-bounds read from the update buffer for CPU3.\n\nThe corresponding
  lookup paths already use a dense offset while\niterating over possible CPUs. Do
