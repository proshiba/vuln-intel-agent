title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  megaraid_sas: Limit NVMe request size to the PRP chain frame\n\nmegasas_make_prp_nvme()
  builds a command's PRP list in cmd->sg_frame, a\nDMA pool buffer of instance->max_chain_frame_sz
  bytes, spending one\nentry per NVMe page of the transfer plus one per page of the
  buffer for\nthe chain pointer. The loop runs until the transfer is described and\n\
  never checks the buffer bound.\n\nmax_hw_sectors comes straight from the MDTS the
  firmware reports for the\ndrive. On drives with a large MDTS the only thing keeping
  the list\ninside the buffer was the block layer default of 1280 KiB, which needs\n\
  320 entries, which fit into a 4 KiB frame as that holds 512. But since\ncommit 9b8b84879d4a
  (\"block: Increase BLK_DEF_MAX_SECTORS_CAP\") that\ndefault is 4 MiB, and such a
  transfer needs 1025 entries, so the list\nruns a full page past the end of the frame:\n\
  \n  sd 1:0:1:0: [sdb] tag#630 page boundary ptr_sgl: 0x00000000ba62d13f\n  BUG:
  unable "
