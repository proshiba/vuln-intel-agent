title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Serialize flash version read in reset handler\n\nThe \"update cache versions
  without reset\" sysfs reset operation (0x20261)\ncalls get_flash_version(), which
  reads hardware flash registers, without\nholding ha->optrom_mutex. The VPD update
  path serializes the same call\nunder optrom_mutex, so this reset path can interleave
  its flash register\naccesses with a concurrent VPD or optrom flash operation and
  corrupt the\nreads.\n\nHold ha->optrom_mutex across the get_flash_version() call
  to match the\nVPD update path."
