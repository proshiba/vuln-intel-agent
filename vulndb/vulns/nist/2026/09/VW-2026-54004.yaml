title: Traefik versions before v2.11.55 and versions v3.0.0 through v3.7.10 
  contain an authentication bypass vulnerability in the digestAuth middleware 
  where unknown usernames receive an empty secret instead of rejection. 
  Attackers can compute a valid digest response using the empty secret and 
  arbitrary credentials to bypass authentication on any digestAuth-protected 
  route without a valid username or password.
