title: vm2 versions 3.11.3 through 3.11.6 expose the host process's real 
  https.globalAgent to sandboxed code when a NodeVM is explicitly configured to 
  allow require('https'). The builtin loader wraps host modules in a read-only 
  proxy, but method calls such as Agent.prototype.on() are forwarded to the 
  underlying host object, so sandbox code can register a listener for the 
  agent's 'free' event. When an unrelated host HTTPS request releases a pooled 
  connection, the listener receives the live host request options and the host 
  TLSSocket, allowing sandboxed code to read the host's Authorization header and
  private destination host/port, attach a data listener to the released socket 
  and read subsequent host response bodies in plaintext, and issue 
  attacker-chosen authenticated requests using the stolen credentials. The issue
  is fixed in 3.11.7.
