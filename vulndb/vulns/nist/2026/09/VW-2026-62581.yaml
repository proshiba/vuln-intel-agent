title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix potential use after free in counter_release()\n\nWhen accessing a counter via
  the netlink path the only synchronization\nmechanism for the said counter is rdma_restrack_get().\n\
  Currently, rdma_restrack_del() is invoked at the end of\ncounter_release(), which
  is too late, since by that point\nvendor-specific resources associated with the
  counter might already be\nfreed. This can leave a short window where the counter
  remains\naccessible through restrack, leading to a potential use-after-free.\n\n\
  Fix this by moving the rdma_restrack_del() call to be before the\nfreeing of the
  vendor-specific resources, ensuring that the counter is\nremoved from restrack before
  its internal resources are released.\nThis guarantees that no new users hold references
  to a counter that is\nin the process of destruction."
