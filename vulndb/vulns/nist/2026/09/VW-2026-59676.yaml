title: Weights & Biases wandb before 0.29.0 fails to validate the file name from
  server responses in the File.download function, allowing path traversal 
  attacks. Attackers controlling the backend can supply file names with 
  directory traversal sequences to write files outside the intended download 
  directory, potentially enabling code execution through modification of shell 
  startup files or Python import paths.
