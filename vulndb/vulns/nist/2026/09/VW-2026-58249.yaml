title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/percpu:
  Fix MVIY_PERCPU() with older binutils\n\nCommit a737737cdb9c (\"s390/percpu: Infrastructure
  for more efficient\nthis_cpu operations\") introduced MVIY_PERCPU(), which stringifies\n\
  arguments that are already C string literals. This generates an\nassembler macro
  invocation with whitespace-separated quoted arguments:\n\n  GEN_MVIY \"459712\"\
  \ \"%r3\"\n\nGNU as versions prior to binutils 2.39 drop the separating whitespace\n\
  between quoted macro arguments during input scrubbing. They\nconsequently parse
  the invocation as a single argument and emit\nrepeated warnings:\n\n  Warning: missing
  closing `\"'\n\nThe .ifc in GEN_MVIY never matches and GNU as exits successfully\n\
  without emitting the mviy instruction. As a result, the interrupted\nper-CPU sequence
  is not marked in lowcore and the exception return\npath cannot repair the per-CPU
  address register after migration.\n\nAll MVIY_PERCPU() callers pass C string literals.
  Use them directly\na"
