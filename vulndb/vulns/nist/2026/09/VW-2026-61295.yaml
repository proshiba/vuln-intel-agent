title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  chemical: atlas-sensor: fix PM reference leak in buffer postenable\n\natlas_buffer_postenable()
  acquires a runtime PM reference with\npm_runtime_resume_and_get() but returns the
  result of\natlas_set_interrupt() directly. If atlas_set_interrupt() fails,\nthe
  runtime PM reference is leaked and the device can never\nautosuspend.\n\nAdd pm_runtime_put_autosuspend()
  on the error path to balance\nthe reference."
