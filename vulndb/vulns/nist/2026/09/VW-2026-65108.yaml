title: "RabbitMQ is a messaging and streaming broker. Prior to versions 3.13.15, 4.0.20,
  4.1.11, and 4.2.6, The management UI uses EJS 1.0 in which <%= ... %> does NOT HTML-escape.
  connection.ejs:135 renders <%= connection.ssl_details.peer_cert_subject %> (and
  peer_cert_issuer) directly into the page. The same pattern appears in streamConnection.ejs:102,106,110.
  The values come from rabbit_ssl:peer_cert_subject/1 which formats the DN as a string
  without HTML escaping. The verifier corrected the original researcher's claim: this
  is reachable only when the listener is configured with verify_peer (so the certificate
  must be signed by a CA in the broker's trust store, not arbitrary self-signed);
  however, in deployments using mTLS for client authentication, any user who can request
  a certificate from the organisational CA controls the Subject CN. An attacker who
  can obtain a TLS client certificate signed by a CA the broker trusts (with verify_peer
  enabled) can embed JavaScript in the certificate's "
