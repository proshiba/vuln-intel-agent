title: "A flaw was found in the automation-controller input-validation\n         \
  \         guard sanitize_jinja(). The function uses two regular\n              \
  \    expressions to reject user-supplied Jinja, but the patterns\n             \
  \     stop at the first interior '}' or '%' character, so a Jinja\n            \
  \      expression containing an inner brace (for example an empty\n            \
  \      dict) is accepted while remaining valid Jinja. Because\n                \
  \  sanitize_jinja() is the sole guard on several launch-time\n                 \
  \ fields — ad-hoc command module_args, Machine-credential\n                  username
  / become_method / become_user, and inventory host\n                  names — a low-privileged
  user can inject Jinja that ansible-core\n                  evaluates in the execution
  environment. This enables execution\n                  of arbitrary commands in
  the execution environment (bypassing an\n                  administrator's AD_HOC_COMMANDS
  module allowlist) and disclosure\n  "
