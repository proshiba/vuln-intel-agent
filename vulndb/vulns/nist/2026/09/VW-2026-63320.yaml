status: active
title: Mongoid does not restrict which query operators may come from 
  caller-supplied filter data when an application hands that data to its 
  query-building methods. In an application that forwards externally supplied 
  filter parameters in this way, a party with no credentials may influence how 
  the database evaluates the query. This may result in unintended disclosure of 
  stored field values and in reduced database performance.
