title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/umem:
  Be careful about boundary conditions in ib_umem_find_best_pgsz()\n\nSeveral corner
  cases, especially important on 32 bits:\n\n- umem->iova is u64, the function argument
  should pass in u64 or\n  iova will be truncated\n- Check that the length is not
  too large for the iova\n- Check that lengths > 4G don't overflow the GENMASK"
