title: "An Incorrect Permission Assignment for Critical Resource vulnerability in
  the ASUS DriverHub update process allows privilege escalation due to improper protection
  of required execution resources during the validation phase, permitting a local
  user to make unprivileged modifications. This allows the altered resource to pass
  system checks and be executed with elevated privileges upon a user-initiated update.\n\
  Refer to the 'Security Update for ASUS DriverHub' section on the ASUS Security Advisory
  for more information."
