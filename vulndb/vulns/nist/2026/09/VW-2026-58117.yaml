title: A flaw was found in `multipathd`. A local attacker with access to the 
  `multipathd` UNIX control socket can exploit this vulnerability by sending 
  valid commands and then ceasing to read replies. This action can cause the 
  `multipathd` listener thread to block, leading to a Denial of Service (DoS) 
  where legitimate Inter-Process Communication (IPC) operations may hang or time
  out. This issue does not result in privilege escalation, arbitrary code 
  execution, or impact data confidentiality or integrity.
