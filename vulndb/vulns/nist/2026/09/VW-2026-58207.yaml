title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipmi:
  Remove all sysfs files on registration failure\n\nipmi_add_smi() creates the nr_users
  and nr_msgs files before trying to\ncreate the maintenance_mode file. If that last
  creation fails, the error\npath removes only nr_users before dropping the final
  reference to the\ninterface.\n\nRemove nr_msgs as well so no sysfs attribute embedded
  in the freed\ninterface remains registered."
