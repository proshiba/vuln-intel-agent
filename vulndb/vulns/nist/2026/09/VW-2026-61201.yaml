title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Avoid req_q_map double-read in qla2x00_error_entry()\n\nqla2x00_error_entry()
  reads ha->req_q_map[que] twice: once for the NULL\ncheck and again when assigning
  it to req. The map slot is cleared by\nqla25xx_free_req_que() (ha->req_q_map[que_id]
  = NULL under mq_lock)\nduring queue teardown, while the response-queue interrupt
  that drives\nqla2x00_error_entry() is still registered (the IRQ is released later
  in\nqla25xx_free_rsp_que()). If the slot is set to NULL between the two\nreads,
  req becomes NULL and is dereferenced.\n\nRead the slot once into req and NULL-check
  the local before use. mq_lock\nis a mutex and cannot be taken from interrupt context,
  so the single\nread plus local check is the appropriate fix for the reported NULL\n\
  dereference."
