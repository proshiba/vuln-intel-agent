title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  rockchip-samsung-dcphy: fix out-of-range max_register\n\nThe PHY register block
  is 64KB, so with a register stride of 4 the\nlast accessible register sits at offset
  0xfffc. max_register names\n0x10000, one register past the end of the mapping: dumping
  the\nregisters through the regmap debugfs interface reads beyond the\nioremapped
  region and oopses on the unmapped page. The oops fires\nwith the regmap lock held,
  so later PHY operations deadlock."
