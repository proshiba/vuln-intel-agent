title: A vulnerability was identified in Mstfakts College-Management-System. The
  affected element is an unknown function of the file Front-end/server.php of 
  the component Logout Handler. Such manipulation of the argument log_out leads 
  to session expiration. It is possible to launch the attack remotely. The 
  exploit is publicly available and might be used. This product takes the 
  approach of rolling releases to provide continious delivery. Therefore, 
  version details for affected and updated releases are not available. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
