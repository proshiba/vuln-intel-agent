title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: qcom_battmgr: fix use-after-free\n\nqcom_battmgr_pdr_notify() queues enable_work
  when the PMIC GLINK service\ncomes up, and the worker recovers battmgr through container_of()
  to issue\nfirmware requests. The PMIC GLINK client stays on the client list until\n\
  its devres release action runs, so a PDR notification can keep queueing\nthe work,
  and a pending or running worker can access battmgr after devres\nfrees it.\n\nMake
  enable_work device-managed with devm_work_autocancel(), registered\nbefore the PMIC
  GLINK client is allocated. The devres cleanup then\nreleases the client first, so
  no further notification can queue the work,\nand cancels the work before battmgr
  is freed.\n\nThis issue was found by an in-house static analysis tool."
