title: "x86 PV guests can free memory pages while still keeping a stale TLB entry\n\
  pointing to them.  A TLB flush is only issued by Xen (if needed) when the\npage
  is re-used.  Since it's possible for the page to be scrubbed ahead of\nthe TLB flush,
  there's a window where a PV guest can modify an already\nscrubbed page."
