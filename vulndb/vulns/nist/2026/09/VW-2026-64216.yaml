title: A flaw has been found in dgtlmoon changedetection.io up to 0.60.7. The 
  affected element is the function check_password of the file 
  changedetectionio/flask_app.py of the component Hash Comparison. This 
  manipulation of the argument Password causes observable timing discrepancy. 
  The attack is possible to be carried out remotely. A high degree of complexity
  is needed for the attack. The exploitability is described as difficult. The 
  exploit has been published and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
