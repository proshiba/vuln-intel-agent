title: The AsyncHttpClient (AHC) library allows Java applications to easily 
  execute HTTP requests and asynchronously process HTTP responses. From 2.0.0 
  until 2.16.1 and 3.0.12, a request using an HTTP proxy to reach an HTTPS 
  origin can expose preemptive origin credentials because NettyRequestFactory 
  and NettyRequestSender.sendRequestWithNewChannel attach Authorization to the 
  plaintext CONNECT request before the TLS tunnel exists. Basic or Digest 
  credentials and per-connection NTLM, Kerberos, or SPNEGO tokens intended for 
  the origin are therefore visible to the proxy and to observers on the 
  client-to-proxy hop. The tunneled request still receives origin Authorization 
  after the tunnel is established, while Proxy-Authorization remains on CONNECT 
  for its intended proxy recipient. This issue is fixed in versions 2.16.1 and 
  3.0.12.
