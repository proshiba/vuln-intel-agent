title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  atmel-sha204a - fix heap info leak on I2C transfer failure\n\nThe nonblocking RNG
  path allocates a work_data structure to track the\nstate of an in-flight asynchronous
  I2C request. This pointer is stored\nin rng->priv and later consumed by the read
  path once the transaction\ncompletes.\n\nIf the underlying I2C transfer fails, the
  completion callback is invoked\nwith a non-zero status. In this case, the allocated
  work_data is not\nusable for producing RNG output and must not remain associated
  with the\nhwrng state.\n\nPreviously, the failure path only logged a warning but
  left the pointer\nstate uncleared, which can result in subsequent read attempts
  observing\nstale state and interpreting it as valid completion data.\n\nFix this
  by freeing the pending work_data. The I2C transaction reports\nan error. This ensures
  that failed requests do not leave residual state\nbehind that could be interpreted
  as valid RNG data on later reads."
