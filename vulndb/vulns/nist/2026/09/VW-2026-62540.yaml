title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/tegra241-cmdqv:
  Don't run the error ISR before probe sets up vintfs\n\n__tegra241_cmdqv_probe()
  requests the error IRQ before it has allocated the\ncmdqv->vintfs array and set
  cmdqv->num_vintfs. A CMDQV left enabled with a\nlatched error across a kexec fires
  the IRQ as soon as it is requested, and\ntegra241_cmdqv_isr() then walks the uninitialized
  cmdqv->vintfs array.\n\nRequest the IRQ only after cmdqv->vintfs is allocated and
  zeroed, so that\na latched interrupt firing early runs the ISR against a valid array
  of NULL\nslots that it safely skips."
