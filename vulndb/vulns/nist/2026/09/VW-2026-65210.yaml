title: A flaw was found in the Level of Authentication enforcement mechanism of 
  Keycloak, an identity and access management solution. The issue occurs when a 
  client specifically requires a higher security level for a user who already 
  has an active session at a lower level. Due to a logic error in how session 
  re-evaluations are handled, Keycloak may incorrectly issue a token at the 
  lower security level instead of enforcing the required higher level, 
  potentially allowing unauthorized access to sensitive resources that rely on 
  these security claims.
