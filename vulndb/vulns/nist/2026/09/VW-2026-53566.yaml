title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/log:
  Fix infinite loop when scale is too large for display\n\nWhen scale is large enough
  that scaled_font exceeds the display\ndimensions, rows or columns become 0. A columns
  value of 0 causes\nan infinite loop in drm_log_draw_kmsg_record() because the loop\n\
  never decrements len.\n\nCheck for zero rows/columns in drm_log_setup_modeset()
  and return\nan error, cleaning up the already allocated buffer to avoid a leak."
