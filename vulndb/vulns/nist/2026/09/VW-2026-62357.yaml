title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  kyro: Validate overlay viewport coordinates\n\nThe overlay viewport end coordinates
  are computed from the viewport\norigin and dimensions using 32-bit unsigned arithmetic.
  Large input\nvalues can cause these calculations to wrap around before the resulting\n\
  coordinates are passed to SetOverlayViewPort().\n\nSetOverlayViewPort() packs the
  viewport coordinates into 16-bit\nregister fields. The X coordinates are additionally
  adjusted by +2\nand +1 before being written. Validate the coordinate calculations\n\
  for 32-bit wraparound and ensure that the adjusted coordinates fit\nwithin their
  16-bit register fields before calling\nSetOverlayViewPort().\n\nFound by Linux Verification
  Center (linuxtesting.org) with SVACE."
