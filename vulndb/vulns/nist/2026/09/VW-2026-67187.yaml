title: A vulnerability was determined in dayrui XunruiCMS up to 4.7.2. This 
  issue affects the function group_all_edit of the file 
  dayrui/App/Member/Controllers/Admin/Home.php of the component Group Editing. 
  This manipulation of the argument groupid causes sql injection. The attack is 
  possible to be carried out remotely. The exploit has been publicly disclosed 
  and may be utilized. The vendor was contacted early about this disclosure but 
  did not respond in any way.
