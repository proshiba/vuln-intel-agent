title: Velociraptor allows for the creation of notebook backups in its default 
  enabled daily backup feature. When Velociraptor restores the backup, the 
  notebook cell content is interpolated into a template with no ACL checks. This
  allows a malicious user with NOTEBOOK_EDITOR permission to plant a VQL query 
  which will be evaluated at elevated permissions if the notebook's backup is 
  subsequently restored.
