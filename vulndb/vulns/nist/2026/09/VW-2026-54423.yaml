title: The WP File Download plugin for WordPress is vulnerable to Directory 
  Traversal in all versions up to, and including, 6.3.8 via the 'remoteurl' 
  parameter. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to read the contents of arbitrary files on 
  the server, which can contain sensitive information. An authenticated attacker
  with Subscriber-level access first poisons the _wpfd_file_metadata['file'] 
  post-meta value via the unprotected file.save handler, after which the 
  streaming endpoint — hooked on init with no authentication requirement — 
  resolves and streams the traversed file path to any caller, including 
  unauthenticated visitors.
