title: Joomla Extension - regularlabs.com - Authenticated, privileged remote 
  code execution in Conditional Content extension for Joomla < 8.0.0 - 
  Conditional Content Pro accepts inline PHP Condition Rules in article syntax. 
  In affected versions, the PHP is passed to the Conditions evaluator without 
  checking who authored the article. Joomla's normal Author text filter 
  preserves the syntax, so publishing the article causes the code to run as the 
  web-server process.
