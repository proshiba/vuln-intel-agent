title: Contrast is a Kubernetes runtime for confidential containers. In versions
  before 1.12.1, the secure persistent volume feature is vulnerable to a 
  malicious host supplying a crafted LUKS2 volume to a pod VM. LUKS2 volume 
  metadata is not authenticated and, with cryptsetup versions prior to 2.8.1, a 
  header specifying the null keyslot encryption algorithm (cipher_null-ecb) is 
  accepted without error. Because the Contrast Initializer assumes a device is 
  protected if `cryptsetup open` succeeds with the secret seed, the guest will 
  open the attacker-supplied volume and write secret data in plaintext, or under
  a volume key known to the attacker, allowing the host to read confidential 
  data that should have been encrypted. Contrast v1.12.1 ships cryptsetup 2.8.1,
  which disables null ciphers in keyslots when the passphrase is non-empty; 
  v1.13.0 adds detached-header validation in guest memory and integrity 
