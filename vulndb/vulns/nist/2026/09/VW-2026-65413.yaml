title: Deserialization of untrusted data in the command monitoring support of 
  the MongoDB PHP Driver can cause class names embedded in document content to 
  be honored when the driver builds monitoring event objects. When an 
  application registers a command monitoring subscriber and includes untrusted 
  data in a database operation, an unauthenticated party who controls that data 
  may cause an application class implementing the driver's persistable interface
  to be instantiated and its unserialization method invoked with the supplied 
  data. The resulting impact depends on the classes available in the 
  application.
