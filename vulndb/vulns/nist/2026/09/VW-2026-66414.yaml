title: 'Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.1.2, when a Microsoft Graph request fails, Zammad logs the error including
  the authentication token used to access the mailbox. The system attempts to hide
  this token in the log, but the masking is incomplete: for the token format Microsoft
  uses (JWT), only the first part is hidden, while the remaining parts remain readable
  in plain text. A Zammad admin with Microsoft Graph channel access can view these
  logs and see the partial token, which may reveal sensitive claims such as the account
  scope, tenant, or timing, and could assist in reconstructing the full token while
  it is still valid. This issue is fixed in version 7.1.2.'
