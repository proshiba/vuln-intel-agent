title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  us122l: Prevent write upgrades for read mappings\n\nThe hwdep mmap callback rejects
  read-buffer mappings that are initially\nwritable, but leaves VM_MAYWRITE set on
  mappings created with PROT_READ.\nA process that can open the hwdep node O_RDWR
  can later use mprotect() to\nmake the mapping writable.\n\nThe read allocation begins
  with struct usb_stream. Its read_size member is\nused by the fault handler to decide
  which pages belong to the read buffer.\nThe read VMA intentionally remains expandable
  because pcm_usb_stream uses\nmremap() after reading that size. Changing read_size
  first can therefore\nmap and access pages beyond the allocation. The same member
  is also\nconsumed by usb_stream_free(), where changing it can make\nfree_pages_exact()
  release pages outside the allocation.\n\nClear VM_MAYWRITE for read-buffer mappings
  after rejecting an initially\nwritable VMA. This keeps the separate output-buffer
  mapping writable while\n"
