title: utcp-http before 1.1.4 fails to validate the OAuth2 tokenUrl field from 
  remote OpenAPI specifications, allowing attackers to redirect credential 
  submission to arbitrary endpoints. When a victim registers an 
  attacker-controlled OpenAPI spec and invokes a generated OAuth2-protected 
  tool, the library POSTs the victim's client_id and client_secret to the 
  attacker-supplied token endpoint without URL validation.
