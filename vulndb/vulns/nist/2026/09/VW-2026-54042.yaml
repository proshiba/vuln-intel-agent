title: Acunetix 25.11.251107123 for Windows contains a local privilege 
  escalation vulnerability in the Web Vulnerability Scanning Engine (wvsc.exe) 
  that allows low-privileged local attackers to execute arbitrary code as SYSTEM
  by exploiting a missing hardcoded directory path for OpenSSL-related files. 
  Attackers can create the missing directory, place a malicious file at the 
  expected path, and cause the SYSTEM-level wvsc.exe process to load and execute
  it, resulting in full privilege escalation.
