title: Parseable is a log analytics platform built for high-volume data 
  ingestion and analysis. Prior to 3.0.0, src/handlers/http/middleware.rs uses 
  unwrap() while parsing the x-amz-firehose-common-attributes header before 
  authentication. A remote unauthenticated attacker can supply non-UTF-8 header 
  data, malformed JSON, or invalid derived header values that trigger a Rust 
  panic and interrupt request handling, allowing repeated requests to deny 
  service or cause container restart loops. This issue is fixed in version 
  3.0.0.
