title: The Event Booking Manager for WooCommerce  WordPress plugin before 5.3.8 
  does not perform an ownership or authorization check before rendering booking 
  confirmation details, allowing unauthenticated attackers to retrieve 
  registered attendees' personal information (full name, email address, phone 
  number, and custom registration fields) by supplying an enumerable booking 
  reference. Exploitation is limited to sites configured to use the Event 
  Booking Manager for WooCommerce  WordPress plugin before 5.3.8's native 
  (non-WooCommerce) checkout, which is not the default.
