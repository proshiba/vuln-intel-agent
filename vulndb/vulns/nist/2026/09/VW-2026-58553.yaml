title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKEYS:
  trusted: Fix TPM teardown ordering\n\ntrusted_tpm_exit() drops the TPM chip reference
  and frees the digest\narray before unregistering the trusted key type. key_type_lookup()\n\
  holds key_types_sem for reading until the key operation finishes, while\nunregister_key_type()
  takes it for writing. It therefore provides the\nsynchronization point that must
  precede backend teardown.\n\nThe current order permits this interleaving:\n\n  CPU
  0                              CPU 1\n  trusted_tpm_exit()                 key_type_lookup(\"\
  trusted\")\n    put_device(&chip->dev)             trusted_tpm_seal()\n    kfree(digests)\
  \                       pcrlock()\n    unregister_key_type()                  tpm_pcr_extend(...,
  digests)\n\nCPU 1 can consequently dereference the freed digest array. The chip
  can\nalso be released before callbacks stop using it.\n\nKASAN reported:\n\n  BUG:
  KASAN: slab-use-after-free in tpm_pcr_extend+0x1f0/0x200\n  Read of size"
