title: "In the Linux kernel, the following vulnerability has been resolved:\n\nisofs:
  release zisofs block pointer buffer head\n\nzisofs_fill_pages() reads the compressed
  block pointer table.  The error\npaths release the current buffer_head, the loop
  also releases the old\nbuffer_head when it advances. However, the success path leaves
  the last\nbuffer_head referenced. Release it before returning success."
