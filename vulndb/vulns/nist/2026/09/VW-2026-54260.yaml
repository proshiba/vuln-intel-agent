title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  avoid busy looping in tipc_exit_net()\n\nBlamed commit introduced a busy-wait loop
  in tipc_exit_net()\nto wait for pending UDP bearer cleanup works to complete:\n\n\
  \       while (atomic_read(&tn->wq_count))\n               cond_resched();\n\nThis
  loop can busy-wait for a long time if cond_resched() is a NOP. This\ntypically happens
  if the netns exit is executed by a high priority task,\nor under kernels configured
  without preemption (CONFIG_PREEMPT_NONE). In\nsuch cases, it wastes CPU cycles and
  can lead to soft lockups.\n\nFix this by replacing the busy loop with wait_var_event(),
  allowing the\nthread to sleep properly until the work queue count reaches zero.\n\
  \nAccordingly, update cleanup_bearer() to use atomic_dec_and_test() and\nwake_up_var()
  to wake up the waiter when the count drops to zero.\n\nThis uses the global wait
  queue hash table, avoiding the need to bloat\nstruct tipc_net with a wait_queue_head_t.
  The atomic_dec_and_t"
