title: A vulnerability has been found in chatwoot up to 4.17.1. This impacts an 
  unknown function of the file callbacks_controller.rb of the component Shopify 
  OAuth. The manipulation leads to server-side request forgery. Remote 
  exploitation of the attack is possible. The exploit has been disclosed to the 
  public and may be used. The project was informed of the problem early through 
  an issue report but has not responded yet.
