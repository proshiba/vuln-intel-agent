title: 'An issue was discovered in Keyfactor SignServer before 7.6.0. A number of
  properties were identified to not have any restrictions to what path they can be
  set to by an admin user. Setting these properties to specific file paths can reveal
  information to the client side. Three specific properties were identified: The property
  ATTRIBUTESFILE in PKCS11CryotoToken can be set to a readable but not an accepted
  (i.e., recognized with attributes) file. In this case an error is thrown, confirming
  the existence of the file. The property KEYSTOREPATH in KeyStoreCryptoToken can
  be set to a non-existing file that will return an error confirming to the client
  side that the file does not exist. The property TRUSTSTOREPATH in RenewalWorker
  can be set to any path (without any restrictions) by an admin user. In the case
  that the provided path points to an existing file, readable by the user running
  the application server, but is not a recognized PEM format, it returns this as an
  error to the client side'
