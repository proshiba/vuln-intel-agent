title: An out-of-bounds write flaw was found in usbredir. Starting an 
  isochronous OUT stream with a transfer count of 1 leaves the stream's single 
  transfer buffer permanently unsubmitted, defeating the bounds check in 
  usbredirhost_iso_packet() and allowing a usbredir peer to write past the end 
  of the packet descriptor array on every subsequent isochronous packet.
