title: A security flaw has been discovered in cosmicstack-labs mercury-agent up 
  to 1.1.13. The impacted element is the function 
  PermissionManager.checkShellCommand of the file 
  mercury-agent/src/capabilities/permissions.ts of the component Shell Command 
  Permission Check. Performing a manipulation results in improper authorization.
  The attack can be initiated remotely. The exploit has been released to the 
  public and may be used for attacks. The project was informed of the problem 
  early through an issue report but has not responded yet.
