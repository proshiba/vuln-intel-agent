title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject >8 byte return values on return-reading trampoline paths\n\nbtf_distill_func_proto()
  builds the function model used for the\nfentry/fexit/fmod_ret/fsession trampolines
  and struct_ops. It has\naccepted a 16-byte __int128 return value since the trampoline
  was\nintroduced: __get_type_size() returns the integer's type size, and the\nreturn-type
  check only rejected ret < 0.\n\nBut the BPF trampoline preserves only 8 bytes of
  the return value (RAX on\nx86, i.e. R0). For an attach type that reads the target's
  return value the\nsecond half (RDX / R3) is neither saved nor restored, so a program\n\
  attached to a function returning a 16-byte value corrupts the value seen\nby the
  real caller and itself observes only half of it. struct_ops\ntrampolines have the
  same limitation.\n\nThis affects the attach types that read the target's return
  value: fexit,\nfmod_ret and fsession (plus the _multi variants of fexit and fsession),\n\
  and struct_"
