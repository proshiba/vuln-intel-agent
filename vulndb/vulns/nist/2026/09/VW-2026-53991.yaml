title: SiYuan versions before v3.8.2 contain an unbounded session creation 
  vulnerability in the publish-service Basic Auth handler that allows 
  authenticated attackers to exhaust memory. Attackers can repeatedly 
  authenticate with valid credentials to create persistent session entries 
  without expiry or capacity limits, causing indefinite process memory growth 
  and denial of service.
