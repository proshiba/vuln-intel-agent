title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  tap: fix wrong transport_header when sending VLAN-tagged frame\n\nIn tap_get_user_xdp(),
  when processing a VLAN-tagged frame (e.g.\nETH_P_8021Q), skb_set_network_header()
  is called first to advance\nnetwork_header past the VLAN tag to the inner protocol
  header.\nskb_probe_transport_header() is then called with skb->protocol still\n\
  set to ETH_P_8021Q, while nhoff (derived from skb_network_offset())\nalready points
  past the VLAN tag to the inner protocol header.\n\nIn __skb_flow_dissect(), proto
  is initialized to ETH_P_8021Q and nhoff\npoints past the VLAN tag. When the dissector
  hits case ETH_P_8021Q, it\nreads a struct vlan_hdr at the current nhoff via __skb_header_pointer(),\n\
  but that offset contains the inner protocol header (e.g. an IP header).\nThe bytes
  are misinterpreted as a VLAN header, yielding a garbage\nencapsulated EtherType
  that matches no known protocol. The dissector\nreturns false, so skb_probe_transport_header("
