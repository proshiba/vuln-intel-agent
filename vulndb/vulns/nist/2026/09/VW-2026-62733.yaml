title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mm_init:
  handle alloc_percpu failure in free_area_init_core_hotplug\n\nWe miss a failed allocation
  check for pgdat->per_cpu_nodestats, which\nresults in a NULL deref when we offset
  into the per-cpu area.\n\nPropagate -ENOMEM up the stack and leave per_cpu_nodestats
  pointing\nat boot_nodestats so a later online can retry the allocation.\n\nhotadd_init_pgdat()
  returns NULL on failure, which __try_online_node()\nalready maps to -ENOMEM.\n\n\
  On failure nothing needs to be unwound:\n  - the node is never marked online\n \
  \ - per_cpu_nodestats is left pointing at boot_nodestats\n  - __add_memory_resource()
  cleans up pending memblock resources\n  - later online attempts retry the per_cpu_nodestats
  allocation"
