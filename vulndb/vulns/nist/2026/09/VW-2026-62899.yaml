  WordPress is vulnerable to unauthorized modification of data in all versions 
  up to, and including, 2.4.5. This is due to the plugin accepting a 
  client-supplied package-redemption identifier as proof of payment without 
  validating it. This makes it possible for unauthenticated attackers to create 
