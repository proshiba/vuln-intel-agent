title: A security vulnerability has been detected in vgmstream up to r2117. 
  Impacted is the function add_entry of the file src/meta/txtp_parser.c of the 
  component txtp. Such manipulation of the argument range_start/range_end leads 
  to resource consumption. The attack may be performed from remote. The exploit 
  has been disclosed publicly and may be used. The name of the patch is 
  4b6a02dd1aff6428255db912563d77d4cb0a143e. It is advisable to implement a patch
  to correct this issue.
