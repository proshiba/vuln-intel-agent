title: Supabase Realtime provides Broadcast, Presence, and Postgres Changes via 
  WebSockets. Prior to 2.111.2, Realtime authorization does not correctly honor 
  the per-extension presence.read row-level security policy when a 
  private-channel client is allowed presence.write but explicitly denied 
  presence.read. Under that differential policy, the client can receive 
  presence_diff messages containing other members' presence metadata, including 
  application-defined location, online-status, roster, viewing, or typing 
  information. Deployments with uniform presence visibility have no 
  differential, and postgres_changes row data is unaffected. This issue is fixed
  in version 2.111.2.
