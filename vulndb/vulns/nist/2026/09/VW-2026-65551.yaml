title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/ftrace:
  Fix WARNING in __unregister_ftrace_function\n\nperf_ftrace_function_unregister()
  unconditionally calls\nunregister_ftrace_function() without checking whether the
  ftrace_ops\nwas ever successfully registered. This triggers a WARN_ON in\n__unregister_ftrace_function()
  when the ops doesn't have\nFTRACE_OPS_FL_ENABLED set.\n\nThis can happen during
  perf_event_alloc() error cleanup when\nperf_trace_destroy() is called via __free_event()
  on an event whose\nftrace_ops registration failed or was already torn down by\n\
  perf_try_init_event()'s err_destroy path.\n\nThe call path is:\n  perf_event_alloc()
  error cleanup\n    -> __free_event()\n      -> event->destroy() [tp_perf_event_destroy]\n\
  \        -> perf_trace_destroy()\n          -> perf_trace_event_close()\n      \
  \      -> TRACE_REG_PERF_CLOSE\n              -> perf_ftrace_function_unregister()\n\
  \                -> unregister_ftrace_function()\n                  -> __unregister_ftrace_"
