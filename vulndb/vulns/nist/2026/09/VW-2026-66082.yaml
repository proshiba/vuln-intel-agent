title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  fq_pie: clamp quantum in change path\n\nfq_pie_change() accepts any quantum value
  from userspace, including 1.\nWith a crafted size table qdisc_pkt_len reaches ~2
  GiB, so quantum=1\nmakes the deficit-refill loop spin ~2^31 times under the qdisc
  lock\n(a soft lockup / denial of service).\n\nAdd max(256U, ...) matching fq_codel_change().\n\
  \nConditions to recreate the bug:\n  CONFIG_NET_SCH_FQ_PIE=y. Requires CAP_NET_ADMIN
  (namespace-local via\n  unshare -Urn suffices).\n\n  tc qdisc add dev dummy0 root
  fq_pie\n  tc qdisc change dev dummy0 root fq_pie quantum 1 stab data 32768 size_log
  15 cell_log 0"
