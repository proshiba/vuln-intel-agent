title: The Jeg Kit for Elementor – Powerful Addons for Elementor, Widgets & 
  Templates for WordPress plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Comment Content in all versions up to, and including,
  3.2.16 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. Successful 
  exploitation requires that the targeted post also renders a legitimate Jeg Kit
  Countdown widget, which causes the countdown frontend script to be enqueued 
  and to initialize on any matching DOM element — including forged widget markup
  stored in comments.
