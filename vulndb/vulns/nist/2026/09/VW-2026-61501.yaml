title: RestrictedPython is a tool that helps define a subset of the Python 
  language for accepting program input in a trusted environment. Prior to 8.4, 
  RestrictedPython could allow a sandbox escape when a custom import policy or 
  globals exposed the standard library string module, the string.Formatter 
  class, a Formatter instance, or a Formatter subclass to restricted code. The 
  string.Formatter methods format, get_field, get_value, and vformat performed 
  attribute and item traversal internally without passing through 
  RestrictedPython's safer_getattr protections. Restricted code could use those 
  live object references to reach function globals, builtins, file access, or 
  code execution primitives, affecting confidentiality, integrity, and 
  availability in the host environment. This issue is fixed in version 8.4.
