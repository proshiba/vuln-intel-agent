title: A vulnerability was identified in Rizwan17 inventory-management-system up
  to bfe78a330d01bb26b9daec5dc9ecd5c77900e03f. Affected is the function 
  update_record of the file includes/manage.php. The manipulation of the 
  argument update_category/cid/update_brand/update_product leads to sql 
  injection. The attack is possible to be carried out remotely. The exploit is 
  publicly available and might be used. This product adopts a rolling release 
  strategy to maintain continuous delivery. Therefore, version details for 
  affected or updated releases cannot be specified. The project was informed of 
  the problem early through an issue report but has not responded yet.
