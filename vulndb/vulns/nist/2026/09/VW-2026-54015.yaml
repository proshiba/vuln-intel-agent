title: OpenPanel before 2.3.0 fails to properly validate chart formula 
  expressions, allowing authenticated project members with read access to 
  execute arbitrary code by recovering the native JavaScript Function 
  constructor through mathjs matrix objects. Attackers can use the recovered 
  constructor to load Node.js built-ins and execute operating system commands 
  with the privileges of the API process, bypassing organization authorization 
  boundaries.
