title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  core: Do not block on tag allocation in scsi_eh_lock_door()\n\nscsi_eh_lock_door()
  is called from scsi_restart_operations() while the\nhost is still in the SHOST_RECOVERY
  state, i.e. before the host is\nswitched back to SHOST_RUNNING and scsi_run_host_queues()
  restarts the\nqueues. It allocates a request via scsi_alloc_request() with no flags,\n\
  so blk_mq_get_tag() may block waiting for a free sched tag when all tags\nare already
  in use.\n\nThose tags can be held by commands that were just requeued by\nscsi_eh_flush_done_q()
  during error handling. Such commands cannot be\ndispatched until the host leaves
  SHOST_RECOVERY and\nscsi_run_host_queues() is called - which only happens *after*\n\
  scsi_eh_lock_door() returns.\n\nThis forms a circular dependency:\n\n  - scsi_eh_lock_door(),
  running in the SCSI error handler thread, waits\n    for a sched tag held by a requeued
