title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disallow bpf_{g,s}etsockopt() in cgroup UNIX getname hooks\n\n_bpf_setsockopt()
  and _bpf_getsockopt() call sock_owned_by_me() for\nfull sockets, so these helpers
  expect the socket lock to be held.\n\nBPF_CGROUP_UNIX_GETPEERNAME and BPF_CGROUP_UNIX_GETSOCKNAME
  run BPF\nprograms without acquiring the socket lock. A program attached to\neither
  hook can therefore trigger the sock_owned_by_me() warning by\ncalling bpf_setsockopt()
  or bpf_getsockopt().\n\nDisallow bpf_setsockopt() and bpf_getsockopt() for CGROUP_UNIX_GETPEERNAME\n\
  and CGROUP_UNIX_GETSOCKNAME."
