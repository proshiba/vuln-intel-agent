title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qlcnic: validate unified ROM sections before loading\n\nThe unified ROM parser reads
  directory, product, and data-descriptor fields\nfrom the firmware file.  Existing
  validation forms table and data ends with\nunchecked additions and multiplications.\
  \  Malformed values can wrap before\nthey are compared with the firmware size. \
  \ The parser also dereferences\ntyped pointers at firmware-controlled offsets.\n\
  \nValid descriptor extents alone are insufficient for the consumers.  The\nloader
  reads a fixed-size bootloader regardless of its declared size, the\nversion parser
  assumes a 17-byte tail, and a partial final firmware word is\nread as a full u64.\
  \  A truncated image can therefore make the driver read\nbeyond the firmware allocation
  during validation or loading.\n\nReplace the pointer-returning parser with bounded
  range helpers.  Validate\ntable entry sizes, descriptor indices, section ranges,
  the fixed\nbootloader load length, and"
