title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  zero extend the result of an arena 32-bit cmpxchg\n\nbpf_convert_ctx_accesses()
  rewrites an atomic on an arena pointer from\nBPF_STX | BPF_ATOMIC to BPF_STX | BPF_PROBE_ATOMIC,
  and it runs before\nbpf_opt_subreg_zext_lo32_rnd_hi32().\n\nThat pass emits an explicit
  zero extension for a 32-bit cmpxchg even\nwhen bpf_jit_needs_zext() is false. This
  is done because on some\narchitectures 32-bit cmpxchg requires explicit zero extension
  for the\ndst register. E.g. on x86-64 'lock cmpxchg' does not change the %eax\n\
  if comparison is successful, while BPF semantics declare that each\noperation on
  a 32-bit register zero extends it's upper half.\n\nis_cmpxchg_insn() matches BPF_MODE
  == BPF_ATOMIC only, so an arena\ncmpxchg misses said zero extension adjustment.
  This patch adjusts\nis_cmpxchg_insn() to match BPF_PROBE_ATOMIC alongside BPF_ATOMIC."
