title: "Quick.Cart is vulnerable to Cross-Site Request Forgery in admin config panel.
  Malicious attacker can craft special website, which when visited by the admin, will
  automatically send a POST request that changes admin's login and password.\nThis
  software does implement simple protection against this type of attack, but it is
  easily bypassed by manipulating the referer header. All forms available in this
  software are potentially vulnerable.\n\nThis issue was fixed in a patch to version
  6.7 published on 09.11.2026, deployments without this patch are still vulnerable"
