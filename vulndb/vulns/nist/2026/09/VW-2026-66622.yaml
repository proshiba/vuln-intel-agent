title: Capgo (capgo.app) through version 12.261.0 contains an incomplete 
  access-control fix for the public.sso_providers table. Migration 
  20260826100000_sso_providers_block_direct_active_insert.sql installs a BEFORE 
  UPDATE guard (enforce_sso_provider_client_update_guard()) that freezes only 
  the dns_verified_at, domain, status and enforce_sso columns; provider_id (as 
  well as metadata_url and attribute_mapping) is left writable. Because the 
  table is granted ALL to the anon and authenticated roles with no column-level 
  restriction, and PostgreSQL row-level security policies such as 
