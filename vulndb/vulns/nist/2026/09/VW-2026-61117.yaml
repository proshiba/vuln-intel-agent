title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm6:
  fix out-of-bounds write in xfrm6_input_addr() when secpath is full\n\nThe depth
  check in xfrm6_input_addr() is off by one:\n\n  if (1 + sp->len == XFRM_MAX_DEPTH)\n\
  \          goto drop;\n  ...\n  sp->xvec[sp->len++] = x;\n\nxfrm_input() can leave
  sp->len == XFRM_MAX_DEPTH, and the transport-mode\nreceive path re-enters IPv6 input
  via xfrm_trans_reinject() with that\nsecpath preserved. If the inner packet carries
  a destination-options HAO\noption or a type-2 routing header, xfrm6_input_addr()
  is called with\nsp->len == XFRM_MAX_DEPTH; the check (1 + 6 == 6) is false, so\n\
  sp->xvec[sp->len++] writes one slot past the 6-element xvec[]. The write\nstays
  within the sec_path allocation (invisible to KASAN); UBSAN_BOUNDS\nflags it and
  panics under panic_on_warn.\n\nUse \"sp->len >= XFRM_MAX_DEPTH\", matching xfrm_input().
  This also\nrestores one chain level the old check rejected at sp->len == 5.\n\n\
  \  UBSAN: array-index-out-of-bounds in net/i"
