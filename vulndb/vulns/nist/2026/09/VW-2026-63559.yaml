title: A flaw has been found in olivier-ls PHP-FTS up to 1.1.2. Affected by this
  issue is the function SearchEngine::buildHighlights of the file 
  src/SearchEngine.php of the component Search Engine. Executing a manipulation 
  of the argument Query can lead to cross site scripting. The attack may be 
  launched remotely. The exploit has been published and may be used. Upgrading 
  to version 1.1.3 can resolve this issue. This patch is called 
  0b2fae333d6b022da7ed4c43e2d41aa03f91dff3. The affected component should be 
  upgraded. The vendor was contacted early, responded in a very professional 
  manner and quickly released a fixed version of the affected product.
