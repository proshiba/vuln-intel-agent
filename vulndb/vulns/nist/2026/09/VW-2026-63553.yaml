title: A flaw was found in the Admin REST API of Keycloak, an open-source 
  identity and access management solution. The endpoint used for deleting user 
  credentials does not correctly check for fine-grained reset-password 
  permissions. This allows a delegated administrator, who should be restricted 
  from resetting passwords, to delete a user's password credentials, resulting 
  in the user being unable to log in.
