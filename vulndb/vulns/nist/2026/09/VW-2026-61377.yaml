title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_midi: initialize work in f_midi_alloc()\n\nf_midi_alloc initializes free_ref
  to 1 and it can only be incremented\nwhen a sound card is registered via f_midi_register_card().\n\
  f_midi_register_card() is only called in f_midi_bind() which actually\nperforms
  INIT_WORK. If f_midi_bind() is never run, work is not\ninitialized and the if condition
  in f_midi_free becomes true,\nthis results in a warning later in __flush_work as
  work->func = 0.\nFix this by moving INIT_WORK from f_midi_bind() to f_midi_alloc()."
