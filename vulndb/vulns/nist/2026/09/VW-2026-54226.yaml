title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  publish io-uring queues with release semantics\n\nfuse_uring_create_queue() initializes
  a fuse_ring_queue and then\npublishes the pointer into ring->queues[qid] with WRITE_ONCE()
  under the\nfch->lock. There are several readers that may concurrently be fetching\n\
  that pointer locklessly and then deferencing it.\n\nWRITE_ONCE() doesn't ensure
  ordering of the queue's field\ninitialization before the ring->queues[qid] pointer
  assignment. The\nqueue must be published with smp_store_release() so the field\n\
  initialization is guaranteed to happen before.\n\nReaders in paths where the read
  may happen concurrently with the store\nneed to use READ_ONCE() because any race
  involving a plain access is\nundefined."
