title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  pn533: purge fragmented skbs during cleanup\n\npn53x_common_clean() purges resp_q
  before freeing the common PN533 state,\nbut it leaves fragment_skb untouched.  The
  fragmentation helpers queue\ntransmit fragments there while sending large initiator
  or target-mode\nframes, and those skbs remain owned by the driver until they are
  sent or\ndiscarded.\n\nIf the device is removed while fragments are still queued,
  the common\ncleanup path frees the PN533 state without releasing the queued fragment\n\
  skbs, leaking them.\n\nPurge fragment_skb during cleanup alongside resp_q."
