title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  wacom: validate report length in wacom_intuos_pro2_bt_irq\n\nwacom_intuos_pro2_bt_irq()
  receives the wire report length in `len`\nbut never consults it before parsing.
  After the report-id gate it\nunconditionally calls wacom_intuos_pro2_bt_pen() and
  then, selected by\nfeatures.type, a fixed chain of sub-parsers, none of which receive\n\
  `len`:\n\n\twacom_intuos_pro2_bt_pen(wacom);\n\tif (type == INTUOSP2_BT || type
  == INTUOSP2S_BT) {\n\t\twacom_intuos_pro2_bt_touch(wacom);\n\t\twacom_intuos_pro2_bt_pad(wacom);\n\
  \t\twacom_intuos_pro2_bt_battery(wacom);\n\t} else {\n\t\twacom_intuos_gen3_bt_pad(wacom);\n\
  \t\twacom_intuos_gen3_bt_battery(wacom);\n\t}\n\nEach sub-parser dereferences wacom->data
  at fixed offsets. The furthest\nbyte touched on each branch is:\n\n  INTUOSP2_BT
  / INTUOSP2S_BT: wacom_intuos_pro2_bt_pad() reads data[285]\n\t(the touchring byte),
  so the report must be at least 286 bytes;\n  INTUOSHT3_BT (\"gen3\"): wacom_intuos_gen3_bt_battery()
  rea"
