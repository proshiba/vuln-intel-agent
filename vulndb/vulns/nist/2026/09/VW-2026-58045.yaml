title: SPIP before 4.4.18 contains a remote code execution vulnerability in the 
  editer_objet action where the arg parameter resolves SQL table names without 
  enforcing an editable columns allowlist, allowing attackers with a valid nonce
  to inject attacker-controlled rows into the spip_jobs table. Attackers can 
  supply arg=job/0 with crafted fonction and args values, which are later 
  unserialized and executed when the cron job queue is drained, resulting in 
  arbitrary PHP function execution on the underlying system.
