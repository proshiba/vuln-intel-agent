title: Http4s is a Scala interface for HTTP services. Prior to 0.23.35 and 
  1.0.0-M47, ResourceService and WebjarService decode each URL path segment but 
  reject only segments exactly equal to an empty string, a dot, or two dots. A 
  request containing percent-encoded slash or backslash separators can turn an 
  accepted segment into a parent-directory traversal after decoding, allowing 
  access to classpath or WebJar resources outside the configured base when a 
  directory-backed classpath is served and the backend preserves the encoded 
  separator. The patch rejects decoded segments containing slash or backslash in
  ResourceService and WebjarService, and applies the same guard to the 
  non-exploitable FileService for consistency. This issue is fixed in versions 
  0.23.35 and 1.0.0-M47.
