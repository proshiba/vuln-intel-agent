title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Undo the registration when enabling the histogram trigger fails\n\nCommit 6f86bdeab633
  (\"tracing: Fix bad hist from corrupting named_triggers\nlist\") described how a
  trigger that is registered but not on file->triggers\nends up freed while still
  on the global named_triggers list, and moved the\nregistration down so that hist_trigger_enable()
  follows it immediately. One\npath still gets there. hist_trigger_enable() adds the
  trigger and takes it\nstraight back out when the event cannot be enabled:\n\n\t\
  list_add_tail_rcu(&data->list, &file->triggers);\n\n\tupdate_cond_flag(file);\n\n\
  \tif (trace_event_trigger_enable_disable(file, 1) < 0) {\n\t\tlist_del_rcu(&data->list);\n\
  \t\tupdate_cond_flag(file);\n\t\tret--;\n\t}\n\nso the list walk in hist_unregister_trigger()
  matches nothing, test stays\nNULL, and the ->free() that would call del_named_trigger()
  is skipped.\nout_unreg falls through to out_free, which frees the trigger anyway:\n\
  \n BUG: KASAN"
