title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  use parsed transport offset in TCP state lookup\n\nTCP state handling reparses the
  skb to find the TCP header. For IPv6 it\nuses sizeof(struct ipv6hdr), while the
  surrounding IPVS code already\nparsed the packet with ip_vs_fill_iph_skb() and has
  the real\ntransport-header offset in iph.len.\n\nThis makes TCP state handling look
  at the wrong bytes when an IPv6\npacket carries extension headers. Use the parsed
  transport offset passed\ndown from ip_vs_set_state() when reading the TCP header.\n\
  \nFor IPv4 and for IPv6 packets without extension headers, the passed\noffset matches
  the previous value."
