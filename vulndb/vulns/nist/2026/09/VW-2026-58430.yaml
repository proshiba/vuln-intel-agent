title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  fix loff_t underflow in cifs_remap_file_range() when len == 0\n\nWith len == 0 (clone
  to EOF), the effective length is computed as:\n\n    len = src_inode->i_size - off;\n\
  \nIf off > i_size, this is a negative loff_t, corrupting the ByteCount\nin the FSCTL_DUPLICATE_EXTENTS_TO_FILE
  request and inverting the range\nin filemap_write_and_wait_range().  The existing
  off >= i_size check\nfires only after the ioctl has already been sent.\n\nSnapshot
  i_size_read() once for both the bounds check and the length\ncalculation, eliminating
  the TOCTOU and 32-bit torn-read risk.  Reject\noff > src_size with -EINVAL.  Treat
  off == src_size as a no-op,\nconsistent with __generic_remap_file_range_prep()."
