title: "Issue summary: The QUIC stream reassembly algorithm performance deteriorates\n\
  progressively as packets are arriving out of order. The worst case has\na quadratic
  complexity proportional to the number of stream frames kept in\nthe buffer for the
  received stream data.\n\nImpact summary: A remote QUIC peer that completes the handshake
  can create\na connection-scoped CPU pressure and potentially a Denial of Service
  using\ncompliant STREAM frames inside the advertised receive window, with low\n\
  attacker bandwidth.\n\nCWE: CWE-407: Inefficient Algorithmic Complexity\n\nDescription:
  OpenSSL manages received QUIC stream fragments using a\ndoubly-linked list. While
  it optimizes for append operations (at the end of\nthe list), it falls back to a
  head-to-tail linear search for any fragment\nthat does not immediately follow the
  current `tail`.\n\nBy manipulating the sequence of offsets, an attacker can force
  the server\nto perform O(n^2) operations, consuming excessive CPU time for the\n\
  QUIC process.\n\nFIPS impact: no"
