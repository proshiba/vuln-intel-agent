title: "Description\n\n  getTopologyPageInfo merged the Nimbus daemon configuration
  with the topology's own configuration and returned the result without redaction
  in the topology_conf field of TopologyPageInfo. The Storm UI copied that value verbatim
  into the configuration field of GET /api/v1/topology/{id} and of the corresponding
  metrics endpoint.\n\n  Where the cluster is configured with them, the merged map
  includes storm.zookeeper.auth.payload, which Storm's own documentation directs operators
  to keep in storm-cluster-auth.yaml under permissions that deny access from workers,
  together with the keystore and truststore passwords for the Thrift, Netty and ZooKeeper
  TLS configuration, and any plugin key whose name denotes a secret.\n\n  getTopologyPageInfo
