title: A vulnerability was detected in ByteDance Coze Scraper Extension up to 
  2.0.2. Affected by this vulnerability is the function 
  chrome.runtime.onMessageExternal.addListener of the file 
  static/background/index.js of the component External Message Handler. The 
  manipulation of the argument 
  body.url/paginationConfig/xPathConfig/body.urls/xPaths results in missing 
  authorization. The attack can be launched remotely. The exploit is now public 
  and may be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
