title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/lima:
  call drm_mm_init() with a valid allocation range\n\nlima_vm_create() is currently
  run before va_start and va_end are set up,\nmeaning they are both 0. lima_vm_create()
  runs drm_mm_init() with them\nas arguments for the allocator, and if DRM_DEBUG_MM
  is enabled the\nDRM_MM_BUG_ON check in drm_mm_init then fires, as seen here on\n\
  exynos4412-odroid-u2:\n\n[    1.736297] ------------[ cut here ]------------\n[\
  \    1.740370] kernel BUG at drivers/gpu/drm/drm_mm.c:931!\n[    1.745574] Internal
  error: Oops - BUG: 0 [#1] SMP ARM\n[    1.750697] Modules linked in:\n[    1.753734]
  CPU: 0 UID: 0 PID: 41 Comm: kworker/u16:1 Not tainted 7.0.10-postmarketos-exynos4
  #11 PREEMPT\n[    1.763372] Hardware name: Samsung Exynos (Flattened Device Tree)\n\
  [    1.769446] Workqueue: events_unbound deferred_probe_work_func\n[    1.775261]
  PC is at drm_mm_init+0x9c/0xa4\n[    1.779339] LR is at lima_vm_create+0x144/0x17c\n\
  [ ... ]\n\nFix the issue by movi"
