title: A vulnerability was identified in Gitlawb openclaude up to 0.30.0. 
  Impacted is the function waitForCallback of the file 
  src/services/api/xaiOAuthCallback.ts of the component xAI OAuth Callback 
  Handler. The manipulation of the argument Error leads to denial of service. 
  Remote exploitation of the attack is possible. The exploit is publicly 
  available and might be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
