title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  dw: avoid shift-out-of-bounds when DAA assigns no devices\n\nOn an empty bus ENTDAA
  assigns nothing, so cmd->rx_len (the count\nof addresses left unassigned) equals
  master->maxdevs.\n\nThe GENMASK() index master->maxdevs - cmd->rx_len - 1 then becomes
  -1,\nwhich trips up UBSAN. This happens every time on boot on a Gigabyte/AMD\nserver:\n\
  \n    UBSAN: shift-out-of-bounds in drivers/i3c/master/dw-i3c-master.c:905:12\n\
  \    shift exponent 64 is too large for 64-bit type 'long unsigned int'\n    CPU:
  7 UID: 0 PID: 963 Comm: (udev-worker) Not tainted 7.0.11-200.fc44.x86_64 #1 PREEMPT(lazy)\n\
  \    Hardware name: Giga Computing E163-Z34-AAH1-000/MZ33-DC1-000, BIOS R32_F45
  04/01/2026\n    Call Trace:\n     <TASK>\n     dump_stack_lvl+0x5d/0x80\n     ubsan_epilogue+0x5/0x2b\n\
  \     __ubsan_handle_shift_out_of_bounds.cold+0xd7/0x1ab\n     dw_i3c_master_daa.cold+0x1b/0x96
