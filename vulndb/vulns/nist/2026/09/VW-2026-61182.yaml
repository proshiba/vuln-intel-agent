title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  harden firmware build-info bounds checks\n\npanthor_fw_read_build_info() checks
  whether the metadata range fits in the\nfirmware image with hdr.meta_start + hdr.meta_size.
  Both fields are u32, so\nthe addition can wrap and let an out-of-bounds range pass
  validation.\n\nThe function also reads the \"git_sha: \" prefix without first checking
  that\nthe metadata is long enough, and meta_size == 0 can underflow the NULL\nterminator
  index.\n\nUse subtraction-based bounds checking and reject metadata that is too
  short\nto contain the expected prefix and trailing NULL byte."
