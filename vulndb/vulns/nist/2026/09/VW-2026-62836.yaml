title: SAIL is a cross-platform library for loading and saving images with 
  support for animation, metadata, and ICC profiles. In 0.9.10 and earlier, 
  psd_private_sail_pixel_format() in src/sail-codecs/psd/helpers.c resolves a 
  one-channel PSD in Bitmap color mode to SAIL_PIXEL_FORMAT_BPP1_INDEXED without
  requiring the file depth to be one, so the pixel buffer uses one-bit rows 
  while sail_codec_load_frame_v8_psd() in src/sail-codecs/psd/psd.c accepts 
  depth == 8 and writes one attacker-controlled byte per pixel. Loading a 
  crafted PSD through sail_load_from_file() or sail_load_from_memory() therefore
  writes beyond each heap row, causing memory corruption, a reliable crash, or 
  potential code execution. This mode/depth mismatch is distinct from 
  GHSA-rcqx-gc76-r9mv and GHSA-wcj8-hxxf-pq2c. This issue is fixed in version 
  1.0.0.
