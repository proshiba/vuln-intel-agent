title: vm2 before 3.11.7 contains a sandbox escape vulnerability in the CLI tool
  that allows attackers to execute arbitrary code in the host Node.js process. 
  Attackers can supply a malicious script file to the vm2 CLI that uses 
  require(__filename) to re-execute itself in the host realm, bypassing sandbox 
  isolation and accessing host modules like fs and child_process.
