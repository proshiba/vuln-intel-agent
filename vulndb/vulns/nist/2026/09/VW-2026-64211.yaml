title: LibreOffice converts CFF fonts to Type 1 when it subsets a font, which 
  happens when a document is exported to PDF, and CFF fonts may be embedded in 
  documents. A stack buffer overflow existed in that conversion. The converted 
  operators were written into a fixed size buffer with no check that they still 
  fit, so a glyph emitting many operators wrote past the end of the buffer. In 
  fixed versions the remaining capacity is tracked and the conversion stops when
  it is used up.
