title: A security vulnerability has been detected in sfturing hosp_order up to 
  627f426331da8086ce8fff2017d65b1ddef384f8. This affects the function 
  updateOrderSta1/updateOrderdiseaseInfo of the file 
  ssm_pro/src/main/java/cn/sfturing/web/OrderController.java of the component 
  Order Handler. The manipulation of the argument userID/id leads to 
  authorization bypass. The attack is possible to be carried out remotely. The 
  exploit has been disclosed publicly and may be used. This product adopts a 
  rolling release strategy to maintain continuous delivery. Therefore, version 
  details for affected or updated releases cannot be specified. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
