title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  Clear sc_cm_id when ADDR_CHANGE replacement fails\n\nWhen svc_rdma_listen_handler()
  handles RDMA_CM_EVENT_ADDR_CHANGE,\nit creates a replacement listener cm_id and
  returns 1, telling\nthe CM core to destroy the old one. If the replacement allocation\n\
  fails, sc_cm_id still points at the old cm_id that the CM core is\nabout to destroy.
  Any subsequent dereference of sc_cm_id --\nsuch as svc_rdma_detach()'s rdma_disconnect()
  call -- is a\nuse-after-free.\n\nNULL sc_cm_id on the failure path and guard svc_rdma_detach()'s\n\
  rdma_disconnect() call against NULL so that the listener can\nbe torn down safely
  when the server shuts down."
