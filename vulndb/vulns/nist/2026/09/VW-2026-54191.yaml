title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  st21nfca: validate ATR_REQ length against the received frame\n\nst21nfca_tm_recv_atr_req()
  checks that the received ATR_REQ frame is at\nleast ST21NFCA_ATR_REQ_MIN_SIZE and
  that the self-declared atr_req->length\nis at least sizeof(struct st21nfca_atr_req),
  but never checks that\natr_req->length does not exceed the actual received length
  (skb->len).\n\nst21nfca_tm_send_atr_res() then trusts the declared length:\n\n\t
  gb_len = atr_req->length - sizeof(struct st21nfca_atr_req);\n\t...\n\tmemcpy(atr_res->gbi,
  atr_req->gbi, gb_len);\n\nso an RF peer that sends a short frame but sets atr_req->length
  larger\nthan the frame makes gb_len exceed the general bytes actually present,\n\
  and the memcpy reads out of bounds past the received skb. Those bytes are\nplaced
  in the ATR_RES and sent back to the peer (kernel-memory disclosure\nto a proximity
  attacker); a larger declared length is an out-of-bounds\nread (DoS).\n\nReject frames
