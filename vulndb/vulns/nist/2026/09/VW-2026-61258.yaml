title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Avoid preempt count underflow without probe\n\nLoongArch uses break 11 for the breakpoint
  placed after an instruction\nthat Kprobes executes out of line. Since userspace
  can issue the same\nbreak instruction, do_bp() can reach kprobe_singlestep_handler()
  when\nthere is no current probe.\n\nThe handler actually returns false in this case,
  but it first calls\npreempt_enable_no_resched(). The corresponding preempt_disable()
  is done\nby kprobe_breakpoint_handler() on a real Kprobe hit, so it has not run\n\
  here. As a result, an ordinary userspace breakpoint (code 11) underflows\nthe current
  task's preempt count.\n\nThis also makes in_interrupt() return true until the task
  schedules. One\nvisible consequence is the socket cgroup attribution: cgroup_sk_alloc()\n\
  treats the allocation as interrupt context and assigns the socket to the\nroot cgroup.
  A socket opened from the SIGTRAP handler can then avoid a\nBPF_CGROUP_INET_SOCK_CREATE"
