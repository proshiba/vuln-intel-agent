title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-ctrls: validate HEVC tile counts\n\nThe stateless HEVC decoders read num_tile_columns_minus1
  + 1 entries from\ncolumn_width_minus1[] and num_tile_rows_minus1 + 1 from row_height_minus1[]\n\
  and use them as tile-loop bounds, but std_validate_compound() does not\nbound these
  u8 counts. Reject a V4L2_CTRL_TYPE_HEVC_PPS with tiling\nenabled whose tile counts
  exceed the uAPI array capacity, mirroring the\nexisting compound-control range checks."
