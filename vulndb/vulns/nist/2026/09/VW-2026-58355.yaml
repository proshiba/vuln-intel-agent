title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipip:
  fix skb leak in collect_md mode when metadata_dst allocation fails\n\nIn collect_md
  mode ipip_tunnel_rcv() returns 0 without freeing the skb\nwhen ip_tun_rx_dst() fails
  to allocate the metadata_dst. ipip_rcv() and\nmplsip_rcv() are registered as xfrm_tunnel
  handlers, so tunnel4_rcv()\nand tunnelmpls4_rcv() read the zero return as \"the
  packet has been\nconsumed\" and do not free it either. The skb is leaked.\n\nThe
  other tunnel drivers all dispose of the packet at this point:\nip6_tunnel.c jumps
  to its drop label, ip_gre.c and ip6_gre.c return\nPACKET_REJECT, which makes gre_rcv()
  free the skb. Only ipip returns 0.\n\nJump to the existing drop label instead. It
  frees the skb and still\nreturns 0, so the packet keeps being reported as consumed,
  which is what\nwe want here: the outer header has already been pulled, and neither
  the\nremaining handlers nor an ICMP unreachable have any use for it.\n\nTriggering
  this needs an ipip or mp"
