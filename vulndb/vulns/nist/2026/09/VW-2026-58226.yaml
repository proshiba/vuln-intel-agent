title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  panasonic-laptop: Fix sentinel write past pcc->sinf[]\n\nacpi_pcc_retrieve_biosdata()
  rejects SINF packages only when\npcc->num_sifr is strictly less than hkey->package.count,
  then\nunconditionally writes a trailing sentinel at\npcc->sinf[hkey->package.count].
  But pcc->sinf[] is allocated with\nexactly pcc->num_sifr elements (valid indices
  0..num_sifr-1), so that\nwrite needs num_sifr strictly greater than package.count
  to stay in\nbounds -- num_sifr == package.count passes the existing check but\n\
  still overflows by one element.\n\nThis is exactly the case probe()'s existing num_sifr++
  workaround\n(\"Some DSDT-s have an off-by-one bug where the SINF package count is\n\
  one higher than the SQTY reported value\") is written to accommodate:\nwhen a DSDT's
  SINF package count equals SQTY+1, the workaround makes\nnum_sifr equal to package.count,
