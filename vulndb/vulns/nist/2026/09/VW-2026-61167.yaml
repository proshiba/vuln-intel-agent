title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Add TLB flush after MES queue eviction/suspension\n\nMES (Micro Engine Scheduler)
  does not perform heavy-weight TLB\ninvalidation after unmapping queues, unlike HWS
  which does this\nautomatically. This causes a race condition where in-flight DMA\n\
  descriptors can access memory that has been unmapped, leading to page\nfaults and
  GPU queue hangs during SVM page migration.\n\nThe issue manifests as KFDSVMRangeTest.MultiThreadMigrationTest\n\
  failures on gfx1151 (Strix Point) with XNACK mode 1 enabled - the GPU\ncompute queue
  hangs with packets submitted but never consumed.\n\nAdd kfd_flush_tlb() calls after
  MES queue removal in two locations:\n- evict_process_queues_cpsch(): after all queues
  removed during eviction\n- suspend_queues(): after debug/criu queue suspension (with
  mem_fence barrier)\n\nThis ensures all in-flight memory accesses from unmapped queues
  are\nflushed before memory is freed or migrated.\n\n(cherry picked from "
