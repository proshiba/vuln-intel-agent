title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1:
  don't set array_frozen in raid1_takeover()\n\nraid1_takeover() sets conf->array_frozen
  = 1 on the newly-allocated\nr1conf and nothing ever clears it, so every I/O to the
  array stalls\npermanently once _wait_barrier() sees it stuck at 1.\n\nThis used
  to be harmless: level_store() called mddev_resume() right\nafter pers->run(), which
  called raid1_quiesce(mddev, 0) and cleared\narray_frozen back to 0 regardless of
  what raid1_takeover() set. Commit\nb39f35ebe86d (\"md: don't quiesce in mddev_suspend()\"\
  ) removed that\nquiesce(mddev, 0) call, so the pre-set now sticks.\n\nsetup_conf()
  already zero-initializes the new r1conf via kzalloc, so\njust don't set array_frozen
  here.\n\nSame class of bug as commit 892da88d1cd9 (\"md/raid10: fix a\n'conf->barrier'
  leakage in raid10_takeover()\"), also triggered by\nb39f35ebe86d."
