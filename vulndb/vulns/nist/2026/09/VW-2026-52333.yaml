title: Wallos is an open-source, self-hostable personal subscription tracker. 
  Prior to version 4.9.1, an authenticated user can edit their own inactive 
  subscription and set replacement_subscription_id to a subscription ID 
  belonging to another user. The write is accepted, and later the stats logic 
  dereferences that foreign subscription ID without user_id scoping. This lets 
  the attacker infer the victim subscription's monthly-normalized cost by 
  observing changes in their own stats output. This does not expose the full 
  victim subscription object, but it does expose derived financial metadata. 
  This issue has been patched in version 4.9.1.
