title: The OpenClaw Prometheus diagnostics plugin 
  (@openclaw/diagnostics-prometheus) before version 2026.9.3 does not enforce 
  the operator.read scope on its authenticated metrics endpoint. In deployments 
  using an identity-bearing Gateway authentication mode such as trusted-proxy, a
  caller whose effective role has no read scope can retrieve the diagnostics 
  document even though ordinary read methods reject the same identity, 
  disclosing operational metrics to an authenticated profile intentionally 
  limited below read access. Shared-secret Gateway callers already hold the 
  documented full operator scope and are not affected. The issue is fixed in 
  2026.9.3; as a workaround, disable the Prometheus endpoint or ensure every 
  identity that can reach it is intended to hold operator.read.
