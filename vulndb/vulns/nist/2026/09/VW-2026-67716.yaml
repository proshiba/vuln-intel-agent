title: "Issue summary: The generic elliptic-curve scalar multiplication used for\n\
  ECDSA and SM2 signature operations with curves that do not have a dedicated\nimplementation
  leaks information about the secret nonce through timing.\n\nImpact summary: An attacker
  able to measure signing times may learn\ninformation about the per-signature secret
  nonce, which over many signatures\ncan, via a lattice / Hidden Number Problem attack,
  lead to recovery of the\nprivate key.\n\nCWE: CWE-208: Observable Timing Discrepancy\n\
  \nDescription: The generic elliptic-curve scalar multiplication used for\ncurves
  that do not have a dedicated constant-time implementation pads the\nsecret scalar
  with non-constant-time BIGNUM operations, so the time taken\ndepends on the value
  of the secret scalar derived from the ECDSA and SM2 nonce.\n\nThe leak is very small;
  observing it requires a large number of\nmeasurements. The effect is largest for
  curves whose group order lies\non a machine-word boundary, such as brainpoolP384r1.\n\
  \nApplication"
