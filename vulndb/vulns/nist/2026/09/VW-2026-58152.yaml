title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  master: svc: bound IBI payload to the requested max_payload_len\n\nsvc_i3c_master_handle_ibi()
  reads the IBI payload from the RX FIFO into\nthe IBI slot. The loop is bounded by
  the hardware FIFO size\n(SVC_I3C_FIFO_SIZE), not by the slot size.\n\nslot->data
  points into the IBI pool, which i3c_generic_ibi_alloc_pool()\nsizes at max_payload_len
  per slot. svc_i3c_master_request_ibi() only\nrejects a max_payload_len larger than
  SVC_I3C_FIFO_SIZE, so a driver can\nrequest a smaller one. mctp-i3c requests 1.
  Each readsb() then copies the\ncontroller RXCOUNT bytes (up to 31) with no check
  against the slot size.\nA device that sends more bytes than the slot holds writes
  past\nslot->data, an out-of-bounds write into the IBI pool.\n\nBound the loop by
  dev->ibi->max_payload_len and clamp each read to the\nspace left in the slot, the
  same way dw-i3c does. A device can still send\nmore than the requested payload.
  Flush the leftover bytes fro"
