title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  flowlabel: cap duplicate leases per socket\n\nipv6_flowlabel_get() allocates an
  ipv6_fl_socklist entry for every\nsuccessful GET. The recheck path for a compatible
  existing flowlabel\nlinks another lease without applying any lease admission check.
  Repeated\nGET requests for one shareable label can therefore grow a socket's lease\n\
  list without bound.\n\nReject a new unprivileged lease once the socket already holds\n\
  FL_MAX_PER_SOCK leases. Check this on the shared recheck path so reuse\nof a globally
  interned label, including the fl_intern() collision path,\nis covered as well. New-label
  admission remains under the existing\nmem_check() policy.\n\nUse capable(CAP_NET_ADMIN)
  rather than ns_capable(), matching\nmem_check(). An unprivileged user must not bypass
  the cap by creating a\nuser namespace and a netns where they have CAP_NET_ADMIN,
