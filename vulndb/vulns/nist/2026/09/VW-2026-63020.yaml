title: The Custom Twitter Feeds – A Tweets Widget or X Feed Widget plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via 'buttoncolor' 
  Shortcode Attribute in all versions up to, and including, 2.8.0 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for authenticated attackers, with contributor-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. This vulnerability is exploitable on common 
  installs where the admin has configured access tokens with zero or multiple 
  legacy feeds, as this causes the ctf_statuses support_legacy_shortcode option 
  to be set to boolean true by default, activating the unfiltered legacy 
  shortcode attribute code path.
