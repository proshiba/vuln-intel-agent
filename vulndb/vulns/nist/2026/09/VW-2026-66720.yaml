title: 'Froxlor through 2.3.10 does not filter sensitive columns from API responses:
  Domains::get(), Domains::listing(), SubDomains::get(), and the admin branch of SubDomains::listing()
  perform a wildcard SELECT over the panel_domains table and return the row unmodified,
  including the panel_domains.dkim_privkey field. An authenticated, non-superadmin
  admin holding the delegated customers_see_all flag can therefore read the DKIM private
  signing keys of domains belonging to other tenants via Domains.get, Domains.listing,
  SubDomains.get, or SubDomains.listing, with a single listing call disclosing the
  key of every visible domain. The disclosed keys allow an attacker to sign email
  that passes DKIM verification and DMARC alignment for the affected domains. This
  is a follow-on to an incomplete fix that stripped password and data_2fa but not
  dkim_privkey. The issue is fixed in 2.3.12.'
