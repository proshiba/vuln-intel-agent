title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  c67x00: fix use-after-free in c67x00_add_iso_urb()\n\nWhen TD creation fails for
  the last packet of an isochronous URB,\nc67x00_add_iso_urb() gives the URB back
  before updating the endpoint\nscheduling state.\n\nc67x00_giveback_urb() frees the
  URB private data, and the completion\ncallback may release the final URB reference.
  The following accesses to\nurbp->ep_data, urb->interval, and urbp->cnt can therefore
  use freed\nmemory.\n\nUpdate next_frame and cnt before giving back the failed final
  packet,\nmaking the giveback the last operation that uses the URB and its private\n\
  data."
