title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/debug:
  Fix deadlock during unregister\n\nUnregistering an s390dbf debug area while one
  of the associated debugfs\nfiles is being written to can cause a deadlock:\n\n$
  echo >.../vmur/level    $ rmmod vmur\n===================================================\n\
  debugfs write\ndebugfs_file_get()\n                          debug_unregister()\n\
  \                          mutex_lock(debug_mutex)\n                          debugfs_remove()\n\
  \                          wait for debugfs_file_put()\ndebug_file_ops.write()\n\
  debug_input()\nmutex_lock(debug_mutex) ==> DEADLOCK\n\nFix this by splitting debug_unregister()
  into an s390dbf and debugfs\npart, and running only the s390dbf part with debug_mutex
  locked."
