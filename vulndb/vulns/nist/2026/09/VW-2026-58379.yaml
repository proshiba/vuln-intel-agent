title: "In the Linux kernel, the following vulnerability has been resolved:\n\nacpi/apei/ghes:
  Use raw_spinlock_t for CXL CPER work locks\n\nThe CXL CPER work registration and
  unregistration helpers acquire\ncxl_cper_work_lock and cxl_cper_prot_err_work_lock
  with a spinlock\nguard(), which leaves local interrupts enabled. The corresponding
  post\npaths (cxl_cper_post_event(), cxl_cper_post_prot_err()) execute in hard\n\
  IRQ context (they are called from the GHES error notification path) and\nacquire
  the same locks with an irqsave guard().\n\nIf a CPU is holding one of these locks
  via a spinlock guard() when a GHES\ninterrupt arrives on the same CPU, the IRQ handler
  spins on the held lock\nwaiting for it to release, while the lock holder is preempted
  by the IRQ.\nThe result is a deadlock.\n\nConvert both locks from spinlock_t to
  raw_spinlock_t and use guard() at\nall call sites. On PREEMPT_RT kernels spinlock_t
  is backed by rt_mutex and\nsleeping from hard IRQ context is not permitted; raw_spinlock_t
  is safe in\nbot"
