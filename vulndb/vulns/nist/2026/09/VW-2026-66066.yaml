title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio:
  fix use-after-free in unregister_virtio_device()\n\ndevice_unregister() is device_del()
  plus put_device(). When the caller\nholds no extra reference, that drops the last
  one and runs the release\ncallback, which for several transports frees the memory
  the embedded\nstruct virtio_device sits in. unregister_virtio_device() then calls\n\
  virtio_debug_device_exit(), which reads dev->debugfs_dir out of the freed\nobject.\n\
  \nAffected transports are the ones whose release callback frees and whose\nremove
  path takes no reference: virtio_mmio, virtio_vdpa, virtio_uml,\nmlxbf-tmfifo and
  virtio_ccw. virtio_pci is unaffected because\nvirtio_pci_remove() brackets the call
  with get_device() and put_device().\n\nRemove the debugfs entries before the device
  can go away. They are only\naccessed through the protected debugfs interface, so\n\
  debugfs_remove_recursive() waits for in-progress file operations before\nreturning.
