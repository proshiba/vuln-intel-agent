title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  delimit inode_share cache key components\n\nPreviously, inode_share keys were encoded
  as follows:\n\n  fingerprint || domain_id\n\nIt would be better to have a separator
  between the fingerprint and domain\nID so that the fingerprint won't be parsed as
  part of a domain ID.\n\nChange the key encoding as follows:\n\n  domain_id || '\\\
  0' || fingerprint\n\nSince domain_id is a NUL-terminated string, this makes the
  in-memory key\nindices unambiguous."
