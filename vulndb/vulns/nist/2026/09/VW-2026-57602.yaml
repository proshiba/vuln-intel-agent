title: Renovate is a dependency update automation tool. In versions before 
  44.11.2 (and Mend Renovate CE/EE images and charts before 15.4.0, and 
  mend-renovate-enterprise-edition helm chart before 10.4.0), when listing new 
  package versions from a NuGet registry Renovate follows pagination URLs 
  supplied by the registry in the HTTP `Link` header without verifying that the 
  target has the same origin as the configured registry. Registry credentials 
  are attached to the request for the 'next' page, so a malicious or compromised
  NuGet registry can return a `Link` header pointing at an attacker-controlled 
  server and cause Renovate to send the registry credentials to that server. 
  Exploitation requires the remote registry to be malicious or compromised; such
  a registry would normally already have received the credentials on the initial
  request, so the issue primarily allows the credentials to be delivered to an 
