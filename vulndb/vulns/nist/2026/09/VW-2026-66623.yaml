title: 'capgo.app is an over-the-air (OTA) update platform for Capacitor apps. In
  all versions up to and including the current release (no patch available at time
  of publication), the `transfer_app()` database function transfers an app, its channels,
  versions and related records to a destination organization without deleting or revalidating
  existing rows in `channel_permission_overrides`. As a result, a user who legitimately
  held a channel permission override while a member of the source organization retains
  that override after the transfer, even though they have no membership and no RBAC
  binding in the destination organization. Using their own authenticated JWT against
  the PostgREST API, such a former member can modify the destination-owned channel
  to point at a different bundle, causing the /updates endpoint to serve an attacker-selected
  application version to devices. The previously proposed fix for GHSA-626c-p6fq-3whq
