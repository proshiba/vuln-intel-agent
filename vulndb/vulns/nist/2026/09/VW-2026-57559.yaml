title: A flaw was found in Evolution. A remote attacker can exploit this 
  vulnerability by sending a specially crafted HTML email containing a spoofed 
  vCard control. When a victim clicks on this control, Evolution's trusted 
  JavaScript handler incorrectly assigns an attacker-controlled JavaScript URL 
  to an iframe's source. This action leads to arbitrary JavaScript execution 
  within the mail-viewing context, effectively bypassing the security measures 
  designed to prevent script execution in email content.
