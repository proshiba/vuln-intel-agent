title: "Affected versions of MISP’s interactive CLI shell do not reliably preserve
  the identity of the impersonated MISP user across audit logging.\n\n\nThe shell
  is designed to run actions as a supplied MISP user ID. However, the legacy SysLogLogable
  behavior stored that identity in behavior-instance state that could be overwritten
  when another model lazily attached the shared behavior. Consequently, subsequent
  CLI writes could lose the intended user attribution and be logged incorrectly. The
  commit also notes that CLI-originated records lacked a CLI marker, making them appear
  similar to ordinary web actions by that user.\n\n\n\nVersion affected: ≤2.5.45"
