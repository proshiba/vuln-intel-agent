title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  validate OSD extent maps before cursor advance\n\nnet/ceph/osd_client.c:osd_sparse_read()
  validates that the sparse-read\ndata length matches the summed extent lengths, but
  it does not validate\nthat each OSD-supplied extent is monotonic and lies inside
  the original\nrequest range. A malformed authenticated OSD reply can advertise a\n\
  far-forward nonzero extent offset with a matching data length and make\nthe client
  advance the message-data cursor beyond the request buffer.\nThis reaches the BUG_ON(!*length)
  assertion in ceph_msg_data_next() from\nthe client receive path.\n\nImpact: A malicious
  or compromised authenticated Ceph OSD peer can crash\na kernel Ceph client via a
  malformed sparse-read reply.\n\nReject sparse extent maps that overflow, move backwards,
  overlap, or\nextend outside the original sparse-read request before advancing the\n\
  cursor.\n\n[ idryomov: perform sparse_extent_map_valid() check a bit earlier,\n\
  \  in CEP"
