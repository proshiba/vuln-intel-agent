title: career-ops is an open-source AI-assisted job search and application 
  management tool. Prior to 0.8.0, the career-ops local web dashboard web/ 
  exposed command-spawning and user-file-writing /api routes without validating 
  request origin or restricting clients to loopback addresses. A malicious page 
  in another browser tab could send cross-origin localhost requests while the 
  dashboard was running, and a dashboard bound beyond loopback could receive 
  direct requests from the local network. Both paths allowed unauthenticated 
  command execution as the dashboard user, but npm installations were unaffected
  because web/ is excluded from the published package. This issue is fixed in 
  version 0.8.0.
