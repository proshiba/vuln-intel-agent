title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Make cpu_buffer::free_page a buffer_data_read_page\n\nDiscarding a cached reader
  page after a concurrent ring buffer resize\nuses the new global subbuf_order for
  the free_pages() call. This\nmismatched order may crashes the kernel or leaks memory
  because the cached\npage was allocated under the old size.\n\nSave the actual free_page
  order alongside the page address to ensure we\nalways refer to the correct value
  and do not rely on the potentially\nstalled cpu_buffer->subbuf_order value. The
  simplest is to make\nfree_page a buffer_data_read_page which already covers exactly
  what we\nneed: a page address and a page order."
