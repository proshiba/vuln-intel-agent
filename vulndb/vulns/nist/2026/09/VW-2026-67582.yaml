title: "Google Merchant Center Feed (gmfeed) module for PrestaShop is vulnerable to
  unauthenticated arbitrary file write in the feed.php endpoint. An unauthenticated
  attacker can send a crafted request that controls the output file name, path, extension,
  and content through request parameters. Due to the lack of authentication and input
  validation, the request is processed successfully, allowing an attacker to write
  and execute arbitrary PHP code, resulting in remote code execution (RCE).\n\n\n\
  This issue was fixed in version 2.3.9."
