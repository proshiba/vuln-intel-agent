title: The Frontend Admin by DynamiApps plugin for WordPress is vulnerable to 
  arbitrary file deletion due to insufficient file path validation in the 
  move_folders function in all versions up to, and including, 3.29.12. This 
  makes it possible for unauthenticated attackers to delete arbitrary files on 
  the server, which can easily lead to remote code execution when the right file
  is deleted (such as wp-config.php). This is exploitable without authentication
  when a form is configured with public visibility (who_can_see='all'), as the 
  required nonce is publicly obtainable from the rendered form.
