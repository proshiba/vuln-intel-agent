title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrpmsg:
  glink: fix deadlock in endpoint destroy during driver detach\n\nDuring driver detach,
  the device core holds the device mutex throughout\nthe driver's remove callback
  chain.  When the rpmsg endpoint is\ndestroyed as part of that teardown, the GLINK
  endpoint destroy\nimplementation attempts to unregister the underlying rpmsg device.\n\
  That unregistration calls device_del(), which tries to re-acquire the\nsame device
  mutex already held higher up the stack, causing rmmod to\nhang indefinitely.\n\n\
  The deadlock manifests with the following call chain:\n\n[<0>] device_del+0x44/0x414  <-
  tries to acquire same mutex\n[<0>] device_unregister+0x18/0x34\n[<0>] rpmsg_unregister_device+0x28/0x4c\n\
  [<0>] qcom_glink_remove_rpmsg_device+0x70/0xc0\n[<0>] qcom_glink_destroy_ept+0x58/0xbc\n\
  [<0>] rpmsg_dev_remove+0x50/0x60\n[<0>] device_remove+0x4c/0x80\n[<0>] device_release_driver_internal+0x1cc/0x228\
  \  <- acquires device mutex\n[<0>] driver_detach+0x4c"
