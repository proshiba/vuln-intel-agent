title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Free histogram the field rejected for a bad modifier\n\nWriting a hist trigger whose
  value or variable carries a modifier that is\nnot allowed there leaks the fields
  that were built for it.\n\n__create_val_field() takes the field from parse_expr()
  and stores it in\nhist_data->fields[] only after the modifier checks have run:\n\
  \n\thist_field = parse_expr(hist_data, file, field_str, flags, var_name,\n\t\t\t\
  \t&n_subexprs);\n\t...\n\tif (hist_field->flags & HIST_FIELD_FL_VAR) {\n\t\tif (hist_field->flags
  & (...))\n\t\t\tgoto err;\n\t} else {\n\t\tif (hist_field->flags & (...))\n\t\t\t
  goto err;\n\t}\n\n\thist_data->fields[val_idx] = hist_field;\n\nBoth checks jump
  past that store, and the err label returns without\nfreeing anything. The error
  unwinds to create_hist_data(), which calls\ndestroy_hist_data() -> destroy_hist_fields(),
  and that reaches a field\nonly by walking fields[]. A field that never got there
  is unreachable.\n\ncommit e0213434fe3e (\"tracing:"
