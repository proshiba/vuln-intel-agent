  vulnerability in the SuicidalSleeper component that uses a hard-coded 
  passphrase for multicast command authorization. Any multicast-reachable peer 
  can enumerate MOOS processes and send termination commands to trigger process 
  shutdown by exploiting the default multicast group and port with the known 
  passphrase.
