title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/efa:
  Fix PBL chunk length computation\n\nOn register MR, when creating the PBL, if it's
  an indirect PBL we create\na chunk list to hold the PBL pages pointers. Each chunk
  is 4KB in size\nand can hold 510 addresses (EFA_PTRS_PER_CHUNK) and has a 12-byte\n\
  control buffer at the end of it holding the next chunk's pointer and its\nlength.\n\
  \nIf the PBL number of pages is a multiple of EFA_PTRS_PER_CHUNK, the\ncalculated
  last chunk length is wrongly computed as 0, even though that\nchunk is fully populated
  with 510 real page pointers. This wrong length\nis used both to DMA map the chunk
  and is propagated to the device,\ncausing the device to see the chunk as empty and
  reject the memory\nregistration.\n\nFix the calculation so it will be performed
  only if the number of pages\nisn't a multiple of EFA_PTRS_PER_CHUNK, if it is, its
  already handled in\nthe above loop correctly.\nAlso prevent out-of-bounds reach
  in the chunks array in such sc"
