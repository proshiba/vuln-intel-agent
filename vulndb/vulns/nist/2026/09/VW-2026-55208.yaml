title: XenForo before 2.3.13 contains an OAuth2 authorization code reuse 
  vulnerability that allows attackers to obtain unauthorized token pairs by 
  submitting a previously used authorization code. Attackers can exploit the 
  failure to invalidate or mark authorization codes as consumed after initial 
  token issuance to receive an independent token pair for the same user and 
  scopes, bypassing the single-use guarantee of the OAuth2 authorization code 
  flow.
