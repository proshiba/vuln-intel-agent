title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd:
  Put PCI device after handling PPR faults\n\niommu_call_iopf_notifier() looks up
  the requester with\npci_get_domain_bus_and_slot(), which returns a PCI device with
  its\nreference count incremented.\n\nNeither the successful iommu_report_device_fault()
  path nor the abort\npath drops that reference, so every handled PPR request leaks
  a PCI\ndevice reference.\n\nThis is the same ownership rule that was fixed for the
  old iommu_v2\nppr_notifier() path by commit 6cf0981c2233 (\"iommu/amd: Fix pci device\n\
  refcount leak in ppr_notifier()\"), but iommu_call_iopf_notifier() was\nadded later
  as a separate PPR/IOPF notifier path.\n\nDrop the PCI device reference after handling
  the PPR entry."
