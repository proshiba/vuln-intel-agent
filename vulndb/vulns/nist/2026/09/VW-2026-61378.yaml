title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_midi2: fix use-after-free in string attribute show path\n\nf_midi2_opts_str_show()
  takes the string lock internally, but its\ncallers dereference the opts->info.<field>
  pointer before calling it,\noutside the lock. This races with f_midi2_opts_str_store(),
  which\nfrees the old string under opts->lock when the attribute is written\nconcurrently,
  the show path can read a pointer that gets freed\nbefore the lock inside str_show()
  is even taken.\n\nChange f_midi2_opts_str_show() to take a pointer to the string
  field,\nmatching the existing pattern in f_midi2_opts_str_store(), and\ndereference
  it only after the lock is held. Update all three callers\n(iface_name, block name,
  and the EP string option macro) accordingly."
