title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2, summary An issue with permission checks in the knowledge base 
  management area has been identified. Under certain conditions, data validation
  for linked items was not fully enforced. This could have allowed users with 
  limited read permissions to interact with items outside their assigned access 
  scope. Data access has been strengthened in the current version through 
  additional validation routines. This issue is fixed in version 7.0.2.
