title: "A vulnerability in the web-based management interface of Cisco ISE could allow
  an authenticated, remote attacker to conduct an XSS attack against a user of the
  interface.\r\n\r\nThis vulnerability is due to insufficient validation of user-supplied
  input by the web-based management interface of an affected system. An attacker could
  exploit this vulnerability by injecting malicious code into specific pages of the
  interface. A successful exploit could allow the attacker to execute arbitrary script
  code in the context of the affected interface or access sensitive, browser-based
  information. To exploit this vulnerability, the attacker must have Admin privileges
  on an affected device."
