title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv,
  bpf: Fix kernel stack corruption in tailcall with CFI\n\nWhen CONFIG_CFI_CLANG is
  enabled, prog->bpf_func already skips the kcfi\ninstruction during setup. Including
  it again in the tailcall jump offset\ncauses it to jump over an extra 4 bytes, skipping
  the stack pointer\nadjustment, which will result in kernel stack corruption."
