title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  sa2ul - stop probe if context pool creation fails\n\nsa_ul_probe() calls sa_init_mem()
  to create the DMA pool used for\nsecurity context buffers, but ignores its return
  value. If pool creation\nfails, probe still continues with DMA setup, algorithm
  registration and\nchild population even though later request setup depends on that
  pool.\n\nStop probing when sa_init_mem() fails, and route that failure to the PM\n\
  cleanup path without attempting to destroy an uncreated DMA pool."
