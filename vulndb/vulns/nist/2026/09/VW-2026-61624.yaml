title: A flaw was found in the first-broker-login flow of the keycloak-services 
  component. This component handles the initial authentication and account 
  linking when a user logs in via an external identity provider. The issue 
  allows an attacker to register a matching username on an external provider to 
  trigger a collision in Keycloak, which results in the legitimate user being 
  locked out of their account.
