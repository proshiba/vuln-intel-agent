title: "This issue affects the \nExtractEmbeddedFiles example in Apache PDFBox: from
  2.0.24 through 2.0.35, from 3.0.0 through 3.0.6.\n\n\nThe ExtractEmbeddedFiles example
  contains a path traversal vulnerability (CWE-22) because \nthe filename that is
  obtained from \nPDComplexFileSpecification.getFilename() is appended to the extraction
  path.\n\nUsers who have copied this example into their production code should \n\
  review it to ensure that the extraction path is acceptable. The example \nhas been
  changed accordingly, now the initial path and the extraction \npaths are converted
  into canonical paths and it is verified that \nextraction path contains the initial
  path. The documentation has also \nbeen adjusted."
