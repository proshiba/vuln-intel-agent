title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/arm-smmu-v3:
  Manage teardown with devm\n\narm_smmu_device_remove() manually frees the IOPF queue,
  destroys the\nvmid_map and disables the device, while the IRQs and queues are devm\n\
  managed. devm unwinds only after remove() returns, so the cleanup runs\nin the wrong
  order. The IOPF queue is freed before the event-queue IRQ\nwhose handler uses it.\n\
  \nManage all of it with devm so the unwind order is correct. Free the IOPF\nqueue
  and vmid_map via devm actions, and disable the device from one\nregistered after
  arm_smmu_device_reset().\n\nThis is also a prerequisite for fixing a Tegra241 CMDQV
  CMD_SYNC\nuse-after-free in the subsequent patch."
