title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: Prevent deadlock during ep0 read loop\n\nCurrently, ffs_ep0_read()
  holds ffs->mutex when it prepares to go to\nsleep waiting for an event. When no
  setup events are pending, it calls\nwait_event_interruptible_exclusive_locked_irq()
  with the mutex still\nheld. The wait macro deliberately drops the waitqueue spinlock
  before\nsleeping but does not drop the mutex.\n\nIf a userspace daemon is polling
  ep0 via read() and the gadget is\nasynchronously torn down via configfs (e.g., echo
  \"\" > UDC), a\ndeadlock can occur:\n\n1. The configfs teardown calls functionfs_unbind(),
  which queues a\n   FUNCTIONFS_UNBIND event.\n2. The daemon wakes up, consumes the
  event, and drops the mutex.\n3. However, if the daemon loops and immediately issues
  another read()\n   before exiting, it reacquires ffs->mutex and again goes into
  an\n   interruptible sleep.\n4. Meanwhile, functionfs_unbind() continues execution
  and attempts to\n   acquire ffs"
