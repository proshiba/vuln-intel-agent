title: The Bulk Password Reset plugin for WordPress is vulnerable to privilege 
  escalation via account takeover in all versions up to, and including, 1.3.3. 
  This is due to the plugin not properly validating a user's identity prior to 
  updating their details like arbitrary user passwords, including administrator 
  passwords, to a known plugin-configured custom value, enabling full account 
  takeover of the site. This makes it possible for authenticated attackers, with
  subscriber-level access and above, to change arbitrary user's email addresses,
  including administrators, and leverage that to reset the user's password and 
  gain access to their account.
