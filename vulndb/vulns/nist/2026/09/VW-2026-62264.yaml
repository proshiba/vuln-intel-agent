title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/server:
  fix session leak in ksmbd_session_register()\n\nSee the procedure below:\n\n  smb2_sess_setup\n\
  \    ksmbd_smb2_session_create\n      __session_create\n        atomic_set(&sess->refcnt,
  2)\n        hash_add(sessions_table, &sess->hlist, sess->id)\n    ksmbd_session_register\n\
  \      xa_store(&conn->sessions, sess->id, sess) // fail\n    ksmbd_user_session_put\n\
  \      atomic_dec(&sess->refcnt) // refcnt is 1, session is not freed\n\nRemove
  the session from sessions_table and drop its table reference if\nxa_store() fails."
