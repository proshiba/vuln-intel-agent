title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Don't infer non-NULL from a pointer with an unbounded offset\n\nreg_not_null() decides
  that a register holds a non-NULL value by\nlooking at its type alone. For pointer
  types that allow arithmetic the\ntype only guarantees a non-NULL base, in case of
  an unbound offset\nthe runtime offset value might still add up to NULL.\nConsider
  the followng program:\n\n  r6 = bpf_map_lookup_elem(map, &0);  /* present */\n \
  \ if (r6 == 0) return 0;\n  r7 = bpf_map_lookup_elem(map, &1);  /* absent, NULL
  at runtime */\n  r8 = r7;\n  r8 -= r6;     /* pointer - pointer: unknown scalar,
  -r6 */\n  r8 <<= 1;\n  r8 >>= 1;     /* any non-negative offset is accepted by */\n\
  \                /* check_reg_sane_offset_ptr() */\n  r6 += r8;     /* verifier:
  map value;    runtime: zero  */\n  if (r7 != r6) return 0;\n  *(u8 *)(r7 + 0); \
  \ /* r7 is inferred non-NULL, both are zero */\n\nAt runtime both registers are
