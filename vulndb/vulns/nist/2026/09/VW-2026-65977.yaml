title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btrtl: Don't leak return code when parsing firmware format v2\n\nWhen key_id from
  chip is zero, rtlbt_parse_firmware_v2() intentionally\nignores all security headers.
  However, the implementation simply breaks\nfrom a switch statement and leaks uninitialized
  return code `rc' (if the\nfirst section is a security one) or the previous section's
  `rc'.\n\nFix it by really skipping a loop with `continue'. For consistency and\n\
  readability, also do the same for the default case."
