title: yshop-crm through 2.1.3 fails to enforce authorization on the GET 
  /admin-api/crm/operatelog/page endpoint, allowing any authenticated 
  back-office user to access the installation-wide audit trail. Attackers can 
  query the operation log to retrieve operator names, display nicknames, client 
  IP addresses, User-Agent strings, request URLs, action details, and customer 
  identifiers without proper permission checks.
