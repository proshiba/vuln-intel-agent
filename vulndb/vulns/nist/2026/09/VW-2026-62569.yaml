title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: Avoid buffer overread in ath12k_wmi_op_rx()\n\nCurrently, in ath12k_wmi_op_rx(),
  the firmware buffer is read without\nfirst verifying that the buffer has enough
  data to hold a header. This\ncould result in a buffer overread.\n\nUpdate the logic
  to verify the buffer contains at least enough data to\nhold a wmi_cmd_hdr before
  reading from the buffer.\n\nTested-on: WCN7850 hw2.0 PCI WLAN.HMT.1.1.c7-00108-QCAHMTSWPL_V1.0_V2.0_SILICONZ_UPSTREAM-3"
