title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmac802154:
  fix use-after-free of sdata via queued RX frames\n\nThe RX softirq producer ieee802154_subif_frame()
  queues received beacon\nand MAC-command frames onto local->rx_beacon_list / rx_mac_cmd_list
  and\nschedules a process-context worker, storing a raw mac_pkt->sdata (and\nskb->dev
  == sdata->dev) with neither a reference nor any locking:\n\n - the lists have no
  lock: the softirq producer list_add_tail()s while the\n   mac_wq worker list_del()s,
  so sibling interfaces on the same phy corrupt\n   the list;\n\n - the workers dereference
  the interface after it may have been freed.\n   mac802154_rx_mac_cmd_worker() touches
  mac_pkt->sdata directly, and\n   mac802154_rx_beacon_worker() -> mac802154_process_beacon()
  dereferences\n   skb->dev (== sdata->dev). Removing an interface frees its sdata\n\
  \   (netdev_priv) while a queued frame still points at it, so a later worker\n \
  \  run is a use-after-free.\n\nReproduced under KASAN by flooding a"
