title: "Description\n\nDependency artifacts uploaded with `storm jar --artifacts`
  were stored under a blob key derived only from\nthe Maven coordinate, for example
  `dep---.jar`. The key was therefore identical\nfor every user of the cluster and
  predictable in advance. When the blob already existed, the uploader\ncaught `KeyAlreadyExistsException`
  and silently reused it, with no check that the existing blob's content\nor owner
  matched the artifact the submitter had resolved.\n\nA user who uploaded a blob under
  such a key first therefore controlled the bytes that every later submitter\nof the
  same coordinate would receive on the worker classpath, resulting in code execution
  inside another\ntenant's topology.\n\nThis affects deployments where more than one
  principal may create blobs and where the `--artifacts`\ndependency feature is used.\n\
  \nMitigation\n\nUpgrade to 3.1.0, where each uploaded artifact receives a key carrying
  a freshly generated UUID and a\npre-existing blob is no longer silently reused.\n\
  \nNote that"
