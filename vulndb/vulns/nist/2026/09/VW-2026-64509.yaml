title: MCP Atlassian is a Model Context Protocol (MCP) server for Atlassian 
  products (Confluence and Jira). Prior to 0.22.0, the OAuth error query 
  parameter is passed to CallbackHandler._send_response in oauth_setup.py and 
  interpolated into an HTML page without escaping. A crafted authorization 
  callback can inject markup or script that executes in the browser of a user 
  completing the OAuth flow. This issue is fixed in version 0.22.0.
