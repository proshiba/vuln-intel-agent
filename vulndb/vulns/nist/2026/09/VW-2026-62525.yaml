title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/isert:
  reject login PDUs declaring more data than was received\n\nisert_login_recv_done()
  records how many bytes the HCA actually placed in\nthe login buffer, but nothing
  compares that against the length the login\nPDU's BHS declares.  isert_rx_login_req()
  copies min(login_req_len,\nMAX_KEY_VALUE_PAIRS) bytes into login->req_buf, and the
  login code then\nreads the declared length back out of that buffer - for the first
  PDU in\niscsi_target_locate_portal(),\n\n\tpayload_length = ntoh24(login_req->dlength);\n\
  \ttmpbuf = kmemdup_nul(login->req_buf, payload_length, GFP_KERNEL);\n\nand for the
  ones after it in iscsi_decode_text_input(), reached from\niscsi_target_do_login().\n\
  \nlogin->req_buf is a fixed MAX_KEY_VALUE_PAIRS (8192) byte allocation, so\nan initiator
  that declares more than it sends reads off the end of it,\nbefore authentication
  and with the length under its control:\n\n  BUG: KASAN: slab-out-of-bounds in kmemdup_nul+0x43/0x80\n"
