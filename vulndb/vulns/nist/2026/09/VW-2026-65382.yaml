title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  hibernate: mask DAIF before restoring hibernated kernel\n\nThe arm64 hibernate code
  manages the exception masking in an unsound\nway, leading to potential crashes and/or
  warnings during resume.\n\nWhen a hibernation image is saved in `swsusp_arch_suspend()`,
  all DAIF\nexceptions are masked (by virtue of `local_daif_save()`), and the\nsuspended
  image is saved assuming that all DAIF exceptions will remain\nmasked when the image
  is restored.\n\nWhen a hibernation image is resumed by `swsusp_arch_resume()`, only\n\
  interrupts are masked (by virtue of `local_irq_disable()` in\n`resume_target_kernel()`).
