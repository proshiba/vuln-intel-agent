title: A vulnerability was found in Ollama up to 0.31.1. This issue affects the 
  function readGGUFV1String of the file fs/ggml/gguf.go of the component GGUF 
  Decoder. Performing a manipulation results in integer overflow. The attack is 
  possible to be carried out remotely. The exploit has been made public and 
  could be used. Upgrading to version 0.31.2-rc1 is capable of addressing this 
  issue. The patch is named 67b6a1c2d45321e0cb3c04a18073f9818de7724b. It is 
  recommended to upgrade the affected component.
