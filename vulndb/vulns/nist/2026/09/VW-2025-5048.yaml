title: An unauthenticated attacker within proximity of the Meatmeet device can 
  perform an unauthorized Over The Air (OTA) firmware upgrade using Bluetooth 
  Low Energy (BLE), resulting in the firmware on the device being overwritten 
  with the attacker's code. As the device does not perform checks on upgrades, 
  this results in Remote Code Execution (RCE) and the victim losing complete 
  access to the Meatmeet.
