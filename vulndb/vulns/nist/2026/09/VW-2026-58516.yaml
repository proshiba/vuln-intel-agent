title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlib/ucs2_string.c:
  fix out-of-bounds read in ucs2_strnlen()\n\nPatch series \"lib/ucs2_string.c: fix
  out-of-bounds read in\nucs2_strnlen()\", v2.\n\nThis series fixes an off-by-one
  out-of-bounds read in ucs2_strnlen().\n\nThe first patch is the real fix, the second
  patch comes as a bonus and\nfixes the code indentation.\n\n\nThis patch (of 2):\n\
  \nucs2_strnlen() checks the current character before checking whether the\ncaller-provided
  maximum length has been reached.  If the input is not\nNUL-terminated within that
  bound, the loop can read one ucs2_char_t past\nthe limit.\n\nTest the length before
  dereferencing to prevent an off-by-one\nout-of-bounds read."
