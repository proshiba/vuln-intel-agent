title: Renovate is a dependency update automation tool. When listing 
  tags/digests for a container image, Renovate follows pagination links supplied
  by the remote registry in the HTTP Link header and attaches the registry 
  credentials to the follow-up request without verifying that the pagination URL
  has the same origin as the original registry. A malicious or compromised 
  container registry can therefore specify a Link header pointing to an 
  attacker-controlled host and receive the credentials Renovate uses for that 
  registry. Exploitation requires that the target has container (Docker) 
  dependencies and is already interacting with the malicious or compromised 
  registry. This is fixed in Renovate 44.11.2 (npm and renovate/renovate 
  images), Mend Renovate CE/EE 15.4.0 and the mend-renovate-enterprise-edition 
  Helm chart 10.4.0; the same-origin check can be disabled with 
  RENOVATE_X_DOCKER_PAGINATION_ALLOW_CROSS_ORIGIN.
