title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix memory corruption from a \"STACKTRACE\" histogram key\n\n\"cpu\", \"CPU\", \"\
  stacktrace\" and \"STACKTRACE\" are generic fields, defined\nwith an offset and
  a size of zero so that the filter code can match them\nby name. parse_field() maps
  them onto their common_* equivalents for\nbackward compatibility, but unlike the
  common_* names it hands the\nplaceholder back to the caller instead of NULL.\n\n\
  create_hist_field() takes a non-NULL field as a promise that the record\ncarries
  a stacktrace and picks HIST_FIELD_FN_STACK, so the __data_loc\nword is read from
  offset 0, that is from common_type, and its low 16\nbits are followed as an offset
  into the record. What is found there\nbecomes the length of an unbounded memcpy.
  Pick an event whose id is\nsmall enough that the offset stays inside its own record
  and the length\nis a kernel text address:\n\n  # cd /sys/kernel/tracing\n  # echo
  'hist:keys=STACKTRACE' > events/ftrace/print/trigger"
