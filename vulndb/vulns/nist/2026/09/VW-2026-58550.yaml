title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm,
  swap: don't free a hibernation slot that is in the swap cache\n\nA slot with a folio
  in the swap cache is freed when the folio leaves the\ncache, not when its count
  drops.  swap_put_entries_cluster() follows that\nrule.  swap_free_hibernation_slot()
  does not, it calls\n__swap_cluster_free_entries() whether or not a folio sits on
  the slot.\n\nCluster readahead can put one there.  It walks a raw page_cluster sized\n\
  window of offsets around the faulting entry, and a hibernation slot passes\n__swap_cache_add_check()
  because it is not a folio and its count is not\nzero.  Freeing the slot then clears
  the entry under that folio.\n\nThe folio is now unreachable from the swap table,
  and the offset goes back\nto the allocator.  The folio is still on the LRU though,
  so reclaim can\npick it up later.  It then takes the old offset out of folio->swap
  and\noverwrites the table entry there, which by then may belong to someone\nelse.\n\
