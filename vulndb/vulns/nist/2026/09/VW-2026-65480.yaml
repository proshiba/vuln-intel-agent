title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: ibss: wait for in-flight TX on disconnect\n\nWhile leaving an IBSS in
  ieee80211_ibss_disconnect() mac80211 flushes\nstations, turns the carrier off and
  immediately tells the driver to\nleave as well. While there may be synchronize_net()
  in station flush\nand in this code later, packets can still be transmitted due to\n\
  cross-CPU race conditions after carrier off is set.\nTherefore, it's possible for
  a race to happen where a TX to the\ndriver occurs while or after telling it to leave
  the IBSS. This can\nbe confusing to drivers, and in the case of iwlwifi leads to
  an\nattempt to use invalid queues.\n\nMove netif_carrier_off() to occur before sta_info_flush()
  during\nIBSS disconnect, and add synchronize_net() if flushing didn't,\nso that
  the synchronize_net() always happens between turning the\ncarrier off and telling
  the driver, avoiding this race."
