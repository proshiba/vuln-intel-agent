title: 'A vulnerability was determined in ScadaBR up to 1.1. Impacted is the function
  EmportDwr.createExportJSON of the file /ScadaBR/export_project.htm of the component
  Export Project Endpoint. This manipulation causes information disclosure. The attack
  can be initiated remotely. The exploit has been publicly disclosed and may be utilized.
  Upgrading to version 1.2.0 is recommended to address this issue. Patch name: c852b4988a15bce6011ef169299ad604538f70a9.
  The affected component should be upgraded. Import path was already gated with Permissions.ensureAdmin();
  only export was left unprotected.'
