title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  devres: fix cleanup in devm_clk_get_optional_enabled_with_rate()\n\ndevm_clk_get_optional_enabled_with_rate()
  registers its cleanup action\nbefore setting the clock rate. If setting the rate
  fails, it attempts to\ndisable and unprepare a clock that was never enabled. This
  issue was\nspotted while reviewing \"rust: clk: add devres-managed clks\" [1].\n\
  \nRegister the cleanup action only after successfully preparing and enabling\nthe
  clock.\n\n[1]: https://lore.kernel.org/rust-for-linux/20260706-clk-type-state-v5-3-67c5f326a16c@collabora.com"
