title: A security vulnerability has been detected in RedPort Optimizer wXa-203, 
  Optimizer wXa-213 and Optimizer wXa-223 up to 20260704. This impacts the 
  function exec of the file /xgatev1/system/datetime.php of the component System
  Clock. The manipulation leads to command injection. The attack may be 
  initiated remotely. The exploit has been disclosed publicly and may be used. 
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
