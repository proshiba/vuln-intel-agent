title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthunderbolt:
  Release request if tb_cfg_request() fails in __tb_xdomain_response()\n\nIf tb_cfg_request()
  fails setting up the request (for example the\ncontrol channel is shut down already)
  it returns an error without\ncalling the callback. To avoid leaking that memory,
  call\ntb_cfg_request_put() if tb_cfg_request() fails."
