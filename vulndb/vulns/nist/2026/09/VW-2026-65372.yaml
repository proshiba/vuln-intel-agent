title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  fix out-of-bounds read setting MSI-X irq affinity\n\nrvu_register_interrupts() walks
  every MSI-X vector and uses strstr()\nto match \"Mbox\" or \"FLR\" in irq_name before
  pinning those interrupts\nto CPU 0. irq_name is a per-vector NAME_SIZE buffer, but
  not every\nslot is populated before this loop runs. strstr() keeps scanning until\n\
  it finds a NUL terminator, so an uninitialized slot can trigger a KASAN\nslab-out-of-bounds
  read at boot when debug options are enabled.\n\nUse strnstr() with NAME_SIZE to
  bound the search within each vector's\nname buffer."
