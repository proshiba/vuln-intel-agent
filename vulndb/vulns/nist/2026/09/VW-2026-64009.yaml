title: InvenTree is an Open Source Inventory Management System. Prior to 1.4.0, 
  POST /api/barcode/ accepts an attacker-synthesized internal JSON barcode 
  containing a lowercase model label and integer primary key, while BarcodeView 
  uses IsAuthenticatedOrReadScope and requires only authentication or a general 
  read scope. The built-in barcode plugin selects the object with 
  model.objects.get(pk=...), and InvenTreeBarcodeMixin.format_matched_response()
  returns the complete model serializer output as instance without checking the 
  caller's per-model view role. A low-privilege user can enumerate primary keys 
  for parts, stock, locations, supplier and manufacturer parts, orders, and 
  builds to disclose commercially sensitive inventory, pricing, supplier, 
  customer, and order data. This issue is fixed in version 1.4.0.
