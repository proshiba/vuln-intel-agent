title: Zammad is a web based open source helpdesk/customer support system. In 
  7.0.3 and 7.1.1, an authenticated administrator can obtain stored integration 
  credentials in cleartext through the integration administration API. Certain 
  responses do not consistently mask sensitive fields, so configured secrets can
  be returned in plain text instead of the expected masked placeholder. Both the
  LDAP and Exchange integrations are affected. This issue is fixed in version 
  7.1.2.
