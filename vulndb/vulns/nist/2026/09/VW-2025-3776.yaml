title: "When the Vaadin Upload's start listener is used to validate metadata about
  an incoming upload, it is possible to bypass the upload validation. \n\n\nUsers
  of affected versions should apply the following mitigation or upgrade. Releases
  that have fixed this issue include:\n\nProduct version\nVaadin 7.0.0 - 7.7.47\n\
  Vaadin 8.0.0 - 8.28.1\nVaadin 14.0.0 - 14.13.0\nVaadin 23.0.0 - 23.6.1\nVaadin 24.0.0
  - 24.7.6\n\nMitigation\nUpgrade to 7.7.48\nUpgrade to 8.28.2\nUpgrade to 14.13.1\n\
  Upgrade to 23.6.2\nUpgrade to 24.7.7 or newer\n\nPlease note that Vaadin versions
  10-13 and 15-22 are no longer supported and you should update either to the latest
  14, 23, 24 version.\n\nArtifacts     Maven coordinatesVulnerable versionsFixed versioncom.vaadin:vaadin-server\n\
