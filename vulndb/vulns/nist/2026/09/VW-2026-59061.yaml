title: A security flaw has been discovered in vllm-project vLLM up to 0.29.0. 
  The affected element is the function TiktokenTokenizer::new of the file 
  rust/src/text/src/backend/hf/mod.rs of the component tiktoken vocab File 
  Handler. The manipulation results in denial of service. The attack is only 
  possible with local access. The exploit has been released to the public and 
  may be used for attacks. The pull request to fix this issue awaits acceptance.
