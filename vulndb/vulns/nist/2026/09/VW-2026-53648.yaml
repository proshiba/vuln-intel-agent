title: A security flaw has been discovered in ILIAS up to 9.21/10.9/11.2. This 
  affects the function ilObjMediaObjectGUI::uploadMultipleSubtitleFileObject of 
  the file Services/Repository/Service/Resources/ZipAdapter.php of the component
  MediaPool. The manipulation results in unrestricted upload. The attack may be 
  launched remotely. Upgrading to version 9.22, 10.10 and 11.3 is able to 
  mitigate this issue. The patch is identified as 
  ef5d7f99fe1ea0381db04b333a2906548b3590e4/b0d61be43671b6bfe91baf469a5ee11e764f2e23.
  It is recommended to upgrade the affected component.
