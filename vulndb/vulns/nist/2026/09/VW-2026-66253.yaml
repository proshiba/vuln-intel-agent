title: "The AIL Framework crawler task creation API (api_add_crawler_task) contained
  an insufficient authorization check when a user supplied a cookiejar UUID to attach
  to a one-shot or scheduled crawler task. The original code only verified that the
  cookiejar existed and, if its access level was 0, compared the cookiejar's owning
  user ID to the requesting user ID. It did not validate organizational boundaries,
  did not account for the requesting user's role. When the cookiejar level was not
  0, no access check was performed at all. An authenticated user could therefore reference
  another organization's cookiejar by UUID and have the crawler use that organization's
  stored cookies (session tokens, authentication credentials) when performing web
  crawls, effectively leaking or exfiltrating the victim organization's session data.\n\
