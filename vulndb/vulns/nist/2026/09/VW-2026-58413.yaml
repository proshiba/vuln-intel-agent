title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  mcp2221: stop device IO before hid_hw_stop\n\nQuiesce device IO at the start of
  the devm cleanup callback\nmcp2221_hid_unregister() so that incoming HID reports
  cannot race with\nhardware teardown during probe failure or device removal, addressing
  a\npotential use-after-free.\n\nGuard the call to hid_device_io_stop() with io_started.
  On normal\nremoval hid_device_remove() has already cleared io_started before the\n\
  devres group is released, so an unconditional call would otherwise hit\nthe !io_started
  path and emit a spurious \"io already stopped\" warning\non every removal. The guard
  preserves the probe-failure balancing,\nwhere io_started is still set after hid_device_io_start(),
  while\nstaying silent on the normal removal path."
