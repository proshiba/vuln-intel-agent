title: Wallos is an open-source, self-hostable personal subscription tracker. 
  Prior to version 5.0.0, the fix for CVE-2026-33407 (GHSA-hhjq-82f8-m6rc, "SSRF
  via HTTP Proxy Environment Variable") hardened endpoints/logos/search.php by 
  disabling cURL proxying (CURLOPT_PROXY = '' + CURLOPT_NOPROXY = '*'). However,
  Wallos ships a second, near-identical, unauthenticated logo-image search 
  endpoint — endpoints/payments/search.php — that was not given the same 
  hardening. It still passes the HTTP_PROXY/HTTPS_PROXY environment variable 
  straight into CURLOPT_PROXY. This issue has been patched in version 5.0.0.
