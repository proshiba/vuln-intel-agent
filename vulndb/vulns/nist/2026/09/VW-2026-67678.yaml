title: The decoder in `readFromDataView` in lib0 before 0.2.119 can be tricked 
  into reading more than it should from a buffer. The vulnerability allows 
  reading past the decoders' view, thus exposing adjacent process memory. This 
  can be anything that is currently in the head, for example credentials or 
  logs. This is similar to but different from GHSA-r5c8-rf4w-qrq8.
