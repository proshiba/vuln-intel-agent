title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix off-by-one page overflow in ntfs_decompress()\n\nThe per-token range check in
  ntfs_decompress() uses\n\n\tif (cb >= cb_sb_end || dp_addr > dp_sb_end)\n\t\tbreak;\n\
  \nso dp_addr == dp_sb_end falls through to the symbol copy\n`*dp_addr++ = *cb++`,
  writing one byte past the destination page.  Since\nNTFS_SB_SIZE == PAGE_SIZE the
  destination is a single page, so the byte\nlands in the adjacent page, and *dest_ofs
  is left one past the sub-block\nend (the later `*dest_ofs &= ~PAGE_MASK` then yields
  1, not 0, so the page\nis never finalized and later sub-blocks keep writing further
  past it).  A\ncorrupted compressed $DATA attribute thus produces a bounded run of\n\
  out-of-bounds writes when the file is read.\n\nBreak as soon as dp_addr reaches
  dp_sb_end; a full sub-block still\ncompletes, as its final copy advances dp_addr
  to exactly dp_sb_end."
