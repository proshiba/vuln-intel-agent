title: "NumberInput.looksLikeValidNumber() in FasterXML jackson-core pre-validates
  \"stringified numbers\" with two regular expressions: PATTERN_FLOAT ([+-]?[0-9]*[\\
  .]?[0-9]+([eE][+-]?[0-9]+)?), present since 2.17.0, and PATTERN_FLOAT_TRAILING_DOT,
  added in 2.17.2. PATTERN_FLOAT places adjacent quantifiers over the same character
  class -- an optional [0-9]* run, an optional dot, then a required [0-9]+ run --
  so input that ultimately fails to match forces Java's backtracking engine to retry
  every possible split point of the digit run. \n\n\n\nMatching cost therefore grows
  with the square of the input length. \n\n\n\nAn attacker who can supply JSON that
  an application deserializes into a numeric target type reaches this method through
  jackson-databind's default String-to-number coercion (StdDeserializer and NumberDeserializers
  for BigDecimal, BigInteger, Double and Float). \n\n\n\nBecause StreamReadConstraints.maxStringLength
  defaults to 20,000,000 characters, no constraint bounds the input before it reaches "
