title: 'Craft CMS 5.0.0-RC1 through versions before 5.11.0 incorrectly authorize the
  GraphQL draftCreator and revisionCreator fields: instead of requiring the user-data
  scope enforced by Gql::canQueryUsers() (usergroups.*:read), these fields are gated
  only on the elements.drafts:read / elements.revisions:read scopes, and their resolver
  returns a raw User element whose email, username, fullName, and addresses fields
  have no per-field authorization. A client holding only the drafts or revisions scope
  — including an unauthenticated client when the operator has enabled the public GraphQL
  schema with those scopes — can therefore harvest the email addresses, usernames,
  full names, and postal addresses of all draft/revision creators (typically site
  editors and administrators). The issue is fixed in 5.11.0.'
