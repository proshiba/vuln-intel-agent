title: 'xmldom is a pure JavaScript W3C standard-based (XML DOM Level 2 Core) DOMParser
  and XMLSerializer module. Prior to @xmldom/xmldom versions 0.8.15 and 0.9.12, and
  in xmldom version 0.6.0 and earlier, Document.createEntityReference(name) accepts
  an invalid name and the ENTITY_REFERENCE_NODE serializer emits the resulting nodeName
  directly in &name; form. Directly serializing the node or fragment with XMLSerializer.serializeToString()
  and requireWellFormed: true can therefore break the entity-reference boundary and
  produce attacker-controlled XML markup when reparsed. The parser does not ordinarily
  create these nodes, and element-child insertion is rejected, so exploitation requires
  an application to create and directly serialize an EntityReference. This issue is
  fixed in @xmldom/xmldom versions 0.8.15 and 0.9.12; no fixed version is available
  for xmldom.'
