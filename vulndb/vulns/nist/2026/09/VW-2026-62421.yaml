title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/erdma:
  Hold CQ references when processing EQ events\n\nEQ handlers look up CQs from dev->cq_xa
  and invoke CQ completion or\nerror callbacks outside the xarray lock. erdma_destroy_cq()
  can erase the\nCQ from the xarray and free its queue buffer and doorbell record
  while a\npreviously scheduled EQ handler is still using the CQ.\n\nAdd a CQ refcount
  and take a reference under the xarray lock with\nrefcount_inc_not_zero(). Remove
  the CQ from the xarray before dropping\nthe destroy-path reference, then wait for
  in-flight EQ users before\nreleasing CQ resources."
