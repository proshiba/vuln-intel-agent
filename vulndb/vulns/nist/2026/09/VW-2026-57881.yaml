title: Netskope was notified of an out-of-bounds heap read affecting the 
  Endpoint DLP (EPDLP) service of the Netskope Client. A local standard user 
  could potentially send a specially crafted message that is not properly 
  validated with a bounds check, likely crashing the kernel driver handler. 
  Successful exploitation could potentially crash the EPDLP service, temporarily
  interrupting DLP enforcement. A successful exploit could potentially also 
  reveal per-boot memory layout information to unauthorized users.
