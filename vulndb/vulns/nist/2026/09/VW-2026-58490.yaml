title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  validate sockaddr length per family in listener_set\n\nnfsd_sock_nl_policy declares
  NFSD_A_SOCK_ADDR as a bare NLA_BINARY\nattribute with no minimum length. A CAP_NET_ADMIN
  caller can send a\n16-byte NFSD_A_SOCK_ADDR with sa_family=AF_INET6, causing a 12-byte\n\
  OOB read across three consumers (rpc_cmp_addr_port, svc_find_listener,\nkernel_bind).\n\
  \nnfsd_nl_listener_set_doit() also parsed and validated each listener\nentry inline
  in two separate loops, interleaved with mutating the\nrunning listener configuration.
