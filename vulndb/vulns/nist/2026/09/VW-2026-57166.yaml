title: Snipe-IT is an open source IT asset management system. In versions up to 
  and including 8.6.3, the report acceptance endpoints POST 
  /reports/unaccepted_assets/sent_reminder 
  (ReportsController::sentAssetAcceptanceReminder) and DELETE 
  /reports/unaccepted_assets/{acceptanceId}/delete 
  (ReportsController::deleteAssetAcceptance) are not correctly scoped when Full 
  Multiple Company Support (FMCS) is enabled. In 8.6.3 the guard 
  ReportsController::currentUserCanAccessAcceptance() early-exits with 'return 
  true' when '! $user->company_id' is truthy, which is the case for every 
  pivot-only user (a user associated with companies through the company_user 
  pivot table whose scalar users.company_id column is NULL); versions prior to 
  8.6.3 lacked the guard altogether. As a result, an authenticated user holding 
  the reports.view permission can send acceptance-reminder emails for, and 
  permanently delete, any pending acceptance record in the install regardless of
  which company owns the underlying checkoutable.
