title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  fix possible fh_compose of wrong dentry in nfsd4_create_file()\n\ndentry_create()
  can hypothetically provide a different dentry than the\none passed in.  This could
  happen, for example, if the exported\nfilesystem is NFS, and the server returned
  to OPEN a filehandle which\nmatched a directory that was already in the dcache.\
  \  Clearly this would\nnot be expected!\n\nIf this were to happen the dentry (child)
  that was already stored in\nresfhp could be freed and later dereferenced.\n\nWe
  shouldn't call fh_compose() until we are certain that we have the\nfinal dentry,
  so this patch moved the fh_compose() call to two places:\none for the case where
  the target already exists, and one after\ndentry_create() where it was created."
