title: The Live Composer – Free WordPress Website Builder plugin for WordPress 
  is vulnerable to Stored Cross-Site Scripting via 
  'dslc_module_downloads_output' Shortcode Content in all versions up to, and 
  including, 2.1.21 due to insufficient input sanitization and output escaping. 
  This makes it possible for authenticated attackers, with contributor-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page. The save-time wp_kses_post check is
  bypassed because the payload is stored as a serialized string containing no 
  HTML tags for kses to tokenize, and the shortcode callback re-emits 
  attacker-controlled values — including view_all_link (href attribute), 
  main_heading_title (h2 body), button_text (anchor body), and button_inline_svg
  (anchor body) — without any escaping at render time.
