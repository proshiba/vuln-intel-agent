title: The Social Chat – Click To Chat App Button plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via 'consent_message' JSON Attribute
  in .qlwapp data-box in all versions up to, and including, 8.6.2 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for authenticated attackers, with contributor-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The exploit requires no user interaction beyond 
  page load, as setting auto_open and consent_enabled to 'yes' in the injected 
  data-box JSON causes the consent box — and the embedded script — to execute 
  immediately on page load.
