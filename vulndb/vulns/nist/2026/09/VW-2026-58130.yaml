title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsysctl:
  move the \"cad_pid\" entry from pid_table[] to kern_reboot_table[]\n\ncad_pid is
  global, and kill_cad_pid() is only used in the root namespace.\n\nHowever, due to
  pid_table_root_permissions(), a non-root user can unshare\npid/user namespaces and
  modify it from the child namespace. This makes no\nsense and is simply wrong.\n\n\
  Move it to kern_reboot_table[] where it logically belongs; this ensures\nthat only
  GLOBAL_ROOT_UID can read/modify this sysctl.\n\nNote that this patch doesn't preserve
  \"#ifdef CONFIG_PROC_SYSCTL\" around\nthe \"cad_pid\"; CONFIG_PROC_SYSCTL selects
  CONFIG_SYSCTL, so it is always\nset when kern_reboot_table[] is compiled."
