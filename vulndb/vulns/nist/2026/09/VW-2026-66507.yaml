title: Ghidra versions 9.2 through 12.1.4 contain a heap out-of-bounds read 
  vulnerability in StringManager::getCodepoint when decoding multi-byte UTF-8, 
  UTF-16, or UTF-32 characters without validating remaining buffer length. 
  Attackers can craft malicious binaries containing strings or constant byte 
  stores that end in multi-byte lead units to trigger out-of-bounds reads that 
  crash the decompiler or leak adjacent heap memory into decompiled output.
