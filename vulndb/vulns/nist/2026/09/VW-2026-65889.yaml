title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  destroy seen inode bitmap when we fail to add a dirpath\n\nLOLLM observes a memory
  leak in xchk_dirtree_create_path if we create\nthe directory path object but appending
  the name to the path fails.\nWhen this happens, we don't tear down the (empty) seen
  inode bitmap.\nThis is a pretty trivial error, but let's not leave logic bombs.\n\
  \nDo the same for a similar bug in xrep_dirtree_create_adoption_path."
