title: Magistrala before 1.0.0 contains a SQL injection vulnerability in the 
  timescale-reader and postgres-reader HTTP API services that allows 
  authenticated attackers to inject arbitrary SQL by supplying a malicious 
  format query parameter that is interpolated directly into the FROM clause 
  without parameterization or identifier quoting. Attackers with a 
  self-registered account can substitute arbitrary subqueries to achieve 
  cross-tenant database reads, extract pg_shadow password hashes, read and write
  arbitrary files, and execute arbitrary code as the postgres OS user by loading
  attacker-supplied shared objects, with all injected SQL executing at superuser
  privilege due to the default PostgreSQL role configuration.
