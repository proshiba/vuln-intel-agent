title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  hda/tas2781: Cancel async firmware request at unbind\n\nTAS2781 HDA I2C and SPI
  queue RCA firmware loading from component\nbind with request_firmware_nowait().
  The firmware loader keeps the\ncallback module pinned and holds a device reference,
  but the callback\nstill uses driver-private HDA state.\n\nComponent unbind removes
  controls and DSP state immediately. Later\ndevice removal tears down the TAS2781
  private data, including\ncodec_lock. If the async firmware callback runs after unbind
  has\nstarted, it can operate on state that is being torn down.\n\nCancel or synchronize
  the async firmware request before removing\ncontrols and DSP state. A queued callback
  is cancelled, and an\nalready-running callback is allowed to finish before unbind
  continues."
