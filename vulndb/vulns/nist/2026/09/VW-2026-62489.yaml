title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: fix RX data queuing of RRO 3.0\n\nFor RRO 3.0, RX data released from a RRO
  data queue should be put to\nthe indicator queue. The frames are processed and completed
  in the\ncontext of the indicator queue NAPI, which only polls skbs queued on\nthe
  MT_RXQ_RRO_IND list; frames queued under the data queue id are\nleft sitting on
  that list until the data queue NAPI happens to run,\nstalling and reordering RX
  data."
