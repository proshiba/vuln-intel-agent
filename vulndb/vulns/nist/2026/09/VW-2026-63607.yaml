title: A vulnerability was identified in aiyiyi121 SxDevOps 1.0/1.1. This 
  vulnerability affects the function ensure_default_superuser of the file 
  rbac/services.py. The manipulation leads to hard-coded credentials. The attack
  is possible to be carried out remotely. The identifier of the patch is 
  2b4bf8585c3e731e7a8af30801ea46680bc783f9. It is recommended to apply a patch 
  to fix this issue. The vendor was contacted early, responded in a very 
  professional manner and quickly released a fixed version of the affected 
  product.
