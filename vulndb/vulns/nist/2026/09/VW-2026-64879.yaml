title: alsa-lib through 1.2.16.1 computes combined topology element size using 
  32-bit arithmetic in src/topology/ctl.c, allowing integer overflow that 
  defeats bounds checks. Attackers can supply crafted topology files that wrap 
  size calculations, causing the decoder to read beyond the topology buffer and 
  potentially leak sensitive data or crash the application.
