title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost-vdpa:
  don't install the eventfd_ctx_fdget() error in config_ctx\n\nvhost_vdpa_set_config_call()
  swaps the eventfd_ctx_fdget() return value\ninto v->config_ctx before checking it,
  so on failure the field briefly\nholds an ERR_PTR:\n\n\tctx = fd == VHOST_FILE_UNBIND
  ? NULL : eventfd_ctx_fdget(fd);\n\tswap(ctx, v->config_ctx);\n\n\tif (!IS_ERR_OR_NULL(ctx))\n\
  \t\teventfd_ctx_put(ctx);\n\n\tif (IS_ERR(v->config_ctx)) {\n\t\tlong ret = PTR_ERR(v->config_ctx);\n\
  \n\t\tv->config_ctx = NULL;\n\t\treturn ret;\n\t}\n\nCommit 0bde59c1723a (\"vhost-vdpa:
  set v->config_ctx to NULL if\neventfd_ctx_fdget() fails\") added that clearing,
  and spelled out the\ninvariant the rest of the file relies on: \"we consider 'v->config_ctx'\n\
  valid if it is not NULL\".  The window between the swap and the clearing\nstill
  breaks it.  vhost_vdpa_config_cb() only tests for NULL, so a config\ninterrupt delivered
  inside the window hands the ERR_PTR to\neventfd_signal().\n\nCheck the fd befor"
