title: "The mcumgr SMP settings-management group handlers settings_mgmt_read(), settings_mgmt_write(),
  and settings_mgmt_delete() in subsys/mgmt/mcumgr/grp/settings_mgmt/src/settings_mgmt.c
  allocate a key_name buffer (and, for read, a data buffer) via k_malloc() when CONFIG_MCUMGR_GRP_SETTINGS_BUFFER_TYPE_HEAP
  is enabled, relying on the end: label to k_free() them. When CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK
  is also enabled and the application access hook rejects a request by returning status
  MGMT_CB_ERROR_RC, the handler executed return ret_rc; directly, bypassing end: and
  leaking the heap allocation on every rejected request.\n\nThe settings handlers
  are reachable over the unauthenticated SMP transport (Bluetooth LE, UART, or UDP,
  depending on product configuration). The access hook is the mechanism applications
  use to deny unauthorized settings access, and MGMT_CB_ERROR_RC is a common rejection
  style, so an attacker who can send settings read/write/delete commands that the
  hook rejects trigge"
