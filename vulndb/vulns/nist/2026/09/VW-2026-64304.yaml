title: Lantronix SLC8000 before firmware v9.7.0.3, EMG8500/EMG7500 before 
  firmware v9.7.0.1, and all firmware versions of SLB882/SLCx-03/SLCx-02 contain
  a command injection vulnerability that allows authenticated attackers with the
  services permission to execute arbitrary shell commands as root by exploiting 
  the set script schedule command that passes unsanitized user input to a 
  system() call. Attackers with the services permission can authenticate to the 
  terminal or CLI interface and inject malicious commands through the 
  unsanitized parameter to achieve complete loss of confidentiality, integrity, 
  and availability on the affected device and potentially impact downstream 
  serial-attached devices.
