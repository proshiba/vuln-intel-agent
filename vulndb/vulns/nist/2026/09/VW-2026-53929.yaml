title: The Pods  WordPress plugin before 3.3.9.2 does not restrict which 
  functions a display callback may resolve to, allowing users with the author 
  role and above to read arbitrary files from the server, including files 
  outside the web root. Only sites using the restricted display-callback mode 
  are affected, which is the automatic default on installations whose first Pods
  version predates 3.1.
