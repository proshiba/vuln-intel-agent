title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvsock/virtio:
  flush works in dependency order\n\nvirtio_vsock_remove() stops the virtqueues and
  then flushes each work\nitem before freeing the enclosing virtio_vsock.  The current
  order does\nnot account for dependencies between those items: tx_work may queue\n\
  send_pkt_work, and send_pkt_work may queue rx_work.\n\nIn particular, send_pkt_work
  can set restart_rx and release tx_lock.\nThe remove path can then stop the queues
  and flush rx_work before\nsend_pkt_work queues it.  Although the later send_pkt_work
  flush waits\nfor that producer to finish, nothing waits for the newly queued rx_work,\n\
  so kfree(vsock) can race with it.\n\nKASAN reported:\n\n  BUG: KASAN: slab-use-after-free
  in\n  virtio_transport_rx_work+0x487/0x4b0\n  Read of size 8 at addr ffff888114c2b008
  by task kworker/1:1/47\n  Workqueue: virtio_vsock virtio_transport_rx_work\n  Call
  Trace:\n   virtio_transport_rx_work+0x487/0x4b0\n   process_one_work+0x688/0x1120\n\
  \   worker_t"
