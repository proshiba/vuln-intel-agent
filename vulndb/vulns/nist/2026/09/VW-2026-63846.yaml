title: A vulnerability was identified in Omega Solution HRM OS up to 20260717. 
  The affected element is an unknown function of the file 
  /role-permission/permission of the component Role Permission Retrieval 
  Endpoint. Such manipulation of the argument roleId leads to improper control 
  of resource identifiers. The attack can be launched remotely. The exploit is 
  publicly available and might be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
