title: Authorised users of outside applications behind the same corporate 
  identity provider (IdP), for example, a wiki, a ticketing system, an expenses 
  tool, or anything they legitimately hold an account on can log into their 
  system via SAML SSO. The IdP issues an assertion to them. If that assertion is
  presented to NeuVector, NeuVector accepts it because the only thing 
  distinguishing "an assertion for NeuVector" from "an assertion for the wiki" 
  is the element, and the `NotInAudience` warning that reports the mismatch is 
  never read.
