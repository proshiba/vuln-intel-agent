title: "Lemonldap::NG::Portal versions from 2.23.0 before 2.23.4 for Perl allow a
  PKCE bypass for public Relying Parties in \"PKCE or secret\" mode because checkEndPointAuthenticationCredentials
  does not verify the client secret.\n\nWith oidcRPMetaDataOptionsRequirePKCE set
  to 2, the authorization endpoint issues a code even when the request carries no
  code_challenge, and token() admits the exchange as long as a challenge was stored
  or an authentication method was returned for the caller. checkEndPointAuthenticationCredentials()
  skips the secret comparison for a Relying Party marked public and still returns
  the method deduced from the request, so any Basic or form credential satisfies the
  secret branch. validatePKCEChallenge() then passes, because neither a challenge
  nor a verifier is present.\n\nAn attacker who intercepts an authorization code issued
