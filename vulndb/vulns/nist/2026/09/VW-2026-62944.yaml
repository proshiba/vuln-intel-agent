title: redis-parser through 3.0.0 contains a denial of service vulnerability in 
  the RESP protocol parser that allows malicious Redis endpoints to crash the 
  client process through unbounded recursion on nested arrays. Attackers can 
  send crafted RESP byte streams with repeated array headers that exhaust the V8
  call stack, causing an uncaught RangeError that terminates the Node.js process
  without triggering error handling callbacks.
