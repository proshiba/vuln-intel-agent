title: 'Vulnerability in the Siebel CRM Cloud Applications product of Oracle Siebel
  CRM (component: Siebel Cloud Manager).  Supported versions that are affected are
  22.3-26.7. Easily exploitable vulnerability allows low privileged attacker with
  network access via HTTP to compromise Siebel CRM Cloud Applications.  While the
  vulnerability is in Siebel CRM Cloud Applications, attacks may significantly impact
  additional products (scope change).  Successful attacks of this vulnerability can
  result in  unauthorized update, insert or delete access to some of Siebel CRM Cloud
  Applications accessible data as well as  unauthorized read access to a subset of
  Siebel CRM Cloud Applications accessible data. CVSS 3.1 Base Score 6.4 (Confidentiality
  and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:N).'
