title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  defer qdisc freeing after failed creation\n\nAn RTM_NEWQDISC request can make clsact
  bind a populated shared ingress\nblock during ->init(), publishing an embedded mini_Qdisc
  to lockless\nreaders.  If the same request has an invalid TCA_RATE, estimator setup\n\
  fails after ->init(); the unwind removes the pointer but synchronously\nfrees its
  containing qdisc while tc_run() may still hold it.\n\nRetire failed qdiscs through
  the same RCU helper as normal destruction.\nInline the synchronous free into the
  callback now that no direct callers\nremain."
