title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-cgroup:
  fix leaks and online flag on radix_tree_insert failure\n\nWhen radix_tree_insert()
  fails in blkg_create(), the error path has two\nissues:\n\n1. blkg->online is set
  to true unconditionally, even when the blkg was\n   never fully inserted.  Move
  the assignment inside the success block.\n\n2. The error path calls blkg_put() without
  first calling\n   percpu_ref_kill().  Because the refcount is still in percpu mode,\n\
  \   percpu_ref_put() only does this_cpu_sub() without checking for zero,\n   so
  blkg_release() is never triggered.  This permanently leaks the\n   blkg memory,
  its percpu iostat, policy data, the parent blkg\n   reference, and the cgroup css
  reference — the latter preventing the\n   cgroup from ever being destroyed.\n\n\
  Fix by replacing blkg_put() with percpu_ref_kill(), matching the pattern\nused in
  blkg_destroy()."
