title: A security vulnerability has been detected in Trusted Domain Project 
  OpenDMARC up to 1.4.2. This impacts an unknown function of the file 
  libopendmarc/opendmarc_policy.c of the component DMARC Parser. The 
  manipulation of the argument pct leads to integer overflow. Remote 
  exploitation of the attack is possible. The exploit has been disclosed 
  publicly and may be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
