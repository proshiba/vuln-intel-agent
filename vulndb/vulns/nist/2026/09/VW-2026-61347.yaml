title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix infinite loop in pcpu_freelist push with one possible CPU\n\n__pcpu_freelist_push()
  can loop forever when only one CPU is possible\nand an NMI re-enters pcpu_freelist_push()
  while the interrupted context\nholds that CPU's freelist lock.\n\nAfter the current-CPU
  fast path fails, the fallback loop walks\ncpu_possible_mask while skipping the current
  CPU. With CONFIG_SMP=n, or\nwhen an SMP kernel is limited to one possible CPU with
  nr_cpus=1 or\npossible_cpus=1, there are no other possible CPUs to examine. The
  loop\ntherefore makes no lock acquisition attempt and can never make progress.\n\
  \nThe following stack was observed on a UP system:\n\n  NMI context:\n    pcpu_freelist_push\n\
  \    free_htab_elem\n    htab_map_delete_elem\n    [perf-event BPF program]\n  \
  \  __perf_event_overflow\n    perf_event_nmi_handler\n    exc_nmi\n\n  Interrupted
  context:\n    __pcpu_freelist_push\n    pcpu_freelist_push\n    free_htab_elem\n\
  \    htab_map_delete_ele"
