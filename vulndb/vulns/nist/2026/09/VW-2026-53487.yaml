title: UpSignOn for Windows before 7.19.0 contains an insecure credential 
  storage vulnerability that allows local attackers to retrieve the biometric 
  unlock key stored in the Windows PasswordVault API without triggering any 
  authentication prompt. Attackers can access the stored biometric key from a 
  standard local process within the same Windows session to decrypt the 
  protected vault files and export the entire password manager contents in 
  cleartext.
