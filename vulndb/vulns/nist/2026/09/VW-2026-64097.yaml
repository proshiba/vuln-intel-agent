title: "The Espressif ESP-hosted Wi-Fi driver (drivers/wifi/esp_hosted/) parses frames
  received over SPI from the ESP co-processor in esp_hosted_event_task(). For control
  frames it took the 16-bit TLV field data_length straight off the wire and passed
  it to pb_istream_from_buffer(frame.data_value, frame.data_length) without checking
  it against the frame length or the receive buffer. frame.data_value sits 26 bytes
  into a 3188-byte stack object, so a data_length of up to 0xFFFF makes pb_decode()
  read up to roughly 62 KB past the end of that object.\n\nOnly the first fragment
  of a fragmented control response carries a TLV header; the pre-fix driver performed
  half-duplex SPI transactions and silently discarded any frame the co-processor queued
  while the host was transmitting (esp_hosted_hal_spi_transfer() aliased the RX buffer
  onto the TX buffer). When the discarded frame is the first fragment of a fragmented
  response, the driver treats the next fragment as a new frame — its per-fragment
