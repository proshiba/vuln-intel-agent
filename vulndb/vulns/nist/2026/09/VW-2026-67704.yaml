title: Fumasoft Fumeng Cloud contains a SQL injection vulnerability in the 
  AjaxMethod.ashx endpoint that allows unauthenticated remote attackers to 
  inject arbitrary SQL through the Name parameter of the getEmpByname action 
  without any authentication. Attackers can exploit UNION-based SQL injection 
  techniques against the Microsoft SQL Server backend to extract, disclose, and 
  modify database contents, with potential for further compromise of the 
  underlying server. Exploitation evidence was first observed by the 
  Shadowserver Foundation on 2023-10-18.
