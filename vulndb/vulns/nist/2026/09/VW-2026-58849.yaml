title: A vulnerability was detected in jaygajera17 E-commerce-project-springBoot
  up to 5e74a46b4b70623d0e4a0c9c4aee3bd1777185d2. The impacted element is the 
  function UserController.updateUser of the file UserController.java. Performing
  a manipulation of the argument userid results in authorization bypass. It is 
  possible to initiate the attack remotely. The exploit is now public and may be
  used. This product is using a rolling release to provide continious delivery. 
  Therefore, no version details for affected nor updated releases are available.
  The pull request to fix this issue awaits acceptance.
