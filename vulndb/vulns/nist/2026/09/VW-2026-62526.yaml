  received PDU to the opcode handlers without\never looking at wc->byte_len, the number
  of bytes the HCA actually placed\nin the receive descriptor. The handlers then copy
  that many bytes - the\ndata-segment length the initiator declared in the BHS\n(ntoh24(hdr->dlength),
  via the derived unsol_data_len / imm_data_len) -\nout of the fixed-size descriptor:\n\
  \n  isert_handle_iscsi_dataout():\n        sg_copy_from_buffer(sg_start, sg_nents,
