title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: ucsi: unregister debugfs entries on teardown\n\nucsi_register() creates per-instance
  debugfs entries, but\nucsi_unregister() keeps them around until ucsi_destroy().\n\
  \nDrivers like ucsi_glink that unregister/register the same UCSI\ninstance across
  remoteproc restart then try to create an already\nexisting debugfs directory and
  log:\n\n  debugfs: 'pmic_glink.ucsi.0' already exists in 'ucsi'\n\nUnregister debugfs
  entries as part of ucsi_unregister(), and\nclear ucsi->debugfs after freeing it
  so repeated unregister\npaths remain safe."
