title: The Product Filter for WooCommerce by WBW plugin for WordPress is 
  vulnerable to Reflected Cross-Site Scripting via the 'wpf_fid' parameter in 
  all versions up to, and including, 3.4.2 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that execute if they can 
  successfully trick a user into performing an action such as clicking on a 
  link. Exploitation requires the crafted request to target a page where a 
  filter using the vulnerable recalculation output is present.
