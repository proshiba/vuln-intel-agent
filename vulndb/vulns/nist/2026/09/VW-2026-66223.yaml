title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/qaic:
  Address potential out-of-bounds read in resp_worker()\n\nAlthough 'commit 2feec5ae5df7
  (\"accel/qaic: Handle DBC deactivation if the\nowner went away\")' fixes the scenario
  it was intended for by walking the\nmessage and only decoding QAIC_TRANS_DEACTIVATE_FROM_DEV,
  if present, it\nskipped over the bounds checking code that is included in decode_message().\n\
  This could lead to issues such as reading past the slab allocation's end,\ninfinite
  loops or kernel panics. For those issues to happen, a malformed\nwire message is
  needed to be sent from the device.\n\nInstead of duplicating the bounds checking
  code already present in\ndecode_message(), use the function inside resp_worker()."
