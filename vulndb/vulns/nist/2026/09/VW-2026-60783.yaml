title: 'Vulnerability in the Siebel Apps - Life Sciences product of Oracle Siebel
  CRM (component: eDetailing).  Supported versions that are affected are 17.0-26.7.
  Easily exploitable vulnerability allows unauthenticated attacker with network access
  via HTTP to compromise Siebel Apps - Life Sciences.  Successful attacks require
  human interaction from a person other than the attacker. Successful attacks of this
  vulnerability can result in  unauthorized creation, deletion or modification access
  to critical data or all Siebel Apps - Life Sciences accessible data as well as  unauthorized
  access to critical data or complete access to all Siebel Apps - Life Sciences accessible
  data. CVSS 3.1 Base Score 8.1 (Confidentiality and Integrity impacts).  CVSS Vector:
  (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N).'
