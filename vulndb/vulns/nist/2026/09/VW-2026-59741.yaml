title: "A security vulnerability exists in the Sealed Secrets controller's unauthenticated
  POST endpoints. By submitting a modified payload containing custom Go template logic
  in spec.template.data, an attacker with internal network access can abuse the handler
  as a decryption oracle to recover the full plaintext of any sealed secret.\n\n\n\
  \nThe POST /v1/verify and /v1/rotate handlers call Unseal() to decrypt target secrets,
  then render any Go templates found in spec.template.data.* using the decrypted payload
  as the evaluation context (pkg/apis/sealedsecrets/v1alpha1/sealedsecret_expansion.go).
  Errors encountered during template execution are directly reflected in the resulting
  HTTP response status codes.\n\n\n\nMissing AEAD label binding: the spec.template.data
  field is omitted from the AEAD authenticated-data label binding ciphertext to metadata.
  As a result, an attacker can copy a target's valid metadata and encryptedData verbatim,
  satisfying AEAD decryption and label validation, while freely repl"
