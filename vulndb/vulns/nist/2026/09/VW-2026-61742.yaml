title: A vulnerability was determined in ChangeWeDer crm up to 
  c07bd4c97141521af6475034bc58523beed51bbd. This vulnerability affects unknown 
  code of the file src/main/resources/public/js/customerServe/customer.serve.js 
  of the component Save Endpoint. This manipulation of the argument customerName
  causes cross site scripting. Remote exploitation of the attack is possible. 
  The exploit has been publicly disclosed and may be utilized. This product 
  follows a rolling release approach for continuous delivery, so version details
  for affected or updated releases are not provided. The project was informed of
  the problem early through an issue report but has not responded yet.
