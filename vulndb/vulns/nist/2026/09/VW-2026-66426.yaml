title: A vulnerability was identified in krayin laravel-crm up to 2.2.5. This 
  vulnerability affects the function ConfigurationForm::rules of the file 
  packages/Webkul/Admin/src/Http/Requests/ConfigurationForm.php of the component
  Upload Functionality. The manipulation leads to cross site scripting. The 
  attack is possible to be carried out remotely. The exploit is publicly 
  available and might be used. Upgrading to version 2.2.6 is able to resolve 
  this issue. The identifier of the patch is 
  b9836530ec9f5ef0f51653bb0cbbc47ef7184f51. It is advisable to upgrade the 
  affected component.
