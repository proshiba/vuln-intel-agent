title: The cisco_firesight_manager_ACL_rule_export module in misp-modules 
  generates a shell script (.sh) that authenticates to and calls the Cisco 
  fireSIGHT Manager API. The module interpolates configuration values (IP 
  address, login, password, domain ID, policy ID) and MISP attribute values 
  (destination IPs, URLs, event info comments) directly into single-quoted shell
  string assignments without any escaping or sanitization. Because the values 
  are placed inside single-quoted shell strings, any value containing a 
  single-quote character (e.g., a crafted ip-dst or url attribute value 
  submitted to MISP) breaks out of the quoting context, allowing an attacker to 
  inject arbitrary shell commands into the exported script. A security analyst 
  who subsequently executes the generated .sh file unmodified would run the 
  injected commands with their own privileges, potentially exposing fireSIGHT 
