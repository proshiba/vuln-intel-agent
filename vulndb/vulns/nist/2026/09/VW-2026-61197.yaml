title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  only redirty pinned folios in redirty_blocks\n\nredirty_blocks() pins folios with
  read_cache_folio() and then walks the\nsame range again with filemap_lock_folio()
  to redirty them and drop the\nreferences it took.\n\nCommit 5951fee46bef (\"f2fs:
  Use a folio in redirty_blocks()\") changed\nthe second pass to a do/while loop.
  If read_cache_folio() fails before\nanything is pinned, page_idx does not advance
  but the cleanup loop still\nruns once.\n\nIf readahead has already populated the
  failed folio in page cache, that\nextra iteration finds it and folio_put_refs(folio,
  2) drops one\nreference too many. Later drop_caches or reclaim can then report\n\
  \"BUG: Bad page state\".\n\nOnly redirty the range that was pinned successfully."
