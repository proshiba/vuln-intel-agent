title: Flowable flowable-engine through 8.0.0 contains an XML external entity 
  injection vulnerability in ProcessDiagramLayoutFactory.parseXml() that fails 
  to disable external entity resolution when parsing deployed BPMN resources. 
  Attackers with process deployment privileges can embed DOCTYPE declarations 
  with external entities in BPMN files to read arbitrary local files or trigger 
  requests to internal network endpoints when diagram layout is computed.
