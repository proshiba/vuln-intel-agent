title: A vulnerability has been found in DataEase up to 2.10.25/2.10.26. 
  Affected by this issue is the function buildTooltip of the file 
  core/core-frontend/src/views/chart/components/js/panel/charts/map/symbolic-map.ts
  of the component Symbolic Map. Such manipulation of the argument 
  canvasViewInfo[*].customAttr.tooltip.backgroundColor leads to cross site 
  scripting. The attack may be performed from remote. The project was informed 
  of the problem early through an issue report but has not responded yet.
