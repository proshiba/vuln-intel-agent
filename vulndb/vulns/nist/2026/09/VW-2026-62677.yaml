title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  asus-wmi: fix resource leaks on probe failure\n\nDuring driver initialization in
  asus_wmi_add(), various subsystems are\nregistered sequentially. However, the error
  path labels are out of order\nrelative to the registration sequence.\n\nSpecifically:\n\
  1. If asus_wmi_custom_fan_curve_init() fails, the driver jumps to\n   fail_custom_fan_curve.
  Because this label is placed below fail_sysfs,\n   it bypasses the cleanup calls
  for the input device and sysfs groups,\n   which were successfully registered before,
  leaking those resources.\n2. If asus_screenpad_init() fails, the driver jumps to
  fail_screenpad.\n   Because fail_screenpad is placed below fail_backlight, it bypasses
  the\n   cleanup calls for backlight and rfkill, leaking those resources.\n\nFix
  these resource leaks by reordering the error path labels in\nasus_wmi_add() to match
  the exact reverse order of the resource\nallocations."
