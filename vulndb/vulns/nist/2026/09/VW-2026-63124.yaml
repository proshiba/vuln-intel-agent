title: A flaw was found in Netty. SpdySessionHandler accepts an unlimited number
  of concurrent remote-initiated streams because localConcurrentStreams defaults
  to Integer.MAX_VALUE and the handler provides no API to change it. A remote 
  peer can open a SPDY connection and send a large number of SYN_STREAM frames 
  with FLAG_FIN=0, causing unbounded heap and direct memory allocation that can 
  lead to JVM OutOfMemoryError and a denial of service.
