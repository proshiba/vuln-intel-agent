title: Chatbot UI contains an authorization bypass vulnerability in the 
  retrieval endpoint that allows authenticated attackers to access private file 
  content belonging to other users by supplying arbitrary file UUIDs. The 
  endpoint uses a service-role Supabase client that bypasses row-level security 
  and fails to validate file ownership, enabling attackers to retrieve indexed 
  content chunks from victim files through crafted POST requests.
