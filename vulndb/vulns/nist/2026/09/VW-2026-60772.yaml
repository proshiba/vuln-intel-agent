title: 'Vulnerability in the PeopleSoft Enterprise PeopleTools product of Oracle PeopleSoft
  (component: SQR).  Supported versions that are affected are 8.61-8.63. Easily exploitable
  vulnerability allows low privileged attacker with network access via HTTP to compromise
  PeopleSoft Enterprise PeopleTools.  Successful attacks of this vulnerability can
  result in  unauthorized access to critical data or complete access to all PeopleSoft
  Enterprise PeopleTools accessible data and unauthorized ability to cause a hang
  or frequently repeatable crash (complete DOS) of PeopleSoft Enterprise PeopleTools.
  CVSS 3.1 Base Score 8.1 (Confidentiality and Availability impacts).  CVSS Vector:
