title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix missing metadata reservation for large xattrs\n\n[BUG]\nlsetxattr() panics the
  kernel when setting a large xattr value on a\nfragmented filesystem where the file
  already has an external xattr\nblock.\n\n[CAUSE]\nocfs2_calc_xattr_set_need() never
  reserves metadata blocks for a new\nxattr value's extent tree when the file already
  has an external xattr\nblock. The not_found path leaves meta_add at zero, so meta_ac
  is NULL\nwhen ocfs2_xattr_extend_allocation() runs.\n\nA new value root has room
  for a single extent record. On a fragmented\nfilesystem, the allocator cannot satisfy
  the xattr value in one\ncontiguous run, so each non-contiguous run requires its
  own extent\nrecord. When the value root's extent list is full and meta_ac is NULL,\n\
  ocfs2_add_clusters_in_btree() returns RESTART_META, and\nocfs2_xattr_extend_allocation()
  hits BUG_ON(why == RESTART_META).\n\n[FIX]\nThe case where no xattr block exists
  yet already calls\nocfs2_e"
