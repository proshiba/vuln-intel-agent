title: Kaneo versions 2.3.12 before 2.12.2 contain a missing authorization 
  vulnerability that allows authenticated workspace members with viewer or 
  member roles to delete and modify tasks beyond their assigned permissions by 
  exploiting the bulk task endpoint that omits workspace permission checks. 
  Attackers can send requests to the PATCH /api/task/bulk endpoint, which 
  verifies only workspace membership without calling the role-based permission 
  check enforced on all other task endpoints, to permanently delete all tasks or
  modify task status, priority, assignee, due date, and labels in a workspace.
