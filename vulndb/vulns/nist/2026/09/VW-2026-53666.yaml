title: "MISP contains a reflected Cross-Site Scripting (XSS) vulnerability in the
  event attribute filtering query builder. The taggedAttributes and galaxyAttachedAttributes
  URL parameters were inserted into the query-builder rules without HTML escaping
  before being serialized as JSON and embedded inside a <script> element.\n\n\nBecause
  JsonTool::encode() uses JSON_UNESCAPED_SLASHES, an attacker-controlled value containing
  a closing </script> sequence could terminate the surrounding script element and
  inject arbitrary HTML or JavaScript. For example, a specially crafted viewEventAttributes
  URL could contain malicious content in one of the affected filter parameters.\n\n\
  \nAn attacker could exploit the vulnerability by convincing an authenticated MISP
