title: "Improper Handling of Case Sensitivity vulnerability in Erlang/OTP inets httpd
  allows a remote unauthenticated attacker to read files inside a mod_auth protected
  directory by requesting them with different casing, on deployments whose filesystem
  is case-insensitive.\n\nmod_auth:secret_path/3 decides whether a resolved filesystem
  path lies inside a protected directory block by running the configured directory
  path through re:run/3 without the caseless option. A request for /secret/file against
  a directory configured as /Secret therefore does not match, so the request is treated
  as unprotected and no authentication challenge is issued, while the filesystem resolves
  the differently cased path to the same file and mod_get serves it. Deployments on
  case-sensitive filesystems are unaffected, because there the filesystem itself rejects
  the mismatched casing.\n\nThis issue affects OTP from OTP 17.0 before OTP 27.3.4.17,
  from OTP 28.0 before OTP 28.5.0.6, and from OTP 29.0 before OTP 29.0.6, corresp"
