title: A weakness has been identified in embedded-graphics up to 0.8.2 on 
  32-bit. Impacted is the function ImageRaw::new/bytes_per_row of the file 
  src/image/image_raw.rs. This manipulation causes integer overflow. The attack 
  is possible to be carried out remotely. Upgrading the affected component is 
  recommended. The project was informed of the problem early through an issue 
  report but has not responded yet.
