title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  hhf: clamp quantum in change and init paths\n\nhhf_change() accepts any quantum
  from userspace, including 1. With a\ncrafted size table qdisc_pkt_len reaches ~2
  GiB, so quantum=1 makes\nthe deficit-refill loop spin ~2^31 times under the qdisc
  lock\n(a soft lockup / denial of service).\n\nAdd max(256U, ...) in hhf_change()
  matching fq_codel_change(). Clamp\nhhf_init() to [256, 1<<20] matching the siblings,
  and remove the old\nfallback that only set quantum=256 on overflow.\n\nConditions
  to recreate the bug:\n  CONFIG_NET_SCH_HHF=y. Requires CAP_NET_ADMIN (namespace-local
  via\n  unshare -Urn suffices).\n\n  tc qdisc add dev dummy0 root hhf\n  tc qdisc
  change dev dummy0 root hhf quantum 1 stab data 32768 size_log 15 cell_log 0"
