title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix dangling pointer in plane reset function\n\namdgpu_dm_plane_drm_plane_reset()
  frees the old state before allocating\na new one. If kzalloc() fails, the function
  returns without updating\nthe state pointer, leaving a dangling pointer to already
  freed memory.\n\nFix this by allocating the new state first. On allocation failure,
  the\nold state remains untouched and the function safely returns.\n\nFound by Linux
  Verification Center (linuxtesting.org) with SVACE.\n\n[adjust for movement around
  current amd-staging-drm-next]"
