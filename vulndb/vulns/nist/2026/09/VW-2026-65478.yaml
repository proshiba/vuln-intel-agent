title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rsi: validate beacon length before fixed buffer copy\n\nrsi_prepare_beacon() copies
  the mac80211 beacon frame after\nFRAME_DESC_SZ into a management skb whose usable
  tailroom may be smaller\nthan MAX_MGMT_PKT_SIZE after alignment.\n\nValidate the
  beacon length against the actual tailroom before the copy\nand skb_put(). Leave
  ownership of the management skb with the caller on\nerror, matching the existing
  rsi_send_beacon() cleanup path."
