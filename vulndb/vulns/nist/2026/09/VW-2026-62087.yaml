title: SGLang through 0.5.19 in prefill/decode disaggregation mode contains an 
  unauthenticated PUT /route endpoint on the prefill bootstrap service that 
  allows attackers to poison the KV transfer routing table. Attackers can supply
  arbitrary rank_ip and rank_port values to redirect decode workers to 
  attacker-controlled endpoints, causing denial of service or disclosure of KV 
  transfer metadata including session identifiers and tensor-parallel topology 
  parameters.
