title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  cap decoded POSIX ACL count to bound sort cost\n\nnfsd4_decode_posixacl() reads
  a u32 entry count off the wire and passes\nit straight to posix_acl_alloc() and
  sort_pacl_range(). The latter is\nan O(n^2) bubble sort, so a client-chosen count
  drives unbounded CPU in\nthe server's compound processing path.\n\n    nfsd4_decode_posixacl()\n\
  \      xdr_stream_decode_u32(&count)       /* uncapped u32 */\n      posix_acl_alloc(count,
  GFP_KERNEL)\n      sort_pacl_range(*acl, 0, count - 1) /* O(n^2) bubble sort */\n\
  \nThe encoder side in the same file already rejects ACLs whose a_count\nexceeds
  NFS_ACL_MAX_ENTRIES, but the decoder introduced in commit\n5fc51dfc2eb1 (\"NFSD:
  Add support for XDR decoding POSIX draft ACLs\")\nomitted the symmetric check.\n\
  \nFix by rejecting a wire count greater than NFS_ACL_MAX_ENTRIES with\nnfserr_inval,
  before any allocation, so the sort is bounded by\nNFS_ACL_MAX_ENTRIES^2 comparisons.\n\
