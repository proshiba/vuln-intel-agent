title: Acrobat Reader versions 24.001.30264, 20.005.30793, 25.001.20982, 
  24.001.30273, 20.005.30803 and earlier are affected by an Untrusted Search 
  Path vulnerability that might allow attackers to execute arbitrary code in the
  context of the current user. If the application uses a search path to locate 
  critical resources such as programs, an attacker could modify that search path
  to point to a malicious program, which the targeted application would then 
  execute. Exploitation of this issue requires user interaction in that the user
  needs to open a malicious file.
