title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix sleepable check for tracing/lsm prog\n\nWhen CONFIG_FUNCTION_ERROR_INJECTION
  is disabled, a sleepable tracing prog\nis allowed to attach to '__x64_'-alike prefix
  symbols.\n\nIt is because the verifier does not verify whether the symbol is a kernel\n\
  function or a bpf prog. That said, a sleepable tracing prog is allowed to\nattach
  to a bpf prog target whose name has '__x64_'-alike prefix.\n\nFor example, a sleepable
  fentry prog attaches to a '__x64_sys_nop' XDP\nprog, and copies buffer from a user
  pointer with bpf_copy_from_user()\nhelper. After attaching the XDP prog to lo interface,
  the kernel BUG\ncould be triggered by 'ping -c 1 -W 1 127.0.0.1':\n\n[    3.460756]
  BUG: sleeping function called from invalid context at kernel/bpf/trampoline.c:1324\n\
  \nFix it by disallowing sleepable prog always when its target\nbtf is not a kernel's
  btf."
