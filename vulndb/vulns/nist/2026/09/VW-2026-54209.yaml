title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/packet:
  defer vmalloc TX_RING free until skbs finish\n\nAF_PACKET TX_RING skbs keep a raw
  pointer to their ring frame. The skb\npage references preserve page-backed ring
  blocks after pg_vec is freed,\nbut they do not preserve a vmalloc mapping.\n\ntpacket_destruct_skb()
  currently drops the pending reference before\nwriting the timestamp and TP_STATUS_AVAILABLE
  to the frame. Move the\ndecrement after those stores. The smp_wmb() in __packet_set_status()\n\
  orders the frame stores before the decrement.\n\nAlso recheck pending TX frames
  under pg_vec_lock before non-closing\nring replacement, so a racing send cannot
  add a pending skb between\nthe initial check and the ring swap.\n\nRing allocation
  can produce a mixture of page-backed and vmalloc-backed\nblocks. Allocate deferred-work
  storage during TX ring setup when the\nfirst vmalloc-backed block is encountered,
  and keep its pointer in the\npg_vec allocation header. If allocation fails,"
