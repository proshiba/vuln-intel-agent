title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix FCE trace enable parsing in debugfs\n\nqla2x00_dfs_fce_write() called
  kstrtoul() with a NULL result pointer,\nso a successful parse would dereference
  NULL and oops. Worse, the int\nreturn value (0 on success, negative errno on failure)
  was assigned to\nthe unsigned long enable flag, inverting the intended logic: a
  valid\nnumber was treated as \"disable\" while a parse failure enabled FCE.\n\n\
  Parse the value into enable and propagate parse errors to userspace."
