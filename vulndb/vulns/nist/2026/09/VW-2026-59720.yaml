title: 'A vulnerability was determined in GPAC up to f1219cde. The affected element
  is the function gf_node_activate_ex of the file scenegraph/base_scenegraph.c. This
  manipulation causes stack-based buffer overflow. It is possible to launch the attack
  on the local host. The exploit has been publicly disclosed and may be utilized.
  Upgrading to version abi-16.23 is sufficient to fix this issue. Patch name: 9eb40df4448b88d6a6ce3454657c06f47eff0b24.
  The affected component should be upgraded.'
