title: Hugo is a static site generator. In versions after v0.123.0 and before 
  v0.165.0, symlinks in parent directories were not dropped during direct 
  resource lookups, allowing path confinement to be bypassed. An attacker who 
  can place — or who convinces a site author to place — a symlink inside a 
  mounted directory (for example, in a locally vendored theme under themes/) can
  cause functions that perform direct lookups, such as resources.Get and 
  os.ReadFile, to follow that symlink and read files outside the intended 
  project boundaries, disclosing their contents in the built site. Themes 
  mounted as Go modules fetched from GitHub have symlinks stripped on download 
  and are not affected, and multi-directory walks (e.g. content/asset walking) 
  are not affected. This issue is an incomplete-fix follow-up to 
  GHSA-c3wq-j5vh-68rc and GHSA-fw87-fv5r-9fpw; it is fixed in v0.165.0.
