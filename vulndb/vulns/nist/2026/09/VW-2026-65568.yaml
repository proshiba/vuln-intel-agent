title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal/drivers/tegra/soctherma:
  Switch to devm cooling device registration\n\nUse devm_thermal_of_cooling_device_register()
  to simplify resource\nmanagement and avoid manual cleanup in error paths.\n\nAs
  a side effect this change has the benefit of solving an existing\nissue. Before,
  the function tegra_soctherm_remove() only called\ndebugfs_remove_recursive() and
  never called thermal_cooling_device_unregister()\nfor any of the cooling devices
  registered here.\n\nAfter the driver removal, the thermal framework's cdev list
  would\nstill hold references to thermal_cooling_device objects whose devdata\npointer
  (ts) pointed to memory already freed by the platform device's\ndevm cleanup.\n\n\
  With this change, the cooling device is unregistered when the driver\nis removed,
  thus fixing the issue above."
