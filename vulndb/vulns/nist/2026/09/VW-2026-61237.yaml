title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rtl2832_sdr: use vb2_video_unregister_device() on remove to fix DMA leak\n\nrtl2832_sdr_remove()
  runs on USB disconnect and clears dev->udev to\nNULL before any pending streaming
  teardown has run. When user space\nlater closes its file descriptor, vb2 calls rtl2832_sdr_stop_streaming()\n\
  which in turn calls rtl2832_sdr_free_stream_bufs(). That helper releases\neach coherent
  buffer with:\n\n    usb_free_coherent(dev->udev, dev->buf_size,\n              \
  \        dev->buf_list[dev->buf_num],\n                      dev->dma_addr[dev->buf_num]);\n\
  \nusb_free_coherent() returns immediately when its dev argument is NULL,\nso every
  DMA stream buffer that was live at disconnect is silently\nleaked. The URBs allocated
  in rtl2832_sdr_alloc_urbs() outlive the\ndevice for the same reason.\n\nThe rtl2832_sdr
  driver uses vb2_fop_release() in its file_operations,\nso replace video_unregister_device(&dev->vdev)
  with\nvb2_video_unregister_device(&dev"
