title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/query:
  cap user size passed to copy_struct_to_user\n\nio_handle_query_entry() clamps hdr.size
  for the inbound copy_from_user()\nbut keeps the original user value as usize. copy_struct_to_user()
  uses\nthat usize and, when it is larger than the kernel result, clear_user()s\n\
  the trailing bytes.\n\nAs hdr.size is a __u32, a query can request nearly 4 GiB
  of zeroing,\nincluding on the error path where res_size stays 0. The interface is\n\
  reachable without a ring via IORING_REGISTER_QUERY.\n\nReject sizes larger than
  PAGE_SIZE, as recommended for copy_struct_*\ninterfaces."
