title: 'A vulnerability was detected in Webkul Bagisto up to 2.4.6/2.5.0-beta4. This
  impacts an unknown function of the file /admin/sales/invoices/mass-update/state
  of the component Invoice Mass Status Update. Performing a manipulation results in
  missing authorization. The attack can be initiated remotely. The exploit is now
  public and may be used. Upgrading to version 2.5.0-beta5 will fix this issue. The
  patch is named 2c34b94d0313824ce98efee8aef8ee141d9b89d0. It is recommended to apply
  a patch to fix this issue. The vendor confirms: "[W]e run continuous automated AI-assisted
  security scanning across the Bagisto codebase. The behaviour you describe has already
  been identified and reproduced internally, and it is actively being fixed rather
  than triaged from scratch."'
