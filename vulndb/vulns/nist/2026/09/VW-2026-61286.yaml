title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  nVMX: Service local TLB flushes on failed nested VM-Enter\n\nKVM services local
  TLB flushes on \"full\" nested VM-Exits (through\n__nested_vmx_vmexit()), but not
  if a nested VM-Enter fails (e.g. due to\nfailed VMCS checks in nested_vmx_enter_non_root_mode()).\n\
  \nHowever, it is possible that KVM had queued TLB flushes that need to be\nperformed,
  even if the nested VM-Enter was not successful. For example,\nif VPID is disabled
  for L2 (via nested_vmx_transition_tlb_flush(), or if\nvia the MSR load lists, as
  the SDM says:\n\n  If any MSR is being loaded in such a way that would architecturally\n\
  \  require a TLB flush, the TLBs are updated so that, after VM entry, the\n  logical
  processor will not use any translations that were cached before\n  the transition.\n\
  \nThe SDM is unclear about when the TLB flush should occur, and whether or\nnot
  a failed VM entry would flush the TLB, so it is safer to always\ndo the TLB flush
  in this case.\n\nMor"
