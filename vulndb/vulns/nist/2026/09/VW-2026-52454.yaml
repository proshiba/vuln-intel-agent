title: The Photo Gallery by Ays – Responsive Image Gallery plugin for WordPress 
  is vulnerable to generic SQL Injection via the 's' parameter in all versions 
  up to, and including, 6.8.2 due to insufficient escaping on the user supplied 
  parameter and lack of sufficient preparation on the existing SQL query. This 
  makes it possible for authenticated attackers, with administrator-level access
  and above, to append additional SQL queries into already existing queries that
  can be used to extract sensitive information from the database. The 
  vulnerability exists across two execution paths — $wpdb->get_var() in 
  record_count() and $wpdb->get_results() in 
  prepare_items()/get_image_categories() — enabling both blind and UNION-based 
  exfiltration techniques.
