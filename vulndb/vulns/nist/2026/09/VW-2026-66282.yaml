title: Espruino 2v29 (commit bffc6d0) contains a NULL pointer dereference 
  vulnerability in jslGetRawString() in src/jslex.c. Crafted raw/binary string 
  input can cause the lexer to pass a NULL iterator target to jsvLockAgain(). In
  RELEASE/NO_ASSERT builds, the missing assertion guard allows a write through 
  the NULL pointer, resulting in memory corruption and application termination 
  or denial of service.
