title: A vulnerability has been found in GPAC up to f1219cde. Impacted is the 
  function gf_node_get_name of the file scenegraph/base_scenegraph.c of the 
  component MP4Box. Such manipulation leads to use after free. The attack may be
  performed from remote. The exploit has been disclosed to the public and may be
  used. Upgrading to version abi-16.23 is recommended to address this issue. The
  name of the patch is 9eb40df4448b88d6a6ce3454657c06f47eff0b24. Upgrading the 
  affected component is advised.
