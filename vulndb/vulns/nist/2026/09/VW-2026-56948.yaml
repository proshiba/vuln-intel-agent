title: The Podlove Podcast Publisher plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting via 'episode_contributor[..][..][comment]' 
  Parameter in all versions up to, and including, 4.5.5 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with contributor-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. The contributor comment is stored in a plugin-managed custom 
  table, bypassing WordPress core's wp_kses_post filter, and the save_post hook 
  fires without a nonce check, meaning any user who can edit posts can exploit 
  this without further preconditions.
