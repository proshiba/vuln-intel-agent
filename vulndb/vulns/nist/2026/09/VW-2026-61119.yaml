title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  fix out-of-bounds read of INDEX_ROOT in reparse/objid init\n\nntfs_reparse_init()
  and ntfs_objid_init() parse the index root of the\n$Extend/$Reparse and $Extend/$ObjId
  metafiles (the INDEX_ROOT attributes\nnamed $R and $O). They read its type and rule
  fields through\nresident_data(), which does not check that the resident attribute
  is\nlarge enough to hold them.\n\nmi_enum_attr() accepts a resident attribute with
  data_off == asize and\ndata_size == 0. For such an attribute placed last in its
  MFT record,\nresident_data() returns a pointer to the end of the record_size buffer,\n\
  so reading root->type / root->rule reads past the allocation.\n\nUse resident_data_ex(attr,
  sizeof(struct INDEX_ROOT)) and bail out when\nit returns NULL, as ntfs_security_init()
  already does for $SDH / $SII.\n\nThe attribute is only parsed while mounting a crafted
  image, so this\nneeds CAP_SYS_ADMIN.\n\n BUG: KASAN: slab-out-of-bounds in ntfs_reparse_in"
