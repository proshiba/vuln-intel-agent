title: A flaw was found in 389 Directory Server. During SASL PLAIN 
  authentication, a stale identity carried in a Cyrus SASL auxiliary property 
  from a prior failed bind attempt can be installed on a connection following a 
  subsequent, unrelated successful bind, regardless of which SASL mechanism 
  completes that second bind. An attacker can send a SASL PLAIN bind as 
  cn=Directory Manager with an incorrect password, then complete a SASL 
  ANONYMOUS bind on the same connection, causing the server to grant Directory 
  Manager authority without any valid credentials. A variant using a valid 
  low-privileged account's own successful bind instead of an anonymous one is 
  also possible.
