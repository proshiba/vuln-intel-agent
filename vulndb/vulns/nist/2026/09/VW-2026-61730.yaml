title: Junrar is an open source Java RAR archive library. Prior to version 
  7.6.1, LocalFolderExtractor in 
  src/main/java/com/github/junrar/LocalFolderExtractor.java can create 
  directories outside the intended extraction root when processing a crafted 
  archive entry. LocalFolderExtractor.createFile() validates only the final 
  canonical file path, while LocalFolderExtractor.makeFile() creates 
  intermediate path segments with unchecked mkdir() calls. An entry can 
  therefore make the final path resolve inside the destination while causing 
  intermediate directory creation outside it, enabling filesystem pollution or 
  file-versus-directory squatting that can make later security-sensitive writes 
  fail. The demonstrated impact is directory creation, not unconditional 
  arbitrary file-content write. This issue is fixed in version 7.6.1.
