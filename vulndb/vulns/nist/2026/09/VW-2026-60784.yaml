title: 'Vulnerability in the Siebel Apps - Customer Order Management product of Oracle
  Siebel CRM (component: Order Management).  Supported versions that are affected
  are 17.0-26.7. Easily exploitable vulnerability allows low privileged attacker with
  network access via HTTP to compromise Siebel Apps - Customer Order Management.  Successful
  attacks require human interaction from a person other than the attacker and while
  the vulnerability is in Siebel Apps - Customer Order Management, attacks may significantly
  impact additional products (scope change). Successful attacks of this vulnerability
  can result in  unauthorized creation, deletion or modification access to critical
  data or all Siebel Apps - Customer Order Management accessible data as well as  unauthorized
  access to critical data or complete access to all Siebel Apps - Customer Order Management
  accessible data. CVSS 3.1 Base Score 8.7 (Confidentiality and Integrity impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N).'
