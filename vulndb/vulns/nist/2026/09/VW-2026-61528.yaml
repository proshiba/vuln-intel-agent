title: A flaw has been found in WuzhiCMS up to 4.1.0. The impacted element is 
  the function ckditor::saveRemote of the file 
  coreframe/app/attachment/index.php of the component Remote Image Fetch. This 
  manipulation of the argument source[] causes server-side request forgery. The 
  attack can be initiated remotely. The exploit has been published and may be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
