title: InvenTree is an Open Source Inventory Management System. Prior to 1.4.0, 
  PluginSettingList, PluginAllSettingList, and PluginSettingDetail set 
  GlobalSettingsPermissions without the IsAuthenticated permission used by the 
  project default and equivalent global-settings endpoints. 
  GlobalSettingsPermissions returns true for safe methods, while 
  AuthRequiredMiddleware exempts /api/ paths, so an unauthenticated caller can 
  retrieve plugin names, setting keys, descriptions, types, choices, and 
  non-protected configuration values through /api/plugin/settings/ and the 
  per-plugin settings endpoints. Protected secret values remain masked as three 
  asterisks, limiting the issue to metadata and non-secret configuration 
  disclosure. This issue is fixed in version 1.4.0.
