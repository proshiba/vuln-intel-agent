title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsamples/ftrace:
  Fix kthread_stop() on ERR_PTR in ftrace-direct-multi-modify\n\nftrace_direct_multi_init()
  assigns kthread_run()'s return value to\nsimple_tsk without an IS_ERR() check. When
  kthread_run() fails it\nreturns ERR_PTR(-ENOMEM), but init still returns 0, so the
  module loads\nwith simple_tsk holding an error pointer. On unload,\nftrace_direct_multi_exit()
  then passes that ERR_PTR to kthread_stop(),\nleading to a null-pointer-dereference.\n\
  \nCheck the return value of kthread_run() with IS_ERR(); on failure,\nunregister
  the ftrace direct call and propagate the error code."
