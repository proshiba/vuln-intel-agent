title: Hono is a Web application framework that provides support for any 
  JavaScript runtime. From 4.12.12 until 4.13.5, the fix released for 
  CVE-2026-39408 does not cover every traversal sequence, and toSSG() can still 
  write files outside the configured output directory when a route parameter 
  contains consecutive parent-directory segments. Static site generation builds 
  each output path from the route path and values supplied through ssgParams, 
  then verifies that the result stays inside the output directory using the same
  normalization routine that built the path. That routine does not fully 
  collapse runs of consecutive parent-directory segments, allowing a path that 
  the check accepts to resolve outside the output directory, and the check also 
  treats output directories that differ in how they are rooted as equivalent. 
