title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/isert:
  post the full-feature receive buffers after session registration\n\nisert_put_login_tx()
  posts the full-feature receive buffers before\n__transport_register_session() runs,
  so an initiator that does not wait\nfor the final Login Response can still have
  a SCSI command executed\nagainst an se_session whose se_tpg is NULL - the same oops
  as the\nprevious patch, at target_submit+0xbe.\n\nPost them from isert_get_rx_pdu(),
  which the previous patch already uses\nto send that response, and post them before
  that send: the receive queue\nis filled at the moment the initiator is told it may
  use it.  Allocating\nthere keeps the existing property that a memory allocation
  failure cannot\nhappen once the final Login Response is on the wire.\n\nThe receive
  queue is already empty between the final Login Request and\nisert_post_recvm();
  this moves the second point later, from a median of\n92 us to 172 us over 1200 logins.\
  \  Only an initiator"
