title: Obot before v0.23.0 contains a server-side request forgery vulnerability 
  in remote MCP server registration that allows privileged users to specify 
  arbitrary URLs without destination validation. Attackers with Power User or 
  higher roles can coerce Obot to make requests to internal services and cloud 
  metadata endpoints, reading responses in error messages to disclose sensitive 
  credentials.
