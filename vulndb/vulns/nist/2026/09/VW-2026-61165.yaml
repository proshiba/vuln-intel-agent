title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  fix scope of mqd_mgr dereference in pqm_debugfs_mqds\n\nReading /sys/kernel/debug/kfd/mqds
  while a process holds an active KFD\nqueue triggers a NULL pointer dereference because
  the for loop that\ncalls mqd_mgr->debugfs_show_mqd() is incorrectly placed outside
  the\nif (pqn->q) block that initializes mqd_mgr.\n\nThe queue list can contain entries
  where pqn->q is NULL (kernel queues\nwhere only pqn->kq is valid). In the original
  code:\n\n  if (pqn->q) {\n      ...\n      mqd_mgr = q->device->dqm->mqd_mgrs[mqd_type];\n\
  \      size = mqd_mgr->mqd_stride(...);\n  }\n\n  for (xcc = 0; xcc < num_xccs;
  xcc++) {  // WRONG: outside if block\n      mqd = q->mqd + size * xcc;\n      r
  = mqd_mgr->debugfs_show_mqd(m, mqd);\n  }\n\nWhen iterating over a queue node where
  pqn->q is NULL:\n1. The if (pqn->q) block is skipped\n2. mqd_mgr remains uninitialized
  (NULL from declaration)\n3. The for loop executes anyway\n4. mqd_mgr->debugfs_show_mqd(m,
  mqd"
