title: WWBN AVideo through commit c3edcc274c389816d434acadac07ee78eaf330c1 
  contains a reflected cross-site scripting vulnerability in the 
  showAlertMessage() function that inserts the raw Referer header into a 
  JavaScript comment without encoding. Attackers can craft a Referer header 
  containing */ to close the comment and inject arbitrary JavaScript that 
  executes in the site origin for visitors arriving from the attacker-controlled
  page.
