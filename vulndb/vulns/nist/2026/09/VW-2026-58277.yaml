title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenvswitch:
  only skb_tx_error() a packet we are about to drop\n\nqueue_userspace_packet() borrows
  the packet skb -- it only copies it into\na private netlink message (user_skb) and
  does not own it; on return\ndo_execute_actions() keeps forwarding it through the
  flow's remaining\nactions. Its error path nevertheless calls skb_tx_error(skb),
  which via\nskb_zcopy_clear() does skb_shinfo(skb)->flags &= ~SKBFL_ALL_ZEROCOPY,\n\
  stripping SKBFL_SHARED_FRAG from that live skb (skb_tx_error()'s kerneldoc\nsays
  \"skb must be freed afterwards\").\n\nFor a MSG_ZEROCOPY skb carrying page-cache
  frags, SKBFL_SHARED_FRAG is\nwhat makes esp_input() skb_cow_data() before in-place
  AEAD; once it is\nstripped a later local ESP-in-UDP delivery decrypts in place over
  pages\nthe sender does not own -- an unprivileged page-cache write (the\n\"Fragnesia\"\
  \ primitive).\ndo_execute_actions() ignores output_userspace()'s return value, so
  any\naction after a failed USE"
