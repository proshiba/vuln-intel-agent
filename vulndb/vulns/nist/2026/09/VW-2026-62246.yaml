title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix kmap_local_page() usage in compress\n\nSeveral compressed I/O paths discard
  the address returned by\nkmap_local_page() and later access or unmap the page using
  page_address().\nThis is invalid for highmem pages, and local mappings must also
  be unmapped\nusing the address returned by kmap_local_page().\n\nMap each destination
  page in ntfs_decompress() only while producing the\ncurrent sub-block. Use memcpy_from_page(),
  memcpy_to_page(), and\nmemzero_page() for the other page accesses. Remove unnecessary
  local\nmappings from ntfs_write_cb(), where pages are accessed through the vmap()\n\
  mapping."
