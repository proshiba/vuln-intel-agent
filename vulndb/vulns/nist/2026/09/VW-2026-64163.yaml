title: The Handily plugin for WordPress is vulnerable to unauthorized payment 
  settings modification due to missing authorization checks in all versions up 
  to, and including, 1.0.3. This makes it possible for unauthenticated attackers
  to modify Stripe payment configuration settings, including publishable keys, 
  secret keys, email addresses, success URLs, and cancel URLs via the payment 
  settings parameters. This could allow attackers to redirect payments to their 
  own Stripe accounts.
