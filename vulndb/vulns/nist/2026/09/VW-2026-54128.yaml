title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: reject HCI_CMD_SYNC params_len above 255\n\nmgmt_hci_cmd_sync() checks that
  the message length agrees with params_len\nbut puts no upper bound on it. params_len
  is __le16 while the parameter\nlength in the HCI command header is a u8:\n\n\tstruct
  hci_command_hdr {\n\t\t__le16\topcode;\n\t\t__u8\tplen;\n\t} __packed;\n\nhci_cmd_sync_alloc()
  assigns one to the other:\n\n\thdr->plen = plen;\n\n\tif (plen)\n\t\tskb_put_data(skb,
  param, plen);\n\nso a params_len of 256 leaves plen at 0 while all 256 bytes are
  still\nappended. The frame handed to the driver then declares no parameters and\n\
  carries 256 of them. On a length framed transport such as H:4 the\ncontroller takes
  the trailing bytes as the start of the next packet.\n\nThe mgmt socket MTU is HCI_MAX_FRAME_SIZE,
  so params_len can reach about\n1KB this way. Commit 03f1700b9b4d (\"Bluetooth: MGMT:
  reject malformed\nHCI_CMD_SYNC commands\") only made params_len agree with the message\n\
