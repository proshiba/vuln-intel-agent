title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ixp4xx - fix buffer chain unwind on allocation failure\n\nchainup_buffers() builds
  a linked list of buffer descriptors for a\nscatterlist. If dma_pool_alloc() fails
  while constructing the list, the\ncurrent code sets buf to NULL and later dereferences
  it unconditionally\nat the end of the function:\n\n  buf->next = NULL;\n  buf->phys_next
  = 0;\n\nThis can lead to a null-pointer dereference on allocation failure.\n\nIf
  the failure happens after part of the descriptor chain has already\nbeen allocated
  and DMA-mapped, the partially constructed chain also\nneeds to be released.\n\n\
  Fix this by terminating the partially constructed chain on allocation\nfailure and
  letting the callers unwind it via their existing cleanup\npaths. Also fix ablk_perform()
  to preserve the hook pointers before\nchecking for failure, so partially built chains
  can be freed correctly."
