title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/pai:
  Support CPU hotplug for PMU PAI\n\nThe command 'perf stat -e pai_crypto/CRYPTO_ALL/
  -- <command>'\ncrashes the kernel when CPUs are hotplug added during that run.\n\
  \nRoot cause is the missing allocation of per-CPU data structures\nfor that new
  CPU. The allocation is dynamic and the first\nevent that has task context creates
  such a structure for\neach online CPU. This is not sufficient. CPUs may be offline\n\
  during event creation and can be set online during the\nperf run time. For example
  commands\n\n # echo 0 > /sys/devices/system/cpu/cpu1/online\n # perf stat -e cycles
  -i -- stress-ng -t10s --matrix X\n # sleep 1\n # echo 1 > /sys/devices/system/cpu/cpu1/online\n\
  \nCurrently without a CPU hotplug handler, that new CPU has no\nper-CPU data infrastructure.
  The scheduler runs PMU call back\nfunction pai_add() to install the PMU support
  for that CPU before\nthe task is being scheduled on that new CPU.\nIn pai_add()
  instructions\n\n   "
