title: RMCP is an official Rust SDK for the Model Context Protocol. Prior to 
  2.0.0, the rmcp crate's stateful Streamable HTTP server in 
  crates/rmcp/src/transport/streamable_http_server/tower.rs allows an 
  unauthenticated client to send a well-formed JSON-RPC POST that is not an 
  initialization request, or an initialization request with a mismatched 
  protocol header, causing StreamableHttpService::handle_post to call 
  LocalSessionManager.create_session before validating the message. An early 
  validation failure returns without removing the inserted LocalSessionHandle 
  from LocalSessionManager.sessions, permanently retaining session and channel 
  state for the server process lifetime. Repeated requests can grow the shared 
  session table without bound, degrade legitimate-client latency through lock 
  contention, exhaust memory, and terminate the server. This issue is fixed in 
  version 2.0.0.
