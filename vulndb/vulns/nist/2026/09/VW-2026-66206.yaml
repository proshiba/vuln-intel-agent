title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  do not mark the volume clean in sync_fs when errors were recorded\n\nntfs_put_super()
  and the remount-read-only path both clear the dirty bit\nonly when NVolErrors(vol)
  is false. ntfs_sync_fs() clears it\nunconditionally, so any sync() on a volume that
  recorded an error marks\nthat volume clean. A volume without this set is then seen
  as not needing\nrecovery and it does not run one, so whatever went wrong is never
  repaired.\n\nThis change skips resetting the dirty bit when there are volume errors.\n\
  \nReproduced on a volume whose $MFTMirr does not match $MFT, which sets the\nerror
  flag while leaving the mount read-write: after a write and a sync,\nthe on-disk
  volume flags read 0x0000 with this driver and 0x0001 with the\nguard in place."
