title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  fsl-edma: tracing: no ptr dereference during log output\n\nThe fsl edma events store
  a pointer to a struct fsl_edma_engine in the\nringbuffer and dereference it when
  a log entry is printed. At this time,\nthe pointer may no longer be valid.\n\nEvent
  injection can be used to trigger a crash:\n\n$ cd /sys/kernel/tracing\n$ echo 'value
  = 0' > events/fsl_edma/edma_writeb/inject\n$ cat trace\n\nThe log output needs only
  edma->membase. Add a membase field at the end\nof the event and use the new field
  for log output. Keep the existing\nfields for backward compatibility."
