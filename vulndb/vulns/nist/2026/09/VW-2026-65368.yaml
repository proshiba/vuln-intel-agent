title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix response queue over-consumption in __qla_consume_iocb()\n\nqla24xx_process_response_queue()
  advances ring_ptr past the head IOCB\nbefore dispatching, so by the time __qla_consume_iocb()
  runs, ring_ptr\nalready points at the first continuation IOCB. The function however\n\
  looped purex->entry_count times starting at ring_ptr. As entry_count\nincludes the
  head, this consumed one entry too many: it stamped\nRESPONSE_PROCESSED on the next,
  unrelated IOCB and advanced the ring\npast it, silently dropping a legitimate firmware
  response. The head\nIOCB's signature was also never marked.\n\nMark the head processed
  and account for it, then consume only the\nentry_count - 1 continuation IOCBs, matching
  __qla_copy_purex_to_buffer()."
