title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/vcn:
  fix integer overflow in dec_msg buffer count check\n\nIf the supplied msg[2] (num_buffers)
  is 0x3FFFFFFF, the expression\n6 + num_buffers * 4 wraps to 2 and the bounds check
  passes, letting\nthe parser loop far past the end of the message BO. Triggering
  it\nadditionally requires a ~4GiB mapping so that msg[1] survives the\nearlier \"\
  header does not fit in BO\" check.\n\nRewrite the test in division form, which is
  overflow-free by\nconstruction. Also update the message to reflect that msg is invalid."
