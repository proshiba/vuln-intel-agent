title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB read in rtw_action_frame_parse()\n\nrtw_action_frame_parse()
  takes a frame_len parameter but never\nactually checks it before indexing into the
  frame body:\n\n\tconst u8 *frame_body = frame + sizeof(struct ieee80211_hdr_3addr);\n\
  \t...\n\tc = frame_body[0];\n\t...\n\ta = frame_body[1];\n\nframe_body already points
  24 bytes (sizeof(struct\nieee80211_hdr_3addr)) into frame, so reading frame_body[0]
  and\nframe_body[1] requires frame_len >= 26. A management action frame\nshorter
  than that (e.g. exactly 24 bytes, the minimum a malicious\npeer can send) causes
  a 1-2 byte out-of-bounds read.\n\nThis is reachable from rtw_cfg80211_monitor_if_xmit_entry()
  and\ncfg80211_rtw_mgmt_tx() in ioctl_cfg80211.c, both of which pass\nattacker/user-influenced
  frame buffers and lengths straight through.\n\nAdd the missing length check before
  frame_body is dereferenced."
