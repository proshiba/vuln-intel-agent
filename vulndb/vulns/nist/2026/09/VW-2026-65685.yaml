  in the web management interface in Honeywell PD45 Industrial Printer version F10.19.010040,
  allows upload of attacker controlled files without requiring authentication.\n\n\
  \nAn attacker could potentially exploit this vulnerability, leading to the execution
  of malicious files and commands. Honeywell also recommends updating to the most
  recent firmware version, Honeywell PD45 Industrial Printer firmware F10.22.030745,
  which includes a fix for this vulnerability."
