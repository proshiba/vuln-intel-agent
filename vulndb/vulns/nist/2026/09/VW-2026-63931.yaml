title: Conda is a system-level binary package and environment manager that runs 
  on major operating systems and platforms. Prior to 26.5.2, 
  parse_entry_point_def in conda/common/path/python.py accepted an unvalidated 
  entry-point command from a noarch:python package's info/link.json metadata. 
  CreatePythonEntryPointAction in conda/core/path_actions.py interpolated that 
  command into target_short_path, and PrefixPathAction.target_full_path joined 
  it to the installation prefix without verifying that the result remained under
  the intended bin or Scripts directory. create_python_entry_point in 
  conda/gateways/disk/create.py then wrote an executable wrapper to the 
  resulting path. A malicious package could use path separators, traversal 
  segments, or an absolute command path to write outside the prefix or overwrite
  another in-prefix entry point during default install and environment 
