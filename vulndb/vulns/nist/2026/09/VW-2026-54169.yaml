title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  microread: validate target discovery payload lengths\n\nmicroread_target_discovered()
  parses target discovery payloads from\nskb->data according to the HCI gate. The
  fixed field offsets and UID\ncopies were checked only against the destination nfc_target
  buffers, not\nagainst the actual skb length.\n\nValidate that each gate-specific
  payload contains the fixed fields and\nUID bytes before reading or copying them."
