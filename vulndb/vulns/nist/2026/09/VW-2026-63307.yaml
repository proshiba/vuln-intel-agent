title: Cocos AI is a confidential computing system for running AI workloads 
  inside trusted execution environments. In versions up to and including 0.8.2, 
  the intra-handshake attested TLS (aTLS) Intel TDX verification path does not 
  copy the expected current-session freshness value into the TDX quote-body 
  policy before quote validation, so structurally valid TDX QuoteV4 Evidence is 
  accepted without checking that its REPORT_DATA field matches the reportData 
  expected for the current session. A relying party using this path can 
  therefore accept Evidence with a mismatched or reused reportData and release 
  application data after the handshake, enabling session-misbinding to an 
  unintended attestation context. The issue is fixed in version 0.9.0.
