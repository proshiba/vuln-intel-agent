title: undici 8.10.0 omits the destination origin from the cache and 
  request-deduplication keys when the cache or deduplicate interceptor is 
  composed directly onto a Client or Pool. Because the internal cache key falls 
  back to an empty origin string, a cacheable or in-flight response from one 
  upstream origin is returned for a request to a different, trusted origin 
  whenever the method, path, and relevant headers match, which permits 
  cross-origin information disclosure and persistent cache poisoning. The 
  reporter demonstrated a full authentication bypass in which a JWT signed with 
  an attacker-controlled key was accepted as belonging to a trusted issuer, and 
  the trusted origin was never contacted. This is a regression introduced in 
  8.10.0 and affects undici versions from 8.10.0 up to 8.10.2. Applications 
  using an Agent, which carries the origin in its dispatch options, are not 
  affected. Users should upgrade to undici 8.10.2.
