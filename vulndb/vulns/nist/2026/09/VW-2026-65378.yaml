title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix circular locking dependency in ocfs2_init_acl()\n\nA lockdep warning indicates
  a circular locking dependency between\n`&oi->ip_xattr_sem` and `&journal->j_trans_barrier`:\n\
  \nWARNING: possible circular locking dependency detected\nis trying to acquire lock:\n\
  \ (&oi->ip_xattr_sem){++++}-{4:4}, at: ocfs2_init_acl+0x2fd/0x7e0\n fs/ocfs2/acl.c:367\n\
  \nbut task is already holding lock:\n (&journal->j_trans_barrier){.+.+}-{4:4}, at:
  ocfs2_start_trans+0x3ab/0x700\n fs/ocfs2/journal.c:369\n\nThe deadlock involves
  two code paths: Path 1 (setxattr) where\n`ocfs2_xattr_set()` acquires `ip_xattr_sem`
  (write) and then starts a\ntransaction, which acquires `j_trans_barrier` (read);
  and Path 2\n(mkdir/mknod) where `ocfs2_mknod()` starts a transaction (`j_trans_barrier`\n\
  read) and then calls `ocfs2_init_acl()`, which attempts to acquire\n`ip_xattr_sem`
  (read) on the parent directory to retrieve the default ACL.\n\nBecause rw_semaphores
