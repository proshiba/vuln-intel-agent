title: "Net::IDN::Punycode versions before 2.301 for Perl allow a heap buffer overflow
  via unchecked writes past the output buffer in encode_punycode.\n\nThe XS backend
  builds the encoded label in the string buffer of the scalar it returns, sized from
  the input length. The loop that emits the digits of each code point checks for room
  before every write, but the write of the last digit of each round and the write
  of the terminating NUL do not, so an input whose encoded form fills the buffer writes
  past its end.\n\nOnly the XS backend is affected.\n\nEncoding an attacker-supplied
  string corrupts the heap."
