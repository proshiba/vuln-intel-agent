title: "Lemonldap::NG::Portal versions from 2.20.0 before 2.21.6, from 2.22.0 before
  2.23.4 for Perl allow unauthenticated OAuth2 token introspection because checkEndPointAuthenticationCredentials
  does not verify the client secret of a public Relying Party.\n\ncheckEndPointAuthenticationCredentials()
  skips the secret comparison for a Relying Party marked public and still returns
  the authentication method deduced from the request, client_secret_basic or client_secret_post.
  introspection() rejects a caller only when that method is missing or none, so a
  request carrying a public client_id and an arbitrary or empty secret passes the
  endpoint's authentication check.\n\nAn attacker who holds an access token and knows
  the client_id of any public Relying Party can confirm the token is active and read
  its metadata, including scope, audience, expiry and the sub claim. The sub claim
  is computed with the calling Relying Party's user identifier attribute, so an attacker
  can translate a user identifier from one"
