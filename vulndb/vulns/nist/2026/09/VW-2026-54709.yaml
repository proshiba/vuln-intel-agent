title: A security flaw has been discovered in liufee FeehiCMS up to 2.1.1. This 
  affects the function catchImage of the file 
  backend/widgets/ueditor/Uploader.php of the component UEditor. The 
  manipulation of the argument source[] results in server-side request forgery. 
  The attack can be executed remotely. The exploit has been released to the 
  public and may be used for attacks. The project was informed of the problem 
  early through an issue report but has not responded yet.
