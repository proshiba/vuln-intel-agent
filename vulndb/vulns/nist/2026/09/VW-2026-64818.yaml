title: A flaw was found in the Pushed Authorization Request PAR implementation 
  of Keycloak. The issue occurs when the silent authentication path prompt=none 
  is used, which allows the authorization process to skip certain steps if a 
  user is already logged in. Due to this bypass, the security rule that ensures 
  a pushed request URI is used only once is not enforced. An attacker could 
  potentially reuse a request URI to obtain multiple authorization codes for a 
  user who is already signed in, violating security standards like FAPI-2.
