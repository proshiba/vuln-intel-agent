title: Softaculous Virtualizor before 3.2.9 (Patch 9) and 3.0.0 contains a PHP 
  object injection vulnerability in the billing module handler that allows 
  unauthenticated remote attackers to supply arbitrary serialized PHP objects 
  for deserialization by setting the act parameter to login with the 
  from_billing_module parameter present. Attackers can pass malicious serialized
  data through the billing_data POST field to the unserialize() function without
  allowed_classes restrictions, enabling exploitation of available POP chains to
  achieve remote code execution as root.
