title: OpenCTI is an open source platform for managing cyber threat intelligence
  knowledge and observables. Prior to 7.260701.0, the synchronizerFetch GraphQL 
  query called fetchRemoteStreams after checking only that a remote stream URL 
  used HTTP or HTTPS. The backend did not apply the ingestion deny list or 
  reject private, loopback, and link-local destinations, allowing an 
  authenticated account with the INGESTION capability to make OpenCTI request 
  internal services and cloud metadata endpoints. Returned connection errors 
  could distinguish open HTTP ports, open non-HTTP ports, and closed ports, 
  enabling internal network scanning, while compatible endpoint responses could 
  disclose internal data. This issue is fixed in version 7.260701.0.
