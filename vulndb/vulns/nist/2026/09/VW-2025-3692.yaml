title: A vulnerability was found in ZenTao up to 21.7.6-8564. This affects the 
  function makeRequest of the file module/ai/model.php. The manipulation of the 
  argument Base results in server-side request forgery. The attack can be 
  launched remotely. The exploit has been made public and could be used. 
  Upgrading to version 21.7.6 mitigates this issue. It is suggested to upgrade 
  the affected component.
