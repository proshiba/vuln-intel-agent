title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrapidio:
  clear mport->net when rio_add_net() fails\n\nrio_alloc_net() stores the newly allocated
  rio_net in mport->net before\nrio_scan_alloc_net() registers the device.\n\nIf rio_add_net()
  fails, rio_scan_alloc_net() drops the device reference\nwith put_device(), which
  releases the rio_net through the device release\ncallback.  However, mport->net
  is left pointing at the freed object.\n\nA later mport unregister path can then
  dereference the dangling mport->net\npointer and may try to free the same rio_net
  again.\n\nClear mport->net in the rio_add_net() failure path, matching the cleanup\n\
  done for the destID table allocation failure path."
