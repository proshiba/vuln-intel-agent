title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  imx: serialize imx_uart_ports[] lifetime\n\nimx_uart_probe() publishes its devm-allocated
  port in imx_uart_ports[]\nbefore uart_add_one_port() because console setup uses
  the table. The entry\nis not cleared when adding the port fails or after removal,
  leaving a\ndangling pointer.\n\nA sibling probe can register the shared console
  through that stale entry.\nThis was reproduced under KASAN on QEMU mcimx6ul-evk
  by unbinding a\nsibling UART, unbinding the console UART and rebinding the sibling.\n\
  \nKeep the entry valid through uart_remove_one_port(), then clear it. Protect\n\
  port addition and removal together with their table updates so sibling\noperations
  cannot interleave. Reject an occupied slot rather than\nclobbering an active port
  during a duplicate-line probe."
