title: phpMyFAQ versions before 4.1.8 contain an authentication bypass 
  vulnerability in the user control panel API endpoint that allows authenticated
  attackers to change account passwords without verifying the current password. 
  Attackers with session access can submit a PUT request to the user data update
  endpoint with only a CSRF token to silently change any user's password, 
  including administrators, causing irreversible account takeover and victim 
  lockout.
