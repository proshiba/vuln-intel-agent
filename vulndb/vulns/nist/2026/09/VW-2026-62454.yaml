title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix mmap_lock deadlock on arena lock failure\n\nReported by the Sashiko AI review.\n\
  \narena_vm_fault() returns VM_FAULT_RETRY when it can't take\narena->spinlock, but
  it never took mmap_lock. The fault path assumes a\nVM_FAULT_RETRY handler already
  dropped mmap_lock and re-takes it on the\nretry, so mmap_lock gets taken twice and
  can deadlock:\n\n\tdo_user_addr_fault()\n\t{\n\t\tfault = handle_mm_fault(...);\
  \   // calls arena_vm_fault()\n\t\tif (fault & VM_FAULT_RETRY)\n\t\t\tgoto retry;\
  \   // re-locks mmap_lock\n\t\tmmap_read_unlock(mm);\n\t}\n\nReturn VM_FAULT_SIGBUS
  instead, for two reasons:\n\n1. We could keep VM_FAULT_RETRY, but then we'd have
  to drop the fault\n   lock first and cap the retry ourselves, the way __folio_lock_or_retry()\n\
  \   does.\n\n2. A failed raw_res_spin_lock_irqsave() already means a possible deadlock\n\
  \   was detected, so retrying just hits the same lock again.\n\nSo returning VM_FAULT_RETRY
  here is overkill."
