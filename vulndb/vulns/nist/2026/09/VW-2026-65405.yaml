title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  octeon: add missing tasklet_kill in cvm_oct_tx_shutdown\n\nThe TX cleanup tasklet
  can be scheduled by the watchdog IRQ handler\nto execute cvm_oct_tx_do_cleanup.
  There can be a pending tasklet in\nthe queue which might run after the cvm_oct_remove()
  frees net_device\nstructures, causing a use-after-free in cvm_oct_tx_do_cleanup()
  as it\niterates cvm_oct_device[] which is an array of netdevice pointers.\nAdd tasklet_kill()
  after free_irq() to ensure the tasklet is no longer\nscheduled or running before
  teardown proceeds."
