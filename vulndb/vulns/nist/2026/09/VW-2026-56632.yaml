title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the OpenAI Chat Model node enforced credential 
  allowed-domain restrictions for normal calls but not for the model-search 
  dropdown. A workflow editor could set options.baseURL to an arbitrary host and
  make the searchModels path send the openAiApi credential there. The affected 
  implementation is 
  packages/@n8n/nodes-langchain/nodes/llms/LMChatOpenAi/methods/loadModels.ts, 
  which omitted assertOpenAiCredentialAllowsUrl. This issue is fixed in versions
  1.123.76, 2.37.7 and 2.38.2.
