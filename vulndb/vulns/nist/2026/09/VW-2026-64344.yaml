title: LightRAG provides simple and fast retrieval-augmented generation. Prior 
  to 1.5.5, the LightRAG API server returns raw Python exception text from error
  handlers in document_routes.py, graph_routes.py, query_routes.py, 
  ollama_api.py, and lightrag_server.py. The detail=str(e), detail=str(exc), and
  equivalent formatted-message paths expose server filesystem paths, database 
  host, port, user, and database names, language-model provider diagnostics, 
  configuration details, and Python library internals to a network client that 
  can trigger an error. The default unauthenticated configuration makes those 
  responses reachable without credentials, and URI-configured backends can 
  disclose connection strings containing credentials depending on the underlying
  driver error. This issue is fixed in version 1.5.5.
