title: Netdata is an open source observability tool. From 2.0.0 until 2.11.0, 
  Netdata registers /api/v3/settings in src/web/api/v3/web_api_v3.c with 
  HTTP_ACL_NOCHECK and HTTP_ACCESS_ANONYMOUS_DATA, causing unauthenticated PUT 
  requests handled by src/web/api/v3/api_v3_settings.c to bypass 
  operator-configured allow dashboard from IP restrictions. A network-reachable 
  caller can persist attacker-controlled JSON in {varlib}/settings/default.json,
  manipulate its version counter, and use repeated near-20 MiB writes to consume
  disk space, although the file does not control collection or security policy. 
  This vulnerability is fixed in 2.11.0.
