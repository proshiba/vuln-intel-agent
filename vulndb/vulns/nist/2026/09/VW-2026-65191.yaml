title: Fabasoft Folio Client before 2026, a locally installed component that 
  communicates with the Fabasoft browser extension via web messaging, does not 
  restrict which web origins may invoke its functions by default. The registry 
  value VALIDDOMAINS, which limits permitted origins, was optional and empty by 
  default, resulting in all domains being trusted. As a consequence, any website
  visited by a user with the Folio Client and browser extension installed could 
  invoke client functions, e.g., related to downloading documents, opening 
  documents, and synchronizing files. The first fixed builds are Fabasoft Folio 
  Client 2026 (Build 26.0.0.10) and Fabasoft Folio Client 2026 April Release 
  (Build 26.4.0.76). This client is, for example, shipped with Fabasoft 
  eGov-Suite.
