title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  validate external xattr entries when reading metadata\n\nocfs2_validate_xattr_block()
  checks the xattr block header before the\nblock reaches higher-level xattr users,
  but it does not verify that a\nnon-indexed block's xh_count and entry offsets fit
  inside the block. \nIndexed buckets likewise reach list/get consumers after ECC
  without an\nentry-bounds check.\n\nUse the flat xattr entry validator for non-indexed
  external xattr blocks,\nand use a bucket-specific validator for indexed buckets
  at metadata read\ntime.  The bucket validator keeps the entry array bounded by the
  first\nbucket block while checking name/value offsets against the bucket block\n\
  they target.\n\nReject corrupted external xattr metadata before listxattr() or getxattr()\n\
  can walk out-of-range entry arrays or name/value offsets.\n\nValidation reproduced
  this kernel report:\nBUG: KASAN: use-after-free in ocfs2_xattr_list_entries+0xd7/0x190\n\
  Read of size 1 at addr"
