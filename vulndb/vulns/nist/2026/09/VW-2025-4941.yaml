title: A security flaw has been discovered in Linksys RE6500, RE6250, RE6300, 
  RE6350, RE7000 and RE9000 
  1.0.013.001/1.0.04.001/1.0.04.002/1.1.05.003/1.2.07.001. This vulnerability 
  affects the function RE2000v2Repeater_get_wired_clientlist_setClientsName of 
  the file mod_form.so. The manipulation of the argument clientsname_0 results 
  in stack-based buffer overflow. The attack may be launched remotely. The 
  exploit has been released to the public and may be exploited. The vendor was 
  contacted early about this disclosure but did not respond in any way.
