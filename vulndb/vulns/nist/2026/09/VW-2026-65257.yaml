title: A flaw was found in rpm. An attacker can supply a crafted manifest file 
  that, when processed by a user or automation using `rpm -q -p` or similar 
  manifest-processing flows, leads to arbitrary code execution. This occurs 
  because manifest entries are unexpectedly macro-expanded before being opened, 
  allowing embedded shell commands to run with the privileges of the `rpm` 
  process. Successful exploitation can lead to a full compromise of 
  confidentiality, integrity, and availability for the affected account.
