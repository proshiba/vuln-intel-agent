title: "A privilege mismatch was found in Fleet. When a bundle requested namespace
  labels or annotations through the namespaceLabels and namespaceAnnotations options,
  the resulting namespace metadata update was not subject to the same authorization
  as the rest of the bundle's deployment. As a result, a bundle could change labels
  and annotations on a target namespace even when the identity it was pinned to was
  not authorized to modify that namespace.\n\nThis affected SUSE Rancher Fleet 0.16
  before 0.16.2, 0.15 before 0.15.7, 0.14 before 0.14.11, 0.13 before 0.13.16 and
  potentially older versions."
