title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.9.5 until 0.11.1, server-side web fetches did not reapply 
  WEB_FETCH_FILTER_LIST or private-address controls to HTTP redirect 
  destinations when AIOHTTP_CLIENT_ALLOW_REDIRECTS was enabled. An authenticated
  user could redirect the aiohttp and requests fetch paths to excluded hosts, 
  loopback, private networks, or cloud metadata services and route resulting 
  content into web search, URL ingestion, page-fetch tools, or chat image 
  processing. This issue is fixed in version 0.11.1.
