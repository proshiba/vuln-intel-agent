title: "hey,\n\n\n\n`_nx_snmp_utility_object_id_get` in the NetX Duo SNMP addon does
  not validate the claimed OID data length against the actual buffer size when the
  OID uses BER multibyte length encoding, so a remote attacker can send a crafted
  SNMP packet with a multibyte OID length larger than the available buffer, causing
  the parser to read past the packet buffer boundary into adjacent heap memory. the
  OOB bytes are decoded as OID component values and written into the agents internal
  OID string buffer, corrupting agent state. on systems with memory protection the
  OOB read poses the risk of crashing the SNMP agent thread, causing denial of service.
  on bare metal embedded systems without memory protection the read silently succeeds
  and corrupts the agents internal state with heap data."
