title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject negative optlen in cgroup getsockopt hook\n\nA cgroup getsockopt BPF program
  can shrink ctx->optlen after the\nkernel getsockopt handler has run. The kernel-buffer
  variant, used by\nTCP_ZEROCOPY_RECEIVE, only rejects values larger than the original\n\
  length.\n\nIf BPF writes a negative optlen, that value is accepted and propagated\n\
  back to the TCP getsockopt code. It can then be passed to\ncopy_to_sockptr() as
  a size_t and trigger the hardened usercopy\nbytes > INT_MAX warning.\n\nReject negative
  ctx.optlen in __cgroup_bpf_run_filter_getsockopt_kern(),\nmatching the lower-bound
  validation already present in the sockptr-based\ngetsockopt hook."
