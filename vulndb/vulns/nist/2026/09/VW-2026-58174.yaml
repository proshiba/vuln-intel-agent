title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  6fire: bound the MIDI event length from the device\n\nusb6fire_comm_receiver_handler()
  forwards a MIDI event using a length\nbyte the device supplies, with no bound and
  no check that the transfer\ndelivered that many bytes:\n\n\tif (!urb->status) {\n\
  \t\tif (rt->receiver_buffer[0] == 0x10) /* midi in event */\n\t\t\tif (midi_rt)\n\
  \t\t\t\tmidi_rt->in_received(midi_rt,\n\t\t\t\t\t\trt->receiver_buffer + 2,\n\t\t\
  \t\t\t\trt->receiver_buffer[1]);\n\t}\n\nreceiver_buffer is a 64-byte kzalloc()
  buffer (COMM_RECEIVER_BUFSIZE), so\nonly 62 bytes follow the two-byte header.  receiver_buffer[1]
  is a u8 the\ndevice chooses, so a device that answers with 0x10 and a length of
  0xFF\nmakes snd_rawmidi_receive() read 255 bytes starting two bytes into a\n64-byte
