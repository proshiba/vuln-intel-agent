title: Contrast is a confidential-computing runtime for Kubernetes. In versions 
  before 1.19.1, the Kata agent policies generated by the Contrast CLI contained
  a flaw in the CopyFile verification that allowed arbitrary writes to the guest
  root filesystem. A malicious process on the untrusted host able to connect to 
  the Kata agent VSOCK could issue a series of CopyFile requests to overwrite 
  security-critical files in the guest or trick the workload into disclosing 
  sensitive data, effectively amounting to a full guest takeover. Users unable 
  to upgrade can apply an equivalent rego policy fix passed to 'contrast 
  generate --policy'.
