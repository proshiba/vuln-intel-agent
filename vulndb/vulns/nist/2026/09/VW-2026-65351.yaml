title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  fsl-imx8mq-usb: fix typec switch leak on probe error path\n\nIf probe fails after
  imx95_usb_phy_get_tca() succeeds, the typec\nswitch leaks because the only cleanup
  path was in .remove(), which\nnever runs on probe failure.\n\nUse devm_add_action_or_reset()
  so the switch is cleaned up on both\nprobe failure and driver removal. The imx95_usb_phy_put_tca()
  is no\nlonger needed, it will be removed in .remove() too."
