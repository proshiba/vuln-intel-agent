title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  bound SGL data length before allocating command buffers\n\nnvmet_tcp_map_data()
  reads the host-controlled 32-bit sgl->length\nand, for the in-capsule offset descriptor
  (type 0x01), checks it\nagainst port->inline_data_size before use. Any other SGL
  descriptor\ntype -- including the non-inline transport SGL data-block descriptor\n\
  (type (NVME_TRANSPORT_SGL_DATA_DESC << 4) | NVME_SGL_FMT_TRANSPORT_A,\nthe type
  a real host uses for out-of-capsule writes) skips that check\nentirely and falls
  straight through to:\n\n\tcmd->req.sg = sgl_alloc(len, GFP_KERNEL, &cmd->req.sg_cnt);\n\
  \nwith len taken directly from the wire, unbounded up to 4 GiB.\n\nnvmet_req_init()
  only parses the command and never inspects\nsgl->length, and nvmet_check_transfer_len()
  -- the only other place\ntransfer_len is validated -- runs later, from req->execute(),
  after\nthe allocation has already happened. For a write command the target\nresponds
