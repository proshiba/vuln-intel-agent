title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  media: tegra-video: fix of_node_put() on VIP parse errors\n\ntegra_vip_channel_of_parse()
  initializes np from dev->of_node without\ntaking a reference, but its error paths
  drop one through the\nerr_node_put label. This underflows the refcount of the VIP
  device's\nOF node when endpoint parsing fails on a malformed device tree.\n\nThe
  only reference the function takes on np is the success-path\nof_node_get() stored
  in vip->chan.of_node, and that one is already\nreleased by the tegra_vip_init()
  error path and by tegra_vip_exit().\n\nReturn errors directly instead of jumping
  to the bogus cleanup label."
