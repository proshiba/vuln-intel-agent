title: '@grpc/grpc-js implements the core functionality of gRPC purely in JavaScript,
  without a C++ addon. Prior to 1.13.6 and 1.14.5, getAuthContext does not distinguish
  authorized from unauthorized peer certificates when server credentials set requireClientCertificate
  to false. When applications use the returned authentication context, they can treat
  an unauthorized certificate as authorized, causing improper authentication. @grpc/grpc-js-xds
  can reach this condition when RBAC authentication is enabled in affected configurations.
  This issue is fixed in version 1.14.5 and 1.13.6.'
