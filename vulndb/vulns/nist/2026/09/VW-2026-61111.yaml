title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio/pci:
  clear vdev->msi_perm after freeing it on init failure\n\nvfio_msi_cap_len() lazily
  allocates the per-device MSI permission table:\n\n\tvdev->msi_perm = kmalloc_obj(struct
  perm_bits, GFP_KERNEL_ACCOUNT);\n\tif (!vdev->msi_perm)\n\t\treturn -ENOMEM;\n\n\
  \tret = init_pci_cap_msi_perm(vdev->msi_perm, len, flags);\n\tif (ret) {\n\t\tkfree(vdev->msi_perm);\n\
  \t\treturn ret;\t\t/* vdev->msi_perm left dangling */\n\t}\n\nWhen init_pci_cap_msi_perm()
  -> alloc_perm_bits() fails with -ENOMEM, the\nerror path frees vdev->msi_perm but
  leaves the freed pointer stored in\nit. vdev->msi_perm is not re-zeroed later because
  struct\nvfio_pci_core_device is per-device and persists across open/close cycles,\n\
  and the vfio_config_init() error path returns without calling\nvfio_config_free().
  So the dangling pointer outlives the failed open.\n\nThat leads to two use-after-frees
  on the same device:\n\n1. Reuse. The next vfio_config_init() sees the stale pointer
  at\n   \"i"
