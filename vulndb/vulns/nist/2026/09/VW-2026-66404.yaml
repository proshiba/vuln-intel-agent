title: GLPI is a free asset and IT management software package. From 0.84 until 
  10.0.26 and 11.0.8, an administrator holding the Update auth and sync or 
  Update auth, sync and 2FA right can change the authentication method and 
  disable two-factor authentication for user accounts outside the 
  administrator's entity scope. The affected user-account administration flow 
  did not consistently enforce the target user's entity-scoped update 
  permission. This issue is fixed in versions 11.0.8 and 10.0.26.
