title: 'Vulnerability in the Oracle Agile PLM product of Oracle Supply Chain (component:
  Application Server).   The supported version that is affected is 9.3.6. Easily exploitable
  vulnerability allows low privileged attacker with network access via HTTP to compromise
  Oracle Agile PLM.  While the vulnerability is in Oracle Agile PLM, attacks may significantly
  impact additional products (scope change).  Successful attacks of this vulnerability
  can result in  unauthorized access to critical data or complete access to all Oracle
  Agile PLM accessible data. CVSS 3.1 Base Score 7.7 (Confidentiality impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N).'
