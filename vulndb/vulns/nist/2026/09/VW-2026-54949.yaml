title: Lara Dashboard before 1.3.2 authorizes the POST 
  /admin/settings/core-upgrades/upload endpoint with only the settings.edit 
  permission, allowing non-Superadmin administrators to upload and extract 
  arbitrary zip archives over the live application source code. Attackers can 
  upload a malicious archive containing modified application files such as 
  routes/web.php with embedded system commands, which execute as the web server 
  user with access to environment secrets and database credentials.
