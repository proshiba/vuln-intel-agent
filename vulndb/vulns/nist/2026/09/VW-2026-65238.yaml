title: The Spectra Legacy – Gutenberg Blocks plugin for WordPress is vulnerable 
  to Sensitive Information Exposure in all versions up to, and including, 2.20.0
  via the editor_assets function,  which exposes the uag_insta_linked_accounts 
  option through the uagb_blocks_info object without a capability check. This 
  makes it possible for authenticated attackers, with Contributor-level access 
  and above, to extract sensitive data including raw Instagram Graph API access 
  tokens configured by an administrator. Exploitation requires the Spectra Pro 
  plugin to be active with a linked Instagram account.
