title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix the rtrmap and rtrefcount _maxlevels_ondisk functions\n\nThe _maxlevels_ondisk
  functions are used to compute the size of\nin-memory btree cursors for each btree
  type.  Unfortunately, LOLLM\nnoticed that the rtrmap and rtrefcount versions of
  these functions\nforget to account for the inode root, which means that we could
  access\nbeyond the end of the cursor given a sufficiently large btree.  Fix\nthis."
