title: Tinyauth is an authentication and authorization server. Prior to 5.1.2, 
  Tinyauth compares forwarded hostnames case-sensitively while reverse proxies 
  route equivalent hostnames case-insensitively, allowing an authenticated 
  low-privilege user to bypass per-app access controls with a differently cased 
  hostname. The lookup in internal/service/access_controls_service.go through 
  lookupStaticACLs and GetAccessControls, and the Docker-label fallback in 
  internal/service/docker_service.go through GetLabels, can miss the configured 
  app and return an empty access-control object. 
  internal/controller/proxy_controller.go proxyHandler then treats the empty 
  user, group, OAuth, LDAP, and IP restrictions as permissive and returns an 
  authenticated result for an app that should exclude the user. Unauthenticated 
  users remain subject to login, and global login-time allowlists are not 
  bypassed. This issue is fixed in version 5.1.2.
