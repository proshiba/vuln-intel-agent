title: Wallos is an open-source, self-hostable personal subscription tracker. 
  Prior to version 5.0.0, Wallos lets any authenticated user store an arbitrary 
  SMTP host — including private and cloud-metadata IP addresses — in their 
  personal email notification settings, with no server-side SSRF validation. 
  When the scheduled notification cron job runs, it passes the stored host 
  directly to PHPMailer, causing the Wallos server to open an outbound TCP 
  connection to whatever address the attacker specified. This gives a 
  low-privileged attacker a reliable mechanism to probe internal network 
  services from the server's perspective. This issue has been patched in version
  5.0.0.
