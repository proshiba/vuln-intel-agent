title: The Cozy Blocks – Page Builder for Gutenberg Editor & FSE with 700+ 
  Patterns, 58 Blocks & Templates plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 2.2.17. This is due
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for unauthenticated attackers to retrieve the 
  name, price, short description, image URL, permalink, stock status, and 
  product type of draft, pending, private, and catalog-hidden WooCommerce 
  products not intended to be publicly visible. The sidebarNonce value is 
  emitted unconditionally into public page HTML by multiple block renderers with
  no login gate, allowing unauthenticated visitors to harvest a valid nonce and 
  pass the only authentication check in the handler.
