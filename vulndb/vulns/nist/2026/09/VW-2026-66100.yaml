title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnexthop:
  Initialize extack in remove_nh_grp_entry()\n\nremove_nh_grp_entry() prints the extack
  message when a listener fails\nto replace the reduced nexthop group. However, extack
  is not\ninitialized and listeners are not required to set a message when\nreturning
  an error. Neither netdevsim nor mlxsw do so when an\nallocation fails, resulting
  in the dereference of an uninitialized\nstack pointer.\n\nFix by zero-initializing
  extack, as was done in commit 6347c5314cee\n(\"nexthop: initialize extack in nh_res_bucket_migrate()\"\
  )."
