title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: fix OOB write in snd_usbmidi_novation_output()\n\nsnd_usbmidi_novation_output()
  lays out a two-byte header at\ntransfer_buffer[0..1] and passes &transfer_buffer[2]
  together with a\nlength of ep->max_transfer - 2 to snd_rawmidi_transmit():\n\n\t
  count = snd_rawmidi_transmit(ep->ports[0].substream,\n\t\t\t\t     &transfer_buffer[2],\n\
  \t\t\t\t     ep->max_transfer - 2);\n\nep->max_transfer comes from the output endpoint's
  wMaxPacketSize via\nusb_maxpacket(). A malformed or malicious device can advertise
  a bulk\nOUT endpoint with a wMaxPacketSize of 1 - the USB core only clamps this\n\
  value downwards - so ep->max_transfer becomes 1 and the count argument\nbecomes
  -1.\n\nsnd_rawmidi_transmit() passes the negative count on to\n__snd_rawmidi_transmit_peek(),
  where \"if (count1 > count) count1 = count\"\nleaves count1 negative; get_aligned_size()
  keeps it negative for a\nbyte-stream substream, so the following memcpy(buffer,
  ..., count1) ru"
