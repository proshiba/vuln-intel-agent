title: "Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2, summary In Zammad's inbound PGP email processing, the return value of
  the gpg verification call was silently discarded. Regardless of whether gpg reported
  a valid, invalid, or missing signature, the handler unconditionally wrote sign:
  { success: true, comment: \"Good signature\" } to the article's security preferences.
  Impact Any sender could tamper with the body of a multipart/signed PGP email, or
  craft a message with an entirely fabricated or mismatched signature, and Zammad
  would display it to the recipient as cryptographically verified with a \"Good signature\"\
  \ label. Users and agents relying on Zammad's signature indicator to confirm message
  authenticity and integrity would be misled into trusting modified or forged content.
  The vulnerability affects all inbound PGP-signed emails processed while the PGP
  integration is enabled. This issue is fixed in version 7.0.2."
