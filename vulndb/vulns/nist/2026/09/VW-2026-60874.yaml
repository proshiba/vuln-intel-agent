title: 'Vulnerability in the Oracle Agile Engineering Data Management product of Oracle
  Supply Chain (component: Engineering Communication Interface).   The supported version
  that is affected is 6.2.1. Easily exploitable vulnerability allows low privileged
  attacker with logon to the infrastructure where Oracle Agile Engineering Data Management
  executes to compromise Oracle Agile Engineering Data Management.  While the vulnerability
  is in Oracle Agile Engineering Data Management, attacks may significantly impact
  additional products (scope change).  Successful attacks of this vulnerability can
  result in  unauthorized access to critical data or complete access to all Oracle
  Agile Engineering Data Management accessible data as well as  unauthorized update,
  insert or delete access to some of Oracle Agile Engineering Data Management accessible
  data. CVSS 3.1 Base Score 7.3 (Confidentiality and Integrity impacts).  CVSS Vector:
  (CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N).'
