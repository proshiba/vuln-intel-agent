title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  mpi3mr: Fix NULL pointer dereference in mpi3mr_sas_port_add()\n\nsas_port_alloc_num()
  can return NULL on memory allocation failure. The\nreturn value is passed directly
  to sas_port_add() without a NULL check,\nwhich causes a NULL pointer dereference.\n\
  \nAdditionally, if sas_port_add() fails, the allocated port is not freed\nbefore
  jumping to out_fail, leaking the sas_port structure. Call\nsas_port_free() to properly
  release it."
