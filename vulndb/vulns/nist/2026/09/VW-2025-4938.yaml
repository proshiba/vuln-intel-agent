title: A vulnerability was detected in xerrors Yuxi-Know up to 0.4.0. This 
  vulnerability affects the function OtherEmbedding.aencode of the file 
  /src/models/embed.py. Performing manipulation of the argument health_url 
  results in server-side request forgery. The attack can be initiated remotely. 
  The exploit is now public and may be used. The patch is named 
  0ff771dc1933d5a6b78f804115e78a7d8625c3f3. To fix this issue, it is recommended
  to deploy a patch. The vendor responded with a vulnerability confirmation and 
  a list of security measures they have established already (e.g. disabled URL 
  parsing, disabled URL upload mode, removed URL-to-markdown conversion).
