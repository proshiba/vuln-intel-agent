title: DD-WRT firmware, as deployed on TP-Link TL-WR740N v1 through v4 hardware,
  stores sensitive authentication credentials in cleartext within non-volatile 
  memory. The exposed material includes SSH private keys, dynamic DNS passwords,
  email notification credentials and administrative passwords. An attacker with 
  physical access to the device can extract these credentials from an SPI flash 
  dump, leading to device compromise, infiltration of the connected network and 
  unauthorised access to dependent third-party services.
