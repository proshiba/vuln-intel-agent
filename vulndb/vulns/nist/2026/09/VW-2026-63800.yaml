title: A security flaw has been discovered in JusticeRage Manalyze 1.0.0. The 
  affected element is the function PE::_parse_debug of the file manape/pe.cpp of
  the component PE Parser. The manipulation of the argument misc.Length results 
  in integer underflow. The attack may be performed from remote. The patch is 
  identified as 3e299685759f4f767088871de58c5d07f98ee382. A patch should be 
  applied to remediate this issue.
