title: "HTML::FormHandler versions before 0.410002 for Perl render field attributes
  into HTML without escaping using the process_attrs method.\n\nAny application with
  fields or field labels where some attributes are built from data rather than literals
  allows attacker-influenced text in an attribute value that can override the field
  attributes or embed JavaScript in rendered pages.\n\nFor example, the RadioGroup
  widget uses the process_attrs method via the render_option and wrap_radio methods."
