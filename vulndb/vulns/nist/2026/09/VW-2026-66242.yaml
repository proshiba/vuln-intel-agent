title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  platform: Use acpi_bus_get_primary_device()\n\nThe acpi_get_first_physical_node()
  usage in acpi_platform_fill_resource()\nand acpi_create_platform_device() is generally
  unsafe because in theory\nthe device returned by it may be freed at any time [1].\n\
  \nIt is also inefficient because acpi_get_first_physical_node() is called\nmultiple
  times for the same argument which can be avoided.\n\nAddress these issues by using
  acpi_bus_get_primary_device() instead of\nacpi_get_first_physical_node() and adjusting
  the code to call it just\nonce at the beginning of and acpi_create_platform_device()
  and drop\nthe device reference acquired by it upon the return from that function."
