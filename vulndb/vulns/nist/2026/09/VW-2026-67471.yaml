title: "The MCUmgr SMP-over-console transport decodes a base64 frame, reads a 16-bit
  packet length from it, verifies a CRC and then unconditionally strips the trailing
  CRC with rx_ctxt->nb->len -= 2U; in mcumgr_serial_process_frag() (subsys/mgmt/mcumgr/transport/src/serial_util.c).
  mcumgr_serial_extract_len() accepted any declared length, including 0 and 1, and
  a packet declaring length 0 passes the checksum test for free because crc16_itu_t()
  over zero bytes returns the zero seed. Since net_buf::len is a uint16_t, the subtraction
  underflows and the buffer is handed to SMP claiming roughly 65 KB of payload while
  its data area is only CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE bytes (default 384).\n\
  \nThe trigger is a single unauthenticated 7-byte line on the management console
  — the 0x06 0x09 packet marker followed by the base64 group AAA= and a newline —
  delivered to any transport built on this helper: CONFIG_MCUMGR_TRANSPORT_UART (smp_uart.c)
