title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/amd_node:
  Fix potential NULL pointer dereference\n\namd_smn_read/write() are exported functions
  around __amd_smn_rw(), so\nthey are always available even if amd_smn_init() fails.
  In that case,\n'amd_roots' is NULL and __amd_smn_rw() will access uninitialized
  memory.\n\nThen, commit:\n\n  83518453074d (\"x86/amd_node: Add SMN offsets to exclusive
  region access\")\n\nadded the 'smn_exclusive' flag, which indicated the calls to\n\
  pci_request_config_region_exclusive() succeeded, to prevent\nconcurrent userspace
  access.\n\nCommit:\n\n  0a4b61d9c2e4 (\"x86/amd_node: Fix AMD root device caching\"\
  )\n\nre-ordered initialization so pci_request_config_region_exclusive() is\ncalled
  earlier and a failure exits amd_smn_init() before allocating\n'amd_roots'. The setting
  of 'smn_exclusive' moved to the end of\namd_smn_init(), after 'amd_roots' is allocated.
  It became redundant\nand can be removed.\n\nReplace 'smn_exclusive' with directly
  checking 'amd_roots'"
