title: RTU500 has a vulnerability, where high-load scenarios, such as sending GI
  requests at short intervals, may cause a NULL pointer dereference in the last 
  entry of the enhanced message queue. This can cause a BCI_IEC104 fatal write 
  error, resulting in connection interruption and restart, and ultimately a 
  denial of service for bidirectional IEC 60870-5-104 communication.
