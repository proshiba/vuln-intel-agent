title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/crypto:
  Fix missing scrub of temp buffers with AES ctr and gcm algorithm\n\nIn function
  ctr_aes_crypt() there is a buffer used to process\nremaining bytes < AES_BLOCK_SIZE.
  This buffer was not scrubbed and\nthus could lead to expose of unwanted data. When
  the buffer is used\nexplicitly scrub it at the end of the code block to avoid exposure
  of\nmaybe sensitive data.\n\nIn a similar way the function gcm_aes_crypt() hat an
  error path where\nthe CPACF param block was not scrubbed. Instead of return early
  now\nthese error paths go to end of function where explicit scrubbing is\ndone.
  Similar with the buffers which are part of the gcm_sg_walk\nstructs from the variables
  gw_in and gw_out."
