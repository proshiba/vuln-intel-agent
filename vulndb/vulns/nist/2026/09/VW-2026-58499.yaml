title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd,
  nfsd: RCU-protect nlmsvc_ops dispatch\n\nnlmsvc_ops is published by nfsd_lockd_init()
  and cleared by\nnfsd_lockd_shutdown() with plain stores, while lockd dereferences\n\
  it unguarded from dispatch sites in fs/lockd/svcsubs.c. The pointer\ntargets nfsd's
  .rodata and the fopen/fclose callbacks live in nfsd's\n.text, so a stale load after
  rmmod nfsd results in either a NULL\nderef or a module-text use-after-free.\n\n\
  Declare nlmsvc_ops as __rcu, publish via rcu_assign_pointer(), clear\nvia RCU_INIT_POINTER()
  + synchronize_rcu(). Add a struct module\n*owner field to nlmsvc_binding and pin
  the module across indirect\ncalls with try_module_get/module_put. When the binding
  is torn down,\nfall back to fput() to avoid leaking struct file references."
