title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix NULL dereference in ath11k_qmi_m3_load()\n\nIf ab->fw.m3_data points
  to data, then fw pointer remains null.\nFurther, if m3_mem is not allocated, then
  fw is dereferenced to be\npassed to ath11k_err function.\n\nReplace fw->size by
  m3_len.\n\nFound by Linux Verification Center (linuxtesting.org) with SVACE."
