title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma: Serialize abort state updates\n\ndw_edma_abort_interrupt() drops vc.lock
  before changing request and\nstatus. issue_pending() can acquire the lock in that
  small window,\nobserve the old busy state, and skip starting queued descriptors.
  Then\nthe abort handler overwrites the channel status as idle, leaving the new\n\
  descriptors stranded for good.\n\nKeep descriptor completion and the state transition
  in the same critical\nsection."
