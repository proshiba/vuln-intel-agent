title: "Issue summary: An established DTLS 1.2 association using an AEAD cipher suite\n\
  can be terminated by a single unauthenticated datagram whose encrypted\nfragment
  is shorter than the mandatory explicit IV and authentication tag\noverhead.\n\n\
  Impact summary: An attacker who can send a datagram that is routed to an\nexisting
  DTLS 1.2 association can tear that association down without knowing\nany key material.
  This is a Denial of Service limited to the targeted\nassociation. There is no memory
  safety or confidentiality impact.\n\nCWE: CWE-1284: Improper Validation of Specified
  Quantity in Input\n\nDescription: In TLS 1.2 and DTLS 1.2 every record protected
  by an AEAD cipher\nsuite carries an explicit IV followed by the ciphertext and an
  authentication\ntag. When decrypting such a record the record layer passed the record
