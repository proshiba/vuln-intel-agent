title: "Path traversal vulnerability in Apache FreeMarker template loading mechanism,
  if the attacker can specify an arbitrary malformed locale identifier to FreeMarker,
  and the localized lookup configuration setting is enabled (it's by default enabled).\n\
  \nThis issue affects Apache FreeMarker from 2.2.0 through 2.3.34.\n\nUsers are recommended
  to upgrade to version 2.3.35. Disabling localized lookup in previous versions also
  mitigates this.\n\nNote that even in versions affected by this vulnerability, the
  files that can be loaded remain restricted by the TemplateLoader that FreeMarker
  is configured to use. In particular, FileTemplateLoader prevents attempts to traverse
  outside the baseDir specified in its constructor. Other TemplateLoader implementations
  may allow access outside their designated base directory, but they are still constrained
  by the underlying storage mechanism—for example, a loader wrapping a Java class
  loader can only access resources that the class loader can load, while one wrap"
