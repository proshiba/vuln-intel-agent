title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Harden bloom filter sizing and indexing on 32-bit kernels\n\nbloom_map_alloc() has
  two 32-bit-specific problems when the computed\nbitmap reaches the U32_MAX fallback
  case.\n\nFirst, BITS_TO_BYTES(U32_MAX) is evaluated with 32-bit arithmetic. The\n\
  addition performed by DIV_ROUND_UP wraps, so the map allocates only the\nfixed-size
  bloom filter object while keeping bitset_mask == U32_MAX.\nSubsequent updates can
  then write past the allocated object.\n\nSecond, fixing only the allocation size
  is not sufficient. The bloom hash\nis a u32, but set_bit() takes a signed long bit
  number and x86 test_bit()\neventually feeds the index to variable_test_bit(long,
  ...). On 32-bit\nkernels, hashes in [0x80000000, U32_MAX] therefore become negative
  bit\noffsets. x86 bt/bts with a memory operand interpret those offsets relative\n\
  to the supplied base, so a map with bitset_mask == U32_MAX can read or\nwrite before
  bloom->bitset even after allocati"
