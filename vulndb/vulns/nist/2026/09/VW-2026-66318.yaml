title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.2, when multiple KB categories have different editor roles assigned, a 
  user with knowledge_base.editor in one category can see answer titles and 
  updated_at timestamps from categories they do not have editor access to , via 
  the global quick search. Category names are not leaked, and opening the answer
  returns "Page not found," but the title alone may disclose sensitive 
  information. This vulnerability is fixed in 7.0.2.
