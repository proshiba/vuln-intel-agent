title: "The Ninja Forms  WordPress plugin before 3.15.2 does not restrict its REST
  abilities to administrators, accepting a Ninja Forms  WordPress plugin before 3.15.2-specific
  capability as equivalent to full site administration, which allows any user granted
  that capability to read Ninja Forms  WordPress plugin before 3.15.2 settings and
  stored form submissions, overwrite the Ninja Forms  WordPress plugin before 3.15.2's
  configuration, and create or modify arbitrary posts and pages.\nThe capability belongs
  to no default WordPress role and the Ninja Forms  WordPress plugin before 3.15.2
  never grants it, so an administrator must have assigned it, typically when delegating
  access to the form builder."
