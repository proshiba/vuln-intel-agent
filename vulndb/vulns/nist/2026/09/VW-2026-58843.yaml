title: A security flaw has been discovered in wxiaoqi Spring-Cloud-Platform 
  1.0/2.2/3.0. This issue affects the function OnlineController.getOnlineInfo of
  the file aceModules/ace-admin/auth/controller/OnlineController.java. The 
  manipulation results in missing authorization. The attack can be executed 
  remotely. The exploit has been released to the public and may be used for 
  attacks. The project was informed of the problem early through an issue report
  but has not responded yet.
