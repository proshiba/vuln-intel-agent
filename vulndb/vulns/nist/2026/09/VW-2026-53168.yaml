title: The WP File Download plugin for WordPress is vulnerable to arbitrary file
  deletion due to insufficient file path validation in the delete function in 
  all versions. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to delete arbitrary files on the server, 
  which can easily lead to remote code execution when the right file is deleted 
  (such as wp-config.php). The two-stage exploit requires a first request to the
  file.save task to persist the path-traversal string into file metadata, 
  followed by a second request to the file.delete task to trigger the unlink 
  call — both endpoints lack capability checks and nonce enforcement.
