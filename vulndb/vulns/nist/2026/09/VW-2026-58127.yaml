  opinfo->conn without any lock and\ndereferences it after two allocations which may
  sleep.  When the\ndurable handle owning the oplock is disconnected, session_fd_check()\n\
  clears opinfo->conn and drops its conn reference under ci->m_lock, and\nthe last
  ksmbd_conn_put() frees the connection.  A break triggered by\nanother connection
