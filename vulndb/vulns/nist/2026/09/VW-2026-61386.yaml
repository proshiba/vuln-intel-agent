title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  dwc3: clear forceRM when issuing EndTransfer\n\nThe forceRM bit of the DEPCMD register
  controls the behavior of the\nEndTransfer command used to stop an active transfer.
  Older DWC3\nprogramming guide revisions recommended setting forceRM=1 when\nissuing
  EndTransfer. Newer programming guide revisions recommend\nissuing EndTransfer with
  forceRM cleared.\n\nWith forceRM=1 on DWC_usb31 v2.00a and v2.10a controllers, a
  transfer\naborted through the ep_dequeue path was observed to remain active\nafter
  EndTransfer completion. A subsequent StartTransfer issued on the\nsame endpoint
  triggered writes associated with the aborted transfer.\nThis resulted in an SMMU
  fault because the transfer buffer had already\nbeen unmapped during EndTransfer
  command-completion cleanup.\n\nUsing forceRM=0 eliminates the issue. Although older
  DWC3 programming\nguide revisions recommended setting forceRM=1, no issues are known\n\
  from using forceRM=0. Clear for"
