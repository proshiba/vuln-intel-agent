title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme/ioctl:
  check SUBMIT_IO with nvme_cmd_allowed()\n\nUnlike IO_CMD / IO64_CMD, NVME_IOCTL_SUBMIT_IO
  never calls\nnvme_cmd_allowed(). Unprivileged callers can thus issue I/O on a\n\
  partition device or write through a read-only file descriptor.\n\nPass flags and
  open_for_write through and reject disallowed commands\nwith -EACCES."
