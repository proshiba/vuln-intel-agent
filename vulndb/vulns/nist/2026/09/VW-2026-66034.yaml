title: "In the Linux kernel, the following vulnerability has been resolved:\n\nppp_synctty:
  ensure a writeable skb header\n\nppp_sync_txmunge() checks headroom before prepending
  the address and\ncontrol bytes, but does not ensure that the skb header is writable.\n\
  A received skb can reach this function through PPP channel bridging\nwithout passing
  through ppp_start_xmit(), which calls skb_cow_head().\n\nFor example, a PPPoE frame
  may share its buffer with a clone queued to\nan AF_PACKET socket. If it is bridged
  to a synchronous tty channel, the\naddress/control bytes can overwrite data still
  visible to that socket.\n\nUse skb_cow_head() to ensure both sufficient headroom
  and a writable\nheader."
