title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  bus: Introduce acpi_bus_get_primary_device()\n\nThe function used for obtaining
  the first \"physical\" device for which\nthe given ACPI one is the ACPI companion,
  acpi_get_first_physical_node(),\nmay return a stale device pointer (mostly in theory)
  because\nacpi_unbind_one() may run as a whole after dropping the ACPI device's\n\
  physical_node_lock in acpi_get_first_physical_node() and before it\nreturns.  The
  last reference to the \"physical\" device may be dropped\nthen before the pointer
  to it is returned to the caller.\n\nIf that happens and the acpi_get_first_physical_node()
  caller invokes\nget_device() on the pointer obtained from it, which is done by the\n\
  majority of its callers, a use-after-free will occur.\n\nTo prepare for addressing
  this problem, introduce a new function for\ngetting the first \"physical\" device
  associated with the given ACPI one\n(the \"primary physical device\") that will
  also reference count the\ndevice in q"
