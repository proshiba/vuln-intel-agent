title: LibreOffice can import PICT images, which may be embedded in documents. 
  An out of bounds read existed when importing an image that uses a colour 
  palette. The palette index held in the image data was used without being 
  checked against the number of entries the palette has, so an index past the 
  last entry read memory outside the palette. In fixed versions the palette 
  index is limited to the entries present.
