title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Drop scalar id on sign-extending narrowing stack fills\n\nWhen a spilled scalar
  is filled back with a sign-extending narrowing load\n(BPF_MEMSX), check_stack_read_fixed_off()
  copies the spilled register\nincluding its scalar id, but coerce_reg_to_size_sx()
  then sign-extends the\nfilled register's value. If the same slot is also filled
  with a plain\nzero-extending load (BPF_MEM), both destination registers share the
  id yet\nhold different values. A later 'if <zext-reg> == const' then refines the\n\
  sign-extended register through sync_linked_regs() to a value it does not\nhave at
  runtime (e.g. the verifier believes 0x80000000 while the register\nis 0xffffffff80000000),
  which can be turned into an out-of-bounds access.\n\nDrop the shared scalar id at
  the sign-extension site in check_mem_access()\nwhen sign extension actually changes
  the value, mirroring the BPF_MOVSX\nhandling in check_alu_op() (no_sext = reg_umax
  < 2^(size*8-1))."
