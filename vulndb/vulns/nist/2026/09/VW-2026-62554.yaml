title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  mediatek: use devm_gpiochip_add_data() for GPIO chip\n\nThe gpio_chip is allocated
  with device-managed memory but registered with\nthe non-managed gpiochip_add_data().
  This was harmless while the drivers\nwere built-in, but once they can be built as
  modules and unbound/rmmod'd,\ndevm frees the gpio_chip's memory while it is still
  registered, causing a\nuse-after-free.\n\nRegister it with devm_gpiochip_add_data()
  so it shares the same\ndevice-managed lifecycle, which also lets the manual gpiochip_remove()\n\
  error paths go away."
