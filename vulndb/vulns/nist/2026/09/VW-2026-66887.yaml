title: MONAI through 1.6.0 contains an eval injection vulnerability in 
  _get_fake_spatial_shape() in monai/bundle/scripts.py. The function validates 
  shape expressions with a helper that walks the AST and only collects ast.Name 
  nodes, rejecting any name other than 'p' or 'n', before passing the string to 
  eval(). Expressions built solely from constants and attribute, subscript, or 
  call nodes (for example "(1).__class__.__bases__[0].__subclasses__()" or 
  "int.__class__.__init__.__globals__") contain no ast.Name nodes and therefore 
  bypass the allowlist. Because the shape value originates from bundle metadata 
  consumed by _get_real_input_data and verify_net_in_out (reachable through the 
  bundle 'verify_net_in_out' CLI flow), an attacker who can influence a bundle's
  metadata can escape the eval sandbox via object introspection chains and 
  achieve code execution in this non-default flow.
