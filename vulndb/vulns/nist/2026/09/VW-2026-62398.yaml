title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/gfx6:
  Use PFP on the compute queues too\n\nOn GFX6, the compute rings use the same CP
  path as\nthe graphics ring. The only difference is that they\ndon't support draw
  commands. (As opposed to GFX7 and\nnewer which have a separate command parser that
  is\ncalled MEC for compute queues.)\n\nThis means that we have to take into consideration\n\
  that the PFP also exists on compute queues on GFX6:\n\nUse PFP for register writes
  on both graphics and\ncompute queues.\n\nIn the pipeline sync, use the PFP to wait
  for the\nprevious fence (and not the ME) to prevent the PFP\nfrom starting to execute
  the next submission while\nthe ME is still in the previous submission.\n\nAfter
  a VM flush, emit PFP_SYNC_ME on compute\nqueues as well."
