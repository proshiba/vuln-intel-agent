title: A security flaw has been discovered in OctoPrint 1.0.0. Affected by this 
  issue is the function executeSystemCommand of the file 
  src/octoprint/server/api/system.py of the component Command API. Performing a 
  manipulation of the argument command results in os command injection. It is 
  possible to initiate the attack remotely. The exploit has been released to the
  public and may be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
