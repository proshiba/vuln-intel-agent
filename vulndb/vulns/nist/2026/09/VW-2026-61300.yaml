title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  hdac_hda: Fix hlink refcount leak on component registration failure\n\nhdac_hda_dev_probe()
  gets the HDA link with snd_hdac_ext_bus_link_get()\nbefore registering the ASoC
  component. If component registration fails,\nthe function returns without dropping
  the link reference.\n\nAlways call snd_hdac_ext_bus_link_put() after the registration
  attempt so\nthe reference taken during probe is balanced on both success and failure."
