title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Abort directly from the hardlockup handler\n\nscx_hardlockup() defers the abort
  to an irq_work because exit claiming used\nto take scx_sched_lock and couldn't run
  from NMI. The deferral is now\nunnecessary - claiming is NMI-safe and asserting
  ->aborting is exactly what\nbreaks the live-locks that hard-lock CPUs. Call handle_lockup()
  directly and\ndrop the irq_work. This also makes the self-detected case recoverable:
  the\nperf watchdog fires on the hard-locked CPU itself, where a queued irq_work\n\
  never runs with IRQs off.\n\nAlso fix the return value: %true used to be returned
  whenever sched_ext was\nloaded, suppressing the kernel's hardlockup report even
  when the abort was\nrefused. Return %true only when this call initiated the abort."
