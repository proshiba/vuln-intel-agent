title: "Unverified ownership of a storage access point in the volume deletion component
  of the Amazon EFS CSI Driver before v3.4.1 might allow an authenticated Kubernetes
  user with PersistentVolume creation privileges to cause recursive deletion of directories
  on an EFS filesystem they are not authorized to access, via a crafted PersistentVolume
  volumeHandle that pairs an access point from one filesystem with a different target
  filesystem.\n\n\n\nTo remediate this issue, users should upgrade to version v3.4.1."
