title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  mdb: Fix use-after-free in vxlan_mdb_remote_src_del()\n\nvxlan_mdb_is_valid_source(),
  which validates MDBE_ATTR_SOURCE and every\nMDBE_ATTR_SRC_LIST member, accepts the
  all-zeros address.\n\nA source list is only accepted on a (*, G) entry, whose source
  is the\nall-zeros address, and for each member of the list an (S, G) entry is\n\
  derived from it by substituting the source. Entries are keyed by a plain\nmemcmp()
  of struct vxlan_mdb_entry_key, so if MDBE_ATTR_SOURCE is present\nand holds the
  all-zeros address and the source list holds it as well, the\nderived (S, G) key
  is byte-identical to the (*, G) key and resolves to the\nsame entry. Omitting MDBE_ATTR_SOURCE
  is not equivalent, as the key is\nthen left with a zero address family.\n\nvxlan_mdb_remote_src_del()
  removes the forwarding entry of a source before\nfreeing the source entry:\n\n\t
  vxlan_mdb_remote_src_fwd_del(vxlan, group, remote, &ent->addr);\n\tvxlan_mdb_remote_src_ent"
