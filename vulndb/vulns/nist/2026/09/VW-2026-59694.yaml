title: A vulnerability was identified in zyx0814 FilePress up to 3.0.1. This 
  vulnerability affects unknown code of the file dzz/publish/search.php of the 
  component Publish Module. Such manipulation of the argument orderby/order 
  leads to sql injection. The attack can be launched remotely. The exploit is 
  publicly available and might be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
