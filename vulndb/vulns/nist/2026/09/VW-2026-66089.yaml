title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  fix cmd_regs access racing BAR unmap on reset\n\npdsc_reset_prepare() and pdsc_reset_done()'s
  pdsc_map_bars() error path\nclear/iounmap cmd_regs without devcmd_lock, and\npdsc_legacy_firmware_update()'s
  download loop derefs cmd_regs after\ndropping and retaking the lock without re-checking.
  An FLR concurrent\nwith a devlink flash can unmap cmd_regs under an in-flight devcmd,\n\
  causing a NULL deref or a write to unmapped MMIO.\n\nTake devcmd_lock across the
  BAR unmap/remap, and re-check cmd_regs in\nthe download loop. Only the PF maps cmd_regs
  and runs devcmd, so skip\nthe unmap on a VF, as pdsc_remove() and pdsc_reset_done()
  already do.\n\nA reset that completes entirely within the unlocked window is not
  a\ncorrectness problem for the image: the device clears its update session,\nso
  a resumed download is rejected, and it verifies the staged image\nbefore writing
  a flash slot, reporting PDS_RC_BAD_FW rather than\nactivating it"
