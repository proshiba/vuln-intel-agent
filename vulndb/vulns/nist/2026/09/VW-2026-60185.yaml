title: "pdfforge PDF Architect activation-service Update Service Uncontrolled Search
  Path Element Local Privilege Escalation Vulnerability. This vulnerability allows
  local attackers to escalate privileges on affected installations of pdfforge PDF
  Architect. An attacker must first obtain the ability to execute low-privileged code
  on the target system in order to exploit this vulnerability.\n\nThe specific flaw
  exists within the activation-service process. The product loads a library from an
  unsecured location. An attacker can leverage this vulnerability to escalate privileges
  and execute code in the context of SYSTEM. Was ZDI-CAN-29536."
