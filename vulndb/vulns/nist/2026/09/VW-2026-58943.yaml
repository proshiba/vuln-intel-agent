title: A flaw has been found in GPAC up to f1219cde. Affected by this 
  vulnerability is the function gf_node_get_field_count of the file 
  scenegraph/base_scenegraph.c of the component MP4Box. Executing a manipulation
  can lead to reachable assertion. It is possible to launch the attack on the 
  local host. The exploit has been published and may be used. Upgrading to 
  version abi-16.23 addresses this issue. This patch is called 
  49dee5cad329cfed310c1682703df7daa47df31a. You should upgrade the affected 
  component.
