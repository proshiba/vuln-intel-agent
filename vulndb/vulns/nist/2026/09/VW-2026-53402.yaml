title: "BIG-IP has a vulnerability where an authenticated user of any role may be
  able to create administrative user accounts through an undisclosed request to Traffic
  Management User Interface (TMUI).\n\n\n\n\nImpact:\n\nThis vulnerability may allow
  an authenticated attacker with network access to the BIG-IP management interface
  to escalate privileges by creating administrative accounts on the BIG-IP system.
  There is no data plane exposure; this is a control plane issue only.\n\n\n\n\nNote:
  Software versions which have reached End of Technical Support (EoTS) are not evaluated."
