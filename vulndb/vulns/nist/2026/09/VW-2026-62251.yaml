title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  check for NULL root inode in fuse_fill_super_submount\n\nfuse_iget() can return
  NULL when its inode allocation fails, but\nfuse_fill_super_submount() passed the
  result straight to get_fuse_inode()\nand decremented fi->nlookup without checking
  it:\n\n        root = fuse_iget(sb, parent_fi->nodeid, ...);\n        fi = get_fuse_inode(root);\n\
  \        fi->nlookup--;\n\nInside fuse_iget() the inode allocation can fail and
  return NULL.  The\nsubmount root takes the iget5_locked() path, whose alloc_inode()
  can fail\nunder memory pressure (the auto-submount branch can fail the same way
  in\nnew_inode() or fuse_alloc_submount_lookup()):\n\n        inode = iget5_locked(sb,
  nodeid, fuse_inode_eq, fuse_inode_set,\n                             &nodeid);\n\
  \        if (!inode)\n                return NULL;\n\nA NULL root makes get_fuse_inode()
  a container_of() on NULL and the\nnlookup decrement a write to a bogus address,
  oopsing the mount.  With\nCON"
