title: Wallos is an open-source, self-hostable personal subscription tracker. 
  From version 4.0.0 to before version 4.9.6, Wallos's OIDC login links an 
  incoming OIDC identity to an existing local account by matching the email 
  claim alone, without verifying that the IdP marked that email as verified 
  (email_verified). When Wallos is configured against an IdP that lets a user 
  present an arbitrary or unverified email (multi-tenant IdPs, IdPs with open 
  self-registration, or any IdP the attacker partly controls), an attacker with 
  no Wallos account can authenticate with the admin's email and be logged in as 
  the admin — full account takeover, no password needed. This issue has been 
  patched in version 4.9.6.
