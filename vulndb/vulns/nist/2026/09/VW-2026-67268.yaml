title: A flaw was found in the Micrometer user-event metrics listener of 
  Keycloak, a solution for integrated identity and access management. The issue 
  occurs when the listener is configured to include the idp tag. An 
  unauthenticated attacker can send requests to the identity broker login 
  endpoint using arbitrary provider aliases, causing the system to create an 
  unlimited number of metric time series. This can lead to excessive memory 
  consumption and degrade the performance of both the server and its monitoring 
  tools.
