title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Fix queue teardown NULL dma_free and bitmap locking\n\nqla25xx_free_req_que()
  and qla25xx_free_rsp_que() have two pre-existing\nbugs exposed on the error path
  of qla25xx_create_{req,rsp}_que():\n\n 1. When dma_alloc_coherent() fails during
  queue creation, the error\n    path calls the free function with req->ring / rsp->ring
  still NULL\n    (from kzalloc).  The unconditional dma_free_coherent() with a NULL\n\
  \    cpu_addr is undefined behavior and can panic.\n\n 2. The free functions clear
  req_qid_map / rsp_qid_map under vport_lock,\n    but the create functions protect
