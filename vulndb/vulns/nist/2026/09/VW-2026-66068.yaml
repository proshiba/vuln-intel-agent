title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nfnetlink_log: cope with concurrent instance destruction\n\nInstances are refcounted.
  However, only memory release happens on the\n1 -> 0 transition; the unlink from
  hashes can occur with any refcount.\n\nUncooperative userspace can force a situation
  where a queue is pending\nfor destruction from netlink event while a different socket
  with same\nportid processes an UNBIND request.\n\nWith right timing, this will unhash
  the instance again:\n\nOops: general protection fault, [..]\nCall Trace:\n <TASK>\n\
  \ nfulnl_recv_config+0x31a/0xd50\n nfnetlink_rcv_msg+0x7c2/0xeb0"
