title: Snipe-IT before 8.7.0 contains an authorization bypass vulnerability in 
  Livewire components that enforce authorization only at the route level, not 
  within component lifecycle methods. Attackers with a valid authenticated 
  session can replay signed component snapshots via POST /livewire/update to 
  invoke protected methods and escalate privileges, including creating OAuth 
  clients, minting personal access tokens, and accessing sensitive admin data.
