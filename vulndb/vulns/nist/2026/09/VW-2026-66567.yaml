title: "OpenClaw (npm package 'openclaw') before 2026.7.1 improperly handles case
  sensitivity in the model-facing cron tool: a mixed-case payload kind can pass the
  agent-facing shell-execution guard and later normalize into a command job. An actor
  able to steer a tool-enabled agent can therefore create a persistent cron job that
  executes attacker-selected commands with the privileges of the OpenClaw process
  user, resulting in access to host files and credentials and impact to scheduled
  service availability. The issue is limited to cron jobs created or edited through
  the model-facing cron tool; direct CLI and authorized Gateway scheduling surfaces
  are trusted operator controls. Fixed in 2026.7.1."
