title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  avoid divide-by-zero in __is_lut_linear()\n\n__is_lut_linear() computes the expected
  value of each entry with\n\n\texpected = i * MAX_DRM_LUT_VALUE / (size - 1);\n\n\
  If it is ever called with a single-entry LUT, size - 1 is zero and the\nkernel takes
  a divide error (#DE). A LUT with fewer than two entries\ncannot describe a linear
  mapping anyway, so return false early instead\nof dividing by zero."
