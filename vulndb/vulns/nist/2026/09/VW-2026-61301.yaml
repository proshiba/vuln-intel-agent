title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  cs35l34: drain threaded IRQ before runtime suspend\n\ncs35l34_runtime_suspend()
  currently switches the codec into\nregcache_cache_only(true), asserts reset low,
  and powers the device off\nwithout first quiescing the threaded IRQ registered by\n\
  devm_request_threaded_irq(). That leaves a window where\ncs35l34_irq_thread() can
  still run after suspend has removed live\nhardware access.\n\nA running system can
  reach this during runtime PM while the driver still\nhas critical fault IRQs unmasked.
  If the threaded handler runs in that\nwindow, it reads volatile INT_STATUS_1..4
  after cache_only has been\nenabled, ignores the regmap_read() failures, and can
  still execute the\nPROT_RELEASE_CTL release sequence or the BST fault power-down
  writes.\n\nUse disable_irq() before entering cache_only/reset-low/power-off so any\n\
  in-flight threaded handler is drained and no new IRQ thread can run\nwhile the device
  is suspended. Re-enable the IRQ onl"
