title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel:
  ethosu: Ensure cmd stream ends with a stop op\n\nWhile the QSIZE register setting
  should prevent an out of bounds access\nof the command stream, it is not clear whether
  the h/w generates an\ninterrupt in this case as is required (to prevent a timeout).
  As a stop op\nis expected end of the command stream, let's just ensure it is present.
  A\nstop op in the middle of the command stream also makes no sense."
