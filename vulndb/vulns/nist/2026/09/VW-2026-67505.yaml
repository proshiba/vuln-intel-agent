title: 'A flaw has been found in owen2345 Camaleon CMS up to 2.9.2. Impacted is the
  function crop of the file app/controllers/camaleon_cms/admin/media_controller.rb
  of the component Media Crop Handler. This manipulation of the argument saved_avatar
  causes authorization bypass. The attack may be initiated remotely. The exploit has
  been published and may be used. Upgrading to version 2.9.3 is recommended to address
  this issue. Patch name: c143e145caa600947e70a240e87f2fed889149d3. It is suggested
  to upgrade the affected component.'
