title: A use-after-free vulnerability was found in QEMU's 9pfs subsystem. A race
  condition between the main thread and a worker thread when processing 
  concurrent Tlcreate and Twalk requests allows a malicious guest user to craft 
  a fid path containing stale heap data, bypassing directory traversal 
  restrictions and escaping the shared directory boundary. This can lead to 
  arbitrary host file read/write and code execution (VM escape) as the QEMU 
  process user.
