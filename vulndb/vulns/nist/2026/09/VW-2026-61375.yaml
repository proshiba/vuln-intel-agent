title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: fix null pointer dereference in usb_put_function_instance()\n\nusb_put_function_instance()
  attempts to dereference fd inside fi struct\nto get mod in uvc_alloc_inst() error
  path. However, fd is not allocated\nuntil later in try_get_usb_function_instance()
  after allocating fi in\nuvc_alloc_inst() and thus guranteed to be null in error
  path. Fix this\nby adding a null check for fi->fd that returns if fd is null."
