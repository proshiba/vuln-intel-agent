title: "Affected versions of MISP allow any authenticated user to access TemplatesController::uploadFile()
  because the ACL entry for templates/uploadFile used the wildcard *. This bypasses
  the intended role restrictions applied to neighboring template-management operations.\n\
  \n\nThe upload handler accepts arbitrary content with only minimal checks and writes
  it into app/tmp/files/. A low-privileged or read-only user can therefore repeatedly
  upload files and consume server disk space without requiring perm_add or perm_template.
  The fix changes the ACL requirement from * to perm_add.\n\nThe commit also rules
  out stronger impacts: uploaded files receive random names, path traversal/predictable
  overwrite is not available, the temporary directory is outside the web root, and
  the files are not directly served over HTTP. Therefore, the issue should not be
  described as arbitrary file overwrite, stored XSS, or RCE.\n\nVersion affected: ≤2.5.45"
