title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  eswin: Zero-initialize stack-allocated clk_init_data\n\neswin_clk_register_pll()
  and eswin_register_clkdiv() declare a struct\nclk_init_data on the stack and only
  initialize some of its fields\n(parent_data respectively parent_hws). clk_core_populate_parent_map()\n\
  checks parent_names first and parent_data second before falling back\nto parent_hws,
  so leftover stack garbage in the uninitialized fields\nhijacks parent resolution
  and the clk core dereferences a bogus\npointer:\n\n  Unable to handle kernel NULL
  pointer dereference at virtual address 000000000000000c\n  Oops [#1]\n  epc : __clk_register+0x31a/0x7f0\n\
  \  [<ffffffff805dc774>] __clk_register+0x31a/0x7f0\n  [<ffffffff805dcd76>] devm_clk_hw_register+0x2a/0x94\n\
  \  [<ffffffff805e319a>] eswin_register_clkdiv+0x80/0xd0\n  [<ffffffff805e34a0>]
  eswin_clk_register_clks+0x162/0x1a0\n  [<ffffffff805e3736>] eic7700_clk_probe+0x146/0x180\n\
  \  [<ffffffff8065d23c>] platform_probe+0x3c/0x7a\n\n"
