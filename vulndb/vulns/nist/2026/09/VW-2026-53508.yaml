title: A vulnerability was determined in simular-ai Agent-S up to 0.3.2. 
  Affected by this vulnerability is the function ImageData of the file 
  gui_agents/s1/utils/ocr_server.py of the component OCR HTTP API. Executing a 
  manipulation of the argument img_bytes can lead to resource consumption. The 
  attack may be launched remotely. The exploit has been publicly disclosed and 
  may be utilized. The vendor was contacted early about this disclosure but did 
  not respond in any way.
