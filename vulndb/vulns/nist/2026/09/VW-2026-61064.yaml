title: A flaw was found in the first broker login flow of Keycloak. When a user 
  confirms an account-linking request from a different browser, a temporary 
  proof is created to validate the link. However, this proof is not properly 
  cleared after the link is established or when the user later manually removes 
  the link. An attacker who controls the external identity can exploit this 
  leftover proof to silently re-establish the link and gain unauthorized access 
  to the victims account without any further confirmation.
