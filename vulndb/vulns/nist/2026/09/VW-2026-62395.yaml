title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhugetlbfs:
  release subpool on fill_super failure\n\nhugetlbfs_fill_super() allocates a hugepage
  subpool when size or min_size\nmount options are specified.  hugepage_new_subpool()
  may also reserve huge\npages for min_size.\n\nIf root dentry creation fails after
  the subpool is created, the failure\npath frees the subpool with kfree().  This
  bypasses hugepage_put_subpool()\nand can leave min_size reservations charged.\n\n\
  Use hugepage_put_subpool() on the failure path, matching the normal\nput_super path."
