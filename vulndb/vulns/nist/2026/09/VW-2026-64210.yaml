title: LibreOffice can read CFF fonts, which may be embedded in documents. A 
  stack buffer overflow existed when reading the hints of a glyph. The number of
  hints was checked against the wrong bound, so a glyph declaring more hints 
  than the array can hold wrote past its end. In fixed versions the hint count 
  is checked against the capacity the array really has.
