title: fastify versions before 5.12.2 treat the object resolved by a successful 
  Ajv async validator as the value result protocol used by custom validator 
  compilers. If a request that passes its route schema contains a property named
  value at the root, fastify replaces the entire request body with that 
  property's value before the handler runs, so the handler receives a different 
  object than the one that satisfied the schema. An authenticated low-privilege 
  caller can use this to make nested data replace the validated body and trigger
  an operation the route schema did not authorize, leading to unauthorized state
  changes and data disclosure. Users should upgrade to fastify 5.12.2 or later.
