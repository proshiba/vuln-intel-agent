title: SunEditor is a lightweight and powerful WYSIWYG editor in vanilla 
  JavaScript with no dependencies. Prior to 2.47.11, the sanitizer in 
  src/lib/core.js does not consistently reject namespaced or custom HTML 
  elements, allowing event-handler attributes to remain on crafted elements. 
  When an application renders attacker-controlled editor content and a user 
  interacts with the element, the retained handler can execute script in the 
  application's browser origin, enabling stored cross-site scripting, data 
  exposure, or unauthorized browser-context actions. This issue is fixed in 
  version 2.47.11.
