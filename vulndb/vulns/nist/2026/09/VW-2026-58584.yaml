title: libks provides foundational support for signalwire C products. Prior to 
  version 2.0.11, `clean_uri()` in libks's HTTP request parser fails to reject 
  URIs whose path has more segments than its internal canonicalization buffer 
  can hold. The canonicalization step silently passes such URIs through with 
  embedded ".." sequences intact, enabling path traversal in any consumer that 
  later joins the URI with a filesystem path. Version 2.0.11 patches the issue.
