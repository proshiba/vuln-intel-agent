title: 'Axios is a promise-based HTTP client for the browser and Node.js. From 1.13.0
  until 1.20.0, Http2Sessions does not install adequate error handling for a ClientHttp2Session
  during Axios HTTP/2 session initialization or reuse. A request uses httpVersion:
  2 and the ClientHttp2Session emits an error during session initialization or reuse.
  The unhandled session error escapes normal Promise rejection handling. The uncaught
  error can terminate the Node.js process and cause denial of service. This issue
  is fixed in version 1.20.0.'
