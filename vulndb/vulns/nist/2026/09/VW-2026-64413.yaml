title: "Missing authorization in Amazon amazon-connect-salesforce-lambda before 5.26
  allows any IAM principal with lambda:InvokeFunction permission on the affected function
  to escalate privileges and perform AWS API operations that their own IAM identity
  is explicitly denied, via invocation of a Lambda function that dispatches caller-supplied
  parameters to privileged service APIs without authorization validation.\n\n\n\n\
  To remediate this issue, we recommend upgrading to version 5.26 or later. After
  setup is complete, either delete or disable the sfExecuteAWSService function. If
  you retain the function, restrict invocation to the intended IAM user only."
