title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost-scsi:
  flush backend after device ioctls\n\nvhost-scsi translates guest response descriptors
  into userspace iovecs\nwhen commands are submitted.  Target-core completes those
  commands\nasynchronously, so VHOST_SET_MEM_TABLE can replace the memory table while\n\
  an in-flight command still retains response iovecs translated through the\nold table.\n\
  \nIf the old mapping is reused after VHOST_SET_MEM_TABLE returns, command\ncompletion
  can write the response to an unrelated userspace object.\n\nFlush the vhost-scsi
  backend after vhost_dev_ioctl() handles a device\nioctl.  This waits for in-flight
  commands that can still use the old\nresponse iovecs before the ioctl returns."
