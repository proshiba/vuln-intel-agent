title: The All-in-One WP Migration and Backup WordPress plugin before 7.111 does
  not perform any capability check on several of its AJAX actions, gating them 
  only on an installation-wide secret which it discloses to any user permitted 
  to export the site, allowing such a user to import an arbitrary site archive 
  and gain administrator access. Exploitation requires an administrator to have 
  granted the export capability to a role that does not hold the All-in-One WP 
  Migration and Backup WordPress plugin before 7.111's own import capability, 
  which is not a default configuration.
