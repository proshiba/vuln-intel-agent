title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_api: fix teardown of an adopted proto on insert-race loss\n\nIn tc_new_tfilter()
  the create branch sets tp_created = 1 before calling\ntcf_chain_tp_insert_unique().
  When the caller loses the race (another\nrequest inserted a proto at the same chain/prio
  first), insert_unique()\ndestroys the caller's own tp_new and returns the winner's
  proto with an\nextra reference. tp_created was never cleared, so the loser's errout\n\
  path treated the winner's live proto as its own and called\ntcf_chain_tp_delete_empty()
  on it, silently unlinking an active\nclassifier that the winning request already
  advertised via\nRTM_NEWTFILTER.\n\nTrack the outcome of the insert step in a single
  tri-state variable so\neach errout path reacts correctly:\n\n- TP_NOT_CREATED: no
  proto created; pursue the old path.\n- TP_CREATED: proto inserted successfully;
  same code path as before.\n- TP_NOT_OWNED: New - lost the insert race; tp is another
  request's p"
