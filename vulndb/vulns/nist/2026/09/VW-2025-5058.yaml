title: Multiple vulnerabilities in Aqara Hub firmware update process in the 
  Camera Hub G3 4.1.9_0027, Hub M2 4.3.6_0027, and Hub M3 4.3.6_0025 devices, 
  allow attackers to install malicious firmware without proper verification. The
  device fails to validate firmware signatures during updates, uses outdated 
  cryptographic methods that can be exploited to forge valid signatures, and 
  exposes information through improperly initialized memory.
