title: A security vulnerability has been detected in webgjc web_robot 
  2.4.0/2.5.0/2.8.0. The affected element is the function 
  controller_listen/controller_recover of the file py/web.py. The manipulation 
  of the argument case_name leads to os command injection. It is possible to 
  initiate the attack remotely. The exploit has been disclosed publicly and may 
  be used. The vendor was contacted early about this disclosure but did not 
  respond in any way.
