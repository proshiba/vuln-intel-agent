title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  mediatek: free EINT resources on unbind\n\nmtk_eint_do_init() creates an IRQ domain,
  populates it with a mapping for\nevery EINT line and installs a chained handler
  on the parent interrupt,\nbut none of these are ever released. This was harmless
  while the drivers\nwere built-in, but now that they can be built as modules and\n\
  unbound/rmmod'd it leaves behind a dangling IRQ domain, interrupt mappings\nwhose
  chip data points at freed memory, and a chained handler that keeps\nfiring into
  that freed data.\n\nThe plain allocations in mtk_eint_do_init() already use the
  device-managed\ndevm_*() helpers, so tear the remaining resources down the same
  way:\nregister a devm action that detaches the chained handler, waits for any\n\
  in-flight handler to finish, disposes of the per-line mappings and removes\nthe
  IRQ domain. This mirrors the device-managed lifecycle adopted for the\nGPIO chip
  and keeps the whole EINT setup self-cleaning on "
