title: The Temporary Login Without Password WordPress plugin before 1.9.9 does 
  not prevent a temporary user from creating an Application Password, and does 
  not revoke one when the temporary access expires or is disabled, allowing the 
  recipient of a temporary login to retain working access to the site over REST 
  and XML-RPC after the administrator believes it has been withdrawn. The 
  retained access carries whatever role was granted, which for the Temporary 
  Login Without Password WordPress plugin before 1.9.9's main use case is 
  Administrator.
