title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  reject dynamic fdb entries that reference a nexthop id\n\nThe commit cited in the
  Fixes tag allowed VXLAN FDB entries to point to\nFDB nexthops so that overlay traffic
  could be load balanced across\nmultiple VTEPs. Such entries can only be configured
  from user space,\ncannot be learned and cannot roam. They only make sense with a
  user space\ncontrol plane such as E-VPN where data plane learning is disabled.\n\
  \nDespite that, the VXLAN driver does not currently prevent such entries\nfrom being
  configured with the \"dynamic\" flag. The per-nexthop FDB list\nis only protected
  by the per-device hash lock, which is not sufficient\nwhen two VXLAN devices point
  to the same FDB nexthop and therefore share\nthe list. Aging runs in softirq context
  without RTNL, so an entry deleted\nby one device can race with an addition or deletion
  from the other,\nleading to list corruption:\n\n  list_del corruption. next->prev
  should be ffff8881069d9548"
