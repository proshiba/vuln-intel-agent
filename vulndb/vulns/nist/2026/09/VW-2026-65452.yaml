title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nfnetlink_log: wait for rcu grace period before freeing pernet state\n\nsashiko
  reports: \"nfnl_log_net_exit() calls nf_log_unset(), which\nclears the logger pointer
  without an RCU grace period.  Immediately after,\nops_free_list() frees the per-net
  state while concurrent packets might\nstill be executing nf_log_packet() under rcu_read_lock().\"\
  \n\nClear the pointer via .pre_exit to make sure rcu readers have completed\nbefore
  pernet storage is free'd.  The change in nf_log_syslog.c is only\ndone for consistency:
  it doesn't use pernet data."
