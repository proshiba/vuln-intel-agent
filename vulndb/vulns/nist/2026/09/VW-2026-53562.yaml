title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthunderbolt:
  Fix bandwidth group reservation indexing\n\nValid bandwidth group IDs range from
  1 through MAX_GROUPS, while Group\nID 0 is reserved. tb_consumed_dp_bandwidth()
  uses the Group ID directly\nto index its local group_reserved[] array.\n\nThe array
  currently has MAX_GROUPS entries, so its valid indices are 0\nthrough MAX_GROUPS
  - 1. Group ID MAX_GROUPS therefore accesses one\nelement past the end, and the final
  group's reserved bandwidth is not\nincluded when the array is summed.\n\nGive group_reserved[]
  MAX_GROUPS + 1 entries so direct Group ID\nindexing covers the reserved ID 0 and
  valid IDs 1 through MAX_GROUPS."
