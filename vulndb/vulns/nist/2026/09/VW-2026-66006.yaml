title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix memory corruption from the histogram stacktrace modifier\n\nparse_field() sets
  HIST_FIELD_FL_STACKTRACE from the \".stacktrace\"\nmodifier before it looks the
  field name up, and nothing afterwards\nchecks that the name resolved to a field
  which holds a stacktrace.\ncreate_hist_field() picks HIST_FIELD_FN_STACK on the
  strength of the\nfield pointer alone, which reads a __data_loc word from the record
  and\nfollows its low 16 bits as an offset into the same record.\nevent_hist_trigger()
  takes the first word there as an entry count and\ncopies that many longs into a
  31 entry array:\n\n\tn_entries = *stack;\n\tmemcpy(entries, ++stack, n_entries *
  sizeof(unsigned long));\n\nNeither end of that copy is bounded, and the count is
  whatever the event\nholds at the offset, so any field will do:\n\n  # cd /sys/kernel/tracing/events/sched/sched_process_fork\n\
  \  # echo 'hist:keys=parent_pid.stacktrace' > trigger\n  # (true)\n\n  BUG: kernel
  NULL"
