title: elFinder is an open-source file manager for web, written in JavaScript 
  using jQuery UI. Prior to 2.1.70, checkExtractItems() in 
  php/elFinderVolumeDriver.class.php calls mimetypeInternalDetect() without 
  passing the result through mimeTypeNormalize(). Because the .phtml, .phar, 
  .php5, and .php3 extensions are absent from mime.types, the staticMimeMap 
  entries that map them to text/x-php are not applied, and allowPutMime() 
  permits extraction even when uploadDeny blocks text/x-php. An attacker with 
  ZIP upload permission can extract PHP-executable files into a web-accessible 
  files/ directory and achieve remote code execution when the server executes 
  those extensions. This issue is fixed in version 2.1.70.
