title: Cross-Site Request Forgery (CSRF) in Apache Roller 6.1.5 allows a remote 
  attacker to cause a logged-in user to perform state-changing actions under the
  victim's authority, because the CSRF validation filters accept a request that 
  does not submit the required salt token, validating instead against a value 
  the server itself generated for the request. No optional feature or 
  non-default configuration is required; any logged-in author or administrator 
  is affected when induced to visit a crafted page. Users are recommended to 
  upgrade to Apache Roller 6.1.6 or later, which validates only the submitted 
  salt and applies the same check to multipart forms.
