title: "ScadaLTS 2.8.1-release-candidate build 0 is affected by an Authorization Bypass\n\
  \n\n\nSpring Security gates DWR endpoints by URL path pattern, but DWR itself dispatches
  method calls based on the POST body parameters c0-scriptName and c0-methodName.
  The crossDomainSessionSecurity setting in web.xml is set to false, which disables
  DWR's built-in origin validation. This means any authenticated user can invoke any
  DWR method (regardless of the URL-based access control) by sending their request
  to a URL they are permitted to access (e.g. MiscDwr.initializeLongPoll.dwr) while
  targeting a restricted class in the POST body.\n\n\n\nThis is the systemic root
  cause that enables multiple other findings to be exploited as a low privilege user."
