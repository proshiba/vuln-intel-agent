title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm:
  Only fini scheduler after successful init\n\nmsm_ringbuffer_new() destroys a partially
  initialized ring through\nmsm_ringbuffer_destroy() when an allocation or scheduler
  setup step\nfails.\n\nIf drm_sched_init() fails before it finishes initializing
  the scheduler,\nthe failure path still calls drm_sched_fini(). That teardown path
  assumes\nthe scheduler work items, lists, and workqueue state were initialized.\n\
  \nTrack successful scheduler initialization and call drm_sched_fini() only\nafter
  drm_sched_init() returned 0.\n\nThis issue was found by a static analysis checker
  and confirmed by\nmanual source review.\n\nPatchwork: https://patchwork.freedesktop.org/patch/738905/"
