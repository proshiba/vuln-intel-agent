title: "The LdapAuth and LinOTPAuth authentication plugins in MISP contain an authentication
  bypass vulnerability. Both LdapAuthenticate and LinOTPAuthenticate replace CakePHP's
  FormAuthenticate class but fail to replicate its _checkFields() input validation
  guard. As a result, the email and password fields extracted from the login request
  are passed to downstream authentication logic without verifying that they are non-empty
  strings.\n\nIn the LDAP authenticator, an empty or null password is forwarded to
  ldap_bind(). Per RFC 4513 section 5.1.2, a bind request with a valid DN and an empty
  password constitutes an unauthenticated bind, which many LDAP directory servers
  accept as successful. An attacker who knows any valid user email address in the
  directory can therefore authenticate as that user without possessing a password.
  Additionally, non-string values (null, false, arrays) are either coerced to empty
  strings by ldap_bind(), raise TypeErrors, or are misinterpreted as find conditions
  in _find"
