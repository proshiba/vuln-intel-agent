title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  xilinx-trng - Remove crypto_rng interface\n\nImplementing the crypto_rng interface
  has no purpose, as it isn't used\nin practice.  It's being removed from other drivers
  too.  Just remove\nit.  This leaves hwrng, which is actually used.\n\nTagging with
  'Cc stable' due to the bugs that this removes:\n\n  - xtrng_trng_generate() sometimes
  returned success even when it didn't\n    fill in all the bytes.\n\n  - It was possible
  for xtrng_trng_generate() and\n    xtrng_hwrng_trng_read() to run concurrently and
  interfere with each\n    other, as the locking code in xtrng_hwrng_trng_read() was
  broken."
