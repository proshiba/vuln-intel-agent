title: The Flex Import plugin for WordPress is vulnerable to Missing 
  Authorization in all versions up to, and including, 3.0. This is due to the 
  license_activate_fleximp() and license_deactivate_fleximp() functions, hooked 
  to the wp_ajax_license_activate_fleximp and wp_ajax_license_deactivate_fleximp
  AJAX actions, lacking both a capability check (current_user_can()) and nonce 
  verification (the client-side script sends a 'wpnonce' value but the handlers 
  never validate it). This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to activate an arbitrary/fraudulent license
  key (persisting it via update_option('fleximp_is_premium') and toggling 
  validation, suspension, and bundle status options) or deactivate the site's 
  legitimate license (deleting the stored key and setting 
  fleximp_validation_status to false), thereby disrupting the plugin's premium 
  functionality.
