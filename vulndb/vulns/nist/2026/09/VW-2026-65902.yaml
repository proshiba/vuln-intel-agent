title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: avoid leaking refcount when cifs_sb_tlink() fails\n\ncifs_oplock_break()
  takes over the reference that\ncifs_queue_oplock_break() acquired when it queued
  the work, and drops it\nwith _cifsFileInfo_put() once the break has been processed.\n\
  \nOnly in setups with \"-o multiuser\", cifs_sb_tlink() may fail, at which\npoint
  cifs_oplock_break() returns without putting the file reference,\nmirroring the reference
  leak we already fixed in the companion patch to\ncifs_queue_oplock_break().\n\n\
  This would trigger a crash due to busy inodes on the next unmount:\n\n  BUG: Dentry
  ... still in use (1) [unmount of cifs cifs]\n  VFS: Busy inodes after unmount of
  cifs (cifs)\n\nDrop the reference on that path as well. Doing so before the out
  label\nmirrors the normal path, which also puts the reference before\ncifs_done_oplock_break().\n\
  \nFound by Sashiko code review. The failure path was not exercised at\nruntime."
