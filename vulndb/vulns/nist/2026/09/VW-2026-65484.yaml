title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: caiaq: validate EP1 reply lengths\n\nusb_ep1_command_reply_dispatch()
  uses buf[0] as a command byte and then\nreads command-specific fixed items from
  the same URB buffer. Several\npaths use buf + 1, buf[1], buf[2], or buf + 3 without
  first proving that\nurb->actual_length contains those bytes.\n\nAdd per-command
  length checks, use a payload length derived from the\nbytes after the command byte
  for the control-state copy, and reject short\nanalog input payloads before the input
  helper reads fixed offsets from\nthe EP1 reply."
