title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Avoid IDR updates while cleaning channels\n\nscmi_cleanup_channels() walks
  the TX/RX channel IDRs with\nidr_for_each() to free transport resources and destroy
  the dedicated\ntransport devices before calling idr_destroy().\n\nThe destroy callback
  removed each entry from the same IDR being walked.\nThat is not needed for this
  cleanup path, and it is unsafe because\nidr_for_each() has not advanced its radix-tree
  iterator while the\ncallback is running. Removing the current entry from the callback
  can\ninvalidate the iterator state. The callback also cannot be protected by\nrcu_read_lock(),
  because scmi_device_destroy() may sleep.\n\nLeave IDR teardown to the following
  idr_destroy() call and keep the\ncallback limited to device destruction."
