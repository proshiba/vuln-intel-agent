  used in combination with the workspace app allowed API/REST-only delegated 
  administrators to bypass folder-level authorization controls. The workspace 
  app enables organizations to delegate limited administrative privileges for 
  team folder management via API/REST only, restricting access to folders for 
  which the admin has advanced permissions.
