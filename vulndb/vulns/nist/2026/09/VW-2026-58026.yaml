title: jackson-databind binds a JSON string to a javax.xml.datatype.Duration or 
  javax.xml.datatype.XMLGregorianCalendar field by passing the raw string 
  verbatim to DatatypeFactory.newDuration(value) or 
  newXMLGregorianCalendar(value) in CoreXMLDeserializers.Std._deserialize. These
  deserializers are registered by default with no opt-in, so a plain 
  ObjectMapper or JsonMapper with no polymorphic typing and no special 
  configuration reaches this path. The XML Schema lexical grammar permits 
  numeric components of arbitrary length, which the JDK materializes through the
  native BigInteger(String) and BigDecimal(String) constructors, both quadratic 
  in digit count. Because the digits sit inside a JSON string token rather than 
  a JSON number token, jackson-core's StreamReadConstraints.maxNumberLength 
  guard never applies; jackson's own NumberDeserializers call 
