title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  backtracking shouldn't clear outer frame R1-R5 for callbacks\n\nWhen processing
  calls to bpf_loop() verifier marks R1 (and R4) as\nprecise. R1 tracks loop iterations
  number and because of the\n'callback_depth < R1' mechanics in check_helper_call()
  must be marked\nprecise. However, precision propagation for R1 was broken,\nwhen
  bpf_loop() call was verified on a second iteration.\n\nConsider the following verification
  trace:\n- main: bpf_loop(nr_loops, callback ...)\n- callback: BPF_EXIT\n- main:
  bpf_loop(nr_loops, callback ...)\n- ...\n\nWhile the first visit of the call to
  bpf_loop() propagated R1\nprecision as expected, the second call to mark_chain_precision()
  in\nthe check_helper_call() set R1, but it was immediately reset when\nbacktrack_insn()
  processed preceding BPF_EXIT in the loop deleted in\nthis patch.\n\nBecause of that,
