title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  dat: atomically update mac addresses\n\nWhen a MAC address is updated in batadv_dat_entry_add(),
  it is done using a\nsimple copy function. A parallel reader might only see parts
  of this\nupdate. In worst case, the reader is transporting the half updated MAC\n\
  address over the network or is creating an ARP response using it -\npoisoning the
  ARP cache.\n\natomic64_t can be used to store the 48 bit of a mac address. A reader
  will\nthen either see the old mac address or the new one - never a mixture of\n\
  both."
