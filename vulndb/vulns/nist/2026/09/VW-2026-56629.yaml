title: n8n is an open source workflow automation platform. Prior to 1.123.76, 
  2.37.7, and 2.38.2, the Elasticsearch and ElasticSecurity nodes interpolated 
  workflow-controlled index and document identifiers directly into REST request 
  paths. An identifier containing path separators or dot segments could select 
  another index or a cluster administration endpoint under the stored 
  Elasticsearch credential. The affected request construction includes 
  packages/nodes-base/nodes/Elastic/Elasticsearch/GenericFunctions.ts and the 
  missing toPathSegment encoding. This issue is fixed in versions 1.123.76, 
  2.37.7 and 2.38.2.
