title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cec: stm32: prevent out-of-bounds write on RX overflow\n\nstm32_rx_done() appends
  each received CEC byte to rx_msg.msg[] using\nrx_msg.len as the write index, incrementing
  it on every RXBR\n(receive-byte-ready) interrupt without checking it against the
  buffer\nsize:\n\n\tcec->rx_msg.msg[cec->rx_msg.len++] = val & 0xFF;\n\nrx_msg.msg[]
  is a fixed CEC_MAX_MSG_SIZE (16) byte array in struct\ncec_msg, and rx_msg.len is
  only reset on RXACKE/RXOVR or after a\ncompleted message (RXEND). The number of
  bytes received before RXEND is\ndecided by the remote CEC device (it sets EOM),
  not by the driver. A\npeer that keeps sending bytes without ending the message drives
  RXBR\nrepeatedly, pushing rx_msg.len past 16 and writing peer-controlled bytes\n\
  out of bounds into the surrounding memory. This is reachable in normal\noperation
  once the driver has probed and receiving is enabled, from the\nIRQ thread, without
  any local privilege.\n\nThe length"
