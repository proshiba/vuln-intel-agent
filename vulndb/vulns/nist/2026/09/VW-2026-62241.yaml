title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_balloon:
  quiesce balloon work before device shutdown\n\nCommit 8bd2fa086a04 (\"virtio: break
  and reset virtio devices on\ndevice_shutdown()\") added a generic virtio bus .shutdown
  handler that\nbreaks and resets every virtio device during device_shutdown(), i.e.
  on\nreboot and kexec.\n\nvirtio_balloon provides no .shutdown of its own, so that
  generic path\nruns while the balloon's asynchronous work is still armed. Once the\n\
  device has been broken, virtqueue_add_inbuf() in\nvirtballoon_free_page_report()
  returns -EIO and trips its\nWARN_ON_ONCE(). On a kernel booted with panic_on_warn
  that turns an\nordinary reboot, for example a kexec based upgrade, into a fatal
  panic\nin the middle of device_shutdown(), so the machine never reaches the\nnew
  kernel.\n\nRelaxing that single WARN_ON_ONCE() would only hide the symptom: the\n\
  inflate/deflate and OOM paths do not warn, they call\nwait_event(vb->acked, ...)
  and would instead block foreve"
