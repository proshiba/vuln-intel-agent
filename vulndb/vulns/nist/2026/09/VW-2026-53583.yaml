title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  reject a class permission count below its inherited common\n\nsecurity_get_permissions()
  maps an inherited common's permissions into\nan array sized by the class's own permissions.nprim,
  but class_read()\ntakes that nprim verbatim from the policy image and never checks
  that it\ncovers the common.  A class that inherits a common of N permissions while\n\
  declaring a smaller nprim is accepted, and on load the common's\npermissions are
  written past the class-sized array -- an out-of-bounds\nheap write.\n\nReject a
  class whose permission count is below its inherited common's.\nWell-formed policies,
  where the class count already includes the\ninherited permissions, are unaffected."
