title: "There is a lack of XSS escaping in the Spark History Server prior to 3.5.8
  which allows a malicious Spark job to generate arbitrary unescaped frontend code
  which could lead to a minimal privilege escalation in browser. Users are encouraged
  to upgrade to Spark 3.5.8 or later.\n\nThis CVE is marked as \"low\" since the path
  to exploit requires both relatively high permissions (ability to launch a Spark
  job) and requires tricking a user with higher permissions to log in and visit the
  Spark history web page.\n\nUsers are encouraged to upgrade their Spark history servers
  to Spark 3.5.8 or later."
