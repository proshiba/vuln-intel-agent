title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  Allow per function PCI slots to fix slot reset on s390\n\nOn s390 systems, which
  use a machine level hypervisor, PCI devices are\nalways accessed through a form
  of PCI pass-through which fundamentally\noperates on a per PCI function granularity.
  This is also reflected in the\ns390 PCI hotplug driver which creates hotplug slots
  for individual PCI\nfunctions. Its reset_slot() function, which is a wrapper for\n\
  zpci_hot_reset_device(), thus also resets individual functions.\n\nCurrently, the
  pci_create_slot() assigns the same pci_slot object to\nmultifunction devices. This
  approach worked fine on s390 systems that only\nexposed virtual functions as individual
  PCI domains to the operating\nsystem.  Since commit 44510d6fa0c0 (\"s390/pci: Handling
  multifunctions\")\ns390 supports exposing the topology of multifunction PCI devices
