title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  validate Dirty Page Table capacity in log_replay copy_lcns\n\nIn the analysis pass
  of $LogFile journal replay, log_replay() copies\nLCNs from each action log record
  into an existing Dirty Page Table\n(DPT) entry without bounding the destination
  index. A crafted NTFS\nimage with DPT entry lcns_follow=1 and an action log record
  with\nlcns_follow=2 produces a kernel slab out-of-bounds write at mount\ntime:\n\
  \n  BUG: KASAN: slab-out-of-bounds in log_replay+0x654c/0xdb60\n  Write of size
  8 at addr ffff8880095e1040 by task mount\n\nTwo attacker-controlled fields can drive
  j+i past the allocated\npage_lcns[] array:\n\n  1. dp->lcns_follow (capacity) can
  be smaller than lrh->lcns_follow.\n  2. lrh->target_vcn may be smaller than dp->vcn,
  making the u64\n     subtraction wrap to a huge size_t.\n\nValidate target VCN delta
  and per-record LCN count against the\nDPT entry capacity, bail via the existing
  out: cleanup label with\n-EINVAL.\n\nTh"
