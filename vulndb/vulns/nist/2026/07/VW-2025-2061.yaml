title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  unshare page tables during VMA split, not before\n\nCurrently, __split_vma() triggers
  hugetlb page table unsharing through\nvm_ops->may_split().  This happens before
  the VMA lock and rmap locks are\ntaken - which is too early, it allows racing VMA-locked
  page faults in our\nprocess and racing rmap walks from other processes to cause
  page tables to\nbe shared again before we actually perform the split.\n\nFix it
  by explicitly calling into the hugetlb unshare logic from\n__split_vma() in the
  same place where THP splitting also happens.  At that\npoint, both the VMA and the
  rmap(s) are write-locked.\n\nAn annoying detail is that we can now call into the
  helper\nhugetlb_unshare_pmds() from two different locking contexts:\n\n1. from hugetlb_split(),
  holding:\n    - mmap lock (exclusively)\n    - VMA lock\n    - file rmap lock (exclusively)\n\
  2. hugetlb_unshare_all_pmds(), which I think is designed to be able to\n   call
  us with onl"
