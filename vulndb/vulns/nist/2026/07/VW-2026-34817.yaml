title: A vulnerability was identified in chatwoot up to 4.11.2. Affected by this
  vulnerability is the function Webhooks::Trigger in the library 
  lib/webhooks/trigger.rb of the component Webhook API. Such manipulation of the
  argument url leads to server-side request forgery. The attack can be launched 
  remotely. The exploit is publicly available and might be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
