title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: ucsi: ccg: Fix use-after-free of ucsi on remove\n\nThe threaded IRQ handler
  ccg_irq_handler() calls ucsi_notify_common(),\nwhich on a connector-change event
  calls ucsi_connector_change() and\nschedules connector work.  In ucsi_ccg_remove(),
  ucsi_destroy() frees\nuc->ucsi (kfree) before free_irq() is called, so a handler
  invocation\nalready in flight may access the freed object after ucsi_destroy().\n\
  \n  CPU 0 (remove)            | CPU 1 (threaded IRQ)\n    ucsi_destroy(uc->ucsi)\
  \  |   ccg_irq_handler()\n      kfree(ucsi) // FREE   |     ucsi_notify_common(uc->ucsi)
  // USE\n\nMove free_irq() before ucsi_destroy() in the remove path.  It is kept\n\
  after ucsi_unregister(): ucsi_unregister() cancels connector work whose\nhandler
  issues GET_CONNECTOR_STATUS through ucsi_send_command_common(),\nwhich waits for
  a completion that is signalled from the IRQ handler, so\nthe IRQ must stay active
  until that work has been cancelled.\n\nTh"
