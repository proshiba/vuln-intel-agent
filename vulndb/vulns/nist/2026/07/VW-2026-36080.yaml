title: "In the Linux kernel, the following vulnerability has been resolved:\n\nposix-cpu-timers:
  Fix pid refcount leak in do_cpu_nanosleep() error path\n\nIn do_cpu_nanosleep(),
  posix_cpu_timer_create() takes a pid reference\nvia get_pid() and stores it in timer.it.cpu.pid.
  If the subsequent\nposix_cpu_timer_set() call fails, the function returns immediately\n\
  without calling posix_cpu_timer_del() to release the pid reference,\ncausing a leak.\n\
  \nFix it by calling posix_cpu_timer_del() before the unlock-and-return\non the error
  path, consistent with the other exit paths in the same\nfunction."
