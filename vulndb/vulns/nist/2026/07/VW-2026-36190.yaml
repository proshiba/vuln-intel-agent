title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  ice1712: check snd_ctl_new1() return value\n\nsnd_ctl_new1() can return NULL when
  memory allocation fails. The\nice1712 driver calls snd_ctl_new1() without checking
  the return value\nbefore dereferencing the pointer in multiple places (ice1712.c,\n\
  ice1724.c, aureon.c), which can lead to NULL pointer dereferences.\n\nAdd NULL checks
  after snd_ctl_new1() calls and return -ENOMEM if any\nfails."
