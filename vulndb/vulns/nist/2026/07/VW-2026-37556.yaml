title: Pydantic AI is a Python agent framework for building applications and 
  workflows with Generative AI. In versions 1.88.0 up to but not including 
  1.107.1 and 2.0.0b1 up to but not including 2.5.0, the UI adapters (AG-UI via 
  Agent.to_ag_ui()/AGUIAdapter, and Vercel AI via VercelAIAdapter) use 
  sanitize_messages to strip unresolved ("dangling") client-submitted tool calls
  from untrusted message history before it reaches the agent, a defense-in-depth
  default that prevents the agent from executing tool calls the model never 
