title: Kamaji is the Hosted Control Plane Manager for Kubernetes. Prior to 
  26.7.4-edge, Kamaji derives a TenantControlPlane datastore schema, database 
  user, and etcd key prefix from a lossy namespace-and-name normalization in 
  GetDefaultDatastoreSchema() and GetDefaultDatastoreUsername(), allowing 
  distinct tenants with colliding normalized identifiers to share control-plane 
  state and read, modify, or destroy another tenant's Kubernetes data. This 
  issue is fixed in version 26.7.4-edge.
