title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: Skip fastpath emulation on VM-Exit if next RIP isn't valid\n\nSkip the WRMSR
  and HLT fastpaths in SVM's VM-Exit handler if the next RIP\nisn't valid, e.g. because
  KVM is running with nrips=false.  SVM must\ndecode and emulate to skip the instruction
  if the CPU doesn't provide the\nnext RIP, and getting the instruction bytes to decode
  requires reading\nguest memory.  Reading guest memory through the emulator can fault,
  i.e.\ncan sleep, which is disallowed since the fastpath handlers run with IRQs\n\
  disabled.\n\n BUG: sleeping function called from invalid context at ./include/linux/uaccess.h:106\n\
  \ in_atomic(): 1, irqs_disabled(): 1, non_block: 0, pid: 32611, name: qemu\n preempt_count:
  1, expected: 0\n INFO: lockdep is turned off.\n irq event stamp: 30580\n hardirqs
  last  enabled at (30579): [<ffffffffc08b2527>] vcpu_run+0x1787/0x1db0 [kvm]\n hardirqs
  last disabled at (30580): [<ffffffffb4f62e32>] __schedule+0x1e2/0xed0\n softi"
