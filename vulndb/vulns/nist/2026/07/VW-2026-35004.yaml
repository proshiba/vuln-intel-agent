title: 'Open edX Platform enables the authoring and delivery of online learning at
  any scale. From the maple release to before the ulmo release, an unauthenticated
  attacker can fully bypass the email verification process by combining two issues:
  the OAuth2 password grant issuing tokens to inactive users (documented behavior)
  and the activation_key being exposed in the REST API response at /api/user/v1/accounts/.
  This issue has been patched in the ulmo release.'
