title: An allocation of resources without limits vulnerability in the HTTP 
  handler component of Google mcp-toolbox versions up to and including 1.4.0 
  allows an unauthenticated attacker to cause a denial of service (DoS). The 
  /mcp endpoint handler reads incoming payloads directly into system memory 
  using an unrestricted buffer loop (io.ReadAll) without applying defensive 
  constraints such as http.MaxBytesReader or pre-read Content-Length 
  enforcement. By submitting a single, massive HTTP request body, an attacker 
  can linearly consume available host memory until the runtime process is 
  terminated by an Out-Of-Memory (OOM) error.
