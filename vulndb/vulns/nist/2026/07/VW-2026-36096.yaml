title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix query_info() replay double-free\n\nA response-bearing attempt can return
  a replayable error and free its\nresponse buffer. If SMB2_query_info_init() fails
  before the next send,\ncleanup retains the previous buffer type and frees that response
  again.\n\nReset response bookkeeping before each attempt to prevent the stale free."
