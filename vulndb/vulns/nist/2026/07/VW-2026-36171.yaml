title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  mediatek: Fix IRQ domain leak when port fails to enable\n\nWhen mtk_pcie_enable_port()
  fails, mtk_pcie_port_free() removes the port\nfrom pcie->ports and frees the port
  structure. However, the IRQ domains set\nup earlier by mtk_pcie_init_irq_domain()
  are never freed.\n\nFix this by refactoring mtk_pcie_irq_teardown() into a per-port
  helper,\nmtk_pcie_irq_teardown_port(), and calling it from mtk_pcie_setup() when\n\
  mtk_pcie_enable_port() fails. Since the IRQ teardown must only happen in\nthe probe
  error path (during resume, child devices may have active MSI\nmappings and the NOIRQ
  context prohibits sleeping locks),\nmtk_pcie_enable_port() is changed to return
  an error code so callers can\ndistinguish the two paths and act accordingly.\n\n\
  This issue was reported by Sashiko while reviewing the EcoNet EN7528 SoC\nsupport
  series."
