title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: Remove disruptive netif_wake_queue in rtl8150_set_multicast\n\nsyzbot reported
  WARNING in rtl8150_start_xmit/usb_submit_urb.\nThis is the sequence of events that
  leads to the warning:\n\nrtl8150_start_xmit() {\n\tnetif_stop_queue();\n\tusb_submit_urb(dev->tx_urb);\n\
  }\n\nrtl8150_set_multicast() {\n\tnetif_stop_queue();\n\tnetif_wake_queue();\t\t
  <-- wakes up TX queue before URB is done\n}\n\nrtl8150_start_xmit() {\n\tnetif_stop_queue();\n\
  \tusb_submit_urb(dev->tx_urb);\t<-- double submission\n}\n\nrtl8150_set_multicast
  being the ndo_set_rx_mode callback should not be\ncalling netif_stop_queue and notif_start_queue
  as these handle\nTX queue synchronization.\n\nThe net core function dev_set_rx_mode
  handles the synchronization\nfor rtl8150_set_multicast making it safe to remove
  these locks."
