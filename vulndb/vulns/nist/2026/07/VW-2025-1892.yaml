title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Validate prev_cpu in scx_bpf_select_cpu_dfl()\n\nIf a BPF scheduler provides an
  invalid CPU (outside the nr_cpu_ids\nrange) as prev_cpu to scx_bpf_select_cpu_dfl()
  it can cause a kernel\ncrash.\n\nTo prevent this, validate prev_cpu in scx_bpf_select_cpu_dfl()
  and\ntrigger an scx error if an invalid CPU is specified."
