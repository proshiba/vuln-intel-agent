title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/handshake:
  duplicate handshake cancellations leak socket\n\nWhen a handshake request is cancelled
  it is removed from the\nhandshake_net->hn_requests list, but it is still present
  in the\nhandshake_rhashtbl until it is destroyed.\n\nIf a second cancellation request
  arrives for the same handshake request,\nthen remove_pending() will return false...
  and assuming\nHANDSHAKE_F_REQ_COMPLETED isn't set in req->hr_flags, we'll continue\n\
  processing through the out_true label, where we put another reference on\nthe sock
  and a refcount underflow occurs.\n\nThis can happen for example if a handshake times
  out - particularly if\nthe SUNRPC client sends the AUTH_TLS probe to the server
  but doesn't\nfollow it up with the ClientHello due to a problem with tlshd.  When
