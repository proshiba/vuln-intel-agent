title: sqlite 3.41 has a use-after-free (UAF) vulnerability in the ORDER BY 
  clause parsing routine. The affected code first releases the memory of an 
  ExprList object via sqlite3ExprListDelete(), then attempts to access the nExpr
  member of the already freed object. This dangling pointer access causes 
  invalid memory read operations. By constructing a malicious SQL statement 
  containing an ORDER BY clause with a large number of items, a remote adversary
  can trigger this vulnerability. Successful exploitation can result in 
  application crash (denial of service), leakage of sensitive memory contents, 
  and under certain memory layout conditions, arbitrary code execution on the 
  affected system.
