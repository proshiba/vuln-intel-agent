title: "Multiple BinSoft products are vulnerable to Privilege Escalation due to excessive
  database privileges assigned to the user used by the application. An attacker with
  access to any running application instance connected to the backend server can extract
  database credentials from the application’s memory by inspecting the running process.
  While ability to retrieve credentials from memory is the expected behavior, the
  exposed credentials grant administrative access to the database, exceeding the privileges
  required for normal application functionality. This allows an attacker to perform
  actions beyond those permitted through the application interface.\n\nThe described
  issue affects all published versions. The vendor stated that this issue is a direct
  result of the architecture model in which the software is distributed, and that
  it will be mitigated with a corrected installation manual."
