title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/ivpu:
  Fix page fault in ivpu_bo_unbind_all_bos_from_context()\n\nDon't add BO to the vdev->bo_list
  in ivpu_gem_create_object().\nWhen failure happens inside drm_gem_shmem_create(),
  the BO is not\nfully created and ivpu_gem_bo_free() callback will not be called\n\
  causing a deleted BO to be left on the list."
