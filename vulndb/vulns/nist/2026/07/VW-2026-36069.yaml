title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  reject CLEAN_SEGMENTS ioctl with out-of-range segment numbers\n\nSyzbot reported
  a hung task in nilfs_transaction_begin() where multiple\ntasks performing chmod()
  on a nilfs2 mount blocked for over 143 seconds\nwaiting to acquire ns_segctor_sem
  for read:\n\n  INFO: task syz.0.17:5918 blocked for more than 143 seconds.\n  Call
  Trace:\n   schedule+0x164/0x360\n   rwsem_down_read_slowpath+0x6d9/0x940\n   down_read+0x99/0x2e0\n\
  \   nilfs_transaction_begin+0x364/0x710 fs/nilfs2/segment.c:221\n   nilfs_setattr+0x124/0x2c0
  fs/nilfs2/inode.c:921\n   notify_change+0xc1a/0xf40\n   chmod_common+0x273/0x4a0\n\
  \   do_fchmodat+0x12d/0x230\n\nThe writer holding ns_segctor_sem was a concurrent\n\
  NILFS_IOCTL_CLEAN_SEGMENTS caller, stuck inside printk while emitting\nper-element
  warnings from nilfs_sufile_updatev():\n\n   __nilfs_msg+0x373/0x450 fs/nilfs2/super.c:78\n\
  \   nilfs_sufile_updatev+0x21c/0x6d0 fs/nilfs2/sufile.c:186\n   nilfs_sufile_freev
  fs/nilf"
