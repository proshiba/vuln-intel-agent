title: "When asking curl to use a `.netrc` file to find credentials and at the same\n\
  time specifying a URL with a username(without a password), like\n`https://user@example.com/`,
  curl could wrongly get and use the password for\n*another* user set in the `.netrc`
  file for that host if such a one exists and\nthere is no match for the specified
  user."
