  HI-LED-WR120-G2 5.5.0.1R6.03.30. Affected is the function deletefile of the 
  component FsBrowseClean. The manipulation of the argument dir/path leads to 
  missing authorization. The attack may be initiated remotely. The exploit has 
  been disclosed publicly and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
