title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gem:
  Acquire references on GEM handles for framebuffers\n\nA GEM handle can be released
  while the GEM buffer object is attached\nto a DRM framebuffer. This leads to the
  release of the dma-buf backing\nthe buffer object, if any. [1] Trying to use the
  framebuffer in further\nmode-setting operations leads to a segmentation fault. Most
  easily\nhappens with driver that use shadow planes for vmap-ing the dma-buf\nduring
  a page flip. An example is shown below.\n\n[  156.791968] ------------[ cut here
  ]------------\n[  156.796830] WARNING: CPU: 2 PID: 2255 at drivers/dma-buf/dma-buf.c:1527
  dma_buf_vmap+0x224/0x430\n[...]\n[  156.942028] RIP: 0010:dma_buf_vmap+0x224/0x430\n\
  [  157.043420] Call Trace:\n[  157.045898]  <TASK>\n[  157.048030]  ? show_trace_log_lvl+0x1af/0x2c0\n\
