title: The Open User Map – Interactive Leaflet Maps plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via Shortcode Attributes in all 
  versions up to, and including, 1.4.45 due to insufficient input sanitization 
  and output escaping. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. The attack does 
  not require post publication; a Contributor submitting a post for pending 
  review is sufficient, as the payload executes when an Administrator opens the 
  pending-review preview.
