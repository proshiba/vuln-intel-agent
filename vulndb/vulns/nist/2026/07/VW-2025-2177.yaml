title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFC:
  nci: uart: Set tty->disc_data only in success path\n\nSetting tty->disc_data before
  opening the NCI device means we need to\nclean it up on error paths.  This also
  opens some short window if device\nstarts sending data, even before NCIUARTSETDRIVER
  IOCTL succeeded\n(broken hardware?).  Close the window by exposing tty->disc_data
  only on\nthe success path, when opening of the NCI device and try_module_get()\n\
  succeeds.\n\nThe code differs in error path in one aspect: tty->disc_data won't
  be\never assigned thus NULL-ified.  This however should not be relevant\ndifference,
  because of \"tty->disc_data=NULL\" in nci_uart_tty_open()."
