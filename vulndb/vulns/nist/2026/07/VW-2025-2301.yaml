title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: ad7173: fix channels index for syscalib_mode\n\nFix the index used to look
  up the channel when accessing the\nsyscalib_mode attribute. The address field is
  a 0-based index (same\nas scan_index) that it used to access the channel in the\n\
  ad7173_channels array throughout the driver. The channels field, on\nthe other hand,
  may not match the address field depending on the\nchannel configuration specified
  in the device tree and could result\nin an out-of-bounds access."
