title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigc:
  don't fail igc_probe() on LED setup error\n\nWhen igc_led_setup() fails, igc_probe()
  fails and triggers kernel panic\nin free_netdev() since unregister_netdev() is not
  called. [1]\nThis behavior can be tested using fault-injection framework, especially\n\
  the failslab feature. [2]\n\nSince LED support is not mandatory, treat LED setup
  failures as\nnon-fatal and continue probe with a warning message, consequently\n\
  avoiding the kernel panic.\n\n[1]\n kernel BUG at net/core/dev.c:12047!\n Oops:
  invalid opcode: 0000 [#1] SMP NOPTI\n CPU: 0 UID: 0 PID: 937 Comm: repro-igc-led-e
  Not tainted 6.17.0-rc4-enjuk-tnguy-00865-gc4940196ab02 #64 PREEMPT(voluntary)\n\
  \ Hardware name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS 1.16.3-debian-1.16.3-2
  04/01/2014\n RIP: 0010:free_netdev+0x278/0x2b0\n [...]\n Call Trace:\n  <TASK>\n\
  \  igc_probe+0x370/0x910\n  local_pci_probe+0x3a/0x80\n  pci_device_probe+0xd1/0x200\n\
  \ [...]\n\n[2]\n #!/bin/bash -ex\n\n FAILSLAB_PATH=/"
