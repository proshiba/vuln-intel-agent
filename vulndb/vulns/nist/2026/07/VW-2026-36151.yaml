title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB reads in rtw_get_sec_ie(), rtw_get_wapi_ie(), and rtw_get_wps_attr()\n\
  \nThree IE/attribute parsing functions have missing bounds checks.\n\nrtw_get_sec_ie()
  and rtw_get_wapi_ie() iterate over a raw IE buffer\nwithout verifying that the header
  bytes (tag + length) are within the\nremaining buffer before reading them.  Additionally,
  rtw_get_sec_ie()\ncompares the 4-byte WPA OUI at cnt+2 without checking that at
  least\n6 bytes remain, and rtw_get_wapi_ie() compares a 4-byte WAPI OUI at\ncnt+6
  without checking that at least 10 bytes remain.\n\nrtw_get_wps_attr() reads wps_ie[0]
  and wps_ie+2 unconditionally at\nentry, before verifying that wps_ielen is large
  enough to contain\nthe 6-byte WPS IE header (element_id + length + 4-byte OUI).\
  \  Inside\nthe attribute loop, get_unaligned_be16() is called on attr_ptr and\n\
  attr_ptr+2 without checking that 4 bytes remain in the buffer.\n\nAdd a cnt+2 bounds
  check before eac"
