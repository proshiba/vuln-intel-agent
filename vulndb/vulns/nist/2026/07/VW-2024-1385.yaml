title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  mcast: use rcu-safe version of ipv6_get_lladdr()\n\nSome time ago 8965779d2c0e (\"\
  ipv6,mcast: always hold idev->lock before mca_lock\")\nswitched ipv6_get_lladdr()
  to __ipv6_get_lladdr(), which is rcu-unsafe\nversion. That was OK, because idev->lock
  was held for these codepaths.\n\nIn 88e2ca308094 (\"mld: convert ifmcaddr6 to RCU\"\
  ) these external locks were\nremoved, so we probably need to restore the original
  rcu-safe call.\n\nOtherwise, we occasionally get a machine crashed/stalled with
  the following\nin dmesg:\n\n[ 3405.966610][T230589] general protection fault, probably
  for non-canonical address 0xdead00000000008c: 0000 [#1] SMP NOPTI\n[ 3405.982083][T230589]
  CPU: 44 PID: 230589 Comm: kworker/44:3 Tainted: G           O      5.15.19-cloudflare-2022.2.1
  #1\n[ 3405.998061][T230589] Hardware name: SUPA-COOL-SERV\n[ 3406.009552][T230589]
  Workqueue: mld mld_ifc_work\n[ 3406.017224][T230589] RIP: 0010:__ipv6_get_lladdr+0x34/0x60\n\
  [ 3"
