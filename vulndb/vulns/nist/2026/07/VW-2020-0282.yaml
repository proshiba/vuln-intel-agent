title: 'Vulnerability in the PeopleSoft Enterprise CS Campus Community product of
  Oracle PeopleSoft (component: Self-Service). The supported version that is affected
  is 9.2. Easily exploitable vulnerability allows low privileged attacker with network
  access via HTTP to compromise PeopleSoft Enterprise CS Campus Community. While the
  vulnerability is in PeopleSoft Enterprise CS Campus Community, attacks may significantly
  impact additional products. Successful attacks of this vulnerability can result
  in unauthorized read access to a subset of PeopleSoft Enterprise CS Campus Community
  accessible data. CVSS 3.0 Base Score 5.0 (Confidentiality impacts). CVSS Vector:
  (CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:N/A:N).'
