title: Flyto2 Core is an execution kernel for automation and AI-agent workflows.
  Prior to 2.26.7, HTTP-emitting modules including 
  src/core/modules/third_party/developer/http/requests.py, core.api.http_get, 
  core.api.http_post, graphql.query, graphql.mutation, monitor.http_check, 
  communication.slack_send, notification.discord.send_message, 
  notification.slack.send_message, notification.teams.send_message, 
  ai.vision_analyze, verify.visual_diff, browser.proxy_rotate, and the agent and
  llm inline base_url branch fetch caller-controlled URLs without 
  validate_url_with_env_config, allowing SSRF to internal or metadata endpoints.
  This issue is fixed in version 2.26.7.
