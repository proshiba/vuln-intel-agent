title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix UAF of struct file_lock in SMB2_LOCK deferred-lock cancellation\n\nWhen a blocking
  byte-range lock request is deferred in the\nFILE_LOCK_DEFERRED path, ksmbd registers
  the asynchronous work into\nthe connection's async_requests list via setup_async_work().
  The cancel\ncallback smb2_remove_blocked_lock() holds a reference to the flock.\n\
  \nIf the lock waiter is subsequently woken up but the work state is no\nlonger KSMBD_WORK_ACTIVE
  (e.g., due to a concurrent cancellation), the\ncleanup path calls locks_free_lock(flock)
  without dequeuing the work from\nthe async_requests list. Concurrently, smb2_cancel()
  walks the list\nunder conn->request_lock and invokes the cancel callback, which
  then\ndereferences the already freed 'flock'. This leads to a slab-use-after-free\n\
  inside __wake_up_common.\n\nFix this by restructuring the cleanup logic after the
  worker returns\nfrom ksmbd_vfs_posix_lock_wait(). Move list_del(&smb_lock->llist)"
