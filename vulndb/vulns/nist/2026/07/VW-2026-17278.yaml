  element is an unknown function of the file litellm/proxy/management_endpoints/key_management_endpoints.py
  of the component Admin Key Handler. This manipulation causes improper authorization.
  The attack can be initiated remotely. The exploit has been publicly disclosed and
  may be utilized. Patch name: 23781. It is recommended to apply a patch to fix this
  issue. The vendor was contacted early about this disclosure.'
