title: SurrealDB before 3.1.0 fails to enforce the configured recursion depth 
  limit in the value and JSON parser when processing nested braces, brackets, or
  parentheses. Unauthenticated attackers can send deeply nested JSON payloads to
  the WebSocket /rpc endpoint to exhaust server memory and crash the process.
