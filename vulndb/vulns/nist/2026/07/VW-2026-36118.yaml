title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  bnep: pin L2CAP connection during netdev registration\n\nbnep_add_connection() reads
  the L2CAP connection without holding the\nchannel lock, then passes its HCI device
  to register_netdev(). Controller\nteardown can clear and release that connection
  concurrently, leaving the\nnetwork device registration path to dereference a freed
  parent device.\n\nTake a reference to the L2CAP connection while holding the channel
  lock.\nRetain it until register_netdev() has taken the parent device reference."
