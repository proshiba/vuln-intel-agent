title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  fix Tx scheduler error handling in XDP callback\n\nWhen the XDP program is loaded,
  the XDP callback adds new Tx queues.\nThis means that the callback must update the
  Tx scheduler with the new\nqueue number. In the event of a Tx scheduler failure,
  the XDP callback\nshould also fail and roll back any changes previously made for
  XDP\npreparation.\n\nThe previous implementation had a bug that not all changes
  made by the\nXDP callback were rolled back. This caused the crash with the following\n\
  call trace:\n\n[  +9.549584] ice 0000:ca:00.0: Failed VSI LAN queue config for XDP,
  error: -5\n[  +0.382335] Oops: general protection fault, probably for non-canonical
  address 0x50a2250a90495525: 0000 [#1] SMP NOPTI\n[  +0.010710] CPU: 103 UID: 0 PID:
  0 Comm: swapper/103 Not tainted 6.14.0-net-next-mar-31+ #14 PREEMPT(voluntary)\n\
  [  +0.010175] Hardware name: Intel Corporation M50CYP2SBSTD/M50CYP2SBSTD, BIOS SE5C620.86B.01.01.0005.2202160810
  02"
