title: A vulnerability was determined in Sanluan PublicCMS up to 6.202506.d. 
  Affected is the function log_login of the file 
  core/src/main/java/com/publiccms/controller/admin/LoginAdminController.java of
  the component Failed Login Handler. This manipulation of the argument 
  errorPassword causes cleartext storage in a file or on disk. It is possible to
  initiate the attack remotely. The vendor was contacted early about this 
  disclosure but did not respond in any way.
