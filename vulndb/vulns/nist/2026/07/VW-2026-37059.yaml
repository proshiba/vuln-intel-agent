title: "Pivotick used plain JavaScript objects as lookup tables indexed by caller-controlled
  graph node identifiers in its tree-layout and cycle-detection components.\n\nNode
  identifiers matching properties inherited from Object.prototype, such as constructor,
  toString, or __proto__, were not handled as ordinary identifiers. These values could
  be interpreted as existing inherited properties, resolve to values of an unexpected
  type, or—in the case of __proto__ assignments—modify the prototype of an internal
  lookup object.\n\nAn attacker who can supply graph data containing crafted node
  identifiers could consequently cause nodes or edges to be silently omitted, produce
  incorrect hierarchy levels, bypass or corrupt cycle-detection results, or trigger
  an exception that interrupts graph processing and rendering. This affects the integrity
  of graph visualisations and analytics and may cause a client-side denial-of-service
  condition.\n\nThe affected code also failed to safely handle edges whose source
  node"
