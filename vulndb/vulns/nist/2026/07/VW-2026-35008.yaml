title: OneUptime is an open-source monitoring and observability platform. Prior 
  to version 10.0.42, multiple notification API endpoints are registered without
  authentication middleware, while sibling endpoints in the same codebase 
  correctly use ClusterKeyAuthorization.isAuthorizedServiceMiddleware. These 
  endpoints are externally reachable via the Nginx proxy at /notification/. 
  Combined with a projectId leak from the public Status Page API, an 
  unauthenticated attacker can purchase phone numbers on the victim's Twilio 
  account and delete all existing alerting numbers. This issue has been patched 
  in version 10.0.42.
