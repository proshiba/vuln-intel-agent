  between\nthe control message buffer (which includes the type such as TLS\naler or
  TLS cipher change) and the rest of the payload (say TLS\nalert's level/description)
  which goes into the msg payload buffer.\n\nThis patch proposes to rework how control
  messages are setup and\nused by sock_recvmsg().\n\nIf no control message structure
