title: 'A flaw in Node.js Permission Model enforcement allows Bypass via `process.report.writeReport()`
  Path Misvalidation. This can lead to confidentiality impact or bypass of the intended
  security boundary under affected configurations. This vulnerability affects all
  supported release lines: **Node.js 22**, **Node.js 24**, and **Node.js 26**.'
