title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix null-ptr-deref when acquiring remote ip of ethernet bearer\n\nThe reproduction
  steps:\n1. create a tun interface\n2. enable l2 bearer\n3. TIPC_NL_UDP_GET_REMOTEIP
  with media name set to tun\n\ntipc: Started in network mode\ntipc: Node identity
  8af312d38a21, cluster identity 4711\ntipc: Enabled bearer <eth:syz_tun>, priority
  1\nOops: general protection fault\nKASAN: null-ptr-deref in range\nCPU: 1 UID: 1000
  PID: 559 Comm: poc Not tainted 6.16.0-rc1+ #117 PREEMPT\nHardware name: QEMU Ubuntu
  24.04 PC\nRIP: 0010:tipc_udp_nl_dump_remoteip+0x4a4/0x8f0\n\nthe ub was in fact
  a struct dev.\n\nwhen bid != 0 && skip_cnt != 0, bearer_list[bid] may be NULL or\n\
  other media when other thread changes it.\n\nfix this by checking media_id."
