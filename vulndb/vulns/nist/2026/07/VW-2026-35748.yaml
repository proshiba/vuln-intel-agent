title: Kamailio is an open source implementation of a SIP Signaling Server. 
  Prior to 6.1.1, 6.0.6, and 5.8.8, an out-of-bounds access in the core of 
  Kamailio (formerly OpenSER and SER) allows remote attackers to cause a denial 
  of service (process crash) via a specially crafted data packet sent over TCP. 
  The issue impacts Kamailio instances having TCP or TLS listeners. This 
  vulnerability is fixed in 5.1.1, 6.0.6, and 5.8.8.
