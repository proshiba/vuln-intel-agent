title: The Download Monitor plugin for WordPress is vulnerable to Cross-Site 
  Request Forgery in the `actions_handler()` and `bulk_actions_handler()` 
  methods in `class-dlm-downloads-path.php` in all versions up to, and 
  including, 5.1.10. This is due to missing nonce verification on these 
  functions. This makes it possible for unauthenticated attackers to delete, 
  disable, or enable approved download paths via a forged request granted they 
  can trick a site administrator into performing an action such as clicking on a
  link.
