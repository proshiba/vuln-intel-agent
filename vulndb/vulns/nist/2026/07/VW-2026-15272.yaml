title: The 'clientId' parameter from incoming HTTP requests is directly 
  concatenated into OAuth2 server log warning messages without sanitizing 
  control characters. This allows an attacker to inject arbitrary content, 
  including fake log entries, into the server's log files. Users are recommended
  to upgrade to versions 4.2.2 or 4.1.7 or 3.6.12, which fixes this issue.
