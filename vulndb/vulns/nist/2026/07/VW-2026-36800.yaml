title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix UAF in smc_cdc_rx_handler() by pinning the socket\n\nsmc_cdc_rx_handler() looks
  up the connection by token under the link\ngroup's conns_lock, drops the lock, and
  then dereferences conn and the\nsmc_sock derived from it, ending in sock_hold(&smc->sk)
  inside\nsmc_cdc_msg_recv(). No reference is held across the lock release.\n\nThe
  only reference pinning the socket while the connection is\ndiscoverable in the link
  group is taken in smc_lgr_register_conn()\n(sock_hold) and dropped in __smc_lgr_unregister_conn()
  (sock_put), both\nunder conns_lock. Once the handler drops conns_lock, a concurrent\n\
  close() -> smc_release() -> smc_conn_free() -> smc_lgr_unregister_conn()\ncan drop
  that reference and free the smc_sock, so the handler's later\nsock_hold() runs on
  freed memory:\n\n  WARNING: lib/refcount.c:25 at refcount_warn_saturate\n  Workqueue:
  rxe_wq do_work\n   refcount_warn_saturate (lib/refcount.c:25)\n   smc_cdc_msg_recv
  (ne"
