title: "In the Linux kernel, the following vulnerability has been resolved:\n\nproc:
  protect ptrace_may_access() with exec_update_lock (FD links)\n\nproc_pid_get_link()
  and proc_pid_readlink() currently look up the task from\nthe pid once, then do the
  ptrace access check on that task, then look up\nthe task from the pid a second time
  to do the actual access.\nThat's racy in several ways.\n\nTo fix it, pass the task
  to the ->proc_get_link() handler, and instead of\nproc_fd_access_allowed(), introduce
  a new helper call_proc_get_link() that\nlooks up and locks the task, does the access
  check, and calls\n->proc_get_link()."
