title: "Uncontrolled recursion in the unknown-key skip path of the aws-smithy-json
  runtime crate before 0.62.7, which the smithy-rs code generator invokes from every
  generated struct deserializer, might allow remote unauthenticated users to cause
  a denial of service (process abort via stack exhaustion) via a single small HTTP
  request containing deeply nested JSON to a smithy-rs generated server.\n\n\n\nTo
  remediate this issue, users should upgrade to aws-smithy-json 0.62.7 or later and
  rebuild."
