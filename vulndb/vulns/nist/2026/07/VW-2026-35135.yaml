title: Piwigo is an open source photo gallery application for the web. Prior to 
  version 16.3.0, the four date filter parameters (f_min_date_available, 
  f_max_date_available, f_min_date_created, f_max_date_created) in 
  ws_std_image_sql_filter() are concatenated directly into SQL without any 
  escaping or type validation. This could result in an unauthenticated attacker 
  reading the full database, including user password hashes. This issue has been
  patched in version 16.3.0.
