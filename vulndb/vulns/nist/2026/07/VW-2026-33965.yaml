title: A flaw was found in odh-dashboard, the web console component of Red Hat 
  OpenShift AI (RHOAI). Due to incorrect network binding, a malicious actor 
  within the cluster can bypass authentication and impersonate any user by 
  providing an arbitrary access token. This allows an attacker to gain 
  unauthorized access to the Kubernetes API, potentially leading to arbitrary 
  code execution, privilege escalation, or information disclosure.
