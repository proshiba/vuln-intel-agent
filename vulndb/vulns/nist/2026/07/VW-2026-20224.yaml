title: "Successfully using libcurl to do a transfer to a specific HTTP origin\n(`hostA`)
  with **Digest** authentication and then changing the origin to a\ndifferent one
  (`hostB`) for a second transfer, reusing the same handle, makes\nlibcurl wrongly
  pass on the  `Authorization:` header field meant for `hostA`,\nto `hostB`."
