title: parseusbs before 1.9 contains an OS command injection vulnerability where
  the volume listing path argument (-v flag) is passed unsanitized into an 
  os.popen() shell command with ls, allowing arbitrary command injection via 
  crafted volume path arguments containing shell metacharacters. An attacker can
  provide a crafted volume path via the -v flag that injects arbitrary commands 
  during volume content enumeration.
