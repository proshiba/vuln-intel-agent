title: "Autel MaxiCharger AC Elite Home WebSockets Integer Underflow Remote Code Execution
  Vulnerability. This vulnerability allows remote attackers to execute arbitrary code
  on affected installations of Autel MaxiCharger AC Elite Home EV chargers. Authentication
  is not required to exploit this vulnerability.\n\nThe specific flaw exists within
  the handling of WebSocket messages related to the OCPP service. The issue results
  from the lack of proper validation of user-supplied data, which can result in an
  integer underflow before allocating a buffer. An attacker can leverage this vulnerability
  to execute code in the context of the device. Was ZDI-CAN-29113."
