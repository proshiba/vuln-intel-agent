title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncalipso:
  Fix null-ptr-deref in calipso_req_{set,del}attr().\n\nsyzkaller reported a null-ptr-deref
  in sock_omalloc() while allocating\na CALIPSO option.  [0]\n\nThe NULL is of struct
  sock, which was fetched by sk_to_full_sk() in\ncalipso_req_setattr().\n\nSince commit
  a1a5344ddbe8 (\"tcp: avoid two atomic ops for syncookies\"),\nreqsk->rsk_listener
  could be NULL when SYN Cookie is returned to its\nclient, as hinted by the leading
  SYN Cookie log.\n\nHere are 3 options to fix the bug:\n\n  1) Return 0 in calipso_req_setattr()\n\
  \  2) Return an error in calipso_req_setattr()\n  3) Alaways set rsk_listener\n\n\
  1) is no go as it bypasses LSM, but 2) effectively disables SYN Cookie\nfor CALIPSO.\
  \  3) is also no go as there have been many efforts to reduce\natomic ops and make
  TCP robust against DDoS.  See also commit 3b24d854cb35\n(\"tcp/dccp: do not touch
  listener sk_refcnt under synflood\").\n\nAs of the blamed commit, SYN Cookie already
