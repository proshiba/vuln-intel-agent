title: Versions of the package zip-lib before 1.1.0 are vulnerable to Directory 
  Traversal via the caching mechanism for path validation during the extraction 
  process. An attacker can bypass security checks designed to prevent directory 
  traversal. The intended security function, isOutsideTargetFolder, only checks 
  and caches the path status when the initial directory symlink is created 
  during the first extraction.
