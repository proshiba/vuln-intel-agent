title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  stacktrace: Disable KASAN checks for non-current tasks\n\nUnwinding the stack of
  a task other than current, KASAN would report\n\"BUG: KASAN: out-of-bounds in walk_stackframe+0x41c/0x460\"\
  \n\nThere is a same issue on x86 and has been resolved by the commit\n84936118bdf3
  (\"x86/unwind: Disable KASAN checks for non-current tasks\")\nThe solution could
  be applied to RISC-V too.\n\nThis patch also can solve the issue:\nhttps://seclists.org/oss-sec/2025/q4/23\n\
  \n[pjw@kernel.org: clean up checkpatch issues]"
