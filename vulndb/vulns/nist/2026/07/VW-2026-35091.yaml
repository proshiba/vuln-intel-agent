title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigc:
  fix page fault in XDP TX timestamps handling\n\nIf an XDP application that requested
  TX timestamping is shutting down\nwhile the link of the interface in use is still
  up the following kernel\nsplat is reported:\n\n[  883.803618] [   T1554] BUG: unable
  to handle page fault for address: ffffcfb6200fd008\n...\n[  883.803650] [   T1554]
  Call Trace:\n[  883.803652] [   T1554]  <TASK>\n[  883.803654] [   T1554]  igc_ptp_tx_tstamp_event+0xdf/0x160
  [igc]\n[  883.803660] [   T1554]  igc_tsync_interrupt+0x2d5/0x300 [igc]\n...\n\n\
  During shutdown of the TX ring the xsk_meta pointers are left behind, so\nthat the
  IRQ handler is trying to touch them.\n\nThis issue is now being fixed by cleaning
  up the stale xsk meta data on\nTX shutdown. TX timestamps on other queues remain
  unaffected."
