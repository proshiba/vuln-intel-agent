title: MaxKey through 4.1.12, fixed in commit ddbb72f, contains an insufficient 
  redirect URI validation vulnerability in DefaultRedirectResolver.hostMatches()
  that allows remote attackers to hijack OAuth 2.0 authorization codes by 
  supplying a crafted redirect_uri whose hostname suffix matches a registered 
  URI without proper dot-boundary anchoring. Attackers who control a domain 
  ending with the registered redirect URI hostname can social-engineer victims 
  into clicking a crafted authorization URL, causing the authorization code to 
  be issued to the attacker-controlled URI and exchanged for an access token 
  granting access to the victim's identity.
