title: "In the Linux kernel, the following vulnerability has been resolved:\n\nixgbevf:
  fix mailbox API compatibility by negotiating supported features\n\nThere was backward
  compatibility in the terms of mailbox API. Various\ndrivers from various OSes supporting
  10G adapters from Intel portfolio\ncould easily negotiate mailbox API.\n\nThis convention
  has been broken since introducing API 1.4.\nCommit 0062e7cc955e (\"ixgbevf: add
  VF IPsec offload code\") added support\nfor IPSec which is specific only for the
  kernel ixgbe driver. None of the\nrest of the Intel 10G PF/VF drivers supports it.
  And actually lack of\nsupport was not included in the IPSec implementation - there
  were no such\ncode paths. No possibility to negotiate support for the feature was\n\
  introduced along with introduction of the feature itself.\n\nCommit 339f28964147
  (\"ixgbevf: Add support for new mailbox communication\nbetween PF and VF\") increasing
  API version to 1.5 did the same - it\nintroduced code supported specifically by
  the PF ESX driver. "
