title: SurrealDB before 2.2.2 fails to validate HTTP redirects in http 
  functions, allowing authenticated users to bypass deny-net restrictions by 
  redirecting to blocked IP addresses. Attackers can host a public server that 
  redirects to denied network targets, enabling server-side request forgery to 
  access internal endpoints and retrieve sensitive information.
