title: A flaw was found in ansible-collection-redhat-leapp. An attacker with 
  privileged write access to a managed node's Leapp report content can 
  manipulate it. When an operator runs a specific remediation task, this 
  manipulated report can cause the Ansible controller to read its own local 
  files and copy them to the managed node. This vulnerability leads to 
  information disclosure, potentially exposing sensitive controller-side data 
  such as private keys or credentials.
