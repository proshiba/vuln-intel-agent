title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/ext:
  Fix invalid task state transitions on class switch\n\nWhen enabling a sched_ext
  scheduler, we may trigger invalid task state\ntransitions, resulting in warnings
  like the following (which can be\neasily reproduced by running the hotplug selftest
  in a loop):\n\n sched_ext: Invalid task state transition 0 -> 3 for fish[770]\n\
  \ WARNING: CPU: 18 PID: 787 at kernel/sched/ext.c:3862 scx_set_task_state+0x7c/0xc0\n\
  \ ...\n RIP: 0010:scx_set_task_state+0x7c/0xc0\n ...\n Call Trace:\n  <TASK>\n \
  \ scx_enable_task+0x11f/0x2e0\n  switching_to_scx+0x24/0x110\n  scx_enable.isra.0+0xd14/0x13d0\n\
  \  bpf_struct_ops_link_create+0x136/0x1a0\n  __sys_bpf+0x1edd/0x2c30\n  __x64_sys_bpf+0x21/0x30\n\
  \  do_syscall_64+0xbb/0x370\n  entry_SYSCALL_64_after_hwframe+0x77/0x7f\n\nThis
  happens because we skip initialization for tasks that are already\ndead (with their
  usage counter set to zero), but we don't exclude them\nduring the scheduling class
  transition phase.\n\nFi"
