title: "A Server-Side Request Forgery (SSRF) and credential exfiltration vulnerability
  exists in the cloud-healthcare-fhir-fetch-page tool of googleapis/mcp-toolbox.\n\
  \nThe tool takes an unvalidated pageURL parameter from the client and issues an
  HTTP GET request to it using an authenticated client. The underlying transport automatically
  attaches an Authorization: Bearer  header to every outbound request regardless of
  the destination host. An attacker can supply an arbitrary external URL to the pageURL
  parameter (either directly via the tool execution payload or implicitly via data-driven
  pagination tracking loops), leading Toolbox into sending its OAuth/service-account
  access token to an attacker-controlled listener. Depending on the configuration,
  this leaks either the end-user's token or the broader service-account access token
  (ADC), potentially exposing Protected Health Information (PHI) and secondary Google
  Cloud Platform services."
