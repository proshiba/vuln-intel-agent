title: GoAccess is a real-time web log analyzer and interactive viewer that runs
  in a terminal in *nix systems or through the browser. Prior to 1.11, the 
  parse_ios() function uses an attacker-controlled keyword-to-OS offset as both 
  the source offset and copy length for memmove, allowing a crafted User-Agent 
  in a processed access log to read up to approximately 4 KB beyond the heap 
  allocation and conditionally crash GoAccess. This issue is fixed in version 
  1.11.
