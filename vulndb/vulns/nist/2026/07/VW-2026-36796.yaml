title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbridge:
  cfm: reject invalid CCM interval at configuration time\n\nccm_tx_work_expired()
  re-arms itself via queue_delayed_work() using\nthe configured exp_interval converted
  by interval_to_us(). When\nexp_interval is BR_CFM_CCM_INTERVAL_NONE or out of range,\n\
  interval_to_us() returns 0, causing the worker to fire immediately in\na tight loop
  that allocates skbs until OOM.\n\nFix this by validating exp_interval at configuration
  time:\n\n - Constrain IFLA_BRIDGE_CFM_CC_CONFIG_EXP_INTERVAL to the valid range\n\
  \   [BR_CFM_CCM_INTERVAL_3_3_MS, BR_CFM_CCM_INTERVAL_10_MIN] in the\n   netlink
  policy so userspace cannot set an invalid value.\n\n - Reject starting CCM TX in
  br_cfm_cc_ccm_tx() when exp_interval has\n   not yet been configured (defaults to
  0 from kzalloc)."
