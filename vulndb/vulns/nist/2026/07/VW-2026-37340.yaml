title: Joomla Extension - joomlacontenteditor.net - Creation of hidden files and
  unintended file overwrite via rename function in Joomla Content Editor (JCE) <
  2.20.2 - Improper input validation in the file rename functionality allowed an
  authenticated user with file management permissions to rename files to 
  otherwise invalid names, resulting in the creation of hidden files. The issue 
  also allowed existing files at the destination path to be unintentionally 
  replaced.
