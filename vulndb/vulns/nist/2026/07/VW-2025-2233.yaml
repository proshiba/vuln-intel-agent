title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  fbnic: unlink NAPIs from queues on error to open\n\nCI hit a UaF in fbnic in the
  AF_XDP portion of the queues.py test.\nThe UaF is in the __sk_mark_napi_id_once()
  call in xsk_bind(),\nNAPI has been freed. Looks like the device failed to open earlier,\n\
  and we lack clearing the NAPI pointer from the queue."
