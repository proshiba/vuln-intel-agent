title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-auth:
  validate reply message payload bounds against transfer length\n\nnvmet_auth_reply()
  accesses the variable-length rval[] array using\nattacker-controlled hl (hash length)
  and dhvlen (DH value length) fields\nwithout verifying they fit within the allocated
  buffer of tl bytes.\n\nA malicious NVMe-oF initiator can craft a DHCHAP_REPLY message
  with a\nsmall transfer length but large hl/dhvlen values, causing out-of-bounds\n\
  heap reads when the target processes the DH public key (rval + 2*hl) or\nperforms
  the host response memcmp.\n\nWith DH authentication configured, the OOB pointer
  is passed directly to\nsg_init_one() and read by crypto_kpp_compute_shared_secret(),
  reaching\nup to 526 bytes past the buffer. This is exploitable pre-authentication.\n\
  \nAdd bounds validation ensuring sizeof(*data) + 2*hl + dhvlen <= tl before\nany
  access to the variable-length fields.\n\nDiscovered by Atuin - Automated Vulnerability
  Discovery Engine"
