title: Convoy is a KVM server management panel for hosting businesses. From 
  version 3.9.0-beta to before version 4.5.1, the JWTService::decode() method 
  did not verify the cryptographic signature of JWT tokens. While the method 
  configured a symmetric HMAC-SHA256 signer via lcobucci/jwt, it only validated 
  time-based claims (exp, nbf, iat) using the StrictValidAt constraint. The 
  SignedWith constraint was not included in the validation step. This means an 
  attacker could forge or tamper with JWT token payloads — such as modifying the
  user_uuid claim — and the token would be accepted as valid, as long as the 
  time-based claims were satisfied. This directly impacts the SSO authentication
  flow (LoginController::authorizeToken), allowing an attacker to authenticate 
  as any user by crafting a token with an arbitrary user_uuid. This issue has 
  been patched in version 4.5.1.
