title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfpga:
  dfl-afu: validate DMA mapping length in afu_dma_map_region()\n\nafu_ioctl_dma_map()
  accepts a 64-bit length from userspace via\nDFL_FPGA_PORT_DMA_MAP ioctl without
  an upper bound check. The value\nis passed to afu_dma_pin_pages() where npages is
  derived as\nlength >> PAGE_SHIFT and passed to pin_user_pages_fast() which takes\n\
  int nr_pages, causing implicit truncation if length is very large.\n\nValidate map.length
  at the ioctl entry point before calling\nafu_dma_map_region(), rejecting values
  whose page count exceeds\nINT_MAX."
