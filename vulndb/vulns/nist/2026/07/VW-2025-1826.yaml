title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetdev:
  prevent accessing NAPI instances from another namespace\n\nThe NAPI IDs were not
  fully exposed to user space prior to the netlink\nAPI, so they were never namespaced.
  The netlink API must ensure that\nat the very least NAPI instance belongs to the
  same netns as the owner\nof the genl sock.\n\nnapi_by_id() can become static now,
  but it needs to move because of\ndev_get_by_napi_id()."
