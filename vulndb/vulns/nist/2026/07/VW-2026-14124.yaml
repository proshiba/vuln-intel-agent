title: "A Spring MVC or Spring WebFlux application which configures a mapping for
  \"/**\" where the view name is not explicitly specified allows an attacker to craft
  a link resulting in a 302 redirect to an arbitrary external host via the redirect:
  prefix.\n\nAffected versions:\nSpring Framework 7.0.0 through 7.0.7; 6.2.0 through
  6.2.18; 6.1.0 through 6.1.27; 5.3.0 through 5.3.48."
