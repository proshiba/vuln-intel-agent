title: Camaleon CMS versions 2.1.1 through 2.9.1 contains an authenticated 
  remote code execution vulnerability that allows users with custom_fields 
  manage permission to execute arbitrary Ruby code by supplying a malicious 
  expression through the select_eval custom field type. Attackers can store an 
  attacker-controlled Ruby expression in the field options command parameter, 
  which is evaluated via instance_eval within an ERB view whenever a post edit 
  page is rendered, achieving server-side code execution with web server process
  privileges.
