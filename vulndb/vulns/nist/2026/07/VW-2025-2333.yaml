title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncnic:
  Fix use-after-free bugs in cnic_delete_task\n\nThe original code uses cancel_delayed_work()
  in cnic_cm_stop_bnx2x_hw(),\nwhich does not guarantee that the delayed work item
  'delete_task' has\nfully completed if it was already running. Additionally, the
  delayed work\nitem is cyclic, the flush_workqueue() in cnic_cm_stop_bnx2x_hw() only\n\
  blocks and waits for work items that were already queued to the\nworkqueue prior
  to its invocation. Any work items submitted after\nflush_workqueue() is called are
  not included in the set of tasks that the\nflush operation awaits. This means that
  after the cyclic work items have\nfinished executing, a delayed work item may still
  exist in the workqueue.\nThis leads to use-after-free scenarios where the cnic_dev
  is deallocated\nby cnic_free_dev(), while delete_task remains active and attempt
  to\ndereference cnic_dev in cnic_delete_task().\n\nA typical race condition is illustrated
