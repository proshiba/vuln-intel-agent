title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusbnet:
  gl620a: fix out-of-bounds read in genelink_rx_fixup()\n\ngenelink_rx_fixup() splits
  an aggregated RX frame into its individual\npackets, using a per-packet length taken
  from device-supplied data. That\nlength is only bounded by GL_MAX_PACKET_LEN (1514);
  it is never compared\nagainst how many bytes were actually received.\n\nA malicious
  GeneLink (GL620A) device can therefore send a short URB whose\nheader claims packet_count
  > 1 and a first packet of up to 1514 bytes.\n\n\tskb_put_data(gl_skb, packet->packet_data,
  size);\n\nthen copies past the end of the receive buffer and hands the adjacent
  slab\ncontents up the network stack, an out-of-bounds read that leaks kernel heap.\n\
  No privilege is required: the path runs in the usbnet RX softirq as soon as\nthe
  interface is up.\n\n  BUG: KASAN: slab-out-of-bounds in genelink_rx_fixup (drivers/net/usb/gl620a.c:112)\n\
  \  Read of size 1514 at addr ffff888011309708 by task ksoftirqd/0/14\n  Ca"
