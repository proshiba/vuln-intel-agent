title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  misc: usbio: bound bulk IN response length to the received transfer\n\nusbio_bulk_msg()
  copies bpkt_len = le16_to_cpu(bpkt->len) bytes out of\nthe bulk IN buffer (usbio->rxbuf,
  allocated with size usbio->rxbuf_len)\ninto the caller's buffer.  bpkt_len is fully
  controlled by the device\nand is only checked against ibuf_len; ibuf_len in turn
  is checked\nagainst usbio->txbuf_len, not against rxbuf_len:\n\n\tif ((obuf_len
  > (usbio->txbuf_len - sizeof(*bpkt))) ||\n\t    (ibuf_len > (usbio->txbuf_len -
  sizeof(*bpkt))))\n\t\treturn -EMSGSIZE;\n\ntxbuf_len and rxbuf_len are taken independently
  from the bulk OUT and\nbulk IN endpoint wMaxPacketSize in usbio_probe().  A malicious
  or\nmalfunctioning device that advertises a large bulk OUT endpoint and a\nsmall
  bulk IN endpoint (e.g. by claiming one of the quirk-free IDs such\nas the Lattice
  NX33U, 0x2ac1:0x20cb) therefore makes ibuf_len, and\nhence the device-supplied bpkt_len,
  exceed rxbuf_len"
