title: InvenTree is an Open Source Inventory Management System. Prior to 1.2.7 
  and 1.3.0, when INVENTREE_DOWNLOAD_FROM_URL is enabled (opt-in), authenticated
  users can supply remote_image URLs that are fetched server-side via 
  requests.get() with only Django's URLValidator check. There is no validation 
  against private IP ranges or internal hostnames. Redirects are followed 
  (allow_redirects=True), enabling bypass of any URL-format checks. This 
  vulnerability is fixed in 1.2.7 and 1.3.0.
