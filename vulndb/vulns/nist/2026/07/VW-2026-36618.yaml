title: "Improper Handling of Exceptional Conditions vulnerability in Erlang OTP erts
  (epmd) allows an unauthenticated remote attacker to permanently terminate the Erlang
  Port Mapper Daemon (epmd) via connection slot exhaustion.\n\nThe do_accept function
  in erts/epmd/src/epmd_srv.c calls epmd_cleanup_exit() when accept(2) returns EMFILE
  (per-process file descriptor limit reached) or ENFILE (system-wide file descriptor
  limit reached), rather than treating these as recoverable conditions. An attacker
  can exhaust epmd's file descriptor slots by holding many TCP connections open while
  periodically sending a single byte to reset the idle timeout, then causing accept(2)
  to return EMFILE, which kills the daemon. epmd has no per-source-IP connection cap,
  making the attack feasible from a single source.\n\nOn Debian/Ubuntu default packaging
  the impact is amplified: the systemd unit inherits a low file descriptor soft limit,
