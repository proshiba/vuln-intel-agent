title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregulator:
  scmi: fix of_node refcount leak in scmi_regulator_probe()\n\nscmi_regulator_probe()
  calls of_find_node_by_name() which takes a\nreference on the returned device node.
  On the error path where\nprocess_scmi_regulator_of_node() fails, the function returns
  without\ncalling of_node_put() on the child node, leaking the reference.\n\nAdd
  of_node_put(np) on the error path to properly release the\nreference."
