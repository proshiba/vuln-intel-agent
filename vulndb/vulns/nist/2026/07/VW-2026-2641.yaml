title: Cross-Site Scripting (XSS) vulnerability reflected in Semantic MediaWiki.
  This vulnerability allows an attacker to execute JavaScript code in the 
  victim's browser by sending them a malicious URL using the 
  '/index.php/Speciaal:GefacetteerdZoeken' endpoint parameter. This 
  vulnerability can be exploited to steal sensitive user data, such as session 
  cookies, or to perform actions on behalf of the user.
