title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet_sched:
  sch_sfq: fix a potential crash on gso_skb handling\n\nSFQ has an assumption of always
  being able to queue at least one packet.\n\nHowever, after the blamed commit, sch->q.len
  can be inflated by packets\nin sch->gso_skb, and an enqueue() on an empty SFQ qdisc
  can be followed\nby an immediate drop.\n\nFix sfq_drop() to properly clear q->tail
  in this situation.\n\n\nip netns add lb\nip link add dev to-lb type veth peer name
  in-lb netns lb\nethtool -K to-lb tso off                 # force qdisc to requeue
  gso_skb\nip netns exec lb ethtool -K in-lb gro on # enable NAPI\nip link set dev
  to-lb up\nip -netns lb link set dev in-lb up\nip addr add dev to-lb 192.168.20.1/24\n\
  ip -netns lb addr add dev in-lb 192.168.20.2/24\ntc qdisc replace dev to-lb root
  sfq limit 100\n\nip netns exec lb netserver\n\nnetperf -H 192.168.20.2 -l 100 &\n\
  netperf -H 192.168.20.2 -l 100 &\nnetperf -H 192.168.20.2 -l 100 &\nnetperf -H 192.168.20.2
  -l 100 &"
