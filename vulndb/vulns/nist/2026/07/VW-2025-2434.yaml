title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix metadata_dst leak __bpf_redirect_neigh_v{4,6}\n\nCilium has a BPF egress gateway
  feature which forces outgoing K8s Pod\ntraffic to pass through dedicated egress
  gateways which then SNAT the\ntraffic in order to interact with stable IPs outside
  the cluster.\n\nThe traffic is directed to the gateway via vxlan tunnel in collect
  md\nmode. A recent BPF change utilized the bpf_redirect_neigh() helper to\nforward
  packets after the arrival and decap on vxlan, which turned out\nover time that the
  kmalloc-256 slab usage in kernel was ever-increasing.\n\nThe issue was that vxlan
  allocates the metadata_dst object and attaches\nit through a fake dst entry to the
  skb. The latter was never released\nthough given bpf_redirect_neigh() was merely
  setting the new dst entry\nvia skb_dst_set() without dropping an existing one first."
