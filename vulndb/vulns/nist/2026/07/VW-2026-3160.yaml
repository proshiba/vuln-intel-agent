title: A flaw was found in binutils. A heap-buffer-overflow vulnerability exists
  when processing a specially crafted XCOFF (Extended Common Object File Format)
  object file during linking. A local attacker could trick a user into 
  processing this malicious file, which could lead to arbitrary code execution, 
  allowing the attacker to run unauthorized commands, or cause a denial of 
  service, making the system unavailable.
