title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwrng:
  virtio: clamp device-reported used.len at copy_data()\n\nrandom_recv_done() stores
  the device-reported used.len directly into\nvi->data_avail.  copy_data() then indexes
  vi->data[] using\nvi->data_idx (advanced by previous copy_data() calls) and issues
  a\nmemcpy() without re-validating either value against the posted\nbuffer size sizeof(vi->data)
  (SMP_CACHE_BYTES bytes, typically 32\nor 64).\n\nA malicious or buggy virtio-rng
  backend can set used.len beyond\nsizeof(vi->data), steering the memcpy() past the
  end of the inline\narray into adjacent kmalloc-1k slab bytes.  hwrng_fillfn() mixes\n\
  those bytes into the guest RNG, and guest root can also observe\nthem directly via
  /dev/hwrng.\n\nConcrete impact is inside the guest:\n\n - Memory-safety / hardening:
  any virtio-rng backend that\n   over-reports used.len causes the driver to read
  past vi->data\n   into unrelated slab contents.  hwrng_fillfn() is a kernel thread\n\
