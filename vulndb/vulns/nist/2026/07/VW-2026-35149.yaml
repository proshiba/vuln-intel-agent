title: Emlog is an open source website building system. Prior to version 2.6.8, 
  the backend upgrade interface accepts remote SQL and ZIP URLs via GET 
  parameters. The server first downloads and executes the SQL file, then 
  downloads the ZIP file and extracts it directly into the web root directory. 
  This process does not validate a CSRF token. Therefore, an attacker only needs
  to trick an authenticated administrator into visiting a malicious link to 
  achieve arbitrary SQL execution and arbitrary file write. This issue has been 
  patched in version 2.6.8.
