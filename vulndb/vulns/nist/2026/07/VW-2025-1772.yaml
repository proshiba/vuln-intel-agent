title: "Insufficient Session Expiration vulnerability in team-alembic ash_authentication_phoenix
  allows a session token captured before sign-out to remain usable afterwards.\n\n\
  The default sign_out/2 that AshAuthentication.Phoenix.Controller injects into an
  application's auth controller only calls Plug.Conn.clear_session/1. It never revokes
  the stored session or bearer tokens, so a token obtained before sign-out, through
  script injection, interception or device theft, keeps authenticating until its own
  expiry. Changing the password still revokes it.\n\nThis issue affects ash_authentication_phoenix:
  from 0.1.0 before 2.10.0."
