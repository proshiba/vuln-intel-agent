title: 'phpMyFAQ is an open source FAQ web application. Prior to version 4.1.1, the
  regex-based SVG sanitizer in phpMyFAQ (SvgSanitizer.php) can be bypassed using HTML
  entity encoding in javascript: URLs within SVG <a href> attributes. Any user with
  edit_faq permission can upload a malicious SVG that executes arbitrary JavaScript
  when viewed, enabling privilege escalation from editor to full admin takeover. This
  issue has been patched in version 4.1.1.'
