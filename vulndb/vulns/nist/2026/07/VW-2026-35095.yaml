title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/dmc:
  Fix an unlikely NULL pointer deference at probe\n\nintel_dmc_update_dc6_allowed_count()
  oopses when DMC hasn't been\ninitialized, and dmc is thus NULL.\n\nThat would be
  the case when the call path is\nintel_power_domains_init_hw() -> {skl,bxt,icl}_display_core_init()
  ->\ngen9_set_dc_state() -> intel_dmc_update_dc6_allowed_count(), as\nintel_power_domains_init_hw()
  is called *before* intel_dmc_init().\n\nHowever, gen9_set_dc_state() calls intel_dmc_update_dc6_allowed_count()\n\
  conditionally, depending on the current and target DC states. At probe,\nthe target
  is disabled, but if DC6 is enabled, the function is called,\nand an oops follows.
  Apparently it's quite unlikely that DC6 is enabled\nat probe, as we haven't seen
  this failure mode before.\n\nIt is also strange to have DC6 enabled at boot, since
  that would require\nthe DMC firmware (loaded by BIOS); the BIOS loading the DMC
  firmware and\nthe driver stopping / reprogram"
