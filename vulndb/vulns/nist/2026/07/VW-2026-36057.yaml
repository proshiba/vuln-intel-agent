title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: composite: fix dead empty check in the USB_DT_OTG handler\n\nThe OTG branch
  of composite_setup() falls back to the first\nconfiguration when none is selected:\n\
  \n\tif (cdev->config)\n\t\tconfig = cdev->config;\n\telse\n\t\tconfig = list_first_entry(&cdev->configs,\n\
  \t\t\t\t\t  struct usb_configuration, list);\n\tif (!config)\n\t\tgoto done;\n\t\
  ...\n\tmemcpy(req->buf, config->descriptors[0], value);\n\nlist_first_entry() never
  returns NULL. On an empty list it returns\ncontainer_of() of the list head. So the
  \"if (!config)\" check is dead.\n\nWhen cdev->configs is empty, config points at
  the head inside struct\nusb_composite_dev. config->descriptors[0] reads whatever
  sits at that\noffset. The memcpy copies up to w_length bytes of it into the response\n\
  buffer.\n\ncdev->configs can be empty in two cases. One is a teardown race on\n\
  gadget unbind with a control transfer in flight. The other is a driver\nthat sets
  is_otg before it adds a config. A repro"
