title: Admidio is an open-source user management solution. From version 5.0.0 to
  before version 5.0.8, the delete mode handler in mylist_function.php 
  permanently deletes list configurations without validating a CSRF token. An 
  attacker who can lure an authenticated user to a malicious page can silently 
  destroy that user's list configurations — including organization-wide shared 
  lists when the victim holds administrator rights. This issue has been patched 
  in version 5.0.8.
