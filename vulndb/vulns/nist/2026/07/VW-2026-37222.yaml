title: The WowStore – Store Builder & Product Blocks for WooCommerce plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via 'filterMobileText' 
  Block Attribute in all versions up to, and including, 4.4.24 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for authenticated attackers, with contributor-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The save-time wp_kses_post sanitization is 
  ineffective because the payload is stored inside a Gutenberg block delimiter 
  comment as JSON, which wp_kses_post preserves, allowing an attribute-breakout 
  string to survive to the server-side render_callback.
