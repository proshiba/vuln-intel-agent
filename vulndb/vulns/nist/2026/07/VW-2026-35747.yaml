title: Tophat is a mobile applications testing harness. Prior to 2.5.1, Tophat 
  is affected by remote code execution via crafted tophat:// or 
  http://localhost:29070 URLs. The arguments query parameter flows unsanitized 
  from URL parsing through to /bin/bash -c execution, allowing an attacker to 
  execute arbitrary commands on a developer's macOS workstation. Any developer 
  with Tophat installed is vulnerable. For previously trusted build hosts, no 
  confirmation dialog appears. Attacker commands run with the user's 
  permissions. This vulnerability is fixed in 2.5.1.
