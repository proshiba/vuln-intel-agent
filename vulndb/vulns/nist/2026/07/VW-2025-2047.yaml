title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  don't restore null sk_state_change\n\nqueue->state_change is set as part of nvmet_tcp_set_queue_sock(),
  but if\nthe TCP connection isn't established when nvmet_tcp_set_queue_sock() is\n\
  called then queue->state_change isn't set and sock->sk->sk_state_change\nisn't replaced.\n\
  \nAs such we don't need to restore sock->sk->sk_state_change if\nqueue->state_change
  is NULL.\n\nThis avoids NULL pointer dereferences such as this:\n\n[  286.462026][\
  \    C0] BUG: kernel NULL pointer dereference, address: 0000000000000000\n[  286.462814][\
  \    C0] #PF: supervisor instruction fetch in kernel mode\n[  286.463796][    C0]
  #PF: error_code(0x0010) - not-present page\n[  286.464392][    C0] PGD 8000000140620067
  P4D 8000000140620067 PUD 114201067 PMD 0\n[  286.465086][    C0] Oops: Oops: 0010
  [#1] SMP KASAN PTI\n[  286.465559][    C0] CPU: 0 UID: 0 PID: 1628 Comm: nvme Not
  tainted 6.15.0-rc2+ #11 PREEMPT(voluntary)\n[  286.466393][    C0] Hardware"
