title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Open-code GGTT MMIO access protection\n\nGGTT MMIO access is currently protected
  by hotplug (drm_dev_enter),\nwhich works correctly when the driver loads successfully
  and is later\nunbound or unloaded. However, if driver load fails, this protection
  is\ninsufficient because drm_dev_unplug() is never called.\n\nAdditionally, devm
  release functions cannot guarantee that all BOs with\nGGTT mappings are destroyed
  before the GGTT MMIO region is removed, as\nsome BOs may be freed asynchronously
  by worker threads.\n\nTo address this, introduce an open-coded flag, protected by
  the GGTT\nlock, that guards GGTT MMIO access. The flag is cleared during the\ndev_fini_ggtt
  devm release function to ensure MMIO access is disabled\nonce teardown begins.\n\
  \n(cherry picked from commit 4f3a998a173b4325c2efd90bdadc6ccd3ad9a431)"
