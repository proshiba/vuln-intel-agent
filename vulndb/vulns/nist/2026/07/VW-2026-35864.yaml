title: "libsixel is a SIXEL encoder/decoder implementation derived from kmiya's sixel.
  In versions 1.8.7 and prior, when built with the --with-gdk-pixbuf2 option, a use-after-free
  vulnerability exists in load_with_gdkpixbuf() in loader.c. The cleanup path manually
  frees the sixel_frame_t object and its internal buffers without consulting the reference
  count, even though the object was created via the refcounted constructor sixel_frame_new()
  and exposed to the public callback. A callback that calls sixel_frame_ref(frame)
  to retain a logically valid reference will hold a dangling pointer after sixel_helper_load_image_file()
  returns, and any subsequent access to the frame or its fields triggers a use-after-free
  confirmed by AddressSanitizer. The root cause is a consistency failure between two
  cleanup strategies in the same codebase: sixel_frame_unref() is used in load_with_builtin()
  but raw free() is used in load_with_gdkpixbuf(). An attacker supplying a crafted
  image to any application built aga"
