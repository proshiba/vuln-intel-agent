title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  spectrum_mr: Fix use-after-free when updating multicast route stats\n\nCited commit
  added a dedicated mutex (instead of RTNL) to protect the\nmulticast route list,
  so that it will not change while the driver\nperiodically traverses it in order
  to update the kernel about multicast\nroute stats that were queried from the device.\n\
  \nOne instance of list entry deletion (during route replace) was missed\nand it
  can result in a use-after-free [1].\n\nFix by acquiring the mutex before deleting
  the entry from the list and\nreleasing it afterwards.\n\n[1]\nBUG: KASAN: slab-use-after-free
  in mlxsw_sp_mr_stats_update+0x4a5/0x540 drivers/net/ethernet/mellanox/mlxsw/spectrum_mr.c:1006
  [mlxsw_spectrum]\nRead of size 8 at addr ffff8881523c2fa8 by task kworker/2:5/22043\n\
  \nCPU: 2 UID: 0 PID: 22043 Comm: kworker/2:5 Not tainted 6.18.0-rc1-custom-g1a3d6d7cd014
  #1 PREEMPT(full)\nHardware name: Mellanox Technologies Ltd. MSN2010/SA002610, BIOS
  5.6."
