title: "TOML::XS versions before 0.06 for Perl bundle an unsupported and vulnerable
  version of tomlc99.\n\nThe tomlc99 library is no longer maintained, and has an uncontrolled
  recursion vulnerability publicly reported in the issue tracker.\n\nAny caller that
  passes untrusted TOML to from_toml risks a stack overflow from a deeply-nested document.\n\
  \nTOML::XS version 0.06 or later uses the successor tomlc17 library."
