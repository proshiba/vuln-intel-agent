title: Hono is a Web application framework that provides support for any 
  JavaScript runtime. Prior to 4.12.12, a path traversal issue in toSSG() allows
  files to be written outside the configured output directory during static site
  generation. When using dynamic route parameters via ssgParams, specially 
  crafted values can cause generated file paths to escape the intended output 
  directory. This vulnerability is fixed in 4.12.12.
