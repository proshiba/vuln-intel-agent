title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Move vevent memory allocation outside spinlock\n\nThe veventq memory allocation
  happens inside the spinlock. Given its depth\nis decided by the user space, this
  leaves a vulnerability, where userspace\ncan allocate large queues to exhaust atomic
  memory reserves.\n\nMove the allocation outside the spinlock and use GFP_NOWAIT,
  which can fail\nfast under memory pressure without dipping into the GFP_ATOMIC reserves
  or\ndirect-reclaiming from the threaded IRQ handler. On allocation failure,\nqueue
  the lost_events_header (so userspace learns of the drop) and return\n-ENOMEM so
  the caller learns of the kernel-side memory pressure.\n\nThis is intentionally distinct
  from the queue-overflow path, which also\nqueues the lost_events_header but returns
  0: a full queue is an expected\nuserspace-pacing condition rather than a kernel
  error.\n\nA subsequent change will cap the upper bound of the veventq_depth."
