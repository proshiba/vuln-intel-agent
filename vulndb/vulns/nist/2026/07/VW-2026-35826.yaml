title: Chamilo is an open-source learning management system (LMS). Version 
  2.0.0-RC.2 contains a SQL Injection vulnerability in the statistics AJAX 
  endpoint, which is an incomplete fix for CVE-2026-30881. While CVE-2026-30881 
  was patched by applying Security::remove_XSS() to the date_start and date_end 
  parameters in the get_user_registration_by_month action, the same parameters 
  remain unsanitized in the users_active action within the same file 
  (public/main/inc/ajax/statistics.ajax.php), where they are directly 
  interpolated into a SQL query. An authenticated admin can exploit this to 
  perform time-based blind SQL injection, enabling extraction of arbitrary data 
  from the database. This issue has been fixed in version 2.0.0.
