title: "Improper Isolation or Compartmentalization vulnerability in malach-it boruta
  (Elixir.Boruta.Openid module) allows attackers to register OpenID Connect clients
  with administrative privileges through the dynamic client registration entry point.
  Boruta.Openid.register_client/3 forwards caller-supplied registration parameters
  to the administrative client creation path without a public/admin field-level allowlist,
  so an unauthenticated registrant can set security-sensitive attributes including
  supported grant types, authorized scopes, PKCE enforcement, public refresh and revocation
  behavior, token lifetimes, and signing settings. The library does not distinguish
  between metadata a public registrant is allowed to set and administrative controls
  that should require operator approval.\n\nThis vulnerability is associated with
  program files lib/boruta/openid.ex and program routines 'Elixir.Boruta.Openid':register_client/3,
  'Elixir.Boruta.Openid':parse_registration_params/2.\n\nThis issue affects bor"
