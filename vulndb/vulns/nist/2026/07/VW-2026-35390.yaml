title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the PayPal IPN v1 handler at plugin/PayPalYPT/ipn.php lacks transaction 
  deduplication, allowing an attacker to replay a single legitimate IPN 
  notification to repeatedly inflate their wallet balance and renew 
  subscriptions. The newer ipnV2.php and webhook.php handlers correctly 
  deduplicate via PayPalYPT_log entries, but the v1 handler was never updated 
  and remains actively referenced as the notify_url for billing plans.
