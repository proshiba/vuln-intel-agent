title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Prevent integer overflow in hdr_first_de()\n\nThe \"de_off\" and \"used\" variables
  come from the disk so they both need to\ncheck.  The problem is that on 32bit systems
  if they're both greater than\nUINT_MAX - 16 then the check does work as intended
  because of an integer\noverflow."
