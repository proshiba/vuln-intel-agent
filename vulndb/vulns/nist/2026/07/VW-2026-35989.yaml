title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  core: fix adapter deregistration race\n\nAdapters can be looked up by their id using
  i2c_get_adapter() which\ntakes a reference to the embedded struct device.\n\nRemove
  the adapter from the IDR before tearing it down during\nderegistration (and on registration
  failure) to make sure its resources\nare not accessed after having been freed (e.g.
  the device name)."
