title: Nhost is an open source Firebase alternative with GraphQL. Prior to 
  version 1.41.0, The Nhost CLI MCP server, when explicitly configured to listen
  on a network port, applies no inbound authentication and does not enforce 
  strict CORS. This allows a malicious website visited on the same machine to 
  issue cross-origin requests to the MCP server and invoke privileged tools 
  using the developer's locally configured credentials. This vulnerability 
  requires two explicit, non-default configuration steps to be exploitable. The 
  default nhost mcp start configuration is not affected. This issue has been 
  patched in version 1.41.0.
