title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the EPG (Electronic Program Guide) link feature in AVideo allows authenticated
  users with upload permissions to store arbitrary URLs that the server fetches 
  on every EPG page visit. The URL is validated only with PHP's 
  FILTER_VALIDATE_URL, which accepts internal network addresses. Although AVideo
  has a dedicated isSSRFSafeURL() function for preventing SSRF, it is not called
  in this code path. This results in a stored server-side request forgery 
  vulnerability that can be used to scan internal networks, access cloud 
  metadata services, and interact with internal services. At time of 
  publication, there are no publicly available patches.
