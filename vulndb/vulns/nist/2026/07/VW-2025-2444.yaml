title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  avoid potential out-of-bounds in btrfs_encode_fh()\n\nThe function btrfs_encode_fh()
  does not properly account for the three\ncases it handles.\n\nBefore writing to
  the file handle (fh), the function only returns to the\nuser BTRFS_FID_SIZE_NON_CONNECTABLE
  (5 dwords, 20 bytes) or\nBTRFS_FID_SIZE_CONNECTABLE (8 dwords, 32 bytes).\n\nHowever,
  when a parent exists and the root ID of the parent and the\ninode are different,
  the function writes BTRFS_FID_SIZE_CONNECTABLE_ROOT\n(10 dwords, 40 bytes).\n\n\
  If *max_len is not large enough, this write goes out of bounds because\nBTRFS_FID_SIZE_CONNECTABLE_ROOT
  is greater than\nBTRFS_FID_SIZE_CONNECTABLE originally returned.\n\nThis results
  in an 8-byte out-of-bounds write at\nfid->parent_root_objectid = parent_root_id.\n\
  \nA previous attempt to fix this issue was made but was lost.\n\nhttps://lore.kernel.org/all/4CADAEEC020000780001B32C@vpn.id2.novell.com/\n\
