title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix WEP length underflow and OOB read in OnAuth()\n\nOnAuth() has two
  bugs in the shared-key authentication path.\n\nWhen the Privacy bit is set, rtw_wep_decrypt()
  is called without\nverifying that the frame is long enough to contain a valid WEP
  IV and\nICV.  Inside rtw_wep_decrypt(), length is computed as:\n\n    length = len
  - WLAN_HDR_A3_LEN - iv_len\n\nand then passed as (length - 4) to crc32_le().  If
  len is less than\nWLAN_HDR_A3_LEN + iv_len + icv_len (32 bytes), length - 4 is negative\n\
  and, after the implicit cast to size_t, causes crc32_le() to read far\nbeyond the
  frame buffer.  Add a minimum length check before accessing\nthe IV field and calling
  the decryption path.\n\nWhen processing a seq=3 response, rtw_get_ie() stores the
  Challenge\nText IE length in ie_len, but the subsequent memcmp() always reads 128\n\
  bytes regardless of ie_len.  IEEE 802.11 mandates a challenge text of\nexactly 128
