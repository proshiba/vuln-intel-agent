title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  fix PTP cleanup on driver removal in error path\n\nImprove the cleanup on releasing
  PTP resources in error path.\nThe error case might happen either at the driver probe
  and PTP\nfeature initialization or on PTP restart (errors in reset handling, NVM\n\
  update etc). In both cases, calls to PF PTP cleanup (ice_ptp_cleanup_pf\nfunction)
  and 'ps_lock' mutex deinitialization were missed.\nAdditionally, ptp clock was not
  unregistered in the latter case.\n\nKeep PTP state as 'uninitialized' on init to
  distinguish between error\nscenarios and to avoid resource release duplication at
  driver removal.\n\nThe consequence of missing ice_ptp_cleanup_pf call is the following
  call\ntrace dumped when ice_adapter object is freed (port list is not empty,\nas
  it is required at this stage):\n\n[  T93022] ------------[ cut here ]------------\n\
  [  T93022] WARNING: CPU: 10 PID: 93022 at\nice/ice_adapter.c:67 ice_adapter_put+0xef/0x100
  [ice]\n...\n[  T93022] R"
