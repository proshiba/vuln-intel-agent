title: A flaw was found in the RoleContainerResource component of Keycloak. The 
  issue occurs because certain name-based endpoints in the admin REST API do not
  properly enforce authorization checks when managing composite roles. This 
  allows a delegated administrator with manage-realm permissions to remove 
  essential child roles from built-in admin roles, potentially disrupting 
  administrative functions within a realm.
