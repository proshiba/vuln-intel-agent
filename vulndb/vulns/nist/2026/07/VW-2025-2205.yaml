title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix use-after-free in crypt_message when using async crypto\n\nThe CVE-2024-50047
  fix removed asynchronous crypto handling from\ncrypt_message(), assuming all crypto
  operations are synchronous.\nHowever, when hardware crypto accelerators are used,
  this can cause\nuse-after-free crashes:\n\n  crypt_message()\n    // Allocate the
  creq buffer containing the req\n    creq = smb2_get_aead_req(..., &req);\n\n   \
  \ // Async encryption returns -EINPROGRESS immediately\n    rc = enc ? crypto_aead_encrypt(req)
  : crypto_aead_decrypt(req);\n\n    // Free creq while async operation is still in
  progress\n    kvfree_sensitive(creq, ...);\n\nHardware crypto modules often implement
  async AEAD operations for\nperformance. When crypto_aead_encrypt/decrypt() returns
  -EINPROGRESS,\nthe operation completes asynchronously. Without crypto_wait_req(),\n\
  the function immediately frees the request buffer, leading to crashes\nwhen the
  driver later accesses"
