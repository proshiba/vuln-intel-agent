title: Anchore Enterprise versions from 5.11.0 to 5.27.1 and 6.0.0 contain an 
  improper privilege escalation vulnerability in the user management API. An 
  authenticated attacker who is able to access the Anchore Enterprise API could 
  issue an API call capable of modifying user permissions to gain access to 
  additional resources and operations. It is not possible to grant the 
  system-admin role, but a read only user could be granted write access. This 
  issue is fixed in Anchore Enterprise 5.27.2 and 6.0.1.
