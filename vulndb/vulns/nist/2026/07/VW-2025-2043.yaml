title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tls:
  fix kernel panic when alloc_page failed\n\nWe cannot set frag_list to NULL pointer
  when alloc_page failed.\nIt will be used in tls_strp_check_queue_ok when the next
  time\ntls_strp_read_sock is called.\n\nThis is because we don't reset full_len in
  tls_strp_flush_anchor_copy()\nso the recv path will try to continue handling the
  partial record\non the next call but we dettached the rcvq from the frag list.\n\
  Alternative fix would be to reset full_len.\n\nUnable to handle kernel NULL pointer
  dereference\nat virtual address 0000000000000028\n Call trace:\n tls_strp_check_rcv+0x128/0x27c\n\
  \ tls_strp_data_ready+0x34/0x44\n tls_data_ready+0x3c/0x1f0\n tcp_data_ready+0x9c/0xe4\n\
  \ tcp_data_queue+0xf6c/0x12d0\n tcp_rcv_established+0x52c/0x798"
