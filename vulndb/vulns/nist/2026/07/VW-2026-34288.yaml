title: A security vulnerability has been detected in Belkin F9K1015 1.00.10. 
  Impacted is the function formSetSystemSettings of the file 
  /goform/formSetSystemSettings of the component Setting Handler. The 
  manipulation of the argument webpage leads to stack-based buffer overflow. 
  Remote exploitation of the attack is possible. The exploit has been disclosed 
  publicly and may be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
