title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB read in OnAssocRsp() IE loop\n\nThe IE parsing loop in OnAssocRsp()
  advances by (pIE->length + 2) each\niteration but only guards on i < pkt_len. When
  a malicious AP sends an\nAssocResponse whose last IE has only one byte remaining
  in the frame\n(the element_id byte lands at pkt_len-1), the loop reads pIE->length\n\
  from pframe[pkt_len], which is one byte past the allocated receive buffer.\n\nAdditionally,
  even when the header bytes are in bounds, pIE->length\nitself can extend the data
  window beyond pkt_len, silently passing a\ntruncated IE to the handler functions.\n\
  \nAdd two guards at the top of the loop body:\n  1. Break if fewer than sizeof(*pIE)
  bytes remain (can't read header).\n  2. Break if the IE's declared data extends
  past pkt_len."
