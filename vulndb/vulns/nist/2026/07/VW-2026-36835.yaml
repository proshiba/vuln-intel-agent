  26.7 and iPadOS 26.7, iOS 27 and iPadOS 27, macOS Golden Gate 27, macOS Tahoe 
  26.6, tvOS 26.6, visionOS 26.6, visionOS 27, watchOS 26.6. Processing 
  maliciously crafted web content may lead to an unexpected Safari crash.
