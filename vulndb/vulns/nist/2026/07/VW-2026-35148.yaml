title: nimiq/core-rs-albatross is a Rust implementation of the Nimiq 
  Proof-of-Stake protocol based on the Albatross consensus algorithm. Prior to 
  version 1.3.0, an elected validator proposer can send an election macro block 
  whose header.interlink does not match the canonical next interlink. Honest 
  validators accept that proposal in verify_macro_block_proposal() because the 
  proposal path validates header shape, successor relation, proposer, body root,
  and state, but never checks the interlink binding for election blocks. The 
  same finalized block is later rejected by verify_block() during push with 
  InvalidInterlink. Because validators prevote and precommit the malformed 
  header hash itself, the failure happens after Tendermint decides the block, 
  not before voting. This issue has been patched in version 1.3.0.
