title: A Server-Side Request Forgery (SSRF) vulnerability exists in the Print 
  Format functionality of ERPNext v16.0.1 and Frappe Framework v16.1.1, where 
  user-supplied HTML is insufficiently sanitized before being rendered into PDF.
  When generating PDFs from user-controlled HTML content, the application allows
  the inclusion of HTML elements such as <iframe> that reference external 
  resources. The PDF rendering engine automatically fetches these resources on 
  the server side. An attacker can abuse this behavior to force the server to 
  make arbitrary HTTP requests to internal services, including cloud metadata 
  endpoints, potentially leading to sensitive information disclosure.
