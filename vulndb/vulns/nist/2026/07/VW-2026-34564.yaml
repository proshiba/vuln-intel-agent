title: "Buffer Copy without Checking Size of Input ('Classic Buffer Overflow') vulnerability
  in Apache NimBLE.\nThe HCI socket transport did not check whether a received HCI
  event would fit the configured event pool before copying it, allowing a buffer overflow.
  Severity is low: exploitation requires either a misconfigured pool size or a malicious/compromised
  controller on the other end of the HCI socket link, not over-the-air Bluetooth access.\n\
  \nThis issue affects Apache NimBLE: through 1.9.0.\n\nUsers are recommended to upgrade
  to version 1.10.0, which fixes the issue."
