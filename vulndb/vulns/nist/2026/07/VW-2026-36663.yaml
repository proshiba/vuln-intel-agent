title: A flaw was found in the Event-Driven Ansible (EDA) server. The 
  ExternalEventStreamViewSet uses permissive access controls 
  (permission_classes=[AllowAny], authentication_classes=[]) and relies solely 
  on the Subject HTTP header value for mTLS authentication without verifying 
  that the header originated from a trusted proxy. Additionally, the expected 
  certificate Distinguished Name is leaked in the 403 error response body. An 
  attacker who can reach the EDA API endpoint with a spoofed Subject header can 
  inject arbitrary events into mTLS-protected event streams, triggering 
  downstream automation actions.
