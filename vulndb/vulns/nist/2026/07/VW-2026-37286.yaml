title: The Facturación Electrónica Costa Rica plugin for WordPress is vulnerable
  to Cross-Site Request Forgery in all versions up to, and including, 2.0.2. 
  This is due to missing or incorrect nonce validation on the (global scope, 
  included by fvcr_admin_page_html) function. This makes it possible for 
  unauthenticated attackers to modify the plugin's configuration, including API 
  tokens, access tokens, economic activity, Hacienda environment mode, invoice 
  and ticket emission flags, exchange rate, and branch settings via a forged 
  request granted they can trick a site administrator into performing an action 
  such as clicking on a link.
