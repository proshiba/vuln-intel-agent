title: A flaw was found in ansible-core. The ansible-galaxy role install command
  processes dependency specifications from a role's meta/requirements.yml file. 
  Due to improper neutralization of argument delimiters, a malicious role author
  can inject arbitrary git configuration flags through the src field. This 
  allows arbitrary code execution on the machine of a user who installs the role
  via ansible-galaxy role install.
