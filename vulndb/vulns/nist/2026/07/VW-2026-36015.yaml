title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qat - protect service table iterations with service_lock\n\nThe service_table list
  is protected by service_lock when entries are\nadded or removed (in adf_service_add()
  and adf_service_remove()), but\nseveral functions iterate over the list without
  holding this lock.\n\nA concurrent adf_service_register() or adf_service_unregister()
  call\ncould modify the list during traversal, leading to list corruption or\na use-after-free.\n\
  \nFix this by holding service_lock across all list_for_each_entry()\niterations
  of service_table in adf_dev_init(), adf_dev_start(),\nadf_dev_stop(), adf_dev_shutdown(),
  adf_dev_restarting_notify(),\nadf_dev_restarted_notify(), and adf_error_notifier().\n\
  \nThe lock ordering is safe: callers of the static helpers (adf_dev_up()\nand adf_dev_down())
  acquire state_lock before service_lock, and no\nevent_hld callback or service_lock
  holder ever acquires state_lock in\nthe reverse order."
