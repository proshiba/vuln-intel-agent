title: A security flaw has been discovered in Agions taskflow-ai up to 2.1.8. 
  This impacts an unknown function of the file src/mcp/server/handlers.ts of the
  component terminal_execute. Performing a manipulation results in os command 
  injection. The attack is possible to be carried out remotely. Upgrading to 
  version 2.1.9 will fix this issue. The patch is named 
  c1550b445b9f24f38c4414e9a545f5f79f23a0fe. Upgrading the affected component is 
  recommended. The vendor was contacted early, responded in a very professional 
  manner and quickly released a fixed version of the affected product.
