title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  fix dm_blk_report_zones\n\nIf dm_get_live_table() returned NULL, dm_put_live_table()
  was never\ncalled. Also, it is possible that md->zone_revalidate_map will change\n\
  while calling this function. Only read it once, so that we are always\nusing the
  same value. Otherwise we might miss a call to\ndm_put_live_table().\n\nFinally,
  while md->zone_revalidate_map is set and a process is calling\nblk_revalidate_disk_zones()
  to set up the zone append emulation\nresources, it is possible that another process,
  perhaps triggered by\nblkdev_report_zones_ioctl(), will call dm_blk_report_zones().
