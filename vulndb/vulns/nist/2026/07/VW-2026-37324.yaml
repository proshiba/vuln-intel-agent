title: "GNU Bison allows for an execution of an arbitrary program during HTML report
  generation due to improper handling of grammar-defined configuration variables.
  A grammar file can override the executable used for the XML‑to‑HTML transformation
  step via %define tool.xsltproc, which is accepted without restriction and passed
  directly to execvp().\n \nWhen running bison --html on a attacker-provided grammar,
  this behavior allows execution of an arbitrary program with the privileges of the
  Bison process.\n\n\nMaintainers of this project were notified about this vulnerability,
  and fixed the issue in commit 3169c1e7a2c6acc4c59dfcf8b089896d6881925b. However,
  they did not provide vulnerable version range. Version 3.8.2 was tested and confirmed
  as vulnerable, other versions were not tested but might also be vulnerable."
