title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix incorrect validation for num_aces field of smb_acl\n\nparse_dcal() validate
  num_aces to allocate posix_ace_state_array.\n\nif (num_aces > ULONG_MAX / sizeof(struct
  smb_ace *))\n\nIt is an incorrect validation that we can create an array of size
  ULONG_MAX.\nsmb_acl has ->size field to calculate actual number of aces in request
  buffer\nsize. Use this to check invalid num_aces."
