title: DOMPurify before 3.4.12 fails to execute afterSanitizeElements hook for 
  custom elements allowed via CUSTOM_ELEMENT_HANDLING.tagNameCheck, allowing 
  attributes to bypass application security policies. Attackers can preserve 
  sensitive attributes on custom elements that later re-inject them into 
  innerHTML sinks, creating second-order XSS gadgets.
