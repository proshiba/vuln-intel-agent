title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  Bridge, fix the crash caused by LAG state check\n\nWhen removing LAG device from
  bridge, NETDEV_CHANGEUPPER event is\ntriggered. Driver finds the lower devices (PFs)
  to flush all the\noffloaded entries. And mlx5_lag_is_shared_fdb is checked, it returns\n\
  false if one of PF is unloaded. In such case,\nmlx5_esw_bridge_lag_rep_get() and
  its caller return NULL, instead of\nthe alive PF, and the flush is skipped.\n\n\
  Besides, the bridge fdb entry's lastuse is updated in mlx5 bridge\nevent handler.
  But this SWITCHDEV_FDB_ADD_TO_BRIDGE event can be\nignored in this case because
  the upper interface for bond is deleted,\nand the entry will never be aged because
  lastuse is never updated.\n\nTo make things worse, as the entry is alive, mlx5 bridge
  workqueue\nkeeps sending that event, which is then handled by kernel bridge\nnotifier.
  It causes the following crash when accessing the passed bond\nnetdev which is already
