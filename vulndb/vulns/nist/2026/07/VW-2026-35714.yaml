title: LORIS (Longitudinal Online Research and Imaging System) is a self-hosted 
  web application that provides data- and project-management for neuroimaging 
  research. Prior to 27.0.3 and 28.0.1, a SQL injection has been identified in 
  some code sections for the MRI feedback popup window of the imaging browser. 
  Attackers can use SQL ingestion to access/alter data on the server. This 
  vulnerability is fixed in 27.0.3 and 28.0.1.
