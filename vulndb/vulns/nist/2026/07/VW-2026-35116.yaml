title: Cloudreve is a self-hosted file management and sharing system. Prior to 
  version 4.13.0, the application uses the weak pseudo-random number generator 
  math/rand seeded with time.Now().UnixNano() to generate critical security 
  secrets, including the secret_key, and hash_id_salt. These secrets are 
  generated upon first startup and persisted in the database. An attacker can 
  exploit this by obtaining the administrator's account creation time (via 
  public API endpoints) to narrow the search window for the PRNG seed, and use 
  known hashid to validate the seed. By brute-forcing the seed (demonstrated to 
  take <3 hours on general consumer PC), an attacker can predict the secret_key.
  This allows them to forge valid JSON Web Tokens (JWTs) for any user, including
  administrators, leading to full account takeover and privilege escalation. 
  This issue has been patched in version 4.13.0.
