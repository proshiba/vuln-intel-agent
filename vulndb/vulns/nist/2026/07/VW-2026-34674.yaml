title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: hyper-v: Bound the bank index when querying sparse banks\n\nWhen checking if
  a VP ID is included in a sparse bank set, explicitly check\nthat the ID can actually
  be contained in a sparse bank (the TLFS allows for\na maximum of 64 banks of 64
  vCPUs each).  When handling a paravirtual TLB\nflush for L2, the VP ID is copied
  verbatim from the enlightened VMCS,\nwithout any bounds check, i.e. isn't guaranteed
  to be under the limit of\n4096.\n\nFailure to check the bounds of the VP ID leads
  to an out-of-bounds read\nwhen testing the sparse bank, and super strictly speaking
  could lead to KVM\nperforming an unnecessary TLB flush for an L2 vCPU.\n\n  ==================================================================\n\
  \  BUG: KASAN: use-after-free in hv_is_vp_in_sparse_set+0x85/0x100 [kvm]\n  Read
  of size 8 at addr ffff88811ba5f598 by task hyperv_evmcs/2802\n\n  CPU: 12 UID: 1000
  PID: 2802 Comm: hyperv_evmcs Not tainted 7.1.0-rc2 #7 PR"
