title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet_sched:
  sch_sfq: move the limit validation\n\nIt is not sufficient to directly validate
  the limit on the data that\nthe user passes as it can be updated based on how the
  other parameters\nare changed.\n\nMove the check at the end of the configuration
  update process to also\ncatch scenarios where the limit is indirectly updated, for
  example\nwith the following configurations:\n\ntc qdisc add dev dummy0 handle 1:
  root sfq limit 2 flows 1 depth 1\ntc qdisc add dev dummy0 handle 1: root sfq limit
  2 flows 1 divisor 1\n\nThis fixes the following syzkaller reported crash:\n\n------------[
  cut here ]------------\nUBSAN: array-index-out-of-bounds in net/sched/sch_sfq.c:203:6\n\
  index 65535 is out of range for type 'struct sfq_head[128]'\nCPU: 1 UID: 0 PID:
  3037 Comm: syz.2.16 Not tainted 6.14.0-rc2-syzkaller #0\nHardware name: Google Google
  Compute Engine/Google Compute Engine, BIOS Google 12/27/2024\nCall Trace:\n <TASK>\n\
  \ __dump_stack lib/dump_s"
