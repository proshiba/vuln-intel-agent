title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Fix SPSR_EL2 restore in kvm_hyp_handle_mops()\n\nkvm_hyp_handle_mops()
  resets the single-step state machine as part of\nrewinding state for a MOPS exception
  by modifying vcpu_cpsr() and\nwriting the result directly into hardware.\n\nIn the
  case of nested virtualization, vcpu_cpsr() is a synthetic value\nsuch that the rest
  of KVM can deal with vEL2 cleanly. That means the\nvalue requires translation before
  being written into hardware, which is\nunfortunately missing from the MOPS handler.\n\
  \nFix it by directly modifying SPSR_EL2 and avoiding the synthetic state\naltogether,
  which will be resynchronized on the next 'full' exit back\nto KVM."
