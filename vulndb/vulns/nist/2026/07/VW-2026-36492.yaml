title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  check INIT_FAILED before nvmet_req_uninit in digest error path\n\nIn nvmet_tcp_try_recv_ddgst(),
  when a data digest mismatch is detected,\nnvmet_req_uninit() is called unconditionally.
  However, if the command\narrived via the nvmet_tcp_handle_req_failure() path, nvmet_req_init()\n\
  had returned false and percpu_ref_tryget_live() was never executed. The\nunconditional
  percpu_ref_put() inside nvmet_req_uninit() then causes a\nrefcount underflow, leading
  to a WARNING in\npercpu_ref_switch_to_atomic_rcu, a use-after-free diagnostic, and\n\
  eventually a permanent workqueue deadlock.\n\nCheck cmd->flags & NVMET_TCP_F_INIT_FAILED
  before calling\nnvmet_req_uninit(), matching the existing pattern in\nnvmet_tcp_execute_request()."
