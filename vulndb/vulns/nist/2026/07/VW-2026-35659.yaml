title: Hono is a Web application framework that provides support for any 
  JavaScript runtime. Prior to 4.12.12, a path handling inconsistency in 
  serveStatic allows protected static files to be accessed by using repeated 
  slashes (//) in the request path. When route-based middleware (e.g., /admin/*)
  is used for authorization, the router may not match paths containing repeated 
  slashes, while serveStatic resolves them as normalized paths. This can lead to
  a middleware bypass. This vulnerability is fixed in 4.12.12.
