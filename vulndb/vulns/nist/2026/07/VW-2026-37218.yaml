title: The Wholesale for WooCommerce plugin for WordPress is vulnerable to 
  Privilege Escalation in all versions up to, and including, 2.0.5. This is due 
  to the `save_requests_meta()` function applying only `sanitize_text_field()` 
  to the `user_role_set` POST parameter before passing it directly to 
  `WP_User::add_role()`, with no allowlist validation against permitted 
  wholesale roles and no capability check such as 
  `current_user_can('promote_users')` or `current_user_can('manage_options')`. 
  This makes it possible for authenticated attackers with author-level access 
  and above to escalate their privileges to administrator by supplying 
  `administrator` as the `user_role_set` value in a crafted request. The 
  function is gated only by a nonce (`request_user_role_nonce`) that is rendered
  in the meta box on the `wwp_requests` post edit screen; because the post type 
