title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the Live restream log callback flow accepted an attacker-controlled 
  restreamerURL and later fetched that stored URL server-side, enabling stored 
  SSRF for authenticated streamers. The vulnerable flow allowed a low-privilege 
  user with streaming permission to store an arbitrary callback URL and trigger 
  server-side requests to loopback or internal HTTP services through the 
  restream log feature.
