title: The Cookie Banner for GDPR / CCPA – WPLP Cookie Consent plugin for 
  WordPress is vulnerable to Cross-Site Request Forgery in all versions up to, 
  and including, 4.3.7. This is due to missing or incorrect nonce validation on 
  the process_bulk_action function. This makes it possible for unauthenticated 
  attackers to permanently delete or forcibly resolve arbitrary GDPR data 
  request records stored in the wpl_data_req table via a forged request granted 
  they can trick a site administrator into performing an action such as clicking
  on a link.
