title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/cmd_net:
  fix wrong argument types for skb_queue_splice()\n\nIf timestamp retriving needs
  to be retried and the local list of\nSKB's already has entries, then it's spliced
  back into the socket\nqueue. However, the arguments for the splice helper are transposed,\n\
  causing exactly the wrong direction of splicing into the on-stack\nlist. Fix that
  up."
