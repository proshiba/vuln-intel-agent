title: Zulip is an open-source team collaboration tool. From version 1.4.0 to 
  before version 11.6, ./manage.py import reads arbitrary files from the server 
  filesystem via path traversal in uploads/records.json. A crafted export 
  tarball causes the server to copy any file the zulip user can read into the 
  uploads directory during import. This issue has been patched in version 11.6.
