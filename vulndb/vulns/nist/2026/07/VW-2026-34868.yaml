title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the plugin/YPTWallet/view/users.json.php endpoint returns all platform users 
  with their personal information and wallet balances to any authenticated user.
  The endpoint checks User::isLogged() but does not check User::isAdmin(), so 
  any registered user can dump the full user database. At time of publication, 
  there are no publicly available patches.
