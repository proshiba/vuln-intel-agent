title: The Attendance Manager plugin for WordPress is vulnerable to SQL 
  Injection via the 'attmgr_off' parameter in all versions up to, and including,
  0.6.2. This is due to insufficient escaping on the user supplied parameter and
  lack of sufficient preparation on the existing SQL query. This makes it 
  possible for authenticated attackers, with Subscriber-level access and above, 
  to append additional SQL queries into already existing queries that can be 
  used to extract sensitive information from the database.
