title: Electron is a framework for writing cross-platform desktop applications 
  using JavaScript, HTML and CSS. Prior to versions 38.8.6, 39.8.1, 40.8.1, and 
  41.0.0, on macOS and Linux, apps that call app.requestSingleInstanceLock() 
  were vulnerable to an out-of-bounds heap read when parsing a crafted 
  second-instance message. Leaked memory could be delivered to the app's 
  second-instance event handler. This issue is limited to processes running as 
  the same user as the Electron app. Apps that do not call 
  app.requestSingleInstanceLock() are not affected. Windows is not affected by 
  this issue. This issue has been patched in versions 38.8.6, 39.8.1, 40.8.1, 
  and 41.0.0.
