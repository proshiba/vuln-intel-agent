title: BuildKit's cache mount source= selector on Windows Container on Windows 
  (WCOW) workers does not detect NTFS directory junctions placed inside the 
  cache root. A build authored by an untrusted user on a WCOW-configured 
  BuildKit daemon can read arbitrary host files reachable to the BuildKit daemon
  process.
