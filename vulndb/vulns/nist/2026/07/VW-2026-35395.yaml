title: Plane is an an open-source project management tool. Prior to 1.3.0, the 
  IssueBulkUpdateDateEndpoint allows a project member (ADMIN or MEMBER) to 
  modify the start_date and target_date of ANY issue across the entire Plane 
  instance, regardless of workspace or project membership. The endpoint fetches 
  issues by ID without filtering by workspace or project, enabling 
  cross-boundary data modification. This vulnerability is fixed in 1.3.0.
