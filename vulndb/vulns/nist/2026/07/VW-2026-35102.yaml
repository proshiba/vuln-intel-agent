title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  fix OOB access in DBG_BUF_PRODUCER async event handler\n\nThe ASYNC_EVENT_CMPL_EVENT_ID_DBG_BUF_PRODUCER
  handler in\nbnxt_async_event_process() uses a firmware-supplied 'type' field\ndirectly
  as an index into bp->bs_trace[] without bounds validation.\n\nThe 'type' field is
  a 16-bit value extracted from DMA-mapped completion\nring memory that the NIC writes
  directly to host RAM. A malicious or\ncompromised NIC can supply any value from
  0 to 65535, causing an\nout-of-bounds access into kernel heap memory.\n\nThe bnxt_bs_trace_check_wrap()
  call then dereferences bs_trace->magic_byte\nand writes to bs_trace->last_offset
  and bs_trace->wrapped, leading to\nkernel memory corruption or a crash.\n\nFix by
  adding a bounds check and defining BNXT_TRACE_MAX as\nDBG_LOG_BUFFER_FLUSH_REQ_TYPE_ERR_QPC_TRACE
  + 1 to cover all currently\ndefined firmware trace types (0x0 through 0xc)."
