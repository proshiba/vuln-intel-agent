title: 'The Fluent Forms Pro Add On Pack plugin for WordPress is vulnerable to PHP
  Object Injection in all versions up to, and including, 6.2.6 via deserialization
  of untrusted input. This makes it possible for authenticated attackers, with Subscriber-level
  access and above, to inject a PHP Object. The additional presence of a POP chain
  allows attackers to change user passwords and potentially take over administrator
  accounts. Note: This can only be exploited if user update integration is enabled
  and a user meta field is mapped.'
