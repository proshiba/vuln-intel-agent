title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRevert
  \"smb: client: fix TCP timers deadlock after rmmod\"\n\nThis reverts commit e9f2517a3e18a54a3943c098d2226b245d488801.\n\
  \nCommit e9f2517a3e18 (\"smb: client: fix TCP timers deadlock after\nrmmod\") is
  intended to fix a null-ptr-deref in LOCKDEP, which is\nmentioned as CVE-2024-54680,
  but is actually did not fix anything;\nThe issue can be reproduced on top of it.
  [0]\n\nAlso, it reverted the change by commit ef7134c7fc48 (\"smb: client:\nFix
  use-after-free of network namespace.\") and introduced a real\nissue by reviving
  the kernel TCP socket.\n\nWhen a reconnect happens for a CIFS connection, the socket
  state\ntransitions to FIN_WAIT_1.  Then, inet_csk_clear_xmit_timers_sync()\nin tcp_close()
  stops all timers for the socket.\n\nIf an incoming FIN packet is lost, the socket
  will stay at FIN_WAIT_1\nforever, and such sockets could be leaked up to net.ipv4.tcp_max_orphans.\n\
