title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix buffer validation by including null terminator size in EA length\n\nThe smb2_set_ea
  function, which handles Extended Attributes (EA),\nwas performing buffer validation
  checks that incorrectly omitted the size\nof the null terminating character (+1
  byte) for EA Name.\nThis patch fixes the issue by explicitly adding '+ 1' to EaNameLength
  where\nthe null terminator is expected to be present in the buffer, ensuring\nthe
  validation accurately reflects the total required buffer size."
