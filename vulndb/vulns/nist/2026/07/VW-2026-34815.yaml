title: HAPI FHIR is a complete implementation of the HL7 FHIR standard for 
  healthcare interoperability in Java. Prior to version 6.9.4, the /loadIG HTTP 
  endpoint in the FHIR Validator HTTP service accepts a user-supplied URL via 
  JSON body and makes server-side HTTP requests to it without any hostname, 
  scheme, or domain validation. An unauthenticated attacker with network access 
  to the validator can probe internal network services, cloud metadata 
  endpoints, and map network topology through error-based information leakage. 
  With explore=true (the default for this code path), each request triggers 
  multiple outbound HTTP calls, amplifying reconnaissance capability. This issue
  has been patched in version 6.9.4.
