title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  put dl_stid if fail to queue dl_recall\n\nBefore calling nfsd4_run_cb to queue dl_recall
  to the callback_wq, we\nincrement the reference count of dl_stid.\nWe expect that
  after the corresponding work_struct is processed, the\nreference count of dl_stid
  will be decremented through the callback\nfunction nfsd4_cb_recall_release.\nHowever,
  if the call to nfsd4_run_cb fails, the incremented reference\ncount of dl_stid will
  not be decremented correspondingly, leading to the\nfollowing nfs4_stid leak:\n\
  unreferenced object 0xffff88812067b578 (size 344):\n  comm \"nfsd\", pid 2761, jiffies
  4295044002 (age 5541.241s)\n  hex dump (first 32 bytes):\n    01 00 00 00 6b 6b
  6b 6b b8 02 c0 e2 81 88 ff ff  ....kkkk........\n    00 6b 6b 6b 6b 6b 6b 6b 00
  00 00 00 ad 4e ad de  .kkkkkkk.....N..\n  backtrace:\n    kmem_cache_alloc+0x4b9/0x700\n\
  \    nfsd4_process_open1+0x34/0x300\n    nfsd4_open+0x2d1/0x9d0\n    nfsd4_proc_compound+0x7a2/0xe30\n\
  \    nfsd_"
