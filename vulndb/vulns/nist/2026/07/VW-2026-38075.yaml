title: e107 prior to version 2.3.8 contains a code execution vulnerability in 
  the e_array deserialization handler that allows an attacker with out-of-band 
  database write access to execute arbitrary PHP code by storing a crafted 
  payload in the user_prefs column. The e_array::unserialize() function in 
  e107_handlers/core_functions.php performs only a prefix check for the string 
  'array' before passing the stored value to eval(), causing automatic PHP 
  execution whenever the affected user's preferences are materialized through 
  e_user_pref::load().
