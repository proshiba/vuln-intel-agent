title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/gsc:
  Fix double-free of managed BO in error path\n\nThe error path in xe_gsc_init_post_hwconfig()
  explicitly frees a BO\nallocated with xe_managed_bo_create_pin_map() via\nxe_bo_unpin_map_no_vm().
  Since the managed BO already has a devm\ncleanup action registered, this causes
  a double-free when devm\nunwinds during probe failure.\n\nRemove the explicit free
  and let devm handle it, consistent with\nall other xe_managed_bo_create_pin_map()
  callers.\n\n(cherry picked from commit 71d61e3e299a17139e47f980a4d6f425b2c59bf7)"
