title: Kong Kubernetes Ingress Controller (KIC) allows a user with 
  namespace-scoped Secret creation privileges to cause a cluster-wide ingress 
  configuration denial of service. KIC collects CA-certificate Secrets across 
  all watched namespaces using a label selector alone, without ingress-class or 
  namespace restrictions. The CA-certificate primary key is derived from a 
  user-supplied field in the Secret. Duplicate CA-certificate IDs cause Kong 
  Gateway to reject the entire configuration document and halting all ingress 
  changes cluster-wide.
