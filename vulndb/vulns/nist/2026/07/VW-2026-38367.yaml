title: ComfyUI is a modular diffusion model GUI, api and backend with a 
  graph/nodes interface. Prior to 0.28.0, the /view endpoint served uploaded SVG
  files inline because image/svg+xml and related XML content types were absent 
  from the dangerous-content-type handling, allowing stored cross-site scripting
  in the ComfyUI origin. This issue is fixed in version 0.28.0.
