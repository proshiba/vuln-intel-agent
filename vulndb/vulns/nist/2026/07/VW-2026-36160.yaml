title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix out-of-bounds read in broadcast Gap ACK blocks\n\nA broadcast PROTOCOL/STATE_MSG
  can carry a Gap ACK blocks record in its\ndata area. tipc_get_gap_ack_blks() only
  verifies that the record's len\nfield is self-consistent with its ugack_cnt/bgack_cnt
  counts\n(sz == struct_size(p, gacks, ugack_cnt + bgack_cnt)); it does not check\n\
  that the record actually fits in the message data area, msg_data_sz().\n\nThe unicast
  caller tipc_link_proto_rcv() bounds it (\"if (glen > dlen)\nbreak;\"), but the broadcast
  caller tipc_bcast_sync_rcv() discards the\nreturned size, so tipc_link_advance_transmq()
  copies the record off the\nreceive skb with an attacker-controlled count:\n\n\t\
  this_ga = kmemdup(ga, struct_size(ga, gacks, ga->bgack_cnt),\n\t\t\t  GFP_ATOMIC);\n\
  \nA TIPC neighbour that negotiated TIPC_GAP_ACK_BLOCK triggers it with one\nordinary
  broadcast STATE_MSG (msg_bc_ack_invalid() clear), sized so its\ndata area is short,
  carrying a Gap ACK "
