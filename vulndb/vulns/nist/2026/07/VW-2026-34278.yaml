title: A security flaw has been discovered in Belkin F9K1015 1.00.10. Impacted 
  is the function formSetPassword of the file /goform/formSetPassword. The 
  manipulation of the argument webpage results in stack-based buffer overflow. 
  The attack may be launched remotely. The exploit has been released to the 
  public and may be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
