title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  BPF: Don't override subprog's return value\n\nThe verifier test `calls: div by 0
  in subprog` triggers a panic at the\nld.bu instruction. The ld.bu insn is trying
  to load byte from memory\naddress returned by the subprog. The subprog actually
  set the correct\naddress at the a5 register (dedicated register for BPF return values).\n\
  But at commit 73c359d1d356 (\"LoongArch: BPF: Sign-extend return values\")\nwe also
  sign extended a5 to the a0 register (return value in LoongArch).\nFor function call
  insn, we later propagate the a0 register back to a5\nregister. This is right for
  native calls but wrong for bpf2bpf calls\nwhich expect zero-extended return value
  in a5 register. So only move a0\nto a5 for native calls (i.e. non-BPF_PSEUDO_CALL)."
