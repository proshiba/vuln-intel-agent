title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  Fix use-after-free in tipc_conn_close().\n\nsyzbot reported a null-ptr-deref in
  tipc_conn_close() during netns\ndismantle. [0]\n\ntipc_topsrv_stop() iterates tipc_net(net)->topsrv->conn_idr
  and calls\ntipc_conn_close() for each tipc_conn.\n\nThe problem is that tipc_conn_close()
  is called after releasing the\nIDR lock.\n\nAt the same time, there might be tipc_conn_recv_work()
  running and it\ncould call tipc_conn_close() for the same tipc_conn and release
  its\nlast ->kref.\n\nOnce we release the IDR lock in tipc_topsrv_stop(), there is
  no\nguarantee that the tipc_conn is alive.\n\nLet's hold the ref before releasing
  the lock and put the ref after\ntipc_conn_close() in tipc_topsrv_stop().\n\n[0]:\n\
  BUG: KASAN: use-after-free in tipc_conn_close+0x122/0x140 net/tipc/topsrv.c:165\n\
  Read of size 8 at addr ffff888099305a08 by task kworker/u4:3/435\n\nCPU: 0 PID:
  435 Comm: kworker/u4:3 Not tainted 4.19.204-syzkaller #0\nHardware name: Google
  Googl"
