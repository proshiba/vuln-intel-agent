title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Fix UAF on sva unbind with pending IOPFs\n\nCommit 17fce9d2336d (\"iommu/vt-d: Put
  iopf enablement in domain attach\npath\") disables IOPF on device by removing the
  device from its IOMMU's\nIOPF queue when the last IOPF-capable domain is detached
  from the device.\nUnfortunately, it did this in a wrong place where there are still
  pending\nIOPFs. As a result, a use-after-free error is potentially triggered and\n\
  eventually a kernel panic with a kernel trace similar to the following:\n\n refcount_t:
  underflow; use-after-free.\n WARNING: CPU: 3 PID: 313 at lib/refcount.c:28 refcount_warn_saturate+0xd8/0xe0\n\
  \ Workqueue: iopf_queue/dmar0-iopfq iommu_sva_handle_iopf\n Call Trace:\n   <TASK>\n\
  \   iopf_free_group+0xe/0x20\n   process_one_work+0x197/0x3d0\n   worker_thread+0x23a/0x350\n\
  \   ? rescuer_thread+0x4a0/0x4a0\n   kthread+0xf8/0x230\n   ? finish_task_switch.isra.0+0x81/0x260\n\
  \   ? kthreads_online_cpu+0x110/0x110\n   ? kthreads_online"
