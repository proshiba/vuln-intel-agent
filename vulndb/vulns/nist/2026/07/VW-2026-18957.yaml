title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/riscv:
  Remove overflows on the invalidation path\n\nSince RISC-V supports a sign extended
  page table it should support\na gather->end of ULONG_MAX, but if this happens it
  will infinite loop\nbecause of the overflow.\n\nAlso avoid overflow computing the
  length by moving the +1 to the other\nside of the <"
