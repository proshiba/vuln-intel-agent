title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  udf: fix OOB read in lengthAllocDescs handling\n\nWhen parsing Allocation Extent
  Descriptor, lengthAllocDescs comes from\non-disk data and must be validated against
  the block size. Crafted or\ncorrupted images may set lengthAllocDescs so that the
  total descriptor\nlength (sizeof(allocExtDesc) + lengthAllocDescs) exceeds the buffer,\n\
  leading udf_update_tag() to call crc_itu_t() on out-of-bounds memory and\ntrigger
  a KASAN use-after-free read.\n\nBUG: KASAN: use-after-free in crc_itu_t+0x1d5/0x2b0
  lib/crc-itu-t.c:60\nRead of size 1 at addr ffff888041e7d000 by task syz-executor317/5309\n\
  \nCPU: 0 UID: 0 PID: 5309 Comm: syz-executor317 Not tainted 6.12.0-rc4-syzkaller-00261-g850925a8133c
  #0\nHardware name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS 1.16.3-debian-1.16.3-2~bpo12+1
  04/01/2014\nCall Trace:\n <TASK>\n __dump_stack lib/dump_stack.c:94 [inline]\n dump_stack_lvl+0x241/0x360
  lib/dump_stack.c:120\n print_address_description mm/kas"
