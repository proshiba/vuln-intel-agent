title: "Pivotick contains an uncontrolled-recursion vulnerability when processing
  caller-supplied graph and node data. The affected graph algorithms recursively traversed
  graph edges, while the JSON viewer recursively processed each level of a node’s
  data structure. A specially crafted graph containing an excessively long path, deeply
  nested properties, or circular object references could therefore exhaust the JavaScript
  call stack when Pivotick calculates a layout or displays a node in the inspection
  modal.\n\nSuccessful exploitation may cause an uncaught exception, freeze the affected
  page, or crash the browser tab, resulting in a client-side denial of service. No
  confidentiality or integrity impact has been identified.\n\nThe patch replaces the
  recursive graph traversals with iterative stack-based implementations and limits
  the reachability calculation to 1,000,000 edge traversals. It also limits JSON rendering
  to 64 levels and detects circular references before descending further into an objec"
