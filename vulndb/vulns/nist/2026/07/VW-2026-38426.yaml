title: A flaw was found in 389 Directory Server. An unauthenticated remote 
  attacker can inject LDAP search filters into the CleanAllRUV replication 
  status-check extended operation. Because the handler performs the search 
  against cn=config with elevated replication plugin privileges and returns a 
  boolean match result, the attacker can extract sensitive server configuration 
  metadata, including replication bind DNs and password storage scheme 
  information.
