title: Rouille 0.3.3 through 3.6.2 contains an HTTP request smuggling 
  vulnerability that allows remote attackers to desynchronize HTTP message 
  boundaries by exploiting improper header forwarding in the proxy 
  implementation. The proxy in src/proxy.rs forwards the client's 
  Transfer-Encoding header to upstream backends unchanged while transmitting a 
  body already de-chunked by tiny_http, enabling CL.TE desynchronization attacks
  where attackers control where the backend believes the request body ends.
