title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethtool: phy: avoid NULL deref when PHY driver is unbound\n\nphydev->drv can become
  NULL while the phy_device is still attached to\nits net_device, namely after the
  PHY driver is unbound via sysfs:\n\n\techo <mdio_id> > /sys/bus/mdio_bus/drivers/<phy_drv>/unbind\n\
  \nphy_remove() clears phydev->drv but doesn't call phy_detach(), so the\nphy_device
  stays in the link topology xarray and ethnl_req_get_phydev()\nstill hands it back.
  ETHTOOL_MSG_PHY_GET then oopses on:\n\n\trep_data->drvname = kstrdup(phydev->drv->name,
  GFP_KERNEL);\n\ndrvname is already treated as optional by phy_reply_size(),\nphy_fill_reply()
  and phy_cleanup_data(), so just skip the allocation\nwhen there is no driver bound."
