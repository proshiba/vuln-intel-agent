title: "In the Linux kernel, the following vulnerability has been resolved:\n\n9p/net:
  fix improper handling of bogus negative read/write replies\n\nIn p9_client_write()
  and p9_client_read_once(), if the server\nincorrectly replies with success but a
  negative write/read count then we\nwould consider written (negative) <= rsize (positive)
  because both\nvariables were signed.\n\nMake variables unsigned to avoid this problem.\n\
  \nThe reproducer linked below now fails with the following error instead\nof a null
  pointer deref:\n9pnet: bogus RWRITE count (4294967295 > 3)"
