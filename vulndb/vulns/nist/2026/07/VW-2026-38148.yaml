title: MaxKB is an open-source AI assistant for enterprise. In versions 2.0.0 
  through 2.10.4-lts, UpdateStoreTool.update_tool passes caller-supplied 
  download_url and download_callback_url values to requests.get without 
  equivalent trusted-host and redirect validation, allowing an authenticated 
  workspace user to make the server request internal, loopback, link-local, or 
  cloud metadata URLs. A fix is present on the v2 branch but has not yet been 
  included in a published release.
