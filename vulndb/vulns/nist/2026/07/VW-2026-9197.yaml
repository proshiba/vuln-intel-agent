title: Use of a Password Hash With Insufficient Computational Effort in Mesalvo 
  MEONA (MEONA Server and MEONA Client) for user accounts whose password was 
  last set under a version before MEONA 2024.10. MEONA versions before 2024.10 
  protected stored passwords with SHA-1 (versions from October 2015) or stored 
  them without protection (earlier versions). Since MEONA 2024.10 (June 2024) 
  Argon2 is the default method and every password that is set or changed is 
  stored with Argon2; passwords last set under an earlier version keep the 
  earlier method until they are changed. An administrator could in addition 
  select the storage method per account. A MEONA super administrator can read 
  the stored value of such accounts in the user administration of the MEONA 
  Client or export it through administrative database functions. Only accounts 
  managed locally in MEONA are affected; accounts authenticated through the 
  operating hospital's directory service (Active Directory / Entra ID) have no 
  password stored in MEON
