title: The Fluent Forms – Customizable Contact Forms, Survey, Quiz, & 
  Conversational Form Builder plugin for WordPress is vulnerable to Insecure 
  Direct Object Reference in all versions up to, and including, 6.2.8 via the 
  'transaction' parameter due to missing validation on a user controlled key. 
  This makes it possible for unauthenticated attackers to brute-force valid 
  transaction hashes and view sensitive payment receipt data including customer 
  name, email address, billing address, order items, payment method, and payment
  status belonging to other users. Because submission ID, form ID, and 
  transaction creation time are either observable or guessable by an attacker, 
  the effective brute-force space is bounded to approximately 900 candidates per
  second per (submission, form) pair, making exploitation practical without any 
  prior authentication or account.
