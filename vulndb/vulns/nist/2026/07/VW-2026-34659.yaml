title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblock:
  recompute nr_integrity_segments in blk_insert_cloned_request\n\nblk_insert_cloned_request()
  already recomputes nr_phys_segments\nagainst the bottom queue, because \"the queue
  settings related to\nsegment counting may differ from the original queue.\" The
  exact same\nreasoning applies to integrity segments: a stacked driver's underlying\n\
  queue can have tighter virt_boundary_mask, seg_boundary_mask, or\nmax_segment_size
  than the top queue, in which case\nblk_rq_count_integrity_sg() against the bottom
  queue produces a\ndifferent count than the cached rq->nr_integrity_segments inherited\n\
  from the source request by blk_rq_prep_clone().\n\nWhen the cached count is lower
  than the bottom queue's actual count,\nblk_rq_map_integrity_sg() trips\n\n\tBUG_ON(segments
  > rq->nr_integrity_segments);\n\non dispatch. The same families of stacked setups
  that motivated the\nexisting nr_phys_segments recompute -- dm-multipath fanning
  out to\nnvme-rdma i"
