title: OpenAirInterface v2.2.0 accepts Security Mode Complete without any 
  integrity protection. Configuration has supported integrity NIA1 and NIA2. But
  if an UE sends initial registration request with only security capability IA0,
  OpenAirInterface accepts and proceeds. This downgrade security context can 
  lead to the possibility of replay attack.
