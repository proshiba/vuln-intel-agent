title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  touchwin - reset the packet index on every complete packet\n\ntw_interrupt() accumulates
  each non-zero serial byte into a fixed\nthree-byte buffer with a running index that
  is only reset once a full\npacket has been received *and* the device's two Y bytes
  agree:\n\n\ttw->data[tw->idx++] = data;\n\tif (tw->idx == TW_LENGTH && tw->data[1]
  == tw->data[2]) {\n\t\t...\n\t\ttw->idx = 0;\n\t}\n\nThe reset is gated on tw->data[1]
  == tw->data[2], a value the device\ncontrols.  A malicious, malfunctioning or counterfeit
  Touchwindow\nperipheral can stream non-zero bytes whose 2nd and 3rd bytes differ:
  the\nindex reaches TW_LENGTH without the equality holding, is never reset, and\n\
  keeps growing, so tw->data[tw->idx++] walks off the end of the three-byte\narray
  and the rest of the heap-allocated struct tw, one attacker-chosen\nbyte at a time
  -- an unbounded, device-driven heap out-of-bounds write.\n\nReset the index on every
  completed packet and repo"
