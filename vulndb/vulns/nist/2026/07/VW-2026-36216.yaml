title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: correct drop logic for malformed AMPDU frames\n\nThe previous commit aims
  to fix issue caused by malformed AMPDU frames.\nBut the drop logic fails to deal
  with the first AMPDU packet paired with\ncertain range of sequence number, and leads
  to unexpected packet drop.\nIt is more likely to encounter this failure when there
  are busy traffic\nduring rekey process and could lead to disconnection from the
  AP.\nFix this by adding a initial state judgement and only reset status\nduring
  pairwise rekey."
