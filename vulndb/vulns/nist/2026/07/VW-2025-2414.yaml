title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  Use __sk_dst_get() and dst_dev_rcu() in mptcp_active_enable().\n\nmptcp_active_enable()
  is called from subflow_finish_connect(),\nwhich is icsk->icsk_af_ops->sk_rx_dst_set()
  and it's not always\nunder RCU.\n\nUsing sk_dst_get(sk)->dev could trigger UAF.\n\
  \nLet's use __sk_dst_get() and dst_dev_rcu()."
