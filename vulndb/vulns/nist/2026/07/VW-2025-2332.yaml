title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  Fix use-after-free bugs in otx2_sync_tstamp()\n\nThe original code relies on cancel_delayed_work()
  in otx2_ptp_destroy(),\nwhich does not ensure that the delayed work item synctstamp_work
  has fully\ncompleted if it was already running. This leads to use-after-free scenarios\n\
  where otx2_ptp is deallocated by otx2_ptp_destroy(), while synctstamp_work\nremains
  active and attempts to dereference otx2_ptp in otx2_sync_tstamp().\nFurthermore,
  the synctstamp_work is cyclic, the likelihood of triggering\nthe bug is nonnegligible.\n\
  \nA typical race condition is illustrated below:\n\nCPU 0 (cleanup)           |
  CPU 1 (delayed work callback)\notx2_remove()             |\n  otx2_ptp_destroy()\
  \      | otx2_sync_tstamp()\n    cancel_delayed_work() |\n    kfree(ptp)       \
  \     |\n                          |   ptp = container_of(...); //UAF\n        \
  \                  |   ptp-> //UAF\n\nThis is confirmed by a KASAN report:\n\nBUG:
  KASAN: slab-"
