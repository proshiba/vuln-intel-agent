title: Let's Chat 0.3.0 through 0.4.8 contains an improper authorization 
  vulnerability that allows any authenticated user to archive any room on the 
  server by sending a DELETE request to the rooms handler without ownership 
  verification. Attackers can enumerate room IDs via the rooms listing endpoint 
  and permanently archive private or password-protected rooms they cannot 
  access, with no application-level recovery path requiring direct database 
  intervention to restore.
