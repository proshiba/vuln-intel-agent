title: Flowise before 3.1.0 contains a server-side request forgery vulnerability
  in the Execute Flow node that allows attackers to bypass security validation 
  by providing intranet addresses through the base URL field. Attackers can 
  initiate HTTP requests to internal network addresses, access cloud metadata, 
  and enumerate internal services by exploiting the missing secureFetch 
  verification in httpSecurity.ts.
