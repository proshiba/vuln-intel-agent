title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  iforce - bound the device-reported force-feedback effect index\n\niforce_process_packet()
  handles a status report (packet id 0x02) by\ntaking a force-feedback effect index
  straight from the device wire and\nusing it to address the per-effect state array:\n\
  \n\ti = data[1] & 0x7f;\n\tif (data[1] & 0x80) {\n\t\tif (!test_and_set_bit(FF_CORE_IS_PLAYED,\n\
  \t\t\t\t      iforce->core_effects[i].flags))\n\t\t\t...\n\t} else if (test_and_clear_bit(FF_CORE_IS_PLAYED,\n\
  \t\t\t\t      iforce->core_effects[i].flags)) {\n\t\t...\n\t}\n\nThe index is masked
  only with 0x7f, so it ranges 0..127, but\ncore_effects[] holds only IFORCE_EFFECTS_MAX
  (32) entries.  For an index\nof 32..127 the test_and_set_bit()/test_and_clear_bit()
  is an\nout-of-bounds single-bit read-modify-write past the array.  core_effects[]\n\
  is the second-to-last member of struct iforce, so the write lands in the\ntrailing
  members and beyond the embedding kzalloc()'d iforce_serio /\niforce_usb object.\n\
  \n"
