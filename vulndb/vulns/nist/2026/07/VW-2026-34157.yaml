title: Bold Reports Standalone Report Designer before 14.1.12 contains a missing
  filepath validation vulnerability in its database download feature that allows
  unauthenticated attackers to read arbitrary files from the server filesystem 
  by supplying a crafted request. Attackers can exploit this path traversal 
  weakness to disclose sensitive server files, including authentication 
  credentials, enabling full unauthorized access to the application. The 
  vulnerability is specific to the DataHub module, which was introduced in Bold 
  Reports 6.3. Therefore, versions prior to 6.3 are not affected.
