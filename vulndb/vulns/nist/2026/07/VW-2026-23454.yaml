title: A flaw was found in CRI-O. The fix for a previous vulnerability 
  (CVE-2022-4318) was incorrect, allowing it to be bypassed. An attacker capable
  of setting environment variables on a container can inject a newline character
  into the HOME environment variable. This issue allows the addition of 
  arbitrary lines into /etc/passwd by use of a specially crafted environment 
  variable.
