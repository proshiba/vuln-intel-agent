title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Fix handling of XN[0] when !FEAT_XNX\n\nXN has already been extracted
  from its bitfield position so using\nFIELD_PREP() on the mask that clears XN[0]
  is completely broken, having\nthe effect of unconditionally granting execute permissions...\n\
  \nFix the obvious mistake by manipulating the right bit."
