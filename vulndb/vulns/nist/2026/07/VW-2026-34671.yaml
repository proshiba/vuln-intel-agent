title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrivers/base/memory:
  set mem->altmap after successful device registration\n\nIf __add_memory_block()
  fails at xa_store() (under memory pressure for\nexample), device_unregister() is
  called, which eventually triggers\nmemory_block_release() with mem->altmap still
  set, causing a\nWARN_ON(mem->altmap).  This was triggered by modifying virtio-mem
  driver.\n\nFix this by delaying the assignment of mem->altmap until after\n__add_memory_block()
  has succeeded."
