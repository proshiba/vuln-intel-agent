title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  require source read access for duplicate extents\n\nFSCTL_DUPLICATE_EXTENTS_TO_FILE
  passes the source file directly to\nvfs_clone_file_range() or vfs_copy_file_range()
  without checking the SMB\naccess mask granted to the source handle. A handle opened
  with attribute\naccess can consequently be used to copy file contents into an\n\
  attacker-readable destination.\n\nRequire FILE_READ_DATA on the source handle before
  either VFS operation,\nmatching other ksmbd data-copy paths."
