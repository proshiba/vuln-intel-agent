title: RustFS is a distributed object storage system built in Rust. Prior to 
  alpha.90, RustFS contains a missing authorization check in the multipart copy 
  path (UploadPartCopy). A low-privileged user who cannot read objects from a 
  victim bucket can still exfiltrate victim objects by copying them into an 
  attacker-controlled multipart upload and completing the upload. This breaks 
  tenant isolation in multi-user / multi-tenant deployments. This vulnerability 
  is fixed in alpha.90.
