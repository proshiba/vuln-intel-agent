title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  driver: Check ACPI_COMPANION() against NULL during probe\n\nSince every platform
  driver can be forced to match a device that doesn't\nmatch its list of device IDs
  because of device_match_driver_override(),\nplatform drivers that rely on the existence
  of a device's ACPI companion\nobject should verify its presence.\n\nAccordingly,
  add requisite ACPI_COMPANION() or ACPI_HANDLE() checks\nagainst NULL to 13 platform
  drivers handling core ACPI devices.\n\nAlso change the value returned by the ACPI
  thermal zone driver when\nthe device's ACPI companion is not present to -ENODEV
  for consistency\nwith the other drivers."
