title: The Elementor Website Builder – More Than Just a Page Builder plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via several widget 
  parameters in all versions up to, and including, 3.35.5 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with Contributor-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page.
