title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  target: rdma: fix ndev refcount leak on queue connect\n\nnvmet_rdma_queue_connect()
  calls nvmet_rdma_find_get_device() which\nacquires a reference on the returned ndev
  via kref_get(). On the path\nwhere the host queue backlog is exceeded and the function
  returns\nNVME_SC_CONNECT_CTRL_BUSY, reference of ndev is not released, leaking\n\
  the kref.\n\nFix this by adding a goto to the existing put_device label before the\n\
  early return."
