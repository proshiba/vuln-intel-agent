title: 'PraisonAI is a multi-agent teams system. Prior to 4.5.115, the A2U (Agent-to-User)
  event stream server in PraisonAI exposes all agent activity without authentication.
  The create_a2u_routes() function registers the following endpoints with NO authentication
  checks: /a2u/info, /a2u/subscribe, /a2u/events/{stream_name}, /a2u/events/sub/{id},
  and /a2u/health. This vulnerability is fixed in 4.5.115.'
