title: The Experto Dashboard for WooCommerce plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via the plugin's settings fields (including 
  'Navigation Font Size', 'Navigation Font Weight', 'Heading Font Size', 
  'Heading Font Weight', 'Text Font Size', and 'Text Font Weight') in all 
  versions up to and including 1.0.4. This is due to insufficient input 
  sanitization (no sanitize callback in register_setting()) and missing output 
  escaping (no esc_attr() in the field_callback() printf output) on 
  user-supplied values. This makes it possible for authenticated attackers, with
  Administrator-level access and above, to inject arbitrary web scripts in the 
  plugin settings page that will execute whenever a user accesses the settings 
  page. This only affects multi-site installations and installations where 
  unfiltered_html has been disabled.
