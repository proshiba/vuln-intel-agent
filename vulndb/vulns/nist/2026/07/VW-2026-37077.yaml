title: "Deserialization of Untrusted Data (CWE-502) in the Tribes-based clustering
  component\n\n  in Apache Software Foundation Apache Axis2/Java through 2.0.0 on
  Apache Tomcat\n\n  (only when Tribes clustering is enabled, which is off by default)
  allows an\n\n  unauthenticated remote attacker with network access to the clustering
  port to\n\n  execute arbitrary code via a crafted serialized Java object delivered
  to the cluster\n\n  channel and deserialized in\n\n  org.apache.axis2.clustering.tribes.Axis2ChannelListener#messageReceived.
  Users are\n\n  recommended to upgrade to version 2.0.1, which fixes this issue by
  removing the\n\n  clustering feature entirely."
