title: The Semtech LR11xx LoRa transceivers running early versions of firmware 
  contains an information disclosure vulnerability in its firmware validation 
  functionality. When a host issues a firmware validity check command via the 
  SPI interface, the device decrypts the provided encrypted firmware package 
  block-by-block to validate its integrity. However, the last decrypted firmware
  block remains uncleared in memory after the validation process completes. An 
  attacker with access to the SPI interface can subsequently issue memory read 
  commands to retrieve the decrypted firmware contents from this residual 
  memory, effectively bypassing the firmware encryption protection mechanism. 
  The attack requires physical access to the device's SPI interface.
