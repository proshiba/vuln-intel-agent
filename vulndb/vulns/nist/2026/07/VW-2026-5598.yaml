title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost:
  move vdpa group bound check to vhost_vdpa\n\nRemove duplication by consolidating
  these here.  This reduces the\nposibility of a parent driver missing them.\n\nWhile
  we're at it, fix a bug in vdpa_sim where a valid ASID can be\nassigned to a group
  equal to ngroups, causing an out of bound write."
