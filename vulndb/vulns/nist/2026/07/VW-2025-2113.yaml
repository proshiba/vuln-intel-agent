  to call\nnvme_tcp_configure_admin_queue() twice. The first call prepares for\nDH-CHAP
  negotitation, and the second call is required for secure\nconcatenation. However,
  this change triggered BUG KASAN slab-use-after-\nfree in blk_mq_queue_tag_busy_iter().
