title: The Database for CF7 plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Array Form Field Values in all versions up to, and 
  including, 1.2.6 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  This is exploitable by unauthenticated attackers because Contact Form 7 
  accepts array-structured input for ordinary text fields (e.g., your-name[]) 
  via the public REST API endpoint 
  /wp-json/contact-form-7/v1/contact-forms/{id}/feedback, and the plugin stores 
  submitted data using $wpdb INSERT with serialize() into a custom wp_cf7db 
  table, bypassing WordPress save-time filtering via wp_insert_post/wp_kses.
