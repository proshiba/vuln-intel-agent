title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmc:
  Fix various oops due to inet_sock type confusion.\n\nsyzbot reported weird splats
  [0][1] in cipso_v4_sock_setattr() while\nfreeing inet_sk(sk)->inet_opt.\n\nThe address
  was freed multiple times even though it was read-only memory.\n\ncipso_v4_sock_setattr()
  did nothing wrong, and the root cause was type\nconfusion.\n\nThe cited commit made
  it possible to create smc_sock as an INET socket.\n\nThe issue is that struct smc_sock
  does not have struct inet_sock as the\nfirst member but hijacks AF_INET and AF_INET6
  sk_family, which confuses\nvarious places.\n\nIn this case, inet_sock.inet_opt was
  actually smc_sock.clcsk_data_ready(),\nwhich is an address of a function in the
  text segment.\n\n  $ pahole -C inet_sock vmlinux\n  struct inet_sock {\n  ...\n\
  \          struct ip_options_rcu *    inet_opt;             /*   784     8 */\n\n\
  \  $ pahole -C smc_sock vmlinux\n  struct smc_sock {\n  ...\n          void    \
  \                   (*clcsk_data_ready)("
