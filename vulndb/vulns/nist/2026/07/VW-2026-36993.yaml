title: "The \"quick setup\" view presented to users after they first create an \n\
  event allows to set up the most critical parts of an event in just a few\n clicks.
  This view did not properly check that the user has permission \nto change configuration
  for the given event. An attacker could use a \nwell-timed request to create products,
  quotas, set bank transfer \nconfiguration, or connect a stripe account to an event
  they do not have \naccess to."
