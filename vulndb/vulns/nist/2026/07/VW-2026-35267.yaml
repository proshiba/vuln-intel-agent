title: River Past Video Cleaner 7.6.3 contains a structured exception handler 
  buffer overflow vulnerability that allows local attackers to execute arbitrary
  code by supplying a malicious string in the Lame_enc.dll field. Attackers can 
  craft a payload with 280 bytes of padding, a next structured exception handler
  override, and shellcode to trigger code execution when the application 
  processes the input.
