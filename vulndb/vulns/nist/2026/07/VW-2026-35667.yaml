title: OpenAirInterface Version 2.2.0 has a Buffer Overflow vulnerability in 
  processing UplinkNASTransport containing Authentication Response containing a 
  NAS PDU with oversize response (For example 100 byte). The response is decoded
  by AMF and passed to the AUSF component for verification. AUSF crashes on 
  receiving this oversize response. This can prohibit users from further 
  registration and verification and can cause Denial of Services (DoS).
