title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix a job->pasid access race in gpu recovery\n\nAvoid a possible UAF in GPU recovery
  due to a race between\nthe sched timeout callback and the tdr work queue.\n\nThe
  gpu recovery function calls drm_sched_stop() and\nlater drm_sched_start().  drm_sched_start()
  restarts\nthe tdr queue which will eventually free the job.  If\nthe tdr queue frees
  the job before time out callback\ncompletes, the job will be freed and we'll get
  a UAF\nwhen accessing the pasid.  Cache it early to avoid the\nUAF.\n\nExample KASAN
  trace:\n[  493.058141] BUG: KASAN: slab-use-after-free in amdgpu_device_gpu_recover+0x968/0x990
  [amdgpu]\n[  493.067530] Read of size 4 at addr ffff88b0ce3f794c by task kworker/u128:1/323\n\
  [  493.074892]\n[  493.076485] CPU: 9 UID: 0 PID: 323 Comm: kworker/u128:1 Tainted:
  G            E       6.16.0-1289896.2.zuul.bf4f11df81c1410bbe901c4373305a31 #1 PREEMPT(voluntary)\n\
  [  493.076493] Tainted: [E]=UNSIGNED_MODULE\n[  493.076"
