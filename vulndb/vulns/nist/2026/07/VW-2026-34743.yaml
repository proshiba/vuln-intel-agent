title: OpenClaw before 2026.3.11 contains a sandbox boundary bypass 
  vulnerability in the fs-bridge writeFile commit step that uses an unanchored 
  container path during the final move operation. An attacker can exploit a 
  time-of-check-time-of-use race condition by modifying parent paths inside the 
  sandbox to redirect committed files outside the validated writable path within
  the container mount namespace.
