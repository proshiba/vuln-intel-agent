title: Ekushey Project Manager CRM through version 5.0 contains a missing 
  uniqueness constraint vulnerability that allows authenticated administrators 
  to create duplicate client accounts with identical email and password 
  credentials. Attackers can exploit the lack of email field uniqueness 
  enforcement to create conflicting account states where multiple accounts share
  the same email address with different passwords, resulting in unpredictable 
  authentication behavior and unauthorized account access.
