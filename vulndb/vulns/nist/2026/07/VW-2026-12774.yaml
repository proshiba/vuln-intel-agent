title: "Concrete CMS below 9.5.3 is vulnerable to PHP Object Injection via unserialize()\n\
  calls in the Workflow, Form block, and File/Set components that lack the\nallowed_classes
  restriction. The Form block and File/Set sinks were addressed in\n9.5.2; the Workflow
  component sinks were addressed in 9.5.3. An unauthenticated\nattacker may trigger
  arbitrary PHP object instantiation if a malicious serialized\npayload has been placed
  in the database. Thanks XananasX7 and Sanjorn Keeratirungsan\n(dizconnect) for independently
  reporting the original components, and sh4d0byss for\nreporting the Workflow component
  wasn't fixed in 9.5.2. The Concrete CMS security team gave this\nvulnerability a
  CVSS v.4.0 score of 8.4 with vector CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/\nVC:H/VI:H/VA:H/SC:N/SI:N/SA:N."
