title: "A stored cross-site scripting vulnerability existed in the capture tree visualization
  page. The application embedded the serialized capture tree directly into an inline
  JavaScript block using the Jinja safe filter.\n\nBecause the tree data can contain
  values derived from captured and potentially attacker-controlled web content, a
  specially crafted value could prematurely terminate the surrounding <script> element
  and inject arbitrary HTML or JavaScript. The malicious code would execute in the
  browser of a user viewing the affected capture tree.\n\nSuccessful exploitation
  could allow an attacker to perform actions using the victim’s authenticated session,
  access information available to the victim, or modify application data within the
  permissions of the affected user.\n\nThe patch removes the JSON data from the HTML
  document and retrieves it through a dedicated API endpoint. The client then processes
  the response using response.json(), preventing capture data from being interpreted
  as execut"
