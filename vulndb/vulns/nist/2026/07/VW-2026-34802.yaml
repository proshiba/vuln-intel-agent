title: Parse Server is an open source backend that can be deployed to any 
  infrastructure that can run Node.js. Prior to versions 8.6.69 and 
  9.7.0-alpha.14, an authenticated user can bypass the immutability guard on 
  session fields (expiresAt, createdWith) by sending a null value in a PUT 
  request to the session update endpoint. This allows nullifying the session 
  expiry, making the session valid indefinitely and bypassing configured session
  length policies. This issue has been patched in versions 8.6.69 and 
  9.7.0-alpha.14.
