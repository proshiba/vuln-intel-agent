title: FFmpeg versions 3.4 through 8.1.2 contain an out-of-bounds write 
  vulnerability in the vf_floodfill video filter that allows attackers to 
  corrupt heap memory by supplying a dynamically sized video stream with 
  filtergraph reinitialization disabled via -reinit_filter 0. When 
  config_input() allocates the points traversal stack based on initial frame 
  dimensions and a subsequent larger frame is processed, filter_frame() performs
  flood-fill neighbor pushes beyond the original allocation boundary, resulting 
  in heap corruption and process crash with potential for code execution 
  depending on heap layout and process hardening.
