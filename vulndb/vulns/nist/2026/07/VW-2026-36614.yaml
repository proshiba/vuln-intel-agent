title: A security flaw has been discovered in AstrBotDevs AstrBot up to 4.25.5. 
  Affected by this vulnerability is the function _build_handoff_toolset of the 
  file AstrBot/astrbot/core/astr_agent_tool_exec.py of the component Subagent. 
  The manipulation results in incorrect authorization. The attack may be 
  launched remotely. The exploit has been released to the public and may be used
  for attacks. The patch is identified as 
  d23011262e8e75e1ec41b0f1f0091493a022327e. A patch should be applied to 
  remediate this issue.
