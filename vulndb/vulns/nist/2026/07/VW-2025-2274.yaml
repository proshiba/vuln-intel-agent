title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: reject duplicate device on updates\n\nA chain/flowtable update with duplicated
  devices in the same batch is\npossible. Unfortunately, netdev event path only removes
  the first\ndevice that is found, leaving unregistered the hook of the duplicated\n\
  device.\n\nCheck if a duplicated device exists in the transaction batch, bail out\n\
  with EEXIST in such case.\n\nWARNING is hit when unregistering the hook:\n\n [49042.221275]
  WARNING: CPU: 4 PID: 8425 at net/netfilter/core.c:340 nf_hook_entry_head+0xaa/0x150\n\
  \ [49042.221375] CPU: 4 UID: 0 PID: 8425 Comm: nft Tainted: G S                \
  \  6.16.0+ #170 PREEMPT(full)\n [...]\n [49042.221382] RIP: 0010:nf_hook_entry_head+0xaa/0x150"
