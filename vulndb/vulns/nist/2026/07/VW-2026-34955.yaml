title: A vulnerability was detected in Trendnet TEW-657BRM 1.00.1. Affected is 
  the function ping_test of the file /setup.cgi. Performing a manipulation of 
  the argument c4_IPAddr results in os command injection. Remote exploitation of
  the attack is possible. The exploit is now public and may be used. The vendor 
  confirms, that "[t]he product in question (...) has been discontinued and end 
  of life since June 23, 2011, that is more than 14 years ago. We no longer 
  provide support for this product, so we are not able to confirm the 
  vulnerabilities. We will make an announcement on our website's product support
  page and notify customers who registered their products with us." This 
  vulnerability only affects products that are no longer supported by the 
  maintainer.
