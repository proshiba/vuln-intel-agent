title: A security vulnerability has been detected in awwaiid 
  mcp-server-taskwarrior up to 1.0.1. This impacts the function 
  server.setRequestHandler of the file index.ts. Such manipulation of the 
  argument Identifier leads to command injection. The attack must be carried out
  locally. The exploit has been disclosed publicly and may be used. The name of 
  the patch is 1ee3d282debfa0a99afeb41d22c4b2fd5a3148f2. Applying a patch is 
  advised to resolve this issue. The vendor was contacted early, responded in a 
  very professional manner and quickly released a fixed version of the affected 
  product.
