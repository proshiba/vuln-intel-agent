title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  eic-sprd: use raw_spinlock_t in the irq startup path\n\nsprd_eic_irq_unmask() enables
  the GPIO IRQ and then updates controller\nstate through sprd_eic_update(), which
  takes sprd_eic->lock with\nspin_lock_irqsave().  The callback can be reached from
  irq_startup()\nwhile setting up a requested IRQ.  That path is not sleepable, but
  on\nPREEMPT_RT a regular spinlock_t becomes a sleeping lock.\n\nThis issue was found
  by our static analysis tool and then manually\nreviewed against the current tree.\n\
  \nThe grounded PoC kept the request_threaded_irq() -> __setup_irq() ->\nirq_startup()
  -> sprd_eic_irq_unmask() -> sprd_eic_update() carrier and\nused the original spin_lock_irqsave(&sprd_eic->lock)
  edge.  Lockdep\n\n  BUG: sleeping function called from invalid context\n  hardirqs
  last disabled at ... __setup_irq.constprop.0 ... [vuln_msv]\n  sprd_rt_spin_lock_irqsave+0x1c/0x30
  [vuln_msv]\n  sprd_eic_update.constprop.0+0x48/0x90 [vuln_msv]\n "
