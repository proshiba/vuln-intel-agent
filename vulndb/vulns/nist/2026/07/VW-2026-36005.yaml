title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  page_ext: add count limit to page_ext_iter_next to prevent invalid PFN access\n\n\
  The page_ext iteration API does not validate if the PFN still belongs to a\nvalid
  section while advancing the iterator.  When dynamically adding\nmemory in the hotplug
  path, it can lead to a NULL pointer dereference\nduring page_ext_lookup at the boundary
  of the last valid section when\niterator count equals __pgcount.\n\nThe for_each_page_ext()
  macro calls page_ext_iter_next() as its loop\nincrement.  for_each_page_ext() does
  a \"__page_ext =\npage_ext_iter_next(&__iter)\" at the end.  This causes page_ext_iter_next()\n\
  to increment iter->index past __pgcount and call page_ext_lookup(start_pfn\n+ __pgcount).\
  \  During memory hotplug (online), the PFN at start_pfn +\n__pgcount may belong
  to a section that has not yet been initialized,\ncausing page_ext_lookup() to trigger
  a NULL pointer dereference.\n\n[   14.555124][  T846] Call trace:\n[   14.555125][\
  \  T"
