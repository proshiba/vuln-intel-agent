title: TinyWeb through 0.0.8 contains a memory leak vulnerability that allows 
  unauthenticated attackers to exhaust available memory by sending ordinary 
  well-formed HTTP requests. Each request causes HttpParser::execute() to 
  allocate Url objects, HttpHeaders objects, and HttpHeader instances via raw 
  new expressions that are never freed due to missing destructors and 
  unreachable delete calls, causing worker resident memory to grow monotonically
  by approximately 20 to 28 kB per request until the worker process is killed.
