title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  free pages on error in btrfs_uring_read_extent()\n\nIn this function the 'pages'
  object is never freed in the hopes that it is\npicked up by btrfs_uring_read_finished()
  whenever that executes in the\nfuture. But that's just the happy path. Along the
  way previous\nallocations might have gone wrong, or we might not get -EIOCBQUEUED
  from\nbtrfs_encoded_read_regular_fill_pages(). In all these cases, we go to a\n\
  cleanup section that frees all memory allocated by this function without\nassuming
  any deferred execution, and this also needs to happen for the\n'pages' allocation."
