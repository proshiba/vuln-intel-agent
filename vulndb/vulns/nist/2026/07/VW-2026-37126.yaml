title: The Plugin Organizer plugin for WordPress is vulnerable to SQL Injection 
  via the 'PO_plugin_path' parameter in versions up to, and including, 10.2.4. 
  This is due to insufficient escaping on the user-supplied parameter in the 
  perform_plugin_search() function, where esc_sql() output is passed as the 
  replacement string to preg_replace(), which collapses backslash escapes and 
  defeats the quoting protection; additionally, the AJAX handler lacks both 
  nonce verification and capability checks. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database.
