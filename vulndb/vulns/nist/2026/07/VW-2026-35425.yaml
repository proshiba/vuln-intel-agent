title: "The Gravity Forms plugin for WordPress is vulnerable to Reflected Cross-Site
  Scripting via the `form_ids` parameter in the `gform_get_config` AJAX action in
  all versions up to, and including, 2.9.30. This is due to the `GFCommon::send_json()`
  method outputting JSON-encoded data wrapped in HTML comment delimiters using `echo`
  and `wp_die()`, which serves the response with a `Content-Type: text/html` header
  instead of `application/json`. The `wp_json_encode()` function does not HTML-encode
  angle brackets within JSON string values, allowing injected HTML/script tags in
  `form_ids` array values to be parsed and executed by the browser. The required `config_nonce`
  is generated with `wp_create_nonce('gform_config_ajax')` and is publicly embedded
  on every page that renders a Gravity Forms form, making it identical for all unauthenticated
  visitors within the same 12-hour nonce tick. This makes it possible for unauthenticated
