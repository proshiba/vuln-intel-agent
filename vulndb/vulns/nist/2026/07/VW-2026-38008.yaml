title: A flaw was found in the PCP (Performance Co-Pilot) `pmproxy` service. A 
  remote attacker can exploit a vulnerability in the `pmLogLoadInDom()` function
  by sending a specially crafted request. This bypasses a critical bounds check,
  which can lead to the `pmproxy` service crashing, causing a Denial of Service 
  (DoS). Additionally, this flaw may enable the leakage of sensitive information
  from the system's memory.
