title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  KVM: Fix stack protector issue in send_ipi_data()\n\nFunction kvm_io_bus_read()
  is called in function send_ipi_data(), buffer\nsize of parameter *val should be
  at least 8 bytes. Since some emulation\nfunctions like loongarch_ipi_readl() and
  kvm_eiointc_read() will write\nthe buffer *val with 8 bytes signed extension regardless
  parameter len.\n\nOtherwise there will be buffer overflow issue when CONFIG_STACKPROTECTOR\n\
  is enabled. The bug report is shown as follows:\n\nKernel panic - not syncing: stack-protector:
  Kernel stack is corrupted in: send_ipi_data+0x194/0x1a0 [kvm]\nCPU: 11 UID: 107
  PID: 2692 Comm: CPU 0/KVM Not tainted 6.17.0-rc1+ #102 PREEMPT(full)\nStack : 9000000005901568
