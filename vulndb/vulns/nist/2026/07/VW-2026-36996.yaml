title: "Quick.CMS is vulnerable to Local File Inclusion (LFI) in the admin.php endpoint
  via the p parameter. An authenticated attacker with admin privileges can include
  arbitrary files located within the application's directory structure via a crafted
  HTTP request. Successful exploitation allows disclosure of the server's directory
  structure and absolute file paths (path disclosure).\n\n\n\nThe vendor assessed
  the likelihood of exploitation as very low and determined that a fix is not necessary."
