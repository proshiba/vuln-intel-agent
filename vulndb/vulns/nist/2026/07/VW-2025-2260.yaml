title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ti: j721e-csi2rx: fix list_del corruption\n\nIf ti_csi2rx_start_dma() fails in ti_csi2rx_dma_callback(),
  the buffer is\nmarked done with VB2_BUF_STATE_ERROR but is not removed from the
  DMA queue.\nThis causes the same buffer to be retried in the next iteration, resulting\n\
  in a double list_del() and eventual list corruption.\n\nFix this by removing the
  buffer from the queue before calling\nvb2_buffer_done() on error.\n\nThis resolves
  a crash due to list_del corruption:\n[   37.811243] j721e-csi2rx 30102000.ticsi2rx:
  Failed to queue the next buffer for DMA\n[   37.832187]  slab kmalloc-2k start ffff00000255b000
  pointer offset 1064 size 2048\n[   37.839761] list_del corruption. next->prev should
  be ffff00000255bc28, but was ffff00000255d428. (next=ffff00000255b428)\n[   37.850799]
  ------------[ cut here ]------------\n[   37.855424] kernel BUG at lib/list_debug.c:65!\n\
  [   37.859876] Internal error: Oops - BUG: 00000000f2000800 [#"
