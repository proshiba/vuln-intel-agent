title: FFmpeg through 8.1.2, fixed in commit 5d7112c, contains a heap 
  out-of-bounds write vulnerability in the vf_hqdn3d filter that allows 
  attackers to corrupt heap memory by supplying a crafted video whose frame 
  resolution increases between frames when filtergraph reinitialization is 
  disabled via the -reinit_filter 0 option. Attackers can provide a malicious 
  video input where vf_hqdn3d.config_input() allocates undersized per-plane 
  line-history buffers based on the initial frame width, and subsequent larger 
  frames cause denoise_spatial() to write beyond the allocation boundary, 
  resulting in heap memory corruption.
