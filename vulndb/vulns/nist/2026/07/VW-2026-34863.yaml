title: Admidio is an open-source user management solution. From version 5.0.0 to
  before version 5.0.8, Admidio relies on adm_my_files/.htaccess to deny direct 
  HTTP access to uploaded documents. The Docker image ships with AllowOverride 
  None in the Apache configuration, which causes Apache to silently ignore all 
  .htaccess files. As a result, any file uploaded to the documents module 
  regardless of the role-based permissions configured in the UI, is directly 
  accessible over HTTP without authentication by anyone who knows the file path.
  The file path is disclosed in the upload response JSON. This issue has been 
  patched in version 5.0.8.
