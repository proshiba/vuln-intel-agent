title: Parse Server is an open source backend that can be deployed to any 
  infrastructure that can run Node.js. Prior to versions 8.6.65 and 
  9.7.0-alpha.9, when multiple clients subscribe to the same class via 
  LiveQuery, the event handlers process each subscriber concurrently using 
  shared mutable objects. The sensitive data filter modifies these shared 
  objects in-place, so when one subscriber's filter removes a protected field, 
  subsequent subscribers may receive the already-filtered object. This can cause
  protected fields and authentication data to leak to clients that should not 
  see them, or cause clients that should see the data to receive an incomplete 
  object. Additionally, when an afterEvent Cloud Code trigger is registered, one
  subscriber's trigger modifications can leak to other subscribers through the 
  same shared mutable state. Any Parse Server deployment using LiveQuery with 
