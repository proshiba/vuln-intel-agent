title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ecc - Fix carry overflow in vli multiplication\n\nThe carry flag calculation fails
  when r01.m_high is saturated\n(0xFFFFFFFFFFFFFFFF) and addition of lower bits overflows.\n\
  \nThe condition (r01.m_high < product.m_high) doesn't handle the case\nwhere r01.m_high
  == product.m_high and an additional carry exists\nfrom lower-bit overflow.\n\nWhen
  commit 3c4b23901a0c (\"crypto: ecdh - Add ECDH software support\")\nintroduced crypto/ecc.c,
  it split the muladd() function in the\nmicro-ecc library into separate mul_64_64()
  and add_128_128() helpers.\nIt seems the check got lost in translation.\n\nAdd proper
  handling for this boundary by accounting for the carry\nfrom the lower addition."
