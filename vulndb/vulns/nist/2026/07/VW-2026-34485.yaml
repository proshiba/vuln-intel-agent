title: A vulnerability was identified in localstack serverless-localstack up to 
  1.4.0. The affected element is an unknown function of the file src/index.js of
  the component Configuration Handler. The manipulation of the argument 
  custom.localstack.docker.compose_file leads to os command injection. An attack
  has to be approached locally. The exploit is publicly available and might be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
