  Intel: avs: Disable periods-elapsed work when closing PCM\n\navs_dai_fe_shutdown()
  handles the shutdown procedure for HOST HDAudio\nstream while period-elapsed work
  services its IRQs. As the former\nfrees the DAI's private context, these two operations
  shall be\nsynchronized to avoid slab-use-after-free or worse errors."
