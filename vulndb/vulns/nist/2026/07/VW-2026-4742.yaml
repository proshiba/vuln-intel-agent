title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  validate ND option lengths in vxlan_na_create\n\nvxlan_na_create() walks ND options
  according to option-provided\nlengths. A malformed option can make the parser advance
  beyond the\ncomputed option span or use a too-short source LLADDR option payload.\n\
  \nValidate option lengths against the remaining NS option area before\nadvancing,
  and only read source LLADDR when the option is large enough\nfor an Ethernet address."
