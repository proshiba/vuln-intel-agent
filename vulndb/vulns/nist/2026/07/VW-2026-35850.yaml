title: Unisys WebPerfect Image Suite versions 3.0.3960.22810 and 3.0.3960.22604 
  expose an unauthenticated WCF SOAP endpoint on TCP port 1208 that accepts 
  unsanitized file paths in the ReadLicense action's LFName parameter, allowing 
  remote attackers to trigger SMB connections and leak NTLMv2 machine-account 
  hashes. Attackers can submit crafted SOAP requests with UNC paths to force the
  server to initiate outbound SMB connections, exposing authentication 
  credentials that may be relayed for privilege escalation or lateral movement 
  within the network.
