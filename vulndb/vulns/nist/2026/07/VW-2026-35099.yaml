title: immich is a high performance self-hosted photo and video management 
  solution. Prior to version 2.6.0, the Immich application is vulnerable to 
  credential disclosure when a user authenticates to a shared album. During the 
  authentication process, the application transmits the album password within 
  the URL query parameters in a GET request to /api/shared-links/me. This 
  exposes the password in browser history, proxy and server logs, and referrer 
  headers, allowing unintended disclosure of authentication credentials. The 
  impact of this vulnerability is the potential compromise of shared album 
  access and unauthorized exposure of sensitive user data. This issue has been 
  patched in version 2.6.0.
