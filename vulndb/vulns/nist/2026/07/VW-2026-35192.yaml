title: The Listeo Core plugin for WordPress is vulnerable to unauthenticated 
  arbitrary media upload in all versions up to, and including, 2.0.27 via the 
  "listeo_core_handle_dropped_media" function. This is due to missing 
  authorization and capability checks on the AJAX endpoint handling file 
  uploads. This makes it possible for unauthenticated attackers to upload 
  arbitrary media to the site's media library, without achieving direct code 
  execution.
