title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  avoid calling post_write_mst_fixup() for invalid index_block\n\nntfs_icx_ib_sync_write()
  calls post_write_mst_fixup() when ntfs_ib_write()\nreturns an error, intending to
  restore the buffer after a failed write.\n\nHowever, ntfs_ib_write() returns an
  error immediately if\npre_write_mst_fixup() validation fails. The caller,\nntfs_icx_ib_sync_write(),
  interprets any error as a write failure\nrequiring rollback. It does not differentiate
  between I/O errors and\nvalidation failures, and calls post_write_mst_fixup() anyway.\n\
  \nSince post_write_mst_fixup() assumes that the index_block contents is\ncorrect,
  it doesn't perform the boundary checks, which results in\nout-of-bounds memory access.\n\
  \nAn attacker can craft a malicious NTFS image with:\n  - large index_block.usa_ofs
  offset, pointing outside the ntfs_record\n  - index_block.usa_count = 0, causing
  integer underflow\n  - or index_block.usa_count larger than actual number of secto"
