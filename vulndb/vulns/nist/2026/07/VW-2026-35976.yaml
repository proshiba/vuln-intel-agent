title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  re-lock request before returning from fuse_ref_folio()\n\nfuse_ref_folio() unlocks
  the request but does not re-lock it before\nreturning. fuse_chan_abort() can end
  the request and the async end\ncallback (eg fuse_writepage_free()) can free the
  args while the\nsubsequent copy chain logic after fuse_ref_folio() accesses them,\n\
  leading to use-after-free issues.\n\nFix this by locking the request in fuse_ref_folio()
  before returning."
