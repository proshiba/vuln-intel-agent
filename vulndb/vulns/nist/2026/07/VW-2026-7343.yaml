title: Attacker can upload a malicious Sieve script over ManageSieve service (or
  locally) to bypass configured CPU time limits for Sieve up to 130 times of the
  configured limit. Attacker can use this to degrade server performance and 
  bypass configured CPU time limits for Sieve scripts. Install fixed version, or
  alternatively prevent direct access to Sieve scripts via ManageSieve or local 
  access. No publicly available exploits are known.
