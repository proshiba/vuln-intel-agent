title: MCP Ruby SDK is the official Ruby SDK for Model Context Protocol servers 
  and clients. Prior to 0.23.0, MCP::Server::Transports::StreamableHTTPTransport
  in the mcp gem reads and parses an entire JSON-RPC POST body without a size 
  limit, allowing an unauthenticated remote attacker to exhaust process memory. 
  This issue is fixed in version 0.23.0.
