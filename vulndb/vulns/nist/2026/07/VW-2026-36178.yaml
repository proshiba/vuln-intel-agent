title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  fix UAF in binder_free_transaction()\n\nIn binder_free_transaction(), the t->to_proc
  is read under the t->lock.\nHowever, once the t->lock is dropped, the to_proc can
  die in parallel.\nThis leads to a use-after-free error when we attempt to acquire
  its\ninner lock right afterwards:\n\n  ==================================================================\n\
  \  BUG: KASAN: slab-use-after-free in _raw_spin_lock+0xe4/0x1a0\n  Write of size
  4 at addr ffff00001125da70 by task B/672\n\n  CPU: 20 UID: 0 PID: 672 Comm: B Not
  tainted 7.1.0-rc6-00284-g8e65320d91cd #4 PREEMPT\n  Hardware name: linux,dummy-virt
  (DT)\n  Call trace:\n   _raw_spin_lock+0xe4/0x1a0\n   binder_free_transaction+0x8c/0x320\n\
  \   binder_send_failed_reply+0x21c/0x2f8\n   binder_thread_release+0x488/0x7e0\n\
  \   binder_ioctl+0x12c0/0x29a0\n  [...]\n\n  Allocated by task 675:\n   __kmalloc_cache_noprof+0x174/0x444\n\
  \   binder_open+0x118/0xb70\n   do_dentry_open+0x374/0x1040\n   vfs_ope"
