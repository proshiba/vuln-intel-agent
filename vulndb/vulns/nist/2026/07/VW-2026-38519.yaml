title: pgAdmin 4's Import/Export Data tool builds a psql \copy (...) command 
  line by interpolating a user-supplied SQL query into a Jinja template and 
  passing the rendered line to psql via --command. To stop an attacker from 
  breaking out of the (...) wrapper, create_import_export_job() (route POST 
  /import_export/job/<sid>, gated only by the ordinary, commonly-granted 
  tools_import_export_data permission) validated the query with a hand-written 
  parenthesis-balance checker, _is_query_parens_balanced(). That checker always 
  treated a backslash before a single quote (\') as escaping the quote, i.e. as 
  if standard_conforming_strings were off. PostgreSQL has defaulted 
  standard_conforming_strings to on since 9.1 (2010), the default on every 
  PostgreSQL version pgAdmin 4 currently supports (13-18); under that default 
  psql's own \copy tokenizer treats \ as an ordinary character, so a single 
  quote immediately after it closes the string literal. A query such as SELECT 
  'a\') TO PROGRAM 'echo pwned' x' was t
