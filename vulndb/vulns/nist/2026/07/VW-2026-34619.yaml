title: Datasets through 5.0.0, fixed in commit f989ef9, contains a path 
  traversal vulnerability in folder-based dataset builders where the file_name 
  metadata field is not properly validated before being joined to the dataset 
  directory. Attackers can supply crafted file_name values with directory 
  traversal sequences to read arbitrary local files, which are then embedded 
  into output when save_to_disk or push_to_hub is called.
