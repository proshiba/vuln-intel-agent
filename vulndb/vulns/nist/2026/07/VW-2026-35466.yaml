title: The Awesome Support – WordPress HelpDesk & Support Plugin plugin for 
  WordPress is vulnerable to Insecure Direct Object Reference in versions up to,
  and including, 6.3.7. This is due to the wpas_get_ticket_replies_ajax() 
  function failing to verify whether the authenticated user has permission to 
  view the specific ticket being requested. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to access 
  sensitive information from all support tickets in the system by manipulating 
  the ticket_id parameter.
