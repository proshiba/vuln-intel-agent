title: SymCrypt is the core cryptographic function library currently used by 
  Windows. From 103.5.0 to before 103.11.0, The SymCryptXmssSign function passes
  a 64-bit leaf count value to a helper function that accepts a 32-bit 
  parameter. For XMSS^MT parameter sets with total tree height >= 32 (which 
  includes standard predefined parameters), this causes silent truncation to 
  zero, resulting in a drastically undersized scratch buffer allocation followed
  by a heap buffer overflow during signature computation. Exploiting this issue 
  would require an application using SymCrypt to perform an XMSS^MT signature 
  using an attacker-controlled parameter set. It is uncommon for applications to
  allow the use of attacker-controlled parameter sets for signing, since signing
  is a private key operation, and private keys must be trusted by definition. 
