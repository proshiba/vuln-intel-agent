title: lakeFS through 1.83.0, fixed in commit 71a45ee, contains an 
  authentication bypass vulnerability in the /setup_comm_prefs endpoint that 
  allows unauthenticated attackers to overwrite operator metadata including 
  email, name, and company after setup completion. Attackers can POST to this 
  endpoint to modify security update preferences, disable security 
  communications, and trigger falsified telemetry events using the legitimate 
  installation ID.
