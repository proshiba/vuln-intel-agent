title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/ism:
  fix concurrency management in ism_cmd()\n\nThe s390x ISM device data sheet clearly
  states that only one\nrequest-response sequence is allowable per ISM function at
  any point in\ntime.  Unfortunately as of today the s390/ism driver in Linux does
  not\nhonor that requirement. This patch aims to rectify that.\n\nThis problem was
  discovered based on Aliaksei's bug report which states\nthat for certain workloads
  the ISM functions end up entering error state\n(with PEC 2 as seen from the logs)
  after a while and as a consequence\nconnections handled by the respective function
  break, and for future\nconnection requests the ISM device is not considered -- given
  it is in a\ndysfunctional state. During further debugging PEC 3A was observed as\n\
  well.\n\nA kernel message like\n[ 1211.244319] zpci: 061a:00:00.0: Event 0x2 reports
  an error for PCI function 0x61a\nis a reliable indicator of the stated function
  entering error state\nwith PEC 2"
