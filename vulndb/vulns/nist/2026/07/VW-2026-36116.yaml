title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  fix UAF in bt_accept_dequeue()\n\nbt_accept_get() takes a temporary reference before
  dropping the accept\nqueue lock. bt_accept_dequeue() currently drops that reference
  before\nbt_accept_unlink(), leaving only the queue reference.\n\nbt_accept_unlink()
  drops the queue reference. The subsequent\nsock_hold() therefore accesses freed
  memory if it was the final\nreference, as observed by KASAN during listening L2CAP
  socket cleanup.\n\nRetain the temporary queue-walk reference through unlink and
  hand it to\nthe caller on success. Drop it explicitly on the closed and\nnot-yet-connected
  paths."
