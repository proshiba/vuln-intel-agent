title: 'https://www.sourcecodester.com Advocate office management system 1.0 is affected
  by: SQL Injection. The impact is: execute arbitrary code (remote). The component
  is: control/activate_case.php,?id=1. The attack vector is: A SQL Injection vulnerability
  exists in the activate_case.php in parameter id endpoint of Advocate office management
  system. Unsanitized user input in the specified parameter is interpolated directly
  into an SQL query, allowing attackers to infer or extract data and, in some cases,
  execute stacked/time-based payloads. ¶¶ Affected Component & Parameter Affected
  Endpoint URL: http://localhost/advocate/kortex_lite/control/activate_case.php?id=1
  HTTP Method: GET Vulnerable File: activate_case.php Parameter: id Vector Location:
  GET Injection Techniques (as identified by sqlmap) Type: error-based Title: MySQL
  >= 5.1 AND error-based - WHERE, HAVING, ORDER BY or GROUP BY clause (EXTRACTVALUE)
  Payload: id=1 AND EXTRACTVALUE(6268,CONCAT(0x5c,0x71766b6a71,(SELECT (ELT(6268=6268,1'
