title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  libwx: properly reset Rx ring descriptor\n\nWhen device reset is triggered by feature
  changes such as toggling Rx\nVLAN offload, wx->do_reset() is called to reinitialize
  Rx rings. The\nhardware descriptor ring may retain stale values from previous sessions.\n\
  And only set the length to 0 in rx_desc[0] would result in building\nmalformed SKBs.
  Fix it to ensure a clean slate after device reset.\n\n[  549.186435] [     C16]
