title: "In Eclipse BaSyx Go Components versions up to and including 1.0.0, ABAC-enabled
  deployments are vulnerable to an authorization bypass caused by inconsistent trailing-slash
  handling between the ABAC middleware and the HTTP router.\n\n\n\nThe shared router
  configuration used Chi's `middleware.StripSlashes`, so a request such as `GET /shells/`
  was dispatched to the registered `GET /shells` route. However, the ABAC middleware
  evaluated the original request path including the trailing slash. If ABAC route
  lookup did not find a matching slash-suffixed route, the request was passed onward
  and the router then stripped the slash and executed the protected handler without
  the intended ABAC authorization decision and without the expected ABAC query filters.\n\
