title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  do file ownership checks with the proper mount idmap\n\nEver since idmapped mounts
  were introduced, inode ownership checks (for\nside-channel protection) in mincore()
  and madvise(MADV_PAGEOUT) were done\nagainst the nop_mnt_idmap, which completely
  ignores the file's mount's\nidmap.  This results in odd edgecases like:\n\n1) mount/bind-mount
  with an idmap userA:userB:1\n2) userB runs an owner_or_capable() check on file that
  is owned by userA\non-disk/in-memory, but owned by userB after idmap translation\n\
  3) owner_or_capable() mysteriously fails as the correct idmap wasn't supplied\n\n\
  In the case of mincore/madvise MADV_PAGEOUT, this is usually benign,\nbecause file_permission(file,
  MAY_WRITE) will probably succeed, as it uses\nthe proper idmap internally, but it
  does not need to be the case on e.g a\n0444 file where even the owner itself doesn't
  have permissions to write to\nit.\n\nSince this is clearly not trivial to get right,
