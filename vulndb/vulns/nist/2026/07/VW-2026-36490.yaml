title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  bound NTFS_DE view.data_off in UpdateRecordData{Root,Allocation}\n\nIn do_action()'s
  UpdateRecordDataRoot (fslog.c:3489) and\nUpdateRecordDataAllocation (fslog.c:3697)
  cases, the memmove\ndestination is `Add2Ptr(e, le16_to_cpu(e->view.data_off))`,\n\
  where e->view.data_off comes from an on-disk NTFS_DE inside\nan INDEX_ROOT or INDEX_BUFFER.\
  \  Neither case validates\nview.data_off + dlen against e->size; the existing\n\
  check_if_index_root / check_if_alloc_index helpers walk the\nentry chain and validate
  the entry's offset, but not its\ninternal view fields.\n\nThe neighbouring read
  sites (e.g., fs/ntfs3/index.c when\niterating view entries) check view.data_off
  + view.data_size\n<= e->size.  Apply the same bound at the two memmove sites.\n\n\
