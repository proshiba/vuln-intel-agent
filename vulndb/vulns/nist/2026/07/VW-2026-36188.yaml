title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: avoid kobject path lookup in DualSense match\n\nThe DualSense jack-detection
  input handler verifies that a matching input\ndevice belongs to the same physical
  controller by building kobject path\nstrings for both the input device and the USB
  audio device, then comparing\nthe path prefix.\n\nThis was observed when a weak
  physical connection caused the controller\nto rapidly disconnect and reconnect.
  During that repeated hotplug,\nsnd_dualsense_ih_match() can run while the controller's
  USB device is\nbeing disconnected. kobject_get_path() walks ancestor kobjects and\n\
  dereferences their names; if the USB device kobject name is no longer\nvalid, this
  can fault in strlen():\n\n  RIP: 0010:strlen+0x10/0x30\n  Call Trace:\n   kobject_get_path+0x34/0x150\n\
  \   snd_dualsense_ih_match+0x49/0xd0 [snd_usb_audio]\n   input_register_device+0x566/0x6a0\n\
  \   ps_probe+0xb89/0x1590 [hid_playstation]\n\nThe same ownership check can be done
  wit"
