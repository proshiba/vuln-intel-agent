title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  fix UAF in binder_thread_release()\n\nWhen a thread exits, binder_thread_release()
  walks its transaction stack\nto clear the t->from and t->to_proc that correspond
  with the exiting\nthread. However, a process dying in parallel might attempt to
  kfree some\nof these transactions. And if one of them has no associated t->to_proc,\n\
  the t->to_proc->inner_lock will not be acquired.\n\nThis means that transaction
  accesses in binder_thread_release() after\nt->to_proc has been cleared might race
  with binder_free_transaction()\nand cause a use-after-free error as reported by
  KASAN:\n\n  ==================================================================\n\
  \  BUG: KASAN: slab-use-after-free in binder_thread_release+0x5d0/0x798\n  Write
