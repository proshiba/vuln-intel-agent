title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  caiaq: fix out-of-bounds read in the Traktor Kontrol S4 input parser\n\nsnd_usb_caiaq_tks4_dispatch()
  decodes the Traktor Kontrol S4 input\nstream in fixed 16-byte (TKS4_MSGBLOCK_SIZE)
  message blocks. On every\niteration it advances buf and subtracts the block size
  while looping on\n\"while (len)\".\n\nlen is urb->actual_length. That value is supplied
  by the device and is\nnot guaranteed to be a multiple of 16. When a final short
  block leaves\nlen between 1 and 15, the loop runs once more, reads up to buf[15],
  and\nthen does \"len -= TKS4_MSGBLOCK_SIZE\". As len is unsigned this underflows\n\
  to a huge value. The loop then keeps iterating and walking buf far past\nthe end
  of the 512-byte ep4_in_buf, reading out of bounds until a bogus\nblock id happens
  to be hit.\n\nIterate only while a full message block is available. This stops the\n\
  unsigned underflow and silently drops any trailing partial block, which\ncarries
  no complete control "
