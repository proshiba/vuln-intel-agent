title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio-net:
  fix received length check in big packets\n\nSince commit 4959aebba8c0 (\"virtio-net:
  use mtu size as buffer length\nfor big packets\"), when guest gso is off, the allocated
  size for big\npackets is not MAX_SKB_FRAGS * PAGE_SIZE anymore but depends on\n\
  negotiated MTU. The number of allocated frags for big packets is stored\nin vi->big_packets_num_skbfrags.\n\
  \nBecause the host announced buffer length can be malicious (e.g. the host\nvhost_net
  driver's get_rx_bufs is modified to announce incorrect\nlength), we need a check
  in virtio_net receive path. Currently, the\ncheck is not adapted to the new change
  which can lead to NULL page\npointer dereference in the below while loop when receiving
  length that\nis larger than the allocated one.\n\nThis commit fixes the received
  length check corresponding to the new\nchange."
