title: MeshCentral 1.1.21 contains a cross-site WebSocket hijacking protection 
  bypass vulnerability that allows unauthenticated remote attackers to hijack 
  authenticated administrator sessions by exploiting an unconditional early 
  return in the CheckWebServerOriginName() function within webserver.js when 
  self-signed certificates are in use. Attackers can open cross-origin WebSocket
  connections to any of the twelve WebSocket endpoints, send crafted action 
  commands to exfiltrate the server sessionKey used to sign session cookies, 
  forge session tokens as arbitrary users, and gain full remote control of all 
  managed devices governed by the MeshCentral instance.
