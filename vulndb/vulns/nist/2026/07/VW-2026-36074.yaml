title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  multitouch: fix out-of-bounds bit access on mt_io_flags\n\nmt_io_flags is a single
  unsigned long, but mt_process_slot(),\nmt_release_pending_palms() and mt_release_contacts()
  use it as a\nper-slot bitmap indexed by the slot number. That slot number is only\n\
  bounded by td->maxcontacts, which is taken from the device's\nContactCountMaximum
  feature report and can be up to 255, not by\nBITS_PER_LONG.\n\nAs a result, a multitouch
  device that advertises a large contact count\nmakes set_bit()/clear_bit() operate
  past the mt_io_flags word and\ncorrupt the adjacent members of struct mt_device.
