title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  free iso schedules on failed submit\n\nEHCI and FOTG210 isochronous submits build
  an ehci_iso_sched before\nlinking the URB to the endpoint queue, and keep the staged
  schedule in\nurb->hcpriv until iso_stream_schedule() and the link helpers consume
  it.\nIf the controller is no longer accessible, or usb_hcd_link_urb_to_ep()\nfails,
  submit jumps to done_not_linked before that handoff happens and\nleaks the staged
  schedule still attached to urb->hcpriv.\n\nFree the staged schedule from done_not_linked
  when submit fails before\nthe URB is linked and clear urb->hcpriv after the free.\n\
  \nThe bug was first flagged by an experimental analysis tool we are\ndeveloping
  for kernel memory-management bugs while analyzing\nv6.13-rc1. The tool is still
  under development and is not yet publicly\navailable. Manual inspection confirms
  that the bug is still\npresent in v7.1.1.\n\nAn x86_64 allyesconfig build showed
