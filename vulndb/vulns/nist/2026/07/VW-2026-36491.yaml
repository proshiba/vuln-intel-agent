title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  validate lcns_follow in log_replay conversion\n\nlog_replay() converts DIR_PAGE_ENTRY_32
  records into DIR_PAGE_ENTRY\nrecords when replaying version 0 restart tables.\n\n\
  During this conversion, the memmove() length is derived directly from\nthe on-disk
  lcns_follow field:\n\n\tmemmove(&dp->vcn, &dp0->vcn_low,\n\t\t2 * sizeof(u64) +\n\
  \t\t\t\tle32_to_cpu(dp->lcns_follow) * sizeof(u64));\n\ncheck_rstbl() validates
  restart table structure, but does not constrain\nper-entry lcns_follow values relative
  to the entry size. A malformed\nfilesystem image can provide an oversized lcns_follow
  value, causing\nthe conversion memmove() to access memory beyond the bounds of the\n\
  allocated restart table buffer.\n\nThe same field is later used to bound iteration
  over page_lcns[],\nso validating lcns_follow during conversion also prevents downstream\n\
