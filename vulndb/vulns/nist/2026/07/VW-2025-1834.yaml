title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  correct handling of extreme memory squeeze\n\nTesting with iperf3 using the \"pasta\"\
  \ protocol splicer has revealed\na problem in the way tcp handles window advertising
  in extreme memory\nsqueeze situations.\n\nUnder memory pressure, a socket endpoint
  may temporarily advertise\na zero-sized window, but this is not stored as part of
  the socket data.\nThe reasoning behind this is that it is considered a temporary
  setting\nwhich shouldn't influence any further calculations.\n\nHowever, if we happen
  to stall at an unfortunate value of the current\nwindow size, the algorithm selecting
  a new value will consistently fail\nto advertise a non-zero window once we have
  freed up enough memory.\nThis means that this side's notion of the current window
  size is\ndifferent from the one last advertised to the peer, causing the latter\n\
