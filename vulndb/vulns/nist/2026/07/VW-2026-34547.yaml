title: "Arbitrary Class Instantiation via XML Feature Generator Descriptor and Format
  Name in Apache OpenNLP\n\nVersions Affected: \n\n- before 2.5.10\n- before 3.0.0-M5\n\
  \nDescription: \n\nThree code paths in Apache OpenNLP load a class by its fully-qualified
  name via Class.forName() and invoke its no-arg constructor without any prior validation
  of the class name or its type. \n\nThe affected paths are: \n\n(1) GeneratorFactory,
  which reads the class attribute of generator elements in an XML feature generator
  descriptor; such descriptors are embedded as artifacts in model archives (e.g. TokenNameFinder
  and POSTagger models) and are parsed during model loading, so an attacker who can
  supply a crafted model archive controls the class name directly. \n\n(2) StreamFactoryRegistry.getFactory(Class,
