title: "In the Linux kernel, the following vulnerability has been resolved:\n\n6lowpan:
  fix NHC entry use-after-free on error path\n\nlowpan_nhc_do_uncompression() looks
  up an NHC descriptor while holding\nlowpan_nhc_lock.  If the descriptor has no uncompress
  callback, the error\npath drops the lock before printing nhc->name.\n\nlowpan_nhc_del()
  removes descriptors under the same lock and then relies\non synchronize_net() before
  the owning module can be unloaded.  That only\nwaits for net RX RCU readers.  lowpan_header_decompress()
  is also exported\nand can be reached from callers that are not necessarily covered
  by the net\ncore RX critical section, for example the Bluetooth 6LoWPAN L2CAP receive\n\
  path.\n\nThis leaves a race where one task drops lowpan_nhc_lock in the error path,\n\
  another task unregisters and frees the matching descriptor after\nsynchronize_net()
  returns, and the first task then dereferences nhc->name\nfor the warning.\n\nWith
  the post-unlock window widened, KASAN reports:\n\n  BUG: KASAN: slab-us"
