title: Rouille 0.4.0 through 3.6.2 contains an HTTP response splitting 
  vulnerability that allows remote attackers to inject arbitrary response 
  headers by embedding carriage return (0x0D) or line feed (0x0A) bytes into 
  attacker-controlled input. Attackers can exploit percent-decoded query 
  parameters reflected into response headers or inject bare LF characters into 
  Cookie header values that are interpolated directly into Set-Cookie response 
  headers, enabling cache poisoning, session fixation, and security header 
  override attacks such as bypassing CSP or CORS policies.
