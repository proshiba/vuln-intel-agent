title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndevice
  property: set fwnode->secondary to NULL in fwnode_init()\n\nIf a firmware node is
  allocated on the stack (for instance: temporary\nsoftware node whose life-time we
  control) or on the heap - but using a\nnon-zeroing allocation function - and initialized
  using fwnode_init(),\nits secondary pointer will contain uninitalized memory which
  likely will\nbe neither NULL nor IS_ERR() and so may end up being dereferenced (for\n\
  example: in dev_to_swnode()). Set fwnode->secondary to NULL on\ninitialization."
