title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Avoid dereferencing NULL VNCR pseudo-TLB\n\nVNCR TLB invalidation occurs
  from MMU notifiers or TLBI instructions,\nand either can race against a vcpu not
  being onlined yet (no pseudo-TLB\nallocated). Similarly, the TLB might be invalid,
  and the invalidation\nshould be skipped in this case.\n\nBoth kvm_invalidate_vncr_ipa()
  and kvm_invalidate_vncr_va() are\nexpected to perform the same checks, except that
  the latter doesn't\ncheck for the allocation and blindly dereferences the pointer.\n\
  \nSolve this by introducing a new iterator built on top of the usual\nkvm_for_each_vcpu()
  that checks for both of the above conditions,\nand convert the two users to it."
