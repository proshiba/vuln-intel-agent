title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsch_hfsc:
  make hfsc_qlen_notify() idempotent\n\nhfsc_qlen_notify() is not idempotent either
  and not friendly\nto its callers, like fq_codel_dequeue(). Let's make it idempotent\n\
  to ease qdisc_tree_reduce_backlog() callers' life:\n\n1. update_vf() decreases cl->cl_nactive,
  so we can check whether it is\nnon-zero before calling it.\n\n2. eltree_remove()
  always removes RB node cl->el_node, but we can use\n   RB_EMPTY_NODE() + RB_CLEAR_NODE()
  to make it safe."
