title: OpenProject is open-source, web-based project management software. Prior 
  to 17.6.0, GET /api/v3/custom_options/:id resolved CustomOption records by 
  global numeric id and allowed UserCustomField and GroupCustomField options 
  without checking visible(current_user), so authenticated non-admin users could
  enumerate sequential custom option ids and read labels belonging to admin_only
  user or group custom fields. This issue is fixed in 17.6.0.
