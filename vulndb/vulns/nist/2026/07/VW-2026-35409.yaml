title: "@delmaredigital/payload-puck is a PayloadCMS plugin for integrating Puck visual
  page builder. Prior to 0.6.23, all /api/puck/* CRUD endpoint handlers registered
  by createPuckPlugin() called Payload's local API with the default overrideAccess:
  true, bypassing all collection-level access control. The access option passed to
  createPuckPlugin() and any access rules defined on Puck-registered collections were
  silently ignored on these endpoints. This vulnerability is fixed in 0.6.23."
