title: LTI JupyterHub Authenticator is a JupyterHub authenticator for LTI. Prior
  to version 1.6.3, the LTI 1.1 validator stores OAuth nonces in a class-level 
  dictionary that grows without bounds. Nonces are added before signature 
  validation, so an attacker with knowledge of a valid consumer key can send 
  repeated requests with unique nonces to gradually exhaust server memory, 
  causing a denial of service. This issue has been patched in version 1.6.3.
