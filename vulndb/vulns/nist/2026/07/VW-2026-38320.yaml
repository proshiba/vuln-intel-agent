title: "RapidRAW before 1.6.0 does not validate the lutPath field in preset files
  before passing it to File::open() in lut_processing.rs. On Windows, a UNC path in
  lutPath causes an outbound SMB connection to an attacker-controlled host, leaking
  the victim's NTLMv2 credentials. The vulnerable code path is reachable through two
  vectors: community presets fetched automatically from the remote preset repository
  when the victim opens the Community tab, and individual preset files imported directly
  by the victim via the preset import feature (handle_import_presets_from_file in
  file_management.rs). The second vector does not require control of the community
  preset repository and is triggered when a user imports a preset file shared through
  Discord, forums, or similar channels."
