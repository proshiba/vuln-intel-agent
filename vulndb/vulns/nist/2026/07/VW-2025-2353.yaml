title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  fs, fix UAF in flow counter release\n\nFix a kernel trace [1] caused by releasing
  an HWS action of a local flow\ncounter in mlx5_cmd_hws_delete_fte(), where the HWS
  action refcount and\nmutex were not initialized and the counter struct could already
  be freed\nwhen deleting the rule.\n\nFix it by adding the missing initializations
  and adding refcount for the\nlocal flow counter struct.\n\n[1] Kernel log:\n Call
  Trace:\n  <TASK>\n  dump_stack_lvl+0x34/0x48\n  mlx5_fs_put_hws_action.part.0.cold+0x21/0x94
  [mlx5_core]\n  mlx5_fc_put_hws_action+0x96/0xad [mlx5_core]\n  mlx5_fs_destroy_fs_actions+0x8b/0x152
  [mlx5_core]\n  mlx5_cmd_hws_delete_fte+0x5a/0xa0 [mlx5_core]\n  del_hw_fte+0x1ce/0x260
  [mlx5_core]\n  mlx5_del_flow_rules+0x12d/0x240 [mlx5_core]\n  ? ttwu_queue_wakelist+0xf4/0x110\n\
  \  mlx5_ib_destroy_flow+0x103/0x1b0 [mlx5_ib]\n  uverbs_free_flow+0x20/0x50 [ib_uverbs]\n\
  \  destroy_hw_idr_uobject+0x1b/0x50 [ib_uverbs]\n  uverbs_destroy_u"
