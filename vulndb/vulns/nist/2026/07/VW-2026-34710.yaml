title: sysPass through version 3.2.11 contains an insecure direct object 
  reference vulnerability that allows any authenticated attacker to access 
  account file attachments belonging to accounts they do not have ACL 
  permissions for by exploiting missing authorization checks in 
  AccountFileController. Attackers can supply arbitrary numeric file IDs through
  the download, view, delete, upload, and list actions to enumerate and 
  manipulate any attachment in the vault, bypassing account-level access 
  controls entirely.
