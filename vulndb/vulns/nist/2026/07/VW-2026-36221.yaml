title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  NFIT: core: Fix possible NULL pointer dereference\n\nAfter commit 9b311b7313d6 (\"\
  ACPI: NFIT: Install Notify() handler before\ngetting NFIT table\"), acpi_nfit_probe()
  installs an ACPI notify handler\nfor the NFIT device before checking the presence
  of the NFIT table.  If\nthat table is not there, 0 is returned without allocating
  the acpi_desc\nobject and setting the driver data pointer of the NFIT device.  If
  the\nplatform firmware triggers an NFIT_NOTIFY_UC_MEMORY_ERROR notification\non
  the NFIT device at that point, acpi_nfit_uc_error_notify() will\ndereference a NULL
  pointer.\n\nPrevent that from occurring by adding an acpi_desc check against NULL\n\
  to acpi_nfit_uc_error_notify()."
