title: Emlog is an open source website building system. In versions 2.6.2 and 
  prior, a Local File Inclusion (LFI) vulnerability exists in admin/plugin.php 
  at line 80. The $plugin parameter from the GET request is directly used in a 
  require_once path without proper sanitization. If the CSRF token check can be 
  bypassed (see potential bypass conditions), an attacker can include arbitrary 
  PHP files from the server filesystem, leading to code execution. At time of 
  publication, there are no publicly available patches.
