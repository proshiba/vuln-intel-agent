  This issue affects the function extractContent of the file 
  src/services/content-extractor.service.ts of the component Model Context 
  Protocol Handler. The manipulation of the argument URL leads to server-side 
  request forgery. The attack may be initiated remotely. The exploit has been 
  disclosed publicly and may be used. This product uses a rolling release model 
  to deliver continuous updates. As a result, specific version information for 
  affected or updated releases is not available. The vendor was contacted early 
  about this disclosure but did not respond in any way.
