title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Fix race during abort for file descriptors\n\nfput() doesn't actually call file_operations
  release() synchronously, it\nputs the file on a work queue and it will be released
  eventually.\n\nThis is normally fine, except for iommufd the file and the iommufd_object\n\
  are tied to gether. The file has the object as it's private_data and holds\na users
  refcount, while the object is expected to remain alive as long as\nthe file is.\n\
  \nWhen the allocation of a new object aborts before installing the file it\nwill
  fput() the file and then go on to immediately kfree() the obj. This\ncauses a UAF
  once the workqueue completes the fput() and tries to\ndecrement the users refcount.\n\
  \nFix this by putting the core code in charge of the file lifetime, and call\n__fput_sync()
