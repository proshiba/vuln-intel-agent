title: OpenClaw Dashboard v3.0.0 contains a stored cross-site scripting 
  vulnerability that allows unauthenticated remote attackers to inject arbitrary
  HTML and script payloads by submitting a crafted username in a failed login 
  POST request, which is recorded verbatim in the audit log. When an 
  administrator opens the notification panel, the unescaped log entry is 
  rendered via innerHTML with a permissive Content-Security-Policy allowing 
  inline event handlers, enabling the attacker-supplied payload to execute in 
  the administrator's session and interact with authenticated endpoints 
  including agent instruction file editing and configuration changes.
