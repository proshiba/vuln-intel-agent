title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/P2PDMA:
  Release per-CPU pgmap ref when vm_insert_page() fails\n\nWhen vm_insert_page() fails
  in p2pmem_alloc_mmap(), p2pmem_alloc_mmap()\ndoesn't invoke percpu_ref_put() to
  free the per-CPU ref of pgmap acquired\nafter gen_pool_alloc_owner(), and memunmap_pages()
  will hang forever when\ntrying to remove the PCI device.\n\nFix it by adding the
  missed percpu_ref_put()."
