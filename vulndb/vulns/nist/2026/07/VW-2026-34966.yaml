title: SillyTavern is a locally installed user interface that allows users to 
  interact with text generation large language models, image generation engines,
  and text-to-speech voice models. Prior to version 1.17.0, a path traversal 
  vulnerability in the static file route handler allows any unauthenticated user
  to determine whether files exist anywhere on the server's filesystem. by 
  sending percent-encoded "../" sequences (%2E%2E%2F) in requests to static file
  routes, an attacker can check for the existence of files. This issue has been 
  patched in version 1.17.0.
