title: Directus is a real-time API and App dashboard for managing SQL database 
  content. Prior to 11.17.0, aggregate functions (min, max) applied to fields 
  with the conceal special type incorrectly return raw database values instead 
  of the masked placeholder. When combined with groupBy, any authenticated user 
  with read access to the affected collection can extract concealed field 
  values, including static API tokens and two-factor authentication secrets from
  directus_users. This vulnerability is fixed in 11.17.0.
