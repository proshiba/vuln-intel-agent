title: NLTK (Natural Language Toolkit) before version 3.9.3 contains an eval 
  injection vulnerability in the nltk.collocations module that allows an 
  attacker who controls command-line arguments to execute arbitrary Python code.
  When collocations.py is invoked directly, the __main__ block passes 
  command-line arguments directly to eval() as suffixes of BigramAssocMeasures 
  without allowlist validation or sanitization, enabling an attacker to supply a
  Python expression that escapes the intended attribute lookup and executes 
  arbitrary code including OS commands via the os module.
