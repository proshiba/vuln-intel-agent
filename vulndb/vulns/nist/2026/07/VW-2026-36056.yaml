title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: udc: Fix use-after-free in gadget_match_driver\n\nThe udc structure acts
  as the management structure for the gadget,\nbut their lifecycles are decoupled.
  A race condition exists where\nusb_del_gadget() frees the udc memory (e.g., via
  mode-switch work)\nwhile gadget_match_driver() concurrently accesses the freed udc
  memory\n(e.g., via configfs), causing a Use-After-Free (UAF) that triggers a\nNULL
  pointer dereference when the freed memory is zeroed:\n\n[39430.908615][ T1171] Unable
  to handle kernel NULL pointer dereference at virtual address 0000000000000000\n\
  [39430.911397][ T1171] pc : __pi_strcmp+0x20/0x140\n[39430.911441][ T1171] lr :
  gadget_match_driver+0x34/0x60\n...\n[39430.911890][ T1171]  usb_gadget_register_driver_owner+0x50/0xf8\n\
  [39430.911910][ T1171]  gadget_dev_desc_UDC_store+0xf4/0x140\n[39430.931308][ T1171]\
  \  configfs_write_iter+0xec/0x134\n\n[39430.957058][ T1171] Workqueue: events_freezable
  __dwc3_set_mode"
