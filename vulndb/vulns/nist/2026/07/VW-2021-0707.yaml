title: 'Vulnerability in the Oracle HRMS (France) product of Oracle E-Business Suite
  (component: French HR). Supported versions that are affected are 12.1.1-12.1.3.
  Easily exploitable vulnerability allows low privileged attacker with network access
  via HTTP to compromise Oracle HRMS (France). Successful attacks of this vulnerability
  can result in unauthorized creation, deletion or modification access to critical
  data or all Oracle HRMS (France) accessible data as well as unauthorized access
  to critical data or complete access to all Oracle HRMS (France) accessible data.
  CVSS 3.1 Base Score 8.1 (Confidentiality and Integrity impacts). CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N).'
