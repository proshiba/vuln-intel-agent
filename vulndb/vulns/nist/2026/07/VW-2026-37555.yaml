title: Pydantic AI is a Python agent framework for building Generative AI 
  applications. In versions 1.65.0 through 1.105.0, and 2.0.0b1 through 2.0.0b5,
  a client that submits message history to a Pydantic AI UI adapter (such as the
  Vercel AI adapter) can reference arbitrary files in the application's 
  model-provider or cloud-storage account. While file URL parts are validated 
  against a scheme allowlist, UploadedFile references — which point to a file by
  provider file ID or cloud-storage URI (e.g. s3://…, gs://…) — were forwarded 
  without validation. Because the provider resolves an UploadedFile using the 
  server-side identity (IAM role, service account, or provider API key) rather 
  than the client's, an attacker can craft message history to make the server 
  read objects from its own account or other tenants, given a referenceable 
  identifier. Exploitation requires a valid file identifier, which is not always
  unguessable depending on how the application names objects. This issue has 
  been fixed in ve
