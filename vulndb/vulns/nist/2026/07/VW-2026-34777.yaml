title: mppx is a TypeScript interface for machine payments protocol. Prior to 
  version 0.4.11, the stripe/charge payment method did not check Stripe's 
  Idempotent-Replayed response header when creating PaymentIntents. An attacker 
  could replay a valid credential containing the same spt token against a new 
  challenge, and the server would accept the replayed Stripe PaymentIntent as a 
  new successful payment without actually charging the customer again. This 
  allowed an attacker to pay once and consume unlimited resources by replaying 
  the credential. This issue has been patched in version 0.4.11.
