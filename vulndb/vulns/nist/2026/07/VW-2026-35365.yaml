title: ChurchCRM is an open-source church management system. Prior to 7.1.0, a 
  SQL injection vulnerability exists in the EditEventTypes.php file, which is 
  only accessible to administrators. The EN_tyid POST parameter is not sanitized
  before being used in a SQL query, allowing an administrator to execute 
  arbitrary SQL commands directly against the database. This vulnerability is 
  fixed in 7.1.0.
