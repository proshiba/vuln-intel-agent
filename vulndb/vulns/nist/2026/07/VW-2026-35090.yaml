title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  processor: Fix previous acpi_processor_errata_piix4() fix\n\nAfter commi f132e089fe89
  (\"ACPI: processor: Fix NULL-pointer dereference\nin acpi_processor_errata_piix4()\"\
  ), device pointers may be dereferenced\nafter dropping references to the device
  objects pointed to by them,\nwhich may cause a use-after-free to occur.\n\nMoreover,
  debug messages about enabling the errata may be printed\nif the errata flags corresponding
  to them are unset.\n\nAddress all of these issues by moving message printing to
  the points\nin the code where the errata flags are set."
