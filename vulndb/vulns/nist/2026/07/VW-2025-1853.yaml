title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  Drop unmanaged ELP metric worker\n\nThe ELP worker needs to calculate new metric
  values for all neighbors\n\"reachable\" over an interface. Some of the used metric
  sources require\nlocks which might need to sleep. This sleep is incompatible with
  the RCU\nlist iterator used for the recorded neighbors. The initial approach to
  work\naround of this problem was to queue another work item per neighbor and then\n\
  run this in a new context.\n\nEven when this solved the RCU vs might_sleep() conflict,
  it has a major\nproblems: Nothing was stopping the work item in case it is not needed\n\
  anymore - for example because one of the related interfaces was removed or\nthe
  batman-adv module was unloaded - resulting in potential invalid memory\naccesses.\n\
  \nDirectly canceling the metric worker also has various problems:\n\n* cancel_work_sync
  for a to-be-deactivated interface is called with\n  rtnl_lock held. But the code
  in the ELP metric worker"
