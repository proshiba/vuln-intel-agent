title: "9router 0.4.59 (fixed in 0.4.60) contains a chain of vulnerabilities: a hardcoded
  default password (123456) that authenticates any fresh installation, a bypass of
  the LOCAL_ONLY network gate via a spoofed Host header, and unvalidated arguments
  passed to child_process.spawn() when registering MCP plugins. A remote, unauthenticated
  attacker can log in with the default credential, spoof the Host header to reach
  local-only routes, and register a malicious MCP plugin (e.g. node -e <payload>)
  to achieve arbitrary code execution on the host operating system when the plugin's
  SSE endpoint is triggered."
