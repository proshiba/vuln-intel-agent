title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btusb: reorder cleanup in btusb_disconnect to avoid UAF\n\nThere is a KASAN: slab-use-after-free
  read in btusb_disconnect().\nCalling \"usb_driver_release_interface(&btusb_driver,
  data->intf)\" will\nfree the btusb data associated with the interface. The same
  data is\nthen used later in the function, hence the UAF.\n\nFix by moving the accesses
  to btusb data to before the data is free'd."
