title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  appletb-kbd: fix UAF in inactivity-timer cleanup path\n\nCommit 38224c472a03 (\"\
  HID: appletb-kbd: fix slab use-after-free bug in\nappletb_kbd_probe\") added timer_delete_sync(&kbd->inactivity_timer)
  to\nboth the probe close_hw error path and appletb_kbd_remove(), but the\nway it
  was wired in left the inactivity timer reachable during driver\ntear-down via two
  distinct windows.\n\nWindow A -- put_device() before timer_delete_sync():\n\n\t\
  put_device(&kbd->backlight_dev->dev);\n\ttimer_delete_sync(&kbd->inactivity_timer);\n\
  \nThe inactivity_timer softirq reads kbd->backlight_dev and calls\nbacklight_device_set_brightness()
  -> mutex_lock(&ops_lock).  If a\nconcurrent hid_appletb_bl unbind drops the last
  devm reference\nbetween these two calls, the backlight_device is freed and the\n\
  mutex_lock() touches freed memory.\n\nWindow B -- backlight cleanup before hid_hw_stop():\n\
  \n\tif (kbd->backlight_dev) {\n\t\ttimer_delete_sync(...);\n\t\tput_device(...)"
