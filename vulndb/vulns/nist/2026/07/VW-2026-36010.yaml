title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/aux:
  Fix page UAF in map_range()\n\nmap_range() reads rb->aux_pages[], rb->aux_nr_pages
  and rb->aux_pgoff via\nperf_mmap_to_page() while holding only event->mmap_mutex.
  Those fields are\nserialized by rb->aux_mutex, and mmap_mutex is per event.\n\n\
  Thus, two events sharing one rb via PERF_EVENT_IOC_SET_OUTPUT can race\nrb_alloc_aux()
  with map_range(), leading to a page-UAF scenario as follows:\n\n  CPU 0        \
  \                   CPU 1\n  =====                           =====\n  rb_alloc_aux()\
  \                  map_range()\n  [1]: allocate rb->aux_pages[0]\n  [2]: rb->aux_nr_pages++\n\
  \                                  [3]: perf_mmap_to_page()\n                  \
  \                       returns rb->aux_pages[0]\n                             \
  \     [4]: map it as VM_PFNMAP\n  [5]: rb->aux_pgoff = 1\n\n  munmap the page\n\
  \  [6]: free rb->aux_pages[0]\n\nPages mapped as VM_PFNMAP have no refcount protection,
  so CPU 1 holds a\nmapping to a freed ph"
