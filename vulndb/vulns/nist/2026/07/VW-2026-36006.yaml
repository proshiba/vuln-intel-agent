title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexfat:
  bound uniname advance in exfat_find_dir_entry()\n\nIn exfat_find_dir_entry(), each
  TYPE_EXTEND (file name) entry advances the\noutput pointer by a fixed amount while
  the loop guard only tracks the\naccumulated name length:\n\n\tif (++order == 2)\n\
  \t\tuniname = p_uniname->name;\n\telse\n\t\tuniname += EXFAT_FILE_NAME_LEN;\n\t\
  len = exfat_extract_uni_name(ep, entry_uniname);\n\tname_len += len;\n\tunichar
  = *(uniname+len);\n\t*(uniname+len) = 0x0;\n\nuniname grows by EXFAT_FILE_NAME_LEN
  (15) per name entry, but name_len\ngrows only by the actual extracted length, which
  is shorter when a name\nfragment contains an early NUL.  The only guard is\n`name_len
  >= MAX_NAME_LENGTH`, so a crafted directory with many short\nname fragments lets
  uniname run far past the\np_uniname->name[MAX_NAME_LENGTH + 3] buffer while name_len
  stays small,\ncausing an out-of-bounds read and write at *(uniname+len).\n\nThe
  sibling extractor exfat_get_uniname_from_ext_entry()"
