title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: cancel mesh send timer when hdev removed\n\nmesh_send_done timer is not canceled
  when hdev is removed, which causes\ncrash if the timer triggers after hdev is gone.\n\
  \nCancel the timer when MGMT removes the hdev, like other MGMT timers.\n\nShould
  fix the BUG: sporadically seen by BlueZ test bot\n(in \"Mesh - Send cancel - 1\"\
  \ test).\n\nLog:\n------\nBUG: KASAN: slab-use-after-free in run_timer_softirq+0x76b/0x7d0\n\
  ...\nFreed by task 36:\n kasan_save_stack+0x24/0x50\n kasan_save_track+0x14/0x30\n\
  \ __kasan_save_free_info+0x3a/0x60\n __kasan_slab_free+0x43/0x70\n kfree+0x103/0x500\n\
  \ device_release+0x9a/0x210\n kobject_put+0x100/0x1e0\n vhci_release+0x18b/0x240\n\
