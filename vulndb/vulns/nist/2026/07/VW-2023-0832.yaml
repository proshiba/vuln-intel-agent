title: "Use After Free vulnerability in Linux kernel traffic control index filter
  (tcindex) allows Privilege Escalation. The imperfect hash area can be updated while
  packets are traversing, which will cause a use-after-free when 'tcf_exts_exec()'
  is called with the destroyed tcf_ext. A local attacker user can use this vulnerability
  to elevate its privileges to root.\n\n\nThis issue affects Linux Kernel: from 4.14
  before git commit ee059170b1f7e94e55fa6cadee544e176a6e59c2."
