title: A flaw was found in the cluster-proxy service-proxy component used in Red
  Hat Advanced Cluster Management for Kubernetes (RHACM) and multicluster-engine
  (MCE). The service-proxy appends impersonation group headers to proxied 
  requests without first removing caller-supplied values, and the spoke 
  ServiceAccount holds unrestricted impersonation permissions. An authenticated 
  hub principal can inject an Impersonate-Group header to escalate to 
  cluster-admin on every managed cluster.
