title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  psample: fix info leak in PSAMPLE_ATTR_DATA\n\npsample open codes nla_put() presumably
  to avoid wiping\nthe data with 0s just to override it with packet data.\nThis open
  coding is missing clearing the pad, however,\neach netlink attr is padded to 4B
  and data_len may\nnot be divisible by 4B."
