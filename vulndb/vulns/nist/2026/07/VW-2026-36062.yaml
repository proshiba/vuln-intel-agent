title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Allow LPM map access from sleepable BPF programs\n\ntrie_lookup_elem() annotates
  its rcu_dereference_check() walks with\nonly rcu_read_lock_bh_held().  Because rcu_dereference_check(p,
  c)\nresolves to \"c || rcu_read_lock_held()\", this passes for XDP/NAPI and\nclassic
  RCU readers but fails for sleepable BPF programs, which enter\nvia __bpf_prog_enter_sleepable()
  and hold only rcu_read_lock_trace().\n\ntrie_update_elem() and trie_delete_elem()
  have the same problem in a\ndifferent form: they walk the trie with plain rcu_dereference(),
  which\nasserts rcu_read_lock_held() unconditionally.  Both are reachable from\n\
  sleepable BPF programs via the bpf_map_update_elem / bpf_map_delete_elem\nhelpers,
  and from the syscall path under classic rcu_read_lock().  In\nthe writer paths the
  trie is actually protected by trie->lock (an\nrqspinlock taken across the walk);
  we never relied on the RCU read-side\nlock to keep nodes alive there.\n\nA sle"
