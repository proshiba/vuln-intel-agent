title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfs/hfsplus:
  zero-initialize buffer in hfs_bnode_read\n\nhfs_bnode_read() can return early without
  writing to the output buffer\nwhen is_bnode_offset_valid() fails or when check_and_correct_requested_\n\
  length() corrects the length to zero.  Callers such as hfs_bnode_read_\nu16() and
  hfs_bnode_read_u8() pass stack-allocated buffers and use the\nresult unconditionally,
  leading to KMSAN uninit-value reports.\n\nRather than initializing at each individual
  call site, zero the buffer\nat the start of hfs_bnode_read() before any validation
  checks.  This\nensures all callers in both hfs and hfsplus get a deterministic zero\n\
  value regardless of which early-return path is taken."
