title: Flyto2 Core is an execution kernel for automation and AI-agent workflows.
  Prior to 2.26.7, the HTTP modules http.get, http.request, and http.batch in 
  src/core/modules/atomic/http/get.py, src/core/modules/atomic/http/request.py, 
  and src/core/modules/atomic/http/batch.py validate only the initial URL, then 
  follow redirects with allow_redirects=True and without per-hop Location 
  revalidation, allowing a public URL to redirect into internal address space 
  and return the internal response body. This issue is fixed in version 2.26.7.
