title: The Hustle – Email Marketing, Lead Generation, Optins, Popups plugin for 
  WordPress is vulnerable to unauthorized modification of data due to a missing 
  capability check on the 'hustle_module_converted' AJAX action in all versions 
  up to, and including, 7.8.10.2. This makes it possible for unauthenticated 
  attackers to forge conversion tracking events for any Hustle module, including
  draft modules that are never displayed to users, thereby manipulating 
  marketing analytics and conversion statistics.
