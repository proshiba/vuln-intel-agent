title: CI4MS is a CodeIgniter 4-based CMS skeleton that delivers a 
  production-ready, modular architecture with RBAC authorization and theme 
  support. Prior to 0.31.4.0, the Google Maps iframe setting (cMap field) in 
  compInfosPost() sanitizes input using strip_tags() with an <iframe> allowlist 
  and regex-based removal of on\w+ event handlers. However, the srcdoc attribute
  is not an event handler and passes all filters. An attacker with admin 
  settings access can inject an <iframe srcdoc="..."> payload with 
  HTML-entity-encoded JavaScript that executes in the context of the parent page
  when rendered to unauthenticated frontend visitors. This vulnerability is 
  fixed in 0.31.4.0.
