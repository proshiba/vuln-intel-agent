title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  accel: kxsd9: fix runtime PM imbalance on write_raw() error\n\nkxsd9_write_raw()
  takes a runtime PM reference with pm_runtime_get_sync()\nbut returns -EINVAL directly
  when a scale with a non-zero integer part is\nrequested, skipping the matching pm_runtime_put_autosuspend().
  This leaks\na runtime PM usage-counter reference on every such write, after which
  the\ndevice can no longer autosuspend.\n\nSet the error code and fall through to
  the existing put instead of\nreturning early."
