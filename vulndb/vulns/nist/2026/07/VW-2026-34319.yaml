title: "Improper Certificate Validation vulnerability in Erlang OTP public_key (pubkey_ocsp
  module) allows OCSP designated-responder authorization bypass via missing signature
  verification.\n\nThe OCSP response validation in public_key:pkix_ocsp_validate/5
  does not verify that a CA-designated responder certificate was cryptographically
  signed by the issuing CA. Instead, it only checks that the responder certificate's
  issuer name matches the CA's subject name and that the certificate has the OCSPSigning
  extended key usage. An attacker who can intercept or control OCSP responses can
  create a self-signed certificate with a matching issuer name and the OCSPSigning
  EKU, and use it to forge OCSP responses that mark revoked certificates as valid.\n\
  \nThis affects SSL/TLS clients using OCSP stapling, which may accept connections
  to servers with revoked certificates, potentially transmitting sensitive data to
  compromised servers. Applications using the public_key:pkix_ocsp_validate/5 API
