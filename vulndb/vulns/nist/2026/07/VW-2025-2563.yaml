title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  Fix UAF on kernel BO VA nodes\n\nIf the MMU is down, panthor_vm_unmap_range() might
  return an error.\nWe expect the page table to be updated still, and if the MMU is
  blocked,\nthe rest of the GPU should be blocked too, so no risk of accessing\nphysical
  memory returned to the system (which the current code doesn't\ncover for anyway).\n\
  \nProceed with the rest of the cleanup instead of bailing out and leaving\nthe va_node
  inserted in the drm_mm, which leads to UAF when other\nadjacent nodes are removed
  from the drm_mm tree."
