title: CI4MS is a CodeIgniter 4-based CMS skeleton that delivers a 
  production-ready, modular architecture with RBAC authorization and theme 
  support. Prior to 0.31.4.0, the install route guard in ci4ms relies solely on 
  a volatile cache check (cache('settings')) combined with .env file existence 
  to block post-installation access to the setup wizard. When the database is 
  temporarily unreachable during a cache miss (TTL expiry or admin-triggered 
  cache clear), the guard fails open, allowing an unauthenticated attacker to 
  overwrite the .env file with attacker-controlled database credentials, 
  achieving full application takeover. This vulnerability is fixed in 0.31.4.0.
