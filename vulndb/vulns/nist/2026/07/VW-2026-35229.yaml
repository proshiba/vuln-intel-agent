title: A vulnerability has been found in AntaresMugisho PyBlade 
  0.1.8-alpha/0.1.9-alpha. The affected element is the function _is_safe_ast of 
  the file sandbox.py of the component AST Validation. Such manipulation leads 
  to improper neutralization of special elements used in a template engine. The 
  attack may be performed from remote. The exploit has been disclosed to the 
  public and may be used. The project was informed of the problem early through 
  an issue report but has not responded yet.
