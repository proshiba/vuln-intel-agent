title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  validate VAT header length against the VAT inode size\n\nudf_load_vat() takes the
  virtual partition's start offset straight from\nthe on-disk VAT 2.0 header without
  checking it against the VAT inode\nsize:\n\n\tmap->s_type_specific.s_virtual.s_start_offset
  =\n\t\tle16_to_cpu(vat20->lengthHeader);\n\tmap->s_type_specific.s_virtual.s_num_entries
  =\n\t\t(sbi->s_vat_inode->i_size -\n\t\t\tmap->s_type_specific.s_virtual.s_start_offset)
  >> 2;\n\nlengthHeader is a fully attacker-controlled 16-bit value.  If it exceeds\n\
  the VAT inode size, the s_num_entries subtraction underflows to a huge\ncount, which
  defeats the \"block > s_num_entries\" bound in\nudf_get_pblock_virt15(); and on
  the ICB-inline path that function reads\n\n\t((__le32 *)(iinfo->i_data + s_start_offset))[block]\n\
  \nso a large s_start_offset indexes past the inode's in-ICB data.  Mounting\na crafted
  UDF image with a virtual (VAT) partition then triggers an\nout-of-bounds read.\n\
  \nReject a VA"
