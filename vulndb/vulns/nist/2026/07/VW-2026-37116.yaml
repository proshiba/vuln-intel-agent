title: In schreibfaul1 ESP32-audioI2S 3.4.5, a heap-based buffer overflow in the
  ID3v2 APIC frame parsing function in audiolib allows remote attackers to 
  execute arbitrary code or cause a denial of service (crash) via a crafted MP3 
  file. The vulnerability exists due to missing length validation when 
  processing the APIC frame size field, leading to an out-of-bounds memory 
  write.
