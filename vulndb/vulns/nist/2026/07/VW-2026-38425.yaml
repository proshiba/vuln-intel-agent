title: A flaw was found in Red Hat Advanced Cluster Security for Kubernetes 
  (RHACS). When processing Kubernetes Deployments, ACS replaces deployment 
  identity metadata based on the openshift.io/encoded-deployment-config label. A
  user with permission to create Deployments can set this label to "null", 
  causing ACS to treat the workload as having empty UID, name and labels and 
  namespace "default". This bypasses deploy-time policy detection and 
  enforcement visibility, prevents correct persistence in Central and breaks 
  violation reporting and compliance correlation for the affected deployment.
