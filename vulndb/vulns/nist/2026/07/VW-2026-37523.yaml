title: "Heimdall Data Database Proxy generateFileContent CRLF Injection Remote Code
  Execution Vulnerability. This vulnerability allows remote attackers to execute arbitrary
  code on affected installations of Heimdall Data Database Proxy. Authentication is
  required to exploit this vulnerability.\n\nThe specific flaw exists within the generateFileContent
  function. The issue results from the lack of proper neutralization of CRLF sequences.
  An attacker can leverage this vulnerability to execute code in the context of root.
  Was ZDI-CAN-29251."
