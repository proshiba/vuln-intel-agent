title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix race between DIM disable and net_dim()\n\nThere's a race between disabling DIM
  and NAPI callbacks using the dim\npointer on the RQ or SQ.\n\nIf NAPI checks the
  DIM state bit and sees it still set, it assumes\n`rq->dim` or `sq->dim` is valid.
  But if DIM gets disabled right after\nthat check, the pointer might already be set
  to NULL, leading to a NULL\npointer dereference in net_dim().\n\nFix this by calling
  `synchronize_net()` before freeing the DIM context.\nThis ensures all in-progress
  NAPI callbacks are finished before the\npointer is cleared.\n\nKernel log:\n\nBUG:
  kernel NULL pointer dereference, address: 0000000000000000\n...\nRIP: 0010:net_dim+0x23/0x190\n\
  ...\nCall Trace:\n <TASK>\n ? __die+0x20/0x60\n ? page_fault_oops+0x150/0x3e0\n\
  \ ? common_interrupt+0xf/0xa0\n ? sysvec_call_function_single+0xb/0x90\n ? exc_page_fault+0x74/0x130\n\
  \ ? asm_exc_page_fault+0x22/0x30\n ? net_dim+0x23/0x190\n ? mlx5e_poll_ico_cq+0x41/0x6f0
  [mlx5_c"
