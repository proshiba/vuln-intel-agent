title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsparc:
  fix accurate exception reporting in copy_{from_to}_user for Niagara\n\nThe referenced
  commit introduced exception handlers on user-space memory\nreferences in copy_from_user
  and copy_to_user. These handlers return from\nthe respective function and calculate
  the remaining bytes left to copy\nusing the current register contents. This commit
  fixes a couple of bad\ncalculations and a broken epilogue in the exception handlers.
  This will\nprevent crashes and ensure correct return values of copy_from_user and\n\
  copy_to_user in the faulting case. The behaviour of memcpy stays unchanged."
