title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/sched:
  Fix potential double free in drm_sched_job_add_resv_dependencies\n\nWhen adding
  dependencies with drm_sched_job_add_dependency(), that\nfunction consumes the fence
  reference both on success and failure, so in\nthe latter case the dma_fence_put()
  on the error path (xarray failed to\nexpand) is a double free.\n\nInterestingly
  this bug appears to have been present ever since\ncommit ebd5f74255b9 (\"drm/sched:
  Add dependency tracking\"), since the code\nback then looked like this:\n\ndrm_sched_job_add_implicit_dependencies():\n\
  ...\n       for (i = 0; i < fence_count; i++) {\n               ret = drm_sched_job_add_dependency(job,
  fences[i]);\n               if (ret)\n                       break;\n       }\n\n\
  \       for (; i < fence_count; i++)\n               dma_fence_put(fences[i]);\n\
  \nWhich means for the failing 'i' the dma_fence_put was already a double\nfree.
  Possibly there were no users at that time, or the test cases were\ninsuff"
