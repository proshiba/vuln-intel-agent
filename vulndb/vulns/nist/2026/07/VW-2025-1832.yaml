title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/v3d:
  Ensure job pointer is set to NULL after job completion\n\nAfter a job completes,
  the corresponding pointer in the device must\nbe set to NULL. Failing to do so triggers
  a warning when unloading\nthe driver, as it appears the job is still active. To
  prevent this,\nassign the job pointer to NULL after completing the job, indicating\n\
  the job has finished."
