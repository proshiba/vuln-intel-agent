title: Jellyfin is an open source self hosted media server. Versions prior to 
  10.11.7 contain a vulnerability chain in the LiveTV M3U tuner endpoint (POST 
  /LiveTv/TunerHosts), where the tuner URL is not validated, allowing local file
  read via non-HTTP paths and Server-Side Request Forgery (SSRF) via HTTP URLs. 
  This is exploitable by any authenticated user because the 
  EnableLiveTvManagement permission defaults to true for all new users. An 
  attacker can chain these vulnerabilities by adding an M3U tuner pointing to an
  attacker-controlled server, serving a crafted M3U with a channel pointing to 
  the Jellyfin database, exfiltrating the database to extract admin session 
  tokens, and escalating to admin privileges. This issue has been fixed in 
  version 10.11.7. If users are unable to upgrade immediately, they can disable 
  Live TV Management privileges for all users.
