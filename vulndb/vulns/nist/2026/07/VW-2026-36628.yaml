title: "Signed to Unsigned Conversion Error and Out-of-bounds Write vulnerability
  in Erlang OTP erts allows an attacker who can supply a crafted Erlang external term
  format (ETF) binary to binary_to_term/1 to corrupt the BEAM heap pointer and crash
  the virtual machine.\n\nWhen decoding a LARGE_TUPLE_EXT term, the validation pass
  decoded_size() in erts/emulator/beam/external.c reads the 32-bit arity field as
  unsigned (get_uint32()), while the decode pass dec_term() reads the same field as
  a signed 32-bit integer (get_int32()) into an int. An arity wire value of 0x80000000
  passes validation as 2147483648 but decodes as -2147483648, so the subsequent hp
  += n moves the heap allocation pointer backward. Neither pass enforces the runtime
  tuple-arity limit MAX_ARITYVAL. The result is an out-of-bounds heap write; in practice
  the VM detects an impossible heap size and aborts, denying service. The required
  padding is large when uncompressed but the compressed-ETF envelope shrinks it to
  a small payload on "
