title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  ndisc: fix NULL deref in accept_untracked_na()\n\naccept_untracked_na() re-fetches
  the inet6_dev with __in6_dev_get(dev)\nand dereferences idev->cnf.accept_untracked_na
  without a NULL check,\neven though its only caller ndisc_recv_na() already fetched
  and\nNULL-checked idev for the same device.\n\nBoth reads of dev->ip6_ptr run in
  the same RCU read-side critical\nsection, but a concurrent addrconf_ifdown() can
  clear dev->ip6_ptr\nbetween them: lowering the MTU below IPV6_MIN_MTU calls addrconf_ifdown()\n\
  without the synchronize_net() that orders the unregister path, so the\nre-fetch
  returns NULL and oopses:\n\n BUG: KASAN: null-ptr-deref in ndisc_recv_na (net/ipv6/ndisc.c:974)\n\
  \ Read of size 4 at addr 0000000000000364\n Call Trace:\n  <IRQ>\n  ndisc_recv_na
  (net/ipv6/ndisc.c:974)\n  icmpv6_rcv (net/ipv6/icmp.c:1193)\n  ip6_protocol_deliver_rcu
  (net/ipv6/ip6_input.c:479)\n  ip6_input_finish (net/ipv6/ip6_input.c:534)\n  ip6_input
