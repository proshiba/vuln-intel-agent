title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: wean fast IN from emulator_pio_in\n\nUse __emulator_pio_in() directly for fast
  PIO instead of bouncing through\nemulator_pio_in() now that __emulator_pio_in()
  fills \"val\" when handling\nin-kernel PIO.  vcpu->arch.pio.count is guaranteed
  to be '0', so this a\npure nop.\n\nemulator_pio_in_emulated is now the last caller
  of emulator_pio_in.\n\nNo functional change intended."
