title: "ATEN Unizon RpcProvider Missing Authentication Denial-of-Service Vulnerability.
  This vulnerability allows remote attackers to create a denial-of-service condition
  on affected installations of ATEN Unizon. Authentication is not required to exploit
  this vulnerability.\n\nThe specific flaw exists within the RpcProvider class. The
  issue results from the lack of authentication prior to allowing access to functionality.
  An attacker can leverage this vulnerability to create a denial-of-service condition
  on the system. Was ZDI-CAN-29041."
