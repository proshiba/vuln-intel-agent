title: The Event Booking Manager for WooCommerce – Sell Tickets, Event 
  Registration, RSVP & Event Calendar plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 5.3.7. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to modify site-wide payment settings — 
  including WooCommerce payment enablement, cart redirect behavior, login 
  requirements for checkout, confirmation page ID, and confirmed ticket statuses
  — that govern how all event bookings are processed.
