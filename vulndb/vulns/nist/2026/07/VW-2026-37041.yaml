title: "Pivotick fails to sanitize attacker-controlled SVG markup supplied through
  the per-node style.svgIcon property before inserting it into the document.\n\nWhen
  rendering a graph node, the vulnerable code assigns the SVG icon markup directly
  to the innerHTML property of a live SVG element. An attacker able to influence graph
  data can provide crafted markup containing executable event handlers, such as an
  <image> element with an onerror attribute.\n\nWhen a victim loads or renders the
  malicious graph, the payload may execute arbitrary JavaScript in the security context
  of the application embedding Pivotick. Successful exploitation could allow the attacker
  to access application data available to the victim, modify displayed content, or
  perform actions using the victim’s authenticated session.\n\nExploitation requires
  an application using Pivotick to render graph data that is controlled or modified
  by an attacker."
