title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/handshake:
  Take a long-lived file reference at submit\n\nhandshake_nl_accept_doit() needs the
  file pointer backing\nreq->hr_sk->sk_socket to survive the window between\nhandshake_req_next()
  and the subsequent FD_PREPARE() and get_file().\nThe submit-side sock_hold() does
  not provide that.  sk_refcnt keeps\nstruct sock alive, but struct socket is owned
  by sock->file: when\nthe consumer fputs the last file reference, sock_release()
  tears\nthe socket down regardless of any sock_hold.\n\nAdd an hr_file pointer to
  struct handshake_req and acquire an\nexplicit reference on sock->file during handshake_req_submit().\n\
  handshake_complete() and handshake_req_cancel() release the\nreference on the completion-bit-winning
  path.\n\nThe submit error path must also release the file reference, but\nafter
  rhashtable insertion a concurrent handshake_req_cancel() can\ndiscover the request
  and race the error path.  Gate the error-path\ncleanup -- sk_des"
