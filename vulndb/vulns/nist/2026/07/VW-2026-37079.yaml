title: "MISP installation scripts generated an Apache HTTP virtual-host configuration
  containing an incorrectly formatted HTTP-to-HTTPS redirect:\n\nRedirect permanent
  / https://misp.example\n\nApache’s Redirect directive appends any portion of the
  requested path that follows the matched prefix to the configured destination URL.
  Because the destination did not end with /, attacker-controlled path content was
  appended directly to the hostname rather than to its URL path.\n\nFor example, a
  request resembling:\n\nhttp://misp.example/@attacker.example/\n\ncould result in
  a redirect resembling:\n\nhttps://misp.example@attacker.example/\n\nUnder standard
  URL parsing, misp.example is interpreted as user information and attacker.example
  as the destination host. An unauthenticated remote attacker could therefore construct
  a URL hosted under the legitimate MISP domain that redirects users to an attacker-controlled
  website.\n\nThe vulnerability could be used for phishing, credential collection,
  or potentially disclosing"
