  Apache Answer.\n\nThis issue affects Apache Answer: through 2.0.0.\n\nThe unlisted
  question feature did not enforce access restrictions on direct API endpoints, allowing
  authenticated users to discover and access unlisted questions, their answers, comments,
  and revision history.\nUsers are recommended to upgrade to version 2.0.1, which
  fixes the issue."
