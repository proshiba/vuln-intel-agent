title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix use-after-free warning in btrfs_get_or_create_delayed_node()\n\nPreviously,
  btrfs_get_or_create_delayed_node() set the delayed_node's\nrefcount before acquiring
  the root->delayed_nodes lock.\nCommit e8513c012de7 (\"btrfs: implement ref_tracker
  for delayed_nodes\")\nmoved refcount_set inside the critical section, which means
  there is\nno longer a memory barrier between setting the refcount and setting\n\
  btrfs_inode->delayed_node.\n\nWithout that barrier, the stores to node->refs and\n\
  btrfs_inode->delayed_node may become visible out of order. Another\nthread can then
  read btrfs_inode->delayed_node and attempt to\nincrement a refcount that hasn't
  been set yet, leading to a\nrefcounting bug and a use-after-free warning.\n\nThe
  fix is to move refcount_set back to where it was to take\nadvantage of the implicit
  memory barrier provided by lock\nacquisition.\n\nBecause the allocations now happen
