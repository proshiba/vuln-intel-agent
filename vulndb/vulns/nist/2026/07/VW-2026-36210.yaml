title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: lpc32xx: Initialize completion before requesting IRQ\n\nIn the report from
  Jaeyoung Chung:\n\n\"lpc32xx_adc_probe() in drivers/iio/adc/lpc32xx_adc.c registers
  its\ninterrupt handler with devm_request_irq() before it initializes\nst->completion
  with init_completion(). If an interrupt arrives after\ndevm_request_irq() and before
  init_completion(), the handler calls\ncomplete() on an uninitialized completion,
  causing a kernel panic.\n\nThe probe path, in lpc32xx_adc_probe():\n\n    iodev
  = devm_iio_device_alloc(&pdev->dev, sizeof(*st)); /* st kzalloc-zeroed */\n    ...\n\
  \    retval = devm_request_irq(&pdev->dev, irq, lpc32xx_adc_isr, 0,\n          \
  \                    LPC32XXAD_NAME, st);           /* register handler */\n   \
  \ ...\n    init_completion(&st->completion);                       /* initialize
  completion */\n\nlpc32xx_adc_isr() calls complete():\n\n    complete(&st->completion);\n\
  \nIf the device raises an interrupt before init"
