title: Electron is a framework for writing cross-platform desktop applications 
  using JavaScript, HTML and CSS. Prior to versions 38.8.6, 39.8.1, 40.8.1, and 
  41.0.0, on Windows, app.setAsDefaultProtocolClient(protocol) did not validate 
  the protocol name before writing to the registry. Apps that pass untrusted 
  input as the protocol name may allow an attacker to write to arbitrary subkeys
  under HKCU\Software\Classes\, potentially hijacking existing protocol 
  handlers. Apps are only affected if they call app.setAsDefaultProtocolClient()
  with a protocol name derived from external or untrusted input. Apps that use a
  hardcoded protocol name are not affected. This issue has been patched in 
  versions 38.8.6, 39.8.1, 40.8.1, and 41.0.0.
