title: Capgo before 12.128.2 fails to enforce a maximum value on the minimum 
  password length field in its password policy configuration. An authenticated 
  organization administrator can set an extremely large numeric value (e.g., 
  billions of characters) as the minimum password length, making compliance 
  impossible for all organization members. Once the policy is enabled, users 
  (including administrators) are unable to change their passwords or access the 
  organization, resulting in an organization-wide account lockout and 
  application-level denial of service.
