title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuserfaultfd:
  gate must_wait writability check on pte_present()\n\nuserfaultfd_must_wait() and
  userfaultfd_huge_must_wait() read the PTE\nwithout taking the page table lock and
  then apply pte_write() /\nhuge_pte_write() to it.  Those accessors decode bits from
  the present\nencoding only; on a swap or migration entry they read the offset bits
  that\nhappen to share the same position and return an undefined result.\n\nThe intent
  of the check is \"is this fault still WP-blocked?\".  A\nnon-marker swap entry means
  the page is in transit -- the userfault\ncontext the original fault delivered against
  is no longer the same, and\nthe swap-in or migration completion path will re-deliver
  a fresh fault if\nuserspace still needs to handle it.  Worst case under the current
  code the\ngarbage write bit says \"wait\", and the thread stays asleep until a\n\
