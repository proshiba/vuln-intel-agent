title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix recursive locking in RPC handle list access\n\nSince commit 305853cce3794 (\"\
  ksmbd: Fix race condition in RPC handle list\naccess\"), ksmbd_session_rpc_method()
  attempts to lock sess->rpc_lock.\n\nThis causes hung connections / tasks when a
  client attempts to open\na named pipe. Using Samba's rpcclient tool:\n\n $ rpcclient
  //192.168.1.254 -U user%password\n $ rpcclient $> srvinfo\n <connection hung here>\n\
  \nKernel side:\n  \"echo 0 > /proc/sys/kernel/hung_task_timeout_secs\" disables
  this message.\n  task:kworker/0:0 state:D stack:0 pid:5021 tgid:5021 ppid:2 flags:0x00200000\n\
  \  Workqueue: ksmbd-io handle_ksmbd_work\n  Call trace:\n  __schedule from schedule+0x3c/0x58\n\
  \  schedule from schedule_preempt_disabled+0xc/0x10\n  schedule_preempt_disabled
  from rwsem_down_read_slowpath+0x1b0/0x1d8\n  rwsem_down_read_slowpath from down_read+0x28/0x30\n\
  \  down_read from ksmbd_session_rpc_method+0x18/0x3c\n  ksmbd_session_rpc_method
  from ksmbd_r"
