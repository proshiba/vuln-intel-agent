title: NocoBase is an AI-powered no-code/low-code platform for building business
  applications and enterprise solutions. Prior to version 2.0.28, NocoBase's 
  Workflow Script Node executes user-supplied JavaScript inside a Node.js vm 
  sandbox with a custom require allowlist (controlled by WORKFLOW_SCRIPT_MODULES
  env var). However, the console object passed into the sandbox context exposes 
  host-realm WritableWorkerStdio stream objects via console._stdout and 
  console._stderr. An authenticated attacker can traverse the prototype chain to
  escape the sandbox and achieve Remote Code Execution as root. This issue has 
  been patched in version 2.0.28.
