title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Set veventq_depth upper bound\n\niommufd_veventq_alloc() accepts any !0 veventq_depth
  from userspace, with\nan upper bound at U32_MAX.\n\nThis leaves a vulnerability
  where userspace can allocate excessively large\nqueues to exhaust kernel memory
  reserves.\n\nCap the veventq_depth (maximum number of entries) to 1 << 19, matching
  the\nmaximum number of entries in the SMMUv3 EVTQ (the largest use case today)."
