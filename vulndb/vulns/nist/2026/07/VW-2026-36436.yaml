title: A vulnerability was determined in perwendel spark up to 2.9.4. This 
  vulnerability affects the function staticFiles.externalLocation of the file 
  src/main/java/spark/resource/ExternalResourceHandler.jav of the component 
  SparkJava. Executing a manipulation can lead to symlink following. It is 
  possible to launch the attack remotely. The exploit has been publicly 
  disclosed and may be utilized. The project was informed of the problem early 
  through an issue report but has not responded yet.
