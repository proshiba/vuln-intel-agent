title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_printer: take kref only for successful open\n\nprinter_open() returns
  -EBUSY when the character device is already\nopen, but it increments dev->kref regardless
  of the return value. VFS\ndoes not call ->release() for a failed open, so every
  rejected second\nopen permanently leaks one reference.\n\nMove kref_get() into the
  successful-open branch."
