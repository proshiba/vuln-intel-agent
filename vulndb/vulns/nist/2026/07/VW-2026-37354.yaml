title: nanoid (Nano ID) before 5.1.16 contains an infinite loop in the 
  customAlphabet and nanoid functions of its non-secure module 
  (nanoid/non-secure). When these functions are given a negative size, the loop 
  counter is decremented from a negative value and never reaches its termination
  condition, spinning indefinitely and hanging the calling thread. An 
  application that passes an unvalidated, attacker-controlled negative size to 
  these functions is exposed to a denial-of-service condition.
