title: The Sleuth Kit through 4.14.0 contains an out-of-bounds read 
  vulnerability in the ISO9660 filesystem parser where the parse_susp() function
  trusts len_id, len_des, and len_src fields from the disk image to memcpy data 
  into a stack buffer without verifying that the source data falls within the 
  parsed SUSP block. An attacker can craft a malicious ISO image that causes 
  reads past the end of the SUSP data buffer, and a zero-length SUSP entry can 
  trigger an infinite parsing loop.
