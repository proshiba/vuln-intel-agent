title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/md-llbitmap:
  raise barrier before state machine transition\n\nMove the barrier raise operation
  before calling llbitmap_state_machine()\nin both llbitmap_start_write() and llbitmap_start_discard().
  This\nensures the barrier is in place before any state transitions occur,\npreventing
  potential race conditions where the state machine could\ncomplete before the barrier
  is properly raised."
