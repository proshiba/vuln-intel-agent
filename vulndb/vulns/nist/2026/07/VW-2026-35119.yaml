title: Hirschmann Industrial HiVision version 08.1.03 prior to 08.1.04 and 
  08.2.00 contains a vulnerability in the execution of user-configured external 
  applications that allows a local attacker to execute arbitrary binaries. Due 
  to insufficient path sanitization, an attacker can place a malicious binary in
  the execution path of a configured external application, causing it to be 
  executed instead of the intended application. This can result in execution 
  with elevated privileges depending on the context of the external application.
