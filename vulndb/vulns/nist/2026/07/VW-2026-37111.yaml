title: A flaw was found in sg3_utils. The sg_inq command, when invoked with the 
  --export option, outputs device identification data without sanitizing control
  characters in SCSI name string fields. A newline character embedded in a 
  device-supplied name string can inject arbitrary properties into the udev 
  device database. This could allow an attacker who can present a crafted SCSI 
  device to execute arbitrary commands as root when the device is disconnected.
