title: The Riaxe Product Customizer plugin for WordPress is vulnerable to 
  Sensitive Information Exposure in all versions up to, and including, 2.4 via 
  the '/wp-json/InkXEProductDesignerLite/orders' REST API endpoint. The endpoint
  is registered with 'permission_callback' set to '__return_true', meaning no 
  authentication or authorization checks are performed. The endpoint queries 
  WooCommerce order data from the database and returns it to the requester, 
  including customer first and last names, customer IDs, order IDs, order 
  totals, order dates, currencies, and order statuses. This makes it possible 
  for unauthenticated attackers to extract sensitive customer and order 
  information from the WooCommerce store.
