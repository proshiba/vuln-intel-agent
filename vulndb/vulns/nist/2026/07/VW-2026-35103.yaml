title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  fix use of NULL folio in move_pages_huge_pmd()\n\nmove_pages_huge_pmd() handles
  UFFDIO_MOVE for both normal THPs and huge\nzero pages.  For the huge zero page path,
  src_folio is explicitly set to\nNULL, and is used as a sentinel to skip folio operations
  like lock and\nrmap.\n\nIn the huge zero page branch, src_folio is NULL, so folio_mk_pmd(NULL,\n\
  pgprot) passes NULL through folio_pfn() and page_to_pfn().  With\nSPARSEMEM_VMEMMAP
  this silently produces a bogus PFN, installing a PMD\npointing to non-existent physical
  memory.  On other memory models it is a\nNULL dereference.\n\nUse page_folio(src_page)
  to obtain the valid huge zero folio from the\npage, which was obtained from pmd_page()
  and remains valid throughout.\n\nAfter commit d82d09e48219 (\"mm/huge_memory: mark
  PMD mappings of the huge\nzero folio special\"), moved huge zero PMDs must remain
  special so\nvm_normal_page_pmd() continues to treat them as special mappin"
