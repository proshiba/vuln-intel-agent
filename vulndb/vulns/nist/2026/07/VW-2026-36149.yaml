title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  krb5 - filter out async aead implementations at alloc\n\nkrb5_aead_encrypt(), krb5_aead_decrypt()
  in rfc3961_simplified.c and\nrfc8009_encrypt(), rfc8009_decrypt() in rfc8009_aes2.c
  set a NULL\ncompletion callback and treat any negative return from\ncrypto_aead_{encrypt,decrypt}()
  as terminal, falling through to\nkfree_sensitive(buffer).  When the encrypt_name
  resolves to an\nasync AEAD instance the request returns -EINPROGRESS, the buffer\n\
  is freed while the backend's worker still holds a pointer, and the\nworker dereferences
  the freed slab on completion.\n\nKASAN report under UML+SLUB with a synthetic async
  aead backend\nbound to krb5->encrypt_name:\n\n  BUG: KASAN: slab-use-after-free
  in t5_stub_complete+0x7d/0xc7\n\nThe helpers were written synchronously, so filter
  the async\ninstances out at allocation time instead of plumbing\ncrypto_wait_req()
  through every call site.\n\nReachable via net/rxrpc/rxgk.c, fs/afs/cm_security.c"
