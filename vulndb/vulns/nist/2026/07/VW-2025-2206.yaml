title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  libwx: remove duplicate page_pool_put_full_page()\n\npage_pool_put_full_page() should
  only be invoked when freeing Rx buffers\nor building a skb if the size is too short.
  At other times, the pages\nneed to be reused. So remove the redundant page put.
  In the original\ncode, double free pages cause kernel panic:\n\n[  876.949834] \
