title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390:
  Disable ARCH_WANT_OPTIMIZE_HUGETLB_VMEMMAP\n\nAs reported by Luiz Capitulino enabling
  HVO on s390 leads to reproducible\ncrashes. The problem is that kernel page tables
  are modified without\nflushing corresponding TLB entries.\n\nEven if it looks like
  the empty flush_tlb_all() implementation on s390 is\nthe problem, it is actually
  a different problem: on s390 it is not allowed\nto replace an active/valid page
  table entry with another valid page table\nentry without the detour over an invalid
  entry. A direct replacement may\nlead to random crashes and/or data corruption.\n\
  \nIn order to invalidate an entry special instructions have to be used\n(e.g. ipte
  or idte). Alternatively there are also special instructions\navailable which allow
  to replace a valid entry with a different valid\nentry (e.g. crdte or cspg).\n\n\
