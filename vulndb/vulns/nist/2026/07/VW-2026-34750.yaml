title: The Query Monitor – The developer tools panel for WordPress plugin for 
  WordPress is vulnerable to Reflected Cross-Site Scripting via the 
  ‘$_SERVER['REQUEST_URI']’ parameter in all versions up to, and including, 
  3.20.3 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that execute if they can successfully trick a user into performing an 
  action such as clicking on a link.
