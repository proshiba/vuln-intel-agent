title: re2 provides Node.js bindings for Google's RE2 regular expression engine.
  Prior to 1.25.2, re2 validates lastIndex against the UTF-8 byte length of a 
  subject but uses it as a UTF-16 code-unit offset in exec, test, match, 
  replace, and split, allowing an attacker-influenced lastIndex on a non-ASCII 
  subject to trigger an out-of-bounds heap read and an uncatchable process 
  crash, with limited heap information disclosure in some cases. This issue is 
  fixed in 1.25.2.
