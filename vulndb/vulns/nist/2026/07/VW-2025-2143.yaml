title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix invalid access to memory\n\nIn ath12k_dp_rx_msdu_coalesce(), rxcb is
  fetched from skb and boolean\nis_continuation is part of rxcb.\nCurrently, after
  freeing the skb, the rxcb->is_continuation accessed\nagain which is wrong since
  the memory is already freed.\nThis might lead use-after-free error.\n\nHence, fix
  by locally defining bool is_continuation from rxcb,\nso that after freeing skb,
  is_continuation can be used.\n\nCompile tested only."
