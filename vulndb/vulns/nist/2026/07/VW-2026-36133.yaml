title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  igmp: remove multicast group from hash table on device destruction\n\nWhen a device
  is destroyed under RTNL, ip_mc_destroy_dev() iterates through\nthe multicast list
  and calls ip_ma_put() on each membership, scheduling\nthem for RCU reclamation.
  However, they are not unlinked from the device's\nmulticast hash table (mc_hash).\n\
  \nSince the device remains published in dev->ip_ptr until after\nip_mc_destroy_dev()
  completes, concurrent RCU readers traversing mc_hash\ncan still locate and access
  the multicast group after its refcount is\ndecremented. If the RCU callback runs
  and frees the group while a reader is\naccessing it, a use-after-free occurs.\n\n\
  Fix this by unlinking the multicast group from mc_hash using\nip_mc_hash_remove()
  before scheduling it for reclamation.\n\nBUG: KASAN: slab-use-after-free in ip_check_mc_rcu+0x149/0x3f0\n\
  Read of size 4 at addr ffff888009bf1408 by task mausezahn/2276\n\nCall Trace:\n\
  \ <IRQ>\n dump_stack_lv"
