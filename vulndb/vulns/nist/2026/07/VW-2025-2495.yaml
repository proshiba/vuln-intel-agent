title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-fc:
  avoid scheduling association deletion twice\n\nWhen forcefully shutting down a port
  via the configfs interface,\nnvmet_port_subsys_drop_link() first calls nvmet_port_del_ctrls()
  and\nthen nvmet_disable_port(). Both functions will eventually schedule all\nremaining
  associations for deletion.\n\nThe current implementation checks whether an association
  is about to be\nremoved, but only after the work item has already been scheduled.
  As a\nresult, it is possible for the first scheduled work item to free all\nresources,
  and then for the same work item to be scheduled again for\ndeletion.\n\nBecause
  the association list is an RCU list, it is not possible to take\na lock and remove
  the list entry directly, so it cannot be looked up\nagain. Instead, a flag (terminating)
  must be used to determine whether\nthe association is already in the process of
  being deleted."
