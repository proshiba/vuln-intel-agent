title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  guest_memfd: Treat memslot binding offset+size as unsigned values\n\nWhen binding
  a memslot to a guest_memfd file, treat the offset and size as\nunsigned values to
  fix a bug where the sum of the two can result in a false\nnegative when checking
  for overflow against the size of the file.  Passing\nunsigned values also avoids
  relying on somewhat obscure checks in other\nflows for safety, and tracks the offset
  and size as they are intended to be\ntracked, as unsigned values.\n\nOn 64-bit kernels,
  the number of pages a memslot contains and thus the size\n(and offset) of its guest_memfd
  binding are unsigned 64-bit values.  Taking\nthe offset+size as an loff_t instead
  of a uoff_t inadvertently converts\nthe unsigned value to a signed value if the
