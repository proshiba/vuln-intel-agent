title: The Realtyna Organic IDX plugin for WordPress is vulnerable to Arbitrary 
  File Upload in versions up to, and including, 5.3.0. This is due to missing 
  file extension and content validation in the saveLiveImages() function 
  combined with an insufficient authorization check on the get_keys() AJAX 
  handler and a missing authentication check on the REST API import endpoint. 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to upload arbitrary files on the affected site's server 
  which may make remote code execution possible.
