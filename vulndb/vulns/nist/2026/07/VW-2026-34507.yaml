title: The Wpify Woo plugin for WordPress is vulnerable to Privilege Escalation 
  in versions up to, and including, 5.4.16. This is due to the 
  SettingsApi::save_option() REST route (POST /wp-json/wpify-woo/v1/option) 
  passing the request-supplied 'option' and 'data' parameters directly to 
  update_option() without any option-name allowlist or value sanitization, while
  the permission_callback only verifies the manage_woocommerce capability. This 
  makes it possible for authenticated attackers, with Shop Manager-level access 
  and above, to elevate their privileges to Administrator by overwriting 
  arbitrary WordPress options (for example setting default_role to administrator
  and users_can_register to 1, or disabling security plugins via 
  active_plugins).
