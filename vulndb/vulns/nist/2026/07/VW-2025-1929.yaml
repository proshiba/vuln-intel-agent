title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix r_count dec/increment mismatch\n\nr_count is only increased when there is an
  oplock break wait,\nso r_count inc/decrement are not paired. This can cause r_count\n\
  to become negative, which can lead to a problem where the ksmbd\nthread does not
  terminate."
