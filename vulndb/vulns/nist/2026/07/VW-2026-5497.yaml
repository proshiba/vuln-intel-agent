title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmfd:
  core: Add locking around 'mfd_of_node_list'\n\nManipulating a list in the kernel
  isn't safe without some sort of\nmutual exclusion. Add a mutex any time we access
  / modify\n'mfd_of_node_list' to prevent possible crashes."
