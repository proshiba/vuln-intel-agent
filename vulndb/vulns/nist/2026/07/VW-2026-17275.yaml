title: AVideo through version 25.0 contains an authentication bypass 
  vulnerability in the decryptMessage.json.php endpoint that allows 
  unauthenticated users to decrypt PGP messages. Remote attackers can submit 
  private keys, ciphertext, and passphrases to perform server-side decryption 
  without credentials, exposing key material to logs and enabling resource 
  exhaustion attacks.
