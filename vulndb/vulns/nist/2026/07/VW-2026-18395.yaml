title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  restrict SO_ATTACH_FILTER to priv users\n\nThis patch restricts the use of SO_ATTACH_FILTER
  (cBPF) on TCP sockets\nto users with CAP_NET_ADMIN capability.\n\nThis blocks potential
  side-channel attack where an unprivileged application\nattaches a filter to leak
  TCP sequence/acknowledgment numbers."
