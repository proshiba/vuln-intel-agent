title: Group-Office is an enterprise customer relationship management and 
  groupware tool. Prior to versions 6.8.156, 25.0.90, and 26.0.12, a 
  vulnerability in the AbstractSettingsCollection model leads to insecure 
  deserialization when these settings are loaded. By injecting a serialized 
  FileCookieJar object into a setting string, an authenticated attacker can 
  achieve Arbitrary File Write, leading directly to Remote Code Execution (RCE) 
  on the server. This issue has been patched in versions 6.8.156, 25.0.90, and 
  26.0.12.
