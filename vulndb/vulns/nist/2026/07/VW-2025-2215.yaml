title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix recv-recv race of completed call\n\nIf a call receives an event (such as incoming
  data), the call gets placed\non the socket's queue and a thread in recvmsg can be
  awakened to go and\nprocess it.  Once the thread has picked up the call off of the
  queue,\nfurther events will cause it to be requeued, and once the socket lock is\n\
  dropped (recvmsg uses call->user_mutex to allow the socket to be used in\nparallel),
  a second thread can come in and its recvmsg can pop the call off\nthe socket queue
  again.\n\nIn such a case, the first thread will be receiving stuff from the call
  and\nthe second thread will be blocked on call->user_mutex.  The first thread\n\
  can, at this point, process both the event that it picked call for and the\nevent
  that the second thread picked the call for and may see the call\nterminate - in
  which case the call will be \"released\", decoupling the call\nfrom the user call
  ID assigned to it (RXRPC_USER_CALL_I"
