title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  state: initialize state_ptrs earlier in xfrm_state_find\n\nIn case of preemption,
  xfrm_state_look_at will find a different\npcpu_id and look up states for that other
  CPU. If we matched a state\nfor CPU2 in the state_cache while the lookup started
  on CPU1, we will\njump to \"found\", but the \"best\" state that we got will be
  ignored and\nwe will enter the \"acquire\" block. This block uses state_ptrs, which\n\
  isn't initialized at this point.\n\nLet's initialize state_ptrs just after taking
  rcu_read_lock. This will\nalso prevent a possible misuse in the future, if someone
  adjusts this\nfunction."
