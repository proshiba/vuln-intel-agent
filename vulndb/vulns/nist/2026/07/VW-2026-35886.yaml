title: FFmpeg through 8.1.2, fixed in commit 5d7112c, contains an uncontrolled 
  resource consumption vulnerability in the IAMF demuxer that allows an 
  unauthenticated attacker to cause multi-gigabyte memory allocation from a 
  17-byte input file by supplying a crafted count_label field. The 
  mix_presentation_obu() function in libavformat/iamf_parse.c calls 
  av_calloc(count_label, sizeof(*language_label)) with an attacker-controlled 
  value before validating available OBU data, enabling an allocation 
  amplification of approximately 126 million bytes per input byte that exhausts 
  process memory or triggers an OOM-kill during format probing.
