title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  Fix out-of-bounds access for twsk in tcp_ao_established_key().\n\nlockdep_sock_is_held()
  was added in tcp_ao_established_key()\nby the cited commit.\n\nIt can be called
  from tcp_v[46]_timewait_ack() with twsk.\n\nSince it does not have sk->sk_lock,
  the lockdep annotation\nresults in out-of-bound access.\n\n  $ pahole -C tcp_timewait_sock
  vmlinux | grep size\n  \t/* size: 288, cachelines: 5, members: 8 */\n  $ pahole
  -C sock vmlinux | grep sk_lock\n  \tsocket_lock_t              sk_lock;        \
  \      /*   440   192 */\n\nLet's not use lockdep_sock_is_held() for TCP_TIME_WAIT."
