title: The Product Feed PRO for WooCommerce by AdTribes – Product Feeds for 
  WooCommerce plugin for WordPress is vulnerable to Cross-Site Request Forgery 
  in versions 13.4.6 through 13.5.2.1. This is due to missing or incorrect nonce
  validation on the ajax_migrate_to_custom_post_type, 
  ajax_adt_clear_custom_attributes_product_meta_keys, 
  ajax_update_file_url_to_lower_case, ajax_use_legacy_filters_and_rules, and 
  ajax_fix_duplicate_feed functions. This makes it possible for unauthenticated 
  attackers to trigger feed migration, clear custom-attribute transient caches, 
  rewrite feed file URLs to lowercase, toggle legacy filter and rule settings, 
  and delete duplicated feed posts via a forged request granted they can trick a
  site administrator into performing an action such as clicking on a link.
