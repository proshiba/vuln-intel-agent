title: The Firelight Lightbox plugin for WordPress is vulnerable to Stored DOM 
  Cross-Site Scripting in versions up to and including 2.3.20. This is due to 
  insufficient sanitization of the href attribute value within the FancyBox V2 
  PDF beforeLoad JavaScript callback generated in inc/fancybox-2.php, where 
  this.href is string-concatenated directly into an HTML string without 
  escaping, allowing a stored href containing entity-encoded double-quotes to 
  break out of the data attribute and inject arbitrary event handlers into the 
  DOM. This makes it possible for authenticated attackers with contributor-level
  access and above to inject arbitrary web scripts into pages that execute 
  whenever a user clicks the malicious PDF link.
