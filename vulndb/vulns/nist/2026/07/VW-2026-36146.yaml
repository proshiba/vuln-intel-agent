title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  af_key: initialize alg_key_len for IPComp states\n\npfkey_msg2xfrm_state() handles
  the IPComp (SADB_X_SATYPE_IPCOMP) case by\nallocating x->calg and copying only the
  algorithm name:\n\n\tx->calg = kmalloc_obj(*x->calg);\n\tif (!x->calg) {\n\t\terr
  = -ENOMEM;\n\t\tgoto out;\n\t}\n\tstrcpy(x->calg->alg_name, a->name);\n\tx->props.calgo
  = sa->sadb_sa_encrypt;\n\nUnlike the authentication (x->aalg) and encryption (x->ealg)
  branches of\nthe same function, the compression branch never initializes\ncalg->alg_key_len.\
  \  IPComp carries no key and the allocation only\nreserves sizeof(struct xfrm_algo)
  (i.e. no room for a key), so the field\nis left containing uninitialized slab data.\n\
  \ncalg->alg_key_len is later used as a length by xfrm_algo_clone() when an\nIPComp
  state is cloned during XFRM_MSG_MIGRATE:\n\n\txfrm_state_migrate()\n\t  xfrm_state_clone_and_setup()\n\
  \t    x->calg = xfrm_algo_clone(orig->calg);\n\t      kmemdup(orig, xfrm_alg_len(orig));\n\
  \nwhere "
