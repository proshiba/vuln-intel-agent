title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/intel:
  KVM: Mask PEBS_ENABLE loaded for guest with vCPU's value.\n\nWhen generating the
  MSR_IA32_PEBS_ENABLE value that will be loaded on\nVM-Entry to a KVM guest, mask
  the value with the vCPU's desired PEBS_ENABLE\nvalue.  Consulting only the host
  kernel's host vs. guest masks results in\nrunning the guest with PEBS enabled even
  when the guest doesn't want to use\nPEBS.  Because KVM uses perf events to proxy
  the guest virtual PMU, simply\nlooking at exclude_host can't differentiate between
  events created by host\nuserspace, and events created by KVM on behalf of the guest.\n\
  \nRunning the guest with PEBS unexpectedly enabled typically manifests as\ncrashes
  due to a near-infinite stream of #PFs.  E.g. if the guest hasn't\nwritten MSR_IA32_DS_AREA,
  the CPU will hit page faults on address '0' when\ntrying to record PEBS events.\n\
  \nThe issue is most easily reproduced by running `perf kvm top` from before\ncommit
