title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  handle SVC_GARBAGE during svc auth processing as auth error\n\ntianshuo han reported
  a remotely-triggerable crash if the client sends a\nkernel RPC server a specially
  crafted packet. If decoding the RPC reply\nfails in such a way that SVC_GARBAGE
  is returned without setting the\nrq_accept_statp pointer, then that pointer can
  be dereferenced and a\nvalue stored there.\n\nIf it's the first time the thread
  has processed an RPC, then that\npointer will be set to NULL and the kernel will
  crash. In other cases,\nit could create a memory scribble.\n\nThe server sunrpc
  code treats a SVC_GARBAGE return from svc_authenticate\nor pg_authenticate as if
  it should send a GARBAGE_ARGS reply. RFC 5531\nsays that if authentication fails
  that the RPC should be rejected\ninstead with a status of AUTH_ERR.\n\nHandle a
  SVC_GARBAGE return as an AUTH_ERROR, with a reason of\nAUTH_BADCRED instead of returning
  GARBAGE_ARGS in that case. This\nsidesteps "
