title: InvenTree is an Open Source Inventory Management System. Prior to 1.2.7 
  and 1.3.0, a non-staff authenticated user can elevate their account to a staff
  level via a POST request against their user account endpoint. The write 
  permissions on the API endpoint are improperly configured, allowing any user 
  to change their staff status. This vulnerability is fixed in 1.2.7 and 1.3.0.
