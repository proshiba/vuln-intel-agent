title: Kamaji is the Hosted Control Plane Manager for Kubernetes. Prior to 
  26.7.4-edge, the PostgreSQL and MySQL datastore drivers build DDL statements 
  by interpolating the user-supplied DataStoreUsername/DataStoreSchema directly 
  into SQL via fmt.Sprintf, without escaping identifiers. These fields have no 
  format validation, so a value containing a quote character breaks out of the 
  quoted identifier — SQL injection executed over Kamaji's root connection to 
  the shared datastore. etcd driver is not affected.This issue is fixed in 
  version 26.7.4-edge.
