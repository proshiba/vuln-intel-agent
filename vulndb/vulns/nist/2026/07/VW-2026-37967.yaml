title: "A stack-based buffer overflow vulnerability was found in the File Explorer
  on the ADM. The vulnerability occurs because user-controlled input is not properly
  validated before being decoded and copied into a fixed-size stack buffer. An authenticated
  attacker can exploit this issue to cause denial of service of the affected CGI process.
  Further impact may be possible depending on exploitability and runtime protections.\n\
  Affected products and versions include: from ADM 4.1.0 through ADM 4.3.3.RUN1 as
  well as from ADM 5.0.0 through ADM 5.1.3.RI81."
