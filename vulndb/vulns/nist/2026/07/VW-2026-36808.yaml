title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  bpa10x: avoid OOB read of revision string in bpa10x_setup()\n\nbpa10x_setup() sends
  the vendor command 0xfc0e and passes the response\nto bt_dev_info() and hci_set_fw_info()
  as a \"%s\" string starting at\nskb->data + 1, without checking the length:\n\n\t
  bt_dev_info(hdev, \"%s\", (char *)(skb->data + 1));\n\thci_set_fw_info(hdev, \"\
  %s\", skb->data + 1);\n\nA device that returns a one-byte response (status only)
  leaves\nskb->data + 1 past the end of the data, and the %s walk reads adjacent\n\
  slab memory until it meets a NUL. The same happens when the payload is\nnot NUL-terminated
  within skb->len. The out-of-bounds bytes end up in\nthe kernel log and the firmware-info
  debugfs file.\n\nPrint the revision string with a bounded \"%.*s\" limited to skb->len
  - 1\ninstead. This keeps the string readable for well-behaved devices while\nnever
  reading past the received data, and does not fail setup, so a\ndevice returning
  a short or unterminated"
