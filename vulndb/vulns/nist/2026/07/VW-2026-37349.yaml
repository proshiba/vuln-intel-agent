title: Grav Login Plugin versions before 3.8.13 contain an insufficient session 
  expiration vulnerability in TokenStorage.php where the findTriplet() method 
  fails to properly validate Remember Me token timestamps. Attackers with a 
  captured Remember Me cookie can authenticate indefinitely instead of the 
  configured timeout period, as the expiry check compares an array to a scalar 
  value which always evaluates incorrectly in PHP.
