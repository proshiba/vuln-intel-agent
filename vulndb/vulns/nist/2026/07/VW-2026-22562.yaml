title: Eclipse Grizzly in versions before 5.0.2, cannot properly parse the 
  trailer section in malformed trailer header's line, which can be leveraged to 
  perform HTTP request smuggling. Grizzly 5.0.1 supports system properties that 
  enable the behavior that fixes the vulnerability - set 
  org.glassfish.grizzly.http.STRICT_HEADER_NAME_VALIDATION_RFC_9110 and 
  org.glassfish.grizzly.http.STRICT_HEADER_VALUE_VALIDATION_RFC_9110 system 
  properties to "true".
