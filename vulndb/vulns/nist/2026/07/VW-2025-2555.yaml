title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  tmc: add the handle of the event to the path\n\nThe handle is essential for retrieving
  the AUX_EVENT of each CPU and is\nrequired in perf mode. It has been added to the
  coresight_path so that\ndependent devices can access it from the path when needed.\n\
  \nThe existing bug can be reproduced with:\nperf record -e cs_etm//k -C 0-9 dd if=/dev/zero
  of=/dev/null\n\nShowing an oops as follows:\nUnable to handle kernel paging request
  at virtual address 000f6e84934ed19e\n\nCall trace:\n tmc_etr_get_buffer+0x30/0x80
  [coresight_tmc] (P)\n catu_enable_hw+0xbc/0x3d0 [coresight_catu]\n catu_enable+0x70/0xe0
  [coresight_catu]\n coresight_enable_path+0xb0/0x258 [coresight]"
