title: CentreStack before 17.5 contains a hardcoded cryptographic key 
  vulnerability that allows unauthenticated attackers to forge arbitrary 
  encrypted tokens by exploiting a static SysNumber value used as entropy for 
  AccessTicket.Encrypt() and AccessTicket.Decrypt() across all installations. 
  Attackers can use the hardcoded key to craft valid x-glad-auth headers and 
  call privileged API endpoints such as acquiretenantbackuptoken to obtain a 
  domain administrator IdentityTicket, enabling a complete unauthenticated 
  remote code execution chain.
