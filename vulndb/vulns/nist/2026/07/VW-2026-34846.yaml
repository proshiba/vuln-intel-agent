title: A Business Logic vulnerability exists in SourceCodester Loan Management 
  System v1.0 due to improper server-side validation. The application allows 
  administrators to create "Loan Plans" with specific interest rates. While the 
  frontend interface prevents users from entering negative numbers, this 
  constraint is not enforced on the backend. An authenticated attacker can 
  bypass the client-side restriction by manipulating the HTTP POST request to 
  submit a negative value for the interest_percentage. This results in the 
  creation of loan plans with negative interest rates.
