title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  tuner: xc5000: Fix use-after-free in xc5000_release\n\nThe original code uses cancel_delayed_work()
  in xc5000_release(), which\ndoes not guarantee that the delayed work item timer_sleep
  has fully\ncompleted if it was already running. This leads to use-after-free scenarios\n\
  where xc5000_release() may free the xc5000_priv while timer_sleep is still\nactive
  and attempts to dereference the xc5000_priv.\n\nA typical race condition is illustrated
  below:\n\nCPU 0 (release thread)                 | CPU 1 (delayed work callback)\n\
  xc5000_release()                       | xc5000_do_timer_sleep()\n  cancel_delayed_work()\
  \                |\n  hybrid_tuner_release_state(priv)     |\n    kfree(priv)  \
  \                      |\n                                       |   priv = container_of()
  // UAF\n\nReplace cancel_delayed_work() with cancel_delayed_work_sync() to ensure\n\
  that the timer_sleep is properly canceled before the xc5000_priv memory\nis "
