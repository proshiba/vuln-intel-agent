title: Vendure through 3.7.1, fixed in commit f67ef5f, contains a cross-channel 
  authorization bypass vulnerability in stock-location.service.ts and 
  asset.service.ts update methods that allows channel-scoped administrators to 
  modify other tenants' data. Attackers can supply global IDs of StockLocation 
  or Asset entities from different channels to overwrite inventory locations or 
  catalog assets belonging to other tenants without proper channel isolation 
  validation.
