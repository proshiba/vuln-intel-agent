title: jq is a command-line JSON processor. In 1.8.1 and earlier, jv_contains 
  recurses into nested arrays/objects with no depth limit. With a sufficiently 
  nested input structure (built programmatically with reduce, since the JSON 
  parser caps at depth 10000), the C stack is exhausted.
