title: "A Cross-Site Scripting (XSS) vulnerability in Google Cloud Looker versions
  prior to 25.6.103, 25.12.65, 25.18.68, 26.0.66, 26.2.47, 26.4.36, 26.6.28, and 26.8.7
  on Looker-hosted and Self-hosted allows an attacker to execute arbitrary JavaScript
  leading to administrative account takeover using a maliciously crafted URL.\n\n\n\
  Looker-hosted and Self-hosted were found to be vulnerable.\nThis issue has already
  been mitigated for Looker-hosted instances. No user action is required for these.\n\
  \n\nSelf-hosted instances must be upgraded to the patched versions: 25.6.103+, 25.12.65+,
  25.18.68+, 26.0.66+, 26.2.47+, 26.4.36+, 26.6.28+, or 26.8.7+."
