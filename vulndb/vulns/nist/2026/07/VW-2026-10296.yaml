title: Attackers carefully craft malicious scripts, such as JavaScript, and 
  inject them into target systems; when other users access pages containing such
  malicious content, the scripts are automatically loaded and executed in the 
  victim's browser.Attackers can thereby steal user cookies, hijack session 
  privileges, and tamper with page content.Since the malicious code is stored 
  within the system, the attack scope is broad and the concealment is strong, 
  making it frequently employed for data theft attacks.
