title: "In SERVER mode, pgAdmin 4 enforces authentication per route via the @pga_login_required
  decorator; the application's before_request hook only handles desktop-mode auto-login
  and the Kerberos/Webserver-auth redirect, so any route shipped without the decorator
  is reachable without authentication (CWE-306). This is the same defect class previously
  fixed as CVE-2026-12046 (the sqleditor close/update_connection routes).\n\nA follow-up
  sweep, prompted by a report describing an incomplete fix for CVE-2026-12046, found
  further routes missing @pga_login_required: the Constraints blueprint's nodes and
  proplist (object listing) routes and its delete route (a state-mutating DELETE that
  removes table constraints); preferences.get_all_cli (GET, discloses all CLI-settable
  preference values); debugger.close (DELETE); and schema_diff.close (DELETE). An
  unauthenticated network client could therefore enumerate constraint metadata, delete
  table constraints, read preference values, and force-close debugger o"
