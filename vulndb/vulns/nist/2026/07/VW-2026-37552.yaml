title: "Autel MaxiCharger AC Elite Home NFC Stack-based Buffer Overflow Arbitrary
  Code Execution Vulnerability. This vulnerability allows physically present attackers
  to execute arbitrary code on affected installations of Autel MaxiCharger AC Elite
  Home EV chargers. Authentication is not required to exploit this vulnerability.\n\
  \nThe specific flaw exists within the handling of card responses via the NFC interface.
  A crafted card response can trigger an overflow of a fixed-length stack-based buffer.
  An attacker can leverage this vulnerability to execute code in the context of the
  device. Was ZDI-CAN-29044."
