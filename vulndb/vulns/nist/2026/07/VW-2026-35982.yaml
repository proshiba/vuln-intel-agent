title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  mms114 - fix touch indexing for MMS134S and MMS136\n\nThe MMS134S and MMS136 touch
  controllers have an event size of 6 bytes\nrather than 8 bytes. When __mms114_read_reg()
  reads the touch data\npacket from the device into the touch buffer, the events are
  packed\ntightly at 6-byte intervals. However, the driver iterates through the\n\
  events using standard C array indexing (touch[index]), where each\nelement is sizeof(struct
  mms114_touch) (8 bytes) apart. As a result, any\ntouch events beyond the first one
  are read from incorrect offsets and\nparsed improperly.\n\nFix this by explicitly
  calculating the byte offset for each touch event\nbased on the device's specific
  event size."
