title: "A flaw in Node.js Permission API can cause a file metadata to be modified
  even on a path that was set as read-only with e.g. `--allow-fs-read`.\r\n\r\nThis
  vulnerability affects all supported release lines: **Node.js 22**, **Node.js 24**,
  and **Node.js 26**."
