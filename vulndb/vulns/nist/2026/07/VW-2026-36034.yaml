title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  validate free block extents against the partition length\n\nudf_free_blocks() checks
  the logical block number and count against the\npartition length, but drops the
  extent offset from that final bound.  A\ncrafted extent can pass the guard while
  logicalBlockNum + offset + count\npoints past the partition, which later indexes
  past the space bitmap\narray.\n\nA single ftruncate(2) on a file backed by such
  an extent reliably\npanics the kernel.  This is a local availability issue.  On
  desktop\nsystems where UDisks/polkit allows the active user to mount removable\n\
  UDF media without CAP_SYS_ADMIN, an unprivileged local user can supply\nthe crafted
  filesystem and trigger the panic by truncating a writable\nfile on it.  Systems
  that require root or CAP_SYS_ADMIN to mount the\nimage have a higher prerequisite.\n\
  \nNo confidentiality or integrity impact is claimed: the reproduced\nprimitive is
  an out-of-bounds read of a bitmap pointer slot"
