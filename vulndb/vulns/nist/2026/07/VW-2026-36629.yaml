title: "The Erlang/OTP ssl TLS 1.2 (and earlier) and DTLS client does not verify that
  the cipher suite selected by the server in ServerHello was among the suites offered
  by the client in ClientHello. The client-side tls_handshake:hello/5 handler validates
  the negotiated protocol version and the downgrade sentinel but hands the server-chosen
  suite directly to ssl_handshake:handle_server_hello_extensions/9, which installs
  it without a membership check. The TLS 1.3 client path performs this check (per
  RFC 8446), so it is not affected.\n\nAn on-path attacker between the client and
  the intended server can respond with a ServerHello selecting an anonymous key exchange
  suite such as TLS_DH_anon_* or TLS_ECDH_anon_* that the client never offered. Anonymous
  suites do not require the server to present a certificate, so the entire verify_peer
  and cacerts configuration is bypassed: the attacker completes the handshake with
  its own ephemeral parameters, no certificate is validated, no hostname is checked,
