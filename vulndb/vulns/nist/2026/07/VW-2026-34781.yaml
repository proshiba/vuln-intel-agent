title: Parse Server is an open source backend that can be deployed to any 
  infrastructure that can run Node.js. Prior to versions 8.6.66 and 
  9.7.0-alpha.10, the GraphQL API endpoint does not respect the allowOrigin 
  server option and unconditionally allows cross-origin requests from any 
  website. This bypasses origin restrictions that operators configure to control
  which websites can interact with the Parse Server API. The REST API correctly 
  enforces the configured allowOrigin restriction. This issue has been patched 
  in versions 8.6.66 and 9.7.0-alpha.10.
