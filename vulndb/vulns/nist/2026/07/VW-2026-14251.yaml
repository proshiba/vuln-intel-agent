title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngreybus:
  gb-beagleplay: bound bootloader receive buffering\n\ncc1352_bootloader_rx() appends
  each serdev chunk into the fixed\nrx_buffer before parsing bootloader packets. The
  helper can keep\nleftover bytes between callbacks and may receive multiple packets
  in one\ncallback, so a single count value is not constrained by one packet\nlength.\n\
  \nCheck that the incoming chunk fits in the remaining receive buffer space\nbefore
  memcpy(). If it does not, drop the staged data and consume the\nbytes instead of
  overflowing rx_buffer."
