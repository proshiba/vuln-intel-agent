title: "In the Linux kernel, the following vulnerability has been resolved:\n\nethtool:
  cmis_cdb: use correct rpl size in ethtool_cmis_module_poll()\n\nrpl is passed as
  a pointer to ethtool_cmis_module_poll(), so the correct\nsize of rpl is sizeof(*rpl)
  which should be just 1 byte.  Using the\npointer size instead can cause stack corruption:\n\
  \nKernel panic - not syncing: stack-protector: Kernel stack is corrupted in: ethtool_cmis_wait_for_cond+0xf4/0x100\n\
  CPU: 72 UID: 0 PID: 4440 Comm: kworker/72:2 Kdump: loaded Tainted: G           OE\
  \      6.11.0 #24\nTainted: [O]=OOT_MODULE, [E]=UNSIGNED_MODULE\nHardware name:
  Dell Inc. PowerEdge R760/04GWWM, BIOS 1.6.6 09/20/2023\nWorkqueue: events module_flash_fw_work\n\
  Call Trace:\n <TASK>\n panic+0x339/0x360\n ? ethtool_cmis_wait_for_cond+0xf4/0x100\n\
  \ ? __pfx_status_success+0x10/0x10\n ? __pfx_status_fail+0x10/0x10\n __stack_chk_fail+0x10/0x10\n\
  \ ethtool_cmis_wait_for_cond+0xf4/0x100\n ethtool_cmis_cdb_execute_cmd+0x1fc/0x330\n\
  \ ? __pfx_status_fail+0x10/0x10\n cmis_cdb_module_fe"
