title: A flaw was found in libssh. During server-side GSSAPI key exchange, a 
  client-supplied Curve25519 public key shorter than the expected length is 
  copied without proper length validation, leading to an out-of-bounds heap 
  read. This could allow a remote unauthenticated attacker to disclose small 
  amounts of server memory.
