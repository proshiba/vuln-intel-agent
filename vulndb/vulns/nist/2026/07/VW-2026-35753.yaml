title: kcp is a Kubernetes-like control plane for form-factors and use-cases 
  beyond Kubernetes and container workloads. Prior to 0.30.3 and 0.29.3, the 
  cache server is directly exposed by the root shard and has no authentication 
  or authorization in place. This allows anyone who can access the root shard to
  read and write to the cache server. This vulnerability is fixed in 0.30.3 and 
  0.29.3.
