title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390:
  Revert support for DCACHE_WORD_ACCESS\n\nload_unaligned_zeropad() reads eight bytes
  from unaligned addresses and may\ncross page boundaries. It handles exceptions which
  may happen if reading\nfrom the second page results in an exception.\n\nFor pages
  which are donated to the Ultravisor for secure execution purposes\nthe do_secure_storage_access()
  exception handler however does not handle\nsuch exceptions correctly. Such an exception
  may result in an endless\nexception loop which will never be resolved.\n\nAn attempt
  to fix this [1] turned out to be not sufficient. For now revert\nload_unaligned_zeropad()
  until this problem has been resolved in a proper\nway.\n\nNote that the implementation
  of load_unaligned_zeropad() itself is\ncorrect. The revert is just a temporary workaround
  until there is complete\nfix for secure storage access exceptions.\n\n[1] commit
  b00be77302d7 (\"s390/mm: Add missing secure storage access fixups for donat"
