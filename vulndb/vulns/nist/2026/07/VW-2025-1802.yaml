title: A vulnerability was determined in YunaiV yudao-cloud up to 2025.11. This 
  affects the function BpmHttpCallbackTrigger/BpmSyncHttpRequestTrigger of the 
  component Business Process Management. Executing manipulation of the argument 
  url/header/body can lead to server-side request forgery. The attack may be 
  performed from remote. The exploit has been publicly disclosed and may be 
  utilized. The vendor was contacted early about this disclosure but did not 
  respond in any way.
