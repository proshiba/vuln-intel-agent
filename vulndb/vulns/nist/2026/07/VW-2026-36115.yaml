  hci_conn: Fix null ptr deref in hci_abort_conn()\n\nhci_abort_conn() read hci_skb_event(hdev->sent_cmd)
  when a connection\nwas pending, but hdev->sent_cmd can be NULL while req_status
  is still\nHCI_REQ_PEND, leading to a NULL pointer dereference and a general\nprotection
  fault from the hci_rx_work() receive path.\n\nInstead of inspecting hdev->sent_cmd,
  track the in-flight create\nconnection command with a new per-connection HCI_CONN_CREATE
