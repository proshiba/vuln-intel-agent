title: RedwoodSDK is a server-first React framework. From 1.0.0-beta.50 to 
  1.0.5, erver functions exported from "use server" files could be invoked via 
  GET requests, bypassing their intended HTTP method. In cookie-authenticated 
  applications, this allowed cross-site GET navigations to trigger 
  state-changing functions, because browsers send SameSite=Lax cookies on 
  top-level GET requests. This affected all server functions -- both 
  serverAction() handlers and bare exported functions in "use server" files. 
  This vulnerability is fixed in 1.0.6.
