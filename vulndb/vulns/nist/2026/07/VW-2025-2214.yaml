title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  Fix the smbd_response slab to allow usercopy\n\nThe handling of received data in
  the smbdirect client code involves using\ncopy_to_iter() to copy data from the smbd_reponse
  struct's packet trailer\nto a folioq buffer provided by netfslib that encapsulates
  a chunk of\npagecache.\n\nIf, however, CONFIG_HARDENED_USERCOPY=y, this will result
  in the checks\nthen performed in copy_to_iter() oopsing with something like the
  following:\n\n CIFS: Attempting to mount //172.31.9.1/test\n CIFS: VFS: RDMA transport
  established\n usercopy: Kernel memory exposure attempt detected from SLUB object
  'smbd_response_0000000091e24ea1' (offset 81, size 63)!\n ------------[ cut here
  ]------------\n kernel BUG at mm/usercopy.c:102!\n ...\n RIP: 0010:usercopy_abort+0x6c/0x80\n\
  \ ...\n Call Trace:\n  <TASK>\n  __check_heap_object+0xe3/0x120\n  __check_object_size+0x4dc/0x6d0\n\
  \  smbd_recv+0x77f/0xfe0 [cifs]\n  cifs_readv_from_socket+0x276/0x8f0 [cifs]\n \
  \ cifs_read_"
