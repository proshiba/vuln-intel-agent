title: Botan is a C++ cryptography library. Prior to version 3.11.1, the TLS 1.3
  implementation allowed ApplicationData records to be processed prior to the 
  Finished message being received. A server which is attempting to enforce 
  client authentication via certificates can by bypassed by a client which 
  entirely omits Certificate, CertificateVerify, and the Finished message and 
  instead sends application data records. This vulnerability is fixed in 3.11.1.
