title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: Fix DMA fence leak\n\nIn ffs_dmabuf_transfer(), a ffs_dma_fence object
  is kmalloc'd, with the\nunderlying dma_fence later initialized by dma_fence_init(),
  which sets\nits kref counter to 1. Then, dma_resv_add_fence() gets a second\nreference,
  and a pointer to the ffs_dma_fence is passed as the\nusb_request's \"context\" field.\n\
  \nThe dma-resv mechanism will manage the second reference, but the first\nreference
  is never properly released; the ffs_dmabuf_cleanup() function\ndecreases the reference
  count, but only to balance with the reference\ngrab in ffs_dmabuf_signal_done().\n\
  \nThe code will then slowly leak memory as more ffs_dma_fence objects are\ncreated
  without being ever freed.\n\nAddress this issue by transferring ownership of the
  fence to the DMA\nreservation object, by calling dma_fence_put() right after\ndma_resv_add_fence().
  The ffs_dma_fence then gets properly discarded\nafter being signalled."
