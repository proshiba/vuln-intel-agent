title: "DBI versions before 1.648 for Perl saved errors in a limited-sized buffer.\n\
  \nError messages that were returned when RaiseError, PrintError or HandleError were
  set were written to a 200-byte buffer without a length limit.\n\nAttackers that
  can influence the error text in an application can trigger a buffer overflow."
