title: "The MASTER_PASSWORD_HOOK setting, introduced in pgAdmin 4 7.2, lets an administrator
  configure an external command that returns a per-user encryption key, with %u in
  the configured string replaced by the current user's name. The previous implementation
  substituted the username directly into the command string and executed the result
  with subprocess.Popen(..., shell=True). Because the username can originate from
  an external authentication source (OAuth/OIDC claims, Kerberos, webserver auth)
  rather than a value pgAdmin fully controls, a username containing shell metacharacters
  (';', '$()', backticks, pipes, '&&', newlines) allowed an authenticated user to
  execute arbitrary commands as the pgAdmin service account in any deployment where
  the configured hook string uses %u.\n\nFix tokenises the trusted, administrator-configured
  hook string into an argument vector first (using shlex in POSIX-quoting mode, with
  backslash-escaping disabled so Windows-style paths are not mis-parsed), substitutes "
