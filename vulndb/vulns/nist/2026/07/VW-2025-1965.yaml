title: "In the Linux kernel, the following vulnerability has been resolved:\n\njfs:
  Prevent copying of nlink with value 0 from disk inode\n\nsyzbot report a deadlock
  in diFree. [1]\n\nWhen calling \"ioctl$LOOP_SET_STATUS64\", the offset value passed
  in is 4,\nwhich does not match the mounted loop device, causing the mapping of the\n\
  mounted loop device to be invalidated.\n\nWhen creating the directory and creating
  the inode of iag in diReadSpecial(),\nread the page of fixed disk inode (AIT) in
  raw mode in read_metapage(), the\nmetapage data it returns is corrupted, which causes
  the nlink value of 0 to be\nassigned to the iag inode when executing copy_from_dinode(),
  which ultimately\ncauses a deadlock when entering diFree().\n\nTo avoid this, first
  check the nlink value of dinode before setting iag inode.\n\n[1]\nWARNING: possible
  recursive locking detected\n6.12.0-rc7-syzkaller-00212-g4a5df3796467 #0 Not tainted\n\
  --------------------------------------------\nsyz-executor301/5309 is trying to
  acquire lock:\nffff88804454"
