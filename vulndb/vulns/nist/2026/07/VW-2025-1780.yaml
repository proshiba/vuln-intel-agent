title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Always pass in an error pointer to __sev_platform_shutdown_locked()\n\nWhen\n\
  \n  9770b428b1a2 (\"crypto: ccp - Move dev_info/err messages for SEV/SNP init and
  shutdown\")\n\nmoved the error messages dumping so that they don't need to be issued
  by\nthe callers, it missed the case where __sev_firmware_shutdown() calls\n__sev_platform_shutdown_locked()
  with a NULL argument which leads to\na NULL ptr deref on the shutdown path, during
  suspend to disk:\n\n  #PF: supervisor read access in kernel mode\n  #PF: error_code(0x0000)
  - not-present page\n  PGD 0 P4D 0\n  Oops: Oops: 0000 [#1] SMP NOPTI\n  CPU: 0 UID:
  0 PID: 983 Comm: hib.sh Not tainted 6.17.0-rc4+ #1 PREEMPT(voluntary)\n  Hardware
  name: Supermicro Super Server/H12SSL-i, BIOS 2.5 09/08/2022\n  RIP: 0010:__sev_platform_shutdown_locked.cold+0x0/0x21
  [ccp]\n\nThat rIP is:\n\n  00000000000006fd <__sev_platform_shutdown_locked.cold>:\n\
  \   6fd:   8b 13                   mov    (%rbx"
