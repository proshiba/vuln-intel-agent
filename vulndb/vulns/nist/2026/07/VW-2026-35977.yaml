title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  avoid 32-bit prune notification count wrap\n\nFUSE_NOTIFY_PRUNE validates the nodeid
  payload length with:\n\n    size - sizeof(outarg) != outarg.count * sizeof(u64)\n\
  \nOn 32-bit kernels, size_t is also 32 bits, so the daemon-controlled\ncount multiplication
  can wrap.  A prune notification with count\n0x20000000 and no nodeid payload passes
  the check, enters the copy\nloop, and asks the device copy path to read nodeids
  that are not\npresent in the userspace write buffer.  In QEMU this reaches the\n\
  fuse_copy_fill() BUG_ON(!err) path.\n\nValidate the payload length with array_size()
  instead.  That accepts\nexactly the same valid messages, but avoids wrapping arithmetic
  before\nthe copy loop consumes the count."
