title: PraisonAI is a multi-agent teams system. Prior to 4.5.115, the 
  create_agent_centric_tools() function returns tools (like acp_create_file) 
  that process file content using template rendering. When user input from 
  agent.start() is passed directly into these tools without escaping, template 
  expressions in the input are executed rather than treated as literal text. 
  This vulnerability is fixed in 4.5.115.
