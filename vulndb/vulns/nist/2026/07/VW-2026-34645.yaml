title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  bla: fix report_work leak on backbone_gw purge\n\nbatadv_bla_purge_backbone_gw()
  removes stale backbone gateway entries,\nbut fails to properly handle their associated
  report_work:\n\n- If report_work is running, the purge must wait for it to finish
  before\n  freeing the backbone_gw, otherwise the worker may access freed memory\n\
  \  (e.g. bat_priv).\n- If report_work is pending, the purge must cancel it and release
  the\n  reference held for that pending work item.\n\nThe previous implementation
  called hlist_for_each_entry_safe() inside a\nspin_lock_bh() section, but cancel_work_sync()
  may sleep and therefore\ncannot be called from within a spinlock-protected region.\n\
  \nRestructure the loop to handle one entry per spinlock critical section:\nacquire
  the lock, find the next entry to purge, remove it from the hash\nlist, then release
  the lock before calling cancel_work_sync() and\ndropping the hash_entry reference.
