title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Fix suspicious RCU usage\n\nCommit <d74169ceb0d2> (\"iommu/vt-d: Allocate DMAR fault
  interrupts\nlocally\") moved the call to enable_drhd_fault_handling() to a code\n\
  path that does not hold any lock while traversing the drhd list. Fix\nit by ensuring
  the dmar_global_lock lock is held when traversing the\ndrhd list.\n\nWithout this
  fix, the following warning is triggered:\n =============================\n WARNING:
  suspicious RCU usage\n 6.14.0-rc3 #55 Not tainted\n -----------------------------\n\
  \ drivers/iommu/intel/dmar.c:2046 RCU-list traversed in non-reader section!!\n \
  \              other info that might help us debug this:\n               rcu_scheduler_active
  = 1, debug_locks = 1\n 2 locks held by cpuhp/1/23:\n #0: ffffffff84a67c50 (cpu_hotplug_lock){++++}-{0:0},
  at: cpuhp_thread_fun+0x87/0x2c0\n #1: ffffffff84a6a380 (cpuhp_state-up){+.+.}-{0:0},
  at: cpuhp_thread_fun+0x87/0x2c0\n stack backtrace:\n CPU: 1 UID: 0 PID: 23 Comm"
