title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  vme_user: bound slave read/write to the kern_buf size\n\nThe SLAVE-path helpers
  buffer_to_user() and buffer_from_user() copy\n'count' bytes into/out of the fixed-size
  kern_buf (size_buf ==\nPCI_BUF_SIZE == 0x20000, 128 KiB) using *ppos as the offset,
  without\nbounding *ppos + count against size_buf.\n\nvme_user_write()/vme_user_read()
  only clamp count to the VME window size\n(image_size = vme_get_size(resource)),
  which VME_SET_SLAVE sets from the\nuser-supplied slave.size -- validated against
  the VME address space (up\nto VME_A32_MAX = 4 GiB), not against PCI_BUF_SIZE.  When
  the window\nexceeds 128 KiB, a write()/read() copies past the kern_buf allocation.\n\
  \nClamp count against size_buf in both helpers, with an early return when\n*ppos
  is already at/after the buffer end.  *ppos is >= 0 here (the caller\nrejects negative
  offsets), so size_buf - *ppos cannot wrap.  This mirrors\nthe existing clamp in
  the MASTER-path helpers r"
