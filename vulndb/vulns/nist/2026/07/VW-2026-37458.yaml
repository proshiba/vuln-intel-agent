title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncaif:
  fix integer underflow in cffrml_receive()\n\nThe cffrml_receive() function extracts
  a length field from the packet\nheader and, when FCS is disabled, subtracts 2 from
  this length without\nvalidating that len >= 2.\n\nIf an attacker sends a malicious
  packet with a length field of 0 or 1\nto an interface with FCS disabled, the subtraction
  causes an integer\nunderflow.\n\nThis can lead to memory exhaustion and kernel instability,
  potential\ninformation disclosure if padding contains uninitialized kernel memory.\n\
  \nFix this by validating that len >= 2 before performing the subtraction."
