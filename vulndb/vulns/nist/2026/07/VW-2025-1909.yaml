title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  xhci: Apply the link chain quirk on NEC isoc endpoints\n\nTwo clearly different
  specimens of NEC uPD720200 (one with start/stop\nbug, one without) were seen to
  cause IOMMU faults after some Missed\nService Errors. Faulting address is immediately
  after a transfer ring\nsegment and patched dynamic debug messages revealed that
  the MSE was\nreceived when waiting for a TD near the end of that segment:\n\n[ 1.041954]
  xhci_hcd: Miss service interval error for slot 1 ep 2 expected TD DMA ffa08fe0\n\
  [ 1.042120] xhci_hcd: AMD-Vi: Event logged [IO_PAGE_FAULT domain=0x0005 address=0xffa09000
  flags=0x0000]\n[ 1.042146] xhci_hcd: AMD-Vi: Event logged [IO_PAGE_FAULT domain=0x0005
  address=0xffa09040 flags=0x0000]\n\nIt gets even funnier if the next page is a ring
  segment accessible to\nthe HC. Below, it reports MSE in segment at ff1e8000, plows
  through a\nzero-filled page at ff1e9000 and starts reporting events for TRBs in\n\
  page at ff1ea000 eve"
