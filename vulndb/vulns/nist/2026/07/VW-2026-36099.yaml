title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate NTLMv2 response before updating session key\n\nksmbd_auth_ntlmv2() derives
  the NTLMv2 session key into\nsess->sess_key before it verifies the NTLMv2 response.\n\
  ksmbd_decode_ntlmssp_auth_blob() then continues into KEY_XCH even\nwhen ksmbd_auth_ntlmv2()
  failed.\n\nWith SMB3 multichannel binding, the failed authentication operates on\n\
  an existing session and the session setup error path does not expire\nbinding sessions.
  A client can send a binding session setup with a\nbad NT proof and KEY_XCH and still
  modify sess->sess_key before\nSTATUS_LOGON_FAILURE is returned.\n\nRelevant path:\n\
  \n  smb2_sess_setup()\n    -> conn->binding = true\n    -> ntlm_authenticate()\n\
  \       -> session_user()\n       -> ksmbd_decode_ntlmssp_auth_blob()\n        \
  \  -> ksmbd_auth_ntlmv2()\n             -> calc_ntlmv2_hash()\n             -> hmac_md5_usingrawkey(...,
  sess->sess_key)\n             -> crypto_memneq() returns mismatch\n          ->
  KEY_XCH"
