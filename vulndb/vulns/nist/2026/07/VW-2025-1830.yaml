title: "In the Linux kernel, the following vulnerability has been resolved:\n\npfcp:
  Destroy device along with udp socket's netns dismantle.\n\npfcp_newlink() links
  the device to a list in dev_net(dev) instead\nof net, where a udp tunnel socket
  is created.\n\nEven when net is removed, the device stays alive on dev_net(dev).\n\
  Then, removing net triggers the splat below. [0]\n\nIn this example, pfcp0 is created
  in ns2, but the udp socket is\ncreated in ns1.\n\n  ip netns add ns1\n  ip netns
  add ns2\n  ip -n ns1 link add netns ns2 name pfcp0 type pfcp\n  ip netns del ns1\n\
  \nLet's link the device to the socket's netns instead.\n\nNow, pfcp_net_exit() needs
  another netdev iteration to remove\nall pfcp devices in the netns.\n\npfcp_dev_list
  is not used under RCU, so the list API is converted\nto the non-RCU variant.\n\n\
  pfcp_net_exit() can be converted to .exit_batch_rtnl() in net-next.\n\n[0]:\nref_tracker:
  net notrefcnt@00000000128b34dc has 1/1 users at\n     sk_alloc (./include/net/net_namespace.h:345
  net/core/sock.c:2236)\n   "
