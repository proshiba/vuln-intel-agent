title: NoteGen before 0.32.0 renders AI chat responses with markdown-it 
  configured with html:true and injects the result into the DOM via 
  dangerouslySetInnerHTML in chat-preview, without HTML sanitization and with 
  CSP set to null. Attacker-controlled content that reaches the model prompt 
  (for example a malicious skill REFERENCE.md that instructs the model to emit 
  HTML) can cause the model response to include executable markup such as an img
  onerror handler. When the user views the chat response, that markup runs as 
  JavaScript in the privileged Tauri webview, enabling arbitrary script 
  execution in the application context (cross-site scripting).
