title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Do not initialize SNP for ioctl(SNP_CONFIG)\n\nSashiko notes:\n\n> if SEV
  initialization fails and KVM is actively running normal VMs, could a\n> userspace
  process trigger this code path via /dev/sev ioctls (e.g.,\n> SEV_PDH_GEN) and zero
  out MSR_VM_HSAVE_PA globally? Would the next VMRUN\n> execution for an active VM
  trigger a general protection fault and crash the\n> host?\n\nRefuse to re-try initialization
  if SNP is not already initialized for\nSNP_CONFIG.\n\nThis is technically an ABI
  break: before if SNP initialization failed it\ncould be transparently retriggered
  by this ioctl, and if no VMs were\nrunning, everything worked fine. Hopefully this
  is enough of a corner case\nthat nobody will notice, but someone does, there are
  a few options:\n\n* do something like symbol_get() for kvm and refuse to initialize
