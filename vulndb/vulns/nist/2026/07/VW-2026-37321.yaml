title: "An out-of-bounds write vulnerability was found in the BFD library's DLX ELF
  backend (bfd/elf32-dlx.c) in GNU binutils. The dlx_rtype_to_howto() function maps
  ELF relocation types to internal howto structures but fails to perform adequate
  bounds checking on attacker-controlled relocation type values (via ELF32_R_TYPE(r_info))
  before indexing into the dlx_elf_howto_table[] array. The DLX relocation type number
  space is non-contiguous (basic types 0-6, extended types at 0x10000+), but the default
  case in the switch statement allows arbitrary index values to reach the array access.\n\
  \nA specially crafted ELF/DLX object file can trigger this out-of-bounds write when
  processed by any BFD-consuming tool (objdump, readelf, strip, ld, nm, objcopy).
  The vulnerability has been demonstrated to achieve arbitrary code execution via
  a File Stream Oriented Programming (FSOP) attack against glibc FILE structures (stderr),
  redirecting control flow to system().\n\nAttack scenarios include CI/CD pipelines
