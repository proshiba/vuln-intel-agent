title: TinyWeb through 0.0.8 contains a null pointer dereference vulnerability 
  that allows unauthenticated remote attackers to crash worker processes by 
  sending a malformed HTTP request line with an invalid version string. The 
  HttpParser::execute() function fails to allocate the Url object when version 
  parsing fails, leaving the url pointer NULL, and buildResponse() subsequently 
  dereferences this NULL pointer without checking the valid_requ flag, producing
  a SIGSEGV that terminates the worker process and, when repeated across all 
  workers, takes the server permanently offline until manually restarted.
