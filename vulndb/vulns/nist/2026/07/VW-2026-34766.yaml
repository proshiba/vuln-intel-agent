title: OpenClaw before 2026.3.28 contains a privilege escalation vulnerability 
  in the /pair approve command path that fails to forward caller scopes into the
  core approval check. A caller with pairing privileges but without admin 
  privileges can approve pending device requests asking for broader scopes 
  including admin access by exploiting the missing scope validation in 
  extensions/device-pair/index.ts and src/infra/device-pairing.ts.
