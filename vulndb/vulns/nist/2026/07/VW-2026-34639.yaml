title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: mld: don't dereference a pointer before NULL checking it\n\nIn iwl_mld_remove_link,
  the link->fw_id is saved at the beginning of the\nfunction so we have it after we
  freed the link.\n\nBut the link pointer can be NULL, and is not checked when the
  fw_id is\nstored.\n\nFix it by simply freeing the link at the end of the function.\n\
  \nfFixes: 0e66a39f4f0e (\"wifi: iwlwifi: fix potential use after free in iwl_mld_remove_link()\"\
  )"
