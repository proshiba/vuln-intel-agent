title: A vulnerability was determined in huimeicloud hm_editor up to 2.2.3. 
  Impacted is the function client.get of the file src/mcp-server.js of the 
  component image-to-base64 Endpoint. Executing a manipulation of the argument 
  url can lead to server-side request forgery. It is possible to launch the 
  attack remotely. The exploit has been publicly disclosed and may be utilized. 
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
