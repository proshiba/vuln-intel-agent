title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/md-bitmap:
  fix wrong bitmap_limit for clustermd when write sb\n\nIn clustermd, separate write-intent-bitmaps
  are used for each cluster\nnode:\n\n0                    4k                    \
  \ 8k                    12k\n-------------------------------------------------------------------\n\
  | idle                | md super            | bm super [0] + bits |\n| bm bits[0,
  contd]   | bm super[1] + bits  | bm bits[1, contd]   |\n| bm super[2] + bits  |
  bm bits [2, contd]  | bm super[3] + bits  |\n| bm bits [3, contd]  |           \
  \          |                     |\n\nSo in node 1, pg_index in __write_sb_page()
  could equal to\nbitmap->storage.file_pages. Then bitmap_limit will be calculated
  to\n0. md_super_write() will be called with 0 size.\nThat means the first 4k sb
  area of node 1 will never be updated\nthrough filemap_write_page().\nThis bug causes
