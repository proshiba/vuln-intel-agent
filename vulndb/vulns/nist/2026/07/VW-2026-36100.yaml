title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  track the connection owning a byte-range lock\n\nSMB2_LOCK adds each granted byte-range
  lock to both the file lock list\nand the lock list of the connection which handled
  the request.  The\nfinal close and durable handle paths, however, remove the connection\n\
  list entry while holding fp->conn->llist_lock.\n\nWith SMB3 multichannel, the connection
  handling the LOCK request can be\ndifferent from the connection which opened the
  file.  The entry can\ntherefore be removed under a different spinlock from the one
  protecting\nthe list it belongs to.  A concurrent traversal can then access freed\n\
  struct ksmbd_lock and struct file_lock objects.\n\nRecord the connection owning
  each lock's clist entry and hold a\nreference to it while the entry is linked. \
  \ Use that connection and its\nllist_lock for unlock, rollback, close, and durable
  preserve.  Durable\nreconnect assigns the new connection as the owner when publishing
  the\nlocks again."
