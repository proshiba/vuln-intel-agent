title: Kamailio is an open source implementation of a SIP Signaling Server. 
  Prior to 6.0.5 and 5.8.7, an out-of-bounds read in the auth module of Kamailio
  (formerly OpenSER and SER) allows remote attackers to cause a denial of 
  service (process crash) via a specially crafted SIP packet if a successful 
  user authentication without a database backend is followed by additional user 
  identity checks. This vulnerability is fixed in 6.0.5 and 5.8.7.
