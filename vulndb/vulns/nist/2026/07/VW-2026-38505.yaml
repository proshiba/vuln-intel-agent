title: Serendipity before 2.6.1 contains an open redirect vulnerability in 
  exit.php that allows unauthenticated attackers to redirect users to arbitrary 
  external sites by supplying a malicious Base64-encoded url parameter when the 
  Track Exits plugin is configured with commentredirection set to s9y. Attackers
  can craft trusted-looking URLs leveraging the legitimate blog domain to 
  conduct phishing, deliver malware, or bypass URL reputation filters.
