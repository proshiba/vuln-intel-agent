title: PraisonAI before 1.6.78 caches tool approval decisions by tool name only,
  allowing attackers to reuse initial approvals for subsequent calls with 
  arbitrary arguments. Attackers can exploit this by obtaining approval for a 
  benign operation and then executing dangerous file write operations with 
  unreviewed parameters in the same session.
