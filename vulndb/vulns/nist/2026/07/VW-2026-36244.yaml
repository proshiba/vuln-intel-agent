title: "In Zephyr's userspace dynamic-objects subsystem, thread_idx_alloc() in kernel/userspace/userspace.c
  allocated a new thread permission index from the global _thread_idx_map[] bitmap
  without holding lists_lock.\n\nOn SMP systems, two user-mode threads invoking the
  k_object_alloc(K_OBJ_THREAD) syscall concurrently can both observe the same low
  free bit, perform the same non-atomic RMW to clear it, and return the identical
  tidx.\n\nThe two newly created K_OBJ_THREAD objects are then assigned the same thread_id,
  so the two user threads alias a single bit position in every kernel object's perms[]
  bitfield: any subsequent grant of access on a kernel object to one thread is implicitly
  a grant to the other, defeating userspace ACL isolation. A secondary lost-update
  window between the unlocked &=~BIT() in alloc and the locked |= BIT() in thread_idx_free()
  can also leak entries from the thread-index pool.\n\nThe defect is reachable from
  any user-mode thread via the unrestricted __syscall k_object_alloc"
