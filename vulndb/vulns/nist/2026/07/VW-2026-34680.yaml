title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkernel/fork:
  clear PF_BLOCK_TS in copy_process()\n\nPF_BLOCK_TS is only set in blk_time_get_ns()
  when current->plug is\nnon-NULL, and blk_finish_plug() clears it via __blk_flush_plug()\n\
  before NULLing the plug pointer.  copy_process() breaks the\ninvariant by inheriting
  PF_BLOCK_TS from the parent while resetting\nthe child's plug to NULL.\n\nClear
  PF_BLOCK_TS alongside that assignment so callers can rely on\n\"PF_BLOCK_TS set
  implies current->plug != NULL\" and dereference\ncurrent->plug unguarded."
