title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm:
  Fix freeing of PMD-sized vmemmap pages\n\nCommit bf9e4e30f353 (\"x86/mm: use pagetable_free()\"\
  ), switched from\nfreeing non-boot page tables through __free_pages() to\npagetable_free().\n\
  \nHowever, the function is also called to free vmemmap pages.\n\nGiven that vmemmap
  pages are not page tables, already the page_ptdesc(page)\nis wrong. But worse, pagetable_free()
  calls:\n\n\t__free_pages(page, compound_order(page));\n\nSince vmemmap pages are
  not compound pages (see vmemmap_alloc_block())\n-- except for HVO, which doesn't
  apply here -- only first page of a\nPMD-sized vmemmap page is freed, leaking the
  other ones.\n\nFix it by properly decoupling pagetable and vmemmap freeing.\nfree_pagetable()
  no longer has to mess with SECTION_INFO, as only the\nvmemmap is marked like that
  in register_page_bootmem_memmap().\n\nThe indentation in remove_pmd_table() is messed
  up. Fix that while\ntouching it.\n\nBootmem info handling will soon be fixed "
