title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  ch341: fix memory leaks on probe failures\n\nMake sure to deregister the controller,
  disable pins, and kill and free\nthe RX URB on probe failures to mirror disconnect
  and avoid memory\nleaks and use-after-free.\n\nAlso add an explicit URB kill on
  disconnect for symmetry (even if that\nis not strictly required as USB core would
  have stopped it in the\ncurrent setup)."
