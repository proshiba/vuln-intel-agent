title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ipv4: bound TCP reordering sysctl writes and MTU probe sizes\n\nReject invalid `net.ipv4.tcp_reordering`
  values before they reach TCP\nsocket state. The sysctl is stored as an `int` but
  copied into the\n`u32` `tp->reordering` field for new sockets, so negative writes
  wrap\nto large values.\n\nWith `tcp_mtu_probing=2`, the wrapped value can overflow
  the\n`tcp_mtu_probe()` size calculation and drive the MTU probing path into\nan
  out-of-bounds read. Route `tcp_reordering` writes through\n`proc_dointvec_minmax()`
  and require it to be at least 1. Also require\n`tcp_max_reordering` to be at least
  1 so the configured maximum cannot\nbecome negative either.\n\nWhen registering
  the table for a non-init network namespace, relocate\n`extra2` pointers that refer
  into `init_net.ipv4` so the\n`tcp_reordering` upper bound follows that namespace's\n\
  `tcp_max_reordering`.\n\nHarden `tcp_mtu_probe()` itself by computing `size_needed`
  as `u64`.\nThis k"
