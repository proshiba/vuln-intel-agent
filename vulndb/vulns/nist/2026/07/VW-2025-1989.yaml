title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  fprobe events: Fix possible UAF on modules\n\nCommit ac91052f0ae5 (\"tracing: tprobe-events:
  Fix leakage of module\nrefcount\") moved try_module_get() from __find_tracepoint_module_cb()\n\
  to find_tracepoint() caller, but that introduced a possible UAF\nbecause the module
  can be unloaded before try_module_get(). In this\ncase, the module object should
  be freed too. Thus, try_module_get()\ndoes not only fail but may access to the freed
  object.\n\nTo avoid that, try_module_get() in __find_tracepoint_module_cb()\nagain."
