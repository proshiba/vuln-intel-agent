title: The Everest Forms plugin for WordPress is vulnerable to PHP Object 
  Injection in all versions up to, and including, 3.4.3 via deserialization of 
  untrusted input from form entry metadata. This is due to the 
  html-admin-page-entries-view.php file calling PHP's native unserialize() on 
  stored entry meta values without passing the allowed_classes parameter. This 
  makes it possible for unauthenticated attackers to inject a serialized PHP 
  object payload through any public Everest Forms form field. The payload 
  survives sanitize_text_field() sanitization (serialization control characters 
  are not stripped) and is stored in the wp_evf_entrymeta database table. When 
  an administrator views entries or views an individual entry, the unsafe 
  unserialize() call processes the stored data without class restrictions.
