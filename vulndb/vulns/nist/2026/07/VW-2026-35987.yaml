title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - bound the F3A keymap to the GPIO count\n\nrmi_f3a_initialize()
  takes the GPIO count from the device query register\n(f3a->gpio_count = buf & RMI_F3A_GPIO_COUNT,
  range 0..127).\nrmi_f3a_map_gpios() then allocates gpio_key_map with\nmin(gpio_count,
  TRACKSTICK_RANGE_END) == at most 6 entries, but\nrmi_f3a_attention() iterates the
  full gpio_count and dereferences\ngpio_key_map[i], and input->keycodemax is set
  to the full gpio_count\nwhile input->keycode points at the 6-entry allocation.\n\
  \nA device that reports gpio_count > 6 therefore causes an out-of-bounds\nread of
  gpio_key_map[] on every attention interrupt, and out-of-bounds\naccesses through
  the input core's default keymap ioctls: EVIOCGKEYCODE\nreads past the buffer (leaking
  adjacent slab memory to user space) and\nEVIOCSKEYCODE writes a caller-controlled
  value past it, for any process\nable to open the evdev node, since input_default_getkeycode()
  and\ninpu"
