title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring:
  fix incorrect io_kiocb reference in io_link_skb\n\nIn io_link_skb function, there
  is a bug where prev_notif is incorrectly\nassigned using 'nd' instead of 'prev_nd'.
  This causes the context\nvalidation check to compare the current notification with
  itself instead\nof comparing it with the previous notification.\n\nFix by using
  the correct prev_nd parameter when obtaining prev_notif."
