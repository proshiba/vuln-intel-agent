title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix potential UAF in netfs_unlock_abandoned_read_pages()\n\nnetfs_unlock_abandoned_read_pages(rreq)
  accesses the index of the folios it\nis wanting to unlock and compares that to rreq->no_unlock_folio
  so that it\ndoesn't unlock a folio being read for netfs_perform_write() or\nnetfs_write_begin().\n\
  \nHowever, given that netfs_unlock_abandoned_read_pages() is called _after_\nNETFS_RREQ_IN_PROGRESS
  is cleared, the one folio that it's not allowed to\ndereference is the one specified
  by ->no_unlock_folio as ownership\nimmediately reverts to the caller.\n\nFix this
  by storing the folio pointer instead and using that rather than\nthe index.  Also
  fix netfs_unlock_read_folio() where the same applies."
