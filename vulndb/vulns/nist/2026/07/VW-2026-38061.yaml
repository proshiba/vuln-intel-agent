title: A flaw was found in koku-metrics-operator. The operator's 
  CostManagementMetricsConfig custom resource allows user able to edit the CR to
  specify an arbitrary upload URL. When authentication.type is set to token (the
  default), the cluster-global Red Hat Cloud pull-secret bearer token is 
  attached to HTTP requests sent to this user-controlled URL, allowing the 
  attacker to obtain the token.
