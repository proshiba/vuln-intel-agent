title: The Minify HTML plugin for WordPress is vulnerable to Cross-Site Request 
  Forgery in all versions up to, and including, 2.1.12. This is due to missing 
  or incorrect nonce validation on the 'minify_html_menu_options' function. This
  makes it possible for unauthenticated attackers to update plugin settings via 
  a forged request granted they can trick a site administrator into performing 
  an action such as clicking on a link.
