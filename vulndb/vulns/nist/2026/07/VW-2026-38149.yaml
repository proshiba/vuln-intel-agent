title: Leantime 3.6.2 contains a server-side request forgery and local file 
  inclusion vulnerability that allows authenticated attackers to read internal 
  resources by passing unsanitized user-supplied filenames to 
  file_get_contents() in the Blueprints::import() method without path 
  validation. Attackers can submit crafted filenames containing URL wrappers or 
  path traversal sequences through the JSON-RPC API endpoint to access cloud 
  metadata services or read arbitrary files from the server filesystem.
