title: A vulnerability has been found in NASA cFS up to 7.0.0. The impacted 
  element is the function pickle.load of the component Pickle Module. Such 
  manipulation leads to deserialization. The attack needs to be performed 
  locally. The attack requires a high level of complexity. The exploitability is
  regarded as difficult. The exploit has been disclosed to the public and may be
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
