title: "GNU Bison improperly handles grammar‑defined output paths. Grammar directives
  such as %output and %header allow specifying file paths, which are accepted without
  restriction and override caller‑supplied output options. \nWhen processing attacker-supplied
  grammar, this behavior allows directing generated files to arbitrary writable locations
  on the filesystem, potentially overwriting existing files accessible to the Bison
  process.\n\nMaintainers of this project were notified about this vulnerability,
  and fixed the issue in commit 8d101c19d4d9aaedf83a448c925513742d4efcf0. However,
  they did not provide vulnerable version range. Version 3.8.2 was tested and confirmed
  as vulnerable, other versions were not tested but might also be vulnerable."
