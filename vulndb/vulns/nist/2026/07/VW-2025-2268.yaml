title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  pci-epf: Do not complete commands twice if nvmet_req_init() fails\n\nHave nvmet_req_init()
  and req->execute() complete failed commands.\n\nDescription of the problem:\nnvmet_req_init()
  calls __nvmet_req_complete() internally upon failure,\ne.g., unsupported opcode,
  which calls the \"queue_response\" callback,\nthis results in nvmet_pci_epf_queue_response()
  being called, which will\ncall nvmet_pci_epf_complete_iod() if data_len is 0 or
  if dma_dir is\ndifferent from DMA_TO_DEVICE. This results in a double completion
  as\nnvmet_pci_epf_exec_iod_work() also calls nvmet_pci_epf_complete_iod()\nwhen
  nvmet_req_init() fails.\n\nSteps to reproduce:\nOn the host send a command with
  an unsupported opcode with nvme-cli,\nFor example the admin command \"security receive\"\
  \n$ sudo nvme security-recv /dev/nvme0n1 -n1 -x4096\n\nThis triggers a double completion
  as nvmet_req_init() fails and\nnvmet_pci_epf_queue_response() is called, here iod->dma_dir"
