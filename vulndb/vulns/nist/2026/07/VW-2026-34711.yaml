title: sysPass through version 3.2.11 contains a missing object-level 
  authorization vulnerability in the JSON-RPC API that allows API token holders 
  to enumerate account metadata, overwrite passwords, and delete accounts across
  the entire vault without per-account access control. Attackers can invoke 
  AccountController methods such as viewAction, editAction, deleteAction, and 
  editPassAction without AccountFilterUser checks to modify or delete accounts 
  beyond the scope of their assigned token permissions.
