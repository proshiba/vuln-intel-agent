title: Ekushey Project Manager CRM through version 5.0 ccontains a stored 
  cross-site scripting vulnerability that allows authenticated client users to 
  inject arbitrary HTML and JavaScript by entering malicious payloads into the 
  Ticket Title field on the Create New Ticket page. Attackers can craft and 
  store malicious scripts that execute in the browser sessions of Staff or 
  Administrator users who view the Client Support page where ticket titles are 
  rendered unsanitized.
