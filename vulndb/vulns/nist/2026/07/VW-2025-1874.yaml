title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  revert back to __readahead_folio() for readahead\n\nIn commit 3eab9d7bc2f4 (\"fuse:
  convert readahead to use folios\"), the\nlogic was converted to using the new folio
  readahead code, which drops\nthe reference on the folio once it is locked, using
  an inferred\nreference on the folio. Previously we held a reference on the folio
  for\nthe entire duration of the readpages call.\n\nThis is fine, however for the
  case for splice pipe responses where we\nwill remove the old folio and splice in
  the new folio (see\nfuse_try_move_page()), we assume that there is a reference held
  on the\nfolio for ap->folios, which is no longer the case.\n\nTo fix this, revert
  back to __readahead_folio() which allows us to hold\nthe reference on the folio
  for the duration of readpages until either we\ndrop the reference ourselves in fuse_readpages_end()
  or the reference is\ndropped after it's replaced in the page cache in the splice
  case.\nThis will fix the "
