title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  chacha20poly1305 - validate poly1305 template argument\n\nchachapoly_create() still
  accepts the compatibility poly1305 parameter\nin the template name, but it assumes
  the second template argument is\nalways present and immediately passes it to strcmp().\n\
  \nWhen the argument is missing, crypto_attr_alg_name() returns an error\npointer.
  Check for that before comparing the name so malformed template\ninstantiations fail
  with an error instead of dereferencing the error\npointer in strcmp().\n\nThis matches
  the surrounding Crypto API template pattern where\ncrypto_attr_alg_name() results
  are validated before string-specific use."
