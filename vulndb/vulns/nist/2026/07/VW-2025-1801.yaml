title: "A flaw was found in runtimes-inventory-rhel8-operator. An internal proxy component
  is incorrectly configured. Because of this flaw, the proxy attaches the cluster's
  main administrative credentials to any command it receives, instead of only the
  specific reports it is supposed to handle.\n\nThis allows a standard user within
  the cluster to send unauthorized commands to the management platform, effectively
  acting with the full permissions of the cluster administrator. This could lead to
  unauthorized changes to the cluster's configuration or status on the Red Hat platform."
