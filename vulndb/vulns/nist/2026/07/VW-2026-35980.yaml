title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  mms114 - reject an oversized device packet size\n\nmms114_interrupt() reads a packet
  of touch data from the device into a\nfixed-size on-stack buffer\n\n\tstruct mms114_touch
  touch[MMS114_MAX_TOUCH];\n\nwhich holds MMS114_MAX_TOUCH (10) events of MMS114_EVENT_SIZE
  (8) bytes,\ni.e. 80 bytes. The length of the I2C read into it is taken verbatim
  from\nthe device:\n\n\tpacket_size = mms114_read_reg(data, MMS114_PACKET_SIZE);\n\
  \tif (packet_size <= 0)\n\t\tgoto out;\n\t...\n\terror = __mms114_read_reg(data,
  MMS114_INFORMATION, packet_size,\n\t\t\t(u8 *)touch);\n\npacket_size is a single
  device register byte (0x0F) and the only check\nis the lower bound packet_size <=
  0; it is never bounded against the\nsize of touch[]. A malfunctioning, malicious
  or counterfeit controller\n(or an attacker tampering with the I2C bus) can report
  a packet_size of\nup to 255, so __mms114_read_reg() writes up to 175 bytes past
  the end of\ntouch[] on the IRQ-thread stack:"
