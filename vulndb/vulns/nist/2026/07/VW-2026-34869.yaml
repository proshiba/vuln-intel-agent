title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the AVideo admin panel renders plugin configuration values in HTML forms 
  without applying htmlspecialchars() or any other output encoding. The 
  jsonToFormElements() function in admin/functions.php directly interpolates 
  user-controlled values into textarea contents, option elements, and input 
  attributes. An attacker who can set a plugin configuration value (either as a 
  compromised admin or by chaining with CSRF on admin/save.json.php) can inject 
  arbitrary JavaScript that executes whenever any administrator visits the 
  plugin configuration page. At time of publication, there are no publicly 
  available patches.
