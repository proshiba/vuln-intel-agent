title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  bound Read Response placement to the RREAD length\n\nIn drivers/infiniband/sw/siw/siw_qp_rx.c,
  siw_proc_rresp() places each\ninbound Read Response DDP segment at sge->laddr +
  wqe->processed and then\naccumulates wqe->processed, but it never checks the running
  total against\nthe sink buffer length on continuation segments. siw_check_sge()
  resolves\nand validates the sink memory only on the first fragment (the if (!*mem)\n\
  branch), and siw_rresp_check_ntoh() compares the cumulative length against\nwqe->bytes
  only on the final segment (the !frx->more_ddp_segs guard).\n\nA connected siw peer
  that answers an outstanding RREAD with Read Response\nsegments that keep the DDP
  Last flag clear, carrying more total payload\nthan the RREAD requested, drives wqe->processed
  past the validated sink\nbuffer; the next siw_rx_data() call writes out of bounds
  at\nsge->laddr + wqe->processed. siw runs iWARP over ordinary routable TCP,\nso
