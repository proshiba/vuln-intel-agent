title: "A security flaw has been discovered in PropertyGuru AgentNet Singapore App
  up to 23.7.10 on Android. This affects an unknown function of the file com/allproperty/android/agentnet/BuildConfig.java
  of the component com.allproperty.android.agentnet. The manipulation of the argument
  SEGMENT_ANDROID_WRITE_KEY/SEGMENT_TOS_WRITE_KEY results in use of hard-coded cryptographic
  key\r . The attack must be initiated from a local position. The exploit has been
  released to the public and may be used for attacks. The vendor was contacted early
  about this disclosure but did not respond in any way."
