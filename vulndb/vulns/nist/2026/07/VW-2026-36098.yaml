title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  fix chown/chgrp with SMB3 POSIX Extensions\n\nOwnership (chown) and group (chgrp)
  modifications were being ignored when\nmounting with SMB3 POSIX Extensions unless
  CIFS_MOUNT_CIFS_ACL or\nCIFS_MOUNT_MODE_FROM_SID were also explicitly set.\n\nFix
  this by checking for posix_extensions in cifs_setattr_nounix() when\nupdating UID
  and GID, ensuring that id_mode_to_cifs_acl() is called to map\nand set the ownership/group
  information on the server."
