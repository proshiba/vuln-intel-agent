title: The Payment Plugins for Stripe WooCommerce plugin for WordPress is 
  vulnerable to authorization bypass in all versions up to, and including, 
  4.0.7. This is due to the plugin not properly verifying that a user is 
  authorized to perform an action. This makes it possible for unauthenticated 
  attackers to mark arbitrary pending asynchronous WooCommerce orders as paid by
  forging a charge.pending event with attacker-controlled metadata.order_id, 
  metadata.gateway_id, and a charge object carrying status=succeeded and 
  captured=true, triggering payment_complete() and downstream fulfillment flows 
  with an attacker-supplied transaction ID. Exploitation requires the merchant 
  to have left the webhook_secret_test or webhook_secret_live option blank, 
  which is the plugin's default state until a Stripe-issued whsec_ value is 
  manually configured; once a non-empty secret is set, the signature 
  verification cannot be bypassed.
