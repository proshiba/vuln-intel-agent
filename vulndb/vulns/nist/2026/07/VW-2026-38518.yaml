title: "The fix for CVE-2026-12045 in pgAdmin 4 9.16 required the LLM-supplied query
  passed to the AI Assistant's execute_sql_query tool to parse, via sqlparse, as exactly
  one non-transaction-control statement before running it inside a BEGIN TRANSACTION
  READ ONLY wrapper. sqlparse's string-literal lexing can disagree with PostgreSQL's
  own parser: under standard_conforming_strings = on (PostgreSQL's default since 9.1),
  a backslash immediately before a quote is an ordinary character to PostgreSQL, but
  sqlparse treats it as escaping the quote. A payload such as SELECT '\\';COMMIT;CREATE
  TABLE pwn(x int);SELECT 1 --' therefore parses as a single SELECT to sqlparse's
  validator, while PostgreSQL executes it as four statements: the smuggled COMMIT
  ends the wrapping read-only transaction, and the trailing ROLLBACK becomes a no-op.
  This reintroduces the same write/RCE bypass CVE-2026-12045 was meant to close, reachable
