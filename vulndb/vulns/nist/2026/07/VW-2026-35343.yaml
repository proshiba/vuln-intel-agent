title: OCS Inventory NG Server version 2.12.3 and prior contain a stored 
  cross-site scripting vulnerability that allows unauthenticated attackers to 
  execute arbitrary JavaScript by submitting malicious User-Agent HTTP headers 
  to the /ocsinventory endpoint. Attackers can register rogue agents or craft 
  requests with malicious User-Agent values that are stored without sanitization
  and rendered with insufficient encoding in the web console, leading to 
  arbitrary JavaScript execution in the browsers of authenticated users viewing 
  the statistics dashboard.
