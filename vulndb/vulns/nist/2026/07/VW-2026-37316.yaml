title: SQL injection in Frappe's ERPNext, versions ERPNext 15.107.0 and Frappe 
  15.107.2. The application constructs SQL queries through direct string 
  interpolation using `str.format()` without employing parameterized queries, 
  allowing the name (docname) of a Supplier record containing SQL metacharacters
  to be interpreted as part of the query. Exploitation of this vulnerability 
  could allow an authenticated user with low privileges to execute arbitrary SQL
  queries, bypass Frappe’s access restrictions (DocPerm), extract confidential 
  information from the database—including fragments of the administrator’s 
  password hash—and access other sensitive data, such as credentials, 
  integration tokens, or financial information.
