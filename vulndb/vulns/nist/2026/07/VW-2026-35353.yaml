title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the BlockonomicsYPT plugin's check.php endpoint returns payment order data for
  any Bitcoin address without requiring authentication. The endpoint was 
  designed as an AJAX polling helper for the authenticated invoice.php page, but
  it performs no access control checks of its own. Since Bitcoin addresses are 
  publicly visible on the blockchain, an attacker can query payment records for 
  any address used on the platform.
