title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: ti-ads1119: fix PM reference leak in buffer preenable\n\nads1119_triggered_buffer_preenable()
  resumes the device with\npm_runtime_resume_and_get() before starting a conversion.\n\
  \nIf i2c_smbus_write_byte() fails, the function returns the error directly\nand
  leaves the runtime PM usage counter elevated. The matching\npostdisable callback
  is not called when preenable fails, so the reference\nis leaked and the device may
  remain runtime-active indefinitely.\n\nStore the I2C transfer result in ret and
  drop the runtime PM reference on\nfailure before returning the error."
