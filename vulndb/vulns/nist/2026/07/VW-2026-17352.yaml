title: A vulnerability has been identified in centraldogma-server-auth-shiro 
  versions prior to 0.84.0, where the SearchFirstActiveDirectoryRealm 
  substitutes the login username into an LDAP search filter without neutralizing
  LDAP filter metacharacters, allowing an unauthenticated attacker to manipulate
  the filter to cause authentication confusion and enumerate the directory 
  structure.
