title: "Spring Data Relational does not properly escape binding values of externally-controlled
  input when using StringMatcher (STARTING, ENDING, or CONTAINING) in Query By Example
  (QBE). An attacker can supply wildcard characters to perform boolean-based blind
  data inference.\n\nAffected versions:\nSpring Data Relational/JDBC/R2DBC 4.0.0 through
  4.0.5; 3.5.0 through 3.5.11; 3.4.0 through 3.4.14; 3.3.0 through 3.3.16; 3.2.0 through
  3.2.15; 3.1.0 through 3.1.14; 3.0.0 through 3.0.15; 2.4.0 through 2.4.19."
