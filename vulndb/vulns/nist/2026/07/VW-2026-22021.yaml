title: 'A weakness has been identified in primefaces primereact up to 10.9.8. This
  issue affects the function ObjectUtils.mutateFieldData of the file components/lib/utils/ObjectUtils.js
  of the component API. This manipulation of the argument Field causes improperly
  controlled modification of object prototype attributes. The attack is possible to
  be carried out remotely. Upgrading to version 10.9.9 and 11.0.0 is capable of addressing
  this issue. Patch name: 61f182e11d9ef52032ff56f420da763a6938236f. It is recommended
  to upgrade the affected component.'
