title: The Easy Digital Downloads plugin for WordPress is vulnerable to 
  Arbitrary File Upload in versions up to and including 3.6.9. This is due to 
  insufficient file type validation in the edd_do_ajax_import_file_upload() 
  function , which only checks the client-supplied 
  $_FILES['edd-import-file']['type'] Content-Type header against an allow-list 
  of CSV mime types, then uses raw move_uploaded_file() (bypassing 
  wp_handle_upload()'s core MIME enforcement) to write the file under its 
  original extension into the web-accessible wp-content/uploads/edd/exports/ 
  directory. This makes it possible for authenticated attackers, with Shop 
  Manager-level access and above, to upload arbitrary files on the affected 
  site's server which may make remote code execution possible.
