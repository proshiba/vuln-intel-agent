title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Remove skb secpath if xfrm state is not found\n\nHardware returns a unique identifier
  for a decrypted packet's xfrm\nstate, this state is looked up in an xarray. However,
  the state might\nhave been freed by the time of this lookup.\n\nCurrently, if the
  state is not found, only a counter is incremented.\nThe secpath (sp) extension on
  the skb is not removed, resulting in\nsp->len becoming 0.\n\nSubsequently, functions
  like __xfrm_policy_check() attempt to access\nfields such as xfrm_input_state(skb)->xso.type
  (which dereferences\nsp->xvec[sp->len - 1]) without first validating sp->len. This
  leads to\na crash when dereferencing an invalid state pointer.\n\nThis patch prevents
  the crash by explicitly removing the secpath\nextension from the skb if the xfrm
  state is not found after hardware\ndecryption. This ensures downstream functions
  do not operate on a\nzero-length secpath.\n\n BUG: unable to handle page fault for
  address: ffff"
