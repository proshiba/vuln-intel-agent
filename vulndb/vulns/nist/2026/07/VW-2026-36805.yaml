title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/edid:
  fix OOB read in drm_parse_tiled_block()\n\ndrm_parse_tiled_block() casts the DisplayID
  block to a\nstruct displayid_tiled_block and reads the full fixed layout up to\n\
  tile->topology_id[7] without checking block->num_bytes. The DisplayID\niterator
  only validates the declared payload length, so a crafted EDID\ncan advertise a tiled-display
  block (tag DATA_BLOCK_TILED_DISPLAY, or\nDATA_BLOCK_2_TILED_DISPLAY_TOPOLOGY for
  v2.0) with a small num_bytes at\nthe end of a DisplayID extension. The read then
  runs past the end of the\nexact-sized kmemdup()'d EDID allocation, a heap out-of-bounds
  read.\n\nReject blocks shorter than the spec's 22-byte tiled payload before\nreading
  the fixed struct, as drm_parse_vesa_mso_data() already does.\n\n  BUG: KASAN: slab-out-of-bounds
  in drm_edid_connector_update\n  Read of size 2 at addr ffff888010077700 by task
  exploit/147\n   dump_stack_lvl (lib/dump_stack.c:94 ...)\n   print_report (mm/kasan/re"
