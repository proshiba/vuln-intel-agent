title: The Uncanny Automator – Easy Automation, Integration, Webhooks & Workflow
  Builder plugin for WordPress is vulnerable to Missing Authorization in 
  versions up to, and including, 7.3.2 via the 
  automator_google_contacts_fetch_labels, automator_mautic_segment_fetch, 
  automator_mautic_tags_fetch, and automator_mautic_render_contact_fields AJAX 
  actions due to a missing capability check and missing nonce verification in 
  the corresponding handlers (ajax_fetch_labels, segments_fetch, tags_fetch, and
  render_contact_fields). This makes it possible for authenticated attackers, 
  with Subscriber-level access and above, to enumerate sensitive Google Contacts
  groups/labels and Mautic segments, tags, and contact-field definitions 
  retrieved via integration credentials configured by an administrator, and to 
  consume third-party API quota.
