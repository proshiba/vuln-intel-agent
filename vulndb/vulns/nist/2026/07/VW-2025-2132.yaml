title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  save the SR_SUM status over switches\n\nWhen threads/tasks are switched we need
  to ensure the old execution's\nSR_SUM state is saved and the new thread has the
  old SR_SUM state\nrestored.\n\nThe issue was seen under heavy load especially with
  the syz-stress tool\nrunning, with crashes as follows in schedule_tail:\n\nUnable
  to handle kernel access to user memory without uaccess routines\nat virtual address
