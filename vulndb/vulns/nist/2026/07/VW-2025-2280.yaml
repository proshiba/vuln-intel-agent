title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/net:
  commit partial buffers on retry\n\nRing provided buffers are potentially only valid
  within the single\nexecution context in which they were acquired. io_uring deals
  with this\nand invalidates them on retry. But on the networking side, if\nMSG_WAITALL
  is set, or if the socket is of the streaming type and too\nlittle was processed,
  then it will hang on to the buffer rather than\nrecycle or commit it. This is problematic
  for two reasons:\n\n1) If someone unregisters the provided buffer ring before a
  later retry,\n   then the req->buf_list will no longer be valid.\n\n2) If multiple
  sockers are using the same buffer group, then multiple\n   receives can consume
  the same memory. This can cause data corruption\n   in the application, as either
  receive could land in the same\n   userspace buffer.\n\nFix this by disallowing
  partial retries from pinning a provided buffer\nacross multiple executions, if ring
  provided buffers are use"
