title: "When enabling Spring Boot DevTools support for a remote application target
  (for example a Docker container or Cloud Foundry app) from the Spring Tools Boot
  Dashboard, Spring Tools generates a shared secret that authenticates DevTools remote-restart
  uploads to the deployed application. This secret was generated using a non-cryptographic
  pseudo-random number generator rather than a cryptographically secure source of
  randomness.\nAffected Spring Products and Versions:\nSpring Tools for Eclipse: 5.2.0
  and earlier"
