title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio/pci:
  Latch disable_idle_d3 per device\n\nWhen disable_idle_d3 was introduced in vfio-pci,
  it directly manipulated\nthe device power state with pci_set_power_state().  There
  were no\nrefcounts to maintain or balanced operations, we could unconditionally\n\
  bring the device to D0 and conditionally move it to D3hot.  Therefore\nthe module
  parameter was made writable.\n\nLater, in commit c61302aa48f7 (\"vfio/pci: Move
  module parameters to\nvfio_pci.c\"), as part of the vfio-pci-core split, the writable
  aspect\nof the module parameter was nullified.  The parameter value could still\n\
  be changed through sysfs, but the vfio-pci driver latched the values\ninto vfio-pci-core
  globals at module init.  Loading the vfio-pci module,\nor unloading and reloading,
  with non-default or different values could\nchange the globals relative to existing
  devices bound to vfio-pci\nvariant drivers.\n\nRuntime PM was introduced in commit
