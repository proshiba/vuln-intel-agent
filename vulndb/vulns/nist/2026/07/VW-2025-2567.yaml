title: 'A vulnerability was identified in Dígitro NGC Explorer up to 3.48.21. The
  affected element is an unknown function of the component Configuration Page. Such
  manipulation leads to missing password field masking. It is possible to launch the
  attack remotely. Upgrading to version 3.48.22 is sufficient to fix this issue. It
  is suggested to upgrade the affected component. The action taken by the vendor is:
  "Review and correction of controls related to the exposure of user information in
  the product configuration interface." The vulnerabilities are limited to NGC Explorer
  and do not affect other Dígitro products, including UNA and Guardião.'
