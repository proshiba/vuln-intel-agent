title: "Pivotick contains a cross-site scripting vulnerability in the inspect and
  edit node modals. Node labels and descriptions originating from graph data were
  interpolated directly into HTML used to construct the modal headers.\n\nAn attacker
  able to supply or modify graph data could insert a malicious HTML or JavaScript
  payload into a node’s label or description. The payload would be parsed and executed
  in the application’s origin when a user opened the affected node’s inspect or edit
  modal.\n\nSuccessful exploitation could allow the attacker to access information
  available to the victim, modify application data, or perform actions using the victim’s
  active session.\n\nThe vulnerability has been addressed by creating the modal elements
  without embedding graph data in HTML and assigning node labels and descriptions
  through textContent."
