title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  lg-g15: cancel pending work on remove to fix a use-after-free\n\nlg_g15_data is
  allocated with devm and holds a work item. The report\nhandlers schedule that work
  straight from device input.\nlg_g15_event() and lg_g15_v2_event() do it on the backlight
  cycle key,\nand lg_g510_leds_event() does it too. The worker dereferences the\n\
  lg_g15_data back through container_of.\n\nThe driver had no remove callback and
  never cancelled the work. So if a\nreport scheduled the work and the keyboard was
  then unplugged, devres\nfreed lg_g15_data while the work was still pending or running,
  and the\nworker touched freed memory. This is a use-after-free. It is reachable\n\
  as a race on device unplug.\n\nAdd a remove callback that cancels the work before
  devres frees the\nstate. g15->work is only initialized for the models that schedule
  it\n(G15, G15 v2, G510). The G13 and Z-10 leave it zeroed, so guard the\ncancel
  on g15->work.func to avoid cancellin"
