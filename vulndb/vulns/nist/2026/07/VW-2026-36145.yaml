title: "In the Linux kernel, the following vulnerability has been resolved:\n\naudit:
  Fix data races of skb_queue_len() readers on audit_queue\n\nMultiple readers access
  audit_queue.qlen via skb_queue_len() without\nholding the queue lock or using READ_ONCE(),
  while kauditd writes to\nthis field via the skb_dequeue() → __skb_unlink() path
  with WRITE_ONCE()\nprotected by a spinlock. This constitutes data races.\n\nAll
  affected skb_queue_len(&audit_queue) call sites:\n  - kauditd_thread() wait_event_freezable()
  condition\n  - audit_receive_msg() AUDIT_GET handler (s.backlog assignment)\n  -
  audit_receive() backlog check\n  - audit_log_start() backlog check and pr_warn()\n\
  \nKCSAN reports the following conflicting access pattern (one example):\n==================================================================\n\
  BUG: KCSAN: data-race in audit_log_start / skb_dequeue\n\nwrite (marked) to 0xffffffff8512ee20
  of 4 bytes by task 661 on cpu 57:\n skb_dequeue+0x70/0xf0\n kauditd_send_queue+0x71/0x220\n\
  \ kauditd_thread+0x1cb/0x4"
