title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Do not initialize SNP for SEV ioctls\n\nSashiko notes:\n\n> if SEV initialization
  fails and KVM is actively running normal VMs, could a\n> userspace process trigger
  this code path via /dev/sev ioctls (e.g.,\n> SEV_PDH_GEN) and zero out MSR_VM_HSAVE_PA
  globally? Would the next VMRUN\n> execution for an active VM trigger a general protection
  fault and crash the\n> host?\n\nsev_move_to_init_state() is called for ioctls requiring
  only SEV firmware:\nSEV_PEK_GEN, SEV_PDH_GEN, SEV_PEK_CSR, SEV_PEK_CERT_IMPORT,
  and\nSEV_PDH_CERT_EXPORT. After the firmware command, it does SEV_SHUTDOWN on\n\
  the SEV firmware. Since these commands do not require SNP to be\ninitialized, skip
  it by calling __sev_platform_init_locked() which only\ninitializes the SEV firmware.
  This way SNP is not Initialized at all, and\nHSAVE_PA is not cleared.\n\nThe previous
  code saved any SEV initialization firmware error to\ninit_args.error and then threw
  it away a"
