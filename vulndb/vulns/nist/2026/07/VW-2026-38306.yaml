title: Outstatic CMS <= 2.1.9 contains a hardcoded JWT signing secret. When the 
  OST_TOKEN_SECRET environment variable is not set, the application falls back 
  to the default value which is publicly visible in the source code repository. 
  An unauthenticated remote attacker can exploit this by forging JWT session 
  tokens with arbitrary user data and full administrative permissions.
