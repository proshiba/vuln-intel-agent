title: Use of an insecure cryptographic algorithm in the cashless payment system
  using NFC wristbands from CasfID Servicios Tecnológicos S.L.U. (version used 
  at Resurrection Fest 2025), which employs cards based on MIFARE Classic 
  technology (FM11RF08S). The cryptographic weakness of the authentication 
  algorithm allows an attacker to retrieve access keys using techniques known as
  Backdoored Nested Attack, read the wristband’s entire contents, and clone its 
  credentials onto a compatible rewritable card. Exploitation of this 
  vulnerability could enable the impersonation of other attendees, the 
  fraudulent use of the balance associated with their wristbands, and financial 
  losses for both the affected users and the event organizers.
