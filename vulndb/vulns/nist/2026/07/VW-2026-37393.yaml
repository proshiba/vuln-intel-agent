title: AMMOS Instrument Toolkit (AIT) GUI before 2.5.1 contains a missing 
  authentication vulnerability that allows any unauthenticated network attacker 
  to obtain a valid session and issue arbitrary spacecraft commands by calling 
  Sessions.create() without any credential check. Attackers can exploit the 
  unauthenticated session issuance in Sessions.create() and subsequently invoke 
  handle_cmd() to forward arbitrary commands directly to the AIT command bus 
  without any authentication gate between session creation and command dispatch.
