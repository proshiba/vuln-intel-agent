title: 'Vulnerability in the Oracle Enterprise Manager Base Platform product of Oracle
  Enterprise Manager (component: Discovery Framework).  Supported versions that are
  affected are 13.5 and  24.1. Difficult to exploit vulnerability allows unauthenticated
  attacker with network access via HTTPS to compromise Oracle Enterprise Manager Base
  Platform.  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Enterprise
  Manager Base Platform accessible data as well as  unauthorized read access to a
  subset of Oracle Enterprise Manager Base Platform accessible data and unauthorized
  ability to cause a partial denial of service (partial DOS) of Oracle Enterprise
  Manager Base Platform. CVSS 3.1 Base Score 7.0 (Confidentiality, Integrity and Availability
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L).'
