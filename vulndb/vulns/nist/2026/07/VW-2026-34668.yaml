title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  rockchip: teardown bugs and resource leaks\n\nAddress several teardown issues and
  resource leaks in the driver's remove\npath and error handling:\n\n1. Debounce clock
  reference leak: The debounce clock (bank->db_clk) is\n   obtained using of_clk_get()
  which increments the clock's reference\n   count, but clk_put() is never called.
  Register a devm action to\n   cleanly release it on unbind. Note that of_clk_get(...,
  1) remains\n   necessary over devm_clk_get() because the DT binding does not define\n\
  \   clock-names, precluding name-based lookup.\n\n2. Unregistered chained IRQ handler:
  The chained IRQ handler is not\n   disconnected in remove(). If a stray interrupt
  fires after the driver\n   is removed, the kernel attempts to execute a stale handler,
  leading\n   to a panic. Fix this by clearing the handler in remove().\n\n3. IRQ
  domain leak: The linear IRQ domain and its generic chips are\n   allocated manually
