title: A vulnerability was detected in kalcaddle kodbox up to 1.64. This affects
  an unknown function of the component shareMake/shareCheck. Performing a 
  manipulation of the argument siteFrom/siteTo results in server-side request 
  forgery. The attack is possible to be carried out remotely. The complexity of 
  an attack is rather high. The exploitability is reported as difficult. The 
  exploit is now public and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
