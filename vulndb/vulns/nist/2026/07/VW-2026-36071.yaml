title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfs/hfsplus:
  fix u32 overflow in check_and_correct_requested_length\n\ncheck_and_correct_requested_length()
  compares (off + len) against\nnode_size using u32 arithmetic.  When the caller passes
  a large len\nvalue (e.g. from an underflowed subtraction in hfs_brec_remove()),\n\
  off + len can wrap past 2^32 and produce a small result, causing the\nbounds check
  to pass when it should fail.\n\nFor example, with off=14 and len=0xFFFFFFF2 (underflowed
  from\ndata_off - keyoffset - size in hfs_brec_remove), off + len wraps to 6,\nwhich
  is less than a typical node_size of 512, so the check passes and\nthe subsequent
  memmove reads ~4GB past the node buffer.\n\nFix this by widening the addition to
  u64 before comparing against\nnode_size.  This prevents the u32 wrap while keeping
  the logic\nstraightforward."
