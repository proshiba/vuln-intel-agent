title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  event: Fix event FIFO reset race\n\n`iio_event_getfd()` creates the event file descriptor
  with\n`anon_inode_getfd()`, which allocates a new fd, creates the anonymous\nfile
  and installs it in the process fd table before returning to the\ncaller.\n\nThe
  IIO code resets the event FIFO after `anon_inode_getfd()` has returned,\nbut before
  `IIO_GET_EVENT_FD_IOCTL` has copied the fd number to userspace.\nBut since fd tables
  are shared between threads, another thread can guess\nthe newly allocated fd number
  and issue a `read()` on it as soon as the fd\nhas been installed.\n\nThis means
  the `kfifo_to_user()` in `iio_event_chrdev_read()` can run in\nparallel with the
  `kfifo_reset_out()` in `iio_event_getfd()`.\n\nThe kfifo documentation says that
  `kfifo_reset_out()` is only safe when it\nis called from the reader thread and there
  is only one concurrent reader.\nOtherwise it is dangerous and must be handled in
  the same way as\n`kfifo_reset()`"
