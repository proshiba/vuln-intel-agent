title: The SSH service on BSH ELP (Electronic Platform) modules contains a 
  platform-specific vulnerability due to an improperly secured default 
  configuration. An insecure, non-revocable SSH public key is included in the 
  firmware's authorized_keys file for the root user. An attacker in possession 
  of the corresponding private key could leverage it to bypass authentication 
  and gain root-level access to the appliance.
