title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  cdnsp: fix stream context array leak in cdnsp_alloc_stream_info()\n\ncdnsp_alloc_stream_info()
  allocates stream_info->stream_ctx_array with\ncdnsp_alloc_stream_ctx(). If a later
  stream ring allocation or stream\nmapping update fails, the error path frees the
  allocated stream rings\nand stream_rings array, but leaves stream_ctx_array allocated.\n\
  \nFree the stream context array before falling through to the stream_rings\ncleanup
  path."
