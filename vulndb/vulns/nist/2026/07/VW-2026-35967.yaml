title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: reject overlapping data areas in SMB2 responses\n\nCommit 53b7c271f06b (\"\
  smb: client: restrict implied bcc[0] exemption to\nresponses without data area\"\
  ) restricted the implied bcc[0] length\nexception to responses without a data area.
  However, the overlap\nhandling in __smb2_calc_size() clears data_length, which can
  make an\ninvalid response appear to have no data area and so qualify for the\nexception.\n\
  \nTrack data area overlap separately and reject such responses before\napplying
  the length compatibility exceptions."
