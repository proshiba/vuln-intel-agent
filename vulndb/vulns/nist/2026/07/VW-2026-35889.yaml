title: FFmpeg through 8.1.2, fixed in commit b506faf, contains a heap 
  out-of-bounds write vulnerability in the native PNG and APNG encoders that 
  allows remote attackers to corrupt heap memory by supplying a crafted PNG 
  image with a malicious eXIf chunk. Attackers can craft an eXIf chunk where 
  multiple IFD entries reference the same large value payload, causing canonical
  serialization to expand the output far beyond the undersized allocation 
  estimated by add_exif_profile_size(), resulting in png_write_chunk() writing 
  tens of thousands of bytes past the buffer boundary, leading to deterministic 
  heap corruption, process crash, and potentially arbitrary code execution.
