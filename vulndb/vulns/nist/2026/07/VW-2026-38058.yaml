title: The Subscriptions for WooCommerce plugin for WordPress is vulnerable to 
  Missing Authorization in all versions up to, and including, 2.0.0. This is due
  to the plugin not properly verifying that a user is authorized to perform an 
  action via the wps_sfw_install_plugin_configuration AJAX handler. This makes 
  it possible for authenticated attackers, with shop manager-level access and 
  above, to install and activate arbitrary WordPress.org plugins.
