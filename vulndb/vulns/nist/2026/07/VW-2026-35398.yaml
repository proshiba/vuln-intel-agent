title: dbt enables data analysts and engineers to transform their data using the
  same practices that software engineers use to build applications. Inside the 
  reusable workflow 
  dbt-labs/actions/blob/main/.github/workflows/open-issue-in-repo.yml, the prep 
  job uses peter-evans/find-comment to search for an existing comment indicating
  that a docs issue has already been opened. The output 
  steps.issue_comment.outputs.comment-body is then interpolated directly into a 
  bash if statement. Because comment-body is attacker-controlled text and is 
  inserted into shell syntax without escaping, a malicious comment body can 
  break out of the quoted string and inject arbitrary shell commands. This 
  vulnerability is fixed with commit bbed8d28354e9c644c5a7df13946a3a0451f9ab9.
