title: "Spring Tools for Eclipse renders Spring Boot starter wizard dependency tooltips
  in a native embedded browser (SWT Browser) with JavaScript enabled. Using untrusted
  and compromised Initializr endpoints for the Spring Boot starter wizard can result
  in arbitrary script execution inside the embedded browser when a developer hovers
  a dependency checkbox in the New Spring Starter Project wizard. Impact is limited
  to in-IDE UI spoofing and outbound network beaconing rather than full code execution.\n\
  Affected Spring Products and Versions:\nSpring Tools for Eclipse: 5.2.0 and earlier"
