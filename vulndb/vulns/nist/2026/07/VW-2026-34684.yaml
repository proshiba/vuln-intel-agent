title: Suna before 0.9.102 contains a broken access control vulnerability in the
  message queue API that allows authenticated attackers to access and manipulate
  queue resources belonging to other users by exploiting missing ownership and 
  account isolation checks. Attackers can read pending prompt queues of all 
  users, read or delete individual sessions, and inject arbitrary prompts into 
  another user's session queue, causing the background drainer to forward 
  malicious messages to the victim's running AI agent with the victim's 
  credentials and permissions.
