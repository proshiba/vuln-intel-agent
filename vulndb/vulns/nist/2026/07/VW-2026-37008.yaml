title: "The StoreGrowth: Smart Sales Booster for WooCommerce | BOGO, Upsells, Direct
  Checkout, Quick View, Side Cart plugin for WordPress is vulnerable to authorization
  bypass in all versions up to, and including, 2.1.0. This is due to the plugin not
  properly verifying that a user is authorized to perform an action. This makes it
  possible for unauthenticated attackers to overwrite the spsg_popup_products option
  with arbitrary attacker-controlled data. The 'ajd_protected' nonce used as the sole
  gate is exposed to unauthenticated visitors on every frontend page through the BoGo
  module's wp_localize_script call, rendering it ineffective as an authorization barrier."
