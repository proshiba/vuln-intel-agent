title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs3:
  init run lock for extend inode\n\nAfter setting the inode mode of $Extend to a regular
  file, executing the\ntruncate system call will enter the do_truncate() routine,
  causing the\nrun_lock uninitialized error reported by syzbot.\n\nPrior to patch
  4e8011ffec79, if the inode mode of $Extend was not set to\na regular file, the do_truncate()
  routine would not be entered.\n\nAdd the run_lock initialization when loading $Extend.\n\
  \nsyzbot reported:\nINFO: trying to register non-static key.\nCall Trace:\n dump_stack_lvl+0x189/0x250
  lib/dump_stack.c:120\n assign_lock_key+0x133/0x150 kernel/locking/lockdep.c:984\n\
  \ register_lock_class+0x105/0x320 kernel/locking/lockdep.c:1299\n __lock_acquire+0x99/0xd20
  kernel/locking/lockdep.c:5112\n lock_acquire+0x120/0x360 kernel/locking/lockdep.c:5868\n\
  \ down_write+0x96/0x1f0 kernel/locking/rwsem.c:1590\n ntfs_set_size+0x140/0x200
  fs/ntfs3/inode.c:860\n ntfs_extend+0x1d9/0x970 fs/ntfs3/file.c:387\n ntfs_se"
