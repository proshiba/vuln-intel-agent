title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  validate sparing table length as an entry count, not a byte count\n\nudf_load_sparable_map()
  accepts a sparing table when\n\n\tsizeof(*st) + le16_to_cpu(st->reallocationTableLen)
  > sb->s_blocksize\n\nis false, i.e. it treats reallocationTableLen as a number of
  BYTES that\nmust fit in the block.  But the table is walked as an array of 8-byte\n\
  sparingEntry elements:\n\n\tfor (i = 0; i < le16_to_cpu(st->reallocationTableLen);
  i++) {\n\t\tstruct sparingEntry *entry = &st->mapEntry[i];\n\t\t... entry->origLocation
  ...\n\t}\n\nin udf_get_pblock_spar15() and udf_relocate_blocks().  A\nreallocationTableLen
  of N therefore passes the check whenever\nsizeof(*st) + N <= blocksize, yet the
  consumers index\nsizeof(*st) + N * sizeof(struct sparingEntry) bytes -- up to ~8x
  the\nblock.  On a crafted UDF image this is an out-of-bounds read in\nudf_get_pblock_spar15();
  udf_relocate_blocks() additionally feeds the\nsame length to udf_update_tag(), whose
  crc_it"
