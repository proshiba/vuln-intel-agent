title: HAPI FHIR is a complete implementation of the HL7 FHIR standard for 
  healthcare interoperability in Java. Prior to version 6.9.4, 
  ManagedWebAccessUtils.getServer() uses String.startsWith() to match request 
  URLs against configured server URLs for authentication credential dispatch. 
  Because configured server URLs (e.g., http://tx.fhir.org) lack a trailing 
  slash or host boundary check, an attacker-controlled domain like 
  http://tx.fhir.org.attacker.com matches the prefix and receives Bearer tokens,
  Basic auth credentials, or API keys when the HTTP client follows a redirect to
  that domain. This issue has been patched in version 6.9.4.
