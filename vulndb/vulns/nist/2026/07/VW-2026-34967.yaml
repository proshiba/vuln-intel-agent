title: SillyTavern is a locally installed user interface that allows users to 
  interact with text generation large language models, image generation engines,
  and text-to-speech voice models. Prior to version 1.17.0, a path traversal 
  vulnerability in chat endpoints allows an authenticated attacker to read and 
  delete arbitrary files under their user data root (for example secrets.json 
  and settings.json) by supplying avatar_url="..". This issue has been patched 
  in version 1.17.0.
