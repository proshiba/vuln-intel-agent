title: "The Zephyr ext2 file system validates the on-disk superblock in ext2_verify_disk_superblock()
  (subsys/fs/ext2/ext2_impl.c) before completing a mount. The validator checked the
  magic number, block size, revision and feature flags, but did not verify that the
  on-disk fields s_blocks_per_group and s_inodes_per_group are non-zero. Both fields
  are read directly from the image and are later used as divisors during mount-time
  initialization.\n\nDuring mount, get_ngroups() divides and modulos s_blocks_count
  by s_blocks_per_group (reached via ext2_fetch_block_group() from ext2_init_fs()),
  and get_itable_entry() divides (ino - 1) by s_inodes_per_group when fetching the
  root inode (both in subsys/fs/ext2/ext2_diskops.c). A superblock with either field
  set to zero therefore causes an integer division by zero during the mount sequence.\n\
  \nAn attacker who can present a crafted ext2 image to a device that mounts ext2
  — removable media such as an SD card or a USB mass-storage device — can trigger
  this. On"
