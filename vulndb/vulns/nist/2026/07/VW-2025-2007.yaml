title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix slab-use-after-free in hdcp\n\nThe HDCP code in amdgpu_dm_hdcp.c copies pointers
  to amdgpu_dm_connector\nobjects without incrementing the kref reference counts.
  When using a\nUSB-C dock, and the dock is unplugged, the corresponding\namdgpu_dm_connector
  objects are freed, creating dangling pointers in the\nHDCP code. When the dock is
  plugged back, the dangling pointers are\ndereferenced, resulting in a slab-use-after-free:\n\
  \n[   66.775837] BUG: KASAN: slab-use-after-free in event_property_validate+0x42f/0x6c0
  [amdgpu]\n[   66.776171] Read of size 4 at addr ffff888127804120 by task kworker/0:1/10\n\
  \n[   66.776179] CPU: 0 UID: 0 PID: 10 Comm: kworker/0:1 Not tainted 6.14.0-rc7-00180-g54505f727a38-dirty
  #233\n[   66.776183] Hardware name: HP HP Pavilion Aero Laptop 13-be0xxx/8916, BIOS
  F.17 12/18/2024\n[   66.776186] Workqueue: events event_property_validate [amdgpu]\n\
  [   66.776494] Call Trace:\n[   66.776496]  <TAS"
