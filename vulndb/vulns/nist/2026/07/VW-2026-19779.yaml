title: Allocation of resources without limits or throttling in the HTTP/2 HPACK 
  decoder in Apache HttpComponents Core (5.4.2 and earlier, 5.5-beta1 and 
  earlier) allows an remote attacker to cause a denial of service through memory
  exhaustion by sending oversized compressed header blocks before the HTTP/2 
  SETTINGS acknowledgement causes the configured header list size limit to be 
  applied.
