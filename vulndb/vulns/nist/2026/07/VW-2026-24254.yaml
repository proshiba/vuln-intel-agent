title: SurrealDB before 1.0.1 sets default table permissions to FULL instead of 
  NONE, allowing SELECT, CREATE, UPDATE, and DELETE operations on tables without
  explicit permissions. Attackers with database access or unauthenticated users 
  on publicly exposed instances can perform unrestricted operations on 
  unprotected tables within their authorization scope.
