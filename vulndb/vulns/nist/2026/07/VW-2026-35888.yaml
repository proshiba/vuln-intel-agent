title: FFmpeg through 8.1.2, fixed in commit aafb5c6, contains a signed integer 
  overflow vulnerability in the MACE6 audio decoder that allows attackers to 
  corrupt heap memory by supplying a crafted CAF file with a malicious 
  bytes_per_packet value. Attackers can craft a CAF file with oversized 
  bytes_per_packet and frames_per_packet values in the desc chunk to trigger an 
  integer overflow in mace_decode_frame() during output sample count 
  computation, resulting in an undersized buffer allocation and heap 
  out-of-bounds write that could enable code execution.
