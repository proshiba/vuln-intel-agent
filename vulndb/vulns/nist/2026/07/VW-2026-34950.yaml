title: Signal K Server is a server application that runs on a central hub in a 
  boat. Prior to version 2.24.0-beta.4, there is a privilege escalation 
  vulnerability by Admin Role Injection via /enableSecurity. An unauthenticated 
  attacker can gain full Administrator access to the SignalK server at any time,
  allowing them to modify sensitive vessel routing data, alter server 
  configurations, and access restricted endpoints. This issue has been patched 
  in version 2.24.0-beta.4.
