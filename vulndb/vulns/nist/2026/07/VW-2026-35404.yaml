title: Plane is an an open-source project management tool. Prior to 1.3.0, a 
  vulnerability was identified in Plane's authentication flow where a user's 
  email address is included as a query parameter in the URL during error 
  handling (e.g., when an invalid magic code is submitted). Transmitting 
  personally identifiable information (PII) via GET request query strings is 
  classified as an insecure design practice. The affected code path is located 
  in the authentication utility module (packages/utils/src/auth.ts). This 
  vulnerability is fixed in 1.3.0.
