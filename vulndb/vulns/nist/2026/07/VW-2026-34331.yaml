title: The Post Blocks & Tools plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'sliderStyle' block attribute in the Posts Slider
  block in all versions up to, and including, 1.3.0 due to insufficient input 
  sanitization and output escaping on user supplied attributes. This makes it 
  possible for authenticated attackers, with author-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page.
