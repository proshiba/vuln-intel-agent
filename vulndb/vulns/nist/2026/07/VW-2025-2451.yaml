title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  clear extent cache after moving/defragmenting extents\n\nThe extent map cache can
  become stale when extents are moved or\ndefragmented, causing subsequent operations
  to see outdated extent flags. \nThis triggers a BUG_ON in ocfs2_refcount_cal_cow_clusters().\n\
  \nThe problem occurs when:\n1. copy_file_range() creates a reflinked extent with
  OCFS2_EXT_REFCOUNTED\n2. ioctl(FITRIM) triggers ocfs2_move_extents()\n3. __ocfs2_move_extents_range()
  reads and caches the extent (flags=0x2)\n4. ocfs2_move_extent()/ocfs2_defrag_extent()
  calls __ocfs2_move_extent()\n   which clears OCFS2_EXT_REFCOUNTED flag on disk (flags=0x0)\n\
  5. The extent map cache is not invalidated after the move\n6. Later write() operations
  read stale cached flags (0x2) but disk has\n   updated flags (0x0), causing a mismatch\n\
  7. BUG_ON(!(rec->e_flags & OCFS2_EXT_REFCOUNTED)) triggers\n\nFix by clearing the
  extent map cache after each extent move/defrag\noperation in __o"
