title: "In the Linux kernel, the following vulnerability has been resolved:\n\nethtool:
  Avoid overflowing userspace buffer on stats query\n\nThe ethtool -S command operates
  across three ioctl calls:\nETHTOOL_GSSET_INFO for the size, ETHTOOL_GSTRINGS for
  the names, and\nETHTOOL_GSTATS for the values.\n\nIf the number of stats changes
  between these calls (e.g., due to device\nreconfiguration), userspace's buffer allocation
  will be incorrect,\npotentially leading to buffer overflow.\n\nDrivers are generally
  expected to maintain stable stat counts, but some\ndrivers (e.g., mlx5, bnx2x, bna,
  ksz884x) use dynamic counters, making\nthis scenario possible.\n\nSome drivers try
  to handle this internally:\n- bnad_get_ethtool_stats() returns early in case stats.n_stats
  is not\n  equal to the driver's stats count.\n- micrel/ksz884x also makes sure not
  to write anything beyond\n  stats.n_stats and overflow the buffer.\n\nHowever, both
  use stats.n_stats which is already assigned with the value\nreturned from get_sset_count(),
  henc"
