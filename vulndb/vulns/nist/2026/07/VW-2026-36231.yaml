title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  meson: amlogic-a4: fix deadlock issue\n\nAccessing the pinconf-pins sysfs node may
  deadlock.\n\npinconf_pins_show() holds pctldev->mutex, and the platform driver\n\
  calls pinctrl_find_gpio_range_from_pin(), which tries to acquire\nthe same mutex
  again, leading to a deadlock.\n\nUse pinctrl_find_gpio_range_from_pin_nolock() to
  fix this issue."
