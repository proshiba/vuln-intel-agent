title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/imagination:
  Synchronize interrupts before suspending the GPU\n\nThe runtime PM suspend callback
  doesn't know whether the IRQ handler is\nin progress on a different CPU core and
  doesn't wait for it to finish.\n\nDepending on timing, the IRQ handler could be
  running while the GPU is\nsuspended, leading to kernel crashes when trying to access
  GPU\nregisters. See example signature below.\n\nIn a power off sequence initiated
  by the runtime PM suspend callback,\nwait for any IRQ handlers in progress on other
  CPU cores to finish, by\ncalling synchronize_irq().\n\nAt the same time, remove
  the runtime PM resume/put calls in the threaded\nIRQ handler. On top of not being
  the right approach to begin with, and\nbeing at the wrong place as they should have
  wrapped all GPU register\naccesses, the driver would hit a deadlock between synchronize_irq()\n\
  being called from a runtime PM suspend callback, holding the device\npower lock,
  and the resume"
