title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  add a permission check for FSCTL_SET_ZERO_DATA\n\nFSCTL_SET_ZERO_DATA in smb2_ioctl()
  destroys file data via\nksmbd_vfs_zero_data() -> vfs_fallocate(PUNCH_HOLE/ZERO_RANGE)
  after\nchecking only the share-level KSMBD_TREE_CONN_FLAG_WRITABLE, with no\nper-handle
  access check. A handle opened with only FILE_WRITE_ATTRIBUTES\nstill yields an FMODE_WRITE
  filp (FILE_WRITE_ATTRIBUTES is part of\nFILE_WRITE_DESIRE_ACCESS_LE, so smb2_create_open_flags()
  opens it\nO_WRONLY), so the vfs_fallocate FMODE_WRITE check does not stop it; only\n\
  the missing fp->daccess gate would. Reproduced on mainline 7.1-rc7 with\nKASAN by
  an authenticated SMB client: a FILE_WRITE_ATTRIBUTES-only handle\nzeroed 4096 bytes
  of file data it had no FILE_WRITE_DATA right to\n(6/6; a FILE_READ_DATA-only handle
  was correctly denied).\n\nThis is the unfixed sibling of commit cc57232cae23 (\"\
  ksmbd: fix FSCTL\npermission bypass by adding a permission check for FSCTL_SET"
