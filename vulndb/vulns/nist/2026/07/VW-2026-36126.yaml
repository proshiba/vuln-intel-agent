title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  swap_cgroup: fix NULL deref in lookup_swap_cgroup_id on swapless host\n\nlookup_swap_cgroup_id()
  passes swap_cgroup_ctrl[type].map to\n__swap_cgroup_id_lookup() without checking
  that the type was ever\nregistered via swap_cgroup_swapon().  On a swapless host
  every ctrl->map\nis NULL, so __swap_cgroup_id_lookup() dereferences NULL + a scaled\n\
  swp_offset().\n\nSince commit bea67dcc5eea (\"mm: attempt to batch free swap entries
  for\nzap_pte_range()\"), zap_pte_range() -> swap_pte_batch() calls\nlookup_swap_cgroup_id()
  on any non-present, non-none PTE that decodes as a\nreal swap entry, without first
  validating it against swap_info[].  A\nsingle PTE corrupted into a type-0 swap entry
  takes the host down at\nprocess exit.\n\nWe hit this in production on a swapless
  6.12.58 host: ~1s of\n\"get_swap_device: Bad swap file entry 3f800204222bb\" (do_swap_page()
  being\ncorrectly defensive about the same entry) followed by\n\n  BUG: unable to
  handle"
