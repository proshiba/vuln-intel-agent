title: PraisonAI is a multi-agent teams system. Prior to version 4.5.90, 
  MCPToolIndex.search_tools() compiles a caller-supplied string directly as a 
  Python regular expression with no validation, sanitization, or timeout. A 
  crafted regex causes catastrophic backtracking in the re engine, blocking the 
  Python thread for hundreds of seconds and causing a complete service outage. 
  This issue has been patched in version 4.5.90.
