title: Insufficient Verification of Data Authenticity in the feedback function 
  of Mesalvo MEONA (MEONA Client and MEONA Server). The MEONA Client transmits 
  the recipient address of a feedback report to the MEONA Server, and the server
  sends the report to the transmitted address instead of the address configured 
  on the server. The feedback function is available only in the MEONA 
  administration area, which requires one of the administrative roles 
  ADMINISTRATOR, SUPERADMINISTRATOR or TYPIST (catalogue editing), or the 
  PHARMACIST role holding the PHARMACY_ADMINISTRATOR right, assigned explicitly 
  by the operating hospital's administrators. Such a user who modifies the 
  client request can cause the MEONA Server to send a message with content of 
