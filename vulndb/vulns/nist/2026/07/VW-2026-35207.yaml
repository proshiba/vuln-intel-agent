title: A security vulnerability has been detected in halex CourseSEL up to 
  1.1.0. Affected by this vulnerability is the function check_sel of the file 
  Apps/Index/Controller/IndexController.class.php of the component HTTP GET 
  Parameter Handler. The manipulation of the argument seid leads to sql 
  injection. It is possible to initiate the attack remotely. The exploit has 
  been disclosed publicly and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
