title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxhci:
  sideband: fix ring sg table pages leak\n\nxhci_ring_to_sgtable() allocates a temporary
  pages array and\nuses it to build the returned sg_table with\nsg_alloc_table_from_pages().\n\
  \nThe error paths free the pages array, but the success path\nreturns the sg_table
  without freeing it. This leaks the temporary\narray every time a sideband client
  gets an endpoint or event ring\nbuffer.\n\nFree the pages array after sg_alloc_table_from_pages()
  succeeds.\nThe returned sg_table has its own scatterlist entries and does not\n\
  depend on the temporary array after construction."
