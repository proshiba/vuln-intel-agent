title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  chemical: scd30: Cleanup initializations and fix sign-extension bug\n\nInclude linux/bitfield.h
  for FIELD_GET().\n\nCreate new macros for bit manipulation in combination with manual
  bit\nmanipulation being replaced with FIELD_GET().\n\nThe current variable declaration
  and initializations are barely readable\nand use comma separations across multiple
  lines. Refactor the\ninitializations so that mantissa and exp have separate declarations
  and\nsign gets initialized later.\n\nIn addition (and due to the nature of the cleanup),
  fix a sign-extension\nbug where, float32 would get bitwise anded with ~BIT(31)\n\
  (which is 0xFFFFFFFF7FFFFFFF) which corrupted the exponent."
