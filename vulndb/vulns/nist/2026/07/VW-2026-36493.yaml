title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  Fix potential UAF when ddgst mismatch\n\nShivam Kumar found via vulnerability testing:\n\
  When data digest is enabled on an NVMe/TCP connection and a digest\nmismatch occurs
  on a non-final H2C_DATA PDU during an R2T-based\ndata transfer, the digest error
  handler in nvmet_tcp_try_recv_ddgst()\ncalls nvmet_req_uninit() — which performs
  percpu_ref_put() on the\nsubmission queue — but does NOT mark the command as completed.
  It\ndoes not set cqe->status, does not modify rbytes_done, and does not\nclear any
  flag. When the subsequent fatal error triggers queue\nteardown, nvmet_tcp_uninit_data_in_cmds()
  iterates all commands,\nchecks nvmet_tcp_need_data_in() for each one, and finds
  that the\nalready-uninited command still appears to need data (because\nrbytes_done
  < transfer_len and cqe->status == 0). It therefore calls\nnvmet_req_uninit() a second
  time on the same command — a double\npercpu_ref_put against a single percpu_ref_get."
