title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  pcrypt - restore callback for non-parallel fallback\n\npcrypt installs pcrypt_aead_done()
  on the child AEAD request before\ntrying to submit it through padata.  If padata_do_parallel()
  returns\n-EBUSY, pcrypt falls back to calling the child AEAD directly.\n\nThat fallback
  must not keep the padata completion callback.  Otherwise\nan asynchronous completion
  runs pcrypt_aead_done() even though the\nrequest was never enrolled in padata.\n\
  \nRestore the original request callback and callback data before calling\nthe child
  AEAD directly.  This keeps the fallback path aligned with a\ndirect AEAD request
  while leaving the parallel path unchanged."
