title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btnxpuart: Fix kernel panic during FW release\n\nThis fixes a kernel panic seen
  during release FW in a stress test\nscenario where WLAN and BT FW download occurs
  simultaneously, and due to\na HW bug, chip sends out only 1 bootloader signatures.\n\
  \nWhen driver receives the bootloader signature, it enters FW download\nmode, but
  since no consequtive bootloader signatures seen, FW file is\nnot requested.\n\n\
  After 60 seconds, when FW download times out, release_firmware causes a\nkernel
  panic.\n\n[ 2601.949184] Unable to handle kernel paging request at virtual address
  0000312e6f006573\n[ 2601.992076] user pgtable: 4k pages, 48-bit VAs, pgdp=0000000111802000\n\
  [ 2601.992080] [0000312e6f006573] pgd=0000000000000000, p4d=0000000000000000\n[
  2601.992087] Internal error: Oops: 0000000096000021 [#1] PREEMPT SMP\n[ 2601.992091]
  Modules linked in: algif_hash algif_skcipher af_alg btnxpuart(O) pciexxx(O) mlan(O)
  overlay fsl_jr_uio caam_jr"
