title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  ensure no dirty metadata is written back for an fs with errors\n\n[BUG]\nDuring
  development of a minor feature (make sure all btrfs_bio::end_io()\nis called in
  task context), I noticed a crash in generic/388, where\nmetadata writes triggered
  new works after btrfs_stop_all_workers().\n\nIt turns out that it can even happen
  without any code modification, just\nusing RAID5 for metadata and the same workload
  from generic/388 is going\nto trigger the use-after-free.\n\n[CAUSE]\nIf btrfs hits
  an error, the fs is marked as error, no new\ntransaction is allowed thus metadata
  is in a frozen state.\n\nBut there are some metadata modifications before that error,
  and they are\nstill in the btree inode page cache.\n\nSince there will be no real
  transaction commit, all those dirty folios\nare just kept as is in the page cache,
  and they can not be invalidated\nby invalidate_inode_pages2() call inside close_ctree(),
