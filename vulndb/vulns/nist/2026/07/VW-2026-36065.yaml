title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject fragmented frames in devmap\n\nDevmap broadcast redirects clone the packet
  for all but the last\ndestination.\n\nFor native XDP, that clone path copies only
  the linear xdp_frame data,\nwhile fragmented frames keep skb_shared_info in tailroom
  outside the\nlinear area. Cloning such a frame leaves XDP_FLAGS_HAS_FRAGS set but\n\
  without valid frag metadata, and the later free path can interpret\nuninitialized
  tail data as skb_shared_info, leading to an out-of-bounds\naccess during frame return.\n\
  \nReject fragmented native XDP frames in dev_map_enqueue_clone().\n\nAdd the same
  restriction to the generic XDP clone path in\ndev_map_redirect_clone(). Generic
  XDP represents fragmented packets as\nnonlinear skbs, and rejecting them here keeps
  clone-based broadcast\nsupport aligned between native and generic XDP."
