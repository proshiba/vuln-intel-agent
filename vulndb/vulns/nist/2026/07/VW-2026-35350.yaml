title: Directus is a real-time API and App dashboard for managing SQL database 
  content. Prior to 11.17.0, Directus' GraphQL endpoints (/graphql and 
  /graphql/system) did not deduplicate resolver invocations within a single 
  request. An authenticated user could exploit GraphQL aliasing to repeat an 
  expensive relational query many times in a single request, forcing the server 
  to execute a large number of independent complex database queries 
  concurrently, multiplying database load linearly with the number of aliases. 
  The existing token limit on GraphQL queries still permitted enough aliases for
  significant resource exhaustion, while the relational depth limit applied per 
  alias without reducing the total number executed. Rate limiting is disabled by
  default, meaning no built-in throttle prevented this from causing CPU, memory,
  and I/O exhaustion that could degrade or crash the service. Any authenticated 
  user, including those with minimal read-only permissions, could trigger this 
