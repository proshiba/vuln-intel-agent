title: "A Blind SQL injection vulnerability has been identified in Quick.CMS. Improper
  neutralization of input provided by a high-privileged user into multiple fields
  in administration panel allows for Blind SQL Injection attacks.\n\nThe vendor states
  that this administration panel already allows for significant modification capabilities.
  The SQL injection vulnerability primarily enables bypassing front-end validation
  controls and potential database destruction. Given the trust model in which this
  application is designed to be administered, remediation of this issue was not deemed
  necessary by the vendor.\n\n\n\n\nThis vulnerability has been found in version 6.8,
  but other versions might also be vulnerable."
