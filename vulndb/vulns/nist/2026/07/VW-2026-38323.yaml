title: SFTPGo prior to 2.7.4 contains a permission bypass vulnerability that 
  allows authenticated users to circumvent per-directory access controls by 
  creating symbolic links in a permitted directory that point to files in 
  directories where download, upload, or overwrite permissions are denied. 
  Attackers can exploit the create_symlinks permission combined with read and 
  write access in one directory to read or modify files in restricted 
  directories, as operations are authorized against the link's directory 
  permissions rather than the dereferenced target's directory permissions.
