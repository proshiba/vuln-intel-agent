title: The vulnerability involves an Insecure Direct Object Reference (IDOR) in 
  the `DeleteNotificationController::delete()` method at endpoint `GET 
  /notification/delete/{id}`. The flaw allows any authenticated user, regardless
  of company or permissions, to delete notifications belonging to any other user
  in the system. The controller retrieves the target record with 
  `Notification::findOrFail($id)` and deletes it without validating `user_id` or
  `company_id` ownership, unlike the sibling 
  `SetNotificationReadAjaxController`, which correctly scopes lookups by 
  `Auth::id()`. Because notification identifiers are sequential, an attacker can
  iterate over IDs to systematically delete notifications belonging to any user,
  denying them visibility of ticket alerts, task assignments, and other system 
  events.
