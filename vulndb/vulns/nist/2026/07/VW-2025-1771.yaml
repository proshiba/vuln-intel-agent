title: "Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')
  vulnerability in Erlang OTP (stdlib modules) allows Absolute Path Traversal, File
  Manipulation. This vulnerability is associated with program files lib/stdlib/src/zip.erl
  and program routines zip:unzip/1, zip:unzip/2, zip:extract/1, zip:extract/2 unless
  the memory option is passed.\n\nThis issue affects OTP from OTP 17.0 before OTP 28.0.1,
  OTP 27.3.4.1 and OTP 26.2.5.13, corresponding to stdlib from 2.0 before 7.0.1, 6.2.2.1
  and 5.2.3.4."
