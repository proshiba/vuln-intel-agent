title: A flaw was found in rust-rpm-sequoia. An attacker can exploit this 
  vulnerability by providing a specially crafted Red Hat Package Manager (RPM) 
  file. During the RPM signature verification process, this crafted file can 
  trigger an error in the OpenPGP signature parsing code, leading to an 
  unconditional termination of the rpm process. This issue results in an 
  application level denial of service, making the system unable to process RPM 
  files for signature verification.
