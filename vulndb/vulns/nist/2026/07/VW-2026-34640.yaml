title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (lm90) Add lock protection to lm90_alert\n\nSashiko reports:\n\nlm90_alert() executes
  in the smbus alert context and calls\nlm90_update_confreg() to disable the hardware
  alert line, without\nacquiring hwmon_lock.\n\nConcurrently, sysfs write operations
  (such as lm90_write_convrate) hold\nthe hwmon_lock, temporarily modify data->config,
  and then restore it.\n\nIf an alert interrupt occurs concurrently with a sysfs write,
  the sysfs\npath will overwrite the alert handler's modifications to data->config\n\
  and the hardware register.\n\nThis unintentionally re-enables the hardware alert
  line while the alarm is\nstill active, causing an interrupt storm.\n\nAdd the missing
  lock to lm90_alert() to solve the problem."
