title: A vulnerability has been found in assafelovic gpt-researcher up to 3.4.3.
  This affects the function extract_command_data of the file 
  backend/server/server_utils.py of the component ws Endpoint. Such manipulation
  of the argument args leads to code injection. The attack may be performed from
  remote. The exploit has been disclosed to the public and may be used. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
