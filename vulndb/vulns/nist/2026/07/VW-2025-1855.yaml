title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btusb: mediatek: Add locks for usb_driver_claim_interface()\n\nThe documentation
  for usb_driver_claim_interface() says that \"the\ndevice lock\" is needed when the
  function is called from places other\nthan probe(). This appears to be the lock
  for the USB interface\ndevice. The Mediatek btusb code gets called via this path:\n\
  \n  Workqueue: hci0 hci_power_on [bluetooth]\n  Call trace:\n   usb_driver_claim_interface\n\
  \   btusb_mtk_claim_iso_intf\n   btusb_mtk_setup\n   hci_dev_open_sync\n   hci_power_on\n\
  \   process_scheduled_works\n   worker_thread\n   kthread\n\nWith the above call
  trace the device lock hasn't been claimed. Claim\nit.\n\nWithout this fix, we'd
  sometimes see the error \"Failed to claim iso\ninterface\". Sometimes we'd even
  see worse errors, like a NULL pointer\ndereference (where `intf->dev.driver` was
  NULL) with a trace like:\n\n  Call trace:\n   usb_suspend_both\n   usb_runtime_suspend\n\
  \   __rpm_callback\n   rpm_suspend\n   "
