title: Linuxfabrik monitoring-plugins provides Python monitoring plugins for 
  Icinga, Nagios, and related monitoring systems. In version 6.0.0, the logfile 
  check legacy database migration moved a predictable path from /tmp with 
  os.rename() and allowed a local user controlling the plugin account to place a
  symlink that would be followed by sqlite3.connect() during a root-run check.
