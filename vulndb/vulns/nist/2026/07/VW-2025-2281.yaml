title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/mm:
  Do not map lowcore with identity mapping\n\nSince the identity mapping is pinned
  to address zero the lowcore is always\nalso mapped to address zero, this happens
  regardless of the relocate_lowcore\ncommand line option. If the option is specified
  the lowcore is mapped\ntwice, instead of only once.\n\nThis means that NULL pointer
  accesses will succeed instead of causing an\nexception (low address protection still
  applies, but covers only parts).\nTo fix this never map the first two pages of physical
  memory with the\nidentity mapping."
