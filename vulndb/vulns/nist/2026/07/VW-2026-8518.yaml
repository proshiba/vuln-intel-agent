title: The Smartcat Translator for WPML plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  'routeData' REST endpoint in all versions up to, and including, 3.1.77. This 
  makes it possible for unauthenticated attackers to overwrite the plugin's 
  Smartcat API credentials (account ID, API secret key, hub key, API host, and 
  hub host), effectively hijacking the translation service or causing a denial 
  of service.
