title: 'Electron is a framework for writing cross-platform desktop applications using
  JavaScript, HTML and CSS. Prior to versions 38.8.6, 39.8.4, 40.8.4, and 41.0.0,
  the nodeIntegrationInWorker webPreference was not correctly scoped in all configurations.
  In certain process-sharing scenarios, workers spawned in frames configured with
  nodeIntegrationInWorker: false could still receive Node.js integration. Apps are
  only affected if they enable nodeIntegrationInWorker. Apps that do not use nodeIntegrationInWorker
  are not affected. This issue has been patched in versions 38.8.6, 39.8.4, 40.8.4,
  and 41.0.0.'
