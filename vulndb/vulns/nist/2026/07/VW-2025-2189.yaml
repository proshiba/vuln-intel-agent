title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/rmap:
  fix potential out-of-bounds page table access during batched unmap\n\nAs pointed
  out by David[1], the batched unmap logic in\ntry_to_unmap_one() may read past the
  end of a PTE table when a large\nfolio's PTE mappings are not fully contained within
  a single page\ntable.\n\nWhile this scenario might be rare, an issue triggerable
  from userspace\nmust be fixed regardless of its likelihood.  This patch fixes the\n\
  out-of-bounds access by refactoring the logic into a new helper,\nfolio_unmap_pte_batch().\n\
  \nThe new helper correctly calculates the safe batch size by capping the\nscan at
  both the VMA and PMD boundaries.  To simplify the code, it also\nsupports partial
  batching (i.e., any number of pages from 1 up to the\ncalculated safe maximum),
  as there is no strong reason to special-case\nfor fully mapped folios."
