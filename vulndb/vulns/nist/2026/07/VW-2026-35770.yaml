title: MemProcFS before 5.17 contains multiple unsafe library-loading patterns 
  that enable DLL and shared-library hijacking across six attack surfaces, 
  including bare-name LoadLibraryU and dlopen calls without path qualification 
  for vmmpyc, libMSCompression, and plugin DLLs. An attacker who places a 
  malicious DLL or shared library in the working directory or manipulates 
  LD_LIBRARY_PATH can achieve arbitrary code execution when MemProcFS loads.
