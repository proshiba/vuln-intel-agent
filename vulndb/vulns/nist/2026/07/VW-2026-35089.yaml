title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  shaper: protect late read accesses to the hierarchy\n\nWe look up a netdev during
  prep of Netlink ops (pre- callbacks)\nand take a ref to it. Then later in the body
  of the callback\nwe take its lock or RCU which are the actual protections.\n\nThis
  is not proper, a conversion from a ref to a locked netdev\nmust include a liveness
  check (a check if the netdev hasn't been\nunregistered already). Fix the read cases
  (those under RCU).\nWrites needs a separate change to protect from creating the\n\
  hierarchy after flush has already run."
