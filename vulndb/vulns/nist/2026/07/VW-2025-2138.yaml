title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  QOS: Refactor TC_HTB_LEAF_DEL_LAST callback\n\nThis patch addresses below issues,\n\
  \n1. Active traffic on the leaf node must be stopped before its send queue\n   is
  reassigned to the parent. This patch resolves the issue by marking\n   the node
  as 'Inner'.\n\n2. During a system reboot, the interface receives TC_HTB_LEAF_DEL\n\
  \   and TC_HTB_LEAF_DEL_LAST callbacks to delete its HTB queues.\n   In the case
  of TC_HTB_LEAF_DEL_LAST, although the same send queue\n   is reassigned to the parent,
  the current logic still attempts to update\n   the real number of queues, leadning
  to below warnings\n\n        New queues can't be registered after device unregistration.\n\
  \        WARNING: CPU: 0 PID: 6475 at net/core/net-sysfs.c:1714\n        netdev_queue_update_kobjects+0x1e4/0x200"
