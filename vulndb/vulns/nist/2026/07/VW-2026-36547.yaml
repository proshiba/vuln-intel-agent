title: vBulletin 5.x through 5.7.5 and 6.x through 6.2.1 contains an eval 
  injection vulnerability in the vB5_Template_Runtime::runMaths() method within 
  the template runtime that allows unauthenticated remote attackers to execute 
  arbitrary PHP code by supplying crafted input through the pagenav[pagenumber] 
  parameter. Attackers can exploit the insufficiently restrictive regex filter 
  by using phpfuck-style encoding with permitted characters to inject and 
  execute arbitrary PHP code via the unauthenticated ajax/render template route 
  without any authentication.
