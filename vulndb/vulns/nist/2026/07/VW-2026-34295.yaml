title: A vulnerability was determined in Cyber-III Student-Management-System up 
  to 1a938fa61e9f735078e9b291d2e6215b4942af3f. Impacted is an unknown function 
  of the file /admin/class%20schedule/delete_batch.php of the component Class 
  Schedule Deletion Endpoint. Executing a manipulation of the argument batch can
  lead to cross site scripting. The attack can be launched remotely. The exploit
  has been publicly disclosed and may be utilized. This product does not use 
  versioning. This is why information about affected and unaffected releases are
  unavailable. The project was informed of the problem early through an issue 
  report but has not responded yet.
