title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/ip6_tunnel:
  Prevent perpetual tunnel growth\n\nSimilarly to ipv4 tunnel, ipv6 version updates
  dev->needed_headroom, too.\nWhile ipv4 tunnel headroom adjustment growth was limited
  in\ncommit 5ae1e9922bbd (\"net: ip_tunnel: prevent perpetual headroom growth\"),\n\
  ipv6 tunnel yet increases the headroom without any ceiling.\n\nReflect ipv4 tunnel
  headroom adjustment limit on ipv6 version.\n\nCredits to Francesco Ruggeri, who
  was originally debugging this issue\nand wrote local Arista-specific patch and a
  reproducer."
