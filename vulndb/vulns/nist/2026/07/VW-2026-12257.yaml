title: A flaw was found in gnutls. The PKCS#7 padding check, performed during 
  decryption, was not constant-time. This timing side-channel could allow a 
  remote attacker to potentially leak sensitive information about the padding 
  bytes through observable timing differences. This vulnerability is a form of 
  information disclosure.
