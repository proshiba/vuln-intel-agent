title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: Fix use-after-free in cifs_fill_dirent\n\nThere is a race condition in the
  readdir concurrency process, which may\naccess the rsp buffer after it has been
  released, triggering the\nfollowing KASAN warning.\n\n ==================================================================\n\
  \ BUG: KASAN: slab-use-after-free in cifs_fill_dirent+0xb03/0xb60 [cifs]\n Read
  of size 4 at addr ffff8880099b819c by task a.out/342975\n\n CPU: 2 UID: 0 PID: 342975
  Comm: a.out Not tainted 6.15.0-rc6+ #240 PREEMPT(full)\n Hardware name: QEMU Standard
  PC (i440FX + PIIX, 1996), BIOS 1.16.1-2.fc37 04/01/2014\n Call Trace:\n  <TASK>\n\
  \  dump_stack_lvl+0x53/0x70\n  print_report+0xce/0x640\n  kasan_report+0xb8/0xf0\n\
  \  cifs_fill_dirent+0xb03/0xb60 [cifs]\n  cifs_readdir+0x12cb/0x3190 [cifs]\n  iterate_dir+0x1a1/0x520\n\
  \  __x64_sys_getdents+0x134/0x220\n  do_syscall_64+0x4b/0x110\n  entry_SYSCALL_64_after_hwframe+0x76/0x7e\n\
  \ RIP: 0033:0x7f996f64b9f9\n Code: ff c3 66"
