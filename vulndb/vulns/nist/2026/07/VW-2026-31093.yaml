title: SurrealDB versions 3.1.0 before 3.1.5 fail to enforce field-level SELECT 
  permissions when records are accessed through graph-edge or back-reference 
  traversals. Attackers with table-level SELECT access can read field values 
  hidden by field-level permissions by materializing records through graph 
  traversals instead of direct table scans.
