title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: discard erroneous disassoc frames on STA interface\n\nWhen operating in
  concurrent STA/AP mode with host MLME enabled,\nthe firmware incorrectly sends disassociation
  frames to the STA\ninterface when clients disconnect from the AP interface.\nThis
  causes kernel warnings as the STA interface processes\ndisconnect events that don't
  apply to it:\n\n[ 1303.240540] WARNING: CPU: 0 PID: 513 at net/wireless/mlme.c:141
  cfg80211_process_disassoc+0x78/0xec [cfg80211]\n[ 1303.250861] Modules linked in:
  8021q garp stp mrp llc rfcomm bnep btnxpuart nls_iso8859_1 nls_cp437 onboard_us\n\
  [ 1303.327651] CPU: 0 UID: 0 PID: 513 Comm: kworker/u9:2 Not tainted 6.16.0-rc1+
  #3 PREEMPT\n[ 1303.335937] Hardware name: Toradex Verdin AM62 WB on Verdin Development
  Board (DT)\n[ 1303.343588] Workqueue: MWIFIEX_RX_WORK_QUEUE mwifiex_rx_work_queue
  [mwifiex]\n[ 1303.350856] pstate: 60000005 (nZCv daif -PAN -UAO -TCO -DIT -SSBS
  BTYPE=--)\n[ 1303.3579"
