title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.8.11 before 0.10.0, POST /api/v1/images/edit required only
  a verified account and did not enforce the global image-edit switch or the 
  per-user image-generation permission, allowing a non-admin user to invoke 
  server-side image editing with administrator-configured provider credentials. 
  This issue is fixed in version 0.10.0.
