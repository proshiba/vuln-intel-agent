title: In schreibfaul1 ESP32-audioI2S 3.4.5, a heap-based buffer overflow in the
  ID3v2 SYLT synchronized lyrics parser in audiolib allows remote attackers to 
  cause a denial of service (application crash), information disclosure, or 
  potential arbitrary code execution via a crafted MP3 file. The vulnerability 
  occurs due to missing bounds validation on attacker-controlled frame size and 
  improper memory access during lyric parsing.
