title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: Reject SEV{-ES} intra host migration if vCPU creation is in-flight\n\nReject
  migration of SEV{-ES} state if either the source or destination VM\nis actively
  creating a vCPU, i.e. if kvm_vm_ioctl_create_vcpu() is in the\nsection between incrementing
  created_vcpus and online_vcpus.  The bulk of\nvCPU creation runs _outside_ of kvm->lock
  to allow creating multiple vCPUs\nin parallel, and so sev_info.es_active can get
  toggled from false=>true in\nthe destination VM after (or during) svm_vcpu_create(),
  resulting in an\nSEV{-ES} VM effectively having a non-SEV{-ES} vCPU.\n\nThe issue
  manifests most visibly as a crash when trying to free a vCPU's\nNULL VMSA page in
  an SEV-ES VM, but any number of things can go wrong.\n\n  BUG: unable to handle
  page fault for address: ffffebde00000000\n  #PF: supervisor read access in kernel
  mode\n  #PF: error_code(0x0000) - not-present page\n  PGD 0 P4D 0\n  Oops: Oops:
  0000 [#1] SMP KASAN NOPTI\n  "
