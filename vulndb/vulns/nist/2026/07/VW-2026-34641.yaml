title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/time:
  Remove redundant preempt_disable|enable() calls from arch_irq_work_raise()\n\nA
  kernel panic is observed when handling machine check exceptions from\nreal mode.\n\
  \n  BUG: Unable to handle kernel data access on read at 0xc00000006be21300\n  Oops:
  Kernel access of bad area, sig: 11 [#1]\n  MSR:  8000000000001003 <SF,ME,RI,LE>\
  \  CR: 88222248  XER: 00000005\n  CFAR: c00000000003ffc4 DAR: c00000006be21300 DSISR:
  40000000 IRQMASK: 0\n  NIP [c000000000029e40] arch_irq_work_raise+0x10/0x70\n  LR
  [c00000000003ffc8] machine_check_queue_event+0xa8/0x150\n  Call Trace:\n  [c0000000179d3c70]
  [c00000000003ff64] machine_check_queue_event+0x44/0x150\n  [c0000000179d3d30] [c0000000000084e0]
  machine_check_early_common+0x1f0/0x2c0\n\nThe crash occurs because arch_irq_work_raise()
  calls preempt_disable()\nfrom machine check exception (MCE) handlers running in
