title: GoAccess is a real-time web log analyzer and interactive viewer that runs
  in a terminal in *nix systems or through the browser. Prior to version 1.11, 
  the built-in WebSocket server narrows a 64-bit extended frame length into the 
  signed 32-bit WSFrame.payloadlen field before enforcing the maximum frame 
  size, allowing an unauthenticated remote client to bypass the guard and force 
  an approximately 18-exabyte allocation request that terminates the process. 
  This issue is fixed in version 1.11.
