title: Directus is a real-time API and App dashboard for managing SQL database 
  content. Prior to 11.16.1, Directus is vulnerable to an open redirect via the 
  redirect query parameter on the /admin/tfa-setup page. When an administrator 
  who has not yet configured Two-Factor Authentication (2FA) visits a crafted 
  URL, they are presented with the legitimate Directus 2FA setup page. After 
  completing the setup process, the application redirects the user to the 
  attacker-controlled URL specified in the redirect parameter without any 
  validation. This vulnerability could be used in phishing attacks targeting 
  Directus administrators, as the initial interaction occurs on a trusted 
  domain. This vulnerability is fixed in 11.16.1.
