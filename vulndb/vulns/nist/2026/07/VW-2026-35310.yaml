title: Chyrp Lite is an ultra-lightweight blogging engine. Prior to 2026.01, a 
  path traversal vulnerability exists in the administration console that allows 
  an administrator or a user with Change Settings permission to change the 
  uploads path to any folder. This vulnerability allows the user to download any
  file on the server, including config.json.php with database credentials and 
  overwrite critical system files, leading to remote code execution. This 
  vulnerability is fixed in 2026.01.
