title: Docmost is open-source collaborative wiki and documentation software. An 
  authorization bypass vulnerability in versions 0.70.0 through 0.70.2 exposes 
  restricted child page titles and text snippets through the public search 
  endpoint (`POST /api/search/share-search`) for publicly shared content. This 
  flaw allows unauthenticated users to enumerate and retrieve content that 
  should remain hidden from public share viewers, leading to a confidentiality 
  breach. Version 0.70.3 contains a patch.
