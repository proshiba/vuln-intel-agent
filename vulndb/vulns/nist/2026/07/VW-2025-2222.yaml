title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  airoha: fix potential use-after-free in airoha_npu_get()\n\nnp->name was being used
  after calling of_node_put(np), which\nreleases the node and can lead to a use-after-free
  bug.\nPreviously, of_node_put(np) was called unconditionally after\nof_find_device_by_node(np),
  which could result in a use-after-free if\npdev is NULL.\n\nThis patch moves of_node_put(np)
  after the error check to ensure\nthe node is only released after both the error
  and success cases\nare handled appropriately, preventing potential resource issues."
