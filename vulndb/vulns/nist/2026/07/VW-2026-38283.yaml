title: Wolf CMS through 0.8.3.1 contains a remote code execution vulnerability 
  in FileManagerController that allows authenticated attackers to create 
  arbitrary PHP files by exploiting missing file extension validation in the 
  create_file() and save() functions. Attackers with the file_manager_mkfile 
  capability can write malicious PHP content into the web-accessible FILES_DIR 
  directory and trigger execution by requesting the file over HTTP.
