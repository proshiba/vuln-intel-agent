title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/ops-common:
  handle extreme intervals in damon_hot_score()\n\nFix three issues in damon_hot_score()
  that comes from wrong handling of\nextreme (zero or too high) monitoring intervals
  user setup.\n\nWhen the user sets sampling interval zero, damon_max_nr_accesses(),
  which\nis called from damon_hot_score(), causes a divide-by-zero.  Needless to\n\
  say, it is a problem.\n\nWhen the user sets the aggregation interval zero, the function
  returns\nzero.  It is wrong, since the real maximum nr_acceses in the setup should\n\
  be one.  Worse yet, it can cause another divide-by-zero from its caller,\ndamon_hot_score(),
  since it uses damon_max_nr_accesses() return value as a\ndenominator.\n\nWhen the
  user sets the aggregation interval very high, damon_hot_score()\ncould return a
  value out of [0, DAMOS_MAX_SCORE] range.  Since the return\nvalue is used as an
  index to the regions_score_histogram array, which is\nDAMOS_MAX_SCORE+1 size, it
  causes "
