title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphy:
  qcom: qmp-usbc: Fix out-of-bounds array access in dp swing config\n\nswing_tbl and
  pre_emphasis_tbl are 4x4 arrays (valid indices 0-3), but\nthe boundary check uses
  \"> 4\" instead of \">= 4\", allowing index 4 to\ncause an out-of-bounds access."
