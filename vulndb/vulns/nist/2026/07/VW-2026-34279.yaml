title: A security vulnerability has been detected in JeecgBoot 3.9.0/3.9.1. The 
  impacted element is an unknown function of the file 
  jeecg-boot/jeecg-module-system/jeecg-system-biz/src/main/java/org/jeecg/modules/airag/JeecgBizToolsProvider.java
  of the component AI Chat Module. Such manipulation leads to missing 
  authentication. The attack can be executed remotely. The name of the patch is 
  b7c9aeba7aefda9e008ea8fe4fc3daf08d0c5b39/2c1cc88b8d983868df8c520a343d6ff4369d9e59.
  It is best practice to apply a patch to resolve this issue. The project fixed 
  the issue with a commit which shall be part of the next official release.
