title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  mtk-jpeg: cancel workqueue on release for supported platforms only\n\nSince a recent
  fix the mtk_jpeg_release function cancels any pending\nor running work present in
  the driver workqueue using\ncancel_work_sync function.\nCurrently, only the multicore
  based variants use this workqueue and they\nhave the jpeg_worker platform data field
  initialized with a workqueue\ncallback function. For the others, this field value
  remain NULL by\ndefault.\nThe cancel_work_sync function is unconditionally called
  in\nmtk_jpeg_release function, even for the variants that do not use the\nworkqueue.
  This call generates a WARN_ON print in __flush_work because\nthe workqueue callback
  function presence check fails in __flush_work\nfunction (used by cancel_work_sync).\n\
  \nSo, to avoid these warnings, call cancel_work_sync only if a workqueue\ncallback
  is defined in platform data."
