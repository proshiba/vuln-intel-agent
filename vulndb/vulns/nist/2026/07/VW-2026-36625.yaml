title: A use-after-free (UAF) vulnerability was discovered in the core parsing 
  component of SQLite 3.41. The flaw occurs because the program frees an 
  ExprList object via sqlite3ExprListDelete and then subsequently accesses the 
  dangling pointer of the released object. A remote adversary can supply 
  specially crafted SQL queries to trigger this vulnerability during SQL 
  statement parsing. Successful exploitation may result in application crash 
  (denial of service), sensitive memory information leakage, and in some 
  scenarios, arbitrary code execution on the affected host.
