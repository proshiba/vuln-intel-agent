title: Saleor is an e-commerce platform. From 2.10.0 to before 3.23.0a3, 
  3.22.47, 3.21.54, and 3.20.118, a business-logic and authorization flaw was 
  found in the account email change workflow, the confirmation flow did not 
  verify that the email change confirmation token was issued for the given 
  authenticated user. As a result, a valid email-change token generated for one 
  account can be replayed while authenticated as a different account. The second
  account’s email address is then updated to the token's new_email, even though 
  that token was never issued for that account. This vulnerability is fixed in 
  3.23.0a3, 3.22.47, 3.21.54, and 3.20.118.
