title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: fix 22000 series SMEM parsing\n\nIf the firmware were to report three LMACs
  (which doesn't\nexist in hardware) then using \"fwrt->smem_cfg.lmac[2]\" is\nan
  overrun of the array. Reject such and use IWL_FW_CHECK\ninstead of WARN_ON in this
  function."
