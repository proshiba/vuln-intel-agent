title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix MLE defragmentation\n\nIf either reconf or EPCS multi-link element
  (MLE) is contained in\na non-transmitted profile, the defragmentation routine is
  called\nwith a pointer to the defragmented copy, but the original elements.\n\n\
  This is incorrect for two reasons:\n - if the original defragmentation was needed,
  it will not find the\n   correct data\n - if the original frame is at a higher address,
  the parsing will\n   potentially overrun the heap data (though given the layout
  of\n   the buffers, only into the new defragmentation buffer, and then\n   it has
  to stop and fail once that's filled with copied data.\n\nFix it by tracking the
  container along with the pointer and in\ndoing so also unify the two almost identical
  defragmentation\nroutines."
