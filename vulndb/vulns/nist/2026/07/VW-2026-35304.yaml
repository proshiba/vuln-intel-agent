title: 'A weakness has been identified in givanz Vvvebjs up to 2.0.5. The affected
  element is an unknown function of the file upload.php of the component File Upload
  Endpoint. This manipulation of the argument uploadAllowExtensions causes cross site
  scripting. Remote exploitation of the attack is possible. The exploit has been made
  available to the public and could be used for attacks. Patch name: 8cac22cff99b8bc701c408aa8e887fa702755336.
  Applying a patch is the recommended action to fix this issue. The vendor was contacted
  early, responded in a very professional manner and quickly released a fixed version
  of the affected product.'
