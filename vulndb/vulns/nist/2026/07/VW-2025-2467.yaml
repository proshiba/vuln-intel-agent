title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  6lowpan: reset link-local header on ipv6 recv path\n\nBluetooth 6lowpan.c netdev
  has header_ops, so it must set link-local\nheader for RX skb, otherwise things crash,
  eg. with AF_PACKET SOCK_RAW\n\nAdd missing skb_reset_mac_header() for uncompressed
  ipv6 RX path.\n\nFor the compressed one, it is done in lowpan_header_decompress().\n\
  \nLog: (BlueZ 6lowpan-tester Client Recv Raw - Success)\n------\nkernel BUG at net/core/skbuff.c:212!\n\
  Call Trace:\n<IRQ>\n...\npacket_rcv (net/packet/af_packet.c:2152)\n...\n<TASK>\n\
  __local_bh_enable_ip (kernel/softirq.c:407)\nnetif_rx (net/core/dev.c:5648)\nchan_recv_cb
  (net/bluetooth/6lowpan.c:294 net/bluetooth/6lowpan.c:359)\n------"
