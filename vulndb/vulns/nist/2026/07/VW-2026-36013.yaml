title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  fsl-lpspi: terminate the RX channel on TX prepare failure path\n\nWhen dmaengine_prep_slave_sg()
  fails for the TX channel, the error path\nterminates the TX DMA channel but leaves
  the RX channel running. Since\nthe RX channel was already submitted and issued prior
  to preparing\nthe TX descriptor, returning -EINVAL causes the SPI core to unmap
  the\nDMA buffers while the RX DMA engine continues writing to them, leading\nto
  potential memory corruption or use-after-free.\n\nTerminate the RX channel before
  returning on the TX prepare failure path."
