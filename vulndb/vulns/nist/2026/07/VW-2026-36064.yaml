title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Validate BTF repeated field counts before expansion\n\nbtf_parse_struct_metas()
  walks user-supplied BTF during BPF_BTF_LOAD,\nand btf_repeat_fields() expands repeatable
  fields from array elements\ninto the fixed BTF_FIELDS_MAX scratch array used by
  btf_parse_fields().\n\nThe remaining-capacity check performs the expanded field
  count calculation\nin u32. A malformed BTF can wrap that calculation, causing the
  check to\npass even when the expanded field count exceeds the scratch array\ncapacity.
  The following memcpy() can then write past the end of the\narray.\n\nUse checked
  addition and multiplication before copying repeated fields\nand reject impossible
  counts."
