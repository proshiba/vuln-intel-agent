title: A vulnerability was identified in Trendnet TEW-657BRM 1.00.1. The 
  affected element is the function add_apcdb of the file /setup.cgi. The 
  manipulation of the argument mac_pc_dba leads to stack-based buffer overflow. 
  The attack can be initiated remotely. The exploit is publicly available and 
  might be used. The vendor confirms, that "[t]he product in question (...) has 
  been discontinued and end of life since June 23, 2011, that is more than 14 
  years ago. We no longer provide support for this product, so we are not able 
  to confirm the vulnerabilities. We will make an announcement on our website's 
  product support page and notify customers who registered their products with 
  us." This vulnerability only affects products that are no longer supported by 
  the maintainer.
