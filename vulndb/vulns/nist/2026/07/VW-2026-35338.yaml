title: WeGIA is a Web manager for charitable institutions. Prior to 3.6.9, WeGIA
  (Web gerenciador para instituições assistenciais) contains a SQL injection 
  vulnerability in dao/memorando/DespachoDAO.php. The id_memorando parameter is 
  extracted from $_REQUEST without validation and directly interpolated into SQL
  queries, allowing any authenticated user to execute arbitrary SQL commands 
  against the database. This vulnerability is fixed in 3.6.9.
