title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  add permission checks for FSCTL_DUPLICATE_EXTENTS_TO_FILE\n\nThe FSCTL_DUPLICATE_EXTENTS_TO_FILE
  arm of smb2_ioctl() overwrites the\ndestination file's data via vfs_clone_file_range()
  with neither the\nshare-level KSMBD_TREE_CONN_FLAG_WRITABLE check nor a per-handle\n\
  fp->daccess check that the other write-bearing arms carry. A client can\noverwrite
  destination data on a read-only share, or from a handle opened\nwith only FILE_WRITE_ATTRIBUTES
  (which still yields an FMODE_WRITE filp).\nFILE_WRITE_ATTRIBUTES-only destination
  handle overwrote the file's data via\nthe clone. Add both checks, matching the FSCTL_SET_SPARSE
  permission fix;\nrequire FILE_WRITE_DATA since this writes data."
