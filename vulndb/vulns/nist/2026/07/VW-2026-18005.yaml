title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  log: fix out-of-bounds write due to region_count overflow\n\nThe local variable
  region_count in create_log_context() is declared as\nunsigned int (32-bit), but
  dm_sector_div_up() returns sector_t (64-bit).\nWhen a device-mapper target has a
  sufficiently large ti->len with a small\nregion_size, the division result can exceed
  UINT_MAX. The truncated\nvalue is then used to calculate bitset_size, causing clean_bits,\n\
  sync_bits, and recovering_bits to be allocated far smaller than needed\nfor the
  actual number of regions.\n\nSubsequent log operations (log_set_bit, log_clear_bit,
  log_test_bit) use\nregion indices derived from the full untruncated region space,
  causing\nout-of-bounds writes to kernel heap memory allocated by vmalloc.\n\nThis
  can be reproduced by creating a mirror target whose region_count\noverflows 32 bits:\n\
  \n  dmsetup create bigzero --table '0 8589934594 zero'\n  dmsetup create mymirror
  --table '0 8589934594 mirror \\\n  "
