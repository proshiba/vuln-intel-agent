title: PJSIP is a free and open source multimedia communication library written 
  in C. Prior to version 2.17, a heap out-of-bounds read vulnerability exists in
  PJSIP's VP9 RTP unpacketizer that occurs when parsing crafted VP9 Scalability 
  Structure (SS) data. Insufficient bounds checking on the payload descriptor 
  length may cause reads beyond the allocated RTP payload buffer. This issue has
  been patched in version 2.17. A workaround for this issue involves disabling 
  VP9 codec if not needed.
