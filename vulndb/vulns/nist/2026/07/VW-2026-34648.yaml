title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  ti-qspi: fix use-after-free after DMA setup failure\n\nThe driver falls back to
  PIO mode if DMA setup fails during probe.\n\nMake sure to clear the DMA channel
  pointer also if buffer allocation\nfails to avoid passing a pointer to the released
  channel to the DMA\nengine (or trying to free the channel a second time on late
  probe errors\nor driver unbind).\n\nThis issue was flagged by Sashiko when reviewing
  a devres allocation\nconversion patch."
