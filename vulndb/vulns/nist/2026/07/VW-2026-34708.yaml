title: "Inefficient Algorithmic Complexity vulnerability in mtrudel bandit allows
  unauthenticated remote denial of service via CPU exhaustion during WebSocket fragment
  reassembly.\n\nThe size guard 'Elixir.Bandit.WebSocket.Connection':oversize_message?/2
  called from handle_frame/3 in lib/bandit/websocket/connection.ex appends each non-final
  continuation frame to a left-nested iolist and then re-measures the entire accumulated
  buffer with IO.iodata_length/1 on every frame. Because the buffer grows by one element
  per frame and is fully re-traversed each time, reassembly work is quadratic (O(n^2))
  in the number of continuation frames.\n\nThe max_fragmented_message_size limit (default
  8 MB) bounds total bytes but not frame count, and each frame can carry as little
  as one payload byte, so an attacker can send millions of tiny continuation frames
  using modest bandwidth to pin a CPU core for minutes to hours. Many concurrent connections
  can starve the whole server of CPU, denying service to legitimate us"
