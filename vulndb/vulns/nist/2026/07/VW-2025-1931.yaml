title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  validate l_tree_depth to avoid out-of-bounds access\n\nThe l_tree_depth field is
  16-bit (__le16), but the actual maximum depth is\nlimited to OCFS2_MAX_PATH_DEPTH.\n\
  \nAdd a check to prevent out-of-bounds access if l_tree_depth has an invalid\nvalue,
  which may occur when reading from a corrupted mounted disk [1]."
