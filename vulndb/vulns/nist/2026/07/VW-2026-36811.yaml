title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio-net:
  fix len check in receive_big()\n\nreceive_big() bounds the device-announced length
  by\n(big_packets_num_skbfrags + 1) * PAGE_SIZE.  That is still too loose:\nadd_recvbuf_big()
  sets sg[1] to start at offset\nsizeof(struct padded_vnet_hdr) into the first page,
  so the chain\nactually carries hdr_len + (PAGE_SIZE - sizeof(padded_vnet_hdr)) +\n\
  big_packets_num_skbfrags * PAGE_SIZE bytes -- 20 bytes less than the\ncheck allows
  for the common hdr_len == 12 case.\n\nA malicious virtio backend can announce a
  len in that gap.  page_to_skb()\nthen walks one frag past the page chain, storing
  a NULL page->private\ninto skb_shinfo()->frags[MAX_SKB_FRAGS], which is both an
  out-of-bounds\nwrite past the static frag array and a NULL frag handed up the rx
  path.\n\nBound len by the size add_recvbuf_big() actually advertised."
