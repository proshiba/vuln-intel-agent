title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  fix potential use-after-free in have_mon_and_osd_map()\n\nThe wait loop in __ceph_open_session()
  can race with the client\nreceiving a new monmap or osdmap shortly after the initial
  map is\nreceived.  Both ceph_monc_handle_map() and handle_one_map() install\na new
  map immediately after freeing the old one\n\n    kfree(monc->monmap);\n    monc->monmap
  = monmap;\n\n    ceph_osdmap_destroy(osdc->osdmap);\n    osdc->osdmap = newmap;\n\
  \nunder client->monc.mutex and client->osdc.lock respectively, but\nbecause neither
  is taken in have_mon_and_osd_map() it's possible for\nclient->monc.monmap->epoch
  and client->osdc.osdmap->epoch arms in\n\n    client->monc.monmap && client->monc.monmap->epoch
  &&\n        client->osdc.osdmap && client->osdc.osdmap->epoch;\n\ncondition to dereference
  an already freed map.  This happens to be\nreproducible with generic/395 and generic/397
  with KASAN enabled:\n\n    BUG: KASAN: slab-use-after-free in have_mon"
