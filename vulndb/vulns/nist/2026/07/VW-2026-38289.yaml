title: WACRM is a self-hostable CRM template for WhatsApp. In 0.7.0 and earlier,
  the automation send_webhook action in src/lib/automations/engine.ts and its 
  validation in src/lib/automations/validate.ts allowed an authenticated user 
  with automation privileges to submit an arbitrary webhook URL that the server 
  fetched without the existing isDeliverableUrl SSRF guard in 
  src/lib/webhooks/ssrf.ts, allowing requests to private, loopback, link-local, 
  or cloud metadata addresses such as the cloud metadata endpoint at 
  169.254.169.254. This vulnerability is fixed with commit 
  23838a9959550e975d732ae08a44a3a2f0cc084b.
