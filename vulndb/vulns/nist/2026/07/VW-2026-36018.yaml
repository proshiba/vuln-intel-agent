title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Do not initialize SNP for ioctl(SNP_VLEK_LOAD)\n\nSashiko notes:\n\n> if SEV
  initialization fails and KVM is actively running normal VMs, could a\n> userspace
  process trigger this code path via /dev/sev ioctls (e.g.,\n> SEV_PDH_GEN) and zero
  out MSR_VM_HSAVE_PA globally? Would the next VMRUN\n> execution for an active VM
  trigger a general protection fault and crash the\n> host?\n\nThe SEV firmware docs
  for SNP_VLEK_LOAD note:\n\n> On SNP_SHUTDOWN, the VLEK is deleted.\n\nThat is, the
  initialization/shutdown wrapper here is pointless, because the\nfirmware immediately
  throws away the key anyway. Instead, refuse to do\nanything if SNP has not been
  previously initialized.\n\nThis is an ABI break: before, this was a no-op and almost
  certainly a\nmistake by userspace, and now it returns -ENODEV. ABI compatibility
  could be\nmaintained here by simply returning 0 in the check instead."
