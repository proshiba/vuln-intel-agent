title: ImageMagick before 7.1.2-26 and 6.9.13-51 contains a memory leak in the 
  TIFF encoder when an invalid tiff:tile-geometry is specified. Supplying 
  malformed tile geometry parameters causes allocated memory not to be released,
  which can lead to increased memory consumption.
