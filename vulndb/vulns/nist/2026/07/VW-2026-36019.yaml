title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Do not initialize SNP for ioctl(SNP_COMMIT)\n\nSashiko notes:\n\n> if SEV
  initialization fails and KVM is actively running normal VMs, could a\n> userspace
  process trigger this code path via /dev/sev ioctls (e.g.,\n> SEV_PDH_GEN) and zero
  out MSR_VM_HSAVE_PA globally? Would the next VMRUN\n> execution for an active VM
  trigger a general protection fault and crash the\n> host?\n\nThe SNP_COMMIT command
  does not require the firmware to be in any\nparticular state. Skip initializing
  it if it was previously uninitialized.\n\nThe SEV-SNP firmware specification doc
  56860 does not mention SNP_COMMIT in\nTable 5 as a command that is allowed in the
  UNINIT state, but it is in fact\nallowed and a future documentation update will
  reflect that."
