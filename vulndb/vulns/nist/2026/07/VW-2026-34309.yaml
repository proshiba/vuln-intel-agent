  component in AWS Research and Engineering Studio (RES) prior to version 2026.03
  could allow an authenticated remote user to escalate privileges, assume the virtual
  desktop host instance profile permissions, and interact with AWS resources and services
  via a crafted API request.\n\nTo remediate this issue, users are advised to upgrade
  to RES version 2026.03 or apply the corresponding mitigation patch to their existing
  environment."
