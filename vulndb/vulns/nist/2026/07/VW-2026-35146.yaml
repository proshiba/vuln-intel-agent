title: nimiq/core-rs-albatross is a Rust implementation of the Nimiq 
  Proof-of-Stake protocol based on the Albatross consensus algorithm. Prior to 
  version 1.3.0, the discovery handler accepts a peer-controlled limit during 
  handshake and stores it unchanged. The immediate HandshakeAck path then honors
  limit = 0 and returns zero contacts, which makes the session look benign. 
  Later, after the same session reaches Established, the periodic update path 
  computes self.peer_list_limit.unwrap() as usize - 1. With limit = 0, that 
  wraps to usize::MAX and then in rand 0.9.2, choose_multiple() immediately 
  attempts Vec::with_capacity(amount), which deterministically panics with 
  capacity overflow. This issue has been patched in version 1.3.0.
