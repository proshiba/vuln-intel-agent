title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexfat:
  fix random stack corruption after get_block\n\nWhen get_block is called with a buffer_head
  allocated on the stack, such\nas do_mpage_readpage, stack corruption due to buffer_head
  UAF may occur in\nthe following race condition situation.\n\n     <CPU 0>      \
  \                <CPU 1>\nmpage_read_folio\n  <<bh on stack>>\n  do_mpage_readpage\n\
  \    exfat_get_block\n      bh_read\n        __bh_read\n\t  get_bh(bh)\n       \
  \   submit_bh\n          wait_on_buffer\n                              ...\n   \
  \                           end_buffer_read_sync\n                             \
  \   __end_buffer_read_notouch\n                                   unlock_buffer\n\
  \          <<keep going>>\n        ...\n      ...\n    ...\n  ...\n<<bh is not valid
  out of mpage_read_folio>>\n   .\n   .\nanother_function\n  <<variable A on stack>>\n\
  \                                   put_bh(bh)\n                               \
  \      atomic_dec(bh->b_count)\n  * stack corruption here"
