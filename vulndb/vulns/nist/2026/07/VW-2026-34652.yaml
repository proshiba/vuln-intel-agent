title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  CGX: add bounds check to cgx_speed_mbps index\n\ncgx_speed_mbps has 13 elements
  but RESP_LINKSTAT_SPEED can yield values\n0-15. If it returns a value >= 13, this
  causes an out-of-bounds array\naccess. Add a bounds check and default to speed 0
  if the index is out of\nrange."
