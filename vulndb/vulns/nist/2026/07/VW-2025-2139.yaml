title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhisi_acc_vfio_pci:
  bugfix live migration function without VF device driver\n\nIf the VF device driver
  is not loaded in the Guest OS and we attempt to\nperform device data migration,
  the address of the migrated data will\nbe NULL.\nThe live migration recovery operation
  on the destination side will\naccess a null address value, which will cause access
  errors.\n\nTherefore, live migration of VMs without added VF device drivers\ndoes
  not require device data migration.\nIn addition, when the queue address data obtained
  by the destination\nis empty, device queue recovery processing will not be performed."
