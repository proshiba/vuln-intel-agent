title: Chamilo LMS is an open-source learning management system. In versions 
  prior to 2.0.0-RC.3, the /api/course_rel_users endpoint is vulnerable to 
  Insecure Direct Object Reference (IDOR), allowing an authenticated attacker to
  modify the user parameter in the request body to enroll any arbitrary user 
  into any course without proper authorization checks. The backend trusts the 
  user-supplied input for the user field and performs no server-side 
  verification that the requester owns the referenced user ID or has permission 
  to act on behalf of other users. This enables unauthorized manipulation of 
  user-course relationships, potentially granting unintended access to course 
  materials, bypassing enrollment controls, and compromising platform integrity.
  This issue has been fixed in version  2.0.0-RC.3.
