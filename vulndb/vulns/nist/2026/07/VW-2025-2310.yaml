title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  Fix NPD when refreshing an FDB entry with a nexthop object\n\nVXLAN FDB entries
  can point to either a remote destination or an FDB\nnexthop group. The latter is
  usually used in EVPN deployments where\nlearning is disabled.\n\nHowever, when learning
  is enabled, an incoming packet might try to\nrefresh an FDB entry that points to
  an FDB nexthop group and therefore\ndoes not have a remote. Such packets should
  be dropped, but they are\nonly dropped after dereferencing the non-existent remote,
  resulting in a\nNPD [1] which can be reproduced using [2].\n\nFix by dropping such
  packets earlier. Remove the misleading comment from\nfirst_remote_rcu().\n\n[1]\n\
  BUG: kernel NULL pointer dereference, address: 0000000000000000\n[...]\nCPU: 13
  UID: 0 PID: 361 Comm: mausezahn Not tainted 6.17.0-rc1-virtme-g9f6b606b6b37 #1 PREEMPT(voluntary)\n\
  Hardware name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.17.0-4.fc41 04/01/2014\n\
  RIP: 0010:vxlan_snoop"
