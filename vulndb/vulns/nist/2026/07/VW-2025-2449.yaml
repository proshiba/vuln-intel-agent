title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  delete x->tunnel as we delete x\n\nThe ipcomp fallback tunnels currently get deleted
  (from the various\nlists and hashtables) as the last user state that needed that
  fallback\nis destroyed (not deleted). If a reference to that user state still\n\
  exists, the fallback state will remain on the hashtables/lists,\ntriggering the
  WARN in xfrm_state_fini. Because of those remaining\nreferences, the fix in commit
  f75a2804da39 (\"xfrm: destroy xfrm_state\nsynchronously on net exit path\") is not
  complete.\n\nWe recently fixed one such situation in TCP due to defered freeing
  of\nskbs (commit 9b6412e6979f (\"tcp: drop secpath at the same time as we\ncurrently
  drop dst\")). This can also happen due to IP reassembly: skbs\nwith a secpath remain
  on the reassembly queue until netns\ndestruction. If we can't guarantee that the
  queues are flushed by the\ntime xfrm_state_fini runs, there may still be references
  to a (user)\nxfrm_state, preventing the"
