title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  misc: usbio: fix disconnect UAF in client teardown\n\nusbio_disconnect() walks usbio->cli_list
  in reverse and uninitializes each\nauxiliary device. auxiliary_device_uninit() drops
  the device reference, and\nfor an unbound child that can run usbio_auxdev_release()
  and free the\ncontaining struct usbio_client.\n\nlist_for_each_entry_reverse() advances
  after the loop body by reading\nclient->link.prev. If the current client is freed
  by\nauxiliary_device_uninit(), the iterator dereferences freed memory.\n\nUse list_for_each_entry_safe_reverse()
  so the previous client is\ncached before the body can drop the final reference.
  This preserves\nreverse teardown order while keeping the next iterator cursor independent\n\
  of the current client's lifetime.\n\nValidation reproduced this kernel report:\n\
  BUG: KASAN: slab-use-after-free in usbio_disconnect+0x12e/0x150\n\nCall Trace:\n\
  \ <TASK>\n dump_stack_lvl+0x66/0xa0\n print_report+0xce/0x630\n ? usbio_"
