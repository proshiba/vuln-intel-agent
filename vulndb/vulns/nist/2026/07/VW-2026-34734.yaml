  crafted DNS responses to a DNSdist using the DNSQuestion:changeName or 
  DNSResponse:changeName methods in custom Lua code. In some cases the rewritten
  packet might become larger than the initial response and even exceed 65535 
  bytes, potentially leading to a crash resulting in denial of service.
