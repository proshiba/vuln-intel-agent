title: 'Vulnerability in the PeopleSoft Enterprise CS Campus Community component of
  Oracle PeopleSoft Products (subcomponent: Frameworks). The supported version that
  is affected is 9.2. Easily "exploitable" vulnerability allows high privileged attacker
  with network access via HTTP to compromise PeopleSoft Enterprise CS Campus Community.
  Successful attacks of this vulnerability can result in unauthorized creation, deletion
  or modification access to critical data or all PeopleSoft Enterprise CS Campus Community
  accessible data as well as unauthorized access to critical data or complete access
  to all PeopleSoft Enterprise CS Campus Community accessible data. CVSS 3.0 Base
  Score 6.5 (Confidentiality and Integrity impacts). CVSS Vector: (CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:N).'
