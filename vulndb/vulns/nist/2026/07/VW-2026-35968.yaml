title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  remove request-less entries from ent_w_req_queue to fix NULL deref\n\nIf a copy
  into the userspace ring buffer fails, a request will be\nterminated and fuse_uring_req_end()
  will set ent->fuse_req to NULL but\nit will leave the entry on ent_w_req_queue in
  FRRS_FUSE_REQ state. This\ncan lead to a NULL deref if the request expiration logic
  scans\nent_w_req_queue in the window before the entry is moved off it.\n\nFix this
  by taking the entry off ent_w_req_queue and changing its state\nfrom FRRS_FUSE_REQ
  to FRRS_INVALID before terminating the request."
