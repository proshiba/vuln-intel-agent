title: PraisonAI is a multi-agent teams system. Prior to version 4.5.90, the 
  get_all_user_threads function constructs raw SQL queries using f-strings with 
  unescaped thread IDs fetched from the database. An attacker stores a malicious
  thread ID via update_thread. When the application loads the thread list, the 
  injected payload executes and grants full database access. This issue has been
  patched in version 4.5.90.
