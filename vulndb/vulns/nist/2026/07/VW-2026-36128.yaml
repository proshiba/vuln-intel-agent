title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  shrinker: fix shrinker_info teardown race with expansion\n\nexpand_shrinker_info()
  iterates all visible memcgs under shrinker_mutex,\nincluding memcgs that have not
  finished ->css_online() yet.\n\nOnce pn->shrinker_info has been published, teardown
  must stay serialized\nwith expand_shrinker_info() until that memcg is either fully
  online or no\nlonger visible to iteration.  Today alloc_shrinker_info() breaks that
