title: Core FTP 2.0 build 653 contains a denial of service vulnerability in the 
  PBSZ command that allows unauthenticated attackers to crash the service by 
  sending a malformed command with an oversized buffer. Attackers can send a 
  PBSZ command with a payload exceeding 211 bytes to trigger an access violation
  and crash the FTP server process.
