title: FileZilla 3.40.0 contains a denial of service vulnerability in the local 
  search functionality that allows local attackers to crash the application by 
  supplying a malformed path string. Attackers can trigger the crash by entering
  a crafted path containing 384 'A' characters followed by 'BBBB' and 'CCCC' 
  sequences in the search directory field and initiating a local search 
  operation.
