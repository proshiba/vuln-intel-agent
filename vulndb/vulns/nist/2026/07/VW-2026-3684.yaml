title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  spi-dw-dma: fix print error log when wait finish transaction\n\nIf an error occurs,
  the device may not have a current message. In this\ncase, the system will crash.\n\
  \nIn this case, it's better to use dev from the struct ctlr (struct spi_controller*)."
