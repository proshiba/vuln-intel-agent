title: Jellyfin is an open source self hosted media server. Versions prior to 
  10.11.7 contain an unauthenticated arbitrary file read vulnerability via 
  ffmpeg argument injection through the StreamOptions query parameter parsing 
  mechanism. The ParseStreamOptions method in StreamingHelpers.cs adds any 
  lowercase query parameter to a dictionary without validation, bypassing the 
  RegularExpression attribute on the level controller parameter, and the 
  unsanitized value is concatenated directly into the ffmpeg command line. By 
  injecting a drawtext filter with a textfile argument, an attacker can read 
  arbitrary server files such as /etc/shadow and exfiltrate their contents as 
  text rendered in the video stream response. The vulnerable 
  /Videos/{itemId}/stream endpoint has no Authorize attribute, making this 
  exploitable without authentication, though item GUIDs are pseudorandom and 
  require an authenticated user to obtain. This issue has been fixed in version 
  10.11.7.
