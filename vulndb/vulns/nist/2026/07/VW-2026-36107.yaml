title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  serialize QUERY_DIRECTORY requests per file\n\nsmb2_query_dir() stores a pointer
  to its stack-allocated private data in\nthe ksmbd_file readdir_data. Concurrent
  QUERY_DIRECTORY requests using the\nsame file handle can overwrite this pointer
  while an iterate_dir() callback\nis still using it, resulting in a stack use-after-free.\n\
  \nAdd a per-file mutex and hold it while accessing the shared directory\nenumeration
  state. The lock covers scan restart, dot entry state,\nreaddir_data setup and iteration,
  and response construction. This prevents\nanother request from replacing readdir_data.private
  before the current\nrequest has finished using it and also serializes the shared
  file position."
