title: "The SMS Alert – SMS & OTP for WooCommerce, Order Notifications & Abandoned
  Cart Recovery plugin for WordPress is vulnerable to generic SQL Injection via 'checkout_payment_plans'
  and 'order_status' Settings in all versions up to, and including, 3.9.7 due to insufficient
  escaping on the user supplied parameter and lack of sufficient preparation on the
  existing SQL query. This makes it possible for authenticated attackers, with administrator-level
  access and above, to append additional SQL queries into already existing queries
  that can be used to extract sensitive information from the database. This is a second-order
  SQL injection: the malicious payload is stored in the 'checkout_payment_plans' and
  'order_status' settings via update_option() and executed later when the cod_to_prepaid_cart_notification_sendsms_hook
  WP-Cron event fires SA_CodTOPrepaid::sendSms()."
