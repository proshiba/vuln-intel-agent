title: CI4MS is a CodeIgniter 4-based CMS skeleton that delivers a 
  production-ready, modular architecture with RBAC authorization and theme 
  support. Prior to 0.31.4.0, the Pages module does not apply the html_purify 
  validation rule to content fields during create and update operations, while 
  the Blog module does. Page content is stored unsanitized in the database and 
  rendered as raw HTML on the public frontend via echo $pageInfo->content. An 
  authenticated admin with page-editing privileges can inject arbitrary 
  JavaScript that executes in the browser of every public visitor viewing the 
  page. This vulnerability is fixed in 0.31.4.0.
