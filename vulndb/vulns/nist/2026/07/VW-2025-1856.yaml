title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: don't flush non-uploaded STAs\n\nIf STA state is pre-moved to AUTHORIZED
  (such as in IBSS\nscenarios) and insertion fails, the station is freed.\nIn this
  case, the driver never knew about the station,\nso trying to flush it is unexpected
  and may crash.\n\nCheck if the sta was uploaded to the driver before and\nfix this."
