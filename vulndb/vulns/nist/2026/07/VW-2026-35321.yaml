title: Brave CMS is an open-source CMS. Prior to 2.0.6, an Insecure Direct 
  Object Reference (IDOR) vulnerability exists in the article image deletion 
  feature. It is located in app/Http/Controllers/Dashboard/ArticleController.php
  within the deleteImage method. The endpoint accepts a filename from the URL 
  but does not verify ownership. This allows an authenticated user with edit 
  permissions to delete images attached to articles owned by other users. This 
  vulnerability is fixed in 2.0.6.
