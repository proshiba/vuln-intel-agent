title: A flaw was found in Keycloak. A remote, unauthenticated attacker can send
  a specially crafted XML input to the Security Assertion Markup Language (SAML)
  endpoint. This malicious input can cause high CPU usage and worker thread 
  starvation, leading to a Denial of Service (DoS) where the server becomes 
  unavailable.
