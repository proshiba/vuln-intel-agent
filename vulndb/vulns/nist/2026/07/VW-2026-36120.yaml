title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: IPIP tunnel hardware offload is not yet support\n\nNo driver supports
  for IPIP tunnels yet, give up early on setting up the\nhardware offload for this
  scenario.\n\nThis patch adds a stub that can be enhanced to add more configuration\n\
  that are currently not supported. As of now, the offload work is\nenqueued to the
  worker, then ignored if the hardware offload\nconfiguration is not supported.\n\n\
  Check the NF_FLOW_HW flag to know if this entry was already tried once\nto be offloaded
  so this is not retried on refresh when unsupported. Move\nNF_FLOW_HW flag check
  to nf_flow_offload_add(). If this NF_FLOW_HW flag\nis unset the _del and _stats
  variants are never called.\n\nThis can be updated later on to skip hardware offload
  work to be queued\nin case hardware offload does not support it."
