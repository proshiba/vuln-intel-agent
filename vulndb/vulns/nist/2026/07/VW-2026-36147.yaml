title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix use-after-free of a deferred file_lock on SMB2_CLOSE then SMB2_CANCEL\n\nCommit
  f580d27e8928 (\"ksmbd: fix use-after-free of a deferred file_lock on\ndouble SMB2_CANCEL\"\
  ) made smb2_cancel() skip a work whose state is\nKSMBD_WORK_CANCELLED, so its cancel_fn
  cannot be fired a second time. But\nKSMBD_WORK has three states (ACTIVE, CANCELLED,
  CLOSED), and the same\nfreeing producer path is reached for CLOSED too:\n\n  SMB2_CLOSE
  on the locking handle -> set_close_state_blocked_works() sets\n  the deferred work's
  state to KSMBD_WORK_CLOSED and wakes the smb2_lock()\n  worker. The worker takes
  the non-ACTIVE early-exit, locks_free_lock()s\n  the file_lock and, because the
  state is not KSMBD_WORK_CANCELLED, takes\n  the STATUS_RANGE_NOT_LOCKED branch with
  \"goto out2\" -- which, like the\n  cancelled branch, skips release_async_work().
  The work stays on\n  conn->async_requests with a live cancel_fn = smb2_remove_blocked_lock\n\
  \  poi"
