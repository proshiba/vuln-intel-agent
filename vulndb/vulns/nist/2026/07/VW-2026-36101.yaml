title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  use opener credentials for ADS I/O\n\nAlternate data streams are stored as xattrs.
  Unlike regular file I/O,\ntheir read and write paths therefore call VFS xattr helpers
  which recheck\ninode permissions and LSM policy using the current task credentials.\n\
  \nRun ADS I/O with the credentials captured when the SMB handle was opened."
