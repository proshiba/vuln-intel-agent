title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  fix a UAF when vma->mm is freed after vma->vm_refcnt got dropped\n\nBy inducing
  delays in the right places, Jann Horn created a reproducer for\na hard to hit UAF
  issue that became possible after VMAs were allowed to be\nrecycled by adding SLAB_TYPESAFE_BY_RCU
  to their cache.\n\nRace description is borrowed from Jann's discovery report:\n\
  lock_vma_under_rcu() looks up a VMA locklessly with mas_walk() under\nrcu_read_lock().\
  \  At that point, the VMA may be concurrently freed, and it\ncan be recycled by
  another process.  vma_start_read() then increments the\nvma->vm_refcnt (if it is
  in an acceptable range), and if this succeeds,\nvma_start_read() can return a recycled
  VMA.\n\nIn this scenario where the VMA has been recycled, lock_vma_under_rcu()\n\
  will then detect the mismatching ->vm_mm pointer and drop the VMA through\nvma_end_read(),
  which calls vma_refcount_put().  vma_refcount_put() drops\nthe refcount and then
  calls rcuwait_wake_"
