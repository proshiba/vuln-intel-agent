title: A flaw has been found in LibRaw up to 0.22.0. This affects the function 
  LibRaw::nikon_load_padded_packed_raw of the file 
  src/decoders/decoders_libraw.cpp of the component TIFF/NEF. Executing a 
  manipulation of the argument load_flags/raw_width can lead to out-of-bounds 
  read. It is possible to launch the attack remotely. The exploit has been 
  published and may be used. Upgrading to version 0.22.1 mitigates this issue. 
  This patch is called b8397cd45657b84e88bd1202528d1764265f185c. It is advisable
  to upgrade the affected component.
