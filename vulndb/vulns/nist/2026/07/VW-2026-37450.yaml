title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Fix XDP_TX path\n\nFor XDP_TX action in bnxt_rx_xdp(), clearing of the event flags
  is not\ncorrect.  __bnxt_poll_work() -> bnxt_rx_pkt() -> bnxt_rx_xdp() may be\n\
  looping within NAPI and some event flags may be set in earlier\niterations.  In
  particular, if BNXT_TX_EVENT is set earlier indicating\nsome XDP_TX packets are
  ready and pending, it will be cleared if it is\nXDP_TX action again.  Normally,
  we will set BNXT_TX_EVENT again when we\nsuccessfully call __bnxt_xmit_xdp().  But
  if the TX ring has no more\nroom, the flag will not be set.  This will cause the
  TX producer to be\nahead but the driver will not hit the TX doorbell.\n\nFor multi-buf
  XDP_TX, there is no need to clear the event flags and set\nBNXT_AGG_EVENT.  The
  BNXT_AGG_EVENT flag should have been set earlier in\nbnxt_rx_pkt().\n\nThe visible
