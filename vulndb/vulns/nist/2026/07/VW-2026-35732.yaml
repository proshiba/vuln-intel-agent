title: LORIS (Longitudinal Online Research and Imaging System) is a self-hosted 
  web application that provides data- and project-management for neuroimaging 
  research. From 15.10 to before 27.0.3 and 28.0.1, there is a potential for a 
  cross-site scripting attack in the survey_accounts module if a user provides 
  an invalid visit label. While the data is properly JSON encoded, the 
  Content-Type header is not set causing the web browser to interpret the 
  payload as HTML, opening the possibility of a cross-site scripting if a user 
  is tricked into following an invalid link. This vulnerability is fixed in 
  27.0.3 and 28.0.1.
