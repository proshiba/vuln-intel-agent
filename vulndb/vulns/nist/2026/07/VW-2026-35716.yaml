title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.1, customers in shared organizations (means they can see each other's 
  tickets) could see fields which are not intended for customers - including 
  fields not intended for them at all (e.g. priority, custom ticket attributes 
  for internal purposes). This was the case when a customer opened a ticket from
  another user of the same shared organization. They are not able to modify 
  these field. This vulnerability is fixed in 7.0.1.
