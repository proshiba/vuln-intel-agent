title: OpenProject is open-source, web-based project management software. Prior 
  to 17.6.0, PATCH /api/v3/work_packages/{id} accepted _links.fileLinks and 
  allowed authenticated users with edit_work_packages but without 
  manage_file_links to resolve Storages::FileLink records by raw id, detach or 
  hard-delete existing FileLinks, and re-parent FileLinks from other projects to
  an attacker-controlled work package, exposing origin filename, origin id, and 
  MIME type metadata. This issue is fixed in 17.6.0.
