title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: net2280: Fix double free in probe error path\n\nusb_initialize_gadget()
  installs gadget_release() as the release\ncallback for the embedded gadget device.\
  \  The struct net2280 instance is\ntherefore released through gadget_release() when
  the gadget device's last\nreference is dropped.\n\nThe probe error path calls net2280_remove(),
  which tears down the\npartially initialized device and drops the gadget reference
  with\nusb_put_gadget().  Calling kfree(dev) afterwards can free the same object\n\
  again.\n\nDrop the explicit kfree() and let the gadget device release callback\n\
  handle the final free.  This issue was found by a static analysis tool\nI am developing."
