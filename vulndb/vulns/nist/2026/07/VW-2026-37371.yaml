title: "Insufficient Verification of Data Authenticity vulnerability in Gleam allows
  an adversary in the middle to substitute forged Hex package contents during dependency
  resolution.\n\nDuring dependency resolution Gleam fetches package metadata from
  the signature-verified Hex repository, which covers each release's dependency requirements
  and SHA-256 outer_checksum. After resolving versions, gleam_cli::dependencies::lookup_package
  makes a second request to the unsigned Hex API through gleam_core::hex::get_package_release
  and records the outer_checksum and dependency names from that JSON response into
  manifest.toml, instead of the values from the verified repository metadata. The
  Hex repository signature does not cover the API response.\n\nAn adversary in the
  middle who can intercept TLS with a certificate trusted by the Gleam process (for
  example a TLS-inspecting proxy using a CA in the operating system trust store or
