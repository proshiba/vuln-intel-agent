title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix warning when reconnecting channel\n\nWhen reconnecting a channel in
  smb2_reconnect_server(), a dummy tcon\nis passed down to smb2_reconnect() with ->query_interface\n\
  uninitialized, so we can't call queue_delayed_work() on it.\n\nFix the following
  warning by ensuring that we're queueing the delayed\nworker from correct tcon.\n\
  \nWARNING: CPU: 4 PID: 1126 at kernel/workqueue.c:2498 __queue_delayed_work+0x1d2/0x200\n\
