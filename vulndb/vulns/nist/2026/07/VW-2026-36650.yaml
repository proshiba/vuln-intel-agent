title: "Plack::App::Prerender versions before 0.3.0 for Perl can proxy to an arbitrary
  host via unvalidated REQUEST_URI concatenation in call.\n\nWhen the rewrite base
  is a plain string, the REQUEST_URI is appended to it, with no check that the path
  starts with a forward slash ('/').\n\nWhen the rewrite base does not contain a path
  (which is the standard given in the SYNOPSIS), an attacker can create a request
  that changes the hostname. A request target starting with an at-sign ('@') changes
  the base to a RFC 3986 userinfo component.\n\nFor example, a rewrite base of \"\
  https://example.com\" with the submitted request \"GET @192.168.1.2/\" will send
  a request to \"https://example.com@192.168.1.2/\", with the rendered content returned
  to the attacker.\n\nThis allows an attacker to access internal or restricted hosts
  that only the webserver has access to."
