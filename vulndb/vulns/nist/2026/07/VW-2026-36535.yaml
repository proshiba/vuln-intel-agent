title: The lack of cryptographic mechanisms to ensure the integrity and 
  authenticity of communications in Ghost Robotics' Vision 60 robot (APK v5.5.0)
  exposes the system to man-in-the-middle attacks. An attacker located on the 
  local network can use ARP spoofing and selective traffic blocking techniques 
  to intercept and manipulate packets between the legitimate operator and the 
  robot. This allows the attacker to disconnect the original controller, 
  establish unauthorized communications, and prevent the operator from regaining
  control of the device, seriously compromising the confidentiality, integrity, 
  and availability (CIA) of operations.
