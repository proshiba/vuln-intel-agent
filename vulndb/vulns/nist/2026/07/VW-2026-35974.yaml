title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  fix EFAULT clobber in fuse_uring_commit\n\ncopy_from_user() returns the number of
  bytes not copied as an unsigned\nresidual on failure (1..sizeof(struct fuse_out_header)).
  fuse_uring_commit\nstores that residual in ssize_t err, sets req->out.h.error to
  -EFAULT,\nthen jumps to out: with err still holding the positive residual.\n\n \
  \   err = copy_from_user(&req->out.h, &ent->headers->in_out,\n                 \
  \        sizeof(req->out.h));\n    if (err) {\n        req->out.h.error = -EFAULT;\n\
  \        goto out;          /* err is the positive residual */\n    }\n    ...\n\
  \    out:\n        fuse_uring_req_end(ent, req, err);\n\nfuse_uring_req_end() then
  runs\n\n    if (error)\n        req->out.h.error = error;\n\nwhich overwrites the
  just-assigned -EFAULT with the positive residual.\nFUSE callers such as fuse_simple_request()
  test err < 0 to detect\nfailure, so the positive value is interpreted as success
