title: "When grant-copy operations are processed, the respective grant may or may\n\
  not already be in use by another operation (a mapping or another copy).\nFor all
  copy operations the referenced guest frame is looked up.  When\nanother operation
  is already active for the grant (the grant is \"pinned\"),\nwhat is being supplied
  back to actually carry out permission checks and\ncopy operation may not be consistent:
  The permission check may be carried\nout on a page different from the one involved
  in the copy."
