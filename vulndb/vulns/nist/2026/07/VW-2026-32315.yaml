title: SoupAuthManager caches proxy authentication credentials without scoping 
  them to the proxy authority (host:port). When the proxy configuration changes 
  (e.g., via system settings or WPAD), cached Proxy-Authorization headers from 
  the previous proxy are sent to the new proxy, leaking credentials.
