title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/64s/slb:
  Fix SLB multihit issue during SLB preload\n\nOn systems using the hash MMU, there
  is a software SLB preload cache that\nmirrors the entries loaded into the hardware
  SLB buffer. This preload\ncache is subject to periodic eviction — typically after
  every 256 context\nswitches — to remove old entry.\n\nTo optimize performance, the
  kernel skips switch_mmu_context() in\nswitch_mm_irqs_off() when the prev and next
  mm_struct are the same.\nHowever, on hash MMU systems, this can lead to inconsistencies
  between\nthe hardware SLB and the software preload cache.\n\nIf an SLB entry for
  a process is evicted from the software cache on one\nCPU, and the same process later
  runs on another CPU without executing\nswitch_mmu_context(), the hardware SLB may
