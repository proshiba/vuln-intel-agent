title: The MW WP Form plugin for WordPress is vulnerable to Arbitrary File 
  Move/Read in all versions up to and including 5.1.1. This is due to 
  insufficient validation of the $name parameter (upload field key) passed to 
  the generate_user_file_dirpath() function, which uses WordPress's path_join() 
  — a function that returns absolute paths unchanged, discarding the intended 
  base directory. The attacker-controlled key is injected via the 
  mwf_upload_files[] POST parameter, which is loaded into the plugin's Data 
  model via _set_request_valiables(). During form processing, 
  regenerate_upload_file_keys() iterates over these keys and calls 
  generate_user_filepath() with the attacker-supplied key as the $name argument 
  — the key survives validation because the targeted file (e.g., wp-config.php) 
  genuinely exists at the absolute path. The _get_attachments() method then 
