title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/swap:
  add cond_resched() in swap_reclaim_full_clusters to prevent softlockup\n\nWe hit
  a real softlockup in an internal stress test environment.  The\nworkload was LTP
  memory/swap stress on a large arm64 machine, with 320\nCPUs, about 1TB memory and
  an 8.6GB swap device.  The system was under\nheavy load and the swap device had
  a large number of full clusters.  The\nsoftlockup was triggered during a stress
  test after about 3 days.\n\nSo, add periodic cond_resched() calls during large full_clusters\n\
  reclaim operations to prevent softlockup issues.\n\nDetailed call trace as follow:\n\
  \nPID: 3817773  TASK: ffff0883bb28b780  CPU: 48   COMMAND: \"kworker/48:7\"\n  \
  \ #0 [ffff800080183d10] __crash_kexec at ffffa4c1361e5de4\n   #1 [ffff800080183d90]
  panic at ffffa4c1360d5e9c\n   #2 [ffff800080183e20] watchdog_timer_fn at ffffa4c136231fa8\n\
  \   ...\n  #16 [ffff8000c4ad3cb0] swap_cache_del_folio at ffffa4c1363e1614\n  #17
  [ffff8000c4ad3ce0] __try_to"
