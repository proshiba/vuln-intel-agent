title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/sva:
  invalidate stale IOTLB entries for kernel address space\n\nIntroduce a new IOMMU
  interface to flush IOTLB paging cache entries for\nthe CPU kernel address space.\
  \  This interface is invoked from the x86\narchitecture code that manages combined
  user and kernel page tables,\nspecifically before any kernel page table page is
  freed and reused.\n\nThis addresses the main issue with vfree() which is a common
  occurrence\nand can be triggered by unprivileged users.  While this resolves the\n\
  primary problem, it doesn't address some extremely rare case related to\nmemory
  unplug of memory that was present as reserved memory at boot, which\ncannot be triggered
  by unprivileged users.  The discussion can be found at\nthe link below.\n\nEnable
  SVA on x86 architecture since the IOMMU can now receive\nnotification to flush the
  paging cache before freeing the CPU kernel page\ntable pages."
