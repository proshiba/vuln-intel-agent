title: Capsule is a multi-tenancy and policy-based framework for Kubernetes. 
  Prior to 0.13.8, CapsuleConfiguration.Spec.NodeMetadata.ForbiddenLabels.Regex 
  and CapsuleConfiguration.Spec.NodeMetadata.ForbiddenAnnotations.Regex were not
  validated by the configuration admission webhook, allowing a Cluster Admin to 
  store a malformed regex that later reached regexp.MustCompile in 
  pkg/api/forbidden_list.go through internal/webhook/node/user_metadata.go and 
  crashed the node admission webhook on Node create, update, or patch requests. 
  This issue is fixed in version 0.13.8.
