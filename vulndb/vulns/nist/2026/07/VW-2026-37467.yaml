title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  ets: Remove drr class from the active list if it changes to strict\n\nWhenever a
  user issues an ets qdisc change command, transforming a\ndrr class into a strict
  one, the ets code isn't checking whether that\nclass was in the active list and
  removing it. This means that, if a\nuser changes a strict class (which was in the
  active list) back to a drr\none, that class will be added twice to the active list
  [1].\n\nDoing so with the following commands:\n\ntc qdisc add dev lo root handle
  1: ets bands 2 strict 1\ntc qdisc add dev lo parent 1:2 handle 20: \\\n    tbf rate
  8bit burst 100b latency 1s\ntc filter add dev lo parent 1: basic classid 1:2\nping
  -c1 -W0.01 -s 56 127.0.0.1\ntc qdisc change dev lo root handle 1: ets bands 2 strict
  2\ntc qdisc change dev lo root handle 1: ets bands 2 strict 1\nping -c1 -W0.01 -s
  56 127.0.0.1\n\nWill trigger the following splat with list debug turned on:\n\n\
  [   59.279014][  T365] ------------[ cut "
