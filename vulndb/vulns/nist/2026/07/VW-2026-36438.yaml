title: NoteGen before 0.32.0 grants the Tauri shell plugin shell:allow-execute 
  capability for bash, python, and python3 with arbitrary arguments in the 
  default desktop capabilities. JavaScript running in the application webview 
  can therefore invoke plugin:shell|execute to run attacker-controlled operating
  system commands with the privileges of the NoteGen process. In combination 
  with script execution in the webview (for example via chat XSS), this enables 
  full remote code execution on the user's machine.
