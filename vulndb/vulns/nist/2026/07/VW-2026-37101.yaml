title: tiny-http through 0.12.0 contains an HTTP header injection vulnerability 
  that allows attackers to inject carriage return (0x0D) and line feed (0x0A) 
  bytes into HTTP header values on both request and response sides due to 
  insufficient validation in header parsing and serialization. Attackers can 
  exploit this injection primitive to perform response splitting, cache 
  poisoning, session fixation via Set-Cookie injection, security header 
  override, and request smuggling against line-feed-tolerant backends.
