title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix potential deadlock when reconnecting channels\n\nFix cifs_signal_cifsd_for_reconnect()
  to take the correct lock order\nand prevent the following deadlock from happening\n\
  \n======================================================\nWARNING: possible circular
  locking dependency detected\n6.16.0-rc3-build2+ #1301 Tainted: G S      W\n------------------------------------------------------\n\
  cifsd/6055 is trying to acquire lock:\nffff88810ad56038 (&tcp_ses->srv_lock){+.+.}-{3:3},
  at: cifs_signal_cifsd_for_reconnect+0x134/0x200\n\nbut task is already holding lock:\n\
  ffff888119c64330 (&ret_buf->chan_lock){+.+.}-{3:3}, at: cifs_signal_cifsd_for_reconnect+0xcf/0x200\n\
  \nwhich lock already depends on the new lock.\n\nthe existing dependency chain (in
  reverse order) is:\n\n-> #2 (&ret_buf->chan_lock){+.+.}-{3:3}:\n       validate_chain+0x1cf/0x270\n\
  \       __lock_acquire+0x60e/0x780\n       lock_acquire.part.0+0xb4/0x1f0\n    \
  \   _raw_spin_lo"
