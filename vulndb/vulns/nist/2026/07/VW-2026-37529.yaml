title: "DriveLock Directory Traversal Information Disclosure Vulnerability. This vulnerability
  allows remote attackers to disclose sensitive information on affected installations
  of DriveLock. Authentication is not required to exploit this vulnerability.\n\n\
  The specific flaw exists within the web service, which listens on TCP port 4568
  by default. The issue results from the lack of proper validation of a user-supplied
  path prior to using it in file operations. An attacker can leverage this vulnerability
  to disclose information in the context of the service account. Was ZDI-CAN-28746."
