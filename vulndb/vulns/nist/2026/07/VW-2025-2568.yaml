title: 'A security flaw has been discovered in Dígitro NGC Explorer up to 3.48.21.
  The impacted element is an unknown function of the component Password Transmission
  Handler. Performing a manipulation results in client-side enforcement of server-side
  security. The attack can be initiated remotely. The complexity of an attack is rather
  high. The exploitability is regarded as difficult. Upgrading to version 3.48.22
  is sufficient to resolve this issue. Upgrading the affected component is recommended.
  The action taken by the vendor is: "Strengthening of security validation performed
  on the server side, together with improvements to administrative and authentication
  controls." The vulnerabilities are limited to NGC Explorer and do not affect other
  Dígitro products, including UNA and Guardião.'
