title: "DriveLock SQL Injection Privilege Escalation Vulnerability. This vulnerability
  allows remote attackers to escalate privileges on affected installations of DriveLock.
  Authentication is required to exploit this vulnerability.\n\nThe specific flaw exists
  within the web service, which listens on TCP port 4568 by default. The issue results
  from the lack of proper validation of a user-supplied string before using it to
  construct SQL queries. An attacker can leverage this vulnerability to escalate privileges
  to resources normally protected from the user. . Was ZDI-CAN-28726."
