title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  virtio: Validate control metadata from the device\n\nvirtio-snd control handling
  trusts the device-provided control type and\nvalue count returned by the device.\n\
  \nThat metadata is then used directly to index g_v2a_type_map[] in\nvirtsnd_kctl_info(),
  and to size loops and memcpy() operations in\nvirtsnd_kctl_get() and virtsnd_kctl_put()
  against fixed-size\nvirtio_snd_ctl_value and snd_ctl_elem_value arrays.\n\nA buggy
  or malicious device can therefore trigger out-of-bounds access by\nadvertising an
  invalid control type or an oversized value count.\n\nValidate control type and count
  once in virtsnd_kctl_parse_cfg(), before\nquerying enumerated items or exposing
  the control to ALSA."
