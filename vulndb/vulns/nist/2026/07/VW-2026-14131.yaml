title: "Applications which accept user-supplied Spring Expression Language (SpEL)
  expressions may be vulnerable to a Denial of Service (DoS) attack if the evaluation
  of a SpEL expression triggers unbounded cache growth.\n\nAffected versions:\nSpring
  Framework 7.0.0 through 7.0.7; 6.2.0 through 6.2.18; 6.1.0 through 6.1.27; 5.3.0
  through 5.3.48."
