title: Open WebUI is an extensible, feature-rich, and user-friendly self-hosted 
  AI platform. From 0.7.0 before 0.10.0, GET /api/v1/channels//members returned 
  full UserModelResponse objects for channel members, including 
  settings.ui.toolServers[].key and webhook configuration, allowing a normal 
  channel participant to retrieve other users’ sensitive settings. This issue is
  fixed in version 0.10.0.
