title: LORIS (Longitudinal Online Research and Imaging System) is a self-hosted 
  web application that provides data- and project-management for neuroimaging 
  research. From 16.1.0 to before 27.0.3 and 28.0.1, While the frontend of the 
  media module filters files that the user should not have access to, the 
  backend was not applying access checks and it would be possible for someone 
  who should not have access to a file to access it if they know the filename. 
  This vulnerability is fixed in 27.0.3 and 28.0.1.
