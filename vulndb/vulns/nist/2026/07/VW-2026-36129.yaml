title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/shrinker:
  do not hold RCU lock in shrinker_debugfs_count_show()\n\nReading the debugfs \"\
  count\" file of a memcg-aware shrinker can sleep\ninside an RCU read-side critical
  section:\n\n  BUG: sleeping function called from invalid context at kernel/cgroup/rstat.c:421\n\
  \  RCU nest depth: 1, expected: 0\n   css_rstat_flush\n   mem_cgroup_flush_stats\n\
  \   zswap_shrinker_count\n   shrinker_debugfs_count_show\n\nshrinker_debugfs_count_show()
  invokes the ->count_objects() callback under\nrcu_read_lock().  The zswap callback
  flushes memcg stats via\ncss_rstat_flush(), which may sleep, so it must not run
  under RCU.\n\nThe RCU lock is not needed here.  mem_cgroup_iter() takes RCU internally\n\
  and returns a memcg holding a css reference (dropped on the next iteration\nor by
  mem_cgroup_iter_break()), so the memcg stays alive without it.  The\nshrinker is
  kept alive by the open debugfs file: shrinker_free() removes\nthe debugfs entries
  via debugfs_remov"
