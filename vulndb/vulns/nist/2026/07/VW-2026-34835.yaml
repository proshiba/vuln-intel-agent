title: Discourse is an open-source discussion platform. From versions 
  2026.1.0-latest to before 2026.1.3, 2026.2.0-latest to before 2026.2.2, and 
  2026.3.0-latest to before 2026.3.0, non-staff users could access read receipt 
  information for staff-only posts they weren't supposed to see. No post content
  was exposed, only metadata about who read the post and when. This issue has 
  been patched in versions 2026.1.3, 2026.2.2, and 2026.3.0.
