title: In OpenStack Keystone before 28.0.1, the LDAP identity backend does not 
  convert the user enabled attribute to a boolean when the user_enabled_invert 
  configuration option is False (the default). The _ldap_res_to_model method in 
  the UserApi class only performed string-to-boolean conversion when 
  user_enabled_invert was True. When False, the raw string value from LDAP 
  (e.g., "FALSE") was used directly. Since non-empty strings are truthy in 
  Python, users marked as disabled in LDAP were treated as enabled by Keystone, 
  allowing them to authenticate and perform actions. All deployments using the 
  LDAP identity backend without user_enabled_invert=True or 
  user_enabled_emulation are affected.
