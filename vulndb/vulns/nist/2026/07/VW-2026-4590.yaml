title: A flaw in GnuTLS DTLS handshake parsing allows malformed fragments with 
  zero length and non-zero offset, leading to an integer underflow during 
  reassembly and resulting in an out-of-bounds read. This issue is remotely 
  exploitable and may cause information disclosure or denial of service.
