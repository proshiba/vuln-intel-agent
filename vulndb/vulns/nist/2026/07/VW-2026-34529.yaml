title: The WP Hotel Booking plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via 'widget_search' Shortcode Attribute in all versions 
  up to, and including, 2.3.2 due to insufficient input sanitization and output 
  escaping. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. This is only 
  exploitable on browsers where access keys can be used as the payload is stored
  in a hidden attribute.
