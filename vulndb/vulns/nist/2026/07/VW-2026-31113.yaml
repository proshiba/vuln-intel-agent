title: SurrealDB versions before 3.1.0 contain an authorization bypass 
  vulnerability in the KILL statement that allows authenticated database users 
  to terminate other users' LIVE SELECT subscriptions. Attackers can issue KILL 
  statements with target live query UUIDs to disrupt real-time data 
  subscriptions of other users without ownership verification.
