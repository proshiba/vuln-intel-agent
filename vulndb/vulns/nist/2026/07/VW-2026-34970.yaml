title: Postiz is an AI social media scheduling tool. Prior to version 2.21.3, 
  the GET /public/stream endpoint in PublicController accepts a user-supplied 
  url query parameter and proxies the full HTTP response back to the caller. The
  only validation is url.endsWith('mp4'), which is trivially bypassable by 
  appending .mp4 as a query parameter value or URL fragment. The endpoint 
  requires no authentication and has no SSRF protections, allowing an 
  unauthenticated attacker to read responses from internal services, cloud 
  metadata endpoints, and other network-internal resources. This issue has been 
  patched in version 2.21.3.
