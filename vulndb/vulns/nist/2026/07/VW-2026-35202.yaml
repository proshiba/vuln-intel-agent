title: A vulnerability was found in ScrapeGraphAI scrapegraph-ai up to 1.74.0. 
  The affected element is the function create_sandbox_and_execute of the file 
  scrapegraphai/nodes/generate_code_node.py of the component GenerateCodeNode 
  Component. The manipulation results in os command injection. The attack may be
  launched remotely. The exploit has been made public and could be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
