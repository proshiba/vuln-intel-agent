title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix huge_pmd_unshare() vs GUP-fast race\n\nhuge_pmd_unshare() drops a reference
  on a page table that may have\npreviously been shared across processes, potentially
  turning it into a\nnormal page table used in another process in which unrelated
  VMAs can\nafterwards be installed.\n\nIf this happens in the middle of a concurrent
  gup_fast(), gup_fast() could\nend up walking the page tables of another process.\
  \  While I don't see any\nway in which that immediately leads to kernel memory corruption,
  it is\nreally weird and unexpected.\n\nFix it with an explicit broadcast IPI through
  tlb_remove_table_sync_one(),\njust like we do in khugepaged when removing page tables
  for a THP\ncollapse."
