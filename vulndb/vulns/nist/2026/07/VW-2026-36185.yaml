title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio/pci:
  Release the VGA arbiter client on register_device() failure\n\nThe re-order in the
  Fixes commit below displaced vfio_pci_vga_init() as\nthe last failure point of what
  is now vfio_pci_core_register_device()\nwithout introducing an unwind for the VGA
  arbiter registration.\n\nIn current kernels this is mostly benign because vfio_pci_set_decode()\n\
  only uses pci_dev state, but the original failure path could leave a\ncallback with
  a freed vdev cookie.  The stale registration also becomes\nunsafe again once the
  callback follows drvdata to the vfio device.\n\nAdd the required VGA unwind callout."
