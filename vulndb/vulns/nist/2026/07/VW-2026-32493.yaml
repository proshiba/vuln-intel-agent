title: 'Vulnerability in the MySQL Server, MySQL Cluster product of Oracle MySQL (component:
  InnoDB).  Supported versions that are affected are MySQL Server: 8.4.0-8.4.10, 9.7.0-9.7.1;
  MySQL Cluster: 8.0.0-8.0.47, 8.4.0-8.4.10 and  9.7.0-9.7.1. Easily exploitable vulnerability
  allows high privileged attacker with network access via multiple protocols to compromise
  MySQL Server, MySQL Cluster.  Successful attacks of this vulnerability can result
  in unauthorized ability to cause a hang or frequently repeatable crash (complete
  DOS) of MySQL Server, MySQL Cluster. CVSS 3.1 Base Score 4.9 (Availability impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:N/A:H).'
