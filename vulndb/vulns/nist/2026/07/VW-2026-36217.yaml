title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/bugs:
  Enable IBPB flush on BPF JIT allocation\n\nEnable hardening against JIT spraying
  when Spectre-v2 mitigations are in\nuse. Specifically, issue an IBPB flush on BPF
  JIT memory reuse. Skip\nenabling the IBPB flush if the BPF dispatcher is already
  using a retpoline\nsequence.\n\nThis hardening applies only when BPF-JIT is in use.
  Guard the enabling\nunder CONFIG_BPF_JIT so that bugs.c still builds with CONFIG_BPF_JIT=n."
