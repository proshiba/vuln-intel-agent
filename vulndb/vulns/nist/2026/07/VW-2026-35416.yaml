title: "Electron is a framework for writing cross-platform desktop applications using
  JavaScript, HTML and CSS. Prior to 39.8.5, 40.8.5, 41.1.0, and 42.0.0-alpha.5, when
  a renderer calls window.open() with a target name, Electron did not correctly scope
  the named-window lookup to the opener's browsing context group. A renderer could
  navigate an existing child window that was opened by a different, unrelated renderer
  if both used the same target name. If that existing child was created with more
  permissive webPreferences (via setWindowOpenHandler's overrideBrowserWindowOptions),
  content loaded by the second renderer inherits those permissions. Apps are only
  affected if they open multiple top-level windows with differing trust levels and
  use setWindowOpenHandler to grant child windows elevated webPreferences such as
  a privileged preload script. Apps that do not elevate child window privileges, or
  that use a single top-level window, are not affected. Apps that additionally grant
  nodeIntegration: "
