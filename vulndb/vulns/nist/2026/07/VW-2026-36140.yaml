title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNTB:
  epf: Avoid calling pci_irq_vector() from hardirq context\n\nntb_epf_vec_isr() calls
  pci_irq_vector() in hardirq context to derive\nthe vector number. pci_irq_vector()
  calls msi_get_virq() that takes a\nmutex and can therefore trigger \"scheduling
  while atomic\" splats:\n\n  BUG: scheduling while atomic: kworker/u33:0/55/0x00010001\n\
  \  ...\n  Call trace:\n   ...\n   schedule+0x38/0x110\n   schedule_preempt_disabled+0x28/0x50\n\
  \   __mutex_lock.constprop.0+0x848/0x908\n   __mutex_lock_slowpath+0x18/0x30\n \
  \  mutex_lock+0x4c/0x60\n   msi_domain_get_virq+0xe8/0x138\n   pci_irq_vector+0x2c/0x60\n\
  \   ntb_epf_vec_isr+0x28/0x120 [ntb_hw_epf]\n   __handle_irq_event_percpu+0x70/0x3a8\n\
  \   handle_irq_event+0x48/0x100\n   handle_edge_irq+0x100/0x1c8\n   ...\n\nCache
  the Linux IRQ number for vector 0 when vectors are allocated and\nuse it as a base
  in the ISR. Running the ISR in a threaded IRQ handler\nwould also avoid the problem,
