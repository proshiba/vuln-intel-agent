  epf: Avoid calling pci_irq_vector() from hardirq context\n\nntb_epf_vec_isr() calls
  pci_irq_vector() in hardirq context to derive\nthe vector number. pci_irq_vector()
  calls msi_get_virq() that takes a\nmutex and can therefore trigger \"scheduling
  while atomic\" splats:\n\n  BUG: scheduling while atomic: kworker/u33:0/55/0x00010001\n\
  \  ...\n  Call trace:\n   ...\n   schedule+0x38/0x110\n   schedule_preempt_disabled+0x28/0x50\n\
