title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: fix middle attribute validation in push_nsh() action\n\nThe push_nsh()
  action structure looks like this:\n\n OVS_ACTION_ATTR_PUSH_NSH(OVS_KEY_ATTR_NSH(OVS_NSH_KEY_ATTR_BASE,...))\n\
  \nThe outermost OVS_ACTION_ATTR_PUSH_NSH attribute is OK'ed by the\nnla_for_each_nested()
  inside __ovs_nla_copy_actions().  The innermost\nOVS_NSH_KEY_ATTR_BASE/MD1/MD2 are
  OK'ed by the nla_for_each_nested()\ninside nsh_key_put_from_nlattr().  But nothing
  checks if the attribute\nin the middle is OK.  We don't even check that this attribute
  is the\nOVS_KEY_ATTR_NSH.  We just do a double unwrap with a pair of nla_data()\n\
  calls - first time directly while calling validate_push_nsh() and the\nsecond time
  as part of the nla_for_each_nested() macro, which isn't\nsafe, potentially causing
  invalid memory access if the size of this\nattribute is incorrect.  The failure
