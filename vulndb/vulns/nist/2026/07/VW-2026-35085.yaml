title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  amlogic-spisg: Fix memory leak in aml_spisg_probe()\n\nIn aml_spisg_probe(), ctlr
  is allocated by\nspi_alloc_target()/spi_alloc_host(), but fails to call\nspi_controller_put()
  in several error paths. This leads\nto a memory leak whenever the driver fails to
  probe after\nthe initial allocation.\n\nConvert to use devm_spi_alloc_host()/devm_spi_alloc_target()\n\
  to fix the memory leak."
