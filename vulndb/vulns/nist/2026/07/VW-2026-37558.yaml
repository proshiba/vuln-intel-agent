title: 'OliveTin gives access to predefined shell commands from a web interface. From
  3000.2.0 until 3000.17.0, the service/internal/executor/arguments.go checkShellArgumentSafety
  function does not treat regex: custom argument types as unsafe for Shell mode actions,
  allowing values that pass typeSafetyCheckRegex to be interpolated by wrapCommandInShell
  into an sh -c command string and enabling OS command injection. This issue is fixed
  in version 3000.17.0.'
