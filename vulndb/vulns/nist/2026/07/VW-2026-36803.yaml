title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  asymmetric_keys - fix OOB read in pefile_digest_pe_contents\n\npefile_digest_pe_contents()
  computes the trailing-data hash length as\npelen - (hashed_bytes + certs_size).
  A crafted PE can make the addition\nexceed pelen, causing the unsigned subtraction
  to underflow to ~4 GiB.\nThis is passed to crypto_shash_update() which reads out
  of bounds and\npanics on unmapped vmalloc guard pages.\n\n BUG: unable to handle
  page fault for address: ffffc900038d8000\n Oops: Oops: 0000 [#1] SMP KASAN NOPTI\n\
  \ RIP: 0010:sha256_blocks_generic (lib/crypto/sha256.c:152)\n Call Trace:\n  <TASK>\n\
  \  __sha256_update (lib/crypto/sha256.c:208)\n  crypto_sha256_update (crypto/sha256.c:142)\n\
  \  verify_pefile_signature (crypto/asymmetric_keys/verify_pefile.c:436)\n  kexec_kernel_verify_pe_sig
  (kernel/kexec_file.c:151)\n  __do_sys_kexec_file_load (kernel/kexec_file.c:406)\n\
  \  do_syscall_64 (arch/x86/entry/syscall_64.c:94)\n  entry_SYSCALL_64_after_hwframe
  (arc"
