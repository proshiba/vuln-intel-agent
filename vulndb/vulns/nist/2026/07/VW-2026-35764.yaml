title: The Sleuth Kit through 4.14.0 contains an out-of-bounds read 
  vulnerability in the APFS filesystem keybag parser where the 
  wrapped_key_parser class follows attacker-controlled length fields without 
  bounds checking, causing heap reads past the allocated buffer. An attacker can
  craft a malicious APFS disk image that triggers information disclosure or 
  crashes when processed by any Sleuth Kit tool that parses APFS volumes.
