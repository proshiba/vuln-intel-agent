title: Chamilo LMS is an open-source learning management system. In versions 
  prior to 2.0.0-RC.3, an OS Command Injection vulnerability exists in the 
  main/inc/ajax/gradebook.ajax.php endpoint within the export_all_certificates 
  action, where the course code retrieved from the session variable 
  $_SESSION['_cid'] via api_get_course_id() is concatenated directly into a 
  shell_exec() command string without sanitization or escaping using 
  escapeshellarg(). If an attacker can manipulate or poison their session data 
  to inject shell metacharacters into the _cid variable, they can achieve 
  arbitrary command execution on the underlying server. Successful exploitation 
  grants full access to read system files and credentials, alters the 
  application and database, or disrupts server availability. This issue has been
  fixed in version 2.0.0-RC.3.
