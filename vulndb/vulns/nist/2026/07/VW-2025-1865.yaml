title: "In the Linux kernel, the following vulnerability has been resolved:\n\nibmvnic:
  Don't reference skb after sending to VIOS\n\nPreviously, after successfully flushing
  the xmit buffer to VIOS,\nthe tx_bytes stat was incremented by the length of the
  skb.\n\nIt is invalid to access the skb memory after sending the buffer to\nthe
  VIOS because, at any point after sending, the VIOS can trigger\nan interrupt to
  free this memory. A race between reading skb->len\nand freeing the skb is possible
  (especially during LPM) and will\nresult in use-after-free:\n ==================================================================\n\
  \ BUG: KASAN: slab-use-after-free in ibmvnic_xmit+0x75c/0x1808 [ibmvnic]\n Read
  of size 4 at addr c00000024eb48a70 by task hxecom/14495\n <...>\n Call Trace:\n\
  \ [c000000118f66cf0] [c0000000018cba6c] dump_stack_lvl+0x84/0xe8 (unreliable)\n\
  \ [c000000118f66d20] [c0000000006f0080] print_report+0x1a8/0x7f0\n [c000000118f66df0]
  [c0000000006f08f0] kasan_report+0x128/0x1f8\n [c000000118f66f00] [c0000000006f28"
