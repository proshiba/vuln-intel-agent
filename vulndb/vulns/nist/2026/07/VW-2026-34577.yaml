title: "Note: The CVE and blog post don't exist because we determined this is actually
  a cloud-only issue.\n\nAccess Controls are “Broken” when a user can access resources
  they are not authorized to access. An attacker can bypass any access control mechanisms
  in a web application, and gain unauthorized access to resources that are not available
  with their permissions. \n\nBroken access control can allow attackers to:\nAccess
  resources only accessible to certain users, thus allowing unauthorized access to
  data\nPerform operations on behalf of other users, leading to account takeovers
  in the worst cases\nAttempt privilege escalation\nAttempt to take over an account"
