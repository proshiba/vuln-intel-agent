title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/sysfs-schemes:
  delete tried region in regions_rmdirs()\n\nDAMON sysfs maintains the DAMOS tried
  region directory objects via a\nlinked list.  When the user requests refresh of
  the directories, DAMON\nsysfs removes all the region directories first, and then
  generate updated\nregions directory on the empty space.  The removal function\n\
  (damon_sysfs_scheme_regions_rm_dirs()) only puts the kobj objects. \nDeletion of
  the container region object from the linked list is done\ninside the kobj release
  callback function.\n\nIf somehow the callback invocation is delayed, the list will
  contain\nregions list that gonna be freed.  If the updated region directories\n\
  creation is started in this situation, the list can be corrupted and\nuse-after-free
  can happen.\n\nBecause the kobj objects are managed by only DAMON sysfs, the issue
  cannot\nhappen in normal situation.  But, such delays can be made on kernels that\n\
  built with CONFIG_DEBUG_KOB"
