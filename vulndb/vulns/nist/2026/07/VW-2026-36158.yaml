title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: restrict implied bcc[0] exemption to responses without data area\n\nsmb2_check_message()
  has a long-standing quirk that accepts a response\nwhose calculated length is one
  byte larger than the bytes actually\nreceived (\"server can return one byte more
  due to implied bcc[0]\").\nThis was introduced to accommodate servers that omit
  the trailing bcc[0]\noverlap byte when no data area is present.\n\nHowever, the
  exemption is applied unconditionally, regardless of whether\nthe command actually
  carries a data area (has_smb2_data_area[]).  When a\nresponse with a data area is
  subject to the +1 exemption, the reported\ndata can extend one byte beyond the bytes
  actually received, yet\nsmb2_check_message() still accepts it.  The subsequent decoder
  then reads\npast the end of the receive buffer.  This is reachable during NEGOTIATE\n\
  and SESSION_SETUP, before the session is established.\n\nThe resulting out-of-bounds
  reads are visible "
