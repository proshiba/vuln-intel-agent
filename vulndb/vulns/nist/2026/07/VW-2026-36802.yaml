title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix use-after-free of the discoverer in tipc_disc_rcv()\n\nbearer_disable() frees
  b->disc with tipc_disc_delete()'s plain kfree(),\nbut tipc_disc_rcv() still dereferences
  b->disc in RX softirq under\nrcu_read_lock() (tipc_udp_recv -> tipc_rcv -> tipc_disc_rcv).\n\
  \nL2 bearers are safe thanks to the synchronize_net() in\ntipc_disable_l2_media(),
  but the UDP bearer defers that call to the\ncleanup_bearer() workqueue, so the discoverer
  is freed with no grace\nperiod:\n\n BUG: KASAN: slab-use-after-free in tipc_disc_rcv
  (net/tipc/discover.c:149)\n Read of size 8 at addr ffff88802348b728 by task poc_tipc/184\n\
  \ <IRQ>\n  tipc_disc_rcv (net/tipc/discover.c:149)\n  tipc_rcv (net/tipc/node.c:2126)\n\
  \  tipc_udp_recv (net/tipc/udp_media.c:391)\n  udp_rcv (net/ipv4/udp.c:2643)\n \
  \ ip_local_deliver_finish (net/ipv4/ip_input.c:241)\n </IRQ>\n Freed by task 181:\n\
  \  kfree (mm/slub.c:6565)\n  bearer_disable (net/tipc/bearer.c:418)\n  tipc_nl_bearer_disabl"
