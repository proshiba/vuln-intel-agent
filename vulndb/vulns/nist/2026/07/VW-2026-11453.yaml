title: Ubuntu Linux 6.8, 6.17 and 7.0 contain AppArmor SAUCE patches which can 
  potentially incorrectly compute the size of an internal buffer, leading to a 
  heap memory out-of-bounds read in notification handling code. The bug can be 
  triggered by an unprivileged local user and can result in invalid data being 
  processed by the AppArmor DFA policy engine.
