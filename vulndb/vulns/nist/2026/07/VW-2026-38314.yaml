title: Sylius Mollie Plugin provides Mollie payment integration for Sylius 
  applications. Prior to 2.2.8, 3.2.4, and 3.3.1, Sylius Mollie Plugin's GET 
  /{_locale}/thank-you PageRedirectController::thankYouAction and GET 
  /{_locale}/get-code QrCodeAction::fetchQrCodeFromOrder endpoints look up 
  sequential orderId values without ownership or session checks, exposing order 
  tokenValue values that can be used with GET 
  /{_locale}/register-after-checkout/{tokenValue} to view customer first name, 
  last name, and email. This issue is fixed in 2.2.8, 3.2.4, and 3.3.1.
