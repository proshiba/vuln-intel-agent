title: Frappe Learning Management System (LMS) is a learning system that helps 
  users structure their content. Prior to 2.46.0, a vulnerability has been 
  identified in Frappe Learning where quiz scores can be modified by students 
  before submission. The application currently relies on client-side calculated 
  scores, which can be altered using browser developer tools prior to sending 
  the submission request. While this does not allow modification of other users’
  data or privilege escalation, it compromises the integrity of quiz results and
  undermines academic reliability. This issue affects data integrity but does 
  not expose confidential information or allow unauthorized access to other 
  accounts. This vulnerability is fixed in 2.46.0.
