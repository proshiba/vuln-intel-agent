title: LDAP filter injection vulnerability in Apache Zeppelin. LdapRealm used 
  RFC 4514 distinguished-name escaping when constructing LDAP search filters 
  instead of RFC 4515 filter escaping, leaving special filter characters 
  insufficiently escaped.                   This is an incomplete fix of 
  CVE-2024-31867. This issue affects Apache Zeppelin versions 0.11.1, 0.11.2, 
  and 0.12.0. Users are recommended to upgrade to version 0.12.1, which fixes 
  this issue.
