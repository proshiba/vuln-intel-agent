title: A vulnerability was determined in Dataease SQLbot up to 1.6.0. This issue
  affects the function get_es_data_by_http of the file 
  backend/apps/db/es_engine.py of the component Elasticsearch Handler. This 
  manipulation of the argument address causes server-side request forgery. The 
  attack may be initiated remotely. The exploit has been publicly disclosed and 
  may be utilized. Upgrading to version 1.7.0 is capable of addressing this 
  issue. You should upgrade the affected component. The vendor was contacted 
  early about this disclosure.
