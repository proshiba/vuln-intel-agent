title: "Allocation of resources without limits in Erlang/OTP public_key certificate
  path validation allows a remote unauthenticated attacker to cause denial of service
  by sending a crafted X.509 certificate chain during the TLS handshake.\n\nDuring
  RFC 5280 policy processing in public_key:pkix_path_validation/3, the certificate
  policy tree maintained by pubkey_policy_tree grows without an upper bound. When
  a certificate chain contains M policies per certificate and K certificates, the
  tree grows on the order of M^K nodes because pubkey_policy_tree:add_leaves/2 and
  pubkey_policy_tree:add_leaf_siblings/2 extend the tree per policy per certificate.
  A modest chain with many policies per certificate is enough to pin BEAM schedulers
  and exhaust the node's memory, taking down the entire VM. The attacker only needs
  to be able to present a certificate chain to the victim, which is the normal precondition
