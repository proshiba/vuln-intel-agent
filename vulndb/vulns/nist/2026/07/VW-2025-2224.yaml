title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  appletalk: Fix device refcount leak in atrtr_create()\n\nWhen updating an existing
  route entry in atrtr_create(), the old device\nreference was not being released
  before assigning the new device,\nleading to a device refcount leak. Fix this by
  calling dev_put() to\nrelease the old device reference before holding the new one."
