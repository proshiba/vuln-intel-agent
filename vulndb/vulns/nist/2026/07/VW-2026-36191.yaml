title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  hda/cs35l41: Fix firmware load work teardown\n\ncs35l41_hda creates ALSA controls
  whose private data points at the\ncs35l41_hda object. The firmware load control
  can also queue\nfw_load_work.\n\nThose controls are not removed on component unbind,
  and device remove\nonly cancels fw_load_work through cs35l41_remove_dsp(). That
  helper is\nskipped when halo_initialized is false. With firmware_autostart\ndisabled,
  a firmware load can be requested before the DSP has been\ninitialized. If the component
  or device is removed before the queued\nwork runs, the worker can run after teardown
  and dereference driver\nstate that is no longer valid.\n\nTrack the created controls
  and remove them on unbind so no new control\ncallback can reach the driver data
  or queue more work. Then cancel\nfw_load_work to drain any request that was already
  queued. Also cancel\nthe work unconditionally during device remove before runtime
  PM teardown."
