title: OpenClaw versions prior to commit 8aceaf5 contain a preflight validation 
  bypass vulnerability in shell-bleed protection that allows attackers to 
  execute blocked script content by using piped or complex command forms that 
  the parser fails to recognize. Attackers can craft commands such as piped 
  execution, command substitution, or subshell invocation to bypass the 
  validateScriptFileForShellBleed() validation checks and execute arbitrary 
  script content that would otherwise be blocked.
