title: The Cozy Blocks – Page Builder for Gutenberg Editor & FSE with 600+ 
  Patterns, 58 Blocks & Templates plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via 'postMeta.font.size' Block Attribute in all versions 
  up to, and including, 2.2.11 due to insufficient input sanitization and output
  escaping. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page.
