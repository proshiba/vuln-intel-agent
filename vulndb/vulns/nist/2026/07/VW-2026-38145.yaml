title: Activepieces is an open source AI workflow automation platform. Prior to 
  0.84.0, an unsanitized path segment in the Code piece sandbox can let an 
  authenticated flow author reach read-write cached flow and code files 
  belonging to other tenants on the same worker, exposing embedded data and 
  allowing modified code to execute on a victim tenant's next flow run. This 
  issue is fixed in version 0.84.0.
