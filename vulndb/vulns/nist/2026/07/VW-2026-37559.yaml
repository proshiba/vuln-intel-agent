title: OliveTin gives safe and simple access to predefined shell commands from a
  web interface. Prior to 3000.17.0, the service/internal/api/api.go 
  StartActionAndWait and StartActionByGetAndWait endpoints return full LogEntry 
  output after execution without enforcing the logs permission, allowing a user 
  with exec permission but logs:false to read action output. This issue is fixed
  in version 3000.17.0.
