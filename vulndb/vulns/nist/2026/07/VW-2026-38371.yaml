title: CodeIgniter is a PHP full-stack web framework. From 4.3.0 through 4.7.3, 
  Query Builder deleteBatch() substitutes bound values from where() conditions 
  into generated SQL while ignoring their escape flags, allowing user-controlled
  condition values to be interpreted as SQL. This affects only the deleteBatch()
  code path. Regular delete() operations escape where() binds correctly. This 
  issue is fixed in version 4.7.4.
