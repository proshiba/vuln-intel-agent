title: xdg-dbus-proxy is a filtering proxy for D-Bus connections. Prior to 
  0.1.7, a policy parser vulnerability allows bypassing eavesdrop restrictions. 
  The proxy checks for eavesdrop=true in policy rules but fails to handle 
  eavesdrop ='true' (with a space before the equals sign) and similar cases. 
  Clients can intercept D-Bus messages they should not have access to. This 
  vulnerability is fixed in 0.1.7.
