title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet,
  bpf: check master for NULL in xdp_master_redirect()\n\nxdp_master_redirect() dereferences
  the result of\nnetdev_master_upper_dev_get_rcu() without a NULL check, but that
  helper\nreturns NULL when the receiving device has no upper-master adjacency.\n\n\
  The reach guard only checks netif_is_bond_slave(). On bond slave release\nbond_upper_dev_unlink()
  drops the upper-master adjacency before clearing\nIFF_SLAVE, so an XDP_TX reaching
  xdp_master_redirect() in that window\nstill passes netif_is_bond_slave() while master
  is already NULL, and\nfaults on master->flags at offset 0xb0:\n\n  BUG: kernel NULL
  pointer dereference, address: 00000000000000b0\n  RIP: 0010:xdp_master_redirect
  (net/core/filter.c:4432)\n  Call Trace:\n   xdp_master_redirect (net/core/filter.c:4432)\n\
  \   bpf_prog_run_generic_xdp (include/net/xdp.h:700)\n   do_xdp_generic (net/core/dev.c:5608)\n\
  \   __netif_receive_skb_one_core (net/core/dev.c:6204)\n   process_backlog (net/"
