title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qat - validate RSA CRT component lengths\n\nThe generic RSA key parser (rsa_helper.c)
  bounds each CRT component (p,\nq, dp, dq, qinv) by the modulus size n_sz, but qat_rsa_setkey_crt()\n\
  allocates half-size DMA buffers (key_sz / 2) and right-aligns each\ncomponent with:\n\
  \n    memcpy(dst + half_key_sz - len, src, len)\n\nWhen a CRT component is larger
  than half_key_sz the subtraction\nunderflows and memcpy writes past the DMA buffer,
  causing memory\ncorruption.\n\nAdd a len > half_key_sz check next to the existing
  !len check for each\nof the five CRT components so the driver falls back to the
  non-CRT path\ninstead of writing out of bounds."
