title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: Forcibly leave SMM mode on SHUTDOWN interception\n\nPreviously, commit ed129ec9057f
  (\"KVM: x86: forcibly leave nested mode\non vCPU reset\") addressed an issue where
  a triple fault occurring in\nnested mode could lead to use-after-free scenarios.
  However, the commit\ndid not handle the analogous situation for System Management
  Mode (SMM).\n\nThis omission results in triggering a WARN when KVM forces a vCPU
  INIT\nafter SHUTDOWN interception while the vCPU is in SMM. This situation was\n\
  reprodused using Syzkaller by:\n\n  1) Creating a KVM VM and vCPU\n  2) Sending
  a KVM_SMI ioctl to explicitly enter SMM\n  3) Executing invalid instructions causing
  consecutive exceptions and\n     eventually a triple fault\n\nThe issue manifests
  as follows:\n\n  WARNING: CPU: 0 PID: 25506 at arch/x86/kvm/x86.c:12112\n  kvm_vcpu_reset+0x1d2/0x1530
  arch/x86/kvm/x86.c:12112\n  Modules linked in:\n  CPU: 0 PID: 25506 Comm: syz-executor.0
  Not tainted\n  "
