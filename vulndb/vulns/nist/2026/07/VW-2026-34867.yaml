title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  AVideo's admin plugin configuration endpoint (admin/save.json.php) lacks any 
  CSRF token validation. There is no call to isGlobalTokenValid() or 
  verifyToken() before processing the request. Combined with the application's 
  explicit SameSite=None cookie policy, an attacker can forge cross-origin POST 
  requests from a malicious page to overwrite arbitrary plugin settings on a 
  victim administrator's session. Because the plugins table is included in the 
  ignoreTableSecurityCheck() array in objects/Object.php, standard table-level 
  access controls are also bypassed. This allows a complete takeover of platform
  functionality by reconfiguring payment processors, authentication providers, 
  cloud storage credentials, and more. At time of publication, there are no 
  publicly available patches.
