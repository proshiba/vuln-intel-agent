title: ComfyUI is a modular diffusion model GUI, api and backend with a 
  graph/nodes interface. Prior to 0.28.0, get_model_preview in 
  app/model_manager.py joins an unrestricted filename route capture to a 
  selected model directory without a containment check, allowing an 
  unauthenticated remote attacker to use traversal, encoded traversal, absolute 
  paths, or an unbounded path_index to read image-decodable files and enumerate 
  host paths. get_model_preview (app/model_manager.py) built the path with 
  os.path.join(folder, filename) where filename is an unrestricted {filename:.*}
  route capture. Literal ../, percent-encoded %2e%2e%2f, and absolute paths all 
  escaped the model directory; path_index was also unbounded. The target file is
  piped through Pillow and re-encoded as WEBP, so disclosure is limited to 
  image-decodable files plus a file-existence/enumeration oracle (and 
  internal-path leakage via path_index errors). This issue is fixed in version 
  0.28.0.
