title: The OSM – OpenStreetMap plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'marker_name' and 'file_color_list' shortcode 
  attribute of the [osm_map_v3] shortcode in all versions up to and including 
  6.1.15. This is due to insufficient input sanitization and output escaping. 
  This makes it possible for authenticated attackers, with Contributor-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page.
