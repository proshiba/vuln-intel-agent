title: Cronicle is a multi-server task scheduler and runner, with a web based 
  front-end UI. Prior to 0.9.111, a non-admin user with create_events and 
  run_events privileges can inject arbitrary JavaScript through job output 
  fields (html.content, html.title, table.header, table.rows, table.caption). 
  The server stores this data without sanitization, and the client renders it 
  via innerHTML on the Job Details page. This vulnerability is fixed in 0.9.111.
