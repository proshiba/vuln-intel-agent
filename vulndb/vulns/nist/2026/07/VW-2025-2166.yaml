title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPICA:
  Refuse to evaluate a method if arguments are missing\n\nAs reported in [1], a platform
  firmware update that increased the number\nof method parameters and forgot to update
  a least one of its callers,\ncaused ACPICA to crash due to use-after-free.\n\nSince
  this a result of a clear AML issue that arguably cannot be fixed\nup by the interpreter
  (it cannot produce missing data out of thin air),\naddress it by making ACPICA refuse
  to evaluate a method if the caller\nattempts to pass fewer arguments than expected
  to it."
