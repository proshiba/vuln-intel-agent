title: OneUptime is an open-source monitoring and observability platform. Prior 
  to version 10.0.42, the Worker service's ManualAPI exposes workflow execution 
  endpoints (GET /workflow/manual/run/:workflowId and POST 
  /workflow/manual/run/:workflowId) without any authentication middleware. An 
  attacker who can obtain or guess a workflow ID can trigger arbitrary workflow 
  execution with attacker-controlled input data, enabling JavaScript code 
  execution, notification abuse, and data manipulation. This issue has been 
  patched in version 10.0.42.
