title: Discourse is an open-source discussion platform. From versions 
  2026.1.0-latest to before 2026.1.3, 2026.2.0-latest to before 2026.2.2, and 
  2026.3.0-latest to before 2026.3.0, an authorization bypass vulnerability 
  allows unauthenticated or unauthorized users to view hidden (staff-only) tags 
  and its associated data. All Discourse instances with tagging enabled and 
  staff-only tag groups configured are impacted. This issue has been patched in 
  versions 2026.1.3, 2026.2.2, and 2026.3.0.
