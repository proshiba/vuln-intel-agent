title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  reenable NETIF_F_IPV6_CSUM offload for BIG TCP packets\n\nThe blamed commit disabled
  hardware offoad of IPv6 packets with\nextension headers on devices that advertise
  NETIF_F_IPV6_CSUM,\nbased on the definition of that feature in skbuff.h:\n\n * \
  \  * - %NETIF_F_IPV6_CSUM\n *     - Driver (device) is only able to checksum plain\n\
  \ *       TCP or UDP packets over IPv6. These are specifically\n *       unencapsulated
  packets of the form IPv6|TCP or\n *       IPv6|UDP where the Next Header field in
  the IPv6\n *       header is either TCP or UDP. IPv6 extension headers\n *     \
  \  are not supported with this feature. This feature\n *       cannot be set in
  features for a device with\n *       NETIF_F_HW_CSUM also set. This feature is being\n\
  \ *       DEPRECATED (see below).\n\nThe change causes skb_warn_bad_offload to fire
  for BIG TCP\npackets.\n\n[  496.310233] WARNING: CPU: 13 PID: 23472 at net/core/dev.c:3129
  skb_warn_bad_offload+0xc4/0xe0"
