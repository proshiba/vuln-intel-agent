title: A vulnerability was identified in Linux Kernel up to 
  4.19.316/5.4.278/5.10.220/5.15.161. This impacts the function 
  tcp_getsockopt/tcp_setsockopt of the component TCP Handler. Such manipulation 
  leads to race condition. A high complexity level is associated with this 
  attack. The exploitability is said to be difficult. The vulnerability was 
  introduced in 2.6.12, commit 1da177e4c3f41524e886b7f1b8a0c1fc7321cac2 
  ("Linux-2.6.12-rc2"). Upgrading to version 4.19.317, 5.4.279, 5.10.221, 
  5.15.162 and 6.1 will fix this issue. The name of the patch is 
  fcd31dd8291b23d713245947ec2b2d99ef07aef2/3b32f265805a49071e2c4568a524398ba22bf93c/d529193eae979a7bf2255cd9fe68b7af7a1c91b3/5bb642cc3355ffd3c8bca0a8bd8e6e65bcc2091c/f49cd2f4d6170d27a2c61f1fecb03d8a70c91f57.
  The affected component should be upgraded.
