title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: serialize iso_sock_clear_timer with socket lock\n\niso_sock_close() calls iso_sock_clear_timer()
  before acquiring\nlock_sock(sk).\n\niso_sock_clear_timer() reads iso_pi(sk)->conn
  twice without the\nsocket lock held:\n\n    if (!iso_pi(sk)->conn)\n        return;\n\
  \    cancel_delayed_work(&iso_pi(sk)->conn->timeout_work);\n\nConcurrently, iso_conn_del()
  executes under lock_sock(sk) and calls\niso_chan_del(), which sets iso_pi(sk)->conn
  to NULL and may result in\nthe final reference to the connection being dropped:\n\
  \n    CPU0                         CPU1\n    ----                         ----\n\
  \    iso_sock_clear_timer()\n      if (conn != NULL) ...      lock_sock(sk)\n  \
  \                                 iso_chan_del()\n                             \
  \      iso_pi(sk)->conn = NULL\n      cancel_delayed_work(conn)  /* NULL deref or
  UAF */\n\niso_pi(sk)->conn is not stable across the unlock window, causing a\nNULL
  pointer dereference o"
