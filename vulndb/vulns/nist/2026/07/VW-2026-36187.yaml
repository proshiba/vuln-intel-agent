title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86,fs/resctrl:
  Prevent out-of-bounds access while offlining CPU when SNC enabled\n\nThe architecture
  updates the cpu_mask in a domain's header to track which\nonline CPUs are associated
  with the domain. When this mask becomes empty\nthe architecture initiates offline
  of the domain that includes calling\non resctrl fs to offline the domain. If it
  is a monitoring domain in\nwhich LLC occupancy is tracked resctrl fs forces the
  limbo handler to\nclear all busy RMID state associated with the domain.\n\nThe limbo
  handler always reads the current event value associated with a\nbusy RMID irrespective
  of it being checked as part of regular \"is it still\nbusy\" check or whether it
  will be forced released anyway. When reading an\nRMID on a system with SNC enabled
  the \"logical RMID\" is converted to the\n\"physical RMID\" and this conversion
  requires the NUMA node ID of the\nresctrl monitoring domain that is in turn determined
  by querying the NUM"
