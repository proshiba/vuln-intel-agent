title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Don't expose hw_counters outside of init net namespace\n\nCommit 467f432a521a (\"\
  RDMA/core: Split port and device counter sysfs\nattributes\") accidentally almost
  exposed hw counters to non-init net\nnamespaces. It didn't expose them fully, as
  an attempt to read any of\nthose counters leads to a crash like this one:\n\n[42021.807566]
