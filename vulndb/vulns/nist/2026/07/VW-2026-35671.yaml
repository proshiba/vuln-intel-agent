title: Incorrect Authorization (CWE-863) in Kibana can lead to information 
  disclosure via Privilege Abuse (CAPEC-122). A user with limited Fleet 
  privileges can exploit an internal API endpoint to retrieve sensitive 
  configuration data, including private keys and authentication tokens, that 
  should only be accessible to users with higher-level settings privileges. The 
  endpoint composes its response by fetching full configuration objects and 
  returning them directly, bypassing the authorization checks enforced by the 
  dedicated settings APIs.
