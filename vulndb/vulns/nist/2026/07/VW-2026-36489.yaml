title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: reject oversized nested action attrs\n\nOpen vSwitch stores generated
  flow actions as nlattrs, whose nla_len\nfield is u16. Commit a1e64addf3ff (\"net:
  openvswitch: remove\nmisbehaving actions length check\") allowed the total sw_flow_actions\n\
  stream to grow beyond 64 KiB, which is valid, but also removed the last\nguard preventing
  a generated nested action attribute from exceeding\nU16_MAX.\n\nAn oversized generated
  container can thus be closed with a truncated\nnla_len. A later dump or teardown
  then walks a structurally different\nstream than the one that was validated. In
  particular, an oversized\nnested CLONE/CT action may cause subsequent bytes in the
  generated\nstream to be interpreted as independent actions.\n\nKeep the larger total-action-stream
  behavior, but make nested action\nclose reject generated containers that do not
  fit in nla_len, and return\nthe error through all callers. For recursive SAMPLE,
  CLONE, "
