title: SiYuan is a personal knowledge management system. Prior to version 3.6.2,
  an attacker who can place a malicious URL in an Attribute View mAsse field can
  trigger stored XSS when a victim opens the Gallery or Kanban view with “Cover 
  From -> Asset Field” enabled. The vulnerable code accepts arbitrary http(s) 
  URLs without extensions as images, stores the attacker-controlled string in 
  coverURL, and injects it directly into an <img src="..."> attribute without 
  escaping. In the Electron desktop client, the injected JavaScript executes 
  with nodeIntegration enabled and contextIsolation disabled, so the XSS reaches
  arbitrary OS command execution under the victim’s account. This issue has been
  patched in version 3.6.2.
