title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncdx:
  Fix possible UAF error in driver_override_show()\n\nFixed a possible UAF problem
  in driver_override_show() in drivers/cdx/cdx.c\n\nThis function driver_override_show()
  is part of DEVICE_ATTR_RW, which\nincludes both driver_override_show() and driver_override_store().\n\
  These functions can be executed concurrently in sysfs.\n\nThe driver_override_store()
  function uses driver_set_override() to\nupdate the driver_override value, and driver_set_override()
  internally\nlocks the device (device_lock(dev)). If driver_override_show() reads\n\
  cdx_dev->driver_override without locking, it could potentially access\na freed pointer
  if driver_override_store() frees the string\nconcurrently. This could lead to printing
  a kernel address, which is a\nsecurity risk since DEVICE_ATTR can be read by all
  users.\n\nAdditionally, a similar pattern is used in drivers/amba/bus.c, as well\n\
  as many other bus drivers, where device_lock() is taken in the show\nf"
