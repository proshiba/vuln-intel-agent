title: A logic vulnerability in the password reset token validation routine 
  implemented by osTicket in versions prior to v1.17.8 and v1.18.4. During the 
  password reset process, the application retrieves the timestamp associated 
  with the provided token and checks whether the configured validity period has 
  expired. Consequently, the expiry check is only performed if the timestamp 
  lookup fails, allowing tokens with an existing timestamp to bypass the 
  intended expiry validation. Therefore, an attacker able to obtain a valid 
  password reset token could reuse it to perform an unauthorised password reset 
  and compromise the affected account.
