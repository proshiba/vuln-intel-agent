title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  aead - Fix reqsize handling\n\nCommit afddce13ce81d (\"crypto: api - Add reqsize
  to crypto_alg\")\nintroduced cra_reqsize field in crypto_alg struct to replace type\n\
  specific reqsize fields. It looks like this was introduced specifically\nfor ahash
  and acomp from the commit description as subsequent commits\nadd necessary changes
  in these alg frameworks.\n\nHowever, this is being recommended for use in all crypto
  algs\ninstead of setting reqsize using crypto_*_set_reqsize(). Using\ncra_reqsize
  in aead algorithms, hence, causes memory corruptions and\ncrashes as the underlying
  functions in the algorithm framework have not\nbeen updated to set the reqsize properly
  from cra_reqsize. [1]\n\nAdd proper set_reqsize calls in the aead init function
  to properly\ninitialize reqsize for these algorithms in the framework.\n\n[1]: https://gist.github.com/Pratham-T/24247446f1faf4b7843e4014d5089f6b"
