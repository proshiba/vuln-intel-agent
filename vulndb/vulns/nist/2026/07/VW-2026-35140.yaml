title: OAuthenticator is software that allows OAuth2 identity providers to be 
  plugged in and used with JupyterHub. Prior to version 17.4.0, an 
  authentication bypass vulnerability in oauthenticator allows an attacker with 
  an unverified email address on an Auth0 tenant to login to JupyterHub. When 
  email is used as the usrname_claim, this gives users control over their 
  username and the possibility of account takeover. This issue has been patched 
  in version 17.4.0.
