title: Keycloak provides a way to let users log in using Microsoft accounts 
  while restricting access to a specific organization (tenant). A flaw was 
  discovered where this restriction is ignored when using the token exchange 
  feature. This means an attacker with a valid Microsoft token from a completely
  different organization could gain access to the Keycloak realm, potentially 
  accessing sensitive data or performing unauthorized actions.
