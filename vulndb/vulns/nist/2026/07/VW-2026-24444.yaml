title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/vcn:
  set no_user_fence for VCN v3.0 enc/dec rings\n\nVCN encoder and decoder rings do
  not support 64-bit user fence writes,\nreject CS submissions with user fences.\n\
  \n(cherry picked from commit 663bed3c7b8b9a7624b0d95d300ddae034ad0614)"
