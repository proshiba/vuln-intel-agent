title: The miniOrange Social Login and Register (Discord, Google, Twitter, 
  LinkedIn) WordPress plugin before 7.8.0 does not bind the one-time code used 
  by its optional email-verification (Profile Completion) feature to the account
  it was issued for, allowing unauthenticated attackers to obtain a valid 
  session for any account, including administrators, by requesting a code for an
  email address they control and replaying it against the victim's email 
  address. Exploitation requires the Profile Completion feature to be enabled 
  and social login to be configured.
