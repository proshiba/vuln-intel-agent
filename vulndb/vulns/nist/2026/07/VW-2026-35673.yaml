title: An eval() injection vulnerability in the Rapid7 Insight Agent beaconing 
  logic for Linux versions could theoretically allow an attacker to achieve 
  remote code execution as root via a crafted beacon response. Because the Agent
  uses mutual TLS (mTLS) to verify commands from the Rapid7 Platform, it is 
  unlikely that the eval() function could be exploited remotely without prior, 
  highly privileged access to the backend platform.
