title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  davinci: fix division by zero on missing clock-frequency\n\nWhen the 'clock-frequency'
  property is missing from the device tree,\nthe driver falls back to DAVINCI_I2C_DEFAULT_BUS_FREQ.
  However, this\nmacro was defined in kHz (100), whereas the device tree property
  is\nexpected in Hz.\n\nThe probe function divided the fallback value by 1000, causing\n\
  integer truncation that resulted in dev->bus_freq = 0. This triggered\na deterministic
  division-by-zero kernel panic when calculating clock\ndividers later in the probe
  sequence.\n\nFix this by redefining DAVINCI_I2C_DEFAULT_BUS_FREQ in Hz (100000)\n\
  to match the expected device tree property unit, allowing the existing\ndivision
  logic to work correctly for both cases."
