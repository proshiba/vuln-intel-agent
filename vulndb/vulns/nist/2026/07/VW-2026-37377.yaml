title: MWDB Core versions >=2.0.0 and <2.19.0 contain a missing authorization 
  vulnerability in the deprecated config and blob upload endpoints. These 
  endpoints accept the undocumented POST method, which bypasses the capability 
  checks applied to the documented PUT method. This allows any authenticated 
  user without the adding_configs or adding_blobs capabilities to upload config 
  and text blob objects to the system. The impact is limited to adding new 
  config and blob objects. This issue has been fixed in version 2.19.0
