title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsvcrdma:
  wake sq waiters when the transport closes\n\nThreads parked in svc_rdma_sq_wait()
  on sc_sq_ticket_wait or\nsc_send_wait can hang indefinitely in TASK_UNINTERRUPTIBLE
  state\nacross transport teardown, pinning svc_xprt references and\nblocking svc_rdma_free().\n\
  \nThe close path sets XPT_CLOSE before invoking xpo_detach and both\nwait_event
  predicates include an XPT_CLOSE term, but the\npredicates are re-evaluated only
  on wakeup. sc_sq_ticket_wait has\nno completion-driven wake path; it is advanced
  solely by the\nchained ticket handoff inside svc_rdma_sq_wait() itself. Without\n\
  an explicit wake at close, parked threads never observe\nXPT_CLOSE, hold their svc_xprt_get
  reference forever, and\nsvc_rdma_free() blocks on xpt_ref dropping to zero.\n\n\
  Two close entry points reach this transport. Local teardown runs\nsvc_rdma_detach()
  from svc_handle_xprt() -> svc_delete_xprt() ->\nxpo_detach() on a worker thread.
