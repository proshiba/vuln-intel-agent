title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  RFCOMM: hold listener socket in rfcomm_connect_ind()\n\nrfcomm_get_sock_by_channel()
  scans rfcomm_sk_list under the list lock,\nbut returns the selected listener after
  dropping that lock without\ntaking a reference. rfcomm_connect_ind() then locks
  the listener,\nqueues a child socket on it, and may notify it after unlocking it.\n\
  \nThe buggy scenario involves two paths, with each column showing the\norder within
  that path:\n\nrfcomm_connect_ind():            listener close:\n  1. Find parent
  in              1. close() enters\n     rfcomm_get_sock_by_channel()   rfcomm_sock_release().\n\
  \  2. Drop rfcomm_sk_list.lock    2. rfcomm_sock_shutdown()\n     without pinning
  parent.        closes the listener.\n  3. Call lock_sock(parent) and  3. rfcomm_sock_kill()\n\
  \     bt_accept_enqueue(parent,      unlinks and puts parent.\n     sk, true).\n\
  \  4. Read parent flags and may   4. parent can be freed.\n     call sk_state_change().\n\
  \nIf clos"
