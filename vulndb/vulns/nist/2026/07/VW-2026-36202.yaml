title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  temperature: tmp006: use devm_iio_trigger_register\n\ntmp006_probe() allocates the
  DRDY trigger with devm_iio_trigger_alloc()\nbut registers it with plain iio_trigger_register().
  The driver has no\n.remove() callback, so on module unload the trigger stays in
  the global\ntrigger list while its memory is freed by devm, leaving a dangling\n\
  entry.\n\nSwitch to devm_iio_trigger_register() so the registration is undone in\n\
  the same devm scope as the allocation."
