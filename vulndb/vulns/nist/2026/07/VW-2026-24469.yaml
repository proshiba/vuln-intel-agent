title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix amdgpu_hmm_range_get_pages\n\nThe notifier sequence must only be read once or
  otherwise we could work\nwith invalid pages.\n\nWhile at it also fix the coding
  style, e.g. drop the pre-initialized\nreturn value and use the common define for
  2G range.\n\n(cherry picked from commit c08972f555945cda57b0adb72272a37910153390)"
