title: Parse Server is an open source backend that can be deployed to any 
  infrastructure that can run Node.js. Prior to versions 8.6.71 and 
  9.7.1-alpha.1, file downloads via HTTP Range requests bypass the 
  afterFind(Parse.File) trigger and its validators on storage adapters that 
  support streaming (e.g. the default GridFS adapter). This allows access to 
  files that should be protected by afterFind trigger authorization logic or 
  built-in validators such as requireUser. This issue has been patched in 
  versions 8.6.71 and 9.7.1-alpha.1.
