title: openITCOCKPIT is an open source monitoring tool built for different 
  monitoring engines. openITCOCKPIT Community Edition prior to version 5.5.2 
  contains a command injection vulnerability that allows an authenticated user 
  with permission to add or modify hosts to execute arbitrary OS commands on the
  monitoring backend. The vulnerability arises because user-controlled host 
  attributes (specifically the host address) are expanded into monitoring 
  command templates without validation, escaping, or quoting. These templates 
  are later executed by the monitoring engine (Nagios/Icinga) via a shell, 
  resulting in remote code execution. Version 5.5.2 patches the issue.
