title: CentreStack before 17.2 contains an authentication bypass vulnerability 
  that allows unauthenticated attackers to read, write, or delete arbitrary 
  account settings by exploiting exposed API endpoints that lack authorization 
  checks. Attackers can generate valid encrypted EntAcctId values using the 
  static shared encryption key to forge identifiers for any user GUID, including
  the system-wide cluster settings account, enabling enumeration of hosted 
  tenant domains and administrator identities.
