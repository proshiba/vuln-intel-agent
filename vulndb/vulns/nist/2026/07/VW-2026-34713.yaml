title: sysPass through version 3.2.11 contains an OS command injection 
  vulnerability that allows authenticated administrators to execute arbitrary 
  commands as the web server process user by setting a malicious backup path and
  triggering a backup. The FileBackupService builds a tar shell command via 
  string concatenation, inserting the admin-configurable siteBackupPath setting 
  without escapeshellarg() or equivalent sanitization before passing it to 
  exec(), causing injected commands to persist and execute on every subsequent 
  backup trigger.
