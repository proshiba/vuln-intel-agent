title: An insufficient session expiration vulnerability exists in the latest 
  version of parisneo/lollms. The application fails to invalidate active 
  sessions after a password reset, allowing an attacker to continue using an old
  session token. This issue arises due to the absence of logic to reject 
  requests after a period of inactivity and the excessively long default session
  duration of 31 days. The vulnerability enables an attacker to maintain 
  persistent access to a compromised account, even after the victim resets their
  password.
