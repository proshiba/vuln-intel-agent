title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rtrs-srv:
  Bound RDMA-Write length to chunk size in rdma_write_sg\n\nWhen the server answers
  an RTRS READ, rdma_write_sg() builds the source\nscatter/gather entry for the IB_WR_RDMA_WRITE
  that returns data to the\npeer. Its length is taken directly from the wire descriptor:\n\
  \n  plist->length = le32_to_cpu(id->rd_msg->desc[0].len);\n\nrd_msg points into
  the chunk buffer that the remote peer filled via\nRDMA-WRITE-WITH-IMM (rtrs_srv_rdma_done()
  -> process_io_req() ->\nprocess_read()), so desc[0].len is attacker-controlled and,
  before this\nchange, was only rejected when zero. The source address is the fixed\n\
  chunk start (dma_addr[msg_id]) and the source lkey is the PD-wide\nlocal_dma_lkey,
  which is not tied to the chunk's MR mapping, so the verbs\nlayer does not constrain
  the transfer length to max_chunk_size. msg_id\nand off are bounded against queue_depth
  and max_chunk_size in\nrtrs_srv_rdma_done(), but desc[0].len is a separate"
