title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  light: gp2ap002: fix runtime PM leak on read error\n\ngp2ap002_read_raw() calls
  pm_runtime_get_sync() before reading the\nlux value, but if gp2ap002_get_lux() fails,
  it returns directly. This\nskips the pm_runtime_put_autosuspend() call at the \"\
  out\" label,\npermanently leaking a runtime PM reference and preventing the device\n\
  from autosuspending.\n\nReplace the direct return with a \"goto out\" to ensure
  the reference\nis properly dropped on the error path."
