title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: add missing rcu read protection for procfs content\n\nWhen the procfs content
  is generated for a bcm_op which is in the process\nto be removed the procfs output
  might show unreliable data (UAF).\n\nAs the removal of bcm_op's is already implemented
  with rcu handling this\npatch adds the missing rcu_read_lock() and makes sure the
  list entries\nare properly removed under rcu protection."
