title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: tcpci_rt1711h: unregister TCPCI port with devres\n\nrt1711h_probe() registers
  the TCPCI port before requesting the interrupt\nand enabling alert interrupts. If
  either of those later steps fails, the\nprobe function returns without unregistering
  the TCPCI port. The explicit\nunregister currently only happens from the remove
  callback.\n\nRegister a devres action immediately after tcpci_register_port() succeeds,\n\
  so tcpci_unregister_port() runs on later probe failures and on driver\ndetach. Drop
  the remove callback to avoid unregistering the same port\ntwice.\n\nThis issue was
  identified during our ongoing static-analysis research while\nreviewing kernel code."
