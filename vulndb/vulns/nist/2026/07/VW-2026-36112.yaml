title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  ultrasoc-smb: Fix OOB write in smb_sync_perf_buffer()\n\nWhen the SMB sink is used
  as a perf AUX sink, smb_update_buffer() calls\nsmb_sync_perf_buffer() to copy hardware
  trace data into the perf AUX ring\nbuffer pages. It derives pg_idx = head >> PAGE_SHIFT
  from @head, which is\nhandle->head, and indexes dst_pages[pg_idx]. The pg_idx %=
  nr_pages\nnormalization is only applied after the first loop iteration.\n\nThis
  leaves the initial page index underived from the buffer size, which\ncan result
  in an out-of-bounds write past dst_pages[] when head exceeds\nthe AUX buffer size.\n\
  \nNormalize head modulo the AUX buffer size before deriving the page index\nand
  offset, mirroring tmc_etr_sync_perf_buffer()."
