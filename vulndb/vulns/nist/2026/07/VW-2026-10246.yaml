title: A flaw was found in gnutls. An off-by-one error exists in the PKCS#12 bag
  element bounds check. This vulnerability allows an remote attacker to write 
  past the internal array of a PKCS#12 bag when appending to a bag that already 
  contains 32 elements. This memory corruption could lead to a denial of service
  (DoS) or potentially other unspecified impacts.
