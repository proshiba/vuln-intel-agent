  Preferences dialog that allows local attackers to trigger a structured 
  exception handler (SEH) overwrite by supplying malicious input. Attackers can 
  craft a payload string in the 'Language for menus and messages' field to 
  overwrite SEH records and achieve code execution with calculator or arbitrary 
  shellcode.
