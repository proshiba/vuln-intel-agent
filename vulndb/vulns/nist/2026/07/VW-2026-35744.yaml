title: LobeHub is a work-and-lifestyle space to find, build, and collaborate 
  with agent teammates that grow with you. Prior to 2.1.48, the webapi 
  authentication layer trusts a client-controlled X-lobe-chat-auth header that 
  is only XOR-obfuscated, not signed or otherwise authenticated. Because the XOR
  key is hardcoded in the repository, an attacker can forge arbitrary auth 
  payloads and bypass authentication on protected webapi routes. Affected routes
  include /webapi/chat/[provider], /webapi/models/[provider], 
  /webapi/models/[provider]/pull, and /webapi/create-image/comfyui. This 
  vulnerability is fixed in 2.1.48.
