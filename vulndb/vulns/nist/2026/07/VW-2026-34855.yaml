title: Parse Server is an open source backend that can be deployed to any 
  infrastructure that can run Node.js. Prior to versions 8.6.63 and 
  9.7.0-alpha.7, the verify password endpoint returns unsanitized authentication
  data, including MFA TOTP secrets, recovery codes, and OAuth access tokens. An 
  attacker who knows a user's password can extract the MFA secret to generate 
  valid MFA codes, defeating multi-factor authentication protection. This issue 
  has been patched in versions 8.6.63 and 9.7.0-alpha.7.
