title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  shrinker: fix NULL pointer dereference in debugfs\n\nshrinker_debugfs_add() creates
  both \"count\" and \"scan\" debugfs files\nunconditionally.\n\nThat assumes every
  shrinker implements both count_objects() and\nscan_objects(), which is not guaranteed.\
  \  For example, the xen-backend\nshrinker sets count_objects() but leaves scan_objects()
  NULL, so writing\nto its scan file calls through a NULL function pointer and panics
  the\nkernel:\n\nBUG: kernel NULL pointer dereference, address: 0000000000000000\n\
  RIP: 0010:0x0\nCode: Unable to access opcode bytes at 0xffffffffffffffd6.\nCall
  Trace:\n <TASK>\n shrinker_debugfs_scan_write+0x12e/0x270\n full_proxy_write+0x5f/0x90\n\
  \ vfs_write+0xde/0x420\n ? filp_flush+0x75/0x90\n ? filp_close+0x1d/0x30\n ? do_dup2+0xb8/0x120\n\
  \ ksys_write+0x68/0xf0\n ? filp_flush+0x75/0x90\n do_syscall_64+0xb3/0x5b0\n entry_SYSCALL_64_after_hwframe+0x76/0x7e\n\
