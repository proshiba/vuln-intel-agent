title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix node corruption in ar->arvifs list\n\nIn current WLAN recovery code
  flow, ath12k_core_halt() only reinitializes\nthe \"arvifs\" list head. This will
  cause the list node immediately following\nthe list head to become an invalid list
  node. Because the prev of that node\nstill points to the list head \"arvifs\", but
  the next of the list head\n\"arvifs\" no longer points to that list node.\n\nWhen
  a WLAN recovery occurs during the execution of a vif removal, and it\nhappens before
  the spin_lock_bh(&ar->data_lock) in\nath12k_mac_vdev_delete(), list_del() will detect
  the previously mentioned\nsituation, thereby triggering a kernel panic.\n\nThe fix
  is to remove and reinitialize all vif list nodes from the list head\n\"arvifs\"\
  \ during WLAN halt. The reinitialization is to make the list nodes\nvalid, ensuring
  that the list_del() in ath12k_mac_vdev_delete() can execute\nnormally.\n\nCall trace:\n\
  __list_del_entry_valid_or_report+0xd4/0x"
