title: A vulnerability was detected in Ne-Lexa php-zip up to 4.0.2. This affects
  the function ZipFile::extractTo of the file src/ZipFile.php of the component 
  ZIP Handler. Performing a manipulation of the argument entryName results in 
  path traversal. It is possible to initiate the attack remotely. The exploit is
  now public and may be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
