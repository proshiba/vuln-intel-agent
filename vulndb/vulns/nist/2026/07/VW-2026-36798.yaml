title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  eir: Fix stack OOB write when prepending the Flags AD\n\neir_create_adv_data() builds
  the advertising data into a fixed-size\nbuffer (\"size\", 31 for the legacy path).
  It may prepend a 3-byte \"Flags\"\nAD structure (LE_AD_NO_BREDR on an LE-only controller)
  and then copies\nthe per-instance data without checking that it still fits:\n\n\t
  memcpy(ptr, adv->adv_data, adv->adv_data_len);\n\ntlv_data_max_len() only reserves
  those 3 bytes when the user-supplied\nflags carry a managed-flags bit, so an instance
  added with flags == 0 is\naccepted with adv_data_len up to the full buffer. At advertise
  time the\nflags are still prepended, and the memcpy() writes 3 + adv_data_len\n\
  bytes into the size-byte buffer:\n\n  BUG: KASAN: stack-out-of-bounds in eir_create_adv_data
  (net/bluetooth/eir.c:301)\n  Write of size 31 at addr ffff88800a547bdc by task kworker/u9:0/65\n\
  \  Workqueue: hci0 hci_cmd_sync_work\n   __asan_memcpy (mm/kasan/shadow.c:106)"
