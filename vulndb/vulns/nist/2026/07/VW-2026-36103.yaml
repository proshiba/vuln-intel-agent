title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  run set info with opener credentials\n\nSMB2 SET_INFO handlers call path-based VFS
  helpers after checking the\naccess mask granted to the SMB handle. Those helpers
  perform their owner,\ninode permission and LSM checks using the current ksmbd worker
  credentials.\n\nRun the complete SET_INFO dispatch with the credentials captured
  when the\nhandle was opened. This also removes the separate security information\n\
  credential setup and keeps all SET_INFO classes under one credential scope.\n\n\
  Direct override_creds() is used because it can nest with the request\ncredential
  overrides already used by rename and link helpers."
