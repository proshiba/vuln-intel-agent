title: "In the Linux kernel, the following vulnerability has been resolved:\n\nespintcp:
  remove encap socket caching to avoid reference leak\n\nThe current scheme for caching
  the encap socket can lead to reference\nleaks when we try to delete the netns.\n\
  \nThe reference chain is: xfrm_state -> enacp_sk -> netns\n\nSince the encap socket
  is a userspace socket, it holds a reference on\nthe netns. If we delete the espintcp
  state (through flush or\nindividual delete) before removing the netns, the reference
  on the\nsocket is dropped and the netns is correctly deleted. Otherwise, the\nnetns
  may not be reachable anymore (if all processes within the ns\nhave terminated),
  so we cannot delete the xfrm state to drop its\nreference on the socket.\n\nThis
  patch results in a small (~2% in my tests) performance\nregression.\n\nA GC-type
  mechanism could be added for the socket cache, to clear\nreferences if the state
  hasn't been used \"recently\", but it's a lot\nmore complex than just not caching
  the socket."
