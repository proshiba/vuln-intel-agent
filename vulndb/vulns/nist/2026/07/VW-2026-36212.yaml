title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: ad_sigma_delta: fix clear_pending_event for registerless devices\n\nad_sigma_delta_clear_pending_event()
  falls through to the status register\nread path for devices with has_registers =
  false and no rdy_gpiod. For\nsuch devices, ad_sd_read_reg() skips the address byte
  entirely and clocks\nraw MISO bytes with no address phase — making it byte-for-byte
  identical\nto reading conversion data. If a pending conversion result is present,\n\
  this partially consumes it and corrupts the data stream for the subsequent\nad_sd_read_reg()
  call in ad_sigma_delta_single_conversion().\n\nFurthermore, with num_resetclks =
  0 on these devices, data_read_len\nevaluates to 0. If the clocked byte has bit 7
  clear, pending_event is set\nand the code attempts memset(data + 2, 0xff, 0 - 1),
  overflowing to\nSIZE_MAX and corrupting the heap.\n\nFix by returning 0 immediately
  when neither rdy_gpiod nor has_registers\nis set. This is safe for all current r"
