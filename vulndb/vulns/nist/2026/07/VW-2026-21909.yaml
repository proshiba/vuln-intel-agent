title: PraisonAI before 1.6.78 contains a remote code execution vulnerability in
  CodeAgent._execute_python() that executes LLM-generated Python code without 
  AST validation, import restrictions, or sandbox enforcement. Attackers can 
  influence LLM output through prompt injection to exfiltrate all environment 
  secrets and execute arbitrary code on the host system.
