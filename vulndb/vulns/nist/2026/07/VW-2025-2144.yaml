title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix node corruption in ar->arvifs list\n\nIn current WLAN recovery code
  flow, ath11k_core_halt() only\nreinitializes the \"arvifs\" list head. This will
  cause the\nlist node immediately following the list head to become an\ninvalid list
  node. Because the prev of that node still points\nto the list head \"arvifs\", but
  the next of the list head \"arvifs\"\nno longer points to that list node.\n\nWhen
  a WLAN recovery occurs during the execution of a vif\nremoval, and it happens before
  the spin_lock_bh(&ar->data_lock)\nin ath11k_mac_op_remove_interface(), list_del()
  will detect the\npreviously mentioned situation, thereby triggering a kernel panic.\n\
  \nThe fix is to remove and reinitialize all vif list nodes from the\nlist head \"\
  arvifs\" during WLAN halt. The reinitialization is to make\nthe list nodes valid,
  ensuring that the list_del() in\nath11k_mac_op_remove_interface() can execute normally.\n\
  \nCall trace:\n__list_del_entry_valid_o"
