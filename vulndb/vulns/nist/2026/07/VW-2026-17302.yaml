title: picklescan before 0.0.25 fails to detect malicious pickle files that use 
  timeit.timeit() in the __reduce__ method, allowing remote code execution. 
  Attackers can craft pickle files that import dangerous libraries like os and 
  execute arbitrary system commands, which evade picklescan detection and 
  execute when pickle.load() is called.
