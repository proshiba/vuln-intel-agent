title: SiYuan is a personal knowledge management system. Prior to version 3.6.2,
  the publish service exposes bookmarked blocks from password-protected 
  documents to unauthenticated visitors. In publish/read-only mode, 
  /api/bookmark/getBookmark filters bookmark results by calling 
  FilterBlocksByPublishAccess(nil, ...). Because the filter treats a nil context
  as authorized, it skips the publish password check and returns bookmarked 
  blocks from documents configured as Protected. As a result, anyone who can 
  access the publish service can retrieve content from protected documents 
  without providing the required password, as long as at least one block in the 
  document is bookmarked. This issue has been patched in version 3.6.2.
