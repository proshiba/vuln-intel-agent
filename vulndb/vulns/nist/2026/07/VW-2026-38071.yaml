title: CentreStack before 17.4 contains a SQL injection vulnerability in 
  GladDBFiles.SearchEx() and SearchExUnder() that allows authenticated attackers
  to execute arbitrary SQL statements by supplying a crafted x-glad-filter 
  request header through the jsondir API endpoint. Attackers can exploit 
  unsanitized interpolation of the Field parameter directly into SQL query 
  strings to write arbitrary files to the server filesystem via PostgreSQL 
  lo_from_bytea() and lo_export() functions, enabling remote code execution.
