title: Hono before 4.12.7 allows __proto__ key in parseBody with dot option 
  enabled, permitting specially crafted form field names to create objects with 
  __proto__ properties. When parsed results are merged into regular JavaScript 
  objects using unsafe merge patterns, attackers can exploit this to achieve 
  prototype pollution and modify object behavior.
