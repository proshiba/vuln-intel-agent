title: The MStore API plugin for WordPress is vulnerable to  Insecure Direct 
  Object Reference in all versions up to, and including, 4.18.3. This is due to 
  the update_user_profile() function in controllers/flutter-user.php processing 
  the 'meta_data' JSON parameter without any allowlist, blocklist, or validation
  of meta keys. The function reads raw JSON from php://input (line 1012), 
  decodes it (line 1013), authenticates the user via cookie validation (line 
  1015), and then directly iterates over the user-supplied meta_data array 
  passing arbitrary keys and values to update_user_meta() (line 1080) with no 
  sanitization or restrictions. This makes it possible for authenticated 
  attackers, with Subscriber-level access and above, to modify arbitrary user 
  meta fields on their own accounts, including sensitive fields like 
