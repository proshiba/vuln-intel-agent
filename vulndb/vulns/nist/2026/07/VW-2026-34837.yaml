title: SciTokens C++ is a minimal library for creating and using SciTokens from 
  C or C++. Prior to version 1.4.1, scitokens-cpp is vulnerable to an 
  authorization bypass in path-based scope validation. The enforcer used a 
  simple string-prefix comparison when checking whether a requested resource 
  path was covered by a token's authorized scope path. Because the check did not
  require a path-segment boundary, a token scoped to one path could incorrectly 
  authorize access to sibling paths that merely started with the same prefix. 
  This issue has been patched in version 1.4.1.
