title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  qcom: Fix sc7280 lpass potential buffer overflow\n\nCase values introduced in commit\n\
  5f78e1fb7a3e (\"ASoC: qcom: Add driver support for audioreach solution\")\ncause
  out of bounds access in arrays of sc7280 driver data (e.g. in case\nof RX_CODEC_DMA_RX_0
  in sc7280_snd_hw_params()).\n\nRedefine LPASS_MAX_PORTS to consider the maximum
  possible port id for\nq6dsp as sc7280 driver utilizes some of those values.\n\n\
  Found by Linux Verification Center (linuxtesting.org) with SVACE."
