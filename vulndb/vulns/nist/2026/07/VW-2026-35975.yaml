title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  clear intr_entry in fuse_resend and fuse_remove_pending_req\n\nWhen fuse_resend()
  moves a request from fpq->processing back to\nfiq->pending, it sets FR_PENDING and
  clears FR_SENT but does not\nremove the requests intr_entry from fiq->interrupts.\
  \  If the\nrequest had FR_INTERRUPTED set from a prior signal, intr_entry\nremains
  dangling on fiq->interrupts.  When the requesting task\nthen receives a fatal signal,
  fuse_remove_pending_req() sees\nFR_PENDING=1, removes the request from fiq->pending
  and frees it\nvia the refcount path, also without cleaning intr_entry.  The\nstale
  intr_entry causes use-after-free when fuse_read_interrupt()\niterates fiq->interrupts:\n\
  \  - list_del_init(&req->intr_entry) -> UAF write on freed slab\n  - req->in.h.unique
  -> UAF read, data leaked to userspace\n\nRemove intr_entry from fiq->interrupts
  in fuse_resend() for\ninterrupted requests before they are placed back on fiq->pending.\n\
