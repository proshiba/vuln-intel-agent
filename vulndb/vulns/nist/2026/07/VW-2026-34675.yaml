title: "In the Linux kernel, the following vulnerability has been resolved:\n\nMIPS:
  smp: report dying CPU to RCU in stop_this_cpu()\n\nsmp_send_stop() parks all secondary
  CPUs in stop_this_cpu(). The function\nmarks the CPU offline for the scheduler via
  set_cpu_online(false) but\nnever informs RCU, so RCU keeps expecting a quiescent
  state from CPUs\nthat are now spinning forever with interrupts disabled.\n\nAs long
  as nothing waits for an RCU grace period after smp_send_stop()\nthis is harmless,
  which is why it went unnoticed. Since commit\n91840be8f710 (\"irq_work: Fix use-after-free
  in irq_work_single() on PREEMPT_RT\")\nhowever, irq_work_sync() calls synchronize_rcu()
  on architectures without\nan irq_work self-IPI, i.e. where arch_irq_work_has_interrupt()
  returns\nfalse. That is the asm-generic default used by MIPS. Any irq_work_sync()\n\
  issued in the reboot/shutdown path after smp_send_stop() then blocks on\na grace
  period that can never complete, hanging the reboot:\n\n  WARNING: CPU: 0 PID: 15
  at kernel/irq"
