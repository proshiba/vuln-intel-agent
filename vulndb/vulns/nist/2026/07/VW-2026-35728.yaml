title: LORIS (Longitudinal Online Research and Imaging System) is a self-hosted 
  web application that provides data- and project-management for neuroimaging 
  research. From 21.0.0 to before 27.0.3 and 28.0.1, while the 
  document_repository frontend was restricting file access, the backend endpoint
  was not correctly verifying access permissions. A user could theoretically 
  download a file that they should not have access to, if they know or can brute
  force the filename. This vulnerability is fixed in 27.0.3 and 28.0.1.
