title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  prevent A-MSDU attacks in mesh networks\n\nThis patch is a mitigation to prevent
  the A-MSDU spoofing vulnerability\nfor mesh networks. The initial update to the
  IEEE 802.11 standard, in\nresponse to the FragAttacks, missed this case (CVE-2025-27558).
  It can\nbe considered a variant of CVE-2020-24588 but for mesh networks.\n\nThis
  patch tries to detect if a standard MSDU was turned into an A-MSDU\nby an adversary.
  This is done by parsing a received A-MSDU as a standard\nMSDU, calculating the length
  of the Mesh Control header, and seeing if\nthe 6 bytes after this header equal the
  start of an rfc1042 header. If\nequal, this is a strong indication of an ongoing
  attack attempt.\n\nThis defense was tested with mac80211_hwsim against a mesh network
  that\nuses an empty Mesh Address Extension field, i.e., when four addresses\nare
  used, and when using a 12-byte Mesh Address Extension field, i.e.,\nwhen six addresses
  are used. Functional"
