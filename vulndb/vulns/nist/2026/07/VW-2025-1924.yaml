title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudp:
  Fix multiple wraparounds of sk->sk_rmem_alloc.\n\n__udp_enqueue_schedule_skb() has
  the following condition:\n\n  if (atomic_read(&sk->sk_rmem_alloc) > sk->sk_rcvbuf)\n\
  \          goto drop;\n\nsk->sk_rcvbuf is initialised by net.core.rmem_default and
  later can\nbe configured by SO_RCVBUF, which is limited by net.core.rmem_max,\n\
  or SO_RCVBUFFORCE.\n\nIf we set INT_MAX to sk->sk_rcvbuf, the condition is always
  false\nas sk->sk_rmem_alloc is also signed int.\n\nThen, the size of the incoming
  skb is added to sk->sk_rmem_alloc\nunconditionally.\n\nThis results in integer overflow
  (possibly multiple times) on\nsk->sk_rmem_alloc and allows a single socket to have
  skb up to\nnet.core.udp_mem[1].\n\nFor example, if we set a large value to udp_mem[1]
  and INT_MAX to\nsk->sk_rcvbuf and flood packets to the socket, we can see multiple\n\
  overflows:\n\n  # cat /proc/net/sockstat | grep UDP:\n  UDP: inuse 3 mem 7956736\
  \  <-- (7956736 << 12) bytes > INT_MAX *"
