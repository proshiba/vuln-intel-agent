title: Chyrp Lite is an ultra-lightweight blogging engine. Prior to 2026.01, an 
  IDOR / Mass Assignment issue exists in the Post model that allows 
  authenticated users with post editing permissions (Edit Post, Edit Draft, Edit
  Own Post, Edit Own Draft) to modify posts they do not own and do not have 
  permission to edit. By passing internal class properties such as id into the 
  post_attributes payload, an attacker can alter the object being instantiated. 
  As a result, further actions are performed on another user’s post rather than 
  the attacker’s own post, effectively enabling post takeover. This 
  vulnerability is fixed in 2026.01.
