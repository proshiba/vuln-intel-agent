title: "Memory Allocation with Excessive Size Value vulnerability in Apache ActiveMQ,
  Apache ActiveMQ All, Apache ActiveMQ Stomp.\n\n\nAn unauthenticated client that
  opens a STOMP NIO connection can send header bytes that never terminate which makes
  the broker buffer them without limit, exhausting the JVM heap. \nThis issue affects
  Apache ActiveMQ: before 5.19.8, from 6.0.0 before 6.2.7; Apache ActiveMQ All: before
  5.19.8, from 6.0.0 before 6.2.7; Apache ActiveMQ Stomp: before 5.19.8, from 6.0.0
  before 6.2.7.\n\nUsers are recommended to upgrade to version 6.2.7 or 5.19.8, which
  fixes the issue."
