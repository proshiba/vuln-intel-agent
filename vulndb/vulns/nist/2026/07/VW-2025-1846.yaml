title: "In the Linux kernel, the following vulnerability has been resolved:\n\nax25:
  Fix refcount leak caused by setting SO_BINDTODEVICE sockopt\n\nIf an AX25 device
  is bound to a socket by setting the SO_BINDTODEVICE\nsocket option, a refcount leak
  will occur in ax25_release().\n\nCommit 9fd75b66b8f6 (\"ax25: Fix refcount leaks
  caused by ax25_cb_del()\")\nadded decrement of device refcounts in ax25_release().
  In order for that\nto work correctly the refcounts must already be incremented when
  the\ndevice is bound to the socket. An AX25 device can be bound to a socket\nby
  either calling ax25_bind() or setting SO_BINDTODEVICE socket option.\nIn both cases
  the refcounts should be incremented, but in fact it is done\nonly in ax25_bind().\n\
  \nThis bug leads to the following issue reported by Syzkaller:\n\n================================================================\n\
  refcount_t: decrement hit 0; leaking memory.\nWARNING: CPU: 1 PID: 5932 at lib/refcount.c:31
  refcount_warn_saturate+0x1ed/0x210 lib/refcount.c:31\nModule"
