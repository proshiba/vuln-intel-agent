title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  airoha: Add NULL check for of_reserved_mem_lookup() in airoha_qdma_init_hfwd_queues()\n\
  \nof_reserved_mem_lookup() may return NULL if the reserved memory region\nreferenced
  by the \"memory-region\" phandle is not found in the reserved\nmemory table (e.g.
  due to a misconfigured DTS or a removed\nmemory-region node).  The current code
  dereferences the returned\npointer without checking for NULL, leading to a kernel
  NULL pointer\ndereference at the following lines:\n\n    dma_addr = rmem->base;\
  \                          // line 1156\n    num_desc = div_u64(rmem->size, buf_size);\
  \       // line 1160\n\nAdd a NULL check after of_reserved_mem_lookup() and return
  -ENODEV if\nthe lookup fails, which is consistent with the existing error handling\n\
  for of_parse_phandle() failure in the same code block."
