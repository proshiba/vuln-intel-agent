title: FreeScout is a free help desk and shared inbox built with PHP's Laravel 
  framework. Prior to version 1.8.211, host header manipulation in FreeScout 
  version (http://localhost:8080/system/status) allows an attacker to inject an 
  arbitrary domain into generated absolute URLs. This leads to External Resource
  Loading and Open Redirect behavior. When the application constructs links and 
  assets using the unvalidated Host header, user requests can be redirected to 
  attacker-controlled domains and external resources may be loaded from 
  malicious servers. This issue has been patched in version 1.8.211.
