title: Leantime 3.6.2 contains an open redirect vulnerability in the Login 
  controller that allows unauthenticated attackers to redirect authenticated 
  users to arbitrary external sites by manipulating the redirectUrl POST 
  parameter. Attackers can craft a malicious login URL with a tampered 
  redirectUrl value that bypasses FILTER_SANITIZE_URL validation to redirect 
  victims to attacker-controlled sites for phishing or credential theft.
