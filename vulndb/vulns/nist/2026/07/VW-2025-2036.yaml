title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet_sched:
  hfsc: Address reentrant enqueue adding class to eltree twice\n\nSavino says:\n \
  \   \"We are writing to report that this recent patch\n    (141d34391abbb315d68556b7c67ad97885407547)
  [1]\n    can be bypassed, and a UAF can still occur when HFSC is utilized with\n\
  \    NETEM.\n\n    The patch only checks the cl->cl_nactive field to determine whether\n\
  \    it is the first insertion or not [2], but this field is only\n    incremented
  by init_vf [3].\n\n    By using HFSC_RSC (which uses init_ed) [4], it is possible
  to bypass the\n    check and insert the class twice in the eltree.\n    Under normal
  conditions, this would lead to an infinite loop in\n    hfsc_dequeue for the reasons
  we already explained in this report [5].\n\n    However, if TBF is added as root
  qdisc and it is configured with a\n    very low rate,\n    it can be utilized to
  prevent packets from being dequeued.\n    This behavior can be exploited to perform
  subsequent ins"
