title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  atlantic: fix fragment overflow handling in RX path\n\nThe atlantic driver can receive
  packets with more than MAX_SKB_FRAGS (17)\nfragments when handling large multi-descriptor
  packets. This causes an\nout-of-bounds write in skb_add_rx_frag_netmem() leading
  to kernel panic.\n\nThe issue occurs because the driver doesn't check the total
  number of\nfragments before calling skb_add_rx_frag(). When a packet requires more\n\
  than MAX_SKB_FRAGS fragments, the fragment index exceeds the array bounds.\n\nFix
  by assuming there will be an extra frag if buff->len > AQ_CFG_RX_HDR_SIZE,\nthen
  all fragments are accounted for. And reusing the existing check to\nprevent the
  overflow earlier in the code path.\n\nThis crash occurred in production with an
  Aquantia AQC113 10G NIC.\n\nStack trace from production environment:\n```\nRIP:
  0010:skb_add_rx_frag_netmem+0x29/0xd0\nCode: 90 f3 0f 1e fa 0f 1f 44 00 00 48 89
  f8 41 89\nca 48 89 d7 48 63 ce 8b 90 c0 "
