title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ecdsa - Harden against integer overflows in DIV_ROUND_UP()\n\nHerbert notes that
  DIV_ROUND_UP() may overflow unnecessarily if an ecdsa\nimplementation's ->key_size()
  callback returns an unusually large value.\nHerbert instead suggests (for a division
  by 8):\n\n  X / 8 + !!(X & 7)\n\nBased on this formula, introduce a generic DIV_ROUND_UP_POW2()
  macro and\nuse it in lieu of DIV_ROUND_UP() for ->key_size() return values.\n\n\
  Additionally, use the macro in ecc_digits_from_bytes(), whose \"nbytes\"\nparameter
  is a ->key_size() return value in some instances, or a\nuser-specified ASN.1 length
  in the case of ecdsa_get_signature_rs()."
