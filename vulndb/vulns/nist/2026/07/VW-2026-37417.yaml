title: "In the Linux kernel, the following vulnerability has been resolved:\n\nposix-cpu-timers:
  Prevent UAF caused by non-leader exec() race\n\nWongi and Jungwoo decoded and reported
  a non-leader exec() related race\nwhich can result in an UAF:\n\n sys_timer_delete()\t\
  \t\texec()\n   posix_cpu_timer_del()\n   // Observes old leader\n   p = pid_task(pid,
  pid_type);\t\tde_thread()\n   \t\t\t\t\t  switch_leader();\n\t\t\t\t\t  release_task(old_leader)\n\
  \t\t\t\t\t    __exit_signal(old_leader)\n\t\t\t\t\t      sighand = lock(old_leader,
  sighand);\n\t\t\t\t\t      posix_cpu_timers*_exit();\n   sighand = lock_task_sighand(p)\t\
  \      unhash_task(old_leader);\n     sh = lock(p, sighand)\t    \t      old_leader->sighand
  = NULL;\n\t\t\t\t\t      unlock(sighand);\n     (p->sighand == NULL)\n\tunlock(sh)\n\
  \treturn NULL;\n\n   // Returns without action\n   if(!sighand)\n      return 0;\n\
  \   free_posix_timer();\n\nThis is \"harmless\" unless the deleted timer was armed
  and enqueued in\np->signal because on exec() a TGID targeted timer is inherited.\n\
