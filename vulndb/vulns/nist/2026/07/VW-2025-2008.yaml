title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  fix race between io_uring_cmd_complete_in_task and ublk_cancel_cmd\n\nublk_cancel_cmd()
  calls io_uring_cmd_done() to complete uring_cmd, but\nwe may have scheduled task
  work via io_uring_cmd_complete_in_task() for\ndispatching request, then kernel crash
  can be triggered.\n\nFix it by not trying to canceling the command if ublk block
  request is\nstarted."
