title: LightFTP 2.3.1 contains a race condition vulnerability that allows remote
  attackers to crash the server by racing a fresh connection that reuses the FTP
  context against an in-progress ABRT cleanup. Attackers can exploit the 
  unprotected re-check of WorkerThreadId between worker_thread_cleanup() and 
  pthread_join() outside of MTLock to cause pthread_join() to operate on an 
  invalid thread ID, resulting in a server crash. CVE-2024-11144 identifies an 
  incomplete fix of this vulnerability.
