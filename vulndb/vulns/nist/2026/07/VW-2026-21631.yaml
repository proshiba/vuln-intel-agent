title: PraisonAI before 4.6.78 contains a path traversal vulnerability in 
  ContextGatherer that fails to validate include paths in .praisoncontext and 
  .praisoninclude files. Attackers can supply absolute paths or parent directory
  traversal sequences to read arbitrary files outside the workspace and include 
  their contents in the generated context bundle.
