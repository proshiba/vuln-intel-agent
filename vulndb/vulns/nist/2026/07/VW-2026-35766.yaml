title: ALEAPP (Android Logs Events And Protobuf Parser) through 3.4.0 contains a
  path traversal vulnerability in the NQ_Vault.py artifact parser that uses 
  attacker-controlled file_name_from values from a database directly as the 
  output filename, allowing arbitrary file writes outside the report output 
  directory. An attacker can embed a path traversal payload such as 
  ../../../outside_written.bin in the database to write files to arbitrary 
  locations, potentially achieving code execution by overwriting executable 
  files or configuration.
