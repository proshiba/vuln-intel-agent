title: "A path traversal vulnerability was found in the Wallpaper component of ADM.
  The vulnerability occurs because user-controlled wallpaper path input is not sufficiently
  validated before being used for file access. An authenticated attacker can exploit
  this issue to access or manipulate files outside the intended wallpaper directory,
  subject to user permissions and filesystem restrictions.\nAffected products and
  versions include: from ADM 4.1.0 through ADM 4.3.3.RUN1 as well as from ADM 5.0.0
  through ADM 5.1.3.RI81."
