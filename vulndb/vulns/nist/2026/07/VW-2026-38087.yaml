title: "Server-Side Request Forgery vulnerability in malach-it Boruta allows an unauthenticated
  remote attacker to cause the OAuth/OpenID authorization server to issue outbound
  HTTP requests to attacker-chosen URIs, including internal services and cloud metadata
  endpoints.\n\nThree code paths fetch remote URIs supplied by the requester without
  sufficient validation of the target. Boruta.Oauth.Request.Base.fetch_unsigned_request/1
  in lib/boruta/oauth/request/base.ex dereferences the OAuth request_uri parameter
  from the authorization request via Finch.build(:get, request_uri) |> Finch.request(OpenIDHttpClient).
  Boruta.Openid.parse_registration_params/2 in lib/boruta/openid.ex dereferences the
  jwks_uri supplied in an OpenID Connect dynamic client registration request. Boruta.Ecto.Clients.refresh_jwk_from_jwks_uri/1
  in lib/boruta/adapters/ecto/clients.ex later refreshes the stored jwks_uri for an
