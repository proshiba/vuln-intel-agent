title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hns:
  Fix double destruction of rsv_qp\n\nrsv_qp may be double destroyed in error flow,
  first in free_mr_init(),\nand then in hns_roce_exit(). Fix it by moving the free_mr_init()
  call\ninto hns_roce_v2_init().\n\nlist_del corruption, ffff589732eb9b50->next is
  LIST_POISON1 (dead000000000100)\nWARNING: CPU: 8 PID: 1047115 at lib/list_debug.c:53
  __list_del_entry_valid+0x148/0x240\n...\nCall trace:\n __list_del_entry_valid+0x148/0x240\n\
  \ hns_roce_qp_remove+0x4c/0x3f0 [hns_roce_hw_v2]\n hns_roce_v2_destroy_qp_common+0x1dc/0x5f4
