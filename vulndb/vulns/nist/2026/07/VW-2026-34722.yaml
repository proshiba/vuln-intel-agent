title: A vulnerability was found in LigeroSmart up to 6.1.24. This affects an 
  unknown part of the component Environment Variable Handler. Performing a 
  manipulation of the argument REQUEST_URI results in cross site scripting. The 
  attack may be initiated remotely. The exploit has been made public and could 
  be used. Upgrading to version 6.1.26 and 6.3 is able to mitigate this issue. 
  The patch is named 264ac5b2be5b3c673ebd8cb862e673f5d300d9a7. The affected 
  component should be upgraded.
