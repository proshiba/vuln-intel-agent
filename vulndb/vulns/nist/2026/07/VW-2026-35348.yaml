title: Directus is a real-time API and App dashboard for managing SQL database 
  content. Prior to 11.16.1, Directus' TUS resumable upload endpoint 
  (/files/tus) allows any authenticated user with basic file upload permissions 
  to overwrite arbitrary existing files by UUID. The TUS controller performs 
  only collection-level authorization checks, verifying the user has some 
  permission on directus_files, but never validates item-level access to the 
  specific file being replaced. As a result, row-level permission rules (e.g., 
  "users can only update their own files") are completely bypassed via the TUS 
  path while being correctly enforced on the standard REST upload path. This 
  vulnerability is fixed in 11.16.1.
