title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  Fix race condition in AF_XDP generic RX path\n\nMove rx_lock from xsk_socket to
  xsk_buff_pool.\nFix synchronization for shared umem mode in\ngeneric RX path where
  multiple sockets share\nsingle xsk_buff_pool.\n\nRX queue is exclusive to xsk_socket,
  while FILL\nqueue can be shared between multiple sockets.\nThis could result in
  race condition where two\nCPU cores access RX path of two different sockets\nsharing
  the same umem.\n\nProtect both queues by acquiring spinlock in shared\nxsk_buff_pool.\n\
  \nLock contention may be minimized in the future by some\nper-thread FQ buffering.\n\
  \nIt's safe and necessary to move spin_lock_bh(rx_lock)\nafter xsk_rcv_check():\n\
  * xs->pool and spinlock_init is synchronized by\n  xsk_bind() -> xsk_is_bound()
  memory barriers.\n* xsk_rcv_check() may return true at the moment\n  of xsk_release()
  or xsk_unbind_dev(),\n  however this will not cause any data races or\n  race conditions.
  xsk_unbind_dev() removes xdp\n "
