title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ivsc: Fix crash at shutdown due to missing mei_cldev_disable() calls\n\nBoth the
  ACE and CSI driver are missing a mei_cldev_disable() call in\ntheir remove() function.\n\
  \nThis causes the mei_cl client to stay part of the mei_device->file_list\nlist
  even though its memory is freed by mei_cl_bus_dev_release() calling\nkfree(cldev->cl).\n\
  \nThis leads to a use-after-free when mei_vsc_remove() runs mei_stop()\nwhich first
  removes all mei bus devices calling mei_ace_remove() and\nmei_csi_remove() followed
  by mei_cl_bus_dev_release() and then calls\nmei_cl_all_disconnect() which walks
  over mei_device->file_list dereferecing\nthe just freed cldev->cl.\n\nAnd mei_vsc_remove()
  it self is run at shutdown because of the\nplatform_device_unregister(tp->pdev)
  in vsc_tp_shutdown()\n\nWhen building a kernel with KASAN this leads to the following
  KASAN report:\n\n[ 106.634504] ==================================================================\n\
  [ 10"
