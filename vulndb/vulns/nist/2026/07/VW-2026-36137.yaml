title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  logitech-dj: Fix maxfield check in DJ short report validation\n\nCommit b6a57912854e
  (\"HID: logitech-dj: Prevent REPORT_ID_DJ_SHORT\nrelated user initiated OOB write\"\
  ) added validation for the DJ short\noutput report, but the error path dereferences
  rep->field[0] even when\nrep->maxfield is zero.\n\nCommit 8b9a097eb2fc (\"HID: logitech-dj:
  fix wrong detection of bad\nDJ_SHORT output report\") made the check conditional
  on rep being present,\nbut a crafted descriptor can still create report ID 0x20
  with only padding\noutput items. hid-core registers the report, ignores the padding
  field,\nand leaves rep->maxfield as zero.\n\nIn that case the validation enters
  the rep->maxfield < 1 branch and then\ndereferences rep->field[0]->report_count
  while printing the error message,\ncausing a NULL pointer dereference during probe.
  This is reproducible with\nuhid by emulating a Logitech receiver with a padding-only
  DJ short output\nreport:\n\n  B"
