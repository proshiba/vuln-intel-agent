title: OliveTin gives access to predefined shell commands from a web interface. 
  From 3000.0.0 until 3000.17.0, the 
  service/internal/auth/otoauth2/restapi_auth_oauth2.go OAuth2 login handler 
  stores per-login state in the registeredStates map on every /oauth/login 
  request without expiring, deleting, or bounding entries, allowing an 
  unauthenticated attacker to exhaust memory and cause a denial of service. This
  issue is fixed in version 3000.17.0.
