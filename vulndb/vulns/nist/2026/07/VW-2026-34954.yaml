title: A security vulnerability has been detected in Trendnet TEW-657BRM 1.00.1.
  This impacts the function Edit of the file /setup.cgi. Such manipulation of 
  the argument pcdb_list leads to os command injection. The attack may be 
  launched remotely. The exploit has been disclosed publicly and may be used. 
  The vendor confirms, that "[t]he product in question (...) has been 
  discontinued and end of life since June 23, 2011, that is more than 14 years 
  ago. We no longer provide support for this product, so we are not able to 
  confirm the vulnerabilities. We will make an announcement on our website's 
  product support page and notify customers who registered their products with 
  us." This vulnerability only affects products that are no longer supported by 
  the maintainer.
