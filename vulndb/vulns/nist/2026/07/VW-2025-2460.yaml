title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: Fix potential overflow of PCM transfer buffer\n\nThe PCM stream data
  in USB-audio driver is transferred over USB URB\npacket buffers, and each packet
  size is determined dynamically.  The\npacket sizes are limited by some factors such
  as wMaxPacketSize USB\ndescriptor.  OTOH, in the current code, the actually used
  packet sizes\nare determined only by the rate and the PPS, which may be bigger than\n\
  the size limit above.  This results in a buffer overflow, as reported\nby syzbot.\n\
  \nBasically when the limit is smaller than the calculated packet size,\nit implies
  that something is wrong, most likely a weird USB\ndescriptor.  So the best option
  would be just to return an error at\nthe parameter setup time before doing any further
  operations.\n\nThis patch introduces such a sanity check, and returns -EINVAL when\n\
  the packet size is greater than maxpacksize.  The comparison with\nep->packsize[1]
  alone should suffice since it"
