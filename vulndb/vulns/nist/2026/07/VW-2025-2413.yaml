title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  fix null pointer dereference on zero-length checksum\n\nIn xdr_stream_decode_opaque_auth(),
  zero-length checksum.len causes\nchecksum.data to be set to NULL. This triggers
  a NPD when accessing\nchecksum.data in gss_krb5_verify_mic_v2(). This patch ensures
  that\nthe value of checksum.len is not less than XDR_UNIT."
