title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio:
  prevent infinite loop in vfio_mig_get_next_state() on blocked arc\n\nvfio_mig_get_next_state()
  walks vfio_from_fsm_table[] one step at a time,\nlooping to skip optional states
  the device does not support until\n*next_fsm is supported. A blocked transition
  is encoded as\nVFIO_DEVICE_STATE_ERROR, which the trailing return reports as -EINVAL.\n\
  \nThe skip loop does not account for the ERROR sentinel.\nstate_flags_table[ERROR]
  is ~0U and vfio_from_fsm_table[ERROR][*] is\nERROR, so once *next_fsm becomes ERROR
  the loop condition stays true and\n*next_fsm never changes. The blocked arcs STOP_COPY
  -> PRE_COPY and\nSTOP_COPY -> PRE_COPY_P2P map to ERROR yet pass the support check
  on a\nprecopy-capable device, causing the loop to spin forever while holding\nthe
  driver state mutex. This can result in a soft lockup, and a panic\nwith softlockup_panic
  set.\n\nTerminate the skip loop on the ERROR sentinel so a blocked transition\n\
  falls throug"
