title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  serial: keyspan_pda: fix information leak\n\nThe write() callback is supposed to
  return the number of characters\naccepted or a negative errno. Since the addition
  of write fifo support\nthe keyspan_pda implementation will however return the number
  characters\nsubmitted to the device if the write urb is not already in use. If this\n\
  number is larger than the number of characters passed to write(), the\nline discipline
  continues writing data from beyond the tty write buffer.\n\nFix the information
  leak by making sure that keyspan_pda_write_start()\nreturns zero on success as intended."
