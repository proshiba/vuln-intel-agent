title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  add NULL check in eswitch lag check\n\nThe function ice_lag_is_switchdev_running()
  is being called from outside of\nthe LAG event handler code.  This results in the
  lag->upper_netdev being\nNULL sometimes.  To avoid a NULL-pointer dereference, there
  needs to be a\ncheck before it is dereferenced."
