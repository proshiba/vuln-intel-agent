title: The Advanced Contact form 7 DB plugin for WordPress is vulnerable to 
  Cross-Site Request Forgery in all versions up to, and including, 2.0.9. This 
  is due to missing or incorrect nonce validation on the 
  'vsz_cf7_save_setting_callback' function. This makes it possible for 
  unauthenticated attackers to delete form entry via a forged request granted 
  they can trick a site administrator into performing an action such as clicking
  on a link.
