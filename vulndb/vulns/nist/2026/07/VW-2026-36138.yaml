title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  sch: use raw_spinlock_t in the irq startup path\n\nsch_irq_unmask() enables the
  GPIO IRQ and then updates the controller\nstate through sch_irq_mask_unmask(), which
  takes sch->lock with\nspin_lock_irqsave().  The callback can be reached from irq_startup()\n\
  while setting up a requested IRQ.  That path is not sleepable, but on\nPREEMPT_RT
  a regular spinlock_t becomes a sleeping lock.\n\nThis issue was found by our static
  analysis tool and then manually\nreviewed against the current tree.\n\nThe grounded
  PoC kept the request_threaded_irq() -> __setup_irq() ->\nirq_startup() -> sch_irq_unmask()
  -> sch_irq_mask_unmask() carrier and\nused the original spin_lock_irqsave(&sch->lock)
  edge.  Lockdep reported:\n\n  BUG: sleeping function called from invalid context\n\
  \  hardirqs last disabled at ... __setup_irq.constprop.0 ... [vuln_msv]\n  sch_rt_spin_lock_irqsave+0x1c/0x30
  [vuln_msv]\n  sch_irq_mask_unmask.constprop.0+0x31/0x70 [vuln_msv]\n "
