title: Calico's apiserver wraps tier-scoped resources so that every operation 
  runs through AuthorizeTierOperation, but the Delete override on NetworkPolicy,
  GlobalNetworkPolicy, and their staged variants is not invoked for 
  DeleteCollection requests. A user holding the deletecollection verb or 
  wildcard verbs on tier-scoped policy resources can bulk-delete policies in 
  tiers they otherwise have no rights on, breaking the tier authorization 
  boundary.
