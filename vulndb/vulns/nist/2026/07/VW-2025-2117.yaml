title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  kvaser_pciefd: refine error prone echo_skb_max handling logic\n\necho_skb_max should
  define the supported upper limit of echo_skb[]\nallocated inside the netdevice's
  priv. The corresponding size value\nprovided by this driver to alloc_candev() is
  KVASER_PCIEFD_CAN_TX_MAX_COUNT\nwhich is 17.\n\nBut later echo_skb_max is rounded
  up to the nearest power of two (for the\nmax case, that would be 32) and the tx/ack
  indices calculated further\nduring tx/rx may exceed the upper array boundary. Kasan
  reported this for\nthe ack case inside kvaser_pciefd_handle_ack_packet(), though
  the xmit\nfunction has actually caught the same thing earlier.\n\n BUG: KASAN: slab-out-of-bounds
  in kvaser_pciefd_handle_ack_packet+0x2d7/0x92a drivers/net/can/kvaser_pciefd.c:1528\n\
  \ Read of size 8 at addr ffff888105e4f078 by task swapper/4/0\n\n CPU: 4 UID: 0
  PID: 0 Comm: swapper/4 Not tainted 6.15.0 #12 PREEMPT(voluntary)\n Call Trace:\n\
  \  <IRQ>\n dump_stack_lvl "
