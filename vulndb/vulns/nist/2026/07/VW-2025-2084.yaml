title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: ad4851: fix ad4858 chan pointer handling\n\nThe pointer returned from ad4851_parse_channels_common()
  is incremented\ninternally as each channel is populated. In ad4858_parse_channels(),\n\
  the same pointer was further incremented while setting ext_scan_type\nfields for
  each channel. This resulted in indio_dev->channels being set\nto a pointer past
  the end of the allocated array, potentially causing\nmemory corruption or undefined
  behavior.\n\nFix this by iterating over the channels using an explicit index instead\n\
  of incrementing the pointer. This preserves the original base pointer\nand ensures
  all channel metadata is set correctly."
