title: "An out-of-bounds write issue in the virtio PCI transport in Firecracker 1.13.0
  through 1.14.3 and 1.15.0 on x86_64 and aarch64 might allow a local guest user with
  root privileges to crash the Firecracker VMM process or potentially execute arbitrary
  code on the host via modification of virtio queue configuration registers after
  device activation. Achieving code execution on the host requires additional preconditions,
  such as the use of a custom guest kernel or specific snapshot configurations.\n\n\
  To remediate this, users should upgrade to Firecracker 1.14.4 or 1.15.1 and later."
