title: A flaw was found in the sbc library (BlueZ SBC codec). An off-by-one 
  error in the SBC frame decoder allows a crafted audio payload to trigger a 
  one-byte heap out-of-bounds read. This could allow an adjacent attacker 
  streaming Bluetooth audio to read a single byte of adjacent heap memory.
