title: "Pivotick did not validate the URL scheme of node imagePath values derived
  from graph data before assigning them to SVG image resources. An attacker able to
  supply crafted graph data could set an image path to a malicious URI.\n\nWhen a
  victim rendered the affected graph, the browser could resolve the attacker-controlled
  URI and initiate an unintended request or invoke scheme-specific handling in the
  victim’s context. Depending on the URI, browser behaviour, and installed protocol
  handlers, exploitation could disclose limited client or network metadata, facilitate
  rendering-based tracking, or attempt to access local or internal resources.\n\n\
  Exploitation requires a victim to load or render graph data containing the malicious
  imagePath. The patch normalizes ASCII whitespace and control characters in URI schemes
  and restricts image paths to relative URLs or the http, https, data, and blob schemes."
