  nxp: imx8-isi: m2m: Fix streaming cleanup on release\n\nIf streamon/streamoff calls
  are imbalanced, such as when exiting an\napplication with Ctrl+C when streaming,
  the m2m usage_count will never\nreach zero and the ISI channel won't be freed. Besides
  from that, if the\ninput line width is more than 2K, it will trigger a WARN_ON():\n\
