title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix possible deadlock between unlink and dio_end_io_write\n\nocfs2_unlink takes
  orphan dir inode_lock first and then ip_alloc_sem,\nwhile in ocfs2_dio_end_io_write,
  it acquires these locks in reverse order.\nThis creates an ABBA lock ordering violation
  on lock classes\nocfs2_sysfile_lock_key[ORPHAN_DIR_SYSTEM_INODE] and\nocfs2_file_ip_alloc_sem_key.\n\
  \nLock Chain #0 (orphan dir inode_lock -> ip_alloc_sem):\nocfs2_unlink\n  ocfs2_prepare_orphan_dir\n\
  \    ocfs2_lookup_lock_orphan_dir\n      inode_lock(orphan_dir_inode) <- lock A\n\
  \    __ocfs2_prepare_orphan_dir\n      ocfs2_prepare_dir_for_insert\n        ocfs2_extend_dir\n\
  \t  ocfs2_expand_inline_dir\n\t    down_write(&oi->ip_alloc_sem) <- Lock B\n\nLock
  Chain #1 (ip_alloc_sem -> orphan dir inode_lock):\nocfs2_dio_end_io_write\n  down_write(&oi->ip_alloc_sem)
  <- Lock B\n  ocfs2_del_inode_from_orphan()\n    inode_lock(orphan_dir_inode) <-
  Lock A\n\nDeadlock Scenario:\n  CPU0 (unlink)          "
