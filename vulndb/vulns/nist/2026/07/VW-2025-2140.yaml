title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/cm:
  Drop lockdep assert and WARN when freeing old msg\n\nThe send completion handler
  can run after cm_id has advanced to another\nmessage.  The cm_id lock is not needed
  in this case, but a recent change\nre-used cm_free_priv_msg(), which asserts that
  the lock is held and\nWARNs if the cm_id's currently outstanding msg is different
  than the one\nbeing freed."
