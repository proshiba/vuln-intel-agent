title: Electron is a framework for writing cross-platform desktop applications 
  using JavaScript, HTML and CSS. Prior to versions 38.8.6, 39.8.1, 40.8.0, and 
  41.0.0-beta.8, on macOS, app.moveToApplicationsFolder() used an AppleScript 
  fallback path that did not properly handle certain characters in the 
  application bundle path. Under specific conditions, a crafted launch path 
  could lead to arbitrary AppleScript execution when the user accepted the 
  move-to-Applications prompt. Apps are only affected if they call 
  app.moveToApplicationsFolder(). Apps that do not use this API are not 
  affected. This issue has been patched in versions 38.8.6, 39.8.1, 40.8.0, and 
  41.0.0-beta.8.
