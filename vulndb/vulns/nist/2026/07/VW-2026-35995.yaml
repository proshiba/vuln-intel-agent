title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SEV: Pin source page for write when adding CPUID data for SNP guest\n\nWhen populating
  a guest_memfd instance with the initial CPUID data for an\nSNP guest, acquire a
  writable pin on the source page as KVM will write back\nthe \"correct\" CPUID information
  if the userspace provided data is rejected\nby trusted firmware.  Because KVM writes
  to the source page using a kernel\nmapping, pinning for read could result in KVM
  clobbering read-only memory.\n\nNote, well-behaved VMMs are unlikely to be affected,
  as CPUID information\nis almost always dynamically generated by userspace, i.e.
  it's unlikely for\nthe CPUID information to be backed by a read-only mapping.\n\n\
