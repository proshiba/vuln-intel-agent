title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btnxpuart: Fix out-of-bounds firmware read in nxp_recv_fw_req_v3()\n\nDuring the
  v3 firmware download the controller sends a v3_data_req with a\n32 bit offset and
  a 16 bit len. nxp_recv_fw_req_v3() checks only the lower\nbound of the offset and
  then sends firmware from that offset.\n\n  nxpdev->fw_dnld_v3_offset = offset -
  nxpdev->fw_v3_offset_correction;\n  serdev_device_write_buf(nxpdev->serdev, nxpdev->fw->data
  +\n                          nxpdev->fw_dnld_v3_offset, len);\n\nNothing checks
  that fw_dnld_v3_offset + len stays within nxpdev->fw->size,\nso a controller that
  asks for an offset or length past the firmware image\nmakes the driver read past
  the end of nxpdev->fw->data and send that\nmemory back over UART.\n\nnxp_recv_fw_req_v1()
  already bounds the same write. Add the equivalent\ncheck to the v3 path, reject
  the request when it falls outside the firmware\nimage, and zero len on the error
  path so the fw_v3_prev_se"
