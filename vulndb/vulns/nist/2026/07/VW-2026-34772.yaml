title: go-git is an extensible git implementation library written in pure Go. 
  From version 5.0.0 to before version 5.17.1, a vulnerability has been 
  identified in which a maliciously crafted .idx file can cause asymmetric 
  memory consumption, potentially exhausting available memory and resulting in a
  denial-of-service (DoS) condition. Exploitation requires write access to the 
  local repository's .git directory, it order to create or alter existing .idx 
  files. This issue has been patched in version 5.17.1.
