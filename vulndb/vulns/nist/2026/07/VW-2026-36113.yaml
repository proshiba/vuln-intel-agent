title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: validate option length before reading conf opt value\n\nl2cap_get_conf_opt()
  derives the option length from the\nattacker-controlled opt->len field and immediately
  dereferences\nopt->val (as u8, get_unaligned_le16() or get_unaligned_le32(), or
  a\nraw pointer for the default case) before any caller has confirmed\nthat opt->len
  bytes are present in the buffer. The callers\n(l2cap_parse_conf_req(), l2cap_parse_conf_rsp()
  and\nl2cap_conf_rfc_get()) only detect a malformed option afterwards, once\nthe
  running length has gone negative, by which point the\nout-of-bounds read has already
  executed.\n\nAn existing post-hoc length check keeps the garbage value from being\n\
  consumed, so this is not a data leak in the current control flow. It\nis still a
  validate-after-use ordering bug: up to 4 bytes are read\npast the end of the buffer
  before it is known to contain them, and it\nis fragile to future changes in the
  callers.\n\nFix "
