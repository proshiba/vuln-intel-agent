title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/hyperv:
  validate resolution_count and fix WIN8 fallback\n\nA SYNTHVID_RESOLUTION_RESPONSE
  with resolution_count > 64 walks past\nthe supported_resolution[SYNTHVID_MAX_RESOLUTION_COUNT]
  array in the\nparse loop. Bound resolution_count against the array size, folded\n\
  into the existing zero-check.\n\nWhen the WIN10 resolution probe fails, the caller
  in\nhyperv_connect_vsp() left hv->screen_*_max / preferred_* unpopulated,\nwhich
  sets mode_config.max_width / max_height to 0 and makes\ndrm_internal_framebuffer_create()
  reject every userspace framebuffer\nwith -EINVAL. The pre-WIN10 branch had the same
  gap for\npreferred_width / preferred_height. Use a single post-probe fallback\n\
  guarded by screen_width_max == 0 so both paths converge on the WIN8\ndefaults."
