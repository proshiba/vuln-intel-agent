title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  reject malicious packets in ipv6_gso_segment()\n\nsyzbot was able to craft a packet
  with very long IPv6 extension headers\nleading to an overflow of skb->transport_header.\n\
  \nThis 16bit field has a limited range.\n\nAdd skb_reset_transport_header_careful()
  helper and use it\nfrom ipv6_gso_segment()\n\nWARNING: CPU: 0 PID: 5871 at ./include/linux/skbuff.h:3032
  skb_reset_transport_header include/linux/skbuff.h:3032 [inline]\nWARNING: CPU: 0
