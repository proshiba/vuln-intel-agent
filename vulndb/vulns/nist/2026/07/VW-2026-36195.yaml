title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  compress: Fix task creation error unwind\n\nsnd_compr_task_new() allocates the driver
  task before validating the\nreturned DMA buffers and reserving file descriptors.
  When either of\nthose later steps fails, the core frees its task wrapper and DMA-buffer\n\
  references without calling the driver's task_free() callback. Any\ndriver resources
  allocated by task_create() are therefore leaked.\n\nThe dual-fd allocation path
  also jumps to cleanup without storing the\nnegative get_unused_fd_flags() result
  in retval. Since retval still\ncontains the successful task_create() return value,
  TASK_CREATE can\nincorrectly report success although the task was discarded.\n\n\
  Preserve the fd allocation errors and call task_free() when failure\noccurs after
  a successful task_create() callback."
