title: gpsd through release-3.27.5, fixed at commit 4c06658, contains a code 
  injection vulnerability in the gpsprof utility that allows an attacker who 
  controls GPS input data to execute arbitrary OS commands by injecting 
  malicious content into the SKY.satellites[].used field, which is inserted 
  unsanitized into a gnuplot heredoc data block. Attackers can supply a used 
  value containing the string EOD to terminate the heredoc early and append 
  gnuplot system() calls, achieving OS command execution as the user running 
  gpsprof when the generated plot script is processed by gnuplot in polar mode.
