title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuio_hv_generic:
  Let userspace take care of interrupt mask\n\nRemove the logic to set interrupt mask
  by default in uio_hv_generic\ndriver as the interrupt mask value is supposed to
  be controlled\ncompletely by the user space. If the mask bit gets changed\nby the
  driver, concurrently with user mode operating on the ring,\nthe mask bit may be
  set when it is supposed to be clear, and the\nuser-mode driver will miss an interrupt
  which will cause a hang.\n\nFor eg- when the driver sets inbound ring buffer interrupt
  mask to 1,\nthe host does not interrupt the guest on the UIO VMBus channel.\nHowever,
  setting the mask does not prevent the host from putting a\nmessage in the inbound
  ring buffer. So let’s assume that happens,\nthe host puts a message into the ring
  buffer but does not interrupt.\n\nSubsequently, the user space code in the guest
  sets the inbound ring\nbuffer interrupt mask to 0, saying “Hey, I’m ready for interrupts”.\n\
  User space"
