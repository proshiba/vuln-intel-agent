title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm_mpam:
  Fix null pointer dereference when restoring bandwidth counters\n\nWhen an MSC supporting
  memory bandwidth monitoring is brought offline and\nthen online, mpam_restore_mbwu_state()
  calls __ris_msmon_read() via ipi to\nrestore the configuration of the bandwidth
  counters. It doesn't care about\nthe value read, mbwu_arg.val, and doesn't set it
  leading to a null pointer\ndereference when __ris_msmon_read() adds to it. This
  results in a kernel\noops with a call trace such as:\n\nCall trace:\n__ris_msmon_read+0x19c/0x64c
  (P)\nmpam_restore_mbwu_state+0xa0/0xe8\nsmp_call_on_cpu_callback+0x1c/0x38\nprocess_one_work+0x154/0x4b4\n\
  worker_thread+0x188/0x310\nkthread+0x11c/0x130\nret_from_fork+0x10/0x20\n\nProvide
  a local variable for val to avoid __ris_msmon_read() dereferencing\na null pointer
  when adding to val."
