title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerspan:
  Initialize options_len before referencing options.\n\nThe struct ip_tunnel_info
  has a flexible array member named\noptions that is protected by a counted_by(options_len)\n\
  attribute.\n\nThe compiler will use this information to enforce runtime bounds\n\
  checking deployed by FORTIFY_SOURCE string helpers.\n\nAs laid out in the GCC documentation,
  the counter must be\ninitialized before the first reference to the flexible array\n\
  member.\n\nAfter scanning through the files that use struct ip_tunnel_info\nand
  also refer to options or options_len, it appears the normal\ncase is to use the
  ip_tunnel_info_opts_set() helper.\n\nSaid helper would initialize options_len properly
  before copying\ndata into options, however in the GRE ERSPAN code a partial\nupdate
  is done, preventing the use of the helper function.\n\nBefore this change the handling
  of ERSPAN traffic in GRE tunnels\nwould cause a kernel panic when the kernel is
  compiled with\nGCC 15"
