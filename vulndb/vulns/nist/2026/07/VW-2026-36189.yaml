title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: Fix uninitialised heap leak in snd_seq_event_dup()\n\nsnd_seq_event_dup() copies
  an incoming event into a pool cell and, in\nthe UMP-enabled build, clears the trailing
  cell->ump.raw.extra word that\nthe memcpy() did not cover.  The guard deciding whether
  to clear it\ncompares the copied size against sizeof(cell->event):\n\n\tmemcpy(&cell->ump,
  event, size);\n\tif (size < sizeof(cell->event))\n\t\tcell->ump.raw.extra = 0;\n\
  \nFor a legacy (non-UMP) event, size == sizeof(struct snd_seq_event) ==\nsizeof(cell->event),
  so the condition is false and the extra word keeps\nstale data.  The cell pool is
  allocated with kvmalloc() (not zeroed) and\ncells are reused via a free list, so
  that word holds uninitialised heap\nor leftover event data.\n\nWhen such a cell
  is delivered to a UMP client (client->midi_version > 0)\nthat set SNDRV_SEQ_FILTER_NO_CONVERT
  -- so the legacy event reaches it\nunconverted -- snd_seq_read() reads it out as
