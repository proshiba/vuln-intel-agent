title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  free copynotify stateid in nfs4_free_ol_stateid()\n\nTypically copynotify stateid
  is freed either when parent's stateid\nis being close/freed or in nfsd4_laundromat
  if the stateid hasn't\nbeen used in a lease period.\n\nHowever, in case when the
  server got an OPEN (which created\na parent stateid), followed by a COPY_NOTIFY
  using that stateid,\nfollowed by a client reboot. New client instance while doing\n\
  CREATE_SESSION would force expire previous state of this client.\nIt leads to the
  open state being freed thru release_openowner->\nnfs4_free_ol_stateid() and it finds
  that it still has copynotify\nstateid associated with it. We currently print a warning
  and is\ntriggerred\n\nWARNING: CPU: 1 PID: 8858 at fs/nfsd/nfs4state.c:1550 nfs4_free_ol_stateid+0xb0/0x100
  [nfsd]\n\nThis patch, instead, frees the associated copynotify stateid here.\n\n\
  If the parent stateid is freed (without freeing the copynotify\nstateids associated
  with it), "
