title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB reads in IE loops in issue_assocreq() and join_cmd_hdl()\n\n\
  Two IE parsing loops are missing the header bounds checks before they\ndereference
  pIE->length:\n\n - issue_assocreq() walks pmlmeinfo->network.ies to build the\n\
  \   association request. If the stored IE data ends with only an\n   element_id
  byte and no length byte, pIE->length is read one byte\n   past the end of the buffer.\n\
  \n - join_cmd_hdl() walks pnetwork->ies during station join and has\n   the same
  problem under the same conditions.\n\nBoth buffers are filled from AP beacon and
  probe-response frames, so a\nmalicious AP that sends a truncated final IE can trigger
  the issue.\n\nApply the two-guard pattern established in update_beacon_info():\n\
  \  1. Break if fewer than sizeof(*pIE) bytes remain.\n  2. Break if the IE's declared
  data extends past the buffer end."
