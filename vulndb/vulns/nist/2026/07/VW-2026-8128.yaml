title: When using an IPv6 allow-list for the Auth Proxy feature, it defaults to 
  /32 addresses. Addresses specifying a mask explicitly are not affected; to 
  mitigate easily, add the desired mask (usually /128) to the addresses. Only 
  auth proxy is affected; Okta, SAML, LDAP, etc are unaffected here.
