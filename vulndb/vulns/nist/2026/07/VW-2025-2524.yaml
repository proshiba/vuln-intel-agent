title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  route: Prevent rt_bind_exception() from rebinding stale fnhe\n\nThe sit driver's
  packet transmission path calls: sit_tunnel_xmit() ->\nupdate_or_create_fnhe(), which
  lead to fnhe_remove_oldest() being called\nto delete entries exceeding FNHE_RECLAIM_DEPTH+random.\n\
  \nThe race window is between fnhe_remove_oldest() selecting fnheX for\ndeletion
  and the subsequent kfree_rcu(). During this time, the\nconcurrent path's __mkroute_output()
  -> find_exception() can fetch the\nsoon-to-be-deleted fnheX, and rt_bind_exception()
  then binds it with a\nnew dst using a dst_hold(). When the original fnheX is freed
  via RCU,\nthe dst reference remains permanently leaked.\n\nCPU 0               \
  \              CPU 1\n__mkroute_output()\n  find_exception() [fnheX]\n         \
  \                         update_or_create_fnhe()\n                            \
  \        fnhe_remove_oldest() [fnheX]\n  rt_bind_exception() [bind dst]\n      \
  \                          "
