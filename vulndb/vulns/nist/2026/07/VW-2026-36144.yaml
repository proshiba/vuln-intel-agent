title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: Fix UAF in channel timeout by holding conn ref\n\nl2cap_chan_timeout() runs
  asynchronously and accesses chan->conn. If\nthe connection is torn down while the
  timer is running or pending,\nchan->conn can be freed, leading to a use-after-free
  when the timer\nworker attempts to lock conn->lock:\n\n| BUG: KASAN: slab-use-after-free
  in instrument_atomic_read_write include/linux/instrumented.h:112 [inline]\n| BUG:
  KASAN: slab-use-after-free in atomic_long_try_cmpxchg_acquire include/linux/atomic/atomic-instrumented.h:4456
  [inline]\n| BUG: KASAN: slab-use-after-free in __mutex_trylock_fast kernel/locking/mutex.c:161
  [inline]\n| BUG: KASAN: slab-use-after-free in mutex_lock+0x4f/0xa0 kernel/locking/mutex.c:318\n\
  | Write of size 8 at addr ffff8881298d9550 by task kworker/2:1/83\n|\n| CPU: 2 UID:
