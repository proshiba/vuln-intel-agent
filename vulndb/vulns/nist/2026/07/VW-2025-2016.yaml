title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  vnifilter: Fix unlocked deletion of default FDB entry\n\nWhen a VNI is deleted from
  a VXLAN device in 'vnifilter' mode, the FDB\nentry associated with the default remote
  (assuming one was configured)\nis deleted without holding the hash lock. This is
  wrong and will result\nin a warning [1] being generated by the lockdep annotation
  that was\nadded by commit ebe642067455 (\"vxlan: Create wrappers for FDB lookup\"\
  ).\n\nReproducer:\n\n # ip link add vx0 up type vxlan dstport 4789 external vnifilter
  local 192.0.2.1\n # bridge vni add vni 10010 remote 198.51.100.1 dev vx0\n # bridge
  vni del vni 10010 dev vx0\n\nFix by acquiring the hash lock before the deletion
  and releasing it\nafterwards. Blame the original commit that introduced the issue
  rather\nthan the one that exposed it.\n\n[1]\nWARNING: CPU: 3 PID: 392 at drivers/net/vxlan/vxlan_core.c:417
  vxlan_find_mac+0x17f/0x1a0\n[...]\nRIP: 0010:vxlan_find_mac+0x17f/0x1a0\n[...]\n\
  Call Trace:\n <"
