title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/rt:
  Have RT_PUSH_IPI be default off for non PREEMPT_RT\n\nRT migration is done aggressively.
  When a CPU schedules out a high\npriority RT task for a lower priority task, it
  will look to see if there's\nany RT tasks that are waiting to run on another CPU
  that is of higher\npriority than the task this CPU is about to run. If it finds
  one, it will\npull that task over to the CPU and allow it to run there instead.\n\
  \nNormally, this pulling is done by looking at the RT overloaded mask (rto)\nwhich
  contains all the CPUs in the scheduler domain with RT tasks that are\nwaiting to
  run due to a higher priority RT task currently running on their\nCPU. The CPU that
  is about to schedule a lower priority task will grab the\nrq lock of the overloaded
  CPU and move the RT task from that CPU's runqueue\nto the local one and schedule
  the higher priority RT task.\n\nThis caused issues when a lot of CPUs would schedule
