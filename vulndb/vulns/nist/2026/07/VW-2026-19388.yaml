title: A flaw was found in GLib. An off-by-one error can occur in the 
  g_key_file_get_locale_string_list function in the gkeyfile.c file when loading
  a key file with an empty value. This flaw can cause an out-of-bounds access of
  1 byte or a denial of service when the out-of-bounds access crosses a page 
  boundary.
