title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  CPPC: Suppress UBSAN warning caused by field misuse\n\nThe definition of reg->access_width
  changes depending on the\nreg->space_id type.  Type ACPI_ADR_SPACE_PLATFORM_COMM
  uses\naccess_width to indicate the PCC region, which can result in a UBSAN\nif the
  value is greater than 4.\n\nFor example:\n\n UBSAN: shift-out-of-bounds in drivers/acpi/cppc_acpi.c:1090:9\n\
  \ shift exponent 32 is too large for 32-bit type 'int'\n CPU: 61 UID: 0 PID: 1220
  Comm: (udev-worker) Not tainted 7.0.10-201.fc44.aarch64 #1 PREEMPT(lazy)\n Hardware
  name: To be filled by O.E.M.\n Call trace:\n  ...(trimming)\n  ubsan_epilogue+0x10/0x48\n\
  \  __ubsan_handle_shift_out_of_bounds+0xdc/0x1e0\n  cpc_write+0x4d0/0x670\n  cppc_set_perf+0x18c/0x490\n\
  \  cppc_cpufreq_cpu_init+0x1c8/0x380 [cppc_cpufreq]\n  ... (trimming)\n\nLets fix
  this by validating the region type, as well as whether\naccess_width has a value.
  Then since we are returning bit_width\ndirectly for ACPI_ADR_SPACE"
