title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915:
  Fix potential UAF in TTM object purge\n\nTLDR: The bo->ttm object might be changed
  by calling ttm_bo_validate(),\n      move casting it to an i915_tt object later
  to actually get the right\n      pointer.\n\nA user reported hitting the following
  bug under heavy use on DG2:\n\n[26620.095550] Oops: general protection fault, probably
  for non-canonical address 0xa56b6b6b6b6b6b8b: 0000 1 SMP NOPTI\n[26620.095556] CPU:
  2 UID: 0 PID: 631 Comm: Xorg Not tainted 6.18.8 #1 PREEMPT(lazy)\n[26620.095558]
  Hardware name: ASRock B850M Steel Legend WiFi/B850M Steel Legend WiFi, BIOS 3.50
  09/18/2025\n[26620.095559] RIP: 0010:i915_ttm_purge+0x84/0x100 [i915]\n[26620.095604]
  Code: 00 00 00 48 8d 54 24 10 48 89 e6 48 89 fb e8 83 aa ae ff 85 c0 75 6f 48 83
  bb a8 01 00 00 00 74 2c 48 8b 45 78 48 85 c0 74 23 <48> 8b 78 20 48 c7 c2 ff ff
  ff ff 31 f6 e8 7a 73 e3 e0 48 8b 7d 78\n[26620.095605] RSP: 0018:ffffc90005fd7430
  EFLAGS: 00010282\n[26620.09"
