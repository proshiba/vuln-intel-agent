title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusbip:
  vudc: fix NULL deref in vep_dequeue()\n\nvep_alloc_request() wasn't initializing
  vrequest->udc, so cancellations\non the FunctionFS AIO path were arriving in vep_dequeue
  without a valid\nUDC reference.\n\nSince vrequest->udc is never actually properly
  used anywhere, we opt to\nremove it, and update vep_dequeue to obtain a reference
  to the udc with\nep_to_vudc(), consistent with the other vep_ ops.\n\nAFAICT this
  bug has existed for ~10 years. Seems that nobody has really\nstressed the FunctionFS
  AIO path on usbip's vudc.\n\nI tested this fix in a QEMU aarch64 guest driving FunctionFS
  endpoints\nvia AIO. Before the fix, running `usbip attach` from the host would\n\
  cause the guest to oops with the following backtrace:\n\nCall trace:\n vep_dequeue+0x1c/0xe4
  (P)\n usb_ep_dequeue+0x14/0x20\n ffs_aio_cancel+0x24/0x34\n __arm64_sys_io_cancel+0xb0/0x124\n\
  \ do_el0_svc+0x68/0x100\n el0_svc+0x18/0x5c\n el0t_64_sync_handler+0x98/0xdc\n el0t_64_sync+"
