title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  parse_dfs_referrals: prevent oob on malformed input\n\nMalicious SMB server can
  send invalid reply to FSCTL_DFS_GET_REFERRALS\n\n- reply smaller than sizeof(struct
  get_dfs_referral_rsp)\n- reply with number of referrals smaller than NumberOfReferrals
  in the\nheader\n\nProcessing of such replies will cause oob.\n\nReturn -EINVAL error
  on such replies to prevent oob-s."
