title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix memory leak in tipc_link_xmit\n\nIn case the backlog transmit queue for system-importance
  messages is overloaded,\ntipc_link_xmit() returns -ENOBUFS but the skb list is not
  purged. This leads to\nmemory leak and failure when a skb is allocated.\n\nThis
  commit fixes this issue by purging the skb list before tipc_link_xmit()\nreturns."
