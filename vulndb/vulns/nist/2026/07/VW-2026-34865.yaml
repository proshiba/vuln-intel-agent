title: Admidio is an open-source user management solution. Prior to version 
  5.0.8, the inventory module's item_save endpoint accepts a user-controllable 
  POST parameter imported that, when set to true, completely bypasses both CSRF 
  token validation and server-side form validation. An authenticated user can 
  craft a direct POST request to save arbitrary inventory item data without CSRF
  protection and without the field value checks that the FormPresenter 
  validation normally enforces. This issue has been patched in version 5.0.8.
