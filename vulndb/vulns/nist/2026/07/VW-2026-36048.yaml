title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  misc: uss720: unregister parport on probe failure\n\nuss720_probe() registers a
  parport before reading the 1284 register used\nto detect unsupported Belkin F5U002
  adapters. If get_1284_register()\nfails, the error path drops the driver private
  data and the USB device\nreference, but leaves the parport device registered.\n\n\
  Leaving the port registered is more than a private allocation leak:\nparport_register_port()
  has already reserved a parport number and\nregistered the parport bus device, while
  pp->private_data still points at\nthe private data that the common error path is
  about to release.\n\nUndo the pre-announce registration in the get_1284_register()
  failure\nbranch before jumping to the common private-data cleanup path. Clear\n\
  priv->pp first, matching the disconnect path and avoiding a stale pointer\nin the
  private data.\n\nThis issue was identified during our ongoing static-analysis research
  while\nreviewing kernel code."
