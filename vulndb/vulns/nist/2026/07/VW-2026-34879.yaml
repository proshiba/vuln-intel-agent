title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the User_Location plugin's testIP.php page reflects the ip request parameter 
  directly into an HTML input element without applying htmlspecialchars() or any
  other output encoding. This allows an attacker to inject arbitrary HTML and 
  JavaScript via a crafted URL. Although the page is restricted to admin users, 
  AVideo's SameSite=None cookie configuration allows cross-origin exploitation, 
  meaning an attacker can lure an admin to a malicious link that executes 
  JavaScript in their authenticated session. At time of publication, there are 
  no publicly available patches.
