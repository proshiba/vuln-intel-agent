title: Flatpak is a Linux application sandboxing and distribution framework. 
  Prior to 1.16.4, the caching for ld.so removes outdated cache files without 
  properly checking that the app controlled path to the outdated cache is in the
  cache directory. This allows Flatpak apps  to delete arbitrary files on the 
  host. This vulnerability is fixed in 1.16.4.
