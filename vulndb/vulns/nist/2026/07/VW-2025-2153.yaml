  JIT size of the BPF trampoline\nbefore the buffer for JIT'ing it is allocated. The
  total number of\ninstructions emitted for BPF trampoline JIT code depends on where\n\
  the final image is located. So, the size arrived at with the dummy\npass in arch_bpf_trampoline_size()
  can vary from the actual size\nneeded in  arch_prepare_bpf_trampoline().  When the
