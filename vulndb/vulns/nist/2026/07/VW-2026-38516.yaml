title: /misc/workspace/adhoc_connect_server, part of the Workspaces feature 
  introduced in pgAdmin 4 9.0, when passed the id of an existing server, clones 
  that server via Server.clone(), which copies every column from the source row,
  including user_id, shared, shared_username, and the stored credential fields 
  password, save_password, and tunnel_password. When a non-owner triggered an 
  adhoc connect against another user's (in practice, typically an 
  administrator's) shared server, the clone inherited that user's ownership, 
  shared flag, and stored database credentials verbatim. pgAdmin persisted this 
  cross-tenant, credential-bearing server row before the connection was even 
  attempted, so it survived even when the connection subsequently failed. The 
  non-owner could then open the newly-owned clone and pgAdmin would connect 
  using the source user's stored database password on the non-owner's behalf, 
