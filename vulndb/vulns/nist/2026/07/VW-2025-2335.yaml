title: "In the Linux kernel, the following vulnerability has been resolved:\n\nqed:
  Don't collect too many protection override GRC elements\n\nIn the protection override
  dump path, the firmware can return far too\nmany GRC elements, resulting in attempting
  to write past the end of the\npreviously-kmalloc'ed dump buffer.\n\nThis will result
  in a kernel panic with reason:\n\n BUG: unable to handle kernel paging request at
  ADDRESS\n\nwhere \"ADDRESS\" is just past the end of the protection override dump\n\
  buffer. The start address of the buffer is:\n p_hwfn->cdev->dbg_features[DBG_FEATURE_PROTECTION_OVERRIDE].dump_buf\n\
  and the size of the buffer is buf_size in the same data structure.\n\nThe panic
  can be arrived at from either the qede Ethernet driver path:\n\n    [exception RIP:
  qed_grc_dump_addr_range+0x108]\n qed_protection_override_dump at ffffffffc02662ed
  [qed]\n qed_dbg_protection_override_dump at ffffffffc0267792 [qed]\n qed_dbg_feature
  at ffffffffc026aa8f [qed]\n qed_dbg_all_data at ffffffffc026b211 [qed]\n qed_fw_"
