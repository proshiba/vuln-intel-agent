title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Set upper bounds on cache invalidation entry_num and entry_len\n\niommufd_hwpt_invalidate()
  takes a user-controlled entry_num and entry_len,\neach bounded only by U32_MAX.
  An entry_len beyond the kernel's struct size\nmakes the copy helper verify the extra
  bytes are zero, scanning that excess\nin one uninterruptible pass; a multi-gigabyte
  value over zeroed user memory\ntrips the soft-lockup watchdog.\n\nA large entry_num
  is the other half, driving the backend invalidation loop\nwith no reschedule. The
  VT-d nested handler, for one, copies each entry and\nflushes caches per iteration,
  pinning the CPU on a non-preemptible kernel.\n\nCap both in the ioctl. entry_len
  is held under PAGE_SIZE, above any request\nstruct, and entry_num under 1 << 19,
  the order of a hardware invalidation\nqueue and well beyond any real batch, bounding
  the per-call loop length."
