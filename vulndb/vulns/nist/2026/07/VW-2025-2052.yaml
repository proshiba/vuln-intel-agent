title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngenirq/msi:
  Store the IOMMU IOVA directly in msi_desc instead of iommu_cookie\n\nThe IOMMU translation
  for MSI message addresses has been a 2-step process,\nseparated in time:\n\n 1)
  iommu_dma_prepare_msi(): A cookie pointer containing the IOVA address\n    is stored
  in the MSI descriptor when an MSI interrupt is allocated.\n\n 2) iommu_dma_compose_msi_msg():
  this cookie pointer is used to compute a\n    translated message address.\n\nThis
  has an inherent lifetime problem for the pointer stored in the cookie\nthat must
  remain valid between the two steps. However, there is no locking\nat the irq layer
  that helps protect the lifetime. Today, this works under\nthe assumption that the
  iommu domain is not changed while MSI interrupts\nbeing programmed. This is true
  for normal DMA API users within the kernel,\nas the iommu domain is attached before
  the driver is probed and cannot be\nchanged while a driver is attached.\n\nClassic
  VFIO type1 a"
