title: SurrealDB versions before 3.1.0 contain a field-level permission bypass 
  vulnerability in JSON Patch operations that allows authenticated users to read
  protected fields. Attackers can use UPDATE PATCH with an empty from pointer in
  copy or move operations to duplicate all record fields, including those 
  restricted by field-level SELECT permissions, into attacker-chosen destination
  fields.
