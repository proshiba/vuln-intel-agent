title: LORIS (Longitudinal Online Research and Imaging System) is a self-hosted 
  web application that provides data- and project-management for neuroimaging 
  research. From 20.0.0 to before 27.0.3 and 28.0.1, a bug in the static file 
  router can allow an attacker to traverse outside of the intended directory, 
  allowing unintended files to be downloaded through the static, css, and js 
  endpoints. This vulnerability is fixed in 27.0.3 and 28.0.1.
