title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Fix infinite loop in layout state revocation\n\nfind_one_sb_stid() skips stids whose
  sc_status is non-zero, but the\nSC_TYPE_LAYOUT case in nfsd4_revoke_states() never
  sets sc_status\nbefore calling nfsd4_close_layout(). The retry loop therefore finds\n\
  the same layout stid on every iteration, hanging the revoker\nindefinitely."
