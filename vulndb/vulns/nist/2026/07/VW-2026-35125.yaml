title: Zulip is an open-source team collaboration tool. Prior to version 11.6, 
  Zulip is an open-source team collaboration tool. From version 1.4.0 to before 
  version 11.6, even after spectator access (enable_spectator_access / 
  WEB_PUBLIC_STREAMS_ENABLED) is disabled, attachments originating from 
  web-public streams can still be retrieved anonymously. As a result, file 
  contents remain accessible even after public access is intended to be 
  disabled. Similarly, even after spectator access is disabled, the 
  /users/me/<stream_id>/topics endpoint remains reachable anonymously, allowing 
  retrieval of topic history for web-public streams. This issue has been patched
  in version 11.6. This issue has been patched in version 11.6.
