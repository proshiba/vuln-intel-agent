title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/sev:
  Evict cache lines during SNP memory validation\n\nAn SNP cache coherency vulnerability
  requires a cache line eviction\nmitigation when validating memory after a page state
  change to private.\nThe specific mitigation is to touch the first and last byte
  of each 4K\npage that is being validated. There is no need to perform the mitigation\n\
  when performing a page state change to shared and rescinding validation.\n\nCPUID
  bit Fn8000001F_EBX[31] defines the COHERENCY_SFW_NO CPUID bit\nthat, when set, indicates
  that the software mitigation for this\nvulnerability is not needed.\n\nImplement
  the mitigation and invoke it when validating memory (making it\nprivate) and the
  COHERENCY_SFW_NO bit is not set, indicating the SNP\nguest is vulnerable."
