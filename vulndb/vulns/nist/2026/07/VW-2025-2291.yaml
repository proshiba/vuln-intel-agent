title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix unbuffered write error handling\n\nIf all the subrequests in an unbuffered write
  stream fail, the subrequest\ncollector doesn't update the stream->transferred value
  and it retains its\ninitial LONG_MAX value.  Unfortunately, if all active streams
  fail, then we\ntake the smallest value of { LONG_MAX, LONG_MAX, ... } as the value
  to set\nin wreq->transferred - which is then returned from ->write_iter().\n\nLONG_MAX
  was chosen as the initial value so that all the streams can be\nquickly assessed
  by taking the smallest value of all stream->transferred -\nbut this only works if
  we've set any of them.\n\nFix this by adding a flag to indicate whether the value
  in\nstream->transferred is valid and checking that when we integrate the\nvalues.\
