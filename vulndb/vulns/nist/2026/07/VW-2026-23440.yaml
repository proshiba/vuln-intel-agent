title: ImageMagick before 7.1.2-26 and 6.9.13-x before 6.9.13-51 contains a 
  policy bypass vulnerability in the -script operation due to missing security 
  policy checks. This allows reading files from paths that are otherwise 
  disallowed by the configured security policy.
