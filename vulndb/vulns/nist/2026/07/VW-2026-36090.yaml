title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: harden POSIX SID length parsing\n\nposix_info_sid_size() reads sid[1] to
  obtain the subauthority count,\nbut its existing boundary check still accepts buffers
  with only one\nremaining byte. Require two bytes before reading sid[1] so all client\n\
  paths that reuse the helper reject truncated POSIX SIDs safely."
