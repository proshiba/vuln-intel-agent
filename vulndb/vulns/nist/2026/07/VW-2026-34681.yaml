title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNTB:
  epf: Avoid pci_iounmap() with offset when PEER_SPAD and CONFIG share BAR\n\nWhen
  BAR_PEER_SPAD and BAR_CONFIG share one PCI BAR, the module teardown\npath ends up
  calling pci_iounmap() on the same iomem with some offset,\nwhich is unnecessary
  and triggers a kernel warning like the following:\n\n  Trying to vunmap() nonexistent
  vm area (0000000069a5ffe8)\n  WARNING: mm/vmalloc.c:3470 at vunmap+0x58/0x68, CPU#5:
  modprobe/2937\n  [...]\n  Call trace:\n   vunmap+0x58/0x68 (P)\n   iounmap+0x34/0x48\n\
  \   pci_iounmap+0x2c/0x40\n   ntb_epf_pci_remove+0x44/0x80 [ntb_hw_epf]\n   pci_device_remove+0x48/0xf8\n\
  \   device_remove+0x50/0x88\n   device_release_driver_internal+0x1c8/0x228\n   driver_detach+0x50/0xb0\n\
  \   bus_remove_driver+0x74/0x100\n   driver_unregister+0x34/0x68\n   pci_unregister_driver+0x34/0xa0\n\
  \   ntb_epf_pci_driver_exit+0x14/0xfe0 [ntb_hw_epf]\n  [...]\n\nFix it by unmapping
  only when PEER_SPAD and CONFIG use difference bars."
