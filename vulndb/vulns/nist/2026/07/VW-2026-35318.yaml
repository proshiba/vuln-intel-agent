title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the site customization endpoint at 
  admin/customize_settings_nativeUpdate.json.php lacks CSRF token validation and
  writes uploaded logo files to disk before the ORM's domain-based security 
  check executes. Combined with SameSite=None cookie policy, a cross-origin POST
  can overwrite the platform's logo with attacker-controlled content.
