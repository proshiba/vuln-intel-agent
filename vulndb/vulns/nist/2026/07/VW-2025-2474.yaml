title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: fix use-after-free due to MST port state bypass\n\nsyzbot reported[1] a
  use-after-free when deleting an expired fdb. It is\ndue to a race condition between
  learning still happening and a port being\ndeleted, after all its fdbs have been
  flushed. The port's state has been\ntoggled to disabled so no learning should happen
  at that time, but if we\nhave MST enabled, it will bypass the port's state, that
  together with VLAN\nfiltering disabled can lead to fdb learning at a time when it
  shouldn't\nhappen while the port is being deleted. VLAN filtering must be disabled\n\
  because we flush the port VLANs when it's being deleted which will stop\nlearning.
  This fix adds a check for the port's vlan group which is\ninitialized to NULL when
  the port is getting deleted, that avoids the port\nstate bypass. When MST is enabled
  there would be a minimal new overhead\nin the fast-path because the port's vlan
  group pointer is cache-hot.\n\n[1"
