title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  firewire: isight: bound the sample count to the packet payload\n\nisight_packet()
  takes the frame count from the device iso packet and\nchecks it only against the
  device claimed iso length.\n\n\tcount = be32_to_cpu(payload->sample_count);\n\t\
  if (likely(count <= (length - 16) / 4))\n\t\tisight_samples(isight, payload->samples,
  count);\n\nlength is the iso header data_length. It can be up to 0xffff. So the\n\
  gate allows a count up to about 16379. isight_samples() then copies\ncount frames
  out of payload->samples into the PCM DMA buffer.\n\npayload->samples holds only
  2 * MAX_FRAMES_PER_PACKET values. The\ndevice multiplexes two samples per frame.
  A count past\nMAX_FRAMES_PER_PACKET reads past the payload. A count past the buffer\n\
  size writes past runtime->dma_area. The smallest PCM buffer is larger\nthan MAX_FRAMES_PER_PACKET.
  Bounding the count to MAX_FRAMES_PER_PACKET\nkeeps both the read and the write in
  range.\n\nA malicious or faulty"
