title: "Classic buffer overflow in the Erlang/OTP megaco flex scanner C driver allows
  a remote unauthenticated attacker to corrupt the driver's memory (and potentially
  achieve remote code execution or a denial-of-service crash) by sending a single
  text-encoded H.248/Megaco message containing an oversized property parm name.\n\n\
  When tokenizing a Local/Remote descriptor, mfs_load_property_groups extracts the
  attacker-controlled property name (bounded only by the message length) and, when
  no value follows, formats it into a fixed 512-byte error_msg field of the MfsErlDrvData
  struct using an unchecked sprintf call. Names longer than roughly 452 bytes overflow
  into the immediately following struct fields (text_buf, text_ptr, term_spec, term_spec_size,
  term_spec_index), overwriting live pointers and counters with attacker-chosen bytes.
