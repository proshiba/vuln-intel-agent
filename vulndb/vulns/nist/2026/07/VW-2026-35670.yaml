title: Incorrect Authorization (CWE-863) in Kibana can lead to cross-space 
  information disclosure via Privilege Abuse (CAPEC-122). A user with Fleet 
  agent management privileges in one Kibana space can retrieve Fleet Server 
  policy details from other spaces through an internal enrollment endpoint. The 
  endpoint bypasses space-scoped access controls by using an unscoped internal 
  client, returning operational identifiers, policy names, management state, and
  infrastructure linkage details from spaces the user is not authorized to 
  access.
