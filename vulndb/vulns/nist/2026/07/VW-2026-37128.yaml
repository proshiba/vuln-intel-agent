title: "A flaw was found in CRIU's handling of restartable sequences (rseq) during
  checkpoint/restore. A malicious process inside a container can register an rseq
  critical section that hijacks CRIU's parasite code injection during checkpoint,
  allowing it to spoof the process credentials saved in the checkpoint image. On restore,
  the container process gains elevated capabilities and zeroed UIDs/GIDs.\n\nThe practical
  impact on Red Hat products is limited by several factors: checkpoint/restore requires
  root privileges (podman) or cluster-admin RBAC (OpenShift) to trigger and cannot
  be initiated from within the container itself; on OpenShift prior to 4.17 the feature
  required explicit opt-in, and on 4.17+ the kubelet checkpoint API RBAC is not configured
  by default; OpenShift enforces user namespaces by default for regular workloads
  (hostUsers is gated behind admin-only SCCs), which makes the spoofed capabilities
  namespace-scoped and ineffective for privilege escalation; SELinux type enforcement
