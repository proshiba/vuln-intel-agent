title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the player skin configuration endpoint at admin/playerUpdate.json.php does not
  validate CSRF tokens. The plugins table is explicitly excluded from the ORM's 
  domain-based security check via ignoreTableSecurityCheck(), removing the only 
  other layer of defense. Combined with SameSite=None cookies, a cross-origin 
  POST can modify the video player appearance on the entire platform.
