title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncomedi:
  Fix initialization of data for instructions that write to subdevice\n\nSome Comedi
  subdevice instruction handlers are known to access\ninstruction data elements beyond
  the first `insn->n` elements in some\ncases.  The `do_insn_ioctl()` and `do_insnlist_ioctl()`
  functions\nallocate at least `MIN_SAMPLES` (16) data elements to deal with this,\n\
  but they do not initialize all of that.  For Comedi instruction codes\nthat write
  to the subdevice, the first `insn->n` data elements are\ncopied from user-space,
  but the remaining elements are left\nuninitialized.  That could be a problem if
  the subdevice instruction\nhandler reads the uninitialized data.  Ensure that the
  first\n`MIN_SAMPLES` elements are initialized before calling these instruction\n\
  handlers, filling the uncopied elements with 0.  For\n`do_insnlist_ioctl()`, the
  same data buffer elements are used for\nhandling a list of instructions, so ensure
  the first `MIN_SAMPLES`\n"
