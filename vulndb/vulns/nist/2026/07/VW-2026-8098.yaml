title: "A vulnerability with a privilege management mechanism in the Palo Alto Networks
  Prisma Access Agent® enables a locally authenticated non-administrative user to
  escalate their privileges to root on macOS and Linux or NT AUTHORITY\\SYSTEM on
  Windows. This allows the user to execute arbitrary code and read sensitive information
  otherwise accessible only to privileged accounts.\n\n\n\nThe Prisma Access Agent
  on iOS, Android and Chrome OS are not affected."
