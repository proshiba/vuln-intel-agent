title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  shaper: protect from late creation of hierarchy\n\nWe look up a netdev during prep
  of Netlink ops (pre- callbacks)\nand take a ref to it. Then later in the body of
  the callback\nwe take its lock or RCU which are the actual protections.\n\nThe netdev
  may get unregistered in between the time we take\nthe ref and the time we lock it.
  We may allocate the hierarchy\nafter flush has already run, which would lead to
  a leak.\n\nTake the instance lock in pre- already, this saves us from the race\n\
  and removes the need for dedicated lock/unlock callbacks completely.\nAfter all,
  if there's any chance of write happening concurrently\nwith the flush - we're back
  to leaking the hierarchy.\n\nWe may take the lock for devices which don't support
  shapers but\nwe're only dealing with SET operations here, not taking the lock\n\
  would be optimizing for an error case."
