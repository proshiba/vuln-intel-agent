title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  better track kernel sockets lifetime\n\nWhile kernel sockets are dismantled during
  pernet_operations->exit(),\ntheir freeing can be delayed by any tx packets still
  held in qdisc\nor device queues, due to skb_set_owner_w() prior calls.\n\nThis then
  trigger the following warning from ref_tracker_dir_exit() [1]\n\nTo fix this, make
  sure that kernel sockets own a reference on net->passive.\n\nAdd sk_net_refcnt_upgrade()
  helper, used whenever a kernel socket\nis converted to a refcounted one.\n\n[1]\n\
  \n[  136.263918][   T35] ref_tracker: net notrefcnt@ffff8880638f01e0 has 1/2 users
  at\n[  136.263918][   T35]      sk_alloc+0x2b3/0x370\n[  136.263918][   T35]   \
