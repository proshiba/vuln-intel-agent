title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix error flow upon firmware failure for RQ destruction\n\nUpon RQ destruction if
  the firmware command fails which is the\nlast resource to be destroyed some SW resources
  were already cleaned\nregardless of the failure.\n\nNow properly rollback the object
  to its original state upon such failure.\n\nIn order to avoid a use-after free in
  case someone tries to destroy the\nobject again, which results in the following
  kernel trace:\nrefcount_t: underflow; use-after-free.\nWARNING: CPU: 0 PID: 37589
  at lib/refcount.c:28 refcount_warn_saturate+0xf4/0x148\nModules linked in: rdma_ucm(OE)
  rdma_cm(OE) iw_cm(OE) ib_ipoib(OE) ib_cm(OE) ib_umad(OE) mlx5_ib(OE) rfkill mlx5_core(OE)
  mlxdevm(OE) ib_uverbs(OE) ib_core(OE) psample mlxfw(OE) mlx_compat(OE) macsec tls
  pci_hyperv_intf sunrpc vfat fat virtio_net net_failover failover fuse loop nfnetlink
  vsock_loopback vmw_vsock_virtio_transport_common vmw_vsock_vmci_transport vmw_vmci
  vsoc"
