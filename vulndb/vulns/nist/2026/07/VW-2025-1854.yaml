title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Cancel the running bpf_timer through kworker for PREEMPT_RT\n\nDuring the update
  procedure, when overwrite element in a pre-allocated\nhtab, the freeing of old_element
  is protected by the bucket lock. The\nreason why the bucket lock is necessary is
  that the old_element has\nalready been stashed in htab->extra_elems after alloc_htab_elem()\n\
  returns. If freeing the old_element after the bucket lock is unlocked,\nthe stashed
  element may be reused by concurrent update procedure and the\nfreeing of old_element
  will run concurrently with the reuse of the\nold_element. However, the invocation
  of check_and_free_fields() may\nacquire a spin-lock which violates the lockdep rule
  because its caller\nhas already held a raw-spin-lock (bucket lock). The following
  warning\nwill be reported when such race happens:\n\n  BUG: scheduling while atomic:
  test_progs/676/0x00000003\n  3 locks held by test_progs/676:\n  #0: ffffffff864b0240
  (rcu_read_loc"
