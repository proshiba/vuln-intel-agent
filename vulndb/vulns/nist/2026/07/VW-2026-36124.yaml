title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  handle unreadable frags\n\nsashiko reports:\n When an skb with unreadable fragments
  (such as from devmem TCP, where\n skb_frags_readable(skb) returns false) is processed
  by the u32 module,\n skb_copy_bits() will safely return a negative error code [..]\n\
  \nxt_u32: bail out with hotdrop in this case.\ngather_frags: return -1, just as
  if we had no fragment header.\nnfnetlink_queue: restrict to the linear part.\nnfnetlink_log:
  restrict to the linear part.\n\nv2:\n - skb_zerocopy helpers don't copy readable
  flag, i.e. nfnetlink_queue\n is broken too\n xt_u32 shouldn't return true if hotdrop
  was set."
