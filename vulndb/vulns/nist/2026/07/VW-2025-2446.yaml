title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRevert
  \"NFSD: Remove the cap on number of operations per NFSv4 COMPOUND\"\n\nI've found
  that pynfs COMP6 now leaves the connection or lease in a\nstrange state, which causes
  CLOSE9 to hang indefinitely. I've dug\ninto it a little, but I haven't been able
  to root-cause it yet.\nHowever, I bisected to commit 48aab1606fa8 (\"NFSD: Remove
  the cap on\nnumber of operations per NFSv4 COMPOUND\").\n\nTianshuo Han also reports
  a potential vulnerability when decoding\nan NFSv4 COMPOUND. An attacker can place
  an arbitrarily large op\ncount in the COMPOUND header, which results in:\n\n[  \
  \ 51.410584] nfsd: vmalloc error: size 1209533382144, exceeds total\npages, mode:0xdc0(GFP_KERNEL|__GFP_ZERO),\n\
  nodemask=(null),cpuset=/,mems_allowed=0\n\nwhen NFSD attempts to allocate the COMPOUND
  op array.\n\nLet's restore the operation-per-COMPOUND limit, but increased to 200\n\
  for now."
