title: PraisonAI is a multi-agent teams system. Prior to version 1.5.95, 
  FileTools.download_file() in praisonaiagents validates the destination path 
  but performs no validation on the url parameter, passing it directly to 
  httpx.stream() with follow_redirects=True. An attacker who controls the URL 
  can reach any host accessible from the server including cloud metadata 
  services and internal network services. This issue has been patched in version
  1.5.95.
