title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Fix mode1 reset crash issue\n\nIf HW scheduler hangs and mode1 reset is used to
  recover GPU, KFD signal\nuser space to abort the processes. After process abort
  exit, user queues\nstill use the GPU to access system memory before h/w is reset
  while KFD\ncleanup worker free system memory and free VRAM.\n\nThere is use-after-free
  race bug that KFD allocate and reuse the freed\nsystem memory, and user queue write
  to the same system memory to corrupt\nthe data structure and cause driver crash.\n\
  \nTo fix this race, KFD cleanup worker terminate user queues, then flush\nreset_domain
  wq to wait for any GPU ongoing reset complete, and then\nfree outstanding BOs."
