title: 'Vulnerability in the Oracle Banking Trade Finance product of Oracle Financial
  Services Applications (component: Infrastructure).  Supported versions that are
  affected are 14.6.0-14.8.0. Easily exploitable vulnerability allows low privileged
  attacker with network access via HTTP to compromise Oracle Banking Trade Finance.  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all Oracle Banking Trade Finance accessible
  data as well as  unauthorized access to critical data or complete access to all
  Oracle Banking Trade Finance accessible data. CVSS 3.1 Base Score 8.1 (Confidentiality
  and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N).'
