title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  NFIT: core: Fix acpi_nfit_init() error cleanup\n\nIf acpi_nfit_init() fails after
  adding the acpi_desc object to the\nacpi_descs list, that object is never removed
  from that list because\nthe acpi_nfit_shutdown() devm action is not added for the
  NFIT device\nin that case.  Next, the acpi_nfit_init() failure causes\nacpi_nfit_probe()
  to fail, the acpi_desc object is freed, and a\ndangling pointer is left behind in
  the acpi_descs.  Any subsequent\nACPI Machine Check Exception will trigger nfit_handle_mce()
  which\niterates over acpi_descs and so a use-after-free will occur.\n\nMoreover,
  if acpi_nfit_probe() returns 0 after installing a notify\nhandler for the NFIT device
  and without allocating the acpi_desc\nobject and setting the NFIT device's driver
  data pointer, the\nacpi_desc object will be allocated by acpi_nfit_update_notify()\n\
  and acpi_nfit_init() will be called to initialize it.  Regardless\nof whether or
  not acpi_nfit_ini"
