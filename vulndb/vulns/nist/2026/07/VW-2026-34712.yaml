title: sysPass through version 3.2.11 contains a missing authorization 
  vulnerability that allows authenticated users with the PUBLICLINK_CREATE 
  profile flag to trigger unauthorized decryption and persistent storage of any 
  vault account's password by exploiting the absence of AccountAcl checks in the
  public link creation flow. Attackers can invoke the 
  saveCreateFromAccountAction endpoint to cause AccountService::getDataForLink 
  to load arbitrary target accounts without AccountFilterUser restrictions, 
  decrypt credentials using the session master key, and serialize cleartext 
  passwords into Vault storage on the PublicLink database row, enabling 
  subsequent unauthenticated retrieval if the generated link hash is recovered.
