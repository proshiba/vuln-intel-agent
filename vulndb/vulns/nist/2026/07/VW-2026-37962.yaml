title: The Admin and Site Enhancements (ASE) Pro plugin for WordPress is 
  vulnerable to Remote Code Execution in all versions up to, and including, 
  8.9.0 via the recursive_html function. This is due to the frontend save 
  handler enforces only a publicly emitted nonce with no authentication check, 
  CAPTCHA validation is bypassable by omitting an attacker-supplied key, and 
  repeater row keys from cfgroup[input] are stored verbatim and later spliced 
  into an eval() call in recursive_html without any sanitization or identifier 
  validation. This makes it possible for unauthenticated attackers to execute 
  code on the server. This requires the [post_cf_form] shortcode to be present 
  on at least one publicly accessible page, as the nonce and session ID needed 
  to reach the vulnerable save handler are emitted to unauthenticated visitors 
  by that shortcode.
