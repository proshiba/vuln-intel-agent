title: datamodel-code-generator prior to version 0.70.0 contains a code 
  injection vulnerability that allows attackers who control input schemas to 
  achieve remote code execution by supplying a malicious customBasePath value 
  containing embedded newlines and a dot-free Python expression. The crafted 
  value is emitted verbatim into a generated 'from ... import ...' statement 
  without identifier validation, causing arbitrary Python code to execute when 
  the generated module is imported.
