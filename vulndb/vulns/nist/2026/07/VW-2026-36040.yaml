title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: tcpm: Validate SVID index in svdm_consume_modes()\n\nIn svdm_consume_modes(),
  the SVID value is read from pmdata->svids using\npmdata->svid_index as an array
  index without bounds validation:\n\n    paltmode->svid = pmdata->svids[pmdata->svid_index];\n\
  \nIf pmdata->svid_index is driven beyond SVID_DISCOVERY_MAX (16), it results\nin
  an out-of-bounds read of the pmdata->svids array. Because pd_mode_data\nis embedded
  inside struct tcpm_port, indexing past svids reads into\nadjacent fields. In particular:\n\
  - At index 16, it reads the altmodes count.\n- At index 18 and beyond, it reads
  into altmode_desc[], which contains\n  partner-supplied SVDM Discovery Modes VDOs.\n\
  \nBy injecting a chosen SVID into altmode_desc[0].vdo and driving svid_index\nto
  20, the partner can force paltmode->svid to be loaded with an arbitrary,\npartner-
  chosen SVID, which is then registered via\ntypec_partner_register_altmode().\n\n\
