title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: mask server-provided mode to 07777 in modefromsid\n\nWhen modefromsid is
  active, parse_dacl() applies the server-provided\nsub_auth[2] value from the NFS
  mode SID to cf_mode without masking to\n07777. Apply the correct masking, same as
  in the read path."
