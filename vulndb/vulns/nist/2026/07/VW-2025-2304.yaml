title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  Always split write BIOs to zoned device limits\n\nAny zoned DM target that requires
  zone append emulation will use the\nblock layer zone write plugging. In such case,
  DM target drivers must\nnot split BIOs using dm_accept_partial_bio() as doing so
  can potentially\nlead to deadlocks with queue freeze operations. Regular write operations\n\
  used to emulate zone append operations also cannot be split by the\ntarget driver
  as that would result in an invalid writen sector value\nreturn using the BIO sector.\n\
  \nIn order for zoned DM target drivers to avoid such incorrect BIO\nsplitting, we
  must ensure that large BIOs are split before being passed\nto the map() function
  of the target, thus guaranteeing that the\nlimits for the mapped device are not
  exceeded.\n\ndm-crypt and dm-flakey are the only target drivers supporting zoned\n\
