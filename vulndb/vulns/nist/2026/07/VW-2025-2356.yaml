title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  mcba_usb: populate ndo_change_mtu() to prevent buffer overflow\n\nSending an PF_PACKET
  allows to bypass the CAN framework logic and to\ndirectly reach the xmit() function
  of a CAN driver. The only check\nwhich is performed by the PF_PACKET framework is
  to make sure that\nskb->len fits the interface's MTU.\n\nUnfortunately, because
  the mcba_usb driver does not populate its\nnet_device_ops->ndo_change_mtu(), it
  is possible for an attacker to\nconfigure an invalid MTU by doing, for example:\n\
  \n  $ ip link set can0 mtu 9999\n\nAfter doing so, the attacker could open a PF_PACKET
  socket using the\nETH_P_CANXL protocol:\n\n\tsocket(PF_PACKET, SOCK_RAW, htons(ETH_P_CANXL))\n\
  \nto inject a malicious CAN XL frames. For example:\n\n\tstruct canxl_frame frame
  = {\n\t\t.flags = 0xff,\n\t\t.len = 2048,\n\t};\n\nThe CAN drivers' xmit() function
  are calling can_dev_dropped_skb() to\ncheck that the skb is valid, unfortunately
  under above conditions, the\nmalicious"
