title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix pre-auth out-of-bounds heap read in Discovery Get Log Page\n\nnvmet_execute_disc_get_log_page()
  validates only the dword alignment\nof the host-supplied Log Page Offset (lpo).\
  \  The 64-bit offset is then\nadded to a small kzalloc'd buffer that holds the discovery
  log page\nand the result is passed straight to nvmet_copy_to_sgl(), which\nmemcpy()s
  data_len bytes out to the host with no source-side bound\ncheck:\n\n    u64 offset\
  \      = nvmet_get_log_page_offset(req->cmd);  /* 64-bit host */\n    size_t data_len
  = nvmet_get_log_page_len(req->cmd);     /* 32-bit host */\n    ...\n    if (offset
  & 0x3) { ... }                               /* only check */\n    ...\n    alloc_len
  = sizeof(*hdr) + entry_size * discovery_log_entries(req);\n    buffer = kzalloc(alloc_len,
  GFP_KERNEL);\n    ...\n    status = nvmet_copy_to_sgl(req, 0, buffer + offset, data_len);\n\
  \nThe Discovery controller is unauthenticated -- nvmet_host_allowed()\nret"
