title: The ShopLentor – All-in-One WooCommerce Growth & Store Enhancement Plugin
  plugin for WordPress is vulnerable to Insecure Direct Object Reference in all 
  versions up to, and including, 3.4.5 via the 'optionSection' parameter due to 
  missing validation on a user controlled key. This makes it possible for 
  authenticated attackers, with contributor-level access and above, to read 
  arbitrary wp_options rows — including internal plugin news feed data, 
  WooCommerce block pattern transients, and third-party configuration records — 
  whose values are stored as arrays-of-arrays containing 'title' keys, enabling 
  cross-plugin data leakage.
