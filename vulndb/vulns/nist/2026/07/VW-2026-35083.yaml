title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/sva:
  Fix crash in iommu_sva_unbind_device()\n\ndomain->mm->iommu_mm can be freed by iommu_domain_free():\n\
  \  iommu_domain_free()\n    mmdrop()\n      __mmdrop()\n        mm_pasid_drop()\n\
  After iommu_domain_free() returns, accessing domain->mm->iommu_mm may\ndereference
  a freed mm structure, leading to a crash.\n\nFix this by moving the code that accesses
  domain->mm->iommu_mm to before\nthe call to iommu_domain_free()."
