title: A flaw was found in Dogtag PKI's ACME responder where the web.xml 
  security constraints use exact URL pattern matching for admin-only 
  enable/disable endpoints. By appending a trailing slash to the URL, an 
  unauthenticated attacker can bypass the Tomcat authentication constraint while
  RESTEasy still routes the request to the handler, allowing unauthorized 
  toggling of the ACME service state including persistent denial of service.
