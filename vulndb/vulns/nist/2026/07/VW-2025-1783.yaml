title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  quota: create dedicated workqueue for quota_release_work\n\nThere is a kernel panic
  due to WARN_ONCE when panic_on_warn is set.\n\nThis issue occurs when writeback
  is triggered due to sync call for an\nopened file(ie, writeback reason is WB_REASON_SYNC).
  When f2fs balance\nis needed at sync path, flush for quota_release_work is triggered.\n\
  By default quota_release_work is queued to \"events_unbound\" queue which\ndoes
  not have WQ_MEM_RECLAIM flag. During f2fs balance \"writeback\"\nworkqueue tries
  to flush quota_release_work causing kernel panic due to\nMEM_RECLAIM flag mismatch
  errors.\n\nThis patch creates dedicated workqueue with WQ_MEM_RECLAIM flag\nfor
  work quota_release_work.\n\n------------[ cut here ]------------\nWARNING: CPU:
  4 PID: 14867 at kernel/workqueue.c:3721 check_flush_dependency+0x13c/0x148\nCall
  trace:\n check_flush_dependency+0x13c/0x148\n __flush_work+0xd0/0x398\n flush_delayed_work+0x44/0x5c\n\
  \ dquot_writeback_dquots"
