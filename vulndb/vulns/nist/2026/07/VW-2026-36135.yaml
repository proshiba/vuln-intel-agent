title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/io-wq:
  re-check IO_WQ_BIT_EXIT for each linked work item\n\ncommit 10dc95939817 (\"io_uring/io-wq:
  check IO_WQ_BIT_EXIT inside work\nrun loop\") fixed the obvious case where io_worker_handle_work()
  took one\nexit-bit snapshot before draining pending work, but the fix stops one\n\
  level too early.\n\nio_worker_handle_work() now re-checks IO_WQ_BIT_EXIT in its
  outer work\nrun loop, yet it still snapshots that bit once before processing a whole\n\
  dependent linked-work chain. If io_wq_exit_start() sets IO_WQ_BIT_EXIT\nafter the
  first linked item has started, the remaining linked items can\nstill reuse stale
  do_kill = false, skip IO_WQ_WORK_CANCEL, and continue\nrunning after exit has begun.\n\
  \nMove the check further inside, so it covers linked items too. Note: this\nis a
  syzbot special as it loves setting up tons of slow linked work on\nweird devices
