title: "An application using spring-security-saml2-service-provider and the REDIRECT
  binding for SAML 2.0 Login or Logout may be vulnerable to a denial of service by
  way of an unbounded writer that inflates the compressed SAML payload into memory.\n\
  \nAffected versions:\nSpring Security 5.7.0 through 5.7.23; 5.8.0 through 5.8.25;
  6.3.0 through 6.3.16; 6.4.0 through 6.4.16; 6.5.0 through 6.5.10; 7.0.0 through
