title: picklescan before 1.0.4 fails to block at least seven Python standard 
  library modules (including uuid, _osx_support, _aix_support, _pyrepl.pager, 
  and imaplib) exposing eight functions that provide direct arbitrary command 
  execution. Attackers can craft malicious pickle files importing these 
  unblocked modules to achieve remote code execution while bypassing 
  picklescan's safety validation entirely.
