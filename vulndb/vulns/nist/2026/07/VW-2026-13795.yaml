title: WordPress Plugin Stripe Payments before 2.0.40 contains a stored 
  cross-site scripting vulnerability that allows authenticated attackers to 
  inject malicious scripts through the 
  AcceptStripePayments-settings[currency_code] parameter. Attackers can submit 
  POST requests to /wp-admin/options.php with script payloads in the 
  currency_code field to execute arbitrary JavaScript in administrator browsers 
  when settings are viewed.
