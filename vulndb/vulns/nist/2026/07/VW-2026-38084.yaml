title: When Calico's shared debug server is enabled (disabled by default), the 
  Calico kube-controllers and Goldmane components bind their Go pprof debug 
  listener to 0.0.0.0 without authentication. Any pod with network reachability 
  to the listener can retrieve the process heap, goroutine stacks (including 
  function arguments), and command-line arguments. Depending on the process's 
  in-memory state, the heap may contain sensitive material. The debug listener 
  is opt-in but is unsafe when enabled because it offers no authentication and 
  no safe localhost-only binding option.
