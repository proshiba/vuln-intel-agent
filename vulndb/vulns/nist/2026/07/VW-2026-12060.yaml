title: A security vulnerability has been detected in NousResearch hermes-agent 
  up to 2026.4.30. This vulnerability affects the function 
  _handle_webhook_request of the file gateway/platforms/feishu.py of the 
  component Webhook Endpoint. Such manipulation leads to resource consumption. 
  The attack can be launched remotely. The exploit has been disclosed publicly 
  and may be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
