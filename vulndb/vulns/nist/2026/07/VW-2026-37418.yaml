title: Courier IMAP before 6.0.1 and Courier Mail Server before 2.0.2 allow 
  authenticated IMAP users to crash the imapd process via deeply nested 
  parenthesized SEARCH queries. The SEARCH command parser (alloc_search_key in 
  searchinfo.C) recursively descends on nested parenthesized groups through a 
  mutual recursion chain with alloc_search_andlist() and alloc_search_notkey(), 
  with no depth limit. Courier IMAP has no overall command line length limit, 
  making exploitation trivial. A single IMAP command with ~2500 nested 
  parentheses overflows the 8MB default stack, causing SIGSEGV.
