title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/core:
  Detach event groups during remove_on_exec\n\nperf_event_remove_on_exec() removes
  events by calling\nperf_event_exit_event(). For top-level events, this removes the
  event from\nthe context with DETACH_EXIT only.\n\nThis can leave inconsistent group
  state when a removed event is a group\nleader and the group contains siblings without
  remove_on_exec. If the group\nwas active, the surviving siblings can remain active
  and attached to the\nremoved leader's sibling list, but are no longer represented
  by a valid\ngroup leader on the PMU context active lists.\n\nA later close of the
  removed leader uses DETACH_GROUP and can promote the\nstill-active siblings from
  this stale group state. The next schedule-in can\nthen add an already-linked active_list
  entry again, corrupting the PMU\ncontext active list.\n\nWith DEBUG_LIST enabled,
  this is caught as a list_add double-add in\nmerge_sched_in().\n\nFix this by detaching
  group relationships "
