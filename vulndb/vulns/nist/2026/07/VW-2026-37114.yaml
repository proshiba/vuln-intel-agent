title: In schreibfaul1 ESP32-audioI2S 3.4.5, a heap-based buffer overflow 
  vulnerability exists in the ID3 tag parsing function showID3Tag() of the 
  embedded audio streaming library. The program reads untrusted long ID3 tag 
  value from malicious audio files and uses unbounded appendf() to write 
  formatted strings into ps_ptr heap buffer without length validation. 
  Successful exploitation allows attackers to execute arbitrary code, leak 
  sensitive memory data, cause device crash, or escalate privileges via a 
  crafted malicious audio file.
