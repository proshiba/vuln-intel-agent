title: The wp-media-folder-addon WordPress plugin through 4.1.6 does not 
  validate a user-supplied parameter before using it in a file read operation in
  two AJAX actions available to unauthenticated users, leading to Arbitrary File
  Disclosure and Server-Side Request Forgery on sites where a cloud storage 
  connection has been configured. This is an incomplete fix of CVE-2026-9690, 
  whose patch hardened only one of the affected cloud-storage handlers and left 
  the others unpatched.
