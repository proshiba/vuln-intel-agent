title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  wacom: fix slab-out-of-bounds write in wacom_wac_queue_insert\n\nwacom_wac_queue_insert()
  calls kfifo_skip() in a loop when the kfifo\ndoesn't have enough space for the incoming
  report. If the kfifo is\nempty, kfifo_skip() reads stale data left in the kmalloc'd
  buffer\nvia __kfifo_peek_n() and interprets it as a record length, advancing\nfifo->out
  by that garbage value. This corrupts the internal kfifo\nstate, causing kfifo_unused()
  to return a value much larger than the\nactual buffer size, which bypasses __kfifo_in_r()'s
  guard:\n\n  if (len + recsize > kfifo_unused(fifo))\n      return 0;\n\nkfifo_copy_in()
  then performs an out-of-bounds memcpy, writing up to\n3842 bytes past the 256-byte
  buffer.\n\nAdd a !kfifo_is_empty() condition to the while loop so kfifo_skip()\n\
  is never called on an empty fifo, and check the return value of\nkfifo_in() to reject
  reports that are too large for the fifo."
