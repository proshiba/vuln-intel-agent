title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  Fix null-ptr-deref in fib6_nh_mtu_change().\n\nfib6_nh_mtu_change() re-fetches idev
  via __in6_dev_get(arg->dev) and\ndereferences idev->cnf.mtu6 without a NULL check.
  addrconf_ifdown()\nclears dev->ip6_ptr with RCU_INIT_POINTER() after rt6_disable_ip()
  has\nreleased tb6_lock, so the RA-driven MTU walk can observe a NULL idev and\n\
  oops. The caller rt6_mtu_change_route() guards its own __in6_dev_get(),\nbut this
  re-fetch is unguarded; nexthop-backed routes survive\naddrconf_ifdown()'s flush,
  so the walk still reaches it after ip6_ptr is\nnulled.\n\nReturn 0 when idev is
  NULL, matching rt6_mtu_change_route() and the\nfib6_mtu() fix in commit 5ad509c1fdad
  (\"ipv6: Fix null-ptr-deref in\nfib6_mtu().\").\n\n  Oops: general protection fault,
  ... KASAN: null-ptr-deref in range\n        [0x00000000000002a8-0x00000000000002af]\n\
  \  RIP: 0010:fib6_nh_mtu_change+0x203/0x990\n   rt6_mtu_change_route+0x141/0x1d0\n\
  \   __fib6_clean_all+0xd0/0x160\n   r"
