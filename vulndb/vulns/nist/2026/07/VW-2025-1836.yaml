title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  delete intermediate secpath entry in packet offload mode\n\nPackets handled by hardware
  have added secpath as a way to inform XFRM\ncore code that this path was already
  handled. That secpath is not needed\nat all after policy is checked and it is removed
  later in the stack.\n\nHowever, in the case of IP forwarding is enabled (/proc/sys/net/ipv4/ip_forward),\n\
  that secpath is not removed and packets which already were handled are reentered\n\
  to the driver TX path with xfrm_offload set.\n\nThe following kernel panic is observed
  in mlx5 in such case:\n\n mlx5_core 0000:04:00.0 enp4s0f0np0: Link up\n mlx5_core
  0000:04:00.1 enp4s0f1np1: Link up\n Initializing XFRM netlink socket\n IPsec XFRM
  device driver\n BUG: kernel NULL pointer dereference, address: 0000000000000000\n\
  \ #PF: supervisor instruction fetch in kernel mode\n #PF: error_code(0x0010) - not-present
  page\n PGD 0 P4D 0\n Oops: Oops: 0010 [#1] PREEMPT SMP\n CPU: 0 UID: 0 PID: 0 Com"
