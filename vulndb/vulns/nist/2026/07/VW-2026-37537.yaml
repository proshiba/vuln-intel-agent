title: MCP Ruby SDK is the official Ruby SDK for Model Context Protocol servers 
  and clients. Prior to 0.23.0, MCP::Server::Transports::StreamableHTTPTransport
  in the mcp gem does not bind a session ID to a session owner, allowing an 
  attacker with a stolen session ID to send tools/call requests that execute in 
  the victim's session. This issue is fixed in version 0.23.0.
