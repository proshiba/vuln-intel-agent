title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: kalmia: bound RX frame length in kalmia_rx_fixup()\n\nkalmia_rx_fixup() computes
  usb_packet_length = skb->len - (2 *\nKALMIA_HEADER_LENGTH) as a u16, guarded only
  by a pre-loop check that\nskb->len is at least KALMIA_HEADER_LENGTH, which is 6.
  A device can\ndeliver a short bulk-IN frame with skb->len in the 6 to 11 range,
  or\nleave a short trailing remainder on a later loop iteration. Either case\nunderflows
  usb_packet_length to about 65530.\n\nThat bypasses the usb_packet_length < ether_packet_length
  truncation path.\nThe device-supplied ether_packet_length, a le16 up to 65535 read
  from\nheader_start[2], then drives a memcmp() and the following skb_trim() and\n\
  skb_pull() past the end of the rx buffer. The rx buffer is hard_mtu * 10,\nwhich
  is 14000 bytes. That is an out of bounds read.\n\nRequire both the start and end
  framing headers to be present before\nsubtracting them, on every loop iteration."
