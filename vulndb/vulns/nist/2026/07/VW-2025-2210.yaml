title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/sev:
  Use TSC_FACTOR for Secure TSC frequency calculation\n\nWhen using Secure TSC, the
  GUEST_TSC_FREQ MSR reports a frequency based on\nthe nominal P0 frequency, which
  deviates slightly (typically ~0.2%) from\nthe actual mean TSC frequency due to clocking
  parameters.\n\nOver extended VM uptime, this discrepancy accumulates, causing clock
  skew\nbetween the hypervisor and a SEV-SNP VM, leading to early timer interrupts
  as\nperceived by the guest.\n\nThe guest kernel relies on the reported nominal frequency
  for TSC-based\ntimekeeping, while the actual frequency set during SNP_LAUNCH_START
  may\ndiffer. This mismatch results in inaccurate time calculations, causing the\n\
