title: A vulnerability has been found in yoanbernabeu grepai 0.35.0. This issue 
  affects some unknown processing of the file indexer/chunker.go of the 
  component Qdrant Backend. Such manipulation leads to use of weak hash. The 
  attack may be performed from remote. Attacks of this nature are highly 
  complex. The exploitability is assessed as difficult. The exploit has been 
  disclosed to the public and may be used. The pull request to fix this issue 
  awaits acceptance.
