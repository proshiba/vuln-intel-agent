title: "[This CNA information record relates to multiple CVEs; the\ntext explains
  which aspects/vulnerabilities correspond to which CVE.]\n\nTo manage the system,
  sysctl and platform operations are used by the\ncontrol domain or a possible Xenstore
  domain.  Some of these operations\nmay not be executed in parallel, so a system-wide
  lock each is used.\nThe way those locks are acquired is, however, not providing
  any fairness.\nFurthermore, with XSM/Flask in use, the lock acquire will, for some\n\
  operations, occur ahead of any permission checking.\n\nThe sysctl issue is CVE-2026-62426.\n\
  \nThe platform-op issue is CVE-2026-62427."
