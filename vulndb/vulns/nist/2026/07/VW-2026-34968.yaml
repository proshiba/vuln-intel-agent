title: "SillyTavern is a locally installed user interface that allows users to interact
  with text generation large language models, image generation engines, and text-to-speech
  voice models. Prior to version 1.17.0, in src/endpoints/search.js, the hostname
  is checked against /^\\d+\\.\\d+\\.\\d+\\.\\d+$/. This only matches literal dotted-quad
  IPv4 (e.g. 127.0.0.1, 10.0.0.1). It does not catch: localhost (hostname, not dotted-quad),
  [::1] (IPv6 loopback), and DNS names resolving to internal addresses (e.g. localtest.me
  -> 127.0.0.1). A separate port check (urlObj.port !== '') limits exploitation to
  services on default ports (80/443), making this lower severity than a fully unrestricted
  SSRF. This issue has been patched in version 1.17.0."
