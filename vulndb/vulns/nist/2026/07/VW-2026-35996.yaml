title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Clear __hyp_running_vcpu when flushing the pKVM hyp vCPU\n\nflush_hyp_vcpu()
  copies the host vCPU context into the hyp's private\nvCPU on every run. ctxt_to_vcpu()
  expects a guest context to have a\nNULL __hyp_running_vcpu, which is only ever set
  on the host context, so\nthat it resolves the vCPU via container_of(). While this
  is generally\nthe case, flush_hyp_vcpu() copies the context verbatim and does not\n\
  enforce this, so a value provided by the host is dereferenced at EL2\n(host -> EL2).\n\
  \nFix by clearing __hyp_running_vcpu after the copy."
