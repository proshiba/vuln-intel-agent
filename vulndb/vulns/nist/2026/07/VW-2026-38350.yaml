title: An improper authorization and security-boundary bypass vulnerability in 
  the bigquery-execute-sql tool component of Google mcp-toolbox versions 0.16.1 
  through 1.4.0 allows an authenticated attacker to bypass allowedDatasets 
  validation checks. The toolbox relies on the BigQuery dry-run API to enforce 
  dataset restrictions, but due to a fail-open logic flaw, it bypasses 
  validation when the API returns an empty array for specialized constructs. 
  This allows the attacker to extract structural DDL schemas for explicitly 
  excluded datasets via INFORMATION_SCHEMA, and access downstream federated row 
  data via EXTERNAL_QUERY connections.
