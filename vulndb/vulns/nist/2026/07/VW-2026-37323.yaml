title: "diff‑so‑fancy does not properly sanitize non‑SGR terminal control sequences
  before outputting diff data. The application only strips ANSI SGR sequences while
  allowing other control characters, including carriage return (\\r) and escape sequences
  (e.g., OSC, CSI), to pass through unsanitized.\n\nAn attacker can embed malicious
  control sequences in filenames, diff metadata, or file content that are rendered
  directly in the terminal during diff viewing. This can lead to output manipulation,
  including filename spoofing, terminal screen clearing, and clipboard injection via
  supported escape sequences.\n\nSuccessful exploitation may mislead users during
  code review, alter terminal state, or result in unintended command execution through
  clipboard hijacking.\n\nThis issue has been fixed in the commit 9c81294"
