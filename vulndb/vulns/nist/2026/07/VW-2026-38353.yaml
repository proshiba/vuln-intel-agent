title: 'An authentication bypass and audience confusion vulnerability exists in the
  Google OAuth provider component of Google mcp-toolbox version 1.4.0. When a Google
  authService is initialized with mcpEnabled: true but lacks an explicitly defined
  audience or clientId, the ValidateMCPAuth pipeline for opaque tokens skips audience
  validation entirely. As a result, the toolbox will accept any valid Google OAuth
  access token—even those minted for unrelated ecosystem applications—granting unauthorized
  clients access to protected tools and data backends.'
