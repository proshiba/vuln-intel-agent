title: Calico's Application Layer Policy (disabled by default), which enforces 
  HTTP rules through Dikastes, fails to perform URL path normalization. As a 
  result, HTTP requests using path-traversal segments, encoded slashes, or 
  repeated slashes are not correctly evaluated by Prefix path rules. Dikastes 
  authorizes the request under the permitted prefix while the downstream 
  workload or a fronting proxy normalizes the path and serves the restricted 
  endpoint. An attacker with network access and no special RBAC can potentially 
  reach HTTP endpoints the policy was intended to restrict.
