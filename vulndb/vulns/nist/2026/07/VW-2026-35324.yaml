title: pyLoad is a free and open-source download manager written in Python. In 
  0.5.0b3.dev96 and earlier, the parse_urls API function in 
  src/pyload/core/api/__init__.py fetches arbitrary URLs server-side via 
  get_url(url) (pycurl) without any URL validation, protocol restriction, or IP 
  blacklist. An authenticated user with ADD permission can make HTTP/HTTPS 
  requests to internal network resources and cloud metadata endpoints, read 
  local files via file:// protocol (pycurl reads the file server-side), interact
  with internal services via gopher:// and dict:// protocols, and enumerate file
  existence via error-based oracle (error 37 vs empty response).
