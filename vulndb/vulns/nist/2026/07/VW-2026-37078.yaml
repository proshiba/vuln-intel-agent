title: "Pivotick contains a DOM-based cross-site scripting vulnerability in its generic
  UI element resolution and icon-rendering utilities.\n\nThe tryResolveHTMLElement
  function treated any resolved string as HTML markup by assigning it to a <template>
  element through innerHTML. Strings derived from untrusted graph properties or custom
  rendering callbacks could therefore introduce arbitrary HTML or SVG elements into
  the live document. The vulnerable function was used by multiple UI components, including
  headers, property panels, extra panels, and tooltips.\n\nAdditionally, createIcon
  inserted caller-supplied svgIcon markup into a template without sanitization. An
  application integrating Pivotick and deriving icon markup from untrusted data could
  therefore expose a second script-execution path.\n\nAn unauthenticated attacker
