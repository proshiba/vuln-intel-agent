title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  Fix UAF in panthor_gem_create_with_handle() debugfs code\n\nThe object is potentially
  already gone after the drm_gem_object_put().\nIn general the object should be fully
  constructed before calling\ndrm_gem_handle_create(), except the debugfs tracking
  uses a separate\nlock and list and separate flag to denotate whether the object
  is\nactually initialized.\n\nSince I'm touching this all anyway simplify this by
  only adding the\nobject to the debugfs when it's ready for that, which allows us
  to\ndelete that separate flag. panthor_gem_debugfs_bo_rm() already checks\nwhether
  we've actually been added to the list or this is some error\npath cleanup.\n\nv2:
  Fix build issues for !CONFIG_DEBUGFS (Adrián)\n\nv3: Add linebreak and remove outdated
  comment (Liviu)"
