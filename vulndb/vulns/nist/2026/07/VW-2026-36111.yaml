title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: resolve SWN tcon from live registrations\n\ncifs_swn_notify() looks up a
  witness registration by id under\ncifs_swnreg_idr_mutex, drops the mutex, and then
  uses the registration's\ncached tcon pointer.  That pointer is not a lifetime reference,
  and it is\nnot a stable representative once cifs_get_swn_reg() lets multiple tcons\n\
  for the same net/share name share one registration id.\n\nA same-share second mount
  can keep the cifs_swn_reg alive after the first\ntcon unregisters and is freed.\
  \  The registration then still points at the\nfreed first tcon, so taking tc_lock
  or incrementing tc_count through\nswnreg->tcon only moves the use-after-free earlier.\
  \  Taking tc_lock while\nholding cifs_swnreg_idr_mutex also violates the documented
  CIFS lock\norder.\n\nFix this by making the registration store only the stable witness\n\
  identity: id, net name, share name, and notify flags.  When a notify\narrives, copy
  that identity under ci"
