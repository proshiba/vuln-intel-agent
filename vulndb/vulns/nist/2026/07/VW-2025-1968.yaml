title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/cpu:
  Avoid running off the end of an AMD erratum table\n\nThe NULL array terminator at
  the end of erratum_1386_microcode was\nremoved during the switch from x86_cpu_desc
  to x86_cpu_id. This\ncauses readers to run off the end of the array.\n\nReplace
  the NULL."
