title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix NULL pointer dereference in func_set_flag()\n\nfunc_set_flag() dereferences
  tr->current_trace_flags before verifying\nthat the current tracer is actually the
  function tracer. When the active\ntracer has been switched away from \"function\"\
  \ (e.g., to \"wakeup_rt\"),\ntr->current_trace_flags can be NULL, leading to a NULL
  pointer\ndereference and kernel crash.\n\nThe call chain that triggers this is:\n\
  \n  trace_options_write()\n    -> __set_tracer_option()\n      -> trace->set_flag()\
  \          /* func_set_flag */\n\nIn func_set_flag(), the first operation is:\n\n\
  \  if (!!set == !!(tr->current_trace_flags->val & bit))\n\nThis dereferences tr->current_trace_flags
  unconditionally. The safety\ncheck that guards against a non-function tracer:\n\n\
  \  if (tr->current_trace != &function_trace)\n      return 0;\n\nis placed *after*
  the dereference, which is too late.\n\nThis was observed with the following crash
  dump:\n\n  BUG: unable to handle page f"
