title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: Fix invalid data access in ath12k_dp_rx_h_undecap_nwifi\n\nIn certain cases,
  hardware might provide packets with a\nlength greater than the maximum native Wi-Fi
  header length.\nThis can lead to accessing and modifying fields in the header\n\
  within the ath12k_dp_rx_h_undecap_nwifi function for\nDP_RX_DECAP_TYPE_NATIVE_WIFI
  decap type and\npotentially resulting in invalid data access and memory corruption.\n\
  \nAdd a sanity check before processing the SKB to prevent invalid\ndata access in
  the undecap native Wi-Fi function for the\nDP_RX_DECAP_TYPE_NATIVE_WIFI decap type.\n\
  \nTested-on: QCN9274 hw2.0 PCI WLAN.WBE.1.3.1-00173-QCAHKSWPL_SILICONZ-1"
