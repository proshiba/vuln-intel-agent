title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix reservation leak in some error paths when inserting inline extent\n\nIf we fail
  to allocate a path or join a transaction, we return from\n__cow_file_range_inline()
  without freeing the reserved qgroup data,\nresulting in a leak. Fix this by ensuring
  we call btrfs_qgroup_free_data()\nin such cases."
