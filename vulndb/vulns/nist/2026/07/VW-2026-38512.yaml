title: "Zephyr's IPv6 forwarding path re-sent routed unicast packets without ever
  decrementing the IPv6 hop limit. Both routing branches of ipv6_route_packet() (subsys/net/ip)
  were affected: the explicit-route path (net_route_packet()) and the on-link cross-interface
  path (net_route_packet_if()). Each set the packet forwarding flag and called net_send_data()
  with the hop limit untouched and no expiry check.\n\nPer RFC 8200 the hop-limit
  decrement is the mechanism that bounds packet lifetime and terminates routing loops;
  without it, a device acting as an IPv6 router relays looping packets indefinitely.
  An on-path attacker who can induce or exploit a transient L3 loop turns it into
  a permanent forwarding storm, causing CPU/bandwidth resource exhaustion (availability
  DoS) on the forwarder and adjacent links; path-discovery and loop diagnostics that
  rely on hop-limit expiry are also defeated.\n\nAffected configurations. In every
