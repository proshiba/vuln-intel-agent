title: LiquidJS is a Shopify / GitHub Pages compatible template engine in pure 
  JavaScript. Prior to 10.25.3, the replace filter in LiquidJS incorrectly 
  accounts for memory usage when the memoryLimit option is enabled. It charges 
  str.length + pattern.length + replacement.length bytes to the memory limiter, 
  but the actual output from str.split(pattern).join(replacement) can be 
  quadratically larger when the pattern occurs many times in the input string. 
  This allows an attacker who controls template content to bypass the 
  memoryLimit DoS protection with approximately 2,500x amplification, 
  potentially causing out-of-memory conditions. This vulnerability is fixed in 
  10.25.3.
