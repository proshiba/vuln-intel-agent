title: A weakness has been identified in suvarchal docker-mcp-server up to 
  0.1.0. The impacted element is the function 
  stop_container/remove_container/pull_image of the file src/index.ts of the 
  component HTTP Interface. This manipulation causes os command injection. The 
  attack is possible to be carried out remotely. The exploit has been made 
  available to the public and could be used for attacks. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
