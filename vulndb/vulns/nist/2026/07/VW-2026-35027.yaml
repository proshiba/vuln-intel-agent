title: "A security flaw has been discovered in Shinrays Games Goods Triple App up
  to 1.200. The affected element is an unknown function of the file jRwTX.java of
  the component cats.goods.sort.sorting.games. Performing a manipulation of the argument
  AES_IV/AES_PASSWORD results in use of hard-coded cryptographic key\r . Attacking
  locally is a requirement. The complexity of an attack is rather high. The exploitability
  is described as difficult. The exploit has been released to the public and may be
  used for attacks. The vendor was contacted early about this disclosure but did not
  respond in any way."
