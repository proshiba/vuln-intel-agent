title: LiquidJS is a Shopify / GitHub Pages compatible template engine in pure 
  JavaScript. Prior to 10.25.3, liquidjs 10.25.0 documents root as constraining 
  filenames passed to renderFile() and parseFile(), but top-level file loads do 
  not enforce that boundary. A Liquid instance configured with an empty 
  temporary directory as root can return the contents of arbitrary files. This 
  vulnerability is fixed in 10.25.3.
