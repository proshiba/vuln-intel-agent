title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  fix kernel BUG when userfaultfd_move encounters swapcache\n\nuserfaultfd_move()
  checks whether the PTE entry is present or a\nswap entry.\n\n- If the PTE entry
  is present, move_present_pte() handles folio\n  migration by setting:\n\n  src_folio->index
  = linear_page_index(dst_vma, dst_addr);\n\n- If the PTE entry is a swap entry, move_swap_pte()
  simply copies\n  the PTE to the new dst_addr.\n\nThis approach is incorrect because,
  even if the PTE is a swap entry,\nit can still reference a folio that remains in
  the swap cache.\n\nThis creates a race window between steps 2 and 4.\n 1. add_to_swap:
  The folio is added to the swapcache.\n 2. try_to_unmap: PTEs are converted to swap
  entries.\n 3. pageout: The folio is written back.\n 4. Swapcache is cleared.\nIf
  userfaultfd_move() occurs in the window between steps 2 and 4,\nafter the swap PTE
  has been moved to the destination, accessing the\ndestination triggers do_swap_page(),
  which may locate"
