title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget : fix use-after-free in composite_dev_cleanup()\n\n1. In func configfs_composite_bind()
  -> composite_os_desc_req_prepare():\nif kmalloc fails, the pointer cdev->os_desc_req
  will be freed but not\nset to NULL. Then it will return a failure to the upper-level
  function.\n2. in func configfs_composite_bind() -> composite_dev_cleanup():\nit
  will checks whether cdev->os_desc_req is NULL. If it is not NULL, it\nwill attempt
  to use it.This will lead to a use-after-free issue.\n\nBUG: KASAN: use-after-free
  in composite_dev_cleanup+0xf4/0x2c0\nRead of size 8 at addr 0000004827837a00 by
  task init/1\n\nCPU: 10 PID: 1 Comm: init Tainted: G           O      5.10.97-oh
  #1\n kasan_report+0x188/0x1cc\n __asan_load8+0xb4/0xbc\n composite_dev_cleanup+0xf4/0x2c0\n\
  \ configfs_composite_bind+0x210/0x7ac\n udc_bind_to_driver+0xb4/0x1ec\n usb_gadget_probe_driver+0xec/0x21c\n\
  \ gadget_dev_desc_UDC_store+0x264/0x27c"
