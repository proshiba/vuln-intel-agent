title: XWiki Platform is a generic wiki platform offering runtime services for 
  applications built on top of it. Prior to 17.4.8 and 17.10.1, an improperly 
  protected scripting API allows any user with script right to bypass the 
  sandboxing of the Velocity scripting API and execute, e.g., arbitrary Python 
  scripts, allowing full access to the XWiki instance and thereby compromising 
  the confidentiality, integrity and availability of the whole instance. Note 
  that script right already constitutes a high level of access that we don't 
  recommend giving to untrusted users. This vulnerability is fixed in 17.4.8 and
  17.10.1.
