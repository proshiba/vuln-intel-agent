title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  avoid deadlock on fallback while reinjecting\n\nJakub reported an MPTCP deadlock
  at fallback time:\n\n WARNING: possible recursive locking detected\n 6.18.0-rc7-virtme
  #1 Not tainted\n --------------------------------------------\n mptcp_connect/20858
  is trying to acquire lock:\n ff1100001da18b60 (&msk->fallback_lock){+.-.}-{3:3},
  at: __mptcp_try_fallback+0xd8/0x280\n\n but task is already holding lock:\n ff1100001da18b60
  (&msk->fallback_lock){+.-.}-{3:3}, at: __mptcp_retrans+0x352/0xaa0\n\n other info
  that might help us debug this:\n  Possible unsafe locking scenario:\n\n        CPU0\n\
  \        ----\n   lock(&msk->fallback_lock);\n   lock(&msk->fallback_lock);\n\n\
  \  *** DEADLOCK ***\n\n  May be due to missing lock nesting notation\n\n 3 locks
  held by mptcp_connect/20858:\n  #0: ff1100001da18290 (sk_lock-AF_INET){+.+.}-{0:0},
  at: mptcp_sendmsg+0x114/0x1bc0\n  #1: ff1100001db40fd0 (k-sk_lock-AF_INET#2){+.+.}-{0:0},
  at: __mptcp_retrans+0x2cb/"
