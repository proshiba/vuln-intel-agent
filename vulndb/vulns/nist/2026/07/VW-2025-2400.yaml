title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_ncm: Refactor bind path to use __free()\n\nAfter an bind/unbind cycle,
  the ncm->notify_req is left stale. If a\nsubsequent bind fails, the unified error
  label attempts to free this\nstale request, leading to a NULL pointer dereference
  when accessing\nep->ops->free_request.\n\nRefactor the error handling in the bind
  path to use the __free()\nautomatic cleanup mechanism.\n\nUnable to handle kernel
  NULL pointer dereference at virtual address 0000000000000020\nCall trace:\n usb_ep_free_request+0x2c/0xec\n\
  \ ncm_bind+0x39c/0x3dc\n usb_add_function+0xcc/0x1f0\n configfs_composite_bind+0x468/0x588\n\
  \ gadget_bind_driver+0x104/0x270\n really_probe+0x190/0x374\n __driver_probe_device+0xa0/0x12c\n\
  \ driver_probe_device+0x3c/0x218\n __device_attach_driver+0x14c/0x188\n bus_for_each_drv+0x10c/0x168\n\
  \ __device_attach+0xfc/0x198\n device_initial_probe+0x14/0x24\n bus_probe_device+0x94/0x11c\n\
  \ device_add+0x268/0x48c\n usb_add_gadget+0x198/0x28c\n dwc"
