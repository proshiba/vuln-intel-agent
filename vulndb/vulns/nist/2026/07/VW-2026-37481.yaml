title: "In the Linux kernel, the following vulnerability has been resolved:\n\ne1000:
  fix OOB in e1000_tbi_should_accept()\n\nIn e1000_tbi_should_accept() we read the
  last byte of the frame via\n'data[length - 1]' to evaluate the TBI workaround. If
  the descriptor-\nreported length is zero or larger than the actual RX buffer size,
  this\nread goes out of bounds and can hit unrelated slab objects. The issue\nis
  observed from the NAPI receive path (e1000_clean_rx_irq):\n\n==================================================================\n\
  BUG: KASAN: slab-out-of-bounds in e1000_tbi_should_accept+0x610/0x790\nRead of size
  1 at addr ffff888014114e54 by task sshd/363\n\nCPU: 0 PID: 363 Comm: sshd Not tainted
