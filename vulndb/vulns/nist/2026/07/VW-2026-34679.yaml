title: "In the Linux kernel, the following vulnerability has been resolved:\n\nMIPS:
  DEC: Prevent initial console buffer from landing in XKPHYS\n\nIn 64-bit configurations
  calling the initial console output handler from\na kernel thread other than the
  initial one will result in a situation\nwhere the stack has been placed in the XKPHYS
  64-bit memory segment and\nconsequently so has been the buffer allocated there that
  is used as the\nargument corresponding to the `%s' output conversion specifier for
  the\nfirmware's printf() entry point.\n\nThis 64-bit address will then be truncated
  by 32-bit firmware, resulting\nin an attempt to access the wrong memory location,
  which in turn will\ncause all kinds of unpredictable behaviour, such as a kernel
  crash:\n\n  Console: colour dummy device 160x64\n  Calibrating delay loop... 49.36
  BogoMIPS (lpj=192512)\n  pid_max: default: 32768 minimum: 301\n  CPU 0 Unable to
  handle kernel paging request at virtual address 000000000203bd00, epc == ffffffffbfc08364,
  ra == ffffffffbfc08"
