title: Unisys WebPerfect Image Suite versions 3.0.3960.22810 and 3.0.3960.22604 
  expose a deprecated .NET Remoting TCP channel that allows remote 
  unauthenticated attackers to leak NTLMv2 machine-account hashes by supplying a
  Windows UNC path as a target file argument through object-unmarshalling 
  techniques. Attackers can capture the leaked NTLMv2 hash and relay it to other
  hosts to achieve privilege escalation or lateral movement depending on network
  configuration and patch level.
