title: "Applications that evaluate user-supplied Spring Expression Language (SpEL)
  expressions are vulnerable to an Algorithmic Denial of Service (DoS). By providing
  a specially crafted expression, an attacker can trigger excessive resource consumption
  during evaluation, leading to application degradation or unavailability.\n\nAffected
  versions:\nSpring Framework 7.0.0 through 7.0.7; 6.2.0 through 6.2.18; 6.1.0 through
  6.1.27; 5.3.0 through 5.3.48."
