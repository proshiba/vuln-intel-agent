title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  goodix - clamp the device-reported contact count\n\ngoodix_ts_read_input_report()
  copies the number of touch points reported\nby the device into an on-stack buffer\n\
  \n\tu8 point_data[2 + GOODIX_MAX_CONTACT_SIZE * GOODIX_MAX_CONTACTS];\n\nwhich is
  sized for at most GOODIX_MAX_CONTACTS (10) contacts. The only\nruntime check bounds
  the per-interrupt count against ts->max_touch_num,\nbut that value is taken verbatim
  from a 4-bit field of the device\nconfiguration block and is never clamped:\n\n\t
  ts->max_touch_num = ts->config[MAX_CONTACTS_LOC] & 0x0f;\n\nThe nibble can be 0..15,
  so a malfunctioning, malicious or counterfeit\ncontroller (or an attacker tampering
  with the I2C bus) can advertise up\nto 15 contacts. goodix_ts_read_input_report()
  then accepts a touch_num\nof up to 15 and the second goodix_i2c_read() writes\n\
  ts->contact_size * (touch_num - 1) bytes past the one-contact header into\npoint_data
  - up to 30 bytes (45 with the 9-"
