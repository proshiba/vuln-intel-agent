title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix potential UAF in smb2_close_cached_fid()\n\nfind_or_create_cached_dir()
  could grab a new reference after kref_put()\nhad seen the refcount drop to zero
  but before cfid_list_lock is acquired\nin smb2_close_cached_fid(), leading to use-after-free.\n\
  \nSwitch to kref_put_lock() so cfid_release() is called with\ncfid_list_lock held,
  closing that gap."
