title: PraisonAI is a multi-agent teams system. Prior to version 4.5.90, 
  passthrough() and apassthrough() in praisonai accept a caller-controlled 
  api_base parameter that is concatenated with endpoint and passed directly to 
  httpx.Client.request() when the litellm primary path raises AttributeError. No
  URL scheme validation, private IP filtering, or domain allowlist is applied, 
  allowing requests to any host reachable from the server. This issue has been 
  patched in version 4.5.90.
