title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Unconditionally recompute CR8 intercept on PPR update\n\nThe TPR_THRESHOLD
  field in the VMCS is used by VMX to induce VM exits\nwhen the guest's virtual TPR
  falls under the specified threshold,\nallowing KVM to inject previously masked interrupts.\n\
  \nKVM handles these VM exits in handle_tpr_below_threshold().\nCommit eb90f3417a0c
  (\"KVM: vmx: speed up TPR below threshold vmexits\")\noptimized this function by
  calling apic_update_ppr() instead of raising\nKVM_REQ_EVENT. apic_update_ppr() then
  raises KVM_REQ_EVENT if there is\na pending, deliverable interrupt.\n\nHowever,
  if there are no new interrupts pending, apic_update_ppr() does\nnot issue the request.
  Thus, kvm_lapic_update_cr8_intercept() and\nvmx_update_cr8_intercept() are not called
  before VM entry, which results\nin a high, stale TPR_THRESHOLD. This is problematic
  due to the following\nsentence in 28.2.1.1 \"VM-Execution Control Fields\" in the
  SDM:\n\n  The following che"
