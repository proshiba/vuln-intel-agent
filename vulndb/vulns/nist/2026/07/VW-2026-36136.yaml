title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/nop:
  fix file reference leak with IOSQE_FIXED_FILE\n\nNOP file-acquisition support choses
  between a fixed (registered) file and\na normal fget()'d file based on its own IORING_NOP_FIXED_FILE
  flag in\nsqe->nop_flags. However, a request's REQ_F_FIXED_FILE is set\nindependently
  from the generic IOSQE_FIXED_FILE sqe flag during request\ninit, before the issue
  handler runs.\n\nIf a NOP is submitted with IOSQE_FIXED_FILE set (so REQ_F_FIXED_FILE
  is\nset) but without IORING_NOP_FIXED_FILE, io_nop() takes the normal path\nand
  grabs a real reference via io_file_get_normal(). On completion,\nio_put_file() only
  drops the reference when REQ_F_FIXED_FILE is clear,\nso the fget()'d file is never
  released and leaks:\n\n  BUG: memory leak\n  unreferenced object 0xffff88800f42c240
  (size 176):\n    kmem_cache_alloc_noprof+0x358/0x440\n    alloc_empty_file+0x57/0x180\n\
  \    path_openat+0x44/0x1e50\n    do_file_open+0x121/0x200\n    do_sys_openat2+0x"
