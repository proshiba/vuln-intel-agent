title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm,
  slab: clean up slab->obj_exts always\n\nWhen memory allocation profiling is disabled
  at runtime or due to an\nerror, shutdown_mem_profiling() is called: slab->obj_exts
  which\npreviously allocated remains.\nIt won't be cleared by unaccount_slab() because
  of\nmem_alloc_profiling_enabled() not true. It's incorrect, slab->obj_exts\nshould
  always be cleaned up in unaccount_slab() to avoid following error:\n\n[...]BUG:
  Bad page state in process...\n..\n[...]page dumped because: page still charged to
  cgroup\n\n[andriy.shevchenko@linux.intel.com: fold need_slab_obj_ext() into its
  only user]"
