title: The Post Grid Gutenberg Blocks – PostX plugin for WordPress is vulnerable
  to Stored Cross-Site Scripting via 'searchnoresult' Block Attribute in all 
  versions up to, and including, 5.0.32 due to insufficient input sanitization 
  and output escaping. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. This is 
  particularly concerning in a cross-privilege scenario where a Contributor 
  creates a pending or draft post containing the malicious block attribute, 
  which then executes arbitrary JavaScript in the browser session of an Editor 
  or Administrator who previews that post.
