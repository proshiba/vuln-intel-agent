title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  iowarrior: fix use-after-free on disconnect race\n\nmutex_unlock() may access the
  mutex structure after releasing the lock\nand therefore cannot be used to manage
  lifetime of objects directly\n(unlike spinlocks and refcounts). [1][2]\n\nUse a
  kref to release the driver data to avoid use-after-free in\nmutex_unlock() when
  release() races with disconnect().\n\n[1] a51749ab34d9 (\"locking/mutex: Document
  that mutex_unlock() is non-atomic\")\n[2] 2b9d9e0a9ba0 (\"locking/mutex: Clarify
  that mutex_unlock(), and most\n                   other sleeping locks, can still
  use the lock object\n                   after it's unlocked\")"
