title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  dwc3: run gadget disconnect from sleepable suspend context\n\ndwc3_gadget_suspend()
  takes dwc->lock with IRQs disabled and then calls\ndwc3_disconnect_gadget().  For
  async callbacks that helper only uses\nplain spin_unlock()/spin_lock(), so the gadget
  ->disconnect() callback\nstill runs with IRQs disabled and any sleepable callback
  trips Lockdep.\n\nThis issue was found by our static analysis tool and then manually\n\
  reviewed against the current tree.\n\nThe grounded PoC kept the dwc3_gadget_suspend()
  ->\ndwc3_disconnect_gadget() -> gadget_driver->disconnect() chain, and\nLockdep
  reported:\n\n  BUG: sleeping function called from invalid context\n  gadget_disconnect+0x21/0x39
  [vuln_msv]\n  dwc3_gadget_suspend.constprop.0+0x2b/0x42 [vuln_msv]\n\nKeep the disconnect
  callback selection in one common helper, but add a\nsleepable suspend-side wrapper
  which snapshots the callback under\ndwc->lock and then runs it after spin_unlock_irqrestor"
