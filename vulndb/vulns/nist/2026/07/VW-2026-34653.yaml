title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Avoid UAF in scx_root_enable_workfn() init failure path\n\nIn scx_root_enable_workfn(),
  put_task_struct(p) is called before scx_error()\ndereferences p->comm and p->pid.
  If the iterator's reference is the last\ndrop, the task is freed synchronously and
  the deref becomes a UAF.\n\nMove put_task_struct() past scx_error()."
