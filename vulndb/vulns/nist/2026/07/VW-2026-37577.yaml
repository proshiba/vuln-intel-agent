title: ImageMagick is free and open-source software used for editing and 
  manipulating digital images. In versions prior to 7.1.2-27, the BGR decoder 
  does not check for an end-of-file in every location so a crafted image could 
  result in an heap buffer over-read. This issue has been fixed in version 
  7.1.2-27.
