title: "Accesses to the CMOS memory contents are done using an indirect IO port\n\
  pair.  Therefore Xen needs to cache the guest chosen index, and one of\nthe usages
  of the index didn't take the necessary locking to avoid\nconcurrent changes.  As
  a result, a guest could change the index after\nit being checked, causing a subsequent
  out-of-bound read access to the\ncontents of an array."
