title: Cal.com (calcom/cal.diy) versions through 4.7.15 contain a stored 
  cross-site scripting vulnerability. The single booking view (e.g., 
  https://app.cal.com/booking/<id>) renders booking-question field labels via 
  React's dangerouslySetInnerHTML without sanitizing or escaping user input. An 
  attacker who can create an event type with a malicious booking-question label 
  can inject arbitrary HTML/JavaScript that executes when a victim opens the 
  crafted booking URL. The issue is fixed in v4.7.16.
