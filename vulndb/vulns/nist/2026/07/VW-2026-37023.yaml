title: A flaw was found in openshift/oauth-proxy. The proxy sets authenticated 
  identity headers using only dash-variant keys (X-Forwarded-User) but does not 
  strip underscore-variant keys (X_Forwarded_User) from incoming requests. WSGI 
  and PHP frameworks normalize both variants to the same variable, allowing an 
  authenticated low-privilege user to smuggle a forged identity that may 
  override the legitimate authenticated identity in the upstream application.
