title: Chamilo LMS is an open-source learning management system. In version 
  2.0-RC.2, the file public/main/inc/ajax/install.ajax.php is accessible without
  authentication on fully installed instances because, unlike other AJAX 
  endpoints, it does not include the global.inc.php file that performs 
  authentication and installation-completed checks. Its test_mailer action 
  accepts an arbitrary Symfony Mailer DSN string from POST data and uses it to 
  connect to an attacker-specified SMTP server, enabling Server-Side Request 
  Forgery (SSRF) into internal networks via the SMTP protocol. An 
  unauthenticated attacker can also abuse this to weaponize the Chamilo server 
  as an open email relay for phishing and spam campaigns, with emails appearing 
  to originate from the server's IP address. Additionally, error responses from 
  failed SMTP connections may disclose information about internal network 
  topology and running services. This issue has been fixed in version 
  2.0.0-RC.3.
