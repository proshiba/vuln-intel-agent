title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: Fix NULL pointer dereference in core_scsi3_decode_spec_i_port()\n\nThe function
  core_scsi3_decode_spec_i_port(), in its error code path,\nunconditionally calls
  core_scsi3_lunacl_undepend_item() passing the\ndest_se_deve pointer, which may be
  NULL.\n\nThis can lead to a NULL pointer dereference if dest_se_deve remains\nunset.\n\
  \nSPC-3 PR SPEC_I_PT: Unable to locate dest_tpg\nUnable to handle kernel paging
  request at virtual address dfff800000000012\nCall trace:\n  core_scsi3_lunacl_undepend_item+0x2c/0xf0
  [target_core_mod] (P)\n  core_scsi3_decode_spec_i_port+0x120c/0x1c30 [target_core_mod]\n\
  \  core_scsi3_emulate_pro_register+0x6b8/0xcd8 [target_core_mod]\n  target_scsi3_emulate_pr_out+0x56c/0x840
  [target_core_mod]\n\nFix this by adding a NULL check before calling\ncore_scsi3_lunacl_undepend_item()"
