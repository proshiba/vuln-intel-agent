title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mctp: ensure our nlmsg responses are initialised\n\nSyed Faraz Abrar (@farazsth98)
  from Zellic, and Pumpkin (@u1f383) from\nDEVCORE Research Team working with Trend
  Micro Zero Day Initiative\nreport that a RTM_GETNEIGH will return uninitalised data
  in the pad\nbytes of the ndmsg data.\n\nEnsure we're initialising the netlink data
  to zero, in the link, addr\nand neigh response messages."
