title: Emlog is an open source website building system. In versions 2.6.2 and 
  prior, a SQL injection vulnerability exists in include/model/tag_model.php at 
  line 168. The updateTagName() function directly interpolates user input into 
  the SQL query string without using parameterized queries or proper escaping 
  ($this->db->escape_string()), making it vulnerable to SQL injection attacks. 
  At time of publication, there are no publicly available patches.
