title: A flaw was found in gnome-remote-desktop as shipped in Red Hat Enterprise
  Linux. When the daemon is running in system mode with RDP enabled, the 
  incoming connection handler bypasses the connection throttler, allowing an 
  unauthenticated remote attacker to open many parallel pre-authentication 
  connections to the RDP listener. This can accumulate accepted sockets and 
  pending routing-token operations until timeout, exhausting resources and 
  preventing legitimate users from establishing RDP sessions. This issue does 
  not affect the upstream version.
