title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: add locking for bcm_op runtime updates\n\nThe CAN broadcast manager (CAN BCM)
  can send a sequence of CAN frames via\nhrtimer. The content and also the length
  of the sequence can be changed\nresp reduced at runtime where the 'currframe' counter
  is then set to zero.\n\nAlthough this appeared to be a safe operation the updates
  of 'currframe'\ncan be triggered from user space and hrtimer context in bcm_can_tx().\n\
  Anderson Nascimento created a proof of concept that triggered a KASAN\nslab-out-of-bounds
  read access which can be prevented with a spin_lock_bh.\n\nAt the rework of bcm_can_tx()
  the 'count' variable has been moved into\nthe protected section as this variable
  can be modified from both contexts\ntoo."
