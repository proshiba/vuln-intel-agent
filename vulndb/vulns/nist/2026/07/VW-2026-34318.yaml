title: "Generation of Predictable Numbers or Identifiers vulnerability in Erlang/OTP
  kernel (inet_res, inet_db modules) allows DNS Cache Poisoning.\n\nThe built-in DNS
  resolver (inet_res) uses a sequential, process-global 16-bit transaction ID for
  UDP queries and does not implement source port randomization. Response validation
  relies almost entirely on this ID, making DNS cache poisoning practical for an attacker
  who can observe one query or predict the next ID. This conflicts with RFC 5452 recommendations
  for mitigating forged DNS answers.\n\ninet_res is intended for use in trusted network
  environments and with trusted recursive resolvers. Earlier documentation did not
  clearly state this deployment assumption, which could lead users to deploy the resolver
  in environments where spoofed DNS responses are possible.\n\nThis vulnerability
  is associated with program files lib/kernel/src/inet_db.erl and lib/kernel/src/inet_res.erl.\n\
  \nThis issue affects OTP from OTP 17.0 before OTP 28.4.2, OTP 27.3.4.10 an"
