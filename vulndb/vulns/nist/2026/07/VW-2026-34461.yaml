title: The WPO365 | Login plugin for WordPress is vulnerable to Cross-Site 
  Request Forgery in versions up to, and including, 43.2. This is due to the 
  Ajax_Service::verify_ajax_request() helper gating its wp_verify_nonce() call 
  behind the boolean option 'enable_nonce_check', which is absent from the 
  default 'wpo365_options' array and therefore evaluates to false via 
  get_global_boolean_var(); as a result, the wp_ajax_wpo365_update_settings 
  handler (Ajax_Service::update_settings) accepts POSTs from cross-origin pages 
  and forwards the attacker-supplied 'settings' payload (base64/JSON) to 
  Options_Service::update_options(), which merges every key/value into 
  wpo365_options without a key allowlist. This makes it possible for 
  unauthenticated attackers to overwrite arbitrary plugin options — including 
