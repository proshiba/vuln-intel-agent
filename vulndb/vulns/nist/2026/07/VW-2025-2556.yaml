title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix null deref on srq->rq.queue after resize failure\n\nA NULL pointer dereference
  can occur in rxe_srq_chk_attr() when\nibv_modify_srq() is invoked twice in succession
  under certain error\nconditions. The first call may fail in rxe_queue_resize(),
  which leads\nrxe_srq_from_attr() to set srq->rq.queue = NULL. The second call then\n\
  triggers a crash (null deref) when accessing\nsrq->rq.queue->buf->index_mask.\n\n\
  Call Trace:\n<TASK>\nrxe_modify_srq+0x170/0x480 [rdma_rxe]\n? __pfx_rxe_modify_srq+0x10/0x10
  [rdma_rxe]\n? uverbs_try_lock_object+0x4f/0xa0 [ib_uverbs]\n? rdma_lookup_get_uobject+0x1f0/0x380
  [ib_uverbs]\nib_uverbs_modify_srq+0x204/0x290 [ib_uverbs]\n? __pfx_ib_uverbs_modify_srq+0x10/0x10
  [ib_uverbs]\n? tryinc_node_nr_active+0xe6/0x150\n? uverbs_fill_udata+0xed/0x4f0
  [ib_uverbs]\nib_uverbs_handler_UVERBS_METHOD_INVOKE_WRITE+0x2c0/0x470 [ib_uverbs]\n\
  ? __pfx_ib_uverbs_handler_UVERBS_METHOD_INVOKE_WRITE+0x10/0x10 [ib_uverbs]\n"
