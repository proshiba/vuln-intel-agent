title: schreibfaul1 ESP32-audioI2S 3.4.5 has a heap-based buffer overflow 
  vulnerability in the host parsing logic. The dismantle_host() function parses 
  untrusted host and URL input, and subsequent code uses clone_from() to copy 
  parsed host, request host, extension and query_string segments into fixed heap
  buffers without boundary checking.
