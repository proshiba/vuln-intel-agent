title: The BEAR – Bulk Editor and Products Manager Professional for WooCommerce 
  by Pluginus.Net plugin for WordPress is vulnerable to Cross-Site Request 
  Forgery in all versions up to, and including, 1.1.5. This is due to missing 
  nonce validation on the woobe_redraw_table_row() function. This makes it 
  possible for unauthenticated attackers to update WooCommerce product data 
  including prices, descriptions, and other product fields via a forged request 
  granted they can trick a site administrator or shop manager into performing an
  action such as clicking on a link.
