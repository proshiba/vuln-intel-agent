title: "HttpClient based on the classic i/o model fails to correctly release the underlying
  connection back to the connection manager if it encounters an invalid or unsupported
  `Content-Encoding` header value in the response message. Please note this defect
  does not affect HttpClient based on the async i/o model.\n\nThis issue affects Apache
  HttpComponents Client: from 5.0-alpha1 through 5.6.2."
