title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrust_binder:
  clear freeze listener on node removal\n\nGenerally userspace is supposed to explicitly
  clear freeze listeners\nbefore they drop the refcount on the node ref to zero, but
  there's\nnothing forcing that. Currently, in this scenario the freeze listener\n\
  remains in the freeze_listeners rbtree and in the remote node's freeze\nlistener
  list, even though the ref for which the listener is registered\nis gone. This could
  potentially lead to a memory leak due to a refcount\ncycle. Thus, remove the freeze
  listener in this scenario."
