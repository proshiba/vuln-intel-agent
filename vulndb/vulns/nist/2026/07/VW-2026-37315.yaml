title: "Apache Traffic Server updates the HTTP/2 HPACK dynamic table before confirming
  the header block encoded successfully, so an encode failure leaves the encoder out
  of sync with the peer decoder and corrupts subsequent header blocks on the connection.\n\
  \nThis issue affects Apache Traffic Server: from 8.0.0 through 8.1.9, from 9.0.0
  through 9.2.14, from 10.0.0 through 10.1.3.\n\nUsers are recommended to upgrade
  to version 9.2.15 or 10.1.4, which fix the issue."
