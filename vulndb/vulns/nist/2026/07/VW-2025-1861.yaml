title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Load DR6 with guest value only before entering .vcpu_run() loop\n\nMove the
  conditional loading of hardware DR6 with the guest's DR6 value\nout of the core
  .vcpu_run() loop to fix a bug where KVM can load hardware\nwith a stale vcpu->arch.dr6.\n\
  \nWhen the guest accesses a DR and host userspace isn't debugging the guest,\nKVM
  disables DR interception and loads the guest's values into hardware on\nVM-Enter
  and saves them on VM-Exit.  This allows the guest to access DRs\nat will, e.g. so
  that a sequence of DR accesses to configure a breakpoint\nonly generates one VM-Exit.\n\
  \nFor DR0-DR3, the logic/behavior is identical between VMX and SVM, and also\nidentical
  between KVM_DEBUGREG_BP_ENABLED (userspace debugging the guest)\nand KVM_DEBUGREG_WONT_EXIT
  (guest using DRs), and so KVM handles loading\nDR0-DR3 in common code, _outside_
  of the core kvm_x86_ops.vcpu_run() loop.\n\nBut for DR6, the guest's value doesn't
  need to be loaded"
