title: "A stored format string vulnerability was found in the FTP Backup on the ADM.
  The vulnerability occurs because user-controlled backup configuration data may be
  written into a task log and later processed through an unsafe format string operation.
  An authenticated attacker can exploit this issue to disclose memory information
  or cause denial of service of the affected CGI process.\nAffected products and versions
  include: from ADM 4.1.0 through ADM 4.3.3.RUN1 as well as from ADM 5.0.0 through
  ADM 5.1.3.RI81."
