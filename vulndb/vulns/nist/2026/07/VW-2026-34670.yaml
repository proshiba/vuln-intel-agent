title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  codecs: simple-mux: Fix enum control bounds check\n\nsimple_mux_control_put() rejects
  values greater than e->items, but\nenum control values are zero based. For the two-entry
  mux used by this\ndriver, valid values are 0 and 1, so value 2 must be rejected
  as well.\n\nAccepting e->items can store an invalid mux state, pass it to the GPIO\n\
  setter, and pass it on to the DAPM mux update path where it is used as\nan index
  into the enum text array.\n\nUse the same >= e->items check used by the ASoC enum
  helpers."
