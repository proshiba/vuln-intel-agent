title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix warning in smc_rx_splice() when calling get_page()\n\nsmc_lo_register_dmb()
  allocates DMB buffers with kzalloc(), which are\nlater passed to get_page() in smc_rx_splice().
  Since kmalloc memory is\nnot page-backed, this triggers WARN_ON_ONCE() in get_page()
  and prevents\nholding a refcount on the buffer. This can lead to use-after-free
  if\nthe memory is released before splice_to_pipe() completes.\n\nUse folio_alloc()
  instead, ensuring DMBs are page-backed and safe for\nget_page().\n\nWARNING: CPU:
  18 PID: 12152 at ./include/linux/mm.h:1330 smc_rx_splice+0xaf8/0xe20 [smc]\nCPU:
