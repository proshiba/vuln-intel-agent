title: OpenClaw before 2026.3.13 contains a remote command injection 
  vulnerability in the iMessage attachment staging flow that allows attackers to
  execute arbitrary commands on configured remote hosts. The vulnerability 
  exists because unsanitized remote attachment paths containing shell 
  metacharacters are passed directly to the SCP remote operand without 
  validation, enabling command execution when remote attachment staging is 
  enabled.
