title: The 微信二维码登陆 WordPress plugin through 1.3 does not properly validate 
  WeChat webhook requests, as its signature check always passes, and it 
  discloses the generated login code in the webhook response. This allows an 
  unauthenticated attacker to forge a login event for any existing username, 
  read the login code, and redeem it through an unauthenticated AJAX action to 
  log in as that user, including an administrator, without a password.
