title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: Fix invalid entry fetch in ath12k_dp_mon_srng_process\n\nCurrently, ath12k_dp_mon_srng_process
  uses ath12k_hal_srng_src_get_next_entry\nto fetch the next entry from the destination
  ring. This is incorrect because\nath12k_hal_srng_src_get_next_entry is intended
  for source rings, not destination\nrings. This leads to invalid entry fetches, causing
  potential data corruption or\ncrashes due to accessing incorrect memory locations.
  This happens because the\nsource ring and destination ring have different handling
  mechanisms and using\nthe wrong function results in incorrect pointer arithmetic
  and ring management.\n\nTo fix this issue, replace the call to ath12k_hal_srng_src_get_next_entry
  with\nath12k_hal_srng_dst_get_next_entry in ath12k_dp_mon_srng_process. This ensures\n\
  that the correct function is used for fetching entries from the destination\nring,
  preventing invalid memory accesses.\n\nTested-on: QCN9274 hw2.0 PCI WL"
