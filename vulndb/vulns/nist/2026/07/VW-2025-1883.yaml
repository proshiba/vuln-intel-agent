title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/hmm:
  Don't dereference struct page pointers without notifier lock\n\nThe pnfs that we
  obtain from hmm_range_fault() point to pages that\nwe don't have a reference on,
  and the guarantee that they are still\nin the cpu page-tables is that the notifier
  lock must be held and the\nnotifier seqno is still valid.\n\nSo while building the
  sg table and marking the pages accesses / dirty\nwe need to hold this lock with
  a validated seqno.\n\nHowever, the lock is reclaim tainted which makes\nsg_alloc_table_from_pages_segment()
  unusable, since it internally\nallocates memory.\n\nInstead build the sg-table manually.
  For the non-iommu case\nthis might lead to fewer coalesces, but if that's a problem
  it can\nbe fixed up later in the resource cursor code. For the iommu case,\nthe
  whole sg-table may still be coalesced to a single contigous\ndevice va region.\n\
  \nThis avoids marking pages that we don't own dirty and accessed, and\nit also avoid
  derefe"
