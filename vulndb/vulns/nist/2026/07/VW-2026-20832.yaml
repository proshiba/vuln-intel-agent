title: "DBI versions before 1.650 for Perl have a heap overflow when preparsing SQL
  statements with an extreme number of placeholders.\n\nThe fix for CVE-2026-10879
  did not allocate enough memory to handle approximately 1.2-million placeholders.\n\
  \nDBI version 1.650 sets a hard limit of 99,999 placeholders."
