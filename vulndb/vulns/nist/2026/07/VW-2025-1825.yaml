title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  hns3: fixed hclge_fetch_pf_reg accesses bar space out of bounds issue\n\nThe TQP
  BAR space is divided into two segments. TQPs 0-1023 and TQPs\n1024-1279 are in different
  BAR space addresses. However,\nhclge_fetch_pf_reg does not distinguish the tqp space
  information when\nreading the tqp space information. When the number of TQPs is
  greater\nthan 1024, access bar space overwriting occurs.\nThe problem of different
  segments has been considered during the\ninitialization of tqp.io_base. Therefore,
  tqp.io_base is directly used\nwhen the queue is read in hclge_fetch_pf_reg.\n\n\
  The error message:\n\nUnable to handle kernel paging request at virtual address
  ffff800037200000\npc : hclge_fetch_pf_reg+0x138/0x250 [hclge]\nlr : hclge_get_regs+0x84/0x1d0
  [hclge]\nCall trace:\n hclge_fetch_pf_reg+0x138/0x250 [hclge]\n hclge_get_regs+0x84/0x1d0
  [hclge]\n hns3_get_regs+0x2c/0x50 [hns3]\n ethtool_get_regs+0xf4/0x270\n dev_ethtool+0x674/0x8a0\n\
  \ dev_i"
