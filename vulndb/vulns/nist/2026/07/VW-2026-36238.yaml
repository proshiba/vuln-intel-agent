title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  serial: samsung: Remove redundant port lock acquisition in rx helpers\n\nSashiko
  identified a deadlock when the console flow is engaged [1].\n\nWhen console flow
  control is enabled (UPF_CONS_FLOW),\ns3c24xx_serial_stop_tx() calls s3c24xx_serial_rx_enable()
  and\ns3c24xx_serial_start_tx() calls s3c24xx_serial_rx_disable().\n\nThe serial
  core framework invokes the .stop_tx() and .start_tx()\ncallbacks with the port->lock
  spinlock already held. Furthermore, all\ninternal driver paths that invoke stop_tx
  (such as the DMA TX\ncompletion handler s3c24xx_serial_tx_dma_complete() or the
  PIO TX IRQ\nhandler s3c24xx_serial_tx_irq()) also acquire port->lock prior to\n\
  calling it. (Note that s3c24xx_serial_start_tx() is only invoked by the\nserial
  core).\n\nHowever, s3c24xx_serial_rx_enable() and s3c24xx_serial_rx_disable()\n\
  unconditionally attempt to acquire port->lock again using\nuart_port_lock_irqsave().
