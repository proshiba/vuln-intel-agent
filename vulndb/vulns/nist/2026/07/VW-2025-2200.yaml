title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrpl:
  Fix use-after-free in rpl_do_srh_inline().\n\nRunning lwt_dst_cache_ref_loop.sh
  in selftest with KASAN triggers\nthe splat below [0].\n\nrpl_do_srh_inline() fetches
  ipv6_hdr(skb) and accesses it after\nskb_cow_head(), which is illegal as the header
  could be freed then.\n\nLet's fix it by making oldhdr to a local struct instead
  of a pointer.\n\n[0]:\n[root@fedora net]# ./lwt_dst_cache_ref_loop.sh\n...\nTEST:
  rpl (input)\n[   57.631529] ==================================================================\n\
  BUG: KASAN: slab-use-after-free in rpl_do_srh_inline.isra.0 (net/ipv6/rpl_iptunnel.c:174)\n\
