title: 'Electron is a framework for writing cross-platform desktop applications using
  JavaScript, HTML and CSS. Prior to versions 38.8.6, 39.8.1, 40.8.0, and 41.0.0-beta.8,
  on Windows, app.setLoginItemSettings({openAtLogin: true}) wrote the executable path
  to the Run registry key without quoting. If the app is installed to a path containing
  spaces, an attacker with write access to an ancestor directory may be able to cause
  a different executable to run at login instead of the intended app. On a default
  Windows install, standard system directories are protected against writes by standard
  users, so exploitation typically requires a non-standard install location. This
  issue has been patched in versions 38.8.6, 39.8.1, 40.8.0, and 41.0.0-beta.8.'
