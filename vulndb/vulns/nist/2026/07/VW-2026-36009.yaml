title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Prevent out-of-bounds read in glob matching\n\nString event fields are not necessarily
  NUL-terminated, so the filter\npredicate functions (filter_pred_string(), filter_pred_strloc()
  and\nfilter_pred_strrelloc()) pass the field length to the regex match\ncallbacks,
  and the length-aware matchers honour it.\n\nregex_match_glob() was the exception:
  it ignored the length and called\nglob_match(), which scans the string until it
  hits a NUL byte. Some\nstring fields are not NUL-terminated. One example is the
  dynamic char\narray of the xfs_* namespace tracepoints, which is copied without
  a\ntrailing NUL. For such a field, glob matching reads past the end of\nthe event
  field, causing a KASAN slab-out-of-bounds read in\nglob_match(), reached via regex_match_glob()
  and filter_match_preds()\nfrom the xfs_lookup tracepoint.\n\nAdd a length-bounded
  glob_match_len() and use it from regex_match_glob()\nso glob matching always stops
  at the fi"
