title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4:
  include MAY_WRITE in open permission mask for O_TRUNC\n\nPOSIX requires write permission
  to truncate a file, so an open() that\nspecifies O_TRUNC must be authorized for
  write access regardless of the\nO_ACCMODE access mode.\n\nnfs_open_permission_mask()
  builds the access mask passed to\nnfs_may_open(), which is the local authorization
  gate for OPENs the\nclient serves itself from a cached write delegation via the\n\
  can_open_delegated() path in nfs4_try_open_cached().  The mask is\nderived from
  O_ACCMODE alone, so an open(O_RDONLY | O_TRUNC) against a\nfile the caller cannot
  write requests only MAY_READ and passes the\nlocal check.  The OPEN is then satisfied
  locally and the truncation is\nissued to the server as a SETATTR(size=0) over the
  delegation stateid,\nwhich the server accepts under standard write-delegation semantics.\n\
