title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: Fix UAF of hci_conn_params in add_device_complete\n\nadd_device_complete()
  runs from the hci_cmd_sync_work kworker, which\nholds only hci_req_sync_lock and
  *not* hci_dev_lock.  It calls\nhci_conn_params_lookup() and then dereferences the
  returned object\n(params->flags) without taking hci_dev_lock:\n\n\tparams = hci_conn_params_lookup(hdev,
  &cp->addr.bdaddr,\n\t\t\t\t\tle_addr_type(cp->addr.type));\n\t...\n\tdevice_flags_changed(NULL,
  hdev, &cp->addr.bdaddr,\n\t\t\t     cp->addr.type, hdev->conn_flags,\n\t\t\t   \
  \  params ? params->flags : 0);\n\nhci_conn_params_lookup() walks hdev->le_conn_params
  and is documented to\nrequire hdev->lock.  A concurrent MGMT_OP_REMOVE_DEVICE\n\
  (remove_device()), which does run under hci_dev_lock, can call\nhci_conn_params_free()
  to list_del() and kfree() the very object the\nlookup returned, so the subsequent
  params->flags read touches freed\nmemory [0].\n\nHold hci_dev_lock() across the
  hci_conn_params_l"
