title: Seagull Software BarTender 2021 R1 through 12.0.1 contains an insecure 
  deserialization vulnerability that allows low-privileged local users to 
  escalate privileges. The DataServiceSingleton .NET Remoting endpoint is bound 
  to localhost on TCP port 7375 via BtSystem.Service.exe, limiting the attack 
  surface to local access only. The endpoint is configured with 
  BinaryServerFormatterSinkProvider and TypeFilterLevel set to Full. A 
  low-privileged local attacker can send YSoSerial.NET-generated BinaryFormatter
  payloads to the localhost-bound endpoint to achieve code execution as NT 
  AUTHORITY\\\\SYSTEM. The vulnerability was corrected in BarTender 12.1, 
  released on August 14, 2026. Users should upgrade to BarTender 12.1 or later.
