title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  Fix backlog accounting in qdisc_dequeue_internal\n\nThis issue applies for the following
  qdiscs: hhf, fq, fq_codel, and\nfq_pie, and occurs in their change handlers when
  adjusting to the new\nlimit. The problem is the following in the values passed to
  the\nsubsequent qdisc_tree_reduce_backlog call given a tbf parent:\n\n   When the
  tbf parent runs out of tokens, skbs of these qdiscs will\n   be placed in gso_skb.
  Their peek handlers are qdisc_peek_dequeued,\n   which accounts for both qlen and
  backlog. However, in the case of\n   qdisc_dequeue_internal, ONLY qlen is accounted
  for when pulling\n   from gso_skb. This means that these qdiscs are missing a\n\
  \   qdisc_qstats_backlog_dec when dropping packets to satisfy the\n   new limit
  in their change handlers.\n\n   One can observe this issue with the following (with
  tc patched to\n   support a limit of 0):\n\n   export TARGET=fq\n   tc qdisc del
  dev lo root\n   tc qdisc add dev l"
