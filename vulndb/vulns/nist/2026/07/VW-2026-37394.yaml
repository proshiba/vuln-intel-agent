title: AMMOS Instrument Toolkit (AIT) Deep Space Network (DSN) Interface before 
  2.2.2 contains a missing authentication vulnerability in the Space Link 
  Extension (SLE) interface manager that allows unauthenticated network 
  attackers to access seven unprotected API routes by sending direct HTTP 
  requests with no credentials. Attackers can reach the exposed SLE endpoints to
  start or stop Deep Space Network communication sessions, retrieve telemetry 
  frame data, and inject arbitrary frames into active spacecraft links.
