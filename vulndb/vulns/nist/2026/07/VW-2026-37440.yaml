title: Flyto2 Core is an execution kernel for automation and AI-agent workflows.
  Prior to 2.26.6, image.download and related file-writing modules use 
  caller-controlled output_dir instead of validate_path_with_env_config and its 
  FLYTO_SANDBOX_DIR confinement, allowing attacker-controlled response bytes to 
  be written to arbitrary filesystem paths the process can access. This issue is
  fixed in version 2.26.6.
