title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  tegra - Add missing CRYPTO_ALG_ASYNC\n\nThe tegra crypto driver failed to set the
  CRYPTO_ALG_ASYNC on its\nasynchronous algorithms, causing the crypto API to select
  them for users\nthat request only synchronous algorithms.  This causes crashes (at\n\
  least).  Fix this by adding the flag like what the other drivers do.\nAlso remove
  the unnecessary CRYPTO_ALG_TYPE_* flags, since those just\nget ignored and overridden
  by the registration function anyway."
