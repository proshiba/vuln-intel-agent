title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix exchmaps reservation limit check\n\nxfs_exchmaps_estimate_overhead() adds the
  bmbt and rmapbt\noverhead to a local resblks variable, but the final UINT_MAX\n\
  check still tests req->resblks.  That is the reservation value\nfrom before the
  overhead was added.\n\nThe computed value is stored back in req->resblks and later
  passed\nto xfs_trans_alloc(), whose block reservation argument is unsigned\nint.\
  \  Check the computed reservation so the existing limit applies\nto the value that
  will be used."
