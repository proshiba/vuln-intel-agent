title: 'A denial of service vulnerability exists in React Server Components, affecting
  the following packages: react-server-dom-parcel, react-server-dom-turbopack and
  react-server-dom-webpack (versions 19.0.0 through 19.0.4, 19.1.0 through 19.1.5,
  and 19.2.0 through 19.2.4). The vulnerability is triggered by sending specially
  crafted HTTP requests to Server Function endpoints.The payload of the HTTP request
  causes excessive CPU usage for up to a minute ending in a thrown error that is catchable.'
