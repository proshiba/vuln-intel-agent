title: Rocket.Chat's SAML SSO before versions 8.7.0, 8.6.1, 8.5.2, 8.4.5, 8.3.7,
  8.2.7, 8.1.7, 8.0.8, and 7.10.14 verified XML signatures but did not bind the 
  validated signature to samlp:Response / saml:Assertion. An attacker could 
  submit a wrapped document carrying forged identity attributes alongside any 
  valid signature made by the trusted IdP certificate, and log in as an 
  arbitrary user.
