title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Use sizeof(*hdr) instead of sizeof(hdr) in veventq read\n\nThe bound-check in iommufd_veventq_fops_read()
  for the normal vEVENT\npath uses sizeof(hdr) where the surrounding code uses sizeof(*hdr):\n\
  \n\tif (!vevent_for_lost_events_header(cur) &&\n\t    sizeof(hdr) + cur->data_len
  > count - done) {\n\nhdr is declared as struct iommufd_vevent_header *, so sizeof(hdr)\n\
  evaluates to the size of the pointer.  Surrounding code uses\nsizeof(*hdr) consistently:\n\
  \n\tif (done >= count || sizeof(*hdr) > count - done) {\n\t...\n\tif (copy_to_user(buf
  + done, hdr, sizeof(*hdr))) {\n\t...\n\tdone += sizeof(*hdr);\n\nstruct iommufd_vevent_header
  is currently 8 bytes (two __u32 fields,\nflags and sequence), so on 64-bit (sizeof(void
  *) == 8) the two\nexpressions happen to be equal and the check works as intended.\n\
  \nOn 32-bit (sizeof(void *) == 4) the check under-counts the header by\n4 bytes:
  a vEVENT whose data_len causes 8 + cur->data_len to exceed\nco"
