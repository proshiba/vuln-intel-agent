title: A vulnerability was found in NASA cFS up to 7.0.0. This affects the 
  function CFE_MSG_GetSize of the file 
  apps/to_lab/fsw/src/to_lab_passthru_encode.c of the component CCSDS Packet 
  Header Handler. Performing a manipulation results in heap-based buffer 
  overflow. The attacker must have access to the local network to execute the 
  attack. The project was informed of the problem early through an issue report 
  but has not responded yet.
