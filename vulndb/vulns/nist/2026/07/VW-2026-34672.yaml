title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  modedb: fix a possible UAF in fb_find_mode()\n\nIf mode_option is NULL, it is assigned
  from mode_option_buf:\n\n  if (!mode_option) {\n    fb_get_options(NULL, &mode_option_buf);\n\
  \    mode_option = mode_option_buf;\n  }\n\nLater, name is assigned from mode_option:\n\
  \n  const char *name = mode_option;\n\nHowever, mode_option_buf is freed before
  name is no longer used:\n\n  kfree(mode_option_buf);\n\nwhile name is still accessed
  by:\n\n  if ((name_matches(db[i], name, namelen) ||\n\nSince name aliases mode_option_buf,
  this may result in a\nuse-after-free.\n\nFix this by extending the lifetime of mode_option_buf
  until the end of the\nfunction by using scope-based resource management for cleanup."
