title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  xhci: Fix invalid pointer dereference in Etron workaround\n\nThis check is performed
  before prepare_transfer() and prepare_ring(), so\nenqueue can already point at the
  final link TRB of a segment. And indeed\nit will, some 0.4% of times this code is
  called.\n\nThen enqueue + 1 is an invalid pointer. It will crash the kernel right\n\
  away or load some junk which may look like a link TRB and cause the real\nlink TRB
  to be replaced with a NOOP. This wouldn't end well.\n\nUse a functionally equivalent
  test which doesn't dereference the pointer\nand always gives correct result.\n\n\
  Something has crashed my machine twice in recent days while playing with\nan Etron
  HC, and a control transfer stress test ran for confirmation has\njust crashed it
  again. The same test passes with this patch applied."
