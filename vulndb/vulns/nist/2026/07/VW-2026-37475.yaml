title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfunctionfs:
  fix the open/removal races\n\nffs_epfile_open() can race with removal, ending up
  with file->private_data\npointing to freed object.\n\nThere is a total count of
  opened files on functionfs (both ep0 and\ndynamic ones) and when it hits zero, dynamic
  files get removed.\nUnfortunately, that removal can happen while another thread
  is\nin ffs_epfile_open(), but has not incremented the count yet.\nIn that case open
  will succeed, leaving us with UAF on any subsequent\nread() or write().\n\nThe root
  cause is that ffs->opened is misused; atomic_dec_and_test() vs.\natomic_add_return()
  is not a good idea, when object remains visible all\nalong.\n\nTo untangle that\n\
  \t* serialize openers on ffs->mutex (both for ep0 and for dynamic files)\n\t* have
  dynamic ones use atomic_inc_not_zero() and fail if we had\nzero ->opened; in that
