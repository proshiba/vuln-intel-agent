title: The FleekDash V2 plugin for WordPress is vulnerable to authorization 
  bypass in all versions up to, and including, 2.6.2.2. This is due to the 
  plugin not properly verifying that a user is authorized to perform an action. 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to overwrite the email address and password of any WordPress
  user, including administrators, enabling full account takeover and complete 
  site compromise. The public /wp-json/fleekdash/v1/register endpoint 
  auto-provisions a Subscriber-role account and returns a valid REST nonce 
  regardless of the site's users_can_register setting, enabling unauthenticated 
  attackers to self-provision the required credentials and nonce in a single 
  prior request.
