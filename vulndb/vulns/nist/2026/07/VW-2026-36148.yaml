title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qat - fix VF2PF work teardown race in adf_disable_sriov()\n\nThe VF2PF interrupt
  handler queues PF-side response work that stores a\nraw pointer to per-VF state
  (struct adf_accel_vf_info). Currently,\nadf_disable_sriov() destroys per-VF mutexes
  and frees vf_info without\nstopping new VF2PF work or waiting for in-flight workers
  to complete. A\nconcurrently scheduled or already queued worker can then dereference\n\
  freed memory.\n\nThis manifests as a use-after-free when KASAN is enabled:\n\n \
  \ BUG: KASAN: null-ptr-deref in mutex_lock+0x76/0xe0\n  Write of size 8 at addr
  0000000000000260 by task kworker/24:2/...\n  Workqueue: qat_pf2vf_resp_wq adf_iov_send_resp
  [intel_qat]\n  Call Trace:\n    kasan_report+0x119/0x140\n    mutex_lock+0x76/0xe0\n\
  \    adf_gen4_pfvf_send+0xd4/0x1f0 [intel_qat]\n    adf_recv_and_handle_vf2pf_msg+0x290/0x360
  [intel_qat]\n    adf_iov_send_resp+0x8c/0xe0 [intel_qat]\n    process_one_work+0x6ac/0xfd0\n\
  \    worker"
