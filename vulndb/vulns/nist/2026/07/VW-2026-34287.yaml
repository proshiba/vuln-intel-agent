title: A weakness has been identified in assafelovic gpt-researcher up to 3.4.3.
  This issue affects some unknown processing of the file 
  gpt_researcher/skills/researcher.py of the component WebSocket Interface. 
  Executing a manipulation of the argument task can lead to cross site 
  scripting. The attack may be launched remotely. The exploit has been made 
  available to the public and could be used for attacks. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
