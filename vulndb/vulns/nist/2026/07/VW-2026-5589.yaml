title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: prevent races in ->query_interfaces()\n\nIt was possible for two query interface
  works to be concurrently trying\nto update the interfaces.\n\nPrevent this by checking
  and updating iface_last_update under\niface_lock."
