title: SiYuan before v3.7.2 fails to escape the title-img Individual Attribute 
  List value when rendering Gallery and Kanban cover images, allowing stored 
  cross-site scripting via unescaped style attribute interpolation. Attackers 
  with editor permissions can inject onload handlers that execute arbitrary code
  in the Electron renderer with full Node.js access when victims open affected 
  documents.
