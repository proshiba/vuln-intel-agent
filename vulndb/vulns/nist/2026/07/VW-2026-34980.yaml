title: "DbGate is cross-platform database manager. From version 7.0.0 to before version
  7.1.5, a stored XSS vulnerability exists in DbGate because attacker-controlled SVG
  icon strings are rendered as raw HTML without sanitization. In the web UI this allows
  script execution in another user's browser; in the Electron desktop app this can
  escalate to local code execution because Electron is configured with nodeIntegration:
  true and contextIsolation: false. This issue has been patched in version 7.1.5."
