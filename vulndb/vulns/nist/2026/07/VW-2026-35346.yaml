title: Directus is a real-time API and App dashboard for managing SQL database 
  content. Prior to 11.16.1, an open redirect vulnerability exists in the login 
  redirection logic. The isLoginRedirectAllowed function fails to correctly 
  identify certain malformed URLs as external, allowing attackers to bypass 
  redirect allow-list validation and redirect users to arbitrary external 
  domains upon successful authentication. This vulnerability is fixed in 
  11.16.1.
