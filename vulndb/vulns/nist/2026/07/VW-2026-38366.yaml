title: CodeIgniter is a PHP full-stack web framework. In versions prior to 
  4.7.4, IncomingRequest::isSecure() trusted the X-Forwarded-Proto and 
  Front-End-Https headers from any incoming request, allowing an attacker could 
  spoof these headers and cause the application to incorrectly treat an HTTP 
  request as secure. This may have impacted applications that rely on 
  isSecure(), force_https(), forceGlobalSecureRequests, or similar logic to 
  enforce HTTPS-only access or make security-sensitive decisions. Exploitability
  depends on deployment configuration. Applications are most exposed if the 
  backend is reachable directly over HTTP, or if a reverse proxy/load balancer 
  forwards client-supplied forwarding headers without stripping or overwriting 
  them. This issue has been fixed in version 4.7.4.
