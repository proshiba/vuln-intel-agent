title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  accel: bmc150: clamp the device-reported FIFO frame count\n\n__bmc150_accel_fifo_flush()
  copies the number of samples the device\nreports in its hardware FIFO into an on-stack
  buffer\n\n\tu16 buffer[BMC150_ACCEL_FIFO_LENGTH * 3];\n\nwhich is sized for at most
  BMC150_ACCEL_FIFO_LENGTH (32) samples. The\nframe count is read from the FIFO_STATUS
  register and only masked to its\n7 valid bits:\n\n\tcount = val & 0x7F;\n\nso it
  can be 0..127. The only other limit applied to it is the optional\ncaller-supplied
  sample budget:\n\n\tif (samples && count > samples)\n\t\tcount = samples;\n\nwhich
  does not constrain count on the flush-all path (samples == 0), and\nleaves it well
  above 32 whenever samples is larger. count samples are\nthen transferred into buffer[]:\n\
  \n\tbmc150_accel_fifo_transfer(data, (u8 *)buffer, count);\n\nbmc150_accel_fifo_transfer()
  reads count * 6 bytes through regmap, so a\nmalfunctioning, malicious or counterfeit
