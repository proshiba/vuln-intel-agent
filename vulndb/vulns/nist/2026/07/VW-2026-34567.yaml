title: "Reachable Assertion vulnerability in Apache NimBLE.\nA specially crafted ATT
  Read Multiple Variable Response (BLE_ATT_OP_READ_MULT_VAR_RSP) may trigger assert
  in ATT parser.\n\nSeverity is medium as this requires DUT to first send ATT Read
  Multiple Variable Request.\n\nThis issue affects Apache NimBLE: through 1.9.0.\n\
  \nUsers are recommended to upgrade to version 1.10.0, which fixes the issue."
