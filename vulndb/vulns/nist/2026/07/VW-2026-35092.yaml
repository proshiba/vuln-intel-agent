title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ti: icssg-prueth: Fix memory leak in XDP_DROP for non-zero-copy mode\n\nPage recycling
  was removed from the XDP_DROP path in emac_run_xdp() to\navoid conflicts with AF_XDP
  zero-copy mode, which uses xsk_buff_free()\ninstead.\n\nHowever, this causes a memory
  leak when running XDP programs that drop\npackets in non-zero-copy mode (standard
  page pool mode). The pages are\nnever returned to the page pool, leading to OOM
  conditions.\n\nFix this by handling cleanup in the caller, emac_rx_packet().\nWhen
  emac_run_xdp() returns ICSSG_XDP_CONSUMED for XDP_DROP, the\ncaller now recycles
  the page back to the page pool. The zero-copy\npath, emac_rx_packet_zc() already
  handles cleanup correctly with\nxsk_buff_free()."
