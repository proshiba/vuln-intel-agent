title: InvenTree is an Open Source Inventory Management System. From 0.16.0 to 
  before 1.2.7, any authenticated InvenTree user can create a valid API token 
  attributed to any other user in the system — including administrators and 
  superusers — by supplying the target's user ID in the user field of a POST 
  /api/user/tokens/ request. The returned token is immediately usable for full 
  API authentication as the target user, from any network location, with no 
  further interaction required. This vulnerability is fixed in 1.2.7 and 1.3.0.
