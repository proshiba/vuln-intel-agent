title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblock:
  skip sync_blockdev() on surprise removal in bdev_mark_dead()\n\nbdev_mark_dead()'s
  @surprise == true means the device is already gone.\nThe filesystem callback fs_bdev_mark_dead()
  honours this and skips\nsync_filesystem(), but the bare block device path (no ->mark_dead
  op)\nlost its !surprise guard when the holder ->mark_dead callback was wired\nup
  (see Fixes), and now calls sync_blockdev() unconditionally, which can\nhang forever
  waiting on writeback that can no longer complete.\n\nsyzkaller hit this via nvme_reset_work()'s
  \"I/O queues lost\" path:\nnvme_mark_namespaces_dead() -> blk_mark_disk_dead() ->\n\
  bdev_mark_dead(bdev, true) -> sync_blockdev() blocks in\nfolio_wait_writeback(),
  wedging the reset worker and every task waiting\non it.\n\nSkip the sync on surprise
  removal, matching fs_bdev_mark_dead();\ninvalidate_bdev() still runs. Orderly removal
  (surprise == false) is\nunchanged.\n\nFound by FuzzNvme(Syzkaller with FEMU fuz"
