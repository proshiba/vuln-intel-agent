title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  more robust handing of race to avoid txq getting stuck\n\nCommit dc82a33297fc (\"\
  veth: apply qdisc backpressure on full ptr_ring to\nreduce TX drops\") introduced
  a race condition that can lead to a permanently\nstalled TXQ. This was observed
  in production on ARM64 systems (Ampere Altra\nMax).\n\nThe race occurs in veth_xmit().
  The producer observes a full ptr_ring and\nstops the queue (netif_tx_stop_queue()).
  The subsequent conditional logic,\nintended to re-wake the queue if the consumer
  had just emptied it (if\n(__ptr_ring_empty(...)) netif_tx_wake_queue()), can fail.
  This leads to a\n\"lost wakeup\" where the TXQ remains stopped (QUEUE_STATE_DRV_XOFF)
  and\ntraffic halts.\n\nThis failure is caused by an incorrect use of the __ptr_ring_empty()
  API\nfrom the producer side. As noted in kernel comments, this check is not\nguaranteed
  to be correct if a consumer is operating on another CPU. The\nempty test is based
  on ptr_ring->consume"
