title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ravb: Fix missing rtnl lock in suspend/resume path\n\nFix the suspend/resume path
  by ensuring the rtnl lock is held where\nrequired. Calls to ravb_open, ravb_close
  and wol operations must be\nperformed under the rtnl lock to prevent conflicts with
  ongoing ndo\noperations.\n\nWithout this fix, the following warning is triggered:\n\
  [   39.032969] =============================\n[   39.032983] WARNING: suspicious
  RCU usage\n[   39.033019] -----------------------------\n[   39.033033] drivers/net/phy/phy_device.c:2004
