title: SillyTavern is a locally installed user interface that allows users to 
  interact with text generation large language models, image generation engines,
  and text-to-speech voice models. Prior to version 1.17.0, a path traversal 
  vulnerability in /api/chats/import allows an authenticated attacker to write 
  attacker-controlled files outside the intended chats directory by injecting 
  traversal sequences into character_name. This issue has been patched in 
  version 1.17.0.
