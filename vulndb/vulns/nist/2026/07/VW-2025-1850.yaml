title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  xdp: Disallow attaching device-bound programs in generic mode\n\nDevice-bound programs
  are used to support RX metadata kfuncs. These\nkfuncs are driver-specific and rely
  on the driver context to read the\nmetadata. This means they can't work in generic
  XDP mode. However, there\nis no check to disallow such programs from being attached
  in generic\nmode, in which case the metadata kfuncs will be called in an invalid\n\
  context, leading to crashes.\n\nFix this by adding a check to disallow attaching
  device-bound programs\nin generic mode."
