title: A vulnerability in the Agent Development Kit (ADK) allows for 
  continuation forgery in tool confirmations. An attacker who is able to 
  manipulate or inject events into the session history can execute unauthorized 
  tools by forging a tool confirmation response. This is possible because the 
  framework did not verify if the target tool was registered to the executing 
  agent, did not validate if the tool actually required confirmation, and did 
  not match the confirmation arguments against the original tool call event in 
  the history.
