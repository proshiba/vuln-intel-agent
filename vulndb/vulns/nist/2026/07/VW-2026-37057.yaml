title: "Improper Authorization vulnerability in Apache ActiveMQ Broker, Apache ActiveMQ
  All, Apache ActiveMQ.\n\n An authenticated low-privilege user can bypass a per-destination\n\
  write ACL by sending to an ActiveMQ temporary composite destination whose physical
  name is a\ncomma-separated composite of real queues. This allows publishing messages
  to any of the destinations in the list without proper write ACL permissions because
  the authorization check is bypassed due to the composite destination being marked
  as temporary.\nThis issue affects Apache ActiveMQ Broker: before 5.19.9, from 6.0.0
  before 6.2.8; Apache ActiveMQ All: before 5.19.9, from 6.0.0 before 6.2.8; Apache
  ActiveMQ: before 5.19.9, from 6.0.0 before 6.2.8.\n\nUsers are recommended to upgrade
  to version 5.19.9, 6.2.8 or 6.3.0, which fixes the issue."
