title: A flaw was found in yggdrasil-worker-package-manager. A local attacker 
  with existing access to the system could exploit an argument injection 
  vulnerability in the APT backend. This allows specially crafted package names,
  which begin with a hyphen, to be misinterpreted as command options by apt-get.
  Successful exploitation could lead to remote code execution (RCE) with root 
  privileges, enabling the attacker to fully compromise the system's integrity, 
  confidentiality, and availability.
