title: A flaw was found in NetworkManager. This local privilege escalation 
  vulnerability exists in NetworkManager's dhclient backend when processing 
  malformed Manufacturer Usage Description (MUD) URLs. A local user can exploit 
  this flaw to escalate privileges by triggering a script via a crafted MUD URL,
  provided an administrator has explicitly configured NetworkManager to use 
  dhclient. This issue does not affect default configurations of NetworkManager.
