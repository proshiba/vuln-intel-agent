title: RabbitMQ is a messaging and streaming broker. Prior to 4.2.6, RabbitMQ 
  AMQP 0-9-1 allows an existing consumer to keep receiving messages after OAuth 
  token expiry or connection.update_secret refresh to reduced scopes because 
  existing consumers are not canceled or reauthorized at delivery time after the
  channel user state changes. This issue is fixed in version 4.2.6.
