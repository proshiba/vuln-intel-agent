title: The Klubraum Membership Request plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  `kr_mr_store_settings()` function in all versions up to, and including, 1.1.0.
  This makes it possible for unauthenticated attackers to update the plugin's 
  settings, including the Klubraum API token and introduction text, effectively 
  hijacking the plugin's integration with the Klubraum service.
