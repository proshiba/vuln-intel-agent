title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  buffer: hw-consumer: free scan_mask on buffer release\n\nThe scan_mask lifetime
  changed in commit 9a2e1233d38c (\"iio: buffer:\nhw-consumer: remove redundant scan_mask
  flexible array\").\n\nBefore that change, the scan mask storage was embedded in
  struct\nhw_consumer_buffer, so iio_hw_buf_release() could free the whole\nallocation
  with a single kfree(hw_buf).\n\nThat commit moved the scan mask to a separate bitmap_zalloc()
  allocation\nstored in buffer.scan_mask, but left iio_hw_buf_release() unchanged.\n\
  \nFree the scan mask in iio_hw_buf_release() before freeing the buffer\nwrapper."
