title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  subpage: keep TOWRITE tag until folio is cleaned\n\nbtrfs_subpage_set_writeback()
  calls folio_start_writeback() the first time\na folio is written back, and it also
  clears the PAGECACHE_TAG_TOWRITE tag\neven if there are still dirty blocks in the
  folio. This can break ordering\nguarantees, such as those required by btrfs_wait_ordered_extents().\n\
  \nThat ordering breakage leads to a real failure. For example, running\ngeneric/464
  on a zoned setup will hit the following ASSERT. This happens\nbecause the broken
  ordering fails to flush existing dirty pages before the\nfile size is truncated.\n\
  \n  assertion failed: !list_empty(&ordered->list) :: 0, in fs/btrfs/zoned.c:1899\n\
  \  ------------[ cut here ]------------\n  kernel BUG at fs/btrfs/zoned.c:1899!\n\
  \  Oops: invalid opcode: 0000 [#1] SMP NOPTI\n  CPU: 2 UID: 0 PID: 1906169 Comm:
  kworker/u130:2 Kdump: loaded Not tainted 6.16.0-rc6-BTRFS-ZNS+ #554 PREEMPT(voluntary)\n\
  \  Hardware name:"
