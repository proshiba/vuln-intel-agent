title: Artica Proxy before 4.50.000000 Service Pack 7 (fixed in hotfix 
  20260724-02) contains a session fixation vulnerability that allows 
  unauthenticated attackers to hijack administrative sessions by setting a known
  PHPSESSID on a victim's browser prior to authentication. Attackers can pre-set
  a controlled session identifier and wait for a victim to authenticate through 
  fw.login.php, after which the attacker gains a fully authenticated 
  administrative session on port 9000.
