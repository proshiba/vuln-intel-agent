title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfix
  a couple of races in MNT_TREE_BENEATH handling by do_move_mount()\n\nNormally do_lock_mount(path,
  _) is locking a mountpoint pinned by\n*path and at the time when matching unlock_mount()
  unlocks that\nlocation it is still pinned by the same thing.\n\nUnfortunately, for
  'beneath' case it's no longer that simple -\nthe object being locked is not the
  one *path points to.  It's the\nmountpoint of path->mnt.  The thing is, without
  sufficient locking\n->mnt_parent may change under us and none of the locks are held\n\
  at that point.  The rules are\n\t* mount_lock stabilizes m->mnt_parent for any mount
  m.\n\t* namespace_sem stabilizes m->mnt_parent, provided that\nm is mounted.\n\t
  * if either of the above holds and refcount of m is positive,\nwe are guaranteed
  the same for refcount of m->mnt_parent.\n\nnamespace_sem nests inside inode_lock(),
  so do_lock_mount() has\nto take inode_lock() before grabbing namespace_sem.  It
  does\nrecheck that path-"
