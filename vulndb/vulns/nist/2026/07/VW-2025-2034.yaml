title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Fix uninitialized memcache pointer in user_mem_abort()\n\nCommit fce886a60207
  (\"KVM: arm64: Plumb the pKVM MMU in KVM\") made the\ninitialization of the local
  memcache variable in user_mem_abort()\nconditional, leaving a codepath where it
  is used uninitialized via\nkvm_pgtable_stage2_map().\n\nThis can fail on any path
  that requires a stage-2 allocation\nwithout transition via a permission fault or
  dirty logging.\n\nFix this by making sure that memcache is always valid."
