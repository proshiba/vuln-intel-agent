title: CodeIgniter is a PHP full-stack web framework. Prior to 4.7.4, the 
  is_image and mime_in upload validation rules do not independently enforce a 
  safe client filename extension, allowing a remote attacker to upload 
  executable content when an application preserves the client filename and 
  stores uploads in a web-accessible script-enabled directory. Applications are 
  impacted when they validate uploads using is_image or mime_in without an 
  independent safe extension check (such as ext_in on patched versions), save 
  uploaded files using the client-supplied filename, and place uploads in a 
  web-accessible directory where PHP files can execute. This issue is fixed in 
  version 4.7.4.
