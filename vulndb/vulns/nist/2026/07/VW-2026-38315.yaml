title: LazyOwn RedTeam/APT Framework is an AI-powered C2 and red-team operations
  framework. Prior to 0.2.154, LazyOwn's lazyc2.py registers an unauthenticated 
  Socket.IO input event handler that dispatches data.get('value') to 
  LazyOwnShell.one_cmd, reaching LazyOwnShell.do_cmd and 
  subprocess.call(command, shell=True), allowing unauthenticated remote code 
  execution in the C2 process. This issue is fixed in 0.2.154.
