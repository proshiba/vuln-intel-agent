title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: reject overflowing copy + len in bpf_msg_push_data()\n\nWhen the scatterlist
  ring is full or nearly full, bpf_msg_push_data()\nenters a copy fallback path and
  computes copy + len for the page\nallocation size. Since len comes from BPF with
  arg3_type = ARG_ANYTHING\nand both are u32, a crafted len can wrap the sum to a
  small value,\ncausing an undersized allocation followed by an out-of-bounds memcpy.\n\
  \n BUG: unable to handle page fault for address: ffffed104089a402\n Oops: Oops:
  0000 [#1] SMP KASAN NOPTI\n Call Trace:\n  __asan_memcpy (mm/kasan/shadow.c:105)\n\
  \  bpf_msg_push_data (net/core/filter.c:2852 net/core/filter.c:2788)\n  bpf_prog_9ed8b5711920a7d7+0x2e/0x36\n\
  \  sk_psock_msg_verdict (net/core/skmsg.c:934)\n  tcp_bpf_sendmsg (net/ipv4/tcp_bpf.c:421
  net/ipv4/tcp_bpf.c:584)\n  __sys_sendto (net/socket.c:2206)\n  do_syscall_64 (arch/x86/entry/syscall_64.c:94)\n\
  \  entry_SYSCALL_64_after_hwframe (arch/x86/entry/entry_64.S:"
