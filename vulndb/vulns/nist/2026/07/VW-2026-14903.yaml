  Answer.\n\nThis issue affects Apache Answer: through 2.0.0.\n\nPreviously issued
  administrative tokens were not invalidated after an administrator account was suspended,
  deleted, or deactivated, allowing continued access to administrative APIs until
  the token expired.\nUsers are recommended to upgrade to version 2.0.1, which fixes
