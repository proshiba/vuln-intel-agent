title: "The Zephyr Bluetooth GATT client CCC-write response handler gatt_write_ccc_rsp()
  in subsys/bluetooth/host/gatt.c invoked the application's params->subscribe() callback
  after it had already called params->notify(conn, params, NULL, 0).\n\nPer the public
  GATT API, a notify callback with NULL data is the documented signal that the subscription
  has terminated and the bt_gatt_subscribe_params struct may be freed or reused by
  the application; calling subscribe() on the struct afterwards is a use-after-free,
  including an indirect call through the freed params->subscribe function pointer.\n\
  \nThe error branch is remotely (adjacent) reachable: a Zephyr device acting as a
  GATT client that calls bt_gatt_subscribe() can be driven into this ordering when
  a connected GATT server peer answers the CCC write with an ATT Error Response (the
  peer-supplied error code flows through att_error_rsp -> att_handle_rsp into gatt_write_ccc_rsp).\n\
