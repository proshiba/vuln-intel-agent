title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  mcast: fix data-race in ipv6_mc_down / mld_ifc_work\n\nidev->mc_ifc_count can be
  written over without proper locking.\n\nOriginally found by syzbot [1], fix this
  issue by encapsulating calls\nto mld_ifc_stop_work() (and mld_gq_stop_work() for
  good measure) with\nmutex_lock() and mutex_unlock() accordingly as these functions\n\
  should only be called with mc_lock per their declarations.\n\n[1]\nBUG: KCSAN: data-race
  in ipv6_mc_down / mld_ifc_work\n\nwrite to 0xffff88813a80c832 of 1 bytes by task
  3771 on cpu 0:\n mld_ifc_stop_work net/ipv6/mcast.c:1080 [inline]\n ipv6_mc_down+0x10a/0x280
  net/ipv6/mcast.c:2725\n addrconf_ifdown+0xe32/0xf10 net/ipv6/addrconf.c:3949\n addrconf_notify+0x310/0x980\n\
  \ notifier_call_chain kernel/notifier.c:93 [inline]\n raw_notifier_call_chain+0x6b/0x1c0
  kernel/notifier.c:461\n __dev_notify_flags+0x205/0x3d0\n dev_change_flags+0xab/0xd0
  net/core/dev.c:8685\n do_setlink+0x9f6/0x2430 net/core/rtnetlink.c:2916\n rtn"
