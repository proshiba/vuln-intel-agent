title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Keep dynamic inner array lookups nullable\n\nAn ARRAY_OF_MAPS can use an array created
  with BPF_F_INNER_MAP as its\ninner map template. A concrete inner array with a different
  max_entries\nvalue can then replace the template.\n\nAfter a successful outer map
  lookup, the verifier represents the\nresulting map pointer using the inner map template.
  Const-key lookup\nnullness elision consequently uses the template max_entries even
  though\nthe runtime helper uses the concrete inner map max_entries.\n\nDo not elide
  lookup result nullness for maps marked with BPF_F_INNER_MAP,\nbecause the template
  max_entries does not prove that the key is in bounds\nfor the concrete runtime map."
