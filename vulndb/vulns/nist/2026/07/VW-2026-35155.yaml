title: Mesop is a Python-based UI framework that allows users to build web 
  applications. From version 1.2.3 to before version 1.2.5, an uncontrolled 
  resource consumption vulnerability exists in the WebSocket implementation of 
  the Mesop framework. An unauthenticated attacker can send a rapid succession 
  of WebSocket messages, forcing the server to spawn an unbounded number of 
  operating system threads. This leads to thread exhaustion and Out of Memory 
  (OOM) errors, causing a complete Denial of Service (DoS) for any application 
  built on the framework. This issue has been patched in version 1.2.5.
