title: "Improper Input Validation vulnerability in Apache Tomcat.\n\nThis issue affects
  Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from
  9.0.0.M1 through 9.0.117, from 10.0.0-M1 through 10.0.27.\nOlder, end of support
  versions may also be affected.\n\nUsers are recommended to upgrade to version [FIXED_VERSION],
  which fixes the issue."
