title: In epa4all, prior to version 2026-05-20, an attacker on the network path 
  between epa4all and any backend (ePA Aktensystem, Konnektor, IDP, TSS) can 
  present a self-signed TLS certificate and intercept the connection. For 
  non-VAU connections (Konnektor, IDP), this allows direct read and modification
  of the inner traffic, including smartcard operations and OIDC authentication 
  exchanges. For the ePA backend, the disabled TLS verification is the 
  transport-level enabler for the VAU MITM described in GHSA-vvh7-x6c7-46gh. 
  This issue has been patched in version 2026-05-20.
