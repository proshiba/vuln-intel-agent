title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/slub:
  avoid accessing metadata when pointer is invalid in object_err()\n\nobject_err()
  reports details of an object for further debugging, such as\nthe freelist pointer,
  redzone, etc. However, if the pointer is invalid,\nattempting to access object metadata
  can lead to a crash since it does\nnot point to a valid object.\n\nOne known path
  to the crash is when alloc_consistency_checks()\ndetermines the pointer to the allocated
  object is invalid because of a\nfreelist corruption, and calls object_err() to report
  it. The debug code\nshould report and handle the corruption gracefully and not crash
  in the\nprocess.\n\nIn case the pointer is NULL or check_valid_pointer() returns
  false for\nthe pointer, only print the pointer value and skip accessing metadata."
