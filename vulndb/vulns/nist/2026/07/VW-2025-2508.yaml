title: "In the Linux kernel, the following vulnerability has been resolved:\n\namd/amdkfd:
  enhance kfd process check in switch partition\n\ncurrent switch partition only check
  if kfd_processes_table is empty.\nkfd_prcesses_table entry is deleted in kfd_process_notifier_release,
  but\nkfd_process tear down is in kfd_process_wq_release.\n\nconsider two processes:\n\
  \nProcess A (workqueue) -> kfd_process_wq_release -> Access kfd_node member\nProcess
  B switch partition -> amdgpu_xcp_pre_partition_switch -> amdgpu_amdkfd_device_fini_sw\n\
  -> kfd_node tear down.\n\nProcess A and B may trigger a race as shown in dmesg log.\n\
  \nThis patch is to resolve the race by adding an atomic kfd_process counter\nkfd_processes_count,
  it increment as create kfd process, decrement as\nfinish kfd_process_wq_release.\n\
  \nv2: Put kfd_processes_count per kfd_dev, move decrement to kfd_process_destroy_pdds\n\
  and bug fix. (Philip Yang)\n\n[3966658.307702] divide error: 0000 [#1] SMP NOPTI\n\
  [3966658.350818]  i10nm_edac\n[3966658.356318] CPU: 124 PID: 38"
