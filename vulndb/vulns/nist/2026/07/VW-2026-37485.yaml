  e424054000878 (\"MIPS: Tracing: Reduce the overhead of\ndynamic Function Tracer\"\
  ), the macro UASM_i_LA_mostly has been used,\nand this macro can generate more than
  2 instructions. At the same\ntime, the code in ftrace assumes that no more than
  2 instructions can\nbe generated, which is why it stores them in an int[2] array.
