title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  letsketch: fix UAF on inrange_timer at driver unbind\n\nletsketch_driver does not
  provide a .remove callback, but\nletsketch_probe() arms a per-device timer:\n\n\
  \    timer_setup(&data->inrange_timer, letsketch_inrange_timeout, 0);\n\nThe timer
  is re-armed from letsketch_raw_event() with a 100 ms\ntimeout on every pen-in-range
  report, and its callback dereferences\ndata->input_tablet to deliver a synthetic
  BTN_TOOL_PEN release.\n\nletsketch_data is allocated with devm_kzalloc(), and its
  input_dev\nfields are devm-allocated via letsketch_setup_input_tablet().  On\ndevice
  unbind (USB unplug or rmmod), the HID core runs its default\nteardown and devm cleanup
  frees both letsketch_data and the input\ndevices.  Because no .remove callback exists,
  nothing drains the\ntimer first: if raw_event armed it within ~100 ms of the unbind,\n\
  the pending timer fires on freed memory.  This is a UAF read of\ndata and of data->input_tablet,
  followed by "
