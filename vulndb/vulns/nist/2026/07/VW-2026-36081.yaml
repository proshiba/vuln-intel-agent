title: "In the Linux kernel, the following vulnerability has been resolved:\n\nproc:
  protect ptrace_may_access() with exec_update_lock (part 1)\n\nFix the easy cases
  where procfs currently calls ptrace_may_access() without\nexec_update_lock protection,
  where the fix is to simply add the extra lock\nor use mm_access():\n\n - do_task_stat():
  grab exec_update_lock\n - proc_pid_wchan(): grab exec_update_lock\n - proc_map_files_lookup():
  use mm_access() instead of get_task_mm()\n - proc_map_files_readdir(): use mm_access()
  instead of get_task_mm()\n - proc_ns_get_link(): grab exec_update_lock\n - proc_ns_readlink():
  grab exec_update_lock"
