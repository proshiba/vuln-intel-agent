title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  pcc: fix use-after-free and double free in _OSC evaluation\n\npcc_cpufreq_do_osc()
  calls acpi_evaluate_object() twice for the\ntwo-phase _OSC negotiation. Between
  the two calls it freed\noutput.pointer but left output.length unchanged. Since\n\
  acpi_evaluate_object() treats a non-zero length with a non-NULL\npointer as an existing
  buffer to write into, the second call wrote\ninto freed memory (use-after-free).
  The subsequent kfree(output.pointer)\nat out_free then freed the same pointer a
  second time (double free).\n\nReset output.pointer to NULL and output.length to
  ACPI_ALLOCATE_BUFFER\nafter freeing the first result, so ACPICA allocates a fresh
  buffer for\neach phase independently."
