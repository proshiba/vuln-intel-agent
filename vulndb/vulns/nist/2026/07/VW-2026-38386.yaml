title: The Realtyna Organic IDX plugin + WPL Real Estate plugin for WordPress is
  vulnerable to Arbitrary File Upload in all versions up to, and including, 
  5.2.0 via the upload function. This is due to missing file type validation in 
  the upload function, combined with a publicly accessible I/O endpoint 
  authenticated solely by static, plugin-seeded API credentials that are 
  identical across all installations. This makes it possible for unauthenticated
  attackers to upload files that may be executable, which makes remote code 
  execution possible. The WPL I/O service endpoint is registered on the public 
  WordPress init hook with no WordPress capability check, and the required 
  api_key and api_secret values are static defaults seeded by the plugin's own 
  SQL migration files, meaning any unauthenticated attacker who knows these 
  publicly documented defaults can reach and exploit the vulnerable upload path.
