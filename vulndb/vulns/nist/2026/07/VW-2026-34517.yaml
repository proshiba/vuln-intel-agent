title: Multiple security vulnerabilities in Snowflake libsnowflakeclient 
  versions prior to 2.9.2 could allow remote code execution and credential 
  exfiltration. A stack-based buffer overflow in the file download path could 
  allow remote code execution on a victim host. An attacker could exploit this 
  by uploading a file with a crafted encryption metadata field to a shared 
  internal stage that a victim process later downloads, and impact would be 
  limited to deployments where principals with different privilege levels share 
  the same internal stage. A related out-of-bounds write in the same download 
  path could allow memory corruption with attacker-controlled write primitives. 
