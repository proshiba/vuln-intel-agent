title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  don't wrap around quota ids in dqiterate\n\nLOLLM noticed that q_id is an unsigned
  32-bit variable.  If it happens\nto be set to XFS_DQ_ID_MAX due to a filesystem
  that actually has a dquot\nfor ID_MAX, then this addition will truncate to zero
  and the iteration\nstarts over.  Fix this by casting to u64."
