title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  make a fuse_req on SQE commit only findable after memcpy\n\nBad userspace might
  try to trick us and send commit SQEs request\nunique / commit-id of requests that
  are not even send to\nfuse-server (io_uring_cmd_done() not called) yet.\n\nfuse_uring_commit_fetch()
  ends the fuse request when the ring entry\nhas a wrong state, but that could have
  caused a use-after-free\nwith the memcpy operations in fuse_uring_send_in_task().\n\
  In order to avoid such races the call of fuse_uring_add_to_pq()\nis moved after
  the copy operations and just before completing\nthe io-uring request - malicious
  userspace cannot find the request\nanymore until all prepration work in fuse-client/kernel
  is completed.\n\nThis also moves fuse_uring_add_to_pq() a bit up in the code to\n\
  avoid a forward declaration. Also not with a preparation commit,\nto make it easier
  to back port to older kernels."
