title: "MSI Center NTIOLib_X64 Origin Validation Error Local Privilege Escalation
  Vulnerability. This vulnerability allows local attackers to escalate privileges
  on affected installations of MSI Center. An attacker must first obtain the ability
  to execute low-privileged code on the target system in order to exploit this vulnerability.\n\
  \nThe specific flaw exists within the NTIOLib_X64.sys driver. The issue results
  from insufficient validation of the origin of commands. An attacker can leverage
  this vulnerability to escalate privileges and execute arbitrary code in the context
  of SYSTEM. Was ZDI-CAN-28935."
