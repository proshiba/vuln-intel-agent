title: "In the Linux kernel, the following vulnerability has been resolved:\n\nzram:
  fix slot write race condition\n\nParallel concurrent writes to the same zram index
  result in leaked\nzsmalloc handles.  Schematically we can have something like this:\n\
  \nCPU0                              CPU1\nzram_slot_lock()\nzs_free(handle)\nzram_slot_lock()\n\
  \t\t\t\tzram_slot_lock()\n\t\t\t\tzs_free(handle)\n\t\t\t\tzram_slot_lock()\n\n\
  compress\t\t\tcompress\nhandle = zs_malloc()\t\thandle = zs_malloc()\nzram_slot_lock\n\
  zram_set_handle(handle)\nzram_slot_lock\n\t\t\t\tzram_slot_lock\n\t\t\t\tzram_set_handle(handle)\n\
  \t\t\t\tzram_slot_lock\n\nEither CPU0 or CPU1 zsmalloc handle will leak because
  zs_free() is done\ntoo early.  In fact, we need to reset zram entry right before
  we set its\nnew handle, all under the same slot lock scope."
