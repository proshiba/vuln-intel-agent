title: The Kirki  WordPress plugin before 6.0.13 does not restrict which classes
  may be instantiated when it deserialises data that unauthenticated users can 
  store, leading to PHP Object Injection that is triggered when an administrator
  later reviews the stored data. With a suitable gadget chain present on the 
  site (via another installed Kirki  WordPress plugin before 6.0.13, , or an 
  outdated WordPress version), this could be leveraged to perform a variety of 
  attacks, such as remote code execution.
