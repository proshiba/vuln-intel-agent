title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  use opener credentials for delete-on-close\n\nDelete-on-close can be completed by
  deferred or durable handle teardown,\nwhere no request work is available. Both the
  base-file unlink and the ADS\nxattr removal consequently run with the ksmbd worker
  credentials and can\nbypass filesystem permission checks.\n\nRun both operations
  with the credentials captured in struct file when the\nhandle was opened. This preserves
  the authenticated user's fsuid, fsgid,\nsupplementary groups and capability restrictions
  at final close."
