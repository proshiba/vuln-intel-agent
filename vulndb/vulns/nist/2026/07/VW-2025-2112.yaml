title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexfat:
  fix double free in delayed_free\n\nThe double free could happen in the following
  path.\n\nexfat_create_upcase_table()\n        exfat_create_upcase_table() : return
  error\n        exfat_free_upcase_table() : free ->vol_utbl\n        exfat_load_default_upcase_table
  : return error\n     exfat_kill_sb()\n           delayed_free()\n              \
  \    exfat_free_upcase_table() <--------- double free\nThis patch set ->vol_util
  as NULL after freeing it."
