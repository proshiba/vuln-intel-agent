title: "The StoreGrowth: Smart Sales Booster for WooCommerce | BOGO, Upsells, Direct
  Checkout, Quick View, Side Cart plugin for WordPress is vulnerable to Stored Cross-Site
  Scripting via the 'message_popup' parameter in all versions up to, and including,
  2.1.0 due to insufficient input sanitization and output escaping. This makes it
  possible for unauthenticated attackers to inject arbitrary web scripts in pages
  that will execute whenever a user accesses an injected page. The exploit is possible
  because the 'ajd_protected' nonce required by the create_popup handler is exposed
  to all unauthenticated frontend visitors via wp_localize_script under bogo_save_url.ajd_nonce,
  effectively bypassing the nonce-only access control."
