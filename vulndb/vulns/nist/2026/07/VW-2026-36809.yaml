title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qualcomm: rmnet: validate MAP frame length before ingress parsing\n\nWhen ingress
  deaggregation is disabled, rmnet_map_ingress_handler() passes\nthe skb straight
  to __rmnet_map_ingress_handler(), skipping the length\nvalidation that rmnet_map_deaggregate()
  performs on the aggregated path.\nThe parser then dereferences the MAP header and
  csum header/trailer based on\nthe on-wire pkt_len without checking skb->len, so
  a short frame is read out\nof bounds:\n\n  BUG: KASAN: slab-out-of-bounds in rmnet_map_checksum_downlink_packet\n\
  \  Read of size 1 at addr ffff88801118ed00 by task exploit/147\n  Call Trace:\n\
  \   ...\n   rmnet_map_checksum_downlink_packet (drivers/net/ethernet/qualcomm/rmnet/rmnet_map_data.c:413)\n\
  \   __rmnet_map_ingress_handler (drivers/net/ethernet/qualcomm/rmnet/rmnet_handlers.c:96)\n\
  \   rmnet_rx_handler (drivers/net/ethernet/qualcomm/rmnet/rmnet_handlers.c:129)\n\
  \   __netif_receive_skb_core.constprop.0 (net/core/dev.c:"
