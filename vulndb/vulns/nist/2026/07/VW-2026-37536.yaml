title: MCP Ruby SDK is the official Ruby SDK for Model Context Protocol servers 
  and clients. Prior to 0.23.0, MCP::Server::Transports::StreamableHTTPTransport
  in the mcp gem does not expire sessions by default, so repeated initialize 
  requests retain unbounded ServerSession objects and can exhaust process 
  memory. This issue is fixed in version 0.23.0.
