title: CodeIgniter is a PHP full-stack web framework. Prior to 4.7.4, calling 
  UploadedFile::move() without a second argument uses the client-provided 
  filename without sanitization, allowing a remote attacker to use path 
  traversal sequences to write uploaded content outside the intended directory 
  when the application exposes an upload path. This issue is fixed in version 
  4.7.4.
