title: An insufficient granularity of access control vulnerability exists in 
  PingIDM (formerly ForgeRock Identity Management) where administrators cannot 
  properly configure access rules for Remote Connector Servers (RCS) running in 
  client mode. This means attackers can spoof a client-mode RCS (if one exists) 
  to intercept and/or modify an identity’s security-relevant properties, such as
  passwords and account recovery information. This issue is exploitable only 
  when an RCS is configured to run in client mode.
