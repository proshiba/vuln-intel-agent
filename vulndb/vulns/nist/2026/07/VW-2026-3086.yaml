  vulnerability in the DAAP login handler that allows unauthenticated attackers 
  to crash the server by exploiting unsynchronized access to the global DAAP 
  session list. Attackers can flood the DAAP /login endpoint with concurrent 
  requests to trigger a remote denial of service condition without requiring 
  authentication.
