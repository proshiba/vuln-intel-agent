title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio/mlx5:
  Fix racy bitfields and tighten struct layout\n\nBitfield operations are not atomic,
  they use a read-modify-write\npattern, therefore we should be careful not to pack
  bitfields that\ncan be concurrently updated into the same storage unit.\n\nThis
  split takes a binary approach: flags that are only modified\npre/post open/close
  remain bitfields, flags modified from user\naction, including actions that reach
  across to another device (ex.\nreset) use dedicated storage units.\n\nNote mlx5_vhca_page_tracker.status
  is relocated to fill the alignment\nhole this split exposes.\n\nBitfield justifications:\n\
  \n  migrate_cap: written only in mlx5vf_cmd_set_migratable() at probe\n  chunk_mode:
  written only in mlx5vf_cmd_set_migratable() at probe\n  mig_state_cap: written only
  in mlx5vf_cmd_set_migratable() at probe\n\nDedicated storage units:\n\n  mdev_detach:
  written in the VF attach/detach event notifier\n               mlx5fv_vf_event()
  at r"
