title: A signed integer overflow in the PCP __pmGetPDU() function can be 
  exploited via crafted network packets during PDU processing or SASL 
  negotiation. This permanently blinds the affected daemon, resulting in a total
  denial of service (DoS) for subsequent packet reads.
