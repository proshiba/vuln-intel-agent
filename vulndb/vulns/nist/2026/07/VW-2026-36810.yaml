title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  validate STALE_COOKIE cause length before reading staleness\n\nWhen an ERROR chunk
  with a STALE_COOKIE cause is received in the\nCOOKIE_ECHOED state, sctp_sf_do_5_2_6_stale()
  reads the 4-byte Measure\nof Staleness that follows the cause header:\n\n\terr \
  \  = (struct sctp_errhdr *)(chunk->skb->data);\n\tstale = ntohl(*(__be32 *)((u8
  *)err + sizeof(*err)));\n\nerr is the first cause in the chunk, not the STALE_COOKIE
  cause that\ncaused the dispatch, and nothing guarantees the staleness field is\n\
  present. sctp_walk_errors() only requires a cause to be as long as the\n4-byte header,
  so for a STALE_COOKIE cause of length 4 the read runs\npast the cause, and for a
  minimal ERROR chunk past skb->tail. The value\nis echoed to the peer in the Cookie
  Preservative of the reply INIT,\nleaking uninitialized memory.\n\nsctp_sf_cookie_echoed_err()
  already walks to the STALE_COOKIE cause, so\ncheck its length there and pass it
  to sctp_sf_do_5_2_6_st"
