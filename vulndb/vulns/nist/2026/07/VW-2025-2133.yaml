title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  serial: uartlite: register uart driver in init\n\nWhen two instances of uart devices
  are probing, a concurrency race can\noccur. If one thread calls uart_register_driver
  function, which first\nallocates and assigns memory to 'uart_state' member of uart_driver\n\
  structure, the other instance can bypass uart driver registration and\ncall ulite_assign.
  This calls uart_add_one_port, which expects the uart\ndriver to be fully initialized.
  This leads to a kernel panic due to a\nnull pointer dereference:\n\n[    8.143581]
  BUG: kernel NULL pointer dereference, address: 00000000000002b8\n[    8.156982]
  #PF: supervisor write access in kernel mode\n[    8.156984] #PF: error_code(0x0002)
  - not-present page\n[    8.156986] PGD 0 P4D 0\n...\n[    8.180668] RIP: 0010:mutex_lock+0x19/0x30\n\
  [    8.188624] Call Trace:\n[    8.188629]  ? __die_body.cold+0x1a/0x1f\n[    8.195260]\
  \  ? page_fault_oops+0x15c/0x290\n[    8.209183]  ? __irq_resolve_mapping+0"
