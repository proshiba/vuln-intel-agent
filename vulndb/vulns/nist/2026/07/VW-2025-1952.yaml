title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  allow SC_STATUS_FREEABLE when searching via nfs4_lookup_stateid()\n\nThe pynfs DELEG8
  test fails when run against nfsd. It acquires a\ndelegation and then lets the lease
  time out. It then tries to use the\ndeleg stateid and expects to see NFS4ERR_DELEG_REVOKED,
  but it gets\nbad NFS4ERR_BAD_STATEID instead.\n\nWhen a delegation is revoked, it's
  initially marked with\nSC_STATUS_REVOKED, or SC_STATUS_ADMIN_REVOKED and later,
  it's marked\nwith the SC_STATUS_FREEABLE flag, which denotes that it is waiting
  for\ns FREE_STATEID call.\n\nnfs4_lookup_stateid() accepts a statusmask that includes
  the status\nflags that a found stateid is allowed to have. Currently, that mask\n\
  never includes SC_STATUS_FREEABLE, which means that revoked delegations\nare (almost)
  never found.\n\nAdd SC_STATUS_FREEABLE to the always-allowed status flags, and remove
  it\nfrom nfsd4_delegreturn() since it's now always implied."
