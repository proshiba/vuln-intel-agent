title: A security vulnerability has been detected in griptape-ai griptape 
  0.19.4. Affected by this vulnerability is the function 
  load_files_from_disk/list_files_from_disk/save_content_to_file/save_memory_artifacts_to_disk
  of the component FileManagerTool. Such manipulation leads to path traversal. 
  The attack may be performed from remote. The exploit has been disclosed 
  publicly and may be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
