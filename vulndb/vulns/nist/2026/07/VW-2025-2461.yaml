title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm,
  swap: fix potential UAF issue for VMA readahead\n\nSince commit 78524b05f1a3 (\"\
  mm, swap: avoid redundant swap device\npinning\"), the common helper for allocating
  and preparing a folio in the\nswap cache layer no longer tries to get a swap device
  reference\ninternally, because all callers of __read_swap_cache_async are already\n\
  holding a swap entry reference.  The repeated swap device pinning isn't\nneeded
  on the same swap device.\n\nCaller of VMA readahead is also holding a reference
  to the target entry's\nswap device, but VMA readahead walks the page table, so it
  might encounter\nswap entries from other devices, and call __read_swap_cache_async
  on\nanother device without holding a reference to it.\n\nSo it is possible to cause
  a UAF when swapoff of device A raced with\nswapin on device B, and VMA readahead
  tries to read swap entries from\ndevice A.  It's not easy to trigger, but in theory,
  it could cause real\nissues.\n\nMake VMA r"
