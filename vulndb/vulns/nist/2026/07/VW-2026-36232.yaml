title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix eswitch mode block underflow on IPsec acquire SA\n\nmlx5e_xfrm_add_state() handles
  acquire-flow temporary SAs by allocating\nsoftware state and skipping hardware offload
  setup.\n\nThat path jumps to the common success label before taking the eswitch
  mode\nblock. After tunnel-mode validation was moved earlier, the common success\n\
  label unconditionally calls mlx5_eswitch_unblock_mode(). For acquire SAs,\nthis
  decrements esw->offloads.num_block_mode without a matching increment.\n\nReturn
  directly after installing the acquire SA offload handle, so only the\npaths that
  successfully called mlx5_eswitch_block_mode() call the matching\nunblock."
