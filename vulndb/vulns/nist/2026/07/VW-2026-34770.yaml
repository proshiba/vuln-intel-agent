title: FastGPT is an AI Agent building platform. Prior to version 4.14.9.5, the 
  FastGPT HTTP tools testing endpoint (/api/core/app/httpTools/runTool) is 
  exposed without any authentication. This endpoint acts as a full HTTP proxy — 
  it accepts a user-supplied baseUrl, toolPath, HTTP method, custom headers, and
  body, then makes a server-side HTTP request and returns the complete response 
  to the caller. This issue has been patched in version 4.14.9.5.
