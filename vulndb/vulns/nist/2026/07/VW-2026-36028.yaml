  volume descriptor into a fixed-size\nstruct pvd and then scans its physical-partition-extent
  array:\n\n\tint numpps = be16_to_cpu(pvd->pp_count);\n\t...\n\tfor (i = 0; i < numpps;
  i += 1) {\n\t\tstruct ppe *p = pvd->ppe + i;\n\t\t...\n\t\tlp_ix = be16_to_cpu(p->lp_ix);\n\
  \npvd points at a single kmalloc()'d struct pvd whose ppe[] member holds a\nfixed
  ARRAY_SIZE(pvd->ppe) (1016) entries, but the loop runs up to the\non-disk pp_count.\
