title: A flaw was found in the Keycloak Admin REST API, which is used to manage 
  security realms and clients. The issue occurs when the system processes 
  requests for rotated client secrets that are stored in a secure vault. Due to 
  improper boundary enforcement, a delegated administrator with view-only 
  permissions can retrieve the actual resolved secret instead of the vault 
  placeholder, leading to the exposure of sensitive credentials.
