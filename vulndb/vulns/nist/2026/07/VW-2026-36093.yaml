title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix double-free in SMB2_flush() replay\n\nSMB2_flush() keeps its response
  buffer bookkeeping across replay\nattempts. If a replayable flush response is received
  and the retry then\nfails before cifs_send_recv() stores a replacement response,
  flush_exit\nwill free the stale response pointer a second time.\n\nReinitialize
  resp_buftype and rsp_iov at the top of the replay loop so\ncleanup only acts on
  response state produced by the current attempt.\nThis fixes a double-free without
  changing replay handling for successful\nrequests."
