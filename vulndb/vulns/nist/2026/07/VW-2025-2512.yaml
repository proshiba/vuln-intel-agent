title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/mediatek:
  Disable AFBC support on Mediatek DRM driver\n\nCommit c410fa9b07c3 (\"drm/mediatek:
  Add AFBC support to Mediatek DRM\ndriver\") added AFBC support to Mediatek DRM and
  enabled the\n32x8/split/sparse modifier.\n\nHowever, this is currently broken on
  Mediatek MT8188 (Genio 700 EVK\nplatform); tested using upstream Kernel and Mesa
  (v25.2.1), AFBC is used by\ndefault since Mesa v25.0.\n\nKernel trace reports vblank
  timeouts constantly, and the render is garbled:\n\n```\n[CRTC:62:crtc-0] vblank
  wait timed out\nWARNING: CPU: 7 PID: 70 at drivers/gpu/drm/drm_atomic_helper.c:1835
  drm_atomic_helper_wait_for_vblanks.part.0+0x24c/0x27c\n[...]\nHardware name: MediaTek
  Genio-700 EVK (DT)\nWorkqueue: events_unbound commit_work\npstate: 60400009 (nZCv
  daif +PAN -UAO -TCO -DIT -SSBS BTYPE=--)\npc : drm_atomic_helper_wait_for_vblanks.part.0+0x24c/0x27c\n\
  lr : drm_atomic_helper_wait_for_vblanks.part.0+0x24c/0x27c\nsp : ffff80008337bca0\n\
  x29: ffff8"
