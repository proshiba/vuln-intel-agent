  fix io-uring list corruption for terminated non-committed requests\n\nWhen a request
  is terminated before it has been committed, the request\nis not removed from the
  queue's list. This leaves a dangling list entry\nthat leads to list corruption and
  use-after-free issues.\n\nRemove the request from the queue's list for terminated
  non-committed\nrequests."
