title: A weakness has been identified in unitedbyai droidclaw up to 0.5.3. 
  Affected by this issue is some unknown functionality of the file 
  server/src/routes/goals.ts of the component Unsigned Scheduled Callback. This 
  manipulation causes authorization bypass. Remote exploitation of the attack is
  possible. The attack is considered to have high complexity. The exploitation 
  is known to be difficult. The exploit has been made available to the public 
  and could be used for attacks. The project was informed of the problem early 
  through an issue report but has not responded yet.
