title: Out-of-bounds Read (CWE-125) in BACnet packet parsing 
  (`bacdt_datetime_to_tod`) in Loytec LIP-ME201C, L-INX, L-GATE, L-ROC, L-IOB, 
  L-DALI, L-VIS and L-PAD through 8.4.18 on LINX-A64 allows an unauthenticated 
  remote attacker to crash `linx_a64.exe` and ultimately reboot the device via a
  malformed BACnet TimeSynchronization or UTC-TimeSynchronization packet with an
  invalid month value. The same vulnerability affects multiple other Loytec 
  products.
