title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsrcu:
  Don't queue workqueue handlers to never-online CPUs\n\nWhile an srcu_struct structure
  is in the midst of switching from CPU-0\nto all-CPUs state, it can attempt to invoke
  callbacks for CPUs that\nhave never been online.  Worse yet, it can attempt in invoke
  callbacks\nfor CPUs that never will be online, even including imaginary CPUs not
  in\ncpu_possible_mask.  This can cause hangs on s390, which is not set up to\ndeal
  with workqueue handlers being scheduled on such CPUs.  This commit\ntherefore causes
  Tree SRCU to refrain from queueing workqueue handlers\non CPUs that have not yet
  (and might never) come online.\n\nBecause callbacks are not invoked on CPUs that
  have not been\nonline, it is an error to invoke call_srcu(), synchronize_srcu(),
  or\nsynchronize_srcu_expedited() on a CPU that is not yet fully online.\nHowever,
