title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/secretmem:
  fix use-after-free race in fault handler\n\nWhen a page fault occurs in a secret
  memory file created with\n`memfd_secret(2)`, the kernel will allocate a new folio
  for it, mark the\nunderlying page as not-present in the direct map, and add it to
  the file\nmapping.\n\nIf two tasks cause a fault in the same page concurrently,
  both could end\nup allocating a folio and removing the page from the direct map,
  but only\none would succeed in adding the folio to the file mapping.  The task that\n\
  failed undoes the effects of its attempt by (a) freeing the folio again\nand (b)
  putting the page back into the direct map.  However, by doing\nthese two operations
  in this order, the page becomes available to the\nallocator again before it is placed
  back in the direct mapping.\n\nIf another task attempts to allocate the page between
  (a) and (b), and the\nkernel tries to access it via the direct map, it would result
  in a\nsupervisor not-pr"
