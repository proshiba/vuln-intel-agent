title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  cdev: make sure the cdev fd is still active before emitting events\n\nWith the final
  call to fput() on a file descriptor, the release action\nmay be deferred and scheduled
  on a work queue. The reference count of\nthat descriptor is still zero and it must
  not be used. It's possible\nthat a GPIO change, we want to notify the user-space
  about, happens\nAFTER the reference count on the file descriptor associated with
  the\ncharacter device went down to zero but BEFORE the .release() callback\nwas
  called from the workqueue and so BEFORE we unregistered from the\nnotifier.\n\n\
  Using the regular get_file() routine in this situation triggers the\nfollowing warning:\n\
  \n  struct file::f_count incremented from zero; use-after-free condition present!\n\
  \nSo use the get_file_active() variant that will return NULL on file\ndescriptors
  that have been or are being released."
