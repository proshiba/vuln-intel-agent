title: "A use-after-free vulnerability in the Linux kernel's netfilter: nf_tables
  component can be exploited to achieve local privilege escalation.\n\n\n\nDue to
  a race condition between nf_tables netlink control plane transaction and nft_set
  element garbage collection, it is possible to underflow the reference counter causing
  a use-after-free vulnerability.\n\n\n\nWe recommend upgrading past commit 3e91b0ebd994635df2346353322ac51ce84ce6d8."
