title: 'Vulnerability in the MySQL Router product of Oracle MySQL (component: Router:
  General).  Supported versions that are affected are 8.4.0-8.4.10 and  9.7.0-9.7.1.
  Difficult to exploit vulnerability allows unauthenticated attacker with network
  access via HTTP to compromise MySQL Router.  Successful attacks of this vulnerability
  can result in  unauthorized creation, deletion or modification access to critical
  data or all MySQL Router accessible data as well as  unauthorized access to critical
  data or complete access to all MySQL Router accessible data. CVSS 3.1 Base Score
  7.4 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N).'
