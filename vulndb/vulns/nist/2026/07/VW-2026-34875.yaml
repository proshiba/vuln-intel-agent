title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the AVideo CreatePlugin template for list.json.php does not include any 
  authentication or authorization check. While the companion templates 
  add.json.php and delete.json.php both require admin privileges, the 
  list.json.php template was shipped without this guard. Every plugin that uses 
  the CreatePlugin code generator inherits this omission, resulting in 21 
  unauthenticated data listing endpoints across the platform. These endpoints 
  expose sensitive data including user PII, payment transaction logs, IP 
  addresses, user agents, and internal system records. At time of publication, 
  there are no publicly available patches.
