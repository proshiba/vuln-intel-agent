title: Electron is a framework for writing cross-platform desktop applications 
  using JavaScript, HTML and CSS. Prior to versions 38.8.6, 39.8.0, 40.7.0, and 
  41.0.0-beta.8, an undocumented commandLineSwitches webPreference allowed 
  arbitrary switches to be appended to the renderer process command line. Apps 
  that construct webPreferences by spreading untrusted configuration objects may
  inadvertently allow an attacker to inject switches that disable renderer 
  sandboxing or web security controls. Apps are only affected if they construct 
  webPreferences from external or untrusted input without an allowlist. Apps 
  that use a fixed, hardcoded webPreferences object are not affected. This issue
  has been patched in versions 38.8.6, 39.8.0, 40.7.0, and 41.0.0-beta.8.
