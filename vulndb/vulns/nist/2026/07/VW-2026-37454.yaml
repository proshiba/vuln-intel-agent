title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm2-sessions:
  Fix out of range indexing in name_size\n\n'name_size' does not have any range checks,
  and it just directly indexes\nwith TPM_ALG_ID, which could lead into memory corruption
  at worst.\n\nAddress the issue by only processing known values and returning -EINVAL
  for\nunrecognized values.\n\nMake also 'tpm_buf_append_name' and 'tpm_buf_fill_hmac_session'
  fallible so\nthat errors are detected before causing any spurious TPM traffic.\n\
  \nEnd also the authorization session on failure in both of the functions, as\nthe
  session state would be then by definition corrupted."
