title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  detect invalid INLINE_DATA + EXTENTS flag combination\n\nsyzbot reported a BUG_ON
  in ext4_es_cache_extent() when opening a verity\nfile on a corrupted ext4 filesystem
  mounted without a journal.\n\nThe issue is that the filesystem has an inode with
  both the INLINE_DATA\nand EXTENTS flags set:\n\n    EXT4-fs error (device loop0):
  ext4_cache_extents:545: inode #15:\n    comm syz.0.17: corrupted extent tree: lblk
  0 < prev 66\n\nInvestigation revealed that the inode has both flags set:\n    DEBUG:
  inode 15 - flag=1, i_inline_off=164, has_inline=1, extents_flag=1\n\nThis is an
  invalid combination since an inode should have either:\n- INLINE_DATA: data stored
  directly in the inode\n- EXTENTS: data stored in extent-mapped blocks\n\nHaving
  both flags causes ext4_has_inline_data() to return true, skipping\nextent tree validation
  in __ext4_iget(). The unvalidated out-of-order\nextents then trigger a BUG_ON in
  ext4_es_cache_extent() due to int"
