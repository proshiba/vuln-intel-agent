title: Path traversal vulnerability in Apache Zeppelin. When 
  FileSystemNotebookRepo is configured, an authenticated attacker with 
  permission to rename a note, or access to folder operations, could supply 
  traversal segments in note or folder paths.                   Zeppelin 
  composed these values into filesystem paths using the server's filesystem or 
  Hadoop identity without ensuring that the result remained under the configured
  notebook directory. This could allow notebook files or directories to be 
  moved,                   written, or deleted outside the notebook root. This 
  issue affects Apache Zeppelin versions 0.9.0 through 0.12.0. Users are 
  recommended to upgrade to version 0.12.1, which fixes this issue.
