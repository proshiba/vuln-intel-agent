title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: restore set elements when delete set fails\n\nFrom abort path, nft_mapelem_activate()
  needs to restore refcounters to\nthe original state. Currently, it uses the set->ops->walk()
  to iterate\nover these set elements. The existing set iterator skips inactive\n\
  elements in the next generation, this does not work from the abort path\nto restore
  the original state since it has to skip active elements\ninstead (not inactive ones).\n\
  \nThis patch moves the check for inactive elements to the set iterator\ncallback,
  then it reverses the logic for the .activate case which\nneeds to skip active elements.\n\
  \nToggle next generation bit for elements when delete set command is\ninvoked and
  call nft_clear() from .activate (abort) path to restore the\nnext generation bit.\n\
  \nThe splat below shows an object in mappings memleak:\n\n[43929.457523] ------------[
  cut here ]------------\n[43929.457532] WARNING: CPU: 0 PID: 1139 at include/n"
