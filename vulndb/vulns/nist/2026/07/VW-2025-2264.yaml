title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: Add missing lock in cfg80211_check_and_end_cac()\n\nCallers of wdev_chandef()
  must hold the wiphy mutex.\n\nBut the worker cfg80211_propagate_cac_done_wk() never
  takes the lock.\nWhich triggers the warning below with the mesh_peer_connected_dfs\n\
  test from hostapd and not (yet) released mac80211 code changes:\n\nWARNING: CPU:
