title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  avoid data corruption on cq descriptor number\n\nSince commit 30f241fcf52a (\"xsk:
  Fix immature cq descriptor\nproduction\"), the descriptor number is stored in skb
  control block and\nxsk_cq_submit_addr_locked() relies on it to put the umem addrs
  onto\npool's completion queue.\n\nskb control block shouldn't be used for this purpose
  as after transmit\nxsk doesn't have control over it and other subsystems could use
  it. This\nleads to the following kernel panic due to a NULL pointer dereference.\n\
  \n BUG: kernel NULL pointer dereference, address: 0000000000000000\n #PF: supervisor
  read access in kernel mode\n #PF: error_code(0x0000) - not-present page\n PGD 0
  P4D 0\n Oops: Oops: 0000 [#1] SMP NOPTI\n CPU: 2 UID: 1 PID: 927 Comm: p4xsk.bin
  Not tainted 6.16.12+deb14-cloud-amd64 #1 PREEMPT(lazy)  Debian 6.16.12-1\n Hardware
  name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.17.0-debian-1.17.0-1 04/01/2014\n\
  \ RIP: 0010:xsk_destruct_skb+0xd"
