title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip_tunnel:
  adapt iptunnel_xmit_stats() to NETDEV_PCPU_STAT_DSTATS\n\nBlamed commits forgot
  that vxlan/geneve use udp_tunnel[6]_xmit_skb() which\ncall iptunnel_xmit_stats().\n\
  \niptunnel_xmit_stats() was assuming tunnels were only using\nNETDEV_PCPU_STAT_TSTATS.\n\
  \n@syncp offset in pcpu_sw_netstats and pcpu_dstats is different.\n\n32bit kernels
  would either have corruptions or freezes if the syncp\nsequence was overwritten.\n\
  \nThis patch also moves pcpu_stat_type closer to dev->{t,d}stats to avoid\na potential
  cache line miss since iptunnel_xmit_stats() needs to read it."
