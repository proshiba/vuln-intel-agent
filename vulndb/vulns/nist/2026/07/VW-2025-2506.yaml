title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/radeon:
  Do not kfree() devres managed rdev\n\nSince the allocation of the drivers main structure
  was changed to\ndevm_drm_dev_alloc() rdev is managed by devres and we shouldn't
  be calling\nkfree() on it.\n\nThis fixes things exploding if the driver probe fails
  and devres cleans up\nthe rdev after we already free'd it.\n\n(cherry picked from
  commit 16c0681617b8a045773d4d87b6140002fa75b03b)"
