title: The PickPlugins Question Answer plugin for WordPress is vulnerable to SQL
  Injection in versions up to and including 1.2.73. This is due to insufficient 
  sanitization of user-supplied input via the 'id' GET parameter in the user 
  profile template combined with the use of wp_unslash() which removes 
  WordPress's magic quotes protection, followed by direct concatenation into a 
  SQL query without proper escaping or prepared statements in the 
  qa_user_profile_card() function. This makes it possible for unauthenticated 
  attackers to append additional SQL queries into existing queries, which can be
  used to extract sensitive information from the database.
