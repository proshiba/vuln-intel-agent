title: "The Spring Boot language server logs the raw value of the https_proxy/HTTPS_PROXY/http_proxy/HTTP_PROXY
  environment variable at INFO level whenever it creates an outbound HTTP client and
  no explicit http.proxy workspace setting is configured. Corporate proxy URLs frequently
  embed Basic-auth credentials in the form http://user:pass@proxy:8080, and the language
  server writes this value to its log file without any redaction. Since language server
  log files are often attached to bug reports or are readable by other local users/processes,
  this can result in disclosure of proxy credentials.\nAffected Spring Products and
  Versions:\nSpring Tools for Eclipse: 5.2.0 and earlier\nSpring Tools for VSCode
  / Cursor / Theia: 2.2.0 and earlier"
