title: Knot DNS before 3.4.10 and 3.5.x before 3.5.4 contains a vulnerability in
  mod-onlinesign where the next NSEC owner name can be computed incorrectly. 
  This can create an overly broad authenticated denial interval, allowing 
  downstream validating resolvers using aggressive negative caching to 
  synthesize negative answers for legitimate names and causing resolver-side 
  denial of service.
