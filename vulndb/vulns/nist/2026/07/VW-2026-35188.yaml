title: The WP Shortcodes Plugin - Shortcodes Ultimate plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via the su_carousel shortcode in all
  versions up to, and including, 7.4.8. This is due to insufficient input 
  sanitization and output escaping in the 'su_slide_link' attachment meta field.
  This makes it possible for authenticated attackers, with author level access 
  and above, to inject arbitrary web scripts in pages that will execute whenever
  a user accesses an injected page.
