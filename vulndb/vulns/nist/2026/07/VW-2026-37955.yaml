title: "A format string vulnerability was found in the Internal Backup on the ADM.
  The vulnerability occurs because user-controlled task input may be included in an
  error response and processed through an unsafe format string operation. An authenticated
  attacker can exploit this issue to disclose memory information or cause denial of
  service of the affected CGI process.\nAffected products and versions include: from
  ADM 4.1.0 through ADM 4.3.3.RUN1 as well as from ADM 5.0.0 through ADM 5.1.3.RI81."
