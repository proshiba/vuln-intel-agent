title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: consume only present negotiated TTLM maps\n\nieee80211_tid_to_link_map_size_ok()
  validates negotiated TTLM elements\nagainst the number of link-map entries indicated
  by link_map_presence.\nieee80211_parse_neg_ttlm() must consume the same layout.\n\
  \nThe parser advanced its cursor for every TID, including TIDs whose\npresence bit
  is clear and therefore have no map bytes in the element.\nA sparse map can then
  make a later present TID read past the validated\nelement.\n\nThe bad bytes land
  in neg_ttlm->{up,down}link[tid] but are gated by\nvalid_links before being applied
  to driver state, so a peer cannot\nturn the read into a policy change.  Under KUnit
  + KASAN with an\nexact-sized element allocation the OOB read is reported as a\n\
  slab-out-of-bounds; whether the same trigger fires under the\nproduction RX path
  depends on surrounding allocator state.\n\nAdvance the cursor only when the current
  TID has a map present."
