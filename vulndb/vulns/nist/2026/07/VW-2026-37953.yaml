title: The Improved Save Button plugin for WordPress is vulnerable to 
  second-order SQL Injection via 'meta_key' Custom Field via 'Save and 
  Duplicate' Action in all versions up to, and including, 1.2.1 due to 
  insufficient escaping on the user supplied parameter and lack of sufficient 
  preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with author-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database.
