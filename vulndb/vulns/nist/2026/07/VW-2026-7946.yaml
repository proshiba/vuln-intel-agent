title: "Successfully using libcurl to do a transfer over a specific HTTP proxy\n(`proxyA`)
  with **Digest** authentication and then changing the proxy host to\na second one
  (`proxyB`) for a second transfer, reusing the same handle, makes\nlibcurl wrongly
  pass on the `Proxy-Authorization:` header field meant for\n`proxyA`, to `proxyB`."
