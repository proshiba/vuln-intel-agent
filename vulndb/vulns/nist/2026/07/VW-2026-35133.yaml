title: OpenPrinting CUPS is an open source printing system for Linux and other 
  Unix-like operating systems. In versions 2.4.16 and prior, CUPS daemon (cupsd)
  contains an authorization bypass vulnerability due to case-insensitive 
  username comparison during authorization checks. The vulnerability allows an 
  unprivileged user to gain unauthorized access to restricted operations by 
  using a user with a username that differs only in case from an authorized 
  user. At time of publication, there are no publicly available patches.
