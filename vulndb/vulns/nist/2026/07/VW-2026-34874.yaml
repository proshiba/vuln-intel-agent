title: WWBN AVideo is an open source video platform. In versions 26.0 and prior,
  the AVideo on_publish_done.php endpoint in the Live plugin allows 
  unauthenticated users to terminate any active live stream. The endpoint 
  processes RTMP callback events to mark streams as finished in the database, 
  but performs no authentication or authorization checks before doing so. An 
  attacker can enumerate active stream keys from the unauthenticated 
  stats.json.php endpoint, then send crafted POST requests to 
  on_publish_done.php to terminate any live broadcast. This enables 
  denial-of-service against all live streaming functionality on the platform. At
  time of publication, there are no publicly available patches.
