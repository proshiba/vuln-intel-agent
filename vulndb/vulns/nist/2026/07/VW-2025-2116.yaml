title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to do sanity check on sit_bitmap_size\n\nw/ below testcase, resize will generate
  a corrupted image which\ncontains inconsistent metadata, so when mounting such image,
  it\nwill trigger kernel panic:\n\ntouch img\ntruncate -s $((512*1024*1024*1024))
  img\nmkfs.f2fs -f img $((256*1024*1024))\nresize.f2fs -s -i img -t $((1024*1024*1024))\n\
  mount img /mnt/f2fs\n\n------------[ cut here ]------------\nkernel BUG at fs/f2fs/segment.h:863!\n\
  Oops: invalid opcode: 0000 [#1] SMP PTI\nCPU: 11 UID: 0 PID: 3922 Comm: mount Not
  tainted 6.15.0-rc1+ #191 PREEMPT(voluntary)\nHardware name: QEMU Standard PC (i440FX
  + PIIX, 1996), BIOS 1.16.3-debian-1.16.3-2 04/01/2014\nRIP: 0010:f2fs_ra_meta_pages+0x47c/0x490\n\
  \nCall Trace:\n f2fs_build_segment_manager+0x11c3/0x2600\n f2fs_fill_super+0xe97/0x2840\n\
  \ mount_bdev+0xf4/0x140\n legacy_get_tree+0x2b/0x50\n vfs_get_tree+0x29/0xd0\n path_mount+0x487/0xaf0\n\
  \ __x64_sys_mount+0x116/0x150\n do_syscall_64+0x82/0x190\n e"
