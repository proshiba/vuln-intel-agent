title: VaahCMS versions 2.0.0 through 2.3.4 contain a malicious obfuscated 
  JavaScript payload embedded in the Blade template responsible for rendering 
  security OTP emails, allowing remote attackers to execute unauthorized code in
  any browser that renders the affected email template with JavaScript enabled. 
  The payload establishes a WebSocket connection to a hardcoded 
  command-and-control endpoint, installs a password-field keylogger using 
  MutationObserver to capture dynamically added inputs, scrapes WhatsApp Web DOM
  content, and accepts remote commands to redirect or overwrite the rendered 
  page.
