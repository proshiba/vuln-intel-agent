title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix folio is still mapped when deleted\n\nMigration may be raced with fallocating
  hole.  remove_inode_single_folio\nwill unmap the folio if the folio is still mapped.\
  \  However, it's called\nwithout folio lock.  If the folio is migrated and the mapped
  pte has been\nconverted to migration entry, folio_mapped() returns false, and won't\n\
  unmap it.  Due to extra refcount held by remove_inode_single_folio,\nmigration fails,
  restores migration entry to normal pte, and the folio is\nmapped again.  As a result,
  we triggered BUG in filemap_unaccount_folio.\n\nThe log is as follows:\n BUG: Bad
  page cache in process hugetlb  pfn:156c00\n page: refcount:515 mapcount:0 mapping:0000000099fef6e1
  index:0x0 pfn:0x156c00\n head: order:9 mapcount:1 entire_mapcount:1 nr_pages_mapped:0
  pincount:0\n aops:hugetlbfs_aops ino:dcc dentry name(?):\"my_hugepage_file\"\n flags:
  0x17ffffc00000c1(locked|waiters|head|node=0|zone=2|lastcpupid=0x1fffff)\n pa"
