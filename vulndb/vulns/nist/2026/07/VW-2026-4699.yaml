title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp: Don't attempt to copy ID to userspace if PSP command failed\n\nWhen retrieving
  the ID for the CPU, don't attempt to copy the ID blob to\nuserspace if the firmware
  command failed.  If the failure was due to an\ninvalid length, i.e. the userspace
  buffer+length was too small, copying\nthe number of bytes _firmware_ requires will
  overflow the kernel-allocated\nbuffer and leak data to userspace.\n\n  BUG: KASAN:
  slab-out-of-bounds in instrument_copy_to_user ../include/linux/instrumented.h:129
  [inline]\n  BUG: KASAN: slab-out-of-bounds in _inline_copy_to_user ../include/linux/uaccess.h:205
  [inline]\n  BUG: KASAN: slab-out-of-bounds in _copy_to_user+0x66/0xa0 ../lib/usercopy.c:26\n\
  \  Read of size 64 at addr ffff8881867f5960 by task syz.0.906/24388\n\n  CPU: 130
  UID: 0 PID: 24388 Comm: syz.0.906 Tainted: G     U     O        7.0.0-smp-DEV #28
  PREEMPTLAZY\n  Tainted: [U]=USER, [O]=OOT_MODULE\n  Hardware name: Google, Inc.
  Arcadia"
