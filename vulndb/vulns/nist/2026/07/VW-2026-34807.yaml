title: A vulnerability was found in CMS Made Simple up to 2.2.22. This impacts 
  the function _copyFilesToFolder in the library 
  modules/UserGuide/lib/class.UserGuideImporterExporter.php of the component 
  UserGuide Module XML Import. The manipulation results in path traversal. It is
  possible to launch the attack remotely. The exploit has been made public and 
  could be used. This issue has been reported early to the project. They 
  confirmed, that "this has already been discovered and fixed for the next 
  release."
