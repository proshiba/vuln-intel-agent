title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpufreq:
  qcom-cpufreq-hw: Fix possible double free\n\nqcom_cpufreq.data is allocated with
  devm_kzalloc() in probe() as an\narray of per-domain data. qcom_cpufreq_hw_cpu_init()
  stores a pointer to\none element of this array in policy->driver_data.\n\nqcom_cpufreq_hw_cpu_exit()
  currently calls kfree() on policy->driver_data.\nThis is not valid because the memory
  is devm-managed. For the first\ndomain, this can free the devm-managed allocation
  while the devres entry\nis still active, leading to a possible double free when
  the platform\ndevice is later detached. For other domains, the pointer may refer
  to an\nelement inside the array rather than the allocation base.\n\nRemove the kfree(data)
  call and let devres release qcom_cpufreq.data.\n\nThis issue was found by a static
  analysis tool I am developing."
