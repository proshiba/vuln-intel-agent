title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  Avoid queue->stopped races and set/read that value under lock\n\nThere are several
  readers of queue->stopped that check the value\nunder lock, but fuse_uring_commit_fetch()
  did not and actually\nthe value was not set under the lock in fuse_uring_abort_end_requests()\n\
  either. Especially in fuse_uring_commit_fetch it is important\nto check under a
  lock, because due to races 'struct fuse_req'\nmight be freed with fuse_request_end,
  but another thread/cpu\nmight already do teardown work."
