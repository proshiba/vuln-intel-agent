title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix null pointer dereference in alloc_preauth_hash()\n\nThe Client send malformed
  smb2 negotiate request. ksmbd return error\nresponse. Subsequently, the client can
  send smb2 session setup even\nthought conn->preauth_info is not allocated.\nThis
  patch add KSMBD_SESS_NEED_SETUP status of connection to ignore\nsession setup request
  if smb2 negotiate phase is not complete."
