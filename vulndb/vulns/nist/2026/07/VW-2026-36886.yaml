title: "Pivotick contains a cross-site scripting vulnerability in the sidebar property-list
  component. Values associated with link-like properties, such as url, uri, href,
  link, website, or homepage, were rendered as hyperlinks without validating their
  URL scheme.\n\nAn attacker able to supply or influence node or edge property data
  could provide a malicious value using the javascript: scheme, including variants
  obfuscated with whitespace or control characters. If a user clicked the generated
  property link, attacker-controlled JavaScript could execute in the context of the
  Pivotick application.\n\nSuccessful exploitation could allow the attacker to access
  information available to the victim’s browser session or perform actions with the
  victim’s privileges. The vulnerability was addressed by normalizing property values
  and preventing URLs with non-allowlisted schemes from being rendered as clickable
  links."
