title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/radeon:
  Remove calls to drm_put_dev()\n\nSince the allocation of the drivers main structure
  was changed to\ndevm_drm_dev_alloc() drm_put_dev()'ing to trigger it to be free'd\n\
  should be done by devres.\n\nHowever, drm_put_dev() is still in the probe error
  and device remove\npaths. When the driver fails to probe warnings like the following
  are\nshown because devres is trying to drm_put_dev() after the driver\nalready did
  it.\n\n[    5.642230] radeon 0000:01:05.0: probe with driver radeon failed with
  error -22\n[    5.649605] ------------[ cut here ]------------\n[    5.649607] refcount_t:
  underflow; use-after-free.\n[    5.649620] WARNING: CPU: 0 PID: 357 at lib/refcount.c:28
  refcount_warn_saturate+0xbe/0x110\n\n(cherry picked from commit 3eb8c0b4c091da0a623ade0d3ee7aa4a93df1ea4)"
