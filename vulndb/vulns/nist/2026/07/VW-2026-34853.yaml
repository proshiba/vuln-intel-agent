title: Nautobot is a Network Source of Truth and Network Automation Platform. 
  Prior to versions 2.4.30 and 3.0.10, user creation and editing via the REST 
  API fails to apply the password validation rules defined by Django's 
  AUTH_PASSWORD_VALIDATORS setting (which defaults to an empty list, i.e., no 
  specific rules, but can be configured in Nautobot's nautobot_config.py to 
  apply various rules if desired). This can potentially allow for the creation 
  or modification of users to have passwords that are weak or otherwise do not 
  comply with configured standards. This issue has been patched in versions 
  2.4.30 and 3.0.10.
