title: "In the Linux kernel, the following vulnerability has been resolved:\n\nisofs:
  bound Rock Ridge symlink components to the SL record\n\nget_symlink_chunk() and
  the SL handling in\nparse_rock_ridge_inode_internal() walk the variable-length components
  of\na Rock Ridge \"SL\" (symbolic link) record.  Each component is a two-byte\n\
  header (flags, len) followed by len bytes of text, so it occupies\nslp->len + 2
  bytes.  Both loops read slp->len and advance to the next\ncomponent, and get_symlink_chunk()
  additionally does\nmemcpy(rpnt, slp->text, slp->len), but neither checks that the
  component\nlies within the SL record before dereferencing it.\n\nA crafted SL record
  whose component declares a len that runs past the\nrecord (rr->len) therefore triggers
  an out-of-bounds read of up to 255\nbytes.  When the record sits at the tail of
  its backing buffer - for\nexample a small kmalloc()ed continuation block reached
  through a CE\nrecord - the read crosses the allocation; get_symlink_chunk() then\n\
  copies the out-of-bound"
