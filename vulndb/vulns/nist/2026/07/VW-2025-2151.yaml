  the \"TOE/TSO\" offloader and it will handle them.\n\nWithout this quirk the driver
  becomes unstable and lock\nup and and crash.\n\nI do not know exactly why, but it
  is probably due to the\nTOE (TCP offload engine) feature that is coupled with the\n\
