title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  xhci: Fix isochronous Ring Underrun/Overrun event handling\n\nThe TRB pointer of
  these events points at enqueue at the time of error\noccurrence on xHCI 1.1+ HCs
  or it's NULL on older ones. By the time we\nare handling the event, a new TD may
  be queued at this ring position.\n\nI can trigger this race by rising interrupt
  moderation to increase IRQ\nhandling delay. Similar delay may occur naturally due
  to system load.\n\nIf this ever happens after a Missed Service Error, missed TDs
  will be\nskipped and the new TD processed as if it matched the event. It could\n\
  be given back prematurely, risking data loss or buffer UAF by the xHC.\n\nDon't
  complete TDs on xrun events and don't warn if queued TDs don't\nmatch the event's
  TRB pointer, which can be NULL or a link/no-op TRB.\nDon't warn if there are no
  queued TDs at all.\n\nNow that it's safe, also handle xrun events if the skip flag
  is clear.\nThis ensures completion of any TD stuck in"
