title: The Persian Elementor (المنتور فارسی) plugin for WordPress is vulnerable 
  to Price Manipulation in all versions up to, and including, 2.8.1. This is due
  to the plugin trusting a user-supplied payment amount without server-side 
  validation against the configured ZarinPal widget price. This makes it 
  possible for unauthenticated attackers to submit arbitrary payment amounts to 
  the ZarinPal gateway via the 'amount' parameter.
