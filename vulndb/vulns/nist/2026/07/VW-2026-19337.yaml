  \n      (For aarch64 architecture)\n      The image digest is\nsha256:4cfd7378ff6b2e188ce37a04cdca2bcf3638ab397f52fb64f92af8cb81859a5f\n\
  \nAll OpenShift Container Platform 4.22 users are advised to upgrade to these\n\
