title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  bridge: fix stale prevhdr pointer in br_ip6_fragment()\n\nbr_ip6_fragment() gets
  prevhdr, a pointer into the skb head, from\nip6_find_1stfragopt(), then calls skb_checksum_help().\
  \  For a cloned skb\nskb_checksum_help() reallocates the head via pskb_expand_head(),
  leaving\nprevhdr dangling.  It is later dereferenced in ip6_frag_next(), causing
  a\nuse-after-free write.\n\nSave prevhdr's offset before skb_checksum_help() and
  recompute it after,\nlike commit ef0efcd3bd3f (\"ipv6: Fix dangling pointer when
  ipv6\nfragment\").\n\n  BUG: KASAN: slab-use-after-free in ip6_frag_next (net/ipv6/ip6_output.c:857)\n\
  \  Write of size 1 at addr ffff888013ff5016 by task exploit/141\n  Call Trace:\n\
  \   ...\n   kasan_report (mm/kasan/report.c:595)\n   ip6_frag_next (net/ipv6/ip6_output.c:857)\n\
  \   br_ip6_fragment (net/ipv6/netfilter.c:212)\n   nf_ct_bridge_post (net/bridge/netfilter/nf_conntrack_bridge.c:407)\n\
  \   nf_hook_slow (net/netfilter/core.c:619"
