title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrust_binder:
  fix race condition on death_list\n\nRust Binder contains the following unsafe operation:\n\
  \n\t// SAFETY: A `NodeDeath` is never inserted into the death list\n\t// of any
  node other than its owner, so it is either in this\n\t// death list or in no death
  list.\n\tunsafe { node_inner.death_list.remove(self) };\n\nThis operation is unsafe
  because when touching the prev/next pointers of\na list element, we have to ensure
  that no other thread is also touching\nthem in parallel. If the node is present
  in the list that `remove` is\ncalled on, then that is fine because we have exclusive
  access to that\nlist. If the node is not in any list, then it's also ok. But if
  it's\npresent in a different list that may be accessed in parallel, then that\n\
  may be a data race on the prev/next pointers.\n\nAnd unfortunately that is exactly
  what is happening here. In\nNode::release, we:\n\n 1. Take the lock.\n 2. Move all
  items to a local list on the stac"
