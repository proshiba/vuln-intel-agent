title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: Fix possible UAFs\n\nThis attemps to fix possible UAFs caused by struct mgmt_pending
  being\nfreed while still being processed like in the following trace, in order\n\
  to fix mgmt_pending_valid is introduce and use to check if the\nmgmt_pending hasn't
  been removed from the pending list, on the complete\ncallbacks it is used to check
  and in addtion remove the cmd from the list\nwhile holding mgmt_pending_lock to
  avoid TOCTOU problems since if the cmd\nis left on the list it can still be accessed
  and freed.\n\nBUG: KASAN: slab-use-after-free in mgmt_add_adv_patterns_monitor_sync+0x35/0x50
  net/bluetooth/mgmt.c:5223\nRead of size 8 at addr ffff8880709d4dc0 by task kworker/u11:0/55\n\
  \nCPU: 0 UID: 0 PID: 55 Comm: kworker/u11:0 Not tainted 6.16.4 #2 PREEMPT(full)\n\
  Hardware name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.10.2-1ubuntu1 04/01/2014\n\
  Workqueue: hci0 hci_cmd_sync_work\nCall Trace:\n <TASK>\n dump_stack_lvl+0x189/"
