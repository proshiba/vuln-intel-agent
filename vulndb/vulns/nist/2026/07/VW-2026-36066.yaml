title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix memory leak in xfs_dqinode_metadir_create()\n\nIf xfs_metadir_create() fails
  in xfs_dqinode_metadir_create(), the current\ncode returns directly, leaking the
  allocated update and transaction state.\nIf the subsequent commit fails, the caller-owned
  inode reference is left\nbehind.\n\nFix this memory leak by routing the create failure
  path through\nxfs_metadir_cancel().  For both create and commit failures, finish
  and\nrelease any inode returned to the caller, mirroring the unwind pattern in\n\
  xfs_metadir_mkdir().\n\nThe bug was first flagged by an experimental analysis tool
  we are\ndeveloping for kernel memory-management bugs while analyzing\nv6.13-rc1.
  The tool is still under development and is not yet publicly\navailable. Manual inspection
  confirms that the bug is still\npresent in v7.1.1.\n\nAn x86_64 allyesconfig build
  showed no new warnings. Runtime validation\nused kprobe fault injection during `mount
  -o uquota` on a metadi"
