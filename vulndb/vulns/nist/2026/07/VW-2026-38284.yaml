title: Wolf CMS through 0.8.3.1 contains an authorization bypass vulnerability 
  in BackupRestoreController that allows authenticated non-administrative users 
  to access restricted backup functionality due to a PHP operator precedence 
  flaw in the permission check expression. Attackers can exploit the incorrect 
  evaluation of the access control expression to create, download, and restore 
  backups without administrative privileges.
