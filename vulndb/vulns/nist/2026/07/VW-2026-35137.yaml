title: Piwigo is an open source photo gallery application for the web. Prior to 
  version 16.3.0, a SQL Injection vulnerability exists in the pwg.users.getList 
  Web Service API method. The filter parameter is directly concatenated into a 
  SQL query without proper sanitization, allowing authenticated administrators 
  to execute arbitrary SQL commands. This issue has been patched in version 
  16.3.0.
