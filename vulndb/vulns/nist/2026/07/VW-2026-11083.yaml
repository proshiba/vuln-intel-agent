title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: use safe list iteration in radar detect work\n\nThe call to ieee80211_dfs_cac_cancel
  can cause the iterated chanctx to\nbe freed and removed from the list. Guard against
  this to avoid a\nslab-use-after-free error."
