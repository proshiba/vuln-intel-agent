title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni40e:
  fix validation of VF state in get resources\n\nVF state I40E_VF_STATE_ACTIVE is
  not the only state in which\nVF is actually active so it should not be used to determine\n\
  if a VF is allowed to obtain resources.\n\nUse I40E_VF_STATE_RESOURCES_LOADED that
  is set only in\ni40e_vc_get_vf_resources_msg() and cleared during reset."
