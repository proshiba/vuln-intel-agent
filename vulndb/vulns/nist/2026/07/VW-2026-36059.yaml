title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  dwc3: fix dwc3_readl() and dwc3_writel() calls in dwc3_ulpi_setup()\n\nThe dwc3_ulpi_setup()
  calls the register read and write calls with\ndwc3->regs when both these calls take
  the dwc3 structure directly.\n\nChnage these two calls to fix the following sparse
  warning, and\npossibly a nasty bug in the dwc3_ulpi_setup() code:\n\ndrivers/usb/dwc3/core.c:796:45:
  warning: incorrect type in argument 1 (different address spaces)\ndrivers/usb/dwc3/core.c:796:45:\
  \    expected struct dwc3 *dwc\ndrivers/usb/dwc3/core.c:796:45:    got void [noderef]
  __iomem *regs\ndrivers/usb/dwc3/core.c:798:40: warning: incorrect type in argument
  1 (different address spaces)\ndrivers/usb/dwc3/core.c:798:40:    expected struct
  dwc3 *dwc\ndrivers/usb/dwc3/core.c:798:40:    got void [noderef] __iomem *regs"
