title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware_loader:
  fix device reference leak in firmware_upload_register()\n\nfirmware_upload_register()\n\
  \  -> fw_create_instance()\n     -> device_initialize()\n\nAfter fw_create_instance()
  succeeds, the lifetime of the embedded struct\ndevice is expected to be managed
  through the device core reference\ncounting, since fw_create_instance() has already
  called\ndevice_initialize().\n\nIn firmware_upload_register(), if alloc_lookup_fw_priv()
  fails after\nfw_create_instance() succeeds, the code reaches free_fw_sysfs and frees\n\
  fw_sysfs directly instead of releasing the device reference with\nput_device().
  This may leave the reference count of the embedded struct\ndevice unbalanced, resulting
  in a refcount leak.\n\nThe issue was identified by a static analysis tool I developed
  and\nconfirmed by manual review. Fix this by using put_device(fw_dev) in the\nfailure
  path and letting fw_dev_release() handle the final cleanup,\ninstead of freeing
  the"
