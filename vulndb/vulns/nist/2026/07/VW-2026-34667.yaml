title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rc: igorplugusb: fix control request setup packet\n\nCommit eac69475b01f (\"media:
  rc: igorplugusb: heed coherency\nrules\") changed the control request storage from
  an embedded struct to\nan allocated pointer so it can obey DMA coherency rules.\n\
  \nHowever, the driver still passes &ir->request to usb_fill_control_urb().\nThat
  points the URB setup packet at the pointer field itself rather than\nat the allocated
  struct usb_ctrlrequest.\n\nUSB core then interprets pointer bytes as the setup packet.
  This can\nproduce an invalid bRequestType and trigger the control direction warning\n\
  reported by syzbot:\n\n  usb 2-1: BOGUS control dir, pipe 80003580 doesn't match
  bRequestType 0\n\nPass ir->request itself as the setup packet."
