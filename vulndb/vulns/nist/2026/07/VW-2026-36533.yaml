title: A lack of authentication in the mobile app (APK v5.5.0) for Ghost 
  Robotics' Vision 60 robot allows an unauthenticated attacker connected to the 
  device's internal Wi-Fi network to gain unrestricted access to the web 
  administration interface and the HTTP API. Due to the lack of authorization 
  mechanisms, the attacker can view real-time camera feeds, control the robot’s 
  movements, manage sensors (GPS, RTK, SAM, LIDAR), and execute critical 
  operational commands (Play, Pause, Stop, E-Stop). Successful exploitation 
  completely compromises the confidentiality, integrity, and physical security 
  of the system.
