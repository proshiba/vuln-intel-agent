title: 'Vulnerability in the Oracle Agile Product Lifecycle Management for Process
  product of Oracle Supply Chain (component: Product Quality Management).   The supported
  version that is affected is 6.2.4. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via HTTP to compromise Oracle Agile Product Lifecycle
  Management for Process.  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Agile Product
  Lifecycle Management for Process accessible data as well as  unauthorized access
  to critical data or complete access to all Oracle Agile Product Lifecycle Management
  for Process accessible data. CVSS 3.1 Base Score 9.1 (Confidentiality and Integrity
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N).'
