title: "A heap-based buffer overflow vulnerability was identified in TP-Link Tapo
  C520WS v2.6 within the HTTP parsing\nloop\nwhen appending segmented request bodies
  without\ncontinuous write‑boundary verification, due to insufficient boundary validation
  when handling externally supplied HTTP input.  An attacker\non the same network
  segment could trigger heap memory corruption conditions by\nsending crafted payloads
  that cause write operations beyond allocated buffer\nboundaries.  Successful exploitation\n\
  causes a Denial-of-Service (DoS) condition, causing the device’s process to\ncrash
  or become unresponsive."
