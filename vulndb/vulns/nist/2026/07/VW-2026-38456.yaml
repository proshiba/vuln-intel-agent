title: "Improper Neutralization of CRLF Sequences vulnerability in ufirstgroup ymlr
  (Elixir.Ymlr module) allows attackers to inject arbitrary content into generated
  YAML documents through document comments. Ymlr.document!/2 interpolates each caller-supplied
  comment string into the output behind a single # prefix without validating it or
  escaping line breaks. Because a YAML comment is terminated by a line break, the
  first carriage return or line feed in the comment string ends the comment context
  and everything after it is emitted at column 0 of the document body.\n\nAn attacker
  who controls text that the host application passes as a comment can forge top-level
  mapping keys, override values the application itself set, and emit --- or ... markers
  that split the output into additional documents. Downstream consumers of the generated
  YAML, such as configuration loaders, deployment manifests, CI pipelines and data
  importers, parse the injected content as legitimate data. The same clause backs
  Ymlr.do"
