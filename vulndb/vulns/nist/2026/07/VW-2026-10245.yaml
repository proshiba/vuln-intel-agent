title: A flaw was found in gnutls. When validating certificates, an oversized 
  Subject Alternative Name (SAN) could cause the validation process to 
  incorrectly fall back to checking the Common Name (CN) field. This could allow
  a remote attacker to bypass proper certificate validation, potentially leading
  to spoofing or man-in-the-middle attacks.
