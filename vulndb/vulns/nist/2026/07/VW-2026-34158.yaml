title: Bold Reports Standalone Report Designer before 14.1.12 contains a missing
  filepath validation vulnerability in its file upload functionality that allows
  authenticated attackers to traverse outside the intended directory by 
  supplying a crafted filename. Attackers can exploit this path traversal 
  weakness to execute arbitrary commands with high privileges on the server. The
  vulnerability is specific to the DataHub module, which was introduced in Bold 
  Reports 6.3. Therefore, versions prior to 6.3 are not affected.
