title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  end fuse_req on io-uring cancel task work\n\nWhen io_uring delivers task work with
  tw.cancel set (PF_EXITING,\nPF_KTHREAD fallback, or percpu_ref_is_dying on the ring
  context),\nfuse_uring_send_in_task() takes the cancel branch, assigns\n-ECANCELED,
  and falls through to fuse_uring_send(). That path only\nflips the entry to FRRS_USERSPACE
  and completes the io_uring cmd;\nit never discharges the ring entry's owning reference
  to the\nfuse_req that fuse_uring_add_req_to_ring_ent() handed it at\ndispatch time.\n\
  \n    fuse_uring_send_in_task()\n      tw.cancel == true\n        err = -ECANCELED\n\
  \      fuse_uring_send(ent, cmd, err, issue_flags)\n        ent->state = FRRS_USERSPACE\n\
  \        list_move(&ent->list, &queue->ent_in_userspace)\n        ent->cmd = NULL\n\
  \        io_uring_cmd_done(-ECANCELED)\n        /* ent->fuse_req still set, req
  still hashed */\n\nThe fuse_req stays linked on fpq->processing[hash] and\nfuse_request_end()
  is"
