title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: qmi_wwan: initialize MAC header offset in qmimux_rx_fixup\n\nRaw IP packets
  have no MAC header, leaving skb->mac_header uninitialized.\nThis can trigger kernel
  panics on ARM64 when xfrm or other subsystems\naccess the offset due to strict alignment
  checks.\n\nInitialize the MAC header to prevent such crashes.\n\nThis can trigger
  kernel panics on ARM when running IPsec over the\nqmimux0 interface.\n\nExample
  trace:\n\n    Internal error: Oops: 000000009600004f [#1] SMP\n    CPU: 0 UID: 0
  PID: 0 Comm: swapper/0 Not tainted 6.12.34-gbe78e49cb433 #1\n    Hardware name:
  LS1028A RDB Board (DT)\n    pstate: 60000005 (nZCv daif -PAN -UAO -TCO -DIT -SSBS
  BTYPE=--)\n    pc : xfrm_input+0xde8/0x1318\n    lr : xfrm_input+0x61c/0x1318\n\
  \    sp : ffff800080003b20\n    Call trace:\n     xfrm_input+0xde8/0x1318\n    \
  \ xfrm6_rcv+0x38/0x44\n     xfrm6_esp_rcv+0x48/0xa8\n     ip6_protocol_deliver_rcu+0x94/0x4b0\n\
  \     ip6_input_finish+0x44/0x70\n     ip6_"
