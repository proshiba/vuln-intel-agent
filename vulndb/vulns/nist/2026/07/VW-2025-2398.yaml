title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfsplus:
  fix slab-out-of-bounds read in hfsplus_strcasecmp()\n\nThe hfsplus_strcasecmp()
  logic can trigger the issue:\n\n[  117.317703][ T9855] ==================================================================\n\
  [  117.318353][ T9855] BUG: KASAN: slab-out-of-bounds in hfsplus_strcasecmp+0x1bc/0x490\n\
  [  117.318991][ T9855] Read of size 2 at addr ffff88802160f40c by task repro/9855\n\
  [  117.319577][ T9855]\n[  117.319773][ T9855] CPU: 0 UID: 0 PID: 9855 Comm: repro
  Not tainted 6.17.0-rc6 #33 PREEMPT(full)\n[  117.319780][ T9855] Hardware name:
  QEMU Ubuntu 24.04 PC (i440FX + PIIX, 1996), BIOS 1.16.3-debian-1.16.3-2 04/01/2014\n\
  [  117.319783][ T9855] Call Trace:\n[  117.319785][ T9855]  <TASK>\n[  117.319788][
  T9855]  dump_stack_lvl+0x1c1/0x2a0\n[  117.319795][ T9855]  ? __virt_addr_valid+0x1c8/0x5c0\n\
  [  117.319803][ T9855]  ? __pfx_dump_stack_lvl+0x10/0x10\n[  117.319808][ T9855]\
  \  ? rcu_is_watching+0x15/0xb0\n[  117.319816][ T9855]  ? lo"
