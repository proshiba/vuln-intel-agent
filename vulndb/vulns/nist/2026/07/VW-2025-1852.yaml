title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndriver
  core: class: Fix wild pointer dereferences in API class_dev_iter_next()\n\nThere
  are a potential wild pointer dereferences issue regarding APIs\nclass_dev_iter_(init|next|exit)(),
  as explained by below typical usage:\n\n// All members of @iter are wild pointers.\n\
  struct class_dev_iter iter;\n\n// class_dev_iter_init(@iter, @class, ...) checks
  parameter @class for\n// potential class_to_subsys() error, and it returns void
  type and does\n// not initialize its output parameter @iter, so caller can not detect\n\
  // the error and continues to invoke class_dev_iter_next(@iter) even if\n// @iter
  still contains wild pointers.\nclass_dev_iter_init(&iter, ...);\n\n// Dereference
  these wild pointers in @iter here once suffer the error.\nwhile (dev = class_dev_iter_next(&iter))
  { ... };\n\n// Also dereference these wild pointers here.\nclass_dev_iter_exit(&iter);\n\
  \nActually, all callers of these APIs have such usage pattern in kernel tree.\n\
  Fix "
