title: Likeshop through 3.0.5 contains an authenticated SQL injection 
  vulnerability that allows admin-level users to extract arbitrary database 
  contents by submitting unsanitized POST parameters to the adjustAccount 
  endpoint. The adjustAccount method in UserLogic.php concatenates the money, 
  integral, growth, and earnings parameters directly into Db::raw() SQL 
  fragments without type casting, numeric validation, or parameter binding, 
  enabling boolean-based binary-search extraction of credentials, PII, and 
  session tokens via distinct success and failure response messages.
