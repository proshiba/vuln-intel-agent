title: "Since Spring Security SAML decrypts SAML Responses as well as elements of
  SAML LogoutRequests and LogoutResponses without requiring a valid signature, attackers
  may be able to craft these SAML payloads and use the Service Provider as a decryption
  oracle.\n\nAffected versions:\nSpring Security 5.7.0 through 5.7.23; 5.8.0 through
  5.8.25; 6.3.0 through 6.3.16; 6.4.0 through 6.4.16; 6.5.0 through 6.5.10; 7.0.0
  through 7.0.5."
