title: A vulnerability was identified in OWASP DefectDojo 2.59.0. This issue 
  affects the function UserSerializer of the file dojo/api_v2/serializers.py of 
  the component API/Web. Such manipulation of the argument is_staff leads to 
  improper privilege management. The attack may be performed from remote. The 
  exploit is publicly available and might be used. Upgrading to version 2.58.3 
  and 3.0.0 is capable of addressing this issue. The name of the patch is 
  68a272f299d096249fd3ba9c2676bf69012857bf. It is advisable to upgrade the 
  affected component. 2.59.0 was not intended to be released and has been 
  removed.
