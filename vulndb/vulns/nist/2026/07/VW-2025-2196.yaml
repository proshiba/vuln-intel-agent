title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  Correct signedness in skb remaining space calculation\n\nSyzkaller reported a bug
  [1] where sk->sk_forward_alloc can overflow.\n\nWhen we send data, if an skb exists
  at the tail of the write queue, the\nkernel will attempt to append the new data
  to that skb. However, the code\nthat checks for available space in the skb is flawed:\n\
  '''\ncopy = size_goal - skb->len\n'''\n\nThe types of the variables involved are:\n\
  '''\ncopy: ssize_t (s64 on 64-bit systems)\nsize_goal: int\nskb->len: unsigned int\n\
  '''\n\nDue to C's type promotion rules, the signed size_goal is converted to an\n\
  unsigned int to match skb->len before the subtraction. The result is an\nunsigned
  int.\n\nWhen this unsigned int result is then assigned to the s64 copy variable,\n\
  it is zero-extended, preserving its non-negative value. Consequently, copy\nis always
  >= 0.\n\nAssume we are sending 2GB of data and size_goal has been adjusted to a\n\
  value smaller than skb->len. The subtract"
