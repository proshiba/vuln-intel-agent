title: schreibfaul1 ESP32-audioI2S v3.4.5 has an integer underflow vulnerability
  in the MP3Decoder::GetBits() function of the MP3 decoder due to unchecked bit 
  reading operations. The lack of validation on the nBits parameter causes the 
  cachedBits counter to underflow to negative values, leading to invalid bit 
  manipulation, incorrect bitstream parsing, application crash, or arbitrary 
  code execution via a specially crafted MP3 file.
