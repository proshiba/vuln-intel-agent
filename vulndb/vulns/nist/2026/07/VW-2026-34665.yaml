title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  shared: fix deadlock on shared proxy's parent removal\n\nCommit 710abda58055 (\"\
  gpio: shared: call gpio_chip::of_xlate() if set\")\nused the mutex embedded in struct
  gpio_shared_entry to protect the\noffset field which now can be modified after assignment.
  The critical\nsection however is too wide and introduced a potential deadlock on
  the\nremoval of the shared GPIO proxy's parent.\n\nMake the critical section shorter
  - only protect the offset when it's\nbeing read.\n\nWhile at it: mention the fact
  that the entry lock is now also used to\nprotect against concurrent access to the
  offset field in the structure's\ndocumentation."
