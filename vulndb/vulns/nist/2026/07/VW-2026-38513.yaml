title: "The fix for CVE-2026-12044 in pgAdmin 4 9.16 hardened qtLiteral and switched
  sixteen COMMENT ON / pgstattuple / pgstatindex templates to it, but missed several
  sinks that had been placed in test_sql_string_literal_lint.py's ALLOWLIST on the
  incorrect assumption that schema, table, publication, and subscription names sourced
  from pg_catalog via the browser tree could never contain an apostrophe. PostgreSQL
  permits arbitrary characters in quoted identifiers, so a low-privileged user able
  to CREATE TABLE, CREATE PUBLICATION, or CREATE SUBSCRIPTION can plant an apostrophe'd
  object name that breaks out of the unescaped '{{ name }}' template interpolation
  the moment any user (including a higher-privileged one) opens that object's Statistics
  or Dependencies tab, allowing arbitrary SQL statement injection in the viewing user's
  database session.\n\nAffected sinks: the Index Statistics query for all-indexes
  listing (coll_stats.sql, both the 16_plus and default PostgreSQL-version template
  variants "
