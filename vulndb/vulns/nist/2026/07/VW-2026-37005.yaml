title: The Storegrowth Sales Booster plugin for WordPress is vulnerable to 
  Missing Authorization in versions up to and including 2.1.0. This is due to a 
  missing capability check on the bogo_category_msg_create() AJAX handler, which
  is registered for both authenticated (wp_ajax_) and unauthenticated 
  (wp_ajax_nopriv_) users and only validates a nonce ('ajd_protected') that is 
  emitted publicly via wp_localize_script() on every frontend page through 
  front_scripts() . This makes it possible for unauthenticated attackers to 
  modify the plugin's BOGO category-message configuration stored in the 
  spsg_bogo_general_settings option by reading the nonce from any public page 
  and POSTing attacker-controlled data to admin-ajax.
