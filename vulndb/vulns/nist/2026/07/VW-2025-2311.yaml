title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: fix list corruption after hardware restart\n\nSince stations are recreated
  from scratch, all lists that wcids are added\nto must be cleared before calling
  ieee80211_restart_hw.\nSet wcid->sta = 0 for each wcid entry in order to ensure
  that they are\nnot added again before they are ready."
