  between pressure write and cgroup file\nrelease regarding the priv member of struct
  kernfs_open_file, which\ntriggers the uaf reported in [1].\n\nConsider the following
  scenario involving execution on two separate CPUs:\n\n   CPU0\t\t\t\t\tCPU1\n  \
