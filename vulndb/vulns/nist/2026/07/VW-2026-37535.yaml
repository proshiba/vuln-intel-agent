title: MCP Ruby SDK is the official Ruby SDK for Model Context Protocol servers 
  and clients. Prior to 0.23.0, MCP::Server::Transports::StdioTransport and 
  MCP::Client::Stdio in the mcp gem use IO#gets without a byte limit, allowing a
  peer that sends data without a newline to exhaust process memory. This issue 
  is fixed in version 0.23.0.
