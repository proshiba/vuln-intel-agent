title: Capsule is a multi-tenancy and policy-based framework for Kubernetes. 
  From 0.13.0 until 0.13.8, after the incomplete CVE-2026-22872 fix, 
  TenantResource RawItems and Generators in 
  internal/controllers/resources/collect.go, including handleRawItem and 
  handleGeneratorItem, did not apply the ResourceReference.LoadResources and 
  IsNamespacedGVK cluster-scoped resource rejection guard used by 
  NamespacedItems, allowing a Tenant Owner to create cluster-scoped resources 
  such as ClusterRole or ValidatingWebhookConfiguration through the 
  cluster-admin controller client. This issue is fixed in version 0.13.8.
