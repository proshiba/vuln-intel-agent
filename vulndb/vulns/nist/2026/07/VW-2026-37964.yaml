title: "A path traversal vulnerability was found in the VPN Clients on the ADM. The
  vulnerability occurs because user-controlled certificate name input is not sufficiently
  validated before being used to construct the upload destination path. An authenticated
  attacker can exploit this issue to write an uploaded certificate file outside the
  intended VPN certificate directory, subject to process privileges and filesystem
  permissions.\nAffected products and versions include: from ADM 4.1.0 through ADM
  4.3.3.RUN1 as well as from ADM 5.0.0 through ADM 5.1.3.RI81."
