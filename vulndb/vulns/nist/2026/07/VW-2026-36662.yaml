title: "In the Synopsys DesignWare I2C driver (drivers/i2c/i2c_dw.c) operating in
  target/slave mode, the rx_full interrupt handler gates the write_requested() callback
  on dw->state != CMD_SEND, and dw->state is only reset to READY on a STOP interrupt.
  The START_DET interrupt, whose handler in i2c_dw_slave_read_clear_intr_bits() would
  reset the state on every (re)START, was never added to the enabled interrupt mask
  in i2c_dw_slave_register(), so that recovery path was dead code.\n\nAs a result,
  if the STOP interrupt is lost (bus glitch/reset, or a concurrent master driving
  STOP) or the bus master issues a legal WRITE-repeated-START-WRITE sequence with
  the same direction, the driver remains in CMD_SEND permanently and never invokes
  write_requested() again for the life of the target.\n\nAn I2C master on the same
  physical bus can deliberately trigger this, causing the I2C target function to malfunction
  for all subsequent write transactions and desynchronizing consumer framing state
  (e.g. MCTP-over-I2C"
