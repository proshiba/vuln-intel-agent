title: A vulnerability was identified in PowerJob 5.1.0/5.1.1/5.1.2. Impacted is
  an unknown function of the file 
  powerjob-server/powerjob-server-starter/src/main/java/tech/powerjob/server/web/controller/InstanceController.java
  of the component detailPlus Endpoint. The manipulation of the argument 
  customQuery leads to sql injection. Remote exploitation of the attack is 
  possible. The project was informed of the problem early through an issue 
  report but has not responded yet.
