title: "Missing connection and header-read timeouts and the absence of a concurrent-connection
  cap in the default serve() path of Amazon aws-smithy-http-server might allow remote
  attackers to cause a denial of service by opening many connections and sending partial
  requests that are never completed, exhausting server sockets and tasks.\n\n\n\n\
  To mitigate this issue, users should upgrade to aws-smithy-http-server 0.66.5 or
  later."
