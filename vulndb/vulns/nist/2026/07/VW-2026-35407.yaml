title: Podman Desktop is a graphical tool for developing on containers and 
  Kubernetes. Prior to 1.26.2, an unauthenticated HTTP server exposed by Podman 
  Desktop allows any network attacker to remotely trigger denial-of-service 
  conditions and extract sensitive information. By abusing missing connection 
  limits and timeouts, an attacker can exhaust file descriptors and kernel 
  memory, leading to application crash or full host freeze. Additionally, 
  verbose error responses disclose internal paths and system details (including 
  usernames on Windows), aiding further exploitation. The issue requires no 
  authentication or user interaction and is exploitable over the network. This 
  vulnerability is fixed in 1.26.2.
