title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  pressure: mpl115: fix runtime PM leak on read error\n\nmpl115_read_raw() takes a
  runtime PM reference with pm_runtime_get_sync()\nbefore reading the processed pressure
  or raw temperature, but on the read\nerror path it returns without calling pm_runtime_put_autosuspend().
  Each\nfailed read therefore leaks a runtime PM reference and prevents the device\n\
  from autosuspending.\n\nDrop the reference before checking the return value so both
  the success\nand error paths are balanced."
