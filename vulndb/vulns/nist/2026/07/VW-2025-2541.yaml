title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm:
  make sure last_fence is always updated\n\nUpdate last_fence in the vm-bind path
  instead of kernel managed path.\n\nlast_fence is used to wait for work to finish
  in vm_bind contexts but not\nused for kernel managed contexts.\n\nThis fixes a bug
  where last_fence is not waited on context close leading\nto faults as resources
  are freed while in use.\n\nPatchwork: https://patchwork.freedesktop.org/patch/680080/"
