title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  bpf: abort dispatch if device destroyed\n\nThe current HID bpf implementation assumes
  no output report/request will\ngo through it after hid_bpf_destroy_device() has
  been called. This leads\nto a bug that unplugging certain types of HID devices causes
  a cleaned-\nup SRCU to be accessed. The bug was previously a hidden failure until
  a\nrecent x86 percpu change [1] made it access not-present pages.\n\nThe bug will
  be triggered if the conditions below are met:\n\nA) a device under the driver has
  some LEDs on\nB) hid_ll_driver->request() is uninplemented (e.g., logitech-djreceiver)\n\
  \nIf condition A is met, hidinput_led_worker() is always scheduled *after*\nhid_bpf_destroy_device().\n\
  \nhid_destroy_device\n` hid_bpf_destroy_device\n  ` cleanup_srcu_struct(&hdev->bpf.srcu)\n\
  ` hid_remove_device\n  ` ...\n    ` led_classdev_unregister\n      ` led_trigger_set(led_cdev,
  NULL)\n        ` led_set_brightness(led_cdev, LED_OFF)\n          ` ...\n    "
