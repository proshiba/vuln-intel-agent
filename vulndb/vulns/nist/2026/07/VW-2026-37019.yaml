title: "Xenstore, to have an up-to-date picture of the entire system, wants to\nknow
  of domains appearing and disappearing.  To make this more robust, a\nnew XEN_DOMCTL_get_domain_state
  was introduced.  The management of the\nbitmap underlying that operation is tied
  into the binding of the\nVIRQ_DOM_EXC virtual IRQ.  Unfortunately an error path
  there would tear\ndown the bitmap even in cases when it wasn't set up.  Unprivileged
  domains\ncan trigger that error path."
