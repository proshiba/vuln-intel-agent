title: "An authentication bypass vulnerability within the HTTP handling of the DS
  configuration service in TP-Link Tapo C520WS v2.6 was identified, due to inconsistent
  parsing and authorization logic in JSON requests during authentication check.  An
  unauthenticated attacker can append an authentication-exempt action to a request
  containing privileged DS do actions, bypassing authorization checks.\n\nSuccessful
  exploitation allows unauthenticated execution of restricted configuration actions,
  which may result in unauthorized modification of device state."
