title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/vce1:
  Fix VCE 1 firmware size and offsets\n\nThe VCPU BO contains the actual FW at an
  offset, but\nit was not calculated into the VCPU BO size.\nSubtract this from the
  FW size to make sure there is\nno out of bounds access.\n\nMake sure the stack and
  data offsets are aligned to\nthe 32K TLB size.\n\nCheck that the FW microcode actually
  fits in the\nspace that is reserved for it.\n\n(cherry picked from commit c16fe59f622a080fc457a57b3e8f14c780699449)"
