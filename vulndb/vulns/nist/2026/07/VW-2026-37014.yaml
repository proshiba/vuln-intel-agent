title: The Paid Memberships Pro – Content Restriction, User Registration, & Paid
  Subscriptions plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via Readonly User Field via [pmpro_member_profile_edit] Shortcode in
  all versions up to, and including, 3.8.1 due to insufficient input 
  sanitization and output escaping. This makes it possible for authenticated 
  attackers, with subscriber-level access and above, to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page.
