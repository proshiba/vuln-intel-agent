title: "BoidCMS is an open-source, PHP-based flat-file CMS for building simple websites
  and blogs, using JSON as its database. Versions prior to 2.1.3 are vulnerable to
  a critical Local File Inclusion (LFI) attack via the tpl parameter, which can lead
  to Remote Code Execution (RCE).The application fails to sanitize the tpl (template)
  parameter during page creation and updates. This parameter is passed directly to
  a require_once() statement without path validation. An authenticated administrator
  can exploit this by injecting path traversal sequences (../) into the tpl value
  to escape the intended theme directory and include arbitrary files — specifically,
  files from the server's media/ directory. When combined with the file upload functionality,
  this becomes a full RCE chain: an attacker can first upload a file with embedded
  PHP code (e.g., disguised as image data), then use the path traversal vulnerability
  to include that file via require_once(), executing the embedded code with web server
  pri"
