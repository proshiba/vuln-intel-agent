title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/ivpu:
  Add bounds check for firmware runtime memory\n\nValidate that the firmware runtime
  memory specified in the image\nheader is properly aligned and sized to hold the
  firmware image.\nThis prevents errors during memory allocation and image transfer."
