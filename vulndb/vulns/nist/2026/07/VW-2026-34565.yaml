title: "Incorrect Calculation of Buffer Size vulnerability in Apache NimBLE when processing Legacy
  Advertising Report HCI event.\n\nWhen a single HCI advertising report event bundles
  multiple reports, NimBLE miscalculated the offset to the next report. This can cause
  the host to read past the end of the buffer and deliver a GAP event with bogus data
  to the application.\n\nSeverity is low: NimBLE's own controller never batches multiple
  reports into one event, so this only matters when NimBLE's host is paired with a
  third-party controller that does.\n\nThis issue affects Apache NimBLE: through 1.9.0.\n\
  \nUsers are recommended to upgrade to version 1.10.0, which fixes the issue."
