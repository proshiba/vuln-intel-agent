title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw88: Use devm_kmemdup() in rtw_set_supported_band()\n\nSimplify the code by using
  device managed memory allocations.\n\nThis also fixes a memory leak in rtw_register_hw().
  The supported bands\nwere not freed in the error path.\n\nCopied from commit 145df52a8671
  (\"wifi: rtw89: Convert\nrtw89_core_set_supported_band to use devm_*\")."
