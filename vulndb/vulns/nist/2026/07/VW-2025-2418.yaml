  does not support struct argument. This causes\na oops when running bpf selftest:\n\
  \n  $ ./test_progs -a tracing_struct\n  Oops[#1]:\n  CPU -1 Unable to handle kernel
  paging request at virtual address 0000000000000018, era == 9000000085bef268, ra
  == 90000000844f3938\n  rcu: INFO: rcu_preempt detected stalls on CPUs/tasks:\n \
  \ rcu:     1-...0: (19 ticks this GP) idle=1094/1/0x4000000000000000 softirq=1380/1382
