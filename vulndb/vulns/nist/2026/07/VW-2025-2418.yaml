  NMI from CPU 0 to CPUs 1:\n  rcu: rcu_preempt kthread starved for 2495 jiffies!
  g1197 f0x0 RCU_GP_DOING_FQS(6) ->state=0x0 ->cpu=2\n  rcu:     Unless rcu_preempt
  kthread gets sufficient CPU time, OOM is now expected behavior.\n  rcu: RCU grace-period
  kthread stack dump:\n  task:rcu_preempt     state:I stack:0     pid:15    tgid:15\
