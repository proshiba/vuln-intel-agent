title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI/IOV:
  Skip VF Resizable BAR restore on read error\n\nsriov_restore_vf_rebar_state() uses
  the VF Resizable BAR Control register\nto decide how many VF BARs to restore (nbars)
  and which VF BAR each\niteration addresses (bar_idx). bar_idx indexes into dev->sriov->barsz[],\n\
  which has only PCI_SRIOV_NUM_BARS (6) entries.\n\nWhen a device does not respond,
  config reads typically return\nPCI_ERROR_RESPONSE (~0).  Both fields are 3 bits
  wide, so nbars and bar_idx\nboth evaluate to 7. The barsz[] access then goes out
  of bounds.  UBSAN\nreports this as:\n\n  UBSAN: array-index-out-of-bounds in drivers/pci/iov.c:948:51
  index 7 is out of range for type 'resource_size_t [6]'\n\nObserved on an NVIDIA
  RTX PRO 1000 GPU (GB207GLM) that stopped responding\nduring a failed GC6 power state
  exit. The subsequent pci_restore_state()\ninvoked sriov_restore_vf_rebar_state()
  while config reads returned\n0xffffffff, triggering the splat.\n\nBail out if any
  VF "
