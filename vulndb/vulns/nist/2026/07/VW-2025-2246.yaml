title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_devcd_dump: fix out-of-bounds via dev_coredumpv\n\nCurrently both dev_coredumpv
  and skb_put_data in hci_devcd_dump use\nhdev->dump.head. However, dev_coredumpv
  can free the buffer. From\ndev_coredumpm_timeout documentation, which is used by
  dev_coredumpv:\n\n    > Creates a new device coredump for the given device. If a
  previous one hasn't\n    > been read yet, the new coredump is discarded. The data
  lifetime is determined\n    > by the device coredump framework and when it is no
  longer needed the @free\n    > function will be called to free the data.\n\nIf the
  data has not been read by the userspace yet, dev_coredumpv will\ndiscard new buffer,
  freeing hdev->dump.head. This leads to\nvmalloc-out-of-bounds error when skb_put_data
  tries to access\nhdev->dump.head.\n\nA crash report from syzbot illustrates this:\n\
  \n    ==================================================================\n    BUG:
  KASAN: vmalloc-out-of-bounds i"
