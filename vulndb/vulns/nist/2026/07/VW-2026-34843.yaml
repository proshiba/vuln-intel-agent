title: Discourse is an open-source discussion platform. From versions 
  2026.1.0-latest to before 2026.1.3, 2026.2.0-latest to before 2026.2.2, and 
  2026.3.0-latest to before 2026.3.0, an authenticated moderator-level user 
  could retrieve post content, topic titles, and usernames from categories they 
  were not authorized to view. Insufficient access controls on a sentiment 
  analytics endpoint allowed category permission boundaries to be bypassed. This
  issue has been patched in versions 2026.1.3, 2026.2.2, and 2026.3.0.
