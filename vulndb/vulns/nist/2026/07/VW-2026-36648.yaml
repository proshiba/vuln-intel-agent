title: facil.io 0.6.0 through 0.7.6 contains a denial-of-service vulnerability 
  in the multipart body parser that allows an unauthenticated remote attacker to
  permanently freeze worker processes at 100% CPU by sending a 
  multipart/form-data request with a partial closing boundary. The missing 
  progress guard in the parser loop causes http_mime_parse to return 0 bytes 
  consumed without setting done or error flags, causing the calling loop to 
  re-invoke the parser on the same buffer indefinitely, exhausting all workers 
  and permanently disabling the server until manually restarted.
