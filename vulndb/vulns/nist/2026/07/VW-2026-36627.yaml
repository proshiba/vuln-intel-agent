title: "Integer Underflow (Wrap or Wraparound) vulnerability in erlang otp erlang/otp
  (erts modules), erlang otp erts (erts modules) allows Forced Integer Overflow, Excessive
  Allocation. This vulnerability is associated with program files erts/emulator/beam/external.c,
  emulator/beam/external.c.\n\nThe BIT_BINARY_EXT tag (77) handler in the External
  Term Format (ETF) decoder accepts an encoding with both length and trailing-bits
  fields set to zero. The subsequent computation of the bitstring size underflows
  an unsigned integer, producing a value of roughly 2^64 that is then passed as a
  memory allocation size. The allocator aborts the entire node with a message such
  as \"Cannot allocate 2305843009213693951 bytes of memory (of type binary)\".\n\n\
  The crash is a VM-level abort, not an Erlang-level exception. It cannot be intercepted
