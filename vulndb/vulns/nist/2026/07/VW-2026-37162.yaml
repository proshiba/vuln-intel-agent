title: SuperPlane before 0.30.0 contains an SMTP header injection vulnerability 
  that allows unauthenticated attackers to inject arbitrary SMTP headers by 
  including CRLF sequences in the event payload title field delivered via 
  webhook. Attackers can manipulate the unsanitized title field passed to the 
  SMTP DATA command to add Bcc recipients for content exfiltration, forge the 
  From address to bypass SPF and DKIM checks, or inject Content-Type and MIME 
  boundary headers to corrupt message bodies for phishing.
