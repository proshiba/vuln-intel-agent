title: TinyWeb through 0.0.8 contains a path traversal vulnerability that allows
  unauthenticated attackers to read arbitrary files by submitting ../ sequences 
  in the URL path, which are concatenated directly to the configured web root in
  HttpBuilder::buildResponse() without normalization, dot-segment removal, or 
  boundary checks. Attackers can craft a single request with ../ sequences that 
  pass through the URL parser unchanged and reach the filesystem call via 
  HttpFile::setFile(), exposing sensitive files such as credential stores and 
  private keys when the server process runs as root.
