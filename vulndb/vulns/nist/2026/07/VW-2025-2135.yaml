title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  drv: netdevsim: don't napi_complete() from netpoll\n\nnetdevsim supports netpoll.
  Make sure we don't call napi_complete()\nfrom it, since it may not be scheduled.
  Breno reports hitting a\nwarning in napi_complete_done():\n\nWARNING: CPU: 14 PID:
  104 at net/core/dev.c:6592 napi_complete_done+0x2cc/0x560\n  __napi_poll+0x2d8/0x3a0\n\
  \  handle_softirqs+0x1fe/0x710\n\nThis is presumably after netpoll stole the SCHED
  bit prematurely."
