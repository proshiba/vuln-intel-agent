title: "Applications may be vulnerable to a Regular Expression Denial of Service (ReDoS)
  attack if an attacker is able to provide a pattern which is then directly or indirectly
  supplied to one of the following methods in AntPathMatcher: match(String pattern,
  String path), matchStart(String pattern, String path), extractUriTemplateVariables(String
  pattern, String path).\n\nAffected versions:\nSpring Framework 7.0.0 through 7.0.7;
  6.2.0 through 6.2.18; 6.1.0 through 6.1.27; 5.3.0 through 5.3.48."
