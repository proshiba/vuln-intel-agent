title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  logitech-hidpp: Check maxfield in hidpp_get_report_length()\n\nDo not crash when
  a report has no fields.\n\nFake USB gadgets can send their own HID report descriptors
  and can define report\nstructures without valid fields.  This can be used to crash
  the kernel over USB."
