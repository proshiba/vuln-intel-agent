title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix potential cfid UAF in smb2_query_info_compound\n\nWhen smb2_query_info_compound()
  retries, a previously allocated cfid may\nhave been freed in the first attempt.\n\
  Because cfid wasn't reset on replay, later cleanup could act on a stale\npointer,
  leading to a potential use-after-free.\n\nReinitialize cfid to NULL under the replay
  label.\n\nExample trace (trimmed):\n\nrefcount_t: underflow; use-after-free.\nWARNING:
  CPU: 1 PID: 11224 at ../lib/refcount.c:28 refcount_warn_saturate+0x9c/0x110\n[...]\n\
  RIP: 0010:refcount_warn_saturate+0x9c/0x110\n[...]\nCall Trace:\n <TASK>\n smb2_query_info_compound+0x29c/0x5c0
