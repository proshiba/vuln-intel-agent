title: A weakness has been identified in langflow-ai langflow up to 1.10.2. This
  affects the function eval of the file 
  src/lfx/src/lfx/components/llm_operations/lambda_filter.py of the component 
  LambdaFilterComponent. Executing a manipulation can lead to code injection. 
  The attack may be performed from remote. The exploit has been made available 
  to the public and could be used for attacks. The vendor was contacted early 
  about this disclosure but did not respond in any way.
