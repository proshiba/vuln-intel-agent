title: Ekushey Project Manager CRM through version 5.0 contains a stored 
  cross-site scripting vulnerability that allows authenticated client users to 
  inject arbitrary HTML and JavaScript by entering malicious payloads into the 
  client Name field on the Edit Profile page without sanitization. Attackers can
  craft and store malicious scripts that execute in the browser sessions of 
  Staff or Administrator users who view the Manage Clients or Manage Client 
  Projects pages where client names are rendered unsanitized.
