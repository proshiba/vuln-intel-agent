title: The WP Blockade plugin for WordPress is vulnerable to Missing 
  Authorization in all versions up to and including 0.9.14. The plugin registers
  an admin_post action hook 'wp-blockade-shortcode-render' that maps to the 
  render_shortcode_preview() function. This function lacks any capability check 
  (current_user_can()) and nonce verification, allowing any authenticated user 
  to execute arbitrary WordPress shortcodes. The function takes a user-supplied 
  'shortcode' parameter from $_GET, passes it through stripslashes(), and 
  directly executes it via do_shortcode(). This makes it possible for 
  authenticated attackers, with Subscriber-level access and above, to execute 
  arbitrary shortcodes, which could lead to information disclosure, privilege 
  escalation, or other impacts depending on what shortcodes are registered on 
  the site (e.g., shortcodes from other plugins that display sensitive data, 
  perform actions, or include files).
