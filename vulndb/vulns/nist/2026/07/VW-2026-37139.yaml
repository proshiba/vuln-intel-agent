title: The pglogical queue mechanism, used to convey out-of-band commands such 
  as replicated DDL from a publisher to a subscriber, executes message payloads 
  on the subscriber at the privilege level of the apply worker, which is 
  equivalent to a PostgreSQL superuser in default installations. A party acting 
  as the publisher can send crafted queue messages that cause arbitrary SQL to 
  be executed on the subscriber as superuser, escalating from a role permitted 
  to use pglogical to full superuser and breaking the isolation between tenants 
  in shared deployments. To exploit the issue an attacker must be able to direct
  a subscription at an endpoint they control. In default installations this 
  requires privileges normally reserved for a superuser, so the issue is most 
  relevant to managed deployments where the ability to create subscriptions has 
  been delegated to non-superuser roles.
