title: "The MAVLink communication protocol does not require cryptographic \nauthentication
  by default. When MAVLink 2.0 message signing is not \nenabled, any message -- including
  SERIAL_CONTROL, which provides \ninteractive shell access -- can be sent by an unauthenticated
  party with\n access to the MAVLink interface. PX4 provides MAVLink 2.0 message \n\
  signing as the cryptographic authentication mechanism for all MAVLink \ncommunication.
  When signing is enabled, unsigned messages are rejected \nat the protocol level."
