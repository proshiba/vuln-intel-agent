title: MCP Java SDK is the official Java SDK for Model Context Protocol servers 
  and clients. Prior to 1.0.0, the java-sdk contains a DNS rebinding 
  vulnerability. This vulnerability allows an attacker to access a locally or 
  network-private java-sdk MCP server via a victims browser that is either 
  local, or network adjacent. This allows an attacker to make any tool call to 
  the server as if they were a locally running MCP connected AI agent. This 
  vulnerability is fixed in 1.0.0.
