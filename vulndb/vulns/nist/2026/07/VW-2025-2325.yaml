  fix race condition validating r_parent before applying state\n\nAdd validation to
  ensure the cached parent directory inode matches the\ndirectory info in MDS replies.
  This prevents client-side race conditions\nwhere concurrent operations (e.g. rename)
  cause r_parent to become stale\nbetween request initiation and reply processing,
  which could lead to\napplying state changes to incorrect directory inodes.\n\n[
  idryomov: folded a kerneldoc fixup and a follow-up fix from Alex to\n  move CEPH_CAP_PIN
  reference when r_parent is updated:\n\n  When the parent directory lock is not held,
  req->r_parent can become\n  stale and is updated to point to the correct inode.\
