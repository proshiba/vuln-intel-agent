title: The PDFDraft – Drag & Drop PDF Builder, PDF Viewer, Embed & Download PDF,
  Certificate & Invoice Designer plugin for WordPress is vulnerable to 
  unauthorized access of data due to a missing capability check on the 
  serveTemplatePdfAjax() function and the serveTemplatePdf() REST route (which 
  is registered with `permission_callback => '__return_true'`) in versions up 
  to, and including, 1.1.0. This makes it possible for unauthenticated attackers
  to download stored template PDFs — which may contain customer PII, invoice, 
  order, and certificate data — by requesting the publicly registered admin-ajax
  action `pdfdraft_embed_pdf` or the REST endpoint 
  `/wp-json/pdfdraft/v1/embed-pdf/templates/{slug}/pdf` with a known or 
  guessable design slug, bypassing the plugin's own .
