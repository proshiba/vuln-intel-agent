title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmodule:
  decompress: check return value of module_extend_max_pages()\n\nmodule_extend_max_pages()
  calls kvrealloc() internally and returns\n-ENOMEM on allocation failure. The return
  value is never checked.\n\nIf the initial allocation fails, info->pages remains
  NULL and\ninfo->max_pages remains 0. Subsequent calls to module_get_next_page()\n\
  will attempt to dynamically grow the array by calling\nmodule_extend_max_pages(info,
  0) since info->used_pages is 0. This\nresults in kvrealloc(NULL, 0) returning ZERO_SIZE_PTR,
  which is treated\nas a success, leading to a dereference of ZERO_SIZE_PTR and a
  kernel\noops.\n\nFix: add the missing error check after module_extend_max_pages()
  and\nreturn immediately on failure. This matches the pattern used by every\nother
  kvrealloc() caller in the module loading path.\n\n[Sami: Corrected the analysis
  in the commit message.]"
