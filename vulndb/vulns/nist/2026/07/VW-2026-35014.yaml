title: Ella Core is a 5G core designed for private networks. Prior to version 
  1.8.0, Ella Core panics when processing a NGAP handover failure message. An 
  attacker able to cause a gNodeB to send NGAP handover failure messages to Ella
  Core can crash the process, causing service disruption for all connected 
  subscribers. This issue has been patched in version 1.8.0.
