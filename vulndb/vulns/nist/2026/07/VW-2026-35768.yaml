title: parseusbs before 1.9 contains an OS command injection vulnerability in 
  parseUSBs.py where LNK file paths are passed unsanitized into an os.popen() 
  shell command, allowing arbitrary command execution via crafted .lnk filenames
  containing shell metacharacters. An attacker can craft a .lnk filename with 
  embedded shell metacharacters that execute arbitrary commands on the forensic 
  examiner's machine during USB artifact parsing.
