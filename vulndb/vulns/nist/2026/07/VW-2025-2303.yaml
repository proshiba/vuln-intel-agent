title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  dm-crypt: Do not partially accept write BIOs with zoned targets\n\nRead and write
  operations issued to a dm-crypt target may be split\naccording to the dm-crypt internal
  limits defined by the max_read_size\nand max_write_size module parameters (default
  is 128 KB). The intent is\nto improve processing time of large BIOs by splitting
  them into smaller\noperations that can be parallelized on different CPUs.\n\nFor
  zoned dm-crypt targets, this BIO splitting is still done but without\nthe parallel
  execution to ensure that the issuing order of write\noperations to the underlying
  devices remains sequential. However, the\nsplitting itself causes other problems:\n\
