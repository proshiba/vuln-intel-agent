title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: net1080: validate packet_len before pad-byte access in rx_fixup\n\nFor an even
  packet_len, net1080_rx_fixup() reads the pad byte at\nskb->data[packet_len] before
  the skb->len != packet_len check further\ndown, and packet_len is only bounded against
  NC_MAX_PACKET. A malicious\nNetChip 1080 device can send a short frame advertising
  a large even\npacket_len (e.g. 0x4000), so the pad-byte read lands past the end
  of the\nskb:\n\n  BUG: KASAN: slab-out-of-bounds in net1080_rx_fixup\n  Read of
  size 1 at addr ffff8880106c83c6 by task ksoftirqd/0/14\n   ...\n   net1080_rx_fixup
  (drivers/net/usb/net1080.c:384)\n   usbnet_bh (drivers/net/usb/usbnet.c:1589)\n\
  \   process_one_work (kernel/workqueue.c:3322)\n   bh_worker (kernel/workqueue.c:3708)\n\
  \   tasklet_action (kernel/softirq.c:965)\n   handle_softirqs (kernel/softirq.c:622)\n\
  \   ...\n\nReject the frame when packet_len >= skb->len before reading."
