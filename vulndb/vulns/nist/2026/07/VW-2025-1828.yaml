title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: dwmac-tegra: Read iommu stream id from device tree\n\nNvidia's Tegra MGBE
  controllers require the IOMMU \"Stream ID\" (SID) to be\nwritten to the MGBE_WRAP_AXI_ASID0_CTRL
  register.\n\nThe current driver is hard coded to use MGBE0's SID for all controllers.\n\
  This causes softirq time outs and kernel panics when using controllers\nother than
  MGBE0.\n\nExample dmesg errors when an ethernet cable is connected to MGBE1:\n\n\
  [  116.133290] tegra-mgbe 6910000.ethernet eth1: Link is Up - 1Gbps/Full - flow
  control rx/tx\n[  121.851283] tegra-mgbe 6910000.ethernet eth1: NETDEV WATCHDOG:
  CPU: 5: transmit queue 0 timed out 5690 ms\n[  121.851782] tegra-mgbe 6910000.ethernet
  eth1: Reset adapter.\n[  121.892464] tegra-mgbe 6910000.ethernet eth1: Register
  MEM_TYPE_PAGE_POOL RxQ-0\n[  121.905920] tegra-mgbe 6910000.ethernet eth1: PHY [stmmac-1:00]
  driver [Aquantia AQR113] (irq=171)\n[  121.907356] tegra-mgbe 6910000.ethernet eth1:
  Enabling "
