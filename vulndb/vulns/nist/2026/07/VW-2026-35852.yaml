title: Adobe Framemaker versions 2022.8 and earlier are affected by an Untrusted
  Search Path vulnerability that might allow attackers to execute arbitrary code
  in the context of the current user. If the application uses a search path to 
  locate critical resources such as programs, then an attacker could modify that
  search path to point to a malicious program, which the targeted application 
  would then execute. Exploitation of this issue does not require user 
  interaction.
