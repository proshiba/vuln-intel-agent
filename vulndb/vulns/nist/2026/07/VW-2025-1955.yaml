title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  detect and prevent references to a freed transport in sendmsg\n\nsctp_sendmsg()
  re-uses associations and transports when possible by\ndoing a lookup based on the
  socket endpoint and the message destination\naddress, and then sctp_sendmsg_to_asoc()
  sets the selected transport in\nall the message chunks to be sent.\n\nThere's a
  possible race condition if another thread triggers the removal\nof that selected
  transport, for instance, by explicitly unbinding an\naddress with setsockopt(SCTP_SOCKOPT_BINDX_REM),
  after the chunks have\nbeen set up and before the message is sent. This can happen
  if the send\nbuffer is full, during the period when the sender thread temporarily\n\
  releases the socket lock in sctp_wait_for_sndbuf().\n\nThis causes the access to
  the transport data in\nsctp_outq_select_transport(), when the association outqueue
  is flushed,\nto result in a use-after-free read.\n\nThis change avoids this scenario
