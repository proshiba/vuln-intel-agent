title: In schreibfaul1 ESP32-audioI2S 3.4.5, a heap-based buffer overflow 
  vulnerability exists in the WAV header parsing function read_WAV_Header(). The
  function reads untrusted chunk size and bytes-to-skip value directly from 
  malicious WAV files without reasonable range restriction. Abnormally large bts
  and headerSize values lead to out-of-bounds heap memory read/write during 
  header parsing, which can be exploited to execute arbitrary code, disclose 
  sensitive information, cause denial of service or escalate privileges.
