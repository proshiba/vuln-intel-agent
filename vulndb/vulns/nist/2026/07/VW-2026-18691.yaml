title: Server-Side Request Forgery in the markdown_to_pdf action of Rapid7 
  InsightConnect Markdown Plugin on Linux in versions prior to 4.0.2 allows 
  remote attackers to make arbitrary outbound HTTP requests via unsanitized 
  resource-loading HTML elements (img/src, CSS url(), @import) embedded in 
  Markdown input. The initial fix in 4.0.0 disabled JavaScript but did not 
  neutralize resource-loading vectors. Resolved in 4.0.2 by sanitizing HTML with
  an allowlist of tags, attributes, and URL schemes.
