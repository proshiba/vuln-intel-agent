title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  fgraph: Fix stack layout to match __arch_ftrace_regs argument of ftrace_return_to_handler\n\
  \nNaresh Kamboju reported a \"Bad frame pointer\" kernel warning while\nrunning
  LTP trace ftrace_stress_test.sh in riscv. We can reproduce the\nsame issue with
  the following command:\n\n```\n$ cd /sys/kernel/debug/tracing\n$ echo 'f:myprobe
  do_nanosleep%return args1=$retval' > dynamic_events\n$ echo 1 > events/fprobes/enable\n\
  $ echo 1 > tracing_on\n$ sleep 1\n```\n\nAnd we can get the following kernel warning:\n\
  \n[  127.692888] ------------[ cut here ]------------\n[  127.693755] Bad frame
  pointer: expected ff2000000065be50, received ba34c141e9594000\n[  127.693755]  \
  \ from func do_nanosleep return to ffffffff800ccb16\n[  127.698699] WARNING: CPU:
  1 PID: 129 at kernel/trace/fgraph.c:755 ftrace_return_to_handler+0x1b2/0x1be\n[\
  \  127.699894] Modules linked in:\n[  127.700908] CPU: 1 UID: 0 PID: 129 Comm: sleep
  Not tainted 6.14.0-rc3-g0ab191c74642 #"
