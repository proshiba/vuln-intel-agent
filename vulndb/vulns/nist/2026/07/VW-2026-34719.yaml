title: In epa4all, prior to version 2026-05-20, an attacker who can intercept 
  the TLS connection between epa4all and the ePA backend can complete the VAU 
  handshake with attacker-controlled keys and obtain the session encryption 
  keys. All inner HTTP traffic (patient consent decisions, medication data, 
  document operations, authorization tokens, and entitlement queries) becomes 
  readable and modifiable. The attacker can also inject arbitrary requests 
  through the hijacked channel. This issue has been patched in version 
  2026-05-20.
