title: Xlight FTP Server before 3.9.5 contains a pre-authentication stack buffer
  overflow vulnerability that allows unauthenticated attackers to corrupt stack 
  memory by sending malformed SSH packets when a GCM cipher is negotiated. 
  Attackers can craft packets with an unvalidated length field passed directly 
  to the GCM decrypt function, overwriting the stack cookie and return address 
  to potentially achieve remote code execution before any authentication occurs.
