title: "A Server-Side Template Injection (SSTI) vulnerability was identified \nin
  the mail template functionality of the Axway SecureTransport product in version
  5.5-20260326. This \nflaw \nallows an attacker with admin privileges to inject arbitrary
  Java code expressions, which are \nexecuted server-side when the template is rendered
  (i.e., during email \nsending). Successful exploitation of this flaw allows an attacker
  to \nexecute \narbitrary code on the server that results in full host compromise.\n\
  \n\n\nThis issue affects all Axway SecureTransport versions prior 5.5-20260528 update."
