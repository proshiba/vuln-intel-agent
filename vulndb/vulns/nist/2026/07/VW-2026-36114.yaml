title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: avoid NULL deref of conn in iso_conn_big_sync()\n\niso_conn_big_sync() drops
  the socket lock to call hci_get_route() and\nthen re-acquires it, but dereferences
  iso_pi(sk)->conn->hcon afterwards\nwithout re-checking that conn is still valid.\n\
  \nWhile the lock is dropped, the connection can be torn down under the\nsame socket
  lock: iso_disconn_cfm() -> iso_conn_del() -> iso_chan_del()\nsets iso_pi(sk)->conn
  to NULL (and the broadcast teardown path can also\nclear conn->hcon on its own).
  When iso_conn_big_sync() re-acquires the\nlock and reads conn->hcon, conn may be
  NULL, causing a NULL pointer\ndereference (hcon is the first member of struct iso_conn).\n\
  \nThis path is reached from iso_sock_recvmsg() for a PA-sync broadcast\nsink socket
  (BT_SK_DEFER_SETUP | BT_SK_PA_SYNC), so the dropped-lock\nwindow can race with connection
  teardown driven by controller events.\n\nRe-validate iso_pi(sk)->conn and its hcon
  after re-acqui"
