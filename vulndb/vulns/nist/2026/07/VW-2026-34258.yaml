title: A vulnerability was identified in NASA cFS up to 7.0.0 on 32-bit. 
  Affected is the function CFE_TBL_ValidateCodecLoadSize of the file 
  cfe/modules/tbl/fsw/src/cfe_tbl_passthru_codec.c. The manipulation leads to 
  integer overflow. The complexity of an attack is rather high. The 
  exploitability is told to be difficult. A fix is planned for the upcoming 
  version milestone of the project.
