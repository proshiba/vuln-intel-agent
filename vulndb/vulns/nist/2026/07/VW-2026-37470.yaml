  delayed work item is initialized within\nalps_reconnect() and scheduled upon receipt
  of the first bare\nPS/2 packet from an external PS/2 device connected to the ALPS\n\
  touchpad. During device detachment, the original implementation\ncalls flush_workqueue()
  in psmouse_disconnect() to ensure\ncompletion of dev3_register_work. However, the
  flush_workqueue()\nin psmouse_disconnect() only blocks and waits for work items
  that\nwere already queued to the workqueue prior to its invocation. Any\nwork items
