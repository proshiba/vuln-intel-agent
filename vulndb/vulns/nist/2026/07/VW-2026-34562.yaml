status: active
title: A flaw was found in dbus-broker. When the process file-descriptor limit 
  is reached, EMFILE/ENFILE errors during peer setup (notably SO_PEERPIDFD) are 
  handled as fatal failures, causing the broker to exit. A local attacker who 
  can open many connections to the user session bus can trigger this and deny 
  service to the desktop session. Flatpak applications can reach the host 
  session bus through the dbus proxy.
