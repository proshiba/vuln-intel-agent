title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  abort vma_modify() on merge out of memory failure\n\nThe remainder of vma_modify()
  relies upon the vmg state remaining pristine\nafter a merge attempt.\n\nUsually
  this is the case, however in the one edge case scenario of a merge\nattempt failing
  not due to the specified range being unmergeable, but\nrather due to an out of memory
  error arising when attempting to commit the\nmerge, this assumption becomes untrue.\n\
  \nThis results in vmg->start, end being modified, and thus the proceeding\nattempts
  to split the VMA will be done with invalid start/end values.\n\nThankfully, it is
  likely practically impossible for us to hit this in\nreality, as it would require
  a maple tree node pre-allocation failure that\nwould likely never happen due to
  it being 'too small to fail', i.e.  the\nkernel would simply keep retrying reclaim
  until it succeeded.\n\nHowever, this scenario remains theoretically possible, and
  what we are\ndoing here is wrong so"
