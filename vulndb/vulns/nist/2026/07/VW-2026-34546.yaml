title: "GNU coreutils unexpand is vulnerable to a heap-based buffer overflow due to
  an integer overflow during buffer allocation when processing large tab stop (-t)
  values. The multiplication used to calculate the allocation size can wrap around,
  resulting in an undersized buffer.\nWhen processing crafted input, subsequent writes
  exceed the allocated memory, leading to an out‑of‑bounds heap write.\n\nWhen running
  GNU coreutils unexpand with attacker-provided large tab stop (-t) arguments, this
  behavior leads to a crash and potentially achieve a heap write primitive depending
  on memory layout.\n\n\n\n\n\n\n\n\n\n\nThis issue has been fixed in the commit b60a159fdc5bfcf9988d3a4cb6f53abe8ad5d35d"
