title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  fix double free in rvu_rep_rsrc_init()\n\nrvu_rep_rsrc_init() allocates queue memory
  before calling\notx2_init_hw_resources(). When hardware resource setup fails,\n\
  otx2_init_hw_resources() already unwinds the partially initialized\nSQ, CQ, and
  aura state before returning an error. The representor\nerror path then calls otx2_free_hw_resources()
  again and can free\nthe same resources a second time.\n\nFix this by splitting the
  cleanup labels so that a failure from\notx2_init_hw_resources() only releases queue
  memory. Keep the\notx2_free_hw_resources() call for failures that happen after\n\
  hardware resource initialization completed successfully.\n\nThe bug was first flagged
  by an experimental analysis tool we are\ndeveloping for kernel memory-management
  bugs while analyzing\nv6.13-rc1. The tool is still under development and is not
  yet publicly\navailable. Manual inspection confirms that the bug is still\npresent
  in v7.1-rc3."
