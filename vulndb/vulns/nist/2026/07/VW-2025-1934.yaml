title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix mlx5_poll_one() cur_qp update flow\n\nWhen cur_qp isn't NULL, in order to avoid
  fetching the QP from\nthe radix tree again we check if the next cqe QP is identical
  to\nthe one we already have.\n\nThe bug however is that we are checking if the QP
  is identical by\nchecking the QP number inside the CQE against the QP number inside
  the\nmlx5_ib_qp, but that's wrong since the QP number from the CQE is from\nFW so
  it should be matched against mlx5_core_qp which is our FW QP\nnumber.\n\nOtherwise
  we could use the wrong QP when handling a CQE which could\ncause the kernel trace
  below.\n\nThis issue is mainly noticeable over QPs 0 & 1, since for now they are\n\
  the only QPs in our driver whereas the QP number inside mlx5_ib_qp\ndoesn't match
  the QP number inside mlx5_core_qp.\n\nBUG: kernel NULL pointer dereference, address:
  0000000000000012\n #PF: supervisor read access in kernel mode\n #PF: error_code(0x0000)
  - not-present page\n PGD"
