title: "A flaw was found in the TokenManager component of the Keycloak identity management
  service. When an administrator attempts to revoke tokens for a specific application
  (client) using a \"not-before\" policy, the revocation may be silently ignored if
  the overall security realm already has an older, non-zero revocation policy in place.
  This issue can allow previously issued tokens to remain valid for refreshing sessions
  and accessing user information even after an administrator has attempted to invalidate
  them.\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
