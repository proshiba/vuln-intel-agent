title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc,
  afs: Fix peer hash locking vs RCU callback\n\nIn its address list, afs now retains
  pointers to and refs on one or more\nrxrpc_peer objects.  The address list is freed
  under RCU and at this time,\nit puts the refs on those peers.\n\nNow, when an rxrpc_peer
  object runs out of refs, it gets removed from the\npeer hash table and, for that,
  rxrpc has to take a spinlock.  However, it\nis now being called from afs's RCU cleanup,
  which takes place in BH\ncontext - but it is just taking an ordinary spinlock.\n\
  \nThe put may also be called from non-BH context, and so there exists the\npossibility
  of deadlock if the BH-based RCU cleanup happens whilst the hash\nspinlock is held.\
  \  This led to the attached lockdep complaint.\n\nFix this by changing spinlocks
  of rxnet->peer_hash_lock back to\nBH-disabling locks.\n\n    ================================\n\
  \    WARNING: inconsistent lock state\n    6.13.0-rc5-build2+ #1223 Tainted: G \
  \           E\n   "
