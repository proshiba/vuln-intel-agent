title: "UBB.threads is vulnerable to Blind SQL Injection, allowing attackers with
  access to the Members in Control Panel to interact with the underlying database.
  Due to insufficient input sanitization, an attacker can extract sensitive information,
  such as user credentials, by manipulating SQL queries through time-based or boolean-based
  techniques. \nBecause vendor contact attempts were unsuccessful, the vulnerability
  has only been confirmed in version 7.7.5 but may also affect other versions."
