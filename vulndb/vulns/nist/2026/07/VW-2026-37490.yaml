title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/gem:
  Zero-initialize the eb.vma array in i915_gem_do_execbuffer\n\nInitialize the eb.vma
  array with values of 0 when the eb structure is\nfirst set up. In particular, this
  sets the eb->vma[i].vma pointers to\nNULL, simplifying cleanup and getting rid of
  the bug described below.\n\nDuring the execution of eb_lookup_vmas(), the eb->vma
  array is\nsuccessively filled up with struct eb_vma objects. This process includes\n\
  calling eb_add_vma(), which might fail; however, even in the event of\nfailure,
  eb->vma[i].vma is set for the currently processed buffer.\n\nIf eb_add_vma() fails,
  eb_lookup_vmas() returns with an error, which\nprompts a call to eb_release_vmas()
  to clean up the mess. Since\neb_lookup_vmas() might fail during processing any (possibly
  not first)\nbuffer, eb_release_vmas() checks whether a buffer's vma is NULL to know\n\
  at what point did the lookup function fail.\n\nIn eb_lookup_vmas(), eb->vma[i].vma
  is set to NULL "
