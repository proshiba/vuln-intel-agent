title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  mtu3: unmap request DMA on queue failure\n\nmtu3_gadget_queue() maps the request
  before checking whether\nthe QMU GPD ring can accept another transfer. the request
  is\nreturned with -EAGAIN before it is linked on the endpoint\nrequest list if mtu3_prepare_transfer()
  fails.\n\nNormal completion and dequeue paths unmap requests from\nmtu3_req_complete(),
  but this error path never reaches that\nhelper, so the DMA mapping is left active.
  Unmap the request\nbefore returning from the failed queue path."
