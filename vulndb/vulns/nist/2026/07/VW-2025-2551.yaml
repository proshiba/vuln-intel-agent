title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix double free of qgroup record after failure to add delayed ref head\n\nIn the
  previous code it was possible to incur into a double kfree()\nscenario when calling
  add_delayed_ref_head(). This could happen if the\nrecord was reported to already
  exist in the\nbtrfs_qgroup_trace_extent_nolock() call, but then there was an error\n\
  later on add_delayed_ref_head(). In this case, since\nadd_delayed_ref_head() returned
  an error, the caller went to free the\nrecord. Since add_delayed_ref_head() couldn't
  set this kfree'd pointer\nto NULL, then kfree() would have acted on a non-NULL 'record'
  object\nwhich was pointing to memory already freed by the callee.\n\nThe problem
  comes from the fact that the responsibility to kfree the\nobject is on both the
  caller and the callee at the same time. Hence, the\nfix for this is to shift the
  ownership of the 'qrecord' object out of\nthe add_delayed_ref_head(). That is, we
  will never attempt to kfre"
