title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmc:
  Use __sk_dst_get() and dst_dev_rcu() in smc_clc_prfx_match().\n\nsmc_clc_prfx_match()
  is called from smc_listen_work() and\nnot under RCU nor RTNL.\n\nUsing sk_dst_get(sk)->dev
  could trigger UAF.\n\nLet's use __sk_dst_get() and dst_dev_rcu().\n\nNote that the
  returned value of smc_clc_prfx_match() is not\nused in the caller."
