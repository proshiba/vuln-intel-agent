title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  Don't call reqsk_fastopen_remove() in tcp_conn_request().\n\nsyzbot reported the
  splat below in tcp_conn_request(). [0]\n\nIf a listener is close()d while a TFO
  socket is being processed in\ntcp_conn_request(), inet_csk_reqsk_queue_add() does
  not set reqsk->sk\nand calls inet_child_forget(), which calls tcp_disconnect() for
  the\nTFO socket.\n\nAfter the cited commit, tcp_disconnect() calls reqsk_fastopen_remove(),\n\
  where reqsk_put() is called due to !reqsk->sk.\n\nThen, reqsk_fastopen_remove()
  in tcp_conn_request() decrements the\nlast req->rsk_refcnt and frees reqsk, and
  __reqsk_free() at the\ndrop_and_free label causes the refcount underflow for the
  listener\nand double-free of the reqsk.\n\nLet's remove reqsk_fastopen_remove()
  in tcp_conn_request().\n\nNote that other callers make sure tp->fastopen_rsk is
  not NULL.\n\n[0]:\nrefcount_t: underflow; use-after-free.\nWARNING: CPU: 12 PID:
  5563 at lib/refcount.c:28 refcount_warn_saturate"
