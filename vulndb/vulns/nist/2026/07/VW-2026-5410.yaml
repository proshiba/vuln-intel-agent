title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  algif_aead - Fix minimum RX size check for decryption\n\nThe check for the minimum
  receive buffer size did not take the\ntag size into account during decryption. \
  \ Fix this by adding the\nrequired extra length."
