title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmc:
  Fix use-after-free in __pnet_find_base_ndev().\n\nsyzbot reported use-after-free
  of net_device in __pnet_find_base_ndev(),\nwhich was called during connect(). [0]\n\
  \nsmc_pnet_find_ism_resource() fetches sk_dst_get(sk)->dev and passes\ndown to pnet_find_base_ndev(),
  where RTNL is held.  Then, UAF happened\nat __pnet_find_base_ndev() when the dev
  is first used.\n\nThis means dev had already been freed before acquiring RTNL in\n\
  pnet_find_base_ndev().\n\nWhile dev is going away, dst->dev could be swapped with
  blackhole_netdev,\nand the dev's refcnt by dst will be released.\n\nWe must hold
  dev's refcnt before calling smc_pnet_find_ism_resource().\n\nAlso, smc_pnet_find_roce_resource()
  has the same problem.\n\nLet's use __sk_dst_get() and dst_dev_rcu() in the two functions.\n\
  \n[0]:\nBUG: KASAN: use-after-free in __pnet_find_base_ndev+0x1b1/0x1c0 net/smc/smc_pnet.c:926\n\
  Read of size 1 at addr ffff888036bac33a by task syz.0.3632/18609\n\nCPU: 1 "
