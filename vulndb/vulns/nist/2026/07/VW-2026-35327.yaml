title: Parse Server is an open source backend that can be deployed to any 
  infrastructure that can run Node.js. Prior to 8.6.73 and 9.7.1-alpha.4, a file
  can be uploaded with a filename extension that passes the file extension 
  allowlist (e.g., .txt) but with a Content-Type header that differs from the 
  extension (e.g., text/html). The Content-Type is passed to the storage adapter
  without consistency validation. Storage adapters that store and serve the 
  provided Content-Type (such as S3 or GCS) serve the file with the mismatched 
  Content-Type. The default GridFS adapter is not affected because it derives 
  Content-Type from the filename at serving time. This vulnerability is fixed in
  8.6.73 and 9.7.1-alpha.4.
