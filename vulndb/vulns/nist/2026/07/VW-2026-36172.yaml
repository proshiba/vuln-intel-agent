title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  altera: Fix resource leaks on probe failure\n\nThe chained IRQ handler is set during
  probe, but is only removed during the\ndriver remove(). If pci_host_probe() fails,
  the handler and INTx IRQ\ndomain remain set even though the devm-managed host bridge
  storage\ncontaining struct altera_pcie will be released, leaving the handler with\n\
  a stale data pointer.\n\nInterrupts are also enabled before pci_host_probe() is
  called. If probe\nfails after that point, the controller interrupt source should
  be disabled\nbefore the chained handler and INTx domain are removed.\n\nSo set the
  chained handler only after the INTx domain has been created.\nDisable controller
  interrupts during IRQ teardown, and tear the IRQ setup\ndown if pci_host_probe()
  fails.\n\n[mani: commit log]"
