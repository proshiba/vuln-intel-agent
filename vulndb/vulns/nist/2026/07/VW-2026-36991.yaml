title: "Allocation of Resources Without Limits or Throttling vulnerability in ninenines
  cowboy allows an unauthenticated remote attacker to exhaust connection process memory
  over HTTP/1.1.\n\nThe HTTP/1.1 handler in cowboy_http enforces the max_headers limit
  by counting the number of distinct header names in a map (maps:size(Headers)). When
  a request contains multiple header lines with the same name, the values are concatenated
  into a single ever-growing binary stored under that one map key (\", \" for regular
  headers, \"; \" for cookies), so the map size stays at one and the max_headers cap
  (default 100) is never reached. Because no accumulator bounds the total number of
  header lines or the total byte size of the header block (only per-line max_header_name_length
  and max_header_value_length apply), an unauthenticated client can send an arbitrary
  number of header lines with the same name and grow the connection process's binary
