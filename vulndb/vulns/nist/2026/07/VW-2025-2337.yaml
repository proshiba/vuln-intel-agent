title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wilc1000: avoid buffer overflow in WID string configuration\n\nFix the following
  copy overflow warning identified by Smatch checker.\n\n drivers/net/wireless/microchip/wilc1000/wlan_cfg.c:184
  wilc_wlan_parse_response_frame()\n        error: '__memcpy()' 'cfg->s[i]->str' copy
  overflow (512 vs 65537)\n\nThis patch introduces size check before accessing the
  memory buffer.\nThe checks are base on the WID type of received data from the firmware.\n\
  For WID string configuration, the size limit is determined by individual\nelement
  size in 'struct wilc_cfg_str_vals' that is maintained in 'len' field\nof 'struct
  wilc_cfg_str'."
