title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse:
  fix runtime warning on truncate_folio_batch_exceptionals()\n\nThe WARN_ON_ONCE is
  introduced on truncate_folio_batch_exceptionals() to\ncapture whether the filesystem
  has removed all DAX entries or not.\n\nAnd the fix has been applied on the filesystem
  xfs and ext4 by the commit\n0e2f80afcfa6 (\"fs/dax: ensure all pages are idle prior
  to filesystem\nunmount\").\n\nApply the missed fix on filesystem fuse to fix the
  runtime warning:\n\n[    2.011450] ------------[ cut here ]------------\n[    2.011873]
