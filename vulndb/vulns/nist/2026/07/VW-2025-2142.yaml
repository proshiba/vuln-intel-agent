title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: Prevent sending WMI commands to firmware during firmware crash\n\nCurrently,
  we encounter the following kernel call trace when a firmware\ncrash occurs. This
  happens because the host sends WMI commands to the\nfirmware while it is in recovery,
  causing the commands to fail and\nresulting in the kernel call trace.\n\nSet the
  ATH12K_FLAG_CRASH_FLUSH and ATH12K_FLAG_RECOVERY flags when the\nhost driver receives
  the firmware crash notification from MHI. This\nprevents sending WMI commands to
  the firmware during recovery.\n\nCall Trace:\n <TASK>\n dump_stack_lvl+0x75/0xc0\n\
  \ register_lock_class+0x6be/0x7a0\n ? __lock_acquire+0x644/0x19a0\n __lock_acquire+0x95/0x19a0\n\
  \ lock_acquire+0x265/0x310\n ? ath12k_ce_send+0xa2/0x210 [ath12k]\n ? find_held_lock+0x34/0xa0\n\
  \ ? ath12k_ce_send+0x56/0x210 [ath12k]\n _raw_spin_lock_bh+0x33/0x70\n ? ath12k_ce_send+0xa2/0x210
  [ath12k]\n ath12k_ce_send+0xa2/0x210 [ath12k]\n ath12k_htc_send+0x178/0x390 [at"
