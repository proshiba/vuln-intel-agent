title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: Fix slab-use-after-free in l2cap_connect()\n\nExtend a critical section to
  prevent chan from early freeing.\nAlso make the l2cap_connect() return type void.
  Nothing is using the\nreturned value but it is ugly to return a potentially freed
  pointer.\nMaking it void will help with backports because earlier kernels did use\n\
  the return value. Now the compile will break for kernels where this\npatch is not
  a complete fix.\n\nCall stack summary:\n\n[use]\nl2cap_bredr_sig_cmd\n  l2cap_connect\n\
  \  ┌ mutex_lock(&conn->chan_lock);\n  │ chan = pchan->ops->new_connection(pchan);
  <- alloc chan\n  │ __l2cap_chan_add(conn, chan);\n  │   l2cap_chan_hold(chan);\n\
  \  │   list_add(&chan->list, &conn->chan_l);   ... (1)\n  └ mutex_unlock(&conn->chan_lock);\n\
  \    chan->conf_state              ... (4) <- use after free\n\n[free]\nl2cap_conn_del\n\
  ┌ mutex_lock(&conn->chan_lock);\n│ foreach chan in conn->chan_l:            ...
  (2)\n│   l2cap_chan_put(chan"
