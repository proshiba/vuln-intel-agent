title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  dell_rbu: Fix list usage\n\nPass the correct list head to list_for_each_entry*()
  when looping through\nthe packet list.\n\nWithout this patch, reading the packet
  data via sysfs will show the data\nincorrectly (because it starts at the wrong packet),
  and clearing the\npacket list will result in a NULL pointer dereference."
