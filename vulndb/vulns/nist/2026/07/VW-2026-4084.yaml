title: 'A vulnerability was found in vLLM up to 0.19.0. The affected element is the
  function has_mamba_layers of the file vllm/v1/kv_cache_interface.py of the component
  KV Block Handler. Performing a manipulation results in uninitialized resource. It
  is possible to initiate the attack remotely. The attack is considered to have high
  complexity. The exploitability is described as difficult. The exploit has been made
  public and could be used. The existence of this vulnerability is still disputed
  at present. The proposed patch did not fix the issue. A 3rd party explains: "The
  divergence could be explained by a benign and expected vLLM behavior where vLLM
  server could group concurrent requests together resulting in different input shapes
  based on varying request arrival time. The differences in grouped input shapes could
  call different kernels with could produce difference results due to rounding and
  differences in order of operations. There is an environment variable VLLM_BATCH_INVARIANT=1
  for use'
