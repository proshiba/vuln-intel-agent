title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  media: ipu7: fix double-free and use-after-free in error paths\n\nIn both ipu7_isys_init()
  and ipu7_psys_init(), pdata is allocated and\nthen passed to ipu7_bus_initialize_device(),
  which stores it in\nadev->pdata. The ipu7_bus_release() function frees adev->pdata
  when the\ndevice's reference count drops to zero.\n\nTwo error paths incorrectly
  call kfree(pdata) after the device teardown\nhas already freed it:\n\n1. When ipu7_mmu_init()
  fails: put_device() is called, which drops the\n   reference count to zero and triggers
  ipu7_bus_release() ->\n   kfree(pdata). The subsequent kfree(pdata) is a double-free.\n\
  \n2. When ipu7_bus_add_device() fails: it calls auxiliary_device_uninit()\n   internally,
  which calls put_device() -> ipu7_bus_release() ->\n   kfree(pdata). The subsequent
