title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  fix use-after-free in taprio_dev_notifier\n\nSince taprio’s taprio_dev_notifier()
  isn’t protected by an\nRCU read-side critical section, a race with advance_sched()\n\
  can lead to a use-after-free.\n\nAdding rcu_read_lock() inside taprio_dev_notifier()
  prevents this."
