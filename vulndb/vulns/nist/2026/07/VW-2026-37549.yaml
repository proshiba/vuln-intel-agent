title: "Autel MaxiCharger AC Elite Home USB Authentication Bypass Vulnerability. This
  vulnerability allows physically present attackers to bypass authentication on affected
  installations of Autel MaxiCharger AC Elite Home EV chargers. Authentication is
  not required to exploit this vulnerability.\n\nThe specific flaw exists within the
  exposed USB interface. The issue results from the lack of authentication prior to
  allowing access to functionality. An attacker can leverage this vulnerability to
  bypass authentication on the system. Was ZDI-CAN-29046."
