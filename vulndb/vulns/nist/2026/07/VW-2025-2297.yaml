title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: Decrement TID on RX peer frag setup error handling\n\nCurrently, TID is
  not decremented before peer cleanup, during error\nhandling path of ath12k_dp_rx_peer_frag_setup().
  This could lead to\nout-of-bounds access in peer->rx_tid[].\n\nHence, add a decrement
  operation for TID, before peer cleanup to\nensures proper cleanup and prevents out-of-bounds
  access issues when\nthe RX peer frag setup fails.\n\nFound during code review. Compile
  tested only."
