title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  gyro: bmg160: bail out when bandwidth/filter is not in table\n\nbmg160_get_filter()
  walks bmg160_samp_freq_table[] looking for the entry\nmatching the bw_bits value
  read from the chip:\n\n\tfor (i = 0; i < ARRAY_SIZE(bmg160_samp_freq_table); ++i)
  {\n\t\tif (bmg160_samp_freq_table[i].bw_bits == bw_bits)\n\t\t\tbreak;\n\t}\n\t\
  *val = bmg160_samp_freq_table[i].filter;\n\nIf no entry matches, i ends up equal
  to the array size and the next line\nreads one slot past the end. bmg160_set_filter()
  has the same shape, driven\nby 'val' instead of bw_bits.\n\nsmatch flags both:\n\
  \n  drivers/iio/gyro/bmg160_core.c:204 bmg160_get_filter() error:\n  buffer overflow
  'bmg160_samp_freq_table' 7 <= 7\n  drivers/iio/gyro/bmg160_core.c:222 bmg160_set_filter()
  error:\n  buffer overflow 'bmg160_samp_freq_table' 7 <= 7\n\nReturn -EINVAL when
  no entry matches.\n\nThe set_filter() path is reachable from userspace via the sysfs\n\
  in_anglvel_filter_low_pass_3db_frequency int"
