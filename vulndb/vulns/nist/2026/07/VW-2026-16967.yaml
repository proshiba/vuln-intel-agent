title: AutoGPT is a workflow automation platform for creating, deploying, and 
  managing continuous artificial intelligence agents. Prior to 0.6.63, 
  `MediaDurationBlock` will download and store the video in a temporary 
  directory without deleting before all noded are done. `StepThroughItemsBlock` 
  can be used to iterate `MediaDurationBlock` multiple times. 
  `StepThroughItemsBlock` does not limit the number of loops. In addition, 
  `MediaDurationBlock ` does not limit the amount of disk space consumed in the 
  current working directory and does not delete the video after outputing the 
  result. When a malicious user chooses to screen shot many web pages, the disk 
  space will eventually run out, causing a DoS. Version 0.6.63 patches the 
  issue.
