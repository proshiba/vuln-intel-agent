title: "Improper certificate validation in the identity provider connection components
  in Amazon Athena ODBC driver before 2.1.0.0 might allow a man-in-the-middle threat
  actor to intercept authentication credentials due to insufficient default transport
  security when connecting to identity providers. This only applies to connections
  with external identity providers and does not apply to connections with Athena.\n\
  \nTo remediate this issue, users should upgrade to version 2.1.0.0."
