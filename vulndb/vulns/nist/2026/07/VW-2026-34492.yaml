title: 9Router before 0.4.72 contains a server-side request forgery (SSRF) 
  vulnerability in the /v1/web/fetch endpoint. The endpoint accepts a 
  user-controlled url parameter and passes it to a configured external scraping 
  provider (Firecrawl, Jina Reader, Tavily, or Exa) to fetch content. The URL is
  only validated as syntactically valid via new URL() with no blocklist for 
  private IP ranges, cloud metadata endpoints (e.g., 169.254.169.254), 
  link-local addresses, or internal hostnames. An authenticated or 
  locally-connected user can cause the server to fetch arbitrary internal URLs 
  and have the response content returned, enabling read-access SSRF that can 
  expose cloud metadata credentials, reach internal services, and bypass 
  authentication on localhost endpoints.
