title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmshv:
  Fix use-after-free in mshv_map_user_memory error path\n\nIn the error path of mshv_map_user_memory(),
  calling vfree() directly on\nthe region leaves the MMU notifier registered. When
  userspace later unmaps\nthe memory, the notifier fires and accesses the freed region,
  causing a\nuse-after-free and potential kernel panic.\n\nReplace vfree() with mshv_partition_put()
  to properly unregister\nthe MMU notifier before freeing the region."
