title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio-net:
  xsk: rx: fix the frame's length check\n\nWhen calling buf_to_xdp, the len argument
  is the frame data's length\nwithout virtio header's length (vi->hdr_len). We check
  that len with\n\n\txsk_pool_get_rx_frame_size() + vi->hdr_len\n\nto ensure the provided
  len does not larger than the allocated chunk\nsize. The additional vi->hdr_len is
  because in virtnet_add_recvbuf_xsk,\nwe use part of XDP_PACKET_HEADROOM for virtio
  header and ask the vhost\nto start placing data from\n\n\thard_start + XDP_PACKET_HEADROOM
  - vi->hdr_len\nnot\n\thard_start + XDP_PACKET_HEADROOM\n\nBut the first buffer has
  virtio_header, so the maximum frame's length in\nthe first buffer can only be\n\n\
  \txsk_pool_get_rx_frame_size()\nnot\n\txsk_pool_get_rx_frame_size() + vi->hdr_len\n\
  \nlike in the current check.\n\nThis commit adds an additional argument to buf_to_xdp
  differentiate\nbetween the first buffer and other ones to correctly calculate the
  maximum\nframe's length."
