title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7921/mt7925: fix NULL dereference in CSA beacon\n\nThis patch is based on
  a BUG as reported by Bongani Hlope at\nhttps://lore.kernel.org/all/20260502125824.425d7159@bongani-mini.home.org.za/\n\
  \nWhen a channel-switch announcement (CSA) beacon is received,\ncfg80211 queues
  a wiphy work item that eventually calls\nmt7921_channel_switch_rx_beacon(). If the
  station disconnects\n(or the channel context is otherwise torn down) between the\n\
  time the work is queued and the time it runs, the driver's\ndev->new_ctx pointer
  can already have been cleared to NULL.\nmt7921_channel_switch_rx_beacon() then dereferences
  new_ctx\nunconditionally, triggering a NULL pointer dereference at\naddress 0x0:\n\
  \n  BUG: kernel NULL pointer dereference, address: 0000000000000000\n  RIP: 0010:mt7921_channel_switch_rx_beacon+0x1f/0x100
  [mt7921_common]\n\nThe same missing guard exists in mt7925_channel_switch_rx_beacon(),\n\
  which shares the same code patte"
