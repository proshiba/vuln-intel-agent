title: "XML::Bare versions through 0.53 for Perl have an unbounded character lookahead.\n\
  \nThe parserc_parse function attempts to check for multicharacter strings such as
  \"<![CDATA\" or element terminators such as \">\" without checking that the offsets
  are within the buffer.\n\nTruncated strings such as \"<a/\" can trigger an out-of-bounds
  read."
