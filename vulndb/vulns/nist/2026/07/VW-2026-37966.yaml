title: "A path traversal vulnerability was found in the IHM Log handling of ADM. The
  vulnerability occurs because user-controlled disk serial input is not sufficiently
  validated before being used to construct the path of an IHM log database file. An
  authenticated attacker can exploit this issue to cause the affected component to
  access an unintended filesystem path or log database file.\nAffected products and
  versions include: from ADM 4.1.0 through ADM 4.3.3.RUN1 as well as from ADM 5.0.0
  through ADM 5.1.3.RI81."
