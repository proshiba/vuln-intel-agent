title: Vite is a frontend tooling framework for JavaScript. From 6.0.0 to before
  6.4.2, 7.3.2, and 8.0.5, the dev server’s handling of .map requests for 
  optimized dependencies resolves file paths and calls readFile without 
  restricting ../ segments in the URL. As a result, it is possible to bypass the
  server.fs.strict allow list and retrieve .map files located outside the 
  project root, provided they can be parsed as valid source map JSON. This 
  vulnerability is fixed in 6.4.2, 7.3.2, and 8.0.5.
