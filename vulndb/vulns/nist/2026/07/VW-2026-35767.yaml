title: Hayabusa versions prior to 3.8.0 contain a cross-site scripting (XSS) 
  vulnerability in its HTML report output that allows an attacker to execute 
  arbitrary JavaScript when a user scans JSON-exported logs containing malicious
  content in the Computer field. An attacker can inject JavaScript into the 
  Computer field of JSON logs that executes in the forensic examiner's browser 
  session when viewing the generated HTML report, leading to information 
  disclosure or code execution.
