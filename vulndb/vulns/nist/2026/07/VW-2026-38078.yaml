title: "Date::Manip versions through 7.00 for Perl allow CPU exhaustion via quadratic
  backtracking in the unanchored time substitution in _parse_time.\n\n_parse_time
  removes a time from anywhere in the string with the unanchored substitution `s/$timerx/
  /`, where $timerx is an auto-generated alternation of time patterns reached through
  a leading `(?:$atrx|^|\\s+)`. The engine therefore retries the match at every position
  of an interior whitespace run: at each start position the leading `\\s+` consumes
  the rest of the run greedily, the time alternation fails because the run holds no
  digits, and the engine backtracks a space at a time across the run before advancing
  the start position, which is quadratic in the length of the run. No time need be
  present in the string for this to happen, only a long run of whitespace, and the
  parse time rises about fourfold for each doubling of the run: a few kilobytes of
  whitespace costs seconds of CPU per parse and tens of kilobytes costs minutes.\n\
