title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: uvc: hold opts->lock across XU walks in uvc_function_bind\n\nuvc_function_bind()
  walks &opts->extension_units twice without holding\nopts->lock:\n\n  - directly,
  for the iExtension string-descriptor fixup loop;\n  - indirectly, four times via
  uvc_copy_descriptors() (once per speed),\n    where the helper iterates uvc->desc.extension_units
  (which aliases\n    &opts->extension_units) to size and emit XU descriptors.\n\n\
  The configfs side (uvcg_extension_make / uvcg_extension_drop, in\ndrivers/usb/gadget/function/uvc_configfs.c)
  takes opts->lock around its\nlist_add_tail / list_del operations.  A privileged
  userspace process\nthat holds the configfs subtree open and writes the gadget UDC
  name\nto bind the function while concurrently rmdir()'ing an extensions\nsubdir
  can race uvcg_extension_drop() against the bind-time list walks\nand dereference
  a freed struct uvcg_extension.\n\nHold opts->lock from the start of the XU string-"
