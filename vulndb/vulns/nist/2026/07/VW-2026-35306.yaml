title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  Fix work re-schedule after cancel in xfrm_nat_keepalive_net_fini()\n\nAfter cancel_delayed_work_sync()
  is called from\nxfrm_nat_keepalive_net_fini(), xfrm_state_fini() flushes remaining\n\
  states via __xfrm_state_delete(), which calls\nxfrm_nat_keepalive_state_updated()
  to re-schedule nat_keepalive_work.\n\nThe following is a simple race scenario:\n\
  \n           cpu0                             cpu1\n\ncleanup_net() [Round 1]\n\
  \  ops_undo_list()\n    xfrm_net_exit()\n      xfrm_nat_keepalive_net_fini()\n \
  \       cancel_delayed_work_sync(nat_keepalive_work);\n      xfrm_state_fini()\n\
  \        xfrm_state_flush()\n          xfrm_state_delete(x)\n            __xfrm_state_delete(x)\n\
  \              xfrm_nat_keepalive_state_updated(x)\n                schedule_delayed_work(nat_keepalive_work);\n\
  \  rcu_barrier();\n  net_complete_free();\n  net_passive_dec(net);\n    llist_add(&net->defer_free_list,
  &defer_free_list);\n\ncleanup_net() [Round 2]\n  rcu_barr"
