title: The Vertex Addons for Elementor plugin for WordPress is vulnerable to 
  Missing Authorization in all versions up to and including 1.6.4. This is due 
  to improper authorization enforcement in the activate_required_plugins() 
  function. Specifically, the current_user_can('install_plugins') capability 
  check does not terminate execution when it fails — it only sets an error 
  message variable while allowing the plugin installation and activation code to
  execute. The error response is only sent after the installation and activation
  have already completed. This makes it possible for authenticated attackers, 
  with Subscriber-level access and above, to install and activate arbitrary 
  plugins from the WordPress.
