title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  prevent path traversal bypass by restricting caseless retry\n\nksmbd_vfs_path_lookup()
  enforces LOOKUP_BENEATH to restrict path\nresolution within the share root. When
  a crafted path attempts to\nescape the share boundary using parent-directory components
  ('..'),\nvfs_path_parent_lookup() detects this and immediately fails,\nreturning
  -EXDEV.\n\nHowever, a bug exists in __ksmbd_vfs_kern_path() under caseless mode.\n\
  The function fails to intercept the -EXDEV error and erroneously\nfalls through
  to the caseless retry logic, which is intended only\nfor genuinely missing files.
  During this retry process, the path\nis reconstructed, leading to an unintended
  LOOKUP_BENEATH bypass\nthat allows write-capable users to create zero-length files
  or\ndirectories outside the exported share.\n\nFix this by ensuring that the execution
  only proceeds to the caseless\nlookup retry when the error is specifically -ENOENT.
