title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Support for hardening against JIT spraying\n\nThe BPF JIT allocator packs many small
  programs into larger executable\nallocations and reuses space within those allocations
  as programs are\nloaded and freed. When fresh code is written into space that a
  previous\nprogram occupied, an indirect jump into the new program can reuse a branch\n\
  prediction left behind by the old one.\n\nFlush the indirect branch predictors before
  reusing JIT memory so that\nindirect jumps into a newly written program don't reuse
  predictions from an\nold program that occupied the same space.\n\nIntroduce bpf_arch_pred_flush_enabled
  static key and bpf_arch_pred_flush\nstatic call for flushing the branch predictors
  on JIT memory reuse.\nArchitectures that need a flush, can update it to a predictor
  flush\nfunction. By default, its a NOP and does not emit any CALL.\n\nAllocations
