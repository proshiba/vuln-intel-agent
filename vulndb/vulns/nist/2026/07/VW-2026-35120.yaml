title: prompts.chat prior to commit 0f8d4c3 contains a path traversal 
  vulnerability in skill file handling that allows attackers to write arbitrary 
  files to the client system by crafting malicious ZIP archives with unsanitized
  filenames containing path traversal sequences. Attackers can exploit missing 
  server-side filename validation to inject path traversal sequences ../ into 
  skill file archives, which when extracted by vulnerable tools writing files 
  outside the intended directory and overwriting shell initialization files to 
  achieve code execution.
