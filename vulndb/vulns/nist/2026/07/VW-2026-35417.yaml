title: Electron is a framework for writing cross-platform desktop applications 
  using JavaScript, HTML and CSS. Prior to 39.8.5, 40.8.5, 41.1.0, and 
  42.0.0-alpha.5, apps that call clipboard.readImage() may be vulnerable to a 
  denial of service. If the system clipboard contains image data that fails to 
  decode, the resulting null bitmap is passed unchecked to image construction, 
  triggering a controlled abort and crashing the process. Apps are only affected
  if they call clipboard.readImage(). Apps that do not read images from the 
  clipboard are not affected. This issue does not allow memory corruption or 
  code execution. This vulnerability is fixed in 39.8.5, 40.8.5, 41.1.0, and 
  42.0.0-alpha.5.
