title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Report dying CPU to RCU in stop_this_cpu()\n\nThis is a port of MIPS commit 9f3f3bdc6d9dac1
  (\"MIPS: smp: report dying\nCPU to RCU in stop_this_cpu()\"). smp_send_stop() parks
  all secondary\nCPUs in stop_this_cpu(). And the function marks the CPU offline for
  the\nscheduler via set_cpu_online(false) but never informs RCU, so RCU keeps\nexpecting
  a quiescent state from CPUs that are now spinning forever with\ninterrupts disabled.\n\
  \nAs long as nothing waits for an RCU grace period after smp_send_stop()\nthis is
  harmless, which is why it went unnoticed. However, since commit\n91840be8f710370
  (\"irq_work: Fix use-after-free in irq_work_single() on\nPREEMPT_RT\"), irq_work_sync()
  calls synchronize_rcu() on architectures\nwithout an irq_work self-IPI, i.e. where
  arch_irq_work_has_interrupt()\nreturns false. Any irq_work_sync() issued in the
  reboot/shutdown/halt\npath after smp_send_stop() then blocks on a grace period that
  can neve"
