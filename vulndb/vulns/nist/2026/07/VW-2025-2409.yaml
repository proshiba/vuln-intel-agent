title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  pci_endpoint_test: Fix array underflow in pci_endpoint_test_ioctl()\n\nCommit eefb83790a0d
  (\"misc: pci_endpoint_test: Add doorbell test case\")\nadded NO_BAR (-1) to the
  pci_barno enum which, in practical terms,\nchanges the enum from an unsigned int
  to a signed int.  If the user\npasses a negative number in pci_endpoint_test_ioctl()
  then it results in\nan array underflow in pci_endpoint_test_bar()."
