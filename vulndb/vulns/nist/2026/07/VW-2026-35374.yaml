title: Scoold is a Q&A and a knowledge sharing platform for teams. Prior to 
  1.66.2, an authenticated authorization flaw in Scoold allows any logged-in, 
  low-privilege user to overwrite another user's existing question by supplying 
  that question's public ID as the postId parameter to POST /questions/ask. 
  Because question IDs are exposed in normal question URLs, a low-privilege 
  attacker can take a victim question ID from a public page and cause 
  attacker-controlled content to be stored under that existing question object. 
  This causes direct integrity loss of user-generated content and corrupts the 
  integrity of the existing discussion thread. This vulnerability is fixed in 
  1.66.2.
