title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  pcm: Fix race of buffer access at PCM OSS layer\n\nThe PCM OSS layer tries to clear
  the buffer with the silence data at\ninitialization (or reconfiguration) of a stream
  with the explicit call\nof snd_pcm_format_set_silence() with runtime->dma_area.\
  \  But this may\nlead to a UAF because the accessed runtime->dma_area might be freed\n\
  concurrently, as it's performed outside the PCM ops.\n\nFor avoiding it, move the
  code into the PCM core and perform it inside\nthe buffer access lock, so that it
  won't be changed during the\noperation."
