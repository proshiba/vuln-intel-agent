title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB write in HT_caps_handler()\n\nHT_caps_handler() iterates pIE->length
  bytes and writes into\nHT_caps.u.HT_cap[], which is a fixed 26-byte array (sizeof
  struct\nHT_caps_element). Because pIE->length is a raw u8 from an over-the-air\n\
  802.11 AssocResponse frame and is never validated, a malicious AP can\nset it up
  to 255, causing up to 229 bytes of out-of-bounds writes into\nadjacent fields of
  struct mlme_ext_info.\n\nTruncate the iteration count to the size of HT_caps.u.HT_cap
  using\numin() so that data from a longer-than-expected IE is silently ignored\n\
  rather than written out of bounds, preserving interoperability with APs\nthat pad
  the element. An early return on oversized IEs was considered\nbut rejected: it would
  bypass the pmlmeinfo->HT_caps_enable = 1\nassignment that precedes the loop, silently
  disabling HT mode for APs\nthat append extra bytes to the HT Capabilities IE."
