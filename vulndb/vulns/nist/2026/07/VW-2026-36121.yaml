title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ebtables: terminate table name before find_table_lock()\n\nupdate_counters() and
  compat_update_counters() forward a user-supplied\n32-byte table name to find_table_lock()
  without NUL-terminating it. On a\nlookup miss, find_inlist_lock() calls try_then_request_module(...,
  \"%s%s\",\n\"ebtable_\", name), and vsnprintf() reads past the name field and the\n\
  stack object until it hits a zero byte.\n\n  BUG: KASAN: stack-out-of-bounds in
  string (lib/vsprintf.c:648 lib/vsprintf.c:730)\n  Read of size 1 at addr ffff8880119dfb20
  by task exploit/147\n  Call Trace:\n  ...\n   string (lib/vsprintf.c:648 lib/vsprintf.c:730)\n\
  \   vsnprintf (lib/vsprintf.c:2945)\n   __request_module (kernel/module/kmod.c:150)\n\
  \   do_update_counters.isra.0 (net/bridge/netfilter/ebtables.c:371 net/bridge/netfilter/ebtables.c:380)\n\
  \   update_counters (net/bridge/netfilter/ebtables.c:1440)\n   do_ebt_set_ctl (net/bridge/netfilter/ebtables.c:2573)\n\
  \   nf_setsockopt ("
