title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: Initialize epfile->in early to fix endpoint direction checks\n\nWhen
  parsing endpoint descriptors, ffs_data_got_descs() generates the\neps_addrmap which
  contains the endpoint direction. However, epfile->in\nwas previously only populated
  in ffs_func_eps_enable() which executes\nupon USB host connection. As a result,
  early userspace ioctls like\nFUNCTIONFS_DMABUF_ATTACH that run before the host connects
  would see\nepfile->in as 0, leading to incorrect DMA directions.\n\nBy moving the
  initialization to ffs_epfiles_create(), epfile->in is\naccurate before userspace
  opens the endpoint files."
