title: "A flaw in Node.js Permission Model enforcement allows `trace_events.createTracing().enable()`
  Writes Trace Logs Outside `--allow-fs-write`.\r\n\r\nThis can lead to confidentiality
  impact or bypass of the intended security boundary under affected configurations.\r\
  \n\r\nThis vulnerability affects Node.js **22.x**, **24.x**, and **26.x**."
