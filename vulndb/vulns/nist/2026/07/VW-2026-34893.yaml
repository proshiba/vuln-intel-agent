title: FreeScout is a free help desk and shared inbox built with PHP's Laravel 
  framework. Prior to version 1.8.211, checkIpByMask() in app/Misc/Helper.php 
  checks whether the input IP contains a / character. Plain IP addresses never 
  contain /, so the function always returns false without checking any CIDR 
  ranges. The entire 10.0.0.0/8 and 172.16.0.0/12 private ranges are 
  unprotected. This issue has been patched in version 1.8.211.
