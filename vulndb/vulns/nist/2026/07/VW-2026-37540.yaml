title: linuxfabrik-lib provides Python modules for database access, caching, 
  shell execution, and API integrations. Prior to version 6.0.0, lib.url.fetch()
  followed cross-origin redirects while forwarding caller-supplied credential 
  headers other than Authorization and Cookie, allowing a malicious 
  redirect-capable server to receive headers such as X-Auth-Token from 
  authenticated monitoring requests. This issue is fixed in version 6.0.0.
