title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd/pgtbl:
  Fix possible race while increase page table level\n\nThe AMD IOMMU host page table
  implementation supports dynamic page table levels\n(up to 6 levels), starting with
  a 3-level configuration that expands based on\nIOVA address. The kernel maintains
  a root pointer and current page table level\nto enable proper page table walks in
  alloc_pte()/fetch_pte() operations.\n\nThe IOMMU IOVA allocator initially starts
  with 32-bit address and onces its\nexhuasted it switches to 64-bit address (max
  address is determined based\non IOMMU and device DMA capability). To support larger
  IOVA, AMD IOMMU\ndriver increases page table level.\n\nBut in unmap path (iommu_v1_unmap_pages()),
  fetch_pte() reads\npgtable->[root/mode] without lock. So its possible that in exteme
