title: Jellyfin is an open source self hosted media server. Versions prior to 
  10.11.7 contain a denial of service vulnerability in the SyncPlay group 
  creation endpoint (POST /SyncPlay/New), where an authenticated user can create
  groups with names of unlimited size due to insufficient input validation. By 
  sending large payloads combined with arbitrary group IDs, an attacker can lock
  out the endpoint for other clients attempting to join SyncPlay groups and 
  significantly increase the memory usage of the Jellyfin process, potentially 
  leading to an out-of-memory crash. This issue has been fixed in version 
  10.11.7.
