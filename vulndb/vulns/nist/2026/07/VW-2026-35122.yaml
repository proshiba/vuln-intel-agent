title: prompts.chat prior to commit 7b81836 contains multiple authorization 
  bypass vulnerabilities due to missing isPrivate checks across API endpoints 
  and page metadata generation that allow unauthorized users to access sensitive
  data associated with private prompts. Attackers can exploit these missing 
  authorization checks to retrieve private prompt version history, change 
  requests, examples, current content, and metadata including titles and 
  descriptions exposed via HTML meta tags.
