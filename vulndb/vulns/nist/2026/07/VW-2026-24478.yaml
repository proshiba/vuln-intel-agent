title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: iscsi: Fix CRC overread and double-free in iscsit_handle_text_cmd()\n\n\
  Two latent bugs in the Text-phase handler, both present since the\noriginal LIO
  integration in commit e48354ce078c (\"iscsi-target: Add\niSCSI fabric support for
  target v4.1\"):\n\n1) DataDigest CRC buffer overread (4 bytes past text_in).\n\n\
  \   text_in is kzalloc()'d at ALIGN(payload_length, 4).  rx_size is then\n   incremented
  by ISCSI_CRC_LEN to make room for the received DataDigest\n   in the iovec, but
  the same (now-bumped) rx_size is passed as the\n   buffer length to iscsit_crc_buf():\n\
  \n       if (conn->conn_ops->DataDigest) {\n               ...\n               rx_size
  += ISCSI_CRC_LEN;\n       }\n       ...\n       if (conn->conn_ops->DataDigest)
  {\n               data_crc = iscsit_crc_buf(text_in, rx_size, 0, NULL);\n\n   iscsit_crc_buf()
  walks rx_size bytes of text_in with crc32c(), so\n   when DataDigest is negotiated
  it reads 4 bytes past the en"
