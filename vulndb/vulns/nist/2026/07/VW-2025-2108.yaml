title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix null pointer dereference in destroy_previous_session\n\nIf client set ->PreviousSessionId
  on kerberos session setup stage,\nNULL pointer dereference error will happen. Since
  sess->user is not\nset yet, It can pass the user argument as NULL to destroy_previous_session.\n\
  sess->user will be set in ksmbd_krb5_authenticate(). So this patch move\ncalling
  destroy_previous_session() after ksmbd_krb5_authenticate()."
