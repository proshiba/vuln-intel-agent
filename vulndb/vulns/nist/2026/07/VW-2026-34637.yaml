title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  xsk: Fix unlocked writing to ICOSQ\n\nDuring napi poll, when the affinity changes
  and there's still XSK work\nto be done, we trigger an ICOSQ interrupt on the new
  CPU. However, this\ntriggering on the ICOSQ is done unprotected.\n\nThere are 2
  such races:\n\nA) mlx5e_trigger_irq() is called while mlx5e_xsk_alloc_rx_mpwqe()
  is\nrunning from a different CPU due to affinity change. This can happen\nbecause
  IRQ triggering is done after napi_complete_done(). At this point\nthe NAPI can be
  scheduled on a different CPU. Like this:\n\n  CPU A (old affinity, NAPI tail)  \
  \  CPU B (new affinity, fresh NAPI)\n  -------------------------------    --------------------------------\n\
  \  napi_complete_done()  clears SCHED\n  mlx5e_cq_arm(...)\n                   \
  \                  napi_schedule_prep() sets SCHED\n                           \
  \          mlx5e_napi_poll()\n                                       mlx5e_xsk_alloc_rx_mpwqe()\n\
  \              "
