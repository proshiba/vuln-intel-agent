title: There is a memory corruption vulnerability due to an out-of-bounds write 
  when loading a corrupted LVCLASS file in NI LabVIEW.  This vulnerability may 
  result in information disclosure or arbitrary code execution. Successful 
  exploitation requires an attacker to get a user to open a specially crafted 
  .lvclass file. This vulnerability affects NI LabVIEW 2026 Q1 (26.1.0) and 
  prior versions.
