title: An issue was discovered in Quest KACE Systems Deployment Appliance (SMA) 
  11.0.273. It installs with default user credentials. The report and R1 MySQL 
  accounts have a password of box747, which is publicly known and documented. 
  This allows remote attackers to trivially gain privileged access to the MySQL 
  databases. Sensitive information is stored in the database, such as privileged
  credentials for other systems.
