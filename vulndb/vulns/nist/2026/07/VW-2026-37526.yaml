title: "Dify AI Workflow oauth_redirect_url Open Redirect Vulnerability. This vulnerability
  allows remote attackers to disclose sensitive information on affected installations
  of Dify. User interaction is required to exploit this vulnerability in that the
  target must visit a malicious page or open a malicious file.\n\nThe specific flaw
  exists within the OAuth flow handling in the AppInitializer component. An attacker
  can force a redirection to a site that serves malicious content. An attacker can
  leverage this vulnerability to disclose information in the context of the application.
  Was ZDI-CAN-29196."
