title: FastGPT is an AI Agent building platform. Prior to version 4.14.9.5, 
  FastGPT's MCP (Model Context Protocol) tools endpoints 
  (/api/core/app/mcpTools/getTools and /api/core/app/mcpTools/runTool) accept a 
  user-supplied URL parameter and make server-side HTTP requests to it without 
  validating whether the URL points to an internal/private network address. 
  Although the application has a dedicated isInternalAddress() function for SSRF
  protection (used in other endpoints like the HTTP workflow node), the MCP 
  tools endpoints do not call this function. An authenticated attacker can use 
  these endpoints to scan internal networks, access cloud metadata services, and
  interact with internal services such as MongoDB and Redis. This issue has been
  patched in version 4.14.9.5.
