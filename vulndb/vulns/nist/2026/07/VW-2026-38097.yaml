title: "A Regular Expression Denial of Service (ReDoS) vulnerability exists in Apache
  Superset versions 1.5.0 through 5.0.0. The vulnerability is located in the sql_parse.py
  component, specifically within the SQL_REGEX used for parsing SQL statements in
  the sqlparse library integration.\nThe affected regular expression contains overlapping
  disjunctions that share a common outer quantifier. An authenticated attacker can
  exploit this by sending a maliciously crafted input string (specifically a long
  sequence of backslashes or similar characters) to endpoints that process SQL queries\n\
  \nThis issue affects Apache Superset: before 6.0.0.\n\nUsers are recommended to
  upgrade to version 6.0.0, which fixes the issue. \n\nWorkarounds:\n● WAF Rules:
  Implement Web Application Firewall (WAF) rules to detect and block\nrequests containing
  excessively long sequences of backslashes or suspicious repeated\npatterns in the
  queries.extras.where parameter.\n● Rate Limiting: Ensure strict rate limiting is
  applied to the /api"
