title: The LTL Freight Quotes – R+L Carriers Edition plugin for WordPress is 
  vulnerable to Missing Authorization via the plugin's webhook handler in all 
  versions up to, and including, 3.3.13. This is due to missing authentication, 
  authorization, and nonce verification on a standalone PHP file that directly 
  processes GET parameters and updates WordPress options. This makes it possible
  for unauthenticated attackers to modify the plugin's subscription plan 
  settings, effectively downgrading the store from a paid plan to the Trial 
  Plan, changing the store type, and manipulating subscription expiration dates,
  potentially disabling premium features such as Dropship and Hazardous Material
  handling.
