  serial: digi_acceleport: fix broken rx after throttle\n\nIf the port is closed while
  throttled, the read urb is never resubmitted\nand the port will not receive any
  further data until the device is\nreconnected (or the driver is rebound).\n\nClear
  the throttle flags and submit the urb if needed when opening the\nport."
