title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  hid-goodix-spi: validate report size to prevent stack buffer overflow\n\ngoodix_hid_set_raw_report()
  builds a protocol frame in a 128-byte stack\nbuffer (tmp_buf), writing an 11-12
  byte header followed by the\ncaller-supplied report data.  The HID core caps report
  size at\nHID_MAX_BUFFER_SIZE (16384) by default, while the driver does not set\n\
  hid_ll_driver.max_buffer_size and performs no bounds checking before\ncopying the
  payload:\n\n    memcpy(tmp_buf + tx_len, buf, len);\n\nA hidraw SET_REPORT ioctl
  with a report larger than ~116 bytes\noverflows the stack buffer.\n\nAdd a size
  check after constructing the header, rejecting reports that\nwould exceed the buffer
  capacity.\n\nDiscovered by Atuin - Automated Vulnerability Discovery Engine."
