title: "Authentication Bypass by Capture-replay vulnerability in malach-it Boruta
  allows an attacker who has obtained a previously valid JWT client assertion to authenticate
  as the issuing OAuth client after the assertion has expired.\n\nBoruta accepts JWT-based
  client authentication (client_secret_jwt and private_key_jwt token endpoint authentication
  methods) but never enforces that the assertion's exp claim is in the future. The
  pre-check helper Boruta.Oauth.Request.Base.check_expiration/1 in lib/boruta/oauth/request/base.ex
  only verifies that an exp claim is present (it pattern-matches on the existence
  of the key and returns success), and the Joken token configuration used for signature
  verification, Boruta.Oauth.Authorization.Client.Token.token_config/0 in lib/boruta/oauth/authorization/client.ex,
  returns an empty map, so Joken's default exp claim validator is not engaged either.
