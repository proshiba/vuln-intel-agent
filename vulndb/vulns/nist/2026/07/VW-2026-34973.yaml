title: Ash Framework is a declarative, extensible framework for building Elixir 
  applications. Prior to version 3.22.0, Ash.Type.Module.cast_input/2 
  unconditionally creates a new Erlang atom via Module.concat([value]) for any 
  user-supplied binary string that starts with "Elixir.", before verifying 
  whether the referenced module exists. Because Erlang atoms are never 
  garbage-collected and the BEAM atom table has a hard default limit of 
  approximately 1,048,576 entries, an attacker who can submit values to any 
  resource attribute or argument of type :module can exhaust this table and 
  crash the entire BEAM VM, taking down the application. This issue has been 
  patched in version 3.22.0.
