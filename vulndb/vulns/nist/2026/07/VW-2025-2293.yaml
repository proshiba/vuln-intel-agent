title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix sleeping-in-atomic in ath11k_mac_op_set_bitrate_mask()\n\nath11k_mac_disable_peer_fixed_rate()
  is passed as the iterator to\nieee80211_iterate_stations_atomic(). Note in this
  case the iterator is\nrequired to be atomic, however ath11k_mac_disable_peer_fixed_rate()
  does\nnot follow it as it might sleep. Consequently below warning is seen:\n\nBUG:
  sleeping function called from invalid context at wmi.c:304\nCall Trace:\n <TASK>\n\
  \ dump_stack_lvl\n __might_resched.cold\n ath11k_wmi_cmd_send\n ath11k_wmi_set_peer_param\n\
  \ ath11k_mac_disable_peer_fixed_rate\n ieee80211_iterate_stations_atomic\n ath11k_mac_op_set_bitrate_mask.cold\n\
  \nChange to ieee80211_iterate_stations_mtx() to fix this issue.\n\nTested-on: WCN6855
  hw2.0 PCI WLAN.HSP.1.1-03125-QCAHSPSWPL_V1_V2_SILICONZ_LITE-3.6510.30"
