title: immich is a high performance self-hosted photo and video management 
  solution. Prior to 2.7.0, sStored Cross-Site Scripting (XSS) in the 360° 
  panorama viewer allows any authenticated user to execute arbitrary JavaScript 
  in the browser of any other user who views the malicious panorama with the OCR
  overlay enabled. The attacker uploads an equirectangular image containing 
  crafted text; OCR extracts it, and the panorama viewer renders it via 
  innerHTML without sanitization. This enables session hijacking (via persistent
  API key creation), private photo exfiltration, and access to GPS location 
  history and face biometric data. This vulnerability is fixed in 2.7.0.
