title: Juggle through 1.6.0 contains a remote code execution vulnerability that 
  allows unauthenticated remote attackers to execute arbitrary OS commands by 
  connecting to the exposed H2 database web console using default shipped 
  credentials. Attackers can access the unprotected /h2-console endpoint, 
  authenticate with default credentials, and leverage the H2 CREATE ALIAS 
  Runtime.exec() technique to execute arbitrary commands, resulting in 
  root-level code execution when running the stock Docker image.
