title: Papra is a minimalistic document management and archiving platform. Prior
  to version 26.5.0, an authenticated user who is a member of any organization 
  can delete or rename tags belonging to a different organization, given the 
  target tag's ID. The route handler verifies the caller's membership of the 
  ":organizationId" in the URL, but the repository write filters on tag.id 
  alone, so the URL-level org scope never reaches the database. This issue has 
  been patched in version 26.5.0.
