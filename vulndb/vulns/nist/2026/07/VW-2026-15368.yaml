title: MariaDB server is a community developed fork of MySQL server. From 
  versions 11.4.1 to before 11.4.11, 11.8.1 to before 11.8.7, and 12.3.1, a user
  getting EXECUTE access to a stored routine via a role, could see the routine 
  definition even without SHOW CREATE ROUTINE privilege. This issue has been 
  patched in versions 11.4.11, 11.8.7, and 12.3.2.
