title: A vulnerability has been found in D-Link DNS-120, DNR-202L, DNS-315L, 
  DNS-320, DNS-320L, DNS-320LW, DNS-321, DNR-322L, DNS-323, DNS-325, DNS-326, 
  DNS-327L, DNR-326, DNS-340L, DNS-343, DNS-345, DNS-726-4, DNS-1100-4, 
  DNS-1200-05 and DNS-1550-04 up to 20260205. This issue affects the function 
  Webdav_Upload_File of the file /cgi-bin/webdav_mgr.cgi. The manipulation of 
  the argument f_file leads to stack-based buffer overflow. The attack is 
  possible to be carried out remotely. The exploit has been disclosed to the 
  public and may be used.
