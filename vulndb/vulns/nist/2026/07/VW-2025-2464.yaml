title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  guest_memfd: Remove bindings on memslot deletion when gmem is dying\n\nWhen unbinding
  a memslot from a guest_memfd instance, remove the bindings\neven if the guest_memfd
  file is dying, i.e. even if its file refcount has\ngone to zero.  If the memslot
  is freed before the file is fully released,\nnullifying the memslot side of the
  binding in kvm_gmem_release() will\nwrite to freed memory, as detected by syzbot+KASAN:\n\
  \n  ==================================================================\n  BUG: KASAN:
  slab-use-after-free in kvm_gmem_release+0x176/0x440 virt/kvm/guest_memfd.c:353\n\
  \  Write of size 8 at addr ffff88807befa508 by task syz.0.17/6022\n\n  CPU: 0 UID:
  0 PID: 6022 Comm: syz.0.17 Not tainted syzkaller #0 PREEMPT(full)\n  Hardware name:
  Google Google Compute Engine/Google Compute Engine, BIOS Google 10/02/2025\n  Call
  Trace:\n   <TASK>\n   dump_stack_lvl+0x189/0x250 lib/dump_stack.c:120\n   print_address_description
  mm/kasan"
