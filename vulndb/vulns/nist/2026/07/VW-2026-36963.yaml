title: The Chaty Pro plugin for WordPress is vulnerable to Authenticated 
  Time-Based Blind SQL Injection in versions up to and including 3.5.5. This is 
  due to the fetch_custom_field() function in admin/class-admin-base.php 
  retrieving the widget_id POST parameter via filter_input(INPUT_POST, ...) and 
  directly concatenating the value into a raw SQL query in a numeric context 
  without using $wpdb->prepare() or any integer casting. Additionally, the nonce
  verification check is performed after the SQL query has already executed, 
  providing no protection against the injection. This makes it possible for 
  authenticated attackers with subscriber-level access and above to inject 
  arbitrary SQL commands, potentially leading to unauthorized extraction of 
  sensitive database contents including user credentials and configuration data.
