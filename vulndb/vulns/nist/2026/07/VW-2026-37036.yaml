title: "[This CNA information record relates to multiple CVEs; the\ntext explains
  which aspects/vulnerabilities correspond to which CVE.]\n\nWith the introduction
  of Grant Table v2 came the requirement to be able to\nswitch between versions. \
  \ Switching from v1 to v2 reduces the number of\nvalid grant references, as a bigger
  shared entry structure is then needed\nwhile the shared table doesn't change size.\
  \  Switching from v2 back to v1\nthe status frames, which are separate in v2, go
  away.\n\nCode holding, but intermediately dropping and then re-acquiring the grant\n\
  table lock, sometimes wrongly assumes that said properties wouldn't change\nacross
  the window in time where the lock is not being held.\n\nThe v1 -> v2 issue is CVE-2026-62435.\n\
  \nThe v2 -> v1 issue is CVE-2026-62436."
