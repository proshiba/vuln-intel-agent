title: "Autel MaxiCharger AC Elite Home Software Update Improper Verification of Cryptographic
  Signature Arbitrary Code Execution Vulnerability. This vulnerability allows physically
  present attackers to execute arbitrary code on affected installations of Autel MaxiCharger
  AC Elite Home EV chargers. Authentication is not required to exploit this vulnerability.\n\
  \nThe specific flaw exists within the handling of software updates. The issue results
  from the lack of proper validation of a user-supplied software update image. An
  attacker can leverage this vulnerability to execute code in the context of the device.
  Was ZDI-CAN-29062."
