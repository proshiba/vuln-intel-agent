title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbluetooth/hci:
  disallow setting handle bigger than HCI_CONN_HANDLE_MAX\n\nSyzbot hit warning in
  hci_conn_del() caused by freeing handle that was\nnot allocated using ida allocator.\n\
  \nThis is caused by handle bigger than HCI_CONN_HANDLE_MAX passed by\nhci_le_big_sync_established_evt(),
  which makes code think it's unset\nconnection.\n\nAdd same check for handle upper
  bound as in hci_conn_set_handle() to\nprevent warning."
