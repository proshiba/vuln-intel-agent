title: A vulnerability was found in mf-yang openclaw-cn up to 0.2.1. This 
  affects the function clickViaPlaywright of the file 
  src/browser/routes/agent.act.ts of the component Browser Control HTTP API. 
  Performing a manipulation results in server-side request forgery. It is 
  possible to initiate the attack remotely. The exploit has been made public and
  could be used. The project was informed of the problem early through an issue 
  report but has not responded yet.
