title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: mld: validate sta_mask before ffs() in BA session handlers\n\nThree BA
  session handlers use ffs(ba_data->sta_mask) - 1 to derive a\nstation ID without
  checking that sta_mask is non-zero. When sta_mask is\nzero, ffs() returns 0 and
  the subtraction wraps to 0xFFFFFFFF, causing\nan out-of-bounds access on fw_id_to_link_sta[].\n\
  \nAdd WARN_ON_ONCE(!ba_data->sta_mask) guards before each ffs() call,\nconsistent
  with the existing check in iwl_mld_ampdu_rx_start()."
