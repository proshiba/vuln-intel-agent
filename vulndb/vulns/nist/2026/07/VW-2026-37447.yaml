title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  firewire-motu: add bounds check in put_user loop for DSP events\n\nIn the DSP event
  handling code, a put_user() loop copies event data.\nWhen the user buffer size is
  not aligned to 4 bytes, it could overwrite\nbeyond the buffer boundary.\n\nFix by
  adding a bounds check before put_user()."
