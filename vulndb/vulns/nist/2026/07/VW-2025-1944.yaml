title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  don't clobber ret in btrfs_validate_super()\n\nCommit 2a9bb78cfd36 (\"btrfs: validate
  system chunk array at\nbtrfs_validate_super()\") introduces a call to validate_sys_chunk_array()\n\
  in btrfs_validate_super(), which clobbers the value of ret set earlier.\nThis has
  the effect of negating the validity checks done earlier, making\nit so btrfs could
  potentially try to mount invalid filesystems."
