title: listmonk is a standalone, self-hosted, newsletter and mailing list 
  manager. From version 4.1.0 to before version 6.1.0, a session management 
  vulnerability allows previously issued authenticated sessions to remain valid 
  after sensitive account security changes, specifically password reset and 
  password change. As a result, an attacker who has already obtained a valid 
  session cookie can retain access to the account even after the victim changes 
  or resets their password. This weakens account recovery and session security 
  guarantees. This issue has been patched in version 6.1.0.
