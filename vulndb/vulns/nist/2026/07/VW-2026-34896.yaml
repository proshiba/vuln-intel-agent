title: The Claude SDK for Python provides access to the Claude API from Python 
  applications. From version 0.86.0 to before version 0.87.0, the local 
  filesystem memory tool in the Anthropic Python SDK created memory files with 
  mode 0o666, leaving them world-readable on systems with a standard umask and 
  world-writable in environments with a permissive umask such as many Docker 
  base images. A local attacker on a shared host could read persisted agent 
  state, and in containerized deployments could modify memory files to influence
  subsequent model behavior. Both the synchronous and asynchronous memory tool 
  implementations were affected. This issue has been patched in version 0.87.0.
