title: "Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Request/Response
  Splitting') vulnerability in ninenines cowlib allows HTTP response splitting via
  non-VCHAR bytes in structured-fields string values.\n\ncow_http_struct_hd:escape_string/2
  in cowlib only escapes \\ and \", passing all other bytes through verbatim. This
  creates an encoder/decoder asymmetry: the matching parser accepts only printable
  ASCII (0x20–0x7E, excluding \" and \\), but the encoder emits any byte including
  CR and LF. An application that builds a structured HTTP header via cow_http_struct_hd:item/1
  (or a higher-level wrapper such as cow_http_hd:wt_protocol/1) from attacker-controlled
  input can have \\r\\n injected into the serialized header value. Once on the wire,
  the injected CRLF terminates the current header and any following bytes are interpreted
  as a new header, enabling HTTP response splitting.\n\nThis issue affects cowlib
  from 2.9.0."
