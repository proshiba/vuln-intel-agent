title: OpenObserve is a cloud-native observability platform. In 0.70.3 and 
  earlier, the validate_enrichment_url function in 
  src/handler/http/request/enrichment_table/mod.rs fails to block IPv6 addresses
  because Rust's url crate returns them with surrounding brackets (e.g. "[::1]" 
  not "::1"). An authenticated attacker can reach internal services blocked from
  external access. On cloud deployments this enables retrieval of IAM 
  credentials via AWS IMDSv1 (169.254.169.254), GCP metadata, or Azure IMDS. On 
  self-hosted deployments it allows probing internal network services.
