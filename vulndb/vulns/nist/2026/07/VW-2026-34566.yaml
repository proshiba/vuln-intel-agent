title: "Out-of-bounds Write, Integer Underflow (Wrap or Wraparound) vulnerability
  in Apache NimBLE BASS service.\nImproper validation when parsing BASS service  \"\
  Add Source\" and \"Modify Source\" operation PDU could results in stack buffer overflow
  or arbitrary out-of-bound read.\n\n\nThis can be triggered by nearby devices over
  Bluetooth connection, however pairing is required prior to accessing BASS service,
  which depending on device configuration may or may not require user action.\n\n\
  This issue affects Apache NimBLE: through 1.9.0.\n\nUsers are recommended to upgrade
  to version 1.10.0, which fixes the issue."
