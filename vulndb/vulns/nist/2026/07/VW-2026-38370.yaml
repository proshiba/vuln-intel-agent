title: ComfyUI is a modular diffusion model GUI, API, and backend with a 
  graph-and-node interface. Prior to 0.28.0, folder_paths.get_annotated_filepath
  and exists_annotated_filepath join workflow-controlled annotated filenames to 
  a base directory without a containment check, allowing an unauthenticated 
  crafted POST /prompt workflow using LoadImage or sibling nodes to probe 
  arbitrary host paths and exfiltrate image-format files through /view. 
  LoadImage defines a VALIDATE_INPUTS method, which causes the execution engine 
  to skip COMBO (input-directory) validation. Affected nodes include LoadImage, 
  LoadImageMask, LoadImageOutput, LoadAudio, LoadLatent, LoadVideo, and Load3D. 
  This issue is fixed in version 0.28.0.
