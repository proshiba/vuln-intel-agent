title: "A vulnerability was identified in Wahoo Fitness SYSTM App up to 7.2.1 on Android.
  Impacted is an unknown function of the file com/WahooFitness/SYSTM/BuildConfig.java
  of the component com.WahooFitness.SYSTM. Such manipulation of the argument SEGMENT_WRITE_KEY
  leads to use of hard-coded cryptographic key\r . Local access is required to approach
  this attack. The exploit is publicly available and might be used. The vendor was
  contacted early about this disclosure but did not respond in any way."
