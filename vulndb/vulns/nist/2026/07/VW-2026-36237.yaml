title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/hyperv:
  validate VMBus packet size in receive callback\n\nhyperv_receive_sub() reads msg->vid_hdr.type
  and dispatches into one\nof four message-type branches without knowing how many
  bytes the host\nwrote into hv->recv_buf. The completion path then runs\nmemcpy(hv->init_buf,
  msg, VMBUS_MAX_PACKET_SIZE), so the consumer that\nwakes on wait_for_completion_timeout()
  can read up to 16 KiB of\nresidue from a prior message as if it were the response
  payload.\n\nPass bytes_recvd into hyperv_receive_sub() and reject any packet that\n\
  does not cover the pipe + synthvid header. A single switch on\nmsg->vid_hdr.type
  then computes the type-specific payload size: the\nthree completion-driving types
  (SYNTHVID_VERSION_RESPONSE,\nSYNTHVID_RESOLUTION_RESPONSE, SYNTHVID_VRAM_LOCATION_ACK)
  fall through\nto a shared exit that requires that size before memcpy/complete, while\n\
  SYNTHVID_FEATURE_CHANGE validates its own payload and returns before\nreadin"
