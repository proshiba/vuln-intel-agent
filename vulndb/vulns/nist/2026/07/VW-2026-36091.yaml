title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: Fix next buffer leak in receive_encrypted_standard()\n\nreceive_encrypted_standard()
  allocates next_buffer before checking\nwhether the number of compound PDUs already
  reached MAX_COMPOUND. If\nthe limit check fails, the function returns immediately
  and the newly\nallocated next_buffer is not assigned to server->smallbuf/server->bigbuf,\n\
  making it leaked.\n\nMove the MAX_COMPOUND check before allocating next_buffer."
