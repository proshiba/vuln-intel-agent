title: "A flaw in Node.js Permission Model enforcement can over-grant filesystem access
  across radix-tree prefix boundaries.\r\n\r\nUnder `--permission`, an attacker who
  is granted access to one path can abuse boundary handling to read from or write
  to paths outside the intended filesystem allowlist.\r\n\r\nThis vulnerability affects
  Node.js **main**, **22.x**, **24.x**, and **26.x**."
