title: Bulwark Webmail is a self-hosted webmail client for Stalwart Mail Server.
  Prior to version 1.4.10, the verifyIdentity() function contained logic that 
  returned true if no session cookies were present. This allowed unauthenticated
  attackers to bypass security checks and access/modify user settings via the 
  /api/settings endpoint by providing arbitrary headers. This issue has been 
  patched in version 1.4.10.
