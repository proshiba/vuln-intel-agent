title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  move policy_bydst RCU sync from per-netns .exit to .pre_exit\n\nThe struct pernet_operations
  docstring in include/net/net_namespace.h\nexplicitly warns against blocking RCU
  primitives in .exit handlers:\n\n    Exit methods using blocking RCU primitives,
  such as\n    synchronize_rcu(), should be implemented via exit_batch.\n    [...]\n\
  \    Please, avoid synchronize_rcu() at all, where it's possible.\n\n    Note that
  a combination of pre_exit() and exit() can\n    be used, since a synchronize_rcu()
  is guaranteed between\n    the calls.\n\nxfrm_policy_fini() violates this: it calls
  synchronize_rcu() before\nfreeing the policy_bydst hash tables (so no RCU reader
  is mid-\ntraversal at free time), but runs from xfrm_net_ops.exit -- once per\n\
  namespace -- so a cleanup_net() of N namespaces pays N full RCU\ngrace periods serially.\n\
  \nUse the documented pre_exit/exit split. Move the policy flush (and\nthe workqueue
  drains it depends on) into "
