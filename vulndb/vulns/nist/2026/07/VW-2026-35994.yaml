title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Ensure vendor's exit handler runs before fastpath userspace exits\n\nMove the
  handling of fastpath userspace exits into vendor code to ensure\nKVM runs vendor
  specific operations that need to run before userspace gains\ncontrol of the vCPU.\
  \  E.g. for VMX (and soon to be for SVM as well), KVM\nneeds to flush the PML buffer
  prior to exiting to userspace, otherwise any\nmemory written by the final KVM_RUN
  might never be flagged as dirty.\n\nNote, waiting to snapshot CR0 and CR3 until
  svm_handle_exit() is flawed in\ngeneral, as that risks consuming stale state in
  a fastpath handler.  That\nwill be addressed in a future change."
