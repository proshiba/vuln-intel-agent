title: ZimaOS is a fork of CasaOS, an operating system for Zima devices and 
  x86-64 systems with UEFI. Prior to version 1.5.3, a proxy endpoint 
  (/v1/sys/proxy) exposed by ZimaOS's web interface can be abused (via an 
  externally reachable domain using a Cloudflare Tunnel) to make requests to 
  internal localhost services. This results in unauthenticated access to 
  internal-only endpoints and sensitive local services when the product is 
  reachable from the Internet through a Cloudflare Tunnel. This issue has been 
  patched in version 1.5.3.
