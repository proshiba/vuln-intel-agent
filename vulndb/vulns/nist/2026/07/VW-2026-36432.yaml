title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  nexthop: Increase weight to u16\n\nIn CLOS networks, as link failures occur at various
  points in the network,\nECMP weights of the involved nodes are adjusted to compensate.
  With high\nfan-out of the involved nodes, and overall high number of nodes,\na (non-)ECMP
  weight ratio that we would like to configure does not fit into\n8 bits. Instead
  of, say, 255:254, we might like to configure something like\n1000:999. For these
  deployments, the 8-bit weight may not be enough.\n\nTo that end, in this patch increase
  the next hop weight from u8 to u16.\n\nIncreasing the width of an integral type
  can be tricky, because while the\ncode still compiles, the types may not check out
  anymore, and numerical\nerrors come up. To prevent this, the conversion was done
  in two steps.\nFirst the type was changed from u8 to a single-member structure,
  which\ninvalidated all uses of the field. This allowed going through them one by\n\
  one and audit for type "
