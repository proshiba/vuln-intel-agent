title: A vulnerability has been found in mf-yang openclaw-cn up to 0.2.1. 
  Affected by this issue is the function assertBrowserNavigationAllowed of the 
  file src/browser/navigation-guard.ts of the component Scheme Handler. Such 
  manipulation of the argument url leads to information disclosure. The attack 
  may be performed from remote. The exploit has been disclosed to the public and
  may be used. The project was informed of the problem early through an issue 
  report but has not responded yet.
