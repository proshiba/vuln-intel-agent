  affected element is an unknown function of the file file res/raw/config.json of
  the component ca.diagram.dialogue. Executing a manipulation of the argument SEGMENT_WRITE_KEY
  can lead to use of hard-coded cryptographic key\r . The attack is restricted to
  local execution. The exploit has been publicly disclosed and may be utilized. The
  vendor was contacted early about this disclosure but did not respond in any way."
