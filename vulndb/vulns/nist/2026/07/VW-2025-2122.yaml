title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/rt:
  Fix race in push_rt_task\n\nOverview\n========\nWhen a CPU chooses to call push_rt_task
  and picks a task to push to\nanother CPU's runqueue then it will call find_lock_lowest_rq
  method\nwhich would take a double lock on both CPUs' runqueues. If one of the\n\
  locks aren't readily available, it may lead to dropping the current\nrunqueue lock
  and reacquiring both the locks at once. During this window\nit is possible that
  the task is already migrated and is running on some\nother CPU. These cases are
  already handled. However, if the task is\nmigrated and has already been executed
  and another CPU is now trying to\nwake it up (ttwu) such that it is queued again
  on the runqeue\n(on_rq is 1) and also if the task was run by the same CPU, then
  the\ncurrent checks will pass even though the task was migrated out and is no\n\
  longer in the pushable tasks list.\n\nCrashes\n=======\nThis bug resulted in quite
  a few flavors of crashes triggering "
