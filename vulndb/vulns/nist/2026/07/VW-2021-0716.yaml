  Oracle PeopleSoft (component: Notification Framework). Supported versions that are
  affected are 9.0 and 9.2. Easily exploitable vulnerability allows low privileged
  attacker with access to the physical communication segment attached to the hardware
  where the PeopleSoft Enterprise CS Campus Community executes to compromise PeopleSoft
