title: Docmost is open-source collaborative wiki and documentation software. In 
  versions prior to 0.71.0, improper neutralization of attachment URLs in 
  Docmost allows a low-privileged authenticated user to store a malicious 
  `javascript:` URL inside an attachment node in page content. When another user
  views the page and activates the attachment link/icon, attacker-controlled 
  JavaScript executes in the context of the Docmost origin. Version 0.71.0 
  patches the issue.
