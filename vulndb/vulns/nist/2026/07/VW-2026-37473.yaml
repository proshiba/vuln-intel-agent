title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  clean up user copy references on ublk server exit\n\nIf a ublk server process releases
  a ublk char device file, any requests\ndispatched to the ublk server but not yet
  completed will retain a ref\nvalue of UBLK_REFCOUNT_INIT. Before commit e63d2228ef83
  (\"ublk: simplify\naborting ublk request\"), __ublk_fail_req() would decrement the
  reference\ncount before completing the failed request. However, that commit\noptimized
  __ublk_fail_req() to call __ublk_complete_rq() directly\nwithout decrementing the
  request reference count.\nThe leaked reference count incorrectly allows user copy
  and zero copy\noperations on the completed ublk request. It also triggers the\n\
  WARN_ON_ONCE(refcount_read(&io->ref)) warnings in ublk_queue_reinit()\nand ublk_deinit_queue().\n\
  Commit c5c5eb24ed61 (\"ublk: avoid ublk_io_release() called after ublk\nchar dev
  is closed\") already fixed the issue for ublk devices using\nUBLK_F_SUPPORT_ZERO_COPY
  or UBLK_F_AUTO"
