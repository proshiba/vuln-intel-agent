title: Joomla StreetGuessr Game 1.1.8 contains an SQL injection vulnerability 
  that allows unauthenticated attackers to execute arbitrary SQL queries by 
  injecting malicious code through the catid parameter. Attackers can send GET 
  requests to index.php with the option=com_streetguess&view=maps parameters and
  inject SQL code in the catid parameter to extract sensitive database 
  information including version and database names.
