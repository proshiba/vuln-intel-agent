title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  elan_i2c - prevent division by zero and arithmetic underflow\n\nThe Elan I2C touchpad
  driver queries the device for its physical\ndimensions and trace counts to calculate
  the device resolution and width.\nHowever, if the device firmware or device tree
  provides invalid zero\nvalues for x_traces or y_traces, it results in a fatal division-by-zero\n\
  exception leading to a kernel panic during device probe.\n\nAdd checks to ensure
  these parameters are non-zero before performing\nthe division. If invalid trace
  values are detected, fall back to a safe\ndefault of 1.\n\nAdditionally, prevent
  an arithmetic underflow in the touch reporting\nlogic. Previously, if the calculated
  or fallback width was smaller than\nETP_FWIDTH_REDUCE (90), the subtraction would
  underflow, resulting in a\nmassive unsigned integer being reported to userspace.
  Clamp the adjusted\nwidth to a minimum of 0 to safely handle small physical dimensions
