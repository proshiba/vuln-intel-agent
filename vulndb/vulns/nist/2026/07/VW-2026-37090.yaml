title: schreibfaul1 ESP32-audioI2S 3.4.5 has a heap-based buffer overflow 
  vulnerability in the URL path concatenation and encoding module. The 
  application splices untrusted extension path and attacker-controlled query 
  string into a path buffer, then invokes urlencode without validating the final
  string length. Remote attackers can construct an oversized malicious URL path 
  and query string to trigger out-of-bounds heap write, resulting in arbitrary 
  code execution, information disclosure, service crash, or privilege 
  escalation.
