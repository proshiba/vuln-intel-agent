title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  add a WRITE_DAC/WRITE_OWNER check to SMB2 SET_INFO SECURITY\n\ncommit cc57232cae23
  (\"ksmbd: fix FSCTL permission bypass by adding a\npermission check for FSCTL_SET_SPARSE\"\
  ) added a fp->daccess gate to\nfsctl_set_sparse and noted that \"similar handle-level
  checks exist in other\nfunctions but are missing here.\" The SMB2 SET_INFO SECURITY
  arm is one of\nthe missing ones, and the most security-relevant: smb2_set_info_sec()
  calls\nset_info_sec() with no per-handle access check.\n\nset_info_sec() (fs/smb/server/smbacl.c)
  re-permissions the file: it\nrewrites owner/group/mode via notify_change(), rewrites
  the POSIX ACL via\nset_posix_acl(), and on KSMBD_SHARE_FLAG_ACL_XATTR shares removes
  and\nrewrites the Windows security descriptor via ksmbd_vfs_set_sd_xattr().\nEvery
  other persistent-mutation arm of the sibling handler\nsmb2_set_info_file() checks
  fp->daccess first (FILE_WRITE_DATA /\nFILE_DELETE / FILE_WRITE_EA / FILE_WRITE_ATT"
