title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrust_binder:
  use a u64 stride when cleaning up the offsets array\n\nAllocation's Drop walks the
  offsets array (binder_size_t = u64 entries),\ncleaning up the objects, but it used
  usize instead of u64 for both the\nstride and the per-entry read.\n\nOn 64-bit kernels
  (usize == u64) this is harmless, but on 32-bit kernels\nit walks the 8-byte entries
  in 4-byte steps, iterating an N-entry array\n2N times, and reads the always-zero
  high word as offset 0, cleaning up\nthe object at offset 0 N extra times. As a result
  the referenced node or\nhandle ends up with a lower reference count than it actually
  has (a\nrefcount over-decrement), and binder's reference accounting is corrupted;\n\
  for example, the owner can be notified of a strong reference release\n(BR_RELEASE)
