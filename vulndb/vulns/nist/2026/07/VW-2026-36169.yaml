title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  restore RCU grace period in tcp_ao_destroy_sock\n\nCommit 51e547e8c89c (\"tcp: Free
  TCP-AO/TCP-MD5 info/keys without RCU\")\nremoved the call_rcu() callback from tcp_ao_destroy_sock(),
  arguing that\n\"the destruction of info/keys is delayed until the socket destructor\"\
  \nand therefore \"no one can discover it anymore\".\n\nThat argument does not hold
  for the call site in tcp_connect()\n(net/ipv4/tcp_output.c:4327-4332). At that point
  the socket is in\nTCP_SYN_SENT, has already been inserted into the inet ehash by\n\
  inet_hash_connect() in tcp_v4_connect(), and is therefore very much\ndiscoverable:
  any softirq running tcp_v4_rcv() on another CPU can take\nthe socket out of the
  ehash, walk into tcp_inbound_hash(), and load\ntp->ao_info via implicit RCU before
  bh_lock_sock_nested() is taken on\nthe destroying CPU.\n\nThe reader path then enters
  __tcp_ao_do_lookup() (net/ipv4/tcp_ao.c:208)\nwhich re-loads tp->ao_info via rcu_dereference_chec"
