title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  Avoid use-after-free in fuse_uring_async_stop_queues\n\nfuse_uring_async_stop_queues()
  might run when the last reference\non ring->queue_refs was already dropped.\n\n\
  In order to avoid an early destruction a reference on struct fuse_conn\nis now taken
  before starting fuse_uring_async_stop_queues() and that\nreference is only released
  when that delayed work queue terminates."
