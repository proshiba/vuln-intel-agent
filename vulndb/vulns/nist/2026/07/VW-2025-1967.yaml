title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix UAF in decryption with multichannel\n\nAfter commit f7025d861694 (\"\
  smb: client: allocate crypto only for\nprimary server\") and commit b0abcd65ec54
  (\"smb: client: fix UAF in\nasync decryption\"), the channels started reusing AEAD
  TFM from primary\nchannel to perform synchronous decryption, but that can't done
  as\nthere could be multiple cifsd threads (one per channel) simultaneously\naccessing
  it to perform decryption.\n\nThis fixes the following KASAN splat when running fstest
  generic/249\nwith 'vers=3.1.1,multichannel,max_channels=4,seal' against Windows\n\
  Server 2022:\n\nBUG: KASAN: slab-use-after-free in gf128mul_4k_lle+0xba/0x110\n\
  Read of size 8 at addr ffff8881046c18a0 by task cifsd/986\nCPU: 3 UID: 0 PID: 986
  Comm: cifsd Not tainted 6.15.0-rc1 #1\nPREEMPT(voluntary)\nHardware name: QEMU Standard
  PC (Q35 + ICH9, 2009), BIOS 1.16.3-3.fc41\n04/01/2014\nCall Trace:\n <TASK>\n dump_stack_lvl+0x5d/0x80\n\
  \ print_report+0x156/0"
