title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_core: lookup hci_conn on RX path on protocol side\n\nThe hdev lock/lookup/unlock/use
  pattern in the packet RX path doesn't\nensure hci_conn* is not concurrently modified/deleted.
  This locking\nappears to be leftover from before conn_hash started using RCU\ncommit
  bf4c63252490b (\"Bluetooth: convert conn hash to RCU\")\nand not clear if it had
  purpose since then.\n\nCurrently, there are code paths that delete hci_conn* from
  elsewhere\nthan the ordered hdev->workqueue where the RX work runs in. E.g.\ncommit
  5af1f84ed13a (\"Bluetooth: hci_sync: Fix UAF on hci_abort_conn_sync\")\nintroduced
  some of these, and there probably were a few others before\nit.  It's better to
  do the locking so that even if these run\nconcurrently no UAF is possible.\n\nMove
  the lookup of hci_conn and associated socket-specific conn to\nprotocol recv handlers,
  and do them within a single critical section\nto cover hci_conn* usage and lookup.\n\
  \nsyzkaller"
