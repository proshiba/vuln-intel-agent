title: A flaw was found in the role-users endpoint of the keycloak-services 
  library, which is the core component of the Keycloak identity and access 
  management solution. The issue occurs because the system fails to check if an 
  administrator has permission to view individual users when listing members of 
  a role. This allows a restricted administrator to see private information, 
  such as names and email addresses, for users they should not be able to 
  access.
