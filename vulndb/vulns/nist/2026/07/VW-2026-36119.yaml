title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btmtksdio: fix infinite loop in btmtksdio_txrx_work()\n\nEvery once in a while we
  see a hung btmtksdio_flush() task:\n\n INFO: task kworker/u17:0:189 blocked for
  more than 122 seconds.\n __cancel_work_timer+0x3f4/0x460\n cancel_work_sync+0x1c/0x2c\n\
  \ btmtksdio_flush+0x2c/0x40\n hci_dev_open_sync+0x10c4/0x2190\n [..]\n\nIt all boils
  down to incorrect time_is_before_jiffies() usage in\nbtmtksdio_txrx_work().  The
  btmtksdio_txrx_work() loop is expected\nto be terminated if running for longer than
  5*HZ.  However the\ntimeout check is twisted:  time_is_before_jiffies(old_jiffies
  + 5*HZ)\nevaluates to true when old_jiffies + 5*HZ is in the past i.e. when a\n\
  timeout has occurred.  Using OR with time_is_before_jiffies(txrx_timeout)\nmeans
  that:\n- before the 5-second timeout: the condition is `int_status || false`,\n\
  \  so it loops as long as there are pending interrupts.\n- after the 5-second timeout:
  the condition becomes `int_status |"
