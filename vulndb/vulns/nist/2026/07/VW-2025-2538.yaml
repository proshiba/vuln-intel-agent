title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  intel: punit_ipc: fix memory corruption\n\nThis passes the address of the pointer
  \"&punit_ipcdev\" when the intent\nwas to pass the pointer itself \"punit_ipcdev\"\
  \ (without the ampersand).\nThis means that the:\n\n\tcomplete(&ipcdev->cmd_complete);\n\
  \nin intel_punit_ioc() will write to a wrong memory address corrupting it."
