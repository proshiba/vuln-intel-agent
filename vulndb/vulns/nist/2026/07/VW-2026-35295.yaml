title: "Missing Authentication for Critical Function vulnerability in Honeywell Handheld
  Scanners allows Authentication Abuse.This issue affects Handheld Scanners: from
  C1 Base(Ingenic x1000) before GK000432BAA, from D1 Base(Ingenic x1600) before HE000085BAA,
  from A1/B1 Base(IMX25) before BK000763BAA_BK000765BAA_CU000101BAA.\n\nThis vulnerability
  could allow a remote attacker within Bluetooth range of the scanner's base station
  has the capability to remotely execute system commands on the host connected to
  the base station without authentication. This issue has been assigned  CVE-2026-4272
  https://nvd.nist.gov/vuln/detail/CVE-2026-4272  and rated with a severity of High.
  Honeywell strongly recommends that users upgrade to the latest version identified
  to resolve the vulnerability."
