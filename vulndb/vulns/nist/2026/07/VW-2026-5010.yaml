title: A vulnerability has been found in Open5GS up to 2.7.7. This issue affects
  the function gmm_handle_service_request of the file /src/amf/gmm-handler.c of 
  the component AMF. The manipulation leads to denial of service. The attack can
  be initiated remotely. The exploit has been disclosed to the public and may be
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
