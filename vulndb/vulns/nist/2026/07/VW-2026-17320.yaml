title: Craft CMS from 4.0.0-RC1 contains an authenticated path traversal 
  vulnerability in the assets/icon endpoint where the extension parameter is not
  validated before file existence checks. Attackers can bypass extension 
  validation by passing traversal sequences that resolve to existing SVG files, 
  allowing local file read access.
