title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/core:
  Add RCU read lock protection to perf_iterate_ctx()\n\nThe perf_iterate_ctx() function
  performs RCU list traversal but\ncurrently lacks RCU read lock protection. This
  causes lockdep warnings\nwhen running perf probe with unshare(1) under CONFIG_PROVE_RCU_LIST=y:\n\
  \n\tWARNING: suspicious RCU usage\n\tkernel/events/core.c:8168 RCU-list traversed
  in non-reader section!!\n\n\t Call Trace:\n\t  lockdep_rcu_suspicious\n\t  ? perf_event_addr_filters_apply\n\
  \t  perf_iterate_ctx\n\t  perf_event_exec\n\t  begin_new_exec\n\t  ? load_elf_phdrs\n\
  \t  load_elf_binary\n\t  ? lock_acquire\n\t  ? find_held_lock\n\t  ? bprm_execve\n\
  \t  bprm_execve\n\t  do_execveat_common.isra.0\n\t  __x64_sys_execve\n\t  do_syscall_64\n\
  \t  entry_SYSCALL_64_after_hwframe\n\nThis protection was previously present but
  was removed in commit\nbd2756811766 (\"perf: Rewrite core context handling\"). Add
  back the\nnecessary rcu_read_lock()/rcu_read_unlock() pair around\nperf_iterate_ctx()
  call in pe"
