title: "The userspace verifier z_vrfy_log_filter_set() for the log_filter_set syscall
  in subsys/logging/log_mgmt.c performed a signed comparison against the int16_t src_id
  parameter: src_id < (int16_t)log_src_cnt_get(domain_id). Any negative value for
  src_id (e.g. -1) trivially satisfied this check and was forwarded into z_impl_log_filter_set,
  where it propagated to filter_set() and ultimately to get_dynamic_filter(), which
  uses source_id as an unsigned index into the linker-section array &TYPE_SECTION_START(log_dynamic)[source_id].filters.\n\
  \nAfter implicit conversion through uint32_t, an int16_t -1 becomes 0xFFFFFFFF,
  indexing log_dynamic far out of bounds and causing the kernel to perform an OOB
