title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  bnxt: fix truesize for mb-xdp-pass case\n\nWhen mb-xdp is set and return is XDP_PASS,
  packet is converted from\nxdp_buff to sk_buff with xdp_update_skb_shared_info()
  in\nbnxt_xdp_build_skb().\nbnxt_xdp_build_skb() passes incorrect truesize argument
  to\nxdp_update_skb_shared_info().\nThe truesize is calculated as BNXT_RX_PAGE_SIZE
  * sinfo->nr_frags but\nthe skb_shared_info was wiped by napi_build_skb() before.\n\
  So it stores sinfo->nr_frags before bnxt_xdp_build_skb() and use it\ninstead of
  getting skb_shared_info from xdp_get_shared_info_from_buff().\n\nSplat looks like:\n\
  \ ------------[ cut here ]------------\n WARNING: CPU: 2 PID: 0 at net/core/skbuff.c:6072
  skb_try_coalesce+0x504/0x590\n Modules linked in: xt_nat xt_tcpudp veth af_packet
  xt_conntrack nft_chain_nat xt_MASQUERADE nf_conntrack_netlink xfrm_user xt_addrtype
  nft_coms\n CPU: 2 UID: 0 PID: 0 Comm: swapper/2 Not tainted 6.14.0-rc2+ #3\n RIP:
  0010:skb_try_coalesce+0x504/"
