title: SiYuan before v3.7.3 contains stored and reflected cross-site scripting 
  vulnerabilities in SVG sanitization that allows authenticated attackers to 
  execute scripts by bypassing the HTML parser-based cleaner. Attackers can hide
  script tags within desc, style, or noscript elements which the HTML parser 
  treats as raw text but browsers interpret as executable SVG content when 
  served as image/svg+xml, enabling script execution in the application origin.
