title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  skcipher - Fix reqsize handling\n\nCommit afddce13ce81d (\"crypto: api - Add reqsize
  to crypto_alg\")\nintroduced cra_reqsize field in crypto_alg struct to replace type\n\
  specific reqsize fields. It looks like this was introduced specifically\nfor ahash
  and acomp from the commit description as subsequent commits\nadd necessary changes
  in these alg frameworks.\n\nHowever, this is being recommended for use in all crypto
  algs [1]\ninstead of setting reqsize using crypto_*_set_reqsize(). Using\ncra_reqsize
  in skcipher algorithms, hence, causes memory\ncorruptions and crashes as the underlying
  functions in the algorithm\nframework have not been updated to set the reqsize properly
  from\ncra_reqsize. [2]\n\nAdd proper set_reqsize calls in the skcipher init function
  to\nproperly initialize reqsize for these algorithms in the framework.\n\n[1]: https://lore.kernel.org/linux-crypto/aCL8BxpHr5OpT04k@gondor.apana.org.au/\n\
  [2]: https://gist.git"
