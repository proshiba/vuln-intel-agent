title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  fix moving cancelled entry to ent_in_userspace list\n\nfuse_uring_cancel() moves
  entries that are available (these have no reqs\nattached) to the ent_in_userspace
  list. ent_list_request_expired()\nchecks the first entry on ent_in_userspace and
  dereferences\nent->fuse_req unconditionally, which will crash on a cancelled entry\n\
  that was moved to this list.\n\nFix this by freeing the entry and dropping queue_refs
  directly in\nfuse_uring_cancel(). This is safe because cancel is the cancel handler\n\
  itself - after io_uring_cmd_done(), no more cancels will be dispatched\nfor this
  command, and teardown serializes with cancel via queue->lock.\n\nSince cancel now
  decrements queue_refs, fuse_uring_abort() must no\nlonger gate fuse_uring_abort_end_requests()
  on queue_refs > 0, as\ncancelled entries may have already dropped queue_refs while
  requests are\nstill queued. Remove the gate so abort always flushes requests and
  stops\nqueues."
