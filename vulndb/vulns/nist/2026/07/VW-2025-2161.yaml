title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix unsafe xarray access in implicit ODP handling\n\n__xa_store() and __xa_erase()
  were used without holding the proper lock,\nwhich led to a lockdep warning due to
  unsafe RCU usage.  This patch\nreplaces them with xa_store() and xa_erase(), which
  perform the necessary\nlocking internally.\n\n  =============================\n\
  \  WARNING: suspicious RCPU usage\n  6.14.0-rc7_for_upstream_debug_2025_03_18_15_01
  #1 Not tainted\n  -----------------------------\n  ./include/linux/xarray.h:1211
  suspicious rcu_dereference_protected() usage!\n\n  other info that might help us
  debug this:\n\n  rcu_scheduler_active = 2, debug_locks = 1\n  3 locks held by kworker/u136:0/219:\n\
