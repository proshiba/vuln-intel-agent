title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix wrong index reference in smb2_compound_op()\n\nIn smb2_compound_op(),
  the loop that processes each command's response\nuses wrong indices when accessing
  response bufferes.\n\nThis incorrect indexing leads to improper handling of command
  results.\nAlso, if incorrectly computed index is greather than or equal to\nMAX_COMPOUND,
  it can cause out-of-bounds accesses."
