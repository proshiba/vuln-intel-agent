title: Zammad is a web based open source helpdesk/customer support system. Prior
  to 7.0.1, he REST endpoint POST /api/v1/ai_assistance/text_tools/:id contains 
  an authorization failure. Context data (e.g., a group or organization) 
  supplied to be used in the AI prompt were not checked if they are accessible 
  for the current user. This leads to having data present in the AI prompt that 
  were not authorized before being used. A user needs to have ticket.agent 
  permission to be able to use the provided context data. This vulnerability is 
  fixed in 7.0.1.
