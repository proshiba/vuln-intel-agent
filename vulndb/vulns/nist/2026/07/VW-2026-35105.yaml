title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Defer sub-object cleanup in export put callbacks\n\nsvc_export_put() calls path_put()
  and auth_domain_put() immediately\nwhen the last reference drops, before the RCU
  grace period. RCU\nreaders in e_show() and c_show() access both ex_path (via\nseq_path/d_path)
  and ex_client->name (via seq_escape) without\nholding a reference. If cache_clean
  removes the entry and drops the\nlast reference concurrently, the sub-objects are
  freed while still\nin use, producing a NULL pointer dereference in d_path.\n\nCommit
  2530766492ec (\"nfsd: fix UAF when access ex_uuid or\nex_stats\") moved kfree of
  ex_uuid and ex_stats into the\ncall_rcu callback, but left path_put() and auth_domain_put()
  running\nbefore the grace period because both may sleep and call_rcu\ncallbacks
  execute in softirq context.\n\nReplace call_rcu/kfree_rcu with queue_rcu_work(),
  which defers the\ncallback until after the RCU grace period and executes it in process\n\
  context wher"
