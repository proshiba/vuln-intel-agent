title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmfd:
  cros_ec: Delay dev_set_drvdata() until probe success\n\nIf ec_device_probe() fails,
  cros_ec_class_release releases memory for the\ncros_ec_dev structure. However, because
  the drvdata was already set,\nsub-drivers like cros_ec_typec can still retrieve
  the stale pointer via the\nplatform device. This leads to a use-after-free when
  cros_ec_typec attempts\nto access &typec->ec->ec->dev on a device that has already
  been released.\nMove dev_set_drvdata() to ensure that the pointer is only made available\n\
  once all initialization steps have succeeded.\n\n sysfs: cannot create duplicate
  filename '/class/chromeos/cros_ec'\n Call trace:\n  sysfs_do_create_link_sd+0x94/0xdc\n\
