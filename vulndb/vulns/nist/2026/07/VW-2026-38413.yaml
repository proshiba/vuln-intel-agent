title: A flaw was found in the keycloak-services component of Keycloak, which 
  provides identity and access management services. The issue occurs when a 
  realm administrator uses a wildcard domain (like *.example.com) to restrict 
  which hosts can register or update clients. Due to improper validation, the 
  system accepts any hostname that ends with the specified domain suffix, even 
  if it is not a legitimate subdomain. An attacker who can control the reverse 
  DNS of their connection can bypass these host-based restrictions, potentially 
  allowing unauthorized client modifications.
