title: "A Path Traversal vulnerability exists in Quick.CMS through the URI path component
  of HTTP requests, where the server fails to normalize dot-dot-slash (../) sequences
  before resolving and serving the requested file. An authenticated attacker with
  admin privileges can use this vulnerability to read contents of files located in
  the sibling directory of the webroot via a crafted HTTP request containing ../ sequences
  in the URI.\n\n\nThe vendor assessed the likelihood of exploitation as very low
  and determined that a fix is not necessary."
