title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix memory leaks in rxkad_verify_response()\n\nFix rxkad_verify_response() to free
  the ticket and the server key under all\ncircumstances by initialising the ticket
  pointer to NULL and then making\nall paths through the function after the first
  allocation has been done go\nthrough a single common epilogue that just releases
  everything - where all\nthe releases skip on a NULL pointer."
