title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/guc:
  Check GuC running state before deregistering exec queue\n\nIn normal operation,
  a registered exec queue is disabled and\nderegistered through the GuC, and freed
  only after the GuC confirms\ncompletion. However, if the driver is forced to unbind
  while the exec\nqueue is still running, the user may call exec_destroy() after the
  GuC\nhas already been stopped and CT communication disabled.\n\nIn this case, the
  driver cannot receive a response from the GuC,\npreventing proper cleanup of exec
  queue resources. Fix this by directly\nreleasing the resources when GuC is not running.\n\
  \nHere is the failure dmesg log:\n\"\n[  468.089581] ---[ end trace 0000000000000000
  ]---\n[  468.089608] pci 0000:03:00.0: [drm] *ERROR* GT0: GUC ID manager unclean
  (1/65535)\n[  468.090558] pci 0000:03:00.0: [drm] GT0:     total 65535\n[  468.090562]
  pci 0000:03:00.0: [drm] GT0:     used 1\n[  468.090564] pci 0000:03:00.0: [drm]
  GT0:     range 1..1 (1)\n"
