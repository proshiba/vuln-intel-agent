title: The Ninja Forms – The Contact Form Builder That Grows With You plugin for
  WordPress is vulnerable to generic SQL Injection via Import File 'settings' 
  Key in all versions up to, and including, 3.14.9 due to insufficient escaping 
  on the user supplied parameter and lack of sufficient preparation on the 
  existing SQL query. This makes it possible for authenticated attackers, with 
  administrator-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. The vulnerable keys originate from the 'settings' object in
  an attacker-controlled import file processed via file_get_contents() or 
  base64-decoded/JSON-decoded blobs, bypassing wp_magic_quotes protections 
  entirely; two distinct sinks are affected — _save_setting() in Model.php and 
  insert_form_meta() in ImportForm.php — as only the value side is escaped while
  the key side receives no sanitization or parameterization at any point in the 
  call chain.
