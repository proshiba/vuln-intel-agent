title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  serial: digi_acceleport: fix hard lockup on disconnect\n\nIf submitting the OOB
  write urb fails persistently (e.g if the device is\nbeing disconnected) the driver
  would loop indefinitely with interrupts\ndisabled.\n\nCheck for urb submission errors
  when sending OOB commands to avoid\nhanging if, for example, open(), set_termios()
  or close() races with a\nphysical disconnect.\n\nThis is issue was flagged by Sashiko
  when reviewing an unrelated change\nto the driver."
