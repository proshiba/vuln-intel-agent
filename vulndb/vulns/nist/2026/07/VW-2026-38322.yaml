title: A flaw was found in ansible-collection-redhat-leapp. When a remediation 
  task is executed with elevated privileges and the `leapp_old_postgresql_data` 
  option is selected, a PostgreSQL data backup archive is created with insecure 
  permissions. This allows a local non-root user on the managed node to read 
  sensitive archived PostgreSQL data, leading to information disclosure.
