title: Rouille 0.1.6 through 3.6.2 contains a reachable assertion vulnerability 
  in the Request::remove_prefix function that allows remote unauthenticated 
  attackers to crash the server by sending a crafted percent-encoded URL. 
  Attackers can send a request whose decoded path matches a configured prefix 
  while the raw percent-encoded path does not, causing the assert! to fail and 
  triggering either a 500 error or full process termination depending on the 
  panic configuration.
