title: "cJSON through 1.7.19 is vulnerable to uncontrolled recursion leading to stack
  exhaustion when an untrusted RFC 6902 JSON Patch is applied via cJSONUtils_ApplyPatches()
  or cJSONUtils_ApplyPatchesCaseSensitive(). A patch containing add and copy operations
  grafts duplicated subtrees to amplify document depth beyond the parser's nesting
  limit: cJSON_Delete() recurses with no depth bound, and the cJSON_Duplicate() guard
  CJSON_CIRCULAR_LIMIT is set to 10000, ten times the parser's 1000-level nesting
  limit and high enough to overflow a default thread stack. An attacker who can supply
  the patch document can crash the process, resulting in denial of service."
