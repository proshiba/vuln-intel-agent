title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Break the loop on failure in iommufd_fault_fops_read()\n\nOn a copy_to_user() failure
  inside the inner list_for_each_entry, only the\ninner loop breaks; the outer while
  re-fetches the just-restored fault group\nand retries the failing copy_to_user()
  forever, spinning the reader at 100%\nCPU with fault->mutex held.\n\nCheck rc after
  the inner loop and break the outer while as well."
