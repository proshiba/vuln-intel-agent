title: "There is a \"Use After Free\" vulnerability in Qt's QHttp2ProtocolHandler
  in the QtNetwork module. This only affects HTTP/2 handling, HTTP handling is not
  affected by this at all. This happens due to a race condition between how QHttp2Stream
  uploads the body of a\n POST request and the simultaneous handling of HTTP error
  responses.\n\n\n\nThis issue only affects Qt 6.9.0 and has been fixed for Qt 6.9.1."
