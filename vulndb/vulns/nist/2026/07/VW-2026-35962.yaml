title: The WPForms Pro plugin for WordPress is vulnerable to Arbitrary File 
  Upload in all versions up to, and including, 1.10.1.1 via the 
  ajax_chunk_upload_finalize function. This is due to the file type validation 
  occurring after chunk metadata and file contents have already been written to 
  disk, and the assembled file not being deleted upon validation failure. This 
  makes it possible for unauthenticated attackers to upload files that may be 
  executable, which makes remote code execution possible.
