title: "Missing Authorization vulnerability in Apache HBase thrift and rest delegation
  service.\n\nA scan operation in thrift/rest service has 3 steps, open, fetch(possible
  multiple times), close.\nThe open step will return an id which will be passed back
  to server for identifying the scanner instances stored at server side.\nWe missed
  the owner check in fetch and close steps which means a user can fetch rows from
  the scanner which is opened by other users, and close scanners which belongs to
  other users.\n\nThis issue affects Apache HBase:from 3.0.0-alpha-1 through 3.0.0-beta-1,
  from 2.6.0 through 2.6.5, from 2.5.0 through 2.5.14, through 2.4.*.\n\nUsers are
  recommended to upgrade to version 3.0.0-beta-2, 2.6.6 and 2.5.15, which fixes the
  issue."
