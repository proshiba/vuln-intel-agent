title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix block group refcount race in btrfs_create_pending_block_groups()\n\nBlock group
  creation is done in two phases, which results in a slightly\nunintuitive property:
  a block group can be allocated/deallocated from\nafter btrfs_make_block_group()
  adds it to the space_info with\nbtrfs_add_bg_to_space_info(), but before creation
  is completely completed\nin btrfs_create_pending_block_groups(). As a result, it
  is possible for a\nblock group to go unused and have 'btrfs_mark_bg_unused' called
  on it\nconcurrently with 'btrfs_create_pending_block_groups'. This causes a\nnumber
  of issues, which were fixed with the block group flag\n'BLOCK_GROUP_FLAG_NEW'.\n\
  \nHowever, this fix is not quite complete. Since it does not use the\nunused_bg_lock,
  it is possible for the following race to occur:\n\nbtrfs_create_pending_block_groups\
  \            btrfs_mark_bg_unused\n                                           if
  list_empty // false\n        list_"
