title: "Catalyst::View::Wkhtmltopdf versions before 0.6.1 for Perl allow shell command
  injection (RCE) via PDF render options.\n\nOptions are passed directly to the wkhtmltopdf
  command without sanitization.\n\nAny web application that passes user-controlled
  options such as the page_size, orientation or margins without validation allows
  shell command injection.\n\nVersion 0.6.0 was released with an incomplete fix for
  this issue.\n\nNote that the wkhtmltopdf project is no longer being developed, and
  users of this package should migrate to alternative solutions."
