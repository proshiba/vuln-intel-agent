title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  serial: digi_acceleport: fix write buffer corruption\n\nThe digi_write_inb_command()
  is supposed to wait for the write urb to\nbecome available or return an error, but
  instead it updates the transfer\nbuffer and tries to resubmit the urb on timeout.\n\
  \nTo make things worse, for commands like break control where no timeout\nis used,
  the driver would corrupt the urb immediately due to a broken\njiffies comparison
  (on 32-bit machines this takes five minutes of uptime\nto trigger due to INITIAL_JIFFIES).\n\
  \nFix this by adding the missing return on timeout and waiting\nindefinitely when
  no timeout has been specified as intended.\n\nThis issue was (sort of) flagged by
  Sashiko when reviewing an unrelated\nchange to the driver."
