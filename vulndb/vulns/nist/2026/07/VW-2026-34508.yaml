title: The Kirki – Freeform Page Builder, Website Builder & Customizer plugin 
  for WordPress is vulnerable to Insecure Direct Object Reference in all 
  versions up to, and including, 6.0.14 via the 'context' parameter due to 
  missing validation on a user controlled key. This makes it possible for 
  unauthenticated attackers to read the full title, content, and excerpt of any 
  WordPress post — including drafts, pending, privately published, 
  password-protected, and trashed posts — regardless of author, by supplying an 
  arbitrary post ID via the context parameter alongside an attacker-controlled 
  block template.
