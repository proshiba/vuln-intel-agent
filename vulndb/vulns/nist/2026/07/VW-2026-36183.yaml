title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio:
  Remove device debugfs before releasing devres\n\nVFIO device debugfs files created
  with debugfs_create_devm_seqfile()\nstore a devres allocated debugfs_devm_entry
  as inode private data.\nvfio_unregister_group_dev() currently calls vfio_device_del()
  before\nvfio_device_debugfs_exit(), but device_del() releases devres.  This can\n\
  leave debugfs entries visible with stale inode private data while\nunregister waits
  for userspace references to drain.\n\nRemove the per-device debugfs tree before
  vfio_device_del().  The debugfs\nview is diagnostic only, so losing it at the start
  of unregister is\npreferable to preserving entries whose backing storage may already
  have\nbeen released.\n\nComplete the teardown by clearing the per-device debugfs
  root after\nremoval.  This matches the global debugfs root cleanup and prevents\n\
  future users from mistaking a removed dentry for a live debugfs tree\nduring the
  remainder of unregister."
