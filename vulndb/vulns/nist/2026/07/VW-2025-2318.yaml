title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  xilinx: axienet: Add error handling for RX metadata pointer retrieval\n\nAdd proper
  error checking for dmaengine_desc_get_metadata_ptr() which\ncan return an error
  pointer and lead to potential crashes or undefined\nbehaviour if the pointer retrieval
  fails.\n\nProperly handle the error by unmapping DMA buffer, freeing the skb and\n\
  returning early to prevent further processing with invalid data."
