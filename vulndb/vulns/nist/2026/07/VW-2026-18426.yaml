title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  conntrack_irc: fix possible out-of-bounds read\n\nWhen parsing fails after we've
  matched the command string we\nshould bail out instead of trying to match a different
  command.\n\nThis helper should be deprecated, given prevalence of TLS I doubt it
  has\nany relevance in 2026."
