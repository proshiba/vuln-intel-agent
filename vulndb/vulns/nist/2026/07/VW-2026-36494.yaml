title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB reads in is_ap_in_tkip() IE loop\n\nThe loop in is_ap_in_tkip()
  iterates over IEs without verifying that\nenough bytes remain before dereferencing
  the IE header or its payload:\n\n- pIE->element_id and pIE->length are read without
  checking that\n  i + sizeof(*pIE) <= ie_length, so a truncated IE at the end of
  the\n  buffer causes an OOB read.\n\n- For WLAN_EID_VENDOR_SPECIFIC the code compares
  pIE->data + 12,\n  which requires pIE->length >= 16.  For WLAN_EID_RSN it compares\n\
  \  pIE->data + 8, requiring pIE->length >= 12.  Neither requirement\n  is checked.\n\
  \nAdd the missing IE header and payload bounds checks and guard each\ndata access
  with an explicit pIE->length minimum, matching the\npattern established in update_beacon_info()."
