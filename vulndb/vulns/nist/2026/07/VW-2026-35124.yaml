title: prompts.chat prior to commit 1464475, contains an identity confusion 
  vulnerability due to inconsistent case-sensitive and case-insensitive handling
  of usernames across write and read paths, allowing attackers to create 
  case-variant usernames that bypass uniqueness checks. Attackers can exploit 
  non-deterministic username resolution to impersonate victim accounts, replace 
  profile content on canonical URLs, and inject attacker-controlled metadata and
  content across the platform.
