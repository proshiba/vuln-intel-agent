title: 'A weakness has been identified in Dígitro NGC Explorer up to 3.48.21. This
  affects an unknown function. Executing a manipulation can lead to session expiration.
  The attack can be launched remotely. Upgrading to version 3.48.22 mitigates this
  issue. It is recommended to upgrade the affected component. The action taken by
  the vendor is: "Strengthening of session control, expiration and invalidation mechanisms."
  The vulnerabilities are limited to NGC Explorer and do not affect other Dígitro
  products, including UNA and Guardião.'
