title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/slab:
  do not limit zeroing to orig_size when only red zoning is enabled\n\nWhen init (zeroing)
  on allocation is requested, for kmalloc() we\ngenerally have to zero the full object
  size even if a smaller size is\nrequested, in order to provide krealloc()'s __GFP_ZERO
  guarantees.\n\nBut if we track the requested size, krealloc() uses that information
  to\ndo the right thing, so we can zero only the requested size. With red\nzoning
  also enabled, any extra size became part of the red zone, so it\nmust not be zeroed
  and thus we must zero only the requested size.\n\nHowever the current check is imprecise,
  and will trigger also when only\nSLAB_RED_ZONE is enabled without SLAB_STORE_USER
  (which enables tracking\nthe requested size). This means enabling red zoning alone
  can compromise\nkrealloc()'s __GFP_ZERO contract.\n\nFix this by using slub_debug_orig_size()
  instead, which is the exact\ncheck for whether the requested size is tracked. We"
