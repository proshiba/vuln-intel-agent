title: OpenSTAManager is an open source management software for technical 
  assistance and invoicing. Prior to 2.10.2, confronta_righe.php files across 
  different modules in OpenSTAManager contain an SQL Injection vulnerability. 
  The righe parameter received via $_GET['righe'] is directly concatenated into 
  an SQL query without any sanitization, parameterization or validation. An 
  authenticated attacker can inject arbitrary SQL statements to extract 
  sensitive data from the database, including user credentials, customer 
  information, invoice data and any other stored data. This vulnerability is 
  fixed in 2.10.2.
