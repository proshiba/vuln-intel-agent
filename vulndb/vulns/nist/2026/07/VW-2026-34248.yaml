title: "Relative Path Traversal, Improper Isolation or Compartmentalization vulnerability
  in erlang otp erlang/otp (tftp_file modules), erlang otp inets (tftp_file modules),
  erlang otp tftp (tftp_file modules) allows Relative Path Traversal. This vulnerability
  is associated with program files lib/tftp/src/tftp_file.erl, src/tftp_file.erl.\n\
  \nThis issue affects OTP from OTP 17.0 before OTP 28.3.2, OTP 27.3.4.8 and OTP 26.2.5.17,
  corresponding to tftp from 1.0 before 1.2.4, 1.2.2.1 and 1.1.1.1; also inets from
  5.10 before 7.0."
