title: A stored Cross-Site Scripting (XSS) vulnerability in the file upload 
  functionality of the Media Manager in TastyIgniter v4.3.0, caused by 
  insufficient validation and sanitization of SVG files. An authenticated user 
  with low privileges can upload a malicious SVG file containing JavaScript 
  code. When an administrator views that file, the code executes in the context 
  of their browser. By chaining this vulnerability with a Cross-Site Request 
  Forgery (CSRF) attack, an attacker can extract the administrator’s CSRF token 
  and perform unauthorized actions—such as modifying credentials—thereby gaining
  full control of the administrative account.
