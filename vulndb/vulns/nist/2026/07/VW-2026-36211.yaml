title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: ad_sigma_delta: fix CS held asserted and state leaks\n\nIn ad_sigma_delta_single_conversion(),
  set_mode(AD_SD_MODE_IDLE) and\ndisable_one() were called from the out: block while
  keep_cs_asserted\nwas still true. This caused any SPI transfer issued by those callbacks\n\
  to carry cs_change=1, leaving CS permanently asserted after the\nconversion. Fix
  by moving both calls into the out_unlock: block, after\nkeep_cs_asserted is cleared,
  matching the pattern already used in\nad_sd_calibrate().\n\nIn the error path of
  ad_sd_buffer_postenable(), if an operation fails\nafter set_mode(AD_SD_MODE_CONTINUOUS)
  has already succeeded (e.g.\nspi_offload_trigger_enable()), the device is left in
  continuous\nconversion mode with CS physically asserted. Additionally,\nbus_locked
  remaining true after spi_bus_unlock() causes subsequent\nSPI operations to call
  spi_sync_locked() without the bus lock actually\nheld, allowing concurrent SPI access.\n\
  \nF"
