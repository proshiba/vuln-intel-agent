title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetdev:
  fix double-free in netdev_nl_bind_rx_doit()\n\nSashiko flags that genlmsg_reply()
  always consumes the skb.\nThe error path calls nlmsg_free(rsp) so we can't jump
  directly\nto it. Let's not unbind, just propagate the error to the user.\nThis is
  the typical way of handling genlmsg_reply() failures.\nThey shouldn't happen unless
  user does something silly like\ncalling the kernel with an already-full rcvbuf."
