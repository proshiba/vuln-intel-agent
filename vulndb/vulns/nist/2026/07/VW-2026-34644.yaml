title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix overrun check in netfs_extract_user_iter()\n\nFix netfs_extract_user_iter()
  so that if iov_iter_extract_pages() overfills\npages[], then those pages don't get
  included in the iterator constructed at\nthe end of the function.  If there was
  an overfill, memory corruption has\nalready happened."
