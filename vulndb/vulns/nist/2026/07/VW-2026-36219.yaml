title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrust:
  block: fix GenDisk cleanup paths\n\nGenDiskBuilder::build() still has fallible work
  after\n__blk_mq_alloc_disk(), but its error path only recovers the\nforeign queue
  data. That leaks the temporary gendisk and\nrequest_queue until later teardown.
  If the caller moved the last\nArc<TagSet<T>> into build(), the leaked queue can
  retain blk-mq\nstate after the tag set is dropped.\n\nFix the pre-registration failure
  path by dropping the temporary\ngendisk reference with put_disk() before recovering
  queue_data,\nso disk_release() can tear down the owned queue.\n\nAlso pair GenDisk::drop()
  with put_disk() after del_gendisk().\nOnce a Rust GenDisk has been added with device_add_disk(),\n\
  del_gendisk() only unregisters it; the final gendisk reference\nstill has to be
  dropped to complete the release path."
