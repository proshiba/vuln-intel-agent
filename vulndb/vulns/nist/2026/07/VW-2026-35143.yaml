title: 'OpenPrinting CUPS is an open source printing system for Linux and other Unix-like
  operating systems. In versions 2.4.16 and prior, in a network-exposed cupsd with
  a shared target queue, an unauthorized client can send a Print-Job to that shared
  PostScript queue without authentication. The server accepts a page-border value
  supplied as textWithoutLanguage, preserves an embedded newline through option escaping
  and reparse, and then reparses the resulting second-line PPD: text as a trusted
  scheduler control record. A follow-up raw print job can therefore make the server
  execute an attacker-chosen existing binary such as /usr/bin/vim as lp. At time of
  publication, there are no publicly available patches.'
