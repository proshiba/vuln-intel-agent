title: "Image::WebP versions before 0.3.0 for Perl bundle a vulnerable version of
  libwebp.\n\nImage::WebP does not link to the system libwebp. Instead, it uses a
  bundled copy of libwebp 0.3.0 (released 2013-03-20). That version has multiple known
  vulnerabilities, including CVE-2023-4863.\n\nAny caller that decodes an untrusted
  WebP image reaches the bundled decoder. Because the library is compiled into the
  module, upgrading the system libwebp does not remediate this."
