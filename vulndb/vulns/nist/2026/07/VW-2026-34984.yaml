title: A vulnerability was identified in Newgen OmniDocs up to 12.0.00. Affected
  by this vulnerability is an unknown functionality of the file 
  /omnidocs/GetWebApiConfiguration. The manipulation of the argument 
  connectionDetails leads to information disclosure. The attack is possible to 
  be carried out remotely. The attack is considered to have high complexity. The
  exploitation appears to be difficult. The exploit is publicly available and 
  might be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
