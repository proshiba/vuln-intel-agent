title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  serial: pch_uart: add check for dma_alloc_coherent()\n\nAdd a check for dma_alloc_coherent()
  failure to prevent a potential\nNULL pointer dereference in dma_handle_rx(). Properly
  release DMA\nchannels and the PCI device reference using a goto ladder if the\n\
  allocation fails."
