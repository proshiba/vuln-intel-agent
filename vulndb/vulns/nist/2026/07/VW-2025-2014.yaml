title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btusb: avoid NULL pointer dereference in skb_dequeue()\n\nA NULL pointer dereference
  can occur in skb_dequeue() when processing a\nQCA firmware crash dump on WCN7851
  (0489:e0f3).\n\n[ 93.672166] Bluetooth: hci0: ACL memdump size(589824)\n\n[ 93.672475]
  BUG: kernel NULL pointer dereference, address: 0000000000000008\n[ 93.672517] Workqueue:
  hci0 hci_devcd_rx [bluetooth]\n[ 93.672598] RIP: 0010:skb_dequeue+0x50/0x80\n\n\
  The issue stems from handle_dump_pkt_qca() returning 0 even when a dump\npacket
  is successfully processed. This is because it incorrectly\nforwards the return value
  of hci_devcd_init() (which returns 0 on\nsuccess). As a result, the caller (btusb_recv_acl_qca()
  or\nbtusb_recv_evt_qca()) assumes the packet was not handled and passes it\nto hci_recv_frame(),
  leading to premature kfree() of the skb.\n\nLater, hci_devcd_rx() attempts to dequeue
  the same skb from the dump\nqueue, resulting in a NULL pointer dereferenc"
