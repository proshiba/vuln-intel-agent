title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  appleir: fix UAF on pending key_up_timer in remove()\n\nappleir_remove() runs hid_hw_stop()
  before timer_delete_sync().\nhid_hw_stop() synchronously unregisters the HID input
  device via\nhid_disconnect() -> hidinput_disconnect() -> input_unregister_device(),\n\
  which drops the last reference and frees the underlying input_dev when\nno userspace
  handle holds it open.\n\nkey_up_tick() reads appleir->input_dev and calls input_report_key()
  /\ninput_sync() on it.  The timer is armed from appleir_raw_event() with\na HZ/8
  (~125 ms) timeout on every keydown and key-repeat report.  If a\nkey was pressed
  shortly before the device is disconnected, the timer\ncan fire after hid_hw_stop()
  has freed input_dev but before the\nteardown drains it.\n\nA simple reorder is not
  sufficient.  Putting the timer drain first\nstill leaves a window where a USB URB
  completion (raw_event) running\nduring hid_hw_stop() can call mod_timer() and re-arm
  the timer,"
