title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usx2y: us144mkii: fix work UAF on disconnect\n\ntascam_disconnect() cancels capture_work
  and midi_in_work before\nusb_kill_anchored_urbs() kills the capture/MIDI-in URBs.\
  \  Those URBs\nself-resubmit, and their completion handlers reschedule the work.\n\
  \nA URB that completes in the small window between cancel_work_sync() and\nusb_kill_anchored_urbs()
  therefore re-arms the work after its only\ncancel.  Nothing cancels it again before
  snd_card_free() frees the\ncard-private tascam structure, so the work handler then
  runs on freed\nmemory.\n\nKill the anchored URBs before cancelling the work; once
  the work is\ncancelled no remaining URB can complete to re-arm it."
