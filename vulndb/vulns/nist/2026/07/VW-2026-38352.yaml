title: A Server-Side Request Forgery (SSRF) vulnerability exists in the generic 
  HTTP source and tool components of Google mcp-toolbox versions 0.3.0 through 
  1.4.0. While the toolbox implements baseline input sanitization for 
  user-controlled parameters, the underlying HTTP client 
  (internal/sources/http/http.go) fails to safely regulate request redirection 
  boundaries. Specifically, the client is initialized without a restrictive 
  CheckRedirect policy hook and lacks target IP validation. An attacker or a 
  malicious data-driven prompt can supply a crafted path parameter that triggers
  an open redirect or a direct destination swap on the target backend, coercing 
  the mcp-toolbox into blindly following the redirection and making unauthorized
  requests to internal or arbitrary external endpoints.
