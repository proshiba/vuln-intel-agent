title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  add missing cpu_to_node to kvzalloc_node in mlx5e_open_xdpredirect_sq\n\nkvzalloc_node
  is not doing a runtime check on the node argument\n(__alloc_pages_node_noprof does
  have a VM_BUG_ON, but it expands to\nnothing on !CONFIG_DEBUG_VM builds), so doing
  any ethtool/netlink\noperation that calls mlx5e_open on a CPU that's larger that
  MAX_NUMNODES\ntriggers OOB access and panic (see the trace below).\n\nAdd missing
  cpu_to_node call to convert cpu id to node id.\n\n[  165.427394] mlx5_core 0000:5c:00.0
