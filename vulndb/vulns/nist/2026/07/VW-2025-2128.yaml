title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbridge:
  mcast: Fix use-after-free during router port configuration\n\nThe bridge maintains
  a global list of ports behind which a multicast\nrouter resides. The list is consulted
  during forwarding to ensure\nmulticast packets are forwarded to these ports even
  if the ports are not\nmember in the matching MDB entry.\n\nWhen per-VLAN multicast
  snooping is enabled, the per-port multicast\ncontext is disabled on each port and
  the port is removed from the global\nrouter port list:\n\n # ip link add name br1
  up type bridge vlan_filtering 1 mcast_snooping 1\n # ip link add name dummy1 up
  master br1 type dummy\n # ip link set dev dummy1 type bridge_slave mcast_router
  2\n $ bridge -d mdb show | grep router\n router ports on br1: dummy1\n # ip link
  set dev br1 type bridge mcast_vlan_snooping 1\n $ bridge -d mdb show | grep router\n\
  \nHowever, the port can be re-added to the global list even when per-VLAN\nmulticast
  snooping is enabled:\n\n # ip link se"
