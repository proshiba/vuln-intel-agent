title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Bound used_lrs when flushing the pKVM hyp vCPU\n\nflush_hyp_vcpu() copies
  the host vGIC state into the hyp's private vCPU\non every run. The vGIC list register
  save and restore use used_lrs as\ntheir loop bound and expect it to stay within
  the number of implemented\nlist registers. While this is generally the case, flush_hyp_vcpu()\n\
  copies vgic_v3 verbatim and does not enforce this, so a value provided\nby the host
  is used at EL2 to index vgic_lr[] and access ICH_LR<n>_EL2\n(host -> EL2).\n\nFix
  by clamping used_lrs to the number of implemented list registers\nafter the copy,
  as the trusted path already does in\nvgic_flush_lr_state(). The number of implemented
  list registers is\nconstant after init, so it is replicated once from\nkvm_vgic_global_state.nr_lr
  into hyp_gicv3_nr_lr rather than read on\nevery entry."
