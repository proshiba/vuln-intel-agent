title: Sliver is a command and control framework that uses a custom Wireguard 
  netstack. Prior to version 1.7.4, a single click on a malicious link gives an 
  unauthenticated attacker immediate, silent control over every active C2 
  session or beacon, capable of exfiltrating all collected target data (e.g. SSH
  keys, ntds.dit) or destroying the entire compromised infrastructure, entirely 
  through the operator's own browser. This issue has been patched in version 
  1.7.4.
