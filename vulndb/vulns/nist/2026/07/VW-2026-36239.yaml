title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qat - remove unused character device and IOCTLs\n\nThe QAT driver exposes a character
  device (qat_adf_ctl) with IOCTLs\nfor device configuration, start, stop, status
  query and enumeration.\nThese IOCTLs are not part of any public uAPI header and
  have no known\nin-tree or out-of-tree users. Device lifecycle is already managed
  via\nsysfs.\n\nThe ioctl interface also increases the attack surface and is the\n\
  subject of a number of bug reports.\n\nRemove the character device, the IOCTL definitions,
  and the related\ndata structures (adf_dev_status_info, adf_user_cfg_key_val,\nadf_user_cfg_section,
  adf_user_cfg_ctl_data). Drop the now-unused\nadf_cfg_user.h header and strip adf_ctl_drv.c
  down to the minimal\nmodule_init/module_exit hooks for workqueue, AER, and crypto/compression\n\
  algorithm registration.\n\nClean up leftover dead code that was only reachable from
  the removed\nIOCTL paths: adf_cfg_del_all(), adf_devmgr_verify_id(),\nadf_"
