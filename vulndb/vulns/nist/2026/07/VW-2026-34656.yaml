title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/mm:
  Disable broadcast TLB flush when PCID is disabled\n\nBooting with \"nopcid\" clears
  X86_FEATURE_PCID and keeps CR4.PCIDE from being\nset to one. On AMD CPUs that support
  INVLPGB, broadcast TLB flushing remains\nenabled.\n\nThere are two checks that decide
  whether the global ASID code runs,\nmm_global_asid() and consider_global_asid(),
  that key off of the\nX86_FEATURE_INVLPGB feature. Once an mm becomes active on more
  than three\nCPUs, consider_global_asid() assigns it a global ASID, after which\n\
  flush_tlb_mm_range() takes the broadcast_tlb_flush() path using a non-zero\nPCID.
  Issuing an INVLPGB with a non-zero PCID while CR4.PCIDE is not set\nresults in a
  #GP:\n\n  Oops: general protection fault, kernel NULL pointer dereference 0x1: 0000
  [#1] SMP NOPTI\n  CPU: 158 UID: 0 PID: 3119 Comm: snap Not tainted 7.1.0-rc3 #1
  PREEMPT(full)\n  Hardware name: ...\n  RIP: 0010:broadcast_tlb_flush\n  Code: ...
  89 da 48 83 c8 07 <0f> 01 fe eb 0"
