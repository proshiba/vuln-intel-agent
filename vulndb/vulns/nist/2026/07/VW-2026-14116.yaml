title: "In specific scenarios involving HTTP redirects from a secure to an insecure
  endpoint, the Reactor Netty HTTP client may leak credentials. In order for this
  to happen, the HTTP client must have been explicitly configured to follow redirects.\n\
  \nAffected versions:\nReactor Netty 1.0.0 through 1.0.51; 1.1.0 through 1.1.35;
  1.2.0 through 1.2.17; 1.3.0 through 1.3.5."
