title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  es1938: check snd_ctl_new1() return value\n\nsnd_ctl_new1() can return NULL when
  memory allocation fails.\nsnd_es1938_mixer() does not check the return value before
  dereferencing\nthe pointer, which can lead to a NULL pointer dereference.\n\nAdd
  a NULL check after snd_ctl_new1() and return -ENOMEM if it fails."
