title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: Fix use-after-free in l2cap_sock_new_connection_cb()\n\nl2cap_sock_new_connection_cb()
  returned l2cap_pi(sk)->chan after\nrelease_sock(parent). Once the parent lock is
  dropped the newly\nenqueued child socket sk is reachable via the accept queue, so
  another\ntask can accept and free it before the callback dereferences sk,\nresulting
  in a use-after-free.\n\nRework the ->new_connection() op so the core, rather than
  the callback,\nowns the child channel's lifetime. The op now receives a pre-allocated\n\
  new_chan and returns an errno instead of allocating and returning a\nchannel. l2cap_new_connection()
  allocates the child channel and links\nit into the conn list via __l2cap_chan_add()
  before invoking the\ncallback, so the conn-list reference keeps the channel alive
  once\nrelease_sock(parent) exposes the socket to other tasks.\n\nChannel configuration
  that was duplicated in l2cap_sock_init() and the\nvarious new_connection"
