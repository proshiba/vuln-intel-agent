title: A flaw was found in libgnutls. A remote attacker, by sending an extremely
  short premaster secret during an RSA key exchange to a server using an RSA key
  backed by a PKCS#11 token, could trigger a short heap overread. This memory 
  corruption vulnerability could lead to information disclosure.
