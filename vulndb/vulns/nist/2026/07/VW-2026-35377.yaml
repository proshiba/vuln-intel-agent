title: "An improper access control vulnerability exists in Semtech LoRa LR11xxx transceivers
  running early versions of firmware where the memory write command accessible via
  the physical SPI interface fails to enforce write protection on the program call
  stack. An attacker with physical access to the SPI interface can overwrite stack
  memory to hijack program control flow and achieve limited arbitrary code execution.
  However, the impact is limited to the active attack session: the device's secure
  boot mechanism prevents persistent firmware modification, the crypto engine isolates
  cryptographic keys from direct firmware access, and all modifications are lost upon
  device reboot or loss of physical access."
