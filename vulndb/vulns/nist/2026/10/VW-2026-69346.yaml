title: Zod schema-validation library through 4.6.5 contains an uncontrolled 
  resource consumption vulnerability that allows attackers to exhaust memory by 
  submitting a large array to an application using an array schema without a 
  length constraint. Attackers can exploit the handleArrayResult parse logic in 
  $ZodArray, which accumulates every validation issue for each failing element 
  with no cap or early termination, causing the process to allocate excessive 
  issue objects and crash due to out-of-memory conditions.
