title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  fix refcount bug in iwpm_get_nlmsg_request()\n\niwpm_get_nlmsg_request() initializes
  refcount _after_ list_add_tail()\nmaking it accessible to global list where another
  CPU can kref_get()\non nlmsg_request causing a refcount \"addition on 0\" bug. Fix
  this\nby initializing kref _before_ list_add_tail() so refcount for\nnlmsg_request
  can be incremented/decremented normally. In addition,\nalso initialize every field
  before list_add_tail()."
