title: Backstage is an open framework for building developer portals. Prior to 
  0.3.10 in @backstage/plugin-scaffolder-backend-module-bitbucket-cloud and 
  0.2.25 in @backstage/plugin-scaffolder-backend-module-bitbucket-server, the 
  Bitbucket pull-request Scaffolder actions did not sufficiently validate 
  filesystem paths. An authenticated user who can execute an eligible template 
  and influence an allowed Bitbucket repository could affect paths outside the 
  expected working area, potentially compromising backend confidentiality, 
  integrity, or availability. This issue is fixed in 
  @backstage/plugin-scaffolder-backend-module-bitbucket-cloud 0.3.10 and 
  @backstage/plugin-scaffolder-backend-module-bitbucket-server 0.2.25.
