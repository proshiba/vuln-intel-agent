title: Fluent Bit out_file plugin does not properly sanitize tag values when 
  deriving output file names. When the File option is omitted, the plugin uses 
  untrusted tag input to construct file paths. This allows attackers with 
  network access to craft tags containing path traversal sequences that cause 
  Fluent Bit to write files outside the intended output directory.
