title: ThriveX-Server through 4.0 contains a missing authorization vulnerability
  in the GET /api/article and /api/article/{id} endpoints that allows 
  unauthenticated attackers to read unpublished draft and soft-deleted articles.
  Attackers can request sequential article ids or supply isDraft=true or 
  isDel=true query parameters to retrieve full titles, descriptions and content 
  of non-public articles.
