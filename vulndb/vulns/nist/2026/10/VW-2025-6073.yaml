title: Turms Server v0.10.0-SNAPSHOT and earlier contains a plaintext password 
  storage vulnerability in the administrator authentication system. The 
  BaseAdminService class caches administrator passwords in plaintext within 
  AdminInfo objects to optimize authentication performance. Upon successful 
  login, raw passwords are stored unencrypted in memory in the rawPassword 
  field. Attackers with local system access can extract these passwords through 
  memory dumps, heap analysis, or debugger attachment, bypassing bcrypt 
  protection.
