title: A vulnerability was detected in gedelumbung HospitalManagement up to 
  c2d45543789a3887067d3915f69d44cfc2cf76a8. Impacted is the function 
  sistem.php::simpan of the file 
  application/modules/admin/controllers/sistem.php of the component 
  Configuration Handler. The manipulation of the argument 
  tipe/title/content_setting results in improper authorization. The attack may 
  be launched remotely. The exploit is now public and may be used. This product 
  operates on a rolling release basis, ensuring continuous delivery. 
  Consequently, there are no version details for either affected or updated 
  releases. The project was informed of the problem early through an issue 
  report but has not responded yet.
