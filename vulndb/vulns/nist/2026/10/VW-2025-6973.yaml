title: Dependency-Track is a component analysis platform that allows 
  organizations to identify and reduce risk in the software supply chain. Prior 
  to version 4.13.5, Dependency-Track may send credentials meant for a private 
  NuGet repository to `api.nuget.org` via the HTTP `Authorization` header, and 
  may disclose names and versions of components marked as internal to 
  `api.nuget.org`. This can happen if the Dependency-Track instance contains 
  .NET components, a custom NuGet repository has been configured, the custom 
  repository has been configured with authentication credentials, and the 
  repository server does not provide `PackageBaseAddress` resource in its 
  service index. The issue has been fixed in Dependency-Track 4.13.5. Some 
  workarounds are avaialble. Disable custom NuGet repositories until the patch 
  has been applied, invalidate the previously used credentials, and generate new
  credentials for usage after the patch has been applied.
