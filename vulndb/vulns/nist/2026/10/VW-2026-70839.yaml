title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmemstick:
  ms_block: destroy io_queue workqueue on removal\n\nmsb_init_disk() creates the per-card
  ordered workqueue msb->io_queue with\nalloc_ordered_workqueue(). It is torn down
  with destroy_workqueue() only\non the init error path; msb_remove() never destroys
  it. msb_stop() merely\nflushes the queue, and neither msb_data_clear() nor put_disk()
  free it. As\na result every card insert/remove cycle leaks the workqueue and its\n\
  kworker, exhausting kernel memory over repeated cycles.\n\nDestroy the workqueue
  in msb_remove() after the disk has been removed and\nthe queue drained."
