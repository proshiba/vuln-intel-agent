title: FreePBX is an open source GUI for managing Asterisk. In versions prior to
  16.0.68.39 for FreePBX 16 and versions prior to 17.0.18.38 for FreePBX 17, a 
  reflected cross-site scripting vulnerability is present on the Asterisk HTTP 
  Status page. The Asterisk HTTP status page is exposed by FreePBX and is 
  available by default on version 16 via any bound IP address at port 8088. By 
  default on version 17, the binding is only to localhost IP, making it 
  significantly less vulnerable. The vulnerability can be exploited by 
  unauthenticated attackers to obtain cookies from logged-in users, allowing 
  them to hijack a session of an administrative user. The theft of admin session
  cookies allows attackers to gain control over the FreePBX admin interface, 
  enabling them to access sensitive data, modify system configurations, create 
  backdoor accounts, and cause service disruption. This issue has been patched 
  in version 16.0.68.39 for FreePBX 16 and version 17.0.18.38 for FreePBX 17.
