title: Backstage is an open framework for building developer portals. Prior to 
  3.3.1, 3.4.1, 4.0.3 and 4.1.0, the @backstage/plugin-scaffolder-backend 
  package is affected by scaffolder action input authorization bypass. An 
  authenticated user with access to affected Scaffolder templates could bypass 
  configured action restrictions. Depending on integration credentials, this 
  could grant unauthorized access to repositories and related source-control 
  resources. This issue is fixed in versions 3.3.1, 3.4.1, 4.0.3 and 4.1.0.
