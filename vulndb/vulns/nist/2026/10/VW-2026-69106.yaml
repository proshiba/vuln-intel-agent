title: The Ad Inserter – Ad Manager & AdSense Ads plugin for WordPress is 
  vulnerable to Reflected Cross-Site Scripting via the Referer header in all 
  versions up to, and including, 2.8.18 due to insufficient input sanitization 
  and output escaping on the '{search-query}' dynamic tag. When an ad block's 
  code contains that tag, replace_ai_tags() reads $_SERVER['HTTP_REFERER'] and 
  tests it with the regex /[\.\/](google|yahoo|bing|ask)\.[a-z\.]{2,5}[\/]/i. 
  The leading [\.\/] class matches a literal slash, so any referrer merely 
  containing a segment such as '/google.com/' passes as a search-engine 
  referral; the plugin then percent-decodes the referring query with parse_str()
  and substitutes the resulting 'q' (or 'p') value into the block via 
  preg_replace() with no escaping. This makes it possible for unauthenticated 
