title: Traccar through 6.16.0 contains a weak password recovery vulnerability 
  that allows attackers to reuse password reset tokens as session credentials 
  because TokenManager does not bind tokens to a purpose. Attackers holding a 
  leaked reset link can obtain a full session via /api/session or change 
  passwords via /api/password/update, retaining access for seven days even after
  the victim resets their password.
