title: When processing issue and comment bodies, Gitea scanned the entire 
  preceding text for action keywords such as "closes" or "fixes" once per 
  Markdown link, giving processing time quadratic in the input size. An 
  authenticated user able to submit issue or comment content could send a 
  crafted body of about 1 MB that keeps a CPU core busy for several minutes 
  while holding a database transaction open.
