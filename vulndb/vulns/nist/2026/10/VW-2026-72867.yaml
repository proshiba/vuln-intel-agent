title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, the CONNECT 
  engine's DOS table type used an incorrect boundary check that permitted a 
  one-byte null write beyond a stack buffer at an attacker-controlled offset. An
  authenticated user able to use the CONNECT engine could cause a crash and 
  potentially remote code execution. This issue is fixed in versions 10.6.28, 
  10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2.
