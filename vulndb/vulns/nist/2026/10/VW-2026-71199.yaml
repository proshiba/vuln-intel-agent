title: LangChain is a framework for building LLM-powered applications. Prior to 
  1.3.1, MongoDBChatMessageHistory does not enforce the documented string type 
  for an untrusted structured session identifier at runtime, allowing the 
  identifier to be interpreted as a MongoDB query condition rather than as a 
  literal value when multiple users' histories are stored in a shared MongoDB 
  collection. An attacker able to invoke chat-history operations can read, 
  modify, or delete another user's stored conversation. Applications using 
  authenticated, server-controlled string identifiers are not affected. This 
  issue is fixed in version 1.3.1.
