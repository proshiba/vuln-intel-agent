title: The NEX-Forms – Ultimate Forms Plugin for WordPress plugin for WordPress 
  is vulnerable to SQL Injection via the  'orderby' parameter in the action 
  nf_load_form_entries in all versions up to, and including, 9.1.6 due to 
  insufficient escaping on the user supplied parameter and lack of sufficient 
  preparation on the existing SQL query.  This makes it possible for 
  authenticated attackers, with Administrator-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. This may be exploitable by 
  lower-level users if access is granted by a site administrator.
