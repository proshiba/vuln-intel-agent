title: "An authorization bypass vulnerability in Apache DolphinScheduler allows authenticated
  users to perform unauthorized operations on workflow schedules, workflow definitions,
  and task instances in other projects.\n\n\n\nThe affected endpoints check permissions
  against the supplied projectCode but fail to verify that the target resource belongs
  to that project. An authenticated user with the required permissions in one project
  can supply that project's code together with a resource identifier from another
  project, bypassing the target project's access restrictions.\n\n\n\nThe affected
  endpoints include:\n\n  *  \n\nPOST /projects/{projectCode}/schedules/{id}/online
  and /offline: Activate or deactivate workflow schedules in another project.\n\n\n\
  \  *  \n\nPOST /projects/{projectCode}/workflow-definition/{code}/release: Change
  the ONLINE/OFFLINE state of workflow definitions in another project.\n\n\n\n\n\n\
  \nSuccessful exploitation allows users to alter workflow availability and interfere
