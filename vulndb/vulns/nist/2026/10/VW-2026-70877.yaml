title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: Clamp implicit feedback packet count to URB capacity\n\ndata_ep_set_params()
  allocates each data URB for exactly u->packets\nisochronous frames, so urb->iso_frame_desc[]
  has u->packets slots and\nctx->packets is the driver's only record of that limit.
  For an implicit\nfeedback sink, snd_usb_queue_pending_output_urbs() overwrites it
  with the\nsync source's packet count, which is calculated independently from the\n\
  capture endpoint's parameters. When that count is larger,\nprepare_playback_urb()
  and prepare_silent_urb() can write\niso_frame_desc[] past the allocation; their
  existing bounds limit payload\nbytes, not the descriptor index.\n\nThe reproducer
  uses a high-speed UAC2 device declaring bInterval 1 for\nimplicit feedback capture
  (8 packets) and bInterval 4 for playback\n(1 packet). On the first capture completion
  after the stream starts, it\naccesses seven descriptors spanning 112 bytes beyond
  the one-packet URB"
