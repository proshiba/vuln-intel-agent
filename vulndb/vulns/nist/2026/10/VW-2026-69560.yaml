title: "Cleartext transmission of sensitive information vulnerability in Apache Directory
  LDAP API.\n\n\n\nA StartTLS extended operation started after a Search request has
  been sent can lead to receive data in plain text before the TLS Handshake has been
  completed.\n\n\n\nThis issue affects Apache Directory LDAP API: from 2.1.0 before
  2.1.9.\n\n\n\nUsers are recommended to upgrade to version 2.1.9, which fixes the
  issue."
