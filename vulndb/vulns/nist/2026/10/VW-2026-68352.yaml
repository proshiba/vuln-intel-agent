title: A security flaw has been discovered in gedelumbung HospitalManagement up 
  to c2d45543789a3887067d3915f69d44cfc2cf76a8. This affects the function hapus 
  of the file application/modules/admin/controllers/data_galeri.php of the 
  component Endpoint. Performing a manipulation of the argument gbr results in 
  path traversal. The attack can be initiated remotely. The exploit has been 
  released to the public and may be used for attacks. Continious delivery with 
  rolling releases is used by this product. Therefore, no version details of 
  affected nor updated releases are available. The project was informed of the 
  problem early through an issue report but has not responded yet.
