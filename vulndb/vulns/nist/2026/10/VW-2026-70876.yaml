title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  virtio: reset device before deleting virtqueues\n\nvirtsnd_remove() and virtsnd_freeze()
  delete the virtqueues before\nresetting the device. del_vqs() frees the vring backing,
  but does not\nprovide a generic device quiesce operation. In particular, modern\n\
  virtio-pci keeps enabled queues active until the device is reset.\n\nReset the device
  before deleting the virtqueues so it can no longer\naccess the vring memory when
  that memory is released. This also covers\nprobe failures after DRIVER_OK, which
  unwind through virtsnd_remove()."
