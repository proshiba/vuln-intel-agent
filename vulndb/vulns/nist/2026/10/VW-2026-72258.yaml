title: An OS command injection vulnerability exists in the time and zone 
  management subsystem of Brocade Fabric OS versions before 9.2.2d and 10.0.0 
  through 10.0.0a1. When updating system timezone settings via the REST API or 
  configuration download routines, the system fails to sanitize input values 
  before processing them in underlying shell execution routines. An 
  authenticated user with low-privilege administrative access can exploit this 
  vulnerability by submitting a crafted timezone string containing shell 
  metacharacters. Successful exploitation allows the attacker to escape the 
  restricted management environment and execute arbitrary shell commands with 
  elevated privileges.
