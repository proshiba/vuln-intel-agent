title: "In the Linux kernel, the following vulnerability has been resolved:\n\nposix-cpu-timers:
  Prevent freeing a timer which is queued on the expiry list\n\nKijo analyzed another
  race in the POSIX CPU timer code:\n\nCommit bf635681c906 converted cpu_timer::firing
  from a tristate value to a\nboolean. This lost the distinction between \"not owned
  by the firing list\"\nand \"still owned, but delivery was canceled\". The resulting
  race is:\n\n    expiry handler              timer_settime()        timer_delete()\n\
  \    --------------              ---------------        --------------\n    collect
  timer onto\n    private firing list\n    firing = true\n                       \
  \         observes firing = true\n                                firing = false\n\
  \                                return TIMER_RETRY\n                          \
  \      wait for handler\n                                                      \
  \ observes firing = false\n                                                    \
  \   finish deletion\n                    "
