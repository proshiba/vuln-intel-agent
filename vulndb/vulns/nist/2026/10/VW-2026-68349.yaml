title: AiSOC versions 7.2.0 before 12.0.0 contain a command injection 
  vulnerability in the actions service that builds CrowdStrike Real Time 
  Response command strings by interpolating unescaped action parameters in 
  crowdstrike_rtr.py and endpoint.py. Authenticated users can inject single 
  quotes into file_path, path, script_name, or script_args parameters to break 
  out of quoted arguments and execute arbitrary commands on managed endpoints 
  with SYSTEM or root privileges.
