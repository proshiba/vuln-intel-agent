title: "The OTRS Agent Frontend configuration endpoint can be accessed without authentication. This
  allows unauthenticated remote users to retrieve internal application configuration
  that is intended for use by the authenticated Agent Frontend. The exposed information
  may include configured frontend routes and their associated authorization groups,
  authentication configuration, enabled product features, third-party integration
  settings, and other implementation details.\n\nThe exposed configuration does not
  directly contain user credentials or provide unauthorized modification of the OTRS
  configuration. However, the disclosed information may assist an attacker in fingerprinting
  the affected OTRS installation and identifying enabled functionality or security-relevant
  configuration that could be used to prepare further attacks.\n\nThis issue affects
  OTRS:\n\n  *  8.0.X\n  *  2023.X\n  *  2024.X\n  *  2025.X\n  *  2026.X before 2026.7.X"
