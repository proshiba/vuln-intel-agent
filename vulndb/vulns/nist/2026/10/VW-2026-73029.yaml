title: The WP Booking System – Booking Calendar plugin for WordPress is 
  vulnerable to time-based SQL Injection via the 'current_month' parameter in 
  all versions up to, and including, 2.1.0.1 due to insufficient escaping on the
  user supplied parameter and lack of sufficient preparation on the existing SQL
  query. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. This is a regression vulnerability — a capability check 
  introduced in versions 2.0.19.11–2.0.19.14 to address CVE-2024-50425 was 
  removed in version 2.1, meaning any authenticated subscriber-level account can
  reach the vulnerable handler with no nonce validation required.
