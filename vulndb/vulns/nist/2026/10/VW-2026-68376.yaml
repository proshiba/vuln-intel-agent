title: A flaw has been found in zosmaai pi-llm-wiki up to 0.11.7. Affected is an
  unknown function of the file mcp/index.ts of the component wiki_capture_source
  MCP tool. Executing a manipulation of the argument url can lead to os command 
  injection. The attack can be executed remotely. The exploit has been published
  and may be used. Upgrading to version 0.11.8 is able to address this issue. 
  This patch is called 360867034e79175b45c8e04a98e4ca712bbaca35. Upgrading the 
  affected component is advised.
