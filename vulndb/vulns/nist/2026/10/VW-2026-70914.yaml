title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fddi: skfp: fix NULL deref when setting the MAC address while down\n\nskfp_ctl_set_mac_address()
  calls ResetAdapter() unconditionally, without\nchecking netif_running(). ResetAdapter()
  first calls card_stop(), which\nsets smc->hw.hw_state to STOPPED, and then mac_drv_clear_tx_queue(),\n\
  which walks the two transmit queues:\n\n\tfor (i = QUEUE_S; i <= QUEUE_A0; i++)
  {\n\t\tqueue = smc->hw.fp.tx[i] ;\n\t\t...\n\t\tt = queue->tx_curr_get ;\n\nsmc->hw.fp.tx[]
  is only populated by init_tx(), which is reached from\nskfp_open() through init_smt()
  -> init_fddi_driver() -> init_fplus() ->\ninit_mac() -> init_tx(). The private area
  is allocated and zeroed by\nalloc_fddidev(), so on an interface that has never been
  brought up both\nqueue pointers are still NULL. The hw_state test at the top of\n\
  mac_drv_clear_tx_queue() does not catch this, because card_stop() has\njust set
  STOPPED; the function proceeds into the loop and dereferences\nNULL. ResetAdap"
