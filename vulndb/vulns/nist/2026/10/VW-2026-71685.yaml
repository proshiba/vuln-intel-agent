title: Unsigned integer underflow in wstrncat() in src/port.c in wolfSSL wolfSSH
  from v1.4.11 through v1.5.0 on non-Windows platforms allows an authenticated 
  remote attacker to write one out-of-bounds null byte past the end of a stack 
  buffer by sending a crafted SFTP path. wolfSSH_RealPath() in src/ssh.c appends
  each path component with a remaining-size bound (outSz - curSz) rather than 
  the full destination size, so once the accumulated path reaches half the 
  output buffer the size_t computation n - strlen(s1) - 1 wraps to near 
  SIZE_MAX. The strncat() call is then effectively unbounded and copies the 
  whole component; when that component exactly fills the remainder of the 
  buffer, its terminating null is written one byte past the end. The caller's 
  own length check keeps the copied data inside the buffer, so the overflow is 
  limited to that single null byte, which may corrupt an adjacent stack value 
