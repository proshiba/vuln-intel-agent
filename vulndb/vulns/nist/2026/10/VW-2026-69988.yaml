title: In Bouncy Castle for Java before 1.86, BLS12_381BasicScheme.keyValidate, 
  and so BLSPublicKeyParameters and every BasicScheme, MessageAugmentation and 
  ProofOfPossession verify and aggregateVerify that gate on it, accepted a 
  public key built on a foreign ECCurve that merely shares BLS12-381's field 
  characteristic. The prime-order subgroup check trusts a point's own curve to 
  name its cofactor, since ECPoint.satisfiesOrder returns true outright when the
  curve's cofactor is one, so a point on a curve with a different equation and a
  cofactor forged to one passed keyValidate despite not being a G1 point at all.
  In BC's pairing implementation such a point contributes the identity in the 
  target group, so an aggregate signature verified against a set of public keys 
  including it is accepted even though it contains no signature for that key and
  message pair, admitting a phantom signer. keyValidate now first confirms that 
