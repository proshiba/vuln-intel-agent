title: 'OpenTelemetry JavaScript Contrib provides instrumentation libraries for collecting
  telemetry from JavaScript applications. Prior to versions 0.66.0 of @opentelemetry/instrumentation-cassandra-driver,
  0.65.0 of @opentelemetry/instrumentation-knex, 0.67.0 of @opentelemetry/instrumentation-mongoose,
  @opentelemetry/instrumentation-mysql, and @opentelemetry/instrumentation-mysql2,
  0.46.0 of @opentelemetry/instrumentation-oracledb, 0.73.0 of @opentelemetry/instrumentation-pg,
  and 0.40.0 of @opentelemetry/instrumentation-tedious, the packages add the database
  connection username to every instrumented database operation as the db.user span
  attribute. The attribute is emitted by default and is not controlled by enhancedDatabaseReporting
  or another opt-in setting. Configured observability backends therefore receive database
  account names that may expose service topology, role or environment information,
  and account naming patterns. This issue is fixed in versions 0.66.0, 0.65.0, 0.67.0,
  0.46.0, '
