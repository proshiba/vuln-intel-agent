title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.38.0 through 0.70.5, BaseGenerator.parse_fixed 
  interpolates a fixed type's aliases value directly into a generated 
  types.confixed annotation. A list is represented with quoted entries, but a 
  bare string is emitted as an unquoted Python expression and evaluated when the
  generated module is imported, allowing arbitrary code execution from a crafted
  schema. Version 0.70.6 fixes the vulnerability by rejecting aliases values 
  that are not lists.
