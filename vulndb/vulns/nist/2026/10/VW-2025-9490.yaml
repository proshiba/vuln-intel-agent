title: A vulnerability in TeamViewer DEX Client (former 1E client) - Content 
  Distribution Service (NomadBranch.exe) prior version 25.11 for Windows allows 
  malicious actors to bypass file integrity validation via a crafted request. By
  providing a valid hash for a malicious file, an attacker can cause the service
  to incorrectly validate and process the file as trusted, enabling arbitrary 
  code execution under the Nomad Branch service context.
