title: "Several administrative actions do not sufficiently validate whether a request
  was intentionally initiated by the authenticated user. In particular, the DBUpdateLogCleanUp
  action can be triggered through a GET request without validating a ChallengeToken.
  An unauthenticated remote attacker can therefore cause the browser of an authenticated
  administrator to execute the cleanup action by embedding a crafted request in a
  malicious web page. Successful exploitation can delete existing DBUpdate log entries.
  This may reduce the availability of diagnostic and historical information used for
  troubleshooting and auditing. The impact is limited to DBUpdate log entries that
  exist at the time the forged request is processed.\n\nAdditional administrative
