title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  preserve user SID across nested backing files\n\nSELinux saves the user file SID
  in a backing-file security blob so it\nremains available after mmap() replaces vma->vm_file
  with a backing file.\n\nFor nested backing files (overlayfs over overlayfs, or FUSE
  passthrough\nbacked by overlayfs), user_file may itself be a backing file.  Its\n\
  fsec->sid is the SID of the mounter that opened it, rather than the user\nthat opened
  the top-level file.  mprotect() then checks fd { use } against\nthe mounter SID.\
  \  This can incorrectly deny access without a domain\ntransition, or check the wrong
  target SID after one.\n\nCopy the saved user SID when user_file is a backing file.\
  \  Keep using the\nregular file SID for the first backing layer.\n\nWith two nested
  overlayfs mounts and SELinux enforcing,\nmprotect(PROT_READ) returns EACCES with
  an fd { use } denial against the\nmounter SID.  With this change, mprotect() succeeds.\n\
  \nTested on arm64 Q"
