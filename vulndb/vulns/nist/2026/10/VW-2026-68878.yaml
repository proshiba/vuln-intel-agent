title: Reachy Mini ISO for Wireless contains the necessary files to build a 
  custom Raspberry Pi OS image for the Reachy Mini Wireless robot, using pi-gen.
  Prior to version 0.2.4, the Reachy Mini Wireless OS image shipped with an 
  overly broad sudoers entry granting the pollen daemon user (uid 1000) 
  passwordless sudo access to /usr/bin/systemctl with no subcommand or argument 
  restriction. This is a local privilege escalation (LPE). Any process running 
  as pollen can obtain full root (uid 0) on the device in three commands, with 
  no additional vulnerability required and no user interaction. This issue has 
  been patched in version 0.2.4.
