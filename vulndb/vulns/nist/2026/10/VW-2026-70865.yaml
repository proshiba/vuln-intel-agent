title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/ucma:
  Serialize join and leave on copy_to_user failure\n\nrdma_join_multicast() queues
  RoCE work that later reads the ucma_multicast\nthrough event->param.ud.private_data,
  then list_add()s the CMA multicast\nat the head of id_priv->mc_list. rdma_leave_multicast()
  matches only by\nsockaddr and destroys the first hit.\n\nucma_process_join() used
  to drop ctx->mutex after a successful join and\nretake it only if copy_to_user()
  failed. Two concurrent JOIN_MCAST calls\nwith the same address can therefore insert
  a second CMA entry before the\nfirst thread's leave. leave then cancels the newer
  work and the older\nworker still dereferences the ucma_multicast that the first
  thread frees.\n\nKeep ctx->mutex held from rdma_join_multicast() through copy_to_user()
  and,\non -EFAULT, through rdma_leave_multicast() so leave cannot miss this join.\n\
  Do not leave if join itself failed: that path never published this address\non mc_list,
  and a leave"
