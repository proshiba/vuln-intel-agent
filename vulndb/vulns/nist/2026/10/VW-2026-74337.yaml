title: FileRise is a self-hosted web-based file manager with multi-file upload, 
  editing, and batch operations. Prior to 3.14.0, FileRise authenticates 
  requests to the file creation and share-link creation handlers but does not 
  enforce the server-side CSRF token check used by adjacent state-changing 
  operations. The POST endpoints /api/file/createFile.php and 
  /api/file/createShareLink.php invoke FileController::createFile and 
  FileController::createShareLink without rejecting a missing or invalid 
  X-CSRF-Token header. A request issued with a logged-in user's session can 
  create an empty file or create a share link with that user's permissions, 
  although the default SameSite=Lax session cookie reduces ordinary cross-site 
  POST reachability. This issue is fixed in version 3.14.0.
