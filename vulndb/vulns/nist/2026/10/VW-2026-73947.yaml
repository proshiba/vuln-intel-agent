title: A vulnerability was identified in Linksys E1700 up to 1.0.0.4.003. This 
  issue affects the function setVlan of the file /goform/setVlan. Such 
  manipulation of the argument vlan_set leads to stack-based buffer overflow. 
  The attack may be launched remotely. The exploit is publicly available and 
  might be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
