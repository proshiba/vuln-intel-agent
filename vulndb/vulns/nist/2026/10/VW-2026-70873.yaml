title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  Fix server use-after-free in cifs_chan_skip_or_disable()\n\nWhen a secondary channel
  is no longer supported by the server,\ncifs_chan_skip_or_disable() drops the channel
  reference with\ncifs_put_tcp_session() and then continues to use the server pointer
  by\ncalling cifs_signal_cifsd_for_reconnect() on it and reading its\nprimary_server
  pointer. cifs_put_tcp_session() can drop the last\nreference of the channel and
  tear it down, so both the channel and the\nprimary server (whose reference is also
  dropped by\ncifs_put_tcp_session()) can be freed before they are signaled for\n\
  reconnect.\n\nSignal the channel and the primary server and capture the primary\n\
  server pointer before dropping the channel reference with\ncifs_put_tcp_session()."
