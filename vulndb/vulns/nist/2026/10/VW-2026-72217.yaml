title: The AsyncHttpClient (AHC) library allows Java applications to easily 
  execute HTTP requests and asynchronously process HTTP responses. Prior to 
  3.0.12 on 3.x and 2.16.1 on 2.x, the client infers that an HTTP proxy tunnel 
  exists from the last request method rather than the CONNECT result. After a 
  proxy rejects CONNECT, redirect or authentication handlers can write an origin
  request and its Authorization credentials onto the still-plaintext proxy 
  connection. Basic credentials can be recovered directly, while NTLM responses 
  may be cracked or relayed. This issue is fixed in versions 3.0.12 and 2.16.1.
