title: Backstage is an open framework for building developer portals. Prior to 
  1.14.6, the @backstage/plugin-techdocs-node package is affected by 
  configuration bypass in techdocs mkdocs.yml sanitization. Insufficient 
  validation of MkDocs configuration during TechDocs generation could allow an 
  authenticated user who can register or modify documentation sources to execute
  arbitrary commands in the build environment. Impact is limited to resources 
  accessible to the TechDocs backend or build container. This issue is fixed in 
  versions 1.14.6 and 1.15.4.
