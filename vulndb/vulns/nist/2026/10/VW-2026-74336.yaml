title: odhcpd is the DHCPv6, DHCPv4, and router-advertisement server used by 
  OpenWrt. In commit cfddd56 and earlier, an unauthenticated host on the same 
  link can first obtain two bindings through normal DHCPv6 SOLICIT and REQUEST 
  exchanges and then send a crafted RENEW containing multiple IA_NA options. An 
  earlier matched IA consumes most of the response buffer, an unmatched IA 
  causes the build_ia() status branch to write and return a NOBINDING response 
  larger than the remaining space, and a subsequent matched IA is processed 
  after dhcpv6_ia_handle_IAs() subtracts that over-return from an unsigned 
  size_t. The resulting underflow disables subsequent length checks and permits 
  attacker-controlled IA_ADDR serialization beyond the 512-byte stack buffer 
  pdbuf in handle_client_request(). The stack canary terminates odhcpd, and 
  sustained packets can repeatedly disrupt DHCPv6 service while procd respawns 
  the process. The observed configuration does not establish code execution.
