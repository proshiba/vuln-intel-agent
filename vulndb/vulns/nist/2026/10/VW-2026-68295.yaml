title: Unverified ownership in Barman snapshot backup deletion allows a 
  principal who can write the backup catalog to cause Barman to delete unrelated
  cloud snapshots. When a snapshot backup is deleted, either explicitly or by 
  retention policy enforcement, Barman reads the snapshot identifiers from the 
  backup.info file and passes them to the cloud provider's delete API using 
  Barman's own credentials, without verifying that the snapshots belong to that 
  backup. An attacker who can overwrite backup.info but lacks snapshot delete 
  permissions can substitute the identifiers of other snapshots, causing Barman 
  to delete any snapshot its cloud identity can reach on AWS, Microsoft Azure, 
  or Google Cloud. Exploitation requires a deployment where the principal that 
  writes the backup catalog is separate from the identity Barman uses to delete 
  snapshots. Barman versions from 3.4.0 (Google Cloud), 3.6.0 (Azure), and 3.7.0
  (AWS) up to and including 3.20.0 are affected. The issue is fixed in Barman 
  3.20.1.
