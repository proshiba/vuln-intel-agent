title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  the queryUserRolesById handler of SystemApiController that lets authenticated 
  users read any user's role codes. Low-privileged attackers can send a userId 
  to GET /sys/api/queryUserRolesById to enumerate role assignments and identify 
  administrator accounts.
