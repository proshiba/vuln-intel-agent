title: "An HTTP header injection vulnerability in start-page-loader.cgi of ADM allows
  an unauthenticated remote attacker to read arbitrary files on the host system. By
  sending a crafted HTTP request with injected headers via the state parameter, the
  attacker can leverage the underlying web server's X-Sendfile mechanism to retrieve
  sensitive files without authentication.\nAffected products and versions include:
  from ADM 4.1.0 through ADM 4.3.3.RWC1 as well as from ADM 5.0.0 through ADM 5.1.4.RL21."
