title: Nezha from 1.8.0 before 2.3.13 contains a lock-order inversion in 
  UpdateGroup and DeleteGroup that allows authenticated non-admin users to 
  deadlock the alerting subsystem. Attackers can concurrently call the 
  notification-group and batch-delete endpoints with oversized id lists to widen
  the race and close an ABBA cycle, permanently killing alert delivery until 
  restart.
