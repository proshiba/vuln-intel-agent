title: pypdf is a free and open-source pure-python PDF library. Prior to 6.17.0,
  a crafted PDF can provide unusually large Roman page-label values that cause 
  pypdf/_page_labels.py to generate excessively large numeral strings when an 
  application retrieves document page labels, consuming large amounts of memory 
  and potentially making the application unavailable. This issue is fixed in 
  version 6.17.0.
