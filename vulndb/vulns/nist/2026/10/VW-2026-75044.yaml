title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.38.0 through 0.70.5, 
  FieldRepresentation.get_field_default inserts schema-controlled string, UUID, 
  bytes, and fixed field defaults into quoted literals in generated Python 
  source without escaping them. A crafted default can terminate the literal and 
  inject statements into the generated module, which execute when the module is 
  imported. Version 0.70.6 fixes the vulnerability by escaping schema values 
  rendered into generated string literals.
