title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix potential OOB read in smb3_enum_snapshots()\n\nIf snapshot_array_size
  is smaller than GMT_TOKEN_SIZE,\nsmb3_enum_snapshots() sets ret_data_len to\nsizeof(struct
  smb_snapshot_array) without verifying the actual length\nof the server's reply.\n\
  \nBecause SMB2_ioctl() places no lower bound on the server-supplied\nOutputCount
  and allocates retbuf to exactly that length, a short reply\nresults in ret_data_len
  exceeding the size of retbuf. The subsequent\ncopy_to_user() then reads past the
  end of retbuf, leaking adjacent slab\nmemory to userspace.  The subsequent clamp
  check is ineffective as it\nonly reduces ret_data_len.\n\nFix this by rejecting
  replies shorter than\nsizeof(struct smb_snapshot_array) with -EIO. Note that the
  bound is set\nto the 12-byte struct size rather than the 16-byte\nMIN_SNAPSHOT_ARRAY_SIZE
  defined in MS-SMB2 3.3.5.15.1, because 12 bytes\nis exactly what copy_to_user()
  attempts to read."
