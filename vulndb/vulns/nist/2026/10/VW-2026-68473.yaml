title: "MISP contains a mass assignment vulnerability in the event delegation feature.
  When a user with delegation permission submits a delegation request, the application
  authorized the user against the event identified in the URL but then persisted the
  entire submitted record, including caller-supplied fields such as the primary key
  and event_id.\n\nAn authenticated attacker could inject a primary key or event_id
  into the delegation payload to retarget an existing delegation record to any event
  on the instance. Because a delegation row grants the requesting organisation read
  access to the event it references, this effectively granted read access to arbitrary
  events belonging to other organisations. If the target organisation subsequently
  accepted the delegation, ownership of the event was transferred and the original
  record was deleted.\n\nPreconditions:\n\n- An authenticated user with the delegation
  permission (perm_delegate)\n\n- The MISP.delegation server setting must be enabled\n\
  \nImpact:\n\n- Confi"
