title: "On MISP instances configured to require TOTP enrolment (Security.otp_required),
  the enforcement of the mandatory two-factor authentication setup applied only to
  standard browser requests. An authenticated user who had not yet enrolled in TOTP
  could bypass the forced setup by issuing any non-browser request type, including
  AJAX/XHR calls, REST API requests, .json format URLs, restSearch queries, or automation
  actions. Because these machine-readable request shapes cannot follow the redirect
  that the browser path uses to send the user to the TOTP enrolment page, the guard
  simply skipped the check and the user retained full access to the instance without
  completing the required second-factor setup.\n\nThe initial fix (commit 8deb0619e)
  added a guard specifically for AJAX requests. A follow-up fix (commit 6b527ba6e)
  broadened the guard to cover every non-browser request shape, while preserving the
  exemption for identities authenticated via API key (logged_by_authkey flag).\n\n\
  Impact: an authent"
