title: The Paid Membership Plugin, Ecommerce, User Registration Form, Login 
  Form, User Profile & Restrict Content – ProfilePress plugin for WordPress is 
  vulnerable to Sensitive Information Exposure in all versions up to, and 
  including, 4.17.4 via the get_user_profile_structure. This makes it possible 
  for authenticated attackers, with subscriber-level access and above, to 
  extract other users' email addresses, login names, and registration dates via 
  the Member Directory's per-row user rebinding when attacker-controlled base64 
  payloads in the [pp-custom-html] shortcode invoke [profile-email], 
  [profile-username], and [profile-date-registered]. When the WordPress 
  users_can_register option is enabled, unauthenticated attackers can also 
  exploit this vulnerability by supplying the split shortcode fragments through 
  the plugin's own registration handler, which processes the reg_nickname and 
  reg_bio fields without a nonce requirement.
