title: Denver SHO-110 IP cameras expose a secondary HTTP service on TCP port 
  8001 that provides access to a '/snapshot' endpoint without authentication. 
  While the primary web interface on port 80 enforces authentication, the 
  backdoor service allows any remote attacker to retrieve image snapshots by 
  directly requesting the 'snapshot' endpoint. An attacker can repeatedly 
  collect snapshots and reconstruct the camera stream, compromising the 
  confidentiality of the monitored environment.
