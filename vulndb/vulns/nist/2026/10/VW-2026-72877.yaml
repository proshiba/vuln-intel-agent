title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, the qc_info 
  plugin could be confused by a query containing embedded null bytes. Reading 
  information_schema.query_cache_info after such a query was cached could access
  data beyond the end of a heap-allocated buffer, potentially disclosing 
  adjacent memory or crashing the server. This issue is fixed in versions 
  10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2.
