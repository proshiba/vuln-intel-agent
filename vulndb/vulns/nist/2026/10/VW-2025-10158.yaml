title: Vulnerability in the cryptographic algorithm of AndSoft's e-TMS v25.03, 
  which uses MD5 to encrypt passwords. MD5 is a cryptographically vulnerable 
  hash algorithm and is no longer considered secure for storing or transmitting 
  passwords. It is vulnerable to collision attacks and can be easily cracked 
  with modern hardware, exposing user credentials to potential risks.
