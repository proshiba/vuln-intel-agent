title: IBM DataStage on Cloud Pak for Data 5.4.0.0 can allow a man-in-the-middle
  attacker to present a forged TLS certificate, intercept the connection, and 
  capture the IAM bearer Authorization header automatically attached by the 
  session adapter. The captured token grants full platform-scope tenant API 
  access, enabling the attacker to read and manipulate the victim's DataStage 
  projects, flows, assets, and pipeline definitions. This is client-side SDK 
  code running on the user's own machine, so exploitation requires an external 
  network interceptor rather than a co-tenant in the shared cluster.
