title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  pxa: fix double counting of the hw descriptors\n\npxad_alloc_desc() was converted
  from\n\n        kzalloc(struct_size(sw_desc, hw_desc, nb_hw_desc), GFP_NOWAIT)\n\
  \nto kzalloc_flex(), which sets the __counted_by() counter sw_desc->nb_desc\nitself
  - but only where the compiler has __builtin_counted_by_ref(), so\nfrom gcc 15.1
  or clang 22.1 on. The loop below it still increments\nnb_desc, which makes it come
  out doubled there and correct elsewhere.\n\nnb_desc is what pxad_free_desc() iterates
  over and what\nset_updater_desc() indexes from, so set it explicitly and drop the\n\
  increment. The error path has to lower it to the number of descriptors\nallocated
  so far, otherwise pxad_free_desc() would free entries that were\nnever allocated."
