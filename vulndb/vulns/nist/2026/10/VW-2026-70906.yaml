title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_qca: Do not write to the serial port after it is closed\n\nhci_uart_close()
  closes the serdev port if HCI_QUIRK_NON_PERSISTENT_SETUP\nis set (for example, for
  the WCN399x family). A failed hci_dev_open_sync()\nfollowing a successful qca_setup()
  calls hdev->close() but not\nhdev->shutdown(), so the port is closed while power->vregs_on
  is left true.\nqca_serdev_remove() then passes its power->vregs_on test and calls\n\
  qca_power_off(), which writes to the closed port unconditionally.\n\nSeen on a WCN3988
  by unbinding the driver after a controller failure. The\ntrace below is from a 7.0.0
  based kernel, where qca_power_off() was still\nnamed qca_power_shutdown():\n\n \
  \ Unable to handle kernel NULL pointer dereference at virtual address\n  0000000000000038\n\
  \  Call trace:\n   tty_set_termios+0x50/0x238 (P)\n   ttyport_set_baudrate+0x84/0xc0\n\
  \   serdev_device_set_baudrate+0x24/0x40\n   qca_power_shutdown+0x158/0x1fc [hci_uart]\n\
  \   q"
