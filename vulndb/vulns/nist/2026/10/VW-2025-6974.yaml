title: LLaMA-Factory is a tuning library for large language models. Prior to 
  version 0.9.4, a Server-Side Request Forgery (SSRF) vulnerability in the chat 
  API allows any authenticated user to force the server to make arbitrary HTTP 
  requests to internal and external networks. This can lead to the exposure of 
  sensitive internal services, reconnaissance of the internal network, or 
