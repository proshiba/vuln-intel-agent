title: Use of the backend-facing $scheme variable in the trailing-slash 
  directory redirect in nginx.conf of Chainguard Academy (edu) from commit 
  0b75ff98057f69b044a3e7194e428066ac5ad0d4 before commit 
  93dc0e50739c225f5aee2e803800a47fc0feb906 allows an on-path network attacker to
  read or modify documentation content served to a victim via an HTTPS request 
  for a slashless directory path, because TLS terminates at the load balancer in
  front of Nginx and the resulting 301 response redirects the client to a 
  plaintext http:// URL. Browsers that ship the HSTS preload list are not 
  affected, because the .dev top-level domain is preloaded; clients that do not 
  enforce HSTS, such as command-line HTTP clients and scripts that follow 
  redirects, are affected.
