title: Coolify is an open-source and self-hostable tool for managing servers, 
  applications, and databases. In Coolify versions prior to and including 
  v4.0.0-beta.434, low privileged users are able to see the private key of the 
  root user on the Coolify instance. This allows them to ssh to the server and 
  authenticate as root user, using the private key. As of time of publication, 
  it is unclear if a patch is available.
