title: A vulnerability was detected in e107 CMS up to 2.3.3. This impacts an 
  unknown function of the file /e107_admin/image.php?mode=main&action=avatar of 
  the component Avatar Handler. Performing manipulation of the argument 
  multiaction[] results in path traversal. It is possible to initiate the attack
  remotely. The exploit is now public and may be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
