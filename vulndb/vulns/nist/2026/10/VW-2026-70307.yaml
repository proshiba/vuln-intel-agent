title: Plane is an open-source project management tool. Prior to 1.4.0, GET 
  /api/workspaces/{slug}/cycles/ through WorkspaceCyclesEndpoint and GET 
  /api/workspaces/{slug}/modules/ through WorkspaceModulesEndpoint return 
  records from every project in a workspace without checking whether the 
  requester belongs to each project. Any authenticated workspace member, 
  including a Guest with access to only one project, can enumerate names, 
  descriptions, sprint dates, issue counts, progress snapshots, external 
  integration IDs, linked URLs, and member lists for cycles and modules in 
  private projects. The sibling WorkspaceLabelsEndpoint and 
  WorkspaceStatesEndpoint apply the correct 
  project__project_projectmember__member=request.user filter, making the cycle 
  and module endpoints inconsistent outliers. This issue is fixed in 1.4.0.
