title: Hydra is a framework for elegantly configuring complex applications. From
  1.3.4 until 1.3.6 and 1.4.0.dev9, the instantiate() target blacklist 
  introduced for CVE-2026-68508 incompletely checks the effective callable 
  selected by the target field. Execution wrappers such as timeit.timeit, 
  executable deserialization through pickle.loads, aliases, callable-returning 
  helpers, generic dispatch, and deferred calls can obscure or defer the 
  effective target and bypass name-based authorization. An attacker who causes 
  an application to instantiate untrusted Hydra configuration can use these gaps
  to execute code with the application's privileges. This issue is fixed in 
  versions 1.3.6 and 1.4.0.dev9.
