title: "OTRS does not sufficiently enforce the uniqueness of customer user identities
  across multiple configured CustomerUser backends. When multiple backends, such as
  a database and LDAP, are configured, the uniqueness check for customer user email
  addresses is performed only within the selected backend. As a result, an authenticated
  user with permission to create or modify customer users may create a customer user
  whose email address is already assigned to a customer user in another backend.\n\
  \nThis can result in multiple customer user records representing the same communication
  identity. Depending on the affected workflow and backend resolution, customer-related
  information or email communication may subsequently be associated with or exposed
  to the wrong customer user.\n\nThe vulnerability does not allow unauthenticated
  users to create customer accounts. Exploitation requires permissions to create or
  modify customer users.\n\nThis issue affects OTRS:\n\n  *  7.0.X\n  *  8.0.X\n \
  \ *  2023.X\n  *  2024."
