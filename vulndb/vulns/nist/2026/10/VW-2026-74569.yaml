title: A security vulnerability has been detected in itsmeravitejak 
  Online-Examination-System up to e6208e630b14657999bbfe4c9912302d2a1e2449. The 
  impacted element is the function Session::checkLogin of the file 
  include/session.php of the component Session Handler. Such manipulation of the
  argument cookname/cookid leads to incorrect comparison. The attack can be 
  executed remotely. The exploit has been disclosed publicly and may be used. 
  This product implements a rolling release for ongoing delivery, which means 
  version information for affected or updated releases is unavailable. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
