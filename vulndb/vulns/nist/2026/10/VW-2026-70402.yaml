title: Ghost is a Node.js content management system. From 4.0.0 until 6.67.0, 
  SVG images included in content imports were stored without sanitization. An 
  attacker who convinced an Administrator to import a crafted file could host 
  scripts on the site's domain, possibly resulting in compromise of staff users'
  admin sessions. This issue is fixed in version 6.67.0.
