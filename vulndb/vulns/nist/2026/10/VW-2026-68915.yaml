title: Kiteworks Email Protection Gateway before version 9.5.0 is vulnerable to 
  Server-Side Request Forgery. Kiteworks Email Protection Gateway performed 
  server-side fetches of URLs contained in the message content it processed, 
  without adequately restricting the fetch destination. A remote, 
  unauthenticated sender could craft a message that caused the gateway to issue 
  requests to internal services and cloud instance metadata endpoints and return
  the responses, potentially disclosing sensitive internal data and, depending 
  on the internal service reached, affecting its state.
