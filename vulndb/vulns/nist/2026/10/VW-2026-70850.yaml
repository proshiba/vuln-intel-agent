title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  wwan: t7xx: validate the netif index in t7xx_ccmni_recv_skb()\n\nThe netif index
  carried in the DPMAIF PIT header is five bits wide,\nbut ccmni_inst[] only has room
  for NIC_DEV_MAX (21) entries.\nt7xx_ccmni_recv_skb() indexes the array without a
  bounds check, so\nindexes 21 to 31 read past it.  The out-of-bounds value lands
  in the\ncallback table that follows the array, which is never NULL, so the\nexisting
  !ccmni check does not catch it and the driver dereferences\nwhatever sits there
  as a struct t7xx_ccmni.\n\nDrop the skb when the index is out of range.\n\n\nVerified
  in a QEMU guest with a fault injector setting the netif\nindex to 25: the unpatched
  driver reads a value past ccmni_inst[],\nwhich lands in the callback table, and
  dereferences it far enough to\nqueue the skb.  With this check the packet is dropped.\
  \  Well-formed\ntraffic on index 0 is unaffected.\n\nChanges in v2: none."
