title: 'A vulnerability was found in Portabilis i-Diario 1.5.0. Impacted is an unknown
  function of the file /diario-de-observacoes/ of the component Observações. Performing
  a manipulation of the argument Descrição results in cross site scripting. It is
  possible to initiate the attack remotely. The exploit has been made public and could
  be used. The patch is named 821342cd8d952e8bd214cb16145da785a92f5681. It is suggested
  to install a patch to address this issue. The vendor confirms: "Audited values shown
  on that screen are now sanitized on output: only a minimal allowlist of basic formatting
  tags is kept and all attributes are stripped, so injected <script> or event-handler
  markup is removed and displayed as inert text."'
