title: A security vulnerability has been detected in jbardin scp.py up to 
  0.16.1. The impacted element is the function _recv_file/_recv_pushd of the 
  component SCP Receive Handler. The manipulation leads to path traversal. 
  Remote exploitation of the attack is possible. Upgrading to version 0.16.2 is 
  sufficient to resolve this issue. The identifier of the patch is 
  42fc3aaa71411daed60544e3b40179c1038bed5d. Upgrading the affected component is 
  advised. The vendor was contacted early, responded in a very professional 
  manner and quickly released a fixed version of the affected product.
