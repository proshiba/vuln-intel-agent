title: "Ollama is vulnerable to path traversal in the `/api/pull` endpoint due to
  insufficient validation of layer digests by the `digestToPath` function. An unauthenticated
  remote attacker can specify a path traversal sequence as a layer digest, causing
  a malicious binary to be written outside the model store. \n\nCritically if the
  server process has write access to `/usr/lib/ollama` (the default in most Ollama
  Docker images), an attacker can write the malicious file to that directory. On the
  next server restart, the file is loaded and executed, resulting in remote code execution
  as root.\n\n\nThis issue was fixed in version 0.35.0."
