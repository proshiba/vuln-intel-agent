title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  the SysRoleController saveDatarule handler that allows low-privileged 
  authenticated users to modify role data rules. Attackers can send 
  permissionId, roleId and dataRuleIds to overwrite data_rule_ids, clearing 
  row-level filters to widen readable records or altering filtering for other 
  roles.
