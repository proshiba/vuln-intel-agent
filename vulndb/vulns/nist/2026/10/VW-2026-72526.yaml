title: TVU Networks Receiver/Transceiver devices running firmware before version
  7.9 contain an authentication bypass vulnerability in the web management login
  endpoint POST /tvu/Login that allows remote unauthenticated attackers to 
  obtain an administrative session by submitting an empty or absent UserName 
  parameter. Attackers can send a crafted HTTP request directly, bypassing 
  client-side JavaScript validation, to receive a valid session cookie 
  regardless of the password value and gain full administrative control of the 
  device's web management interface.
