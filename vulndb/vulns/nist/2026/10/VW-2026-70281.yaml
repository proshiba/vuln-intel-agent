title: A caller who can invoke the convert_playwright_script prompt in mcp-k6 
  can pass a bare file path as the playwright_script argument and receive the 
  contents of any file readable by the user running the server, including SSH 
  keys and cloud credentials in that user's home directory (path traversal). The
  working-directory restriction applied to '@'-prefixed paths can also be 
  bypassed with a symbolic link inside the working directory that points outside
  it.
