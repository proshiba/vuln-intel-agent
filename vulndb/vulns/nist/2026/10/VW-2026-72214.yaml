title: Missing authorization checks in Amazon Athena engine version 3 request 
  handling could have allowed an authenticated user to read limited query 
  metadata (AWS account identifiers and SQL statement text) from other AWS 
  accounts. Query results, credentials, and Amazon S3 data were not affected. 
  AWS remediated the issue on September 1, 2026, and has confirmed no customer 
  metadata was accessed. No customer action is required.
