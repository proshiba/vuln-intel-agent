title: ESF-IDF is the Espressif Internet of Things (IOT) Development Framework. 
  In versions 5.5.1, 5.4.3, 5.3.4, 5.2.6, 5.1.6, and earlier, in the ESP-IDF 
  Bluetooth host stack (BlueDroid), the function bta_dm_sdp_result() used a 
  fixed-size array uuid_list[32][MAX_UUID_SIZE] to store discovered service 
  UUIDs during the SDP (Service Discovery Protocol) process. On modern Bluetooth
  devices, it is possible for the number of available services to exceed this 
  fixed limit (32). In such cases, if more than 32 services are discovered, 
  subsequent writes to uuid_list could exceed the bounds of the array, resulting
  in a potential out-of-bounds write condition.
