title: Plane is an open-source project management tool. Prior to 1.4.0, two 
  endpoint families fail to verify that nested resource identifiers belong to 
  the workspace and project named in the URL. An authenticated user can read or 
  modify estimates from another workspace through PATCH 
  /api/workspaces/{slug}/projects/{project_id}/estimates/{estimate_id}/, and can
  inject comments into an issue from another workspace through POST 
  /api/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/comments/. 
  ProjectEntityPermission verifies membership in the workspace and project from 
  the URL, but estimate_id and issue_id are fetched by primary key without 
  confirming the same scope. The list, retrieve, and destroy handlers correctly 
  scope their queries, demonstrating the inconsistency. This issue is fixed in 
  1.4.0.
