title: Backstage is an open framework for building developer portals. Prior to 
  2.2.4, the @backstage/plugin-techdocs-backend package is affected by improper 
  authorization enforcement for techdocs static content. An authenticated user 
  with access to one TechDocs documentation site could craft a URL able to read 
  documentation belonging to a different entity. This only affects deployments 
  using the external TechDocs builder with an external storage provider (S3, 
  GCS, etc.) and the permission framework enabled. Instances that do not use the
  permission framework are unaffected, since TechDocs content is visible to all 
  authenticated users by design. This issue is fixed in version 2.2.4.
