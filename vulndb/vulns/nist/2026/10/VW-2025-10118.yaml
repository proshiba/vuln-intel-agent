title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. The official Docker image  for 
  Termix versions 1.5.0 and below, due to being configured with an Nginx reverse
  proxy, causes the backend to retrieve the proxy's IP instead of the client's 
  IP when using the req.ip method. This results in isLocalhost always returning 
  True. Consequently, the /ssh/db/host/internal endpoint can be accessed 
  directly without login or authentication. This endpoint records the system's 
  stored SSH host information, including addresses, usernames, and passwords, 
  posing an extremely high security risk. Users who use the official Termix 
  docker image, build their own image using the official dockerfile, or utilize 
  reverse proxy functionality will be affected by this vulnerability. This issue
  is fixed in version 1.6.0.
