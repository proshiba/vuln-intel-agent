title: The GD Rating System plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via 'title' and 'url' Render Args in gdrts_live_handler 
  AJAX in all versions up to, and including, 3.7.1 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. Although the AJAX action requires a per-item
  nonce, that nonce is publicly emitted in the page's &lt;script 
  class="gdrts-rating-data"&gt; JSON block on every page rendering the rating 
  item, making it obtainable by any unauthenticated visitor and therefore not an
  authentication barrier.
