title: SAP Commerce Cloud does not sufficiently validate certain user-supplied 
  input before it is incorporated into a database query. An authenticated user 
  could send specially crafted requests to affected functionality to inject 
  arbitrary SQL commands. Successful exploitation could allow the user to read, 
  modify or delete sensitive data from the application's database, resulting in 
  a high impact on confidentiality, integrity and availability of the 
  application.
