title: Uncontrolled mutual recursion between DcmJSONReader::parseDataSet(), 
  DcmJSONReader::parseElement() and DcmJSONReader::parseSequence() in 
  dcmdata/libsrc/dcjsonrd.cc of OFFIS DCMTK 3.7.0 allows an attacker to cause a 
  denial of service (stack exhaustion and process crash) via a crafted DICOM 
  JSON document with deeply nested sequence (SQ) values. The json2dcm tool and 
  any service that converts untrusted DICOM JSON (for example, DICOMweb 
  payloads) with this reader are affected. The issue is fixed in commit 
  cf955e64c35a1e07ba10698f639d5dcdec53b9d7.
