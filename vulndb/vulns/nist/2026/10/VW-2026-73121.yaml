title: SkillHub before 0.2.22 contains an incorrect authorization vulnerability 
  in AccountMergeService and AccountMergeController that allows authenticated 
  attackers to take over other accounts by abusing the merge flow. Attackers can
  call the merge initiate endpoint with a target username or OAuth identity, 
  receive the verification token directly, and confirm the merge to inherit the 
  victim's API tokens, roles and namespace ownership.
