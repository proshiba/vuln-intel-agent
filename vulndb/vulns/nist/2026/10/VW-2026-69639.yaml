title: YesWiki before 4.6.7 contains a cross-site request forgery vulnerability 
  in the ajaxdeletepage handler, which permanently deletes a page on any GET 
  request carrying a jsonp_callback parameter without checking a CSRF token. 
  Attackers can lure a logged-in administrator or page owner to a crafted link 
  to delete arbitrary pages along with their ACLs, links, triples, comments and 
  referrers.
