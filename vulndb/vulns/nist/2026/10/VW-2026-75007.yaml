title: SmartAdmin through 3.30.0 contains a missing authorization vulnerability 
  in AdminProtectController that allows authenticated low-privileged employees 
  to modify system-wide level-3 protection settings. Attackers can call the 
  unannotated updateConfig and loginFail batchDelete endpoints to disable login 
  lockout and two-factor login, weaken password rules, and clear lockout 
  records.
