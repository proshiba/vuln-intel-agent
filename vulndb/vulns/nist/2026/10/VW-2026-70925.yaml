title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm/dp:
  skip PUSH_IDLE when the link was never enabled\n\nmsm_dp_display_atomic_enable()
  returns early when link training fails,\nleaving ->power_on false and the main link
  down.\nmsm_dp_display_atomic_disable() nevertheless writes DP_STATE_CTRL_PUSH_IDLE\n\
  and waits for an idle-pattern completion that cannot arrive, so every failed\nenable
  is followed by \"PUSH_IDLE pattern timedout\".\n\nEvery other step of the teardown
  is already gated on that flag:\nmsm_dp_display_disable(), called from .atomic_post_disable(),
  returns early\non !power_on. The PUSH_IDLE write is the only one that is not, so
  the\ncontroller's runtime-PM reference is then dropped without the link having\n\
  been taken down.\n\nOn glymur (Snapdragon X2 Elite) the consequence is not a warning.
  The SoC\ndoes not survive it: TrustZone force-stops the SOCCP and ADSP remote\n\
  processors and the machine resets silently about 50 ms later, with no oops\nand
  no panic. On an ASUS "
