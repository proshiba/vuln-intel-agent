title: A vulnerability has been found in Netcore NR268 1.7.121109. The impacted 
  element is the function ddns_wan_list_show of the file ddns_wan_list_show.cgi 
  of the component DDNS Handler. The manipulation of the argument 
  user_idN/passwordN leads to information disclosure. The attack may be 
  initiated remotely. The exploit has been disclosed to the public and may be 
  used. The vendor was contacted early about this disclosure but did not respond
  in any way.
