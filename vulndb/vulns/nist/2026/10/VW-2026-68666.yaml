title: OpenSave before 2.4.0-beta.1 fails to validate sender identity in WAN 
  relay requests, allowing unpaired room members to impersonate paired devices 
  by spoofing the RelayMessage From field. Attackers who know the room code can 
  join, read paired peer identifiers from announcements, and send forged 
  requests to access protected sync routes including save data, snapshots, and 
  file operations.
