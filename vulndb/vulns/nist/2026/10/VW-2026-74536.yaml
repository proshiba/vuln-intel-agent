title: SAP S/4HANA (Manage Substitution/Validation Rules) does not sufficiently 
  validate input processed by rule definition functionality that utilizes a 
  domain-specific scripting language. An authenticated attacker with specific 
  business privileges could submit specially crafted input, which is interpreted
  as executable ABAP code by the rule processing logic. Successful exploitation 
  could allow the attacker to execute ABAP arbitrary code into the system, 
  resulting in full compromise of the affected system and high impact on 
  confidentiality, integrity, and availability of the system.
