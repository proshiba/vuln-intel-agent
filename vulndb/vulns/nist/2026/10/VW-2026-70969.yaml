title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/isert:
  wait for deferred control PDU completions before releasing the connection\n\nisert_send_done()
  hands ISTATE_SEND_TASKMGTRSP, ISTATE_SEND_REJECT and\nISTATE_SEND_TEXTRSP completions
  off to isert_comp_wq and returns.  The work\nitem then runs isert_completion_put()
  -> isert_put_cmd(), which reads\nisert_conn->conn and takes conn->cmd_lock.\n\n\
  Nothing orders that work item against teardown.  isert_wait_conn() queues\nisert_release_work,
  which frees isert_conn, and iscsit_close_connection()\nfrees the iscsit_conn right
  after it returns, so the queued work can run\nagainst freed memory.\n\nCount the
  deferred control PDU completions per connection and let\nisert_wait_conn() wait
  for them before the release work is queued.\n\nISTATE_SEND_LOGOUTRSP is deliberately
  not counted: that branch runs\niscsit_logout_post_handler(), which ends up waiting
  for\nconn->conn_wait_comp, and that completion is only sent by\niscsit_close_connection()"
