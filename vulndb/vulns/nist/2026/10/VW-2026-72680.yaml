title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvlan:
  require the MAC header to be present in __vlan_insert_inner_tag()\n\n__vlan_insert_inner_tag()
  only guarantees head room via skb_cow_head(),\nnever that mac_len bytes of MAC header
  are present.  Its ETH_HLEN\nwrappers - __vlan_insert_tag() under skb_vlan_push(),
  and\nvlan_insert_tag() under validate_xmit_vlan() on the generic transmit\npath
  - therefore rewrite the first 16 bytes at skb->data: a 12-byte\nmemmove plus two
  2-byte stores at +12 and +14.  No caller supplies the\nbound, while the pop helpers
  use skb_ensure_writable()/pskb_may_pull().\n\nAn IFF_TUN device has hard_header_len
  == 0, so packet_snd() accepts a\none-byte AF_PACKET/SOCK_RAW frame.  The first vlan
  push only sets a\nhwaccel tag; the next - clsact \"action vlan push\" or\nbpf_skb_vlan_push()
  - enters the helper with skb->len still 1.  The\nhead comes from skbuff_small_head
  without __GFP_ZERO, so each push\ndrags bytes from beyond skb->tail into the frame.\
  \  Afte"
