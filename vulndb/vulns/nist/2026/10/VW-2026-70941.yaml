title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: don't allow injecting frames wider than the chanctx\n\nFrames injected
  on a monitor interface can carry a radiotap\nfield requesting a bandwidth, which
  mac80211 passes down to\nthe driver regardless of the the actual operational bandwidth.\n\
  \nIf the bandwidth requested is too wide, that triggers a warning\nin hwsim:\n\n\
  \  WARN_ON(hwsim_get_chanwidth(bw) > hwsim_get_chanwidth(confbw))\n\nDrop such frames
  entirely instead since they cannot be sent."
