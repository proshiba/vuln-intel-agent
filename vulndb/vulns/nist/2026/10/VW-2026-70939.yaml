title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: mesh: reset the CSA state when leaving\n\nifmsh->csa is allocated in ieee80211_mesh_csa_beacon()
  and only freed\nin ieee80211_mesh_finish_csa(), i.e. when the channel switch completes.\n\
  Leaving the mesh while a switch is still pending therefore leaks it.\n\nAdditionally,
  ifmsh->csa_role and ifmsh->chsw_ttl have their state leak\nin this case, so things
  can get mixed up in addition to the memory\nleak.\n\nRefactor the reset and call
  it in ieee80211_stop_mesh() to fix it all."
