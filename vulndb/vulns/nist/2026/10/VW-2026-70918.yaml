title: "In the Linux kernel, the following vulnerability has been resolved:\n\nseg6:
  set IPSKB_L3SLAVE from IP6SKB_L3SLAVE on IPIP decapsulation\n\nWhen an SRv6 packet
  arrives on an interface enslaved to a VRF,\nvrf_ip6_rcv() sets IP6SKB_L3SLAVE in
  IP6CB, but decap_and_validate()\nhas never set IPSKB_L3SLAVE in IPCB. The bit stayed
  clear in the\ncommon case, and with CONFIG_IPV6_MIP6 the leftover frag_max_size
  of\na reassembled outer packet could even set it, with no VRF involved.\nCommit
  44930446dde4 (\"ipv6: seg6: clear IPv4 control block on IPIP\ndecapsulation\") then
  made the unreliable bit reliably clear.\n\nThe effect of the missing flag is visible
  with End.DX4 when a\ndelivery to a local address of the node reaches the socket
  lookup.\nFor example, a UDP socket bound to the enslaved ingress interface\ndoes
  not receive any of the decapsulated packets, while an unbound\nsocket outside the
