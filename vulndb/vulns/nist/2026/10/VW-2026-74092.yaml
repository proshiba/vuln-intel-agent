title: Open WebUI from 0.6.31 before 0.11.4 contains a stored cross-site 
  scripting vulnerability in its Markdown renderer, which treats user-authored 
  tool-call details blocks as tool output and mounts their embeds attribute in 
  script-enabled iframes. Authenticated users can post crafted channel messages,
  chat messages, or citation content that runs JavaScript in viewers' browsers, 
  enabling in-app phishing, or session hijacking where 
  iframeSandboxAllowSameOrigin is enabled.
