title: Plane is an open-source project management tool. Prior to 1.4.0, the 
  issue-relation endpoint accepts issue UUIDs in the request body without 
  validating that they belong to the caller's workspace. An authenticated user 
  can create relations linking their own issues to issues in any other workspace
  on the instance, leaking issue metadata through activity events. This issue is
  fixed in 1.4.0.
