title: A form-rendering interface in the Advanced Forms component is reachable 
  without authentication so that published forms can be displayed to anonymous 
  visitors, but it returned more data than the form itself required. Anyone who 
  knew the web address of a published form could potentially retrieve the form 
  owner's Kiteworks account profile, including personal details, along with 
  parts of the deployment's configuration settings; no passwords, authentication
  tokens, or multi-factor secrets were exposed.
