title: "Exposure of data element to wrong session vulnerability in Apache APISIX.\n\
  \n\n\nThis issue affects Apache APISIX: from 2.3.0 before 3.7.0.\n\n\n\nUnder a
  supported authz-keycloak configuration, a request's authorization scope could persist
  into later requests on the same route, leading to unintended authorization expansion
  and inconsistent access-control decisions.\n\n\n\nUsers are recommended to upgrade
  to version 3.7.0 or higher, which fixes the issue."
