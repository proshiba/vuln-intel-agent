title: The Download Manager plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Display Name in all versions up to, and including, 
  3.3.70 due to insufficient input sanitization and output escaping. This makes 
  it possible for authenticated attackers, with subscriber-level access and 
  above, to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses an injected page. This requires the [wpdm_edit_profile] 
  shortcode to be present on a front-end page accessible to Subscriber-level 
  users, who can then submit a multiply entity-encoded payload via the display 
  name field to bypass sanitization.
