title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  validate access flags before swapping the MR's PD\n\nrxe_rereg_user_mr() reassigns
  mr->ibmr.pd first and only then\nvalidates the IB_MR_REREG_ACCESS argument:\n\n\t
  if (flags & IB_MR_REREG_PD) {\n\t\trxe_put(old_pd);\n\t\trxe_get(pd);\n\t\tmr->ibmr.pd
  = ibpd;\n\t}\n\n\tif (flags & IB_MR_REREG_ACCESS) {\n\t\tif (access & ~RXE_ACCESS_SUPPORTED_MR)\n\
  \t\t\treturn ERR_PTR(-EOPNOTSUPP);\n\t\tmr->access = access;\n\t}\n\nBoth flags
  pass the entry check because RXE_MR_REREG_SUPPORTED is\nIB_MR_REREG_PD | IB_MR_REREG_ACCESS,
  so a caller can reach the access\ncheck with mr->ibmr.pd already reassigned.\n\n\
  mr->ibmr.pd is owned by the core, which adjusts pd->usecnt only on the\nsuccess
  path: ib_uverbs_rereg_mr() jumps to put_new_uobj on a driver error\nwithout undoing
  the reassignment, so mr->pd == new_pd while the usecnts\nstill charge the MR to
  orig_pd. ib_dereg_mr_user() then decrements\nnew_pd, whose count can reach zero
  while a memory window still references"
