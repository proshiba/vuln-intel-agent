title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  sdio_uart: fix xmit_fifo leak when the port table is full\n\nsdio_uart_add_port()
  allocates the transmit fifo before claiming a\nslot in sdio_uart_table[].  When
  all UART_NR slots are taken, it\nreturns -EBUSY with the fifo still allocated, but
  the probe error\npath only kfree()s the port, leaking the transmit fifo.\n\nFree
  the fifo in the failure path of sdio_uart_add_port() itself so\nthe function retains
  nothing on error."
