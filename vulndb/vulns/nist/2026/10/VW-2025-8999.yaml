title: The The Classified Listing – Classified ads & Business Directory Plugin 
  plugin for WordPress is vulnerable to arbitrary shortcode execution in all 
  versions up to, and including, 5.0.3. This is due to the software allowing 
  users to execute an action that does not properly validate a value before 
  running do_shortcode. This makes it possible for authenticated attackers, with
  Subscriber-level access and above, to execute arbitrary shortcodes.
