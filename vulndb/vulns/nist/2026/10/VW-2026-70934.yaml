title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nft_nat: fully initialise new_addr in netmap setup\n\nnft_nat_setup_netmap() builds
  the mapped address in an on-stack\nunion nf_inet_addr. For an IPv4 mapping it writes
  only the 4-byte .ip\nmember and the loop runs a single 32-bit iteration, but it
  then copies\nthe whole 16-byte union into range->min_addr and range->max_addr, so
  the\nupper 12 bytes reach nf_nat_setup_info() uninitialised.\n\nKMSAN reports an
  uninit-value in nf_nat_setup_info() reached from\nnft_nat_eval(). The IPv6 path
  fills all 16 bytes and is not affected.\n\nZero-initialise new_addr."
