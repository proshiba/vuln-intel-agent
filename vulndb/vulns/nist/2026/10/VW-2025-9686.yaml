title: "The  Preset configuration https://v2.vuetifyjs.com/en/features/presets  feature
  of Vuetify is vulnerable to  Prototype Pollution https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
   due to the internal 'mergeDeep' utility function used to merge options with defaults. Using
  a specially-crafted, malicious preset can result in polluting all JavaScript objects
  with arbitrary properties, which can further negatively affect all aspects of the
  application's behavior. This can lead to a wide range of security issues, including
  resource exhaustion/denial of service or unauthorized access to data.\n\nIf the
  application utilizes Server-Side Rendering (SSR), this vulnerability could affect
  the whole server process.\n\nThis issue affects Vuetify versions greater than or
