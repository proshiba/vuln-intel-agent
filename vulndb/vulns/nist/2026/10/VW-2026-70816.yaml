title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  rmi_smbus - fix out-of-bounds read in rmi_smb_write_block()\n\nWhen chunking writes
  into SMBus blocks in rmi_smb_write_block(), the\nloop calculates block_len using
  the original total length (len) instead\nof the remaining length (cur_len).\n\n\
  If len is greater than 32 bytes (SMB_MAX_COUNT), block_len remains 32\nfor every
  iteration, even on the final partial chunk where fewer than 32\nbytes remain. This
  causes smb_block_write() to read 32 bytes from the\nadvanced data buffer pointer,
  reading past the end of the input buffer.\n\nFix this by calculating block_len using
  cur_len and advancing the buffer\nand address pointers by block_len."
