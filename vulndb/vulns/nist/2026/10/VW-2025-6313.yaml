  vulnerable to unauthorized modification of data due to a missing capability 
  check on the `add_images_to_gallery_callback()` function in all versions up 
  to, and including, 2.13.3. This makes it possible for authenticated attackers,
  with Author-level access and above, to add images to arbitrary Modula 
  galleries owned by other users.
