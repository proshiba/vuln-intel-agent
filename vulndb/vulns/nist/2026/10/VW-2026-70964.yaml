title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rtrs-clt:
  Fix CQ pool leak when connect is interrupted\n\nThe client borrows shared CQ credits
  in the ADDR_RESOLVED handler via\nib_cq_pool_get(), before the peer is connected.
  create_cm() can return\n-ERESTARTSYS from wait_event_interruptible_timeout() without
  destroying\nthe CM ID. The init_conns() and stop-and-destroy paths then call\ndestroy_con_cq_qp()
  while cq is still NULL (no PUT) and only afterwards\nrdma_destroy_id().\n\nCMA serializes
  the handler against rdma_destroy_id() with handler_mutex,\nbut that does not order
  the GET against destroy_con_cq_qp(). If\nADDR_RESOLVED has already passed the DESTROYING
  check, it can take\ncon_mutex, GET credits, and then lose the con to kfree. Device\n\
  unregister later hits WARN_ON(cq->cqe_used) in ib_cq_pool_cleanup().\n\nSet a per-connection
  flag under con_mutex before CQ/QP teardown so a\nracing ADDR_RESOLVED cannot borrow
  credits after teardown has begun."
