title: UTMStack before 11.2.16 contains a server-side request forgery 
  vulnerability that allows authenticated attackers to make the server request 
  arbitrary internal resources by supplying an unvalidated url parameter to the 
  PdfService.downloadPdf() method exposed via GET /api/generate-pdf-report. 
  Attackers can leverage this to force the web-pdf microservice to fetch 
  internal backend endpoints, the OpenSearch cluster, or the cloud 
  instance-metadata service, exposing sensitive internal data rendered into the 
  returned PDF.
