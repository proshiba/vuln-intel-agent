title: A vulnerability was found in InstantSoft icms2 up to 2.18.2. Impacted is 
  the function files_delete_file of the file system/fields/image.php of the 
  component Image Handler. Performing a manipulation of the argument size 
  results in path traversal. The attack may be initiated remotely. The exploit 
  has been made public and could be used. The patch is named 
  03d70937f1ff97031523222808726994b8b79379. It is recommended to apply a patch 
  to fix this issue.
