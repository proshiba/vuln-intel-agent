title: Ghost is a Node.js content management system. From 6.56.0 until 6.67.0, 
  an image processing library bundled with Ghost contained a vulnerability in 
  its SVG handling. Any staff user, including Contributors, could create a 
  bookmark card for an attacker-controlled website, resulting in arbitrary 
  commands being run on the Ghost server. This issue is fixed in version 6.67.0.
