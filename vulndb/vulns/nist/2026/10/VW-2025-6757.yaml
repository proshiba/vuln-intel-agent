  version 14.10. Attackers with access to the console can\nredirect victims to an
  arbitrary URL. The attack complexity is low, attack\nrequirements are present, no
  privileges are required, and users must actively\nparticipate in the attack. Impact
  to confidentiality is low and there is no\nimpact to integrity or availability.
  There are high severity impacts to\nconfidentiality, integrity, availability in
  subsequent systems."
