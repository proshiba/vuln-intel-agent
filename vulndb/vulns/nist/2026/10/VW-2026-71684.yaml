title: When password or public key authentication is used with the Windows port 
  of wolfSSHd, the Windows logon token acquired for one authenticated connection
  is not released before a token is acquired for a subsequent connection, 
  resulting in user login poisoning between connections. A less privileged user 
  with a valid account on the server can exploit this to force a login as a more
  privileged user. The vulnerability was introduced with the initial Windows 
  port of wolfSSHd in wolfSSH version 1.4.15 and affects all versions through 
  1.5.0. Non-Windows builds of wolfSSHd are not affected.
