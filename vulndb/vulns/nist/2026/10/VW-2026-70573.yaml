title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to 3.7.13, 
  packages/server/src/models/ApplicationModel.ts accepts a caller-chosen 
  application authorization identifier, applications/:id/confirm binds that 
  identifier to a logged-in user through a generic consent page, and the public 
  packages/server/src/routes/api/application_auth.ts endpoint passes it to 
  ApplicationModel.createAppPassword without authenticating or binding the 
  redeemer. An attacker can cause a victim to approve the attacker's identifier,
  redeem a durable application ID and password, and exchange the credential for 
  a victim session with full read and write access to synchronized data. This 
  vulnerability is fixed in 3.7.13.
