title: Nginx UI is a web user interface for the Nginx web server. Prior to 
  2.4.1, config.ValidateConfigDirectives splits configuration by newline and 
  checks only the first directive token on each line even though Nginx permits 
  multiple semicolon-separated directives on one line. An authenticated caller 
  can place a benign directive first and a restricted load_module, js_import, 
  perl, or user root directive later on the same line, or can use an 
  unrestricted include directive to load restricted content. These mechanisms 
  bypass validation on REST, nginx_config_modify, site, and stream write paths; 
  when an executable module is available, the injected configuration can execute
  code in the Nginx worker context. This issue is fixed in version 2.4.1.
