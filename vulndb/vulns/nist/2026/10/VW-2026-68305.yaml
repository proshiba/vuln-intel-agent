title: U-Boot before 2026.10-rc5 contains a use-after-free vulnerability in the 
  httpc_recv_cb() function within the lwIP wget implementation. When HTTP data 
  storage fails, the callback frees the connection PCB but returns ERR_BUF 
  instead of ERR_ABRT, causing the TCP input path to access released memory and 
  crash the bootloader.
