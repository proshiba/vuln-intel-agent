title: The GenerateBlocks plugin for WordPress is vulnerable to unauthorized 
  access of data due to a missing capability check on the 'get_option_rest' 
  function in all versions up to, and including, 2.1.1. This makes it possible 
  for authenticated attackers, with contributor level access and above, to read 
  arbitrary WordPress options, including sensitive information such as SMTP 
  credentials, API keys, and other data stored by other plugins.
