title: "Improper Authorization vulnerability in Apache SkyWalking BanyanDB.\n\n\n\n\
  The Canopy includes incomplete proof-of-concept role and monitoring-proxy functionality. Under
  a non-default configuration with a readonly Canopy user and a reachable monitoring
  target, that user can send non-read requests through the monitoring proxy.\n\n\n\
  \nThis issue affects Apache SkyWalking BanyanDB: from 0.11.0 before 0.11.1.\n\n\n\
  \nUsers are recommended to upgrade to version 0.11.1, which fixes the issue."
