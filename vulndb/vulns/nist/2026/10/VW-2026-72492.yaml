title: A path traversal vulnerability exists in Bower decompress-zip through 
  version 0.3.3. The vulnerability located in `lib/decompress-zip.js` improperly
  validates archive entry paths during ZIP extraction. A crafted ZIP archive 
  containing entries that resolve to prefix-sibling directories can cause files 
  to be written outside the intended extraction directory. Successful 
  exploitation may allow arbitrary file overwrite, application compromise, or 
  remote code execution depending on the target environment and writable sibling
  paths.
