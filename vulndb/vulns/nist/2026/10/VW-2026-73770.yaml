title: A vulnerability has been found in erzhongxmu JEEWMS up to 2026.09.27-W39.
  The impacted element is the function WvNoticeController.list of the file 
  com/zzjee/wmapi/controller/WvNoticeController.java of the component Search 
  Endpoint. The manipulation of the argument searchstr leads to sql injection. 
  Remote exploitation of the attack is possible. The exploit has been disclosed 
  to the public and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
