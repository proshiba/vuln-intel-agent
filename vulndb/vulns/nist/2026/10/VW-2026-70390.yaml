title: A vulnerability was identified in onetwothreeneth 
  HospitalManagementSystem up to 9ef91ed6007314b6473110ed699dff76d158f61d. 
  Affected by this issue is the function get of the file print.php. The 
  manipulation of the argument transaction_id leads to sql injection. It is 
  possible to initiate the attack remotely. The exploit is publicly available 
  and might be used. This product is using a rolling release to provide 
  continious delivery. Therefore, no version details for affected nor updated 
  releases are available. The project was informed of the problem early through 
  an issue report but has not responded yet.
