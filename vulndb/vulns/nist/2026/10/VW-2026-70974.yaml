title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  scpi: bound-check DVFS index in scpi_dvfs_recalc_rate\n\ndvfs_get_idx() may return
  an out-of-range index if the SCP firmware is\nbuggy or returns a stale value. Only
  negative indexes were rejected, so a\nlarge index walked past info->opps and could
  treat garbage as a clock rate\n(KASAN OOB / wrong frequency to consumers). The missing
  upper bound dates\nback to the original SCPI clock driver.\n\nTreat indexes >= opp
  count as invalid and return 0, same as idx < 0."
