title: "The Newsletter – Send awesome emails from WordPress plugin for WordPress is
  vulnerable to Insufficiently Protected Credentials in all versions up to, and including,
  9.3.9 The plugin's public click-tracking REST route `/tnp/l/` is registered with
  `permission_callback => '__return_true'` and, upon receiving a valid keyed-MD5 signature,
  calls `set_user_cookie()`, which emits a `Set-Cookie: newsletter=<id>-<raw_token>`
  response header to the requester because the subscriber object loaded via `get_user()`
  lacks the `_trusted` property, causing `get_user_key()` to return the raw token
  column value instead of its MD5-masked variant. This makes it possible for unauthenticated
  attackers who obtain any signed click-tracking URL for a target subscriber to receive
  that subscriber's permanent raw authentication cookie, which they can then use to
  export the subscriber's full PII record via the JSON profile-export endpoint (`?na=px`),
