title: 'A vulnerability was detected in ZKTeco BioTime up to 9.0.3/9.0.4/9.5.2. This
  affects an unknown part of the file /base/safe_setting/ of the component Endpoint.
  Performing a manipulation of the argument backup_encryption_password_decrypt/export_encryption_password_decrypt
  results in unprotected storage of credentials. Remote exploitation of the attack
  is possible. The exploit is now public and may be used. Upgrading to version 9.0.6
  is able to mitigate this issue. It is recommended to upgrade the affected component.
  The vendor confirms: "The mainstream version ZKBioTime V9.0.6 has fixed this vulnerability.
  Please update to the latest version as soon as possible. For the Middle East version
  BioTime 9.5.X, you can contact the local technical support to obtain the fix package."'
