title: "pgjdbc, the PostgreSQL JDBC Driver, versions 42.7.4 and 42.7.5 can send the
  previous contents of the GSS send buffer in place of the first part of a value on
  a connection with GSS encryption (gssEncMode=prefer or require), and the server
  stores the value without an error. The buffer is 16320 bytes with MIT Kerberos.
  The stored value then holds bytes of the messages the driver sent just before it
  on the same connection, such as the statement's SQL text, its other parameters,
  and earlier rows of the same batch, instead of the bytes the application supplied.
  Values at least as long as the buffer are affected when the driver writes them from
  a byte array: bind parameters set with setString, setBytes, or a ByteStreamWriter,
  CopyIn.writeToCopy, and LargeObject.write. Most such writes fail with an ArrayIndexOutOfBoundsException
  instead. The default, gssEncMode=allow, does not start GSS encryption, and connections
  without GSS encryption are not affected. Versions 42.7.3 and earlier are not aff"
