title: The Paid Membership Plugin, Ecommerce, User Registration Form, Login 
  Form, User Profile & Restrict Content – ProfilePress plugin for WordPress is 
  vulnerable to Reflected Cross-Site Scripting via ppress_billing_address 
  Filename Parameter in all versions up to, and including, 4.17.4 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. The vulnerability is exploitable via any page hosting 
  the ProfilePress Tabbed Widget by supplying a malicious filename for the 
  ppress_billing_address file upload field in a crafted POST request.
