title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to 3.7.13, selecting a note containing a
  jsoncanvas fence causes the whiteboard text and file-node components in 
  packages/app-desktop/gui/NoteEditor/NoteBody/WhiteboardEditor/nodes/TextNode.tsx
  and 
  packages/app-desktop/gui/NoteEditor/NoteBody/WhiteboardEditor/nodes/FileNode.tsx
  to render card content with the full Markdown renderer. The components insert 
  the resulting HTML into the main application document through 
  dangerouslySetInnerHTML. A malicious note can inject style elements and remote
  CSS imports that modify trusted application chrome, signal when the note is 
  opened, and potentially disclose exposed attribute values. Content Security 
  Policy blocks inline script execution, so the supported impact is CSS 
  injection and UI redressing rather than code execution. This issue is fixed in
  version 3.7.13.
