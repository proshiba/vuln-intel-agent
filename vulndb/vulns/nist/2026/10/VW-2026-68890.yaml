title: OpenClaw Windows Node before 2026.7.1-3 contains a missing authorization 
  vulnerability in NodeService capture handlers that allows connected gateways 
  or agents to perform screen snapshots, camera snaps, and location captures 
  without consent prompts. Attackers can invoke screen.snapshot, camera.snap, 
  and location.get over the node WebSocket to silently capture screenshots, 
  photograph users through webcams, and obtain device geolocation without user 
  interaction.
