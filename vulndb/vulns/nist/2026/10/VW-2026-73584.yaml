title: "The user-mode syscall verifiers z_vrfy_fuel_gauge_get_props() and z_vrfy_fuel_gauge_set_props()
  in drivers/fuel_gauge/fuel_gauge_syscall_handlers.c declared two variable-length
  arrays, union fuel_gauge_prop_val k_vals[len] and fuel_gauge_prop_t k_props[len],
  sized directly by the caller-supplied len argument. len is an unvalidated size_t
  taken straight from the syscall ABI, and the VLAs were allocated before any check
  at all — including before the K_SYSCALL_DRIVER_FUEL_GAUGE() object-permission check.
  The subsequent k_usermode_from_copy() calls validated only that the user source
  buffer was readable; the kernel destination was never bounds-checked, since it was
  sized by the same attacker-chosen len.\n\nAny thread running in user mode with CONFIG_USERSPACE
  enabled can invoke fuel_gauge_get_props() or fuel_gauge_set_props() with a large
  len. This first displaces the supervisor stack pointer by an arbitrary attacker-chosen
