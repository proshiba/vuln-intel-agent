title: Grav Login OAuth plugin (grav-plugin-login-oauth) before 1.4.3 provisions
  OAuth accounts as ordinary Grav users with a deterministic <provider>.<id> 
  username and an unsalted MD5 hash of the provider identifier as the password, 
  without disabling password login. Unauthenticated remote attackers who learn 
  or guess a provider identifier can reproduce these credentials and log in, 
  gaining administrative control of privileged accounts.
