title: The WPCOM Member plugin for WordPress is vulnerable to Authentication 
  Bypass in all versions up to, and including, 1.7.27 via the `uuid` and `code` 
  parameters of the social-login callback handler registered on the `init` hook.
  The vulnerability exists because the `login` function's social-login flow 
  performs no nonce validation, no OAuth state verification, and no per-visitor 
  namespace isolation in the session store, allowing an unauthenticated attacker
  to issue a crafted GET request that writes an attacker-named, attacker-valued 
  entry into the global session namespace (bypassing the per-visitor prefix by 
  prepending an underscore), then issue a second GET request triggering 
  `weapp_new_user()` to read that forged entry and resolve the attacker-supplied
  `openid` value to a bound WordPress account before `wp_set_auth_cookie()` 
  establishes a fully authenticated session. This makes it possible for 
