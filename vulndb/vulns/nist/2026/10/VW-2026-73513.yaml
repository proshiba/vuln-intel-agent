title: Lightdash through 2.556.0 contains an authorization bypass vulnerability 
  that allows authenticated organization members to delete other users' personal
  access tokens by supplying their UUID. Attackers can send DELETE requests to 
  the personal-access-tokens route with a victim's token UUID, even across 
  organizations, to revoke it and break API integrations.
