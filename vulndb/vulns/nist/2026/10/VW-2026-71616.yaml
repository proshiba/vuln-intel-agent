title: Backstage is an open framework for building developer portals. Prior to 
  3.3.1, 3.4.1, 4.0.3 and 4.1.0, the @backstage/plugin-scaffolder-backend 
  package is affected by improper task state validation in scaffolder backend. 
  An authenticated user with permission to create and access Scaffolder tasks 
  may, under specific timing and deployment conditions, affect files accessible 
  to the Backstage backend. If backend application files are writable, the 
  confidentiality, integrity, and availability of the backend may be 
  compromised. This issue is fixed in versions 3.3.1, 3.4.1, 4.0.3 and 4.1.0.
