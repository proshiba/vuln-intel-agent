title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_api: release tail references on DELACTION failure\n\nA batched RTM_DELACTION
  request takes a temporary reference on each\naction before attempting any deletion.
  tcf_action_delete() clears\neach processed slot and drops its temporary reference
  before attempting\nthe deletion. If deletion fails, tca_action_gd() calls\ntcf_action_put_many()
  to release the remaining references, but its\ntcf_act_for_each_action() iterator
  stops at the first NULL slot.\n\nWhen a batch stops at an action bound to a filter,
  this leaks a\nreference on each subsequent action. A later delete of an unbound\n\
  action can then return success without removing it from the IDR.\n\nWalk the full
  array in tcf_action_put_many() and skip NULL slots to\nrelease the references held
  on the unprocessed actions."
