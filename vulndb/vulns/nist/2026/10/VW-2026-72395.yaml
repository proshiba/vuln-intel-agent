title: Uncontrolled recursion in DcmDicomDir::moveRecordToTree() in 
  dcmdata/libsrc/dcdicdir.cc of OFFIS DCMTK 3.7.0 allows an attacker to cause a 
  denial of service (stack exhaustion and process crash) via a crafted DICOMDIR 
  file with a deeply chained sequence of directory records linked through the 
  Offset of Referenced Lower-Level Directory Entity attribute. Any application 
  that opens the DICOMDIR is affected, including dcmgpdir and media viewers 
  built on DCMTK. The issue is fixed in commit 
  ca761f7f3dcaaddaa95be87cf5d736138d7c3a9f.
