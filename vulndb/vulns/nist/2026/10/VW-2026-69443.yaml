title: Mooncake transfer engine through 0.3.13.post1 contains a memory 
  exhaustion vulnerability in TransferMetadata::receivePeerNotify that allows 
  unauthenticated attackers to grow process memory without limit. Attackers can 
  repeatedly send notify frames up to 1 MB to the handshake RPC port, filling 
  the uncapped notifys vector until the out-of-memory killer terminates the 
  engine.
