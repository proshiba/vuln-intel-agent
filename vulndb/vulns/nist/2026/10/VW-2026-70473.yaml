title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, the chunked media upload RPC validates that a chunk index is in range 
  but neither rejects an already stored index nor replaces its previous object. 
  An authenticated user can repeatedly upload the same valid index, causing each
  successful request to allocate another temporary object and increasing stored 
  bytes beyond the upload session's declared logical size. Assembly detects the 
  inconsistent chunk count only after allocation. This issue is fixed in version
  2.18.0.
