title: A flaw has been found in Yungengxin Cloud Billing 2024.11.28.11. Affected
  by this vulnerability is the function sub_14000443C in the library 
  LWBilling64.sys of the component IOCTL Process Termination. Executing a 
  manipulation of the argument Pid can lead to exposed ioctl with insufficient 
  access control. The attack needs to be launched locally. The exploit has been 
  published and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
