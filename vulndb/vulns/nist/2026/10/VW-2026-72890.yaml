title: ageLANServer provides a cross-platform web server and launcher for 
  offline multiplayer in several Age of Empires and Age of Mythology games. 
  Prior to version 1.15.2, the AoE3 POST /game/cloud/getFileURL handler in the 
  bundled game server has no request body size limit or cap on the 
  attacker-controlled JSON names array and allocates response storage directly 
  from the unbounded array length. A remote unauthenticated client can use the 
  default self-registration flow and send an oversized request that causes 
  excessive memory allocation, crashes or hangs the server process, disconnects 
  active players, and keeps the service unavailable until it is restarted. This 
  issue is fixed in version 1.15.2.
