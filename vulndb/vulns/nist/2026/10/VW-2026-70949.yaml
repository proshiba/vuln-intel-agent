title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: don't start a ROC while scanning\n\nThe ROC work can be pending when a
  scan starts (which requires\nROC list to be empty, but that's possible), and then
  a new ROC\ncan be added to the list and the work will pick it up.\n\nAvoid starting
  that ROC if a scan made it between things, as\notherwise we'll hit a warning later:\n\
  \n  WARNING: net/mac80211/offchannel.c:404 at ieee80211_start_next_roc+0x256/0x2d0\n\
  \  Workqueue: events_unbound cfg80211_wiphy_work\n  Call Trace:\n   __ieee80211_scan_completed+0x4fd/0xe40
  net/mac80211/scan.c:537\n   ieee80211_scan_work+0x472/0x1ff0 net/mac80211/scan.c:1193\n\
  \   cfg80211_wiphy_work+0x410/0x570 net/wireless/core.c:513"
