title: "Tapo C120 v1 and C200 V5\ndo not adequately protect login challenge data or
  sanitize\nattacker-controlled input processed by the MacTool handler. An unauthenticated\n\
  attacker on the same local network can replay login challenge data to obtain an\n\
  administrative session, enable a privileged service that becomes accessible\nafter
  a reboot, and submit crafted input to execute arbitrary commands within\nthe device
  management process.\n\n\n\n\n\n\n\n\n\nSuccessful\nexploitation may allow arbitrary
  command execution on the camera and compromise\nthe confidentiality, integrity,
  and availability of the affected device.\nExploitation requires access from the
  same local network, replay of the login\nchallenge data, activation of the privileged
  service, and a device reboot."
