title: The Real Estate Manager – Property Listing and Agent Management plugin 
  for WordPress is vulnerable to Stored Cross-Site Scripting via the 
  'first_name' parameter in all versions up to, and including, 7.3 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. The reCAPTCHA check is
  trivially bypassed by omitting the g-recaptcha-response parameter entirely, 
  since validation only runs when that parameter is present.
