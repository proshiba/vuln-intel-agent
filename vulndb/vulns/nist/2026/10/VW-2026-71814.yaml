title: Backstage is an open framework for building developer portals. Prior to 
  0.3.25, the @backstage/plugin-scaffolder-backend-module-confluence-to-markdown
  package is affected by improper repository path validation in a scaffolder 
  backend module. An authenticated user who can execute an affected template and
  control its repository file location may cause generated content to be written
  outside the task workspace, within locations writable by the Backstage backend
  process. This issue is fixed in version 0.3.25.
