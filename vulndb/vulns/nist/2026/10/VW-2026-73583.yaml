title: "net_route_ipv6_packet() in subsys/net/ip/route_ipv6.c resolved the nexthop's
  link-layer address with net_nbr_get_lladdr(nbr->idx) without first checking whether
  the neighbor cache entry actually had a linked link-layer address. An unresolved
  neighbor carries idx == NET_NBR_LLADDR_UNKNOWN (0xff), and net_nbr_get_lladdr()
  in subsys/net/ip/nbr.c performs no runtime bounds check beyond a NET_ASSERT, returning
  &net_neighbor_lladdr[255] — roughly 2.5 KB past the end of an array whose default
  size is CONFIG_NET_IPV6_MAX_NEIGHBORS (8). Because the returned pointer is never
  NULL, the following lladdr == NULL guard does not catch it.\n\nThe function is reached
  from ipv6_route_packet() in subsys/net/ip/ipv6.c for every received unicast IPv6
  packet whose destination is not a local address on the receiving interface; CONFIG_NET_IPV6_ROUTE
  is enabled by default whenever the IPv6 neighbor cache is, so no router or forwarding
  configuration is needed. net_route_ipv6_get_info() returns the packet's destin"
