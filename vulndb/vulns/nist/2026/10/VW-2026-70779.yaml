title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix server->total_read for compound encrypted PDUs\n\nIn receive_encrypted_standard(),
  server->total_read is left at the\nfull decrypted frame size when walking sub-PDUs
  of a compound encrypted\nframe. As a result, cifs_handle_standard() passes this
  full size\nto smb2_check_message(), causing the PDU length guards to incorrectly\n\
  validate the entire compound frame instead of the current sub-PDU.\n\nThis allows
  truncated non-last sub-PDUs to bypass length validation,\nleading to out-of-bounds
  reads in smb2_get_data_area_len().\n\nFix this by setting server->total_read to
  the true length of the\ncurrent sub-PDU: next_cmd for non-last sub-PDUs, and the
  remaining\npdu_length for the last one."
