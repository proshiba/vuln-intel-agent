title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: add HE 6 GHz capability in the scan elems len\n\nThe HE 6 GHz Band Capability
  element is in the probe request for\nevery band if 6 GHz is supported, so add the
  size to scan_ies_len.\n\nOtherwise, building probe request elements can fail, triggering
  the\nWARN_ON in __ieee80211_start_scan()."
