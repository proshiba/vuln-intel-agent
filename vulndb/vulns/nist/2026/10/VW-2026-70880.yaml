title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf:
  Fix null pointer access in is_include_guest_event()\n\nA typical module unload occurring
  event when there is an active perf\nconnection leads to freeing of the pmu pointer.
  The call log is something\nlike:\n ..\n __pmu_detach_event\n pmu_detach_event\n\
  \ pmu_detach_events\n perf_pmu_unregister\n ..\n\n__pmu_detach_event() sets event->pmu
  to null. When the perf connection\nfinally is closed, the following stack trace
  is observed:\n\n Oops: general protection fault, kernel NULL pointer dereference\n\
  \ ...\n RIP: 0010:_free_event+0x3e/0x370\n ...\n Call Trace:\n ...\n perf_event_release_kernel+0x260/0x2d0\n\
  \ perf_release+0x12/0x20\n\nA call to mediated_pmu_unaccount_event() inside _free_event()
  is the root\ncause of this crash. Adding a check inside is_include_guest_event()
  ensures\nwe don't accidentally access a null pmu ptr. In addition to this, we will\n\
  now call mediated_pmu_unaccount_event() before clearing the pmu ptr so that\nnr_include_gues"
