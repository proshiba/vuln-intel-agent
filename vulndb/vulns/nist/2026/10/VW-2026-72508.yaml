title: In OpenStack Mistral through 23.0.0, the workflow membership API lets a 
  project that has accepted a share of another project's private workflow create
  a further membership naming a third project. The new membership row is created
  with its project_id defaulted to the accepting project rather than the 
  original workflow owner, and thus the owner can neither see nor delete it. The
  third project can accept this membership (that it had not actually been 
  granted by the owner), and then read and execute the owner's private workflow;
  only the accepting (not the owning) project can later revoke that access.
