title: "Integer Overflow, Improper Validation of Array Index, Uncontrolled Recursion
  and Memory Allocation with Excessive Size Value in the Go implementation of Apache
  PLC4X (PLC4Go) allow a malicious device, or an attacker able to inject network traffic,
  to crash or exhaust the memory of the client application,\ncausing a denial of service.\n\
  \nThe individual defects are:\n- Generated parsers pre-allocate arrays with the
  element count claimed on the wire (0.13.0 through 0.13.1).\n- Transport read helpers
  allocate buffers of the size claimed on the wire without an upper bound.\n- ADS
  and KNXnet/IP response handling indexes into received data without checking its
  length, causing a panic.\n- ADS and EIP frame-length handling accepts, or arithmetically
  wraps to, a length of zero, breaking message framing.\n- Recursive protocol types
  are parsed without a nesting-depth limit. The same defect in the Java implementation
  is covered by  CVE-2026-102509 https://cveprocess.apache.org/cve5/CVE-2026-102509
  .\n\nAddit"
