title: A flaw was found in source-to-image. When unpacking archive files, the 
  application fails to properly sanitize symbolic links pointing to absolute 
  file paths. An attacker who supplies a malicious builder image can exploit 
  this vulnerability by embedding links pointing outside the extraction 
  directory. This allows the attacker to bypass sandbox boundaries, potentially 
  leading to unauthorized information disclosure or file modification on the 
  host system.
