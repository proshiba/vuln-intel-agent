title: "Deserialization of Untrusted Data vulnerability in Apache Directory LDAP API.\n\
  \n\n\nA rogue/compromised LDAP server (or pre-TLS MITM) can answer a client's loadSchema()
  subschema search with a schema object that contains a serialized Java class, allowing
  some potential RCE. \n\n\n\nThis issue affects Apache Directory LDAP API: from 2.1.0
  before 2.1.9.\n\n\n\nUsers are recommended to upgrade to version 2.1.9, which fixes
  the issue."
