title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  percpu: Fix LSE operations on {8,16}-bit types\n\nThe assembly for __percpu_##name##_case_##sz()
  and\n__percpu_##name##_return_case_##sz() doesn't use the 'sfx' macro\nargument
  to form the LSE instruction. Without 'sfx', a W register\nargument will imply a
  32-bit memory location, and consequently\n{8,16}-bit ops will erroneously read and
  write 32 bits of memory when\nthe LSE instruction is used.\n\nFix this by appending
  'sfx' to 'op_lse' to LSE instruction. It is not\nnecessary (and not valid) to append
  'sfx' to 'op_llsc', as 'op_llsc' is\na register-register operation which does not
  access memory (and does not\ntake a size suffix)."
