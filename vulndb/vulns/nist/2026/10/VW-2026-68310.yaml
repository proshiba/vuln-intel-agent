title: A vulnerability was detected in Ziroom ZHOME A0101 1.0.1.0. This affects 
  the function set_syslog of the file /api/ZRnetwork/set_syslog. The 
  manipulation of the argument conloglevel/log_size results in command 
  injection. The attack may be performed from remote. The exploit is now public 
  and may be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
