title: A weakness has been identified in kishor-23 food-waste-management-system 
  411989e3ecb82895e53dca7865f72145f03d7d93/b3a70b2c492dc9904de5be1ad9389bd79b87f82c.
  Affected is an unknown function of the file admin/signup.php of the component 
  Admin Signup. This manipulation of the argument sign causes missing 
  authentication. The attack can be initiated remotely. The exploit has been 
  made available to the public and could be used for attacks. Continious 
  delivery with rolling releases is used by this product. Therefore, no version 
  details of affected nor updated releases are available. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
