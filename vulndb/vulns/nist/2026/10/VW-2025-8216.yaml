title: The wpForo Forum plugin for WordPress is vulnerable to error‐based or 
  time-based SQL Injection via the get_members() function in all versions up to,
  and including, 2.4.8 due to missing integer validation on the 'offset' and 
  'row_count' parameters. The function blindly interpolates 'row_count' into a 
  'LIMIT offset,row_count' clause using esc_sql() rather than enforcing numeric 
  values. MySQL 5.x’s grammar allows a 'PROCEDURE ANALYSE' clause immediately 
  after a LIMIT clause. Unauthenticated attackers controlling 'row_count' can 
  append a stored‐procedure call, enabling error‐based or time‐based blind SQL 
  injection that can be used to extract sensitive information from the database.
