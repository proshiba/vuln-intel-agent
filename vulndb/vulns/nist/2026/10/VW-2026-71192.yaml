title: NetBox versions 2.9.5 before 4.7.0 contain a server-side template 
  injection vulnerability that allows a low-privileged user with the "Can add 
  custom links" permission to steal session cookies and API tokens of other 
  users by exposing the raw Django HttpRequest object to the Jinja2 template 
  context. Attackers can craft a custom link template embedding 
  request.COOKIES['sessionid'] or a user's API token into an img src URL, which 
  bypasses the clean_html sanitizer and auto-exfiltrates the victim's 
  credentials to an attacker-controlled host when a privileged user views the 
  object, enabling full account takeover.
