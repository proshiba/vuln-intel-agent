title: The Groundhogg — CRM, Newsletters, and Marketing Automation plugin for 
  WordPress is vulnerable to Privilege Escalation via Contact Identity Rebinding
  in all versions up to, and including, 4.9 The vulnerability exists because the
  `create_contact` function in the v3 REST endpoint (`POST /gh/v3/contacts`) is 
  gated solely by the `add_contacts` capability and forwards the full request 
  payload — including the security-bearing `user_id` column — into the upsert 
  path of `Contacts_DB::add()`, which bypasses the ownership guard that 
