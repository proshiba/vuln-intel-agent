title: A weakness has been identified in Omega Solution CoinEx Crypto 2025. 
  Affected by this vulnerability is an unknown functionality of the file 
  /user/ticket of the component Ticket Attachment Upload. This manipulation 
  causes cross site scripting. The attack is possible to be carried out 
  remotely. The exploit has been made available to the public and could be used 
  for attacks. The product web site does not exist anymore. Maybe the product 
  got retired and/or replaced. The vendor was contacted early about this 
  disclosure but did not respond in any way.
