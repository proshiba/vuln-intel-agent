title: "GNU Aspell prezip-bin contains a heap-based buffer overflow vulnerability
  in the decompressor in prog/prezip.c. The decompressor does not properly check buffer
  space, so a crafted compressed file can cause out-of-bounds read and write operations
  on the heap. An attacker who convinces a user to process a malicious compressed
  file with prezip-bin can trigger memory corruption, leading to a processs crash.\n\
  \n\n\nThis issue was fixed in commit 15b188437f9e0192d4ac4472ad66a4e2f62a782f which
  will be released in version 0.60.8.3."
