title: "Punk versions from 0.48 before 0.55 for Perl route Extended CONNECT requests
  to any GET route without an Origin check in ps_serve_one.\n\nOn HTTP/2 and HTTP/3
  a WebSocket handshake arrives as an Extended CONNECT, which is matched as a GET
  and so reaches every GET route, API operation and mount. The Origin check runs only
  when a websocket route matches. On this transport the handler's status is the handshake
  response, and a 2xx accepts it.\n\nA cross-origin page can open a WebSocket to any
  path and learn from its open or error event whether that path returns 2xx."
