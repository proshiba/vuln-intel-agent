title: The Download Manager plugin for WordPress is vulnerable to Sensitive 
  Information Exposure in all versions up to, and including, 3.3.71 via the 
  'first_name' parameter. This makes it possible for authenticated attackers, 
  with subscriber-level access and above, to extract the administrator's full 
  Cookie header, including wordpress_logged_in_* session cookies, from the 
  suspension email sent during the administrator's authenticated request, 
  enabling full session hijack and account takeover. Exploitation requires an 
  administrator to perform the Suspend action against the attacker's account, 
  which causes the plugin to synchronously compile and send the suspension email
  inside the administrator's authenticated HTTP request — making the 
  administrator's session cookies available to the template engine at send time.
