title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  Don't call skb_clone_and_charge_r() for close()d listener in tcp_v6_do_rcv().\n\n\
  tcp_v6_do_rcv() no longer calls skb_clone_and_charge_r() for\nTCP_LISTEN since commit
  073d89808c06 (\"net: fix data-races around\nsk->sk_forward_alloc\").\n\nHowever,
  there is still a small race window between tcp_v6_rcv()\nand tcp_v6_do_rcv(), where
  concurrent close() changes TCP_LISTEN\nto TCP_CLOSE, causing skb_clone_and_charge_r()
  to be called\nlocklessly and resulting in the splat below. [0]\n\nLet's avoid calling
  skb_clone_and_charge_r() for TCP_CLOSE as well.\n\nThis is fine for non-listeners
  because tcp_rcv_state_process()\ndrops skb for TCP_CLOSE and opt_skb was freed immediately
  anyway.\n\n[0]:\nsk->sk_forward_alloc\nWARNING: net/ipv4/af_inet.c:162 at inet_sock_destruct+0x64d/0x810
  net/ipv4/af_inet.c:162, CPU#1: ksoftirqd/1/28\nModules linked in:\nCPU: 1 UID: 0
  PID: 28 Comm: ksoftirqd/1 Not tainted 7.2.0 #17 PREEMPT(full)\nHardware name: QEMU
  Sta"
