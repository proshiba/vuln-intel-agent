title: "The Avada (Fusion) Builder plugin for WordPress is vulnerable to authorization
  bypass in all versions up to, and including, 7.16.1. This is due to the plugin not
  properly verifying authorization before dispatching a WordPress action hook whose
  name is taken from an attacker-supplied form-field value (via the notification email_message
  [field] placeholder and the {action_hook,...} dynamic-data token; the 3.16.1 trust
  gate is_content_request_supplied() only inspects $_POST['args']/$_GET['args'], never
  the $_POST['formData'] the public form-submit endpoint parses). This makes it possible
  for unauthenticated attackers to invoke arbitrary WordPress action hooks (multiple
  per request), causing state changes up to permanent, irreversible destruction of
  site content: a verified unauthenticated request permanently deleted trashed posts,
  pages, and comments via the core wp_scheduled_delete action. Other non-deny-listed
  hooks extend the impact to denial of service (e.g. wp_maybe_auto_update) and,"
