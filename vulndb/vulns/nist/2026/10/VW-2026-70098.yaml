title: A vulnerability was detected in crossplane crossplane-runtime up to 
  2.2.2/2.3.2. This vulnerability affects the function Get of the file 
  pkg/xpkg/client.go of the component ImageConfig. The manipulation results in 
  time-of-check time-of-use. The attack may be launched remotely. Upgrading to 
  version 2.2.3, 2.3.3 and 2.4.0-rc.1 is able to resolve this issue. The patch 
  is identified as bee99c6cd6ca81878acca2940a2f0a02169fc208. You should upgrade 
  the affected component.
