title: OneUptime is a solution for monitoring and managing online services. 
  Prior to version 10.0.34, the fix for CVE-2026-32306 (ClickHouse SQL injection
  via aggregate query parameters) added column name validation to the 
  _aggregateBy method but did not apply the same validation to three other query
  construction paths in StatementGenerator. The toSortStatement, 
  toSelectStatement, and toGroupByStatement methods accept user-controlled 
  object keys from API request bodies and interpolate them as ClickHouse 
  Identifier parameters without verifying they correspond to actual model 
  columns. ClickHouse Identifier parameters are substituted directly into 
  queries without escaping, so an attacker who can reach any analytics list or 
  aggregate endpoint can inject arbitrary SQL through crafted sort, select, or 
  groupBy keys. This issue has been patched in version 10.0.34.
