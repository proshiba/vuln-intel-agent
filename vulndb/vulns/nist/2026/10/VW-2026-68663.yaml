title: "MISP contains a stored cross-site scripting (XSS) vulnerability in the galaxy
  icon handling path. The icon field of a galaxy object was persisted without any
  server-side validation through the galaxy add, edit, and sync/import capture endpoints.
  The stored value was subsequently concatenated directly into HTML markup by the
  D3-based correlation graph rendering scripts (both the default and Overmind themes)
  using the .html() method.\n\nA user holding the perm_galaxy_editor permission, which
  is granted to the stock User role, could store arbitrary HTML or JavaScript in the
  icon field. Any other user who opened the correlation graph of an event containing
  a cluster belonging to that galaxy would have the injected script executed in their
  browser session.\n\nImpact:\n\n- Arbitrary script execution in the context of the
  victim's MISP session\n\n- Potential theft of session credentials, manipulation
  of displayed data, or initiation of actions on behalf of the victim\n\n- Affects
