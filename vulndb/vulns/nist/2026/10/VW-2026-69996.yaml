title: OpenAM before 16.1.3 contains a reflected cross-site scripting 
  vulnerability that allows unauthenticated attackers to inject script by 
  supplying crafted parameters rendered unencoded on the OAuth2 authorization 
  error page. Attackers can lure victims to a crafted /oauth2/authorize link 
  with repeated parameters to run JavaScript in the OpenAM origin, acting within
  existing sessions or redirecting to phishing pages.
