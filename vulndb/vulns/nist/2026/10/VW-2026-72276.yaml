title: Brocade Fabric versions before 9.2.2d and 10.0.0 through 10.0.0a1 
  handling of specific download protocols utilizes unsanitized parameter 
  strings. When processing upgrade requests, parameters are converted into 
  system command strings and executed through a system shell interface. Because 
  control characters and shell metacharacters in fields like the host or file 
  path are not stripped or sanitized, an attacker can execute arbitrary shell 
  commands with the firmware management daemon's elevated privileges.
