title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  mmp_pdma: fix wrong sg length in mmp_pdma_prep_slave_sg()\n\nIn mmp_pdma_prep_slave_sg(),
  for_each_sg() iterates the scatterlist\nputting each entry into 'sg', but the entry
  length is read from 'sgl'\n(the list head) instead of 'sg' (the current entry):\n\
  \n    for_each_sg(sgl, sg, sg_len, i) {\n        addr = sg_dma_address(sg);\n  \
  \      avail = sg_dma_len(sgl);   /* should be 'sg' */\n\nConsequently 'avail' is
  always the length of the first entry. For\nmulti-sg lists this causes out-of-bounds
  reads when a later entry is\nshorter than the first, and silent data loss when it
  is longer.\nSingle-sg or uniformly-sized lists happen to mask the issue."
