title: "A Command Injection vulnerability, resulting from improper file path sanitization
  (Directory Traversal) in Looker allows an attacker with Developer permission to
  execute arbitrary shell commands when a user is deleted on the host system.\n\n\
  Looker-hosted and Self-hosted were found to be vulnerable.\nThis issue has already
  been mitigated for Looker-hosted instances. No user action is required for these.\n\
  \nSelf-hosted instances must be upgraded as soon as possible. This vulnerability
  has been patched in all supported versions of Self-hosted.\nThe versions below have
  all been updated to protect from this vulnerability. You can download these versions
  at the Looker download page  https://download.looker.com/ :\n  *  24.12.100+\n \
  \ *  24.18.192+\n  *  25.0.69+\n  *  25.6.57+\n  *  25.8.39+\n  *  25.10.22+"
