title: Backstage is an open framework for building developer portals. Prior to 
  3.5.1, 3.6.2, 3.7.2, 3.8.2 and 3.9.1, the @backstage/plugin-catalog-backend 
  package is affected by improper url validation in catalog entity placeholder 
  resolution. An authenticated Backstage user could craft a catalog entity with 
  placeholder directives that reference resources outside the entity's source 
  repository. Under certain configurations, this could allow access to data not 
  intended to be available to the user. This issue is fixed in versions 3.5.1, 
  3.6.2, 3.7.2, 3.8.2 and 3.9.1.
