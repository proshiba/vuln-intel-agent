title: In HAProxy Data Plane API 2.2.0 through 3.4.3 (and corresponding 
  Enterprise Edition releases), Server.ConfigureAPI() has process-global 
  authentication logic that improperly drops security controls across multiple 
  transport types. When a TLS Certificate Authority (tls_ca) is configured and a
  numeric TLS port (tls_port) is specified, the application globally disables 
  Basic authentication on its shared internal request handler. Because this 
  handler is shared concurrently among HTTP, HTTPS, and UNIX domain socket 
  listeners, and mutual TLS (mTLS) client certificate verification 
  (tls.RequireAndVerifyClientCert) is enforced exclusively on the HTTPS server 
  path, all other simultaneously active non-mTLS listeners fail open. 
  Consequently, an unauthenticated attacker capable of reaching an affected HTTP
  or UNIX management endpoint can completely bypass credentials to gain full API
  administrative access. This allows unauthorized remote or local actors to read
