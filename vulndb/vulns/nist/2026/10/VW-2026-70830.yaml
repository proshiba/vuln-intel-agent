title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  atr: fix dangling adapter pointer on add failure\n\ni2c_atr_add_adapter() stores
  atr->adapter[chan_id] before\ni2c_add_adapter() so that the I2C bus notifier can
  match child clients\nduring registration. On failure the channel is freed but the
  slot was\nleft pointing at freed memory, which can lead to use-after-free in\ni2c_atr_del_adapter()
  / cleanup and also block reuse with -EEXIST.\n\nClear the slot on the i2c_add_adapter()
  error path before freeing chan."
