title: ezBookkeeping 1.2.0 before 2.0.1 contains a privilege escalation 
  vulnerability that allows attackers holding an API token to obtain a full 
  session token via /api/v1/tokens/refresh.json. Because TokenRefreshHandler 
  never checks token type, attackers can exchange short-lived or IP-restricted 
  API tokens for 30-day normal session tokens that bypass API token expiry and 
  allowlists.
