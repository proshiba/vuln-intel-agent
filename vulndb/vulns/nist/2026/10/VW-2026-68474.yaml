title: "MISP contains an improper input validation vulnerability in its ORM save path.
  When a user submits data through various endpoints (attribute add/edit, event edit,
  free-text import, sighting capture, shadow attribute proposal, event report creation,
  object reference add, user admin edit), the application sanitizes the flat record
  by stripping the primary key and pinning the event_id or object_id to the caller's
  context. However, the underlying ORM's set() method gives priority to a nested key
  whose name matches the model alias and discards the outer scalar fields.\n\nAn authenticated
  user with basic write permissions can exploit this by embedding a nested block under
  the model alias key inside their request. The sanitization logic (id removal, event_id
  pinning) is applied to the outer record, but the ORM binds to the inner record instead,
  which carries an attacker-chosen id and event_id. This allows the attacker to overwrite,
  re-parent, or soft-delete rows belonging to other organizations"
