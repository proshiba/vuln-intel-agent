title: The Alt Text AI – Automatically generate image alt text for SEO and 
  accessibility plugin for WordPress is vulnerable to authorization bypass in 
  all versions up to, and including, 1.10.41. This is due to the plugin not 
  properly verifying that a user is authorized to perform an action. This makes 
  it possible for authenticated attackers, with subscriber-level access and 
  above, to overwrite the post_content of any post or page on the site — 
  including content they do not own — with LLM-generated text influenced by 
  attacker-controlled keywords, enabling black-hat SEO manipulation and 
  unauthorized consumption of the site owner's paid AltText.ai API credits. The 
  nonce required to invoke the action is emitted on every admin page including 
  /wp-admin/profile.php, which is accessible to Subscribers, making the nonce 
  trivially obtainable by any authenticated user.
