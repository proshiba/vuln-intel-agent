title: Improper Neutralization of Special Elements used in an OS Command in the 
  integrate-platform-docs composite GitHub Action of Chainguard Academy (edu) 
  from commit 7375a80caabcc31c33ec90f29687ed78c13d16ff before commit 
  fb0efb2537d326ab18c07d620875b8ed2a4b39f3 allows an actor who controls the 
  project_id or storage_bucket inputs to execute arbitrary shell commands on the
  GitHub Actions runner, because the inputs are interpolated directly into Bash 
  gcloud storage cp commands in several steps via ${{ inputs.* }} expressions. 
  The only in-repository caller passed repository secrets and ran only on 
  trusted triggers, so no untrusted input was known to reach the vulnerable 
  steps.
