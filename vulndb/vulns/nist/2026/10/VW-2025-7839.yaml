title: 'Vulnerability in the Oracle Business Intelligence Enterprise Edition product
  of Oracle Analytics (component: Analytics Web Administration).  Supported versions
  that are affected are 7.6.0.0.0 and  8.2.0.0.0. Easily exploitable vulnerability
  allows high privileged attacker with network access via HTTP to compromise Oracle
  Business Intelligence Enterprise Edition.  Successful attacks require human interaction
  from a person other than the attacker and while the vulnerability is in Oracle Business
  Intelligence Enterprise Edition, attacks may significantly impact additional products
  (scope change). Successful attacks of this vulnerability can result in takeover
  of Oracle Business Intelligence Enterprise Edition. CVSS 3.1 Base Score 8.4 (Confidentiality,
  Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:H).'
