title: An arbitrary file download vulnerability in the web interface of Juniper 
  Networks Junos Space allows a network-based authenticated attacker using a 
  crafted GET method to access any file on the file system. Using specially 
  crafted GET methods, an attacker can gain access to files beyond the file path
  normally allowed by the JBoss daemon. These files could contain sensitive 
  information restricted from access by low-privileged users.This issue affects 
  all versions of Junos Space before 24.1R3.
