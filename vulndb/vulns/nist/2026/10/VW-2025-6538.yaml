title: A vulnerability was detected in SohuTV CacheCloud up to 3.2.0. The 
  affected element is the function 
  getExceptionStatisticsByClient/getCommandStatisticsByClient/doIndex of the 
  file 
  src/main/java/com/sohu/cache/web/controller/AppClientDataShowController.java. 
  The manipulation results in cross site scripting. The attack can be executed 
  remotely. The exploit is now public and may be used. The project was informed 
  of the problem early through an issue report but has not responded yet.
