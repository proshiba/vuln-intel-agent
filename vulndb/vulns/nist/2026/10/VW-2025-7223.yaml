title: Astro is a web framework. Prior to version 5.14.2, Astro reflects the 
  value in `X-Forwarded-Host` in output when using `Astro.url` without any 
  validation. It is common for web servers such as nginx to route requests via 
  the `Host` header, and forward on other request headers. As such as malicious 
  request can be sent with both a `Host` header and an `X-Forwarded-Host` header
  where the values do not match and the `X-Forwarded-Host` header is malicious. 
  Astro will then return the malicious value. This could result in any usages of
  the `Astro.url` value in code being manipulated by a request. For example if a
  user follows guidance and uses `Astro.url` for a canonical link the canonical 
  link can be manipulated to another site. It is theoretically possible that the
  value could also be used as a login/registration or other form URL as well, 
  resulting in potential redirecting of login credentials to a malicious party. 
