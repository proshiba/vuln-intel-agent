title: "This vulnerability exists in the Schmooze app due to the use of hardcoded
  credentials and cryptographic keys in the client application. An unauthenticated
  remote attacker could exploit this vulnerability by decompiling the distributed
  application package and extracting the embedded credentials and cryptographic keys.\n\
  \n\nSuccessful exploitation of this vulnerability could allow the attacker to gain
  unauthorized access to backend and cloud resources and forge client requests on
  the targeted system."
