  Architect (All versions < V2506.0001), Tecnomatix Plant Simulation (All 
  versions < V2504.0007). The SALT SDK is missing server certificate validation 
  while establishing TLS connections to the authorization server. This could 
  allow an attacker to perform a man-in-the-middle attack.
