title: A vulnerability was found in Wavlink NU516U1 M16U1_V240425. The impacted 
  element is the function sub_402D1C of the file /cgi-bin/wireless.cgi of the 
  component DeleteMac Page. Performing manipulation of the argument delete_list 
  results in command injection. The attack is possible to be carried out 
  remotely. The exploit has been made public and could be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
