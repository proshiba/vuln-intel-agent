title: LiquidJS is a Shopify / GitHub Pages compatible template engine in pure 
  JavaScript. Prior to 10.27.2, enabling ownPropertyOnly does not consistently 
  restrict inherited array indices because negative indexing, .first, .last, the
  first filter, the last filter, join, reverse, slice, compact, and for-loop 
  iteration can read prototype-provided elements outside readJSProperty(). An 
  attacker who can influence prototype state or inherited array-index data and 
  cause templates to render affected operations can disclose values that 
  ownPropertyOnly is expected to hide. Direct positive indexing and ordinary 
  object prototype reads are blocked, but the alternate array paths remain 
  affected. This issue is fixed in 10.27.2.
