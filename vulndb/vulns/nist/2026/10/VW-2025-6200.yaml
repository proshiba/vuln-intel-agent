title: A security flaw has been discovered in yourmaileyes MOOC up to 1.17. This
  affects the function subreview of the file mooc/controller/MainController.java
  of the component Submission Handler. Performing manipulation of the argument 
  review results in cross site scripting. The attack can be initiated remotely. 
  The exploit has been released to the public and may be exploited. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
