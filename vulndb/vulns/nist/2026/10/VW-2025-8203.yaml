title: The Tutor LMS Pro – eLearning and online course solution plugin for 
  WordPress is vulnerable to Insecure Direct Object Reference in all versions up
  to, and including, 3.8.3 due to missing validation on a user controlled key 
  when viewing and editing assignments through the tutor_assignment_submit() 
  function. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to view and edit assignment submissions of 
  other students.
