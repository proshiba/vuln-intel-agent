title: "MISP contains a validation flaw in its object synchronization logic. When
  a MISP Object is created without a description, it is stored correctly on the originating
  instance. However, when that object is replicated to another MISP instance via the
  sync mechanism, the receiving instance's validation rule rejects the object because
  the description field is empty. As a result, the receiving instance silently drops
  the object along with all of its associated attributes, leading to loss of threat-intelligence
  data.\n\nPreconditions:\n\n- Two or more MISP instances are configured to synchronize
  objects.\n\n- A user with object-creation privileges creates an object without supplying
  a description.\n\n- The object is subsequently synced to a peer instance.\n\nImpact:\n\
  \n- Valid objects and their attributes are silently discarded on receiving instances,
  causing data-integrity loss in the threat-intelligence pipeline.\n\n- The issue
