title: 'Axios Cache Interceptor is a cache interceptor for axios. Prior to version
  1.11.1, when a server calls an upstream service using different auth tokens, axios-cache-interceptor
  returns incorrect cached responses, leading to authorization bypass. The cache key
  is generated only from the URL, ignoring request headers like `Authorization`. When
  the server responds with `Vary: Authorization` (indicating the response varies by
  auth token), the library ignores this, causing all requests to share the same cache
  regardless of authorization. Server-side applications (APIs, proxies, backend services)
  that use axios-cache-interceptor to cache requests to upstream services, handle
  requests from multiple users with different auth tokens, and upstream services replies
  on `Vary` to differentiate caches are affected. Browser/client-side applications
  (single user per browser session) are not affected. Services using different auth
  tokens to call upstream services will return incorrect cached data, bypas'
