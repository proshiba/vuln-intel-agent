title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.38.0 through 0.70.5, EnumRepresentation.render_symbols
  concatenates each schema-controlled enum symbol between double quotes in a 
  generated enum assignment. When generator classes are used directly, a quote 
  can terminate the string literal and inject arbitrary Python code into the 
  enum class body, which executes when the generated module is imported. Version
  0.70.6 fixes the vulnerability by escaping enum symbol values before rendering
  them.
