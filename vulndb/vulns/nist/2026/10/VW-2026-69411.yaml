title: PictShare before version 3.7.1 contains a weak randomness vulnerability 
  where the getRandomString() function uses the non-cryptographic rand() PRNG to
  generate the delete_code authorization token in src/inc/core.php. Attackers 
  can predict or infer the PRNG state to guess valid delete_code values and 
  perform unauthorized deletion of hosted files without needing to read the code
  from the info endpoint.
