title: 'A vulnerability has been found in HBAI-Ltd Toonflow-app up to 1.1.8. This
  affects an unknown function of the component exportData Endpoint. Such manipulation
  leads to information disclosure. An attack has to be approached locally. The exploit
  has been disclosed to the public and may be used. Upgrading to version 2.0.0 mitigates
  this issue. It is advisable to upgrade the affected component. The vendor explains:
  "The report targets ToonFlow version 1.1.8. The current release is 2.0.4, which
  is the result of a substantial architectural refactor; the code paths referenced
  in the report do not apply to the current version. The report does not describe
  a vulnerability in any supported release."'
