title: Gitea Actions blocks the jobs of workflow runs from first-time fork pull 
  request contributors until a maintainer approves the run. The rerun path only 
  required a run to be finished and built the new attempt's jobs without 
  considering the pending approval, so when a user with Actions write access 
  cancelled a run that was awaiting approval and then re-ran it, the new jobs 
  were created as waiting rather than blocked while the run still recorded that 
  approval was required. Cancelling and re-running stale fork checks is a 
  routine action that does not involve the approval control, so where Actions is
  enabled and a matching runner is registered, workflow code taken from the fork
  pull request head could run on the repository's runners without an explicit 
  approval.
