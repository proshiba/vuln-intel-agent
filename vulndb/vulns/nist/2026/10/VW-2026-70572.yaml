title: Joplin is an open source note-taking and to-do application that organises
  notes and lists into notebooks. Prior to Joplin Server 3.7.2, 
  packages/server/src/models/TokenModel.ts stores CSRF, account-confirmation, 
  email-change, and password-reset tokens without a purpose, and 
  packages/server/src/models/UserModel.ts allows UserModel.resetPassword to 
  accept any token returned by TokenModel.userFromToken. An attacker who obtains
  a victim's CSRF or confirmation token through a separate disclosure channel 
  can submit it to the public password-reset endpoint, replace the victim's 
  password, and cause the existing sessions and API applications to be deleted. 
  This issue is fixed in Joplin Server 3.7.2.
