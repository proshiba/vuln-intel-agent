title: Parsl is a Python parallel scripting library. A SQL Injection 
  vulnerability exists in the parsl-visualize component of versions prior to 
  2026.01.05. The application constructs SQL queries using unsafe string 
  formatting (Python % operator) with user-supplied input (workflow_id) directly
  from URL routes. This allows an unauthenticated attacker with access to the 
  visualization dashboard to inject arbitrary SQL commands, potentially leading 
  to data exfiltration or denial of service against the monitoring database. 
  Version 2026.01.05 fixes the issue.
