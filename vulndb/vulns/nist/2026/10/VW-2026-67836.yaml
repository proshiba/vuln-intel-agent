title: "Use After Free vulnerability was discovered in fs/vfs/fs_rename code of the
  Apache NuttX RTOS, that due recursive implementation and single buffer use by two
  different pointer variables allowed arbitrary user provided size buffer reallocation
  and write to the previously freed heap chunk, that in specific cases could cause
  unintended virtual filesystem rename/move operation results.\n\nThis issue affects
  Apache NuttX RTOS: from 7.20 before 12.11.0.\n\nUsers of virtual filesystem based
  services with write access especially when exposed over the network (i.e. FTP) are
  affected and recommended to upgrade to version 12.11.0 that fixes the issue."
