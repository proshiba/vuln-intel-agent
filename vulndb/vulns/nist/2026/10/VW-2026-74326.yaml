title: "Nango is an open-source platform for connecting agents and products to third-party
  APIs. Prior to 0.70.9, on accounts with RBAC enabled through a plan with has_rbac=true,
  two private flow-read routes, GET /api/v1/integrations/:providerConfigKey/flows
  and GET /api/v1/flow/:flowName, apply webAuth but omit can({ action: 'read', resource:
  'flow', scopedBy: envScope }). A same-team user with the development_full_access
  role can therefore request env=prod and read production integration flow metadata
  or named flow configuration despite being denied by guarded production routes. Both
  controllers use res.locals.environment from the authenticated account, so the issue
  bypasses the production role boundary but does not cross tenant boundaries. This
  issue is fixed in version 0.70.9 and managed-1.5.11-0.70.8-aae30d044d7e229807d51a3957c212f3fb689e1a"
