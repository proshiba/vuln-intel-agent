title: "An incomplete list of disallowed inputs in Amazon Agent Plugins for AWS databases-on-aws
  plugin before 1.7.1 might allow a remote unauthenticated actor to execute arbitrary
  operating system commands on the host running the helper via a crafted database
  command value introduced in the agent context.\n\n\n\nTo remediate this issue, users
  should upgrade to databases-on-aws plugin version 1.7.1 or later and verify that
  the updated plugin is active in each environment where it is used."
