title: GitAhead through 2.7.1 contains an OS command injection vulnerability in 
  src/git/Filter.cpp that allows malicious repositories to execute commands by 
  substituting crafted filenames into clean/smudge filter commands. Attackers 
  can ship files named with $(command) selected via .gitattributes so checkout 
  or staging runs the command through bash -c as the victim.
