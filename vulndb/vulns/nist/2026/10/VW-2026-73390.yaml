title: 'A vulnerability was determined in Studio-Saelix Sencho up to 0.94.1. This
  vulnerability affects unknown code of the file outboundTarget.ts of the component
  git-sources Browse API Endpoint. Executing a manipulation of the argument repo_url
  can lead to server-side request forgery. The attack may be performed from remote.
  The exploit has been publicly disclosed and may be utilized. The presence of this
  vulnerability remains uncertain at this time. This patch is called 79b86ddcd4aefdd6941f098e35990ab397b13c72.
  It is advisable to implement a patch to correct this issue. The vendor explains:
  "Git repository access is an intentional, privileged administrative function. Sencho
  explicitly supports repositories hosted on private LAN, VPC, VPN, CGNAT, and IPv6
  ULA networks. The report does not demonstrate a privilege-boundary bypass or access
  by an unprivileged user. We therefore dispute the CVE characterization of this behavior.
  As defense in depth, we have nevertheless hardened repository acces'
