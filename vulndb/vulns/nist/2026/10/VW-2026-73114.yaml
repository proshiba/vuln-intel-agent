title: Strapi 5.47.0 through 5.57.0 contains an improper authorization 
  vulnerability that allows admin API tokens to retain all-field Content Manager
  access after the owner's role is field-restricted. Because 
  reconcileTokenPermissionsToUserCeiling ignores token permissions with omitted 
  or null fields, token holders can keep reading content fields an administrator
  removed from the role.
