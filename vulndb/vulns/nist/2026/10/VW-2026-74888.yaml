title: Gotify server is a simple server for sending and receiving messages in 
  real-time per WebSocket. Prior to 3.0.0, the password change endpoint (POST 
  /current/user/password) accepts a valid client token without requiring the 
  account's current password or another elevated authentication step. An 
  attacker who obtains a client token can set a new password for the associated 
  user, taking control of password authentication and forcing account recovery 
  through an administrator or direct database access. This issue is fixed in 
  version 3.0.0.
