title: "The `insights-operator-gather` ClusterRole grants the operator's service account
  read access to secrets in the core API group with no namespace or resourceNames
  restriction — therefore, access to every secret in every namespace in the cluster.\n\
  \nRef: https://github.com/openshift/insights-operator/blob/8f15e3157ff09f54ab22801f5b21da35a195cc6d/manifests/03-clusterrole.yaml#L368-L373\n\
  ```\n- apiGroups:\n  - \"\"\n  resources:\n  - secrets\n  verbs:\n  - get\n  - list\n\
  ```\n\nBy spawning a pod with the gather service account mounted, an attacker will
  be able to access any secret in any namespace.\n\n```\nspec:\n serviceAccountName:\"\
  gather\"\n```"
