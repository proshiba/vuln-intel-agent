title: "In the Linux kernel, the following vulnerability has been resolved:\n\naf_unix:
  Unify scc_index when finalising SCC in __unix_walk_scc().\n\nCommit bfdb01283ee8
  (\"af_unix: Assign a unique index to SCC.\")\nchanged Tarjan's algorithm to update
  lowlink with lowlink,\nwhich is called lowpoint (unix_vertex.scc_index).\n\nunix_vertex_dead()
  assumes all vertices in an SCC share the same\nlowpoint, but this is not always
  true if an SCC has two or more\nback edges, depending on the order of DFS.\n\nFor
  example, the graph below has two back edges from B to A\nand from C to B.\n\n  A
  --> B --> C\n  ^    | ^    |\n  `----' `----'\n\nIf DFS walks through A -> B ->
  C -> B (-> C -> B) -> A (-> B -> A),\neach index and scc_index will be updated as
  follows.\n\n  A --> B --> C    C = (3, 3)  (index, scc_index)\n                \
  \   B = (2, 2)\n                   A = (1, 1)\n\n  A ... B ... C    C = (3, 2)<-.\n\
  \         ^    |    B = (2, 2) -'\n         `----'    A = (1, 1)\n\n  A ... B ...
  C    C = (3, 2)\n  ^    | .    .    B = (2, 1)<"
