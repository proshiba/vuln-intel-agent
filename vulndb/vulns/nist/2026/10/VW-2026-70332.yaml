title: Plane is an open-source project management tool. Prior to 1.4.0, the fix 
  for CVE-2026-27706 and GHSA-jcc6-f9v6-f7jw, an SSRF in work-item link 
  unfurling shipped in v1.2.2, remains incomplete in the v1.3.1 GA release. Any 
  authenticated project member can make the server fetch attacker-selected 
  internal targets, including cloud metadata at 169.254.169.254, and read the 
  response body returned as the link title or favicon. Complete hardening exists
  on main in PR 9163 but was not included in an earlier released tag. This issue
  is fixed in 1.4.0.
