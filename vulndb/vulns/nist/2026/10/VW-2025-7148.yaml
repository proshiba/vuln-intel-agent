title: Newforma Info Exchange (NIX) stores credentials  used to configure NPCS 
  in 'HKLM\Software\WOW6432Node\Newforma\<version>\Credentials'. The credentials
  are encrypted but the encryption key is stored in the same registry location. 
  Authenticated users can access both the credentials and the encryption key. If
  these are Active Directory credentials, an attacker may be able to gain access
  to additional systems and resources.
