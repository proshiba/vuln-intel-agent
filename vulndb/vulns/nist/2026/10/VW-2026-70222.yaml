title: "This vulnerability allows remote attackers to delete sensitive files on vulnerable
  installations of Mitel MiVoice Office 400. Authentication is required to exploit
  this vulnerability.\n\n\n\n\nThe specific flaw exists within the web portal listening
  on TCP port 443, under Maintenance → File Management → File Browser, which is affected
  by a directory traversal vulnerability. By exploiting this vulnerability, an authenticated
  attacker can access and delete files outside of the intended directory, including
  files belonging to the Mitel application and the underlying Linux system. Deleting
  critical system or application files can result in a denial-of-service condition
  affecting the underlying system."
