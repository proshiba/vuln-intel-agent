  before 5.0.306 might allow local users to recover an IAM user's cleartext AWS Management
  Console password from command output and log artifacts.\n\n\n\nTo remediate this
  issue, users should upgrade to version 5.0.306 or later. After upgrading, review
  PowerShell transcripts and log stores for previously disclosed passwords and rotate
