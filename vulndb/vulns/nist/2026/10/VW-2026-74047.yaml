title: FreeRDP 3.0.0 before 3.32.0 contains an integer truncation vulnerability 
  in license_check_stream_length that allows a malicious RDP server to trigger a
  heap buffer overflow on 32-bit clients. Attackers can send a crafted 
  SERVER_LICENSE_REQUEST with a large scopeCount that bypasses length checks, 
  causing out-of-bounds writes leading to denial of service or remote code 
  execution.
