title: 'A security flaw has been discovered in Tencent WeKnora 0.1.0. This impacts
  the function testEmbeddingModel of the file /api/v1/initialization/embedding/test.
  The manipulation of the argument baseUrl results in server-side request forgery.
  The attack can be launched remotely. The exploit has been released to the public
  and may be exploited. It is advisable to upgrade the affected component. The vendor
  responds: "We have confirmed that the issue mentioned in the report does not exist
  in the latest releases".'
