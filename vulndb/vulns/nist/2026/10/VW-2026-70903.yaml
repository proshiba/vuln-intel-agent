title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btintel_pcie: fix off-by-one bounds check in RX submit\n\nbtintel_pcie_submit_rx()
  used frbd_index > rxq->count to guard the\nFRBD array access, allowing frbd_index
  == rxq->count to pass through\nand index one element past the end of the array.
  Change the check to\n>= rxq->count so every out-of-range index is rejected.\n\n\
  This issue was reported by Claude Mythos."
