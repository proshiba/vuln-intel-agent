title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  manage XDP program pointers during channel resize\n\nveth_set_channels() tears down
  XDP resources for removed RX queues\nwithout clearing rq->xdp_prog.  If the program
  is then detached or\nreplaced, those queues keep the old pointer after bpf_prog_put().\n\
  A later channel increase can re-enable NAPI and run the freed program.\n\n  BUG:
  unable to handle page fault for address: ffffc90000256048\n  Oops: Oops: 0000 [#1]
  SMP KASAN NOPTI\n  RIP: veth_xdp_rcv_skb (include/linux/filter.h:779\n         \
  \                include/net/xdp.h:696 drivers/net/veth.c:820)\n  Call Trace:\n\
  \   veth_xdp_rcv (drivers/net/veth.c:941)\n   veth_poll (drivers/net/veth.c:986)\n\
  \   __napi_poll (net/core/dev.c:7787)\n   net_rx_action (net/core/dev.c:7850 net/core/dev.c:8007)\n\
  \   handle_softirqs (kernel/softirq.c:645)\n  Kernel panic - not syncing: Fatal
  exception in interrupt"
