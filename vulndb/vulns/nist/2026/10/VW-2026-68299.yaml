title: U-Boot before 2026.10-rc3 with CONFIG_IP_DEFRAG enabled contains an 
  out-of-bounds write vulnerability in the __net_defragment() function in 
  net/net.c. Remote attackers can send a crafted IP fragment with non-zero 
  offset and More-Fragments flag set during netboot to corrupt adjacent memory 
  and crash the bootloader.
