title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  p54: validate curve data length in the calibration curve converters\n\np54_convert_rev0()
  and p54_convert_rev1() read calibration curve\ndata from the device-supplied EEPROM
  entry using channel and\npoints-per-channel counts taken verbatim from that same
  entry, so\nan entry that declares more data than it carries drives an\nout-of-bounds
  read past the EEPROM buffer (verified with a KASAN\nreproducer of the conversion
  loop). The sibling converters\np54_convert_output_limits() and p54_convert_db()
  already validate\ntheir counts against the entry length; this path was missed.\n\
  \nReject the entry when the counts do not fit in the entry data."
