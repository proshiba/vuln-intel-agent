title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  the saveDeptRolePermission endpoint of SysDepartPermissionController that 
  allows any authenticated user to modify department role permissions. 
  Low-privileged attackers can submit roleId and permissionIds values to grant 
  arbitrary menu or button permissions, escalating privileges or revoking other 
  users' permissions.
