title: "A Looker user with a Developer role could create a database connection using
  IBM DB2 driver and, by manipulating LookML, cause Looker to execute a malicious
  command, due to inadequate filtering of the driver's parameters.\n\nLooker-hosted
  and Self-hosted were found to be vulnerable.\nThis issue has already been mitigated
  for Looker-hosted instances. No user action is required for these.\n\n\nSelf-hosted
  instances must be upgraded as soon as possible. This vulnerability has been patched
  in all supported versions of Self-hosted.\nThe versions below have all been updated
  to protect from this vulnerability. You can download these versions at the Looker
  download page  https://download.looker.com/ :\n  *  25.0.93+\n  *  25.6.84+\n\n\
