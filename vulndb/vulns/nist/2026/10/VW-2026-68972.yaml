title: pypdf is a free and open-source pure-python PDF library. Prior to 6.18.1,
  a crafted PDF containing a partially malformed /FlateDecode stream with padded
  data can force pypdf/filters.py to use inefficient byte-by-byte decompression 
  while the earlier recovery counter fails to advance for bytes that 
  successfully decode, causing long runtimes and application unavailability. 
  This is a residual issue after the malformed FlateDecode recovery fix. This 
  issue is fixed in version 6.18.1.
