title: The Redux Framework plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via User Meta Merge via 'user-mediaurl' Media Field in 
  all versions up to, and including, 4.5.14 due to insufficient input 
  sanitization and output escaping. This makes it possible for authenticated 
  attackers, with Subscriber-level access and above, to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  This is exploitable by Subscriber-level users who can store a payload in user 
  meta fields such as the biography, session_tokens (via a crafted User-Agent at
  login), or persisted_preferences (via the REST API), which are then promoted 
  to the site-wide redux_demo option when a media URL repair is triggered on the
  demo panel.
