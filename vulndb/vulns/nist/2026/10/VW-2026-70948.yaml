title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: don't offload TC setup on AP_VLAN interfaces\n\nAP_VLAN interfaces are
  purely virtual, so don't try to offload\nTC setup to drivers. We can't really use
  the AP interface either\nsince we may not know it all the time, and it could technically\n\
  even change.\n\nJust reject the TC offload so things get done in software."
