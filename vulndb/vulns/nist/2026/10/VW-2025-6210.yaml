title: A vulnerability was found in PX4 PX4-Autopilot up to 1.16.0. Affected by 
  this issue is the function 
  MavlinkLogHandler::state_listing/MavlinkLogHandler::log_entry_from_id of the 
  file src/modules/mavlink/mavlink_log_handler.cpp. The manipulation results in 
  stack-based buffer overflow. The attack is only possible with local access. 
  The patch is identified as 338595edd1d235efd885fd5e9f45e7f9dcf4013d. It is 
  best practice to apply a patch to resolve this issue.
