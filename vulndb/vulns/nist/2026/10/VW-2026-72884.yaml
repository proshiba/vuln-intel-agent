title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, the MariaDB view
  FRM parser did not safely encode embedded newline characters in a username. An
  account with CREATE USER and CREATE VIEW WITH GRANT OPTION could create a 
  crafted username containing additional view metadata, causing the parser to 
  interpret part of the username as security metadata and potentially escalating
  database privileges. This issue is fixed in versions 10.6.28, 10.11.19, 
  11.4.13, 11.8.9, 12.3.3, and 13.0.2.
