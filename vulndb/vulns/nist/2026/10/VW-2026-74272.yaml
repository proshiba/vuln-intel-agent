title: Vercel deepsec from 0.1.0 before 1.1.17 contains a link following 
  vulnerability in extractTarballLocally that allows sandboxed code to write 
  files outside the sandbox by planting links in result tarballs. Attackers 
  controlling sandbox code, such as a prompt-injected coding agent, can plant 
  symbolic or hard links in the host data directory to write arbitrary files on 
  the orchestrator host.
