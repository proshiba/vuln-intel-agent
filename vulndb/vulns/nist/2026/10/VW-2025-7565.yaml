title: The External Login plugin for WordPress is vulnerable to sensitive 
  information exposure in all versions up to, and including, 1.11.2 due to the 
  'exlog_test_connection' AJAX action lacking capability checks or nonce 
  validation. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to query the configured external database 
  and retrieve truncated usernames, email addresses, and password hashes via the
  diagnostic test results view.
