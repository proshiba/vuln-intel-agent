title: Kiteworks Core before version 9.5.0 is vulnerable to Stored Cross-Site 
  Scripting. A stored cross-site scripting (XSS) weakness in Kiteworks Core 
  could allow an authenticated user to submit content that, when later viewed by
  another user, executes arbitrary JavaScript in that user's authenticated 
  session. This could be used to perform actions on the victim's behalf and may 
  have permitted account takeover, including of higher-privileged users. 
  Exploitation requires the victim to view the attacker-supplied content.
