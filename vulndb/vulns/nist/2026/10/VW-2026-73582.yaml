title: "The Goodix GT9xx input driver in drivers/input/input_gt911.c reads the touch
  point count from the controller's status register and masks it with GT911_TOUCH_POINTS_MSK
  (0x0F), yielding a value of 0..15. In gt911_process() that value is used directly
  as the loop bound for filling point_reg[], a stack array sized to CONFIG_INPUT_GT911_MAX_TOUCH_POINTS,
  whose Kconfig range is 1..5 with a default of 1. No other check constrains the count;
  the driver relied only on a comment asserting that the controller had been programmed
  at init to report no more points than configured.\n\nEach loop iteration issues
  an I2C read of eight bytes straight into point_reg[i], so a controller that reports
  more points than the array holds causes up to 112 bytes of peer-supplied data to
  be written past the end of the array, over the stack frame of gt911_process() in
  the system workqueue thread. Two further loops then read out of bounds from the
