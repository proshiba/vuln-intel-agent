title: A vulnerability has been found in krupalshah EmployeeRecruitmentSystem up
  to 922ff6d208278282e7c8e36d70d9ae356adec9fe. Affected by this issue is the 
  function mysql_query of the file source/authprocessing.php of the component 
  Forgot Password Handler. Such manipulation of the argument fpemail leads to 
  sql injection. The attack can be launched remotely. The exploit has been 
  disclosed to the public and may be used. This product does not use versioning.
  This is why information about affected and unaffected releases are 
  unavailable. The vendor was contacted early about this disclosure but did not 
  respond in any way. This vulnerability only affects products that are no 
  longer supported by the maintainer.
