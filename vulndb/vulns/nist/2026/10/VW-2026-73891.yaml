title: "An incorrect authorization vulnerability in the WinBox\nauthentication flow
  of MikroTik RouterOS allows a remote authenticated attacker\nwith credentials for
  a low-privilege account permitted to use WinBox to obtain\nthe authorization policy
  of a different existing account. The stage-one EC-SRP\nchallenge and proof are verified
  using the attacker's account, while the\nindependently supplied stage-two username
  is used to install the target\naccount's privileges. By specifying a higher-privilege
  account such as admin, a\nlow-privilege user can obtain a full administrative session
  without knowing the\ntarget account's password and can use that session to increase
  the privileges\nof the attacker's own account."
