title: Fire-Boltt BSW013 smartwatch firmware through V0.0.8 contains a missing 
  authentication vulnerability that allows unpaired attackers to inject 
  notifications by writing to the proprietary BLE command characteristic. 
  Attackers within Bluetooth range can craft commands protected only by a 
  CRC-16/ARC checksum to vibrate the watch and display spoofed alert text for 
  phishing.
