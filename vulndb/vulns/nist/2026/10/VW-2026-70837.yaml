title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/shrinker:
  fix bogus set_shrinker_bit() with cgroup.memory=nokmem\n\nWith cgroup.memory=nokmem,
  shrinker_memcg_alloc() bails out early and\nnever allocates an id, so shrinker->id
  keeps the 0 it got from the\nkzalloc() in shrinker_alloc().  __list_lru_init() then
  copies that 0 into\nlru->shrinker_id, where it looks like a valid bit index.\n\n\
  Nothing calls expand_shrinker_info() on nokmem either, so shrinker_nr_max\nstays
  0 and every memcg ends up with an empty map (map_nr_max == 0).\n\ndeferred_split_folio()
  hands a real memcg to __list_lru_add() regardless\nof whether the lru is memcg aware,
  so the first THP queued in a cgroup\ndoes set_shrinker_bit(memcg, nid, 0) and trips
  the bounds check:\n\nWARNING: mm/shrinker.c:212 at set_shrinker_bit+0x7d/0x90, CPU#126\n\
  Call Trace:\n <TASK>\n deferred_split_folio+0x18c/0x220\n map_anon_folio_pmd_nopf+0xdd/0x130\n\
  \ map_anon_folio_pmd_pf+0x14/0xb0\n do_huge_pmd_anonymous_page+0x1a1/0x620\n __handle_"
