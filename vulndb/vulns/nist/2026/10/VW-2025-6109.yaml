title: A vulnerability has been found in shanyu SyCms up to 
  a242ef2d194e8bb249dc175e7c49f2c1673ec921. This issue affects the function 
  addPost of the file 
  Application/Admin/Controller/FileManageController.class.php of the component 
  Administrative Panel. The manipulation leads to code injection. The attack is 
  possible to be carried out remotely. The exploit has been disclosed to the 
  public and may be used. This product adopts a rolling release strategy to 
  maintain continuous delivery The project was informed of the problem early 
  through an issue report but has not responded yet. This vulnerability only 
  affects products that are no longer supported by the maintainer.
