title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  psp: avoid conflicts with skb->decrypted and sk_validate_xmit_skb()\n\nPSP conflicts
  with TLS ULP in its usage of both skb->decrypted and\nsk->sk_validate_xmit_skb().\n\
  \nMake PSP mutually exclusive with TLS ULP, the only other user of either\nof these.
  As other users of skb->decrypted come along, they can be added\nto sk_has_decrypt_user().
  It would make sense to also assert that\nsk->sk_validate_xmit_skb() is also NULL
  in both of these setup paths for\nsimilar future proofing, but the PSP listener/sk_clone()
  path is still\nbroken and it could be seen as a regression to not allow rx assoc
  to run\non a child of a listener socket with PSP tx assoc state.\n\nInclude all
  TCP ULPs in the sk_has_decrypt_user() check, even though TLS\nis the only one that
  conflicts with PSP via the decrypted bit. This is\nintentional because PSP was not
  designed to be used with ULPs. It is\nbest to close off surface area that may make
