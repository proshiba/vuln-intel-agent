title: Privasys rustls is a maintained fork of the rustls TLS library that adds 
  RA-TLS challenge and channel-binding support. Prior to privasys-v0.8.1, the 
  fork emitted RA-TLS challenge certificates whose quote ReportData was bound to
  the certificate public key and client nonce but not to the active TLS session.
  An attacker who obtained an enclave TLS private key could relay a genuine 
  quote onto another connection, causing a relying party to accept an 
  attacker-terminated connection as the attested enclave. This issue is fixed in
  privasys-v0.8.1.
