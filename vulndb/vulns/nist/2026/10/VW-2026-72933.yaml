title: Enclave OS Mini is a Rust-based runtime for confidential applications 
  inside Intel SGX enclaves. Prior to wasm-v0.40.0, the SGX runtime's RA-TLS 
  challenge certificate path placed the certificate public-key hash and client 
  nonce in quote ReportData but omitted a value bound to the active TLS session.
  An attacker who obtained an enclave TLS private key could relay a genuine 
  quote onto another connection, causing a relying party to accept an 
  attacker-terminated connection as the attested enclave. This issue is fixed in
  wasm-v0.40.0.
