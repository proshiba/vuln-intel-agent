title: 'The Image Photo Gallery Final Tiles Grid WordPress plugin before 3.6.14 does
  not sanitise several gallery configuration values that can be overridden through
  its gallery shortcode before printing them into an inline script block, allowing
  users with contributor-level access and above to inject arbitrary JavaScript that
  executes in the session of anyone viewing the post, including an administrator previewing
  a pending submission. No gallery ownership is required: any gallery that already
  exists on the site can be referenced.'
