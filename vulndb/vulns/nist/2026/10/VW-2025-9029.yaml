title: The Import WP – Export and Import CSV and XML files to WordPress plugin 
  for WordPress is vulnerable to Sensitive Information Exposure in all versions 
  up to, and including, 2.14.17 via the import/export functionality and a lack 
  of .htaccess protection. This makes it possible for unauthenticated attackers 
  to extract sensitive data from exports stored in /exportwp and import data 
  stored in /importwp.
