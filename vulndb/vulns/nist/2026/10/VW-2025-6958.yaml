title: Multiple stack-based buffer overflow vulnerabilities exist in the 
  formPingCmd functionality of Planet WGR-500 v1.3411b190912. A specially 
  crafted series of HTTP requests can lead to stack-based buffer overflow. An 
  attacker can send a series of HTTP requests to trigger these 
  vulnerabilities.This buffer overflow is related to the `submit-url` and 
  `ipaddr` request parameters combined.
