title: The affected code used child_process.execSync with a shell string for 
  generator installation and uninstallation. This allowed an attacker to execute
  arbitrary OS commands with the developer's privileges by manipulating the 
  ApplicationWizard.installationLocation VS Code workspace configuration value. 
  Because the value was passed directly to the shell without sanitisation, a 
  malicious workspace repository could craft a settings.json that injects OS 
  commands when a developer opens the project and triggers a generator 
  installation.
