title: Backstage is an open framework for building developer portals. Prior to 
  1.14.6, the @backstage/plugin-techdocs-node package is affected by remote code
  execution via crafted markdown_extensions in techdocs mkdocs.yml. An 
  authenticated user who can register catalog entities can provide a crafted 
  mkdocs.yml causing arbitrary OS command execution on the TechDocs build host 
  when the docs are built. This issue is fixed in versions 1.14.6 and 1.15.4.
