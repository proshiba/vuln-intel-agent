title: "Backstage is an open framework for building developer portals. Prior to 1.15.4,
  the @backstage/plugin-techdocs-node package is affected by potential file exposure
  through local techdocs publisher. When using the local TechDocs publisher (techdocs.publisher.type:
  'local'), it was possible for the documentation serving endpoint to follow filesystem
  references outside the intended documentation tree, potentially exposing host files
  to authenticated users. This is mitigated by the fact that exploration requires
  preconditions that do not arise through normal MkDocs operation. Cloud-based publishers
  (S3, GCS, Azure Blob Storage) are not affected. This issue is fixed in version 1.15.4."
