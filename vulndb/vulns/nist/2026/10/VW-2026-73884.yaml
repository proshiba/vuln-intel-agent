title: A SQL Injection (SQLi) affects the Kong Gateway (Enterprise and Open 
  Source) clustering communication logic when operating in Hybrid Mode. The 
  issue can be triggered by sending specially crafted RPC requests to the 
  Control Plane (CP), leading to potential unauthorized database access. 
  Leveraging the issue requires network access to the Control Plane’s clustering
  port and a valid client certificate and key.
