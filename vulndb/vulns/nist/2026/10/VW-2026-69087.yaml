title: The Redux Framework plugin for WordPress is vulnerable to authorization 
  bypass in all versions up to, and including, 4.5.14 This is due to the plugin 
  not properly verifying that a user is authorized to perform an action. This 
  makes it possible for authenticated attackers, with subscriber-level access 
  and above, to delete arbitrary media library attachments, including 
  administrator-owned files, from the affected site. This is exploitable by 
  Subscribers when a Custom Fonts field is registered on the user profile page 
  via Redux_Users::set_profile(), as doing so causes the required 
  redux_custom_fonts nonce to be rendered into the Subscriber's 
  wp-admin/profile.php page.
