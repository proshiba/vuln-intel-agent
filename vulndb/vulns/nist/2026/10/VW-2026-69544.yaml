title: The JetFormBuilder — Dynamic Blocks Form Builder plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via 'choice' Post Meta via 
  Insert/Update Post Action in all versions up to, and including, 3.6.5.4 due to
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. The injected payload 
  is submitted via the unauthenticated wp_ajax_nopriv_jet_form_builder_submit 
  endpoint, stored verbatim into post meta through the Insert/Update Post 
  action, and later rendered unescaped by the Select Field block template when 
  the get_from_db option generator copies raw meta values into option value 
  attributes and label content.
