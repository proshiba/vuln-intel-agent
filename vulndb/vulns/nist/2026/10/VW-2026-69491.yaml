title: Missing cryptographic step in the DSTU 7624 CCM mode implementation 
  (KCcmBlockCipher) in Legion of the Bouncy Castle Inc. bc-csharp before 2.7.0 
  allows an attacker who can observe encrypted messages of known or chosen 
  content to forge ciphertexts with valid authentication tags, via messages 
  encrypted without associated data. The cause is that the G1 block, which binds
  the nonce, the message length and the parameter flags into the CBC-MAC, was 
  processed only when associated data was present. Without associated data the 
  tag was a CBC-MAC of the plaintext alone, independent of the nonce. Only 
  applications that use KCcmBlockCipher directly and supply no associated data 
  are affected.
