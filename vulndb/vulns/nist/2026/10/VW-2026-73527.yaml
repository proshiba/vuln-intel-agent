title: A security flaw has been discovered in zhayujie CowAgent up to 2.1.7. 
  Impacted is an unknown function of the file channel/web/web_channel.py of the 
  component Web Console. The manipulation of the argument session_id results in 
  denial of service. The attack may be performed from remote. The exploit has 
  been released to the public and may be used for attacks. Version 2.1.7 (commit
  dec28324) only partly mitigates via a 512MB body cap. The vendor was contacted
  early about this disclosure.
