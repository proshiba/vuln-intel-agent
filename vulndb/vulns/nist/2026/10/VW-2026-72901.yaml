title: Contao is an Open Source CMS. From version 4.0.0 until 5.3.50 and 5.7.12,
  ModuleSearch can disclose protected page titles, URLs, and indexed context 
  snippets to unauthenticated visitors when contao.search.index_protected is 
  changed from enabled to disabled. Authorization metadata is stored per row in 
  tl_search, but disabling the setting removes the protected-row filter without 
  deleting rows indexed while protection was enabled. The protected pages 
  continue to return an authorization response, so this issue exposes search 
  metadata and indexed text rather than bypassing page access. This issue is 
  fixed in versions 5.3.50 and 5.7.12.
