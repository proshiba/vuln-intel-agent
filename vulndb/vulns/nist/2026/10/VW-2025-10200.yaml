title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: udc: fix use-after-free in usb_gadget_state_work\n\nA race condition during
  gadget teardown can lead to a use-after-free\nin usb_gadget_state_work(), as reported
  by KASAN:\n\n  BUG: KASAN: invalid-access in sysfs_notify+0x2c/0xd0\n  Workqueue:
  events usb_gadget_state_work\n\nThe fundamental race occurs because a concurrent
  event (e.g., an\ninterrupt) can call usb_gadget_set_state() and schedule gadget->work\n\
  at any time during the cleanup process in usb_del_gadget().\n\nCommit 399a45e5237c
  (\"usb: gadget: core: flush gadget workqueue after\ndevice removal\") attempted
  to fix this by moving flush_work() to after\ndevice_del(). However, this does not
  fully solve the race, as a new\nwork item can still be scheduled *after* flush_work()
  completes but\nbefore the gadget's memory is freed, leading to the same use-after-free.\n\
  \nThis patch fixes the race condition robustly by introducing a 'teardown'\nflag
  and a 'state_lock' spinloc"
