title: "Authenticated users are able to manipulate both the SMTP\nenvelope “Envelope-from”
  and “From” fields when sending\nemails through OVH mail servers.\n\n\n\nDue to OVH's
  default SPF configuration, which\ncommonly includes include:mx.ovh.com, any authenticated
  user with a\nvalid OVH email account can send messages that appear to originate
  from any\nOVH-hosted domains using the default SPF record. Since the SPF policy\n\
  explicitly authorizes OVH mail servers (mx.ovh.com) to send mail on behalf of\n\
  these domains, forged messages successfully pass SPF validation despite\nnot being
  authorized by the impersonated domain owner."
