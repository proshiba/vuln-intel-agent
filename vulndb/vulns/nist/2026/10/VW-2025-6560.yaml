title: 'A vulnerability was identified in Portabilis i-Diario 1.5.0. The affected
  element is an unknown function of the file app/uploaders/doc_uploader.rb of the
  component justificativas-de-falta Endpoint. Such manipulation of the argument Anexo
  leads to cross site scripting. The attack can be launched remotely. The exploit
  is publicly available and might be used. The name of the patch is 6c529bb2d96130aa29533f49e204e86518e11fdd.
  It is best practice to apply a patch to resolve this issue. The vendor confirms:
  "The attachment uploader now rejects files whose declared content type indicates
  executable or markup content".'
