title: Gradle is a build tool with a focus on build automation. In versions 
  prior to 7.2, start scripts generated by the `application` plugin and the 
  `gradlew` script are both vulnerable to arbitrary code execution when an 
  attacker is able to change environment variables for the user running the 
  script. This may impact those who use `gradlew` on Unix-like systems or use 
  the scripts generated by Gradle in thieir application on Unix-like systems. 
  For this vulnerability to be exploitable, an attacker needs to be able to set 
  the value of particular environment variables and have those environment 
  variables be seen by the vulnerable scripts. This issue has been patched in 
  Gradle 7.2 by removing the use of `eval` and requiring the use of the `bash` 
  shell. There are a few workarounds available. For CI/CD systems using the 
  Gradle build tool, one may ensure that untrusted users are unable to change 
  environment variables for the user that executes `gradlew`. If one is unable 
