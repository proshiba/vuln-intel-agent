title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  fix compat ALLOCSPI request use-after-free\n\nxfrm_state_netlink() builds the ALLOCSPI
  response with\ndump_one_state(), which already calls alloc_compat() with the response\n\
  skb and header.\n\nxfrm_alloc_userspi() then calls alloc_compat() again, but passes
  the\noriginal request skb and its header. For a compat request, the\ntranslator
  therefore interprets the 228-byte compat xfrm_userspi_info\nas the 232-byte native
  layout and reads four bytes past the declared\npayload. It also publishes the translated
  child through the request's\nfrag_list.\n\nA multicast clone of the request shares
  skb_shared_info and can observe\nthat child. xfrm_user_rcv_msg() frees it after
  the request handler\nreturns, racing a compat receiver which may still be copying
  from it and\nresulting in a use-after-free.\n\nRemove the redundant conversion.
  The response keeps its correct compat\ntranslation from dump_one_state(), and no
  child is attached to the\ninb"
