title: GetSimple CMS is a content management system (CMS), and GetSimple CMS CE 
  is the community edition of that CMS. Prior to version 1.5, the update handler
  in UpdateCE.php downloads a ZIP archive and extracts its contents into the web
  root without validating file types or extraction paths. Because PHP files are 
  written into a web-accessible directory, an attacker who can cause a malicious
  archive to be processed achieves remote code execution as the web-server user.
  Entry names are also used unsafely, allowing directory traversal (../) to 
  write files outside the intended extraction directory. This issue has been 
  patched in version 1.5.
