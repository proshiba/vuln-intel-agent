title: "MISP contains a vulnerability in its one-time password (OTP) authentication
  flow that allows replay of a consumed HOTP (paper) token and rewinding of the token
  counter.\n\nThe HOTP verification logic compared the submitted token against a counter
  value that was cached in the user's session at the time the password was entered,
  rather than against the authoritative counter stored in the database. Because the
  session-cached counter is not updated after a token is successfully consumed, an
  attacker who holds a valid session (password already submitted) can reuse a previously
  burned HOTP token. The stale cached counter still matches the replayed token, granting
  a second successful authentication and effectively rewinding the counter state.\n\
