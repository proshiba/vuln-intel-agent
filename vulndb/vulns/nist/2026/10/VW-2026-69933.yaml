title: The WPC Smart Quick View for WooCommerce plugin for WordPress is 
  vulnerable to Reflected Cross-Site Scripting via the 'woosq-redirect' 
  parameter in all versions up to, and including, 4.4.0 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. The WooCommerce "redirect to cart after add to cart" 
  option must be enabled for the filter that reads the woosq-redirect parameter 
  to execute; however, the ?quick-view= auto-open mechanism means no further 
  user interaction beyond loading the crafted URL is required to trigger script 
  execution.
