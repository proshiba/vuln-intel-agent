title: The Post Export Import with Media plugin for WordPress is vulnerable to 
  Directory Traversal in all versions up to, and including, 1.17.1 via the 
  'file_path' parameter parameter. This makes it possible for authenticated 
  attackers, with administrator-level access and above, to read the contents of 
  arbitrary files on the server, which can contain sensitive information. This 
  requires the attacker to upload a crafted ZIP archive containing a 
  media_metadata.json file with path traversal sequences in the file_path field 
  while specifying an allowed file extension for the destination filename to 
  bypass the extension guard introduced in version 1.13.2.
