title: The Cryptocurrency (Token), Launchpad (Presale), ICO & IDO, Airdrop by 
  TokenICO plugin for WordPress is vulnerable to unauthorized modification of 
  data due to a missing capability check on the 'saveDeployedContract' function 
  in all versions up to, and including, 2.4.7. This makes it possible for 
  authenticated attackers, with Subscriber-level access and above, to overwrite 
  the WordPress option `tokenico_deployed_contracts`, poisoning the smart 
  contract addresses displayed.
