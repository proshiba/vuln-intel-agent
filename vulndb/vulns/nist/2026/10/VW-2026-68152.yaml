title: "An Exposure of Sensitive Information to an Unauthorized Actor vulnerability
  exists in Apache DolphinScheduler.\n\nThis vulnerability may allow unauthorized
  actors to access sensitive information, including database credentials.\n\n\nThis
  issue affects Apache DolphinScheduler versions 3.1.*.\n\n\nUsers are recommended
  to upgrade to:\n\n\n\n\n\n\n\n  *  version ≥ 3.2.0 if using 3.1.x\n\n\n\n\n\n\n\
  As a temporary workaround, users who cannot upgrade immediately may restrict the
  exposed management endpoints by setting the following environment variable:\n\n\n\
  ```\nMANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,prometheus\n```\n\n\
  Alternatively, add the following configuration to the application.yaml file:\n\n\
  \n```\nmanagement:\n   endpoints:\n     web:\n        exposure:\n          include:
  health,metrics,prometheus\n```\n\nThis issue has been reported as CVE-2023-48796:\n\
  \n https://cveprocess.apache.org/cve5/CVE-2023-48796"
