title: A command injection vulnerability exists in the h-ui (version v0.0.25 and
  below) administrative API due to improper validation of the listen 
  configuration field. When an authenticated administrator submits a value 
  containing shell metacharacters, the application constructs nftables/iptables 
  rule strings using fmt.Sprintf and executes them via bash -c as root. Because 
  the listen field lacks port or format validation, arbitrary OS commands can be
  injected and executed with root privileges.
