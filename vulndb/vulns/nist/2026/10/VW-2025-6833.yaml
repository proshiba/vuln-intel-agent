title: The WDesignKit – Elementor & Gutenberg Starter Templates, Patterns, Cloud
  Workspace & Widget Builder plugin for WordPress is vulnerable to missing 
  authorization via the wdkit_handle_review_submission function in versions less
  than, or equal to, 1.2.16. This is due to the plugin not properly verifying 
  that a user is authorized to perform an action. This makes it possible for 
  unauthenticated attackers to submit feedback data to external services.
