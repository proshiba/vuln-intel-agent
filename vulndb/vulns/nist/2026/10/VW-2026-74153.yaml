title: MONAI 1.2.0 before 1.6.1 contains an insecure deserialization 
  vulnerability in nnUNetV2Runner that unpickles the postprocessing_file path 
  read from inference_information.json without confining it to the results 
  directory. Attackers who can modify inference_information.json can point it at
  a malicious pickle elsewhere on the filesystem to execute code when 
  predict_ensemble_postprocessing runs.
