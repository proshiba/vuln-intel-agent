title: Metabase is an open source business intelligence and analytics platform. 
  From 1.55.0 until 1.58.16, 1.59.13, 1.60.9, and 1.61.4, native queries and 
  actions against an H2 data source are passed through without restricting 
  host-facing built-in functions. A user authorized to run native queries or 
  actions can invoke FILE_READ, FILE_WRITE, CSVREAD, CSVWRITE, or LINK_SCHEMA to
  read or write arbitrary files on the Metabase server or link other databases. 
  The default sample database uses H2, so the vulnerable surface is exposed by 
  default. This issue is fixed in versions 1.58.16, 1.59.13, 1.60.9, and 1.61.4.
