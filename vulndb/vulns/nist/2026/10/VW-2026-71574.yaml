title: A flaw was found in SSSD (System Security Services Daemon). When Identity
  Provider (IdP) authentication is enabled, pre-authentication requests retain 
  state in memory without being cleared or timed out. A local attacker can 
  repeatedly initiate authentication flows without completing them, causing 
  unbounded memory consumption. This memory exhaustion can lead to a Denial of 
  Service (DoS) by degrading or terminating SSSD authentication services.
