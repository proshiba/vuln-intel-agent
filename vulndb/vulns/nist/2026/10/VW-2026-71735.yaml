title: "ieee802154_decipher_data_frame() in subsys/net/l2/ieee802154/ieee802154_frame.c
  computed payload_len = net_pkt_get_len(pkt) - ll_hdr_len - authtag_len without first
  checking that the received frame is at least ll_hdr_len + authtag_len bytes long.
  All three variables are uint8_t, so a frame whose payload is shorter than the configured
  authentication tag makes the subtraction wrap around to a large value (up to 255).\n\
  \nThe wrapped length is passed unchanged to ieee802154_decrypt_auth() and on to
  the CCM operation as cipher_pkt.in_len/out_buf_max, with apkt->tag pointing at frame
  + ll_hdr_len + payload_len. Because the receive buffer is allocated to the exact
  length of the frame received from the radio driver, the crypto layer then reads
  several hundred bytes past the end of the packet buffer and writes the same number
  of decrypted bytes back over it in place. The frame's authentication tag is only
  verified after this processing has taken place, so no key material, association
  or prior aut"
