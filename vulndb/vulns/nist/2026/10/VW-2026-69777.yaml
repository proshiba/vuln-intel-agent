title: Nx is a monorepo solution for TypeScript and polyglot codebases. From 
  14.6.0 until 22.7.9 and 23.1.2, Nx creates Unix domain sockets for its daemon 
  and isolated plugin workers in shared temporary locations without owner-only 
  directory and socket permissions. Another unprivileged local account on a 
  shared build server, developer host, or multi-user container can discover and 
  connect to a running socket because the transport performs no authentication 
  and relies on filesystem containment. The daemon's PROCESS_IN_BACKGROUND 
  request accepts a module path and invokes its default export, allowing a 
  caller that controls a file to execute code as the account running Nx; other 
  handlers can expose workspace file contents, project graphs, and task hashes. 
  Disabling the daemon alone does not remove the vulnerable plugin-worker 
  sockets, while single-user machines without another local account are not 
  exposed. This issue is fixed in versions 22.7.9 and 23.1.2.
