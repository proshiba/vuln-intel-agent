title: A flaw was found in the clevis PKCS#11 pin. The 
  clevis-pkcs11-afunix-socket-unlock daemon crashes when an AF_UNIX client 
  connects to the data socket without a bound address, due to an integer 
  underflow in the getpeername result handling. This causes a denial of service,
  preventing LUKS disk decryption from completing during boot.
