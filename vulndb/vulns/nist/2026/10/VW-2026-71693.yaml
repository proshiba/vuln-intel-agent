title: A flaw was found in pulp-rpm when it publishes a distribution tree. Addon
  and variant ids from .treeinfo are used as directory names. A user who can 
  sync or upload that tree can make the publish task create a new directory 
  outside the task work area and write that tree's repository metadata and 
  packages there, as the Pulp worker user. An existing file or directory is not 
  replaced. The flaw does not disclose data and does not stop the service.
