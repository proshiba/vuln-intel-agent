title: The Mang Board plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via the 'data_type' parameter in all versions up to, and including, 
  2.4.2 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. This is 
  exploitable on any board configured with the default write_level=0 (guest 
  posting) and editor_type=N settings, which are the out-of-the-box defaults for
  newly created boards.
