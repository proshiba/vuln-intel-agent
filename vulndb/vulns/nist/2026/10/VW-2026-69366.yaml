title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to version 1.0.8.6, a flawed 
  central path sanitizer lets an authenticated admin-panel user who holds backup
  access (default role site_admin or higher) read and delete arbitrary files on 
  a server. An attacker can recover database credentials from config/db.php, 
  read host files such as /etc/passwd, and delete config/db.php to push a site 
  back into install mode for a full takeover. This issue has been patched in 
  version 1.0.8.6.
