title: The Geliver Akıllı Kargo Pazaryeri WordPress plugin before 3.1.1 does not
  prevent unauthenticated access to a log file it stores within its own 
  web-accessible directory, into which it writes the site's carrier integration 
  key while processing requests from unauthenticated users, allowing attackers 
  to retrieve the key and use it to modify WooCommerce order statuses. The same 
  log file also exposes customer information from orders the shop has processed.
