  Integration and Intelligence, an attacker could store malicious content that 
  is later rendered by the application. If an authenticated victim accesses a 
  page that displays this stored content, the injected input is processed during
  web page generation, resulting in the execution of malicious content in the 
  victim�s browser context. This could allow the attacker to access or modify 
  information within the victim�s browser scope. Successful exploitation could 
  allow the attacker to access session information, modify rendered page content
  and disrupt the victim's use of the application, resulting in a low impact on 
  confidentiality, integrity and availability.
