title: A vulnerability was found in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. Affected by this vulnerability is an
  unknown functionality of the file Admin/getclinic.php of the component AJAX 
  Endpoint. The manipulation of the argument city/cid results in sql injection. 
  The attack can be executed remotely. The exploit has been made public and 
  could be used. This product implements a rolling release for ongoing delivery,
  which means version information for affected or updated releases is 
  unavailable. The project was informed of the problem early through an issue 
  report but has not responded yet.
