title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rtrs:
  guard against null kobj name\n\nIn the client, if `init_path()` errors, the callee
  tries to clean up\nwith `rtrs_clt_close_conns()`. However, this can lead to calling
  the\nevent tracing code with `clt_path->kobj->name` being `NULL` and thus\ncausing
  a null pointer dereference when trying to copy from it.\n\nThis just adds a guard
  to check that the name is not `NULL` before\ncopying from it. The server appears
  to have a similar pattern."
