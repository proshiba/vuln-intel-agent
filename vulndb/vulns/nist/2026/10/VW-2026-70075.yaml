title: A security vulnerability has been detected in RainyGao DocSys up to 
  2.02.85. The affected element is the function DocController.doGetTmp of the 
  file /Doc/doGetTmpFile.do of the component Document Controller. The 
  manipulation of the argument path/fileName leads to path traversal. Remote 
  exploitation of the attack is possible. The exploit has been disclosed 
  publicly and may be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
