title: A flaw was found in SSSD. When configured to evaluate password expiration
  warnings before restrictive access rules in LDAP (Lightweight Directory Access
  Protocol) environments, an expired-password warning terminates rule evaluation
  early and treats the access request as successful. A remote authenticated user
  with an expired password using an alternative authentication method, such as 
  SSH public key authentication, can exploit this flaw to bypass access control 
  restrictions and gain unauthorized access to protected systems.
