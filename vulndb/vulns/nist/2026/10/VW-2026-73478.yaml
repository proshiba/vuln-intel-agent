title: Plastic Labs Honcho through 3.3.0 contains an incorrect authorization 
  vulnerability that allows peer- or session-scoped API key holders to read 
  workspace data because get_or_create_workspace checks only the workspace 
  claim. Attackers can submit their parent workspace name to the POST 
  /v3/workspaces endpoint to retrieve workspace metadata and configuration, 
  including custom_instructions, reserved for workspace or admin keys.
