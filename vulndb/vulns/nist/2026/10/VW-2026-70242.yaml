title: A flaw has been found in feelec-yishu feelcrm-os 1.0.0. Affected is an 
  unknown function of the file 
  App/Feelcrm/Crm/Controller/AjaxRequestController.class.php of the component 
  getMemberByGroups Endpoint. This manipulation of the argument groups[] causes 
  sql injection. The attack is possible to be carried out remotely. The exploit 
  has been published and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
