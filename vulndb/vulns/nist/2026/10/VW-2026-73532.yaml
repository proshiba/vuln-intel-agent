title: Company Research Agent through 2.2.0 contains a server-side request 
  forgery vulnerability that allows unauthenticated attackers to trigger 
  outbound requests by injecting unescaped ReportLab paragraph markup into the 
  /generate-pdf endpoint. Attackers can embed inline img elements in 
  report_content to make the server fetch internal or external hosts, leaking 
  image responses in returned PDFs and probing reachability.
