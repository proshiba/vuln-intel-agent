title: The Schema & Structured Data for WP & AMP WordPress plugin before 1.67 
  does not perform a capability check when saving several of its fields, nor 
  escape them when outputting them back, allowing users with the editor role and
  above to inject arbitrary web scripts that execute when a higher privileged 
  user views the affected screen. This is only exploitable on multisite 
  installs, where editors do not hold the unfiltered_html capability.
