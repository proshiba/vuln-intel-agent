title: A vulnerability was found in krupalshah EmployeeRecruitmentSystem up to 
  922ff6d208278282e7c8e36d70d9ae356adec9fe. This affects the function 
  mysql_query of the file source/adminregister.php of the component Registration
  Handler. Performing a manipulation results in sql injection. The attack may be
  initiated remotely. The exploit has been made public and could be used. This 
  product uses a rolling release model to deliver continuous updates. As a 
  result, specific version information for affected or updated releases is not 
  available. The vendor was contacted early about this disclosure but did not 
  respond in any way. This vulnerability only affects products that are no 
  longer supported by the maintainer.
