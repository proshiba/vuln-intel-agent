title: A vulnerability has been found in Linux Mint Xreader up to 4.6.9. 
  Impacted is the function g_file_get_child of the file shell/ev-window.c of the
  component PDF Attachment Saving Handler. Such manipulation of the argument 
  attachment leads to path traversal. The attack may be performed from remote. 
  The exploit has been disclosed to the public and may be used. One of the 
  project maintainers closed this issue as "completed", because "EPUB support 
  was removed from Xreader and reimplemented in Xepub". Code analysis indicates 
  that this might be a misunderstanding of the situation.
