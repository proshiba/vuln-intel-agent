title: Improper link resolution and external control of file paths in the 
  administrative command-line operations of hMailServer.exe in Progressive Robot
  hMailServer 6.3.4 and 6.3.5 allow a local attacker who already runs code as 
  the low-privilege service account to escalate privilege. On Windows, 
  operations run with administrator rights by the installer, DBSetup, the 
  Control Panel or an administrator wrote log entries and crash records into the
  log folder, created, deleted and changed the permissions of the self-signed 
  certificate and private key in the data folder, and rewrote message files in 
  the data folder, all by path in folders the service account (NT 
  SERVICE\hMailServer, the default for new installations since 6.3.4) can 
  modify, following junctions and mount points; and the store-maintenance 
  operations reached files by names taken from the database, which the service 
