title: Quasar Framework is a framework for building high-performance Vue.js user
  interfaces. From 1.0.0 until 3.3.0, @quasar/app-vite recursively removed the 
  resolved build.distDir before building without rejecting the project root, 
  user home directory, filesystem roots, or symlink-resolved external 
  directories. An unsafe trusted configuration can delete data writable by the 
  build user before compilation begins. No attacker-controlled input reaches 
  build.distDir by default, so exploitation requires compromised or less-trusted
  automation to influence build configuration, or a developer to run a mistaken 
  configuration. This issue is fixed in version 3.3.0.
