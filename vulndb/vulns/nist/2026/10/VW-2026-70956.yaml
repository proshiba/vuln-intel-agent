title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  Fix device kref underflow in dma_chan_put()\n\ndma_chan_get() takes chan->device->ref
  only on the slow path:\n\n\t/* no kref on fast path */\n\tif (chan->client_count)
  {\n\t\t__module_get(owner);\n\t\tchan->client_count++;\n\t\treturn 0;\n\t}\n\tif
  (!try_module_get(owner))\n\t\treturn -ENODEV;\n\tif (!dma_device_get(chan->device))
  { // calls kref_get_unless_zero()\n\ndma_chan_put() drops the ref unconditionally,
  so every fast-path\nget/put pair drops one extra device reference.\n\nThe bug fires
  when two conditions hold together: a non-private\nprovider has a persistent client
  holding chan->client_count > 0\nand another client cycles dmaengine_get()/dmaengine_put().\n\
  When the kref hits zero, the subsequent dma_find_channel() returns\nNULL even though
  the provider module is still loaded.\n\nFix this by dropping device->ref only on
  the last put, matching the\nsingle slow-path get."
