title: Improper authentication in a Kiteworks Email Protection Gateway 
  administrative service. An administrative service in Kiteworks Email 
  Protection Gateway did not consistently enforce administrator authentication, 
  so the required password check could be bypassed. An attacker who referenced a
  valid administrator account could potentially create, modify, or delete 
  internal users and managed domains and change their security-feature 
  configuration without authenticating; deleting a managed domain also removes 
  its user accounts and could lock administrators out of the gateway.
