title: "DigitalCanion has discovered a stored Cross-Site Scripting (XSS) vulnerability
  that allows an authenticated malicious user to inject persistent JavaScript or HTML
  content into the web application.\n\n\n\n\nThe specific flaw exists within the web
  portal listening on TCP port 443, under Configuration → Domains, specifically in
  the “Description” field. The application fails to properly validate or sanitize
  user-supplied input before storing and subsequently rendering the field.\n\n\n\n\
  \nBy injecting malicious JavaScript into the Description field, an attacker can
  modify the content and behavior of the affected page when it is viewed by other
  users. This could allow an attacker to alter the page's appearance, display attacker-controlled
  content, or construct convincing phishing scenarios within the application's trusted
  web context."
