title: Open Computer Use through 1.0.0 on macOS contains an improper case 
  sensitivity handling vulnerability that allows local MCP callers to bypass the
  password-manager denylist using case-variant bundle identifiers. Attackers, 
  including prompt-injected model turns, can pass identifiers like 
  com.1Password.1Password to get_app_state and action tools to read 
  accessibility trees, capture screenshots, and drive unlocked password manager 
  interfaces.
