title: The Molongui Authorship – Author Boxes, Guest Authors & Co-Authors for 
  WordPress plugin for WordPress is vulnerable to Stored DOM-Based Cross-Site 
  Scripting via the 'comment (href attribute inside comment content)' parameter 
  in all versions up to, and including, 5.2.12 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. This is exploitable in the free build 
  because the plugin's author-filter rewriter never appends the ?m_bm=true 
  marker to its own anchors (Plugin::has_pro() returns false), meaning every 
  href the byline script selects and rewrites is fully attacker-controlled.
