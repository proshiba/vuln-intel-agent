title: The ShopLentor – WooCommerce Builder for Elementor & Gutenberg +21 
  Modules – All in One Solution plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'button_exist_text' parameter in the 
  'wishsuite_button' shortcode in all versions up to, and including, 3.2.4 due 
  to insufficient input sanitization and output escaping. This makes it possible
  for authenticated attackers, with Contributor-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page.
