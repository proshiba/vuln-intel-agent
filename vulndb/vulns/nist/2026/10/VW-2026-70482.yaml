title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, assemble-chunks retrieves an upload session using only its session ID,
  while upload-chunk correctly scopes the lookup to the authenticated profile. 
  An authenticated user who obtains another user's live, completed 
  upload-session UUID can assemble the victim's chunks into the attacker's own 
  file, team font, or project import, disclosing the uploaded bytes and deleting
  the victim's pending session. This issue is fixed in version 2.18.0.
