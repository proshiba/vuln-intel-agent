title: A flaw was found in SSSD. In trust-enabled identity management 
  environments, SSSD evaluates Host-Based Access Control (HBAC) rules by 
  stripping domain qualifiers and comparing only short usernames. An 
  authenticated user in a trusted domain who shares the same username as an 
  authorized local account can bypass access policies and gain unauthorized 
  access to protected services or hosts.
