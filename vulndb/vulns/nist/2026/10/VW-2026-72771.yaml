title: "In Apache CXF, STSTokenValidator checks whether a SAML assertion is signed
  by a trusted certificate before deciding to send it to the STS. That result was
  stored in one object shared by all requests, so one request could read another's
  result. A remote, unauthenticated attacker could send a forged assertion signed
  with an untrusted certificate while legitimate requests were being processed, and
  it could be accepted as trusted without ever reaching the STS. Only services that
  use STSTokenValidator to validate SAML tokens without alwaysValidateToSts set are
  affected. \nUsers are recommended to upgrade to versions 4.2.4 or 4.1.9 or 3.6.13,
  which fix this issue."
