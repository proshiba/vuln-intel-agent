title: LMCache multiprocess mode, also called distributed mode, opens an 
  unauthenticated ZeroMQ ROUTER so worker processes can register and share KV 
  cache blocks. Messages on that socket are msgpack. Extension code 1 is passed 
  to DeviceIPCWrapper.Deserialize, which calls pickle.loads, while the server is
  still decoding request arguments and before the handler runs. A single 
  unauthenticated ZMQ DEALER message to the transport port (default 5555) 
  therefore executes code as the user the LMCache process runs as. Official 
  container images run that process as root. The transport binds to localhost 
  unless the operator sets a routable address with --host, which is how 
  multi-node deployments let peers connect.
