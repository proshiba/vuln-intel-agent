title: 'In Bouncy Castle for Java before 1.86, a truncated OpenPGP encrypted message
  was accepted with no error reported, and on the SEIPD version 1 path with no integrity
  check performed at all. RFC 9580 sec. 13.7 permits an implementation to release
  the cleartext of the fully authenticated chunks when streaming but requires it to
  indicate a clear error as soon as the truncation is detected, and to report suspect
  integrity when it discovers malleable ciphertext. The truncation was detected and
  then discarded: when a message is truncated but the length field of the enclosing
  packet is left unchanged, BCPGInputStream.PartialInputStream raises an EOFException
  for the missing ciphertext, and BCPGInputStream.nextPacketTag() reports an EOFException
  as a clean end of message, so the packet stream above it stopped as though no packets
  remained. On the AEAD path (SEIPD version 2 and the version 5 AEAD packet), when
