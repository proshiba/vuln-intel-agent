title: stream-json is a micro-library of stream components for processing JSON 
  and JSONC with a minimal memory footprint. Prior to 3.6.0, the JSONC parser at
  stream-json/jsonc/parser.js and verifier at stream-json/jsonc/verifier.js 
  restart comment-terminator scanning from the opening slash whenever a block or
  line comment spans an input chunk, while retaining the accumulated comment 
  buffer. Delivering a large valid comment across many small chunks therefore 
  causes quadratic CPU work and can stall the Node.js event loop. The maintainer
  characterizes the attack vector as local because the documented JSONC input is
  locally owned or user-controlled configuration, rather than input intended for
  the open internet. This JSONC-only scope does not include the plain JSON 
  parser, which advances through and discards consumed string and number data. 
  This issue is fixed in version 3.6.0.
