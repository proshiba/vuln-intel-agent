title: A vulnerability has been found in jackq XCMS up to 
  3fab5342cc509945a7ce1b8ec39d19f701b89261. Affected is the function Upload of 
  the file Admin/Home/Controller/ProductImageController.class.php of the 
  component Backend. Such manipulation of the argument File leads to 
  unrestricted upload. It is possible to launch the attack remotely. The exploit
  has been disclosed to the public and may be used. This product takes the 
  approach of rolling releases to provide continious delivery. Therefore, 
  version details for affected and updated releases are not available. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
