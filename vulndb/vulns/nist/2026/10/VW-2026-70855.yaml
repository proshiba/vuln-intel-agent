title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-buf/dma-fence:
  fix checking signaling bit for timeline and driver name v3\n\nThe patch \"dma-buf:
  dma-fence: Fix potential NULL pointer dereference\"\nchanged the check to test for
  the ops pointer instead of the signaled\nbit to avoid a potential NULL dereference
  when the ops pointer has been\ncleared.\n\nThe problem is now that the ops pointer
  is cleared only when neither the\nrelease nor the wait callback is implemented and
  this isn't true for a lot\nof dma_fence implementations yet. So those implementations
  lost the RCU\nprotection after signaling of the returned string resulting in potential\n\
  use after free.\n\nAdd the signaling check additional to the ops pointer check so
  that we\nhave both the protection against NULL dereference as well as the RCU\n\
  protection after signaling for the returned string.\n\nv2: improve comments to note
  RCU protection and explain why we check\n    both signaling state and ops pointer\n\
  v3: some comment"
