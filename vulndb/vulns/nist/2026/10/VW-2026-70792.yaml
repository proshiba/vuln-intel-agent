title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm:
  RCU-free the scheduler-containing ring and VM objects\n\nBoth struct msm_ringbuffer
  and struct msm_gem_vm embed a struct\ndrm_gpu_scheduler.  msm_ringbuffer_destroy()
  and the VM free callback\nmsm_gem_vm_free() call drm_sched_fini() on the embedded
  scheduler and then\nfree the containing object with plain kfree().\n\ndrm_sched_fence_get_timeline_name()
  returns fence->sched->name, and the\nscheduler fence keeps a .release callback so
  it is not ops-detached on\nsignalling.  A finished fence exported to userspace (the
  submit out-fence, or\na VM_BIND fence, via sync_file / drm_syncobj) keeps pointing
  at the embedded\nscheduler after the ring/VM is freed, so a later get_timeline_name()
  --\nreachable unprivileged through SYNC_IOC_FILE_INFO -- dereferences freed slab\n\
  memory (KASAN slab-use-after-free read).\n\nPer the dma-fence lifetime contract
  the exporter must keep the data backing a\nsignalled fence alive for an RCU grace
  peri"
