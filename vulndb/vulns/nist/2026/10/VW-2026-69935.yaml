title: The GeoDirectory plugin for WordPress is vulnerable to SQL Injection via 
  the stored latitude/longitude coordinates of a listing in versions up to, and 
  including, 2.8.186. This is due to insufficient escaping and the absence of 
  numeric validation on coordinate values when a listing is saved, combined with
  the direct string interpolation of those values into a distance sub-expression
  in geodir_gps_query_part() that is later executed by the public 
  wp_ajax_nopriv_geodir_widget_listings handler when a caller supplies 
  set_post=<pending-listing-id> and sort_by=distance_asc. This makes it possible
  for authenticated attackers, with Subscriber-level access and above, to append
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database.
