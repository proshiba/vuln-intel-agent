title: obsidian-tc is a governed, agent-ready Model Context Protocol server for 
  Obsidian vaults. Prior to 1.3.1, the Streamable HTTP transport does not 
  validate the Host or Origin header or enable DNS-rebinding protection. When 
  the documented loopback configuration uses auth.mode set to none, a malicious 
  web page can send requests to the local MCP endpoint and receive unrestricted 
  vault access through the http-local caller. Version 1.3.1 fixes the 
  vulnerability by enabling host, origin, and DNS-rebinding validation.
