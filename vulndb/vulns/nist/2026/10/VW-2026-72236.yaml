title: Multiple stack-based buffer overflow vulnerabilities exist in the REST 
  API management component of Brocade Fabric OS versions prior to 10.0.1. When 
  processing API request payloads (such as device configuration attributes or 
  port mapping requests) the REST API service fails to properly validate 
  incoming array counts and string lengths against internal buffer capacities. 
  An authenticated attacker with REST API access can transmit crafted, oversized
  request parameters to induce memory corruption on the execution stack. This 
  may result in a denial-of-service condition (daemon crash) or potential 
  arbitrary code execution within the management process context.
