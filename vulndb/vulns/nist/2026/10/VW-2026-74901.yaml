title: An insufficient input validation vulnerability in the website blocking 
  feature (Block Sites) of the listed NETGEAR router models allows a 
  network-adjacent attacker having network access (such as WiFi credentials) to 
  run unauthorized commands on the router. This vulnerability could affect the 
  confidentiality, integrity, and availability of the affected router. It 
  applies only when the Block Sites feature is turned on.
