title: A vulnerability was detected in linlinjava litemall up to 1.8.0. This 
  affects an unknown part of the file 
  litemall-admin-api/src/main/java/org/linlinjava/litemall/admin/web/AdminAuthController.java
  of the component Login Endpoint. The manipulation results in improper 
  restriction of excessive authentication attempts. The attack may be performed 
  from remote. A high complexity level is associated with this attack. It is 
  indicated that the exploitability is difficult. The exploit is now public and 
  may be used. The project was informed of the problem early through an issue 
  report but has not responded yet.
