title: pypdf is a free and open-source pure-python PDF library. Prior to 6.18.1,
  a crafted PDF can place unusually large source-code or destination-string 
  tokens in a font /ToUnicode mapping, causing pypdf/_cmap.py parse_bfchar to 
  decode and retain oversized values during operations such as text extraction 
  and consume excessive memory. This is a second follow-up to earlier /ToUnicode
  resource-consumption fixes and is limited to the remaining token-length path. 
  This issue is fixed in version 6.18.1.
