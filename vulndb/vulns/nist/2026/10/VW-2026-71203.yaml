title: The RabbitMQ Java client library allows Java and JVM-based applications 
  to connect to and interact with RabbitMQ nodes. Prior to 5.35.0, 
  ConnectionFactoryConfigurator.load() includes the raw uri value in wrapped 
  exceptions when AMQP URI parsing fails. Because the URI may contain a 
  plaintext username and password, startup logs, application performance 
  monitoring systems, CI logs, and copied stack traces can disclose broker 
  credentials to users who should not have access to them. This issue is fixed 
  in version 5.35.0.
