title: "An issue was discovered in Django 6.1 before 6.1.2, 6.0 before 6.0.9, and
  5.2 before 5.2.18.\nAn incomplete fix for CVE-2026-15307 in Django spatial lookups
  allows an attacker who can supply `bytes` values to cause the Django process to
  make network requests via a crafted VRT document referencing an external raster
  source.\nEarlier, unsupported Django series (such as 5.1.x, 5.0.x, and 4.2.x) were
  not evaluated and may also be affected.\nDjango would like to thank sicksec for
  reporting this issue."
