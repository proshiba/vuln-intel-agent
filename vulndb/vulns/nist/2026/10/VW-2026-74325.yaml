title: Super Productivity is an advanced todo list app with integrated 
  timeboxing and time tracking capabilities. From 17.3.0 until 18.13.1, the 
  SuperSync end-to-end encryption setup calls sync(true) before a user sets an 
  encryption password, causing the operation-upload path to transmit and store 
  all user operations in plaintext. The exposed operations can include private 
  task content and connected issue-provider credentials, including reusable 
  passwords, API tokens, and app passwords. Users who complete E2EE setup have 
  the plaintext operations deleted, while users who leave the password-setting 
  step can leave the data stored indefinitely. The Disable SuperSync action did 
  not remove plaintext that had already been uploaded. Routing and causal 
  metadata remain plaintext by design and are not part of this vulnerability. 
  This issue is fixed in version 18.13.1.
