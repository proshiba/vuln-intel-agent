title: The Bit integrations – Form Integration, Webhook, Spreadsheets, CRM, LMS 
  & Email Automation plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via the 'field mapped to notification_content (attacker-chosen key, 
  e.g. payload_text)' parameter in all versions up to, and including, 2.10.6 due
  to insufficient input sanitization and output escaping. This makes it possible
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. Exploitation requires 
  a site administrator to have preconfigured a Bit Integrations flow that binds 
  the public Bit Assist webhook to a BuddyBoss "Send Notification" action with a
  form field mapped to notification_content, and the attacker to know the flow's
  UUID callback URL.
