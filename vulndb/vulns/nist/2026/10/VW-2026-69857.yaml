title: An information exposure vulnerability in Canonical MAAS prior to versions
  3.4.10, 3.5.14, 3.6.5, 3.7.3, and 3.8.0 allows an unauthenticated attacker to 
  retrieve the RPC secret in plaintext via the vendor data metadata endpoint. If
  a target machine was deployed with the 'register as rack' option enabled, an 
  attacker who obtains or infers the machine's system ID can query the 
  preseed/metadata server to leak the secret.
