title: "sogo_yhn configures SOGo with a parameter that forces the request with HTTP
  header \"x-webobjects-remote-user\" to be treated as sent by a verified user without
  performing password validation. Since Nginx does not strip this header, any client
  can supply it arbitrarily and gain access as any user, including a privileged user,
  without providing a password.\n\n\n\n\nThis issue was fixed in version 5.8.0~ynh9."
