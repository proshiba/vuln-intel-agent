title: A security vulnerability has been detected in SohuTV CacheCloud up to 
  3.2.0. Affected by this vulnerability is the function doAppAuditList of the 
  file src/main/java/com/sohu/cache/web/controller/AppManageController.java. 
  Such manipulation leads to cross site scripting. The attack may be performed 
  from remote. The exploit has been disclosed publicly and may be used. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
