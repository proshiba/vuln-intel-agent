title: A vulnerability was found in feelec-yishu feelcrm-os 1.0.0. Affected by 
  this issue is the function htmlspecialchars_decode of the file 
  App/Feelcrm/Common/Model/CrmDefineFormModel.class.php of the component Create 
  Customer Endpoint. Performing a manipulation of the argument 
  customer_form[remark] results in cross site scripting. It is possible to 
  initiate the attack remotely. The exploit has been made public and could be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
