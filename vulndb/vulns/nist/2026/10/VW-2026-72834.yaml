title: Nginx UI is a web user interface for the Nginx web server. From 2.3.8 
  until 2.5.0, an authenticated administrator with an active secure session can 
  submit attacker-controlled portable backup key material and a matching 
  manifest to POST /api/restore. The restore flow trusts the supplied key, 
  decrypts attacker-controlled contents, and replaces the live app.ini, 
  including protected nginx command settings such as TestConfigCmd. Triggering 
  POST /api/nginx/test then executes the restored command in the Nginx UI 
  runtime context, affecting confidentiality, integrity, and availability. This 
  issue is fixed in version 2.5.0.
