title: Allocation of resources without limits or throttling in the CMP/CRMF 
  password-based MAC verifier (PKMacBuilder) in Legion of the Bouncy Castle Inc.
  bc-csharp before 2.7.0 allows a remote unauthenticated attacker to cause a 
  denial of service through CPU exhaustion via a CMP message or CRMF certificate
  request whose PBMParameter declares a very large iteration count, because 
  PKMacBuilder enforced its iteration-count ceiling only when the caller had 
  supplied an explicit maximum through the 
  PKMacBuilder(IPKMacPrimitivesProvider, int) constructor. With any other 
  constructor, ProtectedPkiMessage.Verify and 
  CertificateRequestMessage.IsValidSigningKeyPop performed as many hash 
  iterations as the sender requested, up to about 2^31, before the MAC could be 
  checked.
