title: A security flaw has been discovered in FantasticLBP Hotels Server up to 
  67b44df162fab26df209bd5d5d542875fcbec1d0. The impacted element is an unknown 
  function of the file controller/api/hotelList.php. The manipulation of the 
  argument subjectId/cityName results in sql injection. The attack can be 
  executed remotely. The exploit has been released to the public and may be 
  exploited. This product implements a rolling release for ongoing delivery, 
  which means version information for affected or updated releases is 
  unavailable. The vendor was contacted early about this disclosure but did not 
  respond in any way.
