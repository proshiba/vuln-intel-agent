title: The WPCafe – Restaurant Menu, Online Food Ordering & Table Booking System
  plugin for WordPress is vulnerable to authorization bypass in all versions up 
  to, and including, 3.0.19. This is due to the plugin not properly verifying 
  that a user is authorized to perform an action. This makes it possible for 
  unauthenticated attackers to read, create, update, clone, and delete email 
  notification flows, including overwriting the default reservation 
  confirmation, cancellation, and admin alert emails with attacker-controlled 
  content sent from the site's legitimate address, or destroying reservation 
  notification flows entirely. The vulnerable endpoints are active by default on
  every WPCafe installation without any configuration requirement, as the 
  Email_Automation_Service_Provider::is_enable() method unconditionally returns 
  true and the plugin ships with five pre-configured default email flows upon 
  activation.
