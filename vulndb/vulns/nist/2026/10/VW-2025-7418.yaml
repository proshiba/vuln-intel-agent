title: "A vulnerability has been identified in SiPass integrated (All versions < V3.0).
  Affected server applications store user passwords encrypted in its database. Decryption
  keys are accessible to users with administrative privileges, allowing them to recover
  passwords.\r\n\r\nSuccessful exploitation of this vulnerability allows an attacker
  to obtain and use valid user passwords. This can lead to unauthorized access to
  user accounts, data breaches, and potential system compromise."
