title: A vulnerability has been found in Open5GS up to 2.7.6. Affected is the 
  function 
  ogs_pfcp_pdr_find_or_add/ogs_pfcp_far_find_or_add/ogs_pfcp_urr_find_or_add/ogs_pfcp_qer_find_or_add
  in the library lib/pfcp/context.c of the component QER/FAR/URR/PDR. The 
  manipulation leads to reachable assertion. It is possible to initiate the 
  attack remotely. The attack's complexity is rated as high. The exploitability 
  is told to be difficult. The exploit has been disclosed to the public and may 
  be used. The identifier of the patch is 
  442369dcd964f03d95429a6a01a57ed21f7779b7. Applying a patch is the recommended 
  action to fix this issue.
