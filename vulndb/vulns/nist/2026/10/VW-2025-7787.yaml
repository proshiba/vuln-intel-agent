title: 'ClipBucket v5 is an open source video sharing platform. Prior to version 5.5.2
  #147, ClipBucket v5 is vulnerable to arbitrary PHP code execution. In /upload/admin_area/actions/update_launch.php,
  the "type" parameter from a POST request is embedded into PHP tags and executed.
  Proper sanitization is not performed, and by injecting malicious code an attacker
  can execute arbitrary PHP code. This allows an attacker to achieve RCE. This issue
  has been resolved in version 5.5.2 #147.'
