title: A vulnerability was found in Open5GS up to 2.7.5. Affected by this 
  vulnerability is the function ogs_pfcp_handle_create_pdr in the library 
  lib/pfcp/handler.c of the component PFCP. The manipulation results in improper
  initialization. It is possible to launch the attack remotely. This attack is 
  characterized by high complexity. The exploitation appears to be difficult. 
  The exploit has been made public and could be used. The patch is identified as
  773117aa5472af26fc9f80e608d3386504c3bdb7. It is best practice to apply a patch
  to resolve this issue.
