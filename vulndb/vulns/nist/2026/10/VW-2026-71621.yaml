title: Backstage is an open framework for building developer portals. Prior to 
  1.14.6 and 1.15.4, the @backstage/plugin-techdocs-node package is affected by 
  bypass of mkdocs configuration sanitizer in techdocs backend. Users with the 
  ability to commit changes to a repository that uses TechDocs can circumvent 
  the MkDocs configuration file sanitizer introduced in response to 
  CVE-2026-25153 and execute arbitrary code on the TechDocs backend host during 
  documentation generation. This issue is fixed in versions 1.14.6 and 1.15.4.
