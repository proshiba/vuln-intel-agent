title: The OAuth Single Sign On – SSO (OAuth Client) plugin for WordPress is 
  vulnerable to Improper Verification of Cryptographic Signature in versions up 
  to, and including, 6.26.12. This is due to the plugin performing unsafe JWT 
  token processing without verification or validation in the 
  `get_resource_owner_from_id_token` function. This makes it possible for 
  unauthenticated attackers to bypass authentication and gain access to any 
  existing user account - including administrators in certain configurations - 
  or to create arbitrary subscriber-level accounts.
