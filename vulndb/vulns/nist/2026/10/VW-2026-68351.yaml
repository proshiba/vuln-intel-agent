title: Zetetic SQLCipher before 4.15.0 allows SQL injection. The 
  sqlcipher_export convenience function can be used to copy the contents of one 
  attached database into another. It is most often used to convert between 
  plaintext and encrypted databases. It needs to do dynamic schema manipulation,
  and thus the function temporarily clears defensive restrictions during 
  operation. A vulnerability in the handling of the source database name 
  parameter made it possible for a caller to supply a crafted source name, which
  could execute statements that defensive mode would otherwise block. This could
  allow direct modifications to the sqlite_schema table and database corruption.
  SQLCipher 4.15.0 now strictly validates the source database name and prevents 
  the bypass.
