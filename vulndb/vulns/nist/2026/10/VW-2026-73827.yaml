title: The Metasploit Framework post module 
  post/apple_ios/gather/ios_image_gather is affected by a relative path 
  traversal vulnerability (CWE-22). The module interpolates file names taken 
  from a Meterpreter directory listing — data fully controlled by a hostile or 
  tampered iOS device — directly into the local destination path passed to 
  client.fs.file.download_file(), with no sanitization. The underlying stdapi 
  sink (lib/rex/post/meterpreter/extensions/stdapi/fs/file.rb) writes to 
