title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mvpp2: prevent buffer overflow in page_pool allocation\n\nThe per‑processor buffering
  scheme is supported only if the\nnumber of pools (nrxqs * 2) does not exceed MVPP2_BM_MAX_POOLS
  (8).\nThis is already checked in mvpp2_probe() during the initial\nactivation of
  percpu_pools.\n\nHowever, mvpp2_change_mtu() may later call\nmvpp2_bm_switch_buffers(priv,
  true) without this check, which can\nlead to an out-of-bounds access in the priv->page_pool
  array in\nmvpp2_bm_init(). The array is sized to hold MVPP2_PORT_MAX_RXQ\nentries,
  and mvpp2_get_nrxqs() may return exactly that value. The\nper-CPU scheme then doubles
  it to nrxqs * 2, exceeding the array\nbounds.\n\nCheck that the hardware version
  is MVPP22 or newer and that the\nnumber of pools (nrxqs * 2) does not exceed MVPP2_BM_MAX_POOLS\n\
  before switching to per-CPU mode.\n\nFound by Linux Verification Center (linuxtesting.org)
  with SVACE."
