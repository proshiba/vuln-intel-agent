title: OneUptime is a solution for monitoring and managing online services. 
  Prior to 10.0.24, the password reset flow logs the complete password reset URL
  — containing the plaintext reset token — at INFO log level, which is enabled 
  by default in production. Anyone with access to application logs (log 
  aggregation, Docker logs, Kubernetes pod logs) can intercept reset tokens and 
  perform account takeover on any user. This vulnerability is fixed in 10.0.24.
