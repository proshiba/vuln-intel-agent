title: The Payment Plugins for Stripe WooCommerce plugin for WordPress is 
  vulnerable to Reflected Cross-Site Scripting via '#response' URL Fragment in 
  all versions up to, and including, 4.0.17 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. Exploitation requires that the 'Generic 
  Errors' setting is unchecked, causing getErrorMessage() to return the raw 
  Stripe error string unchanged rather than substituting a mapped safe message.
