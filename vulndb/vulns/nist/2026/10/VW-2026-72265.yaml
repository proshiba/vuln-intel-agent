title: An input validation vulnerability exists in the security certificate 
  management component of the Brocade Fabric OS administrative management API. 
  When processing certificate management operations, user-supplied certificate 
  identifiers are handled without adequate sanitization prior to execution in 
  external system routines. An authenticated attacker with privileges to perform
  certificate deletion requests can leverage this flaw to execute arbitrary 
  system commands with the privileges of the underlying management daemon. This 
  vulnerability affects Fabric OS versions before 9.2.2d and 10.0.0 through 
  10.0.0a1.
