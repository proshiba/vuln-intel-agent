title: Russh is a Rust SSH client and server library. Prior to 0.63.1, a 
  connection configured to permit mac=none can negotiate it with a MAC-requiring
  CTR or CBC block cipher because the selection logic validates needs_mac() only
  when MAC selection fails. A remote peer can then send a packet with a 
  decrypted length of zero, causing russh/src/cipher/mod.rs to shrink the 
  previously read block before indexing buffer.buffer[16..], which panics and 
  terminates the connection task. This issue is fixed in version 0.63.1.
