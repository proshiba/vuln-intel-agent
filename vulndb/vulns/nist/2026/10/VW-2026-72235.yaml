title: Multiple OS Command Injection vulnerabilities exist in the management 
  interface and session processing routines of Brocade Fabric OS versions before
  10.0.1. Input processing flaws during remote management connection validation 
  and session verification for directory-based user accounts allow untrusted 
  input containing shell metacharacters to reach internal system execution 
  wrappers. An authenticated user or a compromised directory service account can
  exploit these vulnerabilities to execute arbitrary operating system commands 
  with elevated privileges on the target device.
