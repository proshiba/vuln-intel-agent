title: The Bookly – Online Scheduling and Appointment Booking System plugin for 
  WordPress is vulnerable to Sensitive Information Exposure in versions up to, 
  and including, 28.4 via the classic booking form's Details step. The endpoint 
  bookly_render_details is registered for both wp_ajax and wp_ajax_nopriv, the 
  module overrides csrfTokenValid() to always return true, and 
  Bookly\Frontend\Components\Booking\InfoText::getCodes() calls 
  UserBookingData::getCustomer() to load the persisted Customer entity keyed 
  solely by the attacker-supplied phone (or email) with no invocation of the 
  plugin's own customerIdentityConfirmed() predicate. When a site owner has 
  placed the supported {client_name}, {client_email}, {client_phone}, or 
  {client_note} placeholders into the Details step's Appearance information 
  text, the matched customer's stored name, email, phone and internal notes are 
  substituted into the returned HTML. This makes it possible for unauthenticated
  attackers who know only a registered customer'
