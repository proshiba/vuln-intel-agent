title: 'Vulnerability in the Oracle Financial Services Analytical Applications Infrastructure
  product of Oracle Financial Services Applications (component: Platform).  Supported
  versions that are affected are 8.0.7.9, 8.0.8.7 and  8.1.2.5. Easily exploitable
  vulnerability allows unauthenticated attacker with network access via HTTP to compromise
  Oracle Financial Services Analytical Applications Infrastructure.  While the vulnerability
  is in Oracle Financial Services Analytical Applications Infrastructure, attacks
  may significantly impact additional products (scope change).  Successful attacks
  of this vulnerability can result in  unauthorized access to critical data or complete
  access to all Oracle Financial Services Analytical Applications Infrastructure accessible
  data. CVSS 3.1 Base Score 8.6 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N).'
