title: go-mail is a comprehensive library for sending mails with Go. In versions
  0.7.0 and below, due to incorrect handling of the mail.Address values when a 
  sender- or recipient address is passed to the corresponding MAIL FROM or RCPT 
  TO commands of the SMTP client, there is a possibility of wrong address 
  routing or even ESMTP parameter smuggling. For successful exploitation, it is 
  required that the user's code allows for arbitrary mail address input (i. e. 
  through a web form or similar). If only static mail addresses are used (i. e. 
  in a config file) and the mail addresses in use do not consist of quoted local
  parts, this should not affect users. This issue is fixed in version 0.7.1
