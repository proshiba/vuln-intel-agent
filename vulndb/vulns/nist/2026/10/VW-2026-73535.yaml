title: UnicomAI Wanwu before 0.6.3 contains an insecure direct object reference 
  vulnerability that allows authenticated low-privileged users to delete other 
  tenants' agent or RAG applications by supplying their appId. Attackers can 
  send requests to DELETE /v1/appspace/app with guessed sequential assistant IDs
  to permanently delete victims' applications, workflows, conversations, and 
  associated data.
