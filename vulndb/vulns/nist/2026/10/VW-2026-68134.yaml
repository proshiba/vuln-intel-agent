title: The King Addons for Elementor plugin for WordPress is vulnerable to 
  multiple Contributor+ DOM-Based Stored Cross-Site Scripting vulnerabilities in
  all versions up to, and including, 51.1.38. This is due to insufficient input 
  sanitization and output escaping across multiple widgets and features. The 
  plugin uses esc_attr() and esc_url() within JavaScript inline event handlers 
  (onclick attributes), which allows HTML entities to be decoded by the DOM, 
  enabling attackers to break out of the JavaScript context. Additionally, 
  several JavaScript files use unsafe DOM manipulation methods (template 
  literals, .html(), and window.location.href with unvalidated URLs) with 
  user-controlled data. This makes it possible for authenticated attackers, with
  Contributor-level access and above, to inject arbitrary web scripts via 
  Elementor widget settings that execute when a user accesses the injected page 
  or when an administrator previews the page in Elementor's editor. The 
  vulnerability was partially patch
