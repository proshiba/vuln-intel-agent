title: 'A vulnerability was identified in Portabilis i-Diario up to 1.5.0. Impacted
  is an unknown function of the file /registros-de-conteudos-por-areas-de-conhecimento/
  of the component Registro das atividades. The manipulation of the argument Registro
  de atividades/Conteúdos leads to cross site scripting. The attack may be initiated
  remotely. The exploit is publicly available and might be used. The identifier of
  the patch is 821342cd8d952e8bd214cb16145da785a92f5681. It is suggested to install
  a patch to address this issue. The vendor confirms: "Audited values shown on that
  screen are now sanitized on output: only a minimal allowlist of basic formatting
  tags is kept and all attributes are stripped, so injected <script> or event-handler
  markup is removed and displayed as inert text."'
