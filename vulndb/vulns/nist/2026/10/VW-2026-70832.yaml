title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Fix NULL sched deref in kfunc sub-sched error paths\n\nWhen the root scheduler has
  sub-scheds attached, the COMPAT kfunc\nwrappers scx_bpf_select_cpu_and() and scx_bpf_dsq_insert_vtime()
  refuse\nthe call and report to @p's scheduler:\n\n\tscx_error(scx_task_sched(p),
  \"... must be used\");\n\nThe wrappers are reachable with tasks that have no scheduler.\n\
  scx_bpf_select_cpu_and() is in the select_cpu kfunc group, which\nscx_kfunc_context_filter()
  opens to BPF_PROG_TYPE_SYSCALL programs;\nscx_bpf_dsq_insert_vtime() is in the enqueue_dispatch
  group, which\nops.enqueue() and ops.dispatch() may call with any KF_RCU task --
  the\ngroup has no kf_tasks validation, and scx_dsq_insert_preamble() checks\ntask
  ownership with scx_task_on_sched() precisely because @p may be an\narbitrary task.\n\
  \nscx_task_sched(p) is p->scx.sched, which is NULL for tasks past\nsched_ext_dead()
  -- which clears it via scx_disable_and_exit_task() on\nexit -- and"
