  vulnerability that allows self-registered non-admin users to inject scripts 
  into item listing descriptions when frontend TinyMCE is enabled. Attackers can
  submit malicious JavaScript, which ItemActions.php saves without tag 
  stripping, causing it to execute in the site origin for any visitor viewing 
