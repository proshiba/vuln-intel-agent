title: The PowerBI Embed Reports plugin for WordPress is vulnerable to Sensitive
  Information Disclosure in all versions up to, and including, 1.2.0. This is 
  due to missing capability checks and authentication verification on the 
  'testUser' endpoint accessible via the mo_epbr_admin_observer() function 
  hooked on 'init'. This makes it possible for unauthenticated attackers to 
  access sensitive Azure AD user information including personal identifiable 
  information (PII) such as displayName, mail, phones, department, or detailed 
  OAuth error data including Azure AD Application/Client IDs, error codes, trace
  IDs, and correlation IDs.
