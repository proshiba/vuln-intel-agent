  2026.09.27-W39. Affected by this vulnerability is the function 
  WmToMoveGoodsController.list of the file 
  src/main/java/com/zzjee/wm/controller/WmToMoveGoodsController.java of the 
  component PDA Interface. Performing a manipulation of the argument searchstr 
