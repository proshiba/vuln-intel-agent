title: In Bouncy Castle for Java LTS before 2.73.13, the native one-shot CTR 
  packet cipher did not check that the requested input length fitted the counter
  space the IV left. In CTR mode the IV and the block counter share one 16-byte 
  block, so an IV of 13 to 15 bytes leaves a counter of only 1 to 3 bytes, 
  addressing 256, 65536 or 16777216 blocks respectively. Given a longer input 
  the counter wrapped and the keystream repeated from the start of the same 
  packet, and the call then returned the full input length as though every byte 
  had been correctly transformed. Two segments of the message were therefore 
  encrypted under the same keystream, so their plaintexts can be recovered from 
  the ciphertext alone, without the key, while the caller saw neither an 
  exception nor a short length to indicate it. The streaming implementation 
  validates at init and again while processing, and the portable 
  AESCTRPacketCipher rejects such a request with "Counter in CTR/SIC mode out of
