title: The Page Blocks plugin for WordPress is vulnerable to Cross-Site Request 
  Forgery in all versions up to, and including, 1.1.0. This is due to missing or
  incorrect nonce validation on the admin_process_widget_page_change function. 
  This makes it possible for unauthenticated attackers to modify widget page 
  block configurations via a forged request granted they can trick a site 
  administrator into performing an action such as clicking on a link.
