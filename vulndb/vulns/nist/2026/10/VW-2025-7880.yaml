title: 'Vulnerability in the Oracle VM VirtualBox product of Oracle Virtualization
  (component: Core).  Supported versions that are affected are 7.1.12 and  7.2.2.
  Easily exploitable vulnerability allows high privileged attacker with logon to the
  infrastructure where Oracle VM VirtualBox executes to compromise Oracle VM VirtualBox.  While
  the vulnerability is in Oracle VM VirtualBox, attacks may significantly impact additional
  products (scope change).  Successful attacks of this vulnerability can result in
  takeover of Oracle VM VirtualBox. CVSS 3.1 Base Score 8.2 (Confidentiality, Integrity
  and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H).'
