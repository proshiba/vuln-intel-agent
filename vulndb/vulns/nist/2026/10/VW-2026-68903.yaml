title: In ldapd in OpenBSD 7.8 before errata 057 and 7.9 before errata 021, 
  delegated BSD authentication results are correlated only by the LDAP child 
  process client file descriptor and LDAP message ID. After a connection closes,
  a later connection that reuses the same file descriptor and message ID can 
  receive the earlier authentication result. A remote attacker who can reach 
  ldapd can complete a Bind as another identity. A missing connection can also 
  cause a NULL pointer dereference. (ldapd is not enabled by default.)
