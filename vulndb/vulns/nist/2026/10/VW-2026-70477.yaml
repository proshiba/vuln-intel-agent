title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, logout clears the browser's auth-token cookie without revoking the 
  corresponding server-side session. A previously captured session token remains
  usable after the victim logs out and can continue to make authenticated 
  requests with the victim's authority until natural expiration. This issue is 
  fixed in version 2.18.0.
