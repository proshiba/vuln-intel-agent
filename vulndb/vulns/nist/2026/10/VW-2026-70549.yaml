title: Dify is an open-source LLM app development platform. Prior to 1.16.0, the
  PUT /console/api/apps/&lt;app_id&gt;/server endpoint in 
  api/controllers/console/app/mcp_server.py used AppMCPServerController.put() to
  retrieve an AppMCPServer by the client-supplied server ID without verifying 
  that the server belonged to the requested application and tenant. An 
  authenticated workspace member could therefore change another application's 
  MCP server status and parameters, potentially redirecting data or disabling 
  the service. This issue is fixed in version 1.16.0.
