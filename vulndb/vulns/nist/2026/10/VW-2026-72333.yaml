title: Unvalidated environments URL allows OAuth authorization code + PKCE 
  verifier theft and account takeover via injected OIDC authority in Ditto 
  Explorer in Eclipse Ditto Ditto Explorer [3.6.0,3.9.7] allows a craft link set
  an attacker-controlled OIDC authority with autoSso enabled. The UI then 
  automatically starts a login at the genuine identity provider but exchanges 
  the returned authorization code together with its PKCE code_verifier at an 
  attacker-controlled token endpoint. This lets the attacker redeem the code for
  the victim's access and refresh tokens. Alternatively, an attacker-controlled 
  api_uri causes the UI to send the victim's bearer token or Basic credentials 
  to the attacker. Because the configuration is persisted, later visits to the 
  UI without the crafted link repeat the token theft.
