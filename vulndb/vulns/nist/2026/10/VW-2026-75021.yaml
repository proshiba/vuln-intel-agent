title: "The AVDTP signalling layer arms a 6-second command timeout (AVDTP_TIMEOUT)
  in avdtp_send_cmd() whenever the local device issues an AVDTP request. Every response
  handler in subsys/bluetooth/host/classic/avdtp.c cancels session->timeout_work before
  clearing the pending request, but bt_avdtp_l2cap_disconnected() only cleared session->req
  and left the delayable work armed. The struct bt_avdtp session is the first member
  of struct bt_a2dp, whose instances live in a static per-connection array, and a2dp_get_connection()
  in subsys/bluetooth/host/classic/a2dp.c wipes a slot with memset() as soon as session->br_chan.chan.conn
  is NULL — which the L2CAP layer arranges immediately after the disconnect callback
  returns.\n\nA remote Bluetooth BR/EDR peer triggers the condition by opening the
  AVDTP signalling channel, letting the local application issue an AVDTP procedure
  (the standard A2DP flow issues bt_a2dp_discover() from the connected callback),
  then tearing the signalling channel down without res"
