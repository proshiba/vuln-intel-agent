title: A weakness has been identified in JeecgBoot up to 3.9.0. The impacted 
  element is the function SysUserOnlineController of the file 
  jeecg-boot/jeecg-module-system/jeecg-system-biz/src/main/java/org/jeecg/modules/system/controller/SysUserOnlineController.java.
  Executing manipulation can lead to manage user sessions. The attack can be 
  launched remotely. The exploit has been made available to the public and could
  be exploited. This patch is called b686f9fbd1917edffe5922c6362c817a9361cfbd. 
  Applying a patch is advised to resolve this issue.
