title: A vulnerability was found in Comsenz Discuz! 
  X5.0-20260801/X5.0-20260820/X5.0-20260910. Affected by this issue is the 
  function modmedalsubmit of the file 
  upload/source/app/admin/child/medals/mod.php of the component Admin Medal 
  Moderation. The manipulation of the argument delete results in sql injection. 
  It is possible to launch the attack remotely. The exploit has been made public
  and could be used. The vendor was contacted early about this disclosure but 
  did not respond in any way.
