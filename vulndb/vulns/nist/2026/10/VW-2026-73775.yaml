title: A weakness has been identified in erzhongxmu JEEWMS up to 2026.09.27-W39.
  Affected by this issue is the function CommonServiceImpl.getAutoList of the 
  file 
  src/main/java/org/jeecgframework/core/common/service/impl/CommonServiceImpl.java
  of the component Autocomplete Handler. Executing a manipulation of the 
  argument trem/searchField/entityName can lead to sql injection. It is possible
  to launch the attack remotely. The exploit has been made available to the 
  public and could be used for attacks. The vendor was contacted early about 
  this disclosure but did not respond in any way.
