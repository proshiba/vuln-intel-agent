title: "In Bouncy Castle for Java before 1.86, the high-level OpenPGP API accepted
  a data signature made by a signing subkey whose Subkey Binding signature carried
  no embedded Primary Key Binding (cross-certification) signature, in the case where
  that binding omits a Key Flags subpacket. RFC 9580 sec. 5.2.1.8 and sec. 10.1.3
  require the embedded Primary Key Binding signature on any subkey that can issue
  signatures; it is the subkey's own statement that it belongs to the primary key
  it is bound under. OpenPGPCertificate resolved the subkey's key flags two different
  ways. isSigningKey() goes through getKeyFlags() and getApplyingSubpacket(), which
  falls back to the primary key's direct-key or primary User ID self-signature when
  the binding signature omits the subpacket, so the subkey inherited the primary's
  SIGN_DATA and counted as signing-capable; verifyEmbeddedPrimaryKeyBinding(), which
  enforces the requirement, reads the binding signature's own hashed subpackets, found
  no SIGN_DATA there, and "
