title: ZITADEL before 3.4.14 and 4.x before 4.16.2 contains an authentication 
  bypass in the hosted Login V1 UI because the 'external account not found' 
  registration endpoint trusts client-supplied external identity fields without 
  a completed IdP callback. Unauthenticated attackers can submit forged 
  IDPConfigID and ExternalUserID values to pre-create an account bound to a 
  victim's external IdP identity, which the victim's later genuine external 
  login then signs into.
