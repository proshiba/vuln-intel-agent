title: A vulnerability was identified in Edimax BR-6208AC 1.32. Impacted is an 
  unknown function of the file /goform/formWlanMP. The manipulation of the 
  argument readE2P leads to command injection. It is possible to initiate the 
  attack remotely. The exploit is publicly available and might be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way. This vulnerability only affects products that are no longer supported by 
  the maintainer.
