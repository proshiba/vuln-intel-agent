title: UTMStack before 11.2.16 contains a JPQL injection vulnerability that 
  allows authenticated attackers to read arbitrary entity data by exploiting 
  UtmNetworkScanService.searchPropertyValues(), which builds a JPQL query with 
  String.format() and executes it via em.createQuery() without parameter 
  binding. Attackers can inject malicious JPQL through the value parameter in 
  the GET /api/utm-network-scans/searchPropertyValues endpoint to extract 
  sensitive data including credential tables such as jhi_user.
