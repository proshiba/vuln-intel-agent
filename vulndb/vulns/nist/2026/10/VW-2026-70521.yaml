title: Docling simplifies document processing by parsing diverse formats and 
  providing integrations with the generative AI ecosystem. From 2.83.0 until 
  2.131.0, the KServeV2OcrModel class defined in 
  docling/models/stages/ocr/kserve_v2_ocr_model.py sends page images to its 
  configured endpoint without checking the 
  pipeline_options.enable_remote_services setting, even when the caller sets 
  that policy control to false. The StandardPdfPipeline._make_ocr_model method 
  also fails to pass the flag into the OCR factory, allowing remote OCR 
  processing in configurations that rely on remote services being disabled. The 
  destination is configured by the caller rather than selected by an attacker. 
  This issue is fixed in 2.131.0.
