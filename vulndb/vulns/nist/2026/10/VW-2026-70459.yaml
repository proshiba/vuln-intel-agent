title: Ghost is a Node.js content management system. From 4.22.0 until 6.65.0, 
  SVG media thumbnails and SVG images uploaded with a non-SVG file extension 
  were stored without sanitization. This allowed any staff user, including 
  Contributors, to host scripts on the site's domain, possibly resulting in 
  compromise of other staff users' admin sessions. This issue is fixed in 
  version 6.65.0.
