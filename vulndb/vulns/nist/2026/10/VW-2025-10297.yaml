title: "In the Linux kernel, the following vulnerability has been resolved:\n\nisdn:
  mISDN: hfcsusb: fix memory leak in hfcsusb_probe()\n\nIn hfcsusb_probe(), the memory
  allocated for ctrl_urb gets leaked when\nsetup_instance() fails with an error code.
  Fix that by freeing the urb\nbefore freeing the hw structure. Also change the error
  paths to use the\ngoto ladder style.\n\nCompile tested only. Issue found using a
  prototype static analysis tool."
