title: Open WebUI from 0.8.8 before 0.11.4 contains an improper authorization 
  vulnerability that allows deactivated users to keep executing terminal 
  commands through an already open terminal WebSocket. Because the terminal 
  proxy route in terminals.py checks access only on the first message, 
  deactivated users can keep running commands and reading or writing files on 
  the terminal server.
