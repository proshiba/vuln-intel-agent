title: "Perforce Helix Authentication Service (HAS) deployments that retain the shipped
  default SCIM bearer token are vulnerable to unauthorized access when the SCIM endpoint
  is reachable by an attacker. In version 25.2, the installation templates contain
  a default credential which the installer copies into the active configuration; the
  installer and configuration script do not automatically replace that value with
  a random token. An attacker who knows the default token can authenticate to the
  SCIM API and perform user and group operations allowed by the configured provisioning
  backend. \n\n\n\n\n\nThis issue can be chained with CVE-2026-61834 in affected releases
  of the scim-patch dependency. A crafted SCIM PATCH request can cause server-side
  prototype pollution, corrupt application state, and disrupt service availability,
  including health checks and SCIM or SSO requests. In a later test, this primitive
  was confirmed to enable remote code execution in a Node.js 24/Express deployment
  through availab"
