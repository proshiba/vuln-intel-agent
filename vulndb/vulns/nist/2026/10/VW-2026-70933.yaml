title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_nat: unregister and release hooks on error\n\nIf nf_hook_entries_insert_raw()
  fails, the NAT hooks get never released,\nresulting in a memleak.\n\nPostpone setting
  nat_proto_net->nat_hook_ops when the hooks are\nregistered to simplify the error
  path to decide whether the nat hooks\nneed unwinding."
