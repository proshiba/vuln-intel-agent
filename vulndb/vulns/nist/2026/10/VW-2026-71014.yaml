title: Microsoft UFO is an open-source framework for intelligent automation 
  across devices and platforms. Prior to 3.0.9, authenticated device 
  registration through /api/devices can supply a permitted attacker-controlled 
  WebSocket endpoint while aip/transport/websocket.py applies pinned_addresses 
  only to the initial destination. The pinned websockets.connect() client 
  follows cross-origin redirects and opens a new TCP connection before Galaxy 
  performs its post-handshake peer-IP validation, allowing WebSocket upgrade 
  requests to internal hosts reachable from the server. The confirmed impact is 
  the internal connection and handshake request, and does not establish 
  arbitrary HTTP methods, response-body disclosure, a completed AIP session, or 
  cloud metadata access. This issue is fixed in version 3.0.9.
