title: The Rich Showcase for Google Reviews plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via the 'reviews[].text' parameter in all 
  versions up to, and including, 7.1.3 due to insufficient input sanitization 
  and output escaping. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. The payload is 
  delivered entirely through a Google review posted for the connected business 
  and requires no WordPress account; the plugin's default daily cron 
  auto-imports the malicious review text, and execution triggers for every 
  visitor on DOMContentLoaded without any further user interaction.
