title: Inspur Haiyue HCM Cloud contains an arbitrary file read vulnerability in 
  the /api/model_report/file/download endpoint that allows unauthenticated 
  remote attackers to read arbitrary files by supplying unvalidated path 
  parameters index and ext. Attackers can craft requests such as 
  /api/model_report/file/download?index=/&ext=<path> to traverse the filesystem 
  and disclose sensitive files including /etc/passwd, application database 
  files, and system configuration files. Exploitation evidence was first 
  observed by the Shadowserver Foundation on 2024-11-04 .
