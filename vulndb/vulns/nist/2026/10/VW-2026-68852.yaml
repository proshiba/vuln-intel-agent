title: Tugtainer is a self-hosted app for automating updates of Docker 
  containers. Prior to version 1.30.3, Tugtainer's OIDC authentication can still
  be initiated even when OIDC_ENABLED=false. The /auth/oidc/enabled endpoint 
  correctly reports that OIDC is disabled. However, a direct request to 
  /auth/oidc/login still starts the OIDC login flow, returns HTTP 302, sets an 
  oidc_state cookie, and redirects the user to the configured OIDC authorization
  endpoint. This bypasses the intended OIDC disable switch. This issue has been 
  patched in version 1.30.3.
