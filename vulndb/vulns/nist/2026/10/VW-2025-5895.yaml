title: The WP Social Ninja – Embed Social Feeds, Customer Reviews, Chat Widgets 
  (Google Reviews, YouTube Feed, Photo Feeds, and More) plugin for WordPress is 
  vulnerable to unauthorized access and modification of data due to a missing 
  capability check on the getAdvanceSettings and saveAdvanceSettings functions 
  in all versions up to, and including, 4.0.1. This makes it possible for 
  unauthenticated attackers to view and modify plugin's advanced settings.
