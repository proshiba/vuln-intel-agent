title: The Visitors Traffic Real Time Statistics Pro plugin for WordPress is 
  vulnerable to unauthenticated stored Cross-Site Scripting in all versions up 
  to, and including, 11.22 via the page_title parameter of the 
  ahcpro_track_visitor AJAX action. The action is registered for logged-out 
  callers (wp_ajax_nopriv_ahcpro_track_visitor) and stores $_POST['page_title'] 
  with NO sanitization, keeping it raw in the ahc_title_traffic.til_page_title 
  column. When an administrator opens the plugin's dashboard, the 'Traffic by 
  Title' DataTable renders that stored value as innerHTML without output 
  escaping, executing arbitrary JavaScript. This makes it possible for 
  unauthenticated attackers to inject web scripts that run in an administrator's
  session.
