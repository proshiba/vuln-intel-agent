title: Nginx UI is a web user interface for the Nginx web server. Prior to 
  2.4.3, Nginx UI validates an automatic backup's storage_path, but 
  AutoBackup.GetName returns a user-controlled name without rejecting path 
  separators or parent-directory components, and downstream filename formatting 
  embeds that result in the final archive filename. An authenticated user who 
  can create or modify an automatic backup can cause filepath.Join to resolve 
  the generated archive path outside the validated storage directory, allowing 
  backup archives to be written with the Nginx UI process privileges. For 
  encrypted configuration backups, the adjacent encryption key file can also be 
  written outside the validated directory. This issue is fixed in version 2.4.3.
