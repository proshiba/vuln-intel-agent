title: Trivy before 0.71.0 allows directory traversal in Terraform filesystem 
  functions when they try to access pathnames above the scan root. The risk 
  occurs when using misconf scanning on untrusted input (e.g., upon a 
  third-party pull request that contains a Terraform configuration), if 
  sensitive data can be found at those unintended pathnames, and an adversary 
  can then view a sensitive data value within scan output.
