title: The Simple Newsletter Plugin – Noptin plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via the 
  'noptin_fields[<custom_field_merge_tag>] (e.g. first_name)' parameter in all 
  versions up to, and including, 4.3.10 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The attack chain requires a published campaign post
  whose body contains a [[subscriber.*]] merge tag; the unauthenticated attacker
  first POSTs the entity-encoded payload to the public manage_preferences form 
  (which issues its own nonce on the same page), then pivots execution by 
  embedding their confirm_key in a campaign preview URL sent to a privileged 
  user via social engineering.
