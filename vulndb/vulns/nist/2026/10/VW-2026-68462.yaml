title: A flaw was found in Moodle. The manual enrolment management page did not 
  properly check whether the manual enrolment plugin was disabled, allowing 
  users with enrolment permissions to access the page directly by navigating to 
  its URL. Consequently, an authorized user could manage manual enrolments even 
  after an administrator disabled the feature in the user interface.
