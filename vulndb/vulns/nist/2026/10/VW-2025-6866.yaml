title: A vulnerability has been found in UTT HiPER 840G up to 3.1.1-190328. 
  Affected by this issue is the function strcpy of the file 
  /goform/formTaskEdit. The manipulation of the argument txtMin2 leads to buffer
  overflow. Remote exploitation of the attack is possible. The exploit has been 
  disclosed to the public and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
