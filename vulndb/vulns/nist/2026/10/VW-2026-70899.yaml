title: "In the Linux kernel, the following vulnerability has been resolved:\n\npppoatm:
  ensure a writable skb header and linear data\n\nIn pppoatm_send(), LLC encapsulation
  checks whether there is sufficient\nheadroom for the 4-byte LLC header, but does
  not ensure that the skb header\nis writable.\n\nNormal transmit packets passing
  through ppp_start_xmit() have their header\nunshared via skb_cow_head(). However,
  packets can also reach pppoatm_send()\nvia PPP channel bridging (PPPIOCBRIDGECHAN)
  without going through\nppp_start_xmit().\n\nUse skb_cow_head() to ensure both sufficient
  headroom and a writable\nheader before pushing the LLC header.\n\nWhile at it:\n\
  - Call pskb_may_pull(skb, 1) before inspecting skb->data[0] to prevent\n  out-of-bounds
  reads on zero-length or non-linear frames (e.g. from\n  bridging).\n- Defer SC_COMP_PROT
  protocol compression until after pppoatm_may_send()\n  succeeds. This eliminates
  the temporary skb allocation on admission failure\n  and completely removes the
  fragile \"undo\" heuristic"
