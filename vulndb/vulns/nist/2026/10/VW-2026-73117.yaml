title: Spotweb through 1.5.8 contains an OS command injection vulnerability in 
  the runcommand NZB handler that allows remote attackers to execute commands by
  publishing spots with malicious titles. Attackers can post self-signed spots 
  over Usenet with shell metacharacters in the title, which are substituted 
  unescaped for $SPOTTITLE and passed to exec() when a user downloads the spot, 
  running commands as the Spotweb PHP process.
