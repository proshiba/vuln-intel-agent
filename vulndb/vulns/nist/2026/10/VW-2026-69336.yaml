title: The Prime Mover plugin for WordPress before 2.2.1 contains a Zip Slip 
  path traversal vulnerability that allows authenticated administrators to write
  arbitrary files outside the intended extraction directory during migration ZIP
  import. Attackers can craft ZIP entry names with traversal sequences processed
  by computeExtractionParameters() and resumableZipExtractor() in 
  utilities/PrimeMoverSystemCheckUtilities.php to write attacker-controlled 
  content to arbitrary filesystem locations, potentially achieving remote code 
  execution if the written files are interpreted by the web environment.
