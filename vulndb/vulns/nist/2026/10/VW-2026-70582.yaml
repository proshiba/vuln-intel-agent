title: A weakness has been identified in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. The affected element is an unknown 
  function of the file book.php of the component Booking Handler. This 
  manipulation of the argument Doctor/appointment causes sql injection. The 
  attack is possible to be carried out remotely. The exploit has been made 
  available to the public and could be used for attacks. This product adopts a 
  rolling release strategy to maintain continuous delivery. Therefore, version 
  details for affected or updated releases cannot be specified. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
