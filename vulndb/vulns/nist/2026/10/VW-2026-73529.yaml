title: hyper-mcp through 0.8.3 contains a signature verification bypass 
  vulnerability in load_wasm in src/wasm/oci.rs that verifies the Cosign 
  signature of a separately resolved tag rather than the loaded manifest. 
  Attackers controlling registry responses for the tag can serve an unsigned 
  malicious manifest to the loader and a signed one to Cosign, executing 
  unsigned WebAssembly plugins with configured host capabilities.
