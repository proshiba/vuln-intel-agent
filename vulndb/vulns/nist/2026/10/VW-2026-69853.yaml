title: LangGraph Python SDK is used to connect to running LangGraph API servers,
  manage assistants, threads and stream runs from Python applications. From 
  0.1.45 until 0.4.4, the langgraph-sdk resource-scoped authorization decorators
  @auth.on.threads, @auth.on.assistants, and @auth.on.crons ignore the actions 
  argument and register the selected handler for every action on the resource. 
  Because that wildcard resource handler is selected before broader fallback 
  handlers, an authenticated user may bypass fallback action, ownership, or 
  permission checks and read, update, or delete another user's resource. Only 
  Python deployments using actions on the affected decorators are vulnerable, 
  and a deployment remains protected when the selected handler independently 
  enforces all required checks for every action it receives. This issue is fixed
  in version 0.4.4.
