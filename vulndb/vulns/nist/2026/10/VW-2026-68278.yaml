title: KitchenAsty through 0.3.0 contains a broken object level authorization 
  (IDOR) vulnerability in the reservations API. The endpoint GET 
  /api/reservations/:id in packages/server applies the authenticate middleware 
  but performs no ownership or role check, and the getReservation handler in 
  packages/server/src/controllers/reservation.controller.ts returns the record 
  retrieved by the client-supplied identifier without comparing 
  reservation.customerId to the authenticated principal
