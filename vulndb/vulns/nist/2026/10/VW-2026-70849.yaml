title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  wwan: mhi_wwan_mbim: guard against a cyclic NDP chain\n\nThe NDP traversal in mhi_mbim_rx()
  only stops when wNextNdpIndex is\nzero.  Nothing requires the offsets to advance,
  so a modem that\npoints an NDP at itself, or at an earlier NDP, keeps the loop\n\
  spinning forever on one CPU.\n\nBreak out when the next NDP offset is not larger
  than the current\none.\n\n\nVerified in a QEMU guest with a fault injector feeding
  the driver's\nreceive callback an NTB whose single NDP points at itself: the\nunpatched
  driver spins in mhi_mbim_rx() with one CPU pinned at 100%\nand the thread never
  returns.  With this check the loop terminates\nwithin one iteration.\n\nChanges
  in v2: move the non-increasing check to the wNextNdpIndex\nretrieval site, as suggested
  by Loic Poulain, instead of tracking\nthe previous offset in a separate variable."
