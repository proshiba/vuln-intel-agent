title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  clear free space tree creation state on rebuild failure\n\nbtrfs_rebuild_free_space_tree()
  sets BTRFS_FS_CREATING_FREE_SPACE_TREE\nbefore rebuilding the free space tree. \
  \ Several error paths return\nwithout clearing this flag.\n\nThe transaction restart
  failure path can leave the flag set on a live\nfilesystem, causing delayed reference
  processing to be skipped. Clear it\non all free space tree rebuild failure paths.
  Keep\nBTRFS_FS_FREE_SPACE_TREE_UNTRUSTED set, since a failed rebuild leaves\nthe
  free space tree untrusted. Callers must fall back to extent-tree\ncaching."
