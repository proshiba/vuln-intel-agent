title: A flaw has been found in Open5GS up to 2.7.5. This affects the function 
  decode_ipv6_header/ogs_pfcp_pdr_rule_find_by_packet of the file 
  lib/pfcp/rule-match.c of the component PFCP Session Establishment Request 
  Handler. Executing a manipulation can lead to reachable assertion. It is 
  possible to launch the attack remotely. The exploit has been published and may
  be used. This patch is called b72d8349980076e2c033c8324f07747a86eea4f8. 
  Applying a patch is advised to resolve this issue.
