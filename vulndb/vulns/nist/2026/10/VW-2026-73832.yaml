title: A weakness has been identified in y_project RuoYi up to 4.8.3. This 
  affects the function renderDrawer of the file /system/dict/data/add of the 
  component Dictionary Data Drawer Preview. Executing a manipulation of the 
  argument cssClass can lead to cross site scripting. The attack may be 
  performed from remote. The exploit has been made available to the public and 
  could be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
