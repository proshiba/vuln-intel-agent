title: "Improper Validation of Integrity Check Value vulnerability in hexpm hex allows
  a package mirror to substitute the tarball that mix hex.package fetch PACKAGE VERSION
  --output - writes to standard output.\n\nHex compares a fetched tarball's inner
  and outer checksums with the repository's signed registry before writing it to a
  file or unpacking it. The standard output branch of mix hex.package fetch writes
  the bytes returned by Hex.SCM.fetch/3 without that comparison, and Hex.SCM.fetch/3
  doesn't verify freshly downloaded tarballs itself. When a mirror configured with
  HEX_MIRROR_URL or mirror_url serves altered bytes, the command prints them and exits
  successfully, while the same fetch with --output FILE fails with a checksum mismatch.\n\
  \nHex also prints diagnostics to standard output while the command runs: the body
  of a failed HTTP response from the update check or a registry fetch, and API warnings
  from the x-hex-message header. A mirror that answers one of those requests with
  an error whos"
