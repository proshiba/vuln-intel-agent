title: Servor 1.0.0 through 4.0.2 contains a path traversal vulnerability that 
  allows unauthenticated remote attackers to escape the served root by sending 
  URL-encoded dot segments. Attackers can send %2e%2e/ sequences, which 
  decodeURI() decodes before path.join() in serveStaticFile and 
  serveDirectoryListing, to read arbitrary files and list directories outside 
  the root.
