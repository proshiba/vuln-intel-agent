title: "The SMBus driver API exposed smbus_smbalert_remove_cb() and smbus_host_notify_remove_cb()
  as Zephyr syscalls. Their verifiers in drivers/smbus/smbus_handlers.c validated
  only the dev argument with K_SYSCALL_OBJ(dev, K_OBJ_DRIVER_SMBUS) and forwarded
  the caller-supplied struct smbus_callback *cb pointer into kernel-mode driver code
  without any K_SYSCALL_MEMORY_READ/K_SYSCALL_MEMORY_WRITE validation. A companion
  change in 2023 had already removed the matching smbus_smbalert_set_cb() / smbus_host_notify_set_cb()
  syscalls for this reason, but the two removal syscalls were left exposed.\n\nOn
  a build with CONFIG_USERSPACE=y, CONFIG_SMBUS=y and a driver implementing the callback
  operations (drivers/smbus/intel_pch_smbus.c with CONFIG_SMBUS_INTEL_PCH_SMBALERT/CONFIG_SMBUS_INTEL_PCH_HOST_NOTIFY,
  or drivers/smbus/smbus_stm32.c with CONFIG_SMBUS_STM32_SMBALERT), any user-mode
  thread that has been granted the SMBus device object can invoke these syscalls with
