title: When Brocade ASCG before 3.5.0 processes support bundle archives ingested
  from remote compromised endpoints, the application fails to sanitize path 
  traversal sequences contained within archive entries prior to extraction. An 
  unauthenticated remote attacker capable of sending or intercepting ingested 
  archive files can leverage this flaw to write arbitrary files to restricted 
  locations on the underlying host, potentially leading to remote code 
  execution.
