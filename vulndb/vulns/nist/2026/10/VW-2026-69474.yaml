title: The Avada | Website Builder For WordPress & WooCommerce theme for 
  WordPress is vulnerable to Reflected Cross-Site Scripting via the 'lang' 
  parameter in all versions up to, and including, 7.16.1 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. The injected value is propagated through 
  Fusion_Multilingual::set_active_language() and concatenated into a URL by 
  Fusion_Settings::get_setting_link() without applying urlencode(), esc_url(), 
  or esc_attr() before being echoed raw into a double-quoted href attribute in 
  the post editor metabox.
