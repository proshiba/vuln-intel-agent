title: "The HTTP Basic Authentication modules in ((OTRS)) Community Edition 6 and
  prior accept the authenticated username from either the REMOTE_USER or HTTP_REMOTE_USER
  environment variable. In CGI and mod_perl based deployments, HTTP request headers
  may be mapped to corresponding HTTP_* environment variables. As a result, an unauthenticated
  remote attacker can supply a crafted Remote-User request header which is exposed
  to the application as HTTP_REMOTE_USER. When HTTP Basic Authentication is configured
  as the authentication backend, OTRS trusts this value as an already authenticated
  username and does not perform an additional password verification. An attacker may
  therefore authenticate through the Generic Interface as an existing agent or customer
  user without knowing the corresponding credentials.\n\nThe resulting privileges
  depend on the account being impersonated. Successful exploitation may allow access
