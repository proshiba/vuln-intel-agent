title: Kiota is an OpenAPI based HTTP Client code generator. From 1.25.1 until 
  1.35.0, Kiota copies x-ai-capabilities.response_semantics.oauth_card_path from
  an attacker-controlled or compromised OpenAPI description into a generated API
  plugin manifest without validating that the value is a safe package-relative 
  file reference. Parent-directory traversal, rooted paths, or absolute URIs can
  therefore reach a consuming host that resolves the reference, allowing the 
  host to cross the intended plugin-package boundary or use an unintended 
  authentication card. Kiota does not itself read a local file or execute code 
  merely while generating the manifest, and impact requires downstream 
  resolution of the unsafe reference. This issue is fixed in version 1.35.0.
