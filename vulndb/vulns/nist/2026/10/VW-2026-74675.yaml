title: A vulnerability was determined in AdithyaYelloju 
  Restaurant-Management-System up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. 
  Impacted is the function mysqli_query of the component Order Management. 
  Executing a manipulation of the argument ID can lead to authorization bypass. 
  The attack can be launched remotely. The exploit has been publicly disclosed 
  and may be utilized. This product does not use versioning. This is why 
  information about affected and unaffected releases are unavailable. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
