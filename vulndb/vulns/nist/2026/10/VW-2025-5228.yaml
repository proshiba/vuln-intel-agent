  management panel. The /cgi-bin/cgiServer.exx endpoint fails to properly 
  sanitize user input to the page parameter, allowing remote authenticated 
  attackers to access arbitrary files on the underlying system by using crafted 
  path traversal sequences. Exploitation evidence was observed by the 
  Shadowserver Foundation on 2025-02-02 UTC.
