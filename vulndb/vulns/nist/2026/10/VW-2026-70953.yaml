title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: don't free driver-owned scan requests\n\nWhen an interface goes down while
  a scan is running, cfg80211 completes\nthe scan towards userspace and frees the
  scan request. However, the\ndriver can be convinced that it owns the request, since
  the cancellation\nis (intended to be) asynchronous.\n\nThe WARN_ON() in the netdev
  notifier was meant to catch this, but it's\nnot actually avoidable, so it triggers
  and we get a UAF in scan_done().\n\nThere doesn't seem to be a great way around
  it, so just track that the\ndriver is still convinced it owns the request, and then
  just free it on\ncompletion if it was already cancelled. Also remove the warnings
  since\nthey can trigger in the intended architecture."
