title: "Authorization bypass through a user-controlled key in the optional Amazon
  Q Business Lambda hook sample ( q-business-lambda-hook https://github.com/aws-solutions-library-samples/qnabot-on-aws/blob/main/source/docs/lambda_hooks/README.md
  ), available with QnABot on AWS versions 7.0.0 through 7.4.5, might allow an authenticated
  remote user to read arbitrary Amazon S3 objects in the deploying AWS account. This
  sample solution provides an example Lambda hook and requires separate, manual deployment
  and additional setup. It is not deployed automatically with QnABot. Customers who
  have not deployed this optional sample hook are not affected and do not need to
  take action. \n\n\n\nTo remediate this issue, affected customers should update the
  QnABot on AWS stack to version 7.4.6 or later and then redeploy the Amazon Q Business
  Lambda hook sample stack. Updating the QnABot on AWS stack alone does not deliver
  the fix."
