title: Coolify is an open-source and self-hostable tool for managing servers, 
  applications, and databases. Prior to version 4.0.0-beta.420.7, the Git 
  Repository field during project creation is vulnerable to command injection. 
  User input is not properly sanitized, allowing attackers to inject arbitrary 
  shell commands that execute on the underlying server during the deployment 
  workflow. A regular member user can exploit this vulnerability. Version 
  4.0.0-beta.420.7 contains a patch for the issue.
