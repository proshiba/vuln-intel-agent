title: Gitea's repository migration and pull mirror egress checks could be 
  bypassed with a hostname that returns multiple DNS answers, because the 
  address that was validated was not necessarily the address Git later connected
  to. A low-privileged user who can create migrations or mirrors could direct 
  the server to internal services, reading from and writing to reachable 
  internal Git or HTTP endpoints. Content from internal responses could 
  additionally be disclosed through migration and mirror error messages.
