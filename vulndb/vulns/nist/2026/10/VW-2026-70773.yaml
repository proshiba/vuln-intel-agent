title: "Reliance on Obfuscation or Encryption of Security-Relevant Inputs without
  Integrity Checking vulnerability in danielberkompas cloak allows an attacker with
  write access to stored ciphertext to make it decrypt to a chosen value via bit flipping.\n\
  \nCloak.Ciphers.AES.CTR encrypts with AES-256 in CTR mode and stores the key tag,
  the IV and the ciphertext with no MAC. decrypt/2 checks only the key tag and the
  minimum length before it returns the plaintext, and Cloak.Ciphers.Deprecated.AES.CTR
  decrypts the legacy format the same way. CTR is a stream cipher, so a value XORed
  into the stored ciphertext is XORed into the plaintext at the same offset. An attacker
  who can write to the encrypted store (for example through SQL injection or a compromised
  replica) and who knows or can guess a stored plaintext can replace it with any value
  of the same length. The application receives that value with no error.\n\nThis issue
  affects cloak: from 0.1.0-pre onward."
