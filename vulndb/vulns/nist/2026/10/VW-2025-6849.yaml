title: A vulnerability was determined in Frappe LMS 2.35.0. This affects an 
  unknown function of the component Course Handler. Executing manipulation of 
  the argument Description can lead to cross site scripting. The attack can be 
  executed remotely. The exploit has been publicly disclosed and may be 
  utilized. It is suggested to upgrade the affected component. The vendor was 
  informed early about a total of four security issues and confirmed that those 
  have been fixed. However, the release notes on GitHub do not mention them.
