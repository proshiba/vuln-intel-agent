title: Pausing a shared (public) dashboard did not revoke its access token for 
  the endpoints that serve frontend bootstrap data. Anyone holding the link to a
  paused shared dashboard could still retrieve, without authenticating, the 
  configuration of the dashboard's data sources, including stored credentials 
  for data sources using browser access (missing authorization). Deleting the 
  shared dashboard does revoke the token.
