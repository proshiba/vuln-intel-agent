title: A security issue was discovered in MongoDB mongos (the sharded cluster 
  router) where an authenticated user with readWrite privileges could crash the 
  mongos process by crafting a specially formed aggregation pipeline. The issue 
  leverages an internal aggregation stage that lacks proper authorization checks
  despite being intended for internal use, allowing a subsequent stage to be 
  forced to execute on the router under conditions it was not designed to 
  handle. This results in an unhandled fatal error that causes the mongos 
  process to immediately abort, resulting in denial of service for all clients 
  routed through the affected mongos instance.
