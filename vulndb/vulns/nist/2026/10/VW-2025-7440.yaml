  Injection') vulnerability in Centreon Infra Monitoring (Poller reload setup in the
  configuration modules) allows OS Command Injection.\nOn the poller parameters page,
  a user with high privilege is able to concatenate custom instructions into the poller
  reload command.\n\nThis issue affects Infra Monitoring: from 24.10.0 before 24.10.13,
  from 24.04.0 before 24.04.18, from 23.10.0 before 23.10.28."
