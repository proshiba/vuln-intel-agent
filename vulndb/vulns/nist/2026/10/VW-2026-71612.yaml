title: Backstage is an open framework for building developer portals. Prior to 
  3.9.1, the @backstage/plugin-catalog-backend package is affected by 
  inconsistent enforcement of allowed location types during catalog processing. 
  Under certain configurations, the catalog backend could process location types
  that were not intended to be allowed, potentially leading to unintended file 
  access on the backend host. This issue is fixed in version 3.9.1.
