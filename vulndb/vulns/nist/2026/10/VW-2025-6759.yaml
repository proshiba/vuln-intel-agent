title: WeGIA is an open source web manager with a focus on charitable 
  institutions. Versions 3.4.12 and below contain an SQL Injection vulnerability
  which was identified in the /pet/profile_pet.php endpoint, specifically in the
  id_pet parameter. This vulnerability allows attackers to execute arbitrary SQL
  commands, compromising the confidentiality, integrity, and availability of the
  database. This issue is fixed in version 3.5.0.
