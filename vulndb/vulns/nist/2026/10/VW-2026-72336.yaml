title: Heap-based buffer overflow in the legacy Blowfish encryption routine 
  (BlowFishEncryptor::Encode, called by EncryptToString) in Progressive Robot 
  hMailServer 6.0.0 through 6.3.5 allows an authenticated mailbox user to cause 
  a denial of service (service crash), and possibly other unspecified impact. In
  6.3.4 and 6.3.5, where the self-service REST API is enabled (it is off by 
  default), the user does this remotely by adding a fetch account whose password
  is 129 to 247 characters long and not a multiple of 8, and then requesting 
  their personal data export (GET /api/v1/me/export.zip), which encrypts that 
  password with the legacy scheme. The same flaw is reachable on Windows by any 
  local interactive user with no hMailServer credentials, through the COM method
  Utilities.BlowfishEncrypt, which checked no authentication. It is also 
  reachable by every stored-secret write when ProtectStoredSecretsWithDPAPI is 
  set to 0. For such a length, the routine's padding loop writes up to 7 zero 
  bytes 2 to 23
