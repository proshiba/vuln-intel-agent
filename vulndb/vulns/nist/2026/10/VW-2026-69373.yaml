title: The Cadmos LTI application hosted at cadmos.eummena.io had Laravel debug 
  mode enabled (APP_DEBUG=true, APP_ENV=local) in a publicly accessible 
  environment. An unauthenticated attacker could send a GET request and trigger 
  an unhandled exception, causing Laravel to expose the entire server 
  environment, including all .env configuration variables, in plaintext. Fixed 
  on or before 2026-09-02.
