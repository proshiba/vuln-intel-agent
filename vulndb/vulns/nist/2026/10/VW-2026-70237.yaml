title: "The system-call verifier for i3c_do_ccc() in drivers/i3c/i3c_handlers.c validated
  the outer struct i3c_ccc_payload, the broadcast ccc.data buffer and the targets.payloads[]
  array, but did not validate the per-target data buffers those array elements point
  at. Each struct i3c_ccc_target_payload carries its own data pointer and data_len,
  and neither was passed through K_SYSCALL_MEMORY() before the payload was handed
  to z_impl_i3c_do_ccc() and on to the controller driver. The verifier also operated
  on the caller's live structure rather than a snapshot, so validated fields could
  be changed by a second user thread between the check and the driver's use — unlike
  the sibling z_vrfy_i3c_transfer(), which has always copied its message array first.\n\
