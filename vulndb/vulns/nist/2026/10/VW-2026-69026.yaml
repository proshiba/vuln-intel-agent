title: A vulnerability was determined in David-Crty databasement up to 1.7.1. 
  Affected is the function SnapshotPolicy.viewAny/SnapshotPolicy.view of the 
  file /api/v1/snapshots of the component Snapshot Model. This manipulation 
  causes improper access controls. Remote exploitation of the attack is 
  possible. The exploit has been publicly disclosed and may be utilized. 
  Upgrading to version 1.7.2 is able to address this issue. The affected 
  component should be upgraded.
