title: A vulnerability was identified in SciPhi-AI R2R up to 3.6.6. This 
  vulnerability affects unknown code of the file py/shared/abstractions/llm.py 
  of the component Retrieval Completion API Endpoint. Such manipulation of the 
  argument generation_config.api_base leads to server-side request forgery. The 
  attack can be launched remotely. The exploit is publicly available and might 
  be used. The vendor was contacted early about this disclosure but did not 
  respond in any way.
