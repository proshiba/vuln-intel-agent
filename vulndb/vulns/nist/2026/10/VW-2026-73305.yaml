title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability 
  that allows low-privileged authenticated users to create message templates by 
  calling POST /sys/message/sysMessageTemplate/add. Attackers holding only 
  minimal roles can insert arbitrary notification templates with chosen codes 
  and content into the shared sys_sms_template library used for system, e-mail, 
  SMS and IM notifications.
