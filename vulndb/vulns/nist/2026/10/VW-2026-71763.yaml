title: Rundeck before 6.2.0 contains an OS command injection vulnerability that 
  allows authenticated users with job run permission to execute commands on 
  Windows nodes by supplying crafted option values. Attackers can inject cmd.exe
  metacharacters such as && or | into free-text options, which 
  CLIUtils.quoteWindowsCMDArg wraps in ineffective single quotes, running 
  commands with node executor credential privileges.
