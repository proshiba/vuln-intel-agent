title: A security vulnerability has been detected in Naichen ThinkCMF up to 
  8.0.7. Affected by this issue is the function MailController::templatePut of 
  the file cmf-api/src/admin/controller/MailController.php of the component 
  Email Template. The manipulation leads to improper neutralization of special 
  elements used in a template engine. The attack is possible to be carried out 
  remotely. The exploit has been disclosed publicly and may be used. The vendor 
  was contacted early about this disclosure but did not respond in any way.
