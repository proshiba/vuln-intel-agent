  manipulating digital images. Prior to 6.9.13-56 and 7.1.2-31, a crafted local 
  call to the GetVirtualPixels API can trigger an integer calculation error and 
  write beyond a heap buffer, crashing the server process. This issue is fixed 
  in versions 6.9.13-56 and 7.1.2-31.
