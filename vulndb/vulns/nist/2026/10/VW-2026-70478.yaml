title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, the SVG exporter places an attacker-controlled text object's 
  fill-color value into a ppmcolormask command string and executes that string 
  through child_process.exec. A user who can edit a file can store shell 
  metacharacters in the fill color and trigger SVG export, causing commands to 
  execute with the exporter service's privileges. The same export can be 
  triggered through a valid public share link to a malicious file. This 
  vulnerability is fixed in 2.18.0.
