title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  bcd2000: Fix race between rawmidi and disconnect\n\nAlthough we tried to fix the
  potential UAF issues at USB disconnect on\nbcd2000 driver, there is still an overlooked
  case -- namely, when a\nrawmidi trigger callback has been already running at USB
  disconnect\nhandling, the in-flight function (e.g. bcd2000_midi_send()) could\n\
  still access the URB, because the previous URB NULL-check & clearance\nwas considered
  only for the URB complete callbacks, but not about the\nparallel rawmidi operations.\n\
  \nFor addressing the race, this patch introduced a new spinlock that\ncovers each
  rawmidi operation as well as the rawmidi handling in the\ncomplete callback.  The
  URB is cleared with the lock, so it guarantees\nthat the pending rawmidi task already
  finished or a NULL check is\neffective."
