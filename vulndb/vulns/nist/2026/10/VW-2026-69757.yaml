title: "MISP contains an authorization flaw in its correlation handling during attribute
  searches. When a user performs an attribute search that triggers correlation lookups,
  the system authorized access to correlated attributes and events based on a stale
  distribution snapshot stored on the correlation row rather than the live event access
  control list.\n\nBecause the correlation row's distribution columns are a point-in-time
  copy that lacks a published flag, the authorization check becomes incorrect when
  an event is subsequently restricted (for example, its sharing group is changed or
  it is unpublished). As a result, an authenticated user could retrieve attributes
  and event details belonging to events they no longer have permission to view.\n\n\
  Preconditions:\n\n- An authenticated user with at least read access to some events
  in the instance.\n\n- The existence of correlations between events, at least one
  of which has been restricted after the correlation was created.\n\nImpact:\n\n-
  Confidentiality: exp"
