title: Incorrect default permissions in the Windows installer of Progressive 
  Robot hMailServer 6.0.0 through 6.3.5 allow a local authenticated user to read
  the mail server's data. The installer created the data, log, temp, database 
  and event folders and the hMailServer.INI configuration file with the 
  permissions inherited from the installation folder, by default under Program 
  Files, which give the local Users group read access. Any user who can sign in 
  to the computer could read every stored message, the logs, the built-in 
  database with the accounts' password hashes whenever the service is stopped, 
  and the configuration file, including the database password, which is sealed 
  only with the machine's DPAPI key and can be unsealed by any local account; 
  with an external database that password gives full control of it. The Linux 
  AppImage of 6.3.0 through 6.3.5 likewise created its per-user data folders 
  readable by other local users.
