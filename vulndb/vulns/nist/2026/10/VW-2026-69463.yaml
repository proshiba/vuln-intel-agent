title: A security vulnerability has been detected in modelcontextprotocol 
  mcp-server-fetch and mcp-server-everything up to 2026.6.4. Affected is the 
  function fetch_url of the file mcp_server_fetch/server.py of the component 
  Fetch Tool. The manipulation of the argument url/path leads to server-side 
  request forgery. The attack may be initiated remotely. The exploit has been 
  disclosed publicly and may be used. The pull request to fix this issue awaits 
  acceptance.
