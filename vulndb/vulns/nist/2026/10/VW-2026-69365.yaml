title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to version 1.0.8.6, Vvveb's HTML 
  sanitizer fails to strip event-handler attributes when a tag carries a 
  greater-than character inside a quoted attribute value. A low-privilege 
  content author (default role author or contributor) can store a payload in 
  post or product content that runs JavaScript in a browser of every visitor and
  of any administrator who views or previews that content, which opens a path to
  admin account takeover. This issue has been patched in version 1.0.8.6.
