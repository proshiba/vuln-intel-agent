title: "A NULL Pointer Dereference vulnerability in the PFE management daemon (evo-pfemand)
  of Juniper Networks Junos OS Evolved on ACX7024, ACX7024X, ACX7100-32C, ACX7100-48L, ACX7348, ACX7509
  devices allows an unauthenticated, adjacent attacker to cause a \n\nDenial-of-Service
  (DoS).\n\nWhenever specific valid multicast traffic is received on any layer 3 interface
  the evo-pfemand process crashes and restarts.\n\nContinued receipt of specific valid
  multicast traffic results in a sustained Denial of Service (DoS) attack. \nThis
  issue affects Junos OS Evolved on ACX7024, ACX7024X, ACX7100-32C, ACX7100-48L, ACX7348,
  ACX7509: \n\n\n\n  *  from 23.2R2-EVO before 23.2R2-S4-EVO, \n  *  from 23.4R1-EVO
  before 23.4R2-EVO.\n\n\nThis issue affects IPv4 and IPv6. \n\nThis issue does not
  affect  Junos OS Evolved ACX7024, ACX7024X, ACX7100-32C, ACX7100-48L, ACX7348, ACX7509 versions
  before 23.2R2-EVO."
