title: FreeRDP 3.18.0 before 3.32.0 has a heap-based out-of-bounds write in 
  freerdp_interruptible_get_line, which shrinks the buffer to 32 bytes while 
  keeping a pre-filled suggested username's length as its write offset. A 
  malicious or compromised ARM routing service can return a long 
  redirectedUsername that reaches the CLI credential prompt, crashing the client
  when the user types input.
