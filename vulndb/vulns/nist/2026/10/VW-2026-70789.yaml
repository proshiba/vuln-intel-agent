title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Avoid integer underflow in EOP ring size calculation.\n\nThe low 6 bits of cp_hqd_eop_control
  store the base-2 logarithm\nof the EOP ring size. This was calculated as\n\norder_base_2(q->eop_ring_buffer_size
  / 4) - 1\n\nBut order_base_2 can in theory return 0, so this could underflow\n(although
  in practice the ring buffer size cannot be less than 4096).\n\nChange this to\n\n\
  order_base_2(q->eop_ring_buffer_size / 8)\n\nusing properties of logarithms.\n\n\
  Also add to the above comment to make the mathematics more clear.\n\n(cherry picked
  from commit f0f43fcf8b2b3a924cad9444340921c96ed5f634)"
