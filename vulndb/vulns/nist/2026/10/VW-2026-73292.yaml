title: "Memory Allocation with Excessive Size Value vulnerability in ericmj decimal
  allows Denial of Service.\n\nDecimal.round/3 builds the full result for the requested
  number of decimal places before the context precision (34 digits by default) is
  applied, so its cost grows with the places argument instead of with the size of
  the result. For positive places it appends places zero digits to the coefficient
  as a charlist before converting it to an integer, and for negative places it builds
  a charlist of -places zero digits. A single call such as Decimal.round(Decimal.new(\"\
  1.5\"), -50_000_000) allocates about 5.5 GB of memory, which can exhaust available
  memory and get the BEAM VM killed. The oldest releases instead loop once per decimal
  place, consuming CPU in proportion to places.\n\nAny application that passes a user-supplied
  number of decimal places or scale to Decimal.round/2 or Decimal.round/3 without
  bounding it is exposed. The input limits added for CVE-2026-32686 do not cover the
  places arg"
