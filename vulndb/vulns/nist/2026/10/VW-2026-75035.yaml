title: "Leantime is an open source project management system. Prior to 3.10.0, for
  the provisionally grouped account-creation and plugin-management surfaces, Leantime's
  JSON-RPC dispatcher in app/Domain/Api/Controllers/Jsonrpc.php exposes public API
  service methods, while PermissionEnforcer::enforce allows methods that lack a RequiresPermission
  attribute. A low-privilege authenticated user with an ordinary browser session can
  send the required X-Requested-With: XMLHttpRequest header and call leantime.rpc.api.api.createApiKeyWithProjects,
  which reaches Api::createApiKeyWithProjects, with an attacker-chosen role to create
  an interactive administrator account. The same missing per-method authorization
  exposes Plugins::installPlugin, Plugins::enablePlugin, Plugins::disablePlugin, and
  Plugins::removePlugin to ordinary authenticated users, permitting unauthorized plugin
  management. The complete provisionally grouped issue is fixed in version 3.10.0."
