title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/vma:
  correctly unaccount on mmap_prepare() failure\n\n__mmap_setup() accounts memory
  for relevant mappings via:\n\nsecurity_vm_enough_memory_mm()\n  -> __vm_enough_memory()\n\
  \    -> vm_acct_memory()\n\nIf __mmap_setup() fails, this indicates that this accounting
  did not take\nplace, and thus it's appropriate for __mmap_region() to jump to\n\
  abort_munmap.\n\nHowever if call_mmap_prepare() fails, it also jumps there and any
  accounted\nmemory is not correctly unaccounted.\n\nFix this by handling each error
  separately."
