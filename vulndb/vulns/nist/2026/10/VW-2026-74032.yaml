title: FreeRDP 3.11.0 before 3.32.1 contains a reachable assertion vulnerability
  in urb_isoch_transfer that allows malicious RDP servers to crash clients by 
  sending unvalidated OutputBufferSize values. Attackers can send a 
  TS_URB_ISOCH_TRANSFER IN-direction request with OutputBufferSize above 
  INT32_MAX over URBDRC, triggering an assertion in libusb_udev_isoch_transfer 
  that terminates the client.
