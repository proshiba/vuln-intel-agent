title: A flaw was found in m17n-lib. A user providing specially crafted text 
  input can trigger a heap use-after-free condition during input-method state 
  transitions. Under specific conditions, the library frees an internal input 
  context object but subsequently attempts to write to that freed memory. This 
  issue can cause applications relying on the library to crash, leading to a 
  Denial of Service (DoS), or potentially allow arbitrary code execution.
