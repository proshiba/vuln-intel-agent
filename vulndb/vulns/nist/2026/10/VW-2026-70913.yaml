title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: mst: move switchdev call outside rcu\n\nThis is a follow-up of one of sashiko's
  pre-existing bug reports.\nbr_mst_set_state() calls switchdev_port_attr_set() for
  nonzero MSTIs\nwhile holding rcu_read_lock() which invokes the blocking switchdev\n\
  notifier chain and may sleep. Nonzero MSTI changes come from netlink\nwith rtnl
  held. Move the switchdev call before entering the rcu section and\nassert that rtnl
  is held.\n\nThe call cannot be deferred because netlink needs its error and extack.\n\
  Also DSA reads the old bridge MST state during the callback and checks it.\nA deferred
  callback will be late and will see the updated state."
