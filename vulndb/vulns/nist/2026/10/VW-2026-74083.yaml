title: "Open WebUI from 0.6.33 before 0.11.4 contains a cross-site scripting vulnerability
  that allows authenticated users to execute script in victims' sessions by storing
  javascript: URLs in citation embed_url fields. Attackers can share a crafted chat
  whose citation, when clicked, is passed to window.open, letting them steal localStorage.token
  and act as the victim."
