title: LangGraph SQLite Checkpoint is an implementation of LangGraph 
  CheckpointSaver that uses SQLite DB (both sync and async, via aiosqlite). 
  Prior to 2.0.11, LangGraph's SQLite store implementation contains SQL 
  injection vulnerabilities using direct string concatenation without proper 
  parameterization, allowing attackers to inject arbitrary SQL and bypass access
  controls. This vulnerability is fixed in 2.0.11.
