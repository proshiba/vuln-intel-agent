title: "The RFC 6528 initial-sequence-number implementation in subsys/net/ip/tcp.c
  derived every TCP ISN from SHA-256(unique_key || four-tuple) plus a uptime-derived
  offset, where unique_key is a 128-bit secret filled once by sys_csrand_get(). The
  return value of that call was discarded and the once guard was latched to true even
  when the call failed. Because sys_csrand_get() leaves the destination buffer untouched
  on failure (it deliberately propagates the entropy-driver error rather than filling
  the buffer), a single failed call left unique_key as its all-zero BSS content for
  the remainder of the boot, with no retry, no log message and no fallback.\n\nA failure
  of the cryptographic random source is required to reach the weak state — for example
  -ENODEV/-EIO from the entropy driver in subsys/random/random_entropy_device.c (the
  in-tree comment notes that the hardware RNG \"might still be gathering entropy during
  early boot situations\"), or psa_generate_random() failing in subsys/random/random_psa"
