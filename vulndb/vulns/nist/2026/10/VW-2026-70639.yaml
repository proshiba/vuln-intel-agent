title: "Improper authentication (CWE-287) in the OAuth token endpoint in Cloud Foundry
  UAA allows a remote, authenticated attacker holding a valid user access token to
  obtain a fully-privileged client_credentials token for the OAuth client that issued
  it, by presenting the user token as an OAuth 2.0 Bearer credential on a client_credentials
  grant request in place of the client’s configured secret.\n\n\n\nUAA’s client_credentials
  handling does not verify that the Bearer credential supplied for client authentication
  is actually a client credential (a client secret or a valid configured client authentication
  method); it accepts any valid access token whose client_id matches the request.
  A token obtained by a normal end user through a public authorization_code + PKCE
  flow — scoped only to uaa.user, carrying a user_id, and recording client_auth_method=none
  — satisfies this check. That user token cannot itself administer OAuth clients (POST
  /oauth/clients correctly returns 403), but when replayed as Bea"
