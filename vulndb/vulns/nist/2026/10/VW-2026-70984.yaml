title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  iptfs: fix stack OOB read in iptfs_skb_reset_frag_walk()\n\niptfs_skb_reset_frag_walk()
  advances to the fragment containing @offset\nwith an unbounded loop:\n\n\twhile
  (offset >= walk->past + walk->frags[walk->fragi].len)\n\t\twalk->past += walk->frags[walk->fragi++].len;\n\
  \nwalk->fragi is advanced and walk->frags[walk->fragi] is dereferenced\nwithout
  ever checking fragi against walk->nr_frags. When the requested\noffset is at or
  beyond the total length spanned by the walk's fragments,\nfragi runs past nr_frags
  and off the end of the fixed-size on-stack\nfrags[MAX_SKB_FRAGS + 1] array, reading
  out-of-bounds stack memory.\n\nThe two callers behave differently: iptfs_skb_add_frags()
  already guards\nagainst this with\n\n\tif (!walk->nr_frags ||\n\t    offset >= walk->total
  + walk->initial_offset)\n\t\treturn len;\n\nbut iptfs_skb_can_add_frags() has no
