title: The Popup builder with Gamification, Multi-Step Popups, Page-Level 
  Targeting, and WooCommerce Triggers plugin for WordPress is vulnerable to SQL 
  Injection in all versions up to, and including, 2.1.3. This is due to 
  insufficient escaping on the 'id' parameter and lack of sufficient preparation
  on the existing SQL query. This makes it possible for unauthenticated 
  attackers to append additional SQL queries into already existing queries that 
  can be used to extract sensitive information from the database.
