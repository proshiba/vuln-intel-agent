title: A vulnerability was determined in feelec-yishu feelcrm-os 1.0.0. This 
  affects an unknown part of the file 
  App/Feelcrm/Index/Controller/GoogleController.class.php of the component 
  getCurlData Endpoint. Executing a manipulation of the argument url can lead to
  server-side request forgery. It is possible to launch the attack remotely. The
  exploit has been publicly disclosed and may be utilized. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
