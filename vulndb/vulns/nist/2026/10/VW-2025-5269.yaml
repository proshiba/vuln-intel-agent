title: "Realtek rtl81xx SDK Wi-Fi Driver MgntActSet_TEREDO_SET_RS_PACKET Heap-based
  Buffer Overflow Local Privilege Escalation Vulnerability. This vulnerability allows
  local attackers to escalate privileges on affected installations of Realtek rtl81xx
  SDK Wi-Fi driver. An attacker must first obtain the ability to execute low-privileged
  code on the target system in order to exploit this vulnerability.\n\nThe specific
  flaw exists within the MgntActSet_TEREDO_SET_RS_PACKET function. The issue results
  from the lack of proper validation of the length of user-supplied data prior to
  copying it to a fixed-length heap-based buffer. An attacker can leverage this vulnerability
  to escalate privileges and execute arbitrary code in the context of SYSTEM. Was
  ZDI-CAN-25857."
