title: The WPC Shop as a Customer for WooCommerce plugin for WordPress is 
  vulnerable to privilege escalation via account takeover in all versions up to,
  and including, 2.0.0 This is due to the plugin not properly validating the 
  target user's role prior to issuing a new authentication session, allowing an 
  authenticated attacker to log in as any WordPress Administrator by directly 
  supplying an Administrator's user ID to the wpcsa_login endpoint and receiving
  a full Administrator session cookie without supplying the Administrator's 
  password. This makes it possible for authenticated attackers to perform a 
  direct session takeover, gaining full Administrator-level access to the site.
