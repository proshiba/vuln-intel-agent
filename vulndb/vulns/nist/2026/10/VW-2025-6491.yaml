title: A security flaw has been discovered in sunkaifei FlyCMS up to 
  abbaa5a8daefb146ad4d61027035026b052cb414. The affected element is an unknown 
  function of the file 
  src/main/java/com/flycms/web/system/IndexAdminController.java of the component
  Admin Login. Performing a manipulation of the argument redirectUrl results in 
  cross site scripting. The attack can be initiated remotely. The exploit has 
  been released to the public and may be used for attacks. Continious delivery 
  with rolling releases is used by this product. Therefore, no version details 
  of affected nor updated releases are available. The vendor was contacted early
  about this disclosure but did not respond in any way.
