title: Flag Forge is a Capture The Flag (CTF) platform. From versions 2.0.0 to 
  before 2.3.2, the public endpoint /api/user/[username] returns user email 
  addresses in its JSON response. The fix, intended for release in 2.3.1 but 
  only available starting in version 2.3.2, removes email addresses from public 
  API responses while keeping the endpoint publicly accessible. Users should 
  upgrade to version 2.3.2 or later to eliminate exposure. There are no 
  workarounds for this vulnerability.
