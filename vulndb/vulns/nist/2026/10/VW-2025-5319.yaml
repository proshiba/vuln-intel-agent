title: "Vite is a frontend tooling framework for JavaScript. Prior to versions 7.1.5,
  7.0.7, 6.3.6, and 5.4.20, any HTML files on the machine were served regardless of
  the `server.fs` settings. Only apps that explicitly expose the Vite dev server to
  the network (using --host or server.host config option) and use `appType: 'spa'`
  (default) or `appType: 'mpa'` are affected. This vulnerability also affects the
  preview server. The preview server allowed HTML files not under the output directory
  to be served. Versions 7.1.5, 7.0.7, 6.3.6, and 5.4.20 fix the issue."
