title: SumatraPDF is a multi-format reader for Windows. In 3.6.1 and earlier, 
  src/SelectionTranslate.cpp embeds selected or pasted translation text in 
  quoted Windows command lines using incomplete quote-only escaping. The 
  affected BuildGrokTranslateCmdLineTemp(), BuildClaudeTranslateCmdLineTemp(), 
  and BuildCodexTranslateCmdLineTemp() functions can allow attacker-controlled 
  text to inject model, working-directory, approval, or sandbox-bypass flags 
  when the corresponding agentic CLI backend is installed and used. No broader 
  impact is claimed beyond the advisory-supported conditions. No fixed version 
  is available as of this review.
