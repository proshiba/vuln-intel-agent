title: Combodo iTop 3.1.0 through 3.3.0 contains a missing authorization 
  vulnerability in LinkSetController.php that allows authenticated console users
  to bypass profile grants by supplying arbitrary class and key parameters. 
  Attackers can invoke the linkset delete, detach and get-remote-object routes 
  to delete objects, clear external keys, and read object attributes without 
  permission.
