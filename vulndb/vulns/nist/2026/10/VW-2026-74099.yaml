title: "Craft CMS 5.0.0 before 5.10.14 contains a DOM-based cross-site scripting vulnerability
  in the control panel login and 2FA verification flow, where a user-controlled returnUrl
  accepting javascript: URLs is used in client-side navigation. Attackers can lure
  a 2FA-enabled victim into opening a crafted /admin/login?verify=1 URL between password
  submission and TOTP verification, executing JavaScript in the authenticated control
  panel with the victim's permissions."
