title: The AI Puffer – Chat. Create. Automate. (formerly AI Power) plugin for 
  WordPress is vulnerable to authorization bypass in all versions up to, and 
  including, 2.4.89. This is due to the plugin not properly verifying that a 
  user is authorized to perform an action. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to modify 
  global plugin indexing and vector-search configuration options 
  (aipkit_training_general_settings and aipkit_indexing_field_settings), 
  including chunking parameters, file upload visibility, and per-CPT field 
  indexing settings, affecting all users of the plugin. This is only exploitable
  in configurations where an administrator has granted 'sources' module access 
  to a lower-privileged role via the plugin's Role Manager.
