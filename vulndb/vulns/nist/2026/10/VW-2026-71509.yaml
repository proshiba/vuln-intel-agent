title: Handlebars provides the power necessary to let users build semantic 
  templates. From 4.0.0 until 4.7.10, Handlebars lookupProperty returns 
  Function.prototype.constructor before applying the prototype-access deny list 
  because constructor is an own property of Function.prototype. When an attacker
  can render a controlled template with allowProtoMethodsByDefault enabled and 
  an accessible function in the template context, the template can traverse from
  that function through its prototype to Function.prototype and then obtain the 
  Function constructor through the own-property bypass. This permits 
  attacker-controlled JavaScript to execute with the server application's 
  privileges. This issue is fixed in version 4.7.10.
