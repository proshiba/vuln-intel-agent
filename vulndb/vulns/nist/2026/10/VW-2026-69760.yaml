title: In SuperAGI v0.0.14 and prior, controller endpoints (/api/agents/create, 
  /api/agents/schedule, /api/agents/delete, /api/agents/edit_schedule, 
  /api/agents/stop_schedule) allow authenticated users from one organization to 
  create, schedule, edit, stop, and delete agents belonging to a different 
  organization's project. The endpoints accept a project_id parameter but do not
  verify that the project belongs to the authenticated user's organization.
