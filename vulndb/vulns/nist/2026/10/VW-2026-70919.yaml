title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: cleanup arsta in ath11k_mac_peer_cleanup_all()\n\nWhen mac80211 removes
  a sta, it calls .sta_state() which in turn calls\nath11k_mac_station_remove(). In
  that function we clean up both peers &\narsta related resources.\n\nBut when the
  firmware crashes, ath11k calls ieee80211_restart_hw(), which\nassumes that all driver
  related resources are cleaned up beforehand. This\ncleanup is supposedly done by
  ath11k_mac_peer_cleanup_all() but does not\nin fact free arsta->rx_stats / tx_stats.\n\
  \nExtract the arsta cleanup from ath11k_mac_station_remove() into a\nnew ath11k_mac_station_cleanup()
  and call it from both there and\nath11k_mac_peer_cleanup_all().\n\nThis should handle
  kmemleaks reports like:\n\tunreferenced object 0xffffff801ae66400 (size 1024):\n\
  \t  comm \"hostapd\", pid 1306, jiffies 4295011565\n\t  hex dump (first 32 bytes):\n\
  \t    00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00  ................\n\t    00
  00 00 00 00 00 00 00 0"
