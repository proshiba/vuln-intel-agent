title: The Affinity by Canva application before 3.3.1 (October 2026 release) did
  not perform adequate bounds checking when parsing arrays of strings in 
  Affinity document files, leading to a heap buffer over-read. A threat actor 
  could craft an Affinity document that, when opened by a user in Affinity, 
  could disclose the contents of adjacent heap memory in the document's text or 
  result in an application crash.
