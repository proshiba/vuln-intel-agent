title: oRPC is a tool that helps build APIs that are end-to-end type-safe and 
  adhere to OpenAPI standards. Prior to 1.14.9, the @orpc/json-schema 
  SmartCoercionPlugin uses JsonSchemaCoercer to collect object properties in a 
  plain object and to resolve schema.properties entries through the prototype 
  chain. A remote client that can reach a procedure with an object input schema 
  can supply __proto__ to replace the prototype of the single coerced request 
  object, or supply Object.prototype member names such as constructor and 
  toString so inherited values are treated as sub-schemas and pass the coercer's
  satisfaction check. Attacker-controlled inherited properties can consequently 
  affect handler, Object.assign, or configuration lookups, while legitimate 
  __proto__ properties are dropped. The global Object.prototype, unrelated 
  objects, other requests, and other users are not modified, and downstream 
  schema validation still runs. This issue is fixed in version 1.14.9.
