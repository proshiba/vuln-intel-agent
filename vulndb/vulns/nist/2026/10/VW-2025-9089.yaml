title: "An attacker with viewer permissions in Looker could craft a malicious URL
  that, when opened by a Looker admin, would execute an attacker-supplied script.
  Exploitation required at least one Looker extension installed on the instance.\n\
  \nLooker-hosted and Self-hosted were found to be vulnerable.\nThis issue has already
  been mitigated for Looker-hosted instances. No user action is required for these.\n\
  \n\nSelf-hosted instances must be upgraded as soon as possible. This vulnerability
  has been patched in all supported versions of Self-hosted.\nThe versions below have
  all been updated to protect from this vulnerability. You can download these versions
  at the Looker download page  https://download.looker.com/ :  *  24.18.201+\n  *\
