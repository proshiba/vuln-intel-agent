title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  protect runlist updates with the runlist lock\n\nntfs_non_resident_attr_shrink()
  calls runlist helpers that require the\nrunlist write lock, but did not hold it
  while freeing clusters and\ntruncating the runlist. Serialize those operations and
  the resident\nconversion with the runlist lock.\n\nntfs_attr_map_cluster() can merge
  a newly allocated run before updating\nmapping pairs. If the update fails, free
  the clusters and restore both\nthe in-memory runlist and on-disk mapping pairs from
  a saved runlist.\nMark the volume in error if either rollback step fails."
