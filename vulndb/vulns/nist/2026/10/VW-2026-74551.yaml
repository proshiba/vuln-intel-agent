title: A vulnerability was found in k2-fsa sherpa-onnx up to 1.13.8. This issue 
  affects the function OfflineTransducerGreedySearchDecoder::Decode of the file 
  sherpa-onnx/csrc/offline-transducer-greedy-search-decoder.cc of the component 
  Offline Transducer Greedy Search Decoder. The manipulation of the argument 
  vocab_size results in buffer overflow. The attack can be launched remotely. 
  The exploit has been made public and could be used. If only official model 
  packs are used and they always keep metadata consistent with the joiner, the 
  bug may not be reachable in normal supported usage. However, from a security 
  and robustness standpoint, the code still contains the vulnerability because 
  it trusts unvalidated model metadata and can be triggered by a malformed or 
  tampered model pack.
