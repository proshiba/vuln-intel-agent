title: The WPMobile.App – Android and iOS App Builder plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via the 'REQUEST_URI (path segment 
  after /android_json/search/)' parameter in all versions up to, and including, 
  11.84 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. 
  Exploitation requires the app's content mode to be configured as 'webview' 
  (i.e., the 'speed' option is not set to '1'), which is a supported and 
  still-shipped mode, though no longer the default.
