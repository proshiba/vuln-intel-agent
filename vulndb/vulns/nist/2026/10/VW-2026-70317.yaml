title: auto-changelog before 2.6.1 merges configuration from inside the target 
  repository (the .auto-changelog file and the auto-changelog key in 
  package.json) into its options, and honors security-sensitive options from 
  that untrusted source. The handlebarsSetup option is passed to require(), so 
  running auto-changelog over attacker-controlled repository content (for 
  example, in a CI workflow that checks out an untrusted pull request head, or 
  locally on a forked or third-party repository) executes attacker-chosen code 
  with the privileges of the invoking user or CI job, including access to 
  workflow secrets, without the repository dependencies ever being installed. 
  The plugins option similarly loads attacker-controlled modules from the 
  repository. Under the same conditions, appendGitLog/appendGitTag allow git 
