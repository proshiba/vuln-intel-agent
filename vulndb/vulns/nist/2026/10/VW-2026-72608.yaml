title: SumatraPDF is a multi-format reader for Windows. In 3.7.0.22298, 
  src/MobiDoc.cpp narrows the untrusted unsigned mobiHdr.hdrLen field to a 
  signed integer for validation; values above INT_MAX become negative and bypass
  the upper-bound check. When the EXTH flag is set, the original unsigned value 
  is reused as a pointer offset, causing DecodeExthHeader() to read beyond the 
  record buffer. Opening a crafted MOBI file can reliably terminate the 
  application with a native access violation; no code execution, information 
  disclosure, or integrity impact has been demonstrated. No fixed version is 
  available as of this review.
