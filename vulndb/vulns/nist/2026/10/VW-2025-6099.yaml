title: "A security vulnerability has been detected in actiontech sqle up to 4.2511.0.
  The impacted element is an unknown function of the file sqle/utils/jwt.go of the
  component JWT Secret Handler. The manipulation of the argument JWTSecretKey leads
  to use of hard-coded cryptographic key\r . The attack is possible to be carried
  out remotely. The attack's complexity is rated as high. The exploitability is regarded
  as difficult. The exploit has been disclosed publicly and may be used. The project
  was informed of the problem early through an issue report and is planning to fix
  this flaw in an upcoming release."
