title: The AutomatorWP – No-Code Workflow Automation, Integration & Webhooks 
  Plugin, now with AI plugin for WordPress is vulnerable to authorization bypass
  in all versions up to, and including, 5.8.4. This is due to the plugin not 
  properly verifying that a user is authorized to perform an action. This makes 
  it possible for authenticated attackers, with subscriber-level access and 
  above, to enumerate all Fluent Forms records, including form IDs and titles, 
  from the fluentform_forms database table.
