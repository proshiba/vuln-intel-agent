title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (pwm-fan) Stop RPM timer before freeing tach data\n\nsample_timer() rearms the RPM
  timer and accesses the devm-managed\nctx->tachs and ctx->pulses_per_revolution arrays.
  The cleanup action\nwhich stops the timer is registered before those arrays are
  allocated.\n\nSince devres releases entries in reverse order, driver detach can
  free\nthe arrays before pwm_fan_cleanup() shuts down the timer. A timer expiry\n\
  in that window accesses the freed tach data.\n\nWith a KASAN kernel, a test-only
  kprobe delayed entry to\npwm_fan_cleanup() while normal sysfs unbind ran. Each of
  three runs\nreported three four-byte reads and two four-byte writes in sample_timer()\n\
  after its backing devm allocations had been freed. The helper did not\ninvoke the
  timer callback, cleanup actions or free functions.\n\nWith the fix, three matching
  unbind runs completed without KASAN, BUG,\nWARNING, Oops or panic. Instrumentation
  confirmed that timer retirement\nc"
