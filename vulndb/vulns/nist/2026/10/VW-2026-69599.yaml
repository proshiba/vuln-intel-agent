title: "A local attacker with control over GRUB's configuration can bypass lockdown
  restrictions when booting with Secure Boot and load an unsigned GRUB module, while
  GRUB continues to report lockdown is enabled.\n\n\n\n\nThe vulnerability is caused
  by insufficient validation of the MMIO base address passed to the GRUB serial command.
  GRUB does not validate that the base address corresponds to a UART device, rather
  than being an arbitrary memory address. This allows an attacker to trick GRUB into
  writing non-arbitrary data at an attacker-controlled address, including resetting the
  grub_file_verifiers list in a way that disables the subsequent verification of loaded
  modules."
