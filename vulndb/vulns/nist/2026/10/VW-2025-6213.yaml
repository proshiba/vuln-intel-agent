title: 'A vulnerability was identified in PhonePe App 25.03.21.0 on Android. This
  affects an unknown function of the file /data/data/com.phonepe.app/databases/ of
  the component SQLite Database. The manipulation leads to cleartext storage in a
  file or on disk. The attack needs to be performed locally. The exploit is publicly
  available and might be used. The actual existence of this vulnerability is currently
  in question. The root-requirement of the attack is reflected by the CVSS vector
  attribute PR:H. The vendor explains: "[A]s per the PoC this vulnerability needs
  a rooted device to exploit. PhonePe does not consider vulnerabilities found in rooted
  device as valid because there is not real-world exploit scenario."'
