title: A flaw was found in SSSD. A local user can trigger a Denial of Service 
  (DoS) by exploiting a race condition in the autofs responder between 
  asynchronous enumeration completion and map invalidation. By repeatedly 
  sending concurrent map enumeration and invalidation requests, an attacker can 
  cause memory to leak, leading to excessive memory consumption that can disrupt
  or crash the autofs service.
