title: A weakness has been identified in onetwothreeneth 
  HospitalManagementSystem up to 9ef91ed6007314b6473110ed699dff76d158f61d. The 
  affected element is the function 
  add_patient/add_physician/add_account/update_account/update_subaccount/edit_physician/edit_patient
  of the file php/controller.php. Executing a manipulation of the argument img 
  can lead to unrestricted upload. The attack may be launched remotely. The 
  exploit has been made available to the public and could be used for attacks. 
  This product operates on a rolling release basis, ensuring continuous 
  delivery. Consequently, there are no version details for either affected or 
  updated releases. The project was informed of the problem early through an 
  issue report but has not responded yet.
