title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  Skip KFD mapping clear before initialization\n\namdgpu_amdkfd_clear_kfd_mapping()
  assumes that a non-NULL kfd_dev\nhas a fully populated node array. This is not true
  when KFD device\ninitialization fails after probe.\n\nFor example, kgd2kfd_device_init()
  sets num_nodes before checking\nPCIe atomics support. On Polaris systems without
  the required atomics,\nit returns before allocating nodes[0], but the kfd_dev remains
  attached\nto the amdgpu device. A later GPU reset then dereferences nodes[0]->id.\n\
  \nRequire the authoritative KFD initialization flag before walking the\nnode array,
  matching the existing KFD reset and teardown paths.\n\n(cherry picked from commit
  4ac1835823c47903fbb278bbf474773c46f59edc)"
