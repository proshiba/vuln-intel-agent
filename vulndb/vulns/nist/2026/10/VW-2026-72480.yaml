title: mJobTime through build 15.7.3.32 contains an unauthenticated SQL 
  execution vulnerability in the Login.aspx admin panel handlers, where the 
  runQueryButton postback and exportSqlQuery_Server PageMethod execute 
  caller-supplied SQL against the backing Sybase SQL Anywhere database using 
  DBA/sysadmin privileges with no server-side authentication enforced beyond a 
  client-side sessionStorage flag. Attackers can submit arbitrary SQL through 
  these exposed endpoints to invoke xp_cmdshell and xp_read_file, achieving 
  pre-authentication remote code execution as LocalSystem via a single HTTP 
  request.
