title: n8n versions before 1.123.80, from 2.0.0 before 2.39.6, and from 2.40.0 
  before 2.40.1 contain a path traversal vulnerability in signed resume URL 
  generation for Send-and-Wait approvals. Attackers with workflow creation 
  permissions can mint valid approval URLs for gates in projects they cannot 
  access by exploiting unresolved traversal sequences in caller-controlled node 
  IDs, enabling cross-project approval forgery.
