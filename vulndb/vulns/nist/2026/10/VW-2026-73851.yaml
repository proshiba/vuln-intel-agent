title: "An authenticated administrator can be induced to delete administrative Import/Export
  templates through a Cross-Site Request Forgery (CSRF) attack. The OTRS AdminImportExport::TemplateDelete
  action does not validate the request's ChallengeToken, allowing an unauthenticated
  remote attacker to craft a malicious request that is executed with the privileges
  of an active administrator session.\n\nThis issue affects OTRS:\n\n  *  7.0.X\n\
  \  *  8.0.X\n  *  2023.X\n  *  2024.X\n  *  2025.X\n  *  2026.X before 2026.7.X\n\
  \nPlease note that ((OTRS)) Community Edition 6.x and before are vulnerable. Products
  based on the ((OTRS)) Community Edition also very likely to be affected"
