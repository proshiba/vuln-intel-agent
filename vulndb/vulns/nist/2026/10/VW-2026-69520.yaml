title: In Bouncy Castle for Java before 1.86, the MLS implementation 
  (org.bouncycastle.mls) holds RFC 9420's uint32 leaf_index in a signed int, so 
  a wire value with the top bit set decodes to a negative number. That is a 
  legitimate encoding rather than malformed input, and it must still decode, 
  since the MLS interop test vectors round-trip the full range. 
  GroupKeySet.SecretTree.hasLeaf and Group.validateRemove compared the decoded 
  value directly against the tree's leaf count, and a signed comparison treats 
  any negative int as less than a positive bound, so an out-of-range sender 
  passed the membership check. In the hasLeaf case the SenderData of an 
  unprotected PrivateMessage could then drive LeafIndex.directPath through 
  NodeIndex.parent() arithmetic that never reaches the tree root, growing the 
  resulting node list without bound until the JVM exhausted its heap. A single 
  small message from any current group member could therefore deny service to 
  every other member of the group. Both comparisons
