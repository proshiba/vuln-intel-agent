title: Vite is a frontend tooling framework for JavaScript. In versions from 
  2.9.18 to before 3.0.0, 3.2.9 to before 4.0.0, 4.5.3 to before 5.0.0, 5.2.6 to
  before 5.4.21, 6.0.0 to before 6.4.1, 7.0.0 to before 7.0.8, and 7.1.0 to 
  before 7.1.11, files denied by server.fs.deny were sent if the URL ended with 
  \ when the dev server is running on Windows. Only apps explicitly exposing the
  Vite dev server to the network and running the dev server on Windows were 
  affected. This issue has been patched in versions 5.4.21, 6.4.1, 7.0.8, and 
  7.1.11.
