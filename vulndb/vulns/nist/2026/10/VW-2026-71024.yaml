title: Mooncake Store master through 0.3.13.post1 contains a missing 
  authentication vulnerability that allows unauthenticated attackers to 
  force-delete any object via Remove, RemoveByRegex, RemoveAll and BatchRemove 
  on the coro_rpc port. Attackers can send forged requests with the force flag 
  set to bypass lease checks, wipe keys matching any regex, or clear the entire 
  store, causing cache loss and request failures.
