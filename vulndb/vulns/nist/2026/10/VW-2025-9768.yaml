title: On affected platforms running Arista EOS, the global common encryption 
  key configuration may be logged in clear text, in local or remote accounting 
  logs. Knowledge of both the encryption key and protocol specific encrypted 
  secrets from the device running-config could then be used to obtain protocol 
  specific passwords in cases where symmetric passwords are required between 
  devices with neighbor protocol relationships.
