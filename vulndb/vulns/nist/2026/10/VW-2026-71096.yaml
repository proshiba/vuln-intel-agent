title: ImageSharp is a 2D graphics library. From 4.0.0 until 4.1.2, ICC LUT16 
  conversion accepts more than four output channels even though 
  ClutCalculator.Calculate and LutEntryCalculator.CalculateLut store 
  intermediate and output values in Vector4. When 
  DecoderOptions.ColorProfileHandling is set to Convert, a malformed embedded 
  profile can direct interpolation and output-LUT operations to write one float 
  per declared channel beyond the four-float destination. This can corrupt 
  memory and terminate the process; the default Preserve mode does not run ICC 
  conversion. This issue is fixed in version 4.1.2.
