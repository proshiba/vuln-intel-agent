title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: mesh: release the channel if start fails\n\nieee80211_join_mesh() acquires
  a channel context and then calls\nieee80211_start_mesh(), which can fail. In that
  case, the chanctx\nisn't released then interface removal will attempt to unassign
  it\nafter it's removed from the driver, hitting:\n\n  wlan0: Failed check-sdata-in-driver
  check, flags: 0x0\n  WARNING: net/mac80211/driver-ops.c:366 at drv_unassign_vif_chanctx\n\
  \   ieee80211_assign_link_chanctx\n   __ieee80211_link_release_channel\n   ieee80211_link_release_channel\n\
  \   ieee80211_teardown_sdata\n   unregister_netdevice_many_notify\n   _cfg80211_unregister_wdev\n\
  \   ieee80211_remove_interfaces\n   ieee80211_unregister_hw\n   mac80211_hwsim_del_radio\n\
  \   hwsim_exit_net\n\nCorrectly release the channel on start failures."
