title: "microCLAUDIA in v3.2.0 and prior has an improper access control vulnerability.\n\
  \nThis flaw allows an authenticated user to perform unauthorized actions on other
  organizations' systems by sending direct API requests. To do so, the attacker can
  use organization identifiers obtained through a compromised endpoint or deduced
  manually.\n\nThis vulnerability allows access between tenants, enabling an attacker
  to list and manage remote assets, uninstall agents, and even delete vaccines configurations."
