title: "MISP contains an authorization bypass in the event flattening feature. When
  a user requests an event with the flatten option enabled, the application removes
  the Object containment from the query and returns object attributes as top-level
  event attributes. In doing so, the object-level distribution and sharing-group access
  control check was not re-applied to those attributes.\n\nAs a result, a user who
  can view a community-distributed event could retrieve attributes belonging to organisation-only
  objects (distribution level 0) or objects restricted to a specific sharing group,
  even though the user's organisation does not have access to those objects. This
  constitutes an unauthorized disclosure of sensitive threat intelligence data.\n\n\
  A secondary issue was introduced by the initial remediation: the fix reused the
  full Object contain conditions (including soft-delete state) as the gate for flattened
  attributes, causing an event owner requesting deleted attributes to lose all attributes
  whos"
