title: virtualenv is a tool for creating isolated virtual python environments. 
  Prior to 21.7.12, download_wheel() accepts pip and setuptools seed wheels 
  fetched for periodic updates or the --download option without checking their 
  bytes against an authoritative digest equivalent to the embedded wheels' 
  BUNDLE_SHA256 verification. A compromised index, stale mirror, or intercepted 
  TLS connection can substitute a different wheel under the requested 
  distribution, version, and filename, after which virtualenv caches and seeds 
  the attacker-controlled wheel into subsequently created environments. The 
  verification applies to the default PyPI path and is intentionally skipped 
  when PIP_INDEX_URL, PIP_EXTRA_INDEX_URL, or PIP_INDEX configures a custom 
  index that may legitimately publish rebuilt wheels. This issue is fixed in 
  version 21.7.12.
