title: A vulnerability was determined in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. This vulnerability affects unknown 
  code of the file get_town.php of the component AJAX Endpoint. Executing a 
  manipulation of the argument countryid/townid/cid/didval/cidval can lead to 
  sql injection. The attack may be launched remotely. The exploit has been 
  publicly disclosed and may be utilized. This product operates on a rolling 
  release basis, ensuring continuous delivery. Consequently, there are no 
  version details for either affected or updated releases. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
