title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  mxcmmc: cancel data work and watchdog on remove\n\nmxcmci_remove() frees the host
  through the devm tail, but neither it nor\nmmc_remove_host() drains the driver's
  own asynchronous state.\nhost->watchdog, a 10 s timer armed on the DMA path in mxcmci_setup_data(),\n\
  is deleted only by the DMA- and IRQ-complete paths, which the remove path\ndoes
  not explicitly drain; it can therefore fire after the host is freed\nand dereference
  it in mxcmci_watchdog().  host->datawork, armed from the\nIRQ handler on the PIO
  path, is not cancelled by the remove path either.\n\nFree the devm-registered IRQ,
  then cancel datawork and delete the watchdog\nin mxcmci_remove(), before dma_release_channel().\
  \  Freeing the IRQ first\nkeeps a trailing handler from re-arming datawork between
  the cancel and\nthe host free.  Both callbacks are non-self-rearming.\n\nThis issue
  was found by an in-house static analysis tool."
