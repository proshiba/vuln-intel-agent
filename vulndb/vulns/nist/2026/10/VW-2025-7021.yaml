title: A security flaw has been discovered in JhumanJ OpnForm up to 1.9.3. The 
  impacted element is an unknown function of the component API Endpoint. The 
  manipulation results in cross-site request forgery. The attack may be 
  performed from remote. The exploit has been released to the public and may be 
  exploited. The vendor has stated that API calls require authentication through
  Authorization Bearer Tokens, so classic CSRF attacks do not apply here. An 
  attacker would need to possess the JWT through means such as XSS which were 
  mitigated, disabling any form of initial access.
