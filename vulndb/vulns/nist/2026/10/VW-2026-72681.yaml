title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Skip unsettled links in link iterator\n\nbpf_link_prime() inserts a link into link_idr
  before anon_inode_getfile()\nsucceeds and before bpf_link_settle() publishes the
  ID in link->id.\nbpf_link_by_id() treats such an ID-zero link as unsettled, but
  the link\niterator takes a reference without this check.\n\nIf anon_inode_getfile()
  then fails, the creator removes the ID and frees\nits still-private link directly.\
  \  The iterator is left with a dangling\nreference and its next bpf_link_put() accesses
  freed memory.\n\nTreat ID-zero entries as transient in bpf_link_get_curr_or_next(),
  just as\nbpf_link_by_id() does.\n\n  BUG: KASAN: slab-use-after-free in bpf_link_put\n\
  \  Write of size 8 by task exp/384\n  Call Trace:\n  bpf_link_put              \
  \      kernel/bpf/syscall.c:3372\n  bpf_link_seq_next               kernel/bpf/link_iter.c:33\n\
  \  bpf_seq_read                    kernel/bpf/bpf_iter.c:158\n  vfs_read       \
  \                 fs/read_"
