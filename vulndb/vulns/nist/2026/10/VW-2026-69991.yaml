title: In Bouncy Castle for Java before 1.86, the raw JCA provider's legacy 
  PBES1 (PKCS#5 scheme 1) and PKCS#12 PBE families ran their password-based key 
  derivation with an iteration count taken from untrusted input without bounding
  it, so a small input could dictate an arbitrary amount of work before anything
  could be verified. The AlgorithmParameters implementations (PKCS12PBE and its 
  object identifier aliases, and PBKDF1) accepted any count from an encoded 
  PKCS12PBEParams or PBEParameter, narrowing a value beyond the int range with 
  intValue(), and every Cipher, Mac and SecretKeyFactory in these families 
  derived with whatever count it was given, including one decoded by another 
  provider's AlgorithmParameters, as when 
  javax.crypto.EncryptedPrivateKeyInfo.getKeySpec() decrypts a PKCS#12 
  PBE-protected private key with BC. Both the parameter parse and the 
