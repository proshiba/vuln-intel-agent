title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  use hlist_del_init_rcu for state_cache and state_cache_input\n\nCommit 14acf9652e56
  (\"xfrm: defensively unhash xfrm_state lists in\n__xfrm_state_delete\") converted
  bydst/bysrc/byseq/byspi from\nhlist_del_rcu() to hlist_del_init_rcu() so that a
  second\n__xfrm_state_delete() on the same object becomes a no-op rather than a\n\
  write through LIST_POISON pprev. It missed state_cache and\nstate_cache_input, which
  kept hlist_del_rcu():\n\n- hlist_del_rcu() leaves pprev = LIST_POISON2 (non-NULL),
  so\n  hlist_unhashed() returns false.\n- hlist_del_init_rcu() leaves pprev = NULL,
  so hlist_unhashed()\n  returns true.\n\nA second __xfrm_state_delete() therefore
  enters __hlist_del() on the\nalready-deleted state_cache/state_cache_input nodes
  and does\nWRITE_ONCE(*pprev, next) through LIST_POISON2 — a write use-after-free\n\
  once the slab is reused. The corruption can in turn cause a subsequent\nhlist_for_each_entry_rcu
  traversal to follow a dangl"
