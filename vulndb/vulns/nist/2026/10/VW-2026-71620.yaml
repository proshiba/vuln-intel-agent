title: Backstage is an open framework for building developer portals. Prior to 
  4.1.0, the @backstage/plugin-scaffolder-backend package is affected by 
  sensitive information exposure in scaffolder task logs. An authenticated user 
  who can create and read scaffolder tasks may be able to observe sensitive 
  values in task logs in deployments with restrictive action permissions and 
  affected templates. Exploitation requires a denied action whose input contains
  such a value. This issue is fixed in version 4.1.0.
