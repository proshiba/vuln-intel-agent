title: A vulnerability has been found in 1Panel-dev MaxKB up to 2.4.2. Impacted 
  is an unknown function of the file ui/src/chat.ts of the component MdPreview. 
  Such manipulation leads to cross site scripting. The attack can be executed 
  remotely. The exploit has been disclosed to the public and may be used. 
  Upgrading to version 2.5.0 is recommended to address this issue. The name of 
  the patch is 7230daa5ec3e6574b6ede83dd48a4fbc0e70b8d8. It is advisable to 
  upgrade the affected component. The vendor was contacted early, responded in a
  very professional manner and quickly released a fixed version of the affected 
  product.
