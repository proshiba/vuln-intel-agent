title: "Weaver e-Bridge contains an unauthenticated arbitrary file read vulnerability
  that allows remote attackers to access arbitrary files on the host system by supplying
  a file: URL to the downloadUrl parameter of the saveYZJFile endpoint. Attackers
  can exploit this flaw to read sensitive files such as /etc/passwd or configuration
  and credential files, and the same endpoint's support for http(s) URLs also enables
  server-side request forgery against internal network resources. Exploitation evidence
  was first observed by the Shadowserver Foundation on 2023-10-17."
