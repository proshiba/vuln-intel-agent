title: "Heap buffer overflow in the HLL sketch deserialization of Apache DataSketches
  C++ (repo: datasketches-cpp).\n\nWhen deserializing a sketch in LIST mode, from
  either a byte buffer or a stream, the coupon count was read from the input and used
  as the number of entries to copy into a fixed buffer of 8 entries, without checking
  it against the buffer's capacity. A crafted sketch could cause a write of up to
  988 bytes past the end of this internal heap buffer. This can corrupt heap memory,
  causing a crash and potentially enabling further exploitation.\n\nThis issue affects
  Apache DataSketches C++: from 1.0.0-incubating before 5.3.0. Only applications that
  deserialize HLL sketches from untrusted sources are affected.\n\nUsers are recommended
  to upgrade to version 5.3.0, which fixes this issue."
