title: HortusFox before 6.2 contains a remote code execution vulnerability in 
  ThemeModule::startImport() where an uploaded ZIP archive is extracted directly
  into the public web root before any validation of file names, extensions, or 
  content is performed. An authenticated administrator can upload a crafted 
  theme archive containing a PHP file and an .htaccess file to re-enable 
  execution, then request it under the themes directory to execute arbitrary OS 
  commands as the web-server user.
