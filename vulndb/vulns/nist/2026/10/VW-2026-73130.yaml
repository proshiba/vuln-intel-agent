title: zotero-mcp 0.10.0 through 0.14.1 contains a server-side request forgery 
  vulnerability that allows attackers to reach internal services because 
  _fetch_embedded_metadata fetches URLs without destination validation. 
  Attackers can steer the agent via prompt injection into calling 
  zotero_add_by_url, causing requests to loopback, private, or link-local hosts 
  directly or via redirects, leaking citation meta-tags and error details.
