title: The Design Import/Export plugin for WordPress is vulnerable to SQL 
  Injection via XML File Import in all versions up to, and including, 2.2 due to
  insufficient escaping on the user supplied parameter and lack of sufficient 
  preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with administrator-level access, to append additional
  SQL queries into already existing queries that can be used to extract 
  sensitive information from the database.
