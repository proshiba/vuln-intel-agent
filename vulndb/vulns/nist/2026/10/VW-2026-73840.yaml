title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/cache:
  Decouple sched_cache_group from mm to fix UAF\n\nCurrently the sched cache grouping
  is by mm and the scheduling statistics\nsched_cache_stat lives in the mm structure.\
  \  This ties the life cycle\nof scheduling stats with mm.\n\nIn account_mm_sched(),
  the scheduling stats are accessed by\ntask->mm->sc_stat.  However, a task may be
  switching mm on one CPU when\nanother CPU is running account_mm_sched(), and possibly
  accessing the\nold mm that was freed.  This problem was found when running tests
  with\nKASAN by Hyunwoo:\n\n  https://lore.kernel.org/lkml/apPb-Dr4nPYuHQOK@v4bel/\n\
  \nInstead of serializing the mm access by introducing extra acquisition of\nrq lock
  in the mm free path, extract sched_cache_stat from mm_struct,\nrename it as sched_cache_group
  and manage its life cycle apart from\nmm_struct with its own ref counting.  This
  allows us in the next patch\naccess sched_cache_group directly from task, and add
  a refcount\non "
