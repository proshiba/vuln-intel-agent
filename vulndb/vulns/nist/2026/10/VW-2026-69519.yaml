title: The Dc Woocommerce Multi Vendor plugin for WordPress is vulnerable to SQL
  Injection via the 'order_by' parameter of the 
  /multivendorx/v1/compliance/report-abuse REST endpoint in versions up to and 
  including 5.0.18. This is due to insufficient escaping on the user supplied 
  parameter and lack of sufficient preparation on the existing SQL query — the 
  value is concatenated directly into an ORDER BY clause where esc_sql() (which 
  only neutralizes characters needed to break out of quoted string literals) 
  provides no protection. This makes it possible for authenticated attackers, 
  with vendor-level access and above (users granted the 'edit_stores' 
  capability), to append additional SQL queries into already existing queries 
  that can be used to extract sensitive information from the database.
