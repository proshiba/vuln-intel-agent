title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Reject unregistering netdevs in ib_get_eth_speed\n\nib_device_get_netdev() intentionally
  returns a referenced net_device even\nwhen it is unregistering, so matching and
  cleanup callers can still find\nthe association. The reference keeps struct net_device
  allocated, but does\nnot guarantee that the device remains operational.\n\nib_get_eth_speed()
  uses the returned device operationally by invoking its\nethtool callback. Although
  that call is made under RTNL, the function does\nnot verify the registration state
  first. An asynchronous RDMA port query\ncan therefore call into a netdev after NETDEV_UNREGISTER
  and ndo_uninit\nhave completed.\n\nCheck for NETREG_REGISTERED while holding RTNL
  and return -ENODEV for a\ndevice which is being unregistered. Keeping RTNL across
  the check and the\nethtool operation prevents unregister from starting between them.\n\
