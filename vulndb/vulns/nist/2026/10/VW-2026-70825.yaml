title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  core: Cancel SDIO IRQ work before freeing host\n\nA host controller that uses sdio_signal_irq()
  schedules host->sdio_irq_work\nfrom its interrupt handler.  That work is only cancelled
  on the suspend\npath (mmc_sdio_suspend()), not on the remove/free path, so a worker
  armed\njust before the controller freed its IRQ can run after\nmmc_host_classdev_release()
  has freed the host and dereference it through\ncontainer_of().\n\nCancel host->sdio_irq_work
  in mmc_free_host(), like the existing\nhost->detect drain added by commit 1036f69e2513
  (\"mmc: core: Cancel\ndelayed work before releasing host\").\n\nThis issue was found
  by an in-house static analysis tool."
