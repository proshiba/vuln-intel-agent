title: Kunstmaan CMS is an open source content management system based on the 
  Symfony framework. Prior to 7.3.2, 
  src/Kunstmaan/MediaBundle/Helper/File/FileHandler.php performs the 
  blacklisted_extensions check case-sensitively in FileHandler::getFilePath and 
  lowercases the stored extension afterward. An authenticated backend user with 
  media access can upload a mixed-case executable extension such as PHP that 
  bypasses the check and is stored in the web-accessible media directory with an
  executable lowercase extension. The default blacklist also omits several 
  server-executable extension types, allowing the same code-execution impact 
  where the web server executes uploaded files. This issue is fixed in version 
  7.3.2.
