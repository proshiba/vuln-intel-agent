title: A weakness has been identified in WebAssembly wabt up to 1.0.39. This 
  vulnerability affects the function wabt::AST::InsertNode of the file 
  /src/repro/wabt/bin/wasm-decompile of the component wasm-decompile. This 
  manipulation causes memory corruption. It is possible to launch the attack on 
  the local host. The exploit has been made available to the public and could be
  used for attacks. Unfortunately, the project has no active maintainer at the 
  moment. In a reply to the issue report somebody recommended to the researcher 
  to provide a PR himself.
