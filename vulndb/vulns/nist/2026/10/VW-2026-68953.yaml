title: An optional, separately licensed repository-connector feature in 
  Kiteworks Core did not neutralize special characters in a user-supplied path 
  before passing it to an external command. An authenticated system 
  administrator could inject additional commands and write arbitrary content to 
  files owned by the service account running the connector, enabling code 
  execution in that account's context; exploitation additionally requires 
  network egress from the appliance to a system under the attacker's control.
