title: A vulnerability was identified in Freedesktop Poppler up to 26.08.0. 
  Affected is the function SplashClip::clipToPath of the file 
  splash/SplashClip.cc. Such manipulation leads to integer overflow. The attack 
  can only be performed from a local environment. The exploit is publicly 
  available and might be used. Upgrading to version 26.09.0 is able to address 
  this issue. The name of the patch is 323c91036d99926a8b90dc14329f7b40aece22f8.
  It is recommended to upgrade the affected component.
