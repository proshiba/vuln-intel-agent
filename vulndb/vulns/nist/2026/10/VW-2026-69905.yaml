title: Formbricks before 5.4.4 and 6 before 6.0.1 allows stored XSS. The 
  survey-level Custom Head Scripts feature did not enforce the documented Manage
  permission boundary. A workspace member holding only readWrite permission 
  could configure Custom Head Scripts on a survey, an operation the 
  documentation restricts to the Manage role. Because the configured scripts 
  execute in the authenticated browser session of any user who opens the 
  affected survey, a lower-privileged member can run arbitrary JavaScript 
  (stored cross-site scripting) in the session of higher-privileged users. Fixed
  versions require Manage access to modify survey Custom Head Scripts.
