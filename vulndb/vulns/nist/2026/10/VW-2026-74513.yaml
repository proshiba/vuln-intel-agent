title: A vulnerability was found in EricLBuehler Mistral.rs up to 0.9.3. The 
  affected element is the function calibration_apply of the file 
  mistralrs-server-core/src/handlers.rs. Performing a manipulation of the 
  argument save_cimatrix results in path traversal. The attack may be initiated 
  remotely. The exploit has been made public and could be used. Upgrading to 
  version 0.9.4 is sufficient to fix this issue. The patch is named 
  8c81056712709b4845ec6d9531e4d35bab4a367c. It is suggested to upgrade the 
  affected component.
