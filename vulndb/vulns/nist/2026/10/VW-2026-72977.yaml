title: The LifterLMS – WP LMS for eLearning, Online Courses, & Quizzes plugin 
  for WordPress is vulnerable to PHP Object Injection in all versions up to, and
  including, 10.2.1 via deserialization of untrusted input . This makes it 
  possible for authenticated attackers, with custom-level access and above, to 
  inject a PHP Object. No known POP chain is present in the vulnerable software,
  which means this vulnerability has no impact unless another plugin or theme 
  containing a POP chain is installed on the site. If a POP chain is present via
  an additional plugin or theme installed on the target system, it may allow the
  attacker to perform actions like delete arbitrary files, retrieve sensitive 
  data, or execute code depending on the POP chain present. This vulnerability 
  is only exploitable during lesson creation when a temporary lesson ID triggers
  the custom metadata path, and requires the attacker to hold a role with the 
  edit_course capability, such as Instructor, Instructor's Assistant, LMS 
  Manager
