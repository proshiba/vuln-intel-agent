title: The Magic Tooltips For Contact Form 7 plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via the 'author' parameter in all versions up 
  to, and including, 1.0.34 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. This is possible because the plugin's esc_html filter callback 
  decodes HTML-entity-encoded payloads (e.g. those containing '&lt;tip&gt;') 
  back into live HTML, meaning an entity-encoded script payload submitted as a 
  comment author name — which bypasses sanitize_text_field — is rendered as 
  executable markup when an administrator views wp-admin/edit-comments.php.
