title: The PixelYourSite plugin for WordPress is vulnerable to Sensitive 
  Information Exposure in all versions up to, and including, 11.1.5 through 
  publicly exposed log files. This makes it possible for unauthenticated 
  attackers to view potentially sensitive information contained in the exposed 
  log files, when the "Meta API logs" setting is enabled (disabled by default). 
  The vulnerability was partially patched in version 11.1.5 and fully patched in
  version 11.1.5.1.
