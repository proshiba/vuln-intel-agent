title: "MultiversX's multisig-improved (repository: mx-multisig-and-modules) reference
  implementation of their on-chain multisig smart contract system contains a vulnerability
  where a missing independent authorization check allows any account with the Proposer
  role to perform explicitly barred actions. This vulnerability allows the Proposer
  role to move funds alone, draining 100% of a contract's EGLD/ESDT balance in two
  transactions with zero signatures."
