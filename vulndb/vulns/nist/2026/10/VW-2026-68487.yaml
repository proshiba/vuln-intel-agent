title: An authenticated user can list alert rules stored in folders they are not
  allowed to read through the alert rules API list endpoint. When the set of 
  folders the user may read was empty, the folder restriction was dropped and 
  every alert rule in the organization was returned. From Grafana 13.1.0, any 
  user can trigger this with a folder filter. The exposed data is rule 
  configuration; data source credentials are not exposed.
