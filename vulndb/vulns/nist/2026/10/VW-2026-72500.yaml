title: FFmpeg through 9.0.2 contains an infinite loop vulnerability in 
  ff_rtsp_connect() in libavformat/rtsp.c that follows RTSP 3xx redirects 
  without any redirect limit. Attackers controlling an RTSP server can answer 
  every request with a 302 redirect to itself or another server, causing endless
  reconnects that saturate a CPU core.
