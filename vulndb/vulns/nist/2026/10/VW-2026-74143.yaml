title: Gitoxide gix-pack before 0.75.0 contains an uncontrolled memory 
  allocation vulnerability that allows remote attackers to abort the process by 
  supplying a huge pack-header object count. Malicious remotes can serve a 
  12-byte pack header claiming 0xFFFFFFFF objects, forcing Tree::with_capacity 
  to reserve hundreds of gigabytes and crash clone or fetch operations.
