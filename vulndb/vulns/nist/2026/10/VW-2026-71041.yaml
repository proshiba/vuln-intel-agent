title: Microsoft UFO is an open-source framework for intelligent automation 
  across devices and platforms. Prior to 3.0.9, the run_shell tool in the 
  CommandLineExecutor component of 
  ufo/client/mcp/local_servers/cli_mcp_server.py validates only the first token 
  of the bash_command parameter and permits explorer.exe. On Windows, 
  explorer.exe delegates its following path argument to ShellExecute, so an 
  attacker-influenced agent call can launch an arbitrary executable or script as
  the desktop user even though the subprocess uses shell=False. Exploitation 
  depends on a user running an affected agent workflow and on inducing the tool 
  call, but successful execution can access or modify that user's files, tokens,
  and sessions. This issue is fixed in version 3.0.9.
