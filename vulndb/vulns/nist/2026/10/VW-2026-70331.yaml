title: Plane is an open-source project management tool. Prior to 1.4.0, Plane 
  validates GITEA_HOST only for its URL scheme and does not reject hosts that 
  resolve to private or internal IP addresses. The four outbound requests in the
  Gitea OAuth flow are derived from this unvalidated host and do not call 
  validate_url(). In addition, avatar_url is taken from the Gitea user's 
  profile, where users can configure external avatar URLs. After an 
  administrator enables Gitea OAuth for a legitimate instance, a Gitea user can 
  set an internal URL as the profile avatar and log in through Gitea, causing 
  Plane to fetch the internal target without validation. This issue is fixed in 
  1.4.0.
