title: A flaw has been found in Ziroom ZHOME A0101 1.0.1.0. This vulnerability 
  affects the function set_time_zone of the file /api/ZRFirmware/set_time_zone. 
  This manipulation of the argument hostname/zonename causes command injection. 
  It is possible to initiate the attack remotely. The exploit has been published
  and may be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
