title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability 
  that allows low-privileged authenticated users to delete category dictionary 
  entries via DELETE /sys/category/deleteBatch. Attackers can obtain node ids 
  from the unguarded rootList and childList endpoints and submit them to 
  recursively delete entire sys_category subtrees, breaking dependent forms and 
  dictionary fields.
