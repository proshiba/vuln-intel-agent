title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_codec: validate vendor codec count length\n\nThe Read Local Supported Codecs
  parsers consume the variable-sized\nstandard codec array before parsing the vendor
  codec count.  Although the\ninitial reply-size check includes a vendor count byte
  in the fixed layout,\nit does not guarantee that the byte remains after the standard
  codec array.\n\nIf a controller reply ends immediately after that array, calculating
  the\nvendor codec array size reads vnd_codecs->num beyond the skb data.  Use\nskb_pull_data()
  to validate and consume each codec header before using its\ncount in both command
  variants."
