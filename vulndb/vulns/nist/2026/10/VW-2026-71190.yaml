title: A missing authorization vulnerability was identified in GitHub Enterprise
  Server that allowed a repository collaborator with write access to delete the 
  current default branch through the GraphQL API and cause an 
  attacker-controlled branch to become the new default. In repositories that 
  required pull-request review but did not restrict branch deletion, this 
  bypassed the review requirement and caused fresh clones and default-branch API
  requests to use attacker-controlled content. This vulnerability affected 
  supported GitHub Enterprise Server releases in the 3.18, 3.19, 3.20, 3.21, and
  3.22 series and was fixed in versions 3.18.16, 3.19.13, 3.20.9, 3.21.7, and 
  3.22.2. This vulnerability was reported via the GitHub Bug Bounty program.
