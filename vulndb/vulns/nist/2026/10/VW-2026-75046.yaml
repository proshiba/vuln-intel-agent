title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.62.3 through 0.70.5, 
  ClassRepresentation.render_metaclass inserts a schema-controlled Avro record 
  name into the quoted Meta.schema_name field of generated Python source without
  escaping it. A crafted name can terminate the string literal and inject 
  statements into the generated class body, which execute when the generated 
  module is imported. Version 0.70.6 fixes the vulnerability by escaping schema 
  values rendered into generated string literals.
