title: "Ash stores :atom-typed attributes as strings and compares them as strings.
  When such an attribute is referenced in a filter, the comparison value is coerced
  through Ash.Type.Atom. Because the type defined no coerce/2 callback, coercion fell
  back to the default (cast_input/2), which calls String.to_atom/1 when the attribute
  is configured with the unsafe_to_atom?: true constraint.\n\nFiltering such an attribute
  with attacker-controlled strings therefore interned a new, permanent atom for every
  distinct value. Atoms are never garbage collected and the BEAM caps the atom table,
  so an actor who can supply filter values for a public, filterable :atom attribute
  declared with unsafe_to_atom?: true can exhaust the atom table and crash the node
  (denial of service). AshPaperTrail is a notable example: its version resources expose
  a public, filterable version_action_name atom attribute with unsafe_to_atom?: true
  by default.\n\nThe fix adds a coerce/2 to Ash.Type.Atom that never interns atoms
  — a compa"
