  vulnerability in host firmware configuration parsing. An attacker with 
  authenticated service-level access to the service processor can write 
  specially crafted configuration data, causing the host firmware boot stack to 
  crash with possible memory corruption during system initialisation, resulting 
  in an integrity and availability impact to the managed system.
