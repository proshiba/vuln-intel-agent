title: "A vulnerability was identified in Artifex Ghostscript up to 10.09.0. Affected
  is the function type1_callsubr of the file devices/vector/gdevpsfx.c of the component
  Pdfwrite. The manipulation leads to stack-based buffer overflow. Remote exploitation
  of the attack is possible. The exploit is publicly available and might be used.
  It is suggested to install a patch to address this issue. A solution was implemented:
  \"I've chosen to fix this slightly differently by using the defined macro in the
  font parsing loop rather than in the callsubr function, because this better matches
  the pattern of 'normal' usage.\""
