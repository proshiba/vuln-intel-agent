title: Kiteworks Email Protection Gateway before version 9.5.0 is vulnerable to 
  Server-Side Request Forgery (SSRF). A server-side request forgery (SSRF) 
  weakness in Kiteworks Email Protection Gateway could allow a remote, 
  unauthenticated attacker to induce the gateway to issue crafted requests to 
  internal or otherwise unintended network destinations. The requests are 
  triggered while the gateway retrieves an issuer certificate in an inbound 
  message. Depending on the services reachable from the gateway, this could 
  disclose sensitive internal information or disrupt gateway operation.
