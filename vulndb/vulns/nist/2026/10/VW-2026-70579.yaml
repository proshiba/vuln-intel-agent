title: A flaw was found in SSSD's NFS idmap plugin. When retrieving cached user 
  or group names, the plugin detects if an entry exceeds the destination buffer 
  size but fails to abort before copying data. A local attacker can trigger this
  vulnerability by requesting identity lookups that resolve to oversized cached 
  entries, resulting in an out-of-bounds write. This flaw primarily leads to a 
  Denial of Service (DoS) by crashing the identity mapping service, and may also
  corrupt adjacent process memory.
