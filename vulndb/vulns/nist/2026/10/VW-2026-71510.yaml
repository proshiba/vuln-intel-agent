title: Handlebars provides the power necessary to let users build semantic 
  templates. From 4.0.0 until 4.7.10, Handlebars.compile() and 
  Handlebars.precompile() accept pre-parsed AST objects while validating only 
  selected PathExpression, NumberLiteral, and BooleanLiteral values. This issue 
  bypasses the AST validation introduced in version 4.7.9 for CVE-2026-33937. An
  attacker who can supply an object instead of a template string can place 
  JavaScript expressions in unchecked values such as Program.blockParams.length,
  a non-PathExpression parameter depth, a non-string StringLiteral.value, or a 
  non-string PathExpression.original. The compiler emits those values into 
  generated JavaScript, causing code execution in the server process when 
  compile output renders or wherever precompile output is loaded. Applications 
  that pass only template strings are not affected. This issue is fixed in 
  version 4.7.10.
