title: The Booking Calendar WordPress plugin before 11.8 does not generate its 
  per-booking access hashes with sufficient entropy, deriving each from a 
  low-entropy time-seeded value, which can allow unauthenticated attackers who 
  are able to determine a booking's creation time to predict the hash and then 
  read that booking's personal data or modify the booking in place.
