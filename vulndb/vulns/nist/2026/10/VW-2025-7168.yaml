title: "ServiceNow has addressed a reflected cross-site scripting vulnerability that
  was identified in the ServiceNow AI Platform. This vulnerability could result in
  arbitrary code being executed within the browsers of ServiceNow users who click
  on a specially crafted link.  \n\nServiceNow has addressed this vulnerability by
  deploying a relevant security update to the majority of hosted instances.  Relevant
  security updates also have been provided to ServiceNow self-hosted customers, partners,
  and hosted customers with unique configurations. Further, the vulnerability is addressed
  in the listed patches and hot fixes. We recommend customers promptly apply appropriate
  updates or upgrade if they have not already done so."
