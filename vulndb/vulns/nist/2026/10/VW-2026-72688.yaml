title: "Uncontrolled Recursion vulnerability in Protobuf.JSON.Decode in elixir-protobuf
  protobuf allows an unauthenticated remote attacker to crash the decoding process
  via a deeply nested JSON document. Any application that decodes attacker-supplied
  JSON with Protobuf.JSON.decode/3, Protobuf.JSON.decode!/3, or Protobuf.JSON.from_decoded/3
  into a schema that contains a self-referential or cyclic message type is affected.\n\
  \nIn lib/protobuf/json/decode.ex, the embedded-message clause of decode_singular/3
  recurses into internal_from_json_data/3 once per nesting level without incrementing
  or checking the decoder's depth counter. The depth guard increase_depth_and_maybe_throw/1
  covers only the Google.Protobuf.ListValue and Google.Protobuf.Struct clauses, so
  the recursion_limit option has no effect on user-defined message types. Each nesting
  level allocates a stack frame and heap objects, and a sufficiently deep document
