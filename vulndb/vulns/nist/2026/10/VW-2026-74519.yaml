title: "The Bluetooth Mesh Access-layer delayable message queue in subsys/bluetooth/mesh/delayable_msg.c
  shares three intrusive lists (busy_ctx, free_ctx, free_chunks) and one k_work_delayable
  between two cooperative threads with no synchronization: bt_mesh_delayable_msg_manage()
  runs on the Bluetooth host RX thread, while delayable_msg_handler() runs on the
  system workqueue. Both block while the lists are in an intermediate state — the
  enqueuer in bt_rand(), both in bt_mesh_access_send() — which lets the other context
  observe torn state. delayable_msg_handler() used the result of sys_slist_get() on
  busy_ctx without a NULL check, and allocate_delayable_msg_ctx() tested sys_slist_is_empty()
  and then assumed a separate sys_slist_get() would succeed.\n\nBecause CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG
  and CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG_CTX_ENABLED default to y, every model response
  to a received mesh message is parked on this queue, so the enqueuer runs as a direct
  consequence of inbound traffic. A"
