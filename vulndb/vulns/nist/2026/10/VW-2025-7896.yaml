title: The PixelYourSite – Your smart PIXEL (TAG) & API Manager plugin for 
  WordPress is vulnerable to Cross-Site Request Forgery in all versions up to, 
  and including, 11.1.2. This is due to missing or incorrect nonce validation on
  the adminEnableGdprAjax() function. This makes it possible for unauthenticated
  attackers to modify GDPR settings via a forged request granted they can trick 
  a site administrator into performing an action such as clicking on a link.
