title: "In Search Guard FLX versions 3.1.1 and earlier, Field-Level Security (FLS)
  rules are improperly enforced on object-valued fields.\n\n\nWhen an FLS exclusion
  rule (e.g., ~field) is applied to a field which contains an object as its value,
  the object is correctly removed from the _source returned by search operations.
  However, the object members (i.e., child attributes) remain accessible to search
  queries. This exposure allows adversaries to infer or reconstruct the original contents
  of the excluded object.\n\n\n\n\nWorkaround - If you cannot upgrade immediately
  and FLS exclusion rules are used for object valued attributes (like ~object), add
  an additional exclusion rule for the members of the object (like ~object.*)."
