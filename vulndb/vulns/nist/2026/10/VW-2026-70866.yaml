title: "In the Linux kernel, the following vulnerability has been resolved:\n\nswiotlb:
  use the adjusted address for the highmem page lookup\n\nswiotlb_bounce() reads the
  page frame number from the slot's recorded\norig_addr, then advances orig_addr by
  tlb_offset to reach the address\nthe caller asked about. The highmem branch mixes
  the two: the offset\nwithin the page comes from the adjusted address, the page from
  the value\nbefore it.\n\nOnce the adjustment crosses a page boundary the pair no
  longer describes\none location, and the whole copy lands one page below the intended
  one\nfor a positive tlb_offset, one above for a negative one. DMA_FROM_DEVICE\n\
  writes the device data over the wrong page and leaves the intended one\nstale, DMA_TO_DEVICE
  feeds the device from a page the mapping may not\ncover. Partial syncs through dma_sync_single_range_for_*()
  are what make\ntlb_offset non-zero.\n\nThe branch test is picked the same way, so
