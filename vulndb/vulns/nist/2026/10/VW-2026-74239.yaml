title: A flaw was found in Quarkus REST Data Panache. This vulnerability allows 
  unauthenticated attackers to bypass security controls on generated endpoints. 
  When a developer customizes a specific operation using @MethodProperties 
  without explicitly re-declaring security roles, the code generator silently 
  drops class-level security requirements. This results in the affected endpoint
  defaulting to permissive, unauthenticated access, potentially leading to 
  unauthorized information disclosure or data modification.
