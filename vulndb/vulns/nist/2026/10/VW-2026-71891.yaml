title: LMCache through 0.5.5 contains a missing authentication vulnerability in 
  the multiprocess coordinator that allows remote unauthenticated attackers to 
  access its HTTP fleet control API listening on all interfaces by default. 
  Attackers can register or deregister instances via /instances, overwrite 
  quotas via /quota endpoints, inject events via /events, and enumerate 
  /directory/keys to disrupt caching and disclose placement metadata.
