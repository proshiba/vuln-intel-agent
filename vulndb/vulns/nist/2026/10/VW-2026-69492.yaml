title: Exposure of the message authentication key through the encryption 
  keystream in the stream mode of IesEngine (an IesEngine constructed without a 
  block cipher) in Legion of the Bouncy Castle Inc. bc-csharp before 2.7.0 
  allows a remote attacker who has observed one encrypted message with known 
  plaintext to forge shorter messages of their choosing that the recipient 
  accepts as authentic, via a crafted ciphertext and MAC tag, because the MAC 
  key was taken from the key derivation output directly after a keystream as 
  long as the message, while the derivation input depends only on the static key
  pair and fixed parameters. The keystream revealed by that one message 
  therefore contains the MAC key for every sufficiently shorter message.
