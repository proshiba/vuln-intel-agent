title: "CVE-2026-7173: Cross-Site Scripting vulnerability in Entradium, by Crocantickets.
  Exploitation of this vulnerability could allow a remote attacker to send a specially
  crafted URL to the victim and steal their session data.\n\n  *  (Stored XSS) The
  City parameter in the endpoint /events/<event_name>/edit_general during the process
  of creating or editing events assigned to a promoter allows for the injection of
  JavaScript that will execute on the event’s public page.\n  *  (Reflected XSS) The
  Description parameter in the endpoint /events/<event_name>/edit-general when attempting
  to create or modify an event without filling in all required fields."
