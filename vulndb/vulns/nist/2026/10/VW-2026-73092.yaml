title: The Divi Plus plugin for WordPress is vulnerable to Arbitrary File Read 
  in versions up to, and including, 2.4.0 via the 'svg_image' parameter of the 
  /wp-json/elicus/v1/dipl-modules/svg-animator REST endpoint. This is due to the
  endpoint's permission callback (SVGAnimatorController::index_permission) 
  returning true unconditionally combined with insufficient validation of the 
  'svg_image' input — sanitize_text_field() and esc_html() do not restrict 
  filesystem paths, the file:// stream wrapper, or arbitrary URLs — before it is
  passed to file_get_contents() (with a wp_remote_get() fallback) and the raw 
  response body is returned in the JSON 'html' field. This makes it possible for
  unauthenticated attackers to read arbitrary files on the affected site's 
  server which may make remote code execution possible.
