title: "The JSON API Auth plugin for WordPress is vulnerable to Authentication Bypass
  via Cached Session Cookie Disclosure in all versions up to, and including, 3.1.2.
  The vulnerability exists because the required PI-Media/json-api parent plugin caches
  controller dispatch results in transients keyed solely by URI and query string,
  ignoring HTTP method and POST body; this causes the `generate_auth_cookie()` endpoint
  — which embeds a live WordPress `logged_in` cookie produced by `wp_generate_auth_cookie()`
  directly in its JSON response body — to serve that cached authenticated response
  to any subsequent unauthenticated GET request to the same URI. This makes it possible
  for unauthenticated attackers to retrieve a valid Administrator `logged_in` session
  cookie from the cached response and use it to fully authenticate as the site Administrator,
  including via the same plugin's `get_currentuserinfo` endpoint and any cookie-authenticated
  controller action. Exploitation requires the PI-Media/json-api "
