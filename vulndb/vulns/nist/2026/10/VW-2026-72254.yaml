title: A flaw was found in Katello where the Flatpak Remote Repositories API 
  does not properly enforce authorization when accessing a flatpak remote 
  repository by identifier. An authenticated user with permission to view 
  flatpak remotes in one organization may be able to access flatpak remote 
  repository information belonging to another organization. The same unscoped 
  lookup is used by the mirror action, which may allow creating a repository in 
  a product the user can edit that is configured with another organization's 
  flatpak remote URL and stored remote credentials.
