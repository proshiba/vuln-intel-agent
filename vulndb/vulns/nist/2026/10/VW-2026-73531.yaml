title: thClaws through 0.141.0 contains a link-following vulnerability in the 
  post_inputs handler of the v1 API POST /v1/inputs endpoint that allows writes 
  outside the workspace by following symlinks. Attackers who plant a symlink 
  under the allowed inputs/ prefix can cause later authenticated uploads to 
  write or truncate files outside the workspace with daemon privileges.
