title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: get the wiphy out of a dying network namespace\n\nWhen a network namespace
  is destroyed, cfg80211_pernet_exit() moves any\nwiphy back to the initial namespace,
  and just warns if that fails. But\nmoving an interface can fail (due to allocation
  failures), and then the\nwiphy is left behind with a garbage netns pointer:\n\n\
  \  Kernel mode fault at addr 0x30\n  genlmsg_multicast_netns.constprop.0+0x46/0xcf
  [cfg80211]\n  nl80211_notify_wiphy+0xcd/0xe8 [cfg80211]\n  wiphy_unregister+0x169/0x3fc
  [cfg80211]\n\nNote that commit debac3a20dec (\"net: Remove conflicting altnames
  for\ndying netns in __dev_change_net_namespace().\") fixed another path\nthat could
  reach it without allocation failures.\n\nRemove interfaces that cannot be moved
  instead of failing the switch,\nso that the wiphy always ends up in the initial
  namespace. In this\ncase the netdev core will unregister the interfaces anyway."
