title: The Download Manager plugin for WordPress is vulnerable to privilege 
  escalation via account takeover in all versions up to, and including, 3.3.40. 
  This is due to the plugin not properly validating a user's identity prior to 
  updating their details like password. This makes it possible for 
  unauthenticated attackers to change user's passwords, except administrators, 
  and leverage that to gain access to their account.
