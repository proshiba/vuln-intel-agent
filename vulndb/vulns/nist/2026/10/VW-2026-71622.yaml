title: Backstage is an open framework for building developer portals. Prior to 
  4.1.0, the @backstage/plugin-scaffolder-backend package is affected by 
  improper input validation in scaffolder task list ordering. An authenticated 
  Backstage user with permission to create and read relevant scaffolder tasks 
  may be able to infer confidential task data under specific conditions. 
  Successful exploitation requires retained task secrets, visibility of a target
  task, knowledge of the secret structure, and repeated requests. This issue is 
  fixed in version 4.1.0.
