title: "In Bouncy Castle for Java before 1.86, the high-level OpenPGP certificate
  API accepted a third-party certification or trust delegation from any component
  key of the issuing certificate, without requiring that component to have been granted
  the authority to certify. OpenPGPCertificate.getCertificationBy() and getDelegationBy()
  resolve a third-party signature by matching its issuer key identifier against every
  key of the third-party certificate, then verify the issuing component's binding
  chain and the signature itself; nothing checked that the issuing component carried
  the RFC 9580 sec. 5.2.3.29 certification key flag (CERTIFY_OTHER) when the signature
  was created. A subkey bound only with SIGN_DATA - the online signing subkey of exactly
  the offline-primary arrangement those key flags exist to express - could therefore
  issue a positive User ID certification over an attacker-controlled identity, or
  a full-trust depth-one direct-key delegation of introducer trust, and the API returned
  it "
