title: UTMStack before 11.2.16 contains a missing authorization vulnerability in
  UTMIncidentCommandWebsocket.processCommand(), the handler mapped to the 
  /command/{hostname} STOMP destination, where no role check or command 
  allowlist is applied before forwarding supplied commands. Any authenticated 
  user, regardless of role, can send arbitrary operating-system commands over 
  gRPC to any connected agent, resulting in command execution on monitored 
  endpoints where agent processes commonly run as root or SYSTEM.
