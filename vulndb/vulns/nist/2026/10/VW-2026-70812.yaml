title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (hp-wmi-sensors) Fix use-after-free in fungible_show()\n\nnsensor->current_state
  is dynamically replaced as the sensor's state\nchanges. update_numeric_sensor_from_wobj()
  does this by freeing the\nold string and installing a new one:\n\n\tif (strcmp(trimmed,
  nsensor->current_state)) {\n\t\tnew_string = hp_wmi_strdup(dev, trimmed);\n\t\t\
  if (new_string) {\n\t\t\tdevm_kfree(dev, nsensor->current_state);\n\t\t\tnsensor->current_state
  = new_string;\n\t\t}\n\t}\n\nThis function is only ever called from hp_wmi_update_info()
  while\nstate->lock is held, so the free-and-replace itself is properly\nserialized
  against concurrent updates.\n\nfungible_show(), however, reads the same pointer
  after the lock has\nalready been dropped:\n\n\terr = hp_wmi_update_info(state, info);\n\
  \tif (err)\n\t\treturn err;\n\n\tswitch (prop) {\n\t...\n\tcase HP_WMI_PROPERTY_CURRENT_STATE:\n\
  \t\tseq_printf(seqf, \"%s\\n\", nsensor->current_state);\n\t\tbreak;\n\nhp_wmi_update_info()
  takes state->lock int"
