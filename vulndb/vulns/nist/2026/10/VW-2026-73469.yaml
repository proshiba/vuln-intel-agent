title: A security vulnerability has been detected in Casdoor up to 
  3.164.0/4.10.0. Affected is the function CasP3ProxyValidate of the file 
  controllers/cas.go of the component Proxy Validation. Such manipulation of the
  argument pgtUrl leads to server-side request forgery. The attack may be 
  performed from remote. The exploit has been disclosed publicly and may be 
  used. Upgrading to version 4.11.0 is able to address this issue. The name of 
  the patch is 
  03c6c9aaa2eda5b085ce128ce0d60b34094efbd9/ada08ecd10cbf158f593dee23a8bab63efecf995.
  It is advisable to upgrade the affected component.
