title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: vlan: fix bugs caused by switchdev deletion errors\n\nAllowing switchdev
  to prevent vlan deletion and error out in __vlan_del\ncould cause multiple different
  issues - inconsistent state, memory leaks\nwhen flushing, NULL pointer dereference
  on bridge error when flushing.\nIt doesn't make sense to allow it to stop __vlan_del,
  so log the error\nand continue with software vlan deletion. This is also consistent
  with\n8021q behaviour."
