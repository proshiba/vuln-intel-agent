title: Backstage is an open framework for building developer portals. Prior to 
  0.4.20, the @backstage/plugin-auth-backend-module-oidc-provider package is 
  affected by improper authentication in the oidc provider. Deployments using 
  OIDC email-based identity resolution with a provider that permits unverified 
  email addresses may allow an authenticated provider user to assume another 
  catalog identity. This may grant access and permissions associated with that 
  user. No direct availability impact is demonstrated. This issue is fixed in 
  version 0.4.20.
