title: Memory allocation with excessive size value in the DTLS handshake 
  reassembly (DtlsReliableHandshake, DtlsReassembler) in Legion of the Bouncy 
  Castle Inc. bc-csharp before 2.7.0 allows a remote unauthenticated DTLS peer 
  to cause a denial of service through memory exhaustion via crafted handshake 
  message fragments, because the reassembly buffer for each incoming handshake 
  message was allocated at the 24-bit length declared in the fragment header, 
  without the check against the peer's maximum handshake message size that TLS 
  already applied. A fragment carrying no payload can force an allocation of 
  almost 16 MB, for each of up to 16 pending messages per handshake, before the 
  handshake is authenticated. DTLS servers and DTLS clients are both affected; 
  TLS is not.
