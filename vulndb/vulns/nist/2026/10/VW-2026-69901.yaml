title: Kener 4.0.0 before 4.1.6 contains an information disclosure vulnerability
  that allows unauthenticated attackers to retrieve hidden or inactive monitor 
  data by querying dashboard API handlers lacking visibility filters. Attackers 
  can supply a known or guessed monitor tag to endpoints such as monitor-bar and
  monitor-latency-chart to obtain names, descriptions, status, uptime history 
  and latency.
