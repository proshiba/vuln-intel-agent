title: "Improper Encoding or Escaping of Output vulnerability in the RemoteSyslogAppender
  of Apache log4net.\n\nEvery character outside visible ASCII and space was removed
  from the record instead of being escaped, so non-ASCII text and control characters
  such as tabs disappeared without notice. A party whose data reaches a log message
  could make a distinct value look identical in the record, for example a user name
  holding a zero-width space logged as admin. Only applications that use RemoteSyslogAppender
  are affected.\n\nThis issue affects Apache log4net: from 1.2.12 before 3.5.0.\n\n\
  Users are recommended to upgrade to version 3.5.0, which fixes the issue."
