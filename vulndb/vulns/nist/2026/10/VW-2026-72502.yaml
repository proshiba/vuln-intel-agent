title: FFmpeg before 7.1.4 and 8.0.x before 8.0.2 contains a server-side request
  forgery vulnerability in ff_rtsp_connect() in libavformat/rtsp.c that follows 
  RTSP 3xx redirects without validating the Location URL. Malicious RTSP servers
  can redirect FFmpeg to internal hosts and ports under other schemes, bypassing
  -protocol_whitelist, to probe internal network services.
