title: KeePassXC is a cross-platform community-driven port of the Windows 
  application KeePass Password Safe. Prior to 2.8.0-beta1, KeePass1 / KDB legacy
  import retains raw Entry pointers in m_entryUuids after deleting metastream 
  entries. When a crafted, unlockable .kdb file contains an earlier metastream 
  entry followed by a KPX_CUSTOM_ICONS_4 metastream that references the earlier 
  UUID, parseCustomIcons4() calls Entry::setIcon through the stale pointer, 
  causing a heap use-after-free with a controlled write and a reliable process 
  crash. This issue is fixed in version 2.8.0-beta1.
