title: Path traversal vulnerability in the BugTracker.NET file download 
  component. The parameter used to specify the file name does not properly 
  validate user-supplied paths. An authenticated remote attacker could enter a 
  manipulated path to access files located outside the intended directory. 
  Successful exploitation could allow the attacker to read system files 
  accessible to the account used by the application.
