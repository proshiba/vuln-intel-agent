title: A vulnerability was identified in feelec-yishu feelcrm-os 1.0.0. This 
  vulnerability affects the function GroupController::index of the file 
  App/Feelcrm/Index/Controller/GroupController.class.php of the component 
  Department Search Endpoint. The manipulation of the argument keyword leads to 
  cross site scripting. The attack can be initiated remotely. The exploit is 
  publicly available and might be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
