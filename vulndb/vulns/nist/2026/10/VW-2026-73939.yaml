  allows low-privilege authenticated users to create tenant-wide master data via
  add and import endpoints lacking role checks. Attackers can send POST requests
  to endpoints like /account/add, /material/add, or /material/importExcel to 
  create settlement accounts, products with initial stock, departments and 
  dictionary entries.
