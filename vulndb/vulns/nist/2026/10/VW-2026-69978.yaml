title: The The Beaver Builder Page Builder – Drag and Drop Website Builder 
  plugin for WordPress is vulnerable to arbitrary shortcode execution in all 
  versions up to, and including, 2.11.0.5. This is due to the software allowing 
  users to execute an action that does not properly validate a value before 
  running do_shortcode. This makes it possible for unauthenticated attackers to 
  execute arbitrary shortcodes. Exploitation requires the target site to have a 
  Beaver Builder page containing the Sidebar module populated with a widget that
  displays attacker-controllable text, such as the core Recent Comments widget, 
  with comment moderation disabled or the attacker's comment approved.
