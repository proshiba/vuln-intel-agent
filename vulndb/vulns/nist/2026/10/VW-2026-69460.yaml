title: A security flaw has been discovered in calcom cal.diy up to 6.2.0. This 
  affects the function doesUserIdHaveAccessToBooking of the file 
  BookingAccessService.ts of the component PBAC Permission Engine. Performing a 
  manipulation results in missing authorization. The attack can be initiated 
  remotely. The exploit has been released to the public and may be used for 
  attacks. The pull request to fix this issue awaits acceptance.
