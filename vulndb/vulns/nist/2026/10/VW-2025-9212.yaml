title: 'A vulnerability was determined in Ilevia EVE X1 Server up to 4.6.5.0.eden.
  Impacted is an unknown function of the file /ajax/php/leaf_search.php. This manipulation
  of the argument line causes command injection. The attack can be initiated remotely.
  A high degree of complexity is needed for the attack. The exploitability is considered
  difficult. The exploit has been publicly disclosed and may be utilized. Upgrading
  the affected component is recommended. The vendor confirms the issue and recommends:
  "We already know that issue and on most devices are already solved, also it’s not
  needed to open the port to outside world so we advised our customer to close it".'
