title: ": Session Fixation / Session Reuse across Users vulnerability in Apache Jackrabbit.\n\
  \n\n\nJackrabbit WebDAV server attaches a cached authenticated session on any Lock-Token/TransactionId/SubscriptionId/If-header
  field token match with\n\nno credential check.\n\n\n\nThis issue affects Apache
  Jackrabbit: from 2.23.0 through 2.23.5, from 2.22.0 through 2.22.4, from 2.20.0
  through 2.20.17.\n\n\n\n\n\n\n\n\n\n\n\n\nUsers are recommended to upgrade to versions
  2.23.6, 2.22.5, or 2.20.18 which fix the issue."
