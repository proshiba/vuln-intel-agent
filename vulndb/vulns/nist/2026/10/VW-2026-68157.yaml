title: "A Buffer Copy without Checking Size of Input ('Classic Buffer Overflow') vulnerability
  in the advanced forwarding toolkit (evo-aftmand/evo-pfemand) of Juniper Networks
  Junos OS Evolved on PTX Series or QFX5000 Series allows an unauthenticated, adjacent
  attacker to cause a Denial of Service (DoS).An attacker sending crafted multicast
  packets will cause line cards running evo-aftmand/evo-pfemand to crash and restart
  or non-line card devices to crash and restart. Continued receipt and processing
  of these packets will sustain the Denial of Service (DoS) condition.\n\nThis issue
  affects Junos OS Evolved PTX Series:\n\n\n\n  *  All versions before 22.4R3-S8-EVO,\n\
  \  *  from 23.2 before 23.2R2-S5-EVO,\n  *  from 23.4 before 23.4R2-EVO,\n  *  from
