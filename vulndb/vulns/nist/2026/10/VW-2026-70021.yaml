title: OpenCTI is an open source platform for managing cyber threat intelligence
  knowledge and observables. Prior to version 6.8.3, an open redirect 
  vulnerability exists in the OpenCTI platform's SAML authentication endpoint 
  (/auth/saml/callback). By manipulating the RelayState parameter, an attacker 
  can force the server to issue a 302 redirect to any external URL, enabling 
  phishing, credential theft, and arbitrary site redirection. This issue has 
  been patched in version 6.8.3.
