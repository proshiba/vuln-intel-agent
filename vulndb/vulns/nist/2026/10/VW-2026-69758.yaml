title: "MISP contains an improper access control vulnerability in its attribute search
  and paginated attribute view endpoints.\n\nWhen a user queries for soft-deleted
  attributes (e.g., via the deleted-attributes search or the paginated attribute listing),
  the application returned soft-deleted attributes belonging to events owned by other
  organizations to any authenticated user who had visibility of the event. The event
  detail view correctly restricted soft-deleted attribute visibility to the owning
  organization and sync-permission users, but the attribute search and paginated view
  code paths lacked this restriction.\n\nPreconditions:\n\n- An authenticated MISP
  user with at least read access to an event owned by another organization.\n\n- The
  user issues a query for deleted attributes (search or paginated view with the deleted
  filter).\n\nImpact:\n\n- Confidentiality: Soft-deleted threat intelligence attributes
  (e.g., IOCs, indicators, context) from other organizations are disclosed to unauthorized
  users. "
