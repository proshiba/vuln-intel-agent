title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  mmci: Fix use-after-free in busy-timeout work\n\nux500_busy_complete() can queue
  ux500_busy_timeout_work for an R1b\ncommand, but mmci_remove() never cancels it.
  The work can subsequently\ndereference the devm-allocated mmci_host after it has
  been released.\n\nMask the controller interrupts and disable the delayed work during\n\
  removal. This drains any queued instance and stops an IRQ handler that\nis still
  in progress from queueing the work again once it has been\ndisabled.\n\nThis issue
  was found by an in-house static analysis tool."
