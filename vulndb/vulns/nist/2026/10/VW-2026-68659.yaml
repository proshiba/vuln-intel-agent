title: 'A weakness has been identified in GPAC up to 26.07.0. Affected by this issue
  is the function gf_dash_resolve_url of the file src/media_tools/dash_client.c of
  the component DASH Client. This manipulation causes buffer overflow. The attack
  is possible to be carried out remotely. Upgrading to version abi-16.26 can resolve
  this issue. Patch name: 4c8e26f278ff63eec57968f7bc696f604bb0cffd. It is recommended
  to upgrade the affected component.'
