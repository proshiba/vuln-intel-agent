title: A security flaw has been discovered in jishenghua jshERP up to 3.5. 
  Affected is the function updateAccountHeadAndDetail of the file 
  jshERP-boot/src/main/java/com/jsh/erp/service/AccountHeadService.java of the 
  component Financial Receipt Update Handler. Performing a manipulation results 
  in improper authorization. The attack may be initiated remotely. The exploit 
  has been released to the public and may be used for attacks. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
