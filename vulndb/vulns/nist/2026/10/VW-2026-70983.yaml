title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  iptfs: fix runt reassembly panic from short inner tot_len\n\nWhen the start of an
  inner packet is split across two outer packets\nsuch that fewer than 4 bytes land
  at the end of the first one,\n__input_process_payload() saves those bytes as a runt
  and skips the\niplen/iphlen validation performed for in-place packets. When the\n\
  continuation packet arrives, iptfs_reassem_cont() only requires the\ndeclared inner
  length to be >= sizeof(ra_runt) (6) before allocating\nthe reassembly skb with that
  attacker-controlled length.\n\nHowever, __iptfs_iphlen() always returns the fixed
  minimum IP header\nsize (20 for IPv4, 40 for IPv6), so for an inner IPv4 tot_len
  in\n[6, 19] the header-completion copy writes past the declared packet\nlength,
  and the subsequent \"ipremain -= copylen\" underflows to ~4GB,\nleaving the payload
  copy length bounded only by blkoff (up to 64KB).\nAt runtime the skb_put() tailroom
  check turns this into\nskb_over_pan"
