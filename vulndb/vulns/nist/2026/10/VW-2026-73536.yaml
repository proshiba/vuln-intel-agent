title: Wanwu before 0.6.3 contains an insecure direct object reference 
  vulnerability that allows any authenticated enabled user to delete other 
  users' legacy AppKeys by supplying a numeric apiId. Attackers can iterate 
  sequential key IDs against DELETE /v1/appspace/app/key to revoke AppKeys 
  across organizations, breaking MCP and OpenAPI clients until owners issue new 
  keys.
