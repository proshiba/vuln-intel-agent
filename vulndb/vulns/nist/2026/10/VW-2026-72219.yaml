title: The AsyncHttpClient (AHC) library allows Java applications to easily 
  execute HTTP requests and asynchronously process HTTP responses. Prior to 
  3.0.13 and 2.16.1, the HTTP/1.1 connection-pool key excludes the authenticated
  principal for connection-oriented NTLM and Negotiate authentication. A pooled 
  socket authenticated for one request can be reused by a request carrying 
  another principal, and the server executes that later request as the first 
  identity. Basic and Digest are not affected because they authenticate each 
  request. This issue is fixed in versions 3.0.13 and 2.16.1.
