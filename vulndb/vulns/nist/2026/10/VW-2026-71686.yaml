title: "src/internal.c in wolfSSL wolfSSH through 1.5.0 admits the server-to-client
  Diffie-Hellman group exchange messages SSH_MSG_KEX_DH_GEX_GROUP (31) and SSH_MSG_KEX_DH_GEX_REPLY
  (33) when a server receives them from an unauthenticated client. IsMessageAllowedServer()
  applies no direction check to the key exchange message range: when the peer is keying
  and no particular message is expected, which is the state a server is in for the
  whole window after it processes the client's KEXINIT because nothing sets handshake->expectMsgId
  there, the function falls out of its expectation branch without a verdict and reaches
  a numeric bound that admits every message id from 30 through 34. A client that negotiates
  diffie-hellman-group-exchange-sha256 and then sends message 31 makes the server
  run the client-side handler DoKexDhGexGroup(), which validates the attacker-supplied
  group with two 8-round Miller-Rabin primality tests, one on p and one on (p-1)/2,
