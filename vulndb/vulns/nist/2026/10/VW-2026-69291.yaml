title: Sharp (and Toshiba Tec rebranded) multifunction printers contain an 
  unauthenticated local file inclusion vulnerability that allows remote 
  attackers to read arbitrary files by manipulating the path parameter in the 
  installed_emanual_down.html endpoint. Attackers can supply directory traversal
  sequences such as path=/manual/../../../<path> to access files outside the 
  intended manual directory, including /etc/passwd, coredump files containing 
  credentials, and system configuration files. Exploitation evidence was first 
  observed by the Shadowserver Foundation on 2024-07-30.
