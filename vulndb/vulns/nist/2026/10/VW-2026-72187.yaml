title: Chainlit versions prior to 2.9.4 contain a server-side request forgery 
  (SSRF) vulnerability in the /project/element update flow when configured with 
  the SQLAlchemy data layer backend. An authenticated client can provide a 
  user-controlled url value in an Element, which is fetched by the SQLAlchemy 
  element creation logic using an outbound HTTP GET request. This allows an 
  attacker to make arbitrary HTTP requests from the Chainlit server to internal 
  network services or cloud metadata endpoints and store the retrieved responses
  via the configured storage provider.
