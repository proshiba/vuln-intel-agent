title: Docling simplifies document processing by parsing diverse formats and 
  providing integrations with the generative AI ecosystem. From 2.91.0 until 
  2.132.0, validate_url_safety in docling/backend/utils/image_resource_loader.py
  validates a hostname with a single IPv4 lookup and then allows the HTTP client
  to resolve and parse the original URL again, permitting DNS rebinding, mixed 
  public and internal address records, and backslash authority parser 
  disagreement to reach internal services. HTMLBackendOptions(render_page=True) 
  also allows HTTP and HTTPS browser requests without validating their resolved 
  destination. Exploitation requires remote fetching to be enabled, and response
  content is exposed only when it is decoded as an image or passively rendered 
  in a page screenshot. This issue is fixed in 2.132.0.
