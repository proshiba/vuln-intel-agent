title: Allocation of resources without limits in PKCS#12 keystore loading 
  (Pkcs12Store.Load) in Legion of the Bouncy Castle Inc. bc-csharp before 2.7.0 
  allows an attacker who can supply a PKCS#12 (PFX) file to cause a denial of 
  service through CPU exhaustion via an iteration count close to 2^31 in the 
  file's MacData or in the PBE parameters of an encrypted SafeContents or 
  shrouded key bag, because the counts are taken from the file without an upper 
  bound and the key derivation runs before the MAC or the password can be 
  checked. A zero or negative count is covered by CVE-2026-63575. 
  Pkcs12Utilities.ConvertToDefiniteLength is also affected.
