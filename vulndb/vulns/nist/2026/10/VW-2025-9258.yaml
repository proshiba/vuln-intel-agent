title: SAPUI5 (and OpenUI5) packages use outdated 3rd party libraries with known
  security vulnerabilities. When markdown-it encounters special malformed input,
  it fails to terminate properly, resulting in an infinite loop. This Denial of 
  Service via infinite loop causes high CPU usage and system unresponsiveness 
  due to a blocked processing thread. This vulnerability has no impact on 
  confidentiality or integrity but has a high impact on system availability.
