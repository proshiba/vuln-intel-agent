title: A stack-based buffer overflow vulnerability exists in protocol gateways' 
  account management interface. The vulnerability is caused by insufficient 
  length validation of the `account_name` parameter when processing account 
  management requests. An attacker authenticated as a read-only user to the 
  web management interface could supply a specially crafted account name that 
  exceeds the size of the internal stack buffer, resulting in corruption of 
  program execution flow. Successful exploitation could allow an attacker to 
  read sensitive information from device memory, including credentials, modify 
  arbitrary memory contents, and disrupt device availability.
