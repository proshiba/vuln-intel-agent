title: 'Vulnerability in the PeopleSoft Enterprise FIN Maintenance Management product
  of Oracle PeopleSoft (component: Work Order Management).   The supported version
  that is affected is 9.2. Easily exploitable vulnerability allows low privileged
  attacker with network access via HTTP to compromise PeopleSoft Enterprise FIN Maintenance
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  update, insert or delete access to some of PeopleSoft Enterprise FIN Maintenance
  Management accessible data as well as  unauthorized read access to a subset of PeopleSoft
  Enterprise FIN Maintenance Management accessible data. CVSS 3.1 Base Score 5.4 (Confidentiality
  and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N).'
