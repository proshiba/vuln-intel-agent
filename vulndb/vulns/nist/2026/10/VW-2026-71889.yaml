title: 'A weakness has been identified in Open5GS up to 2.7.7. This vulnerability
  affects the function ogs_pfcp_xact_local_create of the file src/upf/gtp-path.c of
  the component GTP-U Receive Path. This manipulation causes allocation of resources.
  The attack is possible to be carried out remotely. The exploit has been made available
  to the public and could be used for attacks. Patch name: 9ffc252482d9b03ac01abcedbe95497ff4f95dd0.
  It is recommended to apply a patch to fix this issue.'
