title: pypdf is a free and open-source pure-python PDF library. Prior to 6.19.0,
  a crafted PDF can provide unusually large alphabetical page-label values that 
  cause pypdf/_page_labels.py to generate strings beyond a reasonable page-label
  length when an application retrieves document page labels, consuming excessive
  memory and potentially making the application unavailable. This issue is fixed
  in version 6.19.0.
