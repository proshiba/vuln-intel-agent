title: A vulnerability was detected in jakowenko double-take up to 1.13.1. The 
  impacted element is the function app.use of the file api/src/app.js of the 
  component API. The manipulation of the argument X-Ingress-Path results in 
  cross site scripting. The attack can be executed remotely. Upgrading to 
  version 1.13.2 is sufficient to resolve this issue. The patch is identified as
  e11de9dd6b4ea6b7ec9a5607a920d48961e9fa50. The affected component should be 
  upgraded.
