title: "MISP contains a cross-site scripting (XSS) vulnerability in the ID Translator
  feature. When a user views the ID Translator page, the application queries linked
  (remote) MISP servers for corresponding event identifiers. The event ID returned
  by the remote server was rendered in the HTML output without proper output encoding.\n\
  \nA malicious or compromised linked server could return a crafted event ID containing
  arbitrary HTML or JavaScript markup. This markup would be rendered in the browser
  of any user in the host organization who views the ID Translator page, enabling
  session hijacking, credential theft, or other client-side attacks.\n\nPreconditions:\n\
  \n- The victim must be an authenticated user of the host MISP instance.\n\n- A linked
  server must be configured on the host instance.\n\n- The victim must navigate to
  the ID Translator page for a given event.\n\nAffected versions: <2.5.48."
