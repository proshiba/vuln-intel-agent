title: The Uncanny Automator – AI + Automation for WordPress | AI Agent, AI Page
  Builder, Free AI Usage Included plugin for WordPress is vulnerable to PHP 
  Object Injection in all versions up to, and including, 7.6.1.1 via 
  deserialization of untrusted input. This makes it possible for authenticated 
  attackers, with Subscriber-level access and above, to inject a PHP Object when
  a third-party integration plugin (such as PeepSo,  MailPoet, WPForms, etc) is 
  installed and a recipe is configured that stores attacker-controlled data as 
  trigger meta. The additional presence of a POP chain within Uncanny Automator 
  allows attackers to delete arbitrary files on the server.
