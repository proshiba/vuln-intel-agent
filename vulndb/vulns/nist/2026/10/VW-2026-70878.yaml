title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  core: Fix potential UAF after asynchronous card release\n\nUsually a sound driver
  releases the resources assigned to the card via\nsnd_card_free(), and it synchronizes
  with the whole release procedure.\nHowever, when the card is released asynchronously
  via\nsnd_card_free_when_closed() like USB-audio driver, the situation is\nslightly
  different; although the snd_card_disconnect() call at the\ndisconnection guarantees
  that any newer accesses will be gated, the\nin-flight tasks might be still accessing
  to the underlying card->dev\ndevice even after the disconnection, which would cause
  a\nuse-after-free in the end, as reported by fuzzers.\n\nFor addressing the bug
  above, this patch takes the refcount of\ncard->dev at initialization of the card
  object, and releases at its\ndestructor.   This assures the availability of the
  card->dev in its\nwhole lifecycle."
