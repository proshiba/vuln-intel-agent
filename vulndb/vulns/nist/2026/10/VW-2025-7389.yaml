title: Due to a Cross-Site Request Forgery (CSRF) vulnerability in SAP NetWeaver
  Application Server for ABAP, an authenticated attacker could initiate 
  transactions directly via the session manager, bypassing the first transaction
  screen and the associated authorization check. This vulnerability could allow 
  the attacker to perform actions and execute transactions that would normally 
  require specific permissions, compromising the integrity and confidentiality 
  of the system by enabling unauthorized access to restricted functionality. 
  There is no impact to availability from this vulnerability.
