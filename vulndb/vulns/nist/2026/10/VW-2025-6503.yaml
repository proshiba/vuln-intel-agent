title: A flaw has been found in omec-project UPF up to 2.1.3-dev. This affects 
  the function handleSessionEstablishmentRequest of the file 
  /pfcpiface/pfcpiface/messages_session.go of the component PFCP Session 
  Establishment Request Handler. This manipulation causes null pointer 
  dereference. The attack may be initiated remotely. The exploit has been 
  published and may be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
