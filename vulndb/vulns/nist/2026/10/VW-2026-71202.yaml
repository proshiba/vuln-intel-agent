title: The RabbitMQ Java client library allows Java and JVM-based applications 
  to connect to and interact with RabbitMQ nodes. Prior to 5.36.0, 
  ValueReader.readShortstr decodes malformed UTF-8 bytes into replacement 
  characters that can re-encode beyond the AMQP shortstr limit enforced by 
  ValueWriter.writeShortstr. An attacker who can submit an RPC message with a 
  malformed echoed property can cause reply publication in RpcServer.mainloop() 
  or tutorial-style consumers to throw an unchecked exception before 
  acknowledgement. The broker requeues the message, allowing the same message to
  disable replacement consumers until the queue is purged. This issue is fixed 
  in version 5.36.0.
