title: Applications based on SAP GUI for HTML in SAP NetWeaver Application 
  Server ABAP do not sufficiently sanitize user-supplied content in certain 
  functionality, allowing an authenticated attacker to send malicious content to
  another user. If the victim interacts with the affected content, malicious 
  scripts could be executed in the victim's browser context. This vulnerability 
  has a low impact on the confidentiality and integrity of the data and no 
  impact on the availability of the application.
