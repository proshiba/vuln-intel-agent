title: Path traversal vulnerability in the Satel Iberia SenNet Datalogger Serie 
  200, specifically in the web portal provided by the device, which allows an 
  authenticated user to read any file or list any directory accessible to the 
  system user running the web server. This is possible by modifying the URL to 
  include a path traversal payload. Successful exploitation of this 
  vulnerability could allow an attacker to access critical system files 
  containing confidential information.
