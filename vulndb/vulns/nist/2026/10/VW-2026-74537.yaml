title: SAP Manufacturing Integration and Intelligence does not sufficiently 
  enforce authorization boundaries within certain administrative functionality. 
  An attacker with MII administrator privileges could submit a specially crafted
  request to provision an account with elevated privileges on the underlying 
  Java application server. Successful exploitation could allow the attacker to 
  gain administrative control over the underlying system, extending the impact 
  beyond the vulnerable application. This results in a high impact on 
  confidentiality, integrity and availability.
