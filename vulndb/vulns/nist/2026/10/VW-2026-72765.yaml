title: The max_age authentication-freshness check in OidcClientCodeRequestFilter
  was inoperative due to a milliseconds/seconds unit mismatch and an inverted 
  comparison polarity. Any relying party using setMaxAgeOffset to enforce 
  re-authentication would silently accept sessions of any age, bypassing step-up
  authentication policies. Users are recommended to upgrade to versions 4.2.4 or
  4.1.9 or 3.6.13, which fix this issue.
