title: The WPBifröst – Instant Passwordless Temporary Login Links plugin for 
  WordPress is vulnerable to Privilege Escalation due to a missing capability 
  check on the ctl_create_link AJAX action in all versions up to, and including,
  1.0.7. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to create new administrative user accounts 
  and subsequently log in as those.
