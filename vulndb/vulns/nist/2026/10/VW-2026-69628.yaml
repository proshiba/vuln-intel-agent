title: Zebra before 4.4.0 contains a consensus divergence vulnerability in V5 
  transparent signature verification, computing a ZIP-244 digest for 
  SIGHASH_SINGLE inputs lacking corresponding outputs instead of failing. 
  Attackers can craft V5 transactions with fewer outputs than inputs that Zebra 
  accepts and templates via getblocktemplate, producing blocks zcashd rejects.
