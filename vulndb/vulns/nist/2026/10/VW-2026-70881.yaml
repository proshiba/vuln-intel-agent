title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  abort transaction on failure to update inode for hole punching and reflinking\n\n\
  If we fail to update the inode we error out without aborting the\ntransaction, which
  can result in a persistent inconsistency if after\nthe failure the transaction is
  committed, as we have dropped file\nextent items from a range and either punched
  a hole or insert a new file\nextent item for that range (for reflinks).\n\nSo add
  the missing transaction abort."
