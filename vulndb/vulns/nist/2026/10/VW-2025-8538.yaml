title: An example dag `example_dag_decorator` had non-validated parameter that 
  allowed the UI user to redirect the example to a malicious server and execute 
  code on worker. This however required that the example dags are enabled in 
  production (not default) or the example dag code copied to build your own 
  similar dag. If you used the `example_dag_decorator` please review it and 
  apply the changes implemented in Airflow 3.0.5 accordingly.
