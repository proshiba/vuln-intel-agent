title: A security vulnerability has been detected in feelec-yishu feelcrm-os 
  1.0.0. This issue affects some unknown processing of the file 
  App/Feelcrm/Crm/Controller/UploadController.class.php of the component 
  UploadTicketFile Endpoint. Such manipulation of the argument cmd leads to 
  unrestricted upload. The attack can be launched remotely. The exploit has been
  disclosed publicly and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
