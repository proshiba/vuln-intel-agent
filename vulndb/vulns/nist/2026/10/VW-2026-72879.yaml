title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, the 
  mariadb.service unit used /run/mysqld/wsrep-new-cluster during the next 
  service restart. A database user with FILE privilege and a secure-file-priv 
  configuration permitting writes to /run/mysqld could create that file and 
  inject attacker-controlled environment values into the restarted service. This
  issue is fixed in versions 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 
  13.0.2.
