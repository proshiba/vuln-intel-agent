title: Shepherd (shepherd-ai) through 0.3.1 contains a server-side request 
  forgery guard bypass in the citation-checker extra because the public_url 
  guard validates a resolved address but fetch re-resolves the hostname at 
  connect time. Attackers who plant a crafted reference URL in a checked 
  document and control its DNS can rebind it to internal addresses, sending GET 
  requests to internal HTTP(S) services and capturing responses in evidence 
  files.
