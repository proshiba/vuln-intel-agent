title: open-computer-use through commit 610bac8 contains a stored cross-site 
  scripting vulnerability in Logger.write_log_file in 
  os_computer_use/logging.py, which writes transcript text into log.html without
  HTML escaping. Attackers controlling sandbox content, such as web pages or 
  files appearing in run_command output, can inject script that runs when 
  operators open the log, exfiltrating transcript contents.
