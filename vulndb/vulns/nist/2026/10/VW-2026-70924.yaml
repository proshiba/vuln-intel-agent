title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  6fire: fix OOB write from device-reported iso length\n\nusb6fire_pcm_in_urb_handler()
  sizes each outgoing isochronous packet as\n(actual_length - 4) / (in_n_analog <<
  2) * (out_n_analog << 2) + 4, where\nactual_length is the unsigned length the device
  reported for the matching\nIN packet.  A packet completed with status 0 and actual_length
  < 4 wraps\nthe subtraction to 0x7fffffec; a zero-length isochronous packet is legal\n\
  on the bus, and the preceding loop rejects only non-zero status.  The sum\nreaches
  memset() on out_urb->buffer, a 4832-byte object from\nkcalloc(PCM_MAX_PACKET_SIZE,
  PCM_N_PACKETS_PER_URB).\n\nEven without the wrap the result is out of bounds: at
  88.2/96 kHz the\n4-in/6-out scaling turns a full 420-byte IN packet into 628, so
  eight\npackets span 5024 bytes of that buffer.  usb_submit_urb() rejects an\nover-long
  descriptor only after the memset() and the\nusb6fire_pcm_playback() copy of user
  PCM data have run"
