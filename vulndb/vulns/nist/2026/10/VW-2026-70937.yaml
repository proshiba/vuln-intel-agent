title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: set up the TX info early to fix failure paths\n\nThe previous commit 2c51457d930f
  (\"wifi: mac80211: free ack status\nframe on TX header build failure\") cleaned
  up the leak, but still\nleft the code a bit messy and the failed SKB didn't get
  reported\nto userspace.\n\nFix this up by initialising skb->cb[] earlier, which
  allows using\nieee80211_free_txskb() and therefore reports it for the failure\n\
  in ieee80211_build_hdr(), and unifies the ieee80211_skb_resize()\nfailure path with
  it."
