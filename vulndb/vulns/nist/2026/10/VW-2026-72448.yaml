title: A flaw was found in luksmeta. A local attacker with administrative 
  privileges can cause data corruption when saving metadata to a Linux Unified 
  Key Setup (LUKS) device. Due to incorrect boundary calculations and flawed 
  overlap detection, new metadata entries can be written beyond available free 
  space or over existing records. This issue can corrupt stored encrypted 
  payload data or existing metadata, potentially rendering the affected data 
  inaccessible.
