title: "@fastify/jwt is a JSON Web Token plugin for the Fastify web framework. In
  versions before 10.2.3, a time span passed to expiresIn, notBefore, or maxAge that
  the plugin's parser cannot read, such as a compound span, a month unit, an ISO 8601
  duration, a decimal comma, or a value with surrounding whitespace, is silently dropped
  instead of refused. On the signing path this produces a token with no expiration
  claim that never expires, and on the verification path a configured maxAge stops
  being enforced, so a token that should be rejected for age is accepted. The issue
  is fixed in @fastify/jwt 10.2.3, and users should upgrade to 10.2.3 or later. As
  a workaround, pass these options as a number of seconds, or verify that any time-span
  string parses to a finite value before relying on it."
