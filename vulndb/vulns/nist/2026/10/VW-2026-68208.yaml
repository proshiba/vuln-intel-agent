title: simple-git, an interface for running git commands in any node.js 
  application, enables applications to execute Git operations from JavaScript. 
  Prior to 4.0.0, the default blockUnsafeOperationsPlugin compares parsed option
  names with literal dangerous option spellings while Git accepts unambiguous 
  long-option abbreviations. Attacker-influenced push arguments such as 
  abbreviated --receive-pack or --exec forms can therefore bypass 
  detectVulnerableFlags, reach git push against a local or file remote or an 
  attacker-influenced receive-pack target, and cause Git to invoke an 
  attacker-selected command in consumers that expose those arguments. The 
  clone-side abbreviation handling does not protect the push path. This issue is
  fixed in 4.0.0.
