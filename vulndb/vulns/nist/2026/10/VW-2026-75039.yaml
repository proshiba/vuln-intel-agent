title: Podman is a tool for managing OCI containers and pods. From 4.4.0 until 
  5.8.8 and 6.1.3, podman run treats an image carrying the 
  io.podman.annotations.checkpoint.runtime.name annotation as a checkpoint and 
  silently ignores user-supplied container creation restrictions such as 
  --cap-drop=ALL, allowing image-controlled checkpoint state to select weaker 
  sandbox settings and capabilities. Rootless containers are not affected 
  because checkpoint and restore are unavailable in that mode. This issue is 
  fixed in versions 5.8.8 and 6.1.3.
