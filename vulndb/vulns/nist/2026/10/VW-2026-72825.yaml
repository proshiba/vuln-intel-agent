title: KodExplorer before 4.55 contains a path traversal vulnerability in the 
  unzip_pre_name() function within app/function/helper.function.php, where a 
  single non-recursive str_replace() sanitization pass can be bypassed using 
  crafted filenames like "....//", combined with PclZip's extract() call in 
  KodArchive.class.php lacking the PCLZIP_OPT_EXTRACT_DIR_RESTRICTION option. 
  Authenticated attackers can upload a malicious ZIP archive with traversal 
  sequences to overwrite arbitrary files such as core JavaScript assets, 
  enabling stored XSS that leads to admin account takeover and subsequent remote
  code execution via unrestricted PHP file upload.
