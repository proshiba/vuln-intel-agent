title: A security flaw has been discovered in rymcu forest up to 
  de53ce79db9faa2efc4e79ce1077a302c42a1224. Impacted is the function 
  getAll/addDic/getAllDic/deleteDic of the file 
  src/main/java/com/rymcu/forest/lucene/api/UserDicController.java. The 
  manipulation results in missing authorization. The attack may be launched 
  remotely. This product operates on a rolling release basis, ensuring 
  continuous delivery. Consequently, there are no version details for either 
  affected or updated releases.
