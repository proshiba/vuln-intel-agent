title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm:
  Fix drm_pending_vblank_event leak in error path for out_fence_ptr\n\nWhen an out_fence_ptr
  is provided but DRM_MODE_PAGE_FLIP_EVENT is not\nset, a drm_pending_vblank_event
  will be allocated. If later, there is an\nallocation failure or another failure
  at setup_out_fence(), that event\nwill not have base.fence set and it will not be
  released at\ncomplete_signaling().\n\nRelease the event and set crtc_state->event
  to NULL just like in the\nDRM_MODE_PAGE_FLIP_EVENT case when there is a failure
  at\ndrm_event_reserve_init(). That is, prepare_signaling() releases the\nevent and
  there is nothing to be done at complete_signaling(). Use\ndrm_event_cancel_free()
  as that will also undo drm_event_reserve_init()\nin case it has been called."
