title: A weakness has been identified in D-Link DAP-2695 2.00RC13. The affected 
  element is the function sub_40C6B8 of the component Firmware Update Handler. 
  Executing manipulation can lead to improper verification of cryptographic 
  signature. The attack can be launched remotely. Attacks of this nature are 
  highly complex. The exploitability is described as difficult. The exploit has 
  been made available to the public and could be exploited. This vulnerability 
  only affects products that are no longer supported by the maintainer.
