title: Backstage is an open framework for building developer portals. Prior to 
  0.17.8, the @backstage/backend-defaults package is affected by improper input 
  validation in cloud storage url readers. An attacker with write access to a 
  cloud storage bucket used by Backstage could craft object names that could 
  collide with protected files in the output directory. In certain deployment 
  configurations, this could lead to content injection. This issue is fixed in 
  version 0.17.8.
