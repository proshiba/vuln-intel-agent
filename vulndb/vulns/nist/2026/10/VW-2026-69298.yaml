title: A vulnerability has been found in rhukster dom-sanitizer up to 1.0.15. 
  The affected element is the function url of the file src/DOMSanitizer.php of 
  the component SVG Sanitization. Such manipulation leads to incomplete 
  blacklist. It is possible to launch the attack remotely. The exploit has been 
  disclosed to the public and may be used. Upgrading to version 1.0.16 is 
  sufficient to fix this issue. The name of the patch is 
  139c46c3d7c9bc81542b7b5a58d5cde5d0e0195a. Upgrading the affected component is 
  recommended.
