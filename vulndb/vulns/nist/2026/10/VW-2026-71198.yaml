title: ImageSharp is a 2D graphics library. From 3.0.0 until 4.1.1, tiled TIFF 
  decoding allocates a destination buffer using TileWidth but 
  TiffDecompressorsFactory.Create constructs T4, T6, and Modified Huffman 
  decompressors using the full frame width. TiffDecoderCore.DecodeTilesChunky 
  can therefore direct frame-width fax scanlines into a tile-width buffer when 
  TileWidth is smaller than ImageWidth. The mismatch causes attacker-controlled 
  out-of-bounds writes, heap corruption, and process termination even with legal
  per-row run codes. This tiled-path vulnerability is distinct from oversized 
  CCITT runs in strip decoding. This issue is fixed in version 4.1.1.
