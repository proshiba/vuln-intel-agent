title: The Qualys Cloud Agent included a bundled uninstall script 
  (qagent_uninstall.sh), specific to Mac and Linux supported versions that 
  invoked multiple system commands without using absolute paths and without 
  sanitizing the $PATH environment. If the uninstall script is executed with 
  elevated privileges (e.g., via sudo) in an environment where $PATH has been 
  manipulated, an attacker with root/sudo privileges could cause malicious 
  executables to be run in place of the intended system binaries. This behavior 
  can be leveraged for local privilege escalation and arbitrary command 
  execution under elevated privileges.
