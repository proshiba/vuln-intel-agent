title: A flaw was found in SSSD. When configured to enforce account expiration 
  using LDAP (Lightweight Directory Access Protocol) shadow attributes, SSSD 
  fails to treat an expiration value of zero as an expired account. A user with 
  valid credentials for an expired account can exploit this flaw to bypass 
  access controls and authenticate to the system. This allows unauthorized 
  access to persist after the account was intended to be deactivated.
