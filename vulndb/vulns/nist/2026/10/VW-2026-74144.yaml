title: LibreNMS before 26.9.0 contains a stored cross-site scripting 
  vulnerability in includes/html/pages/device/wireless.inc.php, which echoes 
  wireless sensor sensor_descr values, populated from SNMP DisplayString fields 
  during discovery, into HTML without escaping. Attackers controlling a 
  monitored device's SNMP agent can set values such as AI-AP-MIB::aiSSID to 
  malicious JavaScript that executes when authenticated users view the device's 
  Wireless tab, enabling session hijacking.
