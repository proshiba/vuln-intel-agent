title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/dax:
  check zero or empty entry before converting xarray entry\n\nCalling dax_to_folio()
  with empty entry causes kernel panic below when\nbooting a VM with DAX enabled storage.\n\
  \nThis patch checks empty entry before calling dax_to_folio() on\ndax_associate_entry(),
  dax_disassociate_entry(), and dax_busy_page().\n\nCommit 98c183a4fccf (\"fs/dax:
  don't disassociate zero page entries\") added\nguards in the associate and disassociate
  paths, but the guards still come\nafter dax_to_folio(), and dax_busy_page() still
  has the same problem.\n\n[    0.737679] EXT4-fs (pmem0p1): mounted filesystem 79676804-7c8b-491a-b2a6-9bae3c72af70
  ro with ordered data mode. Quota mode: disabled.\n[    0.737891] VFS: Mounted root
  (ext4 filesystem) readonly on device 259:1.\n[    0.739119] devtmpfs: mounted\n\
  [    0.739476] Freeing unused kernel memory: 1920K\n[    0.740156] Run /sbin/init
  as init process\n[    0.740229]   with arguments:\n[    0.740286]     /s"
