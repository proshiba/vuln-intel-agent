title: "Apache WSS4J accepted attacker-controlled derived-key lengths and offsets
  without adequate bounds. This could permit cryptographically weak keys or excessive
  CPU and memory consumption when processing crafted WS-Security messages. The fixes
  enforce a minimum key length of 16 bytes, a maximum length of 512 bytes, and a maximum
  offset of 4096 bytes.\nUsers are recommended to upgrade to versions 4.0.2 or 3.0.6
  or 2.4.4, which fix this issue."
