title: ImageMagick on Windows through 7.1.2-33 and 6.9.13-58 contains an 
  uncontrolled search path vulnerability in NTGhostscriptEXE() that launches 
  gswin64c.exe by bare name when Ghostscript is unregistered. Attackers can 
  plant a malicious gswin64c.exe in the working directory to execute code with 
  ImageMagick privileges when PDF, PostScript, or EPS files are converted.
