title: A Kiteworks appliance setup interface did not confine a user-supplied 
  file path to its intended directory, which could allow an unauthenticated 
  attacker to write a file to any location writable by the affected service 
  account, potentially compromising the integrity of the appliance or rendering 
  it unavailable until an operator intervenes. Exploitation requires network 
  access to the affected interface, which is not reachable on a fully configured
  appliance in its default configuration; reaching it depends on either the 
  transient window while an appliance is first being provisioned or a 
  non-default appliance configuration.
