title: In the latest version of mlflow/mlflow, when the `basic-auth` app is 
  enabled, tracing and assessment endpoints are not protected by permission 
  validators. This allows any authenticated user, including those with 
  `NO_PERMISSIONS` on the experiment, to read trace information and create 
  assessments for traces they should not have access to. This vulnerability 
  impacts confidentiality by exposing trace metadata and integrity by allowing 
  unauthorized creation of assessments. Deployments using `mlflow server 
  --app-name=basic-auth` are affected.
