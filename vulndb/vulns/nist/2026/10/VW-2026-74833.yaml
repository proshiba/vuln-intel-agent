title: FreeRDP from 3.20.1 before 3.32.0 contains an uncontrolled resource 
  allocation vulnerability that allows malicious RDP servers to exhaust client 
  memory via oversized drive redirection read requests. Attackers can send 
  IRP_MJ_READ with Length 0xffffffff, causing roughly 4 GiB of zeroed allocation
  on 64-bit builds or an under-reserved buffer on 32-bit builds.
