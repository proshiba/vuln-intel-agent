title: The Otter Blocks – Gutenberg Blocks, Page Builder for Gutenberg Editor & 
  FSE plugin for WordPress is vulnerable to Sensitive Information Exposure in 
  all versions up to, and including, 3.2.6 via the 'otter_form_widget_filter' 
  parameter. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to extract the email addresses of the five 
  most recent form submitters, their submission dates, and the site's total form
  submission count. The widget is registered whenever the 
  themeisle_blocks_form_emails option is non-empty — the normal state after any 
  Form block has been saved — meaning the exposure is active on any standard 
  site using the plugin's form feature.
