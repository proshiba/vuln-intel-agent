title: LibreOffice Calc can link a cell range to an external data source, and 
  the link is saved in the document. A link of the sql type could name a folder 
  of local text files as a database, so opening a document could read a local 
  text file into the sheet. In fixed versions only the csv, html and xml data 
  providers are restored when a document is loaded.
