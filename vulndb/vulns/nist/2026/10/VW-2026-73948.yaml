title: A security flaw has been discovered in Linksys E1700 1.0.0.4.003. 
  Impacted is the function addStaticRoute of the file /goform/addStaticRoute of 
  the component Static Route Handler. Performing a manipulation of the argument 
  staticRoute_IP_setting/staticRoute_Netmask_setting/staticRoute_Gateway_setting/staticRoute_Metric_setting
  results in os command injection. Remote exploitation of the attack is 
  possible. The exploit has been released to the public and may be used for 
  attacks. The vendor was contacted early about this disclosure but did not 
  respond in any way.
