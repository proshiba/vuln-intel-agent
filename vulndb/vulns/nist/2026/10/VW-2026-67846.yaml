title: A flaw has been found in go-sonic sonic up to 1.1.4. The affected element
  is the function FetchTheme of the file service/theme/git_fetcher.go of the 
  component Theme Fetching API. Executing a manipulation of the argument uri can
  lead to server-side request forgery. The attack may be launched remotely. The 
  exploit has been published and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
