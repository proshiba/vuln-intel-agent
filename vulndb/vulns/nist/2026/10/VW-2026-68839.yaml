title: "Algorithm::AhoCorasick::XS versions through 0.04 for Perl read the haystack
  string length before the scalar is stringified.\n\nThe matches, first_match and
  match_details methods use the T_STD_STRING typemap to translate Perl scalars (SVs)
  into strings via the std::string constructor, using the SvPV macro to stringify
  the haystack input, and the SvCUR macro to determine the length of the SV.\n\nWhen
  the input SVs are references, integers (IVs) or floats (NVs), the SvCUR macro will
  return an invalid length if it is run before the input is stringified, leading to
  an out-of-bounds read which can abort the process.\n\nNote that the evaluation order
  of arguments to std::string is unspecified. Depending on the compiler, SvCUR may
  be run first and lead to an abort that cannot be caught within Perl.\n\nThis can
  be triggered when the haystack is a numeric value, for example,\n\n    my $ac =
  Algorithm::AhoCorasick::XS->new( [ \"11\", \"22\" ] );\n    $ac->matches( 211 );\n\
