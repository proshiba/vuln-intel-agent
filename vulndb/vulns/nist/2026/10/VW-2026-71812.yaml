title: Backstage is an open framework for building developer portals. Prior to 
  1.14.8, 1.15.6, and 2.0.1, the @backstage/plugin-techdocs-node package 
  improperly validated mapping-style markdown_extensions configuration. An 
  authenticated attacker who can register or influence an SCM-backed 
  documentation source may bypass TechDocs sanitization and cause Python objects
  to be imported and instantiated in the generator runtime, leading to arbitrary
  code execution. Earlier fixes in versions 1.14.6 and 1.15.4 did not fully 
  address the supported mapping representation of markdown_extensions. Impact is
  greatest when documentation generation runs with backend credentials, 
  filesystem access, or internal network access. This issue is fixed in versions
  1.14.8, 1.15.6, and 2.0.1.
