title: A vulnerability has been found in UTT 1250GW up to v2v3.2.2-200710. 
  Affected by this vulnerability is the function strcpy of the file 
  /goform/aspChangeChannel. The manipulation of the argument pvid leads to 
  buffer overflow. It is possible to initiate the attack remotely. The exploit 
  has been disclosed to the public and may be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
