title: "Improper input validation vulnerability in Apache Camel Karavan.\n\n\n\nWhen
  a deployment was started, Karavan unmarshalled a project's `kubernetes.yaml` and
  applied every resource it contained to the cluster without restricting the resource
  kinds, without rejecting security-sensitive pod options, and without pinning the
  target namespace. An authenticated user of any role could therefore have Karavan
  apply arbitrary Kubernetes resources within the reach of its service account, including
  pods requesting hostNetwork, hostPID, hostIPC, hostPath volumes, host ports, privileged
  containers, privilege escalation or added capabilities.\n\n\n\nThis issue affects
  Apache Camel Karavan: from 4.0.0 before 4.22.1.\n\n\n\nUsers are recommended to
  upgrade to version 4.22.1, which fixes the issue."
