title: GoSign Desktop through 2.4.1 disables TLS certificate validation when 
  configured to use a proxy server. This can be problematic if the GoSign 
  Desktop user selects an arbitrary proxy server without consideration of 
  whether outbound HTTPS connections from the proxy server to Internet servers 
  succeed even for untrusted or invalid server certificates. In this scenario 
  (which is outside of the product's design objectives), integrity protection 
  could be bypassed. In typical cases of a proxy server for outbound HTTPS 
  traffic from an enterprise, those connections would not succeed. (Admittedly, 
  the usual expectation is that a client application is configured to trust an 
  enterprise CA and does not set SSL_VERIFY_NONE.) Also, it is of course unsafe 
  to place ~/.gosign in the home directory of an untrusted user and then have 
  other users execute downloaded files.
