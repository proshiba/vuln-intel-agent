title: A weakness has been identified in dayrui XunRuiCMS up to 4.7.1. The 
  impacted element is the function dr_show_error/dr_exit_msg of the file 
  /dayrui/Fcms/Init.php of the component JSONP Callback Handler. This 
  manipulation of the argument callback causes cross site scripting. The attack 
  can be initiated remotely. The exploit has been made available to the public 
  and could be used for attacks. The vendor was contacted early about this 
  disclosure but did not respond in any way.
