title: In OpenStack Mistral through 23.0.0, several of the v2 API write paths 
  resolve the target object with a query that can return another project's 
  resource, then write to it. An authenticated project member can use this to 
  rewrite and un-publish another project's public action definitions and 
  environments. A project administrator can create a workbook whose embedded 
  ad-hoc action or workflow name collides with a resource of another project, 
  which moves that resource into the caller's project and causes the original 
  owner's subsequent updates of it to fail with server errors. Only deployments 
  exposing the Mistral API are affected.
