title: "XSA-501 was about issues with v1 -> v2 and v2 -> v1 changes racing certain\n\
  other grant table operations.  Sadly a v2 -> v1 -> v2 change has yet\nanother effect
  which wasn't accounted for: During the first change, status\npages would be freed.\
  \  During the second change they would be allocated\nagain.  Hence across the full
  pair of change the addresses of the status\npages may change, rendering stale previously
  calculated pointers into the\nstatus array."
