title: Joomla Extension - balbooa.com - CSRF in language installation feature 
  Gridbox < 2.20.4.0 - PagesController uses a trait that validates the Joomla 
  session token only when the HTTP method is POST. addLanguage does not require 
  POST inside the action and reads url and zip through the generic request 
  input. A GET request can therefore reach the action without the trait checking
  a token. The action still requires core.tools , but that is the victim’s 
  permission check; it does not prove that the privileged user intended the 
  request.
