title: JupyterHub through 6.0.1 contains an identifier collision vulnerability 
  that allows authenticated users to overwrite another user's named-server OAuth
  client by registering a hyphenated username. Attackers holding a name like 
  alice-prod can overwrite the client for alice's server prod, breaking OAuth 
  login and revoking tokens by stopping their own server.
