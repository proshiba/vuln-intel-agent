title: OpenClaw Windows Node before 2026.7.1 contains an incorrect authorization
  vulnerability in the system.run exec-approval policy where 
  ExecShellWrapperParser fails to split commands on pipe operators or extract 
  command substitutions. Connected gateways or agents can bypass approval rules 
  by placing denied commands behind allowed prefixes using pipe operators or 
  command substitution syntax, achieving arbitrary command execution on Windows 
  hosts.
