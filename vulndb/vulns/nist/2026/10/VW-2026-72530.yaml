title: FreeScout is a self-hosted help desk and shared mailbox. Prior to 
  1.8.235, when APP_CLOUDFLARE_IS_USED is enabled, FreeScout trusts an 
  unvalidated CF-Connecting-IP header during failed login attempts and stores 
  the spoofed value in the activity log. LogsMonitor inserts the value into an 
  administrator alert email without HTML escaping, allowing injected HTML to 
  execute when an administrator opens the email. This issue is fixed in version 
  1.8.235.
