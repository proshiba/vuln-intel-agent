title: URLs could be constructed which expanded environment variable or INI file
  values, so potentially sensitive information could be exfiltrated to a remote 
  server on opening a document containing such links. The check added for 
  CVE-2024-12426 did not cover every place a document can supply a URL. XForms 
  instance data and the Calc csv and sql data providers still reached the 
  expansion. In fixed versions these places refuse URLs with internal schemes 
  when the URL comes from the document.
