title: The AsyncHttpClient (AHC) library allows Java applications to easily 
  execute HTTP requests and asynchronously process HTTP responses. Prior to 
  3.0.12 and 2.16.1, WebSocketHandler.upgrade aborts a handshake whose 
  Sec-WebSocket-Accept value is missing or invalid but continues into pipeline 
  installation and onOpen delivery. Frames coalesced with the invalid 101 
  response can be decoded and delivered from a peer that did not prove the 
  handshake, although the request future fails and the channel closes. This 
  issue is fixed in versions 3.0.12 and 2.16.1.
