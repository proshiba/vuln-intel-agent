title: "An issue was discovered in Django 6.1 before 6.1.2, 6.0 before 6.0.9, and
  5.2 before 5.2.18.\n`django.forms.models.BaseModelFormSet.save_existing_objects()`
  used the presence of a primary key on a submitted form's instance as evidence that
  the instance belonged to the formset's limiting queryset. An object outside that
  queryset is represented by a newly constructed instance whose primary key can still
  be populated from submitted data when the model's primary key is a field accepted
  by the form, such as a `OneToOneField` or parent link used as the primary key of
  an inline formset's model, or a natural or UUID primary key included in the form's
  fields. This allows an authenticated user permitted to submit such a formset to
  delete rows outside the limiting queryset, without any permission on the targeted
  object, via forged management-form data marking an out-of-queryset object for deletion.
  Models using the default AutoField primary key are not affected.\nEarlier, unsupported
  Django series "
