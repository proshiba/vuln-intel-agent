title: "Memory Allocation with Excessive Size Value, Allocation of Resources Without
  Limits, and Uncontrolled Recursion in the Java implementation of Apache PLC4X (PLC4J)
  allow a malicious or impersonated device to exhaust the memory or stack of the client
  application, causing a denial of service.\n\nIn the OPC UA driver these defects
  are reachable before authentication: the offending data is parsed while the secure
  channel and session are being established, before the server's identity has been
  bound to it. Configuring a trusted server therefore does not prevent exploitation
  by an attacker who can \nimpersonate it.\n\nThe individual defects are:\n- Length-prefixed
  byte strings are allocated at the size claimed on the wire before the length is
  checked against the data actually received (0.10.0 through 0.13.1).\n- Array fields
  in generated protocol parsers pre-allocate a list with the element count claimed
  on the wire, allowing a single count field to trigger a multi-gigabyte allocation.
