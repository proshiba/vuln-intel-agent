title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  p54: require a full exp_if record in PDR_INTERFACE_LIST\n\nThe PDR_INTERFACE_LIST
  loop only checks that the record start is within\nthe entry before reading an entire
  struct exp_if from it. A truncated\ntrailing record makes the if_id/variant reads
  cross the entry boundary\ninto the heap beyond the EEPROM buffer (verified with
  a KASAN\nreproducer of the loop). The variant also feeds the synth front-end\nselection,
  so this is not only a leak.\n\nAdvance only while a full record still fits in the
  entry."
