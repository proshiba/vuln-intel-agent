title: "The WP Directory Kit plugin for WordPress is vulnerable to time-based SQL
  Injection via 'display_name' Profile Field (Second-Order) in all versions up to,
  and including, 1.5.9 due to insufficient escaping on the user supplied parameter
  and lack of sufficient preparation on the existing SQL query. This makes it possible
  for authenticated attackers, with subscriber-level access and above, to append additional
  SQL queries into already existing queries that can be used to extract sensitive
  information from the database. This is a second-order injection: a Subscriber stores
  a display_name containing a single quote via their own profile, which WordPress
  preserves verbatim; the payload is then triggered when WdkCachedUserEditor::update_listings_user_editor()
  re-reads that stored value and passes it unsanitized to the SQL sink."
