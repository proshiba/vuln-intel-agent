title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  insert mcg into mcg_tree only after rxe_mcast_add() succeeds\n\nrxe_get_mcg() publishes
  a newly allocated multicast group in\nrxe->mcg_tree before programming the backing
  Ethernet multicast address\nwith rxe_mcast_add(), which runs outside mcg_lock. A
  local userspace\nRDMA client reaches this path with ATTACH_MCAST on a UD QP; if\n\
  rxe_mcast_add() then returns an error (for example -ENODEV when the\nbacking netdev
  has been removed, or a propagated dev_mc_add() error),\nthe unwind frees the published
  group without removing it from the tree.\nA later lookup of the same MGID dereferences
  the freed struct rxe_mcg\nfrom __rxe_lookup_mcg().\n\nFix this by keeping the new
  mcg private until rxe_mcast_add() succeeds.\nSplit the tree publication into __rxe_publish_mcg(),
  call rxe_mcast_add()\nbefore taking the tree reference, and free the still-private
  mcg on\nfailure. Because the group is never visible in mcg_tree until the\nmulticas"
