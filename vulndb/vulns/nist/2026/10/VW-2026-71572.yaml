title: A flaw was found in Ghostscript. When Ghostscript renders a crafted 
  PostScript or EPS document, it can bypass the -dSAFER sandbox and execute 
  arbitrary shell commands in the context of the Ghostscript process. The issue 
  chains memory corruption in document parsing with disabling of internal path 
  access controls at runtime. An attacker can deliver the document directly or 
  through formats that delegate rendering to Ghostscript (for example EPS import
  or print conversion workflows). Successful exploitation can compromise 
  confidentiality, integrity, and availability of data accessible to the process
  running Ghostscript.
