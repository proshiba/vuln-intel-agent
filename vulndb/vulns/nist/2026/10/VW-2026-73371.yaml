title: Wukong AICRM through 20260610 contains a missing authorization 
  vulnerability that allows authenticated users to write into other users' AI 
  chat sessions by supplying an arbitrary sessionId to POST /chat/send. 
  Attackers can append messages to a victim's conversation and receive streamed 
  assistant replies built from the victim's last 20 messages, disclosing 
  conversation content.
