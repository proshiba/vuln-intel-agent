title: 'Temporal Server does not bind internal completion callbacks to the namespace
  that attached them, which allows an authenticated caller with write permission in
  one namespace to alter Scheduler V2 schedule state in another namespace. The callback
  address temporal://internal is reserved for callbacks that Scheduler V2 attaches
  to the Workflows it starts. In affected releases, any authenticated caller could
  attach a callback with that address to a Workflow start request, the address was
  exempt from the component.callbacks.allowedAddresses allowlist, and the History
  service delivered the callback to the component its token named, in whatever namespace
  that was, without authorizing the original caller there. When the forged completion
  matches an action a target schedule is running, the schedule records the action
  as completed while its Workflow still runs, which can defeat an overlap policy such
  as SKIP, and passes caller-controlled data to the next scheduled Workflow as its
  last completion '
