title: "DigitalCanion has discovered a path traversal vulnerability that allows an
  attacker to access files outside of the intended directory.\n\n\n\n\nThe specific
  flaw exists within the Maintenance → System Logs functionality of the web management
  portal listening on TCP port 443. The application fails to properly validate user-supplied
  file paths, allowing an attacker to manipulate the requested path and traverse the
  underlying directory structure.\n\n\n\n\nBy exploiting this vulnerability, an attacker
  can access and download files located outside the intended system logs directory,
  including potentially sensitive system and application files."
