title: Mooncake through 0.3.13.post1 contains a missing authentication 
  vulnerability in the HTTP metadata server /metadata handler that allows 
  unauthenticated attackers to read, overwrite, and delete transfer engine 
  metadata keys. Attackers can poison segment descriptors such as tcp_data_port 
  or re-create rpc_meta entries to redirect KV cache transfers to 
  attacker-controlled listeners, or exhaust server memory.
