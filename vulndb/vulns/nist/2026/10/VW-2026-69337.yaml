title: The Prime Mover plugin for WordPress before 2.2.1 contains a path 
  traversal vulnerability that allows authenticated administrators to delete 
  arbitrary directories by importing a crafted WPRIME/TAR package with 
  manipulated tar_root_folder values in wprime-config.json. Attackers can 
  exploit insufficient path validation in computeExtractVariables() and 
  validateImportedSiteVsPackage() to cause primeMoverDoDelete() to remove 
  directories outside the intended extraction path, potentially deleting 
  critical WordPress directories such as wp-admin and rendering the site 
  inoperable.
