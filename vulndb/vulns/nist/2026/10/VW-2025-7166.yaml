title: Allstar is a GitHub App to set and enforce security policies. In versions
  prior to 4.5, a vulnerability in Allstar’s Reviewbot component caused inbound 
  webhook requests to be validated against a hard-coded, shared secret. The 
  value used for the secret token was compiled into the Allstar binary and could
  not be configured at runtime. In practice, this meant that every deployment 
  using Reviewbot would validate requests with the same secret unless the 
  operator modified source code and rebuilt the component - an expectation that 
  is not documented and is easy to miss. All Allstar releases prior to v4.5 that
  include the Reviewbot code path are affected. Deployments on v4.5 and later 
  are not affected. Those who have not enabled or exposed the Reviewbot endpoint
  are not exposed to this issue.
