title: Open WebUI before 0.11.4 contains a missing authorization vulnerability 
  that allows authenticated users to reach disabled model provider backends by 
  supplying an explicit backend index. Attackers can pass the index as a path 
  segment or query parameter on Ollama and OpenAI-compatible listing routes to 
  trigger requests carrying configured API keys, read version strings, and 
  enumerate connections.
