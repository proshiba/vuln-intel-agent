title: A vulnerability has been found in yeqifu carRental up to 
  3fabb7eae93d209426638863980301d6f99866b3. This vulnerability affects the 
  function downloadShowFile of the file /file/downloadShowFile.action of the 
  component com.yeqifu.sys.controller.FileController. The manipulation of the 
  argument path leads to path traversal. The attack may be initiated remotely. 
  The exploit has been disclosed to the public and may be used. This product 
  uses a rolling release model to deliver continuous updates. As a result, 
  specific version information for affected or updated releases is not 
  available. The project was informed of the problem early through an issue 
  report but has not responded yet.
