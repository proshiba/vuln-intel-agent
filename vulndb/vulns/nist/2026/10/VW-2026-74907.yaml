title: MCP Context Forge provides an MCP Admin UI for managing gateway 
  resources. From 0.2.0 until 0.3.1, the Global Prompts feature stores a prompt 
  template without sufficient output encoding before the MCP Admin UI renders 
  it. An authenticated attacker can save markup containing script-capable event 
  handlers, and the code executes when another user views the saved prompt. The 
  stored cross-site scripting can alter the interface, present phishing content,
  observe keystrokes available to the page, and act with the viewer's browser 
  session. This issue is fixed in version 0.3.1.
