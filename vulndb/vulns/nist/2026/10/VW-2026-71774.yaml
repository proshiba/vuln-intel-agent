  credentials vulnerability that allows authenticated users to read static 
  secrets set on MCP catalog entries by admins or power users. Basic users 
  granted an entry by access control rules can request GET 
  /api/all-mcps/entries/{entry_id} to obtain plaintext API keys or tokens and 
  abuse them against backend services.
