title: The MPG  WordPress plugin before 4.2.3 does not validate that the dataset
  source supplied when importing a project is a remote URL before treating it as
  a local filesystem path and copying that file into a publicly accessible 
  uploads folder. This makes it possible for users with the Editor role and 
  above to read the contents of arbitrary files on the server, with the copied 
  file then retrievable by unauthenticated visitors.
