title: "The example example_xcom that was included in airflow documentation implemented
  unsafe pattern of reading value\nfrom xcom in the way that could be exploited to
  allow UI user who had access to modify XComs to perform arbitrary\nexecution of
  code on the worker. Since the UI users are already highly trusted, this is a Low
  severity vulnerability.\n\nIt does not affect Airflow release - example_dags are
  not supposed to be enabled in production environment, however\nusers following the
  example could replicate the bad pattern. Documentation of Airflow 3.2.0 contains
  version of\nthe example with improved resiliance for that case.\n\nUsers who followed
  that pattern are advised to adjust their implementations accordingly."
