title: A vulnerability was determined in AdithyaYelloju 
  Restaurant-Management-System up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. 
  Impacted is the function mysqli_query of the file User/ord.php of the 
  component Order Placement. Executing a manipulation of the argument id/name 
