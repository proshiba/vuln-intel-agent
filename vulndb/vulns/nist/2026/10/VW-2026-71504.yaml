title: "Improper Handling of Exceptional Conditions vulnerability in the aspnet-request
  pattern converter of Apache log4net.\n\nReading request parameters triggers ASP.NET
  request validation, so a request carrying content such as markup made the layout
  throw and the appender discarded the whole event. A sender could suppress the log
  record of their own request. Only applications on ASP.NET for .NET Framework whose
  layout uses %aspnet-request are affected.\n\nThis issue affects Apache log4net:
  from 1.2.11 before 3.5.0.\n\nUsers are recommended to upgrade to version 3.5.0,
  which fixes the issue."
