title: The SupportCandy – AI Customer Support Ticket System & Live Chatbot Agent
  plugin for WordPress is vulnerable to time-based SQL Injection via the 
  'sort_by' parameter in all versions up to, and including, 3.5.3 due to 
  insufficient escaping on the user supplied parameter and lack of sufficient 
  preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with custom-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. Exploitation requires the 
  authenticated attacker to hold both a Subscriber-level (or higher) WordPress 
  role and a SupportCandy Agent account with the 'Assign Agents' permission 
  configured.
