title: The WP Maps – Store Locator,Google 
  Maps,OpenStreetMap,Mapbox,Listing,Directory & Filters plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via the 'put_wpgm' shortcode in all 
  versions up to, and including, 4.8.7. This is due to insufficient input 
  sanitization and output escaping on user-supplied shortcode attributes. This 
  makes it possible for authenticated attackers, with contributor level access 
  and above, to inject arbitrary web scripts in pages that will execute whenever
  a user accesses an injected page.
