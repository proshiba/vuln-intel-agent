title: A flaw has been found in Sistemas Pleno Gestão de Locação up to 2025.7.x.
  The impacted element is an unknown function of the file 
  /api/areacliente/pessoa/validarCpf of the component CPF Handler. Executing a 
  manipulation of the argument pes_cpf can lead to authorization bypass. The 
  attack can be executed remotely. The exploit has been published and may be 
  used. Upgrading to version 2025.8.0 is sufficient to resolve this issue. It is
  advisable to upgrade the affected component.
