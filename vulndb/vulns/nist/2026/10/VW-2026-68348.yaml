title: AiSOC versions 7.5.0 before 12.0.0 use a hard-coded constant for JWT 
  verification in the realtime WebSocket and SSE service when the 
  AISOC_REALTIME_JWT_SECRET environment variable is not set. Unauthenticated 
  attackers can forge subscription tickets with arbitrary tenant identifiers to 
  access cross-tenant live alerts, cases, agent events and graph updates through
  the realtime endpoints.
