title: Xxyopen novel through 3.5.0 contains a weak password hashing 
  vulnerability that allows attackers to recover plaintext passwords because 
  UserServiceImpl.register() stores unsalted MD5 digests in user_info.password. 
  Attackers who obtain the password column through a database leak or backup 
  exposure can crack hashes with precomputed tables or GPU brute force and reuse
  credentials.
