title: A vulnerability was detected in JeecgBoot up to 3.9.0. This issue affects
  the function queryPageList of the file /sys/sysDepartRole/list. The 
  manipulation of the argument deptId results in improper authorization. The 
  attack can be executed remotely. A high complexity level is associated with 
  this attack. The exploitability is assessed as difficult. The exploit is now 
  public and may be used. The vendor was contacted early about this disclosure 
  but did not respond in any way.
