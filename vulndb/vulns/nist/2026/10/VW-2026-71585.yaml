title: Backstage is an open framework for building developer portals. Prior to 
  4.1.0, the @backstage/plugin-scaffolder-backend package is affected by 
  incorrect authorization in scaffolder task listing. An authenticated internal 
  user may be able to view metadata for scaffolder tasks outside the visibility 
  intended by a deployment's permission policy. Stored task secrets are not 
  included in the affected response, and no integrity or availability impact was
  identified. This issue is fixed in version 4.1.0.
