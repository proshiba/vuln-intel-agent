title: The DoFollow Case by Case plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Comment Content in all versions up to, and including,
  3.6.0 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. Comment 
  moderation delays but does not prevent exploitation — once an administrator 
  approves the visually innocuous comment, the stored payload executes in the 
  browser of every subsequent visitor to the affected post.
