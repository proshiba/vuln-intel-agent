title: "Missing authorization on COM objects in Progressive Robot hMailServer 6.0.0
  through 6.3.5 (Windows only) lets a local interactive user with no hMailServer credential
  read and write arbitrary files as the service account and queue mail as any sender.
  The service registers its COM classes with no DCOM access or launch permission and
  calls CoInitializeSecurity with no security descriptor, so any user logged on at
  the console or over Remote Desktop can activate the classes in the running service;
  a hMailServer.Message, its Attachments and Attachment, and a hMailServer.FetchAccount
  created this way carry a credential that never authenticated. Attachments.Add(path)
  and Attachment.SaveAs(path) performed no authorization check, and Message.Save/Copy
  and FetchAccount.AccountID/Save performed none either up to 6.3.3 and from 6.3.4
  treated a holder with no credential as the server's own event-script host. Because
