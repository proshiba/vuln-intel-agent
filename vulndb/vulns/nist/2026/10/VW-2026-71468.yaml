title: Dell System Update, versions prior to 2.3.0.0, contains an Improper 
  Limitation of a Pathname to a Restricted Directory ('Path Traversal') 
  vulnerability. An unauthenticated attacker with remote access could 
  potentially exploit this vulnerability, leading to Filesystem access for 
  attacker. This vulnerability is considered critical because it can be 
  leveraged by an unauthenticated attacker to execute arbitrary code with root 
  privileges. Successful exploitation may allow complete compromise of the 
  vulnerable application and underlying operating system. Dell recommends 
  customers upgrade at the earliest opportunity.
