title: openapi-python-client generates Python clients from OpenAPI documents. 
  Prior to 0.29.1, the generator does not safely neutralize malicious OpenAPI 
  document content before rendering string, docstring, and f-string contexts in 
  generated Python. The generated Python client can contain attacker-controlled 
  Python that executes when a user imports the client, affecting the importing 
  environment's integrity and potentially its confidentiality and availability. 
  This issue is fixed in version 0.29.1.
