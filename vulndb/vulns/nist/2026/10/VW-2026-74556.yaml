title: A security flaw has been discovered in TinyLLaVA TinyLLaVA_Factory up to 
  1abc6ac5e76a68d0fd087a071b56da968e69ca9b. The impacted element is the function
  _load_text_config of the file tinyllava/model/configuration_tinyllava.py of 
  the component TinyLlavaConfig. Performing a manipulation of the argument 
  llm_model_name_or_path results in code injection. Remote exploitation of the 
  attack is possible. The exploit has been released to the public and may be 
  used for attacks. This product follows a rolling release approach for 
  continuous delivery, so version details for affected or updated releases are 
  not provided. The project was informed of the problem early through an issue 
  report but has not responded yet.
