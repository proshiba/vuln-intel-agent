title: "A vulnerability in the client update process of Cisco AnyConnect Secure Mobility
  Client Software for Windows and Cisco Secure Client Software for Windows could allow
  a low-privileged, authenticated, local attacker to elevate privileges to those of
  SYSTEM. The client update process is executed after a successful VPN connection
  is established.\r\n\r This vulnerability exists because improper permissions are
  assigned to a temporary directory that is created during the update process. An
  attacker could exploit this vulnerability by abusing a specific function of the
  Windows installer process. A successful exploit could allow the attacker to execute
  code with SYSTEM privileges."
