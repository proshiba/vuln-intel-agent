title: A vulnerability was identified in geyang ml-logger up to 
  acf255bade5be6ad88d90735c8367b28cbe3a743. Affected by this vulnerability is 
  the function log_handler of the file ml_logger/server.py. Such manipulation of
  the argument File leads to path traversal. It is possible to launch the attack
  remotely. The exploit is publicly available and might be used. This product 
  takes the approach of rolling releases to provide continious delivery. 
  Therefore, version details for affected and updated releases are not 
  available.
