title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Restore HMM_PFN_WRITE check in ODP write paths\n\nCommit 0b261d7c1cd3 (\"RDMA/rxe:
  Break endless pagefault loop for RO\npages\") dropped the access permission test
  from rxe_check_pagefault()\nand left only HMM_PFN_VALID. A page faulted in read-only,
  for example\na page-cache folio behind a PROT_READ file mapping, then satisfies
  the\ncheck and ODP write operations (RDMA WRITE, RDMA READ response, SEND\npayload,
  atomics) modify it through kmap without ever breaking CoW.\n\nAn unprivileged user
  can register an ODP MR over such a mapping and\nhave incoming RDMA traffic overwrite
  the page cache of a file it only\nholds O_RDONLY, including /etc/passwd or setuid
  binaries. This is the\nsame primitive class as Dirty COW and CVE-2022-2590.\n\n\
  mlx5 has the missing invariant: its ODP path sets the device write bit\nonly for
  pfns that carry HMM_PFN_WRITE. Restore it in rxe by requiring\nHMM_PFN_WRITE in
  rxe_check_pagefault() for every ope"
