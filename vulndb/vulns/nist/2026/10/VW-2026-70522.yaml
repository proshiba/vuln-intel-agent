title: Docling simplifies document processing by parsing diverse formats and 
  providing integrations with the generative AI ecosystem. From 2.45.0 until 
  2.131.0, METS-GBS format detection in docling/datamodel/document.py and the 
  backend in docling/backend/mets_gbs_backend.py call 
  tarfile.TarFile.getmembers() before enforcing the max_member_count limit, 
  causing the full archive member list to be allocated before the limit can stop
  processing. A small gzip-compressed tar archive with a very large number of 
  empty members can therefore consume memory proportional to the declared member
  count, including during format detection before the allowed_formats 
  restriction is applied. This issue is a residual weakness in the member-count 
  protection added for CVE-2026-44018. This issue is fixed in 2.131.0.
