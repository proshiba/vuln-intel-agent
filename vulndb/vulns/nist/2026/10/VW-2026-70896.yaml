title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetlink:
  do not free nlk->groups while lockless readers can use it\n\nnetlink_realloc_groups()
  uses krealloc() under netlink_table_grab().\nWhenever NLGRPSZ(groups) lands in a
  different kmalloc bucket, the old\nbitmap is freed immediately.\n\nTwo readers of
  nlk->groups / nlk->ngroups do not hold the netlink\ntable lock:\n\n1) sk_diag_dump_groups().
  Hashed (bound) sockets are dumped from the\n   rhashtable walk in __netlink_diag_dump(),
  which only holds RCU.\n   Only the mc_list part of the dump takes nl_table_lock.\n\
  \n2) netlink_native_seq_show() (/proc/net/netlink), whose walk has been\n   lockless
  since commit 21e4902aea80 (\"netlink: Lockless lookup with\n   RCU grace period
  in socket release\").\n\nBoth can read a freed buffer, and sk_diag_dump_groups()
  can also read\npast the end of the old (smaller) buffer if it happens to load the
  old\n@groups pointer together with the new @ngroups value, copying the\nresult into
  a NETLINK_DIAG_GROU"
