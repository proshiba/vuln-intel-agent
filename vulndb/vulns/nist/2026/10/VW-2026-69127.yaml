title: The Awesome Support – WordPress HelpDesk & Support Plugin plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via the 'gdpr-data' 
  parameter in all versions up to, and including, 6.4.0 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. This is exploitable by Subscriber-level users against other 
  accounts because the AJAX handlers accept an arbitrary gdpr-user ID without 
  verifying it belongs to the requester, and the required wpas-gdpr-nonce is 
  emitted via wp_localize_script to every logged-in user on frontend plugin 
  pages and on /wp-admin/profile.php.
