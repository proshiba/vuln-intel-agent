title: Backstage is an open framework for building developer portals. Prior to 
  1.54.6, cloud storage catalog providers did not sufficiently validate object 
  paths. A principal able to create or rename objects in a configured Azure Blob
  Storage or AWS S3 catalog source could cause catalog descriptors to be read 
  from outside the intended storage boundary, limited to locations reachable 
  with the backend's configured credentials. This issue is fixed in 1.54.6.
