title: "The Real Cookie Banner: GDPR & ePrivacy Cookie Consent plugin for WordPress
  is vulnerable to Stored Cross-Site Scripting via Comment in all versions up to,
  and including, 5.3.5 due to insufficient input sanitization and output escaping.
  This makes it possible for unauthenticated attackers to inject arbitrary web scripts
  in pages that will execute whenever a user accesses an injected page. Malicious
  script payloads placed in the title attribute of an anchor tag survive WordPress's
  comment kses filter at save time, as the payload is only promoted to executable
  HTML attributes when the plugin's page-wide regex strips the closing quote delimiter
  at render time; exploitability is therefore subject to the standard comment moderation
  workflow before the comment is publicly displayed."
