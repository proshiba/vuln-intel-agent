title: The Simple Membership plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'country' parameter in all versions up to, and 
  including, 4.8.4 due to insufficient input sanitization and output escaping. 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page. Unauthenticated attackers may also 
  exploit this vulnerability when the plugin's Enable Free Membership feature is
  turned on, as it permits anonymous front-end registration and profile 
  submission.
