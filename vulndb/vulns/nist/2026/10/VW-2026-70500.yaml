title: A flaw has been found in O2OA up to 10.0.1-ce. This affects the function 
  ActionUploadExcelWithUrl of the file 
  /x_general_assemble_control/jaxrs/excel/upload/with/url of the component 
  General Module. Executing a manipulation of the argument fileUrl can lead to 
  server-side request forgery. The attack can be launched remotely. The exploit 
  has been published and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
