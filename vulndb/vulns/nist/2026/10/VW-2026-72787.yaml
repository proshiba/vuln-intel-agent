title: "Improper limitation of a pathname to a restricted directory ('path traversal')
  vulnerability in Apache Camel Karavan.\n\n\n\nA project file name supplied through
  the project file API was used verbatim as a path segment when the project was written
  to the working copy for a Git commit, so a name containing `../` sequences caused
  the file content to be written outside the project directory, to any location writable
  by the Karavan process. An authenticated user of any role could use this to overwrite
  application configuration or files on the application classpath and so execute code
  in the Karavan container.\n\n\n\nThis issue affects Apache Camel Karavan: from 3.18.0
  before 4.22.1.\n\n\n\nUsers are recommended to upgrade to version 4.22.1, which
  fixes the issue."
