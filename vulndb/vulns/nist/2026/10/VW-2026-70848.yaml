title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  wwan: mhi_wwan_mbim: check skb_copy_bits() return value\n\nmhi_mbim_rx() ignores
  the return value of skb_copy_bits() when it\ncopies each datagram out of the NTB.\
  \  The datagram offset and length\ncome from the DPE, which is only checked to lie
  within the NTB\nitself, so a modem can point a datagram outside the received skb.\n\
  The copy then fails and the freshly allocated skbn is passed to\nnetif_rx() with
  its uninitialized contents still in place, leaking\nkernel heap memory into the
  network stack.\n\nFree the skb and account an error when the copy fails.\n\n\nVerified
  in a QEMU guest with a fault injector pointing a DPE\noutside the received NTB:
  the copy fails, and the unpatched driver\nhands the uninitialized skbn to the network
  stack (observed as\n\"unknown protocol\" on bytes that were never written).  With
  this\ncheck the failed datagram is dropped and counted as an rx error.\n\nChanges
  in v2: factor the free-and-count sequence "
