title: A weakness has been identified in Tenda AC10U 15.03.06.48/15.03.06.49. 
  Affected by this vulnerability is the function fromadvsetlanip of the file 
  /goform/AdvSetLanip of the component POST Request Parameter Handler. Executing
  a manipulation of the argument lanMask can lead to buffer overflow. The attack
  can be launched remotely. The exploit has been made available to the public 
  and could be used for attacks.
