title: Phproject before 1.8.7 contains a missing object-level authorization 
  vulnerability in the REST API issue endpoints (single_get, single_comments, 
  single_comments_post) that allows authenticated API key holders to bypass the 
  security.restrict_access confidentiality control by never invoking the 
  allowAccess() authorization routine. Attackers can use a valid API key to read
  restricted issue contents and comments, including owner and author email 
  addresses, and post unauthorized comments to issues they should not have 
  access to.
