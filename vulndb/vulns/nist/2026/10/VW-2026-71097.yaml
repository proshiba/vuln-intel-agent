title: ImageSharp is a 2D graphics library. From 2.0.0 until 4.1.2, decoding an 
  attacker-supplied 32-bit floating-point TIFF as Image<HalfVector4> and 
  applying HistogramEqualization can produce a non-finite or out-of-range 
  luminance in ColorNumerics.GetBT709Luminance. 
  GrayscaleLevelsRowOperation.Invoke uses the resulting value as an unchecked 
  histogram offset, causing an unsafe out-of-range access and process 
  termination. Adaptive Histogram Equalization and AutoLevel are not affected by
  this report. This issue is fixed in version 4.1.2.
