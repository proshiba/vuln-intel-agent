title: A security flaw has been discovered in Shaarli up to 0.16.3. The affected
  element is the function MetadataController of the file 
  application/front/controller/admin/MetadataController.php of the component 
  Admin Metadata Endpoint. Performing a manipulation of the argument url results
  in server-side request forgery. The attack may be initiated remotely. 
  Upgrading to version 0.16.4 is sufficient to fix this issue. The patch is 
  named 8ca4de8e7c932a684481f5fbb1229fe16de1f4d2. It is advisable to upgrade the
  affected component.
