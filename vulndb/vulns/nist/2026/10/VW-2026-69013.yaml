title: A flaw has been found in OpenSC up to 0.27.1. The impacted element is the
  function setcos_construct_fci_44 of the file src/libopensc/card-setcos.c. 
  Executing a manipulation of the argument type_attr can lead to stack-based 
  buffer overflow. The attack can be launched remotely. This patch is called 
  ad730304052937c32b4eb489a06835ac6123632c. It is best practice to apply a patch
  to resolve this issue.
