title: Inefficient algorithmic complexity and a non-terminating loop in the MIME
  processing of received messages in Progressive Robot hMailServer 6.0.0 through
  6.3.5 allow a remote unauthenticated attacker to make the mail services 
  unavailable by sending a message. Removing a MIME header parameter whose value
  is empty and directly followed by a semicolon (for example a 
  Content-Disposition with 'filename=a.bat; filename=;') entered a loop that 
  never terminates, holding a worker thread at full load until the server is 
  restarted; this is reached when the attachment blocker renames a blocked 
  attachment or a filename is set over the REST API. Separately, decoding a 
  header field that holds many RFC 2047 encoded words of an encoding other than 
  base64 or quoted-printable, removing a parameter with many RFC 2231 
  continuations, and deleting many header fields of one name each took time 
  growing with the square of the message, on the small thread pools that serve 
  IMAP, SMTP and POP3 connections, delivery
