  clear cep before release state_lock as siw_qp_llp_close and\nsiw_qp_modify->siw_qp_llp_close
  did.\n\nOtherwise if siw_qp_modify() fails in siw_accept(), the QP's state_lock\n\
  is released before the error path cleanup. A concurrent ibv_modify_qp()\ntransitioning
  the QP to ERROR can race in this window:\n\n  siw_accept()                     \
  \  ibv_modify_qp(ERROR)\n  ----------------------             ----------------------\n\
  \  siw_qp_modify() fails\n  up_write(&qp->state_lock)\n                        \
  \             down_write(&qp->state_lock)\n                                    \
  \ nextstate_from_idle():\n\t\t\t\t     if (qp->cep)\n                          \
  \             siw_cep_put(qp->cep) <- frees cep\n                              \
  \         qp->cep = NULL\n  goto error\n    cep->qp = NULL                   <-
