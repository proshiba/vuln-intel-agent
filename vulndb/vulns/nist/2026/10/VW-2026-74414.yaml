title: Frappe ERPNext before 15.119.1 and 16.x before 16.32.0 contains a 
  server-side template injection vulnerability because user-controlled message 
  fields are not validated before template rendering, allowing expressions to 
  run in an unrestricted context. Authenticated attackers holding a common 
  operational role can inject template expressions to read and write arbitrary 
  database data, delete documents, send outbound requests from the server, and 
  send mail from the site.
