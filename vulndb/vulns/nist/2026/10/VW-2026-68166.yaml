title: "A vulnerability in the AdminServer component of OpenEdge on all supported
  platforms grants its authenticated users OS-level access to the server\nthrough
  the adopted authority of the AdminServer process itself.  The delegated authority
  of the AdminServer could allow its users the ability to read arbitrary files on
  the host system through the misuse of the setFile() and openFile()\n methods exposed
  through the RMI interface.  Misuse was limited only by OS-level authority of the
  AdminServer's elevated \nprivileges granted and the user's access to these methods
  enabled through RMI.  The exploitable methods have been removed thus eliminating
  their access through RMI or downstream of the RMI registry."
