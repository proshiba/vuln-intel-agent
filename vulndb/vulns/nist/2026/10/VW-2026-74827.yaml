title: FreeRDP from 2.3.0 before 3.32.0 contains an infinite loop vulnerability 
  in http_chuncked_read that allows malicious RD Gateways to hang clients by 
  sending incomplete chunked responses. Attackers can send a partial chunk-size 
  line or footer followed by a clean TLS shutdown, causing zero-byte reads to 
  loop forever and freeze the client decoder thread.
