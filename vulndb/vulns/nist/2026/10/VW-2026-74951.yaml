title: A vulnerability was identified in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. This affects an unknown part of the 
  file changebookingstatus.php of the component submit2 Handler. Such 
  manipulation of the argument username[]/timestamp[]/status[] leads to missing 
  authorization. The attack may be performed from remote. The exploit is 
  publicly available and might be used. This product utilizes a rolling release 
  system for continuous delivery, and as such, version information for affected 
  or updated releases is not disclosed. The project was informed of the problem 
  early through an issue report but has not responded yet.
