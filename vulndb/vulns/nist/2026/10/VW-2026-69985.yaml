title: 'In Bouncy Castle for Java before 1.86, the streaming CMS AuthenticatedData
  parser accepted a message whose digestAlgorithm and authAttrs fields disagreed about
  whether authenticated attributes were present. RFC 5652 sec. 9.1 pairs the two,
  requiring that authAttrs be present whenever digestAlgorithm is, and sec. 9.2 makes
  the MAC cover the DER encoding of authAttrs when they are present and the eContent
  OCTET STRING directly when they are not. CMSAuthenticatedDataParser has to choose
  between those two in its constructor, before it can reach authAttrs, which comes
  later in the SEQUENCE, so it chose on digestAlgorithm alone: for a message with
  digestAlgorithm absent but authAttrs present it verified the content MAC and then
  returned the attributes through getAuthAttrs() as though they had been authenticated,
  when the MAC had never covered them. An attacker able to modify a message in transit
