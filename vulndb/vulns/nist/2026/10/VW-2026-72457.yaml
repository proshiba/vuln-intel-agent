title: pH7Builder (pH7 Social Dating CMS) before 18.5.0 contains an improper 
  authorization vulnerability in the note module delete() action that allows 
  authenticated members to delete other members' note comments and categories. 
  Attackers can submit another member's note ID in the POST id parameter to 
  remove all comments and category associations, since those queries lack 
  profile ID checks.
