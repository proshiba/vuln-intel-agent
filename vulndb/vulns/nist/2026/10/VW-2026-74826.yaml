title: FreeRDP 3.0.0-beta1 before 3.32.0 on Unix builds with PKCS#11 support has
  a stack-based buffer overflow in wprintKeyName() in WinPR's NCrypt PKCS#11 
  provider. It hex-encodes a key's CKA_ID, which can be up to 64 bytes, into a 
  fixed 128-byte stack buffer. An attacker supplying a malicious PKCS#11 token 
  or module whose key and matching certificate use a 55- to 64-byte CKA_ID can 
  overflow the client's stack during key enumeration, causing a crash.
