title: The Appointment Booking Plugin – LatePoint | Calendar & Scheduling for 
  WordPress plugin for WordPress is vulnerable to Insecure Direct Object 
  Reference / Missing Authorization in versions up to, and including, 5.7.2. 
  This is due to the publicly reachable steps__start and steps__load_step routes
  accepting a params[presets][order_item_id] value that is copied verbatim into 
  the booking object without verifying that the referenced order item belongs to
  the current customer, is a bundle item, is paid, or has remaining capacity — 
  the is_bundle_scheduling() bundle discriminator is a mere 
  !empty(order_item_id) truthiness check, and the code flow explicitly removes 
  the customer and payment steps when this is truthy (the source even carries a 
  TODO acknowledging the missing validation). This makes it possible for 
  unauthenticated attackers to create approved appointments against other 
  customers' order items and to read those customers' names, email addresses, 
  and order codes returned in the bookin
