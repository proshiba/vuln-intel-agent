title: Zebra before 6.3.0 contains a protection mechanism failure that allows 
  unauthenticated peers to evade misbehavior scoring by supplying invalid 
  gossiped blocks. The inbound cleanup step wrongly downcasts RouterError to 
  VerifyBlockError and discards the score, so attackers can repeatedly force 
  block download and Equihash verification without being banned.
