title: pH7Builder (pH7 Social Dating CMS) before 18.5.0 contains an information 
  disclosure vulnerability that allows API clients to obtain sensitive member 
  data because UserController::users() and user() return unfiltered database 
  rows. Attackers holding a valid private API key can retrieve bcrypt password 
  hashes, non-expiring hashValidation reset tokens, and TOTP secrets to take 
  over accounts and bypass two-factor authentication.
