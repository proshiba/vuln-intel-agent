title: "In Apache CXF, the Netty-based HTTP client transport (cxf-rt-transports-http-netty-client)
  did not verify that the hostname in the server’s TLS certificate matched the host
  being called. This applied over both HTTP/1.1 and HTTP/2, even when disableCNCheck
  was left at its default value of false. The certificate chain was validated against
  the configured trust store, but the endpoint’s identity was not. A network attacker
  able to intercept traffic could present any certificate trusted by the client, such
  as a publicly issued certificate for a domain they control, and impersonate the
  target service. They could then read or modify the exchanged messages, including
  credentials. \nUsers are recommended to upgrade to versions 4.2.4 or 4.1.9 or 3.6.13,
  which fix this issue."
