title: RuoYi-Cloud-Plus through 6.0.0 contains an insecure direct object 
  reference vulnerability that allows authenticated users to delete other users'
  social login bindings by supplying their socialId. Attackers can send DELETE 
  /auth/unlock/{socialId}, which deletes sys_social rows by primary key without 
  ownership checks, removing victims' OAuth tokens and blocking social login.
