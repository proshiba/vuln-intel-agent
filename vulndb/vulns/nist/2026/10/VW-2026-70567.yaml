title: A security flaw has been discovered in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. Impacted is an unknown function of 
  the file signup.php of the component Registration Handler. The manipulation of
  the argument fname results in sql injection. The attack can be executed 
  remotely. The exploit has been released to the public and may be used for 
  attacks. This product implements a rolling release for ongoing delivery, which
  means version information for affected or updated releases is unavailable. The
  project was informed of the problem early through an issue report but has not 
  responded yet.
