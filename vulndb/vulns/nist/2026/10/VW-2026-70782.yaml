title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix OOB struct field reads in move_smb2_ea_to_cifs()\n\nIn move_smb2_ea_to_cifs(),
  the while (src_size > 0) loop condition is\ninsufficient. It allows iteration to
  continue even if the remaining\nsrc_size is too small to contain a complete smb2_ea_info
  structure.\nConsequently, reads of ea_name_length and ea_value_length can occur\n\
  out-of-bounds.\n\nFix this by ensuring src_size >= sizeof(*src) before attempting
  to read\nany structure fields. Additionally, reject any next_entry_offset that is\n\
  smaller than sizeof(*src) or that would advance the pointer beyond the\navailable
  buffer.\n\nNote that for calls where the server returns a malformed EA list, the\n\
  error returned to userspace changes from -ENODATA (getxattr) or\n-ERANGE (listxattr)
  to -EIO. This correctly signals a server protocol\nerror rather than misleadingly
  indicating \"attribute not present\" or\n\"output buffer too small\"."
