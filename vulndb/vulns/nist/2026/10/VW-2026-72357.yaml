title: "Inefficient algorithmic complexity in the decoding of message header fields
  in Progressive Robot hMailServer 6.0.0 through 6.3.5 allows a remote unauthenticated
  attacker to make the IMAP, SMTP and POP3 services, or the webmail, unavailable by
  sending a message. The server unfolded a decoded header value by finding each line
  break from the end of the value and removing it, moving the rest of the value each
  time, so its work grew with the square of the number of line breaks, and an RFC
  2047 encoded word may decode to any number of them. A received message whose Subject
  or other header field holds such a value keeps a worker thread busy for minutes
  or longer each time the value is read: when the recipient's IMAP client searches,
  sorts or threads the folder by a header, when the webmail lists the folder, and,
  where configured, when a rule tests a header, a spam tag is added to the Subject
  or an abuse report is read during delivery. The IMAP worker threads are shared with
