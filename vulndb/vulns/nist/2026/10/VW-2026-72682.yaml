title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ip6t_rpfilter: reject routes without inet6_dev\n\nip6_route_lookup() can return
  an error-free route whose rt6i_idev is\nNULL. Lowering an external nexthop device's
  MTU below IPV6_MIN_MTU tears\ndown its inet6_dev while fib6_ifdown() leaves routes
  using nexthop objects\nin the FIB. An unprivileged user can construct this state
  with rtnetlink\nin a private user and network namespace, then trigger a NULL dereference\n\
  through an IPv6 rpfilter lookup:\n\n  Oops: general protection fault, probably for
  non-canonical address\n  0xdffffc0000000000\n  KASAN: null-ptr-deref in range [0x0000000000000000-0x0000000000000007]\n\
  \  RIP: rpfilter_mt (net/ipv6/netfilter/ip6t_rpfilter.c:75)\n  Call Trace:\n  ip6t_do_table
  (net/ipv6/netfilter/ip6_tables.c:316)\n  nf_hook_slow (net/netfilter/core.c:619)\n\
  \  ipv6_rcv (net/ipv6/ip6_input.c:351)\n  __netif_receive_skb_one_core (net/core/dev.c:6216)\n\
  \  process_backlog (net/core/dev.c:6680)\n  __napi_pol"
