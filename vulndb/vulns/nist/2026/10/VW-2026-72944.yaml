title: The Academy LMS – AI Course Builder, Quizzes, Certificates & eLearning 
  plugin for WordPress is vulnerable to authorization bypass in all versions up 
  to, and including, 4.0.3. This is due to the plugin not properly verifying 
  that a user is authorized to perform an action. This makes it possible for 
  authenticated attackers, with custom-level access and above, to permanently 
  delete arbitrary Academy lesson comments and their replies authored by any 
  user, including administrators, across courses they do not instruct. This is 
  exploitable by any user registered as an Academy instructor for at least one 
  course, as they can supply their own course_id to pass the instructor check 
  while targeting comments belonging to entirely different courses.
