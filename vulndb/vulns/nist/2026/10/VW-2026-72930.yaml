title: Mindwtr is a free offline-first task management application for desktop 
  and mobile. Prior to 1.1.5, the mobile application writes the Cloud sync 
  bearer token and WebDAV password to unencrypted AsyncStorage under 
  @mindwtr_cloud_token and @mindwtr_webdav_password. A party with access to the 
  application database or an exposed device backup can recover these credentials
  and use them to access the user's synchronized tasks and attachments. This 
  issue is fixed in version 1.1.5.
