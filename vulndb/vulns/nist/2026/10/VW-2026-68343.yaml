title: A vulnerability was detected in Nothings stb up to 
  2c980bb59875b0d32144a71867fbdebb2f77cd20. The impacted element is the function
  hexwave_init in the library stb_hexwave.h. Performing a manipulation of the 
  argument width/oversample results in integer overflow. Remote exploitation of 
  the attack is possible. The exploit is now public and may be used. The project
  was informed of the problem early through an issue report but has not 
  responded yet.
