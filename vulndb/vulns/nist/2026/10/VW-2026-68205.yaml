title: Russh is a Rust SSH client and server library. Prior to 0.63.0, the 
  hybrid ML-KEM 768 and X25519 implementation in russh/src/kex/hybrid_mlkem.rs 
  accepts an all-zero 32-byte peer X25519 public key in both server_dh and 
  compute_shared_secret, forcing the X25519 contribution to the combined shared 
  secret to zero. A malicious SSH peer can therefore make the combined secret 
  depend only on ML-KEM, defeating the hybrid exchange's intended fallback 
  protection if ML-KEM is later weakened. This issue is fixed in version 0.63.0.
