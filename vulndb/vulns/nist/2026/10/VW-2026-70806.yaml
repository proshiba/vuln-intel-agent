title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  libertas_tf: fix UAF in lbtf_free_adapter()\n\nlbtf_free_adapter() calls lbtf_free_cmd_buffer()
  to free the command\nbuffers before calling timer_delete_sync() to wait for the
  command\ntimer callback.  If the timer callback (command_timer_fn) is already\n\
  running when lbtf_free_cmd_buffer() frees the command array, the\ncallback dereferences
  priv->cur_cmd->cmdbuf which points to freed\nmemory.\n\nSwap the order so that timer_delete_sync()
  runs first, ensuring any\nin-flight callback has completed before the command buffers
  are freed."
