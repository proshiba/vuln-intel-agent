title: MIT Kerberos 5 (krb5) through 1.22.2 contains a NULL pointer dereference 
  in make_cred_list() in rd_cred.c that allows authenticated Kerberos clients to
  crash services by sending mismatched KRB-CRED arrays. Attackers can send 
  forwarded credentials with more tickets than ticket_info entries through 
  gss_accept_sec_context() to crash GSS-API acceptor services, causing denial of
  service.
