title: A flaw has been found in gedelumbung HospitalManagement up to 
  c2d45543789a3887067d3915f69d44cfc2cf76a8. The affected element is the function
  kirim of the file application/modules/web/controllers/buku_tamu.php of the 
  component Guest Book. This manipulation of the argument nama/email/pesan 
  causes cross site scripting. Remote exploitation of the attack is possible. 
  The exploit has been published and may be used. This product follows a rolling
  release approach for continuous delivery, so version details for affected or 
  updated releases are not provided. The project was informed of the problem 
  early through an issue report but has not responded yet.
