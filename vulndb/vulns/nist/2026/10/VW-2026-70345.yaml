title: "Velociraptor allows collection of VQL queries packaged into Artifacts from
  endpoints. These artifacts can be used to do anything and usually run with elevated
  permissions. To limit access to some dangerous artifact, Velociraptor allows for
  those to require high permissions like EXECVE to launch.\n\nThe `Windows.Sysinternals.SysmonLogForward`
  is a monitoring artifact used to forward sysmon events to the server. The artifact
  allows the user to specify an arbitrary binary path as a parameter, and did not
  enforce an additional required permission, allowing users with COLLECT_CLIENT permissions
  (normally given by the \"Investigator\" role) to collect it from endpoints and run
  a different binary program than the installed sysmon binary.\nTo successfully exploit
  this vulnerability the user must already have access to collect artifacts from the
  endpoint (i.e. have the COLLECT_CLIENT given typically by the \"Investigator\" role)."
