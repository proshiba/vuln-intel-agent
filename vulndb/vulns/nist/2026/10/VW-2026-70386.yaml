title: "Asymmetric resource consumption (amplification) vulnerability in Apache Struts.
  When a request parameter is bound to an arbitrary-precision decimal (java.math.BigDecimal)
  property that is then rendered through the Struts tag library, the framework can
  produce a response many orders of magnitude larger than the request, allowing an
  unauthenticated remote attacker to exhaust server CPU and outbound network capacity
  with sustained low-volume traffic. Applications that do not bind request parameters
  to BigDecimal properties, or never render such a property through the Struts tag
  library, are not affected.\n\nThis issue affects Apache Struts: from 2.5.14 through
  2.5.33, from 6.0.0 through 6.11.0, from 7.0.0 through 7.3.0.\n\nUsers are recommended
  to upgrade to version 6.12.0 or 7.4.0, which fixes the issue."
