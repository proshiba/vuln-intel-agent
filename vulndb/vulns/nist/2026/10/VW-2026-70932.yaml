title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: hold reference on ct until flow is released\n\nnf_ct_put() releases the
  ct->ext area inmediately, the rcu typesafe\nsemantics also allow to refer to the
  wrong conntrack from the flowtable\ndatapath. Hold reference on ct until flow is
  released after rcu grace\nperiod.\n\nAdd rcu_barrier() on module exit path, to ensure
  pending flow entries\nare release before module goes away."
