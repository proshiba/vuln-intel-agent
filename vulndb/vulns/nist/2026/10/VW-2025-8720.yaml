title: "Netgate pfSense CE Suricata Path Traversal Remote Code Execution Vulnerability.
  This vulnerability allows remote attackers to create arbitrary files on affected
  installations of Netgate pfSense. Authentication is required to exploit this vulnerability.\n\
  \nThe specific flaw exists within the Suricata package. The issue results from the
  lack of proper validation of a user-supplied path prior to using it in file operations.
  An attacker can leverage this vulnerability to create files in the context of root.
  Was ZDI-CAN-28085."
