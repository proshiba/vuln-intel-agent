title: A vulnerability was identified in HKUDS AnyTool 0.1.0. Affected is the 
  function subprocess.run of the file anytool/local_server/main.py of the 
  component Execute Endpoint. The manipulation of the argument command/shell 
  leads to os command injection. It is possible to initiate the attack remotely.
  The exploit is publicly available and might be used. The project was informed 
  of the problem early through an issue report but has not responded yet.
