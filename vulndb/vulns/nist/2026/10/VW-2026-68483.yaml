title: "A missing check in LdapPasswordAuthenticator in component sshd-ldap in Apache
  MINA SSHD versions 1.2.0 to 2.19.0 or 3.0.0-M1 to 3.0.0-M5 bypassed authentication
  checks.\n\n\n\n\nApache MINA SSHD is a Java library for client-side and server-side
  SSH. The optional sshd-ldap component provides support for integrating password
  and publickey authentication on the server side with an LDAP server.\n\n\n\n\nsshd-ldap
  is an optional component. SSH servers implemented with Apache MINA SSHD are affected
  only if they use sshd-ldap and do configure an LdapPasswordAuthenticator to be used
  for password authentication. Normal password authentication via the built-in mechanisms
  in sshd-core is _not_ affected by this vulnerability, which concerns only LdapPasswordAuthenticator.\n\
  \n\n\n\nUsers are recommended to upgrade affected applications to version 2.20.0
  or 3.0.0-M6, which fix this issue."
