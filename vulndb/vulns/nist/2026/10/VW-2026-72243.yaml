title: An authorization logic vulnerability exists in the Brocade Fabric OS 
  versions before 10.0.1 REST API gateway. The internal gate guarding restricted
  management endpoints relies exclusively on client-controlled HTTP headers. An 
  authenticated user with any valid REST session can spoof these headers to gain
  unauthorized access to internal management endpoints. This allows 
  low-privilege users to view sensitive chassis metadata, hardware memory 
  patrolling state, and firmware integrity audit logs.
