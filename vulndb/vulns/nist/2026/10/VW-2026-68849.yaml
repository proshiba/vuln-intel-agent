title: "ssl.SSLContext.wrap_bio() didn't require the server_hostname argument\nto
  not be None if ssl.SSLContext.check_hostname was set. Due to a\nmissing parameter
  check in SSLObject, if the server_hostname argument\nisn't supplied then hostname
  verification would be silently skipped.\n\n\nThis defect could lead to programs
  where certificate hostname verification\n*appeared* to be succeeding with SSLContext.check_hostname
  = True and no\nValueError being raised due to misconfiguration.\n\n\nIf the program
  passes a server_hostname value that isn't an empty string\nor None to any of these
  APIs then certificate hostname verification\nproceeds as expected and the program
  is not affected by this vulnerability.\n\n\nMitigating this vulnerability doesn't
  require updating Python or applying\nthe patch. To mitigate, pass a valid non-None
  and non-empty\nserver_hostname value to SSLContext.wrap_bio(),\nasyncio.create_connection(),
  or asyncio.loop.start_tls() and\ncertificate hostname verification will proceed
  as expected. Up"
