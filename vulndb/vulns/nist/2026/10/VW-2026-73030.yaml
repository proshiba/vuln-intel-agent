title: The 10Web Booster – Website speed optimization, Cache & Page Speed 
  optimizer plugin for WordPress is vulnerable to Stored Cross-Site Scripting 
  via the 'author' parameter in all versions up to, and including, 2.34.8 due to
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. This is exploitable 
  because a comment author Name value containing ' src=' and an event-handler 
  payload contains no HTML tags or quote characters, allowing it to survive 
  WordPress core's sanitize_text_field and land verbatim inside the alt 
  attribute, where the plugin's own str_replace subsequently injects the single 
  quote that breaks out of the attribute context.
