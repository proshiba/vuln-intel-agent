title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Avoid integer underflow with ffs in EOP ring size calc\n\nThe low 6 bits of cp_hqd_eop_control
  store the base-2 logarithm\nof the EOP ring size. This was calculated as\n\nffs(q->eop_ring_buffer_size
  / sizeof(unsigned int)) - 1 - 1\n\nBut ffs can in theory return 1 or 0, so this
  could underflow\n(although in practice the ring buffer size cannot be less than
  4096).\n\nChange this to\n\nffs(q->eop_ring_buffer_size / sizeof(unsigned int) /
  4)\n\nusing properties of logarithms.\n\n(cherry picked from commit 4f18c56630383c14bfc6b2d65f88f2f895d2121a)"
