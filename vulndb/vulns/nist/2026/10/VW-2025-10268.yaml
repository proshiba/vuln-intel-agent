title: An issue was discovered in Open5GS 2.7.5-49-g465e90f, when processing a 
  PFCP Session Establishment Request (type=50), the UPF crashes with a reachable
  assertion in `lib/pfcp/context.c` (`ogs_pfcp_object_teid_hash_set`) if the 
  CreatePDR?PDI?F-TEID has CH=1 and the F-TEID address-family flag(s) 
  (IPv4/IPv6) do not match the GTP-U resource family configured for the selected
  DNN (Network Instance), resulting in a denial of service.
