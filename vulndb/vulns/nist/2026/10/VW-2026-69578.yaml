title: The WPMobile.App – Android and iOS App Builder plugin for WordPress is 
  vulnerable to authorization bypass in all versions up to, and including, 11.82
  This is due to the plugin not properly verifying that a user is authorized to 
  perform an action. This makes it possible for unauthenticated attackers to 
  exfiltrate password-reset URLs for arbitrary users, including administrators, 
  mirrored into the push queue by the mail-to-push feature, and use those URLs 
  to take over the targeted accounts. This exploit chain requires the plugin's 
  mail-to-push feature (wpmobile_auto_mail=1) to be enabled, as that setting is 
  what causes outbound WordPress password-reset emails — including the reset URL
  and key — to be mirrored into the push row queue where they become accessible 
  to the attacker.
