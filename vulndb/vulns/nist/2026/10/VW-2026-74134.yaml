title: SurrealDB from 3.0.0 before 3.3.0 contains a missing authentication 
  vulnerability in the revoke RPC method that allows low-privileged or 
  unauthenticated callers to invalidate other users' refresh tokens without 
  proof of possession. Attackers can obtain grant identifiers via ACCESS SHOW 
  ALL with VIEWER permission or leaked tokens, then permanently revoke refresh 
  tokens to force re-authentication.
