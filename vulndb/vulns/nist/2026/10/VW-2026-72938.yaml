title: Remote Attestation TLS Clients provides multi-language utilities for 
  verifying attested TLS connections. Prior to 0.5.0, the Rust and Go RA-TLS 
  challenge verifiers accepted quote ReportData that was bound to the 
  certificate public key and client nonce but not to the active TLS session 
  before permitting application traffic. An attacker who obtained an enclave TLS
  private key could relay a genuine quote onto another connection, causing the 
  clients to accept an attacker-terminated connection as the attested enclave. 
  This issue is fixed in 0.5.0.
