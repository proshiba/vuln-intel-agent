title: OpenS100 through commit daa35b contains an integer overflow vulnerability
  in the S-102 Bathymetric Surface parser that allows remote attackers to cause 
  a heap-based buffer overflow by opening a crafted S-102 HDF5 file with 
  malicious grid dimension metadata. Attackers can exploit the unvalidated 
  multiplication of numPointsLatitudinal and numPointsLongitudinal values in the
  S102_VG_BathymetryCoverage::Read() function to trigger a 32-bit integer 
  wraparound, resulting in undersized heap buffer allocation and subsequent 
  out-of-bounds writes that lead to application crash or arbitrary code 
  execution.
