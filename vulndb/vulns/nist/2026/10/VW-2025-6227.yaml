title: A vulnerability was detected in OFFIS DCMTK up to 3.6.9. Affected by this
  issue is the function DcmByteString::makeDicomByteString of the file 
  dcmdata/libsrc/dcbytstr.cc of the component dcmdata. The manipulation results 
  in memory corruption. The attack can be launched remotely. Upgrading to 
  version 3.7.0 can resolve this issue. The patch is identified as 
  4c0e5c10079392c594d6a7abd95dd78ac0aa556a. You should upgrade the affected 
  component.
