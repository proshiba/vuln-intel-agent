title: In Bouncy Castle for Java before 1.86, the opt-in key-size validation on 
  CMS key-transport recipients, 
  org.bouncycastle.cms.jcajce.JceKeyTransRecipient.setKeySizeValidation(true), 
  never ran for a message using RFC 9709 content-encryption key derivation 
  (id-alg-cek-hkdf-sha256). The branch that should have selected the actual 
  content-encryption algorithm carried in the key derivation 
  AlgorithmIdentifier's parameters compared the encrypted-key byte array against
  the id-alg-cek-hkdf-sha256 object identifier, a comparison between a byte 
  array and an ASN1ObjectIdentifier that is false for every possible input, so 
  the check fell through to a key-size lookup on the outer wrapper OID. That OID
  identifies a key-derivation construction rather than a cipher and has no 
  registered key size, so the size comparison was skipped entirely. A 
  key-transport EnvelopedData or AuthEnvelopedData whose transported, 
  HKDF-derived content-encryption key did not match the key size of the 
  advertised content-encrypt
