title: Mako is a template library written in Python. Prior to 1.4.2, on Windows,
  TemplateLookup.get_template() in mako/lookup.py resolves template URIs with 
  posixpath, while Template.__init__() in mako/template.py validates them with 
  os.path, which uses ntpath. A URI beginning with a drive designator causes 
  ntpath to absorb the traversal segments before the leading dot-dot check, 
  while posixpath resolution can escape the configured template directory. An 
  application that passes attacker-controlled template names or include paths 
  can disclose process-readable files on the same volume, and a targeted file 
  containing Mako template syntax may also be parsed and executed as a template.
  Raw URL paths are generally normalized before reaching this form, but query 
  strings, form or JSON bodies, route parameters, and dynamic include 
  expressions can preserve it. This issue is fixed in version 1.4.2.
