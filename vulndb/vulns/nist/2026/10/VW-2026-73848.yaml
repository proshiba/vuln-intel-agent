title: A vulnerability was determined in Eleveo Call Recording Software up to 
  10.3.0. This vulnerability affects unknown code of the file 
  /auth/realms/default/protocol/openid-connect/logout of the component JWT Token
  Handler. Executing a manipulation of the argument id_token_hint can lead to 
  use of get request method with sensitive query strings. The attack may be 
  launched remotely. A high complexity level is associated with this attack. It 
  is stated that the exploitability is difficult. The exploit has been publicly 
  disclosed and may be utilized. The vendor was contacted early about this 
  disclosure but did not respond in any way.
