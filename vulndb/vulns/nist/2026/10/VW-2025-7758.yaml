title: The Optimole – Optimize Images | Convert WebP & AVIF | CDN & Lazy Load | 
  Image Optimization plugin for WordPress is vulnerable to Insecure Direct 
  Object Reference in all versions up to, and including, 4.1.0 via the 
  /wp-json/optml/v1/move_image REST API endpoint due to missing validation on a 
  user controlled key. This makes it possible for authenticated attackers, with 
  Author-level access and above, to offload media that doesn't belong to them.
