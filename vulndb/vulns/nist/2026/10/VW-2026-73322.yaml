title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability 
  that allows low-privileged authenticated users to delete department permission
  bindings via the DELETE /sys/sysDepartPermission/deleteBatch endpoint. 
  Attackers can obtain row ids from the unguarded list endpoint and submit them 
  in the ids parameter to remove menus and buttons departments can grant to 
  their roles.
