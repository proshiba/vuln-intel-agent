  non-editable, but the authorization check is improperly implemented. With some
  crafted request, a logged-in user may alter the memo field. The affected 
  products and versions are GroupSession Free edition prior to ver5.3.0, 
  GroupSession byCloud prior to ver5.3.3, and GroupSession ZION prior to 
