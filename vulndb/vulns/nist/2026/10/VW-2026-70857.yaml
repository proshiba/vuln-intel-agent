title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  take commit root semaphore when iterating in mark_block_group_to_copy()\n\nmark_block_group_to_copy()
  iterates over the commit root with\nskip_locking=true. A concurrent transaction
  commit can swap and free\nthe commit root during iteration, causing use-after-free
  when\naccessing extent buffers.\n\nFix it by using path->need_commit_sem to protect
  the commit root search."
