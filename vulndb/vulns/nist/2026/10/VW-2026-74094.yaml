title: Parse Server 8.2.2 before 8.6.94 and 9.0.0 before 9.10.1-alpha.14 applies
  its GraphQL introspection control only to operation text sent directly with a 
  request, not to operations resolved from Apollo Server's automatic persisted 
  query cache. Unauthenticated attackers holding the public Application Id and 
  client key can replay an introspection query previously cached by a master or 
  maintenance key client to retrieve the schema, including private class and 
  field names.
