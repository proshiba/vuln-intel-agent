title: "Quick.Cart is vulnerable to Cross-Site Request Forgery in product creation
  functionality. Malicious attacker can craft special website, which when visited
  by the admin, will automatically send a POST request creating a malicious product
  with content defined by the attacker.\nThis software does not implement any protection
  against this type of attack. All forms available in this software are potentially
  vulnerable.\n\nThe vendor was notified early about this vulnerability, but didn't
  respond with the details of vulnerability or vulnerable version range. Only version
  6.7 was tested and confirmed as vulnerable, other versions were not tested and might
  also be vulnerable."
