title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wilc1000: fix out-of-bounds read in P2P public action frames\n\nwilc_wfi_p2p_rx()
  and mgmt_tx() start parsing a frame once\nieee80211_is_public_action() returns true.
  That helper only verifies the\nframe is long enough for the action category field,
  that is\noffsetofend(struct ieee80211_mgmt, u.action.category), 25 bytes. Both\n\
  functions then read the P2P public action header up to oui_subtype at\noffset 30
  and pass \"size - ie_offset\" to cfg80211_find_vendor_ie(), where\nie_offset is
  offsetof(struct ieee80211_mgmt, u) + sizeof(*d), i.e. 32.\n\nA public action frame
  of 25 to 31 bytes passes the check but is shorter\nthan that 32 byte header, so
  oui_subtype can be read out of bounds, and\nbecause the length is unsigned, \"size
  - ie_offset\" underflows to a value\nclose to 4 GiB. cfg80211_find_vendor_ie() takes
