title: Quasar Framework is a framework for building high-performance Vue.js user
  interfaces. Prior to @quasar/icongenie 6.1.1, the icongenie generate --profile
  command accepted folder and name values from a user-supplied profile without 
  constraining the resolved destination to the Quasar project directory. 
  icongenie/lib/utils/get-assets-files.js joined those values with appDir, while
  icongenie/lib/utils/validate-profile-object.js required only non-empty 
  strings, allowing parent-directory traversal. A developer who runs a crafted 
  profile can cause generated image content to be written or overwritten at any 
  path writable by that user, potentially modifying shell startup files, build 
  scripts, or other executable configuration. This issue is fixed in version 
  6.1.1.
