title: A vulnerability was detected in RainyGao DocSys up to 2.02.85. The 
  impacted element is the function BaseController.createDBForMysql of the file 
  BaseController.java of the component Database Management. The manipulation of 
  the argument url results in sql injection. The attack can be executed 
  remotely. The exploit is now public and may be used. The project was informed 
  of the problem early through an issue report but has not responded yet.
