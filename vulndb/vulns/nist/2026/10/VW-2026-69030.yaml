title: "The AI Engine – The Chatbot, AI Framework & MCP for WordPress plugin for WordPress
  is vulnerable to Stored Cross-Site Scripting in versions up to, and including, 3.8.0
  This is due to a chain of missing input neutralization and output escaping across
  the /mwai-ui/v1/chats/submit REST endpoint, the PHP error-log parser (MeowKit_MWAI_Helpers::php_error_logs),
  the Advisor task (Meow_MWAI_Modules_Advisor::run_advisor), and the Advisor dashboard
  widget (advisor_metabox): the server-parameter denylist in chat_submit strips only
  exact key names such as 'model' while convert_keys() later canonicalizes 'model_'
  back to 'model', allowing an unauthenticated caller to place an attacker-controlled
  string (including CR/LF) into $query->model; final_checks() throws an Exception
  whose message embeds that raw string, and the non-streaming, non-admin catch branch
  writes it to the PHP error log unmodified — creating a forged log line that the
  plugin's own parser subsequently returns as recent PHP-error co"
