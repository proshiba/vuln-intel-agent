title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/IPoIB:
  Avoid restoring OPER_UP after multicast flush\n\nipoib_ib_dev_flush_light() temporarily
  clears IPOIB_FLAG_OPER_UP to\nprevent multicast joins while ipoib_mcast_dev_flush()
  is running, and\nrestores the flag afterwards if it was previously set.\n\nThis
  restore races with ipoib_ib_dev_down(). If the interface is brought\ndown while
  the flush is in progress, ipoib_ib_dev_down() clears\nIPOIB_FLAG_OPER_UP, but the
  flush path may set it again after the device\nhas already gone down.\n\nSince commit
  894021a75291 (\"IB/ipoib: Make the carrier_on_task race\naware\"), ipoib_mcast_carrier_on_task()
  relies on IPOIB_FLAG_OPER_UP\nbeing cleared to terminate its rtnl_trylock() retry
  loop. If the flag is\nleft set after shutdown, the workqueue retries forever, causing
  teardown\nto deadlock when ipoib_ndo_uninit() waits in destroy_workqueue() while\n\
