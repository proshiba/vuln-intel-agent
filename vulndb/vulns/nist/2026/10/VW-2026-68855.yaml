title: "Missing authentication for critical function vulnerability for all PTZOptics
  cameras and the Firmware Upgrade Tool - Firmware Update modules. A missing authentication
  vulnerability in the firmware update mechanism of affected PTZOptics cameras allows
  an unauthenticated user to install modified firmware on the device without administrator
  credentials.\n\n\n\nThis vulnerability allows attackers to upload modified firmware
  to the device without admin credentials. This issue affects:\n\n\n\n\n\n  *  Move
  4K 12X before: 0.0.98\n  *  Move 4K 20X before: 0.1.33\n  *  Move 4K 30X before:
  2.1.17\n  *  Link 4K 12X before: 0.0.99\n  *  Link 4K 20X before: 0.1.37\n  *  Link
  4K 30X before: 2.1.18\n  *  Move SE 12X before: 9.1.66\n  *  Move SE 20X before:
  9.1.44\n  *  Move SE 30X before: 9.1.46\n  *  Studio 4K 12X before: 8.3.32\n  *\
  \  Studio 4K 20X before: 8.3.32\n  *  Studio SE 12X before: 8.3.32\n  *  Studio
  SE 20X before: 8.3.32\n  *  All Generation 2 cameras, including: PT12X-SDI-GY-G2,
  PT12X-SDI-WH-G2, PT12X-NDI-GY-G"
