title: Jivejdon through 5.0 contains an authentication bypass vulnerability that
  allows unauthenticated attackers to access Weibo-created accounts by deriving 
  predictable credentials from public Weibo user IDs. 
  OAuthAccountServiceImp.transferSina() sets the password to the first four 
  digits of the Weibo ID, letting attackers log in through normal form login to 
  read or post as victims.
