title: SGLang through 0.5.21 contains a decompression amplification 
  vulnerability in load_audio that allows remote attackers to exhaust memory by 
  submitting highly compressed audio decoded without duration or sample limits. 
  Attackers can supply small FLAC-encoded silence files through audio_url or 
  audio_data inputs that expand into massive PCM buffers, exhausting worker 
  memory and CPU for denial of service.
