title: Drawing-Captcha APP provides interactive, engaging verification for 
  Web-Based Applications. The vulnerability is a Host Header Injection in the 
  /register and /confirm-email endpoints. It allows an attacker to manipulate 
  the Host header in HTTP requests to generate malicious email confirmation 
  links. These links can redirect users to attacker-controlled domains. This 
  vulnerability affects all users relying on email confirmation for account 
  registration or verification. This vulnerability is fixed in 
  1.2.5-alpha-patch.
