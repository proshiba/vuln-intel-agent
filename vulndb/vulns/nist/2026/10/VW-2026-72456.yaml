title: pH7Builder (pH7 Social Dating CMS) before 18.5.1 contains a payment 
  validation vulnerability that allows registered low-privileged members to 
  obtain any membership tier by supplying client-controlled plan and amount 
  fields. Attackers can set item_number, cart_order_id, or the PayPal custom 
  field while paying a token amount, or submit uncompleted PayPal IPN payments, 
  to gain the most expensive membership and its paid features.
