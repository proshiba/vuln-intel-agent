title: Dell Storage Center - Dell Storage Manager, version(s) 20.1.21, 
  contain(s) an Improper Authentication vulnerability. An unauthenticated 
  attacker with remote access could potentially exploit this vulnerability, 
  leading to Protection mechanism bypass. Authentication Bypass in DSM Data 
  Collector. An unauthenticated remote attacker can access APIs exposed by 
  ApiProxy.war in DataCollectorEar.ear by using a special SessionKey and UserId.
  These userid are special users created in compellentservicesapi for special 
  purposes.
