title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  sdhci-of-aspeed: Remove children before releasing SDC resources\n\nProbe failure
  and removal leave SDHCI child devices registered after the\nparent clock and managed
  resources are released.\n\nUnregister the OF children in reverse order before disabling
  the parent\nclock on both paths. Use of_platform_device_destroy() because manual\n\
  child creation does not set the flag required by of_platform_depopulate().\n\nThis
  issue was identified during our ongoing static-analysis research\nwhile reviewing
  kernel code."
