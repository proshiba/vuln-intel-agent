title: 'Admidio 4.0.12 through 4.3.17 and 5.0.0 before 5.0.15 contains a reflected
  cross-site scripting vulnerability in system/redirect.php that allows unauthenticated
  attackers to inject JavaScript via the url GET parameter, due to an incomplete fix
  for CVE-2021-43810. Attackers can craft a javascript: URL containing a decoy http://
  segment that passes validation and executes script in the Admidio origin when victims
  click the redirect link.'
