title: In Bouncy Castle for Java LTS before 2.73.13, the one-shot native packet 
  ciphers for AES-CBC, CCM, CFB, CTR, GCM and GCM-SIV released the caller's key,
  IV and additional authenticated data arrays with JNI's 
  ReleaseByteArrayElements in mode 0, which commits the native copy back into 
  the Java array. Those arrays are read-only to the native code, and on a JVM 
  that returns a copy rather than a pin the copy still holds the input bytes as 
  they were read. The output buffer is taken through a separate critical region 
  and committed first, so where an application passed the same Java array as 
  both an input and the destination - encrypting in place over 
  KeyParameter.getKey(), for example - the later mode-0 release of the key wrote
