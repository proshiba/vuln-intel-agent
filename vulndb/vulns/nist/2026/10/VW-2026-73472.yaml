title: A vulnerability has been found in BerriAI LiteLLM up to 1.94.0. This 
  affects the function get_secret of the file secret_managers/main.py of the 
  component Secret Resolution. The manipulation of the argument api_key leads to
  improper authorization. The attack can be initiated remotely. The exploit has 
  been disclosed to the public and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
