title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  hold net_device reference under RCU in bundle creation\n\nxfrm_bundle_create() and
  xfrm_create_dummy_bundle() read dst->dev into\na local pointer without taking a
  device reference, then pass it to\nxfrm_fill_dst(). A concurrent RTM_DELLINK replaces
  dst->dev via\ndst_dev_put() and frees the old net_device, causing a use-after-free\n\
  when xfrm6_fill_dst() later dereferences the stale dev pointer.\n\n  BUG: KASAN:
  slab-use-after-free in xfrm6_fill_dst+0x82c/0x860\n  (net/ipv6/xfrm6_policy.c:86
  netdev_hold())\n  Read of size 8 at addr ffff8880142fe588 by task exploit/153\n\
  \  Call Trace:\n   xfrm6_fill_dst+0x82c/0x860\n   xfrm_resolve_and_create_bundle+0x21d4/0x2bd0\n\
  \   xfrm_lookup_with_ifid+0x485/0x1640\n   ip6_dst_lookup_flow+0x19b/0x1e0\n   udpv6_sendmsg+0x1443/0x2dd0\n\
  \nFix this by reading dst->dev via dst_dev_rcu() and keeping the RCU\nread-side
  critical section active until xfrm_fill_dst() has taken the\nrequired device references."
