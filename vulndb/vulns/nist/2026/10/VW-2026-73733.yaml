title: "databasement before 1.8.2 allows remote code execution because it runs certain
  commands (e.g., mariadb-dump) with a database name that can be specified by any
  authenticated user. For example, --result-file=/app/public/index.php can write to
  index.php. In other words, quoting prevents OS command injection in mariadb-dump,
  but the argument injection alone is sufficient for code execution indirectly. NOTE:
  the project's composer.json file does not indicate an independently published databasement
  Composer package."
