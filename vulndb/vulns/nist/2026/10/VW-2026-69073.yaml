title: A security vulnerability has been detected in formtools.org Form Tools up
  to 3.1.1. This vulnerability affects the function 
  Clients::updateClientSettingsTab of the file global/code/Clients.class.php of 
  the component Client Settings. The manipulation of the argument page_titles 
  leads to improper neutralization of special elements used in a template 
  engine. It is possible to initiate the attack remotely. The exploit has been 
  disclosed publicly and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
