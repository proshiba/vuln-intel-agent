title: Brocade Fabric OS versions before 10.0.1 contain an authorization logic 
  vulnerability in the AAA (Authentication, Authorization, and Accounting) 
  integration framework allows remote authenticated users to gain 
  root-equivalent chassis access controls. By returning specific, crafted 
  Vendor-Specific Attributes (VSAs) or directory claims from an external 
  identity provider (such as RADIUS, LDAP, TACACS+, or Federated IDP), an 
  account can bypass administrative role restriction checks during session 
  establishment.
