title: 'A vulnerability has been found in MikroTik RouterOS 7. This affects the function
  parse_json_element of the file /rest/ip/address/print of the component libjson.so.
  The manipulation leads to buffer overflow. The attack is possible to be carried
  out remotely. The exploit has been disclosed to the public and may be used. Upgrading
  to version 7.20.1 and 7.21beta2 mitigates this issue. You should upgrade the affected
  component. The vendor replied: "Our bug tracker reports that your issue has been
  fixed. This means that we plan to release a RouterOS update with this fix. Make
  sure to upgrade to the next release when it comes out."'
