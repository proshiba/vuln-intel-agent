title: A vulnerability was identified in 0xshariq github-mcp-server up to 
  52e764a7d66eac1726fce02ca7bb5a638571801a. This issue affects the function 
  child_process.exec of the file src/github.ts of the component Git Remove MCP 
  Tool. Such manipulation of the argument File leads to os command injection. 
  The attack can be executed remotely. The exploit is publicly available and 
  might be used. This product implements a rolling release for ongoing delivery,
  which means version information for affected or updated releases is 
  unavailable. The project was informed of the problem early through an issue 
  report but has not responded yet.
