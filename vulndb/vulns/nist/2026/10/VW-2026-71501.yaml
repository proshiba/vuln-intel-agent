title: "Improper Neutralization of Null Byte or NUL Character vulnerability in the
  EventLogAppender of Apache log4net.\n\nA NUL character in logged content ended the
  Windows Event Log record at that point, so everything the layout rendered after
  it, including exception text and trailing fields, was silently not stored. A party
  whose data reaches a log message could hide the rest of that record. Only applications
  on Windows that use EventLogAppender are affected.\n\nThis issue affects Apache
  log4net: from 1.2.9 before 3.5.0.\n\nUsers are recommended to upgrade to version
  3.5.0, which fixes the issue."
