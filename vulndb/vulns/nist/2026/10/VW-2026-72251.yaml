title: A memory buffer overflow vulnerability exists in the internal diagnostic 
  and route validation routines used by the Fabric Shortest Path First (FSPF) 
  protocol component of Brocade Fabric OS versions before 10.0.1. While this 
  code path is part of internal diagnostic functionality and is not directly 
  accessible via standard user interfaces or CLI management commands, an input 
  processing flaw allows incoming or internally routed diagnostic state payloads
  to exceed allocated memory boundaries. An attacker that is able to chain or 
  link other vulnerabilities to exploit this internal diagnostic could cause a 
  heap- or stack-based memory overrun, resulting in a daemon crash (Denial of 
  Service) or potential arbitrary code execution within the context of the 
  routing daemon.
