title: Yshopmall through 2.0.0 contains an insecure direct object reference 
  vulnerability in the after-sales API that allows authenticated members to 
  access other members' data by supplying their after-sales id and orderCode. 
  Attackers can call deleteAfterSalesOrder, addLogisticsInformation, or GET 
  /applyForAfterSales/{key} to view other members' order items and tamper with 
  or delete their after-sales records.
