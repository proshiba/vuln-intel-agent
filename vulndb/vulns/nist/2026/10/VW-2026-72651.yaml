title: A heap-based out-of-bounds write in the BoltReadHandler function 
  (src/bolt/bolt_api.c) in FalkorDB before 4.20.0 allows a remote 
  unauthenticated attacker to cause a denial of service and possibly execute 
  arbitrary code by sending a Bolt RESET message with an attacker-chosen chunk 
  size to the Bolt port. The handler checks the size only with ASSERT(), which 
  is compiled out in release builds, then computes a destination pointer from 
  the wire-supplied 16-bit size and moves buffered data up to about 64 KiB 
  backwards past the start of the read buffer. Only deployments that enable the 
  Bolt endpoint (BOLT_PORT, disabled by default) are affected.
