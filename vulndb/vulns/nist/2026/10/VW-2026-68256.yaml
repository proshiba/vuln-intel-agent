title: Dockhand before 1.0.36 contains an open redirect vulnerability in the 
  OIDC initiation endpoint that allows unauthenticated remote attackers to 
  redirect authenticated users to attacker-controlled sites by injecting an 
  unvalidated redirect query parameter. Attackers can craft a malicious link 
  targeting the OIDC callback flow to capture authorization codes via the 
  Referer header and conduct follow-up credential phishing against any Dockhand 
  account after a legitimate login.
