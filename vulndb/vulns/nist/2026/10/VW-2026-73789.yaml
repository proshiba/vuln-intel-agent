title: A weakness has been identified in westboy CicadasCMS up to 
  2431154dac8d0735e04f1fd2a3c3556668fc8dab. Affected is the function 
  TemplateController.input of the file /system/cms/template/input of the 
  component Template Management. This manipulation of the argument filePath 
  causes path traversal. It is possible to initiate the attack remotely. The 
  exploit has been made available to the public and could be used for attacks. 
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
