title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: mxl862xx: disable the stats poll on teardown\n\nmxl862xx_setup() arms the stats
  poll before mxl862xx_setup_mdio(), and\nnothing stops it until dsa_register_switch()
  has returned an error to\nmxl862xx_probe(). DSA frees the dsa_port list before it
  returns, so a\npoll that fires once .setup or a later step of dsa_tree_setup() has\n\
  failed walks freed ports. On shutdown the user ports stay registered,\nand the WORK_STOPPED
  flag test in mxl862xx_get_stats64() is not atomic\nwith the cancel in mxl862xx_shutdown(),
  so a re-arm that read the flag\nbefore it was set queues the poll after cancel_delayed_work_sync()
  has\nreturned.\n\nArm the poll once .setup has succeeded and stop it from a .teardown
  op,\nwhich DSA calls on unregister and after a failed registration, in both\ncases
  before it frees the ports. Use disable_delayed_work_sync() there\nand in shutdown():
  it drains a running poll as the cancel did and turns\nevery later atte"
