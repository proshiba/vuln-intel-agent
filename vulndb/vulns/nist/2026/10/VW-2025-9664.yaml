title: The Secure Copy Content Protection and Content Locking plugin for 
  WordPress is vulnerable to sensitive information exposure due to storage of 
  exported CSV files in a publicly accessible directory with predictable 
  filenames in all versions up to, and including, 4.9.2. This makes it possible 
  for unauthenticated attackers to access sensitive user data including emails, 
  IP addresses, usernames, roles, and location data by directly accessing the 
  exported CSV file.
