title: The Nelio Content – Editorial Calendar & Social Media Auto-Posting plugin
  for WordPress is vulnerable to authorization bypass in all versions up to, and
  including, 4.5.0 This is due to the plugin not properly verifying that a user 
  is authorized to perform an action. This makes it possible for authenticated 
  attackers, with contributor-level access and above, to permanently delete any 
  reusable social message (nc_reusable_social post), including those authored by
  administrators or other privileged users.
