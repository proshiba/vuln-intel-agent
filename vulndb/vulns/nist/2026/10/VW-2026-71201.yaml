title: The RabbitMQ Java client library allows Java and JVM-based applications 
  to connect to and interact with RabbitMQ nodes. Prior to 5.37.0, 
  com.rabbitmq.tools.json.JSONReader.read() fails to terminate when input ends 
  inside a quoted string or a line comment because its string and whitespace 
  scanners do not stop at CharacterIterator.DONE. The default 
  DefaultJsonRpcMapper passes JSON-RPC message bodies to this parser for 
  JsonRpcServer and client replies. A truncated string causes the parser to 
  append replacement end markers until heap exhaustion, while a line comment 
  without a terminating newline can keep a thread consuming CPU indefinitely, 
  resulting in denial of service. This issue is fixed in version 5.37.0.
