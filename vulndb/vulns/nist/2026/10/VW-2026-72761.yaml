title: "Improper Verification of Cryptographic Signature vulnerability in Apache CXF's
  JAX-RS XML Security module. The JAX-RS XML Signature interceptors (XmlSigInHandler,
  XmlSigInInterceptor and the streaming XmlSecInInterceptor) did not ensure that the
  XML passed to the application was covered by the signature. An attacker with any
  document signed by a trusted key could wrap it in unsigned content, which the application
  would then treat as signed.\nUsers are recommended to upgrade to versions 4.2.4
  or 4.1.9 or 3.6.13, which fix this issue."
