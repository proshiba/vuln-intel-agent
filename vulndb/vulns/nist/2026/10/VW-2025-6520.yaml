title: A weakness has been identified in SohuTV CacheCloud up to 3.2.0. Affected
  is the function advancedAnalysis of the file 
  src/main/java/com/sohu/cache/web/controller/InstanceController.java. This 
  manipulation causes cross site scripting. The attack is possible to be carried
  out remotely. The exploit has been made available to the public and could be 
  exploited. The project was informed of the problem early through an issue 
  report but has not responded yet.
