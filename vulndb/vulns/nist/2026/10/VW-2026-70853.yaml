title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  xfrm: use full sockets in local error paths\n\nxfrm6_local_rxpmtu() and xfrm6_local_error()
  dereference skb->sk as if it\nalways pointed at a full IPv6 socket.\n\nThat is not
  guaranteed. TCP SYN-ACK skbs can be owned by a\nTCP_NEW_SYN_RECV request_sock while
  the output path itself is driven by the\nfull listener. If rerouting selects an
  IPv6 XFRM tunnel route with a lower\nMTU, the local PMTU/error handling path can
  reach these callbacks with that\nmini-socket still attached to the skb.\n\nThe callbacks
  then miscast the request socket as a full inet/IPv6 socket and\ncan read beyond
  the request_sock allocation when they access inet_sock or\nipv6_pinfo state.\n\n\
  Resolve the owner with skb_to_full_sk() in both callbacks and bail out when\nno
  full socket is attached. This matches the surrounding XFRM IPv6 PMTU/error\nlogic,
  which already reasons about full sockets with skb_to_full_sk()."
