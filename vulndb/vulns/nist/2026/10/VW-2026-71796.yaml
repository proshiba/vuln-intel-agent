title: llama.cpp before b11393 contains a use-after-free and double free 
  vulnerability in common_chat_peg_mapper::map that allows unauthenticated 
  remote attackers to corrupt heap memory via a dangling current_tool pointer. 
  Attackers can submit a chat_parser in a POST /completion request emitting a 
  tool-id after a tool-close tag to crash llama-server and shape a heap write 
  primitive.
