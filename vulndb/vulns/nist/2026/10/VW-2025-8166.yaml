title: The Originality.ai AI Checker plugin for WordPress is vulnerable to 
  unauthorized loss of data due to a missing capability check on the 
  'ai_scan_result_remove' function in all versions up to, and including, 1.0.15.
  This makes it possible for authenticated attackers, with Subscriber-level 
  access and above, to delete all data in the wp_originalityai_log database 
  table, which can include post titles, scan scores, credits used, and other 
  data.
