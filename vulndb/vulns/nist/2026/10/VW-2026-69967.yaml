title: The Smart Manager – Advanced WooCommerce Bulk Edit & Inventory Management
  plugin for WordPress is vulnerable to generic SQL Injection via the 
  'access_privileges' parameter in all versions up to, and including, 8.97.0 due
  to insufficient escaping on the user supplied parameter and lack of sufficient
  preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. This exploit is only possible
  on installations where an administrator has saved a role-based deny-list 
  Access Privilege configuration that does not explicitly block the internal 
  'access-privilege' module, as this condition allows the authorization filter 
  to implicitly permit Subscriber-level users to invoke the vulnerable handler.
