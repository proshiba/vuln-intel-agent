title: A vulnerability was detected in floooh sokol up to 
  16cbcc864012898793cd2bc57f802499a264ea40. The impacted element is the function
  _sg_pipeline_desc_defaults in the library sokol_gfx.h. The manipulation 
  results in stack-based buffer overflow. The attack requires a local approach. 
  The exploit is now public and may be used. This product does not use 
  versioning. This is why information about affected and unaffected releases are
  unavailable. The patch is identified as 
  5d11344150973f15e16d3ec4ee7550a73fb995e0. It is advisable to implement a patch
  to correct this issue.
