title: 'jar: URLs retrieve local file content packaged in a ZIP archive. The null
  and everything after it was ignored when retrieving the content from the archive,
  but the fake extension after the null was used to determine the type of content.
  This could have been used to hide code in a web extension disguised as something
  else like an image. This vulnerability was fixed in Firefox 136, Firefox ESR 128.8,
  Thunderbird 136, and Thunderbird 128.8.'
