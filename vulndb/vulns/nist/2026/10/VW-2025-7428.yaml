title: A security issue exists within the Rockwell Automation Driver Package x64
  Microsoft Installer File (MSI) repair functionality, installed with FTLinx. 
  Authenticated attackers with valid Windows Users credentials can initiate a 
  repair and hijack the resulting console window for vbpinstall.exe. This allows
  the launching of a command prompt running with SYSTEM-level privileges, 
  allowing full access to all files, processes, and system resources.
