title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  handle lack of space when cleaning up verity items\n\nWhen enable_verity() hits
  the qgroup limit, rollback_verity() needs its\nown metadata reservation. When the
  qgroup limit or lack of space refuses\nthe rollback, the whole filesystem is forced
  read-only even though the\nqgroup limit was for one subvolume only. Also orphan
  cleanup at the next\nmount fails the same way, so the leftover items are never removed:
  with\n-EDQUOT the subvolume stays unreachable, and with -ENOSPC on a full\nfilesystem
  the next read-write mount fails.\n\nStart transactions with btrfs_start_transaction_fallback_global_rsv()
  in\nbtrfs_orphan_cleanup(), drop_verity_items() and rollback_verity(). Those\ncalls
  only delete items and free the space in the end, so they may use\nthe global reserve
  and skip the qgroup limit, which avoids -ENOSPC and\n-EDQUOT."
