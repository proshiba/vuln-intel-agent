title: "MISP contains a reflected cross-site scripting (XSS) vulnerability in the
  analyst data notes panel. The seed path parameter, supplied by the user via the
  URL, was passed directly into inline JavaScript within the rendered HTML response
  without any sanitization or type enforcement.\n\nAn attacker who can convince an
  authenticated MISP user to navigate to a crafted URL (for example, via a phishing
  link) can inject arbitrary JavaScript that executes in the victim's browser context.
  This may allow the attacker to read session tokens, manipulate the page, or perform
  actions on behalf of the victim.\n\nPreconditions:\n\n- The victim must be authenticated
  to MISP and access the analyst data view for an attribute or object.\n\n- The attacker
  must supply a malicious seed value in the URL path.\n\nImpact:\n\n- Execution of
  arbitrary JavaScript in the victim's browser session.\n\n- Potential theft of session
  credentials or sensitive data visible in the page.\n\n- Manipulation of the analyst
  data interface.\n\nAffe"
