title: Coolify is an open-source and self-hostable tool for managing servers, 
  applications, and databases. In Coolify versions up to and including 
  v4.0.0-beta.434, an attacker can initiate a password reset for a victim, and 
  modify the host header of the request to a malicious value. The victim will 
  receive a password reset email, with a link to the malicious host. If the 
  victim clicks this link, their reset token is sent to the attacker's server, 
  allowing the attacker to use it to change the victim's password and takeover 
  their account. As of time of publication, it is unclear if a patch is 
  available.
