title: oRPC is a tool that helps build APIs that are end-to-end type-safe and 
  adhere to OpenAPI standards. Prior to 1.14.10, the @orpc/zod 
  ZodSmartCoercionPlugin and experimental_ZodSmartCoercionPlugin collect object 
  and record properties in plain objects and resolve shape keys through the 
  prototype chain. A remote client that can reach a procedure with an object or 
  record input can supply __proto__ to replace the prototype of the returned 
  request object, allowing attacker-controlled inherited values to reach 
  application lookups. For object schemas, keys such as constructor, toString, 
  and __proto__ can instead resolve inherited members as Zod schemas and cause 
  an unhandled TypeError before validation. The global Object.prototype, 
  unrelated objects, other requests, and other users are not modified, and the 
  availability effect is limited to crafted requests rather than persistent 
  process-wide state. This issue is fixed in version 1.14.10.
