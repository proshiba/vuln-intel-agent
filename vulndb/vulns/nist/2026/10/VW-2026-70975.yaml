title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scpi: reject DVFS OPP count above MAX_DVFS_OPPS\n\nscpi_dvfs_get_info() already
  rejected a zero opp_count, but still trusted\nany larger value from the SCP firmware.
  The shared-memory reply only holds\nMAX_DVFS_OPPS entries in buf.opps[]; a bigger
  count over-reads that array\nand then sizes the allocated OPP table incorrectly
  (garbage OPPs / OOB).\nThe missing upper bound dates back to the original SCPI DVFS
  support.\n\nReject zero and out-of-range counts in one check and return -EINVAL."
