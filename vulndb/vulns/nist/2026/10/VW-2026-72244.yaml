title: An out-of-bounds memory read vulnerability exists in the web management 
  daemon of Brocade Fabric OS versions before 10.0.1. Unauthenticated HTTP 
  endpoints process specific URL query parameters without validating array index
  boundaries or performing numerical range checks. An unauthenticated remote 
  attacker can exploit this issue by sending a single, crafted HTTP request 
  containing extreme numerical values in the query string. This causes an 
  invalid memory dereference, resulting in a crash of the web management process
  (Denial of Service) and potential temporary management-plane disruption.
