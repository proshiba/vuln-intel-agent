title: An authentication logic and privilege escalation vulnerability exists in 
  the account management interface of Brocade Fabric OS versions before 9.2.2d 
  and 10.0.0 through 10.0.0a1. Under specific conditions, an authenticated user 
  can bypass authorization restrictions intended to prevent modifying another 
  account's access privileges. Exploitation allows a lower-privileged user to 
  assign administrative roles to a target account, leading to localized 
  privilege escalation.
