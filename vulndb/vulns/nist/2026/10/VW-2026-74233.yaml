title: A flaw has been found in KusalkaSilva Learning-Management-System up to 
  ffeb873f8803f1e9664384ff75000c7da45466d2. Affected is the function 
  getimagesize of the file upload_save.php. Executing a manipulation of the 
  argument uploaded_file/image can lead to unrestricted upload. The attack may 
  be launched remotely. The exploit has been published and may be used. This 
  product operates on a rolling release basis, ensuring continuous delivery. 
  Consequently, there are no version details for either affected or updated 
  releases. The project was informed of the problem early through an issue 
  report but has not responded yet.
