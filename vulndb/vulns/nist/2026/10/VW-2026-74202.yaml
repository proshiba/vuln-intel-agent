title: obsidian-tc is a governed, agent-ready Model Context Protocol server for 
  Obsidian vaults. Prior to 1.3.1, undefined readPaths and writePaths settings 
  allow all paths, strictReadDefault does not protect direct requests, and the 
  .obsidian, .git, and .trash control directories are excluded only during 
  enumeration. An authenticated caller can directly read sensitive files such as
  .obsidian/plugins/*/data.json, potentially exposing plugin API keys, Obsidian 
  Sync passwords, and other in-vault data. Version 1.3.1 fixes the vulnerability
  by denying the control directories by default and enforcing strictReadDefault 
  on direct request paths.
