title: SuperAGI up to 0.0.14 is vulnerable to Incorrect Access Control. The 
  agent execution controller endpoint /api/agentexecutions/schedule allows 
  authenticated users from one organization to schedule existing agents 
  belonging to a different organization without proper authorization checks. The
  endpoint accepts an agent_id parameter but does not verify that the agent 
  belongs to the authenticated user's organization.
