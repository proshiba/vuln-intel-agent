title: Docker Buildx Bake does not request the expected fs.read approval for 
  certain filesystem inputs. An untrusted Bake definition can expose a readable 
  file through a pathless secret whose ID is interpreted as a client-side 
  pathname, or consume a local OCI image layout outside the project after 
  entitlement validation checks a different path representation. Users who run 
  untrusted Bake definitions are affected.
