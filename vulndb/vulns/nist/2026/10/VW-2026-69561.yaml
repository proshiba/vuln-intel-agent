title: "Asymmetric Resource Consumption vulnerability in Apache Directory LDAP API.\n\
  \n\n\nStoring a password using the bcrypt algorithm with a high force like 30 in
  a LDAP server that supports this algorithm will cause the server CPU to  run for
  hours checking the credentials. A bounded cost should be enforced to avoid a server
  DOS.\n\n\n\nThis issue affects Apache Directory LDAP API: from 2.1.0 before 2.1.9.\n\
  \n\n\nUsers are recommended to upgrade to version 2.1.9, which fixes the issue."
