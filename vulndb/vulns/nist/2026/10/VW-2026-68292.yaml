title: virtualenv is a tool for creating isolated virtual python environments. 
  Prior to 21.7.12, BatchActivator.quote() returns prompt text unchanged before 
  activate.bat inserts it into a cmd.exe set "VAR=value" statement. An attacker 
  who influences --prompt, VIRTUALENV_PROMPT, or the corresponding configuration
  value can include a double quote that closes the assignment and leaves 
  following cmd.exe operators as executable syntax. When a user activates the 
  generated Windows environment, the injected commands run with that user's 
  privileges. This issue is fixed in version 21.7.12.
