title: Docling simplifies document processing by parsing diverse formats and 
  providing integrations with the generative AI ecosystem. From 2.82.0 until 
  2.118.1, HTMLBackendOptions(render_page=True) permits file URLs because 
  HTMLDocumentBackend._get_browser_request_block_reason does not enforce the 
  enable_local_fetch setting or confine local requests to the source document 
  directory. Crafted path-backed HTML can embed a readable local text file in a 
  browser-rendered page image when Playwright is installed. Only filesystem Path
  inputs are affected because stream inputs use an opaque origin, and the 
  default configuration, command-line interface, docling-serve, and 
  non-rendering backends are not affected. This issue is fixed in 2.118.1.
