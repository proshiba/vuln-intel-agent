title: A flaw was found in the X.509 client certificate authenticator of 
  Keycloak. When CRL Distribution Point checking is enabled, the server fails to
  properly validate the file paths provided in a client certificate. An attacker
  can provide a specially crafted certificate that causes the server to attempt 
  to read sensitive files from the local system or exhaust memory by loading 
  extremely large files, potentially leading to information disclosure or a 
  system crash.
