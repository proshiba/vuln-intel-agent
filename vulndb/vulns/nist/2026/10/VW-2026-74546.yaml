title: SAP S/4HANA does not perform sufficient instance-level authorization 
  checks for certain modification operations on associated business object data.
  An attacker with low privileges and local access to the system could bypass 
  authorization checks to modify data belonging to objects they are not 
  authorized for. This results in a high impact on integrity. There is no impact
  on confidentiality and availability.
