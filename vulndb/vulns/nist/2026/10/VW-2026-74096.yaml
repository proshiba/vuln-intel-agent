title: Craft CMS 4.0.0 before 4.18.7 and 5.0.0 before 5.10.14 contains an 
  arbitrary file read vulnerability because the Twig create() class blocklist 
  does not cover DOMDocument. Attackers able to set an entry-type title format, 
  including via project-config/apply, can use 
  create('DOMDocument').loadHTMLFile() with textContent to expose local file 
  contents to non-admin users who can view entries.
