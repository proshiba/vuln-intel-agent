title: "TP-Link Tapo\nC500 v2.0 contains an out-of-bounds stack write vulnerability
  in its ONVIF PTZ\nSOAP handlers. An authenticated ONVIF client can submit an excessive
  number of\npreset-related elements, causing writes beyond the bounds of fixed-size
  stack\narrays and resulting in a crash of the affected service.\n\n\n\n\n\n\n\n\n\
  \nSuccessful\nexploitation may allow an authenticated attacker to cause the affected
  service\nto crash, resulting in a denial-of-service condition. Repeated exploitation
  may\nrepeatedly disrupt camera management and PTZ-related functionality until the\n\
  service recovers or restarts."
