title: CiviForm simplifies applications for government benefits programs by 
  reusing applicant data across multiple benefit applications. Prior to 3.33.0, 
  GET /admin/tiDash/editClientForm/:accountId verifies that the requester is a 
  Trusted Intermediary but showEditClientForm performs a raw 
  lookupAccount(accountId) without confirming that the citizen account belongs 
  to the requester's trustedIntermediaryGroup. An authenticated Trusted 
  Intermediary can enumerate accountId values and read the applicant display 
  name, including the citizen's name and email address, for accounts outside the
  intermediary's group. This issue is fixed in version 3.33.0.
