title: FrankenPHP is a modern application server for PHP. Prior to 1.12.5, the 
  official FrankenPHP Debian and Alpine Docker images include a default 
  /app/public/index.php that executes phpinfo(). A derived image that does not 
  overwrite this placeholder serves the diagnostics page in production and can 
  disclose environment variables used for secrets, PHP configuration directives,
  loaded extensions, software versions, and system paths. Images built using the
  documented pattern with their own /app/public/index.php are not affected, and 
  already derived images must be rebuilt or supplied with an application index 
  to remove the exposed placeholder. This issue is fixed in version 1.12.5.
