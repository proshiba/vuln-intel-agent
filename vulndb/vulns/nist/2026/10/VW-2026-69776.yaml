title: "Nx is a monorepo solution for TypeScript and polyglot codebases. From 13.10.0
  until 22.7.10 and 23.2.1, Nx migration planning reads the nx-migrations.migrations
  value from a target package manifest without validating that it is a contained relative
  path. A hostile direct dependency or a package introduced through a trusted package's
  packageGroup can supply .. segments or an absolute path, causing nx migrate to join
  an escaping destination onto its temporary directory. The migration archive can
  then write attacker-controlled bytes outside the temporary directory, while opening
  the destination stream can truncate an existing writable file even when no archive
  entry matches. This occurs during migration planning before review of the migration
  list or use of --run-migrations; the vulnerable installed Nx copy is reached when
  the normal nx@latest handoff is bypassed with NX_USE_LOCAL, NX_MIGRATE_USE_LOCAL,
  NX_MIGRATE_CLI_VERSION, --run-id, or fallback after a temporary-install failure.
