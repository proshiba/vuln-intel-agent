title: Nginx UI is a web user interface for the Nginx web server. Prior to 
  2.4.1, POST /api/otp_enroll and POST /api/finish_passkey_register are 
  registered outside RequireSecureSession and accept a normal authenticated 
  session without verifying the current password. An attacker with a stolen JWT 
  can bind an attacker-controlled TOTP secret when the victim has not already 
  enabled TOTP, or can register an attacker-controlled passkey because that path
  has no equivalent existing-enrollment guard. These changes create persistent 
  account access that can survive a password change and interfere with the 
  legitimate user's authentication. This issue is fixed in version 2.4.1.
