title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disallow bpf_skb_pull_data() for LWT_SEG6LOCAL\n\nAn LWT_SEG6LOCAL program can invalidate
  its cached SRH with\nbpf_lwt_seg6_adjust_srh() and then call bpf_skb_pull_data().
  The latter\nmay reallocate skb->head, leaving the per-CPU SRH pointer dangling.\n\
  Post-program SRH validation then writes through that pointer.\n\nDisallow bpf_skb_pull_data()
  for LWT_SEG6LOCAL programs so the verifier\nrejects this unsafe helper combination.
  Other LWT program types continue\nto expose the helper through lwt_out_func_proto()."
