title: A weakness has been identified in ZongXR SuperMarket 1.0.0.0. This 
  affects the function startBuy of the file 
  instant-buy/src/main/java/com/supermarket/instantbuy/controller/InstantBuyController.java
  of the component Instant Buy. Executing a manipulation of the argument 
  Username can lead to missing authentication. The attack may be performed from 
  remote. The exploit has been made available to the public and could be used 
  for attacks. The project was informed of the problem early through an issue 
  report but has not responded yet.
