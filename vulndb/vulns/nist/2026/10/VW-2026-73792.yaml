title: VeraCrypt 1.26.29 (FUSE-T build) on macOS sometimes allows unintended 
  access to decrypted data. It does not terminate the FUSE-T auxiliary service 
  (go-nfsv4) and its associated VeraCrypt core-service helper processes when a 
  volume is dismounted. After VeraCrypt reports the volume as dismounted, the 
  auxiliary mount continues to serve the decrypted volume image (volume.dmg) 
  over a loopback SMB session, and the leaked processes retain an open handle to
  the underlying raw device. A local user or process can therefore remount and 
  access the decrypted volume without the passphrase, e.g., by reopening a 
  previously accessed path (such as through a macOS Open Recent menu) or by 
  attaching volume.dmg from the stale auxiliary mount. (The macFUSE build of 
  VeraCrypt is not affected.)
