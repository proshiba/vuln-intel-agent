title: In Qt for MCUs, a Text element that displays styled text halts the device
  if an <img> tag in the text contains an attribute with an empty value. The 
  text parser passes the empty value to an internal check that only accepts 
  non-empty values. The check fails and reports an error, and the default error 
  handler halts the device.
