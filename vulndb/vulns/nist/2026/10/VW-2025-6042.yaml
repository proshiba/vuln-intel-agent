title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  Fix detection of atomic context\n\nCurrent check for atomic context is not sufficient
  as\nz_erofs_decompressqueue_endio can be called under rcu lock\nfrom blk_mq_flush_plug_list().
  See the stacktrace [1]\n\nIn such case we should hand off the decompression work
  for async\nprocessing rather than trying to do sync decompression in current\ncontext.
  Patch fixes the detection by checking for\nrcu_read_lock_any_held() and while at
  it use more appropriate\n!in_task() check than in_atomic().\n\nBackground: Historically
  erofs would always schedule a kworker for\ndecompression which would incur the scheduling
  cost regardless of\nthe context. But z_erofs_decompressqueue_endio() may not always\n\
  be in atomic context and we could actually benefit from doing the\ndecompression
  in z_erofs_decompressqueue_endio() if we are in\nthread context, for example when
  running with dm-verity.\nThis optimization was later added in patch [2] which has
  show"
