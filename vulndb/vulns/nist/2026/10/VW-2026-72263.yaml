title: An arbitrary file manipulation vulnerability exists in the WebTools 
  management interface of Brocade Fabric OS versions before 9.2.2d and 10.0.0 
  through 10.0.0a1. When processing configuration transfer requests, the 
  application fails to properly validate and sanitize a user-supplied status 
  file path parameter. An authenticated administrative user can exploit this 
  issue by submitting a specially crafted status file parameter, causing the 
  underlying process to move an arbitrary system file to a predictable, 
  world-readable temporary directory. This can lead to persistent Denial of 
  Service (DoS), critical system file destruction, host compromise, or sensitive
  data leakage.
