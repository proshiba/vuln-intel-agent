title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix rlist race and missing initialization\n\nTCP_Server_Info.rlist is allocated
  via kzalloc which zeros both ->next\nand ->prev to NULL instead of pointing to itself,
  making list_empty()\nalways return false and list_add() dereference a NULL ->prev
  pointer.\n\nAlso, cifs_signal_cifsd_for_reconnect() can be called concurrently\n\
  from multiple cifsd threads, allowing the same server's rlist node to\nbe added
  twice into the local list, corrupting it."
