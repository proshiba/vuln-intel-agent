title: The Duplicate Post plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'noti_token' parameter in all versions up to, and
  including, 1.5.6 due to insufficient input sanitization and output escaping. 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page. This requires that the site owner 
  has enabled the plugin's User Level Permissions for the Subscriber role, as 
  this grants access to the i_saw_this_noti AJAX branch needed to deliver the 
  payload.
