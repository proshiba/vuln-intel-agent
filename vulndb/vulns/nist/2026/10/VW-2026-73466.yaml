title: A vulnerability was identified in Furion .NET Framework up to 4.9.9.92. 
  The impacted element is the function String.Replace of the file 
  framework/Furion/Templates/Extensions/StringRenderExtensions.cs. The 
  manipulation of the argument Name leads to sql injection. Remote exploitation 
  of the attack is possible. The exploit is publicly available and might be 
  used. The vendor was contacted early about this disclosure but did not respond
  in any way.
