title: A flaw has been found in formtools.org Form Tools up to 3.1.1. Impacted 
  is the function smart_fill of the file /global/code/actions.php of the 
  component AJAX Endpoint. This manipulation of the argument url causes 
  server-side request forgery. The attack can be initiated remotely. The exploit
  has been published and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
