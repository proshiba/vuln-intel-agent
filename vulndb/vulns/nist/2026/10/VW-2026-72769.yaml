title: "Apache CXF's FIQL query parser has a vulnerability in how it searches for
  operators in query expressions. The search pattern can get stuck trying many combinations
  when it encounters a long string without an operator, causing the parser to consume
  excessive CPU time. An attacker can send a crafted query to make the server use
  up CPU resources, potentially slowing down or stopping other requests. The fix was
  to limit FIQL expressions to 4 KiB by default, preventing attackers from sending
  extremely long inputs while still allowing normal queries.\n\nUsers are recommended
  to upgrade to versions 4.2.4 or 4.1.9 or 3.6.13, which fix this issue."
