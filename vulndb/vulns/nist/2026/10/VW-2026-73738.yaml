title: 'A weakness has been identified in Appwrite up to 2.3.0. This vulnerability
  affects the function PublicHostname of the file src/Appwrite/Platform/Modules/Avatars/Http/Screenshots/Get.php
  of the component Browser Screenshot Service. This manipulation of the argument url
  causes server-side request forgery. The attack can be initiated remotely. Upgrading
  to version 2.4.0 is able to resolve this issue. Patch name: 393255e7302ae5503331d45802e2eee01c6a47fe.
  You should upgrade the affected component.'
