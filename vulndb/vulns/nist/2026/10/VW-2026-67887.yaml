title: A vulnerability has been found in bg5sbk MiniCMS up to 1.8. The affected 
  element is an unknown function of the file /mc-admin/page-edit.php of the 
  component Publish Page Handler. Such manipulation leads to improper 
  authentication. The attack may be performed from remote. The exploit has been 
  disclosed to the public and may be used. The existence of this vulnerability 
  is still disputed at present. The vendor was contacted early about this 
  disclosure but did not respond in any way.
