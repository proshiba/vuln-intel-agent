title: A vulnerability has been found in Gerapy up to 0.9.13. This vulnerability
  affects the function project_create of the file gerapy/server/core/views.py of
  the component Project Management. The manipulation of the argument 
  project_name leads to path traversal. Remote exploitation of the attack is 
  possible. The exploit has been disclosed to the public and may be used. The 
  identifier of the patch is 6e481078cfba6388a67ca2d9792288405019ba3e. Applying 
  a patch is the recommended action to fix this issue.
