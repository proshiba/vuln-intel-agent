title: "Use of Non-Canonical URL paths for authorization decisions vulnerability in
  Apache APISIX.\n\n\n\nIn some configurations where a permissive route overlaps a
  protected one, a crafted encoded path can reach an upstream endpoint that the matched
  route's policies were never meant to cover. A request that should have been rejected
  is served instead, giving unauthenticated access to a protected upstream endpoint.
  This issue affects Apache APISIX: from 2.14.1 through 3.18.0.\n\n\n\nUsers are recommended
  to upgrade to version 3.19.0, which fixes the issue."
