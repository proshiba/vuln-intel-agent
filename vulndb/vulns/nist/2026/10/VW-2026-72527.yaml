title: TVU Networks Receiver/Transceiver devices running firmware before version
  7.9 contain a missing authentication vulnerability that allows remote 
  unauthenticated attackers to read sensitive device information and modify 
  device configuration via unprotected REST API endpoints. Attackers can send 
  unauthenticated GET requests to disclose network configuration, firmware 
  details, and cloud service information, or issue POST requests to endpoints 
  such as /Setting3/API/API/v1/LocalNetwork/DNS to alter DNS settings and enable
  man-in-the-middle attacks on outbound connections to TVU cloud infrastructure.
