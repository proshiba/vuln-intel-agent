title: The Appointment Booking Plugin – LatePoint | Calendar & Scheduling for 
  WordPress plugin for WordPress is vulnerable to Insecure Direct Object 
  Reference in versions up to, and including, 5.7.1 via the 
  OsPaypalConnectController::create_order_for_transaction() action registered as
  a public (unauthenticated) route through wp_ajax_nopriv_latepoint_route_call. 
  The handler loads an OsInvoiceModel by a sequential integer 'invoice_id' with 
  no access-key/UUID or ownership check (the sibling Stripe and Razorpay 
  handlers require a 128-bit access-key UUID via 
  OsInvoicesHelper::get_invoice_by_key), and then calls 
  OsTransactionIntentHelper::create_or_update_transaction_intent() which 
