title: The The WP Ultimate Review plugin for WordPress is vulnerable to 
  arbitrary shortcode execution in all versions up to, and including, 2.4.3. 
  This is due to the software allowing users to execute an action that does not 
  properly validate a value before running do_shortcode. This makes it possible 
  for authenticated attackers, with subscriber-level access and above, to 
  execute arbitrary shortcodes. The bypass relies on WordPress's own 
  strip_shortcodes() function unwrapping the [[tag]] double-bracket escape to a 
  bare [tag] that survives wp_insert_post storage and fires when the publicly 
  queryable xs_review post type is rendered through the_content.
