title: The WP Popular Posts plugin for WordPress is vulnerable to Sensitive 
  Information Exposure in all versions up to, and including, 7.4.2 via the 
  'context' parameter. This makes it possible for unauthenticated attackers to 
  extract sensitive edit-context fields — including raw title, raw content body,
  password, meta, status, and guid — from non-public post objects such as 
  wp_block synced patterns that WordPress core itself refuses to expose to 
  unauthenticated callers. This is possible because the plugin's REST route is 
  registered with a permission_callback of __return_true and passes the 
  caller-supplied context parameter (e.g., context=edit) directly to 
  WP_REST_Posts_Controller::prepare_item_for_response() without invoking 
  get_item_permissions_check() or check_read_permission(), while the underlying 
  query accepts an arbitrary post_type value without enforcing public or 
  show_in_rest visibility flags.
