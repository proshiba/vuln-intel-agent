title: A flaw has been found in Frappe LMS 2.35.0. Impacted is an unknown 
  function of the file /files/ of the component Assignment Picture Handler. This
  manipulation causes direct request. The attack may be initiated remotely. The 
  attack's complexity is rated as high. The exploitability is considered 
  difficult. The exploit has been published and may be used. It is advisable to 
  upgrade the affected component. The vendor was informed early about a total of
  four security issues and confirmed that those have been fixed. However, the 
  release notes on GitHub do not mention them.
