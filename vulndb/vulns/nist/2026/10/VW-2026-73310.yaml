title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  the SysLogController delete handler that allows any authenticated user to 
  delete audit log entries. Low-privileged attackers can obtain log ids from the
  unguarded /sys/log/list endpoint and delete chosen sys_log records to erase 
  traces of their actions.
