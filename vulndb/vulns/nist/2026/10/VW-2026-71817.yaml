title: Backstage is an open framework for building developer portals. Prior to 
  0.21.8, the @backstage/plugin-kubernetes-backend package is affected by 
  improper entity validation in deprecated kubernetes services endpoint. An 
  authenticated user with Kubernetes read permissions could access Kubernetes 
  workload data beyond their intended scope by supplying crafted entity data to 
  the deprecated services endpoint. The exposure is limited to read-only access 
  to Kubernetes object metadata across configured clusters. This issue is fixed 
  in version 0.21.8.
