title: A vulnerability was found in libsndfile up to 1.2.2. This issue affects 
  the function wavlike_subchunk_parse of the file src/wavlike.c of the component
  WAV Parsing. Performing a manipulation results in use of uninitialized 
  variable. Remote exploitation of the attack is possible. The exploit has been 
  made public and could be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
