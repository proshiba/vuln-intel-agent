title: "LibreChat is a ChatGPT clone with additional features. Version 0.8.1-rc2 does
  not enforce proper access control when\nquerying agent permissions. An authenticated
  attacker can read the permissions of arbitrary agents, even if they have no permissions
  for this agent. LibreChat allows the configuration of agents that have a predefined
  set of instructions and context. Private agents are not visible to other users.
  However, if an attacker knows the agent ID, they can read the permissions of the
  agent including the permissions individually assigned to other users. This issue
  is fixed in version 0.8.2-rc2."
