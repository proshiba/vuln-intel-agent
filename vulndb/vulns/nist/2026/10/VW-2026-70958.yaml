title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: don't get the radio mask for netdev-less wdevs\n\ncfg80211_calculate_bi_data()
  calls rdev_get_radio_mask() with\nwdev->netdev, which can be NULL and then crashes
  in mac80211.\n\nTo avoid that, invert the order of checks since wdev->netdev\nis
  always valid for beaconing interfaces."
