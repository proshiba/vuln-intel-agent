title: A vulnerability was identified in simstudioai sim up to 0.5.27. This 
  vulnerability affects unknown code of the file apps/sim/lib/auth/internal.ts 
  of the component CRON Secret Handler. The manipulation of the argument 
  INTERNAL_API_SECRET leads to improper authentication. It is possible to 
  initiate the attack remotely. The exploit is publicly available and might be 
  used. The identifier of the patch is e359dc2946b12ed5e45a0ec9c95ecf91bd18502a.
  Applying a patch is the recommended action to fix this issue.
