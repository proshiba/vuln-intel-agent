title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/shrinker:
  Take a runtime PM ref before shrinking non-system memory\n\n__xe_shrinker_walk()
  walks the SYSTEM and TT LRUs without a runtime PM\nreference.  Shrinking a bo outside
  system memory invalidates its GPU\nmappings, which needs the device resumed, so
  while it is runtime\nsuspended the page table zap trips an assert and the TLB invalidation\n\
  returns -ENODEV:\n\n  WARNING: drivers/gpu/drm/xe/xe_bo.c:770 at xe_bo_move_notify+0x1fc/0x450
  [xe]\n   xe_bo_shrink+0x20f/0x2b0 [xe]\n   __xe_shrinker_walk+0x174/0x410 [xe]\n\
  \   xe_shrinker_scan+0x10c/0x1e0 [xe]\n   do_shrink_slab+0x176/0x7e0\n   drop_caches_sysctl_handler+0x9c/0xf0\n\
  \nTake a reference before walking a memory type other than XE_PL_SYSTEM\nand stop
  there if it cannot be acquired.  Reuse the shrinker's existing\nacquire path, which
  resumes the device directly where reclaim allows\nthat and otherwise queues the
  PM worker for a later scan.  Stop the walk\nonce the scan targe"
