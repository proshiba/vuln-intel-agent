title: Camunda 7.24.0 before 7.24.15 contains an incorrect authorization 
  vulnerability in the Admin web application's first-run setup endpoint, where 
  SetupResource incorrectly determines setup availability by counting only 
  direct members of the camunda-admin group rather than recognizing all 
  configured administrators. An unauthenticated remote attacker can exploit this
  logic flaw to call the setup user-create endpoint and create a new 
  administrator account when the camunda-admin group is empty but the system is 
  fully administered, resulting in account takeover and potential process 
  deployment or script execution as the engine's service user.
