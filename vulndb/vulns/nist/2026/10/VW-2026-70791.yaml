title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix rmmio iounmap skipped on device removal\n\namdgpu_pci_remove() calls drm_dev_unplug()
  before fini_sw(), so\ndrm_dev_enter() is already false there and the iounmap() guarded
  by it\nis skipped. This .remove path runs on both hot-unplug and plain rmmod,\n\
  so the register BAR ioremap mapping leaks one instance per unload.\n\nUnmap rmmio
  unconditionally (guard only on non-NULL) and drop the now\nunused idx.\n\n(cherry
  picked from commit dd6f86a97260e5207d3329ad03aa89fdad61b1e6)"
