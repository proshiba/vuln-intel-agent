title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/packet:
  clear RX owner on VNET header error\n\nCommit 61fad6816fc1 (\"net/packet: tpacket_rcv:
  avoid a producer race\ncondition\") added rx_owner_map and made tpacket_rcv() claim
  a V1 or V2\nring slot before converting the virtio-net header.  If the conversion\n\
  fails, the drop path leaves the slot claimed.\n\nWith a one-frame TPACKET_V2 ring,
  an unsupported UDP GSO packet leaves\nthe only slot unavailable, so the ring also
  drops the next valid packet.\n\nClear the ownership bit on this error path.  TPACKET_V3
  already clears\nits block state here."
