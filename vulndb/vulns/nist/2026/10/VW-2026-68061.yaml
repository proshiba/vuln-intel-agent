title: "LibreChat is a ChatGPT clone with additional features. Version 0.8.1-rc2 is
  prone to a server-side request forgery (SSRF)\nvulnerability due to missing restrictions
  of the Actions feature in the default configuration. LibreChat enables users to
  configure agents with predefined instructions and actions that can interact with
  remote services via OpenAPI specifications, supporting various HTTP methods, parameters,
  and authentication methods including custom headers. By default, there are no restrictions
  on accessible services, which means agents can also access internal components like
  the RAG API included in the default Docker Compose setup. This issue is fixed in
  version 0.8.1-rc2."
