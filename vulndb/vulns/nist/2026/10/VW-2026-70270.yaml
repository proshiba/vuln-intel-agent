title: In Progress® Telerik® Fiddler® Classic for Windows, versions prior to 
  v6.0.20262.10021, HTTP request smuggling is possible in the proxy request 
  forwarding component. Requests containing multiple Content-Length headers with
  conflicting values are forwarded verbatim to the origin server, while Fiddler 
  frames the request body using only the first Content-Length value. A local 
  threat actor with low privileges who is able to send requests through the same
  Fiddler proxy instance as another user can exploit this desynchronization 
  against a non-RFC-9110-compliant origin server that keeps the connection alive
  to smuggle an additional request. Because Fiddler returns the server 
  connection to its pipe pool after reading only the first response, the unread 
  smuggled response remains buffered on the socket and is served to the next 
  session that reuses that connection, allowing the attacker to poison responses
  delivered to other users and to obtain responses intended for them.
