title: "A vulnerability was detected in TRENDnet TEW-751DR, TEW-752DRU and TEW733GR
  1.03B01/1.03B03. Affected is the function fwrite of the file pigwidgeon.cgi of the
  component Web Management Backend. The manipulation of the argument service results
  in os command injection. It is possible to launch the attack remotely. The exploit
  is now public and may be used. The vendor confirms: \"As this router was EOL'd in
  2011, we have no way of testing if such vulnerability exists. We will notify our
  customers of a potential vulnerability on this product.\" This vulnerability only
  affects products that are no longer supported by the maintainer."
