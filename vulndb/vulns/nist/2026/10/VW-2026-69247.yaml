title: "Improper Authentication vulnerability in Apache APISIX.\n\nOn a route using
  openid-connect plugin with remote introspection against an authorization server
  that serves multiple issuers, a token that introspects as active for one issuer
  may get accepted on a route restricted to another. This issue affects Apache APISIX:
  from 3.12.0 through 3.18.0.\n\nUsers are recommended to upgrade to version 3.19.0,
  which fixes the issue."
