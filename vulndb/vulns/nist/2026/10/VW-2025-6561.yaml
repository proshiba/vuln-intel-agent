title: 'A security flaw has been discovered in Portabilis i-Diario 1.5.0. The impacted
  element is an unknown function of the file /conteudos. Performing a manipulation
  of the argument filter[by_description] results in cross site scripting. The attack
  may be initiated remotely. The exploit has been released to the public and may be
  used for attacks. The patch is named d076c112b45e3b3e41cbe11de27949b491d922c2. It
  is recommended to apply a patch to fix this issue. The vendor confirms: "The searched
  term is now rendered escaped in the autocomplete widget, and the content tags are
  rendered through output-escaped templates, so an injected payload is displayed as
  inert text instead of being executed."'
