title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability 
  that allows low-privileged authenticated users to remove group memberships via
  the deleteGroupUser handler in SysUserController. Attackers can send DELETE 
  requests with arbitrary groupId and userId values to remove any user from any 
  administrator-maintained user group without ownership or tenant checks.
