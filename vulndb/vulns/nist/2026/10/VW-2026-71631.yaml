title: The Gitea push mirror API checked whether the repository owner, instead 
  of the requesting user, may use local file system paths. On instances with 
  `[security] IMPORT_LOCAL_PATHS = true`, a repository administrator who is not 
  allowed to import local paths could add a push mirror to a local path on the 
  server when the repository owner has that permission. Gitea then pushed the 
  repository's refs into an existing Git repository at that path with the 
  permissions of the Gitea process.
