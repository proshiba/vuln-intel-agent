title: "XPTI (Xen Page Table Isolation) was introduced to mitigate Meltdown\n(CVE-2017-5754,
  one aspect of XSA-254).  This involves copying 64-bit PV\nguest page table entries
  from guest-chosen root page tables to the Xen-\nchosen one which is in actual use
  by hardware.  To read the guest root\npage table, the directmap is used.  PV guests,
  however, have a directmap\nwhich may not cover all memory; in particular this is
  the case if any\nmemory extends beyond the 5 TiB (CONFIG_BIGMEM=y: 3.5 TiB) address\n\
  boundary."
