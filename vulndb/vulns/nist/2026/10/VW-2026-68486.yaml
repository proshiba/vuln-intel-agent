title: "MISP contains a privilege escalation vulnerability in the tag collection creation
  and editing functionality. The affected actions accepted the full HTTP request payload
  and passed it to a bulk-association save operation, which writes not only the intended
  tag collection record but also any associated model data present in the payload.\n\
  \nA user holding the tag editor permission could craft a request that includes additional
  model data (such as User or Organisation records) alongside the tag collection fields.
  Because the save operation processed all associated models indiscriminately, the
  injected sibling records were written to the database, enabling the attacker to
  modify or create privileged accounts and escalate to site administrator.\n\nPreconditions:\n\
  \n- An authenticated account with the tag editor permission (perm_tag_editor)\n\n\
  - Network access to the MISP instance\n\nImpact:\n\n- Unauthorized creation or modification
  of User and Organisation records\n\n- Privilege escalation from tag edito"
