title: A vulnerability was found in David-Crty databasement up to 1.7.1. This 
  impacts the function https:/github.com/David-Crty/databasement/pull/511 of the
  file app/Http/Requests/Api/V1/RestoreRequest.php of the component 
  database-servers API Endpoint. The manipulation of the argument schema_name 
  results in path traversal. The attack may be launched remotely. A high 
  complexity level is associated with this attack. The exploitability is said to
  be difficult. The exploit has been made public and could be used. Upgrading to
  version 1.7.2 will fix this issue. You should upgrade the affected component.
