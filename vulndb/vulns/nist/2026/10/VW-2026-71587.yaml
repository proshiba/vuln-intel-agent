title: Backstage is an open framework for building developer portals. Prior to 
  0.8.7, the @backstage/plugin-catalog-backend-module-gitlab package is affected
  by improper authorization in gitlab organizational user ingestion. Deployments
  that enable GitLab organization event ingestion and rely on scoped catalog 
  users as an access boundary may admit an unintended catalog identity. 
  Depending on sign-in and permission configuration, this may allow unauthorized
  access with the permissions of a standard authenticated user. This issue is 
  fixed in version 0.8.7.
