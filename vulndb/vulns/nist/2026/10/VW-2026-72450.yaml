title: Uncontrolled eviction in the browser session table of the REST API in 
  Progressive Robot hMailServer 6.2.28 through 6.3.5 allows a remote 
  authenticated user to end other users' sessions. The table of browser 
  sessions, shared by every account, the server administrator and support 
  sessions, dropped its least recently used session whenever it was full, 
  whoever it belonged to, and placed no limit on how many sessions one account 
  could hold. A user who repeatedly signs in with their own mailbox password can
  therefore keep the table full and sign out every webmail and administration 
  session that is idle for more than a short time, for as long as they continue.
