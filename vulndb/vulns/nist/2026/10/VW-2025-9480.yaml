title: TableProgressTracking is a MediaWiki extension to track progress against 
  specific criterion. Versions 1.2.0 and below do not enforce CSRF token 
  validation in the REST API. As a result, an attacker could craft a malicious 
  webpage that, when visited by an authenticated user on a wiki with the 
  extension enabled, would trigger unintended authenticated actions through the 
  victim's browser. Due to the lack of token validation, an attacker can delete 
  or track progress against tables. This issue is patched in version 1.2.1 of 
  the extension.
