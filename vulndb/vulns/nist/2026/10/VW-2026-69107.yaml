title: The Ultimate Multisite – WordPress Multisite SaaS & WaaS Platform plugin 
  for WordPress is vulnerable to Authentication Bypass in all versions up to, 
  and including, 2.15.0 via the `checkout_form` parameter of the 
  `login_customer_after_checkout` function. This is due to the publicly 
  accessible `wu_ajax_nopriv_wu_validate_form` AJAX handler accepting a freely 
  obtainable checkout nonce, and the `checkout_form=wu-finish-checkout` 
  parameter causing `get_validation_rules()` to discard all validation rules 
  while `finish_checkout_form_fields()` returns an empty step list — forcing 
  `is_last_step()` to return true and routing the request directly into full 
  order processing — after which `maybe_create_customer()` resolves the 
  attacker-supplied `email_address` to an existing WordPress user ID without any
  authentication or ownership verification, and 
