title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bcmgenet: restore the hardware filters on open\n\nbcmgenet_hfb_init() runs INIT_LIST_HEAD()
  on priv->rxnfc_list, which drops\nevery rule off the list, and bcmgenet_open() calls
  it on each ifup. Every\nrule the user configured is silently lost:\n\n  # ethtool
  -N eth0 flow-type ether dst $MAC action 0\n  Added rule with ID 0\n  # ethtool -n
  eth0 | grep -c Filter:\n  1\n  # ip link set eth0 down && ip link set eth0 up\n\
  \  # ethtool -n eth0 | grep -c Filter:\n  0\n\nInitialise the lists once at probe
  and restore the rules on open, as\nbcmgenet_resume() already does."
