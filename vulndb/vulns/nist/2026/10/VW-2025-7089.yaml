title: The Lisfinity Core - Lisfinity Core plugin used for pebas® Lisfinity 
  WordPress theme plugin for WordPress is vulnerable to privilege escalation via
  password update in all versions up to, and including, 1.4.0. This is due to 
  the plugin not properly validating a user's identity prior to updating their 
  password. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to change arbitrary user's passwords, 
  including those of administrators.
