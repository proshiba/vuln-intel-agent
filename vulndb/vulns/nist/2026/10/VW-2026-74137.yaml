title: DOMPurify before 3.4.16 contains a cross-site scripting vulnerability 
  that allows attackers to bypass sanitization because IN_PLACE mode returns a 
  force-removed style element whose text content still carries markup. Attackers
  can supply a style element containing a closing style tag and an img onerror 
  payload, which executes script when the application serializes and re-parses 
  the returned node.
