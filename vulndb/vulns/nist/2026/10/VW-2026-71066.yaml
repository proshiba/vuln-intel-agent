title: A security vulnerability has been detected in getformwork formwork up to 
  2.3.12. Impacted is the function DomSanitizer::sanitizeNodeAttribute of the 
  file formwork/src/Sanitizer/DomSanitizer.php of the component URI Sanitizer. 
  Such manipulation of the argument formaction leads to cross site scripting. 
  The attack may be launched remotely. Upgrading to version 2.3.13 is 
  recommended to address this issue. The name of the patch is 
  729701e59c5886685c5a1d477bdc3035e41f18b1. Upgrading the affected component is 
  advised.
