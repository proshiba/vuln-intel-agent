title: A vulnerability has been found in AdithyaYelloju 
  Restaurant-Management-System up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. 
  This vulnerability affects unknown code of the file User/login.php of the 
  component Login Form. Such manipulation of the argument email/passwd leads to 
  improper authentication. It is possible to launch the attack remotely. The 
  exploit has been disclosed to the public and may be used. This product takes 
  the approach of rolling releases to provide continious delivery. Therefore, 
  version details for affected and updated releases are not available. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
