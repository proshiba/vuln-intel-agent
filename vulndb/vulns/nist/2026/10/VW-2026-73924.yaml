title: yshop-crm through 2.1.3 contains a missing authorization vulnerability 
  that allows any authenticated back-office user to approve or reject invoices 
  via POST /admin-api/crm/invoice/check. The CrmInvoiceController check handler 
  lacks @PreAuthorize and approver checks are commented out, letting attackers 
  bypass the invoice approval workflow by supplying any invoice id.
