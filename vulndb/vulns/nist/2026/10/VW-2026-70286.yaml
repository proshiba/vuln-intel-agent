title: Joomla Extension - svenbluege.de - Cross-site scripting and open redirect
  on the share mini page in Event Gallery extension < 6.6.0 - The page a shared 
  image link opens (the share mini page of the front end) can link the article 
  the image was shared from when the option "Share article links" is on. It took
  the address of the article from the shared link and printed it into the page 
  without checking or escaping it; with the link type "Image Page with Redirect"
  it followed the address at once. A prepared link could therefore run a script 
  in the page, in the session of the visitor who opened it, or send the visitor 
  to another web site. Nothing on the server is changed or read by the server.
