title: A vulnerability has been found in EricLBuehler mistral.rs up to 0.9.3. 
  Impacted is the function is_global_ip of the file 
  mistralrs-server-core/src/media_source.rs. Such manipulation of the argument 
  ip leads to server-side request forgery. The attack can be launched remotely. 
  The exploit has been disclosed to the public and may be used. Upgrading to 
  version 0.9.4 is recommended to address this issue. The name of the patch is 
  cfb8c6a0c42361dc4579a9110b54d339c255b9fd. The affected component should be 
  upgraded.
