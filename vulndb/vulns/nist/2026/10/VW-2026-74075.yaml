title: Open WebUI from 0.11.1 before 0.11.4 contains an authorization bypass in 
  the OAuth token exchange endpoint, which reads role claims only from the 
  provider's userinfo response and keeps the user's existing role when no roles 
  claim is found, ignoring roles sent only in the ID token. Users with a linked 
  account whose identity provider role no longer satisfies the OAuth role policy
  can send a valid provider access token to POST 
  /api/v1/auths/oauth/{provider}/token/exchange to obtain a session retaining 
  their previous role.
