title: 'djehuty is a research data repository system developed by 4TU.ResearchData.
  Prior to version 26.3.2, An unauthenticated attacker can inject SPARQL into the
  search/listing queries through three separate parameters. Because the affected queries
  are read (SELECT) queries, this does not write to the store, but it allows: Cross-graph
  data exfiltration — e.g. UNION-ing in triples from graphs the request was never
  scoped to (drafts/private/internal data held in the RDF store); denial of service
  — expensive or malformed queries that tie up the SPARQL backend / web workers. No
  account or user interaction is required. This issue has been patched in version
  26.3.2.'
