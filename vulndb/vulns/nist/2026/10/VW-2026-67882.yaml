title: A vulnerability was identified in sfturing hosp_order up to 
  627f426331da8086ce8fff2017d65b1ddef384f8. Affected by this vulnerability is 
  the function findOrderHosNum of the file /ssm_pro/orderHos/. Such manipulation
  of the argument hospitalAddress/hospitalName leads to sql injection. The 
  attack can be launched remotely. The exploit is publicly available and might 
  be used. This product does not use versioning. This is why information about 
  affected and unaffected releases are unavailable. The vendor was contacted 
  early about this disclosure but did not respond in any way.
