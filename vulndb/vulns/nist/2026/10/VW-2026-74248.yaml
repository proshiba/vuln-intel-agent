title: Privasys Remote Attestation TLS Clients provides multi-language utilities
  for verifying attested TLS connections. Before 0.9.1, an attacker with local 
  access could modify workload code, data, and configuration at any time after 
  successful connection establishment. Once Evidence was successfully appraised 
  and the connection was established, there was a window of vulnerability from 
  the establishment of the connection to the termination of the connection where
  an attacker could modify the state of the workload and platform at runtime on 
  the TLS endpoint acting as the Attester. This vulnerability was possible 
  because Privasys/ra-tls-clients performed attestation only once in the 
  lifetime of the connection (at connection establishment time), and the 
  verifying peer continued to believe that the state was the same as in the 
  initial Evidence throughout, whereas it could be stale at some point in time. 
  This vulnerability is fixed in 0.9.1.
