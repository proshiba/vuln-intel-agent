title: When Gitea's built-in SSH server is enabled (`START_SSH_SERVER = true`), 
  the presented public key was looked up with an SQL `LIKE` comparison of its 
  encoded content, which is case-insensitive on some databases, including the 
  default SQLite. An attacker who can construct a case variant of another user's
  registered RSA public key for which they can derive the private key could have
  that key matched to the victim's account and authenticate over SSH as that 
  user. Keys are now looked up by fingerprint.
