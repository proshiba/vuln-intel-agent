title: A vulnerability was found in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. This affects the function 
  mysqli_query of the file Admin/mlogin.php of the component Login Handler. 
  Performing a manipulation of the argument uname/pass results in sql injection.
  The attack may be initiated remotely. The exploit has been made public and 
  could be used. This product uses a rolling release model to deliver continuous
  updates. As a result, specific version information for affected or updated 
  releases is not available. The project was informed of the problem early 
  through an issue report but has not responded yet.
