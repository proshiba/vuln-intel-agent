title: The Postem Ipsum plugin for WordPress is vulnerable to unauthorized 
  modification of data to Privilege Escalation due to a missing capability check
  on the postem_ipsum_generate_users() function in all versions up to, and 
  including, 3.0.1. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to create arbitrary user accounts with the 
  administrator role.
