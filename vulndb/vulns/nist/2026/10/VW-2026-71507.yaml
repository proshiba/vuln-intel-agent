title: A heap-based buffer overflow was found in GIMP’s DICOM export plug-in. 
  When exporting an image with extremely large width and height, the export path
  allocates a buffer using a 32-bit width * height (and bytes-per-pixel) product
  that can overflow. GEGL then writes the full uncompressed extent into the 
  undersized buffer (CWE-787), after integer overflow in the allocation size
