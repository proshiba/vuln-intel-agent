title: 'A security flaw has been discovered in Portabilis i-Diario up to 1.5.0. The
  affected element is an unknown function of the file /registros-de-conteudos-por-disciplina/
  of the component Registro das atividades. The manipulation of the argument Registro
  de atividades/Conteúdos results in cross site scripting. The attack may be launched
  remotely. The exploit has been released to the public and may be used for attacks.
  The patch is identified as 821342cd8d952e8bd214cb16145da785a92f5681. A patch should
  be applied to remediate this issue. The vendor confirms: "Audited values shown on
  that screen are now sanitized on output: only a minimal allowlist of basic formatting
  tags is kept and all attributes are stripped, so injected <script> or event-handler
  markup is removed and displayed as inert text."'
