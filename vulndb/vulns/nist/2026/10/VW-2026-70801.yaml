title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wilc1000: fix RX buffer OOB-write in wilc_wlan_handle_isr_ext()\n\nwilc_wlan_handle_isr_ext()
  takes the RX transfer size from the\ndevice-reported interrupt status register (a
  15-bit field shifted left by 2,\nup to 131068 bytes) and reads that many bytes from
  the device into\nrx_buffer, which is only WILC_RX_BUFF_SIZE (96K) large. The wrap\n\
  check only handles the current offset; the size itself is never\ncompared against
  the buffer, so a bogus SDIO device can make the driver\nOOB-write rx_buffer by up
  to ~32K with data it controls.\n\nThe oversized transfer also leaves rx_buffer_offset
  past the end of\nthe buffer, after which the unsigned wrap check stops working and\n\
  the overflow can repeat.\n\nDrop any transfer whose size exceeds the RX buffer,
  acknowledging\nthe data interrupt and re-arming the RX engine so the bogus frame
  is\ndiscarded and reception can continue. This also restores the\nrx_buffer_offset
  <= WILC_RX_BUFF_SIZE "
