title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  libipw: reject TKIP frames without a full MIC\n\nlibipw_michael_mic_verify() assumes
  that an skb contains an eight-byte\nMichael MIC. A short TKIP frame makes the unsigned
  payload length wrap,\ncausing michael_mic() to read past the skb.\n\nCheck that
  the MIC is present before verifying it, and use the existing\nMICHAEL_MIC_LEN constant
  for all MIC lengths in the verifier."
