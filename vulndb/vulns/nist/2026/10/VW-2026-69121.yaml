title: The Forminator Forms – Contact Form, Payment Form & Custom Form Builder 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via 
  Rich-Text Textarea Field in all versions up to, and including, 1.57.2 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. Successful 
  exploitation requires an administrator to open the stored submission entry in 
  the Forminator Entries view and interact with the planted link, at which point
  WordPress core's jQuery-based click handler on `.contextual-help-tabs a` 
  evaluates the entity-decoded href as HTML, firing the attacker's payload in 
  the administrator's authenticated wp-admin session.
