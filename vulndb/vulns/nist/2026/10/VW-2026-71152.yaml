title: OneUptime is a solution for monitoring and managing online services. 
  Prior to version 10.0.34, the WhatsApp POST webhook handler 
  (/notification/whatsapp/webhook) processes incoming status update events 
  without verifying the Meta/WhatsApp X-Hub-Signature-256 HMAC signature, 
  allowing any unauthenticated attacker to send forged webhook payloads that 
  manipulate notification delivery status records, suppress alerts, and corrupt 
  audit trails. The codebase already implements proper signature verification 
  for Slack webhooks. This issue has been patched in version 10.0.34.
