title: In Progress ShareFile Storage Zones Controller v5.12.6 and below, 
  FileCopyService uses a remote file identifier when constructing a local 
  temporary file path without enforcing containment. This can cause 
  FileCopyService to write attacker-controlled content to filesystem locations 
  writable by the service account. This can result in remote code execution when
  an executable IIS-served directory is writable.
