  all REST API communication between the Uniffle CLI/client and the\nUniffle Coordinator
  service to potential Man-in-the-Middle (MITM) attacks.\n\n\nThis issue affects all
  versions from before 0.10.0.\n\nUsers are recommended to upgrade to version 0.10.0,
