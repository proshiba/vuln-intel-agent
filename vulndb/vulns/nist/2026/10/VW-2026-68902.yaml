title: A weakness has been identified in garycourt uri-js up to 4.4.1. This 
  affects the function URI.parse of the file src/schemes/mailto.ts of the 
  component Mailto Header Handler. This manipulation of the argument to causes 
  uncaught exception. The attack may be initiated remotely. The exploit has been
  made available to the public and could be used for attacks. The project was 
  informed of the problem early through an issue report but has not responded 
