title: A vulnerability was found in Zen Cart up to 2.2.2. This impacts the 
  function zen_db_perform in the library includes/modules/payment/paypaldp.php 
  of the component PayPal IPN Handler. Performing a manipulation of the argument
  txn_id results in sql injection. The attack can be initiated remotely. The 
  exploit has been made public and could be used. The patch is named 
  557154f4fa025f51553094f47b06aa024220c48f. It is suggested to install a patch 
  to address this issue.
