title: "Improper Verification of Cryptographic Signature and Improper Certificate
  Validation in the OPC UA driver of Apache PLC4X (PLC4J) allows an attacker in a
  network position between client and server to impersonate the OPC UA server and
  to read, forge or modify secure-channel traffic, including user credential ssent
  by the client.\n\nThe defect manifests differently depending on the version:\n-
  In 0.9.0 through 0.11.0 a failed message-signature check is only logged and never
  enforced, and there is no mechanism to verify the server certificate: it is taken
  from the unauthenticated GetEndpoints discovery response and used to encrypt the
  user's password.\n- In 0.12.0 through 0.13.1 the signature check is inverted (valid
  signatures are rejected, invalid ones accepted), and server certificates are accepted
  without a trust anchor by default.\n- In all affected versions the default security
  policy is None. Starting with 0.12.0 the driver additionally continues silently
