title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlegacy: fix broadcast stations deallocation\n\nOn the error path of __il4965_up(),
  il_dealloc_bcast_stations() clears\nonly IL_STA_UCODE_ACTIVE, leaving IL_STA_BCAST
  set. This causes the\nsame broadcast stations to be deallocated again by __il4965_down().\n\
  \nThis can occur when RF_KILL is toggled during driver startup.\n\nTo fix clear
  the entire 'used' field, since we will not do any\nother operations on the station."
