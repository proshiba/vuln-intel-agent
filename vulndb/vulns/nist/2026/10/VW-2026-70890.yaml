title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  remove WARN_ON_ONCE() from the dev_fill_forward_path() loop check\n\nipip_fill_forward_path()
  and ip6_tnl_fill_forward_path() look up the\nroute to the tunnel's remote endpoint
  and set ctx->dev to its device,\nwhich is the tunnel itself when that route resolves
  back to the tunnel.\ndev_fill_forward_path() then makes no progress and trips\n\
  WARN_ON_ONCE(last_dev == ctx->dev) as soon as a flowtable tries to\noffload a flow
  through the tunnel. That routing loop is a configuration\nany CAP_NET_ADMIN user
  can set up, and ip_tunnel_xmit() and\nip6_tnl_xmit() already treat it as a tx error,
  so remove the warning and\njust fail the walk, as commit 008e7a7c293b (\"net: remove
  WARN_ON_ONCE\nwhen accessing forward path array\") did for the path stack overflow."
