title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: cyw: pass PMKID to firmware if present\n\nZero out auth_status on initialization.
  Otherwise, garbage will\nleak from the stack to the firmware (when ssid is less
  than 32 bytes\nand/or when params->pmkid is set). Then, pass the params->pmkid to
  the\nfirmware (without it, the firmware caches a garbage PMKID on successful\nauthentication
  and denies a subsequent association request that includes\nthe PMKID)."
