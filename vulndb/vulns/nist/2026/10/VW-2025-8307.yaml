title: A weakness has been identified in givanz Vvveb up to 1.0.7.3. This issue 
  affects the function sanitizeFileName of the file system/functions.php of the 
  component Code Editor. Executing a manipulation of the argument File can lead 
  to path traversal. The attack can be launched remotely. The exploit has been 
  made available to the public and could be used for attacks. This patch is 
  called b0fa7ff74a3539c6d37000db152caad572e4c39b. Applying a patch is advised 
  to resolve this issue.
