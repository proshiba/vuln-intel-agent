title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, MariaDB RPM 
  packages created the dedicated mysql service account with the database data 
  directory as its home directory. A database user with the FILE privilege could
  write startup dot-files such as .bash_profile into $HOME, and those files 
  could execute when an administrator opened a login shell for the mysql 
  account. Debian packages are not affected because they use /nonexistent as the
  account home. This issue is fixed in versions 10.6.28, 10.11.19, 11.4.13, 
  11.8.9, 12.3.3, and 13.0.2.
