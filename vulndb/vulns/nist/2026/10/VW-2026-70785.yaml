title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix use-after-free of iface in cifs_try_adding_channels()\n\ncifs_try_adding_channels()
  iterates ses->iface_list with\nlist_for_each_entry_safe_from(), which captures the
  next entry\n(niface) under iface_lock.  The loop body then drops iface_lock for\n\
  the whole duration of cifs_ses_add_channel().\n\nA concurrent interface refresh
  (SMB3_request_interfaces() ->\nparse_server_interfaces()) marks all ifaces inactive
  and removes and\nfrees any that are not re-advertised via list_del() + kref_put(),\n\
  where release_iface() is a bare kfree().  Since niface typically has\nno channel
  holding a reference, the list reference is its last and it\ncan be freed inside
  the unlocked window.  On continue, the iterator\nadvance step then dereferences
  niface->iface_head.next, and the loop\nbody reads iface->rdma_capable/is_active,
  both on freed memory.\n\nFix this by never keeping an unreferenced list pointer
  across the\nunlocked window.  Eac"
