title: Karapace is an open-source implementation of Kafka REST and Schema 
  Registry. Versions 5.0.0 and 5.0.1 contain an authentication bypass 
  vulnerability when configured to use OAuth 2.0 Bearer Token authentication. If
  a request is sent without an Authorization header, the token validation logic 
  is skipped entirely, allowing an unauthenticated user to read and write to 
  Schema Registry endpoints that should otherwise be protected. This effectively
  renders the OAuth authentication mechanism ineffective. This issue is fixed in
  version 5.0.2.
