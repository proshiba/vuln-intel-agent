title: A weakness has been identified in haxxorsid Stock-Management-System up to
  fbbbf213e9c93b87183a3891f77e3cc7095f22b0. This affects an unknown function of 
  the file /api/employees. Executing manipulation can lead to missing 
  authentication. It is possible to launch the attack remotely. The exploit has 
  been made available to the public and could be exploited. This product takes 
  the approach of rolling releases to provide continious delivery. Therefore, 
  version details for affected and updated releases are not available. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way. This vulnerability only affects products that are no longer supported by 
  the maintainer.
