title: "Improper Handling of Highly Compressed Data (Data Amplification) vulnerability
  in hexpm hex_core allows an untrusted repository mirror, or a server answering hex_core's
  API requests, to exhaust the memory of the Erlang VM running hex_core. The same
  code is vendored in Hex (mix_hex_repo, mix_hex_api) and rebar3 (r3_hex_repo, r3_hex_api).\n\
  \nhex_repo:get_names/1, hex_repo:get_versions/1, hex_repo:get_package/2 and hex_repo:get_policy/2
  decompress the registry response with zlib:gunzip/1 and decode the signed envelope
  before verifying its signature. A mirror doesn't have the repository's private key,
  but it chooses the compressed bytes, so a small response decompresses into an envelope
  of any size before the signature check rejects it.\n\nhex_api decodes responses
  with the application/vnd.hex+erlang content type through hex_safe_binary_to_term:safe_binary_to_term/1,
