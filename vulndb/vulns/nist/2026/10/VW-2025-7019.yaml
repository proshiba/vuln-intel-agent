title: A vulnerability was identified in JhumanJ OpnForm up to 1.9.3. The 
  affected element is an unknown function of the component HTTP Header Handler. 
  The manipulation of the argument X-Forwarded-For leads to improper restriction
  of excessive authentication attempts. The attack is possible to be carried out
  remotely. A high degree of complexity is needed for the attack. The 
  exploitability is described as difficult. The exploit is publicly available 
  and might be used. The identifier of the patch is 
  11e99960e14ca986b1a001a56e7533223d2cfa5b. It is suggested to install a patch 
  to address this issue.
