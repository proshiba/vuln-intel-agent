title: A flaw was found in SSSD. In configurations where the autofs responder 
  service is enabled, memory allocated during successful request processing is 
  not released until the client connection terminates. A local attacker can 
  exploit this vulnerability by maintaining an open connection and repeatedly 
  submitting valid requests, leading to memory exhaustion and a Denial of 
  Service (DoS).
