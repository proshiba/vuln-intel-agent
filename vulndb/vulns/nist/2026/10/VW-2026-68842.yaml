title: Zammad packages built with packager.io (DEB and RPM) could have allowed a
  local attacker who already had file system write privileges as the 
  unprivileged zammad service account to escalate to full root privileges on the
  host. Service processes began running as root and executed files that were 
  owned and writable by the zammad account before dropping their identity to 
  that account. An attacker holding that foothold could have escalated within 
  seconds, because the affected services were restarted automatically whenever 
  they stopped; no administrator interaction was required. Only installations 
  from the DEB and RPM packages were affected — installations from source or the
  official container images were not. All released packaged versions were 
  affected.
