title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to version 1.0.8.6, Vvveb's SSRF 
  guard resolves a host with an IPv4-only function and never inspects IPv6, so 
  any host that lacks an A record passes a private-range check. Editor oEmbed 
  proxy fetches an attacker-supplied URL server side and reflects a response 
  body, so an authenticated admin-panel user (default role site_admin or higher)
  can read internal-only services and cloud metadata, including IAM credentials,
  using an IPv6 literal or a domain that carries only an AAAA record. This issue
  has been patched in version 1.0.8.6.
