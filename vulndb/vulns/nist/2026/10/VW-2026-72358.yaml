title: Progressive Robot hMailServer 6.0.0 through 6.3.5 processes several IMAP 
  commands from a signed-in account in time quadratic in the command's length or
  in the number of elements it names, and can be made to hold memory out of 
  proportion to a command. The FETCH data-item parser normalised a BODY[] 
  section with a case-insensitive string replacement that copied the whole item 
  per occurrence and split the item list by repeatedly copying the remainder of 
  the command; the server's case-insensitive search compared a needle afresh at 
  every position, so a long SEARCH TEXT key over a message cost the product of 
  the two lengths; SEARCH message sets and the saved-result marker ($), SORT 
  criteria, HEADER.FIELDS name lists and UID ranges were each read once per 
  message rather than once per command; and a FETCH naming a message's sections 
