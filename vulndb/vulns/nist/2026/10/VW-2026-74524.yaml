title: A security flaw has been discovered in philz1337x clarity-upscaler up to 
  cfbdb842c6c839c8e97741722b8cf9a4b7662d98. This impacts the function 
  create_html_for_item of the file modules/ui_extra_networks.py of the component
  Extra Networks Card Rendering. The manipulation of the argument Description 
  results in cross site scripting. The attack can be executed remotely. This 
  product implements a rolling release for ongoing delivery, which means version
  information for affected or updated releases is unavailable. All versions in 
  the repository are affected, as the codebase is based on 
  AUTOMATIC1111/stable-diffusion-webui v1.7.0 code. Upstream 
  AUTOMATIC1111/stable-diffusion-webui (v1.8.0, released March 1, 2024) contains
  the fix. The project was informed of the problem early through an issue report
  but has not responded yet.
