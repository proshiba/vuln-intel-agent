title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix out-of-bounds read of sk_protocol in bpf_sock_destroy()\n\nsk_protocol lives
  in struct sock, not in struct sock_common. A timewait\nor request sock handed to
  bpf_sock_destroy() by the tcp iterator is\nneither, so reading sk->sk_protocol runs
  past the object:\n\n==================================================================\n\
  BUG: KASAN: slab-out-of-bounds in bpf_sock_destroy+0xc7/0xe0\nRead of size 2 at
  addr ffff8881047d11b4 by task test_progs/428\n\nTainted: [W]=WARN\nCall Trace:\n\
  \ <TASK>\n dump_stack_lvl+0x91/0xf0\n print_report+0xd1/0x630\n kasan_report+0xf3/0x130\n\
  \ __asan_report_load2_noabort+0x14/0x30\n bpf_sock_destroy+0xc7/0xe0\n bpf_prog_c3dd61f9d9cd9f37_iter_tcp6_timewait+0x9f/0xb7\n\
  \ bpf_iter_run_prog+0x538/0xde0\n bpf_iter_tcp_seq_show+0x26b/0x4b0\n bpf_seq_read+0x424/0x1210\n\
  \ vfs_read+0x197/0xe40\n ksys_read+0x119/0x240\n __x64_sys_read+0x72/0xc0\n x64_sys_call+0x647/0x27e0\n\
  \ do_syscall_64+0xe5/0x610\n entry_SYSCALL_64_af"
