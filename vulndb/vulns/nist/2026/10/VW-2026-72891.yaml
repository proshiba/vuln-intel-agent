title: yopass is a service for securely sharing secrets, passwords, and files. 
  Prior to version 14.7.0, the Prometheus metrics middleware in 
  pkg/server/server.go uses the attacker-controlled r.Method value directly as 
  the method label for yopass_http_requests_total and 
  yopass_http_request_duration_seconds. Because the catch-all route accepts 
  arbitrary HTTP method tokens, an unauthenticated remote attacker can submit 
  many unique methods and create metric series that the Prometheus registry 
  never evicts. The resulting monotonic memory growth can OOM-kill the process, 
  while the expanding registry also degrades /metrics scrape latency and can 
  blind monitoring. This issue is fixed in version 14.7.0.
