title: "A path traversal vulnerability in the OTRS SendSupportBundle functionality
  allows an authenticated administrator to reference file paths outside the intended
  directory.\n\nThis may allow files accessible to the OTRS application process to
  be deleted. The vulnerability does not bypass operating system file permissions.
  On OTRS versions prior to OTRS 7, the effective permissions of the web server process
  are relevant. Starting with OTRS 7, access is limited by the permissions of the
  dedicated OTRS user. Files with overly permissive ownership or file system permissions
  may therefore also be affected.\n\nThe affected functionality may additionally attempt
  to include controlled files in a support bundle. However, support bundles are sent
  to a predefined OTRS support address, and direct disclosure of arbitrary files to
  the attacker has not been demonstrated.\n\nAn attacker therefore requires valid
  administrative access to exploit the vulnerable functionality. The primary demonstrated
