title: A vulnerability was detected in itsmeravitejak Online-Examination-System 
  up to e6208e630b14657999bbfe4c9912302d2a1e2449. This affects the function 
  MySQLDB::addNewUser of the file include/database.php of the component 
  Registration Form. Performing a manipulation of the argument branch results in
  sql injection. The attack is possible to be carried out remotely. The exploit 
  is now public and may be used. This product adopts a rolling release strategy 
  to maintain continuous delivery. Therefore, version details for affected or 
  updated releases cannot be specified. The project was informed of the problem 
  early through an issue report but has not responded yet.
