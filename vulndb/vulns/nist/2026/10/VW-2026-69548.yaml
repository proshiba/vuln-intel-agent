title: The Customer Reviews for WooCommerce plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via Comment Author Name in all versions up to, 
  and including, 5.122.0 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. This requires the image attachment feature (ivole_attach_image)
  to be enabled, which allows unauthenticated attackers to both submit a review 
  with an entity-encoded malicious author name and upload an attached image via 
  the publicly accessible wp_ajax_nopriv_cr_upload_local_images_frontend 
  endpoint.
