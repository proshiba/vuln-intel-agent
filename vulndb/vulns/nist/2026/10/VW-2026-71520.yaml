title: A flaw was found in CRI-O's `bind_mount_prefix` handling. When configured
  with a non-empty `bind_mount_prefix`, a malicious container or local attacker 
  could use a Container Runtime Interface (CRI) hostPath containing an 
  intermediate absolute symlink. This could cause the bind mount source to 
  resolve outside the intended prefixed root, potentially leading to 
  unauthorized access to files or privilege escalation on the host system.
