title: A flaw was found in openstack-network-exporter. When an operator 
  configures user authentication but omits or misconfigures Transport Layer 
  Security (TLS), the basic authentication mechanism is silently bypassed. This 
  fail-open design allows an adjacent network attacker to access sensitive Open 
  vSwitch (OVS) and Open Virtual Network (OVN) dataplane metrics without 
  credentials. Consequently, an attacker can enumerate bridge names, port 
  counters, OVN controller state, and host topology, leading to information 
  disclosure.
