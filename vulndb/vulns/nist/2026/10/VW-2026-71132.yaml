title: BentoML is a Python library for building online serving systems optimized
  for AI apps and model inference. Prior to 1.4.36, the safe_extract_tarfile() 
  function validates that each tar member's path is within the destination 
  directory, but for symlink members it only validates the symlink's own path, 
  not the symlink's target. An attacker can create a malicious bento/model tar 
  file containing a symlink pointing outside the extraction directory, followed 
  by a regular file that writes through the symlink, achieving arbitrary file 
  write on the host filesystem. This vulnerability is fixed in 1.4.36.
