title: The NGINX Cache Optimizer plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  'nginxcacheoptimizer-blacklist-update' AJAX action in all versions up to, and 
  including, 1.1. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to add URLs to the Exclude URLs From 
  Dynamic Caching setting.
