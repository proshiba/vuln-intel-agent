title: "A vulnerability has been found in MartialBE one-hub up to 0.14.27. This vulnerability
  affects unknown code of the file docker-compose.yml. The manipulation of the argument
  SESSION_SECRET leads to use of hard-coded cryptographic key\r . The attack may be
  initiated remotely. The complexity of an attack is rather high. It is stated that
  the exploitability is difficult. The exploit has been disclosed to the public and
  may be used. It is recommended to change the configuration settings. The code maintainer
  recommends (translated from Chinese): \"The default docker-compose example file
  is not recommended for production use. If you intend to use it in production, please
  carefully check and modify every configuration and environment variable yourself!\""
