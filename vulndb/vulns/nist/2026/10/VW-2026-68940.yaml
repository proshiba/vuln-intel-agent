title: A privilege escalation vulnerability in Kiteworks could have allowed an 
  attacker who had already obtained code execution on one node of a clustered 
  Kiteworks deployment to run operating system commands with elevated privileges
  on another node of the same cluster. Insufficient input validation in an 
  internal cluster management function let attacker-supplied values reach a 
  privileged execution context; exploitation requires existing access to a node 
  in the cluster, and the affected function is not reachable from outside the 
  cluster.
