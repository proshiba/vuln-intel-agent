title: The Calculated Fields Form – AI Form Builder for WordPress – Contact, 
  Payment, Quote, Quiz & More plugin for WordPress is vulnerable to Reflected 
  DOM-Based Cross-Site Scripting via the 'arbitrary (whichever names the admin 
  bound via url.<name>)' parameter in all versions up to, and including, 5.5.1.5
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that execute if they can successfully trick a user into performing an 
  action such as clicking on a link. Exploitation requires the targeted site to 
  host a publicly accessible form in which an administrator has configured at 
  least two fields with url.&lt;name&gt; predefined values that are used 
  together in a concatenation equation — a plausible but not universal 
  configuration.
