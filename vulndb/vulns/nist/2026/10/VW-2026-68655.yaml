title: Astro is a web framework for content-driven websites. From 5.2.0 until 
  8.2.4, the @astrojs/netlify adapter generates regular expressions for Netlify 
  Image CDN remote-image allowlists without anchoring them to the beginning of 
  the URL. Because Netlify evaluates these expressions with RegExp.test(), an 
  allowed origin appearing only in a source URL's path or query can satisfy 
  image.domains or image.remotePatterns while the URL's actual host remains 
  attacker-controlled. An unauthenticated request to the public /.netlify/images
  endpoint can therefore cause the Image CDN to request attacker-selected URLs 
  and may probe or reach internal services. Netlify egress protections may 
  constrain reachable targets, and image transformation limits direct response 
  exfiltration; no confidentiality or integrity impact has been demonstrated. 
  This issue is fixed in version 8.2.4.
