title: EspoCRM before 10.0.7 contains an insecure direct object reference 
  vulnerability that allows authenticated users with Import scope access to read
  other users' attachments by supplying a foreign attachmentId to the Import 
  endpoint. Attackers can create an Import record referencing a known attachment
  ID, then call the error export endpoint to copy source rows into a 
  downloadable CSV they own.
