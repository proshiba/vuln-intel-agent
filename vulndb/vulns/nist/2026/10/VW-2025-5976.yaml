title: "Rapid7 Velociraptor versions before 0.75.6 contain a directory traversal issue
  on Linux servers that allows a rogue client to upload a file which is written outside
  the datastore directory. Velociraptor is normally only allowed to write in the datastore
  directory. The issue occurs due to insufficient sanitization of directory names
  which end with a \".\", only encoding the final \".\" AS \"%2E\".\n\n\nAlthough
  files can be written to incorrect locations, the containing directory must end with
  \"%2E\". This limits the impact of this vulnerability, and prevents it from overwriting
  critical files."
