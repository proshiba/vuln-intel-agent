title: The HivePress – Business Directory, Listings & Classified Ads Plugin 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via the 
  '<custom user attribute field name, e.g. profile_test>' parameter in all 
  versions up to, and including, 1.7.31 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. This requires an administrator to have configured a
  text-type custom user attribute whose display format places %value% inside an 
  HTML attribute context (e.g., the documented pattern &lt;a 
  href="%value%"&gt;Custom link&lt;/a&gt;), and for front-end user profiles to 
  be enabled — both of which reflect the plugin's standard, documented 
  configuration.
