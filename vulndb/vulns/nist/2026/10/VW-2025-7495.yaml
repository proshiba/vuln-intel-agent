title: FreePBX Endpoint Manager is a module for managing telephony endpoints in 
  FreePBX systems. In versions prior to 16.0.92 for FreePBX 16 and versions 
  prior to 17.0.6 for FreePBX 17, the Endpoint Manager module contains 
  authenticated SQL injection vulnerabilities affecting multiple parameters in 
  the basestation, model, firmware, and custom extension configuration 
  functionality areas. Authentication with a known username is required to 
  exploit these vulnerabilities. Successful exploitation allows authenticated 
  users to execute arbitrary SQL queries against the database, potentially 
  enabling access to sensitive data or modification of database contents. This 
  issue has been patched in version 16.0.92 for FreePBX 16 and version 17.0.6 
  for FreePBX 17.
