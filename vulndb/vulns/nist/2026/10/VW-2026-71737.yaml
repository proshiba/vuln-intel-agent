title: The OMGF | GDPR/DSGVO Compliant, Faster Google Fonts. Easy. plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via 's' Search 
  Parameter via comments-atom Feed in all versions up to, and including, 6.3.10 
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. Successful 
  exploitation requires that the front-end server serves the retained .tmp file 
  without a Content-Type or X-Content-Type-Options header, enabling 
  MIME-sniffing browsers such as Chromium to execute the injected script — a 
  condition present by default on many Apache and nginx/php-fpm deployments.
