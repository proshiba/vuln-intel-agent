title: 'Open Source Point of Sale (opensourcepos) is a web based point of sale application
  written in PHP using CodeIgniter framework. Starting in version 3.4.0 and prior
  to version 3.4.2, a Stored Cross-Site Scripting (XSS) vulnerability exists in the
  "Return Policy" configuration field. The application does not properly sanitize
  user input before saving it to the database or displaying it on receipts. An attacker
  with access to the "Store Configuration" (such as a rogue administrator or an account
  compromised via the separate CSRF vulnerability) can inject malicious JavaScript
  payloads into this field. These payloads are executed in the browser of any user
  (including other administrators and sales staff) whenever they view a receipt or
  complete a transaction. This can lead to session hijacking, theft of sensitive data,
  or unauthorized actions performed on behalf of the victim. The vulnerability has
  been patched in version 3.4.2 by ensuring the output is escaped using the `esc()`
