title: The Content Egg  WordPress plugin before 11.9.0 does not verify that a 
  user running its bulk content-import feature is authorized for the import 
  preset they select, and switches to the preset author's identity before 
  creating the resulting post, allowing users with contributor-level access and 
  above to store arbitrary web scripts unfiltered under a privileged user's 
  account, executing in the context of anyone who later views that content.
