title: "User-controlled values are not sufficiently neutralized when included in CSV
  exports. Values originating from user input, including data submitted by authenticated
  users or received through external communication channels such as email, may be
  stored in fields that are later included in CSV exports. An attacker can therefore
  inject values beginning with spreadsheet formula characters such as =, +, -, or
  @. An attacker does not necessarily require an authenticated account if the affected
  field can be populated through an external input channel such as incoming email.\n\
  \nWhen an affected CSV file is opened in spreadsheet software, the application may
  interpret these values as formulas instead of plain text. Depending on the spreadsheet
  application and its security configuration, a malicious formula may cause unintended
  actions, disclose information, or invoke external functionality. Exploitation may
  require the user opening the exported CSV file to confirm one or more security warning
  dial"
