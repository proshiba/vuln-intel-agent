title: A vulnerability was identified in gedelumbung HospitalManagement up to 
  c2d45543789a3887067d3915f69d44cfc2cf76a8. Affected by this issue is the 
  function app_user_login_model.php::cekUserLogin of the file 
  application/models/app_user_login_model.php of the component KCFinder File 
  Manager. Such manipulation of the argument ADMIN_RS_KCFINDER leads to 
  unrestricted upload. It is possible to launch the attack remotely. The exploit
  is publicly available and might be used. This product takes the approach of 
  rolling releases to provide continious delivery. Therefore, version details 
  for affected and updated releases are not available. The project was informed 
  of the problem early through an issue report but has not responded yet.
