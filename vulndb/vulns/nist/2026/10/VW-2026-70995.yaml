title: A vulnerability has been found in Kusalkasilva Learning-Management-System
  up to ffeb873f8803f1e9664384ff75000c7da45466d2. Impacted is the function 
  mysql_error of the file login.php of the component Login Endpoint. The 
  manipulation of the argument username/password leads to sql injection. The 
  attack can be initiated remotely. The exploit has been disclosed to the public
  and may be used. Continious delivery with rolling releases is used by this 
  product. Therefore, no version details of affected nor updated releases are 
  available. The project was informed of the problem early through an issue 
  report but has not responded yet.
