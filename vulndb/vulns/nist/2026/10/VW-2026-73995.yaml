title: A flaw was found in Quay. An authenticated attacker can access repository
  auto-prune configurations from other namespaces, leading to unauthorized 
  information disclosure. This issue occurs because the application does not 
  properly enforce namespace scoping when retrieving policy details by 
  repository name and policy identifier. To exploit the vulnerability, the 
  attacker must manage a repository sharing the target's name and know the 
  target policy's unique identifier.
