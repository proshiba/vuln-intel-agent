title: NiceGUI is a Python-based UI framework. Versions 3.3.1 and below are 
  subject to a XSS vulnerability through the ui.interactive_image component of 
  NiceGUI. The component renders SVG content using Vue's v-html directive 
  without any sanitization. This allows attackers to inject malicious HTML or 
  JavaScript via the SVG <foreignObject> tag whenever the image component is 
  rendered or updated. This is particularly dangerous for dashboards or 
  multi-user applications displaying user-generated content or annotations. This
  issue is fixed in version 3.4.0.
