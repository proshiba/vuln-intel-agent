title: Missing authentication has been found in remote-execution task updates in
  the smart_proxy_dynflow package. The progress and completion callbacks accept 
  a report when the one-time token is missing. A network attacker or user must 
  already know the identifier of a running job. This applies when remote 
  execution is set to pull or pull-mqtt mode. They can send their own job output
  and mark the job as a success or a failure. The job is then recorded with that
  result.
