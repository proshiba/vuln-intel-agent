title: QloApps through 1.7.0 contains a reflected cross-site scripting 
  vulnerability in the back-office Hotel Reservation System Book Now search, 
  where date_to and id_room_type parameters are copied into template variables 
  without validation. Attackers can craft a malicious link containing JavaScript
  payload in these parameters that executes in an authenticated administrator's 
  session when the victim follows the link.
