title: A weakness has been identified in feelec-yishu feelcrm-os 1.0.0. This 
  vulnerability affects the function index of the file 
  App/Feelcrm/Index/Controller/MemberController.class.php of the component 
  Member Endpoint. This manipulation of the argument group_id causes sql 
  injection. The attack can be initiated remotely. The exploit has been made 
  available to the public and could be used for attacks. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
