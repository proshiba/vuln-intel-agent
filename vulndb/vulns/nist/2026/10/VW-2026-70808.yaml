title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmsmac: fix UAF in brcms_free_timer()\n\nbrcms_free_timer() calls brcms_del_timer()
  which uses the non-synchronous\ncancel_delayed_work() to cancel the timer's underlying
  delayed work.  If\nthe work callback (_brcms_timer) is already running, cancel_delayed_work()\n\
  returns false without waiting, and brcms_free_timer() proceeds to kfree(t)\nwhile
  the callback still accesses t through container_of().\n\nAdd an explicit cancel_delayed_work_sync()
  after brcms_del_timer() to\nguarantee that any in-flight callback has completed
  before the timer\nstructure is freed."
