title: Plane is an open-source project management tool. Prior to 1.4.0, 
  WorkspaceOwnerPermission does not require is_active=True when checking whether
  a user is a workspace owner. A deactivated user can therefore remain 
  authorized as the workspace owner and retain owner-level access. This issue is
  fixed in 1.4.0.
