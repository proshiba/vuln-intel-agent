title: fast-toml through 0.5.4 contains a prototype pollution vulnerability that
  allows attackers to modify Object.prototype by supplying TOML containing 
  __proto__, constructor or prototype key segments. Attackers can pass 
  [__proto__] or [constructor.prototype] table headers or __proto__.x dotted 
  keys to parse() to pollute all objects, causing denial of service or 
  authorization bypass.
