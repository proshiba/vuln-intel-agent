title: "A vulnerability was found in TRENDnet TEW-432BRP 3.10B20. Affected by this
  vulnerability is the function formTcpipSetup of the file /goform/formTcpipSetup.
  Performing a manipulation of the argument Name results in stack-based buffer overflow.
  It is possible to initiate the attack remotely. The exploit has been made public
  and could be used. The vendor confirms: \"As this router was EOL'd in 2011, we have
  no way of testing if such vulnerability exists. We will notify our customers of
  a potential vulnerability on this product.\" This vulnerability only affects products
  that are no longer supported by the maintainer."
