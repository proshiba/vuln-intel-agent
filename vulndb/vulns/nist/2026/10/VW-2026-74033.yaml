title: FreeRDP before 3.32.0 contains a NULL pointer dereference vulnerability 
  in the client video redirection channel that allows malicious servers to crash
  clients by sending out-of-order messages. Attackers can send a Geometry CLEAR 
  message that nulls presentation->geometry, then send VideoData that 
  dereferences it, causing client denial of service.
