title: The Photo Gallery by 10Web – Mobile-Friendly Image Gallery plugin for 
  WordPress is vulnerable to Reflected Cross-Site Scripting via the 'thumb_url' 
  parameter in all versions up to, and including, 1.8.46 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. Exploitation requires that the authenticated victim 
  holds the manage_options capability, as the editimage_bwg AJAX action performs
  a capability check but no nonce verification, meaning the payload can be 
  delivered via a crafted GET request without a CSRF token.
