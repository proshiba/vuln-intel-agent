title: EdgeEver Desktop 1.6.26 through 1.112.0 contains a navigation allowlist 
  bypass that lets attackers load arbitrary origins in the main window via 
  string-prefix URL matching. Attackers can embed a link using userinfo syntax 
  after the dev-server prefix, for example in a note-template preview, to obtain
  the edgeeverDesktop bridge including session token, sidecar RPC, and ACP 
  channels.
