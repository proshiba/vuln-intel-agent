title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - fix GPF in suspend and resume when unbound\n\nTransport drivers
  (such as rmi_i2c and rmi_spi) invoke\nrmi_driver_suspend() and rmi_driver_resume()
  on their child rmi_dev\ndevice during system power management events. However, transport
  drivers\nare fully registered and operational even if the physical RMI driver\n\
  failed to bind or probe the rmi_dev device.\n\nWhen rmi_driver_suspend() or rmi_driver_resume()
  is called on an unbound\nrmi_dev, dev_get_drvdata() returns NULL. Calling rmi_disable_irq()
  or\nrmi_enable_irq() without driver data attached causes a NULL pointer\ndereference
  and General Protection Fault when attempting to lock\ndata->enabled_mutex.\n\nFix
  this by checking if driver data is attached to rmi_dev in\nrmi_driver_suspend()
  and rmi_driver_resume(), exiting early if\nno driver data is present."
