title: A weakness has been identified in joey-zhou xiaozhi-esp32-server-java up 
  to 3.0.0. This impacts the function tryAuthenticateWithCookies of the file 
  AuthenticationInterceptor.java of the component Cookie Handler. Executing 
  manipulation can lead to improper authentication. The attack can be launched 
  remotely. The exploit has been made available to the public and could be 
  exploited. Upgrading to version 4.0.0 will fix this issue. It is recommended 
  to upgrade the affected component.
