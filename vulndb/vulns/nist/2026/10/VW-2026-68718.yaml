title: A vulnerability was identified in AdithyaYelloju 
  Restaurant-Management-System up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. 
  The affected element is the function mysqli_query of the file User/cancel.php 
  of the component Order Cancellation. The manipulation of the argument ID leads
  to sql injection. The attack may be initiated remotely. The exploit is 
  publicly available and might be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
