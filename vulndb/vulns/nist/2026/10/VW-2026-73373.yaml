title: mall4j through 4.0 contains an improper authorization vulnerability that 
  allows authenticated storefront customers to delete other shoppers' cart items
  through an operator precedence error in the cleanExpiryProdList SQL statement.
  Attackers can send one DELETE request to /p/shopCart/cleanExpiryProdList to 
  remove every user's cart entries for off-shelf products, which do not return 
  when products are restocked.
