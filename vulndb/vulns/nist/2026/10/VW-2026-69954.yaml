title: The SEOPress – AI SEO Plugin & On-site SEO plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via Author Display Name in all 
  versions up to, and including, 10.2 due to insufficient input sanitization and
  output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. Exploitation requires the 'Track Authors' custom 
  dimension to be configured in the plugin's Google Analytics 4 or Matomo 
  settings, and the attacker must be able to publish public singular content 
  (e.g., via bbPress forum topics) so that the injected display name is rendered
  in the tracking script.
