title: CodeArt Google MP3 Audio Player plugin (google-mp3-audio-player) for 
  WordPress through 1.0.11 contains an unauthenticated arbitrary file read 
  vulnerability that allows remote attackers to retrieve sensitive files by 
  supplying a path-traversal payload in the file parameter of 
  direct_download.php. Attackers can request paths ../../wp-config.php without 
  authentication to download configuration files containing database credentials
  and secret keys, leading to full site compromise. Exploitation evidence was 
  first observed by the Shadowserver Foundation on 2023-10-19.
