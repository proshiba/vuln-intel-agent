title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  libahci: clear PxCLBU and PxFBU for AHCI_HFLAG_32BIT_ONLY\n\nA user reported that
  commit 105c42566a55 (\"ata: ahci: force 32-bit DMA for\nJMicron JMB582/JMB585\"\
  ) made the JMicron JMB585 unusable on his board.\n\nThe failure is seen as soon
  as the ahci driver is probed, and booting with\niommu=off does not solve the problem.\n\
  \nLooking at the AHCI specification, PxCLBU and PxFBU are both read only '0'\nfor
  HBAs that do not support 64-bit addressing.\n\nFor HBAs that do support 64-bit addressing,
  the registers are read write,\nwith a reset value that is Implementation Specific.\n\
  \nWhen using the AHCI_HFLAG_32BIT_ONLY flag, the HBA does support 64-bit\naddressing,
  and a 32-bit DMA mask is set by simply clearing HOST_CAP_64.\nThus, in this case,
  we need to explicitly clear the registers to 0."
