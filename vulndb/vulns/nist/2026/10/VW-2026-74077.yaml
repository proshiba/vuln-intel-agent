title: Open WebUI from 0.6.0 before 0.11.4 contains an improper access control 
  vulnerability in has_access_to_file that lets former knowledge base 
  collaborators keep file access via stale cached knowledge base references. 
  Attackers with read or write grants can download removed files through the 
  file content endpoint or delete them, including from the owner's private 
  knowledge bases.
