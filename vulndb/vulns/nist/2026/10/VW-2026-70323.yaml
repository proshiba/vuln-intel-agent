title: A flaw was found in the HyperShift operator. The operator copies 
  user-provided Kubernetes configuration (kubeconfig) secrets directly into the 
  privileged control plane namespace without proper validation or sanitization. 
  An authenticated user with cluster and secret creation permissions can exploit
  this vulnerability by supplying a configuration containing unauthorized 
  executable plugins. When downstream controllers consume this configuration, an
  attacker can achieve arbitrary code execution within the control plane.
