title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.65.9 through 0.70.5, 
  PydanticFieldRepresentation.add_field_properties inserts a schema field's doc 
  value between the quotes of a generated pydantic.Field description argument 
  without escaping it. A crafted quote can terminate the string and inject an 
  expression evaluated during generated class definition, allowing arbitrary 
  Python code execution for Pydantic and AvroDantic model generation. Version 
  0.70.6 fixes the vulnerability by escaping the documentation value before 
  rendering it.
