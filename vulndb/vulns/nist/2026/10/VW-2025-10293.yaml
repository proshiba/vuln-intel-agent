title: CVAT is an open source interactive video and image annotation tool for 
  computer vision. In versions 2.8.1 through 2.52.0, an attacker with an account
  on a CVAT instance is able to retrieve the contents of any file system 
  directory accessible to the CVAT server. The exposed information is names of 
  contained files and subdirectories. The contents of files are not accessible. 
  Version 2.53.0 contains a patch. No known workarounds are available.
