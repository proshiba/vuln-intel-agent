title: obsidian-tc is a governed, agent-ready Model Context Protocol server for 
  Obsidian vaults. Prior to 1.3.1, tool dispatch does not compare the 
  caller-controlled input.vault value with the vault bound to the caller, the 
  JSON Web Token (JWT) has no vault claim, and the folder access-control list is
  shared globally. Any valid token can therefore select another configured vault
  and read, write, or delete its contents through affected tools. Version 1.3.1 
  fixes the vulnerability by binding tokens and request context to a vault and 
  rejecting mismatched input.vault values before scope checks.
