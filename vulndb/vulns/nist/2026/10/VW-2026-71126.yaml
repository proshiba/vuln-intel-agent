title: FOG is a free open-source cloning/imaging/rescue suite/inventory 
  management system. Versions 1.5.10.1754 and below contain an unauthenticated 
  SSRF vulnerability in getversion.php which can be triggered by providing a 
  user-controlled url parameter. It can be used to fetch both internal websites 
  and files on the machine running FOG. This appears to be reachable without an 
  authenticated web session when the request includes newService=1. The issue 
  does not have a fixed release version at the time of publication.
