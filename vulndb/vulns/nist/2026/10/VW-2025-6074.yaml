title: Turms IM Server v0.10.0-SNAPSHOT and earlier contains a broken access 
  control vulnerability in the user online status query functionality. The 
  handleQueryUserOnlineStatusesRequest() method in UserServiceController.java 
  allows any authenticated user to query the online status, device information, 
  and login timestamps of arbitrary users without proper authorization checks.
