title: OpenCATS is an open-source applicant tracking system and recruitment CRM 
  for staffing agencies and hiring teams. Prior to 0.10.0, the OpenCATS Import 
  module in modules/import/ImportUI.php can preserve an uploaded file's original
  name for one import data type and place the file in the web-accessible 
  temporary directory. An authenticated user with Import privileges can select 
  the affected import path and upload a PHP file that remains under an 
  attacker-controlled executable filename, and an import error can leave the 
  file on disk. If the temporary directory is served with PHP execution enabled,
  requesting the staged file can execute arbitrary PHP code with the web server 
  process privileges, exposing or modifying recruiting data and the host system.
  This issue is fixed in version 0.10.0.
