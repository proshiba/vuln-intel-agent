title: Nginx UI is a web user interface for the Nginx web server. Prior to 
  2.4.1, the regular HTTP configuration API rejects restricted Nginx directives 
  such as load_module, js_import, and js_content. However, the MCP configuration
  interface allows a secondary authenticated user to write and apply equivalent 
  restricted configuration content. This allows the user to load 
  ngx_http_js_module.so, import attacker-controlled JavaScript, reload Nginx, 
  and execute NJS in the Nginx worker context. This issue is fixed in version 
  2.4.1.
