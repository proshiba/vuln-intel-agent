title: Convex is an open-source reactive database for application developers. 
  Prior to the self-hosted image published on August 10, 2026 and local 
  deployment binary precompiled-2026-08-10-c0cb7ae, a malicious user can, in 
  rare cases, perform unauthorized reading of deployment information from a 
  Convex deployment. The maintainer has intentionally withheld the affected 
  component and technical mechanism to protect self-hosted deployments that have
  not been updated, and no evidence of exploitation is known. Convex cloud 
  deployments were patched automatically. This issue is fixed in the self-hosted
  image published on August 10, 2026 and local binary 
  precompiled-2026-08-10-c0cb7ae.
