title: "In the Linux kernel, the following vulnerability has been resolved:\n\n9p:
  Fix v9fs_issue_write() to update i_size and remote_i_size\n\nFix v9fs_issue_write()
  to update i_size and remote_i_size to the new size\nof the server file if we made
  it larger, using the start fpos and the count\nreturned by p9_client_write() to
  calculate the new minimum file size.\n\nThis assumes that if the 9P server makes
  a short write (say it hits\nENOSPC), a reduced count is returned."
