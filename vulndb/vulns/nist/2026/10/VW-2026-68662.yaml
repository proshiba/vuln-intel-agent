title: "MISP renders the source field of a Galaxy Cluster as a clickable hyperlink
  whenever the stored value passes PHP's FILTER_VALIDATE_URL validation. Because FILTER_VALIDATE_URL
  accepts the javascript: URI scheme, a user with galaxy editor privileges on the
  local instance or on a synced instance could store a javascript: URL as the cluster
  source.\n\nWhen another user views the affected Galaxy Cluster and clicks the rendered
  link, the embedded script executes in the victim's browser context, enabling session
  hijacking, data exfiltration, or actions performed on behalf of the victim.\n\n\
  Preconditions:\n\n- Attacker must hold galaxy editor privileges (local or via sync).\n\
  \n- Victim must view the affected cluster and click the malicious link.\n\nImpact:\n\
  \n- Stored cross-site scripting (XSS) in the victim's browser.\n\n- Potential session
  theft, credential harvesting, or unauthorized actions within the MISP application.\n\
  \nAffected: <2.5.48."
