title: simple-git, an interface for running git commands in any node.js 
  application, enables applications to execute Git operations from JavaScript. 
  Prior to 4.0.0, the default blockUnsafeOperationsPlugin does not completely 
  reject configuration includes supplied through customArgs to git.clone(). The 
  missing include.path classification permits Git to load an attacker-controlled
  configuration file, and the initial remediation does not cover 
  includeIf.<condition>.path, allowing the same file-loading primitive through a
  conditional include. A loaded configuration can set an executable Git option 
  such as core.sshCommand, which Git invokes during the clone operation with the
  privileges of the Node.js process. Exploitation requires the application to 
  pass attacker-influenced custom arguments and requires an attacker-controlled 
  file that the process can read. This issue is fixed in 4.0.0.
