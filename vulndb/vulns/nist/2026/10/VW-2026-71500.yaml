title: "Improper neutralization of input during web page generation ('cross-site scripting')
  vulnerability in Apache Commons BCEL.\n\n\n\nThis only happens when you're using
  Class2HTML to generate webpages for possibly-attacker-controlled class files, where
  Class2HTML emitters write attacker class-file strings into HTML unescaped (stored
  XSS in reports).\n\n\n\nThis issue affects Apache Commons BCEL: before 6.13.0.\n\
  \n\n\nUsers are recommended to upgrade to version 6.13.0, which fixes the issue."
