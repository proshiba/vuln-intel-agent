title: Excelize is a Go language library for reading and writing Microsoft Excel
  spreadsheets. From 2.3.1 to 2.11.0, the decryption dispatch performs 
  insufficient structural and parameter validation before standard and agile 
  decryptors slice, index, allocate, and divide using attacker-controlled 
  values. Decrypt passes attacker-controlled EncryptionInfo and EncryptedPackage
  data into standardDecrypt or agileDecrypt before validating the structures 
  used by those routines. When a malformed OLE compound file with a 
  version-valid EncryptionInfo stream is opened or passed to Decrypt, nine 
  malformed-input classes reach unrecovered Go runtime panics instead of the 
  documented error path, allowing an attacker to terminate the calling process. 
  No fixed version is available as of this review.
