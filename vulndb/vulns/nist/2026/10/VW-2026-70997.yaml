title: Rundeck before 6.2.0 contains a path traversal vulnerability that allows 
  users holding only the project configure ACL to read arbitrary server files by
  setting resources.source.N.config.file to any absolute path. Attackers can 
  retrieve file contents through editProjectNodeSourceFile or the 
  apiSourceGetContent endpoint to obtain database passwords, LDAP bind 
  credentials, and other projects' data.
