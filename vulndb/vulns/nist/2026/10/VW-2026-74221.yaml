title: VideoLAN VLC for Android prior to version 3.7.0 contains a path traversal
  vulnerability in the Remote Access Server routing for the authenticated 
  endpoint GET /download. The file query parameter is concatenated into a 
  filesystem path under the configured download directory without 
  canonicalization or directory containment checks, allowing an authenticated 
  attacker with network reachability to the Remote Access Server to request 
  files outside the intended directory. The impact is bounded by the Android 
  application sandbox and storage restrictions, typically limiting exposure to 
  app-internal and app-specific external storage.
