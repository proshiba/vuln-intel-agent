title: When a private repository is transferred to a user who lacks access, 
  Gitea grants that recipient temporary read access as a collaborator so they 
  can review the repository. Rejecting or cancelling the transfer did not revoke
  this collaboration, so the named recipient kept persistent read access to the 
  private repository, including its code, issues, pull requests and wiki, and 
  could clone it. The repository owner was not notified. Transfer-granted access
  is now removed while collaborations that existed before the transfer are 
  preserved.
