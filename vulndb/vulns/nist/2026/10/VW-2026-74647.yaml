title: The AcyMailing plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via the customField[] parameter of the public frontusers::subscribe 
  endpoint in versions up to, and including, 11.1.0. This is due to insufficient
  input sanitization and output escaping in the acym_cleanVar() sanitizer, whose
  HTML-tag stripper only matches complete tags (requiring a closing '>'), 
  together with SubscriberInsertion::replaceUserInformation() and the archive 
  view template, which substitute the stored subscriber field value into the 
  mail body and emit it without HTML encoding. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that will 
  execute whenever a user accesses the online-archive URL for the poisoned 
  subscriber, including administrators who click the plugin-generated link in 
  the Subscribers → History screen.
