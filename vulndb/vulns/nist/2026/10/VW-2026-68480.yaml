title: "Uncontrolled resource consumption in component ssd-scp in Apache MINA SSHD
  versions up to 2.19.0 or 3.0.0-M1 to 3.0.0-M5. Apache MINA SSHD is a Java library
  for client-side and server-side SSH.\n\n\n\n\nComponent sshd-scp of Apache MINA
  SSHD provides a Java implementation of SCP. The SCP command protocol is line-oriented
  with LF-terminated lines. The protocol handler in sshd-scp did not impose any limit
  on the length of such protocol lines. A malicious peer just sending a junk command
  containing a never-ending sequence of characters but never a LF would cause the
  receiver to allocate memory to store this whole junk command, exhausting memory
  and crashing the application with an OutOfMemoryError.\n\n\n\n\nUsers are recommended
  to upgrade to version 2.20.0 or 3.0.0-M6, which fix this issue by enforcing an upper
  limit on the length of SCP protocol lines."
