  that a submitted review rating is numeric before storing it and later using it
  in numeric operations when rendering reviews, allowing unauthenticated users 
  to make the reviewed content fail with a fatal error for all visitors until 
  the review is removed (a persistent denial of service), when user reviews are 
  enabled.
