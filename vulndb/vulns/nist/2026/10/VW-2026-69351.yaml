title: KaTeX is a fast, easy-to-use JavaScript library for TeX math rendering on
  the web. From 0.11.0 until 0.18.2, KaTeX uses ordinary JavaScript property 
  access for the renderer options object, the trust setting, default and 
  processor setting metadata, and namespace lookup and group restoration, 
  allowing inherited properties to be treated as explicitly supplied values. 
  When Object.prototype is already polluted or an attacker controls the options 
  object's prototype, attacker-controlled mathematical expressions can use an 
  inherited trust value to enable trusted rendering and produce links capable of
  user-interaction cross-site scripting or loading attacker-selected external 
  resources in a consuming application that inserts unsanitized KaTeX output 
  into a page. KaTeX does not itself create the prototype pollution, and 
  rendering an expression alone does not execute script. This issue is fixed in 
  version 0.18.2.
