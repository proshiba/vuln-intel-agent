title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject dev-bound-only programs on other devices\n\n__bpf_offload_dev_match() falls
  back to comparing offdev pointers after an\nexact netdev mismatch. Bound-only programs
  normally have NULL offdevs, so\nunrelated netdevs compare equal. A bound-only program
  on an\noffload-registered netdev can instead inherit a real offdev and match a\n\
  sibling port. With CAP_BPF and CAP_NET_ADMIN, a caller can use\nbpf(BPF_LINK_CREATE)
  with a different target ifindex to run metadata kfuncs\nspecialized for the bound
  driver on the target driver's xdp_buff. Running a\nveth-bound program on tun reads
  beyond tun's bare stack xdp_buff as a\nveth_xdp_buff.\n\n  Oops: general protection
  fault, probably for non-canonical address\n  KASAN: null-ptr-deref in range [0x0000000000000010-0x0000000000000017]\n\
  \  RIP: 0010:veth_xdp_rx_timestamp (drivers/net/veth.c:1673)\n  Call Trace:\n  \
