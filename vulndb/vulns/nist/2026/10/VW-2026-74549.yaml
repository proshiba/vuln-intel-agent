title: 'A flaw has been found in yoshitomo-matsubara torchdistill up to 1.1.5. This
  affects the function load_ckpt of the file torchdistill/common/main_util.py. Executing
  a manipulation of the argument src_ckpt can lead to deserialization. The attack
  needs to be launched locally. The exploit has been published and may be used. The
  project maintainer explains: "This is very similar to an internal report that GH
  auto-generated for the owner before, which I found tolerable for this project at
  that time. So I will close this as duplicate."'
