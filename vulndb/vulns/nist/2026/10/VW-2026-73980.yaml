title: A vulnerability was found in Linksys E1700 1.0.0.4.003. This affects the 
  function setLinksysIpv6 of the file /goform/setLinksysIpv6. The manipulation 
  of the argument _6rd_prefix/_6rd_prefix_len results in os command injection. 
  The attack can be launched remotely. The exploit has been made public and 
  could be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
