title: A flaw has been found in **permission filters** in the **foreman** 
  package. The API loads a filter by its identifier and does not apply the 
  search limit on the caller's permission. A low-privileged network attacker or 
  user must already be allowed to delete filters for one role only. They can 
  delete filters that belong to other unlocked roles. Those other roles then 
  lose the access the deleted filters had granted.
