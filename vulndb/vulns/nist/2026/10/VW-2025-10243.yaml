title: Homarr is an open-source dashboard. Prior to version 1.45.3, it was 
  possible to craft an input which allowed privilege escalation and getting 
  access to groups of other users due to missing sanitization of inputs in ldap 
  search query. The vulnerability could impact all instances using ldap 
  authentication where a malicious actor had access to a user account. Version 
  1.45.3 has a patch for the issue.
