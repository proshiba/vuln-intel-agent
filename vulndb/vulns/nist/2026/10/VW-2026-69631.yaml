title: YesWiki before 4.6.7 contains a blind server-side request forgery 
  vulnerability that allows unauthenticated attackers to make arbitrary 
  server-side requests via the idtypeannonce parameter of 
  /api/entries/bazarlist. Because isValidURL() always returns true, attackers 
  can supply internal URLs fetched by curl in loadURLContent() to probe internal
  networks and reach internal services or metadata endpoints.
