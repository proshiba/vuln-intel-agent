title: Microsoft UFO is an open-source framework for intelligent automation 
  across devices and platforms. Prior to 3.0.9, the execute_command tool in 
  ufo/client/mcp/http_servers/linux_mcp_server.py treats sort and uniq as 
  read-only commands while the free-form command parameter can select their 
  file-output forms. An authenticated caller can use sort -o or the optional 
  second uniq operand to create or overwrite files writable by the UFO server 
  process without shell metacharacters, because the allowed binary opens the 
  destination itself and the argument policy does not reject the operation. This
  can corrupt configuration or other writable data and disrupt the service, but 
  the demonstrated primitive does not directly disclose files or establish 
  arbitrary code execution. This issue is fixed in version 3.0.9.
