title: TencentCloud Octop through 1.0.2b6 contains a missing authorization 
  vulnerability that allows authenticated low-privileged users to read stored 
  provider API keys via GET /api/providers and GET /api/voice/providers. 
  Attackers can query these endpoints, which only validate the JWT, to obtain 
  plaintext LLM and voice provider API keys and abuse the upstream provider 
  accounts.
