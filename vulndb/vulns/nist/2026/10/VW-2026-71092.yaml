title: Quasar Framework is a framework for building high-performance Vue.js user
  interfaces. Prior to 3.3.0, several @quasar/app-vite SSR and SSG rendering 
  paths interpolated ssrContext.nonce directly into quoted HTML attributes. An 
  application that derives or overrides this value with attacker-controlled data
  can allow a quote to terminate the nonce attribute and inject additional 
  attributes or markup into generated HTML across development and production SSR
  or SSG output. Cryptographically generated base64 or base64url nonces are not 
  affected because they lack HTML attribute delimiters. This issue is fixed in 
  version 3.3.0.
