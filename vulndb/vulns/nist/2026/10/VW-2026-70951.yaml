title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: don't filter by BSS type when removing stale entries\n\nWhen an assoc
  AP switches to a channel that already has a BSS entry,\ncfg80211_update_assoc_bss_entry()
  removes that entry before rehashing\nthe real one, since the two would otherwise
  collide in the BSS rbtree.\n\nThe lookup for that entry also required it to match
  the connection's BSS\ntype, so an entry advertising e.g. the IBSS capability bit
  was left in\nplace, and the following cfg80211_rehash_bss() then ran into it:\n\n\
  \  WARN_ON(!cmp)\n\nChanging the type shouldn't really happen, but can be triggered
  by a\nrogue AP/device, so drop the check and remove any entries matching\nthe comparison."
