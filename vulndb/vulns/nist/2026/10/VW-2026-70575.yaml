title: A flaw was found in SSSD. An unprivileged local user can repeatedly 
  request master automount map updates through the autofs responder due to 
  missing authorization checks. This triggers global cache invalidation and 
  forces repeated lookups to backend directory providers, leading to a Denial of
  Service (DoS) from degraded automount availability and elevated resource 
  consumption.
