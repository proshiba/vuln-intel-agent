title: Dockhand before 1.0.40 contains an authentication bypass vulnerability in
  its git webhook endpoints that allows unauthenticated remote attackers to 
  trigger arbitrary stack redeployments by exploiting a null webhook secret 
  guard condition. Attackers can enumerate sequential stack IDs and send 
  unsigned webhook requests to force git clone and docker compose operations, 
  enabling denial of service or, when combined with write access to the tracked 
  git branch, container escape and full host compromise via attacker-controlled 
  docker-compose.yml with privileged bind mounts.
