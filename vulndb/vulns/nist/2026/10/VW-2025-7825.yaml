  case allows to delete tables with a name of maximum 6 characters. We weren't able
  to identify a way to exfiltrate data within query character limit.\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThis issue affects SIMPLE.ERP in versions
