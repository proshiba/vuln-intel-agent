title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.40.0 through 0.70.5, 
  ClassRepresentation.render_docstring copies a schema record's doc value into a
  generated triple-double-quoted class docstring without escaping quotes or 
  backslashes. A crafted triple-quote sequence can close the docstring and 
  inject statements into the generated class body, while a trailing backslash 
  can escape the generated closing delimiter, allowing Python code execution 
  during module import. Version 0.70.6 fixes the vulnerability by escaping 
  quotes, backslashes, and unsafe control characters before rendering 
  docstrings.
