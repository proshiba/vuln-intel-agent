title: An authentication bypass and command injection vulnerability exists in 
  the inter-switch remote execution service of Brocade Fabric OS versions before
  9.2.2d and 10.0.0 through 10.0.0a1. When processing remote command execution 
  IPC frames across the fabric, the receiving switch processes these commands at
  an elevated processing level without proper verification of transmitted 
  parameters. This allows an attacker on a single fabric-connected switch to 
  escalate privileges and execute arbitrary root commands locally or across 
  other managed fabric members where remote execution functionality is enabled.
