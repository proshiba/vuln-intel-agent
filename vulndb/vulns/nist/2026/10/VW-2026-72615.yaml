title: SumatraPDF is a multi-format reader for Windows. In 3.6.1 and earlier, 
  MaybeFlipBitmap() asks GDI+ to read the attacker-controlled 
  PropertyTagOrientation size through GetPropertyItem() while supplying only a 
  fixed 64-byte buf on the stack. Opening a crafted TIFF with enough EXIF 
  Orientation values can cause attacker-selected bytes to overwrite stack 
  control data, while tested builds terminate through the stack cookie check. No
  broader impact is claimed beyond the advisory-supported conditions. No fixed 
  version is available as of this review.
