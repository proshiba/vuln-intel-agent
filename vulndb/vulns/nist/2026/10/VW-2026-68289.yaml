title: JupyterLab is an extensible environment for interactive and reproducible 
  computing, based on the Jupyter Notebook Architecture. From JupyterLab 4.0.0 
  until 4.5.11 and 4.6.4, the PyPI Extension Manager uninstall request reaches 
  ExtensionHandler.post, which validates extension names for installation but 
  passes uninstall names to PyPIExtensionManager.uninstall and python -m pip 
  uninstall without rejecting option-like values. The security impact requires 
  that the PyPI Extension Manager is enabled, the account can call the extension
  API, and kernels and terminals are disabled or delegated to remote hosts; 
  otherwise the user can already read files and make outbound requests directly.
  An authenticated user with extension API access can supply a pip requirements 
  option to make the server read a local file or fetch an internal URL, and 
  reflected parse errors can return the first unparsable line or response 
  content. A pip log option can also create or corrupt a chosen path with 
  pip-generated log
