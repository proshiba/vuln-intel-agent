title: ImageMagick is free and open-source software used for editing and 
  manipulating digital images. Prior to 7.1.2-30 and 6.9.13-55, a crafted highly
  compressed MAT image can make the MAT decoder create temporary files larger 
  than the configured security-policy limit, bypassing resource restrictions and
  consuming excessive disk space. This issue is fixed in versions 7.1.2-30 and 
  6.9.13-55.
