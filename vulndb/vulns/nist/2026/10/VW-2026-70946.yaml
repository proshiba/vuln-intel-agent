title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: reset state when starting AP fails\n\nieee80211_start_ap() can set enable_beacon
  (and beacon_int) and fail\nlater, leaving it set forever. Scanning can then attempt
  to restore\nbeaconing on such an interface, leading to:\n\n  Oops: divide error:
  0000 [#1] SMP KASAN NOPTI\n  RIP: 0010:mac80211_hwsim_link_info_changed+0xca7/0xf00\n\
  \  Call Trace:\n   drv_link_info_changed+0x413/0x860 net/mac80211/driver-ops.c:495\n\
  \   ieee80211_link_info_change_notify+0x24b/0x3c0 net/mac80211/main.c:427\n   ieee80211_offchannel_return+0x381/0x580
  net/mac80211/offchannel.c:160\n   __ieee80211_scan_completed+0x993/0xe30 net/mac80211/scan.c:519\n\
  \   ieee80211_scan_work+0x472/0x2010 net/mac80211/scan.c:1193\n   cfg80211_wiphy_work+0x2b7/0x550
  net/wireless/core.c:538\n\nin hwsim. Also, cfg80211 then allows changing the interface
  type,\nand the off-channel path getgs confused about beaconing as well,\nleading
  to another warning:\n\n  WARNING: net/mac"
