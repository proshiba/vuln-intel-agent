title: A security vulnerability has been detected in Cudy TR1200 
  1.16.3-20230804-164635. Impacted is an unknown function of the file 
  /cgi-bin/luci/admin/network/wireless/config/ of the component Wireless 
  Settings Page. Such manipulation of the argument SSID leads to cross site 
  scripting. It is possible to launch the attack remotely. The exploit has been 
  disclosed publicly and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
