title: "In Stump through 0.1.10, the updateSmartList and deleteSmartList GraphQL mutations
  (crates/graphql/src/mutation/smart_lists.rs) depend only on the shared AccessSmartList
  permission and resolve the target list at Reader access (lacking a creator check).
  Any authenticated user with that permission can overwrite, delete, or take over
  another user's smart list. (updateSmartList sets creatorId to the caller identity,
  and can set visibility to PRIVATE, locking out the original owner.) NOTE: this is
  unrelated to the graphql crate on crates.io."
