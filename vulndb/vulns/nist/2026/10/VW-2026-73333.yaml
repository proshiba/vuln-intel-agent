title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  SysCategoryController that allows any authenticated user to edit category 
  dictionary nodes via /sys/category/edit. Low-privileged attackers can send 
  POST or PUT requests supplying a node id to rename, recode, or move 
  system-wide sys_category nodes, altering classification values used across 
  forms.
