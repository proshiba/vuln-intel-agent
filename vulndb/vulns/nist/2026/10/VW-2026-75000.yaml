title: MateCloud through 5.0.8 contains a missing authorization vulnerability 
  that allows any authenticated user to manage object storage by calling the 
  unprotected /api/v1/admin/storage endpoints in StorageController. 
  Low-privilege or self-registered users can supply arbitrary bucket and 
  objectName values to list objects, obtain pre-signed download URLs for other 
  users' files, delete objects, and upload at chosen keys.
