title: A flaw has been found in Open5GS up to 2.7.5. This impacts the function 
  ogs_pfcp_handle_create_pdr in the library lib/pfcp/handler.c of the component 
  FAR-ID Handler. Executing a manipulation can lead to null pointer dereference.
  The attack may be performed from remote. The attack requires a high level of 
  complexity. The exploitability is said to be difficult. The exploit has been 
  published and may be used. This patch is called 
  93a9fd98a8baa94289be3b982028201de4534e32. It is advisable to implement a patch
  to correct this issue.
