title: Wazuh from 4.1.1 before 4.14.8 contains a path traversal vulnerability in
  upload_list_file, upload_rule_file, and upload_decoder_file that allows 
  malicious cluster workers to write files at arbitrary paths. Attackers holding
  the cluster key can send DistributedAPI requests with ../ sequences in 
  filename, bypassing REST controller validation, to write files as the wazuh 
  user.
