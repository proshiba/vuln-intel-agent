title: yawkat LZ4 Java provides LZ4 compression for Java. Prior to 1.11.4, 
  net.jpountz.lz4.LZ4BlockInputStream configured with stopOnEmptyBlock set to 
  false handles each well-formed empty LZ4Block by recursively calling refill(),
  allowing a long sequence of empty blocks in an attacker-controlled compressed 
  stream to exhaust the decoding thread's stack and throw StackOverflowError. 
  The default stopOnEmptyBlock setting is true and is not affected, and the 
  issue does not cause memory corruption. This issue is fixed in version 1.11.4.
