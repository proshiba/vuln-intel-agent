title: "In the Linux kernel, the following vulnerability has been resolved:\n\nneighbour:
  Enforce min/max to NDTPA_INTERVAL_PROBE_TIME_MS.\n\nNDTPA_INTERVAL_PROBE_TIME_MS
  sets .type and .min but misses\n.validation_type, so no validation is applied:\n\
  \n  # ynl --family rt-neigh --do setneightbl \\\n  --json '{\"name\": \"arp_cache\"\
  , \"parms\": {\"interval-probe-time-ms\": 0}}'\n\n  # ynl --family rt-neigh --dump
  getneightbl --output-json | \\\n  jq '.[] | select(.name == \"arp_cache\" and has(\"\
  config\"))\n          | .parms[\"interval-probe-time-ms\"]'\n  0\n\nMoreover, nla_get_msecs()
  uses msecs_to_jiffies(), and u64 is\nsilently cast to u32, so a larger value can
  bypass the min check:\n\n  e.g. 4294967296 == 0x100000000\n\n  # ynl --family rt-neigh
  --do setneightbl \\\n  --json '{\"name\": \"arp_cache\", \"parms\": {\"interval-probe-time-ms\"\
  : 4294967296}}'\n\n  # ynl --family rt-neigh --dump getneightbl --output-json |
  \\\n  jq '.[] | select(.name == \"arp_cache\" and has(\"config\"))\n          |
  .parms[\"interval-probe-time-ms\"]'\n  0\n\nmsecs_"
