title: The Podlove Podcast Publisher plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting via Auphonic Webhook in all versions up to, and 
  including, 4.5.6 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  The injection is triggered by submitting a request to the Auphonic webhook 
  endpoint with any POST body where the status_string field is not the literal 
  string 'Done', causing the full raw POST superglobal to be stored in the 
  plugin log before any authentication key validation is performed.
