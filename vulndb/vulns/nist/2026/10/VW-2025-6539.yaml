title: A flaw has been found in SohuTV CacheCloud up to 3.2.0. The impacted 
  element is the function redirectNoPower of the file 
  src/main/java/com/sohu/cache/web/controller/WebResourceController.java. This 
  manipulation causes cross site scripting. The attack is possible to be carried
  out remotely. The exploit has been published and may be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
