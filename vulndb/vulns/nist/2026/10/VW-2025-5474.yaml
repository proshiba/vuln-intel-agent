title: Flowise is a drag & drop user interface to build a customized large 
  language model flow. A file upload vulnerability in version 3.0.7 of FlowiseAI
  allows authenticated users to upload arbitrary files without proper 
  validation. This enables attackers to persistently store malicious Node.js web
  shells on the server, potentially leading to Remote Code Execution (RCE). The 
  system fails to validate file extensions, MIME types, or file content during 
  uploads. As a result, malicious scripts such as Node.js-based web shells can 
  be uploaded and stored persistently on the server. These shells expose HTTP 
  endpoints capable of executing arbitrary commands if triggered. The uploaded 
  shell does not automatically execute, but its presence allows future 
  exploitation via administrator error or chained vulnerabilities. This presents
  a high-severity threat to system integrity and confidentiality. As of time of 
  publication, no known patched versions are available.
