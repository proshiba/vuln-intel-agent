title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  GET /sys/api/getUserByName that allows low-privileged authenticated users to 
  retrieve any user's stored password value. Attackers can decrypt the AES-CBC 
  protected response using the hard-coded key exposed by /sys/getEncryptedString
  to obtain administrators' password ciphertexts for offline guessing.
