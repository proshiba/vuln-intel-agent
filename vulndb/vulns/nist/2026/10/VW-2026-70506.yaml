title: Langflow is a tool for building and deploying AI-powered agents and 
  workflows. Prior to 1.9.0, any authenticated Langflow user can achieve Remote 
  Code Execution (RCE) on the server by adding an MCP server with the "Stdio" 
  transport. The user-supplied command field is passed directly to bash -c "exec
  {command}" with zero validation, no allowlisting, and no sandboxing. The 
  command executes immediately when the server list is fetched. Additionally, 
  the env field allows arbitrary environment variable injection (e.g., 
  LD_PRELOAD, PATH override). This vulnerability is fixed in 1.9.0.
