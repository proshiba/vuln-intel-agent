  v6.0.20262.10021, the integrity check applied to the external helper tools 
  launched by the application is insufficient. Before executing a helper tool, 
  the application only verifies that the file carries a valid Authenticode 
  signature whose certificate subject name matches a broad allow list of 
  publisher name fragments, rather than verifying that the file is the specific 
  executable shipped with that version of the product. A local threat actor with
  low privileges who replaces one of these helper executables with any other 
