title: A security vulnerability has been detected in CloudPanel Community 
  Edition up to 2.5.1. The affected element is an unknown function of the file 
  /admin/users of the component HTTP Header Handler. Such manipulation of the 
  argument Referer leads to open redirect. It is possible to launch the attack 
  remotely. The exploit has been disclosed publicly and may be used. Upgrading 
  to version 2.5.2 is sufficient to fix this issue. Upgrading the affected 
  component is recommended.
