title: Use-after-free vulnerability in VFS in Google gVisor prior to release 
  20260831.0 on all platforms allows a local attacker with standard container 
  privileges to achieve code execution in the host sentry process by 
  double-freeing the backing MemoryFile from an in-sandbox overlay filesystem. 
  The sentry process remains confined by host-level Linux seccomp and namespace 
  boundaries.
