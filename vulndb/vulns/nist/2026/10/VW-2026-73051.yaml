title: The SureDash – Community, Courses & Member Dashboard plugin for WordPress
  is vulnerable to Stored DOM-Based Cross-Site Scripting via Image 'alt' 
  Attribute in Community Post Content in all versions up to, and including, 
  1.12.1 due to insufficient input sanitization and output escaping. This makes 
  it possible for authenticated attackers, with subscriber-level access and 
  above, to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses an injected page. The entity-encoded payload bypasses 
  server-side wp_kses filtering because kses permits the img/alt tag combination
  and does not normalize entities inside attribute values; the decode occurs 
  client-side when GLightbox reads the .alt DOM property and assigns the result 
  to innerHTML.
