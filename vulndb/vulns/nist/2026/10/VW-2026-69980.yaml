title: 'In Bouncy Castle for Java before 1.86, HQC leaked secret-derived data through
  two side channels: its GF(2^8) arithmetic used lookup tables indexed by field elements,
  making the cache line touched a function of the operand, and its fixed-weight support
  sampler left its duplicate scan as soon as a collision was found and stored accepted
  positions at a secret index. Both run on secret inputs during encapsulation and
  decapsulation, and the sampler re-expands the secret key from its seed on every
  decapsulation, so an attacker able to observe cache behaviour or decapsulation timing
  can recover information about the HQC private key. The field arithmetic is now table-free
  and the sampler branch-free within a batch of candidates, with output and randomness
  consumption unchanged.'
