title: Squid is a caching proxy for the Web. From 3.3.0.1 to before 7.6, due to 
  an improper enforcement of behavioral workflow bug, Squid is vulnerable to a 
  Request Smuggling attack against HTTP/1.1 Transfer-Encoding. HTTP header 
  parsing (`src/HttpHeader.cc`) accepted the bare` Transfer-Encoding:` identity 
  form, which the HTTP specification prohibits because any transfer coding must 
  be wrapped within chunked encoding. This problem allows a trusted client to 
  perform an HTTP Request Smuggling attack when HTTP/1.1 is used, bypassing 
  security mechanisms that may be in place between attacker and Squid. When 
  there is an HTTP cache operating prior to the affected Squid, this Request 
  Smuggling attack also allows the attacker to poison that web cache and store 
  arbitrary malicious content at any URL for delivery to other clients' future 
  requests. This issue is fixed in version 7.6.
