title: Mooncake transfer engine before 0.3.13 contains an untrusted pointer 
  dereference in ServerSession::readHeader that allows unauthenticated attackers
  to read and write arbitrary process memory via the TCP transport data port. 
  Attackers can send a crafted SessionHeader with arbitrary addr and size values
  using READ or WRITE opcodes to disclose KV cache contents, prompts and secrets
  or corrupt memory toward code execution.
