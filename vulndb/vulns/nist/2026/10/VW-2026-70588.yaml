title: A flaw was found in SSSD. A local attacker with access to the Name 
  Service Switch (NSS) responder UNIX socket can trigger an integer underflow by
  sending a specially crafted request with an undersized packet header. This 
  issue causes an out-of-bounds memory read during packet parsing, crashing the 
  responder process and resulting in a Denial of Service (DoS).
