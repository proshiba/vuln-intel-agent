title: lamp-cloud through 5.10.1 contains an insecure direct object reference 
  vulnerability that allows authenticated users to obtain storage URLs for other
  users' files by supplying arbitrary file ids. Attackers can send another 
  user's file ids to the findUrlById handler of FileAnyoneController, which 
  never checks ownership, to retrieve access URLs and read uploaded attachments.
