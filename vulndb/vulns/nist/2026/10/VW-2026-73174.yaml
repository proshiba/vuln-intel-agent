title: Helicone through v2025.08.21-1 contains a server-side request forgery 
  vulnerability in the Jawn webhook sender that allows authenticated 
  organization users to reach internal services by using hostnames resolving to 
  private addresses. Attackers can create webhooks with public hostnames that 
  resolve or DNS-rebind to loopback or internal addresses, causing blind POST 
  requests to internal HTTPS services.
