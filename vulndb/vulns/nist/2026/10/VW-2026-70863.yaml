title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenvswitch:
  avoid reallocating confirmed conntrack labels\n\novs_ct_get_conn_labels() adds the
  labels extension when a conntrack\nentry does not have one.  Confirmed conntracks
  can be read locklessly,\nso adding an extension may reallocate and free the extension
  block\nwhile another CPU accesses it.\n\nOnly add the extension for unconfirmed
  conntracks.  A confirmed\nconntrack without labels now fails the caller's label
  operation instead\nof reallocating its extension storage."
