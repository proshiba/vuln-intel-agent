title: Jivejdon from commit 5489372d through commit ee67a65e contains a 
  reflected cross-site scripting vulnerability in 
  application/query/taggedThreadList.jsp that allows unauthenticated attackers 
  to inject script via unencoded tagID and count parameters. Attackers can craft
  a link with a script-closing payload in tagID or count, triggered when start 
  exceeds zero, to execute JavaScript in victims' browsers.
