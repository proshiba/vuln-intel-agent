title: OpenClaw Windows Node before 2026.7.1 contains an incomplete 
  environment-variable sanitizer in system.run that fails to block GIT_CONFIG_*,
  DOTNET_STARTUP_HOOKS, and JAVA_TOOL_OPTIONS variables. Attackers with gateway 
  or agent access can supply these variables to allowlisted tools like git, 
  dotnet, or java to load attacker-controlled code and achieve arbitrary code 
  execution.
