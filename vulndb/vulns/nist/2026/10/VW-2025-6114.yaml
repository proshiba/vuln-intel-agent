title: A vulnerability was detected in SohuTV CacheCloud up to 3.2.0. Affected 
  by this issue is the function doAppList/appCommandAnalysis of the file 
  src/main/java/com/sohu/cache/web/controller/AppController.java. Performing 
  manipulation results in cross site scripting. It is possible to initiate the 
  attack remotely. The exploit is now public and may be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
