title: "The Call Now Button – The #1 Click to Call Button for WordPress plugin for
  WordPress is vulnerable to unauthorized access of data due to a missing capability
  check on multiple functions in all versions up to, and including, 1.5.4. This makes
  it possible for authenticated attackers, with Subscriber-level access and above,
  to generate links to billing portal, where they can view and modify billing information
  of the connected, account, generate chat session tokens, view domain status, etc.\r\
  \nThis vulnerability was partially fixed in version 1.5.4 and fully fixed in version
  1.5.5"
