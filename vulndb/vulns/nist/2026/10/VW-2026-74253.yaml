title: NetEase Cloud Music client for Windows (cloudmusic.exe) versions 3.1.38 
  and 3.1.39.205426 contains a remote code execution vulnerability in the 
  renderer-process IPC bridge os.navigateExternal, which passes caller-supplied 
  URLs to ShellExecuteW without validating the URL scheme. An attacker able to 
  inject content into the renderer, such as by forging the /pc/upgrade/get API 
  response using a publicly known AES key over an unvalidated TLS connection, 
  can invoke os.navigateExternal with a file:// URL through an img onerror 
  payload to execute arbitrary local binaries under the logged-in user's 
  account.
