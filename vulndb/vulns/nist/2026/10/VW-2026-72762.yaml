title: "In Apache CXF, the parser for multipart/MTOM attachment part headers did not
  fully enforce the configured attachment-max-header-size (default 300 characters)
  and attachment-headers-max-count (default 500) limits. The size limit was applied
  only to each physical line, not to a header value built from continuation lines
  or to the combined values of a repeated header. The count limit was checked against
  the number of distinct header names, not the total number of header lines. A remote,
  unauthenticated attacker could send a multipart request with very large folded or
  repeated part headers. The server would then allocate memory without bound, causing
  a denial of service. \nUsers are recommended to upgrade to versions 4.2.4 or 4.1.9
  or 3.6.13, which fix this issue."
