title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  wait for RCU readers before releasing dma_device\n\ndma_issue_pending_all() walks
  the dma_device_list with\nlist_for_each_entry_rcu() under rcu_read_lock(). dma_device_release()\n\
  unlinks the device with list_del_rcu() and then calls\ndevice->device_release()
  (which in many drivers, such as plx_dma.c,\ndirectly calls kfree()).\n\nBecause
  there is no grace period between unlinking the device and\nfreeing it, concurrent
  RCU readers in dma_issue_pending_all() can\naccess the device after it has been
  freed.\n\nThe lockless walk originally relied on clients holding a dmaengine\nreference
  to pin the provider module, and therefore the device, for as\nlong as they might
  traverse the list. Commit 8ad342a86359 (\"dmaengine:\nAdd reference counting to
  dma_device struct\") decoupled the dma_device\nlifetime from the module reference,
  so the device can now be released\nwhile a reader is still walking the list.\n\n\
  Add synchronize_rcu() before"
