title: The Career Section plugin for WordPress is vulnerable to Cross-Site 
  Request Forgery leading to Path Traversal and Arbitrary File Deletion in all 
  versions up to, and including, 1.6. This is due to missing nonce validation 
  and insufficient file path validation on the delete action in the 
  'appform_options_page_html' function. This makes it possible for 
  unauthenticated attackers to delete arbitrary files on the server via a forged
  request, granted they can trick a site administrator into performing an action
  such as clicking on a link.
