title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/habanalabs:
  postpone mem_mgr IDR destruction to hpriv_release()\n\nThe memory manager IDR is
  currently destroyed when user releases the\nfile descriptor.\nHowever, at this point
  the user context might be still held, and memory\nbuffers might be still in use.\n\
  Later on, calls to release those buffers will fail due to not finding\ntheir handles
  in the IDR, leading to a memory leak.\nTo avoid this leak, split the IDR destruction
  from the memory manager\nfini, and postpone it to hpriv_release() when there is
  no user context\nand no buffers are used."
