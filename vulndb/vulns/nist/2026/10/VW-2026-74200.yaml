title: An out-of-bounds write vulnerability in the SPI host command interface of
  Semtech's LR11xx transceiver firmware where a crafted SPI host command with an
  oversized length field can cause the firmware to write up to 254 arbitrary 
  bytes past the bounds of an internal, non-persistent memory buffer. 
  Exploitation requires physical access to the device and logical access to the 
  SPI bus.
