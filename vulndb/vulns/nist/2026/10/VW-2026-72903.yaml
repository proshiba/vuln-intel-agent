title: Contao is an Open Source CMS. From version 5.0.0 until 5.3.50 and 5.7.12,
  ImagesController joins the user-controlled {path} parameter to the configured 
  image target directory with Path::join() but does not use Path::isBasePath() 
  to verify that the canonical path remains inside that directory. An 
  unauthenticated request containing encoded parent-directory segments can 
  therefore return files under the project directory through BinaryFileResponse 
  when their names use an extension allowed by contao.image.valid_extensions. 
  The route can also reveal whether arbitrary paths exist, and debug responses 
  can disclose absolute filesystem paths, but paths below the upload directory 
  were not shown to be readable. This issue is fixed in versions 5.3.50 and 
  5.7.12.
