title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/hfi1:
  Fix the PIO_CRED credit-return mmap\n\nhfi1_file_mmap()'s PIO_CRED case must hand
  user space the single\ncredit-return page that holds this context's entry.  That
  page is the\nsecond or third page of the per-node credit-return allocation once
  the\nhardware send context index reaches 64 or 128, so the failure below is\nintermittent:
  when the entry lands on the first page the offset is zero\nand everything works.\n\
  \nTwo things are wrong.\n\nFirst, cr_page_offset is a byte offset but .va is a struct\n\
  credit_return *, so adding it is pointer arithmetic and scales the offset\nby sizeof(struct
  credit_return) == 64.  memvirt then lands 256 KiB or\n512 KiB past a 10240-byte
  allocation.  With an IOMMU translating, that\naddress is inside the vmalloc range
  but in no vm_area, so\ndma_mmap_coherent() -> iommu_dma_mmap() finds no pages, vmalloc_to_pfn()\n\
  returns page_to_pfn(NULL), and remap_pfn_range() installs a frame above\nMAXPHYADDR.\
  \  "
