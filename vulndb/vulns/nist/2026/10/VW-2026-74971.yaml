title: Dio is a powerful HTTP client for Dart and Flutter. From 1.0.0 until 
  2.8.0, dio_http2_adapter follows redirects in Http2Adapter._fetch by copying 
  the original RequestOptions.headers into the redirected HTTP/2 request without
  comparing the source and destination origins. A server contacted by an 
  application can return a cross-origin Location redirect to a different-origin 
  destination, which then receives preserved Authorization, Cookie, and 
  Proxy-Authorization headers because RequestOptions.copyWith retains the full 
  header map. The issue applies when applications use Http2Adapter for 
  authenticated requests, and redirect following is enabled by default. This 
  issue is fixed in version 2.8.0.
