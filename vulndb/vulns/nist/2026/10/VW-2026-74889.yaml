title: SFTPGo is an open source, event-driven file transfer solution. From 2.5.0
  until 2.7.6, an authenticated user with copy permission can copy a source file
  denied by denied_patterns or outside allowed_patterns to an allowed 
  destination name because file-pattern filters are evaluated only on the 
  destination. The user can then read the denied file contents. Recursive 
  directory copies can reproduce restricted contents under an allowed path, and 
  the hide policy is bypassed because files that appear missing to stat and 
  directory listings can still be copied. Home-directory boundaries, 
  virtual-folder layout, per-directory permissions, access to other accounts, 
  and administrative authorization remain enforced. This issue is fixed in 
  2.7.6.
