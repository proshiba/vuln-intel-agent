title: OpenPrinting CUPS before 2.4.20 contains a double-free in printer-class 
  management. When CUPS-Add-Modify-Class replaces an existing class member list,
  add_class() frees pclass->printers without clearing the pointer. If subsequent
  validation fails, the class retains the dangling pointer; CUPS-Delete-Class 
  subsequently frees the same allocation in cupsdDeletePrinter(). A client 
  authorized to modify and delete classes can cause scheduler-wide denial of 
  service. The default policy requires @SYSTEM privileges.
