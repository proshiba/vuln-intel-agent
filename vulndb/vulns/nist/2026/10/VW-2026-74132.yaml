title: SurrealDB from 3.1.0 before 3.3.0 contains an authorization bypass 
  vulnerability that allows authenticated users to delete protected graph edges 
  by triggering a REFERENCE ON DELETE CASCADE. Attackers with delete permission 
  on a referenced table can delete a record whose cascade disables permission 
  checks for edge cleanup, erasing edges despite the edge table's PERMISSIONS 
  FOR delete clause.
