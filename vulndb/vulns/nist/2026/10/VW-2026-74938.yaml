title: "[This CNA information record relates to multiple CVEs; the\ntext explains
  which aspects/vulnerabilities correspond to which CVE.]\n\n1) XSA-437 (CVE-2023-34321)
  addressed issues with overflows in\n   calculations involved in guests flushing
  caches through\n   GNTTABOP_cache_flush.  Unfortunately the fix there introduced
  a\n   calculation which may underflow, resulting in a loop which would - at\n  \
  \ least on 64-bit Arm - take excessively long, and which would likely\n   eventually
  crash the hypervisor.\n\n   This is CVE-2026-102699.\n\n2) GNTTABOP_cache_flush
  may be issued on memory mapped from another\n   domain using the grant table interface.\
  \  However there was no\n   restriction to disallow the use of invalidate-without-clean
  against\n   read-only grant mappings, which may corrupt the granted memory.\n\n\
  \   This is CVE-2026-102702."
