title: OWASP Coraza WAF is a golang modsecurity compatible web application 
  firewall library. Prior to 3.8.1, internal/cookies.ParseCookies in 
  internal/cookies/cookies.go handles boundary ASCII control characters and 
  control-only or empty cookie names differently from several backend cookie 
  parsers. An unauthenticated attacker can craft a Cookie header so Coraza 
  indexes or drops a cookie under a different name or value from the backend 
  application, causing rules targeting REQUEST_COOKIES or REQUEST_COOKIES_NAMES 
  to miss application-visible attacker data. Exploitation depends on the backend
  parser and affected rule scope, and interior control characters with 
  inconsistent backend behavior are outside this advisory's remediation. This 
  issue is fixed in version 3.8.1.
