title: The Addon Elements for Elementor plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting in all versions up to, and including, 1.14.3. This
  is due to insufficient input sanitization and output escaping on multiple 
  widget parameters. This makes it possible for authenticated attackers, with 
  Contributor-level access and above, to inject arbitrary web scripts via 
  multiple widget parameters in pages that will execute whenever a user accesses
  an injected page.
