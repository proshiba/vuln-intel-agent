title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (w83791d) remove fan/pwm 4-5 sysfs group on remove\n\nWhen the fan/pwm 4-5 pins
  are not used as GPIO, w83791d_probe()\ncreates the w83791d_group_fanpwm45 sysfs
  group on the I2C client\ndevice.\n\nThe probe error path removes this group when
  a later initialization\nstep fails, but the normal remove path only removes w83791d_group.\n\
  As a result, the optional fan/pwm 4-5 sysfs files can remain after the\ndriver is
  unbound.\n\nThe callbacks associated with these files access the driver data,\n\
  which is devm allocated and released after driver unbind. Leaving the\nsysfs files
  behind can therefore result in accesses to stale driver\ndata.\n\nRemove w83791d_group_fanpwm45
  during normal teardown as well.\n\nThis issue was found by manual code inspection."
