title: The Angular SSR is a server-rise rendering tool for Angular applications.
  Prior to versions 20.3.36, 21.2.23, and 22.1.7, the CommonEngine 
  retrieveSSGPage prerendered-page retrieval logic in @angular/ssr/node, and in 
  @angular/ssr for versions 17 through 18, accepts a relative request URL 
  containing a backslash parent-traversal segment on Windows. The non-special 
  resolve:// URL base preserves the backslash, path.join interprets it as a 
  Windows separator, and the pagePath.startsWith(normalize(publicPath)) check 
  incorrectly accepts a sibling output directory whose name shares the 
  configured public-directory prefix. An unauthenticated requester can therefore
  retrieve a sibling prerendered HTML page when that page contains the Angular 
  SSG marker. The issue is limited to Windows deployments that pass relative 
  request URLs to CommonEngine.render, have a prefix-sharing sibling output 
  directory, and contain qualifying prerendered Angular HTML; it does not 
  provide arbitrary file read. This issue
