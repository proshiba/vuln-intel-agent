title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  serialize state GC with device state flush\n\nThe deferred-device pass in xfrm_dev_state_flush()
  finds states under\nxfrm_state_dev_gc_lock, but drops the lock before calling\n\
  xfrm_dev_state_free() because the driver callback may sleep.  The device\nGC list
  does not hold an xfrm_state reference, so the state GC worker can\ndestroy the same
  state concurrently.\n\nThe race can proceed as follows:\n\n  CPU 0             \
  \                  CPU 1\n  find x on the device GC list\n  drop xfrm_state_dev_gc_lock\n\
  \  read x->xso.dev\n                                      xfrm_state_gc_destroy(x)\n\
  \                                      xfrm_dev_state_free(x)\n                \
  \                      xfrm_state_free(x)\n  continue xfrm_dev_state_free(x)\n\n\
  Both paths can invoke the driver callback and drop the device reference.\nCPU 0
  can also access the xfrm_state after CPU 1 has freed it.\n\nKASAN reported:\n\n\
  \  BUG: KASAN: slab-use-after-free in xfrm"
