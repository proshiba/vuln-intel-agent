title: A vulnerability was determined in OS4ED openSIS-Classic up to 9.3. The 
  affected element is the function save action of the file 
  modules/students/Student.php of the component General Information Tab. 
  Executing a manipulation of the argument students can lead to sql injection. 
  The attack may be performed from remote. The exploit has been publicly 
  disclosed and may be utilized. The project was informed of the problem early 
  through an issue report but has not responded yet.
