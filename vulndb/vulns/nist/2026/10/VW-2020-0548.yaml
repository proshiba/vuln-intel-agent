title: Multiple ZyXEL network-attached storage (NAS) devices running firmware 
  version 5.21 contain a pre-authentication command injection vulnerability, 
  which may allow a remote, unauthenticated attacker to execute arbitrary code 
  on a vulnerable device. ZyXEL NAS devices achieve authentication by using the 
  weblogin.cgi CGI executable. This program fails to properly sanitize the 
  username parameter that is passed to it. If the username parameter contains 
  certain characters, it can allow command injection with the privileges of the 
  web server that runs on the ZyXEL device. Although the web server does not run
  as the root user, ZyXEL devices include a setuid utility that can be leveraged
  to run any command with root privileges. As such, it should be assumed that 
  exploitation of this vulnerability can lead to remote code execution with root
  privileges. By sending a specially-crafted HTTP POST or GET request to a 
  vulnerable ZyXEL device, a remote, unauthenticated attacker may be able to 
