title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm,
  swap: fix SWAP_USAGE_OFFLIST_BIT collision with real usage count\n\nSWAP_USAGE_OFFLIST_BIT
  is embedded in the si->inuse_pages usage counter,\nand is meant to sit above any
  value that counter can reach.  However, it\nis defined from BITS_PER_TYPE(atomic_t),
  so it is bit 30.  On a system\nwith 4 KiB pages the flag collides with the usage
  count once that count\nreaches 4 TiB.\n\nswap_usage_in_pages() masks bit 30 out,
  so whenever the real count has\nthat bit set, every caller of it reads 4 TiB low:\n\
  \n* /proc/swaps understates Used by 4 TiB.\n\n* A raw count of exactly 2^30 masks
  to zero, so try_to_unuse() takes its\n  \"if (!swap_usage_in_pages(si)) goto success;\"\
  \ early exit and swapoff\n  tears the device down while pages are still swapped
  out. Nothing in\n  the rest of swapoff aborts the teardown, so those pages are lost.\n\
  \nIndependently of swapoff, the collision also corrupts the counter and the\nplist.\
  \  On a device in normal use, "
