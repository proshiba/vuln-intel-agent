title: FFmpeg through 9.0.2 contains a stack exhaustion vulnerability in 
  av_encryption_init_info_free() in libavutil/encryption_info.c, which 
  recursively frees AVEncryptionInitInfo linked lists built by the MOV demuxer's
  mov_read_pssh(). Attackers can supply a crafted MP4 file with tens of 
  thousands of small pssh boxes to exhaust the stack and crash the process, 
  while also causing quadratic CPU consumption.
