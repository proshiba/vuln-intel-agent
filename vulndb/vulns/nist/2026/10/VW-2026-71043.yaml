title: Microsoft UFO is an open-source framework for intelligent automation 
  across devices and platforms. Prior to 3.0.9, the press_key tool in 
  ufo/client/mcp/http_servers/mobile_mcp_server.py accepts a free-form key_code 
  parameter and passes it to `adb shell input keyevent`. The adb client joins 
  the arguments into a remote command string that the Android shell reparses, 
  allowing an authenticated Mobile MCP caller to execute additional commands as 
  the Android shell user on an authorized connected device. Exploitation 
  requires a valid UFO_MCP_API_KEY, adb on the host, and a reachable authorized 
  device, and it does not establish host operating-system execution, Android 
  root execution, or access beyond the Android shell-user privileges. This issue
  is fixed in version 3.0.9.
