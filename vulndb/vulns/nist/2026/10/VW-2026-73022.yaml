title: The Photo Reviews for WooCommerce plugin for WordPress is vulnerable to 
  Stored DOM-Based Cross-Site Scripting via the 'wcpr_image_upload_id' parameter
  in all versions up to, and including, 1.2.30 due to insufficient input 
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. The publicly-emitted `wcpr_image_upload` 
  nonce printed on every product review form is the only gate, and no 
  capability, authentication, or attachment ownership check is performed, 
  allowing the payload to be stored in comment meta — which is not subject to 
  `wp_kses` — by any unauthenticated visitor; the XSS fires once the review is 
  visible on the frontend.
