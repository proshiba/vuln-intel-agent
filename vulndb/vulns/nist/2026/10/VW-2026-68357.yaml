title: Uncontrolled recursion in the Gosub browser engine (gosub-engine) through
  0.1.0 and main before commit 46868b3 allows a remote attacker to cause a 
  Denial of Service (stack exhaustion and application crash) via an SVG document
  containing an excessive number of deeply nested elements. Because the engine 
  does not limit the nesting depth of processed SVG nodes, rendering such a 
  document overflows the thread stack and terminates the application. The 
  malicious SVG can be embedded through the SRC attribute of an IMG element, and
  thus exploitation only requires the victim to visit an attacker-controlled web
  page.
