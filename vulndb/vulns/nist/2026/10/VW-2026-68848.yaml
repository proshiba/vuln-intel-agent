title: "A remote, unauthenticated TLS client can make a server crash or call\nthrough
  a freed pointer if its sni_callback assigns a different context to\nSSLSocket.context
  (the documented way to select a certificate per server\nname) and nothing else keeps
  the original ssl.SSLContext alive. Typical\ncases are servers that create an SSLContext
  per connection or replace it\nwhile connections are open; servers that wrap their
  listening socket with\nit are not affected.\n\n\nMitigation: keep a reference to
  every SSLContext that sets sni_callback for\nthe lifetime of the server. TLS clients
  are not affected."
