title: The macOS version of the DigiD app is not signed with Hardened Runtime. 
  As a result, a local process can load its own dylib into DigiD via 
  DYLD_INSERT_LIBRARIES.  An attacker with local user-level code execution can 
  execute arbitrary code within the macOS version of the DigiD app, thereby 
  gaining access to DigiD data and cryptographic capabilities that the process 
  normally does not have. Reported by Kun Peeks (@SwayZGl1tZyyy)
