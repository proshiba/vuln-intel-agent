title: BotSharp through 5.2.0 contains an authentication bypass vulnerability 
  that allows unauthenticated remote attackers to forge bearer tokens using the 
  hard-coded Jwt:Key in WebStarter appsettings.json. Attackers can sign tokens 
  with the committed HMAC secret and fixed botsharp issuer and audience to 
  impersonate any known user, including administrators, on Authorize-protected 
  API routes.
