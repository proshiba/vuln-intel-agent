title: GPT-Load through 1.4.11 contains a cleartext logging vulnerability that 
  exposes client proxy keys because the Gin Logger middleware records the raw 
  query string before extractAuthKey strips the key parameter. Attackers with 
  read access to console logs or ./data/logs/app.log can recover proxy keys from
  Gemini-style requests and use them against the corresponding group.
