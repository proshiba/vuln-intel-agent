title: 'NetBox Device Type Library is a collection of community-sourced device type
  definitions for import into NetBox. Prior to commit f41fc1e, the CI workflow .github/workflows/validation.yml
  runs on pull_request and executes code supplied by the pull request before any maintainer
  review. Three PR-editable files drive this: "requirements.txt", ".pre-commit-hooks-config.yaml"
  / ".pre-commit-yamlfmt-config.yaml", and ".gitmodules". A contributor with no special
  repository access could open a pull request that modifies these files and have their
  code run on the CI runner. This issue has been patched via commit f41fc1e.'
