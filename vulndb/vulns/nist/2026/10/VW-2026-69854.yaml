title: A flaw was found in Dogtag PKI (pki-core). The CMCAuthForEST 
  authentication plugin fails open when an EST fullcmc enrollment request is 
  submitted via BasicAuth without an end-user TLS client certificate. The 
  SSL_CLIENT_CERT session attribute retains the EST subsystem's agent 
  certificate, which causes downstream authorization checks to treat the request
  as agent-privileged. An authenticated EST user can exploit this to obtain 
  CA-signed certificates with arbitrary subject names.
