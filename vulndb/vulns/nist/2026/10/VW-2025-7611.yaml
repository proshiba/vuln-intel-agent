title: "A vulnerability in the web UI of Cisco Desk Phone 9800 Series, Cisco IP Phone
  7800 and 8800 Series, and Cisco Video Phone 8875 running Cisco SIP Software could
  allow an unauthenticated, remote attacker to cause a DoS condition on an affected
  device.\r\n\r\nThis vulnerability is due to a buffer overflow when an affected device
  processes HTTP packets. An attacker could exploit this vulnerability by sending
  crafted HTTP input to the device. A successful exploit could allow the attacker
  to cause the device to reload, resulting in a DoS condition.\r\nNote: To exploit
  this vulnerability, the phone must be registered to Cisco Unified Communications
  Manager and have Web Access enabled. Web Access is disabled by default."
