title: "Symbolic name not mapping to correct object vulnerability in Apache Commons.\n\
  \n\n\nBCEL caches attacker-controlled classes under their self-declared names without
  validating the requested name, allowing subsequent lookups and name-keyed verification
  results to refer to a different class.\n\n\n\nThis issue affects Apache Commons:
  before 6.13.0.\n\n\n\nUsers are recommended to upgrade to version 6.13.0, which
  fixes the issue."
