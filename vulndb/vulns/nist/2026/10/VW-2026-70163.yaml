title: A vulnerability was identified in osCommerce osCommerce2 up to 2.3.4.1. 
  This affects the function include of the file includes/classes/payment.php of 
  the component Payment Page. Such manipulation of the argument 
  MODULE_PAYMENT_INSTALLED leads to code injection. The attack can be executed 
  remotely. The exploit is publicly available and might be used. The project was
  informed of the problem early through an issue report but has not responded 
  yet.
