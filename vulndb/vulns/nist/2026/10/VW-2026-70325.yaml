title: A flaw was found in Quay. A remote attacker could trick a user into 
  logging in through a crafted link, resulting in cross-site scripting (XSS). 
  Because the application does not validate the redirect destination before 
  navigating, this flaw allows the execution of arbitrary script in the context 
  of the victim's authenticated browser session. Successful exploitation 
  requires the target Quay deployment to use direct database authentication and 
  the victim to complete login through the malicious URL.
