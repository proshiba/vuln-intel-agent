title: OneUptime is a solution for monitoring and managing online services. 
  Prior to 10.0.23, the telemetry aggregation API accepts user-controlled 
  aggregationType, aggregateColumnName, and aggregationTimestampColumnName 
  parameters and interpolates them directly into ClickHouse SQL queries via the 
  .append() method (documented as "trusted SQL"). There is no allowlist, no 
  parameterized query binding, and no input validation. An authenticated user 
  can inject arbitrary SQL into ClickHouse, enabling full database read 
  (including telemetry data from all tenants), data modification, and potential 
  remote code execution via ClickHouse table functions. This vulnerability is 
  fixed in 10.0.23.
