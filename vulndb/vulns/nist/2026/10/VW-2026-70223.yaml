title: "DigitalCanion SA has discovered a vulnerability that allows remote attackers
  to execute arbitrary code on affected installations of the product. Authentication
  may be required to exploit this vulnerability.\n\n\n\n\nThe specific flaw exists
  within the Configuration → Services → Music on Hold functionality of the web portal
  listening on TCP port 443. The application is intended to allow users to upload
  WAV audio files but fails to properly validate the uploaded file type. An attacker
  can exploit this behavior to upload a malicious shared object (.so) instead of a
  WAV file. When the uploaded file is subsequently processed by the affected component,
  attacker-controlled code is loaded and executed in the context of the affected process.
  This can result in remote code execution and potentially full compromise of the
  underlying Linux system."
