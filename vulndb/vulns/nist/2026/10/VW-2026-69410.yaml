title: PictShare before 3.7.1 contains an information disclosure vulnerability 
  that allows unauthenticated attackers to obtain the secret delete_code and 
  uploader metadata by calling the API::info() endpoint which returns the 
  complete raw metadata object without a field whitelist. Attackers can use the 
  publicly visible file hash to retrieve the delete_code via the info API and 
  then invoke the delete API to permanently delete arbitrary files, while also 
  exposing uploader IP, User Agent, remote port, and SHA-1 hash, resulting in 
  loss of content integrity, availability, and uploader privacy.
