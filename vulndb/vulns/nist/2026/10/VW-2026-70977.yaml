title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix integer overflow in mr_check_range() leading to OOB access\n\nmr_check_range()
  validates that [iova, iova+length) falls within the\nregistered MR range using wraparound-prone
  arithmetic:\n\n    if (iova < mr->ibmr.iova ||\n        iova + length > mr->ibmr.iova
  + mr->ibmr.length)\n\nA remote peer can craft an RDMA-Write/Read RETH so that iova
  + length\nwraps to 0 (e.g. iova=0xfffffffffffffff8, length=8), bypassing the\ncheck.
  rxe_mr_iova_to_index() then computes a huge index (int idx, only\nguarded by WARN_ON)
  and rxe_mr_copy_xarray() dereferences\nmr->page_info[huge], causing an out-of-bounds
  read/write and a kernel\noops that is triggerable by an unauthenticated remote peer.\n\
  \nRewrite the check in overflow-safe form; the first two clauses guarantee\nthat
  the subsequent subtractions do not underflow:\n\n    if (iova < mr->ibmr.iova ||\n\
  \        length > mr->ibmr.length ||\n        iova - mr->ibmr.iova > mr->ibmr.length
  - le"
