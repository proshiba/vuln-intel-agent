title: Gitoxide gix-pack before 0.75.0 contains a denial of service 
  vulnerability that allows malicious remotes to crash fetch operations by 
  sending crafted thin-pack OFS_DELTA entries. Attackers can serve a thin pack 
  with a REF_DELTA referencing an existing object followed by an OFS_DELTA whose
  base_distance exceeds pack_offset, triggering a panic in 
  LookupRefDeltaObjectsIter that aborts the fetch process.
