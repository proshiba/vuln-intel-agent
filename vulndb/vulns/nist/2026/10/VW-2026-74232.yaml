title: A vulnerability was detected in KusalkaSilva Learning-Management-System 
  up to ffeb873f8803f1e9664384ff75000c7da45466d2. This impacts the function 
  mysql_query of the file remove_announcements.php of the component 
  State-Changing Endpoints. Performing a manipulation of the argument ID results
  in missing authentication. The attack may be initiated remotely. The exploit 
  is now public and may be used. This product uses a rolling release model to 
  deliver continuous updates. As a result, specific version information for 
  affected or updated releases is not available. The project was informed of the
  problem early through an issue report but has not responded yet.
