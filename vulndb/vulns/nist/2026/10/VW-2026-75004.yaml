  vulnerability that allows unauthenticated attackers to delete and rebuild 
  product search indexes by calling public es-test maintenance endpoints in 
  skyer-goods. Attackers can repeatedly request /v1/goods/sku/es-test to empty 
  the shared goods_sku_index_01 index for all tenants and force full-table 
  reloads, degrading search availability.
