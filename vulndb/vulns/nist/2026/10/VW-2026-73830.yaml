title: An **incorrect authorization** flaw has been found in **network interface
  handling** in the **Foreman** package. The domain and subnet interface API 
  checks only that the caller holds a host permission. It does not apply the 
  search limit on that permission, so the request is answered from every 
  interface on the domain or subnet. A low-privileged network attacker or user 
  must already be allowed to view some hosts and to view a domain or subnet 
  shared with other hosts. They can request that domain or subnet's interfaces. 
  The response includes interface records of hosts they are not allowed to view.
  If the attacker or user is also allowed to edit some hosts, they can submit a 
  change to one of those interfaces. The interface is then saved with that 
  change.
