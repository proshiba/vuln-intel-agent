title: 'Vulnerability in the Oracle VM VirtualBox product of Oracle Virtualization
  (component: Core).  Supported versions that are affected are 7.1.12 and  7.2.2.
  Easily exploitable vulnerability allows low privileged attacker with logon to the
  infrastructure where Oracle VM VirtualBox executes to compromise Oracle VM VirtualBox.  While
  the vulnerability is in Oracle VM VirtualBox, attacks may significantly impact additional
  products (scope change).  Successful attacks of this vulnerability can result in  unauthorized
  access to critical data or complete access to all Oracle VM VirtualBox accessible
  data. CVSS 3.1 Base Score 6.5 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N).'
