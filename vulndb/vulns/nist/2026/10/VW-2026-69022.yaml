title: BlueALSA (bluez-alsa/bluealsad) contains a division-by-zero vulnerability
  in the LC3plus sink decoder (a2dp-lc3plus.c, a2dp_lc3plus_dec_thread) that 
  allows a Bluetooth-adjacent attacker to crash the daemon by sending a crafted 
  RTP media header with an attacker-controlled frame count field set to zero. 
  Attackers can establish an A2DP source connection with an LC3plus session 
  negotiated against a victim running bluealsad as an A2DP sink and transmit a 
  non-fragmented LC3plus media header with a zero frame count to trigger a 
  SIGFPE in the decoding thread, causing a denial of service on builds compiled 
  with LC3plus support enabled.
