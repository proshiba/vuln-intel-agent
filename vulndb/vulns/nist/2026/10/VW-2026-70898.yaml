title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrop_monitor:
  use timer_shutdown_sync() to prevent timer rearming during teardown\n\nIn drop_monitor
  teardown paths (net_dm_trace_off_set(),\nnet_dm_hw_monitor_stop(), and error unwind
  paths in net_dm_trace_on_set()\nand net_dm_hw_monitor_start()), per-CPU timers are
  stopped using\ntimer_delete_sync() followed by cancel_work_sync().\n\nHowever, there
  is a circular dependency between send_timer and\ndm_alert_work:\n1) sched_send_work()
  (timer callback) schedules dm_alert_work.\n2) send_dm_alert() / net_dm_hw_summary_work()
  calls reset_per_cpu_data()\n   or net_dm_hw_reset_per_cpu_data().\n3) If memory
  allocation fails under memory pressure in the reset\n   function, it re-arms the
  timer via mod_timer(&data->send_timer, ...).\n\nIf dm_alert_work is running concurrently
  while timer_delete_sync()\nexecutes on another CPU, an allocation failure in the
  worker will\nre-arm the timer after timer_delete_sync() has already returned.\n\
  Once cancel"
