title: "Improper Handling of Unicode Encoding vulnerability in the SmtpPickupDirAppender
  of Apache log4net.\n\nContent that the mail file writer cannot encode, such as an
  unpaired UTF-16 surrogate, made the write throw. Every buffered event in the batch
  was discarded, not only the one carrying the content, and a truncated mail could
  be left in the pickup directory. A party whose data reaches a log message could
  suppress the records of other events. Only applications that use SmtpPickupDirAppender
  are affected.\n\nThis issue affects Apache log4net: from 1.2.9 before 3.5.0.\n\n\
  Users are recommended to upgrade to version 3.5.0, which fixes the issue."
