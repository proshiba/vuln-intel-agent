title: A flaw has been found in Ahsay AhsayCBS up to 10.3.2. This vulnerability 
  affects unknown code of the file /rps/api/json/UpdateReceivers.do of the 
  component Replication Receiver. Executing a manipulation of the argument 
  random can lead to os command injection. It is possible to launch the attack 
  remotely. The exploit has been published and may be used. Upgrading to version
  10.3.4 is able to resolve this issue. Upgrading the affected component is 
  advised.
