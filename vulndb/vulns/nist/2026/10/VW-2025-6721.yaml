title: vet is an open source software supply chain security tool. Versions 
  1.12.4 and below are vulnerable to a DNS rebinding attack due to lack of HTTP 
  Host and Origin header validation. Data from the vet scan sqlite3 database may
  be exposed to remote attackers when vet is used as an MCP server in SSE mode 
  with default ports through the sqlite3 query MCP tool. This issue is fixed in 
  version 1.12.5.
