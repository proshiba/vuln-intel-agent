title: A security flaw has been discovered in JeecgBoot up to 3.9.0. The 
  affected element is an unknown function of the file 
  jeecg-boot/jeecg-module-system/jeecg-system-biz/src/main/java/org/jeecg/modules/system/controller/SysTenantController.java
  of the component Multi-Tenant Management Module. Performing manipulation of 
  the argument ID results in improper authentication. The attack can be 
  initiated remotely. The exploit has been released to the public and may be 
  exploited. The patch is named 
  e1c8f00bf2a2e0edddbaa8119afe1dc92d9dc1d2/67795493bdc579e489d3ab12e52a1793c4f8a0ee.
  It is recommended to apply a patch to fix this issue.
