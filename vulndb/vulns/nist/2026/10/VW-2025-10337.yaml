title: A weakness has been identified in JeecgBoot up to 3.9.0. Affected by this
  vulnerability is the function getPositionUserList of the file 
  /sys/position/getPositionUserList. This manipulation of the argument 
  positionId causes improper authorization. The attack may be initiated 
  remotely. The complexity of an attack is rather high. The exploitation appears
  to be difficult. The exploit has been made available to the public and could 
  be exploited. The vendor was contacted early about this disclosure but did not
  respond in any way.
