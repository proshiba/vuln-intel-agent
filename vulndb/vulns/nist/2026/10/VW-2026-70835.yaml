title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  filemap: retain mapped dropbehind folios\n\nFault-around can map ready dropbehind
  folios without going through the\nnormal page-cache lookup that clears dropbehind.\
  \  A mapping represents a\ncompeting cached user, so retain the folio instead of
  forcibly unmapping\nit when writeback completes.\n\nFor a mapped folio, folio_unmap_invalidate()
  can call\nunmap_mapping_folio(), which takes i_mmap_rwsem and may sleep.  Retaining\n\
  mapped folios avoids this path when folio_end_dropbehind() runs in\nnon-preemptible
  task context.\n\nTal was able to trigger a sleeping-in-atomic warning due to this
  [1].\n\nUnmapped dropbehind folios continue through the existing invalidation path."
