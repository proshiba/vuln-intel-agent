title: Use of freed memory in the aggregation feature of MongoDB Server can 
  cause the server to read data from a memory area after it has been released. 
  When an internal aggregation stage is combined with a batch size of 0, the 
  server may read from memory that is no longer in use. Because that memory can 
  be reused for other data before it is read, query results returned to the 
  client may contain unrelated data from the server process. Depending on the 
  state of memory at the time, the server process may also terminate 
  unexpectedly. The behavior can occur when an authenticated user with read 
  privileges runs an aggregate command that combines these two settings.
