title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix reparse buffer bounds in cifs_query_reparse_point()\n\nIn cifs_query_reparse_point(),
  the start >= end check before casting to\nstruct reparse_data_buffer * only ensures
  the start pointer is within the\nresponse. It fails to verify that there is enough
  space remaining for the\nfixed 8-byte header of the structure.\n\nIf a server provides
  a DataOffset that leaves less than 8 bytes remaining,\nthe check passes, but subsequent
  reads of ReparseTag and ReparseDataLength\nwill occur out-of-bounds.\n\nFix this
  by ensuring the remaining space is at least the size of the\nreparse_data_buffer
  structure before accessing its fields."
