title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  Use managed KMS polling to fix UAF on unbind\n\nvc4_kms_load() calls drm_kms_helper_poll_init()
  but the driver provides\nno matching drm_kms_helper_poll_fini(). The output poll
  work stays\nscheduled after unbind and runs on the freed drm_device:\n\n  # modprobe
  vc4; rmmod vc4; sleep 10\n  BUG: KASAN: slab-use-after-free in delayed_work_timer_fn\n\
  \  BUG: KASAN: slab-use-after-free in drm_client_dev_hotplug [drm]\n  Workqueue:
  events output_poll_execute [drm_kms_helper]\n  Allocated by task 171: __devm_drm_dev_alloc\n\
  \  Freed by task 262 (rmmod): drm_dev_put / component_del\n\nUse drmm_kms_helper_poll_init()
  so polling is finalized with the device,\nas other drivers do."
