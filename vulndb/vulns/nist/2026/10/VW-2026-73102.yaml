title: "ExtUtils::Typemaps::STL::List versions before 1.07 for Perl allocate a 32
  GiB array on an empty list.\n\nThe OUTPUT typemaps call av_extend( av, len-1 ).
  On an empty list, this undeflows, and av_extend will allocate an array with 2^32
  slots, leading to memory exhaustion.\n\nNote that a similar issue was fixed in ExtUtils::Typemaps::STL::Vector
  version 1.05."
