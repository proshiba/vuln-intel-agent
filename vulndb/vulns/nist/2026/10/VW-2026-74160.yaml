title: ZITADEL 4.x before 4.19.2 and 3.x through 3.4.15 contains an 
  authentication bypass in the SAML identity-provider intent callback, which 
  verifies the assertion signature using the provider named in the request URL 
  but resolves the user from the login intent without checking they match. 
  Attackers with organization-administrator permission can register a SAML 
  provider with their own signing key to obtain authenticated sessions as any 
  user linked to another SAML provider on the instance, including in other 
  organizations.
