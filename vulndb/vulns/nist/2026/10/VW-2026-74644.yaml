title: 'A security flaw has been discovered in Polaris Office App 9.9.19 on Android.
  Affected by this vulnerability is the function com.infraware.service.m.n.a of the
  component Document Intake. The manipulation of the argument _display_name results
  in path traversal. The attack is only possible with local access. The exploit has
  been released to the public and may be used for attacks. Upgrading to version 9.9.22
  addresses this issue. It is recommended to upgrade the affected component. The vendor
  confirms: "We added path validation logic to ensure that files are created only
  within the designated temporary directory."'
