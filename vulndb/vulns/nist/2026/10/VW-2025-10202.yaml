title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetconsole:
  Acquire su_mutex before navigating configs hierarchy\n\nThere is a race between
  operations that iterate over the userdata\ncg_children list and concurrent add/remove
  of userdata items through\nconfigfs. The update_userdata() function iterates over
  the\nnt->userdata_group.cg_children list, and count_extradata_entries() also\niterates
  over this same list to count nodes.\n\nQuoting from Documentation/filesystems/configfs.rst:\n\
  > A subsystem can navigate the cg_children list and the ci_parent pointer\n> to
  see the tree created by the subsystem.  This can race with configfs'\n> management
  of the hierarchy, so configfs uses the subsystem mutex to\n> protect modifications.\
  \  Whenever a subsystem wants to navigate the\n> hierarchy, it must do so under
  the protection of the subsystem\n> mutex.\n\nWithout proper locking, if a userdata
  item is added or removed\nconcurrently while these functions are iterating, the
  list can be\naccessed"
