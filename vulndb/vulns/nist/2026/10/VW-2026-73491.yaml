title: Sylius through 2.3.0 contains an authorization bypass vulnerability that 
  allows unauthenticated attackers to read unmoderated and rejected product 
  reviews because the AcceptedExtension filter is not applied to the item 
  operation. Attackers can enumerate sequential ids on GET 
  /api/v2/shop/product-reviews/{id} to retrieve review titles, ratings, 
  comments, timestamps and author first names, bypassing merchant moderation.
