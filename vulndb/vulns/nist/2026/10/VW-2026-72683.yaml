title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  reject IDR error pointers when deleting actions\n\ntcf_action_delete() drops the
  reference held by its lookup before calling\ntcf_idr_delete_index() with the saved
  action index.  An unlocked\nclassifier can remove that action and reserve the same
  IDR slot with\nERR_PTR(-EBUSY) in between.\n\ntcf_idr_delete_index() only checks
  the lookup result for NULL.  It\ntherefore treats the reservation as a tc_action
  and dereferences\ntcfa_bindcnt.  A hardware execution breakpoint was used to schedule
  the\ninterleaving without changing the kernel source.  KASAN reported this\ndecoded
  trace:\n\n  BUG: KASAN: null-ptr-deref in tca_action_gd+0x5b9/0x1010\n  Read of
  size 4 at addr 0000000000000010 by task poc/150\n  Oops: general protection fault,
  probably for non-canonical address 0xdffffc0000000002\n  RIP: tca_action_gd+0x5c0/0x1010:\n\
  \    arch_atomic_read at arch/x86/include/asm/atomic.h:23\n    raw_atomic_read at
  include/linux/atomic/ato"
