title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  lan743x: fix RX checksum use-after-free\n\nlan743x_rx_process_buffer() adds each
  non-first receive buffer to the\nhead skb's frag_list.  On the last descriptor,
  lan743x_rx_trim_skb()\nlinearizes the head and frees the fragment skb metadata.\n\
  \nThe checksum-success path then writes ip_summed through the local skb\npointer,
  which still points to the final fragment.  This causes a\nuse-after-free write when
  a packet spans more than one receive buffer.\n\nSet ip_summed on the surviving head
  skb instead.  Multi-buffer receive\ncan occur after a live MTU increase because
  existing ring entries keep\ntheir old buffer size until they are replenished.\n\n\
  A KUnit test invoking lan743x_rx_process_buffer() with a two-buffer\npacket produced
  a one-byte KASAN use-after-free write before this change.\nThe same test passed
  after the change.  The driver object also builds\nwith W=1.  This was not tested
  on physical LAN743x hardware."
