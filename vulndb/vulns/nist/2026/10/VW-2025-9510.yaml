title: A vulnerability was detected in baowzh hfly up to 
  638ff9abe9078bc977c132b37acbe1900b63491c. The impacted element is an unknown 
  function of the file /Public/Kindeditor/php/upload_json.php. Performing 
  manipulation of the argument imgFile results in unrestricted upload. It is 
  possible to initiate the attack remotely. The exploit is now public and may be
  used. This product is using a rolling release to provide continious delivery. 
  Therefore, no version details for affected nor updated releases are available.
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
