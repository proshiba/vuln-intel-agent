title: ImageSharp is a 2D graphics library. From 2.0.0 until 4.1.2, 
  ExifReader.ReadValues64 trusts the 64-bit BigTIFF IFD entry count and iterates
  once per declared entry. When fewer than 20 bytes remain, 
  ExifReader.ReadValue64 returns without advancing the stream or terminating the
  outer loop, so a small malformed BigTIFF can keep one decoder thread executing
  for an attacker-controlled duration. This report does not claim worker-pool 
  exhaustion. This issue is fixed in version 4.1.2.
