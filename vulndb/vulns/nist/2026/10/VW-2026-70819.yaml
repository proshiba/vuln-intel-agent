title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  spi: reset bytes_xfered before retrying CRC failures\n\nmmc_spi_data_do() updates
  data->bytes_xfered after each block has been\ntransferred successfully.  If a later
  block in the same data request\nfails with a CRC error, data->bytes_xfered may therefore
  contain the\nnumber of bytes completed before the failing block.\n\nmmc_spi_request()
  has a private recovery path for such CRC failures.  It\nsends STOP_TRANSMISSION,
  clears data->error and jumps back to\ncrc_recover to issue the same command and
  data request again.  However,\nit does not clear data->bytes_xfered before the retry.\n\
  \nIf the retry succeeds, the request is completed with the bytes from the\nfailed
  attempt still included in data->bytes_xfered.  For a multi-block\nrequest this can
  make the completed request report more bytes than were\ntransferred by the successful
  retry, and can even exceed the request size\nwhen most blocks completed before the
  CRC error.\n\nThis is"
