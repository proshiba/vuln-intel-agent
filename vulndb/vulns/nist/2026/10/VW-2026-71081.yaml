title: Quasar Framework is a framework for building high-performance Vue.js user
  interfaces. Prior to 2.22.0, the SSR-only getHead() serializer in 
  ui/src/plugins/meta/Meta.js used getAttr() to interpolate values supplied 
  through useMeta() into title, meta, link, and script markup without HTML text 
  or quoted-attribute encoding. injectServerMeta() appended that output to the 
  raw server-rendered response. An attacker who can influence dynamic page 
  metadata, such as a post title, product name, excerpt, or display name, can 
  terminate the intended HTML context and inject executable markup before 
  hydration. The client-side apply() path is not affected because it uses DOM 
  APIs that encode attributes. This issue is fixed in version 2.22.0.
