title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ipu-bridge: Fix null pointer deref on SSDB/PLD parsing warnings\n\nWhen ipu_bridge_parse_rotation()
  and ipu_bridge_parse_orientation() run\nsensor->adev is not set yet.\n\nSo if either
  of the dev_warn() calls about unknown values are hit this\nwill lead to a NULL pointer
  deref.\n\nSet sensor->adev earlier, with a borrowed ref to avoid making unrolling\n\
  on errors harder, to fix this."
