title: A vulnerability was determined in geyang ml-logger up to 
  acf255bade5be6ad88d90735c8367b28cbe3a743. Affected is the function log_handler
  of the file ml_logger/server.py of the component Ping Handler. This 
  manipulation of the argument data causes deserialization. It is possible to 
  initiate the attack remotely. The exploit has been publicly disclosed and may 
  be utilized. This product is using a rolling release to provide continious 
  delivery. Therefore, no version details for affected nor updated releases are 
  available.
