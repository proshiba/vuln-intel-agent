title: jshERP through 3.6 contains an authorization bypass vulnerability that 
  allows authenticated users restricted to personal or department data to list 
  other users' bills by adding a purchaseStatus value. Attackers can include 
  purchaseStatus=0 in the search JSON on GET /depotHead/list, causing 
  DepotHeadService.select to drop the creator filter and expose all tenant 
  purchase, sales and inventory bills.
