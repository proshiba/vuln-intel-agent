title: "Improper Restriction of XML External Entity Reference in the XSLT support
  extension (camel-quarkus-support-xalan) in Apache Camel Quarkus from 3.2.0 before
  3.33.3 and from 3.34.0 before 3.40.0 on all platforms allows an attacker who supplies
  the XML document being transformed to read local files or issue requests to internal
  network locations via an external entity declaration in that document.\n\nThe extension
  supplies its own Xalan-backed TransformerFactory to the xslt component and registers
  it as the JAXP default. Xalan-J 2.7.x predates JAXP 1.5 and does not honour javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD
  or ACCESS_EXTERNAL_STYLESHEET, so the external access restrictions Apache Camel
  applies to the TransformerFactory it creates were not in effect. On the xslt component
  path this affects message bodies that reach the transformer already as a javax.xml.transform.Source;
  bodies of other types are converted to a SAXSource by Apache Camel with external
  entities and external DTD loading "
