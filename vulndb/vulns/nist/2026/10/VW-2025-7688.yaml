title: The Angular SSR is a server-rise rendering tool for Angular applications.
  The vulnerability is a Server-Side Request Forgery (SSRF) flaw within the URL 
  resolution mechanism of Angular's Server-Side Rendering package (@angular/ssr)
  before 19.2.18, 20.3.6, and 21.0.0-next.8. The function createRequestUrl uses 
  the native URL constructor. When an incoming request path (e.g., originalUrl 
  or url) begins with a double forward slash (//) or backslash (\\), the URL 
  constructor treats it as a schema-relative URL. This behavior overrides the 
  security-intended base URL (protocol, host, and port) supplied as the second 
