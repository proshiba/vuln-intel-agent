title: kkFileView v5.0.0 through v5.0.2 contains a directory traversal 
  vulnerability in FileController.java. The fileUpload, createFolder and 
  existsFile endpoints accept a "path" parameter that is concatenated into the 
  upload base path without validation, allowing unauthenticated attackers to 
  create arbitrary directories and write arbitrary files outside the intended 
  fileDir root via a crafted multipart request
