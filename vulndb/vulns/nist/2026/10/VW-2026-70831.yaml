title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Close the pre-enable ops error claim window\n\nscx_alloc_and_add_sched() publishes
  ops->priv before\nscx_root_enable_workfn() switches the state to SCX_ENABLING. An
  error\nclaimed via scx_bpf_error_bstr() from an associated BPF program in that\n\
  window is consumed by scx_disable_workfn(), which takes the pre-enable\nshortcut
  in scx_root_disable(). The shortcut returns without any teardown\nand restores SCX_DISABLED
  with an unconditional scx_set_enable_state() xchg\nracing the enable workfn's own
  transition. The enable then completes with\nthe claim consumed: the scheduler stays
  up but can never be disabled again,\nand bpf_scx_unreg() frees it while still in
  use, resulting in a\nuse-after-free. Both WARN_ON_ONCE()s fire back to back:\n\n\
  \  WARNING: kernel/sched/ext/ext.c:7522 at\n  scx_root_enable_workfn+0xeec/0x1be0,
  CPU#3: scx_enable_help/276\n\n  WARNING: kernel/sched/ext/ext.c:6398 at scx_root_disable+0xb50/0xdb8,\n\
  \  CPU#0"
