title: A security flaw has been discovered in LogicalDOC Community Edition up to
  9.2.1. This issue affects some unknown processing of the file /frontend.jsp of
  the component Add Contact Page. Performing manipulation of the argument First 
  Name/Last Name/Company/Address/Phone/Mobile results in cross site scripting. 
