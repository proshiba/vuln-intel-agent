title: Docling simplifies document processing by parsing diverse formats and 
  providing integrations with the generative AI ecosystem. From 2.94.0 until 
  2.132.0, callers that opt into LatexBackendOptions(tikz_engine="tectonic") 
  invoke docling/backend/latex/engines/tectonic.py to compile an untrusted TikZ 
  body and document preamble without restricting TeX file primitives including 
  \openin and \openout. Crafted input can read files available to the converter 
  and create or overwrite writable files, and enabling the 
  tikz_engine_allow_shell_escape option additionally permits shell commands 
  through TeX. The default configuration, which does not enable Tectonic 
  rendering, is not affected. This vulnerability is fixed in 2.132.0.
