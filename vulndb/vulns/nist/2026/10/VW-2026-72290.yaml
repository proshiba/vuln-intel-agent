title: The Image Photo Gallery Final Tiles Grid WordPress plugin before 3.6.14 
  does not properly verify authorization on several of its gallery and image 
  management actions, checking ownership against a different object than the one
  being acted on, or omitting the check entirely, allowing any authenticated 
  user with contributor-level access or above to clone, modify and reorder 
  galleries and images belonging to other users and to write Image Photo Gallery
  Final Tiles Grid WordPress plugin before 3.6.14 metadata onto arbitrary posts 
  they do not own.
