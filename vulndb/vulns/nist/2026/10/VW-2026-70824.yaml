title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  hsq: Fix use-after-free in retry work\n\nmmc_hsq_pump_requests() queues retry_work
  when request_atomic() returns\n-EBUSY; today sdhci-sprd is the only consumer that
  implements\nrequest_atomic(). The work is embedded in a devm-allocated mmc_hsq,
  but\nis never cancelled during driver removal. Work still pending at unbind\ncan
  therefore run after the devm allocation has been released and\ndereference hsq->mmc
  and hsq->mrq.\n\nUse devm_work_autocancel() to cancel and drain retry_work before
  the devm\nallocation is released. By the time devres cleanup begins,\nmmc_remove_host()
  has already stopped the host, so no new requests can\narm the work.\n\nThis issue
  was found by an in-house static analysis tool."
