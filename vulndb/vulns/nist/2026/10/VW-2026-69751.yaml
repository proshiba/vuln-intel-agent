title: "MISP contains a stored cross-site scripting (XSS) vulnerability in the index
  table rendering of the remote event preview. The count field template escaped the
  associated link URL but rendered the field value without HTML encoding. An attacker
  with the ability to create or modify events on a linked (remote) MISP server could
  craft an event identifier containing HTML or JavaScript markup. When a user on the
  local MISP instance views the remote event preview index, the unescaped value is
  rendered directly in the browser, allowing arbitrary script execution in the victim's
  session.\n\nPreconditions:\n\n- A linked/remote MISP server is configured and connected
  to the local instance.\n\n- The attacker has sufficient access on the linked server
  to create or modify an event with a crafted identifier.\n\n- A victim user on the
  local instance views the remote event preview index page.\n\nImpact:\n\n- Execution
  of arbitrary JavaScript in the context of the MISP web application.\n\n- Potential
  session hijacking"
