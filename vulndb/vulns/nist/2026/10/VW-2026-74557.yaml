title: A weakness has been identified in TensorLayer up to 2.2.4. This affects 
  the function load_hdf5_graph of the file tensorlayer/files/utils.py of the 
  component HDF5 Loading. Executing a manipulation of the argument model_config 
  can lead to deserialization. The attack can be executed remotely. The exploit 
  has been made available to the public and could be used for attacks. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
