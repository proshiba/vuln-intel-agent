title: Out-of-bounds Write (CWE-787) in the PEA archive extraction routine 
  (pea.pas, unpea_procedure) of the first-party pea component in PeaZip 11.2.0 
  and earlier allows an attacker who convinces a victim to open or extract a 
  crafted .pea archive to execute arbitrary code as the user running PeaZip. 
  While decompressing a PCOMPRESS1 stream, the 32-bit compressed-block-size 
  field of the first block (compsize) is read directly from the archive and used
  without validation as the length of a blockread into the fixed-size global 
  buffers wbuf1/wbuf2 (1,114,112 bytes) and as the bound of the subsequent copy 
  loop. The existing check "compsize > WBUFSIZE" is applied only to the size of 
  each following block, so the first block escapes it; the same unvalidated 
  value is also used to index wbuf1[compsize], an out-of-bounds read at an 
  attacker-chosen offset. The copy loop additionally copies the requested length
  instead of the number of bytes actually read, and terminates on equality 
  rather than on an uppe
