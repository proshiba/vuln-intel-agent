title: A vulnerability was detected in formtools.org Form Tools up to 3.1.1. 
  This issue affects the function Files::uploadFile of the file 
  global/code/actions.php of the component Ajax Handler. The manipulation 
  results in unrestricted upload. It is possible to launch the attack remotely. 
  The exploit is now public and may be used. The project was informed of the 
  problem early through an issue report but has not responded yet.
