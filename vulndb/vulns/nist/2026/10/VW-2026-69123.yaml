title: The Ad Inserter – Ad Manager & AdSense Ads plugin for WordPress is 
  vulnerable to Reflected Cross-Site Scripting via 's' Search Parameter in all 
  versions up to, and including, 2.8.18 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that execute if they can successfully 
  trick a user into performing an action such as clicking on a link. 
  Exploitation requires that a site administrator has configured at least one Ad
  Inserter block using the {title} or {short-title} placeholder with that block 
  enabled for search pages, which is a standard, documented plugin feature.
