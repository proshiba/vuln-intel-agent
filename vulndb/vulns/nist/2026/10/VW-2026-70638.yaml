title: "Insufficient verification of data authenticity (CWE-345) in the external OIDC
  login callback in Cloud Foundry UAA v4.5.0 to v79.6.0 (inclusive) allows an authenticated
  UAA user to bypass the OAuth authorization-code exchange and establish an authenticated
  external-OIDC browser session, via submitting a UAA access token or a cross-client
  ID token as the callback’s id_token parameter.\n\n\n\nThe issue only manifests when
  a UAA zone is configured with an OIDC identity provider whose issuer exactly matches
  that zone’s own /oauth/token endpoint (a “self-UAA” OIDC configuration). In this
  configuration, the callback takes a supplied id_token directly instead of requiring
  the authorization code exchange, and does not verify that the token was actually
  issued as an ID token for the specific self-OIDC relying-party client. An attacker
  holding any valid UAA JWT for themselves — including a plain access token with only
