title: An improper privilege management vulnerability (CWE-269) exists in the 
  command shell of Wind River VxWorks 7 when configured to enforce per-user 
  command privileges. Under certain shell operations, a command may be evaluated
  without the privilege check that is normally applied, allowing an 
  authenticated user with limited privileges to execute commands they are not 
  authorized to run. Successful exploitation can result in privilege escalation,
  with impact to the confidentiality, integrity, and availability of the 
  affected device. The issue affects all versions of VxWorks 7 prior to 26.09.  
  It has been fixed in 26.09.
