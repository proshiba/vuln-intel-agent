title: "Imager versions before 1.037 for Perl exit the process reading a raw image
  with an out-of-range raw_datachannels value in i_readraw_wiol.\n\nNothing range-checks
  raw_datachannels. The line buffer is sized as the image width times the channel
  count with no overflow check, so a negative or very large count requests an excessive
  allocation. When it fails, Imager's allocator calls exit(3).\n\nPassing an untrusted
  raw_datachannels value to Imager->read() triggers an uncatchable exit."
