title: Gophish through 0.12.1 contains an insecure direct object reference 
  vulnerability that allows authenticated users to take over other users' 
  groups, templates, landing pages and sending profiles. Attackers can supply 
  another user's sequential id in POST requests to /api/groups/, 
  /api/templates/, /api/pages/ or /api/smtp/ to overwrite and reassign objects, 
  locking out owners and exposing victims' recipient lists.
