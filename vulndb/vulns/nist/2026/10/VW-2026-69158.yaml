title: The Gutenberg Essential Blocks – Page Builder for Gutenberg Blocks & 
  Patterns plugin for WordPress is vulnerable to Stored Cross-Site Scripting via
  the Google Map block's 'marker' attribute in versions up to, and including, 
  6.4.5 This is due to insufficient input sanitization and output escaping on 
  marker title/content values, which are stored as JSON and then decoded and 
  concatenated directly into raw HTML by the frontend script's InfoWindow 
  content builder. This makes it possible for authenticated attackers, with 
  Contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page.
