title: The WPCafe – Restaurant Menu, Online Food Ordering & Table Booking System
  plugin for WordPress is vulnerable to Local File Inclusion in all versions up 
  to, and including, 3.0.18 via the (template scope) function. This makes it 
  possible for authenticated attackers, with contributor-level access and above,
  to include and execute arbitrary .php files on the server, allowing the 
  execution of any PHP code in those files. This can be used to bypass access 
  controls, obtain sensitive data, or achieve code execution in cases where .php
  file types can be uploaded and included.
