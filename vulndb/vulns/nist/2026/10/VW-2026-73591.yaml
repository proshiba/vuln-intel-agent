title: "The Bluetooth LE host queues received L2CAP connection-oriented channel (CoC)
  data for deferred processing through a struct k_work embedded in the channel object
  (le_chan->rx_work, handler l2cap_rx_process()) whenever the channel uses a dynamic
  PSM (0x0080-0x00FF). Channel teardown in l2cap_chan_destroy() in subsys/bluetooth/host/l2cap.c
  cancels the retransmission-timeout work and drains the RX FIFO, but never cancels
  rx_work. Because that work item was submitted to the system workqueue while HCI
  receive processing runs on the dedicated Bluetooth RX workqueue (CONFIG_BT_RECV_WORKQ_BT,
  the default), a queued rx_work item can outlive the channel it points into.\n\n\
  A remote, unauthenticated peer with an established CoC channel triggers this by
  sending a data K-frame immediately followed by an L2CAP Disconnect Request. The
  K-frame submits rx_work to the system workqueue; because both workqueue threads
