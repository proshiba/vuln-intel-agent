title: "Authentication bypass in sshd-core in Apache MINA SSHD versions 2.0.0 to 2.19.0
  and 3.0.0-M1 to 3.0.0-M5 for a certain (presumed rare) way to implement an SSH server.\n\
  \n\n\n\nApache MINA SSHD is a Java library for client- and server-side SSH. In the
  server part of the library, a mechanism to perform \"asynchronous authentication\"\
  \ exists. A server implemented with Apache MINA SSHD must contain explicit code
  to make use of this feature. The implementation of this feature was flawed and could
  potentially lead to skipping checking the signature in public-key or hostbased authentication,
  or returning a wrong result.\n\n\n\n\nUsers are recommended to upgrade to Apache
  MINA SSHD 2.20.0 or 3.0.0-M6, which fix the logic error and which additionally forbid
  the use of this \"asynchronous authentication\" mechanism with the public-key or
  hostbased authentication schemes: if used, the SSH session will be closed and the
  server will log an entry indicating that asynchronous authentication may be used
  only with p"
