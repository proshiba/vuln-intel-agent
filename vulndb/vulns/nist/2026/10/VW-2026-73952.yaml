title: LogicalDOC Community Edition through 9.3 contains a server-side request 
  forgery vulnerability in the default-enabled XMLConverter that fetches 
  xml-stylesheet href URLs without scheme or host allowlisting. Authenticated 
  users can upload XML documents whose stylesheet href points to internal http, 
  ftp, file, or jar URLs, forcing server requests and applying 
  attacker-controlled XSLT during conversion.
