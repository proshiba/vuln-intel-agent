title: ESF-IDF is the Espressif Internet of Things (IOT) Development Framework. 
  Prior to 5.2.8, 5.3.6, 5.5.5, 6.0.3, and 6.1-rc1, ESP-IDF BlueDroid L2CAP 
  configuration-option processing in l2c_main.c and l2c_utils.c does not 
  consistently validate option lengths against the remaining received packet 
  bytes. A remote unauthenticated BR/EDR peer within radio range can send a 
  malformed L2CAP configuration request that causes an out-of-bounds read, and 
  under some runtime conditions limited adjacent Bluetooth stack memory can be 
  included in an outbound L2CAP Configuration Response. The issue affects 
  ESP32-class products using the BlueDroid host stack with Classic Bluetooth 
  enabled. This issue is fixed in 5.2.8, 5.3.6, 5.5.5, 6.0.3, and 6.1-rc1.
