title: The Photo Reviews for WooCommerce plugin for WordPress is vulnerable to 
  Arbitrary Content Deletion in versions up to, and including, 1.2.30. This is 
  due to the plugin storing attacker-controlled post IDs from the 
  wcpr_image_upload_id parameter of a public review submission into the review's
  reviews-images comment meta without verifying that the IDs correspond to 
  attachments owned by the submitter, combined with the delete_reviews_image() 
  handler unconditionally calling wp_delete_post( $id, true ) on every stored ID
  when the review is deleted. This makes it possible for unauthenticated 
  attackers to permanently delete arbitrary posts, pages, products, or media 
  attachments on the site whenever an administrator subsequently deletes the 
  attacker's review (or when WordPress's built-in wp_scheduled_delete cron 
  empties the comment trash after 30 days).
