title: Velociraptor's WatchEvent gRPC API can specify the OrgId of the org from 
  which events should be streamed. The server checks the API permissions against
  the caller's Org instead of the requested Org. This allows a user with API 
  access in one org to read events from another org for which they have no 
  access.
