title: U-Boot before 2026.10-rc4 contains an integer overflow vulnerability in 
  sqfs_read_directory_table() function when allocating the directory table 
  buffer. Attackers can supply a crafted SquashFS image with an 
  attacker-controlled superblock metablks_count value that causes heap buffer 
  under-allocation and out-of-bounds writes, corrupting heap memory and crashing
  the bootloader.
