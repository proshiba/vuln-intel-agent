title: The WP JobHunt plugin for WordPress, used by the JobCareer theme, is 
  vulnerable to unauthorized modification of data due to a missing capability 
  check on the 'cs_update_application_status_callback' function in all versions 
  up to, and including, 7.7. This makes it possible for authenticated attackers,
  with Candidate-level access and above, to inject cross-site scripting into the
  'status' parameter of applied jobs for any user.
