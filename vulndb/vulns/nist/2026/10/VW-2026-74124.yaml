title: Network-AI (npm network-ai) before 5.15.2 contains an origin validation 
  error in McpSseServer._handleRequest in lib/mcp-transport-sse.ts that reflects
  localhost Origins into Access-Control-Allow-Origin regardless of bind 
  interface. When the server binds a non-loopback address, an attacker page with
  a localhost Origin visited by a victim can read unauthenticated endpoints like
  /health cross-origin.
