title: Excelize is a Go language library for reading and writing Microsoft Excel
  spreadsheets. From 2.3.1 to 2.11.0, extractPart allocates a byte slice 
  directly from an attacker-controlled CFB directory-entry size before 
  validating the sector chain or size domain. extractPart trusts the CFB 
  directory entry streamSize for EncryptionInfo and EncryptedPackage allocations
  before validating the stream. When a crafted OLE compound file declares a 
  negative or extremely large EncryptionInfo or EncryptedPackage stream size, 
  the declared size reaches make with a negative length or forces a 
  multi-gigabyte allocation, allowing an attacker to panic or exhaust process 
  memory. No fixed version is available as of this review.
