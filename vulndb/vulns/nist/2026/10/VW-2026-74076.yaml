title: Open WebUI from 0.11.0 before 0.11.4 contains an improper authorization 
  vulnerability in the chat fork handler, which places forked chats in the 
  source chat's folder without checking folder write access. Shared folder 
  members downgraded to read-only can call POST /api/v1/chats/{id}/fork on chats
  they created there while they had write access, inserting attacker-controlled 
  chats visible to the folder owner and members.
