title: Budibase is a low code platform for creating internal tools, workflows, 
  and admin panels. In versions from 3.30.6 and prior, the REST datasource query
  preview endpoint (POST /api/queries/preview) makes server-side HTTP requests 
  to any URL supplied by the user in fields.path with no validation. An 
  authenticated admin can reach internal services that are not exposed to the 
  internet — including cloud metadata endpoints (AWS/GCP/Azure), internal 
  databases, Kubernetes APIs, and other pods on the internal network. On GCP 
  this leads to OAuth2 token theft with cloud-platform scope (full GCP access). 
  On any deployment it enables full internal network enumeration. At time of 
  publication, there are no publicly available patches.
