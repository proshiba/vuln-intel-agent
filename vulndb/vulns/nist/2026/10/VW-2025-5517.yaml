title: SAP S/4HANA (Manage Processing Rules - For Bank Statements) allows an 
  authenticated attacker with basic privileges to delete conditions from any 
  shared rule of any user by tampering the request parameter. Due to missing 
  authorization check, the attacker can delete shared rule conditions that 
  should be restricted, compromising the integrity of the application without 
  affecting its confidentiality or availability.
