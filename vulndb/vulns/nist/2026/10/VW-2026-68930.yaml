title: An endpoint used during initial appliance setup did not require 
  authentication and did not correctly enforce its intended state precondition, 
  so during the initial activation window an unauthenticated network attacker 
  could repeatedly re-trigger the privileged activation process. This could 
  disrupt setup and leave the appliance in an incompletely configured state. The
  issue is only reachable while an appliance is being activated for the first 
  time and not yet fully configured.
