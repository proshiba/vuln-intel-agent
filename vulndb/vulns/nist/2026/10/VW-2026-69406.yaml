title: figlet.js is a FIG driver written in JavaScript that aims to implement 
  the FIGfont specification. Prior to 1.11.3, text() and textSync() can enter an
  unbounded loop when whitespaceBreak is enabled and width is smaller than the 
  rendered width of a single FIGlet character. Under these conditions, 
  breakWord() cannot find a valid break point and returns without consuming a 
  character, so generateFigTextLines() repeatedly processes the same input while
  consuming CPU and growing memory. The non-default option and 
  attacker-controlled width must both reach an affected call. This issue is 
  fixed in version 1.11.3.
