title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  recheck intermediate backing files on mprotect()\n\nmprotect() can be used to bypass
  the SELinux checks that mmap() performs\nagainst the intermediate layers of a stacked
  filesystem.\n\nmmap() checks every backing layer as the request descends through
  the\nstack.  mprotect() only has the lowest backing file in vma->vm_file, so it\n\
  rechecks the top-level user and the lowest mounter, but skips the mounters\nof every
  layer in between.  With two nested overlayfs mounts and a policy\ndenying mounter_t
  -> middle_file_t:file { execute }, a direct\nmmap(PROT_EXEC) is denied:\n\n  avc:\
  \  denied  { execute } for  pid=71 comm=\"nested_exec\"\n    path=\"/payload\" dev=\"\
  overlay\" ino=9\n    scontext=user_u:base_r:mounter_t\n    tcontext=user_u:object_r:middle_file_t
  tclass=file permissive=0\n\nwhile mmap(PROT_NONE) followed by mprotect(PROT_EXEC)
  succeeds.\n\nPreserve each intermediate path, mounter SID and file-description SID
  in\nthe backing-fi"
