title: A security flaw has been discovered in conductor-oss conductor up to 
  3.33.0-rc10. This affects the function KafkaPublishTask.start of the file 
  kafka/src/main/java/com/netflix/conductor/contribs/tasks/kafka/KafkaPublishTask.java.
  The manipulation of the argument kafka_request.bootStrapServers results in 
  server-side request forgery. The attack can be executed remotely. The exploit 
  has been released to the public and may be used for attacks.
