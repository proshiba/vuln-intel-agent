title: A vulnerability has been found in SohuTV CacheCloud up to 3.2.0. This 
  affects the function taskQueueList of the file 
  src/main/java/com/sohu/cache/web/controller/TaskController.java. Such 
  manipulation leads to cross site scripting. The attack may be performed from 
  remote. The exploit has been disclosed to the public and may be used. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
