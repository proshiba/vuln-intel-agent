title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  libipw: reject too-short beacon and probe responses\n\nlibipw_process_probe_response()
  and the libipw_network_init() call it\nmakes assume the frame contains the full
  36-byte beacon and probe\nresponse prefix, but the ipw2100 and ipw2200 receive paths
  only\nestablish that a management frame carries the generic 24-byte\nthree-address
  header.\n\nlibipw_network_init() then computes the information element length as\n\
  \n\tstats->len - sizeof(*beacon)\n\nstats->len is a u16 and sizeof() has type size_t,
  so the subtraction is\nevaluated as size_t and wraps instead of going negative.\
  \  Truncating\nthat to the u16 length parameter of libipw_parse_info_param() yields\n\
  65524 for a 24-byte beacon, and the parser then walks the receive\nbuffer as if
  it held almost 64 KiB of information elements, reading\npast the allocation.\n\n\
  Reject the frame before any fixed field is touched.\n\nFound by an AI-assisted review
  of length arithmetic in management "
