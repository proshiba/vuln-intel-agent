title: OneUptime is a solution for monitoring and managing online services. 
  Prior to 10.0.21, a low‑privileged user can bypass authorization and tenant 
  isolation in OneUptime v10.0.20 and earlier by sending a forged 
  is-multi-tenant-query header together with a controlled projectid header. 
  Because the server trusts this client-supplied header, internal permission 
  checks in BasePermission are skipped and tenant scoping is disabled. This 
  allows attackers to access project data belonging to other tenants, read 
  sensitive User fields via nested relations, leak plaintext resetPasswordToken,
  and reset the victim’s password and fully take over the account. This results 
  in cross‑tenant data exposure and full account takeover. This vulnerability is
  fixed in 10.0.21.
