title: Dovecot has provided a script to use for attachment to text conversion. 
  This script unsafely handles zip-style attachments. Attacker can use specially
  crafted OOXML documents to cause unintended files on the system to be indexed 
  and subsequently ending up in FTS indexes. Do not use the provided script, 
  instead, use something else like FTS tika. No publicly available exploits are 
  known.
