title: ALTCHA is privacy-first software for captcha and bot protection. A 
  cryptographic semantic binding flaw in ALTCHA libraries allows challenge 
  payload splicing, which may enable replay attacks. The HMAC signature does not
  unambiguously bind challenge parameters to the nonce, allowing an attacker to 
  reinterpret a valid proof-of-work submission with a modified expiration value.
  This may allow previously solved challenges to be reused beyond their intended
  lifetime, depending on server-side replay handling and deployment assumptions.
  The vulnerability primarily impacts abuse-prevention mechanisms such as rate 
  limiting and bot mitigation. It does not directly affect data confidentiality 
  or integrity. This issue has been addressed by enforcing explicit semantic 
  separation between challenge parameters and the nonce during HMAC computation.
  Users are advised to upgrade to patched versions, which include version 1.0.0 
  of the altcha Golang package, version 1.0.0 of the altcha Rubygem, version 
  1.0.
