title: FreeRDP 3.29.0 before 3.32.0 contains a double free in the client's 
  async-update message proxy, which shallow-copies the parser-owned PolygonSC or
  PolygonCB points array when numPoints is zero, so both the queue consumer and 
  parser cleanup free it. A malicious RDP server can send a point-bearing 
  polygon order followed by a zero-point order to crash a client with 
  +async-update enabled.
