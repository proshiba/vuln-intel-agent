title: A weakness has been identified in OS4ED openSIS-Classic up to 9.3. This 
  impacts the function DBQuery of the file functions/GetStuListFnc.php of the 
  component Student List Search Endpoint. This manipulation of the argument 
  LO_sort causes sql injection. The attack can be initiated remotely. The 
  exploit has been made available to the public and could be used for attacks. 
  The project was informed of the problem early through an issue report but has 
  not responded yet.
