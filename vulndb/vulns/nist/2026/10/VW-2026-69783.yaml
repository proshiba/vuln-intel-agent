title: "A code execution issue in the Java integration in Apache OpenOffice v4.1.16
  and earlier allows a crafted untrusted document to trigger executing arbitrary (even
  remote) code when opened by the user.\n\n\n\nThis issue is expected to be fixed
  in version 4.1.17, which is in the release candidate phase.\n\n\n\nUntil then, users
  can mitigate this issue by disabling Java runtime integration in the Preferences
  dialog. This prevents the attack. If this is not possible, or as an extra precaution,
  you can avoid opening open untrusted files entirely. Once 4.1.17 is released, upgrade
  to that version to fix the issue."
