title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (pmbus/core) increase number of phases and add new mask\n\nIncrease the number of
  phases to 16 as a new upcoming device supports\nsuch a number.\n\nWhile at it, add
  a new mask for controlling the source of the output\nvoltage.\n\nNote (groeck):\n\
  \nThis patch was meant to prepare for support of MAX20826 and compatible\ndevices,
  which support more than 10 phases per page. However, Sashiko\nreports that the mp2975
  driver already supports up to 14 phases, and the\nmp2856 driver supports up to 12
  phases. This already has the potential for\nout-of-bounds writes when probing the
  affected chips, making this patch a\nbug fix."
