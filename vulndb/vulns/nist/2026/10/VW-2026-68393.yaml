title: "The Connections Business Directory WordPress plugin through 10.4.67 does not
  apply its visibility and moderation-status restrictions on certain REST API read
  endpoints, allowing unauthenticated attackers to retrieve directory entries that
  are marked private or unlisted, or that are still pending moderation, including
  entry names, organizations, biographies, internal notes and street addresses.\n\
  The Connections Business Directory WordPress plugin through 10.4.67 has been closed
  on WordPress.org and no fixed version is available, so site owners should remove
  it or restrict unauthenticated access to its REST API routes."
