title: The Advanced IP Blocker plugin for WordPress is vulnerable to 
  Authentication Bypass in all versions up to, and including, 8.13.13 The 
  vulnerability exists because `handle_login_action()` performs no server-side 
  check — via transient, session marker, or equivalent — that a requester 
  completed step-1 password authentication before processing a step-2 TOTP 
  submission for the POSTed `user_id`; compounding this, an error branch in the 
  function unconditionally mints a fresh `advaipbl-2fa-interim-{user_id}` nonce 
  and delivers it in a `Location` header to any unauthenticated caller, after 
  which `display_2fa_login_form_step_2()` renders a valid 
  `advaipbl-2fa-verify-{user_id}` nonce in HTML — both nonces computed against a
