title: ZITADEL 3.0.0 before 4.19.2 contains a privilege escalation vulnerability
  in OIDC token exchange that allows end-user impersonators to impersonate 
  administrators including IAM_OWNER by bypassing the admin.impersonation check.
  Attackers holding IAM_END_USER_IMPERSONATOR or ORG_END_USER_IMPERSONATOR roles
  can sign in to relying applications as administrators with their roles and 
  claims.
