title: "Apache YuniKorn 1.9.0 and earlier does not implement label and user annotation
  checks for workload UPDATE action bypassing all checks. Workloads in YuniKorn are
  defined as the following Kubernetes objects: \"deployments\", \"replicasets\", \"\
  statefulsets\", \"daemonsets\", \"jobs\", \"cronjobs\". The CREATE action correctly
  enforces the checks for all object types.\n\n\nThe bypass allows any user to specify
  an arbitrary user info annotation. The same bypass also allows changing the application
  ID for the workload. The combination of the two applied in one UPDATE could allow
  access to a queue that the user normally would not have access to. Quota usage for
  the queue might be impacted if the application runs in the incorrect queue. User
  based quota enforcement is also based on the user annotation. User quota tracking
  could be side stepped even if the application runs in the correct queue.\n\n\n\n\
  \nUsers are recommended to upgrade to version 1.10.0, which fixes this issue."
