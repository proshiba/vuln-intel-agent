title: FreeRDP 3.0.0 before 3.32.0 contains a heap out-of-bounds read in the 
  WinPR clipboard function convert_filedescriptors_to_file_list(), which scans a
  server-controlled FILEDESCRIPTORW cFileName with unbounded _wcschr() and 
  count_special_chars() calls without a NUL-termination guarantee. A malicious 
  RDP server can send an odd-length FILEDESCRIPTORW blob in a 
  CB_FORMAT_DATA_RESPONSE, crashing X11, Wayland, and SDL clients when the user 
  pastes server-copied files.
