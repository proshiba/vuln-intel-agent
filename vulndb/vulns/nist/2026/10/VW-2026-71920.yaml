title: Excelize is a Go language library for reading and writing Microsoft Excel
  spreadsheets. From 2.1.0 to 2.11.0, Rows.Columns accepts a look-ahead row 
  number above TotalRows without applying the limit enforced by Rows.Next. 
  File.GetRows relies on Rows.Next and Rows.Columns, but Rows.Columns consumes 
  the row r attribute without the limit check in Rows.Next. When a crafted 
  worksheet places an oversized row number after an ordinary valid row and the 
  application calls GetRows or iterates Rows, the iterator advances through 
  every missing row number instead of rejecting the workbook, allowing an 
  attacker to consume a CPU core for an attacker-controlled duration. No fixed 
  version is available as of this review.
