title: In Eclipse BaSyx AAS Web UI versions v2-241220 through releases before 
  v2-260924, the shared request handler attached the selected infrastructure's 
  `Authorization` header to outgoing requests without checking the destination 
  origin. In deployments using authentication, an attacker could induce a user 
  to open a crafted Web UI link whose `aas` or `path` query parameter points to 
  an attacker-controlled endpoint. The user's browser would then send the 
  configured Basic Authentication credentials, Bearer token, or an available 
  OAuth2 access token to that endpoint. The attacker could reuse the disclosed 
  credential to access protected AAS services with the victim's privileges. The 
  issue is fixed in v2-260924.
