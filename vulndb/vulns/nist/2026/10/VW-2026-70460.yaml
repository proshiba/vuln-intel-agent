title: Ghost is a Node.js content management system. From 2.1.0 until 6.64.0, 
  embedding a URL from an attacker-controlled website could result in untrusted 
  scripts being stored in post content. These scripts could run in the Ghost 
  editor, on the published site, and in newsletter emails, possibly resulting in
  compromise of a staff user's admin session. This issue is fixed in version 
  6.64.0.
