title: mppx-condition-gate provides conditional free-access wrappers for mppx 
  payment methods. Prior to @insumermodel/mppx-condition-gate 3.0.0 and 
  @insumermodel/mppx-token-gate 1.0.4, the packages read a wallet address from 
  the client-supplied credential.source, checked whether that public address met
  configured on-chain conditions, and returned a successful free-access receipt 
  without invoking the wrapped payment verifier or proving that the caller 
  controlled the wallet. An unauthenticated attacker could name any qualifying 
  wallet and obtain content that should require payment, and cached grants could
  be reused for the configured cache lifetime. The corrected packages prevent 
  free-access authorization unless payer control has been established. These 
  issues are fixed in @insumermodel/mppx-condition-gate 3.0.0 and 
  @insumermodel/mppx-token-gate 1.0.4.
