title: OpenPrinting CUPS before 2.4.20 contains a NULL pointer dereference in 
  cupsdCheckJobs() when a job marked job-held-on-create refers to a temporary 
  printer that has been automatically deleted. Temporary-printer cleanup can 
  remove the destination without canceling its held jobs, and the scheduler 
  dereferences the NULL result of cupsdFindDest() while checking 
  holding_new_jobs. This terminates cupsd and interrupts all queues managed by 
  that process. In some plausible scenarios, an unprivileged submission can 
  trigger this.
