title: A stack-based buffer overflow vulnerability exists in the SNMP daemon 
  request handling of Brocade Fabric versions before 10.0.1. When processing an 
  incoming SNMPv3 packet, an internal statistics gathering handler copies 
  user-supplied context name data into a fixed-size buffer without properly 
  validating the length of the string. A remote, unauthenticated attacker (under
  default configuration) can exploit this vulnerability by sending a specially 
  crafted SNMPv3 packet, leading to memory corruption, daemon crash (Denial of 
  Service), or potential arbitrary code execution.
