title: A vulnerability was determined in SamuNatsu HaloBot up to 
  026b01d4a896d93eaaf9d5163a287dc9f267515b. Affected is the function 
  html_renderer of the file plugins/html_renderer/index.js of the component 
  Inter-plugin API. Executing manipulation of the argument action can lead to 
  dynamically-managed code resources. The attack can be launched remotely. The 
  exploit has been publicly disclosed and may be utilized. This product does not
  use versioning. This is why information about affected and unaffected releases
  are unavailable. The vendor was contacted early about this disclosure but did 
  not respond in any way. This vulnerability only affects products that are no 
  longer supported by the maintainer.
