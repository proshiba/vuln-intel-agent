title: 'A flaw has been found in Linux Mint Xreader up to 4.6.5. This issue affects
  the function setup_document_content_list/g_strdup_printf of the file backend/epub/epub-document.c
  of the component EPUB File Handler. This manipulation causes path traversal. The
  attack is possible to be carried out remotely. The exploit has been published and
  may be used. Upgrading to version 4.6.6 is capable of addressing this issue. Patch
  name: a5aecea074e8564b7a22f1ce054b31ec862974b7. It is advisable to upgrade the affected
  component. One of the project maintainers explains, that "EPUB support was removed
  from Xreader and reimplemented in Xepub".'
