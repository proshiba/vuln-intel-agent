title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/erdma:
  Use IRQ-safe XArray helpers for QP and CQ tables\n\nLocked QP and CQ lookups from
  EQ interrupts can deadlock with\ncreate-path XArray updates. If an interrupt arrives
  while the create\npath holds the plain xa_lock, the lookup spins forever trying
  to\nacquire the same lock.\n\nUse IRQ-safe XArray helpers for all QP and CQ create-path
  updates,\nincluding the GSI QP store and error paths. Initialize both arrays with\n\
  XA_FLAGS_LOCK_IRQ so sleeping allocations preserve interrupt state."
