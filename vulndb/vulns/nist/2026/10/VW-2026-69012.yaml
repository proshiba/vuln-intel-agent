  affected element is the function fetch of the file 
  src/shared/utils/ssrfGuard.js of the component Search Endpoint. Performing a 
  manipulation of the argument provider_options.baseUrl results in server-side 
  request forgery. The attack can be initiated remotely. Applying a patch is the
  recommended action to fix this issue.
