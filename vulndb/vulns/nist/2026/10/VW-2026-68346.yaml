title: AiSOC versions 9.0.0 before 12.0.0 fail to enforce authentication on the 
  response-action API endpoints when AISOC_DEV_MODE is enabled and 
  AISOC_ACTIONS_SERVICE_TOKEN is empty in the default Docker Compose deployment.
  Unauthenticated attackers can list response-action integrations, submit and 
  approve actions on behalf of arbitrary principals, and dispatch containment 
  actions using vendor credentials.
