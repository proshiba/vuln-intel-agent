title: With `[repository] FORCE_PRIVATE = true`, Gitea creates new repositories 
  as private, but the post-receive hook still applied the `repo.private=false` 
  push option to an empty repository created by push. Any user who can create 
  repositories could make their new repository public in violation of the 
  instance policy. The default configuration is not affected.
