title: Rapyd Admin from 9.0.0 before 9.20.0 contains an improper privilege 
  management vulnerability in the UsersEdit Livewire component that allows users
  with the edit users permission to assign themselves the admin role. Attackers 
  holding roles such as the shipped operator role can submit the admin role ID 
  for their own account, lifting tenant scoping, bypassing per-record 
  authorization, and enabling impersonation.
