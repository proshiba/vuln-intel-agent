title: Wazuh from 4.0.0 before 4.14.8 contains a race condition in API login 
  throttling that allows unauthenticated attackers to bypass max_login_attempts 
  by sending concurrent requests. Attackers can fire concurrent login bursts to 
  the authenticate and run_as endpoints, each passing the block check before 
  failures are counted, enabling unlimited password guessing.
