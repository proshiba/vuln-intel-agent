title: Newforma Info Exchange (NIX) '/UserWeb/Common/MarkupServices.ashx' 
  'StreamStampImage' accepts an encrypted file path and returns an image of the 
  specified file. An authenticated attacker can read arbitrary files subject to 
  the privileges of NIX, typically 'NT AUTHORITY\NetworkService', and the 
  ability of StreamStampImage to process the file. The encrypted file path can 
  be generated using the shared, hard-coded secret key described in 
  CVE-2025-35052. This vulnerability cannot be exploited as an 'anonymous' user 
  as described in CVE-2025-35062.
