title: Snipe-IT versions prior to 8.3.7 contain sensitive user attributes 
  related to account privileges that are insufficiently protected against mass 
  assignment. An authenticated, low-privileged user can craft a malicious API 
  request to modify restricted fields of another user account, including the 
  Super Admin account. By changing the email address of the Super Admin and 
  triggering a password reset, an attacker can fully take over the Super Admin 
  account, resulting in complete administrative control of the Snipe-IT 
  instance.
