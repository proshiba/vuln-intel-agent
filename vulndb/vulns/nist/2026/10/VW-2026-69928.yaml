title: The SEOPress – AI SEO Plugin & On-site SEO plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via the 
  'seopress_google_analytics_matomo_id' parameter in all versions up to, and 
  including, 10.2 due to insufficient input sanitization and output escaping. 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page. This requires an administrator to 
  have delegated the Analytics management capability to the Subscriber role via 
  the plugin's Advanced > Security settings.
