title: Incorrect permission assignment in GlavSoft TightVNC Server for Windows 
  before 2.8.88 allows a local authenticated user to read or overwrite the 
  inter-process communication handles used between the TightVNC service and its 
  desktop server process. The named shared memory segment in the Global\ 
  namespace that carries the pipe HANDLE values is created with a NULL DACL, and
  its name is derived from a time-seeded srand(time(0)) value that is 
  predictable to one-second granularity. A low-privileged local process can open
  the mapping and tamper with the IPC channel of a service running as SYSTEM, 
  potentially leading to disclosure of session data, privilege escalation, or 
  denial of service.
