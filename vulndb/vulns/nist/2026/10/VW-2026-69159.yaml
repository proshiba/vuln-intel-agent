title: A flaw was found in oc-mirror. During mirroring operations, the embedded 
  local cache registry binds to all network interfaces without authentication or
  encryption instead of restricting access to the local system. An 
  unauthenticated attacker on an adjacent network can connect to the exposed 
  service to push tampered container images, delete cached images, or access 
  mirrored content.
