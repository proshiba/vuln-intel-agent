title: An OS command injection vulnerability exists in the account management 
  subsystem of Brocade Fabric OS versions before 9.2.2d and 10.0.0 through 
  10.0.0a1. When an administrator initiates an account deletion, the system 
  invokes an internal maintenance routine to clean up cryptographic keys 
  associated with the target account. Malformed account names previously 
  accepted by Fabric OS can cause the execution of embedded shell 
  metacharacters, triggering command injection.
