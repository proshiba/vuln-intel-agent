title: The NS IE Compatibility Fixer plugin for WordPress is vulnerable to 
  Cross-Site Request Forgery (CSRF) in all versions up to, and including, 2.1.5.
  This is due to missing nonce validation on the settings update functionality. 
  This makes it possible for unauthenticated attackers to modify the plugin's 
  settings via a forged request granted they can trick an administrator into 
  performing an action such as clicking on a link.
