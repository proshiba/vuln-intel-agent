title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: validate scan response extents\n\nmwifiex_ret_802_11_scan() subtracts the
  fixed response fields and the\nfirmware-provided BSS length from resp->size without
  first proving that\neither extent fits. A short response or oversized BSS length
  can\ntherefore underflow tlv_buf_size and make the TLV parser walk beyond the\n\
  command response.\n\nCompute the fixed extent from the selected normal or background
  scan\nresponse. Validate that the fixed fields and BSS data fit before deriving\n\
  the TLV extent and entering the parser."
