title: The IDonate – Blood Donation, Request And Donor Management System plugin 
  for WordPress is vulnerable to Insecure Direct Object Reference via the 
  admin_post_donor_delete() function in versions 2.0.0 to 2.1.9. By supplying an
  arbitrary user_id parameter value to the wp_delete_user() function, 
  authenticated attackers, with Subscriber-level access and above could delete 
  arbitrary user accounts, including those of administrators.
