title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  lock the socket in sock_gettstamp()\n\nsk->sk_flags must only be changed while holding
  the socket lock,\nbecause sock_set_flag() and sock_reset_flag() use non atomic\n\
  operations (__set_bit() and __clear_bit()).\n\nsock_gettstamp() is one of the last
  places where a bit of sk->sk_flags\nis changed from a syscall without owning the
  socket lock, through\nsock_enable_timestamp(sk, SOCK_TIMESTAMP).\n\nsk_set_memalloc()
  and sk_clear_memalloc() also change sk->sk_flags\nwithout the socket lock, but their
  callers (nbd, iscsi_tcp, nvme-tcp,\nsunrpc, wireguard) need a careful audit, this
  will be addressed in a\nseparate patch.\n\nJungwoo Lee and Wongi Lee reported an
  UDP socket use-after-free\ncaused by this bug: a SIOCGSTAMPNS_NEW ioctl racing with
  bind()\ncan cancel the SOCK_RCU_FREE bit that udp_lib_get_port() just set,\nbecause
  both threads perform a read-modify-write on the same word.\n\n  CPU 0 (bind)   \
  \                     CPU 1 (SIOCGS"
