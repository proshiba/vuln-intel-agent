title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix next_buffer UAF and NextCommand bounds in compound PDUs\n\nFix several
  related bounds checking and pointer lifecycle issues in\nreceive_encrypted_standard()'s
  handling of compound encrypted frames:\n\n- Clear next_buffer after assigning it
  to server->bigbuf. A stale\n  next_buffer pointer can lead to a use-after-free on
  subsequent\n  error paths.\n- Update pdu_length to the decrypted plaintext size
  (buf_size). Using\n  the pre-decryption length allows NextCommand to point into
  stale\n  ciphertext residue.\n- Reject next_cmd values smaller than MID_HEADER_SIZE(server).\n\
  - Fix an integer overflow in the upper bound check by verifying\n  pdu_length -
  next_cmd < MID_HEADER_SIZE(server), ensuring the\n  trailing slice is large enough
  for a header."
