title: A heap-based buffer overflow flaw was found in rpm. RPMTAG_FILESIGNATURES
  in a crafted, unsigned RPM package's main header is declared with the wrong 
  header type, causing hex2binv() to allocate a one-byte buffer and then write 
  the tag's attacker-controlled, hex-decoded content — of attacker-chosen length
  — past the end of that allocation. This is reachable via rpm2cpio, 
  rpm2archive, and rpm -qlvp on an untrusted package.
