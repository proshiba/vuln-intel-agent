title: The SupportCandy – AI Customer Support Ticket System & Live Chatbot Agent
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via the 
  'name' parameter in all versions up to, and including, 3.5.3 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for authenticated attackers, with subscriber-level access and above, to inject
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. This exploit chain requires the 'Register user if not exists' 
  setting to be disabled, which is its default configuration.
