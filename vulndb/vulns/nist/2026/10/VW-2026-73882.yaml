title: 'A vulnerability was determined in agno-agi agno up to 3.0.9. Affected by this
  issue is the function agno.CodingTools.run_shell in the library libs/agno/agno/tools/coding.py
  of the component CodingTools. This manipulation of the argument command causes os
  command injection. The attack may be initiated remotely. The exploit has been publicly
  disclosed and may be utilized. Upgrading to version 3.0.10 can resolve this issue.
  Patch name: ed64fab5be63d2b15faddc2ef7c733176daa14aa. You should upgrade the affected
  component.'
