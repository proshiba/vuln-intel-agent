title: The Noo JobMonster theme for WordPress is vulnerable to Authentication 
  Bypass in all versions up to, and including, 4.8.1. This is due to the 
  check_login() function not properly verifying a user's identity prior to 
  successfully authenticating them  This makes it possible for unauthenticated 
  attackers to bypass standard authentication and access administrative user 
  accounts. Please note social login needs to be enabled in order for a site to 
  be impacted by this vulnerability.
