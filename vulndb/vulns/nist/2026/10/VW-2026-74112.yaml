title: The Grav API plugin (grav-plugin-api) before 1.0.36 contains an improper 
  session validation vulnerability that allows disabled accounts to keep API 
  access, because SessionAuthenticator does not enforce account state. Disabled 
  users can reuse an already authorized browser or remember-me session to call 
  API endpoints until expiry, defeating operator revocation.
