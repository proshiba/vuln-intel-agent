title: "TP-Link Tapo\nC325WB V2 generates the pre-shared key used by its local media
  streaming\nservice with a time-seeded pseudo-random number generator, making the
  key\npredictable and recoverable. An unauthenticated attacker on the adjacent\n\
  network can recover the key and authenticate to the media streaming service\nwithout
  valid user credentials. \n\n\n\n\n\n\n\n\n\nSuccessful\nexploitation may allow an
  unauthenticated adjacent-network attacker to access\nand take over live video and
  audio streams, compromising the confidentiality\nand integrity of camera media."
