title: Joomla Extension - joomlafry.com - Unauthenticated cross-record 
  publication and mass assignment in TF Content 2.9.0 - 2.9.4 - The extension 
  unconditionally authorizes both creation and editing in its public 
  `RecordController`. Its shared frontend save controller accepts the raw 
  `jform` array, assigns the request-selected existing record ID, and saves it 
  without filtering submitted properties through the configured form. A Guest 
  can obtain a valid token from Joomla's public login form and modify any TF 
  Content row, including mass-assigning `published`, `access`, and `created_by`.
