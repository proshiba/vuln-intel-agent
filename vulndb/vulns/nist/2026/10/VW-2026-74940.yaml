title: JupyterLab is an extensible environment for interactive and reproducible 
  computing, based on the Jupyter Notebook Architecture. From 4.5.7 until 4.5.11
  and 4.6.4, the markdownviewer:trust and notebook:trust command-link handlers 
  use tracker.currentWidget to resolve the current Markdown viewer or notebook 
  when the user answers rather than retaining the document whose command button 
  was clicked. If another document becomes current while the prompt is open and 
  the user chooses Trust, JupyterLab marks the second document trusted while 
  leaving the clicked document untrusted. Later command buttons in the 
  incorrectly trusted document run without a prompt, and trusting a notebook 
  marks all cells trusted, saves unsaved edits, and persists the server 
  signature to disk. Applications that bundle JupyterLab, including affected 
  Notebook and JupyterLite releases, inherit the behavior. This issue is fixed 
  in versions 4.5.11 and 4.6.4.
