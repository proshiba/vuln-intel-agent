title: A vulnerability has been found in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. Affected is an unknown function of 
  the file Admin/deleteclinic.php of the component Admin CRUD Endpoint. The 
  manipulation of the argument cid/did leads to sql injection. Remote 
  exploitation of the attack is possible. The exploit has been disclosed to the 
  public and may be used. This product follows a rolling release approach for 
  continuous delivery, so version details for affected or updated releases are 
  not provided. The project was informed of the problem early through an issue 
  report but has not responded yet.
