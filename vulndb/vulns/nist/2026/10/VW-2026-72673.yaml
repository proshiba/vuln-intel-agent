title: "The ITE IT8xxx2 SHI host-command backend (subsys/mgmt/ec_host_cmd/backends/ec_host_cmd_backend_shi_ite.c)
  copied the 8-byte host-command request header from the SPI Rx FIFO directly into
  the shared receive buffer data->in_msg and only afterwards checked the protocol
  version and the derived packet length. The interrupt handler also accepted a chip-select
  assertion and an Rx-valid-length (RVLI) interrupt in any driver state other than
  SHI_STATE_DISABLED, so a new header could be parsed while the host-command thread
  was still processing the previous request out of the very same buffer.\n\nThe host
  processor is the SPI controller and drives both chip select and the clock. After
  sending a well-formed request it can immediately de-assert chip select — which returns
