title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  RFCOMM: avoid socket lock inversion in listener cleanup\n\nrfcomm_sock_cleanup_listen()
  closes unaccepted child sockets through\nrfcomm_sock_close(), which takes the child
  socket lock before\nrfcomm_dlc_close() acquires rfcomm_mutex. The RFCOMM worker
  takes these\nlocks in reverse order while handling connections and DLC state changes,\n\
  so lockdep reports a possible deadlock.\n\nClose dequeued children without taking
  their socket lock. The accept queue\nowns a reference to each child, and bt_accept_dequeue()
  locks the child\nwhile unlinking it and clearing its parent pointer.\n\nDropping
  the child lock makes it important to prevent a concurrent\nrfcomm_connect_ind()
  from enqueueing a new child after cleanup observes an\nempty queue. Set a listening
  socket to BT_CLOSED while its lock is still\nheld, before dropping the lock and
  draining the queue. The state check in\nrfcomm_connect_ind() then rejects new children
  once clean"
