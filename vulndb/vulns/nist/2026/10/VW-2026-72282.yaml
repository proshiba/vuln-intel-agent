title: An OS command injection vulnerability exists in the PAM (Pluggable 
  Authentication Module) session cleanup routines during SSH session termination
  on Brocade Fabric OS versions before 9.2.2d and 10.0.0 through 10.0.0a1. An 
  authenticated user authenticating via an external directory or AAA service 
  whose username or profile identifier contains shell metacharacters can trigger
  arbitrary command execution with root privileges when their remote SSH session
  closes.
