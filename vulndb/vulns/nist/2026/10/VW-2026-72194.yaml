title: pac4j-jwt versions prior to 4.5.9, 5.7.9, and 6.3.3 contain an 
  authentication bypass vulnerability in JwtAuthenticator when processing 
  encrypted JWTs that allows remote attackers to forge authentication tokens. 
  Attackers who possess the server's RSA public key can create a JWE-wrapped 
  PlainJWT with arbitrary subject and role claims, bypassing signature 
  verification to authenticate as any user including administrators.
