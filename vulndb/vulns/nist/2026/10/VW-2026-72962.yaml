title: The FireBox – WooCommerce Popup Builder, Exit Intent Popup, Email Optin &
  Cart Abandonment plugin for WordPress is vulnerable to generic SQL Injection 
  via FireBox Form Display Condition in all versions up to, and including, 
  3.1.13 due to insufficient escaping on the user supplied parameter and lack of
  sufficient preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with author-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. On fresh installations of 
  version 3.1.10 and later, exploitation requires administrator-level access; 
  however, on sites upgraded from a version prior to 3.1.10, the 
  preserveCampaignRoleAccess() migration grants the edit_fireboxes capability to
  any role that previously held edit_posts, reducing the minimum required 
  privilege to Author-level.
