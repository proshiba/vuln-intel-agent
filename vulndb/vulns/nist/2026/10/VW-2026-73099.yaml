title: "Out-of-bounds read in the VarOpt union deserialization of Apache DataSketches
  C++ (repo: datasketches-cpp).\n\nvar_opt_union::deserialize() read the 32-byte preamble
  of a non-empty union after checking that only 8 bytes were available, so a truncated
  serialized union could cause a read of up to 24 bytes past the end of the input.
  For such inputs, the size remaining for the embedded sketch was also computed by
  an unsigned subtraction that could wrap around, so the embedded sketch's own size
  checks no longer limited reads to the input. The bytes read can become part of the
  deserialized union's state. This can cause a crash (denial of service) and could
  expose adjacent memory contents.\n\nThis issue affects Apache DataSketches C++:
  from 2.0.0-incubating before 5.3.0. Only applications that deserialize VarOpt unions
  from untrusted sources are affected.\n\nUsers are recommended to upgrade to version
  5.3.0, which fixes this issue."
