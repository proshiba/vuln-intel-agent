title: The Affinity by Canva application for macOS before 3.3.1 (October 2026 
  release) did not safely calculate the size of an image buffer when generating 
  QuickLook thumbnails and previews of Affinity document files, leading to an 
  integer overflow and a heap-based buffer overflow. A threat actor could craft 
  an Affinity document that, when displayed or previewed by a user in Finder, 
  could corrupt heap memory and cause the thumbnail or preview extension to 
  crash.
