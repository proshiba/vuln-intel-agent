title: The Anti-Spam by CleanTalk – Spam Protection Without CAPTCHA plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via the 'comment' 
  parameter in all versions up to, and including, 6.88 due to insufficient input
  sanitization and output escaping. This makes it possible for unauthenticated 
  attackers to inject arbitrary web scripts in pages that will execute whenever 
  a user accesses an injected page. This vulnerability is exploitable once a 
  comment from the attacker's email address has been approved; on default 
  WordPress installations, only the first comment from a given email address is 
  held for moderation, meaning subsequent comments auto-approve and immediately 
  expose the payload to site visitors.
