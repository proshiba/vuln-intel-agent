title: Jorani before 1.0.4 contains an insecure direct object reference 
  vulnerability that allows authenticated users to modify, delete, and view 
  other employees' requests by authorizing by operation name only. Attackers can
  supply numeric request ids to Leaves::edit(), Extra::edit(), Leaves::delete(),
  Extra::delete(), and Leaves::history() to tamper with colleagues' leave and 
  overtime requests and read leave history.
