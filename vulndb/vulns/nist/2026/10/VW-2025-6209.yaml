title: A vulnerability has been found in rawchen ecms up to 
  b59d7feaa9094234e8aa6c8c6b290621ca575ded. Affected by this vulnerability is 
  the function updateProductServlet of the file 
  src/servlet/product/updateProductServlet.java of the component Add New Product
  Page. The manipulation of the argument productName leads to cross site 
  scripting. Remote exploitation of the attack is possible. The exploit has been
  disclosed to the public and may be used. This product follows a rolling 
  release approach for continuous delivery, so version details for affected or 
  updated releases are not provided. The vendor was contacted early about this 
  disclosure but did not respond in any way.
