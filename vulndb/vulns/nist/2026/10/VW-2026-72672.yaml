title: "The LE Audio Broadcast Sink in subsys/bluetooth/audio/bap_broadcast_sink.c
  copies subgroup metadata from a received Basic Audio Announcement (BASE) into the
  static Broadcast Audio Scan Service parameter structure mod_src_param without any
  bounds check. In base_subgroup_meta_cb() the destination element was selected as
  mod_src_param.subgroups[mod_src_param.num_subgroups] with no test against ARRAY_SIZE(mod_src_param.subgroups)
  (sized by CONFIG_BT_BAP_BASS_MAX_SUBGROUPS, default 1), and the metadata was copied
  with memcpy() using the raw on-air length returned by bt_bap_base_get_subgroup_codec_meta()
  into a metadata array sized by CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE (default
  4). The BASE validator bt_bap_base_get_base_from_ad() only checks structural consistency
  and permits up to ~24 subgroups and metadata LTVs of ~240 octets.\n\nThe defect
  is reached from the periodic advertising receive callback: pa_recv() → bt_data_parse()
  → pa_decode_base() → update_recv_state_base() → bt_bap_b"
