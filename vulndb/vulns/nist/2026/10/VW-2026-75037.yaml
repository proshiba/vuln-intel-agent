title: A flaw was found in BusyBox's httpd web server. When configured with 
  system password authentication, a user existence oracle may exist in certain 
  build configurations. An attacker could distinguish existing from non-existing
  usernames by observing authentication failure behavior. Impact is limited to 
  username enumeration and requires non-default compile options or uncommon 
  password file states; default BusyBox builds with shadow password support are 
  not affected.
