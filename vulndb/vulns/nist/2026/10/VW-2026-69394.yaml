title: "Kasa EC70 v4\nand EC71 v4 do not logically disable the production debug interface
  at the\nfirmware or chip level and do not lock the bootloader.  Although the debug
  traces are physically\nsevered during manufacturing, an attacker with physical access
  can restore the\nconnection, interrupt the boot process, and manipulate boot parameters
  to enter\na non-standard initialization path that exposes an unauthenticated root
  shell\nduring startup.\n\n\n\n\n\n\n\n\n\nSuccessful exploitation may allow an\n\
  attacker with physical access to obtain root-level command access during device\n\
  startup, resulting in loss of confidentiality, integrity, and availability for\n\
  the affected device. Exploitation requires device disassembly, restoration of\n\
  the severed debug connection, and manipulation of the boot process."
