title: Encrypted WiFi and SSH credentials were found in the Ghost Robotics 
  Vision 60 v0.27.2 APK. This vulnerability allows an attacker to connect to the
  robot's WiFi and view all its data, as it runs on ROS 2 without default 
  authentication. In addition, the attacker can connect via SSH and gain full 
  control of the robot, which could cause physical damage to the robot itself or
  its environment.
