title: The Linux live-update apply helper (hmailserver-update) of Progressive 
  Robot hMailServer 6.3.4 and 6.3.5 runs as root on a request file written by 
  the unprivileged hmailserver service account, and took from that request the 
  program used to verify an AppImage update's signature and the systemd unit to 
  stop before reading the service account's files. An attacker who already runs 
  code as the hmailserver service account, for example through another flaw in 
  the mail server, can therefore have arbitrary code executed as root, on any 
  Linux installation where the live update's path unit is active - the default 
  for the project's .deb and .rpm packages - and on AppImage installations run 
  under that unit.
