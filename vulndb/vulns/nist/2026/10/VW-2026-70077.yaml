title: SiYuan before 3.8.5 contains an information disclosure vulnerability that
  allows publish-mode readers to learn backlink block IDs and reference counts 
  from password-protected and publish-disabled documents by querying a published
  document. Attackers can send POST requests to /api/block/getDocInfo or 
  getDocsInfo for a published document ID to obtain refIDs and refCount of 
  hidden referencing blocks, bypassing the publish confidentiality boundary.
