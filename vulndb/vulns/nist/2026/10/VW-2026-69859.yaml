title: UTMStack before 11.2.16 contains a SQL injection vulnerability in 
  UtmAssetGroupService.searchQueryBuilder() that allows authenticated attackers 
  to inject arbitrary SQL by supplying malicious assetType and groupName values 
  that are inserted unsanitized into a native PostgreSQL query via 
  String.format(). Attackers can exploit the GET 
  /api/utm-asset-groups/searchGroupsByFilter endpoint to execute arbitrary SQL 
  with DBA privileges, enabling full database read, data modification, and 
  potential filesystem access.
