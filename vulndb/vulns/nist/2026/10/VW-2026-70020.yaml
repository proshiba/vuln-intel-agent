title: "OpenCTI is an open source platform for managing cyber threat intelligence
  knowledge and observables. Prior to version 6.8.1, the GraphQL mutation \"WorkspacePopoverDeletionMutation\"\
  \ allows users to delete workspace-related objects such as dashboards and investigation
  cases. However, the mutation lacks proper authorization checks to verify ownership
  of the targeted resources.\nAn attacker can exploit this by supplying an active
  UUID of another user. Since the API does not validate whether the requester owns
  the resource, the mutation executes successfully, resulting in unauthorized deletion
  of the entire workspace. Version 6.8.1 fixes the issue."
