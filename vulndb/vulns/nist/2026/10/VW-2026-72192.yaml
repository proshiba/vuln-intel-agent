title: beautiful-mermaid versions prior to 0.1.3 contain an SVG attribute 
  injection issue that can lead to cross-site scripting (XSS) when rendering 
  attacker-controlled Mermaid diagrams. User-controlled values from Mermaid 
  style and classDef directives are interpolated into SVG attribute values 
  without proper escaping, allowing crafted input to break out of an attribute 
  context and inject arbitrary SVG elements/attributes into the rendered output.
  When the generated SVG is embedded in a web page, this can result in script 
  execution in the context of the embedding origin.
