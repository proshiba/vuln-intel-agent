title: LobsterAI 2026.5.27 through 2026.9.23 contains an external control of 
  file path vulnerability in the skills:delete IPC handler that trusts the 
  openclawSourceDir value from a skill's _meta.json during uninstall. Attackers 
  who convince a user to install a crafted skill can make uninstallation 
  recursively delete arbitrary user-writable directories, such as the home 
  directory, since the security scanner never inspects _meta.json.
