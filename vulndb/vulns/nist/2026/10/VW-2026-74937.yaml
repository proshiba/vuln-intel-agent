title: "With its original introduction, GNTTAB_cache_flush was made available\nuniformly.\
  \  XSA-232 (CVE-2017-14318) then covered an omitted NULL\npointer check, yet the
  addition of that check failed to adjust the\nsubsequent error path.  That error
  path fails to drop a page reference in\ncase the specified page is owned by a special
  system domain (DOM_IO and\nDOM_COW are system domains which can have memory pages
  assigned to them.)"
