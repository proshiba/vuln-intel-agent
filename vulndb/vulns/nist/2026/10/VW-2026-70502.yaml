title: A flaw was found in Quay. When handling build trigger requests, the 
  application incorrectly exposes trigger configuration details containing 
  repository write tokens to global read-only administrative users. An 
  authenticated user with read-only privileges can exploit this flaw by querying
  the build trigger API to retrieve these delegate tokens. This issue allows a 
  restricted user to bypass read-only limitations and push arbitrary container 
  images to private repositories, leading to privilege escalation.
