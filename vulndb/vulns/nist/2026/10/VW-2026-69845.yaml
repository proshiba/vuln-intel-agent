title: The All in One SEO WordPress plugin before 5.0.2.1 does not correctly 
  determine which shortcodes are present in content derived from user input 
  before deciding which ones to strip, allowing unauthenticated users to execute
  arbitrary shortcodes registered on the site. On sites upgraded from older 
  versions the protection is disabled outright, making the issue reachable 
  without any crafted input.
