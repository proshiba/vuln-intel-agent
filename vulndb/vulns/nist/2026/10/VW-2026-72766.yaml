title: Improper enforcement of single-use authorization code semantics in the 
  JPA OAuth2 authorization code grant provider in Apache CXFallows a remote 
  attacker to obtain multiple valid access tokens from a single authorization 
  code via concurrent token exchange requests that race the non-atomic 
  find-then-delete operation against a shared relational database under 
  READ_COMMITTED isolation. Users are recommended to upgrade to versions 4.2.4 
  or 4.1.9 or 3.6.13, which fixes this issue.
