title: Froxlor 0.10.0 before 2.3.14 contains a newline injection vulnerability 
  that allows authenticated customers to inject arbitrary entries into the 
  root-owned NSS group database via the unvalidated additional_members parameter
  of the Ftps.add API. Attackers can embed newline characters that the 
  REBUILD_NSSUSERS cron writes unsanitized into /var/lib/extrausers/group, 
  creating privileged group entries for local privilege escalation.
