title: Microsoft UFO is an open-source framework for intelligent automation 
  across devices and platforms. Prior to 3.0.10, the type_text and launch_app 
  tools in ufo/client/mcp/http_servers/mobile_mcp_server.py pass the 
  authenticated caller-controlled text and package_name parameters into adb 
  shell command argument positions without comprehensive validation. The adb 
  client joins those arguments into a remote command string that the Android 
  shell reparses, allowing shell metacharacters to execute additional commands 
  on an authorized connected device as the Android shell user. Exploitation 
  requires a valid Mobile MCP API key and a reachable device authorized for ADB,
  and it does not establish host operating-system execution, Android root 
  execution, or access beyond the Android shell-user privileges. This issue is 
  fixed in version 3.0.10.
