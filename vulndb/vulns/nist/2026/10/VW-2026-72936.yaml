title: Privasys Go is a maintained fork of the Go programming language that adds
  RA-TLS support to crypto/tls. Prior to privasys-v0.5.1-go1.26.5, 
  challenge-mode RA-TLS certificates bound quote ReportData to the certificate 
  public key and client nonce but not to the active TLS session. An attacker who
  obtained an enclave TLS private key could relay a genuine quote onto another 
  connection, causing a relying party to accept a handshake terminated by the 
  attacker as an attested enclave connection. This issue is fixed in 
  privasys-v0.5.1-go1.26.5.
