title: MISP exposes critical infrastructure settings—specifically the Redis host
  addresses used by the core application, the ZeroMQ plugin, and the 
  SimpleBackgroundJobs plugin—through its web UI and API to site-admin users. 
  The background job workers trust raw Redis job payloads without additional 
  validation. An attacker who obtains a hijacked site-admin session (for 
  example, through a stored cross-site scripting vulnerability) can modify the 
  Redis host settings to point at an attacker-controlled Redis server and then 
  restart the workers. Once the workers connect to the attacker's Redis 
  instance, the attacker can inject malicious job payloads that the workers 
  execute, achieving arbitrary command execution as the worker account. 
