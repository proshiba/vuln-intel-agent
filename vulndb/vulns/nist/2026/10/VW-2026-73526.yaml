title: LlamaFarm through 0.0.34 contains an insecure default configuration that 
  binds its unauthenticated FastAPI server to 0.0.0.0 on port 14345, while the 
  lf CLI silently discards HOST overrides. Network-adjacent attackers can call 
  the project and dataset management API to read stored provider API keys, 
  modify projects, trigger ingestion, and irreversibly delete projects.
