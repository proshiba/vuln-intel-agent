title: UTMStack before 11.2.16 contains a server-side request forgery 
  vulnerability in IdentityProviderService.validateMetadataUrl() that allows 
  authenticated attackers to make the server send requests to arbitrary internal
  or cloud metadata hosts by supplying a malicious metadata URL to the 
  identity-providers endpoint. Attackers can exploit the POST/PUT 
  /api/identity-providers endpoint with no validation of target host, IP, or 
  scheme to perform internal network port scanning and access cloud 
  instance-metadata services.
