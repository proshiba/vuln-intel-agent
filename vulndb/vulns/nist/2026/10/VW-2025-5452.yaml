title: There is a stored Cross-site Scripting vulnerability in  Esri Portal for 
  ArcGIS  11.4 and below that may allow a remote, authenticated attacker to 
  inject malicious a file with an embedded xss script which when loaded could 
  potentially execute arbitrary JavaScript code in the victim’s browser. The 
  privileges required to execute this attack are high. The attack could disclose
  a privileged token which may result in the attacker gaining full control of 
  the Portal.
