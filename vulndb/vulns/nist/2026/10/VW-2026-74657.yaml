title: The Ad Inserter – Ad Manager & AdSense Ads plugin for WordPress is 
  vulnerable to Sensitive Information Exposure in all versions up to, and 
  including, 2.8.18 via the ai_wp_footer_hook. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to extract 
  sensitive data including the server's internal IP address, PHP configuration, 
  WordPress and theme versions, hardening constants, the plugin's full block 
  matrix, and all post meta values including underscore-prefixed protected keys 
  such as API tokens and private integration state written by other plugins.
