title: The Fluent Forms plugin for WordPress is vulnerable to authorization 
  bypass in all versions up to, and including, 6.2.5. This is due to the plugin 
  not properly verifying that a user is authorized to perform an action. This 
  makes it possible for authenticated attackers, with Custom-level access and 
  above, to read private form submissions, change submission statuses, 
  permanently delete submissions, and modify global plugin settings.
