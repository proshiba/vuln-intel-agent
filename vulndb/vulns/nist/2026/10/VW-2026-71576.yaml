title: "Improper control of code generation in the agent import functionality of Amazon
  Bedrock AgentCore Starter Toolkit before 0.3.14 might allow an authenticated same-account
  actor to execute arbitrary code when a user imports and runs or deploys a Bedrock
  Agent, via crafted configuration values incorporated into generated Python source
  without safe literal encoding.\n\n\n\nTo remediate this issue, users should upgrade
  to version 0.3.14. Because this issue persists into generated source, upgrading
  alone is not sufficient: agents imported with an affected version must be re-imported
  with version 0.3.14 or later and their local and deployed output artifacts replaced."
