title: A vulnerability was determined in PublicCMS up to 5.202608.a. Affected by
  this issue is the function SafeConfigComponent.getSafeUrl of the file 
  publiccms-core/src/main/java/com/publiccms/logic/component/config/SafeConfigComponent.java
  of the component pay Endpoint. Executing a manipulation of the argument 
  returnUrl can lead to open redirect. It is possible to launch the attack 
  remotely. The exploit has been publicly disclosed and may be utilized. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
