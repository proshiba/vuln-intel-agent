title: Open WebUI from 0.6.27 before 0.11.4 contains an information disclosure 
  vulnerability that allows destination servers to obtain user session cookies 
  by receiving the full browser cookie jar on OAuth-mode connections. Operators 
  of OpenAI-compatible connections, OpenAPI tool servers or terminal servers can
  capture forwarded session cookies from routine requests and replay them to 
  hijack accounts, including administrators.
