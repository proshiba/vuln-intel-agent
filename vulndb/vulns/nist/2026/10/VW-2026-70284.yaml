title: Joomla Extension - phoca.cz - Authorisation bypass through 
  user-controlled key (IDOR) in Order View in Phoca Cart 5.0.0 - 6.1.8 - Phoca 
  Cart's order-file download endpoint does not verify the download tokens it 
  asks for. The d (download token) and o (order token) parameters are checked 
  for non-emptiness only — they are never compared to the stored download_token 
  / order_token values. As a result, any remote user (including a guest with no 
  account at all) can download any customer's digital goods by enumerating 
  sequential id values and supplying arbitrary non-empty tokens.
