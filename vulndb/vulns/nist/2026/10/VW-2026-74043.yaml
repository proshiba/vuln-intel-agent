title: FreeRDP before 3.32.0 stores the server-supplied signed MS-RDPEGT 
  geometry origin unchecked in an unsigned video surface coordinate, so the blit
  clamp in gdiVideoShowSurface() wraps in 32-bit arithmetic and is skipped. A 
  malicious RDP server can send a negative topLevelLeft to clients connecting 
  with /video, causing an out-of-bounds write of decoded H.264 picture data or a
  client abort.
