title: obsidian-tc is a governed, agent-ready Model Context Protocol server for 
  Obsidian vaults. Prior to 1.3.1, bridge tools do not consistently apply the 
  read access-control list (ACL) to every returned field. The tasks_filter tool 
  exposes group counts derived from denied notes, makemd_query passes unfiltered
  sibling result fields through, and list_templates exposes template paths and 
  parsed user-function bodies without a read-whitelist check. An authenticated 
  caller can consequently infer or read data from notes outside the caller's 
  read ACL. Version 1.3.1 fixes the vulnerability by filtering path-attributable
  fields and applying the read whitelist to list_templates.
