title: The LearnPress – WordPress LMS Plugin plugin for WordPress is vulnerable 
  to Sensitive Information Disclosure in all versions up to, and including, 
  4.2.9.4. This is due to missing capability checks in the REST endpoint 
  /wp-json/lp/v1/load_content_via_ajax which allows arbitrary callback execution
  of admin-only template methods. This makes it possible for unauthenticated 
  attackers to retrieve admin curriculum HTML, quiz questions with correct 
  answers, course materials, and other sensitive educational content via the 
  REST API endpoint granted they can supply valid numeric IDs.
