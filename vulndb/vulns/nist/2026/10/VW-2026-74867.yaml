title: obsidian-tc is a governed, agent-ready Model Context Protocol server for 
  Obsidian vaults. Prior to 1.3.1, read access-control list (ACL) checks use a 
  lexical vault-relative path while containment checks use the resolved path. An
  in-vault symlink under an allowed glob that resolves into a denied folder can 
  therefore bypass the read ACL and expose files in the denied folder. 
  Exploitation requires an out-of-band-planted symlink and does not permit an 
  escape from the vault root. Version 1.3.1 fixes the vulnerability by applying 
  ACL checks to the resolved vault-relative path.
