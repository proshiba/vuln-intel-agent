title: Improper certificate validation in the webmail of Progressive Robot 
  hMailServer 6.3.2 through 6.3.5 allows a remote unauthenticated attacker to 
  have S/MIME-encrypted mail that the account later sends to another 
  correspondent also encrypted to the attacker's key. When its recipient opened 
  a signed message, the webmail kept the signer's certificate for encrypting 
  replies whether or not the server found its chain trusted, under the first 
  e-mail address the certificate listed rather than the message's From address, 
  and beside any certificate already held for that address. Encrypted mail later
  sent from the webmail to that address was encrypted to every certificate held 
  for it, so a holder of the kept certificate's key who obtains a copy of such a
  message can read it.
