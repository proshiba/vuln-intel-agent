title: DeepChat is an open-source AI chat platform that supports cloud models 
  and LLMs. Versions 0.5.1 and below are vulnerable to XSS attacks through 
  improperly sanitized Mermaid content. The recent security patch for 
  MermaidArtifact.vue is insufficient and can be bypassed using unquoted HTML 
  attributes combined with HTML entity encoding. Remote Code Execution is 
  possible on the victim's machine via the electron.ipcRenderer interface, 
  bypassing the regex filter intended to strip dangerous attributes. There is no
  fix at time of publication.
