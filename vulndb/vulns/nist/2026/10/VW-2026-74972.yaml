title: JumpServer is an open source bastion host and an operation and 
  maintenance security audit system. Prior to 4.10.17-lts, JumpServer's 
  Ansible-based automation rendering can evaluate attacker-controlled template 
  expressions from users who have permission to create or execute affected 
  automation tasks. Crafted content can invoke sensitive Ansible lookup 
  behavior, including file, pipe, env, and password lookups, within the Ansible 
  execution context, which can disclose files or environment values and may 
  permit limited command execution under the privileges of the automation 
  process. The issue does not provide unauthenticated access or direct access to
  unrelated JumpServer assets. This issue is fixed in version 4.10.17-lts.
