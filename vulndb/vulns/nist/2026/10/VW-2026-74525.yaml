title: A weakness has been identified in ModelTC LightX2V up to 0.5.0. Affected 
  is the function AutoTokenizer.from_pretrained of the file 
  lightx2v/models/runners/cosmos3/cosmos3_runner.py of the component Tokenizer. 
  This manipulation of the argument auto_map causes code injection. The attack 
  is restricted to local execution. The exploit has been made available to the 
  public and could be used for attacks. The project was informed of the problem 
  early through an issue report but has not responded yet.
