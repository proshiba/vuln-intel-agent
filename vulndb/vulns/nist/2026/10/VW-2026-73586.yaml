title: "The NXP MCUX TRNG entropy driver in drivers/entropy/entropy_mcux_trng.c passed
  the caller's byte count straight to the vendor SDK routine TRNG_GetRandomData().
  On i.MX RT5xx and RT6xx parts the SDK compiles its TRNG_SW_HEALTH_TESTS variant,
  which always copies whole 32-bit words and draws entropy rounded up to a multiple
  of 128 bytes. Its \"caller buffer is full\" guard tests dataSize == 0, so a request
  whose length is not a multiple of four makes dataSize underflow past zero and the
  SDK keeps writing into the caller's buffer for the entire extraction: a 1-byte request
  results in 128 bytes written, and any non-word-multiple length overflows by up to
  127 bytes.\n\nentropy_get_entropy() is a syscall, and its verifier in drivers/entropy/entropy_handlers.c
  validates only the requested length via K_SYSCALL_MEMORY_WRITE(). With CONFIG_USERSPACE
  enabled, an unprivileged user-mode thread that has merely been granted the entropy
  device can therefore choose both the destination address and a length "
