title: A vulnerability was found in kishor-23 food-waste-management-system 
  411989e3ecb82895e53dca7865f72145f03d7d93/b3a70b2c492dc9904de5be1ad9389bd79b87f82c.
  The affected element is the function insert of the file fooddonateform.php of 
  the component Food Donation Form. Performing a manipulation of the argument 
  image-choice results in sql injection. The attack is possible to be carried 
  out remotely. The exploit has been made public and could be used. This product
  adopts a rolling release strategy to maintain continuous delivery. Therefore, 
  version details for affected or updated releases cannot be specified. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
