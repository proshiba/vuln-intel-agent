title: PublicCMS through V6.202608.a contains an insecure direct object 
  reference vulnerability in the TradeAddressController tradeAddress/save 
  handler that allows authenticated members to modify other members' shipping 
  addresses. Attackers can submit another member's sequential numeric address id
  to overwrite its addressee, telephone and address fields, since ownership by 
  the session user and site is never verified.
