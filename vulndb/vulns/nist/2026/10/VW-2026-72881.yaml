title: x64dbg-MCP Server is a native Model Context Protocol (MCP) plugin for 
  x64dbg that exposes the debugger's full functionality over HTTP. Prior to 1.2,
  src/core/mcp_server.zig parses an unbounded Content-Length value in 
  parseContentLength() and uses it in unchecked usize addition in wsRecv() 
  before token authentication. The server listens on 0.0.0.0 by default in 
  affected versions. An unauthenticated network client can supply a near-maximum
  Content-Length value to trigger a runtime integer-overflow panic in Debug and 
  ReleaseSafe builds, terminating the entire x64dbg process and its live 
  debugging session. The overflowed value is used only in a comparison, so the 
  impact is limited to denial of service rather than memory corruption or code 
  execution. This issue is fixed in version 1.2.
