title: The sandbox that isolates document conversion on a Kiteworks appliance 
  did not fully confine the code running inside it. Code already executing 
  within that sandbox could potentially escape its confinement and act with the 
  privileges of the service account that runs the application, which could allow
  an attacker in that position to read or modify application data and 
  configuration, or to disrupt the service on the affected appliance.
