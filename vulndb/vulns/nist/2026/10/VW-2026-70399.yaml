title: Plane is an open-source project management tool. Prior to 1.4.0, the 
  deployments/aio/community/ and deployments/cli/community/ manifests provide 
  fixed, publicly known SECRET_KEY and LIVE_SERVER_SECRET_KEY defaults that 
  remain active when operators do not override them. The top-level setup.sh 
  randomizes secrets only for the development Docker Compose path, leaving 
  unchanged aio and cli community deployments with shared production secrets. 
  Knowledge of SECRET_KEY enables attackers to forge Django-signed values and 
  compromise accounts or sessions. Knowledge of LIVE_SERVER_SECRET_KEY bypasses 
  live-service authentication on unchanged community deployments. This issue is 
  fixed in 1.4.0.
