title: Excelize is a Go language library for reading and writing Microsoft Excel
  spreadsheets. From 2.8.1 to 2.11.0, ANCHORARRAY recursively calls the exported
  CalcCellValue function, creating a fresh calculation context at each cycle and
  bypassing in-flight and iteration controls. ANCHORARRAY calls CalcCellValue 
  instead of cellResolver, so each recursive hop receives a new calcContext and 
  loses cycle state. When mutually referencing dynamic-array formulas are 
  evaluated directly or through formula-evaluating APIs, each recursion hop 
  resets the cycle budget and prevents completion-based caches from breaking the
  cycle, allowing an attacker to cause a fatal Go stack overflow and abort the 
  process. No fixed version is available as of this review.
