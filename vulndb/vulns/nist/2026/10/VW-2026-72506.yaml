title: In OpenStack Mistral through 23.0.0, the std.ssh_proxied action passes a 
  caller-supplied proxy_command value directly to paramiko.ProxyCommand() before
  any SSH connection to a gateway or target host is attempted. An authenticated 
  project member can use the standard action-execution API to submit an 
  arbitrary local command as proxy_command; paramiko starts that command as a 
  subprocess on the executor host under the executor's own service account, 
  independent of whether the SSH connection itself ever succeeds. Only Mistral 
  deployments that permit the std.ssh_proxied action, the default configuration,
  are affected.
