title: "MISP contains an authorization bypass in the related events listing functionality.
  When a user requests the list of events correlated to a given event, the system
  retrieved related event metadata directly from the correlation table without re-validating
  the caller's access rights against each related event.\n\nThe correlation table
  stores a snapshot of the event's distribution level and sharing group at the time
  the correlation was created, and does not carry the published flag. As a result,
  events that the caller is not permitted to open—because they are unpublished, or
  because their distribution or sharing group has changed since the correlation was
  recorded—were still returned with their metadata (title, date, correlating value
  counts).\n\nPreconditions:\n\n- An authenticated user with access to at least one
