title: "A connected peer cluster can modify a Temporal Server cluster's local namespaces,
  which are never replicated to that peer, because the receiving cluster applies inbound
  namespace replication updates to them. In a multi-cluster deployment, each cluster
  pulls replication tasks from the remote clusters an administrator has registered
  with connection enabled; the sending side excludes local namespaces, but the receiving
  side does not apply the same rule. When an inbound task names an existing namespace,
  the server checks at most that the namespace identifiers match, then overwrites
  its state, description, owner, retention, archival settings, and cluster list, and
  its active cluster when the task carries a higher failover version, without checking
  that the namespace is global. A party that controls a registered peer's replies,
  by operating or compromising it, can therefore change any local namespace whose
  name and identifier it can supply, without any credential on the receiving cluster:
  fo"
