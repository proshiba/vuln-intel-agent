title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  skbuff: do not leave stale header offsets after pskb_carve()\n\npskb_carve_inside_header()
  and pskb_carve_inside_nonlinear() remove\nthe first bytes of a packet and reallocate
  skb->head.\n\nAll the headers that were present before the operation are gone,\n\
  but both functions call skb_headers_offset_update(skb, 0), which\nis a no-op : skb->mac_header,
  skb->network_header,\nskb->transport_header and skb->csum_start keep their old values
  and\nnow describe bytes which are no longer there.\n\nBoth helpers size the new
  head from the old skb_end_offset(), so the\nstale offsets still land inside the
  new allocation. They point past\nskb_tail_pointer() though, to bytes that were never
  initialized.\n\npskb_carve_inside_nonlinear() is the worst case, because it leaves
  a\nzombie skb with an empty linear part (skb->data ==\nskb_tail_pointer(skb), skb_headlen(skb)
  == 0), while\nskb_mac_header_was_set() is still true and skb->mac_header is way\n\
  ahe"
