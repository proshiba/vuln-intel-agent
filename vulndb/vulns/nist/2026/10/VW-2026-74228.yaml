title: copyparty is a portable file server. Prior to 1.20.19, FTP upload path 
  handling does not confine destinations to configured copyparty volumes. When 
  FTP or FTPS is explicitly enabled, a low-privileged authenticated user can 
  submit traversal paths during upload to create a new file outside configured 
  volumes wherever the copyparty process has write permission. The attacker 
  cannot read or overwrite files, the output name receives a randomized suffix, 
  and copyparty does not execute the file; however, unrelated software on the 
  same host could process the newly created file. This issue is fixed in version
  1.20.19.
