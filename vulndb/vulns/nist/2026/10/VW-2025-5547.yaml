title: WeGIA is an open source Web Manager for Institutions with a focus on 
  Portuguese language users. Prior to version 3.5.1, a reflected cross-site 
  scripting (XSS) vulnerability was identified in the editar_info_pessoal.php 
  endpoint of the WeGIA application. This vulnerability allows attackers to 
  inject malicious scripts in the sql parameter. The vulnerable endpoint is GET 
  /WeGIA/html/pessoa/editar_info_pessoal.php?sql=1. This issue has been patched 
  in version 3.5.1.
