title: Plane is an open-source project management tool. Prior to 1.4.0, 
  WorkspaceFileAssetEndpoint.get and WorkspaceAssetDownloadEndpoint.get resolve 
  FileAsset records within a workspace without checking membership in the 
  asset's project, allowing a workspace member to download assets from private 
  projects when the asset UUID is known. EntityAssetEndpoint.get is a separate 
  public-anchor endpoint that grants AllowAny access and scopes the lookup only 
  to the anchor's workspace rather than its published entity or project. An 
  unauthenticated caller who knows a valid anchor and an asset UUID can 
  therefore retrieve issue-description or comment-description assets belonging 
  to unpublished or private projects in that workspace. This issue is fixed in 
  1.4.0.
