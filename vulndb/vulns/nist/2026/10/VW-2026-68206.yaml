title: Russh is a Rust SSH client and server library. Prior to 0.62.6, the 
  USERAUTH_REQUEST path reached from server::run_stream in 
  russh/src/server/encrypted.rs increments self.common.auth_attempts but never 
  compares it with server::Config.max_auth_attempts. An unauthenticated remote 
  client can continue submitting authentication requests on one connection 
  beyond the configured cap, bypassing the deployment's attempt-limiting policy 
  and increasing online guessing opportunity and backend authentication 
  workload. This issue is fixed in version 0.62.6.
