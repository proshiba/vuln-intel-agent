title: SimpleChat is a secure AI conversation application with personal and 
  group workspaces for document-grounded interactions. Prior to 0.261.029, POST 
  /api/group_documents/upload stores an attacker-controlled group document 
  filename that group_workspaces.html later interpolates into inline Share event
  handlers. The escapeGroupHtml function leaves apostrophes unchanged, while 
  escapeHtml produces an HTML entity that the browser decodes before JavaScript 
  evaluation, so either path permits the filename to terminate the handler 
  string. An authenticated group Owner, Admin, or DocumentManager can persist 
  script that executes in the SimpleChat origin when another group member clicks
  Share, allowing access to victim-visible data and actions with the victim 
  session. This issue is fixed in version 0.261.029.
