title: Wazuh versions from 3.9.0 before 4.14.8 contain an arbitrary file 
  overwrite vulnerability in MasterHandler.process_files_from_worker allowing a 
  cluster worker to overwrite protected master files. Attackers controlling a 
  worker can use a trailing-slash basename bypass and missing extra_valid 
  enforcement to overwrite ossec.conf and agent.conf, achieving root remote code
  execution across the manager and every agent.
