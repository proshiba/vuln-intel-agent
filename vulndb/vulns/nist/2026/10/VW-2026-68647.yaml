title: "A missing authorization check in the Vaadin Spreadsheet component allows an
  authenticated user of an application that renders a spreadsheet to add or replace
  cell comments on a sheet that has protection enabled, including on cells that are
  locked. Writing a comment to a cell that does not exist yet also creates the row
  and the cell.\n\n\nUsers of affected versions should apply the following mitigation
  or upgrade. Releases that have fixed this issue include:\n\nProduct version\nVaadin
  23.1.0 - 23.6.13\nVaadin 24.0.0 - 24.9.21\nVaadin 24.10.0 - 24.10.9\nVaadin 25.0.0
  - 25.1.11\nVaadin 25.2.0 - 25.2.6\nVaadin Framework 7 and 8 with the Spreadsheet
  add-on 2.0.0 - 3.1.0\n\nMitigation\nUpgrade to 23.6.14\nUpgrade to 24.9.22\nUpgrade
  to 24.10.10\nUpgrade to 25.1.12\nUpgrade to 25.2.7 or newer\nUpgrade the Spreadsheet
  add-on to 3.1.1\n\nPlease note that Vaadin versions 10-13 and 15-22 are no longer
  supported and you should update either to the latest 23, 24, 25 version.\n\nArtifacts\n\
