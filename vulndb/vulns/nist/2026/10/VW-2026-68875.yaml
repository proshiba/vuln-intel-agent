  all IP addresses by setting allowedIPs to ['*'] in its default development 
  configuration. Unauthenticated remote attackers can access the debug endpoint 
  to read sensitive data including session cookies and database queries, or 
  access the Gii endpoint to generate and write PHP files into the application 
  directory.
