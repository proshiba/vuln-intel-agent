title: RIOT is an open-source microcontroller operating system designed for 
  Internet of Things devices and other embedded systems. From version 2023.07 
  through version 2026.07, nanocoap_fileserver callers in 
  sys/net/application_layer/nanocoap/fileserver.c ignore a failure returned by 
  _resp_init() when coap_build_reply() cannot fit a response header into the 
  response buffer. A remote client can send a CoAP request with a sufficiently 
  large extended token when nanocoap_token_ext is enabled, causing response 
  initialization to fail while _get_file() or _get_directory() continues with 
  stale response state. The path then reaches _calc_szx2() and its 
  pdu->payload_len > reserve assertion, terminating the affected service or 
  device task. No fixed release is available as of this review.
