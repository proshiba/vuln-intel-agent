title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  codecs: rt712-sdca-dmic: fix uninitialized stream_config->type\n\nstream_config
  is not initialized before being passed to\nsdw_stream_add_slave().  The type field
  may contain garbage and is\nlater copied to stream->type by sdw_config_stream().\n\
  \nZero-initialize stream_config so type defaults to SDW_STREAM_PCM.\n\nWhile at
  it, use snd_sdw_params_to_config() helper instead of\nopen-coding the same logic."
