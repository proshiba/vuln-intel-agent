title: "Server-side request forgery in the OAuth2 discovery handling in Loom for AWS
  before 1.7.0 might allow an authenticated remote user to obtain the access token
  of another user of the deployment and to cause the application to issue requests
  to arbitrary internal network locations, via a crafted discovery document address
  supplied when registering a tool server or remote agent configured for delegated
  authentication.\n\n\n\nTo remediate this issue, users should upgrade to version
  1.7.0 or later."
