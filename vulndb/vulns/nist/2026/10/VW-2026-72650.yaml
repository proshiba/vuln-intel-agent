title: A stack-based buffer overflow in the _RdbLoadEntity function of the RDB 
  graph decoders (src/serializers/decoders/*/decode_graph_entities.c) in 
  FalkorDB before 4.18.4 allows a remote attacker who can issue Redis 
  replication commands (for example, against an instance with no password 
  configured) to cause a denial of service and possibly execute arbitrary code 
  by supplying a crafted RDB stream with an attacker-controlled entity property 
  count. The count sizes two variable-length arrays on the thread stack with no 
  upper bound, and the decoder then fills them with attacker-supplied values.
