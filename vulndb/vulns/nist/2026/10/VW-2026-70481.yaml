title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, authenticated users with file-edit permission can upload SVG media 
  whose scripts, event-handler attributes, and foreignObject elements are stored
  without sanitization and served as image/svg+xml from the Penpot origin. A 
  victim who navigates to the asset URL executes attacker-controlled JavaScript 
  in that origin, allowing requests and data access with the victim's Penpot 
  session authority. This issue is fixed in version 2.18.0.
