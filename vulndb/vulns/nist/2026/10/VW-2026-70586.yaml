title: A flaw was found in SSSD. An unprivileged local user can repeatedly 
  request lookups for nonexistent entries through the Name Service Switch (NSS) 
  responder. Because the negative cache does not limit the total number of 
  stored entries and only removes expired records when an existing key is 
  rechecked, the cache can grow without bound. This behavior can lead to memory 
  exhaustion, resulting in a Denial of Service (DoS) as the responder becomes 
  unresponsive or terminates.
