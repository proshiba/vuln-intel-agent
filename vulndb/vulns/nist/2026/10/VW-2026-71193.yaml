title: "TP-Link Tapo\nC500 v2.0 contains an out-of-bounds function-pointer dispatch
  in its TDP\n(TP-Link Device Protocol) daemon. A single unauthenticated UDP datagram
  can\ncause an invalid indirect call, crashing the main service and resulting in
  a\ndenial-of-service condition.\n\n\n\n\n\nSuccessful\nexploitation may allow an
  unauthenticated attacker with network access to the\naffected UDP service to repeatedly
  crash the TDP daemon, disrupting normal\ndevice operation and availability. No authentication,
  session establishment, or\npairing is required to trigger the condition."
