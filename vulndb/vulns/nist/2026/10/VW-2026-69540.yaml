title: "The Listdom: AI-powered Business Directory with Classifieds Ads Listings plugin
  for WordPress is vulnerable to Stored Cross-Site Scripting via 'lsd[remark]' Parameter
  in all versions up to, and including, 6.1.1 due to insufficient input sanitization
  and output escaping. This makes it possible for authenticated attackers, with contributor-level
  access and above, to inject arbitrary web scripts in pages that will execute whenever
  a user accesses an injected page. This is exploitable by Subscriber-level users
  because the listing-creation branch of the AJAX handler omits a capability check,
  and the required nonce is publicly emitted on any page containing the [listdom-dashboard]
  shortcode."
