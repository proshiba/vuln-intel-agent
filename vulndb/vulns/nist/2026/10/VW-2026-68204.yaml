title: Russh is a Rust SSH client and server library. Prior to 0.63.1, 
  client_read_authenticated in russh/src/client/encrypted.rs forwards 
  CHANNEL_DATA, CHANNEL_EXTENDED_DATA, CHANNEL_EOF, CHANNEL_CLOSE, 
  CHANNEL_OPEN_FAILURE, CHANNEL_SUCCESS, CHANNEL_FAILURE, and CHANNEL_REQUEST 
  subtypes exit-status, exit-signal, and xon-xoff to public client::Handler 
  callbacks without confirming that the ChannelId belongs to a channel the 
  client opened and established. A malicious SSH server can send lifecycle 
  events for predicted, unopened, unconfirmed, or released channel identifiers, 
  causing application panics or corrupting command completion and exit-code 
  tracking. This issue is fixed in version 0.63.1.
