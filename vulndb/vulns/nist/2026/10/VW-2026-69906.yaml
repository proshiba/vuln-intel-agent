title: The Jeg Kit for Elementor – Powerful Addons for Elementor, Widgets & 
  Templates for WordPress plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Comment in all versions up to, and including, 3.2.19 
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. Immediate 
  persistence without moderator approval is possible when the attacker submits 
  from an email address with at least one previously approved comment, though 
  the widened allowlist bypasses sanitization regardless of approval status.
