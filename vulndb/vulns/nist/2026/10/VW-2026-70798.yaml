title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: bound the pairwise-cipher OUI walk to the IE length\n\nmwifiex_search_oui_in_ie()
  reads a pairwise-cipher (PTK) count from a\nbeacon/probe-response RSN or WPA information
  element and then walks that\nmany 4-byte OUIs, comparing each with memcmp(). The
  count comes straight\nfrom the (attacker-supplied) IE and is never checked against
  the\nelement's own length, and the callers admit the element on element_id\nalone
  (has_ieee_hdr() / has_vendor_hdr(), no length check). A crafted\nRSN/WPA IE with
  a large pairwise count therefore makes the walk read up\nto 255 * 4 bytes past the
  element -- an out-of-bounds read of the\nkmemdup()'d beacon buffer, reachable from
  any AP whose beacon/probe\nresponse is processed during scan-result parsing.\n\n\
  Pass the number of IE bytes available at the OUI list and bound the walk\nto the
  element. Keep the length signed and reject a negative value\nbefore any unsigned
  arithmetic, so a small or"
