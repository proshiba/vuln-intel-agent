title: NVIDIA AIStore for Linux contains a path traversal vulnerability in the 
  dSort archive extraction component where a remote attacker may cause an 
  improper limitation of a pathname to a restricted directory by supplying 
  crafted archive member names to a dSort job. A successful exploit may lead to 
  arbitrary file creation or overwrite, code execution, information disclosure, 
  data tampering, and denial of service.
