title: ruoyi-ai 3.0.0 through 3.1.0 contains a missing authorization 
  vulnerability that allows authenticated users to delete other users' workflows
  via POST /workflow/del/{uuid}. Attackers can obtain workflow UUIDs from GET 
  /workflow/search and supply them because softDelete() skips the 
  PrivilegeUtil.checkAndGetByUuid() ownership check, removing owners' workflows.
