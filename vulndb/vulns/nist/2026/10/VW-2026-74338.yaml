title: Nginx UI is a web user interface for the Nginx web server. Prior to 
  2.4.1, GetCasdoorUri uses the configured Casdoor application name as a 
  constant OAuth state value and CasdoorCallback does not compare the submitted 
  state with a value bound to the initiating browser session. An unauthenticated
  attacker can cause a victim's browser to complete an attacker-controlled 
  Casdoor authorization flow, and the callback can mint a Nginx UI session for 
  the identity returned by that authorization code. This issue is fixed in 
  version 2.4.1.
