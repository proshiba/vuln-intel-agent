title: 'A flaw has been found in HBAI-Ltd Toonflow-app up to 1.1.8. The affected element
  is the function child_process.exec of the file src/routes/setting/fileManagement/openFolder.ts
  of the component Open Folder Endpoint. Executing a manipulation of the argument
  path can lead to command injection. The attack needs to be launched locally. The
  exploit has been published and may be used. Upgrading to version 2.0.0 is sufficient
  to fix this issue. You should upgrade the affected component. The vendor explains:
  "The report targets ToonFlow version 1.1.8. The current release is 2.0.4, which
  is the result of a substantial architectural refactor; the code paths referenced
  in the report do not apply to the current version. The report does not describe
  a vulnerability in any supported release."'
