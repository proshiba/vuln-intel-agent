title: Fickling is a Python pickling decompiler and static analyzer. Versions 
  prior to 0.1.6 are missing `marshal` and `types` from the block list of unsafe
  module imports. Fickling started blocking both modules to address this issue. 
  This allows an attacker to craft a malicious pickle file that can bypass 
  fickling since it misses detections for `types.FunctionType` and 
  `marshal.loads`. A user who deserializes such a file, believing it to be safe,
  would inadvertently execute arbitrary code on their system. This impacts any 
  user or system that uses Fickling to vet pickle files for security issues. The
  issue was fixed in version 0.1.6.
