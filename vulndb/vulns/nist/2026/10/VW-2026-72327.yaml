title: "An authorization bypass vulnerability in Apache DolphinScheduler allows authenticated
  users to modify task definitions in projects they are not authorized to access through
  the /dolphinscheduler/projects/{projectCode}/task-definition/{code}/with-upstream
  endpoint.\n\n\n\nThe endpoint fails to verify that the task definition identified
  by code belongs to the project specified by projectCode. An authenticated user can
  supply the code of a project they are authorized to access together with a task
  definition code from another project, bypassing project access restrictions and
  modifying the target task definition and its upstream dependencies.\n\n\n\nThis
  vulnerability can compromise workflow integrity and disrupt task execution in unauthorized
  projects.This issue affects Apache DolphinScheduler: before 3.4.3.\n\n\n\nUsers
  are recommended to upgrade to version 3.4.3, which fixes the issue."
