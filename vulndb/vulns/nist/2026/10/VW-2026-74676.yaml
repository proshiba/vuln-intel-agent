title: A vulnerability was determined in calcom cal.com and cal.diy up to 6.2.0.
  This vulnerability affects the function credentials.delete of the file 
  /api/trpc/credentials/delete of the component Credentials Handler. This 
  manipulation of the argument teamId causes improper privilege management. The 
  attack can be initiated remotely. The exploit has been publicly disclosed and 
  may be utilized. The vendor was contacted early about this disclosure but did 
  not respond in any way.
