title: The Download Manager WordPress plugin before 3.3.71 does not sufficiently
  sanitise and escape a package setting before outputting it back in a page, 
  which could allow users with the Author role and above to perform Stored 
  Cross-Site Scripting attacks against any visitor who opens the package's 
  download dialogue, including administrators. Only sites running PHP below 8.1 
  are affected, as the sanitisation applied when the setting is saved does not 
  neutralise single quotes there.
