title: "By default, StaxUtils placed no limit on the total number of elements or the
  total number of characters in an XML document. A very large request could therefore
  use a lot of memory and CPU during parsing, especially where CXF builds a DOM from
  the input (for example SAAJ or WS-Security), and could cause a denial of service
  when no request size limit was configured. Both limits now have defaults: the maximum
  element count is 100 × maxChildElements (5,000,000 by default), and the maximum
  document size is 256M characters. Applications that process larger documents can
  raise the limits with the org.apache.cxf.stax.maxElementCount and org.apache.cxf.stax.maxXMLCharacters
  properties.\nUsers are recommended to upgrade to versions 4.2.4 or 4.1.9 or 3.6.13,
  which fix this issue."
