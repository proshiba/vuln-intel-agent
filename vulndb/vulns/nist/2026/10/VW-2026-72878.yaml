title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, the mysql_json 
  plugin assumed that imported MySQL tables contained valid MySQL binary JSON 
  data. A specially prepared MySQL table containing invalid JSON data could 
  cause out-of-bounds reads, information disclosure, or a server crash. This 
  issue is fixed in versions 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 
  13.0.2.
