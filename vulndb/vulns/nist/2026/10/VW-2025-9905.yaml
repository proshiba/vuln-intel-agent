title: Codex CLI is a coding agent from OpenAI that runs locally. In versions 
  0.2.0 to 0.38.0, due to a bug in the sandbox configuration logic, Codex CLI 
  could treat a model-generated cwd as the sandbox’s writable root, including 
  paths outside of the folder where the user started their session. This logic 
  bypassed the intended workspace boundary and enables arbitrary file writes and
  command execution where the Codex process has permissions - this did not 
  impact the network-disabled sandbox restriction. This issue has been patched 
  in Codex CLI 0.39.0 that canonicalizes and validates that the boundary used 
  for sandbox policy is based on where the user started the session, and not the
  one generated by the model. Users running 0.38.0 or earlier should update 
  immediately via their package manager or by reinstalling the latest Codex CLI 
  to ensure sandbox boundaries are enforced. If using the Codex IDE extension, 
  users should immediately update to 0.4.12 for a fix of the sandbox issue.
