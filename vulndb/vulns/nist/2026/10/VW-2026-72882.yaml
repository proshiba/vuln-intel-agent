title: MariaDB server is a community developed fork of MySQL server. From 10.6.1
  until 10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2, MariaDB 
  insufficiently validated counts, offsets, lengths, and field boundaries in FRM
  metadata while opening binary FRM files. An attacker able to place a crafted 
  FRM file in the data directory could trigger out-of-bounds reads or writes, 
  crash the server, or potentially execute code. This issue is fixed in versions
  10.6.28, 10.11.19, 11.4.13, 11.8.9, 12.3.3, and 13.0.2.
