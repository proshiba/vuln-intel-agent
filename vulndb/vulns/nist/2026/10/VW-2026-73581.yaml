title: "The zbus proxy agent IPC backend in subsys/zbus/proxy_agent/zbus_proxy_agent_ipc.c
  logged the channel name of a rejected inter-domain frame with a plain %s conversion.
  The frame type struct zbus_proxy_msg carries a fixed-size channel_name[] array as
  its last member, and nothing in the transport guarantees the array is NUL-terminated.
  The only code that verifies termination is zbus_proxy_agent_receive_cb() in subsys/zbus/proxy_agent/zbus_proxy_agent.c,
  which rejects the frame in precisely those cases — so the warning printed a non-terminated
  buffer exactly on the error paths where the name had been found invalid (or, for
  an invalid message_size, had not been inspected at all).\n\nAny peer domain able
  to place a frame of sizeof(struct zbus_proxy_msg) bytes on the bound ipc_service
  endpoint can trigger it, by sending a frame with an out-of-range message_size or
  with channel_name[] containing no NUL byte. Reaching the code requires CONFIG_ZBUS_PROXY_AGENT_IPC
  and logging built at warning lev"
