title: A vulnerability has been found in OpenClinica Community Edition up to 
  3.12.2/3.13. Affected by this issue is some unknown functionality of the file 
  /ImportCRFData?action=confirm of the component CRF Data Import. Such 
  manipulation of the argument xml_file leads to xml injection. It is possible 
  to launch the attack remotely. The exploit has been disclosed to the public 
  and may be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
