  This issue affects some unknown processing of the file signup.php of the 
  component User Registration Endpoint. Executing a manipulation of the argument
  email/name/gender can lead to sql injection. The attack may be performed from 
  remote. The exploit has been made available to the public and could be used 
  for attacks. This product utilizes a rolling release system for continuous 
  delivery, and as such, version information for affected or updated releases is
  not disclosed. The project was informed of the problem early through an issue 
  report but has not responded yet.
