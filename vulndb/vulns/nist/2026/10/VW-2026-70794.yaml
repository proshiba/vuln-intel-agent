title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: refuse to make a monitor active when it has no queue\n\nA monitor interface
  only gets a TXQ if it's created active, and one can't\nbe added later. Setting the
  flag on a down interface is still allowed, so\nthe driver is handed a monitor with
  no queue. ath9k dereferences it:\n\n  BUG: kernel NULL pointer dereference, address:
  0000000000000066\n  RIP: 0010:ath_tx_node_init+0x49/0x170 [ath9k]\n   ath9k_add_interface+0x10c/0x140
  [ath9k]\n   drv_add_interface+0x54/0x250 [mac80211]\n   ieee80211_do_open+0x32f/0x800
  [mac80211]\n\nReached with CAP_NET_ADMIN by \"iw dev X set monitor active\" followed
  by\n\"ip link set X up\". RTNL is held, so netlink operations block behind it.\n\
  \nRefuse the flag when there is no queue to give."
