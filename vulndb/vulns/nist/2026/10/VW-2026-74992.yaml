title: Jorani before 1.0.4 contains a missing authorization vulnerability in 
  Contracts::import() that allows any authenticated user to import days off into
  any contract from an arbitrary URL. Attackers can submit a contract id and URL
  via POST to overwrite non-working-day calendars and abuse get_headers() and 
  fopen() for server-side request forgery against internal hosts.
