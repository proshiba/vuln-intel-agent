title: IBM Jazz for Service Management 1.1.3.0 through 1.1.3.25 does not set the
  secure attribute on authorization tokens or session cookies. Attackers may be 
  able to get the cookie values by sending a http:// link to a user or by 
  planting this link in a site the user goes to. The cookie will be sent to the 
  insecure link and the attacker can then obtain the cookie value by snooping 
  the traffic.
