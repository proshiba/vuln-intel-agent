title: SurrealDB from 3.0.0 before 3.3.0 contains an authorization bypass 
  vulnerability that allows authenticated record users to read records in other 
  namespaces or databases by resolving record ids through FETCH. Attackers can 
  switch to a foreign namespace/database and name a known record id in a RETURN 
  … FETCH query to read another tenant's data when table PERMISSIONS allow 
  reads.
