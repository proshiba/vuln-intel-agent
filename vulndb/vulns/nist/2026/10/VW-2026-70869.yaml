title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrds:
  ib: use rds_conn_drop() on protocol version mismatch\n\nrds_ib_cm_connect_complete()
  runs from the RDMA-CM event handler with\nconn->c_cm_lock held.  When the peer negotiates
  a protocol version\nolder than RDS_PROTOCOL_COMPAT_VERSION, the handler calls\n\
  rds_conn_destroy(), which is only safe in the rmmod path: it\nsynchronously tears
  the connection down and flush_work()es the\nshutdown work cp_down_w.\n\nThat shutdown
  work (rds_conn_shutdown()) needs cp_cm_lock, which is\nthe very lock the event handler
  still holds, so the flush never\ncompletes: the two workers wait on each other and
  the RDS connection\nworkqueues stall for good.\n\nAll other RDMA-CM failure paths
  (REJECTED, CONNECT_ERROR,\nDISCONNECTED) use rds_conn_drop(), which marks the connection\n\
  RDS_CONN_ERROR and schedules the shutdown work asynchronously.  Use\nit here as
  well."
