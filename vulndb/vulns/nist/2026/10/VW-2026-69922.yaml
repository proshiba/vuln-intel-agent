title: "The WPZOOM Connect: AI Chat, Click to Chat, Social Icons & Share Buttons plugin
  for WordPress is vulnerable to Sensitive Information Exposure in all versions up
  to, and including, 4.7.3 via the 'x-yamidoo-signature (attacker-obtained via inline_js
  identify payload)' parameter. This makes it possible for unauthenticated attackers
  to extract the full customer card — including name, WordPress user ID, order history,
  order totals, purchased products, payment method labels, and EDD Software Licensing
  license keys with status and activation counts — for any arbitrary victim email
  address on the site. Exploitation requires the attacker to register a WooCommerce
  customer or subscriber-level account with a crafted email address whose local part
  encodes the target timestamp and victim email, allowing the signature printed into
  the page HTML by inline_js() to pass verify_request() for an arbitrary victim; both
  the share_customer_data and identify_logged_in settings are enabled by default,
