title: WookTeam v1.6.6 and before is vulnerable to RCE in the project task 
  export interface /api/project/task/export. The data parameter is 
  base64-decoded and passed directly into the string2array() function in 
  app/Module/Base.php, which executes eval("\$array = $data;") whenever the 
  decoded string starts with array. An attacker can inject arbitrary PHP code 
  into the eval call and achieve RCE.
