title: yawkat LZ4 Java provides LZ4 compression for Java. From 1.7.0 until 
  1.11.4, net.jpountz.util.Native.load() uses File.createTempFile to create an 
  exclusive temporary .lck file but derives the native-library path by removing 
  the suffix, then FileOutputStream opens that predictable path without 
  exclusive creation, allowing another local user with access to the same shared
  temporary directory to create or replace the library file before System.load()
  uses it. Successful exploitation depends on shared-directory permissions, host
  protections, and winning the race, and can execute native code as the victim; 
  hardened systems may instead cause library loading to fail and fall back to 
  Java implementations. Configurations using a system library, a private 
  java.io.tmpdir, or Java-only implementations are not affected. This issue is 
  fixed in version 1.11.4.
