title: A vulnerability was found in Edimax BR-6208AC 1.32. This vulnerability 
  affects unknown code of the file /goform/formAccept. Performing a manipulation
  of the argument submit-url results in command injection. The attack is 
  possible to be carried out remotely. The exploit has been made public and 
  could be used. The vendor was contacted early about this disclosure but did 
  not respond in any way. This vulnerability only affects products that are no 
  longer supported by the maintainer.
