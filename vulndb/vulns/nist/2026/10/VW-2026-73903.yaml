title: 'A vulnerability was identified in Zen Cart 2.2.2. Affected by this vulnerability
  is the function eval of the file admin/configuration.php of the component Admin
  Panel. The manipulation of the argument gID leads to sql injection. The attack may
  be initiated remotely. The attack is considered to have high complexity. The exploitation
  appears to be difficult. The exploit is publicly available and might be used. The
  vendor explains: "`set_function`/`use_function` are not editable through any normal
  admin UI (only at plugin-install time via SQL, or via direct database access)".'
