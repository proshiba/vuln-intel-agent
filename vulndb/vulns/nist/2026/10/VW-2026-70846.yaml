title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  hhf: cap hh_flows_limit at change time\n\nhhf_change() stores TCA_HHF_HH_FLOWS_LIMIT
  with no upper bound. A huge\nhh_flows_limit lets each new heavy-hitter flow pass
  the\nhh_flows_current_cnt check in alloc_new_hh() and forces a fixed-size\nkzalloc(GFP_ATOMIC)
  per flow under spoofed traffic, for unbounded memory\ngrowth.\n\nBound the attribute
  with NLA_POLICY_MAX() at 2*HH_FLOWS_CNT (the\nhhf_init() default) and report the
  rejected value via extack. The\ndeprecated nested parse is kept: legacy tc does
  not set NLA_F_NESTED on\nTCA_OPTIONS. Configs relying on hh_limit above the default
  were relying\non unbounded, unsafe behaviour and are not supported going forward.\n\
  \nhhf_init() also ran hhf_change() before setting the default\nhh_flows_limit, so
  a user-supplied hh_limit at add time was clobbered\nback to 2048. Set the default
  before hhf_change() so the configured\nvalue sticks.\n\nThis is a follow-up to commit
  eb56a495f59b (\""
