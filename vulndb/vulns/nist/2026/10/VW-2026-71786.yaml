title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  preserve mremap address delta when skipping page tables\n\nmove_hugetlb_page_tables()
  optimizes mremap() by advancing to the last\nentry in the page table when the source
  page table does not exist, either\ninitially or after unsharing a PMD table.  The
  common loop increment then\nsteps to the first entry in the next page table.\n\n\
  However, the code advances both the source and destination addresses to\nthe last
  entries in their respective page tables, which is wrong.  The\ndestination address
  must be advanced only by the same amount as the source\naddress.\n\nIf the source
  and destination offsets within their page tables differ, the\ndestination address
  can be advanced too far, causing follow-up issues. \nFix this by advancing the destination
  address by the source advance\ndistance.\n\nWith a reproducer, we were able to trigger
  a kernel panic on x86-64.  With\nthis fix in place, we can no longer reproduce the
  issue."
