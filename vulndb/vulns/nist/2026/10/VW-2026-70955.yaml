title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  fix use-after-free in dma_chan_put() and dma_release_channel()\n\nWhen dma_device_put()
  drops the last reference on chan->device->ref,\ndma_device_release() runs and may
  free the dma_device along with its\nchannels.\n\ndma_chan_put() then still reads
  chan->device->owner via\ndma_chan_to_owner() for the trailing module_put(). KASAN
  catches it:\n\n\tslab-use-after-free in dma_chan_put+0x3e6/0x4c0\n\tRead of size
  8 by task insmod/6319\n\tFreed by task 6319:\n\t  kfree+0x225/0x470\n\t  dma_chan_put+0x395/0x4c0\n\
  \t  dmaengine_put+0xf8/0x160\n\nCache the module owner in dma_chan_put() before
  the put so the trailing\nmodule_put() does not need chan->device."
