title: A privilege escalation vulnerability in Kiteworks could allow an attacker
  who has already obtained code execution as an unprivileged backend service 
  account on the appliance to escalate to root. A privileged routine did not 
  safely handle a filesystem path that the lower-privileged account could 
  influence, allowing the attacker to cause a root-owned operation to run 
  arbitrary commands with the highest privileges. Exploitation requires existing
  local access to that service account.
