title: 'A flaw has been found in tobychui zoraxy up to 3.3.4. This impacts the function
  handleBasicAuth of the file mod/dynamicproxy/authProviders.go of the component Path
  Exception Matcher. This manipulation of the argument PathPrefix causes improper
  authorization. It is possible to initiate the attack remotely. The exploit has been
  published and may be used. Upgrading to version 3.3.5-rc1 will fix this issue. Patch
  name: 37cd0f27b17cd15cfa4af409bfec943146f5fdfe. Upgrading the affected component
  is advised.'
