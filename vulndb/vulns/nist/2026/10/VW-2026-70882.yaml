title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  check ras and obj before dereference\n\nnbio_v7_9_handle_ras_controller_intr_no_bifring()
  dereferences ras and obj\nwithout checking either for NULL. Both amdgpu_ras_get_context()
  and\namdgpu_ras_find_obj() can return NULL, e.g. during the window between\nadev->nbio.ras
  being set (early in amdgpu_ras_init(), by design, to\nenable the fatal-error interrupt
  as soon as possible) and the PCIE_BIF\nras object actually being created in RAS
  late_init. Any interrupt in that\nwindow crashes in hard-IRQ context.\n\nThis is
  analogous to commit d190b459b2a4 (\"drm/amdgpu: the warning\ndereferencing obj for
  nbio_v7_4\"), which fixed the same issue in the\nnbio_v7_4 handler.\n\nFound by
  Linux Verification Center (linuxtesting.org) with SVACE.\n\n(cherry picked from
  commit c7071767a50a32ed727cf800ac84372429e3b4b3)"
