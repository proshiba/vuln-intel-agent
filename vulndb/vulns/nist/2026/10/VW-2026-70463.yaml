title: Ghost is a Node.js content management system. From 4.39.0 until 6.64.0, 
  staff users with permission to view staff invites were able to discover the 
  secret token of pending invites, including invites for roles with higher 
  privileges than their own. This could allow a staff user to escalate their 
  privileges by accepting a pending invite. This issue is fixed in version 
  6.64.0.
