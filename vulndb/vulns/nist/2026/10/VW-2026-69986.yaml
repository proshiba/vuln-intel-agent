title: "In Bouncy Castle for Java before 1.86, neither copy of PKIXCertPathReviewer
  - org.bouncycastle.pkix.jcajce.PKIXCertPathReviewer nor the legacy org.bouncycastle.x509.PKIXCertPathReviewer
  - applied X.509 name constraints to the end-entity certificate. checkNameConstraints
  walked the path with a loop bound of index greater than zero, which is the bound
  the CA-only steps require, but index zero is the target certificate under the standard
  CertPath ordering, so the permitted and excluded subtree checks of RFC 5280 sec.
  6.1.3 (b) and (c) never ran against the leaf's subject DN or its subjectAltName.
  A chain whose leaf violated a NameConstraints extension imposed by its own issuing
  CA therefore reported isValidCertPath() true with an empty error list, while CertPathValidator.getInstance(\"\
  PKIX\", \"BC\"), which shares no code with the reviewer, rejected the identical
  chain against the identical trust anchor. An application using the reviewer to make
  the trust decision rather than for diagnostics "
