title: "Rox, the software running BeWelcome, contains a PHP object injection vulnerability resulting
  from deserialization of untrusted data. User-controlled input is passed to PHP's
  unserialize(): the POST parameter `formkit_memory_recovery` in \\\\RoxPostHandler::getCallbackAction
  and the 'memory cookie' read by \\\\RoxModelBase::getMemoryCookie (bwRemember).
  (1) If present, `formkit_memory_recovery` is processed and passed to unserialize(),
  and (2) restore-from-memory functionality calls unserialize() on the bwRemember
  cookie value. Gadget chains present in Rox and bundled libraries enable exploitation
  of object injection to write arbitrary files or achieve remote code execution. Successful
  exploitation can lead to full site compromise. This vulnerability was remediated
  with commit c60bf04 (2025-06-16)."
