title: A flaw has been found in imgproxy up to 4.0.17. Affected by this 
  vulnerability is the function sanitizeElement of the file 
  processing/svg/svg.go of the component SVG Handler. Executing a manipulation 
  can lead to cross site scripting. It is possible to launch the attack 
  remotely. The exploit has been published and may be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
