title: A vulnerability was found in Turante Sandbox Theme up to 1.5.2. It has 
  been classified as problematic. This affects the function sandbox_body_class 
  of the file functions.php. The manipulation of the argument page leads to 
  cross site scripting. It is possible to initiate the attack remotely. 
  Upgrading to version 1.6.1 is able to address this issue. The identifier of 
  the patch is 8045b1e10970342f558b2c5f360e0bd135af2b10. It is recommended to 
  upgrade the affected component. The identifier VDB-225357 was assigned to this
  vulnerability.
