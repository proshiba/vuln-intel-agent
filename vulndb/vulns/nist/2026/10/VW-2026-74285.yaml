title: "goose from 1.28.0 before 1.44.0 contains an authorization bypass vulnerability
  that allows tools to run without user approval in Manual Approval mode because persisted
  read-only annotations are never cleared by update_goose_mode. After a session uses
  Smart Approval mode, prompt-injected calls to tools annotated readOnlyHint: true
  execute without prompting, bypassing the user's selected approval mode in PermissionInspector::inspect."
