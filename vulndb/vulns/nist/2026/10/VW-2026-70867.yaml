title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  exclude old ACKs from tcp fast path\n\nExclude old ACKs before SND.UNA from the
  tcp fast path\nas well as ACKs after SND.NXT.\n\nSuch ACKs will fall through to
  the slow path, where tcp_ack()\nperforms the appropriate validation and challenge
  ACK handling\naccording to RFC5961 and Commit 3d501dd326fb1c7 (\"tcp: do not\naccept
  ACK of bytes we never sent\").\n\nThis prevents old ACKs from being accepted\nor
  modifying connection state as part of the fast path before\nappropriate ACK validation
  is applied.\nIn particular, this prevents payload carried by a segment with\nan
  excessively old ACK from advancing RCV.NXT before the ACK\nis rejected."
