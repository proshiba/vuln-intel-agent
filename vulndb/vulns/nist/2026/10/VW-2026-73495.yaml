title: Flyte 2.0.1 through 2.0.51 contains a cleartext secret storage 
  vulnerability that allows users with Pod read access to obtain secrets by 
  reading init container environment variables. The embedded secret manager 
  webhook writes base64-encoded FILE-mounted secret values into the SECRETS 
  environment variable, letting principals without Secret store access decode 
  them from the Pod spec.
