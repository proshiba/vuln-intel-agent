title: A flaw was found in FreeType, specifically within its CID font loader. A 
  remote attacker could exploit this vulnerability by tricking a user into 
  opening content that embeds or references a specially crafted CID-keyed font. 
  This crafted font can cause repeated allocations and decryptions of subroutine
  data across multiple font dictionaries, leading to excessive memory and CPU 
  consumption. This can result in a denial of service (DoS) for the application 
  or service processing the font, potentially causing it to hang or terminate.
