title: The WP Photo Album Plus plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via REQUEST_URI Session History in all versions up to, 
  and including, 9.3.03.002 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. The bypass works because esc_url_raw() strips literal angle 
  brackets but retains HTML entities, which wppaEntityDecode() silently converts
  back to live HTML tags before jQuery('#wppa-modal-container').html() renders 
  them.
