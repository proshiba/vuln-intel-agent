title: The Motors  WordPress plugin before 1.4.124 does not properly verify that
  a user is authorised to modify a listing before processing one of its listing 
  management actions, allowing authenticated attackers with subscriber-level 
  access and above to set metadata on posts they do not own, including 
  overwriting product prices. Exploitation is possible only when WooCommerce is 
  active and the Motors  WordPress plugin before 1.4.124's paid featured-listing
  option is enabled, neither of which is a default configuration.
