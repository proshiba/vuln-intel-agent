title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SDCA: bug fix while parsing mipi-sdca-control-cn-list\n\n\"struct sdca_control\"\
  \ declares \"values\" field as integer array.\nBut the memory allocated to it is
  of char array. This causes\ncrash for sdca_parse_function API. This patch addresses
  the\nissue by allocating correct data size."
