title: In Bouncy Castle for Java before 1.86, the Messaging Layer Security (MLS,
  RFC 9420) implementation did not bind an X.509 credential to a LeafNode's 
  signature_key. LeafNode.verify() checked a leaf's signature against the 
  signature_key carried in the leaf itself, while the credential's X.509 
  certificate chain was stored but never parsed or validated, so the end-entity 
  certificate's public key was never required to match signature_key as RFC 9420
  sec. 5.3 requires. A party could therefore present another party's certificate
  as its credential while signing the leaf, and the enclosing KeyPackage, with 
  an unrelated key, and be accepted under that other party's identity through 
  KeyPackage.verify() and the Group leaf-validation path. In a deployment that 
  admits external commits without an independent credential-admission check, an 
  unauthenticated attacker could be admitted under a victim's X.509 identity, 
  evict the victim (resynchronization compares whole credentials rather than 
  signing keys),
