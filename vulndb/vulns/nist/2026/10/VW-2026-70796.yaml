title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: prevent authentication frame length truncation\n\nmwifiex_cfg80211_authenticate()
  derives the authentication frame length\nfrom req->ie_len and req->auth_data_len,
  both of type size_t, but stores\nit in a u16.\n\nNL80211_ATTR_AUTH_DATA only has
  a minimum length policy. Since nla_len is\na u16, a single attribute can carry up
  to 65531 bytes of payload, so the\nsum can exceed U16_MAX before it is assigned
  to pkt_len. The truncated\npkt_len determines the skb frame area, while the copy
  length remains\nreq->auth_data_len - 4, resulting in a heap buffer overflow.\n\n\
  For example, with auth_data_len equal to 65510 and no IEs, the sum is\n65546. It
  is truncated to 10 and then reduced by four to 6. The driver\nappends only six bytes
  to the skb with skb_put(), but then copies 65506\nuser-provided bytes into the authentication
  body.\n\nReaching this path requires CAP_NET_ADMIN in the user namespace owning\n\
