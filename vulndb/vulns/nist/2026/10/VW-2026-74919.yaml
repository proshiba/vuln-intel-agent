  2.7.5, an authenticated SSH user can send a malformed protocol message while 
  opening a channel, causing an unhandled error that terminates the server 
  process and affects all connected users until restart. No confidentiality or 
  integrity impact has been identified. This issue is fixed in 2.7.5.
