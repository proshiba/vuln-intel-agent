title: Xerial snappy-java from 1.1.7.4 before 1.1.10.10 contains a double 
  release vulnerability in SnappyFramedInputStream that returns pooled buffers 
  twice when replacement allocation fails. Attackers can supply framed data with
  a large declared chunk length to trigger OutOfMemoryError, causing shared 
  backing arrays that expose or overwrite other streams' decompressed data.
