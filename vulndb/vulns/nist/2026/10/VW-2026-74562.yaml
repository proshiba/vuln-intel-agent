title: A vulnerability has been found in storyicon comfyui_segment_anything up 
  to ab6395596399d5048639cdab7e44ec9fae857a93. Affected by this issue is the 
  function SLConfig._file2dict of the file local_groundingdino/util/slconfig.py 
  of the component GroundingDINO Model Loading. Such manipulation of the 
  argument config leads to code injection. It is possible to launch the attack 
  remotely. This product takes the approach of rolling releases to provide 
  continious delivery. Therefore, version details for affected and updated 
  releases are not available. The project was informed of the problem early 
  through an issue report but has not responded yet.
