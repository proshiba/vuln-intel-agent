  outside the restricted environment. The vulnerability is due to weakness in the
  design of access control implementation in application software. \n\nOther related
  CVE's are CVE-2025-14096 & CVE-2025-14097.\n\nAffected customers have been informed
  about this vulnerability. This CVE is being published to provide transparency.\n\
