title: "Memory allocation with excessive size value, Improper handling of length parameter
  inconsistency vulnerability in Apache Thrift \nnodejs and D lang bindings.\n\nBoth
  bindings' WebSocket server transports read the payload length out of the frame header
  and allocate that many bytes immediately, without checking that the bytes have arrived.
  A single ~14-byte frame therefore commits as much memory as it cares to declare
  -- measured at 513 MiB against the Node.js server and 2 GiB against the D transport
  -- and in the Node.js case the connection is left open afterwards, so the frame
  can simply be sent again.\n\n\n\n\nThis issue affects Apache Thrift before 0.25.0.\n\
  \n\n\nUsers are recommended to upgrade to version 0.25.0, which fixes the issue."
