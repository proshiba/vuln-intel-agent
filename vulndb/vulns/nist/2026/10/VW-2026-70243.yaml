title: A vulnerability has been found in feelec-yishu feelcrm-os 1.0.0. Affected
  by this vulnerability is the function IndexController::index of the file 
  App/ThinkPHP/Common/functions.php of the component Crm Endpoint. Such 
  manipulation of the argument redirect_url leads to cross site scripting. The 
  attack may be performed from remote. The exploit has been disclosed to the 
  public and may be used. The project was informed of the problem early through 
  an issue report but has not responded yet.
