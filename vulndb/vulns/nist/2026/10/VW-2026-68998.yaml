title: AJA HELO Plus firmware before 2.1.7 contains a stored cross-site 
  scripting vulnerability that allows unauthenticated attackers with network 
  access to inject malicious JavaScript by setting an unsanitized 
  eParamID_SystemName value through the /config?action=set web configuration 
  API. Attackers can exploit this flaw when device authentication is disabled to
  persistently execute arbitrary script in the browser of any administrator who 
  opens the web management interface, enabling theft of stored secrets such as 
  web UI credentials, RTMP stream keys, publish URLs, and NFS/SMB share 
  credentials, as well as hijacking of the authenticated session.
