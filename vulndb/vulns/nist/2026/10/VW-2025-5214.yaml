  to inject arbitrary code which can compromise an affected device.\nThis issue is
  not exploitable from the Junos CLI.\nThis issue affects Junos OS: \n\n\n\n  *  All
  versions before 21.2R3-S9,\n  *  21.4 versions before 21.4R3-S10, \n  *  22.2 versions
