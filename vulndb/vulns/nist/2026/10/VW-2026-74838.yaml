title: The FreeRDP client 3.0.0 before 3.32.0 does not check a server-selected 
  PROTOCOL_RDSTLS or PROTOCOL_HYBRID_EX against its enabled protocol set in 
  nego_process_negotiation_response(), allowing a security protocol downgrade. A
  malicious server or man-in-the-middle can select RDSTLS to override /sec:nla 
  pinning, complete authentication with an all-zero cookie, and receive the 
  user's cleartext password in the Client Info PDU.
