title: 'ClipBucket v5 is an open source video sharing platform. ClipBucket v5 through
  build 5.5.2 #145 allows stored cross-site scripting (XSS) in multiple video and
  photo metadata fields. For videos the Tags field and the Genre, Actors, Producer,
  Executive Producer, and Director fields in Movieinfos accept user supplied values
  without adequate sanitization. For photos the Photo Title and Photo Tags fields
  accept user supplied values without adequate sanitization. A regular user who can
  edit a video or photo can inject script (for example by supplying a value such as
  a closing delimiter followed by a script element). The injected script executes
  when any user, including an unauthenticated visitor or an administrator, views the
  affected video or photo page. Although cookies are set with the HttpOnly attribute
  and cannot be read directly, the injected script can issue fetch requests to endpoints
  such as admin_area pages and exfiltrate their contents or trigger unintended actions.
  Version 5.5.2 b'
