title: JetLinks Community through 2.10.0 contains a missing authorization 
  vulnerability that allows users with only query access to enable or disable 
  any alarm configuration. Because the AlarmConfigController _enable and 
  _disable endpoints lack the save action annotation, attackers can toggle 
  alarms by id to silence alerts for monitored devices.
