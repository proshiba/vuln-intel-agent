title: The All in One SEO – AI SEO Plugin to Boost SEO Rankings & Traffic 
  (Schema, Local SEO, Sitemap & SEO Insights) plugin for WordPress is vulnerable
  to DOM-Based Cross-Site Scripting via URL Pathname in all versions up to, and 
  including, 5.0.1.1 due to insufficient input sanitization and output escaping.
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user visits a crafted URL. 
  Exploitation requires the victim to hold the aioseo_manage_seo capability and 
  to open the SEO Preview panel in the WordPress admin toolbar while visiting a 
  page with a malicious payload embedded in the URL pathname.
