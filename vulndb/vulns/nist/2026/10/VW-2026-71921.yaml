title: Excelize is a Go language library for reading and writing Microsoft Excel
  spreadsheets. From 2.9.0 to 2.11.0, GetSlicers checks for ExtLst but 
  dereferences ws.Drawing without checking whether the independently optional 
  drawing element exists. File.GetSlicers reads ws.Drawing.RID after seeing a 
  worksheet extLst element even when the independently optional worksheet 
  drawing element is absent. When a crafted worksheet contains an extLst element
  without a drawing element and the application calls GetSlicers, the nil 
  ws.Drawing pointer is dereferenced while resolving the drawing relationship, 
  allowing an attacker to panic and terminate an unprotected process. No fixed 
  version is available as of this review.
