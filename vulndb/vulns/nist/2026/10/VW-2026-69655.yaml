title: YesWiki before 4.6.7 contains a server-side request forgery vulnerability
  that allows unauthenticated attackers to make server-side GET requests by 
  supplying an unvalidated actor URL to the Bazar abonnements sync action. 
  Attackers can target internal hosts or cloud metadata endpoints and chain 
  attacker-controlled outbox first/next links, with fetched responses stored as 
  readable Bazar entries.
