title: A vulnerability has been found in Ollama up to 0.34.1. The affected 
  element is the function IsValid of the file types/model/name.go of the 
  component Pull API. The manipulation leads to server-side request forgery. It 
  is possible to initiate the attack remotely. The exploit has been disclosed to
  the public and may be used. Upgrading to version 0.34.2 is sufficient to fix 
  this issue. The identifier of the patch is 
  dfabde4539e42ba1e1eab50a3a50b88aea7958a0. It is suggested to upgrade the 
  affected component.
