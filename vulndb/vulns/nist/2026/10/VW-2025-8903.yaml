title: "A vulnerability in the web-based management interface of Cisco Catalyst Center
  could allow an unauthenticated, remote attacker to conduct a cross-site scripting
  (XSS) attack against a user of the interface of an affected device.\r\n\r\nThis
  vulnerability is due to insufficient validation of user input. An attacker could
  exploit this vulnerability by persuading a user of the web-based management interface
  to click a crafted link. A successful exploit could allow the attacker to execute
  arbitrary script code in the context of the affected interface or access sensitive,
  browser-based information."
