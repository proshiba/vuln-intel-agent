title: QGIS is a free, open source, cross-platform geographic information 
  system. Prior to 3.44.12 and 4.0.0 through 4.2.3, QGIS Server renders feature 
  data in WFS3 (OGC API Features) HTML responses without HTML escaping. 
  Attacker-controlled feature.properties values from a published writable vector
  layer reach resources/server/api/ogc/templates/wfs3/getFeatures.html through 
  QgsServerOgcApiHandler::htmlDump and the if_nullptr_null_str callback. A user 
  who opens an items HTML page can execute stored markup or script in the QGIS 
  Server origin, which can expose the viewer's session data or issue 
  authenticated requests with the viewer's privileges. This issue is fixed in 
  version 3.44.12.
