title: phpMyFAQ through 4.1.10 contains a missing authorization vulnerability in
  the MCP server faq_search tool that allows MCP clients to read restricted FAQs
  because Search::searchDatabase() never applies user or group permission 
  checks. Attackers connected to the phpmyfaq:mcp:server can issue search 
  queries to retrieve the full question and answer text of active FAQs 
  restricted to specific users or groups.
