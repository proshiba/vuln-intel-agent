title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Use array_map_meta_equal for percpu array inner map replacement\n\npercpu_array_map_ops.map_meta_equal
  points to the generic\nbpf_map_meta_equal(), which does not compare max_entries.\
  \  When a\npercpu array serves as an inner map, replacing it with one that has\n\
  fewer max_entries bypasses the check.  Since percpu_array_map_gen_lookup()\ninlines
  the original template's index_mask as a JIT immediate, a lookup\non the replacement
  map can access pptrs[] out of bounds.\n\nPoint percpu_array_map_ops.map_meta_equal
  to array_map_meta_equal(),\nwhich already enforces the max_entries equality check.\n\
  \nAdd a selftest to verify that replacing a percpu array inner map with\na differently-sized
  one is rejected."
