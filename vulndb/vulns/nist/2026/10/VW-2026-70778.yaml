title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/ttm:
  fix swapped-out resources never leaving their bulk_move range\n\nttm_tt_swapout()
  returns the number of pages swapped out on success and\na negative error code on
  failure; for a populated ttm it never returns\nzero. Commit b2ed01e7ad3d (\"drm/ttm:
  Fix ttm_bo_swapout() infinite LRU\nwalk on swapout failure\") moved the bulk_move
  bookkeeping in\nttm_bo_swapout_cb() under \"if (!ret)\", so the\nttm_resource_del_bulk_move_unevictable()
  / ttm_resource_move_to_lru_tail()\npair is now skipped on every successful swapout.
  The equivalent change\nfor the shrinker in commit 1d59f36e95f7 (\"drm/ttm: Fix ttm_bo_shrink()\n\
  infinite LRU walk on backup failure\") tests \"lret > 0\", which is what\nwas intended
  here as well.\n\nBefore b2ed01e7ad3d the resource was taken off the bulk_move before
  the\nswapout; since then a swapped-out resource stays inside its BO's\nbulk_move
  range (and on the manager LRU) although it is unevictable.\nWhen it is later "
