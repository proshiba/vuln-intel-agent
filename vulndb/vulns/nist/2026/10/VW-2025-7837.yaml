title: 'Vulnerability in the Portable Clusterware component of Oracle Database Server.  Supported
  versions that are affected are 19.3-19.28, 21.3-21.19 and  23.4-23.9. Easily exploitable
  vulnerability allows unauthenticated attacker with network access via Bonjour to
  compromise Portable Clusterware.  While the vulnerability is in Portable Clusterware,
  attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in  unauthorized read access to a subset
  of Portable Clusterware accessible data. CVSS 3.1 Base Score 5.8 (Confidentiality
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N).'
