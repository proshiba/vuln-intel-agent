title: ImageSharp is a 2D graphics library. From 2.0.0 until 4.1.2, the TIFF 
  CCITT Group 3 encoder allocates an undersized compressed-data buffer for 
  narrow 1-bit images. TiffCcittCompressor.Initialize does not reserve enough 
  space for the row data and T4 end-of-line codes, and 
  T4BitCompressor.CompressStrip reaches unchecked writes when 
  TiffCompression.CcittGroup3Fax is selected directly or inherited from decoded 
  TIFF metadata. An attacker-controlled encode or decode-and-re-encode flow can 
  write beyond the logical output span, corrupt process memory, and terminate 
  the process. This issue is fixed in version 4.1.2.
