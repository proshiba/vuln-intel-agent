title: SnapOtter 1.15.10 through 2.2.0 contains a missing authorization 
  vulnerability that allows any authenticated principal to call the 
  /api/v1/upload, /api/v1/preview and /api/v1/preview/generate handlers without 
  permission checks. Attackers holding even a settings:read-scoped API key can 
  stage arbitrary files outside storage quota, served unauthenticated via 
  /api/v1/download, and feed crafted input to image and video decoders.
