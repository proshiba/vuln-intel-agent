title: FacturaScripts before version 2026.7 contains a PHP object injection 
  vulnerability in WidgetSelect::processFormData() that allows authenticated 
  attackers to trigger unserialize() on raw POST data without an allowed_classes
  filter for multiple-select fields. Attackers can submit a serialized 
  XLSXWriter object as the field value to invoke its __destruct() method, 
  deleting arbitrary attacker-specified files such as config.php or backup data,
  resulting in denial of service and potential application reinstall hijack.
