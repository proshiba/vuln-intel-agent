title: A flaw was found in Red Hat Quay. The build trigger management 
  application programming interface (API) fails to verify whether a requested 
  trigger belongs to the specified repository. An authenticated user with 
  administrative access to any repository can view, modify, or permanently 
  delete build triggers and associated write tokens of another repository if 
  they know the victim trigger's universally unique identifier (UUID).
