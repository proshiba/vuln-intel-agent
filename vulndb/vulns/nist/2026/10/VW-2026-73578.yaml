  key vulnerability in Tool.class.php that allows unauthenticated attackers to bypass
  API access checks by spoofing the Host header. Attackers can send Host: localhost
  with private_api_key=dev772277 and the default allowed URL to retrieve member emails,
  IP addresses, phone numbers, and bank account fields.'
