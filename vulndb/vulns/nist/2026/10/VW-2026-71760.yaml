title: Operating system command injection vulnerability in the SVN integration 
  component of BugTracker.NET. The application incorporates the value of the 
  field corresponding to the repository into an svn.exe command without properly
  validating it. An authenticated user with administrator privileges could store
  manipulated arguments in the database and subsequently cause them to be 
  processed by the revision comparison functionality. A successful exploit could
  allow the execution of arbitrary commands with the privileges of the account 
  used by the application. To exploit this vulnerability, svn.exe must be 
  installed and capable of being invoked by the service.
