title: "The vulnerability allows any application installed on the device to read SMS/MMS
  data and metadata from the system-provided Telephony provider without permission,
  user interaction, or consent. The user is also not notified that SMS data is being
  accessed. This could lead to sensitive information disclosure and could effectively
  break the security provided by SMS-based Multi-Factor Authentication (MFA) checks.\
  \ \n\nThe root cause is a combination of missing permissions for write operations
  in several content providers (com.android.providers.telephony.PushMessageProvider,
  com.android.providers.telephony.PushShopProvider, com.android.providers.telephony.ServiceNumberProvider),
  and a blind SQL injection in the update method of those providers."
