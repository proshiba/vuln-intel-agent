title: A security flaw has been discovered in OGRECave Ogre up to 14.4.1. This 
  issue affects the function STBIImageCodec::encode of the file 
  /ogre/PlugIns/STBICodec/src/OgreSTBICodec.cpp of the component Image Handler. 
  The manipulation results in heap-based buffer overflow. The attack is only 
  possible with local access. The exploit has been released to the public and 
  may be exploited.
