title: The Unlimited Elements for Elementor WordPress plugin before 2.0.21 does 
  not sanitise file paths inside uploaded archives before extracting them, 
  allowing authenticated users with access to its asset-management feature 
  (Administrators by default, or Editors when a non-default Unlimited Elements 
  for Elementor WordPress plugin before 2.0.21 setting is enabled) to write 
  arbitrary files, including executable PHP, outside the intended upload 
  directory on servers where the PHP zip extension is unavailable, leading to 
  Remote Code Execution.
