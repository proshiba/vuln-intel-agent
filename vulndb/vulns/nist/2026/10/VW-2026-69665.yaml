title: A weakness has been identified in onetwothreeneth 
  HospitalManagementSystem up to 9ef91ed6007314b6473110ed699dff76d158f61d. This 
  affects the function get of the file edit_accounts.php. This manipulation of 
  the argument user_id/patient_id/physician_id/discounts_id/services_id causes 
  sql injection. Remote exploitation of the attack is possible. The exploit has 
  been made available to the public and could be used for attacks. This product 
  follows a rolling release approach for continuous delivery, so version details
  for affected or updated releases are not provided. The project was informed of
  the problem early through an issue report but has not responded yet.
