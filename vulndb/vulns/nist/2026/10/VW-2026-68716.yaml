title: A vulnerability was found in AdithyaYelloju Restaurant-Management-System 
  up to 7f0e7e84255e8fcfd488e83f8f91451bbbff6b9c. This issue affects the 
  function mysqli_query of the file admin/delete1.php of the component 
  Unauthenticated Action Script. Performing a manipulation of the argument ID 
  results in sql injection. The attack can be initiated remotely. The exploit 
  has been made public and could be used. Continious delivery with rolling 
  releases is used by this product. Therefore, no version details of affected 
  nor updated releases are available. The project was informed of the problem 
  early through an issue report but has not responded yet.
