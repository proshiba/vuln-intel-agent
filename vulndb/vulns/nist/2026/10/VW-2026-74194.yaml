title: A vulnerability was determined in Edimax BR-6208AC 1.32. This issue 
  affects some unknown processing of the file /goform/formAutoFWupgrade. 
  Executing a manipulation of the argument tftpsIP can lead to command 
  injection. The attack may be performed from remote. The exploit has been 
  publicly disclosed and may be utilized. The vendor was contacted early about 
  this disclosure but did not respond in any way. This vulnerability only 
  affects products that are no longer supported by the maintainer.
