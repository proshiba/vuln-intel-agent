title: The Greenshift – animation and page builder blocks plugin for WordPress 
  is vulnerable to Reflected Cross-Site Scripting via '{{GET:}}' Dynamic 
  Placeholder in all versions up to, and including, 13.2.0 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
  as clicking on a link. This requires a site administrator to have configured 
  an element block's Custom JS field to include a {{GET:...}} placeholder and 
  for that JS to contain the token 'import', which routes the substituted value 
  to the unescaped raw echo branch inside a &lt;script type="module"&gt; tag.
