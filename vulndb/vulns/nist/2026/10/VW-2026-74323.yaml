title: IBM Power Systems Firmware FW1060.00 through FW1060.81 is affected by a 
  vulnerability in host firmware configuration parsing. An attacker with 
  authenticated service-level access to the FSP can write specially crafted 
  configuration data to cause memory corruption in the host firmware boot stage 
  during system IPL, compromising the host firmware boot stack and the 
  hypervisor subsequently loaded by it. Successful exploitation results in a 
  confidentiality, integrity, and availability impact to the managed system.
