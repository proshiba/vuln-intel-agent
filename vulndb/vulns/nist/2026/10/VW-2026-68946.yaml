title: A stored cross-site scripting (XSS) weakness in Kiteworks Core could 
  allow an administrator holding only a single, narrowly scoped delegated 
  permission to store crafted content that later executes arbitrary JavaScript 
  in the authenticated session of a System Administrator who views the affected 
  page. This could have permitted the lower-privileged administrator to escalate
  to full administrative control of the tenant, including the creation of a new 
  administrative account.
