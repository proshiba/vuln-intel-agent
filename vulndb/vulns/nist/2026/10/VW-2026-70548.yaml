title: vLLM is an inference and serving engine for large language models. Prior 
  to 0.30.0, a caller can use the request-level media_io_kwargs field to select 
  the GLMGA video backend and supply large values for the fps and max_frames 
  options without a strict work ceiling. GLMGA constructs and deduplicates an 
  attacker-sized pre-decode frame-index list, allowing a compact request and 
  tiny valid video to consume disproportionate CPU time and memory in the shared
  media-loading executor. This issue is fixed in version 0.30.0.
