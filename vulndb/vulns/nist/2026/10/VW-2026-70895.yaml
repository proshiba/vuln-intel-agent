title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  PPC: Book3S HV: fix use-after-free in kvmhv_emulate_tlbie_all_lpid()\n\nkvmhv_emulate_tlbie_all_lpid()
  iterates the nested-guest IDR and drops\nmmu_lock before calling kvmhv_emulate_tlbie_lpid(),
  but does not hold a\nreference on the kvm_nested_guest pointer obtained from the
  IDR.  A\nconcurrent vCPU issuing a single-LPID tlbie (is=2, ric=2) can race\nthrough
  kvmhv_flush_nested() -> kvmhv_remove_nested() -> idr_remove /\n--refcnt -> kvmhv_release_nested()
  -> kfree(gp) in that window, leaving\nthe iterating vCPU with a dangling pointer.\
  \  The subsequent\nmutex_lock(&gp->tlb_lock) and accesses to gp->shadow_pgtable,\n\
  gp->shadow_lpid and gp->l1_host all touch freed memory.  The free path\nis fully
  L1-controlled.\n\nFix this by incrementing gp->refcnt inside the loop before dropping\n\
  mmu_lock, mirroring what kvmhv_get_nested() does, and releasing the\nreference with
