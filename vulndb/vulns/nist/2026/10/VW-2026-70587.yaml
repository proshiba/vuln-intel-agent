title: A flaw was found in sssd. A local attacker can cause a Denial of Service 
  (DoS) by sending a crafted Pluggable Authentication Module (PAM) request 
  containing a zero-length authentication token to the responder socket. Due to 
  missing input validation, the service attempts to read beyond buffer 
  boundaries when processing the token, causing the PAM responder to crash.
