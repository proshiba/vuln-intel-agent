title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: only group hidden BSSes with beacon entries\n\nWhen a probe response for
  an unknown BSS comes in, __cfg80211_bss_update()\nlooks for an existing entry with
  the same BSSID and a hidden (zero-length\nor NUL-filled) SSID, and if it finds one
  it groups them, using the beacon\nIEs from the existing entry.\n\nBut that could
  find another entry without a beacon, if it was also from a\nprobe response (with
  SSID), so there's a group without beacon elements.\n\nIf a beacon with a hidden
  SSID for that BSSID arrives later,\ncfg80211_combine_bsses() goes looking for the
  probe response entries that\nbelong to it - i.e. entries with the same BSSID and
  channel that have no\nbeacon IEs - and finds those two. They are already grouped
  with each\nother, so it hits its\n\n  WARN_ON_ONCE(bss->pub.hidden_beacon_bss)\n\
  \  WARN_ON_ONCE(!list_empty(&bss->hidden_list))\n\nwhich are there because an entry
  without beacon elements is not supposed\nto be "
