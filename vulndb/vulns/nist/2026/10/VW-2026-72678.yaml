title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxen/netfront:
  drop RX packets with a short Ethernet header\n\nhandle_incoming_queue() pulls pull_to
  bytes into the head before\ncalling eth_type_trans().  pull_to is the length of
  the first RX slot,\ncapped at RX_COPY_THRESHOLD, and that length comes from the
  backend.\nNothing checks it against ETH_HLEN.\n\nIf the first slot is shorter than
  ETH_HLEN and more slots follow, the\nhead ends up shorter than an Ethernet header
  while skb->len is longer,\nand eth_type_trans() BUG()s in __skb_pull().  If the
  whole packet is\nshorter than ETH_HLEN, eth_type_trans() reads the header past the
  end\nof the data instead.\n\nPull at least ETH_HLEN, and drop the packet if that
  fails, which also\ndrops packets too short to hold an Ethernet header.  This also
  checks\nthe return value of the pull, which was ignored."
