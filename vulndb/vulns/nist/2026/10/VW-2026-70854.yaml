title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-buf:
  Fix silent overflow for phys vec to sgt\n\nIn case MMIO size is bigger than 4G and
  peer2peer DMA goes\nthrough host bridge, we trigger a code path that assigns the\n\
  total linked IOVA (which is greater than 4G) to mapped_len.\n\nPreviously, `mapped_len`
  was declared as 32-bit `unsigned int`.\nWhen accumulating `size_t` lengths, this
  leads to a silent wrap-around.\nThis truncation causes truncated lengths to be passed
  to functions\nlike `fill_sg_entry()`.\n\nFix this by changing `mapped_len` to `size_t`
  (64-bit). While\nat it, fix similar potential overflow issues in `calc_sg_nents`\n\
  by using `check_add_overflow()` for `nents` and using\n`unsigned int` for the loop
  iterator in `fill_sg_entry` to match."
