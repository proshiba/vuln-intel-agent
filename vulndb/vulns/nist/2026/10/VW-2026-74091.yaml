title: Open WebUI from 0.9.0 before 0.11.4 contains a denial of service 
  vulnerability that allows authenticated users with automations permission to 
  stall the instance by submitting unsatisfiable recurrence rules. Attackers can
  repeatedly send rules like February 30th to the automations create or update 
  endpoints, blocking the shared event loop for seconds per request.
