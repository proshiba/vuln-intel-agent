title: "The Avada | Website Builder For WordPress & WooCommerce theme for WordPress
  is vulnerable to Stored Cross-Site Scripting via the user profile 'Author Page'
  social link contact-method fields (author_facebook, author_twitter, author_linkedin,
  author_dribble, author_whatsapp, author_email) in versions up to, and including,
  7.16.1. Avada registers these fields through the user_contactmethods filter and,
  on the author archive, emits them inside an anchor href using only esc_attr() in
  Fusion_Social_Icon::get_markup(), which escapes HTML metacharacters but does not
  reject dangerous URL schemes such as javascript:. This makes it possible for authenticated
  attackers, with Subscriber-level access and above, to inject arbitrary web scripts
  in pages that will execute whenever a user accesses their author page and clicks
  the injected social icon (a click is required, and the site must have 'Open Social
  Icons in a New Window' set to Off so the browser doesn't block the javascript: URL
  from opening i"
