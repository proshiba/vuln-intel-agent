title: Backstage is an open framework for building developer portals. Prior to 
  2.2.4, the @backstage/plugin-techdocs-backend package is affected by improper 
  input validation in techdocs static content requests. When using the Azure 
  Blob Storage provider, an authenticated Backstage user may be able to read 
  restricted TechDocs content when entity-level permissions are enabled. 
  Deployments that intentionally disable the default backend authentication 
  policy may have broader exposure. This issue is fixed in version 2.2.4.
