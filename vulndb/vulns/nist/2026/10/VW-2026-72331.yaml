title: "An authorization vulnerability in Apache DolphinScheduler allows authenticated
  users to retrieve other users' account information through the /dolphinscheduler/users/list-all
  endpoint without the required permissions.\n\n\n\nThe endpoint fails to enforce
  the necessary authorization checks before returning user account information. As
  a result, an authenticated user can access account information they are not authorized
  to view.\n\n\n\nSuccessful exploitation may expose sensitive user information and
  facilitate account enumeration.\n\n\n\nThis issue affects Apache DolphinScheduler:
  before 3.4.3.\n\n\n\nUsers are recommended to upgrade to version 3.4.3, which fixes
  the issue."
