title: FusionPBX through 5.6.5 contains an OS command injection vulnerability in
  call_recordings::download() that allows unauthenticated attackers to execute 
  commands by placing calls with malicious caller ID values. When the 
  record_name filename template is enabled, attackers can embed shell 
  metacharacters like $(...) in the Caller-ID name or number, executing commands
  as the web server user once a privileged user downloads multiple recordings as
  a ZIP.
