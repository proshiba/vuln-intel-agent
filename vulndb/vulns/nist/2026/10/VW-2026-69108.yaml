title: The Social Media Share Buttons & Social Sharing Icons plugin for 
  WordPress is vulnerable to Reflected Cross-Site Scripting via URL in all 
  versions up to, and including, 3.0.1 due to insufficient input sanitization 
  and output escaping. This makes it possible for unauthenticated attackers to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. Exploitation requires the victim to be on a mobile 
  user-agent and to click the WeChat share icon, though once the dialog opens, 
  script execution is automatic and requires no further user interaction.
