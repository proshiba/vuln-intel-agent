title: "Out-of-bounds read and write in the CPC sketch deserialization of Apache DataSketches
  C++ (repo: datasketches-cpp).\n\nA crafted serialized CPC sketch passed to cpc_sketch::deserialize(),
  from either a byte buffer or a stream, can cause the decompressor to read past the
  end of the compressed data, because the read position was only checked after decoding
  finished. In the hybrid flavor, it can also cause a write outside an internal heap
  buffer, because decoded row indices were not validated. Several other header fields
  and decoded values, including lg_k, were also not validated. This can corrupt heap
  memory, causing a crash and potentially enabling further exploitation.\n\nThis issue
  affects Apache DataSketches C++: from 2.0.0-incubating before 5.3.0. Only applications
  that deserialize CPC sketches from untrusted sources are affected.\n\nUsers are
  recommended to upgrade to version 5.3.0, which fixes this issue."
