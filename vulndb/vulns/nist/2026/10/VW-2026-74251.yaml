  Affected by this issue is the function OptionsQuery::resolve of the file 
  src/Option/OptionsQuery.php of the component Dynamic Option Generation. The 
  manipulation leads to authorization bypass. The attack is possible to be 
  carried out remotely. Upgrading to version 4.9.6 and 5.6.0 can resolve this 
  issue. You should upgrade the affected component.
