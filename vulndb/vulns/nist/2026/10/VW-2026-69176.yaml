title: n8n versions before 2.39.6 and 2.40.0 before 2.40.1 contain an unescaped 
  parameter interpolation vulnerability in SendGrid, Freshservice, and 
  ServiceNow nodes that allows attackers to bypass filters by breaking out of 
  query literals. Attackers can exploit this by binding vulnerable node 
  parameters to untrusted external input to widen single-record lookups into 
  match-all queries, exposing bulk data including contact lists, tickets, and 
  directory entries.
