title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: cortina: Ack RX overrun interrupt correctly\n\nThe RX overrun interrupt
  is reported in interrupt status register 4, but\ngmac_irq() acknowledges it using
  the RX descriptor error bit from status\nregister 0. For GMAC0 this writes the GMAC1
  overrun bit, while for GMAC1\nthe shift leaves no bit in the 32-bit register.\n\n\
  Acknowledge the same per-port RX overrun bit that was detected."
