title: A flaw was found in Katello where the Docker Tags repositories API does 
  not properly enforce organization scoping when listing repositories for a 
  Docker meta tag. An authenticated user with permission to view products in one
  organization may be able to retrieve repository metadata associated with 
  Docker tags belonging to another organization by supplying the tag identifier.
  This can result in unauthorized disclosure of repository configuration 
  information across organization boundaries.
