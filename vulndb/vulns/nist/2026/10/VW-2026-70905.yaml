title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: Fix parent socket leak in iso_conn_ready()\n\niso_get_sock() returns the parent
  socket with a reference held, which is\ndropped by sock_put() once the child socket
  has been set up. The error\npath taken when iso_sock_alloc() fails only calls release_sock()
  and\nreturns, leaking the reference and thus the parent socket itself.\n\nDrop the
  reference on that path as well."
