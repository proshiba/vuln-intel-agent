title: "Improper Verification of Source of a Communication Channel in the ADS discovery
  of the Go implementation of Apache PLC4X (PLC4Go) allows an attacker able to send
  UDP datagrams to the discovering host to redirect subsequent connections to an arbitrary,
  attacker-chosen address. The discovery result's connection \naddress was derived
  from the AmsNetId claimed in the response body rather than from the datagram's actual
  source address. One spoofed discovery response can therefore insert an inventory
  entry pointing at any host, including hosts outside the local network, and an application
  that connects to discovered devices\nwill open its ADS session, including any configured
  route credentials, to that host.\n\nAdditionally, discovery listeners in both implementations
  can be disabled by a single malformed datagram:\n- In PLC4Go ADS discovery, a short
  version block causes a panic that ends the listener for the rest of the discovery
  call, so legitimate devices answering afterwards are not reported."
