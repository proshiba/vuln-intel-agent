title: A vulnerability was determined in 1024-lab smart-admin up to 3.30.0. 
  Affected by this vulnerability is an unknown functionality of the file 
  /support/config/queryByKey of the component Support Config Query. Executing a 
  manipulation of the argument configKey can lead to improper access controls. 
  The attack can be executed remotely. The exploit has been publicly disclosed 
  and may be utilized. The project was informed of the problem early through an 
  issue report but has not responded yet.
