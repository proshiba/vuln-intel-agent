title: A security flaw has been discovered in prasathmani TinyFileManager up to 
  2.6. The impacted element is the function move_uploaded_file of the file 
  tinyfilemanager.php. Performing a manipulation of the argument fullpath 
  results in unrestricted upload. The attack is possible to be carried out 
  remotely. The exploit has been released to the public and may be used for 
  attacks. The vendor was contacted early about this disclosure but did not 
  respond in any way.
