title: "A malicious image can advertise DiffIDs from another image while containing
  different layer contents. In affected versions, BuildKit could use the advertised
  DiffIDs to derive cache and snapshot identity without validating that they matched
  the actual layer contents.\n\nIf a BuildKit daemon with shared or persistent cache
  first processes such a malicious image, a later build using the victim image may
  mount the attacker-controlled layer contents as the base image. This can allow code
  from the malicious image to run in the victim build, for example by replacing a
  commonly executed path such as /bin/sh. The attacker-controlled code may read build
  secrets mounted into the build, access other build resources, alter output artifacts,
  or hang the build.\n\nThe issue affects both regular snapshotters and lazy-pulling
  snapshotters such as stargz."
