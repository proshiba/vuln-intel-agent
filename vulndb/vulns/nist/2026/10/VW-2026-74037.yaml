title: FreeRDP 3.0.0 before 3.32.0 contains an improper certificate validation 
  vulnerability in freerdp_http_request() in libfreerdp/utils/http.c that 
  completes TLS handshakes without verifying the server certificate chain. 
  On-path attackers can impersonate login.microsoftonline.com in the Azure AD 
  authentication flow to capture OAuth authorization codes and substitute the 
  OpenID discovery document.
