title: python-socketio is a Python implementation of the Socket.IO realtime 
  client and server. A remote code execution vulnerability in python-socketio 
  versions prior to 5.14.0 allows attackers to execute arbitrary Python code 
  through malicious pickle deserialization in multi-server deployments on which 
  the attacker previously gained access to the message queue that the servers 
  use for internal communications. When Socket.IO servers are configured to use 
  a message queue backend such as Redis for inter-server communication, messages
  sent between the servers are encoded using the `pickle` Python module. When a 
  server receives one of these messages through the message queue, it assumes it
  is trusted and immediately deserializes it. The vulnerability stems from 
  deserialization of messages using Python's `pickle.loads()` function. Having 
