title: A flaw has been found in erzhongxmu JEEWMS up to 2026.09.27-W39. The 
  affected element is the function getbinall/getbinallagv of the file 
  src/main/java/com/zzjee/md/controller/MdBinController.java. Executing a 
  manipulation of the argument binstore/binid/des/cengshu can lead to sql 
  injection. The attack may be launched remotely. The exploit has been published
  and may be used. The vendor was contacted early about this disclosure but did 
  not respond in any way.
