title: "In Progress® Telerik® Report Server prior to version 12.2.26.1007, a stored
  cross-site scripting vulnerability in the shared reporting engine allows an authenticated
  report author to embed javascript: or vbscript: URLs in report navigation actions
  or HTML text box links. When another user views the malicious report and the embedded
  navigation is triggered, attacker-controlled script can execute in the web report
  viewer's origin. In a multi-user Report Server deployment, this can enable privilege
  escalation by performing actions in a higher-privilege user's authenticated session,
  including an administrator's session."
