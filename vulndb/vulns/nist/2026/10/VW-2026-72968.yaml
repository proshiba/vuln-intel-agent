title: The rtMedia for WordPress, BuddyPress and bbPress plugin for WordPress is
  vulnerable to limited file deletion due to insufficient file path validation 
  in the process function in all versions up to, and including, 4.7.13 This 
  makes it possible for unauthenticated attackers to delete arbitrary safe files
  on the server.. The public nonce (rtmedia_upload_nonce) is emitted into 
  frontend JavaScript on any page rendering the rtMedia gallery or upload 
  shortcode, making it retrievable by unauthenticated visitors without any prior
  authentication or privileged action.
