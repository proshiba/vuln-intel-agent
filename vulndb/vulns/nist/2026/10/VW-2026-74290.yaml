title: Rapyd Admin from 9.0.0 before 9.20.0 contains a hard-coded credentials 
  vulnerability that allows remote unauthenticated attackers to gain super-admin
  access through an AuthSeeder-created admin@laravel account with password 
  admin. The account is seeded by the setup installer and silently re-created on
  every rpd:make run, letting attackers log in as a global super admin bypassing
  per-record authorization and tenant scoping.
