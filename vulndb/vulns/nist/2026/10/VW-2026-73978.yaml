title: A use-after-free flaw was found in mutter in the Wayland color-management
  ICC image-description path. A local attacker who can run a malicious Wayland 
  client can destroy a wp_image_description_v1 resource while an asynchronous 
  ICC file read is still in progress. When the read completes, the compositor 
  uses the freed wl_resource, writes into freed memory, and frees a pointer 
  derived from that memory. This can crash the GNOME session and may allow 
  arbitrary code execution within the compositor process.
