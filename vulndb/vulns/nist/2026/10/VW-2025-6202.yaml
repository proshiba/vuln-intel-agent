title: A security vulnerability has been detected in TRENDnet TEW-800MB 1.0.1.0.
  Affected is the function do_setWizard_asp of the file /goform/wizardset of the
  component Management Interface. The manipulation of the argument 
  WizardConfigured leads to command injection. The attack may be initiated 
  remotely. The exploit has been disclosed publicly and may be used. The vendor 
  was contacted early about this disclosure but did not respond in any way.
