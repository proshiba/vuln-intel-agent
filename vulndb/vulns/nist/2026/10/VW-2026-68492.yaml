title: A vulnerability was identified in OS4ED openSIS-Classic up to 9.3. The 
  impacted element is the function DBQuery_assignment of the file 
  modules/grades/Assignments.php of the component Assignment Management 
  Endpoint. The manipulation of the argument Tables leads to sql injection. It 
  is possible to initiate the attack remotely. The exploit is publicly available
  and might be used. The project was informed of the problem early through an 
  issue report but has not responded yet.
