title: A security vulnerability has been detected in vllm-project vLLM up to 
  0.31.0. This impacts the function conv_ssm_forward of the file 
  vllm/model_executor/layers/mamba/mamba_mixer2.py of the component Completions 
  Request Handler. The manipulation leads to out-of-bounds read. The attack is 
  possible to be carried out remotely. The exploit has been disclosed publicly 
  and may be used. The project was informed of the problem early through an 
  issue report but has not responded yet.
