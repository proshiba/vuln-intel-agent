title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.38.0 through 0.70.5, BaseGenerator.parse_enum and 
  EnumRepresentation.render_symbols use each schema-controlled enum symbol as a 
  generated enum member name after case conversion but without validating it as 
  an identifier. When generator classes are used directly, newlines and 
  punctuation can inject constrained statements into the generated enum class 
  body, allowing namespace modification or preventing the module from loading. 
  Version 0.70.6 fixes the vulnerability by validating every enum symbol as a 
  name.
