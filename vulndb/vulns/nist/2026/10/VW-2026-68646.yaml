title: "A prototype pollution vulnerability exists in the deep merge helpers of Vaadin
  Charts and Vaadin Component Base. Merging an object the application does not control
  into a chart configuration or into a component's i18n property writes onto Object.prototype,
  making the injected properties visible to every object in the running application.\n\
  \n\nUsers of affected versions should apply the following mitigation or upgrade.
  Releases that have fixed this issue include:\n\nProduct version\nVaadin 23.0.0 -
  23.6.13\nVaadin 24.0.0 - 24.9.20\nVaadin 24.10.0 - 24.10.9\nVaadin 25.0.0 - 25.1.11\n\
  Vaadin 25.2.0 - 25.2.6\n\nMitigation\nUpgrade to 23.6.14\nUpgrade to 24.9.21\nUpgrade
  to 24.10.10\nUpgrade to 25.1.12\nUpgrade to 25.2.7 or newer\n\nPlease note that
  Vaadin versions 10-13 and 15-22 are no longer supported and you should update either
  to the latest 23, 24, 25 version.\n\nArtifacts\nMaven coordinates Vulnerable versions
  Fixed version\ncom.vaadin:vaadin 23.0.0 - 23.6.13 >=23.6.14\ncom.vaadin:vaadin 24.0.0
  - 24.9.20 >=2"
