title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/i2c:
  Disable IRQ on unbind\n\nCurrently, struct xe_i2c is freed before SGUnit IRQ is
  disabled in unbind\npath, leaving a potential UAF in case I2C IRQ is hit during
  this small\nwindow. Explicitly disable I2C IRQ in xe_i2c_remove() and fix this.\n\
  \n(cherry picked from commit 8ba5c8b8ab3fd362267c11df2cd5a90ee46f6e24)"
