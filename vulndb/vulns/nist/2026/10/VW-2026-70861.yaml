title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  hibernate: pass HVC_SET_VECTORS args to the resume hvc\n\nswsusp_arch_suspend_exit()
  reinstalls the restored kernel's hyp stub\nvectors with an hvc, but never passes
  the arguments. x0 is not set to\nHVC_SET_VECTORS and x1 is not set to the vector
  address, so the stub\ndispatch falls through and returns without writing vbar_el2.
  EL2 is\nleft pointing at the trans_pgd copy of the vectors, a page that\nswsusp_free()
  releases right after resume.\n\nSet the arguments up the same way __hyp_set_vectors()
  does.\n\nWithout this fix, Vladimir was able to trigger a hang when resuming from\n\
  hibernation with CONFIG_PAGE_POISONING=y and page_poison=on."
