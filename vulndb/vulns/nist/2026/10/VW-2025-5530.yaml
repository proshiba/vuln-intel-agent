title: OpenSearch Data Prepper as an open source data collector for 
  observability data. In versions prior to 2.12.2, the OpenSearch sink and 
  source plugins in Data Prepper trust all SSL certificates by default when no 
  certificate path is provided. Prior to this fix, the OpenSearch sink and 
  source plugins would automatically use a trust all SSL strategy when 
  connecting to OpenSearch clusters if no certificate path was explicitly 
  configured. This behavior bypasses SSL certificate validation, potentially 
  allowing attackers to intercept and modify data in transit through 
  man-in-the-middle attacks. The vulnerability affects connections to OpenSearch
  when the cert parameter is not explicitly provided. This issue has been 
  patched in version 2.12.2. As a workaround, users can add the cert parameter 
  to their OpenSearch sink or source configuration with the path to the 
  cluster's CA certificate.
