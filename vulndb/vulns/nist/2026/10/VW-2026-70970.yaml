title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/iser:
  reject a remote invalidation of an unregistered direction\n\nA write command whose
  data is sent entirely as immediate data is not\nregistered.  iser_reg_mem_fastreg()
  takes the DMA key path and leaves\nrdma_reg[ISER_DIR_OUT].desc at NULL, while iser_dma_map_task_data()
  has\nalready set dir[ISER_DIR_OUT].\n\niser_check_remote_inv() looks at dir[] alone
  and hands the descriptor to\niser_inv_desc(), which reads desc->sig_protected. \
  \ A target that answers\nsuch a command with IB_WR_SEND_WITH_INV faults the initiator.\n\
  Leaving those commands unregistered is deliberate.\n\nThe same function already
  terminates the connection when a target sends\na remote invalidation the initiator
  did not ask for.  A target that\ninvalidates a direction that was never registered
  is in the same class,\nso give it the same answer.\n\n  Oops: general protection
  fault, probably for non-canonical address 0xdffffc0000000004: 0000 [#1] SMP KASAN
  NOPTI\n  KA"
