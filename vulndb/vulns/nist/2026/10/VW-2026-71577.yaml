title: "Server-side request forgery in the OpenAPI schema processing of the agent
  import functionality in Amazon Bedrock AgentCore Starter Toolkit before 0.3.14 might
  allow an authenticated remote actor in the same AWS account to cause the environment
  of a user importing a Bedrock Agent to issue arbitrary outbound requests and read
  arbitrary local files, via crafted external reference values in the OpenAPI content
  associated with a Bedrock Agent action group.\n\n\n\nTo remediate this issue, users
  should upgrade to version 0.3.14. Note that bedrock-agentcore-starter-toolkit is
  deprecated. The @aws/agentcore npm CLI is the supported replacement and does not
  contain this issue. Migration to @aws/agentcore is the recommended long-term path."
