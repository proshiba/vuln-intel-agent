title: 'A Cross-Origin Resource Sharing (CORS) misconfiguration vulnerability exists
  in Dify v1.9.1 in the /console/api/setup endpoint. The endpoint implements an insecure
  CORS policy that reflects any Origin header and enables Access-Control-Allow-Credentials:
  true, permitting arbitrary external domains to make authenticated requests. NOTE:
  the Supplier disputes this because the endpoint configuration is intentional to
  support bootstrap.'
