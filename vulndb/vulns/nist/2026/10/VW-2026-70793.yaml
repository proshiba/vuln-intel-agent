title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gud:
  fix out-of-bounds write in gud_plane_atomic_check()\n\nThe plane property loop uses
  req->properties[num_properties + i] as write\nindex while simultaneously incrementing
  `num_properties` inside the loop.\nAt iteration i, num_properties has also incremented
  by i, so the write\nis done at `initial_num_properties + 2*i`, skipping every other
  index and\nadvancing by 2 per iteration.\n\nWith just 2 connector and 32 plane properties
  the last write happens at\nindex 64, one slot past the end of the 64-slot (indices
  0–63)\nallocation. A USB device can trigger OOB by advertising the maximum\nnumber
  of properties.\n\nFix by dropping the redundant `+ i`; num_properties is already
  the correct\nrunning index, as gud_connector_fill_properties() fills the preceding\n\
  slots."
