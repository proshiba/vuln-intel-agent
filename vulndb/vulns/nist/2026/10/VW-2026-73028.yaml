title: The PPOM – Product Addons & Custom Fields for WooCommerce plugin for 
  WordPress is vulnerable to arbitrary file deletion due to insufficient file 
  path validation in the rename_files function in all versions up to, and 
  including, 34.0.10 This makes it possible for unauthenticated attackers to 
  delete arbitrary files on the server, which can easily lead to remote code 
  execution when the right file is deleted (such as wp-config.php). The 
  relocated file is moved byte-identically into the publicly accessible 
  wp-content/uploads/ppom_files/confirmed/ directory, meaning the attack also 
  results in arbitrary file read for any web-readable file on the server.
