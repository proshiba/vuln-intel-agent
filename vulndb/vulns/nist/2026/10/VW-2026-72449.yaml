title: Uncontrolled eviction in the pending sign-in tables of the REST API in 
  Progressive Robot hMailServer 6.3.4 and 6.3.5 allows a remote unauthenticated 
  attacker to make other users' OpenID Connect, SAML and passkey sign-ins fail. 
  The routes that start a single sign-on and hand out a passkey sign-in 
  challenge are reached without authentication and stored pending state in 
  bounded tables that dropped their oldest entry when full, whoever had started 
  it. An attacker who starts sign-ins a few times a second (about a hundred a 
  second for passkeys) pushes every other user's pending sign-in out of the 
  table before that user's browser returns, denying single sign-on and passkey 
  sign-in for as long as the requests continue.
