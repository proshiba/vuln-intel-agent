title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wcn36xx: Fix potential use-after-free in TX ack timer teardown\n\nwcn36xx_dxe_deinit()
  tears down the TX ack timer with timer_delete(),\nwhich only dequeues the timer
  and does not wait for a callback that is\nalready executing; the preceding free_irq()
  calls synchronize the\ninterrupt handlers only. The callback, wcn36xx_dxe_tx_timer(),
  can\ntherefore be running past the teardown and use the wcn freed along\nwith the
  ieee80211_hw in wcn36xx_remove(): it takes wcn->dxe_lock,\nreads wcn->tx_ack_skb
  and passes wcn->hw to\nieee80211_tx_status_irqsafe().\n\nFix this by using timer_shutdown_sync(),
  which waits for a running\ncallback and also prevents the timer from being rearmed
  again. The\ntimer is set up again by wcn36xx_dxe_init() on the next start, so the\n\
  start/stop cycle is unaffected.\n\nThis issue was found by an in-house static analysis
  tool."
