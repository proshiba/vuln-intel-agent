title: "Improper Neutralization of Escape, Meta, or Control Sequences vulnerability
  in hexpm hex allows a malicious package publisher or a hostile repository server
  to inject terminal control sequences into the output of Mix tasks.\n\nHex prints
  strings supplied by the package repository and the documentation search service
  straight to the terminal through Hex.Shell.info/1 and Hex.Shell.error/1, neutralizing
  no control characters. Affected sinks span package metadata and configuration snippets
  in mix hex.info, search results in mix hex.package search and mix hex.search, owner
  and organization listings, publish and sponsor URLs, the authenticated username
  in mix hex.user, policy identities in mix hex.policy, and API error bodies rendered
  by Hex.Utils.print_error_result/1. A malicious package can embed ANSI escape sequences
  (cursor movement, line erase, carriage returns, OSC 52 clipboard writes) or Unicode
  bidirectional overrides in any of those fields, so the bytes reach the terminal
  unchanged, f"
