title: The Easy Theme Options plugin for WordPress is vulnerable to Missing 
  Authorization in all versions up to, and including, 1.0. This is due to 
  missing authorization checks in the eto_import_settings function. This makes 
  it possible for authenticated attackers, with Subscriber-level access and 
  above, to import arbitrary plugin settings via the 'eto_import_settings' 
  parameter.
