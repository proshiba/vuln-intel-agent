title: "An unauthenticated attacker with access to TCP port 12306 of the WorkExaminer
  server can exploit missing server-side authentication checks to bypass the login
  prompt in the WorkExaminer Professional console to gain administrative access to
  the WorkExaminer server and therefore all sensitive monitoring data. This includes
  monitored screenshots and keystrokes of all users.\n\nThe WorkExaminer Professional
  console is used for administrative access to the server. Before access to the console
  is granted administrators must login. Internally, a custom protocol is used to call
  a respective stored procedure on the MSSQL database. The return value of the call
  is not validated on the server-side. Instead it is only validated client-side which
  allows to bypass authentication."
