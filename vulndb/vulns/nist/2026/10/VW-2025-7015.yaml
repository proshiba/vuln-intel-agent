title: A flaw has been found in JhumanJ OpnForm up to 1.9.3. This affects an 
  unknown part of the file /api/open/forms/ of the component Form Editor. This 
  manipulation causes cross site scripting. The attack may be initiated 
  remotely. The exploit has been published and may be used. This issue is 
  currently under review for additional handling. As of right now the vendor has
  stated that the feature is disabled until the user has configured their own 
  domain which will mitigate this attack vector.
