title: A flaw was found in busybox. The tar applet's deferred link-creation 
  handling for symlink and hardlink entries with unsafe-looking targets does not
  validate that the resolved destination remains inside the extraction directory
  once the deferred link is created. An attacker can craft a tar archive using a
  symlink target of exactly '..' combined with a deferred hardlink to create a 
  new file outside the extraction directory, or reuse an extraction directory 
  across two archives to replace an existing file outside it. If the archive is 
  extracted with elevated privileges, this flaw can lead to privilege escalation
  or arbitrary code execution.
