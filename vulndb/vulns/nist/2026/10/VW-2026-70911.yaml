title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  do not let tcp_rmem be set below 4096\n\nWe can hit a division by zero crash in
  tcp_rcvbuf_grow()\nand tcp_rcv_space_adjust():\n\ndivide error: 0000 [#1] PREEMPT
  SMP\nRIP: 0010:tcp_rcvbuf_grow+0x187/0x450 net/ipv4/tcp_input.c:939\n...\ngrow =
  div_u64(((u64)rcvwin << 1) * (newval - oldval), oldval);\n\nThe division uses oldval
  = tp->rcvq_space.space as divisor.\nWhen tp->rcvq_space.space is zero, this leads
  to a divide-by-zero\nexception.\n\ntp->rcvq_space.space is initialized in tcp_init_buffer_space():\n\
  \    tp->rcvq_space.space = min3(tp->rcv_ssthresh, tp->rcv_wnd,\n              \
  \                  (u32)TCP_INIT_CWND * tp->advmss);\n\nIf tcp_rmem[1] is configured
  to very small values (such as 1),\nsk->sk_rcvbuf is initialized to 1. Then tcp_full_space(sk),
  which\ncomputes (sk->sk_rcvbuf * scaling_ratio) >> 8, truncates to 0.\nThis sets
  tp->window_clamp = 0, tp->rcv_ssthresh = 0, and\ntp->rcvq_space.space = 0. Later,
