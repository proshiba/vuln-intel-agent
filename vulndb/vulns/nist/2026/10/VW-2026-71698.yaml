title: The Academy LMS  WordPress plugin before 4.0.0 does not verify that a 
  quiz question belongs to the course the requesting user is authorized to 
  access before returning that question's answer options, allowing any 
  authenticated user with access to a single course, such as an enrolled 
  student, to read the quiz answer options of questions belonging to other 
  courses they are not enrolled in.
