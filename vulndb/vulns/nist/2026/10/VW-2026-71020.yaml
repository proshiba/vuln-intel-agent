title: lrzsz before 0.13.0 contains a heap-based buffer overflow vulnerability 
  in procheader() of the lrz receive utility when copying overlong 
  sender-supplied filenames into Pathname. Malicious ZMODEM senders can supply 
  filenames up to 8192 bytes, overflowing the buffer via sprintf() in pipe mode 
  or strcpy() to corrupt heap memory and crash lrz.
