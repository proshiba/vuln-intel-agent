title: "Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')
  vulnerability in gleam-lang gleam allows a malicious package publisher to delete
  a directory outside the project's build directory when a developer builds a project.\n\
  \nA Hex package release's metadata carries an app field with the release's OTP application
  name. Gleam reads this field from the hex.pm release API when it downloads dependencies
  and uses it as the package's build directory name without validating it (hex_manifest_package
  in compiler-cli/src/dependencies.rs, ProjectPaths::build_directory_for_package).
  When a dependency fails to compile, Gleam deletes that directory with remove_dir_all.
  hex.pm didn't restrict the field to a directory name before 2026-10-12, so a publisher
  could set it to a value such as ../../../../target or an absolute path. When a project
  depends on such a release directly or transitively and the release fails to compile,
