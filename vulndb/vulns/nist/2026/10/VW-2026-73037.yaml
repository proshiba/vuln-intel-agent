title: The Frontend Admin by DynamiApps plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting via kses bypass / mutation XSS in all versions up 
  to, and including, 3.28.36. This is due to the 'get_dynamic_values' function 
  performing text-level find-and-replace operations on post content without 
  HTML-aware parsing. This makes it possible for authenticated attackers, with 
  Contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page.
