title: The HivePress – Business Directory, Listings & Classified Ads Plugin 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via the 
  'custom text attribute (user-defined field name)' parameter in all versions up
  to, and including, 1.7.31 due to insufficient input sanitization and output 
  escaping. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. This is only 
  exploitable when an administrator has configured a Text attribute whose 
  display format places the %value% token inside an HTML attribute (e.g., 
  title="%value%"), which is a documented HivePress pattern.
