title: Kiteworks Core before version 9.5.0 is vulnerable to Arbitrary File 
  Write. An improper restriction of a user-supplied file path in a Kiteworks 
  administrative export feature could allow an authenticated administrator to 
  write a file to an arbitrary location on the underlying host, potentially 
  leading to command execution on the appliance. Exploitation requires an 
  existing, authenticated administrative account with access to the affected 
  export function.
