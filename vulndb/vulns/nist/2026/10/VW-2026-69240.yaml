title: A flaw was found in tnef. A heap-based buffer overflow can occur in the 
  find_free_number() function when generating numbered backup suffixes for 
  duplicate filenames. When numbered backups are enabled and file overwriting is
  disabled, an attacker can supply a specially crafted Transport Neutral 
  Encapsulation Format (TNEF) file with an excessive number of colliding 
  attachment filenames, causing the numeric counter to write past the allocated 
  memory buffer. This issue may result in an application crash, leading to a 
  Denial of Service (DoS), or potentially arbitrary code execution.
