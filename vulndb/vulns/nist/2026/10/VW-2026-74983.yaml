title: A vulnerability has been found in GPAC up to 26.07.0. This vulnerability 
  affects the function gf_m2ts_decode_ait of the file src/media_tools/ait.c of 
  the component AIT Parser. Such manipulation leads to out-of-bounds write. The 
  attack may be launched remotely. The exploit has been disclosed to the public 
  and may be used. The name of the patch is 
  6d2c21a1a688abb20d0111b608db3b6f44d348f4. Applying a patch is advised to 
  resolve this issue.
