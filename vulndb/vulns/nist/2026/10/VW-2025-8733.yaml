title: "Heimdall Data Database Proxy Cross-Site Scripting Remote Code Execution Vulnerability.
  This vulnerability allows remote attackers to execute arbitrary code on affected
  installations of Heimdall Data Database Proxy. Minimal user interaction is required
  to exploit this vulnerability.\n\nThe specific flaw exists within the handling of
  the database event logs. The issue results from the lack of proper validation of
  user-supplied data, which can lead to the injection of arbitrary script. An attacker
  can leverage this vulnerability to interact with the application in the context
  of the target user. Was ZDI-CAN-24755."
