title: A weakness has been identified in EFM ipTIME A3004T 14.19.0. This 
  vulnerability affects the function show_debug_screen of the file 
  /sess-bin/timepro.cgi of the component Administrator Password Handler. This 
  manipulation of the argument aaksjdkfj with the input !@dnjsrureljrm*& causes 
  command injection. The attack is possible to be carried out remotely. The 
  complexity of an attack is rather high. It is stated that the exploitability 
  is difficult. The exploit has been made available to the public and could be 
  exploited. The vendor was contacted early about this disclosure but did not 
  respond in any way.
