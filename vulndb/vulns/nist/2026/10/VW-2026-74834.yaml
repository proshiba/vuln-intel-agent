title: FreeRDP from 3.0.0 before 3.32.0 contains an uninitialized memory 
  disclosure vulnerability in smartcard_Transmit_Call that allows malicious RDP 
  servers to read client memory. Servers can send SCardTransmit requests with an
  invalid card handle and nonzero receive length, causing 
  smartcard_pack_transmit_return to serialize up to 66,560 uninitialized heap 
  bytes.
