title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: cancel reconnect work in clean_demultiplex_info()\n\nclean_demultiplex_info()
  cancels server->echo delayed work but not\nserver->reconnect, which can cause a
  use-after-free when the\ndemultiplex thread exits while a reconnect work is still
  queued:\n\n  cifs_demultiplex_thread()\n    cifs_readv_from_socket()\n      cifs_reconnect()\n\
  \        __cifs_reconnect()\n          cifs_queue_server_reconn()\n            mod_delayed_work(cifsiod_wq,
  &server->reconnect, 0)\n    clean_demultiplex_info()\n      cancel_delayed_work_sync(&server->echo)\
  \   // echo canceled\n                                                 // reconnect
  NOT canceled\n      kfree_sensitive(server)                    // server freed\n\
  \n  ...later, on cifsiod_wq:\n\n  smb2_reconnect_server()\n    server->srv_count\
  \  // UAF read of freed server\n\nFix this by canceling server->reconnect delayed
  work in\nclean_demultiplex_info() before the server is freed, the same way\nci"
