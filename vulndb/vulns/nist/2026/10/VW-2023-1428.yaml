title: "A vulnerability has been identified in the Node.js (.msi version) installation
  process, specifically affecting Windows users who install Node.js using the .msi
  installer. This vulnerability emerges during the repair operation, where the \"\
  msiexec.exe\" process, running under the NT AUTHORITY\\SYSTEM context, attempts
  to read the %USERPROFILE% environment variable from the current user's registry.\n\
  \nThe issue arises when the path referenced by the %USERPROFILE% environment variable
  does not exist. In such cases, the \"msiexec.exe\" process attempts to create the
  specified path in an unsafe manner, potentially leading to the creation of arbitrary
  folders in arbitrary locations.\n\nThe severity of this vulnerability is heightened
  by the fact that the %USERPROFILE% environment variable in the Windows registry
