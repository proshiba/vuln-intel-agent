title: The Affinity by Canva application before 3.3.1 (October 2026 release) did
  not perform adequate bounds checking when parsing raster image data in 
  Affinity document files, leading to an out-of-bounds read and the dereference 
  of an untrusted pointer. A threat actor could craft an Affinity document that,
  when opened by a user in Affinity, could result in memory corruption or an 
  application crash.
