title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-fabrics:
  use reserved tag for reg read/write command\n\nIn some scenarios, if too many commands
  are issued by nvme command in\nthe same time by user tasks, this may exhaust all
  tags of admin_q. If\na reset (nvme reset or IO timeout) occurs before these commands
  finish,\nreconnect routine may fail to update nvme regs due to insufficient tags,\n\
  which will cause kernel hang forever. In order to workaround this issue,\nmaybe
  we can let reg_read32()/reg_read64()/reg_write32() use reserved\ntags. This maybe
  safe for nvmf:\n\n1. For the disable ctrl path,  we will not issue connect command\n\
  2. For the enable ctrl / fw activate path, since connect and reg_xx()\n   are called
  serially.\n\nSo the reserved tags may still be enough while reg_xx() use reserved
  tags."
