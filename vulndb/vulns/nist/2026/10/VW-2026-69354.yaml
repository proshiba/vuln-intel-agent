title: "Tapo C120 v1 and C200 V5\ncontain a vulnerability in the HTTPS onboarding
  scan function due to missing authentication.\nAfter initial setup, an unauthenticated
  attacker on the same local network can\ninvoke the scan action and retrieve nearby
  wireless access-point metadata,\nincluding SSIDs, BSSIDs, authentication and encryption
  modes, and\nsignal-strength information.\n\n\n\n\n\n\n\n\n\nSuccessful\nexploitation
  may disclose information about the wireless environment\nsurrounding the camera,
  allowing an attacker to learn elements of the local\nwireless topology."
