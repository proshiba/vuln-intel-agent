title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexec:
  Cleanup POSIX timers right after de_thread()\n\nA per-thread CPU timer holds a reference
  to the PID of the thread it is\nattached to and, while it is armed, its node is
  queued in that thread's\nposix_cputimers. The task is looked up by that PID.\n\n\
  When a non-leader thread exec()s, de_thread() changes which task owns\nthat PID.
  pid_task(timer->it.cpu.pid, PIDTYPE_PID) then returns NULL,\nbut the node is still
  queued on tsk, which is alive. timer_lock_sighand()\ntakes a failed lookup to mean
  that the node is already dequeued, so it\nhas nothing to undo.\n\nbegin_new_exec()
  calls posix_cpu_timers_exit(me) right after\nexec_task_namespaces() and that removes
  the leftover node, so the state\nnormally stays invisible. But bprm->point_of_no_return
  is set before\nde_thread(), so if unshare_files(), set_mm_exe_file(), exec_mmap()
  or\nexec_task_namespaces() fails, the task dies before it gets there.\nexit_itimers()
  then frees the k_itime"
