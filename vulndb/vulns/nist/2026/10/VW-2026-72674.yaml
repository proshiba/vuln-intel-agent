title: "The ARM64 MMU back-end allocated address space identifiers (ASIDs) for memory
  domains with a bare round-robin counter in arch_mem_domain_init() (arch/arm64/core/mmu.c).
  VM_ASID_BITS is 8, so only 255 ASIDs exist; once the counter wrapped, arch_mem_domain_init()
  could hand an ASID to a new domain while a still-live domain held the same one.
  Domain-private mappings are installed non-global (MT_NG), so the ASID is the only
  tag separating one domain's cached translations from another's in the TLB.\n\nThe
  context-switch path in z_arm64_swap_ptables() only flushes the TLB when the outgoing
  and incoming domains carry the same ASID, which does not cover a duplicate reached
  through a third domain: for domains A and C sharing an ASID and an unrelated domain
  B, the schedule A -> B -> C never takes the flush branch, so the ASID-tagged entries
