title: 'A flaw has been found in DecoCMS Mesh up to 1.0.0-alpha.31. Affected by this
  vulnerability is the function createTool of the file packages/sdk/src/mcp/teams/api.ts
  of the component Workspace Domain Handler. This manipulation of the argument domain
  causes improper access controls. The attack can be initiated remotely. The complexity
  of an attack is rather high. The exploitation appears to be difficult. The exploit
  has been published and may be used. Upgrading to version 1.0.0-alpha.32 addresses
  this issue. Patch name: 5f7315e05852faf3a9c177c0a34f9ea9b0371d3d. It is recommended
  to upgrade the affected component.'
