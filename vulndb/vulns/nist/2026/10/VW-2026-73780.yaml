title: A vulnerability was found in houtini-ai voice-analyser-mcp up to 2.1.1. 
  The affected element is the function fetch of the file src/utils/crawler.ts of
  the component collect_corpus. Performing a manipulation of the argument 
  sitemap_url results in server-side request forgery. Remote exploitation of the
  attack is possible. The exploit has been made public and could be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
