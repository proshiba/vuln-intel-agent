title: An authorization and input validation vulnerability exists in Brocade 
  Fabric OS versions before 9.2.2d and 10.0.0 through 10.0.0a1. An authenticated
  user with restricted privileges in one Virtual Fabric can exploit this issue 
  by submitting a specially crafted request containing an arbitrary fabric 
  identifier. This allows the user to perform unauthorized cross-fabric 
  operations and view configuration details within tenants/Virtual Fabrics to 
  which they have not been granted access.
