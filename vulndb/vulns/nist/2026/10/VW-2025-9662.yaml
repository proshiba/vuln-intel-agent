title: The Simple Bike Rental plugin for WordPress is vulnerable to unauthorized
  access of data due to a missing capability check on the 
  'simpbire_carica_prenotazioni' AJAX action in all versions up to, and 
  including, 1.0.6. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to retrieve all booking records containing 
  customers' personally identifiable information (PII), including names, email 
  addresses, and phone numbers.
