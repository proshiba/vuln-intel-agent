title: A vulnerability was identified in JeecgBoot up to 3.9.0. This impacts the
  function getParameterMap of the file /sys/sysDepartPermission/list. The 
  manipulation of the argument departId leads to improper authorization. The 
  attack can be initiated remotely. The attack's complexity is rated as high. 
  The exploitability is said to be difficult. The exploit is publicly available 
  and might be used. The vendor was contacted early about this disclosure but 
  did not respond in any way.
