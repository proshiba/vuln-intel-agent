title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/iommu:
  Fix the overflow validation in iommu_tce_check_ioba\n\nThe commit b1af23d836f8 (\"\
  KVM: PPC: iommu: Unify TCE checking\") unified\nIOBA parameter checking across KVM
  and VFIO into iommu_tce_check_ioba().\nWhile doing so, the passed in argument npages
  is ignored and constant\nvalue '1' is used leaving out a possible overflow as the
  callers can\nlegitimately be using npages > 1 for H_STUFF_TCE or H_PUT_TCE_INDIRECT\n\
  cases.\n\nFix this by accounting for 'npages', checking for arithmetic overflow,\n\
  and verifying that the entire requested range (ioba - offset + npages)\ndoes not
  exceed the table capacity 'size'."
