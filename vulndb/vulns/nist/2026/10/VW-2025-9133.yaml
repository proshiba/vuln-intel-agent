title: willitmerge is a command line tool to check if pull requests are 
  mergeable. In versions 0.2.1 and prior, there is a command Injection 
  vulnerability in willitmerge. The vulnerability manifests in this package due 
  to the use of insecure child process execution API (exec) to which it 
  concatenates user input, whether provided to the command-line flag, or is in 
  user control in the target repository. At time of publication, no known fix is
