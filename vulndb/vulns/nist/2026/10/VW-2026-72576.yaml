title: The Mechanize library is used for automating interaction with websites. 
  Prior to 2.14.1, Mechanize::HTTP::Agent#response_redirect treats redirects as 
  same-origin when the host matches without consistently comparing scheme and 
  port. A same-host HTTPS-to-HTTP redirect can send Authorization and Cookie 
  headers over cleartext, while a same-host redirect to another port can send a 
  caller-supplied Cookie header to a different service. Cookies in 
  Mechanize#cookie_jar remain scoped separately; the issue affects 
  caller-supplied headers and can disclose credentials without affecting 
  integrity or availability. This issue is fixed in version 2.14.1.
