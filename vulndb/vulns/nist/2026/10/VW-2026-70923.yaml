title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  virt_wifi: don't transfer operstate before register\n\nvirt_wifi_newlink() calls
  netif_stacked_transfer_operstate() before\nregister_netdevice(). If the lower device
  is dormant, that queues the\nnew netdev on lweventlist while it is still uninitialized.
  If\nregistration fails after that, for example because of an invalid name\nsuch
  as \"bad/name\", free_netdev() immediately frees the object. A\nlater linkwatch_fire_event()
  then use-after-frees the list entry.\n\nMove the transfer to after netdev_upper_dev_link(),
  as macvlan and\nipvlan already do."
