title: Privasys Remote Attestation TLS Clients provides multi-language utilities
  for verifying attested TLS connections. Prior to 0.11.0, TEE attestation 
  evidence in Privasys attested TLS is accepted without requiring an explicitly 
  authorized platform identity. When a network attacker can forge evidence or 
  extract attestation secrets from a compromised unrevoked platform, the 
  verifier accepts valid measurements from a different unrevoked TEE platform as
  though they came from the intended Attester. The attacker can impersonate the 
  attested TLS endpoint. This issue is fixed in version 0.11.0.
