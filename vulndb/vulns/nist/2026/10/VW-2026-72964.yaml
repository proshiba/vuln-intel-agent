title: The GeoDirectory – WP Business Directory Plugin and Classified Listings 
  Directory plugin for WordPress is vulnerable to Stored Cross-Site Scripting 
  via the 'email (Contact Email custom field htmlvar_name)' parameter in all 
  versions up to, and including, 2.8.188 due to insufficient input sanitization 
  and output escaping. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. Successful 
  exploitation requires that an administrator has added and configured the 
  Contact Email custom field to render on the public single-listing output page,
  and that the administrator subsequently approves the attacker's submitted 
  listing.
