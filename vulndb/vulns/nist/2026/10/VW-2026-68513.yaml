title: A security vulnerability has been detected in OS4ED openSIS-Classic up to
  9.3. Affected is the function db_properties of the file 
  functions/DatabaseInc.php of the component Save Data Handler. Such 
  manipulation of the argument values leads to sql injection. The attack can be 
  launched remotely. The exploit has been disclosed publicly and may be used. 
  The project was informed of the problem early through an issue report but has 
  not responded yet.
