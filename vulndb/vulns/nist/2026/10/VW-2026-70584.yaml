title: A flaw was found in SSSD. A local user can cause a denial of service 
  (DoS) by disrupting system authentication services. When handling Generic 
  Security Services Application Programming Interface (GSSAPI) authentication in
  the Pluggable Authentication Module (PAM) responder, cached connection state 
  is freed upon completion without clearing the reference pointer. An attacker 
  can exploit this by sending an additional request over the same connection, 
  causing the service to access invalid memory and unexpectedly terminate.
