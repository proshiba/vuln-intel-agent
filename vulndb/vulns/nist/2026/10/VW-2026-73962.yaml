title: SGLang through 0.5.21 contains a resource budget bypass vulnerability 
  that allows remote attackers to override GLM-V video processing limits by 
  supplying fps, max_frames, max_tokens_per_frame and max_image_tokens in the 
  video_url object. Attackers can set these values arbitrarily high so glm4v.py 
  decodes every frame of high-resolution video at full size, exhausting worker 
  memory and denying service.
