title: This vulnerability allows remote attackers to bypass authentication on 
  affected installations of PaperCut NG 22.0.5 (Build 63914). Authentication is 
  not required to exploit this vulnerability. The specific flaw exists within 
  the SecurityRequestFilter class. The issue results from improper 
  implementation of the authentication algorithm. An attacker can leverage this 
  vulnerability to bypass authentication on the system. Was ZDI-CAN-19226.
