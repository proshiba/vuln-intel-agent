title: A vulnerability has been found in BlackBeltTechnology pi-agent-dashboard 
  up to 0.8.0. Affected by this issue is the function terminalManager.spawn of 
  the file packages/server/src/browser-handlers/terminal-handler.ts of the 
  component Terminal Handler. The manipulation of the argument cwd leads to 
  improper authorization. The attack can be initiated remotely. The exploit has 
  been disclosed to the public and may be used. The identifier of the patch is 
  48fd0bad5adfe76af9736599699d51a5f60019f6. It is suggested to install a patch 
  to address this issue. The vendor was contacted early, responded in a very 
  professional manner and quickly released a fixed version of the affected 
  product.
