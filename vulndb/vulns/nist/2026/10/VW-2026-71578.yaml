title: A heap-based buffer overflow was found in GIMP’s DirectDraw Surface (DDS)
  loader. When loading a crafted DDS image, buffer sizes derived from width, 
  height, and pitch can be computed using 32-bit arithmetic that overflows. The 
  allocated buffer is too small for the amount of pixel data written through 
  GEGL, following integer overflow in size calculations. This may allow heap 
  corruption and, in the worst case, arbitrary code execution in the context of 
  the GIMP process.
