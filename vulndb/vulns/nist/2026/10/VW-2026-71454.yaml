title: WeasyPrint helps web developers to create PDF documents. Prior to 70.0, 
  the image-loading path in weasyprint/images.py passes fetched image bytes from
  HTML img URLs, CSS image values, SVG image references, and data URIs to 
  Pillow's generic image dispatcher without excluding EPS or PostScript formats.
  On hosts with Ghostscript installed, Pillow EpsImagePlugin invokes the 
  interpreter for attacker-controlled PostScript, which can produce 
  interpreter-permitted effects and can lead to remote code execution when the 
  installed Ghostscript version has a usable sandbox bypass. Hosts without 
  Ghostscript do not reach this rasterization path. This issue is fixed in 
  version 70.0.
