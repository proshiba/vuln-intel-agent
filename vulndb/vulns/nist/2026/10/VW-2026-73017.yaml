title: The Order Export & Order Import for WooCommerce plugin for WordPress is 
  vulnerable to Sensitive Information Exposure in all versions up to, and 
  including, 2.7.8 via the get_file_path. This makes it possible for 
  unauthenticated attackers to extract download exported order CSV files 
  containing customer PII — including names, billing and shipping addresses, 
  email addresses, phone numbers, and order contents — directly over HTTP with 
  no authentication. This is exploitable whenever the .htaccess and index.php 
  guard files are absent from wp-content/webtoffee_export/, which can occur 
  after any uninstall/reinstall cycle, migration, backup restore, or staging 
  sync, since the export directory persists but its guard files do not; export 
  filenames follow a fully deterministic second-precision timestamp pattern, 
  making them brute-forceable across any suspected export window.
