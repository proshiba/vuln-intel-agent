title: An SQL user using Impala up to and including version 4.5.2 with only 
  SELECT permission can put JavaScript in a table alias and make it run in 
  another user's browser when that user opens the query plan in Impala's Web UI.
  This is stored XSS (CWE-79). Users are recommended to upgrade to version 
  4.5.3.
