title: A vulnerability was found in RainyGao DocSys up to 2.02.36. Affected is 
  the function updateRealDoc of the file /Doc/uploadDoc.do of the component File
  Upload. Performing manipulation of the argument path results in path 
  traversal. The attack can be initiated remotely. The exploit has been made 
  public and could be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
