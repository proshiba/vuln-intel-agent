title: docling-serve 1.14.0 through 1.36.0 contains a missing authentication 
  vulnerability that allows unauthenticated attackers to access /v1/memory/stats
  and /v1/memory/counts because they omit the require_auth dependency. Attackers
  can bypass the configured DOCLING_SERVE_API_KEY to read process and cgroup 
  memory telemetry, object type histograms, and force repeated gc.collect() heap
  enumeration.
