title: Backstage is an open framework for building developer portals. Prior to 
  2.1.6 in @backstage/plugin-search-backend and 1.8.7 in 
  @backstage/plugin-search-backend-module-elasticsearch, search engine 
  permission filtering could return documents denied by policy. An authenticated
  Backstage user subject to a DENY policy for search document types could 
  receive unauthorized results in deployments with permission.enabled set to 
  true and an Elasticsearch or OpenSearch backend. This issue is fixed in 
  @backstage/plugin-search-backend 2.1.6 and 
  @backstage/plugin-search-backend-module-elasticsearch 1.8.7.
