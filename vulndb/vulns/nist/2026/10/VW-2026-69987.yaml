title: In Bouncy Castle for Java before 1.86, validation of an MLS (RFC 9420) 
  external commit's proposal list, 
  org.bouncycastle.mls.protocol.Group.validateExternalCachedProposals, counted 
  the proposals by type and bounded the removed leaf index but never established
  that the removed leaf had anything to do with the joiner. RFC 9420 sec. 12.2 
  permits at most one Remove proposal in an external commit, with which the 
  joiner removes an old version of themselves, and requires that where one is 
  present the LeafNode in the commit's path field meet the criteria it would 
  have to meet in an Update for the removed leaf, in particular that its 
  credential present identifiers acceptable for the removed participant. The 
  ordinary proposal-list validator's self-remove rule is deliberately not 
  applied on this path, because a resync commit legitimately removes a leaf the 
