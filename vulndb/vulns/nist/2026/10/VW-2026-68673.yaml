title: Joomla Extension - joomcode.com - Unauthenticated SQL injection in read 
  and write queries in JCTables  1.21.1 - The front-end CRUD API controller 
  performs no Joomla token validation and no authentication check on any task. 
  Table names, column names, and values are taken directly from request 
  parameters and concatenated into SQL queries, allowing SQLi for reading and 
  writing queries.
