title: Gophish through 0.12.1 contains a rate limit bypass vulnerability that 
  allows unauthenticated attackers to evade /login throttling by spoofing 
  X-Forwarded-For or X-Real-IP headers. Attackers can send a different forwarded
  address per request so the limiter keyed on rewritten RemoteAddr never 
  triggers, enabling unlimited password guessing and credential stuffing.
