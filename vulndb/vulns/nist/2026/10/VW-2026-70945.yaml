title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: reset the LED state when ifup fails\n\nWhen the first interface comes
  up, the radio LED is turned on. This can\nstart the TPT trigger timer, which continues
  running.\n\nBut if bringing up the interface fails then the timer keeps running
  and\nwon't be stopped by anything, eventually it can be freed:\n\n  ODEBUG: free
  active (active state 0) object: ffff888127e12130 object type: timer_list hint: tpt_trig_timer+0x0/0x300
  net/mac80211/led.c:145\n  WARNING: CPU: 0 PID: 5923 at lib/debugobjects.c:612 debug_print_object+0x1a2/0x2b0\n\
  \   debug_check_no_obj_freed+0x4b7/0x600 lib/debugobjects.c:1129\n   kfree+0x436/0x670
  mm/slub.c:6818\n   ieee80211_led_exit+0x162/0x1c0 net/mac80211/led.c:210\n   ieee80211_unregister_hw+0x27e/0x3a0
  net/mac80211/main.c:1706\n   rt2x00lib_remove_dev+0x55b/0x670\n\nUndo the LED state
  in the error path."
