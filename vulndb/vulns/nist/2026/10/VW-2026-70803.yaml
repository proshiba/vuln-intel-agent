title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wlcore: release runtime PM ref on regdomain config failure\n\nwlcore_regdomain_config()
  gets a runtime PM reference before sending\nthe regulatory-domain command. When\n\
  wlcore_cmd_regdomain_config_locked() fails, the function queues recovery\nand returns
  without dropping that reference.\n\nRelease the reference after handling the command
  result so both success\nand failure paths balance the preceding\npm_runtime_resume_and_get().
  The recovery worker takes a separate\nruntime PM reference and cannot release the
  reference held here."
