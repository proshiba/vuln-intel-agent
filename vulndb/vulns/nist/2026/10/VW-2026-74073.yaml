title: ImageMagick 7.1.0-21 before 7.1.2-32 contains a heap buffer over-read in 
  its handling of the -fx option, where a certain -fx operation reads beyond the
  bounds of an allocated heap buffer in specific situations. Attackers who can 
  get a crafted -fx expression processed can read out-of-bounds heap memory, 
  potentially disclosing limited memory contents.
