title: RClone Manager is a cross-platform GUI application designed to help users
  manage Rclone remotes efficiently. Prior to 0.2.7, RClone Manager starts the 
  local rclone rcd service on 127.0.0.1:51900 with --rc-no-auth, 
  --rc-allow-origin *, and --rc-serve. A malicious web page opened by a user 
  while the daemon is running can therefore send cross-origin requests to the 
  unauthenticated local API with the user's operating-system privileges. The 
  requests can disclose configured storage credentials and potentially access, 
  upload, modify, or exfiltrate locally stored files accessible to the user and 
  files available through configured remotes; the advisory's possible 
  command-execution impact remains unconfirmed. This issue is fixed in version 
  0.2.7.
