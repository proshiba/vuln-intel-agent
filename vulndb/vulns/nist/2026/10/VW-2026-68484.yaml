title: "Authentication bypass via LDAP injection in component sshd-ldap in Apache
  MINA SSHD versions 1.2.0 to 2.19.0 and 3.0.0-M1 to 3.0.0-M5.\n\n\n\n\nApache MINA
  SSHD is a Java library for client-side and server-side SSH. \nThe optional sshd-ldap
  component provides support for integrating \npassword and publickey authentication
  on the server side with an LDAP \nserver.\n\n\n\n\nsshd-ldap is an optional component.
  SSH servers implemented with Apache \nMINA SSHD are affected only if they use sshd-ldap
  and do configure it to be used for password of public key authentication.\n\nOther
  Apache MINA SSHD servers are not affected.\n\n\n\n\nLack of escaping LDAP filter
  metacharacters enabled successful authentication with username \"*\" and password
  \"*\".\n\n\n\n\nUsers are recommended to upgrade affected applications to version
  2.20.0 or 3.0.0-M6, which fix this issue by properly escaping filter parameters
  according to RFC 4515."
