title: 'A vulnerability has been found in Studio-Saelix Sencho up to 0.97.1. Affected
  by this issue is the function isValidRemoteUrl of the file backend/src/utils/validation.ts
  of the component Add Remote Node API Endpoint. Such manipulation leads to server-side
  request forgery. The attack can be executed remotely. The exploit has been disclosed
  to the public and may be used. The vendor confirms: "The node API URL could be configured
  by an authenticated user with node-management permission and used to initiate server-side
  requests. [T]he report demonstrates server-side request capability but not arbitrary
  internal response exfiltration."'
