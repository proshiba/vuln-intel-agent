title: Joomla Extension - balbooa.com - Path Traversal in image preview Gridbox 
  < 2.20.4.0 - Gridbox contains the same prefix-only containment logic in its 
  site UploaderHelper . The showImage action resolves a request-controlled path,
  calls that helper, and then returns the image. If image decoding is 
  unavailable or fails, the action streams the file directly. An existing image 
  in a sibling directory such as images-backup can therefore satisfy the current
  containment test even though it is outside the configured images root. The 
  route restricts the file extension to Gridbox image types, which materially 
  limits the read primitive. The default media root is images ; the effective 
  site setting was not independently verified. No prefix-matching sibling 
  directory was found alongside the site’s images directory. The finding is 
  rated Low rather than presented as arbitrary file disclosure.
