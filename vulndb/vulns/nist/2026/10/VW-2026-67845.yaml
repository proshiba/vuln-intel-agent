title: A security vulnerability has been detected in WebAssembly wabt up to 
  1.0.39. This issue affects the function wabt::Decompiler::VarName of the file 
  /src/repro/wabt/bin/wasm-decompile of the component wasm-decompile. Such 
  manipulation leads to out-of-bounds read. Local access is required to approach
  this attack. The exploit has been disclosed publicly and may be used. 
  Unfortunately, the project has no active maintainer at the moment. In a reply 
  to the issue report somebody recommended to the researcher to provide a PR 
  himself.
