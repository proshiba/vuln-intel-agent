title: In @neo4j/graphql versions up to and including 7.6.3, @authentication 
  directives applied at the schema level or on the Query or Mutation types are 
  silently ignored for top-level fields annotated with @cypher. Only 
  @authentication directives placed directly on the individual fields are 
  enforced. An application that exposes a top-level @cypher field and relies on 
  schema-level or type-level @authentication to protect it allows 
  unauthenticated callers to invoke the field and run the configured Cypher 
  statement with the privileges of the GraphQL service account, which may permit
  reading and modifying data. Fixed in 7.6.4.
