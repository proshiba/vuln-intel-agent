title: A vulnerability was determined in Blosc C-Blosc2 up to 3.3.2. This 
  impacts the function blosclz_decompress of the file blosc/blosclz.c of the 
  component blosclz Decompression. Executing a manipulation can lead to integer 
  overflow. The attack may be launched remotely. A high complexity level is 
  associated with this attack. The exploitability is said to be difficult. 
  Upgrading to version 3.3.3 will fix this issue. This patch is called 
  fe2964d114d97847f56570a0ab2be2c57ccbeedc. The affected component should be 
  upgraded.
