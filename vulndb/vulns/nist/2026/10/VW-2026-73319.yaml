title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  the SysDepartPermissionController delete handler that allows low-privileged 
  authenticated users to delete department permission bindings. Attackers can 
  obtain row ids from the unguarded list endpoint and send DELETE requests with 
  the id parameter to remove menus or buttons departments can grant their roles.
