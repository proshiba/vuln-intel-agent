title: A missing authorization check in Brocade Fabric OS versions before 10.0.1
  REST API interface of affected platform releases allows an authenticated user,
  regardless of their assigned role or administrative scope, to retrieve 
  complete Monitoring and Alerting Policy Suite (MAPS) violation data across all
  logical switches. An attacker with low-privilege API access can leverage this 
  endpoint to dump chassis-wide system health metrics, port performance 
  violations, and configuration data without appropriate privileges.
