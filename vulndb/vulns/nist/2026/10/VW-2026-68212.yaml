title: JupyterLab is an extensible environment for interactive and reproducible 
  computing, based on the Jupyter Notebook Architecture. From JupyterLab 4.5.0 
  until 4.5.11 and 4.6.4, from Notebook 7.5.0 until 7.6.3, and from JupyterLite 
  Core 0.7.0 until 0.8.4, the system clipboard cell-paste path accepts 
  attacker-controlled cell JSON without clearing metadata.trusted. When 
  useSystemClipboardForCells is active and pasteCodeCellsWithoutOutput is 
  disabled, a pasted code cell can mark HTML output as trusted, bypass output 
  sanitization, and execute script in the authenticated JupyterLab origin 
  without executing the cell. Markdown and raw cells are not affected because 
  their output is sanitized. This issue is fixed in JupyterLab 4.5.11 and 4.6.4,
  Notebook 7.6.3, and JupyterLite Core 0.8.4.
