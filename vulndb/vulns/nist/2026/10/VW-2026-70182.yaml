title: A vulnerability has been found in sgl-project sglang up to 0.5.21. This 
  issue affects the function server_info of the file 
  python/sglang/srt/entrypoints/http_server.py of the component HTTP Endpoint. 
  Such manipulation of the argument api_key leads to cleartext transmission of 
  sensitive information. It is possible to launch the attack remotely. Attacks 
  of this nature are highly complex. The exploitability is assessed as 
  difficult. The exploit has been disclosed to the public and may be used. The 
  pull request to fix this issue awaits acceptance.
