title: The Fundiin cho WooCommerce WordPress plugin through 3.4.0 does not have 
  proper authorisation on several of its REST API routes, relying instead on a 
  credential that is identical on every installation, allowing unauthenticated 
  attackers to disclose the store's payment credentials and customer order data,
  overwrite the payment gateway configuration so that payments are credited 
  elsewhere, and mark unpaid orders as paid. The same missing authorisation also
  allows arbitrary script to be stored in a field which is output unescaped on 
  the classic checkout, leading to unauthenticated stored XSS on stores that do 
  not use the block-based checkout.
