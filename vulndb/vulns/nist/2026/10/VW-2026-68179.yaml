title: "Active access tokens are not revoked or invalidated when a user account is
  locked within WSO2 Identity Server. This failure to enforce revocation allows previously
  issued, valid tokens to remain usable, enabling continued access to protected resources
  by locked user accounts.\n\nThe security consequence is that a locked user account
  can maintain access to protected resources through the use of existing, unexpired
  access tokens. This creates a security gap where access control policies are bypassed,
  potentially leading to unauthorized data access or actions until the tokens naturally
  expire."
