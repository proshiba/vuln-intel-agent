  legacy USB CDC virtual COM port driver that aliases rx_ringbuffer as a Serial 
  V2 rt_serial_rx_fifo in _function_enable(). A connected USB host configuring 
  the CDC device triggers writes past the ring buffer into struct vcom members 
  and an invalid rt_free() on close, causing denial of service.
