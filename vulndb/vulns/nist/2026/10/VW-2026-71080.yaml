title: Quasar Framework is a framework for building high-performance Vue.js user
  interfaces. Prior to 2.32.2, the openURL() utility in 
  ui/src/utils/open-url/open-url.js trusted window.SafariViewController whenever
  that global existed in an iOS environment. Attacker-controlled HTML rendered 
  by components such as QEditor can create a named SafariViewController element,
  causing browser named-property resolution to replace the expected native 
  bridge object. A later openURL() call then invokes isAvailable() on the 
  element, throws a TypeError, and disrupts external navigation, login 
  redirects, payment redirects, and other URL-opening workflows. QSelect and 
  QChatMessage HTML-rendering configurations can expose the same trigger when 
  they render attacker-controlled HTML. This issue is fixed in version 2.32.2.
