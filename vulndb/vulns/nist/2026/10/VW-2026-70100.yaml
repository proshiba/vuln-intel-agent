title: A vulnerability has been found in devopspolis secrets-replicator up to 
  0.4.0. Impacted is the function process_single_secret of the file 
  src/handler.py of the component AssumeRole Handler. Such manipulation of the 
  argument external_id leads to incorrect permission assignment. The attack can 
  be executed remotely. Upgrading to version 0.5.0 is recommended to address 
  this issue. The name of the patch is b42239405fbf4fae3c3f0048fc0b4225112edceb.
  It is suggested to upgrade the affected component.
