title: A security flaw has been discovered in baowzh hfly up to 
  638ff9abe9078bc977c132b37acbe1900b63491c. This issue affects some unknown 
  processing of the file /admin/index.php/advtext/add of the component advtext 
  Module. The manipulation results in cross site scripting. The attack can be 
  executed remotely. The exploit has been released to the public and may be 
  exploited. This product implements a rolling release for ongoing delivery, 
  which means version information for affected or updated releases is 
  unavailable. The vendor was contacted early about this disclosure but did not 
  respond in any way.
