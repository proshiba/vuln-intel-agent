title: CommandKit is the discord.js meta-framework for building Discord bots. In
  versions 1.2.0-rc.1 through 1.2.0-rc.11, a logic flaw exists in the message 
  command handler that affects how the commandName property is exposed to both 
  middleware functions and command execution contexts when handling command 
  aliases. When a message command is invoked using an alias, the ctx.commandName
  value reflects the alias rather than the canonical command name. This occurs 
  in both middleware functions and within the command's own run function. 
  Although not explicitly documented, CommandKit's examples and guidance around 
  middleware usage implicitly convey that ctx.commandName represents the 
  canonical command identifier. Middleware examples in the documentation 
  consistently use ctx.commandName to reference the command being executed. 
