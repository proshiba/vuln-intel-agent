title: "A flaw was found in ansible-core. When installing a collection with\n`ansible-galaxy
  collection install`, the archive extractor validates member\npaths using lexical
  path normalisation (os.path.abspath) instead of resolving\nsymbolic links (os.path.realpath),
  and it performs no containment check on\nsymlink-typed directory members before
  creating them. A crafted collection\ntarball can chain symlink directory entries
  so that a subsequent file member is\nwritten outside the intended destination directory.
  This allows an attacker who\ncan get a victim to install a malicious collection
  to overwrite arbitrary files\nwith the privileges of the user running ansible-galaxy,
  leading to code\nexecution on the control node. This is a bypass of the fix for
  CVE-2020-10691."
