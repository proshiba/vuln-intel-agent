title: "For XSA-308 logic was introduced, as VMX VMEntry checks do not like the\n\
  exact combination of state which occurs when #DB in intercepted, Single\nStepping
  is active, and blocked by STI/MovSS is active, despite this being\na legitimate
  state to be in.  The resulting VMEntry failure is fatal to\nthe guest.\n\nSadly
  there is another special sub-case of the above, with branch tracing\nenabled.  In
  that case the prior adjustment would still cause a VMentry\nfailure, as before fatal
  to the guest."
