title: vLLM is an inference and serving engine for large language models. Prior 
  to 0.28.0, the default mirrored multimodal LRU cache can commit a media hash 
  in the frontend sender cache during multimodal rendering and before engine 
  admission, while the engine receiver cache never receives the payload if that 
  request is rejected. A later request reusing the same media hash causes 
  MultiModalProcessorSenderCache to send no payload and MultiModalReceiverCache 
  to reach an assertion with the message "Expected a cached item," producing a 
  shared-service availability failure. This issue is fixed in version 0.28.0.
