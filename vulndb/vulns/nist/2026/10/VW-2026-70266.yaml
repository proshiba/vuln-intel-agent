title: LibreOffice can link to audio and video files from a document, and on 
  Linux it plays them with GStreamer. A linked media file could be an HLS 
  playlist that made GStreamer read the local files and remote URLs it listed 
  while the document loaded, and their contents could end up in the document. In
  fixed versions LibreOffice does not follow playlists that name further 
  resources, and linked media is under link update control.
