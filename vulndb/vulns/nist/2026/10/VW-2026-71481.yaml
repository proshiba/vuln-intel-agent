title: A stored cross-site scripting (XSS) vulnerability may allow an 
  authenticated, high-privilege administrator to store malicious content in a 
  configuration. The content may execute in another authenticated user's browser
  when that user views or compares the affected configuration. Successful 
  exploitation may allow the attacker to act through the victim's authenticated 
  browser session to access sensitive data, modify configurations, or disrupt 
  managed wireless services.
