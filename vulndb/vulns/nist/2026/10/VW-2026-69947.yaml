title: The TillKit WordPress plugin before 1.0.5 does not require the 
  hard-coded, publicly known PIN of the privileged POS account it creates on 
  activation to be changed before use, and it authenticates its public POS login
  endpoint on that PIN alone with no identity or capability check, allowing 
  unauthenticated attackers to obtain a privileged POS session and thereby read 
  customer and site-user personal data and modify store data.
