title: Dify is an open-source LLM app development platform. Prior to 1.13.0, the
  /console/api/remote-files/upload endpoint in 
  api/controllers/web/remote_files.py accepted an attacker-controlled URL 
  without authentication and caused the Dify server to retrieve it. A remote 
  attacker could use the endpoint to send requests to internal services or cloud
  metadata endpoints, potentially exposing sensitive data and using the server 
  as a network pivot. This issue is fixed in version 1.13.0.
