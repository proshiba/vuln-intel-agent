title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ip_tunnel: initialize `options_len` before referencing options\n\nThe following
  command triggers a kernel panic:\n\n  ip link add d0 type dummy; ip link set d0
  up\n  ip route add 10.30.0.0/16 \\\n    encap ip id 300 geneve_opts 4660:66:11223344
  dev d0\n\n  memcpy: detected buffer overflow: 4 byte write of buffer size 0\n  kernel
  BUG at lib/string_helpers.c:1044!\n  ...\n  ip_tun_parse_opts.part.0.cold+0x10/0x10\n\
  \  ip_tun_build_state+0x116/0x2a0\n\nOn kernels built with GCC 15+ and `CONFIG_FORTIFY_SOURCE`,
  the fortified\n`memcpy()` got 0 sized destination with request of 4 bytes length:\n\
  \n  static int ip_tun_parse_opts_geneve(...)\n  {\n      ...\n      attr = tb[LWTUNNEL_IP_OPT_GENEVE_DATA];\n\
  \      data_len = nla_len(attr); /* == 4 */\n\n      struct geneve_opt *opt = ip_tunnel_info_opts(info)
  + opts_len;\n      memcpy(opt->opt_data, nla_data(attr), data_len);\n      /*  \
  \   ^^^^^^^^^^^^^ 0 since options_len is assigned afterwards */\n\nFix"
