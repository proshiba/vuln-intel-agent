title: EspoCRM 4.0.0 before 10.0.7 contains an access control vulnerability that
  allows authenticated users to read audited field values restricted by 
  field-level security by fetching individual stream notes. Users with stream 
  access to a parent record can request GET /Note/{id}, which skips the 
  NoteAccessControl filter, and recover data.attributes.was and became values of
  restricted fields.
