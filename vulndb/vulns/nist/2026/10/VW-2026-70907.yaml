title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  coredump: Quiesce dump work on unregister\n\nhci_devcd_handle_pkt_init() arms dump_timeout
  and coredump producers\nqueue dump_rx without holding an hdev reference. Unregister
  leaves both\nworks live, so disconnecting during an active dump lets them access
  hdev\nafter hci_release_dev() frees it.\n\nShut down coredump processing during
  unregister. Close the producer gate\nunder dump_q.lock before disabling both works,
  then free the active buffer\nand queued packets under hci_dev_lock. Serializing
  the gate with enqueue\nprevents controller-specific workers from adding packets
  after the final\npurge."
