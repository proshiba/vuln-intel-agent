title: vLLM is an inference and serving engine for large language models. Prior 
  to 0.30.0, the Rust frontend's track_http_metrics middleware records the raw 
  HTTP method token as a Prometheus label for requests reaching registered 
  routes. An unauthenticated attacker can send unique arbitrary method tokens to
  unguarded routes such as /tokenize, causing Prometheus's Family::get_or_create
  function to permanently create counter and histogram label sets. Those label 
  sets increase process memory usage and enlarge the /metrics response until the
  service or monitoring path is exhausted. This issue is fixed in version 
  0.30.0.
