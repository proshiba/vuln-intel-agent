title: sveltekit-superforms makes SvelteKit forms a pleasure to use. 
  sveltekit-superforms v2.27.3 and prior are susceptible to a prototype 
  pollution vulnerability within the parseFormData function of formData.js. An 
  attacker can inject string and array properties into Object.prototype, leading
  to denial of service, type confusion, and potential remote code execution in 
  downstream applications that rely on polluted objects. This vulnerability is 
  fixed in 2.27.4.
