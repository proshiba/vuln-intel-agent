title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  SysDepartPermissionController that allows any authenticated user to modify 
  department permission records by calling the edit endpoint. Low-privileged 
  attackers can obtain row ids from the unguarded list endpoint and overwrite 
  depart_id, permission_id and data_rule_ids to alter which menus and data rules
  departments may delegate.
