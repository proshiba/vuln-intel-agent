title: A vulnerability was detected in pmTicket Project-Management-Software up 
  to 2ef379da2075f4761a2c9029cf91d073474e7486. The affected element is the 
  function loadLanguage of the file classes/class.database.php of the component 
  Cookie Handler. Performing manipulation of the argument user_id results in 
  deserialization. The attack can be initiated remotely. The exploit is now 
  public and may be used. Continious delivery with rolling releases is used by 
  this product. Therefore, no version details of affected nor updated releases 
  are available. The vendor was contacted early about this disclosure but did 
  not respond in any way.
