title: The String locator WordPress plugin before 2.6.8 does not restrict the 
  classes allowed when deserializing the content of a database row saved through
  its database editor, allowing unauthenticated attackers to store a serialized 
  PHP object that is instantiated when an administrator later opens and saves 
  that row. If a suitable POP chain is present via another installed String 
  locator WordPress plugin before 2.6.8 or , this can lead to arbitrary file 
  deletion, sensitive data disclosure or remote code execution.
