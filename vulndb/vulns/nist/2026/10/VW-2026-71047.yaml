title: SimpleChat is a secure AI conversation application with personal and 
  group workspaces for document-grounded interactions. In versions 0.261.003 and
  0.261.027, an authorization ordering flaw in POST /api/user/plugins allows an 
  authenticated low-privileged user to omit the top-level MCP type so that 
  _reject_non_admin_mcp_stdio skips inspection before the type is restored from 
  metadata. The stored personal action can then reach 
  McpPluginFactory.create_connector, and MCPStdioPlugin.connect starts the 
  attacker-selected operating-system process under the application service 
  identity when the action tool is invoked. Exploitation requires personal 
  plugins to be enabled and governance to permit MCP actions, and it can expose 
  or modify secrets and data available to the service or disrupt the service. 
  This issue is fixed in version 0.261.031.
