title: Hugo from v0.84.0 before v0.167.0 contains a path traversal vulnerability
  that allows malicious themes or modules to read files outside the project root
  via ESBuild's fallback resolver in js.Build, js.Batch, and css.Build. 
  Attackers can ship relative imports or symlinks pointing outside the project 
  to bundle any file readable by the build user into published JavaScript or CSS
  output.
