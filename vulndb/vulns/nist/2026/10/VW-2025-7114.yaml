title: "An Authentication Bypass by Primary Weakness\n\nin the FTP server of Juniper
  Networks Junos OS allows an unauthenticated, network-based attacker to get limited
  read-write access to files on the device.\nWhen the FTP server is enabled and a
  user named \"ftp\" or \"anonymous\" is configured, that user can login without providing
  the configured password and then has read-write access to their home directory.\n\
  \nThis issue affects Junos OS: \n\n\n\n  *  all versions before 22.4R3-S8,\n  *\
  \  23.2 versions before 23.2R2-S3,\n  *  23.4 versions before 23.4R2."
