title: PickMall lilishop through 4.4 contains an insecure direct object 
  reference vulnerability that allows authenticated sellers to overwrite any 
  store's product by supplying another store's goodsId to the goods update 
  endpoint. Attackers can send PUT requests to 
  /store/goods/goods/update/{goodsId} to replace product details and SKUs and 
  reassign products to their own store.
