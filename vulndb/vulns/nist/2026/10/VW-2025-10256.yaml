title: A vulnerability in the file upload at bookmark + asset rendering pipeline
  allows an attacker to upload a malicious SVG file with JavaScript content. 
  When an authenticated admin user views the SVG file with embedded JavaScript 
  code of shared bookmark, JavaScript executes in the admin’s browser, retrieves
  the CSRF token, and sends a request to change the admin's password resulting 
  in a full account takeover.
