title: The JAXB factory methods historically relied solely on 
  `FEATURE_SECURE_PROCESSING` to prevent XML External Entity (XXE) resolution. 
  On JAXP implementations where that feature alone does not block external 
  entity resolution, an attacker who can get untrusted XML unmarshalled through 
  JAXB can read local files via out-of-band XXE.
