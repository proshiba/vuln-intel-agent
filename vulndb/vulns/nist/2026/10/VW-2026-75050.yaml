title: dataclasses-avroschema generates Avro schemas from Python dataclasses, 
  Pydantic models, and Faust Records and generates Python code from Avro 
  schemas. From version 0.44.0 through 0.70.5, the Pydantic and AvroDantic model
  generators insert a schema field's pydantic-class value after pydantic. in a 
  generated field annotation without safely restricting the expression. Because 
  annotations are evaluated when the generated module is imported, a crafted 
  value can execute arbitrary Python code. Version 0.70.6 fixes the 
  vulnerability by restricting the value to a bare name or a call to a bare name
  with literal arguments.
