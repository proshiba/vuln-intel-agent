title: A security vulnerability has been detected in Tencent WeKnora up to 
  0.8.1. Impacted is the function validateSubquery of the file 
  internal/utils/inject.go of the component SQL Validator. The manipulation 
  leads to sql injection. The attack is possible to be carried out remotely. The
  exploit has been disclosed publicly and may be used. Upgrading to version 
  0.8.2 is recommended to address this issue. The identifier of the patch is 
  d7ccd5ba517cc3968e6d5000a2ab0f4b51ef1dda. It is recommended to upgrade the 
  affected component.
