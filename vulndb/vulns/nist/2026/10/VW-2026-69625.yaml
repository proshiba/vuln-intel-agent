title: ZcashFoundation Zebra zebra-rpc before 8.0.0 and zebrad before 4.5.0 
  contain a reachable assertion in the z_listunifiedreceivers RPC handler, which
  calls expect() on Sapling receiver parsing that fails for Unified Addresses 
  carrying invalid Jubjub points. Authenticated RPC clients can submit such an 
  address to abort the zebrad process, repeatably keeping the node offline.
