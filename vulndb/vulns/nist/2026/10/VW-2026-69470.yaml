title: The Super Forms – Drag & Drop Form Builder plugin for WordPress is 
  vulnerable to Directory Traversal in all versions up to, and including, 
  6.3.316 via the parse_request function. This makes it possible for 
  unauthenticated attackers to read the contents of arbitrary files on the 
  server, which can contain sensitive information. The optional 
  'file_upload_auth' setting defaults to empty, meaning no authentication is 
  required in the default configuration; enabling this setting mitigates 
  unauthenticated exploitation but does not remediate the path traversal itself.
  Exploitation on Linux requires a real 13-digit timestamp directory to exist, 
  whereas on Windows the traversal works with any hardcoded 13-digit prefix. 
  However, the plugin's file upload response returns the name of the created 
  directory, which means the vulnerability is exploitable as long as file upload
  is enabled on the form.
