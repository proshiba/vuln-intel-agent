title: SmarterMail before build 9777 contains a stored mutation cross-site 
  scripting vulnerability that allows remote attackers to inject executable 
  script by placing payloads inside a <style> element nested within MathML 
  foreign content (<math><mtext><mglyph>), which the custom HTML sanitizer 
  treats as inert CDATA text but browsers reparse as live markup. Attackers can 
  deliver a crafted calendar (iCal) message containing an <img src=x 
  onerror=...> payload that executes automatically in the recipient's webmail 
  session at /interface/message-iframe when the message is opened, enabling 
  script execution and data exfiltration unconstrained by the interface's 
  permissive Content-Security-Policy.
