title: A vulnerability was detected in ggml-org whisper.cpp up to 1.8.2. 
  Affected is the function read_audio_data of the file 
  /whisper.cpp/examples/common-whisper.cpp. The manipulation results in use 
  after free. The attack requires a local approach. The exploit is now public 
  and may be used. The project was informed of the problem early through an 
  issue report but has not responded yet.
