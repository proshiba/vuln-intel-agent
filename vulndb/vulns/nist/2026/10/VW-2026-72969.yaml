title: The Data Tables Generator by Supsystic plugin for WordPress is vulnerable
  to Stored Cross-Site Scripting via Table Cell 'data' Value via updateRows 
  Action in all versions up to, and including, 1.15.1 due to insufficient input 
  sanitization and output escaping. This makes it possible for authenticated 
  attackers, with subscriber-level access and above, to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  This is only exploitable by Subscriber-level users when an administrator has 
  added their role to the plugin's 'access_roles' setting, which is a documented
  and explicitly supported plugin feature that grants lower-privileged users 
  access to the dtgs_nonce required to reach the vulnerable updateRows action 
  handler.
