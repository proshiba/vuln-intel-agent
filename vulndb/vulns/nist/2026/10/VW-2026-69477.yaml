title: The Ninja Forms – The Contact Form Builder That Grows With You plugin for
  WordPress is vulnerable to Stored Cross-Site Scripting via Paragraph Text 
  (RTE) Field Submission in all versions up to, and including, 3.15.4 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. This is only 
  exploitable when the targeted Paragraph Text field has the Rich Text Editor 
  (RTE) option enabled.
