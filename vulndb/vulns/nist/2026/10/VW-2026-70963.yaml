title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  virt_wifi: free skb when disconnected\n\nWhen the simulated link is disconnected,
  virt_wifi_start_xmit() returns\nNET_XMIT_DROP without freeing the skb. dev_hard_start_xmit()
  treats this\nreturn value as consumed, so every packet sent while disconnected leaks
  its\nskb.\n\nFree the skb before returning the drop status."
