title: Frappe HR (hrms) before 16.11.0, including all 14.x and 15.x releases 
  through 15.64.3, contains a missing authorization vulnerability in the 
  whitelisted get_account_and_amount method that lets authenticated users read 
  payroll amounts. Attackers without HR roles can call the method over 
  /api/method with enumerable Salary Slip or claim document names to disclose 
  other employees' net pay and loan, advance, and claim balances.
