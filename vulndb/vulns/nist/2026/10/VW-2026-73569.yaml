title: JeecgBoot through 3.9.5 contains a missing authorization vulnerability in
  the SysMessageTemplateController delete handler that allows any authenticated 
  user to delete message templates. Low-privileged attackers can obtain template
  ids from the unguarded list endpoint and delete shipped notification 
  templates, causing system notices and workflow reminders to fail.
