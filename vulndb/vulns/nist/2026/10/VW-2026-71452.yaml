title: Hydra is a framework for elegantly configuring complex applications. 
  Prior to 1.3.6 and 1.4.0.dev9, Hydra passes Python logging configuration to 
  logging.config.dictConfig() without applying Hydra's target policy to handler 
  class values or formatter, filter, handler, queue, and listener factories. An 
  attacker who controls Hydra logging configuration can therefore select an 
  importable class or factory and cause it to be invoked with the application's 
  privileges, even in versions where instantiate() is protected because the 
  logging path does not use instantiate(). This issue is fixed in versions 1.3.6
  and 1.4.0.dev9.
