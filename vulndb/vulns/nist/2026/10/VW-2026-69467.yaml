  all versions up to, and including, 7.6.12. This is due to insufficient input 
  validation on the 'Feed Config' field which is passed directly to the eval() 
  function. This makes it possible for authenticated attackers, with 
  Administrator-level access and above, to execute arbitrary PHP code on the 
  server.
