title: A flaw was found in SSSD. When configured with the Entra ID identity 
  provider, input lookup names containing single quotes are not properly escaped
  before being included in Microsoft Graph Open Data Protocol (OData) queries. A
  low-privileged local user can exploit this flaw by submitting a crafted search
  request, altering query filters to broaden user or group searches. This can 
  lead to information disclosure by retrieving unintended directory objects, as 
  well as a Denial of Service (DoS) through excessive processing and cache 
  population.
