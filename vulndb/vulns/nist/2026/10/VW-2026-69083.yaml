title: The Extendify plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via 'styles.blocks' Block Type Key in all versions up to, and 
  including, 3.1.6 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  This is possible because registerIncoming() is hooked on 
  rest_request_before_callbacks and runs before WordPress evaluates the route's 
  permission_callback, meaning any unauthenticated POST, PUT, or PATCH request 
  to a /wp/v2/global-styles route can trigger the vulnerable code path.
