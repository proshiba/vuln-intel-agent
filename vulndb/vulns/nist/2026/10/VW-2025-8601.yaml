title: A vulnerability was identified in LogicalDOC Community Edition up to 
  9.2.1. This vulnerability affects unknown code of the file /login.jsp of the 
  component Admin Login Page. Such manipulation leads to improper restriction of
  excessive authentication attempts. The attack can be executed remotely. This 
  attack is characterized by high complexity. It is stated that the 
  exploitability is difficult. The exploit is publicly available and might be 
  used. The vendor was contacted early about this disclosure but did not respond
  in any way.
