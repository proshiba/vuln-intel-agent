title: The Super Forms – Drag & Drop Form Builder plugin for WordPress is 
  vulnerable to Arbitrary File/Directory Deletion in all versions up to, and 
  including, 6.3.316. This is due to the `super_save_form` AJAX handler 
  performing no capability check — allowing Subscriber-level authenticated users
  to create or modify Super Forms and enable the `file_upload_submission_delete`
  setting — combined with the `super_submit_form` handler's `submit_form` 
  function passing the attacker-controlled `files[].subdir` value from 
  `$_POST['data']` directly into `SUPER_Common::delete_dir()` without 
  sanitization, and a trivially bypassed `ABSPATH` guard that a `subdir` value 
  of `wp-config.php` defeats because `dirname(realpath(ABSPATH . $subdir))` 
  resolves to the WordPress root while the naive `ABSPATH !== $dir` string check
  fails to match due to a trailing-slash mismatch. This makes it possible for 
  authenticated attackers, with Subscriber-level access and above, to 
