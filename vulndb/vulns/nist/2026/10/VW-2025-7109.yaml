title: "An Uncontrolled Resource Consumption vulnerability in the HTTP daemon (httpd)
  of Juniper Networks Junos Space allows an unauthenticated network-based attacker
  flooding the device with inbound API calls to consume all resources on the system,
  leading to a Denial of Service (DoS).\n\nAfter continuously flooding the system
  with inbound connection requests, all available file handles become consumed, blocking
  access to the system via SSH and the web user interface (WebUI), resulting in a
  management interface DoS. A manual reboot of the system is required to restore functionality.\n\
  \nThis issue affects Junos Space: \n  *  all versions before 22.2R1 Patch V3, \n\
  \  *  from 23.1 before 23.1R1 Patch V3."
