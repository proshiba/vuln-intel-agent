title: "In the Linux kernel, the following vulnerability has been resolved:\n\nesp:
  downgrade zerocopy managed frags before mutating skb frags\n\nOn the out-of-place
  output path (esp->inplace == false) ESP rewrites the\nskb frag array: esp_output_head()
  appends a trailer frag and\nesp_output_tail() replaces the frags with a destination
  page, both\nreferenced with get_page().\n\nWhen the skb carries zerocopy managed
  frags (SKBFL_MANAGED_FRAG_REFS) the\npayload frags are owned by the ubuf and must
  not be referenced or\nunreferenced individually, but ESP mutates the frag array
  without ever\ndowngrading the skb.  This breaks the managed-frag invariant two ways:\n\
  \n  - esp_ssg_unref() walks the source scatterlist and drops a page\n    reference
  for every frag, including the ubuf-owned payload frags,\n    pushing their refcount
  below the GUP pin bias while the pages are\n    still pinned, i.e. a use-after-free
  of the zerocopy pages;\n\n  - esp_output_tail() installs its destination page as
  frag 0 with\n    get_page() b"
