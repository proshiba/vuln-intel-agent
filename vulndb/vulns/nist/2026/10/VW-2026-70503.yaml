title: Langflow is a tool for building and deploying AI-powered agents and 
  workflows. Before Langflow 1.10.3, the MCP stdio transport launched whatever 
  command / args a user put in an MCP server configuration, with no allowlist 
  and (before 1.10.3) wrapped in bash -c "exec {command} ...". Any user able to 
  reach the MCP server settings ("Settings → MCP Servers → Add MCP Server", 
  POST/PATCH /api/v2/mcp/servers/{server_name}) or to build a flow with the MCP 
  Tools component could add a "server" whose command is an arbitrary OS command 
  (touch, rm -rf, a reverse shell, ...). The command runs on the Langflow host 
  as the Langflow process user as soon as Langflow tries to connect to the 
  server (listing servers, loading tools, running the flow) — even when the UI 
  then reports that the stdio server failed to start. With the default 
