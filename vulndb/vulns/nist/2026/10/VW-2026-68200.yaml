title: A vulnerability was detected in risesoft-y9 WorkFlow-Engine up to 9.6.10.
  Impacted is the function getByIdAndYear of the file 
  CustomHistoricProcessServiceImpl.java of the component OAuth2 Resource Filter.
  Performing a manipulation of the argument year/processInstanceId results in 
  sql injection. Remote exploitation of the attack is possible. The exploit is 
  now public and may be used. The sink is injectable on two independent 
  positions, not just one. The vendor was contacted early about this disclosure 
  but did not respond in any way.
