title: An uncontrolled search path element vulnerability in GlavSoft TightVNC 
  Server for Windows before 2.8.88 allows a local authenticated user to execute 
  arbitrary code with SYSTEM privileges. DynamicLibrary::init() (and ThemeLib) 
  load screenhooks32.dll / screenhooks64.dll with LoadLibrary() using a bare 
  file name and no LOAD_LIBRARY_SEARCH_* flags, so the TightVNC service follows 
  the default DLL search order and loads an attacker-planted DLL from a writable
  directory earlier in that order (for example, an installation directory with 
  permissive ACLs).
