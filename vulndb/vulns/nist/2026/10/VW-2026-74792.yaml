title: NVIDIA AIStore for Linux contains a path traversal vulnerability in the 
  target-side object rename handler, where an unauthenticated remote attacker 
  could cause an improper limitation of a pathname to a restricted directory by 
  submitting a crafted rename destination directly to an AIStore target, 
  resulting in the arbitrary creation or overwrite of a file. A successful 
  exploit of this vulnerability might lead to code execution, escalation of 
  privileges, information disclosure, data tampering, and denial of service.
