  vulnerability in RADIUS CHAP verification because Password::chap_verify() 
  returns true when the supplied response does not match. Attackers who know a 
  valid customer or PPPoE username can log in through MikroTik hotspot or PPPoE 
  CHAP with any incorrect password to obtain network access and consume that 
  customer's plan.
