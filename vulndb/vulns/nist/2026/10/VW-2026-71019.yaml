title: lrzsz before 0.13.0 contains an OS command injection vulnerability in the
  lrz receive utility's pipe mode that allows remote senders to execute commands
  by supplying crafted filenames. When lrz runs under a suffixed name such as 
  lrztar, procheader() in src/lrz.c passes the unescaped ZMODEM/YMODEM filename 
  to popen(), so shell metacharacters execute as the receiving user.
