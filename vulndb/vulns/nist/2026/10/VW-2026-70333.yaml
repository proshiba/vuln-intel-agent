title: Plane is an open-source project management tool. Prior to 1.4.0, Plane's 
  project invitation list endpoint is accessible to any authenticated user who 
  knows the workspace slug and project ID, while the public project invitation 
  join endpoint accepts an invitation based only on a submitted email address. 
  When a pending invitation targets an email address that has not registered 
  with Plane, an attacker can enumerate the invitation, register an account 
  using the invited email without mailbox verification, and accept the 
  invitation. The attacker-controlled account is then added to the target 
  workspace and project. This issue is fixed in 1.4.0.
