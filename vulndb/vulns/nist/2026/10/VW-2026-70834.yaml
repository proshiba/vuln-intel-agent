title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKEYS:
  encrypted: fix integer overflow of datablob_len\n\nencrypted_key_alloc() stores
  datablob_len in a u16. It is computed from\nmultiple string and payload lengths.
  If the result exceeds U16_MAX, the\nassignment truncates the allocation size. KASAN
  reports a 32760-byte\nslab-out-of-bounds write when __ekey_init() copies the master
  key\ndescription into the undersized buffer.\n\nThe total payload length stored
  in key->datalen is also a u16. Use\ncheck_add_overflow() to reject values that do
  not fit either destination,\nand use kzalloc_flex() for the flexible-array allocation."
