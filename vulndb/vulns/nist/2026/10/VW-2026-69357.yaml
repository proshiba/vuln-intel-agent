title: "Tapo C120 v1 and C200 v5\ncontain a NULL pointer dereference in the HTTPS
  onboarding connect request parser.  The interface is reachable without\nauthentication
  after initial setup and does not validate that a password field\nis present for
  certain authentication and encryption parameter combinations,\nallowing a malformed
  request from the same local network to crash the HTTPS service\n\n\n\n\n\n\n\n\n\
  \n\n Successful exploitation may\ntemporarily make HTTPS management functions unavailable.
  Repeated malformed\nrequests may sustain the denial-of-service condition, and recovery
  may in some\ncases require a device reboot."
