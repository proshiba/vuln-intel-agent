title: Hydra is a framework for elegantly configuring complex applications. From
  1.2.0 until 1.3.0 and 1.4.0.dev10, the hydra-optuna-sweeper package accepts a 
  configuration-controlled dotted path in hydra.sweeper.custom_search_space, 
  resolves it with hydra.utils.get_method(), and later invokes the returned 
  callable in the Hydra controller process. Because get_method() is a 
  trusted-input lookup helper and does not apply the execution policy used by 
  instantiate(), an attacker who controls Optuna sweep configuration or 
  command-line overrides can select importable Python code for execution with 
  the application's privileges, including bypassing a trusted execution 
  whitelist on affected Hydra 1.4 development releases. This issue is fixed in 
  versions 1.3.0 and 1.4.0.dev10.
