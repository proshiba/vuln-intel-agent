title: FreeRDP from 2.0.0-beta1 before 3.28.0 contains an out-of-bounds read 
  vulnerability in smartcard_LocateCardsByATRA_Call because the ATR pattern 
  cbAtr byte count is not capped. Malicious RDP servers can send crafted ATR 
  mask arrays to use query timing as an oracle, leaking heap memory bit-by-bit 
  to defeat ASLR and aid RCE exploits.
