title: "The Link Layer Control Procedure (LLCP) implementation of the Zephyr software
  Bluetooth LE Controller retains the receive node that carried an accepted LL_PHY_UPDATE_IND
  so that it can later be reused for the host notification when the update instant
  is reached (llcp_rx_node_retain() in subsys/bluetooth/controller/ll_sw/ull_llcp.c,
  and the node is deliberately not recycled while marked NODE_RX_TYPE_RETAIN). The
  invalid-PDU arms of llcp_lp_pu_rx() and llcp_rp_pu_rx() in subsys/bluetooth/controller/ll_sw/ull_llcp_phy.c
  completed the procedure via llcp_lr_complete() / llcp_rr_complete() without first
  releasing that retained node, so the procedure context — the only remaining reference
  to the node — was freed while the node was still held out of the receive pool.\n\
