title: "The Animated Number Counters plugin for WordPress is vulnerable to generic
  SQL Injection via the 'counterid' parameter in all versions up to, and including,
  3.0 due to insufficient escaping on the user supplied parameter and lack of sufficient
  preparation on the existing SQL query. This makes it possible for authenticated
  attackers, with editor-level access and above, to append additional SQL queries
  into already existing queries that can be used to extract sensitive information
  from the database. This is a second-order SQL injection: the write path correctly
  uses $wpdb->prepare(), but that protection is not carried forward to the read path,
  where the retrieved value is concatenated unsanitized into unprepared queries in
  both a single-quoted string context and a bare numeric context."
