title: A vulnerability was determined in Jeebase 0.0.1. This vulnerability 
  affects the function updateUser of the file /user/update/info of the component
  UserService. Executing a manipulation of the argument user/tempUser can lead 
  to dynamically-determined object attributes. The attack can be executed 
  remotely. The exploit has been publicly disclosed and may be utilized. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
