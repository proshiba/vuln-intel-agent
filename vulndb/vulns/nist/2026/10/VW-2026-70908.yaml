title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btintel_pcie: validate TX skb length in send_sync\n\nbtintel_pcie_prepare_tx() copies
  skb->len bytes into a fixed\nBTINTEL_PCIE_BUFFER_SIZE (4096) DMA slot via an unchecked
  memcpy.\nOversized packets are currently rejected only in\nbtintel_pcie_send_frame();
  any future caller of\nbtintel_pcie_send_sync() would silently overflow the DMA buffer.\n\
  \nAdd the bounds check in btintel_pcie_send_sync() itself, right\nbefore skb_push()
  and the DMA copy."
