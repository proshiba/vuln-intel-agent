title: The ACPT (Premium) plugin for WordPress is vulnerable to Remote Code 
  Execution in all versions up to, and including, 2.0.66 via the render 
  function. This is due to missing capability check on the REST API form 
  creation endpoint and unsandboxed Twig environment rendering email templates. 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to execute code on the server. The exploit requires the 
  attacker to first create a form with malicious email_settings via the REST API
  endpoint, then trigger form submission to execute the injected Twig 
  expressions.
