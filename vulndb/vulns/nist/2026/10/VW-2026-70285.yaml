title: 'Joomla Extension - svenbluege.de - Cross-site request forgery of list tasks
  of the backend in Event Gallery extension < 6.6.0 - Eight tasks which the buttons
  of the back-end lists call did not check the form token: setting the default payment
  method, shipping method, image type set, order status and watermark; putting an
  event into the shop or taking it out; choosing the main image of an event and whether
  an image is shown only as the main image; and sorting the images of an event. A
  prepared page on another web site could trigger them in the name of a logged in
  administrator and change those settings and flags. Nothing can be deleted or read
  this way; orders are not affected.'
