title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: avoid out-of-bounds read for empty PREQ elements\n\nieee80211_mesh_preq_size_ok()
  derives the location of the PREQ bottom\nfields before checking whether the element
  contains even the fixed\nheader. ieee80211_mesh_hwmp_preq_get_bottom() reads the
  flags byte to\naccount for the optional Address Extension field. Consequently, an\n\
  empty PREQ element causes a one-byte read beyond its declared payload.\n\nMove the
  helper call after both size checks, so the bottom fields are\nonly accessed when
  they are present."
