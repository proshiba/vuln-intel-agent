title: A flaw was found in Quay. An authenticated repository administrator could
  bypass the hostname blacklist in webhook notifications, leading to a 
  Server-Side Request Forgery (SSRF) vulnerability. This allows the Quay 
  application to be tricked into sending requests to internal network resources,
  such as cloud metadata services or other services within the cluster. 
  Consequently, this could lead to the disclosure of sensitive information from 
  these internal services.
