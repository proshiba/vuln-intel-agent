title: TransformerOptimus SuperAGI v0.0.14 contains an incorrect access control 
  vulnerability in delete_user_knowledge in superagi/controllers/knowledges.py. 
  In affected source snapshots, POST /knowledges/delete/{knowledge_id} deletes 
  the selected knowledge object without requiring authentication in the route 
  and without verifying organization ownership of the supplied knowledge_id.
