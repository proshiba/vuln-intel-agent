title: "Path traversal of 'trusted_jar_paths' in Impala 4.5.2 allows an attacker-controlled
  JAR to be loaded via a relative path where the prefix matches a path specified in
  'trusted_jar_paths'.\n\n\n\n\nThe startup flag 'trusted_jar_paths' references URIs
  for loading files from local or remote filesystems. Path traversal can't override
  the schema, but can result in loading a JAR that has been uploaded to a different
  location in that filesystem via Impala DDLs such as CREATE DATA SOURCE and CREATE
  TABLE. Path traversal can only be used if a trusted path exists, so this attack requires
  'trusted_jar_paths' have a non-empty value configured by the Impala admin.\n\n\n\
  \n\nUsers are recommended to upgrade to version 4.5.3, which fixes this issue."
