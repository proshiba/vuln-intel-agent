title: Ghost is a Node.js content management system. From version 6.34.0 until 
  6.67.0, embed cards in the Ghost editor could bypass protections against 
  stored cross-site scripting. Any staff user, including Contributors, could 
  store scripts in post content that ran when another staff user opened the post
  in the editor, potentially compromising that user’s admin session. Self-hosted
  sites should leave the new  security.embedPreviewUrl  configuration option at 
  its default value. This issue is fixed in version 6.67.0.
