title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  Bound fragmented header copies by the remaining length\n\nsiw_get_hdr() can receive
  an extended DDP/RDMAP header across more than\none TCP callback. The first callback
  may receive most of the header,\nwhile the next one still limits the copy to hdrlen
  - MIN_DDP_HDR instead\nof the number of missing bytes. This makes the destination
  move past the\nend of the header and overwrite the receive state, including\nfpdu_part_rcvd.
  A later callback can then use a negative fpdu_part_rcvd\nvalue as a copy offset,
  which creates an OOB write.\n\nUse the number of header bytes already received when
  calculating the\nnext copy length."
