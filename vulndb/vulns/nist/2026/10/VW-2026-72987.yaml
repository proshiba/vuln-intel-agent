title: The GeoDirectory – WP Business Directory Plugin and Classified Listings 
  Directory plugin for WordPress is vulnerable to Local File Inclusion in all 
  versions up to, and including, 2.8.187 via the 'design_type' parameter 
  parameter. This makes it possible for unauthenticated attackers to include and
  execute arbitrary .php files on the server, allowing the execution of any PHP 
  code in those files. This can be used to bypass access controls, obtain 
  sensitive data, or achieve code execution in cases where .php file types can 
  be uploaded and included. The required nonce is trivially obtainable by any 
  anonymous visitor, as the geodir_basic_nonce value is localized to every 
  public frontend page via the geodir_params script object, meaning no 
  authentication, user interaction, or specific site content is required to 
  exploit this vulnerability.
