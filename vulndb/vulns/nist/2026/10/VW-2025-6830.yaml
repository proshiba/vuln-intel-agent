title: The GiveWP – Donation Plugin and Fundraising Platform plugin for 
  WordPress is vulnerable to Information Exposure in all versions up to, and 
  including, 4.10.0 via the 'registerGetForm', 'registerGetForms', 
  'registerGetCampaign' and 'registerGetCampaigns' functions due to a missing 
  capability check. This makes it possible for unauthenticated attackers to 
  extract data from private and draft donation forms, as well as archived 
  campaigns.
