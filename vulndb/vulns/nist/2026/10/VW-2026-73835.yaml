title: A flaw has been found in krupalshah EmployeeRecruitmentSystem up to 
  922ff6d208278282e7c8e36d70d9ae356adec9fe. Affected by this vulnerability is 
  the function mysql_query of the file source/loginprocessing.php of the 
  component Login Handler. This manipulation of the argument email/password 
  causes sql injection. The attack can be initiated remotely. The exploit has 
  been published and may be used. Continious delivery with rolling releases is 
  used by this product. Therefore, no version details of affected nor updated 
  releases are available. The vendor was contacted early about this disclosure 
  but did not respond in any way. This vulnerability only affects products that 
  are no longer supported by the maintainer.
