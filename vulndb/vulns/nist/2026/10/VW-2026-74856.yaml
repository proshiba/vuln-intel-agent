title: Wazuh from 4.0.0 before 4.14.8 contains an authorization bypass 
  vulnerability that allows low-privileged authenticated users to read the RBAC 
  catalog by querying unprotected security endpoints. Attackers can request GET 
  /security/actions and /security/resources, which omit the caller's RBAC 
  policies, to map privileged actions and endpoints for privilege escalation 
  planning.
