title: The EventPrime – Events Calendar, Bookings and Tickets plugin for 
  WordPress is vulnerable to unauthorized booking note creation due to a missing
  capability check on the 'booking_add_notes' function in all versions up to, 
  and including, 4.2.0.0. This makes it possible for authenticated attackers, 
  with Subscriber-level access and above, to add a note to the backend view of 
  any booking.
