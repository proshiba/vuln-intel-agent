title: The Cache Enabler WordPress plugin before 1.8.17 does not validate a URL 
  before using it to build a filesystem path in its cache purge routine, and 
  does not confine the resulting deletion to the cache directory, allowing 
  unauthenticated users to delete arbitrary files and directories on sites where
  another installed Cache Enabler WordPress plugin before 1.8.17 or  passes a 
  request-derived URL to its public cache-clearing hook.
