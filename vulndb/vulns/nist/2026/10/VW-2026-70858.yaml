title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: Serialize local codec list cleanup\n\nhci_dev_close_sync() clears hdev->local_codecs
  after releasing hdev->lock.\nCodec list additions and both traversals in sco_sock_getsockopt()
  use that\nlock, but the close path does not. A close and BT_CODEC query can therefore\n\
  interleave as follows:\n\n  hci_dev_close_sync()          sco_sock_getsockopt()\n\
  \                                hci_dev_lock()\n                              \
  \  fetch codec entry\n  hci_codec_list_clear()\n    kfree(entry)\n             \
  \                   read entry->id\n\nThe reader then accesses an entry which the
  close path has freed. KASAN\n\n  BUG: KASAN: slab-use-after-free in sco_sock_getsockopt+0xfa0/0xfe0\n\
  \  Read of size 1 at addr ffff8881001c3450\n  Call Trace:\n   sco_sock_getsockopt+0xfa0/0xfe0\n\
  \   do_sock_getsockopt+0x537/0x7b0\n   __sys_getsockopt+0xf2/0x170\n  Allocated
  by task 92:\n   hci_codec_list_add.isra.0+0x2c/0x440\n   hci_read_codec_cap"
