title: The The All in One SEO – AI SEO Plugin to Boost SEO Rankings & Traffic 
  (Schema, Local SEO, Sitemap & SEO Insights) plugin for WordPress is vulnerable
  to arbitrary shortcode execution in all versions up to, and including, 5.0.2 
  This is due to the software allowing users to execute an action that does not 
  properly validate a value before running do_shortcode. This makes it possible 
  for unauthenticated attackers to execute arbitrary shortcodes. This requires 
  the AIOSEO breadcrumb to be rendered on the search results page via the block,
  widget, shortcode, or template tag.
