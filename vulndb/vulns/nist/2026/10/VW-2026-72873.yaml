title: AstronRPA through 1.1.6 contains a cross-site scripting vulnerability in 
  the desktop client's smart-component chat that allows remote attackers to 
  execute OS commands by abusing unsanitized LLM output rendered via v-html. 
  Attackers can embed prompt-injection content in a web page so the model emits 
  HTML event handlers invoking the unrestricted open-path IPC handler with shell
  metacharacters, executing commands as the desktop user.
