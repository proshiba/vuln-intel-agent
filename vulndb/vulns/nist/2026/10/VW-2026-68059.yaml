title: LibreChat is a ChatGPT clone with additional features. Version 0.8.1-rc2 
  does not enforce proper access control for file uploads to an agents file 
  context and file search. An authenticated attacker with access to the agent ID
  can change the behavior of arbitrary agents by uploading new files to the file
  context or file search, even if they have no permissions for this agent. This 
  issue is fixed in version 0.8.2-rc2.
