title: FreeRDP 3.0.0 before 3.32.0 does not remove card handles when 
  Emulate_SCardReleaseContext releases a smartcard-emulation context, so 
  Emulate_SCardTransmit later looks up the deleted parent context and reaches a 
  terminating WINPR_ASSERT. A malicious RDP server can crash a connecting client
  with smartcard emulation and redirection enabled by releasing a context, 
  establishing another, and issuing SCardTransmit with the stale card handle.
