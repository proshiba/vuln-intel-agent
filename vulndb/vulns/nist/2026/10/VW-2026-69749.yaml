title: Seroval facilitates JS value stringification, including complex 
  structures beyond JSON.stringify capabilities. From 0.12.0 until 1.6.2, 
  fromJSON deserialization of a fulfilled Promise control node can pass a 
  plugin-produced callable-bearing thenable to a native Promise resolver. 
  ECMAScript thenable assimilation then invokes the callable unexpectedly, 
  allowing attacker-controlled JSON to trigger code in applications using 
  plugin-capable Seroval releases. This path bypasses the Promise resolver 
  type-confusion remediation in version 1.5.3 for CVE-2026-59940 because the 
  unexpected invocation occurs through native Promise settlement after the 
  referenced value is deserialized. This issue is fixed in version 1.6.2.
