title: Coolify is an open-source and self-hostable tool for managing servers, 
  applications, and databases. In Coolify versions up to and including 
  v4.0.0-beta.434, a low privileged user (member) can see and use invitation 
  links sent to an administrator. When they use the link before the legitimate 
  recipient does, they are able to log in as an administrator, meaning they have
  successfully escalated their privileges. As of time of publication, it is 
  unclear if a patch is available.
