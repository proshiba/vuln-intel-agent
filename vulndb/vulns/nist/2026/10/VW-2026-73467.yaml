title: A security flaw has been discovered in Furion .NET Framework up to 
  4.9.9.95. This affects the function RunCompile of the file 
  framework/Furion/ViewEngine/Engines/ViewEngine.cs of the component View 
  Engine. The manipulation of the argument content results in improper 
  neutralization of special elements used in a template engine. The attack can 
  be executed remotely. The exploit has been released to the public and may be 
  used for attacks. The vendor was contacted early about this disclosure but did
  not respond in any way.
