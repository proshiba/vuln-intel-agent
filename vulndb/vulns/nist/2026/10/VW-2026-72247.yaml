title: An input validation and output encoding vulnerability exists in the web 
  management interface of Brocade Fabric OS versions before 10.0.1. When 
  configuring Federated Authentication (FA), the system fails to sanitize the 
  Identity Provider (IdP) issuer parameter. An authenticated administrator—or an
  attacker capable of supplying crafted FA configuration files during an import 
  routine—can inject arbitrary web server directives. This can lead to service 
  denial by preventing the web management daemon from starting, or potentially 
  alter web server security controls.
