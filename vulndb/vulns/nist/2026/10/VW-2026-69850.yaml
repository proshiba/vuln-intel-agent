  4.1.x before 4.1.11, 4.2.x before 4.2.8, 4.3.x before 4.3.5, and 4.4.x before 4.4.3,
  as used by Amazon SageMaker Unified Studio, might allow an authenticated remote
  user with project contributor permissions to execute arbitrary commands in another
  project member's Studio Space and obtain that member's temporary execution role
