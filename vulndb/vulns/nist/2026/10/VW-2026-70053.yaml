title: A vulnerability was detected in Ahsay AhsayCBS up to 10.3.2. This affects
  the function checkSysPwd of the file com/ahsay/obs/api/ApiStructsAction.java 
  of the component API. Performing a manipulation of the argument random results
  in improper authentication. It is possible to initiate the attack remotely. 
  The exploit is now public and may be used. Upgrading to version 10.3.4 is able
  to mitigate this issue. It is recommended to upgrade the affected component.
