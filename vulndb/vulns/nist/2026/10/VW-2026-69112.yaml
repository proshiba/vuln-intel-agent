title: The bbp style pack plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'display_name (via /wp-admin/profile.php) + 
  bbp_reply_content (via bbPress reply form)' parameter in all versions up to, 
  and including, 6.4.8 due to insufficient input sanitization and output 
  escaping. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page. Successful 
  exploitation requires the attacker to wrap their crafted reply in a 
  &lt;pre&gt; block, which prevents WordPress's wpautop/wptexturize processors 
  from converting straight double quotes in the stored display name into 
  typographic curly-quote entities that would otherwise neutralize the 
  attribute-injection.
