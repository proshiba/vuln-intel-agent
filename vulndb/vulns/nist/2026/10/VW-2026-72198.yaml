title: OpenViking versions prior to 0.3.3 contain a missing authorization 
  vulnerability in the task polling endpoints that allows unauthorized attackers
  to enumerate or retrieve background task metadata created by other users. 
  Attackers can access the /api/v1/tasks and /api/v1/tasks/{task_id} routes 
  without authentication to expose task type, task status, resource identifiers,
  archive URIs, result payloads, and error information, potentially causing 
  cross-tenant interference in multi-tenant deployments.
