title: Backstage is an open framework for building developer portals. From 0.4.0
  until 0.5.15, the @backstage/plugin-catalog-backend-module-bitbucket-server 
  package is affected by inconsistent repository filtering in bitbucket server 
  catalog event updates. Deployments using event-driven updates in the Bitbucket
  Server catalog provider may ingest catalog locations from repositories that 
  are excluded by the provider's configured project, repository, or 
  archived-repository filters. An authenticated Bitbucket Server user who can 
  push to a filtered-out repository that remains readable by the configured 
  Backstage integration can trigger a legitimate repository event. The affected 
  event path may then add a Location for that repository even though scheduled 
  discovery excludes it. This issue is fixed in version 0.5.15.
