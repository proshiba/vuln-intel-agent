title: 'A vulnerability was determined in Freedesktop Poppler 26.06.0/26.07.0/26.08.0.
  This impacts the function FoFiTrueType::cvtSfnts of the file fofi/FoFiTrueType.cc.
  This manipulation causes integer overflow. The attack can only be executed locally.
  The exploit has been publicly disclosed and may be utilized. Patch name: 245d3c6823377755f2c1d5fdddd010279c6ed94d.
