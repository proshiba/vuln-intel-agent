title: The Ocean Pro Demos and Ocean eComm Treasure Box plugins for WordPress is
  vulnerable to Stored Cross-Site Scripting via the 'content' parameter in all 
  versions up to, and including, 1.5.4, and 1.8.0, respectively, due to 
  insufficient authorization, input sanitization, and output escaping in the 
  Popup Builder's save_popup_content AJAX action. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts into a published 
  Gutenberg popup that will execute whenever a user accesses a page on which the
  popup is configured to display. A valid premium license, the Popup Builder 
  module, and at least one published Gutenberg popup configured for display are 
  required.
