title: Hugo before v0.167.0 contains a path traversal vulnerability in css.Sass 
  that allows malicious themes or modules to read files outside the project root
  through the Sass compiler's import fallback. Attackers can ship stylesheets 
  with relative, absolute, or symlinked @import or @use targets to compile 
  readable files into the published site CSS.
