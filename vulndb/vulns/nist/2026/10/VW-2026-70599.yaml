title: A vulnerability was found in chillzhuang SpringBlade up to 5.0.1. The 
  impacted element is an unknown function of the file 
  blade-service/blade-system/src/main/java/org/springblade/system/controller/ParamController.java
  of the component Parameter Submit Management. The manipulation of the argument
  initPassword results in improper authorization. It is possible to launch the 
  attack remotely. The exploit has been made public and could be used. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
