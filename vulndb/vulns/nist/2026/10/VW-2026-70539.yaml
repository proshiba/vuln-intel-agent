title: A vulnerability was identified in girishsaraf 
  Online-Appointment-Booking-System up to 
  f427b4757128ca253d33d0cc4e87bbb9c999a4d5. This issue affects the function 
  mysqli_query of the file locateus.php of the component Doctor Search Endpoint.
  The manipulation of the argument doctorname leads to sql injection. Remote 
  exploitation of the attack is possible. The exploit is publicly available and 
  might be used. This product follows a rolling release approach for continuous 
  delivery, so version details for affected or updated releases are not 
  provided. The project was informed of the problem early through an issue 
  report but has not responded yet.
