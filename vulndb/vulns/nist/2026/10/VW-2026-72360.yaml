title: Inefficient algorithmic complexity in the webmail's message view of the 
  REST API in Progressive Robot hMailServer 6.3.2 through 6.3.5 allows a remote 
  unauthenticated attacker to make the webmail, the administration console and 
  the REST API unavailable by sending a message. The route that renders a 
  received message's HTML replaced each reference to an embedded image in place,
  with work that grew with the square of the number of references, and wrote the
  image out for every reference while counting it against its size limit only 
  once. A message whose HTML refers to one small embedded image a very large 
  number of times, opened in the webmail by its recipient, therefore keeps one 
  of the listener's four worker threads busy for minutes and makes it build a 
  document of gigabytes, so that a few such messages leave the HTTP listener 
  unable to answer anybody.
