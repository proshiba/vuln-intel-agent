title: Turms AI-Serving module v0.10.0-SNAPSHOT and earlier contains an image 
  decompression bomb denial of service vulnerability. The ExtendedOpenCVImage 
  class in ai/djl/opencv/ExtendedOpenCVImage.java loads images using OpenCV's 
  imread() function without validating dimensions or pixel count before 
  decompression. An attacker can upload a specially crafted compressed image 
  file (e.g., PNG) that is small when compressed but expands to gigabytes of 
  memory when loaded. This causes immediate memory exhaustion, OutOfMemoryError,
  and service crash. No authentication is required if the OCR service is 
  publicly accessible. Multiple requests can completely deny service 
  availability.
