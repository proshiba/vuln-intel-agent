title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  fbnic: ring the doorbell if a burst ends in a drop\n\nfbnic_tx_map() skips the doorbell
  write, and the completion request,\nfor every packet handed to it with xmit_more
  set, counting on the\npacket which ends the burst to publish them all. When that
  packet is\ndropped instead - skb_put_padto(), skb_cow_head() or a DMA mapping\n\
  failure - nothing rings. The descriptors of the preceding packets stay\ninvisible
  to the HW until the next transmit on that queue, which for a\nburst-then-idle workload
  may never come.\n\nRemember the meta descriptor of the last packet left without
  a doorbell\nand flush it from the error paths. The completion request has to be
  set\non that descriptor rather than simply writing the tail, otherwise the HW\n\
  would transmit the packets but never report a head, and the ring would\nfill up
  and stall for good.\n\nThis is very similar to Joe's recent series of fixes for
  bnxt.\nNot seen in real life, reproduced under"
