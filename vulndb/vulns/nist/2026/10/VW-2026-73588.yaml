title: "The Bluetooth Link Layer Control Procedure (LLCP) implementation for Connected
  Isochronous Stream (CIS) creation retains an RX node (ctx->node_ref.rx, marked NODE_RX_TYPE_RETAIN)
  so it can later be reused as the host notification — on the peripheral while awaiting
  the Host's reply to an LL_CIS_REQ, and on the central for the whole duration of
  a locally initiated CIS Create. In subsys/bluetooth/controller/ll_sw/ull_llcp_cc.c,
  the \"invalid PDU received\" paths of llcp_rp_cc_rx() and llcp_lp_cc_rx() terminated
  the connection and completed the procedure without releasing that retained node,
  breaking the invariant checked in llcp_lr_check_done() and llcp_rr_check_done()
  and orphaning the node's memory.\n\nA peer device within radio range can reach this
  with a single extra LL Control PDU on an unauthenticated, unencrypted ACL link.
