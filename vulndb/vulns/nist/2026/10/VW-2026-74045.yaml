title: FreeRDP from 3.9.0 before 3.32.0 contains an out-of-bounds read 
  vulnerability in the RDPEAR NDR scalar readers, which check value length 
  before consuming alignment padding. Malicious or compromised RDP servers can 
  send crafted unaligned RDPEAR payloads, such as CreateApReqAuthenticatorReq 
  messages, to clients using Remote Credential Guard, causing over-reads and 
  potentially crashing the client process.
