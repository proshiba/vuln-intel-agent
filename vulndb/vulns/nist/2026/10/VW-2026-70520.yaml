title: Docling simplifies document processing by parsing diverse formats and 
  providing integrations with the generative AI ecosystem. From 2.27.0 until 
  2.131.0, Docling plugin factories in docling/models/factories/base_factory.py 
  call load_setuptools_entrypoints() before applying the allow_external_plugins 
  setting, so every module registered in the Docling entry-point group is 
  imported even when external plugins are disabled. An installed third-party or 
  compromised package can therefore execute import-time code when Docling 
  starts, while the subsequent namespace filter misleadingly reports that the 
  plugin was not loaded. This issue is fixed in 2.131.0.
