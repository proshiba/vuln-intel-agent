title: Lektor 3.3.14 and 3.4.0b15 contains a cross-site request forgery 
  vulnerability in the admin API blueprint that allows unauthenticated attackers
  to perform state-changing actions by sending cross-origin requests without 
  CSRF tokens, Origin/Referer validation, CORS configuration, or Host 
  allowlisting. Attackers can exploit the newattachment, deleterecord, build, 
  clean, and publish endpoints from a malicious web page to write arbitrary 
  files, delete pages, wipe build output, trigger deployment publication, and 
  via DNS rebinding reach read endpoints to disclose data.
