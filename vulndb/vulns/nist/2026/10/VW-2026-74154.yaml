title: Heym v0.0.5 before v0.0.113 contains a broken access control 
  vulnerability that allows former collaborators to keep executing JWT-auth 
  workflows by reusing scoped workflow:execute tokens after share removal. 
  Attackers can mint a token with a TTL up to 10 years, which the owner cannot 
  list or revoke, and repeatedly run the workflow consuming shared credentials.
