title: "A Missing Authentication for Critical Function vulnerability in Juniper Networks
  Security Director Policy Enforcer allows an unauthenticated, network-based attacker
  to replace legitimate vSRX images with malicious ones.\n\n\n\nIf a trusted user
  initiates deployment, Security Director Policy Enforcer will deliver the attacker's
  uploaded image to VMware NSX instead of a legitimate one.\n\n\n\n\n\nThis issue
  affects Security Director Policy Enforcer:  \n\n\n\n  *  All versions before 23.1R1
  Hotpatch v3.\n\n\nThis issue does not affect Junos Space Security Director Insights."
