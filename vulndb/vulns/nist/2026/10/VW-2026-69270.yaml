title: 'A flaw has been found in rhukster dom-sanitizer up to 1.0.15. Impacted is
  the function DOMSanitizer::isDangerousUrl of the file src/DOMSanitizer.php of the
  component URL Validation. This manipulation causes cross site scripting. It is possible
  to initiate the attack remotely. The exploit has been published and may be used.
  Upgrading to version 1.0.16 is recommended to address this issue. Patch name: 4623b565d060bc02ca5a07d8c8241fe28e2edfda.
  It is suggested to upgrade the affected component.'
