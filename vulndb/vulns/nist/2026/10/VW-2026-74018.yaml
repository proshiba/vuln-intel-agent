title: "Improper Handling of Highly Compressed Data (Data Amplification) vulnerability
  in hexpm hex allows an untrusted package mirror to exhaust the memory or disk space
  of the machine running mix deps.get, mix deps.update, mix hex.package fetch or mix
  hex.docs fetch.\n\nHex treats a mirror configured with HEX_MIRROR_URL, HEX_MIRROR
  or mirror_url as untrusted: it doesn't send credentials to it, and it checks registry
  signatures and package checksums that the mirror can't forge. Several response paths
  consume memory or disk in proportion to what the mirror sends before any of those
  checks run.\n\nHex.HTTP.request/5 reads the whole response body into memory and
  decompresses it with :zlib.gunzip/1 whenever the response's Content-Encoding contains
  gzip, with no limit on the compressed or decompressed size. Hex doesn't ask for
  compressed responses, so the server decides whether this step runs. It applies to
  registry, package, docs and API responses.\n\nPackage tarballs have no download
  size limit. Hex 2"
