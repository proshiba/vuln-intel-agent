title: 'A weakness has been identified in Portabilis i-Diario 1.5.0. This affects
  an unknown function of the file /justificativas-de-falta. Executing a manipulation
  of the argument Justificativa can lead to cross site scripting. The attack may be
  launched remotely. The exploit has been made available to the public and could be
  used for attacks. This patch is called 821342cd8d952e8bd214cb16145da785a92f5681.
  Applying a patch is advised to resolve this issue. The vendor confirms: "Audited
  values shown on that screen are now sanitized on output".'
