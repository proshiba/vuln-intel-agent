title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex:
  Also allocate private hash on vfork()\n\nAs Jann demonstrated, it is entirely feasible
  to access the mm through vfork().\nTherefore we need to allocate a private hash
  on vfork() as well as any other\nCLONE_VM user.\n\nSpecifically, it must be avoided
  to have (private) futex waiters before\nallocating the private hash."
