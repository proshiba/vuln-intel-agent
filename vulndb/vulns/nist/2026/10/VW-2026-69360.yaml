title: Podgrab contains a missing authentication vulnerability in which the /ws 
  WebSocket route is registered on the root gin engine instead of the 
  BasicAuth-protected router group, allowing unauthenticated network clients to 
  connect even when PASSWORD is configured. Attackers can join the 
  allConnections set, capture PlayerExists broadcasts containing client-supplied
  player identifiers, and replay them in a RegisterPlayer message to hijack 
  queue payloads intended for authenticated users, exposing episode IDs, titles,
  and server-side file paths while potentially disrupting legitimate playback.
