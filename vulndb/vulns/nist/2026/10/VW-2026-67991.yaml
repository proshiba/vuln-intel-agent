title: 'A vulnerability was detected in TRENDnet TEW-713RE 1.02. The impacted element
  is an unknown function of the file /goformX/formFSrvX. The manipulation of the argument
  SZCMD results in os command injection. It is possible to launch the attack remotely.
  The exploit is now public and may be used. The vendor confirms: "The product in
  question TEW-731RE for CVE-2025-15471 has been discontinued and end of life since
  October 23, 2020. We no longer provide support for this product, so we are not able
  to confirm the vulnerabilities. We will make an announcement on the website product
  support page and notify customers who registered their products with us." This vulnerability
  only affects products that are no longer supported by the maintainer.'
