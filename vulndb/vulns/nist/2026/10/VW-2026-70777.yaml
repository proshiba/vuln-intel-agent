title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  restrict BAR0 fallback read to SR-IOV VFs only\n\nThe BAR0 fallback read path was
  introduced as a workaround for SR-IOV VFs\nwhere the VRAM aperture is not available
  during early init. Restrict this\nworkaround to only SR-IOV VFs where it's needed.\n\
