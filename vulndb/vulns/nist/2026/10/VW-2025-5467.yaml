title: A security flaw has been discovered in ixmaps website2017 up to 
  0c71cffa0162186bc057a76766bc97e9f5a3a2d0. This impacts an unknown function of 
  the file /map.php of the component HTTP GET Request Handler. Performing 
  manipulation of the argument trid results in cross site scripting. The attack 
  can be initiated remotely. The exploit has been released to the public and may
  be exploited. Continious delivery with rolling releases is used by this 
  product. Therefore, no version details of affected nor updated releases are 
  available. The vendor was contacted early about this disclosure but did not 
  respond in any way.
