title: Heym builds and runs agentic systems and business-process automations on 
  self-hosted infrastructure. Prior to 0.0.40, an authenticated user who can 
  create or edit a workflow with an Agent custom Python tool can bypass the 
  blacklist-based sandbox in backend/app/services/python_tool_executor.py 
  because allowed standard-library modules expose operating-system, process, and
  filesystem capabilities through public attributes that pass _safe_import() and
  _validate_code_safety(). The runner then executes the supplied tool with 
  exec(), permitting commands and file operations as the backend application 
  user; self-registration affects reachability, but portal triggering alone does
  not grant code control. This issue is fixed in 0.0.40.
