title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, the get-comment-threads, get-comment-thread, and get-comments RPC 
  commands use check-comment-permissions! but do not apply the share link's 
  pages restriction. A holder of a page-scoped share link can retrieve comment 
  threads and full comment bodies from other pages in the same file, including 
  commenter names, email addresses, photos, and page identifiers. The disclosed 
  page identifiers can also be used with affected page-reading functionality to 
  access unshared design content. This issue is fixed in version 2.18.0.
