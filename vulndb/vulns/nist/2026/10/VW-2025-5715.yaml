title: The WP Directory Kit plugin for WordPress is vulnerable to SQL Injection 
  via the 'columns_search' parameter of the select_2_ajax() function in all 
  versions up to, and including, 1.4.3 due to insufficient escaping on the user 
  supplied parameter and lack of sufficient preparation on the existing SQL 
  query.  This makes it possible for unauthenticated attackers to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database.
