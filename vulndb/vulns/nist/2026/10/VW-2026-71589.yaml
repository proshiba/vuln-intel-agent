title: Backstage is an open framework for building developer portals. Prior to 
  0.21.10, the @backstage/plugin-kubernetes-backend package is affected by 
  unsupported catalog cluster authentication mode in kubernetes backend. 
  Deployments using catalog cluster discovery may be affected when catalog 
  contributors can create or modify kubernetes-cluster Resource entities. With 
  the required endpoint permissions and pod RBAC, the backend can use its local 
  in-cluster identity, potentially exposing Kubernetes resources readable by 
  that identity. The credential is used only with the local in-cluster API 
  endpoint and is not sent to the catalog-supplied endpoint. This issue is fixed
  in version 0.21.10.
