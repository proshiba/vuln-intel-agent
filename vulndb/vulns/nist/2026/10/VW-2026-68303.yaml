title: U-Boot before 2026.10-rc5 contains a buffer overflow in nfs_read_reply() 
  function in net/nfs-common.c that allows attackers to corrupt memory by 
  supplying crafted NFS READ reply lengths. A malicious NFS server can exploit 
  signed integer handling to bypass length validation and write far past the 
  destination buffer, crashing the bootloader or corrupting memory.
