title: "OneUptime is a solution for monitoring and managing online services. Prior
  to 10.0.23, the Markdown viewer component renders Mermaid diagrams with securityLevel:
  \"loose\" and injects the SVG output via innerHTML. This configuration explicitly
  allows interactive event bindings in Mermaid diagrams, enabling XSS through Mermaid's
  click directive which can execute arbitrary JavaScript. Any field that renders markdown
  (incident descriptions, status page announcements, monitor notes) is vulnerable.
  This vulnerability is fixed in 10.0.23."
