title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  save input state data before secpath resets\n\nxfrm_input() stores the current xfrm_state
  in the skb secpath while it\ncontinues receive-side processing. Some input paths
  can reset that secpath\nbefore xfrm_input() has finished dereferencing the state.\n\
  \nReceive callback users such as VTI and XFRM interfaces can reset the\nsecpath.
  The VTI receive path does so before checking whether the packet\ncrosses network
  namespaces, while the XFRM interface path does so only for\ncross-network-namespace
  packets. The XFRM_MAX_DEPTH error path can also\nreset the secpath before the final
  drop callback reports the current\nstate's protocol.\n\nIf secpath_reset() drops
  the last state reference while the state is\nconcurrently deleted, xfrm_input()
  can still dereference the freed state\nwhen selecting transport_finish() or reporting
  the drop callback protocol.\n\nSave the state protocol on the stack while the state
