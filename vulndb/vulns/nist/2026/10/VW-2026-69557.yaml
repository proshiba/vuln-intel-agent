title: "Memory allocation with excessive size value vulnerability in Apache Directory
  LDAP API.\n\n\n\nA malicious peer (or a MITM) can send a small BER-encoded response
  causing a large memory allocation before any data is received. This can lead to
  an OutOfMemoryError and denial of service.\n\n\n\nThe client JVM OOMs (OutOfMemoryError
  bypasses the DecoderException handlers) or pins the large allocation per connection
  while the attacker stalls.\n\n\n\nA handful of connections exhausts any heap. The
  same bytes from an unauthenticated pre-bind client hit any embedding server that
  did not set MAX_PDU_SIZE_ATTR.\n\n\n\nThis issue affects Apache Directory LDAP API:
  from 1.2.0 before 1.2.9.\n\n\n\nUsers are recommended to upgrade to version 1.2.9,
  which fixes the issue."
