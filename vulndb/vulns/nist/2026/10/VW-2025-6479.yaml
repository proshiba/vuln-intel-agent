title: A vulnerability was determined in TOZED ZLT M30s up to 1.47. The affected
  element is an unknown function of the component UART Interface. Executing 
  manipulation can lead to on-chip debug and test interface with improper access
  control. The physical device can be targeted for the attack. Attacks of this 
  nature are highly complex. The exploitability is described as difficult. The 
  exploit has been publicly disclosed and may be utilized. The vendor was 
  contacted early about this disclosure but did not respond in any way.
