title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  core: Validate MODE SENSE lengths in scsi_cdl_enable()\n\nscsi_cdl_enable() uses
  length fields returned by MODE SENSE to locate\nthe ATA feature mode page in a 64-byte
  stack buffer. A target can report\na total length shorter than its mode header and
  block descriptors. The\nunsigned subtraction used for the MODE SELECT length can
  wrap, and the\nseparately computed buf_data can point beyond buf.\n\nDuring automatic
  scan, enable is false, so the read-modify-write of\nbuf_data[4] can clear the low
  two bits of a target-selected\nout-of-bounds stack byte. scsi_mode_select() can
  then copy up to 64\nbytes from outside the buffer into the outgoing MODE SELECT
  payload,\ndisclosing stack contents to the target.\n\nThis is reachable while scanning
  a USB storage device that identifies as\nan ATA device and advertises CDL support.
  No filesystem mount or\nuserspace access to the block device is required.\n\nOn
