title: Kiteworks Core contains a business logic flaw in a Kiteworks file-request
  feature allowed an authenticated user to send a request that appeared to 
  originate from another user, because the server did not verify that the 
  requester was authorized to act as the specified account. This could be used 
  to solicit files or information from a recipient under a trusted identity; 
  exploitation requires the feature to be enabled for the attacker's profile and
  the targeted recipient to act on the request.
