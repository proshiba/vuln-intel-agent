title: A critical authorization bypass vulnerability exists in the Management 
  Server handling of Brocade Fabric OS versions before 10.0.1. A compromised 
  switch connected to the fabric can transmit crafted inband Fibre Channel 
  vendor-unique CT (Common Transport) management requests to bypass 
  administrative authentication. Successful exploitation allows an unauthorized 
  peer switch to execute administrative actions on the target device, including 
  resetting administrative passwords, initiating system reboots, and triggering 
  firmware downloads.
