title: OctoPrint-SpoolManager is a plugin for managing spools and all their 
  usage metadata. In versions 1.8.0a2 and older of the testing branch and 
  versions 1.7.7 and older of the stable branch, the APIs of the 
  OctoPrint-SpoolManager plugin do not correctly enforce authentication or 
  authorization checks. This issue has been patched in versions 1.8.0a3 of the 
  testing branch and 1.7.8 of the stable branch. The impact of this 
  vulnerability is greatly reduced when using OctoPrint version 1.11.2 and 
  newer.
