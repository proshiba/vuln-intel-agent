title: Penpot is an open-source design and prototyping platform. Prior to 
  2.18.0, create-team-invitations and the invitation acceptance path allow a 
  non-owner team administrator to assign the owner role because invitation roles
  are persisted and applied without the role-ceiling check used by 
  update-team-member-role. An administrator can invite another account as an 
  owner, create multiple owners, and then use the new owner account to obtain 
  owner-only control over the team. This issue is fixed in version 2.18.0.
