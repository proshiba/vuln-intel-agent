title: "The Bluetooth Classic Hands-Free Profile Audio Gateway implementation in subsys/bluetooth/host/classic/hfp_ag.c
  keeps its struct bt_hfp_ag objects in a static pool indexed by ACL connection index.
  On link teardown, hfp_ag_disconnected() cancels ag->tx_work and the per-call work
  items and then clears ag->acl_conn, which marks the pool slot as free — but it leaves
  ag->ongoing_call_work (and ag->slc_work) untouched. The next connection that lands
  on the same slot enters hfp_ag_create(), whose only occupancy test is ag->acl_conn,
  and immediately executes memset(ag, 0, sizeof(struct bt_hfp_ag)) followed by k_work_init_delayable().
  Zeroing and re-initialising a k_work_delayable whose struct _timeout node is still
  linked into the kernel timeout list leaves the kernel holding a reference to a node
  with NULL prev/next links.\n\nag->ongoing_call_work is armed by the remote peer:
  when a Hands-Free unit sends AT+CIND? during Service Level Connection establishment
  and the application provides the asy"
