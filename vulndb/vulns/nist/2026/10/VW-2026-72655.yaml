title: "Backdrop CMS 1.34 before 1.34.5 and 1.35 before 1.35.1 doesn't sufficiently
  protect configuration exports when delivering a compressed archive. This vulnerability
  is mitigated by the fact that an export must have been previously requested by someone
  with the \"Synchronize, import, and export configuration\" permission. NOTE: CVE-2026-107914
  refers to the vulnerability in which config.admin.inc does not ensure that a file_unmanaged_delete
  operation occurs. Therefore, many archives could persist: config.tar.gz, config_0.tar.gz,
  config_1.tar.gz, etc. There is a separate config.module issue that could allow remote
  access by an anonymous user, but only for the one filename config.tar.gz."
