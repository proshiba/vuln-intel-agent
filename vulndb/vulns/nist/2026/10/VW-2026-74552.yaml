title: A vulnerability was determined in Tiiny-AI PowerInfer up to 
  8bd56d69906c9d2dba4d3bf6899763401e01a9a4. Impacted is the function 
  gguf_init_from_file of the file ggml.c of the component GGUF Parser. This 
  manipulation of the argument data_offset causes out-of-bounds read. The attack
  requires local access. The exploit has been publicly disclosed and may be 
  utilized. This product uses a rolling release model to deliver continuous 
  updates. As a result, specific version information for affected or updated 
  releases is not available. The pull request to fix this issue awaits 
  acceptance.
