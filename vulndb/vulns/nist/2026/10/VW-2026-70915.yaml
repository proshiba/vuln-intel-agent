title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  icmp: reject RTN_UNREACHABLE input routes in icmp_route_lookup\n\nWhen the forward
  output route cannot be used in icmp_route_lookup(),\nit enters the \"reverse path\"\
  \ and calls ip_route_input() on fl4_dec.daddr,\nthe original packet's source address.\n\
  \nip_route_input() only returns an error for truly invalid packets. For\nunreachable
  addresses it will succeed and return an input route whose\ndst.output is set to
  ip_rt_bug(). The existing check only rejects\nRTN_LOCAL routes, so the RTN_UNREACHABLE
  route types can still be returned\nand later used for output, syzkaller triggering
  a WARN_ON_ONCE()\nin ip_rt_bug() as bellow:\n\n ------------[ cut here ]------------\n\
  \ WARNING: net/ipv4/route.c:1273 at ip_rt_bug+0x14/0x20\n RIP: 0010:ip_rt_bug+0x14/0x20\n\
  \ Call Trace:\n  ip_push_pending_frames+0xfa/0x100\n  __icmp_send+0x905/0xf10\n\
  \  ip_options_compile+0xc0/0xd0\n  ip_rcv_finish_core+0x321/0xae0\n  ip_rcv+0x1de/0x260\n\
  \  __netif_receive_skb_"
