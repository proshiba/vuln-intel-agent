title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: validate absolute native symlink targets before NT fixups\n\nWith symlinkroot
  unset, an absolute target is copied without conversion\nto an NT drive path. Later
  code still assumes an NT prefix is present\nwhen modifying the target and calculating
  the print name length.\n\nFor \"/ab\", this causes two failures: sym[5] and path[5]
  are written\npast their allocations, and plen -= 2 * poff subtracts an assumed\n\
  8-byte prefix from a 6-byte UTF-16 target, wrapping u16 plen to 65534.\nThat underflow
  causes another overflow: memcpy() copies 65534 bytes\ninto a 24-byte buffer. A user
  with write access to a mounted share\ncan trigger these bugs with default settings.\n\
  \nValidate the NT drive prefix, including an ASCII drive letter, before\naccessing
  fixed offsets or subtracting the prefix length."
