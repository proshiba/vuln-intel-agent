title: A vulnerability was detected in fit2cloud MeterSphere up to 3.6.9-lts. 
  The affected element is the function 
  Swagger3ParserApiDefinition.testUrlTimeout of the file 
  backend/parser/api/dataimport/Swagger3ParserApiDefinition.java of the 
  component Swagger3 Parser. Performing a manipulation of the argument 
  swaggerUrl results in server-side request forgery. Remote exploitation of the 
  attack is possible. The exploit is now public and may be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
