title: A security vulnerability has been detected in haxxorsid 
  Stock-Management-System up to fbbbf213e9c93b87183a3891f77e3cc7095f22b0. This 
  impacts an unknown function of the file model/User.php. The manipulation of 
  the argument employee_id/id/admin leads to sql injection. The attack can be 
  initiated remotely. The exploit has been disclosed publicly and may be used. 
  Continious delivery with rolling releases is used by this product. Therefore, 
  no version details of affected nor updated releases are available. The vendor 
  was contacted early about this disclosure but did not respond in any way. This
  vulnerability only affects products that are no longer supported by the 
  maintainer.
