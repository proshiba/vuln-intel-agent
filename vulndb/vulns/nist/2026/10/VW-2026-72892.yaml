title: pacioli provides least-privilege governance and a governed agent broker 
  for ERPNext. From version 0.9.6 until version 0.10.0, the pacioli-guard 
  document-layer consent gate allows nested cancellation operations to ride any 
  consent established by an enclosing governed act without checking whether the 
  marker authorizes cancellation. A credential with API Key 
  Scope.require_consent can submit a caller-controlled Sales Invoice or other 
  supported document under a valid human-minted submit marker and reach 
  Document.cancel() for a different pre-existing submitted document, bypassing 
  the marker's document and act binding, single-use spend, and denial audit. The
  unauthorized cancellation can reverse the target document's ledger effect; 
  principals without a consent-gated grant are not affected. This issue is fixed
  in version 0.10.0.
