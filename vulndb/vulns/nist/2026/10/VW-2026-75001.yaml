title: JetLinks Community through 2.10.0 contains a missing authorization 
  vulnerability that allows users with only query access on transparent-codec to
  overwrite product codecs via POST /device/transparent-codec/{productId}. 
  Because the endpoint lacks @SaveAction, attackers can save arbitrary codec 
  providers and configurations, controlling how transparent messages are decoded
  and encoded for every device of that product.
