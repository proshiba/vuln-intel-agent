title: Powerlevel10k through 1.20.0 contains an insecure download vulnerability 
  in the gitstatus/install script that disables TLS certificate verification 
  with curl -k and skips integrity checks when no SHA-256 utility exists. 
  Network-positioned attackers can intercept the github.com mirror request and 
  substitute a malicious archive, which runs as the gitstatusd daemon under the 
  user's account on every prompt.
