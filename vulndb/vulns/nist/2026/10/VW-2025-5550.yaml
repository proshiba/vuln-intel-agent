title: 'Vulnerability in the Oracle Financial Services Analytical Applications Infrastructure
  product of Oracle Financial Services Applications (component: Platform).  Supported
  versions that are affected are 8.0.7.9, 8.0.8.7 and  8.1.2.5. Easily exploitable
  vulnerability allows unauthenticated attacker with network access via HTTP to compromise
  Oracle Financial Services Analytical Applications Infrastructure.  Successful attacks
  require human interaction from a person other than the attacker. Successful attacks
  of this vulnerability can result in  unauthorized update, insert or delete access
  to some of Oracle Financial Services Analytical Applications Infrastructure accessible
  data as well as  unauthorized read access to a subset of Oracle Financial Services
  Analytical Applications Infrastructure accessible data. CVSS 3.1 Base Score 5.4
  (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N).'
