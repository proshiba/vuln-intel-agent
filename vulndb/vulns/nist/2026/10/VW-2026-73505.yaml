title: Traccar 5.7 through 6.16.0 contains a cross-site request forgery 
  vulnerability that allows attackers to log victims into attacker-controlled 
  accounts because the OpenID Connect callback never validates the OAuth state 
  parameter. Attackers can induce a victim's browser to load 
  /api/session/openid/callback with their own authorization code, causing data 
  the victim enters, such as registered devices, to land in the attacker's 
  account.
