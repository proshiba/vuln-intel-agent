title: A security vulnerability has been detected in FantasticLBP Hotels_Server 
  up to 67b44df162fab26df209bd5d5d542875fcbec1d0. Affected by this issue is some
  unknown functionality of the file /controller/api/Room.php. Such manipulation 
  of the argument hotelId leads to sql injection. The attack may be launched 
  remotely. The exploit has been disclosed publicly and may be used. This 
  product operates on a rolling release basis, ensuring continuous delivery. 
  Consequently, there are no version details for either affected or updated 
  releases. The vendor was contacted early about this disclosure but did not 
  respond in any way.
