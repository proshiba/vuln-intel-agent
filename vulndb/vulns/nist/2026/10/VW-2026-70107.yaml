title: A security flaw has been discovered in kishor-23 
  food-waste-management-system 
  411989e3ecb82895e53dca7865f72145f03d7d93/b3a70b2c492dc9904de5be1ad9389bd79b87f82c.
  This impacts an unknown function of the file delivery/delivery.php of the 
  component Take Order Handler. The manipulation of the argument 
  order_id/delivery_person_id results in sql injection. It is possible to launch
  the attack remotely. The exploit has been released to the public and may be 
  used for attacks. This product takes the approach of rolling releases to 
  provide continious delivery. Therefore, version details for affected and 
  updated releases are not available. The project was informed of the problem 
  early through an issue report but has not responded yet.
