  4.1.8, a blind SQL injection vulnerability exists in the application that 
  allows an authenticated administrator-level user to extract database contents 
  using boolean-based or time-based techniques. The database account used by the
  application is read-only and non-DBA, limiting impact to confidential data 
  disclosure only. No data modification or service disruption is possible. This 
  issue has been patched in version 4.1.8.
