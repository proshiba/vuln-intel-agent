title: A security flaw has been discovered in geyang ml-logger up to 
  acf255bade5be6ad88d90735c8367b28cbe3a743. Affected by this issue is the 
  function stream_handler of the file ml_logger/server.py of the component File 
  Handler. Performing manipulation of the argument key results in information 
  disclosure. The attack can be initiated remotely. The exploit has been 
  released to the public and may be exploited. Continious delivery with rolling 
  releases is used by this product. Therefore, no version details of affected 
  nor updated releases are available.
