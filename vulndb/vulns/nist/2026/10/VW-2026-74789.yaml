title: A flaw was found in gnome-remote-desktop as shipped in Red Hat Enterprise
  Linux. In the VNC TLS read path, partial consumption of the internal peek 
  buffer incorrectly moves remaining peeked bytes into the caller-supplied 
  buffer instead of compacting the peek buffer. A remote attacker who can reach 
  an enabled VNC TLS listener and trigger a peek/read size mismatch can cause an
  out-of-bounds write, leading to denial of service.
