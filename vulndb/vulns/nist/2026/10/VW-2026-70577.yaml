title: A flaw was found in SSSD. A use-after-free vulnerability exists in the 
  Kerberos Credential Manager (KCM) responder during Kerberos ticket-granting 
  ticket (TGT) renewal, where a deferred callback accesses memory that has 
  already been released. An authenticated local user with a renewable Kerberos 
  ticket can trigger this issue on systems configured with KCM renewal, causing 
  the KCM responder service to crash and resulting in a Denial of Service (DoS).
