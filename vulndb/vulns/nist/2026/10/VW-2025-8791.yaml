title: A vulnerability has been found in aaPanel BaoTa up to 11.2.x. This 
  vulnerability affects unknown code of the file 
  /database?action=GetDatabaseAccess of the component Backend. The manipulation 
  of the argument Name leads to sql injection. The attack can be initiated 
  remotely. The exploit has been disclosed to the public and may be used. 
  Upgrading to version 11.3.0 is able to resolve this issue. It is recommended 
  to upgrade the affected component.
