title: The AI Puffer – Chat. Create. Automate. (formerly AI Power) plugin for 
  WordPress is vulnerable to authorization bypass in all versions up to, and 
  including, 2.4.89. This is due to the plugin not properly verifying that a 
  user is authorized to perform an action. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to modify 
  global site-wide semantic search settings, including vector provider, 
  embedding provider, embedding model, target ID, number of results, and 
  no-results text stored in aipkit_options, that are otherwise restricted to 
  administrators. Exploitation requires that an administrator has previously 
  granted the Knowledge Base ('sources') module to the attacker's role via the 
  Role Manager, as this access is not available to lower-privileged users by 
  default.
