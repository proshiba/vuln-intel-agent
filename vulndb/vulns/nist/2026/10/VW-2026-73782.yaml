title: Blinko through 1.8.8 allows directory traversal, overwriting startup 
  files as root, via installPlugin. It builds the plugin install path from an 
  unsanitized name in server/routerTrpc/plugin.ts, and the plugin.installPlugin 
  tRPC procedure is open to any authenticated user. Thus, a name containing ../ 
  sequences writes the downloaded plugin files outside the plugins directory. 
  Because the official Docker image runs as root, an authenticated attacker 
  overwrites a root-owned startup file and achieves remote code execution as 
  root. Self-registration for an account may be possible.
