title: "This vulnerability exists in the ERP system due to improper validation of
  payment callback parameters and inadequate authentication controls in API endpoint.
  An unauthenticated remote attacker could exploit this vulnerability by manipulating
  the parameter to cause the application to establish an authenticated session for
  an arbitrary user without valid payment verification.\n\nSuccessful exploitation
  of this vulnerability could allow the attacker to bypass authentication and gain
  unauthorized access to other user accounts on the targeted system."
