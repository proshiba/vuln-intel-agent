title: "When an Event Publisher output adapter is configured with irrelevant properties,
  the affected products log these properties. This logging occurs without sufficient
  validation or sanitization of the property values.\n\nA malicious actor with access
  to the 'wso2carbon' log files could retrieve sensitive information, such as user
  credentials or other confidential data, that was inadvertently logged due to misconfiguration,
  potentially leading to unauthorized access."
