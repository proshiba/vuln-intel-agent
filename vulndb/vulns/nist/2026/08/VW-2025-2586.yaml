title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  check iparea_offset and ipv6_prefixes_cnt when receiving proposal msg\n\nWhen receiving
  proposal msg in server, the field iparea_offset\nand the field ipv6_prefixes_cnt
  in proposal msg are from the\nremote client and can not be fully trusted. Especially
  the\nfield iparea_offset, once exceed the max value, there has the\nchance to access
  wrong address, and crash may happen.\n\nThis patch checks iparea_offset and ipv6_prefixes_cnt
  before using them."
