title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix slab-out-of-bounds in smb2_allocate_rsp_buf\n\nIf ->ProtocolId is SMB2_TRANSFORM_PROTO_NUM,
  smb2 request size\nvalidation could be skipped. if request size is smaller than\n\
  sizeof(struct smb2_query_info_req), slab-out-of-bounds read can happen in\nsmb2_allocate_rsp_buf().
  This patch allocate response buffer after\ndecrypting transform request. smb3_decrypt_req()
  will validate transform\nrequest size and avoid slab-out-of-bound in smb2_allocate_rsp_buf()."
