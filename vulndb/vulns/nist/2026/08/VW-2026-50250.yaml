title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix hanging __ceph_get_caps() with stale mds_wanted\n\nA reader can hang forever
  in __ceph_get_caps() when the client no\nlonger holds `FILE_RD`, but local cap state
  still says that the\ncapability is already wanted (via `mds_wanted`).\n\nOne way
  to trigger this is through MDS cap revocation.  If another\nclient performs a conflicting
  operation, the MDS can revoke `FILE_RD`\nfrom the reader; the next read then has
  to reacquire `FILE_RD`.  If\nthe cap update that should request `FILE_RD` never
  reaches the MDS\nafter `cap->mds_wanted` was raised, the reader is left holding
  only\nnon-file caps while local `mds_wanted` still includes the file read\ncaps.\n\
  \nIn that state, try_get_cap_refs() sees `need <= mds_wanted` and\nreturns 0, so
  __ceph_get_caps() just waits on `i_cap_wq`.  If the cap\nupdate that was supposed
  to request `FILE_RD never reaches the MDS\nafter `cap->mds_wanted was` raised, no
