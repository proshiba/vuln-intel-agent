title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/stm:
  Avoid use-after-free issues with crtc and plane\n\nltdc_load() calls functions drm_crtc_init_with_planes(),\n\
  drm_universal_plane_init() and drm_encoder_init(). These functions\nshould not be
  called with parameters allocated with devm_kzalloc()\nto avoid use-after-free issues
  [1].\n\nUse allocations managed by the DRM framework.\n\nFound by Linux Verification
  Center (linuxtesting.org).\n\n[1]\nhttps://lore.kernel.org/lkml/u366i76e3qhh3ra5oxrtngjtm2u5lterkekcz6y2jkndhuxzli@diujon4h7qwb/"
