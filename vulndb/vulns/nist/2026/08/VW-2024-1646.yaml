title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigc:
  avoid returning frame twice in XDP_REDIRECT\n\nWhen a frame can not be transmitted
  in XDP_REDIRECT\n(e.g. due to a full queue), it is necessary to free\nit by calling
  xdp_return_frame_rx_napi.\n\nHowever, this is the responsibility of the caller of\n\
  the ndo_xdp_xmit (see for example bq_xmit_all in\nkernel/bpf/devmap.c) and thus
  calling it inside\nigc_xdp_xmit (which is the ndo_xdp_xmit of the igc\ndriver) as
  well will lead to memory corruption.\n\nIn fact, bq_xmit_all expects that it can
  return all\nframes after the last successfully transmitted one.\nTherefore, break
  for the first not transmitted frame,\nbut do not call xdp_return_frame_rx_napi in
  igc_xdp_xmit.\nThis is equally implemented in other Intel drivers\nsuch as the igb.\n\
  \nThere are two alternatives to this that were rejected:\n1. Return num_frames as
  all the frames would have been\n   transmitted and release them inside igc_xdp_xmit.\n\
  \   While it might work technically, it"
