title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/fwctl:
  Fix __fortify_panic\n\nFix a runtime assertion in cxlctl_get_supported_features().
  Fortify\ncomplains that it is potentially overflowing the entries array per\n__counted_by_le(num_entries).
  Quiet the false positive by initializing\n@num_entries earlier.\n\n memcpy: detected
  buffer overflow: 48 byte write of buffer size 0\n WARNING: lib/string_helpers.c:1036
  at __fortify_report+0x4d/0xa0, CPU#7: fwctl/1398\n RIP: 0010:__fortify_report+0x50/0xa0\n\
  \ Call Trace:\n  __fortify_panic+0xd/0xf\n  cxlctl_get_supported_features.cold+0x23/0x35
  [cxl_core]"
