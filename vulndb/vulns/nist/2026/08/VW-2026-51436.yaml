title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  amd-mp2: Unregister callback on adapter add failure\n\namd_mp2_register_cb() stores
  the platform I2C context in the MP2 PCI\ndriver's callback table before the adapter
  is registered. If\ni2c_add_adapter() fails, probe returns and devres frees the context,\n\
  but the PCI driver can still dereference the stale pointer from its IRQ\nand system-sleep
  callbacks.\n\nUnregister the callback before returning the adapter registration
  error."
