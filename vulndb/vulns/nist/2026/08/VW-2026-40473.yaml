title: GitHub CLI (gh) is GitHub's official command line tool. Prior to version 
  2.97.0, gh auth status masked only the characters after the last underscore in
  certain fine-grained personal access tokens and GitHub App tokens. As a 
  result, part of an affected token could appear in terminal or CI output that 
  is captured or shared. Authenticated users are affected if they ran gh auth 
  status (without the --show-token flag) with a token type whose format contains
  an underscore after the prefix. This includes fine-grained personal access 
  tokens (github_pat_*) and GitHub App installation and user access tokens 
  (ghs_*, ghu_*; for example, ghs_<APPID>_<JWT>), as well as the Actions 
  GITHUB_TOKEN. Classic tokens such as gho_* and ghp_* have an underscore-free 
  body and are not affected. This issue is fixed in version 2.97.0.
