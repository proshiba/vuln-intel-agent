title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  amba-pl011: cancel RS485 hrtimers after freeing IRQ\n\nThe RS485 trigger hrtimers
  are embedded in the devm-managed port and can\nfire after it is freed. The IRQ handler
  can arm a timer, so free the IRQ\nfirst and then cancel both timers.\n\nComplete
  the RS485 stop without arming a timer, and cancel the timers\nin remove() for the
  suspend-then-unbind path, where shutdown is not\ncalled.\n\nThis issue was found
  by an in-house static analysis tool."
