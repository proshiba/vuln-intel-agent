title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: make release_scratchbuffers idempotent\n\nbrcmf_pcie_release_scratchbuffers()
  frees the shared.scratch and\nshared.ringupd DMA buffers with dma_free_coherent()
  but does not clear\nthe pointers afterwards, unlike the sibling release_ringbuffers()
  which\nNULLs commonrings/flowrings/idxbuf on release.\n\nBoth the bus_reset .reset
  callback (brcmf_pcie_reset) and\nbrcmf_pcie_remove() call release_scratchbuffers.\
  \  When reset teardown\nhas run before removal, remove's own teardown would call\n\
  dma_free_coherent() a second time on the already-freed DMA allocation.\n\nNULL the
  pointers after free, matching release_ringbuffers(), so a later\nrelease observes
  that the allocation has already been released.  This\npatch makes repeated sequential
  release safe; the reset-work lifetime is\nhandled separately by the following patch.\n\
  \nThis issue was found by an in-house static analysis tool."
