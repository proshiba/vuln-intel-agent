title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/openvswitch:
  check Ethernet header length in key_extract()\n\nWhen a packet arrives on an ARPHRD_NONE
  device (e.g. TUN),\novs_flow_key_extract() trusts the user-provided skb->protocol
  field: if\nit is ETH_P_TEB, the packet is classified as MAC_PROTO_ETHERNET and\n\
  key_extract() is called without ensuring the skb has ETH_HLEN (14) bytes\nof linear
  data. key_extract() unconditionally pulls 2 * ETH_ALEN bytes\nfor MAC addresses
  and parse_ethertype() pulls 2 more, either of which\ntriggers a kernel BUG in __skb_pull()
  when the linear area is too small.\n\n  kernel BUG at include/linux/skbuff.h:2848!\n\
  \  RIP: 0010:key_extract+0xa7e/0xd90 net/openvswitch/flow.c:933\n  ovs_flow_key_extract+0x419/0xa70\n\
  \  ovs_vport_receive+0x222/0x390\n  netdev_frame_hook+0x3e0/0x630\n  tun_get_user+0x2d0c/0x38e0\n\
  \nFixed by calling check_header() in key_extract() before accessing the\nEthernet
  header."
