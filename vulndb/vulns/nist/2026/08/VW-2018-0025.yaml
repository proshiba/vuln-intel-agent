title: 'Multiple vulnerabilities in the Application Layer Protocol Inspection feature
  of Cisco Adaptive Security Appliance (ASA) Software and Cisco Firepower Threat Defense
  (FTD) Software could allow an unauthenticated, remote attacker to trigger a reload
  of an affected device, resulting in a denial of service (DoS) condition. The vulnerabilities
  are due to logical errors during traffic inspection. An attacker could exploit these
  vulnerabilities by sending a high volume of malicious traffic across an affected
  device. An exploit could allow the attacker to cause a deadlock condition, resulting
  in a reload of an affected device. These vulnerabilities affect Cisco ASA Software
  and Cisco FTD Software configured for Application Layer Protocol Inspection running
  on the following Cisco products: 3000 Series Industrial Security Appliance (ISA),
  ASA 5500 Series Adaptive Security Appliances, ASA 5500-X Series Next-Generation
  Firewalls, ASA Services Module for Cisco Catalyst 6500 Series Switches and Cisc'
