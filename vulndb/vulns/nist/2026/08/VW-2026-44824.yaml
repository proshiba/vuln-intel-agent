title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: cancel SSR work items during PCI shutdown\n\nA reboot can crash the kernel
  if it overlaps with WLAN firmware crash\nrecovery (SSR). The crash is a NULL pointer
  dereference in the MHI teardown\npath while freeing DMA-backed MHI contexts.\n\n\
  Simplified trace:\n  dma_free_attrs\n  mhi_deinit_dev_ctxt [mhi]\n  ath11k_pci_power_down
  [ath11k_pci]\n  ath11k_pci_shutdown [ath11k_pci]\n  device_shutdown\n  kernel_restart\n\
  \nOn the host side, SSR is driven by the MHI RDDM callback, which queues\nreset_work
  to perform device recovery. reset_work power-cycles the device\nby calling ath11k_hif_power_down()
  followed by ath11k_hif_power_up(). The\npower-down phase deinitializes MHI and frees
  DMA resources.\n\nShutdown/reboot runs fully asynchronously with this RDDM-driven
  SSR\nrecovery flow. As a result, the shutdown path\n(ath11k_pci_shutdown() -> ath11k_pci_power_down())
  can race with the SSR\nrecovery sequence.\n\nFix this by canceling SSR"
