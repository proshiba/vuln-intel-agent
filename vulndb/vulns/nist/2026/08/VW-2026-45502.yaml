title: Legora before 2026-08-14 contains a cross-site scripting vulnerability 
  that allows attackers to achieve arbitrary JavaScript execution in a victim's 
  browser by embedding a Mermaid block prefixed with a gray-matter JavaScript 
  front-matter directive, causing the front-matter parser to invoke eval() 
  before any SVG sanitization occurs. Attackers can exploit this flaw through 
  influenced Mermaid diagram content to execute arbitrary JavaScript in the 
  user's browser context, with elevated impact on Word and Outlook add-in 
  surfaces where bearer session tokens are persisted in localStorage.
