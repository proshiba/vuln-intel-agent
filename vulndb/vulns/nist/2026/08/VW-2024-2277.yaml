title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix crash due to incorrect copy_map_value\n\nWhen both bpf_spin_lock and bpf_timer
  are present in a BPF map value,\ncopy_map_value needs to skirt both objects when
  copying a value into and\nout of the map. However, the current code does not set
  both s_off and\nt_off in copy_map_value, which leads to a crash when e.g. bpf_spin_lock\n\
  is placed in map value with bpf_timer, as bpf_map_update_elem call will\nbe able
  to overwrite the other timer object.\n\nWhen the issue is not fixed, an overwriting
  can produce the following\nsplat:\n\n[root@(none) bpf]# ./test_progs -t timer_crash\n\
  [   15.930339] bpf_testmod: loading out-of-tree module taints kernel.\n[   16.037849]
  ==================================================================\n[   16.038458]
  BUG: KASAN: user-memory-access in __pv_queued_spin_lock_slowpath+0x32b/0x520\n[\
  \   16.038944] Write of size 8 at addr 0000000000043ec0 by task test_progs/325\n\
  [   16.039399]\n[   16.039514] CP"
