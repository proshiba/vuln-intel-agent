title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. Prior to 2.6.1, the GET 
  /host/db/host/:id/password endpoint in src/backend/database/routes/host.ts 
  accepts an authenticated user's numeric host ID and the field=password or 
  field=sudoPassword query without enforcing host ownership during credential 
  resolution. A failed requester-scoped lookup can resolve the host with the 
  owner's context and return the owner's plaintext credential, allowing any 
  authenticated user with a valid JWT to enumerate sequential hosts.id values 
  and retrieve SSH or sudo passwords belonging to other users. The disclosed 
  credentials can then be used to access and control managed systems outside the
  Termix instance. This issue is fixed in version 2.6.1.
