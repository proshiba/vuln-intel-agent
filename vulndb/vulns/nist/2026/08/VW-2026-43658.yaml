title: Rainbond through 6.9.7 contains a broken access control vulnerability in 
  the CheckToken function that allows authenticated attackers to access 
  unauthorized enterprise resources by substituting another enterprise's tenant 
  name in URL paths. Attackers can use any valid API token to bypass enterprise 
  ID verification and access or modify another enterprise's services, plugins, 
  environment variables, and certificates.
