title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix space cache corruption and potential double allocations\n\nWhen testing space_cache
  v2 on a large set of machines, we encountered a\nfew symptoms:\n\n1. \"unable to
  add free space :-17\" (EEXIST) errors.\n2. Missing free space info items, sometimes
  caught with a \"missing free\n   space info for X\" error.\n3. Double-accounted
  space: ranges that were allocated in the extent tree\n   and also marked as free
  in the free space tree, ranges that were\n   marked as allocated twice in the extent
  tree, or ranges that were\n   marked as free twice in the free space tree. If the
  latter made it\n   onto disk, the next reboot would hit the BUG_ON() in\n   add_new_free_space().\n\
  4. On some hosts with no on-disk corruption or error messages, the\n   in-memory
  space cache (dumped with drgn) disagreed with the free\n   space tree.\n\nAll of
