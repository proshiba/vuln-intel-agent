title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  pktgen: fix proc entry use-after-free\n\npktgen_change_name() replaces pkt_dev->entry
  while holding t->if_lock.\npktgen_remove_device() removes the same entry before\n\
  _rem_dev_from_if_list() takes that lock.\n\nThis allows the following interleaving:\n\
  \n  CPU 0 (NETDEV_CHANGENAME)       CPU 1 (kpktgend)\n  if_lock(t)\n  proc_remove(pkt_dev->entry)\n\
  \                                  proc_remove(pkt_dev->entry)\n  pkt_dev->entry
  = proc_create_data(...)\n  if_unlock(t)\n\nThe kthread can pass the stale proc_dir_entry
  to proc_remove() after the\nrename path has freed it. A reproducer with a widened
  race window reports:\n\n  BUG: KASAN: slab-use-after-free in proc_remove+0x78/0x80\n\
  \  Read of size 8 at addr ffff8881478fea70 by task kpktgend_0/67\n  Call Trace:\n\
  \   proc_remove+0x78/0x80\n   pktgen_remove_device.isra.0+0x11c/0x4c0\n   pktgen_thread_worker+0x1214/0x6bc0\n\
  \   kthread+0x2c6/0x3b0\n  Allocated by task 95:\n   __proc_create+0x204/0x790"
