title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_flat:
  Fix corruption when not offsetting data start\n\nCommit 04d82a6d0881 (\"binfmt_flat:
  allow not offsetting data start\")\nintroduced a RISC-V specific variant of the
  FLAT format which does\nnot allocate any space for the (obsolete) array of shared
  library\npointers. However, it did not disable the code which initializes the\n\
  array, resulting in the corruption of sizeof(long) bytes before the DATA\nsegment,
  generally the end of the TEXT segment.\n\nIntroduce MAX_SHARED_LIBS_UPDATE which
  depends on the state of\nCONFIG_BINFMT_FLAT_NO_DATA_START_OFFSET to guard the initialization
  of\nthe shared library pointer region so that it will only be initialized\nif space
  is reserved for it."
