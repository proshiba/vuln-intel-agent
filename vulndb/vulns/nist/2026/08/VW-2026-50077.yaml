title: LeafWiki extracts an uploaded ZIP archive without limiting how much data 
  it will write. ZipExtractor.ExtractToDir in internal/importer/zip_extractor.go
  opens each entry and copies it to the destination with io.Copy, which runs to 
  the end of the decompressed stream, so only the size of the uploaded archive 
  is bounded and the size it expands to is not. The import route that reaches 
  this code requires the Editor or Admin role, and the upload itself is capped 
  at 500 MiB compressed. Because a ZIP entry can compress at a very high ratio, 
  an archive well inside that cap can expand to hundreds of gigabytes as it is 
  written out. The extraction directory defaults to a location under the 
  operating system temporary directory, so the written data consumes the disk 
  backing that path, which on a tmpfs-backed temporary directory is memory. A 
  user holding the Editor role can therefore exhaust the storage the service 
  depends on and keep it from serving, using far more resource than the upload 
  limit alon
