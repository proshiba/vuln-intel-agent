title: "Off-by-one Error vulnerability in Apache Tomcat impacting the [N] flag on
  the rewrite valves causes rewrite processing to restart at the second rule rather
  than the first rule.\n\n\n\n\n\n\n\nThis issue affects Apache Tomcat: from 11.0.0-M1
  through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120.\n\
  \n\n\nThe following versions were EOL at the time the CVE was created but are \n\
  known to be affected: from 8.5.0 through 8.5.100. Other unsupported versions may
  also be affected.\n\n\n\nUsers are recommended to upgrade to version 11.0.25, 10.1.58
  or 9.0.121 which fix the issue."
