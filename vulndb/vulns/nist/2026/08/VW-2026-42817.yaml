title: The Frontend Admin by DynamiApps plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 3.29.9. This is due
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  subscriber-level and above permissions, to reset the password of any user on 
  the site, including administrators, leading to full account takeover and 
  complete site compromise. Exploitation requires the attacker to hold a valid 
  encrypted Current-User token obtained by accessing any Edit User form they are
  legitimately authorized to submit, which they then use as a known-plaintext 
  base for the CBC bit-flipping forgery.
