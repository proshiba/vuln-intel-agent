title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  validate cookie AUTH state before use\n\nWhen cookie authentication is disabled,
  COOKIE_ECHO restores fixed-size\nAUTH fields directly from peer-controlled cookie
  bytes.  A forged RANDOM\nlength, HMAC list, or CHUNKS list can then reach association
  consumers\nwith lengths or identifiers that were never validated against the local\n\
  backing arrays.\n\nA forged RANDOM length can cause out-of-bounds reads during key-vector\n\
  construction.  A forged HMAC identifier also caused a 32-byte write past\na zero-length
  AUTH chunk, providing a primitive for a local privilege\nescalation chain.\n\nValidate
  the cookie's RANDOM, HMACS, and CHUNKS parameters at the cookie\ntrust boundary
  before copying them into the association.  Reject invalid\ntypes, malformed lengths,
  unsupported HMAC identifiers, HMAC lists\nwithout SHA1, and forbidden chunk ids."
