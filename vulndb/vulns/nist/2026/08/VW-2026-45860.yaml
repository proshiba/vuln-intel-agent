title: A flaw was found in BlueZ. Insufficient validation of packet length 
  fields in GetFolderItems responses within the Audio/Video Remote Control 
  Profile (AVRCP) implementation allows a malicious Bluetooth device within 
  range to cause an out-of-bounds memory read. This vulnerability, affecting the
  parse_media_element() and parse_media_folder() functions, can lead to a crash 
  of the bluetoothd daemon, resulting in a Denial of Service (DoS). It could 
  also potentially expose sensitive heap memory contents. Exploitation requires 
  user interaction to pair with the malicious device.
