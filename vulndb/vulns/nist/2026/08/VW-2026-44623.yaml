title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni3c:
  mipi-i3c-hci: Fix race in i3c_hci_addr_to_dev()\n\ni3c_hci_addr_to_dev() walks bus->devs.i3c,
  which is protected by\nbus.lock (rwsem).  However, it is invoked from the MIPI I3C
  HCI IRQ\nhandler, which cannot take bus.lock.  This allows concurrent device\naddition/removal
  in the I3C core to modify the list while it is being\ntraversed, potentially leading
  to use-after-free or crashes.\n\nRemove the dependency on the bus device list and
  introduce a dedicated\nlookup table.  Add an ibi_devs[] array indexed by DAT entry,
  maintained\nunder hci->lock.  Update the array when IBIs are enabled or disabled,\n\
  so that it always reflects the set of devices allowed to generate IBIs.\nAlso update
  when IBIs are freed, to cover the corner case when an IBI is\nfreed without first
  being disabled (e.g. oldedev in\ni3c_master_add_i3c_dev_locked()).\n\nMove i3c_hci_addr_to_dev()
  into core.c, reimplement it using the new\narray, and add a lockdep asser"
