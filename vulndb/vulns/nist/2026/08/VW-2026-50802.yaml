title: "Affected versions of Flowintel improperly trust configuration keys supplied
  to the alerts settings update endpoint. While configuration values were normalized
  to Python literals, the corresponding keys were used directly when constructing
  and replacing lines in conf/config_module.py.\n\n\nThe vulnerable code used requester-controlled
  keys in both the regular expression and the generated assignment:\n\n\nf'{key} =
  {py_val}'\n\nand appended an assignment if the key was not already present. The
  modified Python configuration module was subsequently reloaded using importlib.reload().
  This creates a code-generation boundary in which specially crafted configuration
  keys can alter the Python source structure and result in execution of attacker-controlled
  Python statements. \n\nVersion impacted >=3.3.0"
