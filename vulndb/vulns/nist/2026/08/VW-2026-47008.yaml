title: The Advanced File Manager  WordPress plugin before 5.4.13 does not 
  perform capability checks in several of its file management AJAX actions, 
  allowing users with any role to which an administrator has granted 
  file-manager access (as low as Subscriber) to read arbitrary files on the 
  server — including sensitive configuration files — and to overwrite existing 
  non-PHP files, which can be leveraged to compromise administrator accounts and
  the whole site.
