title: "Authentication Bypass by Capture-replay vulnerability in Spring Spring Security
  allows Spring Security's DPoPProofJwtDecoderFactory contains a cache-based replay
  attack vulnerability. The internal cache storing JWT ID claims has a strict size
  limit, allowing attackers to evict legitimate entries by flooding the server with
  dummy requests, then replay intercepted valid DPoP proofs.\n\nThis issue affects
  Spring Security: 7.1.0, from 7.0.0 through 7.0.6, and from 6.5.0 through 6.5.11."
