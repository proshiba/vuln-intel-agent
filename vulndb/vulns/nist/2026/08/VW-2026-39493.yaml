title: A flaw was found in dhcp-server. A remote attacker with network access to
  the OMAPI (Open Management Application Programming Interface) port, especially
  if not secured with TSIG (Transaction Signature) key authentication, could 
  send a specially crafted lease creation request. This request, containing an 
  overly long InfiniBand MAC address, triggers a buffer overflow in the 
  `print_hw_addr()` function. Successful exploitation leads to a persistent 
  denial of service (DoS), causing the `dhcpd` service to crash and preventing 
  it from restarting without manual intervention.
