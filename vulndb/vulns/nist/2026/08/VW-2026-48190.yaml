title: Mailu is a mail server as a set of Docker images. Prior to version 
  2024.06.52, a missing authorization check in the Mailu admin REST API allows 
  any unauthenticated attacker to remove any potential IP restriction or update 
  the comment field from any existing user token provided the REST API is 
  enabled. Upgrade to Mailu 2024.06.52 to receive a patch or, as a workaround, 
  turn the REST API off.
