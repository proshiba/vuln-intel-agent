title: "Improper validation of resource URL attributes in Apache Wicket allows an
  unauthenticated remote attacker to read files from the web application, including
  files under WEB-INF that the servlet container would not otherwise serve.\n\nThe
  locale, style and variation attributes decoded from a package resource URL are spliced
  into the resource lookup path without being checked for path separators. The IPackageResourceGuard
  — whose rejection of .. is one of the two intended controls — is applied to the
  resource name before those attributes are appended, and WebApplicationPath rejects
  only paths literally beginning with WEB-INF/. Neither control ever inspects the
  attacker-controlled portion of the path. On servlet containers that normalize ..
  in ServletContext.getResource(), a crafted request therefore escapes the intended
  package directory.\n\nThe set of readable files is limited to the file extensions
