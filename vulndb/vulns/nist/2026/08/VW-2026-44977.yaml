title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_u32: validate offshift to prevent shift-out-of-bounds\n\nu32_change() copies
  the user-provided tc_u32_sel.offshift (unsigned char,\n0-255) into the kernel knode
  object without bounds validation. When a\npacket later hits u32_classify() with
  TC_U32_VAROFFSET set, it evaluates\n`ntohs(offmask & *data) >> offshift` where the
  left operand is a 16-bit\nvalue promoted to a 32-bit int. Any offshift >= 32 is
  undefined behavior\nper C11 6.5.7p3, triggerable by an unprivileged user via user/network\n\
  namespaces.\n\nUBSAN: shift-out-of-bounds in net/sched/cls_u32.c:236:43\nshift exponent
  32 is too large for 32-bit type int\n\nFix this by rejecting offshift >= 16 during
  filter creation in\nu32_change()."
