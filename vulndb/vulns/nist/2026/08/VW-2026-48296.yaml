title: "Certificate validation failures in SAML authentication in Apache CloudStack
  4.20.3.0 and 4.22.1.0 on all platforms allow a malicious agent to forge a SAML response
  to the management server. The agent will have to spoof the ip address of the IdP
  or get an url of its own choosing registered in the management server, after which
  it can allow logging on with forged signatures.\n\nUsers are recommended to upgrade
  to versions 4.20.3.1 or 4.22.1.1 and above, which fix this issue."
