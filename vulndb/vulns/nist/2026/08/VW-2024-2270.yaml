title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblktrace:
  fix use after free for struct blk_trace\n\nWhen tracing the whole disk, 'dropped'
  and 'msg' will be created\nunder 'q->debugfs_dir' and 'bt->dir' is NULL, thus blk_trace_free()\n\
  won't remove those files. What's worse, the following UAF can be\ntriggered because
  of accessing stale 'dropped' and 'msg':\n\n==================================================================\n\
  BUG: KASAN: use-after-free in blk_dropped_read+0x89/0x100\nRead of size 4 at addr
  ffff88816912f3d8 by task blktrace/1188\n\nCPU: 27 PID: 1188 Comm: blktrace Not tainted
  5.17.0-rc4-next-20220217+ #469\nHardware name: QEMU Standard PC (i440FX + PIIX,
  1996), BIOS ?-20190727_073836-4\nCall Trace:\n <TASK>\n dump_stack_lvl+0x34/0x44\n\
  \ print_address_description.constprop.0.cold+0xab/0x381\n ? blk_dropped_read+0x89/0x100\n\
  \ ? blk_dropped_read+0x89/0x100\n kasan_report.cold+0x83/0xdf\n ? blk_dropped_read+0x89/0x100\n\
  \ kasan_check_range+0x140/0x1b0\n blk_dropped_read+0x89/0x"
