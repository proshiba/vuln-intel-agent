title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  xen: scsiback: Free unsubmitted command instead of double-putting it\n\nscsiback_get_pend_req()
  obtains a command tag and returns a vscsibk_pend\nwhose embedded se_cmd has only
  been memset to 0, so its cmd_kref is 0;\nthe se_cmd is initialised (kref_init()
  via target_init_cmd()) only\nlater, in scsiback_cmd_exec(), on the successful VSCSIIF_ACT_SCSI_CDB\n\
  path. The two error paths in scsiback_do_cmd_fn() taken before the\ncommand is submitted
  -- a failed scsiback_gnttab_data_map() and an\nunknown ring_req.act -- call\ntransport_generic_free_cmd(&pending_req->se_cmd,
  0), which kref_put()s a\nrefcount of 0. That underflows it (\"refcount_t: underflow;\n\
  use-after-free\") and, as the release function is not run, leaks the\ncommand tag.\n\
