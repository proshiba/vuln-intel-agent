title: The comparison used for the doveadm password and API key is not fully 
  timing safe and can reveal the length of the configured secret. An attacker 
  with access to the same network as the doveadm service, able to make repeated 
  requests and measure response timing accurately, can learn the length of the 
  secret, which reduces the effort needed to guess it. The secret value itself 
  is not disclosed. Restrict network access to the doveadm service to trusted 
  clients. Update to non-vulnerable version. No publicly available exploits are 
  known.
