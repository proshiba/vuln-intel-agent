title: tar-rs versions 0.4.11 through 0.4.46 contain a symlink escape 
  vulnerability in the Builder::append_dir_all() function that allows attackers 
  to read files outside the intended source root directory by planting symlinks 
  in an attacker-controlled directory. When a privileged process archives an 
  untrusted directory, the function follows symlinks without verifying that 
  resolved targets remain within the source root, causing out-of-bounds files to
  be included in the archive as regular files and disclosed to the attacker.
