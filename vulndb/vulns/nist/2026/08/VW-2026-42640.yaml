title: An issue in MongoDB Server's query planner could allow an authenticated 
  user with read-level privileges to cause the server process to terminate 
  unexpectedly by submitting a specially formed query against a collection with 
  a text index. This could result in a denial of service, affecting connected 
  clients and in-flight operations.
