title: jsoup through 1.23.2, fixed in commit 862ba2f, contains an uncontrolled 
  resource consumption vulnerability in XmlTreeBuilder that allows remote 
  attackers to exhaust JVM heap memory by supplying a deeply nested XML document
  with uniquely-namespaced elements. The builder copies the entire inherited 
  namespace map on every start element, causing quadratic time and memory 
  complexity, which attackers can exploit to trigger an OutOfMemoryError and 
  terminate the application.
