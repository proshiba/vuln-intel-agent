title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  fix Route Information option length validation\n\nrt6_route_rcv() validates the
  Route Information option (RFC 4191) length\nagainst the prefix length, but both
  checks are off by one.\n\nrinfo->length is the ND option length in units of 8 octets
  and it\n*includes* the 8-byte option header, so an option carrying N bytes of\n\
  prefix has length == 1 + N/8.  RFC 4191 section 2.3 requires length 3\nwhen Prefix
  Length is greater than 64, and 2 or 3 when it is greater\nthan 0.  The code accepts
  length >= 2 and length >= 1 respectively.\n\nipv6_addr_prefix() then copies prefix_len/8
  bytes out of rinfo->prefix,\nso a Router Advertisement with (prefix_len=128, length=2)
  or\n(prefix_len=64, length=1) makes the kernel read up to 8 bytes past the\nend
  of the option.  Those bytes end up in the prefix of the route that\ngets installed,
  so they are visible to userspace:\n\n  # RA with a Route Information option (prefix_len=128,
  length=2)\n  # foll"
