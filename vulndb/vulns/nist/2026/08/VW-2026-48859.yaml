title: "Ghostwriter through 7.2.6 does not apply per-object authorization on its report
  template lint endpoints. RoleBasedAccessControlMixin.test_func returns only request.user.is_active
  unless a view overrides it, and neither the endpoint that lints a report template
  nor the endpoint that returns stored lint results provides an override, so each
  resolves a ReportTemplate from a caller-supplied primary key with no ownership or
  client-scope check. Any authenticated account can therefore lint an arbitrary template,
  which overwrites that template's stored lint result, and can read the returned findings,
  which enumerate the template's variable names and template-engine errors and so
  disclose its structure. This is distinct from the template swap path: that endpoint
  authorizes the report but omits the per-template check, whereas these endpoints
  omit authorization entirely and remain unfixed."
