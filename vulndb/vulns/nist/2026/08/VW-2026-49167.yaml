title: "RansomLook contains multiple weaknesses in its authentication endpoint that
  allow an unauthenticated remote attacker to enumerate valid usernames, perform unrestricted
  password-guessing attacks, and potentially exhaust application worker resources.\n\
  \nFor local authentication, the login implementation previously checked whether
  a submitted username existed before invoking the password hash verification function.
  Requests containing a nonexistent username therefore returned significantly faster
  than requests for valid accounts, for which the computationally expensive password
  verification routine was executed. A remote attacker could measure these response-time
  differences to determine which usernames correspond to valid RansomLook accounts.\n\
