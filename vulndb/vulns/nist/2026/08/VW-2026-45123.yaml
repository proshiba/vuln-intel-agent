title: The WP Compress – Instant Performance & Speed Optimization plugin for 
  WordPress is vulnerable to Cross-Site Request Forgery in all versions up to, 
  and including, 7.10.09. This is due to missing or incorrect nonce validation 
  on the (top-level template code) function. This makes it possible for 
  unauthenticated attackers to delete arbitrary WordPress options, including 
  critical ones such as siteurl, home, active_plugins, template, and stylesheet,
  causing site outage or a full plugin and theme reset via a forged request 
  granted they can trick a site administrator into performing an action such as 
  clicking on a link.
