title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Installation and Configuration).   The supported version
  that is affected is 11.2.25.0.000. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via HTTP to compromise Oracle Hyperion Infrastructure
  Technology.  Successful attacks of this vulnerability can result in  unauthorized
  update, insert or delete access to some of Oracle Hyperion Infrastructure Technology
  accessible data as well as  unauthorized read access to a subset of Oracle Hyperion
  Infrastructure Technology accessible data and unauthorized ability to cause a partial
  denial of service (partial DOS) of Oracle Hyperion Infrastructure Technology. CVSS
  3.1 Base Score 7.3 (Confidentiality, Integrity and Availability impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L).'
