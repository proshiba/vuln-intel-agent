title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  pin svc_xprt across the asynchronous TLS handshake callback\n\nsvc_tcp_handshake()
  stores the raw svc_xprt pointer in\ntls_handshake_args.ta_data and submits the request
  through\ntls_server_hello_x509(). The handshake core takes only\nsock_hold(req->hr_sk);
  nothing references the embedding struct\nsvc_sock that svc_tcp_handshake_done()
  reaches via container_of().\n\nTwo close races leave the in-flight callback writing
  through a freed\nsvc_sock. svc_sock_free() calls tls_handshake_cancel() and discards\n\
  its return value: a false return means handshake_complete() has\nalready set HANDSHAKE_F_REQ_COMPLETED
  but hp_done() may not have\nfinished, yet svc_sock_free() proceeds to kfree(svsk).
  The\ncancel-loser fall-through inside svc_tcp_handshake() itself produces\nthe same
  window: when wait_for_completion_interruptible_timeout()\nreturns <= 0 (timeout
  or signal) and tls_handshake_cancel() returns\nfalse, the function does not drain"
