title: "In the Linux kernel, the following vulnerability has been resolved:\n\npeci:
  cpu: Fix use-after-free in adev_release()\n\nWhen auxiliary_device_add() returns
  an error, auxiliary_device_uninit()\nis called, which causes refcount for device
  to be decremented and\n.release callback will be triggered.\n\nBecause adev_release()
  re-calls auxiliary_device_uninit(), it will cause\nuse-after-free:\n[ 1269.455172]
  WARNING: CPU: 0 PID: 14267 at lib/refcount.c:28 refcount_warn_saturate+0x110/0x15\n\
  [ 1269.464007] refcount_t: underflow; use-after-free."
