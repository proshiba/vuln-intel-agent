title: The Brizy  WordPress plugin before 2.8.19 does not sanitize or escape 
  featured-image focal-point coordinates submitted through one of its AJAX 
  actions before storing them and later echoing them into HTML attributes in the
  post editor's Featured Image meta box, allowing users with the Contributor 
  role or above to inject arbitrary web scripts that execute in the session of a
  higher-privileged user who opens the post for review.
