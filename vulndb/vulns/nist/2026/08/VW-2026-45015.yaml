title: '@fastify/multipart is a multipart form-data parser for Fastify. In versions
  from 3.0.0 up to but not including 10.1.1, request.saveRequestFiles() can leave
  completed temporary files on disk when a client disconnects while the parser is
  advancing between multipart parts. The iterator rejection that occurs between parts
  falls outside the per-file cleanup path, so an earlier completed file is never removed.
  An unauthenticated client can repeat this to cause persistent, linear disk consumption,
  leading to denial of service. This is an incomplete-fix variant of CVE-2025-24033.
  The issue is fixed in @fastify/multipart 10.1.1. Users should upgrade to 10.1.1.'
