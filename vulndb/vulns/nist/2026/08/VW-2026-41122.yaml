title: A path traversal vulnerability in o1lab/xmysql (all versions) allows an 
  unauthenticated remote attacker to read and download arbitrary files from the 
  server. The lib/xapi.js file at lines 338 and 424 uses the user-controlled 
  req.query.name parameter in path.join(cwd, name) without sanitization before 
  passing it to res.download, enabling directory traversal via ../ sequences to 
  access sensitive system files.
