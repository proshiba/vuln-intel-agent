title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nft_set_pipapo: don't leak bad clone into future transaction\n\nOn memory allocation
  failure the cloned nft_pipapo_match can enter a bad\nstate:\n - some fields can
  have their lookup tables resized while others did\n   not\n - bits might have been
  toggled\n - scratch map can be undersized which also means m->bsize_max can be\n\
  \   lower than what is required\n\nThis means that the next insertion in the same
  batch can trigger\nout-of-bounds writes.\n\nFurthermore, a failure in the first
  can result in the bad clone to\nleak into the next transaction because the abort
  callback is never\nexecuted in this case (the upper layer saw an error and no attempt
  to\nallocate a transactional request was made).\n\nRecord a state for the nft_pipapo_match
  structure:\n- NEW (pristine clone)\n- MOD (modified clone with good state)\n- ERR
  (potentially bogus content)\n\nThen make it so that deletes and insertions fail
  when the clone\nentered ERR state.\n"
