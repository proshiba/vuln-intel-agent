title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/ops-common:
  putback folios on invalid migrate nid\n\ndamon_pa_migrate() and damos_va_migrate()
  isolate folios into a local list\nand then call damon_migrate_pages().  When target_nid
  is invalid\n(including the scheme default NUMA_NO_NODE / -1), damon_migrate_pages()\n\
  returns early without putting the folios back to the LRU.\n\nCallers then discard
  the list head while those folios remain isolated with\nan extra reference taken
  by folio_isolate_lru().  The pages stay off the\nLRU for as long as the mapping
  exists (anon active+inactive counts drop\nwhile RSS does not), and the leftover
  references can pin the pages after\nthe mapping is gone.\n\nPut the folios back
  on the invalid-nid path so ignored migration requests\nstill return them to the
  LRU."
