title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/proc/task_mmu:
  fix hugetlb self-deadlock in pagemap_scan_pte_hole()\n\nA PAGEMAP_SCAN ioctl requesting
  PM_SCAN_WP_MATCHING on a hugetlb VMA hangs\nthe calling thread, unkillably, as soon
  as the scan reaches an unpopulated\npart of the range:\n\n  do_pagemap_scan()\n\
  \    walk_page_range()\n      walk_hugetlb_range()\n        hugetlb_vma_lock_read()\
  \           # take the vma lock for read ...\n        pagemap_scan_pte_hole()  \
  \         # ... ->pte_hole() for a hole\n          uffd_wp_range()\n           \
  \ change_protection()\n              hugetlb_change_protection()\n             \
  \   hugetlb_vma_lock_write()  # ... and block taking it for write\n\nwalk_hugetlb_range()
  holds the hugetlb vma lock for read across the whole\nwalk.  A present entry goes
  to ->hugetlb_entry(); an unpopulated one goes\nto ->pte_hole(), i.e.  pagemap_scan_pte_hole().\
  \  To write-protect the hole\nthat handler calls uffd_wp_range(), which on a hugetlb
  VMA reaches\nhuge"
