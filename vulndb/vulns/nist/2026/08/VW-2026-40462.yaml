title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. Prior to version 1.0.4, the route `POST /api/tenants/{tenantId}/staff/{staffId}/crypto`
  accepts and stores attacker-controlled ML-KEM-768 public keys against any tenant
  on the platform without authentication. The handler logs an \"Unauthorized crypto
  key storage attempt\" warning when neither a session nor a registration cookie is
  present, then proceeds to insert the row regardless. The platform's E2E claim that
  \"even administrators cannot view sensitive information\" is broken: any unauthenticated
  network attacker can register themselves as an additional encryption recipient for
  any tenant's future patient appointments. A second variant of the bug suppresses
  the unauthorized-warning log entry. The Zod schema makes the `email` field optional.
