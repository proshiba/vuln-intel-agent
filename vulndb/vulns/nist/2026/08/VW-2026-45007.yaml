title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  idxd: fix fdev setup failure cleanup in idxd_cdev_open()\n\nThe failed_dev_add and
  failed_dev_name paths drop the file-device\nreference while wq->wq_lock is still
  held. If put_device(fdev) drops the\nlast reference, idxd_file_dev_release() runs
  synchronously and tries to\ntake wq->wq_lock again, deadlocking.\n\nThose paths
  also fall through into the later ctx cleanup labels even\nthough idxd_file_dev_release()
  owns that cleanup and frees ctx. This can\nmake idxd_xa_pasid_remove(ctx) and kfree(ctx)
  operate on a freed context.\n\nMove idxd_wq_get() before file-device setup can fail,
  since the release\ncallback always calls idxd_wq_put(). Then unlock wq->wq_lock
  before\nput_device(fdev) and return directly from the file-device setup failure\n\
  path, leaving ctx cleanup to the release callback."
