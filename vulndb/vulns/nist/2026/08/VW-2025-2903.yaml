title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  fix use-after-free on source server when doing inter-server copy\n\nUse-after-free
  occurred when the laundromat tried to free expired\ncpntf_state entry on the s2s_cp_stateids
  list after inter-server\ncopy completed. The sc_cp_list that the expired copy state
  was\ninserted on was already freed.\n\nWhen COPY completes, the Linux client normally
  sends LOCKU(lock_state x),\nFREE_STATEID(lock_state x) and CLOSE(open_state y) to
  the source server.\nThe nfs4_put_stid call from nfsd4_free_stateid cleans up the
  copy state\nfrom the s2s_cp_stateids list before freeing the lock state's stid.\n\
  \nHowever, sometimes the CLOSE was sent before the FREE_STATEID request.\nWhen this
  happens, the nfsd4_close_open_stateid call from nfsd4_close\nfrees all lock states
  on its st_locks list without cleaning up the copy\nstate on the sc_cp_list list.
  When the time the FREE_STATEID arrives the\nserver returns BAD_STATEID since the
  lock state was freed. "
