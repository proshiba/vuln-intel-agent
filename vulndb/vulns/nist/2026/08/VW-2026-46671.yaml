title: 'Vulnerability in the Oracle Hyperion Calculation Manager product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows low privileged attacker with network access
  via HTTP to compromise Oracle Hyperion Calculation Manager.  While the vulnerability
  is in Oracle Hyperion Calculation Manager, attacks may significantly impact additional
  products (scope change).  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Hyperion
  Calculation Manager accessible data as well as  unauthorized access to critical
  data or complete access to all Oracle Hyperion Calculation Manager accessible data.
  CVSS 3.1 Base Score 9.6 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N).'
