title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/dibs:
  Correct freeing of dmb_clientid_arr\n\nA dibs device interrupt handler can be active
  after dibs_dev_del() and\nmay still access dmb_clientid_arr. (UAF)\n\nIn case of
  a failure in dibs_dev_add() being called by dibs_lo_dev_probe()\ndmb_clientid_arr
  is freed twice (double free).\n\nFree dmb_clientid_arr in dibs_dev_release() after
  last reference is gone.\nNote that allocating in dibs_dev_add() instead of dibs_dev_alloc()
  is ok\nfor now, because no dmbs can be registered before dibs_dev_add()."
