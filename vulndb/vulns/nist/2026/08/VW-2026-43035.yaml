title: 'RustFS is a distributed object storage system built in Rust. Prior to 1.0.0-beta.12,
  RustFS get_condition_values folds attacker-controlled request headers from HeaderMap
  into server-derived userid, username, principaltype, groups, versionid, signatureversion,
  jwt:, and ldap: condition keys, allowing authenticated callers to satisfy identity-based
  policy conditions. This issue is fixed in version 1.0.0-beta.12.'
