title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  Fix memory corruption in VF driver\n\nDisable VF's RX/TX queues, when it's disabled.
  VF can have queues enabled,\nwhen it requests a reset. If PF driver assumes that
  VF is disabled,\nwhile VF still has queues configured, VF may unmap DMA resources.\n\
  In such scenario device still can map packets to memory, which ends up\nsilently
  corrupting it.\nPreviously, VF driver could experience memory corruption, which
  lead to\ncrash:\n[ 5119.170157] BUG: unable to handle kernel paging request at 00001b9780003237\n\
  [ 5119.170166] PGD 0 P4D 0\n[ 5119.170173] Oops: 0002 [#1] PREEMPT_RT SMP PTI\n\
  [ 5119.170181] CPU: 30 PID: 427592 Comm: kworker/u96:2 Kdump: loaded Tainted: G\
  \        W I      --------- -  - 4.18.0-372.9.1.rt7.166.el8.x86_64 #1\n[ 5119.170189]
