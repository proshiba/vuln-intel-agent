title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/hw_engine:
  Fix double-free of managed BO in error path\n\nThe error path in hw_engine_init()
  explicitly frees a BO allocated\nwith xe_managed_bo_create_pin_map() via xe_bo_unpin_map_no_vm().\n\
  Since the managed BO already has a devm cleanup action registered,\nthis causes
  a double-free when devm unwinds during probe failure.\n\nRemove the explicit free
  and let devm handle it, consistent with\nall other xe_managed_bo_create_pin_map()
  callers.\n\n(cherry picked from commit e459a3bdeb117be496d7f229e2ea1f6c9fe4080b)"
