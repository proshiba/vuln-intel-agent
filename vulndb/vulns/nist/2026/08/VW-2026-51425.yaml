title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disable xfrm_decode_session hook attachment\n\nBPF LSM programs can currently attach
  to xfrm_decode_session(). That\nhook may return an error, but security_skb_classify_flow()
  calls it\nfrom a void path and triggers BUG_ON() if an error is returned.\n\nDisable
  BPF attachment to the hook to prevent a BPF LSM program from\nturning packet classification
  into a full panic."
