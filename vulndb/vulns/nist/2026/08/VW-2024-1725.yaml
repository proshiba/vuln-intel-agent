title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  emu10k1: Fix out of bounds access in snd_emu10k1_pcm_channel_alloc()\n\nThe voice
  allocator sometimes begins allocating from near the end of the\narray and then wraps
  around, however snd_emu10k1_pcm_channel_alloc()\naccesses the newly allocated voices
  as if it never wrapped around.\n\nThis results in out of bounds access if the first
  voice has a high enough\nindex so that first_voice + requested_voice_count > NUM_G
  (64).\nThe more voices are requested, the more likely it is for this to occur.\n\
  \nThis was initially discovered using PipeWire, however it can be reproduced\nby
  calling aplay multiple times with 16 channels:\naplay -r 48000 -D plughw:CARD=Live,DEV=3
  -c 16 /dev/zero\n\nUBSAN: array-index-out-of-bounds in sound/pci/emu10k1/emupcm.c:127:40\n\
  index 65 is out of range for type 'snd_emu10k1_voice [64]'\nCPU: 1 PID: 31977 Comm:
  aplay Tainted: G        W IOE      6.0.0-rc2-emu10k1+ #7\nHardware name: ASUSTEK
  COMPUTER INC P5W D"
