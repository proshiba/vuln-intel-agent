title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd:
  Plug nlm_file refcount leak on cached nlm_do_fopen() failure\n\nThe cached-file
  path in nlm_lookup_file() reaches the found: label\nunconditionally, even when nlm_do_fopen()
  fails. At that label\n*result and file->f_count are updated before the error is
  returned.\nThe wrappers nlm3svc_lookup_file() and nlm4svc_lookup_file() then\nbail
  out of their switch without copying *result back to their\ncaller, so the proc handler's
  local nlm_file pointer remains NULL\nand the cleanup path skips nlm_release_file().
  The f_count\nincrement is never released, and nlm_traverse_files() can no\nlonger
  reap the file because its refcount never returns to zero\nbetween requests.\n\n\
  Short-circuit the cached path so neither *result nor f_count is\ntouched when nlm_do_fopen()
  fails on a hashed nlm_file."
