title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/cma:
  Do not change route.addr.src_addr outside state checks\n\nIf the state is not idle
  then resolve_prepare_src() should immediately\nfail and no change to global state
  should happen. However, it\nunconditionally overwrites the src_addr trying to build
  a temporary any\naddress.\n\nFor instance if the state is already RDMA_CM_LISTEN
  then this will corrupt\nthe src_addr and would cause the test in cma_cancel_operation():\n\
  \n           if (cma_any_addr(cma_src_addr(id_priv)) && !id_priv->cma_dev)\n\nWhich
  would manifest as this trace from syzkaller:\n\n  BUG: KASAN: use-after-free in
  __list_add_valid+0x93/0xa0 lib/list_debug.c:26\n  Read of size 8 at addr ffff8881546491e0
  by task syz-executor.1/32204\n\n  CPU: 1 PID: 32204 Comm: syz-executor.1 Not tainted
  5.12.0-rc8-syzkaller #0\n  Hardware name: Google Google Compute Engine/Google Compute
  Engine, BIOS Google 01/01/2011\n  Call Trace:\n   __dump_stack lib/dump_stack.c:79
  [inline]\n   d"
