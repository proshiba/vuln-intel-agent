title: ArcadeDB versions before 26.7.3 contain an information disclosure 
  vulnerability in the MCP get_server_settings tool that leaks the 
  arcadedb.ha.clusterToken in cleartext. Attackers with MCP access can retrieve 
  the cluster token and use it with X-ArcadeDB-Cluster-Token and 
  X-ArcadeDB-Forwarded-User headers to impersonate root and achieve full server 
  compromise.
