title: The report.get procedure in packages/trpc/src/routers/report.ts accepted 
  only a reportId and returned getReportById(reportId) directly. The 
  enforceAccess middleware in packages/trpc/src/trpc.ts evaluates membership 
  only when the input carries a projectId or organizationId key, so an input 
  consisting of a reportId alone passed through unchecked, and getReportById in 
  packages/db/src/services/reports.service.ts performs a findUnique on the 
  report id with no project scoping. Any authenticated user could therefore read
  the full configuration of any saved report on the instance, including the 
  owning projectId, event series, filters, breakdowns and formulas, by supplying
  its identifier. The adjacent update, delete and duplicate procedures resolve 
  the report first and check getProjectAccess against the report's own 
  projectId, so the omission was specific to this procedure.
