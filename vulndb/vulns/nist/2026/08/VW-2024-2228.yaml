title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  mm: Fix lockless walks with static and dynamic page-table folding\n\nLina reports
  random oopsen originating from the fast GUP code when\n16K pages are used with 4-level
  page-tables, the fourth level being\nfolded at runtime due to lack of LPA2.\n\n\
  In this configuration, the generic implementation of\np4d_offset_lockless() will
  return a 'p4d_t *' corresponding to the\n'pgd_t' allocated on the stack of the caller,
  gup_fast_pgd_range().\nThis is normally fine, but when the fourth level of page-table
  is folded\nat runtime, pud_offset_lockless() will offset from the address of the\n\
  'p4d_t' to calculate the address of the PUD in the same page-table page.\nThis results
  in a stray stack read when the 'p4d_t' has been allocated\non the stack and can
  send the walker into the weeds.\n\nFix the problem by providing our own definition
  of p4d_offset_lockless()\nwhen CONFIG_PGTABLE_LEVELS <= 4 which returns the real
  page-table\npointer rather"
