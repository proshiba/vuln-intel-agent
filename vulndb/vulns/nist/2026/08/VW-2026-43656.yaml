title: CyberPanel before 3.0.0 contains a path traversal vulnerability that 
  allows authenticated administrators to read arbitrary files from the server 
  filesystem by supplying unsanitized file paths to the cloudAPI ReadReport 
  endpoint. Attackers can manipulate the reportFile parameter in the JSON 
  request body, which is passed directly to open() in cloudManager.py without 
  validation or allowlisting, enabling traversal to any file readable by the 
  root-privileged CyberPanel process including credential files, SSL and SSH 
  private keys, and JWT secret files.
