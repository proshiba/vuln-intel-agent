title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btusb: validate Realtek vendor event length\n\nbtusb_recv_event_realtek() reads
  the event code at data[0] and the Realtek\nsubevent code at data[2] before deciding
  whether to consume a vendor event\nas a coredump.\n\nFor example, the two-byte event
  ff 00 contains a complete vendor-event\nheader declaring zero parameters. The old
  classifier still reads a\nnonexistent third byte and can misclassify the event as
  a coredump if the\nadjacent byte is 0x34.\n\nRequire the HCI event header and first
  parameter to be present before\ninspecting the Realtek subevent code. Short events
  continue through the\nnormal HCI receive path, which owns their protocol validation."
