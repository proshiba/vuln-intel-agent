title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  camss: Clean up received buffers on failed start of streaming\n\nIt is required
  to return the received buffers, if streaming can not be\nstarted. For instance media_pipeline_start()
  may fail with EPIPE, if\na link validation between entities is not passed, and in
  such a case\na user gets a kernel warning:\n\n  WARNING: CPU: 1 PID: 520 at drivers/media/common/videobuf2/videobuf2-core.c:1592
  vb2_start_streaming+0xec/0x160\n  <snip>\n  Call trace:\n   vb2_start_streaming+0xec/0x160\n\
  \   vb2_core_streamon+0x9c/0x1a0\n   vb2_ioctl_streamon+0x68/0xbc\n   v4l_streamon+0x30/0x3c\n\
  \   __video_do_ioctl+0x184/0x3e0\n   video_usercopy+0x37c/0x7b0\n   video_ioctl2+0x24/0x40\n\
  \   v4l2_ioctl+0x4c/0x70\n\nThe fix is to correct the error path in video_start_streaming()
  of camss."
