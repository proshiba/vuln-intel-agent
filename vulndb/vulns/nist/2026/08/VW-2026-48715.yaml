title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/ism:
  Fix UAF of sba and ieq during ism_dev_exit()\n\nA ism interrupt handler can be active
  in parallel with ism_dev_exit(),\naccessing freed data structures.\n\nNo new interrupts
  will be generated after unregister_ieq(). Drain ongoing\ninterrupt handlers by free_irq(),
  before freeing ism data structures."
