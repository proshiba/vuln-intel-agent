title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/swap:
  fix race when skipping swapcache\n\nWhen skipping swapcache for SWP_SYNCHRONOUS_IO,
  if two or more threads\nswapin the same entry at the same time, they get different
  pages (A, B). \nBefore one thread (T0) finishes the swapin and installs page (A)
  to the\nPTE, another thread (T1) could finish swapin of page (B), swap_free the\n\
  entry, then swap out the possibly modified page reusing the same entry. \nIt breaks
  the pte_same check in (T0) because PTE value is unchanged,\ncausing ABA problem.\
  \  Thread (T0) will install a stalled page (A) into the\nPTE and cause data corruption.\n\
  \nOne possible callstack is like this:\n\nCPU0                                 CPU1\n\
  ----                                 ----\ndo_swap_page()                      \
  \ do_swap_page() with same entry\n<direct swapin path>                 <direct swapin
  path>\n<alloc page A>                       <alloc page B>\nswap_read_folio() <-
  read to page A  swap_read_fol"
