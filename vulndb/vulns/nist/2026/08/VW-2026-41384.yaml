title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix infinite loop in __tipc_nl_compat_dumpit\n\ncmd->dumpit callback can return
  a negative errno, causing an infinite\nloop due to the while(len) condition. As
  the loop never terminates,\ngenl_mutex is never released, and other tasks waiting
  on it starve in D\nstate.\n\nCheck dumpit's return value, propagate it and jump
  to err_out on error."
