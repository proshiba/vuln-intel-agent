title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  carl9170: fix buffer overflow in rx_stream failover path\n\nThe failover continuation
  in carl9170_rx_stream() copies the full tlen\nfrom the second USB transfer instead
  of capping at rx_failover_missing\nbytes. When both transfers are near maximum size,
  the total exceeds the\n65535-byte failover SKB, triggering skb_over_panic.\n\nLimit
  the copy size to the missing byte count.\n\n[Fix checkpatch CHECK:PARENTHESIS_ALIGNMENT]"
