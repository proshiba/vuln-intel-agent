title: 'Vulnerability in the Siebel CRM Cloud Applications product of Oracle Siebel
  CRM (component: Siebel Cloud Manager).  Supported versions that are affected are
  22.3-26.6. Easily exploitable vulnerability allows low privileged attacker with
  network access via HTTP to compromise Siebel CRM Cloud Applications.  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all Siebel CRM Cloud Applications accessible
  data as well as  unauthorized read access to a subset of Siebel CRM Cloud Applications
  accessible data and unauthorized ability to cause a hang or frequently repeatable
  crash (complete DOS) of Siebel CRM Cloud Applications. CVSS 3.1 Base Score 8.3 (Confidentiality,
  Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H).'
