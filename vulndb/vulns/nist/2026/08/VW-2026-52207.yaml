title: ProfilePress (wp-user-avatar) WordPress plugin before 4.17.2 contains an 
  unauthenticated remote code execution vulnerability that allows 
  unauthenticated attackers to install and activate arbitrary plugins by 
  brute-forcing a weak 32-bit connect token via the ppress_connect_process AJAX 
  handler. Attackers can supply a caller-controlled URL through the file request
  parameter to trigger silent plugin installation and activation, achieving PHP 
  code execution as the web-server user.
