title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: Avoid consuming a stale esr value when SError occur\n\nWhen any exception
  other than an IRQ occurs, the CPU updates the ESR_EL2\nregister with the exception
  syndrome. An SError may also become pending,\nand will be synchronised by KVM. KVM
  notes the exception type, and whether\nan SError was synchronised in exit_code.\n\
  \nWhen an exception other than an IRQ occurs, fixup_guest_exit() updates\nvcpu->arch.fault.esr_el2
  from the hardware register. When an SError was\nsynchronised, the vcpu esr value
  is used to determine if the exception\nwas due to an HVC. If so, ELR_EL2 is moved
  back one instruction. This\nis so that KVM can process the SError first, and re-execute
  the HVC if\nthe guest survives the SError.\n\nBut if an IRQ synchronises an SError,
  the vcpu's esr value is stale.\nIf the previous non-IRQ exception was an HVC, KVM
  will corrupt ELR_EL2,\ncausing an unrelated guest instruction to be executed twice.\n\
  \nCheck ARM_EXC"
