title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix NULL ptr deref in crypto_aead_setkey()\n\nNeither SMB3.0 or SMB3.02
  supports encryption negotiate context, so\nwhen SMB2_GLOBAL_CAP_ENCRYPTION flag
  is set in the negotiate response,\nthe client uses AES-128-CCM as the default cipher.\
  \  See MS-SMB2\n3.3.5.4.\n\nCommit b0abcd65ec54 (\"smb: client: fix UAF in async
  decryption\") added\na @server->cipher_type check to conditionally call\nsmb3_crypto_aead_allocate(),
  but that check would always be false as\n@server->cipher_type is unset for SMB3.02.\n\
  \nFix the following KASAN splat by setting @server->cipher_type for\nSMB3.02 as
  well.\n\nmount.cifs //srv/share /mnt -o vers=3.02,seal,...\n\nBUG: KASAN: null-ptr-deref
  in crypto_aead_setkey+0x2c/0x130\nRead of size 8 at addr 0000000000000020 by task
  mount.cifs/1095\nCPU: 1 UID: 0 PID: 1095 Comm: mount.cifs Not tainted 6.12.0 #1\n\
  Hardware name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS 1.16.3-3.fc41\n04/01/2014\n\
  Call Trace:\n <TASK>\n d"
