title: NexTor IP Changer is a command-line tool that leverages the Tor network 
  to periodically rotate a user's IP address. Versions prior to 2.0.0 have a 
  command execution vulnerability due to unsafe use of `shell=True` with 
  commands that rely on executable resolution through the `PATH` environment 
  variable. An attacker controlling the execution environment can place 
  malicious executables such as sudo earlier in the `PATH`, resulting in 
  execution of attacker-controlled code. Version 2.0.0 fixes the issue.
