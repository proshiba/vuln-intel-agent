title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: Fix adv monitor add failure cleanup\n\nhci_add_adv_monitor() publishes a new
  adv_monitor in\nhdev->adv_monitors_idr before the powered MSFT setup step. The MSFT\n\
  offload add path can then fail either locally before the controller add\ncommand
  completes, or in the MSFT add callback. In the current queued\nmanagement add flow,
  hci_cmd_sync_work() still invokes\nmgmt_add_adv_patterns_monitor_complete() with
  the original pending command\nafter msft_add_monitor_pattern() returns.\n\nThe buggy
  scenario involves two paths, with each column showing the order\nwithin that path:\n\
  \nMSFT add handling                  MGMT completion\n1. insert monitor and handle\
