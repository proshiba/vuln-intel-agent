title: SSHFS is a network filesystem client for connecting to SSH servers. From 
  version 1.4 until 3.7.6, SSHFS accepts a bracketed mount source such as 
  [-oProxyCommand=CMD]:/path and find_base_path() removes the brackets, leaving 
  a host value that begins with - and is passed directly to ssh as a 
  command-line argument. When a caller also supplies a path-valued sftp_server, 
  ssh treats the normalized host as an option and the server path as its 
  destination, causing an injected ProxyCommand to execute locally before any 
  connection or authentication succeeds. The attack requires a caller or wrapper
  that passes an attacker-controlled mount source to SSHFS with the required 
  sftp_server configuration and results in arbitrary command execution as the 
  user running SSHFS. This issue is fixed in version 3.7.6.
