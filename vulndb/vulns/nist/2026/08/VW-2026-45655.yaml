title: The Grav API plugin (getgrav/grav-plugin-api, bundled with Grav's 
  admin-next/API stack) before 1.0.14 fails to enforce the authorize requirement
  in MenubarController::executeAction(). While the GET /menubar/items listing 
  endpoint correctly filters menubar items via userPassesAuthorize(), the POST 
  /api/v1/menubar/actions/{plugin}/{action} endpoint only checks the baseline 
  api.access permission and never evaluates the authorize field a plugin 
  registered for that action. Any authenticated caller with api.access can 
  therefore invoke a privileged menubar action directly, bypassing the intended 
  authorization. No plugin bundled with core Grav currently registers a 
  privileged authorize handler, so on a stock install the impact is latent; the 
  flaw affects any first- or third-party plugin relying on the documented 
  authorize semantics.
