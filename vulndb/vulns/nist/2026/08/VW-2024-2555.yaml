title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp/dccp:
  Don't use timer_pending() in reqsk_queue_unlink().\n\nMartin KaFai Lau reported
  use-after-free [0] in reqsk_timer_handler().\n\n  \"\"\"\n  We are seeing a use-after-free
  from a bpf prog attached to\n  trace_tcp_retransmit_synack. The program passes the
  req->sk to the\n  bpf_sk_storage_get_tracing kernel helper which does check for
  null\n  before using it.\n  \"\"\"\n\nThe commit 83fccfc3940c (\"inet: fix potential
  deadlock in\nreqsk_queue_unlink()\") added timer_pending() in reqsk_queue_unlink()
  not\nto call del_timer_sync() from reqsk_timer_handler(), but it introduced a\n\
  small race window.\n\nBefore the timer is called, expire_timers() calls detach_timer(timer,
  true)\nto clear timer->entry.pprev and marks it as not pending.\n\nIf reqsk_queue_unlink()
  checks timer_pending() just after expire_timers()\ncalls detach_timer(), TCP will
  miss del_timer_sync(); the reqsk timer will\ncontinue running and send multiple
  SYN+ACKs until it expire"
