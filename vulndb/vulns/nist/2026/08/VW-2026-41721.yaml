title: unearth through 0.18.2, fixed in commit 6c78164, contains a path 
  traversal vulnerability in the is_within_directory function that fails to 
  normalize paths before validation, allowing ../ sequences to bypass directory 
  containment checks. Attackers can supply malicious tar archives with symlink 
  members or traversal sequences to write files to arbitrary filesystem 
  locations accessible to the process.
