title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix invalid memory access while processing fragmented packets\n\nThe monitor
  ring and the reo reinject ring share the same ring mask index.\nWhen the driver
  receives an interrupt for the reo reinject ring, the\nmonitor ring is also processed,
  leading to invalid memory access. Since\nmonitor support is not yet enabled in ath12k,
  the ring mask for the monitor\nring should be removed.\n\nTested-on: QCN9274 hw2.0
  PCI WLAN.WBE.1.1.1-00209-QCAHKSWPL_SILICONZ-1"
