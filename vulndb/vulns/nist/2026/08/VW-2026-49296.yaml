title: The Forminator Forms – Contact Form, Payment Form & Custom Form Builder 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via Radio 
  Field (Save and Continue Draft) in all versions up to, and including, 1.57.0.2
  due to insufficient input sanitization and output escaping. This makes it 
  possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. This is 
  exploitable because the Save-and-Continue draft submission AJAX endpoint is 
  registered as nopriv, allowing unauthenticated attackers to bypass radio field
  option-membership validation and persist a crafted payload that, when rendered
  on the Submissions admin page, is auto-executed via the bundled Inputmask 
  library's data-attribute callback binding.
