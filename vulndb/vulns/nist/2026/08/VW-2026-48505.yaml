title: CrossWatch (CW) is a synchronization engine. Prior to version 0.9.21, GET
  /api/app-auth/status is accessible without authentication and returns the 
  other_sessions array, which exposes metadata of all active sessions — 
  including originating IP addresses, User-Agent strings, internal session IDs, 
  and creation/expiry timestamps. Any unauthenticated network attacker can 
  enumerate this data without credentials. Version 0.9.21 fixes the issue.
