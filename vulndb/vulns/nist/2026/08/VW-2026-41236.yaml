title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/core:
  validate ranges in damon_set_regions()\n\nDAMON core logic assumes zero length regions
  don't exist.  However, a few\nDAMON API callers including DAMON_SYSFS, DAMON_RECLAIM
  and DAMON_LRU_SORT\nallow users to set empty monitoring target regions.  This could
  result in\nWARN_ONCE() on CONFIG_DAMON_DEBUG_SANITY enabled kernel, and\ndivide-by-zero
  from damon_merge_two_regions().\n\nFor example, the WANR_ONCE() can be triggered
  like below.\n\n    # grep DAMON_DEBUG_SANITY /boot/config-$(uname -r)\n    # CONFIG_DAMON_DEBUG_SANITY=y\n\
  \    # damo start\n    # cd /sys/kernel/mm/damon/admin/kdamonds/0\n    # echo 0
  > contexts/0/targets/0/regions/0/start\n    # echo 0 > contexts/0/targets/0/regions/0/end\n\
  \    # echo commit > state\n    # dmesg\n    [....]\n    [   73.705780] ------------[
  cut here ]------------\n    [   73.707552] start 0 >= end 0\n    [   73.708452]
  WARNING: mm/damon/core.c:359 at damon_new_region+0x6e/0x80, CPU#1: kdam"
