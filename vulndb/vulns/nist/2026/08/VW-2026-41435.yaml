title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix ISM dc_lock deadlock during suspend\n\n[Why]\nSystem hang observed during suspend/resume
  while video is playing.\namdgpu_dm_ism_disable() is called under dc_lock and waits
  for ISM\ndelayed work via disable_delayed_work_sync(). The work handlers\nthemselves
  take dc_lock, producing an ABBA deadlock when a worker is\nin flight at suspend
  time.\n\n[How]\nSplit the disable path into two phases with opposite locking\ncontracts:\n\
  \  1. amdgpu_dm_ism_disable() -- quiesces workers, must NOT hold\n     dc_lock.\n\
  \  2. amdgpu_dm_ism_force_full_power() (new) -- drives the ISM FSM\n     back to
  FULL_POWER_RUNNING, must hold dc_lock."
