title: 'A flaw has been found in yaojingang GEOFlow up to 2.1.0. This issue affects
  the function preview of the file app/Http/Controllers/Admin/SiteThemeEditorController.php
  of the component Superadmin Theme Editor. This manipulation of the argument blade
  causes code injection. It is possible to initiate the attack remotely. The exploit
  has been published and may be used. Upgrading to version 2.1.1 is capable of addressing
  this issue. Patch name: 67abfd864a15d169a78429f3290c91cb3b93e849. Upgrading the
  affected component is advised.'
