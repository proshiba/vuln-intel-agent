title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  qcom: q6apm: fix NULL pointer dereference in graph_callback\n\nWhen q6apm_free_fragments()
  is called it frees rx_data.buf/tx_data.buf\nand sets them to NULL under graph->lock.
  A late DSP buffer-done response\ncan race with this: graph_callback() passes the
  !graph->ar_graph guard\n(not yet NULL), acquires the lock, but then dereferences
  a now-NULL buf\npointer to read buf[token].phys, crashing at virtual address 0x10.\n\
  \nAdd a NULL check for buf inside the mutex-protected section in both the\nwrite-done
  (DATA_CMD_RSP_WR_SH_MEM_EP_DATA_BUFFER_DONE_V2) and\nread-done (DATA_CMD_RSP_RD_SH_MEM_EP_DATA_BUFFER_V2)
  handlers and bail\nout cleanly if buffers have already been freed.\n\nThis problem
  is only shown up recently while apr bus was updated to\nprocess the commands per
  service rather from single global queue."
