title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  pcm: wake linked drain waiters on unlink\n\nsnd_pcm_drain() on a linked stream parks
  an on-stack wait entry on the\ndrained peer's runtime->sleep, and after schedule_timeout()
  removes it\nonly if that peer is still found in the caller's group.  If group\n\
  membership changes during the wait and the sleep ends by signal or\ntimeout (so
  autoremove_wake_function() does not run), finish_wait() is\nskipped and snd_pcm_drain()
  returns with the entry still queued on that\nstream's sleep list; a later wake_up()
  then walks a freed stack frame.\nThis is reachable by unlinking either the drained
  or the draining stream.\n\nUnlike the close path (snd_pcm_drop() -> snd_pcm_post_stop()),\n\
  snd_pcm_unlink() never wakes the sleep queues.  Wake every group member\nunder the
  group lock before the membership change, so a linked drainer is\nreleased and drops
  its entry while the streams are still grouped.\n\nThe window was opened when snd_pcm_link_rws"
