title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Fix an out-of-bounds shift when invalidating TLB\n\nWhen the size of the range invalidated
  is larger than\nrounddown_pow_of_two(ULONG_MAX),\nThe function macro roundup_pow_of_two(length)
  will hit an out-of-bounds\nshift [1].\n\nUse a full TLB invalidation for such cases.\n\
  v2:\n- Use a define for the range size limit over which we use a full\n  TLB invalidation.
  (Lucas)\n- Use a better calculation of the limit.\n\n[1]:\n[   39.202421] ------------[
  cut here ]------------\n[   39.202657] UBSAN: shift-out-of-bounds in ./include/linux/log2.h:57:13\n\
  [   39.202673] shift exponent 64 is too large for 64-bit type 'long unsigned int'\n\
  [   39.202688] CPU: 8 UID: 0 PID: 3129 Comm: xe_exec_system_ Tainted: G     U  \
