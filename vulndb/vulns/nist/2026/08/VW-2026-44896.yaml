title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  jz4780: Cache host clock rate at probe to prevent CCF prepare_lock deadlock\n\n\
  Fix a severe AB/BA deadlock between the Common Clock Framework (CCF)\nand the I2C
  adapter lock, which triggers when an I2C-controlled clock\ngenerator client (like
  the Si5351) is registered or modified under the CCF.\n\nDuring an i2c client clock
  (generator) frequency change, the CCF acquires its global\n'prepare_lock' mutex
  and the driver calls i2c_transfer() to update the client's\nchip registers, stalling
  for the adapter's I2C bus lock.\n\nConcurrently, an independent, parallel transfer
  on the same bus (e.g., a GPIO\nexpander handling LEDs) can hold the I2C adapter
  lock. Inside this parallel\ntransfer path, jz4780_i2c_set_speed() calls clk_get_rate()
  on the host\ncontroller's input clock to calculate bus timings. This call attempts
  to acquire\nthe blocked CCF 'prepare_lock', creating a circular dependency that
  freezes\nthe system.\n\nThe jz4780 host"
