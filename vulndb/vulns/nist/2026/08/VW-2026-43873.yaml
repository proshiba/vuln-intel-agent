title: The Paymob for WooCommerce WordPress plugin before 4.1.9 does not 
  properly sanitise a client-supplied identifier before using it in a SQL query 
  within its public, unauthenticated payment callback, and performs this query 
  before verifying the payment provider's HMAC signature. This allows 
  unauthenticated attackers to perform SQL injection and read arbitrary data 
  from the database — including user credentials and other secrets — through 
  both in-band (reflected) and time-based blind extraction.
