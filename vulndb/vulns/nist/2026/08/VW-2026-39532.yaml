title: VikAppointments Service Booking Calendar wordpress plugin is vulnerable 
  to unauthenticated SQL injection due to one of the parameters that controls 
  how the public reviews list is sorted is taken from the incoming request and 
  used to build a database query without proper validation or sanitization. 
  Because this value is placed directly into the query, an attacker who is not 
  logged in can inject arbitrary SQL through a normal booking page and read data
  from the site's database — including sensitive information such as WordPress 
  user credentials. No authentication or special privileges are required
