title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: topology: fix memory leak in snd_sof_load_topology\n\nWhen the topology filename
  contains \"dummy\" and tplg_cnt is 0, the\nfunction returns -EINVAL directly without
  freeing the tplg_files\nallocated by kcalloc() at line 2497. This leaks memory on
  every\nsuch topology load attempt.\n\nFix this by setting ret = -EINVAL and jumping
  to the out: label,\nwhich already handles the kfree(tplg_files) cleanup."
