title: Grav is a file-based Web platform. Prior to 2.0.1, Grav 
  ZipArchiver::extract() in system/src/Grav/Common/Filesystem/ZipArchiver.php 
  passes archives to ZipArchive::extractTo() without enforcing the 
  system.gpm.archive uncompressed-size, file-count, or nesting-depth limits. 
  Code using Archiver::create('zip') to extract an attacker-controlled archive 
  can exhaust disk space or inodes and make the site unavailable. This issue is 
  fixed in version 2.0.1.
