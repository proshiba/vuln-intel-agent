title: WAPT Server versions 2.6.1.17834 and earlier contains a SQL injection 
  vulnerability in the `columns` parameter of the GET `/api/v3/hosts` endpoint. 
  A remote authenticated user with read-only privileges can inject arbitrary 
  PostgreSQL expressions into the SQL query constructed by WAPT. By exploiting 
  the injection point, an attacker can inject additional PostgreSQL statements, 
  bypass the host scope restrictions applied to the account, and read 
  information from other rows or tables within the database.
