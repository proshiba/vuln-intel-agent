title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/dp_mst:
  Handle torn-down topology gracefully in drm_dp_mst_topology_queue_probe()\n\nA hotplug
  or link-loss event can tear down the MST topology\n(setting mgr->mst_state = false
  and mgr->mst_primary = NULL) concurrently\nwith a caller invoking drm_dp_mst_topology_queue_probe().
  Since the check\nis already performed under mgr->lock, the condition is not a programming\n\
  error but a valid race -- the topology was valid when the caller decided\nto call
  this function, but was torn down before the lock was acquired.\n\nReplace the drm_WARN_ON()
  with a graceful early return. This eliminates\nspurious kernel warnings and the
  resulting compositor crashes observed\nwhen connecting/disconnecting DP MST monitors,
  while keeping the correct\nbehavior of doing nothing when MST is not active. A drm_dbg_mst()
  trace\nis added so the skipped probe remains observable under MST debug logging.\n\
