title: A vulnerability was found in TanStack devtools-vite 0.7.0. Affected by 
  this issue is the function installPackage of the file 
  packages/devtools-bundler-core/src/package-manager.ts of the component 
  Development Devtools Event Bus. The manipulation of the argument packageName 
  results in os command injection. Attacking locally is a requirement. A high 
  complexity level is associated with this attack. The exploitation is known to 
  be difficult. The exploit has been made public and could be used. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
