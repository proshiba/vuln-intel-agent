title: "In the Linux kernel, the following vulnerability has been resolved:\n\nremoteproc:
  qcom: Fix leak when custom dump_segments addition fails\n\nFree allocated minidump_region
  'name' in qcom_add_minidump_segments()\nwhen failing before adding the region to
  'dump_segments'. Otherwise,\nthe 'name' is not tracked and is never freed by qcom_minidump_cleanup().\n\
  \nReturn error when adding to 'dump_segments' fails."
