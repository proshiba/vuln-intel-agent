title: SiYuan versions before v3.7.4 fail to mask sensitive configuration fields
  in the /api/system/getConf endpoint, allowing anonymous or publish-reader 
  users to obtain the session-cookie signing key, OS username via pandoc path, 
  and encrypted-notebook key material. Attackers can forge and tamper with 
  session cookies to impersonate users, and on instances without access-auth 
  codes configured, escalate to administrator privileges.
