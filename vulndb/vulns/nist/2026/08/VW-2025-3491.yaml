title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm:
  use try_get_ops() in tpm-space.c\n\nAs part of the series conversion to remove nested
  TPM operations:\n\nhttps://lore.kernel.org/all/20190205224723.19671-1-jarkko.sakkinen@linux.intel.com/\n\
  \nexposure of the chip->tpm_mutex was removed from much of the upper\nlevel code.\
  \  In this conversion, tpm2_del_space() was missed.  This\ndidn't matter much because
  it's usually called closely after a\nconverted operation, so there's only a very
  tiny race window where the\nchip can be removed before the space flushing is done
  which causes a\nNULL deref on the mutex.  However, there are reports of this window\n\
  being hit in practice, so fix this by converting tpm2_del_space() to\nuse tpm_try_get_ops(),
  which performs all the teardown checks before\nacquring the mutex."
