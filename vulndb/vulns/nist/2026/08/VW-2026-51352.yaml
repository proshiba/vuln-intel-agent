title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - only expose sysfs attributes on control interface\n\nWhen the driver was
  converted to use the driver core to instantiate device\nattributes (via .dev_groups
  in the usb_driver structure), the attributes\nstarted appearing on all interfaces
  bound to the driver. Since the ims-pcu\ndriver manually claims the secondary data
  interface during probe, the\ndriver core automatically creates the sysfs attributes
  for that interface\nas well.\n\nHowever, the driver only supports these attributes
  on the primary control\ninterface. Data interfaces lack the necessary descriptors
  and internal\nstate to handle these requests, and accessing them can lead to unexpected\n\
  behavior or crashes.\n\nFix this by updating the is_visible() callbacks for both
  the main and OFN\nattribute groups to verify that the interface being accessed is
  indeed the\ncontrol interface."
