title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  at76c50x-usb: avoid length underflow in at76_guess_freq()\n\nat76_guess_freq() checks
  only that the received frame is at least a bare\n802.11 header (24 bytes) before
  subtracting the fixed management-body\noffset:\n\n\tlen -= el_off;\n\nFor both beacon
  and probe response frames, el_off is 36. If the frame is\nshorter than el_off, subtracting
  it causes the calculated IE length to\nwrap. The length is eventually passed to
  cfg80211_find_elem_match() as a\nvery large unsigned value, so the element walk
  runs beyond the RX skb.\n\nThis path is reached from at76_rx_tasklet() while scanning.
  If the device\ndelivers a truncated beacon or probe response, the oversized IE length\n\
  causes an out-of-bounds read during scanning.\n\nSkip the IE lookup if the frame
  does not reach the variable elements,\nbefore subtracting el_off."
