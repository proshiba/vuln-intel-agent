title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  require net admin for TIPCv2 netlink mutators\n\nTIPCv2 registers mutating generic-netlink
  operations without admin\npermission flags. Generic netlink only checks CAP_NET_ADMIN
  when an\noperation sets GENL_ADMIN_PERM or GENL_UNS_ADMIN_PERM, so a local\nunprivileged
  process can currently change TIPC state through commands\nsuch as TIPC_NL_NET_SET,
  TIPC_NL_KEY_SET, TIPC_NL_KEY_FLUSH, and\nbearer enable/disable.\n\nThe legacy TIPC
  netlink API already checks netlink_net_capable(...,\nCAP_NET_ADMIN) for administrative
  commands. Give the TIPCv2 mutators\nthe equivalent generic-netlink gate. Use GENL_UNS_ADMIN_PERM,
  which\nmaps to the same namespace-aware CAP_NET_ADMIN check that\nnetlink_net_capable()
  performs, so the behaviour matches the legacy\npath and keeps working for CAP_NET_ADMIN
  holders in a non-initial user\nnamespace (containers).\n\nA QEMU/KASAN repro run
  as uid/gid 65534 with zero effective\ncapabilities previously succeed"
