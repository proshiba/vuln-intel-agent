title: A flaw was found in Data Science Pipelines (DSP). An attacker with 
  namespace editor privileges can bypass security hardening by submitting a 
  malicious Argo Workflow through the V1 API path. This allows the API server to
  create pods with elevated privileges, acting as a 'confused deputy' on behalf 
  of the attacker. Successful exploitation grants the attacker node-root access,
  enabling arbitrary code execution and full control over the underlying node.
