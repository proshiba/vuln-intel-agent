title: "Improper Neutralization of Input During Web Page Generation (XSS) vulnerability
  in lud oaskit allows reflected cross-site scripting via the default HTML error handler.\n\
  \nOaskit.ErrorHandler.Default.format_reason/4 and Oaskit.ErrorHandler.Default.reason_to_html/1
  in lib/oaskit/error_handler/default.ex render request-validation failures as an
  HTML page whenever the request's Accept header contains html, interpolating request-controlled
  strings into that page without HTML escaping. The unescaped values are object keys
  taken from a request body or from an object or deepObject query parameter, which
  appear in the JSON Schema error's instance path when a schema rejects them (for
  example under additionalProperties: false), and the raw Content-Type header, reflected
  in unsupported-media-type errors when it fails to parse.\n\nBecause browsers send
  Accept: text/html on ordinary top-level navigation, a crafted GET link is sufficient
  to trigger the error page; no form submission, custom Content-Type,"
