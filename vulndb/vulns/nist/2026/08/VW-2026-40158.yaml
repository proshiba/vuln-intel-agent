title: A security vulnerability has been detected in MonomythDevelopment 
  la-forge-mcp 1.0.0. This issue affects the function screenshotElement of the 
  file src/index.ts of the component screenshot_element Tool. Such manipulation 
  of the argument output_name leads to path traversal. The attack can be 
  executed remotely. Upgrading to version 1.1.1 is capable of addressing this 
  issue. The name of the patch is 1102172c9adec4a619e241efd6bfb74f5b1f4332. 
  Upgrading the affected component is advised. The vendor was contacted early, 
  responded in a very professional manner and quickly released a fixed version 
  of the affected product.
