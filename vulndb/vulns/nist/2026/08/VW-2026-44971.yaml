title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: lock sk in iso_connect_ind\n\nAccessing iso_pi(sk)->conn requires lock_sock,
  which is not taken in the\n\"ev3\" part of iso_connect_ind.  It may also be NULL
  if socket has\ntransitioned away from the LISTEN/CONNECT states before locking.\n\
  \nFix by adding lock/release. Recheck hcon is valid after lock acquire\nwhere needed."
