title: "Issue summary: The OpenSSL Certificate Management Protocol (CMP) caches\n\
  additional certificates (extraCerts) sent in a CMP message, but never expunges\n\
  them (for instance if they are invalid).  If a server reuses an OSSL_CMP_CTX\nfrequently,
  this cache of extraCerts may grow unboundedly, and a malicious\nclient may flood
  a CMP server with requests driving this growth.\n\nImpact summary: Users utilizing
  a CMP server that reuses a single OSSL_CMP_CTX\nfor the lifetime of a server process
  may observe unbounded memory growth in the\nevent a malicious client repeatedly
  sends requests containing unique extra\ncertificates, which may lead to OOM conditions.\n\
  \nCWE: CWE-770: Allocation of Resources Without Limits or Throttling\n\nDescription:
  If a remote user sends CMP messages to a server with a list of\nextraCerts and the
  message is rejected, the extraCerts from the message remains\nin the server contexts
  untrusted certificate stack.  This exposes servers with\nlong lived ctx objects
  to Denial of Service a"
