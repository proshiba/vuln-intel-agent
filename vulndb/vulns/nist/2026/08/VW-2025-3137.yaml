title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix \"kernel NULL pointer dereference\" error\n\nWhen rxe_queue_init in the function
  rxe_qp_init_req fails,\nboth qp->req.task.func and qp->req.task.arg are not initialized.\n\
  \nBecause of creation of qp fails, the function rxe_create_qp will\ncall rxe_qp_do_cleanup
  to handle allocated resource.\n\nBefore calling __rxe_do_task, both qp->req.task.func
  and\nqp->req.task.arg should be checked."
