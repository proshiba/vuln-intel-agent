title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btnxpuart: Fix random crash seen while removing driver\n\nThis fixes the random
  kernel crash seen while removing the driver, when\nrunning the load/unload test
  over multiple iterations.\n\n1) modprobe btnxpuart\n2) hciconfig hci0 reset\n3)
  hciconfig (check hci0 interface up with valid BD address)\n4) modprobe -r btnxpuart\n\
  Repeat steps 1 to 4\n\nThe ps_wakeup() call in btnxpuart_close() schedules the psdata->work(),\n\
  which gets scheduled after module is removed, causing a kernel crash.\n\nThis hidden
  issue got highlighted after enabling Power Save by default\nin 4183a7be7700 (Bluetooth:
  btnxpuart: Enable Power Save feature on\nstartup)\n\nThe new ps_cleanup() deasserts
  UART break immediately while closing\nserdev device, cancels any scheduled ps_work
  and destroys the ps_lock\nmutex.\n\n[   85.884604] Unable to handle kernel paging
  request at virtual address ffffd4a61638f258\n[   85.884624] Mem abort info:\n[ \
  \  85.884625]   ESR = 0"
