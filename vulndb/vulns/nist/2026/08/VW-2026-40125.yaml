title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  VMX: Grab vmcs12 on CR8 interception update iff vCPU is in guest mode\n\nWhen updating
  CR8 intercepts, get vmcs12 if and only if the vCPU is in\nguest mode so that a future
  change can have update CR8 intercepts during\nvCPU creation, without running afoul
  of get_vmcs12()'s lockdep assertion.\n\n  ------------[ cut here ]------------\n\
