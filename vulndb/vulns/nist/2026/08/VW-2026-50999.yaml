title: Volmarg Personal Management System contains a path traversal 
  vulnerability that allows authenticated attackers to read arbitrary files by 
  supplying absolute filesystem paths to the GET /public/get-file/{path} 
  endpoint. The path route parameter is passed directly to file_get_contents() 
  without canonicalization against a permitted base directory, enabling 
  attackers to retrieve sensitive files accessible to the PHP-FPM worker process
  without using directory traversal sequences.
