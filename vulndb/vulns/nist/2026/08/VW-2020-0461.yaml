title: "An elevation of privilege vulnerability exists in Microsoft Edge (Chromium-based)
  when the Feedback extension improperly validates input. An attacker who successfully
  exploited this vulnerability could write files to arbitrary locations and gain elevated
  privileges.\nThe vulnerability by itself does not allow arbitrary code to run. However,
  this vulnerability could be used in conjunction with one or more vulnerabilities
  (for example a remote code execution vulnerability and another elevation of privilege
  vulnerability) to take advantage of the elevated privileges when running.\nThe security
  update addresses the vulnerability by modifying how Microsoft Edge (Chromium-based)
  Feedback extension validates files."
