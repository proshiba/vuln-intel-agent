title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btrtl: validate firmware patch bounds\n\nrtlbt_parse_firmware() copies patch_length
  - 4 bytes before appending the\nfirmware version. A malformed firmware patch shorter
  than the version field\ncan make this subtraction underflow and turn the copy into
  an oversized\nread and write during Bluetooth setup.\n\nThe existing patch_offset
  + patch_length check can also wrap on 32-bit\narchitectures. Validate the patch
  length and range without arithmetic\noverflow before allocating or copying the patch."
