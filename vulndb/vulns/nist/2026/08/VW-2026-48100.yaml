title: "Allocation of Resources Without Limits or Throttling vulnerability in mtrudel
  bandit allows an unauthenticated remote attacker to pin an unbounded number of HTTP/2
  stream processes indefinitely via connection-level flow control. When a stream's
  response body outruns the HTTP/2 connection-level send window (default 65,535 bytes,
  shared across all streams on the connection), Bandit.HTTP2.Connection queues the
  remaining bytes and a reply closure in pending_sends and the stream process blocks
  forever inside a synchronous call to the connection process. Nothing bounds that
  wait and nothing purges the queue: a client RST_STREAM for the blocked stream is
  delivered to its mailbox but never read while it is stuck inside the call, so cancelling
  frees nothing, and periodic PING frames keep the transport-level read timeout from
  ever firing. The equivalent block on the stream-level send window is already bounded
