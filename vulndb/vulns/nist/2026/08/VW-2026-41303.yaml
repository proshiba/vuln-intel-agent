title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gpusvm:
  Fix MM reference leak in drm_gpusvm_range_evict\n\nIf kvmalloc_array() fails in
  drm_gpusvm_range_evict(), the MM\nreference acquired earlier is not released, resulting
  in a reference\nleak.\n\nFix this by dropping the MM reference on the kvmalloc_array()\n\
  failure path."
