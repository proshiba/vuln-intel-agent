title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: oss: Fix UAF at handling events with embedded SysEx data\n\nThe OSS sequencer
  processes the input MIDI bytes into a sequencer\nevent to be dispatched later (in
  snd_seq_oss_midi_putc() called from\nsnd_seq_oss_process_event()).  When it's a
  SysEx data, the event\nrecord contains data.ext.ptr pointer to the original SysEx
  bytes, and\nthe referred data is copied into the pool afterwards at dispatching.\n\
  The problem is that, if the sequencer port gets closed concurrently\nbefore the
  dispatch, the OSS sequencer core also releases the\nresources (in snd_seq_oss_midi_check_exit_port()),
  while the pending\nevent may hold a stale pointer, eventually leading to a UAF at
  a later\ndispatch.\n\nFortunately, there is already a refcounting mechanism (snd_use_lock_t)\n\
  for the OSS MIDI device access, and for addressing the issue above, we\njust need
  to extend the refcount until the event gets dispatched.\n\nThis patch extends snd_seq_oss_pr"
