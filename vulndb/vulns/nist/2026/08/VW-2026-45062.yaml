title: A vulnerability was found in OpenBoxes up to 0.9.7. The impacted element 
  is the function Upload of the file 
  grails-app/controllers/org/pih/warehouse/product/ProductController.groovy of 
  the component Product Upload Endpoint. Performing a manipulation of the 
  argument params.url results in server-side request forgery. The attack is 
  possible to be carried out remotely. The exploit has been made public and 
  could be used. Upgrading to version 0.9.8-hotfix1 and 0.9.8 is sufficient to 
  resolve this issue. The patch is named 
  a599007325efe780a21b3537ecce3ca25635c926. It is suggested to upgrade the 
  affected component.
