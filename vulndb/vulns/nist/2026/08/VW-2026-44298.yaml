title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-rdma:
  handle inline data with a nonzero offset\n\nnvmet_rdma_use_inline_sg() maps the
  host-controlled inline data offset\ninto the per-command inline scatterlist.  The
  bounds check admits any\noffset with off + len <= inline_data_size, but the mapping
  still assumes\nthe data begins in the first inline page:\n\n\tsg->offset = off;\n\
  \tsg->length = min_t(int, len, PAGE_SIZE - off);\n\nWhen a port is configured with
  inline_data_size > PAGE_SIZE (settable up\nto max(SZ_16K, PAGE_SIZE)), an offset
  in (PAGE_SIZE, inline_data_size]\nmakes \"PAGE_SIZE - off\" underflow, so sg->length
  is set to ~4 GiB and\nthe block backend reads far past the first inline page.  num_pages(len)\n\
  also ignores the offset, so an in-bounds offset whose [off, off+len)\nspan crosses
  a page boundary under-counts the scatterlist.\n\nMap the offset properly: split
  it into a page index and an in-page\noffset, start the scatterlist at that page,
