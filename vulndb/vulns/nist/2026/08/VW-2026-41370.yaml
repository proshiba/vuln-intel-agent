title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvmxnet3:
  fix BUG_ON in vmxnet3_get_hdr_len() for Geneve packets\n\nvmxnet3_get_hdr_len()
  assumes gdesc->rcd.v4/v6/tcp always describe the\nouter header, but for a Geneve-encapsulated
  packet the device can set\nthem based on the inner header instead, signalled by
  the\nVMXNET3_RCD_HDR_INNER_SHIFT bit in the completion descriptor. Since the\nfunction
  never skips the outer encapsulation, this mismatch triggers:\n\n- BUG_ON(hdr.ipv4->protocol
  != IPPROTO_TCP), because the outer\n  protocol is UDP (Geneve), not TCP.\n- BUG_ON(hdr.eth->h_proto
  != ...), when the tunnel's outer and inner\n  IP versions differ (e.g. outer IPv6/inner
  IPv4 or vice versa).\n\nCheck VMXNET3_RCD_HDR_INNER_SHIFT up front and bail out,
  since the\nfunction cannot locate the inner header it would need to parse. Also\n\
  convert the remaining BUG_ON()s in this function to return 0\ndefensively."
