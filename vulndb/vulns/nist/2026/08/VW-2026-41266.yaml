title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7615: drop TXRX_NOTIFY on non-mmio buses\n\nPKT_TYPE_TXRX_NOTIFY is an mmio-only
  event, but mt7615_rx_check() and\nmt7615_queue_rx_skb() dispatch it to mt7615_mac_tx_free()
  on every bus.\nmt7615_mac_tx_free() cleans the DMA tx queues with\nmt76_queue_tx_cleanup(),
  which calls queue_ops->tx_cleanup(). Only the\nmmio queue ops implement that callback;
  on the mt7663 USB and SDIO\nbuses it is NULL, so a TXRX_NOTIFY there calls a NULL
  pointer in the RX\nworker. Same defect as the mt7921 and mt7925 patches in this
  series.\n\nDrop the event on non-mmio buses via mt76_is_mmio(), as in\ncommit 5683e1488aa9
  (\"wifi: mt76: connac: do not check WED status for\nnon-mmio devices\")."
