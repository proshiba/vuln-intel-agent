title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvt:
  stabilize tty reference in kbd_keycode with tty_port_tty_get\n\nkbd_keycode() reads
  vc->port.tty without acquiring a tty reference,\nracing against con_shutdown() which
  clears port.tty under a different\nlock. Use tty_port_tty_get()/tty_kref_put() to
  hold a proper reference\nfor the duration the tty pointer is needed."
