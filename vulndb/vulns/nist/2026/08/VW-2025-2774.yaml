title: "In the Linux kernel, the following vulnerability has been resolved:\n\nslab:
  ensure slab->obj_exts is clear in a newly allocated slab page\n\nktest recently
  reported crashes while running several buffered io tests\nwith __alloc_tagging_slab_alloc_hook()
  at the top of the crash call stack.\nThe signature indicates an invalid address
  dereference with low bits of\nslab->obj_exts being set. The bits were outside of
  the range used by\npage_memcg_data_flags and objext_flags and hence were not masked
  out\nby slab_obj_exts() when obtaining the pointer stored in slab->obj_exts.\nThe
  typical crash log looks like this:\n\n00510 Unable to handle kernel NULL pointer
  dereference at virtual address 0000000000000010\n00510 Mem abort info:\n00510  \
  \ ESR = 0x0000000096000045\n00510   EC = 0x25: DABT (current EL), IL = 32 bits\n\
  00510   SET = 0, FnV = 0\n00510   EA = 0, S1PTW = 0\n00510   FSC = 0x05: level 1
  translation fault\n00510 Data abort info:\n00510   ISV = 0, ISS = 0x00000045, ISS2
  = 0x00000000\n00510   CM = 0, WnR = 1"
