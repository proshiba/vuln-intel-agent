title: Heap buffer overflow in PostgreSQL pg_dump of long function transform 
  lists allows an object creator to execute arbitrary code as the operating 
  system user running pg_dump, via a crafted transform list.  Versions before 
  PostgreSQL 18.5, 17.11, 16.15, 15.19, and 14.24 are affected.
