title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix the pre-flush when appending to a file in writethrough mode\n\nIn netfs_perform_write(),
  when the file is marked NETFS_ICTX_WRITETHROUGH\nor O_*SYNC or RWF_*SYNC was specified,
  write-through caching is performed\non a buffered file.  When setting up for write-through,
  we flush any\nconflicting writes in the region and wait for the write to complete,\n\
  failing if there's a write error to return.\n\nThe issue arises if we're writing
  at or above the EOF position because we\nskip the flush and - more importantly -
  the wait.  This becomes a problem\nif there's a partial folio at the end of the
  file that is being written out\nand we want to make a write to it too.  Both the
  already-running write and\nthe write we start both want to clear the writeback mark,
  but whoever is\nsecond causes a warning looking something like:\n\n    ------------[
  cut here ]------------\n    R=00000012: folio 11 is not under writeback\n    WARNING:
  CPU: "
