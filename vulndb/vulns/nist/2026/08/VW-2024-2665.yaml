title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix crash when unbinding\n\nIf there is an error during some initialization
  related to firmware,\nthe function ath12k_dp_cc_cleanup is called to release resources.\n\
  However this is released again when the device is unbinded (ath12k_pci),\nand we
  get:\nBUG: kernel NULL pointer dereference, address: 0000000000000020\nat RIP: 0010:ath12k_dp_cc_cleanup.part.0+0xb6/0x500
  [ath12k]\nCall Trace:\nath12k_dp_cc_cleanup\nath12k_dp_free\nath12k_core_deinit\n\
  ath12k_pci_remove\n...\n\nThe issue is always reproducible from a VM because the
  MSI addressing\ninitialization is failing.\n\nIn order to fix the issue, just set
  to NULL the released structure in\nath12k_dp_cc_cleanup at the end."
