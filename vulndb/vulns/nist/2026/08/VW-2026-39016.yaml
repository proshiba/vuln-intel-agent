title: A vulnerability was detected in GL.iNet GL-MT3000 up to 4.4.5. The 
  affected element is the function logread.get_system_log of the file 
  /usr/lib/oui-httpd/rpc/logread of the component Logread Lua RPC plugin. The 
  manipulation of the argument module results in command injection. The attack 
  can be launched remotely. The exploit is now public and may be used. The 
  vendor was contacted early about this disclosure and confirmed the existence 
  of the vulnerability.
