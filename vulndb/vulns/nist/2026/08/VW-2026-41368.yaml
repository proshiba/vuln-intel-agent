title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix u16 MTU truncation in media and bearer MTU validation\n\nBoth TIPC_NL_MEDIA_SET
  and TIPC_NL_BEARER_SET accept user-supplied\nMTU values but only enforce a minimum
  bound, not a maximum. When a user\nsets the MTU to a value exceeding U16_MAX (65535),
  it passes validation\nbut is silently truncated when assigned to u16 fields l->mtu
  and\nl->advertised_mtu in tipc_link_create(). Values like 65536 (0x10000)\ntruncate
  to 0, causing a division by zero in tipc_link_set_queue_limits()\nwhich computes
  TIPC_MAX_PUBL / (l->mtu / ITEM_SIZE). Other overflowing\nvalues (e.g. 65537-131071)
  produce small incorrect MTU values, resulting\nin link malfunction behaviors.\n\n\
  Crash stack (triggered as unprivileged user via user namespace):\n\n  tipc_link_set_queue_limits\
  \  net/tipc/link.c:2531\n  tipc_link_create            net/tipc/link.c:520\n  tipc_node_check_dest\
  \        net/tipc/node.c:1279\n  tipc_disc_rcv               net/tipc/discover.c:252"
