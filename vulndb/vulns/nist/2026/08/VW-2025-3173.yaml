title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  Fix possible use-after-free in async command interface\n\nmlx5_cmd_cleanup_async_ctx
  should return only after all its callback\nhandlers were completed. Before this
  patch, the below race between\nmlx5_cmd_cleanup_async_ctx and mlx5_cmd_exec_cb_handler
  was possible and\nlead to a use-after-free:\n\n1. mlx5_cmd_cleanup_async_ctx is
  called while num_inflight is 2 (i.e.\n   elevated by 1, a single inflight callback).\n\
  2. mlx5_cmd_cleanup_async_ctx decreases num_inflight to 1.\n3. mlx5_cmd_exec_cb_handler
  is called, decreases num_inflight to 0 and\n   is about to call wake_up().\n4. mlx5_cmd_cleanup_async_ctx
  calls wait_event, which returns\n   immediately as the condition (num_inflight ==
  0) holds.\n5. mlx5_cmd_cleanup_async_ctx returns.\n6. The caller of mlx5_cmd_cleanup_async_ctx
  frees the mlx5_async_ctx\n   object.\n7. mlx5_cmd_exec_cb_handler goes on and calls
  wake_up() on the freed\n   object.\n\nFix it by syncing using a comp"
