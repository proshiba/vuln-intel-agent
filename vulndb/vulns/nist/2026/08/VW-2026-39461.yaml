title: A vulnerability was identified in Baserow up to 2.3.2. Affected by this 
  vulnerability is the function verify of the file 
  backend/src/baserow/api/two_factor_auth/views.py of the component 2FA Verify 
  Endpoint. Such manipulation leads to improper authentication. The attack may 
  be launched remotely. This attack is characterized by high complexity. The 
  exploitation appears to be difficult. Upgrading to version 2.3.3 addresses 
  this issue. You should upgrade the affected component. The vendor was 
  contacted early, responded in a very professional manner and quickly released 
  a fixed version of the affected product.
