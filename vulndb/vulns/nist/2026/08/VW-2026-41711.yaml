title: Firecrawl turns entire websites into LLM-ready markdown or structured 
  data. Prior to 2.11.32, a critical arbitrary file read vulnerability exists in
  Firecrawl's extraction functionality due to unsafe schema dereferencing of 
  user-supplied JSON schemas in 
  apps/api/src/lib/extract/helpers/dereference-schema.ts. The affected code 
  invokes the json-schema-ref-parser dependency with default resolver settings, 
  allowing external and local file references to be resolved during schema 
  processing. An authenticated attacker can supply a malicious schema containing
  a $ref within default, const, or enum fields that are not traversed by AJV 
  validation. By triggering a dereference error, file contents from the extract 
  worker filesystem may be included in persisted error messages returned through
  the extraction API, enabling arbitrary file reads and SSRF against internal or
  external HTTP endpoints. This issue is fixed in version 2.11.32.
