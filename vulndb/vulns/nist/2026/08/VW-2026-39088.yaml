title: "A cryptographic\nweakness exists in the Omada adoption protocol where session
  encryption keys\nused to protect communications between controllers and managed
  devices may be\npredictable due to insufficient entropy in session key generation.\n\
  \n\n\n\n\n\n\n\n\nAn attacker\nwho successfully intercepts adoption-related communications
  may be able to recover\nsession encryption keys and decrypt affected communications."
