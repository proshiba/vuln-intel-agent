title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tls:
  Consume empty data records in tls_sw_read_sock()\n\nA peer may send a zero-length
  TLS application_data record; TLS 1.3\nexplicitly permits these as a traffic-analysis
  countermeasure (RFC\n8446, Section 5.1). After decryption such a record has full_len
  ==\n0. tls_sw_read_sock() hands it to the read_actor, which has no\npayload to consume
  and returns zero. The loop treats a zero return\nas backpressure (used <= 0), requeues
  the skb at the head of\nrx_list, and stops. rx_list is serviced head-first on the
  next\ncall, so the empty record is dequeued, fails the same way, and is\nrequeued
  again; every later record on the connection is blocked\nbehind it.\n\ntls_sw_recvmsg()
  does not stall on this: a zero-length data record\ncopies nothing and falls through
  to consume_skb(). Mirror that in\nthe read_sock() path by recognizing an empty data
  record before\nthe actor runs, consuming it, and continuing."
