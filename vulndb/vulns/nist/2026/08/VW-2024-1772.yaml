title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  bridge: replace physindev with physinif in nf_bridge_info\n\nAn skb can be added
  to a neigh->arp_queue while waiting for an arp\nreply. Where original skb's skb->dev
  can be different to neigh's\nneigh->dev. For instance in case of bridging dnated
  skb from one veth to\nanother, the skb would be added to a neigh->arp_queue of the
  bridge.\n\nAs skb->dev can be reset back to nf_bridge->physindev and used, and as\n\
  there is no explicit mechanism that prevents this physindev from been\nfreed under
  us (for instance neigh_flush_dev doesn't cleanup skbs from\ndifferent device's neigh
  queue) we can crash on e.g. this stack:\n\narp_process\n  neigh_update\n    skb
  = __skb_dequeue(&neigh->arp_queue)\n      neigh_resolve_output(..., skb)\n     \
  \   ...\n          br_nf_dev_xmit\n            br_nf_pre_routing_finish_bridge_slow\n\
  \              skb->dev = nf_bridge->physindev\n              br_handle_frame_finish\n\
  \nLet's use plain ifindex instead"
