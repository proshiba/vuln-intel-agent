title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/dasd:
  fix error recovery leading to data corruption on ESE devices\n\nExtent Space Efficient
  (ESE) or thin provisioned volumes need to be\nformatted on demand during usual IO
  processing.\n\nThe dasd_ese_needs_format function checks for error codes that signal\n\
  the non existence of a proper track format.\n\nThe check for incorrect length is
  to imprecise since other error cases\nleading to transport of insufficient data
  also have this flag set.\nThis might lead to data corruption in certain error cases
  for example\nduring a storage server warmstart.\n\nFix by removing the check for
  incorrect length and replacing by\nexplicitly checking for invalid track format
  in transport mode.\n\nAlso remove the check for file protected since this is not
  a valid\nESE handling case."
