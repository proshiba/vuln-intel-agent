title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: Do not return unused priv in mwifiex_get_priv_by_id()\n\nmwifiex_get_priv_by_id()
  returns the priv pointer corresponding to\nthe bss_num and bss_type, but without
  checking if the priv is actually\ncurrently in use.\nUnused priv pointers do not
  have a wiphy attached to them which can\nlead to NULL pointer dereferences further
  down the callstack.  Fix\nthis by returning only used priv pointers which have priv->bss_mode\n\
  set to something else than NL80211_IFTYPE_UNSPECIFIED.\n\nSaid NULL pointer dereference
  happened when an Accesspoint was started\nwith wpa_supplicant -i mlan0 with this
  config:\n\nnetwork={\n        ssid=\"somessid\"\n        mode=2\n        frequency=2412\n\
  \        key_mgmt=WPA-PSK WPA-PSK-SHA256\n        proto=RSN\n        group=CCMP\n\
  \        pairwise=CCMP\n        psk=\"12345678\"\n}\n\nWhen waiting for the AP to
  be established, interrupting wpa_supplicant\nwith <ctrl-c> and starting it again
  this happens:\n\n| Unable"
