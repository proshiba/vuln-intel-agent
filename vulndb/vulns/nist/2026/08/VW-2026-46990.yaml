title: A security vulnerability has been detected in xianrendzw EasyReport up to
  2.0.17.0522_Beta. The affected element is the function 
  DataSourceController.add of the file DataSourceController.java of the 
  component QueryerFactory. Such manipulation of the argument queryerClass leads
  to permission issues. The attack can be launched remotely. The exploit has 
  been disclosed publicly and may be used. The project was informed of the 
  problem early through an issue report but has not responded yet.
