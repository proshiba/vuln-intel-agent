title: "JsonKafkaHeaderMapper and DefaultKafkaHeaderMapper include java.net in their
  default trusted packages list. When these mappers are used — which is the default
  configuration for all @KafkaListener consumers — an external Kafka producer can
  inject a java.net.InetAddress type via the spring_json_header_types message header.\n\
  Spring for Apache Kafka 4.1.0\nSpring for Apache Kafka 4.0.0 - 4.0.6\nSpring for
  Apache Kafka 3.0.0 - 3.3.16\nSpring for Apache Kafka 2.9.0 - 2.9.14\nSpring for
  Apache Kafka 2.8.12 and earlier"
