title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/sev:
  Make enc_dec_hypercall() accept a size instead of npages\n\nenc_dec_hypercall()
  accepted a page count instead of a size, which\nforced its callers to round up.
  As a result, non-page aligned\nvaddrs caused pages to be spuriously marked as decrypted
  via the\nencryption status hypercall, which in turn caused consistent\ncorruption
  of pages during live migration. Live migration requires\naccurate encryption status
  information to avoid migrating pages\nfrom the wrong perspective."
