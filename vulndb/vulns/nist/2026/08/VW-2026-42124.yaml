title: Tesseract is an open source OCR engine. Prior to 5.5.3, a crafted 
  .traineddata LSTM model component loaded through Tesseract's deserializer can 
  cause an unchecked signed integer multiplication in Convolve::DeSerialize in 
  src/lstm/convolve.cpp to wrap the convolution output-channel count, 
  undersizing the forward-pass output buffer while writes use the unwrapped 
  element count and causing a heap out-of-bounds write during OCR recognition. 
  This issue is fixed in version 5.5.3.
