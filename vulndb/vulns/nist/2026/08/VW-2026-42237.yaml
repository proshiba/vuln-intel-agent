title: 'Protection mechanism failure for some Intel(R) Workload Services Framework
  software within Ring 3: User Applications may allow an escalation of privilege.
  Unprivileged software adversary with a privileged user combined with a low complexity
  attack may enable escalation of privilege. This result may potentially occur via
  local access when attack requirements are present without special internal knowledge
  and requires passive user interaction. The potential vulnerability may impact the
  confidentiality (high), integrity (high) and availability (high) of the vulnerable
  system, resulting in subsequent system confidentiality (none), integrity (none)
  and availability (none) impacts.'
