title: "In the Linux kernel, the following vulnerability has been resolved:\n\nliveupdate:
  Reference count incoming FLB data\n\nIncrement the incoming FLB refcount in liveupdate_flb_get_incoming()
  so\nthat the FLB structure cannot be freed while the caller is actively using\n\
  it. Add an additional liveupdate_flb_put_incoming() function so the\ncaller can
  explicitly indicate when it is done using the FLB data.\n\nDuring a Live Update,
  a subsystem might need to hold onto the incoming\nFile-Lifecycle-Bound (FLB) data
  for an extended period, such as during\ndevice enumeration. Incrementing the reference
  count guarantees that the\ndata remains valid and accessible until the subsystem
  releases it,\npreventing future use-after-free bugs."
