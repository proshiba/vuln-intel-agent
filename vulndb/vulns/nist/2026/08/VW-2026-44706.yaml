title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  fib: Don't dump dying fib_info in fib_leaf_notify().\n\nsyzbot reported use-after-free
  in nsim_fib4_prepare_event(). [0]\n\nThe problem is that the following functions
  call fib_info_hold() /\nrefcount_inc() while dumping fib_info under RCU, which is
  unsafe.\n\n  * mlxsw_sp_router_fib4_event()\n  * rocker_router_fib_event()\n  *
  nsim_fib4_prepare_event()\n\nrefcount_inc_not_zero() must be used, but it would
  be too late\nthere.\n\nLet's guarantee the lifetime of fib_info in fib_leaf_notify().\n\
  \nNote that IPv6 does not need the corresponding change since\nfib6_table_dump()
  holds fib6_table.tb6_lock.\n\n[0]:\nrefcount_t: addition on 0; use-after-free.\n\
  WARNING: lib/refcount.c:25 at refcount_warn_saturate+0x9f/0x110 lib/refcount.c:25,
  CPU#0: kworker/u8:15/3420\nModules linked in:\nCPU: 0 UID: 0 PID: 3420 Comm: kworker/u8:15
  Not tainted syzkaller #0 PREEMPT_{RT,(full)}\nHardware name: Google Google Compute
  Engine/Google Compute Engine, BIOS"
