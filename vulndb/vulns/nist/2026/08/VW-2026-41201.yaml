title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  defer destroy_previous_session() until after NTLM authentication\n\nIn ntlm_authenticate(),
  destroy_previous_session() is called using a\nuser pointer resolved from the client-supplied
  NTLM blob username field\nbefore the NTLMv2 response is validated. An authenticated
  attacker can\nset the NTLM blob username to match a victim account and set\nPreviousSessionId
  to the victim's session ID; destroy_previous_session()\ndestroys the victim's session
  while ksmbd_decode_ntlmssp_auth_blob()\nsubsequently rejects the request with -EPERM.\n\
  \nMove destroy_previous_session() and the prev_id assignment to after\nksmbd_decode_ntlmssp_auth_blob()
  returns success and use sess->user\nrather than the pre-authentication lookup result.
  This matches the\nordering already used by krb5_authenticate(), where\ndestroy_previous_session()
  is called only after\nksmbd_krb5_authenticate() returns success."
