title: An authenticated user with permission to create or edit alert rules can 
  bypass datasource query authorization by marking an alert rule query as a 
  server-side expression while referencing a real datasource UID (incorrect 
  authorization). This can expose data accessible through Grafana's configured 
  datasource credentials to users who lack permission to query that datasource.
