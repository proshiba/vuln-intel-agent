title: "A JEXL expression sandbox bypass exists in multiple versions of OpenNMS Meridian
  and Horizon. A low-privileged authenticated user can submit a crafted expression
  to the Measurements REST API that escapes the sandbox and loads arbitrary Java classes
  on the server. This can potentially allow an attacker to gain access to confidential
  information and compromise integrity.\n\nThe solution is to upgrade to Meridian
  2024.3.12, 2025.0.9 and Horizon 36.0.3 or newer. Meridian and Horizon installation
  instructions state that they are intended for installation within an organization's
  private networks and should not be directly accessible from the Internet."
