title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-buf/udmabuf:
  skip redundant cpu sync to fix cacheline EEXIST warning\n\nWhen CONFIG_DMA_API_DEBUG_SG
  is enabled, importing a udmabuf into a DRM\ndriver (e.g. amdgpu for video playback
  in GNOME Videos / Showtime)\ntriggers a spurious warning:\n\n  DMA-API: amdgpu 0000:03:00.0:
  cacheline tracking EEXIST, \\\n      overlapping mappings aren't supported\n  WARNING:
  kernel/dma/debug.c:619 at add_dma_entry+0x473/0x5f0\n\nThe call chain is:\n\n  amdgpu_cs_ioctl\n\
  \   -> amdgpu_ttm_backend_bind\n    -> dma_buf_map_attachment\n     -> [udmabuf]
  map_udmabuf -> get_sg_table\n      -> dma_map_sgtable(dev, sg, direction, 0)  //
  attrs=0\n       -> debug_dma_map_sg -> add_dma_entry -> EEXIST\n\nThis happens because
  udmabuf builds a per-page scatter-gather list via\nsg_set_folio().  When begin_cpu_udmabuf()
  has already created an sg\ntable mapped for the misc device, and an importer such
  as amdgpu maps\nthe same pages for its own device via map_udmabuf()"
