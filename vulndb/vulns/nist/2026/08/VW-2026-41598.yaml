title: Dokploy is a free, self-hostable Platform as a Service (PaaS). In 0.29.8 
  and earlier, backup.create, backup.update, and backup.restoreBackupWithLogs in
  apps/dokploy/server/api/routers/backup.ts accept a client-controlled 
  destinationId and use the referenced destination without verifying that 
  destination.organizationId equals ctx.session.activeOrganizationId. An 
  authenticated member with backup permissions for a service in one organization
  can cause another organization's S3 accessKey and secretAccessKey to be 
  materialized by packages/server/src/utils/backups/utils.ts getS3Credentials on
  the attacker's service host, read that organization's backup objects, or 
  redirect and poison backups across tenant boundaries.
