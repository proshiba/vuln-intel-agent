title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregcache:
  Do not overwrite error code when finalizing cache after error\n\nDuring regcache
  initialization, if an error occurs in the\ncache_ops->populate callback, and if
  cache operations include an exit\ncallback, the error code from populate() is overwritten
  with the return\nvalue from exit(). This hides the error condition from the caller
  of\nregcache_init(), and can cause NULL pointer dereferences when the regcache\n\
  is later accessed."
