title: Compliance-trestle (Trestle) is a Python SDK and command-line tool for 
  managing OSCAL compliance documents. In versions before 3.12.4 and versions 
  4.0.0 through 4.0.3, the catalog-generate, profile-generate, and ssp-generate 
  author commands write generated Markdown to an attacker-influenced output path
  without path-traversal validation, allowing arbitrary file write outside the 
  Trestle workspace. These commands join the user-supplied output argument onto 
  the Trestle root and write to the result, but guard it only with an 
  is_directory_name_allowed() task-name-collision check rather than the 
  PathSecurityValidator.validate_local_path() guard used by the jinja command, 
  so an absolute path or one containing traversal sequences escapes the 
  workspace and writes files under an attacker-chosen location as the invoking 
  process owner. The security boundary is crossed when a trusted CI job, shared 
