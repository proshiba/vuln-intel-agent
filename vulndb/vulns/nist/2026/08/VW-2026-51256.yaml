title: go-wind-cms (GoWind) before 1.0.0 has a missing authorization 
  vulnerability. The NewAuthorizer() function in 
  app/admin/service/internal/data/data.go and 
  app/app/service/internal/data/data.go returns a no-op authorization engine 
  (noop.State{}), so the authz middleware always allows requests. Any 
  authenticated user (regardless of role or tenant) can invoke administrative 
  APIs such as deleting users, resetting passwords, and creating tenants.
