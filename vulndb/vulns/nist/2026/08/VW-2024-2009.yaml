title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/mediatek:
  Init `ddp_comp` with devm_kcalloc()\n\nIn the case where `conn_routes` is true we
  allocate an extra slot in\nthe `ddp_comp` array but mtk_drm_crtc_create() never
  seemed to\ninitialize it in the test case I ran. For me, this caused a later\ncrash
  when we looped through the array in mtk_drm_crtc_mode_valid().\nThis showed up for
  me when I booted with `slub_debug=FZPUA` which\npoisons the memory initially. Without
  `slub_debug` I couldn't\nreproduce, presumably because the later code handles the
  value being\nNULL and in most cases (not guaranteed in all cases) the memory the\n\
  allocator returned started out as 0.\n\nIt really doesn't hurt to initialize the
  array with devm_kcalloc()\nsince the array is small and the overhead of initting
  a handful of\nelements to 0 is small. In general initting memory to zero is a safer\n\
  practice and usually it's suggested to only use the non-initting alloc\nfunctions
  if you really need to.\n\nL"
