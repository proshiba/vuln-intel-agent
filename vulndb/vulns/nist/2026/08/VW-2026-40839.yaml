title: A weakness has been identified in andreahaku llm_memory_mcp up to 
  f11dc8bcff3ff8cf943a2945f99ff3b0bdc8a6d0. This impacts the function 
  auto.capture of the file src/autolearn/GitHooksManager.ts of the component 
  llm_memory_mcp. Executing a manipulation of the argument hash can lead to 
  command injection. The attack is restricted to local execution. This product 
  does not use versioning. This is why information about affected and unaffected
  releases are unavailable. The project was informed of the problem early 
  through an issue report but has not responded yet.
