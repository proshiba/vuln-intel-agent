title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  cacheinfo: Fix node reference leak in populate_cache_leaves\n\nCurrently, the while
  loop drops the reference to prev in each iteration.\nIf the loop terminates early
  due to a break, the final of_node_put(np)\ncorrectly drops the reference to the
  current node.\n\nHowever, if the loop terminates naturally because np == NULL, calling\n\
  of_node_put(np) is a no-op. This leaves the last valid node stored in\nprev without
  its reference dropped, resulting in a node reference leak.\n\nFix this by changing
  the final `of_node_put(np)` to `of_node_put(prev)`."
