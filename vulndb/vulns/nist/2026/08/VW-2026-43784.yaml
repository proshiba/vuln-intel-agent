title: Worksuite SaaS versions prior to 6.0.14 contains a stored cross-site 
  scripting vulnerability in the Asset Management module that allows 
  authenticated administrators to inject arbitrary JavaScript by entering 
  malicious payloads into the Location and Description fields when creating a 
  new asset. Attackers can store crafted HTML script tags in the application 
  database that execute automatically in the browsers of any user who views the 
  affected asset, potentially leading to session hijacking, credential theft, 
  and unauthorized actions on behalf of authenticated users.
