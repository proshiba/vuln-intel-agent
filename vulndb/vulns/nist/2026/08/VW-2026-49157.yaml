title: The Lean 4 kernel does not check that the body of an opaque declaration 
  is closed. environment::add_opaque omits the check_no_metavar_no_fvar call 
  that the definition and theorem paths perform, so a value containing a free 
  variable that is absent from the local context is not rejected outright. A 
  metaprogram can first cause the kernel to create a temporary local of type 
  False and record its type in the type checker's inference cache, then restore 
  the local context while that cache entry persists on the same type checker 
  instance, and finally submit an opaque declaration whose value is the 
  now-unbound variable. The cache lookup answers before the branch that would 
  test membership of the local context, so the kernel infers the cached type and
  admits an opaque constant of type False, from which any proposition follows. 
  The declaration is accepted through the ordinary checked path at maximum 
  kernel checking, without sorry, unsafeCast, debug.skipKernelTC, 
  addDeclWithoutChecking, foreign cod
