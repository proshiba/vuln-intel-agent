title: Dokploy is a free, self-hostable Platform as a Service (PaaS). From 
  0.28.7 until 0.29.13, the server.remove tRPC mutation in 
  apps/dokploy/server/api/routers/server.ts accepts a caller-controlled serverId
  and calls haveActiveServices, findServerById, removeDeploymentsByServerId, and
  deleteServer without verifying that currentServer.organizationId equals 
  ctx.session.activeOrganizationId. An authenticated owner or administrator with
  server:delete in one organization who previously observed another 
  organization's serverId can delete that organization's server registration and
  deployment records, interrupt Dokploy management, and receive the associated 
  plaintext SSH private key even though server.one denies the same 
  cross-organization read. This issue is fixed in version 0.29.13.
