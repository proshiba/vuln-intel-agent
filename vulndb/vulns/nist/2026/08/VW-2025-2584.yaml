title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  check v2_ext_offset/eid_cnt/ism_gid_cnt when receiving proposal msg\n\nWhen receiving
  proposal msg in server, the fields v2_ext_offset/\neid_cnt/ism_gid_cnt in proposal
  msg are from the remote client\nand can not be fully trusted. Especially the field
  v2_ext_offset,\nonce exceed the max value, there has the chance to access wrong\n\
  address, and crash may happen.\n\nThis patch checks the fields v2_ext_offset/eid_cnt/ism_gid_cnt\n\
  before using them."
