title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conncount: fix zone comparison in tuple dedup\n\nThe \"already exists\" dedup
  logic in __nf_conncount_add() decides\nwhether a connection has already been counted
  and can be skipped instead\nof incrementing the connlimit count.  It compares the
  conntrack zone of a\nlist entry with the zone of the connection being added using\n\
  nf_ct_zone_id() and nf_ct_zone_equal(), passing conn->zone.dir or\nzone->dir as
  the direction argument.\n\nThose helpers take enum ip_conntrack_dir values: IP_CT_DIR_ORIGINAL
  is 0\nand IP_CT_DIR_REPLY is 1.  However, zone->dir is a u8 bitmask:\nNF_CT_ZONE_DIR_ORIG
  is 1, NF_CT_ZONE_DIR_REPL is 2 and\nNF_CT_DEFAULT_ZONE_DIR is 3.  Passing that bitmask
  as the enum direction\nshifts the meaning of every non-zero value.  An ORIG-only
  zone passes 1\nand is tested as REPLY, while REPL-only and default zones pass 2
  or 3 and\ntest bits beyond the valid direction range.  In those cases\nnf_ct_zone_id()
