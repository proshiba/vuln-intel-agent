title: "In the Linux kernel, the following vulnerability has been resolved:\n\nseg6:
  fix the iif in the IPv6 socket control block\n\nWhen an IPv4 packet is received,
  the ip_rcv_core(...) sets the receiving\ninterface index into the IPv4 socket control
  block (v5.16-rc4,\nnet/ipv4/ip_input.c line 510):\n\n    IPCB(skb)->iif = skb->skb_iif;\n\
  \nIf that IPv4 packet is meant to be encapsulated in an outer IPv6+SRH\nheader,
  the seg6_do_srh_encap(...) performs the required encapsulation.\nIn this case, the
  seg6_do_srh_encap function clears the IPv6 socket control\nblock (v5.16-rc4 net/ipv6/seg6_iptunnel.c
  line 163):\n\n    memset(IP6CB(skb), 0, sizeof(*IP6CB(skb)));\n\nThe memset(...)
  was introduced in commit ef489749aae5 (\"ipv6: sr: clear\nIP6CB(skb) on SRH ip4ip6
  encapsulation\") a long time ago (2019-01-29).\n\nSince the IPv6 socket control
  block and the IPv4 socket control block share\nthe same memory area (skb->cb), the
