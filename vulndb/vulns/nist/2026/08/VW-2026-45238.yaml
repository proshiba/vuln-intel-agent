title: stoatchat before 0.15.0 contains a missing authorization vulnerability in
  the Subscribe message handler that allows authenticated attackers to enumerate
  members and monitor profile updates of private servers without membership. 
  Attackers can subscribe to any server's member-update topic by sending a 
  Subscribe message with an arbitrary server ID, receiving live UserUpdate 
  events including display names, avatars, and status changes for members they 
  should not have access to.
