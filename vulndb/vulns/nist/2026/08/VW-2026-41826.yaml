title: The Kirki – Freeform Page Builder, Website Builder & Customizer plugin 
  for WordPress is vulnerable to Stored Cross-Site Scripting via the post_meta 
  Shortcode in all versions up to, and including, 6.2.0 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with Contributor-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page.
