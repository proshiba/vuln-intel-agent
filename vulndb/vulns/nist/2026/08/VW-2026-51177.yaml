title: The MongoDB Go Driver's client-level bulk write operation may accept a 
  caller-supplied database name containing a reserved separator character 
  without escaping it before the name is used to build the target namespace for 
  the operation. An application that passes untrusted input as a database name 
  could therefore have the write directed at a database and collection other 
  than the ones it intended. Only the Client.BulkWrite API is affected.
