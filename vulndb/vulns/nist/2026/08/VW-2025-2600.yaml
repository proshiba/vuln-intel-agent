title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblock:
  RCU protect disk->conv_zones_bitmap\n\nEnsure that a disk revalidation changing
  the conventional zones bitmap\nof a disk does not cause invalid memory references
  when using the\ndisk_zone_is_conv() helper by RCU protecting the disk->conv_zones_bitmap\n\
  pointer.\n\ndisk_zone_is_conv() is modified to operate under the RCU read lock and\n\
  the function disk_set_conv_zones_bitmap() is added to update a disk\nconv_zones_bitmap
  pointer using rcu_replace_pointer() with the disk\nzone_wplugs_lock spinlock held.\n\
  \ndisk_free_zone_resources() is modified to call\ndisk_update_zone_resources() with
  a NULL bitmap pointer to free the disk\nconv_zones_bitmap. disk_set_conv_zones_bitmap()
  is also used in\ndisk_update_zone_resources() to set the new (revalidated) bitmap
  and\nfree the old one."
