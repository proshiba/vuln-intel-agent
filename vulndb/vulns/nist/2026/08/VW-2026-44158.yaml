title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  rawnand: lpc32xx_slc: fail DMA transfer on completion timeout\n\nlpc32xx_xmit_dma()
  waits for the DMA completion callback but ignores\nwait_for_completion_timeout().
  A timed out DMA transfer is therefore\nunmapped and reported as successful to the
  NAND read/write path.\n\nReturn -ETIMEDOUT when the completion wait expires. Terminate
  the DMA\nchannel before unmapping the scatterlist so the timed out transfer cannot\n\
  continue to access the buffer after the error is returned."
