title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix list corruption in allocate_file_region_entries()\n\nallocate_file_region_entries()
  tops up resv->region_cache with freshly\nallocated file_region descriptors.  The
  allocation uses GFP_KERNEL, so\nresv->lock is dropped around it: the new entries
  are gathered on a\nstack-local list head, allocated_regions, and spliced into\n\
  resv->region_cache once the lock is re-acquired.\n\nThe splice used list_splice(),
  which moves the entries but does not\nre-initialize the source head, so allocated_regions
  is left pointing at an\nentry that now lives on resv->region_cache.  The top-up
  runs in a while\nloop that re-checks the cache deficit after re-acquiring the lock.\
  \  For a\nshared mapping the resv_map is shared by every mapper of the hugetlbfs\n\
  inode, so a concurrent region_chg()/region_add()/region_del() on the same\nresv_map
  can consume cache entries during the unlocked window and force a\nsecond iteration.\
  \  That iteration call"
