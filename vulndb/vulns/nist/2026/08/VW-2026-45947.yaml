title: Saleor is an e-commerce platform. From 2.10.0rc1 until 3.21.67, 3.22.63, 
  and 3.23.22, the account activation flow treats email verification as 
  sufficient proof of account ownership and automatically associates anonymous 
  commerce data with the newly activated account. An attacker can use 
  accountRegister to create an account with a victim's email address before the 
  victim registers. If the victim follows the activation link sent to that 
  mailbox, Saleor activates the attacker-created account and 
  saleor/graphql/account/mutations/account/confirm_account.py can merge 
  anonymous orders and gift-card data for the same email address without 
  requiring the account password or another authentication factor. The attacker 
  can then access the merged order history and personal data, including names, 
  addresses, and phone numbers. The patched supported lines disable automatic 
  merging by default, while the redesigned 3.24.0 flow requires password 
  confirmation before anonymous objects are linked. This issu
