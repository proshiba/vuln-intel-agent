title: "Sony XAV-9500ES Crash Dump Handler Command Injection Local Privilege Escalation
  Vulnerability. This vulnerability allows local attackers to escalate privileges
  on affected installations of Sony XAV-9500ES devices. An attacker must first obtain
  the ability to execute low-privileged code on the target system in order to exploit
  this vulnerability.\n\nThe specific flaw exists within the handling of process crash
  dumps. The issue results from the lack of proper validation of a user-supplied string
  before using it to execute a system call. An attacker can leverage this vulnerability
  to escalate privileges and execute arbitrary code in the context of root. Was ZDI-CAN-29061."
