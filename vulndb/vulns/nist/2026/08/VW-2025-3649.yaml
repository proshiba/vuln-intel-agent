title: "The configuration of Mosh-Pro on macOS, specifically the \"RunAsNode\" fuse
  enabled, allows a local attacker with unprivileged access to execute arbitrary code
  that inherits Mosh-Pro TCC (Transparency, Consent, and Control) permissions. \n\
  Acquired resource access is limited to previously granted permissions by the user.
  Accessing other resources beyond previously granted TCC permissions will prompt
  the user for approval in the name of Mosh-Pro, potentially disguising attacker's
  malicious intent. \n\nThis issue was fixed in 1.3.7 version of Mosh-Pro."
