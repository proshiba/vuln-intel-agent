title: "The Templately – Elementor & Gutenberg Template Library: 6500+ Free & Pro
  Ready Templates And Cloud! plugin for WordPress is vulnerable to Remote Code Execution
  in all versions up to, and including, 3.7.1 via the fetch_remote_file function.
  This is due to a filename validation/destination mismatch in fetch_remote_file,
  where file type validation is performed against the attacker-controlled Content-Disposition
  filename rather than the URL-path-derived destination filename. This makes it possible
  for authenticated attackers, with contributor-level access and above, to execute
  code on the server. A GIF+PHP polyglot file passes wp_check_filetype_and_ext validation
  as image/gif via the Content-Disposition filename, while the actual destination
  path is written with a .php extension derived from the URL path, bypassing the unfiltered_upload
  capability gate entirely. The affected endpoints are reachable at this privilege
