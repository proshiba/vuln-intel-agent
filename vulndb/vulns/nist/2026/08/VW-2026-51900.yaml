title: The MyHome Core plugin for WordPress is vulnerable to Authentication 
  Bypass in all versions up to, and including, 4.4.5. This is due to missing 
  authorization in the send_link() AJAX handler and improper token validation in
  the activate() function. This makes it possible for unauthenticated attackers 
  to generate an activation token for an unconfirmed user account and obtain a 
  valid authentication cookie for that account, including administrators. 
  Successful exploitation requires the MyHome theme to be configured in 
  legacy/WPBakery mode with frontend registration and confirmation email 
  enabled, and the target account must not already have the 
  myhome_agent_confirmed user meta set.
