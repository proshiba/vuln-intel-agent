title: A weakness has been identified in Open5GS up to 2.7.7. The affected 
  element is the function smf_nudm_sdm_handle_get of the file 
  src/smf/nudm-handler.c of the component SMF. Executing a manipulation of the 
  argument preemptCap can lead to reachable assertion. The attack may be 
  launched remotely. Upgrading to version 2.8.0 is sufficient to fix this issue.
  This patch is called 4554405f29bffd7562abedbee63484825bd90cd5. You should 
  upgrade the affected component.
