title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni40e:
  Fix NULL ptr dereference on VSI filter sync\n\nRemove the reason of null pointer
  dereference in sync VSI filters.\nAdded new I40E_VSI_RELEASING flag to signalize
  deleting and releasing\nof VSI resources to sync this thread with sync filters subtask.\n\
  Without this patch it is possible to start update the VSI filter list\nafter VSI
  is removed, that's causing a kernel oops."
