title: A vulnerability was identified in liketrek TREK up to 3.0.22. The 
  impacted element is the function findOrCreateUser of the file 
  server/src/services/oidcService.ts of the component OIDC Service. Such 
  manipulation leads to improper authentication. It is possible to launch the 
  attack remotely. The attack requires a high level of complexity. The 
  exploitability is regarded as difficult. Upgrading to version 3.1.0 is 
  sufficient to resolve this issue. Upgrading the affected component is advised.
