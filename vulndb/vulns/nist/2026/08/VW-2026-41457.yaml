title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Reject unhashed UDP sockets on sockmap update\n\nUDP sockets get SOCK_RCU_FREE
  set when (auto-)bound. This means\nsk_is_refcounted(unbound) = true, while sk_is_refcounted(bound)
  = false.\n\nBecause sockmap accepts unbound UDP sockets, a BPF program can increment
  a\nsocket's refcount via lookup. If the socket is subsequently bound, the\ntransition
  from unbound to bound causes bpf_sk_release() to skip the\ndecrement of the refcount,
  causing a memory leak.\n\nunreferenced object 0xffff88810bc2eb40 (size 1984):\n\
  \  comm \"test_progs\", pid 2451, jiffies 4295320596\n  hex dump (first 32 bytes):\n\
  \    7f 00 00 01 7f 00 00 01 d2 04 1b b7 04 d2 00 00  ................\n    02 00
  01 40 00 00 00 00 00 00 00 00 00 00 00 00  ...@............\n  backtrace (crc bdee079d):\n\
  \    kmem_cache_alloc_noprof+0x557/0x660\n    sk_prot_alloc+0x69/0x240\n    sk_alloc+0x30/0x460\n\
  \    inet_create+0x2ce/0xf80\n    __sock_create+0x25b/0x5c0\n    __sys_socket"
