title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  fix stale skb->prev after async crypto steals a GSO segment\n\nskb_gso_segment()
  leaves the segment list head with ->prev pointing at\nthe last segment, an invariant
  validate_xmit_skb_list() relies on when\nit sets its tail pointer (tail = skb->prev).\n\
  \nWhen validate_xmit_xfrm() walks a GSO list and some segments are stolen\nby async
  crypto (->xmit() returns -EINPROGRESS), those segments are\nunlinked from the list
  but the head ->prev is never updated.  If the\nlast segment is the one stolen, the
  returned head still has ->prev\npointing at it, even though it is now owned by the
  crypto engine and may\nbe freed.  validate_xmit_skb_list() later does tail->next
  = skb, writing\nthrough that stale pointer -- a use-after-free.\n\nRepoint skb->prev
  at the last retained segment before returning."
