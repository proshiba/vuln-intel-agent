title: RustFS is a distributed object storage system built in Rust. RustFS 
  authorizes explicit versionId reads in GetObject, CopyObject sources, and 
  UploadPartCopy sources with s3:GetObject instead of s3:GetObjectVersion, 
  allowing principals without historical-version permission to disclose known 
  historical object content. This issue is fixed in version 1.0.0-beta.11.
