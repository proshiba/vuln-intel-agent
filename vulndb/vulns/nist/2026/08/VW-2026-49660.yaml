title: The /api.php/user/get_list endpoint in Maccms v10 v2026.1000.4055 is 
  vulnerable to an Incorrect Access Control issue. The interface fails to 
  perform any authentication or authorization checks. An unauthenticated remote 
  attacker can send a crafted HTTP GET request with limit and offset parameters 
  to paginate and retrieve sensitive information of all registered users.
