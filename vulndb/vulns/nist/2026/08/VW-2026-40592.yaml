title: "Tobit Laboratories AG TeamDavid's Webbox application implements an API endpoint
  that is vulnerable to a \nbuffer overflow condition. By submitting a specially crafted
  JSON body, \nsuch as one that is at least 8 characters long and begins with a number,\n\
  \ an unauthenticated attacker can cause the server to crash, resulting in\n denial
  of service. Depending on the stack state or if a stack canary \ncan be disclosed
  through another vulnerability, this buffer overflow \ncould potentially lead to
  remote code execution and full compromise of \nthe server. This issue affects TeamDavid
  through Rollout 524."
