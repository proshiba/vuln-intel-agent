title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix out-of-bounds access in 'dcn21_link_encoder_create'\n\nAn issue was identified
  in the dcn21_link_encoder_create function where\nan out-of-bounds access could occur
  when the hpd_source index was used\nto reference the link_enc_hpd_regs array. This
  array has a fixed size\nand the index was not being checked against the array's
  bounds before\naccessing it.\n\nThis fix adds a conditional check to ensure that
  the hpd_source index is\nwithin the valid range of the link_enc_hpd_regs array.
  If the index is\nout of bounds, the function now returns NULL to prevent undefined\n\
  behavior.\n\nReferences:\n\n[   65.920507] ------------[ cut here ]------------\n\
  [   65.920510] UBSAN: array-index-out-of-bounds in drivers/gpu/drm/amd/amdgpu/../display/dc/resource/dcn21/dcn21_resource.c:1312:29\n\
  [   65.920519] index 7 is out of range for type 'dcn10_link_enc_hpd_registers [5]'\n\
  [   65.920523] CPU: 3 PID: 1178 Comm: modprobe Tainted: G "
