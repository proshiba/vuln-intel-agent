title: "Tobit Laboratories AG TeamDavid's Webbox  contains an open redirect vulnerability
  via the \n“replyUrl” parameter. An attacker can exploit this vulnerability to \n\
  craft a URL within the application that, when visited, redirects the \nuser’s browser
  to an arbitrary third-party site. This can be abused for \nphishing attacks, where
  users receive a trusted domain link but are \nredirected to a phishing website. This
  issue affects TeamDavid through Rollout 524."
