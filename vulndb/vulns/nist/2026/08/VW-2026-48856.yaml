title: A vulnerability has been found in Dolibarr ERP up to 
  18.0.10/22.0.5/23.0.3. This issue affects some unknown processing of the file 
  /user/note.php of the component User Notes Handler. The manipulation of the 
  argument ID leads to authorization bypass. The attack can be initiated 
  remotely. Upgrading to version 23.0.4 and 24.0.0 is capable of addressing this
  issue. The identifier of the patch is 
  9b5229ef3a9b58d00252d327936b022fb739f149. Upgrading the affected component is 
  advised.
