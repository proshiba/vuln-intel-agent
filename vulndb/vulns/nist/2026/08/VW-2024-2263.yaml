title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfc:
  pn533: Wait for out_urb's completion in pn533_usb_send_frame()\n\nFix a use-after-free
  that occurs in hcd when in_urb sent from\npn533_usb_send_frame() is completed earlier
  than out_urb. Its callback\nfrees the skb data in pn533_send_async_complete() that
  is used as a\ntransfer buffer of out_urb. Wait before sending in_urb until the\n\
  callback of out_urb is called. To modify the callback of out_urb alone,\nseparate
  the complete function of out_urb and ack_urb.\n\nFound by a modified version of
