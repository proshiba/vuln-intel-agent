title: "Improper handling of highly compressed data in the GZIP auto-decompression
  handler in Amazon ion-java before 1.12.0 might allow remote actors to cause a denial
  of service via a crafted compressed Ion document that expands to an arbitrarily
  large size upon decompression.\n\n\n\nTo remediate this issue, users should upgrade
  to version 1.12.0 and configure withGzipDecompressionEnabled(false) and/or set an
  explicit withMaximumBufferSize() when parsing untrusted input."
