title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncomedi:
  comedi_parport: deal with premature interrupt\n\nSyzbot reported a general protection
  fault in\n`comedi_get_is_subdevice_running()`, which was called from the interrupt\n\
  handler `parport_interrupt()` in the \"comedi_parport\" driver, but it\ndoes not
  currently have a C reproducer for the problem.  It's\nprobably due to a premature
  interrupt for one of two reasons:\n\n1. The driver sets up the interrupt handler
  before the comedi subdevices\n   used by the interrupt handler have been allocated,
  but does not\n   disable the interrupt in the parallel port's CTRL register first.\n\
  2. The driver uses a user-supplied I/O port base address which Syzbot\n   would
  have supplied, but it might not be backed by real parallel port\n   hardware.\n\n\
  Change the initialization order in the driver's comedi \"attach\" handler\n(`parport_attach()`)
  so that the hardware registers are initialized\nbefore the interrupt handler is
