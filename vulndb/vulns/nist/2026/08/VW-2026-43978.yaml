title: CKAN MCP Server is a tool for querying CKAN open data portals. Prior to 
  0.4.112, error paths reflect raw upstream response bodies and internal 
  exception messages back to the caller instead of a sanitized, generic message.
  When the server is pointed at (or redirected/SSRF'd to) a host that returns a 
  non-CKAN response, or when an internal exception occurs, the caller receives 
  verbatim upstream content and internal detail (hostnames, internal IPs, DB 
  errors, stack fragments). This vulnerability is fixed in 0.4.112.
