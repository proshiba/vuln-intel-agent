title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: mxl862xx: fix use-after-free of DSA ports in crc_err_work\n\nUpon an MDIO CRC
  error mxl862xx_crc_err_work_fn() walks the DSA ports\nand closes the CPU port conduits:\n\
  \n\tdsa_switch_for_each_cpu_port(dp, priv->ds)\n\t\tdev_close(dp->conduit);\n\n\
  mxl862xx_remove() unregisters the switch before cancelling this work:\n\n\tset_bit(MXL862XX_FLAG_WORK_STOPPED,
  &priv->flags);\n\tcancel_delayed_work_sync(&priv->stats_work);\n\tdsa_unregister_switch(ds);\n\
  \tmxl862xx_host_shutdown(priv);\n\ndsa_unregister_switch() frees the dsa_port objects.
  If a CRC error\nschedules the work during teardown it can run after the ports have
  been\nfreed and dereference freed memory.\n\nGuard the port walk with MXL862XX_FLAG_WORK_STOPPED,
  which is already set\nbefore dsa_unregister_switch(). DSA tears the ports down under\n\
  rtnl_lock(), so checking the flag under rtnl_lock() means the work either\nruns
  before teardown and sees valid ports, or runs afterwards, observe"
