title: "Improper validation of length fields in the Apache IoTDB RPC service may allow
  a remote unauthenticated attacker to cause a denial of service. By sending a crafted
  malformed Thrift frame, an attacker can cause IoTDB to allocate an excessive amount
  of memory and crash with an OutOfMemoryError.\n\n\nThis issue affects Apache IoTDB:
  before 1.3.8, from 2.0.0 before 2.0.9.\n\nUsers are recommended to upgrade to version
  2.0.10, which fixes the issue."
