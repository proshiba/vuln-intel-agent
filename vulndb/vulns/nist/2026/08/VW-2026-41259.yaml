title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  RFCOMM: Fix session UAF in set_termios\n\nrfcomm_tty_set_termios() tests dlc->session
  without rfcomm_mutex and\nlater passes the pointer to rfcomm_send_rpn(). The latter
  dereferences\nboth session->initiator and session->sock. Meanwhile, krfcommd can\n\
  unlink the DLC and free the session while holding rfcomm_mutex.\n\nThe race can
  proceed as follows:\n\n  TTY ioctl task                 krfcommd\n  --------------\
  \                 --------\n  load dlc->session\n  enter rfcomm_send_rpn()\n   \
  \                              lock rfcomm_mutex\n                             \
  \    clear dlc->session\n                                 free session\n       \
  \                          unlock rfcomm_mutex\n  read session->initiator\n\nKASAN
  reported:\n\n  BUG: KASAN: slab-use-after-free in rfcomm_send_rpn+0x297/0x2a0\n\
  \  Read of size 4 at addr ffff88810012a850 by task poc/92\n\n  Call Trace:\n   rfcomm_send_rpn+0x297/0x2a0\n\
  \   rfcomm_tty_set_termios+0x50"
