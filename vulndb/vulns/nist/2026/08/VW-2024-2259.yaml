title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  Remove rcu locks from user resources\n\nUser resource lookups used rcu to avoid
  two extra atomics. Unfortunately\nthe rcu paths were buggy and it was easy to make
  the driver crash by\nsubmitting command buffers from two different threads. Because
  the\nlookups never show up in performance profiles replace them with a\nregular
  spin lock which fixes the races in accesses to those shared\nresources.\n\nFixes
  kernel oops'es in IGT's vmwgfx execution_buffer stress test and\nseen crashes with
  apps using shared resources."
