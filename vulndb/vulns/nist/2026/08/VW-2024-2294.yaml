title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkcm:
  Serialise kcm_sendmsg() for the same socket.\n\nsyzkaller reported UAF in kcm_release().
  [0]\n\nThe scenario is\n\n  1. Thread A builds a skb with MSG_MORE and sets kcm->seq_skb.\n\
  \n  2. Thread A resumes building skb from kcm->seq_skb but is blocked\n     by sk_stream_wait_memory()\n\
  \n  3. Thread B calls sendmsg() concurrently, finishes building kcm->seq_skb\n \
  \    and puts the skb to the write queue\n\n  4. Thread A faces an error and finally
  frees skb that is already in the\n     write queue\n\n  5. kcm_release() does double-free
  the skb in the write queue\n\nWhen a thread is building a MSG_MORE skb, another
  thread must not touch it.\n\nLet's add a per-sk mutex and serialise kcm_sendmsg().\n\
  \n[0]:\nBUG: KASAN: slab-use-after-free in __skb_unlink include/linux/skbuff.h:2366
  [inline]\nBUG: KASAN: slab-use-after-free in __skb_dequeue include/linux/skbuff.h:2385
  [inline]\nBUG: KASAN: slab-use-after-free in __skb_queue_purge_reason include/li"
