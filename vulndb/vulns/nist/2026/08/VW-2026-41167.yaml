title: "In the Linux kernel, the following vulnerability has been resolved:\n\naudit:
  fix recursive locking deadlock in audit_dupe_exe()\n\nA deadlock occurs in the audit
  subsystem when duplicating\nexecutable-related rules.\n\nWhen a file is moved (e.g.,
  via do_renameat2()), the VFS layer locks\nthe parent directory (I_MUTEX_PARENT),
  which synchronously triggers an\nfsnotify_move event. If an existing executable
  audit rule matches the\nfile being moved, the audit subsystem catches this event
  and calls\naudit_dupe_exe() to duplicate the watch and update the rule. Then,\n\
  audit_alloc_mark() would call kern_path_parent() to resolve the path,\nleading to
  a blind attempt to acquire the exact same I_MUTEX_PARENT lock\nalready held by the
  task, resulting in the following recursive locking\ndeadlock:\n\n ============================================\n\
  \ WARNING: possible recursive locking detected\n 6.12.0-55.27.1.el10_0.x86_64+debug
  #1 Not tainted\n --------------------------------------------\n mv/5099 is trying
  to acquire"
