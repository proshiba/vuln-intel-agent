title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuprobes/x86:
  Use proper mm_struct in __in_uprobe_trampoline\n\nIn the unregister path we use
  __in_uprobe_trampoline check with\ncurrent->mm for the VMA lookup, which is wrong,
  because we are\nin the tracer context, not the traced process.\n\nAdd mm_struct
  pointer argument to __in_uprobe_trampoline and\nchanging related callers to pass
  proper mm_struct pointer."
