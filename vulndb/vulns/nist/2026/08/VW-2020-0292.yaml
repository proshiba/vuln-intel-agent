title: A vulnerability in how Cisco Firepower Threat Defense (FTD) Software 
  handles session timeouts for management connections could allow an 
  unauthenticated, remote attacker to cause a buildup of remote management 
  connections to an affected device, which could result in a denial of service 
  (DoS) condition. The vulnerability exists because the default session timeout 
  period for specific to-the-box remote management connections is too long. An 
  attacker could exploit this vulnerability by sending a large and sustained 
  number of crafted remote management connections to an affected device, 
  resulting in a buildup of those connections over time. A successful exploit 
  could allow the attacker to cause the remote management interface or Cisco 
  Firepower Device Manager (FDM) to stop responding and cause other management 
  functions to go offline, resulting in a DoS condition. The user traffic that 
