title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  validate DRAW_PRIMITIVES header size before division\n\nvmw_cmd_draw() computes\n\
  \n\tmaxnum = (header->size - sizeof(cmd->body)) / sizeof(*decl);\n\nwhere header->size
  is u32 and is taken straight from the user-supplied\ncommand stream.  When header->size
  is less than sizeof(cmd->body) the\nunsigned subtraction wraps to nearly 4 GiB,
  producing a huge maxnum.\nAny user-controlled cmd->body.numVertexDecls then passes
  the bound and\nthe loop dereferences decl[i] far past the end of the kernel command\n\
  bounce buffer, producing an out-of-bounds read of kernel memory.\n\nReject undersized
  headers up front."
