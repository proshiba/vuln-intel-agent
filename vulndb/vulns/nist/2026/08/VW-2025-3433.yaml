title: "An Out-of-bounds Write vulnerability in the WatchGuard Fireware OS iked process
  may allow a remote unauthenticated attacker to execute arbitrary code. This vulnerability
  affects both the mobile user VPN with IKEv2 and the branch office VPN using IKEv2
  when configured with a dynamic gateway peer.\nIf the Firebox was previously configured
  with the mobile user VPN with IKEv2 or a branch office VPN using IKEv2 to a dynamic
  gateway peer, and both of those configurations have since been deleted, that Firebox
  may still be vulnerable if a branch office VPN to a static gateway peer is still
  configured."
