title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  check label build before no_new_privs test\n\naa_change_profile() builds a replacement
  label with\nfn_label_build_in_scope() before the no_new_privs subset check. The
  build\nhelper can fail and return NULL or an ERR_PTR, but the result was passed\n\
  to aa_label_is_unconfined_subset() before the existing IS_ERR_OR_NULL()\ncheck.\n\
  \nReuse the existing target-label build failure handling immediately after\nthe
  build. This preserves the current audit handling while preventing the\nsubset helper
  from dereferencing an invalid label."
