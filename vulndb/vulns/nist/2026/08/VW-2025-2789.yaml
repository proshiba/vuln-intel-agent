title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  Reject attempts to consume or refresh inactive gfn_to_pfn_cache\n\nReject kvm_gpc_check()
  and kvm_gpc_refresh() if the cache is inactive.\nNot checking the active flag during
  refresh is particularly egregious, as\nKVM can end up with a valid, inactive cache,
  which can lead to a variety\nof use-after-free bugs, e.g. consuming a NULL kernel
  pointer or missing\nan mmu_notifier invalidation due to the cache not being on the
  list of\ngfns to invalidate.\n\nNote, \"active\" needs to be set if and only if
  the cache is on the list\nof caches, i.e. is reachable via mmu_notifier events.\
  \  If a relevant\nmmu_notifier event occurs while the cache is \"active\" but not
  on the\nlist, KVM will not acquire the cache's lock and so will not serailize\n\
  the mmu_notifier event with active users and/or kvm_gpc_refresh().\n\nA race between
  KVM_XEN_ATTR_TYPE_SHARED_INFO and KVM_XEN_HVM_EVTCHN_SEND\ncan be exploited to trigger
  the bug.\n\n1. Deactivate shinfo "
