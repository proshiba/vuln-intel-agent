title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  clear fb_info->mode before deleting a videomode\n\nfb_set_var() can delete a mode
  from info->modelist when userspace\npasses FB_ACTIVATE_INV_MODE through FBIOPUT_VSCREENINFO.
  The code\nchecks that the mode being deleted is not the current info->var and\n\
  that fbcon is not using it, but it does not check fb_info->mode.\n\nfb_info->mode
  may still point into the modelist entry being deleted.\nIf the entry is freed, later
  mode sysfs reads through show_mode() can\ndereference a stale pointer.\n\nClear
  fb_info->mode before calling fb_delete_videomode() when it\nmatches the mode being
  removed."
