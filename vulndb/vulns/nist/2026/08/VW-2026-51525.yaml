title: filebrowser from version 2.24.0 contains a race condition in the TUS 
  upload handler that allows authenticated users to write past the declared 
  Upload-Length by sending concurrent PATCH requests. Attackers can send 
  multiple simultaneous PATCH requests at the same offset to bypass length 
  validation, resulting in files that exceed their declared size and triggering 
  completion hooks for oversized uploads.
