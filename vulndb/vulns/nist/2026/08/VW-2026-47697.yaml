title: A flaw was found in libvirt. An unprivileged local user could exploit an 
  integer overflow vulnerability in the NodeGetFreePages RPC handler. This flaw 
  allows crafted values to bypass a size check, leading to an undersized memory 
  buffer. Subsequently, real NUMA node data can overwrite this buffer. This heap
  buffer overflow can corrupt the root libvirt daemon's memory, potentially 
  leading to a denial of service or local privilege escalation.
