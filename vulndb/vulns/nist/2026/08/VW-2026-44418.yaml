title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: use dst in this direction when pushing IPIP header\n\nWhen pushing the
  IPIP header, the route of the other direction is used\nto calculate the headroom,
  use the route in this direction. Accessing\nthe other tuple to set the IP source
  and destination is fine because\nthis tuple does not provide such information to
  avoid storing redundant\ninformation. However, this tuple already provides the dst
  for this\ndirection, this went unnoticed because this bug affects headroom and\n\
  iph->frag_off only at this stage."
