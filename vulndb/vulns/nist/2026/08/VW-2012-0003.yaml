title: Multiple vulnerabilities in the Java Runtime Environment (JRE) component 
  in Oracle Java SE 7 Update 6 and earlier allow remote attackers to execute 
  arbitrary code via a crafted applet that bypasses SecurityManager restrictions
  by (1) using com.sun.beans.finder.ClassFinder.findClass and leveraging an 
  exception with the forName method to access restricted classes from arbitrary 
  packages such as sun.awt.SunToolkit, then (2) using "reflection with a trusted
  immediate caller" to leverage the getField method to access and modify private
  fields, as exploited in the wild in August 2012 using Gondzz.class and 
  Gondvv.class.
