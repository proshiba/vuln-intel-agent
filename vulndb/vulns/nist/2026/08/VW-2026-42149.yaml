title: CamaleonCMS version 2.9.2 and earlier contains a missing authorization 
  vulnerability in the admin users controller that allows any authenticated user
  to access any other user's profile data by supplying an arbitrary user ID 
  parameter. Attackers can send a GET request to the admin profile endpoint with
  an enumerable sequential integer user ID to disclose profile information of 
  any user, including administrators, due to the profile action being excluded 
  from the role validation filter with no compensating ownership check.
