title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix HV VHCA stats zero-sized buffer allocation\n\nmlx5e_hv_vhca_stats_create() is
  called from mlx5e_nic_enable(),\nbefore mlx5e_open(). At that point priv->stats_nch
  is still zero,\nbecause it is only ever incremented in mlx5e_channel_stats_alloc(),\n\
  which is reached only from mlx5e_open_channel().\n\nmlx5e_hv_vhca_stats_buf_size()
  therefore returns 0, and\nkvzalloc(0, GFP_KERNEL) returns ZERO_SIZE_PTR ((void *)16)
  rather\nthan NULL. The \"if (!buf)\" guard does not catch this, and\nmlx5e_hv_vhca_stats_create()
  completes \"successfully\" with\npriv->stats_agent.buf set to ZERO_SIZE_PTR.\n\n\
  Once channels are opened (priv->stats_nch > 0) and the hypervisor\nenables stats
  reporting, mlx5e_hv_vhca_stats_work() recomputes\nbuf_len using the new non-zero
  stats_nch and calls\nmemset(buf, 0, buf_len) on ZERO_SIZE_PTR, faulting at address
  0x10.\n\nAllocate the buffer based on priv->max_nch, which is set in\nmlx5e_priv_init()
  and is the up"
