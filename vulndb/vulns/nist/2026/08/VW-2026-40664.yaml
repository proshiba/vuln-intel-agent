title: Postiz is an open-source social media scheduling tool. The route that 
  serves locally stored media joins URL-supplied path segments onto the upload 
  directory and streams the file without normalising the path or confining it to
  that directory, and the route requires no authentication. Raw dot-segments are
  collapsed before routing, but URL-encoded separators survive route matching 
  and are decoded only once they reach the handler, restoring the traversal at 
  the filesystem call. An unauthenticated remote attacker can therefore read any
  file readable by the application process, including the process environment, 
  which exposes the JWT signing secret, the database connection string, and 
  connected provider and billing secrets. Because session tokens are signed with
  that secret and carry no expiry, this allows forging a non-expiring session as
  any user, including an administrator, without a password.
