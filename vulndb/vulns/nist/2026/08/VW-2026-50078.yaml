title: GROWI applies its page-viewer permission check to attachment requests 
  only when the request carries an authenticated user. 
  retrieveAttachmentFromIdParam in apps/app/src/server/routes/attachment/get.ts 
  guards the check with a condition requiring the user to be non-null, so a 
  request that carries no session skips the check entirely and the handler 
  returns the file. The routes reached this way, /attachment/:id and 
  /download/:id, take the attachment identifier from the path, so an 
  unauthenticated caller who has an attachment identifier receives the file 
  regardless of whether the page owning it is private and regardless of whether 
  that caller would be permitted to view the page. Identifiers can be retained 
  by a user whose access was later removed, or recovered from anywhere the 
  identifier was previously exposed. Version 8.0.2 runs the check for 
  authenticated and unauthenticated requests alike, skipping it only where a 
  valid share link has already bound the requested file to that link's page
