title: "Origin Validation Error vulnerability in livebook-dev livebook allows untrusted
  notebook output JavaScript to trigger session-wide keyboard shortcuts, including
  forced evaluation of all cells and runtime restart.\n\nLivebook's JS-view feature
  renders notebook-defined JavaScript inside a sandboxed, cross-origin iframe specifically
  because that JavaScript is untrusted. The trusted iframe shell in iframe/priv/static/iframe/v5.html
  forwards every keydown event fired in its own window to the parent page without
  consulting Event.isTrusted, so an event synthesized by the untrusted script through
  window.dispatchEvent is forwarded exactly as a genuine keystroke would be. The parent-side
  relay in assets/js/hooks/js_view.js reconstructs and re-dispatches it on the live
  page with no further validation, and because assets/js/hooks/session.js registers
  the global shortcut handler on the document in the capture phase, that handler acts
  on the replicated event regardless of how it was produced.\n\nSandbox"
