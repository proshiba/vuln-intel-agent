title: Open Library Foundation VuFind v11.0.3 and v4.1 is vulnerable to 
  toInorrect Access Control. The application fails to stop processing an 
  incoming request in VuFind\Controller\AbstractBase::validateAccessPermission 
  after it has found that controller level access permissions do not allow 
  access to the requested function. The requester receives a response indicating
  that access was denied, but the actual function is executed regardless of 
  that.
