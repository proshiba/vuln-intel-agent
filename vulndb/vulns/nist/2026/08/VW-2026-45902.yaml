title: CodeWhale versions >= 0.8.41 and < 0.8.64 contain a vulnerability in the 
  exec_shell_interact (alias exec_interact) tool, whose approval_requirement 
  returns ApprovalRequirement::Auto. This overrides the default Required 
  approval for code-executing tools, so LLM-controlled stdin is written into an 
  already-approved long-running interactive shell (e.g., a python3 -i REPL, 
  mysql, ssh, or sudo -i session) without any approval prompt. An attacker who 
  can inject instructions via untrusted content the agent ingests (a fetched 
  page, MCP result, or repo file) can cause commands to run at the privilege 
  level of that approved process. Fixed in 0.8.64.
