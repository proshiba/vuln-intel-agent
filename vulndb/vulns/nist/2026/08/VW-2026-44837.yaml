title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gpusvm:
  Reject VMAs with VM_IO or VM_PFNMAP when creating SVM ranges\n\nVMAs marked with
  VM_IO or VM_PFNMAP are not backed by struct page\nobjects, which GPUSVM requires
  in order to operate correctly. In\nparticular, get_pages() relies on hmm_range_fault()
  to resolve struct\npages for the target range.\n\nAttempting to create an SVM range
  on such VMAs results in repeated\nget_pages() failures and can lead to an infinite
  loop inside a driver’s\npage‑fault handler. Prevent this by rejecting ranges on
  VM_IO or\nVM_PFNMAP VMAs and returning -EIO."
