title: gitoxide's gix-url crate (<= 0.32.0, fixed in 0.37.1) uses a hand-rolled 
  URL parser that does not treat '?' or '#' as terminating the authority 
  component, contrary to RFC 3986. As a consequence, gix-transport's HTTP 
  redirect identity guard (can_reuse_identity) compares the wrong host and fails
  open. An attacker controlling a redirect response can craft a Location header 
  of the form <attacker-authority>?@<original-authority> so that gitoxide sends 
  the caller's HTTP Basic Authorization credentials to an unintended host. 
  gix-transport is affected in versions <= 0.49.0 (fixed in 0.58.1).
