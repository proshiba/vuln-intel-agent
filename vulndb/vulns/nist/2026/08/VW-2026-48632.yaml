title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: Serialize accesses to the owner and mirror list with separate lock\n\nInteraction
  between KVM_CAP_VM_MOVE_ENC_CONTEXT_FROM and\nKVM_CAP_VM_COPY_ENC_CONTEXT_FROM can
  cause two separate issues:\n\n- in sev_migrate_from(), when the destination KVM
  is a mirror, the mirror\n  entry is moved from the source's list to the owner's
  mirror_vms list,\n  without holding the owner's lock unlike other writers of the
  owner's\n  mirror list (sev_vm_copy_enc_context_from(), sev_vm_destroy()).\n  A
  concurrent COPY or destroy can race with sev_migrate_from() and\n  corrupt the list.\n\
  \n- In sev_vm_destroy(), the *owner* is still active and could receive\n  concurrently
  a KVM_CAP_VM_MOVE_ENC_CONTEXT_FROM that causes\n  sev->enc_context_owner to change.\
  \  In this case the incorrect VM\n  receives kvm_put_kvm().\n\nThe second issue
  needs particular care because the owner could disappear\naltogether (even though
  the race window is impossibly small) "
