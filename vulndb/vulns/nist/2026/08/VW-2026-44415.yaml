title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: use correct direction to set up tunnel route\n\nThe layer 2 encapsulation
  and layer 3 tunnel information in the xmit\npath is taken from the other tuple,
  because the tunnel information that\nis included in the tuple for hashtable lookups
  is also used to perform\nthe egress encapsulation in the transmit path.\n\nThis
  patch uses the correct direction when setting up the tunnel, the\noriginal proposed
  patch to address this fix uses the reversed direction.\n\nWhile at it, remove the
  redundant check to call dst_release() to drop\nthe reference on the dst that was
  obtained from the forward path, which\nis not useful in the direct xmit path unless
  tunneling is performed."
