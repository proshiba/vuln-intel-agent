title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix refcount leak in nvmet_sq_create()\n\nIn nvmet_sq_create(), a reference on the
  ctrl is taken\nvia kref_get_unless_zero() before calling nvmet_check_sqid().\nIf
  nvmet_check_sqid() fails, the function returns the error\ndirectly without releasing
  the reference, leading to a leak.\n\nFix this by jumping to the \"ctrl_put\" label,
  which already\nperforms the necessary nvmet_ctrl_put(ctrl). This ensures the\nreference
  is properly released on this error path."
