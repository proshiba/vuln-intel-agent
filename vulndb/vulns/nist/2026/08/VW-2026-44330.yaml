title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  add journal NULL check in ocfs2_checkpoint_inode()\n\nDuring unmount, ocfs2_journal_shutdown()
  frees the journal and sets\nosb->journal to NULL. Later, when VFS evicts remaining
  cached inodes,\nocfs2_evict_inode() -> ocfs2_clear_inode() -> ocfs2_checkpoint_inode()\n\
  -> ocfs2_ci_fully_checkpointed() dereferences osb->journal, causing a\nNULL pointer
  dereference.\n\nFix this by adding a NULL check for osb->journal in\nocfs2_checkpoint_inode().
  If the journal is NULL, it has already been\nfully flushed and destroyed during
  shutdown, so there is nothing to\ncheckpoint."
