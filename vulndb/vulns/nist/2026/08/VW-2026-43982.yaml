title: "The user-space system-call verifier z_vrfy_z_log_msg_static_create() in subsys/logging/log_msg.c
  was a pure pass-through: it forwarded the caller-supplied source, desc, package,
  and data arguments directly to the kernel-mode implementation z_impl_z_log_msg_static_create()
  without performing any of the mandatory K_SYSCALL_* checks. Because z_log_msg_static_create()
  is declared __syscall, under CONFIG_USERSPACE any unprivileged user-mode thread
  can invoke it directly with fully attacker-controlled arguments.\n\nThe kernel-mode
  handler dereferences each of these untrusted values: frontend_runtime_filtering()
  reads through the source pointer as a struct log_source_dynamic_data, cbprintf_package_copy()
  reads desc.package_len bytes from the package pointer, and z_log_msg_finalize()
  performs a memcpy() of desc.data_len bytes from the data pointer. With no verification,
  a user thread can supply arbitrary kernel addresses and arbitrary lengths, and the
  kernel will read from them.\n\nThe impact is a"
