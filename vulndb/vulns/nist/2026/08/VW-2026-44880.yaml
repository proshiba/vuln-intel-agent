title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  fix uint32_t overflow in EOP ring buffer size alignment\n\neop_ring_buffer_size
  in struct queue_properties is a u32. In\nkfd_queue_acquire_buffers() the expected
  EOP buffer size is computed as\nALIGN(eop_ring_buffer_size, PAGE_SIZE); ALIGN uses
  typeof(x), so the\naddition is done in 32-bit. A user-supplied size of 0xFFFFF001
  wraps to\n0, causing kfd_queue_buffer_get() to skip its exact-size check (gated
  on\nsize != 0) and accept any BO mapped at the address. On GFX8/GFX9 the MQD\ncp_hqd_eop_control
  is then programmed for an 8KB EOP ring backed by a 4KB\nBO, so CP EOP writes can
  land past the buffer and fault the GPU.\n\nCast the operand to u64 so the alignment
  is computed in 64-bit; the size\ncheck in kfd_queue_buffer_get() then rejects the
  oversized request.\n\n(cherry picked from commit ae443117b742c357bfef3a7bddabf76fcf86e9ef)"
