title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio-ap:
  always filter entire AP matrix\n\nThe vfio_ap_mdev_filter_matrix function is called
  whenever a new adapter or\ndomain is assigned to the mdev. The purpose of the function
  is to update\nthe guest's AP configuration by filtering the matrix of adapters and\n\
  domains assigned to the mdev. When an adapter or domain is assigned, only\nthe APQNs
  associated with the APID of the new adapter or APQI of the new\ndomain are inspected.
  If an APQN does not reference a queue device bound to\nthe vfio_ap device driver,
  then it's APID will be filtered from the mdev's\nmatrix when updating the guest's
  AP configuration.\n\nInspecting only the APID of the new adapter or APQI of the
  new domain will\nresult in passing AP queues through to a guest that are not bound
  to the\nvfio_ap device driver under certain circumstances. Consider the following:\n\
  \nguest's AP configuration (all also assigned to the mdev's matrix):\n14.0004\n\
  14.0005\n14.0006\n16"
