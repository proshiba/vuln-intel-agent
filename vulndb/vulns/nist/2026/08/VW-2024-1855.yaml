title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  iscsi: Fix conn use after free during resets\n\nIf we haven't done a unbind target
  call we can race where\niscsi_conn_teardown wakes up the EH thread and then frees
  the conn while\nthose threads are still accessing the conn ehwait.\n\nWe can only
  do one TMF per session so this just moves the TMF fields from\nthe conn to the session.
  We can then rely on the\niscsi_session_teardown->iscsi_remove_session->__iscsi_unbind_session
  call\nto remove the target and it's devices, and know after that point there is\n\
  no device or scsi-ml callout trying to access the session."
