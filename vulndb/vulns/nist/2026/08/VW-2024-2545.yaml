title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  fix warning when destroy 'cifs_io_request_pool'\n\nThere's a issue as follows:\n\
  WARNING: CPU: 1 PID: 27826 at mm/slub.c:4698 free_large_kmalloc+0xac/0xe0\nRIP:
  0010:free_large_kmalloc+0xac/0xe0\nCall Trace:\n <TASK>\n ? __warn+0xea/0x330\n\
  \ mempool_destroy+0x13f/0x1d0\n init_cifs+0xa50/0xff0 [cifs]\n do_one_initcall+0xdc/0x550\n\
  \ do_init_module+0x22d/0x6b0\n load_module+0x4e96/0x5ff0\n init_module_from_file+0xcd/0x130\n\
  \ idempotent_init_module+0x330/0x620\n __x64_sys_finit_module+0xb3/0x110\n do_syscall_64+0xc1/0x1d0\n\
  \ entry_SYSCALL_64_after_hwframe+0x77/0x7f\n\nObviously, 'cifs_io_request_pool'
  is not created by mempool_create().\nSo just use mempool_exit() to revert 'cifs_io_request_pool'."
