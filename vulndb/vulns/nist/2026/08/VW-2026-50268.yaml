title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Improve EP11 CPRB length and overflow checks\n\nThe xcrb_msg_to_type6_ep11cprb_msgx()
  function lacks proper input\nvalidation, creating security vulnerabilities:\n1.
  Missing minimum size validation: The ep11_cprb structure and\n   subsequent payload
  fields (pld_tag, pld_lenfmt) are copied from\n   userspace without verifying sufficient
  buffer length.\n2. Arithmetic overflow in length calculations: CEIL4 alignment could\n\
  \   overflow, bypassing size checks and enabling buffer overflows.\n3. The payload
  is asn1 encoded but the function just uses a simple c\n   struct overlay to access
  some fields of the payload.\n\nFix by using size_t for length calculations, adding
  U32_MAX boundary\nchecks after alignment, and validating minimum request size and\n\
  minimum reply size before copying from userspace. Do a very simple\nasn1 parsing
  of the payload up to the function value field."
