title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc3-control: Fix heap overflow in bytes_ext put/get\n\nThe ipc_control_data
  buffer is allocated as kzalloc(max_size), where\nmax_size covers the entire struct
  sof_ipc_ctrl_data including its\nflexible array payload. However, the bounds checks
  in bytes_ext_put\nand _bytes_ext_get compared user data lengths against max_size\n\
  directly, ignoring that cdata->data sits at an offset of\nsizeof(struct sof_ipc_ctrl_data)
  bytes into the allocation.\n\nThis allowed writing up to sizeof(struct sof_ipc_ctrl_data)
  bytes past\nthe end of the heap buffer from unprivileged userspace via the ALSA
  TLV\nkcontrol interface, and similarly allowed over-reading adjacent heap\ndata
  on the get path.\n\nFix all bounds checks to subtract sizeof(*cdata) from max_size
  so they\nreflect the actual space available at the cdata->data offset. Also fix\n\
  the error-path restore in bytes_ext_put which wrote to cdata->data\ninstead of cdata,
