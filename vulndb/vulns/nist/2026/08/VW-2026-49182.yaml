title: "Insufficient Session Expiration vulnerability in the OAuth token refresh grant
  in hexpm hexpm allows a user removed from an organization to keep reading its private
  packages.\n\nexpand_repositories_scope/3 in lib/hexpm/permissions.ex only rewrites
  the literal repositories scope, so an explicitly granted repository:<org> or docs:<org>
  scope passes through it untouched. The refresh grant re-derives a new token from
  the stored granted_scopes, which holds that expanded form, so every refresh reproduces
  the organization scope without revisiting membership. Because both CDN edges authorize
  repository access from the token claim without querying the database, an account
  removed from an organization retains read access for as long as it keeps refreshing,
  bounded by the 30 day refresh token lifetime rather than the 30 minute access token
  lifetime.\n\nThis issue affects hex.pm: from 2025-10-10 before 2026-08-24."
