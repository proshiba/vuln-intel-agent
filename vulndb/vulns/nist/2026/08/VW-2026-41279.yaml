title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ti: vpe: Fix the error code of devm_kzalloc() in vip_probe_slice()\n\nIn vip_probe_slice(),
  the error check for devm_kzalloc() incorrectly\nuses PTR_ERR_OR_ZERO() which returns
  0 for NULL pointer.\n\nReturn -ENOMEM for devm_kzalloc() failure."
