title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  abort in rename_exchange if we fail to insert the second ref\n\nError injection
  stress uncovered a problem where we'd leave a dangling\ninode ref if we failed during
  a rename_exchange.  This happens because\nwe insert the inode ref for one side of
  the rename, and then for the\nother side.  If this second inode ref insert fails
  we'll leave the first\none dangling and leave a corrupt file system behind.  Fix
  this by\naborting if we did the insert for the first inode ref."
