title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  drop __init from vec_check_unaligned_access_speed_all_cpus\n\nThis function runs
  within a kthread and need not necessarily finish\nbefore system finishes boot and
  free_initmem() unmaps the .init.text\nsection. This function makes calls to SBI
  for probing unaligned access\nspeed, and if this is slow for some reason (say some
  debug prints were\nadded to SBI), the kthread can still be running at this point
  and result\nin an instruction page fault when trying to fetch from the freed region.\n\
  \n[   25.642087] Unable to handle kernel paging request at virtual address ffffffff80a04ef8\n\
  [   25.646694] Current vec_check_unali pgtable: 4K pagesize, 48-bit VAs, pgdp=0x00004000316e9000\n\
  [   25.653170] [ffffffff80a04ef8] pgd=000010004be7e401, p4d=000010004be7e401, pud=000010004be7e001,
  pmd=000010000c3000e3\n[   25.661244] Oops [#1]\n[   25.662997] Modules linked in:\n\
  [   25.665357] CPU: 3 UID: 0 PID: 42 Comm: vec_check_unali Not tainted "
