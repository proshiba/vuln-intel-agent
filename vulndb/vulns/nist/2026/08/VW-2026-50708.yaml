title: "SerializingHttpMessageConverter deserializes the body of incoming HTTP requests
  with a raw java.io.ObjectInputStream and no class filtering. Any request with Content-Type
  application/x-java-serialized-object whose body resolves to a Serializable type
  is read directly via readObject(). If an application using this converter on an
  inbound HTTP endpoint has any known Java deserialization \"gadget\" on its classpath,
  a remote, unauthenticated attacker can achieve arbitrary code execution.\nSpring
  Integration 7.1.0\nSpring Integration 7.0.0 - 7.0.5\nSpring Integration 6.5.0 -
  6.5.10\nSpring Integration 6.4.0 - 6.4.12\nSpring Integration 5.5.21 and earlier"
