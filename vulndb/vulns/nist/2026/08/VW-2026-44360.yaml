title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs3:
  validate split-point offset in indx_insert_into_buffer\n\nindx_insert_into_buffer()
  computes\n\n    used = used1 - to_copy - sp_size;\n    memmove(de_t, Add2Ptr(sp,
  sp_size), used - le32_to_cpu(hdr1->de_off));\n\nwhere sp and sp_size come from hdr_find_split().\
  \  hdr_find_split()\nwalks entries by le16_to_cpu(e->size) without validating that
  each\nstep stays within hdr->used or that the size field is at least\nsizeof(struct
  NTFS_DE).  index_hdr_check(), the on-load gatekeeper,\nonly validates header-level
  fields (used, total, de_off) and does\nnot walk per-entry sizes.\n\nA crafted NTFS
  image whose leaf INDEX_HDR reports used == total but\ncontains one interior NTFS_DE
  with size = 0xFFF0 therefore passes\nvalidation, descends to indx_insert_into_buffer()
  through the\nntfs_create() -> indx_insert_entry() path, and makes hdr_find_split()\n\
  return an sp whose sp_size (0xFFF0) greatly exceeds the remaining\nbytes in the
  buffer.  The u3"
