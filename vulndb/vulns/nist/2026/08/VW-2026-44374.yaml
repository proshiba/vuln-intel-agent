title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  free volume-wide resources on fill_super failure\n\nntfs_fill_super()'s err_out_now
  path frees only the volume struct via\nkfree(vol), leaving several vol-owned allocations
  behind on every mount\nfailure:\n\n  - vol->nls_map, loaded by ntfs_init_fs_context()
  via\n    load_nls_default() (or replaced by an explicit nls= option in\n    ntfs_parse_param()),
  is never unload_nls()'d.\n\n  - vol->volume_label, allocated by load_system_files()
  through\n    ntfs_ucstonls() once the $Volume name attribute has been parsed, is\n\
  \    not released by load_system_files()'s own error labels nor by the\n    fill_super()
  inline cleanup that only runs on d_make_root()\n    failure.  Any later failure
  inside load_system_files() leaks it.\n\n  - vol->lcn_empty_bits_per_page was kvfree()'d
