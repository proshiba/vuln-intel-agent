title: FreeCAD is a free and open-source multiplatform 3D parametric modeler. 
  Prior to 1.1.2, src/App/PropertyPythonObject.cpp in 
  PropertyPythonObject::Restore() passes the attacker-controlled module 
  attribute from serialized PropertyPythonObject XML directly to 
  PyImport_ImportModule() while restoring a crafted FCStd document, which 
  executes module-level Python code, and the legacy pickle branch also imports 
  an attacker-controlled module and invokes its class constructor through 
  PyObject_CallObject(). This issue is fixed in version 1.1.2.
