title: The TranslatePress – Translate Multilingual sites with AI Translation 
  plugin for WordPress is vulnerable to Sensitive Information Exposure in all 
  versions up to, and including, 3.3.1 via the 'trp_get_translations_regular' 
  AJAX action. This makes it possible for unauthenticated attackers to extract 
  the raw administrator password-reset URL — including the plaintext reset key 
  and login parameters stored in the translation dictionary table — enabling 
  full administrator account takeover. This vulnerability is only exploitable 
  when automatic string saving is enabled (the default setting) and the target 
  administrator's profile locale is set to a published secondary language, as 
  these conditions cause the password-reset URL to be persisted as a 
  translatable string in the secondary-language dictionary table.
