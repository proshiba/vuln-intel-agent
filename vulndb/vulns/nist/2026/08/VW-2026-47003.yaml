title: A vulnerability has been found in BusyBox up to 1.30.1. This 
  vulnerability affects unknown code of the file networking/wget.c of the 
  component FEATURE_WGET_TIMEOUT Handler. Such manipulation of the argument -T 
  leads to null pointer dereference. Local access is required to approach this 
  attack. The exploit has been disclosed to the public and may be used. The name
  of the patch is 83a40bf7a93c8ac093d33ab452222dd5b9eb57ff. A patch should be 
  applied to remediate this issue.
