title: The WPvivid Backup & Migration plugin for WordPress is vulnerable to SQL 
  Injection via the export_data parameter in versions up to, and including, 
  0.9.131. This is due to insufficient escaping on the user supplied parameter 
  and lack of sufficient preparation on the existing SQL query. The values are 
  received in prepare_export_post(), passed through sanitize_text_field() and 
  stripslashes(), JSON-decoded, and the attacker-controlled JSON object keys are
  collected as $posts_ids without integer casting. They are stored in the export
  task options and later joined with commas and interpolated directly into a 
  `WHERE ID IN (...)` clause inside a $wpdb->get_results() call in 
  export_post_to_xml() (unquoted, numeric context), with no $wpdb->prepare() or 
  esc_sql(). This makes it possible for authenticated attackers, with 
  Administrator-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database.
