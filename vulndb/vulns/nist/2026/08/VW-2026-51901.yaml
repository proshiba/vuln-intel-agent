title: A vulnerability was determined in NASA Trick 19.6.0. This issue affects 
  the function JSONVariableServerThread::parse_request of the file 
  trick_source/sim_services/JSONVariableServer/JSONVariableServerThread.cpp of 
  the component TCP Socket Handler. This manipulation causes stack-based buffer 
  overflow. The attack is possible to be carried out remotely. The vendor was 
  contacted early about this disclosure but did not respond in any way.
