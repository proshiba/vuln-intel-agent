title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/timerlat:
  Only clear timer if a kthread exists\n\nThe timerlat tracer can use user space threads
  to check for osnoise and\ntimer latency. If the program using this is killed via
  a SIGTERM, the\nthreads are shutdown one at a time and another tracing instance
  can start\nup resetting the threads before they are fully closed. That causes the\n\
  hrtimer assigned to the kthread to be shutdown and freed twice when the\ndying thread
  finally closes the file descriptors, causing a use-after-free\nbug.\n\nOnly cancel
  the hrtimer if the associated thread is still around. Also add\nthe interface_lock
  around the resetting of the tlat_var->kthread.\n\nNote, this is just a quick fix
  that can be backported to stable. A real\nfix is to have a better synchronization
  between the shutdown of old\nthreads and the starting of new ones."
