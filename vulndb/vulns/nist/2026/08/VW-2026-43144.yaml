title: Prompty is a markdown file format (.prompty) for LLM prompts. Prior to 
  0.1.5 and 2.0.0-beta.5, the TypeScript Nunjucks renderer evaluated untrusted 
  .prompty template bodies with unrestricted JavaScript member access. An 
  attacker-controlled template could traverse constructor and prototype 
  properties to execute JavaScript in the host Node.js process. This issue is 
  fixed in versions 0.1.5 and 2.0.0-beta.5.
