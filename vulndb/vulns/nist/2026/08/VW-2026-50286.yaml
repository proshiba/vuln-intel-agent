title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  sloppy-logic-analyzer: fix use-after-free via debugfs trigger on unbind\n\nThe \"\
  trigger\" debugfs file has a hand-rolled ->write handler\n(trigger_write()) that
  dereferences the per-device gpio_la_poll_priv. The\nfile is created with debugfs_create_file_unsafe(),
  and the handler never\ntakes a debugfs reference. Nothing keeps the object alive
  while the\nhandler runs.\n\npriv is allocated with devm_kzalloc(). devres frees
  it when the platform\ndevice is unbound. debugfs_create_file_unsafe() installs no
  full_proxy\nwrapper, so debugfs_remove_recursive() in gpio_la_poll_remove() does
  not\nwait for an in-flight trigger_write(). The blob_lock taken there does not\n\
  help, because trigger_write() never takes it. A write that races an unbind\ntherefore
  writes into freed memory:\n\n  trigger_write()                  gpio_la_poll_remove()\n\
  \    priv = m->private\n    buf = memdup_user()  [may sleep]\n                 \
  \                    mutex"
