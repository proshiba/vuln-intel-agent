title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (asus_atk0110) Check package count before accessing element\n\natk_ec_present()
  walks the management group package returned by the GGRP\nACPI method and, for each
  sub-package, reads its first element:\n\n\tid = &obj->package.elements[0];\n\tif
  (id->type != ACPI_TYPE_INTEGER)\n\nwithout checking that the sub-package is non-empty.\
  \  ACPICA allocates the\nelement array with exactly package.count entries, so for
  a sub-package\nwith a zero count this reads past the allocation.\n\nThe sibling
  function atk_debugfs_ggrp_open() performs the same access but\nskips empty packages
  with a package.count check first.  Add the same\ncheck to atk_ec_present() so a
  malformed firmware package cannot trigger\nan out-of-bounds read."
