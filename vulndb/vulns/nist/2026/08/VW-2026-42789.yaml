title: "When OAuth authentication is enabled and browser-facing TLS terminates at
  a reverse proxy that forwards the callback to Temporal UI Server over HTTP, affected
  versions derive authentication-cookie Secure attributes from the proxy-to-server
  connection. Temporal UI Server can therefore issue access-token cookies, and refresh-token
  cookies when provided by the identity provider, without Secure even though the browser
  completed login over HTTPS.\n\n\n\nA victim who visits attacker-controlled content
  while a credential remains live may expose that credential only if the attacker
