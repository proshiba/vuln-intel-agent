title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix potential use-after-free bug when trimming caps\n\nWhen trimming the caps and
  just after the 'session->s_cap_lock' is\nreleased in ceph_iterate_session_caps()
  the cap maybe removed by\nanother thread, and when using the stale cap memory in
  the callbacks\nit will trigger use-after-free crash.\n\nWe need to check the existence
  of the cap just after the 'ci->i_ceph_lock'\nbeing acquired. And do nothing if it's
  already removed."
