title: "### Summary\n\n\n\n`qs.stringify` throws a `TypeError` when it serializes
  an object whose own `constructor` property has a truthy, non-callable `isBuffer`
  member. `utils.isBuffer` duck-types buffers by calling `obj.constructor.isBuffer(obj)`
  after checking only that the property is truthy, so a value such as `{ constructor:
  { isBuffer: \"x\" } }` makes the call throw `TypeError: obj.constructor.isBuffer
  is not a function`.\n\n\n\n### Details\n\n\n\n`lib/stringify.js:127` calls `utils.isBuffer`
  on every non-primitive value it serializes. `utils.isBuffer` (`lib/utils.js:332`)
  reads `obj.constructor.isBuffer` and invokes it without verifying that it is a function.
  `constructor` and `isBuffer` are ordinary property names, so any object carrying
  them as own properties reaches the unchecked call.\n\n\n\nSuch an object can be
