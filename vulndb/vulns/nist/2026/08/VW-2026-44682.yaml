title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mana: initialize gdma queue id to INVALID_QUEUE_ID\n\nmana_gd_create_mana_wq_cq()
  leaves queue->id as 0 (from kzalloc_obj())\nuntil mana_create_wq_obj() assigns the
  firmware-returned id. If creation\nfails before that, cleanup calls mana_gd_destroy_cq()
  with id 0, NULLing\ngc->cq_table[0] and silently breaking whichever real CQ owns
  that slot.\n\nInitialize queue->id to INVALID_QUEUE_ID right after allocation, matching\n\
  mana_gd_create_eq(). The existing (id >= max_num_cqs) guard then\nshort-circuits
  cleanly."
