title: VeraCrypt provides disk encryption with strong security based on 
  TrueCrypt. From 1.26.6 until 1.26.29, file-hosted hidden volume creation 
  forces quick format and the FormatNoFs function in src/Common/Format.c and 
  FormatFat function in src/Common/Fat.c use WriteFile to place raw zeroed 
  sectors at predictable 128 MiB intervals. These writes bypass the normal 
  EncryptDataUnits formatting path, leaving deterministic plaintext markers in 
  an area expected to resemble random ciphertext. The markers can weaken 
  plausible deniability during forensic inspection, although they do not 
  disclose hidden-volume content or reduce the strength of VeraCrypt encryption.
  This issue is fixed in version 1.26.29.
