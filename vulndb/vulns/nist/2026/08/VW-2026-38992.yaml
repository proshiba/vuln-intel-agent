title: A vulnerability was determined in Wavlink WL-NU516U1 708c073-mt7628. 
  Affected is the function set_sys_adm of the file adm.cgi of the component 
  Admin Password Handler. This manipulation causes os command injection. The 
  attack is possible to be carried out remotely. The exploit has been publicly 
  disclosed and may be utilized. It is suggested to upgrade the affected 
  component. The vendor was contacted early, responded in a very professional 
  manner and quickly released a fixed version of the affected product.
