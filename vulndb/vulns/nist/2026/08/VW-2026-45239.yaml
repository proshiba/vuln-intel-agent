title: openssl_encrypt (pip) versions <= 1.4.7 contain an information exposure 
  vulnerability where the 'hsm fido2-test' and 'hsm onlykey-test' diagnostic 
  commands unconditionally print the full derived hardware pepper as hex to 
  stdout/stderr (crypt_cli.py, handle_hsm_command). The printed value can 
  persist in terminal scrollback, session recordings, or CI logs. Impact is 
  limited because the pepper is derived from a random per-invocation test salt 
  and is salt-bound, so the leaked value cannot be used to decrypt real files. A
  related plugin issue logged raw prf_data outside the secret-redaction path. 
  Fixed in 1.4.8 (and 1.5.0) by removing the hex dumps and routing plugin debug 
  output through the redaction layer.
