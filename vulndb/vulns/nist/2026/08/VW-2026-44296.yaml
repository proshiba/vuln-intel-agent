title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetdev-genl:
  report NAPI thread PID in the caller's pid namespace\n\nnetdev_nl_napi_fill_one()
  reports the NAPI kthread PID in NETDEV_A_NAPI_PID\nusing task_pid_nr(), which returns
  the PID in the initial pid namespace.\n\nNETDEV_CMD_NAPI_GET does not have GENL_ADMIN_PERM
  and the netdev genl family\nis netnsok, so a caller in a child pid namespace can
  issue it. That caller\nthen sees the kthread's global PID, even though the kthread
  is not visible\nin its pid namespace, where the value should be 0.\n\nTranslate
  the PID through the caller's pid namespace, the same way commit\n3799c2570982 (\"\
  io_uring/fdinfo: translate SqThread PID through caller's\npid_ns\") did for the
  io_uring SQPOLL thread. The doit and dumpit paths both\nrun synchronously in the
  caller's context, so task_active_pid_ns(current) is\nthe caller's pid namespace."
