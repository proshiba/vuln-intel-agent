title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: reallocate update replies for mismatched IDs\n\novs_flow_cmd_new()
  preallocates the optional reply skb before it takes\novs_mutex and before it knows
  which existing flow will be updated.\n\nThat is normally fine because the skb is
  sized from the request flow\nidentifier.  That identifier also becomes the inserted
  flow's identifier.\nFor updates, however, a request with a UFID may miss the UFID
  lookup and\nthen fall back to the flow key lookup.  That lookup can legitimately
  find\nan existing key-identified flow.  UFIDs are optional and the flow key is\n\
  the primary identifier.\n\nFor echoed replies, ovs_flow_cmd_fill_info() writes the
  matched flow's\nidentifier, not the request identifier used for the preallocation.\
  \  A short\nrequest UFID can therefore leave too little room for the key identifier.\n\
  The fill can then fail with -EMSGSIZE and hit the BUG_ON(error < 0) in the\nupdate
