title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  txgbe: fix FDIR filter leak on remove\n\nPerfect FDIR filters can be added while
  the interface is down and are\nkept on the software list for later restore. unregister_netdev()
  only\ncalls ndo_stop when the device is up, so txgbe_fdir_filter_exit() in\ntxgbe_close()
  is skipped in that case and the filters are leaked on\ndriver remove. Free the filter
  list from txgbe_remove() as well."
