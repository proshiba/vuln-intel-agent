title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to avoid touching checkpointed data in get_victim()\n\nIn CP disabling mode,
  there are two issues when using LFS or SSR | AT_SSR\nmode to select victim:\n\n\
  1. LFS is set to find source section during GC, the victim should have\nno checkpointed
  data, since after GC, section could not be set free for\nreuse.\n\nPreviously, we
  only check valid chpt blocks in current segment rather\nthan section, fix it.\n\n\
  2. SSR | AT_SSR are set to find target segment for writes which can be\nfully filled
  by checkpointed and newly written blocks, we should never\nselect such segment,
  otherwise it can cause panic or data corruption\nduring allocation, potential case
  is described as below:\n\n a) target segment has 'n' (n < 512) ckpt valid blocks\n\
  \ b) GC migrates 'n' valid blocks to other segment (segment is still\n    in dirty
  list)\n c) GC migrates '512 - n' blocks to target segment (segment has 'n'\n   \
  \ cp_vblocks and '512 - n' vblocks)\n d) If GC"
