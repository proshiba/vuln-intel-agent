title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix off-by-one in mapping pairs decoding bounds checks\n\nIn ntfs_mapping_pairs_decompress(),
  attr_end points one byte past the\nend of the attribute record:\n\n    attr_end
  = (u8 *)attr + le32_to_cpu(attr->length);\n\nThe two bounds checks validating that
  mapping pair data bytes fit within\nthe attribute use strict greater-than (>), which
  allows a one-byte\nout-of-bounds read when the data extends exactly to attr_end:\n\
  \n  b = *buf & 0xf;\n  if (b) {\n      if (unlikely(buf + b > attr_end))   // off-by-one\n\
  \          goto io_error;\n      for (deltaxcn = (s8)buf[b--]; b; b--)\n       \
  \   deltaxcn = (deltaxcn << 8) + buf[b];\n  }\n\nWhen buf + b == attr_end, the check
  evaluates to false and buf[b] reads\none byte past the valid attribute boundary.
  The same pattern appears in\nthe LCN delta bytes check.\n\nFix both checks to use
  >= so that buf[b] at exactly attr_end is\ncorrectly rejected as out of bounds."
