title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  probes: save original sp in rethook trampoline\n\nReading a word from the stack
  in a kretprobe crashes a risc-v kernel.\n\n$ cd /sys/kernel/tracing/\n$ echo 'r
  n_tty_write $stack0' > dynamic_events\n$ echo 1 > events/kprobes/enable\nUnable
  to handle kernel paging request at virtual address 0000000200000128\n...\n[<ffffffff80016d16>]
  regs_get_kernel_stack_nth+0x26/0x38\n[<ffffffff80177196>] process_fetch_insn+0x3ee/0x760\n\
  [<ffffffff80177836>] kretprobe_trace_func+0x116/0x1f0\n[<ffffffff8017795a>] kretprobe_dispatcher+0x4a/0x58\n\
  [<ffffffff8013572e>] kretprobe_rethook_handler+0x5e/0x90\n[<ffffffff80180838>] rethook_trampoline_handler+0x70/0x108\n\
  [<ffffffff8001ba32>] arch_rethook_trampoline_callback+0x12/0x1c\n[<ffffffff8001ba84>]
  arch_rethook_trampoline+0x48/0x94\n[<ffffffff8067872a>] tty_write+0x1a/0x30\n\n\
  In regs_get_kernel_stack_nth, regs->sp contains an arbitrary value.\n\narch_rethook_trampoline
  saves the registers from the probe"
