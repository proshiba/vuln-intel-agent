title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  check amdgpu_vm_bo_find() result in GET_MAPPING_INFO\n\nThe AMDGPU_GEM_OP_GET_MAPPING_INFO
  path of amdgpu_gem_op_ioctl() looks\nup the bo_va for the buffer object in the caller's
  VM via\namdgpu_vm_bo_find(), but uses the returned pointer without checking it.\n\
  \namdgpu_vm_bo_find() returns NULL when the BO has no bo_va in that VM,\nwhich is
  the normal case for a BO that has never been mapped. The result\nis fed straight
  into amdgpu_vm_bo_va_for_each_valid_mapping(), which\nexpands to list_for_each_entry(mapping,
  &(bo_va)->valids, list) and\ndereferences bo_va, causing a NULL pointer dereference.\n\
  \nThis is reachable by any process able to issue the ioctl (render group)\nsimply
  by requesting mapping info for an unmapped BO.\n\nReturn -ENOENT when no bo_va is
  found, jumping to out_exec so the\ndrm_exec context and GEM object reference are
  released.\n\n(cherry picked from commit 528b19377affc1cc7362a70a254c1dda793595f9)"
