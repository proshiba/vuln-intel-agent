title: "In the Linux kernel, the following vulnerability has been resolved:\n\nof:
  reserved_mem: prevent OOB when too many dynamic regions are defined\n\nOn boot,
  fdt_scan_reserved_mem() saves each dynamically-placed\n/reserved-memory subnode
  into a local array of size\nMAX_RESERVED_REGIONS.\n\nIf the device tree defines
  more than MAX_RESERVED_REGIONS\ndynamically-placed regions, fdt_scan_reserved_mem()
  writes past the\nend of the local array.\n\nAdd a bounds check that logs an error
  and skips the excess regions,\nrestoring the original behavior."
