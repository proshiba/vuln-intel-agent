title: SAP Approuter does not consistently enforce integrity verification on 
  certain session-related request headers under specific conditions. An attacker
  with low privileges could send a specially crafted request that bypasses the 
  integrity check and loads another user's session context. Successful 
  exploitation requires the attacker to have previously observed matching 
  session values out-of-band, which makes the attack complex to execute. This 
  could result in a high impact on confidentiality and a low impact on 
  integrity. There is no impact on availability.
