title: rsync before 3.5.0 contains a symlink race condition vulnerability in the
  sender's source tree traversal that allows an attacker who can manipulate a 
  parent directory of the source tree to redirect file reads to unintended 
  paths. Attackers can atomically replace a parent directory component with a 
  symlink pointing outside the source root between path resolution and file open
  operations to disclose file contents outside the intended transfer root.
