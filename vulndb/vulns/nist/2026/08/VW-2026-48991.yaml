title: "RansomLook contains a missing authentication vulnerability in the /admin/crypto/group/new
  endpoint. While the endpoint provides an administrative function for creating new
  crypto group entries, it was not protected by the application's authentication mechanism.\n\
  \nAn unauthenticated remote attacker able to access the RansomLook web interface
  could therefore submit requests to this endpoint and create crypto group entries
  without possessing a valid authenticated session or administrative credentials.\n\
