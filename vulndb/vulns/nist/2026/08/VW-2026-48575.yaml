title: "Punk::OAuth2::Server versions through 0.03 for Perl issue access tokens outside
  a client's registered scopes and grant types because no authorization path reads
  them.\n\nPunk::OAuth2::Server::Store registers scopes and grant_types per client
  and documents both as client registration. token dispatches on the grant_type in
  the request body, so a client registered for authorization_code alone can ask for
  client_credentials, and that arm passes the requested scope straight to the minter,
  which signs it into the at+jwt access token. authorize copies the query scope into
  the authorization code record without comparing it against the registration, leaving
  the optional consent hook as the only check between an arbitrary scope and the issued
  code. redirect_uris on the same client row is read and enforced.\n\nA registered
  client can obtain a correctly signed token carrying any scope it names, and a resource
  server running Punk::OAuth2::Checker accepts that token and honours the scope. A
