title: A flaw was found in sblim-sfcb. A local, low-privileged attacker can 
  exploit a race condition during privileged instance migration by manipulating 
  a temporary file in the `/tmp` directory. By repeatedly recreating a symbolic 
  link, the attacker can redirect privileged output to an arbitrary file. This 
  can lead to privileged file corruption or a denial of service (DoS) on the 
  system.
