title: "Key exchange without entity authentication in the EMR SSH helper commands
  in Amazon AWS CLI before 1.45.28 and AWS CLI v2 before 2.35.3 might allow man-in-the-middle
  attackers to intercept SSHsessions and file transfers via network positioning between
  the client and the EMR cluster endpoint.\n\n\n\nTo remediate this issue, users should
  upgrade to AWS CLI v1 1.45.28 or later, or AWS CLI v2 2.35.3 or later."
