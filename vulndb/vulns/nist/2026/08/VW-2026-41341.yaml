title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/sysfb:
  Avoid possible truncation with calculating visible size\n\nCalculating the visible
  size of the system framebuffer can result in\ntruncation of the result. The calculation
  uses 32-bit arithmetics,\nwhich can overflow if the values for height and stride
  are large. Fix\nthe issue by multiplying with mul_u32_u32()."
