title: Ghostwriter before 7.1.2 fails to validate template ownership in the 
  report template swap endpoint, allowing attackers to attach client-scoped 
  templates from other clients to their own reports. Attackers can exploit 
  sequential template primary keys to enumerate and attach foreign templates, 
  then generate reports to disclose template contents including letterhead, 
  boilerplate, and methodology text.
