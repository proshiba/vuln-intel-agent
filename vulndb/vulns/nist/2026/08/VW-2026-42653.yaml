title: OpenIM Server v3.8.3 contains a missing authorization vulnerability that 
  allows any authenticated user to access admin-only management API endpoints by
  submitting POST requests with a regular user bearer token to /user/get_users, 
  /user/get_all_users_uid, and /group/get_groups. Attackers can exploit the 
  absent authverify.CheckAdmin() call in the GetPaginationUsers, GetAllUserID, 
  and GetGroups handlers to enumerate all platform user accounts including 
  userIDs, nicknames, and manager level flags, as well as all groups including 
  private groups the user has never joined, exposing group names, owner IDs, and
  member counts.
