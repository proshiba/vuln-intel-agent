title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: dummy_hcd: prevent fifo_req reuse during giveback\n\ndummy_hcd embeds a
  single shared usb_request (dum->fifo_req) that the\n\"emulated single-request FIFO\"\
  \ fast-path in dummy_queue() reuses for\nsmall IN transfers: it copies the caller's
  request into it\n(req->req = *_req) and queues it, treating list_empty(&fifo_req.queue)\n\
  as \"the slot is free\".\n\nThe completion side (dummy_timer/transfer/nuke/dummy_dequeue)
  follows\nthe standard pattern: list_del_init(&req->queue) unlinks the request,\n\
  then the lock is dropped and usb_gadget_giveback_request() invokes\nreq->complete().\
  \  But list_del_init() makes fifo_req.queue look empty\n*before* the completion
  callback returns, so a concurrent dummy_queue()\non another CPU sees the slot as
  free, reuses fifo_req and runs\nreq->req = *_req -- overwriting req->complete while
  dummy_timer is\nmid-calling it.  The indirect call then jumps to a clobbered pointer,\n\
  causing a general protect"
