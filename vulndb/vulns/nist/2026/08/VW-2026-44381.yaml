title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/memory_hotplug:
  fix incorrect altmap passing in error path\n\nIn create_altmaps_and_memory_blocks(),
  when arch_add_memory() succeeds\nwith memmap_on_memory enabled, the vmemmap pages
  are allocated from\nparams.altmap.  If create_memory_block_devices() subsequently
  fails, the\nerror path calls arch_remove_memory() with a NULL altmap instead of\n\
  params.altmap.\n\nThis is a bug that could lead to memory corruption.  Since altmap
  is NULL,\nvmemmap_free() falls back to freeing the vmemmap pages into the system\n\
  buddy allocator via free_pages() instead of the altmap. \narch_remove_memory() then
  immediately destroys the physical linear mapping\nfor this memory.  This injects
  unowned pages into the buddy allocator,\ncausing machine checks or memory corruption
  if the system later attempts\nto allocate and use those freed pages.\n\nFix this
  by passing params.altmap to arch_remove_memory() in the error\npath."
