title: "In the Linux kernel, the following vulnerability has been resolved:\n\nubifs:
  rename_whiteout: Fix double free for whiteout_ui->data\n\n'whiteout_ui->data' will
  be freed twice if space budget fail for\nrename whiteout operation as following
  process:\n\nrename_whiteout\n  dev = kmalloc\n  whiteout_ui->data = dev\n  kfree(whiteout_ui->data)\
  \  // Free first time\n  iput(whiteout)\n    ubifs_free_inode\n      kfree(ui->data)\t\
  \    // Double free!\n\nKASAN reports:\n==================================================================\n\
  BUG: KASAN: double-free or invalid-free in ubifs_free_inode+0x4f/0x70\nCall Trace:\n\
  \  kfree+0x117/0x490\n  ubifs_free_inode+0x4f/0x70 [ubifs]\n  i_callback+0x30/0x60\n\
  \  rcu_do_batch+0x366/0xac0\n  __do_softirq+0x133/0x57f\n\nAllocated by task 1506:\n\
  \  kmem_cache_alloc_trace+0x3c2/0x7a0\n  do_rename+0x9b7/0x1150 [ubifs]\n  ubifs_rename+0x106/0x1f0
  [ubifs]\n  do_syscall_64+0x35/0x80\n\nFreed by task 1506:\n  kfree+0x117/0x490\n\
