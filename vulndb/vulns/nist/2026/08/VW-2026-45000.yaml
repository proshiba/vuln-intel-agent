title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkeys:
  fix out-of-bounds read in keyring_get_key_chunk()\n\nFor description-level chunks
  keyring_get_key_chunk() advances the read\npointer by level * sizeof(long) past
  the inline prefix but only\nbounds-checks the prefix, so a long enough key description
  is read past\nits kmemdup(desc, desc_len + 1) allocation.  Compute the full byte\n\
  offset and bounds-check the description against it before reading.\n\nThe walk only
  reaches a description-level chunk when two keys collide\nthrough the hash, x, type
  and domain_tag chunks, so this is reached from\nan unprivileged add_key(2) with
  a crafted pair of same-type keys whose\nindex hashes collide; KASAN reports a slab-out-of-bounds
  read."
