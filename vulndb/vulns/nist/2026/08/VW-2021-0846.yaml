title: "An elevation of privilege vulnerability exists because of overly permissive
  Access Control Lists (ACLs) on multiple system files, including the Security Accounts
  Manager (SAM) database. An attacker who successfully exploited this vulnerability
  could run arbitrary code with SYSTEM privileges. An attacker could then install
  programs; view, change, or delete data; or create new accounts with full user rights.\n\
  An attacker must have the ability to execute code on a victim system to exploit
  this vulnerability.\nAfter installing this security update, you must manually delete
  all shadow copies of system files, including the SAM database, to fully mitigate
  this vulnerabilty. Simply installing this security update will not fully mitigate
  this vulnerability. See KB5005357- Delete Volume Shadow Copies."
