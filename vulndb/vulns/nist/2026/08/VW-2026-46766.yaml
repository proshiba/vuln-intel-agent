title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows low privileged attacker with logon to the
  infrastructure where Oracle Hyperion Financial Management executes to compromise
  Oracle Hyperion Financial Management.  While the vulnerability is in Oracle Hyperion
  Financial Management, attacks may significantly impact additional products (scope
  change).  Successful attacks of this vulnerability can result in  unauthorized creation,
  deletion or modification access to critical data or all Oracle Hyperion Financial
  Management accessible data as well as  unauthorized access to critical data or complete
  access to all Oracle Hyperion Financial Management accessible data. CVSS 3.1 Base
  Score 8.4 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N).'
