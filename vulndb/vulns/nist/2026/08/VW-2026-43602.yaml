title: rsync before 3.5.0 contains an arbitrary file read vulnerability that 
  allows attackers to read files accessible to the rsync daemon process by 
  exploiting symlink following in input configuration file handling including 
  --files-from, --password-file, and filter merge files. Attackers can place a 
  symlink at a predictable --files-from or --password-file path, or supply a 
  --files-from path that escapes the daemon module root, to read arbitrary files
  accessible to the rsync process.
