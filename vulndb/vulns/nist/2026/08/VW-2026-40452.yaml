title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. Prior to version 1.0.5, the unauthenticated `/api/tenants/{id}/schedule`
  endpoint returns every non-archived channel for a tenant regardless of the channel's
  `isPublic` flag. Channels marked `isPublic = false` are intended to be invisible
  to public callers; the dashboard creates them deliberately to hide internal-only
  services from the patient booking UI. The schedule endpoint ignores the flag entirely
  and discloses channel names, descriptions, IDs, agent associations, pause status,
  confirmation requirements, and computed slot availability for the requested date
  range. The asymmetry between `addAppointmentToTunnel` (which enforces `eq(channel.isPublic,
  true)`) and the schedule endpoint (which does not) confirms the design intent: private
  channels exist as a real access boundary in the booking flow, just not in the schedule
  disclosure. Version 1.0.5 patches the issue."
