title: WebsiteBaker CMS before 2.13.10 contains an unrestricted file upload 
  vulnerability in the module installation feature that allows authenticated 
  administrators to achieve remote code execution by uploading a crafted ZIP 
  archive containing a PHP webshell alongside a valid info.php metadata file. 
  Attackers can place the malicious archive through the module installation 
  interface, causing the application to extract the webshell into a 
  web-accessible modules/ subdirectory where it becomes immediately executable 
  by any unauthenticated user via direct HTTP request.
