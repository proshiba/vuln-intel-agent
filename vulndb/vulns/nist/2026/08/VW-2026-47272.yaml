title: Wazuh is a free and open source platform used for threat prevention, 
  detection, and response. From 4.3.0 until 4.14.6 and 5.0.0-beta3, the 
  non-merged branch of process_files_from_worker() in 
  framework/wazuh/core/cluster/master.py trusts a peer-controlled file_path key 
  from files_metadata.json. The destination is joined to WAZUH_PATH without 
  proving that it remains inside the directory selected by cluster_item_key. A 
  cluster peer holding the shared Fernet key can upload a crafted extra-valid 
  archive and overwrite security-sensitive files such as 
  /var/ossec/etc/ossec.conf. Replacing ossec.conf can configure root-executed 
  commands and lead to code execution after a service reload. This issue is 
  fixed in versions 4.14.6 and 5.0.0-beta3.
