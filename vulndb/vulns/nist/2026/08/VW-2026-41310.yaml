title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/ttm:
  Account for NULL and handle pages in ttm_pool_backup\n\nPages in ttm_pool_backup
  can be NULL or backup handles\n(ttm_backup_page_ptr_is_handle()), neither of which
  can be passed to\nset_pages_array_wb() or freed. Add a dedicated WB pass before
  the\ndma/purge loop that walks allocations using the same i += num_pages\nstride,
  skipping NULL and handle entries, and calls set_pages_array_wb()\nonce per contiguous
  run of real pages. Apply the same NULL/handle guard\nto the dma/purge loop.\n\n\
  Fixes the following oops:\n\nOops: general protection fault, kernel NULL pointer
  dereference 0x0: 0000 [#1] SMP NOPTI\nRIP: 0010:__cpa_process_fault+0xf8/0x770\n\
  RSP: 0018:ffffc90000a87718 EFLAGS: 00010287\nRAX: 0000000000000000 RBX: ffffc90000a87868
  RCX: 0000000000000000\nRDX: 0000000000001000 RSI: 0005088000000000 RDI: ffffffff827c5f34\n\
  RBP: 0005088000000000 R08: ffffc90000a877cb R09: ffffc90000a877d0\nR10: 0000000000000000
  R11: 000000000000001"
