title: "The Membership Plugin – Kadence Memberships plugin for WordPress (formerly
  Restrict Content) is vulnerable to password reset link poisoning leading to account
  takeover in all versions up to, and including, 4.0.0. This is due to the legacy
  lost-password handler rc_process_lost_password_form() consuming the attacker-controlled
  rc_redirect POST parameter into two unvalidated sinks in legacy/includes/forms.php:
  wp_redirect( esc_url( $_POST['rc_redirect'] ) . ... ) at line 243, and add_query_arg(
  array( 'key' => $key, 'login' => ... ), $_POST['rc_redirect'] ) inside rc_send_password_reset_email()
  at line 306. The nonce required to reach the handler is broadcast by the public
  [login_form] shortcode at line 207 to any anonymous visitor. This makes it possible
