title: Tapo C100/C101 V5 contains a null pointer dereference vulnerability in 
  the RTSP service. An attacker on the local network can send specially crafted 
  requests that cause the service to dereference an invalid pointer, resulting 
  in a service crash and device reboot. Successful exploitation can disrupt live
  video streaming functionality and cause a temporary denial-of-service 
  condition.
