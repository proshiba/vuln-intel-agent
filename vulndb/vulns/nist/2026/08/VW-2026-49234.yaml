title: 'Adminer 4.6.0 before 5.5.0 prepends the client-supplied X-Forwarded-Prefix
  header to $_SERVER["REQUEST_URI"] with no trusted-proxy check and no validation
  of the prefix value. An attacker can supply an absolute URL (e.g. X-Forwarded-Prefix:
  https://evil.example) that flows into Location redirect headers, the Set-Cookie
  path attribute, and self-referential links. This enables an authenticated open redirect
  after state-changing POSTs, unauthenticated control of the session cookie path attribute,
  and poisoning of self-referential links; CR/LF cannot be injected, so header splitting/XSS
  is not possible.'
