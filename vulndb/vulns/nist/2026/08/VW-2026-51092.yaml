title: "Affected versions of Flowintel construct timeline HTML using attacker-controllable
  MISP object fields such as:\n\n\n\n  *  \nobject UUID;\n\n\n  *  \nobject name;\n\
  \n\n  *  \nattribute value;\n\n\n  *  \nattribute type;\n\n\n  *  \ncomment;\n\n\
  \n  *  \nfirst/last seen values;\n\n\n  *  \nIDS flag.\n\n\n\n\n\nThose values were
  concatenated directly into HTML strings before rendering. The upstream commit explicitly
  states that DOMPurify removed XSS vectors but still allowed other HTML elements,
  such as forms, through.\n\nThe fix replaces direct string interpolation with DOM
  construction via document.createElement() and assigns all attacker-controlled values
  using textContent. The headline is similarly converted to escaped HTML through a
  temporary element.\n\nVersion impacted =>3.3.0"
