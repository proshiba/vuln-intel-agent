title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix the setting of the server responding flag\n\nIn afs_wait_for_operation(), we
  set transcribe the call responded flag to\nthe server record that we used after
  doing the fileserver iteration loop -\nbut it's possible to exit the loop having
  had a response from the server\nthat we've discarded (e.g. it returned an abort
  or we started receiving\ndata, but the call didn't complete).\n\nThis means that
  op->server might be NULL, but we don't check that before\nattempting to set the
  server flag."
