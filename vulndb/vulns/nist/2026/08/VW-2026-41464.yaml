title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: extend conn_hash lookup critical sections\n\nUsing RCU-protected pointers
  outside the critical sections without\nrefcount is incorrect and may result to UAF.\n\
  \nExtend critical section to cover both hci_conn_hash lookup and use of\nthe returned
  conn.\n\nAdd surrounding rcu_read_lock() also when return value is not used, in\n\
  preparation for RCU lockdep requirement to hci_lookup_le_connect().\n\nThis avoids
  concurrent deletion of the conn before we are done\ndereferencing it.\n\nAlso, make
  sure to hold hdev->lock when accessing hdev->accept_list."
