title: The proxy middleware in mcp-use's inspector forwards requests to a 
  destination the caller names. mountMcpProxy in 
  libraries/typescript/packages/inspector/src/server/proxy/mcp-proxy.ts read the
  target from the X-Target-URL header or the __mcp_target parameter and proxied 
  to it without inspecting the host, so loopback, link-local and private 
  addresses were all accepted, as were names that resolve to them, and the 
  validation was not reapplied to a redirect the destination returned. A caller 
  could therefore make the server issue requests to addresses reachable only 
  from the host it runs on and read the responses. The current code calls 
  isSafeProxyTarget, which checks the resolved address against private, loopback
  and link-local ranges before proxying and bounds the number of redirects 
  followed.
