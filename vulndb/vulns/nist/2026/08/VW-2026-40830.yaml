title: A vulnerability has been found in MZ Automation libiec61850 up to 1.6.1. 
  The affected element is the function MmsMapping_varAccessSpecToObjectReference
  of the file src/iec61850/common/iec61850_common.c of the component MMS 
  Protocol Workflow. Such manipulation of the argument 
  GetNamedVariableListAttributesResponse.itemId leads to heap-based buffer 
  overflow. The attack must be carried out locally. The exploit has been 
  disclosed to the public and may be used. The project was informed of the 
  problem early through an issue report but has not responded yet.
