title: "The File Manager plugin for WordPress is vulnerable to arbitrary file deletion
  due to insufficient file path validation in the connector function in all versions
  from 6.0 - 6.9. This makes it possible for authenticated attackers, with subscriber-level
  access and above, to read and delete arbitrary files on the server, which can lead
  to remote code execution when the right file is deleted (such as wp-config.php).
  The bypass is triggered by passing cmd=rm or cmf=file in the URL query string of
  a POST request: elFinder's bind registration reads the command exclusively from
  $_POST and therefore never registers the rm.pre permission handler, while the dispatcher
  reads from the merged $_GET+$_POST superglobal and executes the rm or file command
  unchecked against a volume that defaults to ABSPATH."
