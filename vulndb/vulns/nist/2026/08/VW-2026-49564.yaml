title: OpenEXR is the reference implementation and specification for the EXR 
  image format, widely used in the motion picture industry. OpenEXR versions 
  before 3.2.11, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13 are vulnerable 
  to crashing. This occurs when Imf::GetChannelsInMultiPartFile() processes a 
  crafted EXR with an empty multiView header attribute and 
  Imf::viewFromChannelName() indexes the empty vector for a dotless channel 
  name. This issue is fixed in versions 3.2.11, 3.3.13, and 3.4.14.
