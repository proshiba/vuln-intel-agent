title: Super Productivity is an advanced todo list app with integrated 
  timeboxing and time tracking capabilities. Prior to 18.13.0, the EXEC IPC 
  handler in electron/ipc-handlers/exec.ts accepts a command string from the 
  renderer through the IPC.EXEC channel and executes it with 
  child_process.exec(). The electron/preload.ts bridge exposes window.ea.exec() 
  to renderer code, including community plugins executed with new Function(), 
  without requiring nodeExecution permission. A confirmation dialog protects 
  only the first execution, its persistence checkbox is selected by default, and
  approved commands are stored in the ALLOWED_COMMANDS value in simpleSettings 
  for silent later execution with the desktop account's privileges. This issue 
  is fixed in version 18.13.0.
