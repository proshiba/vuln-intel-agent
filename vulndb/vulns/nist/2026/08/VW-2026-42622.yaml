title: Coturn is a free open source implementation of TURN and STUN Server. 
  Prior to 4.16.0, dtls_server_input_handler() and 
  create_new_connected_udp_socket() in src/apps/relay/dtls_listener.c retain 
  OpenSSL dtls1_reassemble_fragment() state for a 35-byte fragmented ClientHello
  declaring a 650,000-byte handshake before cookie validation, allowing an 
  unauthenticated remote sender using fresh UDP tuples to exhaust memory without
  TURN credentials, a completed handshake, a valid cookie, or source spoofing. 
  This issue is fixed in version 4.16.0.
