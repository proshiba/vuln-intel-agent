title: "FakeFish handles incoming credentials by passing them down\n to scripts. This
  works for real hardware because in the end it's up to \nthe BMC to validate them.
  However, KubeVirt relies on a KUBECONFIG file \nmounted to the container and completely
  ignores the credentials. This allows any user of the cluster to control VMs of the\
  \ \nuser that created fakefish, power them on and off, and mount arbitrary CD\n\
  \ images to them."
