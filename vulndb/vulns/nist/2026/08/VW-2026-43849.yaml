title: A vulnerability was found in Dromara lamp-cloud up to 5.10.0. This 
  vulnerability affects unknown code of the file FileAnyoneController.java of 
  the component File-Upload Controller. Performing a manipulation of the 
  argument bucket/bizType results in path traversal. The attack can be initiated
  remotely. The exploit has been made public and could be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
