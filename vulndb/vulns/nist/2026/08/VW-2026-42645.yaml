title: An issue in MongoDB Server's aggregation framework could allow an 
  authenticated user with only read privileges to perform write operations 
  against collections they should not be able to modify. This is due to an 
  internal-use aggregation stage being reachable by external clients without an 
  appropriate authorization check on its embedded operations.
