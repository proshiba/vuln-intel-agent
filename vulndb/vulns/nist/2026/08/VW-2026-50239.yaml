title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf:
  Reject exited events as group leaders\n\nperf_event_remove_on_exec() sets remove-on-exec
  events to the EXIT state\nand detaches their group relationships.  The event's file
  descriptor can\nremain open, however, and perf_event_open() currently accepts that
  event\nas a group leader because its early validation rejects only REVOKED and\n\
  DEAD events.\n\nA new sibling can consequently be linked to the detached leader.\
  \  When\nthe leader is closed, perf_group_detach() observes that its\nPERF_ATTACH_GROUP
  bit is already clear and skips the new sibling.  The\nsibling then retains a group_leader
  pointer to the freed event.\n\nReject group leaders in the EXIT state.  Perform
  the check while holding\nthe shared context mutex so that an exec in the target
  task cannot detach\nthe leader between validation and group attachment.\n\n[peterz:
  make the earlier test fully consistent]"
