title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  line6: Fix racy access to midibuf\n\nThere can be concurrent accesses to line6 midibuf
  from both the URB\ncompletion callback and the rawmidi API access.  This could be
  a cause\nof KMSAN warning triggered by syzkaller below (so put as reported-by\n\
  here).\n\nThis patch protects the midibuf call of the former code path with a\n\
  spinlock for avoiding the possible races."
