title: TypeBot is a chatbot builder tool. Versions prior to 3.17.0 allow a 
  low-privilege read collaborator to extract a workspace OAuth `credentialsId` 
  from a readable bot configuration and then overwrite that credential through 
  `handleUpdateOAuthCredentials()` by supplying an attacker-controlled writable 
  `workspaceId`. The update path validates only the attacker-supplied workspace 
  and then updates the credential record by global `id` alone, while also 
  rewriting the credential's `workspaceId`. This allows cross-workspace OAuth 
  credential takeover and reassignment. Version 3.17.0 patches the issue.
