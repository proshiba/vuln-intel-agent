title: Wazuh is an open-source security platform providing unified XDR and SIEM 
  protection for endpoints and cloud workloads. In versions 4.2.0 through 
  4.14.6, multiple active response scripts pass attacker-influenced alert fields
  to privileged system commands without validating their format, allowing 
  argument injection into tools that run as root. Five of the eight scripts that
  handle the srcip field, route-null.c, netsh.c, pf.c, npf.c, and ipfw.c, omit 
  the get_ip_version() check that rejects non-IP input, and disable-account.c 
  passes the dstuser field to passwd/chuser with only a comparison against 
  "root". An attacker who can inject crafted log events, for example via syslog,
  can supply srcip or dstuser values that, when an active response rule 
  triggers, are passed unvalidated to firewall and account-management commands 
  such as pfctl, npfctl, ipfw, route, netsh, and passwd. This enables injecting 
