title: New API is a large language mode (LLM) gateway and artificial 
  intelligence (AI) asset management system. From 0.9.1.3 until 1.0.0-rc.7, 
  AdminResetPasskey in controller/passkey.go lacks the canManageTargetRole 
  authorization check for DELETE /api/user/:id/reset_passkey, allowing a 
  lower-privileged administrator to remove a passkey from a same-level or 
  higher-privileged account, including a root account. This issue is fixed in 
  version 1.0.0-rc.7.
