title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  raw: add locking for raw flags bitfield\n\nWith commit 890e5198a6e5 (\"can: raw:
  use bitfields to store flags in\nstruct raw_sock\") the formerly separate integer
  values have been integrated\ninto a single bitfield. This led to a read-modify-write
  operation when\nchanging a flag in raw_setsockopt() which now needs a locking to
  prevent\nconcurrent access.\n\nInstead of adding a lock/unlock hell in each of the
  flag manipulations this\npatch introduces a wrapper for a new raw_setsockopt_locked()
  function\nanalogue to the isotp_setsockopt[_locked]() approach in net/can/isotp.c\n\
  \n[mkl: use Closes tag instead of Link]"
