title: An attacker that has valid credentials can open many connections to the 
  imap-hibernate service and send invalid commands, which can intermittently 
  cause an out-of-bounds read and crash the process. The crash interrupts 
  hibernated IMAP sessions handled by the affected process, which can cause 
  degradation of service for IMAP. Disable IMAP hibernation. Update to 
  non-vulnerable version. No publicly available exploits are known.
