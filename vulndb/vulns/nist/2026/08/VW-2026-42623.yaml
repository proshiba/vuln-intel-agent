title: Coturn is a free open source implementation of TURN and STUN Server. 
  Prior to 4.17.0, turnports_allocate_even() in src/apps/relay/turn_ports.c 
  marks the unused odd sibling port as TPS_TAKEN_ODD for an EVEN-PORT Allocate 
  request with reservation bit R=0 even though no RTCP socket will release it, 
  allowing an authenticated client to permanently exhaust the relay port pool 
  and cause subsequent allocations to fail with STUN error 508. This issue is 
  fixed in version 4.17.0.
