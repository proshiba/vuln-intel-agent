title: 'Vulnerability in the Oracle Agile Engineering Data Management product of Oracle
  Supply Chain (component: Engineering Communication Interface).   The supported version
  that is affected is 6.2.1. Difficult to exploit vulnerability allows high privileged
  attacker with logon to the infrastructure where Oracle Agile Engineering Data Management
  executes to compromise Oracle Agile Engineering Data Management.  Successful attacks
  require human interaction from a person other than the attacker. Successful attacks
  of this vulnerability can result in takeover of Oracle Agile Engineering Data Management.
