title: An issue was discovered in the resolv gem before 0.7.2 for Ruby. 
  Resolv::DNS::Resource.get_class, Resolv::DNS::Resource::Generic.create, and 
  Resolv::DNS::SvcParam::Generic.create generate a new class for each unknown 
  DNS resource record (type, class) pair, or each unknown SvcParamKey, 
  encountered while decoding a response. Each generated class was permanently 
  registered both as a constant on Resource (or SvcParam::Generic) and as an 
  entry in a class-lookup hash (ClassHash), and thus the class remained 
  reachable through that constant after the response was discarded. Type and 
  class are each 16-bit values, and thus an attacker controlling DNS responses 
  (a spoofed response, or a malicious or hijacked upstream DNS server) has 
  roughly 2^32 distinct (type, class) pairs to choose from. A single response of
  a few hundred kilobytes carrying tens of thousands of distinct unknown types 
  permanently grows process memory by tens of megabytes; repeated responses 
  accumulate without bound and are never
