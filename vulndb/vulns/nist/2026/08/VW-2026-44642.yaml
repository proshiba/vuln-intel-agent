title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Decouple req recycling from RPC completion\n\nrl_kref formerly served two distinct
  lifetimes through a single\nrefcount: it gated when a Reply could wake its RPC task,
  and it\ngated when an rpcrdma_req could return to its free pool. The\nmarshal path
  took the Send-side reference only when SGEs needed\nDMA-unmap (sc_unmap_count >
  0), which made a Send carrying only\npre-registered buffers an exception: the Reply
  handler dropped\nrl_kref from 1 to 0 and freed the req while the HCA might still\n\
  be DMA-reading from its send buffer.\n\nGive rl_kref a narrower job. The RPC layer
  takes one reference\nwhen slot allocation hands a req out. rpcrdma_prepare_send_sges()\n\
  takes a Send-side reference unconditionally after WR preparation\nsucceeds. xprt_rdma_free_slot()
  and xprt_rdma_bc_free_rqst() drop\nthe RPC-layer reference; rpcrdma_sendctx_unmap()
  drops the\nSend-side reference. The req returns to its free pool only after\nboth
  owners"
