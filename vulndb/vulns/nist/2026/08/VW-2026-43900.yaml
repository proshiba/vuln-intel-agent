title: The Grav API plugin (getgrav/grav-plugin-api) before 1.0.13 contains an 
  API-key scope cap bypass in DemoController. Its private requireSuper() method 
  checks isSuperAdmin() and returns early before invoking requirePermission(), 
  so the api_key_scopes cap (enforced only in requirePermission()) is skipped. 
  As a result, any scoped API key minted on a super account can bypass its scope
  restrictions when calling the baseline() and reset() operations (e.g. POST 
  /api/v1/demo/reset), allowing it to capture the demo baseline or force a demo 
  reset. Impact is bounded to demo-engine control and is conditional on demo 
  mode being configured with writable resources.
