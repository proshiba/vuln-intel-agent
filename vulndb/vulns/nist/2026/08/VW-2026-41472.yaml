title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_ffa: Fix out-of-bound writes in ffa_setup_and_transmit()\n\nSashiko (locally)
  reports multiple out-of-bound issues in\nffa_setup_and_transmit:\n1) Writing ep_mem_access->reserved
  can write out of bounds for FFA\n   versions < 1.2 as ffa_emad_size_get() returns
  16 bytes in that case\n   while reserved has an offset of 24.\n   Instead of zeroing
  fields, memset the struct to zero first based on\n   the FFA version.\n\n2) Make
  sure there is enough size to write constituents.\n\nWhile at it, convert the only
  sizeof() in the driver that uses a\ntype instead of variable."
