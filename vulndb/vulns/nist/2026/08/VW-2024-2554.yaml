title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix possible double free in smb2_set_ea()\n\nClang static checker(scan-build)
  warning：\nfs/smb/client/smb2ops.c:1304:2: Attempt to free released memory.\n 1304
  |         kfree(ea);\n      |         ^~~~~~~~~\n\nThere is a double free in such
  case:\n'ea is initialized to NULL' -> 'first successful memory allocation for\n\
  ea' -> 'something failed, goto sea_exit' -> 'first memory release for ea'\n-> 'goto
  replay_again' -> 'second goto sea_exit before allocate memory\nfor ea' -> 'second
  memory release for ea resulted in double free'.\n\nRe-initialie 'ea' to NULL near
  to the replay_again label, it can fix this\ndouble free problem."
