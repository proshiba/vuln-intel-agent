title: "Sony XAV-9500ES prh_l2_decode_packet Out-Of-Bounds Read Information Disclosure
  Vulnerability. This vulnerability allows network-adjacent attackers to disclose
  sensitive information on affected installations of Sony XAV-9500ES devices. An attacker
  must first obtain the ability to pair a malicious Bluetooth device with the target
  system in order to exploit this vulnerability.\n\nThe specific flaw exists within
  the handling of Bluetooth L2CAP packets. The issue results from the lack of proper
  validation of user-supplied data, which can result in a read past the end of an
  allocated buffer. An attacker can leverage this in conjunction with other vulnerabilities
  to execute arbitrary code in the context of the device. Was ZDI-CAN-28990."
