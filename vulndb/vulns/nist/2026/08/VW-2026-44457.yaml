title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: vgic: Handle race between interrupt affinity change and LPI disabling\n\n\
  Hyunwoo Kim reports some really bad races should the following\nsituation occur:\n\
  \n- LPI-I is pending in vcpu-B's AP list\n- vcpu-A writes to vcpu-B's RD to disable
  its LPIs\n- vcpu-C moves I from B to C\n\nIf the last two race nicely enough, vgic_prune_ap_list()
  can drop\nthe irq and AP list locks, reacquire them, and in the interval\nthe irq
  has been freed. UAF follows.\n\nThe fix is two-fold:\n\n- Before dropping the irq
  and ap_list locks, take a reference on\n  the irq\n\n- Do not try to handle migration
  of the pending bit: there is no\n  expectation that this state is retained, as per
  the architecture\n\nWith that, we're sure that the interrupt is still around, and
  we\nsafely remove it from the AP list as it has no target at this\nstage (unless
  another interrupt fires, but that's another story)."
