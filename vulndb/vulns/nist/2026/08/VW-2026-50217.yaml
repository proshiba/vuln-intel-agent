title: "The LoRaWAN application-layer clock-synchronization service parses downlinks
  in clock_sync_package_callback() (subsys/lorawan/services/clock_sync.c). Its command
  loop only guarantees that the one-byte command id is in bounds; for the CLOCK_SYNC_CMD_APP_TIME
  (AppTimeAns) command the handler then reads a 4-byte time correction via sys_get_le32()
  plus a 1-byte token without checking that 5 bytes remain in the receive buffer (len
  - rx_pos). A short or crafted AppTimeAns therefore reads up to 5 bytes past the
  end of the decrypted payload.\n\nThe payload (rx_buf/len) is the decrypted application
  frame delivered to the registered downlink callback (mcps_indication->Buffer/BufferSize).
  Reaching the handler requires a frame on the clock-sync port that passes LoRaWAN's
  MAC integrity check and FRMPayload decryption, so the practical attacker is a malicious
  or compromised network/application server (the designated sender of AppTimeAns)
