title: Plainpad through 1.1.1, fixed in commit d3823fc, contains a missing rate 
  limiting vulnerability that allows unauthenticated attackers to send unbounded
  login requests to the POST /v1/sessions endpoint due to dead code in 
  App\Http\Kernel.php that is never instantiated under the Laravel 11+ skeleton,
  leaving the API throttle configuration unattached to any route. Attackers can 
  exploit this by sending unlimited credential attempts with no lockout or 
  CAPTCHA enforcement, and additionally trigger CPU exhaustion by forcing 
  repeated bcrypt comparisons on each request.
