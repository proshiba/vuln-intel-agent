title: Streambert is a cross-platform Electron Desktop App to stream and 
  download video content. From version 2.5.0 until version 2.6.0, the 
  wyzie-open-redeem IPC handler in index.js creates the partition:wyzie-redeem 
  Electron session and registers an onHeadersReceived hook that removes the 
  Content-Security-Policy header from every response in that session. The redeem
  window also lacks a setWindowOpenHandler restriction, so script injection in 
  sub.wyzie.io, a loaded third-party resource, or a site reached through 
  navigation executes without CSP constraints and can affect additional windows 
  and persistent session storage. A user must open the Wyzie API key redemption 
  window, and exploitation requires attacker-controlled script content in a 
  loaded page. The resulting renderer script can invoke renderer-exposed 
  application functionality and can be chained with other vulnerabilities to 
  access internal services or sensitive data. This issue is fixed in version 
  2.6.0.
