title: "DJI drones expose an unauthenticated DUML command interface over Bluetooth
  that allows an attacker within Bluetooth range to modify Wi-Fi configuration parameters,
  including the SSID, PSK, MAC address, regulatory country code, and wireless channel.
  An attacker can overwrite the Wi-Fi PSK with a known value and connect to the drone's
  internal Wi-Fi network, potentially gaining access to the flight control interface
  and issuing flight commands. Crafted DUML commands can also disable or restart the
  Wi-Fi and Bluetooth interfaces, disconnect Wi-Fi clients, or reset wireless configuration,
  resulting in a denial-of-service condition that can disrupt the operator's wireless
  control, video, and telemetry connections during flight.\n\nAffected models are
  DJI Neo until 01.00.0400, DJI Neo 2 until 01.00.0500, DJI Flip until 01.00.1200,
  DJI Air 3 until 01.00.1600, DJI Air 3S until 01.00.1400, DJI Avata 2 until 01.00.0400,
