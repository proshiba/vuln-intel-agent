title: "Net::SAML2 versions before 0.86 for Perl allow authentication bypass because
  _verify_encrypted_assertion accepts an EncryptedAssertion whose decrypted content
  carries no signature.\n\n_verify_encrypted_assertion decrypts the EncryptedAssertion
  and returns it as verified when it carries no signature, via \"return $xml unless
  $xpath->exists('dsig:Signature', $assert);\". The signature check and the trust
  anchor check that follow run only when a signature is present, so a decrypted assertion
  with no dsig:Signature element reaches new_from_xml unverified and its NameID and
  attributes are read into the assertion object. An SP's encryption certificate is
