title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  resize log->one_page_buf when adopting on-disk page size\n\nlog_replay() allocates
  log->one_page_buf using the page size that was\nchosen from the host PAGE_SIZE:\n\
  \n\tlog->one_page_buf = kmalloc(log->page_size, GFP_NOFS);\n\nLater, when a restart
  area is found, the log page size recorded on disk\nis adopted:\n\n\tt32 = le32_to_cpu(log->rst_info.r_page->sys_page_size);\n\
  \tif (log->page_size != t32) {\n\t\tlog->l_size = log->orig_file_size;\n\t\tlog->page_size
  = norm_file_page(t32, &log->l_size,\n\t\t\t\t\t\tt32 == DefaultLogPageSize);\n\t\
  }\n\nIf the on-disk page size is larger than the size used for the initial\nallocation,
  log->page_size grows but one_page_buf is left at its\noriginal, smaller size. A
  subsequent unaligned read_log_page() then\nreads log->page_size bytes into the undersized
  scratch buffer:\n\n\tpage_buf = page_off ? log->one_page_buf : *buffer;\n\terr =
  ntfs_read_run_nb_ra(ni->mi.sbi, &ni->file.run, page_vbo, page_buf,\n\t\t\t\t  log-"
