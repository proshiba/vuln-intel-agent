title: rsync daemon 2.0.0 before 3.5.0 contains a denial of service 
  vulnerability that allows unauthenticated remote attackers to exhaust daemon 
  connection slots by stalling the handshake process before or after module 
  selection without triggering the I/O timeout. Attackers can open many 
  simultaneous connections and trickle data at the minimum rate to avoid 
  timeout, or stall entirely before module selection where no timeout applies, 
  consuming all available connection slots and denying service to legitimate 
  clients.
