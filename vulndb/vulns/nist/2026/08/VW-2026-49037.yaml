title: "Relative path traversal vulnerability in Apache Camel Google Storage component.\n\
  \n\n\nThis issue affects Apache Camel: from 4.0.0 before 4.14.9, from 4.15.0 before
  4.18.4, from 4.19.0 before 4.22.0.\n\n\n\nThe camel-google-storage consumer downloads
  Google Cloud Storage objects to the local filesystem when the downloadFileName option
  is set. That option is documented as a folder or a filename, and when its value
  contains no expression token the consumer builds the local destination by appending
  the object name to it: evaluateFileExpression sets the Exchange file-name header
  to the remote object name and evaluates downloadFileName + \"/${file:name}\". The
  ${file:name} token returns the file-name header verbatim, unlike ${file:onlyname},
  which applies FileUtil.stripPath to it. The resulting string was passed directly
  to new File(result) and blob.downloadTo(file.toPath()) with no lexical normalization
  and no check that the destination stayed inside the configured directory. The object
  name is not "
