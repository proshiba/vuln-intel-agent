title: The TrueBooker – Appointment Booking and Scheduler System plugin for 
  WordPress is vulnerable to Authorization Bypass Through User-Controlled Key 
  leading to Account Takeover in all versions up to, and including, 1.2.6. This 
  is due to the admin_user_create_cus AJAX handler lacking any authentication or
  capability check before passing the attacker-supplied truebooker_wp_user_id 
  parameter directly to wp_update_user. This makes it possible for 
  unauthenticated attackers to overwrite the email address of any WordPress user
  — including an administrator — and then complete the standard WordPress 
  lost-password flow to fully take over the targeted account.
