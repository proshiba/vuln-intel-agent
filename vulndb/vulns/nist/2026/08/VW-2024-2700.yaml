title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/ipv6:
  release expired exception dst cached in socket\n\nDst objects get leaked in ip6_negative_advice()
  when this function is\nexecuted for an expired IPv6 route located in the exception
  table. There\nare several conditions that must be fulfilled for the leak to occur:\n\
  * an ICMPv6 packet indicating a change of the MTU for the path is received,\n  resulting
  in an exception dst being created\n* a TCP connection that uses the exception dst
  for routing packets must\n  start timing out so that TCP begins retransmissions\n\
  * after the exception dst expires, the FIB6 garbage collector must not run\n  before
  TCP executes ip6_negative_advice() for the expired exception dst\n\nWhen TCP executes
  ip6_negative_advice() for an exception dst that has\nexpired and if no other socket
  holds a reference to the exception dst, the\nrefcount of the exception dst is 2,
  which corresponds to the increment\nmade by dst_init() and the increment made by
  th"
