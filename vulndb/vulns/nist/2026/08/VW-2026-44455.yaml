title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SEV: Do not allow intra-host migration/mirroring of SNP VMs\n\nThe intra-host migration/mirroring
  feature is not fully implemented for\nSEV-SNP VMs. The proper migration requires
  additional SNP-specific\nstate such as guest_req_mutex, guest_req_buf, and guest_resp_buf
  to be\ntransferred or initialized on the destination.\n\nThe SNP VM mirroring requires
  vmsa features to be copied as well otherwise\nASID would be bound to SNP range while
  VM is detected as a SEV VM.\n\nReject SNP source VMs in migration/mirroring until
  proper SNP state\ntransfer is implemented.\n\n\n[sean: let lines poke past 80 chars,
  tag for stable]"
