title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  atlantic: free RX pages of consumed but not refilled buffers\n\naq_ring_rx_deinit()
  only walks [sw_head, sw_tail), the region posted to\nhardware. Since the page reuse
  strategy was added, a cleaned RX buffer\nkeeps its page (and its DMA mapping) in
  the ring for reuse, and refill\nis batched: aq_ring_rx_fill() returns early until
  AQ_CFG_RX_REFILL_THRES\nslots are free. Slots that were consumed but not yet reposted
  therefore\nsit in the complementary [sw_tail, sw_head) gap with a live page, and\n\
  the deinit walk never visits them: up to a refill batch worth of pages\nand DMA
  mappings leak on every interface down.\n\nWalk the whole ring instead and release
  whatever is still there. Also\nbail out if the buffer ring is already gone: a partial\n\
  aq_ptp_ring_alloc() failure frees the ring but leaves aq_nic set, so\naq_ptp_ring_deinit()
  still gets here on the unwind path."
