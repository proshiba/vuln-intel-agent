title: A flaw was found in FreeIPA. The trust-fetch-domains command is gated by 
  a read-only permission on the trust object rather than a trust-administration 
  permission, allowing an authenticated, non-privileged IPA user to trigger a 
  privileged Active Directory trust refresh using an attacker-supplied server 
  and credentials, resulting in unauthorized, attacker-controlled modification 
  of trusted-domain and ID-range identity data in the IPA LDAP directory.
