title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/pt:
  prevent invalid cursor access for purged BOs\n\nDuring a page table walk for binding,
  xe_pt_stage_bind() explicitly\nskips initializing the xe_res_cursor for purged BOs,
  treating them\nsimilarly to NULL VMAs by only setting the cursor size.\n\nHowever,
  xe_pt_hugepte_possible() and xe_pt_scan_64K() did not check\nif the BO was purged
  before attempting to walk the cursor using\nxe_res_dma() and xe_res_next(). Because
  the cursor was left\nuninitialized for purged BOs, this falls through and triggers\n\
  warnings like:\n\n  WARNING: drivers/gpu/drm/xe/xe_res_cursor.h:274 at xe_res_next\n\
  \nFix this by explicitly checking if the BO is purged in both\nxe_pt_hugepte_possible()
  and xe_pt_scan_64K(), returning early just\nas we do for NULL VMAs, avoiding the
  invalid cursor accesses entirely.\n\nAs a precaution, also zero-initialize the cursor
  in xe_pt_stage_bind()\nto ensure we don't pass garbage data into the page table
  walkers\nif we eve"
