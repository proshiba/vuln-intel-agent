title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Finish converting the NFSv2 GETACL result encoder\n\nThe xdr_stream conversion inadvertently
  left some code that set the\npage_len of the send buffer. The XDR stream encoders
  should handle\nthis automatically now.\n\nThis oversight adds garbage past the end
  of the Reply message.\nClients typically ignore the garbage, but NFSD does not need
  to send\nit, as it leaks stale memory contents onto the wire."
