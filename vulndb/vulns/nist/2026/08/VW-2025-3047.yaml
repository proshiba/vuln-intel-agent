title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: Fix multiple LUN_RESET handling\n\nThis fixes a bug where an initiator thinks
  a LUN_RESET has cleaned up\nrunning commands when it hasn't. The bug was added in
  commit 51ec502a3266\n(\"target: Delete tmr from list before processing\").\n\nThe
  problem occurs when:\n\n 1. We have N I/O cmds running in the target layer spread
  over 2 sessions.\n\n 2. The initiator sends a LUN_RESET for each session.\n\n 3.
  session1's LUN_RESET loops over all the running commands from both\n    sessions
  and moves them to its local drain_task_list.\n\n 4. session2's LUN_RESET does not
  see the LUN_RESET from session1 because\n    the commit above has it remove itself.
  session2 also does not see any\n    commands since the other reset moved them off
  the state lists.\n\n 5. sessions2's LUN_RESET will then complete with a successful
  response.\n\n 6. sessions2's inititor believes the running commands on its session
