title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. Prior to version 1.0.2, a TENANT_ADMIN promotes themselves
  to platform-wide GLOBAL_ADMIN through a single PUT request. The role-update handler
  accepts the `GLOBAL_ADMIN` enum value from any tenant admin updating their own tenant's
  staff. No policy check enforces that \"only an existing GLOBAL_ADMIN may grant GLOBAL_ADMIN\"\
  , so the schema validation IS the authorization decision. After re-login, the JWT
  contains the new role and the formerly-tenant-scoped admin reaches every other tenant
  on the platform. On the hosted OpenReception service this is a scope-changed escalation:
  a single customer-side tenant administrator gains full platform-wide administrative
  control over all other tenants' configuration, users, staff records, operational
  metadata, and tenant lifecycle. Plaintext appointment contents remain subject to
  the E2E model unless chained with the staff-crypto poisoning issue "
