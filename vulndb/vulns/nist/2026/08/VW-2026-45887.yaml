title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to 1.0.8.4, Vvveb backend digital 
  asset operations allow a low-privileged Vendor to access digital assets linked
  to another Vendor's products. The admin/controller/product/digital-asset.php 
  and admin/controller/product/digital-assets.php controllers and the 
  admin/sql/sqlite/digital_asset.sql data queries use a caller-controlled 
  digital_asset_id without consistently enforcing the current admin_id ownership
  boundary. An attacker can list assets, read asset names and file metadata, 
  edit asset metadata, or delete asset records, which can disclose private 
  product metadata, corrupt resource links, and cause data loss. This issue is 
  fixed in version 1.0.8.4.
