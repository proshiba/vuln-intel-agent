title: 'Vulnerability in the Oracle Agile PLM MCAD Connector product of Oracle Supply
  Chain (component: CAX Client).   The supported version that is affected is 3.6.
  Easily exploitable vulnerability allows low privileged attacker with access to the
  physical communication segment attached to the hardware where the Oracle Agile PLM
  MCAD Connector executes to compromise Oracle Agile PLM MCAD Connector.  Successful
  attacks of this vulnerability can result in  unauthorized update, insert or delete
  access to some of Oracle Agile PLM MCAD Connector accessible data as well as  unauthorized
  read access to a subset of Oracle Agile PLM MCAD Connector accessible data. CVSS
  3.1 Base Score 4.6 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N).'
