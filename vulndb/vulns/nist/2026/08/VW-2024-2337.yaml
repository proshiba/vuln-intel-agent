title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux,smack:
  don't bypass permissions check in inode_setsecctx hook\n\nMarek Gresko reports that
  the root user on an NFS client is able to\nchange the security labels on files on
  an NFS filesystem that is\nexported with root squashing enabled.\n\nThe end of the
  kerneldoc comment for __vfs_setxattr_noperm() states:\n\n *  This function requires
  the caller to lock the inode's i_mutex before it\n *  is executed. It also assumes
  that the caller will make the appropriate\n *  permission checks.\n\nnfsd_setattr()
  does do permissions checking via fh_verify() and\nnfsd_permission(), but those don't
  do all the same permissions checks\nthat are done by security_inode_setxattr() and
  its related LSM hooks do.\n\nSince nfsd_setattr() is the only consumer of security_inode_setsecctx(),\n\
  simplest solution appears to be to replace the call to\n__vfs_setxattr_noperm()
