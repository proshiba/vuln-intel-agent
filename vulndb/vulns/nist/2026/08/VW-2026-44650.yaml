title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  magnetometer: ak8975: fix potential kernel stack memory leak\n\nCurrently in the
  AK8975 driver there are four instances where potential\nuninitialized kernel stack
  memory leaks can occur. If\ni2c_smbus_read_i2c_block_data_or_emulated() returns
  a value less than\nthe size of the buffer, uninitialized bytes are retained in the
  buffer\nand later the buffer is passed on to IIO buffers, potentially leaking\n\
  memory to userspace.\n\nFix this by adding checks whether the return value of the
  function is\nequal to the size of the buffer and subsequently if the value is\n\
  lesser than zero to distinguish from a returned error code."
