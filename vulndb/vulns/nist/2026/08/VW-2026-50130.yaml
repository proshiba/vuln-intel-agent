title: A flaw was found in Katello where the Content View History API does not 
  properly enforce authorization when accessing a Content View specified by the 
  user. An authenticated user with permission to view Content Views in one 
  organization may be able to access the lifecycle history of a Content View 
  belonging to another organization by supplying its identifier to the affected 
  API endpoint. This can result in unauthorized disclosure of Content View 
  lifecycle information, including publication and promotion events, associated 
  users, and timestamps.
