title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkernfs:
  link kn to its parent before the LSM init hook\n\nAfter commit 12e9e3cd03b5 (\"\
  simpe_xattr: use per-sb cache\"),\nkernfs_xattr_set() and kernfs_xattr_get() compute
  the cache via\nkernfs_root(kn) before any other check.  kernfs_root(kn) walks\n\
  kn->__parent first and falls back to kn->dir.root, both of which are\nNULL on a
  freshly kmem_cache_zalloc()'d kn. kn->__parent was being set\nin kernfs_new_node()
  after __kernfs_new_node() returned, and kn->dir.root\nis set even later by kernfs_create_dir_ns()
  / kernfs_create_empty_dir().\n\nThe LSM kernfs_init_security hook is invoked from
  inside\n__kernfs_new_node(), before either field has been initialized.\nselinux_kernfs_init_security()
  ends with kernfs_xattr_set(kn,\nXATTR_NAME_SELINUX, ...).  kernfs_root(kn) then
  returns NULL, and\n&((struct kernfs_root *)NULL)->xa_cache evaluates to\noffsetof(struct
  kernfs_root, xa_cache) which faults:\n\n  BUG: kernel NULL pointer dereference,
  addr"
