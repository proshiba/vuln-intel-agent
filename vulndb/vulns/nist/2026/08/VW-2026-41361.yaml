title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrds:
  tcp: unregister sysctl before tearing down listen socket\n\nrds_tcp_exit_net() frees
  the per-netns RDS TCP listen socket via\nrds_tcp_kill_sock() before unregistering
  the per-netns sysctl table.  Since\nrds_tcp_skbuf_handler() derives the netns from\n\
  rtn->rds_tcp_listen_sock->sk, a concurrent sysctl write can race with\nnetns teardown
  and dereference the freed socket/sk.\n\nKASAN reports the race as:\n\n  BUG: KASAN:
  slab-use-after-free in rds_tcp_skbuf_handler+0x2aa/0x2e0\n  rds_tcp_skbuf_handler\
  \              net/rds/tcp.c:721\n  proc_sys_call_handler              fs/proc/proc_sysctl.c\n\
  \  vfs_write                          fs/read_write.c\n  __x64_sys_pwrite64    \
  \             fs/read_write.c\n\nFix this by unregistering the RDS TCP sysctl table
  before calling\nrds_tcp_kill_sock().  unregister_net_sysctl_table() prevents new
  sysctl\nhandlers from starting and waits for in-flight handlers to finish, so\n\
  the listen socket can then be"
