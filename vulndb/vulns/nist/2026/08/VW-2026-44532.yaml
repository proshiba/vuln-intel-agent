title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix folio state after ENOMEM whilst under writeback iteration\n\nFix the state of
  the current folio when ENOMEM occurs during writeback\niteration.  The folio needs
  to be redirtied and unlocked before the\nterminal writeback_iter() is invoked."
