title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  use pskb_network_may_pull() in route_shortcircuit()\n\nroute_shortcircuit() currently
  calls pskb_may_pull(skb, sizeof(struct iphdr))\n(or ipv6hdr), which checks if bytes
  are available starting from skb->data.\n\nHowever, in vxlan_xmit(), skb->data points
  to the MAC header, so\nskb_network_offset(skb) is ETH_HLEN (14 bytes). Using pskb_may_pull(skb,
  20)\nonly checks 20 bytes from skb->data (which is 14 bytes MAC header + 6 bytes
  of\nIP header), leaving the rest of the IP header potentially un-pulled in non-linear\n\
  frags. Subsequent dereferences of ip_hdr(skb)->daddr can read beyond the pulled\n\
  linear buffer length.\n\nFix this by using pskb_network_may_pull(), which adds skb_network_offset(skb)
  to\nthe length check to ensure the full network header is present in the linear
  buffer."
