title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  musb: omap2430: Do not put borrowed of_node in probe\n\nomap2430_probe() stores
  pdev->dev.of_node in a local np variable. This is\na borrowed pointer and the probe
  function does not take a reference to\nit.\n\nThe success and error paths nevertheless
  call of_node_put(np). This drops\na reference that is owned by the platform device,
  and can leave\npdev->dev.of_node with an unbalanced reference count.\n\nDo not put
  the borrowed platform device node from omap2430_probe().\nReferences taken for the
  child MUSB device are handled by the device core,\nand the ctrl-module phandle reference
  is still released separately."
