title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  sata_dwc_460ex: fix infinite loop in NCQ tag completion bit-scanning\n\nThe hand-rolled
  bit-scanning loop in the NCQ completion path has an\ninfinite loop bug.  When tag_mask
  has only high bits set (e.g.\n0x80000000), the inner while loop left-shifts tag_mask
  until it\noverflows to 0.  At that point !(0 & 1) is always true and 0 <<= 1\nstays
  0, causing an infinite loop in hardirq context with a spinlock\nheld.\n\nReplace
  the open-coded bit-scanning with __ffs() which correctly\nfinds the least significant
  set bit and is bounded by the width of\nthe argument."
