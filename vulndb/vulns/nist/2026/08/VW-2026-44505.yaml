title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  6lowpan: hold L2CAP conn across debugfs control\n\nget_l2cap_conn() looks up an
  LE hci_conn under hdev protection, but\nthen drops that protection before reading
  hcon->l2cap_data and before\nlowpan_control_write() later dereferences conn->hcon.\
  \  A disconnect or\ndevice close can tear down the same L2CAP connection in that
  window.\n\nThe buggy scenario involves two paths, with each column showing the order\n\
  within that path:\n\n6LoWPAN control write:              HCI disconnect/device close:\n\
  \  1. get_l2cap_conn() finds hcon      1. hci_disconn_cfm() dispatches\n     and
  hcon->l2cap_data.               the L2CAP disconnect callback.\n  2. get_l2cap_conn()
  drops hdev      2. l2cap_conn_del() clears\n     protection and returns conn.  \
  \      hcon->l2cap_data and drops the\n                                        \
  \ L2CAP connection reference.\n  3. lowpan_control_write() reads     3. hci_conn_del()
  removes and drops\n     conn->h"
