title: "A vulnerability in the OSPF protocol of Cisco Secure Firewall Adaptive Security
  Appliance (ASA) Software and Cisco Secure Firewall Threat Defense (FTD) Software
  could allow an authenticated, adjacent attacker to exhaust memory on an affected
  device, resulting in a denial of service (DoS) condition.\r\n\r This vulnerability
  is due to improperly validating input by the OSPF protocol when parsing packets.
  An attacker could exploit this vulnerability by by sending crafted OSPF packets
  to an affected device. A successful exploit could allow the attacker to exhaust
  memory on the affected device, resulting in a DoS condition."
