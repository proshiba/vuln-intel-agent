title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  libiscsi_tcp: Bound SCSI Response data segment to the connection buffer\n\niscsi_tcp_hdr_dissect()
  receives the data segment of several PDU types\ninto the fixed-size conn->data buffer,
  which is allocated for\nISCSI_DEF_MAX_RECV_SEG_LEN (8192) bytes.  For the LOGIN_RSP,
  TEXT_RSP,\nREJECT and ASYNC_EVENT opcodes the dissect path already rejects a PDU\n\
  whose DataSegmentLength exceeds that buffer.\n\nThe SCSI Command Response (ISCSI_OP_SCSI_CMD_RSP)
  path also copies its\ndata segment (sense/response data) into conn->data via\niscsi_tcp_data_recv_prep(),
  but it does so without the same check.  The\nonly upstream bound on in.datalen is
  conn->max_recv_dlength, the\ninitiator's advertised MaxRecvDataSegmentLength, which
  is commonly\nnegotiated well above 8192 (open-iscsi defaults to 262144).  A target\n\
  that returns a SCSI Response with a DataSegmentLength between 8193 and\nmax_recv_dlength
  therefore overflows the 8192-byte conn->data"
