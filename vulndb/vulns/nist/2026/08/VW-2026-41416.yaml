title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm_mpam:
  guard MBWU state before adding it to garbage\n\n__destroy_component_cfg() adds each
  RIS mbwu_state object to the MPAM\ngarbage list when destroying component configuration.\n\
  \nHowever, mbwu_state is allocated per RIS and only for RISes with MBWU\nmonitors.
  A component can therefore have comp->cfg allocated while some\nRISes still have
  ris->mbwu_state set to NULL.\n\nPassing a NULL mbwu_state to add_to_garbage() dereferences
  the NULL\npointer inside the macro.\n\nSkip RISes that do not have an mbwu_state
  object before adding them to\nthe garbage list."
