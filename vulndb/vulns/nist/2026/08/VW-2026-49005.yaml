title: Horde IMP's AppleDouble MIME viewer writes an attacker-controlled 
  attachment name into an HTML status block without escaping it. In 
  lib/Mime/Viewer/Appledouble.php, _IMPrender() obtains the name of the data 
  part with IMP_Contents::getPartName(), which returns the MIME part's own name 
  parameter as supplied by the message, and passes it through sprintf into the 
  text of an IMP_Mime_Status object. IMP_Mime_Status::__toString() concatenates 
  each text entry directly into the surrounding table markup, so the value 
  reaches the rendered page verbatim. A message crafted as multipart/appledouble
  whose data part carries markup in its name parameter therefore executes script
  in the context of any user who views it, and the payload persists in the 
  mailbox. Exploitation requires no account on the target system, only the 
  ability to send mail to a user. Version 7.2.0 escapes the value with 
  htmlspecialchars(). The researcher additionally chains this flaw with the 
