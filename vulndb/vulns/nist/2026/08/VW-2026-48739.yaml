title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  tcp: Fix use-after-free in bpf_iter_tcp_established_batch()\n\nreqsk_queue_hash_req()
  publishes a TCP_NEW_SYN_RECV request_sock onto\nthe ehash chain, drops the bucket
  lock, and only afterwards sets\nrsk_refcnt to 3.\n\nLockless readers such as __inet_lookup_established()
  handle this with\nrefcount_inc_not_zero(), but bpf_iter_tcp_established_batch()
  uses plain\nsock_hold() while holding the bucket lock, on the assumption that the\n\
  lock guarantees sk_refcnt > 0. That assumption does not hold for\nrequest_sock:\n\
  \n  CPU 0                                CPU 1\n  -----                        \
  \        -----\n  tcp_conn_request()\n   reqsk_queue_hash_req()\n    inet_ehash_insert(req)\n\
  \     spin_lock(bucket)\n     __sk_nulls_add_node_rcu(req)      // rsk_refcnt ==
  0\n     spin_unlock(bucket)\n                                       bpf_iter_tcp_established_batch()\n\
  \                                        spin_lock(bucket)\n                   "
