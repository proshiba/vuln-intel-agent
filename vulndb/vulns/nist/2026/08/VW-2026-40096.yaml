title: A vulnerability was identified in mf-yang openclaw-cn up to 0.2.1. This 
  issue affects the function assertNoSymlinkEscape of the file 
  src/agents/sandbox-paths.ts of the component apply_patch Tool. Such 
  manipulation leads to link following. It is possible to launch the attack 
  remotely. The exploit is publicly available and might be used. The project was
  informed of the problem early through an issue report but has not responded 
  yet.
