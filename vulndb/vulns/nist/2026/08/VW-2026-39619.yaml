title: The Contact Form 7 – Dynamic Text Extension plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting in all versions up to, and 
  including, 5.0.5. This is due to insufficient output escaping on form 
  shortcode keys displayed in the admin "Scan Forms for Post Meta and User Data 
  Keys" page. This makes it possible for authenticated attackers, with 
  Editor-level access and above, to inject arbitrary web scripts that execute 
  when an Administrator runs the scan feature.
