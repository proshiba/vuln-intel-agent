title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix the volume AFS_VOLUME_RM_TREE is set on\n\nFix afs_insert_volume_into_cell()
  to set AFS_VOLUME_RM_TREE on the volume\nreplaced, not the new volume, as it's now
  removed from the cell's volume\ntree.  This will cause the old volume to be removed
  from the tree twice and\nthe new volume never to be removed."
