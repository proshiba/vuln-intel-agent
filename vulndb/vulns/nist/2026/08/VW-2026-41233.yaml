title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  avoid auth_enable sysctl UAF during netns teardown\n\nproc_sctp_do_auth() updates
  the SCTP control socket after changing\nnet.sctp.auth_enable. The handler gets the
  per-net SCTP state from\nctl->data, so an already opened sysctl file can still target
  a network\nnamespace while that namespace is being torn down.\n\nSCTP previously
  registered its per-net sysctls from sctp_defaults_init(),\nwhile the control socket
  is created later from sctp_ctrlsock_init(). This\nexposed a window during initialization
  where auth_enable was writable\nbefore net->sctp.ctl_sock existed, and a teardown
  window where auth_enable\nstayed writable after inet_ctl_sock_destroy() had released
  the control\nsocket.\n\nMove the per-net SCTP sysctl registration into sctp_ctrlsock_init()
  after\nsctp_ctl_sock_init() succeeds, and unregister the sysctl table before\ndestroying
  the control socket in sctp_ctrlsock_exit(). If sysctl\nregistration fails after
