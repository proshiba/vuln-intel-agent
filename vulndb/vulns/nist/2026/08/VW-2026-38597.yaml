title: Copier is a library and CLI app for rendering project templates. From 
  9.5.0 through 9.16.0, percent-encoded parent-directory segments or encoded 
  path separators in a template URL can match a configured trusted repository 
  prefix before an HTTP server or Git transport decodes the path, allowing 
  unsafe template features from a repository outside the trusted prefix to run 
  after user interaction. This issue is fixed in version 9.17.0.
