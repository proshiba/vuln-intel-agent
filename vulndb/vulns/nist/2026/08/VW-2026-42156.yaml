title: Vim is an open source, command line text editor. From 9.2.0511 until 
  9.2.0844, json_decode_item() in src/json.c can retain a stale pointer after 
  json_decode_string() invokes channel_fill() to refill and free the current 
  buffer, causing the error path to read freed memory instead of reader->js_buf 
  + reader->js_used when an invalid JSON string spans buffers. This issue is 
  fixed in version 9.2.0844.
