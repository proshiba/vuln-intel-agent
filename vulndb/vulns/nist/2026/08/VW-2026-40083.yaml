title: "The account locking mechanism fails to trigger when secondary user stores
  are inaccessible. The software does not maintain a consistent state for account
  locking if it cannot reach all configured user stores, allowing an attacker to repeatedly
  attempt authentication with invalid credentials without triggering the lockout mechanism
  for users within active stores.\n\nWhen the account locking mechanism is bypassed
  due to the inaccessibility of secondary user stores, users in accessible user stores
  are left vulnerable to brute force attacks. A malicious actor can exploit this by
  attempting numerous invalid password combinations against a user account without
  the expected account lockout consequence."
