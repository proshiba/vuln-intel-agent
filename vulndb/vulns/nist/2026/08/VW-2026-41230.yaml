title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  bound pg_{temp,upmap,upmap_items} length to CEPH_PG_MAX_SIZE\n\n__decode_pg_temp()
  decodes an user-controlled length but only rejects\nvalues large enough to overflow
  the allocation; it does not bound it to\nCEPH_PG_MAX_SIZE. The helper backs both
  pg_temp and pg_upmap decoding, and\napply_upmap()/get_temp_osds() later copy the
  decoded list into the fixed-size\non-stack array struct ceph_osds.osds[CEPH_PG_MAX_SIZE].
  A monitor that sends\nan OSDMap with a pg_temp/pg_upmap entry longer than 32 thus
  causes a stack\nout-of-bounds write.\n\nAn OSD set for a single PG can never exceed
  CEPH_PG_MAX_SIZE, so reject longer\nentries at decode time. The bound is well below
  the old overflow threshold, so\nit also covers the allocation-size overflow the
  previous check guarded against.\n\n  BUG: KASAN: stack-out-of-bounds in ceph_pg_to_up_acting_osds\n\
  \  Write of size 4 ... by task exploit\n   kasan_report (mm/kasan/report.c:595)\n\
  \   ceph_pg_"
