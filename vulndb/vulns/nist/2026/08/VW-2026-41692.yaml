title: A flaw was found in the Data Science Pipelines Operator (DSPO). The 
  operator's ClusterRole, which defines its permissions, includes extensive 
  privileges beyond what is necessary for its operation. These excessive 
  permissions, such as the ability to execute commands within pods and manage 
  cluster-wide roles, could be exploited. If the DSPO pod were compromised, an 
  attacker could leverage these privileges to gain full administrative control 
  over the entire Kubernetes cluster.
