title: TypeORM's SelectQueryBuilder.distinctOn accepts an array of strings and 
  stores it on the expression map without validation. For PostgreSQL-family 
  drivers, createSelectDistinctExpression in 
  src/query-builder/SelectQueryBuilder.ts joins that array and interpolates the 
  result into the generated statement as SELECT DISTINCT ON (values), with no 
  escaping, quoting, identifier validation or allowlist, and without routing the
  values through replacePropertyNames or the driver's escape helper. Because the
  interpolation point is a parenthesized SQL expression list rather than an 
  identifier-only position, a supplied element may carry arbitrary expressions, 
  including correlated subqueries. An application that forwards a 
  client-controlled value into distinctOn, for instance to let a caller choose a
  deduplication column, allows that client to read data anywhere the 
  application's database role can reach through boolean or time-based inference,
  independently of the entity being queried. validateOrderBy
