title: Renovate versions from 39.218.0 before 40.33.0 contain an arbitrary 
  command injection vulnerability in the kustomize manager where user-provided 
  chart names are appended to helm pull commands without proper sanitization. 
  Attackers with repository write access can craft malicious kustomization.yaml 
  files with specially crafted chart names to execute arbitrary commands on the 
  Renovate host machine.
