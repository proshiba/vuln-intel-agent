title: ReadyEcommerce before 4.5.2 contains an unauthenticated SQL injection 
  vulnerability in the product listing API where the rating parameter from the 
  products endpoint is concatenated directly into a MySQL HAVING clause without 
  parameterization in ProductController.php. Attackers can perform time-based 
  blind SQL injection through the unsanitized rating parameter to extract the 
  full database contents, including user credentials and administrator password 
  hashes, with potential additional file system access due to the database 
  connection running as root.
