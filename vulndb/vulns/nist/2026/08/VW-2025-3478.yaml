title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmt76:
  fix monitor mode crash with sdio driver\n\nmt7921s driver may receive frames with
  fragment buffers. If there is a\nCTS packet received in monitor mode, the payload
  is 10 bytes only and\nneed 6 bytes header padding after RXD buffer. However, only
  RXD in the\nfirst linear buffer, if we pull buffer size RXD-size+6 bytes with\n\
  skb_pull(), that would trigger \"BUG_ON(skb->len < skb->data_len)\" in\n__skb_pull().\n\
  \nTo avoid the nonlinear buffer issue, enlarge the RXD size from 128 to\n256 to
  make sure all MCU operation in linear buffer.\n\n[   52.007562] kernel BUG at include/linux/skbuff.h:2313!\n\
