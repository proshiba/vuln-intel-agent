title: "HTML::FormHandler versions through 0.40068 for Perl allow attacker selected
  method dispatch and resource exhaustion because _apply_actions and add_error use
  error message text built from request data as a Locale::Maketext bracket notation
  template.\n\nadd_error hands its first argument to the language handle as the Locale::Maketext
  message key, and the default handle's lexicon sets `_AUTO`, so a string that is
  not a lexicon entry is compiled as a bracket notation template instead of being
  looked up. In a bracket group the first token names a method called on the language
  handle and the remaining tokens are its arguments.\n\nThree kinds of text the library
  did not author reach that position. _apply_actions installs a `$SIG{__WARN__}` handler
  that stores the warning text in `$error_message`, and a captured warning survives
