title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix use-after-free in same_client_has_lease()\n\nsame_client_has_lease() returns
  an opinfo pointer from ci->m_op_list\nafter dropping ci->m_lock without taking a
  reference.\n\nsmb_grant_oplock() then dereferences that pointer in copy_lease()
  and\nwhen checking breaking_cnt. A concurrent close can remove the old lease\nfrom
  ci->m_op_list and drop the last reference before the caller uses\nthe returned pointer,
  leading to a use-after-free.\n\nTake a reference when same_client_has_lease() selects
  an existing lease,\ndrop any previous match while scanning, and release the returned\n\
  reference in smb_grant_oplock() after copying the lease state."
