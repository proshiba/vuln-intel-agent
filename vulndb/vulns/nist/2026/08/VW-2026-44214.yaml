title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  cn10k: restrict VF LMTLINE sharing to its own PF\n\nrvu_mbox_handler_lmtst_tbl_setup()
  uses req->base_pcifunc as a direct\nindex into the LMT map table to read another
  function's LMTLINE\nphysical base address and copy it into the caller's own LMT
  map table\nentry. The mailbox dispatcher authenticates req->hdr.pcifunc from the\n\
  IRQ source, but req->base_pcifunc is a separate payload field and is\nnot sanitized.\n\
  \nReject the request with -EPERM when a VF caller's base_pcifunc is not a\nvalid
  function under its own PF. is_pf_func_valid() bounds the FUNC field\nto the PF's
  configured VF count, keeping the computed index inside the\ncaller's own slot block."
