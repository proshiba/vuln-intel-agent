title: The report.list procedure in packages/trpc/src/routers/report.ts accepted
  a projectId and a dashboardId and returned 
  getReportsByDashboardId(dashboardId). The enforceAccess middleware in 
  packages/trpc/src/trpc.ts verified membership for the supplied projectId, but 
  nothing verified that the supplied dashboardId belonged to that project, and 
  getReportsByDashboardId in packages/db/src/services/reports.service.ts selects
  reports by dashboardId alone with no project scoping. An authenticated user 
  could therefore pair a projectId from their own organization, which satisfies 
  the middleware, with a dashboardId belonging to another organization and 
  receive every report in that dashboard. A correctly scoped helper, 
  listReportsCore, already existed in the same service file and resolves the 
  dashboard through getDashboardById(dashboardId, projectId) before returning 
  reports, but the router did not use it.
