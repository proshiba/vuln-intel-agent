title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/mst:
  limit DP MST ESI service loop\n\nThe loop in intel_dp_check_mst_status() keeps servicing
  interrupts\noriginating from the sink without bound. Add an upper bound to the new\n\
  interrupts occurring during interrupt processing to not get stuck on\npotentially
  stuck sink devices. Use arbitrary 32 tries to clear incoming\ninterrupts in one
  go.\n\nDiscovered using AI-assisted static analysis confirmed by Intel Product\n\
  Security.\n\nNote: The condition likely pre-dates the commit in the Fixes: tag,
  but\nthis is about as far back as a backport has any chance of\nsucceeding. Before
  that, the retry had a goto.\n\n(cherry picked from commit b4ea5272133059acb493cc36599071a9e852ec2e)"
