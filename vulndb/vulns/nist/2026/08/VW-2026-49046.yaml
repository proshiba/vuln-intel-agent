title: "Improper input validation vulnerability in Apache Camel Undertow component.\n\
  \n\n\nThis issue affects Apache Camel: from 4.11.0 before 4.14.9, from 4.15.0 before
  4.18.4, from 4.19.0 before 4.22.0.\n\n\n\nUndertowEndpoint defaulted its headerFilterStrategy
  field to the base HttpHeaderFilterStrategy and pushed that instance into the UndertowHttpBinding
  it creates lazily, overwriting the UndertowHeaderFilterStrategy that DefaultUndertowHttpBinding
  installs in its own constructor. Unless a deployment supplied a custom binding or
  an explicit headerFilterStrategy, the undertow-specific filtering therefore never
