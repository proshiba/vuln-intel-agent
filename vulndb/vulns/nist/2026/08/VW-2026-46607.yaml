title: 'Vulnerability in the Siebel CRM Cloud Applications product of Oracle Siebel
  CRM (component: Siebel Cloud Manager).  Supported versions that are affected are
  22.3-26.6. Easily exploitable vulnerability allows unauthenticated attacker with
  access to the physical communication segment attached to the hardware where the
  Siebel CRM Cloud Applications executes to compromise Siebel CRM Cloud Applications.  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all Siebel CRM Cloud Applications accessible
  data as well as  unauthorized access to critical data or complete access to all
  Siebel CRM Cloud Applications accessible data. CVSS 3.1 Base Score 8.1 (Confidentiality
  and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N).'
