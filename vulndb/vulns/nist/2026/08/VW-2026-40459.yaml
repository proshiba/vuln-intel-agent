title: OpenReception's appointment booking software provides an end-to-end 
  encrypted appointment booking platform. Prior to version 1.0.1, a fully 
  provisioned OpenReception instance accepts unauthenticated POST requests to 
  `/setup/create-admin-account` and creates additional GLOBAL_ADMIN accounts 
  without verifying that an admin already exists. Any unauthenticated network 
  attacker who can submit a same-origin form POST gains full platform-level 
  administrative control. The newly created account is `is_active=true` with 
  `confirmation_state=ACCESS_GRANTED` and does not require completing email 
  confirmation; the GLOBAL_ADMIN row is created active and immediately usable. 
  Login and tenant enumeration succeed without any further interaction. This is 
  distinct from the deployment race condition already documented on the 
  `Claiming an instance` page. That documented race covers the window between 
  deployment and first claim. The bug reported here works after the operator has
  properly claimed and configure
