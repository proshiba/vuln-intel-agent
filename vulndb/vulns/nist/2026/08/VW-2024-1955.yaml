title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  Fix NULL pointer dereferencing in smc_vlan_by_tcpsk()\n\nCoverity reports a possible
  NULL dereferencing problem:\n\nin smc_vlan_by_tcpsk():\n6. returned_null: netdev_lower_get_next
  returns NULL (checked 29 out of 30 times).\n7. var_assigned: Assigning: ndev = NULL
  return value from netdev_lower_get_next.\n1623                ndev = (struct net_device
  *)netdev_lower_get_next(ndev, &lower);\nCID 1468509 (#1 of 1): Dereference null
  return value (NULL_RETURNS)\n8. dereference: Dereferencing a pointer that might
  be NULL ndev when calling is_vlan_dev.\n1624                if (is_vlan_dev(ndev))
  {\n\nRemove the manual implementation and use netdev_walk_all_lower_dev() to\niterate
  over the lower devices. While on it remove an obsolete function\nparameter comment."
