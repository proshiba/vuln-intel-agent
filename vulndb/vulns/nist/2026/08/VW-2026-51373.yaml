title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  airoha: fix foe_check_time allocation size\n\nfoe_check_time is declared as u16
  pointer but was allocated with\nonly ppe_num_entries bytes instead of ppe_num_entries
  * sizeof(u16).\n\nWhen airoha_ppe_foe_verify_entry() is called with hash >= ppe_num_entries/2,\n\
  it writes beyond the allocated buffer, causing heap buffer overflow and\npotential
  kernel crash."
