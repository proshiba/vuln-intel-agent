title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma-pcie: Reject devices without driver data\n\ndw_edma_pcie_probe() treats
  the PCI device ID driver_data as the\ntemplate for the controller layout and copies
  it unconditionally. A\ndevice bound dynamically via sysfs can match the driver without
  that\ndata, which leads to a NULL pointer dereference.\n\nReject such matches before
  enabling the device."
