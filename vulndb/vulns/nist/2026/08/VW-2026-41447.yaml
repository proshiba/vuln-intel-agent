title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix auth_hmacs array size in struct sctp_cookie\n\nThe auth_hmacs array in struct
  sctp_cookie is supposed to store a complete\nSCTP_AUTH_HMAC_ALGO parameter, which
  consists of a struct sctp_paramhdr\nfollowed by N HMAC identifiers.\n\nHowever,
  the array size was calculated using an extra 2 bytes instead of\nsizeof(struct sctp_paramhdr),
  which is 4 bytes. When four HMAC identifiers\nare configured, the HMAC-ALGO parameter
  stored in the endpoint is larger\nthan the auth_hmacs buffer in the cookie.\n\n\
  As a result, sctp_association_init() copies beyond the end of auth_hmacs\nwhen initializing
  the association, corrupting the adjacent auth_chunks\nfield. This can lead to an
  invalid HMAC identifier being accepted and later\ncause an out-of-bounds read in
  sctp_auth_get_hmac().\n\nFix the array size calculation by including the full SCTP
  parameter header\nsize."
