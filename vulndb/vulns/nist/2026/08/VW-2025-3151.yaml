title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm/dp:
  Drop aux devices together with DP controller\n\nUsing devres to depopulate the aux
  bus made sure that upon a probe\ndeferral the EDP panel device would be destroyed
  and recreated upon next\nattempt.\n\nBut the struct device which the devres is tied
  to is the DPUs\n(drm_dev->dev), which may be happen after the DP controller is torn\n\
  down.\n\nIndications of this can be seen in the commonly seen EDID-hexdump full\n\
  of zeros in the log, or the occasional/rare KASAN fault where the\npanel's attempt
  to read the EDID information causes a use after free on\nDP resources.\n\nIt's tempting
  to move the devres to the DP controller's struct device,\nbut the resources used
  by the device(s) on the aux bus are explicitly\ntorn down in the error path. The
  KASAN-reported use-after-free also\nremains, as the DP aux \"module\" explicitly
  frees its devres-allocated\nmemory in this code path.\n\nAs such, explicitly depopulate
  the aux bus in the error "
