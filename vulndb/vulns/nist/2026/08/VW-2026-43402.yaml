  vulnerability where SandboxPolicy evaluates raw command strings with quotes 
  preserved while the executor tokenizes commands by stripping quotes before 
  execution. Attackers can craft quoted commands that evade blocklist checks and
  approval gates while the executor runs the identical unquoted dangerous argv.
