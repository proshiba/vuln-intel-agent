title: GitPython before 3.1.53 fails to properly escape section names in git 
  config files, allowing attackers to inject arbitrary configuration directives 
  through malicious submodule names. Attackers can inject core.sshCommand or 
  other dangerous config keys into the victim's .git/config via create_submodule
  or clone_from operations, achieving remote code execution when git performs 
  ssh operations.
