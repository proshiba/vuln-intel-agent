title: 'Vulnerability in the Oracle Hyperion Calculation Manager product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows unauthenticated attacker with logon to
  the infrastructure where Oracle Hyperion Calculation Manager executes to compromise
  Oracle Hyperion Calculation Manager.  Successful attacks require human interaction
  from a person other than the attacker. Successful attacks of this vulnerability
  can result in  unauthorized update, insert or delete access to some of Oracle Hyperion
  Calculation Manager accessible data as well as  unauthorized read access to a subset
  of Oracle Hyperion Calculation Manager accessible data. CVSS 3.1 Base Score 3.6
  (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:L/I:L/A:N).'
