title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1,raid10:
  fix bio accounting for split md cloned bios\n\nUse md_cloned_bio() to control bio
  accounting instead of relying\non r1bio_existed in raid1 or the io_accounting flag
  in raid10.\n\nThe previous logic does not reliably reflect whether a bio is an\n\
  md cloned bio. When a failed bio is split and resubmitted via\nbio_submit_split_bioset()
  on the error path, this can lead to either\ndouble accounting for md cloned bios,
  or missing accounting for bios\nreturned from bio_submit_split_bioset()\n\nFix this
  by using md_cloned_bio() to detect md cloned bios and\nskip accounting accordingly."
