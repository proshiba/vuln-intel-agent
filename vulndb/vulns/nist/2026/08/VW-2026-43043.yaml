title: "Vulnerability-Lookup contains an \nauthentication weakness in its account
  activation and password-recovery \nmechanism. Activation and recovery links were
  generated using stateless \nsigned tokens containing only the user's login. Although
  the token \nsignature and age were validated, the application did not track whether
  a\n token had already been successfully used. As a result, a captured \nactivation
  or password-recovery link remained valid for the entire \nconfigured TOKEN_VALIDITY_PERIOD,
  even after the associated password had been changed. \n\n\nAn attacker who obtains
  a valid \nactivation or recovery token could therefore replay it multiple times\
  \ \nduring its validity period to set a new password and repeatedly take \ncontrol
  of the affected account. In addition, tokens were not bound to a\n specific purpose,
  allowing the same token mechanism to be used across \nactivation and recovery workflows.
  The patch introduces purpose-bound \ntokens and a random nonce whose SHA-256 digest
  is stored with "
