title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  use opener credentials for FSCTL mutations\n\nSET_SPARSE, SET_ZERO_DATA and SET_COMPRESSION
  operate on an open SMB\nhandle but call VFS xattr, fallocate or fileattr helpers
  with the current\nksmbd worker credentials. Those helpers can revalidate inode permissions,\n\
  ownership and LSM policy independently of the SMB handle access mask.\n\nRun each
  operation with the credentials captured in the target file when\nthe handle was
  opened. Keep credential handling local to these single-file\nFSCTLs rather than
  applying session credentials to the complete IOCTL\nhandler, which also contains
  handle-less and multi-handle operations."
