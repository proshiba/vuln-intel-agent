title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmailbox:
  mtk-adsp: fix UAF during device teardown\n\nWhen the SOF audio driver fails to initialize
  (e.g. firmware boot\ntimeout), its devres unwind frees the snd_sof_dev object that
  the\nmailbox client (mtk-adsp-ipc) reaches via chan->cl->rx_callback.\nThe mtk-adsp-mailbox
  shutdown clears the mailbox command registers\nbut leaves the IRQ line unmasked,
  so a late interrupt can still\nqueue a threaded handler after mbox_free_channel()
  had cleared\nchan->cl, and mbox_chan_received_data() would then trigger UAF:\n\n\
  \  BUG: KASAN: slab-use-after-free in sof_ipc3_validate_fw_version\n   sof_ipc3_validate_fw_version\n\
