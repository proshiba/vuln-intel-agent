title: 'A vulnerability was determined in Webkul Bagisto up to 2.4.4. This affects
  an unknown part of the file /customer/account/rma/send-message of the component
  RMA Message Handler. This manipulation of the argument Message causes cross site
  scripting. Remote exploitation of the attack is possible. The exploit has been publicly
  disclosed and may be utilized. The vendor confirms: "The reported issues were already
  identified through our internal security assessment process prior to this notification
  and are being handled through our established internal security and development
  lifecycle. Some of these items have already been addressed, while the remaining
  items are planned for resolution in upcoming product releases."'
