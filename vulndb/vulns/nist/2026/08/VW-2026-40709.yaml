title: "In versions of the Datadog Android application prior to v541-5.9.2, the exported
  launcher activity AppActivity accepts an attacker-supplied session (including OAuth
  tokens) from Intent extras with no permission guard, and signs the app into that
  session without validating it against the backend.\r\nThis requires a malicious
  application co-installed on a device with the Datadog app installed, and an OAuth
  token the attacker is willing to load into the victim's app.\r\nImpact: A co-installed
  application can switch the victim's Datadog app to a session the attacker controls.
  This is an account-confusion issue; it does not by itself expose the victim's existing
  session or data."
