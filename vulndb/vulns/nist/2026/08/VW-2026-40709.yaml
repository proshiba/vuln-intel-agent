title: "The launcher activity AppActivity in the Datadog Android application is declared
  android:exported=\"true\" with launchMode=\"singleTask\" and no permission guard.
  On every onCreate and onNewIntent, it invokes Intent.getUserSession(), an extension
  that deserializes a full UserSession — user identity, OAuth access and refresh tokens,
  host, organization, datacenter, and permissions — from Bundle extras keyed under
  the com.datadog.app.* namespace. This extension lives in the main sourceset, not
  a test-only sourceset, despite a misleading comment referencing internal test fixtures.\r\
  \nAny application installed on the device can invoke the launcher with arbitrary
  session extras. The startup pipeline accepts the injected session, persists it to
  user storage, optionally rotates persisted token storage when an OAUTH_OVERRIDE_TOKEN
  extra is set, and performs an automatic login under the attacker-chosen identity.
