title: A vulnerability was determined in jeecgboot jeewx-boot up to 
  641ab52c3e1845fec39996d7794c33fb40dad1dd. This issue affects the function 
  MyJwWebJwid3Controller.doUpload of the file 
  jeewx-boot-module-weixin/src/main/java/com/jeecg/p3/open/web/back/MyJwWebJwid3Controller.java
  of the component doUpload Endpoint. Executing a manipulation of the argument 
  File can lead to unrestricted upload. The attack can be executed remotely. The
  exploit has been publicly disclosed and may be utilized. This product 
  implements a rolling release for ongoing delivery, which means version 
  information for affected or updated releases is unavailable. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
