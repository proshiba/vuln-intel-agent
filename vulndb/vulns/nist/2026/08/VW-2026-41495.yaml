title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  virt_concat: fix use-after-free in mtd_virt_concat_destroy_joins()\n\nmtd_concat_destroy()
  frees item->concat so calling\nmtd_virt_concat_put_mtd_devices(item->concat) leads
  to a use after free.\n\nFix this by moving mtd_virt_concat_put_mtd_devices() before\n\
  mtd_concat_destroy()"
