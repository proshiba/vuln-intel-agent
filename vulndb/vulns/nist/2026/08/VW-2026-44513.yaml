title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  TC, skip peer flow cleanup when LAG seq is unavailable\n\nmlx5_lag_get_dev_seq()
  will return error when the peer isn't in the LAG\nor when no device is marked as
  master. Result bad memory access and kernel\ncrash[1].\n\nHence, skip the peer when
  lookup fails.\n\nNote: In case there are peer flows, they are cleaned before LAG
  cleared\nthe master mark.\n\n[1]\nRIP: 0010:mlx5e_tc_del_fdb_peers_flow+0x3d/0x350
