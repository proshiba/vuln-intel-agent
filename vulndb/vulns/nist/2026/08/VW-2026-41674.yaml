title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, Dokploy's backup and restore pipeline constructs shell commands by 
  directly interpolating user-controlled database fields into bash -c "..." and 
  sh -c "..." strings, then executes them via child_process.exec(). An 
  authenticated admin/owner can inject arbitrary OS commands that execute on the
  host machine running Dokploy (not just inside a container). This vulnerability
  is fixed in 0.29.13.
