title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix devx subscribe-event unwind NULL dereference\n\nMLX5_IB_METHOD_DEVX_SUBSCRIBE_EVENT()
  links event_sub into sub_list\nbefore initializing the fields used by the shared
  error path.\n\nIf eventfd_ctx_fdget() then fails, the unwind path dereferences\n\
  event_sub->ev_file in uverbs_uobject_put() and calls\nsubscribe_event_xa_dealloc()
  with an unset xa_key_level1.\n\nsubscribe_event_xa_alloc() creates the XA entry
  exactly once for a given\nkey_level1, on the first occurrence of that key. The unwind
  path must\ntherefore call subscribe_event_xa_dealloc() exactly once for it as well.\n\
  \nEnforce that by adding devx_key_in_sub_list() and calling\nsubscribe_event_xa_dealloc()
  only when the last matching pending entry is\nbeing cleaned up."
