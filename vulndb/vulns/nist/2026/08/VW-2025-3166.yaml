title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/psi:
  use kernfs polling functions for PSI trigger polling\n\nDestroying psi trigger in
  cgroup_file_release causes UAF issues when\na cgroup is removed from under a polling
  process. This is happening\nbecause cgroup removal causes a call to cgroup_file_release
  while the\nactual file is still alive. Destroying the trigger at this point would\n\
  also destroy its waitqueue head and if there is still a polling process\non that
  file accessing the waitqueue, it will step on the freed pointer:\n\ndo_select\n\
  \  vfs_poll\n                           do_rmdir\n                             cgroup_rmdir\n\
  \                               kernfs_drain_open_files\n                      \
  \           cgroup_file_release\n                                   cgroup_pressure_release\n\
  \                                     psi_trigger_destroy\n                    \
  \                   wake_up_pollfree(&t->event_wait)\n// vfs_poll is unblocked\n\
  \                      "
