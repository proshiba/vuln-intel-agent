title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio-wq:
  check for wq exit after adding new worker task_work\n\nWe check IO_WQ_BIT_EXIT before
  attempting to create a new worker, and\nwq exit cancels pending work if we have
  any. But it's possible to have\na race between the two, where creation checks exit
  finding it not set,\nbut we're in the process of exiting. The exit side will cancel
  pending\ncreation task_work, but there's a gap where we add task_work after we've\n\
  canceled existing creations at exit time.\n\nFix this by checking the EXIT bit post
  adding the creation task_work.\nIf it's set, run the same cancelation that exit
  does."
