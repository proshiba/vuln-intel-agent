title: A flaw was found in Red Hat Quay. An administrator of any repository, by 
  knowing or guessing a target notification's Universally Unique Identifier 
  (UUID), can read the notification configuration, including sensitive details 
  like webhook URLs, Slack tokens, and email addresses. This vulnerability also 
  allows them to trigger test notifications for another repository. This could 
  lead to unauthorized information disclosure and potential misuse of 
  notification services.
