title: The Grav Email plugin (getgrav/grav-plugin-email) before 4.2.2 renders 
  page-editor-controlled Email action parameters as unsandboxed Twig templates. 
  An authenticated remote user with only api.access and api.pages.write 
  permissions can place a Twig expression in header.form.process.email.body, 
  publish the page, and submit the form to execute an arbitrary operating-system
  command as the account running PHP.
