title: Memos' webhook URL validation, isReservedIP() 
  (internal/webhook/validate.go), checks a candidate IP against a reservedCIDRs 
  list that omits 0.0.0.0/8 and never calls ip.IsUnspecified() — unlike the 
  correctly implemented sibling function isInternalIP() in 
  internal/httpgetter/html_meta.go, which does. Because Linux redirects 
  connections to 0.0.0.0 to loopback (127.0.0.1), an attacker registering a 
  webhook URL of http://0.0.0.0:PORT/ bypasses the reserved-IP check and causes 
  the Memos server to make outbound HTTP requests to its own loopback interface,
  exposing internal-only services.
