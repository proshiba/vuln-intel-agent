title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  drop ppath from ext4_ext_replay_update_ex() to avoid double-free\n\nWhen calling
  ext4_force_split_extent_at() in ext4_ext_replay_update_ex(),\nthe 'ppath' is updated
  but it is the 'path' that is freed, thus potentially\ntriggering a double-free in
  the following process:\n\next4_ext_replay_update_ex\n  ppath = path\n  ext4_force_split_extent_at(&ppath)\n\
  \    ext4_split_extent_at\n      ext4_ext_insert_extent\n        ext4_ext_create_new_leaf\n\
  \          ext4_ext_grow_indepth\n            ext4_find_extent\n              if
  (depth > path[0].p_maxdepth)\n                kfree(path)                 ---> path
  First freed\n                *orig_path = path = NULL    ---> null ppath\n  kfree(path)\
  \                               ---> path double-free !!!\n\nSo drop the unnecessary
  ppath and use path directly to avoid this problem.\nAnd use ext4_find_extent() directly
  to update path, avoiding unnecessary\nmemory allocation and freeing. Also, pro"
