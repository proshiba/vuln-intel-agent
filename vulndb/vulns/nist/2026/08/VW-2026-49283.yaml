title: "The Zephyr ext2 filesystem driver fails to validate the s_log_block_size field
  of the on-disk superblock when mounting a filesystem. ext2_verify_disk_superblock()
  in subsys/fs/ext2/ext2_impl.c checks the magic number, revision, inode size and
  group counts, but never bounds s_log_block_size. On a successful verify, subsys/fs/ext2/ext2_ops.c
  computes fs->block_size = 1024 << superblock.s_log_block_size from this attacker-controlled
  uint32_t, so a crafted value either overflows the shift (undefined behaviour) or
  yields a block size far larger than CONFIG_EXT2_MAX_BLOCK_SIZE.\n\nThat block size
  is then passed to k_mem_slab_init() by ext2_init_blocks_slab() to carve CONFIG_EXT2_MAX_BLOCK_COUNT
  blocks out of the fixed static buffer __ext2_block_memory_buffer, whose size is
  CONFIG_EXT2_MAX_BLOCK_COUNT * CONFIG_EXT2_MAX_BLOCK_SIZE. k_mem_slab_init() does
  not verify that the requested blocks fit the buffer, and the ext2 wrapper discards
  its return value, so the slab is laid out past the end of th"
