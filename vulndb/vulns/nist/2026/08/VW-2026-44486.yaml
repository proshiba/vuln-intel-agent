title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  pin upper rpc_clnt across the TLS connect_worker\n\nThe TLS connect path has a use-after-free:
  nothing pins the\nupper rpc_clnt across the delayed connect_worker. xs_connect()\n\
  stores task->tk_client in sock_xprt::clnt as a raw pointer\nand queues the worker;
  for TLS-secured transports that worker\nis xs_tcp_tls_setup_socket(), which reads
  several fields out\nof the saved pointer (cl_timeout, cl_program, cl_prog,\ncl_vers,
  cl_cred, cl_stats) to construct the args for the\ninner handshake rpc_clnt.\n\n\
  The xprt does not reference the rpc_clnt; the rpc_clnt\nreferences the xprt. xs_destroy()
  does cancel the\nconnect_worker, but it runs only when the xprt's refcount\ndrops
  to zero, which cannot happen until the rpc_clnt\nreleases its cl_xprt reference
  in rpc_free_client_work().\nWhen a TLS handshake fails fatally (for example, an
  mTLS\nmount whose client cert does not match the server), the\nconnecting task is
  woken with -EACCES an"
