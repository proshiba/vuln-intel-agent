title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sparx5: unregister blocking notifier on init failure\n\nsparx5_register_notifier_blocks()
  registers the switchdev blocking\nnotifier before allocating the ordered workqueue.
  If the workqueue\nallocation fails, the error path unregisters the switchdev and
  netdevice\nnotifiers, but leaves the blocking notifier registered.\n\nAdd a separate
  error label for the workqueue allocation failure path and\nunregister the switchdev
  blocking notifier there."
