title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  hynitron_cstxxx - validate touch count and finger IDs\n\nThe driver allocates max_touch_num
  input slots, which are indexed from\nzero through max_touch_num - 1. The current
  check allows a finger ID\nequal to max_touch_num to reach cst3xx_report_contact().
  While the input\ncore ignores out-of-range slot indices, reporting touch data without
  a\nvalid slot change corrupts the touch state of the previously active slot.\n\n\
  The touch count is read from the controller's report and is used to\nindex the fixed-size
  report buffer without first checking its range.\nReject counts larger than the supported
  number of touch slots before\nchecking the trailing byte or parsing touch data.\n\
  \nReject finger IDs equal to or greater than max_touch_num, and return\nimmediately
  when an invalid finger ID is encountered so that corrupt\ntouch frames are discarded
  instead of reporting partial contact state.\n\nThe V821 Avaota F1 board configures
