title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_ct: preserve tc_skb_cb across defragmentation\n\ntcf_ct_handle_fragments() calls
  nf_ct_handle_fragments() without saving\nand restoring skb->cb. The defrag helper
  clears IPCB/IP6CB, which aliases\nthe tc_skb_cb/qdisc_skb_cb control buffer. Fragmented
  traffic through\nact_ct therefore loses qdisc metadata such as pkt_segs and can
  trigger\nWARN_ON_ONCE() in qdisc_pkt_segs() when panic_on_warn is enabled.\n\nSave
  and restore the full tc_skb_cb around nf_ct_handle_fragments(),\nmatching the pattern
  used by ovs_ct_handle_fragments()."
