title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, cloneGitRepository in packages/server/src/utils/providers/git.ts 
  interpolates customGitUrl and customGitBranch into a git clone command passed 
  to execAsync or execAsyncRemote, allowing an authenticated user with 
  application access to execute arbitrary operating system commands on the 
  Dokploy host by setting a malicious custom Git URL and triggering deployment. 
  This issue is fixed in version 0.29.13.
