title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to tag gcing flag on page during block migration\n\nIt needs to add missing
  gcing flag on page during block migration,\nin order to garantee migrated data be
  persisted during checkpoint,\notherwise out-of-order persistency between data and
  node may cause\ndata corruption after SPOR.\n\nSimilar issue was fixed by commit
  2d1fe8a86bf5 (\"f2fs: fix to tag\ngcing flag on page during file defragment\")."
