title: A flaw was found in Foreman. The template revision endpoint does not 
  enforce object-level authorization when retrieving an audited template 
  revision. An authenticated, low privileged user with a template-related 
  permission, such as view_ptables, can obtain historical template contents 
  belonging to another organization or location by supplying the corresponding 
  audit ID. This can result in unauthorized disclosure of historical template 
  contents, which may contain sensitive configuration information, credentials, 
  or other secrets. The REST API revision endpoints correctly restrict this 
  lookup.
