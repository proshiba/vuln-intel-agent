title: The Pods – Custom Content Types and Fields plugin for WordPress is 
  vulnerable to Privilege Escalation via Authorization Bypass in all versions up
  to, and including, 3.3.9. The vulnerability exists because the pods_admin AJAX
  router funnels every access check — including the method allowlist, nonce 
  verification, login enforcement, and capability gate — through pods_error(), 
  which under the JSON meta-box-loader compatibility path only writes failures 
  to the PHP error log and returns false instead of terminating the request, 
  rendering all guards ineffective.  This makes it possible for unauthenticated 
  attackers to escalate their privileges to Administrator or overwrite the 
  password of any user account, including the site owner's, enabling complete 
  site takeover, or perform another administrator action.
