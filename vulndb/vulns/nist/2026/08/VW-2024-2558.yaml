title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  devmap: provide rxq after redirect\n\nrxq contains a pointer to the device from
  where\nthe redirect happened. Currently, the BPF program\nthat was executed after
  a redirect via BPF_MAP_TYPE_DEVMAP*\ndoes not have it set.\n\nThis is particularly
  bad since accessing ingress_ifindex, e.g.\n\nSEC(\"xdp\")\nint prog(struct xdp_md
  *pkt)\n{\n        return bpf_redirect_map(&dev_redirect_map, 0, 0);\n}\n\nSEC(\"\
  xdp/devmap\")\nint prog_after_redirect(struct xdp_md *pkt)\n{\n        bpf_printk(\"\
  ifindex %i\", pkt->ingress_ifindex);\n        return XDP_PASS;\n}\n\ndepends on
  access to rxq, so a NULL pointer gets dereferenced:\n\n<1>[  574.475170] BUG: kernel
  NULL pointer dereference, address: 0000000000000000\n<1>[  574.475188] #PF: supervisor
  read access in kernel mode\n<1>[  574.475194] #PF: error_code(0x0000) - not-present
  page\n<6>[  574.475199] PGD 0 P4D 0\n<4>[  574.475207] Oops: Oops: 0000 [#1] PREEMPT
  SMP NOPTI\n<4>[  574.475217] CPU: 4 UID: 0 PID: 2"
