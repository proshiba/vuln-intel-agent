title: The MongoDB client library for PHP does not sufficiently sanitize special
  elements in application-supplied namespace identifiers before using them to 
  construct the target namespace for database operations. An application that 
  incorporates untrusted text into these identifiers may have operations 
  silently directed at a different storage location than the one the application
  intended.
