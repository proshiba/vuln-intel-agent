title: A security flaw has been discovered in mz-automation libiec61850 up to 
  1.6.1. This vulnerability affects the function Reporting_RCBWriteAccessHandler
  of the file src/iec61850/server/mms_mapping/reporting.c of the component 
  Report Sending Path Handler. The manipulation results in free of memory not on
  the heap. It is possible to launch the attack remotely. The exploit has been 
  released to the public and may be used for attacks. Upgrading to version 1.6.2
  is able to resolve this issue. The patch is identified as 
  5b2a69f44256b8548927d8afdd7ac5f5381abe1e. It is suggested to upgrade the 
  affected component. The vendor was contacted early about this disclosure.
