title: A flaw was found in insights-client. When the application receives a 
  non-200 response, it logs the request headers, which can include the 
  cloud.openshift.com pull-secret token. A local user with access to pod logs on
  the hub could read this long-lived credential. This information disclosure 
  could grant unauthorized access to Red Hat cloud services.
