title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  add bounds check to run_get_highest_vcn()\n\nrun_get_highest_vcn() parses a packed
  NTFS mapping-pairs buffer without\nany length bound, relying solely on a 0x00 terminator
  to stop.  A\ncrafted $LogFile UpdateMappingPairs record whose embedded attribute\n\
  contains mapping-pairs runs without a terminator causes the function to\nread past
  the slab allocation, triggering a KASAN slab-out-of-bounds\nread on mount.\n\nThe
  sibling function run_unpack() received an analogous bounds-check in\ncommit b62567bca474
  (\"ntfs3: add buffer boundary checks to run_unpack()\"),\nbut run_get_highest_vcn()
  was missed.\n\nTake a run_buf_size parameter and reject any run header whose payload\n\
  would extend past the buffer end, mirroring the pattern used by\nrun_unpack(). \
  \ The caller in fslog.c passes the remaining attribute\nbytes after the mapping-pairs
  offset.\n\nKASAN report (on mainline v7.1 merge window HEAD):\n\n  BUG: KASAN: slab-out-of-bounds
  in "
