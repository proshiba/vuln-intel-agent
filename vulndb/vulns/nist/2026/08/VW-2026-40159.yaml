title: 'A vulnerability was detected in Kino-Kafkaesque ssh-mcp-server up to 8ebbbb99b26f80ff6162fe00957c6dec73fbc5a5.
  Impacted is the function ssh_exec of the file src/index.ts of the component SSH
  Command Handler. Performing a manipulation of the argument host/username results
  in command injection. The attack requires a local approach. The actual existence
  of this vulnerability is currently in question. This product adopts a rolling release
  strategy to maintain continuous delivery. Therefore, version details for affected
  or updated releases cannot be specified. The project maintainer explains: "The intended
  threat model is that this MCP server is a local/trusted tool for an agent to execute
  commands over SSH, so callers already have meaningful execution capability through
  the exposed shell."'
