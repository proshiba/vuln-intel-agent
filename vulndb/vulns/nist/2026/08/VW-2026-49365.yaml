title: A vulnerability was determined in liketrek TREK up to 3.0.22. The 
  affected element is the function journeyService.updateEntry of the file 
  server/src/nest/journey/journey.controller.t of the component Journey Entry 
  Update. This manipulation causes sql injection. It is possible to initiate the
  attack remotely. Upgrading to version 3.1.0 is sufficient to fix this issue. 
  It is recommended to upgrade the affected component.
