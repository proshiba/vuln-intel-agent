title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Take dma_resv lock before dma_buf_unpin() in release path\n\ndma_buf_unpin() requires
  the caller to hold the exporter's dma_resv\nlock:\n\n  void dma_buf_unpin(struct
  dma_buf_attachment *attach)\n  {\n          ...\n          dma_resv_assert_held(dmabuf->resv);\n\
  \          ...\n  }\n\niopt_release_pages() calls dma_buf_unpin() without taking
  that lock,\nso every iommufd_ioas_destroy()/iommufd_ioas_unmap() that releases\n\
  the last reference on a DMABUF-backed iopt_pages triggers a WARN.\nThis was hit
  while running tools/testing/selftests/iommu/iommufd:\n\n  WARNING: drivers/dma-buf/dma-buf.c:1137
  at dma_buf_unpin+0x62/0x70\n  RIP: 0010:dma_buf_unpin+0x62/0x70\n  Call Trace:\n\
  \   <TASK>\n   dma_buf_unpin+0x62/0x70\n   iopt_release_pages+0xe4/0x190\n   iopt_unmap_iova_range+0x1c7/0x290\n\
  \   iopt_unmap_all+0x1a/0x30\n   iommufd_ioas_destroy+0x1d/0x50\n   iommufd_fops_release+0x93/0x150\n\
  \   __fput+0xfc/0x2c0\n   __x64_sys_close+0x3d/0x80\n   do_s"
