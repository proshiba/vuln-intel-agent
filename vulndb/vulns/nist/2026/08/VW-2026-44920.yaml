title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_misc:
  restore write access when removing an entry\n\nRegistering an entry with the MISC_FMT_OPEN_FILE
  flag opens the\ninterpreter via open_exec() which denies write access to it for
  as\nlong as the entry exists. Removing the entry closes the interpreter\nfile via
  filp_close() but never restores write access, leaving the\ninode's i_writecount
  permanently negative. Opening the interpreter\nfor writing keeps failing with ETXTBSY
  long after the entry is gone\nuntil the inode is evicted from the inode cache.\n\
  \nCommit 90f601b497d7 (\"binfmt_misc: restore write access before\nclosing files
  opened by open_exec()\") fixed the same imbalance in the\nerror path of bm_register_write()
  but the actual removal path has\nbeen leaking the write denial since the introduction
  of the flag.\n\nRestore write access in put_binfmt_handler() before closing the\n\
  interpreter file."
