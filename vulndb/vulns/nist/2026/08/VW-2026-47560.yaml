title: ICEcoder 8.1 contains an unauthenticated remote code execution 
  vulnerability that allows unauthenticated attackers to execute arbitrary OS 
  commands by chaining an authentication bypass, CSRF validation bypass, and 
  unsanitized command execution. Attackers can send a single HTTP POST request 
  to the terminal endpoint with a password parameter to bypass authentication, a
  non-empty csrf parameter to skip CSRF validation, and an arbitrary command 
  string passed directly to proc_open() to achieve remote code execution as the 
  web-server user.
