title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  fix UAF of alloc->vma in race with munmap()\n\n[ cmllamas: clean forward port from
  commit 015ac18be7de (\"binder: fix\n  UAF of alloc->vma in race with munmap()\"\
  ) in 5.10 stable. It is needed\n  in mainline after the revert of commit a43cfc87caaf
  (\"android: binder:\n  stop saving a pointer to the VMA\") as pointed out by Liam.
  The commit\n  log and tags have been tweaked to reflect this. ]\n\nIn commit 720c24192404
  (\"ANDROID: binder: change down_write to\ndown_read\") binder assumed the mmap read
  lock is sufficient to protect\nalloc->vma inside binder_update_page_range(). This
  used to be accurate\nuntil commit dd2283f2605e (\"mm: mmap: zap pages with read
  mmap_sem in\nmunmap\"), which now downgrades the mmap_lock after detaching the vma\n\
  from the rbtree in munmap(). Then it proceeds to teardown and free the\nvma with
  only the read lock held.\n\nThis means that accesses to alloc->vma in binder_update_page_range()
  now\nwill race with"
