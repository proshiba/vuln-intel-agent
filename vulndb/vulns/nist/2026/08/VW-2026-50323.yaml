title: ZLMediaKit confines the downloadFile API to a configured set of root 
  directories with a prefix comparison that does not account for directory 
  boundaries. The configuration loader in server/WebApi.cpp builds each root 
  with File::absolutePath("", item, true); because the relative-path argument is
  empty that helper returns the value without a trailing separator. The handler 
  then accepts a requested path when start_with(file_path, root) holds, so a 
  sibling directory whose name merely begins with the configured root string 
  satisfies the test and is served. The only other guard rejects a path 
  containing two dots, which this requires none of. The equivalent confinement 
  check for the ordinary static file server in src/Http/HttpFileManager.cpp 
  computes its root with a non-empty second argument, which appends the 
  separator before comparing, and so is not affected. The endpoint requires the 
