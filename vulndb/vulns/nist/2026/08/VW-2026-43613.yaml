title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pci: Fix handling of AIF enable without AISB\n\nWhen a guest seeks to register
  IRQs without a summary bit specified,\nensure that the associated GAITE then stores
  0 for the guest AISB\nlocation instead of virt_to_phys(page_address(NULL))."
