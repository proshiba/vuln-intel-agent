title: A security vulnerability has been detected in sambitraj 
  Student-Management-System up to 56ba287f2e9031523ccb4244cb6e3fe530e4e5d5. The 
  impacted element is the function session_start. Such manipulation leads to 
  cookie without 'httponly' flag. The attack may be launched remotely. A high 
  complexity level is associated with this attack. The exploitability is 
  regarded as difficult. The exploit has been disclosed publicly and may be 
  used. This product operates on a rolling release basis, ensuring continuous 
  delivery. Consequently, there are no version details for either affected or 
  updated releases. The project was informed of the problem early through an 
  issue report but has not responded yet.
