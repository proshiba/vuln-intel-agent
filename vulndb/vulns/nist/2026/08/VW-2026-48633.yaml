title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: Fix use-after-free in cifs_try_adding_channels()\n\ncifs_try_adding_channels()
  takes a temporary reference to an interface\nbefore dropping iface_lock. If cifs_ses_add_channel()
  fails, it drops\nthat reference and then increments iface->weight_fulfilled.\n\n\
  A concurrent interface list refresh can remove the list reference while\nchannel
  creation is in progress. In that case, the failure-path\nkref_put() releases the
  last reference and frees iface. Updating\nweight_fulfilled afterward then accesses
  freed memory.\n\nIncrement weight_fulfilled before dropping the temporary reference,\n\
  keeping iface alive for the final access."
