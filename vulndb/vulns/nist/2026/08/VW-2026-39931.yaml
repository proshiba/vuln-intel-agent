title: "Not Failing Securely ('Failing Open') vulnerability in livebook-dev livebook
  allows an unauthenticated network client to obtain full access to a Livebook server
  that enforces identity through Livebook Teams.\n\nA Livebook Agent or App Server
  connected to Livebook Teams caches the identifier of the deployment group it belongs
  to, and resolves that identifier against a locally cached list of deployment groups
  on every request in order to decide whether Teams identity enforcement is active.
  Livebook.Hubs.TeamClient.handle_call/3 in lib/livebook/hubs/team_client.ex does
  not distinguish a deployment group that could not be resolved from one that was
  resolved with identity enforcement switched off: the clause matches only the case
  where a group was found with enforcement enabled, and falls through to a catch-all
