title: "The fix released in jackson-core 2.18.6 and 2.21.1 for CVE-2026-18401 (GHSA-72hv-8253-57qq,
  number length constraint bypass in the non-blocking parser) is incomplete. This
  record covers the remaining bypass.\n\nThe earlier fix wired validateIntegerLength()
  into a new _setIntLength() helper and invoked it wherever the integer portion of
  a number is decided: a terminator byte arrives, a '.' or 'e'/'E' is seen, or input
  ends inside a fully buffered value. It was not invoked on the attacker-relevant
  path where the parser runs out of input while still inside the MINOR_NUMBER_INTEGER_DIGITS
  minor state and returns NOT_AVAILABLE to the caller.\n\nAs a result, an attacker
  who streams JSON to a non-blocking parser in many small chunks, without ever sending
  a terminator byte, keeps the parser inside MINOR_NUMBER_INTEGER_DIGITS indefinitely.
  _textBuffer.expandCurrentSegment() grows the accumulator on every chunk while validateIntegerLength()
  is never called. The accumulator is bounded only by maxStri"
