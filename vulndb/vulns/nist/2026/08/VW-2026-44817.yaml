title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  fix crash in bpf_[set|remove]_dentry_xattr for negative dentries\n\nbpf_set_dentry_xattr
  and bpf_remove_dentry_xattr BPF kfuncs attempt to\nlock the inode of the supplied
  dentry without checking if it is\nNULL. If a negative dentry is passed (e.g. from\n\
  security_inode_create), d_inode(dentry) returns NULL, and\ninode_lock(inode) will
  cause a NULL pointer dereference.\n\nTrivially fix this by adding a NULL check for
  inode before attempting\nto lock it, returning -EINVAL if it is NULL.\n\nAdditionally,
  drop WARN_ON(!inode) in bpf_xattr_read_permission() and\nbpf_xattr_write_permission().
  These warnings could be triggered by\npassing a negative dentry to bpf_get_dentry_xattr()
  or the _locked\nvariants of the xattr kfuncs, potentially causing a Denial of Service\n\
  on systems with panic_on_warn enabled. Instead, simply return -EINVAL."
