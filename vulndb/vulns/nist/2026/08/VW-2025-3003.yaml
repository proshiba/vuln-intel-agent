title: "In the Linux kernel, the following vulnerability has been resolved:\n\nubi:
  ubi_wl_put_peb: Fix infinite loop when wear-leveling work failed\n\nFollowing process
  will trigger an infinite loop in ubi_wl_put_peb():\n\n\tubifs_bgt\t\tubi_bgt\nubifs_leb_unmap\n\
  \  ubi_leb_unmap\n    ubi_eba_unmap_leb\n      ubi_wl_put_peb\twear_leveling_worker\n\
  \                          e1 = rb_entry(rb_first(&ubi->used)\n\t\t\t  e2 = get_peb_for_wl(ubi)\n\
  \t\t\t  ubi_io_read_vid_hdr  // return err (flash fault)\n\t\t\t  out_error:\n\t\
  \t\t    ubi->move_from = ubi->move_to = NULL\n\t\t\t    wl_entry_destroy(ubi, e1)\n\
  \t\t\t      ubi->lookuptbl[e->pnum] = NULL\n      retry:\n        e = ubi->lookuptbl[pnum];\t
  // return NULL\n\tif (e == ubi->move_from) {\t// NULL == NULL gets true\n\t  goto
  retry;\t\t\t// infinite loop !!!\n\n$ top\n  PID USER      PR  NI    VIRT    RES\
  \    SHR S  %CPU %MEM     COMMAND\n  7676 root     20   0       0      0      0
  R 100.0  0.0  ubifs_bgt0_0\n\nFix it by:\n 1) Letting ubi_wl_put_peb() returns directly
  if wearl leveling entry has\n    bee"
