title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  fix io_thread race in rxrpc_wake_up_io_thread()\n\nrxrpc_wake_up_io_thread() checks
  local->io_thread before waking it, but\nthen reloads the pointer for wake_up_process().\n\
  \nlocal->io_thread is cleared with WRITE_ONCE() when the I/O thread exits, so\n\
  the second load can see NULL even if the first load did not.\n\nTake a READ_ONCE()
  snapshot and use it for both the NULL check and the\nwake_up_process() call, as
  rxrpc_encap_rcv() already does."
