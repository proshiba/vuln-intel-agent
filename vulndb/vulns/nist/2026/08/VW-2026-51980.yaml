title: "Deserialization of Untrusted Data vulnerability in ash-project ash_cloak allows
  an attacker who can influence the bytes of an encrypted column to crash the BEAM
  node, by triggering unbounded atom creation or a decompression bomb during decryption.\n\
  \nAshCloak.Calculations.Decrypt decodes the decrypted binary with Ash.Helpers.non_executable_binary_to_term/1
  without the :safe option, so atoms in the payload are interned during the decode
  and never garbage collected, and the term format's compressed form is inflated transparently.
  vault.decrypt!() is the only barrier and stops tampering only for an authenticated
  cipher. Cloak also ships the unauthenticated AES.CTR, whose ciphertext an attacker
  who knows their own plaintext can XOR into any same-length payload without the key,
  so an ordinary read of the forged column reaches the decoder. A few hundred kilobytes
  of distinct atoms exhausts the atom table, or a small compressed payload inflates
  to gigabytes.\n\nThis issue affects ash_cloak: from "
