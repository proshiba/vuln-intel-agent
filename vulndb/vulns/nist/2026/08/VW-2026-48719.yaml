title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/ncsi:
  fix heap OOB read in NCSI_CMD_SEND_CMD payload length\n\nncsi_send_cmd_nl() takes
  the number of bytes to copy from the\nattacker-controlled ncsi_pkt_hdr.length field
  of the in-band packet\nheader, while the source buffer is the NCSI_ATTR_DATA netlink\n\
  attribute whose readable size is nla_len() - sizeof(ncsi_pkt_hdr).\nThe two length
  sources are never cross-checked: only\nnla_len() >= sizeof(struct ncsi_pkt_hdr)
  is enforced.\n\nWith hdr->length set larger than the attribute payload (up to 65535\n\
  against at most 2032 readable bytes), ncsi_cmd_handler_oem() copies\npast the end
  of the netlink attribute buffer with unsafe_memcpy(),\nleaking up to ~64KB of kernel
  heap memory into the transmitted NCSI\ncommand packet. The destination skb is sized
  by the declared payload,\nso the write side does not overflow - this is a pure OOB
  read /\ninformation leak, reachable with CAP_NET_ADMIN on systems with a\nregistered
