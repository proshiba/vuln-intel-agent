title: Dolibarr 21.0.0 before 24.0.0 contains an authorization bypass 
  vulnerability caused by an inverted boolean condition in the private-project 
  membership check within the clonetasks mass action handler in 
  htdocs/core/actions_massactions.inc.php. Authenticated users with project 
  creation permission but without access to a target private project can exploit
  the flawed !in_array() check to clone tasks into unauthorized private 
  projects.
