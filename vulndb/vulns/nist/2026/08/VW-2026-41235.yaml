title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/core:
  disallow overlapping input ranges for damon_set_regions()\n\ndamon_set_regions()
  assumes the input ranges are sorted by the address and\ndon't overlap each other.\
  \  Hence the assumption was initially to be\nexplicitly validated.  But commit 97d482f4592f
  (\"mm/damon/sysfs: reuse\ndamon_set_regions() for regions setting\") has mistakenly
  removed the\nvalidation.\n\nThis can make DAMON behave in unexpected ways.  At the
  best, the\nmonitoring results snapshot will just look weird since there will be\n\
  overlapping regions.  DAMOS will also work weirdly, applying the same\naction multiple
  times for overlapping regions, and make DAMOS quota weird.\nMore seriously, depending
  on the setup and regions updates sequence,\nnegative size regions can be made. \
  \ It will trigger WARN_ONCE() if the\nkernel is built with CONFIG_DAMON_DEBUG_SANITY=y.\
  \  Depending on the\nmonitoring results, the negative size region can further trigger
  division\n"
