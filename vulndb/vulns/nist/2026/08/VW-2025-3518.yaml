title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  compat: Do not treat syscall number as ESR_ELx for a bad syscall\n\nIf a compat
  process tries to execute an unknown system call above the\n__ARM_NR_COMPAT_END number,
  the kernel sends a SIGILL signal to the\noffending process. Information about the
  error is printed to dmesg in\ncompat_arm_syscall() -> arm64_notify_die() -> arm64_force_sig_fault()
  ->\narm64_show_signal().\n\narm64_show_signal() interprets a non-zero value for\n\
  current->thread.fault_code as an exception syndrome and displays the\nmessage associated
  with the ESR_ELx.EC field (bits 31:26).\ncurrent->thread.fault_code is set in compat_arm_syscall()
  ->\narm64_notify_die() with the bad syscall number instead of a valid ESR_ELx\n\
  value. This means that the ESR_ELx.EC field has the value that the user set\nfor
  the syscall number and the kernel can end up printing bogus exception\nmessages*.
  For example, for the syscall number 0x68000000, which evaluates\nto ESR_ELx.EC v"
