title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfscrypt:
  stop using keyrings subsystem for fscrypt_master_key\n\nThe approach of fs/crypto/
  internally managing the fscrypt_master_key\nstructs as the payloads of \"struct
  key\" objects contained in a\n\"struct key\" keyring has outlived its usefulness.\
  \  The original idea was\nto simplify the code by reusing code from the keyrings
  subsystem.\nHowever, several issues have arisen that can't easily be resolved:\n\
  \n- When a master key struct is destroyed, blk_crypto_evict_key() must be\n  called
  on any per-mode keys embedded in it.  (This started being the\n  case when inline
  encryption support was added.)  Yet, the keyrings\n  subsystem can arbitrarily delay
  the destruction of keys, even past the\n  time the filesystem was unmounted.  Therefore,
  currently there is no\n  easy way to call blk_crypto_evict_key() when a master key
  is\n  destroyed.  Currently, this is worked around by holding an extra\n  reference
