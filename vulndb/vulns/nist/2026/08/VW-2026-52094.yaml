title: A security vulnerability has been detected in klaussilveira GitList 
  2.0.0. Affected by this vulnerability is the function getDefaultBranch of the 
  file src/SCM/System/Git/CommandLine.php of the component Git Command Line. 
  Such manipulation leads to os command injection. The attack can be executed 
  remotely. The exploit has been disclosed publicly and may be used. Upgrading 
  to version 3.0.0-beta addresses this issue. The name of the patch is 
  88cf2866083d5f7c20d9d565c45f828a7ad1516b. Upgrading the affected component is 
  advised.
