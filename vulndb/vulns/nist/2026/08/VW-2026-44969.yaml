title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: fix leaking sk after socket release\n\niso_sock_kill() tests !sock_flag(sk,
  SOCK_ZAPPED) || sk->sk_socket ||\nsock_flag(sk, SOCK_DEAD) for early return, but
  this is always true since\nsock_orphan(sk) sets SOCK_DEAD, so the sk reference released
  by socket\nalways leaks, iso_sock_destruct is never called.\n\nThe socket reference
  also leaks when __iso_sock_close() does not set\nSOCK_ZAPPED, since iso_conn_del()
  does not call iso_sock_kill() after\nzapping.\n\nFix by replacing SOCK_DEAD by BT_SK_KILLED
  flag that is not used for\nsomething else, and lock_sock to ensure iso_sock_kill()
  puts sk only\nafter socket release only once. Release and iso_conn_del may run\n\
  concurrently. Call iso_sock_kill() from iso_conn_del() to clean sk up\nafter zapping.\n\
  \nRemove call to iso_sock_kill() from iso_sock_close(), as it's generally\nno-op
  there."
