title: justhtml versions before 1.13.0 contain a cross-site scripting 
  vulnerability in the to_markdown() function when serializing 
  attacker-controlled pre content. Attackers can place backticks inside 
  sanitized pre elements to break out of fixed-length code fences, allowing raw 
  HTML to execute when the generated Markdown is rendered by CommonMark or 
  GFM-style renderers.
