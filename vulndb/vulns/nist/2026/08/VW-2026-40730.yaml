title: TestLink 1.9.20 and prior contains an insecure direct object reference 
  vulnerability that allows any authenticated user, including low-privilege 
  guest accounts, to read arbitrary attachments by supplying an integer 
  attachment ID to the attachmentdownload.php handler without any project or 
  role authorization check. Attackers can enumerate sequential integer IDs 
  through the attachment download endpoint to retrieve file contents from 
  private projects they have no membership in, bypassing the per-project access 
  control model and exposing test specifications, requirements documents, 
  execution evidence, and other sensitive uploaded files across the entire 
  installation.
