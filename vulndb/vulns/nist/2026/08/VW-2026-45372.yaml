title: Stirling-PDF is a locally hosted web application that facilitates various
  operations on PDF files. Prior to 2.0.0, the Get Info workflow in 
  app/core/src/main/resources/templates/security/get-info-on-pdf.html inserts 
  untrusted PDF Title and Author metadata into the summary-text element with 
  innerHTML, allowing a malicious PDF to execute stored cross-site scripting 
  when a user clicks Get Info and to access browser-session data or modify page 
  content. This issue is fixed in version 2.0.0.
