title: Jenkins FilePath.untarFrom() in all versions, including those with the 
  CVE-2026-33001 patch applied, validates symlink destinations but not targets. 
  The CVE-2026-33001 fix enforces that the symlink file is created within the 
  workspace boundary, but the symlink target — the path returned by 
  te.getLinkName() and passed directly to symlinkTo() — is never validated and 
  may point to any path on the controller filesystem. An attacker with 
  Item/Configure permission can configure a job to extract a malicious .tar or 
  .tar.gz archive via a tool installer or custom build step. When 
  FilePath.untarFrom() processes the archive, it creates symlinks inside the 
  workspace that resolve to arbitrary controller paths. By targeting the entire 
  $JENKINS_HOME/secrets/ directory — including master.key, hudson.util.Secret, 
  hudson.model.Secrets.xml, and any other files present — an attacker can 
  exfiltrate all Jenkins cryptographic material through the workspace viewer 
  (GET /job/{name}/ws/) or build artifacts. Com
