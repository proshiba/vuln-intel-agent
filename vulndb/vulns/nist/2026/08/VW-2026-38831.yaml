title: Better Auth relies on better-call, which uses the rou3 router library. In
  affected versions of rou3, paths are normalized by removing empty segments, so
  /path, //path, and ///path resolve to the same route. In Better Auth versions 
  prior to 1.4.5 (which bundles the fixed rou3), this can allow attackers to 
  bypass disabledPaths configuration and path-based rate limits by submitting 
  requests with extra slashes in the URL path. The issue does not apply in 
  deployments where the proxy or platform normalizes URLs by collapsing multiple
  slashes.
