title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  cs40l50-vibra - validate custom data from user space\n\ncs40l50_add() copies the
  custom data of an FF_PERIODIC/FF_CUSTOM effect\nstraight from the ff_effect the
  user passed to EVIOCSFF, without\nrequiring it to hold anything:\n\n    work_data.custom_data
  = memdup_array_user(periodic->custom_data,\n                                   \
  \           periodic->custom_len,\n                                            \
  \  sizeof(s16));\n    work_data.custom_len = periodic->custom_len;\n\nThe driver
  then reads two words out of that buffer: custom_data[0] as the\nwaveform bank in
  cs40l50_effect_bank_set(), and custom_data[1] as the\nindex within the bank in cs40l50_effect_index_set().\
  \  Neither read is\ncovered by a length check, and custom_len is fully user controlled:\n\
  \n  - custom_len == 0 makes memdup_array_user() call memdup_user() with a\n    length
  of zero, which returns ZERO_SIZE_PTR rather than an error, so\n    custom_data[0]
  derefer"
