title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_nat: avoid invalid nat_net pointer use on failed nf_nat_init()\n\nWe ran into
  below KASAN splat, which is mostly uninteresting, beside\nfor having nf_nat_register_fn()
  in the call chain as a cause for the\noffending access:\n\n==================================================================\n\
  BUG: KASAN: slab-out-of-bounds in nf_nat_register_fn+0x5f9/0x640\nRead of size 8
  at addr ffff890031e54c20 by task iptables/9510\n\nCPU: 0 UID: 0 PID: 9510 Comm:
  iptables Not tainted 6.18.18-grsec-full-20260320181326 #1 PREEMPT(voluntary)\nHardware
  name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.16.3-debian-1.16.3-2 04/01/2014\n\
  Call Trace:\n <TASK>\n […] dump_stack_lvl+0xee/0x160 ffff88004117eeb8\n […] print_report+0x6e/0x640
  ffff88004117eee0\n […] ? __phys_addr+0x8e/0x140 ffff88004117eef0\n […] ? kasan_addr_to_slab+0x51/0xe0
  ffff88004117ef08\n […] ? complete_report_info+0xec/0x1c0 ffff88004117ef20\n […]
  ? nf_nat_register_fn+0x5f"
