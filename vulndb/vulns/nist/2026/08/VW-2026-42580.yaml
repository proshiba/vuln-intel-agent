title: Weaver (Fanwei) E-cology 8.0 contains a SQL injection vulnerability in 
  the SignatureDownLoad servlet that allows unauthenticated remote attackers to 
  read arbitrary files by injecting a UNION SELECT payload into the markId GET 
  parameter, which is concatenated unsanitized into a SQL query. Attackers can 
  control the markPath value returned by the query to supply an 
  attacker-controlled filesystem path, causing the servlet to read and stream 
  back arbitrary files accessible to the application server process, including 
  sensitive configuration files containing database credentials. Disclosure 
  materials indicate that this vulnerability has been remediated, but it's 
  unclear which version resolved the issue. Exploitation evidence was first 
  observed by the Shadowserver Foundation on 2023-10-18 (UTC).
