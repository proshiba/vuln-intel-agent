title: baserCMS before 5.3.0 contains a SQL injection vulnerability in 
  BcDatabaseService.php that allows authenticated administrators to inject 
  attacker-controlled table names and configuration values directly into SQL 
  statements across sequence update, CSV export, and table management 
  operations. Attackers can chain a backup restore code injection flaw, where 
  PHP code outside class definitions in schema files executes unconditionally 
  upon loading, to plant malicious table names and trigger error-based SQL 
  injection that retrieves database version, schema contents, and arbitrary data
  from the PostgreSQL backend.
