title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  move bc link creation back to tipc_node_create\n\nShuang Li reported a NULL pointer
  dereference crash:\n\n  [] BUG: kernel NULL pointer dereference, address: 0000000000000068\n\
  \  [] RIP: 0010:tipc_link_is_up+0x5/0x10 [tipc]\n  [] Call Trace:\n  []  <IRQ>\n\
  \  []  tipc_bcast_rcv+0xa2/0x190 [tipc]\n  []  tipc_node_bc_rcv+0x8b/0x200 [tipc]\n\
  \  []  tipc_rcv+0x3af/0x5b0 [tipc]\n  []  tipc_udp_recv+0xc7/0x1e0 [tipc]\n\nIt
  was caused by the 'l' passed into tipc_bcast_rcv() is NULL. When it\ncreates a node
  in tipc_node_check_dest(), after inserting the new node\ninto hashtable in tipc_node_create(),
  it creates the bc link. However,\nthere is a gap between this insert and bc link
  creation, a bc packet\nmay come in and get the node from the hashtable then try
  to dereference\nits bc link, which is NULL.\n\nThis patch is to fix it by moving
  the bc link creation before inserting\ninto the hashtable.\n\nNote that for a preliminary
  node becoming \"real\","
