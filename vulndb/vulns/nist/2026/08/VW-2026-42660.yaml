title: electerm is an open-sourced 
  terminal/ssh/sftp/telnet/serialport/RDP/VNC/Spice/ftp client. Prior to 
  3.15.120, electerm allows a malicious FTP or SFTP server to execute arbitrary 
  commands when a user downloads a crafted folder and invokes Properties and 
  Calculate Size because calcLocal in 
  src/client/components/sftp/file-info-modal.jsx inserts the server-controlled 
  folder name into a du -sh shell command without safely escaping single quotes.
  This issue is fixed in version 3.15.120.
