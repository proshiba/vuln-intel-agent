title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipmi:
  Fix user refcount underflow in event delivery\n\nipmi_alloc_recv_msg(user) takes
  the temporary user reference owned by the\nreceive message, and ipmi_free_recv_msg()
  drops it again. If event delivery\nfails after allocating receive messages for earlier
  users,\nhandle_read_event_rsp() rolls those messages back with\nipmi_free_recv_msg().\n\
  \nThat rollback path still drops user->refcount explicitly after freeing each\n\
  message. The extra put can free a user that remains linked on intf->users,\nso later
  event delivery may dereference a freed user or trip refcount_t's\naddition-on-zero
  warning when ipmi_alloc_recv_msg() tries to acquire\nanother reference.\n\nRemove
  the stale explicit put and the now-dead user assignment. Keep the\nlist_del() and
  ipmi_free_recv_msg() calls; they are the required rollback\noperations."
