title: A vulnerability was determined in DataGear up to 5.0.0. The impacted 
  element is the function HtmlTplDashboardWidgetHtmlRenderer of the file 
  HtmlTplDashboardWidgetHtmlRenderer.java of the component Chart Name Handler. 
  This manipulation of the argument Title causes cross site scripting. It is 
  possible to initiate the attack remotely. The exploit has been publicly 
  disclosed and may be utilized. The vendor was contacted early about this 
  disclosure but did not respond in any way.
