title: "Zephyr's WireGuard VPN data-plane receive handler wg_process_data_message()
  in subsys/net/lib/wireguard/wg_crypto.c validated the anti-replay counter too late.
  After AEAD decryption of a MESSAGE_TRANSPORT_DATA packet succeeded, the code committed
  several peer-state changes — update_peer_addr() (endpoint roaming update), the keypair->last_rx/peer->last_rx
  liveness timers, and keypair_update() (promote next→current and destroy the previous
  keypair) — and only afterward called wg_check_replay(). On a replayed packet the
  replay check returned -EINVAL, but none of the preceding mutations were rolled back.\n\
  \nThe AEAD tag authenticates content but not freshness, so a replayed-but-authentic
  transport packet decrypts correctly. An attacker who captures one valid ciphertext
  off the wire (an on-path or shared-medium observer) can re-inject it from an arbitrary
  spoofed source address. Reaching the handler requires no credentials: it is driven
