title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  slub: fix flush_cpu_slab()/__free_slab() invocations in task context.\n\nCommit
  5a836bf6b09f (\"mm: slub: move flush_cpu_slab() invocations\n__free_slab() invocations
  out of IRQ context\") moved all flush_cpu_slab()\ninvocations to the global workqueue
  to avoid a problem related\nwith deactivate_slab()/__free_slab() being called from
  an IRQ context\non PREEMPT_RT kernels.\n\nWhen the flush_all_cpu_locked() function
  is called from a task context\nit may happen that a workqueue with WQ_MEM_RECLAIM
  bit set ends up\nflushing the global workqueue, this will cause a dependency issue.\n\
  \n workqueue: WQ_MEM_RECLAIM nvme-delete-wq:nvme_delete_ctrl_work [nvme_core]\n\
  \   is flushing !WQ_MEM_RECLAIM events:flush_cpu_slab\n WARNING: CPU: 37 PID: 410
  at kernel/workqueue.c:2637\n   check_flush_dependency+0x10a/0x120\n Workqueue: nvme-delete-wq
  nvme_delete_ctrl_work [nvme_core]\n RIP: 0010:check_flush_dependency+0x10a/0x120[\
  \  453.262125] Call Trace:"
