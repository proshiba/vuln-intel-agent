title: "A vulnerability in the processing of SSH connections of Cisco Firepower Management
  Center (FMC) and Cisco Firepower Threat Defense (FTD) Software could allow an unauthenticated,
  remote attacker to cause a denial of service (DoS) condition on an affected device.\r\
  \n\r This vulnerability is due to improper error handling when an SSH session fails
  to be established. An attacker could exploit this vulnerability by sending a high
  rate of crafted SSH connections to the instance. A successful exploit could allow
  the attacker to cause resource exhaustion, resulting in a reboot on the affected
  device."
