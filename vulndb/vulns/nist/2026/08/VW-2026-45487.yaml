title: Notepad++ is a free and open-source source code editor. Prior to 8.9.7, 
  Notepad++ validates the backupFilePath attribute from session.xml with 
  std::wstring::starts_with against the expected backup directory without path 
  normalization, allowing parent-directory sequences during snapshot-mode 
  restoration to read an arbitrary user-readable file outside the backup 
  directory into an editor tab. This issue is fixed in version 8.9.7.
