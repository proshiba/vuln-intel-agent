title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_taprio: properly cancel timer from taprio_destroy()\n\nThere is a comment in
  qdisc_create() about us not calling ops->reset()\nin some cases.\n\nerr_out4:\n\t\
  /*\n\t * Any broken qdiscs that would require a ops->reset() here?\n\t * The qdisc
  was never in action so it shouldn't be necessary.\n\t */\n\nAs taprio sets a timer
  before actually receiving a packet, we need\nto cancel it from ops->destroy, just
  in case ops->reset has not\nbeen called.\n\nsyzbot reported:\n\nODEBUG: free active
