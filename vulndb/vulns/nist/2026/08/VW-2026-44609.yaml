title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1:
  fix writes_pending and barrier reference leaks on write failures\n\nraid1_make_request()
  acquires a writes_pending reference with\nmd_write_start() before calling raid1_write_request().
  Several failure\npaths in raid1_write_request() complete the bio and return without\n\
  reaching the normal write completion path, causing the corresponding\nmd_write_end()
  to be skipped.\n\nMake raid1_write_request() return a status indicating whether
  the write\nrequest was successfully queued. This allows raid1_make_request() to\n\
  call md_write_end() when raid1_write_request() fails.\n\nAdditionally, if wait_blocked_rdev()
  fails after wait_barrier()\nsucceeds, the associated barrier reference is not released.\n\
  \nCall allow_barrier() before returning from that path to keep the barrier\naccounting
  balanced."
