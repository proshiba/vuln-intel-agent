title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  mediatek: vcodec: Fix potential array out-of-bounds in decoder queue_setup\n\nvariable
  *nplanes is provided by user via system call argument. The\npossible value of q_data->fmt->num_planes
  is 1-3, while the value\nof *nplanes can be 1-8. The array access by index i can
  cause array\nout-of-bounds.\n\nFix this bug by checking *nplanes against the array
  size."
