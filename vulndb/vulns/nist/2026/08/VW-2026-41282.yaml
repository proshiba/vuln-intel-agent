title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  stm32-dcmipp: Return queued buffers on start_streaming() failure\n\nThe vb2 framework
  hands buffers to the driver via buf_queue() before\ncalling start_streaming(). \
  \ If start_streaming() returns an error\nwithout first returning those buffers via
  vb2_buffer_done(),\nvb2_start_streaming() fires WARN_ON(owned_by_drv_count) and
  the queued\nbuffers leak.\n\ndcmipp_bytecap_start_streaming() returned -EINVAL when
  the source\nsubdevice could not be resolved from the media graph, before\npm_runtime_resume_and_get()
  and media_pipeline_start() had been called.\nThe remaining error paths already converge
  on the err_buffer_done\nlabel, which calls dcmipp_bytecap_all_buffers_done(...,\n\
  VB2_BUF_STATE_QUEUED).  Jump to that label directly: the intermediate\nerr_pm_put
  / err_media_pipeline_stop labels are skipped, which is\ncorrect because nothing
  they would undo has happened yet.\n\nThis mirrors the uvcvideo fix in commit 4cf3b6fd54eb
  (\"media"
