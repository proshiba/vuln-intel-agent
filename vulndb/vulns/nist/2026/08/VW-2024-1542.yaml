title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix freeing unallocated p2pmem\n\nIn case p2p device was found but the p2p pool
  is empty, the nvme target\nis still trying to free the sgl from the p2p pool instead
  of the\nregular sgl pool and causing a crash (BUG() is called). Instead, assign\n\
  the p2p_dev for the request only if it was allocated from p2p pool.\n\nThis is the
  crash that was caused:\n\n[Sun May 30 19:13:53 2021] ------------[ cut here ]------------\n\
  [Sun May 30 19:13:53 2021] kernel BUG at lib/genalloc.c:518!\n[Sun May 30 19:13:53
  2021] invalid opcode: 0000 [#1] SMP PTI\n...\n[Sun May 30 19:13:53 2021] kernel
  BUG at lib/genalloc.c:518!\n...\n[Sun May 30 19:13:53 2021] RIP: 0010:gen_pool_free_owner+0xa8/0xb0\n\
  ...\n[Sun May 30 19:13:53 2021] Call Trace:\n[Sun May 30 19:13:53 2021] ------------[
  cut here ]------------\n[Sun May 30 19:13:53 2021]  pci_free_p2pmem+0x2b/0x70\n\
  [Sun May 30 19:13:53 2021]  pci_p2pmem_free_sgl+0x4f/0x80\n[Sun May 30 19:13:53
  2021]  nvmet_req"
