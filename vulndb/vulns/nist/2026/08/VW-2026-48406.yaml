title: Infracost provides cloud cost intelligence for engineers, AI coding 
  agents, and CI/CD. Prior to 0.10.45, the readFile, pathExists, isDir, and 
  matchPaths template functions in internal/config/template/parser.go use a 
  lexical filepath.Rel check and a leaf-only os.Lstat check that do not resolve 
  an intermediate directory symlink. A repository can contain a path such as 
  evil/file where evil points outside the checkout, causing os.ReadFile and 
  related operations to follow the symlink and read runner-accessible files. The
  resulting content is rendered into generated configuration and can be surfaced
  through the Infracost dashboard or pull request comment, with greater impact 
  in workflows that provide repository secrets. This issue is fixed in version 
  0.10.45.
