title: The Events Made Easy plugin for WordPress is vulnerable to Local File 
  Inclusion in all versions up to, and including, 3.2.5 via the 
  eme_single_event_page_template function. This makes it possible for 
  authenticated attackers, with contributor-level access and above, to include 
  and execute arbitrary .php files on the server, allowing the execution of any 
  PHP code in those files. This can be used to bypass access controls, obtain 
  sensitive data, or achieve code execution in cases where .php file types can 
  be uploaded and included. The stored traversal payload is triggered passively 
  when any visitor loads the affected single-event page, meaning post-submission
  execution does not require additional attacker interaction.
