title: Nmap versions up to and including 7.99 contains a denial of service 
  vulnerability that allows remote attackers to crash the application by sending
  a crafted packet containing a zero-length TCP option. The malformed packet 
  forces the Packet:parse_options() function in nselib/packet.lua to allocate 
  objects in an infinite loop, causing an out-of-memory condition that results 
  in application crash.
