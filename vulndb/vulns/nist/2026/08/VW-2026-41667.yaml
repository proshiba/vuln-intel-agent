title: CyberPanel 2.4.3, fixed in commit eca0c3c, contains an authenticated 
  remote code execution vulnerability in the remote backup feature that allows 
  authenticated attackers to gain root-level SSH access by supplying a malicious
  remote server address. Attackers can exploit the unverified SSH public key 
  retrieval process to write an attacker-controlled public key directly to 
  /root/.ssh/authorized_keys, granting persistent root access to the host 
  system.
