title: The PixelYourSite – Your smart PIXEL (TAG) & API Manager plugin for 
  WordPress is vulnerable to Sensitive Information Exposure in all versions up 
  to, and including, 11.2.1 via the getWooPurchaseEventParams. This makes it 
  possible for unauthenticated attackers to extract WooCommerce purchase 
  metadata — including product names, product IDs, quantities, per-item prices, 
  order totals, currency, and order/transaction IDs — for any existing order by 
  supplying an invalid or arbitrary order key. This is exploitable against any 
  known or enumerated order ID, as the plugin resolves the order from the URL 
  path variable alone and emits the full woo_purchase tracking payload into the 
  page HTML via the pysOptions JavaScript object across its Facebook, Google 
  Analytics, and Google Tag Manager integrations regardless of key validity.
