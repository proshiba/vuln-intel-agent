title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix out-of-bounds clear_bit in ath12k_mac_dp_peer_cleanup()\n\nath12k_mac_dp_peer_cleanup()
  clears the ML peer ID slot on the\nfree_ml_peer_id_map bitmap by indexing it with
  dp_peer->peer_id. That is\nwrong: dp_peer->peer_id for an MLO peer always carries
  the\nATH12K_PEER_ML_ID_VALID bit (BIT(13)), so clear_bit() is invoked with\nindex
  >= 0x2000, which is far outside the bitmap of ATH12K_MAX_MLO_PEERS\n(256) bits and
  corrupts memory adjacent to ah->free_ml_peer_id_map. The\nintended bitmap entry
  also never gets cleared, so subsequent\nath12k_peer_ml_alloc() calls eventually
  run out of IDs.\n\nThe ID without the VALID bit is what ath12k_peer_ml_alloc() returned
  and\nis stored in ahsta->ml_peer_id. Use that instead.\n\nWhile there, also reset
  ahsta->ml_peer_id to ATH12K_MLO_PEER_ID_INVALID so\nthe bitmap and ahsta->ml_peer_id
  stay in sync.\n\nTested-on: WCN7850 hw2.0 PCI WLAN.HMT.1.1.c5-00302-QCAHMTSWPL_V1.0_V2.0_SILICONZ-"
