title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/fprobe:
  Fix NULL pointer dereference in fprobe_fgraph_entry()\n\nfprobe_fgraph_entry() sizes
  a shadow-stack reservation in one walk of\nthe per-ip fprobe list and fills it in
  a second walk, both under\nrcu_read_lock() only. A fprobe registered on an already-live
  ip can\nbecome visible between the two walks, so the fill walk processes an\nexit_handler
  the sizing walk did not count and used runs past\nreserved_words. If the sizing
  walk counted nothing, fgraph_data is NULL\nand the first write_fprobe_header() faults:\n\
  \n  Oops: general protection fault, probably for non-canonical address ...\n  KASAN:
  null-ptr-deref in range [0x0000000000000000-0x0000000000000007]\n  RIP: 0010:fprobe_fgraph_entry+0xa38/0xf10
  kernel/trace/fprobe.c:167\n  Call Trace:\n   <TASK>\n   function_graph_enter_regs+0x44c/0xa10
  kernel/trace/fgraph.c:677\n   ftrace_graph_func+0xc5/0x140 arch/x86/kernel/ftrace.c:671\n\
  \   __kernel_text_address+0x9/0x40 kernel/e"
