title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix socket use-after-free during link group termination\n\n__smc_lgr_terminate()
  drops conns_lock after finding a connection in\nlgr->conns_all, but before taking
  a reference on its socket. The connection\nis embedded in the socket, and its registration
  reference protects it only\nwhile the connection remains in the tree.\n\nA concurrent
  close can unregister the connection and drop that reference,\nfreeing the socket
  before the termination worker reaches sock_hold().\n\nThe race is reachable when
  close overlaps link group termination.\nLocal stress testing reproduced the use-after-free
  and KASAN reported:\n\n  BUG: KASAN: slab-use-after-free in __smc_lgr_terminate.part.0
  [smc]\n  Write of size 4 by task kworker/3:3\n  Workqueue: events smc_lgr_terminate_work
  [smc]\n  __smc_lgr_terminate.part.0 [smc]\n\nThe socket was allocated by smc_create(),
  freed through\nslab_free_after_rcu_debug(), and was followed by:\n\n  refcount_t:
  addit"
