title: Improper input validation for some Intel(R) Xeon(R) processors within 
  firmware may allow an escalation of privilege. Startup code and smm adversary 
  with a privileged user combined with a high complexity attack may enable data 
  alteration. This result may potentially occur via local access when attack 
  requirements are present without special internal knowledge and requires no 
  user interaction. The potential vulnerability may impact the confidentiality 
  (none), integrity (none) and availability (none) of the vulnerable system, 
  resulting in subsequent system confidentiality (none), integrity (high) and 
  availability (none) impacts.
