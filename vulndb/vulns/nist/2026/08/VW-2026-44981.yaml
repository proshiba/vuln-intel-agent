title: "In the Linux kernel, the following vulnerability has been resolved:\n\nforcedeth:
  fix UAF of txrx_stats in nv_remove\n\nnv_remove() frees the per-CPU txrx_stats before
  unregister_netdev().\nUntil unregister completes, ndo_get_stats64, the NAPI/xmit
  data path,\nand nv_close()/drain may still access txrx_stats, leading to a\nuse-after-free.\n\
  \nFree the stats only after unregister_netdev()."
