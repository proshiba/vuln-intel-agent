title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  sg: Allow waiting for commands to complete on removed device\n\nWhen a SCSI device
  is removed while in active use, currently sg will\nimmediately return -ENODEV on
  any attempt to wait for active commands that\nwere sent before the removal.  This
  is problematic for commands that use\nSG_FLAG_DIRECT_IO since the data buffer may
  still be in use by the kernel\nwhen userspace frees or reuses it after getting ENODEV,
  leading to\ncorrupted userspace memory (in the case of READ-type commands) or corrupted\n\
  data being sent to the device (in the case of WRITE-type commands).  This\nhas been
  seen in practice when logging out of a iscsi_tcp session, where\nthe iSCSI driver
  may still be processing commands after the device has been\nmarked for removal.\n\
  \nChange the policy to allow userspace to wait for active sg commands even\nwhen
  the device is being removed.  Return -ENODEV only when there are no\nmore responses
  to read."
