title: "In Eclipse SW360 versions 19.0.0, 19.1.0, 19.2.0, 20.0.0, 20.1.0, if the system
  is configured to use file system storage with config key enable.attachment.store.to.file.system,
  the attacker can manipulate the filename upon upload and can essentially cause arbitrary
  file path traversal.\n\n\n\n\nThe immediate workaround is to disable enable.attachment.store.to.file.system
  or update to fixed versions."
