title: Perspective 5.0.0 contains a denial-of-service vulnerability in the 
  VirtualServer protocol dispatcher that allows unauthenticated remote attackers
  to crash the server process by sending malformed or incomplete protobuf 
  messages. Attackers can send well-formed requests such as ViewToArrowReq with 
  no viewport set or MakeTableReq with no data field to trigger unwrap() calls 
  on None values at nine distinct sites, causing the process to abort with 
  SIGABRT.
