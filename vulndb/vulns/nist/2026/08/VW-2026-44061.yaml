title: "PAX Technology Q80 XCB Daemon Missing Authentication Vulnerability. This vulnerability
  allows network-adjacent attackers to disclose sensitive information and modify configuration
  on affected installations of PAX Technology Q80. Authentication is not required
  to exploit this vulnerability.\n\nThe specific flaw exists within the XCB daemon.
  The issue results from the lack of authentication prior to allowing access to functionality.
  An attacker can leverage this in conjunction with other vulnerabilities to execute
  arbitrary code in the context of root. Was ZDI-CAN-30584."
