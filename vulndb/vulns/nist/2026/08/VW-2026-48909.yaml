  incoming connections or request rates. An attacker with access to the drone's internal
  network can exhaust the server's connection pool by repeatedly requesting a stored
  media file, preventing the server from handling legitimate requests and causing
  a denial of service that prevents the DJI Fly application from retrieving photos
  and videos from the aircraft in QuickTransfer mode.\n\nAffected models are DJI Neo
