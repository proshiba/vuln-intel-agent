title: A vulnerability was detected in vastsa FileCodeBox up to 2.3. This 
  vulnerability affects the function update_file_usage of the file 
  apps/base/views.py of the component Pickup Limit Handler. Performing a 
  manipulation results in race condition. It is possible to initiate the attack 
  remotely. The exploit is now public and may be used. Upgrading to version 
  2.5.0 is able to resolve this issue. The patch is named 
  8d7d856c62d73badd0797eb4daec8d2ff10a403a. Upgrading the affected component is 
  recommended.
