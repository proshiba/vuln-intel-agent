title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  assign CURSEG_ALL_DATA_ATGC if blkaddr is valid\n\nmkdir /mnt/test/comp\nf2fs_io
  setflags compression /mnt/test/comp\ndd if=/dev/zero of=/mnt/test/comp/testfile
  bs=16k count=1\ntruncate --size 13 /mnt/test/comp/testfile\n\nIn the above scenario,
  we can get a BUG_ON.\n kernel BUG at fs/f2fs/segment.c:3589!\n Call Trace:\n  do_write_page+0x78/0x390
  [f2fs]\n  f2fs_outplace_write_data+0x62/0xb0 [f2fs]\n  f2fs_do_write_data_page+0x275/0x740
  [f2fs]\n  f2fs_write_single_data_page+0x1dc/0x8f0 [f2fs]\n  f2fs_write_multi_pages+0x1e5/0xae0
  [f2fs]\n  f2fs_write_cache_pages+0xab1/0xc60 [f2fs]\n  f2fs_write_data_pages+0x2d8/0x330
  [f2fs]\n  do_writepages+0xcf/0x270\n  __writeback_single_inode+0x44/0x350\n  writeback_sb_inodes+0x242/0x530\n\
  \  __writeback_inodes_wb+0x54/0xf0\n  wb_writeback+0x192/0x310\n  wb_workfn+0x30d/0x400\n\
  \nThe reason is we gave CURSEG_ALL_DATA_ATGC to COMPR_ADDR where the\npage was set
  the gcing flag by set_cluster_dirty()."
