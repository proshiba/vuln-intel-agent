title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  add check for invalid name in btf_name_valid_section()\n\nIf the length of the name
  string is 1 and the value of name[0] is NULL\nbyte, an OOB vulnerability occurs
  in btf_name_valid_section() and the\nreturn value is true, so the invalid name passes
  the check.\n\nTo solve this, you need to check if the first position is NULL byte
  and\nif the first character is printable."
