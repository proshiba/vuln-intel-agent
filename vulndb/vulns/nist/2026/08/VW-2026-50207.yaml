title: RustDesk versions 1.3.9 through 1.4.9 contain a path traversal 
  vulnerability in the macOS clipboard file-paste code path. The application 
  accepts peer-supplied file descriptor names and joins them to the selected 
  target directory without requiring normalized relative paths. A remote peer in
  an active clipboard file-paste session can use parent-directory components or 
  absolute paths to write files outside the intended target directory at 
  locations writable by the RustDesk process. Commit 6f1eb16 fixes the issue by 
  validating descriptor names and safely joining paths.
