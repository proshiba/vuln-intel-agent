title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/core:
  Fix use-after-free bug in dup_user_cpus_ptr()\n\nSince commit 07ec77a1d4e8 (\"sched:
  Allow task CPU affinity to be\nrestricted on asymmetric systems\"), the setting
  and clearing of\nuser_cpus_ptr are done under pi_lock for arm64 architecture. However,\n\
  dup_user_cpus_ptr() accesses user_cpus_ptr without any lock\nprotection. Since sched_setaffinity()
  can be invoked from another\nprocess, the process being modified may be undergoing
  fork() at\nthe same time.  When racing with the clearing of user_cpus_ptr in\n__set_cpus_allowed_ptr_locked(),
  it can lead to user-after-free and\npossibly double-free in arm64 kernel.\n\nCommit
  8f9ea86fdf99 (\"sched: Always preserve the user requested\ncpumask\") fixes this
  problem as user_cpus_ptr, once set, will never\nbe cleared in a task's lifetime.
  However, this bug was re-introduced\nin commit 851a723e45d1 (\"sched: Always clear
