title: "In the Linux kernel, the following vulnerability has been resolved:\n\nposix-cpu-timers:
  Use u64 multiplication in update_rlimit_cpu()\n\nupdate_rlimit_cpu() converts the
  RLIMIT_CPU value to nanoseconds with\n\n        u64 nsecs = rlim_new * NSEC_PER_SEC;\n\
  \nOn 32-bit kernels both rlim_new (unsigned long) and NSEC_PER_SEC\n(1000000000L)
  are 32-bit, so the multiplication is performed in unsigned\nlong and truncated for
  rlim_new > 4 seconds before being widened to u64.\n\nThe same file already casts
  to u64 for the matching computation in\ncheck_process_timers():\n\n        u64 softns
  = (u64)soft * NSEC_PER_SEC;\n\nAs a result, the truncated value is installed into
  the CPUCLOCK_PROF\nexpiry cache (nextevt), causing the process CPU timer to be programmed\n\
  to fire prematurely for any RLIMIT_CPU soft limit >= 5 seconds. The\nactual SIGXCPU/SIGKILL
  decision in check_process_timers() already casts\nto u64 and is therefore correct,
  so limit enforcement is not broken;\nonly the expiry-cache programming is wrong.
  Appl"
