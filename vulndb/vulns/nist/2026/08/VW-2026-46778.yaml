title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows unauthenticated attacker with network access
  via HTTP to compromise Oracle Hyperion Financial Management.  Successful attacks
  of this vulnerability can result in  unauthorized creation, deletion or modification
  access to critical data or all Oracle Hyperion Financial Management accessible data
  and unauthorized ability to cause a hang or frequently repeatable crash (complete
  DOS) of Oracle Hyperion Financial Management. CVSS 3.1 Base Score 9.1 (Integrity
  and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H).'
