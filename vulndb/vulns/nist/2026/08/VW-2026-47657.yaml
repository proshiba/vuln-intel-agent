title: "An\nunauthenticated denial-of-service vulnerability was identified in TP-Link
  TL-MR100 v3.2, TL-MR150 v3.2, TL-MR6400 v8.0 and Archer MR600 v2, due to improper
  handling of exceptional request conditions\nthat may lead to a NULL pointer dereference. \n\
  A remote attacker on an adjacent network can send a specially crated\nHTTP request
  to trigger a crash of the HTTP service process.\n\n\n\n\n\nSuccessful\nexploitation
  may cause the HTTP service to crash, making the web management\ninterface and HTTP-dependent
  functionality temporarily unavailable."
