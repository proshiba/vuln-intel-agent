title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  validate embedded address parameter length\n\nsctp_verify_asconf() and sctp_verify_param()
  only validate ADD_IP, DEL_IP,\nand SET_PRIMARY parameters against a fixed minimum
  size of sizeof(struct\nsctp_addip_param) + sizeof(struct sctp_paramhdr). This ensures
  the outer\nparameter is large enough to contain an embedded address parameter header,\n\
  but does not verify that the embedded address parameter's declared length\nfits
  within the bounds of the outer parameter.\n\nLater, sctp_process_param() and sctp_process_asconf_param()
  extract the\nembedded address parameter and pass it to af->from_addr_param(), which
  uses\nthe address parameter length to parse the variable-length address payload.\n\
