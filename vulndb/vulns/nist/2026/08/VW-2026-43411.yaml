title: GitPython versions before 3.1.54 contain an arbitrary file overwrite 
  vulnerability in the Diffable.diff method that fails to validate git options 
  passed through kwargs. Attackers can supply the --output argument via the 
  other parameter or output kwarg to write patch content to attacker-chosen file
  paths at process privilege level.
