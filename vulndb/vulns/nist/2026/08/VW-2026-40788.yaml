title: 'A vulnerability has been found in HKUDS nanobot up to 0.2.1. This affects
  the function _download_image_data_url of the file nanobot/providers/image_generation.py
  of the component Provider-returned Image URL Handler. The manipulation leads to
  server-side request forgery. It is possible to initiate the attack remotely. The
  exploit has been disclosed to the public and may be used. The identifier of the
  patch is 5095. It is recommended to apply a patch to fix this issue. The vendor
  explains: "We confirm that provider-returned image URLs required the same SSRF protections
  applied to other network retrieval paths. (...) The patch is currently available
  on main and is planned for the next patch release, v0.3.1."'
