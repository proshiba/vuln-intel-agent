title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. Prior to version 1.0.2, the `GET /api/tenants/{id}`
  endpoint returns the full tenant record to any authenticated `TENANT_ADMIN` of that
  tenant, including the `databaseUrl` field. This field contains the live PostgreSQL
  connection string the application uses to connect to that tenant's database. In
  the tested official `docker-compose.prod.yml` deployment, the connection string
  contained the user `postgres` with `rolsuper=true` and the plaintext password from
  `secrets/postgres_password.txt`. Operators who configure a non-superuser PostgreSQL
  user via `secrets/postgres_user.txt` would expose a less privileged credential,
  but the disclosure of the connection string itself is independent of that choice.
  The same credential applies to every database managed by that PostgreSQL instance:
  the central `appointment_booking` database, every per-tenant database (one per tenant),
  and the postg"
