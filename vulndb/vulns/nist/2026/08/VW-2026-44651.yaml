title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpib:
  fix double decrement of descriptor_busy in command_ioctl()\n\ncommit d1857f8296dc
  (\"gpib: fix use-after-free in IO ioctl handlers\")\nintroduced a descriptor_busy
  reference counter to pin struct\ngpib_descriptor across IO ioctl operations.  In
  command_ioctl(), the\nerror path inside the loop decrements descriptor_busy and
  breaks, but\nexecution then falls through to the unconditional decrement after the\n\
  loop, underflowing the counter to -1.\n\nThis re-enables the use-after-free that
  the original fix was meant to\nprevent: a concurrent close_dev_ioctl() sees descriptor_busy
  == 0 on\nan actively-used descriptor and frees it.\n\nRemove the early decrement
  from the error path.  The post-loop\ndecrement already handles all exit paths, matching
  the correct pattern\nused in read_ioctl() and write_ioctl()."
