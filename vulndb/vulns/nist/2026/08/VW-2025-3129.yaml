title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  populate subvp cmd info only for the top pipe\n\n[Why]\nSystem restart observed
  while changing the display resolution\nto 8k with extended mode. Sytem restart was
  caused by a page fault.\n\n[How]\nWhen the driver populates subvp info it did it
  for both the pipes using\nvblank which caused an outof bounds array access causing
  the page fault.\nadded checks to allow the top pipe only to fix this issue."
