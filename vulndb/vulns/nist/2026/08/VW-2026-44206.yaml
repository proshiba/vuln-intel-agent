title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  lan743x: Initialize eth_syslock spinlock before use\n\nlan743x_hardware_init() calls
  pci11x1x_strap_get_status() during the\nPCI11x1x probe sequence. That helper acquires
  the Ethernet subsystem\nhardware lock via lan743x_hs_syslock_acquire(), which relies
  on\nadapter->eth_syslock_spinlock to serialize access.\n\nThe spinlock is currently
  initialized only after the strap status is\nread. With CONFIG_DEBUG_SPINLOCK enabled,
  taking the zeroed initialized\nspinlock can trip the spinlock debug check.\n\nFix
  by initializing adapter->eth_syslock_spinlock before reading the\nstrap status so
  the probe path never attempts to lock an uninitialized\nspinlock."
