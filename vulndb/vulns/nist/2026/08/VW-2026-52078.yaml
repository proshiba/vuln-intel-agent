title: "When Apache Shiro is used with the Jakarta EE integration module, a low-privileged
  user can craft an HTTP request that causes the server to initiate a connection to
  an attacker-controlled URL and transmit attacker-controlled data. This vulnerability
  affects Apache Shiro versions 2.x through 3.0.0 only in deployments that use the
  Jakarta EE integration module.\n\nMitigation: Upgrade to version 3.0.1 or later,
  which fixes the issue. +\nAlternatively, you can set the `org.apache.shiro.form-resubmit-host`
  (String) and `org.apache.shiro.form-resubmit-port` (Integer) system properties to
  restrict the host and port that Shiro will connect to when resubmitting a form."
