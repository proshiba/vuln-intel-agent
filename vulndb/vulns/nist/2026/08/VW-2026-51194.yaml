title: "A flaw was found in gdk-pixbuf. When loading a specially crafted JPEG image
  containing chunked ICC profile markers, an error during ICC profile parsing can
  leave stale size metadata after the profile buffer is freed. A subsequent allocation
  in the same decode can cause an out-of-bounds write, potentially crashing the application.
  To exploit this flaw, an application using gdk-pixbuf must process the malicious
  JPEG image.\n\nAffected version >= 2.26.4"
