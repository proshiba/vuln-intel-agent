title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  Fix regression in writes when non-standard maximum write size negotiated\n\nThe
  conversion to netfs in the 6.3 kernel caused a regression when\nmaximum write size
  is set by the server to an unexpected value which is\nnot a multiple of 4096 (similarly
  if the user overrides the maximum\nwrite size by setting mount parm \"wsize\", but
  sets it to a value that\nis not a multiple of 4096).  When negotiated write size
  is not a\nmultiple of 4096 the netfs code can skip the end of the final\npage when
  doing large sequential writes, causing data corruption.\n\nThis section of code
  is being rewritten/removed due to a large\nnetfs change, but until that point (ie
  for the 6.3 kernel until now)\nwe can not support non-standard maximum write sizes.\n\
  \nAdd a warning if a user specifies a wsize on mount that is not\na multiple of
  4096 (and round down), also add a change where we\nround down the maximum write
  size if the server negotiates a value\nt"
