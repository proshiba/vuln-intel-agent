title: tablib prior to 3.10.0 contains a stored cross-site scripting 
  vulnerability in the HTML export functionality that allows attackers to 
  execute arbitrary JavaScript by embedding malicious payloads in dataset 
  titles, which are interpolated unsanitized into HTML output via the 
  export_book method in the _html.py format handler. Attackers can rename 
  worksheet sheets in imported files such as XLSX, ODS, XLS, or YAML with script
  payloads that are assigned to the Dataset title attribute and rendered 
  unescaped inside an HTML h3 tag, leading to session hijacking, unauthorized 
  administrative actions, and sensitive data exposure when the output is 
  rendered in a browser.
