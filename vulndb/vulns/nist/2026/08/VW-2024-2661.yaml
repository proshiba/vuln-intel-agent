title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  Don't leak cfid when reconnect races with open_cached_dir\n\nopen_cached_dir() may
  either race with the tcon reconnection even before\ncompound_send_recv() or directly
  trigger a reconnection via\nSMB2_open_init() or SMB_query_info_init().\n\nThe reconnection
  process invokes invalidate_all_cached_dirs() via\ncifs_mark_open_files_invalid(),
  which removes all cfids from the\ncfids->entries list but doesn't drop a ref if
  has_lease isn't true. This\nresults in the currently-being-constructed cfid not
  being on the list,\nbut still having a refcount of 2. It leaks if returned from\n\
  open_cached_dir().\n\nFix this by setting cfid->has_lease when the ref is actually
  taken; the\ncfid will not be used by other threads until it has a valid time.\n\n\
  Addresses these kmemleaks:\n\nunreferenced object 0xffff8881090c4000 (size 1024):\n\
  \  comm \"bash\", pid 1860, jiffies 4295126592\n  hex dump (first 32 bytes):\n \
  \   00 01 00 00 00 00 ad de 22 01 00 00 00 "
