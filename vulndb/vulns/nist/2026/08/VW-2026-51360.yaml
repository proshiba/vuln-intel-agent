title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  core: Fix OOB read in hid_get_report for numbered reports\n\nWhen a caller passes
  a size of 0 to hid_report_raw_event() for a\nnumbered report, the function originally
  called hid_get_report() before\nperforming any size validation.\n\nInside hid_get_report(),
  if the report is numbered (report_enum->numbered\nis true), it unconditionally dereferences
  data[0] to extract the report ID.\nWith a size of 0, this results in an out-of-bounds
  read or kernel panic.\n\nFix this by moving the numbered report size validation
  check before the\ncall to hid_get_report(), ensuring that size is at least 1 before\n\
  dereferencing the data pointer."
