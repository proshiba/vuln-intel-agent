title: "In the Linux kernel, the following vulnerability has been resolved:\n\nminix:
  avoid overflow in bitmap block count calculation\n\nminix_check_superblock() uses
  minix_blocks_needed() to verify that the\non-disk imap and zmap block counts are
  large enough for the advertised\ninode and zone counts.\n\nThe helper currently
  performs DIV_ROUND_UP() in unsigned int arithmetic.\nA Minix v3 image can set s_ninodes
  or s_zones near UINT_MAX so the\naddition inside DIV_ROUND_UP() wraps to zero. That
  makes a zero imap/zmap\nblock count look valid, after which minix_fill_super() can
  dereference\ns_imap[0] or s_zmap[0] even though no bitmap buffers were allocated.\n\
  \nImpact: mounting a crafted Minix v3 image whose s_ninodes or s_zones is\nnear
  UINT_MAX makes minix_check_superblock() accept a zero bitmap-block\ncount and minix_fill_super()
  dereference s_imap[0]/s_zmap[0], panicking\nthe kernel.\n\nThe divisor is the bitmap
  capacity in bits, blocksize * 8, which is\nalways a power of two: minix_fill_super()
