title: The Beaver Builder Page Builder – Drag and Drop Website Builder plugin 
  for WordPress is vulnerable to Stored Cross-Site Scripting via Button Module 
  'button' (Button Code) Setting in all versions up to, and including, 2.10.2.2 
  due to insufficient input sanitization and output escaping. This makes it 
  possible for authenticated attackers, with author-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. Beaver Builder grants editor access to any 
  WordPress role holding the edit_posts capability by default, meaning 
  Author-level users and above can exploit this vulnerability.
