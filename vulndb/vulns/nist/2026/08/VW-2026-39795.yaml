title: A flaw was found in the Dynamic Client Registration (DCR) component of 
  Keycloak, an identity and access management solution. The default DCR policy 
  fails to properly validate the claim path for User Property mappers, allowing 
  them to write values to sensitive internal claim locations. An attacker with a
  standard user account and a limited Initial Access Token can exploit this to 
  forge administrative roles in their access token. This allows the attacker to 
  take over other clients, steal confidential secrets, and potentially gain full
  administrative control over the realm.
