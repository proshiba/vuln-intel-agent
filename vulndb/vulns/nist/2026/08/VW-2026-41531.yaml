title: Discourse is an open-source discussion platform. Prior to 2026.1.6, 
  2026.5.2, 2026.6.1, and 2026.7.0, 
  SiteSerializer.anonymous_default_navigation_menu_tags serializes tags from 
  SiteSetting.default_navigation_menu_tags without applying 
  DiscourseTagging.filter_visible for the anonymous viewer. An unauthenticated 
  user can retrieve restricted tag names and descriptions through /site.json 
  when those tags are limited by inaccessible categories, category tag groups, 
  or tag-group permissions. This issue is fixed in versions 2026.1.6, 2026.5.2, 
  2026.6.1, and 2026.7.0.
