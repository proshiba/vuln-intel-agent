title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  tas2781: bound firmware description string parsing\n\nThe TAS2781 firmware parser
  reads several variable-length description\nstrings with strlen() before checking
  that the string terminator is\npresent inside the firmware blob. A malformed firmware
  image without a\nNUL terminator can therefore make the parser walk past the end
  of the\nfirmware buffer before the later size checks run.\n\nAdd a small bounded
  string-length helper and use it for all description\nfields that are parsed from
  the firmware buffer. Keep the existing size\nchecks for the fixed bytes that follow
  each string."
