title: A vulnerability was found in MZ Automation libiec61850 up to 1.6.1. The 
  affected element is the function deleteDataSetValuesShadowBuffer of the file 
  src/iec61850/server/mms_mapping/reporting.c of the component URCB 
  Revalidation. The manipulation results in use after free. The attack needs to 
  be approached locally. The exploit has been made public and could be used. 
  Upgrading to version 1.6.2 is sufficient to fix this issue. The patch is 
  identified as 486fd57f3aed65bb9d636ff00f9ddce2e450b168. Upgrading the affected
  component is advised.
