title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  prevent in6_dev_get() from resurrecting inet6_dev\n\nin6_dev_get() reads dev->ip6_ptr
  under RCU and then unconditionally\nincrements its refcount. Device teardown can
  clear the pointer and drop\nthe last reference between these operations. The increment
  then\nresurrects an object whose RCU free has already been queued, so callers\n\
  can use it after it is freed.\n\nUse refcount_inc_not_zero() and return NULL when
  the object has already\nreached zero. RCU keeps the memory accessible through the
  attempted\nreference acquisition, and a successful increment pins the object for\n\
  the caller.\n\nAn independent run on the exact unpatched 6f5156d7a31a (v7.2-rc3)\n\
  kernel reproduced the invalid reference acquisition as UID 1000:\n\n  refcount_t:
  addition on 0; use-after-free.\n  ip6_mc_source+0xef4/0x17e0\n\nIt was followed
  by the corresponding reference underflow in\nip6_mc_source(). The supplied trace
  from the same unpatched revision\naddition"
