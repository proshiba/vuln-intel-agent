title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  fastrpc: fix list iterator in fastrpc_req_mem_unmap_impl\n\nThis is another instance
  of incorrect use of list iterator and\nchecking it for NULL.\n\nThe list iterator
  value 'map' will *always* be set and non-NULL\nby list_for_each_entry(), so it is
  incorrect to assume that the\niterator value will be NULL if the list is empty (in
  this case, the\ncheck 'if (!map) {' will always be false and never exit as expected).\n\
  \nTo fix the bug, use a new variable 'iter' as the list iterator,\nwhile use the
  original variable 'map' as a dedicated pointer to\npoint to the found element.\n\
  \nWithout this patch, Kernel crashes with below trace:\n\nUnable to handle kernel
  access to user memory outside uaccess routines\n at virtual address 0000ffff7fb03750\n\
  ...\nCall trace:\n fastrpc_map_create+0x70/0x290 [fastrpc]\n fastrpc_req_mem_map+0xf0/0x2dc
  [fastrpc]\n fastrpc_device_ioctl+0x138/0xc60 [fastrpc]\n __arm64_sys_ioctl+0xa8/0xec\n\
  \ invoke_syscall+0x48/0x"
