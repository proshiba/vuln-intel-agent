title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tls:
  Fix use-after-free after the TLS device goes down and up\n\nWhen a netdev with active
  TLS offload goes down, tls_device_down is\ncalled to stop the offload and tear down
  the TLS context. However, the\nsocket stays alive, and it still points to the TLS
  context, which is now\ndeallocated. If a netdev goes up, while the connection is
  still active,\nand the data flow resumes after a number of TCP retransmissions,
  it will\nlead to a use-after-free of the TLS context.\n\nThis commit addresses this
  bug by keeping the context alive until its\nnormal destruction, and implements the
  necessary fallbacks, so that the\nconnection can resume in software (non-offloaded)
  kTLS mode.\n\nOn the TX side tls_sw_fallback is used to encrypt all packets. The
  RX\nside already has all the necessary fallbacks, because receiving\nnon-decrypted
  packets is supported. The thing needed on the RX side is\nto block resync requests,
  which are normally produce"
