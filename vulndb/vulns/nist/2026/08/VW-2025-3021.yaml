title: "In the Linux kernel, the following vulnerability has been resolved:\n\njbd2:
  check 'jh->b_transaction' before removing it from checkpoint\n\nFollowing process
  will corrupt ext4 image:\nStep 1:\njbd2_journal_commit_transaction\n __jbd2_journal_insert_checkpoint(jh,
  commit_transaction)\n // Put jh into trans1->t_checkpoint_list\n journal->j_checkpoint_transactions
  = commit_transaction\n // Put trans1 into journal->j_checkpoint_transactions\n\n\
  Step 2:\ndo_get_write_access\n test_clear_buffer_dirty(bh) // clear buffer dirty，set
  jbd dirty\n __jbd2_journal_file_buffer(jh, transaction) // jh belongs to trans2\n\
  \nStep 3:\ndrop_cache\n journal_shrink_one_cp_list\n  jbd2_journal_try_remove_checkpoint\n\
  \   if (!trylock_buffer(bh))  // lock bh, true\n   if (buffer_dirty(bh))     //
  buffer is not dirty\n   __jbd2_journal_remove_checkpoint(jh)\n   // remove jh from
  trans1->t_checkpoint_list\n\nStep 4:\njbd2_log_do_checkpoint\n trans1 = journal->j_checkpoint_transactions\n\
  \ // jh is not in trans1->t_checkpoint_list\n jbd2_cleanup_j"
