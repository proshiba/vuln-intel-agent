title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd:
  Plug nlm_file leak when nlm_do_fopen() fails\n\nA client can repeatedly drive nlm_do_fopen()
  failures by presenting\nfile handles that the underlying export rejects. After kzalloc_obj()\n\
  succeeds in nlm_lookup_file(), the freshly allocated nlm_file is not\nyet inserted
  into nlm_files[]. The nlm_do_fopen() failure path jumps\nto out_unlock, which releases
  nlm_file_mutex and returns without\nfreeing the allocation, so each failure leaks
  one nlm_file.\n\nRoute the failure through out_free so kfree() runs before the\n\
  function returns."
