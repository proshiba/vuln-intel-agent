title: PLANET GS-4210-16P2S firmware before 3.441b260626 contains an 
  authenticated OS command injection vulnerability in 
  /cgi-bin/httpuploadcert.cgi. The certificate password field in a certificate 
  upload request is incorporated into a shell command without sanitization of 
  shell metacharacters. A remote attacker with administrator web credentials can
  submit a crafted certificate upload request to execute arbitrary 
  operating-system commands on the device.
