title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsamples/damon/mtier:
  error out for zero quota goal target values\n\nPatch series \"mm/damon: avoid division
  by zero from damos_quota_score()\".\n\nDAMON_SAMPLE_MTIER and DAMON_LRU_SORT allow
  the user to trigger division\nby zero in damos_quota_score().  Avoid it by adding
  parameters validation\nchecks.\n\n\nThis patch (of 2):\n\ndamos_quota_score() can
  trigger division by zero if the target_value is\nzero.  DAMON_SAMPLE_MTIER lets
  users set the target_value via\nnode0_mem_{used,free}_bp parameters.  It doesn't
  guard zero value case,\nthough.  As a result, users can trigger division by zero.\
  \  Fix the issue\nby returning an error when the user tries to start DAMON with
  zero\nnode0_mem_{used,free}_bp parameter values.\n\nDAMON_SAMPLE_MTIER is just a
  sample module, but the consequence is quite\nbad.  Also the zero node0_mem_free_bp
  parameter might look like a\nreasonable setup to some users.  Hence, the issue might
  really happen in\nthe real wo"
