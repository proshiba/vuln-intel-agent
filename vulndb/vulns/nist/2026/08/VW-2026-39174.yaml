title: "The hawkBit device management client in subsys/mgmt/hawkbit accumulates the
  body of an HTTP response from the update server into a heap buffer in response_json_cb()
  (subsys/mgmt/hawkbit/hawkbit.c). The buffer is sized to hold the received body bytes
  but reserves no space for a terminating NUL. When the full response has arrived,
  the code writes response_data[downloaded_size] = '\\0' — and whenever the accumulated
  body length equals the allocation, that terminator lands one byte past the end of
  the heap object (a heap-based out-of-bounds write, CWE-122 / CWE-787).\n\nThe body
  length and fragmentation are taken directly from the parsed HTTP response (rsp->body_frag_start
  / rsp->body_frag_len) and are fully controlled by the remote hawkBit server, which
  chooses its own response length. The precise trigger depends on how the buffer grows,
  and both forms are remotely reachable. Since v4.0.0 the reallocation is sized to
  exactly downloaded_size + body_len, so any response body larger than the 11"
