title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to check readonly condition correctly\n\nWith below case, it can mount multi-device
  image w/ rw option, however\none of secondary device is set as ro, later update
  will cause panic, so\nlet's introduce f2fs_dev_is_readonly(), and check multi-devices
  rw status\nin f2fs_remount() w/ it in order to avoid such inconsistent mount status.\n\
  \nmkfs.f2fs -c /dev/zram1 /dev/zram0 -f\nblockdev --setro /dev/zram1\nmount -t f2fs
  dev/zram0 /mnt/f2fs\nmount: /mnt/f2fs: WARNING: source write-protected, mounted
  read-only.\nmount -t f2fs -o remount,rw mnt/f2fs\ndd if=/dev/zero  of=/mnt/f2fs/file
  bs=1M count=8192\n\nkernel BUG at fs/f2fs/inline.c:258!\nRIP: 0010:f2fs_write_inline_data+0x23e/0x2d0
  [f2fs]\nCall Trace:\n  f2fs_write_single_data_page+0x26b/0x9f0 [f2fs]\n  f2fs_write_cache_pages+0x389/0xa60
  [f2fs]\n  __f2fs_write_data_pages+0x26b/0x2d0 [f2fs]\n  f2fs_write_data_pages+0x2e/0x40
  [f2fs]\n  do_writepages+0xd3/0x1b0\n  __writeback_single_ino"
