title: The AI Copilot – Content Generator plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 1.5.6. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for unauthenticated attackers to create a new 
  administrator-level user account and achieve full site takeover by saving and 
  executing a malicious workflow containing a wp_create_user action node 
  specifying role=administrator. This vulnerability is exploitable by 
  unauthenticated attackers on any site where the [aiwu-form] shortcode or 
  public chatbot is rendered on a frontend page, as the waic-nonce value is 
  emitted into publicly accessible JavaScript (WAIC_DATA.waicNonce) on those 
  pages, rendering the nonce check a non-functional authorization barrier.
