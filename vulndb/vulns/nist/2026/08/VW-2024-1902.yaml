title: "In the Linux kernel, the following vulnerability has been resolved:\n\njfs:
  fix array-index-out-of-bounds in dbFindLeaf\n\nCurrently while searching for dmtree_t
  for sufficient free blocks there\nis an array out of bounds while getting element
  in tp->dm_stree. To add\nthe required check for out of bound we first need to determine
  the type\nof dmtree. Thus added an extra parameter to dbFindLeaf so that the type\n\
  of tree can be determined and the required check can be applied."
