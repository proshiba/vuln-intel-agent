title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sxgbe: free TX rings on RX allocation failure\n\nWhen RX descriptor ring allocation
  fails, init_dma_desc_rings() only\nfrees the partially allocated RX rings and returns.
  The TX rings that\nwere allocated earlier in the same function are leaked.\n\nRearrange
  error labels to clean up TX rings upon RX failures."
