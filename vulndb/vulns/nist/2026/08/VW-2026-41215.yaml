title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphonet:
  pep: fix use-after-free in pep_get_sb()\n\npep_get_sb() doesn't consider that pskb_may_pull()
  might have relocated\nthe skb data, and continue to access the older pointer, causing
  UAF.\n\nReproduced under KASAN:\n\n  BUG: KASAN: slab-use-after-free in pep_get_sb+0x234/0x3b0\n\
  \  Read of size 1 at addr ff11000105510f50 by task repro/157\n   pep_get_sb+0x234/0x3b0\n\
  \   pipe_handler_do_rcv+0x5f7/0xa10\n   pep_do_rcv+0x203/0x410\n   __sk_receive_skb+0x471/0x4a0\n\
  \   phonet_rcv+0x5b3/0x6c0\n   __netif_receive_skb+0xcc/0x1d0\n\nRefetch the header
  with skb_header_pointer() after pskb_may_pull(), so\nthe possibly stale pointer
  is no longer dereferenced. There are better\nways to solve this, but, this is the
  less instrusive one."
