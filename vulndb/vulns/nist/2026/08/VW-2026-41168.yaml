title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate ACE size against SID sub-authorities\n\nset_ntacl_dacl() validates sid.num_subauth
  before copying an ACE, but\ndoes not verify that the declared ACE size contains
  all sub-authorities\ndescribed by that field. An undersized ACE can therefore be
  copied\nand later make the POSIX ACL deduplication walk inspect data beyond\nthe
  copied ACE boundary.\n\nThe existing initial bound check is also too small. It only
  ensures\nthat the ACE size field is accessible before set_ntacl_dacl() reads\nsid.num_subauth
  farther into the input buffer.\n\nRequire enough input for the fixed SID header
  before accessing\nnum_subauth, reject ACEs smaller than that header, and skip ACEs\n\
  whose declared size cannot contain the complete SID. This makes the\nvalidation
  consistent with the other ACE walk paths."
