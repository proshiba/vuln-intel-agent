title: NortheBridge/luminalshine is a Sunshine-compatible game stream host for 
  Moonlight. Prior to version 26.05.0-rc4, a latent gap exists on a default 
  install, the file at `src/platform/windows/misc.cpp` lives at 
  `C:\ProgramData\LuminalShine\config\apps.json` and is created by the `SYSTEM` 
  service. Under Windows' default `C:\ProgramData` inheritance, that gives 
  `BUILTIN\Users` only Read+Execute — not writable — so the canonical EoP 
  doesn't actually trigger on a vanilla install. Version 26.05.0-rc4 contains a 
  patch for the issue. As a workaround, use default condition DACLs for 
  `ProgramData`.
