title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix wrong next length validation of ea buffer in smb2_set_ea()\n\nThere are multiple
  smb2_ea_info buffers in FILE_FULL_EA_INFORMATION request\nfrom client. ksmbd find
  next smb2_ea_info using ->NextEntryOffset of\ncurrent smb2_ea_info. ksmbd need to
  validate buffer length Before\naccessing the next ea. ksmbd should check buffer
  length using buf_len,\nnot next variable. next is the start offset of current ea
  that got from\nprevious ea."
