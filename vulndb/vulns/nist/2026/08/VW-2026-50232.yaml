title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: publish GC-visible tuple last\n\nnf_flow_table_iterate() only treats
  original-direction tuple nodes as\nowning entries. Publishing the original node
  first lets GC observe and\nfree a flow while flow_offload_add() is still inserting
  the reply node.\nPublish the reply node first and the original node last so GC never\n\
  sees a partially installed flow.\n\nKASAN can trigger slab-use-after-free read and
  write reports in the\nflowtable/rhashtable path (rht_deferred_worker, jhash, flow_offload_del,\n\
  flow_offload_lookup, etc.)."
