title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvideo:
  fbdev: arkfb: Check the size of screen before memset_io()\n\nIn the function arkfb_set_par(),
  the value of 'screen_size' is\ncalculated by the user input. If the user provides
  the improper value,\nthe value of 'screen_size' may larger than 'info->screen_size',
  which\nmay cause the following bug:\n\n[  659.399066] BUG: unable to handle page
  fault for address: ffffc90003000000\n[  659.399077] #PF: supervisor write access
  in kernel mode\n[  659.399079] #PF: error_code(0x0002) - not-present page\n[  659.399094]
  RIP: 0010:memset_orig+0x33/0xb0\n[  659.399116] Call Trace:\n[  659.399122]  arkfb_set_par+0x143f/0x24c0\n\
  [  659.399130]  fb_set_var+0x604/0xeb0\n[  659.399161]  do_fb_ioctl+0x234/0x670\n\
  [  659.399189]  fb_ioctl+0xdd/0x130\n\nFix the this by checking the value of 'screen_size'
  before memset_io()."
