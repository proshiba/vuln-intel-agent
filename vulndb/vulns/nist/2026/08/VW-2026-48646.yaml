title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_ct: fix sk_buff leak when the header checks reject a packet\n\ntcf_ct_handle_fragments()
  runs its header sanity checks before handing\nanything to the defragmentation engine:\n\
  \n\tif (family == NFPROTO_IPV4)\n\t\terr = tcf_ct_ipv4_is_fragment(skb, &frag);\n\
  \telse\n\t\terr = tcf_ct_ipv6_is_fragment(skb, &frag);\n\tif (err || !frag)\n\t\t
  return err;\n\ntcf_ct_ipv4_is_fragment() returns -EINVAL or -ENOMEM;\ntcf_ct_ipv6_is_fragment()
  adds -EPROTO when ipv6_find_hdr() fails. None of\nthem frees or queues the skb,
  so on that path the caller still owns it.\n\ntcf_ct_act() however funnels every
  non-zero return into the\nownership-transfer exit:\n\n\terr = tcf_ct_handle_fragments(net,
  skb, family, p->zone, &defrag);\n\tif (err)\n\t\tgoto out_frag;\n\t...\nout_frag:\n\
  \tif (err != -EINPROGRESS)\n\t\ttcf_action_inc_drop_qstats(&c->common);\n\treturn
  TC_ACT_CONSUMED;\n\nTC_ACT_CONSUMED means the action took ownership of the skb,
  so no caller\nfrees it - sch_hand"
