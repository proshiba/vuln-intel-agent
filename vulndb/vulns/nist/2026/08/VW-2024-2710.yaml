title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/fadump:
  Move fadump_cma_init to setup_arch() after initmem_init()\n\nDuring early init CMA_MIN_ALIGNMENT_BYTES
  can be PAGE_SIZE,\nsince pageblock_order is still zero and it gets initialized\n\
  later during initmem_init() e.g.\nsetup_arch() -> initmem_init() -> sparse_init()
  -> set_pageblock_order()\n\nOne such use case where this causes issue is -\nearly_setup()
  -> early_init_devtree() -> fadump_reserve_mem() -> fadump_cma_init()\n\nThis causes
  CMA memory alignment check to be bypassed in\ncma_init_reserved_mem(). Then later
  cma_activate_area() can hit\na VM_BUG_ON_PAGE(pfn & ((1 << order) - 1)) if the reserved
  memory\narea was not pageblock_order aligned.\n\nFix it by moving the fadump_cma_init()
  after initmem_init(),\nwhere other such cma reservations also gets called.\n\n<stack
  trace>\n==============\npage: refcount:0 mapcount:0 mapping:0000000000000000 index:0x0
  pfn:0x10010\nflags: 0x13ffff800000000(node=1|zone=0|lastcpupid=0x7f"
