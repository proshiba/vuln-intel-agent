title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  iforce - validate input packet lengths\n\niforce_process_packet() reads fixed fields
  from joystick, wheel and\nstatus packets without first checking their lengths. In
  particular, the\nshared hats-and-buttons helper unconditionally reads data[6]. The
  status\ntail is a sequence of 16-bit effect addresses, but an incomplete final\n\
  address is also consumed. A successful zero-length USB URB additionally\nreads the
  packet ID before the common parser is called.\n\nReject the zero-length USB transfer,
  require the seven-byte joystick and\nwheel prefixes and the two-byte status prefix,
  and consume only complete\nstatus-tail addresses."
