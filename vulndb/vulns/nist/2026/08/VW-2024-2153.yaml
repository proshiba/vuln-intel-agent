title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  cs_dsp: Prevent buffer overrun when processing V2 alg headers\n\nCheck that all
  fields of a V2 algorithm header fit into the available\nfirmware data buffer.\n\n\
  The wmfw V2 format introduced variable-length strings in the algorithm\nblock header.
  This means the overall header length is variable, and the\nposition of most fields
  varies depending on the length of the string\nfields. Each field must be checked
  to ensure that it does not overflow\nthe firmware data buffer.\n\nAs this ia bugfix
  patch, the fixes avoid making any significant change to\nthe existing code. This
  makes it easier to review and less likely to\nintroduce new bugs."
