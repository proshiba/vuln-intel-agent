title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  xilinx: axienet: Enqueue Tx packets in dql before dmaengine starts\n\nEnqueue packets
  in dql after dma engine starts causes race condition.\nTx transfer starts once dma
  engine is started and may execute dql dequeue\nin completion before it gets queued.
  It results in following kernel crash\nwhile running iperf stress test:\n\nkernel
  BUG at lib/dynamic_queue_limits.c:99!\n<snip>\nInternal error: Oops - BUG: 00000000f2000800
  [#1] SMP\npc : dql_completed+0x238/0x248\nlr : dql_completed+0x3c/0x248\n\nCall
  trace:\n  dql_completed+0x238/0x248\n  axienet_dma_tx_cb+0xa0/0x170\n  xilinx_dma_do_tasklet+0xdc/0x290\n\
  \  tasklet_action_common+0xf8/0x11c\n  tasklet_action+0x30/0x3c\n  handle_softirqs+0xf8/0x230\n\
  <snip>\n\nStart dmaengine after enqueue in dql fixes the crash."
