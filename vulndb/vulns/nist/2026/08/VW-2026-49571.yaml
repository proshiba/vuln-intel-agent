title: Airbyte Platform resolves the workspace used for its authorization 
  decision from a field the caller supplies. AuthorizationServerHandler copies 
  recognised identifiers out of the raw JSON request body into X-Airbyte-* 
  headers, and AuthenticationHeaderResolver.resolveWorkspace consults 
  X-Airbyte-Workspace-Id ahead of every resource-derived header, including those
  for connection, source and destination identifiers. Endpoints whose declared 
  request bodies carry only a resource identifier are nonetheless reached with 
  an added workspaceId field, because the extractor reads the body rather than 
  the endpoint's schema, so the permission check is performed against the 
  workspace the caller nominated while the handler acts on the resource 
  identifier the caller supplied. Nothing afterwards compares the resource's 
  owning workspace with the one that was authorized. A member of any workspace 
