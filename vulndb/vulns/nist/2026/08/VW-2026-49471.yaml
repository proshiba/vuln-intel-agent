title: rclone before 1.74.4 fails to mask special permission bits when applying 
  source-supplied mode metadata in the local backend, allowing attackers to set 
  setuid/setgid bits on attacker-controlled files. When copying with metadata 
  preservation from an untrusted remote, attackers can plant a setuid binary 
  that escalates privileges to root if rclone runs as root, or to the service 
  account user otherwise.
