title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  enforce cursor size limits for MOB cursors\n\nvmw_cursor_plane_atomic_check() bounds
  cursor width and height only\non the legacy update path; the SVGA_CAP2_CURSOR_MOB
  path -- the\ndefault on modern hosts -- accepts any size.  When the requested size\n\
  exceeds SVGA_REG_CURSOR_MAX_DIMENSION or SVGA_REG_MOB_MAX_SIZE,\nvmw_cursor_mob_get()
  returns -EINVAL and leaves vps->cursor.mob NULL.\nIts return value is then discarded
  in vmw_cursor_plane_prepare_fb(),\nso the subsequent vmw_cursor_update_mob() calls\n\
  vmw_bo_map_and_cache(NULL) and oopses inside\nvmw_bo_map_and_cache_size() on the
  tbo.base.size load.\n\nReachable from any DRM master via DRM_IOCTL_MODE_CURSOR2
  with a\nsufficiently large width or height (e.g. cursor_max_dim + 1).\n\nReject
  oversized cursors in atomic_check for both MOB-backed cursor\nupdate types.  The
  MOB byte-size limit only applies to the\nSVGA_CAP2_CURSOR_MOB path (vmw_cursor_mob_size()
  returns 0 for\nGB_O"
