title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: printer: fix infinite loop in printer_read()\n\nprinter_read() uses the
  same variable for the requested copy size and\nthe number of bytes actually copied
  to user space. copy_to_user()\nreturns the number of bytes not copied, so when it
  fails to copy\nanything, the computed copied length becomes zero.\n\nIn that case
  len, buf, current_rx_bytes and current_rx_buf are left\nunchanged. If RX data is
  available and the user buffer remains\nunwritable, the read loop can repeat indefinitely.\n\
  \nTrack the copied length separately and return -EFAULT, or the number of\nbytes
  already copied, if an iteration makes no progress."
