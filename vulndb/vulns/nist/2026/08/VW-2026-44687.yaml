title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhandshake:
  Require admin permission for DONE command\n\nACCEPT and DONE are the two downcalls
  of the handshake genl\nfamily, both intended for use by the trusted handshake agent\n\
  (tlshd). ACCEPT already requires GENL_ADMIN_PERM; DONE has\nno privilege check at
  all.\n\nThe fd-lookup in handshake_nl_done_doit() only confirms that\nsome pending
  handshake request exists for the supplied sockfd;\nit does not authenticate the
  sender. An unprivileged process\nthat guesses or observes a valid sockfd can therefore
  submit\na DONE with HANDSHAKE_A_DONE_STATUS == 0, leaving the kernel\nconsumer to
  proceed as if the handshake succeeded. A non-zero\nstatus on a forged DONE tears
  down a legitimate in-flight\nhandshake before tlshd can report its real result."
