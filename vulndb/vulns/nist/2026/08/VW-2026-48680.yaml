title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  qcom-geni: fix TX DMA buffer flush\n\nWhen transmit flushing a qcom-geni UART during
  an ongoing TX DMA, the\nUART gets stuck infinitely repeating corrupted TX DMA frames.\n\
  \nThe DMA-mode uart_ops does not provide a flush_buffer callback, so an\nin-flight
  transfer can complete after serial core has reset the transmit\nkfifo, underflowing
  its length and resubmitting page-sized transfers\nindefinitely. Add one that stops
  the transfer and clears tx_remaining\nand tx_queued.\n\nThe stop path was also broken:
  it unmapped the buffer while the serial\nengine could still read it, and never reset
  the TX DMA state machine.\nCancel the main sequencer command first, then reset the
  state machine\nand wait for it before unmapping. Drop the early return so a pending\n\
  mapping is also cleaned up when the main command is inactive.\n\nThe bug can be
  triggered from userspace with a large write immediately\nfollowed by TCOFLUSH. A
