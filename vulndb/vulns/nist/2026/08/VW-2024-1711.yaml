title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  sun8i-ce - Fix use after free in unprepare\n\nsun8i_ce_cipher_unprepare should be
  called before\ncrypto_finalize_skcipher_request, because client callbacks may\n\
  immediately free memory, that isn't needed anymore. But it will be\nused by unprepare
  after free. Before removing prepare/unprepare\ncallbacks it was handled by crypto
  engine in crypto_finalize_request.\n\nUsually that results in a pointer dereference
  problem during a in\ncrypto selftest.\n Unable to handle kernel NULL pointer dereference
  at\n                                      virtual address 0000000000000030\n Mem
  abort info:\n   ESR = 0x0000000096000004\n   EC = 0x25: DABT (current EL), IL =
  32 bits\n   SET = 0, FnV = 0\n   EA = 0, S1PTW = 0\n   FSC = 0x04: level 0 translation
  fault\n Data abort info:\n   ISV = 0, ISS = 0x00000004, ISS2 = 0x00000000\n   CM
  = 0, WnR = 0, TnD = 0, TagAccess = 0\n   GCS = 0, Overlay = 0, DirtyBit = 0, Xs
  = 0\n user pgtable: 4k pages, 48-b"
