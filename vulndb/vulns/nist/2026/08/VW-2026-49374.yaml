title: Ech0 before 4.5.1 contains an authorization bypass vulnerability where 
  session tokens skip scope validation in RequireScopes middleware, allowing 
  logged-in non-admin users to access admin endpoints. Attackers can read system
  logs, visitor statistics, user emails, and subscribe to live WebSocket logs by
  sending authenticated session tokens to unprotected endpoints.
