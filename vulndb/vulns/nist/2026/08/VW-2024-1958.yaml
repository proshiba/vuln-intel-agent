title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  do not accept ACK of bytes we never sent\n\nThis patch is based on a detailed report
  and ideas from Yepeng Pan\nand Christian Rossow.\n\nACK seq validation is currently
  following RFC 5961 5.2 guidelines:\n\n   The ACK value is considered acceptable
  only if\n   it is in the range of ((SND.UNA - MAX.SND.WND) <= SEG.ACK <=\n   SND.NXT).\
  \  All incoming segments whose ACK value doesn't satisfy the\n   above condition
  MUST be discarded and an ACK sent back.  It needs to\n   be noted that RFC 793 on
  page 72 (fifth check) says: \"If the ACK is a\n   duplicate (SEG.ACK < SND.UNA),
  it can be ignored.  If the ACK\n   acknowledges something not yet sent (SEG.ACK
  > SND.NXT) then send an\n   ACK, drop the segment, and return\".  The \"ignored\"\
  \ above implies that\n   the processing of the incoming data segment continues,
  which means\n   the ACK value is treated as acceptable.  This mitigation makes the\n\
  \   ACK check more stringent since any ACK < S"
