title: Ech0 version 4.3.4 and earlier fails to reliably enforce scoped access 
  token (least-privilege) restrictions on several privileged admin routes. 
  Multiple privileged endpoints (e.g., /api/inbox, /api/panel/comments, 
  /api/backup/export) omit scope checks and authorize based only on the user's 
  admin role, and the backup export handler discards token scope metadata 
  entirely. An attacker holding a deliberately limited (low-scope) admin access 
  token can reach broader privileged functionality than intended, including 
  reading the inbox and exporting a full database backup ZIP archive. Fixed in 
  4.4.3.
