title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  gre: fix lltx regression for GRE tunnels with SEQ/CSUM\n\nBefore commit 00d066a4d4ed
  (\"netdev_features: convert NETIF_F_LLTX to\ndev->lltx\"), NETIF_F_LLTX was set
  unconditionally in both\n__gre_tunnel_init() and ip6gre_tnl_init_features() alongside\n\
  GRE_FEATURES:\n\n    dev->features |= GRE_FEATURES | NETIF_F_LLTX;\n\nWhen that
  commit converted NETIF_F_LLTX to the dev->lltx flag, it\nplaced 'dev->lltx = true'
  after the SEQ/CSUM early returns instead\nof before them. This causes GRE/GRETAP/ip6gre
  tunnels with SEQ or\nCSUM+encap to lose lockless TX, reintroducing _xmit_lock acquisition\n\
  around their ndo_start_xmit. Since GRE xmit re-enters the stack via\nip_tunnel_xmit(),
  holding _xmit_lock risks ABBA deadlock with the\nunderlay device.\n\n  CPU0    \
  \                    CPU1\n  ----                        ----\n  lock(&qdisc_xmit_lock_key#6);\n\
  \                              lock(&qdisc_xmit_lock_key#3);\n                 \
  \             loc"
