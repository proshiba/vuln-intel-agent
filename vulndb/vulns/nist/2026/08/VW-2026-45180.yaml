title: A vulnerability was detected in Open Asset Import Library Assimp 17c12da.
  This affects the function Assimp::MDLImporter::AddBonesToNodeGraph_3DGS_MDL7 
  of the file code/AssetLib/MDL/MDLLoader.cpp of the component Node Parser. The 
  manipulation of the argument bones_num results in heap-based buffer overflow. 
  The attack can be executed remotely. The exploit is now public and may be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
