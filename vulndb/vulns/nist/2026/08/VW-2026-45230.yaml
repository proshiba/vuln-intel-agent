title: SiYuan kernel before v3.7.4 contains a path traversal vulnerability in 
  the database_clean MCP tool. The tool performs only an empty-string check on 
  the id parameter before passing it to RemoveUnusedAttributeView 
  (kernel/model/attribute_view.go), which builds a filesystem path via 
  filepath.Join without validating that id matches SiYuan's node-ID format. An 
  authenticated MCP client can supply path traversal sequences in id to cause 
  the kernel to copy an arbitrary file readable by the process into SiYuan's 
  history directory (arbitrary file read) and then delete the original file 
  (arbitrary file deletion). The corresponding HTTP API handler was hardened in 
  GHSA-7hm9-v7vf-7g4w, but this MCP caller was not.
