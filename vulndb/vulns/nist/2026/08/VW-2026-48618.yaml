title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Take cgroup_lock() first in scx_cgroup_lock()\n\nscx_cgroup_lock() write-locks scx_cgroup_ops_rwsem
  and then takes\ncgroup_lock(), which can deadlock through kernfs:\n\n  scx enable/disable\
  \         cgroup rmdir           cpu.weight write\n  ------------------        \
  \ ------------           ----------------\n                             cgroup_lock()\n\
  \  percpu_down_write(rwsem)\n  cgroup_lock()\n                                 \
  \                   kernfs_get_active()\n                                      \
  \              percpu_down_read(rwsem)\n                             kernfs_drain()\n\
  \nThe enable path waits for the rmdir to release cgroup_mutex. The rmdir,\ndeactivating
  the cpu controller's files, waits in kernfs_drain() for the\nwrite's active reference.
  The write, in scx_group_set_weight(), waits for\nthe rwsem behind the pending writer.\n\
  \nTake cgroup_lock() first. The set_* paths take no cgroup locks inside the\nread
  sid"
