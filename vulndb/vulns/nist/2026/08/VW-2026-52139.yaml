title: "AjaxEditableChoiceLabel in wicket-extensions, when constructed with a non-null
  IChoiceRenderer, writes the display value obtained from that renderer into the label's
  markup without applying the HTML escaping Wicket performs by default for component
  model values. An attacker who can influence the choice or model data rendered by
  such a label can inject HTML or script that executes in the browser of any user
  who views the page. The same value is correctly escaped when the component's dropdown
  editor renders it as an option, so only the label rendering is affected.\n\nAjaxEditableLabel,
  AjaxEditableChoiceLabel and AjaxEditableMultiLineLabel write the value returned
  by the protected defaultNullLabel() method into the label's markup the same way
  when the component's model is empty, while the model value they show otherwise is
  escaped. The default implementation returns a constant, so an application is affected
  where it overrides that method and returns a value an attacker can influence.\n\n\
  Neit"
