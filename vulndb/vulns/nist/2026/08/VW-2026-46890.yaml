title: 'Vulnerability in the Oracle Agile PLM MCAD Connector product of Oracle Supply
  Chain (component: CAX Client).   The supported version that is affected is 3.6.
  Difficult to exploit vulnerability allows unauthenticated attacker with logon to
  the infrastructure where Oracle Agile PLM MCAD Connector executes to compromise
  Oracle Agile PLM MCAD Connector.  Successful attacks require human interaction from
  a person other than the attacker. Successful attacks of this vulnerability can result
  in  unauthorized update, insert or delete access to some of Oracle Agile PLM MCAD
  Connector accessible data as well as  unauthorized read access to a subset of Oracle
  Agile PLM MCAD Connector accessible data and unauthorized ability to cause a partial
  denial of service (partial DOS) of Oracle Agile PLM MCAD Connector. CVSS 3.1 Base
  Score 4.5 (Confidentiality, Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:L/I:L/A:L).'
