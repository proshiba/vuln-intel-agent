title: "The IPv6 neighbor-discovery code in subsys/net/ip/ipv6_nbr.c processes the
  6LoWPAN Context Option (6CO, RFC 6775) carried inside ICMPv6 Router Advertisements.
  In handle_ra_6co() the 8-bit context_len field is taken directly from the packet
  and was never bounded to the RFC maximum of 128. The function computes context->context_len
  / 8 and then performs memset(context->prefix + context_len, 0, sizeof(context->prefix)
  - context_len), where context->prefix is a fixed 16-byte array.\n\nWith context_len
  between 136 and 255 (and the option length field set to 3, which the pre-fix validation
  accepts), context_len / 8 evaluates to 17..31, so the memset length 16 - context_len/8
  underflows the unsigned size_t argument to roughly SIZE_MAX. This produces an unbounded
  out-of-bounds memset that zeroes kernel memory well past the 6lo context structure.\n\
  \nThe defect is reachable from unauthenticated, link-local input: any host on the
  same link can send a crafted Router Advertisement with a 6CO option. Th"
