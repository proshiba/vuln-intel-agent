title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Fix bcall rep leak and unbounded peek\n\nrpcrdma_is_bcall() decodes a reply's first
  words to decide whether\nthe frame is a backchannel call. Two issues in that decode
  path\nlet a short or malformed reply leak the receive buffer and drain\nthe Receive
  queue.\n\nFirst, the speculative peek\n\n    p = xdr_inline_decode(xdr, 0);\n  \
  \  /* five p++ reads follow */\n\nasks xdr_inline_decode() for zero bytes, which
  returns xdr->p\nwithout consulting xdr->end. The five subsequent __be32 reads can\n\
  then walk up to 20 bytes past the wire payload into stale regbuf\ncontents and misclassify
  the reply as a backchannel call.\n\nSecond, after the post-peek\n\n    p = xdr_inline_decode(xdr,
  3 * sizeof(*p));\n    if (unlikely(!p))\n            return true;\n\nthe short-header
  arm returns true without calling\nrpcrdma_bc_receive_call(). The contract with the
  caller is that a\ntrue return transfers ownership of rep to the backchannel path:\n\
  \n    rpcrdma"
