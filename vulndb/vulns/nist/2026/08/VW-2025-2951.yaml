title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev/ep93xx-fb:
  Do not assign to struct fb_info.dev\n\nDo not assing the Linux device to struct
  fb_info.dev. The call to\nregister_framebuffer() initializes the field to the fbdev
  device.\nDrivers should not override its value.\n\nFixes a bug where the driver
  incorrectly decreases the hardware\ndevice's reference counter and leaks the fbdev
  device.\n\nv2:\n\t* add Fixes tag (Dan)"
