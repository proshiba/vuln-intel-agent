title: "In the Linux kernel, the following vulnerability has been resolved:\n\nskbuff:
  Fix a race between coalescing and releasing SKBs\n\nCommit 1effe8ca4e34 (\"skbuff:
  fix coalescing for page_pool fragment\nrecycling\") allowed coalescing to proceed
  with non page pool page and page\npool page when @from is cloned, i.e.\n\nto->pp_recycle\
  \    --> false\nfrom->pp_recycle  --> true\nskb_cloned(from)  --> true\n\nHowever,
  it actually requires skb_cloned(@from) to hold true until\ncoalescing finishes in
  this situation. If the other cloned SKB is\nreleased while the merging is in process,
  from_shinfo->nr_frags will be\nset to 0 toward the end of the function, causing
  the increment of frag\npage _refcount to be unexpectedly skipped resulting in inconsistent\n\
  reference counts. Later when SKB(@to) is released, it frees the page\ndirectly even
  though the page pool page is still in use, leading to\nuse-after-free or double-free
  errors. So it should be prohibited.\n\nThe double-free error message below prompted
  us to investigat"
