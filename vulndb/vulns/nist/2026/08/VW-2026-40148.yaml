title: In Apache CXF's OAuth2 Dynamic Client Registration endpoint, the 
  authorization server accepts and stores the `scope` value supplied in the 
  client registration request verbatim, without validating it against an 
  AS-defined allowlist. This could lead to a client self-assigning privileged 
  scopes at registration time. Users are recommended to upgrade to versions 
  4.2.3 or 4.1.8 or 3.6.12, which fix this issue.
