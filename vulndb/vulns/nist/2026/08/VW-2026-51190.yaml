title: "Frappe 15.11.0 through 16.32.0 stores and renders the workspace card description
  without XSS filtering. The description field of the Workspace Link doctype is declared
  with \"ignore_xss_filter\": 1 in frappe/desk/doctype/workspace_link/workspace_link.json,
  and _sanitize_content() in frappe/model/base_document.py skips any field carrying
  that flag, so the value is stored exactly as submitted. frappe.desk.desktop.get_desktop_page
  returns it unchanged, and LinksWidget.set_body() in frappe/public/js/frappe/widgets/links_widget.js
  interpolates it into a Bootstrap popover created with html: true, by way of the
  __() translation helper, which performs no HTML escaping. A user holding the Workspace
  Manager role can therefore place arbitrary markup in a public workspace's card description
  and have it execute in the session of any desk user who opens that workspace and
  hovers the description, including higher-privileged users, allowing session token
  theft and authenticated requests as the victim. T"
