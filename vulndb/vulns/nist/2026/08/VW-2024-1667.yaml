title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt:
  prevent skb UAF after handing over to PTP worker\n\nWhen reading the timestamp is
  required bnxt_tx_int() hands\nover the ownership of the completed skb to the PTP
  worker.\nThe skb should not be used afterwards, as the worker may\nrun before the
  rest of our code and free the skb, leading\nto a use-after-free.\n\nSince dev_kfree_skb_any()
  accepts NULL make the loss of\nownership more obvious and set skb to NULL."
