title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/guc:
  Hold device ref until queue teardown completes\n\nGuC exec queue destruction can
  run asynchronously. If the final device\nput happens from a destroy worker, drmm
  cleanup can end up draining\nthe same workqueue and deadlock.\n\nHold a drm_device
  reference for the queue lifetime and drop it after\nqueue teardown completes. This
  keeps drmm cleanup from running while\nasync destroy work is still pending.\n\n\
  Move GuC destroy work to a module-lifetime Xe workqueue and flush it\non PCI remove
  so hot-unbind/rebind still waits for pending destroy work.\n\nWith queue-held device
  refs, guc_submit_sw_fini() cannot run with live\nGuC IDs. Replace the fini wait
  with an assertion and remove the unused\nfini_wq.\n\nv2:\n  - Rebase\n\nv3:\n  -
  Switch to queue-lifetime drm_dev_get()/drm_dev_put() model. (Matt)\n  - Queue async
  teardown on system_dfl_wq instead of xe->destroy_wq. (Matt)\n  - Drop separate deferred
  drm_dev_put worker.\n  - Remove st"
