title: "When internal roles are removed from a user within the WSO2 product, the system
  fails to invalidate any previously issued authentication tokens associated with
  that user.\n\nThis vulnerability could allow users to retain their previous access
  privileges even after their roles have been revoked. As a result, a user can continue
  to perform unauthorized actions or access restricted resources until the expired
  tokens naturally expire."
