title: The Exclusive Addons for Elementor plugin for WordPress is vulnerable to 
  Stored Cross-Site Scripting via the ‘ exad_infobox_image’ parameter in all 
  versions up to, and including, 2.7.9.8 due to insufficient input sanitization 
