title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/vrr:
  require valid min/max vfreq for VRR\n\nEnsure the EDID provided min/max vfreq are
  valid. Most scenarios are\nalready covered (by coincidence) through the checks in\n\
  intel_vrr_is_capable() and intel_vrr_is_in_range(), but be more explicit\nabout
  it. At worst, a zero min_vfreq could lead to a division by zero in\nintel_vrr_compute_vmax().\n\
  \nDiscovered using AI-assisted static analysis confirmed by Intel Product\nSecurity.\n\
  \n(cherry picked from commit 1765cf59f517b02f3b0591fe5120930d08bddeb6)"
