title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwan:
  wanxl: Only reset hardware after BAR mapping\n\nwanxl_pci_init_one() stores the
  freshly allocated card in driver data\nbefore the PLX BAR is mapped.  Several early
  probe failures then unwind\nthrough wanxl_pci_remove_one(), including failure to
  allocate the coherent\nstatus area or to restore the DMA mask.\n\nwanxl_pci_remove_one()
  unconditionally calls wanxl_reset(), and\nwanxl_reset() dereferences card->plx.\
  \  On those early failures card->plx\nis still NULL, so the error path can dereference
  a NULL MMIO pointer.\n\nOnly issue the hardware reset once the BAR mapping exists.\
  \  The remaining\ncleanup in wanxl_pci_remove_one() already checks whether later
  resources\nwere allocated.\n\nThis issue was found by a static analysis checker
  and confirmed by\nmanual source review."
