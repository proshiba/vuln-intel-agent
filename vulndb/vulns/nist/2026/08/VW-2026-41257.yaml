title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_misc:
  set have_execfd only once the interpreter is opened\n\nload_misc_binary() raises
  bprm->have_execfd as soon as it sees the 'O'\n(or 'C') flag. This happens well before
  it opens the interpreter. If\nthat open fails the flag stays set on the bprm. binfmt_misc
  is at the\nhead of the format list so an interpreter open failure that returns\n\
  -ENOEXEC lets the search fall through to a later format. This means it\nruns the
  matched binary directly having never staged an interpreter. So\nbprm->executable
  is NULL while have_execfd falsely claims a descriptor\nis present.\n\nConsequently,
  begin_new_exec() dereferences the missing executable:\n\n  would_dump(bprm, bprm->executable);\n\
  \nand NULL derefs. Had it not, the hand-off later in the same function\nwould have
  failed anyway. FD_ADD(0, bprm->executable) rejects a NULL\nfile with -ENOMEM. Both
  sites are past the point of no return so the\nexec cannot be unwound either way.\n\
