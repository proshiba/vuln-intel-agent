title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  reject overly deep qdisc hierarchies\n\nDeep qdisc hierarchies can lead to excessive
  recursion in qdisc tree\nwalkers and exhaust the kernel stack. The existing loop
  check does not\ncover the create-and-graft path, so a hierarchy can still be extended
  by\ncreating a new child qdisc below an already deep parent.\n\nStore the hierarchy
  depth in struct Qdisc and update it when qdiscs are\ngrafted. Reject new child qdiscs
  once the parent is already at the maximum\nallowed depth."
