title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, Dokploy's WebSocket handlers (in-app terminals and log streamers) 
  authenticate the session but never authorize it. They establish who the user 
  is via validateRequest() and then proceed without consulting the 
  role/permission model that every tRPC procedure enforces. Any authenticated 
  member, can therefore open an interactive shell into any container on the 
  host, including the dokploy container that mounts the Docker socket, and from 
  there obtain root on the host, escaping the application and crossing every 
  tenant boundary. This vulnerability is fixed in 0.29.13.
