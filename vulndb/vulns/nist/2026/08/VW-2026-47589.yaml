title: Lemmy is a link aggregator and forum for the fediverse. Prior to lemmy-ui
  0.19.19-beta.1, LemmyNet/lemmy-ui renders Markdown in src/shared/markdown.ts 
  for post bodies, comment bodies, private messages, and community and site 
  sidebars through mdToHtml, which returns a raw __html object that Inferno 
  injects without a sanitizer pass. setupMarkdown configures html as false but 
  registers markdown-it-html5-embed@1.0.0 with useImageSyntax enabled, so an 
  image targeting video media becomes a video element whose fallback 
  incorporates the image alt text through unescaped string replacement. The html
  setting does not apply to plugin-generated output, allowing crafted alt text 
  to reach the DOM as live HTML in contexts that do not use mdToHtmlNoImages. An
  approved member or a remote federated instance can store such content, and a 
  viewer who renders it may execute JavaScript in the lemmy-ui origin, exposing 
