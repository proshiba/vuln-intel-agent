title: "The Bluetooth host GATT client function parse_read_std_char_desc() in subsys/bluetooth/host/gatt.c
  parses an ATT Read By Type Response received from a remote GATT server during BT_GATT_DISCOVER_STD_CHAR_DESC
  discovery. The per-entry stride rsp->len is taken directly from the peer's PDU,
  and the parse loop both tests its exit condition (length >= rsp->len) and advances
  (length -= rsp->len, pdu += rsp->len) using that value. The minimum value of rsp->len
  was never validated before the loop.\n\nA malicious or malfunctioning peer can reply
  with rsp->len = 0. Because length is unsigned and never decreases, the loop condition
  stays true forever and the read pointer never advances; as long as the body is at
  least a few bytes with a non-zero handle and a matching descriptor UUID, the host
  repeatedly re-parses the same bytes and invokes the discovery callback, never terminating.
