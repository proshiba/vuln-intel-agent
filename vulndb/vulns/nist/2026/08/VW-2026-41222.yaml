title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_elf_fdpic:
  only honour the first PT_INTERP\n\nThe program header scan handles PT_INTERP from
  a switch nested in the\nscan loop, so its break leaves the switch and not the loop.
  A binary\ncarrying more than one PT_INTERP runs the case again and overwrites both\n\
  interpreter_name and interpreter. The previous name allocation leaks and\nso does
  the previous interpreter reference, along with the write denial\nopen_exec() took
  on it. The denial is never released, so the file stays\nunwritable for as long as
  the system runs.\n\nAn unprivileged caller reaches this with a crafted binary and
  repeats it\nat will. binfmt_elf stops at the first PT_INTERP. Do the same here.\n\
  \nThe flaw dates back to the driver's introduction in the pre-git history\ntree
  introduced in v2.6.11 by 91808d6ebe39 (\"[PATCH] FRV: Add FDPIC ELF\nbinary format
  driver\")."
