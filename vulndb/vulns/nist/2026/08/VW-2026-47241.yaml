title: "The tarfile module's tar and data\n extraction filters created directories
  outside the destination for \nmembers whose name leaves the destination and returns
  to it, such as ../evil/../dest/sub/file. The containment check used the resolved
  path, but intermediate directories were created from the name as given.\n\nOnly\n\
  \ empty directories are created outside the destination. Member contents \nare still
  extracted inside it. To return to the destination the member's\n name must contain
  the destination directory's own final component, so \nextraction into a secure randomised
  directory is not affected.\n\nThis affects POSIX platforms only. On Windows, ..
  components are collapsed before the path reaches the filesystem, so the directories
  outside the destination are never created."
