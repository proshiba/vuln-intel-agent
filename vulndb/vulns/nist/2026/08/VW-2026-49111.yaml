title: Dolibarr before 24.0.0 contains an improper authorization vulnerability 
  in the user REST API update endpoint that allows attackers with user-write 
  rights to modify payroll fields by exploiting an incomplete credential 
  denylist that omits payroll columns. Attackers can rewrite salary, bonus, 
  hourly rate, daily rate, and weekly hours for any user without holding payroll
  rights, with the modified values appearing in payroll export reports.
