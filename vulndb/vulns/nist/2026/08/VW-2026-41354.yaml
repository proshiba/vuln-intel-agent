title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix use-after-free freeing trigger private data\n\nCommit 61d445af0a7c (\"tracing:
  Add bulk garbage collection of freeing\nevent_trigger_data\") moved the kfree()
  of event_trigger_data to a kthread\nthat runs tracepoint_synchronize_unregister()
  before freeing. That removed\nthe synchronization the trigger .free callbacks used
  to get implicitly and\ninline from trigger_data_free().\n\nevent_hist_trigger_free(),
  event_hist_trigger_named_free() and\nevent_enable_trigger_free() free their satellite
  data (hist_data, cmd_ops,\nenable_data) right after trigger_data_free() returns.
  With the\nsynchronization now deferred to the kthread, a concurrent tracepoint\n\
  handler can still reach that data through the list_del_rcu()'d trigger,\ncausing
  a use-after-free.\n\nThe histogram teardown must stay synchronous: remove_hist_vars()
  and\nunregister_field_var_hists() have to detach a synthetic event from the\nhistogram
  before the trigger-removal"
