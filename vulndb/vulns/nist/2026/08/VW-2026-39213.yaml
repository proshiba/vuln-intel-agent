title: A security vulnerability has been detected in GL.iNet GL-MT3000 up to 
  4.4.5. Impacted is the function set_upgrade of the file /cgi-bin/glc of the 
  component modem.so. Such manipulation leads to command injection. It is 
  possible to launch the attack remotely. The exploit has been disclosed 
  publicly and may be used. The vendor was contacted early about this disclosure
  and confirmed the existence of the vulnerability.
