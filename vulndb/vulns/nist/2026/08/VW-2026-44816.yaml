title: "In the Linux kernel, the following vulnerability has been resolved:\n\nevm:
  terminate and bound the evm_xattrs read buffer\n\nevm_read_xattrs() allocates size
  + 1 bytes, fills them from the list of\nenabled xattrs, and then passes strlen(temp)
  to\nsimple_read_from_buffer(). When no configured xattrs are enabled, the\nfill
  loop stores nothing and temp[0] remains uninitialized, so strlen()\nreads beyond
  initialized memory.\n\nExplicitly terminate the buffer after allocation, use snprintf()
  for\neach formatted line, and pass the accumulated length, without risk of\ntruncation,
  to simple_read_from_buffer()."
