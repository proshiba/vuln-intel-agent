title: A vulnerability has been found in lmammino oidc-authorizer 0.4.0. This 
  issue affects the function parse_token_from_header of the file 
  src/parse_token_from_header.rs of the component Authorization Header Parsing. 
  The manipulation of the argument authorization_token leads to denial of 
  service. Remote exploitation of the attack is possible. The exploit has been 
  disclosed to the public and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
