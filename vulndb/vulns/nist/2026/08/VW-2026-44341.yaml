title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mm_init:
  fix uninitialized struct pages for ZONE_DEVICE\n\nIf DAX memory is hotplugged into
  an unoccupied subsection of an early\nsection, section_activate() reuses the unoptimized
  boot memmap.  However,\ncompound_nr_pages() still assumes that vmemmap optimization
  is in effect\nand initializes only the reduced number of struct pages.  As a result,
  the\nremaining tail struct pages are left uninitialized, which can later lead\n\
  to unexpected behavior or crashes.\n\nFix this by treating early sections as unoptimized
  when calculating how\nmany struct pages to initialize."
