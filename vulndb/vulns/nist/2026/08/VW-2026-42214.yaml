title: 'Improper privilege management for some Intel(R) PROSet/Wireless WiFi Software
  for Windows within Ring 2: Privileged Process may allow an escalation of privilege.
  Unprivileged software adversary with an unauthenticated user combined with a high
  complexity attack may enable escalation of privilege. This result may potentially
  occur via local access when attack requirements are not present without special
  internal knowledge and requires no user interaction. The potential vulnerability
  may impact the confidentiality (low), integrity (low) and availability (high) of
  the vulnerable system, resulting in subsequent system confidentiality (low), integrity
  (low) and availability (high) impacts.'
