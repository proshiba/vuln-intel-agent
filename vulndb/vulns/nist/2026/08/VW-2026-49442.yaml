title: Nokogiri before 1.11.4 (CRuby implementation only, when the 
  packaged/vendored libxml2 is used) bundles libxml2 2.9.10, which is affected 
  by multiple vulnerabilities addressed in libxml2 2.9.12, including a memory 
  leak in xmlSchemaValidateStream (CVE-2019-20388), a global buffer over-read in
  xmlEncodeEntitiesInternal (CVE-2020-24977), a heap-based buffer overflow 
  (CVE-2021-3517), and an out-of-bounds read (CVE-2021-3518). Processing crafted
  XML documents may lead to denial of service, information disclosure, or memory
  corruption.
