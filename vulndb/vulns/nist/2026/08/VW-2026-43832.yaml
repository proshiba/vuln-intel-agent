title: A vulnerability has been found in Dromara lamp-cloud up to 5.10.0. This 
  affects an unknown part of the file DefGenProjectController.java of the 
  component Code Generator. Such manipulation of the argument 
  outputDir/parent/projectPrefix leads to path traversal. It is possible to 
  launch the attack remotely. The exploit has been disclosed to the public and 
  may be used. The project was informed of the problem early through an issue 
  report but has not responded yet.
