title: RustDesk versions before 1.4.7 contain an uncontrolled speculative memory
  allocation vulnerability in BytesCodec. Before authentication, the decoder 
  trusts the payload length encoded in a four-byte frame header and reserves 
  that amount before receiving the payload. A crafted header can request up to 
  1,073,741,823 bytes of capacity, allowing unauthenticated attackers to use 
  concurrent TCP connections to cause memory exhaustion and denial of service. 
  The fix caps header-triggered speculative preallocation at 256 KiB.
