title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  conntrack: revert ct extension genid infrastructure\n\nThis infrastructure is not
  used anymore after moving ct timeout and\nhelper to use datapath refcount to track
  object use.\n\nRevert commit c56716c69ce1 (\"netfilter: extensions: introduce extension\n\
  genid count\") this patch disables all ct extensions (leading to NULL)\nfor unconfirmed
  conntracks, when this is only targeted at ct helper and\nct timeout. There is also
  codebase that dereferences the ct extension\nwithout checking for NULL which could
  lead to crash."
