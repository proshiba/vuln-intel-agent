title: SeaweedFS is a distributed storage system for files and blobs. In version
  4.39, the filer's TUS resumable-upload handler checks JWT allowed_prefixes 
  scoping only when a session is created, letting a low-privilege tenant hijack 
  another tenant's upload session to write content to filer paths their own 
  token forbids. The HEAD, PATCH, and DELETE verbs that act on an existing 
  session by its id never verify that the session's stored target path falls 
  within the caller's allowed prefixes, so a tenant who obtains another upload's
  session identifier can PATCH attacker bytes into it and, on completion, have 
  the file land at the victim's out-of-scope path. The same token can also 
  DELETE other tenants' sessions and HEAD them to read upload progress and size,
  defeating the JWT prefix isolation. This vulnerability only affects 
  deployments that configure filer JWT signing and have TUS uploads enabled. 
  This issue is fixed in version 4.40.
