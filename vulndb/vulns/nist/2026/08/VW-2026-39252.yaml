title: "The Chat Widget: Floating Customer Support Button for 30+ Channels, Supporting
  SMS, Calls, and Chat  WordPress plugin before 1.8.2 does not validate the type,
  extension, content, or size of files submitted to its public response endpoint and
  stores them under the uploads directory, so an unauthenticated user can upload arbitrary
  files. The original extension is discarded (files are stored under a bare UUID),
  so this does not yield code execution or stored XSS; impact is bounded to disk consumption
  and content hosting. The storing path requires the channel's response storage or
  mail-forwarding to be configured."
