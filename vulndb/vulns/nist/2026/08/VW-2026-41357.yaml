title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrop_monitor:
  perform u64_stats updates under IRQ-disabled section\n\nIn net_dm_packet_trace_kfree_skb_hit()
  and net_dm_hw_trap_packet_probe(),\nu64_stats_update_begin() / u64_stats_inc() /
  u64_stats_update_end() were\ncalled after spin_unlock_irqrestore(&...drop_queue.lock,
  flags), when local\nIRQs had already been re-enabled.\n\nTracepoint probes can execute
  in IRQ or softirq context. On 32-bit\narchitectures, u64_stats_update_begin() disables
  preemption but not interrupts,\nrelying on seqcount writes. If a nested interrupt
  occurs on the same CPU during\nthe 64-bit stats update, the reentrant seqcount update
  can corrupt the\nseqcount state or stats value.\n\nFix this by performing the 64-bit
  per-CPU stats update before releasing\ndrop_queue.lock via spin_unlock_irqrestore(),
  ensuring local interrupts remain\ndisabled during the u64_stats update."
