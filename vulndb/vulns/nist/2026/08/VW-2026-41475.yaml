title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: use wiphy work for socket owner autodisconnect\n\nnl80211_netlink_notify()
  walks the cfg80211 wireless device list when a\nNETLINK_GENERIC socket is released.
  If the socket owns a connection, the\nnotifier queues the embedded wdev->disconnect_wk
  work item.\n\nThat work is a plain work_struct today. NETDEV_GOING_DOWN cancels
  it, but a\nNETLINK_URELEASE notifier that already observed conn_owner_nlportid can\n\
  queue it after that cancel returns. _cfg80211_unregister_wdev() then\nremoves the
  wdev from the list and waits for RCU readers, but\nsynchronize_net() does not drain
  work queued by such a reader.\n\nMake the autodisconnect work a wiphy_work instead.
  The callback already\nneeds the wiphy mutex, and wiphy_work runs under that mutex.
  This lets\nteardown cancel pending autodisconnect work while holding the mutex,\n\
  without a cancel_work_sync() vs. worker locking concern.\n\nAlso cancel the wiphy
  work after list_del_rcu() "
