title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_route: fix fastmap use-after-free on filter\n\nThe route4 classifier maintains
  a 16-slot fastmap cache that stores raw\nstruct route4_filter pointers indexed by
  (id, iif). The reader\n(route4_classify) populates this cache via route4_set_fastmap()
  for every\nclassified packet that hits a filter. The writer (route4_delete,\nroute4_change)
  clears the cache via route4_reset_fastmap() before\nRCU-deferred kfree of the filter.\n\
  \nThis creates a UAF race:\n 1. Reader walks the RCU-protected bucket chain, finds
  filter f\n 2. Writer unlinks f, calls route4_reset_fastmap(), then tcf_queue_work()\n\
  \ 3. Reader calls route4_set_fastmap() and writes f into the cache\n    *after*
  the writer's reset, caching a pointer about to be freed\n 4. After the RCU grace
  period, kfree(f) executes\n 5. Next classified packet on the same (id, iif) tuple
  hits the stale\n    fastmap entry and reads f->res from freed memory\n\nReproduced
  with an mdelay"
