title: 'Vulnerability in the PeopleSoft Enterprise PeopleTools product of Oracle PeopleSoft
  (component: Data Mover).  Supported versions that are affected are 8.61-8.63. Difficult
  to exploit vulnerability allows high privileged attacker with logon to the infrastructure
  where PeopleSoft Enterprise PeopleTools executes to compromise PeopleSoft Enterprise
  PeopleTools.  Successful attacks require human interaction from a person other than
  the attacker and while the vulnerability is in PeopleSoft Enterprise PeopleTools,
  attacks may significantly impact additional products (scope change). Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all PeopleSoft Enterprise PeopleTools accessible
  data as well as  unauthorized access to critical data or complete access to all
  PeopleSoft Enterprise PeopleTools accessible data and unauthorized ability to cause
  a partial denial of service (partial DOS) of PeopleSoft Enterprise PeopleT'
