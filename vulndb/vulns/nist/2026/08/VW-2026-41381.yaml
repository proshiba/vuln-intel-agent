title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7915: guard HE capability lookups\n\nmt7915_mcu_bss_he_tlv() and mt7915_mcu_sta_bfer_tlv()
  both run after\nchecking HE support, then dereference the HE PHY capability returned
  by\nmt76_connac_get_he_phy_cap(). That helper can return NULL when no\ncapability
  entry matches the vif type.\n\nFetch the capability before appending the TLV and
  skip the HE-specific\nsetup when no matching capability is available."
