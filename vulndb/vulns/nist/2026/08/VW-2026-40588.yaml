title: "Tobit Laboratories AG TeamDavid's Webbox application is vulnerable to arbitrary
  file write, allowing an \nunauthenticated attacker to create or write into existing
  files on the \nserver with attacker-controlled content. This is possible because
  user \ninput is written directly to files without proper validation or \nrestriction
  on file types. As a result, an attacker can create files \n(e.g., .htm), containing
  malicious JavaScript code. When a user accesses\n a file created in this way, stored
  cross-site scripting is triggered. This issue affects TeamDavid through Rollout
  524."
