title: SiYuan before v3.7.4 fails to validate the packageName parameter in 
  Bazaar install and uninstall endpoints, allowing authenticated administrators 
  to perform path traversal via directory traversal sequences. Attackers with 
  admin access can write arbitrary files to any location via install operations 
  or recursively delete directories via uninstall operations by supplying 
  crafted packageName values.
