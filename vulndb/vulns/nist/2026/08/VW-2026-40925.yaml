title: A vulnerability was found in dresende node-sql-query 
  0.1.25/0.1.26/0.1.27/0.1.28. Affected by this vulnerability is the function 
  SelectQuery.from/SelectQuery.build in the library lib/Select.js of the 
  component Request Parameter Handler. Performing a manipulation results in sql 
  injection. It is possible to initiate the attack remotely. The exploit has 
  been made public and could be used. Upgrading to version 0.1.29 addresses this
  issue. The patch is named 3414c42f6de89826fa1f5f36f6139d1e6552778e. Upgrading 
  the affected component is recommended.
