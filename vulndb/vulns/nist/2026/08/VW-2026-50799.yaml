title: A security flaw has been discovered in AlexGladkov claude-in-mobile 
  3.10.2. This affects the function execSync of the file src/adb/client.ts. 
  Performing a manipulation results in os command injection. The attack requires
  a local approach. The exploit has been released to the public and may be used 
  for attacks. Upgrading to version 3.10.3 is able to mitigate this issue. The 
  patch is named a86d9e55694c98a122943eeff859461d0b9aa6d6. It is suggested to 
  upgrade the affected component.
