title: "The Bluetooth HCI driver for Bouffalo Lab on-chip BLE controllers (BL60x/BL70x/BL61x),
  bt_bflb_send() in drivers/bluetooth/hci/hci_bflb.c, violates the bt_hci_driver_api.send()
  buffer-ownership contract. That contract (documented at include/zephyr/drivers/bluetooth.h)
  requires the buffer reference to be consumed only on success; on error the caller
  still owns the reference and unrefs it. The driver instead routed all error paths
  through a shared label that unconditionally called net_buf_unref(buf) before returning
  the error code, consuming the buffer on failure as well.\n\nWhen send() returns
  an error, the host TX path (send_buf() in subsys/bluetooth/host/conn.c) unrefs the
  same buffer again, believing it still owns it. This double-unref over-decrements
  the net_buf reference count. Because the buffer is a TX fragment whose destroy callback
  also decrements its still-queued parent buffer, the parent is freed prematurely
  while reachable on the connection TX queue, producing a use-after-free"
