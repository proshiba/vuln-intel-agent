  Tomcat when creating unix domain sockets allows an unauthorised local user to access
  the unix domain socket.\n\n\n\nThis issue affects Apache Tomcat: from 11.0.0-M1
  through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.42 through 9.0.120.\n\n\
  \n\nUsers are recommended to upgrade to version 11.0.25, 10.1.58, 9.0.121, which
  fixes the issue."
