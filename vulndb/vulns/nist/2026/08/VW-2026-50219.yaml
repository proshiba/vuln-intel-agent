title: "The IEEE 1588 PTP management-message parser in subsys/net/lib/ptp/tlv.c mishandles
  the PTP_MGMT_TIME management id. In tlv_mgmt_post_recv(), the PTP_MGMT_TIME case
  casts mgmt_tlv->data to a 10-byte struct ptp_timestamp and reads it (then byte-swaps
  and writes it back) without first checking that the TLV data field is at least sizeof(struct
  ptp_timestamp). Every sibling management id in the same switch validates its length
  first; PTP_MGMT_TIME was the only case lacking that check.\n\nThe length passed
  in is the management data size (tlv->length - 2), and the upstream guard in ptp_tlv_post_recv()
  only requires tlv->length > 2, while msg_tlv_post_recv() validates only that the
  TLV fits within the received byte count, not a per-id minimum. A peer on the local
  PTP segment can therefore send a PTP_MSG_MANAGEMENT message carrying a short PTP_MGMT_TIME
  TLV (data as small as 2 bytes), causing the parser to read and write 8 bytes beyond
