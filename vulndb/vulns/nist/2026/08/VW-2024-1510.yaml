title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  ensure skb entering GRO are not cloned.\n\nAfter commit d3256efd8e8b (\"veth: allow
  enabling NAPI even without XDP\"),\nif GRO is enabled on a veth device and TSO is
  disabled on the peer\ndevice, TCP skbs will go through the NAPI callback. If there
  is no XDP\nprogram attached, the veth code does not perform any share check, and\n\
  shared/cloned skbs could enter the GRO engine.\n\nIgnat reported a BUG triggered
  later-on due to the above condition:\n\n[   53.970529][    C1] kernel BUG at net/core/skbuff.c:3574!\n\
  [   53.981755][    C1] invalid opcode: 0000 [#1] PREEMPT SMP KASAN PTI\n[   53.982634][\
  \    C1] CPU: 1 PID: 19 Comm: ksoftirqd/1 Not tainted 5.16.0-rc5+ #25\n[   53.982634][\
  \    C1] Hardware name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS 0.0.0 02/06/2015\n\
  [   53.982634][    C1] RIP: 0010:skb_shift+0x13ef/0x23b0\n[   53.982634][    C1]
  Code: ea 03 0f b6 04 02 48 89 fa 83 e2 07 38 d0\n7f 08 84 c0 0f 85 41 0c 00 00 41
  80 7f 02 00"
