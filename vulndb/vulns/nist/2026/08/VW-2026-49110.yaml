title: Dolibarr before 24.0.0 contains a broken object-level authorization 
  vulnerability in the REST API company bank account write routes that allows 
  authenticated attackers with third-party creation rights to create, replace, 
  or delete bank account details of any company without requiring read access to
  that company. Attackers can inject attacker-controlled IBANs as creditor 
  accounts, which are then written into regenerated SEPA credit-transfer files, 
  redirecting outgoing payments to attacker-controlled accounts.
