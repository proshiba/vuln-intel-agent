title: NLTK before 3.10.3 contains a regular expression denial of service 
  (ReDoS) vulnerability in the tgrep module. The _tgrep_node_action function 
  compiles user-supplied regular expressions embedded in /regex/ pattern nodes 
  and executes them via re.search against tree node labels without any 
  validation or timeout. An attacker who controls the tgrep pattern (e.g., via 
  tgrep_positions() or tgrep_compile() exposed to external input) can supply a 
  pattern that triggers catastrophic backtracking, causing indefinite CPU 
  saturation that blocks the Python process.
