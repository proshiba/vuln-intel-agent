title: "Catalyst::Plugin::Static::Simple versions through 0.38 for Perl mark responses
  as publicly cacheable.\n\nThe _serve_static method always sets the Cache-Control
  header to \"public\", with no means of overriding it.  This advises proxies that
  the content may be stored in a shared cache, and may be reused in responses to requests
  from other users. (This includes requests with an Authorization header.)\n\nConfiguring
  the expires time to \"0\" to disable caching, as documented, is ignored."
