title: Telenia Software TVox 26.5.3 and prior 26.x versions, and 24.9.21 and 
  prior 24.x versions, contain an OS command injection vulnerability in 
  action_audio.php that allows authenticated attackers to execute arbitrary 
  operating system commands by passing an unsanitized pid parameter into an 
  exec() call when the action parameter is set to checkProcess. Attackers can 
  inject malicious OS commands through the pid request parameter to execute 
  arbitrary commands with the privileges of the apache user.
