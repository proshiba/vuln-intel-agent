title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv/mm:
  use physical alignment for vmemmap_start_pfn\n\nRISC-V computes vmemmap_start_pfn
  by rounding phys_ram_base down to\nVMEMMAP_ADDR_ALIGN.  That alignment must therefore
  be expressed in the\nphysical-address domain.\n\nCommit 476849b0fba4 (\"riscv/mm:
  align vmemmap to maximal folio size\")\nattempted to account for the maximal folio
  alignment by feeding\nMAX_FOLIO_VMEMMAP_ALIGN directly into VMEMMAP_ADDR_ALIGN.\
  \  However,\nMAX_FOLIO_VMEMMAP_ALIGN is measured in bytes of struct page storage,\n\
  whereas VMEMMAP_ADDR_ALIGN is used to align a physical address.\n\nThe mask-based
  compound_info encoding requires pfn_to_page(0) to be\nnaturally aligned to MAX_FOLIO_VMEMMAP_ALIGN.\
  \  Commit 9f94db4c7eaa\n(\"mm/sparse: check memmap alignment for compound_info_has_mask()\"\
  ) added a\ncheck for that requirement and exposed the unit mismatch on systems such\n\
  as QEMU virt, where the DRAM base is not aligned to MAX_FOLIO_NR_PAGES *\nPAGE_SIZE.\n\
