title: "Incorrect Authorization vulnerability in the OAuth token endpoint in hexpm
  hexpm allows an API key holding the repositories permission to read another organization's
  private packages.\n\nWhen an API key is exchanged for a token through the OAuth
  client_credentials grant, validate_scopes_against_key/2 in lib/hexpm_web/controllers/api/oauth_controller.ex
  admits a requested scope whenever the key carries the repositories permission and
  the scope string begins with repository:. The organization name is never resolved
  against the principal, and expand_repositories_scope/3 only rewrites the literal
  repositories scope, so an explicit repository:<name> passes through untouched. Both
  CDN edges authorize repository access from the token claim without querying the
  database, so the minted token is read access to that organization's private packages
  until it expires.\n\nThis issue affects hex.pm: from 2025-10-18 before 2026-08-24."
