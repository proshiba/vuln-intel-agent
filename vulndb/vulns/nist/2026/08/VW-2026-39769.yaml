title: "The render-template component of ember-dynamic-render-template (addon/components/render-template.js)
  passes its `templateString` property directly into Ember/Glimmer's compileTemplate()
  (from @ember/template-compilation) with no sanitization, allow-listing, or validation
  of the input. Because compileTemplate() dynamically compiles and renders the supplied
  string as a live Handlebars/Glimmer template, any application that renders attacker-influenced
  data through this component's templateString property is exposed to client-side
  template injection: an attacker-controlled Handlebars expression is compiled and
  executed in the context of the rendering component, which can be leveraged for cross-site
  scripting depending on what helpers/context are exposed to the compiled template."
