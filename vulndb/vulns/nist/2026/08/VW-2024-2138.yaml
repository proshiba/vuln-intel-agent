title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix too early release of tcx_entry\n\nPedro Pinto and later independently also Hyunwoo
  Kim and Wongi Lee reported\nan issue that the tcx_entry can be released too early
  leading to a use\nafter free (UAF) when an active old-style ingress or clsact qdisc
  with a\nshared tc block is later replaced by another ingress or clsact instance.\n\
  \nEssentially, the sequence to trigger the UAF (one example) can be as follows:\n\
  \n  1. A network namespace is created\n  2. An ingress qdisc is created. This allocates
  a tcx_entry, and\n     &tcx_entry->miniq is stored in the qdisc's miniqp->p_miniq.
  At the\n     same time, a tcf block with index 1 is created.\n  3. chain0 is attached
  to the tcf block. chain0 must be connected to\n     the block linked to the ingress
  qdisc to later reach the function\n     tcf_chain0_head_change_cb_del() which triggers
  the UAF.\n  4. Create and graft a clsact qdisc. This causes the ingress qdisc\n\
  \     created in step"
