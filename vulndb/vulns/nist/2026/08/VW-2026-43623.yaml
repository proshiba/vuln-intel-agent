title: rsync 3.2.5 before 3.5.0 contains a heap out-of-bounds write 
  vulnerability that allows remote unauthenticated attackers to write one 
  attacker-controlled byte past the end of a heap allocation by supplying a 
  crafted files-from entry. Attackers can trigger the vulnerability against a 
  read-only rsync daemon module by providing a files-from entry containing both 
  an interior and trailing backslash, causing the add_implied_include() function
  to under-count the trailing backslash when sizing the destination buffer.
