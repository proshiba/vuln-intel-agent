title: SQL injection vulnerability in the ‘/ws/apiprensa/getVideoSubcanal’ 
  endpoint due to improper handling of the id_video parameter. The application 
  does not sanitize input before constructing SQL queries, which results in 
  execution errors when malicious input is provided. The vulnerability exposes 
  internal file paths and complete stack traces through the Slim framework’s 
  error handler, which increases the severity due to the combination of 
  information disclosure and SQL injection.
