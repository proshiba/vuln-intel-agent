title: A stored SQL injection vulnerability in Koha through 24.11.17, 25.05.12, 
  25.11.06, and 26.05.01 allows authenticated staff with the tools => 
  items_batchmod permission to read arbitrary database contents by storing a SQL
  payload in the agefield value of an automatic item modification rule. The 
  agefield value is stored verbatim to the system preference and later 
  interpolated without parameterization into a SQL query in 
  C4::Items::ToggleNewStatus (line 1228) when the scheduled cron job executes. 
  The injection is SELECT-only under standard MariaDB/MySQL DBI single-statement
  execution; a time-based SLEEP payload is also achievable via the cron trigger.
  An attacker can read the entire Koha database including patron PII and staff 
  bcrypt password hashes.
