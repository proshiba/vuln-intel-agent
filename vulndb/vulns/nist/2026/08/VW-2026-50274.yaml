title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio_ccw:
  Ensure first IDAW remains constant\n\nThe first IDAW in a list does not need to
  be on a 2K/4K boundary\nlike all others, and so is read separately to accurately
  calculate\nthe size of the buffer needed to read the full IDAL.\n\nVerify that the
  address found in the first IDAW is unchanged between\nreads, to ensure a consistent
  set of IDAWs being worked with."
