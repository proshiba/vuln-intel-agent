title: A missing authentication vulnerability in frangoteam/FUXA through 1.3.3 
  allows an unauthenticated remote attacker to query all historical sensor data 
  via the DAQ_QUERY Socket.IO event. When secureEnabled=true, all other 
  sensitive Socket.IO events (DEVICE_BROWSE, HOST_INTERFACES, 
  DEVICE_TAGS_REQUEST, etc.) call isSocketAdminAuthorized to verify the 
  connection token, but the DAQ_QUERY handler in server/runtime/index.js lacks 
  this check entirely.
