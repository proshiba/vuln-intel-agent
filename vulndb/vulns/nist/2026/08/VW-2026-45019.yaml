title: A vulnerability was found in VictoriaMetrics up to 1.146.0. Impacted is 
  the function requestHandler of the file app/vmauth/main.go of the component 
  VMAuth Authentication Endpoint. Performing a manipulation results in improper 
  restriction of excessive authentication attempts. The attack is possible to be
  carried out remotely. The complexity of an attack is rather high. The 
  exploitability is considered difficult. The exploit has been made public and 
  could be used. Upgrading to version 1.147.0 is recommended to address this 
  issue. The patch is named 119ba0fb5be8024d50c5ba946599b2e69e8803ea. Upgrading 
  the affected component is recommended.
