title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - fix out-of-bounds read in ims_pcu_irq() debug logging\n\nThe debug logging
  in ims_pcu_irq() unconditionally prints data from\npcu->urb_in_buf. However, if
  the interrupt fired for pcu->urb_ctrl, the\nactual data resides in pcu->urb_ctrl_buf.
  If urb->actual_length for the\ncontrol URB exceeds pcu->max_in_size, this leads
  to an out-of-bounds\nread.\n\nFix this by printing from the correct buffer associated
  with the URB."
