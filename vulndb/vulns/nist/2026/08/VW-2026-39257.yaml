title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrhashtable:
  clear stale iter->p on table restart\n\nrhashtable_walk_start_check() has two restart
  paths when resuming a walk.\nWhen iter->walker.tbl is valid, it re-validates iter->p
  against the table\nand sets iter->p = NULL if the object is gone.  When iter->walker.tbl
  is\nNULL (table was freed during resize), it resets slot and skip but forgets\n\
  to clear iter->p.\n\nrhashtable_walk_next() then dereferences the stale iter->p,
  reading\nfreed memory.  This is a use-after-free.\n\nAny caller that does multi-fragment
  rhashtable walks across\nwalk_stop/walk_start boundaries is affected.  Concrete
  cases include\nnetlink_diag (__netlink_diag_dump in net/netlink/diag.c) and TIPC\n\
  (tipc_nl_sk_walk in net/tipc/socket.c).\n\nCrash stack (netlink_diag):\n  BUG: KASAN:
  slab-use-after-free in rhashtable_walk_next+0x365/0x3c0\n  Read of size 8 at addr
  ffff88801a9d2438 (freed kmalloc-2k, offset 1080)\n  Call Trace:\n   rhashtable_walk_next+0x365/0x3c0"
