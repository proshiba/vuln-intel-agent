title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix aperture mapping leak\n\namdgpu_pci_remove() calls drm_dev_unplug() before invoking
  the driver\nfini routines. This causes drm_dev_enter() in amdgpu_ttm_fini() to\n\
  always return false, so iounmap(aper_base_kaddr) never runs on normal\ndriver unload,
  leaving an orphaned entry in the x86 PAT interval tree.\n\nOn connected_to_cpu hardware,
  the aperture is mapped write-back (WB) via\nioremap_cache(). On reload, IP discovery
  calls memremap(..., MEMREMAP_WC)\nover the same range. The WC vs WB conflict causes:\n\
  \n  ioremap error for 0x..., requested 0x1, got 0x0\n  amdgpu: discovery failed:
  -2\n\nFix by switching to devres-managed mappings so cleanup is guaranteed\nregardless
  of drm_dev_enter() state:\n\n- connected_to_cpu path: devm_memremap(MEMREMAP_WB).
  For\n  IORESOURCE_SYSTEM_RAM ranges this takes the try_ram_remap() shortcut,\n \
  \ returning __va(offset) from the existing kernel direct map. No new\n  ioremap
  VA or PAT entry i"
