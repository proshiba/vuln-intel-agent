title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoc:
  aspeed: lpc-snoop: Fix usercopy overflow in snoop_file_read\n\nput_fifo_with_discard()
  acts as both producer and consumer on the kfifo:\nit calls kfifo_skip() (advances
  out) and kfifo_put() (advances in) from\nthe IRQ handler without synchronizing with
  snoop_file_read(), which also\nconsumes via kfifo_to_user(). On SMP systems this
  concurrent access can\nleave (in - out) larger than the ring buffer, so __kfifo_to_user()'s
  clamp\nto (in - out) is ineffective and kfifo_copy_to_user() can attempt a\ncopy_to_user()
  past the kmalloc-2k backing store:\n\n  usercopy: Kernel memory exposure attempt
  detected from SLUB object\n  'kmalloc-2k' (offset 0, size 2049)!\n  kernel BUG at
  mm/usercopy.c!\n  Call trace:\n   usercopy_abort\n   __check_heap_object\n   __check_object_size\n\
  \   kfifo_copy_to_user\n   __kfifo_to_user\n   snoop_file_read\n   vfs_read\n\n\
  Serialize kfifo access with a per-channel spinlock shared between the\nIRQ handler
  (producer)"
