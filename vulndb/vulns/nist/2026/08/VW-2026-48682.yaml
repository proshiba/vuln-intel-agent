title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  Fix fib_nlmsg_size() for RTA_VIA nexthops\n\nfib_nlmsg_size() still estimates nexthop
  space as if every gateway is\nencoded as an IPv4 RTA_GATEWAY attribute. IPv4 routes
  can also carry an\nIPv6 gateway, which fib_nexthop_info() dumps as RTA_VIA.\n\n\
  As a result, route notifications can allocate an skb that is too small.\nfib_dump_info()
  then fails with -EMSGSIZE and rtmsg_fib() hits the\nWARN_ON() that marks such failures
  as a fib_nlmsg_size() bug. With\npanic_on_warn set, this becomes a kernel panic.\n\
  \nMirror the actual nexthop dump layout in fib_nlmsg_size(): account for\nIPv6 nexthop
  gateways dumped as RTA_VIA, for the no-header rtnexthop\nlayout used inside RTA_MULTIPATH,
  and for RTA_FLOW only when it is\nactually present."
