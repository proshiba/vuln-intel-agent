  Supply the overflow slot size in BPOS, not the whole bin BO size\n\nvc4_overflow_mem_work()
  points BPOA at a 512KB slot inside the 16MB\nbinner BO, but writes the size of the
  whole BO to BPOS. On every binner\nout-of-memory event the PTB is therefore authorized
  to write tile lists\nacross all the other slots (which may hold the tile state,
  tile alloc and\noverflow memory of in-flight jobs) and, for any slot but the first,
