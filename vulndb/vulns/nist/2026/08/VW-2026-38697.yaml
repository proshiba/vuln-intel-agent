title: "Zephyr's Bluetooth host declares a GATT characteristic as two consecutive
  attributes: a Characteristic Declaration whose permission is hard-coded to BT_GATT_PERM_READ,
  and a Characteristic Value attribute that carries the application-specified security
  permissions (e.g. BT_GATT_PERM_READ_ENCRYPT / READ_AUTHEN / READ_LESC). The public
  notify and indicate APIs explicitly accept either attribute, and passing the declaration
  is the documented, common idiom. Before sending each notification or indication,
  the host re-checks link security with bt_gatt_check_perm() against params->attr
  in gatt_notify(), gatt_indicate(), and gatt_notify_multiple_verify_params() (subsys/bluetooth/host/gatt.c).\n\
  \nWhen the application passed the Characteristic Declaration attribute, the host
  correctly redirected the value handle but left params->attr pointing at the declaration,
  so the security check evaluated the declaration's permissions (no security required)
