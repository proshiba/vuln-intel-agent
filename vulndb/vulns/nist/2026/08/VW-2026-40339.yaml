title: "The Class Mediator fails to correctly validate or sanitize `messageContext`
  properties when they are used to populate dynamic values. This allows authenticated
  users to potentially access or modify data across different system invocations that
  should be isolated.\n\nThis weakness can lead to the disclosure of sensitive information
  belonging to other users or the unintended modification of system data by authenticated
  users. The exact impact depends on how `messageContext` properties are utilized
  within the affected WSO2 products."
