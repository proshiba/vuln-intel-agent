title: "In the Linux kernel, the following vulnerability has been resolved:\n\niov_iter:
  fix copy_page_from_iter_atomic() if KMAP_LOCAL_FORCE_MAP\n\ngeneric/077 on x86_32
  CONFIG_DEBUG_KMAP_LOCAL_FORCE_MAP=y with highmem,\non huge=always tmpfs, issues
  a warning and then hangs (interruptibly):\n\nWARNING: CPU: 5 PID: 3517 at mm/highmem.c:622
  kunmap_local_indexed+0x62/0xc9\nCPU: 5 UID: 0 PID: 3517 Comm: cp Not tainted 6.12.0-rc4
  #2\n...\ncopy_page_from_iter_atomic+0xa6/0x5ec\ngeneric_perform_write+0xf6/0x1b4\n\
  shmem_file_write_iter+0x54/0x67\n\nFix copy_page_from_iter_atomic() by limiting
  it in that case\n(include/linux/skbuff.h skb_frag_must_loop() does similar).\n\n\
  But going forward, perhaps CONFIG_DEBUG_KMAP_LOCAL_FORCE_MAP is too\nsurprising,
  has outlived its usefulness, and should just be removed?"
