title: The extension passes the raw value of a form field configured as "This 
  field contains the name of the sender" directly into a Fluid View as template 
  source, without any sanitization, and renders it. An anonymous, 
  unauthenticated user can submit Fluid template syntax in that field to execute
  arbitrary Fluid ViewHelpers leading to disclosure of server configuration, 
  environment variables and application source, and potentially remote code 
  execution. Exploitation requires only that a form field is configured as the 
  sender_name field, a common and default-adjacent Powermail configuration. No 
  authentication or user interaction beyond a normal form submission is 
  required. This vulnerability is reported to be actively exploited in the wild.
