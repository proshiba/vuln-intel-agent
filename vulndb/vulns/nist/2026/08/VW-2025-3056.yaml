title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  Revert \"scsi: core: Do not increase scsi_device's iorequest_cnt if dispatch failed\"\
  \n\nThe \"atomic_inc(&cmd->device->iorequest_cnt)\" in scsi_queue_rq() would\ncause
  kernel panic because cmd->device may be freed after returning from\nscsi_dispatch_cmd().\n\
  \nThis reverts commit cfee29ffb45b1c9798011b19d454637d1b0fe87d."
