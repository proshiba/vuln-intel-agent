title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, Dokploy passes user-controlled values directly into shell commands 
  via unquoted template literal interpolation in the registry credential testing
  and Docker Swarm cluster management endbpoints. Both endpoints have a safe 
  local code path (using execFileAsync or the Docker API) but a vulnerable 
  remote path (using execAsyncRemote which runs the shell string via SSH). This 
  vulnerability is fixed in 0.29.13.
