title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/iucv:
  take a reference on the socket found in afiucv_hs_rcv()\n\nafiucv_hs_rcv() looks
  up the destination socket under iucv_sk_list.lock,\ndrops the lock, and then passes
  the socket to the afiucv_hs_callback_*()\nhandlers without holding a reference.
  AF_IUCV sockets are not\nRCU-protected and are freed synchronously by iucv_sock_kill()
  ->\nsock_put(), so a concurrent close can free the socket in the window\nbetween
  read_unlock() and the handler, which then dereferences freed\nmemory (for example
  sk->sk_data_ready() in afiucv_hs_callback_syn()).\n\nTake a reference with sock_hold()
  while the socket is still on the list\nand release it with sock_put() once the handler
  has run."
