title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  hsr: fix memory leak on slave unregistration by removing synced VLANs\n\nWhen an
  HSR master device is brought UP, it auto-adds VLAN 0 via\nvlan_vid0_add(), which
  propagates VID 0 to its slave devices (slave A and B).\n\nIf a slave device is later
  unregistered while HSR is active (e.g., during\nnetns cleanup or interface destruction),
  hsr_del_port() is called to\ndetach the slave port from the HSR master. However,
  hsr_del_port() currently\ndoes not delete the VLAN IDs that were synced to the slave
  device by HSR.\n\nAs a result, the slave device retains a refcount on VID 0 (and
  any other\nsynced VLANs). When the slave device is destroyed, its vlan_info /\n\
  vlan_vid_info structure remains allocated, leading to a memory leak.\n\nFix this
  by calling vlan_vids_del_by_dev(port->dev, master->dev) in\nhsr_del_port() before
  unlinking slave A or slave B ports, matching the\npropagation logic in hsr_ndo_vlan_rx_add_vid()
  / hsr_ndo_vlan_rx_ki"
