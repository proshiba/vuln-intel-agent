title: llama.cpp builds b1886 through b7445 contain a double free vulnerability 
  in the LLaMA-Android JNI wrapper where new_1batch() allocates memory using 
  malloc() while free_1batch() deallocates it using the C++ delete operator, 
  causing heap metadata corruption. Attackers can trigger this memory management
  mismatch to cause denial of service through process crashes or potentially 
  achieve arbitrary code execution depending on allocator state.
