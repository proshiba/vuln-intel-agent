title: A flaw was found in the keycloak-services component of Keycloak, which is
  used for managing authentication and authorization flows. The issue occurs 
  when a realm administrator configures client policies to enforce specific 
  authentication requirements on confidential clients. Due to improper 
  evaluation of the client state during an update operation, an attacker with 
  client management permissions can bypass these security policies by first 
  creating a public client and then updating it to a confidential client with 
  weaker authentication. This can result in the persistence of clients that do 
  not comply with the intended security hardening of the realm.
