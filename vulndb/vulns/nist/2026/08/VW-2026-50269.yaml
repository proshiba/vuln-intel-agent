title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Improve CCA CPRB length and overflow checks\n\nThe xcrb_msg_to_type6cprb_msgx()
  function lacks proper input\nvalidation, creating security vulnerabilities:\n1.
  Integer overflow after CEIL4 alignment: Signed int variables could\n   overflow
  during 4-byte boundary alignment, causing undersized\n   buffer allocations or incorrect
  bounds checking.\n2. Missing minimum size validation: The CPRBX structure is copied
  from\n   userspace without verifying sufficient buffer length. Undersized\n   buffers
  cause uninitialized memory access when reading structure\n   fields like cprbx.cprb_len
  and cprbx.domain.\n3. Arithmetic overflow in sum calculations: Adding control block
  and\n   data block sizes could overflow, bypassing size checks and enabling\n  \
  \ buffer overflows.\n\nFix by using size_t for length calculations, adding U32_MAX
  boundary\nchecks after alignment, validating minimum control block size before\n\
  copying from userspace,"
