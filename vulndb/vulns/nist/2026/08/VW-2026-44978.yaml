title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrtase:
  fix double free of multi-frag skb on DMA map failure\n\nIn rtase_start_xmit(), when
  the head buffer DMA mapping fails after\nrtase_xmit_frags() has mapped all fragments,
  the error path clears\nthe fragment descriptors with rtase_tx_clear_range(), which
  frees\nthe skb through the last-frag slot and accounts tx_dropped. Control\nthen
  falls through to the common error label, which frees the same\nskb a second time
  and counts it again.\n\nReturn right after clearing the fragments when the skb owns
  frags;\nthe no-frag case still drops through and frees the head skb once."
