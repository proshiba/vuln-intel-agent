title: A vulnerability was identified in diem-project diem up to 5.1.3. The 
  affected element is the function executeCommand of the file 
  dmAdminPlugin/modules/dmConsole/actions/actions.class.php of the component 
  Administrative Console. Such manipulation of the argument dm_command leads to 
  os command injection. The attack can be launched remotely. The exploit is 
  publicly available and might be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
