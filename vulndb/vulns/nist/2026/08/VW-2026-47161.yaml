title: stigmem versions before 0.9.0a12 contain a broken object level 
  authorization vulnerability in the decay sweep endpoint that allows 
  authenticated attackers with write credentials for one tenant to execute decay
  operations affecting all tenants. Attackers can submit POST requests to the 
  decay sweep endpoint with ttl_seconds=0 to expire facts across all tenants, or
  use dry_run to obtain cross-tenant fact counts and existence information.
