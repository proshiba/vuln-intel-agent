title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  conntrack: fix wrong ct->timeout value\n\n(struct nf_conn)->timeout is an interval
  before the conntrack\nconfirmed.  After confirmed, it becomes a timestamp.\n\nIt
  is observed that timeout of an unconfirmed conntrack:\n- Set by calling ctnetlink_change_timeout().
  As a result,\n  `nfct_time_stamp` was wrongly added to `ct->timeout` twice.\n- Get
  by calling ctnetlink_dump_timeout(). As a result,\n  `nfct_time_stamp` was wrongly
  subtracted.\n\nCall Trace:\n <TASK>\n dump_stack_lvl\n ctnetlink_dump_timeout\n\
  \ __ctnetlink_glue_build\n ctnetlink_glue_build\n __nfqnl_enqueue_packet\n nf_queue\n\
  \ nf_hook_slow\n ip_mc_output\n ? __pfx_ip_finish_output\n ip_send_skb\n ? __pfx_dst_output\n\
  \ udp_send_skb\n udp_sendmsg\n ? __pfx_ip_generic_getfrag\n sock_sendmsg\n\nSeparate
  the 2 cases in:\n- Setting `ct->timeout` in __nf_ct_set_timeout().\n- Getting `ct->timeout`
  in ctnetlink_dump_timeout().\n\nPablo appends:\n\nUpdate ctnetlink to set up the
  timeout _afte"
