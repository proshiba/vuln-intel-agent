title: Notepad++ is a free and open-source source code editor. Prior to 8.9.7, 
  macros loaded from an attacker-controlled shortcuts.xml bypass the HMAC 
  validation applied to UserDefinedCommands and can invoke Scintilla actions and
  the internal Open in Default Viewer command in an elevated Notepad++ process, 
  allowing protected file modification and conditional elevated command 
  execution when a local attacker influences settingsDir and a user triggers the
  macro. This issue is fixed in version 8.9.7.
