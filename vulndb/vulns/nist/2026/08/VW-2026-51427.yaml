title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf
  sched: Fix register_pid() overflow, strcpy, and BUG_ON\n\nregister_pid() has several
  issues when processing untrusted perf.data:\n\n1. Integer overflow: (pid + 1) *
  sizeof(struct task_desc *) can wrap\n   to a small value on 32-bit systems when
  pid is large (e.g.\n   0x40000000), causing realloc to return a tiny buffer followed
  by\n   out-of-bounds writes in the initialization loop.\n\n2. Heap buffer overflow:
  strcpy(task->comm, comm) copies the\n   untrusted comm string into a fixed 20-byte
  COMM_LEN buffer with\n   no length check.\n\n3. BUG_ON on allocation failure: perf.data
  is untrusted input, so\n   allocation failures should be handled gracefully rather
  than\n   killing the process.\n\n4. Realloc of sched->tasks assigned directly back,
  leaking the old\n   pointer on failure; nr_tasks incremented before the realloc,\n\
  \   leaving corrupted state on failure.\n\nCap pid at PID_MAX_LIMIT (4194304, matching
  the kernel's maximum\non 64-"
