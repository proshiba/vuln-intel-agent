title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  logitech-hidpp: Fix kernel crash on receiver USB disconnect\n\nhidpp_connect_event()
  has *four* time-of-check vs time-of-use (TOCTOU)\nraces when it races with itself.\n\
  \nhidpp_connect_event() primarily runs from a workqueue but it also runs\non probe()
  and if a \"device-connected\" packet is received by the hw\nwhen the thread running
  hidpp_connect_event() from probe() is waiting on\nthe hw, then a second thread running
  hidpp_connect_event() will be\nstarted from the workqueue.\n\nThis opens the following
  races (note the below code is simplified):\n\n1. Retrieving + printing the protocol
  (harmless race):\n\n\tif (!hidpp->protocol_major) {\n\t\thidpp_root_get_protocol_version()\n\
  \t\thidpp->protocol_major = response.rap.params[0];\n\t}\n\nWe can actually see
  this race hit in the dmesg in the abrt output\nattached to rhbz#2227968:\n\n[ 3064.624215]
  logitech-hidpp-device 0003:046D:4071.0049: HID++ 4.5 device connected.\n[ 3064.658184]
  logitech-hid"
