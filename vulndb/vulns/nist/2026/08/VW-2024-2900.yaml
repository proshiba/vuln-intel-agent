title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix potential memory leak in DMUB hw_init\n\n[Why]\nOn resume we perform DMUB hw_init
  which allocates memory:\ndm_resume->dm_dmub_hw_init->dc_dmub_srv_create->kzalloc\n\
  That results in memory leak in suspend/resume scenarios.\n\n[How]\nAllocate memory
  for the DC wrapper to DMUB only if it was not\nallocated before.\nNo need to reallocate
  it on suspend/resume."
