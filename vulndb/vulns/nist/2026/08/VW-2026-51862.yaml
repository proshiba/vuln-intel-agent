title: RubyGems fails to re-validate path containment after filesystem symlink 
  resolution during gem extraction. When a pre-existing symlink inside the 
  destination directory points outside the extraction root, extracted files that
  appear to be written under the destination directory can instead be written 
  outside of it, breaking the extraction safety boundary. The fix resolves the 
  real path of the parent directory before writing and raises 
  Gem::Package::PathError if it escapes the destination directory.
