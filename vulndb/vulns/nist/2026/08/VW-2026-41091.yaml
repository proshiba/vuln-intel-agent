title: A flaw was found in 389 Directory Server. The CleanAllRUV and Abort 
  CleanAllRUV replication-maintenance extended operations perform no 
  authorization check, allowing an unauthenticated remote attacker to invoke 
  them when nsslapd-allow-anonymous-access is enabled (the default), or any 
  authenticated low-privilege user to invoke them otherwise. This allows removal
  of a replica ID from replication metadata, purging of changelog records, and 
  interruption of administrator-initiated cleanup, which can leave replication 
  inconsistent or unavailable.
