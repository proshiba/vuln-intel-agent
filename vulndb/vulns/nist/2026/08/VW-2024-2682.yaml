title: "In the Linux kernel, the following vulnerability has been resolved:\n\nefi/libstub:
  Free correct pointer on failure\n\ncmdline_ptr is an out parameter, which is not
  allocated by the function\nitself, and likely points into the caller's stack.\n\n\
  cmdline refers to the pool allocation that should be freed when cleaning\nup after
  a failure, so pass this instead to free_pool()."
