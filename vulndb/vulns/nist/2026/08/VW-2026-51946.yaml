title: Pake before 3.13.1 joins the JavaScript-supplied filename for the 
  download_file Tauri command onto the user's Downloads directory with no 
  sanitization. A filename containing path traversal sequences (for example 
  ../Library/LaunchAgents/com.evil.plist) or an absolute path resolves outside 
  ~/Downloads. The command then fetches attacker-controlled content from the 
  supplied URL (via Rust HTTP, not the browser) and writes it to that path. A 
  script that can invoke the command can overwrite user-writable files and 
  install persistence (macOS LaunchAgents, Linux autostart, Windows Startup), 
  leading to code execution in the user account. All desktop apps generated from
  an affected Pake tree expose the same command.
