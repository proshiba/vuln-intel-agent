title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnbd:
  fix race between timeout and normal completion\n\nIf request timetout is handled
  by nbd_requeue_cmd(), normal completion\nhas to be stopped for avoiding to complete
  this requeued request, other\nuse-after-free can be triggered.\n\nFix the race by
  clearing NBD_CMD_INFLIGHT in nbd_requeue_cmd(), meantime\nmake sure that cmd->lock
  is grabbed for clearing the flag and the\nrequeue."
