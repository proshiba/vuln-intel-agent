title: PeerTube is an ActivityPub-federated video streaming platform. Prior to 
  8.2.2, processUpdateActivity and processUpdateVideo accept an ActivityPub 
  Update containing a Video object without verifying that byActor.url is 
  authorized for the host in videoObject.id, allowing a malicious federated 
  server to rewrite another server's video metadata, visibility, media file, and
  HLS URLs. This issue is fixed in version 8.2.2.
