  BDC UDC driver registers its IRQ handler with\ndevm_request_irq() in bdc_udc_init(),
  so the IRQ is released by devm\nonly after bdc_remove() returns.  devm releases
  resources in reverse\nLIFO order, but bdc_remove() runs bdc_udc_exit() and bdc_hw_exit()
  ->\nbdc_mem_free() manually before returning: bdc_udc_exit() tears down\nindividual
  endpoint objects via bdc_free_ep(), while bdc_hw_exit() ->\nbdc_mem_free() frees
  and NULLs the DMA-coherent status-report ring\n(bdc->srr.sr_bds) and kfree()s bdc->bdc_ep_array.\
