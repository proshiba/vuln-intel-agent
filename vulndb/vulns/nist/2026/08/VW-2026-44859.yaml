title: The Real Estate Manager Pro plugin for WordPress is vulnerable to 
  Privilege Escalation in all versions up to, and including, 12.8.6. This is due
  to improper capability handling in the allow_attachment_actions() function, 
  which can treat a target user ID as a media attachment ID during user 
  capability checks. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to edit an administrator account and 
  escalate their privileges to Administrator when the targeted user ID matches 
  the ID of an existing media attachment.
