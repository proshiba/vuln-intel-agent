title: A flaw was found in the backchannel logout endpoint of the 
  keycloak-services component, which is part of the Red Hat Build of Keycloak. 
  This component handles authentication and session management for applications.
  The issue occurs when an OIDC identity provider is configured to skip 
  signature validation. In this specific setup, the system incorrectly accepts 
  logout requests that have no cryptographic signature. An attacker who knows 
  certain technical details about a user's session can use this flaw to force 
  that user to be logged out, potentially disrupting their work.
