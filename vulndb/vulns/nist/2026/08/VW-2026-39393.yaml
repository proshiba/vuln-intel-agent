title: SnailJob 1.7.0 contains a denial of service vulnerability in the 
  FuryUtil.deserialize helper that allows authenticated attackers to crash the 
  server by supplying a crafted Zstandard-compressed payload with an inflated 
  frame_content_size field in the frame header. Attackers can store a 
  base64-encoded Zstandard payload declaring an arbitrarily large decompressed 
  size in a retry task argument, causing the JVM to attempt an unbounded array 
  allocation and triggering an unrecoverable java.lang.OutOfMemoryError when the
  task is dispatched through the retry-task pipeline.
