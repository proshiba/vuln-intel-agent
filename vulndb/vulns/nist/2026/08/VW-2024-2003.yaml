title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrcu:
  Fix buffer overflow in print_cpu_stall_info()\n\nThe rcuc-starvation output from
  print_cpu_stall_info() might overflow the\nbuffer if there is a huge difference
  in jiffies difference.  The situation\nmight seem improbable, but computers sometimes
  get very confused about\ntime, which can result in full-sized integers, and, in
  this case,\nbuffer overflow.\n\nAlso, the unsigned jiffies difference is printed
  using %ld, which is\nnormally for signed integers.  This is intentional for debugging
  purposes,\nbut it is not obvious from the code.\n\nThis commit therefore changes
  sprintf() to snprintf() and adds a\nclarifying comment about intention of %ld format.\n\
  \nFound by Linux Verification Center (linuxtesting.org) with SVACE."
