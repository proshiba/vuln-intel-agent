title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  tegra: tegra210_ahub: Validate written enum value\n\ntegra_ahub_put_value_enum()
  reads e->values[item[0]] before\nchecking whether item[0] is within the enum item
  range. The existing\ncheck therefore happens too late to prevent an out-of-range
  read of the\nvalues array.\n\nMove the check before the array access."
