title: MCPHub is a unified hub for centrally managing and dynamically 
  orchestrating multiple MCP servers/APIs into separate endpoints with flexible 
  routing strategies. Prior to version 1.0.32, an authenticated non-admin user 
  can register a server pointing at an arbitrary URL and make the hub issue 
  server-side requests to it, with no egress filtering (no block of loopback / 
  RFC1918 / link-local 169.254.0.0/16). Via the OpenAPI proxy path the response 
  body is returned to the caller (full, reflected SSRF); via the 
  SSE/streamable-http transport the request is sent blind. This issue has been 
  patched in version 1.0.32.
