title: "Trigger.dev is a platform for building and deploying fully managed AI agents
  and workflows. From 4.4.2 until 4.5.0-rc.4, `POST /api/v1/runs/:runParam/replay`
  in apps/webapp/app/routes/api.v1.runs.$runParam.replay.ts uses `prisma.taskRun.findUnique({
  where: { friendlyId: runParam } })` without a runtimeEnvironmentId filter, then
  ReplayTaskRunService in apps/webapp/app/v3/services/replayTaskRun.server.ts replays
  the selected run in the victim environment. Any valid environment API key can therefore
  replay another tenant's run by friendlyId, consuming victim resources and repeating
  side effects; when `payloadType: \"application/store\"` is used, overrideExistingPayloadPacket()
  calls conditionallyImportPacket() on existingTaskRun.payload without an integrity
  check, so payload bytes overwritten through a separate object-store path-traversal
  vulnerability become attacker-controlled input to the victim task. This issue is
  fixed in version 4.5.0-rc.4."
