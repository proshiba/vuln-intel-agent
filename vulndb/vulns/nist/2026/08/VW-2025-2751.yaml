title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  j1939: fix errant WARN_ON_ONCE in j1939_session_deactivate\n\nThe conclusion \"\
  j1939_session_deactivate() should be called with a\nsession ref-count of at least
  2\" is incorrect. In some concurrent\nscenarios, j1939_session_deactivate can be
  called with the session\nref-count less than 2. But there is not any problem because
  it\nwill check the session active state before session putting in\nj1939_session_deactivate_locked().\n\
  \nHere is the concurrent scenario of the problem reported by syzbot\nand my reproduction
  log.\n\n        cpu0                            cpu1\n                         \
  \       j1939_xtp_rx_eoma\nj1939_xtp_rx_abort_one\n                            \
  \    j1939_session_get_by_addr [kref == 2]\nj1939_session_get_by_addr [kref == 3]\n\
  j1939_session_deactivate [kref == 2]\nj1939_session_put [kref == 1]\n\t\t\t\tj1939_session_completed\n\
  \t\t\t\tj1939_session_deactivate\n\t\t\t\tWARN_ON_ONCE(kref < 2)\n\n==================================="
