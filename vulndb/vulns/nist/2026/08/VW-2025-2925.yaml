title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix potential out of bound read in ext4_fc_replay_scan()\n\nFor scan loop must ensure
  that at least EXT4_FC_TAG_BASE_LEN space. If remain\nspace less than EXT4_FC_TAG_BASE_LEN
  which will lead to out of bound read\nwhen mounting corrupt file system image.\n\
  ADD_RANGE/HEAD/TAIL is needed to add extra check when do journal scan, as this\n\
  three tags will read data during scan, tag length couldn't less than data length\n\
  which will read."
