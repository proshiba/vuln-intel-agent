title: A flaw has been found in Wavlink WL-NU516U1 708c073-mt7628. The impacted 
  element is an unknown function of the component Config Import. Executing a 
  manipulation of the argument Password can lead to os command injection. The 
  attack may be launched remotely. This attack is characterized by high 
  complexity. The exploitability is regarded as difficult. The exploit has been 
  published and may be used. It is advisable to upgrade the affected component. 
  The vendor was contacted early, responded in a very professional manner and 
  quickly released a fixed version of the affected product.
