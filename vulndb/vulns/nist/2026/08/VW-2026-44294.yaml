title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  isotp: fix use-after-free race with concurrent NETDEV_UNREGISTER\n\nisotp_release()
  looked up the bound network device via dev_get_by_index()\nusing the stored ifindex.
  During device unregistration the device is\nunlisted from the ifindex hash before
  the NETDEV_UNREGISTER notifier\nchain runs, so a concurrent isotp_release() could
  find no device, skip\ncan_rx_unregister() entirely, and still proceed to free the
  socket.\nSince isotp_release() had already removed itself from the isotp\nnotifier
  list at that point, isotp_notify() would never get a chance to\nclean up either,
  leaving a stale CAN filter that keeps pointing at the\nfreed socket.\n\nFix this
  the same way raw.c already does: hold a tracked reference to\nthe bound net_device
  in the socket (so->dev/so->dev_tracker) from\nbind() onward instead of re-resolving
  it from the ifindex, and\nserialize bind()/release() with rtnl_lock() so that so->dev
  is always\nconsistent with wh"
