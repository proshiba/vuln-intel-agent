title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_pedit: fix TOCTOU heap OOB write in tc offload\n\nThere is a TOCTOU race condition
  in flower lockless approach between sizing\na flow_rule buffer and filling it.\n\
  zdi-disclosures@trendmicro.com reports:\nThe cls_flower classifier operates with
  TCF_PROTO_OPS_DOIT_UNLOCKED\n(fl_change runs without RTNL), while RTM_NEWACTION
  holds RTNL, so the\nindependent locking domains make the race reachable in practice.\
  \  KASAN\nconfirms:\n  BUG: KASAN: slab-out-of-bounds in tcf_pedit_offload_act_setup+0x81b/0x930\n\
  \  Write of size 4 at addr ffff888001f27520 by task poc-toctou/312\n  The buggy
  address is located 0 bytes to the right of\n   allocated 288-byte region [ffff888001f27400,
  ffff888001f27520)\n   (cache kmalloc-512)\n\nNote: The result is a heap OOB write
  attacker-controlled content into the\nadjacent slab object (requires CAP_NET_ADMIN).\n\
  \nThe fix introduces reading tcfp_nkeys under act->tcfa_lock in all places\nusing
  a new tcf"
