title: A vulnerability was found in o6 open62541 up to 1.5.5. This issue affects
  the function UA_Client_readNodeClassAttribute of the file 
  src/client/ua_client_highlevel.c. Performing a manipulation results in 
  heap-based buffer overflow. Attacking locally is a requirement. The exploit 
  has been made public and could be used. The project closed the issue report, 
  stating that this is not the official way to report a security vulnerability.
