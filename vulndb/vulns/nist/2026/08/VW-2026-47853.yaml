title: "Kenwood DNR1007XR tchdr_bytestream_read Out-Of-Bounds Write Code Execution
  Vulnerability. This vulnerability allows physically present attackers to execute
  arbitrary code on affected installations of Kenwood DNR1007XR devices. Authentication
  is not required to exploit this vulnerability.\n\nThe specific flaw exists within
  the tchdr_bytestream_read function. The issue results from the lack of proper validation
  of user-supplied data, which can result in a write past the end of an allocated
  buffer. An attacker can leverage this vulnerability to execute code in the context
  of root. Was ZDI-CAN-28980."
