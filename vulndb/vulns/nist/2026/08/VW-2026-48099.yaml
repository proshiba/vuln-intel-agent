title: A flaw was found in the multicloud-operators-subscription component of 
  Red Hat Advanced Cluster Management (RHACM). A tenant with HelmRelease create 
  permissions can exploit this vulnerability by manipulating the 
  `secretRef.Namespace` field. This allows the `GetSecret()` function in the 
  HelmRelease controller to fetch sensitive credentials from any namespace, 
  which are then sent to an attacker-controlled Helm repository. This can lead 
  to the exfiltration of credentials from arbitrary namespace Secrets, resulting
  in information disclosure.
