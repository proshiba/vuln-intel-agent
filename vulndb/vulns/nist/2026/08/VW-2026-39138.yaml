title: A vulnerability was determined in Sangfor Operation and Maintenance 
  Security Management System up to 3.0.13. Affected by this vulnerability is the
  function com.sbr.fort.foreignDP.DpLoginController of the file 
  /fort/portal_login of the component Login Endpoint. This manipulation causes 
  os command injection. The attack can be initiated remotely. The exploit has 
  been publicly disclosed and may be utilized. The vendor was contacted early 
  about this disclosure but did not respond in any way.
