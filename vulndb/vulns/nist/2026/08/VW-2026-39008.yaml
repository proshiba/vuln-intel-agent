title: "FlowIntel is affected by a stored cross-site scripting vulnerability through
  multiple user-controlled or administrator-controlled fields.\n\nPersisted values—including
  case titles, ticket identifiers, recurring-case information, user profile attributes,
  organisation names, and role names—were rendered inside DOM elements subsequently
  compiled by Vue. Although normal HTML escaping could neutralize direct HTML markup,
  it did not prevent an attacker from injecting Vue interpolation expressions using
  the configured [[ ... ]] delimiters.\n\nAn authenticated attacker able to modify
  one of the affected fields could store a malicious Vue expression. When another
  user viewed an affected case, report, profile, recurring-case page, or navigation
  component, Vue could evaluate the injected expression in the context of the FlowIntel
  application.\n\nSuccessful exploitation could allow arbitrary JavaScript execution
  in the victim’s browser under the FlowIntel origin. This could expose information
