title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pci: Fix memory accounting for pinned/unpinned pages\n\nThe account_mem()
  and unaccount_mem() functions call get_uid() which\nincrements the reference count
  of struct user_struct on every invocation.\nBut we don't decrement the count by
  calling free_uid(). It also\naccounted/unaccounted the pages against the current->mm.
  But its possible\nthe unaccount_mem() can be called from a different process context
  than the\none that originally pinned the pages.\n\nLet's fix this by storing the
  pinning process user_struct and mm_struct\nwhen accounting for pinned pages, and
  subsequently free these resources\nwhen the pages are unpinned.\n\n[borntraeger@linux.ibm.com:
  Fixed whitespace]"
