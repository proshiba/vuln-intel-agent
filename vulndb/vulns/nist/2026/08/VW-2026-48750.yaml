title: "In the Linux kernel, the following vulnerability has been resolved:\n\nenic:
  fix tx_hang_reset use-after-free on device removal\n\nenic_remove() cancels the
  reset and change_mtu_work items but does not\ncancel tx_hang_reset. A TX timeout
  that fires while the device is being\nremoved can schedule enic_tx_hang_reset()
  so that it runs after\nfree_netdev(), resulting in a use-after-free.\n\ncancel_work_sync()
  alone is not sufficient here: the still-live watchdog\nand notify paths can re-schedule
  these work items in the window between\nthe cancel and unregister_netdev(). Use
  disable_work_sync(), which\ncancels the work and blocks any subsequent schedule_work()
  from\nrequeuing it, and apply it to the reset and change_mtu_work items as\nwell
  so the same requeue race is closed for all teardown work."
