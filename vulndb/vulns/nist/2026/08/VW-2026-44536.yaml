title: "In the Linux kernel, the following vulnerability has been resolved:\n\niomap:
  guard io_size EOF trim against concurrent truncate underflow\n\niomap: fix zero
  padding data issue in concurrent append writes\nchanged ioend accounting so that
  io_size tracks only valid data\nwithin EOF.  This trims io_size when a writeback
  range extends\npast end_pos:\n\n    ioend->io_size += map_len;\n    if (ioend->io_offset
  + ioend->io_size > end_pos)\n        ioend->io_size = end_pos - ioend->io_offset;\n\
  \nHowever, if end_pos ends up below ioend->io_offset, the subtraction\nbecomes negative
  and is stored in size_t io_size, causing an unsigned\nwrap to a huge value.  This
  can happen when writeback continues past\nbyte-level EOF up to a block-aligned range,
  or when a concurrent\ntruncate shrinks the file after end_pos was sampled in\niomap_writeback_handle_eof().\n\
  \nA wrapped io_size can mislead append detection and corrupt\ncompletion-time size
  handling, since filesystem end_io paths consume\nio_size for decisions such as on-"
