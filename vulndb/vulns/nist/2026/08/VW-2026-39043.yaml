title: Admidio before 5.0.11 does not validate the adm_csrf_token in 
  modules/category-report/preferences.php, which performs persistent Category 
  Report configuration changes based on GET parameters (delete and copy). An 
  attacker can trick an authenticated administrator into visiting a crafted URL 
  to delete or duplicate Category Report configurations, affecting the integrity
  and availability of that module's configuration.
