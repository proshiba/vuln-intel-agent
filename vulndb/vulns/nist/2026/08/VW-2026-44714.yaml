title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix undefined shift of user RQ WQE size\n\nset_rq_size() computes the RQ WQE size
  as \"1 << rq_wqe_shift\" based on\nthe user-provided rq_wqe_shift, which is only
  checked to be greater than\n32, so shifts of 32 are still accepted. A shift of 31
  also overflows a\nsigned integer, leading to undefined behavior.\n\nUse check_shl_overflow()
  to compute the RQ WQE size and reject any\ninvalid values."
