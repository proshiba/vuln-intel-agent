title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuio_hv_generic:
  Don't free decrypted memory\n\nIn CoCo VMs it is possible for the untrusted host
  to cause\nset_memory_encrypted() or set_memory_decrypted() to fail such that an\n\
  error is returned and the resulting memory is shared. Callers need to\ntake care
  to handle these errors to avoid returning decrypted (shared)\nmemory to the page
  allocator, which could lead to functional or security\nissues.\n\nThe VMBus device
  UIO driver could free decrypted/shared pages if\nset_memory_decrypted() fails. Check
  the decrypted field in the gpadl\nto decide whether to free the memory."
