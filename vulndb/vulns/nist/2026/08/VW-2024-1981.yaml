title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  Fix invalid reads in fence signaled events\n\nCorrectly set the length of the drm_event
  to the size of the structure\nthat's actually used.\n\nThe length of the drm_event
  was set to the parent structure instead of\nto the drm_vmw_event_fence which is
  supposed to be read. drm_read\nuses the length parameter to copy the event to the
  user space thus\nresuling in oob reads."
