title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigc:
  remove napi_synchronize() in igc_down()\n\nWhen an AF_XDP zero-copy application
  is killed abruptly, the XSK pool is\ntorn down but NAPI keeps polling. igc_clean_rx_irq_zc()
  then returns the\nfull budget on every poll, so napi_complete_done() never clears\n\
  NAPI_STATE_SCHED.\n\nigc_down() calls napi_synchronize() before napi_disable(),
  so it spins\nforever waiting for that bit and the interface never goes down. Drop
  the\nnapi_synchronize() and let napi_disable() do the job -- it sets\nNAPI_STATE_DISABLE,
  which forces the stuck poll to complete. Reorder it\nahead of igc_set_queue_napi()
  so the NAPI mapping is cleared only after\npolling has stopped, matching the recent
  igb fix b1e067240379."
