title: The TranslatePress – Translate Multilingual sites with AI Translation 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via Comment 
  Noise-Key Injection into HTML Parser in all versions up to, and including, 
  3.3.3 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. 
  Exploitation is possible because WordPress's comment KSES allowlist permits 
  the payload structure — an anchor tag with href and title attributes alongside
  a code tag — causing the malicious comment to be stored verbatim in the 
  database, where it is later processed by the vulnerable parser during page 
  translation.
