title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_tcm: synchronize delayed set_alt with teardown\n\nThe f_tcm set_alt()
  path defers endpoint setup to a work item and\ncompletes the delayed status response
  from process context. The delayed\nwork uses f_tcm private state and may complete
  the setup request after\ndisconnect or function teardown has already moved on.\n\
  \nCancel and drain the delayed set_alt work when the function is unbound or\nfreed.
  For disable paths, which are reached under the composite device\nlock, use a small
  state machine and a non-sleeping cancellation path\ninstead of cancel_work_sync().
  If the work is already running, mark it\ncancelled and let the worker own the cleanup;
  otherwise tcm_disable() can\ncancel the queued work and clean up immediately.\n\n\
  Also serialize the final delayed-status completion with the cancellation\ncheck
  while holding the composite device lock. This prevents a disconnect\nfrom clearing
  delayed_status while the worker is"
