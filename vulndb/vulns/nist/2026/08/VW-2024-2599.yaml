title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  check outstanding simultaneous SMB operations\n\nIf Client send simultaneous SMB
  operations to ksmbd, It exhausts too much\nmemory through the \"ksmbd_work_cache”.
  It will cause OOM issue.\nksmbd has a credit mechanism but it can't handle this
  problem. This patch\nadd the check if it exceeds max credits to prevent this problem
  by assuming\nthat one smb request consumes at least one credit."
