title: kkFileView is a universal file online preview project based on Spring 
  Boot. Prior to 5.0.1, the unauthenticated POST /listFiles endpoint in 
  server/src/main/java/cn/keking/web/controller/FileController.java passes the 
  user-controlled path parameter from FileController#getFiles to 
  Files.newDirectoryStream without confinement to the demo directory, allowing 
  directory enumeration outside the intended root. This issue is fixed in 
  version 5.0.1.
