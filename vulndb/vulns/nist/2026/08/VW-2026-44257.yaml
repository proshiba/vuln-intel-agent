title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  hpsa: Fix DMA mapping leak on IOACCEL2 reset path\n\nIf phys_disk->in_reset is set,
  the function returns directly without\nundoing the resources acquired for the command.
  Add the missing error\ncleanup by unmapping the IOACCEL2 SG chain block when needed,
  unmapping\nthe SCSI command, and dropping the outstanding IOACCEL command count\n\
  before returning."
