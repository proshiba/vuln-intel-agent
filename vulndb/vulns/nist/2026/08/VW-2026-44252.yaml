title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: core: Fix iSCSI ISID use-after-free in REGISTER AND MOVE\n\ncore_scsi3_emulate_pro_register_and_move()
  maps the PERSISTENT RESERVE OUT\nparameter list with transport_kmap_data_sg() and
  parses the destination\nTransportID with target_parse_pr_out_transport_id(). For
  an iSCSI\nTransportID (FORMAT CODE 01b), iscsi_parse_pr_out_transport_id() returns\n\
  the ISID in iport_ptr as a raw pointer into that mapped buffer.\n\nThe function
  then unmaps the buffer with transport_kunmap_data_sg() before\ndereferencing iport_ptr
  in strcmp(), __core_scsi3_locate_pr_reg() and\ncore_scsi3_alloc_registration().
  When the parameter list spans more than\none page (PARAMETER LIST LENGTH > 4096),
  transport_kmap_data_sg() uses\nvmap() and transport_kunmap_data_sg() does vunmap(),
  so the kernel virtual\naddress backing iport_ptr is torn down and every subsequent
  dereference is\na use-after-free read of the unmapped region.\n\nKeep the parameter
  lis"
