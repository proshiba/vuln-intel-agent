title: RustFS is a distributed object storage system built in Rust. Prior to 
  1.0.0-beta.12, an anonymous ListObjectVersions request in 
  rustfs/src/storage/access.rs that lacks a direct bucket-policy grant falls 
  back to an s3:ListBucket check and returns before the policy_allowed path 
  applies deny_anonymous_table_data_plane_if_needed and RestrictPublicBuckets, 
  so a bucket that permits anonymous listing can continue exposing version 
  listings after an operator enables the public-access control. The bypass 
  affects GET /<bucket>?versions= and can disclose object version metadata even 
  though equivalent GetObject requests are denied. This issue is fixed in 
  version 1.0.0-beta.12.
