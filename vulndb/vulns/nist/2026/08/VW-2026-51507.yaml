title: The GiveWP – Donation Plugin and Fundraising Platform plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via the 'give_form' 
  shortcode in all versions up to, and including, 4.14.4. This is due to 
  insufficient input sanitization and output escaping on the 
  continue_button_title and display_style shortcode attributes, which are passed
  through sanitize_text_field() but not properly escaped when output in HTML 
  data attributes. This makes it possible for authenticated attackers, with 
  Contributor-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever a user accesses an injected page.
