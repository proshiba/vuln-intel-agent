title: Grav Flex Objects plugin versions 1.4.0 through 1.4.7 contain an 
  authorization bypass vulnerability in the flex-objects shortcode that allows 
  users with page-edit access to render any registered Flex collection without 
  permission checks. Attackers can place the shortcode in published pages to 
  expose sensitive directory contents including user account information, 
  bypassing the authorize ACL enforced in the admin panel.
