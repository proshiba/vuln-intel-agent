title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  thunderbolt: Tear down DMA paths before stopping the rings\n\ntbnet_tear_down()
  stops both rings and frees their frame buffers before\ncalling tb_xdomain_disable_paths().\
  \  tb_ring_stop() zeroes the ring's\ndescriptor base and tbnet_free_buffers() unmaps
  and frees the pages the\nframes sit in, so by the time __tb_path_deactivate_hop()
  polls the hop's\n'pending' bit, anything still in flight has nowhere to drain to.\n\
  \nThe teardown sequence has been in this order since the driver was added.\nThe
  setup path has not: commit ff7cd07f3064 (\"net: thunderbolt: Enable\nDMA paths only
  after rings are enabled\") moved the path enable to the end\nof tbnet_connected_work()
  and documented why:\n\n\t/* Both logins successful so enable the rings, high-speed
  DMA\n\t * paths and start the network device queue.\n\t *\n\t * Note we enable the
  DMA paths last to make sure we have primed\n\t * the Rx ring before any incoming
  packets are allowed to\n\t * arrive"
