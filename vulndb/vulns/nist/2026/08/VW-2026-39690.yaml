title: "Miantang/IoT-PHP's index.php implements a POST /userlogin route that reads
  the password directly from $_POST['pwd'] with no sanitization and concatenates it
  into a raw SQL string: mysql_query(\"select * from userlists where username='$username'
  and password='$password' limit 1\"). The username value is passed through htmlspecialchars(),
  which does not encode single quotes by default and therefore does not prevent SQL
  injection through the password field. An unauthenticated attacker can submit a payload
  such as pwd=' OR '1'='1 to bypass authentication and, via UNION-based injection,
  extract arbitrary data from the database."
