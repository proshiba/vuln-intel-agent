title: "Affected versions of Flowintel render calendar event titles using innerHTML.
  Because those titles are derived from case titles, a user able to create or modify
  a case title could store HTML or script-capable content that is later interpreted
  by the browser when another user views the calendar.\n\n\nThe fix changes:\n\n\n\
  titleEl.innerHTML = arg.event.title\n\n\nto:\n\n\ntitleEl.textContent = arg.event.title
  || ''\n\nand similarly stops using innerHTML for the static download icon.\n\nVersion
  impacted =>3.3.0"
