title: fast-uri is a URI parser for Node.js. It decodes percent escapes in a 
  hostname during parsing and then decodes the parsed hostname a second time 
  during authority recomposition, so a single call to normalize or resolve can 
  turn nested percent-encoded input into a different network destination such as
  a loopback hostname or address. For example, a doubly encoded host that spells
  out a loopback name decodes to that live host in one operation, which 
  contradicts RFC 3986 section 2.4 that an implementation must not decode the 
  same string more than once. An application that normalizes or resolves an 
  untrusted HTTP-family URI before outbound routing, redirect validation, or a 
  host-policy check can receive a destination different from the one the 
  original encoded host represented, giving a server-side request forgery and 
  host-policy bypass primitive. This is an incomplete-fix variant of 
  CVE-2026-6322. The affected versions are 2.4.1 up to but not including 2.4.5, 
  3.1.2 up to but not including 3
