title: The WP Data Access  WordPress plugin before 5.5.79 does not validate the 
  column names it accepts on one of its unauthenticated AJAX actions, and the 
  nonce guarding that action does not cover them, allowing unauthenticated 
  attackers to read arbitrary columns of the database table the affected 
  front-end form is bound to, including user password hashes where that table is
  the users table.
