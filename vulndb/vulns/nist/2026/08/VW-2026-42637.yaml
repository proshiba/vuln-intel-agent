title: An issue in MongoDB Server's applyOps command could allow an 
  authenticated user with specific non-default privileges to perform certain 
  data-definition operations, such as dropping or modifying collections, against
  collections they do not have permission to manipulate. This is due to an 
  inconsistency in how the target collection is determined between the 
  authorization check and the actual operation.
