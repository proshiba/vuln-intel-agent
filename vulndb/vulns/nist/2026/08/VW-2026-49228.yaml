title: OpenEXR is the reference implementation and specification for the EXR 
  image format, widely used in the motion picture industry. In versions 3.1.0 
  through 3.2.10, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13, an int32_t 
  multiplication in OpenEXRCore's unpack_sample_table() can overflow while 
  decoding a crafted deep tiled EXR file, producing an invalid pointer that 
  leads to a read from an unmapped memory address and a crash. Because the 
  overflow occurs in the standard decoding path (exr_decoding_run), any 
  application that decodes deep tiled EXR files is affected. This issue is fixed
  in versions 3.2.11, 3.3.13, and 3.4.14.
