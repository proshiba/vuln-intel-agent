title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  fix use-after-free in fib_nhc_update_mtu()\n\nfib_nhc_update_mtu() walks the nexthop
  exception table under RTNL, but\nRTNL does not serialize this walk with PMTU exception
  updates. The walk\nuses rcu_dereference_protected() with a constant true condition
  without\nholding fnhe_lock.\n\nThe following interleaving can therefore occur:\n\
  \n  CPU 0                              CPU 1\n  fib_nhc_update_mtu()           \
  \    update_or_create_fnhe()\n    load fnhe                          spin_lock_bh(&fnhe_lock)\n\
  \                                       fnhe_remove_oldest()\n                 \
  \                        unlink fnhe\n                                         kfree_rcu(fnhe,
  rcu)\n    <quiescent state>\n    access fnhe after grace period\n\nKASAN reported:\n\
  \n  BUG: KASAN: slab-use-after-free in fib_nhc_update_mtu+0x3df/0x410\n  Read of
  size 8 at addr ffff888107d49000 by task poc/90\n  Call Trace:\n   fib_nhc_update_mtu+0x3df/0x410\n\
  \   fib"
