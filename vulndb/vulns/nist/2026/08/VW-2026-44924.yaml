title: "In the Linux kernel, the following vulnerability has been resolved:\n\nof/address:
  Fix NULL bus dereference in of_pci_range_parser_one()\n\nThe bus matching rework
  made of_match_bus() return NULL for nodes with\nranges/dma-ranges but no local #address-cells.
  parser_init() stored that\nNULL bus, and the range iterator later dereferenced it.\n\
  \nReject such nodes in parser_init(), leaving an explicit empty\niterator for callers
  that ignore the init return, and make\nof_dma_get_max_cpu_address() honour the init
  failure so a rejected node\ncannot clamp the DMA limit."
