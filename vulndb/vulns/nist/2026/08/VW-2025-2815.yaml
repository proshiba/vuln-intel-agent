title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Fix an illegal memory access\n\nIn the kfd_wait_on_events() function, the kfd_event_waiter
  structure is\nallocated by alloc_event_waiters(), but the event field of the waiter\n\
  structure is not initialized; When copy_from_user() fails in the\nkfd_wait_on_events()
  function, it will enter exception handling to\nrelease the previously allocated
  memory of the waiter structure;\nDue to the event field of the waiters structure
  being accessed\nin the free_waiters() function, this results in illegal memory access\n\
  and system crash, here is the crash log:\n\nlocalhost kernel: RIP: 0010:native_queued_spin_lock_slowpath+0x185/0x1e0\n\
  localhost kernel: RSP: 0018:ffffaa53c362bd60 EFLAGS: 00010082\nlocalhost kernel:
