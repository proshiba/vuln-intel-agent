title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  fix refcount leak in mlxsw_sp_port_lag_join()\n\nWhen mlxsw_sp_port_lag_index_get()
  fails, mlxsw_sp_port_lag_join()\nreturns an error without releasing the lag reference
  obtained by\nthe earlier mlxsw_sp_lag_get().  All other error paths in the\nfunction
  jump to the cleanup label that ends with\nmlxsw_sp_lag_put(), so this is a single
  missed release.\n\nFix the leak by replacing the bare 'return err' with a goto to
  the\nexisting error cleanup label, which will drop the reference safely."
