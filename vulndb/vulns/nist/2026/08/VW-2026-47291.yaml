title: FreeRDP is a free implementation of the Remote Desktop Protocol. Prior to
  3.27.0, FreeRDP clients that negotiate RDPGFX AVC444 with an H.264 decoder 
  backend calculate the intermediate YUV444 allocation size in 
  libfreerdp/codec/h264.c with 32-bit multiplication in avc444_ensure_buffer. A 
  malicious RDP server can supply surface dimensions for which piDstStride 
  multiplied by padDstHeight wraps to a small nonzero value, causing 
  winpr_aligned_recalloc to allocate an undersized buffer before 
  YUV420CombineToYUV444 writes using the actual stride and rectangle dimensions.
  This can cause a client crash and may permit code execution through 
  attacker-influenced heap corruption. This issue is fixed in version 3.27.0.
