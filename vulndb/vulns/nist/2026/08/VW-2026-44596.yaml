title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix effective prog array index with BPF_F_PREORDER\n\nreplace_effective_prog() and
  purge_effective_progs() located the slot in\nthe effective array by walking the
  program hlist and counting entries\nlinearly. That count does not match the array
  layout: compute_effective_\nprogs() places BPF_F_PREORDER programs at the front
  (ancestor cgroup\nfirst, attach order within a cgroup) and the rest after them (descendant\n\
  cgroup first). So when a preorder program is present, the linear hlist\nposition
  no longer equals the program's index in the effective array.\n\nFor replace_effective_prog()
  (bpf_link_update()) this overwrote the\nwrong slot, corrupting the effective order.
  For purge_effective_progs(),\nit could dummy out a slot belonging to a different
  program and leave the\ndetached program in the array while bpf_prog_put() drops
