title: "Tobit Laboratories AG TeamDavid's Webbox application implements various file
  upload functionalities that are \nvulnerable to a buffer overflow condition. By
  specifying an excessively \nlong filename in a file upload request, an unauthenticated
  attacker can \ntrigger a crash of the server, resulting in a denial of service.\
  \ \nDepending on the stack state or if a stack canary can be disclosed \nthrough
  another vulnerability, this buffer overflow could potentially be\n exploited for
  remote code execution, leading to full compromise of the \nserver. This issue affects
  TeamDavid through Rollout 524."
