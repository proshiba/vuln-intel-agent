title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: function: rndis: add length check to response query\n\nAdd variable representations
  for BufLength and BufOffset in\nrndis_query_response(), and perform a length check
  on them.\n\nThis is identical to how rndis_set_response() handles these parameters."
