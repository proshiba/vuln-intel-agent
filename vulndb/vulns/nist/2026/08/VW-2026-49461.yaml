title: Winter CMS before 1.2.13 contains a local file inclusion vulnerability in
  the JavascriptImporter filter that allows authenticated users with 
  cms.manage_assets permission to disclose arbitrary server-readable files by 
  placing =include or =require directives in theme JavaScript assets. Attackers 
  can reference files like .env outside the theme directory, and the combined 
  output served through the combine route becomes readable by unauthenticated 
  visitors, exposing application keys and database credentials.
