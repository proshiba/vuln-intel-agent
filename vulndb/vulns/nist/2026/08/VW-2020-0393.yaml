title: "A remote code execution vulnerability exists when Internet Explorer improperly
  accesses objects in memory. The vulnerability could corrupt memory in such a way
  that an attacker could execute arbitrary code in the context of the current user.
  An attacker who successfully exploited the vulnerability could gain the same user
  rights as the current user. If the current user is logged on with administrative
  user rights, the attacker could take control of an affected system. An attacker
  could then install programs; view, change, or delete data; or create new accounts
