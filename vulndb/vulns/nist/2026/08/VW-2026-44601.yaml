title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm_crb:
  Check ACPI_COMPANION() against NULL during probe\n\nEvery platform driver can be
  forced to match a device that doesn't match\nits list of device IDs because of device_match_driver_override(),
  so\nplatform drivers that rely on the existence of a device's ACPI companion\nobject
  need to verify its presence.\n\nAccordingly, add a requisite ACPI_COMPANION() check
  against NULL to the\ntpm_crb driver."
