title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs3:
  cap RESTART_TABLE free-chain walker at rt->used\n\nA crafted NTFS3 disk image triggers
  an in-kernel infinite loop at\nmount time, hanging the mounting thread and firing
  the soft-lockup\nwatchdog within ~22s on multi-CPU hosts (panic with\nkernel.softlockup_panic=1).\
  \  The bug is reachable from desktop USB\nauto-mount on distributions where udisks2
  routes the NTFS signature\nto the in-tree ntfs3 driver (Arch family and an increasing
  fraction\nof Fedora / openSUSE / RHEL deployments); CAP_SYS_ADMIN-class manual\n\
  mount elsewhere.\n\ncheck_rstbl()'s second walker iterates the free-entry singly-linked\n\
  list headed by rt->first_free with no upper bound on iteration count:\n\n  for (off
  = ff; off;) {\n      if (off == RESTART_ENTRY_ALLOCATED)\n          return false;\n\
  \      off = le32_to_cpu(*(__le32 *)Add2Ptr(rt, off));\n      if (off > ts - sizeof(__le32))\n\
  \          return false;\n  }\n\nThe existing guards cover three exits: end-of-list"
