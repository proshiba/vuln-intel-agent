title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  prevent tstamp ring allocation for non-PF VSI types\n\nThe pf->txtime_txqs bitmap
  tracks which Tx queues have ETF (Earliest\nTxTime First) offload enabled. This bitmap
  is indexed by queue number\nand is set by ice_offload_txtime(), which only operates
  on PF VSI\nqueues.\n\nHowever, ice_is_txtime_ena() does not check the VSI type before\n\
  consulting the bitmap. When ETF offload is enabled on PF Tx queue 0,\nbit 0 is set
  in pf->txtime_txqs. During a subsequent PCI reset\nrebuild, the CTRL VSI's Tx queue
  0 is reconfigured and\nice_is_txtime_ena() is called for that ring. Since it only
  checks\npf->txtime_txqs by queue index without distinguishing VSI type, it\nfinds
  bit 0 set and returns true, matching the PF VSI's ETF queue,\nnot the CTRL VSI's.
  This causes ice_vsi_cfg_txq() to spuriously\nallocate a tstamp_ring for the CTRL
  VSI ring.\n\nSince CTRL VSI rings have no associated netdev, ice_clean_tx_ring()\n\
