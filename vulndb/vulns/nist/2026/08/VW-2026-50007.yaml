title: Faktory is a language-agnostic background job server. In versions prior 
  to 1.10.0, the embedded Redis bootstrapper is vulnerable to an insecure 
  temporary file flaw that lets a local unprivileged user hijack the Redis 
  configuration and escalate to root. It writes its startup configuration to a 
  fixed, predictable, world-writable path, /tmp/redis.conf, only creating the 
  file if it does not already exist and never validating it on later boots. 
  Because /tmp is world-writable, a local unprivileged user can pre-create 
  /tmp/redis.conf with attacker-chosen Redis directives before Faktory starts, 
  and Faktory will use the planted file verbatim. Faktory only overrides the 
  unixsocket, dir, and logfile options, leaving directives such as bind, 
  protected-mode, requirepass, and loadmodule attacker-controlled. This lets an 
  attacker silently expose the entire job queue over an unauthenticated network 
