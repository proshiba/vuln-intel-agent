title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (ltc4282) Clamp negative current limits\n\nWhen a negative value is passed to ltc4282_write_curr(),
  the signed long\nval is cast directly to u64:\n\ndrivers/hwmon/ltc4282.c:ltc4282_write_curr()
  {\n        /* need to pass it in millivolt */\n        u32 in = DIV_ROUND_CLOSEST_ULL((u64)val
  * st->rsense, DECA * MICRO);\n        ...\n}\n\nThis cast converts negative inputs
  into large positive values. The\nsubsequent division result overflows the u32 in
  variable, truncating\nto a pseudo-random positive value. When this is passed to\n\
  ltc4282_write_voltage_byte(), it is clamped to the maximum limit instead\nof zero.\n\
  \nClamp val to 0 and to the maximum supported upper limit before the cast\nand assign
  the result to a 64-bit temporary variable before the division\nto avoid the underflow
  and an also possible overflow."
