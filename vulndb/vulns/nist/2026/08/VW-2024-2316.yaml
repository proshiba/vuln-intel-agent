title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mana: Fix RX buf alloc_size alignment and atomic op panic\n\nThe MANA driver's RX
  buffer alloc_size is passed into napi_build_skb() to\ncreate SKB. skb_shinfo(skb)
  is located at the end of skb, and its alignment\nis affected by the alloc_size passed
  into napi_build_skb(). The size needs\nto be aligned properly for better performance
  and atomic operations.\nOtherwise, on ARM64 CPU, for certain MTU settings like 4000,
  atomic\noperations may panic on the skb_shinfo(skb)->dataref due to alignment fault.\n\
  \nTo fix this bug, add proper alignment to the alloc_size calculation.\n\nSample
  panic info:\n[  253.298819] Unable to handle kernel paging request at virtual address
  ffff000129ba5cce\n[  253.300900] Mem abort info:\n[  253.301760]   ESR = 0x0000000096000021\n\
  [  253.302825]   EC = 0x25: DABT (current EL), IL = 32 bits\n[  253.304268]   SET
  = 0, FnV = 0\n[  253.305172]   EA = 0, S1PTW = 0\n[  253.306103]   FSC = 0x21: alignment
  fault\nC"
