title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, Dokploy allows an authenticated user to execute arbitrary commands on
  a local or SSH-connected target server because registry.testRegistry and 
  registry.testRegistryById in apps/dokploy/server/api/routers/registry.ts 
  interpolate the password field into an execAsyncRemote shell command instead 
  of using safeDockerLoginCommand. This issue is fixed in version 0.29.13.
