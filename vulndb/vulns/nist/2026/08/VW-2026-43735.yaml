title: Uncaught Exception (CWE-248) in Kibana Cases can lead to denial of 
  service via Input Data Manipulation (CAPEC-153). Malformed link syntax stored 
  in a case comment was not rejected or sanitized when the comment was later 
  formatted for display, and the resulting unhandled error prevented the 
  affected case from being displayed. An authenticated user holding privileges 
  to comment on a case could store such a comment, after which that case became 
  inaccessible to every user who opened it until the stored comment was removed.
