title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  fix OOB in binder_add_freeze_work()\n\nIn binder_add_freeze_work() we iterate over
  the proc->nodes with the\nproc->inner_lock held. However, this lock is temporarily
  dropped to\nacquire the node->lock first (lock nesting order). This can race with\n\
  binder_deferred_release() which removes the nodes from the proc->nodes\nrbtree and
  adds them into binder_dead_nodes list. This leads to a broken\niteration in binder_add_freeze_work()
  as rb_next() will use data from\nbinder_dead_nodes, triggering an out-of-bounds
  access:\n\n  ==================================================================\n\
  \  BUG: KASAN: global-out-of-bounds in rb_next+0xfc/0x124\n  Read of size 8 at addr
  ffffcb84285f7170 by task freeze/660\n\n  CPU: 8 UID: 0 PID: 660 Comm: freeze Not
  tainted 6.11.0-07343-ga727812a8d45 #18\n  Hardware name: linux,dummy-virt (DT)\n\
  \  Call trace:\n   rb_next+0xfc/0x124\n   binder_add_freeze_work+0x344/0x534\n \
  \  binder_ioctl+0x1e70/0x25"
