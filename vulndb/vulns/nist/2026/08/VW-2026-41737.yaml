title: "The UpdateHub over-the-air update client's start_coap_client() in subsys/mgmt/updatehub/updatehub.c
  leaks the CoAP/DTLS socket descriptor on its connection-setup failure paths. The
  shared error: cleanup gated socket closing on a ret > 0 flag, but ret was set to
  -1 immediately after the socket was created, so when zsock_setsockopt() (DTLS) or
  zsock_connect() subsequently failed the gate was false and cleanup_connection()
  was never called. The open descriptor in the global ctx.sock was then overwritten
  by the next attempt, permanently leaking it from the socket / net_context pool until
  reboot.\n\nThe failing setup path is reached every time the OTA client tries to
  contact the UpdateHub server and the connection cannot be established — driven automatically
  by the periodic autohandler() poll (and on demand via the updatehub_probe()/updatehub_update()
  API or the updatehub run shell command). The DTLS handshake/connect outcome is influenceable
  by a network or on-path attacker who drops, resets"
