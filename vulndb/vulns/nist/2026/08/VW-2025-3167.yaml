title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopp:
  Fix use-after-free in lazy_opp_tables after probe deferral\n\nWhen dev_pm_opp_of_find_icc_paths()
  in _allocate_opp_table() returns\n-EPROBE_DEFER, the opp_table is freed again, to
  wait until all the\ninterconnect paths are available.\n\nHowever, if the OPP table
  is using required-opps then it may already\nhave been added to the global lazy_opp_tables
  list. The error path\ndoes not remove the opp_table from the list again.\n\nThis
  can cause crashes later when the provider of the required-opps\nis added, since
  we will iterate over OPP tables that have already been\nfreed. E.g.:\n\n  Unable
  to handle kernel NULL pointer dereference when read\n  CPU: 0 PID: 7 Comm: kworker/0:0
