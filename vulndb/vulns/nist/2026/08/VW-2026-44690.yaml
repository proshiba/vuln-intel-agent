title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/region:
  Block region delete during region creation\n\nExpand the range lock, rename it \"\
  regions_lock\", to disable region deletion\nin the critical period between construct_region()
  and attach_target(), as\nwell as the period between device_add() and registering
  the remove actions.\n\nOtherwise, userspace can confuse the kernel. It can violate
  the assumption\nthe region stays registered through the completion of cxl_add_to_region().\n\
  It can violate the assumption that devm_add_action_or_reset() is working\nwith a
  live 'struct cxl_region'.\n\nIt is ok for the region to disappear outside of those
  windows as that\nmirrors device hotplug flows where the proper locks are held."
