title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRevert
  \"libfs: fix infinite directory reads for offset dir\"\n\nThe current directory
  offset allocator (based on mtree_alloc_cyclic)\nstores the next offset value to
  return in octx->next_offset. This\nmechanism typically returns values that increase
  monotonically over\ntime. Eventually, though, the newly allocated offset value wraps\n\
  back to a low number (say, 2) which is smaller than other already-\nallocated offset
  values.\n\nYu Kuai <yukuai3@huawei.com> reports that, after commit 64a7ce76fb90\n\
  (\"libfs: fix infinite directory reads for offset dir\"), if a\ndirectory's offset
  allocator wraps, existing entries are no longer\nvisible via readdir/getdents because
  offset_readdir() stops listing\nentries once an entry's offset is larger than octx->next_offset.\n\
  These entries vanish persistently -- they can be looked up, but will\nnever again
  appear in readdir(3) output.\n\nThe reason for this is that the commit treats directory
  offsets as\nm"
