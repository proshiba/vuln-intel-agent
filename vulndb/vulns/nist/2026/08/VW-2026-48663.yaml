title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/v3d:
  Serialize the scheduler timeout handlers\n\nV3D exposes several independent hardware
  queues (BIN, RENDER, TFU and\nCSD) but has only a single, global reset. A timeout
  on any one queue\ntherefore has to stop, reset and restart the schedulers of every
  other\nqueue as well. That makes concurrent timeout handlers unsafe.\n\n`reset_lock`
  was never able to make them safe, as a driver-side lock can\nonly cover the driver's
  &drm_sched_backend_ops.timedout_job callback.\nThe scheduler handles the timed out
  job and its pending list around that\ncallback, outside of the driver's control,
  so a global reset triggered\nby one queue can still interfere with another queue
  that is in the\nmiddle of handling a timeout of its own.\n\nConsequently, if a reset
  happens in the CSD queue while a CL-intensive\napplication is running, the global
  reset stops and restarts the CL\nqueue's scheduler while that queue is handling
  a timeout of its own. As\nd"
