title: A flaw was found in Katello where the Content View Filter Rules API does 
  not properly enforce authorization on the parent Content View Filter. An 
  authenticated, low-privileged user with Content View permissions in one 
  organization may be able to access and modify filter rules belonging to a 
  Content View Filter in another organization by supplying that filter's 
  identifier. This can result in unauthorized disclosure of filter-rule 
  information and unauthorized changes to unpublished Content View filter 
  configuration.
