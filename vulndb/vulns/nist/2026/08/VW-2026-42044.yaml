title: FreeRDP before 3.30.0 contains an out-of-bounds vulnerability in 
  kerberos_DecryptMessage() (winpr/libwinpr/sspi/Kerberos/kerberos.c). The 
  16-bit EC (extra count) field of a peer-supplied GSS Wrap token (RFC 4121) is 
  used directly in pointer arithmetic to locate the encrypted regions without 
  being bounds-checked, while only RRC and the total buffer length are 
  validated. A malicious peer (server or client) can supply a large EC value (up
  to 0xFFFF) during CredSSP/NLA authentication, moving the decrypt operation's 
  base pointers past the end of the ~60-byte token buffer. Because the 
  AES-CTS-HMAC enctypes decrypt in place before the HMAC integrity check, this 
  results in an out-of-bounds read and in-place out-of-bounds write, potentially
  leading to information disclosure, memory corruption, or denial of service.
