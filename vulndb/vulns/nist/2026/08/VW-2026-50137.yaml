title: The Avada theme for WordPress is vulnerable to Arbitrary File Write in 
  all versions up to, and including, 7.16 when the Fusion Builder plugin is 
  installed and active in versions up to, and including, 3.16. This is due to a 
  chain of authorization and input validation weaknesses across the two 
  components that makes it possible for unauthenticated attackers to write 
  attacker-controlled files to the server. This can be used to create and 
  execute arbitrary PHP files, resulting in remote code execution and complete 
  site compromise. Successful exploitation requires both Avada and Fusion 
  Builder to be installed and active, as well as certain administrator-authored 
  content to be present.
