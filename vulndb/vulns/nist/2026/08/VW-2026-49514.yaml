title: 'Ekushey Project Manager CRM stores the administrator-configured system name
  and writes it to the login page without output encoding. The value is emitted in
  three places on that page: the content attribute of the description meta element,
  the title element, and the text of an h4 element in the page header. The h4 occurrence
  is parsed as markup, so HTML placed in the system name field is rendered as markup
  and any event handler it carries runs. The login page is served without authentication,
  so the stored value executes in the browser of every visitor who loads it, including
  visitors who are not signed in, within the origin that serves the login form and
  alongside the credential fields on it. Storing the value requires an administrator
  session; the resulting script runs for unauthenticated visitors and persists until
  the setting is changed.'
