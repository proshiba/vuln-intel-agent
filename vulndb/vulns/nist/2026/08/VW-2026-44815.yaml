title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  addrconf: bail out of dad_failure when state is no longer POSTDAD\n\naddrconf_dad_failure()
  transitions ifp->state from DAD to POSTDAD\nvia addrconf_dad_end(), which drops
  ifp->lock on return.  The lock\nis re-acquired after net_info_ratelimited().  A
  concurrent\nipv6_del_addr() can take the lock in that window, set ifp->state\nto
  DEAD and run list_del_rcu(&ifp->if_list).\n\naddrconf_dad_failure() then overwrites
  DEAD with ERRDAD at errdad:\nand schedules a new dad_work.  The work calls ipv6_del_addr()\n\
  again, hitting the already-poisoned list entry:\n\n  general protection fault: 0000
  [#1] SMP NOPTI\n  CPU: 4 PID: 217 Comm: kworker/4:1\n  Workqueue: ipv6_addrconf
  addrconf_dad_work\n  RIP: 0010:ipv6_del_addr+0xe9/0x280\n  RAX: dead000000000122\n\
  \  Call Trace:\n   addrconf_dad_stop+0x113/0x140\n   addrconf_dad_work+0x28c/0x430\n\
  \   process_one_work+0x1eb/0x3b0\n   worker_thread+0x4d/0x400\n   kthread+0x104/0x140\n\
  \   ret_from_fork+0x35/0x"
