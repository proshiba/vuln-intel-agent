title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip6mr:
  fix UAF issue in ip6mr_sk_done() when addrconf_init_net() failed\n\nIf the initialization
  fails in calling addrconf_init_net(), devconf_all is\nthe pointer that has been
  released. Then ip6mr_sk_done() is called to\nrelease the net, accessing devconf->mc_forwarding
  directly causes invalid\npointer access.\n\nThe process is as follows:\nsetup_net()\n\
  \tops_init()\n\t\taddrconf_init_net()\n\t\tall = kmemdup(...)           ---> alloc
  \"all\"\n\t\t...\n\t\tnet->ipv6.devconf_all = all;\n\t\t__addrconf_sysctl_register()
  ---> failed\n\t\t...\n\t\tkfree(all);                  ---> ipv6.devconf_all invalid\n\
  \t\t...\n\tops_exit_list()\n\t\t...\n\t\tip6mr_sk_done()\n\t\t\tdevconf = net->ipv6.devconf_all;\n\
  \t\t\t//devconf is invalid pointer\n\t\t\tif (!devconf || !atomic_read(&devconf->mc_forwarding))\n\
  \nThe following is the Call Trace information:\nBUG: KASAN: use-after-free in ip6mr_sk_done+0x112/0x3a0\n\
  Read of size 4 at addr ffff888075508e88 by task ip/14554\nCall Trace:\n<TASK>\n\
  dum"
