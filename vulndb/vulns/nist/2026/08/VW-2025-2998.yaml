title: "In the Linux kernel, the following vulnerability has been resolved:\n\nibmvnic:
  Do not reset dql stats on NON_FATAL err\n\nAll ibmvnic resets, make a call to netdev_tx_reset_queue()
  when\nre-opening the device. netdev_tx_reset_queue() resets the num_queued\nand
  num_completed byte counters. These stats are used in Byte Queue\nLimit (BQL) algorithms.
  The difference between these two stats tracks\nthe number of bytes currently sitting
  on the physical NIC. ibmvnic\nincreases the number of queued bytes though calls
  to\nnetdev_tx_sent_queue() in the drivers xmit function. When, VIOS reports\nthat
  it is done transmitting bytes, the ibmvnic device increases the\nnumber of completed
  bytes through calls to netdev_tx_completed_queue().\nIt is important to note that
  the driver batches its transmit calls and\nnum_queued is increased every time that
  an skb is added to the next\nbatch, not necessarily when the batch is sent to VIOS
  for transmission.\n\nUnlike other reset types, a NON FATAL reset will not flush
  the su"
