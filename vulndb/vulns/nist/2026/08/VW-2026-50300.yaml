title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  skip zero-sized firmware sections\n\npanthor_fw_load_section_entry() skips BO creation
  when the firmware section\nVA range is empty. If such a section is added to the
  firmware section list,\nsection->mem is left as NULL.\n\nLater reload and unplug
  paths iterate over all firmware sections and\ndereference section->mem, which can
  lead to a NULL pointer dereference.\n\nZero-sized firmware sections are valid, so
  accept them as no-op entries but\nskip adding them to the section list."
