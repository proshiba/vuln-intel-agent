title: "A vulnerability in the REST API of Cisco Secure FMC Software could allow an
  authenticated, remote attacker to conduct SQL injection attacks on an affected system.\r\
  \n\r This vulnerability is due to inadequate validation of user-supplied input.
  An attacker could exploit this vulnerability by sending crafted requests to an affected
  device. A successful exploit could allow the attacker to obtain read access to the
  database and read certain files on the underlying operating system. To exploit this
  vulnerability, the attacker would need valid user credentials with any of the following
  roles:\r\n\r \r Administrator\r Security approver\r Intrusion admin\r Access admin\r
  Network admin"
