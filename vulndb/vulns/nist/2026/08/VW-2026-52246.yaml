title: "The Silicon Labs SiWx917 WiFi driver's transmit callback siwx91x_send() in
  drivers/wifi/siwx91x/siwx91x_wifi.c frees a network packet it does not own. In the
  Zephyr TX path the net_pkt is owned by the L2/networking stack; the driver only
  borrows it to copy the frame bytes into a local net_buf. Before the fix, after transmitting,
  siwx91x_send() additionally called net_pkt_unref(pkt) on the caller-owned packet,
  dropping its last reference and returning it to the shared packet pool prematurely.
  This code path is compiled in by default (CONFIG_WIFI_SILABS_SIWX91X_NET_STACK_NATIVE).\n\
  \nThe caller, ethernet_send() in subsys/net/l2/ethernet/ethernet.c, keeps using
  the packet after the driver returns: it reads net_pkt_get_len(pkt), updates TX statistics,
  and then performs its own net_pkt_unref(pkt). Because the driver already released
  the packet, these are use-after-free reads followed by a second unref (a double
