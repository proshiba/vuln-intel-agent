title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs3:
  fix out-of-bounds read in decompress_lznt\n\ndecompress_lznt() does not validate
  array index bounds before accessing\nthe decompression table. A corrupted NTFS3
  image with invalid compressed\ndata can trigger an out-of-bounds read.\n\nAdd index
  bounds checking to prevent the OOB access."
