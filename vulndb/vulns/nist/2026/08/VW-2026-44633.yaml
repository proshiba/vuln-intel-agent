title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Repost Receive buffers for malformed replies\n\nrpcrdma_wc_receive() decrements
  the transport's Receive count for\nevery completion before it dispatches a successful
  Receive to\nrpcrdma_reply_handler(). The handler must post a replacement\nReceive
  WR before returning unless ownership of the rep has moved\nelsewhere, as on the
  backchannel path.\n\nCommit 2ae50ad68cd7 (\"xprtrdma: Close window between waking
  RPC\nsenders and posting Receives\") moved the Receive refill out of\nrpcrdma_wc_receive(),
  where it had run ahead of every reply, into\nrpcrdma_reply_handler() so that the
  responder's credit grant could\nbe parsed before reposting. The bad-version and
  short-reply exits\nnever reach that refill: they recycle the rep and return without\n\
  calling rpcrdma_post_recvs().\n\nA remote peer can therefore drain the client's
  posted Receive\nqueue by sending a sustained stream of replies that are shorter\n\
  than the fixed transport header "
