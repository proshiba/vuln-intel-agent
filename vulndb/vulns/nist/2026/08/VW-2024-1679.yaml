title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  esp: fix bad handling of pages from page_pool\n\nWhen the skb is reorganized during
  esp_output (!esp->inline), the pages\ncoming from the original skb fragments are
  supposed to be released back\nto the system through put_page. But if the skb fragment
  pages are\noriginating from a page_pool, calling put_page on them will trigger a\n\
  page_pool leak which will eventually result in a crash.\n\nThis leak can be easily
  observed when using CONFIG_DEBUG_VM and doing\nipsec + gre (non offloaded) forwarding:\n\
  \n  BUG: Bad page state in process ksoftirqd/16  pfn:1451b6\n  page:00000000de2b8d32
  refcount:0 mapcount:0 mapping:0000000000000000 index:0x1451b6000 pfn:0x1451b6\n\
  \  flags: 0x200000000000000(node=0|zone=2)\n  page_type: 0xffffffff()\n  raw: 0200000000000000
  dead000000000040 ffff88810d23c000 0000000000000000\n  raw: 00000001451b6000 0000000000000001
  00000000ffffffff 0000000000000000\n  page dumped because: page_pool leak\n  Modules
  linke"
