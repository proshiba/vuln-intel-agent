title: Flowise versions before 3.1.3 contain a remote code execution 
  vulnerability in the Custom MCP node when CUSTOM_MCP_PROTOCOL is set to stdio,
  allowing authenticated users to execute arbitrary commands by manipulating 
  environment variables and command arguments. Attackers can abuse 
  PYTHONWARNINGS and BROWSER environment variables with python3, or leverage the
  root working directory with node to bypass validation and execute system 
  commands.
