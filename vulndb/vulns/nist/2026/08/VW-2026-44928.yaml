title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigbvf:
  Fix leak in TX DMA error cleanup\n\nIf an error is encountered while mapping TX
  buffers, the driver should\nunmap any buffers already mapped for that skb.\n\nBecause
  count is incremented before each frag mapping, it will always\nmatch the correct
  number of unmappings needed when dma_error is reached.\nDecrementing count before
  the while loop in dma_error causes an\noff-by-one error. If any mapping was successful
  before an unsuccessful\nmapping, exactly one DMA mapping (the head) would leak.\n\
  \nThis bug was introduced by a 2010 fix for an endless loop in dma_error.\nAll other
  affected drivers have already been fixed."
