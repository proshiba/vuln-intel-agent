title: 'github.com/graphql-go/graphql (GraphQL for Go) through 0.8.1 does not validate
  that a scalar variable value matches its declared type. The built-in coerceString
  and coerceBool functions (scalars.go) accept input whose type does not match the
  declared String, ID, or Boolean scalar instead of raising the request error that
  the GraphQL specification mandates. In some cases (but not any typical case of JSON
  sent to a website), a deeply nested value leads to an unrecoverable "fatal error:
  stack overflow" condition.'
