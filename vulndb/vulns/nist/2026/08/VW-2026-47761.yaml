title: n8n before 1.123.69, 2.33.4, and 2.34.1 contains a stored cross-site 
  scripting vulnerability in the Form node's completion page. The completion 
  page applied its sandboxing Content-Security-Policy only when respondWith was 
  not set to 'redirect', but responseText was always rendered as raw HTML. An 
  authenticated member could set respondWith to 'redirect' via an expression 
  while keeping responseText populated, causing the completion page to serve 
  unsanitized HTML and script from the n8n origin. Any visitor who submitted the
  resulting public form would have that script execute same-origin with their 
  session.
