title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  vivid: fix cleanup bugs in vivid_init()\n\nWhen platform_device_register() fails
  in vivid_init(), the embedded\nstruct device in vivid_pdev has already been initialized
  by\ndevice_initialize(), but the failure path jumps to free_output_strings\nwithout
  dropping the device reference for the current platform device:\n\n  vivid_init()\n\
  \    -> platform_device_register(&vivid_pdev)\n       -> device_initialize(&vivid_pdev.dev)\n\
  \       -> setup_pdev_dma_masks(&vivid_pdev)\n       -> platform_device_add(&vivid_pdev)\n\
  \nThis leads to a reference leak when platform_device_register() fails.\nFix this
  by calling platform_device_put() before jumping to the common\ncleanup path.\n\n\
  Also, the unreg_driver label incorrectly calls\nplatform_driver_register() instead
  of platform_driver_unregister(),\nwhich breaks cleanup when workqueue creation fails
  after successful\ndriver registration. Fix that as well.\n\nThe reference leak was
  identified by a s"
