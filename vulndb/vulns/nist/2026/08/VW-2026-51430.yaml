title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  validate resident attribute lists and harden the validator\n\nA base inode's $ATTRIBUTE_LIST
  is sanity-checked by load_attribute_list()\nonly on the non-resident path; ntfs_read_locked_inode()
  copies a *resident*\nattribute list into ni->attr_list with a plain memcpy() and
  no validation\nat all. Every subsequent walk of ni->attr_list --\nntfs_external_attr_find(),
  ntfs_inode_attach_all_extents() and\nntfs_attrlist_need() -- then trusts the entries
  are well-formed and reads\nattr_list_entry fixed-header fields\n(lowest_vcn at offset
  8, mft_reference at offset 16, and the name) with\nbounds that assume validation
  already happened. A crafted resident\nattribute list therefore reaches those walks
  unvalidated and can drive\nout-of-bounds reads of the attribute-list buffer.\n\n\
  load_attribute_list() itself reads ale->name_offset (offset 7),\nale->mft_reference
  (offset 16) and the name length under only an\n\"al < al_start + size\" bound"
