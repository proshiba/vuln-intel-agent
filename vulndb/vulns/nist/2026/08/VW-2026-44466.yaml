title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  atm: reject out-of-range traffic classes in QoS validation\n\nReject ATM traffic
  classes above ATM_ANYCLASS in check_tp().\nSO_ATMQOS stores the supplied QoS after
  check_qos() succeeds, so\naccepting larger values leaves invalid traffic_class values
  in\nvcc->qos.\n\nThat bad state later reaches pvc_info(), which indexes class_name[]\n\
  with vcc->qos.{rx,tp}.traffic_class. Values above ATM_ANYCLASS cause\nan out-of-bounds
  read when /proc/net/atm/pvc is read.\n\nTighten the existing QoS validation so invalid
  traffic_class values\nare rejected at the point where user supplied QoS is accepted."
