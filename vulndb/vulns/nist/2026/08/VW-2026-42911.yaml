title: "The Linkable Loadable Extensions (llext) subsystem mis-handles PLT/RELA relocation
  entries when linking a relocatable (partially-linked) ELF extension. In llext_link_plt()
  (subsys/llext/llext_link.c), the relocatable branch (tgt != NULL, the path used
  for Xtensa relocatable objects) computed the patch address as ext->mem[LLEXT_MEM_TEXT]
  - text.sh_offset + rela.r_offset + tgt->sh_offset and then performed the relocation
  write there without validating rela.r_offset. Its sibling shared/dynamic branch
  already rejected out-of-range offsets via llext_file_offset().\n\nrela.r_offset
  is read directly from the ELF's RELA table, so a crafted entry with an offset larger
  than the target section makes the write land arbitrarily far outside the extension's
  text buffer. The result is an attacker-influenced out-of-bounds write (the location
  via r_offset, the written value being the resolved symbol address) performed in
  supervisor context at link time, before any extension code runs.\n\nThe path is
  reached"
