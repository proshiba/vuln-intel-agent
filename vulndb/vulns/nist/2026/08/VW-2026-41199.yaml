title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  reject out-of-range ptype in ice_parser_profile_init\n\nset_bit(rslt->ptype, prof->ptypes)
  operates on a DECLARE_BITMAP of\nICE_FLOW_PTYPE_MAX (1024) bits. Nothing prevents
  a malicious VF from\nproviding ptype >= 1024 through VIRTCHNL, resulting in a write
  past\nthe end of the bitmap and a kernel page fault.\n\nReproduced with a custom
  kernel module injecting a crafted\nVIRTCHNL_OP_ADD_RSS_CFG on E810-C QSFP (8086:1592),\n\
  FW 4.91 0x800214af 1.3909.0, ICE COMMS DDP 1.3.53.0,\nkernel 7.1.0-rc1.\n\ncrash_parser:
  ice_parser_profile_init @ ffffffffc0d61b60\ncrash_parser: setting ptype=0xffff (max
  valid=1023)\ncrash_parser: calling ice_parser_profile_init -- expect OOB crash!\n\
  BUG: kernel NULL pointer dereference, address: 0000000000000000\nOops: Oops: 0002
  [#1] SMP NOPTI\nCPU: 56 UID: 0 PID: 165011 Comm: insmod Kdump: loaded Tainted: G
  S U OE 7.1.0-rc1 #1\nHardware name: Intel Corporation S2600BPB/S2600BPB\nRIP: 0010:ice_parser_profile_"
