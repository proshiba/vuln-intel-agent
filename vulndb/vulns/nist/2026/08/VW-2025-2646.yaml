title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix call timer start racing with call destruction\n\nThe rxrpc_call struct has a
  timer used to handle various timed events\nrelating to a call.  This timer can get
  started from the packet input\nroutines that are run in softirq mode with just the
  RCU read lock held.\nUnfortunately, because only the RCU read lock is held - and
  neither ref or\nother lock is taken - the call can start getting destroyed at the
  same time\na packet comes in addressed to that call.  This causes the timer - which\n\
  was already stopped - to get restarted.  Later, the timer dispatch code may\nthen
  oops if the timer got deallocated first.\n\nFix this by trying to take a ref on
  the rxrpc_call struct and, if\nsuccessful, passing that ref along to the timer.\
  \  If the timer was already\nrunning, the ref is discarded.\n\nThe timer completion
  routine can then pass the ref along to the call's work\nitem when it queues it.\
