title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix hugetlb cgroup rsvd charge/uncharge mismatch\n\nIn alloc_hugetlb_folio(), a
  single h_cg pointer is used for both the rsvd\nand non-rsvd hugetlb cgroup charges.\
  \  When map_chg is set,\nhugetlb_cgroup_charge_cgroup_rsvd() stores the charged
  cgroup in h_cg, but\nthe immediately following hugetlb_cgroup_charge_cgroup() overwrites
  h_cg\nwith the non-rsvd cgroup pointer.\n\nAs a result, hugetlb_cgroup_commit_charge_rsvd()
  stores the wrong\n(non-rsvd) cgroup pointer into the folio's rsvd slot.\n\nWhen
  the folio is later freed, free_huge_folio() unconditionally calls\nboth hugetlb_cgroup_uncharge_folio()
  and\nhugetlb_cgroup_uncharge_folio_rsvd().  The rsvd uncharge reads back the\nwrong
  cgroup from the folio and decrements a counter that was never\ncharged for that
  cgroup, causing a page_counter underflow:\n\n  page_counter underflow: -512 nr_pages=512\n\
  \  WARNING: mm/page_counter.c:61 at page_counter_cancel\n\nFix this by introduc"
