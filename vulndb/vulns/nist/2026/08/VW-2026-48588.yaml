title: hashcat contains a heap-based buffer overflow (out-of-bounds write) in 
  the outfile_write() function in src/outfile.c. When assembling output into a 
  fixed-size buffer (HCBUFSIZ_LARGE, ~16 MB), the function sequentially appends 
  the username, separator, hash, and plaintext via memcpy without validating 
  that the accumulated length stays within the buffer capacity. When run with 
  --username --show against a crafted hash file containing an oversized username
  that nearly fills the buffer, the total assembled output exceeds the buffer, 
  causing a heap buffer overflow that can corrupt memory and crash the process.
