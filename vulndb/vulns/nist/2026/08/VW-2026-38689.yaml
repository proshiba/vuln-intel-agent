title: The Kadence Blocks — Page Builder Toolkit for Gutenberg Editor plugin for
  WordPress is vulnerable to Stored Cross-Site Scripting via 'toggleIcon' Block 
  Attribute in all versions up to, and including, 3.7.8 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with contributor-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page.
