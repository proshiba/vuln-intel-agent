title: Claude Code Templates is a CLI tool for configuring and monitoring Claude
  Code. Prior to 1.29.4, the Claude Code Studio server launched by the --studio 
  option in cli-tool/src/sandbox-server.js binds to all interfaces on port 3444,
  permits cross-origin requests, and requires no authentication. The POST 
  /api/execute endpoint passes the prompt request-body field to 
  executeLocalTask(), and POST /api/install-agent passes the agentName 
  request-body field to a child process. The same unsafe agent field path is 
  reachable from /api/execute through checkAndInstallAgent(). These 
  attacker-controlled values reach child_process.spawn() with shell execution 
  enabled, causing Node.js to construct a shell command in which metacharacters 
  are interpreted. An attacker who can reach the port directly, or who convinces
  a developer running Studio to visit a malicious website, can execute arbitrary
  operating-system commands with the developer's privileges and compromise 
  source code, credentials, and local data
