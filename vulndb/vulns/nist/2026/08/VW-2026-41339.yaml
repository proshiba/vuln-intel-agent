title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Return error on non-migratable faults requiring devmem\n\nNon-migratable faults
  that require devmem incorrectly jump to the 'out'\nlabel, which squashes the error
  code intended to be returned to the\nupper layers. Fix this by returning -EACCES
  instead.\n\n(cherry picked from commit c4508edb2c723de93717272488ea65b165637eac)"
