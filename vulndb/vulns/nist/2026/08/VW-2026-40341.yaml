title: "In multi-tenant deployments, the Publisher REST APIs fail to enforce tenant
  isolation correctly. This allows a user in one tenant, possessing sufficient privileges
  to invoke these APIs, to perform operations that impact other tenants.\n\nThe vulnerability
  allows a privileged user to perform publisher operations such as exposing or modifying
  API Metadata in another tenant environment. This impact is only realized in multi-tenant
  deployments."
