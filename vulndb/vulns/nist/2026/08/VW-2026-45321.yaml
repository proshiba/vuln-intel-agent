title: New API is a large language mode (LLM) gateway and artificial 
  intelligence (AI) asset management system. Prior to 1.0.0-rc.7, the admin user
  list and user lookup APIs, including GET /api/user/, return User.AccessToken 
  as access_token because User model objects are serialized after queries use 
  Omit("password"), allowing an authenticated administrator to obtain the root 
  user's bearer token and access root-only system configuration APIs. This issue
  is fixed in version 1.0.0-rc.7.
