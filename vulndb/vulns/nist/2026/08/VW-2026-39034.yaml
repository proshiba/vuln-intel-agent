title: SiYuan versions <= v3.7.2 expose the /api/search/searchEmbedBlock 
  endpoint, which passes a client-supplied SQL statement verbatim to the main 
  read-write siyuan.db handle with no single-statement, read-only, or admin 
  restrictions. The endpoint is gated only by CheckAuth, making it reachable by 
  the publish RoleReader token and by anonymous users when publish 
  authentication is disabled. Because the underlying driver executes stacked 
  statements, an attacker can read and modify content across all opened 
  cleartext notebooks (encrypted per-box notebooks are excluded). Fixed in 
  v3.7.3.
