title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Guard management mailbox channel cleanup against NULL pointer\n\nThe management
  mailbox channel cleanup helpers can be called from\nerror handling paths when mgmt_chann
  has already been destroyed.\n\nAdd NULL checks to xdna_mailbox_free_channel() and\n\
  xdna_mailbox_stop_channel() so the cleanup path safely returns instead\nof dereferencing
  a NULL mailbox channel pointer."
