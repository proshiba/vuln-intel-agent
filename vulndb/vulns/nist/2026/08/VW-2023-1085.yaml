title: 'Vulnerability in the Oracle Agile PLM product of Oracle Supply Chain (component:
  WebClient).   The supported version that is affected is 9.3.6. Easily exploitable
  vulnerability allows low privileged attacker with network access via HTTP to compromise
  Oracle Agile PLM.  Successful attacks require human interaction from a person other
  than the attacker and while the vulnerability is in Oracle Agile PLM, attacks may
  significantly impact additional products (scope change). Successful attacks of this
  vulnerability can result in  unauthorized update, insert or delete access to some
  of Oracle Agile PLM accessible data as well as  unauthorized read access to a subset
  of Oracle Agile PLM accessible data. CVSS 3.1 Base Score 5.4 (Confidentiality and
  Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N).'
