title: The Form Maker by 10Web – Mobile-Friendly Drag & Drop Contact Form 
  Builder plugin for WordPress is vulnerable to blind SQL Injection via 
  '{username}' Placeholder in Dynamic-Choice Field WHERE Clause in all versions 
  up to, and including, 1.15.44 due to insufficient escaping on the user 
  supplied parameter and lack of sufficient preparation on the existing SQL 
  query. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. This requires that a form is configured with a DB-backed 
  dynamic choice field whose WHERE template references the {username} 
  placeholder, and the attacker must first set their own display_name to a SQL 
  payload via the standard WordPress profile edit screen before triggering the 
  fm_reload_input AJAX endpoint.
