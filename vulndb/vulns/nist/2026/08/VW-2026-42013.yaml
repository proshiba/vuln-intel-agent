title: A remote code execution vulnerability in Apioo Fusio 8.8.3 allows 
  authenticated users with the Developer role to execute arbitrary OS commands 
  by exploiting a PHP-Sandbox allow-list bypass. The sandbox allow-list permits 
  functions that transitively invoke system(), enabling a developer to escape 
  the sandbox and gain OS command execution on the server. An attacker with a 
  Developer-role account can achieve full server compromise.
