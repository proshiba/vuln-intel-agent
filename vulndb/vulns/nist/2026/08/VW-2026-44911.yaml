title: "In the Linux kernel, the following vulnerability has been resolved:\n\num:
  vector: fix use-after-free in vector_mmsg_rx()\n\nWhen vector_mmsg_rx() discards
  a packet whose overlay header fails\nverify_header(), it frees the skb and continues
  the loop:\n\n\tif (header_check < 0) {\n\t\tdev_kfree_skb_irq(skb);\n\t\tvp->estats.rx_encaps_errors++;\n\
  \t\tcontinue;\n\t}\n\nThe normal and short-packet paths fall through to the bottom
  of the\nloop body, which clears the consumed slot and advances the cursors:\n\n\t
  (*skbuff_vector) = NULL;\n\tmmsg_vector++;\n\tskbuff_vector++;\n\nThe verify_header()
  < 0 path skips that via continue, so the freed skb\nis left in skbuff_vector[] and
  the cursors do not advance. The next\niteration reads the same slot, gets the freed
  skb, and frees it again,\nproducing a refcount underflow / use-after-free in the
  RX path.\n\nDiscard the slot the same way the other paths do before continuing.\n\
  \nOnly transports whose verify_header() can return negative are affected:\nGRE and
  L2TPv3 do so on a cookie/sessio"
