title: rsync before 3.5.0 contains a newline injection vulnerability in the 
  name-converter uid/gid mapping interface that allows local attackers to forge 
  protocol messages by creating user or group names containing newline 
  characters. Attackers can inject malicious newline characters into names 
  communicated over the pipe-based line-oriented protocol to cause the rsync 
  daemon to process attacker-influenced data as legitimate protocol input, 
  corrupting uid/gid mapping logic.
