title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngeneve:
  require CAP_NET_ADMIN in the device netns for changelink\n\nA tunnel changelink()
  operates on at most two netns, dev_net(dev) and\nthe sticky underlay netns geneve->net.
  They differ once the device is\ncreated in or moved to a netns other than the one
  the request runs in.\nThe rtnl changelink path checks CAP_NET_ADMIN only against
  dev_net(dev),\nso a caller privileged there but not in geneve->net can rewrite a
  geneve\ndevice whose underlay lives in geneve->net.\n\ngeneve_changelink() applies
  the new configuration against geneve->net:\ngeneve_link_config() and the geneve_quiesce()/geneve_unquiesce()
  pair\nreopen the underlay sockets in that netns (geneve_sock_add() uses\ngeneve->net),
  so the same reasoning as the tunnel changelink series\napplies here.\n\nGate geneve_changelink()
  with rtnl_dev_link_net_capable(), at the top of\nthe op before any attribute is
  parsed, matching ipgre_changelink() and\nthe rest of the \"require CAP_"
