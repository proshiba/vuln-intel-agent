title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_qca: fix NULL pointer dereference in qca_dmp_hdr() for non-serdev device\n\n\
  hu->serdev is NULL for hci_uart attached via non-serdev paths, but\nqca_dmp_hdr()
  unconditionally dereferences hu->serdev->dev.driver->name,\ncausing a NULL pointer
  dereference.\n\nFix by guarding the dereference with a NULL check and falling back
  to\n\"hci_ldisc_qca\" for the non-serdev case."
