title: "The PSA Protected Storage credential backend (subsys/net/lib/tls_credentials/tls_credentials_trusted.c)
  declared its credential-store mutex as a plain zero-filled static struct k_mutex
  credential_lock; and never called k_mutex_init() on it. A statically zero-filled
  k_mutex has an uninitialized wait queue (its dlist head/tail are NULL instead of
  the self-referential sentinels that k_mutex_init/K_MUTEX_DEFINE install). The uncontended
  lock path does not touch the wait queue, so the defect is latent and serialized
  use behaves correctly.\n\nWhen two execution contexts contend on the lock, k_mutex_lock()
  pends the blocking thread on the wait queue via z_pend_curr(), which calls sys_dlist_append()
  on the zeroed list and dereferences a NULL tail pointer (tail->next = node), faulting
  the kernel. The lock is held during TLS handshake credential loading and by all
