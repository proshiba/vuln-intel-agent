title: FreePBX is an open source IP PBX. From 16.0.0 until 16.0.11 and 17.0.4, 
  the FreePBX missedcall module places the inbound Caller ID name from crafted 
  SIP From headers into the missedcalllog INSERT in agi-bin/missedcallnotify.php
  without escaping or bound parameters. An unauthenticated caller can inject SQL
  when a monitored extension goes unanswered, corrupting the database and 
  modifying FreePBX administrator accounts to obtain unauthorized remote access.
  This issue is fixed in versions 16.0.11 and 17.0.4.
