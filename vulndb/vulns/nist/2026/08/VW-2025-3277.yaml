title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Don't clone flow post action attributes second time\n\nThe code already clones post
  action attributes in\nmlx5e_clone_flow_attr_for_post_act(). Creating another copy
  in\nmlx5e_tc_post_act_add() is a erroneous leftover from original\nimplementation.
  Instead, assign handle->attribute to post_attr provided by\nthe caller. Note that
  cloning the attribute second time is not just\nwasteful but also causes issues like
  second copy not being properly updated\nin neigh update code which leads to following
  use-after-free:\n\nFeb 21 09:02:00 c-237-177-40-045 kernel: BUG: KASAN: use-after-free
  in mlx5_cmd_set_fte+0x200d/0x24c0 [mlx5_core]\nFeb 21 09:02:00 c-237-177-40-045
  kernel:  kasan_report+0xbb/0x1a0\nFeb 21 09:02:00 c-237-177-40-045 kernel:  kasan_save_stack+0x1e/0x40\n\
  Feb 21 09:02:00 c-237-177-40-045 kernel:  kasan_set_track+0x21/0x30\nFeb 21 09:02:00
  c-237-177-40-045 kernel:  __kasan_kmalloc+0x7a/0x90\nFeb 21 09:02:00 c-237-177"
