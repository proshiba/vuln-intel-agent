  firmware copies into the event:\n\n\tsinfo->assoc_req_ies = &event->data[len];\n\
  \tlen = (u8 *)sinfo->assoc_req_ies - (u8 *)&event->frame_control;\n\tsinfo->assoc_req_ies_len
  = le16_to_cpu(event->len) - (u16)len;\n\nevent->len is supplied by the device firmware
  and is never validated,\nand the subtraction is unchecked.  assoc_req_ies points
  into\nadapter->event_body[MAX_EVENT_SIZE], a fixed-size array embedded in the\n\
