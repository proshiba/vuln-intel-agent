title: pdfme pdf-lib versions before 5.5.10 contain an unbounded buffer growth 
  vulnerability in the DecodeStream.ensureBuffer() method that allows attackers 
  to cause denial of service by supplying a crafted PDF with a FlateDecode 
  stream containing a decompression bomb. Attackers can upload a small 
  compressed PDF that decompresses to hundreds of megabytes, exhausting memory 
  and crashing the Node.js process or freezing browser tabs during PDF parsing.
