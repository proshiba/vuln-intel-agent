title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio_ccw:
  Fix out of bounds check on CCW array\n\nThe routine ccwchain_calc_length() counts
  the number of channel\ncommand words (CCWs) that are chained together in a single
  channel\nprogram, and rejects anything larger than CCWCHAIN_LEN_MAX (256) CCWs.\n\
  \nThe loop itself is \"do..while (count < 257)\", and while the logic in\nis_cpa_within_range()
  correctly adjusts between the 0-index array of\nCCWs and the count of CCWs starting
  at 1, this means it would look\nat a possible 257th CCW before ending the loop and
  (correctly)\nreturning an error.\n\nFix this by restructuring the loop to break
  as soon as 256 CCWs\n(thus indexes 0-255) are examined, without looking at memory\n\
  outside the range."
