title: In Zabbix 7.4 the cryptographic key used for signing Frontend sessions 
  has been erroneously written to the database seed. Currently the only known 
  exploitation scenario is for deployments that utilize both - SAML 
  authentication and guest users. In such cases the key can be used to forge 
  valid session cookies, potentially leading to unauthorized access. For other 
  Zabbix deployments this does not have a known impact.
