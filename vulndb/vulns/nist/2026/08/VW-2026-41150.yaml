title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/khugepaged:
  write all dirty file folios when collapsing\n\n[There is no upstream commit, as
  this code was removed by upstream\n commit 044925f9b565 (\"mm: fs: remove filemap_nr_thps*()
  functions and their users\")]\n\nAs-is, khugepaged and writable-file opening exclude
  each other. A file\ncannot be open writeable and have THPs (because the filesystem
  is not aware\nof them). khugepaged will never collapse file pages for files that
  are\nopened writeable. On an open(O_RDWR/O_WRONLY), the page cache for that\nparticular
  file is dropped. This is fine because nothing could've been\ndirtied.\n\nHowever,
  there is an edge-case: collapse_file() might not be able to\ncoexist with concurrent
  writers, but it can coexist with dirty folios\n(from previous writers). Therefore,
  the following can happen:\n\nopen(file, O_RDWR)\nwrite(file)\nclose(file)\nmadvise(file_mapping,
  MADV_COLLAPSE, some non-dirty range)\nopen(file, O_RDWR)\n nr_thps > 0\n  truncate_"
