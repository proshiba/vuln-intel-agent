title: An attacker that can send mail to a user can craft a message whose 
  headers contain a very large number of email addresses or MIME parameters, 
  which causes excessive memory usage when the message is later parsed. The 
  message is still delivered, but reading it over IMAP can exhaust the memory 
  limit of the process and terminate it, causing denial of service for the 
  affected user. Update to non-vulnerable version. No publicly available 
  exploits are known.
