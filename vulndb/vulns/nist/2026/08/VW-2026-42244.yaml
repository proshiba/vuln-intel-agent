title: 'Protection mechanism failure for some Intel(R) Transfer Learning Tool before
  version v0.7 within Ring 3: User Applications may allow an escalation of privilege.
  Unprivileged software adversary with an unauthenticated user combined with a low
  complexity attack may enable escalation of privilege. This result may potentially
  occur via network access when attack requirements are present without special internal
  knowledge and requires no user interaction. The potential vulnerability may impact
