title: pg-aiguide started its MCP HTTP transport without enabling the host 
  allow-list the underlying SDK provides. src/httpServer.ts called the shared 
  httpServerFactory helper and never set the DNS-rebinding-protection option, so
  the transport accepted a request whatever host it named. A page in a browser 
  could therefore point a name it controlled at the address the server was bound
  to and drive the locally reachable MCP server through the visitor's browser. 
  The protection was already available in the packaged transport and simply not 
  turned on, so updating the dependency alone would not have closed it. Version 
  0.5.1 passes the option explicitly.
