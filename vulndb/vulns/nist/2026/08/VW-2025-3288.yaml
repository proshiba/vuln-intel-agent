title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  flakey: don't corrupt the zero page\n\nWhen we need to zero some range on a block
  device, the function\n__blkdev_issue_zero_pages submits a write bio with the bio
  vector pointing\nto the zero page. If we use dm-flakey with corrupt bio writes option,
  it\nwill corrupt the content of the zero page which results in crashes of\nvarious
  userspace programs. Glibc assumes that memory returned by mmap is\nzeroed and it
  uses it for calloc implementation; if the newly mapped\nmemory is not zeroed, calloc
  will return non-zeroed memory.\n\nFix this bug by testing if the page is equal to
  ZERO_PAGE(0) and\navoiding the corruption in this case."
