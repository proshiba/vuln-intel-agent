title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  fix UAF around queue destruction\n\nWe currently do stuff like queuing the final
  destruction step on a\nrandom system wq, which will outlive the driver instance.
  With bad\ntiming we can teardown the driver with one or more work workqueue still\n\
  being alive leading to various UAF splats. Add a fini step to ensure\nuser queues
  are properly torn down. At this point GuC should already be\nnuked so queue itself
  should no longer be referenced from hw pov.\n\nv2 (Matt B)\n - Looks much safer
  to use a waitqueue and then just wait for the\n   xa_array to become empty before
  triggering the drain.\n\n(cherry picked from commit 861108666cc0e999cffeab6aff17b662e68774e3)"
