title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-log:
  fix a bitset_size overflow on 32bit machines\n\nCommit c20e36b7631d (\"dm log: fix
  out-of-bounds write due to\nregion_count overflow\") made sure that region_count
  could fit in an\nunsigned int. But the bitmap memory isn't allocated based on\n\
  region_count. It uses bitset_size (a size_t variable). The first step of\ncalculating
  bitset_size is to set it to region_count, rounded up to a\nmultiple of BITS_PER_LONG.
  If region_size is less than BITS_PER_LONG\nsmaller than UINT_MAX, it will get rounded
  up to 2^32. On a 32bit\narchitecture, this will make bitset_size wrap around to
  0 and fail,\ndespite region_count being valid.\n\nSince bitset_size gets divided
  by 8, it can hold any valid region_count.\nIt just needs a special case to handle
  the rollover. If it is 0, the\nvalue rolled over, and bitset size should be set
  to the number of bytes\nneeded to hold 2^32 bits."
