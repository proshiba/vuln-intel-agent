title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvlan:
  inherit needed_headroom and needed_tailroom from phy_dev\n\nipvlan devices inherit
  hard_header_len from phy_dev during ipvlan_init(),\nbut leave needed_headroom and
  needed_tailroom set to 0.\n\nWhen the underlying phy_dev (or stacked lower device)
  requires extra headroom\nor tailroom for headers/trailers (e.g. macsec, ipsec, wireguard,
  tunnels, or\nveth with rx headroom), upper layers calculating packet headroom and
  tailroom\nfail to reserve sufficient space.\n\nThis can result in reallocation overhead,
  skb headroom underflows, or KASAN\nslab-use-after-free crashes when dev_hard_header()
  / ipvlan_hard_header()\nprepends header data or when lower devices append tailroom.\n\
  \nFix this by:\n1. Inheriting needed_headroom and needed_tailroom from phy_dev in
  ipvlan_init().\n2. Propagating needed_headroom and needed_tailroom updates to attached
  ipvlans\n   in ipvlan_device_event() when receiving NETDEV_FEAT_CHANGE events."
