title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Ignore pending PV EOI if the vCPU has since disabled PV EOIs\n\nIgnore KVM's
  internal \"service pending PV EOI\" request if the vCPU has\ndisabled PV EOIs since
  the request was made.  Asserting that PV EOIs are\nenabled can fail if reading guest
  memory in pv_eoi_get_user() fails, i.e.\nif pv_eoi_test_and_clr_pending() bails
  early, *and* the vCPU also disables\nPV EOIs.\n\n  kernel BUG at arch/x86/kvm/lapic.c:3338!\n\
  \  Oops: invalid opcode: 0000 [#1] SMP\n  CPU: 4 UID: 1000 PID: 890 Comm: pv_eoi_test
  Not tainted 7.0.0-d585aa5894d8-vm #337 PREEMPT\n  Hardware name: QEMU Standard PC
  (Q35 + ICH9, 2009), BIOS 0.0.0 02/06/2015\n  RIP: 0010:kvm_lapic_sync_from_vapic+0x12b/0x140
  [kvm]\n  Call Trace:\n   <TASK>\n   kvm_arch_vcpu_ioctl_run+0x1075/0x1c30 [kvm]\n\
  \   kvm_vcpu_ioctl+0x2d5/0x980 [kvm]\n   __x64_sys_ioctl+0x8a/0xd0\n   do_syscall_64+0xb5/0xb40\n\
  \   entry_SYSCALL_64_after_hwframe+0x4b/0x53\n   </TASK>\n  Modules linked in: kvm_intel "
