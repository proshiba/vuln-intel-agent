title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  DR, Fix slab-out-of-bounds in mlx5_cmd_dr_create_fte\n\nWhen adding a rule with
  32 destinations, we hit the following out-of-band\naccess issue:\n\n  BUG: KASAN:
  slab-out-of-bounds in mlx5_cmd_dr_create_fte+0x18ee/0x1e70\n\nThis patch fixes the
  issue by both increasing the allocated buffers to\naccommodate for the needed actions
  and by checking the number of actions\nto prevent this issue when a rule with too
  many actions is provided."
