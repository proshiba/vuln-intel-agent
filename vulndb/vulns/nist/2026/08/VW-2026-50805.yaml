title: The ‘/ws/apitribuna/setVisita’ endpoint is vulnerable to SQL injection 
  through the id_video and id_ambito parameters. The application does not 
  validate or sanitize these inputs before including them in SQL queries. This 
  allows a remote attacker to inject SQL syntax and disrupt the execution of 
  queries, causing database errors and potentially manipulating visit tracking 
  records. Given the nature of the endpoint, this could also affect the 
  integrity of analytics and the accuracy of records.
