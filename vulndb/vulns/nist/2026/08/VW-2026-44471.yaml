title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc3-control: Use overflow checks in control_update size calc\n\nIn sof_ipc3_control_update(),
  the expected_size calculation uses\nfirmware-provided cdata->num_elems in arithmetic
  that could overflow\non 32-bit platforms, wrapping to a small value. This would
  allow the\ncdata->rhdr.hdr.size comparison to pass with mismatched sizes,\npotentially
  leading to out-of-bounds access in snd_sof_update_control.\n\nUse check_mul_overflow()
  and check_add_overflow() to detect and reject\noverflowed size calculations."
