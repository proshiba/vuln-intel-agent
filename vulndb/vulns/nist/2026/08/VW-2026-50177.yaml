title: TarsWeb enforces its per-application roles by calling AuthService from 
  individual controller methods, and four methods in 
  app/controller/patch/PatchController.js make no such call. uploadAndPublish 
  accepts a package upload and then builds and dispatches a deployment task to 
  every server matching the supplied application and module name, while its 
  sibling uploadPatchPackage, which only stores the package, does check 
  developer authorization first. The only precondition uploadAndPublish enforces
  is that the named server is registered, and any registered server in the 
  installation satisfies it. downloadPackage and deletePatchPackage select a 
