title: libjpeg-turbo 3.2.0 contains an integer division-by-zero vulnerability in
  the PNG loader. When processing a valid indexed-color PNG image with a 
  non-gray palette through tj3LoadImage12() or tj3LoadImage16() using the 
  default pixel format, the application may trigger a division-by-zero in 
  alloc_sarray(), causing a SIGFPE and denial of service.
