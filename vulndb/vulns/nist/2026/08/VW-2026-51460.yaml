title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  use proper context for logging\n\nThe same as the rest of the code, get_ss_info_from_atombios()
  uses\ncalc_pll_cs->ctx->logger for logging. But calc_pll_cs->ctx is\ninitialized
  only later in calc_pll_max_vco_construct(). Therefore, any\noutput using DC_LOG_SYNC()
  leads to a NULL pointer deference in\nget_ss_info_from_atombios().\n\nAccording
  to Sashiko, the very same problem exists in\ndce112_get_pix_clk_dividers() and dcn3_get_pix_clk_dividers()
  too.\n\nTo avoid accessing the NULL context, use clk_src->base.ctx->logger\neverywhere.
  That context in base is initialized earlier in\ndce110_clk_src_construct() and dce112_clk_src_construct().
  Before\nget_ss_info_from_atombios() or Sashiko's get_pix_clk_dividers functions\n\
  above are actually called. This is done by redefining DC_LOGGER to\nCTX->logger.\n\
  \nBefore:\ndce110_clk_src_construct() did:\n -> sets clk_src->base.ctx = ctx;\n\
  \ -> ss_info_from_atombios_create()\n   -> get_ss"
