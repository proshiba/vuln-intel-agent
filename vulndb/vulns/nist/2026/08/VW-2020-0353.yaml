title: "An information disclosure vulnerability exists when the Windows GDI component
  improperly discloses the contents of its memory. An attacker who successfully exploited
  the vulnerability could obtain information to further compromise the user’s system.\n\
  There are multiple ways an attacker could exploit the vulnerability, such as by
  convincing a user to open a specially crafted document, or by convincing a user
  to visit an untrusted webpage.\nThe security update addresses the vulnerability
  by correcting how the Windows GDI component handles objects in memory."
