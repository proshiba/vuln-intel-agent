title: "When Multi-Attribute Login is enabled, the login interface fails to consistently
  mask the existence of user accounts. For valid users, the server resolves and displays
  their canonical username, while for non-existent users, it echoes the original input.
  This occurs regardless of the validate_username configuration.\n\nThe discovery
  of valid usernames can increase the risk of brute force attacks, social engineering
  attacks, and targeted information leakage. Attackers can leverage this information
  to craft more effective phishing campaigns or social engineering tactics to compromise
  user accounts or extract sensitive data."
