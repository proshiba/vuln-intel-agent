title: The WP Travel Engine – Tour Booking Plugin – Tour Operator Software 
  plugin for WordPress is vulnerable to authorization bypass in all versions up 
  to, and including, 6.8.4. This is due to the plugin not properly verifying 
  that a user is authorized to perform an action. This makes it possible for 
  unauthenticated attackers to view private booking billing details — including 
  the victim customer's first name, last name, email address, street address, 
  city, and phone number — rendered as default values in checkout form fields by
  binding an arbitrary booking ID to the attacker's session. The only access 
  control on the endpoint is a frontend nonce that is publicly emitted to all 
  visitors via the wteL10n global on trip pages, meaning it provides CSRF 
  protection only and does not restrict unauthenticated access.
