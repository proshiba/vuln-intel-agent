title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  Fix possible leaked pernet namespace in smc_init()\n\nIn smc_init(), register_pernet_subsys(&smc_net_stat_ops)
  is called\nwithout any error handling.\nIf it fails, registering of &smc_net_ops
  won't be reverted.\nAnd if smc_nl_init() fails, &smc_net_stat_ops itself won't be
  reverted.\n\nThis leaves wild ops in subsystem linkedlist and when another module\n\
  tries to call register_pernet_operations() it triggers page fault:\n\nBUG: unable
  to handle page fault for address: fffffbfff81b964c\nRIP: 0010:register_pernet_operations+0x1b9/0x5f0\n\
  Call Trace:\n  <TASK>\n  register_pernet_subsys+0x29/0x40\n  ebtables_init+0x58/0x1000
  [ebtables]\n  ..."
