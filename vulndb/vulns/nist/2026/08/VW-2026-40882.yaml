title: A security vulnerability has been detected in IncomeStreamSurfer 
  roo-code-memory-bank-mcp-server up to 
  9dcb2fb5e6b65a35ac1983885a6d4e5621a0081e. This affects the function 
  readMemoryBankFile/appendMemoryBankEntry of the file src/index.ts of the 
  component read_memory_bank_file/append_memory_bank_entry. Such manipulation of
  the argument file_name leads to path traversal. The attack must be carried out
  locally. This product utilizes a rolling release system for continuous 
  delivery, and as such, version information for affected or updated releases is
  not disclosed. The project was informed of the problem early through an issue 
  report but has not responded yet.
