title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  options: reset DSS fields in case of unexpected size\n\nA remote peer could send
  a malformed DSS with a wrong size, followed by\nanother DSS or MPC + Data. In this
  case, the first suboption will be\nignored, but leaving some fields written, which
  could lead to\ninconsistency or access uninitialized data.\n\nExplicitly reset the
  fields that could have been modified in case of\nunexpected size."
