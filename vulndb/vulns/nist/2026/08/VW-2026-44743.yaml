title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7921: fix resource leak in probe error path\n\nWhen pcim_iomap_region()
  or devm_kmemdup() fail, the code returns\ndirectly without cleaning up previously
  allocated resources:\n  - mt76_device allocated by mt76_alloc_device()\n  - pci
  irq vectors allocated by pci_alloc_irq_vectors()\nFix this by jumping to the existing
  error cleanup path instead of\nreturning directly."
