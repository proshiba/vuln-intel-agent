title: "Improper authorization for CRUD operations on Project Roles and Project Role
  permissions for domain admins in CloudStack.\n\n\n\n\nA Domain Admin can create,
  update, delete, and list project roles and project role permissions for projects
  in any domain, not just their own. The check only confirms the caller is a Domain
  Admin, without verifying whether the target project belongs to their domain or subdomain.
  This allows a malicious Domain Admin to tamper with project roles and permissions
  across unrelated domains.\n\n\n\n\nThis issue affects Apache CloudStack: from 4.15.0.0
  through 4.20.3.0 and from 4.21.0.0 through 4.22.1.0.\n\n\n\n\n\nUsers are recommended
  to upgrade to version 4.20.3.1 or 4.22.1.1 or later, which fixes the issue."
