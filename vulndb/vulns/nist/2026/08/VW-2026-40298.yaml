title: "Inclusion of Functionality from Untrusted Control Sphere vulnerability in
  the HTML5 scrubber in rrrene html_sanitize_ex allows a remote attacker to load a
  document of their choosing into a trusted page via the data attribute of an <object>
  element in sanitized HTML. object is the one URI-bearing element in lib/html_sanitize_ex/scrubber/html5.ex
  never registered through allow_tag_with_uri_attributes/3, and its only guard is
  a prefix match on lowercase \"javascript:\", so mixed-case variants, data: URIs,
  protocol-relative URLs and same-origin paths all survive.\n\nThis is not unconditional
  cross-site scripting. A javascript: URL does not execute through <object data> in
  current browsers, data: documents load in an opaque origin, and host-origin script
  execution additionally requires the application to serve attacker-controlled content
  from a same-origin path.\n\nThis issue affects html_sanitize_ex: from 0.3.1 before
  1.5.3."
