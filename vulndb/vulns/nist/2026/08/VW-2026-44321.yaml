title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm:
  tpm_tis_spi: Use wait_woken() in wait_for_tmp_stat()\n\nwait_event_interruptible_timeout()
  evaluates its condition after setting\nthe current task state to TASK_INTERRUPTIBLE.\n\
  \nWith CONFIG_DEBUG_ATOMIC_SLEEP this triggers a warning when the IRQ wait\npath
  is used:\n\n    tpm_tis_status()\n      tpm_tis_spi_read_bytes()\n        tpm_tis_spi_transfer_full()\n\
  \          spi_bus_lock()\n            mutex_lock()\n\nAddress this with the following
  measures:\n\n1. Call wait_tpm_stat_cond() only while tasking is running.\n2. Use
  wait_woken() to wait for changes."
