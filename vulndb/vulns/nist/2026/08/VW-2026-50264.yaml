title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  validate GEM_CREATE domain combinations\n\nAMDGPU_GEM_CREATE checked domain bits
  against AMDGPU_GEM_DOMAIN_MASK,\nbut did not validate domain combinations. Userspace
  could combine\nCPU|GTT|VRAM with DOORBELL, GDS, GWS, or OA, making\namdgpu_bo_placement_from_domain()
  exceed AMDGPU_BO_MAX_PLACEMENTS and\nhit BUG_ON().\n\nAllow combinations only within
  CPU/GTT/VRAM, and require non-CPU/GTT/\nVRAM domains to be specified one at a time.
  Return -EINVAL for invalid\ncombinations in amdgpu_gem_create_ioctl().\n\nv2: Rename
  helper from amdgpu_gem_domain_valid() to\n    amdgpu_gem_are_domains_valid() (Christian)\n\
  \n(cherry picked from commit db39852d0c39843cb02048dfb47e4b8c703e9080)"
