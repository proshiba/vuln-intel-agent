title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntun:
  avoid double free in tun_free_netdev\n\nAvoid double free in tun_free_netdev() by
  moving the\ndev->tstats and tun->security allocs to a new ndo_init routine\n(tun_net_init())
  that will be called by register_netdevice().\nndo_init is paired with the desctructor
  (tun_free_netdev()),\nso if there's an error in register_netdevice() the destructor\n\
  will handle the frees.\n\nBUG: KASAN: double-free or invalid-free in selinux_tun_dev_free_security+0x1a/0x20
  security/selinux/hooks.c:5605\n\nCPU: 0 PID: 25750 Comm: syz-executor416 Not tainted
  5.16.0-rc2-syzk #1\nHardware name: Red Hat KVM, BIOS\nCall Trace:\n<TASK>\n__dump_stack
