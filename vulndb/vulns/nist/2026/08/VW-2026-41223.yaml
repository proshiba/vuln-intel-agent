title: "In the Linux kernel, the following vulnerability has been resolved:\n\namt:
  fix use-after-free in AMT delayed works\n\nWhen an AMT device is removed, pending
  delayed works can still access\nthe freed amt_dev structure, which may result in
  kernel crashes or\nmemory corruption.\n\namt_dev_stop() cancels req_wq and discovery_wq
  with\ncancel_delayed_work_sync(), but these works can be scheduled again\nfrom event_wq
  after the cancellation. This allows delayed works to\naccess the freed amt_dev structure
  after the netdev has been released.\n\nThe following is a simple race scenario:\n\
  \nCPU0                         CPU1\n\namt_dev_stop()\ncancel_delayed_work_sync()\n\
  \                             amt_event_work()\n                             mod_delayed_work(req_wq)\n\
  free netdev\n                             req_wq accesses freed amt_dev\n\nUse disable_delayed_work_sync()
