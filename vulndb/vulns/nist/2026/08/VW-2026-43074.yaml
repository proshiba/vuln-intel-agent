title: "Apache Airflow's secrets masker hides values stored under sensitive key names
  when they are displayed in the UI. The masker's recursion-depth limit did not descend
  into values nested inside a list, tuple, or set beyond that limit, so an Airflow
  Variable holding such a deeply-nested value was shown unmasked in the Variables
  UI. The exposure is limited to the UI: any authenticated user who can see the Variable
  in the UI can already read its full value through the Variables REST API, so this
  does not disclose data the user could not otherwise obtain — the masking is a shoulder-surfing
  defense for the UI, not an access-control boundary.\n\nThis is an incomplete-fix
  follow-up to CVE-2026-42358, whose fix made only the dictionary walk unbounded;
  lists, tuples, and sets beyond the depth limit remained unmasked in the UI. Deployments
  that applied the CVE-2026-42358 fix should also upgrade to address this residual
  case. Upgrade to apache-airflow 3.3.1 or later."
