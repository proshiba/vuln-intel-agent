title: "Tobit Laboratories AG TeamDavid's Webbox application exposes a functionality
  that allows the server to be \nshut down when a specific endpoint (/internalRestart)
  is accessed. This \nendpoint is accessible to unauthenticated users over the public\
  \ \nInternet. Instead of “restarting”, the server shuts completely down. As a\n\
  \ result, a remote attacker can trigger a persistent denial of service by\n shutting
  down the web server without requiring authentication. Recovery\n requires manual
  administrator intervention to restart the service. This issue affects TeamDavid
  through Rollout 524."
