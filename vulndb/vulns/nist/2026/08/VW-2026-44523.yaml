title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  avoid stale runlist element dereference in MFT writeback\n\nntfs_write_mft_block()
  maps each $MFT record through the $MFT data\nrunlist. For sub-folio clusters it
  looks up a struct runlist_element under\nni->runlist.lock, drops the lock, and later
  uses rl->length and rl->vcn\nwhen choosing folio_sz.\n\nThat pointer is only borrowed
  from ni->runlist.rl. Concurrent $MFT\nallocation extension can merge a replacement
  runlist under the same lock,\nand ntfs_rl_realloc() can free the old backing array.
  If that happens\nbetween the lookup and the later folio_sz decision, writeback can\n\
  dereference freed runlist storage.\n\nThe buggy scenario involves two paths, with
  each column showing the order\nwithin that path:\n\nMFT writeback path:        \
  \       $MFT allocation extension:\n1. Look up rl under               1. Extend
  the $MFT data allocation.\n   ni->runlist.lock.              2. Publish a replacement
  runlist.\n2. Drop ni->runlist.loc"
