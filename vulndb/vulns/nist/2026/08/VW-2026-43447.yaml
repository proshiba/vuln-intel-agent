title: WebErpMesv2 is a Resource Management and Manufacturing execution system 
  Web for industry. Versions 1.19 and prior allow any self-registered user to 
  upload arbitrary PHP files through the HR Expense scan_file parameter, leading
  to Remote Code Execution. Combined with open registration (no invite required)
  and broken role middleware (CheckUserRole silently swallows 
  RouteNotFoundException), this chain is effectively unauthenticated RCE against
  any default installation. The issue is patched in commit 
  5c54862fa044b363fd2be03d586750e81afd6818.
