title: ERPNext is a free and open source Enterprise Resource Planning tool. 
  Prior to 15.112.0 and 16.23.0, the ReceivablePayableReport prepare_conditions 
  path in erpnext/accounts/report/accounts_receivable/accounts_receivable.py 
  does not apply Customer and Supplier user permissions to the Payment Ledger 
  Entry dynamic-link party field, allowing any authenticated user to read 
  unauthorized cross-company financial data in Accounts Receivable and Accounts 
  Payable reports. This issue is fixed in versions 15.112.0 and 16.23.0.
