title: A vulnerability was found in PV-Bhat gemsuite-mcp 1.0.0. Affected by this
  issue is some unknown functionality of the file src/handlers/unified-gemini.ts
  of the component gemini_search/gemini_reason/gemini_process/gemini_analyze. 
  The manipulation of the argument file_path/file_paths results in path 
  traversal. The attack must be initiated from a local position. The project was
  informed of the problem early through an issue report but has not responded 
  yet.
