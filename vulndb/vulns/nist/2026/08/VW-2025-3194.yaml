title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Fix OOB read in indx_insert_into_buffer\n\nSyzbot reported a OOB read bug:\n\nBUG:
  KASAN: slab-out-of-bounds in indx_insert_into_buffer+0xaa3/0x13b0\nfs/ntfs3/index.c:1755\n\
  Read of size 17168 at addr ffff8880255e06c0 by task syz-executor308/3630\n\nCall
  Trace:\n <TASK>\n memmove+0x25/0x60 mm/kasan/shadow.c:54\n indx_insert_into_buffer+0xaa3/0x13b0
  fs/ntfs3/index.c:1755\n indx_insert_entry+0x446/0x6b0 fs/ntfs3/index.c:1863\n ntfs_create_inode+0x1d3f/0x35c0
  fs/ntfs3/inode.c:1548\n ntfs_create+0x3e/0x60 fs/ntfs3/namei.c:100\n lookup_open
  fs/namei.c:3413 [inline]\n\nIf the member struct INDEX_BUFFER *index of struct indx_node
  is\nincorrect, that is, the value of __le32 used is greater than the value\nof __le32
  total in struct INDEX_HDR. Therefore, OOB read occurs when\nmemmove is called in
  indx_insert_into_buffer().\nFix this by adding a check in hdr_find_e()."
