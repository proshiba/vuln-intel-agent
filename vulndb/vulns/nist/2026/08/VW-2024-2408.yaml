title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  avoid leaving partial pfn mappings around in error case\n\nAs Jann points out, PFN
  mappings are special, because unlike normal\nmemory mappings, there is no lifetime
  information associated with the\nmapping - it is just a raw mapping of PFNs with
  no reference counting of\na 'struct page'.\n\nThat's all very much intentional,
  but it does mean that it's easy to\nmess up the cleanup in case of errors.  Yes,
  a failed mmap() will always\neventually clean up any partial mappings, but without
  any explicit\nlifetime in the page table mapping itself, it's very easy to do the\n\
  error handling in the wrong order.\n\nIn particular, it's easy to mistakenly free
  the physical backing store\nbefore the page tables are actually cleaned up and (temporarily)
  have\nstale dangling PTE entries.\n\nTo make this situation less error-prone, just
  make sure that any partial\npfn mapping is torn down early, before any other error
  handling."
