title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  avoid use-after-free in poll trace queue dumps\n\nTIPC socket tracepoints dump queue
  state through tipc_sk_dump(). Most\nqueue-dump callsites already serialize that
  walk under the socket lock or\nsk->sk_lock.slock, but tipc_poll() calls trace_tipc_sk_poll(...,\n\
  TIPC_DUMP_ALL, ...) without holding either lock.\n\nThat lets the poll trace path
  reach tipc_list_dump() and backlog head/tail\ndumping while another context dequeues
  and frees an skb, leaving the trace\nhelper dereferencing a stale queue entry.\n\
  \nStop the unlocked poll trace site from requesting queue dumps. Other queue\ndump
  trace callsites keep their existing output under the locking they\nalready provide,
  while poll still emits the event itself without walking\nlive queue members from
  an unlocked context."
