title: A broken object-level authorization vulnerability in OpenSignLabs 
  opensignserver through 2.37.0 allows an unauthenticated remote attacker to 
  read complete contract records via the getDocument Parse cloud function. The 
  function fetches documents using useMasterKey, bypassing the object ACL, and 
  returns full records including sender and signer PII and a pre-signed document
  download URL whenever the document's IsEnableOTP flag is unset, which is the 
  default configuration.
