title: Blueprint Studio is a VS Code-like file editor for Home Assistant 
  configuration files. Prior to 2.5.2, Blueprint Studio backend API handlers in 
  custom_components/blueprint_studio/backend/api.py returned raw exception 
  strings to authenticated Home Assistant users. Some exception messages could 
  contain internal filesystem paths or implementation details. The disclosed 
  information could help an authenticated user fingerprint a Home Assistant 
  installation and refine follow-up attacks. This issue is fixed in version 
  2.5.2.
