title: Anki is a program for creating and reviewing flashcards. Prior to 
  25.09.3, endpoints in Anki's local HTTP server do not adequately constrain 
  requested media and built-in data paths, allowing scripts served from shared 
  decks, or malicious websites combined with an origin-check bypass, to read 
  local files through directory traversal. This issue is fixed in version 
  25.09.3.
