title: "Improper Neutralization of Special Elements used in an OS Command (OS Command
  Injection) vulnerability in livebook-dev livebook allows command injection into
  generated deployment setup commands.\n\nLivebookWeb.Hub.Teams.DeploymentGroupAgentComponent.docker_instructions/2
  and LivebookWeb.Hub.Teams.DeploymentGroupAgentComponent.fly_instructions/4 in lib/livebook_web/live/hub/teams/deployment_group_agent_component.ex
  interpolate deployment group environment variable values into the generated Docker
  and Fly.io setup commands without shell escaping. The values originate from the
  deployment group configuration and reach the sinks through Livebook.Hubs.Dockerfile.online_docker_info/3.\n\
  \nBoth sinks place the value inside a double-quoted shell word, so a value containing
