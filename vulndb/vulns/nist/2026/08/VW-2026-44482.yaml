title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/fb-helper:
  Only consider active CRTCs for vblank sync\n\nOnly synchronize fbdev output to the
  vblank of an active CRTC. Go over\nthe list of CRTCs and pick the first that matches.
  Fixes warnings as\nthe one shown below\n\n[   77.201354] WARNING: drivers/gpu/drm/drm_vblank.c:1320
  at drm_crtc_wait_one_vblank+0x194/0x1cc [drm], CPU#1: kworker/1:7/1867\n[   77.201354]
  omapdrm omapdrm.0: [drm] vblank wait timed out on crtc 0\n\nThis currently happens
  if the fbdev output is not on CRTC 0.\n\nAtomic and non-atomic drivers require distinct
  code paths. As for other\nfbdev operations, implement both and select the correct
  one at runtime.\n\nNot finding an active CRTC is not a bug. Do not wait in this
  case, but\nflush the display update as before.\n\nv4:\n- avoid possible deadlocks
  with locking context (Sashiko)\nv3:\n- drop excessive state validation (Jani)\n\
  - acquire plane and CRTC mutices (Sashiko)\nv2:\n- move look-up code into separate
  helper"
