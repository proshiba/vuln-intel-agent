title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  bound DeleteIndexEntryAllocation memmove length\n\nIn do_action()'s DeleteIndexEntryAllocation
  case, e->size comes\nfrom an on-disk INDEX_BUFFER entry.  When e->size makes\ne
  + e->size point past hdr + hdr->used,\nPtrOffset(e1, Add2Ptr(hdr, used)) returns
  a negative ptrdiff_t\nthat is silently cast to a quasi-infinite size_t when passed\n\
  to memmove().  The memmove then walks past the destination\nbuffer.\n\nThe sibling
  DeleteIndexEntryRoot case at fslog.c:3540-3543\nalready carries the corresponding
  guard:\n\n\tif (PtrOffset(e1, Add2Ptr(hdr, used)) < esize ||\n\t    Add2Ptr(e, esize)
  > Add2Ptr(lrh, rec_len) ||\n\t    used + esize > le32_to_cpu(hdr->total)) {\n\t\t
  goto dirty_vol;\n\t}\n\nApply the same shape to the allocation-path case.  Also
  reject\nesize == 0: memmove(e, e, ...) is a no-op and leaves\nhdr->used unchanged,
  hiding a malformed entry from the\nexisting check_index_header() walk.\n\nReproduced
  under UML+KASAN on mainline 8d9"
