title: A security flaw has been discovered in osCommerce 4.14.63493. Affected by
  this issue is the function EmailController of the file 
  app/lib/backend/controllers/EmailController.php of the component Email 
  Template Configuration. Performing a manipulation of the argument 
  email_templates_key results in sql injection. It is possible to initiate the 
  attack remotely. The exploit has been released to the public and may be used 
  for attacks. The vendor was contacted early about this disclosure but did not 
  respond in any way.
