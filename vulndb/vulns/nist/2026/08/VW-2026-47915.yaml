title: "An issue was discovered in vsDesk v14.0101. An authenticated attacker with
  administrative privileges can bypass client-side file validation in the \"Import
  via CSV\" component due to a lack of server-side validation. This allows the upload
  of an arbitrary file, which can lead to Remote Code Execution (RCE) within the context
  of the web application. \nApply patch from vendor  https://vsdesk.ru/ . Versions
  14.0402 and on have the patch."
