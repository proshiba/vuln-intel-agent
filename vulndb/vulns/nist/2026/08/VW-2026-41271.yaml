  timer: don't re-enter an instance callback that is still running\n\nThe userspace-driven
  timer (utimer) TRIGGER ioctl calls\nsnd_timer_interrupt() directly with no serialization,
  so two threads\ntriggering the same utimer can run snd_timer_interrupt() on one\n\
