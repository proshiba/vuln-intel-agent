title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Fix receive ring space parameters when XDP is active\n\nThe MTU setting at the time
  an XDP multi-buffer is attached\ndetermines whether the aggregation ring will be
  used and the\nrx_skb_func handler.  This is done in bnxt_set_rx_skb_mode().\n\n\
  If the MTU is later changed, the aggregation ring setting may need\nto be changed
  and it may become out-of-sync with the settings\ninitially done in bnxt_set_rx_skb_mode().\
  \  This may result in\nrandom memory corruption and crashes as the HW may DMA data
  larger\nthan the allocated buffer size, such as:\n\nBUG: kernel NULL pointer dereference,
  address: 00000000000003c0\nPGD 0 P4D 0\nOops: 0000 [#1] PREEMPT SMP NOPTI\nCPU:
  17 PID: 0 Comm: swapper/17 Kdump: loaded Tainted: G S         OE      6.1.0-226bf9805506
  #1\nHardware name: Wiwynn Delta Lake PVT BZA.02601.0150/Delta Lake-Class1, BIOS
  F0E_3A12 08/26/2021\nRIP: 0010:bnxt_rx_pkt+0xe97/0x1ae0 [bnxt_en]\nCode: 8b 95 70
  ff ff ff 4c 8b 9d 48 "
