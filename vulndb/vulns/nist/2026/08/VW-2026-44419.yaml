title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack_reasm: guard mac_header adjustment after IPv6 defrag\n\nnf_ct_frag6_reasm()
  slides the packet head forward to drop the IPv6\nfragment header and then unconditionally
  advances skb->mac_header:\n\n\tskb->mac_header += sizeof(struct frag_hdr);\n\nOn
  the NF_INET_LOCAL_OUT defrag path the skb has no link-layer header\nyet, so skb->mac_header
  is still the \"not set\" sentinel (u16)~0U. Adding\nsizeof(struct frag_hdr) wraps
  it to a small value (0xffff + 8 == 7),\nafter which skb_mac_header_was_set() wrongly
  reports a MAC header is\npresent and skb_mac_header() points into the headroom.\n\
  \nThe reassembler has done this unconditional add since it was introduced;\nit was
  harmless while mac_header was a bare pointer, but wrong once\nmac_header became
  a u16 offset whose unset state is the ~0U sentinel\ntested by skb_mac_header_was_set().
  The sibling net/ipv6/reassembly.c\ndoes the same relocation and does guard the adjustment"
