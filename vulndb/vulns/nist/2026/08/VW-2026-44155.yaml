title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  sdhci-esdhc-imx: use pm_runtime_resume_and_get() in suspend\n\nReplace pm_runtime_get_sync()
  with pm_runtime_resume_and_get() to\nsimplify error handling. pm_runtime_resume_and_get()
  automatically\ndrops the usage counter on failure, avoiding the need for a separate\n\
  pm_runtime_put_noidle() call. If it fails, the device is unclocked and\naccessing
  hardware registers would cause a kernel panic, so return the\nerror immediately."
