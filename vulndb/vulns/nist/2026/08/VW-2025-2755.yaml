title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/MADV_COLLAPSE:
  catch !none !huge !bad pmd lookups\n\nIn commit 34488399fa08 (\"mm/madvise: add
  file and shmem support to\nMADV_COLLAPSE\") we make the following change to find_pmd_or_thp_or_none():\n\
  \n\t-       if (!pmd_present(pmde))\n\t-               return SCAN_PMD_NULL;\n\t\
  +       if (pmd_none(pmde))\n\t+               return SCAN_PMD_NONE;\n\nThis was
  for-use by MADV_COLLAPSE file/shmem codepaths, where\nMADV_COLLAPSE might identify
  a pte-mapped hugepage, only to have\nkhugepaged race-in, free the pte table, and
  clear the pmd.  Such codepaths\ninclude:\n\nA) If we find a suitably-aligned compound
  page of order HPAGE_PMD_ORDER\n   already in the pagecache.\nB) In retract_page_tables(),
  if we fail to grab mmap_lock for the target\n   mm/address.\n\nIn these cases, collapse_pte_mapped_thp()
