title: 'A security flaw has been discovered in Webkul Bagisto up to 2.4.4. This issue
  affects some unknown processing of the file /admin/sales/rma/requests of the component
  Backend Sales RMA Endpoint. Performing a manipulation results in authorization bypass.
  The attack is possible to be carried out remotely. The exploit has been released
  to the public and may be used for attacks. The vendor confirms: "The reported issues
  were already identified through our internal security assessment process prior to
  this notification and are being handled through our established internal security
  and development lifecycle. Some of these items have already been addressed, while
  the remaining items are planned for resolution in upcoming product releases."'
