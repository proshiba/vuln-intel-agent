title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: validate monitor transmit frame lengths\n\nrtw_cfg80211_monitor_if_xmit_entry()
  removes the radiotap header and\nthen reads the 802.11 frame control field without
  checking that a base\n802.11 header remains.\n\nThe data path also pulls the calculated
  802.11, QoS and SNAP header\nspan before confirming that the skb contains it. A
  truncated frame can\ntherefore cause out-of-bounds reads or leave insufficient data
  for the\nEthernet address writes.\n\nReject frames that do not contain the base
  802.11 header and data\nframes that do not contain their complete calculated header
  span."
