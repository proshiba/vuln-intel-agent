title: Nokogiri versions before 1.16.5 bundle libxml2 2.12.6, which is affected 
  by CVE-2024-34459 in libxml2's xmllint tool. Nokogiri 1.16.5 upgrades the 
  bundled libxml2 to 2.12.7 to address this. Per the maintainers, there is no 
  impact to Nokogiri users because Nokogiri does not provide or expose the 
  xmllint tool where the issue occurs.
