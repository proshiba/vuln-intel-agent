title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Fix address space mismatch in kexec command line lookup\n\nWhen searching the loaded
  segments for the \"kexec\" command line marker,\nthe kexec_load(2) path (file_mode
  == 0) passes the user-space segment\nbuffer straight to strncmp() through a bogus
  (char __user *) cast. This\ndereferences a user pointer in kernel context, which
  is wrong and is\nflagged by sparse:\n\n  arch/loongarch/kernel/machine_kexec.c:84:51:
  sparse: incorrect type in\n  argument 2 (different address spaces) @@ expected char
  const * @@ got\n  char [noderef] __user *\n\nHere copy the marker-sized prefix of
  each segment into a small on-stack\nbuffer with copy_from_user() before comparing,
  and skip segments that\nfault. The subsequent copy_from_user() that stages the full
  command line\ninto the safe area is left unchanged."
