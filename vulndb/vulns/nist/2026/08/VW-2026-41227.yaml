title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  refresh auth->authorizer_buf{,_len} after authorizer update\n\nceph_x_create_authorizer()
  caches au->buf->vec.iov_base and\nau->buf->vec.iov_len in struct ceph_auth_handshake.\
  \  These\ncached values are then used by the messenger connect code when\nsending
  the authorizer.\n\nceph_x_update_authorizer() can rebuild the authorizer when a
  newer\nservice ticket is available.  If the rebuilt authorizer no longer\nfits in
  the existing buffer, ceph_x_build_authorizer() drops its\nreference to au->buf and
  allocates a new one.  If this is the final\nreference, ceph_buffer_put() frees the
  old ceph_buffer and its\nvec.iov_base, but auth->authorizer_buf still points at
  that freed\nmemory.\n\nA subsequent msgr1 reconnect can therefore queue the stale
  pointer\nand trigger a KASAN slab-use-after-free in _copy_from_iter() while\ntcp_sendmsg()
  copies the authorizer.\n\nRefresh auth->authorizer_buf and auth->authorizer_buf_len
  after a\nsuccessful a"
