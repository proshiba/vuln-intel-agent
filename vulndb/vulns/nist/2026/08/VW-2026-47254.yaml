title: Grav Flex Objects Plugin allows you to build custom collections of 
  objects. Prior to 1.4.3, the Grav Flex Objects Admin Next API 
  requireFlexPermission() method in classes/Api/FlexApiController.php returns 
  without denying access when a directory blueprint omits 
  config.admin.permissions. An authenticated account with only api.access can 
  use the index, show, create, update, delete, export, and media handlers for a 
  permission-less directory even though the core admin.flex-object. 
  authorization fallback would deny the same actions. This issue is fixed in 
  version 1.4.3.
