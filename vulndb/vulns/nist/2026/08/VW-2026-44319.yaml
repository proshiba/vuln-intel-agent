title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  fix uninitialized xprt_create_args structure\n\nThe xprt_create_args structure is
  allocated on the stack without\ninitialization in rpc_sysfs_xprt_switch_add_xprt_store().
  While some\nfields are manually populated, critical fields like srcaddr, bc_xps,\n\
  and flags contain uninitialized stack garbage.\n\nThis can lead to:\n1. Kernel panic
  when xs_setup_xprt() dereferences garbage srcaddr\n2. Information leak if srcaddr
  points to sensitive stack data\n3. Unpredictable behavior if flags has random bits
  set\n\nThe fix is to zero-initialize the structure to ensure all unused\nfields
  are NULL/0, preventing the transport setup code from acting\non garbage data."
