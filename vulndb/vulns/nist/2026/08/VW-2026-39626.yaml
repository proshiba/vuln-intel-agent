title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  iptfs: propagate SKBFL_SHARED_FRAG in iptfs_skb_add_frags()\n\nWhen iptfs_skb_add_frags()
  copies frag references from the source\nfrag walk into a new SKB, it increments
  the page reference count via\n__skb_frag_ref() but does not propagate SKBFL_SHARED_FRAG
  to the\ndestination SKB's skb_shinfo->flags.\n\nIf the source SKB carries shared
  frags (e.g. from a page-pool backed\nreceive path), the new inner SKB will appear
  to ESP as having privately\nowned frags.  A subsequent esp_input() call for a nested
  transport-mode\nSA then takes the no-COW fast path and decrypts in place, writing
  over\npages that are still referenced by the outer IPTFS SKB.  This causes\nkernel-visible
  memory corruption and can trigger a panic.\n\nAll other frag-transfer helpers in
  the kernel (skb_try_coalesce,\nskb_gro_receive, __pskb_copy_fclone, skb_shift, skb_segment)
  correctly\npropagate SKBFL_SHARED_FRAG; align iptfs_skb_add_frags() with this\n\
  convention "
