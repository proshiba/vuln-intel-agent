title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfilelock:
  fix potential use-after-free in posix_lock_inode\n\nLight Hsieh reported a KASAN
  UAF warning in trace_posix_lock_inode().\nThe request pointer had been changed earlier
  to point to a lock entry\nthat was added to the inode's list. However, before the
  tracepoint could\nfire, another task raced in and freed that lock.\n\nFix this by
  moving the tracepoint inside the spinlock, which should\nensure that this doesn't
  happen."
