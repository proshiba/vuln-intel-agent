title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  call the security_mmap_file() LSM hook in remap_file_pages()\n\nThe remap_file_pages
  syscall handler calls do_mmap() directly, which\ndoesn't contain the LSM security
  check. And if the process has called\npersonality(READ_IMPLIES_EXEC) before and
  remap_file_pages() is called for\nRW pages, this will actually result in remapping
  the pages to RWX,\nbypassing a W^X policy enforced by SELinux.\n\nSo we should check
  prot by security_mmap_file LSM hook in the\nremap_file_pages syscall handler before
  do_mmap() is called. Otherwise, it\npotentially permits an attacker to bypass a
  W^X policy enforced by\nSELinux.\n\nThe bypass is similar to CVE-2016-10044, which
  bypass the same thing via\nAIO and can be found in [1].\n\nThe PoC:\n\n$ cat > test.c\n\
  \nint main(void) {\n\tsize_t pagesz = sysconf(_SC_PAGE_SIZE);\n\tint mfd = syscall(SYS_memfd_create,
  \"test\", 0);\n\tconst char *buf = mmap(NULL, 4 * pagesz, PROT_READ | PROT_WRITE,\n\
  \t\tMAP_SHARED, mfd, 0);\n"
