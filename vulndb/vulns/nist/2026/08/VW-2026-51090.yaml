title: "Affected versions of Flowintel contain an authorization flaw in the administrative
  user-edit API.\n\n\nThe existing authorization check correctly prevented an organization
  administrator from editing users in another organization, but it did not prevent
  them from editing a full administrator within their own organization. As a result,
  an org admin could modify that full administrator account, including changing its
  password. The upstream commit explicitly describes the issue as:\n\n\n“Org admin
  can change the password of a full admin in the same organization.”\n\n\nThe fix
  adds a higher-privilege boundary check:\n\n\nif user_to_edit.is_admin(): return
  ... 403\n\nso organization administrators can no longer modify full administrator
  accounts.\n\nVersion impacted >=3.3.0"
