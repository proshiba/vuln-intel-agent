title: Coturn is a free open source implementation of TURN and STUN Server. 
  Prior to 4.13.1, good_peer_addr() in src/server/ns_turn_server.c uses 
  ioa_addr_in_range() in src/client/ns_turn_ioaddr.c without canonicalizing 
  IPv4-compatible, 6to4, and 64:ff9b::/96 NAT64 address forms, allowing an 
  authenticated RFC 6062 TCP CONNECT relay client to bypass an IPv4 
  denied-peer-ip range when the Coturn host has a useful translation route. This
  issue is fixed in version 4.13.1.
