title: A vulnerability was identified in GL-iNet GL-MT3000 up to 4.4.5. The 
  impacted element is the function server.set_peer of the file /cgi-bin/glc of 
  the component wg-server.so Native Plugin. The manipulation of the argument 
  public_key leads to command injection. Remote exploitation of the attack is 
  possible. The exploit is publicly available and might be used. The vendor was 
  contacted early about this disclosure and confirmed the existence of the 
  vulnerability.
