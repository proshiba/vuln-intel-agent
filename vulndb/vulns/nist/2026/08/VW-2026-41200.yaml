title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngve:
  fix Rx queue stall on alloc failure\n\nWhen the system is under extreme memory pressure,
  page allocations can\nfail during the Rx buffer refill loop. If the number of buffers
  posted\nto hardware falls below a critical low threshold and the refill loop\nexits
  due to allocation failures, the queue can stall:\n\n1. The device drops incoming
  packets because there are no descriptors.\n2. Since no packets are processed, no
  Rx completions are generated.\n3. Because no completions occur, NAPI is never scheduled,
  preventing\n   the refill loop from running again even after memory is freed.\n\n\
  This results in a permanent queue stall.\n\nResolve this by introducing a starvation
  recovery timer for each Rx queue.\nIf the number of buffers posted to hardware falls
  below a critical low\nthreshold, start a timer to periodically reschedule NAPI.
  Once NAPI runs\nand successfully refills the queue above the threshold, the timer
  is\nnot rescheduled.\n"
