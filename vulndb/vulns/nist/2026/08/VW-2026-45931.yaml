title: A flaw was found in the Submariner operator. The Submariner Custom 
  Resource (CR), used for configuring network connectivity, stores the IPsec 
  pre-shared key (PSK) in an unencrypted format. This key, which is critical for
  securing communication between Kubernetes clusters, can be accessed by 
  unauthorized parties. Such access enables an attacker to passively decrypt 
  network traffic flowing between any two clusters in the mesh, resulting in 
  sensitive information disclosure.
