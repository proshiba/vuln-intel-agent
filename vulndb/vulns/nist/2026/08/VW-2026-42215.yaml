title: 'Improper authentication for some Intel(R) PROSet/Wireless WiFi Software for
  Windows within Ring 2: Device Drivers may allow an escalation of privilege. Unprivileged
  software adversary with an unauthenticated user combined with a low complexity attack
  may enable local code execution. This result may potentially occur via local access
  when attack requirements are not present without special internal knowledge and
  requires no user interaction. The potential vulnerability may impact the confidentiality
  (low), integrity (none) and availability (none) of the vulnerable system, resulting
  in subsequent system confidentiality (high), integrity (low) and availability (low)
  impacts.'
