title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  bridge: release template ct on non-IP path\n\nA bridge nftables ct zone set rule
  can attach a conntrack template to\nan skb before nf_ct_bridge_pre() sees it. For
  non-IPv4 and non-IPv6\nEtherTypes, nf_ct_bridge_pre() currently overwrites skb->_nfct
  with\nIP_CT_UNTRACKED without releasing the existing template reference.\n\nThat
  makes the per-cpu template, and any temporary templates allocated\nfor concurrent
  use, unreachable and leaks memory until the host runs out\nof slab.\n\nReset the
  skb conntrack state before marking the frame untracked so the\nexisting template
  reference is dropped on the non-IP path."
