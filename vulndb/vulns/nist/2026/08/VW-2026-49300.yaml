title: "Improper Authentication vulnerability in team-alembic AshAuthentication allows
  purpose-limited JWTs to be replayed as full bearer API credentials when a resource
  uses stateless bearer-token verification.\n\nThe bearer-token authentication helper
  AshAuthentication.Plug.Helpers.retrieve_from_bearer/3 verifies an Authorization:
  Bearer JWT's signature and rejects tokens containing an act claim, but performs
  no check that the token's purpose claim equals user at the bearer boundary. When
  the resource is configured with require_token_presence_for_authentication?: false
  (the DSL default), the follow-on validate_token/3 helper returns {:ok, nil} without
  consulting the token resource, so no downstream check on purpose takes place either.
  As a result, any valid, non-expired JWT the library itself issued for a narrow,
  single-purpose flow (most notably the purpose: sign_in token that WebAuthn always
  emits during sign-in, and that the Password strategy emits when sign-in tokens are
  enabled) is accept"
