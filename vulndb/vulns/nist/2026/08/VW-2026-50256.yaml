title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  don't walk off the end of a null sc->sa.agi_bp in AGI repair\n\nLOLLM noticed a
  longstanding bug where xrep_iunlink_walk_ondisk_bucket\ntries to walk ragi->sc->sa.agi_bp
  to rebuild the unlinked inode lists.\nUnfortunately, it's possible for agi_bp to
  be null if the buffer\nverifier fails, so we have to use ragi->agi_bp (which skips
  verifier\nchecks) instead."
