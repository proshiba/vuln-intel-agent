title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_uart: clear HCI_UART_SENDING when write_work is canceled\n\nHCI_UART_SENDING
  bit in tx_state means write_work is pending and blocks\nqueueing it again.  Currently
  this bit is not cleared when canceling the\nwork in hci_uart_close(), which blocks
  future writes when device is\nreopened later if write_work was pending.\n\nFix by
  clearing HCI_UART_SENDING when canceling the work.\n\nAlso make clearing of tx_skb
  safe by using disable_work_sync +\nenable_work instead of just cancel_work_sync.\
  \  hci_uart_flush() purges\nthe proto tx queue so we can cancel the pending write_work
  there,\ninstead of doing it just in hci_uart_close().  Re-enable and possibly\n\
  requeue the work after queue flush."
