title: The Material Dashboard plugin for WordPress is vulnerable to unauthorized
  access and modification of data due to missing capability checks on the 
  amd_ajax_target_task_manager() function in all versions up to, and including, 
  1.4.10. This makes it possible for unauthenticated attackers to enumerate all 
  scheduled tasks (potentially exposing PII), execute arbitrary tasks, and 
  delete any task via the public_amd_ajax_handler AJAX action.
