title: A heap-based buffer overflow vulnerability exists in the GIMP DDS 
  (DirectDraw Surface) file parser. When a crafted DDS file declares a D3D9 
  pixel format but sets a lower bits-per-pixel (bpp) value in the header, the 
  loader allocates an undersized heap buffer. Subsequent pixel data consumption 
  at the real format's stride causes a write past the heap buffer boundary, 
  leading to heap metadata corruption and potential code execution.
