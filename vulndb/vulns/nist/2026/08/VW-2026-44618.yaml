title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  fix list_del corruption in kfd_criu_resume_svm\n\nThe cleanup tail of kfd_criu_resume_svm()
  walks\nsvms->criu_svm_metadata_list and kfree()s each struct criu_svm_metadata\n\
  without removing it from the list. The list head is left pointing at\nfreed kmalloc-96
  objects.\n\nA second AMDKFD_IOC_CRIU_OP from the same process re-enters: list_empty()\n\
  reads the dangling ->next (use-after-free), the loop walks freed entries,\nand each
  is kfree()'d again (double-free). This is reachable by an\nunprivileged render-group
  user via /dev/kfd with no capabilities required.\n\nAdd list_del() before the kfree()
  so the list is properly emptied. The\nlist_for_each_entry_safe() iterator already
  caches the next pointer, so\nunlinking during the walk is safe.\n\n(cherry picked
  from commit 6322d278a298e2c1430b9d2697743d3a04b788b1)"
