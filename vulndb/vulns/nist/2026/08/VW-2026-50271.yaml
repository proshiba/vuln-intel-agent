title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio_ccw:
  Selectively expand io_mutex\n\nThe io_mutex was defined to serialize the io_regions,
  but then has\nalso sort of been associated with the I/O themselves because of\n\
  the close relationship they share.\n\nWith the handful of races that are possible,
  the choices are either to:\n A) expand the scope of io_mutex to close these remaining
  windows, or\n B) reduce the scope of io_mutex to just io_region, and introduce a
  new\n    lock mechanism for the remaining I/O resources\n\nThis patch implements
  A, since B brings with it a lot more interactions\nthat would need to be tracked
  and kept in a correct hierarchy. It also\ntakes advantage of the workqueue element
  for cp_free() that now gets\ncalled out of fsm_notoper(), which could be invoked
  out of an interrupt\ncontext and thus cannot acquire a mutex itself."
