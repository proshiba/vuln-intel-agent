title: "Tobit Laboratories AG TeamDavid's Webbox 's move archive functionality (“!ArcEntryMove”)
  accepts \nan arbitrary path, which can be set to network locations using UNC paths\n\
  \ (e.g., “\\\\Server\\Share”). The server processes these paths without \nvalidation,
  resulting in outbound connection attempts to \nattacker-controlled SMB servers.
  This enables au-thenticated attackers \nto trigger the server to authenticate to
  arbitrary SMB endpoints, \npotentially exposing NTLM authentication information
  (such as NTLM \nhashes). If outbound connections to port 445 (SMB) are permitted,\
  \ \nattackers can use this to conduct SMB relay or credential theft attacks.\n Exploitation
  of the “pathname” parameter is possible without \nauthentication. This issue affects
  TeamDavid through Rollout 524."
