title: SiYuan before v3.7.3 fails to apply publish-access filters to the 
  getBacklinkDoc and getBackmentionDoc content endpoints 
  (/api/ref/getBacklinkDoc and /api/ref/getBackmentionDoc). While the 
  corresponding backlink list endpoints filter publish-forbidden documents, the 
  content endpoints (gated only by CheckAuth) do not. A publish-mode reader — 
  including an anonymous reader when publish Basic Auth is disabled — can call 
  these endpoints directly with a publish-forbidden document's ID to retrieve 
  its rendered DOM content and to determine whether the document references a 
  given block (a reference-existence oracle).
