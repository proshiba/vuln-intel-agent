title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  msi2500: Return queued buffers on start_streaming() failure\n\nThe vb2 framework
  hands buffers to the driver via buf_queue() before\ncalling start_streaming(). \
  \ If start_streaming() returns an error\nwithout first returning those buffers via
  vb2_buffer_done(),\nvb2_start_streaming() fires WARN_ON(owned_by_drv_count) and
  the queued\nbuffers leak.\n\nmsi2500_start_streaming() had five error paths that
  all hit this trap\nand were further tangled by ret-overwriting between calls:\n\n\
  \  - -ENODEV when the USB device was already disconnected\n  - -ERESTARTSYS when
  mutex_lock_interruptible() was interrupted\n  - msi2500_set_usb_adc() failure: ret
  was silently overwritten by\n    the next call (msi2500_isoc_init), so the error
  was lost entirely\n  - msi2500_isoc_init() failure: cleanup_queued_bufs was called,
  but\n    the function then fell through to msi2500_ctrl_msg() and again\n    masked
  the original error by overwriting ret\n  - msi"
