title: Emlog is an open source website building system. In 2.6.26 and earlier, 
  missing CSRF protection on the AI Assistant execute_tool action in 
  admin/ai.php lets a remote unauthenticated attacker submit a forged cross-site
  request from an attacker-controlled page to a recently logged-in 
  administrator. The authentication cookie set in include/lib/loginauth.php has 
  no explicit SameSite attribute, enabling Chrome's temporary Lax+POST grace 
  window. The query_database case passes attacker-controlled sql and 
  confirm_code values to Ai::queryDatabase in include/service/ai.php; read 
  queries need no confirmation, write queries accept the public confirm string, 
  only the blog table is write-protected, and aliasing password as pwd_hash 
  bypasses output redaction. A successful request can read every database table 
  and write every table except blog, including changing the user table to take 
  over an administrator account. No fixed version is available as of this 
  review.
