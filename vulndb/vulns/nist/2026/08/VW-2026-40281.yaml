title: Dell Virtual Storage Integrator for VMware vSphere Client, versions prior
  to 10.11.1.0, contain(s) an OS Command Injection vulnerability in the IAPI 
  component. A remote unauthenticated attacker could potentially exploit this 
  vulnerability, leading to the execution of arbitrary OS commands on the 
  application's underlying operating system with root privileges. Exploitation 
  may lead to a complete system takeover by an attacker. This vulnerability is 
  considered critical as it allows an unauthenticated remote attacker to achieve
  arbitrary code execution as root, potentially compromising the entire VSI 
  deployment and underlying infrastructure. Dell recommends customers to upgrade
  at the earliest opportunity.
