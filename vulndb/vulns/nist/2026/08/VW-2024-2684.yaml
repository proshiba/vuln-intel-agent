title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  ref-verify: fix use-after-free after invalid ref action\n\nAt btrfs_ref_tree_mod()
  after we successfully inserted the new ref entry\n(local variable 'ref') into the
  respective block entry's rbtree (local\nvariable 'be'), if we find an unexpected
  action of BTRFS_DROP_DELAYED_REF,\nwe error out and free the ref entry without removing
  it from the block\nentry's rbtree. Then in the error path of btrfs_ref_tree_mod()
  we call\nbtrfs_free_ref_cache(), which iterates over all block entries and then\n\
  calls free_block_entry() for each one, and there we will trigger a\nuse-after-free
  when we are called against the block entry to which we\nadded the freed ref entry
  to its rbtree, since the rbtree still points\nto the block entry, as we didn't remove
  it from the rbtree before freeing\nit in the error path at btrfs_ref_tree_mod().
  Fix this by removing the\nnew ref entry from the rbtree before freeing it.\n\nSyzbot
  report this with the foll"
