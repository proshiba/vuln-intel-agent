- "For details on how to apply this update, which includes the changes described in
  this advisory, refer to:\n\nhttps://access.redhat.com/articles/11258\n\nThe system
  must be rebooted for this update to take effect.\n\nRed Hat recommends treating
  all kernel errata as security-relevant. Given the kernel's fundamental role, any
  bug has a higher chance of impacting system security, even if that impact only becomes
  clear after a fix is published. Therefore, Red Hat prioritizes delivering fixes
  that improve our customers' overall security posture.\n\nBecause of this proactive
  approach, a patch may be associated with a CVE assignment at a future date. Retroactive
  CVE assignments are always documented in the corresponding errata and on Red Hat's
  CVE pages. We strongly advise against delaying updates, as doing so may leave your
  system exposed when protections are already available."
