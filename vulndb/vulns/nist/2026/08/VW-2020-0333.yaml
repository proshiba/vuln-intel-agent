title: A vulnerability in the FTP inspection engine of Cisco Adaptive Security 
  Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) Software 
  could allow an unauthenticated, remote attacker to bypass FTP inspection. The 
  vulnerability is due to ineffective flow tracking of FTP traffic. An attacker 
  could exploit this vulnerability by sending crafted FTP traffic through an 
  affected device. A successful exploit could allow the attacker to bypass FTP 
  inspection and successfully complete FTP connections.
