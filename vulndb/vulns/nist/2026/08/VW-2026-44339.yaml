title: "In the Linux kernel, the following vulnerability has been resolved:\n\n9p:
  skip nlink update in cacheless mode to fix WARN_ON\n\nv9fs_dec_count() unconditionally
  calls drop_nlink() on regular files,\neven when the inode's nlink is already zero.
  In cacheless mode the\nclient refetches inode metadata from the server (the source
  of truth)\non every operation, so by the time v9fs_remove() returns, the locally\n\
  cached nlink may already reflect the post-unlink value:\n\n  1. Client initiates
  unlink, server processes it and sets nlink to 0\n  2. Client refetches inode metadata
  (nlink=0) before unlink returns\n  3. Client's v9fs_remove() completes successfully\n\
  \  4. Client calls v9fs_dec_count() which calls drop_nlink() on nlink=0\n\nThis
  race is easily triggered under heavy unlink workloads, such as\nstress-ng's unlink
  stressor, producing the following warning:\n\n  WARNING: fs/inode.c:417 at drop_nlink+0x4c/0xc8\n\
  \  Call trace:\n   drop_nlink+0x4c/0xc8\n   v9fs_remove+0x1e0/0x250 [9p]\n   v9fs_vfs_unlink+0x20/0x38"
