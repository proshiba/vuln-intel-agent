title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  fastrpc: Fix double free of 'buf' in error path\n\nsmatch warning:\ndrivers/misc/fastrpc.c:1926
  fastrpc_req_mmap() error: double free of 'buf'\n\nIn fastrpc_req_mmap() error path,
  the fastrpc buffer is freed in\nfastrpc_req_munmap_impl() if unmap is successful.\n\
  \nBut in the end, there is an unconditional call to fastrpc_buf_free().\nSo the
  above case triggers the double free of fastrpc buf."
