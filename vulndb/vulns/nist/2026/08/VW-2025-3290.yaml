title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qat - fix out-of-bounds read\n\nWhen preparing an AER-CTR request, the driver copies
  the key provided by\nthe user into a data structure that is accessible by the firmware.\n\
  If the target device is QAT GEN4, the key size is rounded up by 16 since\na rounded
  up size is expected by the device.\nIf the key size is rounded up before the copy,
  the size used for copying\nthe key might be bigger than the size of the region containing
  the key,\ncausing an out-of-bounds read.\n\nFix by doing the copy first and then
  update the keylen.\n\nThis is to fix the following warning reported by KASAN:\n\n\
  \t[  138.150574] BUG: KASAN: global-out-of-bounds in qat_alg_skcipher_init_com.isra.0+0x197/0x250
  [intel_qat]\n\t[  138.150641] Read of size 32 at addr ffffffff88c402c0 by task cryptomgr_test/2340\n\
  \n\t[  138.150651] CPU: 15 PID: 2340 Comm: cryptomgr_test Not tainted 6.2.0-rc1+
  #45\n\t[  138.150659] Hardware name: Intel Corporation ArcherCity/ArcherC"
