title: Dolibarr before 24.0.0 contains an improper authorization vulnerability 
  in the payments REST API delete endpoint that allows authenticated attackers 
  with invoice-deletion rights to permanently delete any payment record by 
  bypassing the intended payment-issuance rights check. Attackers can exploit 
  this misconfigured permission check to zero paid amounts on invoices and 
  remove entries from accounting exports, causing financial data integrity loss.
