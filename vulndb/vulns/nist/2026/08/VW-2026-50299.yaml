title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  reject oversized IBs with per-ring packet limits\n\nOn GFX rings, amdgpu_cs_p2_ib()
  passed user-supplied ib_bytes through\nto ib->length_dw without a limit, while ring_emit_ib()
  encodes length\ninto packet fields. Oversized values can corrupt adjacent control
  bits\nand destabilize command submission.\n\nAdd a per-ring IB packet size limit
  helper and reject command\nsubmissions exceeding the corresponding dword limit before
  IB\nallocation. Use the documented 20-bit limit for GFX/compute/SDMA/VPE,\nand apply
  the MM fallback limit for other ring types.\n\n(cherry picked from commit 7f48fa2cf62e3fa6c9c3870aa74988f773247e52)"
