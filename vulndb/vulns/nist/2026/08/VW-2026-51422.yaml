title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  sco: Fix a race condition in sco_sock_timeout()\n\nsco_sock_timeout() runs asynchronously
  and lock_sock(sk). If the socket\nis closing while the timer is running, it holds
  the same lock\n(lock_sock(sk)) twice, leading to a deadlock.\n\nCPU 0          \
  \            CPU 1\n====================       ======================\nsco_sock_close()\n\
  \                           sco_sock_timeout()\nlock_sock(sk) // <-- LOCK\n  __sco_sock_close()\n\
  \    sco_chan_del()\n      sco_conn_put()\n\t      sco_conn_free()\n\t        disable_delayed_work_sync()\n\
  \t                           lock(sk) // <-- SAME LOCK\n\nFix this by moving disable_delayed_work_sync()
  outside of lock_sock(sk),\nensuring that no lock_sock(sk) is held before sco_sock_timeout().\n\
  \nLockdep splat:\n\nWARNING: possible circular locking dependency detected\n6.13.0-rc4
