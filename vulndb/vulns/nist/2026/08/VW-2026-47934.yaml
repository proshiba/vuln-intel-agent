title: Mongoose is an embedded web server and network library. Prior to 7.22, an
  attacker who can create a file with an HTML payload in its name can trigger 
  stored cross-site scripting when a user browses a directory served with 
  MG_ENABLE_DIRLIST. The printdirentry() path called by listdir() in src/http.c 
  URL-encodes the href but inserts the raw filesystem filename into the HTML 
  link text. The browser executes the injected markup in the Mongoose origin, 
  which can expose session data or permit actions as the victim. This issue is 
  fixed in version 7.22.
