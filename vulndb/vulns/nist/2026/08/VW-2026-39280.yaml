title: "Cross-Site Request Forgery vulnerability in Erlang Ecosystem Foundation oidcc_plug
  (Oidcc.Plug.AuthorizationCallback module) allows an attacker to make a victim's
  browser complete an authorization flow the victim never initiated.\n\nThis vulnerability
  is associated with program file lib/oidcc/plug/authorization_callback.ex and program
  routine Oidcc.Plug.AuthorizationCallback.call/2.\n\nA callback request that carries
  no Oidcc.Plug.Authorize session is processed with every security check disabled
  rather than being rejected. call/2 substitutes permissive defaults for the absent
  session, and each downstream check treats its value as nothing to compare and returns
  :ok, so the nonce, state, PKCE, peer IP and user agent checks are all skipped. A
  separate clause of check_state/2 also accepts a state-less request when a verifier
  is present.\n\nAn attacker obtains an authorization code for their own provider
  account, then induces the victim to visit the callback endpoint with that code and
