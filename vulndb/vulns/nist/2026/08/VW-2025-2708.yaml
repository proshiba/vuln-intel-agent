title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/fpu:
  KVM: Set the base guest FPU uABI size to sizeof(struct kvm_xsave)\n\nSet the starting
  uABI size of KVM's guest FPU to 'struct kvm_xsave',\ni.e. to KVM's historical uABI
  size.  When saving FPU state for usersapce,\nKVM (well, now the FPU) sets the FP+SSE
  bits in the XSAVE header even if\nthe host doesn't support XSAVE.  Setting the XSAVE
  header allows the VM\nto be migrated to a host that does support XSAVE without the
  new host\nhaving to handle FPU state that may or may not be compatible with XSAVE.\n\
  \nSetting the uABI size to the host's default size results in out-of-bounds\nwrites
  (setting the FP+SSE bits) and data corruption (that is thankfully\ncaught by KASAN)
  when running on hosts without XSAVE, e.g. on Core2 CPUs.\n\nWARN if the default
  size is larger than KVM's historical uABI size; all\nfeatures that can push the
  FPU size beyond the historical size must be\nopt-in.\n\n  ==============================================="
