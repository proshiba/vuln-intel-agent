title: "The dataplane token validator in kuma-cp performs an unchecked Go type assertion
  on the JWT kid header. A token whose kid is a JSON number decodes as a float64 and
  triggers a runtime panic before any signature, claims, or authorization check runs.\n\
  \n\n\nThe panic terminates the entire kuma-cp process, HTTP API, the health and
  readiness endpoints, and xDS. Unauthenticated access to the dataplane gRPC server
  can trigger the crash with a malformed token\n\n\n\nA single request is a transient
  interruption; sustaining an outage requires repeated requests."
