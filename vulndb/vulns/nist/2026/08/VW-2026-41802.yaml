title: SAP Advanced Planning and Optimization (Model Mix Planning) contains a 
  hardcoded credential within the source code of the application to perform 
  authorization check to access certain functionalities in the application. An 
  attacker with high privileges could leverage this hardcoded credential to 
  bypass authorization and delete specific planning-related restrictions in the 
  application. Successful exploitation could result in a low impact on 
  confidentiality and integrity, with no impact on availability of the 
  application.
