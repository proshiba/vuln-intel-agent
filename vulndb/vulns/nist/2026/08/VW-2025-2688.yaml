title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndlm:
  fix plock invalid read\n\nThis patch fixes an invalid read showed by KASAN. A unlock
  will allocate a\n\"struct plock_op\" and a followed send_op() will append it to
  a global\nsend_list data structure. In some cases a followed dev_read() moves it\n\
  to recv_list and dev_write() will cast it to \"struct plock_xop\" and access\nfields
  which are only available in those structures. At this point an\ninvalid read happens
  by accessing those fields.\n\nTo fix this issue the \"callback\" field is moved
  to \"struct plock_op\" to\nindicate that a cast to \"plock_xop\" is allowed and
  does the additional\n\"plock_xop\" handling if set.\n\nExample of the KASAN output
  which showed the invalid read:\n\n[ 2064.296453] ==================================================================\n\
  [ 2064.304852] BUG: KASAN: slab-out-of-bounds in dev_write+0x52b/0x5a0 [dlm]\n[
  2064.306491] Read of size 8 at addr ffff88800ef227d8 by task dlm_controld/7484\n\
  [ 2064.308168]\n[ 20"
