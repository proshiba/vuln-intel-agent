title: Hugo 0.161.0 placed the Node asset pipelines behind the Node.js 
  permission model so that code running through PostCSS, Babel, or TailwindCSS 
  could not reach the file system outside the project directory. Hugo 0.162.0 
  added tailwindcss to the AllowChildProcess default in 
  config/security/securityConfig.go, which makes nodePermissionArgs in 
  common/hexec/exec.go append --allow-child-process whenever the tool being 
  launched is named tailwindcss. TailwindCSS loads the site's tailwind.config.js
  through require at startup, so top-level code in that file executes inside the
  permitted Node process and can call child_process to spawn a shell. The 
  spawned process is not a Node process and inherits none of the permission 
  flags, so it runs with the full privileges of the account performing the 
  build. Building a site whose theme, module, or starter template supplies the 
  Tailwind configuration therefore yields arbitrary command execution rather 
  than the confined file access the permission model was in
