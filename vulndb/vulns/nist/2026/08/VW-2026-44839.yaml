title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/rockchip:
  inno-hdmi: Switch to drmm_kzalloc()\n\nDriver makes use of drmm_encoder_init() to
  initialize the encoder and\nautomatically handle the cleanup by registering drm_encoder_cleanup()\n\
  with drmm_add_action().\n\nHowever, the internal structure containing the encoder
  part gets\nallocated with devm_kzalloc(), which happens while component_bind_all()\n\
  is being called from Rockchip DRM driver.  The component framework\nfurther ensures
  it is deallocated as part of releasing all the resources\nclaimed during bind, which
  is triggered from component_unbind_all().\n\nWhen the reference to the DRM device
  gets eventually dropped via\ndrm_dev_put() in rockchip_drm_unbind(), drmm_encoder_alloc_release()\n\
  attempts to access the now released encoder structure, leading to\nuse-after-free.\n\
  \nEnsure driver's internal structure is still reachable on encoder cleanup\nby switching
  from a device-managed allocation to a drm-managed one."
