title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu:
  Fix potential use-after-free during probe\n\nKasan has reported the following use
  after free on dev->iommu.\nwhen a device probe fails and it is in process of freeing
  dev->iommu\nin dev_iommu_free function, a deferred_probe_work_func runs in parallel\n\
  and tries to access dev->iommu->fwspec in of_iommu_configure path thus\ncausing
  use after free.\n\nBUG: KASAN: use-after-free in of_iommu_configure+0xb4/0x4a4\n\
  Read of size 8 at addr ffffff87a2f1acb8 by task kworker/u16:2/153\n\nWorkqueue:
  events_unbound deferred_probe_work_func\nCall trace:\n dump_backtrace+0x0/0x33c\n\
  \ show_stack+0x18/0x24\n dump_stack_lvl+0x16c/0x1e0\n print_address_description+0x84/0x39c\n\
