title: A vulnerability has been found in arben-adm mcp-sequential-thinking up to
  0.5.0. Impacted is the function import_session/export_session of the file 
  mcp_sequential_thinking/server.py of the component Import Session/Export 
  Session. Such manipulation of the argument file_path leads to path traversal. 
  It is possible to launch the attack remotely. The exploit has been disclosed 
  to the public and may be used. Upgrading to version 0.6.0 is recommended to 
  address this issue. The name of the patch is 
  2fad3ee8ab1d0868b6c1afb5895bc336a10e5267. Upgrading the affected component is 
  recommended.
