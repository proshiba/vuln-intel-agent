title: A security vulnerability has been detected in Open Asset Import Library 
  Assimp Assimp 17c12da. The affected element is the function 
  Assimp::MDLImporter::ParseBoneTrafoKeys_3DGS_MDL7 of the file 
  code/AssetLib/MDL/MDLLoader.cpp of the component 3DGS MDL7 Bone Transformation
  Key Parser. The manipulation of the argument 
  transmatrix_count/pcBoneTransforms leads to buffer overflow. It is possible to
  initiate the attack remotely. The exploit has been disclosed publicly and may 
  be used. The identifier of the patch is 
  50d767984e78d51b53e2020fdf0967fd624bc377. It is recommended to apply a patch 
  to fix this issue.
