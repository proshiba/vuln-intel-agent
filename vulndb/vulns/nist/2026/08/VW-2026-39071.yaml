title: OpenEMR through 8.2.0 contains a remote code execution vulnerability in 
  the document category tree component (library/classes/Tree.class.php) that 
  allows authenticated administrators to execute arbitrary operating system 
  commands by injecting PHP payloads into the categories database table. 
  Attackers can chain arbitrary SQL execution to alter the id column type to 
  VARCHAR and insert a malicious PHP payload, which is then executed via an 
  unsanitized eval() call whenever any page instantiates CategoryTree, including
  unauthenticated and low-privilege pages, resulting in command execution as the
  web server user.
