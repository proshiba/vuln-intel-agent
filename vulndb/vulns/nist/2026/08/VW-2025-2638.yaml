title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tls:
  fix slab-out-of-bounds bug in decrypt_internal\n\nThe memory size of tls_ctx->rx.iv
  for AES128-CCM is 12 setting in\ntls_set_sw_offload(). The return value of crypto_aead_ivsize()\n\
  for \"ccm(aes)\" is 16. So memcpy() require 16 bytes from 12 bytes\nmemory space
  will trigger slab-out-of-bounds bug as following:\n\n==================================================================\n\
  BUG: KASAN: slab-out-of-bounds in decrypt_internal+0x385/0xc40 [tls]\nRead of size
  16 at addr ffff888114e84e60 by task tls/10911\n\nCall Trace:\n <TASK>\n dump_stack_lvl+0x34/0x44\n\
  \ print_report.cold+0x5e/0x5db\n ? decrypt_internal+0x385/0xc40 [tls]\n kasan_report+0xab/0x120\n\
  \ ? decrypt_internal+0x385/0xc40 [tls]\n kasan_check_range+0xf9/0x1e0\n memcpy+0x20/0x60\n\
  \ decrypt_internal+0x385/0xc40 [tls]\n ? tls_get_rec+0x2e0/0x2e0 [tls]\n ? process_rx_list+0x1a5/0x420
  [tls]\n ? tls_setup_from_iter.constprop.0+0x2e0/0x2e0 [tls]\n decrypt_skb_update+0x9d/0x400
  [tls]"
