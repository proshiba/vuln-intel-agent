title: "A security feature bypass vulnerability exists in Microsoft Windows when the
  Task Scheduler service fails to properly verify client connections over RPC. An
  attacker who successfully exploited this vulnerability could run arbitrary code
  as an administrator. An attacker could then install programs; view, change, or delete
  data; or create new accounts with full user rights.\nTo exploit this vulnerability,
  a man-in-the-middle attacker would need to send a specially crafted request to a
  vulnerable system.\nThe security update addresses the vulnerability by correcting
  how the Task Scheduler service validates connections."
