title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: validate DFS referral PathConsumed\n\nparse_dfs_referrals() validates that
  the response contains the fixed\nreferral entry array and, on for-next, the per-referral
  string offsets.\nHowever, the response also contains a PathConsumed value that is
  later\nused for DFS path parsing.\n\nIf a malformed response provides a PathConsumed
  value larger than the\nsearch name, later DFS parsing can advance beyond the end
  of the path.\n\nValidate PathConsumed against the search name length before storing
  it in\nthe parsed referral."
