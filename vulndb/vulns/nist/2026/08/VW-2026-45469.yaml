title: "A memory leak occurs in Node.js HTTP/2 servers when a client sends WINDOW_UPDATE
  frames on stream 0 (connection-level) that cause the flow control window to exceed
  the maximum value of 2³¹-1. The server correctly sends a GOAWAY frame, but the Http2Session
  object is never cleaned up.\r\n\r\nThis vulnerability affects HTTP2 users on Node.js
  20, 22, 24 and 25."
