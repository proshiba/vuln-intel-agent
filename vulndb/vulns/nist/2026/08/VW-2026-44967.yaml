title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: fix refcounting of iso_conn\n\niso_conn_del() and iso_chan_del() have a race
  that results to double-put\nof iso_conn:\n\n    [Task hdev->workqueue]         [Task
  2]\n    iso_conn_del                   iso_chan_del\n      iso_conn_hold_unless_zero\
  \      iso_conn_lock\n      iso_conn_lock                  conn->sk = NULL\n   \
  \                                  iso_conn_unlock\n      sk = iso_sock_hold(conn)\
  \  <---------´\n      if (!sk) iso_conn_put          iso_conn_put\n      iso_conn_put
  /* UAF */\n\nThe extra put for !sk in iso_conn_del() is currently required since\n\
  failing iso_chan_add() may leave iso_conn not associated with any sk.\n\nFix by
  having iso_pi(sk)->conn own refcount when non-NULL, so\niso_conn_del does not need
  to put it.  Adjust the iso_conn_add()\nrefcounting so that conn is put if it does
  not get associated with an\nsk."
