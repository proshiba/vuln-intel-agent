title: "When an operator adds an HTTPS control plane profile to kumactl without providing
  a CA certificate, kumactl disables TLS verification and sends API tokens over the
  unverified connection.\n\n\n\nAn attacker on the network path between the operator
  and the control plane can intercept user or admin API tokens and then act against
  the control plane as that user."
