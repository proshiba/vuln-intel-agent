title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost-scsi:
  Validate T10 PI scatterlist counts\n\nWhen T10 PI is negotiated, vhost-scsi splits
  protection bytes from\nthe data iterator before mapping the request scatterlists.
  A malformed\nrequest can claim protection bytes that cover or exceed the full payload\n\
  length. The former leaves no data bytes to map, while the latter\nunderflows exp_data_len
  before advancing the iterator. Both cases can let\na zero data SGL count reach sg_alloc_table_chained(),
  which triggers\nBUG_ON(!nents).\n\nReject protection lengths that cover or exceed
  the payload before\nsubtracting prot_bytes and advancing the iterator. Also propagate\n\
  negative errors from the protection SGL calculation before calling the\nallocator,
  matching the data SGL path."
