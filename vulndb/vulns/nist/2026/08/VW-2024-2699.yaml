title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  initialize close_work early to avoid warning\n\nWe encountered a warning that close_work
  was canceled before\ninitialization.\n\n  WARNING: CPU: 7 PID: 111103 at kernel/workqueue.c:3047
  __flush_work+0x19e/0x1b0\n  Workqueue: events smc_lgr_terminate_work [smc]\n  RIP:
  0010:__flush_work+0x19e/0x1b0\n  Call Trace:\n   ? __wake_up_common+0x7a/0x190\n\
  \   ? work_busy+0x80/0x80\n   __cancel_work_timer+0xe3/0x160\n   smc_close_cancel_work+0x1a/0x70
  [smc]\n   smc_close_active_abort+0x207/0x360 [smc]\n   __smc_lgr_terminate.part.38+0xc8/0x180
  [smc]\n   process_one_work+0x19e/0x340\n   worker_thread+0x30/0x370\n   ? process_one_work+0x340/0x340\n\
  \   kthread+0x117/0x130\n   ? __kthread_cancel_work+0x50/0x50\n   ret_from_fork+0x22/0x30\n\
  \nThis is because when smc_close_cancel_work is triggered, e.g. the RDMA\ndriver
  is rmmod and the LGR is terminated, the conn->close_work is\nflushed before initialization,
  resulting in WARN_ON(!work->func).\n\n__sm"
