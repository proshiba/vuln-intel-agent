title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkernfs:
  fix use-after-free in __kernfs_remove\n\nSyzkaller managed to trigger concurrent
  calls to\nkernfs_remove_by_name_ns() for the same file resulting in\na KASAN detected
  use-after-free. The race occurs when the root\nnode is freed during kernfs_drain().\n\
  \nTo prevent this acquire an additional reference for the root\nof the tree that
  is removed before calling __kernfs_remove().\n\nFound by syzkaller with the following
  reproducer (slab_nomerge is\nrequired):\n\nsyz_mount_image$ext4(0x0, &(0x7f0000000100)='./file0\\\
  x00', 0x100000, 0x0, 0x0, 0x0, 0x0)\nr0 = openat(0xffffffffffffff9c, &(0x7f0000000080)='/proc/self/exe\\\
  x00', 0x0, 0x0)\nclose(r0)\npipe2(&(0x7f0000000140)={0xffffffffffffffff, <r1=>0xffffffffffffffff},
  0x800)\nmount$9p_fd(0x0, &(0x7f0000000040)='./file0\\x00', &(0x7f00000000c0), 0x408,
  &(0x7f0000000280)={'trans=fd,', {'rfdno', 0x3d, r0}, 0x2c, {'wfdno', 0x3d, r1},
  0x2c, {[{@cache_loose}, {@mmap}, {@loose}, {@loose}, {@mmap"
