title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  FCP: Fix NULL pointer dereference in interface lookup\n\nA malformed USB device
  can provide a vendor-specific interface without\nany endpoint descriptors. fcp_find_fc_interface()
  currently selects the\nfirst vendor-specific interface and reads endpoint 0 from
  it, without\nchecking whether the interface actually has any endpoints.\n\nWhen
  bNumEndpoints is zero, no endpoint array is allocated for the parsed\nalternate
  setting, so get_endpoint(..., 0) yields an invalid endpoint\ndescriptor pointer.
  Dereferencing it through usb_endpoint_num() then\ntriggers a NULL pointer dereference.\n\
  \nSkip vendor-specific interfaces that do not have any endpoints."
