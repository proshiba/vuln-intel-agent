title: Sub2API is an AI API gateway platform designed to distribute and manage 
  API quotas from AI product subscriptions. From 0.1.135, to 0.1.168, platform 
  API keys issued to tenants are exchanged for upstream requests made with 
  shared provider accounts (ChatGPT/Codex OAuth, OpenAI platform keys, or an 
  operator-configured base URL) that belong to the operator, not to the caller. 
  The `POST /responses/*subpath` wildcard routes spliced the client-supplied 
  subpath into the upstream URL with no validation. This lets an authenticated 
  tenant relay requests to arbitrary upstream endpoints using pooled account 
  credentials via a path traversal. This vulnerability is fixed in 0.1.169.
