title: Multiple DrayTek VigorSwitch models contain a directory traversal 
  vulnerability in the getSyslogFile function. The vulnerability is caused by 
  insufficient validation of the option field. A remote attacker can trigger 
  this vulnerability via crafted input containing path traversal sequences to 
  access arbitrary files on the device. Exploitation requires valid 
  administrative credentials for the device's web management interface.
