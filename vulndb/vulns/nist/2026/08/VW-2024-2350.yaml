title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  fix kernel crash if commands allocation fails\n\nIf the commands allocation fails
  in nvmet_tcp_alloc_cmds()\nthe kernel crashes in nvmet_tcp_release_queue_work()
  because of\na NULL pointer dereference.\n\n  nvmet: failed to install queue 0 cntlid
  1 ret 6\n  Unable to handle kernel NULL pointer dereference at\n         virtual
  address 0000000000000008\n\nFix the bug by setting queue->nr_cmds to zero in case\n\
  nvmet_tcp_alloc_cmd() fails."
