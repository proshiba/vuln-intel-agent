  nginx and php-fpm instance. The allow-list that should restrict accepted file 
  types is an empty array by default (`file-upload/php/config.php:16`), so the 
  type check is a no-op and every extension is accepted. The filename sanitizer 
  keeps the `.php` extension intact. Committed files land in 
  `/var/www/upload/server/php/files` (`file-upload/php/config.php:7`), and the 
