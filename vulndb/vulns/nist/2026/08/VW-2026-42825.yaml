title: Malcolm is a network traffic analysis tool suite. The file-upload 
  component (FilePond PHP backend) accepts uploads at `POST 
  /server/php/submit.php` and stores them in a directory served by the same 
  nginx and php-fpm instance. The allow-list that should restrict accepted file 
  types is an empty array by default (`file-upload/php/config.php:16`), so the 
  type check is a no-op and every extension is accepted. The filename sanitizer 
  keeps the `.php` extension intact. Committed files land in 
  `/var/www/upload/server/php/files` (`file-upload/php/config.php:7`), and the 
  component's nginx routes any URL ending in `.php` to php-fpm. An authenticated
  `GET /server/php/files/<name>.php` then executes the uploaded code as 
  `www-data`. Prior to version 26.06.1, in RBAC mode, the upload endpoint is 
