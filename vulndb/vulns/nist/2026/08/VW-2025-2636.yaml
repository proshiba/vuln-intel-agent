title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ipv4: fix route with nexthop object delete warning\n\nFRR folks have hit a kernel
  warning[1] while deleting routes[2] which is\ncaused by trying to delete a route
  pointing to a nexthop id without\nspecifying nhid but matching on an interface.
  That is, a route is found\nbut we hit a warning while matching it. The warning is
  from\nfib_info_nh() in include/net/nexthop.h because we run it on a fib_info\nwith
  nexthop object. The call chain is:\n inet_rtm_delroute -> fib_table_delete -> fib_nh_match
  (called with a\nnexthop fib_info and also with fc_oif set thus calling fib_info_nh
  on\nthe fib_info and triggering the warning). The fix is to not do any\nmatching
  in that branch if the fi has a nexthop object because those are\nmanaged separately.
  I.e. we should match when deleting without nh spec and\nshould fail when deleting
  a nexthop route with old-style nh spec because\nnexthop objects are managed separately,
  e.g.:\n $ ip r show 1.2"
