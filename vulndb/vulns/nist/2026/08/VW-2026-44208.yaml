title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnx2x:
  fix potential memory leak in bnx2x_alloc_mem_bp()\n\nIf the allocation of fp[i].tpa_info
  fails, the error path will not free\nthe struct bnx2x_fastpath allocated earlier,
  as it is not linked to the\nbp structure yet. Fix that by linking it immediately
  after allocation."
