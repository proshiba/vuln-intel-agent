title: Typebot is an open-source chatbot builder. In self-hosted versions up to 
  and including 3.17.1, the default passwordless email magic-link authentication
  is vulnerable to login-code brute forcing that leads to account takeover. The 
  email provider overrides NextAuth's default cryptographically secure token 
  with a 6-digit code generated using Math.random(), reducing the keyspace to 
  900,000 with a 10-minute expiry, and the code itself is the raw value placed 
  in the magic link. The verification callback enforces no attempt limit, 
  lockout, or CSRF protection, and an incorrect guess does not consume the real 
  code because the adapter returns null on a not-found token, so a valid code 
  survives unlimited guessing within its lifetime. The only rate limiter applies
  to the code-sending path and is keyed on the client-controlled X-Forwarded-For
  header, allowing an attacker to request many concurrent live codes for one 
  victim and further raise the odds of a matching guess. As a result, an 
