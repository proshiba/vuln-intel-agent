title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/region:
  Fix out-of-bounds access in cxl_cancel_auto_attach()\n\nIn cxl_cancel_auto_attach(),
  it assumes cxled->pos is a valid index for\naccessing p->targets[]. However, cxled->pos
  can be set to negative errno\nin cxl_region_sort_targets() if cxl_calc_interleave_pos()
  fails. This\ncauses the driver to use a negative index to access p->targets[],\n\
  resulting in out-of-bounds access.\n\nFix it by walking p->targets[] instead of
  using cxled->pos directly."
