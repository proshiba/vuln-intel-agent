title: A flaw was found in 389-ds-base. The get_ldapmessage_controls_ext() 
  function frees the parsed controls array on the Session Tracking 
  critical-control rejection path without clearing the SLAPI_REQCONTROLS pblock 
  slot. Operation teardown then frees the same pointer again, causing a 
  double-free. An unauthenticated remote attacker can trigger this with a single
  BIND request carrying a critical Session Tracking control, resulting in heap 
  corruption and potential denial of service.
