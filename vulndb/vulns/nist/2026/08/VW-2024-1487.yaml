title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  Destroy I/O bus devices on unregister failure _after_ sync'ing SRCU\n\nIf allocating
  a new instance of an I/O bus fails when unregistering a\ndevice, wait to destroy
  the device until after all readers are guaranteed\nto see the new null bus.  Destroying
  devices before the bus is nullified\ncould lead to use-after-free since readers
  expect the devices on their\nreference of the bus to remain valid."
