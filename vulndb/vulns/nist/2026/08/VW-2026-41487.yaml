title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  fix double free and WARN_ON in add_mtd_device() error paths\n\nWhen device_register()
  or mtd_nvmem_add() fails inside\nadd_mtd_device() for a partition, the error handling
  triggers\nmtd_release() via put_device() or device_unregister(). mtd_release()\n\
  calls release_mtd_partition() which frees the mtd_info structure.\nHowever, callers
  such as mtd_add_partition() and add_mtd_partitions()\nalso call free_partition()
  in their error paths, resulting in a double\nfree.\n\nAdditionally, release_mtd_partition()
  hits WARN_ON(!list_empty(\n&mtd->part.node)) because the partition node is still
  linked in the\nparent's partitions list when the release callback fires from the\n\
  add_mtd_device() error path.\n\nFix this by overriding dev->type and dev->release
  before put_device()\nin the error paths, so that device_release() invokes a no-op
  function\ninstead of mtd_release(). For the mtd_nvmem_add() failure case,\ndevice_unregister()
