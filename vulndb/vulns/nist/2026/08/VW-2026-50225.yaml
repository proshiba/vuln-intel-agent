title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_u32: skip hash tables in u32_bind_class()\n\nu32_walk() enumerates both struct
  tc_u_hnode and struct tc_u_knode\nthrough the walker callback. u32_bind_class()
  unconditionally casts the\npassed fh to tc_u_knode and accesses &n->res, so when
  fh is actually a\ntc_u_hnode, which has no tcf_result member, this results in a\n\
  slab-out-of-bounds read of res->classid in tc_cls_bind_class().\n\nThe issue can
  be reproduced with the following commands:\n\n    tc qdisc add dev lo root handle
  1: hfsc\n    tc class add dev lo parent 1: classid 1:1 hfsc sc rate 1000kbit\n \
  \   tc filter add dev lo parent 1:1 protocol ip prio 1 u32 match u32 0 0 flowid
  1:1\n    tc class add dev lo parent 1: classid 1:2 hfsc sc rate 2000kbit\n\nFix
  this by skipping hash tables via the TC_U32_KEY(handle) check."
