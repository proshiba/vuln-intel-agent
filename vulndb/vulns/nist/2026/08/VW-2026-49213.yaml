title: A vulnerability has been found in Faveo Helpdesk up to 2.0.3. Affected is
  the function unlink of the file 
  app/Http/Controllers/Admin/helpdesk/SettingsController.php of the component 
  Logo Handler. Such manipulation of the argument data1 leads to path traversal.
  The attack can be launched remotely. The exploit has been disclosed to the 
  public and may be used. The project was informed of the problem early through 
  an issue report but has not responded yet.
