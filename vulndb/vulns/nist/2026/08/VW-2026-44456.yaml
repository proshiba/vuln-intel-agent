  the off-by-default consistency check for vmcs12.tpr_threshold vs.\nthe virtual APIC
  vTPR into the \"normal\" controls checks, as waiting until\nKVM has loaded some
  amount of state is unnecessary and actively dangerous.\nSpecifically, failure to
  unwind vmcs01.GUEST_CR3 to KVM's value when EPT\nis disabled results in KVM running
  L1 with an L1-controlled CR3, not with\nKVM's CR3!\n\nAlternatively, KVM could simply
  reset the MMU to force a reload of\nvmcs01.GUEST_CR3, but the _only_ reason the
