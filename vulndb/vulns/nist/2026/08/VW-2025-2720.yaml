title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ibmvfc: Allocate/free queue resource only during probe/remove\n\nCurrently, the
  sub-queues and event pool resources are allocated/freed for\nevery CRQ connection
  event such as reset and LPM. This exposes the driver\nto a couple issues. First
  the inefficiency of freeing and reallocating\nmemory that can simply be resued after
  being sanitized. Further, a system\nunder memory pressue runs the risk of allocation
  failures that could result\nin a crippled driver. Finally, there is a race window
  where command\nsubmission/compeletion can try to pull/return elements from/to an
  event\npool that is being deleted or already has been deleted due to the lack of\n\
  host state around freeing/allocating resources. The following is an example\nof
  list corruption following a live partition migration (LPM):\n\nOops: Exception in
  kernel mode, sig: 5 [#1]\nLE PAGE_SIZE=64K MMU=Hash SMP NR_CPUS=2048 NUMA pSeries\n\
  Modules linked in: vfat fat isofs cdro"
