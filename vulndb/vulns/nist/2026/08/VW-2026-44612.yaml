title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: Kill MIDI 2.0 URBs before freeing endpoints\n\nMIDI 2.0 input URBs are
  started during snd_usb_midi_v2_create(). A\nlater setup failure can still jump to
  snd_usb_midi_v2_free(), which\ncurrently frees each endpoint and its coherent URB
  buffers without first\nstopping the submitted URBs. A completion can then dereference
  the\nembedded URB context and endpoint state after they have been freed, or\ntry
  to resubmit from the stale endpoint.\n\nThis was observed as a KASAN slab-use-after-free
  in\ninput_urb_complete().\n\nThe buggy scenario involves two paths, with each column
  showing the order\nwithin that path:\n\nprobe error path:                      \
  \   USB completion path:\n1. start_input_streams() submits          1. The HCD still
  owns a\n   input URBs.                               submitted input URB.\n2. A
  later setup helper returns           2. input_urb_complete() runs\n   an error.\
