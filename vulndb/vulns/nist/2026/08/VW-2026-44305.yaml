title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  xfrm_interface: require CAP_NET_ADMIN in the device netns for changelink\n\nxfrmi_changelink()
  operates on at most two netns, dev_net(dev) and the\ninterface link netns xi->net.
  They differ once the device is created in\nor moved to a netns other than the one
  the request runs in. The rtnl\nchangelink path checks CAP_NET_ADMIN only against
  dev_net(dev), so a\ncaller privileged there but not in xi->net can rewrite an interface
  that\nlives in xi->net.\n\nGate xfrmi_changelink() on rtnl_dev_link_net_capable()
  at its top,\nbefore any attribute is parsed."
