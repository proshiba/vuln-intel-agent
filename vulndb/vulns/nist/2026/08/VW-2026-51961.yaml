title: WWBN AVideo contains an unauthenticated reflected cross-site scripting 
  vulnerability in the url2Embed.json.php endpoint that allows attackers to 
  inject malicious scripts by supplying URLs with HTML metacharacters. Attackers
  can mint an encrypted evideo payload containing unescaped markup, then deliver
  it as a legitimate-looking link on the site's own domain to execute JavaScript
  in victims' sessions and steal cookies or CSRF tokens.
