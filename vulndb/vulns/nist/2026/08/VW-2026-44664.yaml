title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/bnxt_re:
  Avoid repeated requests to allocate WC pages\n\nApplications can request multiple
  WC pages for the same ucontext.\nAs of now, only 1 WC page per ucontext is supported.
  Add a lock to\navoid concurrent access and a check to fail repeated requests.\n\
  Also, if the mmap entry insert fails for the WC, free the Doorbell\npage index mapped
  for the WC page."
