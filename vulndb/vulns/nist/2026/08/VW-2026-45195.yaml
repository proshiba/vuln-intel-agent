title: 'A security vulnerability has been detected in GL.iNet BE9300 and MT6000 4.8.x.
  This vulnerability affects unknown code of the component Firewall-management RPC.
  The manipulation of the argument dest_port/dest_ip leads to os command injection.
  The attack may be initiated remotely. Upgrading to version 4.9.0 is able to resolve
  this issue. The affected component should be upgraded. The vendor explains: "After
  our investigation, we have confirmed that the vulnerability described (...) does
  indeed exist."'
