title: "In the Linux kernel, the following vulnerability has been resolved:\n\nila:
  block BH in ila_output()\n\nAs explained in commit 1378817486d6 (\"tipc: block BH\n\
  before using dst_cache\"), net/core/dst_cache.c\nhelpers need to be called with
  BH disabled.\n\nila_output() is called from lwtunnel_output()\npossibly from process
  context, and under rcu_read_lock().\n\nWe might be interrupted by a softirq, re-enter
  ila_output()\nand corrupt dst_cache data structures.\n\nFix the race by using local_bh_disable()."
