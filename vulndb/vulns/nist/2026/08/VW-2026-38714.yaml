title: FreeRDP before 3.29.0 (affected versions <= 3.28.0) contains a 
  divide-by-zero vulnerability in the rdpecam camera redirection client. 
  ecam_dev_process_start_streams_request() parses a server-controlled 
  CAM_MEDIA_TYPE_DESCRIPTION from a StartStreamsRequest PDU but validates only 
  Format and Flags, not FrameRateDenominator. When a malicious or compromised 
  RDP server sends a StartStreamsRequest with FrameRateDenominator set to zero, 
  ecam_encoder_context_init() (channels/rdpecam/client/encoding.c) computes 
  FrameRateNumerator / FrameRateDenominator, causing an integer division by zero
  (SIGFPE) and termination of the FreeRDP client process. Camera redirection 
  must be enabled on the client for the channel to be reachable. Fixed in 
  FreeRDP 3.29.0.
