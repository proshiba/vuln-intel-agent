title: A vulnerability was detected in iswalle getnote-mcp up to 1.5.0. The 
  affected element is the function fs.readFileSync of the file src/index.ts of 
  the component upload_image. Performing a manipulation of the argument 
  image_path results in path traversal. The attack can be initiated remotely. 
  The exploit is now public and may be used. Upgrading to version 1.5.1 is 
  sufficient to fix this issue. The patch is named 
  7f9a215e03575c650d38c8f87fc6d8d363fed80d. Upgrading the affected component is 
  advised.
