title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  byd - synchronize timer deletion before freeing private data\n\nbyd_disconnect()
  uses timer_delete() before freeing the driver's private\ndata.  This does not wait
  for a running byd_clear_touch() callback, which\ndereferences the private data and
  its psmouse pointer.  A callback racing\nwith disconnect can therefore access the
  private data after it has been\nfreed.  The timer can also still be re-armed by
  byd_process_byte() while\nthe disconnect is in progress.\n\nUse timer_shutdown_sync()
  before freeing the private data: it waits for\na running callback and turns any
  later re-arm attempt into a no-op."
