title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatchdog:
  unregister PM notifier on watchdog unregister\n\nwatchdog_register_device() registers
  wdd->pm_nb when\nWDOG_NO_PING_ON_SUSPEND is set, but watchdog_unregister_device()
  does not\nremove it. This leaves an embedded notifier block on the PM notifier chain\n\
  after the watchdog device has been unregistered.\n\nA later suspend/resume notification
  can then call watchdog_pm_notifier()\nwith a stale watchdog_device pointer, or at
  minimum after wdd->wd_data has\nbeen cleared by watchdog_dev_unregister().\n\nUnregister
  the PM notifier before tearing down the watchdog device."
