title: Multiple DrayTek VigorSwitch models contain a null pointer dereference 
  vulnerability in the formlogout function. The vulnerability is caused by 
  missing checks for an empty or absent Cookie header before string handling. A 
  remote attacker can trigger this vulnerability via a crafted request to crash 
  the service and cause a denial of service. Exploitation requires valid 
  administrative credentials for the device's web management interface.
