title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  phy: sfp: free mii_bus in sfp_i2c_mdiobus_destroy\n\nsfp_i2c_mdiobus_create() allocates
  the I2C MDIO bus with mdio_i2c_alloc(),\na plain (non-devm) allocation, and registers
  it. sfp_i2c_mdiobus_destroy()\nonly unregisters the bus and clears sfp->i2c_mii
  without calling\nmdiobus_free(). As the only reference to the bus is then cleared,
  the\nstruct mii_bus is leaked.\n\nThis is hit whenever a copper/RollBall SFP module
  that instantiated an MDIO\nbus is removed: sfp_sm_main() takes the global teardown
  path and calls\nsfp_i2c_mdiobus_destroy(). sfp_cleanup(), on driver unbind, frees\n\
  sfp->i2c_mii directly, which is why the leak only triggered on module\nhot-removal
  and not on unbind.\n\nFree the bus in sfp_i2c_mdiobus_destroy() to match the allocation
  done in\nsfp_i2c_mdiobus_create()."
