title: A weakness has been identified in GL.iNet GL-MT3000 up to 4.4.5. This 
  issue affects the function remove_profile of the file /cgi-bin/glc of the 
  component modem.so. This manipulation causes command injection. It is possible
  to initiate the attack remotely. The exploit has been made available to the 
  public and could be used for attacks. The vendor was contacted early about 
  this disclosure and confirmed the existence of the vulnerability.
