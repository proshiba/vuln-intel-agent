title: 'A vulnerability was found in Webkul Bagisto up to 2.4.4. Affected by this
  issue is some unknown functionality of the file /admin/configuration/cache-management/execute
  of the component Configuration Management. The manipulation of the argument action
  results in authorization bypass. The attack may be launched remotely. The exploit
  has been made public and could be used. The vendor confirms: "The reported issues
  were already identified through our internal security assessment process prior to
  this notification and are being handled through our established internal security
  and development lifecycle. Some of these items have already been addressed, while
  the remaining items are planned for resolution in upcoming product releases."'
