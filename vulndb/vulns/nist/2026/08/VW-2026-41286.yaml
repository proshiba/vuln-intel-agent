title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  radio-si476x: Unregister v4l2_device on probe failure\n\nsi476x_radio_probe() registers
  radio->v4l2dev before allocating the V4L2\ncontrols and before registering the video
  device. If any of those later\nsteps fails, probe returns through the exit label
  after freeing only the\ncontrol handler.\n\nA failed probe does not call si476x_radio_remove(),
  so the\nv4l2_device_unregister() there is not reached. This leaves the parent\n\
  device reference taken by v4l2_device_register() behind on the error path.\n\nUnregister
  the V4L2 device in the probe error path after freeing the\ncontrols."
