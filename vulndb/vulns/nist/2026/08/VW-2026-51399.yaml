title: "In the Linux kernel, the following vulnerability has been resolved:\n\nEDAC/igen6:
  Fix call trace due to missing release()\n\nWhen unloading the igen6_edac driver,
  there is a call trace:\n\n  Device '(null)' does not have a release() function,
  it is broken and must be fixed.\n  See Documentation/core-api/kobject.rst.\n  WARNING:
  drivers/base/core.c:2567 at device_release+0x84/0x90, CPU#5: rmmod/127209\n  ...\n\
  \  RIP: 0010:device_release+0x84/0x90\n  Call Trace:\n   <TASK>\n   kobject_put+0x8c/0x220\n\
  \   put_device+0x17/0x30\n   igen6_unregister_mcis+0xa2/0xe0 [igen6_edac]\n   igen6_remove+0x82/0xb0
  [igen6_edac]\n   ...\n\nFix the call trace by providing empty release() functions
  for the\nmemory controller devices."
