title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmemstick:
  ms_block: reject a card that reports too many blocks\n\nmsb_ftl_initialize() computes
  the zone count from the card block count\nwith no bound:\n\n\tmsb->zone_count =
  msb->block_count / MS_BLOCKS_IN_ZONE;\n\t...\n\tfor (i = 0; i < msb->zone_count;
  i++)\n\t\tmsb->free_block_count[i] = MS_BLOCKS_IN_ZONE;\n\nmsb->block_count is a
  card value. msb_read_boot_blocks() reads\nnumber_of_blocks from the card boot page
  and byte swaps it.\nfree_block_count is a fixed int[MS_MAX_ZONES]. MS_MAX_ZONES
  is 16, so the\nvalid indices are 0 to 15. The init loop above indexes it by zone_count.\n\
  msb_mark_block_used() and msb_mark_block_unused() index it by\npba / MS_BLOCKS_IN_ZONE,
  for pba up to block_count - 1. A card may report\nup to 65535 blocks. A block_count
  above 8192 (MS_MAX_ZONES *\nMS_BLOCKS_IN_ZONE) lets the pba index reach 16. That
  writes past\nfree_block_count[] and corrupts struct msb_data. A larger count runs
  the\ninit loop past the end to"
