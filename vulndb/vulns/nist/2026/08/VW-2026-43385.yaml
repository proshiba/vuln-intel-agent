title: Flowise before 3.1.3 contains a code injection vulnerability in the CSV 
  Agent node's customReadCSV parameter that allows authenticated attackers to 
  execute arbitrary Python code. The validator uses a static regex blocklist 
  that can be bypassed through obfuscation techniques, enabling attackers to 
  execute code in the unsandboxed pyodide environment with full system access.
