title: 'Type confusion in PostgreSQL module "refint" allows an object creator to execute
  arbitrary code as the operating system user running the database.  The fix for this
  emerged as a non-security bug report, and the fix appear in the git repository with
  subject "refint: Remove plan cache.", without a CVE number.  Versions before PostgreSQL
  18.5, 17.11, 16.15, 15.19, and 14.24 are affected.'
