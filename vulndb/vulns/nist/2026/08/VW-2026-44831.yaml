title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfsplus:
  Remove the duplicate attr inode dirty marking action\n\nSyzbot reported a null-ptr-deref
  in [1].\nIf the attributes file is not loaded during system mount, a trigger\noccurs
  [1] when setxattr is executed in userspace.\n\nRemove the first mark attr inode
  dirty operation.\n\n[1]\nKASAN: null-ptr-deref in range [0x0000000000000008-0x000000000000000f]\n\
  Call Trace:\n hfsplus_setxattr+0x124/0x340 fs/hfsplus/xattr.c:555\n hfsplus_trusted_setxattr+0x40/0x60
  fs/hfsplus/xattr_trusted.c:30\n __vfs_setxattr+0x43c/0x480 fs/xattr.c:218\n __vfs_setxattr_noperm+0x12d/0x660
