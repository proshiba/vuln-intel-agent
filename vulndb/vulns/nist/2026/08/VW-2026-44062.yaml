title: "PAX Technology Q80 AIP File Parsing Link Following Remote Code Execution Vulnerability.
  This vulnerability allows network-adjacent attackers to execute arbitrary code on
  affected installations of PAX Technology Q80. Authentication is not required to
  exploit this vulnerability.\n\nThe specific flaw exists within the parsing of AIP
  files. By creating a symbolic link, an attacker can abuse the installer process
  to write arbitrary files. An attacker can leverage this in conjunction with other
  vulnerabilities to execute code in the context of root. Was ZDI-CAN-30583."
