title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngeneve:
  gate GRO hint in geneve_gro_complete() on gs->gro_hint\n\ngeneve_gro_receive() reads
  the GRO hint through geneve_sk_gro_hint_off(),\nwhich honours it only when the socket
  enabled IFLA_GENEVE_GRO_HINT\n(gs->gro_hint). geneve_gro_complete() instead calls
  the low-level\ngeneve_opt_gro_hint_off() and acts on the hint unconditionally.\n\
  \nOn a tunnel without the hint, receive aggregates the frames as plain\nETH_P_TEB
  while complete still honours an attacker-supplied hint option: it\ninflates gh_len
  by gro_hint->nested_hdr_len (u8) and redirects the dispatch\ntype, so the inner
  gro_complete handler runs at nhoff + gh_len, an offset\nreceive never pulled nor
  validated, reading out of bounds of the skb head:\n\n  BUG: KASAN: slab-out-of-bounds
  in ipv6_gro_complete (net/ipv6/ip6_offload.c:196)\n  Read of size 1 at addr ffff88800fe91980
  by task exploit/153\n   ipv6_gro_complete (net/ipv6/ip6_offload.c:196)\n   geneve_gro_complete
  (drive"
