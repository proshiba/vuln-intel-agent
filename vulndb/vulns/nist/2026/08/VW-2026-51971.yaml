title: Admidio before 5.0.12 fails to sanitize album names in the photo ZIP 
  download functionality, allowing authenticated users with album-creation 
  rights to include path traversal segments in archive entry names. Attackers 
  can craft malicious album names containing directory traversal sequences that 
  escape the intended directory when recipients extract the archive, potentially
  writing files outside the target directory.
