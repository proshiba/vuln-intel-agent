title: "In the Linux kernel, the following vulnerability has been resolved:\n\norangefs:
  keep the readdir entry size 64-bit in fill_from_part()\n\nfill_from_part() computes
  the size of a directory entry in size_t but\nstores it in a __u32. An entry length
  near U32_MAX wraps it to a small\nvalue, bypasses the bounds check, and is then
  used to index the entry,\nreading far past the directory part -- an out-of-bounds
  read that oopses\nthe kernel.\n\nCompute the size as a u64 so it cannot truncate;
  the bounds check then\nrejects the entry. The trailer is supplied by the userspace
  client."
