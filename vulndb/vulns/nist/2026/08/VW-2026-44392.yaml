title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvdimm/btt:
  Free arena sub-allocations on discover_arenas() error path\n\nMemory allocated by
  btt_freelist_init(), btt_rtt_init(), and\nbtt_maplocks_init() is not freed on some
  discover_arenas() error\npaths. This leaks memory when arena discovery fails.\n\n\
  Add the missing kfree() calls to release the allocations before\nreturning an error.\n\
