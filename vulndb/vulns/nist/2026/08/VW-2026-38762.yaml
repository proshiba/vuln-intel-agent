title: "Allocation of Resources Without Limits or Throttling in ueberauth guardian
  allows denial of service via unbounded atom creation from attacker-controlled binary
  input.\n\nGuardian.Permissions.AtomEncoding encodes permission scopes by passing
  arbitrary binaries to String.to_atom/1. When encode/3 in lib/guardian/permissions/atom_encoding.ex
  is called with a list, each binary entry is handled by the encode_value/3 binary
  clause, which calls String.to_atom(value) with no allow-list check. The perm_set
  argument (the application's small, finite set of legitimate permission names) is
  discarded, so any external string flows straight into atom creation. This encoder
  is selected with use Guardian.Permissions, encoding: Guardian.Permissions.AtomEncoding
  and reached through the imported encode/3 entry point.\n\nString.to_atom/1 creates
  a brand-new atom for every previously unseen binary, atoms are never garbage collected,
