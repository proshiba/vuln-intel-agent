title: "Kenwood DNR1007XR startUpdateProcess Command Injection Vulnerability. This
  vulnerability allows physically present attackers to execute arbitrary code on affected
  installations of Kenwood DNR1007XR devices. Authentication is not required to exploit
  this vulnerability.\n\nThe specific flaw exists within the startUpdateProcess method.
  The issue results from the lack of proper validation of a user-supplied string before
  using it to execute a system call. An attacker can leverage this vulnerability to
  execute arbitrary code in the context of root. Was ZDI-CAN-28981."
