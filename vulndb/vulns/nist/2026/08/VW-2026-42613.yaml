title: Cap v0.3.1 contains a broken access control vulnerability in the POST 
  /api/video/comment endpoint that allows authenticated users to post comments 
  on any private video without permission by supplying an arbitrary videoId in 
  the request body. Attackers can inject comments into private video recordings 
  belonging to other users, trigger comment notification emails to the video 
  owner, and enumerate valid video IDs through response differences.
