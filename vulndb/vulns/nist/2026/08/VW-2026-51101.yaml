title: "ServiceNow has remediated an improper access control vulnerability that was
  identified in the ServiceNow AI platform. This vulnerability could enable an unauthenticated
  user, in certain circumstances, to create or modify instance data beyond what was
  intended, resulting in privilege escalation. \n\n\n\n\n\nServiceNow deployed a security
  update to hosted instances and ServiceNow provided the update to our partners and
  self-hosted customers. We are not currently aware of exploitation against ServiceNow
  instances. \n\n\n\nWe recommend customers promptly apply appropriate updates or
  upgrade to a patched release if they have not already done so."
