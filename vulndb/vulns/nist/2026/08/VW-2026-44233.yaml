title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mana: Sync page pool RX frags for CPU\n\nMANA allocates RX buffers from page pool
  fragments when frag_count is\ngreater than 1. In that case the buffers remain DMA
  mapped by page pool\nand the RX completion path does not call dma_unmap_single().
  As a result,\nthe implicit sync-for-CPU normally performed by dma_unmap_single()
  is\nmissing before the packet data is passed to the networking stack.\n\nThis breaks
  RX on configurations which require explicit DMA syncing, for\nexample when booted
  with swiotlb=force.\n\nFix this by recording the page pool page and DMA sync offset
  when the RX\nbuffer is allocated, and syncing the received packet range for CPU
  access\nbefore handing the RX buffer to the stack."
