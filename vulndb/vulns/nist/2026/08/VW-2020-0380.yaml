title: "An information disclosure vulnerability exists when the Windows kernel improperly
  handles objects in memory. An attacker who successfully exploited this vulnerability
  could obtain information to further compromise the user’s system.\nTo exploit this
  vulnerability, an attacker would have to log on to an affected system and run a
  specially crafted application. The vulnerability would not allow an attacker to
  execute code or to elevate user rights directly, but it could be used to obtain
  information that could be used to try to further compromise the affected system.\n\
  The update addresses the vulnerability by correcting how the Windows kernel handles
  objects in memory."
