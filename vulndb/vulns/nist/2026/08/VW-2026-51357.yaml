title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  gw: acquire ethernet header only after skb realloc\n\nThe pskb_may_pull() called
  by batadv_get_vid() could reallocate the buffer\nbehind the skb. Variables which
  were pointing to the old buffer need to be\nreassigned to avoid an use-after-free."
