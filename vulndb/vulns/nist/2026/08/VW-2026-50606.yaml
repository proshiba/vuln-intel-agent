title: amqp091-go is a Go AMQP 0.9.1 client. Before version 1.13.0, a 
  compromised or malicious AMQP broker can force the client to allocate 
  resources for and process content body frames that exceed the negotiated 
  frame_max limit. This can lead to unexpected memory consumption or 
  application-layer denial of service (DoS), bypassing the protocol's built-in 
  framing constraints. Version 1.13.0 contains a fix. No known workarounds are 
  available.
