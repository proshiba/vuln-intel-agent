title: A security flaw has been discovered in CheckMAL AppCheck Pro 3.1.43.10. 
  Affected is an unknown function in the library AppCheckD.sys of the component 
  Kernel Mini-Filter Driver. Performing a manipulation results in uncontrolled 
  search path. The attack requires a local approach. The complexity of an attack
  is rather high. The exploitability is told to be difficult. The exploit has 
  been released to the public and may be used for attacks. The vendor was 
  contacted early about this disclosure but did not respond in any way.
