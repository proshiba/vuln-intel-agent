title: "Yuxi is a large-model-based intelligent knowledge base and knowledge graph
  agent development platform. Prior to version 0.6.2, the project's authentication
  mechanism contains a flaw. In affected versions, the system does not sufficiently
  validate the identity token in the Authorization header — only performing a validity
  check. This allows an administrator token generated in another deployment instance
  or local testing environment to be used to access the backend management interfaces
  of a different affected instance. An attacker who obtains or constructs an acceptable
  administrator Authorization token may bypass normal login authentication and gain
  administrator privileges. This vulnerability could allow an attacker to access system
  configurations, invoke backend management APIs, create administrator accounts, and
  ultimately take over the system backend. This issue has been fixed in version 0.6.2.
