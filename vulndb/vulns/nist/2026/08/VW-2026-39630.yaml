title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix fils_discovery double free on alloc failure\n\nieee80211_set_fils_discovery()
  calls kfree_rcu() on the old template\nbefore allocating the replacement. If the
  kzalloc() then fails, it\nreturns -ENOMEM while link->u.ap.fils_discovery still
  points at the\nobject already queued for freeing. A later update or AP teardown\n\
  (ieee80211_stop_ap()) re-queues that same rcu_head; the second free is\ncaught by
  KASAN when the RCU sheaf is processed in softirq:\n\n  BUG: KASAN: double-free in
  rcu_free_sheaf (mm/slub.c:5850)\n  Free of addr ffff88800c065280 by task swapper/0/0\n\
  \   ...\n   __rcu_free_sheaf_prepare (mm/slub.c:2634 mm/slub.c:2940)\n   rcu_free_sheaf
  (mm/slub.c:5850)\n   rcu_core (kernel/rcu/tree.c:2617 kernel/rcu/tree.c:2869)\n\
  \   handle_softirqs (kernel/softirq.c:622)\n  The buggy address belongs to the cache
  kmalloc-96 of size 96\n\nQueue the old object for kfree_rcu() only after the new
  one is published,\nmatching i"
