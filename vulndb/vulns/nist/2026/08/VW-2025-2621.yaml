title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_set_pipapo: fix initial map fill\n\nThe initial buffer has to be inited to all-ones,
  but it must restrict\nit to the size of the first field, not the total field size.\n\
  \nAfter each round in the map search step, the result and the fill map\nare swapped,
  so if we have a set where f->bsize of the first element\nis smaller than m->bsize_max,
  those one-bits are leaked into future\nrounds result map.\n\nThis makes pipapo find
  an incorrect matching results for sets where\nfirst field size is not the largest.\n\
  \nFollowup patch adds a test case to nft_concat_range.sh selftest script.\n\nThanks
  to Stefano Brivio for pointing out that we need to zero out\nthe remainder explicitly,
  only correcting memset() argument isn't enough."
