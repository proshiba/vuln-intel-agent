title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix err_chunk memory leaks in INIT handling\n\nWhen sctp_verify_init() encounters
  unrecognized parameters, it allocates an\nerr_chunk to report them. However, this
  chunk is leaked in several code\npaths:\n\n1. In sctp_sf_do_5_1B_init(), if security_sctp_assoc_request()
  fails after\n   sctp_verify_init() has populated err_chunk, the function returns\n\
  \   immediately without freeing it.\n\n2. In sctp_sf_do_unexpected_init(), the same
  leak occurs on the\n   security_sctp_assoc_request() failure path.\n\n3. In sctp_sf_do_unexpected_init(),
  on the success path after copying\n   unrecognized parameters to the INIT-ACK, the
  function returns without\n   freeing err_chunk, unlike sctp_sf_do_5_1B_init() which
  properly frees\n   it.\n\nFix all three leaks by adding sctp_chunk_free(err_chunk)
  calls before\nreturning in the error paths and on the success path in\nsctp_sf_do_unexpected_init()."
