title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: Fix possible token leak in mt7996_tx_prepare_skb()\n\nIf link_conf
  or link_sta lookup fails in mt7996_tx_prepare_skb routine,\nmt7996 driver leaks
  an already allocated tx token. Fix the issue\nreleasing the token in case of error."
