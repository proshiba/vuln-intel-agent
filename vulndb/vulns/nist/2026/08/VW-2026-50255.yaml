title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix another iunlink infinite loop bug in online fsck\n\nxrep_iunlink_resolve_bucket
  is supposed to reconstruct as much of the\nincore prev and next unlinked list pointers
  based on what it finds on\ndisk and in memory before we move on to relinking the
  truly lost inodes\nback into the unlinked list.  However, it's still vulnerable
  to infinite\nloops that come in via the next_unlinked pointers.\n\nFix this problem
  by remembering which inodes we've already seen and\nchecking new agino pointers
  against that.  If a bit is already set,\neither this is a loop or the inode has
  nonzero link count.  We'll deal\nwith the second case in a subsequent patch."
