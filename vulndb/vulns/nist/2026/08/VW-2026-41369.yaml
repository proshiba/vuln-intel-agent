title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/vm:
  Fix SVM leak on resv obj alloc failure in xe_vm_create()\n\nCommit 9e9787414882
  (\"drm/xe/userptr: replace xe_hmm with gpusvm\") made\nxe_svm_init() unconditional
  in xe_vm_create() and extended it to also\ninitialize a \"simple\" gpusvm state
  for non-fault-mode VMs. The matching\nxe_svm_fini() call in xe_vm_close_and_put()
  was updated to run\nunconditionally, but the error unwind path in xe_vm_create()
  was not.\n\nOn the drm_gpuvm_resv_object_alloc() failure path, xe_svm_init() has\n\
  already succeeded but xe_svm_fini() is only called when\nXE_VM_FLAG_FAULT_MODE is
  set. For non-fault-mode VMs this leaves\nvm->svm.gpusvm partially initialized and
  leaks the resources allocated\nby drm_gpusvm_init().\n\nFor fault-mode VMs, xe_svm_init()
  additionally acquires the pagemap\nowner via drm_pagemap_acquire_owner() and the
  pagemaps via\nxe_svm_get_pagemaps(). Those resources are released by xe_svm_close(),\n\
  not xe_svm_fini(). On the same e"
