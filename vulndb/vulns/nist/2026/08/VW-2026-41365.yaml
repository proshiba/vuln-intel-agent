title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qrtr: restrict socket creation to the initial network namespace\n\nQRTR keeps its
  entire port and node state in module-global variables\nthat are not partitioned
  per network namespace: qrtr_local_nid is a\nsingle global node id (always 1) and
  qrtr_ports is a single global\nxarray. qrtr_port_lookup() and qrtr_local_enqueue()
  operate on that\nglobal state with no network-namespace check, and qrtr_create()
  places\nno restriction on the namespace a socket is created in.\n\nAs a result an
  unprivileged process that creates an AF_QIPCRTR socket\nin a separate network namespace,
  e.g. via\nunshare(CLONE_NEWUSER | CLONE_NEWNET), can send QRTR datagrams -\nincluding
  control-plane messages such as QRTR_TYPE_NEW_SERVER - to QRTR\nsockets owned by
  another namespace, and vice versa. The receiving\nsocket sees such a message as
  coming from node id 1, indistinguishable\nfrom a legitimate local client, breaking
  the isolation that network\nnamespa"
