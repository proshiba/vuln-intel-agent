title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_connmark: reject invalid shift parameters\n\nRevision 2 of the CONNMARK target
  accepts user-controlled shift\nparameters and applies them to 32-bit mark values
  in\nconnmark_tg_shift().\n\nA shift_bits value of 32 or more triggers an undefined-shift
  bug when\nthe rule is evaluated. Invalid shift_dir values are also accepted and\n\
  silently fall back to the left-shift path.\n\nReject invalid revision-2 shift parameters
  in connmark_tg_check() so\nmalformed rules fail at installation time, before they
  can reach the\npacket path."
