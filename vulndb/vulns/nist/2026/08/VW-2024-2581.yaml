  Initialize struct nfsd4_copy earlier\n\nEnsure the refcount and async_copies fields
  are initialized early.\ncleanup_async_copy() will reference these fields if an error
  occurs\nin nfsd4_copy(). If they are not correctly initialized, at the very\nleast,
  a refcount underflow occurs."
