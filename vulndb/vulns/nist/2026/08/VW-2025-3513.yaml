title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to avoid f2fs_bug_on() in dec_valid_node_count()\n\nAs Yanming reported in bugzilla:\n\
  \nhttps://bugzilla.kernel.org/show_bug.cgi?id=215897\n\nI have encountered a bug
  in F2FS file system in kernel v5.17.\n\nThe kernel should enable CONFIG_KASAN=y
  and CONFIG_KASAN_INLINE=y. You can\nreproduce the bug by running the following commands:\n\
  \nThe kernel message is shown below:\n\nkernel BUG at fs/f2fs/f2fs.h:2511!\nCall
  Trace:\n f2fs_remove_inode_page+0x2a2/0x830\n f2fs_evict_inode+0x9b7/0x1510\n evict+0x282/0x4e0\n\
  \ do_unlinkat+0x33a/0x540\n __x64_sys_unlinkat+0x8e/0xd0\n do_syscall_64+0x3b/0x90\n\
  \ entry_SYSCALL_64_after_hwframe+0x44/0xae\n\nThe root cause is: .total_valid_block_count
  or .total_valid_node_count\ncould fuzzed to zero, then once dec_valid_node_count()
  was called, it\nwill cause BUG_ON(), this patch fixes to print warning info and
  set\nSBI_NEED_FSCK into CP instead of panic."
