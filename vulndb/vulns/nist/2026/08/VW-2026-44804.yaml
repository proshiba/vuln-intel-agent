title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: midi: Serialize output teardown with event_input\n\nevent_process_midi() borrows
  msynth->output_rfile.output and then\npasses the substream to dump_midi() and snd_rawmidi_kernel_write()\n\
  without synchronizing with the output open/close transition.\nmidisynth_use() also
  publishes output_rfile before\nsnd_rawmidi_output_params() has finished.\n\nThe
  last midisynth_unuse() can therefore release the same rawmidi file\nand free substream->runtime
  before snd_rawmidi_kernel_write1() takes\nits runtime buffer reference. That leaves
  the event_input path using a\nstale substream or runtime and can end in a NULL-deref
  or use-after-free.\n\nFix this with two pieces of synchronization. Keep a short
  IRQ-safe\nspinlock only for publishing or clearing output_rfile and for pairing\n\
  the output snapshot with an snd_use_lock_t reference. Once\nevent_process_midi()
  has taken that in-flight reference, it drops the\nspinlock before calling snd_se"
