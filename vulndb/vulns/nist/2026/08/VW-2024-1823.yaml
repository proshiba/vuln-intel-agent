title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  qcom: uefisecapp: Fix memory related IO errors and crashes\n\nIt turns out that
  while the QSEECOM APP_SEND command has specific fields\nfor request and response
  buffers, uefisecapp expects them both to be in\na single memory region. Failure
  to adhere to this has (so far) resulted\nin either no response being written to
  the response buffer (causing an\nEIO to be emitted down the line), the SCM call
  to fail with EINVAL\n(i.e., directly from TZ/firmware), or the device to be hard-reset.\n\
  \nWhile this issue can be triggered deterministically, in the current form\nit seems
  to happen rather sporadically (which is why it has gone\nunnoticed during earlier
  testing). This is likely due to the two\nkzalloc() calls (for request and response)
  being directly after each\nother. Which means that those likely return consecutive
  regions most of\nthe time, especially when not much else is going on in the system.\n\
