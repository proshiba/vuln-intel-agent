title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  Fix SQE threshold checking\n\nCurrent way of checking available SQE count which
  is based on\nHW updated SQB count could result in driver submitting an SQE\neven
  before CQE for the previously transmitted SQE at the same\nindex is processed in
  NAPI resulting losing SKB pointers,\nhence a leak. Fix this by checking a consumer
  index which\nis updated once CQE is processed."
