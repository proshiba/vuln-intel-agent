title: SeaweedFS is a distributed storage system. Prior to 4.24, the filer 
  registers the SeaweedIdentityAccessManagement gRPC service without mandatory 
  authentication when jwt.filer_signing.key is unset, allowing any client that 
  can reach the filer gRPC port to invoke CreateUser, CreateAccessKey, 
  PutPolicy, and related IAM RPCs to mint credentials and gain S3 administrative
  control. This issue is fixed in versions 4.24.
