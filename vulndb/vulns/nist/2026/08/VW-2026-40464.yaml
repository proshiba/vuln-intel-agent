title: Ground Station prior to 0.6.0 contains an unauthenticated blind 
  server-side request forgery vulnerability in the orbital-source configuration 
  path that allows any unauthenticated Socket.IO client to cause the 
  ground-station process to issue outbound HTTP requests to attacker-chosen 
  destinations. Attackers can connect to the Socket.IO server on port 7000 
  without credentials due to disabled authentication enforcement and a wildcard 
  CORS policy, then submit a data_submission event with submit-orbital-sources 
  action to persist an attacker-supplied URL in the database, then trigger an 
  orbital sync via the equally unauthenticated background_task:start event. The 
  URL is stored with no scheme allowlist, no host validation, and no rejection 
  of loopback, RFC1918, or link-local (cloud instance metadata at 
  169.254.169.254) addresses, and is passed directly to requests.get in 
  _fetch_http_3le and _fetch_http_omm in backend/tlesync/source_adapters.py. 
