title: In MongoDB Connector for BI, mongodrdl may write a TLS private-key 
  password to standard error when the password is supplied through both the 
  connection URI and the corresponding command-line option. A local user with 
  access to the captured command output and encrypted key file may use the 
  disclosed password to access the associated TLS client key.
