title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  vivid: check for vb2_is_busy() when toggling caps\n\nThe vivid_update_format_cap/out()
  functions must only be called if the\ncapture/output queue are not busy. But for
  the controls that select\nthe CROP/COMPOSE/SCALE capability that is not checked.\n\
  \nOnly when streaming starts will they be set to 'grabbed' and it is\nimpossible
  to change the control, but between REQBUFS and STREAMON you\nare still allowed to
  set these controls. Since vivid_update_format_cap/out\nwill change the format, this
  can cause unexpected results.\n\nBesides adding these checks, also add a WARN_ON
  in\nvivid_update_format_cap/out() if the queue is busy.\n\nI'm 90% certain that
  this is the cause of this syzbot bug:\n\nhttps://syzkaller.appspot.com/bug?extid=dac8f5eaa46837e97b89\n\
  \nBut since we never have reproducers, it is hard to be certain. In any case,\n\
  these checks are needed regardless."
