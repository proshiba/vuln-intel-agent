title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibbpf:
  Reject non-exclusive metadata maps in the signed loader\n\nThe loader verifies map->sha
  against the metadata hash in its\ninstructions. map->sha is calculated when BPF_OBJ_GET_INFO_BY_FD
  is\ncalled on the frozen map.\n\nWhile the map is frozen, the /signed loader/ must
  also ensure the map\nis exclusive, as, without exclusivity (which a hostile host
  could just\nomit when loading the loader), another BPF program with map access can\n\
  mutate the contents afterwards, so the check passes on stale data.\n\nWith the extra
  check as part of the signed loader, it now refuses to\nmove on with map->sha validation
  if the host set it up wrongly."
