title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: avoid suspicious RCU usage for synced VLAN-aware MAC addresses\n\nWhen using
  the felix driver (the only one which supports UC filtering\nand MC filtering) as
  a DSA master for a random other DSA switch, one can\nsee the following stack trace
  when the downstream switch ports join a\nVLAN-aware bridge:\n\n=============================\n\
  WARNING: suspicious RCU usage\n-----------------------------\nnet/8021q/vlan_core.c:238
  suspicious rcu_dereference_protected() usage!\n\nstack backtrace:\nWorkqueue: dsa_ordered
  dsa_slave_switchdev_event_work\nCall trace:\n lockdep_rcu_suspicious+0x170/0x210\n\
  \ vlan_for_each+0x8c/0x188\n dsa_slave_sync_uc+0x128/0x178\n __hw_addr_sync_dev+0x138/0x158\n\
  \ dsa_slave_set_rx_mode+0x58/0x70\n __dev_set_rx_mode+0x88/0xa8\n dev_uc_add+0x74/0xa0\n\
  \ dsa_port_bridge_host_fdb_add+0xec/0x180\n dsa_slave_switchdev_event_work+0x7c/0x1c8\n\
  \ process_one_work+0x290/0x568\n\nWhat it's saying is that vlan_for_each() expects
  rtnl_"
