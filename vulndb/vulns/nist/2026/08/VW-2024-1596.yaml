title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  cdns3: fix memory double free when handle zero packet\n\n829  if (request->complete)
  {\n830          spin_unlock(&priv_dev->lock);\n831          usb_gadget_giveback_request(&priv_ep->endpoint,\n\
  832                                    request);\n833          spin_lock(&priv_dev->lock);\n\
  834  }\n835\n836  if (request->buf == priv_dev->zlp_buf)\n837      cdns3_gadget_ep_free_request(&priv_ep->endpoint,
  request);\n\nDriver append an additional zero packet request when queue a packet,
  which\nlength mod max packet size is 0. When transfer complete, run to line 831,\n\
  usb_gadget_giveback_request() will free this requestion. 836 condition is\ntrue,
  so cdns3_gadget_ep_free_request() free this request again.\n\nLog:\n\n[ 1920.140696][\
  \  T150] BUG: KFENCE: use-after-free read in cdns3_gadget_giveback+0x134/0x2c0 [cdns3]\n\
  [ 1920.140696][  T150]\n[ 1920.151837][  T150] Use-after-free read at 0x000000003d1cd10b
  (in kfence-#36):\n[ 1920.159082][  T150]"
