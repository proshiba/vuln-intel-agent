title: FreeRDP is a free implementation of the Remote Desktop Protocol. Prior to
  3.27.0, rpc_client_recv_fragment in libfreerdp/core/gateway/rpc_client.c 
  ensures the response reassembly stream capacity using only the server-declared
  alloc_hint rather than the actual StubLength about to be written. A malicious 
  TS Gateway can send a PTYPE_RESPONSE with a small alloc_hint and a much larger
  frag_length, causing Stream_Write to copy attacker-controlled stub data beyond
  the 4096-byte pdu->s buffer. This can crash the client and may permit code 
  execution through heap corruption. This issue is fixed in version 3.27.0.
