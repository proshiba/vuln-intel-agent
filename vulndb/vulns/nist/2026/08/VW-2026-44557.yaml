title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  Always use the IRQ-safe variant when acquiring the fence lock\n\nSince dma_fence
  objects can be shared with other subsystems, they may be\naccessed from hardirq
  context in those drivers, and we have to take\nthat into account by also using the
  IRQ-safe variant when acquiring\nthe lock.\n\nWhile at it, switch to the guard model."
