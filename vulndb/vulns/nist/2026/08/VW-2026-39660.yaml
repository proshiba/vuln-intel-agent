title: "MLflow's AI Gateway accepts an auth_config.api_base value when creating a
  gateway secret (mlflow/server/handlers.py, _create_gateway_secret) with no validation
  of scheme, host, or IP range; the value is stored verbatim. The gateway proxy endpoint
  (mlflow/server/gateway_api.py, raw_proxy) subsequently issues an HTTP request to
  that stored api_base plus a caller-supplied path and returns the full response body.
  MLflow's existing SSRF guard, _validate_webhook_url (which blocks non-global and
  metadata IPs), is never invoked anywhere in this gateway secret/proxy code path.
  The CreateGatewaySecret action additionally has no entry in the permission-validator
  map, so it requires only basic authentication rather than any specific scope, meaning
  any authenticated user — including read-only accounts — can create a secret pointing
  at an internal address and reach it via the proxy endpoint, potentially exposing
  cloud-instance IAM credentials via metadata services. This is related to CVE-2026-4035, "
