title: MLflow's AI Gateway accepts an auth_config.api_base value when creating a
  gateway secret (mlflow/server/handlers.py, _create_gateway_secret) with no 
  validation of scheme, host, or IP range; the value is stored verbatim. The 
  gateway proxy endpoint (mlflow/server/gateway_api.py, raw_proxy) subsequently 
  issues an HTTP request to that stored api_base plus a caller-supplied path and
  returns the full response body.
