title: sysPass's FileBackupService::doBackupFiles() in 
  lib/SP/Services/Backup/FileBackupService.php around line 388 builds a tar 
  shell command by string-concatenating the backup directory path $this->path 
  directly into the command line ('tar czf ' . $backupFileApp . ' ' . BASE_PATH 
  . ' --exclude \"' . $this->path . '\" 2>&1') and passes the result to PHP's 
  exec() with no application of escapeshellarg() and no validation of the path 
  against a safe character set. The $this->path value is read from the sysPass 
  configuration, which is persisted in the database and writable through the 
  admin settings API and the admin UI. An administrator (or an attacker who has 
  obtained an admin API token or admin session) can therefore store a backup 
  path containing shell metacharacters and trigger a backup operation to execute
  arbitrary OS commands as the web server process user (typically www-data or 
