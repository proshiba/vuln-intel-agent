title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  Fix nexthop hash size\n\nThe nexthop code expects a 31 bit hash, such as what is
  returned by\nfib_multipath_hash() and rt6_multipath_hash(). Passing the 32 bit hash\n\
  returned by skb_get_hash() can lead to problems related to the fact that\n'int hash'
  is a negative number when the MSB is set.\n\nIn the case of hash threshold nexthop
  groups, nexthop_select_path_hthr()\nwill disproportionately select the first nexthop
  group entry. In the case\nof resilient nexthop groups, nexthop_select_path_res()
  may do an out of\nbounds access in nh_buckets[], for example:\n    hash = -912054133\n\
  \    num_nh_buckets = 2\n    bucket_index = 65535\n\nwhich leads to the following
  panic:\n\nBUG: unable to handle page fault for address: ffffc900025910c8\nPGD 100000067
  P4D 100000067 PUD 10026b067 PMD 0\nOops: 0002 [#1] PREEMPT SMP KASAN NOPTI\nCPU:
  4 PID: 856 Comm: kworker/4:3 Not tainted 6.5.0-rc2+ #34\nHardware name: QEMU Standard
  PC (i440FX + PIIX, 1996"
