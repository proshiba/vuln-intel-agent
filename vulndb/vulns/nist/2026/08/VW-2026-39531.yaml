title: "The ERP: Complete HR, Accounting & CRM Suite with WooCommerce CRM Support
  plugin for WordPress is vulnerable to SQL Injection via the 'erpadvancefilter' parameter
  in all versions up to, and including, 1.17.4 due to insufficient escaping on the
  user supplied parameter and lack of sufficient preparation on the existing SQL query.
  The handler runs the value through sanitize_text_field, which preserves single quotes,
  and the downstream erp_crm_contact_advance_filter() function interpolates it directly
  into a single-quoted SQL WHERE clause before execution via $wpdb->get_results().
  This makes it possible for authenticated attackers, with the plugin-supplied CRM
  Agent role (or higher CRM Manager / WordPress admin) and the erp_crm_list_contact
  capability, to append additional SQL queries into already existing queries that
  can be used to extract sensitive information from the database."
