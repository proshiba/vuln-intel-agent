title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ipset: fix refcount race between list:set GC and swap\n\n__ip_set_put_byindex()
  resolved the index to a set pointer under RCU,\nthen took ip_set_ref_lock in __ip_set_put()
  to decrement set->ref.\nip_set_swap() holds that same lock while swapping both the
  ip_set_list\nslots and the two sets' ref counters, so it can interleave between
  the\ndereference and the lock acquisition, leaving the caller to decrement a\nset
  whose reference already moved to the other index and hit\nBUG_ON(set->ref == 0).
  list_set_gc() reaches this from timer softirq,\nwhich the nfnl mutex does not serialize
  against swap: an expiring\nlist:set member calls list_set_del() -> ip_set_put_byindex()
  while\nIPSET_CMD_SWAP runs on the referenced sets.\n\nResolve the index and decrement
  under ip_set_ref_lock, as ip_set_swap()\nalready does, keeping the refcount tied
  to the index rather than to a\nstale set pointer.\n\n  kernel BUG at net/netfilter/ipset/ip_set_"
