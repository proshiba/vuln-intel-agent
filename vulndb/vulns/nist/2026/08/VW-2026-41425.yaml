title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirewire:
  net: Fix fragmented datagram reassembly\n\nfwnet_frag_new() keeps a sorted list
  of received fragments for a partial\ndatagram. When a new fragment is adjacent to
  an existing fragment, the\ncode checks whether the new fragment also closes the
  gap to the next or\nprevious list entry.\n\nThose neighbor lookups currently assume
  that the current fragment always\nhas a real next or previous fragment. At a list
  edge, the next or\nprevious entry is the list head, not a struct fwnet_fragment_info.\n\
