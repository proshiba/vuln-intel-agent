title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qedi: Fix use after free bug in qedi_remove()\n\nIn qedi_probe() we call __qedi_probe()
  which initializes\n&qedi->recovery_work with qedi_recovery_handler() and\n&qedi->board_disable_work
  with qedi_board_disable_work().\n\nWhen qedi_schedule_recovery_handler() is called,
  schedule_delayed_work()\nwill finally start the work.\n\nIn qedi_remove(), which
  is called to remove the driver, the following\nsequence may be observed:\n\nFix
  this by finishing the work before cleanup in qedi_remove().\n\nCPU0            \
  \      CPU1\n\n                     |qedi_recovery_handler\nqedi_remove        \
  \  |\n  __qedi_remove      |\niscsi_host_free      |\nscsi_host_put        |\n//free
  shost         |\n                     |iscsi_host_for_each_session\n           \
  \          |//use qedi->shost\n\nCancel recovery_work and board_disable_work in
  __qedi_remove()."
