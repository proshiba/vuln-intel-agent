title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix possible deadlock when holding Fwb to get inline_data\n\n1, mount with wsync.\n\
  2, create a file with O_RDWR, and the request was sent to mds.0:\n\n   ceph_atomic_open()-->\n\
  \     ceph_mdsc_do_request(openc)\n     finish_open(file, dentry, ceph_open)-->\n\
  \       ceph_open()-->\n         ceph_init_file()-->\n           ceph_init_file_info()-->\n\
  \             ceph_uninline_data()-->\n             {\n               ...\n    \
  \           if (inline_version == 1 || /* initial version, no data */\n        \
  \           inline_version == CEPH_INLINE_NONE)\n                     goto out_unlock;\n\
  \               ...\n             }\n\nThe inline_version will be 1, which is the
  initial version for the\nnew create file. And here the ci->i_inline_version will
  keep with 1,\nit's buggy.\n\n3, buffer write to the file immediately:\n\n   ceph_write_iter()-->\n\
  \     ceph_get_caps(file, need=Fw, want=Fb, ...);\n     generic_perform_write()-->\n\
  \       a_ops->write_b"
