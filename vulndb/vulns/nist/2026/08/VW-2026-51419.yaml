title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntools/power/x86/intel-speed-select:
  Harden daemon pidfile open\n\nAvoid symlink-based pidfile clobbering by opening
  the pidfile with\nO_NOFOLLOW and validating it with fstat() before locking/writing.\n\
  \nThe daemon currently uses a fixed pidfile path under /tmp. A local\nunprivileged
  user can pre-create a symlink at that path and cause a\nroot-run daemon instance
  to write into an attacker-chosen file."
