title: "A cross-tenant isolation vulnerability was found in Grafana’s Correlations
  feature affecting legacy correlation records. Due to a backward compatibility condition
  allowing org_id = 0 records to be returned across organizations, a user with datasource
  management privileges could read and permanently delete legacy correlation data
  belonging to another organization. This issue affects correlations created prior
  to Grafana 10.2 and is fixed in >=11.6.11, >=12.0.9, >=12.1.6, and >=12.2.4.\n\n\
  Thanks to Gyu-hyeok Lee (g2h) for reporting this vulnerability."
