title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexfat:
  fix out-of-bounds access of directory entries\n\nIn the case of the directory size
  is greater than or equal to\nthe cluster size, if start_clu becomes an EOF cluster(an
  invalid\ncluster) due to file system corruption, then the directory entry\nwhere
  ei->hint_femp.eidx hint is outside the directory, resulting\nin an out-of-bounds
  access, which may cause further file system\ncorruption.\n\nThis commit adds a check
  for start_clu, if it is an invalid cluster,\nthe file or directory will be treated
  as empty."
