title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma: Add spinlock to protect DONE_INT_MASK and ABORT_INT_MASK\n\nThe DONE_INT_MASK
  and ABORT_INT_MASK registers are shared by all DMA\nchannels, and modifying them
  requires a read-modify-write sequence.\nBecause this operation is not atomic, concurrent
  calls to\ndw_edma_v0_core_start() can introduce race conditions if two channels\n\
  update these registers simultaneously.\n\nAdd a spinlock to serialize access to
  these registers and prevent race\nconditions.\n\n[den: update dw_edma.lock comment]"
