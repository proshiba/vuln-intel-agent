title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath6kl: fix OOB access from firmware ADDBA window size\n\naggr_recv_addba_req_evt()
  logs a debug message when the firmware-supplied\nwin_sz is outside [AGGR_WIN_SZ_MIN,
  AGGR_WIN_SZ_MAX] but does not\nreturn. The out-of-range win_sz is then used in TID_WINDOW_SZ()
  to\ncompute a kzalloc size and stored in rxtid->hold_q_sz, leading to\nzero-size
  or overflowed allocations and subsequent out-of-bounds access.\n\nClean up any previously
  active aggregation session for the TID first,\nthen return early when win_sz is
  out of the valid range, instead of\nproceeding with a broken allocation size."
