title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/slab:
  prevent unbounded recursion in free path with new kmalloc type\n\nCommit 280ea9c3154b
  (\"mm/slab: avoid allocating slabobj_ext array from\nits own slab\") avoided recursive
  allocation of obj_exts from kmalloc\ncaches of the same size, by bumping the obj_exts
  array's allocation\nsize whenever the array size equals the size of the object being\n\
  allocated.\n\nHowever, as reported by Danielle Costantino and Shakeel Butt,\neven
  slabs from kmalloc caches of different sizes can form a cycle\nby allocating obj_exts
  arrays from each other [1]:\n\n  What happened: a KMALLOC_NORMAL slab's obj_exts
  array (used by\n  allocation profiling / memcg accounting) is itself kmalloc()'d
  from a\n  KMALLOC_NORMAL cache, so the \"slab holds another slab's obj_exts array\"\
  \n  relation can form cycles. With sizeof(struct slabobj_ext) == 16 and\n  the host's
