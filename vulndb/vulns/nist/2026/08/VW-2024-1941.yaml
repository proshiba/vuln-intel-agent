title: "In the Linux kernel, the following vulnerability has been resolved:\n\naio:
  fix use-after-free due to missing POLLFREE handling\n\nsignalfd_poll() and binder_poll()
  are special in that they use a\nwaitqueue whose lifetime is the current task, rather
  than the struct\nfile as is normally the case.  This is okay for blocking polls,
  since a\nblocking poll occurs within one task; however, non-blocking polls\nrequire
  another solution.  This solution is for the queue to be cleared\nbefore it is freed,
  by sending a POLLFREE notification to all waiters.\n\nUnfortunately, only eventpoll
  handles POLLFREE.  A second type of\nnon-blocking poll, aio poll, was added in kernel
  v4.18, and it doesn't\nhandle POLLFREE.  This allows a use-after-free to occur if
  a signalfd or\nbinder fd is polled with aio poll, and the waitqueue gets freed.\n\
  \nFix this by making aio poll handle POLLFREE.\n\nA patch by Ramji Jiyani <ramjiyani@google.com>\n\
