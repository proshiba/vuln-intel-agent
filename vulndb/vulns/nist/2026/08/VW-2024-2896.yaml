title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  drop messages from MDS when unmounting\n\nWhen unmounting all the dirty buffers
  will be flushed and after\nthe last osd request is finished the last reference of
  the i_count\nwill be released. Then it will flush the dirty cap/snap to MDSs,\n\
  and the unmounting won't wait the possible acks, which will ihold\nthe inodes when
  updating the metadata locally but makes no sense\nany more, of this. This will make
  the evict_inodes() to skip these\ninodes.\n\nIf encrypt is enabled the kernel generate
  a warning when removing\nthe encrypt keys when the skipped inodes still hold the
  keyring:\n\nWARNING: CPU: 4 PID: 168846 at fs/crypto/keyring.c:242 fscrypt_destroy_keyring+0x7e/0xd0\n\
  CPU: 4 PID: 168846 Comm: umount Tainted: G S  6.1.0-rc5-ceph-g72ead199864c #1\n\
  Hardware name: Supermicro SYS-5018R-WR/X10SRW-F, BIOS 2.0 12/17/2015\nRIP: 0010:fscrypt_destroy_keyring+0x7e/0xd0\n\
  RSP: 0018:ffffc9000b277e28 EFLAGS: 00010202\nRAX: 0000000000000002 RBX:"
