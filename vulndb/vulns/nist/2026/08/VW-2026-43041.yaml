title: "A stored cross-site scripting (XSS) vulnerability existed in Vulnerability-Lookup
  in the render_tag_badges Jinja filter used to display reference tags associated
  with vulnerability records.\n\nValues from containers.cna.references[].tags[] were
  directly interpolated into HTML badge elements and the resulting string was wrapped
  in markupsafe.Markup. Because Markup marks the generated content as safe, Jinja's
  automatic HTML escaping was bypassed.\n\nAn authenticated user with permissions
  to create or modify vulnerability records, such as a user holding the vulnerability:create
  or vulnerability:modify permission, could submit a crafted reference tag through
  the CNA API containing arbitrary HTML or JavaScript-capable markup.\n\nThe malicious
  value would subsequently be stored as part of the vulnerability record. When another
  user visited the corresponding public /cve/<id> or /vuln/<id> page, the crafted
  tag would be rendered as HTML in the viewer's browser. This could result in JavaScript
