title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring:
  preserve task restrictions across exec\n\nPer-task restrictions apply to all rings
  created by a task. Once\ninstalled, they should not be dropped across exec.\n\n\
  For a task that has used io_uring, the exec cancellation path calls\n__io_uring_free().
  This frees both the task context and the per-task\nrestriction, so a ring created
  after exec is unrestricted.\n\nSplit task context cleanup into io_uring_free_tctx(),
  and use it from\nthe exec cancellation path. Keep __io_uring_free() for final task\n\
  cleanup, where both the context and restriction are released."
