title: A flaw was found in GIMP. A remote attacker could exploit this by 
  tricking a user into opening a specially crafted PAA (Paint Shop Pro Array) 
  image file. This vulnerability, a heap-based out-of-bounds write in the 
  decode_lzss() function of the PAA file format plugin, allows data to be 
  written beyond the intended memory buffer. This could lead to heap metadata 
  corruption and potentially enable the attacker to execute arbitrary code on 
  the affected system.
