title: In openssl_encrypt (pip package openssl-encrypt) versions <= 1.4.8, the 
  desktop GUI passes the steganography password to the CLI child process on the 
  command line via the --stego-password argument (on both encrypt and decrypt 
  paths) instead of via an environment variable as done for the main password. 
  Any local user can read the steganography password from /proc/<pid>/cmdline 
  for the lifetime of the subprocess. Fixed in 1.4.9.
