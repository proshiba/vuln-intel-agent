title: An authorization bypass vulnerability in LXD allows an authenticated 
  attacker to bypass target project restrictions during instance migration. When
  migrating an instance to a target project, LXD accepts configuration overrides
  without validating the new configuration against the target project's enforced
  restrictions. An attacker can exploit this flaw to move instances with 
  disallowed high-privilege configurations into restricted projects, bypassing 
  security controls.
