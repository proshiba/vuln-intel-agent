title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  fix lz4 inplace decompression\n\nCurrently EROFS can map another compressed buffer
  for inplace\ndecompression, that was used to handle the cases that some pages of\n\
  compressed data are actually not in-place I/O.\n\nHowever, like most simple LZ77
  algorithms, LZ4 expects the compressed\ndata is arranged at the end of the decompressed
  buffer and it\nexplicitly uses memmove() to handle overlapping:\n  __________________________________________________________\n\
  \ |_ direction of decompression --> ____ |_ compressed data _|\n\nAlthough EROFS
  arranges compressed data like this, it typically maps two\nindividual virtual buffers
  so the relative order is uncertain.\nPreviously, it was hardly observed since LZ4
  only uses memmove() for\nshort overlapped literals and x86/arm64 memmove implementations
  seem to\ncompletely cover it up and they don't have this issue.  Juhyung reported\n\
