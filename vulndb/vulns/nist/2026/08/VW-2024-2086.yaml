title: "In the Linux kernel, the following vulnerability has been resolved:\n\nparisc:
  Try to fix random segmentation faults in package builds\n\nPA-RISC systems with
  PA8800 and PA8900 processors have had problems\nwith random segmentation faults
  for many years.  Systems with earlier\nprocessors are much more stable.\n\nSystems
  with PA8800 and PA8900 processors have a large L2 cache which\nneeds per page flushing
  for decent performance when a large range is\nflushed. The combined cache in these
  systems is also more sensitive to\nnon-equivalent aliases than the caches in earlier
  systems.\n\nThe majority of random segmentation faults that I have looked at\nappear
