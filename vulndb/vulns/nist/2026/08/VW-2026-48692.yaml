title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/packet:
  reset the MAC header on the packet-socket transmit path\n\npacket_parse_headers()
  resets the MAC header only for a SOCK_RAW frame\nwhose socket did not bind a protocol.
  A protocol-bound SOCK_RAW socket,\nany SOCK_DGRAM frame, and the legacy SOCK_PACKET
  path therefore leave\nskb->mac_header unset here.\n\nFor frames sent via __dev_queue_xmit()
  this is harmless: it resets the\nMAC header unconditionally. But the packet-socket
  PACKET_QDISC_BYPASS\npath uses dev_direct_xmit(), which does not, so the frame reaches\n\
  ndo_start_xmit() with the MAC header unset. A driver that reads\neth_hdr(skb) on
  transmit then dereferences skb->head + (u16)~0, an\nout-of-bounds access ~64 KiB
  past the head -- the same class fixed for\none consumer in commit f5089008f90c (\"\
  macsec: do not read an unset MAC\nheader in macsec_encrypt()\").\n\npacket_parse_headers()
  runs only on the transmit path, where skb->data\npoints at the start of the L2 header
  f"
