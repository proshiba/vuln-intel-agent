title: A vulnerability was detected in pkp pkp-lib up to 
  3.3.0-22/3.4.0-10/3.5.0-4. The affected element is the function _transformPHP 
  of the file classes/xslt/XSLTransformer.php. The manipulation results in xml 
  external entity reference. The attack can be executed remotely. Upgrading to 
  version 3.3.0-23, 3.4.0-11 and 3.5.0-5 is sufficient to fix this issue. The 
  patch is identified as 78c699370ea43ae2784e1c4ace7c947d207f2b47. Upgrading the
  affected component is advised.
