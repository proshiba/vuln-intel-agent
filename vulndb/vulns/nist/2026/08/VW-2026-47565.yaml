title: Wekan is open source kanban built with Meteor. Prior to 9.90, 
  isFileValid() in models/fileValidation.js used the Unix file command for 
  content-based MIME detection, but detectMimeFromFile() silently returned 
  undefined when that binary was unavailable and the validation fell back to the
  attacker-controlled fileObj.type supplied through 
  server/routes/attachmentApi.js. On deployments with WITH_API=true and no file 
  binary, an authenticated board member could label HTML containing JavaScript 
  as image/png, bypass the dangerous MIME check, and store active content under 
  the Wekan origin for execution when another user opened it. Version 9.90 adds 
  looksLikeDangerousMarkup() to inspect file bytes and force dangerous-content 
  scanning when MIME detection is unavailable. This issue is fixed in version 
  9.90.
