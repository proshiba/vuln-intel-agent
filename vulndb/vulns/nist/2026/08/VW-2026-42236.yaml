title: Integer overflow in the UEFI firmware for the Intel(R) Slim Bootloader 
  may allow an information disclosure. System software adversary with an 
  authenticated user combined with a low complexity attack may enable denial of 
  service. This result may potentially occur via local access when attack 
  requirements are not present without special internal knowledge and requires 
  active user interaction. The potential vulnerability may impact the 
  confidentiality (low), integrity (none) and availability (low) of the 
  vulnerable system, resulting in subsequent system confidentiality (low), 
  integrity (none) and availability (low) impacts.
