title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatchdog:
  at91sam9_wdt: prevent timer rearm during teardown\n\nat91_ping() rearms the watchdog
  timer from its callback. timer_delete()\nneither waits for a running callback nor
  prevents it from rearming the\ntimer, so probe failure or driver removal can leave
  the timer accessing the\ndevm-allocated at91wdt after it has been freed.\n\nUse
  timer_shutdown_sync() on both teardown paths. It waits for a running\ncallback and
  rejects any attempt by the callback to rearm the timer."
