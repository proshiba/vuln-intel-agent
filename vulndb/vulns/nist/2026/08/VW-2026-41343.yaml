title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  validate CP_GFX_SHADOW chunk size in CS pass1\n\nAdd a minimum-length check for
  the AMDGPU_CHUNK_ID_CP_GFX_SHADOW chunk in\namdgpu_cs_pass1(), matching the gate
  already present for the IB, FENCE and\nBO_HANDLES chunk types.\n\nThe CP_GFX_SHADOW
  case previously shared a bare break with the dependency\nand syncobj chunk types,
  which do not dereference a fixed-size struct. When\nuserspace submits this chunk
  with length_dw == 0, vmemdup_array_user() is\ncalled with size 0 and returns ZERO_SIZE_PTR,
  which passes the IS_ERR()\ncheck. amdgpu_cs_p2_shadow() then dereferences chunk->kdata
  as a struct\ndrm_amdgpu_cs_chunk_cp_gfx_shadow (reading shadow->flags), faulting
  on the\nZERO_SIZE_PTR and causing a NULL-pointer dereference.\n\nThis is reachable
  by an unprivileged process in the render group. Reject\nundersized chunks with -EINVAL
  during pass1 so the bad submission is\nrejected before pass2 ever dereferences the
  data.\n\n(cherry"
