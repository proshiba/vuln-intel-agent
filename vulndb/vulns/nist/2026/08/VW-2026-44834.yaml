title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/radeon:
  fix integer overflow in radeon_align_pitch()\n\nradeon_align_pitch() has the same
  kind of overflow issue as the old\namdgpu helper: both the alignment round-up add
  and the final\n'aligned * cpp' calculation can overflow signed int.\n\nIf that wraps,
  radeon_mode_dumb_create() can end up returning an\ninvalid pitch or creating a zero-sized
  dumb buffer.\n\nFix this by using check_add_overflow() for the alignment round-up
  and\ncheck_mul_overflow() for the final pitch calculation, returning 0 on\noverflow.
  Also reject zero pitch and size in\nradeon_mode_dumb_create().\n\nFound via AST-based
  call-graph analysis using sqry."
