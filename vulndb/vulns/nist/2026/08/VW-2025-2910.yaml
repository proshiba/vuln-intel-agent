title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  8250: Reinit port->pm on port specific driver unbind\n\nWhen we unbind a serial
  port hardware specific 8250 driver, the generic\nserial8250 driver takes over the
  port. After that we see an oops about 10\nseconds later. This can produce the following
  at least on some TI SoCs:\n\nUnhandled fault: imprecise external abort (0x1406)\n\
  Internal error: : 1406 [#1] SMP ARM\n\nTurns out that we may still have the serial
  port hardware specific driver\nport->pm in use, and serial8250_pm() tries to call
  it after the port\nspecific driver is gone:\n\nserial8250_pm [8250_base] from uart_change_pm+0x54/0x8c
  [serial_base]\nuart_change_pm [serial_base] from uart_hangup+0x154/0x198 [serial_base]\n\
