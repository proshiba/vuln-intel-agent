title: "A pre-authentication OS command injection vulnerability has been identified
  in Omada gateways configured to operate as an OpenVPN Server due to insufficient
  validation of client-supplied data during OpenVPN connection establishment. An unauthenticated
  remote attacker may provide specially crafted input influencing backend command
  execution logic before authentication completes. Exploitation requires the OpenVPN
  Server feature to be enabled, VPN service reachable by the attacker and attacker
  to be able to initiate an OpenVPN connection attempt. \n\n\n\nSuccessful exploitation
  may allow arbitrary command execution, potentially\nleading to full compromise of
  the affected device."
