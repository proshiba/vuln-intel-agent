title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuprobes:
  Fix NULL pointer dereference in hprobe_expire()\n\nForking a task that has a pending
  uretprobe can oops the kernel with a\nNULL pointer dereference in the clone() path:\n\
  \n  BUG: kernel NULL pointer dereference, address: 0000000000000018\n  Oops: 0002
  [#1] SMP NOPTI\n  RIP: 0010:hprobe_expire\n  CR2: 0000000000000018\n  Call Trace:\n\
  \   uprobe_copy_process\n   copy_process\n   kernel_clone\n   __x64_sys_clone\n\
  \   do_syscall_64\n   entry_SYSCALL_64_after_hwframe\n\nThis was found on real hosts
  on Meta fleet.\n\nI've got the impression that this is what is happening:\n\n  CPU
  1                          CPU 2 (traced task)\n  -----                        \
  \  -------------------\n                                 hit uprobe, prepare_uretprobe():\n\
  \                                   hprobe LEASED, refcount >= 1\n  uprobe_unregister()\n\
  \    put_uprobe(): refcount -> 0\n                                 fork() -> dup_utask()\n\
  \                        "
