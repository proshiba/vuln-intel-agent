title: "A vulnerability in the Remote Access SSL VPN functionality of Cisco Secure
  Firewall Adaptive Security Appliance (ASA) Software and Secure Firewall Threat Defense
  (FTD) Software could allow an unauthenticated, remote attacker to exhaust device
  memory resulting in a denial of service (DoS) condition to new Remote Access SSL
  VPN connections. This does not affect the management interface, though it may become
  temporarily unresponsive. \r\n\r This vulnerability is due to trusting user input
  without validation. An attacker could exploit this vulnerability by sending crafted
  packets to the Remote Access SSL VPN server. A successful exploit could allow the
  attacker to cause the device web interface to stop responding, resulting in a DoS
  condition."
