title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc4-pcm: Continue the pipeline trigger in case of IPC timeout\n\nIgnore IPC
  errors for pipeline state change if the firmware state is\ncrashed or the IPC has
  timed out.\n\nIf the firmware has crashed the kernel still needs to go through the
  state\nchanges to reset its internal to be able to correctly work the next time\n\
  the DSP is booted up.\n\nThe case with IPC timeout is a bit more problematic, but
  it has been\nrootcaused to be the result of system scheduling blockage and the firmware\n\
  did actually received and handled the message, but the reply handling got\nblocked
  by issues outside of the SOF stack.\nSo far the best way to handle this is to continue
  with setting the state."
