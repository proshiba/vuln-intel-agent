title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  bitland-mifs-wmi: Fix NULL pointer dereference during suspend/resume\n\nThe driver
  registers two distinct WMI devices: a control device\n(BITLAND_WMI_CONTROL) and
  an event device (BITLAND_WMI_EVENT). During\nthe probe phase, the event device handling
  path returns early before\ninitializing the platform profile device (data->pp_dev),
  leaving it\nNULL.\n\nHowever, the PM sleep operations are registered globally for
  the WMI\ndriver and are triggered for both devices. When entering suspend, the\n\
  event device invokes bitland_mifs_wmi_suspend(), which passes the\nuninitialized
  data->pp_dev (NULL) into laptop_profile_get(). This leads\nto a NULL pointer dereference
  inside dev_get_drvdata(), causing a\nkernel Oops and halting the suspend sequence.\n\
  \nFix this by adding a validity check for data->pp_dev in both the suspend\nand
  resume callbacks, safely skipping profile operations for the event\ndevice."
