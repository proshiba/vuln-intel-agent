title: Stomper 5e2741e is vulnerable to Denial of Service. When a broker sends 
  data to a client whose TCP connection was already closed by the peer, the 
  server process receives SIGPIPE and immediately terminates, resulting in a 
  denial of service. Any unauthenticated client can trigger the crash by closing
  the socket at specific points.
