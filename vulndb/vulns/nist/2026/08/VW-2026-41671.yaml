title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, settings.readTraefikFile in 
  apps/dokploy/server/api/routers/settings.ts passes a path accepted by 
  apiReadTraefikConfig to readConfigInPath in 
  packages/server/src/utils/traefik/application.ts, where configPath is 
  interpolated into execAsyncRemote as cat ${configPath}, allowing a user with 
  traefikFiles.read permission to execute arbitrary commands on a managed server
  through shell metacharacters. This issue is fixed in version 0.29.13.
