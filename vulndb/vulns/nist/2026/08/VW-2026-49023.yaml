title: Netis NC63 firmware through V3.0.0.3327 contains a stack-based buffer 
  overflow vulnerability that allows unauthenticated remote attackers to 
  overwrite saved stack state by supplying an oversized destHost parameter to 
  the ipFilterList=mod action in netis.cgi. Attackers can exploit widthless 
  sscanf conversions that copy user-supplied input into fixed-size stack buffers
  before authentication is verified, achieving remote code execution as root due
  to the Boa web server executing the CGI environment with root privileges.
