title: "Rocq Prover does not restore the universe graph's copy of the universe checking
  flag when a module that locally disabled the check is closed. Local Unset Universe
  Checking inside a module is expected to last only until the module ends, and the
  global flag is restored, but the universe graph keeps its own copy which is left
  disabled. The two views then disagree: Test Universe Checking reports the check
  as enabled while the kernel continues to accept universe-inconsistent terms. With
  the constraint between two universes no longer enforced, Hurkens' paradox applies
  and yields a proof of False, from which any proposition follows. The proof uses
  no axioms, plugins or unsafe features once the module has closed, and Print Assumptions
  reports it as closed under the global context, so neither the assumption audit nor
  the flag query reflects the actual kernel state. No fix is available."
