title: "The HL7800 cellular modem driver's +CGCONTRDP: response handler on_cmd_atcmdinfo_ipaddr()
  in drivers/modem/vendor_standalone/hl7800.c parses the PDP-context dynamic parameters
  (local address, subnet mask, gateway, and DNS servers) that the cellular network
  assigns to the device. The response is linearized into a 256-byte stack buffer,
  after which each address field length is computed from comma/. delimiter positions
  in the network-supplied data and used directly as the length argument to strncpy()
  into the fixed 64-byte stack buffer temp_addr_str (and the 16-byte iface_ctx.dns_v4_string).\n\
  \nBecause the field length is derived from attacker-controlled delimiter positions
  and was not bounded against the destination buffer, a single field can be far larger
  than 64 bytes. A malicious or impersonated cellular network (for example a rogue
  base station) can return a crafted +CGCONTRDP response with an overlong address
