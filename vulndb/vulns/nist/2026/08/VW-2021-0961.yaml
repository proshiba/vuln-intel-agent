title: In the kernel in Insyde InsydeH2O 5.x, certain SMM drivers did not 
  correctly validate the CommBuffer and CommBufferSize parameters, allowing 
  callers to corrupt either the firmware or the OS memory. The fixed versions 
  for this issue in the AhciBusDxe, IdeBusDxe, NvmExpressDxe, SdHostDriverDxe, 
  and SdMmcDeviceDxe drivers are 05.16.25, 05.26.25, 05.35.25, 05.43.25, and 
  05.51.25 (for Kernel 5.1 through 5.5).
