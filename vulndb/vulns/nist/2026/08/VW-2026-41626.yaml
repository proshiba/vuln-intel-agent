title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the unauthenticated /api/providers/github/setup route in 
  apps/dokploy/pages/api/providers/github/setup.ts trusts gh_init organizationId
  and userId values from the state parameter and calls createGithub in 
  packages/server/src/services/github.ts, allowing an attacker to insert a 
  GitHub App provider containing client_secret, webhook_secret, and PEM private 
  key material into another organization. This issue is fixed in version 
  0.29.13.
