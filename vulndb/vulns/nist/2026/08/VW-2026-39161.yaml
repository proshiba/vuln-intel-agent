title: Shlink contains a blind SQL injection vulnerability that allows any 
  authenticated API key holder to inject arbitrary SQL fragments by supplying an
  unvalidated direction value in the orderBy query parameter of the tag 
  statistics endpoint. Attackers can craft a malicious direction string 
  containing SQL subqueries that flows unsanitized into a Doctrine QueryBuilder 
  ORDER BY clause, enabling time-based, boolean-oracle, and error-based 
  extraction of sensitive data including long URLs, visitor records, IP 
  addresses, geolocation data, user agents, and hashed API key secrets from any 
  tenant.
