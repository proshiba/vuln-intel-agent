title: A vulnerability has been found in aktsmm skill-ninja-mcp-server 0.1.0. 
  Impacted is the function 
  getInstalledSkills/installSkill/updateAgentsMd/uninstallSkill of the file 
  src/installer.ts. The manipulation of the argument workspacePath leads to path
  traversal. The attack needs to be performed locally. Upgrading to version 
  0.1.1 is recommended to address this issue. The identifier of the patch is 
  855b46739e0f6e8388f17f9d0066ac4298a3965d. Upgrading the affected component is 
  recommended.
