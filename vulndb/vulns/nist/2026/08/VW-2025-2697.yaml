title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmt76:
  fix tx status related use-after-free race on station removal\n\nThere is a small
  race window where ongoing tx activity can lead to a skb\ngetting added to the status
  tracking idr after that idr has already been\ncleaned up, which will keep the wcid
  linked in the status poll list.\nFix this by only adding status skbs if the wcid
  pointer is still assigned\nin dev->wcid, which gets cleared early by mt76_sta_pre_rcu_remove"
