title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  Prevent NULL pointer dereference in machine_kexec_prepare()\n\nA NULL pointer dereference
  issue is noticed in riscv's\nmachine_kexec_prepare(), where image->segment[i].buf
  might be NULL and\ncopied unchecked.\n\nThe NULL buf comes from ima_add_kexec_buffer(),
  where kbuf is added by\nkexec_add_buffer(), but kbuf.buffer is NULL, then it is
  copied without\na check in machine_kexec_prepare():\n\n  kexec_file_load\n    ->
  kimage_file_alloc_init()\n       -> kimage_file_prepare_segments()\n          ->
  ima_add_kexec_buffer()\n             -> kexec_add_buffer()\n    -> machine_kexec_prepare()\n\
  \       -> memcpy()\n\nAddress this by adding a check before the data copy attempt."
