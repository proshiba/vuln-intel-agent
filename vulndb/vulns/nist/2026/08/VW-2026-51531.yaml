title: Budibase versions before 3.41.3 contain a remote code execution 
  vulnerability in plugin handling that allows authenticated admin users to 
  execute arbitrary code by uploading a malicious plugin tarball. The server 
  calls eval() on plugin JavaScript files without sandboxing in the main Node.js
  process, enabling attackers to exfiltrate environment variables and 
  credentials with root privileges in default deployments.
