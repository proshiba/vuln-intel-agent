title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to 1.0.8.4, Vvveb backend product 
  question operations allow a low-privileged Vendor to manage questions under 
  another Vendor's products. The admin/sql/sqlite/product_question.sql queries 
  accept a caller-controlled product_question_id and do not verify 
  product_question.product_id against product.admin_id for the current admin_id.
  An attacker can read pending question content and moderation data, change 
  question status, edit question content, or delete questions, manipulating 
  product Q&A visibility and integrity. This issue is fixed in version 1.0.8.4.
