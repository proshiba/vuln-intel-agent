title: rsync before 3.5.0 contains a path confinement bypass vulnerability that 
  allows remote clients to escape the intended inner-module root confinement by 
  constructing paths that resolve outside the chroot boundary when the module 
  root contains a /./ boundary marker. Attackers can exploit improper handling 
  of the /./ notation or forge delta-basis transfers referencing xname paths 
  that cross the /./ boundary to gain unauthorized read or write access to files
  outside the module's subtree.
