title: Admidio before 5.0.12 contains a blind SQL injection vulnerability in the
  relation_type_list parameter of lists_show.php that allows unauthenticated 
  attackers to execute arbitrary SQL queries. Attackers can bypass 
  authentication by providing a dummy UUID in role_list and inject SQL through 
  relation_type_list to extract database contents including password hashes and 
  user credentials.
