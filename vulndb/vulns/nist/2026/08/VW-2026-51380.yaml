title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmfd:
  cs42l43: Sanity check firmware size\n\nCurrently the code checks if a firmware was
  received, however it does\nnot verify that the firmware size is larger than the
  firmware header. As\nthe firmware pointer is dereferenced as a pointer to the header\n\
  structure this could lead to an out of bounds memory access. Add the\nmissing check."
