title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  fix queue index used to wake the peer txq in veth_poll\n\nveth_poll() derives the
  index of the peer TX queue to wake from\nrq->xdp_rxq.queue_index. That field is
  only initialized by\nxdp_rxq_info_reg() in veth_enable_xdp_range(), which runs only
  when an\nXDP program is attached. On the plain GRO/NAPI path\n(veth_napi_enable_range())
  xdp_rxq_info_reg() is never called, so\nqueue_index stays 0 for every queue, as
  priv->rq is zero-allocated.\n\nSo in a multi-queue setup with GRO enabled and no
  XDP program attached,\nevery NAPI instance looks at the peer's TX queue 0. If veth_xmit()
  stops\npeer TX queue 1 because the ptr_ring is full (NETDEV_TX_BUSY), nothing\n\
  ever wakes it again: the poller draining queue 1 wakes queue 0 instead.\nveth implements
  no ndo_tx_timeout, so the netdev watchdog does not kick\nin either, and the queue
  stays stopped indefinitely.\n\nDerive the index from the position of the rq within
  priv->rq instead,\nwhic"
