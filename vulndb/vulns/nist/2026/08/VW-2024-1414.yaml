title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuio:
  Fix use-after-free in uio_open\n\ncore-1\t\t\t\tcore-2\n-------------------------------------------------------\n\
  uio_unregister_device\t\tuio_open\n\t\t\t\tidev = idr_find()\ndevice_unregister(&idev->dev)\n\
  put_device(&idev->dev)\nuio_device_release\n\t\t\t\tget_device(&idev->dev)\nkfree(idev)\n\
  uio_free_minor(minor)\n\t\t\t\tuio_release\n\t\t\t\tput_device(&idev->dev)\n\t\t\
  \t\tkfree(idev)\n-------------------------------------------------------\n\nIn the
  core-1 uio_unregister_device(), the device_unregister will kfree\nidev when the
  idev->dev kobject ref is 1. But after core-1\ndevice_unregister, put_device and
  before doing kfree, the core-2 may\nget_device. Then:\n1. After core-1 kfree idev,
  the core-2 will do use-after-free for idev.\n2. When core-2 do uio_release and put_device,
  the idev will be double\n   freed.\n\nTo address this issue, we can get idev atomic
  & inc idev reference with\nminor_lock."
