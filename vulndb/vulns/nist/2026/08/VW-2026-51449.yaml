title: "In the Linux kernel, the following vulnerability has been resolved:\n\nidpf:
  bound interrupt-vector register fill to the allocated array\n\nidpf_get_reg_intr_vecs()
  fills the caller-allocated reg_vals[] array from\nthe VIRTCHNL2_OP_ALLOC_VECTORS
  reply in adapter->req_vec_chunks, bounding\nits inner loop only by the per-chunk
  num_vectors. The array is sized\nseparately: idpf_intr_reg_init() allocates\nkzalloc_objs(struct
  idpf_vec_regs, total_vecs) from\ncaps.num_allocated_vectors and only checks the
  returned count after the\nfill. The sum of per-chunk num_vectors is never reconciled
  against\ntotal_vecs, so a reply with a small num_allocated_vectors but chunks\n\
  summing higher writes past the end of reg_vals[].\n\nImpact: a control plane (a
  PF or hypervisor device model) that returns a\nVIRTCHNL2_OP_ALLOC_VECTORS reply
  whose per-chunk num_vectors sum exceeds\nnum_allocated_vectors writes struct idpf_vec_regs
  entries past the end of\nthe reg_vals kmalloc allocation (KASAN slab-out-of-bounds
  write).\n\nBound "
