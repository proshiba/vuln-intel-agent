title: "SQL injection in the Zalktis accounting application via\ntrading-partner-controlled
  text fields in received electronic invoices. When\nimporting a received e-invoice
  (UBL/PEPPOL) or an e-commerce export, Zalktis\nconcatenates partner-controlled values
  directly into SQL statement text using\nstring concatenation, with neither parameterised
  queries nor escaping. The\napplication's own escaping helper, Dazadi.sql_txt(),\n\
  is not invoked on these code paths, so a party that sends an invoice can break\n\
  out of the string literal and alter the query logic.\n\n\n\n\n\n\n\n\n\nThis issue
  affects Zalktis: before 2026.1.586 and before 2026.2.592."
