title: Flowise versions before 3.1.3 contain an insecure direct object reference
  vulnerability in the GET /api/v1/organization/customer-default-source endpoint
  that allows authenticated attackers to access other customers' payment and 
  profile data by manipulating the customerId parameter. Attackers can enumerate
  predictable customer IDs to retrieve sensitive information including email 
  addresses, account balances, currency types, and billing configurations 
  without authorization checks.
