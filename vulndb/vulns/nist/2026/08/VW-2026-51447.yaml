title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: iblock: Fix wrong PR ops NULL check for PREEMPT/RELEASE\n\nIn the iblock_execute_pr_out()
  function, PRO_PREEMPT,\nPRO_PREEMPT_AND_ABORT, and PRO_RELEASE all perform callback
  capability\nchecks through ops->pr_clear. The error check allows unimplemented hooks\n\
  to pass through the gate, resulting dereferencing a NULL function\npointer.\n\n\
  Check whether the hooks that need to be called are supported."
