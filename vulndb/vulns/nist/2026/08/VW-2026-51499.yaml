title: An attacker that has valid credentials can use a Sieve script with the 
  editheader extension to trigger a use-after-free in the mail editing code, and
  to write memory contents beyond the intended buffer into the delivered mail. 
  This causes memory leak and opportunity to do memory corruption during mail 
  delivery, which can crash the delivery process and may allow execution of 
  arbitrary code in the context of that process. Disable the Sieve editheader 
  extension. Update to non-vulnerable version. No publicly available exploits 
  are known.
