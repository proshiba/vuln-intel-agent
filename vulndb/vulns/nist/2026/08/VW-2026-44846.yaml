title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix the reception of a reply packet before data transmission\n\nFix rxrpc_receiving_reply()
  to handle the reception of an apparent reply\nDATA packet before rxrpc has had a
  chance to send any request DATA packets\non a client call by checking to see if
  the call has been exposed yet by\nsending the first packet.\n\nWithout this, rxrpc_rotate_tx_window()
  might oops.\n\nAlso fix rxrpc_rotate_tx_window() to handle the Tx queue being empty
  by\nchanging the do...while loop into a while loop, just in case a call is\nabnormally
  terminated by an early reply before the last request packet is\ntransmitted."
