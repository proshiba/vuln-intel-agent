title: A vulnerability was found in cosmicstack-labs mercury-agent up to 1.1.12.
  This issue affects the function Agent.handleBgCommand of the file 
  src/core/agent.ts of the component bg Command Handler. Performing a 
  manipulation results in incorrect authorization. It is possible to initiate 
  the attack remotely. The exploit has been made public and could be used. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
