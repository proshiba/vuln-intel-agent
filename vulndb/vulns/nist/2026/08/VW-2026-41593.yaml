title: Discourse is an open-source discussion platform. Prior to 2026.1.6, 
  2026.5.2, 2026.6.1, and 2026.7.0, the discourse_templates endpoint exposed 
  hidden tag names because DiscourseTemplates::TemplatesSerializer in 
  plugins/discourse-templates/app/serializers/discourse_templates/templates_serializer.rb
  did not filter tags through the request Guardian. The serializer did not 
  respect tag group permissions, allowing users to see tags they were not 
  permitted to view. This issue is fixed in versions 2026.1.6, 2026.5.2, 
  2026.6.1, and 2026.7.0.
