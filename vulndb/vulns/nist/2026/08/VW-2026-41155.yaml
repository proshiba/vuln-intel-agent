title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  wacom: stop hardware after post-start probe failures\n\nwacom_parse_and_register()
  starts HID hardware before registering inputs\nand initializing pad LEDs/remotes.
  Those later steps can fail, but their\nerror paths currently release Wacom resources
  without stopping the HID\nhardware.\n\nRoute post-hid_hw_start() failures through
  hid_hw_stop() before\nreleasing driver resources.\n\nThis issue was identified during
  our ongoing static-analysis research while\nreviewing kernel code."
