title: "A buffer\noverflow vulnerability exists in the embedded HTTP service in TL-WR841N
  v14 when processing\nmultipart/form-data requests. Insufficient validation of an
  attacker-controlled\nboundary parameter may allow a remote unauthenticated attacker
  to submit a\ncrafted request that corrupts memory by overwriting data beyond the
  bounds of\nan internal buffer.\n\n\n\n\n\n\n\n\n\nSuccessful\nexploitation may result
  in modification or corruption of process memory,\npotentially leading to undefined
  application behavior. Arbitrary code\nexecution, information disclosure, and denial-of-service
  conditions have not\nbeen demonstrated."
