title: "Pandora contains a path traversal vulnerability in its TAR archive extraction
  functionality. When processing a submitted TAR archive, the extractor passed archive
  member names directly to Python's tarfile.TarFile.extract() without applying an
  extraction filter.\n\n\nAn attacker able to submit a specially crafted TAR archive
  containing malicious member paths, such as paths using ../ sequences or absolute
  paths, could cause extracted files to be written outside the intended extraction
  directory. This may allow the attacker to overwrite files accessible to the Pandora
  worker process and could potentially result in application compromise, arbitrary
  code execution, or denial of service depending on the files targeted and the privileges
  of the Pandora process.\n\n\nThe vulnerability is corrected by using Python's filter='data'
  extraction filter, which rejects or sanitizes dangerous TAR members, including paths
  that escape the destination directory and unsafe link targets. \n\n\nThe weakness
