title: The Formidable Forms – WordPress Form Builder for Contact Forms, 
  Calculators, Quizzes & More plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 'frm_user_id' parameter in all versions up to, 
  and including, 6.33.1 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. By forging frm_user_id to match an administrator's user ID — 
  discoverable via the public WordPress REST API — an unauthenticated attacker 
  causes wp_kses_post() to serve as the only output filter, which preserves the 
  injected payload structurally intact; the plugin's admin JavaScript then 
  decodes and executes it automatically on page load.
