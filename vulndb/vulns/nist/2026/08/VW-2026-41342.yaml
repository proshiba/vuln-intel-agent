title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/nouveau:
  fix reversed error cleanup order in ucopy functions\n\nnouveau_uvmm_vm_bind_ucopy()
  and nouveau_exec_ucopy() place their error\ncleanup labels in allocation order rather
  than reverse allocation order.\nOn a u_memcpya() failure for in_sync.s, the goto
  to err_free_ops (or\nerr_free_pushs) frees the first allocation and then falls through
  to\nerr_free_ins, which calls u_free() on args->in_sync.s.\n\nSince args->in_sync.s
  still holds the ERR_PTR returned by the failed\nu_memcpya(), and ERR_PTR values
  are not caught by ZERO_OR_NULL_PTR(),\nkvfree() proceeds to dereference it, which
  can result in a kernel oops.\nA failure for out_sync.s instead jumps to err_free_ins
  and skips freeing\nthe first allocation, leading to a memory leak.\n\nFix by swapping
  the cleanup label order so resources are freed in the\ncorrect reverse allocation
  sequence."
