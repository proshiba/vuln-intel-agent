title: A vulnerability in the application policy configuration of the Cisco 
  Firepower Threat Defense (FTD) Software could allow an unauthenticated, remote
  attacker to gain unauthorized read access to sensitive data. The vulnerability
  is due to insufficient application identification. An attacker could exploit 
  this vulnerability by sending crafted traffic to an affected device. A 
  successful exploit could allow the attacker to gain unauthorized read access 
  to sensitive data.
