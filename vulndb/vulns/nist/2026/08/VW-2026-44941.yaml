title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  HIDP: reject frames without a transaction header\n\nhidp_recv_ctrl_frame() and hidp_recv_intr_frame()
  read skb->data[0]\nbefore checking that the L2CAP SDU contains a transaction header.
  A\nconnected HIDP peer can send an empty basic-mode SDU and make both paths\nuse
  an uninitialized byte from skb tailroom.\n\nKMSAN reports the use in hidp_session_run(),
  with the uninitialized value\noriginating in __alloc_skb() through vhci_write().
  The control path\nproduces two reports and the interrupt path produces one.\n\n\
  The byte can also be controlled by a malformed lower-layer packet. If an\nHCI ACL
  packet contains an L2CAP PDU with a declared zero-length payload\nfollowed by an
  extra 0x15 byte, l2cap_recv_acldata() reduces skb->len to\nthe declared PDU length
  before dispatch. The current HIDP path nevertheless\nconsumes the extra byte as
  HIDP_TRANS_HID_CONTROL |\nHIDP_CTRL_VIRTUAL_CABLE_UNPLUG and terminates the HIDP
  session. Wit"
