title: "GNU Emacs for Android is vulnerable to an integer overflow in the sfnt_read_cmap_format_12()
  function in src/sfnt.c. When processing a crafted TrueType font file, an unguarded
  addition in the xmalloc allocation call wraps around on 32-bit builds, causing a
  heap buffer overflow write. An attacker can deliver a malicious font file via email,
  EWW (Emacs Web Wowser), or documents with custom faces, causing Emacs to load it.
  This results in heap memory corruption that can lead to code execution.\n\n\nThis
  issue was fixed in commit c4e20777c26548722a37b03db93243e83a0d6188"
