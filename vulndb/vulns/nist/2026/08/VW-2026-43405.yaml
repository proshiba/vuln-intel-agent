title: Budibase Server before 3.40.0 contains a NoSQL injection vulnerability in
  the MongoDB query execution endpoint where user-supplied parameters are 
  interpolated into JSON query templates without proper sanitization of JSON 
  metacharacters. Attackers with query write permission can inject JSON 
  structural characters to alter MongoDB queries, bypassing filters to read, 
  modify, or delete arbitrary documents.
