title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/percpu-km:
  fix bitmap overflow and accounting in pcpu_create_chunk()\n\nIn pcpu_create_chunk(),
  nr_pages is the total contiguous backing\nallocation, i.e., nr_units * pcpu_unit_pages,
  but pcpu_chunk_populated()\nuses it to set chunk->populated, whose size is pcpu_unit_pages,
  bitmap. \nSince bit N in chunk->populated means page offset N inside every unit
  is\nbacked.  When nr_units > 1, the function writes beyond chunk->populated. \n\
  Fix it by using chunk->nr_pages.\n\nIt also fixes the global pcpu_nr_empty_pop_pages
  accounting, since\npcpu_balance_free() only iterates up to chunk->nr_pages.\n\n\
  Commit a63d4ac4ab609 (\"percpu: make percpu-km set chunk->populated bitmap\nproperly\"\
  ) introduced the bitmap overflow issue.  Later, commit\nb539b87fed37f (\"percpu:
  implmeent pcpu_nr_empty_pop_pages and\nchunk->nr_populated\") added pcpu_nr_empty_pop_pages
  and caused the\naccounting issue."
