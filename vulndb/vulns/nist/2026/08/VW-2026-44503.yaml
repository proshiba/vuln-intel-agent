title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: fix malformed ISO_END/CONT handling\n\nCore specification (Part C vol 4 sec
  5.4.5) does not exclude empty\nISO_CONT, ISO_END packets.  We currently reject them
  if they are last.\n\nIf controller sends malformed sequence\n\n    ISO_START ->
  rx_len = 4, ISO_CONT skb->len 4, ISO_START\n\nthat ends payload in ISO_CONT, we
  leak conn->rx_skb. If controller sends\ntoo long ISO_END, we panic on skb_put. If
  controller sends too short\nISO_END we accept it.\n\nFix by marking unfinished ISO_START
  via conn->rx_skb != NULL.  Check\nskb->len properly before skb_put.  Combine the
  ISO_CONT/END code paths\nas they require the same initial checks. Reject too short
  ISO_END\npackets."
