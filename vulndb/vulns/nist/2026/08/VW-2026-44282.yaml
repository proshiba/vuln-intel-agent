title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: add missing device refcount for CAN filter removal\n\nsashiko-bot remarked
  a problem with a concurrent device unregistration\nin isotp.c which also is present
  in the bcm.c code. A former fix for raw.c\ncommit c275a176e4b6 (\"can: raw: add
  missing refcount for memory leak fix\")\nintroduced a netdevice_tracker which solves
  the issue for bcm.c too.\n\nbcm_release(), bcm_delete_rx_op() and bcm_notifier()
  relied on\ndev_get_by_index(ifindex) to re-find the device for an rx_op before\n\
  unregistering its filter. If a concurrent NETDEV_UNREGISTER has already\nunlisted
  the device from the ifindex table, that lookup fails and\ncan_rx_unregister() is
  silently skipped, leaving a stale CAN filter\npointing at the soon-to-be-freed bcm_op/socket.\n\
  \nHold a netdev_hold()/netdev_put() tracked reference on op->rx_reg_dev\nfrom the
  moment the rx filter is registered in bcm_rx_setup() until it\nis unregistered in
  bcm_rx_unreg(), and use that ref"
