title: "XML::Sig versions before 0.71 for Perl allow XPath injection in ID lookup.\n\
  \nverify() and _get_signed_xml() in lib/XML/Sig.pm build XPath expressions by concatenating
  the SignedInfo/Reference/@URI value read from the document being verified. The value
  is neither escaped nor checked against the NCName grammar that XML requires of an
  ID, so a URI containing a single quote closes the string literal in the generated
  expression and appends arbitrary XPath operators.\n\nA crafted URI can make the
  lookup match elements the reference does not name, or every element in the document,
  so which node is selected for digest verification is decided by the injected expression
  rather than by the reference."
