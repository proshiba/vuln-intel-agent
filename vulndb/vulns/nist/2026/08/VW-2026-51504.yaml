title: A host listed as a trusted proxy can send forwarding information 
  containing a NUL byte, which crashes the login process on the following login 
  attempt. The login process is terminated, which can cause degradation or 
  denial of service for logins. Deployments that do not configure trusted 
  proxies are not affected. Restrict the list of trusted proxy networks to hosts
  that are fully under your control. Update to non-vulnerable version. No 
  publicly available exploits are known.
