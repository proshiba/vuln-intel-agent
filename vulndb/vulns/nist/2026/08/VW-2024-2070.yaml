title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkdb:
  Fix buffer overflow during tab-complete\n\nCurrently, when the user attempts symbol
  completion with the Tab key, kdb\nwill use strncpy() to insert the completed symbol
  into the command buffer.\nUnfortunately it passes the size of the source buffer
  rather than the\ndestination to strncpy() with predictably horrible results. Most
  obviously\nif the command buffer is already full but cp, the cursor position, is
  in\nthe middle of the buffer, then we will write past the end of the supplied\n\
  buffer.\n\nFix this by replacing the dubious strncpy() calls with memmove()/memcpy()\n\
  calls plus explicit boundary checks to make sure we have enough space\nbefore we
  start moving characters around."
