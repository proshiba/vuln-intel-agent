title: '@oblique/cli 15.4.0 contains an OS command injection vulnerability in the
  project creation functionality. The CLI constructs shell commands through string
  concatenation and executes them with execSync(). A user-controlled project-name
  argument is inserted into the shell command without proper neutralization, allowing
  shell metacharacters to execute additional operating-system commands when the CLI
  is invoked with a crafted project name.'
