title: "Unused authorization codes issued to deleted users are not being properly
  invalidated or removed from the system. This allows for the persistence of these
  codes, enabling them to be potentially reused.\n\nIf an attacker possesses both
  the authorization code and the associated client credentials (client ID and client
  secret), they can leverage these unused codes to obtain access tokens on behalf
  of users who have already been deleted. This may lead to unauthorized access to
  sensitive resources and services, contingent on the scopes originally authorized
  for the compromised authorization code."
