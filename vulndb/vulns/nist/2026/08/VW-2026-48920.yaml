title: Hugo's default fenced-code-block renderer writes attribute values taken 
  from the code-fence info string into the rendered HTML without escaping them. 
  New in markup/internal/attributes/attributes.go converts every attribute value
  from a byte slice to a string as it is stored, deliberately dropping the 
  escaping that used to happen there, and RenderAttributes in the same file 
  escapes only values that are still byte slices, so its escaping branch is 
  never reached and every value is written verbatim. The function's 
  documentation states that it performs HTML escaping of string attributes, 
  which it does not. A quote inside an attribute value in the info string 
  therefore terminates the attribute and allows a further attribute, including 
  an event handler, to be placed on the wrapper element, and the script runs for
  every visitor who loads the page. This path is reached under the default 
  configuration, with code fences enabled and without goldmark's unsafe setting 
  or any custom render hook. Attr
