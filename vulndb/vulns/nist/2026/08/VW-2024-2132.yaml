title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/packet:
  fix slab-out-of-bounds access in packet_recvmsg()\n\nsyzbot found that when an AF_PACKET
  socket is using PACKET_COPY_THRESH\nand mmap operations, tpacket_rcv() is queueing
  skbs with\ngarbage in skb->cb[], triggering a too big copy [1]\n\nPresumably, users
  of af_packet using mmap() already gets correct\nmetadata from the mapped buffer,
  we can simply make sure\nto clear 12 bytes that might be copied to user space later.\n\
  \nBUG: KASAN: stack-out-of-bounds in memcpy include/linux/fortify-string.h:225 [inline]\n\
  BUG: KASAN: stack-out-of-bounds in packet_recvmsg+0x56c/0x1150 net/packet/af_packet.c:3489\n\
  Write of size 165 at addr ffffc9000385fb78 by task syz-executor233/3631\n\nCPU:
  0 PID: 3631 Comm: syz-executor233 Not tainted 5.17.0-rc7-syzkaller-02396-g0b3660695e80
  #0\nHardware name: Google Google Compute Engine/Google Compute Engine, BIOS Google
  01/01/2011\nCall Trace:\n <TASK>\n __dump_stack lib/dump_stack.c:88 [inline]\n dump_"
