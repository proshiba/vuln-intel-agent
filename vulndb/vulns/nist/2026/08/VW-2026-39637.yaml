title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngtp:
  check skb_pull_data() return in gtp1u_send_echo_resp()\n\ngtp1u_send_echo_resp()
  ignores skb_pull_data()'s return value. Its\ncaller gtp1u_udp_encap_recv() only
  guarantees 16 bytes (udphdr +\ngtp1_header), but the pull requests 20 (gtp1_header_long
  + udphdr). For\na 16-19 byte echo request the pull fails and returns NULL without\n\
  advancing skb->data; execution continues, and the following skb_push()\nplus the
  IP header pushed by iptunnel_xmit() move skb->data below\nskb->head, tripping skb_under_panic().\n\
  \nFix it by dropping the packet when skb_pull_data() fails.\n\n  skbuff: skb_under_panic:
  ...\n  kernel BUG at net/core/skbuff.c:214!\n  Call Trace:\n   skb_push (net/core/skbuff.c:2648)\n\
  \   iptunnel_xmit (net/ipv4/ip_tunnel_core.c:82)\n   gtp_encap_recv (drivers/net/gtp.c:701
  drivers/net/gtp.c:808 drivers/net/gtp.c:920)\n   udp_queue_rcv_one_skb (net/ipv4/udp.c:2388)\n\
  \   ...\n  Kernel panic - not syncing: Fatal exception in interr"
