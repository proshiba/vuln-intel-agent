title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/iommu:
  Fix notifiers being shared by PCI and VIO buses\n\nfail_iommu_setup() registers
  the fail_iommu_bus_notifier struct to both\nPCI and VIO buses.  struct notifier_block
  is a linked list node, so this\ncauses any notifiers later registered to either
  bus type to also be\nregistered to the other since they share the same node.\n\n\
  This causes issues in (at least) the vgaarb code, which registers a\nnotifier for
  PCI buses.  pci_notify() ends up being called on a vio\ndevice, converted with to_pci_dev()
  even though it's not a PCI device,\nand finally makes a bad access in vga_arbiter_add_pci_device()
  as\ndiscovered with KASAN:\n\n BUG: KASAN: slab-out-of-bounds in vga_arbiter_add_pci_device+0x60/0xe00\n\
  \ Read of size 4 at addr c000000264c26fdc by task swapper/0/1\n\n Call Trace:\n\
  \   dump_stack_lvl+0x1bc/0x2b8 (unreliable)\n   print_report+0x3f4/0xc60\n   kasan_report+0x244/0x698\n\
  \   __asan_load4+0xe8/0x250\n   vga_arbiter_add_pci_dev"
