title: GitPython before 3.1.58 contains a command execution vulnerability in the
  check_unsafe_options guard that can be bypassed by combining a 
  single-character kwarg with split_single_char_options=False. Attackers can 
  supply a crafted kwargs dictionary to guarded methods like clone_from to emit 
  a joined token parsed as --upload-pack, enabling arbitrary OS command 
  execution at default allow_unsafe_options=False.
