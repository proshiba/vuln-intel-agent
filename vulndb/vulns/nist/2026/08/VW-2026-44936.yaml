title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  timer: Clear SNDRV_TIMER_IFLG_DEAD once the close completes\n\nsnd_timer_close_locked()
  marks an instance with SNDRV_TIMER_IFLG_DEAD\nand returns early when the flag is
  already set, but the flag is never\ncleared again.  A completed close ends in remove_slave_links(),
  which\nleaves timeri->timer NULL, so a second close is already harmless through\n\
  the timer == NULL path; the early return can only be reached by an\ninstance that
  was opened again in between.  For such an instance the\nclose unlinks nothing, so
  snd_timer_instance_free() frees an object that\nis still on timer->open_list_head,
  still on snd_timer_master_list if it\nwas opened with a slave key, still owns any
  adopted slaves, and still\nholds its timer and module references.\n\nsnd_seq_timer_open()
  reopens an instance exactly like that: it retries\nits fallback open on the same
  object after a failure that has already\nrun snd_timer_close_locked() internally.\
  \  An unpr"
