  the component Password Reset. Executing a manipulation can lead to cross-site 
  request forgery. It is possible to launch the attack remotely. This patch is 
  called 3c6ce4b7f3eeafeb35318c6c4e82b1a3fd28b314. It is advisable to implement 
  a patch to correct this issue.
