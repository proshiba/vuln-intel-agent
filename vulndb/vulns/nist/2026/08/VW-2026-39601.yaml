title: "The JoomSport – for Sports: Team & League, Football, Hockey & more plugin
  for WordPress is vulnerable to time-based SQL Injection via the 'order' parameter
  in all versions up to, and including, 5.7.9 due to insufficient escaping on the
  user supplied parameter and lack of sufficient preparation on the existing SQL query.
  This makes it possible for authenticated attackers, with administrator-level access
  and above, to append additional SQL queries into already existing queries that can
  be used to extract sensitive information from the database. The affected admin page
  lacks nonce or CSRF protection on the GET request, meaning an unauthenticated attacker
  could exploit this vulnerability by tricking an authenticated administrator into
  issuing a crafted request. Additionally, the vulnerability is only triggered when
  the 'orderby' parameter is also present and non-empty alongside the 'order' parameter."
