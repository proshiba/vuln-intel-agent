title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix WARN_ON for resident attribute in ntfs_map_runlist_nolock()\n\nWhen ntfs_map_runlist_nolock()
  needs to look up the attribute extent\ncontaining a target VCN (ctx_needs_reset
  == true), it calls\nntfs_attr_lookup() and then expects the result to be a non-resident\n\
  attribute, since only non-resident attributes have a mapping pairs\narray to decompress.\n\
  \nA crafted NTFS image can place a resident attribute where a non-resident\none
  is expected, causing ntfs_attr_lookup() to succeed but return a\nresident attribute
  record.  Previously this was caught only by a\nWARN_ON(), which does not stop execution.\
  \  The code then falls through to\nread a->data.non_resident.highest_vcn from what
  is actually a resident\nattribute, accessing the wrong union member and corrupting
  the VCN range\ncheck.\n\nThe caller path triggering this warning during mount is:\n\
  \n  ntfs_map_runlist_nolock\n  ntfs_empty_logfile\n  load_system_files\n  ntfs_fill_super"
