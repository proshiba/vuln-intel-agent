title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix double free during GPU reset on DC streams\n\n[Why]\nThe issue only occurs during
  the GPU reset code path.\n\nWe first backup the current state prior to commiting
  0 streams\ninternally from DM to DC. This state backup contains valid link\nencoder
  assignments.\n\nDC will clear the link encoder assignments as part of current state\n\
  (but not the backup, since it was a copied before the commit) and\nfree the extra
  stream reference it held.\n\nDC requires that the link encoder assignments remain
  cleared/invalid\nprior to commiting. Since the backup still has valid assignments
  we\ncall the interface post reset to clear them. This routine also\nreleases the
  extra reference that the link encoder interface held -\nresulting in a double free
  (and eventually a NULL pointer dereference).\n\n[How]\nWe'll have to do a full DC
  commit anyway after GPU reset because\nthe stream count previously went to 0.\n\n\
