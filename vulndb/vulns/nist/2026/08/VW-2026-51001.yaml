title: "Dool in versions up to 1.3.8 is vulnerable to a CSV injection vulnerability
  when exporting data to a CSV file, as it fails to sanitize cell content beginning
  with special formula characters like =, +, -, or @. A local attacker can exploit
  this by running a process with a crafted name starting with =, which injects malicious
  formulas into the CSV output that execute when a victim opens the file in a spreadsheet
  application. \nThe issue was addressed by pull request #117"
