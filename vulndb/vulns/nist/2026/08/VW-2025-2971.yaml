title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_conn: fail SCO/ISO via hci_conn_failed if ACL gone early\n\nNot calling hci_(dis)connect_cfm
  before deleting conn referred to by a\nsocket generally results to use-after-free.\n\
  \nWhen cleaning up SCO connections when the parent ACL is deleted too\nearly, use
  hci_conn_failed to do the connection cleanup properly.\n\nWe also need to clean
  up ISO connections in a similar situation when\nconnecting has started but LE Create
  CIS is not yet sent, so do it too\nhere."
