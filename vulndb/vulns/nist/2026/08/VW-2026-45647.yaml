title: Grav before 2.0.15 contains a stored cross-site scripting vulnerability 
  in the detectXss() function where unpaired quotes in unquoted attribute values
  bypass event-handler detection. Authenticated editors can inject event 
  handlers like onerror= that pass validation and execute in visitor browsers 
  when page content is rendered.
