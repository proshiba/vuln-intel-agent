title: RustFS is a distributed object storage system built in Rust. From 
  1.0.0-alpha.64 until 1.0.0-rc.1, RustFS external OPA authorization enabled by 
  RUSTFS_POLICY_PLUGIN_URL in crates/iam/src/sys.rs sets 
  PreparedIamAuth.needs_existing_object_tag incorrectly for 
  PreparedIamMode::Opa, causing maybe_merge_object_tag_conditions to omit 
  s3:ExistingObjectTag/* values and allowing authenticated users to bypass 
  tag-based policy restrictions. This issue is fixed in version 1.0.0-rc.1.
