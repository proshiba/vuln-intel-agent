title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (pmbus) Fix type confusion in notification logic\n\nSashiko reports:\n\nAt the start
  of the loop in pmbus_notify(), the code unconditionally casts\nevery attribute to
  a struct sensor_device_attribute:\n\ndrivers/hwmon/pmbus/pmbus_core.c:pmbus_notify()
  {\n    for (i = 0; i < data->num_attributes; i++) {\n        struct device_attribute
  *da = to_dev_attr(data->group.attrs[i]);\n        struct sensor_device_attribute
  *attr = to_sensor_dev_attr(da);\n        int index = attr->index;\n...\n}\n\nHowever,
  data->group.attrs can contain other types like struct\npmbus_samples_reg or struct
  pmbus_sensor, which only embed a base\nstruct device_attribute.\n\nIf da is a struct
  pmbus_samples_reg, dev_attr is the last member. Casting\nit to struct sensor_device_attribute
  and reading the index field appears\nto access memory past the end of the allocation,
  which might trigger a\nslab-out-of-bounds read.\n\nAdditionally, if da is a struct
  pmbus_sensor,"
