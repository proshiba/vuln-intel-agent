title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/filemap:
  __filemap_add_folio() restore index before retrying\n\nIn __filemap_add_folio()'s
  split-a-conflict loop, xas_set_order() is\napplied repeatedly: each application
  modifies xas.xa_index, rounding it\ndown according to the split_order attempted
  at that stage: and if all goes\nas intended, it eventually (or immediately) converges
  on an\nxas_try_split() to the required folio_order, with xas.xa_index now the\n\
  same as index: then xas_store() puts the new folio into the xarray there.\n\nBut
  if a new node was needed, and GFP_NOWAIT allocation did not get one,\nthe lock is
  dropped, xas_nomem() used to allocate, and sequence retried. \nIf (that part of)
  the xarray is unchanged when the lock is reacquired, no\nproblem.  But what if the
  conflict was meanwhile resolved by another\nthread (perhaps even doing the same
  thing, inserting a folio at that same\nindex)?  Isn't there a danger of now putting
  our folio into the xarray at\nan int"
