title: "Kenwood DNR1007XR udhcpd Incorrect Permission Assignment Local Privilege Escalation
  Vulnerability. This vulnerability allows local attackers to escalate privileges
  on affected installations of Kenwood DNR1007XR devices. An attacker must first obtain
  the ability to execute low-privileged code on the target system in order to exploit
  this vulnerability.\n\nThe specific flaw exists within the udhcpd service. The issue
  results from incorrect permissions set on a resource used by the service. An attacker
  can leverage this vulnerability to escalate privileges and execute code in the context
  of root. Was ZDI-CAN-29111."
