title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Fix missing mem scrub at clear key import in cca_clr2cipherkey()\n\nThe helper function
  _ip_cprb_helper() uses internal buffer memory for\nbuilding and processing CPRBs.
  After use this buffer was never\nscrubbed which could lead to leaving for example
  clear key material in\nmemory which could be exposed via tricky reuse of this same
  memory.\n\nExtend the _ip_cprb_helper() function with another parameter 'scrub'\n\
  used to steer scrubbing of this buffer. So now the caller has the\nopportunity to
  decide if scrubbing is needed or not.\n\nExtend the clear key to secure key token
  import process in function\ncca_clr2cipherkey() to tell the helper function from
  above to scrub\nthe cprb buffer when the clear key value is part of the request
  data.\n\nAdd explicit scrubbing on return from function cca_clr2cipherkey() for\n\
  the random EXOR buffer and the cprb buffer.\n\nOverall this cleans the internal
  used buffer in case of clear key\ni"
