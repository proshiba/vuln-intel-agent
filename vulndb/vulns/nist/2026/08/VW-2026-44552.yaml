title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix addr_wq_timer race in sctp_free_addr_wq()\n\nsctp_free_addr_wq() previously
  removed addr_wq_timer using timer_delete()\nwhile holding addr_wq_lock. However,
  timer_delete() does not guarantee that\na currently running timer handler has completed.\n\
  \nThis allows a race with sctp_addr_wq_timeout_handler(), where the handler\nmay
  still run after addr_waitq has been freed, acquire addr_wq_lock, and\naccess freed
  memory, leading to a use-after-free.\n\nFix this by calling timer_shutdown_sync()
  before taking addr_wq_lock.  This\nguarantees that any in-flight timer handler has
  finished and prevents the\ntimer from being re-armed during teardown, making subsequent
  cleanup safe."
