title: The Smash Balloon Social Photo Feed – Easy Social Feeds Plugin plugin for
  WordPress is vulnerable to Reflected Cross-Site Scripting via REQUEST_URI 
  Query String in all versions up to, and including, 6.11.3 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that 
  execute if they can successfully trick a user into performing an action such 
