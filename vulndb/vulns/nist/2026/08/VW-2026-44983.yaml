title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  do not send ICMP/NDISC Redirects when peer allocation fails\n\nWhen inet_getpeer_v4()
  or inet_getpeer_v6() fails to allocate a peer entry\nunder memory pressure or tree
  size caps, redirect handlers previously fell\nback to sending un-rate-limited ICMP/NDISC
  Redirect messages.\n\nIn IPv4, ip_rt_send_redirect() called icmp_send() directly
  when peer == NULL.\nIn IPv6, ip6_forward() and ndisc_send_redirect() passed a NULL
  peer into\ninet_peer_xrlim_allow(), which returned true when peer == NULL.\n\nBecause
  ICMP/NDISC Redirects are not part of the default global rate limit\nmask (sysctl_icmp_ratemask),
  sending redirects when peer == NULL creates\nan un-rate-limited ICMP packet storm.\n\
  \nFix this by failing closed in ip_rt_send_redirect(), ip6_forward(), and\nndisc_send_redirect()
  when peer is NULL."
