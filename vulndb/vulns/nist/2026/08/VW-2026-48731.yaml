title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnge:
  Fix NULL pointer dereference in aux device release\n\nIf allocation of auxr_dev
  fails during auxiliary device setup, the error\npath calls auxiliary_device_uninit(),
  which eventually invokes\nbnge_aux_dev_release().\n\nThe release callback unconditionally
  dereferences aux_priv->auxr_dev->pdev\nto retrieve the parent bnge_dev. Since auxr_dev
  has not yet been allocated\non this failure path, the dereference results in a NULL
  pointer exception\n\nRetrieve the parent bnge_dev from the auxiliary device's parent
  instead of\nauxr_dev, and free auxr_dev only when it was successfully allocated.
  This\nallows the release callback to correctly clean up partially initialized\n\
  auxiliary devices."
