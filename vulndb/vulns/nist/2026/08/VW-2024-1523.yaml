title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  Prevent race issues involving the adminq\n\nThere are multiple paths that can result
  in using the pdsc's\nadminq.\n\n[1] pdsc_adminq_isr and the resulting work from
  queue_work(),\n    i.e. pdsc_work_thread()->pdsc_process_adminq()\n\n[2] pdsc_adminq_post()\n\
  \nWhen the device goes through reset via PCIe reset and/or\na fw_down/fw_up cycle
  due to bad PCIe state or bad device\nstate the adminq is destroyed and recreated.\n\
  \nA NULL pointer dereference can happen if [1] or [2] happens\nafter the adminq
  is already destroyed.\n\nIn order to fix this, add some further state checks and\n\
  implement reference counting for adminq uses. Reference\ncounting was used because
  multiple threads can attempt to\naccess the adminq at the same time via [1] or [2].
  Additionally,\nmultiple clients (i.e. pds-vfio-pci) can be using [2]\nat the same
  time.\n\nThe adminq_refcnt is initialized to 1 when the adminq has been\nallocated
  and is ready to use. Users/cl"
