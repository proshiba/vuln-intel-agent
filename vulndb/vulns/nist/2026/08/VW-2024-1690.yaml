title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbootconfig:
  use memblock_free_late to free xbc memory to buddy\n\nOn the time to free xbc memory
  in xbc_exit(), memblock may has handed\nover memory to buddy allocator. So it doesn't
  make sense to free memory\nback to memblock. memblock_free() called by xbc_exit()
  even causes UAF bugs\non architectures with CONFIG_ARCH_KEEP_MEMBLOCK disabled like
  x86.\nFollowing KASAN logs shows this case.\n\nThis patch fixes the xbc memory free
  problem by calling memblock_free()\nin early xbc init error rewind path and calling
  memblock_free_late() in\nxbc exit path to free memory to buddy allocator.\n\n[ \
  \   9.410890] ==================================================================\n\
  [    9.418962] BUG: KASAN: use-after-free in memblock_isolate_range+0x12d/0x260\n\
  [    9.426850] Read of size 8 at addr ffff88845dd30000 by task swapper/0/1\n\n[\
  \    9.435901] CPU: 9 PID: 1 Comm: swapper/0 Tainted: G     U             6.9.0-rc3-00208-g586b5dfb51b9
  #5\n[   "
