title: "In the Linux kernel, the following vulnerability has been resolved:\n\nionic:
  fix kernel panic in XDP_TX action\n\nIn the XDP_TX path, ionic driver sends a packet
  to the TX path with rx\npage and corresponding dma address.\nAfter tx is done, ionic_tx_clean()
  frees that page.\nBut RX ring buffer isn't reset to NULL.\nSo, it uses a freed page,
  which causes kernel panic.\n\nBUG: unable to handle page fault for address: ffff8881576c110c\n\
  PGD 773801067 P4D 773801067 PUD 87f086067 PMD 87efca067 PTE 800ffffea893e060\nOops:
  Oops: 0000 [#1] PREEMPT SMP DEBUG_PAGEALLOC KASAN NOPTI\nCPU: 1 PID: 25 Comm: ksoftirqd/1
  Not tainted 6.9.0+ #11\nHardware name: ASUS System Product Name/PRIME Z690-P D4,
  BIOS 0603 11/01/2021\nRIP: 0010:bpf_prog_f0b8caeac1068a55_balancer_ingress+0x3b/0x44f\n\
  Code: 00 53 41 55 41 56 41 57 b8 01 00 00 00 48 8b 5f 08 4c 8b 77 00 4c 89 f7 48
  83 c7 0e 48 39 d8\nRSP: 0018:ffff888104e6fa28 EFLAGS: 00010283\nRAX: 0000000000000002
  RBX: ffff8881576c1140 RCX: 0000000000000002\nRDX: ffffffffc0051f64 RSI: "
