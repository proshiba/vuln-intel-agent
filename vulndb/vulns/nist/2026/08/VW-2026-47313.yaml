title: "Authentication Bypass by Capture-replay in ZenHive mpp allows an unauthenticated
  third party to obtain paid resources by replaying a transfer settled by an unrelated
  payer.\n\nMPP.Methods.Tempo normally binds a settled TIP-20 TransferWithMemo to
  the specific challenge under verification through an attribution nonce carried in
  the memo. When a static \"memo\" is configured in method_config, check_matched_memo_binding/3
  returns the match unconditionally and that binding is skipped, leaving only token,
  recipient, amount and the static memo value to match on. The static memo is echoed
  in every unauthenticated 402 response and Tempo transfers are public, so an attacker
  can take any matching transfer paid by a legitimate customer, request a fresh challenge
  for the same route, and present that transaction hash as a type=\"hash\" credential.
  The hash path performs no sender or signature check tying the presenter to the wallet
  that broadcast the transfer.\n\nThis issue affects mpp: from 0.6.1 before 0."
