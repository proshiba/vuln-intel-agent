title: "The ERP: Complete HR, Accounting & CRM Suite Built for WooCommerce plugin
  for WordPress is vulnerable to Unrestricted File Type Upload in all versions up
  to, and including, 1.17.8 via the save_attachments() function. This is due to missing
  file extension validation and missing path normalization when CRM Email Connect
  processes inbound IMAP email attachments. This makes it possible for unauthenticated
  attackers to send a crafted email to the site's configured inbound mailbox with
  a forged References header matching the plugin's expected pattern and an attachment
  filename such as `../helper.php`, causing the cron-based IMAP sync job to write
  attacker-controlled PHP outside of the .htaccess-protected `crm-attachments` directory
  and into `wp-content/uploads/`. On configurations where PHP executes in uploads,
  this can lead to remote code execution. Exploitation requires the CRM module and
  IMAP Email Connect feature to be enabled and configured."
