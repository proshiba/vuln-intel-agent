title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  wait for fixup workers before stopping cleaner kthread during umount\n\nDuring unmount,
  at close_ctree(), we have the following steps in this order:\n\n1) Park the cleaner
  kthread - this doesn't destroy the kthread, it basically\n   halts its execution
  (wake ups against it work but do nothing);\n\n2) We stop the cleaner kthread - this
  results in freeing the respective\n   struct task_struct;\n\n3) We call btrfs_stop_all_workers()
  which waits for any jobs running in all\n   the work queues and then free the work
  queues.\n\nSyzbot reported a case where a fixup worker resulted in a crash when
  doing\na delayed iput on its inode while attempting to wake up the cleaner at\n\
  btrfs_add_delayed_iput(), because the task_struct of the cleaner kthread\nwas already
  freed. This can happen during unmount because we don't wait\nfor any fixup workers
  still running before we call kthread_stop() against\nthe cleaner kthread, which
