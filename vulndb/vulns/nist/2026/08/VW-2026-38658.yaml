title: The Jeg Kit for Elementor plugin for WordPress is vulnerable to Sensitive
  Information Exposure in all versions up to, and including, 3.1.1 via the 
  `enqueue_scripts()` method in `class/dashboard/class-dashboard.php`. The 
  plugin injects a `JkitDashboardOption` JavaScript object containing full 
  plugin inventory (names, versions, paths, active status), system environment 
  details (WordPress version, PHP version, site URLs, server capabilities), and 
  potentially third-party API credentials (Mailchimp API key via 
  `jkit_user_data`) as an inline script on the `post.php` admin page. Because 
  this data is output without any capability check beyond post editing access, 
  any authenticated user with Contributor-level access or above can view this 
  sensitive configuration data by inspecting the page source. This makes it 
  possible for authenticated attackers, with Contributor-level access and above,
  to extract sensitive site configuration data, installed plugin details, and 
  potentially third-party API key
