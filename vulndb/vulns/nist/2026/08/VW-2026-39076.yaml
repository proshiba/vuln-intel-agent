title: OpenEMR through 8.2.0 contains an authentication bypass vulnerability 
  that allows attackers with valid credentials to circumvent multi-factor 
  authentication by exploiting the exposed OAuth2 password grant flow through an
  unauthenticated client registration endpoint. Attackers can register an OAuth2
  client via the unauthenticated registration endpoint and use the password 
  grant to exchange credentials for an API access token, bypassing the normal 
  web interface authentication and any enforced multi-factor authentication 
  controls.
