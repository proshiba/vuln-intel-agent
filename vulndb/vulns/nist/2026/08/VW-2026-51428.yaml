title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix u16 truncation of restart-area length check\n\nntfs_check_restart_area() validates
  that the $LogFile restart area and\nits trailing log client record array fit within
  the system page size:\n\n        u16 ra_ofs, ra_len, ca_ofs;\n        ...\n    \
  \    ra_len = ca_ofs + le16_to_cpu(ra->log_clients) *\n                        sizeof(struct
  log_client_record);\n        if (ra_ofs + ra_len > le32_to_cpu(rp->system_page_size)
  || ...)\n                return false;\n\nra_len is u16, but the right-hand side
  is computed in size_t\n(sizeof(struct log_client_record) == 160). Both ca_ofs and
  log_clients\ncome straight from the on-disk restart area. With an on-disk\nlog_clients
  of 410 the product 410 * 160 = 65600; adding ca_ofs and\nstoring into the u16 ra_len
  truncates modulo 65536 (e.g. ca_ofs 64\ngives ra_len 128), so the \"fits in the
  page\" check passes even though\nthe client array described by log_clients extends
  far beyond the page."
