title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ks8851: Queue RX packets in IRQ handler instead of disabling BHs\n\nCurrently the
  driver uses local_bh_disable()/local_bh_enable() in its\nIRQ handler to avoid triggering
  net_rx_action() softirq on exit from\nnetif_rx(). The net_rx_action() could trigger
  this driver .start_xmit\ncallback, which is protected by the same lock as the IRQ
  handler, so\ncalling the .start_xmit from netif_rx() from the IRQ handler critical\n\
  section protected by the lock could lead to an attempt to claim the\nalready claimed
  lock, and a hang.\n\nThe local_bh_disable()/local_bh_enable() approach works only
  in case\nthe IRQ handler is protected by a spinlock, but does not work if the\n\
  IRQ handler is protected by mutex, i.e. this works for KS8851 with\nParallel bus
  interface, but not for KS8851 with SPI bus interface.\n\nRemove the BH manipulation
  and instead of calling netif_rx() inside\nthe IRQ handler code protected by the
  lock, queue all the received\nS"
