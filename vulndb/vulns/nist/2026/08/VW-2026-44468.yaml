title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  restrict socket queue dumps in enqueue tracepoints\n\ntipc_sk_enqueue() runs with
  sk->sk_lock.slock held while the socket is\nowned by user context. The spinlock
  protects the backlog queue in this\npath, but it does not serialize against the
  socket owner consuming or\npurging sk_receive_queue.\n\nKASAN reported:\n\n  CPU:
  14 UID: 0 PID: 1050 Comm: tipc3 Not tainted 7.1.0-rc6+ #126 PREEMPT(lazy)\n  Hardware
  name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.15.0-1 04/01/2014\n  Call Trace:\n\
  \    <TASK>\n    dump_stack_lvl+0x76/0xa0 lib/dump_stack.c:123\n    print_report+0xce/0x5b0
  mm/kasan/report.c:482\n    kasan_report+0xc6/0x100 mm/kasan/report.c:597\n    __asan_report_load4_noabort+0x14/0x30
