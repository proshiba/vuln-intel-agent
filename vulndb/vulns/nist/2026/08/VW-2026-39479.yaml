title: 'A security vulnerability has been detected in RackTables up to 0.22.0/e5fff9f8aab339798ed47e8c6d7d977ed97a82bd.
  This vulnerability affects unknown code. The manipulation leads to cross-site request
  forgery. The attack is possible to be carried out remotely. The exploit has been
  disclosed publicly and may be used. The project maintainer confirms: "[I]t seems
  plausible, in that RackTables does not at this time have any CSRF prevention. You
  may assign a CVE ID to this, but there is no guarantee it will be handled in urgent,
  or even timely, manner, or at all."'
