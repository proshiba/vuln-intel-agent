title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB read in WMM_param_handler()\n\nWMM_param_handler() copies a fixed-size
  WMM parameter element out of a\nreceived information element without checking that
  the element is long\nenough, causing an out-of-bounds read for a short WMM IE.\n\
  \nThe handler reads sizeof(struct WMM_para_element) (18) bytes at\npIE->data + 6,
  so it requires pIE->length to be at least 24\n(WLAN_WMM_LEN), but it never validates
  the length. Two of its three\ncallers reach it after matching only the WMM OUI:
  OnAssocRsp() in\nrtw_mlme_ext.c matches a 6-byte OUI, and join_cmd_hdl() matches
  a\n4-byte OUI, before calling the handler. A vendor-specific IE carrying\nthe WMM
  OUI but a length between 6 and 23, placed in an association\nresponse or in the
  IE blob handed to join_cmd_hdl(), passes the OUI\ncheck and then makes the memcmp()
  and memcpy() at pIE->data + 6 read\npast the end of the element. OnAssocRsp() parses
