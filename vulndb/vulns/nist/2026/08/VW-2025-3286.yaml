title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  ymfpci: Create card with device-managed snd_devm_card_new()\n\nsnd_card_ymfpci_remove()
  was removed in commit c6e6bb5eab74 (\"ALSA:\nymfpci: Allocate resources with device-managed
  APIs\"), but the call to\nsnd_card_new() was not replaced with snd_devm_card_new().\n\
  \nSince there was no longer a call to snd_card_free, unloading the module\nwould
  eventually result in Oops:\n\n[697561.532887] BUG: unable to handle page fault for
  address: ffffffffc0924480\n[697561.532893] #PF: supervisor read access in kernel
  mode\n[697561.532896] #PF: error_code(0x0000) - not-present page\n[697561.532899]
  PGD ae1e15067 P4D ae1e15067 PUD ae1e17067 PMD 11a8f5067 PTE 0\n[697561.532905] Oops:
  0000 [#1] PREEMPT SMP NOPTI\n[697561.532909] CPU: 21 PID: 5080 Comm: wireplumber
  Tainted: G        W  OE      6.2.7 #1\n[697561.532914] Hardware name: System manufacturer
  System Product Name/TUF GAMING X570-PLUS, BIOS 4408 10/28/2022\n[697561.532916]
  RIP: 0010:try_m"
