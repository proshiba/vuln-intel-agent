title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  libiscsi: Fix stale-data leak into the SCSI sense buffer\n\niscsi_scsi_cmd_rsp()
  copies the sense data of a SCSI Response from the\ntarget-supplied data segment.\
  \  The segment carries a 2-byte sense length\nfollowed by the sense bytes, so it
  must hold 2 + senselen bytes, but the\nbounds check only requires datalen >= senselen:\n\
  \n\tsenselen = get_unaligned_be16(data);\n\tif (datalen < senselen)\n\t\tgoto invalid_datalen;\n\
  \tmemcpy(sc->sense_buffer, data + 2,\n\t       min_t(uint16_t, senselen, SCSI_SENSE_BUFFERSIZE));\n\
  \nA target that returns a SCSI Response whose datalen equals senselen\n(with senselen
  <= SCSI_SENSE_BUFFERSIZE) makes the memcpy() from data +\n2 read up to two bytes
  past the received data.  Those bytes are stale\nconn->data contents and end up in
  the command's sense buffer, which is\nreturned to userspace.\n\nAccount for the
  2-byte sense length prefix in the check."
