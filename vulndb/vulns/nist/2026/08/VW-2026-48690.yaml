title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fix skb length accounting after generic XDP frag adjustment\n\nGeneric XDP exposes
  non-linear skb fragments through an xdp_buff. If an\nXDP program adjusts the fragment
  area, bpf_prog_run_generic_xdp() copies\nxdp_frags_size back to skb->data_len but
  leaves skb->len containing the\nold fragment contribution.\n\nAfter a fragment shrink,
  this makes skb_headlen() larger than the actual\nlinear area. In the reproduced
  UDP receive path, __skb_datagram_iter()\ncopied 1024 bytes past the actual linear
  tail to userspace, starting at\nstruct skb_shared_info. The copied bytes included
  the affected skb's\nnr_frags, xdp_frags_size and a kernel pointer from\nskb_shinfo(skb)->frags[0].
  Real packet data was displaced by the same\namount and truncated at the end.\n\n\
  Subtract the old data_len before replacing it and add the new data_len\nafterwards,
  keeping skb->len and skb->data_len synchronized.\n\nA 60000-byte UDP datagram on
  a veth pair with M"
