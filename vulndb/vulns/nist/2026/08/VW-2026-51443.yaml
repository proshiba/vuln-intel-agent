title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd/viommu:
  Release the igroup lock on the vdevice_size error path\n\niommufd_vdevice_alloc_ioctl()
  takes idev->igroup->lock, then validates the\ndriver's vdevice_size against the
  core structure size with a WARN_ON_ONCE.\nOn failure that guard jumps to out_put_idev,
  below out_unlock_igroup, so it\nskips the mutex_unlock(), leaving the igroup lock
  held and deadlocking the\nnext vDEVICE operation on that group.\n\nJump to out_unlock_igroup
  instead."
