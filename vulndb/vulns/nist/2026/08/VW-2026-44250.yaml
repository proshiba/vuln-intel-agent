title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  elx: efct: Fix I/O leak on unsupported additional CDB\n\nefct_dispatch_fcp_cmd()
  allocates an efct_io before dispatching an\nunsolicited FCP command. If the command
  has an unsupported additional\nCDB, the function returns -EIO before handing the
  IO to the SCSI layer.\n\nFree the allocated IO before returning from this error
  path."
