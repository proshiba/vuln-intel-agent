title: Trilium is an open-source hierarchical note-taking application. In 
  versions up to and including 0.103.0, the default-on "Safe import" filter does
  not sanitize note titles, and the GeoMap note view interpolates a marker 
  note's title into raw HTML that is rendered as innerHTML, allowing an 
  attacker-supplied import archive to inject script that runs when the map is 
  displayed. Because Safe import neutralizes scripts but never escapes titles, a
  note whose title contains an HTML event-handler payload survives the import 
  and executes as soon as the victim opens the GeoMap that renders its marker. 
  On the desktop client the Electron renderer runs with Node integration 
  enabled, so the injected JavaScript escalates from cross-site scripting to 
  full remote code execution on the victim's machine. This issue is fixed in 
  version 0.104.0.
