title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  harden rq_procinfo lifecycle to prevent double-free\n\nThe svc_release_rqst() function
  executes the callback inside\nrqstp->rq_procinfo->pc_release. However, if a worker
  thread begins\nprocessing a new request and encounters an early error path (e.g.,\n\
  unsupported protocol, short frame, or bad auth) before a valid\nrq_procinfo is installed,
  a stale release hook can be re-triggered\nagainst reused state from the previous
  RPC, resulting in a double-free\nor use-after-free vulnerability.\n\nHarden the
  lifecycle of rq_procinfo by:\n1. Ensuring svc_release_rqst() always clears rq_procinfo
  after the\n   optional pc_release() call, regardless of whether the hook exists.\n\
  2. Explicitly clearing rq_procinfo at request entry in svc_process()\n   before
  any early decode or drop paths.\n3. Ensuring svc_process_bc() does the same at backchannel
  entry.\n\nThis guarantees that error flows will not encounter a non-NULL stale\n\
  rq_procinfo point"
