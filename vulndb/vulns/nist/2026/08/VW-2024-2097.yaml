title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  Fix a data race on last_boosted_vcpu in kvm_vcpu_on_spin()\n\nUse {READ,WRITE}_ONCE()
  to access kvm->last_boosted_vcpu to ensure the\nloads and stores are atomic.  In
  the extremely unlikely scenario the\ncompiler tears the stores, it's theoretically
  possible for KVM to attempt\nto get a vCPU using an out-of-bounds index, e.g. if
  the write is split\ninto multiple 8-bit stores, and is paired with a 32-bit load
  on a VM with\n257 vCPUs:\n\n  CPU0                              CPU1\n  last_boosted_vcpu
  = 0xff;\n\n                                    (last_boosted_vcpu = 0x100)\n   \
  \                                 last_boosted_vcpu[15:8] = 0x01;\n  i = (last_boosted_vcpu
  = 0x1ff)\n                                    last_boosted_vcpu[7:0] = 0x00;\n\n\
  \  vcpu = kvm->vcpu_array[0x1ff];\n\nAs detected by KCSAN:\n\n  BUG: KCSAN: data-race
  in kvm_vcpu_on_spin [kvm] / kvm_vcpu_on_spin [kvm]\n\n  write to 0xffffc90025a92344
  of 4 bytes by task 4340 on c"
