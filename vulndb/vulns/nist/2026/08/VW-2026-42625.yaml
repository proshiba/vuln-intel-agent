title: Cursor is a code editor built for programming with AI. Prior to 3.1.2, 
  Cursor IDE for macOS allows an agent running in Auto-Run Sandbox mode to 
  replace a virtual environment's Python executable with a malicious wrapper 
  that the Microsoft Python extension invokes outside the sandbox, allowing 
  arbitrary host commands with the user's privileges, including modifying files 
  outside the workspace and launching applications. This issue is fixed in 
  version 3.1.2.
