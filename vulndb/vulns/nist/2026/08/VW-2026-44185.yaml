title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpu/hotplug:
  Fix NULL kobject warning in cpuhp_smt_enable()\n\nOn arm64, when booting with `maxcpus`
  greater than the number of present\nCPUs (e.g., QEMU -smp cpus=4,maxcpus=8), some
  CPUs are marked as 'present'\nbut have not yet been registered via register_cpu().
  Consequently,\nthe per-cpu device objects for these CPUs are not yet initialized.\n\
  \nIn cpuhp_smt_enable(), the code iterates over all present CPUs. Calling\n_cpu_up()
  for these unregistered CPUs eventually leads to\nsysfs_create_group() being called
  with a NULL kobject (or a kobject\nwithout a directory), triggering the following
  warning in\nfs/sysfs/group.c:\n\n  WARNING: fs/sysfs/group.c:137 at internal_create_group+0x41c/0x4bc,
  CPU#2: sh/181\n  [...]\n  Call trace:\n    internal_create_group+0x41c/0x4bc (P)\n\
  \    sysfs_create_group+0x18/0x24\n    topology_add_dev+0x1c/0x28\n    cpuhp_invoke_callback+0x104/0x20c\n\
  \    __cpuhp_invoke_callback_range+0x94/0x11c\n    _cpu_up+0x200"
