title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix memory ordering between normal and ordered work functions\n\nOrdered work functions
  aren't guaranteed to be handled by the same thread\nwhich executed the normal work
  functions. The only way execution between\nnormal/ordered functions is synchronized
  is via the WORK_DONE_BIT,\nunfortunately the used bitops don't guarantee any ordering
  whatsoever.\n\nThis manifested as seemingly inexplicable crashes on ARM64, where\n\
  async_chunk::inode is seen as non-null in async_cow_submit which causes\nsubmit_compressed_extents
  to be called and crash occurs because\nasync_chunk::inode suddenly became NULL.
  The call trace was similar to:\n\n    pc : submit_compressed_extents+0x38/0x3d0\n\
  \    lr : async_cow_submit+0x50/0xd0\n    sp : ffff800015d4bc20\n\n    <registers
  omitted for brevity>\n\n    Call trace:\n     submit_compressed_extents+0x38/0x3d0\n\
  \     async_cow_submit+0x50/0xd0\n     run_ordered_work+0xc8/0x280\n     btrfs_work_helper+0x98/0x2"
