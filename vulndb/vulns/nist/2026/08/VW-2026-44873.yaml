title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Wait on external BO kernel fences in exec IOCTL\n\nBefore arming a user job, xe_exec_ioctl()
  only added the VM's\ndma-resv KERNEL slot as a dependency. That slot covers rebinds
  and\nthe kernel operations of the VM's private BOs, but not external BOs\n(bo->vm
  == NULL), which carry their kernel operations (evictions,\nmoves, ...) in their
  own dma-resv KERNEL slot.\n\nThe DMA_RESV_USAGE_KERNEL slot is the cross-driver
  contract for\nmemory management operations that must complete before the BO or its\n\
  backing store may be used: any accessor is required to wait on the\nKERNEL fences
  before touching the resv. By skipping the external BOs'\nKERNEL slots, the exec
  path violated that contract and could schedule\na user job while a kernel operation
  on an external BO mapped by the VM\nwas still in flight, racing against it and potentially
  reading or\nwriting memory that was being moved.\n\nReplace the VM-only dependency
  with an iteration"
