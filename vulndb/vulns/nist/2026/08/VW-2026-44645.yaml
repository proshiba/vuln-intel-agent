title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  Fix possible use after free\n\nIn dma_release_channel(), check chan->device->privatecnt
  after call\ndma_chan_put(). However, dma_chan_put() call dma_device_put() which
  could\nrelease the last reference of the device if the DMA provider is already\n\
  gone and hence free it.\n\nFixes it by moving dma_chan_put() after the check."
