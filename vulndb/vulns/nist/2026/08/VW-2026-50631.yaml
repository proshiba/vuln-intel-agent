title: 'Penpot is an open-source design and prototyping platform. In versions up to
  and including 2.14.3, Penpot is vulnerable to stored cross-site scripting through
  custom font family names, which are interpolated into a @font-face CSS rule and
  injected into the page as HTML without sanitization. Because the backend accepts
  an arbitrary font-family string and the frontend writes the resulting style through
  innerHTML, a name containing markup such as a closing style tag followed by a script
  can break out of the style element and execute JavaScript on the Penpot origin.
  The attack is passive: any team member who opens a file referencing the malicious
  font triggers script execution simply by rendering the page, allowing theft of session
  cookies, actions performed as the victim, and access to their files and projects.
  This issue is fixed in version 2.15.3.'
