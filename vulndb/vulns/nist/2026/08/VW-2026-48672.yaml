title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  fastrpc: Remove buffer from list prior to unmap operation\n\nfastrpc_req_munmap_impl()
  is called to unmap any buffer. The buffer is\ngetting removed from the list after
  it is unmapped from DSP. This can\ncreate potential race conditions if multiple
  threads invoke unmap\nconcurrently, where one thread may remove the entry from the
  list while\nanother thread's unmap operation is still ongoing.\n\nFix this by removing
  the buffer entry from the list before calling the\nunmap operation. If the unmap
  fails, the entry is re-added to the list\nso that userspace can retry the unmap,
  or alternatively, the buffer\nwill be cleaned up during device release when the
  DSP process is torn\ndown and all DSP-side mappings are freed along with remaining
  buffers\nin the list."
