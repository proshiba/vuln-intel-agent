title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2/dlm:
  require a ref for locking_state debugfs open\n\ndebug_lockres_open() copies inode->i_private
  into struct debug_lockres and\ndebug_lockres_release() later drops that pointer
  with dlm_put().  That\nonly works if open successfully pins the struct dlm_ctxt.\n\
  \nToday open calls dlm_grab(dlm) but ignores its return value.  Once the\nlast domain
  unregister has removed the context from dlm_domains,\ndlm_grab() returns NULL, yet
  open still stores the raw pointer and returns\nsuccess.  The later release path
  is outside the debugfs removal barrier,\nso it can call dlm_put() after dlm_free_ctxt_mem()
  has freed the context. \nKASAN reports this as a slab-use-after-free in dlm_put()
  called from\ndebug_lockres_release().\n\nFail the open when dlm_grab() cannot acquire
  the reference and unwind the\nseq_file private state before returning.  That keeps
  locking_state from\nhanding out a file descriptor whose release path does not own
  the\ndlm"
