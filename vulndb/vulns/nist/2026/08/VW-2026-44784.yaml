title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix inconsistent arvif state in vdev_create error paths\n\nath12k_mac_vdev_create()
  has three error path issues that leave arvif\nin an inconsistent state:\n\n1. When
  ath12k_wmi_vdev_create() fails, the function returns directly\n   without clearing
  arvif->ar, which was already set before the WMI\n   call. Subsequent code checking
  arvif->ar to determine vdev readiness\n   will see a non-NULL value despite no vdev
  existing in firmware.\n\n2. When ath12k_wmi_send_peer_delete_cmd() fails in err_peer_del,
  the\n   code jumped to err: skipping the DP peer cleanup and vdev rollback,\n  \
  \ leaving num_created_vdevs, vdev maps and arvif list membership live.\n\n3. When
  ath12k_wait_for_peer_delete_done() fails, the code jumped to\n   err_vdev_del: skipping
  the DP peer cleanup.\n\nFix by changing the ath12k_wmi_vdev_create() failure to
  goto err instead\nof returning directly, routing both err_peer_del failure paths
  through\nerr_dp_peer"
