title: Shinobi before commit 5a76c74f contains a hardcoded connection key in the
  child node service that allows unauthenticated attackers to execute arbitrary 
  database queries. Attackers reaching the child node port can present the 
  hardcoded key during WebSocket handshake, then dispatch SQL queries through 
  the onWebSocketDataFromChildNode handler to read and modify user records and 
  camera configuration.
