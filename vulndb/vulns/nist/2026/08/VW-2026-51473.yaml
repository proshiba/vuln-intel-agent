title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  validate Adaptation Indication parameter length\n\nThe Adaptation Layer Indication
  parameter contains a fixed 32-bit\nAdaptation Code Point after its parameter header.
  However,\nsctp_verify_param() accepts a header-only parameter because the generic\n\
  parameter walker only requires the header to be present.\n\nsctp_process_param()
  then reads adaptation_ind beyond the declared\nparameter. When the malformed parameter
  is last in an INIT, the read\nstarts at the receive skb tail, and the value is copied
  into the state\ncookie returned in the INIT ACK. This may disclose four receive-buffer\n\
  tail bytes.\n\nRequire the declared parameter length to match the fixed structure
  size\nand abort the association through the existing invalid parameter length\n\
  path otherwise."
