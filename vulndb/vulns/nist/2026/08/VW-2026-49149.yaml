title: Print Assumptions does not report that a definition was produced while 
  universe checking was disabled when that definition reaches the caller through
  Parameter Inline in a module type. Applying a functor inlines the body of the 
  parameter, and the inlining drops the record that the term was built under 
  Unset Universe Checking, so the resulting constant carries no trace of the 
  unsafe operation. A module implementation can therefore prove False using a 
  universe inconsistency, expose it through an inlined parameter, and have Print
  Assumptions report the dependent proof as closed under the global context. 
  Because Print Assumptions is the in-process audit used to confirm that a 
  development rests on no unexpected assumptions, a dependency built this way 
  passes that audit while proving arbitrary propositions. The standalone checker
  coqchk does reject the resulting compiled file. The project records this in 
  dev/doc/critical-bugs.md under non-fixed bugs and rates the risk as moderate 
  when coqchk
