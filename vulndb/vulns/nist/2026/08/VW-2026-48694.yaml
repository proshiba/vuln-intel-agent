title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  clear IPv4 options after rebasing tunnel ICMP errors\n\nip_vs_in_icmp() rebases
  an skb from the outer ICMP packet to the\nquoted original request before passing
  it to icmp_send(). However,\nIPCB(skb)->opt still describes the outer IPv4 header.\n\
  \nA timestamp option in the outer header can therefore leave an offset\nthat points
  into the quoted transport header after the rebase.\n__ip_options_echo() treats a
  byte at that stale location as the option\nlength and copies it into the fixed-size
  option storage on the\n__icmp_send() stack, causing a stack out-of-bounds write.\n\
  \nClear the stale option metadata after resetting the network header.\nKeep the
  remaining control block fields, including the ingress\ninterface used by the ICMP
  response path."
