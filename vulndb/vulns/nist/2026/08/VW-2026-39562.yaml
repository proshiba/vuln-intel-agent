title: The miniOrange 2FA  WordPress plugin before 6.2.7 does not bind the 
  second factor being configured during the pre-login two-factor challenge to 
  the target account's existing factor, allowing an attacker who knows a user's 
  password to rebind that user's second factor to an attacker-controlled 
  destination, complete the challenge, and take over the account, including 
  administrator accounts.
