title: Budibase is an open-source low-code platform. Prior to 3.39.19, the 
  PostgreSQL datasource connector in 
  packages/server/src/integrations/postgres.ts interpolates the user-controlled 
  schema configuration field into a SET search_path statement without escaping 
  embedded double quotes, allowing an authenticated administrator who saves or 
  tests the datasource to execute arbitrary SQL through the simple query 
  protocol. This issue is fixed in version 3.39.19.
