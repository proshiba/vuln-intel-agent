title: A vulnerability was determined in Wavlink WN531P3 and WN535M1 V250922. 
  Affected by this vulnerability is the function strcpy of the file 
  /etc/lighttpd/www/cgi-bin/export_pingortrace.cgi of the component Export 
  Pingortrace CGI. Executing a manipulation of the argument HTTP_COOKIE can lead
  to stack-based buffer overflow. The attack may be launched remotely. The 
  exploit has been publicly disclosed and may be utilized. The vendor was 
  contacted early about this disclosure.
