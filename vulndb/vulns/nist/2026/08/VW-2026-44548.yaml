title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  refuse O_TMPFILE creation with an unmapped fsuid or fsgid\n\nvfs_tmpfile() never
  checked that the caller's fsuid and fsgid map into\nthe filesystem.  On an idmapped
  mount whose idmapping does not cover the\ncaller's fs{u,g}id, the ->tmpfile() instance
  initializes the new inode\nthrough inode_init_owner(), where mapped_fsuid()/mapped_fsgid()
  return\nINVALID_UID/INVALID_GID, and the tmpfile ends up owned by (uid_t)-1.\n\n\
  Every other creation path already refuses this: may_o_create() (O_CREAT)\nand may_create_dentry()
  (mkdir, mknod, symlink, link) bail out with\n-EOVERFLOW via fsuidgid_has_mapping()
  precisely so that an object cannot\nbe created with an owner the filesystem cannot
  represent.  An O_TMPFILE\nis no exception: it is created I_LINKABLE and linkat(2)
  can splice it\ninto the namespace afterwards, so the same guarantee must hold.\n\
