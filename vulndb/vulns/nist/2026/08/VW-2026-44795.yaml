title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix TOCTOU heap overflow in get_srq_wqe\n\nget_srq_wqe() reads wqe->dma.num_sge
  from the shared receive queue\nbuffer, which is mapped into userspace. It validates
  num_sge against\nmax_sge, but then re-reads the same field to calculate the memcpy\n\
  size. A concurrent userspace thread can modify num_sge between\nvalidation and use,
  causing a heap buffer overflow when copying the\nWQE into qp->resp.srq_wqe.\n\n\
  Read num_sge into a local variable and use it for both the bounds\ncheck and the
  size calculation."
