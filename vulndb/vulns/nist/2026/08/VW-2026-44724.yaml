title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  validate donor file superblock early in EXT4_IOC_MOVE_EXT\n\nReject the EXT4_IOC_MOVE_EXT
  ioctl early if the donor file does not\nbelong to the same superblock as the original
  file.  Currently, this\nvalidation is performed inside ext4_move_extents() by\n\
  mext_check_validity(), but only after lock_two_nondirectories() has\nalready acquired
  the inode locks.  When the donor fd refers to a file\non a different filesystem
  (e.g., overlayfs), this late validation\ncreates a circular lock dependency:\n\n\
  \  CPU0 (overlayfs write)            CPU1 (ext4 ioctl)\n  ----                 \
  \             ----\n  inode_lock(ovl_inode)\n                                  \
  \  mnt_want_write_file(filp)\n                                      sb_start_write(ext4_sb)\
  \   [sb_writers]\n    backing_file_write_iter()\n      vfs_iter_write(real_file)\n\
  \        file_start_write(real_file)\n          sb_start_write(ext4_sb)   [blocked
  by freeze]\n                      "
