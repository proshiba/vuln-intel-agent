  dm-verity: disable tasklets\n\nTasklets have an inherent problem with memory corruption.
  The function\ntasklet_action_common calls tasklet_trylock, then it calls the tasklet\n\
  callback and then it calls tasklet_unlock. If the tasklet callback frees\nthe structure
  that contains the tasklet or if it calls some code that may\nfree it, tasklet_unlock
  will write into free memory.\n\nThe commits 8e14f610159d and d9a02e016aaf try to
  fix it for dm-crypt, but\nit is not a sufficient fix and the data corruption can
