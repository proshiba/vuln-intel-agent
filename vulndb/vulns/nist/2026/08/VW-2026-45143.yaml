  vulnerabilities in expression evaluation that bypass existing safety controls 
  through unbounded string multiplication, uncontrolled BigInteger shift 
  operations, and LoopLimit bypass via range enumeration in builtin functions. 
  Attackers who can supply templates can cause out-of-memory exceptions or CPU 
  exhaustion, typically terminating the entire host process.
