title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  fix potential oops in cifs_oplock_break\n\nWith deferred close we can have closes
  that race with lease breaks,\nand so with the current checks for whether to send
  the lease response,\noplock_response(), this can mean that an unmount (kill_sb)
  can occur\njust before we were checking if the tcon->ses is valid.  See below:\n\
