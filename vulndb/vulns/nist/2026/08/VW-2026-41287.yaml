title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  pwc: Return queued buffers on start_streaming() failure\n\nThe vb2 framework hands
  buffers to the driver via buf_queue() before\ncalling start_streaming().  If start_streaming()
  returns an error\nwithout first returning those buffers via vb2_buffer_done(),\n\
  vb2_start_streaming() fires WARN_ON(owned_by_drv_count) and the queued\nbuffers
  leak.\n\npwc's start_streaming() had two early returns that hit this trap:\n-ENODEV
  when the USB device was already disconnected, and -ERESTARTSYS\nwhen mutex_lock_interruptible()
  was interrupted by a signal.  Call the\nexisting pwc_cleanup_queued_bufs() helper
  with VB2_BUF_STATE_QUEUED\nbefore returning (matching the state already used by
  the\npwc_isoc_init() error path in the same function).\n\nThis mirrors the uvcvideo
  fix in commit 4cf3b6fd54eb (\"media: uvcvideo:\nReturn queued buffers on start_streaming()
  failure\")."
