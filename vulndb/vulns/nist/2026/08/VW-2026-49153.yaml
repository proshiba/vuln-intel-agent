title: Dolibarr before 24.0.0 contains a sensitive data exposure vulnerability 
  in the Members REST API that allows authenticated attackers with member-read 
  rights to retrieve bcrypt password verifiers by querying member endpoints. 
  Attackers can call the individual member or member list endpoints to obtain 
  crypted password verifier fields that are not filtered by the base API 
  serializer or the Members API class, potentially enabling offline password 
  cracking attacks.
