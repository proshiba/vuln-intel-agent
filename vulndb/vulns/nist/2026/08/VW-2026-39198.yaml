  processing the edl fw_flash command, where the <filename> argument is copied 
  to a 64-byte stack buffer via memcpy without proper length validation. An 
  attacker with physical access to the UART3 serial interface can exploit this 
  vulnerability by sending a maliciously crafted command with an oversized 
