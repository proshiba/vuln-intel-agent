title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix UAF in sock clone early bailouts\n\nSimilar to recent commit 9b51a6155d14 (\"\
  bpf,fork: wipe ->bpf_storage\nbefore bailouts that access it\"), sk_clone() performs
  an initial\nshallow copy of the socket field ->sk_bpf_storage via sock_copy()\n\
  for the cloned socket newsk.\n\nIf sk_clone() bails out early (e.g. if sk_filter_charge()
  fails) prior\nto calling bpf_sk_storage_clone(), newsk->sk_bpf_storage still points\n\
  to the parent socket's BPF local storage. When newsk is subsequently\nfreed via
  sk_free(), the deallocation path (__sk_destruct() ->\nbpf_sk_storage_free()) destroys
  the parent socket's BPF local storage,\nleading to a use-after-free (UAF) on the
  parent socket.\n\nFix this by resetting newsk->sk_bpf_storage to NULL immediately
  after\nsock_copy() in sk_clone(), and remove the now redundant initialization\n\
  from bpf_sk_storage_clone()."
