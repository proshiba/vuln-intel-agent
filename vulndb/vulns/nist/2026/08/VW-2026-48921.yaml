title: Micrometer-instrumented Apache HttpAsyncClient (4.x or 5.x) usage via 
  MicrometerHttpClientInterceptor can leak memory unboundedly when asynchronous 
  requests fail before receiving a response (e.g. connection resets or 
  timeouts). Tracking state for these requests remains in memory indefinitely, 
  and sustained failures lead to heap exhaustion and OutOfMemoryError crashes.
