title: The Royal Elementor Addons plugin for WordPress is vulnerable to 
  Server-Side Request Forgery in versions up to, and including, 1.7.1064 via the
  Form Builder widget's 'webhook_url' setting. The widget's render() method 
  persists the attacker-controlled URL into the wpr_webhook_url_{widget_id} 
  option on every render (including a Contributor previewing their own draft), 
  and the wpr_form_builder_webhook AJAX handler — registered for both 
  authenticated and unauthenticated callers — reads that option and dispatches 
  the outbound request via the non-safe wp_remote_post(), with no host 
  allowlist, no scheme restriction, and no private/loopback IP filter (the 
