title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: Fix SKB corruption in REO destination ring\n\nWhile running traffics for
  a long time, randomly an RX descriptor\nfilled with value \"0\" from REO destination
  ring is received.\nThis descriptor which is invalid causes the wrong SKB (SKB stored
  in\nthe IDR lookup with buffer id \"0\") to be fetched which in turn\ncauses SKB
  memory corruption issue and the same leads to crash\nafter some time.\n\nChanged
  the start id for idr allocation to \"1\" and the buffer id \"0\"\nis reserved for
  error validation. Introduced Sanity check to validate\nthe descriptor, before processing
