title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Fix ep kref imbalance on ADDR_CHANGE\n\nrpcrdma_cm_event_handler() falls through
  to the disconnected: label\non RDMA_CM_EVENT_ADDR_CHANGE and calls rpcrdma_ep_put()
  with no\nmatching get when the event arrives before RDMA_CM_EVENT_ESTABLISHED.\n\
  The kref then underflows during connect teardown and\nrpcrdma_xprt_disconnect()
  operates on a freed ep.\n\nReference counts across a normal connection lifecycle:\n\
  \n    rpcrdma_ep_create()             kref_init     ->1\n    rpcrdma_xprt_connect()\
  \          ep_get        ->2  (before post_recvs)\n    RDMA_CM_EVENT_ESTABLISHED\
  \       ep_get        ->3\n    RDMA_CM_EVENT_DISCONNECTED      ep_put        ->2\n\
  \    rpcrdma_xprt_drain()            ep_put        ->1\n    rpcrdma_xprt_disconnect()
  tail  ep_put        ->0  (ep_destroy)\n\nThe connect-time get in rpcrdma_xprt_connect(),
  taken just before\nrpcrdma_post_recvs() \"while there are outstanding Receives,\"\
  \ is\nbalanced by rpcrdma_xprt_drain."
