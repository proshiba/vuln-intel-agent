title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/shmem_helper:
  Check VMA boundaries for PMD mappings\n\nIn the ->huge_fault handler do not install
  a PMD huge page\nmapping if the huge page exceeds the boundaries of the VMA.\n\n\
  All other ->huge_fault handlers have similar checks and the\nresulting mapping will
  trigger a VM_BUG_ON_VMA() if it ever\nreaches copy_pmd_range()."
