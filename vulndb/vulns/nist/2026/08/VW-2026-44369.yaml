title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  detect mapping-pairs LCN accumulator overflow\n\nThe NTFS mapping-pairs parser accumulates
  relative LCN deltas in a\nsigned integer.  A corrupted attribute can drive that
  addition past\nthe representable range.\n\nOne corrupt runlist shape sets the accumulated
  LCN to S64_MAX and\nthen adds a delta of 1 in the next mapping-pairs entry.\n\n\
  Signed overflow is undefined and can turn an invalid runlist into a\ndifferent set
  of physical clusters.\n\nCheck the LCN addition for overflow before storing the
  next run."
