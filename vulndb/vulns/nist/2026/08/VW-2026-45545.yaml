title: "Pandora is affected by a stored cross-site scripting vulnerability in the
  PDF download functionality. The /task-download/<task_id>/.../pdf endpoint verifies
  that the submitted file is a PDF using Pandora's content-based file-type detection,
  but previously returned the file using send_file(task.file.path) without explicitly
  specifying the MIME type or forcing it to be downloaded as an attachment. \n\n\n\
  Because Flask determines the response MIME type from the filename when a path is
  supplied, an attacker could submit a file whose content is recognized by Pandora
  as a PDF while its filename or extension causes the download endpoint to return
  it with a different, potentially active MIME type. \n\n\nA specially crafted PDF/polyglot
  file could therefore be served inline and interpreted by a victim's browser as HTML
