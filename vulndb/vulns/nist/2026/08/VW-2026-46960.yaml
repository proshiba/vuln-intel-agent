title: "Tapo C120 v1 and C200 v5\ncontain an improper authentication vulnerability
  within the login\nauthentication verification module. An attacker on the local network
  can\nexploit weaknesses in challenge parameter validation to bypass normal\nauthentication
  controls and obtain administrative session tokens. \n\n\n\n\n\n\n\n\n\nSuccessful\n\
  exploitation may allow an attacker to subsequently execute privileged\nmanagement
  actions, enable unauthorized administrative access and temporary\ndisruption of
  device services, resulting in a denial-of-service (DoS)\ncondition."
