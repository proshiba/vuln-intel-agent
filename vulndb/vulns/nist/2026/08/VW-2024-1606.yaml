title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix race condition on enabling fast-xmit\n\nfast-xmit must only be enabled
  after the sta has been uploaded to the driver,\notherwise it could end up passing
  the not-yet-uploaded sta via drv_tx calls\nto the driver, leading to potential crashes
  because of uninitialized drv_priv\ndata.\nAdd a missing sta->uploaded check and
  re-check fast xmit after inserting a sta."
