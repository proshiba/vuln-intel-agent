title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Preserve rq tracking across local DSQ dispatch\n\ndispatch_to_local_dsq() can run
  from scx_bpf_dsq_move_to_local() while\nops.dispatch() has recorded the current
  rq. Moving a task to a local DSQ\nmay switch to the source or destination rq before
  synchronously invoking\nops.dequeue() through the following path:\n\n  SCX_CALL_OP(dispatch,
  rq)\n    ops.dispatch()\n      scx_bpf_dsq_move_to_local()\n        scx_flush_dispatch_buf()\n\
  \          finish_dispatch()\n            dispatch_to_local_dsq()\n            \
  \  scx_dispatch_enqueue()\n                local_dsq_post_enq()\n              \
  \    call_task_dequeue()\n                    SCX_CALL_OP_TASK(dequeue, locked_rq,
  ...)\n\nThe nested callback saves the recorded rq and restores it on return. If\n\
  the rq tracking does not follow the lock switch, update_locked_rq() can\ntrigger
  the following lockdep assertion while restoring an rq which is\nno longer held:\n\
  \n  WARNING: kernel/sched/sch"
