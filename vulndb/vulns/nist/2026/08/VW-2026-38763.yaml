title: "Allocation of Resources Without Limits or Throttling vulnerability in ueberauth
  guardian (Guardian.Permissions module) allows a denial of service via BEAM atom-table
  exhaustion.\n\nThis vulnerability is associated with program file lib/guardian/permissions.ex
  and program routines 'Elixir.Guardian.Permissions':encode_permissions!/1, 'Elixir.Guardian.Permissions':encode_permissions_into_claims!/2,
  'Elixir.Guardian.Permissions':do_encode_permissions!/2.\n\nThe Guardian.Permissions
  mixin installs a public encode_permissions!/1 function on every module that does
  use Guardian.Permissions. For each key of the supplied map, encode_permissions!/1
  calls String.to_atom(to_string(k)) before any validation runs. The integer-value
  clause of do_encode_permissions!/2 then short-circuits straight to encoding without
  validating the key against the configured permission set, so a key with an integer
