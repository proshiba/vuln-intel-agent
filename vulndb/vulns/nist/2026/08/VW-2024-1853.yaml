title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  validate lwtstate->data before returning from skb_tunnel_info()\n\nskb_tunnel_info()
  returns pointer of lwtstate->data as ip_tunnel_info\ntype without validation. lwtstate->data
  can have various types such as\nmpls_iptunnel_encap, etc and these are not compatible.\n\
  So skb_tunnel_info() should validate before returning that pointer.\n\nSplat looks
  like:\nBUG: KASAN: slab-out-of-bounds in vxlan_get_route+0x418/0x4b0 [vxlan]\nRead
  of size 2 at addr ffff888106ec2698 by task ping/811\n\nCPU: 1 PID: 811 Comm: ping
  Not tainted 5.13.0+ #1195\nCall Trace:\n dump_stack_lvl+0x56/0x7b\n print_address_description.constprop.8.cold.13+0x13/0x2ee\n\
  \ ? vxlan_get_route+0x418/0x4b0 [vxlan]\n ? vxlan_get_route+0x418/0x4b0 [vxlan]\n\
