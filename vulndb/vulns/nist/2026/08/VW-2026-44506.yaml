title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  6lowpan: avoid untracked enable work\n\nlowpan_enable_set() allocates a temporary
  work item and schedules\ndo_enable_set() on system_wq, then returns to debugfs.
  The debugfs active\noperation has ended at that point, but the worker still executes
  module\ntext and manipulates enable_6lowpan and listen_chan.\n\nbt_6lowpan_exit()
  removes the debugfs files and immediately closes and\nputs listen_chan. It has no
  pointer to the queued work item, so it cannot\ncancel or flush it before tearing
  down the state that the worker uses.\n\nThe buggy scenario involves two paths, with
  each column showing the order\nwithin that path:\n\ndebugfs enable write       \
  \       module exit\n1. lowpan_enable_set() allocates  1. bt_6lowpan_exit() removes\n\
  \   set_enable work                   the debugfs file\n2. schedule_work() queues\
  \         2. bt_6lowpan_exit() closes\n   do_enable_set()                   and
  puts listen_chan\n3. the write operation "
