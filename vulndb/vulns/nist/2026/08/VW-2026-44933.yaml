title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: fix stack info leak in RME Digiface status\n\nsnd_rme_digiface_read_status()
  reads a four-word status block from the\ndevice into an uninitialised on-stack __le32
  buf[4] and, whenever the\nvendor control-IN transfer does not return a negative
  error, copies all\nfour words into the caller's status[].\n\nsnd_usb_ctl_msg() copies
  the full requested size back into the caller's\nbuffer regardless of how many bytes
  the data stage actually delivered:\n\n\tbuf = kmemdup(data, size, GFP_KERNEL);\n\
  \terr = usb_control_msg(dev, pipe, request, requesttype,\n\t\t\t      value, index,
  buf, size, timeout);\n\tmemcpy(data, buf, size);\n\nusb_control_msg() returns the
  transferred length on a short control-IN,\nwhich is a non-negative value, and writes
  only that many bytes.  The\nremainder of the copy back is the kmemdup()ed image
  of the caller's\nbuffer, so a device answering with a short data stage leaves the\n\
  trailing words of buf[] holding "
