title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfpga:
  dfl: add bounds check in dfh_get_param_size()\n\ndfh_get_param_size() can return
  a parameter size larger than the feature\nregion because the loop bounds check is
  evaluated before incrementing\nsize. If the EOP (End of Parameters) bit is set in
  the same iteration,\nthe inflated size is returned without re-validation against
  max.\n\nThis can cause create_feature_instance() to call memcpy_fromio() with a\n\
  size exceeding the ioremap'd region when a malicious FPGA device provides\ncrafted
  DFHv1 parameter headers.\n\nAdd a bounds check after the size increment to ensure
  the accumulated\nsize never exceeds the feature boundary."
