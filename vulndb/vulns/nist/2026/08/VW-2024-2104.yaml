title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  force a dst refcount before doing decryption\n\nAs it says in commit 3bc07321ccc2
  (\"xfrm: Force a dst refcount before\nentering the xfrm type handlers\"):\n\n\"\
  Crypto requests might return asynchronous. In this case we leave the\n rcu protected
  region, so force a refcount on the skb's destination\n entry before we enter the
  xfrm type input/output handlers.\"\n\nOn TIPC decryption path it has the same problem,
  and skb_dst_force()\nshould be called before doing decryption to avoid a possible
  crash.\n\nShuang reported this issue when this warning is triggered:\n\n  [] WARNING:
  include/net/dst.h:337 tipc_sk_rcv+0x1055/0x1ea0 [tipc]\n  [] Kdump: loaded Tainted:
  G W --------- - - 4.18.0-496.el8.x86_64+debug\n  [] Workqueue: crypto cryptd_queue_worker\n\
  \  [] RIP: 0010:tipc_sk_rcv+0x1055/0x1ea0 [tipc]\n  [] Call Trace:\n  [] tipc_sk_mcast_rcv+0x548/0xea0
  [tipc]\n  [] tipc_rcv+0xcf5/0x1060 [tipc]\n  [] tipc_aead_decrypt_done+0x215/0x2e0
  [tipc]\n "
