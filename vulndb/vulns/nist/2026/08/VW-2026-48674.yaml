title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix missing shared-key auth challenge length check\n\nThe WEP shared-key
  authentication handler uses the challenge-text\nelement's attacker-controlled length
  without checking it against the\nfixed 128-byte chg_txt buffer.\n\nIn OnAuthClient()
  the length from rtw_get_ie() - up to 255 - is used\nto perform memcpy() into the
  128-byte pmlmeinfo->chg_txt, so a\nmalicious AP sending a malformed WLAN_EID_CHALLENGE
  element can\noverflow/underfill chg_txt by up to 127 bytes. It is reachable over
  the\nair, before association, during shared-key authentication. In the case\nof
  an overflow, the driver can write out of bounds. In the case of an\nunderfill, the
  driver can echo stale buffer memory.\n\nThe challenge text is defined to be exactly
  128 octets, which is\nalready provided as the WLAN_AUTH_CHALLENGE_LEN define; require
  the\nelement to be exactly that length before use."
