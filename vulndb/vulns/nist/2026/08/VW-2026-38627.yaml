title: The Spectra Legacy  WordPress plugin before 2.20.0 does not validate or 
  escape several block style attributes before using them to build the CSS it 
  outputs on the front end, allowing users with the Contributor role and above 
  to inject arbitrary CSS into the pages that render the affected block. The 
  injected styles are served to anonymous visitors of those pages and can force 
  external resource loads, deface/redress the page, or exfiltrate data via CSS 
  attribute selectors. JavaScript execution is not possible at this role (the 
  script-tag breakout is removed by KSES), so the impact is limited to CSS 
  injection.
