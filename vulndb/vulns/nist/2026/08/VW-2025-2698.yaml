title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwl1251:
  dynamically allocate memory used for DMA\n\nWith introduction of vmap'ed stacks,
  stack parameters can no\nlonger be used for DMA and now leads to kernel panic.\n\
  \nIt happens at several places for the wl1251 (e.g. when\naccessed through SDIO)
  making it unuseable on e.g. the\nOpenPandora.\n\nWe solve this by allocating temporary
  buffers or use wl1251_read32().\n\nTested on v5.18-rc5 with OpenPandora."
