title: The Azure Key Vault secrets backend in Apache Airflow's Microsoft Azure 
  provider resolved a team-scoped Connection or Variable id through the 
  team-agnostic lookup when the team-scoped lookup missed. In a deployment 
  running multi-team mode with this backend, a caller in one team could resolve 
  a secret belonging to another team by supplying an id that spells out that 
  team's namespace, obtaining its credentials in full. No unusual configuration 
  is required beyond enabling multi-team mode and using this backend. Users are 
  advised to upgrade to apache-airflow-providers-microsoft-azure 14.1.0 or 
  later, which refuses the team-agnostic fall-through for an id that could name 
  a team namespace.
