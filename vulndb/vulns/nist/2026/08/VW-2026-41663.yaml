title: Hugging Face Accelerate through 1.14.0 contains a path traversal 
  vulnerability in load_checkpoint_in_model and load_checkpoint_and_dispatch 
  functions that fail to sanitize weight_map entries from sharded checkpoint 
  indexes. Attackers can supply relative paths with ../ sequences or absolute 
  paths to read arbitrary files, or point shard entries at named pipes to cause 
  indefinite blocking and denial of service.
