title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  use kvzalloc to allocate struct dc\n\nstruct dc has grown large over time (most
  of it the two inlined\ndc_scratch_space copies) and now sits close to the page allocator's
  4 MiB\ncontiguous allocation limit. Its actual size is not fixed by the source\n\
  alone, it also depends on the compiler and the .config, so it can easily\ncross
  4 MiB, e.g. with a newer GCC or a config change.\n\ndc_create() allocates it with
  kzalloc(). Once struct dc exceeds 4 MiB the\nrequest is rounded up to order 11 (8
  MiB), which is above MAX_PAGE_ORDER,\nso the page allocator warns and returns NULL.
  dc_create() then fails, DM\ninit fails and amdgpu probe aborts with -EINVAL:\n\n\
  \  WARNING: mm/page_alloc.c:5197 at __alloc_frozen_pages_noprof+0x2f9/0x380\n  \
  \ dc_create+0x38/0x660 [amdgpu]\n   amdgpu_dm_init+0x2d9/0x510 [amdgpu]\n   dm_hw_init+0x1b/0x90
  [amdgpu]\n   amdgpu_device_init.cold+0x150d/0x1e13 [amdgpu]\n   amdgpu_driver_load_kms+0x19/0x80
  [a"
