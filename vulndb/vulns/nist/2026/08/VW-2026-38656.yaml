title: The Theme Editor plugin for WordPress is vulnerable to Cross-Site Request
  Forgery in all versions up to, and including, 3.1. This is due to missing 
  nonce validation on the ms_update AJAX action. This makes it possible for 
  unauthenticated attackers to modify child theme CSS styles via a forged 
  request granted they can trick an administrator into performing an action such
  as clicking on a link.
