title: 'In Eclipse RDF4J, several XML parser entry points do not fully restrict XML
  External Entity (XXE) processing when parsing untrusted XML-based RDF data or query
  results, permitting DOCTYPE declarations, external entity references, and external
  DTD loading. This is due to an incomplete fix for CVE-2018-1000644: the earlier
  fix did not cover all parser entry points. The issue is resolved in RDF4J 5.3.2,
  which rejects or disables DOCTYPE declarations, external entities, and external
  DTD loading by default.'
