title: broot renders each file and directory name in its interactive tree view 
  exactly as read from the filesystem. Names are converted with a plain 
  to_string_lossy() call in src/tree_build/builder.rs and in TreeLine::unprune 
  in src/tree/tree_line.rs, and no control-character filtering exists anywhere 
  in the code, even though the doc comment on the TreeLine name field states 
  that some characters may have been stripped. Any local user who can create a 
  file can therefore place an escape sequence in its name and have it written 
  unmodified to the terminal of anyone who browses that directory, between 
  broot's own styling codes. A reported proof of concept used an OSC 52 
  clipboard-write sequence and captured the raw bytes broot wrote to its pty, 
  confirming the sequence reaches the terminal unstripped. What an injected OSC 
  or CSI sequence can then do depends on the terminal emulator in use. Browsing 
  a directory is broot's primary function and carries no expectation that the 
  content is trusted.
