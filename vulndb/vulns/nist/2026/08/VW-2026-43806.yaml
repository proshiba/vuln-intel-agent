title: Budibase before 3.40.0 fails to properly sanitize S3 object keys, 
  allowing authenticated builders to upload files with traversal sequences that 
  are preserved during export. Attackers can craft filenames containing .. 
  segments that escape the temporary directory during workspace export, writing 
  arbitrary content to any path writable by the Budibase process.
