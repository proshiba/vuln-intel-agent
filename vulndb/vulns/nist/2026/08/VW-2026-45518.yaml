title: ERPNext is a free and open source Enterprise Resource Planning tool. 
  Prior to 15.116.0 and 16.23.0, 
  erpnext/selling/report/inactive_customers/inactive_customers.py accepts an 
  unvalidated doctype filter and interpolates it into raw SQL in 
  get_sales_details and get_last_sales_amt, allowing an authenticated user to 
  extract sensitive information and manipulate database queries. This issue is 
  fixed in versions 15.116.0 and 16.23.0.
