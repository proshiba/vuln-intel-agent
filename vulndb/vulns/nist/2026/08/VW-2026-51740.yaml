title: Rybbit before 2.7.0 contains a CORS misconfiguration vulnerability that 
  allows attackers to bypass origin restrictions by reflecting any request 
  origin in Access-Control-Allow-Origin responses while credentials are enabled.
  Attackers can issue credentialed cross-origin requests from any website to 
  read analytics data, account information, and perform authenticated 
  state-changing operations as the victim user.
