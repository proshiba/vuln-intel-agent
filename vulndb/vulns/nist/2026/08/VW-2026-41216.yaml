title: "In the Linux kernel, the following vulnerability has been resolved:\n\niomap:
  fix out-of-bounds bitmap_set() with zero-length range\n\nifs_set_range_dirty() and
  ifs_set_range_uptodate() compute last_blk\nas (off + len - 1) >> i_blkbits.  When
  off is 0 and len is 0, the\nunsigned subtraction underflows to SIZE_MAX, producing
  a huge\nlast_blk and nr_blks value that causes bitmap_set() to write far\nbeyond
  the ifs->state allocation.\n\nRegarding ifs_set_range_uptodate(), it is temporarily
  safe because len\ncannot be passed in as 0. However, for ifs_set_range_dirty() this
  is\nreachable from __iomap_write_end(): when copy_folio_from_iter_atomic()\nreturns
  0 (e.g. user buffer fault) and the folio is already uptodate,\nthe guard at the
  top of __iomap_write_end() does not trigger because\n!folio_test_uptodate() is false,
  and iomap_set_range_dirty() is called\nwith copied == 0.\n\nAdd a !len guard to
  both functions before the computation, so that a\nzero-length range is a no-op."
