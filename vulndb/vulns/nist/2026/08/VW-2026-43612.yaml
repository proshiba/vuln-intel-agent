title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Fix buffer over-read in cca_cipher2protkey\n\nAdd validation of both the actual
  key buffer size and token length\nfields in all the cca_check_sec*token() functions.
  Additionally check\nin cca_gencipherkey() for possible underflow with returned key
  size.\n\nThe CCA token structures contain user-controlled len fields that\nwere
  used in operations without proper validation against both the\nactual buffer size
  and minimum token structure size. An attacker\ncould set this field larger than
  the actual buffer size, leading to\nreading beyond buffer boundaries. This may result
  in a kernel crash or\nexposure of memory via sending this as part of a request down
  to the\ncrypto card. Also an attacker could have used a very small len value\nand
  thus enforce a buffer under-run which may produce similar effects\nas a over-read.\n\
