title: A flaw was found in the multicloud-operators-subscription component of 
  Red Hat Advanced Cluster Management (RHACM). This vulnerability allows a 
  namespace-admin tenant to perform a confused-deputy attack by creating 
  Subscription Custom Resources (CRs) that leverage a highly privileged 
  ServiceAccount (SA). This enables the tenant to deploy arbitrary 
  cluster-scoped resources, leading to privilege escalation and potential 
  arbitrary code execution across the cluster.
