title: "A denial of service vulnerability exists when .NET Core or .NET Framework
  improperly handles web requests. An attacker who successfully exploited this vulnerability
  could cause a denial of service against a .NET Core or .NET Framework web application.
  The vulnerability can be exploited remotely, without authentication.\nA remote unauthenticated
  attacker could exploit this vulnerability by issuing specially crafted requests
  to the .NET Core or .NET Framework application.\nThe update addresses the vulnerability
  by correcting how the .NET Core or .NET Framework web application handles web requests."
