title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  validate DFS referral string offsets\n\nparse_dfs_referrals() validates that the
  response header and referral\narray fit in the received buffer, but each referral
  also contains string\noffsets supplied by the server.\n\nThose offsets are used
  to compute the DfsPath and NetworkAddress string\npointers without checking whether
  they still point inside the response\nbuffer. A malformed referral can therefore
  make the computed pointer\nexceed the end of the buffer. The resulting negative
  max_len is then\npassed to cifs_strndup_from_utf16(), and the non-Unicode path forwards
  it\nto kstrndup() as a size_t, allowing strnlen() to read out of bounds.\n\nValidate
  each string offset before deriving the string pointer."
