title: PasswordPusher versions v1.45.11 through v2.9.5 contain an improper 
  authorization vulnerability in the push deletion logic. The ownership check 
  compares @push.user against current_user; for an anonymously created push both
  values are nil, and Ruby evaluates nil == nil as true, so the check passes and
  the deletable_by_viewer restriction is never enforced. An attacker who knows 
  only the secret URL can permanently delete an anonymous push even when the 
  creator disabled viewer deletion and even without the passphrase. Only 
  deployments that allow anonymous pushes (the default) are affected. The issue 
  is fixed in v2.9.6.
