title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  vivid: fix compose size exceed boundary\n\nsyzkaller found a bug:\n\n BUG: unable
  to handle page fault for address: ffffc9000a3b1000\n #PF: supervisor write access
  in kernel mode\n #PF: error_code(0x0002) - not-present page\n PGD 100000067 P4D
  100000067 PUD 10015f067 PMD 1121ca067 PTE 0\n Oops: 0002 [#1] PREEMPT SMP\n CPU:
  0 PID: 23489 Comm: vivid-000-vid-c Not tainted 6.1.0-rc1+ #512\n Hardware name:
  QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.13.0-1ubuntu1.1 04/01/2014\n RIP:
  0010:memcpy_erms+0x6/0x10\n[...]\n Call Trace:\n  <TASK>\n  ? tpg_fill_plane_buffer+0x856/0x15b0\n\
  \  vivid_fillbuff+0x8ac/0x1110\n  vivid_thread_vid_cap_tick+0x361/0xc90\n  vivid_thread_vid_cap+0x21a/0x3a0\n\
  \  kthread+0x143/0x180\n  ret_from_fork+0x1f/0x30\n  </TASK>\n\nThis is because
  we forget to check boundary after adjust compose->height\nint V4L2_SEL_TGT_CROP
  case. Add v4l2_rect_map_inside() to fix this problem\nfor this case."
