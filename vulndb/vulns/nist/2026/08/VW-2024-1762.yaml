title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/net:
  fix overflow check in io_recvmsg_mshot_prep()\n\nThe \"controllen\" variable is
  type size_t (unsigned long).  Casting it\nto int could lead to an integer underflow.\n\
  \nThe check_add_overflow() function considers the type of the destination\nwhich
  is type int.  If we add two positive values and the result cannot\nfit in an integer
  then that's counted as an overflow.\n\nHowever, if we cast \"controllen\" to an
  int and it turns negative, then\nnegative values *can* fit into an int type so there
  is no overflow.\n\nGood: 100 + (unsigned long)-4 = 96  <-- overflow\n Bad: 100 +
  (int)-4 = 96 <-- no overflow\n\nI deleted the cast of the sizeof() as well.  That's
  not a bug but the\ncast is unnecessary."
