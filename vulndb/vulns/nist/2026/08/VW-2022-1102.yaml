title: A vulnerability in the TCP proxy functionality of Cisco Firepower Threat 
  Defense (FTD) Software could allow an unauthenticated, remote attacker to 
  trigger a denial of service (DoS) condition. This vulnerability is due to 
  improper handling of TCP flows. An attacker could exploit this vulnerability 
  by sending a crafted stream of TCP traffic through an affected device. A 
  successful exploit could allow the attacker to cause the device to reload, 
  resulting in a DoS condition.
