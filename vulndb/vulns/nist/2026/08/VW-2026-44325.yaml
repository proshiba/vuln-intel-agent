title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfpga:
  microchip-spi: fix zero header_size OOB read in mpf_ops_parse_header()\n\nmpf_ops_parse_header()
  reads header_size from the bitstream at\nMPF_HEADER_SIZE_OFFSET (24). When header_size
  is zero, the expression\n*(buf + header_size - 1) reads one byte before the buffer
  start.\n\nSince initial_header_size is set to 71 in mpf_ops, the fpga-mgr core\n\
  guarantees the buffer is large enough to reach MPF_HEADER_SIZE_OFFSET.\nThe only
  real gap is the zero header_size case, which cannot be\nresolved by providing a
  larger buffer, so return -EINVAL."
