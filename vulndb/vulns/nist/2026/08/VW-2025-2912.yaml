title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64/sme:
  Set new vector length before reallocating\n\nAs part of fixing the allocation of
  the buffer for SVE state when changing\nSME vector length we introduced an immediate
  reallocation of the SVE state,\nthis is also done when changing the SVE vector length
  for consistency.\nUnfortunately this reallocation is done prior to writing the new
  vector\nlength to the task struct, meaning the allocation is done with the old\n\
  vector length and can lead to memory corruption due to an undersized buffer\nbeing
  used.\n\nMove the update of the vector length before the allocation to ensure that\n\
  the new vector length is taken into account.\n\nFor some reason this isn't triggering
  any problems when running tests on\nthe arm64 fixes branch (even after repeated
  tries) but is triggering\nissues very often after merge into mainline."
