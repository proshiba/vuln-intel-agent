title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/iucv:
  fix use-after-free of a severed iucv_path\n\naf_iucv queues not-yet-received message
  notifications on iucv->message_q,\neach holding a raw pointer to the connection's
  iucv_path.  When the peer\nsevers the connection, iucv_sever_path() frees that path
  with\niucv_path_free() but leaves the notifications queued.  A later recvmsg()\n\
  drains message_q via iucv_process_message_q() and hands the stale path to\nmessage_receive()
  -- a use-after-free of the freed iucv_path.\n\nDrop the queued notifications when
  the path is severed; once the path is\ngone they can no longer be received.  This
  also frees the notifications\nleaked when a socket is closed with messages still
  queued."
