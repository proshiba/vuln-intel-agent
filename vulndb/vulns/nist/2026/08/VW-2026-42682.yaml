title: "A vulnerability in the Do Not Decrypt exclusion feature of the SSL decryption
  feature of Cisco Secure Firewall Threat Defense (FTD) Software could allow an unauthenticated,
  remote attacker to cause a denial of service (DoS) condition on an affected device.\r\
  \n\r\nThis vulnerability is due to improper memory management during the inspection
  of TLS 1.2 encrypted traffic. An attacker could exploit this vulnerability by sending
  crafted TLS 1.2 encrypted traffic through an affected device. A successful exploit
  could allow the attacker to cause a reload of an affected device.\r\nNote: This
  vulnerability only affects traffic that is encrypted by TLS 1.2. Other versions
  of TLS are not affected."
