title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-pcache:
  reject option groups without values\n\nThe pcache target parses optional arguments
  as name/value pairs.  A\ntable that advertises one optional argument and supplies
  only a\nrecognized option name, for example \"cache_mode\", reaches\nparse_cache_opts()
  with argc == 1.  The parser consumes the name,\ndecrements argc to zero, then calls
  dm_shift_arg() again for the value.\ndm_shift_arg() returns NULL when no arguments
  remain, and the following\nstrcmp() dereferences that NULL pointer.\n\nCheck that
  each recognized option has a value before consuming it.  This\nkeeps valid \"cache_mode
  writeback\" and \"data_crc true/false\" tables\nunchanged while making malformed
  tables fail during target construction\nwith a precise missing-value error."
