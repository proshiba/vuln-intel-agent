title: SiYuan versions before v3.7.4 contain an arbitrary file deletion 
  vulnerability in the /api/search/removeTemplate endpoint that accepts an 
  unvalidated path parameter passed directly to os.RemoveAll. Authenticated 
  admin attackers can supply absolute filesystem paths to recursively delete any
  file or directory the kernel process has permission to remove, anywhere on the
  host filesystem.
