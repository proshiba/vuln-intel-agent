title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrbd:
  reject data replies with an out-of-range payload size\n\nrecv_dless_read() receives
  a P_DATA_REPLY from a peer into the bio of an\noutstanding read request. The peer-supplied
  payload length reaches it as\nthe signed int data_size, and two peer-controlled
  inputs can make it\nnegative. With a negotiated data-integrity-alg the digest length
  is\nsubtracted first, so a reply whose payload is smaller than the digest\nunderflows
  data_size. With no integrity algorithm (the default) data_size\nis assigned from
  the unsigned h95/h100 wire length and drbdd() never\nbounds it for a payload-carrying
  command, so a length above INT_MAX casts\nit negative; this path needs no non-default
  feature. The bio receive loop\nthen computes expect = min_t(int, data_size, bv_len),
  which is negative,\nand drbd_recv_all_warn(mapped, expect) receives with a size_t
  of SIZE_MAX\ninto the first mapped page.\n\nThe sibling receive path read_in_block()
  is not af"
