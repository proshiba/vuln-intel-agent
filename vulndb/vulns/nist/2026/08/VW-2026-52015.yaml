title: A security flaw has been discovered in Open5GS up to 2.7.7. Impacted is 
  the function amf_namf_comm_handle_n1_n2_message_transfer of the file 
  src/amf/namf-handler.c of the component N1-N2 Message Handler. Performing a 
  manipulation of the argument 
  N1N2MessageTransferReqData.n2InfoContainer.smInfo.n2InfoContent.ngapIeType 
  results in denial of service. The attack may be initiated remotely. The 
  exploit has been released to the public and may be used for attacks. Upgrading
  to version 2.8.0 is recommended to address this issue. The patch is named 
  abf8a836564b966b5141110fc25ed413c4f17522. It is advisable to upgrade the 
  affected component.
