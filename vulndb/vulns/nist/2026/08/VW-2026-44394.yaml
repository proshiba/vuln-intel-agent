title: "In the Linux kernel, the following vulnerability has been resolved:\n\njbd2:
  fix integer underflow in jbd2_journal_initialize_fast_commit()\n\njbd2_journal_initialize_fast_commit()
  validates journal capacity by\nchecking (journal->j_last - num_fc_blks < JBD2_MIN_JOURNAL_BLOCKS).\n\
  Both j_last and num_fc_blks are unsigned, so when num_fc_blks exceeds\nj_last the
  subtraction wraps to a large value, bypassing the bounds\ncheck.\n\nThe resulting
  underflow corrupts j_last, j_fc_first, and j_free,\nleading to journal abort.\n\n\
  Fix by checking num_fc_blks against j_last before the subtraction,\nreturning -EFSCORRUPTED."
