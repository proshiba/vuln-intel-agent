title: A flaw was found in the maas-api and maas-controller ServiceAccounts 
  within Red Hat OpenShift AI. These ServiceAccounts are granted cluster-wide 
  permissions that exceed their operational requirements. An attacker who 
  compromises the identity of these ServiceAccounts, either through a remote 
  code execution vulnerability or by creating a malicious pod in the same 
  namespace, could exploit these excessive permissions. This could lead to full 
  cluster administrator privileges through the creation of new 
  ClusterRoleBindings or the disclosure of sensitive information by accessing 
  all secrets across the cluster.
