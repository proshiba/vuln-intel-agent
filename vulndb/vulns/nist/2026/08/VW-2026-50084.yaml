title: Kimai before 2.57.0 contains an improper authorization vulnerability in 
  the favorite timesheet add and remove endpoints that allows authenticated 
  users to manipulate other users' bookmarks. Attackers can add or remove 
  timesheet entries from another user's favorite list by referencing their 
  timesheet identifier, enabling cross-user business-state tampering without 
  administrative privileges.
