title: Dolibarr before 24.0.0 contains an improper authorization vulnerability 
  in the expense report REST API update endpoint that allows authenticated 
  attackers with expense-creation rights to bypass the approval workflow by 
  directly setting approval status and approver identity fields. Attackers can 
  manipulate workflow state fields through the REST API to advance expense 
  reports to approved or closed status without possessing the dedicated approval
  right, while also creating forensic inconsistencies in audit records due to 
  missing approval timestamps.
