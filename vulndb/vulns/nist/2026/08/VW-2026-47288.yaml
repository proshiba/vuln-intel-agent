title: "A flaw was found in volsync-addon-controller. This vulnerability allows an
  attacker to inject malicious YAML (Yet Another Markup Language) code into the OpenShift
  Lifecycle Manager (OLM) Subscription resource. This is due to improper escaping
  of annotation values when they are rendered into YAML. Successful exploitation could
  lead to unauthorized modification or control over OLM Subscription configurations,
  potentially impacting software management within the cluster. This issue primarily
  affects systems where the 'volsync-addon-deploy-type: olm' annotation is explicitly
  enabled."
