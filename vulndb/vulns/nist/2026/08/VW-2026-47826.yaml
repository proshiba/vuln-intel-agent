title: A flaw was found in WildFly Elytron. Password hashing and verification 
  normalize input with Unicode NFKC, which can collapse fullwidth characters to 
  ASCII equivalents. A remote attacker can more easily guess affected passwords 
  by using an ASCII-only dictionary against accounts whose passwords were 
  intended to include those non-ASCII characters, leading to unauthorized 
  access.
