title: 'A weakness has been identified in Webkul Bagisto up to 2.4.4. This affects
  an unknown part of the file /admin/customers/search of the component Customer Search.
  Executing a manipulation of the argument Query can lead to information disclosure.
  The attack may be launched remotely. The exploit has been made available to the
  public and could be used for attacks. The vendor confirms: "The reported issues
  were already identified through our internal security assessment process prior to
  this notification and are being handled through our established internal security
  and development lifecycle. Some of these items have already been addressed, while
  the remaining items are planned for resolution in upcoming product releases."'
