title: 'A vulnerability was detected in GL.iNet A1300, AX1800, AXT1800, MT2500, MT3000,
  MT6000, X3000 and XE3000 4.8.x. This issue affects some unknown processing of the
  file /usr/bin/gl_nas_sys of the component NAS Command Service. The manipulation
  results in os command injection. The attack may be launched remotely. Upgrading
  to version 4.9.0 is capable of addressing this issue. It is suggested to upgrade
  the affected component. The vendor explains: "After our investigation, we have confirmed
  that the vulnerability described (...) does indeed exist."'
