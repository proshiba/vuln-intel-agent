title: A privilege escalation flaw was found in FreeIPA. The uniqueness 
  constraint enforced on Kerberos principal name attributes in the 389-ds 
  directory server does not properly account for equivalent representations of 
  the same principal name, allowing a user with sufficient LDAP write privileges
  to create a service principal that impersonates an existing privileged one. 
  This can lead to unauthorized acquisition of Kerberos service tickets for 
  sensitive services, potentially resulting in full domain compromise.
