title: 'Vulnerability in the Oracle HTTP Server, Oracle Weblogic Server Proxy Plug-in
  product of Oracle Fusion Middleware (component: Weblogic Server Proxy Plug-in for
  Apache HTTP Server, Weblogic Server Proxy Plug-in for IIS).  Supported versions
  that are affected are 12.2.1.4.0, 14.1.1.0.0 and  14.1.2.0.0. Easily exploitable
  vulnerability allows unauthenticated attacker with network access via HTTP to compromise
  Oracle HTTP Server, Oracle Weblogic Server Proxy Plug-in.  While the vulnerability
  is in Oracle HTTP Server, Oracle Weblogic Server Proxy Plug-in, attacks may significantly
  impact additional products (scope change).  Successful attacks of this vulnerability
  can result in  unauthorized creation, deletion or modification access to critical
  data or all Oracle HTTP Server, Oracle Weblogic Server Proxy Plug-in accessible
  data as well as  unauthorized access to critical data or complete access to all
  Oracle HTTP Server, Oracle Weblogic Server Proxy Plug-in accessible data. Note:
