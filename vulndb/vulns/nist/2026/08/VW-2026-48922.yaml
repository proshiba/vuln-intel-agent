title: fast-uri is a URI parser for Node.js. During parsing it runs a legacy 
  decoding pass over the scheme component and never re-escapes the result, and 
  serialization writes the scheme back out verbatim, unlike the host component 
  which is re-escaped. As a result an input whose scheme carries percent-encoded
  slashes parses as a scheme with no authority, so the parsed host and error are
  both undefined, yet resolving or normalizing that same input emits a 
  network-path reference whose authority is attacker-chosen and re-parses to 
  that host. An application that allowlists on the parsed host, or treats a 
  reference with no authority as safe to resolve against its base, gets the 
  opposite of what it checked, giving an off-site redirect, server-side request 
  forgery, or address-policy bypass. The legacy decoder also expands 
  non-standard escape forms, widening the issue past upstream filters, and 
