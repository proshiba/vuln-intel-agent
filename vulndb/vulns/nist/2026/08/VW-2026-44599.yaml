title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_ct: fix nf_connlabels leak on two error paths\n\ntcf_ct_fill_params() calls
  nf_connlabels_get() (setting put_labels) when\nTCA_CT_LABELS is present, but two
  later error sites use a bare return\ninstead of \"goto err\", skipping the err:
  nf_connlabels_put() cleanup.\nThey also precede the \"p->put_labels = put_labels\"\
  \ assignment, so the\ntcf_ct_params_free() fallback does not release the count either.
  Each\nfailed RTM_NEWACTION on these paths leaks one nf_connlabels reference:\nnet->ct.labels_used
  is incremented and never released. The action is\nreachable with CAP_NET_ADMIN over
  the netns, i.e. from an unprivileged\nuser namespace on default-userns kernels.\n\
  \nImpact: an unprivileged user with CAP_NET_ADMIN over a network namespace\n(e.g.
  via user namespaces) leaks one nf_connlabels reference per failed\nRTM_NEWACTION
  on the two error paths; net->ct.labels_used is never\nreleased.\n\nThe err: label
  is safe to reach from bo"
