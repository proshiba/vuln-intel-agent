title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvdimm/btt:
  Handle preemption in BTT lane acquisition\n\nBTT lanes serialize access to per-lane
  metadata and workspace state\nduring BTT I/O. The btt-check unit test reports data
  mismatches during\nBTT writes due to a race in lane acquisition that can lead to
  silent\ndata corruption.\n\nThe existing lane model uses a spinlock together with
  a per-CPU\nrecursion count. That recursion model stopped being valid after BTT\n\
  lanes became preemptible: another task can run on the same CPU,\nobserve a non-zero
  recursion count, bypass locking, and use the same\nlane concurrently.\n\nBTT lanes
  are also held across arena_write_bytes() calls. That path\nreaches nsio_rw_bytes(),
  which flushes writes with nvdimm_flush().\nSome provider flush callbacks can sleep,
  making a spinlock the wrong\nprimitive for the lane lifetime.\n\nReplace the spinlock-based
  recursion model with a dynamically\nallocated per-lane mutex array and take the
  lane lock\nuncondition"
