  method based on the request timestamp. This allows a remote attacker to accurately
  guess or brute-force the generated filename within a short time window. An attacker
  can successfully locate and access uploaded files, which can be used to facilitate
  further attacks.\n\n\n\n\nApply patch from vendor  https://vsdesk.ru/ . Versions
