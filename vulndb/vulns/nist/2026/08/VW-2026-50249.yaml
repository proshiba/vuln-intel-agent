title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  tas2562: Validate values for volume writes\n\ntas2562_volume_control_put() does
  not do any validation of the control\nvalue written by userspace, it uses it to
  look up a value in a fixed\nsize array which can easily be overflowed and then writes
  whatever value\nit gets back to the device.  Add validation that we are loading
  a value\nwe have in the array."
