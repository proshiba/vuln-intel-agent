title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/bnxt_re:
  Fix a bug while setting up Level-2 PBL pages\n\nAvoid memory corruption while setting
  up Level-2 PBL pages for the non MR\nresources when num_pages > 256K.\n\nThere will
  be a single PDE page address (contiguous pages in the case of >\nPAGE_SIZE), but,
  current logic assumes multiple pages, leading to invalid\nmemory access after 256K
  PBL entries in the PDE."
