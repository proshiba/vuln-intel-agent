title: "The system accepts authentication requests without sufficient validation to
  enforce tenant isolation when using Email OTP, SMS OTP, or Magic Link as first-factor
  authenticators. This failure to adequately separate user data between tenants can
  lead to the exposure of personally identifiable information.\n\nSuccessful exploitation
  allows an attacker to disclose personally identifiable information of users in different
  tenants, resulting in privacy violations and potential regulatory non-compliance.
  This may include unauthorized access to user details such as mobile numbers."
