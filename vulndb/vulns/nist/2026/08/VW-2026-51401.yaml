title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrapidio/tsi721:
  prevent a bad dereference in tsi721_db_dpc()\n\nWith a list_for_each() loop, if
  we don't find the item we are looking for\nin the list, then the loop exits with
  the iterator, which is \"dbell\" in\nthis loop, pointing to invalid memory.\n\n\
  This code uses the \"found\" variable to determine if we have found the\ndoorbell
  we are looking for or not.  However, the problem that the \"found\"\nvariable needs
  to be set to false at the start of each iteration,\notherwise after the first correct
  doorbell, then everything is marked as\nfound.\n\nReset the \"found\" to false at
  the start of the iteration and move the\nvariable inside the loop."
