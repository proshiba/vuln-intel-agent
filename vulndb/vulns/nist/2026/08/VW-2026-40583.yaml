title: "Memory Leak to an Unauthorized Actor vulnerability in Tobit Laboratories AG
  TeamDavid's Webbox allows reading of sensitive information. When accessing the URL
  “/.well-known/mta-sts.”, the application responds\n with memory. By repeatedly \n\
  requesting this endpoint, an attacker can access sensitive \ninformation, including
  user passwords. Exploitation does not require \nauthentication. This issue affects
  TeamDavid through Rollout 524."
