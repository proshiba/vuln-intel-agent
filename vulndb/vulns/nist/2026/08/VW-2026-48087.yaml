title: OTRS Community Edition contains an authenticated OS command injection 
  vulnerability in the PGP encryption module that allows administrators to 
  execute arbitrary operating-system commands by supplying crafted values for 
  the PGP binary path and command options. Administrator-supplied configuration 
  values are concatenated without sanitization into a shell command, enabling 
  arbitrary command execution as the web server process user during normal 
  ticket operations after the malicious configuration is deployed.
