title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip6_tunnel:
  clear skb2->cb[] in ip6ip6_err()\n\nip6ip6_err() clones an outer IPv6 ICMP error
  skb, pulls it to the\nquoted inner IPv6 packet, and then passes the clone to icmpv6_send().\n\
  The clone still carries the outer packet's inet6_skb_parm in skb->cb.\n\nIf the
  outer packet had a Home Address Option, IP6CB(skb2)->dsthao\nremains non-zero after
  skb_pull(). icmpv6_send() later calls\nmip6_addr_swap(), which uses that stale dsthao
  offset against the quoted\ninner packet. A malformed inner destination-options header
  can then make\nthe HAO lookup and address swap run past the end of the quoted packet\n\
  and corrupt skb_shared_info.\n\nClear skb2->cb[] before pulling the quoted inner
  IPv6 packet so the\nreply path does not reuse metadata left by the outer IPv6 stack."
