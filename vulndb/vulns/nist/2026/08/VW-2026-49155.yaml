title: The guard checker in Rocq Prover does not recheck the recursive tree 
  representation of an inductive type parameter after that parameter has been 
  changed by transport. A fixpoint may apply a rewrite along an equality between
  types to its recursive argument, which the guard checker accepts because the 
  inductive type is preserved, while the recursive tree recorded for the 
  parameter is altered. A second fixpoint that calls the first inherits the 
  altered recursive tree without verification, so a call that is not 
  structurally decreasing is accepted as terminating. The resulting 
  non-terminating definition proves that a natural number equals its own 
  successor and therefore False, from which any proposition follows. The 
  demonstration uses two axioms that follow from univalence and are consistent 
  with the calculus of inductive constructions, so the contradiction comes from 
  the guard check rather than from the assumptions. A fix is proposed but not 
  merged.
