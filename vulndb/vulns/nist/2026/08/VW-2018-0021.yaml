title: 'A vulnerability in the Secure Sockets Layer (SSL) Virtual Private Network
  (VPN) Client Certificate Authentication feature for Cisco Adaptive Security Appliance
  (ASA) could allow an unauthenticated, remote attacker to establish an SSL VPN connection
  and bypass certain SSL certificate verification steps. The vulnerability is due
  to incorrect verification of the SSL Client Certificate. An attacker could exploit
  this vulnerability by connecting to the ASA VPN without a proper private key and
  certificate pair. A successful exploit could allow the attacker to establish an
  SSL VPN connection to the ASA when the connection should have been rejected. This
  vulnerability affects Cisco Adaptive Security Appliance (ASA) and Firepower Threat
  Defense (FTD) Software that is running on the following Cisco products: 3000 Series
  Industrial Security Appliances (ISA), ASA 5500 Series Adaptive Security Appliances,
  ASA 5500-X Series Next-Generation Firewalls, ASA Services Module for Cisco Catalyst
  6500 Serie'
