title: A flaw was found in the lighthouse component of Red Hat Advanced Cluster 
  Management for Kubernetes. This vulnerability stems from insufficient 
  validation of advertised IP addresses within EndpointSlice objects. A 
  compromised spoke cluster can exploit this by creating EndpointSlices with 
  attacker-controlled IP addresses, causing other clusters' lighthouse DNS to 
  redirect legitimate service traffic to malicious endpoints. This enables a 
  remote attacker to conduct transparent Man-in-the-Middle (MITM) attacks on 
  cross-cluster service communications, potentially leading to unauthorized 
  information disclosure and data manipulation.
