title: "Incorrect resolving of namespaces in composite databases in Neo4j Enterprise
  edition prior to versions 2026.02 and 5.26.22 can lead to the following scenario: \n\
  an admin that intends to give a user an access to a remote database constituent
  \"namespace.name\" will inadvertently grant access to any local database or remote
  alias called \"name\". If such database or alias doesn't exist when the command
  is run, the privileges will apply if it's created in the future."
