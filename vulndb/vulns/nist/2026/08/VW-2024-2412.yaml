title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfs:
  fix race between evice_inodes() and find_inode()&iput()\n\nHi, all\n\nRecently I
  noticed a bug[1] in btrfs, after digged it into\nand I believe it'a race in vfs.\n\
  \nLet's assume there's a inode (ie ino 261) with i_count 1 is\ncalled by iput(),
  and there's a concurrent thread calling\ngeneric_shutdown_super().\n\ncpu0:    \
  \                          cpu1:\niput() // i_count is 1\n  ->spin_lock(inode)\n\
  \  ->dec i_count to 0\n  ->iput_final()                    generic_shutdown_super()\n\
  \    ->__inode_add_lru()               ->evict_inodes()\n      // cause some reason[2]\
  \           ->if (atomic_read(inode->i_count)) continue;\n      // return before\
  \                  // inode 261 passed the above check\n      // list_lru_add_obj()\
  \             // and then schedule out\n   ->spin_unlock()\n// note here: the inode
  261\n// was still at sb list and hash list,\n// and I_FREEING|I_WILL_FREE was not
  been set\n\nbtrfs_iget()\n  // after some function call"
