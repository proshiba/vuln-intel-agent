title: "The SOCK_STREAM receive path in the unix socket implementation failed to fully
  detach control messages from the socket buffer before processing them.  Some error
  paths would free those messages, leaving freed data mbufs in the receive socket
  buffer.\n\nAn unprivileged local user can exploit this use-after-free to escalate
  privileges."
