title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: mtk_eth_soc: pass eth to mtk_handle_irq_rx in poll_controller\n\nmtk_handle_irq_rx
  expects a struct mtk_eth * (matching the request_irq\ncookie), but mtk_poll_controller
  incorrectly passed the net_device *.\nCalling ndo_poll_controller with CONFIG_NET_POLL_CONTROLLER
  enabled\nwould then crash."
