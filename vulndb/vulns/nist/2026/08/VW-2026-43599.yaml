title: rsync before 3.5.0 contains a symlink race condition vulnerability that 
  allows local attackers to cause rsync to apply arbitrary ACLs or extended 
  attributes to unintended files by substituting a symlink at a predictable 
  destination path between the file write and the subsequent acl_set_file() or 
  lsetxattr() call. Attackers can exploit this timing window to redirect ACL and
  xattr application through a crafted symlink to files outside the intended 
  destination tree, potentially granting elevated permissions and enabling local
  privilege escalation.
