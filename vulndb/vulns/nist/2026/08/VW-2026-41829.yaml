title: "The USB DFU class implementation in Zephyr's new (experimental) device_next
  USB device stack contains a NULL pointer dereference in handle_download() (subsys/usb/device_next/class/usbd_dfu.c).
  The handler computes MIN(setup->wLength, buf->len) and passes buf->data to the image
  write callback without checking that the buf net_buf pointer is non-NULL.\n\nThe
  handler is reached over the USB control endpoint, driven by the USB host. For a
  DFU_DNLOAD (download) request with no Data OUT stage — notably the zero-length terminating
  download that the DFU protocol uses to end a firmware transfer — the USB core invokes
  the class handler with a NULL buffer. After the device has been advanced to the
  DFU_DNLOAD_IDLE state (by sending one valid download block and a GET_STATUS), a
  zero-length DFU_DNLOAD reaches handle_download() with buf == NULL, dereferencing
  it.\n\nThe result is a NULL+offset read that triggers a fatal CPU fault, i.e. a
  denial of service (device crash/reset). The attacker is whatever co"
