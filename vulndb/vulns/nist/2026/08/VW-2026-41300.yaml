title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  cedrus: skip invalid H.264 reference list entries\n\nCedrus consumes H.264 ref_pic_list0/ref_pic_list1
  entries from the\nstateless slice control and later uses their indices to look up\n\
  decode->dpb[] in _cedrus_write_ref_list().\n\nRejecting such controls in cedrus_try_ctrl()
  would break existing\nuserspace, since stateless H.264 reference lists may legitimately
  carry\nout-of-range indices for missing references. Instead, guard the actual\n\
  DPB lookup in Cedrus and skip entries whose indices do not fit the fixed\nV4L2_H264_NUM_DPB_ENTRIES
  array.\n\nThis keeps the fix local to the driver use site and avoids out-of-bounds\n\
  reads from malformed or unsupported reference list entries."
