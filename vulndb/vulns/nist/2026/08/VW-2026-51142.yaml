title: "Spring for GraphQL's Spring Data pagination support resolves arguments of
  a scrollable query and forwards the client-supplied values to the underlying repository.
  An attacker can forge a malicious query for a Connection field that can exhaust
  application memory or place significant, prolonged load on the underlying datastore,
  resulting in a Denial of Service.\nSpring for GraphQL 2.0.0 - 2.0.4\nSpring for
