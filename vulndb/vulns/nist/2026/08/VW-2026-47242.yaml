title: Wazuh is a free and open source platform used for threat prevention, 
  detection, and response. From 4.0.0 until 4.14.5, Wazuh Manager allows a 
  low-privilege read-only API user with manager:read permission to retrieve the 
  cluster key from the element in ossec.conf through GET 
  /manager/configuration?raw=true. An attacker with network access to TCP port 
  1516 can use the disclosed Fernet key to impersonate a cluster worker and 
  submit distributed API requests containing attacker-controlled 
  rbac_permissions with rbac_mode set to black. Because the master trusts the 
  worker-supplied authorization context, the attacker can create users, assign 
  administrator roles, access credentials and API tokens, modify configuration, 
  and execute actions across agents. This issue is fixed in version 4.14.5.
