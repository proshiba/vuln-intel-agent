title: The Shared Files  WordPress plugin before 1.7.67, shared-files-pro 
  WordPress plugin before 1.7.68 do not properly sanitize a file path taken from
  a frontend file submission and their single-pass traversal filter is 
  bypassable, allowing unauthenticated users to store a path that points outside
  the uploads directory. When the corresponding file entry is later permanently 
  deleted, an arbitrary file on the server (such as wp-config.php) is deleted, 
  leading to denial of service and potential site takeover.
