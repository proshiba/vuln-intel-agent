title: The DynamicKit for Elementor WordPress plugin before 1.0.3 does not 
  validate the host of a user-supplied URL used as the base of the 
  password-reset link it emails, allowing unauthenticated attackers to send a 
  target user a legitimately-formatted reset email whose link points to an 
  attacker-controlled host and carries a valid reset key, leading to account 
  takeover when the victim clicks it.
