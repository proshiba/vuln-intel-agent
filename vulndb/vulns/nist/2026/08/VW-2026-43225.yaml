title: A link following vulnerability in LXD allows an attacker to achieve root 
  command execution on the host system. During the import or unpacking of 
  crafted image or backup archives, LXD fails to properly validate and confine 
  the backup.yaml file when it exists as a symbolic link. An attacker can 
  exploit this flaw by providing a malicious archive with a symlinked 
  backup.yaml file, causing LXD to process unconfined configuration metadata and
  execute arbitrary commands with root privileges.
