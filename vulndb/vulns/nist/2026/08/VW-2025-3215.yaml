title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/fbdev-generic:
  prohibit potential out-of-bounds access\n\nThe fbdev test of IGT may write after
  EOF, which lead to out-of-bound\naccess for drm drivers with fbdev-generic. For
  example, run fbdev test\non a x86+ast2400 platform, with 1680x1050 resolution, will
  cause the\nlinux kernel hang with the following call trace:\n\n  Oops: 0000 [#1]
  PREEMPT SMP PTI\n  [IGT] fbdev: starting subtest eof\n  Workqueue: events drm_fb_helper_damage_work
  [drm_kms_helper]\n  [IGT] fbdev: starting subtest nullptr\n\n  RIP: 0010:memcpy_erms+0xa/0x20\n\
  \  RSP: 0018:ffffa17d40167d98 EFLAGS: 00010246\n  RAX: ffffa17d4eb7fa80 RBX: ffffa17d40e0aa80
  RCX: 00000000000014c0\n  RDX: 0000000000001a40 RSI: ffffa17d40e0b000 RDI: ffffa17d4eb80000\n\
  \  RBP: ffffa17d40167e20 R08: 0000000000000000 R09: ffff89522ecff8c0\n  R10: ffffa17d4e4c5000
  R11: 0000000000000000 R12: ffffa17d4eb7fa80\n  R13: 0000000000001a40 R14: 000000000000041a
  R15: ffffa17d40167e30\n  FS:  00000000000"
