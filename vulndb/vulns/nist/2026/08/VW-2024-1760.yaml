title: "In the Linux kernel, the following vulnerability has been resolved:\n\nswiotlb:
  Fix double-allocation of slots due to broken alignment handling\n\nCommit bbb73a103fbb
  (\"swiotlb: fix a braino in the alignment check fix\"),\nwhich was a fix for commit
  0eee5ae10256 (\"swiotlb: fix slot alignment\nchecks\"), causes a functional regression
  with vsock in a virtual machine\nusing bouncing via a restricted DMA SWIOTLB pool.\n\
  \nWhen virtio allocates the virtqueues for the vsock device using\ndma_alloc_coherent(),
  the SWIOTLB search can return page-unaligned\nallocations if 'area->index' was left
  unaligned by a previous allocation\nfrom the buffer:\n\n # Final address in brackets
  is the SWIOTLB address returned to the caller\n | virtio-pci 0000:00:07.0: orig_addr
  0x0 alloc_size 0x2000, iotlb_align_mask 0x800 stride 0x2: got slot 1645-1649/7168
  (0x98326800)\n | virtio-pci 0000:00:07.0: orig_addr 0x0 alloc_size 0x2000, iotlb_align_mask
  0x800 stride 0x2: got slot 1649-1653/7168 (0x98328800)\n | virtio-pci 0000:00:07.0"
