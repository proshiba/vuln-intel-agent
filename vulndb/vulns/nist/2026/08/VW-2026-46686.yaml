title: 'Vulnerability in the Siebel CRM Integration product of Oracle Siebel CRM (component:
  Open Integration).  Supported versions that are affected are 25.12-26.6. Easily
  exploitable vulnerability allows low privileged attacker with network access via
  HTTP to compromise Siebel CRM Integration.  While the vulnerability is in Siebel
  CRM Integration, attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in  unauthorized access to critical data
  or complete access to all Siebel CRM Integration accessible data as well as  unauthorized
  update, insert or delete access to some of Siebel CRM Integration accessible data.
  CVSS 3.1 Base Score 8.5 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N).'
