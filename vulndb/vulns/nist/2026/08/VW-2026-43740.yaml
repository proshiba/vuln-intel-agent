title: The native inference process that Elasticsearch uses to evaluate uploaded
  machine learning models accepts a model operation that computes a memory 
  address from an offset supplied inside the model, without validating that the 
  offset stays within the bounds of the underlying storage. A user with the 
  privileges required to upload and deploy a trained model can craft a model 
  that reads and writes memory outside the intended allocation. The result is 
  heap corruption that crashes the inference process, and, with sufficient 
  control over the heap layout, could allow arbitrary code execution in the 
  context of that process.
