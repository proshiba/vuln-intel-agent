title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  improve size validations for received domain records\n\nThe function tipc_mon_rcv()
  allows a node to receive and process\ndomain_record structs from peer nodes to track
  their views of the\nnetwork topology.\n\nThis patch verifies that the number of
  members in a received domain\nrecord does not exceed the limit defined by MAX_MON_DOMAIN,
  something\nthat may otherwise lead to a stack overflow.\n\ntipc_mon_rcv() is called
  from the function tipc_link_proto_rcv(), where\nwe are reading a 32 bit message
  data length field into a uint16.  To\navert any risk of bit overflow, we add an
  extra sanity check for this in\nthat function.  We cannot see that happen with the
  current code, but\nfuture designers being unaware of this risk, may introduce it
  by\nallowing delivery of very large (> 64k) sk buffers from the bearer\nlayer. \
  \ This potential problem was identified by Eric Dumazet.\n\nThis fixes CVE-2022-0435"
