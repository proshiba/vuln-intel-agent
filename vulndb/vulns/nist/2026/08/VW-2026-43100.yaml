title: Semaphore UI is a web interface for managing DevOps tools. Prior to 
  2.18.21, the /api/users/{id}/password endpoint accepts a cross-site request 
  using the authenticated user's semaphore session cookie without CSRF 
  protection or current-password confirmation, allowing an unauthenticated 
  attacker to change an administrator's or another user's password after user 
  interaction. This issue is fixed in version 2.18.21.
