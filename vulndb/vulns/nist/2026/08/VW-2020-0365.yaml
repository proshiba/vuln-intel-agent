title: "An elevation of privilege vulnerability exists when Microsoft Edge does not
  properly enforce cross-domain policies, which could allow an attacker to access
  information from one domain and inject it into another domain.\nIn a web-based attack
  scenario, an attacker could host a website that is used to attempt to exploit the
  vulnerability. In addition, compromised websites and websites that accept or host
  user-provided content could contain specially crafted content that could exploit
  the vulnerability. However, in all cases an attacker would have no way to force
  users to view the attacker-controlled content. Instead, an attacker would have to
  convince users to take action. For example, an attacker could trick users into clicking
  a link that takes them to the attacker's site. An attacker who successfully exploited
  this vulnerability could elevate privileges in affected versions of Microsoft Edge.\n\
