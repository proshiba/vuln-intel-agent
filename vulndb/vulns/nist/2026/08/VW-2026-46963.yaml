  known as CVE-2026-21582 was introduced in version 7.2.1 of Crowd Data Center.\r\n\
  \r\nThis BASM (Broken Authentication & Session Management) vulnerability, with a
  CVSS Score of 8.8, allows an unauthenticated attacker to perform actions as another
  user.\r\n\t\r\n\tAtlassian recommends that Crowd Data Center customers upgrade to
  latest version, if you are unable to do so, upgrade your instance to one of the
