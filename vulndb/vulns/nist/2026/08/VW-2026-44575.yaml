title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sungem: fix probe error cleanup\n\ngem_init_one() calls gem_remove_one() when register_netdev()
  fails.\ngem_remove_one() unregisters and frees resources owned by the net_device,\n\
  including the DMA block, MMIO mapping, PCI regions, and the net_device\nitself.
  gem_init_one() then falls through to its own cleanup labels and\nfrees the same
  resources again.\n\nKeep the register_netdev() error path in gem_init_one(): clear
  drvdata so\nPM/remove paths do not see a half-registered device, remove the NAPI\n\
  instance added during probe, and let the existing cleanup labels release\nthe resources
  once.\n\nThe issue was found by a local static-analysis checker for probe error\n\
  paths. The reported path was manually inspected before sending this fix.\n\nCompile-tested
  with CONFIG_SUNGEM=y. Runtime testing was not performed\nbecause no sungem hardware
  is available."
