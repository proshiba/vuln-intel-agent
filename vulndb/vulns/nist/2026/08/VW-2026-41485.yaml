title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: cancel sched scan results work on unregister\n\ncfg80211_sched_scan_results()
  can queue rdev->sched_scan_res_wk from a\ndriver result notification while a scheduled
  scan request is present. The\nwork callback recovers the containing cfg80211_registered_device
  and then\nlocks the wiphy and walks the scheduled-scan request list.\n\nwiphy_unregister()
  already makes the wiphy unreachable and drains rdev work\nitems before cfg80211_dev_free()
  can release the object, but it does not\ndrain sched_scan_res_wk. A queued or running
  result work item can therefore\ncross the unregister/free boundary and access freed
  rdev state.\n\nThe buggy scenario involves two paths, with each column showing the
  order\nwithin that path:\n\nscheduled-scan result path:        unregister/free path:\n\
  1. cfg80211_sched_scan_results()   1. interface teardown stops and\n   queues rdev->sched_scan_res_wk.\
  \    removes the scheduled scan request.\n2. cfg802"
