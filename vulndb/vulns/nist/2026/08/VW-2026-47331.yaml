title: Snipe-IT is an IT asset/license management system. Prior to 8.6.2, a 
  stored manufacturer or supplier name passed as the table component $name 
  becomes data-selected-count-id in 
  resources/views/partials/bootstrap-table.blade.php. Client-side code reads the
  browser-decoded countId, uses it as a selector, concatenates 
  countId.substring(1) into an HTML string, and passes the string to jQuery 
  .after(). A crafted name can therefore execute JavaScript when an 
  authenticated user views the manufacturer detail page or supplier detail page,
  potentially exposing data or actions available to that session. This issue is 
  fixed in version 8.6.2.
