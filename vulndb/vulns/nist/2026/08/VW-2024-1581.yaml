title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  stmmac: protect updates of 64-bit statistics counters\n\nAs explained by a comment
  in <linux/u64_stats_sync.h>, write side of struct\nu64_stats_sync must ensure mutual
  exclusion, or one seqcount update could\nbe lost on 32-bit platforms, thus blocking
  readers forever. Such lockups\nhave been observed in real world after stmmac_xmit()
  on one CPU raced with\nstmmac_napi_poll_tx() on another CPU.\n\nTo fix the issue
  without introducing a new lock, split the statics into\nthree parts:\n\n1. fields
  updated only under the tx queue lock,\n2. fields updated only during NAPI poll,\n\
  3. fields updated only from interrupt context,\n\nUpdates to fields in the first
  two groups are already serialized through\nother locks. It is sufficient to split
  the existing struct u64_stats_sync\nso that each group has its own.\n\nNote that
