title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  fix oops in concurrently setting insn_emulation sysctls\n\nemulation_proc_handler()
  changes table->data for proc_dointvec_minmax\nand can generate the following Oops
  if called concurrently with itself:\n\n | Unable to handle kernel NULL pointer dereference
  at virtual address 0000000000000010\n | Internal error: Oops: 96000006 [#1] SMP\n\
  \ | Call trace:\n | update_insn_emulation_mode+0xc0/0x148\n | emulation_proc_handler+0x64/0xb8\n\
  \ | proc_sys_call_handler+0x9c/0xf8\n | proc_sys_write+0x18/0x20\n | __vfs_write+0x20/0x48\n\
  \ | vfs_write+0xe4/0x1d0\n | ksys_write+0x70/0xf8\n | __arm64_sys_write+0x20/0x28\n\
  \ | el0_svc_common.constprop.0+0x7c/0x1c0\n | el0_svc_handler+0x2c/0xa0\n | el0_svc+0x8/0x200\n\
  \nTo fix this issue, keep the table->data as &insn->current_mode and\nuse container_of()
  to retrieve the insn pointer. Another mutex is\nused to protect against the current_mode
  update but not for retrieving\ninsn_emulation as table->data is no lo"
