title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix stack slot index in nospec checks\n\ncheck_stack_write_fixed_off() computes
  the byte slot for a fixed-offset\nstack write as -off - 1, and records each written
  byte in slot_type[] with\n(slot - i) % BPF_REG_SIZE.\n\nThe Spectre v4 sanitization
  pre-check uses slot_type[i] instead. For a\n4-byte write at fp-8 after the lower
  half of fp-8 has been zeroed, the\npre-check scans bytes 0..3 and sees STACK_ZERO
  while the actual write updates\nbytes 7..4. That can leave the second half-slot
  write without nospec_result\neven though the bytes being overwritten still require
  sanitization.\n\nUse the same slot index in the sanitization pre-check that the
  write path uses\nwhen updating slot_type[]."
