title: The address_standardizer extension for PostGIS through 3.7.0, fixed in 
  commit 423570b, contains an out-of-bounds write vulnerability that allows a 
  database user with the ability to supply caller-controlled relation names to 
  standardize_address() to trigger memory corruption by providing a rules table 
  with a classification Type value exceeding the fixed class range. Attackers 
  can craft a malicious rules table entry with an oversized rule type value that
  is used without bounds checking as an index into an internal output-link 
  table, resulting in an out-of-bounds write.
