title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ip6_gre: require CAP_NET_ADMIN in the device netns for changelink\n\nip6gre_changelink()
  and ip6erspan_changelink() operate on at most two\nnetns, dev_net(dev) and the tunnel
  link netns t->net. They differ once\nthe device is created in or moved to a netns
  other than the one the\nrequest runs in. The rtnl changelink path checks CAP_NET_ADMIN
  only\nagainst dev_net(dev), so a caller privileged there but not in t->net can\n\
  rewrite a tunnel that lives in t->net.\n\nGate both ops on rtnl_dev_link_net_capable()
  at their top, before any\nattribute is parsed."
