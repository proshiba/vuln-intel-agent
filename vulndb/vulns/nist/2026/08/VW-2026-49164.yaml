title: jackson-databind contains the general-purpose data-binding functionality 
  and tree-model for Jackson Data Processor. Prior to versions 2.18.9, 2.21.5, 
  2.22.1, 3.1.5, and 3.2.1 on their respective release lines, the 
  java.net.InetAddress branch of FromStringDeserializer.Std._deserialize() calls
  InetAddress.getByName() on attacker-controlled input, causing eager DNS 
  resolution during deserialization and enabling DNS-based server-side request 
  forgery and internal-host enumeration. This issue is fixed in versions 2.18.9,
  2.21.5, 2.22.1, 3.1.5, and 3.2.1.
