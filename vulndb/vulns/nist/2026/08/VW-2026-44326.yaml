title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  thunderbolt: Fix frags[] overflow by bounding frame_count\n\ntbnet_poll() assembles
  a multi-frame ThunderboltIP packet into one skb. The\nfirst frame goes into the
  skb linear area and every further frame is added as\na page fragment.\n\n\tskb_add_rx_frag(skb,
  skb_shinfo(skb)->nr_frags,\n\t\t\tpage, hdr_size, frame_size,\n\t\t\tTBNET_RX_PAGE_SIZE
  - hdr_size);\n\nA packet of frame_count frames therefore ends up with frame_count
  - 1\nfragments. tbnet_check_frame() only bounds the peer supplied frame_count to\n\
  TBNET_RING_SIZE / 4 (64), which is far above MAX_SKB_FRAGS (17 by default). A\n\
  peer that sends a packet of 19 or more small frames pushes nr_frags past\nMAX_SKB_FRAGS,
  so skb_add_rx_frag() writes past skb_shinfo()->frags[] and\ncorrupts memory after
  the shared info.\n\nTighten the start of packet bound to MAX_SKB_FRAGS + 1 so a
  packet can never\nproduce more fragments than frags[] can hold. This matches the
  recent skb\nfrags overflow fi"
