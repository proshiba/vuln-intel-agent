title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  cp2112: prevent a buffer overflow in cp2112_xfer()\n\nSmatch warnings:\ndrivers/hid/hid-cp2112.c:793
  cp2112_xfer() error: __memcpy()\n'data->block[1]' too small (33 vs 255)\ndrivers/hid/hid-cp2112.c:793
  cp2112_xfer() error: __memcpy() 'buf' too\nsmall (64 vs 255)\n\nThe 'read_length'
  variable is provided by 'data->block[0]' which comes\nfrom user and it(read_length)
  can take a value between 0-255. Add an\nupper bound to 'read_length' variable to
  prevent a buffer overflow in\nmemcpy()."
