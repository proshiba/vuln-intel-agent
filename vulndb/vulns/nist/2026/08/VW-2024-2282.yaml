title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Have format file honor EVENT_FILE_FL_FREED\n\nWhen eventfs was introduced, special
  care had to be done to coordinate the\nfreeing of the file meta data with the files
  that are exposed to user\nspace. The file meta data would have a ref count that
  is set when the file\nis created and would be decremented and freed after the last
  user that\nopened the file closed it. When the file meta data was to be freed, it\n\
  would set a flag (EVENT_FILE_FL_FREED) to denote that the file is freed,\nand any
  new references made (like new opens or reads) would fail as it is\nmarked freed.
  This allowed other meta data to be freed after this flag was\nset (under the event_mutex).\n\
  \nAll the files that were dynamically created in the events directory had a\npointer
  to the file meta data and would call event_release() when the last\nreference to
  the user space file was closed. This would be the time that it\nis safe to free
  the file meta data.\n\nA "
