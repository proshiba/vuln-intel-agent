title: "If CodeMeter Runtime before 8.41a or 9.10 is configured as a server, the configuration
  command handler does not enforce network-\norigin restrictions. Commands intended
  only for local or same-network clients can therefore be executed by\narbitrary remote
  peers. An attacker can read potentially sensitive configuration data and overwrite
  selected values\nin Server.ini. This does include the hash of the credentials for
  the CodeMeter WebAdmin, enabling WebAdmin\ntakeover."
