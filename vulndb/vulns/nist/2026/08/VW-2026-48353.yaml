title: Incus is a system container and virtual machine manager. Prior to version
  7.3.0, a malicious image containing a `metadata.yaml` symlink pointing to an 
  arbitrary host path allows an authenticated Incus user to read or overwrite 
  any file on the host as root via the instance metadata API. The `exec-output` 
  and `templates/` paths were patched in a prior release using `Lstat` rejection
  and `os.OpenRoot` confinement; `metadata.yaml` was not included in either 
  patch and remains exploitable. Version 7.3.0 patches the issue.
