title: Frappe is a full-stack web application framework. In version 16.31.0 and 
  earlier, the whitelisted frappe.model.workflow.bulk_workflow_approval endpoint
  in frappe/model/workflow.py accepts safe HTTP methods for state-changing 
  workflow approvals because the endpoint is not restricted to POST. An attacker
  can induce an authenticated victim browser to submit an approval action with 
  the victim privileges. No released fixed version is available as of this 
  review.
