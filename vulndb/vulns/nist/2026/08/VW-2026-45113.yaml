title: The Visualizer  WordPress plugin before 4.0.7 does not properly authorise
  access to the configuration of its charts, allowing users with the Contributor
  role and above to read the full configuration of any chart on the site, 
  including charts the Visualizer  WordPress plugin before 4.0.7's own interface
  denies them, and to retrieve every chart's configuration in a single request. 
  The disclosed configuration can include the credentials of a remote data 
  source a chart reads from.
