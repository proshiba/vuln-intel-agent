title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsch/netem:
  fix use after free in netem_dequeue\n\nIf netem_dequeue() enqueues packet to inner
  qdisc and that qdisc\nreturns __NET_XMIT_STOLEN. The packet is dropped but\nqdisc_tree_reduce_backlog()
  is not called to update the parent's\nq.qlen, leading to the similar use-after-free
  as Commit\ne04991a48dbaf382 (\"netem: fix return value if duplicate enqueue\nfails\"\
  )\n\nCommands to trigger KASAN UaF:\n\nip link add type dummy\nip link set lo up\n\
  ip link set dummy0 up\ntc qdisc add dev lo parent root handle 1: drr\ntc filter
  add dev lo parent 1: basic classid 1:1\ntc class add dev lo classid 1:1 drr\ntc
  qdisc add dev lo parent 1:1 handle 2: netem\ntc qdisc add dev lo parent 2: handle
  3: drr\ntc filter add dev lo parent 3: basic classid 3:1 action mirred egress\n\
  redirect dev dummy0\ntc class add dev lo classid 3:1 drr\nping -c1 -W0.01 localhost
  # Trigger bug\ntc class del dev lo classid 1:1\ntc class add dev lo classid 1:1
  drr\nping -c1 -W0.01 loca"
