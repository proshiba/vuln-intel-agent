  ath11k: fix gtk offload status event locking\n\nThe ath11k active pdevs are protected
  by RCU but the gtk offload status\nevent handling code calling ath11k_mac_get_arvif_by_vdev_id()
  was not\nmarked as a read-side critical section.\n\nMark the code in question as
  an RCU read-side critical section to avoid\nany potential use-after-free issues.\n\
  \nCompile tested only."
