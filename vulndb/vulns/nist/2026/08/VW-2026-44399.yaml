title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  frag: free unfragmentable packet\n\nThe caller of batadv_frag_send_packet() assume
  that the skb provided to the\nfunction are always consumed. But the pre-check for
  an empty payload or the\nzero fragment size returned an error without any further
  actions.\n\nA failed pre-check must use the same error handling code as the rest
  of the\nfunction."
