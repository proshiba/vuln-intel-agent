title: "In the Linux kernel, the following vulnerability has been resolved:\n\naudit:
  fix potential use-after-free in audit_del_rule()\n\n`audit_del_rule()` destroys
  `e->rule.exe` via `audit_remove_mark_rule()`\nbefore unlinking the rule from RCU-visible
  filter lists and waiting for a\ngrace period. Concurrent readers in `audit_filter()`
  and\n`audit_filter_rules()` still dereference `e->rule.exe`, while the fsnotify\n\
  mark can be freed on an independent lifetime path. This creates a\nuse-after-free
  window during rule deletion.\n\nFix this by unlinking the rule from the RCU-visible
  lists and invoking\n`synchronize_rcu()` before calling `audit_remove_mark_rule()`
  (and other\nrule removal helpers). This ensures that all existing RCU readers have\n\
  exited the critical section before any underlying resources are destroyed."
