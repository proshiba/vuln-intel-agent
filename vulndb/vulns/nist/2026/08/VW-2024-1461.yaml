title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkyber:
  fix out of bounds access when preempted\n\n__blk_mq_sched_bio_merge() gets the ctx
  and hctx for the current CPU and\npasses the hctx to ->bio_merge(). kyber_bio_merge()
  then gets the ctx\nfor the current CPU again and uses that to get the corresponding
  Kyber\ncontext in the passed hctx. However, the thread may be preempted between\n\
  the two calls to blk_mq_get_ctx(), and the ctx returned the second time\nmay no
  longer correspond to the passed hctx. This \"works\" accidentally\nmost of the time,
  but it can cause us to read garbage if the second ctx\ncame from an hctx with more
  ctx's than the first one (i.e., if\nctx->index_hw[hctx->type] > hctx->nr_ctx).\n\
  \nThis manifested as this UBSAN array index out of bounds error reported\nby Jakub:\n\
  \nUBSAN: array-index-out-of-bounds in ../kernel/locking/qspinlock.c:130:9\nindex
  13106 is out of range for type 'long unsigned int [128]'\nCall Trace:\n dump_stack+0xa4/0xe5\n\
  \ ubsan_epilogue+0x5/0x4"
