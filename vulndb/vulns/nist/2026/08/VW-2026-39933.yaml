title: boringproxy through 0.10.0 contains a newline injection vulnerability 
  that allows authenticated low-privileged users with tunnel-creation permission
  to inject arbitrary lines into the server account's SSH authorized_keys file 
  by supplying a percent-encoded newline character in the domain parameter of 
  the tunnel creation endpoint. Attackers can insert an unrestricted public key 
  entry into authorized_keys to gain persistent shell access, and subsequently 
  read cleartext credentials from the database file including all user tokens, 
  tunnel private keys, and TLS certificates.
