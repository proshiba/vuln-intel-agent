title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngue:
  validate REMCSUM private option length\n\nGUE private flags can indicate that remote
  checksum offload metadata is\npresent. The private flags field itself is accounted
  for by\nguehdr_flags_len(), but guehdr_priv_flags_len() currently returns 0 even\n\
  when GUE_PFLAG_REMCSUM is set.\n\nThis lets a packet with only the private flags
  field pass\nvalidate_gue_flags(), after which gue_remcsum() and gue_gro_remcsum()\n\
  read the missing REMCSUM start/offset fields from the following bytes.\n\nAccount
  for GUE_PLEN_REMCSUM when GUE_PFLAG_REMCSUM is present so that\nmalformed packets
  are rejected during option validation."
