title: FreeRDP before 3.29.0 improperly validates the Extended Key Usage (EKU) 
  purpose of the peer certificate during client-side server TLS authentication. 
  In x509_utils_verify(), when server-purpose (X509_PURPOSE_SSL_SERVER) 
  verification fails, the code falls back to client-purpose and any-purpose 
  verification, so a trusted, hostname-matching certificate valid only for 
  clientAuth can be accepted as the RDP server certificate. In environments 
  relying on EKU separation between client and server certificates, this allows 
  a clientAuth-only certificate issued by a trusted CA to bypass server 
  certificate purpose validation.
