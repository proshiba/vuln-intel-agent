title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  fix use-after-free in shinker's callback\n\nThe mmap read lock is used during the
  shrinker's callback, which means\nthat using alloc->vma pointer isn't safe as it
  can race with munmap().\nAs of commit dd2283f2605e (\"mm: mmap: zap pages with read
  mmap_sem in\nmunmap\") the mmap lock is downgraded after the vma has been isolated.\n\
  \nI was able to reproduce this issue by manually adding some delays and\ntriggering
  page reclaiming through the shrinker's debug sysfs. The\nfollowing KASAN report
  confirms the UAF:\n\n  ==================================================================\n\
  \  BUG: KASAN: slab-use-after-free in zap_page_range_single+0x470/0x4b8\n  Read
  of size 8 at addr ffff356ed50e50f0 by task bash/478\n\n  CPU: 1 PID: 478 Comm: bash
  Not tainted 6.6.0-rc5-00055-g1c8b86a3799f-dirty #70\n  Hardware name: linux,dummy-virt
  (DT)\n  Call trace:\n   zap_page_range_single+0x470/0x4b8\n   binder_alloc_free_page+0x608/0xadc\n\
  \   __list_"
