title: A flaw was found in JSS (Java Security Services). The JSSTrustManager 
  class does not verify NSS trust flags when validating CA certificates, 
  allowing certificates present in the NSS database without TRUSTED_CA flags to 
  be accepted as trust anchors for TLS connections. In non-default 
  configurations where certificate revocation checking is disabled, this could 
  allow a man-in-the-middle attacker to forge certificates accepted by PKI 
  client connections.
