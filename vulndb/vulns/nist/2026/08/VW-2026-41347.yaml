title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/gfx:
  fix cleaner shader IB buffer overflow\n\nThe cleaner shader sysfs path allocates
  a 16-dword (64 byte) IB but\nincorrectly fills (align_mask + 1) dwords. On GFX rings
  align_mask is\n0xff, so the loop wrote 256 dwords into a 64-byte buffer, causing
  a\nkernel page fault.\n\nThe IB only needs to be a minimal NOP shell to schedule
  the job; the\ncleaner shader itself is emitted on the ring via emit_cleaner_shader().\n\
  Fill 16 dwords to match the allocation.\n\nv2: Use ib_size_dw variable (Lijo)\n\n\
  (cherry picked from commit bf21af331ebf72d0935fd70c73192414a422c03a)"
