title: "In the Linux kernel, the following vulnerability has been resolved:\n\nax25:
  Fix netdev refcount issue\n\nThe dev_tracker is added to ax25_cb in ax25_bind().
  When the\nax25 device is detaching, the dev_tracker of ax25_cb should be\ndeallocated
  in ax25_kill_by_device() instead of the dev_tracker\nof ax25_dev. The log reported
  by ref_tracker is shown below:\n\n[   80.884935] ref_tracker: reference already
  released.\n[   80.885150] ref_tracker: allocated in:\n[   80.885349]  ax25_dev_device_up+0x105/0x540\n\
  [   80.885730]  ax25_device_event+0xa4/0x420\n[   80.885730]  notifier_call_chain+0xc9/0x1e0\n\
