title: CVAT is an open source interactive video and image annotation tool for 
  computer vision. From 2.68.0 until 2.70.0, the audio-task annotation guide 
  renderer in 
  cvat-ui/src/audio/components/annotation-page/audio-workspace/top-bar/audio-right-group.tsx
  passes attacker-controlled guide Markdown to MDEditor without the 
  rehype-sanitize plugin. A user who can create or edit an annotation guide can 
  store malicious JavaScript that executes when another user opens the guide. 
  The script can issue arbitrary CVAT requests with the victim user's 
  privileges. This issue is fixed in version 2.70.0.
