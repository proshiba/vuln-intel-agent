title: "File::Rotate::Simple versions before 0.4.0 for Perl create the target of dangling
  symlinks when rotating files.\n\nWhen the file to be rotated is a symbolic link
  to a missing file, and the touch option is enabled, then the rotate method assumes
  that the file is absent (since the existence check is against the target), and does
  not rotate it. But it touches the file, which creates the target.\n\nAn attacker
  that has the ability to create the symlink can use this to create an arbitrary file
  with permissions of the process rotating the files (which may be different from
  the process that normally writes to the log file that is being rotated).\n\nNote
  that the touch option is disabled by default."
