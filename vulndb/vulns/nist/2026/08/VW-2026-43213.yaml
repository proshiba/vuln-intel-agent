title: "When kuma-dp is started against an HTTPS control plane and the operator did
  not pass a CA certificate, the data plane connects with TLS peer verification disabled,
  and the dataplane authentication token is sent over that unverified connection.\n\
  \n\n\nAn on-path actor can intercept the dataplane authentication token and impersonate
  the control plane to the data plane, injecting a forged bootstrap configuration
  and taking over the proxy."
