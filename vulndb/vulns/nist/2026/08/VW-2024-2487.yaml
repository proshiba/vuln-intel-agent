title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFC:
  nci: Bounds check struct nfc_target arrays\n\nWhile running under CONFIG_FORTIFY_SOURCE=y,
  syzkaller reported:\n\n  memcpy: detected field-spanning write (size 129) of single
  field \"target->sensf_res\" at net/nfc/nci/ntf.c:260 (size 18)\n\nThis appears to
  be a legitimate lack of bounds checking in\nnci_add_new_protocol(). Add the missing
  checks."
