title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal:
  core: Reference count the zone in thermal_zone_get_by_id()\n\nThere are places in
  the thermal netlink code where nothing prevents\nthe thermal zone object from going
  away while being accessed after it\nhas been returned by thermal_zone_get_by_id().\n\
  \nTo address this, make thermal_zone_get_by_id() get a reference on the\nthermal
  zone device object to be returned with the help of get_device(),\nunder thermal_list_lock,
  and adjust all of its callers to this change\nwith the help of the cleanup.h infrastructure."
