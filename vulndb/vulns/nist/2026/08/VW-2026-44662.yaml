title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  serialize netif_running() check in enqueue_to_backlog()\n\nSyzbot reported a KASAN
  slab-use-after-free in fib_rules_lookup().\n\nThe root cause is a race condition
  where packets can escape the backlog\nflushing during device unregistration (e.g.,
  during netns exit).\n\nCommit e9e4dd3267d0 (\"net: do not process device backlog
  during unregistration\")\nintroduced a lockless netif_running() check in enqueue_to_backlog()
  to\nprevent queuing packets to an unregistering device.\n\nHowever, this creates
  a TOCTOU race window.\n\nA lockless transmitter (like veth_xmit) can pass\nthe check
  before dev_close() clears IFF_UP. If the transmitter is then\ndelayed, flush_all_backlogs()
  can run and finish before the transmitter\ngrabs the backlog lock and queues the
  packet. The packet then escapes\nthe flush and triggers UAF later when processed.\n\
  \nFix this by moving the netif_running() check inside the backlog lock.\nThis serializes
  the check with "
