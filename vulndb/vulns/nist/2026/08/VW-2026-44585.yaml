title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nft_compat: ebtables emulation must reject non-bridge targets\n\nxtables targets
  return netfilter verdicts: NF_ACCEPT, NF_DROP, and so\non.  ebtables targets return
  incompatible verdicts: EBT_ACCEPT,\nEBT_DROP, ...   We cannot allow fallback to
  NFPROTO_UNSPEC.\n\nebtables doesn't permit this since\n11ff7288beb2 (\"netfilter:
  ebtables: reject non-bridge targets\")\nbut that commit missed the nft_compat layer."
