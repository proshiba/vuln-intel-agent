title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/pci:
  Skip to handle RAS errors if CXL.mem device is detached\n\nThe PCI AER model is
  an awkward fit for CXL error handling. While the\nexpectation is that a PCI device
  can escalate to link reset to recover\nfrom an AER event, the same reset on CXL
  amounts to a surprise memory\nhotplug of massive amounts of memory.\n\nAt present,
  the CXL error handler attempts some optimistic error\nhandling to unbind the device
  from the cxl_mem driver after reaping some\nRAS register values. This results in
  a \"hopeful\" attempt to unplug the\nmemory, but there is no guarantee that will
  succeed.\n\nA subsequent AER notification after the memdev unbind event can no\n\
  longer assume the registers are mapped. Check for memdev bind before\nreaping status
  register values to avoid crashes of the form:\n\n BUG: unable to handle page fault
  for address: ffa00000195e9100\n #PF: supervisor read access in kernel mode\n #PF:
  error_code(0x0000) - not-present page\n ["
