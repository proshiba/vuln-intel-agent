  request processing has two bugs that can cause data\ncorruption for user SDMA requests
  that have multiple payload iovecs\nwhere an iovec other than the tail iovec does
  not run up to the page\nboundary for the buffer pointed to by that iovec.a\n\nHere
  are the specific bugs:\n1. user_sdma_txadd() does not use struct user_sdma_iovec->iov.iov_len.\n\
  \   Rather, user_sdma_txadd() will add up to PAGE_SIZE bytes from iovec\n   to the
  packet, even if some of those bytes are past\n   iovec->iov.iov_len and are thus
  not intended to be in the packet.\n2. user_sdma_txadd() and user_sdma_send_pkts()
  fail to advance to the\n   next iovec in user_sdma_request->iovs when the current
  iovec\n   is not PAGE_SIZE and does not contain enough data to complete the\n  \
