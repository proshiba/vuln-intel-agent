title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-fence:
  Fix potential tracepoint null pointer dereferences\n\nTrace_dma_fence_signaled,
  trace_dma_fence_wait_end and\ntrace_dma_fence_destroy can all currently dereference
  a null fence->ops\npointer after it has been reset on fence signalling.\n\nLets
  use the safe string getters for most tracepoints to avoid this class\nof a problem,
  while for the signal tracepoint we move it to before ops are\ncleared to avoid losing
  the driver and timeline name information. Apart\nfrom moving it we also need to
  add a new tracepoint class to bypass the\nsafe name getters since the signaled bit
  is already set.\n\nFor dma_fence_init we also need to use the new tracepoint class
  since the\nrcu read lock is not held there, and we can do the same for the enable\n\
  signaling since there we are certain the fence cannot be signaled while\nwe are
  holding the lock and have even validated the fence->ops."
