title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  etas_es58x: es58x_read_bulk_callback(): fix RX buffer leak on URB resubmit failure\n\
  \nes58x_read_bulk_callback() resubmits the RX URB after processing a received\n\
  packet. If the resubmit succeeds, the URB remains anchored and will be\nhandled
  by the normal RX path or by teardown.\n\nHowever, if usb_submit_urb() fails, the
  callback unanchors the URB and then\nreturns directly. This skips the existing free_urb
  path, so the coherent\ntransfer buffer allocated with usb_alloc_coherent() is not
  released.\n\nReuse the existing free_urb path after a resubmit failure so that the
  RX\ncoherent buffer is freed before leaving the callback."
