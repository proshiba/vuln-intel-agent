title: The frontend topic editing flow does not verify on the server side that 
  the requesting visitor owns the topic being modified. As a result, a visitor 
  who knows the identifier of a topic from the public forum can submit a 
  modified update request for that topic directly and overwrite its content, 
  without the application confirming ownership. Topic identifiers are visible in
  the public forum listing, and exploitation requires no privileged access or 
  non-default configuration.
