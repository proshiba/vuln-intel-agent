title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbonding:
  change ipsec_lock from spin lock to mutex\n\nIn the cited commit, bond->ipsec_lock
  is added to protect ipsec_list,\nhence xdo_dev_state_add and xdo_dev_state_delete
  are called inside\nthis lock. As ipsec_lock is a spin lock and such xfrmdev ops
  may sleep,\n\"scheduling while atomic\" will be triggered when changing bond's\n\
  active slave.\n\n[  101.055189] BUG: scheduling while atomic: bash/902/0x00000200\n\
  [  101.055726] Modules linked in:\n[  101.058211] CPU: 3 PID: 902 Comm: bash Not
