title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: always release netdev hooks from notifier\n\nThis reverts \"netfilter:
  nf_tables: skip netdev events generated on netns removal\".\n\nThe problem is that
  when a veth device is released, the veth release\ncallback will also queue the peer
  netns device for removal.\n\nIts possible that the peer netns is also slated for
  removal.  In this\ncase, the device memory is already released before the pre_exit
  hook of\nthe peer netns runs:\n\nBUG: KASAN: slab-use-after-free in nf_hook_entry_head+0x1b8/0x1d0\n\
  Read of size 8 at addr ffff88812c0124f0 by task kworker/u8:1/45\nWorkqueue: netns
  cleanup_net\nCall Trace:\n nf_hook_entry_head+0x1b8/0x1d0\n __nf_unregister_net_hook+0x76/0x510\n\
  \ nft_netdev_unregister_hooks+0xa0/0x220\n __nft_release_hook+0x184/0x490\n nf_tables_pre_exit_net+0x12f/0x1b0\n\
  \ ..\n\nOrder is:\n1. First netns is released, veth_dellink() queues peer netns
  device\n   for removal\n2. peer netns is queued for removal\n3. pe"
