title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  libertas_tf: fix use-after-free in lbtf_free_adapter()\n\nlbtf_free_adapter() calls
  timer_delete(&priv->command_timer), which does\nnot wait for a running command_timer_fn()
  callback. lbtf_free_adapter()\nruns on the teardown path right before ieee80211_free_hw()
  frees priv,\nboth in lbtf_remove_card() and in the probe error path. command_timer
  is\narmed by mod_timer() in lbtf_cmd() whenever a firmware command is sent.\ncommand_timer_fn()
  dereferences priv. If a command times out as the\ndevice is removed, command_timer_fn()
  runs concurrently with teardown and\ndereferences priv after it has been freed.\n\
  \nThis is the same use-after-free that commit 03cc8f90d053 (\"wifi: libertas:\n\
  fix use-after-free in lbs_free_adapter()\") fixed in the sibling libertas\ndriver.
  The libertas_tf variant has the identical pattern and was left\nunchanged. Use timer_delete_sync()
  so any in-flight callback completes\nbefore priv is freed."
