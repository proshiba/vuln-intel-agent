title: 'Vulnerability in the Oracle Hyperion Data Relationship Management product
  of Oracle Hyperion (component: Access and security).   The supported version that
  is affected is 11.2.25.0.000. Easily exploitable vulnerability allows low privileged
  attacker with network access via HTTP to compromise Oracle Hyperion Data Relationship
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Hyperion
  Data Relationship Management accessible data as well as  unauthorized access to
  critical data or complete access to all Oracle Hyperion Data Relationship Management
  accessible data. CVSS 3.1 Base Score 8.1 (Confidentiality and Integrity impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N).'
