title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack: defer invalid log until after unlock\n\nTCP and SCTP conntrack paths
  can emit invalid-packet logs while ct->lock\nis still held.\n\nWhen invalid logging
  is routed to nfnetlink_log and conntrack export is\nenabled, the log path can re-enter
  conntrack netlink glue and dump the\nsame conntrack again. Protocol attribute dumping
  may take ct->lock, so\nlogging while holding that lock can deadlock.\n\nDefer the
  TCP invalid logs by storing only the minimal log context while\nct->lock is held
  and emitting the log after unlocking. Also make the TCP\ntimeout-lowering invalid
  path return whether a log is needed, then emit\nthat log after unlocking.\n\nDo
  the same for the SCTP invalid state-transition log that can be reached\nwhile ct->lock
  is held.\n\nAdd a lockdep assertion to nf_ct_l4proto_log_invalid() so future callers\n\
  that log invalid conntracks while holding ct->lock are caught outside TCP\nand SCTP
  as well."
