title: "@better-auth/sso before 1.6.27 (and before 1.4.8 in the 1.4.x line and before
  1.7.0-rc.5 in the 1.7 prerelease line) contains two domain-ownership flaws. When
  domain verification is disabled, automatic organization assignment accepts unverified
  provider domains, allowing an authenticated organization owner/administrator to
  register an SSO provider for an arbitrary domain and have users with matching email
  domains added to the attacker's organization with default member permissions. When
  domain verification is enabled, a race condition between the verify-domain and update-provider
  endpoints can apply completed DNS proof to a different domain; combined with implicit
  account linking, this can link an attacker-controlled identity provider to an existing
  user account. Exploitation requires the SSO plugin (and, for the org-assignment
  path, the organization plugin) with the relevant configuration enabled."
