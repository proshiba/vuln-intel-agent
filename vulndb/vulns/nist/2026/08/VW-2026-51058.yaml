title: "openssl_encrypt (pip: openssl-encrypt) versions 1.4.8 and earlier fail to
  validate the 36-bit STREAMINFO total_samples field of FLAC files before using it
  to size an allocation (np.random.randint(size=(total_samples, channels))). A ~50-byte
  crafted FLAC file declaring ~100 million samples causes a multi-gigabyte memory
  allocation, leading to out-of-memory denial of service during 'decrypt --stego-extract'.
  The issue is fixed in 1.4.9; both the 1.4.x and 1.5.x lines are affected."
