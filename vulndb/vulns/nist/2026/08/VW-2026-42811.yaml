title: kkFileView is a universal file online preview project based on Spring 
  Boot. Prior to 5.0.1, the unauthenticated GET /addTask endpoint in kkFileView 
  is omitted from TrustHostFilter and TrustDirFilter in 
  server/src/main/java/cn/keking/config/WebConfig.java, allowing 
  FileConvertQueueTask to fetch an attacker-selected URL after 
  FileHandlerService#getFileAttribute uses the fullfilename parameter to force 
  an OFFICE, COMPRESS, or CAD type. This issue is fixed in version 5.0.1.
