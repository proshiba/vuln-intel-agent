title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix use-after-free of conn->preauth_info in concurrent SMB2 NEGOTIATE\n\nconn->preauth_info
  is shared connection state (struct\npreauth_integrity_info, kmalloc-96) that is
  allocated and freed by the\nSMB2 NEGOTIATE handler and read by the response send
  path.\n\nsmb2_handle_negotiate() allocates conn->preauth_info, and on a\ndeassemble_neg_contexts()
  failure kfrees it and sets it to NULL. Both the\nallocation and the free/NULL happen
  under ksmbd_conn_lock(conn) (the\nconnection srv_mutex), which is held across the
  whole handler body.\n\nThe response send path smb3_preauth_hash_rsp(), called from
  the send:\nblock of __handle_ksmbd_work(), reads conn->preauth_info and dereferences\n\
  conn->preauth_info->Preauth_HashValue (via\nksmbd_gen_preauth_integrity_hash())
  without taking conn_lock. When a\nclient drives two SMB2 NEGOTIATE requests on the
  same connection, one\nworker can free conn->preauth_info on the failing-negotiate
