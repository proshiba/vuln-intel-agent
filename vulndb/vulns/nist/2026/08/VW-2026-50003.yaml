title: TypeBot is a chatbot builder tool. Prior to 3.18.0, any authenticated 
  non-guest workspace member can remove another workspace's public custom domain
  and make typebots on that domain unavailable. The custom-domain delete handler
  in handleDeleteCustomDomain.ts authorizes a caller against a client-supplied 
  workspaceId but sends the client-supplied domain name to the shared Vercel 
  project before verifying that the domain belongs to that workspace. This issue
  is fixed in version 3.18.0.
