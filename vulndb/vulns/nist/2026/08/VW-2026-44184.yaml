title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/resctrl:
  Fix double-add of pseudo-locked region's RMID to free list\n\nA pseudo-locked group's
  RMID is freed when it is created. On unmount\nrmdir_all_sub() unconditionally frees
  all RMID of all groups, resulting\nin a double-free of the pseudo-locked group's
  RMID. The consequence of this\nis that the original free results in the pseudo-locked
  group's RMID being\nadded to the rmid_free_lru linked list and the second free then
  attempts\nto add the same RMID entry to the rmid_free_lru again.\n\nDo not double-free
  a pseudo-locked group's RMID."
