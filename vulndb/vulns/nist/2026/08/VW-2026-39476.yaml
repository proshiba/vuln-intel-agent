title: Odysseus before commit bf325f6 contains a missing authorization 
  vulnerability that allows authenticated non-admin users to manage server-wide 
  embedding backend configuration by invoking endpoint management routes that 
  verify session authentication but omit the admin authorization guard. 
  Attackers can supply an attacker-controlled URL to overwrite the embedding 
  backend persisted in the endpoint configuration file and process environment, 
  causing all subsequent embedding operations including chat messages, RAG 
  queries, memory entries, and vault text to be transmitted in plaintext to the 
  attacker-controlled destination, or delete the endpoint configuration to deny 
  embedding service to all users.
