title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  call rcu_barrier() in ksmbd_server_exit()\n\nracy issue is triggered the bug by
  racing between closing a connection\nand rmmod. In ksmbd, rcu_barrier() is not called
  at module unload time,\nso nothing prevents ksmbd from getting unloaded while it
  still has RCU\ncallbacks pending. It leads to trigger unintended execution of kernel\n\
  code locally and use to defeat protections such as Kernel Lockdown"
