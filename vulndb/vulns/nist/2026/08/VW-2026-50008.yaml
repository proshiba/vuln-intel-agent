title: "Improper Access Control, Incorrect Authorization vulnerability in Apache Tomcat
  leads to security constraint bypass if a constraint for a longer path is specified
  before a more restrictive constraint for a shorter sub-path.\n\n\n\nThis issue affects
  Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from
  9.0.0.M1 through 9.0.120, from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109.\n\
  \n\n\nUsers are recommended to upgrade to version 11.0.25, 10.1.58, 9.0.121, which
  fixes the issue."
