title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  fix double-free on socket dismantle\n\nwhen MPTCP server accepts an incoming connection,
  it clones its listener\nsocket. However, the pointer to 'inet_opt' for the new socket
  has the same\nvalue as the original one: as a consequence, on program exit it's
  possible\nto observe the following splat:\n\n  BUG: KASAN: double-free in inet_sock_destruct+0x54f/0x8b0\n\
  \  Free of addr ffff888485950880 by task swapper/25/0\n\n  CPU: 25 PID: 0 Comm:
  swapper/25 Kdump: loaded Not tainted 6.8.0-rc1+ #609\n  Hardware name: Supermicro
  SYS-6027R-72RF/X9DRH-7TF/7F/iTF/iF, BIOS 3.0  07/26/2013\n  Call Trace:\n   <IRQ>\n\
  \   dump_stack_lvl+0x32/0x50\n   print_report+0xca/0x620\n   kasan_report_invalid_free+0x64/0x90\n\
  \   __kasan_slab_free+0x1aa/0x1f0\n   kfree+0xed/0x2e0\n   inet_sock_destruct+0x54f/0x8b0\n\
  \   __sk_destruct+0x48/0x5b0\n   rcu_do_batch+0x34e/0xd90\n   rcu_core+0x559/0xac0\n\
  \   __do_softirq+0x183/0x5a4\n   irq_exit_rcu+0x12d/0x170\n   sysvec_apic_t"
