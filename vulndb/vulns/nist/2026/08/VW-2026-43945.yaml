title: 'A vulnerability was determined in Webkul Bagisto up to 2.4.4. Affected is
  an unknown function of the file /admin/customers/login-as-customer/ of the component
  Admin Customer Impersonation Feature. This manipulation of the argument ID causes
  authorization bypass. The attack can be initiated remotely. The exploit has been
  publicly disclosed and may be utilized. The vendor confirms: "The reported issues
  were already identified through our internal security assessment process prior to
  this notification and are being handled through our established internal security
  and development lifecycle. Some of these items have already been addressed, while
  the remaining items are planned for resolution in upcoming product releases."'
