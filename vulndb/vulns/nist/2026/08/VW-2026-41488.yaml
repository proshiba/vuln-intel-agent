title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  publish QP after initialization\n\nsiw_create_qp() currently calls siw_qp_add()
  before the queues, CQ\npointers, state, completion, and device list entry are ready.
  A QPN\nlookup can therefore reach a QP that is still being constructed.\n\nMove
  siw_qp_add() to the end of siw_create_qp(), after QP\ninitialization and before
  adding the QP to the siw device list."
