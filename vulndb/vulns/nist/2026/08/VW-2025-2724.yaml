title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  do proper folio cleanup when cow_file_range() failed\n\n[BUG]\nWhen testing with
  COW fixup marked as BUG_ON() (this is involved with the\nnew pin_user_pages*() change,
  which should not result new out-of-band\ndirty pages), I hit a crash triggered by
  the BUG_ON() from hitting COW\nfixup path.\n\nThis BUG_ON() happens just after a
  failed btrfs_run_delalloc_range():\n\n  BTRFS error (device dm-2): failed to run
  delalloc range, root 348 ino 405 folio 65536 submit_bitmap 6-15 start 90112 len
  106496: -28\n  ------------[ cut here ]------------\n  kernel BUG at fs/btrfs/extent_io.c:1444!\n\
  \  Internal error: Oops - BUG: 00000000f2000800 [#1] SMP\n  CPU: 0 UID: 0 PID: 434621
  Comm: kworker/u24:8 Tainted: G           OE      6.12.0-rc7-custom+ #86\n  Hardware
  name: QEMU KVM Virtual Machine, BIOS unknown 2/2/2022\n  Workqueue: events_unbound
  btrfs_async_reclaim_data_space [btrfs]\n  pc : extent_writepage_io+0x2d4/0x308 [btrfs]\n\
  \  lr : extent"
