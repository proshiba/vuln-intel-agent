title: "A relative path traversal issue in the zip extraction functionality in AWS
  diagram-as-code (awsdac) in versions 0.10 through 0.23 can allow a third party to
  write arbitrary files to the local filesystem via crafted zip entry names containing
  path traversal sequences. This could allow the third party to perform inappropriate
  actions in the diagram bundle.\n\n\n\nTo remediate this issue, users should upgrade
  to the version 0.24 or later."
