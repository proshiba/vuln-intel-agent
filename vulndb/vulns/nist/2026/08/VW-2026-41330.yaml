title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Check bounds in allocate_event_notification_slot\n\nThe valid event ids go from
  0 to KFD_SIGNAL_EVENT_LIMIT\n\nallocate_event_notification_slot has an option to
  specify\nan event id to allocate at, used by CRIU. We weren't checking\nthe bounds
  on that value.\n\nCheck them.\n\nv2: Lower bounds check is unecessary because of
  idr_alloc\nalready rejecting negative numbers. Upper bounds check should\nbe KFD_SIGNAL_EVENT_LIMIT
  since the signal mode mappings might\nnot yet exist\n\n(cherry picked from commit
  6853f1f6cbbeb3f53ebbbd7286536aeb2c5d5f50)"
