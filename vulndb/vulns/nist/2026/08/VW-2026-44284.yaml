title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: track a single source interface for ANYDEV timeout/throttle ops\n\nAn ANYDEV
  rx op (ifindex == 0) with an active RX timeout and/or\nthrottle timer has no defined
  semantics when matching frames arrive\nfrom several interfaces: bcm_rx_handler()
  can run concurrently for\nthe same op on different CPUs, racing hrtimer_cancel()/\n\
  bcm_rx_starttimer() against bcm_rx_timeout_handler() and causing\nspurious RX_TIMEOUT
  notifications and last_frames corruption. The\nsame concurrency lets throttled multiplex
