title: A flaw was found in insights-client. A compromised managed cluster, 
  referred to as a 'spoke', can inject unencoded data into the Insights API URL 
  path. This occurs because the ClusterID, which is controlled by the spoke, is 
  used directly in the request path without proper validation or URL encoding. 
  This vulnerability allows a malicious spoke to redirect authenticated requests
  to unintended API endpoints, potentially leading to information disclosure or 
  unauthorized access.
