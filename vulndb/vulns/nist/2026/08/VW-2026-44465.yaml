title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ife: require ETH_HLEN to be pullable in ife_decode()\n\nife decode may return after
  making only the outer IFE header and\nmetadata pullable. The caller then passes
  the decapsulated packet to\neth_type_trans(), which expects the inner Ethernet header
  to be\naccessible from the linear data area.\n\nWith a malformed IFE frame, the
  inner Ethernet header may still be\nshorter than ETH_HLEN in the linear area, which
  can lead to a crash in\nthe original code.\n\nFix this by extending the pull check
  in ife_decode() so that the inner\nEthernet header is also guaranteed to be pullable
  before returning."
