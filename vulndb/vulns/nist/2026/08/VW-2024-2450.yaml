title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  aovid use-after-free in ext4_ext_insert_extent()\n\nAs Ojaswin mentioned in Link,
  in ext4_ext_insert_extent(), if the path is\nreallocated in ext4_ext_create_new_leaf(),
  we'll use the stale path and\ncause UAF. Below is a sample trace with dummy values:\n\
  \next4_ext_insert_extent\n  path = *ppath = 2000\n  ext4_ext_create_new_leaf(ppath)\n\
  \    ext4_find_extent(ppath)\n      path = *ppath = 2000\n      if (depth > path[0].p_maxdepth)\n\
  \            kfree(path = 2000);\n            *ppath = path = NULL;\n      path
  = kcalloc() = 3000\n      *ppath = 3000;\n      return path;\n  /* here path is
  still 2000, UAF! */\n  eh = path[depth].p_hdr\n\n==================================================================\n\
  BUG: KASAN: slab-use-after-free in ext4_ext_insert_extent+0x26d4/0x3330\nRead of
  size 8 at addr ffff8881027bf7d0 by task kworker/u36:1/179\nCPU: 3 UID: 0 PID: 179
  Comm: kworker/u6:1 Not tainted 6.11.0-rc2-dirty #866\nCall Trace:\n <TASK>\n"
