title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndibs:
  fix use-after-free of dmb_node in loopback attach/detach/unregister\n\ndibs_lo_attach_dmb(),
  dibs_lo_detach_dmb() and dibs_lo_unregister_dmb()\nlook up the dmb_node under dmb_ht_lock,
  drop the lock and only then\noperate on the node's refcount. Nothing keeps the node
  alive across\nthat window: __dibs_lo_unregister_dmb() removes the node from the
  hash\ntable under the write lock and immediately frees it.\n\nA concurrent final
  put can therefore free the node between the lookup\nand the refcount operation:\n\
  \nCPU0 (attach)                     CPU1 (owner unregisters)\n\nread_lock_bh(&dmb_ht_lock)\n\
  find dmb_node (refcnt == 1)\nread_unlock_bh(&dmb_ht_lock)\n                    \
  \              refcount_dec_and_test() 1 -> 0\n                                \
  \  write_lock_bh(&dmb_ht_lock)\n                                  hash_del(&dmb_node->list)\n\
  \                                  write_unlock_bh(&dmb_ht_lock)\n             \
  \                "
