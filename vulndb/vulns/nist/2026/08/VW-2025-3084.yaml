title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt7601u: fix an integer underflow\n\nFix an integer underflow that leads to a null
  pointer dereference in\n'mt7601u_rx_skb_from_seg()'. The variable 'dma_len' in the
  URB packet\ncould be manipulated, which could trigger an integer underflow of\n\
  'seg_len' in 'mt7601u_rx_process_seg()'. This underflow subsequently\ncauses the
  'bad_frame' checks in 'mt7601u_rx_skb_from_seg()' to be\nbypassed, eventually leading
  to a dereference of the pointer 'p', which\nis a null pointer.\n\nEnsure that 'dma_len'
  is greater than 'min_seg_len'.\n\nFound by a modified version of syzkaller.\n\n\
  KASAN: null-ptr-deref in range [0x0000000000000008-0x000000000000000f]\nCPU: 0 PID:
  12 Comm: ksoftirqd/0 Tainted: G        W  O      5.14.0+\n#139\nHardware name: QEMU
  Standard PC (i440FX + PIIX, 1996), BIOS\nrel-1.12.1-0-ga5cab58e9a3f-prebuilt.qemu.org
  04/01/2014\nRIP: 0010:skb_add_rx_frag+0x143/0x370\nCode: e2 07 83 c2 03 38 ca 7c
  08 84 c9 0f 85 86 01 00 00 4c 8"
