title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  imx: mark I2C adapter when hardware is powered down\n\nOn some i.MX platforms, certain
  I2C client drivers keep a periodic\nworkqueue which continues to trigger I2C transfers.\n\
  \nDuring system suspend/resume, there exists a time window between:\n  - suspend_noirq
  and the system entering suspend\n  - the system starting to resume and resume_noirq\n\
  \nIn this window, the I2C controller resources such as clock and pinctrl\nmay already
  be disabled or not yet restored.\n\nIf a workqueue triggers an I2C transfer in this
  period, the driver\nattempts to access I2C registers while the hardware resources
  are\nunavailable, which may lead to system hang.\n\nMark the I2C adapter as suspended
  during noirq suspend and block new\ntransfers until resume, ensuring that I2C transfers
  are only issued\nwhen hardware resources are available."
