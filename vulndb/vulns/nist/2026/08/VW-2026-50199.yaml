title: The vulnerability allows the unauthorised generation of physical access 
  QR codes due to the use of hard-coded credentials within the application. The 
  generation mechanism uses the 'badge_number' parameter as the HMAC private 
  key, the value of which remains static and is accessible via the API using the
  endpoint '/club/_id_club_/member/_id_member_/resamania_qr_info'. An attacker 
  with access to this value and to the application’s cryptographic logic, which 
  can be extracted by reverse engineering the APK as there is no code 
  obfuscation, could generate valid QR codes indefinitely, even after the user 
  has changed their password or logged out.
