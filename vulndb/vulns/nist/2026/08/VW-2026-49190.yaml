title: "A flaw was found in CRI-O's container-creation environment-variable handling\n\
  (`mergeEnvs` in `server/utils.go`, consumed by `setupContainerEnvironmentAndWorkdir`
  in\n`server/container_create.go`). When a `CreateContainer` request supplies a `nil`
  CRI\n`Envs` field, CRI-O falls back to using the target OCI image's `config.Env`
  entries\nunfiltered, in contrast to the normal merge path, which validates each
  entry for a\n`key=value` form before use. An OCI image whose `config.Env` contains
  an entry with no\n`=` character (e.g. a bare `NOEQUALS` string) causes CRI-O to
  split that entry into a\nsingle-element slice and then index its second element,
  which is out of range. This\ntriggers an unrecovered Go runtime panic in the `crio`
  daemon process, crashing it and\nterminating the container-runtime service for all
  workloads on the node until it is\nrestarted."
