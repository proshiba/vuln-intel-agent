title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.6, Dokploy's user.update procedure in 
  apps/dokploy/server/api/routers/user.ts updates account.password without 
  deleting other rows from session, allowing a compromised 
  better-auth.session_token session to remain valid for up to three days after a
  password change. This issue is fixed in version 0.29.6.
