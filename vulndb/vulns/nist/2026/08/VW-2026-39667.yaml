title: The Search Analytics for WP plugin for WordPress is vulnerable to 
  Cross-Site Request Forgery in all versions up to, and including, 1.4.16. This 
  is due to missing or incorrect nonce validation on the `process_bulk_action()`
  function of `MWTSA_Stats_Table`. This makes it possible for unauthenticated 
  attackers to delete arbitrary search-term records, including all associated 
  search-history rows, via a forged request granted they can trick a user with 
  access to the plugin's "Search Analytics" dashboard page (Administrator by 
  default) into performing an action such as clicking on a link.
