title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: drop TXRX_NOTIFY on non-mmio buses\n\nPKT_TYPE_TXRX_NOTIFY is an mmio-only
  event, but mt7925_rx_check() and\nmt7925_queue_rx_skb() dispatch it to mt7925_mac_tx_free()
  on every bus.\nmt7925_mac_tx_free() cleans the DMA tx queues with\nmt76_queue_tx_cleanup(),
  which calls queue_ops->tx_cleanup(). Only the\nmmio queue ops implement that callback;
  on USB it is NULL, so a\nTXRX_NOTIFY there calls a NULL pointer in the RX worker:\n\
  \n  BUG: kernel NULL pointer dereference, address: 0000000000000000\n  RIP: 0010:0x0\n\
  \  Call Trace:\n   mt7925_mac_tx_free+0x58/0x350 [mt7925_common]\n   mt7925_rx_check+0xe2/0x130
  [mt7925_common]\n   mt76u_rx_worker+0x1b9/0x620 [mt76_usb]\n\nDrop the event on
  non-mmio buses via mt76_is_mmio(), as in\ncommit 5683e1488aa9 (\"wifi: mt76: connac:
  do not check WED status for\nnon-mmio devices\")."
