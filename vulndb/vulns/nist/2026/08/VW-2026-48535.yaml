title: The Slider Hero with Video Background, Animation WordPress plugin before 
  9.1.3 does not have authorisation and nonce checks on two of its request 
  handlers, and does not escape a stored setting before outputting it, allowing 
  unauthenticated users to store malicious JavaScript which will be executed in 
  the context of an administrator viewing the Slider Hero with Video Background,
  Animation WordPress plugin before 9.1.3's admin area, as well as any visitor 
  of a page embedding a slider.
