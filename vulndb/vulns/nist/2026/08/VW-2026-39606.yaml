title: "The Translate Multilingual sites – TranslatePress plugin for WordPress is
  vulnerable to Reflected Cross-Site Scripting via the 's' parameter in versions up
  to, and including, 3.2.5. This is due to the translate_page() function unconditionally
  replacing the plugin's internal #!trpst# and #!trpen# marker tokens with literal
  angle brackets across the entire HTML page output after WordPress has already sanitized
  and escaped user input — allowing the attacker to bypass WordPress's normal HTML
  escaping by using these tokens, which are not HTML special characters, in the search
  query. This makes it possible for unauthenticated attackers to inject arbitrary
  web scripts in pages that execute if they can successfully trick a user into performing
  an action such as clicking on a specially crafted link."
