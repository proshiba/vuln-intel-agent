title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/ts4800:
  Fix missing chained handler cleanup on remove\n\nThe driver installs a chained handler
  for the parent interrupt during probe\nusing irq_set_chained_handler_and_data(),
  but the remove function does not\nclear this handler. This leaves a dangling handler
  that may be called when\nthe parent interrupt fires after the driver has been removed,
  potentially\naccessing freed memory and causing a kernel crash.\n\nAdditionally,
  the parent_irq obtained via irq_of_parse_and_map() is not\nstored, making it inaccessible
  in the remove function. Moreover, interrupt\nmappings created during probe are not
  properly disposed.\n\nFix this by:\n\n   - Saving parent_irq in probe\n   - Clearing
  the chained handler with NULL in ts4800_ic_remove()\n   - Disposing all IRQ mappings
  before domain removal to prevent resource\n     leaks"
