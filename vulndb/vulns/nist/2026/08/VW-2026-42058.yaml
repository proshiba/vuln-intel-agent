title: n8n versions before 1.123.67 contain a path traversal vulnerability in 
  the Git node's fetch, pull, and push-tags operations that allows authenticated
  users to bypass repository-path containment checks. Attackers with workflow 
  create/execute rights can point allowlisted remote configurations at local 
  paths outside the sandbox to pull arbitrary git repositories and read their 
  files and history.
