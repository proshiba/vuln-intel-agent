title: npm-check-updates through 23.0.2, fixed in commit b554b84, contains a 
  terminal escape sequence injection vulnerability that allows an attacker to 
  embed arbitrary terminal control characters in a dependency's package.json 
  homepage or repository URL fields. When a developer runs ncu with the --format
  homepage or --format repo option, unfiltered escape sequences are written 
  directly to the terminal, enabling malicious output manipulation or other 
  terminal-dependent effects.
