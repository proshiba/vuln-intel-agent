title: FreeRDP before 3.29.0 contains a client-side heap use-after-free in the 
  async update message proxy for WINDOW_ICON_ORDER when AsyncUpdate is enabled 
  (e.g. xfreerdp /async-update). In update_message_WindowIcon() a shallow 
  CopyMemory() overwrites a freshly allocated lParam->iconInfo with the 
  parser-owned windowIcon->iconInfo pointer. After the parser callback returns, 
  update_recv_window_info_order() frees window_icon.iconInfo, but the queued 
  async message still retains and later dispatches that stale pointer. A 
  malicious or compromised RDP server sending a crafted RAIL Window Alternate 
  Secondary Order with WINDOW_ORDER_ICON can trigger use-after-free, leading to 
  memory corruption and client crash.
