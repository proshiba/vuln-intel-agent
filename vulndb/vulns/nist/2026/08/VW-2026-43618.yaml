title: rsync 3.0.1 before 3.5.0 contains an out-of-bounds write vulnerability in
  the read_args() function that allows a malicious sender to corrupt adjacent 
  heap memory by sending a crafted argument list. When the argument count causes
  the argv allocation to be exactly full, the trailing NULL terminator is 
  written one slot beyond the allocation boundary, corrupting adjacent heap 
  memory.
