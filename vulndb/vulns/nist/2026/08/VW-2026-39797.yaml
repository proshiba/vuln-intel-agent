title: "Issue summary: A malicious TLS server can cause a memory leak in a TLS\nclient
  that has enabled OCSP response checking by sending an OCSP\nresponse that contains
  no single response entries.\n\nImpact summary: An attacker can leak an attacker-tunable
  amount of memory\nper TLS handshake in a victim client application. A long-running
  client\nthat repeatedly connects to a malicious server can have its memory\nexhausted,
  resulting in a Denial of Service.\n\nCWE: CWE-401: Missing Release of Memory after
  Effective Lifetime\n\nDescription: The affected function is called during X.509
  certificate\nchain verification when OCSP response checking is enabled\nwith the
  X509_V_FLAG_OCSP_RESP_CHECK or X509_V_FLAG_OCSP_RESP_CHECK_ALL\nverification flags,
  for example when a TLS client verifies an OCSP\nresponse stapled into the TLS handshake
  by the server.\n\nWhen the received BasicOCSPResponse contains an empty SEQUENCE
  OF\nSingleResponse, which is permitted on the wire and accepted by the\nOpenSSL
