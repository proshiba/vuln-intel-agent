title: Weblate is a web-based continuous localization platform used to manage 
  software translations. In versions prior to 2026.7, a team can require its 
  members to configure two-factor authentication before receiving the team's 
  permissions, but this requirement is not enforced for site-wide global 
  permissions. As a result, a user who belongs to a team that enforces 2FA and 
  grants a global permission still receives that global permission even without 
  2FA configured, while the same requirement is correctly applied to project-, 
  component-, and workspace-scoped permissions. Such a user can act on the 
  granted global permission, including reaching the site management interface at
  /manage/. This issue is fixed in version 2026.7.
