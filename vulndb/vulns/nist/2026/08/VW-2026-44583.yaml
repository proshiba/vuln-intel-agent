title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: sja1105: round up PTP perout pin duration\n\npin_duration is converted from
  the user-provided period to SJA1105\nclock ticks and is later passed as the cycle_time
  argument to\nfuture_base_time().\n\nVery small period values may become zero after
  the conversion,\nwhich can lead to a division by zero in future_base_time().\n\n\
  Round zero pin_duration up to 1 tick so that the smallest unsupported\nperiods use
  the minimum non-zero hardware duration instead of passing\nzero to future_base_time()."
