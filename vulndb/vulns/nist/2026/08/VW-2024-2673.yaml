title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Move events notifier registration to be after device registration\n\nMove pkey change
  work initialization and cleanup from device resources\nstage to notifier stage,
  since this is the stage which handles this work\nevents.\n\nFix a race between the
  device deregistration and pkey change work by moving\nMLX5_IB_STAGE_DEVICE_NOTIFIER
  to be after MLX5_IB_STAGE_IB_REG in order to\nensure that the notifier is deregistered
  before the device during cleanup.\nWhich ensures there are no works that are being
  executed after the\ndevice has already unregistered which can cause the panic below.\n\
  \nBUG: kernel NULL pointer dereference, address: 0000000000000000\nPGD 0 P4D 0\n\
  Oops: 0000 [#1] PREEMPT SMP PTI\nCPU: 1 PID: 630071 Comm: kworker/1:2 Kdump: loaded
  Tainted: G W OE --------- --- 5.14.0-162.6.1.el9_1.x86_64 #1\nHardware name: Microsoft
  Corporation Virtual Machine/Virtual Machine, BIOS 090008 02/27/2023\nWorkqueue:
  events pkey_chang"
