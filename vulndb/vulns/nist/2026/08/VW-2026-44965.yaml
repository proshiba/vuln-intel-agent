title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  btintel: Validate length before parsing diagnostics TLV\n\nbtintel_diagnostics()
  accesses tlv->val[0] without first validating\nthat the diagnostics VSE is long
  enough to contain that field, so\nmay cause reading data beyond the received frame.\n\
  \nFix by validating the length before access."
