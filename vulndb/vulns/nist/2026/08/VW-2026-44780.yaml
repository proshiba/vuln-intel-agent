title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  fix UAF by restoring RCU-delayed inode freeing in bpffs\n\ncommit 4f375ade6aa9 (\"\
  bpf: Avoid RCU context warning when unpinning\nhtab with internal structs\") moved
  inode cleanup from ->free_inode()\ninto ->destroy_inode() to avoid sleeping in RCU
  context when calling\nbpf_any_put(). However this removed the RCU delay on freeing
  the\ninode itself and the cached symlink body (i_link), both of which\ncan be accessed
  by RCU pathwalk (pick_link, may_lookup etc.).\n\nThis causes a use-after-free when
  a concurrent unlinkat() drops the\nlast inode reference and destroy_inode() frees
  the inode immediately,\nwhile another task is still walking the path in RCU mode
  and reads\ninode->i_opflags (offset +2) inside current_time() -> is_mgtime().\n\n\
  KASAN reports:\n  BUG: KASAN: slab-use-after-free in is_mgtime include/linux/fs.h:2313\n\
  \  Read of size 2 at addr ffff8880407e4282 (offset +2 = i_opflags)\n\nThe rules
  (per Al Viro):\n  ->destroy_inode()"
