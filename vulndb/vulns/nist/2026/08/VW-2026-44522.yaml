title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  avoid stale runlist element dereference in fallocate\n\nntfs_attr_fallocate() allocates
  holes and delayed allocations inside\ninitialized size by looking up the current
  runlist element under\nni->runlist.lock. The returned struct runlist_element is
  only a borrowed\npointer into ni->runlist.rl. A writer can replace and free that
  array\nafter the read lock is dropped, so later reads of rl->lcn, rl->length and\n\
  rl->vcn can touch freed memory.\n\nThe buggy scenario involves two paths, with each
  column showing the order\nwithin that path:\n\nntfs_attr_fallocate():\n  1. Take
  ni->runlist.lock for read.\n  2. Get rl from ntfs_attr_find_vcn_nolock().\n  3.
  Drop ni->runlist.lock.\n  4. Read rl->lcn, rl->length and rl->vcn.\n\nmmap page_mkwrite:\n\
  \  1. Enter ntfs_filemap_page_mkwrite().\n  2. Reach __ntfs_write_iomap_begin()
  and ntfs_attr_map_cluster().\n  3. Merge allocation state with ntfs_runlists_merge().\n\
  \  4. Reallocate ni->runlist.rl in "
