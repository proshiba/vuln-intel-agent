title: ArcadeDB server (com.arcadedb:arcadedb-server) in versions 26.7.3 and 
  earlier fails to propagate the authenticated principal to asynchronous command
  worker threads. When an HTTP command is submitted with awaitResponse:false, it
  executes on an async worker whose DatabaseContext has no bound user, causing 
  the scripting authorization gate to become a no-op. A user with only read 
  access to a single database can submit an asynchronous JavaScript 
  (language=js) command via the /api/v1/command endpoint to run code with 
  unrestricted host access (e.g., database.getSecurity().createUser) and create 
  a server-wide administrator, escalating to full administrative control. Fixed 
  in 26.8.1.
