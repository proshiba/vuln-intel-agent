title: A vulnerability was determined in Kamailio up to 5.5.0/6.0.7. This 
  affects the function get_4bytes of the file 
  src/modules/ims_registrar_scscf/cxdx_avp.c of the component AVP Handler. 
  Executing a manipulation can lead to out-of-bounds read. The attack may be 
  performed from remote. The exploit has been publicly disclosed and may be 
  utilized. This patch is called abb5d60af6eefbd367bf6588c5589566b090e272. It is
  advisable to implement a patch to correct this issue. The vendor points out, 
  that "[v]ersion 5.5.0 is old and not maintained anymore."
