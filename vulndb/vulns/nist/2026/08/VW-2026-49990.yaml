title: A flaw has been found in zackees transcribe-anything up to 4.1.0. 
  Affected is the function ytdlp_download of the file 
  src/transcribe_anything/ytldp_download.py of the component Yt-dlp Download. 
  This manipulation of the argument url causes os command injection. The attack 
  may be initiated remotely. The attack's complexity is rated as high. The 
  exploitability is told to be difficult. The exploit has been published and may
  be used. The project was informed of the problem early through an issue report
  but has not responded yet.
