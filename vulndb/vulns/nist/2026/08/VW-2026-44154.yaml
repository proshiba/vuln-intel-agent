title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject negative const offsets for buffer pointers\n\nThe verifier rejects variable
  offsets for PTR_TO_TP_BUFFER and PTR_TO_BUF\naccesses, but it currently accepts
  a constant negative offset produced by\npointer arithmetic.\n\nCommit 022ac0750883
  (\"bpf: use reg->var_off instead of reg->off for\npointers\") moved constant pointer
  offsets from reg->off to reg->var_off.\nHowever, __check_buffer_access() continued
  to check only the instruction\noffset. An access with reg->var_off equal to -8 and
  an instruction offset\nof zero therefore passes verification.\n\nFor writable raw
  tracepoints, the access end is also calculated from the\nunsigned reg->var_off.value.
  An eight-byte access starting at -8 wraps\nthe calculated end to zero, allowing
  the program to load and attach\nwithout increasing max_tp_access.\n\nAfter ensuring
  that reg->var_off is constant, calculate the effective\naccess start using signed
  arithmetic and reject it when it is"
