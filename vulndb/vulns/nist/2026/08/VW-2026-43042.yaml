title: "An authorization bypass vulnerability in Vulnerability-Lookup allowed inactive
  or unconfirmed accounts to subscribe to Server-Sent Events (SSE) streams through
  the /pubsub/subscribe/<topic> endpoint.\n\n\nThe token_required decorator used by
  the Pub/Sub interface authenticated requests solely by matching the X-API-KEY header
  against an existing user API key. Unlike the REST API authentication mechanism,
  it did not verify the account's is_active and is_confirmed state.\n\n\nBecause the
  self-registration process issues an API key before account confirmation is completed,
  an attacker could create an account and immediately use the resulting API key to
  access Pub/Sub topics that should only be available to active, confirmed users.
  This could expose stream events that would otherwise be inaccessible through the
  REST API, including newly submitted or not-yet-moderated data such as comments.\n\
  \n\nThe vulnerability results from inconsistent authorization enforcement between
  the REST API and the SSE str"
