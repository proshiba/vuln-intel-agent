title: The Event Booking Manager for WooCommerce  WordPress plugin before 5.3.7 
  does not prevent the deserialization of user-controlled input in some of its 
  event content fields, allowing users with Contributor-level access and above 
  to inject PHP objects. No POP chain is present in the Event Booking Manager 
  for WooCommerce  WordPress plugin before 5.3.7 itself, but if one is present 
  via another installed Event Booking Manager for WooCommerce  WordPress plugin 
  before 5.3.7 or , this could lead to actions such as arbitrary file deletion, 
  sensitive data retrieval, or remote code execution. This is an incomplete fix 
  of the Event Booking Manager for WooCommerce  WordPress plugin before 5.3.7's 
  earlier object-injection advisories.
