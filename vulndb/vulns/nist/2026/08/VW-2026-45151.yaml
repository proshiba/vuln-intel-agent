title: Scriban before 6.6.0 contains an infinite recursion vulnerability in 
  object rendering when the ObjectRecursionLimit property defaults to unlimited.
  Attackers can supply circular reference objects to the template context, 
  exhausting stack space and triggering an uncatchable StackOverflowException 
  that terminates the hosting process.
