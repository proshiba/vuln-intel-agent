title: 'MemOS is a memory operating system for LLMs and AI agents. In deployments
  where authentication is enabled (AUTH_ENABLED=true) but the undocumented, defaultless
  INTERNAL_SERVICE_SECRET environment variable is unset, the is_internal_request()
  check in src/memos/api/middleware/auth.py fails open: os.getenv("INTERNAL_SERVICE_SECRET")
  returns None and a request omitting the X-Internal-Service header also yields None,
  so the comparison None == None evaluates true. The request is then treated as a
  trusted internal principal and granted scopes: ["all"]. As a result, an unauthenticated
  remote attacker can reach the admin API-key management endpoints to mint API keys
  for any user, enumerate keys, revoke keys, and generate a master key for persistent
  privileged access, as well as all data endpoints.'
