title: A security flaw has been discovered in treefrogframework 
  treefrog-framework up to 2.11.2. This vulnerability affects the function 
  std::strncmp of the file src/tsessioncookiestore.cpp of the component Session 
  Cookie Handler. The manipulation results in improper authentication. The 
  attack can be launched remotely. A high complexity level is associated with 
  this attack. It is stated that the exploitability is difficult. The exploit 
  has been released to the public and may be used for attacks. The vendor was 
  contacted early about this disclosure.
