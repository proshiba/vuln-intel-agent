title: A flaw was found in Red Hat Quay. When the SECURITY_SCANNER_V4_PSK 
  (pre-shared key) is not set, a remote unauthenticated attacker can send POST 
  requests to the security scanner notification endpoint. This allows the 
  attacker to flood the notification queue and inject path traversal characters 
  into Clair API URL paths. The primary consequence is worker resource 
  exhaustion and blind path manipulation on the configured Clair host, 
  potentially leading to a denial of service.
