title: An issue was discovered in Kernel 5.x in Insyde InsydeH2O, affecting 
  HddPassword. Software SMI services that use the Communicate() function of the 
  EFI_SMM_COMMUNICATION_PROTOCOL do not check whether the address of the buffer 
  is valid, which allows use of SMRAM, MMIO, or OS kernel addresses.
