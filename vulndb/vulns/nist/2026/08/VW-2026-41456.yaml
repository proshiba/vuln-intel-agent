title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/checksum:
  Fix csum_partial() without vector facility\n\nCurrently csum_partial() calls csum_copy()
  with copy=false and dst=NULL.\nOn machines without the vector facility, csum_copy()
  falls back to\ncksm(dst, ...), causing the checksum to be calculated from address
  zero\ninstead of the source buffer.\n\nThe VX implementation already checksums data
  loaded from src. Make the\nfallback do the same by passing src to cksm()."
