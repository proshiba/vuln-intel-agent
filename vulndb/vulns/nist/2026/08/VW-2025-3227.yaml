title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix WARNING in mark_buffer_dirty due to discarded buffer reuse\n\nA syzbot stress
  test using a corrupted disk image reported that\nmark_buffer_dirty() called from
  __nilfs_mark_inode_dirty() or\nnilfs_palloc_commit_alloc_entry() may output a kernel
  warning, and can\npanic if the kernel is booted with panic_on_warn.\n\nThis is because
  nilfs2 keeps buffer pointers in local structures for some\nmetadata and reuses them,
  but such buffers may be forcibly discarded by\nnilfs_clear_dirty_page() in some
  critical situations.\n\nThis issue is reported to appear after commit 28a65b49eb53
  (\"nilfs2: do\nnot write dirty data after degenerating to read-only\"), but the
  issue has\npotentially existed before.\n\nFix this issue by checking the uptodate
  flag when attempting to reuse an\ninternally held buffer, and reloading the metadata
  instead of reusing the\nbuffer if the flag was lost."
