title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/probes:
  Fix MAX_TRACE_ARGS limit handling\n\nWhen creating a trace_probe we would set nr_args
  prior to truncating the\narguments to MAX_TRACE_ARGS. However, we would only initialize
  arguments\nup to the limit.\n\nThis caused invalid memory access when attempting
  to set up probes with\nmore than 128 fetchargs.\n\n  BUG: kernel NULL pointer dereference,
  address: 0000000000000020\n  #PF: supervisor read access in kernel mode\n  #PF:
  error_code(0x0000) - not-present page\n  PGD 0 P4D 0\n  Oops: Oops: 0000 [#1] PREEMPT
  SMP PTI\n  CPU: 0 UID: 0 PID: 1769 Comm: cat Not tainted 6.11.0-rc7+ #8\n  Hardware
  name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.16.3-1.fc39 04/01/2014\n  RIP:
  0010:__set_print_fmt+0x134/0x330\n\nResolve the issue by applying the MAX_TRACE_ARGS
  limit earlier. Return\nan error when there are too many arguments instead of silently\n\
  truncating."
