title: "Description\n\n\n\nCloudflare was recently notified by external researchers
  of vulnerabilities in this archived repository, including a remote code execution
  issue in `src/index.ts` reachable from certain GitHub Actions workflow configurations.
  Successful exploitation may expose workflow secrets such as CLOUDFLARE_API_TOKEN
  and GITHUB_TOKEN to an attacker. Because this repository has been deprecated since
  2024, Cloudflare will not be issuing patches. To remediate this issue, we recommend
  migrating to `cloudflare/wrangler-action` immediately. Consumers who have already
  migrated are not affected.\n\n\n\n\nSunset Date\n\n\n\nThe cloudflare/pages-action
  repository will be removed on 2026-09-18. Consumers must complete migration before
  18th September to avoid CI disruption.\n\n\n\n\nAffected Versions\n\n\n\nAll published
  versions of cloudflare/pages-action, including consumers pinned to the v1 moving
  tag.\n\n\n\n\nPatched Versions\n\n\n\nNone. This repository will not receive further
  updates, including security patches.\n"
