title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  fix race between delayed_work() and ceph_monc_stop()\n\nThe way the delayed work
  is handled in ceph_monc_stop() is prone to\nraces with mon_fault() and possibly
  also finish_hunting().  Both of\nthese can requeue the delayed work which wouldn't
  be canceled by any of\nthe following code in case that happens after cancel_delayed_work_sync()\n\
  runs -- __close_session() doesn't mess with the delayed work in order\nto avoid
  interfering with the hunting interval logic.  This part was\nmissed in commit b5d91704f53e
  (\"libceph: behave in mon_fault() if\ncur_mon < 0\") and use-after-free can still
  ensue on monc and objects\nthat hang off of it, with monc->auth and monc->monmap
  being\nparticularly susceptible to quickly being reused.\n\nTo fix this:\n\n- clear
  monc->cur_mon and monc->hunting as part of closing the session\n  in ceph_monc_stop()\n\
  - bail from delayed_work() if monc->cur_mon is cleared, similar to how\n  it's done
  in mon_fault"
