title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  Fix invalid page access after closing deferred I/O devices\n\nWhen a fbdev with
  deferred I/O is once opened and closed, the dirty\npages still remain queued in
  the pageref list, and eventually later\nthose may be processed in the delayed work.\
  \  This may lead to a\ncorruption of pages, hitting an Oops.\n\nThis patch makes
  sure to cancel the delayed work and clean up the\npageref list at closing the device
  for addressing the bug.  A part of\nthe cleanup code is factored out as a new helper
  function that is\ncalled from the common fb_release()."
