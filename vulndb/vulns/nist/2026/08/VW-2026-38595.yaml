title: Contao is an Open Source CMS. In versions 5.7.0 through 5.7.6, an 
  authenticated backend user who can access one job can request an attachment 
  identifier containing ../ segments and make the job attachment download 
  endpoint read a file from another job directory inside var/job-attachments. 
  The controller authorizes only the jobUuid route parameter. The later 
  attachment lookup joins that authorized job UUID with the attacker-controlled 
  identifier, then passes the combined path to the virtual filesystem. 
  VirtualFilesystem::resolve() canonicalizes the whole path and only rejects 
  paths that escape the filesystem mount, so 
  authorized-job/../victim-job/debug_log.csv becomes victim-job/debug_log.csv. 
  This is a cross-job authorization bypass for known job attachment paths. It is
  not a practical brute-force against unknown jobs because job directories are 
  UUID v4 values.
