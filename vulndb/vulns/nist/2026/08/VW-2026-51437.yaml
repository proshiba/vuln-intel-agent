title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  re-fetch eth header after route_shortcircuit()\n\nBefore route_shortcircuit(), the
  eth header pointer is cached from eth_hdr(skb).\n\nInside route_shortcircuit(),
  pskb_may_pull() can be called, which may\nreallocate skb->head.\n\nIn this case,
  returning to vxlan_xmit() leaves the cached eth pointer pointing to\nfreed memory,
  leading to a use-after-free when dereferencing eth->h_dest.\n\nFix this by updating
  eth = eth_hdr(skb) after calling route_shortcircuit()."
