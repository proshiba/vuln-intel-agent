title: The Database Collation Fix plugin for WordPress is vulnerable to 
  time-based SQL Injection via the 'force-collation-algorithm' parameter in all 
  versions up to, and including, 1.2.10 due to insufficient escaping on the user
  supplied parameter and lack of sufficient preparation on the existing SQL 
  query. This makes it possible for unauthenticated attackers to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. Exploitation requires a 
  trigger.txt file to be present in the plugin's directory 
  (/wp-content/plugins/database-collation-fix/trigger.txt), a condition created 
  by DesktopServer integration events such as site creation, copy, import, move,
  export, or deploy.
