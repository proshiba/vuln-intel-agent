title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mctp i3c: clean up notifier and buses if driver register fails\n\nmctp_i3c_mod_init()
  registers the I3C bus notifier and then walks the\nexisting buses with i3c_for_each_bus_locked(mctp_i3c_bus_add_new,
  NULL)\nbefore registering the I3C device driver.  If i3c_driver_register()\nfails,
  the function returns the error directly, leaving the notifier\nregistered and every
  mctp_i3c_bus object created for the existing buses\nallocated.  The notifier is
  left pointing into the module that failed to\nload and the bus list is leaked.\n\
  \nMirror the module exit path on this failure: unregister the notifier and\ntear
  down the buses that were added before returning the error.\n\nThis issue was identified
  during our ongoing static-analysis research while\nreviewing kernel code."
