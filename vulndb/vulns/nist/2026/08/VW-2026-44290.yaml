title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: add locking when updating filter and timer values\n\nKCSAN detected a simultaneous
  access to timer values that can be\noverwritten in bcm_rx_setup() when updating
  timer and filter content\nwhile bcm_rx_handler(), bcm_rx_timeout_handler() or bcm_rx_thr_handler()\n\
  run concurrently on incoming CAN traffic.\n\nProtect the timer (ival1/ival2/kt_ival1/kt_ival2/kt_lastmsg)
  and filter\n(nframes/flags/frames/last_frames) updates in bcm_rx_setup() with a
  new\nper-op bcm_rx_update_lock, taken with the matching scope in the RX\nhandlers.
  memcpy_from_msg() is staged into a temporary buffer before the\nlock is taken, since
  it can sleep and must not run under a spinlock.\n\nhrtimer_cancel() is always called
  without bcm_rx_update_lock held, since\nbcm_rx_timeout_handler()/bcm_rx_thr_handler()
  take the same lock and a\nrunning callback would otherwise deadlock against the
  canceller.\n\nAlso close a related race: bcm_rx_setup() cleared the RT"
