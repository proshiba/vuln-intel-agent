title: "In the Linux kernel, the following vulnerability has been resolved:\n\n9p:
  set req refcount to zero to avoid uninitialized usage\n\nWhen a new request is allocated,
  the refcount will be zero if it is\nreused, but if the request is newly allocated
  from slab, it is not fully\ninitialized before being added to idr.\n\nIf the p9_read_work
  got a response before the refcount initiated. It will\nuse a uninitialized req,
  which will result in a bad request data struct.\n\nHere is the logs from syzbot.\n\
  \nCorrupted memory at 0xffff88807eade00b [ 0xff 0x07 0x00 0x00 0x00 0x00\n0x00 0x00
  . . . . . . . . ] (in kfence-#110):\n p9_fcall_fini net/9p/client.c:248 [inline]\n\
  \ p9_req_put net/9p/client.c:396 [inline]\n p9_req_put+0x208/0x250 net/9p/client.c:390\n\
  \ p9_client_walk+0x247/0x540 net/9p/client.c:1165\n clone_fid fs/9p/fid.h:21 [inline]\n\
  \ v9fs_fid_xattr_set+0xe4/0x2b0 fs/9p/xattr.c:118\n v9fs_xattr_set fs/9p/xattr.c:100
  [inline]\n v9fs_xattr_handler_set+0x6f/0x120 fs/9p/xattr.c:159\n __vfs_setxattr+0x119/0x180
  fs/xattr."
