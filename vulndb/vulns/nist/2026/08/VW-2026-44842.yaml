title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  handle CB.InitCallBackState3 requests without a server record\n\nThe cache manager
  callback path now attaches the server record to an\nincoming call through the rxrpc
  peer's app data.  That association is\nnot guaranteed to exist for every callback
  request, and most callback\nhandlers already tolerate that case.\n\nMake CB.InitCallBackState3
  follow the same pattern by checking whether a\nserver record was attached before
  using it.  If the peer is not mapped\nto a server record, trace the request and
  ignore it, matching the\nexisting behaviour for other unmatched callback requests.\n\
  \nThis keeps the callback handler consistent with the rest of the cache\nmanager
  service and avoids depending on peer state that may not be\navailable for a given
  request."
