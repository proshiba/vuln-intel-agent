title: A flaw was found in SSSD. The extract_authtok_v1() function in the PAM 
  responder does not validate the auth_token_length field against the remaining 
  buffer size before processing. A local attacker can exploit this via a crafted
  protocol v1 request to the PAM responder socket, causing an out-of-bounds read
  and process crash, resulting in a denial of service.
