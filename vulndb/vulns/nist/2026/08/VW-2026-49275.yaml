title: The InfusedWoo Pro plugin for WordPress is vulnerable to Privilege 
  Escalation via Account Takeover in all versions up to, and including, 5.1.17. 
  This is due to a missing capability check in the `ajax_iwar_preview_email()` 
  function, which uses `is_admin()` as its only authorization check and allows 
  low-privilege users to render email preview merge fields for an arbitrary 
  email address. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to generate and retrieve a valid password 
  reset link for any WordPress user, including administrators, enabling account 
  takeover.
