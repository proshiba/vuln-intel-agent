title: Dragonfly is an in-memory data store built for modern application 
  workloads. Prior to 1.40.0, CMS.INITBYDIM and CMS.INITBYPROB accept dimensions
  whose width times depth times sizeof(int64_t) overflows in src/core/cms.cc, 
  allocating an undersized counter buffer while CMS.INCRBY and CMS.QUERY use the
  unbounded dimensions, which allows an unauthenticated remote client to corrupt
  or disclose adjacent heap memory and crash the server. This issue is fixed in 
  version 1.40.0.
