title: "A critical OS command injection vulnerability has been identified in the\n\
  \ Haiwell IoT Cloud HMI Gateway product. The vulnerability exists in the \nNet Check
  feature accessible via the /setting endpoint. The cmdPing \nSocket.io event fails
  to properly sanitize user-supplied input before \npassing it to the underlying operating
  system, allowing an attacker to \ninject and execute arbitrary OS commands with
  root privileges."
