title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath10k: Delay the unmapping of the buffer\n\nOn WCN3990, we are seeing a rare scenario
  where copy engine hardware is\nsending a copy complete interrupt to the host driver
  while still\nprocessing the buffer that the driver has sent, this is leading into
  an\nSMMU fault triggering kernel panic. This is happening on copy engine\nchannel
  3 (CE3) where the driver normally enqueues WMI commands to the\nfirmware. Upon receiving
  a copy complete interrupt, host driver will\nimmediately unmap and frees the buffer
  presuming that hardware has\nprocessed the buffer. In the issue case, upon receiving
  copy complete\ninterrupt, host driver will unmap and free the buffer but since hardware\n\
  is still accessing the buffer (which in this case got unmapped in\nparallel), SMMU
  hardware will trigger an SMMU fault resulting in a\nkernel panic.\n\nIn order to
  avoid this, as a work around, add a delay before unmapping\nthe copy engine source
  DMA buffer. "
