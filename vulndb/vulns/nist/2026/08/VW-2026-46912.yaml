title: 'Vulnerability in the Oracle Business Intelligence Enterprise Edition product
  of Oracle Analytics (component: Presentation Services).   The supported version
  that is affected is 12.2.1.4.0. Easily exploitable vulnerability allows low privileged
  attacker with logon to the infrastructure where Oracle Business Intelligence Enterprise
  Edition executes to compromise Oracle Business Intelligence Enterprise Edition.  Successful
  attacks require human interaction from a person other than the attacker. Successful
  attacks of this vulnerability can result in takeover of Oracle Business Intelligence
  Enterprise Edition. CVSS 3.1 Base Score 7.3 (Confidentiality, Integrity and Availability
  impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H).'
