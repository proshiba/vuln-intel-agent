title: ePA 3.x Integration implements the authorization workflow and writes 
  Medical Information Objects to Germany's electronic patient record. Prior to 
  1.3.0, ePA 3.x Integration disables TLS certificate verification for both ePA 
  connections in app/vau/VAUProtokoll.py and Konnektor connections in 
  app/konnektor/Konnektor.py. A network-positioned attacker can present an 
  arbitrary certificate, terminate the TLS connection, and intercept ePA 
  traffic. The VAU protocol does not provide an effective fallback because its 
  application-layer certificate validation is also broken in affected versions. 
  The Konnektor session uses self.session.verify set to False while the client 
  authenticates with self.session.cert, so an attacker impersonating the 
  Konnektor can receive the client's mutual TLS certificate exchange and observe
  smartcard operations. This issue is fixed in version 1.3.0.
