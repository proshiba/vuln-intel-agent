title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmemcg:
  fix possible use-after-free in memcg_write_event_control()\n\nmemcg_write_event_control()
  accesses the dentry->d_name of the specified\ncontrol fd to route the write call.\
  \  As a cgroup interface file can't be\nrenamed, it's safe to access d_name as long
  as the specified file is a\nregular cgroup file.  Also, as these cgroup interface
  files can't be\nremoved before the directory, it's safe to access the parent too.\n\
  \nPrior to 347c4a874710 (\"memcg: remove cgroup_event->cft\"), there was a\ncall
  to __file_cft() which verified that the specified file is a regular\ncgroupfs file
  before further accesses.  The cftype pointer returned from\n__file_cft() was no
  longer necessary and the commit inadvertently dropped\nthe file type check with
  it allowing any file to slip through.  With the\ninvarients broken, the d_name and
  parent accesses can now race against\nrenames and removals of arbitrary files and
  cause use-after-free's.\n\nFix the"
