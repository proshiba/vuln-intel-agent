title: Grav versions before 2.0.13 fail to properly validate backup profile root
  paths, allowing attackers to archive directories outside GRAV_ROOT when not in
  the hard-coded deny-list. Attackers with profile editor access can configure 
  backup profiles with traversal paths to expose sensitive files from locations 
  like /opt, /mnt, or /srv.
