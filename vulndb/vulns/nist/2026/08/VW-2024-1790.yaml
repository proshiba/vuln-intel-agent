title: "In the Linux kernel, the following vulnerability has been resolved:\n\naio:
  Fix null ptr deref in aio_complete() wakeup\n\nlist_del_init_careful() needs to
  be the last access to the wait queue\nentry - it effectively unlocks access.\n\n\
  Previously, finish_wait() would see the empty list head and skip taking\nthe lock,
  and then we'd return - but the completion path would still\nattempt to do the wakeup
  after the task_struct pointer had been\noverwritten."
