title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, swarm.getNodes, swarm.getNodeInfo, swarm.getNodeApps, and 
  swarm.getAppInfos in apps/dokploy/server/api/routers/swarm.ts accept another 
  organization’s serverId without an activeOrganizationId ownership check, and 
  getNodeInfo in packages/server/src/services/docker.ts interpolates nodeId into
  execAsyncRemote, allowing a caller with server:read permission to execute 
  arbitrary commands as the configured SSH user on another tenant’s server. This
  issue is fixed in version 0.29.13.
