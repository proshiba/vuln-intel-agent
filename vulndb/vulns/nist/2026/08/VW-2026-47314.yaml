title: "Allocation of Resources Without Limits or Throttling in ZenHive mpp allows
  an unauthenticated remote client to drain the fee-payer wallet through concurrent
  sponsored payments, denying service to legitimate payers once it is empty.\n\nMPP.Methods.Tempo.FeePayerPolicy
  enforces its ceilings (max_gas, max_fee_per_gas, max_priority_fee_per_gas, the worst-case
  gas_limit * max_fee_per_gas <= max_total_fee budget cap, and a validity window)
  against one transaction at a time, and nothing accounts for exposure across concurrent
  requests. reserve_hash_atomic/2 is keyed on the transaction hash, so it prevents
  duplicate broadcast of the same signed transaction but not N distinct sponsored
  transactions carrying distinct expiring nonces. Committed sponsor exposure is therefore
  N times max_total_fee, bounded by nothing in the library, and the default 900 second
  validity window lets co-signed transactions stay broadcastable and uncounted for
  that entire period.\n\nThis issue affects mpp: from 0.2.0 before"
