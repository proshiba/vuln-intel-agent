title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix a null-ptr-deref in tipc_topsrv_accept\n\nsyzbot found a crash in tipc_topsrv_accept:\n\
  \n  KASAN: null-ptr-deref in range [0x0000000000000008-0x000000000000000f]\n  Workqueue:
  tipc_rcv tipc_topsrv_accept\n  RIP: 0010:kernel_accept+0x22d/0x350 net/socket.c:3487\n\
  \  Call Trace:\n   <TASK>\n   tipc_topsrv_accept+0x197/0x280 net/tipc/topsrv.c:460\n\
  \   process_one_work+0x991/0x1610 kernel/workqueue.c:2289\n   worker_thread+0x665/0x1080
  kernel/workqueue.c:2436\n   kthread+0x2e4/0x3a0 kernel/kthread.c:376\n   ret_from_fork+0x1f/0x30
  arch/x86/entry/entry_64.S:306\n\nIt was caused by srv->listener that might be set
  to null by\ntipc_topsrv_stop() in net .exit whereas it's still used in\ntipc_topsrv_accept()
  worker.\n\nsrv->listener is protected by srv->idr_lock in tipc_topsrv_stop(), so
  add\na check for srv->listener under srv->idr_lock in tipc_topsrv_accept() to\n\
  avoid the null-ptr-deref. To ensure the lsock is not released during the\ntipc"
