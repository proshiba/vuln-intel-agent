title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/efa:
  Fix wrong resources deallocation order\n\nWhen trying to destroy QP or CQ, we first
  decrease the refcount and\npotentially free memory regions allocated for the object
  and then\nrequest the device to destroy the object. If the device fails, the\nobject
  isn't fully destroyed so the user/IB core can try to destroy the\nobject again which
  will lead to underflow when trying to decrease an\nalready zeroed refcount.\n\n\
  Deallocate resources in reverse order of allocating them to safely free\nthem."
