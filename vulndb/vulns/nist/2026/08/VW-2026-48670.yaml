title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/lru_sort:
  error out for >10000 active_mem_bp\n\ndamos_quota_score() can trigger division by
  zero if the target value is\nzero.  DAMON_LRU_SORT lets users set the target value
  for the hot memory\nscheme via active_mem_bp parameter.  It avoids setting it as
  the target\nvalue if the parameter value is zero.  However, it also sets the cold\n\
  memory scheme with a target value that is calculated as '10000 -\nactive_mem_bp
  + 2'.  Hence, if a user sets active_mem_bp 10002, the cold\nmemory scheme's quota
  goal target value can be zero.  As a result,\ndivision by zero can be triggered.\
  \  Fix by returning an error when the\nuser tries to start DAMON with >10000 active_mem_bp
  parameter value.\n\nIt makes no sense to set active_mem_bp with 10002.  It also
  requires\nmodule parameters write permission to reproduce the issue.  That said,
  the\nconsequence is quite bad.\n\nOne reliable way to reproduce the issue is like
  below:\n\n    # cd /sys/mo"
