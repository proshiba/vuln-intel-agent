title: CamaleonCMS 2.9.1 contains an authenticated SQL injection vulnerability 
  that allows authenticated attackers with post creation or editing privileges 
  to submit a crafted slug value containing SQL syntax that the database backend
  evaluates as part of an inadequately parameterized query. Attackers can supply
  malicious slug payloads using boolean- or union-style blind SQL injection 
  techniques to extract sensitive data from the underlying SQLite database, 
  including administrative credentials and configuration values stored in 
  application tables.
