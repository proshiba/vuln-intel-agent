title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/gpusvm:
  publish dpagemap early to avoid device mapping leak on error\n\ndrm_gpusvm_get_pages()
  only stored the local dpagemap into\nsvm_pages->dpagemap on the success path. If
  a later page failed (e.g.\n-EOPNOTSUPP when ctx->allow_mixed is false) and jumped
  to err_unmap,\nsvm_pages->dpagemap was still NULL, so __drm_gpusvm_unmap_pages()
  skipped\ndevice_unmap() and leaked the device mappings already created.\n\nAssign
  svm_pages->dpagemap when the first device page is mapped so the\nerr_unmap path
  can device_unmap() those mappings.\n\nThis issue was found by Sashiko AI review."
