title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/guc:
  Keep scheduler timeline name alive\n\nThe scheduler keeps a pointer to the timeline
  name, but q->name\nis freed with the exec queue while scheduler fences can still\n\
  reference it.\n\nStore the name in struct xe_guc_exec_queue so it shares\nthe scheduler's
