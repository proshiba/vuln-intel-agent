  Fix undersized format-check buffer\n\nfmt_buffer_size in dasd_eckd_check_device_format()
  is declared as\nint, even though one of the multiplicands, sizeof(struct eckd_count),\n\
  is a size_t. The expression\n\n    trkcount * rpt_max * sizeof(struct eckd_count)\n\
  \nis therefore correctly evaluated at 64-bit width, but the result is\nsilently
  truncated when it is stored back into the 32-bit\nfmt_buffer_size variable. For
  a sufficiently large track range\n(start_unit/stop_unit are caller-controlled) this
