title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  nuvoton: npcm-video: fix memory leaks in probe and remove\n\nnpcm_video_probe()
  allocates the npcm_video structure with kzalloc_obj()\nbut never frees it on any
  probe error path or in npcm_video_remove(),\nleaking the allocation on every failed
  probe and every normal unbind.\n\nAdditionally, when npcm_video_setup_video() fails,
  the reserved memory\nassociation established by of_reserved_mem_device_init() in\n\
  npcm_video_init() is not released, leaking the rmem_assigned_device\nentry on the
  global list.\n\nFix both by adding kfree(video) to all probe error paths and to\n\
  npcm_video_remove(), and adding the missing\nof_reserved_mem_device_release() call
  when npcm_video_setup_video()\nfails."
