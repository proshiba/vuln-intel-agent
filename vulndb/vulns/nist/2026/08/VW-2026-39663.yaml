title: The Aerie/PlanDev sequencing-server's authorization middleware 
  (sequencing-server/src/app.ts) derives the caller's Hasura session role via 
  getHasuraSession(), which prefers a session_variables object taken directly 
  from the client-supplied JSON request body over the Authorization header's JWT
  claims, with no verification that the request actually originated from Hasura.
  By setting {"session_variables":{"x-hasura-role":"aerie_admin"}} in the body 
  of a request to POST /command-expansion/put-expansion with no Authorization 
  header, an unauthenticated attacker satisfies the role check and can insert 
  arbitrary expansion rules into sequencing.expansion_rule, which govern how 
  spacecraft activities are translated into commands. Separately, POST 
  /put-dictionary is explicitly listed in the ENDPOINTS_WHITELIST and is exempt 
  from any authentication, allowing unauthenticated writes of command 
  dictionaries.
