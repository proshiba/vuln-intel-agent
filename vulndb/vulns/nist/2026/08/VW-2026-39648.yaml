title: Pluck CMS's admin panel relies solely on a Referer-header comparison 
  (requestedByTheSameDomain() in data/inc/functions.admin.php, gating every 
  admin.php action) for CSRF protection, with no per-request anti-CSRF token 
  anywhere in the admin area. When a request carries no Referer/Host 
  information, the function's elseif branch returns true, treating the request 
  as same-origin. Because a cross-site attacker page can suppress the Referer 
  header (e.g. via <meta name=referrer content=no-referrer>), it can force an 
  authenticated administrator's browser to submit forged admin actions with no 
  valid Referer, including creating pages with raw HTML (stored XSS via the 
  rendered page) and installing PHP modules/themes (remote code execution).
