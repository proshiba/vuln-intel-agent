title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Set end correctly when doing batch carry\n\nEven though the test suite covers this
  it somehow became obscured that\nthis wasn't working.\n\nThe test iommufd_ioas.mock_domain.access_domain_destory
  would blow up\nrarely.\n\nend should be set to 1 because this just pushed an item,
