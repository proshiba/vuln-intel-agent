title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  SCO: give the socket its own sco_conn reference\n\nsco_conn_del() drops a reference
  it does not own. It takes one transient\nreference via sco_conn_hold_unless_zero()
  and releases it with the\nsco_conn_put() that follows sco_sock_hold(); the additional
  put in the\n!sk branch releases a second one:\n\n    conn = sco_conn_hold_unless_zero(conn);\n\
  \    ...\n    sk = sco_sock_hold(conn);\n    sco_conn_unlock(conn);\n    sco_conn_put(conn);\n\
  \n    if (!sk) {\n            sco_conn_put(conn);\n            return;\n    }\n\n\
  When close() races the controller's Disconnection Complete, sco_chan_del()\nclears
  conn->sk and drops the socket's reference while sco_conn_del() is\nrunning. sco_conn_del()
  then sees sk == NULL, its own put drops the count\nto zero and frees the conn, and
  the second put writes to the freed kref:\n\n    BUG: KASAN: slab-use-after-free
  in sco_conn_put.part.0+0x1a/0x190\n    Write of size 4 at addr ffff8881099dec74
  by tas"
