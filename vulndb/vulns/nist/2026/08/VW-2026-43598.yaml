title: rsync tbefore 3.5.0 contains a privilege confusion vulnerability in the 
  name-converter subprocess uid/gid mapping that allows local attackers to cause
  transferred files to be owned by root by influencing name-converter responses 
  to return empty values. When the name-converter subprocess returns an empty 
  response for a uid or gid lookup, rsync incorrectly interprets it as a 
  successful resolution to uid/gid 0 (root) rather than a lookup failure, and if
  the name-converter also signals fake super-user status, rsync proceeds with 
  root ownership assignments for transferred files.
