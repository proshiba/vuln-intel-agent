title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix UAF when sending a message\n\nIn afs_make_call(), there's a race with async
  call reception and\ndestruction.  If a call is dispatched that doesn't have call->write_iter\n\
  set (used to specify the data content for FS.StoreData), then the first\nrxrpc_kernel_send_data()
  will not set MSG_MORE in the msghdr.\n\nOnce rxrpc_send_data() queues the last request
  packet, the response could\ncome in at any time and cause the call to be completed
  and put.  However,\nafs_make_call() will look at the call again to see it ->write_iter
  should\nbe handled - something it's only allowed to do if it has its own ref on
  the\ncall.  Whilst this is the case for synchronous calls, it isn't true for\nasync
  calls such as FS.FetchData.\n\nThere's also a potential UAF in afs_make_call() in
  the event that an\nasynchronous call is being sent, but the call fails in some way
  (e.g. it\ngets aborted from the server).  The problem there is that afs_make_call()\n"
