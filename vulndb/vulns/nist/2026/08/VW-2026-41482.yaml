title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211_hwsim: clamp virtio RX length before skb_put\n\nhwsim_virtio_rx_work()
  passes the virtqueue used-ring length reported by\nthe device straight to skb_put()
  on a fixed-size receive skb. A backend\nreporting a length larger than the skb tailroom
  drives skb_put() past the\nbuffer end and hits skb_over_panic() -- a host-triggerable
  guest panic\n(denial of service).\n\nClamp the length to the skb's available room
  before skb_put(). A\nconforming device never reports more than the posted buffer
  size, so valid\nframes are unaffected; a truncated over-report then fails the\n\
  length/header checks in hwsim_virtio_handle_cmd() and is dropped, so\ntruncating
  rather than dropping here cannot be turned into a parsing\nproblem."
