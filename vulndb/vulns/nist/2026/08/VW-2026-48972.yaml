title: A local privilege escalation vulnerability exists in the Restricted 
  Access (Kiosk) Mode implementation of Scheidt & Bachmann entervo HMI prior to 
  V2 R5 P0 M5. The vulnerability affects the external PDF viewer functionality 
  used to display the application manual and its interaction with the underlying
  Windows operating system. An authenticated low-privileged user can escape the 
  kiosk environment by opening the application manual in the external PDF viewer
  and abusing the print functionality. Successful exploitation allows execution 
  of arbitrary commands outside the kiosk environment with local administrator 
  privileges.
