title: A vulnerability in `nltk.downloader` in nltk/nltk versions <= 3.9.4 
  allows for cross-package resource and model poisoning. The downloader extracts
  package archives into shared namespaces such as `corpora/` and `taggers/` 
  instead of package-isolated roots, and validates package integrity only after 
  the archive has been written and extracted. This design flaw enables one 
  package to overwrite another package's trusted resources within the same 
  namespace, making the changes immediately active through ordinary NLTK APIs. 
  This issue persists across fresh interpreter restarts and can affect 
  downstream workflows, including machine learning pipelines and 
  reproducibility-sensitive environments.
