title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/tdx:
  Panic on bad configs that #VE on \"private\" memory access\n\nAll normal kernel
  memory is \"TDX private memory\".  This includes\neverything from kernel stacks
  to kernel text.  Handling\nexceptions on arbitrary accesses to kernel memory is
  essentially\nimpossible because they can happen in horribly nasty places like\n\
  kernel entry/exit.  But, TDX hardware can theoretically _deliver_\na virtualization
  exception (#VE) on any access to private memory.\n\nBut, it's not as bad as it sounds.\
  \  TDX can be configured to never\ndeliver these exceptions on private memory with
  a \"TD attribute\"\ncalled ATTR_SEPT_VE_DISABLE.  The guest has no way to *set*
  this\nattribute, but it can check it.\n\nEnsure ATTR_SEPT_VE_DISABLE is set in early
  boot.  panic() if it\nis unset.  There is no sane way for Linux to run with this\n\
  attribute clear so a panic() is appropriate.\n\nThere's small window during boot
  before the check where kernel\nhas an early #VE "
