title: The Invisible Anti-Spam & CAPTCHA — reCAPTCHA Alternative for All Forms 
  plugin for WordPress is vulnerable to Stored Cross-Site Scripting via the 
  'action' parameter in all versions up to, and including, 5.1 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for unauthenticated attackers to inject arbitrary web scripts in pages that 
  will execute whenever a user accesses an injected page. The stored payload is 
  written by any unauthenticated admin-ajax.php request whose action value 
  matches an entry in the plugin's explicit-actions list, which is 
  auto-populated for common form builders at activation and requires no 
  authentication gate to reach the save path.
