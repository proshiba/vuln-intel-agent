title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: avoid stale FIFO cells during resize\n\nsnd_seq_fifo_resize() still needs to
  publish the replacement pool\nbefore it waits for FIFO users. A blocking snd_seq_read()
  holds\nf->use_lock while it sleeps, so concurrent senders must be able to\nqueue
  to the new pool and wake that reader instead of failing against a\nclosing old pool.\n\
  \nHowever, snd_seq_fifo_event_in() duplicates an event before it takes\nf->lock,
  and snd_seq_read() can dequeue a cell and later call\nsnd_seq_fifo_cell_putback()
  if copy_to_user() or\nsnd_seq_expand_var_event() fails. If resize swaps f->pool
  and detaches\noldhead in between, either path can relink an old-pool cell after
  the\nsnapshot. That stale cell sits outside the drained oldhead list, keeps\noldpool->counter
  elevated, and can leave snd_seq_pool_delete() waiting\nfor the retired pool to drain.\n\
  \nKeep the existing swap-before-wait ordering in snd_seq_fifo_resize(),\nbut reject
  stale cells before"
