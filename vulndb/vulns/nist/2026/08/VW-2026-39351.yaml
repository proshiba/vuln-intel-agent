title: "An issue was discovered in Django 5.2 before 5.2.17 and 6.0 before 6.0.8.\n\
  `django.contrib.admin.utils.display_for_field()` renders `URLField` values as clickable
  links in the admin without validating the URL. A value stored with an unsafe scheme
  is displayed as a link on changelist and read-only admin pages, which allows cross-site
  scripting against staff users who click the link.\r\nExploitation requires the unsafe
  value to already be stored in the database. `URLField` validation through a `ModelForm`
  or the admin rejects unsafe schemes, so this affects applications that persist `URLField`
  data without running model validation, for example through direct queryset writes,
  deserialization, or bulk import of untrusted input.\nDjango would like to thank
  Egor Saltykov for reporting this issue."
