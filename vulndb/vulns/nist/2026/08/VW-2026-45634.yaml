title: A vulnerability was found in karakeep-app karakeep up to 0.32.0. The 
  affected element is the function authorize of the file apps/web/server/auth.ts
  of the component Login Endpoint. The manipulation results in improper 
  restriction of excessive authentication attempts. The attack may be performed 
  from remote. This attack is characterized by high complexity. The 
  exploitability is described as difficult. The exploit has been made public and
  could be used. Upgrading to version 0.33.0 is sufficient to fix this issue. 
  The patch is identified as f7d042971d0d2bcc7119654830cf1eb93eabbf24. It is 
  advisable to upgrade the affected component.
