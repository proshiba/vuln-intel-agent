title: New API is a large language mode (LLM) gateway and artificial 
  intelligence (AI) asset management system. Prior to 1.0.0-rc.11, POST 
  /api/stripe/webhook, POST /api/creem/webhook, and POST /api/waffo/webhook read
  and log full request bodies before signature validation in 
  router/api-router.go and the payment controllers, allowing an unauthenticated 
  attacker to cause memory pressure, container restarts, or disk exhaustion 
  without forging a successful payment. This issue is fixed in version 
  1.0.0-rc.11.
