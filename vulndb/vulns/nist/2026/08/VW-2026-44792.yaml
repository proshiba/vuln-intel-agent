title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1,raid10:
  fix deadlock in read error recovery path\n\nraid1d and raid10d may resubmit a split
  md cloned bio while handling\na read error. In this case, resubmitting the bio can
  lead to a deadlock\nif the array is suspended before md_handle_request() acquires
  an\nactive_io reference via percpu_ref_tryget_live().\n\nSince the cloned bio already
  holds an active_io reference,\ntrying to acquire another reference via percpu_ref_tryget_live()\n\
  can lead to a deadlock while the array is suspended.\n\nFix this by using percpu_ref_get()
  for md cloned bios."
