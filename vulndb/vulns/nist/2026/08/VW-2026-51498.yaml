title: An attacker that holds an OAuth2 token granting only part of the required
  scopes can authenticate, because when more than one scope is required in the 
  configuration, the remote token validation paths accept a token that carries 
  only one of them, while the local token validation path correctly requires all
  of them. The configured authorization policy is not enforced, so a token that 
  was granted only part of the required permissions is accepted where it should 
  have been rejected. Use local token validation where tokens can be validated 
  locally. Update to non-vulnerable version. No publicly available exploits are 
  known.
