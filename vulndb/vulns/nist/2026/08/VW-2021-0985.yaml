title: A vulnerability in the upgrade process of Cisco Adaptive Security 
  Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) Software 
  could allow an authenticated, local attacker to inject commands that could be 
  executed with root privileges on the underlying operating system (OS). This 
  vulnerability is due to insufficient input validation. An attacker could 
  exploit this vulnerability by uploading a crafted upgrade package file to an 
  affected device. A successful exploit could allow the attacker to inject 
  commands that could be executed with root privileges on the underlying OS.
