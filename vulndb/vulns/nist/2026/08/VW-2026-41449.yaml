title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpll:
  fix NULL pointer dereference in dpll_msg_add_pin_ref_sync()\n\nWhen a dpll_pin is
  shared across multiple dpll_device instances and\nthose devices are being unregistered
  (e.g. during driver module removal),\na NULL pointer dereference can occur in dpll_msg_add_pin_ref_sync().\n\
  \nThis happens under the following conditions:\n - A pin is registered with two
  or more dpll devices (dpll_A, dpll_B)\n - The pin has ref_sync pairs with other
  pins\n - During unregistration of dpll_A's pins, a ref_sync partner pin is\n   unregistered
  first, removing it from dpll_A->pin_refs\n - But since the partner pin is still
  registered with dpll_B, its\n   dpll_refs is not empty, so dpll_pin_ref_sync_pair_del()
  does NOT\n   run and the partner stays in the pin's ref_sync_pins xarray\n - When
  the pin itself is then unregistered from dpll_A, the delete\n   notification calls
  dpll_msg_add_pin_ref_sync() which finds the\n   partner in ref_sync_pins, passe"
