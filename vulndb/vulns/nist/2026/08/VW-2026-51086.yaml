title: NLTK through 3.10.3 contains a path traversal vulnerability in 
  model-artifact APIs that bypass pathsec enforcement by using raw file 
  operations on caller-controlled paths. Attackers can read or write files 
  outside allowed sandbox roots through TransitionParser, AveragedPerceptron, 
  PerceptronTagger, and maxent parameter APIs when pathsec is enabled.
