title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkcm:
  use WRITE_ONCE() when changing lower socket callbacks\n\nkcm_attach() replaces a
  live lower TCP socket's sk_data_ready and\nsk_write_space callbacks with KCM handlers,
  and kcm_unattach() restores\nthem later. Those callback-pointer updates are still
  plain stores even\nthough the same fields can be read and invoked concurrently on
  other\nCPUs.\n\nIf another CPU observes an older callback snapshot after the live
  field\nhas already been restored, callback execution can run with a mismatched\n\
  target and sk_user_data state, leading to stale or misdirected wakeups.\n\nUse WRITE_ONCE()
  for the callback replacement and restore operations so\nthese shared callback fields
  follow the same visibility contract already\nestablished by the earlier 4022 fixes."
