  new block group and that block group becomes unused\nbefore we finish its creation,
  at btrfs_create_pending_block_groups(),\nthen when btrfs_mark_bg_unused() is called
  against the block group, we\nassume that the block group is currently in the list
  of block groups to\nreclaim, and we move it out of the list of new block groups
  and into the\nlist of unused block groups. This has two consequences:\n\n1) We move
  it out of the list of new block groups associated to the\n   current transaction.
