title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ebtables: fix table blob use-after-free\n\nWe are not allowed to return an error
  at this point.\nLooking at the code it looks like ret is always 0 at this\npoint,
  but its not.\n\nt = find_table_lock(net, repl->name, &ret, &ebt_mutex);\n\n... this
  can return a valid table, with ret != 0.\n\nThis bug causes update of table->private
  with the new\nblob, but then frees the blob right away in the caller.\n\nSyzbot
  report:\n\nBUG: KASAN: vmalloc-out-of-bounds in __ebt_unregister_table+0xc00/0xcd0
  net/bridge/netfilter/ebtables.c:1168\nRead of size 4 at addr ffffc90005425000 by
  task kworker/u4:4/74\nWorkqueue: netns cleanup_net\nCall Trace:\n kasan_report+0xbf/0x1f0
  mm/kasan/report.c:517\n __ebt_unregister_table+0xc00/0xcd0 net/bridge/netfilter/ebtables.c:1168\n\
  \ ebt_unregister_table+0x35/0x40 net/bridge/netfilter/ebtables.c:1372\n ops_exit_list+0xb0/0x170
  net/core/net_namespace.c:169\n cleanup_net+0x4ee/0xb10 net/core/net_namespace.c:613\n"
