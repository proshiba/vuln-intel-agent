title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conncount: prevent connlimit drops for early confirmed ct\n\nCommit 69894e5b4c5e
  (\"netfilter: nft_connlimit: update the count if add\nwas skipped\") introduced
  a regression where packets for valid\nconnections are dropped when using connlimit
  for soft-limiting\nscenarios.\n\nThe issue occurs when a new connection reuses a
  socket currently in\nthe TIME_WAIT state. In this scenario, the connection tracking
  entry\nis evaluated as already confirmed. Previously, __nf_conncount_add()\nassumed
  that if a connection was confirmed and did not originate from\nthe loopback interface,
  it should skip the addition and return -EEXIST.\n\nSkipping the addition triggers
  a garbage collection run that cleans up\nthe TIME_WAIT connection. Consequently,
  the active connection count\ndrops to 0, which xt_connlimit mishandles, leading
  to the false rejection\nof the perfectly valid new connection.\n\nFix this by replacing
  the interface check with p"
