title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  spi-qpic-snand: write the feature value before executing SET_FEATURE\n\nqcom_spi_send_cmdaddr()
  programs NAND_FLASH_CMD/NAND_EXEC_CMD and submits\nthe descriptors, which makes
  the controller execute the command\nimmediately. For SPINAND_SET_FEATURE the value
  to be written is only\nplaced into NAND_FLASH_FEATURES afterwards, by qcom_spi_io_op(),
  in a\nsecond submission - so the chip is programmed with whatever that register\n\
  happened to hold from a previous operation, and the intended value is only\napplied
  by the *next* SET_FEATURE.\n\nMeasured on a TP-Link Archer AX55 v1 (IPQ5018, ESMT
  F50L1G41LB): writing\n0x40 to the configuration register (0xb0) leaves the chip
  at 0x00, and the\nsubsequent write of 0x00 leaves it at 0x40 - every write lands
  one\noperation late.\n\nThis stayed unnoticed until v6.18 added SPI-NAND OTP support
  together\nwith OTP entries for ESMT chips. spinand_otp_rw() enables OTP mode,\n\
  reads, and disables it a"
