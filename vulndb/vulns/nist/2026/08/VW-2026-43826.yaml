title: OpenChoreo is a complete, open-source developer platform for Kubernetes. 
  Prior to 1.0.3, 1.1.3, and 1.2.0-rc.2, the POST /api/v1alpha1/autobuild 
  endpoint in internal/openchoreo-api/api/handlers/webhook_handler.go selected a
  webhook provider from caller-controlled X-Event-Key, accepted Bitbucket 
  requests without HMAC-SHA256 in X-Hub-Signature or a configured 
  bitbucket-secret, and allowed unauthenticated build triggers for components 
  matched by repository URL and branch, including cross-provider triggers using 
  attacker-supplied commit SHAs. This issue is fixed in versions 1.0.3, 1.1.3, 
  and 1.2.0-rc.2.
