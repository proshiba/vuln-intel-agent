title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_queue: pin bridge device while NFQUEUE holds fake dst\n\nThe br_netfilter fake
  rtable is embedded in struct net_bridge and is\nattached to bridged packets with
  skb_dst_set_noref(). If such a packet is\nqueued to NFQUEUE, __nf_queue() upgrades
  that fake dst with\nskb_dst_force().\n\nAt that point the queued skb can hold a
  real dst reference after bridge\nteardown has started. The problem is not that every
  bridged packet needs\nits own dst reference. The problem is that NFQUEUE can keep
  the bridge\nprivate fake dst alive after unregister begins.\n\nFix this by keeping
  the bridge fake dst model unchanged and pinning the\nbridge master device only while
  the packet sits in NFQUEUE. Record the\nbridge device in nf_queue_entry when the
  queued skb carries a bridge fake\ndst, take a device reference for the queue lifetime,
  and drop it when the\nqueue entry is freed.\n\nAlso make sure queued entries are
