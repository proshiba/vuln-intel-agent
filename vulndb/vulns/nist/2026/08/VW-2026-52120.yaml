title: A vulnerability was detected in klaussilveira GitList 2.0.0. Affected by 
  this issue is the function SimpleXMLElement of the file 
  src/SCM/System/Git/CommandLine.php of the component XML Parsing. Performing a 
  manipulation results in denial of service. The attack is possible to be 
  carried out remotely. The exploit is now public and may be used. Upgrading to 
  version 3.0.0-beta can resolve this issue. The patch is named 
  f67609d52c1812fa8a7ed80eae5e795cfd72115f. It is advisable to upgrade the 
  affected component.
