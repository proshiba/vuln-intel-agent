title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Skip sub-disable teardown for never-linked sub-schedulers\n\nA sub-scheduler enable
  can fail before scx_link_sched() links the sched into\nthe hierarchy, e.g. when
  the parent is already being disabled, and cleanup\nstill runs the full scx_sub_disable().\n\
  \nThat is racy against root disable: drain_descendants() is the only ordering\n\
  between a sub's disable-time task walk and root disable's all-task teardown,\nand
  an unlinked sub is invisible to it. Root's teardown can thus run between\nthe never-linked
  sub's drain and its walk, exiting every task to no\nscheduler.\n\nThe walk then
  trips the membership WARN and re-homes the exited tasks onto\nthe dying hierarchy,
  a use-after-free.\n\nSkip the cgroup ownership reset and the task walk if @sch was
  never linked,\nindicated by the empty ->sibling as unlinking only happens later
  in the same\nfunction. The membership WARN remains valid: a linked sub is always
  waited\non by an ancesto"
