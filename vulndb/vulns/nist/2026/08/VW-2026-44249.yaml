title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/resctrl:
  Fix use-after-free during unmount\n\nDuring unmount or failure teardown all mon_data
  structures that contain\nmonitoring event file private data are freed after which
  kernfs nodes are\nremoved. However, the RDT_DELETED flag is never set for the statically\n\
  allocated default resource group.\n\nA concurrent reader of an event file associated
  with the default resource\ngroup may, after dropping kernfs active protection, block
  on rdtgroup_mutex\nwhile unmount proceeds to free the file private data and destroy
  the kernfs\nnode without waiting for the reader.\n\nWhen the mutex is released,
  the reader wakes up, observes that RDT_DELETED\nis not set for the default group,
  and dereferences the already-freed\nfile private data.\n\nThe scenario can be depicted
  as follows:\n  CPU0                                      CPU1\n   /*\n    * Default
  resource group's\n    * monitoring data accessible via\n    * kernfs file with kernfs_node::priv"
