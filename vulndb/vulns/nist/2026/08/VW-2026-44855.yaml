title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  sun4i-ss - Remove insecure and unused rng_alg\n\nRemove sun4i_ss_rng, as it is insecure
  and unused:\n\n- It has multiple vulnerabilities.  sun4i_ss_prng_seed() is missing\n\
  \  locking and has a buffer overflow.  sun4i_ss_prng_generate() fails to\n  fill
  the entire buffer with cryptographic random bytes, because it\n  rounds the destination
  length down and also doesn't actually wait for\n  the hardware to be ready before
  pulling bytes from it.\n\n- No user of this code is known.  It's usable only theoretically
  via the\n  \"rng\" algorithm type of AF_ALG.  But userspace actually just uses the\n\
  \  actual Linux RNG (/dev/random etc) instead.  And rng_algs don't\n  contribute
  entropy to the actual Linux RNG either.  (This may have\n  been confused with hwrng,
  which does contribute entropy.)\n\nThe sun4i_ss_prng_seed() buffer overflow was
  reported by Tianchu Chen\nand discovered by Atuin - Automated Vulnerability Discovery
  Engine\n\nThere'"
