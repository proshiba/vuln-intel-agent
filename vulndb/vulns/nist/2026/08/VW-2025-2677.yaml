title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  fix tcp_mtup_probe_success vs wrong snd_cwnd\n\nsyzbot got a new report [1] finally
  pointing to a very old bug,\nadded in initial support for MTU probing.\n\ntcp_mtu_probe()
  has checks about starting an MTU probe if\ntcp_snd_cwnd(tp) >= 11.\n\nBut nothing
  prevents tcp_snd_cwnd(tp) to be reduced later\nand before the MTU probe succeeds.\n\
  \nThis bug would lead to potential zero-divides.\n\nDebugging added in commit 40570375356c
  (\"tcp: add accessors\nto read/set tp->snd_cwnd\") has paid off :)\n\nWhile we are
  at it, address potential overflows in this code.\n\n[1]\nWARNING: CPU: 1 PID: 14132
  at include/net/tcp.h:1219 tcp_mtup_probe_success+0x366/0x570 net/ipv4/tcp_input.c:2712\n\
  Modules linked in:\nCPU: 1 PID: 14132 Comm: syz-executor.2 Not tainted 5.18.0-syzkaller-07857-gbabf0bb978e3
  #0\nHardware name: Google Google Compute Engine/Google Compute Engine, BIOS Google
  01/01/2011\nRIP: 0010:tcp_snd_cwnd_set include/net/tcp.h:1219 [inline]\nRIP:"
