title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  tap: set skb->dev before parsing virtio net header in tap_get_user_xdp()\n\nThe
  commit 4f61f133f354 (\"net: tap: NULL pointer derefence in\ndev_parse_header_protocol
  when skb->dev is null\") fixed a crash in\ntap_get_user() by assigning skb->dev
  before calling tun_vnet_hdr_to_skb().\nThis is required because virtio_net_hdr_to_skb()
  may invoke\ndev_parse_header_protocol(), which dereferences skb->dev. Without the\n\
  assignment, a NULL pointer dereference can occur.\n\nHowever, tap_get_user_xdp()
  still parses the virtio-net header before\nassigning skb->dev. When the vhost TX
  path passes an XDP buffer containing\na GSO virtio-net header but the protocol is
  set to zero on purpose,\ntun_vnet_hdr_to_skb() can reach dev_parse_header_protocol()
  while skb->dev\nis still NULL, resulting in a crash.\n\nFix this by looking up the
  tap device and assigning skb->dev before calling\ntun_vnet_hdr_to_skb(), matching
  the ordering already used in\ntap_"
