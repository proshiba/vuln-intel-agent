title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  MGMT: revalidate LOAD_CONN_PARAM queued update\n\nMGMT_OP_LOAD_CONN_PARAM queues
  conn_update_sync() when a single parameter\nupdate changes an existing LE central
  connection. The queued work currently\nstores a borrowed hci_conn_params entry from
  hdev->le_conn_params. A later\nLOAD_CONN_PARAM request can clear disabled parameters
  and free that entry\nbefore hci_cmd_sync_work() runs the queued callback.\n\nDo
  not keep the borrowed hci_conn_params pointer in queued work. Queue the\nhci_conn
  instead and hold a reference until the queued callback completes.\nWhen the work
  runs, revalidate that the connection is still present, look\nup the current hci_conn_params
  entry, and cancel the update if userspace\nremoved that entry while the work was
  pending.\n\nCopy the interval values from the current params entry under hdev->lock,\n\
  then drop the lock and keep using hci_le_conn_update_sync() to issue the\nupdate.\n\
