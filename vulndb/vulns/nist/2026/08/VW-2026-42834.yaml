title: "Improper TLS hostname verification vulnerability in Apache HttpComponents
  Client 5.4 or newer. HostnameVerificationPolicy#BUILTIN setting has no effect when
  used with the async version of HttpClient. An attacker that can intercept and modify
  traffic between the client and\n the server can impersonate the server by presenting
  a valid certificate\n for a different domain. \n\n\nPlease note the classic version
  of HttpClient is not affected by this vulnerability. \n\nAffected users are recommended
  to upgrade to at least version 5.6.4, which fixes the issue."
