title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (pmbus) Fix passing events to regulator core\n\nSashiko reports:\n\nCommit 754bd2b4a084
  (\"hwmon: (pmbus/core) Protect regulator operations with\nmutex\") introduced a
  worker to batch regulator events over time using\natomic_or(). The delayed worker
  then passes the combined bitmask unmodified\nto regulator_notifier_call_chain().\n\
  \nThe core regulator subsystem's regulator_handle_critical() function\nevaluates
  the event parameter using a strict switch statement. If\nmultiple distinct faults
  occur before the worker runs (e.g.,\nREGULATOR_EVENT_UNDER_VOLTAGE | REGULATOR_EVENT_OVER_CURRENT),
  the combined\nbitmask fails to match any case. This leaves the reason as NULL and\n\
  completely bypasses the critical hw_protection_trigger().\n\nFix the problem by
  passing events bit by bit to the regulator event\nhandler."
