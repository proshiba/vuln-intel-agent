title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Track subprog poke descriptors correctly and fix use-after-free\n\nSubprograms are
  calling map_poke_track(), but on program release there is no\nhook to call map_poke_untrack().
  However, on program release, the aux memory\n(and poke descriptor table) is freed
  even though we still have a reference to\nit in the element list of the map aux
  data. When we run map_poke_run(), we then\nend up accessing free'd memory, triggering
  KASAN in prog_array_map_poke_run():\n\n  [...]\n  [  402.824689] BUG: KASAN: use-after-free
  in prog_array_map_poke_run+0xc2/0x34e\n  [  402.824698] Read of size 4 at addr ffff8881905a7940
  by task hubble-fgs/4337\n  [  402.824705] CPU: 1 PID: 4337 Comm: hubble-fgs Tainted:
  G          I       5.12.0+ #399\n  [  402.824715] Call Trace:\n  [  402.824719]\
  \  dump_stack+0x93/0xc2\n  [  402.824727]  print_address_description.constprop.0+0x1a/0x140\n\
  \  [  402.824736]  ? prog_array_map_poke_run+0xc2/0x34e\n  [  402.824740]"
