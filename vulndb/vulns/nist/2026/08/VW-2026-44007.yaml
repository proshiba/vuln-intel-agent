title: MindsDB Minds Platform version 26.1.0 and earlier contains an 
  unauthenticated remote code execution vulnerability that allows 
  unauthenticated attackers to execute arbitrary OS commands by submitting 
  crafted prompts to the unprotected POST /api/v1/responses/ endpoint, which 
  reaches the Anton agent's scratchpad tool that calls exec() on 
  attacker-influenced Python source without sandboxing. Attackers can first 
  configure their own LLM API key through the unauthenticated PUT 
  /api/v1/settings/ endpoint, then POST a prompt directing the agent to invoke 
  the scratchpad tool with arbitrary Python code, achieving full OS command 
  execution as the user running the desktop application and enabling access to 
  SSH keys, stored credentials, and environment secrets.
