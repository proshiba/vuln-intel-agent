title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  grow index root value before reparent header update\n\nntfs_ir_reparent() moves
  the resident index root entries into an index\nblock and leaves a small root stub
  containing the child VCN. That root\nstub can be larger than the existing resident
  value. For example, an\nempty root with value_length 48 has an index area of 32
  bytes, while the\nlarge-index root stub needs index_length and allocated_size of
  40 bytes.\n\nThe current code publishes the larger index.index_length and\nindex.allocated_size
  before resizing the resident value. If the resize\nreturns -ENOSPC, the recovery
  path can call ntfs_inode_add_attrlist(),\nwhich looks attributes up again while
  the root header says\nallocated_size 40 but the resident value still only provides
  32 bytes of\nindex area. Lookup-time $INDEX_ROOT validation then correctly rejects\n\
  that transient layout as corrupt.\n\nThis reproduces as a generic/013 failure under
  qemu. In the failing run,\nt"
