title: "XML Injection vulnerability in joshnuss xml_builder (XmlBuilder module) allows
  Content Spoofing, XML Injection.\n\nThis vulnerability is associated with program
  files lib/xml_builder.ex and program routines XmlBuilder.generate/1, XmlBuilder.generate/2,
  XmlBuilder.element/1, XmlBuilder.element/2, XmlBuilder.element/3.\n\nElement names,
  attribute names, and doctype identifiers are interpolated verbatim into the serialized
  XML output without validation or escaping of structural characters (<, >, \", ',
  &). An attacker who can influence a name argument (for example, an element name
  derived from a JSON object key or an HTTP form field name) can inject arbitrary
  XML markup including extra elements, comments, and event-handler attributes into
  the output document.\n\nThis issue affects xml_builder: from 0.0.1 before 2.4.1."
