title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. Prior to version 1.0.2, when a user navigates to the
  `/logout` page, the page's server-side load handler deletes the `access_token` cookie
  before calling `/api/auth/logout` via an internal `event.fetch()`. The internal
  fetch consequently runs without the auth cookie, so `apiAuthHandle` rejects it,
  the logout handler never executes, and `SessionService.revokeSession()` is never
  called for the current session. The DB session row remains valid until its natural
  expiry (one week by default). The user sees a successful logout (cookie gone, UI
  returns to login), but any party still holding a copy of the now-deleted access
  token can continue making authenticated API calls until the session naturally expires.
  The root cause is a simple ordering mistake. The same auth subsystem implements
  the correct order in `/api/auth/logout`: revoke the current DB session first, then
  delete the cookie."
