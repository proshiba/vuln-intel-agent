title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  track changes_pkt_data property for global functions\n\nWhen processing calls to
  certain helpers, verifier invalidates all\npacket pointers in a current state. For
  example, consider the\nfollowing program:\n\n    __attribute__((__noinline__))\n\
  \    long skb_pull_data(struct __sk_buff *sk, __u32 len)\n    {\n        return
  bpf_skb_pull_data(sk, len);\n    }\n\n    SEC(\"tc\")\n    int test_invalidate_checks(struct
  __sk_buff *sk)\n    {\n        int *p = (void *)(long)sk->data;\n        if ((void
  *)(p + 1) > (void *)(long)sk->data_end) return TCX_DROP;\n        skb_pull_data(sk,
  0);\n        *p = 42;\n        return TCX_PASS;\n    }\n\nAfter a call to bpf_skb_pull_data()
  the pointer 'p' can't be used\nsafely. See function filter.c:bpf_helper_changes_pkt_data()
  for a list\nof such helpers.\n\nAt the moment verifier invalidates packet pointers
  when processing\nhelper function calls, and does not traverse global sub-programs
  when\nprocessing calls "
