title: The Event Booking Manager for WooCommerce (Pro) WordPress plugin before 
  5.0.3 does not validate the ticket price on the server during its native 
  (non-WooCommerce) checkout, trusting the per-ticket price supplied by the 
  client instead of re-deriving the event's configured price. This allows 
  unauthenticated users to book paid event tickets for free, obtaining completed
  bookings and valid tickets at no cost.
