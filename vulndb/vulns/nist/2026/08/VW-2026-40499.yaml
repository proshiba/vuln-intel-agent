title: FFmpeg versions from 0.5 up to, but not including, 9.0 contain a signed 
  integer overflow vulnerability in the DVB subtitle parser in 
  libavcodec/dvbsub_parser.c that allows attackers to trigger a heap buffer 
  overflow by supplying a crafted WTV file. The overflow causes the bounds-check
  guard expression to wrap to INT_MIN, bypassing the PARSE_BUF_SIZE comparison 
  and invoking memcpy() with attacker-controlled data into a heap buffer, 
  resulting in an out-of-bounds heap write and potential memory corruption or 
  code execution.
