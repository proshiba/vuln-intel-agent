title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  tcp: fix double sock release on batch realloc\n\nbpf_iter_tcp_batch() releases the
  current batch via\nbpf_iter_tcp_put_batch(), which drops the socket refs and rewrites\n\
  each slot with the socket cookie, then grows the batch. cur_sk/end_sk\nare kept
  for bpf_iter_tcp_resume(), but on realloc failure the function\nreturns ERR_PTR()
  before resume runs, leaving cur_sk < end_sk over\nslots that now hold cookies rather
  than sock pointers.\nbpf_iter_tcp_seq_stop() then calls bpf_iter_tcp_put_batch()
  again and\ndereferences a cookie as a struct sock.\n\nEmpty the batch on the failure
  path so stop() does not release it\nagain. The sockets were already freed by the
  first\nbpf_iter_tcp_put_batch(), so nothing leaks, and a later read() rescans\n\
  the bucket from the start instead of skipping it. The sibling\nGFP_NOWAIT failure
  path still holds real socket references and is left\nfor stop() to release.\n\n\
  \  BUG: KASAN: null-ptr-deref in __sock_g"
