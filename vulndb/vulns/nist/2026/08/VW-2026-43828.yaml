title: OpenChoreo is a complete, open-source developer platform for Kubernetes. 
  Prior to 1.0.3, 1.1.3, and 1.2.0-rc.2, internal/cluster-gateway/server.go 
  exposed /api/proxy/, /api/exec/, and /api/wirelogs/ on an internal listener 
  without requiring a client certificate or token, allowing any 
  network-reachable caller to read tenant Kubernetes Secrets, mutate workloads, 
  and execute commands across connected data planes. This issue is fixed in 
  versions 1.0.3, 1.1.3, and 1.2.0-rc.2.
