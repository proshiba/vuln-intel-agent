title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix kernel BUG in ext4_write_inline_data_end\n\nWhen the data=journal mount option
  is used, the ext4_journalled_write_end()\nfunction incorrectly calls ext4_write_inline_data_end()
  without checking\nif the EXT4_STATE_MAY_INLINE_DATA flag is still set on the inode.\n\
  \nIf a previous attempt to convert the inline data to an extent failed (e.g.\ndue
  to ENOSPC), the EXT4_STATE_MAY_INLINE_DATA flag is cleared, but\nthe EXT4_INODE_INLINE_DATA
  flag remains set. In this scenario, the next\ncall to ext4_write_begin() will not
  prepare the inline data xattr for\nwriting, but ext4_journalled_write_end() will
  incorrectly attempt to write\nto it, triggering a BUG_ON(pos + len > EXT4_I(inode)->i_inline_size)
  in\next4_write_inline_data() since i_inline_size was not expanded.\n\nFix this by
  ensuring that ext4_journalled_write_end() only calls\next4_write_inline_data_end()
  if the EXT4_STATE_MAY_INLINE_DATA flag is\nset, mirroring the behavior of "
