title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  tegra - fix rctx->cryptlen calculation in tegra_gcm_do_one_req()\n\nPerform rctx->cryptlen
  calculation in tegra_gcm_do_one_req() the same way\nit is done in tegra_ccm_crypt_init().
  The current formulae may lead to a\ncrash if a caller does not call tegra_gcm_setauthsize()
  and so ctx->authsize\nremains zero. Then a decrypt operation with incorrect rctx->cryptlen
  will\nlead to a write beyound rctx->dst_sg buffer.\n\nAs a follow-up cleanup delete
  struct tegra_aead_ctx->authsize field since\nit appears to be completely unused.
  Also simplify tegra_ccm_setauthsize()\nand tegra_gcm_setauthsize() functions respectively."
