title: Orval generates type-safe JavaScript clients in TypeScript from OpenAPI 
  v3 and Swagger v2 specifications. Prior to 8.21.0, a double quote in a query 
  parameter name is emitted into the generated request-validation 
  zod.object({...}) schema without safe encoding. This permits 
  attacker-controlled JavaScript to be evaluated when the generated zod schema 
  module is imported, resulting in code execution in the developer, CI, test, or
  application environment. The affected code is packages/zod/src/index.ts and 
  query request-validation generation. This issue is fixed in version 8.21.0.
