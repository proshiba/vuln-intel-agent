title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix netns teardown to cancel the preallocation charger\n\nFix the teardown of an
  afs network namespace to make sure it cancels the\nwork item that keeps the preallocated
  rxrpc call/conn/peer queue charged\nbefore incoming calls are disabled (i.e. listen
  0).\n\nAlso, if net->live is false because the afs netns is being deleted, make\n\
  afs_charge_preallocation() skip charging and make afs_rx_new_call() avoid\nrequeuing
  the charger.\n\n(This was found by AI review)."
