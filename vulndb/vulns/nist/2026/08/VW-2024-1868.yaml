title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  amd_sfh: Fix potential NULL pointer dereference\n\ndevm_add_action_or_reset() can
  suddenly invoke amd_mp2_pci_remove() at\nregistration that will cause NULL pointer
  dereference since\ncorresponding data is not initialized yet. The patch moves\n\
  initialization of data before devm_add_action_or_reset().\n\nFound by Linux Driver
  Verification project (linuxtesting.org).\n\n[jkosina@suse.cz: rebase]"
