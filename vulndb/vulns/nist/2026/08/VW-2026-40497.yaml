title: "Dinky's POST /download/uploadFromRsByLocal handler passes the caller-supplied
  path parameter directly to new File(path) and file.transferTo(dest) with no path
  validation. The route is marked @SaIgnore and /download/** is excluded from the
  Sa-Token interceptor, so the only guard is a header equality check against a dinkyToken
  value whose default (efda1551-7958-4e0f-80a8-dfd107df3e38) is hardcoded in source
  and shipped to every deployment. Anyone who can reach Dinky's HTTP port (8888 by
  default) and supplies the hardcoded token can write arbitrary files as the Dinky
  service account. The default Docker image runs on 8888 with no proxy or authentication
  and chmod 777 on /opt/dinky, so the application's own classpath, launch scripts,
  and static assets are writable. Demonstrated impact: overwriting /opt/dinky/config/static/index.html
  served attacker JavaScript to admin browsers immediately, and writing /opt/dinky/org/dinky/Dinky.class
  executed attacker code as the Dinky service account at th"
