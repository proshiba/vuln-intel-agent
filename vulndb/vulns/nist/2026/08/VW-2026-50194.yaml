title: The Grav API plugin (getgrav/grav-plugin-api) before 1.0.18 does not 
  apply the API-key scope cap in the injectSecurityTab() function of 
  BlueprintController when deciding whether a page's security/permissions 
  blueprint section is editable. Because the function performs raw 
  isSuperAdmin()/hasPermission() checks without a request parameter, it cannot 
  enforce scopeAllows(). A caller holding a scoped API key may therefore see 
  (and potentially edit) page permission fields beyond the scope granted to the 
  key. The end-to-end write-time impact was not fully confirmed by the reporter.
