title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix CT entry update leaks of modify header context\n\nThe cited commit allocates
  a new modify header to replace the old\none when updating CT entry. But if failed
  to allocate a new one, eg.\nexceed the max number firmware can support, modify header
  will be\nan error pointer that will trigger a panic when deallocating it. And\n\
  the old modify header point is copied to old attr. When the old\nattr is freed,
  the old modify header is lost.\n\nFix it by restoring the old attr to attr when
  failed to allocate a\nnew modify header context. So when the CT entry is freed,
  the right\nmodify header context will be freed. And the panic of accessing\nerror
  pointer is also fixed."
