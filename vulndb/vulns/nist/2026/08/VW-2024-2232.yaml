title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  fix race in z_erofs_get_gbuf()\n\nIn z_erofs_get_gbuf(), the current task may be
  migrated to another\nCPU between `z_erofs_gbuf_id()` and `spin_lock(&gbuf->lock)`.\n\
  \nTherefore, z_erofs_put_gbuf() will trigger the following issue\nwhich was found
  by stress test:\n\n<2>[772156.434168] kernel BUG at fs/erofs/zutil.c:58!\n..\n<4>[772156.435007]\n\
  <4>[772156.439237] CPU: 0 PID: 3078 Comm: stress Kdump: loaded Tainted: G      \
  \      E      6.10.0-rc7+ #2\n<4>[772156.439239] Hardware name: Alibaba Cloud Alibaba
  Cloud ECS, BIOS 1.0.0 01/01/2017\n<4>[772156.439241] pstate: 83400005 (Nzcv daif
  +PAN -UAO +TCO +DIT -SSBS BTYPE=--)\n<4>[772156.439243] pc : z_erofs_put_gbuf+0x64/0x70
  [erofs]\n<4>[772156.439252] lr : z_erofs_lz4_decompress+0x600/0x6a0 [erofs]\n..\n\
  <6>[772156.445958] stress (3127): drop_caches: 1\n<4>[772156.446120] Call trace:\n\
  <4>[772156.446121]  z_erofs_put_gbuf+0x64/0x70 [erofs]\n<4>[772156.446761]  z_erofs_lz4_decompress+0x60"
