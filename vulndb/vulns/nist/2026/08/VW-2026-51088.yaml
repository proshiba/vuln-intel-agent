title: "startServer.ts in the mcp-http-server package of UI-TARS-desktop defaulted
  its listen address to '::' when no host was given, so startSseAndStreamableHttpMcpServer
  bound the Streamable HTTP and SSE MCP transports to every interface, and its authentication
  middleware was optional: middlewares are applied only when a caller supplies them.
  The @agent-infra/mcp-server-commands and @agent-infra/mcp-server-filesystem entry
  points call startSseAndStreamableHttpMcpServer with a host and port alone and pass
  no middleware, so neither server required a credential. The commands server exposes
  a run_command tool that hands its caller-supplied command string to promisify(child_process.exec),
  so any unauthenticated client able to reach the port could run arbitrary commands
  as the user running the server, and the filesystem server exposed its file read
  and write tools on the same terms. The listen default became 127.0.0.1 in commit
  c2ad42e3eb9b27830db41a3e6f51ca7179d9b168; the package version stayed a"
