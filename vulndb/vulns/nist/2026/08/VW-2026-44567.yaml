title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  add INIT verification after cookie unpacking\n\nIn SCTP handshake, the INIT chunk
  is initially processed by the server\nand embedded into the cookie carried in INIT-ACK.
  The client then\nreturns this cookie via COOKIE-ECHO, where the server unpacks it
  and\nreconstructs the original INIT chunk.\n\nWhen cookie authentication is enabled,
  the cookie contents are protected\nagainst tampering, so reusing the unpacked INIT
  without re-verification\nis safe.\n\nHowever, when cookie authentication is disabled,
  the reconstructed INIT\ncan no longer be trusted. In this case, the INIT must be
  explicitly\nvalidated after unpacking to avoid processing potentially tampered data.\n\
  \nAdd sctp_verify_init() checks after cookie unpacking in COOKIE-ECHO\nprocessing
  paths (sctp_sf_do_5_1D_ce() and sctp_sf_do_5_2_4_dupcook())\nwhen cookie_auth_enable
  is disabled. On failure, the new association is\nfreed and the packet is discarded.\n\
