title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninet:
  frags: strip GSO state from fragments before reassembly\n\nA virtio_net_hdr (tun/tap,
  or AF_PACKET with PACKET_VNET_HDR) can mark\nan IPv4 or IPv6 fragment as GSO; nothing
  relates gso_type to frag_off.\ninet_frag_reasm_prepare()/inet_frag_reasm_finish()
  keep the first\nfragment's skb as the head of the reassembled datagram, including
  its\nshinfo->gso_size/gso_type/gso_segs, and chain the remaining fragments\non frag_list
  with whatever linear/paged layout they arrived with.\n\nAfter ip_defrag() (ip_local_deliver(),
  nf_defrag_ipv4, ...) the\nreassembled skb therefore still claims to be GSO (SKB_GSO_DODGY),
  and\nthe next software segmentation point - udp_rcv_segment() on local\ndelivery,
  validate_xmit_skb(), or the ip_finish_output_gso() slow\npath - hands it to skb_segment().
  skb_segment()'s frag_list walk\nassumes GRO-shaped input and hits one of its BUG_ON()s.
  Two writes to\na tap by an unprivileged user in its own userns are "
