title: The MaxUpload – Big File Uploads – Increase Maximum File Upload Size 
  plugin for WordPress is vulnerable to Arbitrary File Upload in all versions up
  to, and including, 1.4.0 via the handle_upload function. This is due to a 
  filename-validation mismatch in the handle_upload function where extension and
  MIME checks are applied to the uploaded chunk's filename but not to the final 
  assembled filename derived from the resumableFilename parameter. This makes it
  possible for unauthenticated attackers to upload files that may be executable,
  which makes remote code execution possible.
