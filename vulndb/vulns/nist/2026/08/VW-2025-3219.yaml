title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Return error for inconsistent extended attributes\n\nntfs_read_ea is called when
  we want to read extended attributes. There\nare some sanity checks for the validity
  of the EAs. However, it fails to\nreturn a proper error code for the inconsistent
  attributes, which might\nlead to unpredicted memory accesses after return.\n\n[\
