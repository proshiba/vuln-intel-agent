title: 'Vulnerability in the Oracle Hyperion Data Relationship Management product
  of Oracle Hyperion (component: Access and security).   The supported version that
  is affected is 11.2.25.0.000. Easily exploitable vulnerability allows high privileged
  attacker with network access via HTTPS to compromise Oracle Hyperion Data Relationship
  Management.  While the vulnerability is in Oracle Hyperion Data Relationship Management,
  attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in takeover of Oracle Hyperion Data Relationship
  Management. CVSS 3.1 Base Score 9.1 (Confidentiality, Integrity and Availability
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H).'
