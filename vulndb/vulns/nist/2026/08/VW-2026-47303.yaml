title: FreeRDP is a free implementation of the Remote Desktop Protocol. Prior to
  3.29.0, planar_decompress_plane_rle and planar_decompress_plane_rle_only in 
  libfreerdp/codec/planar.c verify that a control byte exists but do not verify 
  that the source buffer contains the zero to fifteen raw bytes declared by that
  control byte. A malicious RDP server can send a truncated planar bitmap or 
  surface update whose final control byte claims additional raw bytes, causing 
  the decoder to read beyond pSrcData while processing a color plane. This can 
  crash the client and may disclose adjacent memory. This issue is fixed in 
  version 3.29.0.
