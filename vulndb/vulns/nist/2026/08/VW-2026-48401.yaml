title: Omnigent is an open-source AI agent framework and meta-harness for 
  orchestrating coding agents. Prior to 0.3.0, PUT /sessions/{session_id}/agent 
  checks LEVEL_EDIT permission for a session but does not reject a bound shared 
  or template agent whose agent.session_id is None. An authenticated user with 
  edit access to a session can replace that shared agent bundle through 
  omnigent/server/routes/sessions.py, add a stdio MCP server, and cause later 
  sessions that use the shared agent to launch an attacker-controlled command 
  through omnigent/tools/mcp.py. The command executes with the Omnigent runner 
  process permissions and can expose files, credentials, workspace data, 
  internal services, and runner availability. This issue is fixed in version 
  0.3.0.
