title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  remove debugfs files before client teardown\n\nceph_destroy_client() tears down
  the monitor client before removing\nthe per-client debugfs files. A concurrent read
  of the monmap debugfs\nfile can enter monmap_show() after ceph_monc_stop() has freed\n\
  monc->monmap, triggering a use-after-free.\n\nRemove the debugfs files before stopping
  the OSD and monitor clients.\ndebugfs_remove() drains active handlers and prevents
  new accesses, so\nthe debugfs callbacks can no longer race the rest of client teardown."
