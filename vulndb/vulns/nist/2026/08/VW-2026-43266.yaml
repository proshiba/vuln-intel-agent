title: Budibase is an open-source low-code platform. Prior to 3.40.1, 
  RestIntegration._req in packages/server/src/integrations/rest.ts attached 
  credentials from getAuthHeaders and defaultHeaders without requiring the final
  request destination to match the datasource origin. An unauthenticated caller 
  of a PUBLIC POST /api/v2/queries/:queryId query could supply an absolute or 
  parameterized path to an attacker-controlled host and receive the stored 
  bearer, basic, or static-header credentials. This issue is fixed in version 
  3.40.1.
