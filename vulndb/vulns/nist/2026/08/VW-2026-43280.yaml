title: A path traversal vulnerability in LXD allows an attacker to achieve 
  arbitrary host file read or unconstrained file creation. When processing image
  metadata templates, LXD fails to properly sanitize or restrict template file 
  paths from escaping the instance templates directory (specifically affecting 
  virtual machine / QEMU driver execution paths). An attacker can exploit this 
  flaw by providing a crafted image archive with malicious template directives 
  containing path traversal sequences, causing LXD to access or write files 
  outside the intended template directory on the host system.
