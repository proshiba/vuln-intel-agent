title: "In the Linux kernel, the following vulnerability has been resolved:\n\nftrace:
  Fix NULL pointer dereference in is_ftrace_trampoline when ftrace is dead\n\nftrace_startup
  does not remove ops from ftrace_ops_list when\nftrace_startup_enable fails:\n\n\
  register_ftrace_function\n  ftrace_startup\n    __register_ftrace_function\n   \
  \   ...\n      add_ftrace_ops(&ftrace_ops_list, ops)\n      ...\n    ...\n    ftrace_startup_enable
  // if ftrace failed to modify, ftrace_disabled is set to 1\n    ...\n  return 0
  // ops is in the ftrace_ops_list.\n\nWhen ftrace_disabled = 1, unregister_ftrace_function
  simply returns without doing anything:\nunregister_ftrace_function\n  ftrace_shutdown\n\
  \    if (unlikely(ftrace_disabled))\n            return -ENODEV;  // return here,
  __unregister_ftrace_function is not executed,\n                             // as
  a result, ops is still in the ftrace_ops_list\n    __unregister_ftrace_function\n\
  \    ...\n\nIf ops is dynamically allocated, it will be free later, in this case,\n\
  is_ftrace_trampoli"
