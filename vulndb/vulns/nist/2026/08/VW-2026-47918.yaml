title: django CMS is an easy-to-use and developer-friendly enterprise content 
  management system powered by Django. Prior to 5.0.8, the move_plugin endpoint 
  in cms/admin/placeholderadmin.py accepts an attacker-controlled plugin_parent 
  value without rejecting a plugin’s own identifier or a descendant identifier. 
  A staff user with plugin-change permission under CMS_PERMISSION can create a 
  parent_id cycle in the plugin tree. The _get_descendants_cte and 
  _get_ancestors_cte queries in cms/models/pluginmodel.py have no cycle guard, 
  so get_descendants() and later rendering, copy, or delete operations can 
  recurse indefinitely or reach a database recursion limit, corrupting the tree 
  and consuming request workers. This issue is fixed in versions 5.0.8.
