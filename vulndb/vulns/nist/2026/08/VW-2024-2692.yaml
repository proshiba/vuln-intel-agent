title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Fix out_fput in iommufd_fault_alloc()\n\nAs fput() calls the file->f_op->release
  op, where fault obj and ictx are\ngetting released, there is no need to release
  these two after fput() one\nmore time, which would result in imbalanced refcounts:\n\
  \  refcount_t: decrement hit 0; leaking memory.\n  WARNING: CPU: 48 PID: 2369 at
  lib/refcount.c:31 refcount_warn_saturate+0x60/0x230\n  Call trace:\n   refcount_warn_saturate+0x60/0x230
  (P)\n   refcount_warn_saturate+0x60/0x230 (L)\n   iommufd_fault_fops_release+0x9c/0xe0
  [iommufd]\n  ...\n  VFS: Close: file count is 0 (f_op=iommufd_fops [iommufd])\n\
  \  WARNING: CPU: 48 PID: 2369 at fs/open.c:1507 filp_flush+0x3c/0xf0\n  Call trace:\n\
  \   filp_flush+0x3c/0xf0 (P)\n   filp_flush+0x3c/0xf0 (L)\n   __arm64_sys_close+0x34/0x98\n\
  \  ...\n  imbalanced put on file reference count\n  WARNING: CPU: 48 PID: 2369 at
  fs/file.c:74 __file_ref_put+0x100/0x138\n  Call trace:\n   __file_ref_put+0x100/0x138
  (P)\n   "
