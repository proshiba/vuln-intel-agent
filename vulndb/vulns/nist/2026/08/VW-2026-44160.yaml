title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  virt-concat: free duplicate generated name\n\nEvery MTD registration runs mtd_virt_concat_create_join().\
  \  Once a\nvirtual concat has already been registered, the function builds the same\n\
  name again and takes the equal-name branch.  That branch skips to the\nnext item
  without freeing the newly allocated string.\n\nFree the temporary name before continuing."
