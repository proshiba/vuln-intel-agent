title: A flaw was found in SSSD. The sss_nss_protocol_parse_addr() function in 
  the NSS responder does not validate the addrlen field against the remaining 
  packet body size. A local attacker can exploit this via a crafted 
  GETHOSTBYADDR request to the NSS responder socket, causing an out-of-bounds 
  read and process crash, resulting in a denial of service.
