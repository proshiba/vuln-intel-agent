title: Leantime through 3.6.2 exposes the JSON-RPC methods 
  leantime.rpc.TwoFA.TwoFA.getSetupData, saveSecret, verifyAndEnable, and 
  disable2FA, which act on a caller-supplied userId parameter with no ownership 
  check, session pinning, or permission-attribute gate (unlike other RPC-exposed
  methods in the same dispatcher). Any authenticated user can invoke 
  getSetupData with an arbitrary userId to read that user's live TOTP secret, or
  disable2FA to strip another account's two-factor authentication entirely, 
  fully defeating account-level 2FA protection. This is related to 
  CVE-2026-15509, which covers a similar missing-authorization pattern in the 
  JSON-RPC editUser/addUser role-assignment path in the same application; the 
  TwoFA service methods addressed here are a distinct, independently fixable set
  of RPC endpoints.
