title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninet:
  fully convert sk->sk_rx_dst to RCU rules\n\nsyzbot reported various issues around
  early demux,\none being included in this changelog [1]\n\nsk->sk_rx_dst is using
  RCU protection without clearly\ndocumenting it.\n\nAnd following sequences in tcp_v4_do_rcv()/tcp_v6_do_rcv()\n\
  are not following standard RCU rules.\n\n[a]    dst_release(dst);\n[b]    sk->sk_rx_dst
  = NULL;\n\nThey look wrong because a delete operation of RCU protected\npointer
  is supposed to clear the pointer before\nthe call_rcu()/synchronize_rcu() guarding
  actual memory freeing.\n\nIn some cases indeed, dst could be freed before [b] is
  done.\n\nWe could cheat by clearing sk_rx_dst before calling\ndst_release(), but
  this seems the right time to stick\nto standard RCU annotations and debugging facilities.\n\
  \n[1]\nBUG: KASAN: use-after-free in dst_check include/net/dst.h:470 [inline]\n\
  BUG: KASAN: use-after-free in tcp_v4_early_demux+0x95b/0x960 net/ipv4/tcp_ipv4.c:1792\n\
