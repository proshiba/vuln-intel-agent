title: TypeBot is a chatbot builder tool. Prior to version 3.16.0, the OpenAI 
  "Create Transcription" action handler fetches a user-supplied audio URL using 
  `fetch()` without applying the SSRF protection that exists elsewhere in the 
  codebase. An attacker can direct the server to make HTTP requests to arbitrary
  internal addresses and localhost. The fetched content is passed to the OpenAI 
  Whisper API and the transcription result is returned to the attacker. Version 
  3.16.0 fixes the issue.
