title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  BPF: Zero-extend signed ALU32 div/mod results\n\nALU32 operations write a 32-bit
  result and leave the upper 32 bits of\nthe BPF register zero. The LoongArch JIT
  sign-extends the result of\nsigned ALU32 BPF_DIV and BPF_MOD (off=1), so a negative
  32-bit quotient\nor remainder leaves bits 63:32 set in JITted code while the verifier\n\
  and interpreter model those bits as zero.\n\nKeep sign-extension on the operands,
  which signed divide needs, and\nzero-extend the ALU32 result after the divide or
  modulo instruction,\nmatching the unsigned ALU32 div/mod paths and every other ALU32\n\
  operation in this JIT."
