title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-ioctl:
  fix a possible overflow in list_version_get_info\n\nsizeof(tt->version) is 12 bytes,
  but the code writes 16 bytes into the\noutput buffer - info->vers->version[0], info->vers->version[1],\n\
  info->vers->version[2] and info->vers->next. This can cause buffer\noverflow.\n\n\
  Fix this buffer overflow by replacing \"sizeof(tt->version)\" with\n\"sizeof(struct
  dm_target_versions)\"."
