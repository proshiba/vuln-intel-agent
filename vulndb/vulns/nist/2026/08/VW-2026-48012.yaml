title: A flaw was found in Submariner. This vulnerability allows a malicious 
  cluster (spoke) to redirect network traffic from other connected clusters 
  (peer clusters) by publishing a specially crafted network endpoint. The system
  fails to properly validate the network subnets provided by the malicious 
  cluster, enabling it to declare arbitrary network ranges. Consequently, all 
  network traffic intended for these arbitrary ranges from peer clusters will be
  rerouted through the attacker's tunnel, potentially leading to unauthorized 
  information disclosure or network disruption.
