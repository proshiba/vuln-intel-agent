title: 'A vulnerability in the web interface of Cisco Adaptive Security Appliance
  (ASA) Software and Firepower Threat Defense (FTD) Software could allow an unauthenticated,
  remote attacker to cause an affected device to reload unexpectedly, resulting in
  a denial of service (DoS) condition. The vulnerability is due to a lack of proper
  input validation of HTTP requests. An attacker could exploit this vulnerability
  by sending a crafted HTTP request to an affected device. An exploit could allow
  the attacker to cause a DoS condition. Note: This vulnerability applies to IP Version
  4 (IPv4) and IP Version 6 (IPv6) HTTP traffic.'
