title: Material for MkDocs is a powerful documentation framework built on top of
  MkDocs. From 7.2.0 until 9.7.7, the mountSearchSuggest function in 
  src/templates/assets/javascripts/components/search/suggest/index.ts contains a
  DOM-based cross-site scripting vulnerability in the optional search.suggest 
  feature that allows a crafted q URL parameter to execute JavaScript in a 
  documentation site's origin after user interaction. This issue is fixed in 
  version 9.7.7.
