title: "Issue summary: OpenSSL CMS decryption sizes the key-unwrap output buffer based\n\
  on querying the unwrapped key size, but the AES-WRAP-PAD unwrap primitive\ncan write
  and cleanse more bytes than that query reports, causing an 8-byte\nout-of-bounds
  heap write.\n\nImpact summary: An attacker who supplies a crafted CMS message can
  trigger a\ndeterministic 8-byte out-of-bounds heap write when the victim decrypts
  it\nwith CMS_decrypt(), corrupting the heap and typically resulting in a Denial\n\
  of Service.\n\nCWE: CWE-787: Out-of-bounds Write\n\nDescription: The key-wrap OID
  is potentially attacker-controlled on the wire.\nCMS unwrapping allows both id-aesNNN-wrap-pad
  and id-aesNNN-wrap ciphers.\nAn attacker can take a legitimate message and change
  a single OID byte to\nselect the padded variant while leaving the message otherwise
  valid. Since\nthe unwrap key is derived from the recipient's private operation (ECDH
  key\nagreement or ML-KEM decapsulation), the RFC 5649 integrity check cannot\npass,
