title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  aspeed: fix clock handling logic\n\nVideo engine uses eclk and vclk for its clock
  sources and its reset\ncontrol is coupled with eclk so the current clock enabling
  sequence works\nlike below.\n\n Enable eclk\n De-assert Video Engine reset\n 10ms
  delay\n Enable vclk\n\nIt introduces improper reset on the Video Engine hardware
  and eventually\nthe hardware generates unexpected DMA memory transfers that can
  corrupt\nmemory region in random and sporadic patterns. This issue is observed\n\
  very rarely on some specific AST2500 SoCs but it causes a critical\nkernel panic
  with making a various shape of signature so it's extremely\nhard to debug. Moreover,
  the issue is observed even when the video\nengine is not actively used because udevd
  turns on the video engine\nhardware for a short time to make a query in every boot.\n\
  \nTo fix this issue, this commit changes the clock handling logic to make\nthe reset
  de-assertion triggered after enabling"
