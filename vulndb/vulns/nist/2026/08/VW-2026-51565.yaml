title: xipblog module v2.0.1 and before for PrestaShop allows unauthenticated 
  remote attackers to inject arbitrary JavaScript via the name and content 
  parameters in ajax.php. The input is stored in the database without HTML 
  sanitization and rendered in Smarty templates without output escaping, 
  resulting in Stored Cross-Site Scripting (XSS). When an administrator reviews 
  comments in the back office, the payload executes with admin-level session 
  context, leading to full store compromise.
