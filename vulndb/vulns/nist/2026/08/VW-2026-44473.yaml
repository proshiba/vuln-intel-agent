title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc4-control: Fix TOCTOU in sof_ipc4_bytes_put\n\nIn sof_ipc4_bytes_put(),
  the copy size is derived from the old\ndata->size in the buffer rather than the
  incoming new data's size\nfield from ucontrol. If the new data has a different size,
  the copy\nuses the wrong length: it may truncate valid data or copy stale bytes.\n\
  \nFix by validating and using the incoming data's sof_abi_hdr.size from\nucontrol
  before copying."
