title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngeneve:
  make sure to pull inner header in geneve_rx()\n\nsyzbot triggered a bug in geneve_rx()
  [1]\n\nIssue is similar to the one I fixed in commit 8d975c15c0cd\n(\"ip6_tunnel:
  make sure to pull inner header in __ip6_tnl_rcv()\")\n\nWe have to save skb->network_header
  in a temporary variable\nin order to be able to recompute the network_header pointer\n\
  after a pskb_inet_may_pull() call.\n\npskb_inet_may_pull() makes sure the needed
  headers are in skb->head.\n\n[1]\nBUG: KMSAN: uninit-value in IP_ECN_decapsulate
