title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  mcast: avoid OOB read of num_dests header\n\nBefore the access to struct batadv_tvlv_mcast_tracker's
  num_dests, it is\nattempted to check whether enough space is actually in the network
  header.\nBut instead of using offsetofend() to check for the whole size (2) which\n\
  must be accessible, offsetof() of is called. The latter is always returning\n0.
  The comparison with the network header length will always return that\nenough data
  is available - even when only 1 or 0 bytes are accessible.\n\nInstead of using offsetofend(),
  use the more common check for the whole\nheader."
