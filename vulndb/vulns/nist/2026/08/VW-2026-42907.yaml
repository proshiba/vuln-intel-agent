title: A security flaw has been discovered in Open5GS up to 2.7.6. Impacted is 
  the function smf_gx_cca_cb of the component SMF Diameter Gx 
  Credit-Control-Answer Handler. The manipulation results in denial of service. 
  The attack can be launched remotely. The exploit has been released to the 
  public and may be used for attacks. Upgrading to version 2.7.7 is recommended 
  to address this issue. The patch is identified as 
  f23d7a5e959acd8f37b925dc29b85f26b7d391cb. Upgrading the affected component is 
  advised.
