title: GitPython before 3.1.59 fails to disable merge_includes when parsing 
  .gitmodules, allowing attackers to disclose local file content by including 
  arbitrary file paths via [include] directives. Attackers can craft a malicious
  .gitmodules file with include directives pointing to sensitive files; when 
  repo.submodules is accessed, GitConfigParser raises MissingSectionHeaderError 
  embedding the target file's first line verbatim in the exception message.
