title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the local branch of /docker-container-terminal in 
  apps/dokploy/server/wss/docker-container-terminal.ts authenticates with 
  validateRequest but does not authorize the attacker-controlled containerId 
  against the caller's role, organization, or service access before passing it 
  to `docker exec`, allowing any authenticated member to obtain a root shell in 
  arbitrary containers on a self-hosted instance. This issue is fixed in version
  0.29.13.
