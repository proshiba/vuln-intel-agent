title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Prevent tailcall infinite loop caused by freplace\n\nThere is a potential infinite
  loop issue that can occur when using a\ncombination of tail calls and freplace.\n\
  \nIn an upcoming selftest, the attach target for entry_freplace of\ntailcall_freplace.c
  is subprog_tc of tc_bpf2bpf.c, while the tail call in\nentry_freplace leads to entry_tc.
  This results in an infinite loop:\n\nentry_tc -> subprog_tc -> entry_freplace --tailcall->
  entry_tc.\n\nThe problem arises because the tail_call_cnt in entry_freplace resets
  to\nzero each time entry_freplace is executed, causing the tail call mechanism\n\
  to never terminate, eventually leading to a kernel panic.\n\nTo fix this issue,
  the solution is twofold:\n\n1. Prevent updating a program extended by an freplace
  program to a\n   prog_array map.\n2. Prevent extending a program that is already
  part of a prog_array map\n   with an freplace program.\n\nThis ensures that:\n\n\
