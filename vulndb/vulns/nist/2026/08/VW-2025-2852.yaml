title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/gup:
  fix FOLL_FORCE COW security issue and remove FOLL_COW\n\nEver since the Dirty COW
  (CVE-2016-5195) security issue happened, we know\nthat FOLL_FORCE can be possibly
  dangerous, especially if there are races\nthat can be exploited by user space.\n\
  \nRight now, it would be sufficient to have some code that sets a PTE of a\nR/O-mapped
  shared page dirty, in order for it to erroneously become\nwritable by FOLL_FORCE.\
  \  The implications of setting a write-protected PTE\ndirty might not be immediately
  obvious to everyone.\n\nAnd in fact ever since commit 9ae0f87d009c (\"mm/shmem:
  unconditionally set\npte dirty in mfill_atomic_install_pte\"), we can use UFFDIO_CONTINUE
  to map\na shmem page R/O while marking the pte dirty.  This can be used by\nunprivileged
  user space to modify tmpfs/shmem file content even if the\nuser does not have write
  permissions to the file, and to bypass memfd\nwrite sealing -- Dirty COW restricted
