title: Snipe-IT is an IT asset/license management system. Prior to 8.6.3, a 
  restricted user can request /api/v1/users/{target_id}/eulas to obtain another 
  user's randomized EULA filename and then download the signed file through 
  /account/stored-eula-file/{filename}. The primary /stored-eula-file/{filename}
  route correctly denies access, but app/Http/Controllers/ProfileController.php 
  and app/Http/Controllers/Api/UsersController.php do not consistently enforce 
  ownership and target-user authorization. This issue is fixed in version 8.6.3.
