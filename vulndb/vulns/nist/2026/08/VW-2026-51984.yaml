title: "A vulnerability was found in Forgejo up to 15.0.4. This issue affects the
  function net.LookupIP of the file services/migrations/allowlist/is_migrate_allowed.go
  of the component Repository Migration Handler. Performing a manipulation results
  in server-side request forgery. The attack can be initiated remotely. The exploit
  has been made public and could be used. The patch is named b313bb83f5ff22bcc0378e0e0ca7bbd58303f168.
  It is recommended to apply a patch to fix this issue. The project maintainer explains:
  \"I don't intend to backport this to v15 or v16 as it is a breaking change.\""
