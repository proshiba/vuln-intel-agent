title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: Fix division by zero in initialize_timer()\n\nA userspace-driven ALSA timer
  (SND_UTIMER) lets an unprivileged user set\nthe backing snd_timer's hardware resolution
  to an arbitrary 64-bit value\nvia SNDRV_TIMER_IOCTL_CREATE. snd_utimer_create()
  only rejects zero.\n\nWhen such a timer is bound to a sequencer queue, initialize_timer()\n\
  computes the tick period as\n\n\ttmr->ticks = 1000000000 / (r * freq);\n\nwhere
  r is that user-controlled resolution and freq is the sequencer\nupdate rate in Hz,
  clamped to MIN_FREQUENCY..MAX_FREQUENCY (10..6250).\nA resolution of 2^63 makes
  the 64-bit product r * freq wrap to zero for\nany even freq, including DEFAULT_FREQUENCY
  (1000), so the division faults\nwith a divide-by-zero.\n\nThe division runs under
  tmr->lock with interrupts disabled, so the oops\nleaves the spinlock held and hangs
  the CPU. It is reachable by an\nunprivileged user with access to /dev/snd/timer
  and /dev/snd/seq.\n\n  Oops: "
