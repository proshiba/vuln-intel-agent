title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: Clamp frame size in implicit-feedback mode\n\nsnd_usb_handle_sync_urb()
  scales received sync packet sizes by the sender's\nstride and stores the result
  directly in out_packet->packet_size[i]. If a\nconnected USB device sends an oversized
  sync packet, this frame count can\nexceed ep->maxframesize.\n\nThe un-clamped frame
  count then propagates to the playback endpoint queue,\npotentially driving packet
  transfers beyond the endpoint's hardware frame\nlimits.\n\nCap the calculated frame
  count against ep->maxframesize in\nsnd_usb_handle_sync_urb() to prevent oversized
  packets from entering the\nplayback queue."
