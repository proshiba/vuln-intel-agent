title: A vulnerability in the memory management of Cisco Adaptive Security 
  Appliance (ASA) Software and Firepower Threat Defense (FTD) Software could 
  allow an unauthenticated, remote attacker to cause a denial of service (DoS) 
  condition on an affected device. This vulnerability is due to improper 
  resource management when connection rates are high. An attacker could exploit 
  this vulnerability by opening a significant number of connections on an 
  affected device. A successful exploit could allow the attacker to cause the 
  device to reload, resulting in a DoS condition.
