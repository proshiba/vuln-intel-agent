title: Dell PowerStore SDNAS, contains an Out-of-bounds Write vulnerability in 
  SMB/CIFS. An unauthenticated attacker with remote access could potentially 
  exploit this vulnerability, leading to denial of service and remote execution.
  This is a Critical vulnerability as a remote user could send a specially 
  crafted SMB packet and cause a crash, that is persistent in case automatic 
  restarts are enabled. Additionally, a more sophisticated attacker could use 
  the same vulnerability for remote code execution.
