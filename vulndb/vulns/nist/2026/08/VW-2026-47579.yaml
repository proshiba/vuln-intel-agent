title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. Prior to 2.3.2, the archive creation
  endpoint in src/backend/ssh/file-manager.ts passes selected file basenames to 
  tar without an end-of-options marker and without making the operands 
  unambiguously relative. A user with access to an SSH file-manager session can 
  select basenames beginning with GNU tar options such as --checkpoint=1 and 
  --checkpoint-action=exec, causing tar, tar.gz, tar.bz2, or tar.xz creation to 
  interpret those names as options. The resulting checkpoint action executes 
  commands on the managed SSH host with the privileges of the connected SSH 
  account, allowing file disclosure, modification, and service disruption. This 
  issue is fixed in version 2.3.2.
