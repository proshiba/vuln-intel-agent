title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-auth:
  reject short AUTH_RECEIVE buffers\n\nnvmet_execute_auth_receive() trusts the AUTH_RECEIVE
  allocation length\nafter checking only that it is nonzero and matches the transfer
  length.\nIn the SUCCESS1 and FAILURE1/default states, that lets a remote NVMe-oF\n\
  initiator reach the fixed-size DH-HMAC-CHAP response builders with a\nkmalloc()
  buffer shorter than the response, so nvmet_auth_success1() and\nnvmet_auth_failure1()
  write past the allocation; both only WARN_ON the\nshort length and then format the
  message anyway.\n\nImpact: A remote NVMe-oF initiator with access to an auth-enabled
  target\ncan trigger a 16-byte heap out-of-bounds write via a one-byte\nAUTH_RECEIVE
  allocation length.\n\nCompute the minimum response length for the current DH-HMAC-CHAP
  step in\nnvmet_auth_receive_data_len() and report a zero data length when the\n\
  host-supplied allocation length is shorter, so the existing zero-length\ncheck in
  nvmet_execute_a"
