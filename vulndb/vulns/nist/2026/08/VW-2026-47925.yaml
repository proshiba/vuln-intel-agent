title: Libevent is an event notification library. Prior to 2.1.13 and 
  2.2.2-alpha, libevent has an incorrect integer conversion in event_tagging.c 
  when evtag_unmarshal_header uses evtag_decode_int to decode an 
  attacker-controlled uint32 payload length and returns it as a signed int. 
  Values above INT_MAX become negative or truncated, and evtag_unmarshal_string 
  can use the converted value in allocation sizing, producing a wrapped large 
  allocation request and denial of service. This issue is fixed in versions 
  2.1.13 and 2.2.2-alpha.
