  Fix memory leak in exec_queue_set_hang_replay_state()\n\nThe q->replay_state is
  blindly overwritten, which can potentially leak\nmemory that was previously allocated
  by vmemdup_user().\nReturn an error if q->replay_state is not empty.\n\nDiscovered
  using AI-assisted static analysis confirmed by Intel Product\nSecurity.\n\n(cherry
