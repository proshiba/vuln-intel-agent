title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_scmi: Fix the double free in scmi_debugfs_common_setup()\n\nClang static checker(scan-build)
  throws below warning：\n  |  drivers/firmware/arm_scmi/driver.c:line 2915, column
  2\n  |        Attempt to free released memory.\n\nWhen devm_add_action_or_reset()
  fails, scmi_debugfs_common_cleanup()\nwill run twice which causes double free of
  'dbg->name'.\n\nRemove the redundant scmi_debugfs_common_cleanup() to fix this problem."
