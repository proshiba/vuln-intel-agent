title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix use-after-free when reverting termination table\n\nWhen having multiple dests
  with termination tables and second one\nor afterwards fails the driver reverts usage
  of term tables but\ndoesn't reset the assignment in attr->dests[num_vport_dests].termtbl\n\
  which case a use-after-free when releasing the rule.\nFix by resetting the assignment
  of termtbl to null."
