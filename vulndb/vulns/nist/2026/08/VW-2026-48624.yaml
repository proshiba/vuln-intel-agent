title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/ptdump:
  always stabilise against page table freeing using init_mm\n\nPrevious commits have
  established the invariant that kernel page table\nfreeing is performed while an
  mmap read lock on init_mm is held, which\nfixes races between ptdump and kernel
  page table freeing over init_mm.\n\nHowever, x86 and arm64 can perform a ptdump
  over an mm other than init_mm\nvia ptdump_walk_pgd() and since kernel memory ranges
  are shared across\nnon-kernel mm's, this means that the race still exists for these
  cases.\n\nFix this by acquiring a nested mmap write lock for init_mm in\nptdump_walk_pgd().\n\
  \nThis is safe as we take this after mmap write locking the mm, and nothing\nacquires
  the init_mm lock first before locking an arbitrary mm, so no\ndeadlock is possible.\n\
  \nAlso update walk_page_range_debug() to assert that init_mm is write\nlocked, add
  a comment explaining why and remove some redundant code, and\neliminate the unnecessary
  and confusing"
