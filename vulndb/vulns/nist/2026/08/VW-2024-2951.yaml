title: "A vulnerability in the SSL VPN feature for Cisco Adaptive Security Appliance
  (ASA) Software and Cisco Firepower Threat Defense (FTD) Software could allow an
  unauthenticated, remote attacker to cause an affected device to reload unexpectedly,
  resulting in a denial of service (DoS) condition.\r\n\r This vulnerability is due
  to a logic error in memory management when the device is handling SSL VPN connections.
  An attacker could exploit this vulnerability by sending crafted SSL/TLS packets
  to the SSL VPN server of the affected device. A successful exploit could allow the
  attacker to cause the device to reload, resulting in a DoS condition."
