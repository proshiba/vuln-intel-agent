title: "The TIOCSCTTY ioctl handler drops the tty lock in order to acquire the process
  tree lock.  After reacquiring the tty lock, the handler did not revalidate the state
  of the terminal, and could proceed to link a terminal that was concurrently being
  destroyed to the calling process' session.\n\nAn unprivileged local user can exploit
  this race condition to escalate privileges."
