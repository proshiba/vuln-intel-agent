title: A flaw has been found in RooCodeInc Roo-Code up to 3.51.1. This issue 
  affects the function path.resolve of the file src/core/tools/ApplyPatchTool.ts
  of the component ApplyPatchTool. This manipulation causes path traversal. It 
  is possible to initiate the attack remotely. The exploit has been published 
  and may be used. Multiple isses were reported to the vendor beforehand. They 
  explain, that "they all apply to Roo Code, a project we no longer support - 
  the repository was archived a while ago, and we don't encourage anyone to use 
  it." This vulnerability only affects products that are no longer supported by 
  the maintainer.
