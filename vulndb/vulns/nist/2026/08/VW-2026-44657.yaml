title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoundwire:
  fix bug in sdw_add_element_group_count found by syzkaller\n\nThe original implementation
  caused an out-of-bounds memory access\nin the sdw_add_element_group_count for-loop
  when i == num.\n\nfor (i = 0; i <= num; i++) {\n    if (rate == group->rates[i]
  && lane == group->lanes[i])\n        ...\n\nTo fix this error, the function now
  checks for existing rate/lane\nentries in the group(a function parameter) using
  a for-loop before\nadding them.\n\nNo functional changes apart from this fix."
