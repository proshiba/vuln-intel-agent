title: Mailpit is an email testing tool and API for developers. Prior to 1.30.4,
  Mailpit reads SMTP commands through internal/smtpd/smtpd.go session.readLine()
  using bufio.Reader.ReadString before session.parseLine() parses the verb or 
  the RFC 5321 512-octet command-line limit is enforced. An unauthenticated 
  remote SMTP client can send an oversized single command line that is fully 
  allocated before syntax rejection or timeout, and the normal MaxMessageSize 
  and DATA limits do not apply to this pre-DATA path. The same command reader is
  used by handleAuthLogin(), handleAuthPlain(), and handleAuthCramMD5() 
  continuation lines, so concurrent oversized inputs can create memory pressure 
  and reduce service availability. This issue is fixed in version 1.30.4.
