title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Fix repeated calls to sock_put() when msg has more_data\n\nIn tcp_bpf_send_verdict()
  redirection, the eval variable is assigned to\n__SK_REDIRECT after the apply_bytes
  data is sent, if msg has more_data,\nsock_put() will be called multiple times.\n\
  \nWe should reset the eval variable to __SK_NONE every time more_data\nstarts.\n\
  \nThis causes:\n\nIPv4: Attempt to release TCP socket in state 1 00000000b4c925d7\n\
  ------------[ cut here ]------------\nrefcount_t: addition on 0; use-after-free.\n\
  WARNING: CPU: 5 PID: 4482 at lib/refcount.c:25 refcount_warn_saturate+0x7d/0x110\n\
  Modules linked in:\nCPU: 5 PID: 4482 Comm: sockhash_bypass Kdump: loaded Not tainted
  6.0.0 #1\nHardware name: Red Hat KVM, BIOS 1.11.0-2.el7 04/01/2014\nCall Trace:\n\
  \ <TASK>\n __tcp_transmit_skb+0xa1b/0xb90\n ? __alloc_skb+0x8c/0x1a0\n ? __kmalloc_node_track_caller+0x184/0x320\n\
  \ tcp_write_xmit+0x22a/0x1110\n __tcp_push_pending_frames+0x32/0xf0\n do_tcp_sendpages+0x"
