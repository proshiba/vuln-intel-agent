title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate minimum PDU size for transform requests\n\nThe receive path applies the
  minimum SMB2 PDU size check only when\nProtocolId is SMB2_PROTO_NUMBER. A packet
  carrying\nSMB2_TRANSFORM_PROTO_NUM bypasses the check even when the negotiated\n\
  dialect does not provide transform handling.\n\nOn an SMB 2.1 connection, a short
  transform packet therefore reaches\ninit_smb2_rsp_hdr(), which interprets the request
  as a full SMB2 header\nand reads beyond the request allocation. The copied fields
  can then be\nreturned to the unauthenticated client.\n\nCompression transforms are
  converted to ordinary SMB2 messages before\nprotocol validation. After that conversion,
  validate ordinary SMB2\nrequests against SMB2_MIN_SUPPORTED_PDU_SIZE and require
  encryption\ntransform requests to contain both a transform header and an SMB2\n\
  header. This rejects truncated requests before work allocation."
