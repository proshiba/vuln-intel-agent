title: A vulnerability was identified in Open5GS up to 2.7.1. This issue affects
  the function pcrf_rx_aar_cb of the file src/pcrf/pcrf-rx-path.c of the 
  component Diameter Rx Handler. The manipulation of the argument 
  num_of_media_component/num_of_sub leads to buffer overflow. The attack can be 
  initiated remotely. The exploit is publicly available and might be used. 
  Upgrading to version 2.7.2 is capable of addressing this issue. The identifier
  of the patch is 87b4e4535c77ded627cdb6f4e4e2e3ea761f40b7. It is recommended to
  upgrade the affected component.
