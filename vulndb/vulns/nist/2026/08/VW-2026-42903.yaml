title: The Social Login, Passkeys, Magic Link & Email OTP – Passwordless Login 
  by VentraConnect plugin for WordPress is vulnerable to Authentication Bypass 
  via Unverified Provider Email in all versions up to, and including, 1.4.3. 
  This is due to the plugin trusting the unverified email field returned by 
  Spotify's /v1/me endpoint as proof of mailbox ownership — 
  Generic::normalize_common() copies this value into the normalized profile 
  without requiring an email_verified assertion, and 
  User_Links::link_or_login_user() subsequently passes it directly to 
  get_user_by('email', $email) and issues a persistent authentication cookie via
  wp_set_auth_cookie() without a provider-specific verified-email gate, a local 
  mailbox challenge, or a logged-in approval step. This makes it possible for 
  unauthenticated attackers to log in as any existing WordPress user, including 
  Administrators, by supplying a known target email address through a controlled
  Spotify OAuth flow, gaining full administrative access to the
