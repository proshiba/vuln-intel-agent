title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  nvec: fix use-after-free in nvec_rx_completed()\n\nIn nvec_rx_completed(), when
  an incomplete RX transfer is detected,\nnvec_msg_free() is called to return the
  message back to the pool by\nclearing its 'used' atomic flag. Immediately after
  this, the code\naccesses nvec->rx->data[0] to check the message type.\n\nSince nvec_msg_free()
  marks the pool slot as available via atomic_set(),\nany concurrent or subsequent
  call to nvec_msg_alloc() could claim that\nsame slot and overwrite its data[] array.
  Reading nvec->rx->data[0] after\nfreeing the message is therefore a use-after-free.\n\
  \nFix this by saving the message type byte before calling nvec_msg_free(),\nthen
  using the saved value for the battery quirk check."
