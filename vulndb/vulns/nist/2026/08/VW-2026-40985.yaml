title: A weakness has been identified in PhialsBasement KoboldCPP-MCP-Server 
  1.0.0. Affected by this issue is the function makeRequest of the file 
  src/index.ts of the component BaseConfigSchema. Executing a manipulation of 
  the argument apiUrl can lead to server-side request forgery. It is possible to
  launch the attack on the local host. The project was informed of the problem 
  early through an issue report but has not responded yet.
