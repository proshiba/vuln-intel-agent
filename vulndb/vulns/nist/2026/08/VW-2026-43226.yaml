title: An authorization bypass vulnerability in LXD allows an authenticated 
  attacker to bypass project-level container isolation restrictions. When a 
  project is configured with restrictions on container privileges (such as 
  enforcing restricted.containers.privilege=isolated), LXD fails to enforce the 
  requirement if an instance configuration omits the security.idmap.isolated 
  key. An attacker can exploit this flaw by creating or updating an instance 
  without explicitly setting security.idmap.isolated, bypassing the target 
  project's security constraints.
