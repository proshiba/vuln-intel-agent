title: The Pods  WordPress plugin before 3.3.9.1 does not correctly compare a 
  display callback against its list of blocked functions, allowing users with 
  the author role and above to execute arbitrary code on the server. Only sites 
  using the restricted display-callback mode are affected, which is the 
  automatic default on installations whose first Pods version predates 3.1.
