title: Ech0 before 5.0.1 does not impose any size or shape limit on the 
  Accept-Language header processed by its i18n middleware, which runs on every 
  HTTP request. The header is passed unfiltered to go-i18n's NewLocalizer, which
  internally calls golang.org/x/text/language.ParseAcceptLanguage. The 
  CVE-2022-32149 mitigation in x/text caps '-' characters but not '_' 
  characters, which the parser aliases to '-', allowing quadratic-time parsing 
  to be triggered with a large header (up to Go's default 1 MiB) built from 
  underscore separators. An unauthenticated attacker can send such requests to 
  consume roughly 1.5 seconds of CPU each, and concurrent requests can saturate 
  a multi-core server (denial of service).
