title: A flaw was found in GIMP's file-png plugin. A remote attacker can exploit
  this by crafting a malicious Animated Portable Network Graphics (APNG) image 
  containing an oversized tRNS chunk. This can lead to a stack-based buffer 
  overflow (CWE-121), causing the file-png plugin to crash and resulting in a 
  Denial of Service (DoS) for the user.
