title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm:
  tpm2-sessions: wait for async KPP completion in tpm_buf_append_salt\n\ntpm_buf_append_salt()
  in drivers/char/tpm/tpm2-sessions.c calls\ncrypto_kpp_generate_public_key() and
  crypto_kpp_compute_shared_secret()\nwithout installing a completion callback, discards
  both return values,\nand immediately frees the kpp_request via kpp_request_free().
  When the\nresolved ecdh-nist-p256 KPP backend is asynchronous (atmel-ecc, HPRE,\n\
  keembay-ocs), either operation returns -EINPROGRESS and the deferred\ncompletion
  worker dereferences the freed request.\n\nThe path fires automatically from the
  hwrng_fillfn kernel thread via\ntpm_get_random -> tpm2_get_random -> tpm2_start_auth_session
  ->\ntpm_buf_append_salt on every entropy poll, without any userland action.\n\n\
  Install crypto_req_done as the completion callback, wrap both KPP\noperations in
  crypto_wait_req(), and propagate errors to the caller.\nThe wait is a no-op for
  synchronous backends."
