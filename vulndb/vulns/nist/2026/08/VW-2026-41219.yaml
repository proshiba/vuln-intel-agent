title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfscrypt:
  Add missing superblock check in find_or_insert_direct_key()\n\nThe legacy 'fscrypt_direct_keys'
  table caches master keys that are used\nby v1 encryption policies that have FSCRYPT_POLICY_FLAG_DIRECT_KEY.\n\
  It's just a global table for all filesystems (since the keys can be\nprovided by
  the legacy process-subscribed keyrings mechanism, which\nmakes it difficult to reuse
  super_block::s_master_keys).\n\nThe entries in it ('struct fscrypt_direct_key')
  do contain a super_block\npointer, though, for passing to fscrypt_destroy_inline_crypt_key()
  when\nthe last inode that references the key is evicted.\n\nHowever, when finding
  the fscrypt_direct_key for an inode, we weren't\nactually comparing the super_block
  pointer.  As a result, inodes with\ndifferent super_blocks could point to the same
  fscrypt_direct_key.  That\ncould extend the lifetime of a fscrypt_direct_key beyond
  the\nsuper_block it points to, causing a use-after-free later"
