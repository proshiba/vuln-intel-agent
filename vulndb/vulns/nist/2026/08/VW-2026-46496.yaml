title: Lemur manages TLS certificate creation. Prior to 1.9.3, 
  _validate_acme_url enforced ACME_DIRECTORY_HOST_ALLOWLIST when an authority 
  was created, but PUT /api/1/authorities/ passed options to 
  lemur/authorities/service.py without applying the same check. A user holding 
  an authority role could replace the stored acme_url with an internal service 
  or instance-metadata URL such as 169.254.169.254. The next issuance operation 
  loaded that value and passed it to ClientV2.get_directory, causing an outbound
  request from the Lemur backend. This bypassed the creation-time mitigation for
  CVE-2026-55166 and could expose internal services or cloud metadata. The fix 
  revalidates acme_url whenever authority options are updated. This issue is 
  fixed in version 1.9.3.
