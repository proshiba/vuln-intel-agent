title: OpenEXR is the reference implementation and specification for the EXR 
  image file format, widely used in the motion picture industry. In versions 
  3.3.0 through 3.3.12 and 3.4.0 through 3.4.13, the PyOpenEXR Python bindings 
  return stale heap data when reading a crafted deep scanline EXR that uses 
  layer-prefixed RGB channels. With the default channel coalescing 
  (separate_channels=False), the wrapper groups channels such as left.R, left.G,
  and left.B into a single RGB sample array, but the lane-offset calculation in 
  PyPart::setDeepSliceData() only recognizes the exact unprefixed names G, B, 
  and A. As a result, prefixed channels like left.G and left.B are decoded into 
  lane 0 while lanes 1 and 2 are left uninitialized and returned to Python. A 
