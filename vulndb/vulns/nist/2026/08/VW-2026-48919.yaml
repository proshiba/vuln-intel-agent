title: Hugo's security.http.urls allowlist is the only control on outbound 
  fetches made by resources.GetRemote, and it inspects the URL text alone. 
  CheckAllowedHTTPURL in config/security/securityConfig.go applies the 
  configured pattern list and then re-checks a canonicalised form of an integer,
  hex or octal IPv4 host, but it never resolves the hostname and never inspects 
  the address the HTTP client actually connects to. The client constructed in 
  resources/resource_factories/create/create.go installs no dial-time hook, so 
  no check occurs at connection time either. A hostname that resolves to a 
  loopback, private or cloud-metadata address therefore satisfies the policy, 
  and the response body is embedded in the generated site. An attacker who can 
  supply a URL through content, for example a front-matter field or a CMS field,
  can make the build fetch an internal endpoint and publish the response in the 
  static output, so the build artifact itself carries the data out.
