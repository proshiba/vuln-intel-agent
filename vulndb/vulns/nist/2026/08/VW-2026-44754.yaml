title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix NMI/tracepoint re-entry deadlock on lru locks\n\nNMI and tracepoint BPF programs
  can re-enter the per-CPU or global\nLRU lock that bpf_lru_pop_free()/push_free()
  already hold on the\nsame CPU, AA-deadlocking. Lockdep reports \"inconsistent\n\
  {INITIAL USE} -> {IN-NMI}\" on &l->lock (syzbot c69a0a2c816716f1e0d5)\nand \"possible
  recursive locking detected\" on &loc_l->lock (syzbot\n18b26edb69b2e19f3b33).\n\n\
  Prior trylock and rqspinlock based fixes (see links) were nacked\nbecause compromised
  on reliability.\n\nThis patch converts every LRU lock site to rqspinlock_t and adds
  a\nrecovery path for some failure windows to avoid node leaks.\n\nFailure recovery:\n\
  \n - *_pop_free top-level: return NULL; prealloc_lru_pop() already\n   treats that
  as no-free-element (-ENOMEM).\n\n - Cross-CPU steal: skip the victim's locked loc_l,
  try next CPU.\n\n - Post-steal local lock fail: publish stolen node to lockless\n\
