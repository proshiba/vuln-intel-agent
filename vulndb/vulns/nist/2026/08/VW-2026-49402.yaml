title: A flaw was found in sos clean, a utility within the sos package. This 
  vulnerability allows a local attacker to perform arbitrary file creation or 
  overwrite. By crafting a malicious tar archive, an attacker can exploit a path
  traversal issue during tar extraction, where symlink and hardlink targets are 
  not properly validated. This enables the attacker to write files to arbitrary 
  locations on the system with the privileges of the sos clean process, which 
  often runs as root.
