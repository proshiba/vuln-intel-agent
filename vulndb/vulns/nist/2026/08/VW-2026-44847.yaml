title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix ACKALL packet handling\n\nrxrpc_input_ackall() accepts ACKALL packets without
  checking whether the\ncall is in a state that can legitimately have outstanding
  transmit buffers.\nA forged ACKALL can therefore reach a new service call in\nRXRPC_CALL_SERVER_RECV_REQUEST
  before any reply packets have been queued.\n\nIn that state call->tx_top is zero
  and call->tx_queue is NULL, so\nrxrpc_rotate_tx_window() dereferences a NULL txqueue
  and triggers a\nnull-pointer dereference.\n\nFix the handling of ACKALL packets
  by the following means:\n\n (1) Add two new call states: RXRPC_CALL_CLIENT_PRE_SEND
  which indicates\n     that the client call is connected, but nothing has been transmitted
  as\n     yet; and RXRPC_CALL_CLIENT_AWAIT_ACK, which indicates that everything\n\
  \     has been transmitted at least once, but we're now waiting for the\n     stuff
  remaining in the Tx buffer to be ACK'd (retransmissions may\n     still happen).\n\
  \n     T"
