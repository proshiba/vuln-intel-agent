title: n8n before 2.32.1 (and before 2.31.5) is vulnerable to account takeover 
  via the Token Exchange Embed Login feature. When a validly-signed incoming 
  token was matched to a local account by its email claim, the service did not 
  verify that the email claim was verified, nor that the trusted key's permitted
  role ceiling covered that account. As a result, anyone able to obtain a token 
  accepted by a configured trusted key (for example, a trusted issuer emitting 
  unverified email addresses) could authenticate as any existing user and gain 
  full account control. This issue only affects instances where the embed login 
  feature is enabled and at least one trusted key source is configured.
