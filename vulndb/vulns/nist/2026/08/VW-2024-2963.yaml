title: "A vulnerability in the payload inspection for Ethernet Industrial Protocol
  (ENIP) traffic for Cisco Firepower Threat Defense (FTD) Software could allow an
  unauthenticated, remote attacker to bypass configured rules for ENIP traffic.\r\n\
  \r\nThis vulnerability is due to incomplete processing during deep packet inspection
  for ENIP packets. An attacker could exploit this vulnerability by sending a crafted
  ENIP packet to the targeted interface. A successful exploit could allow the attacker
  to bypass configured access control and intrusion policies that should trigger and
  drop for the ENIP packet."
