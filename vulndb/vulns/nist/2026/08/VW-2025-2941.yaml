title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal/drivers/hisi:
  Drop second sensor hi3660\n\nThe commit 74c8e6bffbe1 (\"driver core: Add __alloc_size
  hint to devm\nallocators\") exposes a panic \"BRK handler: Fatal exception\" on
  the\nhi3660_thermal_probe funciton.\nThis is because the function allocates memory
  for only one\nsensors array entry, but tries to fill up a second one.\n\nFix this
  by removing the unneeded second access."
