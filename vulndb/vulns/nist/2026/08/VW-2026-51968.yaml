title: SiYuan before v3.8.1 contains a stored cross-site scripting vulnerability
  in confirmDialog() where unescaped package names and notebook names are 
  interpolated directly into innerHTML assignments. Attackers can submit 
  malicious bazaar packages with HTML/script payloads in the name field that 
  execute in users' browsers when uninstalling packages or unlocking encrypted 
  notebooks.
