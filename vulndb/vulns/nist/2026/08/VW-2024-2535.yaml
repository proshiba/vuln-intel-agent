title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/oa:
  Fix overflow in oa batch buffer\n\nBy default xe_bb_create_job() appends a MI_BATCH_BUFFER_END
  to batch\nbuffer, this is not a problem if batch buffer is only used once but\n\
  oa reuses the batch buffer for the same metric and at each call\nit appends a MI_BATCH_BUFFER_END,
  printing the warning below and then\noverflowing.\n\n[  381.072016] ------------[
  cut here ]------------\n[  381.072019] xe 0000:00:02.0: [drm] Assertion `bb->len
  * 4 + bb_prefetch(q->gt) <= size` failed!\n               platform: LUNARLAKE subplatform:
  1\n               graphics: Xe2_LPG / Xe2_HPG 20.04 step B0\n               media:
  Xe2_LPM / Xe2_HPM 20.00 step B0\n               tile: 0 VRAM 0 B\n             \
  \  GT: 0 type 1\n\nSo here checking if batch buffer already have MI_BATCH_BUFFER_END
  if\nnot append it.\n\nv2:\n- simply fix, suggestion from Ashutosh\n\n(cherry picked
  from commit 9ba0e0f30ca42a98af3689460063edfb6315718a)"
