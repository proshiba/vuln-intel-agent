title: HashBrown CMS through 1.4.6 contains an OS Command Injection 
  vulnerability (CWE-78) in the media upload thumbnail generation routine. 
  Media.generateThumbnail in src/Server/Entity/Resource/Media.js builds a 
  temporary file path as 'thumbnail' + Path.extname(filename) and passes it, 
  unescaped, into a shell command executed via AppService.exec ('convert ' + 
  tempFile + ...).
