title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  nl80211: reject iftype change with mesh ID change\n\nIt's currently possible to
  change the mesh ID when the\ninterface isn't yet in mesh mode, at the same time
  as\nchanging it into mesh mode. This leads to an overwrite\nof data in the wdev->u
  union for the interface type it\ncurrently has, causing cfg80211_change_iface()
  to do\nwrong things when switching.\n\nWe could probably allow setting an interface
  to mesh\nwhile setting the mesh ID at the same time by doing a\ndifferent order
  of operations here, but realistically\nthere's no userspace that's going to do this,
  so just\ndisallow changes in iftype when setting mesh ID."
