title: openssl_encrypt before 1.4.9 fails to prevent namespace collisions 
  between own identities and contacts in IdentityStore, allowing attackers to 
  create shadowed contact entries invisible until the corresponding own identity
  is deleted. When the own identity is deleted, the shadowed contact becomes 
  visible and resolves to the attacker's keys, enabling silent key substitution 
  for encrypted files.
