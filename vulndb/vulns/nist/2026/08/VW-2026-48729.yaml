title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_cake: drop WARN_ON(1) for malformed packets in ACK filter\n\nThe sch_cake ACK
  filter parses packets to find the TCP header and filter\nduplicated ACKs if the
  flow is backlogged. The parsing code contains a\nWARN_ON(1) which can be triggered
  by a malformed IP header in certain\ncases. Depending on the system configuration,
  this leads either to\neither spamming dmesg with warnings, or a panic if panic_on_warn
  is set.\n\nThe code already correctly skips the offending packet in the branch that\n\
  triggers the warning, so the WARN_ON itself doesn't really serve any\npurpose. So
  just drop it altogether to avoid the inconvenient side\neffects."
