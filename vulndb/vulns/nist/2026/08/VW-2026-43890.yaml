title: SiYuan versions before v3.7.4 contain a missing authorization 
  vulnerability in the /api/ref/refreshBacklink endpoint that allows anonymous 
  readers to trigger persistent server-side writes. Attackers can invoke the 
  endpoint with an attacker-controlled block ID to flush transaction queues, 
  scan all references globally, and enqueue database writes, bypassing read-only
  protections and enabling resource amplification attacks.
