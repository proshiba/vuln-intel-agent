title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  igmp: Fix potential memory leaks in igmp_mod_timer() and igmp_stop_timer()\n\nWhen
  a timer is deleted and not re-armed in igmp_mod_timer(), or stopped\nin igmp_stop_timer(),
  the code currently decrements the reference counter\nof the multicast list entry
  @im using refcount_dec(&im->refcnt).\n\nHowever, both functions can be called from
  the RCU reader path:\n- igmp_mod_timer() via igmp_heard_query() -> for_each_pmc_rcu()\n\
  - igmp_stop_timer() via igmp_rcv() -> igmp_heard_report()\n\nIf the group im was
  concurrently removed from the list by ip_mc_dec_group(),\nits reference count might
  have already been decremented to 1.\n\nIn this case, timer_delete() succeeds, and
  refcount_dec() decrements\nthe refcount from 1 to 0. Since refcount_dec() does not
  free the object\nwhen it hits 0 (unlike ip_ma_put()), the im structure is leaked.\n\
  \nFix this by using ip_ma_put(im) instead of refcount_dec(&im->refcnt),\nand deferring
  the put until afte"
