title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  avoid fs reclaim while using current->journal_info\n\nhandle_reply() stores a `ceph_mds_request`
  pointer in\n`current->journal_info` while filling the inode and dentry cache from\n\
  an MDS reply.\n\nAn allocation in this section can enter direct reclaim and prune\n\
  dentries from another filesystem.  If this dirties an ext4 inode, ext4\nstarts a
  JBD2 transaction.  JBD2 interprets the Ceph request in\n`current->journal_info`
  as a journal handle and dereferences the\nrequest's `r_tid` as `h_transaction`,
  causing a kernel crash, e.g.:\n\n Unable to handle kernel paging request at virtual
  address 00000000077b4818\n [...]\n Internal error: Oops: 0000000096000004 [#1] \
  \ SMP\n Modules linked in:\n CPU: 6 UID: 0 PID: 2699135 Comm: kworker/6:3 Tainted:
  G        W           6.18.38-i3 #1113 NONE\n [...]\n Workqueue: ceph-msgr ceph_con_workfn\n\
  \ pstate: 80400009 (Nzcv daif +PAN -UAO -TCO -DIT -SSBS BTYPE=--)\n pc : jbd2__journal_start+0x2c/0x208\n\
  \ l"
