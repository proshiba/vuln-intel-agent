title: A vulnerability in the CLI of Cisco FXOS Software could allow an 
  authenticated, local attacker to read or write arbitrary files on the 
  underlying operating system (OS). The vulnerability is due to insufficient 
  input validation. An attacker could exploit this vulnerability by including 
  crafted arguments to a specific CLI command. A successful exploit could allow 
  the attacker to read or write to arbitrary files on the underlying OS.
