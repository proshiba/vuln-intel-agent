title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  defer key slot crypto freeing to workqueue\n\nKey slots are released through a kref
  and the existing release path\nfrees the AEAD transforms from an RCU callback. That
  is not safe for all\ncrypto implementations: crypto_free_aead can sleep, for example
  when an\nasync or hardware implementation has teardown work to complete.\n\nUse
  queue_rcu_work for key-slot release. This keeps the RCU grace period\nneeded by
  lockless key-slot readers, but runs the actual crypto teardown\nfrom workqueue context
  where sleeping is allowed. Once the rcu_work\ncallback runs, pre-existing RCU readers
  are gone, and the final kref put\nalready proves that no transform user remains,
  so the worker can release\nthe AEAD transforms and free the slot directly.\n\nThe
  previous patch drains ovpn_wq during module exit, so queued key-slot\nteardown work
  cannot outlive module text."
