title: "The MCP Streamable HTTP server transport (WebFlux and WebMvc variants) does
  not place any limit on the number of sessions it retains, and by default does not
  require clients to be authenticated. As a result, a remote attacker can cause the
  server to accumulate an unbounded number of sessions over time, gradually exhausting
  available memory and ultimately causing a Denial of Service that affects all legitimate
  clients.\nAffected versions:\nSpring AI: 2.0.0"
