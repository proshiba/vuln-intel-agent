title: Budibase before 3.40.0 contains a cross-site request forgery 
  vulnerability in the chat-link handoff endpoint that allows attackers to bind 
  an external chat identity to a victim's account. Attackers can craft a 
  phishing page that auto-submits a POST request with a leaked confirmation 
  token to bind their chat identity to a victim user's account, enabling 
  impersonation within agent operations and inheritance of victim permissions.
