title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfscrypt:
  use the mount idmap for the owner check in fscrypt_ioctl_set_policy()\n\nfscrypt_ioctl_set_policy()
  calls inode_owner_or_capable() with\n&nop_mnt_idmap before allowing an encryption
  policy to be set, instead\nof the idmap of the mount the ioctl was issued on.\n\n\
  fscrypt is used by filesystems that support idmapped mounts (e.g. ext4,\nf2fs),
  so on such a mount this compares the caller's fsuid against the\nunmapped on-disk
  owner rather than the mapped owner: the actual owner\ncan be wrongly denied with
  -EACCES and an unrelated caller wrongly\nallowed.  Use file_mnt_idmap(filp) instead."
