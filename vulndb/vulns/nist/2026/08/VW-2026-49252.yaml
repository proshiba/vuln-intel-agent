title: The getgrav/grav-plugin-login Composer plugin before 3.9.1 (used by Grav)
  compares password reset and account activation tokens using a 
  non-constant-time === string comparison instead of hash_equals() in 
  classes/Controller.php (taskReset()) and login.php (activation handler). 
  Because the token-submission endpoint (taskReset) also lacks rate limiting, an
  attacker could in principle send repeated token guesses against a known 
  username and use the timing differences to attempt to recover a valid token, 
  though the vendor rates the practical exploitability as low and no end-to-end 
  network exploit has been demonstrated.
