title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  dwc: Avoid dwc_pcie_rasdes_debugfs_deinit() NULL dereference when no RAS DES capability\n\
  \ndwc_pcie_rasdes_debugfs_init() returns success when the controller has no\nRAS
  DES capability, leaving pci->debugfs->rasdes_info unset. The common\ndebugfs teardown
  path still calls dwc_pcie_rasdes_debugfs_deinit(), which\ndereferences rasdes_info
  unconditionally.\n\nReturn early when no RAS DES state was allocated. In that case
  no RAS DES\nmutex was initialized, so there is nothing to destroy.\n\n[mani: reworded
  subject]"
