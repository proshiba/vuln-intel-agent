title: A vulnerability in the Secure Sockets Layer (SSL)/Transport Layer 
  Security (TLS) protocol inspection engine of Cisco Firepower Threat Defense 
  (FTD) Software could allow an unauthenticated, remote attacker to bypass the 
  configured file policies on an affected system. The vulnerability is due to 
  errors when handling specific SSL/TLS messages. An attacker could exploit this
  vulnerability by sending crafted HTTP packets that would flow through an 
  affected system. A successful exploit could allow the attacker to bypass the 
  configured file policies and deliver a malicious payload to the protected 
  network.
