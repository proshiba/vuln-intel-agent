title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  Fix crash by keep old cfg when update TCs more than queues\n\nThere are problems
  if allocated queues less than Traffic Classes.\n\nCommit a632b2a4c920 (\"ice: ethtool:
  Prohibit improper channel config\nfor DCB\") already disallow setting less queues
  than TCs.\n\nAnother case is if we first set less queues, and later update more
  TCs\nconfig due to LLDP, ice_vsi_cfg_tc() will failed but left dirty\nnum_txq/rxq
  and tc_cfg in vsi, that will cause invalid pointer access.\n\n[   95.968089] ice
  0000:3b:00.1: More TCs defined than queues/rings allocated.\n[   95.968092] ice
  0000:3b:00.1: Trying to use more Rx queues (8), than were allocated (1)!\n[   95.968093]
  ice 0000:3b:00.1: Failed to config TC for VSI index: 0\n[   95.969621] general protection
  fault: 0000 [#1] SMP NOPTI\n[   95.969705] CPU: 1 PID: 58405 Comm: lldpad Kdump:
  loaded Tainted: G     U  W  O     --------- -t - 4.18.0 #1\n[   95.969867] Hardware
  name: O.E.M/BC11SPSCB10, BI"
