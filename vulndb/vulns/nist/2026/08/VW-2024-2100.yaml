title: "In the Linux kernel, the following vulnerability has been resolved:\n\nseg6:
  fix parameter passing when calling NF_HOOK() in End.DX4 and End.DX6 behaviors\n\n\
  input_action_end_dx4() and input_action_end_dx6() are called NF_HOOK() for\nPREROUTING
  hook, in PREROUTING hook, we should passing a valid indev,\nand a NULL outdev to
