title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en
  : Fix memory out-of-bounds in bnxt_fill_hw_rss_tbl()\n\nA recent commit has modified
  the code in __bnxt_reserve_rings() to\nset the default RSS indirection table to
  default only when the number\nof RX rings is changing.  While this works for newer
  firmware that\nrequires RX ring reservations, it causes the regression on older\n\
  firmware not requiring RX ring resrvations (BNXT_NEW_RM() returns\nfalse).\n\nWith
  older firmware, RX ring reservations are not required and so\nhw_resc->resv_rx_rings
  is not always set to the proper value.  The\ncomparison:\n\nif (old_rx_rings !=
  bp->hw_resc.resv_rx_rings)\n\nin __bnxt_reserve_rings() may be false even when the
  RX rings are\nchanging.  This will cause __bnxt_reserve_rings() to skip setting\n\
  the default RSS indirection table to default to match the current\nnumber of RX
  rings.  This may later cause bnxt_fill_hw_rss_tbl() to\nuse an out-of-range index.\n\
  \nWe already have bnxt_check_rss_tbl_no"
