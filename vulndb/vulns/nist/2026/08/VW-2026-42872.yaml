title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  require CAP_NET_ADMIN in the device netns for changelink\n\nA tunnel changelink()
  operates on at most two netns, dev_net(dev) and\nthe sticky underlay netns vxlan->net.
  They differ once the device is\ncreated in or moved to a netns other than the one
  the request runs in.\nThe rtnl changelink path checks CAP_NET_ADMIN only against
  dev_net(dev),\nso a caller privileged there but not in vxlan->net can rewrite a
  vxlan\ndevice whose underlay lives in vxlan->net.\n\nvxlan_changelink() validates
  and applies the new configuration against\nvxlan->net (vxlan_config_validate(vxlan->net,
  ...)) and can reopen the\nunderlay socket in that netns, so the same reasoning as
  the tunnel\nchangelink series applies here.\n\nGate vxlan_changelink() with rtnl_dev_link_net_capable(),
  at the top of\nthe op before any attribute is parsed, matching ipgre_changelink()
  and\nthe rest of the \"require CAP_NET_ADMIN in the device netns for\nchangelink\"\
  \ series.\n"
