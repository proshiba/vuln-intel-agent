title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_bpf: reject dev-bound programs bound to a different device\n\ncls_bpf_prog_from_efd()
  obtained a SCHED_CLS program via\nbpf_prog_get_type_dev() but never verified that
  a device-bound (offloaded)\nprogram's bound netdev matches the TC netdev the classifier
  is being\nattached to. This let a program loaded with prog_ifindex for device A
  be\nattached via cls_bpf + skip_sw to device B; deleting device A then\ndestroyed
  the program's offload state while it was still attached to\ndevice B, triggering
  a netdevsim WARN (panic with panic_on_warn=1).\n\nMirror the XDP attach path (net/core/dev.c)
  and reject the attach with\n-EINVAL when a dev-bound program's bound device does
  not match the\ntarget device."
