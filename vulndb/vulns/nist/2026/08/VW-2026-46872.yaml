title: 'Vulnerability in the Oracle Agile PLM product of Oracle Supply Chain (component:
  PGC / Excel Plugin).   The supported version that is affected is 9.3.6. Easily exploitable
  vulnerability allows low privileged attacker with network access via HTTP to compromise
  Oracle Agile PLM.  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Agile PLM
  accessible data and unauthorized ability to cause a hang or frequently repeatable
  crash (complete DOS) of Oracle Agile PLM. CVSS 3.1 Base Score 8.1 (Integrity and
  Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H).'
