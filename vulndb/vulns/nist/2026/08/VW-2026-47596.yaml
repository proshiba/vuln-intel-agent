title: LiquidJS is a Shopify / GitHub Pages compatible template engine in pure 
  JavaScript. Prior to 10.27.2, the join filter in src/filters/array.ts computes
  complexity from array.length and separator length instead of the total string 
  length produced by array.join(sep). The concat filter can cheaply double 
  arrays of references, after which join materializes the referenced content 
  while charging only for element count, allowing a template to exceed a 
  configured memoryLimit by a large factor. The sibling array_to_sentence_string
  filter in src/filters/string.ts has the same accounting defect, and a crafted 
  template can allocate toward V8's string or process memory limit and crash the
  process. This issue is fixed in version 10.27.2.
