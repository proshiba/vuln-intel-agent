title: "Reverse::Proxy versions before 0.04 for Perl allow HTTP request smuggling
  via a percent-decoded PATH_INFO written unencoded to the upstream request line.\n\
  \nPSGI hands PATH_INFO to an application percent-decoded, so a %XX sequence in the
  client URL has become a raw byte by the time the proxy sees it. The proxy appends
  that byte string to the upstream base URL, and for an Upgrade tunnel writes it into
  a request line it serializes itself, re-encoding nothing in either path. The HTTP
  client that sends the resulting URL does not validate the target either. A path
  containing %0d%0a therefore arrives at the upstream as a CRLF that ends the request
  line, and a decoded space, '?' or '#' truncates it the same way.\n\nEverything the
  client writes after the CRLF is read by the upstream as a second request. On the
  buffered path it arrives on a keep-alive connection the proxy pools and reuses for
  other clients. Its method, path and headers are all chosen by the client, and the
  upstream attributes it to"
