title: OneUptime's webhook target check rejects private and loopback addresses 
  given in IPv4 form and a small set of IPv6 forms, but has no case for the 
  IPv4-mapped IPv6 range. The webhook delivery path calls 
  SSRFProtection.validateWebhookTargetIsSafe, and the host-literal screening 
  inside Common/Server/Utils/SSRFProtection.ts, performed by 
  isBlockedHostnameLiteral, rejects private and loopback IPv4 ranges and tests 
  an IPv6 value against the unspecified address, the loopback, the link-local 
  prefix and the unique-local prefixes. A value such as [::ffff:127.0.0.1] 
  matches none of them. The value is also recognised as an address literal 
  rather than a name, so the path that re-checks addresses obtained from 
  resolution is not taken. The HTTP client treats the mapped form as the 
  embedded IPv4 address and connects to it, so an authenticated project member 
  who can configure a webhook can direct the server at loopback services, 
