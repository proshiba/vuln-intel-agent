title: "In the Linux kernel, the following vulnerability has been resolved:\n\npacket:
  use consistent hard_header_len in non-ring send paths\n\npacket_snd() reads dev->hard_header_len
  multiple times while allocating\nand constructing an skb. Device reconfiguration
  can change this value\nconcurrently, for example through bonding device type changes.\n\
  \nFor SOCK_RAW, packet_snd() can save a larger value in reserve and later\nallocate
  headroom using a smaller value. Moving skb->data back by reserve\nthen places it
  before skb->head, and the following copy from userspace can\nattempt an out-of-bounds
  write.\n\npacket_sendmsg_spkt() has the same issue because it calculates its\nreservation
  and header offset from separate reads before dropping the RCU\nread lock to allocate
  the skb.\n\nAdd LL_RESERVED_SPACE_EX() for callers that already saved a header length.\n\
  Read hard_header_len once in packet_snd() and use it for allocation and\nconstruction.
