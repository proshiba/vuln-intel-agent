title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  cttimeout: detach dataplane timeout policy and repurpose refcount\n\nAdd a refcount
  for struct nf_ct_timeout which is used by ct extension to\nset the custom ct timeout
  policy, this tells us that the ct timeout is\nbeing used by a conntrack entry. When
  the last conntrack entry drops the\nrefcount on the ct timeout, the ct timeout is
  released.\n\nRemove the refcount for control plane which controls if the ruleset\n\
  refers to the timeout policy. After this update, it is possible to\nremove the ct
  timeout policy from nfnetlink_cttimeout immediately.\nThis is for simplicity not
  to handle two refcounts on a single object.\n\nRemove nf_queue_nf_hook_drop(): a
  packet sitting in nfqueue will just\nhold a reference to the nf_ct_timeout object
  until packet is reinjected,\nsince this is part of the ct extension, this will be
  released by the\ntime the conntrack is freed.\n\nnf_ct_untimeout() is still called
  to clean up in a best effort "
