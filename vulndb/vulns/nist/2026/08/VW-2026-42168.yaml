title: Improper handling of overlap between protected memory ranges for some 
  Intel(R) Xeon(R) 6 processors when using Intel(R) TDX within SMM may allow an 
  escalation of privilege. SMM adversary with a privileged user combined with a 
  high complexity attack may enable escalation of privilege. This result may 
  potentially occur via local access when attack requirements are present with 
  special internal knowledge and requires no user interaction. The potential 
  vulnerability may impact the confidentiality (high), integrity (high) and 
  availability (none) of the vulnerable system, resulting in subsequent system 
  confidentiality (none), integrity (none) and availability (none) impacts.
