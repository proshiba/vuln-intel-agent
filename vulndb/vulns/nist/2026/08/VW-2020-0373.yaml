title: "A remote code execution vulnerability exists in the way that the ChakraCore
  scripting engine handles objects in memory. The vulnerability could corrupt memory
  in such a way that an attacker could execute arbitrary code in the context of the
  current user. An attacker who successfully exploited the vulnerability could gain
  the same user rights as the current user.\nIf the current user is logged on with
  administrative user rights, an attacker who successfully exploited the vulnerability
  could take control of an affected system. An attacker could then install programs;
  view, change, or delete data; or create new accounts with full user rights.\nThe
  security update addresses the vulnerability by modifying how the ChakraCore scripting
  engine handles objects in memory."
