title: DiceBear is an avatar library for designers and developers. Prior to 
  9.4.3, @dicebear/core interpolates the rotate option into an SVG transform 
  attribute without XML escaping in addRotate in 
  packages/@dicebear/core/src/utils/svg.ts, while @dicebear/initials similarly 
  emits fontSize and fontWeight without escaping in 
  packages/@dicebear/initials/src/index.ts. Runtime callers can pass strings 
  despite the numeric TypeScript types, break out of the attributes, and inject 
  arbitrary SVG markup. Script can execute in the page origin when the generated
  avatar is inserted inline or served as image/svg+xml and opened directly, 
  although exploitation requires an application to pass untrusted values into 
  these normally developer-controlled options. This issue is fixed in 
  @dicebear/core and @dicebear/initials version 9.4.3.
