title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix double free of anonymous device after snapshot creation failure\n\nWhen creating
  a snapshot we may do a double free of an anonymous device\nin case there's an error
  committing the transaction. The second free may\nresult in freeing an anonymous
  device number that was allocated by some\nother subsystem in the kernel or another
  btrfs filesystem.\n\nThe steps that lead to this:\n\n1) At ioctl.c:create_snapshot()
  we allocate an anonymous device number\n   and assign it to pending_snapshot->anon_dev;\n\
  \n2) Then we call btrfs_commit_transaction() and end up at\n   transaction.c:create_pending_snapshot();\n\
  \n3) There we call btrfs_get_new_fs_root() and pass it the anonymous device\n  \
  \ number stored in pending_snapshot->anon_dev;\n\n4) btrfs_get_new_fs_root() frees
  that anonymous device number because\n   btrfs_lookup_fs_root() returned a root
  - someone else did a lookup\n   of the new root already, which could some task doing
  backref"
