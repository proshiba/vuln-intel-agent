title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncachefiles:
  remove requests from xarray during flushing requests\n\nEven with CACHEFILES_DEAD
  set, we can still read the requests, so in the\nfollowing concurrency the request
  may be used after it has been freed:\n\n     mount  |   daemon_thread1    |    daemon_thread2\n\
  ------------------------------------------------------------\n cachefiles_ondemand_init_object\n\
  \  cachefiles_ondemand_send_req\n   REQ_A = kzalloc(sizeof(*req) + data_len)\n \
  \  wait_for_completion(&REQ_A->done)\n            cachefiles_daemon_read\n     \
  \        cachefiles_ondemand_daemon_read\n                                  // close
  dev fd\n                                  cachefiles_flush_reqs\n              \
  \                     complete(&REQ_A->done)\n   kfree(REQ_A)\n              xa_lock(&cache->reqs);\n\
  \              cachefiles_ondemand_select_req\n                req->msg.opcode !=
  CACHEFILES_OP_READ\n                // req use-after-free !!!\n              xa_unloc"
