title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: slab-out-of-bounds read in brcmf_get_assoc_ies()\n\nFix a slab-out-of-bounds
  read that occurs in kmemdup() called from\nbrcmf_get_assoc_ies().\nThe bug could
  occur when assoc_info->req_len, data from a URB provided\nby a USB device, is bigger
  than the size of buffer which is defined as\nWL_EXTRA_BUF_MAX.\n\nAdd the size check
  for req_len/resp_len of assoc_info.\n\nFound by a modified version of syzkaller.\n\
  \n[   46.592467][    T7] ==================================================================\n\
  [   46.594687][    T7] BUG: KASAN: slab-out-of-bounds in kmemdup+0x3e/0x50\n[  \
