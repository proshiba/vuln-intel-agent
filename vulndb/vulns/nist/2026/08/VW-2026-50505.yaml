title: Adobe Commerce versions 2.4.9-alpha3, 2.4.8-p3, 2.4.7-p8, 2.4.6-p13, 
  2.4.5-p15, 2.4.4-p16 and earlier are affected by a stored Cross-Site Scripting
  (XSS) vulnerability that could be abused by a high-privileged attacker to 
  inject malicious scripts into vulnerable form fields. Malicious JavaScript may
  be executed in a victim’s browser when they browse to the page containing the 
  vulnerable field. A successful attacker can abuse this to achieve session 
  takeover, increasing the confidentiality, and integrity impact to high. 
  Exploitation of this issue requires user interaction in that a victim must 
  browse to the page containing the vulnerable field.
