title: "Velociraptor allows multi-tenant deployments named \"Orgs\".\n\nBy default
  Velociraptor, uses the ROOT org, but users can create child orgs for other tenants
  within the same deployment.\n\nUsers can have different permissions in each org.
  To manage Orgs, Velociraptor usually examines the ORG_ADMIN permission on the ROOT
  org.\n\nThis issue results from the Velociraptor server allowing for the deletion
  of Orgs by incorrectly checking the ORG_ADMIN permission of callers within the calling
  ORG instead of the ROOT org. However, Org admins of child orgs were able to add
  this permission to their ACL token within their own org. This allows an administrator
  in a child org, which is not also an administrator in the ROOT org, to delete other
  orgs."
