title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: Fix qmi_msg_handler data structure initialization\n\nqmi_msg_handler is
  required to be null terminated by QMI module.\nThere might be a case where a handler
  for a msg id is not present in the\nhandlers array which can lead to infinite loop
  while searching the handler\nand therefore out of bound access in qmi_invoke_handler().\n\
  Hence update the initialization in qmi_msg_handler data structure.\n\nTested-on:
  IPQ8074 hw2.0 AHB WLAN.HK.2.5.0.1-01100-QCAHKSWPL_SILICONZ-1"
