title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-cgroup:
  fix list corruption from reorder of WRITE ->lqueued\n\n__blkcg_rstat_flush() can
  be run anytime, especially when blk_cgroup_bio_start\nis being executed.\n\nIf WRITE
  of `->lqueued` is re-ordered with READ of 'bisc->lnode.next' in\nthe loop of __blkcg_rstat_flush(),
  `next_bisc` can be assigned with one\nstat instance being added in blk_cgroup_bio_start(),
  then the local\nlist in __blkcg_rstat_flush() could be corrupted.\n\nFix the issue
  by adding one barrier."
