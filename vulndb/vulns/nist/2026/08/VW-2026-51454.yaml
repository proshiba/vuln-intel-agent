title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  idxd: fix double free of wq, engine, and group structs\n\nThe release callbacks
  for wq, engine, and group devices\n(idxd_conf_wq_release, idxd_conf_engine_release,\n\
  idxd_conf_group_release) each call kfree() on the enclosing struct.\nThe setup error
  paths and cleanup functions also call kfree()\nexplicitly after put_device(), producing
  a double free whenever\nput_device() drops the reference count to zero and fires
  the release.\n\nIn the setup functions, device_initialize() is called before\ndevice_add(),
  so the reference count is exactly 1 at the error sites.\nput_device() unconditionally
  fires the release, which frees the struct;\nthe subsequent explicit kfree() then
  operates on freed memory.\n\nFor idxd_setup_wqs(), the wq release callback also
  owns opcap_bmap\nand wqcfg. The error unwind additionally freed those fields explicitly\n\
  before calling put_device(), causing further double frees on both.\n\nRemove the
  redundant "
