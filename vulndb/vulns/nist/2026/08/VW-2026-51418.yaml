title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl:
  Fix CXL_HEADERLOG_SIZE to match RAS Capability size\n\nThe CXL r4.0 8.2.4.17.7 RAS
  Capability Structure has total length 0x58\nbytes (CXL_RAS_CAPABILITY_LENGTH); the
  Header Log occupies the trailing\n64 bytes at offset 0x18.  CXL_HEADERLOG_SIZE was
  defined as SZ_512,\neight times the actual on-device size.\n\nheader_log_copy()
  reads CXL_HEADERLOG_SIZE_U32 (128) dwords from the\nRAS capability iomap, overrunning
  the 88-byte mapping by 448 bytes.\nThe cxl_aer_uncorrectable_error trace event memcpy()s
  CXL_HEADERLOG_SIZE\n(512) bytes from its source.  For the CPER caller the source
  is\nstruct cxl_ras_capability_regs::header_log[16] (64 bytes) embedded in a\nstack-local
  cxl_cper_prot_err_work_data, so the memcpy reads 448 bytes\nof kernel stack into
  the trace event ring buffer where userspace can\nread it via tracefs.\n\nSet CXL_HEADERLOG_SIZE
  to 64 and derive CXL_HEADERLOG_SIZE_U32 from it,\nbringing all iomap readers into
  agreement "
