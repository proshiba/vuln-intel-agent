title: A flaw was found in Emacs TRAMP. A local attacker could exploit this 
  vulnerability by processing maliciously crafted filenames. This occurs because
  TRAMP concatenates login arguments without proper sanitization, which are then
  passed to a local shell. Successful exploitation could lead to arbitrary code 
  execution.
