title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  xsk: Fix invalid buffer access for legacy rq\n\nThe below crash can be encountered
  when using xdpsock in rx mode for\nlegacy rq: the buffer gets released in the XDP_REDIRECT
  path, and then\nonce again in the driver. This fix sets the flag to avoid releasing
  on\nthe driver side.\n\nXSK handling of buffers for legacy rq was relying on the
  caller to set\nthe skip release flag. But the referenced fix started using fragment\n\
  counts for pages instead of the skip flag.\n\nCrash log:\n general protection fault,
  probably for non-canonical address 0xffff8881217e3a: 0000 [#1] SMP\n CPU: 0 PID:
  14 Comm: ksoftirqd/0 Not tainted 6.5.0-rc1+ #31\n Hardware name: QEMU Standard PC
  (Q35 + ICH9, 2009), BIOS rel-1.13.0-0-gf21b5a4aeb02-prebuilt.qemu.org 04/01/2014\n\
  \ RIP: 0010:bpf_prog_03b13f331978c78c+0xf/0x28\n Code:  ...\n RSP: 0018:ffff88810082fc98
  EFLAGS: 00010246\n RAX: 0000000000000000 RBX: ffff888138404901 RCX: c0ffffc900027cbc\n\
  \ RDX: fffff"
