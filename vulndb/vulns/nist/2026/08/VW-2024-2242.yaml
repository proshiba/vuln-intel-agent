title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  Fix bogus checksum computation in udf_rename()\n\nSyzbot reports uninitialized memory
  access in udf_rename() when updating\nchecksum of '..' directory entry of a moved
  directory. This is indeed\ntrue as we pass on-stack diriter.fi to the udf_update_tag()
  and because\nthat has only struct fileIdentDesc included in it and not the impUse
  or\nname fields, the checksumming function is going to checksum random stack\ncontents
  beyond the end of the structure. This is actually harmless\nbecause the following
  udf_fiiter_write_fi() will recompute the checksum\nfrom on-disk buffers where everything
  is properly included. So all that\nis needed is just removing the bogus calculation."
