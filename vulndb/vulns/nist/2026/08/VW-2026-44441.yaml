title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  radeon: fix potential memory leak in radeonfb_pci_register()\n\nThe function radeonfb_pci_register()
  allocates memory for modelist\n(by calling radeon_check_modes() which calls fb_add_videomode()).\n\
  The memory is appended to info->modelist, but is not freed in subsequent\nerror
  paths. Fix this by calling fb_destroy_modelist()."
