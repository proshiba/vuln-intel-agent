title: Traefik versions >= v3.7.0 and <= v3.7.7 contain a path traversal 
  vulnerability in the Kubernetes Ingress NGINX provider's RewriteTarget 
  middleware (generated from the nginx.ingress.kubernetes.io/rewrite-target 
  annotation). When an Ingress path uses a regex that captures 
  attacker-controlled text without requiring a path separator (e.g., path 
  /api(.*) with rewrite target /$1), a crafted request such as /api../admin 
  matches the public router, is rewritten to a dot-segment traversal path 
  (/../admin), and is forwarded without post-replacement normalization 
  validation. A backend that normalizes dot segments resolves the path to a 
  protected endpoint (e.g., /admin) reachable only through a separate router 
  secured with BasicAuth, DigestAuth, or ForwardAuth, resulting in route-level 
  authentication bypass. The issue is fixed in v3.7.8.
