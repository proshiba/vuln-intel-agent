title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reset register bounds before narrowing retval range in check_mem_access()\n\nWhen
  the BPF verifier processes a context load of an LSM hook return\nvalue, it calls
  __mark_reg_s32_range() to narrow the register to the\nhook's valid range. However,
  __mark_reg_s32_range() intersects the new\nrange with the register's existing bounds
  using max_t()/min_t() rather\nthan replacing them.\n\nIf the destination register
  carries stale bounds from a prior instruction\n(e.g. BPF_MOV64_IMM), the intersection
  can produce a range narrower than\nreality. The verifier then believes it knows
  the register's exact value,\nwhile at runtime the actual hook return value is loaded,
  creating a\nverifier/runtime mismatch that can be used to bypass BPF memory safety\n\
  checks.\n\nThe else branch already calls mark_reg_unknown() to reset register state\n\
  before any narrowing. Apply the same reset in the is_retval path so\nstale bounds
  are cleared before __mark_r"
