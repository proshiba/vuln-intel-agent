title: Synk Sweater Comb before 3.8.8 contains a command injection vulnerability
  that allows an attacker who controls the .vervet.yaml configuration file to 
  execute arbitrary OS commands by injecting malicious input into the 
  linters.<key>.optic-ci.original branch name field. The expectGitBranch() 
  function in src/lint.ts passes the unsanitized branch name directly into 
  child_process.exec() via an unescaped template literal, enabling arbitrary 
  command execution when the lint command is run against the repository.
