title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFS:
  Charge unstable writes by request size, not folio size\n\nnfs_folio_mark_unstable()
  and nfs_folio_clear_commit() charge and\nuncharge NR_WRITEBACK/WB_WRITEBACK by folio_nr_pages(folio)
  once per\n*request* added to or removed from a commit list. This is correct only\n\
  when a folio has a single associated request. When pg_test splits a\nfolio into
  N sub-folio requests (e.g. pNFS flexfiles striping with a\nstripe unit smaller than
  the folio size, or plain wsize-limited\nsplitting), each of the N requests independently
  charges the whole\nfolio's page count, inflating the accounting by a factor of N
  per\nfolio. With large folios and small stripe units this reaches multiple\norders
  of magnitude: a 2 MiB folio split into 512 4 KiB requests can\ncharge up to 512x
