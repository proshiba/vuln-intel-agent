title: "In the Linux kernel, the following vulnerability has been resolved:\n\nOPP:
  add index check to assert to avoid buffer overflow in _read_freq()\n\nPass the freq
  index to the assert function to make sure\nwe do not read a freq out of the opp->rates[]
  table when called\nfrom the indexed variants:\ndev_pm_opp_find_freq_exact_indexed()
  or\ndev_pm_opp_find_freq_ceil/floor_indexed().\n\nAdd a secondary parameter to the
  assert function, unused\nfor assert_single_clk() then add assert_clk_index() which\n\
  will check for the clock index when called from the _indexed()\nfind functions."
