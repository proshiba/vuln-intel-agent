title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  Fix use after free in XDP_REDIRECT\n\nCommit 718a18a0c8a6 (\"veth: Rework veth_xdp_rcv_skb
  in order\nto accept non-linear skb\") introduced a bug where it tried to\nuse pskb_expand_head()
  if the headroom was less than\nXDP_PACKET_HEADROOM.  This however uses kmalloc to
  expand the head,\nwhich will later allow consume_skb() to free the skb while is
  it still\nin use by AF_XDP.\n\nPreviously if the headroom was less than XDP_PACKET_HEADROOM
  we\ncontinued on to allocate a new skb from pages so this restores that\nbehavior.\n\
  \nBUG: KASAN: use-after-free in __xsk_rcv+0x18d/0x2c0\nRead of size 78 at addr ffff888976250154
