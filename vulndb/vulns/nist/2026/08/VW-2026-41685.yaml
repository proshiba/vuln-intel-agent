title: "The UpdateHub OTA client in subsys/mgmt/updatehub/updatehub.c contains an
  out-of-bounds / uninitialized-memory read in z_impl_updatehub_probe(). The probe
  response from the UpdateHub server is copied into a heap buffer (metadata) that
  is correctly NUL-terminated, but a second buffer (metadata_copy) is allocated with
  k_malloc (unzeroed) and filled with memcpy(metadata_copy, metadata, strlen(metadata)),
  which omits the terminating NUL. Everything after the copied content remains uninitialized
  heap.\n\nWhen the first json_obj_parse() over the array descriptor fails, the code
  falls back to json_obj_parse(metadata_copy, strlen(metadata_copy), ...). The strlen()
  call scans past the copied bytes through uninitialized heap and, if no zero byte
  is found before the end of the allocation, reads beyond the buffer; the resulting
  over-long length is then parsed as JSON. The probe payload is fully controlled by
  the (malicious, compromised, or — without the optional CONFIG_UPDATEHUB_DTLS — on-path)
  Upda"
