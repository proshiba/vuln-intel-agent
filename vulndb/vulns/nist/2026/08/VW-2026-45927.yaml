title: 'authentik is an open-source identity provider. Prior to 2026.2.6 and 2026.5.5,
  the enterprise Google Chrome device-trust stages advance the flow without confirming
  that the out-of-band device attestation actually ran. Affected enterprise deployments
  place either a Google Chrome Endpoint stage with mode set to REQUIRED or the deprecated
  Google Chrome Device Trust Connector stage in an authentication flow. The device
  attestation occurs in a verification iframe that calls the Google Verified Access
  API and records the verified device on success, but the vulnerable stages treat
  the flow as passed as soon as the stage is submitted. An attacker who can reach
  such a stage, including after primary username and password authentication, can
  skip the verification iframe and authenticate from a device that was never verified.
  Where device trust is the only additional factor, that protection is fully bypassed,
  while other configured factors remain in force. This issue is fixed in versions
  2026.2.6 '
