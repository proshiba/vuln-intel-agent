title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  Gadget: core: Help prevent panic during UVC unconfigure\n\nAvichal Rakesh reported
  a kernel panic that occurred when the UVC\ngadget driver was removed from a gadget's
  configuration.  The panic\ninvolves a somewhat complicated interaction between the
  kernel driver\nand a userspace component (as described in the Link tag below), but\n\
  the analysis did make one thing clear: The Gadget core should\naccomodate gadget
  drivers calling usb_gadget_deactivate() as part of\ntheir unbind procedure.\n\n\
  Currently this doesn't work.  gadget_unbind_driver() calls\ndriver->unbind() while
  holding the udc->connect_lock mutex, and\nusb_gadget_deactivate() attempts to acquire
  that mutex, which will\nresult in a deadlock.\n\nThe simple fix is for gadget_unbind_driver()
  to release the mutex when\ninvoking the ->unbind() callback.  There is no particular
  reason for\nit to be holding the mutex at that time, and the mutex isn't held\n\
