title: Untrusted search path in PostgreSQL amcheck allows a grantee of amcheck 
  function EXECUTE privilege to execute arbitrary functions as the owners of 
  expression indexes that depend on the search path, via setting a hostile 
  search path before calling the amcheck function.  Within major versions 18, 
  16, 15, and 14, minor versions before PostgreSQL 18.5, 16.15, 15.19, and 14.24
  are affected.  PostgreSQL 17 is unaffected.
