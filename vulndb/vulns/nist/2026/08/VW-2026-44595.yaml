title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Preserve pointer spill metadata during half-slot cleanup\n\n__clean_func_state()
  cleans dead stack slots in 4-byte halves. When the\nhigh half of a STACK_SPILL slot
  is dead and the low half remains live,\ncleanup converts the live low half to STACK_MISC
  or STACK_ZERO and clears\nthe saved spilled_ptr metadata.\n\nThat conversion is
  safe only for scalar spills. For a pointer spill, this\nmetadata clear lets a later
  32-bit fill from the still-live half avoid the\nnormal non-scalar register-fill
  check and be treated as an ordinary scalar\nstack read.\n\nLeave non-scalar spill
  slots intact in this half-live shape. This is\nconservative for pruning and preserves
  the existing\ncheck_stack_read_fixed_off() rejection path for partial fills from
  pointer\nspills."
