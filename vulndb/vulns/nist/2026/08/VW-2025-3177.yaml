title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  media: tegra-video: fix device_node use after free\n\nAt probe time this code path
  is followed:\n\n * tegra_csi_init\n   * tegra_csi_channels_alloc\n     * for_each_child_of_node(node,
  channel) -- iterates over channels\n       * automatically gets 'channel'\n    \
  \     * tegra_csi_channel_alloc()\n           * saves into chan->of_node a pointer
  to the channel OF node\n       * automatically gets and puts 'channel'\n       *
  now the node saved in chan->of_node has refcount 0, can disappear\n   * tegra_csi_channels_init\n\
  \     * iterates over channels\n       * tegra_csi_channel_init -- uses chan->of_node\n\
  \nAfter that, chan->of_node keeps storing the node until the device is\nremoved.\n\
  \nof_node_get() the node and of_node_put() it during teardown to avoid any\nrisk."
