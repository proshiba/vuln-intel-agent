title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  fix incorrect flush address in direct page table reclaim\n\nWhen zap_pte_range reclaims
  a page table, it does:\n\n    pte_free_tlb(tlb, pmd_pgtable(pmdval), addr);\n\n\
  and this is unconditionally wrong: if this code executes, addr *always*\npoints
  one past the end of the range covered by the table.  The addr\nparameter is used
  to flush the TLB (really the paging-structure-cache)\nto drop references to the
  to-be-freed table, and any architecture that\ncares about the parameter will flush
  the wrong address.  (But they'll\nstill free the correct page).\n\nI think it's
  worth contemplating why the kernel works at all.\n\nIf we hit the offending line
  of code, we will first clear the PMD entry\n(line 1954, zap_empty_pte_table), then
  we will issue pending flushes if\nforce_flush is set (tlb_flush_mmu_tlbonly(tlb)),
  then we will skip the\nretry on line 1979 (phew!), and then we will do the offending\n\
