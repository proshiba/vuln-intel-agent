title: Rocket.Chat in versions before 8.8.0, 8.7.1, 8.6.2, 8.5.3, 8.4.6, 8.3.8, 
  8.2.8, 8.1.8, and 7.10.15 has a REST API endpoint POST 
  /api/v1/livechat/visitor that accepts an unauthenticated, unsanitized name 
  field for Livechat visitors. This name is stored raw and later rendered via 
  dangerouslySetInnerHTML in the Omnichannel Queue side panel 
  (InquireSidePanelItem.tsx), injecting a real, clickable HTML link - pointing 
  to any attacker-controlled domain, with arbitrary social-engineering text - 
  into the DOM of any agent viewing the queue.
