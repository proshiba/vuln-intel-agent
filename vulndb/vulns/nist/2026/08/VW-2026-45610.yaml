title: 'A flaw has been found in Webkul Bagisto up to 2.4.4. The affected element
  is an unknown function of the file /customer/register of the component Customer-Registration
  Notification Email. This manipulation of the argument first_name/last_name causes
  basic cross site scripting. It is possible to initiate the attack remotely. The
  exploit has been published and may be used. The vendor confirms: "The reported issues
  were already identified through our internal security assessment process prior to
  this notification and are being handled through our established internal security
  and development lifecycle. Some of these items have already been addressed, while
  the remaining items are planned for resolution in upcoming product releases."'
