title: Vitess is a database clustering system for horizontal scaling of MySQL. 
  In 24.0.2 and earlier, the /debug/vrlog endpoint registered by 
  addHttpEndpoint() in go/vt/vttablet/tabletmanager/vreplication/vrlog.go 
  invokes vrlogStatsHandler() without acl.CheckAccessHTTP(r, acl.DEBUGGING), 
  unlike comparable debug endpoints. A remote caller who can reach the vttablet 
  debug HTTP port can bypass the configured security policy and stream 
  VrLogStats data produced from NewVrLogStats().Send(), including literal SQL 
  statements and bound application values from MoveTables, Reshard, Materialize,
  and vitess-strategy Online DDL workflows
