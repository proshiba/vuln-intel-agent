title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  revalidate ihl to prevent out-of-bounds access\n\nWhile the outer IP header is already
  pulled into the skb head,\nwe must be careful and revalidate the embedded headers
  after\nreading them from the skb frags to prevent out-of-bounds\naccess.\n\nOne
  such place reported by Sashiko is ip_vs_nat_icmp() where\nlocal process can change
  the ihl field and after\nskb_ensure_writable() we can see larger value which is
  a\nproblem for the ip_send_check(cih) calls.\n\nAdd check to drop the packet if
  the ihl field is changed."
