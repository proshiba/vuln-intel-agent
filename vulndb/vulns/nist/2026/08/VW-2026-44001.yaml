title: Emlog is an open source website building system. In 2.6.26 and earlier, 
  install.php accepts action=reinstall without authentication and deliberately 
  skips the already-installed check because the guard runs only when $act != 
  'reinstall'. A remote attacker can submit hostname, dbuser, dbpasswd, dbname, 
  dbprefix, username, password, and email values to cause 
  file_put_contents('config.php', $config) to overwrite the configuration with 
  attacker-controlled database settings and create a new administrator account. 
  No fixed version is available as of this review.
