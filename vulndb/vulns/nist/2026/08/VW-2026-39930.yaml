title: "Cross-Site Request Forgery (CSRF) vulnerability in livebook-dev livebook allows
  an attacker to authenticate a victim's browser session under the attacker's own
  Livebook Teams identity.\n\nWhen Livebook is configured to use Livebook Teams for
  identity, Livebook.ZTA.LivebookTeams.handle_request/4 in lib/livebook/zta/livebook_teams.ex
  handles the OAuth-style callback carrying a teams_identity marker and a code parameter.
  The clause exchanges that code for an access token and writes the token into the
  browser session without verifying any value that ties the callback to the browser
  session that started the login. No state or nonce is generated when the flow is
  initiated: Livebook.Teams.Requests.create_auth_request/1 in lib/livebook/teams/requests.ex
  sends an empty request body, so no per-attempt value is ever registered, and the
  callback clause has nothing to compare against.\n\nAn attacker who holds membership
  in the same Livebook Teams organisation as the target instance can therefore begin "
