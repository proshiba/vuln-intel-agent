title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxdp:
  reject clones that overrun skb_shared_info tailroom\n\nxdpf_clone() clones broadcast
  copies into a single page and sets\nframe_sz to PAGE_SIZE. __xdp_build_skb_from_frame()
  later treats that\npage like a normal XDP frame and expects the usual skb_shared_info\n\
  tailroom at the end of the buffer.\n\nThe current check only rejects frames whose
  linear xdp_frame header,\nheadroom, and packet data exceed PAGE_SIZE. A source frame
  backed by a\nlarger allocation can still satisfy that check while extending into
  the\nclone's required shared-info area. When such a clone is converted back\ninto
  an skb, build_skb_around() places skb_shared_info over live packet\nbytes and later
  writes can corrupt XDP return metadata.\n\nReject clones unless their linear area
  fits inside\nSKB_WITH_OVERHEAD(PAGE_SIZE), matching the tailroom requirement already\n\
  enforced by the XDP-to-skb conversion path."
