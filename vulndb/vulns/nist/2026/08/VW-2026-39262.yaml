title: A DLL hijacking vulnerability in GeoVision GV-ASManager allows a local 
  attacker with write access to an unsafe search directory to execute arbitrary 
  code. By placing a crafted dynamic-link library (DLL) file into the 
  application search path prior to the legitimate library, the malicious code is
  loaded and executed under the security privileges of the GV-ASManager process.
