title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix potential buffer underflow in ath11k_hal_rx_msdu_list_get()\n\nWhen
  the first entry in msdu_details has a zero buffer address,\nthe code accesses msdu_details[i
  - 1] with i == 0, causing a\nbuffer underflow.\n\nFix similarly to ath12k_wifi7_hal_rx_msdu_list_get()
  by adding\na separate check for i == 0 before the main condition to prevent\nthe
  out-of-bounds access.\n\nFound by Linux Verification Center (linuxtesting.org) with
  SVACE."
