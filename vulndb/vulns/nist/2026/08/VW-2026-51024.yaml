title: The updateWorkspace handler in 
  mods/identity/src/workspaces/createUpdateWorkspace.ts in Fonoster through 
  0.22.7 invokes the gRPC callback with PERMISSION_DENIED when 
  createIsWorkspaceMember reports that the caller is not a member of the target 
  workspace, but it does not return. Execution continues into 
  prisma.workspace.update, which is scoped by the workspace reference alone, so 
  the rename commits before the second callback is issued and the caller 
  receives a permission error for a write that already succeeded. The gRPC 
  interceptor in mods/common/src/identity/createAuthInterceptor.ts binds the 
  workspace accessKeyId to the caller's token only for paths in 
  workspaceResourceAccess or workspaceResourceOwnerOrAdminAccess, and 
  Identity/UpdateWorkspace is listed in fullIdentityAccess, which the base USER 
  role holds. Any authenticated user can therefore rename an arbitrary workspace
  in the deployment.
