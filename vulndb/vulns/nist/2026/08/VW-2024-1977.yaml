title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnsh:
  Restore skb->{protocol,data,mac_header} for outer header in nsh_gso_segment().\n\
  \nsyzbot triggered various splats (see [0] and links) by a crafted GSO\npacket of
  VIRTIO_NET_HDR_GSO_UDP layering the following protocols:\n\n  ETH_P_8021AD + ETH_P_NSH
  + ETH_P_IPV6 + IPPROTO_UDP\n\nNSH can encapsulate IPv4, IPv6, Ethernet, NSH, and
  MPLS.  As the inner\nprotocol can be Ethernet, NSH GSO handler, nsh_gso_segment(),
  calls\nskb_mac_gso_segment() to invoke inner protocol GSO handlers.\n\nnsh_gso_segment()
  does the following for the original skb before\ncalling skb_mac_gso_segment()\n\n\
  \  1. reset skb->network_header\n  2. save the original skb->{mac_heaeder,mac_len}
  in a local variable\n  3. pull the NSH header\n  4. resets skb->mac_header\n  5.
  set up skb->mac_len and skb->protocol for the inner protocol.\n\nand does the following
  for the segmented skb\n\n  6. set ntohs(ETH_P_NSH) to skb->protocol\n  7. push the
  NSH header\n  8. restore skb->mac"
