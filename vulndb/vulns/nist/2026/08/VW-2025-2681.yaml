title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  avoid cycles in directory h-tree\n\nA maliciously corrupted filesystem can contain
  cycles in the h-tree\nstored inside a directory. That can easily lead to the kernel
  corrupting\ntree nodes that were already verified under its hands while doing a
  node\nsplit and consequently accessing unallocated memory. Fix the problem by\n\
  verifying traversed block numbers are unique."
