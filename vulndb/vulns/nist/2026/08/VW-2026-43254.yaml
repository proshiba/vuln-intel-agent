title: SiYuan versions before v3.7.4 contain an authentication bypass 
  vulnerability in the FilterViewByPublishAccess filter that fails to check 
  publish password protection when rendering attribute views and database rows. 
  Unauthenticated readers can access password-protected document rows including 
  titles, block IDs, and column values by calling renderAttributeView without 
  supplying the required password.
