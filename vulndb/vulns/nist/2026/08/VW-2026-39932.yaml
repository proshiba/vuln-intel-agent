title: Milvus through 2.6.22 and 3.0.0 contains an unauthenticated denial of 
  service vulnerability that allows remote attackers to terminate service 
  components by sending a crafted HTTP GET request to the management server on 
  port 9091. Attackers can exploit the unprotected /management/stop endpoint, 
  which bypasses REST API authentication middleware, by supplying a 'role' 
  parameter to shut down the proxy, datanode, or querynode components, resulting
  in denial of service.
