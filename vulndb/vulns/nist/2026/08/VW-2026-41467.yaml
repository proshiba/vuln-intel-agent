title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  core: wake eh reliably when using scsi_schedule_eh\n\nDrivers which use the scsi_schedule_eh
  function to run the error handler\ncurrently risk the error handler thread never
  waking once all commands are\ntimed out or inactive. There is no enforced memory
  order between setting\nthe host into error recovery state and counting busy commands.
  This can\nresult in a race with scsi_dec_host_busy where neither CPU sees both\n\
  conditions of all commands inactive and the host error state to request\nwaking
  the error handler.\n\nTo fix this, run the scsi_schedule_eh's scsi_eh_wakeup from
  a new work item\nwhich will use rcu to ensure scsi_schedule_eh's call to scsi_host_busy
  will\noccur after the error state is globally visible and will be seen by any\n\
  current scsi_dec_host_busy callers."
