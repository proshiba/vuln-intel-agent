title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfou:
  Fix use-after-free in fou_create()\n\nfou_create() publishes struct fou through
  sk_user_data before adding the\nnew FOU port to the per-netns list.  If fou_add_to_port_list()
  fails,\nthe error path frees fou while it is still reachable through\nsk_user_data.\
  \  A concurrent receive can then dereference the freed\nobject in fou_from_sock().\n\
  \nThis ordering issue was previously noted in the linked discussion.\n\nThe failure
  is reachable when local port 0 is requested.  Each socket\nbinds to a different
  ephemeral port, but fou_cfg_cmp() compares the\nrequested port 0 and reports -EALREADY
  once an entry already exists.\n\nRelease the tunnel socket before freeing fou so
  sk_user_data is cleared\nfirst, and defer reclamation with kfree_rcu() to protect
  concurrent RCU\nreaders.  This matches the lifetime handling in fou_release()."
