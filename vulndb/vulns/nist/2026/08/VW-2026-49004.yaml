title: TIM Flow before 26.0.6 contains a CRLF injection vulnerability that 
  allows remote attackers to inject arbitrary HTTP headers and response body 
  content by embedding unsanitized carriage return and line feed sequences in 
  the rt URL parameter, which is reflected into Set-Cookie response headers. 
  Attackers can craft malicious requests to induce authenticated users to 
  execute arbitrary JavaScript in their browser context, enabling session token 
  theft and account credential modification.
