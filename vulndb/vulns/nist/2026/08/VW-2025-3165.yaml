title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fix stack overflow when LRO is disabled for virtual interfaces\n\nWhen the virtual
  interface's feature is updated, it synchronizes the\nupdated feature for its own
  lower interface.\nThis propagation logic should be worked as the iteration, not
  recursively.\nBut it works recursively due to the netdev notification unexpectedly.\n\
  This problem occurs when it disables LRO only for the team and bonding\ninterface
  type.\n\n       team0\n         |\n  +------+------+-----+-----+\n  |      |   \
  \   |     |     |\nteam1  team2  team3  ...  team200\n\nIf team0's LRO feature is
  updated, it generates the NETDEV_FEAT_CHANGE\nevent to its own lower interfaces(team1
  ~ team200).\nIt is worked by netdev_sync_lower_features().\nSo, the NETDEV_FEAT_CHANGE
  notification logic of each lower interface\nwork iteratively.\nBut generated NETDEV_FEAT_CHANGE
  event is also sent to the upper\ninterface too.\nupper interface(team0) generates
  the NETDEV_FEAT_CHANGE eve"
