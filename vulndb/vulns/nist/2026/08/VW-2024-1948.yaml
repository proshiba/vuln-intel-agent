title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm/a6xx:
  Allocate enough space for GMU registers\n\nIn commit 142639a52a01 (\"drm/msm/a6xx:
  fix crashstate capture for\nA650\") we changed a6xx_get_gmu_registers() to read
  3 sets of\nregisters. Unfortunately, we didn't change the memory allocation for\n\
  the array. That leads to a KASAN warning (this was on the chromeos-5.4\nkernel,
  which has the problematic commit backported to it):\n\n  BUG: KASAN: slab-out-of-bounds
  in _a6xx_get_gmu_registers+0x144/0x430\n  Write of size 8 at addr ffffff80c89432b0
  by task A618-worker/209\n  CPU: 5 PID: 209 Comm: A618-worker Tainted: G        W\
  \         5.4.156-lockdep #22\n  Hardware name: Google Lazor Limozeen without Touchscreen
  (rev5 - rev8) (DT)\n  Call trace:\n   dump_backtrace+0x0/0x248\n   show_stack+0x20/0x2c\n\
  \   dump_stack+0x128/0x1ec\n   print_address_description+0x88/0x4a0\n   __kasan_report+0xfc/0x120\n\
