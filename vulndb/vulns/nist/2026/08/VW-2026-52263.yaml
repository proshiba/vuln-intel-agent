title: MCPHub is a unified hub for centrally managing and dynamically 
  orchestrating multiple MCP servers/APIs into separate endpoints with flexible 
  routing strategies. Prior to version 0.12.13, MCPB File Upload Handler 
  extracts a ZIP file and reads manifest.json from it. The name field in the 
  manifest is directly concatenated into a file path (line 107) without any 
  sanitization or path traversal character validation. An attacker can craft a 
  malicious MCPB file where manifest.name is set to something like 
  ../../../etc/malicious, causing the file to be extracted to an arbitrary 
  location on the file system. The cleanupOldMcpbServer function (line 110) also
  uses the unsanitized name, potentially allowing deletion of arbitrary 
  directories. This issue has been patched in version 0.12.13.
