title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix possible out-of-bound write in ath12k_wmi_ext_hal_reg_caps()\n\nreg_cap.phy_id
  is extracted from WMI event and could be an unexpected value\nin case some errors
  happen. As a result out-of-bound write may occur to\nsoc->hal_reg_cap. Fix it by
  validating reg_cap.phy_id before using it.\n\nThis is found during code review.\n\
  \nCompile tested only."
