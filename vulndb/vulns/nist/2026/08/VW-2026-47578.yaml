title: "The NVS backend of the Zephyr settings subsystem (subsys/settings/src/settings_nvs.c)
  reads stored setting-name entries into fixed 74-byte stack buffers and NUL-terminates
  them with buf[rc] = '\\0', where rc is the return value of nvs_read(). Per its contract,
  nvs_read() returns the full stored entry length (wlk_ate.len), which can exceed
  the supplied buffer length — only MIN(len, stored_len) bytes are actually copied,
  but the return value may be much larger, bounded only by the NVS sector size. Three
  sites (settings_nvs_cache_match(), settings_nvs_load(), and settings_nvs_save())
  used this value directly as the NUL index without clamping, so an oversized stored
  name entry causes a single \\0 byte to be written past the end of the stack buffer
  at an attacker-influenced offset (CWE-787).\n\nThe oversized entry cannot arise
  through the normal settings API, where names are bounded by SETTINGS_MAX_NAME_LEN.
  It requires an actor able to write the flash that backs the settings partition —
