title: "The virtio PCI driver (drivers/virtio/virtio_pci.c) parses a device's PCI
  capability list during driver initialization. In virtio_pci_read_cap() the device-supplied
  capability length byte cap_len (read from PCI config space via pcie_conf_read())
  was only checked with assert(tmp.cap_len == cap_struct_size). That assert resolves
  to __ASSERT_NO_MSG(), gated by CONFIG_ASSERT, which defaults off in production builds,
  so the value reached the copy logic completely unvalidated.\n\nThe length then drives
  a loop that copies extra capability dwords into a fixed-size stack buffer supplied
  by the caller. A cap_len below the 24-byte base struct virtio_pci_cap underflows
  the unsigned extra_data_words count to a near-SIZE_MAX value, producing an effectively
  unbounded stack write; a cap_len above the caller's buffer (up to 255) writes up
  to roughly 228 bytes of device-controlled data past the buffer. Both are out-of-bounds
  writes of attacker-controlled content executed in kernel mode during boot-time de"
