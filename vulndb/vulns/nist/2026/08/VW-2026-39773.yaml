title: Bolt CMS renders content field values through Twig's full 
  application-level Environment with no SandboxExtension registered anywhere in 
  the codebase. In src/Entity/Field.php, getTwigValue calls 
  shouldBeRenderedAsTwig, which gates rendering only on the field definition's 
  allow_twig flag and a regex checking for , , or ; when true, the raw field 
  value is compiled and rendered via with no sandboxing.
