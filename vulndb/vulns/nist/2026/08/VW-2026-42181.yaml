title: Always-incorrect control flow implementation in some firmware for some 
  Intel(R) Xeon(R) processors may allow an escalation of privilege. System 
  software adversary with a privileged user combined with a high complexity 
  attack may enable escalation of privilege. This result may potentially occur 
  via local access when attack requirements are not present without special 
  internal knowledge and requires no user interaction. The potential 
  vulnerability may impact the confidentiality (none), integrity (none) and 
  availability (none) of the vulnerable system, resulting in subsequent system 
  confidentiality (high), integrity (high) and availability (none) impacts.
