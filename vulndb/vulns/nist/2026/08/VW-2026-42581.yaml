title: Weaver (Fanwei) E-cology 8.0 and 9.0 contains a SQL injection 
  vulnerability in the HrmCareerApplyPerView.jsp endpoint that allows 
  unauthenticated remote attackers to extract arbitrary data from the backend 
  database by manipulating the id GET parameter. Attackers can send a single 
  crafted GET request with UNION-based injection payloads through the 
  unsanitized id parameter to retrieve arbitrary data from the Microsoft SQL 
  Server backend. This vulnerability is potentially remediated in software 
  version 10.53 or 10.54. Exploitation evidence was first observed by the 
  Shadowserver Foundation on 2023-10-18 (UTC).
