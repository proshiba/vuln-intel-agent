title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (nzxt-smart2) DMA-align output buffer\n\nSashiko reports:\n\nWhen send_output_report()
  calls hid_hw_output_report(), the underlying USB\nHID core calls usb_interrupt_msg()
  which maps this buffer directly for DMA.\n\nWhen the DMA mapping flushes or invalidates
  the cacheline, it will corrupt\nthe adjacent variables (mutex, update_interval)
  that were modified\nconcurrently by the CPU. This causes memory corruption due to
  cacheline\nsharing on non-coherent CPU architectures (such as ARM or MIPS). The
  DMA\nAPI debugging tool (CONFIG_DMA_API_DEBUG) will trigger runtime warnings\nfor
  this violation.\n\nAny operation that triggers send_output_report() (like setting
  a fan speed\nor updating the interval) causes the USB DMA mapping. On systems with\n\
  non-coherent caches, this structural bug causes immediate and deterministic\nmemory
  corruption.\n\nAlign the output buffer to ARCH_DMA_MINALIGN to fix the problem."
