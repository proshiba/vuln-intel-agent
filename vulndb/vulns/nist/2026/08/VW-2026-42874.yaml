title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  8250_mid: Fix NULL function pointer dereference on DNV/ICX-D/SNR platforms\n\nCommit
  b1b4efea05a5 (\"serial: 8250_mid: Disable DMA for selected\nplatforms\") replaced
  the dnv_board setup and exit callbacks with\nPTR_IF(false, ...), which evaluates
  to NULL. However, the three call\nsites in mid8250_probe() and mid8250_remove()
  unconditionally\ndereference these function pointers without NULL checks, causing
  a NULL\npointer dereference (kernel oops) on any Denverton (DNV), Ice Lake Xeon\n\
  D (ICX-D/CDF), or Snowridge (SNR) platform.\n\nFix this by adding the missing NULL
  checks before calling the setup and\nexit callbacks."
