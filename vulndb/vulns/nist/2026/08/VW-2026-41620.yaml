title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the compose.update operation stores an unvalidated composePath that 
  packages/server/src/utils/builders/compose.ts and 
  packages/server/src/services/compose.ts interpolate into docker compose -f, 
  docker stack deploy -c, and touch shell commands executed through /bin/sh -c. 
  An authenticated member with compose write and deploy permission can supply a 
  crafted composePath, trigger compose.deploy or startCompose, and execute 
  arbitrary operating-system commands in the Docker-privileged Dokploy host 
  context. This issue is fixed in version 0.29.13.
