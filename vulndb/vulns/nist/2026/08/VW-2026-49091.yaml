title: The Continue CLI applies an incomplete denylist as its only barrier to 
  destructive shell commands when running unattended. In headless mode and auto 
  mode the default policy in extensions/cli/src/permissions/defaultPolicies.ts 
  grants the Bash tool the allow permission, and permissionChecker.ts 
  hard-blocks a command only when the terminal-security evaluator returns a 
  disabled verdict, so isCriticalCommand in 
  packages/terminal-security/src/evaluateTerminalCommandSecurity.ts is the sole 
  control. Its dangerous-path test matches only /, /*, ~, ~/*, /usr, /etc, /bin 
  and /sbin and their prefixes, so a recursive forced removal of /home, /root, 
  /var, /opt or /srv is not disabled. The command line is parsed with 
  shell-quote, which reduces $HOME to an empty token, so rm -rf $HOME also fails
  the dangerous-path test while the shell re-expands the variable when the 
  command is spawned. find with -delete is rated high risk rather than disabled,
  and shred, wipefs, truncate and pkexec are not handled. Be
