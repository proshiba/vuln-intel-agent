title: ApostropheCMS is an open-source Node.js content management system. Prior 
  to 4.32.0, the page module's move() operation fails to enforce the destination
  parent's _create permission because its oldParent archive condition disables 
  the check for ordinary moves, allowing an authenticated editor or contributor 
  to use _targetId and _position through the page REST update endpoint to move a
  controlled page into a restricted subtree and make nudgeNewPeers() updateMany 
  re-rank protected sibling pages. This issue is fixed in version 4.32.0.
