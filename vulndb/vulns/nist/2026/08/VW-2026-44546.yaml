title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Remove setting of AS_RELEASE_ALWAYS for symlinks and mountpoints\n\nRegular AFS
  files correctly use afs_file_aops which have release_folio\nset as netfs_release_folio,
  so AS_RELEASE_ALWAYS is valid for them\nwhen fscache is enabled (set via afs_vnode_set_cache()).\n\
  Symlinks and mountpoints in AFS use afs_dir_aops, which does not provide\na release_folio
  callback. However, afs_apply_status() unconditionally\ncalls mapping_set_release_always()
  for these.\n\nIn such case when memory management code attempts to release folios,\n\
  filemap_release_folio() checks folio_needs_release() which\nreturns true due to
  AS_RELEASE_ALWAYS being set. Since there is no\nrelease_folio callback, it falls
  through to try_to_free_buffers(),\nwhich at present expects buffer_heads to be not
  null. For symlinks\nand mountpoints without buffer_heads, this causes pointer dereference.\n\
  \n[dh: Added more bits that were missed]"
