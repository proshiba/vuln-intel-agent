title: FUXA is a web-based Process Visualization (SCADA/HMI/Dashboard) software.
  In 1.3.2 and earlier, POST /api/refresh in server/api/auth/index.js falls back
  from current user data to decoded.groups, including when the user is deleted 
  or groups is zero, and POST /api/heartbeat in server/api/index.js re-signs 
  inbound JWT claims without validating the current database record. An attacker
  who possesses a previously issued privileged refresh cookie or access token 
  can continue minting privileged JWTs after account deletion, disablement, role
  removal, or demotion. Continued refresh-cookie rotation can extend the stale 
  session and preserve unauthorized access to user management, project 
  manipulation, runtime configuration, scripts, and backdoor-account creation. 
  This issue is fixed in version 1.3.3.
