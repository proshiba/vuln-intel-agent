title: SitemapLoader.parse_sitemap in 
  langchain_community/document_loaders/sitemap.py applies the documented 
  restrict_to_same_domain control only to leaf url entries. The loop over url 
  elements filters cross-domain locations, but the loop over nested sitemap 
  elements passes the child loc straight to self.scrape_all([loc.text], "xml"), 
  which reaches WebBaseLoader.scrape_all and an aiohttp GET, with no domain 
  comparison and no check for private, loopback or link-local destinations. An 
  attacker who controls or influences an ingested sitemap can therefore point a 
  nested sitemap entry at an internal address and make the server fetch it even 
  when the deploying application set restrict_to_same_domain to True 
  specifically to confine outbound requests. The fetched content is parsed and 
  surfaces in the returned Documents, so internal responses are disclosed to the
  caller rather than merely requested.
