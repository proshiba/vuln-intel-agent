title: A vulnerability was identified in PowerJob up to 5.1.2. Impacted is the 
  function MuConnectionManager.getOrCreateConnection of the file 
  powerjob-server/powerjob-server-starter/src/main/java/tech/powerjob/server/web/controller/TestController.java
  of the component Transport Endpoint. The manipulation leads to server-side 
  request forgery. The attack is possible to be carried out remotely. The 
  exploit is publicly available and might be used. The project was informed of 
  the problem early through an issue report but has not responded yet.
