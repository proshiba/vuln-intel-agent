title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  cdg: allow tcp_cdg_release() to be called multiple times\n\nApparently, mptcp is
  able to call tcp_disconnect() on an already\ndisconnected flow. This is generally
  fine, unless current congestion\ncontrol is CDG, because it might trigger a double-free
  [1]\n\nInstead of fixing MPTCP, and future bugs, we can make tcp_disconnect()\n\
  more resilient.\n\n[1]\nBUG: KASAN: double-free in slab_free mm/slub.c:3539 [inline]\n\
  BUG: KASAN: double-free in kfree+0xe2/0x580 mm/slub.c:4567\n\nCPU: 0 PID: 3645 Comm:
  kworker/0:7 Not tainted 6.0.0-syzkaller-02734-g0326074ff465 #0\nHardware name: Google
  Google Compute Engine/Google Compute Engine, BIOS Google 09/22/2022\nWorkqueue:
  events mptcp_worker\nCall Trace:\n<TASK>\n__dump_stack lib/dump_stack.c:88 [inline]\n\
  dump_stack_lvl+0xcd/0x134 lib/dump_stack.c:106\nprint_address_description mm/kasan/report.c:317
