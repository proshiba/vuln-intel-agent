title: Frappe is a full-stack web application framework. In version 16.31.0 and 
  earlier, frappe.client.set_value in frappe/client.py checks a dictionary 
  supplied through the fieldname parameter against forbidden standard and 
  child-table fields before parsing the dictionary into individual field names. 
  An authenticated caller can exploit this type confusion to mass-assign 
  protected fields through the client endpoint. No released fixed version is 
  available as of this review.
