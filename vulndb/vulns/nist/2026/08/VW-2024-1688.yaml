title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  Always flush async #PF workqueue when vCPU is being destroyed\n\nAlways flush the
  per-vCPU async #PF workqueue when a vCPU is clearing its\ncompletion queue, e.g.
  when a VM and all its vCPUs is being destroyed.\nKVM must ensure that none of its
  workqueue callbacks is running when the\nlast reference to the KVM _module_ is put.\
  \  Gifting a reference to the\nassociated VM prevents the workqueue callback from
  dereferencing freed\nvCPU/VM memory, but does not prevent the KVM module from being
  unloaded\nbefore the callback completes.\n\nDrop the misguided VM refcount gifting,
  as calling kvm_put_kvm() from\nasync_pf_execute() if kvm_put_kvm() flushes the async
  #PF workqueue will\nresult in deadlock.  async_pf_execute() can't return until kvm_put_kvm()\n\
  finishes, and kvm_put_kvm() can't return until async_pf_execute() finishes:\n\n\
  \ WARNING: CPU: 8 PID: 251 at virt/kvm/kvm_main.c:1435 kvm_put_kvm+0x2d/0x320 [kvm]\n\
  \ Modules linked in: vho"
