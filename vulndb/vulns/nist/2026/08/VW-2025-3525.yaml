title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  initialize locks earlier in f2fs_fill_super()\n\nsyzbot is reporting lockdep warning
  at f2fs_handle_error() [1], for\nspin_lock(&sbi->error_lock) is called before spin_lock_init()
  is called.\nFor safe locking in error handling, move initialization of locks (and\n\
  obvious structures) in f2fs_fill_super() to immediately after memory\nallocation."
