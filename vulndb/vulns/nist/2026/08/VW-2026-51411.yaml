title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoc:
  xilinx: Fix race condition in event registration\n\nThe zynqmp_power driver registers
  handlers for suspend and subsystem\nrestart events using register_event(). However,
  the work structures\n(zynqmp_pm_init_suspend_work and zynqmp_pm_init_restart_work)
  used by\nthese handlers were allocated and initialized after the registration\n\
  call.\n\nThis created a race window where, if the firmware triggered an event\n\
  immediately after registration but before allocation, the callback\n(suspend_event_callback
  or subsystem_restart_event_callback) would\ndereference a NULL pointer in work_pending(),
  leading to a crash.\n\nFix this by allocating and initializing the work structures
  before\nregistering the events."
