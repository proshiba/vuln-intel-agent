title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost-vdpa:
  fix vm_flags for virtqueue doorbell mapping\n\nThe virtqueue doorbell is usually
  implemented via registeres but we\ndon't provide the necessary vma->flags like VM_PFNMAP.
  This may cause\nseveral issues e.g when userspace tries to map the doorbell via
  vhost\nIOTLB, kernel may panic due to the page is not backed by page\nstructure.
  This patch fixes this by setting the necessary\nvm_flags. With this patch, try to
  map doorbell via IOTLB will fail\nwith bad address."
