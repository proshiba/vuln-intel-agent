title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath6kl: fix OOB read from firmware IE lengths in connect event\n\nThe firmware-controlled
  beacon_ie_len, assoc_req_len, and assoc_resp_len\nfields in ath6kl_wmi_connect_event_rx()
  are not validated against the\nbuffer length. Their sum (up to 765) can exceed the
  actual WMI event\ndata, causing out-of-bounds reads during IE parsing and state
  corruption\nof wmi->is_wmm_enabled.\n\nAdd a check that the total IE length fits
  within the buffer."
