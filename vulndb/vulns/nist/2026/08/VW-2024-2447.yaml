title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  map the EBADMSG to nfserr_io to avoid warning\n\nExt4 will throw -EBADMSG through
  ext4_readdir when a checksum error\noccurs, resulting in the following WARNING.\n\
  \nFix it by mapping EBADMSG to nfserr_io.\n\nnfsd_buffered_readdir\n iterate_dir
  // -EBADMSG -74\n  ext4_readdir // .iterate_shared\n   ext4_dx_readdir\n    ext4_htree_fill_tree\n\
  \     htree_dirblock_to_tree\n      ext4_read_dirblock\n       __ext4_read_dirblock\n\
  \        ext4_dirblock_csum_verify\n         warn_no_space_for_csum\n          __warn_no_space_for_csum\n\
  \        return ERR_PTR(-EFSBADCRC) // -EBADMSG -74\n nfserrno // WARNING\n\n[ \
  \ 161.115610] ------------[ cut here ]------------\n[  161.116465] nfsd: non-standard
  errno: -74\n[  161.117315] WARNING: CPU: 1 PID: 780 at fs/nfsd/nfsproc.c:878 nfserrno+0x9d/0xd0\n\
  [  161.118596] Modules linked in:\n[  161.119243] CPU: 1 PID: 780 Comm: nfsd Not
  tainted 5.10.0-00014-g79679361fd5d #138\n[  161.120684] Hardware name: QEMU Stan"
