title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbcon:
  fix NULL pointer dereference for a console without vc_data\n\nfbcon_new_modelist()
  runs when a framebuffer's modelist changes. For each\nconsole mapped to it with
  fb_display[i].mode set, it reads vc_cons[i].d and\npasses the vc_num to fbcon_set_disp().
  This assumes a console with a mode\nset has a vc_data, but it can be NULL. fbcon_set_disp()
  sets\nfb_display[i].mode before it checks vc_data, and fbcon_deinit() leaves the\n\
  mode set after the vc_data is freed. fbcon_new_modelist() then dereferences\nthe
  NULL vc_data.\n\nKeep fb_display[i].mode set only while the console has a vc_data.
  Check\nvc_data before setting the mode in fbcon_set_disp(), and clear the mode in\n\
  fbcon_deinit(). The existing mode check in fbcon_new_modelist() then skips\nsuch
  consoles."
