title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  potential buffer overflow in handling symlinks\n\nSmatch printed a warning:\n\t\
  arch/x86/crypto/poly1305_glue.c:198 poly1305_update_arch() error:\n\t__memcpy()
  'dctx->buf' too small (16 vs u32max)\n\nIt's caused because Smatch marks 'link_len'
  as untrusted since it comes\nfrom sscanf(). Add a check to ensure that 'link_len'
  is not larger than\nthe size of the 'link_str' buffer."
