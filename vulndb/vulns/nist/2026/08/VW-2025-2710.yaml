title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  conntrack: re-fetch conntrack after insertion\n\nIn case the conntrack is clashing,
  insertion can free skb->_nfct and\nset skb->_nfct to the already-confirmed entry.\n\
  \nThis wasn't found before because the conntrack entry and the extension\nspace
  used to free'd after an rcu grace period, plus the race needs\nevents enabled to
  trigger."
