title: "URL Redirection to Untrusted Site ('Open Redirect') vulnerability in the HTML5
  scrubber in rrrene html_sanitize_ex allows an unauthenticated remote attacker to
  retarget a form already on the rendering page and receive whatever the victim submits,
  including credentials, via the form and formaction attributes on an <input> element
  in sanitized HTML. HTML's form attribute associates an input with any form on the
  page by its id even when the input sits outside that form, and formaction on a submit
  control overrides the owning form's action. Neither attribute receives a scheme
  check, so an absolute cross-origin URL survives sanitizing.\n\nNo script executes.
  The scrubber allows neither form nor button, so the attacker cannot introduce a
  form of their own and the rendering page must already contain a form carrying an
  id.\n\nThis issue affects html_sanitize_ex: from 0.3.1 before 1.4.5 and from 1.5.0-rc.0
  before 1.5.3."
