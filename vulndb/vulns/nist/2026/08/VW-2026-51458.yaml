title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  fix guest_memory_dirty bitfield clobbered as size\n\nTwo sites in vmwgfx_resource.c
  assign boolean literals to\nres->guest_memory_size, which is an unsigned long allocation-size\n\
  field; the intended target is the adjacent res->guest_memory_dirty\nbitfield.  After
  the assignments the field holds 0 or 1 instead of\nthe resource's MOB allocation
  size:\n\n  - vmw_resource_release()       writes 0 (false), and\n  - vmw_resource_unbind_list()\
  \   writes 1 (true).\n\nSubsequent revalidation paths read guest_memory_size when
  computing\nthe dirty page range (vmw_bo_dirty_transfer_to_res()) and the buffer\n\
  allocation size (vmw_resource_buf_alloc()), producing zero-length\nwalks or wrap-around
  ranges that read or write past the MOB bitmap.\nThe dirty-tracking intent of the
  original code (mark the resource as\ndirtied since the last sync) is also lost,
  since guest_memory_dirty\nis never updated.\n\nRename both assignments to guest_memory_"
