title: stigmem-node 0.9.0a1 accepts federation peer key material during peer 
  registration without a separate administrator out-of-band fingerprint approval
  step. On nodes that accept federation peer registration over a network where 
  initial registration can be intercepted or misdirected, an attacker can 
  register a malicious peer and gain access to or tamper with federation 
  traffic. Fixed in 0.9.0a2, which introduces a pending approval flow requiring 
  administrator fingerprint verification before peer tokens are accepted.
