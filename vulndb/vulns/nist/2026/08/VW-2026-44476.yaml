title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  fix refcount leak in mlxsw_sp_vrs_lpm_tree_replace()\n\nWhen mlxsw_sp_vrs_lpm_tree_replace()
  fails after replacing some VRs,\nthe error rollback loop does not correctly revert
  the preceding\nreplacements. The loop decrements the index but fails to update the\n\
  vr pointer, which still points to the VR that caused the failure. As\na result,
  the condition and the rollback call always operate on the\nsame VR, potentially
  calling mlxsw_sp_vr_lpm_tree_replace() multiple\ntimes on it while never rolling
  back the earlier VRs. Those VRs\ncontinue to hold a reference to new_tree acquired
  via\nmlxsw_sp_lpm_tree_hold(), leaking the reference count of new_tree.\n\nFix by
  reinitializing vr inside the error loop with the updated index:\n\n\tvr = &mlxsw_sp->router->vrs[i];\n\
  \nso that the loop correctly iterates over all VRs that were actually\nreplaced."
