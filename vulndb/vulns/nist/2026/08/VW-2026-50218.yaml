title: "The LoRaWAN TS004 Fragmented Data Block Transport handler frag_transport_package_callback()
  in subsys/lorawan/services/frag_transport.c parses downlink command bytes without
  validating that enough payload bytes remain before each access. The loop's only
  bound is rx_pos < len; after consuming the one-byte command id the handler cast
  rx_buf + rx_pos to a 10-byte struct frag_transport_setup_req, and for a DATA_FRAGMENT
  command passed &rx_buf[rx_pos] to the fragment decoder, which reads exactly ctx.frag_size
  bytes — with no remaining-length check in either case.\n\nThe fragment size is attacker-chosen
  in a preceding FRAG_SESSION_SETUP command (ctx.frag_size = req->frag_size, capped
  at CONFIG_LORAWAN_FRAG_TRANSPORT_MAX_FRAG_SIZE, default 232). rx_buf aliases the
  255-byte static MacCtx.RxPayload buffer in the loramac-node MAC layer, while len
  is the actual decrypted payload length. By padding a downlink with mismatched-index
