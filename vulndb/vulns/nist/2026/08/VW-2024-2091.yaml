  iwlwifi: mvm: check n_ssids before accessing the ssids\n\nIn some versions of cfg80211,
  the ssids poinet might be a valid one even\nthough n_ssids is 0. Accessing the pointer
  in this case will cuase an\nout-of-bound access. Fix this by checking n_ssids first."
