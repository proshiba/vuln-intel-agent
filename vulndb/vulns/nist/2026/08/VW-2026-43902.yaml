title: The getgrav/grav-plugin-api plugin before 1.0.13 contains an API-key 
  scope cap bypass in the POST /reports/twig-content/allowlist endpoint 
  (ReportsController). The endpoint enforces 
  requirePermission('api.config.write') followed by a bare isSuperAdmin() check 
  instead of requireSuper(). Because isSuperAdmin() reads access.api.super 
  directly and never consults api_key_scopes, a least-privilege API key scoped 
  to api.config.write minted on a super account passes the gate, allowing an 
  attacker to append attacker-chosen tokens to the security.twig_sandbox 
  allowlist (persisted to user/config/security.yaml). Widening the allowlist 
  turns any subsequent Twig-in-content render into an SSTI/RCE sink.
