title: A server-side request forgery vulnerability in HumanSignal Label Studio 
  through 1.24.0.dev0 exists because SSRF_PROTECTION_ENABLED is set to false by 
  default. The import-from-URL endpoint fetches any caller-supplied URL 
  including internal loopback addresses on the default installation. An 
  authenticated user can use this to reach internal services, cloud metadata 
  endpoints, and other resources not intended for external access.
