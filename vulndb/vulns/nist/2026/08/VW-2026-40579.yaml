title: "Tobit Laboratories AG TeamDavid's Webbox  is vulnerable to HTTP header injection
  through the \nrequest body in the application's link storing functionality \n(//ServerClient_celink.htm),
  which is appended to the redirect target in\n the 302 HTTP response. If a line feed
  is added, this will also be added\n to the redirect link, resulting in the ability
  to control the response \nheaders. This issue affects TeamDavid through Rollout
  524."
