title: Joomla Extension - joomshaper.com - Broken Object-Level Authorization in 
  Blog Image Deletion in Helix Ultimate < 2.2.10 - `Blog::remove_image()` 
  checked whether the user was authorized to edit the article ID passed in the 
  request, but did not verify whether the specified image path (src) belonged to
  that article. On Joomla 3 builds where physical file deletion was triggered, 
  an author could supply their own article ID alongside an arbitrary file path 
  under the `/images/` directory to delete arbitrary files.
