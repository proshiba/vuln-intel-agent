title: "The use of\nhard-coded cryptographic key vulnerability has been identified
  in the mesh\nfunctionality of Deco XE75 v3, XE5300 v3.6 and WE10800 v3.6. \nA shared
  RSA-512 mesh group private key is present in the affected\nfirmware and is used
  by the mesh protocol for node authentication.  An attacker who obtains the firmware
  image\nand has local network access may be able to authenticate as a mesh node without\n\
  possessing a device-specific credential.\n\n\n\n\n\nSuccessful\nexploitation may
  allow an unauthenticated adjacent attacker to impersonate a\ntrusted mesh node and
  bypass mesh node authentication, which may permit unauthorized\nchanges to device
  or mesh configuration, affecting confidentiality, integrity\nand availability."
