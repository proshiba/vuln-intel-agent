title: A vulnerability has been found in astralisone rive-mcp-server-core up to 
  db1d0cc4cd52589116360428b7504fd0ca748b3e. This affects an unknown part of the 
  file packages/mcp-server/src/tools/importRiveFile.ts of the component 
  importRiveFile Flow. Such manipulation of the argument libraryId leads to path
  traversal. The attack needs to be performed locally. This product implements a
  rolling release for ongoing delivery, which means version information for 
  affected or updated releases is unavailable. The project was informed of the 
  problem early through an issue report but has not responded yet.
