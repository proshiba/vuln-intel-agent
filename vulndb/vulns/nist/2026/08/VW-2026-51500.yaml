title: Forwarding information received from a host listed as a trusted proxy is 
  not kept separate from Dovecot's own authentication fields, so a value sent by
  that host can be injected as an internal authentication field. Any host 
  permitted to act as a trusted proxy can authenticate as any user without 
  knowing that user's password. This affects deployments whose password database
  honours a field that permits authentication without a password. Deployments 
  that do not configure trusted proxies are not affected. Restrict the list of 
  trusted proxy networks to hosts that are fully under your control. Update to 
  non-vulnerable version. No publicly available exploits are known.
