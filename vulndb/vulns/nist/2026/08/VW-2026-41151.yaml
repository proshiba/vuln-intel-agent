title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  wacom: use GFP_ATOMIC in wacom_wac_queue_flush()\n\nwacom_wac_queue_flush() is called
  via the .raw_event callback\n(wacom_raw_event → wacom_wac_pen_serial_enforce → wacom_wac_queue_flush).\n\
  For USB HID devices, this callback is invoked from hid_irq_in(), which\nis a URB
  completion handler running in atomic context. Using GFP_KERNEL\nin this path can
  sleep, leading to a \"scheduling while atomic\" bug.\n\nUse GFP_ATOMIC instead.
  The existing code already handles allocation\nfailure by skipping the fifo entry
  and continuing."
