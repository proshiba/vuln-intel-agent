title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatch_queue:
  Fix filter limit check\n\nIn watch_queue_set_filter(), there are a couple of places
  where we check\nthat the filter type value does not exceed what the type_filter
  bitmap\ncan hold.  One place calculates the number of bits by:\n\n   if (tf[i].type
  >= sizeof(wfilter->type_filter) * 8)\n\nwhich is fine, but the second does:\n\n\
  \   if (tf[i].type >= sizeof(wfilter->type_filter) * BITS_PER_LONG)\n\nwhich is
  not.  This can lead to a couple of out-of-bounds writes due to\na too-large type:\n\
  \n (1) __set_bit() on wfilter->type_filter\n (2) Writing more elements in wfilter->filters[]
  than we allocated.\n\nFix this by just using the proper WATCH_TYPE__NR instead,
  which is the\nnumber of types we actually know about.\n\nThe bug may cause an oops
  looking something like:\n\n  BUG: KASAN: slab-out-of-bounds in watch_queue_set_filter+0x659/0x740\n\
  \  Write of size 4 at addr ffff88800d2c66bc by task watch_queue_oob/611\n  ...\n\
  \  Call Trace:\n   <TAS"
