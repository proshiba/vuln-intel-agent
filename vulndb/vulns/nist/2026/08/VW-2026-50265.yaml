title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix NULL pointer dereference in amdgpu_dm_crtc_set_vblank()\n\namdgpu_dm_crtc_set_vblank()
  dereferences acrtc_state->stream when\nvblank is enabled/queried from DRM_IOCTL_MODE_CRTC_GET_SEQUENCE
  before\na stream is attached to it.\n\nBUG: kernel NULL pointer dereference, address:
  0000000000000008\nRIP: amdgpu_dm_crtc_set_vblank+0x6b/0x4d0 [amdgpu]\nCall Trace:\n\
  \ drm_vblank_enable\n drm_vblank_get\n drm_crtc_get_sequence_ioctl\n drm_ioctl_kernel\n\
  \ drm_ioctl\n\nReproduced by running VKCTS with WSI tests enabled on RADV.\n\nGuard
  the enable path on acrtc_state->stream being non-NULL, matching\nthe existing checks
  in this function.\n\n(cherry picked from commit 7b1b31bf6942e6f43509b48da23f8e27269aac39)"
