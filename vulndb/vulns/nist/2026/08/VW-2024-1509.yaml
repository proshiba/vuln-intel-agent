title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/mmu: Don't advance iterator after restart due to yielding\n\nAfter dropping
  mmu_lock in the TDP MMU, restart the iterator during\ntdp_iter_next() and do not
  advance the iterator.  Advancing the iterator\nresults in skipping the top-level
  SPTE and all its children, which is\nfatal if any of the skipped SPTEs were not
  visited before yielding.\n\nWhen zapping all SPTEs, i.e. when min_level == root_level,
  restarting the\niter and then invoking tdp_iter_next() is always fatal if the current
  gfn\nhas as a valid SPTE, as advancing the iterator results in try_step_side()\n\
  skipping the current gfn, which wasn't visited before yielding.\n\nSprinkle WARNs
  on iter->yielded being true in various helpers that are\noften used in conjunction
  with yielding, and tag the helper with\n__must_check to reduce the probabily of
  improper usage.\n\nFailing to zap a top-level SPTE manifests in one of two ways.\
