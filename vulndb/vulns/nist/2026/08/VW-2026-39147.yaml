title: Apache NiFI 1.10.0 through 2.10.0 provide a Parameter Context update REST
  API method that does not enforce authorization checking on components 
  referencing Parameter values. Updating a Parameter Context can change 
  parameter values that affect referencing components, but framework 
  authorization was limited to read and write privileges on the Parameter 
  Context itself. As a result of the missing authorization, an authenticated 
  user authorized to modify a Parameter Context, but not authorized on 
  referencing components, could alter Parameter values affecting those 
  components. In deployments where a Parameter value contains executable 
  scripting content, updating a Parameter can result in code execution during 
  automatic component validation, without starting the referencing component. 
