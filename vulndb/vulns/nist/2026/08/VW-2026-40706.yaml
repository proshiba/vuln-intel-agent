title: "Six Android App Widget configuration activities in the Datadog Android application
  are declared android:exported=\"true\" with no permission guard: IncidentWidgetActivity,
  MonitorSavedViewWidgetActivity, OnCallShiftsWidgetActivity, OnCallPagesWidgetActivity,
  SloWidgetActivity, and DashboardWidgetActivity. All six extend a shared base WidgetActivity
  that reads AppWidgetManager.EXTRA_APPWIDGET_ID from Intent extras and, when no resolved
  deep-link destination is supplied, uses that caller-controlled widget ID to look
  up the stored widget definition, fetch the associated user session, and perform
  an automatic login with source UserSessionSourceLogin.Automatic.\r\nAndroid App
  Widget IDs are small sequential integers assigned by AppWidgetManager. A zero-permission
