title: A flaw was found in RESTEasy's SourceProvider. This vulnerability allows 
  an unauthenticated attacker to perform an unauthenticated remote file read. By
  sending a specially crafted XML body with a DOCTYPE declaration referencing 
  external entities to an endpoint that accepts application/xml and returns 
  Source or StreamSource, the server can be tricked into resolving the entity 
  and including sensitive file contents in the HTTP response. This is due to the
  SourceProvider.writeTo() method creating a SAXParser without disabling 
  external entity resolution, leading to an XML External Entity (XXE) 
  vulnerability.
