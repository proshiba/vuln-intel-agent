title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  tridentfb: fix potential memory leak in trident_pci_probe()\n\nIn trident_pci_probe(),
  the memory allocated for modelist using\nfb_videomode_to_modelist() is not freed
  in subsequent error paths.\nFix that by calling fb_destroy_modelist()."
