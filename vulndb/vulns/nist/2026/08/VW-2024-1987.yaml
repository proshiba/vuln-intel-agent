title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  microchip: pci1xxxx: fix double free in the error handling of gp_aux_bus_probe()\n\
  \nWhen auxiliary_device_add() returns error and then calls\nauxiliary_device_uninit(),
  callback function\ngp_auxiliary_device_release() calls ida_free() and\nkfree(aux_device_wrapper)
  to free memory. We should't\ncall them again in the error handling path.\n\nFix
  this by skipping the redundant cleanup functions."
