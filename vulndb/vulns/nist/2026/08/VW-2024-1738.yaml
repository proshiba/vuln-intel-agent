title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dw-edma: HDMA: Add sync read before starting the DMA transfer in remote setup\n\n\
  The Linked list element and pointer are not stored in the same memory as\nthe HDMA
  controller register. If the doorbell register is toggled before\nthe full write
  of the linked list a race condition error will occur.\nIn remote setup we can only
  use a readl to the memory to assure the full\nwrite has occurred."
