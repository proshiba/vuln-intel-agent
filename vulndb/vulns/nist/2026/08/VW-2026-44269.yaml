title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-integrity:
  fix a bug if the bio is out of limits\n\nIf dm_integrity_check_limits fails, the
  code would exit with\nDM_MAPIO_KILL. However, the range would be already locked
  at this point,\nand it wouldn't be unlocked, resulting in a deadlock. Let's move
  the\nlimit check up, so that when it exits, no resources are leaked."
