title: A vulnerability was determined in dromara lamp-cloud up to 5.10.0. This 
  issue affects some unknown processing of the file FileChunkController.java of 
  the component chunk-check endpoint. Executing a manipulation of the argument 
  Name can lead to path traversal. The attack can be launched remotely. The 
  exploit has been publicly disclosed and may be utilized. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
