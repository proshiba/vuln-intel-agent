title: A vulnerability was found in andreahaku codex_mcp up to 
  1ff521cc6cc57cfe56ddef946c644b8534771390. The affected element is an unknown 
  function of the file src/codex-process-simple.ts of the component ask MCP 
  Tool. The manipulation of the argument model results in command injection. The
  attack requires a local approach. This product does not use versioning. This 
  is why information about affected and unaffected releases are unavailable. The
  project was informed of the problem early through an issue report but has not 
  responded yet.
