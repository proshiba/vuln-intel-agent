title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  nVMX: Put vmcs12 pages if nested VM-Enter fails due to invalid guest state\n\nPut
  all vmcs12 pages if KVM synthesizes a nested VM-Exit due to invalid\nguest while
  emulating VMLAUNCH or VMRESUME.  The invalid guest state path\ndoesn't use nested_vmx_vmexit()
  as that API is intended to be used if and\nonly if L2 is active, and the open coded
  equivalent neglects to put the\nvmcs12 pages.  Failure to put the vmcs12 pages leaks
  any pinned pages\n(and/or mappings) if L1 retries VMLAUNCH/VMRESUME.\n\nNote, the
  !from_vmenter scenario doesn't suffer the same problem, as\nvmx_get_nested_state_pages()
  only gets/pins/maps the vmcs12 pages if L2 is\nactive, i.e. if a \"full\" VM-Exit
  is guaranteed before KVM will retry\ngetting vmcs12 pages."
