title: OpenEMR through 8.2.0 contains an authenticated SQL injection 
  vulnerability in the backup configuration import feature that allows 
  administrators with admin or super ACL privileges to execute arbitrary DDL and
  DML statements against the application database by uploading a crafted SQL 
  file at the form_step=202 parameter in backup.php. Attackers can exploit the 
  unfiltered shell_exec invocation of the mysql command-line client to extract 
  credential hashes, modify access control tables, inject backdoor accounts, 
  create persistent triggers or stored procedures, and write arbitrary files to 
  the filesystem where MySQL FILE privileges and permissive secure_file_priv 
  settings are configured.
