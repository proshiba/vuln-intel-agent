title: "The userspace syscall verifier z_vrfy_mbox_send() in drivers/mbox/mbox_handlers.c
  validated the nested msg->data/msg->size fields by reading them directly out of
  live userspace memory, and then forwarded the original, still-mutable userspace
  struct mbox_msg * pointer to z_impl_mbox_send() and the underlying driver. Between
  the access check and the driver's use of msg->data, the validated pointer could
  be replaced, leaving a time-of-check/time-of-use window.\n\nOn a system built with
  CONFIG_USERSPACE, any unprivileged userspace thread may invoke the mbox_send() system
  call. A second thread sharing the caller's address space can race to overwrite msg->data
  with a supervisor (kernel) address after the verifier's bounds check has passed
  but before the driver dereferences it. The driver then reads from the attacker-chosen
  address in supervisor context (for example memcpy(&data32, msg->data, msg->size)
  in the NXP mailbox driver, whose bytes are subsequently emitted to the peer mailbox
  endpoint"
