title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Fix OOB read during CQ MR registration\n\nSashiko pointed out an unrelated bug during
  a previous patch:\nhttps://sashiko.dev/#/patchset/20260512183852.614045-1-jmoroni%40google.com\n\
  \nThis change fixes the bug by eliminating the cqmr->split field which\nwas not
  being set properly and instead just checks the CQ resize\nfeature flag directly.\n\
  \nThe cqmr->split field essentially tracks whether IRDMA_FEATURE_CQ_RESIZE\nis set,
  but it was not being set until CQ creation time, which is _after_\nCQ memory registration
  (the only other place where it is referenced).\n\nAs a result, it would always be
  false during MR registration and would\ntherefore cause irdma_handle_q_mem to populate
  cqmr->shadow even for GEN_2\nHW and beyond:\n\n    cqmr->shadow = (dma_addr_t)arr[req->cq_pages];\n\
  \nThe issue is that for GEN_2 and beyond, req->cq_pages may be exactly equal\nto
  iwmr->page_cnt and therefore equal to the size of arr, which would cause"
