title: 'An authorization bypass vulnerability in LXD allows an authenticated user
  to bypass project-level disk and volume limits. Two related code paths fail to verify
  resource limits during volume operations: the storagePoolVolumeTypePostMove function
  omits the limits.AllowVolumeCreation check before moving a volume across projects,
  and volume snapshot restore operations skip the AllowVolumeUpdate check when the
  configuration is nil (Config == nil). An attacker can exploit these flaws to allocate
  storage resources that exceed the administrative limits configured for a project.'
