title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  admin-gate legacy LLSEC dump operations\n\nIn net/ieee802154/netlink.c, the legacy
  IEEE802154_NL family ops table\nbuilds the LLSEC dump entries (LLSEC_LIST_KEY, LLSEC_LIST_DEV,\n\
  LLSEC_LIST_DEVKEY, LLSEC_LIST_SECLEVEL) with IEEE802154_DUMP() which\nsets no .flags,
  so generic netlink runs them ungated. The modern\nnl802154 family admin-gates the
  equivalent reads via\nNL802154_CMD_GET_SEC_KEY and friends with .flags = GENL_ADMIN_PERM.\n\
  \nAny local uid that can open AF_NETLINK / NETLINK_GENERIC can resolve\nthe \"802.15.4
  MAC\" family and dump LLSEC_LIST_KEY on any wpan netdev\nthat has an LLSEC key installed;
  the dump handler writes the raw\n16-byte AES-128 key bytes (IEEE802154_ATTR_LLSEC_KEY_BYTES,
  copied\nverbatim from struct ieee802154_llsec_key.key) into the reply.\nRecovering
  the AES key compromises 802.15.4 LLSEC link confidentiality\nand authenticity, since
  LLSEC uses CCM* and the same key authenticates\nand encrypts "
