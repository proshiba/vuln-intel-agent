title: WWBN AVideo (current e01e41ecc and earlier) contains a brute-force rate 
  limiting bypass in enforceRateLimit(), which protects login.json.php and 13 
  other endpoints. The function stores its attempt counter via a cache layer 
  (ObjectYPT::setCacheGlobal) that silently discards writes for any client 
  identified as a bot by isBot(). Because isBot() treats a missing User-Agent 
  header as a bot by default — and also matches common bot identifiers such as 
  'curl', 'bot', 'crawler', and 'spider' — the counter never increments for such
  clients, so the rate limit never fires. An unauthenticated attacker can 
  therefore submit unlimited login attempts (e.g., by omitting the User-Agent 
  header or using curl's default User-Agent), enabling unrestricted 
  password-guessing attacks.
