title: The Events Manager – Calendar, Bookings, Tickets, and more! plugin for 
  WordPress is vulnerable to authorization bypass in all versions up to, and 
  including, 7.4.0. This is due to the plugin not properly verifying that a user
  is authorized to perform an action. This makes it possible for unauthenticated
  attackers to view the titles, dates, descriptions, and location details of 
  events and locations that administrators have marked as draft, pending, 
  trashed, or private.
