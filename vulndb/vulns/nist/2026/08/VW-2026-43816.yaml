title: "Trigger.dev is a platform for building and deploying fully managed AI agents
  and workflows. From 4.4.2 until 4.5.0-rc.5, Aws4FetchClient.buildUrl() and Aws4FetchClient.presign()
  in apps/webapp/app/v3/objectStoreClient.server.ts assign user-controlled packet
  keys to URL.pathname, while apps/webapp/app/routes/api.v1.packets.$.ts accepts params[\"\
  *\"] without rejecting dot segments and uses findResource: async () => 1 without
  per-resource ownership validation. WHATWG path normalization collapses .. segments
  before signing, allowing a caller with a valid environment API key to obtain presigned
  URLs for another tenant's object-store keys and read or overwrite task payloads.
  This issue is fixed in version 4.5.0-rc.5."
