title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  avoid possible NULL dereference in cifs_free_subrequest()\n\nClang static checker
  (scan-build) warning:\n\tcifsglob.h:line 890, column 3\n\tAccess to field 'ops'
  results in a dereference of a null pointer.\n\nCommit 519be989717c (\"cifs: Add
  a tracepoint to track credits involved in\nR/W requests\") adds a check for 'rdata->server',
  and let clang throw this\nwarning about NULL dereference.\n\nWhen 'rdata->credits.value
  != 0 && rdata->server == NULL' happens,\nadd_credits_and_wake_if() will call rdata->server->ops->add_credits().\n\
  This will cause NULL dereference problem. Add a check for 'rdata->server'\nto avoid
  NULL dereference."
