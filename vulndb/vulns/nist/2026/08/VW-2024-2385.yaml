title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Acquire kvm->srcu when handling KVM_SET_VCPU_EVENTS\n\nGrab kvm->srcu when
  processing KVM_SET_VCPU_EVENTS, as KVM will forcibly\nleave nested VMX/SVM if SMM
  mode is being toggled, and leaving nested VMX\nreads guest memory.\n\nNote, kvm_vcpu_ioctl_x86_set_vcpu_events()
  can also be called from KVM_RUN\nvia sync_regs(), which already holds SRCU.  I.e.
  trying to precisely use\nkvm_vcpu_srcu_read_lock() around the problematic SMM code
  would cause\nproblems.  Acquiring SRCU isn't all that expensive, so for simplicity,\n\
  grab it unconditionally for KVM_SET_VCPU_EVENTS.\n\n =============================\n\
  \ WARNING: suspicious RCU usage\n 6.10.0-rc7-332d2c1d713e-next-vm #552 Not tainted\n\
  \ -----------------------------\n include/linux/kvm_host.h:1027 suspicious rcu_dereference_check()
  usage!\n\n other info that might help us debug this:\n\n rcu_scheduler_active =
  2, debug_locks = 1\n 1 lock held by repro/1071:\n  #0: ffff88811e424430 (&vcpu"
