title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  avoid self-deadlock during inode eviction\n\nAn attribute-list update performed
  while allocating clusters can drop the\nlast reference to the temporary attribute
  inode. Evicting that inode\ndrops its reference to the base inode and can invoke
  ntfs_drop_big_inode()\nfor the base inode from within the base inode's own writeback
  path.\n\nIf the base inode is unlinked, ntfs_drop_big_inode() calls\ntruncate_setsize(),
  which waits for the inode's folio writeback to\ncomplete. The same writeback worker
  is responsible for completing that\nwriteback, so it waits for itself indefinitely.\n\
  \nPrevent this self-deadlock by grabbing a reference to the base inode at the\n\
  beginning of ntfs_writepages() and releasing it at the end of the function.\nThis
  defers eviction until all bios have been submitted, allowing the wait\nfor folio
  writeback to complete safely."
