title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/pt:
  Reset current_op in xe_pt_update_ops_init()\n\nxe_pt_update_ops_init() fails to
  reset current_op to 0. On the\nvm_bind path, ops_execute() calls xe_pt_update_ops_prepare()
  inside\nthe xe_validation_guard() / drm_exec_until_all_locked() loop. When\nthat
  loop retries due to lock contention or OOM eviction\n(drm_exec_retry_on_contention()
  / xe_validation_retry_on_oom()),\nxe_pt_update_ops_prepare() runs again on the same
  vops, and each\ncall to bind_op_prepare() increments current_op without resetting
  it.\n\nAfter N retries current_op exceeds the array size allocated by\nxe_vma_ops_alloc(),
  causing an out-of-bounds write into\nSLUB-poisoned memory and a subsequent UAF crash
  in\nxe_migrate_update_pgtables_cpu() when reading the corrupted pt_op->bind.\n\n\
  Also reset needs_svm_lock and needs_invalidation which are derived in\nthe same
  prepare pass and would otherwise cause wrong migrate ops\nselection and redundant
  TLB invalidatio"
