title: TBEA TLogger V2.1.0.0B0.0.0.0 contains an unauthenticated resource 
  exhaustion vulnerability in its web server. An unauthenticated remote attacker
  can send PUT requests to the /tmp/ endpoint, causing the web server to create 
  persistent files containing attacker-controlled data under 
  /opt/myapp/webserver/. The generated files are not removed because the web 
  server attempts to move them into a non-existent directory. Repeated requests 
  can therefore exhaust available storage and cause a denial-of-service 
  condition.
