title: The Kubio AI Page Builder plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 2.8.5. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  contributor-level access and above, to overwrite front-page configuration 
  options (show_on_front, page_on_front, and page_for_posts), rewrite primary 
  navigation menu items, replace template parts, and overwrite the Kubio 
  global-data post. Although a nonce check via check_ajax_referer() is present, 
  the nonce is unconditionally emitted into window.kubioUtilsData for every user
  who can load the block editor, making it harvestable by any Contributor and 
  therefore an ineffective authorization barrier.
