title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_dualpi2: Do not call qdisc_tree_reduce_backlog during peek before restoring
  qlen\n\nWhenever dualpi2 drops packets during peek, it calls\nqdisc_tree_reduce_backlog.
  An issue arises because it calls\nqdisc_tree_reduce_backlog before it reincrements
  the qlen. If qlen drops\nto zero, but peek returns an skb, the parent's qlen_notify
  callback will be\nexecuted even though dualpi2 still has 1 packet on the queue and,
  thus,\nmistakenly deactivates the parent's class which leads to a null-ptr-deref:\n\
  \n[  101.427314][  T599] Oops: general protection fault, probably for non-canonical
  address 0xdffffc0000000009: 0000 [#1] SMP KASAN NOPTI\n[  101.427755][  T599] KASAN:
  null-ptr-deref in range [0x0000000000000048-0x000000000000004f]\n[  101.428048][\
  \  T599] CPU: 2 UID: 0 PID: 599 Comm: ping Not tainted 7.1.0-rc5-00284-gbce53c430ed7
  #102 PREEMPT(full)\n[  101.428400][  T599] Hardware name: Bochs Bochs, BIOS Bochs
  01/01/2011\n[  "
