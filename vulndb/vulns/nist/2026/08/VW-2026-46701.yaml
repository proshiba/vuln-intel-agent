  that is affected is 6.2.1. Difficult to exploit vulnerability allows unauthenticated
  attacker with access to the physical communication segment attached to the hardware
  where the Oracle Agile Engineering Data Management executes to compromise Oracle
  Agile Engineering Data Management.  Successful attacks of this vulnerability can
  result in takeover of Oracle Agile Engineering Data Management. CVSS 3.1 Base Score
  7.5 (Confidentiality, Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H).'
