title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm6:
  clear dst.dev on error to avoid double netdev_put in xfrm6_fill_dst()\n\nOn the
  error path where in6_dev_get(dev) returns NULL, xfrm6_fill_dst()\nreleases the device
  reference with netdev_put() but leaves\nxdst->u.dst.dev set. dst_destroy() later
  calls netdev_put(dst->dev)\nagain, so the same net_device reference is released
  twice, underflowing\nits refcount (ref_tracker WARNING + \"unregister_netdevice:
  waiting for\n<dev> to become free\").\n\nClear xdst->u.dst.dev after the netdev_put(),
  the same way the XFRM\ndevice-offload paths xfrm_dev_state_add() and xfrm_dev_policy_add()
  in\nnet/xfrm/xfrm_device.c NULL ->dev when releasing the reference on error.\n\n\
  \  ref_tracker: reference already released.\n  ref_tracker: allocated in:\n   xfrm6_fill_dst
  (net/ipv6/xfrm6_policy.c:86)\n   ...\n   udpv6_sendmsg (net/ipv6/udp.c:1696)\n \
  \  ...\n  ref_tracker: freed in:\n   xfrm6_fill_dst (net/ipv6/xfrm6_policy.c:90)\n\
  \   ...\n  WARNING: lib/ref_tra"
