title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Mask pseudo pointer values in verifier logs\n\nprint_bpf_insn() masks ldimm64 immediates
  for pointer-bearing pseudo\nsources when pointer leaks are not allowed, but the
  mask only covers\nBPF_PSEUDO_MAP_FD and BPF_PSEUDO_MAP_VALUE.\n\nBPF_PSEUDO_MAP_IDX,
  BPF_PSEUDO_MAP_IDX_VALUE, and BPF_PSEUDO_BTF_ID can\nalso be resolved to kernel
  pointer values before the verifier log prints\nthe instruction. Include them in
  the existing pointer classification so\nthe log prints 0x0 instead of the rewritten
  address."
