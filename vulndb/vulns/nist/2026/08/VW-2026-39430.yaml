title: MaxSite CMS 109.5 and earlier contains an authentication bypass 
  vulnerability in the AJAX dispatcher that allows unauthenticated attackers to 
  access admin-gated endpoints by supplying any X-Requested-With header and 
  requesting a base64-encoded path resolving to any *-ajax.php file in the 
  codebase. Attackers can exploit this dispatcher bypass to reach privileged 
  plugin endpoints without credentials, enabling actions such as manipulating 
  poll states and vote counts, and amplifying the impact of any dangerous 
  operation performed by admin-only ajax files across the plugin tree.
