title: The Formidable Charts plugin for WordPress is vulnerable to Directory 
  Traversal in all versions up to, and including, 2.0.1 via the 'frm_graph' 
  parameter. This makes it possible for unauthenticated attackers to read the 
  contents of arbitrary files on the server, which can contain sensitive 
  information. Successful exploitation requires Formidable Forms Lite, 
  Formidable Forms Pro, and Formidable Charts to be active and requires the 
  wp-content/uploads/frm-charts/ directory to exist, normally after an 
  image-format chart is rendered.
