title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix NULL sndbuf_desc in smc_cdc_tx_handler()\n\nWhen performing a stress test on
  SMC-R by rmmod mlx5_ib driver\nduring the wrk/nginx test, we found that there is
  a probability\nof triggering a panic while terminating all link groups.\n\nThis
  issue dues to the race between smc_smcr_terminate_all()\nand smc_buf_create().\n\
  \n\t\t\tsmc_smcr_terminate_all\n\nsmc_buf_create\n/* init */\nconn->sndbuf_desc
  = NULL;\n...\n\n\t\t\t__smc_lgr_terminate\n\t\t\t\tsmc_conn_kill\n\t\t\t\t\tsmc_close_abort\n\
  \t\t\t\t\t\tsmc_cdc_get_slot_and_msg_send\n\n\t\t\t__softirqentry_text_start\n\t\
  \t\t\tsmc_wr_tx_process_cqe\n\t\t\t\t\tsmc_cdc_tx_handler\n\t\t\t\t\t\tREAD(conn->sndbuf_desc->len);\n\
  \t\t\t\t\t\t/* panic dues to NULL sndbuf_desc */\n\nconn->sndbuf_desc = xxx;\n\n\
  This patch tries to fix the issue by always to check the sndbuf_desc\nbefore send
  any cdc msg, to make sure that no null pointer is\nseen during cqe processing."
