title: ERPNext is a free and open source Enterprise Resource Planning tool. 
  Prior to 15.112.0 and 16.22.0, the merge_account, pause_job_for_doc, 
  trigger_job_for_doc, change_release_date, and update_cost_center functions 
  across erpnext/accounts/doctype/account/account.py, 
  erpnext/accounts/doctype/process_payment_reconciliation/process_payment_reconciliation.py,
  erpnext/accounts/doctype/purchase_invoice/purchase_invoice.py, and 
  erpnext/accounts/utils.py omit required write permission checks, allowing 
  authenticated limited users to modify protected data beyond their roles. This 
  issue is fixed in versions 15.112.0 and 16.22.0.
