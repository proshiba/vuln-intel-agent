title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/userptr:
  Hold notifier_lock for write on inject test path\n\nWhen CONFIG_DRM_XE_USERPTR_INVAL_INJECT=y,
  xe_pt_svm_userptr_pre_commit()\nruns vma_check_userptr() with the svm notifier_lock
  taken for read. The\ntest injection causes vma_check_userptr() to call\nxe_vma_userptr_force_invalidate(),
  which feeds into\nxe_vma_userptr_do_inval() with drm_gpusvm_ctx.in_notifier=true.
  That\nflag tells drm_gpusvm_unmap_pages() the caller already holds\nnotifier_lock
  for write and only asserts the mode. Because the caller\nactually holds it for read,
  the assertion fires:\n\n  WARNING: drivers/gpu/drm/drm_gpusvm.c:1669 at \\\n   \
  \        drm_gpusvm_unmap_pages+0xd4/0x130 [drm_gpusvm_helper]\n  Call Trace:\n\
  \   xe_vma_userptr_do_inval+0x40d/0xfd0 [xe]\n   xe_vma_userptr_invalidate_pass1+0x3e6/0x8d0
  [xe]\n   xe_vma_userptr_force_invalidate+0xde/0x290 [xe]\n   vma_check_userptr.constprop.0+0x1c6/0x220
  [xe]\n   xe_pt_svm_userptr_pre_commit+0x6a3/0xc"
