title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  bpf: Fix hid_bpf_get_data() range check\n\nhid_bpf_get_data() returns a pointer
  into the HID-BPF context data when\nthe caller-provided offset and size fit inside
  ctx->allocated_size.\n\nThe current check adds rdwr_buf_size and offset before comparing
  the\nresult against ctx->allocated_size. Since both values are unsigned, a\nvery
  large size can wrap the sum below ctx->allocated_size and make the\nhelper return
  a pointer even though the requested range is not contained\nin the backing buffer.\n\
  \nUse check_add_overflow() to reject wrapped range ends before comparing\nthe requested
  range end against ctx->allocated_size."
