title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  call _ntfs_bad_inode() when failing to rename\n\nIt is safe to call _ntfs_bad_inode
  on live inodes since:\n  commit 519b078998ce (\"fs/ntfs3: Exclude call make_bad_inode
  for live nodes.\")\n\nThe WARN_ON was added when it wasn't safe by:\n  commit d99208b91933
  (\"fs/ntfs3: cancle set bad inode after removing name fails\")\n\nReplace the WARN_ON
  with a call to _ntfs_bad_inode() to prevent further\noperations on the inconsistent
  inode."
