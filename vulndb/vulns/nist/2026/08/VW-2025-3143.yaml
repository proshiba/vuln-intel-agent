title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetlink:
  annotate lockless accesses to nlk->max_recvmsg_len\n\nsyzbot reported a data-race
  in data-race in netlink_recvmsg() [1]\n\nIndeed, netlink_recvmsg() can be run concurrently,\n\
  and netlink_dump() also needs protection.\n\n[1]\nBUG: KCSAN: data-race in netlink_recvmsg
  / netlink_recvmsg\n\nread to 0xffff888141840b38 of 8 bytes by task 23057 on cpu
  0:\nnetlink_recvmsg+0xea/0x730 net/netlink/af_netlink.c:1988\nsock_recvmsg_nosec
  net/socket.c:1017 [inline]\nsock_recvmsg net/socket.c:1038 [inline]\n__sys_recvfrom+0x1ee/0x2e0
