title: 'Vulnerability in the Oracle Hyperion Profitability and Cost Management product
  of Oracle Hyperion (component: Deployment).   The supported version that is affected
  is 11.2.25.0.000. Easily exploitable vulnerability allows low privileged attacker
  with network access via HTTP to compromise Oracle Hyperion Profitability and Cost
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  access to critical data or complete access to all Oracle Hyperion Profitability
  and Cost Management accessible data and unauthorized ability to cause a partial
  denial of service (partial DOS) of Oracle Hyperion Profitability and Cost Management.
  CVSS 3.1 Base Score 7.1 (Confidentiality and Availability impacts).  CVSS Vector:
  (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L).'
