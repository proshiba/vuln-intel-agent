title: llama.cpp before b8585 contains a use-after-free vulnerability in the RPC
  server's GRAPH_RECOMPUTE handler that allows unauthenticated remote attackers 
  to achieve arbitrary read and write access by storing a computation graph, 
  freeing referenced buffers, and reclaiming freed memory with 
  attacker-controlled content. Attackers can send RPC requests to trigger 
  re-execution of stored graphs with dangling pointers, enabling full remote 
  code execution without requiring authentication or user interaction.
