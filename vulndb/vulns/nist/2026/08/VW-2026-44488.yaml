title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  ensure inner headers in ICMP errors are in headroom\n\nSashiko points out that after
  stripping the outer headers\nwith pskb_pull() we should ensure the inner IP headers\n\
  in ICMP errors from tunnels are present in the skb headroom\nfor functions like
  ipv4_update_pmtu(), icmp_send() and\nIP_VS_DBG().\n\nAlso, add more checks for the
  length of the inner headers."
