title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: Fix NULL pointer dereference in mt7996_init_tx_queues()\n\nWhen MT76_NPU
  and CONFIG_NET_MEDIATEK_SOC_WED are enabled and\nmt76 detects properly the Airoha
  NPU SoC, mt7996_init_tx_queues() will\ndereference a NULL WED pointer.\nFix the
  issue by always passing the WED pointer from mt7996_dma_init()."
