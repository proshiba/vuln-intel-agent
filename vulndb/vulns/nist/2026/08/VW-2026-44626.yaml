title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fail policy unpack on accept2 allocation failure\n\nunpack_pdb() may need to allocate
  a missing ACCEPT2 table for older policy\ndata. If that allocation failed, it set
  an error message but jumped to the\nsuccess path, returning a policydb with the
  required table missing.\n\nReturn -ENOMEM through the normal failure path when the
  ACCEPT2 allocation\nfails. Remove the now-unused out label."
