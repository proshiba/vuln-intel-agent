title: A flaw was found in GStreamer gst-plugins-good (avidemux). In 
  gst_avi_demux_riff_parse_vprp(), the number of available 
  gst_riff_vprp_video_field_desc entries is calculated by dividing the remaining
  buffer size by the attacker-controlled vprp->fields value, rather than by 
  sizeof(gst_riff_vprp_video_field_desc). This can cause the parser to treat 
  more field descriptors as available than fit in the input buffer, resulting in
  out-of-bounds reads. Processing a crafted AVI via playbin/decodebin can crash 
  the application (denial of service). Fixed upstream in gst-plugins-good 1.28.6
  (GStreamer-SA-2026-0072).
