title: TarsWeb decides whether a request comes from a trusted local caller using
  a client-controlled header. app.js sets Koa's proxy option to true without 
  naming which upstream proxies may be trusted and without limiting the number 
  of forwarded hops, so the request address Koa reports is taken from the 
  X-Forwarded-For header supplied by the caller. In midware/ssoMidware.js a 
  single branch covers both the ignored-path list and the ignoreIps allowlist 
  from config/loginConf.js, which contains the loopback address, and that branch
  assigns the effective account identity from the uid query parameter before 
  falling through to the request without validating any ticket, cookie or 
  password. A request carrying a forged X-Forwarded-For value naming the 
  loopback address and a uid naming an existing account therefore reaches every 
  route the console mounts as that account, including an administrator, with no 
