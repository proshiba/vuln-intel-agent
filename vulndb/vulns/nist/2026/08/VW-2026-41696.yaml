title: A flaw was found in Data Science Pipelines. A restricted user, or tenant,
  can exploit an improper authorization vulnerability in the 
  setDefaultServiceAccount function. By specifying a more privileged 
  ServiceAccount (SA) during a CreateRun request, an attacker can bypass 
  authorization checks. This allows the tenant to run their containers with 
  elevated privileges, potentially leading to the disclosure of sensitive 
  information (secrets) and the ability to execute commands within other users' 
  pods.
