title: "In the Linux kernel, the following vulnerability has been resolved:\n\nphylib:
  fix potential use-after-free\n\nCommit bafbdd527d56 (\"phylib: Add device reset
  GPIO support\") added call\nto phy_device_reset(phydev) after the put_device() call
  in phy_detach().\n\nThe comment before the put_device() call says that the phydev
  might go\naway with put_device().\n\nFix potential use-after-free by calling phy_device_reset()
  before\nput_device()."
