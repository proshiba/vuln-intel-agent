title: WWBN AVideo through commit 9c39d8c8b4c1f75540788d6b391740852ceb0732 
  contains an authorization bypass vulnerability in the Users_affiliations 
  add.json.php endpoint that allows authenticated users to forge two-party 
  consent records by supplying the counterparty's agreement timestamp. Attackers
  can create a forged affiliation with status='a' and then reassign video 
  ownership to arbitrary users through the videoAddNew.json.php endpoint, which 
  trusts the forged affiliation as an authorization term.
