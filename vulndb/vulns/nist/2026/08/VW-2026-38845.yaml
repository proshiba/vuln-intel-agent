title: "The OCPP 1.6 client in subsys/net/lib/ocpp parsed inbound WAMP RPC frames
  in parse_rpc_msg() (subsys/net/lib/ocpp/ocpp_j.c) using a hand-rolled helper, extract_string_field(),
  that copied the message's uid and action fields with strncpy(out_buf, token + 1,
  outlen - 1) and then scanned the result with strchr(out_buf, '\"'). Because strncpy
  does not NUL-terminate the destination when the source is at least outlen - 1 (127)
  bytes long, the subsequent strchr reads past the 128-byte destination buffer into
  adjacent stack memory; if a \" byte is found beyond the buffer, a one-byte out-of-bounds
  NUL write also occurs. A related defect in extract_payload() runs strchr/strrchr
  over the receive buffer, which may not be NUL-terminated when a maximal-length frame
  fills it.\n\nThe parsed bytes come directly from the OCPP central-system server
  over a websocket: the reader thread fills recv_buf via websocket_recv_msg() and
