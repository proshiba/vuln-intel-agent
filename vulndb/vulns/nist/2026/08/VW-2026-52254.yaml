title: 'A security flaw has been discovered in vidIQ Vision for YouTube Extension
  3.199.0 on Chrome. The affected element is the function window.addEventListener
  of the component postMessage Handler. Performing a manipulation of the argument
  vidiqEvent results in information disclosure. The attack is possible to be carried
  out remotely. The exploit has been released to the public and may be used for attacks.
  The vendor explains: "At this time, vidIQ does not accept security vulnerability
  submissions, and we do not have a bug bounty program in place."'
