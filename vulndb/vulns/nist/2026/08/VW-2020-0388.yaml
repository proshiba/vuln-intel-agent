title: "A Denial Of Service vulnerability exists when Connected User Experiences and
  Telemetry Service fails to validate certain function values.\nAn attacker who successfully
  exploited this vulnerability could deny dependent security feature functionality.\n\
  To exploit this vulnerability, an attacker would have to log on to an affected system
  and run a specially crafted application.\nThe security update addresses the vulnerability
  by  correcting how the Connected User Experiences and Telemetry Service validates
  certain function values."
