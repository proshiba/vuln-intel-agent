title: OPNsense before 26.1.9 contains a stored cross-site scripting 
  vulnerability that allows authenticated attackers with firewall rule 
  management privileges to inject arbitrary HTML or JavaScript by embedding 
  payloads in the firewall rule description field via the filter API endpoint. 
  The unsanitized description value is persisted and later rendered through the 
  default cell formatter in opnsense_bootgrid.js, which assigns raw cell content
  to innerHTML, causing injected scripts to execute in the browser of any 
  authenticated user who views the Firewall Rules page, enabling session 
  hijacking or credential theft.
