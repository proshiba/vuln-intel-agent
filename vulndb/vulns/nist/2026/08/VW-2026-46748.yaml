title: 'Vulnerability in the Oracle Hyperion Financial Reporting product of Oracle
  Hyperion (component: Server).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows unauthenticated attacker with network
  access via HTTP to compromise Oracle Hyperion Financial Reporting.  Successful attacks
  require human interaction from a person other than the attacker. Successful attacks
  of this vulnerability can result in  unauthorized access to critical data or complete
  access to all Oracle Hyperion Financial Reporting accessible data as well as  unauthorized
  update, insert or delete access to some of Oracle Hyperion Financial Reporting accessible
  data. CVSS 3.1 Base Score 5.9 (Confidentiality and Integrity impacts).  CVSS Vector:
  (CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:L/A:N).'
