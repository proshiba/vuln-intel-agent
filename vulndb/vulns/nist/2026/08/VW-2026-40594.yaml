title: "Tobit Laboratories AG TeamDavid's Webbox application is vulnerable to HTTP
  header injection through the \n“cType” URL parameter, which allows arbitrary modification
  of the \nContent-Type header in HTTP responses. Because the parameter does not \n\
  properly restrict control characters such as URL-encoded newlines \n(“%0a”) or colons,
  attackers can inject additional headers including \nextra Location headers into
  the server’s response. This results e.g. in \nan open redirect vulnerability. This
  issue affects TeamDavid through Rollout 524."
