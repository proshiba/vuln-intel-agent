title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  avoid heap allocation for free-cluster readahead state\n\nget_nr_free_clusters()
  allocates a temporary file_ra_state before it\npublishes the precomputed free cluster
  count, sets NVolFreeClusterKnown(),\nand wakes vol->free_waitq. If that allocation
  fails, the worker returns\nwithout setting the flag or waking waiters, so callers
  waiting for the free\ncount can block indefinitely.\n\nThe readahead state is only
  used synchronously while scanning the bitmap.\nKeep it on the stack and pass it
  by address to the readahead helper. This\neliminates the early allocation failure
  path instead of adding a special\ncase that publishes a conservative count and wakes
  the waitqueue.\nZero-initialize the on-stack state because file_ra_state_init()
  only sets\nra_pages and prev_pos.\n\nApply the same treatment to __get_nr_free_mft_records(),
  which scans the\nMFT bitmap with the same short-lived readahead state."
