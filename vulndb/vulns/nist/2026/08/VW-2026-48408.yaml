title: Checkmate is an open-source, self-hosted tool designed to track and 
  monitor server hardware, uptime, response times, and incidents in real-time 
  with beautiful visualizations. From 3.3.0 until 3.9.2, enabling the global 
  showURL setting causes the unauthenticated GET /api/v1/status-page/:url 
  endpoint to return complete monitor objects from 
  server/src/controllers/statusPageController.ts. The response includes the 
  secret field used by HttpProvider.ts as an HTTP Authorization credential, even
  though BaseStatusPage.tsx does not display that value, allowing visitors to 
  extract credentials from the JSON response and use them against monitored 
  services. This issue is fixed in version 3.9.2.
