title: A vulnerability was identified in Inbox Foundry ActiveInbox Extension up 
  to 7.10.24 on Chrome. Impacted is an unknown function of the file 
  dist/service-worker.production-esm.js of the component Google OAuth Client 
  Secret. Such manipulation leads to hard-coded credentials. The attack can be 
  executed remotely. The exploit is publicly available and might be used. The 
  vendor was informed beforehand about the issue. The support explains, that 
  "[a]t the moment, the [bug bounty] programme is on hold while we work through 
  a large number of existing reports."
