title: "The NASA-AMMOS Asynchronous Network Management System (ANMS) reference implementation's
  default docker-compose.yml publishes the amp-manager service's REST API directly
  to the host network interface (port 8089, e.g. \":8089/tcp\") with cap_add: NET_ADMIN,
  NET_RAW, SYS_NICE, bypassing the CAM (Configuration and Access Manager) gateway
  that is otherwise the system's sole authentication boundary."
