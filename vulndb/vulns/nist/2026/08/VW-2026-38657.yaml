title: The AI Engine – The Chatbot, AI Framework & MCP for WordPress plugin for 
  WordPress is vulnerable to Cross-Site Request Forgery in all versions up to, 
  and including, 3.6.5 This is due to missing or incorrect nonce validation on 
  the reauth_for_authorize function. This makes it possible for unauthenticated 
  attackers to create new administrator accounts with attacker-supplied 
  credentials via a CSRF-based REST authentication bypass, granted they can 
  trick a site administrator into performing an action such as clicking on a 
  link. This bypass can be combined with WordPress's ?_method=POST 
  method-override support to convert a top-navigation GET request into an 
  authenticated POST to the REST users endpoint, requiring no existing account 
  on the attacker's part.
