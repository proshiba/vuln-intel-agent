title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  saa7134: Fix a possible memory leak in saa7134_video_init1\n\nIn saa7134_video_init1(),
  the return value of the first\nsaa7134_pgtable_alloc() is not checked. If it fails,
  the function\ncontinues as if successful, leaving the driver with an invalid page\n\
  table. Additionally, if vb2_queue_init() for the VBI queue fails after\nthe video
  queue page table has been allocated, the allocated memory is\nnot freed before returning.
  The second saa7134_pgtable_alloc() also\nlacks a return value check. Errors occur
  during device probing before\nthe device is fully registered, the normal cleanup
  path in\nsaa7134_finidev() is not executed, leading to memory leaks and\npotential
  use of uninitialized DMA resources.\n\nCheck the return value of both saa7134_pgtable_alloc()
  calls and\npropagate errors. On failure of any later step, free allocated page\n\
  tables to avoid memory leaks. Ensure control handlers are also\nreleased on error
  to prevent "
