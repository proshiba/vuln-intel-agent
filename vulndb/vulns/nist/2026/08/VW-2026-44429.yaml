title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  mediatek: mt8192: Check runtime resume during probe\n\nThe MT8192 AFE probe enables
  runtime PM temporarily while reinitializing\nthe regmap cache from hardware, but
  it uses pm_runtime_get_sync()\nwithout checking the return value. If runtime resume
  fails, probe keeps\ngoing without the device necessarily being accessible, and\n\
  pm_runtime_get_sync() may leave the PM usage count incremented.\n\nThe regmap_reinit_cache()
  failure path also returns before dropping the\ntemporary PM reference and before
  clearing pm_runtime_bypass_reg_ctl.\n\nUse pm_runtime_resume_and_get() so resume
  failures do not leak a usage\ncount, and clear the temporary bypass flag after dropping
  the probe PM\nreference on all regmap_reinit_cache() outcomes."
