title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix afs_edit_dir_remove() to get, not find, block 0\n\nFix afs_edit_dir_remove()
  to use afs_dir_get_block() to get block 0 rather\nthan afs_dir_find_block() as the
  latter caches the found block in the\nafs_dir_iter and may[*] switch out the page
  it's on if another\nafs_dir_find_block() is done.  This parallels what afs_edit_dir_add()
  does.\n\n[*] There's more than one block per page."
