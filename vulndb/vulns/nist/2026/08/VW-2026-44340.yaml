title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  slram: remove failed entries from the device list\n\nregister_device() links a new
  slram_mtdlist entry before allocating all\nof the state needed by the entry. If
  a later allocation, memremap(), or\nmtd_device_register() fails, the partially initialized
  entry remains on\nthe global list. A later cleanup can then dereference or free
  invalid\nstate from that failed entry.\n\nUnwind the partially initialized entry
  and clear the list tail on each\nfailure path after the entry has been linked."
