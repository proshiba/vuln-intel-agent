title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  mm: Fix out-of-bounds page-table walk during memory hot-remove\n\nremove_pud_mapping()
  and remove_p4d_mapping() obtain a child table base\nwith pud_offset(p4dp, 0) and
  p4d_offset(pgd, 0), then add the index for\naddr.\n\nRISC-V folds page-table levels
  at runtime. When a level is folded, its\noffset helper returns the parent entry
  itself, but the index can still be\nnonzero. Adding it walks past the parent table.
  Sv48 folds P4D, while Sv39\nfolds both P4D and PUD, so memory hot-remove can descend
  into unrelated\nmemory and pass an invalid page to __free_pages(). This can trigger:\n\
  \n  kernel BUG at include/linux/mm.h:1810!\n  VM_BUG_ON_PAGE(page_ref_count(page)
  == 0)\n  arch_remove_memory+0x1e/0x5c\n  try_remove_memory+0x15e/0x200\n  remove_memory+0x24/0x3c\n\
  \nOnly add the index when the corresponding page-table level is enabled,\nmatching
  p4d_offset() and pud_offset()."
