title: rclone before v1.75.0 contains a denial of service vulnerability in the 
  WebDAV TUS creation handler that dereferences a nil response before checking 
  for transport errors. A malicious or compromised configured endpoint can reset
  connections during TUS uploads to trigger a panic that terminates unrecovered 
  goroutines and halts unrelated work in long-lived processes.
