title: In Eclipse Milo versions 1.0.0 through 1.1.4, `OpcUaServerConfig.copy()` 
  fails to preserve a configured `RoleMapper`. On servers that rely on role 
  permissions and construct the running configuration through `copy()`, sessions
  receive no role IDs and the default access controller skips role-permission 
  checks, allowing an anonymous client where anonymous sessions are permitted to
  read role-permission metadata, invoke protected methods, or delete protected 
  nodes.
