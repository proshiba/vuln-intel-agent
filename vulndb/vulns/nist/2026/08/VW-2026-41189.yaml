title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  challenge ACK for non-exact RST in SYN-RECEIVED\n\nThe SYN-RECEIVED request-socket
  path in tcp_check_req() accepts an\nin-window RST without requiring SEG.SEQ to exactly
  match RCV.NXT.  A\nnon-exact RST therefore removes the request instead of eliciting
  a\nchallenge ACK.\n\nRFC 9293 section 3.10.7.4 applies the RFC 5961 reset check
  in\nSYN-RECEIVED: an exact RST resets the connection, while a non-exact\nin-window
  RST must trigger a challenge ACK and be dropped.\n\nApply that check before the
  ACK-field validation, following the RFC\nsequence-number, RST, then ACK processing
  order.  Factor the per-netns\nchallenge ACK quota out of tcp_send_challenge_ack()
  so request sockets\ncan share it.  Use the request socket's send_ack() callback
  and its own\nout-of-window ACK timestamp to send and rate-limit the response."
