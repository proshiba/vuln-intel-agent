title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix use-after-free of fp->owner.name in durable handle owner check\n\nTwo concurrent
  SMB2 durable reconnects (DH2C/DHnC) on the same\npersistent_id race the fp->owner.name
  compare-read in\nksmbd_vfs_compare_durable_owner() against the kfree() in\nksmbd_reopen_durable_fd()'s
  reopen-success path. fp->owner.name is a\nstandalone kstrdup() buffer whose lifetime
  is independent of the fp\nrefcount, and the two sites share no lock: the compare
  reads the buffer\nwhile the reopen frees it, so the strcmp() can dereference freed
  memory.\n\nCommit 7ce4fc40018d (\"ksmbd: fix durable reconnect double-bind race
  in\nksmbd_reopen_durable_fd\") made the fp->conn claim atomic under\nglobal_ft.lock
  (closing the owner.name double-free and the ksmbd_file\nwrite-UAF), but the compare-read
  versus reopen-free pair was left\nunserialized.\n\n  BUG: KASAN: slab-use-after-free
  in strcmp+0x2c/0x80\n  Read of size 1 by task kworker\n    strcmp\n    ksmbd_vfs_co"
