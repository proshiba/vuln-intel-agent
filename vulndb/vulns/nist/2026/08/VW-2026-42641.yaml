title: An issue in MongoDB Server's geospatial validation could allow an 
  authenticated user with write privileges to cause an internal reference to be 
  used after the underlying memory has been freed, through concurrent operations
  against a collection using a certain type of validator. This could result in a
  server crash, leading to a denial of service.
