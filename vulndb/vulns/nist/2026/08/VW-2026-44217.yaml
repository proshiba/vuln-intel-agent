title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  ca8210: fix cas_ctl leak on spi_async failure\n\nca8210_spi_transfer() allocates
  cas_ctl with kzalloc_obj(GFP_ATOMIC)\nand relies entirely on the SPI completion
  callback\nca8210_spi_transfer_complete() to free it.\n\nThe spi_async() API only
  invokes the completion callback on successful\nsubmission.  On failure it returns
  a negative error code without ever\nqueuing the callback, which leaves cas_ctl and
  its embedded spi_message\nand spi_transfer orphaned.  Every kfree(cas_ctl) in the
  driver is\ninside the completion callback, so there is no other reclamation path.\n\
  \nca8210_spi_transfer() is called from ca8210_spi_exchange(), the\ninterrupt handler
  ca8210_interrupt_handler(), and from the retry path\ninside the completion callback
  itself.  The exchange and interrupt\nhandler paths loop on -EBUSY, so under sustained
  SPI bus contention\nevery retry iteration leaks a fresh cas_ctl (~600 bytes per\n\
  occurrence).\n\nFix it by free"
