title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix bo->pin leaking in amdgpu_bo_create_reserved\n\namdgpu_bo_create_reserved()
  only allocates a new BO when\n*bo_ptr (struct amdgpu_bo **bo_ptr as input parameter)
  is\nNULL, it simply skips creation when *bo_ptr is non-NULL.\nBut it unconditionally
  reserves, pins, gart allocates\nand maps the BO afterwards.\n\nWhen the same non-NULL
  BO pointer is passed in again,\nfor example firmware buffers that live in adev and
  are\nre-loaded on every resume / cp_resume / start\nunder AMDGPU_FW_LOAD_DIRECT,
  amdgpu_bo_pin() just increases\npin_count unconditionally, however the matching
  teardown only unpins\nonce, so pin_count never drops to zero, so TTM is not able\n\
  to move, swap or evict a BO, causing BO leaks.\n\nThis commit fixes this issue by
  only pinning the bo\nonce at creation, and repeated calls no longer\ntake additional
  pin references.\n\n(cherry picked from commit 3ddc0ae76202c447b6aec61e907b852bc94671cf)"
