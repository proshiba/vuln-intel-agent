title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows high privileged attacker with logon to
  the infrastructure where Oracle Hyperion Financial Management executes to compromise
  Oracle Hyperion Financial Management.  While the vulnerability is in Oracle Hyperion
  Financial Management, attacks may significantly impact additional products (scope
  change).  Successful attacks of this vulnerability can result in takeover of Oracle
  Hyperion Financial Management. CVSS 3.1 Base Score 7.5 (Confidentiality, Integrity
  and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H).'
