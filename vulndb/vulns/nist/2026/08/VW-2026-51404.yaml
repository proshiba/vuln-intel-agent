title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  spacemit: fix NULL check in spacemit_pin_set_config\n\nspacemit_pin_set_config()
  looks up the per-pin descriptor with\nspacemit_get_pin() then checks the wrong variable
  for failure:\n\n\tconst struct spacemit_pin *spin = spacemit_get_pin(pctrl, pin);\n\
  \t...\n\tif (!pin)\n\t\treturn -EINVAL;\n\n\treg = spacemit_pin_to_reg(pctrl, spin->pin);\n\
  \npin is an unsigned int pin id, where 0 (GPIO_0 / gmac0_rxdv on K3) is a\nvalid
  pin, so rejecting it here drops the PAD config write for the first\npin of every
  group. On K3 Pico-ITX the GMAC RGMII group lists pin 0 as\nits first entry, so its
  drive-strength / bias configuration was silently\nignored.\n\nThe intended guard
  is against spacemit_get_pin() returning NULL when the\npin id isn't in the SoC's
  pin table. Check spin instead, which both\nrestores PAD setup for pin 0 and prevents
  a NULL deref on spin->pin."
