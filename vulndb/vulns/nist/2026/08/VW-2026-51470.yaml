title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  do not propagate one-packet flag to synced conns\n\nSynced connections can be created
  before their destination exists. When\nthe destination is later added, ip_vs_bind_dest()
  copies connection flags\nfrom the destination into cp->flags.\n\nIP_VS_CONN_F_ONE_PACKET
  connections are not synced. If a synced\nconnection inherits IP_VS_CONN_F_ONE_PACKET
  while it is already hashed,\nexpiry can treat it as a one-packet connection and
  skip unlinking the\nexisting conn_tab node, leaving stale hash nodes pointing at
  a freed\nstruct ip_vs_conn.\n\nDrop IP_VS_CONN_F_ONE_PACKET from destination flags
  when binding synced\nconnections."
