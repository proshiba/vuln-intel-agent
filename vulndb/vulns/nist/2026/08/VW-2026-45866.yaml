title: "The HTTPPasswordMgr class in the urllib.request module, along with its subclasses
  HTTPPasswordMgrWithDefaultRealm and HTTPPasswordMgrWithPriorAuth, did not take the
  URL scheme into account when matching stored credentials against a requested URL.
  Credentials added for an https:// URL were also used for requests to the same host
  over http://, so an attacker able to redirect or downgrade a client to plain HTTP
  (for example, via an HTTPS-to-HTTP redirect or an on-path position) could capture
  credentials in cleartext. Credentials added for http:// URLs could likewise be sent
  over https://.\n\nCredential matching is now scoped by URL scheme. Credentials registered
  with a URL that includes a scheme are only used for requests with the same scheme.
  Credentials registered with a bare authority (such as example.com or example.com:8080)
  continue to match any scheme, preserving compatibility with existing code, including
  proxy authentication.\n\nUsers who cannot upgrade immediately can mitigate by ens"
