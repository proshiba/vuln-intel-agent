title: Hongjing e-HR contains an unauthenticated SQL injection vulnerability in 
  the getSdutyTree servlet endpoint that allows remote unauthenticated attackers
  to access protected resources by supplying a path traversal sequence in the 
  request URI to bypass the oauthservlet authentication filter. Attackers can 
  inject UNION-based SQL payloads through the unsanitized codeitemid parameter 
  into the underlying Microsoft SQL Server query to retrieve sensitive database 
  contents including user credentials. Exploitation evidence was first observed 
  by the Shadowserver Foundation on 2024-07-30 (UTC).
