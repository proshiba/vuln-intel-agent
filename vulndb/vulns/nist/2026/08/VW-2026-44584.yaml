title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SDCA: Validate written enum value in ge_put_enum_double()\n\nge_put_enum_double()
  passes the user-supplied enumeration index\nitem[0] to snd_soc_enum_item_to_val()
  without checking it against the\nnumber of items in the enum:\n\n\tret = snd_soc_enum_item_to_val(e,
  item[0]);\n\nsnd_soc_enum_item_to_val() indexes the heap-allocated e->values[] array\n\
  with that index (e->values is set from a devm_kcalloc() of e->items\nentries), so
  a control write with an out-of-range item[0] reads past the\nend of the values buffer.\
  \  The bounds check in\nsnd_soc_dapm_put_enum_double() only runs afterwards, so
  it does not\nprevent the read here.\n\nReject an out-of-range item before using
  it, matching the other enum put\nhandlers.\n\nThis issue was pointed out by the
  Sashiko AI review bot while reviewing a\nrelated enum-validation series:\nhttps://lore.kernel.org/all/20260609125735.CEB651F00893@smtp.kernel.org/"
