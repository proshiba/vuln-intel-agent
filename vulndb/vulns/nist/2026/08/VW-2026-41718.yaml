title: ERPNext is a free and open source Enterprise Resource Planning tool. 
  Prior to 15.118.0 and 16.29.0, the validate_template and render_template calls
  in 
  erpnext/accounts/doctype/process_statement_of_accounts/process_statement_of_accounts.py
  render subject, body, and pdf_name fields with unrestricted globals including 
  frappe.utils, allowing an authenticated user with a common operational role to
  inject template expressions, execute arbitrary server-side code, and read data
  across the application. This issue is fixed in versions 15.118.0 and 16.29.0.
