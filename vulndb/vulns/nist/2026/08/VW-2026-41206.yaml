title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  hip04: fix RX buffer leak on build_skb failure\n\nWhen build_skb() fails in hip04_rx_poll(),
  the driver jumps to the\nrefill path without releasing the current RX buffer and
  its DMA mapping.\nInstalling a replacement buffer then overwrites the slot references
  and\nleaks both resources.\n\nKeep the current slot intact and return budget so
  NAPI retries the same\nbuffer.  Also free a newly allocated RX fragment when dma_map_single()\n\
  fails.\n\nThis issue was found by an in-house static analysis tool."
