title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  slip: serialize receive against buffer reallocation\n\nsl_realloc_bufs() replaces
  rbuff and updates buffsize while holding\nsl->lock. slip_receive_buf() reads those
  fields and writes through rbuff\nwithout holding the lock.\n\nAn MTU change can
  therefore race with receive processing. An MTU shrink\ncan expose the new smaller
  rbuff with the old larger bound, causing an\nout-of-bounds write. A receive callback
  which already loaded the old\nrbuff can instead continue writing after that buffer
  has been freed.\n\nSerialize receive processing with sl_realloc_bufs() by holding
  sl->lock\nwhile consuming each receive batch."
