title: "Docker Sandboxes (sbx) applies the read-only intent of a runtime host mount
  to the in-guest container bind only: the underlying virtio-fs host-edge grant is
  added to the sandbox's policy-share allowlist with no access mode. The directory
  stays writable at its shared-export path, so unprivileged code inside the sandbox
  can derive that path and write to a host directory the operator attached read-only."
