title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  Fix xfrm state cache insertion race\n\nThe xfrm input state cache insertion code
  checks the validity of\nthe state before acquiring the global xfrm_state_lock. \
  \ Thus it's\npossible for someone else to kill the state after it passed the\nvalidity
  check, and then the insertion will add the dead state\nto the cache.\n\nFix this
  by moving the validity check inside the lock.\n\nThis entire function is called
  on the input path, where BH must\nbe off (e.g., the caller of this function xfrm_input
  acquires\nits spinlocks without disabling BH).\n\nSo there is no need to disable
  BH here or take the RCU read lock.\nRemove both and replace them with an assertion
  that trips if BH\nis accidentally enabled on some future calling path."
