title: "Heimdall Data Database Proxy uploadJar Directory Traversal Remote Code Execution
  Vulnerability. This vulnerability allows remote attackers to execute arbitrary code
  on affected installations of Heimdall Data Database Proxy. Authentication is required
  to exploit this vulnerability.\n\nThe specific flaw exists within the uploadJar
  method. The issue results from the lack of proper validation of a user-supplied
  path prior to using it in file operations. An attacker can leverage this vulnerability
  to execute code in the context of root. Was ZDI-CAN-28603."
