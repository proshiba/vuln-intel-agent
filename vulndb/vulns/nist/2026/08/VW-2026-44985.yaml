title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (lm90) Only report alarms if driver is ready\n\nUserspace can read sysfs attributes
  before driver registration is complete,\nimmediately after devm_hwmon_device_register_with_info()
  has been called.\nAt that time, data->hwmon_dev is not yet initialized. This can
  trigger\na NULL pointer access since lm90_update_device() and with it\nlm90_update_alarms_locked()
  will be called. This call schedules\nreport_work and lm90_report_alarms(), which
  passes the still-NULL\ndata->hwmon_dev to hwmon_notify_event() and triggers a NULL
  pointer\ndereference.\n\nFix the problem by only scheduling the report and alert
  workers\ndata->hwmon_dev is set."
