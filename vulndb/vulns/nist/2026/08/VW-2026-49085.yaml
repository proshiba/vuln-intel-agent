title: Multiple DrayTek VigorSwitch models contain a buffer overflow 
  vulnerability in the acl_general_setup Add ACE function. The vulnerability is 
  caused by copying the name field into a fixed-size buffer without length 
  validation. A remote attacker can trigger this vulnerability via crafted 
  input, causing a denial of service or potentially executing arbitrary 
  commands. Exploitation requires valid administrative credentials for the 
  device's web management interface.
