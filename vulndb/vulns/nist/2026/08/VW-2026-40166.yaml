title: OMICRON StationGuard 4.00 contains an improper input validation 
  vulnerability in its IEC 61850 Sampled Values (SV) frame processing. A 
  specially crafted SV frame can cause the affected process to terminate, 
  disrupting alert processing for Sampled Values traffic. The vulnerability does
  not affect overall system availability or the processing of other traffic 
  types, and the process is automatically restarted, and the failure is 
  immediately reported to the user.
