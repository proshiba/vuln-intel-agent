title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  Bound-check xdr_buf_to_bvec() stores before writing\n\nxdr_buf_to_bvec() writes
  a bio_vec into the caller's array before\ntesting whether that slot is in range,
  and the head branch performs\nthe store with no check at all. When the caller's
  budget is exactly\nused up, the next store lands one element past the end of the
  array.\nThe overflow label returns count - 1, which masks the surplus store\nbut
  cannot undo it.\n\nrq_bvec, the array passed by nfsd_vfs_write(), is allocated to\n\
  exactly rq_maxpages entries with no slack. The OOB store can land in\nadjacent slab
  memory; the bv_len and bv_offset fields written there\nare derived from client-supplied
  RPC payload sizes.\n\nMove the in-range check ahead of the store in the head, page-loop,\n\
  and tail branches. With the check at the top of each sequence, count\nis incremented
  only after a successful store, so the overflow label\ncan return count directly."
