title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  improve error handling from ext4_dirhash()\n\nThe ext4_dirhash() will *almost* never
  fail, especially when the hash\ntree feature was first introduced.  However, with
  the addition of\nsupport of encrypted, casefolded file names, that function can
  most\ncertainly fail today.\n\nSo make sure the callers of ext4_dirhash() properly
  check for\nfailures, and reflect the errors back up to their callers."
