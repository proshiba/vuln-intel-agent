title: Apache CXF allows to set a limit on the number of form parameters in a 
  JAX-RS message via the "maxFormParameterCount" configuration option. However, 
  no default limit is set which may lead to denial of service attacks when 
  processing  requests with very large numbers of form parameters. Users are 
  recommended to upgrade to versions 4.2.3 or 4.1.8 or 3.6.12, which fix this 
  issue by using a default limit of 500 parameters.
