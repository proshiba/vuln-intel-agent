title: A security flaw has been discovered in Power Sofware PowerISO 9.3.0.0. 
  Affected by this issue is some unknown functionality in the library 
  C:\Windows\System32\drivers\scdemu.sys of the component Kernel Driver. The 
  manipulation results in improper privilege management. The attack is only 
  possible with local access. The exploit has been released to the public and 
  may be used for attacks. The vendor was contacted early about this disclosure 
  but did not respond in any way.
