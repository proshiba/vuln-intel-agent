title: 'Vulnerability in the Oracle Hyperion Calculation Manager product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows unauthenticated attacker with logon to the
  infrastructure where Oracle Hyperion Calculation Manager executes to compromise
  Oracle Hyperion Calculation Manager.  While the vulnerability is in Oracle Hyperion
  Calculation Manager, attacks may significantly impact additional products (scope
  change).  Successful attacks of this vulnerability can result in  unauthorized access
  to critical data or complete access to all Oracle Hyperion Calculation Manager accessible
  data. CVSS 3.1 Base Score 7.1 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N).'
