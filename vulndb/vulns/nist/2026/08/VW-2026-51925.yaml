title: A security vulnerability has been detected in coppermine-gallery 
  Coppermine Photo Gallery up to 1.6.28. This affects an unknown function of the
  file profile.php of the component edit_profile Endpoint. The manipulation of 
  the argument Biography leads to cross site scripting. The attack can be 
  initiated remotely. The exploit has been disclosed publicly and may be used. 
  Upgrading to version 1.6.29 mitigates this issue. Upgrading the affected 
  component is recommended.
