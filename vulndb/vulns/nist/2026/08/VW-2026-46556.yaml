  (component: Marketing).  Supported versions that are affected are 17.0-26.6. Easily
  exploitable vulnerability allows unauthenticated attacker with network access via
  HTTP to compromise Siebel Apps - Marketing.  Successful attacks of this vulnerability
  can result in  unauthorized access to critical data or complete access to all Siebel
