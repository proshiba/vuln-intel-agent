title: Missing Authorization (CWE-862) in Kibana can lead to information 
  disclosure via Accessing Functionality Not Properly Constrained by ACLs 
  (CAPEC-1). An internal Kibana data retrieval capability used by Elastic Defend
  endpoint response actions did not enforce the Security Solution and endpoint 
  privileges that its user-facing equivalents require, and it retrieved data 
  with elevated internal permissions rather than the permissions of the 
  requesting user. As a result, an authenticated low-privileged Kibana user with
  no Security Solution privileges, endpoint privileges and no Elasticsearch 
  privileges on the underlying data, could read endpoint response action records
  and the corresponding response content returned by managed hosts.
