title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: fix integer overflow in bpf_msg_pop_data() bounds check\n\nstart and len
  are u32, so\n\n\tu64 last = start + len;\n\nevaluates start + len in 32-bit and
  wraps before storing it in last.\nThe bounds check\n\n\tif (start >= offset + l
  || last > msg->sg.size)\n\t\treturn -EINVAL;\n\ncan then be passed with an out-of-range
  start/len, after which the pop\nloop runs off the end of the scatterlist and sk_msg_shift_left()
  calls\nput_page() on the empty msg->sg.end slot:\n\n  Oops: general protection fault,
  probably for non-canonical address\n  0xdffffc0000000001: 0000 [#1] SMP KASAN PTI\n\
  \  KASAN: null-ptr-deref in range [0x0000000000000008-0x000000000000000f]\n  RIP:
  0010:sk_msg_shift_left net/core/filter.c:2957 [inline]\n  RIP: 0010:____bpf_msg_pop_data
  net/core/filter.c:3103 [inline]\n  RIP: 0010:bpf_msg_pop_data+0x753/0x1a10 net/core/filter.c:2984\n\
  \  Call Trace:\n   <TASK>\n   bpf_prog_4cc92c278f4d5d56+0x1b1/0x1e8\n   bpf_prog_run_pin_on"
