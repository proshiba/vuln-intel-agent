title: The WooCommerce Lottery plugin for WordPress is vulnerable to Time-Based 
  SQL Injection via 'orderby' and 'order' GET Parameters in all versions up to, 
  and including, 2.2.9 due to insufficient escaping on the user supplied 
  parameter and lack of sufficient preparation on the existing SQL query. This 
  makes it possible for unauthenticated attackers to append additional SQL 
  queries into already existing queries that can be used to extract sensitive 
  information from the database.
