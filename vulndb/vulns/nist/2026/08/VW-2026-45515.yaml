title: Budibase is an open-source low-code platform. Prior to 3.41.3, POST 
  /api/attachments/:datasourceId/url in packages/server/src/api/routes/static.ts
  and packages/server/src/api/controllers/static/index.ts allows an 
  authenticated published-app user with the BASIC role to supply 
  attacker-controlled bucket and key values and obtain signedUrl and publicUrl 
  values backed by stored S3 datasource credentials. This issue is fixed in 
  version 3.41.3.
