title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  gro: properly validate BIG TCP aggregation criteria\n\nWhen GRO attempts to aggregate
  packets beyond GRO_LEGACY_MAX_SIZE (64KB),\nBIG TCP should only be permitted for
  plain IPv4 TCP and plain IPv6 TCP\n(with sufficient MAC header room to insert the
  temporary HBH jumbo header).\n\nHowever, commit b1a78b9b9886 (\"net: add support
  for ipv4 big tcp\")\nloosened the check in skb_gro_receive(), leading to several
  issues:\n\n1. skb_gro_receive() checked skb_headroom(p) instead of the actual space\n\
  \   before the MAC header (p->mac_header). Because skb_headroom(p) includes\n  \
  \ mac_len, crafted frames (e.g. injected via AF_PACKET) can pass the check\n   with
  p->mac_header < 8 bytes. When ipv6_gro_complete() inserts the\n   temporary HBH
  jumbo header, the memmove() starts before skb->head,\n   causing an out-of-bounds
  write and wrapping skb->mac_header.\n2. It allowed non-IP protocols such as software
  VLAN (ETH_P_8021Q /\n   ETH_P_8021AD) to"
