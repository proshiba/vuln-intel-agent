title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  dce100: skip non-DP stream encoders for DP MST\n\nOn DCE8-class ASICs (e.g. Bonaire),
  the resource pool contains digital\nDIG stream encoders plus one analog DAC encoder.
  When assigning a stream\nencoder for a second DisplayPort MST stream, if the preferred
  digital\nencoder is already acquired, dce100_find_first_free_match_stream_enc_for_link()\n\
  falls back to the first free pool entry. That entry may be the analog\nencoder,
  whose funcs table lacks DP hooks such as dp_set_stream_attribute.\nThe subsequent
  atomic commit then dereferences NULL function pointers in\nlink_set_dpms_on() and
  crashes.\n\nSkip encoders without dp_set_stream_attribute when the stream uses a
  DP\nsignal (including MST). Use dc_is_dp_signal(stream->signal) for the MST\nfallback
  path instead of checking only the link connector signal.\n\nTested on:\n- GPU: AMD
  Radeon R7 260X (Bonaire / DCE8)\n- Board: Supermicro C9X299-PG300\n- Setup: DP MST
  daisy c"
