title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  Avoid calling WARN_ON() on -ENOMEM in cfg802154_switch_netns()\n\nIt's pointless
  to call WARN_ON() in case of an allocation failure in\ndev_change_net_namespace()
  and device_rename(), since it only leads to\nuseless splats caused by deliberate
  fault injections, so avoid it.\n\nFound by Linux Verification Center (linuxtesting.org)
  with Syzkaller."
