title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  fix more places with wrong ipv6 transport offsets\n\nSashiko reports for more incorrect
  IPv6 transport offsets.\n\nThe app code for TCP was assuming IPv4 network header\n\
  even after the ipvsh argument was provided. This can\ncause problems with apps over
  IPv6. As for the only\nofficial app in the kernel tree (FTP) this problem is\nharmless
  because we use Netfilter to mangle the FTP\nports and we do not adjust the TCP seq
  numbers.\n\nAlso, provide correct offset of the ICMPV6 header in\nip_vs_out_icmp_v6()
  for correct checksum checks when\nthe IPv6 packet has extension headers."
