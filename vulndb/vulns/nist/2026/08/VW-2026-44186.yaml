title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  macb: drop in-flight Tx SKBs on close\n\nThe MACB driver has since forever leaked
  the outgoing SKBs that\nhave not yet been marked as completed. They live in queue->tx_skb\n\
  which gets freed without remorse nor checking.\n\nmacb_free_consistent() gets called
  in a few codepaths, but only close will\ntrigger the added expressions. In macb_open()
  and macb_alloc_consistent()\nfailure cases, queues' tx_skb just got allocated and
  are empty."
