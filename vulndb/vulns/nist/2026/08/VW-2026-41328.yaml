title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  fix 32-bit overflow in CWSR total size calculation\n\ntotal_cwsr_size was computed
  in 32-bit before being used as a BO/SVM\nallocation size.\nWith large ctx_save_restore_area_size
  and debug_memory_size\nmultiplied by the XCC count, the product can wrap,\nyielding
  an undersized CWSR save area that firmware later overruns.\n\nPromote total_cwsr_size
  to u64 and use check_add_overflow()/\ncheck_mul_overflow() in both kfd_queue_acquire_buffers()
  and\nkfd_queue_release_buffers().\n\n(cherry picked from commit 319f7e13423ae3f486b9aea82f9ad2d6af0ee608)"
