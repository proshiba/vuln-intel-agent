title: "On the Zephyr ARM port, enabling the hardware FPU (CONFIG_FPU) forces the
  \"Floating point ABI\" choice, which defaults to CONFIG_FP_HARDABI. Both FP_HARDABI
  and FP_SOFTABI permit the compiler to emit hardware FP instructions in any function,
  even code that never uses floating-point types. However, the callee-saved FP registers
  (s16-s31 / d8-d15) are only saved and restored across a context switch when CONFIG_FPU_SHARING
  is enabled (arch/arm/core/cortex_m/swap_helper.S and arch/arm/core/cortex_a_r/swap_helper.S),
  and prior to this fix selecting an ABI did not enable FPU register sharing, which
  defaults off.\n\nIn a build that enables the FPU with the default ABI but leaves
  CONFIG_FPU_SHARING disabled, the kernel preserves no callee-saved FP register state
  across thread switches. The documented precondition for this \"unshared\" mode —
  that only a single thread ever executes FP instructions — is silently violated because
  the compiler may generate FP instructions in every thread.\n\nUnder CONFIG"
