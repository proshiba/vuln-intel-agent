title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  bound get_version reply decode to front len\n\nhandle_get_version_reply() uses msg->front_alloc_len
  as the decode\nboundary for MON_GET_VERSION_REPLY.  That is the size of the reused\n\
  reply buffer, not the number of bytes actually received.\n\nA truncated reply can
  therefore pass ceph_decode_need() and decode the\nsecond u64 from stale tail bytes
  left in the buffer by an earlier\nmessage, causing an uninitialized memory read.\n\
  \nUse msg->front.iov_len as the receive-side decode boundary, matching\nother libceph
  reply handlers and limiting decoding to the bytes that\nwere actually read from
  the wire."
