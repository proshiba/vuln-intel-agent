title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (nct6775-core) Fix number of temperature registers for NCT6116\n\nUnlike NCT6106,
  NCT6116 only has three temperature registers, and with\nit only three temperature
  source and temperature source configuration\nregisters. The register addresses match
  those of NCT6106 and can be\nre-used.\n\nThe code used a separate array to list
  the temperature source registers\nfor NCT6116, but used the size of the NCT6106
  register array to set\nthe number of registers. The NCT6106 register array provides
  six addresses,\nwhile the temperature source register array for NCT6116 only provides
  three\naddresses. This causes a KASAN report.\n\nBUG: KASAN: global-out-of-bounds
  in nct6775_probe+0x936/0x46f0 [nct6775]\nRead of size 2 at addr ffffffffc19561a6
  by task modprobe/954\n...\nCall Trace:\n dump_stack+0x7d/0xa7\n print_address_description.constprop.0+0x1c/0x220\n\
  \ ? __kasan_kmalloc.constprop.0+0xc9/0xd0\n ? __kmalloc_node_track_caller+0x194/0x5b0\n\
  \ ? "
