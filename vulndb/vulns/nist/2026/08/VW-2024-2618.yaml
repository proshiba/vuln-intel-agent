title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Add sk_is_inet and IS_ICSK check in tls_sw_has_ctx_tx/rx\n\nAs the introduction
  of the support for vsock and unix sockets in sockmap,\ntls_sw_has_ctx_tx/rx cannot
  presume the socket passed in must be IS_ICSK.\nvsock and af_unix sockets have vsock_sock
  and unix_sock instead of\ninet_connection_sock. For these sockets, tls_get_ctx may
  return an invalid\npointer and cause page fault in function tls_sw_ctx_rx.\n\nBUG:
  unable to handle page fault for address: 0000000000040030\nWorkqueue: vsock-loopback
  vsock_loopback_work\nRIP: 0010:sk_psock_strp_data_ready+0x23/0x60\nCall Trace:\n\
