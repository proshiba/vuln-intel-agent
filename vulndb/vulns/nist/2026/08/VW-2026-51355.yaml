title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  dat: ensure accessible eth_hdr proto field\n\nWhen batadv_get_vid() accesses the
  proto field of the ethernet header, it\nis not checking if the data itself is accessible.
  The caller is responsible\nfor it. But in contrast to other call sites, batadv_dat_get_vid()
  and its\ncaller didn't make sure this is true. This could have caused an\nout-of-bounds
  access."
