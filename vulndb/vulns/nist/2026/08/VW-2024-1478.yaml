title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  fix incorrect locking in state_change sk callback\n\nWe are not changing anything
  in the TCP connection state so\nwe should not take a write_lock but rather a read
  lock.\n\nThis caused a deadlock when running nvmet-tcp and nvme-tcp\non the same
  system, where state_change callbacks on the\nhost and on the controller side have
  causal relationship\nand made lockdep report on this with blktests:\n\n================================\n\
  WARNING: inconsistent lock state\n5.12.0-rc3 #1 Tainted: G          I\n--------------------------------\n\
  inconsistent {IN-SOFTIRQ-W} -> {SOFTIRQ-ON-R} usage.\nnvme/1324 [HC0[0]:SC0[0]:HE1:SE1]
  takes:\nffff888363151000 (clock-AF_INET){++-?}-{2:2}, at: nvme_tcp_state_change+0x21/0x150
  [nvme_tcp]\n{IN-SOFTIRQ-W} state was registered at:\n  __lock_acquire+0x79b/0x18d0\n\
  \  lock_acquire+0x1ca/0x480\n  _raw_write_lock_bh+0x39/0x80\n  nvmet_tcp_state_change+0x21/0x170
  [nvmet_tcp]\n  tcp_fin+0x2a8/0x780\n  tcp_data_"
