title: Coturn is a free open source implementation of TURN and STUN Server. 
  Prior to 4.17.0, shutdown_client_connection() in src/server/ns_turn_server.c 
  prematurely calls dec_quota() and releases bandwidth accounting during the 
  first-stage close of a mobility-enabled allocation while preserving the 
  allocation, relay socket, session, and mobility ticket, allowing an 
  authenticated client to bypass --user-quota and --total-quota and exhaust 
  relay ports. This issue is fixed in version 4.17.0.
