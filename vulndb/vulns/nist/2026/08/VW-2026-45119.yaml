title: The Forminator Forms – Contact Form, Payment Form & Custom Form Builder 
  plugin for WordPress is vulnerable to Insecure Direct Object Reference in all 
  versions up to, and including, 1.55.0.2 via the 'draft' parameter due to 
  missing validation on a user controlled key. This makes it possible for 
  unauthenticated attackers to enumerate sequential integer entry IDs via the 
  'draft' parameter and read other users' saved draft form data, including 
  names, email addresses, phone numbers, addresses, and free-form message 
  content. This is only exploitable on forms that have the 'Save and Continue' 
  feature enabled.
