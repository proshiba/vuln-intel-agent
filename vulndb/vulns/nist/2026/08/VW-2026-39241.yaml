title: The miniOrange 2FA  WordPress plugin before 6.2.7 does not restrict who 
  can trigger its second-factor configuration OTP send, nor bind the OTP 
  recipient to the enrolling user's own address, allowing a low-privileged user 
  to send one-time-passcode emails to arbitrary recipients and to exhaust the 
  site's metered OTP allowance, preventing legitimate users from receiving their
  second-factor codes.
