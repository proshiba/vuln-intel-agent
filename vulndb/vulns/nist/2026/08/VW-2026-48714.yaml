title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/atm:
  fix slab-out-of-bounds read in vcc_setsockopt()\n\nvcc_setsockopt() contained an
  ineffective optlen check:\n  if (__SO_LEVEL_MATCH(optname, level) && optlen != __SO_SIZE(optname))\n\
  \      return -EINVAL;\n\nIf __SO_LEVEL_MATCH(optname, level) evaluated to false
  (e.g. if the caller\npassed a mismatched level), the length check optlen != __SO_SIZE(optname)\n\
  was short-circuited and bypassed. Execution then fell through to switch(optname),\n\
  calling copy_from_sockptr() assuming optval contained sufficient space.\n\nFurthermore,
  even if level matched, a cgroup BPF setsockopt filter could shrink\noptlen after
  entry. Because copy_from_sockptr() on kernel pointers uses memcpy(),\nthis leads
  to a KASAN slab-out-of-bounds read when optlen is smaller than the\nexpected structure
  size.\n\nFix this by using copy_safe_from_sockptr(), which unconditionally validates\n\
  that optlen is at least the expected size before copying. Also change the lo"
