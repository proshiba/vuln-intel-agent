title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  finish crypto callback cleanup before peer release\n\nCrypto completion callbacks
  hold both key-slot and peer references. The\npeer reference pins the netdev, and
  dropping the last peer reference can\nlet netdev unregistration and module removal
  make progress.\n\nDo not release that peer reference before the callback has finished
  its\nown cleanup. If ovpn_crypto_key_slot_put runs after ovpn_peer_put, it can\n\
  schedule an RCU callback backed by module text after ovpn_cleanup\nrcu_barrier has
  already run. The TX error path also freed the remaining\nskb after ovpn_peer_put,
  leaving callback cleanup outside the peer/netdev\nlifetime window.\n\nRelease the
  key slot and free any remaining skb first, then drop the peer\nreference as the
  last callback action."
