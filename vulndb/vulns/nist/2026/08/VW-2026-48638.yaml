title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvsock/virtio:
  avoid refilling the RX queue after teardown\n\nCommit b917507e5ad9 (\"vsock/virtio:
  stop workers during the .remove()\")\nmade the RX worker jump to its common exit
  when rx_run is clear.  That\nexit still refills the RX queue when the buffer count
  is low, so work\nqueued across virtio_vsock_vqs_del() can add buffers after the
  virtqueues\nhave been deleted.\n\nBUG: KASAN: slab-use-after-free in virtqueue_add_sgs\n\
  Read of size 4 by task kworker/0:1\nWorkqueue: virtio_vsock virtio_transport_rx_work\n\
  Call Trace:\n virtqueue_add_sgs (drivers/virtio/virtio_ring.c:2796)\n virtio_vsock_rx_fill
  (net/vmw_vsock/virtio_transport.c:332)\n virtio_transport_rx_work (net/vmw_vsock/virtio_transport.c:701)\n\
  \ process_one_work (kernel/workqueue.c:3314)\n worker_thread (kernel/workqueue.c:3478)\n\
  \ kthread (kernel/kthread.c:436)\n ret_from_fork (arch/x86/kernel/process.c:158)\n\
  \ ret_from_fork_asm (arch/x86/entry/entry_64.S:245)\n...\nFreed by task 14"
