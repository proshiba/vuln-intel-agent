title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  isotp: use unconditional synchronize_rcu() in isotp_release()\n\nisotp_notify()
  unregisters the (RCU) CAN filters via can_rx_unregister()\nand clears so->bound
  without waiting for a grace period. isotp_release()\nuses so->bound to decide whether
  it needs to call synchronize_rcu()\nbefore cancelling so->rxtimer, so when NETDEV_UNREGISTER
  runs first it\nskips that synchronize_rcu() and can cancel the timer while an\n\
  in-flight isotp_rcv() is still executing and about to re-arm it via\nisotp_send_fc(),
  leading to a use-after-free timer callback on the\nfreed socket.\n\nsakisho-bot
  remarked a problem with rtnl_lock held in isotp_notify(),\ntherefore make isotp_release()
  always call synchronize_rcu() before\ncancelling the timers, regardless of so->bound.
  This still closes the\noriginal race (isotp_notify() clearing so->bound without
  waiting for\nin-flight isotp_rcv() callers before isotp_release() cancels the RX\n\
