title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  don't propagate EXTENT_FLAG_LOGGING to split extent maps\n\nWhen btrfs_drop_extent_map_range()
  splits an extent map, the new split\nmaps inherit the original map's flags through
  a local 'flags' variable.\nCommit f86f7a75e2fb (\"btrfs: use the flags of an extent
  map to identify\nthe compression type\") changed the EXTENT_FLAG_LOGGING clearing
  to\noperate on em->flags instead of that local 'flags' copy, so a split of\nan extent
  map that is currently being logged wrongly inherits\nEXTENT_FLAG_LOGGING.\n\nThe
  flag is then never cleared on the split, and when it is freed while\nstill on the
  inode's modified_extents list (for example by the extent\nmap shrinker) it trips
  the WARN_ON(!list_empty(&em->list)) in\nbtrfs_free_extent_map() and leads to a use-after-free.\n\
  \nClear EXTENT_FLAG_LOGGING from the local 'flags' copy used for the\nsplits and
  only clear EXTENT_FLAG_PINNED from em->flags, restoring the\nbehaviour prior to
  f86f7a75e2fb"
