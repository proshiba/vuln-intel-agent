title: OpenYak is a local-first agent runtime for reliable tool-using models, 
  with a desktop workspace built on top. Prior to version 1.1.3, the OpenYak 
  desktop backend binds an HTTP API to `127.0.0.1:<random port>` (commonly 
  19141) without server-side Origin validation, loopback authentication, or 
  Content-Type enforcement, and with a wildcard CORS policy. Any webpage a user 
  visits while OpenYak is running can issue cross-origin requests to this local 
  server — the browser acts as a proxy into loopback, bypassing OS-level network
  isolation. Chained, this lets a malicious page execute arbitrary shell 
  commands on the host (RCE) via the build agent with 
  `permission_presets.bash=true`, shut down the service, and exfiltrate chat 
  history and account PII — with no user interaction beyond opening the page. 
  Version 1.1.3 patches the issue.
