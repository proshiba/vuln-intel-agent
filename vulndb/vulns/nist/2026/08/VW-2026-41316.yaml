title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix lifetime issue of amdgpu_vm_get_task_info_pasid()\n\nThe vm pointer returned
  from amdgpu_vm_get_vm_from_pasid() is only\nvalid while the lock is still being
  held. Once xa_unlock_irqrestore is\ncalled and returned, the pointer is no longer
  under lock and is subject\nto modification. Since, the caller still dereferences
  vm->task_info in\namdgpu_vm_get_task_info_vm() after the lock is removed, this causes
  a\nuse after unlock problem.\n\nRemove the lifetime issue present in amdgpu_vm_get_task_info_pasid()\n\
  through removing the amdgpu_vm_get_vm_from_pasid() function from\namdgpu_vm.c and
  making the relevant code inline to hold the lock while\nit is still in use.\n\n\
  (cherry picked from commit 9d01579f3f868b333acc901815972685989092c7)"
