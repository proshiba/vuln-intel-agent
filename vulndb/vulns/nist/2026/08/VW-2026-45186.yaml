title: A security vulnerability has been detected in COMFAST CF-N1-S 2.6.0.1. 
  Impacted is the function sub_44A968 of the file 
  /cgi-bin/mbox-config?method=SET&section=ptest_macaddress. Such manipulation of
  the argument macaddress leads to command injection. The attack may be launched
  remotely. The exploit has been disclosed publicly and may be used. The vendor 
  was contacted early about this disclosure but did not respond in any way.
