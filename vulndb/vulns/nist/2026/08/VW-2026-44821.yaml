title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Fix snp_filter_reserved_mem_regions() off-by-one\n\nSashiko notes:\n\n> regarding
  the bounds check in snp_filter_reserved_mem_regions()\n> called via walk_iomem_res_desc():
  does the check\n> if ((range_list->num_elements * 16 + 8) > PAGE_SIZE)\n> allow
  an off-by-one heap buffer overflow?\n>\n> If range_list->num_elements is 255, 255
  * 16 + 8 = 4088, which is <= 4096.\n> Writing range->base (8 bytes) fills 4088-4095,
  but writing range->page_count\n> (4 bytes) would write to 4096-4099, overflowing
  the kzalloc-allocated\n> PAGE_SIZE buffer.\n\nFix this by accounting for the entry
  about to be written to, in addition to\nthe entries that are already allocated."
