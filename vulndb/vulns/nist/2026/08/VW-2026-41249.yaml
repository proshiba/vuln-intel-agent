title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  nsm: pin the module while the device is open\n\nmisc_open() installs a misc driver's
  file operations with fops_get(),\nwhich pins file_operations::owner before replacing
  the file's f_op.  The\nNSM misc device leaves nsm_dev_fops.owner unset, so opening
  /dev/nsm does\nnot take a module reference on the nsm driver.\n\nIf the driver is
  built as a module, an open file descriptor can therefore\nsurvive rmmod of the module
  that provides its ioctl callbacks.  A later\nioctl through that descriptor can call
  into unloaded module text.\n\nSet nsm_dev_fops.owner to THIS_MODULE so the misc
  core holds the module\nwhile any /dev/nsm file descriptor is open, matching the
  lifetime\nexpectation for the installed file operations."
