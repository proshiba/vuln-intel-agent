title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  read le->link under the node lock in tipc_node_link_down()\n\ntipc_node_link_down()
  caches the link pointer before taking n->lock:\n\n\tstruct tipc_link *l = le->link;\t
  \t/* unlocked */\n\n\tif (!l)\n\t\treturn;\n\ttipc_node_write_lock(n);\n\tif (!tipc_link_is_establishing(l))
  {\t/* deref l */\n\t...\n\t\ttipc_link_reset(l);\t\t/* write into l */\n\tif (delete)
  {\n\t\tkfree(l);\n\t\tle->link = NULL;\n\nThe delete=true caller frees that very
  object under n->lock, so the lock\ndoes not protect the cached pointer against it:\n\
  \n - CPU A, delete=false: tipc_rcv() on TIPC_LINK_DOWN_EVT, or the link\n   supervision
  timer via tipc_node_timeout(), reads l unlocked and then\n   dereferences it under
  n->lock;\n - CPU B, delete=true: netlink TIPC_NL_BEARER_DISABLE -> bearer_disable()\n\
  \   -> tipc_node_delete_links() -> tipc_node_link_down(n, bearer_id, true)\n   ->
  kfree(l).\n\nThe link is freed with plain kfree(), not kfree_rcu(), and for UDP
  bearers\ndisable_media() "
