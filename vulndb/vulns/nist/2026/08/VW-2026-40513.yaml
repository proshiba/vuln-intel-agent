title: "AIL Project contains a stored cross-site scripting vulnerability in the translation
  controls displayed for chat messages and forum posts.\n\nThe affected templates
  inserted message and post identifiers directly into inline JavaScript onclick handlers:\n\
  \nonclick=\"translateMessageToPreferredLanguage('{{ message['id'] }}', '{{ mess_id_escape
  }}', this)\"\n\nand:\n\nonclick=\"translatePostToPreferredLanguage('{{ post['id']
  }}', '{{ post_id_escape }}', this)\"\n\nThese values were HTML-template escaped
  but were not safely encoded for use as JavaScript string literals inside an HTML
  attribute. A specially crafted identifier containing quotation marks, escape characters,
  or other JavaScript syntax could therefore terminate the expected string argument
  and inject arbitrary JavaScript into the event handler.\n\nBecause the affected
  values are associated with indexed chat messages or forum posts, a malicious value
