title: Sonatype Nexus Repository 3 did not properly filter internal 
  configuration keys from user-supplied task properties when creating or 
  updating a scheduled task through the administrative UI. An account holding 
  permission to create at least one scheduled task type could supply a crafted 
  property value that caused the system to overwrite the configuration of an 
  unrelated, existing task instead of creating a new one.
