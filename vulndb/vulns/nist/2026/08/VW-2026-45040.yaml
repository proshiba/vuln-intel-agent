title: SiYuan versions before v3.7.4 contain a remote code execution 
  vulnerability in the Template calculation operator, which renders 
  user-authored Go templates and stores output verbatim without sanitization. 
  Attackers can inject malicious HTML and JavaScript into template calculations 
  that execute in the desktop client renderer with Node integration enabled, 
  allowing arbitrary code execution when the database is opened.
