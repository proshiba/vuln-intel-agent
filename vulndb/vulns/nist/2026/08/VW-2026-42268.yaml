title: TypeBot is a chatbot builder tool. Prior to version 3.17.0, Typebot's 
  WhatsApp status forwarding feature stores a workspace-configured webhook 
  forwarding URL and later POSTs WhatsApp marketing/error status events to it 
  from the server. The stored URL is only validated as a generic URL in 
  settings, but the forwarding code uses the raw `ky` instance instead of the 
  repository's SSRF-protected `safeKy` client. A workspace user who can 
  configure WhatsApp settings can therefore make the Typebot server issue HTTP 
  requests to internal services, private-network hosts, localhost, or 
  metadata-style endpoints whenever the public WhatsApp production webhook 
  receives a status payload that should be forwarded. Version 3.17.0 patches the
  issue.
