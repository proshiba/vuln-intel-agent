title: "In the Linux kernel, the following vulnerability has been resolved:\n\npmdomain:
  mediatek: Fix possible nullptr KP in HWV cleanup/on-check\n\nShould probe fail for
  HW_VOTER type power domains, this driver was\nunconditionally trying to perform
  cleanup for DIRECT_CTL domains,\nbut only after checking if the target domain is
  powered on... with\nthe DIRECT_CTL scpsys_domain_is_on() code again.\n\nAnd there's
  more: the scpsys_domain_is_on() function is also being\nunconditionally used in
  the probe path, for any power domain that\nhas flag MTK_SCPD_KEEP_DEFAULT_OFF!\n\
  \nThis bug was never experienced by anyone because the HWV domains\nnever failed
  probe, and because none of those is declared with the\naforementioned flag - but
  it's still something critical.\n\nIn order to fix this, add a check for MTCMOS Type
  and, based on\nthat, call the correct functions for an \"is on\" check, and also\n\
  do the same for the cleanup path, calling the correct functions\nfor the \"power
  off\" action.\n\nFor the latter, since there's a"
