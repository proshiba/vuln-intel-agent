title: A vulnerability in CLI of Cisco Firepower Threat Defense (FTD) Software 
  could allow an authenticated, local attacker to inject XML into the command 
  parser. This vulnerability is due to insufficient input validation. An 
  attacker could exploit this vulnerability by including crafted input in 
  commands. A successful exploit could allow the attacker to inject XML into the
  command parser, which could result in unexpected processing of the command and
  unexpected command output.
