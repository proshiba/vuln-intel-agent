title: "The UpdateHub management subsystem (subsys/mgmt/updatehub/updatehub.c) drives
  every update operation through a single file-scope ctx structure that holds the
  CoAP block context, payload buffer, status code, socket, and a one-element poll-fd
  array fds[1]. Access to ctx was not serialized, and prepare_fds() wrote ctx.fds[ctx.nfds]
  and incremented ctx.nfds with no bounds check.\n\nTwo independent paths mutate ctx
  concurrently: the background autohandler running on the system workqueue, and user-triggered
  operations reached through the updatehub run shell command, direct API calls, or
  — since the operations are exposed as syscalls — userspace threads. When a second
  flow enters prepare_fds() while ctx.nfds is already 1, the write lands one element
  past the array; by struct layout it overlaps the adjacent ctx.sock/ctx.nfds members.
  More broadly, the unsynchronized sharing lets two flows interleave connection setup
  and teardown, double-closing a socket descriptor or scribbling the shared buffer"
