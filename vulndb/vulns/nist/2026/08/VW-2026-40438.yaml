title: llama.cpp builds b1283 through b9058 contain an integer overflow 
  vulnerability in the llama_batch_init() function where unchecked 
  multiplications in malloc() calls can wrap past INT32_MAX when computing 
  allocation sizes. Attackers can pass specially crafted parameters to trigger 
  integer overflow, causing heap corruption and potentially achieving arbitrary 
  code execution through subsequent batch operations that write past allocated 
  buffer boundaries.
