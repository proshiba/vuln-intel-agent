title: "The webhook URL validator in `website/notifications/webhooks.py` uses\n`ip.is_global`
  to reject non-public addresses after DNS resolution. IPv6\ntransition addresses
  (NAT64 `64:ff9b::/96`, 6to4 `2002::/16`, Teredo\n`2001:0000::/32`) are classified
  as globally routable by IANA, so `is_global`\nreturns `True` even when the embedded
  IPv4 targets a private, loopback, or\ncloud metadata destination. An attacker can
  register a webhook pointing at a\nhostname that resolves to a transition address
  to bypass the SSRF guard and\nexfiltrate vulnerability data to an internal endpoint.\n\
  \nThe vulnerability was introduced on a non-release version. The fix was already
  done on HEAD. It only affects\n\norganisation running the HEAD."
