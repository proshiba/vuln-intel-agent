title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  j1939: fix Use-after-Free, hold skb ref while in use\n\nThis patch fixes a Use-after-Free
  found by the syzbot.\n\nThe problem is that a skb is taken from the per-session
  skb queue,\nwithout incrementing the ref count. This leads to a Use-after-Free if\n\
  the skb is taken concurrently from the session queue due to a CTS."
