title: A weakness has been identified in Soarkey StudentManagement and 学生信息管理系统 
  up to e08f7f1d5015af407aa4cca0ada3dea189b4937e. This impacts the function 
  AdminDao.doGet of the file code/src/service/AdminDao.java of the component 
  Administrative Servlet. Executing a manipulation of the argument action can 
  lead to authorization bypass. It is possible to launch the attack remotely. 
  The exploit has been made available to the public and could be used for 
  attacks. The project was informed of the problem early through an issue report
  but has not responded yet.
