title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  detect_link_and_local_sink: DP alt mode timeout path leaks prev_sink reference\n\
  \nprev_sink is unconditionally retained via dc_sink_retain at function\n  entry,
  but the DP alt mode timeout path inside SIGNAL_TYPE_DISPLAY_PORT\n  returns false
  without releasing prev_sink. All other return paths in the\n  function correctly
  call dc_sink_release(prev_sink), making this the only\n  missing cleanup.\n\n(cherry
  picked from commit 45510cf662dcf46b5d8926d454f338809f107b9d)"
