title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  rxrpc_verify_data ensure rx_dec_buffer alloc\n\nrxrpc_recvmsg_data() calls rxrpc_verify_data()
  whenever the\nrxrpc_call.rx_dec_buffer is unallocated and assumes that upon\nsuccessful
  return that rx_dec_buffer must be allocated.\nHowever, rxrpc_verify_data() does
  not request an allocation if\nthe rxrpc_skb_priv.len is zero.\n\nIn addition, failure
  to allocate rx_dec_buffer will result in a\ncall to skb_copy_bits() with a NULL
  destination which can\ntrigger a NULL pointer dereference.\n\nTo prevent these issues
  rxrpc_verify_data() is modified to\nalways attempt to allocate the rxrpc_call.rx_dec_buffer
  if it\nis NULL.\n\nThis issue was identified with assistance of a private\nsashiko
  instance."
