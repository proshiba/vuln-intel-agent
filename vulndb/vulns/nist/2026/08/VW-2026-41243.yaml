title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  make huge_ptep_get handled unaligned addresses\n\nhuge_ptep_get() can be handed
  a virtual address pointing to the middle\nof a contpmd/contpte mapped hugetlb folio
  (examples of callers are\npagemap_hugetlb_range, page_mapped_in_vma).\n\nThe arm64
  helper rewalks the pgtables in find_num_contig to answer\nwhether the huge pte we
  have maps a contpmd or a contpte hugetlb folio,\nand returns CONT_PMDS or CONT_PTES,
  so that it can collect a/d bits over\nthe contiguous ptes. We can falsely return
  CONT_PTES instead of\nCONT_PMDS if the addr is not aligned. On systems where CONT_PTES
  !=\nCONT_PMDS (meaning page size is 16K), we could collect excess A/D bit\nstate,
  meaning extra work for the kernel. Even worse, we may iterate\nbeyond the PTE table
  and dereference a garbage ptep pointer to access\nphysical memory we don't own.
  Since the ptep pointer is a linear map\naddress, we may run off the end of the linear
  map or into a hole,\nderef"
