title: n8n's JavaScript task runner shared a single module cache across all 
  users' Code-node executions. In affected versions (before 1.123.67, 2.31.5, 
  and 2.32.1), a user able to run a Code node could poison a cached module and 
  thereby alter other users' Code-node executions on the same runner, affecting 
  their confidentiality, integrity, or availability. This is a cross-user 
  isolation break within a single n8n instance and does not constitute a sandbox
  escape or remote code execution. Only multi-user instances running the JS task
  runner with built-in or external modules enabled are affected.
