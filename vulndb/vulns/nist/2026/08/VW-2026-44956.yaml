title: "In the Linux kernel, the following vulnerability has been resolved:\n\nqede:
  sync udp_tunnel ports outside qede_lock in the recovery path\n\nA TX timeout on
  a qede NIC that has VXLAN/GENEVE tunnel ports\nconfigured wedges the rtnetlink control
  plane of the whole machine:\n\n  NETDEV WATCHDOG: ens6f1 (qede): transmit queue
  2 timed out 10226 ms\n  [qede_tx_timeout:586(ens6f1)]TX timeout on queue 2!\n  [qede_recovery_handler:2665(ens6f0)]Starting
  a recovery process\n\nThe recovery path deadlocks on the driver's own mutex:\n\n\
  \  qede_sp_task\n   rtnl_lock()\n   mutex_lock(&edev->qede_lock)        <- taken\n\
  \   qede_recovery_handler\n    qede_load\n    udp_tunnel_nic_reset_ntf\n     __udp_tunnel_nic_device_sync\n\
  \      info->sync_table == qede_udp_tunnel_sync\n       mutex_lock(&edev->qede_lock)\
  \    <- same task: deadlock\n\nThe mutex is not recursive, so the kworker blocks
  on itself with\nrtnl_lock held, and neither lock is ever released. Every task that\n\
  calls rtnl_lock() afterwards (ip, ovs-vswitchd, lldpad, IPv6\nad"
