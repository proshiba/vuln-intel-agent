title: A flaw was found in wildfly-core. A remote user authenticated as an 
  administrative user can inject a malformed payload into the Inet Address field
  through the Management Model. This injection causes the server to crash and 
  become unrecoverable, as the payload is written into the standalone.xml 
  configuration file. Manual intervention is required to restore server 
  operation, leading to a denial of service.
