title: The Turnkey bbPress by WeaverTheme plugin for WordPress is vulnerable to 
  PHP Object Injection in all versions up to, and including, 1.7.1 via 
  deserialization of untrusted input in the wvrbbp_set_to_serialized_values() 
  function (reached through the wvrbbp_save_restore() settings-restore handler).
  The function reads the raw contents of an administrator-uploaded file and 
  passes them directly to unserialize() without any validation. This makes it 
  possible for authenticated attackers, with administrator-level access and 
  above, to inject a PHP Object. No known POP chain is present in the vulnerable
  plugin itself; however, if a POP chain is present via an additional plugin or 
  theme installed on the target system, it could allow the attacker to delete 
  arbitrary files, retrieve sensitive data, or execute code.
