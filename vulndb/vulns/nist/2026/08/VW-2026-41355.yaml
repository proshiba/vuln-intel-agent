title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Fix cork use-after-free in tcp_bpf_sendmsg()\n\ntcp_bpf_sendmsg() keeps
  msg_tx across sk_stream_wait_memory(), which\ndrops and reacquires the socket lock.\
  \  Its error path tries to decide\nwhether msg_tx names the local temporary message
  by comparing it with\nthe current value of psock->cork.\n\nThis comparison is unsafe
  when two threads send on the same socket:\n\n  Thread A                        \
  \ Thread B\n  msg_tx = psock->cork\n  sk_msg_alloc() fails\n  sk_stream_wait_memory()\n\
  \    releases the socket lock      acquires the socket lock\n                  \
  \                completes the cork\n                                  psock->cork
  = NULL\n                                  frees the cork\n    reacquires the socket
  lock\n  msg_tx != psock->cork\n  sk_msg_free(msg_tx)\n\nThe stale cork is therefore
  mistaken for the local temporary message\nand freed again.  KASAN reported:\n\n\
  \  BUG: KASAN: slab-use-after-free in sk_msg_fr"
