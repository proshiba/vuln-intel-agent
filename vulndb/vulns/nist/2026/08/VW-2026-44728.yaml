title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio:
  rtc: tear down old virtqueues before restore\n\nvirtio_device_restore() resets the
  device and restores the negotiated\nfeatures before calling ->restore(). viortc_freeze()
  intentionally\nleaves the existing virtqueues in place so the alarm queue can still\n\
  wake the system, but viortc_restore() immediately calls\nviortc_init_vqs() without
  first deleting those old queues.\n\nIf virtqueue reinitialization fails on virtio-pci,
  the transport error\npath can run vp_del_vqs() against a newly allocated vp_dev->vqs
  array\nwhile vdev->vqs still contains the old virtqueues. vp_del_vqs() then\nlooks
  up queue state through the new array and can dereference a NULL\ninfo pointer in
  vp_del_vq(), crashing the guest kernel during restore.\n\nThis can also happen during
  a non-faulty reinitialization, when one of\nthe vp_find_vqs_msix() attempts is unsuccessful
  before a later attempt\nwould succeed.\n\nDelete the stale virtqueues before rebuilding"
