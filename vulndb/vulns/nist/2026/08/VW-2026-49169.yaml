title: "RansomLook exposed complete API keys in the HTML source of the authenticated
  /admin/apikeys administration page. Although the interface displayed only a shortened
  representation of each key, the full token was embedded in hidden form fields used
  by the enable/disable, private-access, and delete actions.\n\n\nAs a result, API
  credentials could be recovered by inspecting the page source or DOM. The credentials
  could also be unintentionally exposed through components that retain or inspect
  HTTP response bodies, such as debugging proxies, browser caches, monitoring systems,
  or other intermediaries. An attacker obtaining one of these tokens could subsequently
  authenticate using the privileges assigned to that key, including access to private
  data where the key was granted such permissions.\n\n\nThe patch removes API keys
  from subsequent page rendering and replaces them with SHA-256-derived opaque handles.
  Administrative actions submit only these handles, which are resolved back to the
  correspondi"
