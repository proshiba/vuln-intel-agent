title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix NULL pointer dereference in bpf_task_from_vpid()\n\nbpf_task_from_vpid() looks
  up a task in the pid namespace of the\ncurrent task, via find_task_by_vpid():\n\n\
  \  find_task_by_vpid(vpid)\n    find_task_by_pid_ns(vpid, task_active_pid_ns(current))\n\
  \      find_pid_ns(nr, ns) -> idr_find(&ns->idr, nr)\n\ncgroup_skb programs run
  in softirq, which may interrupt a task that is\nitself in do_exit(). Once that task
  has passed\nexit_notify() -> release_task() -> __unhash_process(), its thread_pid
  is\ncleared, so task_active_pid_ns(current) returns NULL and find_pid_ns()\ndereferences
  &NULL->idr:\n\n  BUG: kernel NULL pointer dereference, address: 0000000000000050\n\
  \  RIP: 0010:idr_find+0x11/0x30 lib/idr.c:176\n  Call Trace:\n   <IRQ>\n   find_pid_ns
  kernel/pid.c:370 [inline]\n   find_task_by_pid_ns+0x3b/0xe0 kernel/pid.c:485\n \
  \  bpf_task_from_vpid+0x5b/0x200 kernel/bpf/helpers.c:2916\n   bpf_prog_run_array_cg+0x17e/0x530
  kernel/bpf/cgroup.c:"
