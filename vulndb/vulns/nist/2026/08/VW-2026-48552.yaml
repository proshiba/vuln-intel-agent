title: AVideo through commit 9c39d8c8 contains an information exposure 
  vulnerability in feed/index.php that allows unauthenticated attackers to 
  retrieve channel owner email addresses by supplying a public channel name 
  parameter. Attackers can enumerate all creator email addresses by iterating 
  through public channel names and extract them from the itunes:email and 
  itunes:author RSS elements, enabling account takeover attempts and phishing 
  campaigns.
