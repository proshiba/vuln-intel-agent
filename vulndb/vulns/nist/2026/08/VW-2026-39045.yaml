title: OpenWrt luci-app-bmx7 before commit 
  5890760a454dad2cb00389dba2cdc5e779e0ffdd contains a path traversal 
  vulnerability in the bmx7-info CGI script that allows unauthenticated 
  attackers to read files outside the configured runtimeDir. Attackers can 
  supply directory traversal sequences in the query string to escape the 
  intended directory and read sensitive files accessible to the CGI process.
