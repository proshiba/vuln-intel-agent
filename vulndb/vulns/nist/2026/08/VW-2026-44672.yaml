title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix UAF in tipc_l2_send_msg()\n\nSyzbot reported a slab-use-after-free in ipvlan_hard_header()
  when\ncalled from tipc_l2_send_msg().\n\nThe root cause is that tipc_disable_l2_media()
  calls synchronize_net()\nwhile b->media_ptr is still valid. This allows concurrent
  RCU readers\nto obtain the device pointer after synchronize_net() has finished.\n\
  The pointer is cleared later in bearer_disable(), but without any\nsubsequent synchronization,
  allowing the device to be freed while\nstill in use by readers.\n\nFix this by clearing
  b->media_ptr in tipc_disable_l2_media() before\ncalling synchronize_net().\n\nThis
  is safe to do now because the call order in bearer_disable()\nwas reversed in 0d051bf93c06
  (\"tipc: make bearer packet filtering generic\")\nto call tipc_node_delete_links()
  (which needs the pointer) before\ndisable_media().\n\nhttps: //lore.kernel.org/netdev/6a2c1007.428ffe26.258b27.015d.GAE@google.com/T/#u"
