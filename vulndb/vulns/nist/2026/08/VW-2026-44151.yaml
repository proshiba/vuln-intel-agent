  w/ gc_merge mount option, we may suffer below\npotential deadlock:\n\nKworker\t\t
  \t\t\tGC trehad\t\t\tTruncator\n- f2fs_write_cache_pages\n - f2fs_write_single_data_page\n\
  \  - f2fs_do_write_data_page\n   - folio_start_writeback  --- set writeback flag
  on folio\n   - f2fs_outplace_write_data\n   : cached folio in internal bio cache\n\
  \  - f2fs_balance_fs\n   - wake_up(gc_thread)\n   : wake up gc thread to run foreground
  GC\n   - finish_wait(fggc_wq)\n   : wait on the waitqueue --- wait on GC thread
  to finish the work\n\t\t\t\t\t\t\t\t\t- truncate_inode_pages_range\n\t\t\t\t\t\t
  \t\t\t - __filemap_get_folio(, FGP_LOCK)  --- lock folio\n\t\t\t\t\t\t\t\t\t - truncate_inode_partial_folio\n\
  \t\t\t\t\t\t\t\t\t  - folio_wait_writeback            --- wait on writeback being
