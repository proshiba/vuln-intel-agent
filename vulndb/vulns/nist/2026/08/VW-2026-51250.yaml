title: Wazuh is an open-source security platform providing unified XDR and SIEM 
  protection for endpoints and cloud workloads. In versions 4.14.0 through 
  4.14.6, an authenticated low-privilege user can read the cluster secret from 
  the manager configuration because the logic that masks sensitive values is 
  disabled by any update-config RBAC rule, including an explicit deny. The 
  mask_sensitive_config() decorator applies masking only when 
  _has_update_permissions() returns false, but that gate treats a user as able 
  to update the config whenever a  manager:update_config  or 
   cluster:update_config  rule exists, without ever checking whether the rule's 
  effect is allow or deny. Because a deny rule is stored as a real entry, a 
  read-only account that is hardened by explicitly denying config edits is 
  counted as having update permission, which turns masking off. A single 
