title: An insecure direct object reference vulnerability in OpenSignLabs 
  OpenSign through 2.37.0 allows unauthenticated remote attackers to retrieve 
  any contact record via the getcontact Parse cloud function. The function 
  executes with useMasterKey and performs no authentication or authorization 
  checks before returning the requested contact object. An attacker can 
  enumerate and read all contact records including personally identifiable 
  information without credentials.
