title: browser-use web-ui versions 2.0.0 through 3.0.0 fail to validate browser 
  settings paths in run_agent_task, allowing attackers to create directories at 
  arbitrary locations by supplying absolute paths to save_recording_path, 
  save_trace_path, save_agent_history_path, or save_download_path parameters. 
  Attackers can exploit this via the unauthenticated Gradio interface to create 
  directories anywhere the root-running container has write access.
