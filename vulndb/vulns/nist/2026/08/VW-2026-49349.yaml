title: "An improper authentication vulnerability in HiveServer2 SAML bearer-token
  validation in Apache Hive 4.0.0 through 4.2.0 (and later unreleased branches) on
  deployments using HTTP transport with hive.server2.authentication=SAML allows an
  unauthenticated network attacker to authenticate as an arbitrary Hive user and obtain
  an authenticated HiveServer2 session via a forged Authorization: Bearer token sent
  to the /cliservice HTTP endpoint. Users are recommended to upgrade to 4.2.1 version
  that includes the fix for this issue.\n\nAccess / authorization required: No Hive
  credentials, SAML IdP login, or knowledge of the server signing secret is required.
  The attacker only needs network reachability to the HiveServer2 HTTP port (typically
  /cliservice), directly or through a reverse proxy such as Apache Knox that forwards
  unauthenticated requests to HS2. The instance must have SAML authentication enabled
  in HTTP mode. Deployments where Knox handles SSO and HiveServer2 uses LDAP/Kerberos
