title: The Ultimate Member – User Profile, Registration, Login, Member 
  Directory, Content Restriction & Membership Plugin plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via Textarea Profile Field with HTML
  Support (DOM Gadget via id Attribute) in all versions up to, and including, 
  2.12.1 due to insufficient input sanitization and output escaping. This makes 
  it possible for authenticated attackers, with subscriber-level access and 
  above, to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses an injected page. This is possible because the wp_kses 
  'templates' allowlist permits the id attribute on div elements but does not 
  neutralize unescaped quotes within its value; when pickadate.js concatenates 
  the stored id value into an HTML string via jQuery .html() on profile page 
  load, the smuggled onfocus and autofocus attribute syntax breaks out of 
  attribute context and executes as JavaScript.
