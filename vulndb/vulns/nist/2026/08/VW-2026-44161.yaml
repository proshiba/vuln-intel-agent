title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: fix permanently busy scans after multiple roam iterations\n\nIn order for
  the firmware to sleep, the driver has to confirm a\npreviously received sleep request.
  The normal sequence of evets goes\nlike this:\nEVENT_SLEEP -> adapter->ps_state
  = PS_STATE_PRE_SLEEP -> sleep-confirm\n-> SLEEP -> EVENT_AWAKE -> AWAKE.\nBefore
  sending the sleep-confirm command, the driver must make sure\nthere are no commands
  either running or waiting to be completed.\n\nmwifiex_ret_802_11_associate() unconditionally
  sets\nps_state = PS_STATE_AWAKE when it processes the association command\nresponse,
  outside of the normal powersave management flow. If\nEVENT_SLEEP arrives while the
  association command is in flight,\nps_state is PRE_SLEEP when the association command
  response is parsed,\nand the forced AWAKE overwrites it. The deferred sleep-confirm
  is\nnever sent.\n\nA subsequent scan_start command is correctly acknowledged, but
  the\nfirmware do"
