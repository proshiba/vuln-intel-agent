title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: mrp: fix uninitialised bytes on the wire\n\nbr_mrp_alloc_test_skb() builds
  MRP test frames on an skb from\ndev_alloc_skb(), which does not clear the linear
  data area.  On the MRA\nring-role branch the sub-option TLV header is appended with\n\
  \n\tsub_tlv = skb_put(skb, sizeof(*sub_tlv));\n\tsub_tlv->type = BR_MRP_SUB_TLV_HEADER_TEST_AUTO_MGR;\n\
  \nso sub_tlv->length is never written, and the two trailing alignment bytes\nare
  appended with a bare skb_put() that does not clear them either.  The\nneighbouring
  oui and sub_opt regions are explicitly zeroed, so three\nuninitialised bytes are
  left in every MRA MRP_Test frame that goes out.\n\nPut the sub-option TLV header
  and the alignment padding in a single\nskb_put_zero(), which clears both.  The AUTO_MGR
  sub-TLV carries no\npayload, so the zeroed length field is already the value it
  should have."
