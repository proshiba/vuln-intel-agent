title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  mpi3mr: Use number of bits to manage bitmap sizes\n\nTo allocate bitmaps, the mpi3mr
  driver calculates sizes of bitmaps using\nbyte as unit. However, bitmap helper functions
  assume that bitmaps are\nallocated using unsigned long as unit. This gap causes
  memory access beyond\nthe bitmap sizes and results in \"BUG: KASAN: slab-out-of-bounds\"\
  .  The BUG\nwas observed at firmware download to eHBA-9600. Call trace indicated
  that\nthe out-of-bounds access happened in find_first_zero_bit() called from\nmpi3mr_send_event_ack()
  for miroc->evtack_cmds_bitmap.\n\nTo fix the BUG, do not use bytes to manage bitmap
  sizes. Instead, use\nnumber of bits, and call bitmap helper functions which take
  number of bits\nas arguments. For memory allocation, call bitmap_zalloc() instead
  of\nkzalloc() and krealloc(). For memory free, call bitmap_free() instead of\nkfree().
  For zero clear, call bitmap_clear() instead of memset().\n\nRemove three fields
