title: A weakness has been identified in OpenBoxes up to 0.9.2. This 
  vulnerability affects unknown code of the file 
  grails-app/controllers/org/pih/warehouse/RoleInterceptor.groovy of the 
  component Product Supplier Edit Controller. Executing a manipulation can lead 
  to improper authorization. The attack may be performed from remote. The 
  exploit has been made available to the public and could be used for attacks. 
  Upgrading to version 0.9.3 is able to resolve this issue. This patch is called
  f767ac1a5987d4865d9f158c6a967680f8e45468. It is suggested to upgrade the 
  affected component.
