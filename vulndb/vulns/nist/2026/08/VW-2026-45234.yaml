title: SiYuan versions before 3.7.4 contain a cross-site WebSocket hijacking 
  vulnerability in the admin-only /ws/network/proxy endpoint that explicitly 
  disables origin validation by setting CheckOrigin to unconditionally return 
  true. Attackers can craft malicious webpages that establish WebSocket 
  connections to this endpoint and direct the SiYuan kernel process to proxy 
  arbitrary network traffic to attacker-chosen targets, enabling authenticated 
  network pivoting through the victim's machine.
