title: "In the Linux kernel, the following vulnerability has been resolved:\n\nionic:
  fix kernel panic due to multi-buffer handling\n\nCurrently, the ionic_run_xdp()
  doesn't handle multi-buffer packets\nproperly for XDP_TX and XDP_REDIRECT.\nWhen
  a jumbo frame is received, the ionic_run_xdp() first makes xdp\nframe with all necessary
  pages in the rx descriptor.\nAnd if the action is either XDP_TX or XDP_REDIRECT,
  it should unmap\ndma-mapping and reset page pointer to NULL for all pages, not only
  the\nfirst page.\nBut it doesn't for SG pages. So, SG pages unexpectedly will be
  reused.\nIt eventually causes kernel panic.\n\nOops: general protection fault, probably
  for non-canonical address 0x504f4e4dbebc64ff: 0000 [#1] PREEMPT SMP NOPTI\nCPU:
  3 PID: 0 Comm: swapper/3 Not tainted 6.10.0-rc3+ #25\nRIP: 0010:xdp_return_frame+0x42/0x90\n\
  Code: 01 75 12 5b 4c 89 e6 5d 31 c9 41 5c 31 d2 41 5d e9 73 fd ff ff 44 8b 6b 20
  0f b7 43 0a 49 81 ed 68 01 00 00 49 29 c5 49 01 fd <41> 80 7d0\nRSP: 0018:ffff99d00122ce08
  EFLAGS: 0001"
