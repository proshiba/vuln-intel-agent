title: 'Vulnerability in the Siebel CRM Deployment product of Oracle Siebel CRM (component:
  Application Interface).  Supported versions that are affected are 17.0-26.6. Easily
  exploitable vulnerability allows unauthenticated attacker with access to the physical
  communication segment attached to the hardware where the Siebel CRM Deployment executes
  to compromise Siebel CRM Deployment.  Successful attacks of this vulnerability can
  result in  unauthorized creation, deletion or modification access to critical data
  or all Siebel CRM Deployment accessible data as well as  unauthorized access to
  critical data or complete access to all Siebel CRM Deployment accessible data. CVSS
  3.1 Base Score 8.1 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N).'
