title: Dockge validates a stack name only on the write path. In backend/stack.ts
  the allow-list check in validate(), which requires the name to match 
  ^[a-z0-9_-]+$, is reached from save() alone, while the path getter returns 
  path.join(this.server.stacksDir, this.name) and Stack.getStack builds 
  path.join(server.stacksDir, stackName) with no check. The socket handlers in 
  backend/agent-socket-handlers/docker-socket-handler.ts confirm the caller is 
  logged in and that the name is a string, then pass it straight to 
  Stack.getStack, so a name containing traversal sequences resolves outside the 
  managed stacks directory. An authenticated user can therefore read the 
  composeENV and composeYAML values of any directory the server process can 
  reach, which discloses the secrets in that directory's .env or Compose file, 
  and can invoke delete(), which runs docker compose down and then fsAsync.rm on
  the traversed path with recursive and force set, removing that directory. 
  Disclosure is limited to files named .e
