title: 'Trilium Notes is a cross-platform, hierarchical note taking application focused
  on building large personal knowledge bases. Prior to 0.103.0, the #iconClass label
  value is returned raw by getNoteIcon() and inserted without HTML attribute encoding
  into class attributes in apps/client/src/widgets/quick_search.ts and apps/client/src/services/note_autocomplete.ts,
  allowing a stored payload to execute automatically when a victim opens a new tab
  or uses Ctrl+J and, because Electron enables nodeIntegration and disables contextIsolation,
  run operating-system commands as the victim. This issue is fixed in version 0.103.0.'
