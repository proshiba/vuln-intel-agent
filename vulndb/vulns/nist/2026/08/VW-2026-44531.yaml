title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/pt:
  Fix NULL pointer dereference in xe_pt_zap_ptes_entry()\n\nThe page-table walk framework
  may pass a NULL *child pointer for\nunpopulated entries. xe_pt_zap_ptes_entry()
  called container_of(*child)\nbefore checking for NULL, then dereferenced the result,
  causing a crash.\n\nMove the container_of() call after a NULL guard, so the function
  returns\nearly instead of proceeding with an invalid pointer. XE_WARN_ON is kept\n\
  to help root cause the issue, but we now bail instead of crashing the\ndriver.\n\
  \nv2: Comment that triggering XE_WARN_ON is unexpected behavior (Matt Brost)\n\n\
  (cherry picked from commit b9297d19d9df5d4b6c994648570c5dcd1cac68ff)"
