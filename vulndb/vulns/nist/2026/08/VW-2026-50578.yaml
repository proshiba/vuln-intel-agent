title: Static Web Server (SWS) is a production-ready web server suitable for 
  static web files or assets. Through 2.43.0, instances with both basic-auth and
  metrics features enabled process the /metrics endpoint before the basic-auth 
  check in src/handler.rs, allowing an unauthenticated remote attacker to 
  retrieve Prometheus metrics that disclose virtual host names, request volumes,
  error rates, latency distributions, and active connections. This issue is 
  fixed in version 2.44.0.
