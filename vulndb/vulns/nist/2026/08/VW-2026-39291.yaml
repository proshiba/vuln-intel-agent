title: Koha's reports/acquisitions_stats.pl builds its per-cell statistics query
  in sub calculate by interpolating the user-controlled Filter request 
  parameters directly into WHERE fragments covering aqbasket.closedate, 
  aqorders.datereceived, aqbooksellers.name, items.homebranch, items.ccode, 
  biblioitems.itemtype, aqbudgets.budget_code, aqorders.sort1, and 
  aqorders.sort2. The statement is prepared and executed with no bound 
  parameters. An authenticated staff user holding the reports module permission 
  can inject arbitrary SQL and read any table reachable by the Koha database 
  user, including borrowers (password hashes, two-factor secrets, personal 
  data), borrower_password_recovery, api_keys, and sessions.
