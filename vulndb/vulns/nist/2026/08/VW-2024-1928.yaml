title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  mount fails with buffer overflow in strlen\n\nStarting with kernel 5.11 built with
  CONFIG_FORTIFY_SOURCE mouting an\nocfs2 filesystem with either o2cb or pcmk cluster
  stack fails with the\ntrace below.  Problem seems to be that strings for cluster
  stack and\ncluster name are not guaranteed to be null terminated in the disk\nrepresentation,
  while strlcpy assumes that the source string is always\nnull terminated.  This causes
  a read outside of the source string\ntriggering the buffer overflow detection.\n\
  \n  detected buffer overflow in strlen\n  ------------[ cut here ]------------\n\
  \  kernel BUG at lib/string.c:1149!\n  invalid opcode: 0000 [#1] SMP PTI\n  CPU:
  1 PID: 910 Comm: mount.ocfs2 Not tainted 5.14.0-1-amd64 #1\n    Debian 5.14.6-2\n\
  \  RIP: 0010:fortify_panic+0xf/0x11\n  ...\n  Call Trace:\n   ocfs2_initialize_super.isra.0.cold+0xc/0x18
  [ocfs2]\n   ocfs2_fill_super+0x359/0x19b0 [ocfs2]\n   mount_bdev+0x185/0x1b0\n \
  \  legacy_get_"
