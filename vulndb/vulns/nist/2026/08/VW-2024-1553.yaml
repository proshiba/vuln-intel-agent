title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  zero-initialize tc skb extension on allocation\n\nFunction skb_ext_add() doesn't
  initialize created skb extension with any\nvalue and leaves it up to the user. However,
  since extension of type\nTC_SKB_EXT originally contained only single value tc_skb_ext->chain
  its\nusers used to just assign the chain value without setting whole extension\n\
  memory to zero first. This assumption changed when TC_SKB_EXT extension was\nextended
  with additional fields but not all users were updated to\ninitialize the new fields
  which leads to use of uninitialized memory\nafterwards. UBSAN log:\n\n[  778.299821]
  UBSAN: invalid-load in net/openvswitch/flow.c:899:28\n[  778.301495] load of value
  107 is not a valid value for type '_Bool'\n[  778.303215] CPU: 0 PID: 0 Comm: swapper/0
  Not tainted 5.12.0-rc7+ #2\n[  778.304933] Hardware name: QEMU Standard PC (Q35
  + ICH9, 2009), BIOS rel-1.13.0-0-gf21b5a4aeb02-prebuilt.qemu.org 04/01/2014\n[ \
  \ 778.307901] C"
