title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/compaction:
  handle free_pages_prepare() properly in compaction_free()\n\nfree_pages_prepare()
  can fail but compaction_free() does not handle the\nfailure case.  Failed pages
  should not be added back to cc->freepages for\nfuture use, since they can be either
  PageHWPoison or free_page_is_bad()\nand might cause data corruption."
