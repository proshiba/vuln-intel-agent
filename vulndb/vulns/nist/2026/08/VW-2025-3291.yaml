title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  pci_endpoint_test: Free IRQs before removing the device\n\nIn pci_endpoint_test_remove(),
  freeing the IRQs after removing the device\ncreates a small race window for IRQs
  to be received with the test device\nmemory already released, causing the IRQ handler
  to access invalid memory,\nresulting in an oops.\n\nFree the device IRQs before
  removing the device to avoid this issue."
