title: Deskflow is a keyboard and mouse sharing app. Prior to continuous build 
  1.26.0.299, a remote unauthenticated Deskflow server can send kMsgDSetOptions 
  (DSOP) values to ServerProxy::setOptions() in src/lib/client/ServerProxy.cpp 
  so that the value following a modifier option poisons 
  m_modifierTranslationTable, after which ServerProxy::translateKey() or 
  ServerProxy::translateModifierMask() indexes the seven-row s_translationTable 
  or s_masks arrays out of bounds, disclosing four bytes at an attacker-selected
  relative offset or crashing the connected client; an odd option count also 
  causes an out-of-bounds OptionsList read. This issue is fixed in continuous 
  build 1.26.0.299.
