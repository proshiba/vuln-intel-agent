title: A vulnerability has been found in DTStack Taier 1.4.0. Affected is the 
  function MultipartFile.getOriginalFilename of the file UploadController.java 
  of the component Upload Controller. The manipulation of the argument File 
  leads to path traversal. The attack may be initiated remotely. Upgrading to 
  version 1.5.0 is able to address this issue. The identifier of the patch is 
  572773c4315e23e51e30115151cb091749a8d03e. It is advisable to upgrade the 
  affected component.
