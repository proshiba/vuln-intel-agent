title: A server-side request forgery (SSRF) vulnerability was found in 
  galaxy_ng, the Ansible Galaxy server plugin for Pulp. An authenticated user 
  with namespace management permissions can set a namespace avatar URL to an 
  arbitrary address, including internal networks, loopback, or cloud instance 
  metadata endpoints. A background worker fetches that URL without checking the 
  destination, which lets the attacker probe internal services and enumerate 
  reachable IP addresses. The HTTP client is also configured without an overall 
  timeout, so a slow or non-responsive target can pin workers and cause a denial
  of service.
