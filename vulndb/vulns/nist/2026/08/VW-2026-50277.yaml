title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio_ccw:
  Limit the number of channel program segments\n\nThe processing of channel programs,
  and the CCWs within them, is done\nrecursively. As such, there is an arbitrary (but
  not architectural)\nlimit to the number of CCWs that can exist in a single channel
  program.\n\nThe vfio-ccw logic breaks these channel programs into segments whenever\n\
  it encounters a Transfer-In-Channel (TIC) CCW, and the combined number\nof segments
  count towards the global limit. Impose an equivalent limit\nto the number of segments
  until such logic can be made non-recursive."
