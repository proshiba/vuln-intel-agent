title: The MongoSQL Transition Readiness Tool writes database and collection 
  names into its generated CSV reports without neutralizing leading characters 
  that spreadsheet applications treat as formulas. A user with write privileges 
  on the cluster can choose a namespace name that is later evaluated as a 
  formula when an operator opens the generated report in a spreadsheet 
  application, which may result in unintended disclosure of report contents or 
  execution of external content on the operator's workstation. Generating a 
  report for the affected namespace and opening it in a spreadsheet application 
  is required.
