title: Fluent Forms Pro 6.2.7 contains an embedded malicious code vulnerability 
  introduced via a tampered plugin build served through a decommissioned update 
  server. The tampered build introduced a rogue PHP file 
  (libs/class-license-sync.php), loaded via a require_once directive added to 
  fluentformpro.php, that established a backdoor REST API endpoint, dropped 
  persistent PHP files in mu-plugins and uploads directories, installed a 
  passwordless administrator account, and registered scheduled tasks that 
  survived plugin removal.
