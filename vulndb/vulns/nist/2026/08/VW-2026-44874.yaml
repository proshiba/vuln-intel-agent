title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  typec: ucsi: Fix race condition and ordering in port unregistration\n\nA synchronization
  issue exists during port unregistration where pending\npartner work items can race
  against workqueue destruction, leading to\nuse-after-free conditions:\n\n  cros_ec_ucsi
  cros_ec_ucsi.3.auto: error -ETIMEDOUT: PPM init failed\n  BUG: kernel NULL pointer
  dereference, address: 0000000000000000\n  RIP: 0010:__queue_work+0x83/0x4a0\n  Call
  Trace:\n    <IRQ>\n    __cfi_delayed_work_timer_fn+0x10/0x10\n    run_timer_softirq+0x3b6/0xbd0\n\
  \    sched_clock_cpu+0xc/0x110\n    irq_exit_rcu+0x18d/0x330\n    fred_sysvec_apic_timer_interrupt+0x5e/0x80\n\
  \nFix this by ensuring strict ordering and proper serialization during\nteardown:\n\
  \n1. Move ucsi_unregister_partner() to the beginning of the teardown\nsequence and
  protect it under the connector mutex lock.\n2. Ensure all pending partner tasks
  are explicitly flushed and finished\nbefore the workqueue is destroyed"
