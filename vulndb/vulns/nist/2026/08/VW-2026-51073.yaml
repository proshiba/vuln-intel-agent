title: openssl_encrypt before 1.4.9 fails to sanitize the email field of 
  imported identity documents, allowing attackers to inject ANSI escape 
  sequences that forge the fingerprint verification line displayed to users. 
  Attackers can deliver a crafted identity bundle through normal 
  contact-exchange flows or keyserver responses to manipulate terminal output 
  and display a fraudulent fingerprint, bypassing the out-of-band verification 
  mechanism that protects against key substitution attacks.
