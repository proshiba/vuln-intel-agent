title: A flaw was found in wildfly-core. A remote attacker, authenticated as a 
  'deployer' account, can import and deploy a malicious archive file from an 
  untrusted source. This is achieved by leveraging WildFly libraries to craft a 
  Java project that allows an HTTP POST request to upload and deploy the 
  malicious archive. This could lead to further exploitation, such as arbitrary 
  file read vulnerabilities.
