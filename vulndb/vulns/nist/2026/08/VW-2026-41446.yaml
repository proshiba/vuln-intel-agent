title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Handle partially initialized auxiliary devices\n\nbnxt_aux_devices_init() calls
  auxiliary_device_init() before all fields\nused by bnxt_aux_dev_release() are initialized.\
  \  After\nauxiliary_device_init() succeeds, later errors must unwind with\nauxiliary_device_uninit(),
  which invokes the release callback.\n\nThe release callback assumes that aux_priv->id,
  aux_priv->edev,\nedev->net and edev->ulp_tbl are all populated.  If allocation fails\n\
  after auxiliary_device_init(), the release path can otherwise dereference\nor clear
  partially initialized state.\n\nAllocate and attach the bnxt_en_dev and ULP table
  before calling\nauxiliary_device_init(), so the release callback only sees a fully\n\
  initialized auxiliary private object.  If auxiliary_device_init() itself\nfails,
  free those allocations directly because device_initialize() has not\nrun and the
  release callback will not be invoked.\n\nThis issue was found by a static analysis
  c"
