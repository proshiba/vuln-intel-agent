title: The AutoNetTV Relay WordPress plugin before 3.0.14 does not perform any 
  capability or authentication check before setting a WordPress administrator 
  authentication cookie during its scheduled content-synchronization task. On 
  server configurations where the scheduled task executes before the HTTP 
  response is committed, an unauthenticated attacker who triggers the due task 
  can receive the administrator's session cookie and gain administrator access 
  without credentials.
