title: nanoMODBUS through v1.23.0 contains an out-of-bounds write in the Modbus 
  server-side handle_read_file_record() function (FC 0x14, Read File Record) in 
  nanomodbus.c. The function validates that the total request size does not 
  exceed 245 bytes and that each sub-request's record_length is at most 124, but
  it never validates the CUMULATIVE response size across all sub-requests before
  processing them. The accumulator response_data_size is declared as uint8_t and
  is incremented by 2 + record_length*2 for each of up to 35 sub-requests; with 
  35 sub-requests of record_length=124, the cumulative demand is 8750 bytes, 
  which overflows the uint8_t accumulator. A subsequent loop then calls get_n(),
  an internal function with no bounds checking, once per sub-request to obtain a
  pointer into the 260-byte msg.buf receive buffer and advances the internal 
