title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix potential UAF of struct nilfs_sc_info in nilfs_segctor_thread()\n\nThe finalization
  of nilfs_segctor_thread() can race with\nnilfs_segctor_kill_thread() which terminates
  that thread, potentially\ncausing a use-after-free BUG as KASAN detected.\n\nAt
  the end of nilfs_segctor_thread(), it assigns NULL to \"sc_task\" member\nof \"\
  struct nilfs_sc_info\" to indicate the thread has finished, and then\nnotifies nilfs_segctor_kill_thread()
  of this using waitqueue\n\"sc_wait_task\" on the struct nilfs_sc_info.\n\nHowever,
  here, immediately after the NULL assignment to \"sc_task\", it is\npossible that
  nilfs_segctor_kill_thread() will detect it and return to\ncontinue the deallocation,
  freeing the nilfs_sc_info structure before the\nthread does the notification.\n\n\
  This fixes the issue by protecting the NULL assignment to \"sc_task\" and\nits notification,
  with spinlock \"sc_state_lock\" of the struct\nnilfs_sc_info.  Since nilfs_segctor_kill_th"
