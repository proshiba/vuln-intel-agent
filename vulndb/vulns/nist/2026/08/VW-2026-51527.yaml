title: Budibase before 3.41.3 fails to validate app-scoped builder role 
  assignments in the public user create and update endpoints, allowing an 
  authenticated app-scoped builder to grant builder access to unrelated apps. 
  Attackers can submit crafted requests to the user update API with builder.apps
  fields to escalate privileges and gain unauthorized builder access to other 
  applications in the same tenant.
