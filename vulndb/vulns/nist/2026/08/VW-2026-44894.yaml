title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  imx: Cancel hrtimer before clearing slave pointer\n\nIn i2c_imx_unreg_slave(), the
  slave pointer is set to NULL after\ndisabling interrupts.  However, a pending interrupt
  might already\nhave started the hrtimer (i2c_imx_slave_timeout) before the pointer\n\
  was cleared.  If the hrtimer fires after i2c_imx->slave is set to\nNULL, the timer
  callback i2c_imx_slave_finish_op() will call\ni2c_imx_slave_event() with a NULL
  slave pointer, which results in a\nuse-after-free / NULL pointer dereference.\n\n\
  Fix by canceling the hrtimer and waiting for it to complete after\ndisabling interrupts,
  before clearing the slave pointer."
