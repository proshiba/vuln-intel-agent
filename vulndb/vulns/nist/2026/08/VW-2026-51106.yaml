title: A Command Injection vulnerability exists in the bs_SetLimitCli_info 
  function within the libshare.so library of LB-link Router AC2100_AZ3 V1.0.4. 
  This flaw occurs due to insufficient validation and sanitization of 
  user-supplied input before it is passed to a system-level command execution 
  context. An attacker can exploit this vulnerability by injecting specially 
  crafted shell metacharacters or payloads into the vulnerable parameter, 
  resulting in the execution of arbitrary operating system commands.
