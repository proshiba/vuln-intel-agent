title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  avoid combining some incoming suboptions\n\nSome MPTCP suboptions are mutually exclusive
  according to the RFC8684,\nbut also because in different places, the code doesn't
  expect some\ncombinations to be present. That's specially true for suboptions that\n\
  would be present twice, but with different attributes.\n\nThe new restrictions are
  the same as the ones applied on the output\nside, with mptcp_write_options. The
  same rules can be reused with a\nsmall fix: an MP_FASTCLOSE can be used with a DSS
  when the sender picks\nthis option [1], which is not the case on Linux. Here are
  the rules:\n\n  Which options can be used together?\n\n  X: mutually exclusive\n\
  \  O: often used together\n  C: can be used together in some cases\n  P: could be
  used together but we prefer not to (optimisations)\n\n  | Opt: | MPC  | MPJ  | DSS\
  \  | ADD  |  RM  | PRIO | FAIL |  FC  |\n  |------|------|------|------|------|------|------|------|------|\n\
  \  | MPC  |--"
