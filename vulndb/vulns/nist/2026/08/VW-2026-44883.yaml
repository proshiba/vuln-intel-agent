title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/pm:
  fix pptable use-after-free\n\namdgpu_dpm_get_pp_table() returns a pointer to a driver-owned
  power table\nafter dropping adev->pm.mutex. The sysfs path then copies from that
  pointer.\nA concurrent pp_table write can replace and free the allocation during
  the\ncopy, causing a use-after-free.\n\nChange the DPM interface to copy into caller-provided
  storage while the mutex\nis held. Keep the size-only query for attribute discovery
  without exposing\nthe driver-owned pointer.\n\n(cherry picked from commit f6eed7acfd30099ef7baeb6ba45bb59daad80631)"
