title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  uvcvideo: Fix deadlock if uvc_status_stop is called from async_ctrl.work\n\nIf a
  UVC camera has an asynchronous control, uvc_status_stop may be\ncalled from async_ctrl.work:\n\
  \nuvc_ctrl_status_event_work()\n    uvc_ctrl_status_event()\n        uvc_ctrl_clear_handle()\n\
  \t    uvc_pm_put()\n\t        uvc_status_put()\n\t\t    uvc_status_stop()\n\t\t\
  \        cancel_work_sync()\n\nThis will cause a deadlock, since cancel_work_sync
  will wait for\nuvc_ctrl_status_event_work to complete before returning.\n\nFix this
  by returning early from uvc_status_stop if we are currently in\nthe work function.
  flush_status now remains false until uvc_status_start\nis called again, ensuring
  that uvc_ctrl_status_event_work won't resubmit\nthe URB."
