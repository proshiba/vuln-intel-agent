title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: hold conn in hci_connect_big_sync() callback\n\nThere is theoretical UAF
  if the conn is freed while the hci_sync task is\nrunning.\n\nHold refcount to avoid
  that. Handle NULL hcon, return 0 + do nothing to\nmatch the previous behavior."
