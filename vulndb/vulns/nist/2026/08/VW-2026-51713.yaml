title: Hermes Agent 0.16.0 prior to 0.17.0 contains an improper path restriction
  vulnerability that allows attackers who can influence ingested message content
  to overwrite the credential store by bypassing sensitive-path guards that 
  excluded the auth.json file. Attackers can craft malicious messages directing 
  the agent's file-write tooling to overwrite the credential store without 
  triggering any path-based protection, enabling credential tampering or 
  unauthorized access.
