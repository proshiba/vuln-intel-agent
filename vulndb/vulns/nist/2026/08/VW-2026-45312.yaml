title: UpTrain is an open-source platform to evaluate and improve generative AI 
  applications. In version 0.7.1 and prior, the UpTrain backend creates a new 
  default user with a static username, where the username is also used as the 
  default API key. The UpTrain backend also has an open CORS policy. Using these
  two primitives, any website can make a authenticated cross-origin request to 
  the UpTrain instance by providing the default API key in the header 
  `uptrain-access-token`. This issue may allow arbitrary websites to perform 
  privileged operations on the UpTrain instance, as if they were the default 
  logged in user. As of time of publication, no known patches are available.
