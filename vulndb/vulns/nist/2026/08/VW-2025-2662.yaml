title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dsa: Avoid cross-chip syncing of VLAN filtering\n\nChanges to VLAN filtering are
  not applicable to cross-chip\nnotifications.\n\nOn a system like this:\n\n.-----.\
  \   .-----.   .-----.\n| sw1 +---+ sw2 +---+ sw3 |\n'-1-2-'   '-1-2-'   '-1-2-'\n\
  \nBefore this change, upon sw1p1 leaving a bridge, a call to\ndsa_port_vlan_filtering
  would also be made to sw2p1 and sw3p1.\n\nIn this scenario:\n\n.---------.   .-----.\
  \   .-----.\n|   sw1   +---+ sw2 +---+ sw3 |\n'-1-2-3-4-'   '-1-2-'   '-1-2-'\n\n\
  When sw1p4 would leave a bridge, dsa_port_vlan_filtering would be\ncalled for sw2
  and sw3 with a non-existing port - leading to array\nout-of-bounds accesses and
  crashes on mv88e6xxx."
