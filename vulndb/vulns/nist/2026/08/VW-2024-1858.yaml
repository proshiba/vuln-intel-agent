title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  btree remove: assign new_root only when removal succeeds\n\nremove_raw() in dm_btree_remove()
  may fail due to IO read error\n(e.g. read the content of origin block fails during
  shadowing),\nand the value of shadow_spine::root is uninitialized, but\nthe uninitialized
  value is still assign to new_root in the\nend of dm_btree_remove().\n\nFor dm-thin,
  the value of pmd->details_root or pmd->root will become\nan uninitialized value,
  so if trying to read details_info tree again\nout-of-bound memory may occur as showed
  below:\n\n  general protection fault, probably for non-canonical address 0x3fdcb14c8d7520\n\
  \  CPU: 4 PID: 515 Comm: dmsetup Not tainted 5.13.0-rc6\n  Hardware name: QEMU Standard
  PC\n  RIP: 0010:metadata_ll_load_ie+0x14/0x30\n  Call Trace:\n   sm_metadata_count_is_more_than_one+0xb9/0xe0\n\
  \   dm_tm_shadow_block+0x52/0x1c0\n   shadow_step+0x59/0xf0\n   remove_raw+0xb2/0x170\n\
  \   dm_btree_remove+0xf4/0x1c0\n   dm_pool_delete_thin_dev"
