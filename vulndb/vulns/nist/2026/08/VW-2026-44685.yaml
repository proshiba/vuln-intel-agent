title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  clear sock_ops cb flags before force-closing a child socket\n\nA child socket inherits
  the listener's bpf_sock_ops_cb_flags via\nsk_clone_lock(). If its setup fails in
  tcp_v4_syn_recv_sock() /\ntcp_v6_syn_recv_sock(), the child is freed through put_and_exit,
  where\ninet_csk_prepare_forced_close() drops the socket lock and tcp_done() runs\n\
  without it.\n\nIf BPF_SOCK_OPS_STATE_CB_FLAG was inherited, tcp_done() -> tcp_set_state()\n\
  calls tcp_call_bpf(), which expects the lock and trips sock_owned_by_me():\n\n \
  \ WARNING: include/net/sock.h:1799 at tcp_set_state+0x433/0x550\n  RIP: 0010:tcp_set_state+0x433/0x550
  include/net/sock.h:1799\n  Call Trace:\n   <IRQ>\n   tcp_done+0xba/0x250 net/ipv4/tcp.c:5095\n\
