title: phpIPAM before 1.8.2 contains an authentication bypass vulnerability in 
  the REST API that allows unauthenticated attackers to gain full API access by 
  exploiting an insecure object cache keying mechanism. The cache is keyed by 
  lookup value alone without including the searched column, enabling an entry 
  written during an app_id lookup to satisfy a subsequent app_code lookup, 
  allowing attackers to use the numeric database row identifier as an API token 
  to read, write, and delete all IP address management records.
