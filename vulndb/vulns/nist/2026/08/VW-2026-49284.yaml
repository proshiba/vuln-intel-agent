title: A vulnerability was detected in Fdawgs node-poppler up to 9.1.2/10.0.1. 
  The impacted element is the function 
  pdfInfo/pdfToText/pdfToCairo/pdfToPpm/pdfImages/pdfToHtml/pdfToPs/pdfFonts/pdfDetach/pdfAttach/pdfSeparate/pdfUnite
  of the file src/index.js of the component Argument Injection Handler. 
  Performing a manipulation of the argument file_path results in argument 
  injection. The attack may be initiated remotely. The patch is named 
  db6e3f79d3beb20601be7e59669c39811ae3c330. It is recommended to apply a patch 
  to fix this issue.
