title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbus:
  mhi: core: Fix invalid error returning in mhi_queue\n\nmhi_queue returns an error
  when the doorbell is not accessible in\nthe current state. This can happen when
  the device is in non M0\nstate, like M3, and needs to be waken-up prior ringing
  the DB. This\ncase is managed earlier by triggering an asynchronous M3 exit via\n\
  controller resume/suspend callbacks, that in turn will cause M0\ntransition and
  DB update.\n\nSo, since it's not an error but just delaying of doorbell update,
  there\nis no reason to return an error.\n\nThis also fixes a use after free error
  for skb case, indeed a caller\nqueuing skb will try to free the skb if the queueing
  fails, but in\nthat case queueing has been done."
