title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  amdgpu_ttm_gart_bind set gtt bound flag\n\nOtherwise after the GTT bo is released,
  the GTT and gart space is freed\nbut amdgpu_ttm_backend_unbind will not clear the
  gart page table entry\nand leave valid mapping entry pointing to the stale system
  page. Then\nif GPU access the gart address mistakely, it will read undefined value\n\
  instead page fault, harder to debug and reproduce the real issue."
