title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Remove cache tags before disabling ATS\n\nThe current implementation removes cache
  tags after disabling ATS,\nleading to potential memory leaks and kernel crashes.
  Specifically,\nCACHE_TAG_DEVTLB type cache tags may still remain in the list even\n\
  after the domain is freed, causing a use-after-free condition.\n\nThis issue really
  shows up when multiple VFs from different PFs\npassed through to a single user-space
  process via vfio-pci. In such\ncases, the kernel may crash with kernel messages
  like:\n\n BUG: kernel NULL pointer dereference, address: 0000000000000014\n PGD
  19036a067 P4D 1940a3067 PUD 136c9b067 PMD 0\n Oops: Oops: 0000 [#1] PREEMPT SMP
  NOPTI\n CPU: 74 UID: 0 PID: 3183 Comm: testCli Not tainted 6.11.9 #2\n RIP: 0010:cache_tag_flush_range+0x9b/0x250\n\
  \ Call Trace:\n  <TASK>\n  ? __die+0x1f/0x60\n  ? page_fault_oops+0x163/0x590\n\
  \  ? exc_page_fault+0x72/0x190\n  ? asm_exc_page_fault+0x22/0x30\n  ? cache_tag_flush_range+0"
