title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoundwire:
  fix enumeration completion\n\nThe soundwire subsystem uses two completion structures
  that allow\ndrivers to wait for soundwire device to become enumerated on the bus
  and\ninitialised by their drivers, respectively.\n\nThe code implementing the signalling
  is currently broken as it does not\nsignal all current and future waiters and also
  uses the wrong\nreinitialisation function, which can potentially lead to memory\n\
  corruption if there are still waiters on the queue.\n\nNot signalling future waiters
  specifically breaks sound card probe\ndeferrals as codec drivers can not tell that
  the soundwire device is\nalready attached when being reprobed. Some codec runtime
  PM\nimplementations suffer from similar problems as waiting for enumeration\nduring
  resume can also timeout despite the device already having been\nenumerated."
