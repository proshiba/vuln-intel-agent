title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  cancel dqi_sync_work before freeing oinfo\n\nocfs2_global_read_info() will initialize
  and schedule dqi_sync_work at the\nend, if error occurs after successfully reading
  global quota, it will\ntrigger the following warning with CONFIG_DEBUG_OBJECTS_*
  enabled:\n\nODEBUG: free active (active state 0) object: 00000000d8b0ce28 object
  type: timer_list hint: qsync_work_fn+0x0/0x16c\n\nThis reports that there is an
  active delayed work when freeing oinfo in\nerror handling, so cancel dqi_sync_work
  first.  BTW, return status instead\nof -1 when .read_file_info fails."
