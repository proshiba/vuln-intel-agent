title: The AWS Systems Manager Parameter Store and Secrets Manager backends in 
  Apache Airflow's Amazon provider resolved a team-scoped Connection or Variable
  id through the team-agnostic lookup when the team-scoped lookup missed. In a 
  deployment running multi-team mode with either backend, a caller in one team 
  could resolve a secret belonging to another team by supplying an id that 
  spells out that team's namespace, obtaining its credentials in full. No 
  unusual configuration is required beyond enabling multi-team mode and using 
  one of these backends. Users are advised to upgrade to 
  apache-airflow-providers-amazon 9.34.0 or later, which refuses the 
  team-agnostic fall-through for an id that could name a team namespace.
