title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_core: Fix UAF in hci_unregister_dev()\n\nhci_unregister_dev() does not disable
  cmd_timer and ncmd_timer\nbefore the hci_dev structure is freed. If a timeout fires\n\
  during device teardown, the callback dereferences freed memory\n(including the hdev->reset
  function pointer), leading to a\nuse-after-free.\n\nAdd disable_delayed_work_sync()
  calls alongside the existing\ndisable_work_sync() calls to ensure both timers are
  fully\nquiesced before teardown proceeds."
