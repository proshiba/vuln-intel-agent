title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  validate fast symlink target during inode read\n\nocfs2_validate_inode_block() already
  rejects several inconsistent\nself-contained dinodes before they are exposed to
  the rest of the\nfilesystem.  Fast symlinks need the same treatment.\n\nA zero-cluster
  symlink is treated as a fast symlink and later read through\npage_get_link() and
  ocfs2_fast_symlink_read_folio().  That path uses\nstrnlen() on the inline payload
  and then copies len + 1 bytes into the\nfolio.  If a corrupt dinode stores an i_size
  that does not fit the inline\narea or omits the terminating NUL at i_size, that
  copy reads past the end\nof the inode block buffer.\n\nReject zero-cluster symlink
  dinodes whose i_size exceeds the inline\nfast-symlink capacity or whose inline payload
  is not NUL-terminated\nexactly at i_size when the inode block is validated.  This
  keeps malformed\nfast symlinks from reaching the read path.\n\nValidation reproduced
  this kernel report:\nKAS"
