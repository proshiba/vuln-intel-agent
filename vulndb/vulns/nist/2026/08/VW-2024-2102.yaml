title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/pseries:
  Enforce hcall result buffer validity and size\n\nplpar_hcall(), plpar_hcall9(),
  and related functions expect callers to\nprovide valid result buffers of certain
  minimum size. Currently this\nis communicated only through comments in the code
  and the compiler has\nno idea.\n\nFor example, if I write a bug like this:\n\n \
  \ long retbuf[PLPAR_HCALL_BUFSIZE]; // should be PLPAR_HCALL9_BUFSIZE\n  plpar_hcall9(H_ALLOCATE_VAS_WINDOW,
  retbuf, ...);\n\nThis compiles with no diagnostics emitted, but likely results in
  stack\ncorruption at runtime when plpar_hcall9() stores results past the end\nof
  the array. (To be clear this is a contrived example and I have not\nfound a real
  instance yet.)\n\nTo make this class of error less likely, we can use explicitly-sized\n\
  array parameters instead of pointers in the declarations for the hcall\nAPIs. When
  compiled with -Warray-bounds[1], the code above now\nprovokes a diagnostic like
  this:\n\nerro"
