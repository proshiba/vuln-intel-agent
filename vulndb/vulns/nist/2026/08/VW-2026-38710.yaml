title: FreeRDP versions 3.28.0 and earlier contain a heap buffer overflow in the
  server-side RAIL channel handler (rail_server_handle_messages() in 
  channels/rail/server/rail_main.c). When processing a RAIL PDU header, the code
  subtracts RAIL_PDU_HEADER_LENGTH from the peer-controlled orderLength field 
  without first verifying orderLength is at least the header length. For 
  orderLength values 0..3 this causes an unsigned integer underflow to a very 
  large size, which bypasses the Stream_EnsureRemainingCapacity() capacity check
  (due to pointer arithmetic wraparound) and is then passed to 
  WTSVirtualChannelRead(), resulting in an out-of-bounds heap write. A malicious
  or compromised RDP client can exploit this to corrupt the heap and crash the 
  server. Fixed in FreeRDP 3.29.0.
