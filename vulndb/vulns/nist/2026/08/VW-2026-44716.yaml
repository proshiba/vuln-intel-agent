title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix FRMR aging push to queue error flow\n\nAging pools with pinned handles requires
  moving handles from the\nactive queue to a non-empty inactive queue that might fail
  on new page\nallocation, we are currently not handling the fault and leaking any
  mkey\nthat fails the push.\n\nFix by Introducing push_queue_to_queue_locked() that
  fills the\ndestination's partial tail page from the source and then splices the\n\
  remaining source pages onto the destination, performing no allocation.\n\nReplace
  the per-handle move loop in age_pinned_pool() and the\nopen-coded splice in pool_aging_work()
  with calls to the helper.\nAs the helper cannot fail under memory pressure, removing
  a class of\nGFP_ATOMIC allocations under the pool lock and simplifying the error\n\
  flow."
