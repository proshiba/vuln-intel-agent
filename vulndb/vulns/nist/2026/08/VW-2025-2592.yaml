title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: oa_tc6: fix tx skb race condition between reference pointers\n\nThere
  are two skb pointers to manage tx skb's enqueued from n/w stack.\nwaiting_tx_skb
  pointer points to the tx skb which needs to be processed\nand ongoing_tx_skb pointer
  points to the tx skb which is being processed.\n\nSPI thread prepares the tx data
  chunks from the tx skb pointed by the\nongoing_tx_skb pointer. When the tx skb pointed
  by the ongoing_tx_skb is\nprocessed, the tx skb pointed by the waiting_tx_skb is
  assigned to\nongoing_tx_skb and the waiting_tx_skb pointer is assigned with NULL.\n\
  Whenever there is a new tx skb from n/w stack, it will be assigned to\nwaiting_tx_skb
  pointer if it is NULL. Enqueuing and processing of a tx skb\nhandled in two different
  threads.\n\nConsider a scenario where the SPI thread processed an ongoing_tx_skb
  and\nit moves next tx skb from waiting_tx_skb pointer to ongoing_tx_skb pointer\n\
  without doing any NULL check."
