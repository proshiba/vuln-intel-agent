title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  do not update mtu if msg_max is too small in mtu negotiation\n\nWhen doing link
  mtu negotiation, a malicious peer may send Activate msg\nwith a very small mtu,
  e.g. 4 in Shuang's testing, without checking for\nthe minimum mtu, l->mtu will be
  set to 4 in tipc_link_proto_rcv(), then\nn->links[bearer_id].mtu is set to 4294967228,
  which is a overflow of\n'4 - INT_H_SIZE - EMSG_OVERHEAD' in tipc_link_mss().\n\n\
  With tipc_link.mtu = 4, tipc_link_xmit() kept printing the warning:\n\n tipc: Too
  large msg, purging xmit list 1 5 0 40 4!\n tipc: Too large msg, purging xmit list
  1 15 0 60 4!\n\nAnd with tipc_link_entry.mtu 4294967228, a huge skb was allocated
  in\nnamed_distribute(), and when purging it in tipc_link_xmit(), a crash\nwas even
  caused:\n\n  general protection fault, probably for non-canonical address 0x2100001011000dd:
  0000 [#1] PREEMPT SMP PTI\n  CPU: 0 PID: 0 Comm: swapper/0 Kdump: loaded Not tainted
  6.3.0.neta #19\n  RIP: 0010:"
