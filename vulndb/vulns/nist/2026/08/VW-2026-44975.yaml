title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix folio_queue ENOMEM in writeback by adding a mempool\n\nFix the handling of folio_queue
  allocation failure in writeback by adding a\nmempool and passing in gfp_t flags
  to the rolling buffer functions that\nallocate memory, using the mempool if gfp
  != GFP_KERNEL.\n\nThis is then extended upwards and the gfp to be used for a request
  is stored\nin the netfs_io_request struct and is then used for both requests and\n\
  subrequests, eliminating the sleeping loops there.\n\nThe failure caused:\n\n  \
  \  folio != NULL\n    WARNING: fs/netfs/write_issue.c:603 at netfs_writepages+0x883/0xa10
  fs/netfs/write_issue.c:603, CPU#3: syz.0.17/5919"
