title: The frontend company self-service editing feature relies on a 
  template-level visibility flag to hide the edit form for company records a 
  visitor does not own, but the corresponding write operation does not repeat 
  this ownership check on the server side. As a result, a visitor who knows the 
  identifier of a company record from the public directory can submit a modified
  update request for that record directly and overwrite its data, without the 
  application ever confirming that the visitor owns it.
