title: SAP BusinessObjects Business Intelligence Platform stores certain 
  sensitive credentials associated with user objects using a hard-coded 
  cryptographic key. An attacker with high privileges and local access to the 
  server could retrieve these objects and decrypt the stored credentials. 
  Successful exploitation could allow the attacker to obtain sensitive 
  authentication data and modify protected information, resulting in a high 
  impact on confidentiality and integrity. There is no impact on availability.
