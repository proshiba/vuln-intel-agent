title: Tor before 0.4.9.10 did not reject a CONFLUX_LINK cell that arrives on a 
  circuit which already has attached streams. A malicious client could send a 
  RELAY_COMMAND_BEGIN before the CONFLUX_LINK on the same circuit, attaching an 
  exit stream that would later end up orphan leaving a dangling circuit 
  back-pointer and a use-after-free (UAF) when the circuit is freed. This is 
  TROVE-2026-025.
