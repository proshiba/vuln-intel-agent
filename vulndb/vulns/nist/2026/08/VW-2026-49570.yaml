title: In Dradis Community Edition, the ProvidersController and AgentsController
  gate their admin_required before_action on `defined?(Dradis::Pro)`, a constant
  that is never defined in CE, so the authorization check is never applied. As a
  result, any authenticated (non-admin) user can create an AI provider pointing 
  to an arbitrary HTTP/HTTPS address (including internal/link-local hosts such 
  as http://169.254.169.254) and reassign the built-in Roslin agent to use it. 
  When an AI interaction is triggered, the server issues a request to the 
  attacker-supplied URL (server-side request forgery). For non-2xx responses, 
  the target's response body is reflected verbatim to the attacker's browser via
  ActionCable/Turbo Stream error messages, making the SSRF readable.
