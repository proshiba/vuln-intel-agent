title: A flaw was found in search-v2-operator. This component's 
  `search-serviceaccount` has overly broad permissions, allowing it to 
  impersonate users and groups across the entire cluster. If an attacker gains 
  access to any of the pods running under this service account, they could 
  exploit this to achieve `system:masters` access, granting them full control 
  over the cluster.
