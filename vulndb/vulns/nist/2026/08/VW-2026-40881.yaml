  function fs.promises.readFile of the file src/server/callback-server.ts. This 
  manipulation of the argument filepath causes path traversal. The attack is 
  restricted to local execution. This product adopts a rolling release strategy 
  to maintain continuous delivery. Therefore, version details for affected or 
  updated releases cannot be specified. The project was informed of the problem 
  early through an issue report but has not responded yet.
