title: 'Adaguc-server is an open source geographical information system to visualize,
  combine, compare and share real-time meteorological, climatological and remote sensing
  data via OGC standards. Versions prior to 7.2.2 crash with a memory-safety fault
  when it parses a GeoJSON document whose geometry contains a malformed coordinate.
  The coordinate parser in `adagucserverEC/CConvertGeoJSON.cpp` indexes `pt.u.array.values[0]`
  and `pt.u.array.values[1]` and uses `polygon.u.array.length` as a loop bound without
  first validating the JSON node type or the coordinate length. A coordinate that
  is an empty array, a one-element array, a scalar, or `null` leads to an out-of-bounds
  heap read or a NULL pointer dereference. The same unchecked pattern is present in
  four geometry branches: `Polygon`, `LineString`, `MultiLineString` and `MultiPolygon`.
  The vulnerable parser runs whenever the server processes a local GeoJSON file, either
