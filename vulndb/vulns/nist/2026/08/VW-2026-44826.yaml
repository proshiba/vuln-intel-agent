title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: add bounds check on firmware mac_id in link lookup\n\nThe mac_id field in
  RX descriptors is 8 bits wide (0-255), but\nassoc_link_on_macid[] has only RTW89_MAX_MAC_ID_NUM
  (128) entries.\nWhile the driver currently assigns mac_id values below 128, the\n\
  descriptor value comes from firmware and is not validated before use\nas an array
  index. Add a defensive bounds check in\nrtw89_assoc_link_rcu_dereference() to guard
  against out-of-range\nfirmware values."
