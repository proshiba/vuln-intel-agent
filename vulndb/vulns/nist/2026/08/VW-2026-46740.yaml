title: 'Vulnerability in the Oracle Hyperion Financial Reporting product of Oracle
  Hyperion (component: Server).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows unauthenticated attacker with network access
  via HTTP to compromise Oracle Hyperion Financial Reporting.  Successful attacks
  require human interaction from a person other than the attacker and while the vulnerability
  is in Oracle Hyperion Financial Reporting, attacks may significantly impact additional
  products (scope change). Successful attacks of this vulnerability can result in  unauthorized
  update, insert or delete access to some of Oracle Hyperion Financial Reporting accessible
  data as well as  unauthorized read access to a subset of Oracle Hyperion Financial
  Reporting accessible data. CVSS 3.1 Base Score 6.1 (Confidentiality and Integrity
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N).'
