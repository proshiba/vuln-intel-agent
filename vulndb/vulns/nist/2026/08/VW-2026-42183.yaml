title: 'Improper access control for some Intel(R) Processors within Ring 3: User Applications
  may allow an escalation of privilege. Simple hardware adversary with an authenticated
  user combined with a high complexity attack may enable escalation of privilege.
  This result may potentially occur via local access when attack requirements are
  present with special internal knowledge and requires no user interaction. The potential
  vulnerability may impact the confidentiality (high), integrity (high) and availability
  (none) of the vulnerable system, resulting in subsequent system confidentiality
  (none), integrity (none) and availability (none) impacts.'
