title: "A code injection vulnerability exists in the LINE Android app prior to version
  26.7.2. \n\nThe profile rendering component does not adequately validate or sandbox
  externally supplied script content embedded in profile templates. \n\nAs a result,
  an attacker who is able to place crafted content in a profile could cause unintended
  code to execute with the application's privileges when a victim views that profile.\
  \ \n\nA server-side mitigation has been deployed that also protects existing Android
  clients that have not been updated to version 26.7.2."
