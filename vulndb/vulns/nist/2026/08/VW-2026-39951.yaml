title: A flaw has been found in yushine InnoShop up to 0.8.2. Affected by this 
  issue is the function FileManagerController::destroyFiles of the file 
  innopacks/restapi/routes/panel-api.php of the component Files Endpoint. This 
  manipulation causes path traversal. The attack may be initiated remotely. The 
  exploit has been published and may be used. The vendor was contacted early 
  about this disclosure but did not respond in any way.
