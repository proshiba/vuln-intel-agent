title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw88: fix OOB read from firmware RX descriptor exceeding DMA buffer\n\nIn rtw_pci_rx_napi(),
  new_len is computed as the sum of pkt_len (14-bit\ndescriptor field, max 16383)
  and pkt_offset (drv_info_sz + shift, both\nfirmware-controlled). The result can
  exceed RTK_PCI_RX_BUF_SIZE (11478),\ncausing an out-of-bounds read from the pre-allocated
  DMA buffer when\nskb_put_data copies new_len bytes. The USB transport already validates\n\
  this (rtw_usb_rx_data_put checks against RTW_USB_MAX_RECVBUF_SZ); the\nPCIe path
  does not.\n\nAdd a check that new_len does not exceed the DMA buffer size."
