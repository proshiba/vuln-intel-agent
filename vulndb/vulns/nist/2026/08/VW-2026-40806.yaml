title: lakeFS is an open-source tool that transforms object storage into a 
  Git-like repositories. Prior to version 1.81.1 of the open source edition and 
  1.84.0 of the enterprise edition, lakeFS Web UI renders markdown files from 
  repository objects without sanitizing the resulting HTML. A user with write 
  access to any repository branch can commit a `.md` object containing arbitrary
  HTML/JavaScript. Any other user who opens that object, or who navigates to a 
  repository or directory containing a malicious `README.md`, executes the 
  attacker-supplied script in their own authenticated session. lakeFS fixes the 
  issue in v1.81.1 and lakeFS Enterprise fixes the issue in in v1.84.0. 
  Enterprise customers using older versions can temporarily disable Markdown 
  rendering by adding YAML to their config. No workaround exists for OSS 
  release. Users are advised to upgrade to the latest version for both lakeFS 
  and lakeFS-Enterprise.
