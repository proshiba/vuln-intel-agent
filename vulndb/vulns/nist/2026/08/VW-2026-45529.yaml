title: hashcat master branch builds after v7.1.2 contain a heap buffer overflow 
  vulnerability in the KeePass AESKDF/KDBX v4 module (module 34301) that allows 
  attackers to corrupt adjacent heap memory by supplying an oversized ninth hash
  field token. The module accepts up to 600 hex characters for the ninth token 
  field but decodes it into a fixed 256-byte buffer with no length check, 
  allowing a maximal input to write up to 44 bytes past the buffer boundary into
  adjacent esalt fields and heap chunk metadata, potentially enabling heap 
  corruption or memory access violations.
