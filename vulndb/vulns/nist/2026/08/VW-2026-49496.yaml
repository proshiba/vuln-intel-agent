title: OpenEXR is the reference implementation and specification for the EXR 
  image format, widely used in the motion picture industry. Versions before 
  3.2.11, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13 allow a crafted EXR 
  with a nonzero dataWindow.min to make TypedFlatImageChannel::row() return an 
  invalid heap pointer, causing out-of-bounds or use-after-free writes. This 
  occurs when an application writes rows through FlatHalfChannel::row(). 
  Affected consumers are tools, converters, render pipeline components, or 
  image-processing services that accept untrusted EXR files and use 
  FlatHalfChannel::row() on loaded images. This issue is fixed in versions 
  3.2.11, 3.3.13, and 3.4.14.
