title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  close UDP tunnel sockets during netns teardown\n\nproc_sctp_do_udp_port() starts
  per-net SCTP UDP tunneling sockets when\nnet.sctp.udp_port is set, and stops/restarts
  them when the sysctl value\nchanges. The netns exit path does not stop these sockets,
  so a namespace\ncan be torn down while its SCTP UDP tunnel sockets are still installed.\n\
  \nClose the UDP tunnel sockets from sctp_ctrlsock_exit() after unregistering\nthe
  per-net sysctl table. This prevents new sysctl writes from racing in\nwhile the
  sockets are being released, and closes the sockets before the\ncontrol socket is
  destroyed."
