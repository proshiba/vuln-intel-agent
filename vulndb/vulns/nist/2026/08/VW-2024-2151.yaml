title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix kernel bug on rename operation of broken directory\n\nSyzbot reported that in
  rename directory operation on broken directory on\nnilfs2, __block_write_begin_int()
  called to prepare block write may fail\nBUG_ON check for access exceeding the folio/page
  size.\n\nThis is because nilfs_dotdot(), which gets parent directory reference\n\
  entry (\"..\") of the directory to be moved or renamed, does not check\nconsistency
  enough, and may return location exceeding folio/page size for\nbroken directories.\n\
  \nFix this issue by checking required directory entries (\".\" and \"..\") in\n\
  the first chunk of the directory in nilfs_dotdot()."
