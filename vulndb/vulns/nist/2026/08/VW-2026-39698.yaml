title: Mautic's getLeadIdsByFieldValueAction 
  (LeadBundle/Controller/AjaxController.php) reads a field parameter from the 
  request, sanitizes it only with InputHelper::clean (which HTML-entity-encodes 
  quotes and angle brackets but does not restrict other characters), and passes 
  it into LeadRepository::buildQueryForGetLeadsByFieldValue where it is 
  concatenated directly as a raw SQL column identifier ( = 'l.'.) rather than 
  being validated against a whitelist of real column names or passed as a bound 
  parameter.
