title: rsync before 3.5.0 contains a path traversal vulnerability that allows 
  remote clients to access files outside the intended module root when use 
  chroot is disabled and the module root path or a component of it is a symlink.
  The daemon calls chdir() to the module root at session initialization without 
  resolving symlinks via realpath() or equivalent, causing subsequent 
  relative-path operations to reference files relative to the symlink target 
  rather than the intended module root, enabling unauthorized file access.
