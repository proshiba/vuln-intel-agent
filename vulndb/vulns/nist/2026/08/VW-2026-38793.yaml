title: The CubeWP Framework plugin for WordPress is vulnerable to Directory 
  Traversal in all versions up to, and including, 1.1.30 via the 
  'cubewp_get_svg_content' function. This makes it possible for unauthenticated 
  attackers to read the contents of arbitrary files on the server, which can 
  contain sensitive information. This is exploitable by unauthenticated 
  attackers because the required nonce is publicly emitted into the markup of 
  any page rendering the CubeWP posts shortcode or widget with AJAX loading 
  enabled, making it harvestable by any guest visitor before submitting the AJAX
  request.
