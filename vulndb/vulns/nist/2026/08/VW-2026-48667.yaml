title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb: Fix UAF at delayed release of MIDI2 EPs\n\nThe recent fix for UAF in ump_to_endpoint()
  caused another UAF because\nit tries to dereference the UMP endpoint object, but
  this might be\nexecuted at a delayed context where the endpoint has been already\n\
  released.\n\nAdd private_free to clear the associated data for avoiding the further\n\
  dereference for delayed releases."
