title: guzzlehttp/guzzle versions before 7.15.1 fail to preserve host-only 
  cookie scope, storing the request host in the Domain field instead of marking 
  cookies as host-only. Attackers controlling child hosts can receive host-only 
  cookies intended only for parent hosts, potentially disclosing session 
  identifiers and authorization tokens when the same cookie jar is reused across
  trust boundaries.
