title: JumpServer is an open source bastion host and an operation and 
  maintenance security audit system. Prior to 4.10.17, an authenticated 
  administrator with Applet Host management and deployment permissions can 
  inject Jinja2 expressions into the IP/Host field or Core Service Address 
  field, causing Ansible to evaluate ansible_host inventory data or playbook 
  variables during Applet Host deployment and execute arbitrary commands on the 
  JumpServer control node. This issue is fixed in version 4.10.17.
