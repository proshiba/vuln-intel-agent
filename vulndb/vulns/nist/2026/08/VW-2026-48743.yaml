title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndevlink:
  fix net namespace reference leak in reload\n\ndevlink_nl_reload_doit() calls devlink_netns_get(),
  which returns a net\nwith a held reference. When the requested namespace differs
  from the\ncurrent one and the reload action is not DRIVER_REINIT, the function\n\
  returns -EOPNOTSUPP without releasing the reference. Add the missing\nput_net()
  on this error path."
