title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix slab-out-of-bounds in smb_strndup_from_utf16()\n\nIf ->NameOffset of smb2_create_req
  is smaller than Buffer offset of\nsmb2_create_req, slab-out-of-bounds read can happen
  from smb2_open.\nThis patch set the minimum value of the name offset to the buffer
  offset\nto validate name length of smb2_create_req()."
