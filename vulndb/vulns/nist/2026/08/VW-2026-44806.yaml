title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hns:
  Fix log flood after cmd_mbox failure\n\nhns_roce_cmd_mbox() is the command interface
  between driver and\nhardware. When hardware is abnormal, the unlimited error printings\n\
  after hns_roce_cmd_mbox() failure will cause log flood and even\nsystem crash.\n\
  \nReplace ibdev_err() and ibdev_warn() with their ratelimited versions\nin the error
  handling path after hns_roce_cmd_mbox() (and its wrappers\nhns_roce_create_hw_ctx/hns_roce_destroy_hw_ctx)
  fails."
