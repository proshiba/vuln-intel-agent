title: Grav API plugin (getgrav/grav-plugin-api) before 1.0.14 contains a 
  missing authorization vulnerability in userPassesAuthorize() 
  (AbstractApiController.php). The function fails to consult the calling 
  request's API key scopes, relying instead on the account's raw super-admin 
  flag and ACL grants. As a result, an authenticated attacker holding a scoped 
  API key minted on a privileged account can bypass their declared scope 
  restrictions to access authorize-gated UI metadata and item definitions 
  (sidebar/menubar/widget items and users-list columns/row-actions/filter-tabs) 
  that their key scope should deny, resulting in information disclosure.
