title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - validate control endpoint type\n\nThe driver currently assumes that the
  first endpoint of the control\ninterface is an interrupt IN endpoint without verifying
  it. A malicious\ndevice could provide a different endpoint type, which would then
  be\npassed to usb_fill_int_urb(), potentially leading to kernel warnings\nor undefined
  behavior.\n\nVerify that the control endpoint is an interrupt IN endpoint."
