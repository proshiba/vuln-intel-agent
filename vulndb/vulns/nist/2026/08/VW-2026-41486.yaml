title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  clear mode callbacks after failed mode setup\n\nxfrm_state_gc_task can run long
  after a failed IPTFS state setup. In the\nreproduced case, __xfrm_init_state() cached
  x->mode_cbs, IPTFS setup\nreturned -ENOMEM before publishing mode_data, and the
  temporary module\nreference from xfrm_get_mode_cbs() was dropped immediately. The
  dead state\nthen kept x->mode_cbs until deferred GC ran after xfrm_iptfs had been\n\
  unloaded.\n\nClear x->mode_cbs when mode init or clone fails before publishing\n\
  mode_data. Those states never installed mode-specific state or the\nlong-term IPTFS
  module pin, so deferred GC has nothing mode-specific to\ndestroy and must not retain
  a callback table pointer past the temporary\nlookup reference.\n\nThe buggy scenario
  involves two paths, with each column showing the order\nwithin that path:\n\nfailed
  setup path:\n1. cache x->mode_cbs\n2. mode setup fails before mode_data\n3. drop
