title: Bash-it 3.2.0 contains a terminal escape sequence injection vulnerability
  in the barbuk theme's Python virtualenv prompt segment that allows local 
  attackers to inject arbitrary terminal control sequences by embedding escape 
  sequences in the requires-python field of a pyproject.toml file. When a user 
  navigates into a directory containing a maliciously crafted pyproject.toml, 
  the unfiltered field value is read via awk and concatenated directly into PS1 
  through __prompt-command without stripping control characters, causing 
  injected OSC or CSI sequences to be written to and interpreted by the terminal
  emulator on every prompt render.
