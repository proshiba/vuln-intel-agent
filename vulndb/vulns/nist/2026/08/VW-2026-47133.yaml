title: phpMyFAQ versions before v4.1.6 fail to validate the 
  security.enableRegistration setting in API endpoints, allowing attackers to 
  create user accounts when registration is disabled. Attackers can bypass the 
  registration restriction by submitting requests to POST /api/register or POST 
  /api/v3.1/register endpoints, which do not check the configuration flag 
  enforced by the HTML registration page.
