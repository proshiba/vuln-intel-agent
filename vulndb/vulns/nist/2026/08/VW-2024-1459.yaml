title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  VMX: Disable preemption when probing user return MSRs\n\nDisable preemption when
  probing a user return MSR via RDSMR/WRMSR.  If\nthe MSR holds a different value
  per logical CPU, the WRMSR could corrupt\nthe host's value if KVM is preempted between
  the RDMSR and WRMSR, and\nthen rescheduled on a different CPU.\n\nOpportunistically
  land the helper in common x86, SVM will use the helper\nin a future commit."
