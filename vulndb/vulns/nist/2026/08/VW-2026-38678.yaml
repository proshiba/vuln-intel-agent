title: The GSheetConnector – CF7 Google Sheets Connector with Real-Time Sync 
  plugin for WordPress is vulnerable to generic SQL Injection via the 's' 
  parameter in all versions up to, and including, 5.2.1 due to insufficient 
  escaping on the user supplied parameter and lack of sufficient preparation on 
  the existing SQL query. This makes it possible for authenticated attackers, 
  with administrator-level access and above, to append additional SQL queries 
  into already existing queries that can be used to extract sensitive 
  information from the database. wp_unslash() strips magic-quote protection and 
  sanitize_text_field() does not escape SQL metacharacters, leaving single 
  quotes and other SQL metacharacters intact before the value is interpolated 
  into the query.
