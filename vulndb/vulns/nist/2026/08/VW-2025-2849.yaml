title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix locking in rxrpc's sendmsg\n\nFix three bugs in the rxrpc's sendmsg implementation:\n\
  \n (1) rxrpc_new_client_call() should release the socket lock when returning\n \
  \    an error from rxrpc_get_call_slot().\n\n (2) rxrpc_wait_for_tx_window_intr()
  will return without the call mutex\n     held in the event that we're interrupted
  by a signal whilst waiting\n     for tx space on the socket or relocking the call
  mutex afterwards.\n\n     Fix this by: (a) moving the unlock/lock of the call mutex
  up to\n     rxrpc_send_data() such that the lock is not held around all of\n   \
  \  rxrpc_wait_for_tx_window*() and (b) indicating to higher callers\n     whether
  we're return with the lock dropped.  Note that this means\n     recvmsg() will not
  block on this call whilst we're waiting.\n\n (3) After dropping and regaining the
  call mutex, rxrpc_send_data() needs\n     to go and recheck the state of the tx_pending
  buffer and the\n     tx_total_len"
