title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: fix NULL dereference when the AP has HT-cap but no HT-oper\n\nmwifiex_tdls_add_ht_oper()
  gates its follow-the-AP-bandwidth path on\nbss_desc->bcn_ht_cap being present, but
  then dereferences a different\npointer, bss_desc->bcn_ht_oper:\n\n\tif (ISSUPP_CHANWIDTH40(priv->adapter->hw_dot_11n_dev_cap)
  &&\n\t    bss_desc->bcn_ht_cap &&\n\t    ISALLOWED_CHANWIDTH40(bss_desc->bcn_ht_oper->ht_param))\n\
  \nbcn_ht_cap and bcn_ht_oper are populated independently while parsing the\nassociated
  AP's beacon in mwifiex_update_bss_desc_with_ie(): an AP that\nadvertises an HT Capabilities
  element but no HT Operation element leaves\nbcn_ht_cap non-NULL and bcn_ht_oper
  NULL. Setting up a TDLS link to a\npeer while associated to such an AP then dereferences
  the NULL\nbcn_ht_oper and crashes the kernel. Every other bcn_ht_oper user in the\n\
  driver NULL-checks it first.\n\nGuard on the pointer that is actually dereferenced.\n\
  \nFound by 0sec automated s"
