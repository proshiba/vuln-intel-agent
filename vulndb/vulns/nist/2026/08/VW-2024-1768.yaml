title: "In the Linux kernel, the following vulnerability has been resolved:\n\nof:
  Fix double free in of_parse_phandle_with_args_map\n\nIn of_parse_phandle_with_args_map()
  the inner loop that\niterates through the map entries calls of_node_put(new)\nto
  free the reference acquired by the previous iteration\nof the inner loop. This assumes
  that the value of \"new\" is\nNULL on the first iteration of the inner loop.\n\n\
  Make sure that this is true in all iterations of the outer\nloop by setting \"new\"\
  \ to NULL after its value is assigned to \"cur\".\n\nExtend the unittest to detect
  the double free and add an additional\ntest case that actually triggers this path."
