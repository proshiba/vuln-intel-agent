title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  tlb: Fix TLBI RANGE operand\n\nKVM/arm64 relies on TLBI RANGE feature to flush TLBs
  when the dirty\npages are collected by VMM and the page table entries become write\n\
  protected during live migration. Unfortunately, the operand passed\nto the TLBI
  RANGE instruction isn't correctly sorted out due to the\ncommit 117940aa6e5f (\"\
  KVM: arm64: Define kvm_tlb_flush_vmid_range()\").\nIt leads to crash on the destination
  VM after live migration because\nTLBs aren't flushed completely and some of the
  dirty pages are missed.\n\nFor example, I have a VM where 8GB memory is assigned,
  starting from\n0x40000000 (1GB). Note that the host has 4KB as the base page size.\n\
  In the middile of migration, kvm_tlb_flush_vmid_range() is executed\nto flush TLBs.
  It passes MAX_TLBI_RANGE_PAGES as the argument to\n__kvm_tlb_flush_vmid_range()
  and __flush_s2_tlb_range_op(). SCALE#3\nand NUM#31, corresponding to MAX_TLBI_RANGE_PAGES,
  isn't supported\nby __TLB"
