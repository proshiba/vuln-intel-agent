title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  fix UAF of ref->proc caused by race condition\n\nA transaction of type BINDER_TYPE_WEAK_HANDLE
  can fail to increment the\nreference for a node. In this case, the target proc normally
  releases\nthe failed reference upon close as expected. However, if the target is\n\
  dying in parallel the call will race with binder_deferred_release(), so\nthe target
  could have released all of its references by now leaving the\ncleanup of the new
  failed reference unhandled.\n\nThe transaction then ends and the target proc gets
  released making the\nref->proc now a dangling pointer. Later on, ref->node is closed
  and we\nattempt to take spin_lock(&ref->proc->inner_lock), which leads to the\n\
  use-after-free bug reported below. Let's fix this by cleaning up the\nfailed reference
  on the spot instead of relying on the target to do so.\n\n  ==================================================================\n\
  \  BUG: KASAN: use-after-free in _raw_spin_lock+0"
