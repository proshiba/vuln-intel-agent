title: The WP Fastest Cache WordPress plugin before 1.5.1 does not validate the 
  Host header before using it to build the URLs of the asset files it embeds in 
  the pages it caches, and does not include that header in the cache key, 
  allowing unauthenticated attackers to poison cached pages with references to a
  server they control and have arbitrary JavaScript run for every subsequent 
  visitor.
