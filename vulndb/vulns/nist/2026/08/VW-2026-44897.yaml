title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: fix skb leak on flow key update failure during ct\n\novs_ct_execute()
  always steals or frees the skb on failure while\novs_flow_key_update() does not.\
  \  So, if it fails and we return right\naway, the skb ends up leaked.\n\nFix that
  by breaking instead and letting the common error handling\ncode at the bottom of
  the loop to free the skb properly.\n\nThis is a very unlikely scenario as it requires
  the packet to become\nunparseable by applying a set of actions on a previously parseable
  skb,\nbut should be fixed nevertheless.\n\nReported by Sashiko."
