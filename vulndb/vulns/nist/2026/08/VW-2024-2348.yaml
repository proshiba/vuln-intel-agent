title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix race between direct IO write and fsync when using same fd\n\nIf we have 2 threads
  that are using the same file descriptor and one of\nthem is doing direct IO writes
  while the other is doing fsync, we have a\nrace where we can end up either:\n\n\
  1) Attempt a fsync without holding the inode's lock, triggering an\n   assertion
  failures when assertions are enabled;\n\n2) Do an invalid memory access from the
  fsync task because the file private\n   points to memory allocated on stack by the
  direct IO task and it may be\n   used by the fsync task after the stack was destroyed.\n\
  \nThe race happens like this:\n\n1) A user space program opens a file descriptor
  with O_DIRECT;\n\n2) The program spawns 2 threads using libpthread for example;\n\
  \n3) One of the threads uses the file descriptor to do direct IO writes,\n   while
  the other calls fsync using the same file descriptor.\n\n4) Call task A the thread
