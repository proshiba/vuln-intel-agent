title: "Affected versions of MISP cti-transmute expose several state-changing account
  operations as GET requests:\n\n\n\n  *  \n/account/follow\n\n\n  *  \n/account/delete_notification\n\
  \n\n  *  \n/account/mark_notification_read\n\n\n  *  \n/account/mark_all_read\n\n\
  \n\n\n\nThese endpoints require authentication, but before the fix they could be
  invoked with simple GET requests. That makes them susceptible to cross-site request
  forgery because a third-party site can induce the victim’s browser to send authenticated
  GET requests automatically.\n\n\nThe patch converts the actions to POST or DELETE
  and updates the frontend to include an X-CSRFToken header, providing explicit CSRF
  protection for those state-changing operations."
