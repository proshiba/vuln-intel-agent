title: A flaw was found in insights-client. The setDefault() function logs the 
  value of every environment variable it processes, including CCX_TOKEN, a 
  bearer credential used in disconnected cluster deployments. When glog 
  verbosity is set to level 2 or higher, the token is written in clear text to 
  the pod log on every startup. An attacker with access to pod logs or 
  centralized logging could obtain the credential, leading to unauthorized 
  access to the CCX API.
