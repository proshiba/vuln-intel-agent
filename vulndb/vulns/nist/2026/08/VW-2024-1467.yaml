title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Fix cwnd update ordering\n\nAfter a reconnect, the reply handler is opening the
  cwnd (and thus\nenabling more RPC Calls to be sent) /before/ rpcrdma_post_recvs()\n\
  can post enough Receive WRs to receive their replies. This causes an\nRNR and the
  new connection is lost immediately.\n\nThe race is most clearly exposed when KASAN
  and disconnect injection\nare enabled. This slows down rpcrdma_rep_create() enough
  to allow\nthe send side to post a bunch of RPC Calls before the Receive\ncompletion
  handler can invoke ib_post_recv()."
