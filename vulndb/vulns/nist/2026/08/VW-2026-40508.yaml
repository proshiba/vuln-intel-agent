title: llama.cpp builds b1886 through b7445 contain an integer overflow 
  vulnerability in the LLaMA-Android JNI wrapper where the new_1batch() function
  multiplies sizeof(llama_seq_id) by an attacker-controlled n_seq_max parameter 
  without overflow validation, causing heap buffer allocation to wrap and 
  allocate insufficient memory. Attackers can exploit this by providing a 
  crafted n_seq_max value through a malicious model file or JNI call to trigger 
  heap corruption and achieve denial of service or arbitrary code execution on 
  Android applications using the LLaMA-Android binding.
