title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/meson:
  explicitly remove aggregate driver at module unload time\n\nBecause component_master_del
  wasn't being called when unloading the\nmeson_drm module, the aggregate device would
  linger forever in the global\naggregate_devices list. That means when unloading
  and reloading the\nmeson_dw_hdmi module, component_add would call into\ntry_to_bring_up_aggregate_device
  and find the unbound meson_drm aggregate\ndevice.\n\nThis would in turn dereference
  some of the aggregate_device's struct\nentries which point to memory automatically
  freed by the devres API when\nunbinding the aggregate device from meson_drv_unbind,
  and trigger an\nuse-after-free bug:\n\n[  +0.000014] =============================================================\n\
  [  +0.000007] BUG: KASAN: use-after-free in find_components+0x468/0x500\n[  +0.000017]
  Read of size 8 at addr ffff000006731688 by task modprobe/2536\n[  +0.000018] CPU:
  4 PID: 2536 Comm: modprobe Tainted: G     "
