title: "In the Linux kernel, the following vulnerability has been resolved:\n\nicmp:
  prevent possible NULL dereferences from icmp_build_probe()\n\nFirst problem is a
  double call to __in_dev_get_rcu(), because\nthe second one could return NULL.\n\n\
  if (__in_dev_get_rcu(dev) && __in_dev_get_rcu(dev)->ifa_list)\n\nSecond problem
  is a read from dev->ip6_ptr with no NULL check:\n\nif (!list_empty(&rcu_dereference(dev->ip6_ptr)->addr_list))\n\
  \nUse the correct RCU API to fix these.\n\nv2: add missing include <net/addrconf.h>"
