title: A vulnerability was determined in karakeep-app karakeep up to 0.32.0. The
  impacted element is an unknown function of the file apps/web/server/auth.ts of
  the component OAuth Sign-In. This manipulation causes improper authentication.
  It is possible to initiate the attack remotely. The complexity of an attack is
  rather high. The exploitability is regarded as difficult. The exploit has been
  publicly disclosed and may be utilized. The project was informed of the 
  problem early through an issue report but has not responded yet.
