title: A vulnerability in the Image Signature Verification feature of Cisco 
  Firepower Threat Defense (FTD) Software could allow an authenticated, remote 
  attacker with administrator-level credentials to install a malicious software 
  patch on an affected device. The vulnerability is due to improper verification
  of digital signatures for patch images. An attacker could exploit this 
  vulnerability by crafting an unsigned software patch to bypass signature 
  checks and loading it on an affected device. A successful exploit could allow 
  the attacker to boot a malicious software patch image.
