title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/9p:
  fix infinite loop in p9_client_rpc on fatal signal\n\nWhen p9_client_rpc() is called
  with type P9_TFLUSH and the transport\nhas no peer (e.g. fd transport backed by
  pipes with no 9p server),\na fatal signal causes an infinite loop:\n\n  again:\n\
  \terr = io_wait_event_killable(req->wq, ...)\n\t/* SIGKILL wakes the task, returns
  -ERESTARTSYS */\n\n\tif (err == -ERESTARTSYS && c->status == Connected &&\n\t\t\
  type == P9_TFLUSH) {\n\t\tsigpending = 1;\n\t\tclear_thread_flag(TIF_SIGPENDING);\n\
  \t\tgoto again;\n\t}\n\nclear_thread_flag() clears TIF_SIGPENDING before jumping
  back to\nio_wait_event_killable(). signal_pending_state() checks TIF_SIGPENDING,\n\
  finds it zero, and the task goes to sleep again. The task can only wake\non the
  next signal delivery that calls signal_wake_up() and sets\nTIF_SIGPENDING again.
  When that happens the loop repeats, clears\nTIF_SIGPENDING, and sleeps again indefinitely.\n\
  \nThis is triggered in practice by coredump_wait(): w"
