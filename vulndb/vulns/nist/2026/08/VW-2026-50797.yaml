title: Zbtlink WE1326, WE357, WE5926, WE5926-WD, WE826-Q, WE826-T2, WE826-WD, 
  WG108, and WG3526 firmware 19.1101, Zbtlink WE2426-C firmware 19.1112, Zbtlink
  WE5926-EC_QP firmware 20.0516, Zbtlink WF3526-P firmware 19.051, CTN720-W1, 
  LF-1541, and MT7620N firmware 19.1101, and WRC1 firmware 20.0622 contain an 
  unauthenticated command injection in the infosrvd service (UDP/9992). A remote
  unauthenticated attacker can send a crafted UDP packet to execute arbitrary 
  commands as root. The service's authentication uses a hardcoded salt and an 
  all-zero wildcard MAC bypass, rendering it ineffective.
