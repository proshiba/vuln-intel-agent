title: Laravel Socialite's Facebook provider contains an authentication bypass 
  vulnerability that allows unauthenticated attackers to replay captured OIDC 
  id_tokens by exploiting the missing nonce claim validation in the 
  getUserByOIDCToken() function within FacebookProvider.php. Attackers who 
  obtain a valid, unexpired id_token issued for the same Facebook App ID can 
  submit the captured token to the backend userFromToken() endpoint, bypassing 
  authentication controls because signature, aud, and iss checks pass while no 
  session-bound nonce comparison is performed, resulting in unauthorized access 
  to victim accounts.
