title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  era: fix out-of-bounds memory access for non-zero start sector\n\ndm-era tracks
  writes in target-relative blocks, but era_map() calculates\nthe writeset block before
  applying the target offset.  Tables with a\nnon-zero start sector can therefore
  pass an absolute mapped-device block\nto metadata_current_marked().\n\nIf the absolute
  block is beyond the current writeset size,\nwriteset_marked() tests past the end
  of the in-core bitset.  KASAN reports\nthis as a vmalloc-out-of-bounds access.\n\
  \nApply the target offset before calculating the era block so writeset\nlookups
  use the target-relative block number."
