title: A security flaw has been discovered in aliyun 
  alibabacloud-dataworks-mcp-server up to 1.0.43. The impacted element is the 
  function ReadResourceRequestSchema of the file src/resources/initResources.ts.
  The manipulation of the argument request.params.uri results in server-side 
  request forgery. The attack may be launched remotely. The project was informed
  of the problem early through an issue report but has not responded yet.
