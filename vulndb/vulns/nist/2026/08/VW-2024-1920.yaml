title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Have trace_event_file have ref counters\n\nThe following can crash the kernel:\n\
  \n # cd /sys/kernel/tracing\n # echo 'p:sched schedule' > kprobe_events\n # exec
  5>>events/kprobes/sched/enable\n # > kprobe_events\n # exec 5>&-\n\nThe above commands:\n\
  \n 1. Change directory to the tracefs directory\n 2. Create a kprobe event (doesn't
  matter what one)\n 3. Open bash file descriptor 5 on the enable file of the kprobe
  event\n 4. Delete the kprobe event (removes the files too)\n 5. Close the bash file
  descriptor 5\n\nThe above causes a crash!\n\n BUG: kernel NULL pointer dereference,
  address: 0000000000000028\n #PF: supervisor read access in kernel mode\n #PF: error_code(0x0000)
  - not-present page\n PGD 0 P4D 0\n Oops: 0000 [#1] PREEMPT SMP PTI\n CPU: 6 PID:
  877 Comm: bash Not tainted 6.5.0-rc4-test-00008-g2c6b6b1029d4-dirty #186\n Hardware
  name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS 1.16.2-debian-1.16.2-1 04/01/2014\n\
  \ RIP: 0010:tracing_"
