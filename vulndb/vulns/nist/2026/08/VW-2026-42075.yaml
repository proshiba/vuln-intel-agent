title: Authorization Bypass Through User-Controlled Key in the ticket management
  component in Roskus Prospero Flow CRM before 5.4.9 allows authenticated users 
  of any company to read the full content (title, description, and attachments) 
  of tickets belonging to another company, to hijack another company's tickets 
  by reassigning their company_id, and to delete another company's tickets 
  without any authorization check, via the ticket's numeric identifier, because 
  the read and save operations retrieve the record without constraining the 
  query to the authenticated user's company, and the delete controller 
  type-hints a generic Illuminate\Http\Request instead of the 
  TicketDeleteRequest that would enforce the required permission.
