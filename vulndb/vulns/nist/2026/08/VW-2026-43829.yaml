title: OpenChoreo is a complete, open-source developer platform for Kubernetes. 
  Prior to 1.0.2 and 1.1.2, internal/cluster-gateway/server.go served 
  caller-facing management APIs on the externally reachable agent listener 
  without authentication, allowing network-reachable attackers to invoke 
  /api/proxy/ and /api/exec/ operations, proxy the data-plane Kubernetes API, 
  and execute commands in workload pods in multi-cluster deployments. This issue
  is fixed in versions 1.0.2 and 1.1.2.
