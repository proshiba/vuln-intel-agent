title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_flow_table: drop existing skb dst before skb_dst_set_noref()\n\nIncoming skbs
  passing through netfilter flowtable offload hooks (or XFRM\noffload path) might
  already carry a ref-counted dst_entry assigned during\nearlier RX or routing steps.\n\
  \nCalling skb_dst_set_noref() when skb already holds a ref-counted dst\noverwrites
  skb->_skb_refdst, leaking the previous dst_entry reference\ncount and triggering
  a DEBUG_NET_WARN_ON_ONCE assertion in\nskb_dst_check_unset():\n\n  WARNING: at skb_dst_check_unset
  include/linux/skbuff.h:1170\n  WARNING: at skb_dst_set_noref include/linux/skbuff.h:1234\n\
  \  WARNING: at nf_flow_offload_ip_hook+0xf6c/0x2b60 net/netfilter/nf_flow_table_ip.c:864\n\
  \nDrop any existing dst_entry reference with skb_dst_drop(skb) before\nsetting the
  non-referenced flowtable destination."
