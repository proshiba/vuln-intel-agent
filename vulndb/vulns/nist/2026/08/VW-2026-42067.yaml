title: Craft CMS versions >= 5.0.0-RC1 before 5.10.7 and >= 4.0.0-RC1 before 
  4.18.3 contain a remote code execution vulnerability in the Twig sandbox 
  mechanism. Because Craft marks the ElementInterface as safe (via the 
  AllowedInSandbox attribute) and the sandbox allowlisting extends to the entire
  class hierarchy (craft\base\Component up to yii\base\Component), an 
  authenticated attacker with permission to access the control panel can render 
  a malicious Twig template that abuses the yii\base\Component arbitrary 
  function-call gadget to execute arbitrary code, even when the Twig sandbox is 
  enabled via enableTwigSandbox().
