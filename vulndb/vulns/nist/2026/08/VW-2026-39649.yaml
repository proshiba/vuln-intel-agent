title: imagecli's `scale <ratio>` pipeline operation (Scale::apply() in 
  src/image_ops.rs) computes output width/height as (dimension as f32 * ratio) 
  as u32 with no upper-bound validation on the CLI-supplied ratio, which is 
  parsed via nom::number::complete::float with no range check. A large ratio 
  (e.g. 100000) causes an attempted allocation of hundreds of terabytes, 
  aborting the process. Any application embedding imagecli as a library and 
  accepting user-controlled pipeline strings is remotely crashable with a single
  request.
