title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  dlmfs: fix error handling of user_dlm_destroy_lock\n\nWhen user_dlm_destroy_lock
  failed, it didn't clean up the flags it set\nbefore exit.  For USER_LOCK_IN_TEARDOWN,
  if this function fails because of\nlock is still in used, next time when unlink
  invokes this function, it\nwill return succeed, and then unlink will remove inode
  and dentry if lock\nis not in used(file closed), but the dlm lock is still linked
  in dlm lock\nresource, then when bast come in, it will trigger a panic due to\n\
  user-after-free.  See the following panic call trace.  To fix this,\nUSER_LOCK_IN_TEARDOWN
  should be reverted if fail.  And also error should\nbe returned if USER_LOCK_IN_TEARDOWN
  is set to let user know that unlink\nfail.\n\nFor the case of ocfs2_dlm_unlock failure,
  besides USER_LOCK_IN_TEARDOWN,\nUSER_LOCK_BUSY is also required to be cleared. \
  \ Even though spin lock is\nreleased in between, but USER_LOCK_IN_TEARDOWN is still
  set, for\nUSER_LOCK_"
