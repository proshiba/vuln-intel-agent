title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  atcspi200: fix use-after-free when driver unbind\n\nDMA resource is initialized
  after SPI controller registration. So\nwhen driver unbind, this can trigger a use-after-free
  when DMA is\ntorn down while the controller is still alive and triggers DMA transfers."
