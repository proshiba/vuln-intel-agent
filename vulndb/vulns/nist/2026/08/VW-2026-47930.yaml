title: The Lean 4 kernel does not verify that the structure named in a 
  projection expression matches the type of the value being projected, and 
  environment::add_inductive in src/kernel/inductive.cpp did not type check the 
  nested inductive applications that are replaced by auxiliary types, so their 
  parametric arguments escaped checking. A metaprogram running in the Lean 
  process can register an ill-typed nested inductive whose constructor applies a
  .proj C 0 projection to a value of the unrelated type W, and the kernel admits
  the declaration through the ordinary checked addDecl path at maximum kernel 
  checking, without sorry, unsafeCast, debug.skipKernelTC, 
  addDeclWithoutChecking, FFI, or a modified .olean file. The result is a type 
  confusion yielding a proof of False that carries no axioms, from which any 
  proposition can be derived. The published proof of concept additionally pads 
