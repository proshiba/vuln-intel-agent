title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfsplus:
  Add a sanity check for btree node size\n\nSyzbot reported an uninit-value bug in
  [1] with a corrupted HFS+ image,\nduring the file system mounting process, specifically
  while loading the\ncatalog, a corrupted node_size value of 1 caused the rec_off
  argument\npassed to hfs_bnode_read_u16() (within hfs_bnode_find()) to be excessively\n\
  large. Consequently, the function failed to return a valid value to\ninitialize
  the off variable, triggering the bug [1].\n\nEvery node starts from BTree node descriptor:
  struct hfs_bnode_desc.\nSo, the size of node cannot be lesser than that. However,
  technical\nspecification declares that: \"The node size (which is expressed in bytes)\n\
  must be power of two, from 512 through 32,768, inclusive.\" Add a check\nfor btree
  node size base on technical specification.\n\n[1]\nBUG: KMSAN: uninit-value in hfsplus_bnode_find+0x141c/0x1600
  fs/hfsplus/bnode.c:584\n hfsplus_bnode_find+0x141c/0x1600 fs/hfsplus/bn"
