title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/cma:
  Ensure rdma_addr_cancel() happens before issuing more requests\n\nThe FSM can run
  in a circle allowing rdma_resolve_ip() to be called twice\non the same id_priv.
  While this cannot happen without going through the\nwork, it violates the invariant
  that the same address resolution\nbackground request cannot be active twice.\n\n\
  \       CPU 1                                  CPU 2\n\nrdma_resolve_addr():\n \
  \ RDMA_CM_IDLE -> RDMA_CM_ADDR_QUERY\n  rdma_resolve_ip(addr_handler)  #1\n\n\t\t
  \t process_one_req(): for #1\n                          addr_handler():\n      \
  \                      RDMA_CM_ADDR_QUERY -> RDMA_CM_ADDR_BOUND\n              \
  \              mutex_unlock(&id_priv->handler_mutex);\n                        \
  \    [.. handler still running ..]\n\nrdma_resolve_addr():\n  RDMA_CM_ADDR_BOUND
  -> RDMA_CM_ADDR_QUERY\n  rdma_resolve_ip(addr_handler)\n    !! two requests are
  now on the req_list\n\nrdma_destroy_id():\n destroy_id_handler_unlock("
