title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  handle overlapping allocated ranges in fallocate\n\nsmb3_simple_fallocate_range()
  can skip holes when an allocated range\nreturned by the server starts before the
  current fallocate offset. The\nskipped hole is not zero-filled, but fallocate still
  returns success. A\nlater write to that hole may therefore fail with ENOSPC.\n\n\
  The function queries allocated ranges so that it can preserve existing\ncontents
  and write zeroes only into holes. However, the server may return\na range that starts
  before the current fallocate offset.\n\nFor example, assume the fallocate request
  is [100, 400) and the only\nallocated range returned by the server is [0, 200):\n\
  \n        Request:      [100, 400)\n        Server range: [  0, 200)  allocated\n\
  \n        Correct:\n        [100, 200)    allocated data, skip\n        [200, 400)\
  \    hole, zero-fill\n\n        Current:\n        [100, 300)    skipped\n      \
  \  [300, 400)    zero-filled afterwards\n\nThe "
