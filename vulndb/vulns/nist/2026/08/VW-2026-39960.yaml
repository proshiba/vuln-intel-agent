title: H5Z__filter_nbit in H5Znbit.c in HDF5 through 2.3.0 dereferences 
  cd_values[0] through cd_values[4] without validating that cd_values is 
  non-NULL or that cd_nelmts is at least 5, the fixed size of the filter's 
  header. This allows attackers to cause a denial of service via a crafted HDF5 
  file that stores the N-Bit filter pipeline message with zero client-data 
  values, opened and read via H5Dread, e.g. by the h5ls or h5repack tools.
