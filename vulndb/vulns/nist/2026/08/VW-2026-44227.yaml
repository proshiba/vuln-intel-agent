title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ixp4xx_hss: fix duplicate HDLC netdev allocation\n\nixp4xx_hss_probe() allocates
  two HDLC netdevs. The first one is stored\nin ndev, initialized, and registered
  with register_hdlc_device(). The\nsecond one is stored in port->netdev and later
  used by the remove path\nfor unregister_hdlc_device() and free_netdev().\n\nThis
  means that the registered netdev is not the same object that is\nunregistered and
  freed on remove. It also leaks the first allocation if\nthe second alloc_hdlcdev()
  call fails, and the first allocation is not\nchecked before ndev is used.\n\nOlder
  code allocated the HDLC netdev only once and stored the same object\nin both the
  local variable and port->netdev. The buggy conversion split\nthis into two alloc_hdlcdev()
  calls. A later rename changed the local\nvariable name to ndev, but the underlying
  mismatch remained.\n\nFix this by allocating the HDLC netdev only once and assigning
  the same\nobject to port->netdev."
