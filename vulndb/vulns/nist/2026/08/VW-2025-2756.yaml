title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915:
  Fix request ref counting during error capture & debugfs dump\n\nWhen GuC support
  was added to error capture, the reference counting\naround the request object was
  broken. Fix it up.\n\nThe context based search manages the spinlocking around the
  search\ninternally. So it needs to grab the reference count internally as\nwell.
  The execlist only request based search relies on external\nlocking, so it needs
  an external reference count but within the\nspinlock not outside it.\n\nThe only
  other caller of the context based search is the code for\ndumping engine state to
  debugfs. That code wasn't previously getting\nan explicit reference at all as it
  does everything while holding the\nexeclist specific spinlock. So, that needs updaing
  as well as that\nspinlock doesn't help when using GuC submission. Rather than trying
  to\nconditionally get/put depending on submission model, just change it to\nalways
  do the get/put.\n\nv2: Explicitly do"
