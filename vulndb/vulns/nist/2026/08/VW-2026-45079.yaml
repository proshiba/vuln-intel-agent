title: The NEX-Forms – Ultimate Forms Plugin for WordPress plugin for WordPress 
  is vulnerable to generic SQL Injection via the 'additional_params' parameter 
  in all versions up to, and including, 9.2.4 due to insufficient escaping on 
  the user supplied parameter and lack of sufficient preparation on the existing
  SQL query. This makes it possible for authenticated attackers, with 
  admin-level access and above, to append additional SQL queries into already 
  existing queries that can be used to extract sensitive information from the 
  database. This is a second-order vulnerability; the payload is stored via the 
  submission_report2 AJAX handler (which lacks a nonce check and relies solely 
  on a capability that can be configured down to subscriber-level) and triggered
  when a CSV export is generated.
