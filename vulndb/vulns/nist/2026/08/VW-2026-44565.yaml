title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  adm1275: Prevent reading uninitialized stack\n\nWhile adding support for the ROHM
  BD127X0 hot-swap controllers, sashiko\nreported an error in device-name comparison,
  which can lead to reading\nuninitialized stack memory.\n\nQuoting Sashiko:\n\nThis
  is a pre-existing issue, but I noticed that just before this block in\nadm1275_probe(),
  there might be an out-of-bounds stack read:\n\n    ret = i2c_smbus_read_block_data(client,
  PMBUS_MFR_MODEL, block_buffer);\n    if (ret < 0) { ... }\n    for (mid = adm1275_id;
  mid->name[0]; mid++) {\n            if (!strncasecmp(mid->name, block_buffer, strlen(mid->name)))\n\
  \                    break;\n    }\n\nSince i2c_smbus_read_block_data() reads up
  to 32 bytes into the\nuninitialized stack array block_buffer without appending a
  null\nterminator, strncasecmp() could read past the valid bytes returned in ret.\n\
