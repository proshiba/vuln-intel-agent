title: CodeWhale (packages codewhale / codewhale-tui) versions >= 0.8.41 and < 
  0.8.64 contain a remote code execution vulnerability in the rlm_eval tool. The
  tool's approval_requirement() returns ApprovalRequirement::Auto, which the 
  engine treats as 'never prompt,' causing arbitrary model-supplied Python code 
  to run in a python3 interpreter without consulting the user's configured 
  --approval-policy and without any approval prompt or audit step. An attacker 
  can induce the agent to execute arbitrary code via prompt injection in 
  untrusted content the agent reads (a web page, fetched URL, repository file, 
  or MCP tool result); the companion rlm_open tool can stage such content. Code 
  runs on the user's machine at the user's privilege level. Fixed in 0.8.64.
