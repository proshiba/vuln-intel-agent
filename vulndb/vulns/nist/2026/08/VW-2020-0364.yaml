title: "A cross-site-scripting (XSS) vulnerability exists when Active Directory Federation
  Services (ADFS) does not properly sanitize user inputs. An un-authenticated attacker
  could exploit the vulnerability by sending a specially crafted request to an affected
  ADFS server.\nThe attacker who successfully exploited the vulnerability could then
  perform cross-site scripting attacks on affected systems and run scripts in the
  security context of the current user.\nThis security update addresses the vulnerability
  by ensuring that ADFS properly sanitizes user inputs."
