title: A security flaw has been discovered in UTT HiPER 1200GW up to 
  v2.5.3-170306. This affects the function strcpy of the file 
  /goform/ConfigAdvideo. The manipulation of the argument timestart results in 
  stack-based buffer overflow. The attack can be launched remotely. The exploit 
  has been released to the public and may be used for attacks. The vendor was 
  contacted early about this disclosure but did not respond in any way.
