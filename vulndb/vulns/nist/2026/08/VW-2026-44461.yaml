title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: Initialize KVM_S390_GET_CMMA_BITS memory\n\nkvm_s390_get_cmma_bits() allocates
  its output buffer with vmalloc(),\nwhich does not zero the returned pages:\n\n\t
  values = vmalloc(args->count);\n\nIn the non-peek (migration) path, dat_get_cmma()
  reports a byte count\nspanning from the first to the last dirty page, but __dat_get_cmma_pte()\n\
  writes values[gfn - start] only for pages whose CMMA dirty bit is set.\nThe walk
  uses DAT_WALK_IGN_HOLES, so clean and unmapped pages that lie\nbetween two dirty
  pages within the reported span are visited but never\nstore their byte.  Those gaps
  (up to KVM_S390_MAX_BIT_DISTANCE pages\neach) stay uninitialized yet fall inside
  [0, count) and are copied out\nby copy_to_user(), disclosing stale kernel memory
  to user space.\n\nBefore the switch to the new gmap implementation the buffer was
  fully\npopulated for every gfn in the span, so no uninitialized bytes were\nexposed;
