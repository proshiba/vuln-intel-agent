title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/radeon:
  fix memory leak in radeon_ring_restore() on lock failure\n\nradeon_ring_restore()
  takes ownership of the data buffer allocated by\nradeon_ring_backup(). The caller
  (radeon_gpu_reset()) only frees it in\nthe non-restore branch; in the restore branch
  it relies on\nradeon_ring_restore() to free it.\n\nIf radeon_ring_lock() fails,
  the function returned early without calling\nkvfree(data), leaking the ring backup
  buffer on every GPU reset that\nfails at the lock stage. During repeated GPU resets
  this causes\ncumulative kernel memory exhaustion.\n\nFree data before returning
  the error."
