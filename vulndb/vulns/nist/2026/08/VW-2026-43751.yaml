title: Elasticsearch does not apply its configurable input length restriction to
  a user-supplied pattern accepted by an intervals query. Compiling a deeply 
  nested pattern drives unbounded recursion that exhausts the thread stack and 
  raises a fatal error, terminating the Elasticsearch node process and causing a
  denial of service for that node. An authenticated user holding only read-only 
  privileges on a single searchable index can trigger the condition with one 
  small search request.
