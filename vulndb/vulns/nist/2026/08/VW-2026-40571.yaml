title: A flaw was found in p11-kit. A local attacker, or one with equivalent 
  access to a reachable RPC channel, could exploit an integer overflow 
  vulnerability. By sending specially crafted messages, the attacker can cause 
  the system to miscalculate memory allocation for nested attributes. This leads
  to a memory corruption issue, specifically a heap out-of-bounds write, which 
  can crash the p11-kit RPC parsing process, resulting in a Denial of Service 
  (DoS). This vulnerability is only exploitable on 32 bit systems.
