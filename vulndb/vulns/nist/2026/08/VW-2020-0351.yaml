title: "A remote code execution vulnerability exists in Microsoft Excel software when
  the software fails to properly handle objects in memory. An attacker who successfully
  exploited the vulnerability could run arbitrary code in the context of the current
  user. If the current user is logged on with administrative user rights, an attacker
  could take control of the affected system. An attacker could then install programs;
  view, change, or delete data; or create new accounts with full user rights. Users
  whose accounts are configured to have fewer user rights on the system could be less
  impacted than users who operate with administrative user rights.\nExploitation of
