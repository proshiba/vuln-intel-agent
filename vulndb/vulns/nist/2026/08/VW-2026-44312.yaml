title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  ISST: Restore SST-PP control to all domains\n\nThe SST-PP control offset is only
  restored to power domain 0 after\nresume. During suspend, control values are read
  and stored for all\npower domains.\n\nUse pd_info->sst_base instead of power_domain_info->sst_base,
  which\nonly points to power domain 0 base address."
