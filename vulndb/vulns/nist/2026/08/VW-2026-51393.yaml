title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  synproxy: fix unaligned memory access in timestamp adjustment\n\nUse get_unaligned_be32()
  and put_unaligned_be32() to safely read and\nwrite the timestamp fields. This prevents
  performance degradation due to\nunaligned memory access or even a crash on strict
  alignment\narchitectures.\n\nThis follows the implementation of timestamp parsing
  in the networking\nstack at tcp_parse_options() and synproxy_parse_options()."
