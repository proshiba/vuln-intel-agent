title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  clear XPRT_SOCK_UPD_TIMEOUT when reset transport\n\nSince transport->sock has been
  set to NULL during reset transport,\nXPRT_SOCK_UPD_TIMEOUT also needs to be cleared.
  Otherwise, the\nxs_tcp_set_socket_timeouts() may be triggered in xs_tcp_send_request()\n\
  to dereference the transport->sock that has been set to NULL."
