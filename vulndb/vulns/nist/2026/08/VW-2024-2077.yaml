title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsock_map:
  avoid race between sock_map_close and sk_psock_put\n\nsk_psock_get will return NULL
  if the refcount of psock has gone to 0, which\nwill happen when the last call of
  sk_psock_put is done. However,\nsk_psock_drop may not have finished yet, so the
  close callback will still\npoint to sock_map_close despite psock being NULL.\n\n\
  This can be reproduced with a thread deleting an element from the sock map,\nwhile
  the second one creates a socket, adds it to the map and closes it.\n\nThat will
  trigger the WARN_ON_ONCE:\n\n------------[ cut here ]------------\nWARNING: CPU:
  1 PID: 7220 at net/core/sock_map.c:1701 sock_map_close+0x2a2/0x2d0 net/core/sock_map.c:1701\n\
  Modules linked in:\nCPU: 1 PID: 7220 Comm: syz-executor380 Not tainted 6.9.0-syzkaller-07726-g3c999d1ae3c7
  #0\nHardware name: Google Google Compute Engine/Google Compute Engine, BIOS Google
  04/02/2024\nRIP: 0010:sock_map_close+0x2a2/0x2d0 net/core/sock_map.c:1701\nCode:
  df e8 "
