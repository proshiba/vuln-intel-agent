title: CamaleonCMS contains a stored cross-site scripting vulnerability that 
  allows authenticated low-privileged users to execute arbitrary JavaScript in 
  an administrator's browser by injecting unsanitized HTML payloads into the 
  post title parameter during draft creation. Attackers can submit a malicious 
  HTML payload as a draft title through the drafts creation endpoint, which is 
  persisted to the database without escaping and later rendered as raw HTML in 
  the admin drafts listing, enabling administrator session compromise, cookie 
  theft, and forged authenticated requests.
