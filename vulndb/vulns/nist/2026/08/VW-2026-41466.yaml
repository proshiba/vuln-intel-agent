title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  sata_dwc_460ex: enable SATA interrupts only after IRQ handler is registered\n\n\
  sata_dwc_enable_interrupts() is called before platform_get_irq() and\nata_host_activate(),
  leaving the SATA controller's interrupt mask\nenabled without a registered handler.\
  \  If a later step fails (irq\nrequest, phy init, etc.) or if the controller asserts
  an interrupt\nduring probe, the irq line may fire with no handler, causing a\nspurious
  interrupt storm.\n\nMove sata_dwc_enable_interrupts() after ata_host_activate()
  so that\ninterrupts are only unmasked once the handler is registered and the\ncore
  is fully initialized."
