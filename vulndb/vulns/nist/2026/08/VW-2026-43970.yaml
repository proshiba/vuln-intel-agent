title: 'A security vulnerability has been detected in Webkul Bagisto up to 2.4.4.
  This vulnerability affects unknown code of the file /admin/reporting/sales/ of the
  component Backend Reporting Endpoint. The manipulation leads to authorization bypass.
  Remote exploitation of the attack is possible. The exploit has been disclosed publicly
  and may be used. The vendor confirms: "The reported issues were already identified
  through our internal security assessment process prior to this notification and
  are being handled through our established internal security and development lifecycle.
  Some of these items have already been addressed, while the remaining items are planned
  for resolution in upcoming product releases."'
