title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  atomisp: gc2235: fix UAF and memory leak\n\ngc2235_probe() handles its error paths
  incorrectly.\n\nIf media_entity_pads_init() fails, gc2235_remove() is called, which\n\
  tears down the subdev and frees dev, but then still falls through to\natomisp_register_i2c_module().
  This results in use-after-free.\n\nIf atomisp_register_i2c_module() fails, the media
  entity and control\nhandler are left initialized and dev is leaked.\n\ngc2235_remove()
  unconditionally calls media_entity_cleanup() and\nv4l2_ctrl_handler_free(), but
  these are not initialized at every\nerror path in gc2235_probe().\n\nReplace gc2235_remove()
  calls in the probe error paths with explicit\nunwind labels that free only the resources
  initialized at each point\nof failure, in reverse order of initialization."
