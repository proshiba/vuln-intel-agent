title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware_loader:
  Fix recursive lock in device_cache_fw_images()\n\nA recursive locking deadlock can
  occur in the firmware loader's power\nmanagement notification handler.\n\nDuring
  system suspend or hibernation preparation, fw_pm_notify() calls\ndevice_cache_fw_images().
  This function acquires fw_lock to set the\nfirmware cache state to FW_LOADER_START_CACHE
  and then iterates over all\ndevices using dpm_for_each_dev() while still holding
  the lock.\n\nFor each device, dev_cache_fw_image() schedules asynchronous work to
  cache\nthe firmware. If memory allocation for the async work entry fails (e.g.,
  in\nout-of-memory conditions), async_schedule_node_domain() falls back to\nexecuting
  the work function synchronously in the current thread.\n\nThe synchronous execution
  path (__async_dev_cache_fw_image() ->\ncache_firmware() -> request_firmware() ->
  assign_fw()) attempts to acquire\nfw_lock again. Since the current thread already
  holds fw_loc"
