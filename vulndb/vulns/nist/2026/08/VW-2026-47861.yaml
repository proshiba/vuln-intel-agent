title: "Sony XAV-9500ES gpsd Buffer Overflow Arbitrary Code Execution Vulnerability.
  This vulnerability allows physically present attackers to execute arbitrary code
  on affected installations of Sony XAV-9500ES devices. Authentication is not required
  to exploit this vulnerability.\n\nThe specific flaw exists within the handling of
  NMEA data by the gpsd daemon. The issue results from the lack of proper validation
  of the length of user-supplied data prior to copying it to a fixed-length buffer.
  An attacker can leverage this in conjunction with other vulnerabilities to execute
  code in the context of the gpsd daemon. Was ZDI-CAN-29060."
