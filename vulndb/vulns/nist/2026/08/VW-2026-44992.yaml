title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  drain continuation descs after overflow in xsk_build_skb()\n\nFix generic xmit path
  multi-buffer logic when packets are either too big\n(count of descriptors exceed
  MAX_SKB_FRAGS) or an invalid descriptor is\nincluded in fragmented packet. Introduce
  xdp_sock::drain_cont and act\nupon this flag - when it is set, keep on consuming
  descriptors from\nAF_XDP Tx ring and put them directly onto Cq. Previously these\n\
  descriptors were silently lost and could never be reached again."
