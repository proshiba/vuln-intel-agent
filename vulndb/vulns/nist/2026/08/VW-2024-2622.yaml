title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: Fix use-after-free of network namespace.\n\nRecently, we got a customer
  report that CIFS triggers oops while\nreconnecting to a server.  [0]\n\nThe workload
  runs on Kubernetes, and some pods mount CIFS servers\nin non-root network namespaces.\
  \  The problem rarely happened, but\nit was always while the pod was dying.\n\n\
  The root cause is wrong reference counting for network namespace.\n\nCIFS uses kernel
  sockets, which do not hold refcnt of the netns that\nthe socket belongs to.  That
  means CIFS must ensure the socket is\nalways freed before its netns; otherwise,
  use-after-free happens.\n\nThe repro steps are roughly:\n\n  1. mount CIFS in a
  non-root netns\n  2. drop packets from the netns\n  3. destroy the netns\n  4. unmount
  CIFS\n\nWe can reproduce the issue quickly with the script [1] below and see\nthe
  splat [2] if CONFIG_NET_NS_REFCNT_TRACKER is enabled.\n\nWhen the socket is TCP,
