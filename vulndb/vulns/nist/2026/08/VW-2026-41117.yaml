title: An improper path validation vulnerability in AsyncFuncAI/deepwiki-open 
  through commit 16f35a0 allows unauthenticated remote attackers to write to or 
  delete arbitrary files with root privileges. The api/api.py wiki-cache 
  endpoint constructs file paths from user-controlled owner, repo, and repo_type
  fields without sanitization, enabling path traversal.
