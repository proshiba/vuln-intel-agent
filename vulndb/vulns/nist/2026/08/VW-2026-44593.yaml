title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrtc:
  msc313: fix NULL deref in shared IRQ handler at probe\n\nmsc313_rtc_probe() calls
  devm_request_irq() with IRQF_SHARED and\n&pdev->dev as the cookie, but platform_set_drvdata()
  is only called\nlater after the clock setup. With a shared IRQ line, another device\n\
  on the same line can trigger the handler in that window. The\nhandler does dev_get_drvdata()
  on the cookie, gets NULL, and\ndereferences priv->rtc_base in interrupt context.\n\
  \nPass priv as the cookie directly so the handler reads it from\ndev_id without
  the lookup, removing the dependency on probe order."
