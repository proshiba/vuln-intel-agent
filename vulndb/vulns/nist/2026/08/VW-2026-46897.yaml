title: 'Vulnerability in the Oracle Agile PLM MCAD Connector product of Oracle Supply
  Chain (component: CAX Client).   The supported version that is affected is 3.6.
  Difficult to exploit vulnerability allows unauthenticated attacker with access to
  the physical communication segment attached to the hardware where the Oracle Agile
  PLM MCAD Connector executes to compromise Oracle Agile PLM MCAD Connector.  Successful
  attacks of this vulnerability can result in  unauthorized access to critical data
  or complete access to all Oracle Agile PLM MCAD Connector accessible data as well
  as  unauthorized update, insert or delete access to some of Oracle Agile PLM MCAD
  Connector accessible data. CVSS 3.1 Base Score 5.9 (Confidentiality and Integrity
  impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:L/A:N).'
