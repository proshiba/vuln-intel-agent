title: A security vulnerability has been detected in TinyAGI 0.0.20. Impacted is
  the function processMessage of the file packages/main/src/index.ts of the 
  component Message API Endpoint. Such manipulation leads to missing 
  authorization. The attack can be launched remotely. The exploit has been 
  disclosed publicly and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
