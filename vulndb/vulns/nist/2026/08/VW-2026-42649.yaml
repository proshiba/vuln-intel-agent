title: An issue in MongoDB Server's JavaScript scripting engine could allow an 
  authenticated user with write privileges to cause code they control to be 
  executed within the query scope of other users, through a specially crafted 
  stored value processed during an internal maintenance cycle. This could result
  in corruption of query results affecting other users and denial of service 
  targeted at their operations on the same database. Impact is limited to the 
  scripting engine's execution sandbox, which does not provide access to 
  database, filesystem, or network resources.
