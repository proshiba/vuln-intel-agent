title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/coco:
  Require seeding RNG with RDRAND on CoCo systems\n\nThere are few uses of CoCo that
  don't rely on working cryptography and\nhence a working RNG. Unfortunately, the
  CoCo threat model means that the\nVM host cannot be trusted and may actively work
  against guests to\nextract secrets or manipulate computation. Since a malicious
  host can\nmodify or observe nearly all inputs to guests, the only remaining source\n\
  of entropy for CoCo guests is RDRAND.\n\nIf RDRAND is broken -- due to CPU hardware
  fault -- the RNG as a whole\nis meant to gracefully continue on gathering entropy
  from other sources,\nbut since there aren't other sources on CoCo, this is catastrophic.\n\
  This is mostly a concern at boot time when initially seeding the RNG, as\nafter
  that the consequences of a broken RDRAND are much more\ntheoretical.\n\nSo, try
  at boot to seed the RNG using 256 bits of RDRAND output. If this\nfails, panic().
