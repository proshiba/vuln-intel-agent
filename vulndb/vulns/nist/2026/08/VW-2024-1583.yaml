title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix data corruption in dsync block recovery for small block sizes\n\nThe helper
  function nilfs_recovery_copy_block() of\nnilfs_recovery_dsync_blocks(), which recovers
  data from logs created by\ndata sync writes during a mount after an unclean shutdown,
  incorrectly\ncalculates the on-page offset when copying repair data to the file's
  page\ncache.  In environments where the block size is smaller than the page\nsize,
  this flaw can cause data corruption and leak uninitialized memory\nbytes during
  the recovery process.\n\nFix these issues by correcting this byte offset calculation
  on the page."
