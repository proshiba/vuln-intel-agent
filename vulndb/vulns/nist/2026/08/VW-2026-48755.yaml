title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFS:
  Pin the 'struct nfs_server' during a FREE_STATEID call\n\nDan Aloni reports that
  he was able to hit a use-after-free bug if a\nFREE_STATEID operation gets delayed
  for whatever reason. Fix this by\nbumping the refcount of the 'struct nfs_server'
  object for the duration\nof the FREE_STATEID so it doesn't get cleaned up from underneath
  us\nwhile operations are still in flight."
