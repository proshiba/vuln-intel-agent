title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  i2c: dw9714: Disable the regulator when the driver fails to probe\n\nWhen the driver
  fails to probe, we will get the following splat:\n\n[   59.305988] ------------[
  cut here ]------------\n[   59.306417] WARNING: CPU: 2 PID: 395 at drivers/regulator/core.c:2257
  _regulator_put+0x3ec/0x4e0\n[   59.310345] RIP: 0010:_regulator_put+0x3ec/0x4e0\n\
  [   59.318362] Call Trace:\n[   59.318582]  <TASK>\n[   59.318765]  regulator_put+0x1f/0x30\n\
  [   59.319058]  devres_release_group+0x319/0x3d0\n[   59.319420]  i2c_device_probe+0x766/0x940\n\
  \nFix this by disabling the regulator in error handling."
