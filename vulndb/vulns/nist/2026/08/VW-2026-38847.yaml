title: A security flaw in the IdentityBrokerService.performLogin endpoint of 
  Keycloak allows authentication to proceed using an Identity Provider (IdP) 
  even after it has been disabled by an administrator. An attacker who knows the
  IdP alias can reuse a previously generated login request to bypass the 
  administrative restriction. This undermines access control enforcement and may
  allow unauthorized authentication through a disabled external provider.
