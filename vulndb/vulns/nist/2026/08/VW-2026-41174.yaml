title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  reject mapping a reserved doorbell to a new queue\n\nWhen creating an user-queue,
  the user space\nprovides a doorbell BO handle and an offset within\nthe bo to obtain
  a doorbell.\n\nHowever current implementation using xa_store_irq()\nto store a doorbell,
  which allows a later queue created\nwith the same BO and offset parameters to overwrite
  an\nexisting queue and doorbell mapping.\n\nThis can cause problems like misrouting
  fence IRQ\nprocessing to a wrong queue, and mislead the cleanup\nprocess of one
  queue erasing the mapping of another queue.\n\nThis commit fixes this issue by replacing
  xa_store_irq with\nxa_insert_irq, which rejects mapping a reserved\ndoorbell to
  a newly created queue\n\n(cherry picked from commit 6244eae22966350db52faf9c1369d3b2ffc5de4e)"
