title: "Kernel software from a non-secure operating system on a platform with Trusted
  Execution Environment support, may cause GPU Firmware to boot up using data from
  non-secure memory.\n\n\n\nThe GPU thread of control (Firmware) uses a pointer from
  non-secure memory belonging to the Rich Execution Environment (REE) when saving
  or retrieving internal data between the tightly coupled private memory to main memory.
  An attacker with control over the REE kernel may modify the pointer value, corrupting
  the data used by the GPU Firmware."
