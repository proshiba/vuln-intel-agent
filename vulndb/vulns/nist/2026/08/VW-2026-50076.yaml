title: "In FreeBSD 15.0, the kernel structure used to represent user credentials changed:
  previously the primary group ID was stored in the first element of the array containing
  the list of supplementary group IDs, whereas now the primary group ID is stored
  in a dedicated field.  This change was largely internal to the kernel and not user-visible.\n\
  \nOne function, group_is_primary(), was not properly updated as a part of this transition.\
  \  This function is used by mac_do to determine the primary group ID of the credential
  after applying a transition rule, used when the rule target does not explicitly
  specify a group.\n\nAs a result, with certain mac_do rules, it is possible for a
  credential switch to incorrectly set the primary group ID to the ID stored in the
  first element of the original credential's supplementary group array.\n\nIf the
  list of supplementary groups is empty, this value will be 0, corresponding to the
  \"wheel\" group.  For example, a rule such as \"uid=1001>uid=1002\" can be abused
