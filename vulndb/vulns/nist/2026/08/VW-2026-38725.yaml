title: axios versions 0.28.0 and later contain uncontrolled recursion in 
  formDataToJSON when processing FormData field names with deeply nested bracket
  segments. Attackers can supply FormData with field names containing thousands 
  of nested brackets to exhaust the JavaScript call stack and trigger 
  RangeError, causing request failure or process termination in applications 
  that do not handle the exception.
