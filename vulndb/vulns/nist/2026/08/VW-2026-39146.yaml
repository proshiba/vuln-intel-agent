title: ClearOS 7.9 contains an OS command injection vulnerability in the Log 
  Viewer component that allows authenticated attackers to execute arbitrary 
  commands by submitting unsanitized input through the filter parameter, which 
  is interpolated directly into a shell command in File.php. Attackers can 
  inject command substitution payloads into the filter parameter to execute 
  arbitrary commands as the webconfig user, and due to extensive NOPASSWD sudo 
  privileges granted to that user by default, immediately escalate to root.
