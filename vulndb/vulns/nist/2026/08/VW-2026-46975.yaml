title: 4gaBoards is a boards system for realtime project management. Prior to 
  3.3.9, 4gaBoards allows any authenticated user to enumerate account 
  information for every user through GET /api/users and retrieve arbitrary 
  accounts through GET /api/users/:id. The users/index and users/show actions 
  rely only on the default is-authenticated policy in server/config/policies.js,
  and server/api/controllers/users/index.js returns the result of 
  sails.helpers.users.getMany() without requester-specific authorization or 
  response sanitization. Responses expose email, phone, organization, name, 
  isAdmin, ssoGoogleEmail, ssoGithubEmail, and other SSO-linked email fields, 
  including data for administrators. This enables instance-wide user 
  enumeration, privacy loss, and targeted phishing reconnaissance. This issue is
  fixed in version 3.3.9.
