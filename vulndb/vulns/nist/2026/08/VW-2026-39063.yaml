title: A vulnerability was determined in GL.iNet GL-MT3000 up to 4.4.5. Affected
  is the function ovpn-client.get_recommend_config of the file /cgi-bin/glc of 
  the component ovpn-client.so Native Plugin. Executing a manipulation of the 
  argument Hostname can lead to command injection. The attack can be executed 
  remotely. The exploit has been publicly disclosed and may be utilized. The 
  vendor was contacted early about this disclosure and confirmed the existence 
  of the vulnerability.
