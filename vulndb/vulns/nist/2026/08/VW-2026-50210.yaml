title: A flaw was found in the Seattle FilmWorks plugin in GIMP. When processing
  a specially crafted SFW image file, the plugin allocates a Variable-Length 
  Array (VLA) on the stack without integer overflow checks, causing an unbounded
  stack allocation. This issue leads to an application crash, resulting in a 
  denial of service.
