title: A security flaw has been discovered in eyaushev swagger-testcase-mcp 
  5babb27c951fb404bc2b25ec80593616e49054e5. This vulnerability affects the 
  function loadSource of the file src/utils/swagger-parser.ts of the component 
  fetch_swagger. Performing a manipulation results in server-side request 
  forgery. The attack is possible to be carried out remotely. The exploit has 
  been released to the public and may be used for attacks. This product adopts a
  rolling release strategy to maintain continuous delivery. Therefore, version 
  details for affected or updated releases cannot be specified. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
