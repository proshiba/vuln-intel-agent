title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix invalid free tracking in ext4_xattr_move_to_block()\n\nIn ext4_xattr_move_to_block(),
  the value of the extended attribute\nwhich we need to move to an external block
  may be allocated by\nkvmalloc() if the value is stored in an external inode.  So
  at the end\nof the function the code tried to check if this was the case by\ntesting
  entry->e_value_inum.\n\nHowever, at this point, the pointer to the xattr entry is
  no longer\nvalid, because it was removed from the original location where it had\n\
  been stored.  So we could end up calling kvfree() on a pointer which\nwas not allocated
  by kvmalloc(); or we could also potentially leak\nmemory by not freeing the buffer
  when it should be freed.  Fix this by\nstoring whether it should be freed in a separate
  variable."
