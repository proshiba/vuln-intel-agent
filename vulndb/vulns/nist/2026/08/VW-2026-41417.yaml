title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  hda: cs35l41: validate and free ACPI mute object\n\ncs35l41_get_acpi_mute_state()
  evaluates a _DSM method to get the ACPI\nmute state and reads the first byte from
  the returned object.\n\nHowever, the returned ACPI object is owned by the caller
  and is never\nfreed after use, so each successful query leaks the _DSM result object.\n\
  \nThe code also assumes that the returned object is a buffer with at least\none
  byte. A malformed firmware response can return a different object\ntype or an empty
  buffer, and the direct ret->buffer.pointer dereference\ncan then access an invalid
  pointer.\n\nUse the typed _DSM helper, validate that the returned buffer contains
  at\nleast one byte, and free the ACPI object after reading it."
