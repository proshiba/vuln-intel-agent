title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  igmp: Fix potential UAF in igmp_gq_start_timer()\n\nA race condition exists between
  device teardown (inetdev_destroy) and\nincoming IGMP query processing (igmp_rcv),
  leading to a Use-After-Free\nin the IGMP timer callback.\n\nDuring device destruction,
  inetdev_destroy() drops the primary reference\nto in_device, which can drop its
  refcount to 0. The actual freeing of\nin_device memory is deferred via RCU (using
  call_rcu()).\n\nConcurrently, igmp_rcv() runs under RCU read lock and obtains the\n\
  in_device pointer. Because the memory is RCU-protected, CPU-0 can safely\ndereference
  in_device even if its refcount has hit 0.\n\nHowever, if CPU-0 calls igmp_gq_start_timer()
  and re-arms the timer, it\nattempts to acquire a reference using in_dev_hold().
