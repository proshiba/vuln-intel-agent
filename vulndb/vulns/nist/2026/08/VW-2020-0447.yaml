title: "A remote code execution vulnerability exists in Visual Studio Code when the
  Python extension loads configuration files after opening a project. An attacker
  who successfully exploited the vulnerability could run arbitrary code in the context
  of the current user. If the current user is logged on with administrative user rights,
  an attacker could take control of the affected system. An attacker could then install
  programs; view, change, or delete data; or create new accounts with full user rights.\n\
  To exploit this vulnerability, an attacker would need to convince a target to clone
  a repository and open it in Visual Studio Code with the Python extension installed.
  Attacker-specified code would execute when the target opened the integrated terminal.\n\
  The update address the vulnerability by modifying the way Visual Studio Code Python
  extension handles environment variables."
