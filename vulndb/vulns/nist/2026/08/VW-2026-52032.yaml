title: "Loop with Unreachable Exit Condition (Infinite Loop) vulnerability in ash-project
  ash_ai allows an attacker who can influence a model's output to hang the tool loop
  and drive unbounded, repeated model requests.\n\nAshAi.ToolLoop classifies a model
  response of :tool_calls, then filters the calls through normalize_tool_calls/2 and
  unprocessed_tool_calls/2. Both can empty the list: a call missing a valid name,
  or one reusing a tool_call_id that already has a result in history, is dropped.
  With an empty list the loop appended nothing and recursed with a byte-identical
  message list, so the conversation never advanced and the same request was re-sent
  every iteration. Under the supported max_iterations: :infinity this never terminated;
  otherwise it exhausted the full budget. Prompt-injected content can make the model
  re-emit a spent tool_call_id. The fix treats an empty post-filter list as terminal.\n\
  \nThis issue affects ash_ai: from 0.6.0 before 1.0.0."
