title: "In the Linux kernel, the following vulnerability has been resolved:\n\nDrivers:
  hv: vmbus: Don't free ring buffers that couldn't be re-encrypted\n\nIn CoCo VMs
  it is possible for the untrusted host to cause\nset_memory_encrypted() or set_memory_decrypted()
  to fail such that an\nerror is returned and the resulting memory is shared. Callers
  need to\ntake care to handle these errors to avoid returning decrypted (shared)\n\
  memory to the page allocator, which could lead to functional or security\nissues.\n\
  \nThe VMBus ring buffer code could free decrypted/shared pages if\nset_memory_decrypted()
  fails. Check the decrypted field in the struct\nvmbus_gpadl for the ring buffers
  to decide whether to free the memory."
