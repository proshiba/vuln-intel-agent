title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: mvm: fix double free on tx path.\n\nWe see kernel crashes and lockups and
  KASAN errors related to ax210\nfirmware crashes.  One of the KASAN dumps pointed
  at the tx path,\nand it appears there is indeed a way to double-free an skb.\n\n\
  If iwl_mvm_tx_skb_sta returns non-zero, then the 'skb' sent into the\nmethod will
  be freed.  But, in case where we build TSO skb buffer,\nthe skb may also be freed
  in error case.  So, return 0 in that particular\nerror case and do cleanup manually.\n\
  \nBUG: KASAN: use-after-free in __list_del_entry_valid+0x12/0x90\niwlwifi 0000:06:00.0:
  0x00000000 | tsf hi\nRead of size 8 at addr ffff88813cfa4ba0 by task btserver/9650\n\
  \nCPU: 4 PID: 9650 Comm: btserver Tainted: G        W         5.19.8+ #5\niwlwifi
  0000:06:00.0: 0x00000000 | time gp1\nHardware name: Default string Default string/SKYBAY,
  BIOS 5.12 02/19/2019\nCall Trace:\n <TASK>\n dump_stack_lvl+0x55/0x6d\n print_report.cold.12+0xf2/0x684\n\
  iwlw"
