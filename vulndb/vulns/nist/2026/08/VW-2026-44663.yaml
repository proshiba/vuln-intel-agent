title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Replace waitqueue and flag with completion\n\nThe driver previously used a waitqueue
  along with an explicit\nrequest_done flag, but without proper barriers around request_done.\n\
  \nAn earlier patch by Gui-Dong Han <hanguidong02@gmail.com> attempted\nto fix this
  by adding the missing memory barriers. Rather than\nadding the barriers, this patch
  replaces the waitqueue+flag with\na completion, which is designed for this exact
  purpose."
