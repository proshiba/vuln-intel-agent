title: CyberPanel 2.4.3, fixed in commit eca0c3c, contains an authenticated 
  command injection vulnerability in the remote backup transfer feature that 
  allows authenticated attackers to execute arbitrary OS commands by controlling
  a remote server's API response. Attackers can inject malicious commands 
  through a crafted directory name in the remote server's API response, which 
  bypasses security middleware validation and is passed unsanitized to the OS 
  command execution function.
