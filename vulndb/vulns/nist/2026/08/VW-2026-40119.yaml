title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix double-free in SMB2_close() replay\n\nA response-bearing attempt can
  return a replayable error and free its\nresponse buffer. If SMB2_close_init() fails
  before the next send, cleanup\nretains the previous buffer type and frees that response
  again.\n\nReset response bookkeeping before each attempt to prevent the stale free."
