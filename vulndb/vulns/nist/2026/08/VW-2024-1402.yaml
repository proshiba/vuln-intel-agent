  the codec entry for the ETDM1_OUT_BE\ndai link entirely instead of replacing it
  with COMP_EMPTY(). This worked\nby accident as the remaining COMP_EMPTY() platform
  entry became the codec\nentry, and the platform entry became completely empty, effectively
