title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  gro: fix double aggregation of flush-marked skbs\n\nCommit 0ab03f353d36 (\"net-gro:
  Fix GRO flush when receiving a GSO\npacket.\") added a flush check to skb_gro_receive(),
  but\nskb_gro_receive_list() lacks the same validation.\n\nAs a result, packets marked
  with NAPI_GRO_CB(skb)->flush may still be\nre-aggregated.\n\nThis allows already-GRO'd
  packets with existing frag_list to be\nre-aggregated into a new GRO session, corrupting
  the frag_list chain\nstructure. When skb_segment() attempts to unpack these malformed
  packets,\nit encounters invalid state and triggers a kernel panic.\n\nScenario (Tethering/Device
  forwarding):\n  1. Driver: Generated aggregated packet P1 via LRO with frag_list\n\
  \  2. Dev A: Receives aggregated fraglist packet and flush flag set\n  3. Dev A:
  Re-enters GRO, skb_gro_receive_list() is called\n  4. Missing flush check allows
  re-aggregation despite flush flag\n  5. Frag_list chain becomes corrupted (loops
