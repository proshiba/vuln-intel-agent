title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigc:
  Fix Kernel Panic during ndo_tx_timeout callback\n\nThe Xeon validation group has
  been carrying out some loaded tests\nwith various HW configurations, and they have
  seen some transmit\nqueue time out happening during the test. This will cause the\n\
  reset adapter function to be called by igc_tx_timeout().\nSimilar race conditions
  may arise when the interface is being brought\ndown and up in igc_reinit_locked(),
  an interrupt being generated, and\nigc_clean_tx_irq() being called to complete the
  TX.\n\nWhen the igc_tx_timeout() function is invoked, this patch will turn\noff
  all TX ring HW queues during igc_down() process. TX ring HW queues\nwill be activated
  again during the igc_configure_tx_ring() process\nwhen performing the igc_up() procedure
  later.\n\nThis patch also moved existing igc_disable_tx_ring_hw() to avoid using\n\
  forward declaration.\n\nKernel trace:\n[ 7678.747813] ------------[ cut here ]------------\n\
  [ 7678.757914] NETDEV "
