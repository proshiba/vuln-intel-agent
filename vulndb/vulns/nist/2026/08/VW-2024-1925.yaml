title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  fix possible stall on recvmsg()\n\nrecvmsg() can enter an infinite loop if the caller
  provides the\nMSG_WAITALL, the data present in the receive queue is not sufficient
  to\nfulfill the request, and no more data is received by the peer.\n\nWhen the above
  happens, mptcp_wait_data() will always return with\nno wait, as the MPTCP_DATA_READY
  flag checked by such function is\nset and never cleared in such code path.\n\nLeveraging
  the above syzbot was able to trigger an RCU stall:\n\nrcu: INFO: rcu_preempt self-detected
  stall on CPU\nrcu:    0-...!: (10499 ticks this GP) idle=0af/1/0x4000000000000000
  softirq=10678/10678 fqs=1\n        (t=10500 jiffies g=13089 q=109)\nrcu: rcu_preempt
  kthread starved for 10497 jiffies! g13089 f0x0 RCU_GP_WAIT_FQS(5) ->state=0x0 ->cpu=1\n\
  rcu:    Unless rcu_preempt kthread gets sufficient CPU time, OOM is now expected
  behavior.\nrcu: RCU grace-period kthread stack dump:\ntask:rcu_preempt     state:R\
  \  runn"
