title: A vulnerability was identified in UTT HiPER 1250GW up to 
  v3.2.7-210907-180535. The impacted element is the function strcpy of the file 
  /goform/getOneApConfTempEntry. The manipulation of the argument tempName leads
  to stack-based buffer overflow. The attack can be initiated remotely. The 
  exploit is publicly available and might be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
