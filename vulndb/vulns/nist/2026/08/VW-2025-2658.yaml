title: "In the Linux kernel, the following vulnerability has been resolved:\n\nibmvnic:
  fix race between xmit and reset\n\nThere is a race between reset and the transmit
  paths that can lead to\nibmvnic_xmit() accessing an scrq after it has been freed
  in the reset\npath. It can result in a crash like:\n\n\tKernel attempted to read
  user page (0) - exploit attempt? (uid: 0)\n\tBUG: Kernel NULL pointer dereference
  on read at 0x00000000\n\tFaulting instruction address: 0xc0080000016189f8\n\tOops:
  Kernel access of bad area, sig: 11 [#1]\n\t...\n\tNIP [c0080000016189f8] ibmvnic_xmit+0x60/0xb60
  [ibmvnic]\n\tLR [c000000000c0046c] dev_hard_start_xmit+0x11c/0x280\n\tCall Trace:\n\
  \t[c008000001618f08] ibmvnic_xmit+0x570/0xb60 [ibmvnic] (unreliable)\n\t[c000000000c0046c]
  dev_hard_start_xmit+0x11c/0x280\n\t[c000000000c9cfcc] sch_direct_xmit+0xec/0x330\n\
  \t[c000000000bfe640] __dev_xmit_skb+0x3a0/0x9d0\n\t[c000000000c00ad4] __dev_queue_xmit+0x394/0x730\n\
  \t[c008000002db813c] __bond_start_xmit+0x254/0x450 [bonding]\n\t[c008000002db8378]
  bond_start_x"
