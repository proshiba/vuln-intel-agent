title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  not change 0-byte $DATA attribute to non-resident\n\nWhen ntfs_resident_attr_resize()
  cannot grow a resident attribute in\nplace, it retries after converting other resident
  attributes to\nnon-resident to free space in the MFT recrord.\n\nDo not select zero-length
  resident $DATA attributes for this conversion.\nfsck treats 0-byte non-resident
  $DATA attribute as corruptions."
