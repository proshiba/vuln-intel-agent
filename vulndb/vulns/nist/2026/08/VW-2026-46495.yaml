title: Lemur manages TLS certificate creation. Prior to 1.9.3, an authority-role
  member could update acme_url through PUT /api/1/authorities/ without 
  revalidation and direct setup_acme_client_no_retry to an attacker-controlled 
  ACME server. ACME directory and order responses contain newNonce, newOrder, 
  authorizations, and finalize URLs chosen by that server. The Lemur ClientV2 
  followed those URLs without requiring their host to match the configured 
  directory host, allowing JWS-signed requests to internal services or cloud 
  metadata endpoints. The issue required an ACME authority and a user authorized
  for that authority, but did not require global administrator privileges. The 
  fix revalidates updates and introduces _PinnedClientNetwork to enforce a 
  single allowed host for the complete ACME flow. This issue is fixed in version
  1.9.3.
