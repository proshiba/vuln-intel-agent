title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ks8851: Handle softirqs at the end of IRQ thread to fix hang\n\nThe ks8851_irq()
  thread may call ks8851_rx_pkts() in case there are\nany packets in the MAC FIFO,
  which calls netif_rx(). This netif_rx()\nimplementation is guarded by local_bh_disable()
  and local_bh_enable().\nThe local_bh_enable() may call do_softirq() to run softirqs
  in case\nany are pending. One of the softirqs is net_rx_action, which ultimately\n\
  reaches the driver .start_xmit callback. If that happens, the system\nhangs. The
  entire call chain is below:\n\nks8851_start_xmit_par from netdev_start_xmit\nnetdev_start_xmit
  from dev_hard_start_xmit\ndev_hard_start_xmit from sch_direct_xmit\nsch_direct_xmit
  from __dev_queue_xmit\n__dev_queue_xmit from __neigh_update\n__neigh_update from
  neigh_update\nneigh_update from arp_process.constprop.0\narp_process.constprop.0
  from __netif_receive_skb_one_core\n__netif_receive_skb_one_core from process_backlog\n\
  process_backlog from"
