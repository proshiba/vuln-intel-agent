title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ngbe: fix NULL pointer dereference in non-MSI-X interrupt enabling\n\nIn non-MSI-X
  mode (such as legacy INTx or single MSI), wx->msix_entry is\nnot allocated or initialized.
  Calling NGBE_INTR_MISC(wx) dereferences\nwx->msix_entry->entry, leading to a NULL
  pointer dereference crash.\n\nThis issue was introduced by fixing the IRQ vector
  when the number of\nVFs is 7. Fix the issue by explicitly checking `pdev->msix_enabled`
  to\ndetermine the correct vector index.\n\nAdditionally, as a side fix, set the
  interrupt mask to BIT(0) for the\nnon-MSI-X fallback. In MSI/INTx mode, the MISC
  and queue interrupts\nshare vector 0, and the WX_PX_MISC_IVAR register is only valid
  in the\nMSI-X case. Thus, BIT(0) is the correct mask for the miscellaneous cause\n\
  when MSI-X is disabled."
