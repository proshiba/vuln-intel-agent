title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_taprio: Replace direct dequeue call with peek and qdisc_dequeue_peeked\n\nWhen
  taprio's software path peeks a non-work-conserving child qdisc, the\nchild stashes
  the peeked skb in its gso_skb; taprio_dequeue_from_txq()\nthen takes the packet
  with a direct child ->dequeue() call, which ignores\nthat stash, orphans the peeked
  skb and desyncs the child's qlen/backlog.\nWith a qfq child this re-enters the child
  on an emptied list and\ndereferences NULL, panicking the kernel from softirq on
  ordinary egress.\n\nTake the packet through qdisc_dequeue_peeked(), as sch_red and
  sch_sfb\nnow do. The helper returns the child's stashed skb first and is a no-op\n\
  when there is none, so a work-conserving child is unaffected and the\ngated path
  now consumes the skb whose length was charged to the budget."
