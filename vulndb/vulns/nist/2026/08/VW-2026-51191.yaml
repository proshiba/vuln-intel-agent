title: A security flaw has been discovered in RooCodeInc Roo-Code up to 3.51.1. 
  Affected by this vulnerability is the function optimizeQuery of the file 
  src/utils/helpers.ts of the component CodeIndexManager. Performing a 
  manipulation results in code injection. Remote exploitation of the attack is 
  possible. The exploit has been released to the public and may be used for 
  attacks. Multiple isses were reported to the vendor beforehand. They explain, 
  that "they all apply to Roo Code, a project we no longer support - the 
  repository was archived a while ago, and we don't encourage anyone to use it."
  This vulnerability only affects products that are no longer supported by the 
  maintainer.
