title: An insecure direct object reference vulnerability in Attendize through 
  commit 9289acb allows any authenticated event organiser to inject attendees 
  and orders into events belonging to other accounts via the postInviteAttendee 
  endpoint. The endpoint loads the target event by ID without scoping the query 
  to the authenticated organiser account. An attacker can modify event data and 
  financial records across account boundaries.
