title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/nldev:
  Fix locking when accessing mr->pd\n\nSashiko points out that, due to rereg_mr, the
  PD is actually variable and\nall the touches in nldev are racy.\n\nUse mr->device
  instead of mr->pd->device.\n\nGetting the PD restrack ID is more tricky. To avoid
  disturbing all the\nhappy paths, add an rdma_restrack_sync() operation which is
  sort of like\nflush_workqueue() or synchronize_irq(): after it returns, all the
  old\nnldev touches to the mr are gone and everything sees the new PD. This\nmakes
  it safe to reach into the PD pointer."
