title: "A Server-Side Request Forgery (SSRF) vulnerability existed in Lookyloo's PlaywrightCapture
  when the only_global_lookup option was enabled.\n\nPlaywrightCapture implements
  this option to prevent captures from accessing local, loopback, or otherwise non-public
  network resources. However, favicon retrieval was performed separately from the
  browser request-routing protections. Favicon URLs extracted from rendered HTML were
  resolved and subsequently fetched directly using an aiohttp.ClientSession.\n\nAn
  attacker able to supply or control a web page processed by PlaywrightCapture could
  include a crafted favicon reference, for example pointing to a loopback address,
  private IP address, or another resource reachable only from the PlaywrightCapture
