title: The Velociraptor verify() VQL function allows a user to verify an 
  artifact for syntatic and other issues. Due to an implementation fault in this
  VQL function, the global artifact repository is used which allows callers to 
  overwrite existing artifacts without the required permissions.  The attacker 
  need only have the NOTEBOOK_EDIT permission (e.g. an analyst role) to be able 
  to call this function.
