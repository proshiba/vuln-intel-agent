title: FUXA is a web-based Process Visualization (SCADA/HMI/Dashboard) software.
  Prior to 1.3.3, DELETE /api/roles removes role definitions through 
  server/runtime/users/usrstorage.js but does not remove the deleted role 
  identifier from each user's info.roles array or the runtime usersMap cache. If
  a permission configuration still references that identifier, an affected user 
  can retain authorization rights that an administrator intended to revoke, 
  causing residual privilege, inconsistent access-control state, and misleading 
  audit results. This issue is fixed in version 1.3.3.
