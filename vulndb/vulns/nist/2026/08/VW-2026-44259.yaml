title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Use caller client for debug BO sync\n\namdxdna_drm_sync_bo_ioctl() looks up args->handle
  in the ioctl caller's\ndrm_file. For SYNC_DIRECT_FROM_DEVICE, it then calls\namdxdna_hwctx_sync_debug_bo(),
  but passes abo->client.\n\namdxdna_hwctx_sync_debug_bo() uses the passed client
  both as the handle\nnamespace for debug_bo_hdl and as the owner of the hardware
  context xarray.\nThose must match the file that supplied args->handle. The BO's
  stored\nclient pointer is object state, not the ioctl context.\n\nPass filp->driver_priv
  instead, matching the original handle lookup."
