title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndebugobjects:
  Plug race against a concurrent OOM disable\n\nsyzbot reported a puzzling splat:\n\
  \n   WARNING: kernel/time/hrtimer.c:443 at stub_timer+0xa/0x20\n\nstub_timer() is
  installed as timer callback function in\nhrtimer_fixup_assert_init(), which is invoked
  when\ndebug_object_assert_init() can't find a shadow object. In that case debug\n\
  objects emits a warning about it before invoking the fixup.\n\nThough the provided
  console log lacks this warning and instead has the\nfollowing a few seconds before
  the splat:\n\n     ODEBUG: Out of memory. ODEBUG disabled\n\nSo the object was looked
  up in debug_object_assert_init() and the lookup\nfailed due a concurrent out of
  memory situation which disabled debug\nobjects and freed the shadow objects:\n\n\
  debug_object_assert_init()\n        if (!debug_objects_enabled)\n        \treturn;\
  \                         obj = alloc();\n                \t\t\t\tif (!obj) {\n\t
  \t\t\t\t\t\t// Out of memory\n                   "
