title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  drop_monitor: fix info leak in NET_DM_ATTR_PAYLOAD\n\nnet_dm_packet_report_fill()
  and net_dm_hw_packet_report_fill() open code\nthe NET_DM_ATTR_PAYLOAD attribute
  to avoid zeroing the packet payload\nbefore overwriting it with skb_copy_bits().\n\
  \nskb_put() reserves nla_total_size(payload_len), i.e. the header plus the\nNLA_ALIGN()
  padding, but only payload_len bytes are copied in. When\npayload_len is not a multiple
  of 4 the 1-3 padding bytes are never\ninitialized and are leaked to user space inside
  the netlink message.\n\nKMSAN confirms the leak for the software path when the packet
  payload\nlength is not 4-byte aligned:\n\n  BUG: KMSAN: kernel-infoleak in _copy_to_iter\n\
  \   _copy_to_iter\n   __skb_datagram_iter\n   skb_copy_datagram_iter\n   netlink_recvmsg\n\
  \   sock_recvmsg\n   __sys_recvfrom\n  Uninit was created at:\n   kmem_cache_alloc_node_noprof\n\
  \   __alloc_skb\n   net_dm_packet_work\n  Bytes 173-175 of 176 are uninitialized\n\
  \nUse _"
