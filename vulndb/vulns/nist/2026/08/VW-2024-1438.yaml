title: "In the Linux kernel, the following vulnerability has been resolved:\n\nARM:
  9063/1: mm: reduce maximum number of CPUs if DEBUG_KMAP_LOCAL is enabled\n\nThe
  debugging code for kmap_local() doubles the number of per-CPU fixmap\nslots allocated
  for kmap_local(), in order to use half of them as guard\nregions. This causes the
  fixmap region to grow downwards beyond the start\nof its reserved window if the
  supported number of CPUs is large, and collide\nwith the newly added virtual DT
  mapping right below it, which is obviously\nnot good.\n\nOne manifestation of this
  is EFI boot on a kernel built with NR_CPUS=32\nand CONFIG_DEBUG_KMAP_LOCAL=y, which
  may pass the FDT in highmem, resulting\nin block entries below the fixmap region
  that the fixmap code misidentifies\nas fixmap table entries, and subsequently tries
  to dereference using a\nphys-to-virt translation that is only valid for lowmem.
  This results in a\ncryptic splat such as the one below.\n\n  ftrace: allocating
  45548 entries in 89 pages\n  8<--- cut here"
