title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nft_lookup: fix catchall element handling with inverted lookups\n\nnft_lookup_eval()
  decides whether a lookup matched (`found`) from the\ndirect set lookup and priv->invert
  before falling back to the\ncatchall element used by interval sets (e.g. nft_set_rbtree)
  for the\nopen-ended default range. Since `found` is never recomputed after\n`ext`
  is replaced by the catchall lookup, inverted lookups\n(NFT_LOOKUP_F_INV, \"!= @set\"\
  ) can wrongly match or wrongly skip the\ncatchall element, producing the wrong verdict.
  Fold the catchall\nlookup into `ext` before computing `found`, matching the order\n\
  already used by nft_objref_map_eval()."
