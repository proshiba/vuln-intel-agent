title: 'Vulnerability in the Oracle Hyperion Financial Reporting product of Oracle
  Hyperion (component: Server).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows low privileged attacker with logon to
  the infrastructure where Oracle Hyperion Financial Reporting executes to compromise
  Oracle Hyperion Financial Reporting.  Successful attacks of this vulnerability can
  result in  unauthorized creation, deletion or modification access to critical data
  or all Oracle Hyperion Financial Reporting accessible data as well as  unauthorized
  read access to a subset of Oracle Hyperion Financial Reporting accessible data.
  CVSS 3.1 Base Score 5.3 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:L/I:H/A:N).'
