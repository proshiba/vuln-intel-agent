title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  peak_usb: add bounds check for USB channel index\n\nThe channel control index ctrl_idx
  is derived from rx->len which comes\ndirectly from a device USB payload. The mask
  0x0f allows values 0-15, but\nthe array size of usb_if->dev[] is only 2. Values
  2-15 cause heap\nout-of-bounds read, eventually causing kernel panic in the IRQ
  context.\n\nAdd bounds checking for ctrl_idx before the array access in both\npcan_usb_pro_handle_canmsg()
  and pcan_usb_pro_handle_error()."
