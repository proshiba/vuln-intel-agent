title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_u32: reject invalid shift counts\n\nu32_match_it() executes rule-supplied shift
  operands on a 32-bit\nvalue. A malformed u32 rule can provide a shift count of 32
  or more,\ntriggering an undefined shift out-of-bounds during packet evaluation.\n\
  \nValidate XT_U32_LEFTSH and XT_U32_RIGHTSH operands in\nu32_mt_checkentry() and
  reject malformed rules before they reach the\npacket path."
