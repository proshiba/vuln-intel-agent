  can lead to denial of service via Excessive Allocation (CAPEC-130). An 
  authenticated user holding only read privileges on a single index can submit 
  one small, specially crafted search request that causes an excessively large 
  memory allocation, exhausting the JVM heap and terminating the affected node.
