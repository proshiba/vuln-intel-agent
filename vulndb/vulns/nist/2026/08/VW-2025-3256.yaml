title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  fix out-of-bounds access in tty_driver_lookup_tty()\n\nWhen specifying an invalid
  console= device like console=tty3270,\ntty_driver_lookup_tty() returns the tty struct
  without checking\nwhether index is a valid number.\n\nTo reproduce:\n\nqemu-system-x86_64
  -enable-kvm -nographic -serial mon:stdio \\\n-kernel ../linux-build-x86/arch/x86/boot/bzImage
  \\\n-append \"console=ttyS0 console=tty3270\"\n\nThis crashes with:\n\n[    0.770599]
  BUG: kernel NULL pointer dereference, address: 00000000000000ef\n[    0.771265]
  #PF: supervisor read access in kernel mode\n[    0.771773] #PF: error_code(0x0000)
  - not-present page\n[    0.772609] Oops: 0000 [#1] PREEMPT SMP PTI\n[    0.774878]
  RIP: 0010:tty_open+0x268/0x6f0\n[    0.784013]  chrdev_open+0xbd/0x230\n[    0.784444]\
  \  ? cdev_device_add+0x80/0x80\n[    0.784920]  do_dentry_open+0x1e0/0x410\n[  \
  \  0.785389]  path_openat+0xca9/0x1050\n[    0.785813]  do_filp_open+0xaa/0x150\n\
  [    0.786240]  file_open_"
