title: "In the Linux kernel, the following vulnerability has been resolved:\n\nMIPS:
  mm: Fix out-of-bounds write in maar_res_walk()\n\nmaar_res_walk() uses wi->num_cfg
  as the index into the fixed-size\nwi->cfg array, but checks whether the array is
  full only after it has\nfilled the selected entry. If walk_system_ram_range() reports
  more than\n16 memory ranges, the overflow call writes one struct maar_config past\n\
  the end of the array before WARN_ON() prevents num_cfg from advancing.\n\nMove the
  full-array check before taking the array slot and return non-zero\nwhen the scratch
  array is full, so walk_system_ram_range() terminates the\nwalk instead of invoking
  the callback for further ranges."
