title: OP-TEE OS through 4.10.0, fixed in commit 7b8b494, contains a buffer 
  underwrite vulnerability in the RSA NOPAD encrypt and decrypt operations 
  within the mbedTLS software backend and SE050 hardware driver that allows a 
  malicious Trusted Application to corrupt secure-world heap memory by supplying
  an input length exceeding the RSA modulus size. When src_len exceeds rsa_len, 
  the subtraction expression wraps to a large unsigned value, causing a 
  subsequent memcpy to write attacker-controlled data before the destination 
  buffer in S-EL1 secure-world heap memory.
