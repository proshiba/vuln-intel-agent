title: Missing authorization in PostgreSQL logical decoding allows a 
  non-superuser holding REPLICATION privilege to dlopen any file visible to the 
  operating system account running the server, via the choice of logical 
  decoding plugin.  This in turn runs arbitrary code as that account.  Versions 
  before PostgreSQL 18.5, 17.11, 16.15, 15.19, and 14.24 are affected.
