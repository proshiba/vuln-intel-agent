title: A vulnerability was identified in danpros HTMLy up to 3.1.1. Affected by 
  this issue is the function unlink of the file /system/htmly.php of the 
  component Delete Username Endpoint. Such manipulation of the argument File 
  leads to path traversal. The attack can be launched remotely. The exploit is 
  publicly available and might be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
