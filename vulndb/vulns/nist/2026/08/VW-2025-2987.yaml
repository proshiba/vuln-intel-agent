title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix sysfs interface lifetime\n\nThe current nilfs2 sysfs support has issues with
  the timing of creation\nand deletion of sysfs entries, potentially leading to null
  pointer\ndereferences, use-after-free, and lockdep warnings.\n\nSome of the sysfs
  attributes for nilfs2 per-filesystem instance refer to\nmetadata file \"cpfile\"\
  , \"sufile\", or \"dat\", but\nnilfs_sysfs_create_device_group that creates those
  attributes is executed\nbefore the inodes for these metadata files are loaded, and\n\
  nilfs_sysfs_delete_device_group which deletes these sysfs entries is\ncalled after
  releasing their metadata file inodes.\n\nTherefore, access to some of these sysfs
  attributes may occur outside of\nthe lifetime of these metadata files, resulting
  in inode NULL pointer\ndereferences or use-after-free.\n\nIn addition, the call
  to nilfs_sysfs_create_device_group() is made during\nthe locking period of the semaphore
