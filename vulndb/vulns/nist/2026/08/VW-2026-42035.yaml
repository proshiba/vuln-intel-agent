title: A path traversal vulnerability in Intelliants Subrion CMS through 4.2.1 
  allows authenticated administrators to delete arbitrary files on the server 
  via the admin panel file deletion endpoint. The endpoint passes a 
  user-supplied file path directly to unlink() without sanitization or path 
  canonicalization. An authenticated administrator can delete sensitive system 
  files outside the web root, potentially causing server instability or 
  facilitating further attacks.
