title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_gact, act_police: range check the fallback control action\n\ntcf_action_check_ctrlact()
  range checks the primary control action:\n\n\tif (!opcode)\n\t\tret = action > TC_ACT_VALUE_MAX
  ? -EINVAL : 0;\n\nTC_ACT_VALUE_MAX is TC_ACT_TRAP, so kernel-internal verdicts above
  it\ncannot be set that way. But act_gact and act_police each carry a second,\nindependent
  control action supplied by user space that never reaches that\nhelper - TCA_GACT_PROB.paction
  and TCA_POLICE_RESULT. Both only reject\nTC_ACT_GOTO_CHAIN, so any other value is
  stored verbatim and returned\nverbatim from the action.\n\nIn particular user space
  can store TC_ACT_CONSUMED, which is\nTC_ACT_VALUE_MAX + 1 and is deliberately not
  part of the UAPI value\nrange. That verdict tells every caller the action took ownership
  of the\nskb, so nobody frees it: sch_handle_ingress(), sch_handle_egress() and\n\
