title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_tunnel_key: Defer dst_release to RCU callback\n\nFix a race-condition use-after-free
  in tunnel_key_release_params().\n\nThe function releases the metadata_dst of the
  old params synchronously\nvia dst_release() while deferring the params struct free
  with\nkfree_rcu(). A concurrent tunnel_key_act() reader on the datapath may\nstill
  hold the old params pointer (under rcu_read_lock_bh) and proceed\nto call dst_clone(&params->tcft_enc_metadata->dst)
  after the writer's\ndst_release has already pushed the dst's rcuref to RCUREF_DEAD.\n\
  \nzdi-disclosures@trendmicro.com produced a poc which i (and Victor) verified\n\
  that KASAN reports:\n\n==================================================================\n\
  BUG: KASAN: slab-use-after-free in instrument_atomic_read_write include/linux/instrumented.h:112\n\
  BUG: KASAN: slab-use-after-free in atomic_sub_return_release include/linux/atomic/atomic-instrumented.h:326\n\
  BUG: KASAN: slab-use-a"
