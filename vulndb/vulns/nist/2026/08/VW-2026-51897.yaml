title: "### Summary\n\n\n\nWhen `qs.parse` is called with `comma: true` and `throwOnLimitExceeded:
  true`, a comma-separated value under a bracket-push key (`a[]=1,2,3,4`) is split
  into an array without being compared against `arrayLimit`, while the same value
  under a flat key (`a=1,2,3,4`), an indexed key (`a[0]=`), a nested key (`a[b]=`),
  or a dotted key (`a.b=` with `allowDots`) throws the documented `RangeError`. A
  single parameter such as `a[]=1,2,2,...` therefore produces an inner array of arbitrary
  length even though the caller opted into the hard limit. This is the `[]=` key form
  that the fix for CVE-2026-2391 (qs 6.14.2) did not cover.\n\n\n\n### Details\n\n\
  \n\nIn `lib/parse.js`, a comma-separated value under a `[]=` key is split and then
  wrapped as a single nested element (`val = [val]`, so that each `a[]=x,y` group
  counts as one element of the outer array). The `arrayLimit` check that 6.14.2 added
  for comma values runs after that wrap, so for `[]=` parts it only ever saw the wrapper
  of length 1."
