title: Scriban versions from 3.0.0 through 7.2.5 contain a denial of service 
  vulnerability in the ScriptRange.Multiply operator that bypasses LoopLimit 
  when the left operand is a lazy sequence. Attackers can supply templates with 
  array multiplication on lazy sequences to execute billions of uncharged 
  iterations, pinning CPU cores and exhausting garbage collection resources even
  when LoopLimit is set to 1.
