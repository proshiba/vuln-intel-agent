title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  fix to do sanity check on block address in f2fs_do_zero_range()\n\nAs Yanming reported
  in bugzilla:\n\nhttps://bugzilla.kernel.org/show_bug.cgi?id=215894\n\nI have encountered
  a bug in F2FS file system in kernel v5.17.\n\nI have uploaded the system call sequence
  as case.c, and a fuzzed image can\nbe found in google net disk\n\nThe kernel should
  enable CONFIG_KASAN=y and CONFIG_KASAN_INLINE=y. You can\nreproduce the bug by running
  the following commands:\n\nkernel BUG at fs/f2fs/segment.c:2291!\nCall Trace:\n\
  \ f2fs_invalidate_blocks+0x193/0x2d0\n f2fs_fallocate+0x2593/0x4a70\n vfs_fallocate+0x2a5/0xac0\n\
  \ ksys_fallocate+0x35/0x70\n __x64_sys_fallocate+0x8e/0xf0\n do_syscall_64+0x3b/0x90\n\
  \ entry_SYSCALL_64_after_hwframe+0x44/0xae\n\nThe root cause is, after image was
  fuzzed, block mapping info in inode\nwill be inconsistent with SIT table, so in
  f2fs_fallocate(), it will cause\npanic when updating SIT with invalid blkaddr.\n\
