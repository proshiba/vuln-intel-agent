title: "Pandora contains a denial-of-service vulnerability in its handling of DAA
  (Direct Access Archive) files. When extracting the internal ISO image from a DAA
  archive, compressed chunks were decompressed using zlib.decompress() without enforcing
  a limit on the resulting uncompressed data.\n\n\nAn attacker able to submit a crafted
  DAA file containing highly compressed data could cause Pandora to decompress a relatively
  small input into a very large amount of data in memory. Because the decompressed
  chunks are accumulated to construct the internal ISO image, this could result in
  excessive memory consumption and potentially CPU exhaustion, causing the extraction
  worker to become unresponsive, terminate, or affect the availability of the Pandora
  service.\n\n\nThe patch introduces bounded decompression using decompressobj().decompress()
  with max_extracted_filesize, verifies the cumulative size of decompressed chunks,
  and raises a dedicated ZipBomb exception when the configured limit is exceeded.
  Pand"
