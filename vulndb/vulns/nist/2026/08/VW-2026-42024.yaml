title: An SQL injection vulnerability in Pimcore admin-ui-classic-bundle through
  version 2.3 allows authenticated backend users to execute arbitrary SQL via 
  the DataObject grid id column filter. The filter value is concatenated 
  directly into the SQL WHERE clause without parameterization. An attacker with 
  backend access can exfiltrate or modify all database contents.
