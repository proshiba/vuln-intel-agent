title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  nullify cq->dbg pointer in mlx5_debug_cq_remove()\n\nPrior to this patch in case
  mlx5_core_destroy_cq() failed it proceeds\nto rest of destroy operations. mlx5_core_destroy_cq()
  could be called again\nby user and cause additional call of mlx5_debug_cq_remove().\n\
  cq->dbg was not nullify in previous call and cause the crash.\n\nFix it by nullify
  cq->dbg pointer after removal.\n\nAlso proceed to destroy operations only if FW
  return 0\nfor MLX5_CMD_OP_DESTROY_CQ command.\n\ngeneral protection fault, probably
  for non-canonical address 0x2000300004058: 0000 [#1] SMP PTI\nCPU: 5 PID: 1228 Comm:
  python Not tainted 5.15.0-rc5_for_upstream_min_debug_2021_10_14_11_06 #1\nHardware
  name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS rel-1.13.0-0-gf21b5a4aeb02-prebuilt.qemu.org
  04/01/2014\nRIP: 0010:lockref_get+0x1/0x60\nCode: 5d e9 53 ff ff ff 48 8d 7f 70
  e8 0a 2e 48 00 c7 85 d0 00 00 00 02\n00 00 00 c6 45 70 00 fb 5d c3 c3 cc cc cc cc
  cc c"
