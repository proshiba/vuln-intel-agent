title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  dell-laptop: fix missing cleanups in init error path\n\ndell_init() initializes
  several resources after dell_setup_rfkill(),\nincluding the optional touchpad LED,
  keyboard backlight LED, battery\nhook, debugfs directory and dell-laptop notifier.\n\
  \nIf a later LED or backlight registration fails, the error path only\ntears down
  the battery hook and rfkill resources. This leaves the\nnotifier, debugfs directory,
  keyboard backlight LED and optional\ntouchpad LED registered after dell_init() returns
  an error.\n\nAdd the missing cleanup calls before tearing down rfkill."
