title: 'A vulnerability was detected in Webkul Bagisto up to 2.4.4. Impacted is an
  unknown function of the file /customer/account/rma/store. The manipulation of the
  argument rma_qty/resolution_type/rma_reason_id results in enforcement of behavioral
  workflow. The attack may be performed from remote. The exploit is now public and
  may be used. The vendor confirms: "The reported issues were already identified through
  our internal security assessment process prior to this notification and are being
  handled through our established internal security and development lifecycle. Some
  of these items have already been addressed, while the remaining items are planned
  for resolution in upcoming product releases."'
