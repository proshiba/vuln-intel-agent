title: "Kenwood DNR1007XR vCardParser Heap-based Buffer Overflow Code Execution Vulnerability.
  This vulnerability allows physically present attackers to execute arbitrary code
  on affected installations of Kenwood DNR1007XR devices. Authentication is not required
  to exploit this vulnerability.\n\nThe specific flaw exists within the vCardParser
  class. The issue results from the lack of proper validation of a user-supplied string
  before copying it to a heap-based buffer. An attacker can leverage this vulnerability
  to execute code in the context of root. Was ZDI-CAN-28974."
