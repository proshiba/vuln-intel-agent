title: Reconmap's API applies a fallback authorization policy in 
  apps/api/app/Program.cs that requires an authenticated user holding the 
  administrator role, so controllers without their own attribute reject 
  anonymous callers. The report preview action in 
  apps/api/app/Controllers/ReportsController.cs carries [AllowAnonymous] and 
  therefore opts out of that policy. PreviewReport loads the Project row named 
  by the id path segment, loads the linked Organisation through the project's 
  ClientId, and renders both into default-report-template.html, which prints the
  project name and description together with the client organisation's name, 
  address and URL. No authentication, project membership or role check is 
  performed. Because the id is the auto-increment primary key of the project 
