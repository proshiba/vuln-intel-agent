title: A flaw was found in the must-gather component of Red Hat Advanced Cluster
  Management for Kubernetes. The cluster Proxy object is dumped in raw form, 
  bypassing the oc inspect redaction that would normally sanitize sensitive 
  fields. This exposes proxy basic-auth credentials in the must-gather archive, 
  potentially disclosing sensitive authentication information to anyone with 
  access to the archive.
