title: The The School Management – Education & Learning ERP plugin for WordPress
  is vulnerable to generic SQL Injection via 'order[0][dir]' Parameter in all 
  versions up to, and including, 5.4 due to insufficient escaping on the user 
  supplied parameter and lack of sufficient preparation on the existing SQL 
  query. This makes it possible for authenticated attackers, with custom-level 
  access and above, to append additional SQL queries into already existing 
  queries that can be used to extract sensitive information from the database. 
  This vulnerability is replicated across seven or more AJAX handlers including 
  wlsm-fetch-staff-classes, wlsm-fetch-notices, wlsm-fetch-subjects, 
  wlsm-fetch-inquiries, wlsm-fetch-staff-employee, and wlsm-fetch-payments, and 
  the missing nonce verification on several of these handlers also enables 
  CSRF-chained exploitation.
