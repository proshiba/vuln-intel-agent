title: The WP Photo Album Plus WordPress plugin before 9.2.09.002 does not check
  that the current user is allowed to upload into the album they target when it 
  processes a front-end upload, allowing any authenticated user, such as a 
  Subscriber, to upload files into albums owned by other users or by the 
  administrator. Exploitation requires the WP Photo Album Plus WordPress plugin 
  before 9.2.09.002's front-end user upload feature to be enabled, which is not 
  the default.
