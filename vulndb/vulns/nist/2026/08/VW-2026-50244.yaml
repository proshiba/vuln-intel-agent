title: "In the Linux kernel, the following vulnerability has been resolved:\n\naf_unix:
  Unlink scc_entry in unix_del_edge().\n\nKyle Zeng reported that GC could free a
  dead SCC partially.\n\nThe scenario is as follows:\n\n   1) Create two SCCs:\n\n\
  \       X -.   A <-> B\n       ^--'\n\n   2) Run the following concurrently:\n\n\
  \      2-1) send() sk-B to sk-B from sk-X\n      2-2) close() both A and B\n\nAt
  2-1), there is a small window where unix_add_edges()\npublishes a new edge (B <->
  B) to GC but its skb is not queued\nby skb_queue_tail().\n\nIf 2-2) completes before
  skb_queue_tail() and GC is triggered,\nit judges A <-> B as dead, but B is not freed
  because GC cannot\ncollect the not-yet-queued skb holding the B <-> B edge.\n\n\
  \       X -.   A <-> B -. This edge is visible\n       ^--'         ^..'  but skb
  is not\n\nThis itself is not a problem since the next GC run will judge\nB as dead
  as well and free it finally.\n\n       X -.   A <.> B -.\n       ^--'         ^--'\n\
  \nHowever, X's SCC forces the next GC to call unix_walk_s"
