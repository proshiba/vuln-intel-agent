title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  atlantic: eliminate double free in error handling logic\n\nDriver has a logic leak
  in ring data allocation/free,\nwhere aq_ring_free could be called multiple times
  on same ring,\nif system is under stress and got memory allocation error.\n\nRing
  pointer was used as an indicator of failure, but this is\nnot correct since only
  ring data is allocated/deallocated.\nRing itself is an array member.\n\nChanging
  ring allocation functions to return error code directly.\nThis simplifies error
  handling and eliminates aq_ring_free\non higher layer."
