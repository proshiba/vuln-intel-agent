title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  enetc: avoid buffer leaks on xdp_do_redirect() failure\n\nBefore enetc_clean_rx_ring_xdp()
  calls xdp_do_redirect(), each software\nBD in the RX ring between index orig_i and
  i can have one of 2 refcount\nvalues on its page.\n\nWe are the owner of the current
  buffer that is being processed, so the\nrefcount will be at least 1.\n\nIf the current
  owner of the buffer at the diametrically opposed index\nin the RX ring (i.o.w, the
  other half of this page) has not yet called\nkfree(), this page's refcount could
  even be 2.\n\nenetc_page_reusable() in enetc_flip_rx_buff() tests for the page\n\
  refcount against 1, and [ if it's 2 ] does not attempt to reuse it.\n\nBut if enetc_flip_rx_buff()
  is put after the xdp_do_redirect() call,\nthe page refcount can have one of 3 values.
  It can also be 0, if there\nis no owner of the other page half, and xdp_do_redirect()
  for this\nbuffer ran so far that it triggered a flush of the devmap/cpumap bulk\n\
  queu"
