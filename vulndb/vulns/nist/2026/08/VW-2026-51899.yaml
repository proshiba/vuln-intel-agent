title: "Improper Neutralization of Special Elements in Data Query Logic vulnerability
  in ash-project ash_sqlite allows an attacker who controls a get_path/2 segment to
  traverse into nested JSON the application never exposed, disclosing private or sensitive?
  embedded fields.\n\nAshSqlite.SqlImplementation builds the SQLite json_extract path
  with \"$.\" <> Enum.join(right, \".\"), so a single segment containing ., [, ],
  or $ re-interprets the JSON path (for example \"private.secret\" descends two levels
  instead of naming one key). The path is bound as a parameter, so this is confined
  to the JSON-path grammar rather than SQL. Any endpoint that lets user input reach
  a get_path segment (a common pick-a-field pattern) can read nested values it never
  meant to expose.\n\nThis issue affects ash_sqlite: from 0.1.2-rc.0 before 0.2.18."
