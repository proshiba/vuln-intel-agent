title: The Login & Register Forms  WordPress plugin before 3.2.5 does not 
  properly enforce the rate limit on its password-reset verification-code flow, 
  keying both the verification code and the per-source attempt counter on an 
  unauthenticated, client-controlled value, allowing unauthenticated attackers 
  to reset the limit at will and brute-force the code to take over any account, 
  including administrators, when the verification-code reset mode is enabled.
