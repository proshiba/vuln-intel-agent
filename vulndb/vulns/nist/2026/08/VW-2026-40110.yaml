title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfuse-uring:
  fix data races on ring->ready\n\nOn weakly-ordered architectures, the store to fiq->ops
  can be\nreordered past the store to ring->ready, allowing a CPU that sees\nring->ready
  == true via fuse_uring_ready() to dispatch requests\nthrough a stale fiq->ops pointer.
  Upgrade the store to\nsmp_store_release() and the load in fuse_uring_ready() to\n\
  smp_load_acquire() so that the preceding WRITE_ONCE(fiq->ops, ...)\nis visible to
  any CPU that observes ring->ready == true.\n\nAdditionally, fuse_uring_do_register()
  publishes ring->ready with\nWRITE_ONCE() but the fast-path check reads it with a
  plain load.\nThis is a marked-vs-unmarked access that KCSAN will flag. Wrap it in\n\
  READ_ONCE() to mark it without adding unnecessary ordering.\n\nAlso wrap the fc->ring
  load in fuse_uring_ready() in READ_ONCE() to\nprevent the compiler from reloading
  it between the NULL check and the\ndereference."
