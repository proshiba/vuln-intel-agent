title: Vim is an open source, command line text editor. Prior to 9.2.0840, 
  runtime/plugin/netrwPlugin.vim loads netrw and 
  runtime/pack/dist/opt/netrw/autoload/netrw.vim constructs Bookmarks, History, 
  and Targets menu entries by interpolating attacker-controlled directory paths 
  into executed :menu commands. s:NetrwBookmarkMenu(), s:NetrwTgtMenu(), 
  g:netrw_menu_escape, EX_TRLBAR, and netrw#MakeTgt() fail to neutralize the | 
  command separator or single quotes at five construction sites, allowing a 
  crafted path browsed or bookmarked in GUI Vim to execute arbitrary Ex and 
  operating-system commands. This issue is fixed in version 9.2.0840.
