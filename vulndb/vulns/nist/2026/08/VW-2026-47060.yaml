title: A flaw was found in mod_cluster's AdvertiseListenerImpl 
  (org.jboss.modcluster core module). A single crafted UDP multicast datagram 
  with a valid HTTP status line and a "Server:" header but without the "Date:", 
  "Digest:", and "Sequence:" headers triggers a NullPointerException in 
  verifyDigest() that is not caught by the worker thread's exception handler. 
  This causes the advertise listener thread to terminate permanently. The 
  failure is silent (isListening() continues to return true) and persists until 
  the node is restarted. The crash occurs before the AdvertiseSecurityKey 
  comparison, so deployments with a configured security key are still affected.
