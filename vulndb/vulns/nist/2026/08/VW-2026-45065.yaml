  Cloning. The manipulation of the argument ID results in ldap injection. It is 
  possible to launch the attack remotely. The exploit has been released to the 
  public and may be used for attacks. The patch is identified as 
  798e65356ede03c2812ab1a728f23fae34de5592. It is advisable to implement a patch
  to correct this issue.
