title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbonding:
  fix devconf_all NULL dereference when IPv6 is disabled\n\nWhen booting with the
  'ipv6.disable=1' parameter, the devconf_all is\nnever initialized because inet6_init()
  exits before addrconf_init() is\ncalled which initializes it. bond_send_validate(),
  however, will still\ncall bond_ns_send_all() even ipv6 is indeed disabled. It will
  lead to\nNULL derefence of net->ipv6.devconf_all in ip6_pol_route().\n\n BUG: kernel
  NULL pointer dereference, address: 000000000000000c\n [...]\n Workqueue: bond0 bond_arp_monitor
  [bonding]\n RIP: 0010:ip6_pol_route+0x69/0x480\n [...]\n Call Trace:\n  <TASK>\n\
  \  ? srso_return_thunk+0x5/0x5f\n  ? __pfx_ip6_pol_route_output+0x10/0x10\n  fib6_rule_lookup+0xfe/0x260\n\
  \  ? wakeup_preempt+0x8a/0x90\n  ? srso_return_thunk+0x5/0x5f\n  ? srso_return_thunk+0x5/0x5f\n\
  \  ? sched_balance_rq+0x369/0x810\n  ip6_route_output_flags+0xd7/0x170\n  bond_ns_send_all+0xde/0x280
  [bonding]\n  bond_ab_arp_probe+0x296/0x320 [bonding"
