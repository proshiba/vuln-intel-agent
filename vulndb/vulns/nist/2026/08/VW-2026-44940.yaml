title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  HIDP: validate numbered report payloads\n\nWhen hidp_get_raw_report() waits for
  a numbered report,\nhidp_process_data() compares the expected report number with
  skb->data[0].\nA connected HIDP peer can reply with only a DATA transaction header,\n\
  leaving the skb empty after the header is removed.\n\nKMSAN reports an uninitialized-value
  use in hidp_session_run(), with the\nvalue originating in __alloc_skb() through
  vhci_write(). The transaction\nheader checks remove the empty-frame reports, but
  this report remains until\nthe payload check is added.\n\nThe comparison can also
  consume a peer-controlled byte beyond the declared\nL2CAP PDU. A DATA | FEATURE
  response followed by an extra 0x01 byte made\nthe current code accept that byte
  as report ID 1 and complete\nHIDIOCGFEATURE with a zero-byte result. With this change
  the malformed\nresponse is rejected with -EIO, while a subsequent valid response
  still\nsucceeds.\n\nRequire a pa"
