title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmac802154:
  fix netdev use-after-free in beacon worker\n\nmac802154_beacon_worker() reads local->beacon_req
  under RCU and derives\nthe sub-interface from the request, but then drops the RCU
  read lock and\ncontinues to use both sdata and the embedded wpan_dev.\n\nmac802154_stop_beacons_locked()
  cancels only pending beacon work, clears\nlocal->beacon_req and frees the request.\
  \  A beacon worker that is already\nrunning can therefore continue after interface
  teardown and dereference\nthe freed netdev private area.\n\nThe scan worker already
  pins the netdev before leaving RCU.  Apply the\nsame lifetime rule to the beacon
  worker: take a netdev reference while\nthe request is still protected by RCU, and
  release it on all paths that\ncontinue after the reference is acquired."
