title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Close speculative mem read possibility\n\nThe domain value is extracted from a given
  CCA or EP11 ioctl struct\nwhen a CPRB is about to be sent. Thus this is a user controlled
  value.\nUnder some special conditions (custom device node used, administrative\n\
  load) this value is used as an array index after bounds checking, but\nwithout speculation
  barrier.\n\nAdd the missing array_index_nospec() call to prevent speculative\nexecution
  where this domain value is used."
