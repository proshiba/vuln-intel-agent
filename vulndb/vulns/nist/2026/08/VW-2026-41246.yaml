title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix resource leak on mmiotrace trace_pipe close\n\nThe mmiotrace tracer was added
  May 12th 2008. At that time, resources\ncreated in pipe_open() could not be freed
  because there was not\npipe_close function pointer of the tracer. The pipe_close
  function pointer\nwas added in December 7th, 2009, but the mmiotrace tracer was
  not updated.\n\nmmio_pipe_open() allocates a header_iter and takes a pci_dev reference\n\
  when trace_pipe is opened. mmio_close() frees them, but it was only\nwired to the
  tracer's .close callback.\n\ntracing_release_pipe() invokes .pipe_close, not .close,
  when the\ntrace_pipe file is released. As a result, closing trace_pipe with the\n\
  mmiotrace tracer active leaked the header_iter allocation and left a\nstale pci_dev
  reference.\n\nSet .pipe_close to mmio_close, matching how function_graph wires both\n\
  callbacks to the same handler.\n\nNote, if the trace_pipe is read to completion,
  it will clean up the\nresources"
