title: "A vulnerability in the OSPF protocol of Cisco Secure Firewall ASA Software
  and Cisco Secure FTD Software could allow an authenticated, adjacent attacker to
  cause an affected device to reload unexpectedly, resulting in a DoS condition. To
  exploit this vulnerability, the attacker must have the OSPF secret key.\r\n\r This
  vulnerability is due to insufficient input validation when processing OSPF link-state
  update (LSU) packets. An attacker could exploit this vulnerability by sending crafted
  OSPF LSU packets. A successful exploit could allow the attacker to corrupt the heap,
  causing the device to reload, resulting in a DoS condition."
