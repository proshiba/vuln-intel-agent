title: A flaw was found in popt, a command-line option parsing library. An 
  off-by-one error in the poptStuffArgs function, when repeatedly called by a 
  host application or through deep alias nesting, can lead to corruption of 
  internal program data. This corruption could potentially enable a local 
  attacker to execute arbitrary code if the host application then unsafely 
  processes the altered data.
