title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix lack of locking around modifications of net->cells_dyn_ino\n\nFix the lack of
  locking around modifications of net->cells_dyn_ino by\ntaking net->cells_lock exclusively.\
  \  This also requires to cell to be\nremoved from net->cells_dyn_ino in afs_destroy_cell_work()
  rather than in\nafs_cell_destroy() as the latter runs in RCU cleanup context and
  sleeping\nlocks cannot be taken there."
