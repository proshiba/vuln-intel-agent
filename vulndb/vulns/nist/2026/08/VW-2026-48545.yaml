title: The Post Duplicator plugin for WordPress is vulnerable to authorization 
  bypass in all versions up to, and including, 3.0.11. This is due to the 
  `duplicate_post_permissions()` permission callback only verifying the 
  `duplicate_posts` capability without checking whether the requesting user 
  holds `publish_posts` or other status-gated capabilities. This makes it 
  possible for authenticated attackers, with Contributor-level access and above,
  to create duplicate posts with `future` (scheduled, auto-publishes) or 
  `private` status, bypassing editorial review. Additionally, the REST endpoint 
  does not enforce administrator-configured post-type duplication restrictions, 
  allowing duplication of post types that have been explicitly disabled.
