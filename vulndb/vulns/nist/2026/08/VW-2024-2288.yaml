title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: mcast: wait for previous gc cycles when removing port\n\nsyzbot hit a use-after-free[1]
  which is caused because the bridge doesn't\nmake sure that all previous garbage
  has been collected when removing a\nport. What happens is:\n      CPU 1        \
  \           CPU 2\n start gc cycle           remove port\n                     \
  \    acquire gc lock first\n wait for lock\n                         call br_multicasg_gc()
  directly\n acquire lock now but    free port\n the port can be freed\n while grp
  timers still\n running\n\nMake sure all previous gc cycles have finished by using
  flush_work before\nfreeing the port.\n\n[1]\n  BUG: KASAN: slab-use-after-free in
  br_multicast_port_group_expired+0x4c0/0x550 net/bridge/br_multicast.c:861\n  Read
  of size 8 at addr ffff888071d6d000 by task syz.5.1232/9699\n\n  CPU: 1 PID: 9699
  Comm: syz.5.1232 Not tainted 6.10.0-rc5-syzkaller-00021-g24ca36a562d6 #0\n  Hardware
  name: Google Google Compute Engi"
