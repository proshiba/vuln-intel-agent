title: An issue in MongoDB Server's query execution engine could allow an 
  authenticated user with read and write privileges to cause an internal 
  reference to be used after the underlying memory has been freed, when running 
  certain queries against time-series collections. This could result in a server
  crash or disclosure of freed memory contents within query results.
