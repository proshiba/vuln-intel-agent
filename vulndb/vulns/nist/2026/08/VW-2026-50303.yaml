title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  bound mode sysfs output to the sysfs buffer\n\nmode_string() uses snprintf() which
  can return a value larger than the\nremaining buffer space. show_modes() accumulates
  the return value into i\nwithout checking whether i has reached PAGE_SIZE, causing
  the offset to\nadvance past the sysfs buffer if the modelist is long enough.\n\n\
  Add a size parameter to mode_string() and use scnprintf() to return\nonly the bytes
  actually written. Add an early return when offset\nalready exceeds the buffer. In
  show_modes(), stop accumulating once\nthe buffer is full."
