title: A flaw was found in the must-gather component of Red Hat Advanced Cluster
  Management for Kubernetes. Certain ACM wrapper Custom Resources that embed 
  Secret data are collected without redaction. When an administrator runs 
  must-gather, credentials and tokens are captured in cleartext in the resulting
  archive, potentially exposing sensitive information to anyone with access to 
  the archive.
