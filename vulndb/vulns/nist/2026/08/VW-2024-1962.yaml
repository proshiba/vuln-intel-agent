title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: do not flag ZEROOUT on non-dirty extent buffer\n\nBtrfs clears the content
  of an extent buffer marked as\nEXTENT_BUFFER_ZONED_ZEROOUT before the bio submission.
  This mechanism is\nintroduced to prevent a write hole of an extent buffer, which
  is once\nallocated, marked dirty, but turns out unnecessary and cleaned up within\n\
  one transaction operation.\n\nCurrently, btrfs_clear_buffer_dirty() marks the extent
  buffer as\nEXTENT_BUFFER_ZONED_ZEROOUT, and skips the entry function. If this call\n\
  happens while the buffer is under IO (with the WRITEBACK flag set,\nwithout the
  DIRTY flag), we can add the ZEROOUT flag and clear the\nbuffer's content just before
  a bio submission. As a result:\n\n1) it can lead to adding faulty delayed reference
  item which leads to a\n   FS corrupted (EUCLEAN) error, and\n\n2) it writes out
  cleared tree node on disk\n\nThe former issue is previously discussed in [1]. The
  corruption happens\nwhen it runs"
