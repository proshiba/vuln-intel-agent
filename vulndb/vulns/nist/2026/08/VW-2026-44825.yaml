title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath9k: fix OOB access from firmware tx status queue ID\n\nath_tx_edma_tasklet()
  accesses sc->tx.txq[ts.qid] where ts.qid is a\n4-bit hardware field (0-15), but
  the txq array only has\nATH9K_NUM_TX_QUEUES (10) entries. A qid >= 10 causes an
  OOB array\naccess.\n\nAdd a bounds check on ts.qid before using it as an array index."
