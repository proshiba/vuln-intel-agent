title: "Relative path traversal vulnerability in Apache Camel Azure Storage Blob component.\n\
  \n\n\nThis issue affects Apache Camel: from 4.0.0 before 4.14.9, from 4.15.0 before
  4.18.4, from 4.19.0 before 4.22.0.\n\n\n\nThe camel-azure-storage-blob component
  can download an Azure Storage blob to the local filesystem through its downloadBlobToFile
  operation, writing into the directory named by the fileDir endpoint option, which
  is documented as usable from both the producer and the consumer. BlobOperations.downloadBlobToFile
  built the local target by joining fileDir with the remote blob name exactly as the
  Azure SDK reported it (new File(fileDir, client.getBlobName())) and passed the result
  straight to the SDK download call, with no lexical normalization and no check that
  the resolved location stayed inside fileDir. The blob name is not route-controlled
  data: the consumer enumerates the container in BlobConsumer.createBatchExchangesFromContainer,
  which lists blobs and creates one exchange per entry from"
