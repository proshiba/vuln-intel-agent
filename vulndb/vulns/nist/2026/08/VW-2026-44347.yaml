title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/core:
  always put unsuccessfully committed target pids\n\ndamon_commit_target() puts and
  gets the destination and the source target\npids.  It puts the destination target
  pid because it will be overwritten\nby the source target pid.  It gets the source
  pid because the caller is\nsupposed to eventually put the pids.  In more detail,
  the caller will call\ndamon_destroy_ctx() after damon_commit_ctx() to destroy the
  entire source\ncontext.  And in this case, [f]vaddr operation set's cleanup_target()\n\
  callback will put the pids.\n\nThe commit operation is made at the context level.\
  \  The operation can fail\nin multiple places including in the middle and after
  the targets commit\noperations.  For any such failures, immediately the error is
  returned to\nthe damon_commit_ctx() caller.  If some or all of the source target
  pids\nwere committed to the destination during the unsuccessful context commit\n\
  attempt, those pids should be put "
