title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  use neigh_ha_snapshot() in route_shortcircuit()\n\nThe neighbour hardware address
  n->ha can be updated asynchronously by the\nneighbour subsystem, protected by n->ha_lock
  seqlock. Reading n->ha without\nholding the seqlock loop can lead to torn reads
  or reading a partially updated\nMAC address.\n\nUse neigh_ha_snapshot() in route_shortcircuit()
  to safely copy n->ha under\nread_seqbegin()/read_seqretry() lock protection before
  using it.\n\nNote that arp_reduce() and neigh_reduce() seem to have the same issue\n\
  left for future patches."
