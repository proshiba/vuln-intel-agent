title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  spectrum_acl_tcam: Fix possible use-after-free during rehash\n\nThe rehash delayed
  work migrates filters from one region to another\naccording to the number of available
  credits.\n\nThe migrated from region is destroyed at the end of the work if the\n\
  number of credits is non-negative as the assumption is that this is\nindicative
  of migration being complete. This assumption is incorrect as\na non-negative number
  of credits can also be the result of a failed\nmigration.\n\nThe destruction of
  a region that still has filters referencing it can\nresult in a use-after-free [1].\n\
  \nFix by not destroying the region if migration failed.\n\n[1]\nBUG: KASAN: slab-use-after-free
  in mlxsw_sp_acl_ctcam_region_entry_remove+0x21d/0x230\nRead of size 8 at addr ffff8881735319e8
