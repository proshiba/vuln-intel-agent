title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregmap:
  sdw-mbq: don't call an unset readable_reg callback\n\nregmap_sdw_mbq_poll_busy()
  decides whether to poll the Function Busy bit\nby calling ctx->readable_reg(), which
  is a straight copy of\nconfig->readable_reg. That callback is optional: regmap_readable()
  treats\na NULL ->readable_reg as \"every register is readable\", and drivers rely
  on\nthat. es9356 and tac5xx2-sdw both build an MBQ regmap without one.\n\nSince
  commit ca1b11b36d82 (\"regmap: sdw-mbq: Allow defers on undeferrable\ncontrols\"\
  ) the poll runs on every -ENODATA, not only for Controls the\ndriver marked deferrable,
  so any of those devices answering\nCOMMAND_IGNORED takes the kernel through a NULL
  function pointer.\n\nTreat a missing callback the way the rest of regmap does and
  poll."
