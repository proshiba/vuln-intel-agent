title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipmi:
  fix refcount leak in i_ipmi_request()\n\nWhen a caller provides a `supplied_recv`
  message to i_ipmi_request(),\nthe function increments the user's `nr_msgs` reference
  count. If an\nerror occurs later, the out_err cleanup path only frees the recv_msg\n\
  if the function allocated it itself (i.e., !supplied_recv). In the\nsupplied_recv
  case the cleanup is skipped, leaving the reference count\nelevated. The caller ipmi_request_supply_msgs()
  does not release the\nsupplied_recv on error, so the reference is permanently leaked.\n\
  \nFix this by explicitly reverting the reference count operations when a\nsupplied
  recv_msg with a valid user pointer is present in the error\npath: decrement nr_msgs
  and drop the user's kref."
