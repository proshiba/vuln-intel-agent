title: A hard-coded or default root account credential in TBEA TLogger 
  V2.1.0.0B0.0.0.0 allows an unauthenticated remote attacker to obtain 
  root-level access to the device via the exposed SSH service. The root password
  can be recovered from the password hash stored in /etc/shadow and used to 
  authenticate to the SSH service. Successful exploitation provides full 
  administrative control of the affected device.
