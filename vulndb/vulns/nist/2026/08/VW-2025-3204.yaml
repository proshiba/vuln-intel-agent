title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  fix NULL pointer dereference on fastopen early fallback\n\nIn case of early fallback
  to TCP, subflow_syn_recv_sock() deletes\nthe subflow context before returning the
  newly allocated sock to\nthe caller.\n\nThe fastopen path does not cope with the
  above unconditionally\ndereferencing the subflow context."
