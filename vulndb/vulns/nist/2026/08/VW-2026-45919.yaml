title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to 1.0.8.4, Vvveb backend product 
  revision operations allow a low-privileged Vendor to access revisions for 
  products owned by another Vendor. The admin/controller/product/revisions.php 
  route reuses admin/controller/content/revisions.php, while 
  admin/sql/sqlite/product_content_revision.sql trusts caller-controlled 
  product_id, language_id, and created_at values without applying the current 
  admin_id to revision reads, restores, and deletes. An attacker can read 
  historic product content, restore a revision over another Vendor's live 
  product content, or delete revision records, exposing private copy, corrupting
  product pages, and removing audit history. This issue is fixed in version 
  1.0.8.4.
