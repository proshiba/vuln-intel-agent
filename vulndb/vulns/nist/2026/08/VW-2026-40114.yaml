title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  mm: Unconditionally sfence.vma for spurious fault\n\nSvvptc does not guarantee that
  it's safe to just return here. Since we\nhave already cleared our bit, if, theoretically,
  the bounded timeframe\nfor the accessed page to become valid still hasn't happened
  after sret,\nwe could fault again and actually crash.\n\nHopefully, these spurious
  faults should be rare enough that this is an\nacceptable slowdown."
