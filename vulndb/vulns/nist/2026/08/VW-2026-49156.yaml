title: The guard checker in Rocq Prover does not follow recursive calls made 
  through a fixpoint's own arguments. A fixpoint may pass itself as a 
  higher-order argument to a second fixpoint, which then applies it to a value 
  that is not a subterm of the structural argument. Passing the recursive 
  function to a plain definition is rejected because the checker unfolds the 
  definition and observes the call, but passing it to a fixpoint is accepted 
  because higher-order recursive calls through fixpoint arguments are not 
  tracked. This admits a type that is definitionally equal to its own negation, 
  so self-application produces False in purely definitional code, without 
  tactics, axioms, plugins or unsafe flags, and Print Assumptions reports the 
  result as closed under the global context. Fixed in Rocq 9.2.0.
