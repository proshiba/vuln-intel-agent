title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix out-of-bounds write in ocfs2_remove_refcount_extent\n\n[BUG]\nUnlinking a refcounted
  file whose refcount tree has leaf blocks\ntriggers a fortify panic due to an out-of-bounds
  write.\n\n[CAUSE]\nWhen the last leaf block is removed from a refcount tree,\nocfs2_remove_refcount_extent()
  converts the root back to leaf mode\nwith a bulk memset on &rb->rf_records. rf_records
  sits in an anonymous\nunion with rf_list. rf_list.l_tree_depth aliases rf_records.rl_count,\n\
  and is 0 for a single-level tree. With rl_count equal to 0, the memset\nwrites past
  the 16-byte declared size of rf_records, which the fortify\nchecker catches.\n\n\
  [FIX]\nReplace the bulk memset on &rb->rf_records with a correctly-bounded\nmemset
  on rl_recs[] alone, after setting rl_count to the correct value."
