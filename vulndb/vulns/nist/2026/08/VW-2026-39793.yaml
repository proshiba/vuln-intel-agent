title: A flaw was found in the LDAP storage provider of Keycloak, which is used 
  to federate user identities from external directories. The issue occurs when a
  delegated administrator performs a search using a specific LDAP entry 
  Distinguished Name (DN). Due to missing validation, the system allows lookups 
  for users located outside the configured search boundary, leading to the 
  disclosure of account information from unauthorized parts of the directory and
  unintended importing of those users into local storage.
