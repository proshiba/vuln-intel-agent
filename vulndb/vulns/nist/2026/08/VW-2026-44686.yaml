title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt:
  fix head underflow on XDP head-grow\n\nThe xdp.py test test_xdp_native_adjst_head_grow_data
  crashes when run on\na bnxt machine (and also crashes in NIPA).\n\nIt seems that
  the bug is an underflow in bnxt_rx_multi_page_skb, which\nbuilds the skb head:\n\
  \n  napi_build_skb(data_ptr - bp->rx_offset, rxr->rx_page_size);\n\nThe problem
  with this expression is that in page mode, rx_offset is:\n\n  bp->rx_offset = NET_IP_ALIGN
  + XDP_PACKET_HEADROOM;\n\nWhich evaluates (at least on x86_64) to 258.\n\nThe test
  test_xdp_native_adjst_head_grow_data tests a case where the\nhead is adjusted by
  -256.\n\nWhen this test runs, data_ptr is shifted to frag_start + 2 (where\nfrag_start
  = page_address(page) + offset).\n\nThen, bnxt_rx_multi_page_skb is invoked and the
  napi_build_skb\nexpression subtracts 258, landing at an address before frag_start.
  This\ncould be either the previous fragment or the previous physical page when\n\
