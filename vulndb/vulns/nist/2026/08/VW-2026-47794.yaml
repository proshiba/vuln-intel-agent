title: "ATutor is vulnerable to a Path Traversal vulnerability in ZIP extraction functionality.
  An attacker with instructor privileges can upload and extract a specially crafted
  ZIP archive, causing files to be written outside the intended extraction directory.
  This allows an attacker to place a server-executable .phtml file in the web root
  and achieve remote code execution with web server privileges on the underlying server.\n\
  \n\n\n\nProduct is no longer actively supported and the vulnerabilities have not
  been fixed. Only version 2.2.4 was tested and confirmed as vulnerable, other versions
  were not tested but might also be vulnerable."
