title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibfs:
  set SB_I_NOEXEC and SB_I_NODEV by default in init_pseudo()\n\nSince commit 1e7ab6f67824
  (\"anon_inode: rework assertions\"),\npath_noexec() warns when an anonymous-inode
  file is mmap'd from a\nsuperblock that has not set SB_I_NOEXEC. dma-buf backs its
  files this\nway and never set the flag, so mmap of any exported buffer trips the\n\
  warning on a CONFIG_DEBUG_VFS=y kernel:\n\n  WARNING: CPU: 11 PID: 121813 at fs/exec.c:118
  path_noexec+0x47/0x50\n   do_mmap+0x2b5/0x680\n   vm_mmap_pgoff+0x129/0x210\n  \
  \ ksys_mmap_pgoff+0x177/0x240\n   __x64_sys_mmap+0x33/0x70\n\ninit_pseudo() sets
  up internal SB_NOUSER mounts that are never\npath-reachable. Set both flags here
  so every pseudo filesystem gets\nthem by default instead of each caller setting
  them.\n\nSB_I_NODEV is inert for unreachable mounts. SB_I_NOEXEC has one\nvisible
