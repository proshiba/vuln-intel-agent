title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrbd:
  Reset positive result codes to zero in object map update path\n\nIn a reply message
  to an RBD request, a positive result code indicates\na data payload, which is not
  allowed for writes. While\nrbd_osd_req_callback() already resets a positive result
  code for writes\nto zero, rbd_object_map_callback() does not. This allows a corrupted\n\
  reply to an object map update to trigger the rbd_assert(*result < 0) in\n__rbd_obj_handle_request().
  This happens, because\nrbd_object_map_callback() calls rbd_obj_handle_request()
  ->\n__rbd_obj_handle_request() and passes this positive result code. From\n__rbd_obj_handle_request(),
  rbd_obj_advance_write() is called, which\nleaves the positive result code unchanged
  and returns true. Therefore,\nthe if(done && *result) branch is executed in __rbd_obj_handle_request()\n\
  and the assertion triggers.\n\nThis patch fixes the issue by adjusting the logic
