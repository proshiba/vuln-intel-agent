title: Netmaker disables certificate verification on the connection to the 
  configured mail server. The sender in pro/email/smtp.go assigns a TLS 
  configuration whose skip-verify field is set to true unconditionally, directly
  beneath a comment stating that the setting should be false in production. No 
  configuration value governs it and no code path restores verification, so the 
  client accepts any certificate the mail server presents, including one an 
  interposing party supplies. Mail that Netmaker sends over that connection 
  includes password-reset messages carrying single-use tokens and user 
  invitations carrying enrolment links, so a party positioned on the path 
  between the server and its mail relay can read those messages in transit and 
  use a captured reset token before the intended recipient does. The setting is 
  absent from the development branch but present in the latest release.
