title: Wazuh is a free and open source platform used for threat prevention, 
  detection, and response. From 4.4.0 until 4.14.6 and 5.0.0-beta2, 
  api/api/middlewares.py decodes the Basic authentication username before 
  credential validation and passes it to the access logger without neutralizing 
  control characters. api/api/alogging.py interpolates that value into the 
  plain-text API log. An unauthenticated attacker can include carriage returns 
  or line feeds in the username to forge entries, obscure activity, or poison 
  systems that consume the plain-text audit log. The JSON log format is not 
  affected because JSON serialization escapes these characters. This issue is 
  fixed in versions 4.14.6 and 5.0.0-beta2.
