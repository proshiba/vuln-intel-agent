title: "In the Linux kernel, the following vulnerability has been resolved:\n\njfs:
  fix null ptr deref in dtInsertEntry\n\n[syzbot reported]\ngeneral protection fault,
  probably for non-canonical address 0xdffffc0000000001: 0000 [#1] PREEMPT SMP KASAN
  PTI\nKASAN: null-ptr-deref in range [0x0000000000000008-0x000000000000000f]\nCPU:
  0 PID: 5061 Comm: syz-executor404 Not tainted 6.8.0-syzkaller-08951-gfe46a7dd189e
  #0\nHardware name: Google Google Compute Engine/Google Compute Engine, BIOS Google
  03/27/2024\nRIP: 0010:dtInsertEntry+0xd0c/0x1780 fs/jfs/jfs_dtree.c:3713\n...\n\
  [Analyze]\nIn dtInsertEntry(), when the pointer h has the same value as p, after
  writing\nname in UniStrncpy_to_le(), p->header.flag will be cleared. This will cause
  the\npreviously true judgment \"p->header.flag & BT-LEAF\" to change to no after
  writing\nthe name operation, this leads to entering an incorrect branch and accessing
  the\nuninitialized object ih when judging this condition for the second time.\n\n\
  [Fix]\nAfter got the page, check freel"
