title: MaxSite CMS contains a remote code execution vulnerability that allows 
  unauthenticated attackers to inject arbitrary PHP code into the application 
  configuration file by submitting crafted POST requests to the install endpoint
  after installation is complete. Attackers can supply a malicious db_dbprefix 
  value containing a single quote to break out of a PHP string literal in 
  application/config/database.php, appending attacker-controlled PHP statements 
  that are executed by the web server on every subsequent request, resulting in 
  persistent unauthenticated remote code execution as the web-server process 
  user.
