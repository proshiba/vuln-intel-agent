title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmacvlan:
  inherit needed_headroom and needed_tailroom from lowerdev\n\nmacvlan devices inherit
  hard_header_len from lowerdev during macvlan_init(),\nbut leave needed_headroom
  and needed_tailroom set to 0.\n\nWhen the underlying lowerdev requires extra headroom
  or tailroom for\nheaders/trailers (e.g. macsec, ipsec, wireguard, tunnels, or veth
  with rx\nheadroom), upper layers calculating packet headroom and tailroom fail to\n\
  reserve sufficient space.\n\nThis can result in reallocation overhead, skb headroom
  underflows, or KASAN\nslab-use-after-free crashes when dev_hard_header() / macvlan_hard_header()\n\
  prepends header data or when lower devices append tailroom.\n\nFix this by:\n1.
  Inheriting needed_headroom and needed_tailroom from lowerdev in macvlan_init().\n\
  2. Propagating needed_headroom and needed_tailroom updates to attached macvlans\n\
  \   in macvlan_device_event() when receiving NETDEV_FEAT_CHANGE events."
