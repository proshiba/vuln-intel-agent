title: In Apache CXF's DefaultEncryptingOAuthDataProvider, revoked access tokens
  still decrypt successfully, and TokenIntrospectionService reports active:true.
  The same applies to refresh tokens. This violates the RFC stipulations that 
  'The authorization server MUST invalidate the token.' and 'introspection of a 
  revoked token MUST return {"active":false}'. Users are recommended to upgrade 
  to versions 4.2.3 or 4.1.8 or 3.6.12, which fix this issue.
