title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix memory leak in mlx5_core_destroy_cq() error path\n\nPrior to this patch in case
  mlx5_core_destroy_cq() failed it returns\nwithout completing all destroy operations
  and that leads to memory leak.\nInstead, complete the destroy flow before return
  error.\n\nAlso move mlx5_debug_cq_remove() to the beginning of mlx5_core_destroy_cq()\n\
  to be symmetrical with mlx5_core_create_cq().\n\nkmemleak complains on:\n\nunreferenced
  object 0xc000000038625100 (size 64):\n  comm \"ethtool\", pid 28301, jiffies 4298062946
  (age 785.380s)\n  hex dump (first 32 bytes):\n    60 01 48 94 00 00 00 c0 b8 05
  34 c3 00 00 00 c0  `.H.......4.....\n    02 00 00 00 00 00 00 00 00 db 7d c1 00
  00 00 c0  ..........}.....\n  backtrace:\n    [<000000009e8643cb>] add_res_tree+0xd0/0x270
  [mlx5_core]\n    [<00000000e7cb8e6c>] mlx5_debug_cq_add+0x5c/0xc0 [mlx5_core]\n\
  \    [<000000002a12918f>] mlx5_core_create_cq+0x1d0/0x2d0 [mlx5_core]\n    [<00000000cef0a696>]
  mlx5e"
