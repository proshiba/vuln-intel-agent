title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/bpf:
  Fix detecting BPF atomic instructions\n\nCommit 91c960b0056672 (\"bpf: Rename BPF_XADD
  and prepare to encode other\natomics in .imm\") converted BPF_XADD to BPF_ATOMIC
  and added a way to\ndistinguish instructions based on the immediate field. Existing
  JIT\nimplementations were updated to check for the immediate field and to\nreject
  programs utilizing anything more than BPF_ADD (such as BPF_FETCH)\nin the immediate
  field.\n\nHowever, the check added to powerpc64 JIT did not look at the correct\n\
  BPF instruction. Due to this, such programs would be accepted and\nincorrectly JIT'ed
  resulting in soft lockups, as seen with the atomic\nbounds test. Fix this by looking
  at the correct immediate value."
