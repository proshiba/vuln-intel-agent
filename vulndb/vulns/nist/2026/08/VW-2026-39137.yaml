title: A security flaw has been discovered in langgenius dify up to 1.14.2. This
  issue affects the function jinja2.Template of the file 
  api/core/helper/code_executor/jinja2/jinja2_transformer.py of the component 
  Jinja2 Handler. The manipulation results in improper neutralization of special
  elements used in a template engine. The attack may be launched remotely. The 
  exploit has been released to the public and may be used for attacks. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
