title: 'Vulnerability in the PeopleSoft Enterprise PeopleTools product of Oracle PeopleSoft
  (component: Security).  Supported versions that are affected are 8.61 and  8.62.
  Difficult to exploit vulnerability allows low privileged attacker with logon to
  the infrastructure where PeopleSoft Enterprise PeopleTools executes to compromise
  PeopleSoft Enterprise PeopleTools.  While the vulnerability is in PeopleSoft Enterprise
  PeopleTools, attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all PeopleSoft Enterprise PeopleTools accessible
  data as well as  unauthorized access to critical data or complete access to all
  PeopleSoft Enterprise PeopleTools accessible data. CVSS 3.1 Base Score 7.5 (Confidentiality
  and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N).'
