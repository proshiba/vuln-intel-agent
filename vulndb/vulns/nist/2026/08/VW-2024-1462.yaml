title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhfsplus:
  prevent corruption in shrinking truncate\n\nI believe there are some issues introduced
  by commit 31651c607151\n(\"hfsplus: avoid deadlock on file truncation\")\n\nHFS+
  has extent records which always contains 8 extents.  In case the\nfirst extent record
  in catalog file gets full, new ones are allocated from\nextents overflow file.\n\
  \nIn case shrinking truncate happens to middle of an extent record which\nlocates
  in extents overflow file, the logic in hfsplus_file_truncate() was\nchanged so that
  call to hfs_brec_remove() is not guarded any more.\n\nRight action would be just
  freeing the extents that exceed the new size\ninside extent record by calling hfsplus_free_extents(),
  and then check if\nthe whole extent record should be removed.  However since the
  guard\n(blk_cnt > start) is now after the call to hfs_brec_remove(), this has\n\
  unfortunate effect that the last matching extent record is removed\nunconditionally.\n\
  \nTo reproduce "
