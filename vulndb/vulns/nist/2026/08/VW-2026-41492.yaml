title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched_ext:
  Don't warn on core-sched forced idle in put_prev_task_scx()\n\nput_prev_task_scx()
  warns when a runnable task drops to a lower sched_class\nwithout SCX_OPS_ENQ_LAST,
  on the assumption that balance_one() would have\nkept it running. Core scheduling
  breaks that: a forced-idle SMT sibling\nreschedules through the core_pick fast path
  in pick_next_task(), which skips\npick_task_scx() and thus balance_one(), so a runnable
  task can drop to idle\nwith ENQ_LAST unset.\n\nGate the warning on sched_cpu_cookie_match():
  a cookie mismatch means core\nscheduling forced the idle, while a match (or core
  scheduling off) still\ncatches a genuine missing-ENQ_LAST drop."
