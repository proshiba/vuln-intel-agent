title: "A vulnerability in Cisco Firepower Threat Defense (FTD) Software for Cisco
  Firepower 1000, 2100, 3100, and 4200 Series could allow an unauthenticated, local
  attacker to access an affected system using static credentials.\r\n\r This vulnerability
  is due to the presence of static accounts with hard-coded passwords on an affected
  system. An attacker could exploit this vulnerability by logging in to the CLI of
  an affected device with these credentials. A successful exploit could allow the
  attacker to access the affected system and retrieve sensitive information, perform
  limited troubleshooting actions, modify some configuration options, or render the
  device unable to boot to the operating system, requiring a reimage of the device."
