title: Mail content stored by a user can be crafted so that it is interpreted as
  dsync protocol commands when an administrator later runs dsync with the stream
  protocol, for example during a migration. Injected commands can modify mailbox
  state on the destination during migration or replication, including internal 
  mailbox attributes that a user should not be able to set directly. It can also
  cause dsync errors. Avoid running dsync with the stream protocol on mailboxes 
  with untrusted content. Update to non-vulnerable version. No publicly 
  available exploits are known.
