title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: Fix potential data-race in __nft_obj_type_get()\n\nnft_unregister_obj()
  can concurrent with __nft_obj_type_get(),\nand there is not any protection when
  iterate over nf_tables_objects\nlist in __nft_obj_type_get(). Therefore, there is
  potential data-race\nof nf_tables_objects list entry.\n\nUse list_for_each_entry_rcu()
  to iterate over nf_tables_objects\nlist in __nft_obj_type_get(), and use rcu_read_lock()
  in the caller\nnft_obj_type_get() to protect the entire type query process."
