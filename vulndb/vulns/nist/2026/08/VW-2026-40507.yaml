title: Flowise through 3.1.4 contains an authentication bypass vulnerability 
  that allows unauthenticated attackers to access the OAuth2 credential refresh 
  endpoint by exploiting prefix-based whitelist matching in the authentication 
  middleware defined in packages/server/src/utils/constants.ts. Attackers can 
  send a POST request to the oauth2-credential refresh route with a trailing 
  credential identifier to bypass all authentication and authorization checks, 
  triggering unauthorized OAuth token rotation against credentials belonging to 
  any workspace and potentially disrupting dependent OAuth integrations. This is
  a bypass of CVE-2026-41273.
