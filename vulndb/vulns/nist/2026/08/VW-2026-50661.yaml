title: A vulnerability was detected in bsmi021 mcp-file-context-server 1.0.0. 
  Affected by this issue is the function read_context of the file src/index.ts 
  of the component Path Resolution. Performing a manipulation of the argument 
  path results in path traversal. It is possible to initiate the attack 
  remotely. The exploit is now public and may be used. The project was informed 
  of the problem early through an issue report but has not responded yet.
