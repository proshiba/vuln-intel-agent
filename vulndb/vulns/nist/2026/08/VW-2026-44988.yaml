title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  libsas: Fix HA resume deadlock and hisi_sas disk-wake race\n\nCommit fbefe22811c3
  (\"scsi: libsas: Don't always drain event workqueue\nfor HA resume\") introduced
  sas_resume_ha_no_sync() to avoid a deadlock:\nthe PHYE_RESUME_TIMEOUT handler, running
  on the HA event workqueue,\ncalls sas_deform_port() -> sas_destruct_devices(), which
  removes SCSI\ndevices and waits for the host to become runtime-active. But the host\n\
  cannot resume until sas_resume_ha() -> sas_drain_work() returns, and the\ndrain
  is blocked on that very handler.\n\nHowever skipping the drain reintroduces a race:
  hisi_sas returns from\nresume before all PHY UP work and libsas discovery work finish.
  The\ncontroller may then autosuspend while disks are still waking up. The\ndisks
  issue IO to a suspended controller, the IO fails, and the disks\nget disabled.\n\
  \nFix the deadlock at its source by moving the PHYE_RESUME_TIMEOUT\nnotification
  to after sas_drain_work(). By t"
