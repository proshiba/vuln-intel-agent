title: OpenEMR before 8.3.0 contains a stored cross-site scripting vulnerability
  in the patient portal template import handler that allows authenticated 
  attackers with Forms Administration permissions to upload template files 
  containing arbitrary HTML or JavaScript. Attackers can inject malicious 
  scripts through the template upload functionality, which are stored without 
  sanitization and execute in the browser of any other Forms Administration user
  who views the template in the HTML editor.
