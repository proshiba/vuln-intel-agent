title: "RansomLook fails to enforce the privacy status of ransomware groups and markets
  when distributing newly collected victim posts to external notification channels.
  The post-processing logic checks whether an individual post is marked private but
  does not verify whether the group or market to which the post belongs is configured
  as private.\n\nAs a result, newly parsed victim information associated with a private
  group or market may be automatically published through enabled Rocket.Chat, Mastodon,
  Bluesky, and e-mail notification channels despite the entity being explicitly configured
  to prevent public disclosure.\n\nA similar issue affects the public MISP feed. The
  feed previously determined privacy using groupinfo(), which only queries the group
  database. Consequently, victim information associated with private markets could
  be added to the public MISP feed because the corresponding market privacy flag was
  not evaluated.\n\nAn attacker or other unauthorized party able to access these public
