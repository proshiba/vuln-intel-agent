title: GitPython before 3.1.56 contains an argument injection vulnerability in 
  the Commit.count() method, which forwards keyword arguments to 'git rev-list' 
  without the check_unsafe_options guard present in the sibling iter_items 
  method. An attacker who can control options passed to Commit.count (e.g., via 
  an application that forwards a user-supplied options dict) can supply 
  output=<path>, causing 'git rev-list --output=<path>' to open and truncate the
  target file to zero bytes before revision parsing. This allows 
  destruction/blanking of an arbitrary file at the process's privilege level (no
  content control, 0-byte truncation).
