title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  mpi3mr: Fix potential deadlock in mpi3mr_fault_uevent_emit\n\nmpi3mr_fault_uevent_emit()
  runs from the fault watchdog and reset paths\nwhere host I/O may already be blocked.
  GFP_KERNEL allocations here, both\nthe local kzalloc_obj() and the ones inside kobject_uevent_env()
  itself,\ncan trigger reclaim that waits on that blocked I/O and deadlock.\n\nUse
  memalloc_noio_save()/restore() to cover the whole call instead of\njust the local
  allocation."
