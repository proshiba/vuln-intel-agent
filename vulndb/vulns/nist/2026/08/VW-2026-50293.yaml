title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - zero report size on F54 work error\n\nIn rmi_f54_work(), if an
  error occurs during report request or command\nverification, the code jumped directly
  to the 'error' label, bypassing\nthe 'abort' label where f54->report_size was normally
  zeroed out.\n\nThis left f54->report_size containing its previous successful payload\n\
  size. If a user then altered the V4L2 format to a smaller size, and a\nsubsequent
  run failed, rmi_f54_buffer_queue() would copy the stale,\nlarger payload size into
  the shrunken V4L2 buffer, causing a heap\nbuffer overflow.\n\nFix this by merging
  the 'abort' and 'error' labels into a single 'out'\nexit path, and ensuring that
  f54->report_size is always set to 0 on\nfailure by checking for error and zeroing
  the local report_size first."
