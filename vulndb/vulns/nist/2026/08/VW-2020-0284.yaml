title: A vulnerability in the installer component of Cisco AnyConnect Secure 
  Mobility Client for Windows could allow an authenticated local attacker to 
  copy user-supplied files to system level directories with system level 
  privileges. The vulnerability is due to the incorrect handling of directory 
  paths. An attacker could exploit this vulnerability by creating a malicious 
  file and copying the file to a system directory. An exploit could allow the 
  attacker to copy malicious files to arbitrary locations with system level 
  privileges. This could include DLL pre-loading, DLL hijacking, and other 
  related attacks. To exploit this vulnerability, the attacker needs valid 
  credentials on the Windows system.
