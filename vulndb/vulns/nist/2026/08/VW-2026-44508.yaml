title: "In the Linux kernel, the following vulnerability has been resolved:\n\nqede:
  fix off-by-one in BD ring consumption on build_skb failure\n\nqede_rx_build_skb()
  and qede_tpa_rx_build_skb() do not check for a\nNULL return from qede_build_skb().
  When it returns NULL under memory\npressure, the functions still consume a BD from
  the ring before\nreturning NULL. The callers then recycle additional BDs, resulting
  in\none extra BD being consumed (off-by-one). This desynchronizes the BD\nring,
  which can corrupt DMA page reference counts and lead to SLUB\nfreelist corruption.\n\
  \nCommit 4e910dbe3650 (\"qede: confirm skb is allocated before using\")\nadded a
  NULL check inside qede_build_skb() to prevent a NULL pointer\ndereference, but did
  not address the missing NULL checks in the\ncallers, making this off-by-one reachable.\n\
  \nFix this by adding NULL checks for the return value of\nqede_build_skb() in both
  qede_rx_build_skb() and\nqede_tpa_rx_build_skb(), returning NULL immediately before
  any BD ring\nmanipulation."
