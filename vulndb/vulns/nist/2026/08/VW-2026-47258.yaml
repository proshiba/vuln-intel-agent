title: "Grav API Plugin is a RESTful API for Grav CMS that provides full headless
  access to your site's content. Prior to 1.0.0-rc.16, the Grav API plugin CorsMiddleware
  returns Access-Control-Allow-Origin: * and permissive OPTIONS responses for authenticated
  /api/v1 endpoints. JavaScript from any origin can submit an attacker-obtained JWT
  through the Authorization or X-API-Token header, read the authenticated response,
  and perform write operations with the token owner's privileges, enabling data exfiltration
  and account modification. This issue is fixed in version 1.0.0-rc.16."
