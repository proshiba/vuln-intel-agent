title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Fix sk_redir use-after-free in send verdict\n\nsk_psock_msg_verdict() takes
  a socket reference for psock->sk_redir.\ntcp_bpf_send_verdict() copies that pointer
  while holding the source socket\nlock, but does not take a reference for the local
  copy before dropping the\nlock around tcp_bpf_sendmsg_redir().\n\nWhen apply_bytes
  keeps the cached verdict active, another sendmsg() on the\nsame source socket can
  consume the remaining bytes and release the cached\nreference while the first thread
  still holds only the raw local pointer:\n\n  CPU 0                             \
  \     CPU 1\n  sk_redir = psock->sk_redir\n  apply_bytes remains nonzero\n  release_sock(sk)\n\
  \                                         lock_sock(sk)\n                      \
  \                   apply_bytes reaches zero\n                                 \
  \        psock->sk_redir = NULL\n                                         release_sock(sk)\n\
  \                        "
