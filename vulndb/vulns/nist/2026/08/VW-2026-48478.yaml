title: Nezha Monitoring is a self-hostable, lightweight, servers and websites 
  monitoring and O&M tool. Nezha versions 1.14.13 through 1.14.14 and 2.0.0 
  through 2.0.9 do not bind stream identifiers created by CreateStream in 
  service/rpc/io_stream.go to their creating user, and `GET /ws/terminal/:id` 
  and `GET /ws/file/:id` only check whether the supplied UUID exists. An 
  authenticated RoleMember who obtains a live stream UUID from logs, browser 
  history, referer data, or telemetry can attach to another user's terminal or 
  file-manager session, read and write target-server files, and execute shell 
  commands. This issue is fixed in version 2.0.10.
