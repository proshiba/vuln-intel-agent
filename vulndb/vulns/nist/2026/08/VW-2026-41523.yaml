title: "use-context-selector is a React useContextSelector hook in userland Between
  2026-05-18 15:57:18 and 2026-05-19 15:24:34, the default branch contained malicious
  commits 9d8481a513b7b0d1c0941b220c69b25de748641b through 6f2dae054ca014068bdbbb4db96006424d674124
  that executed remote attacker-controlled code on developer machines during\n`npm
  install`. The commits were removed by force-push, but local clones, forks, and direct-SHA
  URLs may still contain them, and `npm install` against an affected checkout will
  still execute the code today. The package was not published to npm. `src/install.js`
  was added and wired into the `postinstall` script. It fetched a JavaScript payload
  from an attacker-controlled HTTPS endpoint (configurable via an environment variable),
  disabled TLS verification, and evaluated the response as code with `require` available.
  Execution was deliberately skipped on CI and cloud/serverless environments, targeting
  developer workstations. The second-stage payload was attacker-"
