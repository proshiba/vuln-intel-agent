title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack_expect: use conntrack GC to reap expectations\n\nThis patch replaces
  the timer API by GC worker approach for\nexpectations, as it already happened in
  many other subsystems.\n\nUse the existing conntrack GC worker to iterate over the
  local list of\nexpectations in the master conntrack to reap expired expectations.\n\
  Check IPS_HELPER_BIT to run GC for expectations, set it on for nft_ct\nexpectation
  which nevers sets it. Hold the expectation spinlock while\niterating over the master
  conntrack expectation list to synchronize with\nnf_ct_remove_expectations(). This
  also performs runtime packet path\ngarbage collection through the expectation insertion
  and lookup\nfunctions while walking over one of the chains of the global expectation\n\
  hashtables. Unconfirmed conntrack entries are skipped since ct->ext can\nbe reallocated
  and dying are skipped since those will be gone soon.\nSet on IPS_HELPER_BIT if the
