title: LiquidJS is a Shopify / GitHub Pages compatible template engine in pure 
  JavaScript. From 10.26.0 until 10.27.1, the strip_html filter in 
  src/filters/html.ts can enter an infinite loop when an input string contains 
  <, includes at least one preceding character, and has no later >. In 
  strip_html, the search for the next opener advances lt while the loop index 
  remains unchanged when the closer search returns -1, and the equality-only 
  stall guard does not exit because the loop index is less than lt. Reprocessing
  the same state indefinitely blocks template rendering and can cause denial of 
  service with an input as short as a<. This issue is fixed in version 10.27.1.
