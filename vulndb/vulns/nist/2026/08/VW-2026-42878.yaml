title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmp:
  Make CSD lock acquisition atomic for debug mode\n\nCommit b0473dcd4b1d (\"smp: Improve
  smp_call_function_single()\nCSD-lock diagnostics\") changed smp_call_function_single()
  so that,\nwhen CSD lock debugging is enabled, async !wait calls use the\ndestination
  CPU csd_data. That improves diagnostics, but it also removes\nthe single-writer
  property that made the old csd_lock() safe: multiple\nCPUs can now prepare the same
  destination CPU CSD concurrently.\n\ncsd_lock() currently waits for CSD_FLAG_LOCK
  to clear and then sets the\nbit with a non-atomic read-modify-write. Two senders
  can both see an\nunlocked CSD, set the bit, overwrite the callback fields, and enqueue\n\
  the same llist node. Re-adding a node that is already the queue head can\nmake node->next
  point to itself, leaving the target CPU stuck walking\ncall_single_queue. Later
  synchronous work, such as a TLB shootdown, can\nthen remain queued and trigger soft-lockup
  warnings"
