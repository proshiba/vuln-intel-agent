title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  mediatek: mt8192: Release reserved memory on cleanup\n\nThe MT8192 AFE probe calls
  of_reserved_mem_device_init() and falls\nback to preallocated buffers when no reserved
  memory region is\navailable. When the reserved memory assignment succeeds, however,
  the\ndriver never releases it.\n\nRegister a devm cleanup action after a successful
  reserved-memory\nassignment so the assignment is released on probe failure and driver\n\
  unbind."
