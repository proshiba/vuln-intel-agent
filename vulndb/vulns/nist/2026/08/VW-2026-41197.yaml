title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmac802154:
  hold an interface reference across the scan worker\n\nmac802154_scan_worker() captures
  the scanning sub-interface under RCU\nand then keeps dereferencing sdata->dev after
  rcu_read_unlock() and\noutside the rtnl -- in the failure traces, in\nmac802154_transmit_beacon_req()
  (skb->dev = sdata->dev), and in the\nend_scan cleanup. Nothing keeps that netdev
  alive across the worker\niteration.\n\nA concurrent DEL_INTERFACE or PHY removal
  can unregister the interface\nonce the worker drops the rtnl between its two drv_set_channel()\n\
  sections. unregister_netdevice() frees the netdev asynchronously from\nnetdev_run_todo()
  with the rtnl already dropped, so neither holding the\nrtnl nor the per-PHY IEEE802154_IS_SCANNING
  flag prevents a stale worker\niteration from dereferencing the freed netdev -- a
  KASAN\nslab-use-after-free, reachable by racing TRIGGER_SCAN against\nDEL_INTERFACE
  (both CAP_NET_ADMIN).\n\nPin the netdev with netdev_ho"
