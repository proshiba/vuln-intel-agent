title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  soc-compress: Reposition and add pcm_mutex\n\nIf panic_on_warn is set and compress
  stream(DPCM) is started,\nthen kernel panic occurred because card->pcm_mutex isn't
  held appropriately.\nIn the following functions, warning were issued at this line\n\
  \"snd_soc_dpcm_mutex_assert_held\".\n\nstatic int dpcm_be_connect(struct snd_soc_pcm_runtime
  *fe,\n\t\tstruct snd_soc_pcm_runtime *be, int stream)\n{\n\t...\n\tsnd_soc_dpcm_mutex_assert_held(fe);\n\
  \t...\n}\n\nvoid dpcm_be_disconnect(struct snd_soc_pcm_runtime *fe, int stream)\n\
  {\n\t...\n\tsnd_soc_dpcm_mutex_assert_held(fe);\n\t...\n}\n\nvoid snd_soc_runtime_action(struct
  snd_soc_pcm_runtime *rtd,\n\t\t\t    int stream, int action)\n{\n\t...\n\tsnd_soc_dpcm_mutex_assert_held(rtd);\n\
  \t...\n}\n\nint dpcm_dapm_stream_event(struct snd_soc_pcm_runtime *fe, int dir,\n\
  \tint event)\n{\n\t...\n\tsnd_soc_dpcm_mutex_assert_held(fe);\n\t...\n}\n\nThese
  functions are called by soc_compr_set_params_fe, soc_compr_open_fe\nand soc_compr_free_"
