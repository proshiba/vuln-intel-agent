title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: vgic: Fix race between LPI release and re-registration\n\nFix a potential
  race between decrementing an LPI's reference count and\nevicting that structure
  from the LPI xarray.\n\nLPI structures are maintained in the VGIC LPI xarray (dist->lpi_xa).\n\
  When the reference count of an LPI structure drops to zero,\nvgic_release_lpi_locked()
  removes the structure from the xarray and\nfrees it under the xarray lock.\n\nHowever,
  the release of an LPI can race with a concurrent LPI\nre-registration with the same
  INTID via vgic_add_lpi() on another CPU,\nsince the reference count drop and the
  xarray eviction are not performed\nin a single atomic step. This can happen e.g.
  if the guest issues a\nDISCARD while the LPI is still referenced from a vCPU's active-pending\n\
  list (ap_list), and the same INTID is re-mapped via MAPTI.\n\nParticularly, vgic_release_lpi_locked()
  is called from two distinct\npaths: direct release via vgic_put_irq(), a"
