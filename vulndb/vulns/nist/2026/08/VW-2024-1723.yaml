title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregmap:
  spi: Reserve space for register address/padding\n\nCurrently the max_raw_read and
  max_raw_write limits in regmap_spi struct\ndo not take into account the additional
  size of the transmitted register\naddress and padding.  This may result in exceeding
  the maximum permitted\nSPI message size, which could cause undefined behaviour,
  e.g. data\ncorruption.\n\nFix regmap_get_spi_bus() to properly adjust the above
  mentioned limits\nby reserving space for the register address/padding as set in
  the regmap\nconfiguration."
