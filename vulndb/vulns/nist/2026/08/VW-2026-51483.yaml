title: In Eclipse Lyo versions 2.0.0 to 7.0.0, OAuth server authorization checks
  can be bypassed when the 2-legged auth is supported by the server. In those 
  cases, application that based their authz filters upon Lyo-provided 
  `AbstractAdapterCredentialsFilter`, are vulnerable. An attacked can create a 
  provisional trusted client (valid use-case) but then it can be used as a 
  trusted client immediately without requiring the administrator approval to 
  clear the provisional status. The 3-legged path requiring user interaction is 
  not vulnerable and rejects provisional clients.
