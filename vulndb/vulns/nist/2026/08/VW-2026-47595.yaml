title: Coturn is a free open source implementation of TURN and STUN Server. In 
  4.15.0, an authenticated TURN user can repeatedly resume one allocation from 
  fresh UDP 5-tuples without completing a handoff when the server enables 
  --mobility. mobile_begin_transition() in src/server/ns_turn_server.c disarms 
  each new session's allocation timeout and overwrites the allocation's single 
  mobile_pending_resume link, leaving earlier pending sessions unreachable by 
  the cleanup path, while copy_auth_parameters() ignores inc_quota() failure. 
  The attacker can therefore retain unbounded server-side sessions and exhaust 
  process memory even when --user-quota=1 is configured. This issue is fixed in 
  version 4.16.0.
