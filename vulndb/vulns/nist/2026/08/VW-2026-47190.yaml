title: MyBooks is an enhanced and easy-to-use personal ebook management web 
  server also known as Talebook. In 3.41.2 and earlier, the AdminSettings.post 
  handler in webserver/handlers/admin.py accepts SOCIAL_AUTH key names without 
  validating quotes or newline characters, and SettingsLoader.dumpfile in 
  webserver/loader.py concatenates those names into the generated Python source 
  file auto.py without escaping them. An administrator can submit a crafted 
  SOCIAL_AUTH key name that closes the settings dictionary and injects arbitrary
  Python statements. The application later executes those statements because 
  SettingsLoader.loadfile imports auto.py as a module, and setting autoreload to
  true invokes restart_async so a process supervisor restarts the service and 
  triggers the import. Successful exploitation executes commands with the 
  privileges of the application service account and can disclose data, modify 
  files, establish persistence, or disrupt the service. Related authorization 
