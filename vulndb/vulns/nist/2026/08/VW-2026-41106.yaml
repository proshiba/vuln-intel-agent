title: "GNU cpio contains a Path Traversal vulnerability in its tar archive extraction
  functionality. When extracting a tar archive in copy-in mode with the --no-absolute-filenames
  option, the extracted file name is normalized but the tar hard-link target is passed
  to the link_to_name function without equivalent sanitization before calling link
  function. A tar archive provided by an attacker, containing a hard-link entry whose
  linkname is set to an absolute path outside the extraction directory, can cause
  cpio to create a hard link to an existing file outside the intended extraction directory,
  breaking the expected guarantee of --no-absolute-filenames and allowing archive-controlled
  linkage to external files.\n\nThis issue has been fixed in commit e2b9cbdd3354d2b1569b7390d1bc15c1930559ad"
