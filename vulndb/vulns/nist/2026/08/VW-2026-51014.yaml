title: A flaw was found in rsyslog. An unauthenticated remote attacker can 
  trigger a heap buffer overflow in the RainerScript `replace()` function by 
  sending specially crafted syslog messages. This vulnerability arises from an 
  incorrect buffer size calculation during string replacement, causing memory 
  corruption. Successful exploitation can lead to a denial of service (DoS) for 
  the affected system.
