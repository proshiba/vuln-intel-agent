title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: ti: am65-cpsw-nuss: Fix port_id extraction from SRC TAG\n\nOn the packet
  reception path, the ID of the MAC Port on which the packet\nwas received, is embedded
  in the RX DMA Descriptor's metadata. The ID is\nextracted using the helper function
  cppi5_desc_get_tags_ids() which fills\nin the 16-bit Source Tag into the 'port_id'
  variable. However, it is only\nthe lower 8-bits of the 16-bit Source Tag that represent
  the MAC Port ID,\nwhile the upper 8-bits are Hardware-Reserved and carry an arbitrary
  value.\nWith the existing logic, sporadic kernel crash is observed due to the\n\
  subsequent driver code accessing out-of-bound memory because of an invalid\nport_id.\n\
  \nHence, fix the port_id extraction logic to use only the lower 8-bits of the\n\
  Source Tag as the MAC Port ID."
