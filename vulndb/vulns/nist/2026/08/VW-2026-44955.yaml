title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix use-after-free in __close_file_table_ids()\n\nA ksmbd_file can remain alive
  after logical close while another session\nholds a temporary reference obtained
  through ksmbd_lookup_fd_inode().\nksmbd_close_fd() currently marks the file closed
  and drops the idr-owned\nreference, but leaves the pointer published in the closing
  session's idr\nuntil the final reference is dropped.\n\nIf the foreign holder performs
  the final ksmbd_fd_put(), __put_fd_final()\nsupplies the foreign session's file
  table to __ksmbd_close_fd(). The object\nis then freed without being removed from
  its owner's idr, and the owner\nsession later dereferences the stale pointer during
  file-table teardown.\n\nRemove the volatile id from the owner's idr while ksmbd_close_fd()
  still\nholds that table's lock, and clear volatile_id before dropping\nthe idr-owned
  reference. A later foreign final put then only performs\nphysical destruction and
  cannot remove the obje"
