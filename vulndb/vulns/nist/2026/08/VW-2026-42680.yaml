title: "A vulnerability in the VPN web server of Cisco Secure Firewall Adaptive Security
  Appliance (ASA) Software and Cisco Secure Firewall Threat Defense (FTD) Software
  could allow an unauthenticated, remote attacker to cause a denial of service (DoS)
  condition on an affected device.\r\n\r\nThis vulnerability is due to ineffective
  memory management of the VPN web server. An attacker could exploit this vulnerability
  by sending a large number of&nbsp;crafted HTTP requests to an affected device. A
  successful exploit could allow the attacker to cause the device to reload, resulting
  in a DoS condition."
