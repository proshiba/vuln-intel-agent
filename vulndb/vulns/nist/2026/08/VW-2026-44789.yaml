title: "In the Linux kernel, the following vulnerability has been resolved:\n\nraid1:
  fix nr_pending leak in REQ_ATOMIC bad-block error path\n\nIn raid1_write_request(),
  each per-mirror loop iteration begins by\nincrementing rdev->nr_pending. If a REQ_ATOMIC
  write encounters a\nbadblock within the requested range, the code jumps to err_handle\n\
  without dropping the reference taken for the current mirror.\n\nerr_handle's cleanup
  loop will only decrements for k < i and\nr1_bio->bios[k] is non-NULL. The current
  slot is therefore skipped,\nleaving its nr_pending reference leaked permanently.
  The reference\nprevents the rdev from ever being removed, since raid1_remove_conf()\n\
  refuses to remove an rdev with nr_pending > 0.\n\nFix this by calling rdev_dec_pending()
  before jumping to err_handle."
