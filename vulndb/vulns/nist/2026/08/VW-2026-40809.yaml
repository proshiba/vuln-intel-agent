title: "In Bouncy Castle for Java FIPS (BC-FJA) before bc-fips 2.1.3, the native entropy
  source used on Intel platforms retried the CPU entropy instructions without any
  bound. RDSEED and RDRAND report failure through their carry flag, and the JNI seeding
  routine spun re-issuing the instruction for as long as that flag stayed clear, so
  a persistent failure of the on-chip entropy source - whether from a hardware fault,
  from the underlying DRBG being exhausted by contention across many cores, or from
  a hypervisor that does not provide the instruction - left the calling thread looping
  indefinitely inside the JNI call, where it could be neither interrupted nor timed
  out. Any operation drawing from the native entropy source could therefore hang,
  denying service to the application. The retry loops are now bounded (200 attempts
  for RDSEED and 20 for RDRAND, twice the baselines given in Intel's Digital Random
  Number Generator software implementation guide), pausing between attempts and, on
  exhaustion, "
