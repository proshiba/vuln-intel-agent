title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  fix BQL reset on SQ re-activation\n\nmlx5e_queue_start() deactivates and re-activates
  all channels but closes\nonly the queue being restarted. mlx5e_activate_txqsq()
  then\nunconditionally calls netdev_tx_reset_queue(), zeroing the BQL counters\n\
  of channels that kept their in-flight TX WQEs. The next completion then\nover-charges
  and trips the BUG_ON() in dql_completed():\n\n  kernel BUG at lib/dynamic_queue_limits.c:99!\n\
  \  RIP: 0010:dql_completed+0x23d/0x280\n  Call Trace:\n   <IRQ>\n   mlx5e_poll_tx_cq+0x668/0xa60\n\
  \   mlx5e_napi_poll+0x5b/0x7b0\n   net_rx_action+0x15a/0x580\n\nReset BQL only when
  the SQ has no bytes in flight (sq->cc == sq->pc).\n\nIn the case that reset is skipped,
  the outstanding WQEs will eventually\ncomplete and rebalance the dql. The dql->limit
  is carried across the\nreset."
