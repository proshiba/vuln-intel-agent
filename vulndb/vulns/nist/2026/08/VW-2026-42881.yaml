title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  Handle TC_ACT_REDIRECT from qdisc filter chains\n\nWhen a TC filter attached to
  a qdisc filter chain returns\nTC_ACT_REDIRECT (ex: via an eBPF program calling bpf_redirect()
  or an\nact_bpf action), the redirect was silently lost i.e no qdisc classify\nfunction
  handled TC_ACT_REDIRECT, so the packet fell through the\nswitch and was enqueued
  normally instead of being redirected.\n\nThis has been broken since bpf_redirect()
  was introduced for TC in\ncommit 27b29f63058d (\"bpf: add bpf_redirect() helper\"\
  ). We got lucky\nfor a long time because bpf_net_context was a per-CPU variable
  that\nwas always available.\n\ncommit 401cb7dae813 (\"net: Reference bpf_redirect_info
