title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/vm:
  move xa_alloc to prevent UAF\n\nEvil user can guess the next id of the vm before
  the ioctl completes and\nthen call vm destroy ioctl to trigger UAF since create
  ioctl is still\nreferencing the same vm. Move the xa_alloc all the way to the end
  to\nprevent this.\n\nv2:\n - Rebase\n\n(cherry picked from commit dcfd3971327f3ee92765154baebbaece833d3ca9)"
