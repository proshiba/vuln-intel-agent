title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/imagination:
  Count paired job fence as dependency in prepare_job()\n\nThe DRM scheduler's prepare_job()
  callback counts the remaining\nnon-signaled native dependencies for a job, preventing
  job submission\nuntil those (plus job data and fence update) can fit in the job
  queue's\nCCCB.\n\nThis means checking which dependencies can be waited upon in the\n\
  firmware, i.e. whether they are backed by a UFO object, i.e. whether\ntheir drm_sched_fence::parent
  has been assigned to a\npvr_queue_fence::base fence. That happens when the job owning
  the fence\nis submitted to the firmware.\n\nPaired geometry and fragment jobs are
  submitted at the same time, which\nmeans the dependency between them can't be checked
  this way before\nsubmission.\n\nUpdate job_count_remaining_native_deps() to take
  into account the\ndependency between paired jobs.\n\nThis fixes cases where prepare_job()
  underestimated the space left in\nan almost full fragment CCCB, wrong"
