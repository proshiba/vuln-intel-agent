title: An issue in MongoDB Server's geospatial query processing could allow an 
  authenticated user with write privileges to cause certain malformed geometry 
  data to be stored and later processed without proper validation. Subsequent 
  queries against this data could then result in the server accessing memory 
  outside its intended bounds. This could result in a server crash (denial of 
  service) and may expose a limited amount of server process memory.
