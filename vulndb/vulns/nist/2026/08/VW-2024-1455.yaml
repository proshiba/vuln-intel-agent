title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qrtr: Avoid potential use after free in MHI send\n\nIt is possible that the MHI
  ul_callback will be invoked immediately\nfollowing the queueing of the skb for transmission,
  leading to the\ncallback decrementing the refcount of the associated sk and freeing
  the\nskb.\n\nAs such the dereference of skb and the increment of the sk refcount
  must\nhappen before the skb is queued, to avoid the skb to be used after free\n\
  and potentially the sk to drop its last refcount.."
