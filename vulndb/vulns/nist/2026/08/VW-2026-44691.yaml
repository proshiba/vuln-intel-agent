title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/region:
  Fill first free targets[] slot during auto-discovery\n\nAny invalid endpoint decoder
  pointer in the target array of an active\nregion is not allowed by cxl driver. This
  means cxl driver always\nassumes the first p->nr_targets entries of the target array
  in an\nauto-assembly region are valid. However, there are scenarios that could\n\
  leave NULL endpoint decoder pointer holes in the target array.\n\n1. When cxl_cancel_auto_attach()
  removes an endpoint decoder from a\n   target array, the target slot is set to NULL.
