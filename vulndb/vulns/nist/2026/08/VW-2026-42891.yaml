title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  free mapping node on duplicate reloc root insert\n\n__add_reloc_root() allocates
  a mapping_node before inserting it into\nrc->reloc_root_tree.  If rb_simple_insert()
  finds an existing entry, it\nreturns the existing rb_node and leaves the newly allocated
  node unlinked.\n\nThe error path then returns -EEXIST without freeing the new node.\
  \  Since\nthe node was never inserted into reloc_root_tree, the later cleanup in\n\
  put_reloc_control() cannot find it either.\n\nFree the newly allocated node before
  returning -EEXIST.\n\nThe callers currently assert that -EEXIST should not happen,
  so this is a\ndefensive cleanup for an unexpected duplicate insert path.  If the
  path is\never reached, the local allocation should still be released."
