title: A flaw has been found in alldatacenter alldata up to 0.6.8. This impacts 
  the function FileInputStream of the file 
  /admin/controller/JobLogController.java of the component logDetailCat 
  Endpoint. This manipulation of the argument executorAddress causes path 
  traversal. It is possible to initiate the attack remotely. The exploit has 
  been published and may be used. The project closed the issue report as "not 
  planned" without any further explanation.
