title: A vulnerability was determined in Open5GS up to 2.7.1. This vulnerability
  affects the function mme_s6a_subscription_data_from_avp of the file 
  src/mme/mme-fd-path.c of the component Diameter S6a Interface. Executing a 
  manipulation of the argument msisdn_len can lead to heap-based buffer 
  overflow. It is possible to launch the attack remotely. The exploit has been 
  publicly disclosed and may be utilized. Upgrading to version 2.7.2 is able to 
  resolve this issue. This patch is called 
  7ea82cb87bb65c3694d8d7c7a5efed1c4d3c9304. Upgrading the affected component is 
  recommended.
