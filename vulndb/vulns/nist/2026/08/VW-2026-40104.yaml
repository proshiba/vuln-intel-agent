title: "The JWT authentication mechanism accepts tokens signed with algorithms other
  than those explicitly configured or supported. This allows an attacker to craft
  a JWT with an unsupported algorithm, which is then incorrectly validated, leading
  to unauthorized access.\n\nSuccessful exploitation of this vulnerability may result
  in unauthorized access to the system, including the potential compromise of administrative
  accounts and full account takeover. The CVSS score is adjusted to 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)
  in single-tenant deployments, reflecting that the impact is contained within a single
  security authority boundary."
