title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  vub300: fix use-after-free on probe failure\n\nThe vub300 driver lifetime-manages
  its controller state using\nvub300->kref, with vub300_delete() freeing the mmc host
  when the last\nreference is dropped. The probe error path after the inactivity timer
  has\nbeen armed still bypasses that lifetime rule, however, and falls through\n\
  to mmc_free_host() directly if mmc_add_host() fails.\n\nThe race window is between
  arming the inactivity timer and reaching the\nprobe error unwind after mmc_add_host()
  fails:\n\n        probe thread                     timer/workqueue\n        ------------\
  \                     ---------------\n        kref_init(&vub300->kref)        \
  \ ref = 1\n        kref_get(&vub300->kref)          ref = 2, timer ref\n       \
  \ add_timer(inactivity_timer)      fires after one second\n        |\n        |\
  \   race window\n        |<---------------------------------------------------->\n\
  \        |\n        mmc_add_host(mmc)\n       "
