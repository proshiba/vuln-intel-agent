title: The Wishlist Member plugin for WordPress is vulnerable to Account 
  Takeover via Insufficient Verification of Data Authenticity in versions up to 
  and including 3.34.1. This is due to the wpm_register() function validating 
  the registration cookie only against the GET reg parameter while accepting the
  POST mergewith and POST wpm_id parameters without verifying that the mergewith
  user ID references a temporary or incomplete registrant that is bound to the 
  current registration transaction. This makes it possible for unauthenticated 
  attackers to take over any existing WordPress account — including 
  administrator accounts — by supplying an arbitrary user's numeric ID as the 
  mergewith value, which causes wp_update_user() to overwrite the target 
