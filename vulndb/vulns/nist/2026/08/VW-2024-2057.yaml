title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-cgroup:
  fix list corruption from resetting io stat\n\nSince commit 3b8cc6298724 (\"blk-cgroup:
  Optimize blkcg_rstat_flush()\"),\neach iostat instance is added to blkcg percpu
  list, so blkcg_reset_stats()\ncan't reset the stat instance by memset(), otherwise
  the llist may be\ncorrupted.\n\nFix the issue by only resetting the counter part."
