title: Memory Allocation with Excessive Size Value (CWE-789) in the ES|QL query 
  processing of Elasticsearch can lead to denial of service via Excessive 
  Allocation (CAPEC-130). An authenticated user able to submit ES|QL queries 
  could send a specially crafted query whose evaluation allocates an unbounded 
  amount of heap memory, exhausting the available heap on the receiving node and
  causing the node to become unavailable.
