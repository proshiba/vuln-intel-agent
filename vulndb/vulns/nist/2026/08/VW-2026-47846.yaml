title: "Adminer multi_query Incorrect Check of Function Return Value Remote Code Execution
  Vulnerability. This vulnerability allows remote attackers to execute arbitrary code
  on affected installations of Adminer. Authentication is required to exploit this
  vulnerability.\n\nThe specific flaw exists within the multi_query method. The issue
  results from an incorrect check of a function return value. An attacker can leverage
  this vulnerability to execute code in the context of the web server. Was ZDI-CAN-28201."
