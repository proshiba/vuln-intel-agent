title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  make system files immutable to prevent corruption\n\nWhen a system file such as
  $Bitmap is exposed via show_sys_files and\nwritten from userspace, the volume is
  corrupted and, because the cluster\nallocator scans $Bitmap through the same inode's
  page cache, a write to\n$Bitmap also deadlocks writeback against the folio it already
  holds locked.\n\nThese files are maintained by the driver itself and have no valid
  reason\nto be written through the file interface. Mark base metadata files\n(mft_no
  < FILE_first_user) as immutable during inode read so the VFS\nrejects write, mmap,
  truncate and unlink with -EPERM. Directories are\nskipped so the root and $Extend
  remain usable. Internal metadata updates\ndo not go through the VFS write path and
  are unaffected."
