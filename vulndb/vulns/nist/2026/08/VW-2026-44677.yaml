title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_dup_netdev: add nf_dev_xmit_recursion*() helpers and use them\n\nUpdate nft_dup
  and nft_fwd to use the nf_dev_xmit_recursion() helpers.\nThis patch also disables
  BH when transmitting the skb to address a\npossible migration to different CPU leading
  to imbalanced decrementation\nof the recursion counters.\n\nThis is modeled after
  Florian Westphal's dev_xmit_recursion*() API\navailable since commit 97cdcf37b57e
  (\"net: place xmit recursion in\nsoftnet data\") according to its current state
  in the tree."
