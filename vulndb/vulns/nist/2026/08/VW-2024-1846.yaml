title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: Fix NULL dereference on XCOPY completion\n\nCPU affinity control added with
  commit 39ae3edda325 (\"scsi: target: core:\nMake completion affinity configurable\"\
  ) makes target_complete_cmd() queue\nwork on a CPU based on se_tpg->se_tpg_wwn->cmd_compl_affinity
  state.\n\nLIO's EXTENDED COPY worker is a special case in that read/write cmds are\n\
  dispatched using the global xcopy_pt_tpg, which carries a NULL se_tpg_wwn\npointer
  following initialization in target_xcopy_setup_pt().\n\nThe NULL xcopy_pt_tpg->se_tpg_wwn
  pointer is dereferenced on completion of\nany EXTENDED COPY initiated read/write
  cmds. E.g using the libiscsi\nSCSI.ExtendedCopy.Simple test:\n\n  BUG: kernel NULL
  pointer dereference, address: 00000000000001a8\n  RIP: 0010:target_complete_cmd+0x9d/0x130
  [target_core_mod]\n  Call Trace:\n   fd_execute_rw+0x148/0x42a [target_core_file]\n\
