title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/tunnel:
  wait until all sk_user_data reader finish before releasing the sock\n\nThere is
  a race condition in vxlan that when deleting a vxlan device\nduring receiving packets,
  there is a possibility that the sock is\nreleased after getting vxlan_sock vs from
  sk_user_data. Then in\nlater vxlan_ecn_decapsulate(), vxlan_get_sk_family() we will
  got\nNULL pointer dereference. e.g.\n\n   #0 [ffffa25ec6978a38] machine_kexec at
  ffffffff8c669757\n   #1 [ffffa25ec6978a90] __crash_kexec at ffffffff8c7c0a4d\n \
  \  #2 [ffffa25ec6978b58] crash_kexec at ffffffff8c7c1c48\n   #3 [ffffa25ec6978b60]
  oops_end at ffffffff8c627f2b\n   #4 [ffffa25ec6978b80] page_fault_oops at ffffffff8c678fcb\n\
  \   #5 [ffffa25ec6978bd8] exc_page_fault at ffffffff8d109542\n   #6 [ffffa25ec6978c00]
  asm_exc_page_fault at ffffffff8d200b62\n      [exception RIP: vxlan_ecn_decapsulate+0x3b]\n\
  \      RIP: ffffffffc1014e7b  RSP: ffffa25ec6978cb0  RFLAGS: 00010246\n      RAX:
  0000000000"
