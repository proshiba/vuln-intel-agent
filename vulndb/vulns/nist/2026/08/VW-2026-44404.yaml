title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  retrieve ethhdr after potential skb realloc on RX\n\npskb_may_pull() in batadv_interface_rx()
  could reallocate the buffer behind\nthe skb. Variables which were pointing to the
  old buffer need to be\nreassigned to avoid an use-after-free.\n\nThis was done correctly
  for the VLAN header but missed for the ethernet\nheader which is later used for
  the TT and AP isolation handling."
