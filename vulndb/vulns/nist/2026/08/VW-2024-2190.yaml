title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix inode number range checks\n\nPatch series \"nilfs2: fix potential issues related
  to reserved inodes\".\n\nThis series fixes one use-after-free issue reported by
  syzbot, caused by\nnilfs2's internal inode being exposed in the namespace on a corrupted\n\
  filesystem, and a couple of flaws that cause problems if the starting\nnumber of
  non-reserved inodes written in the on-disk super block is\nintentionally (or corruptly)
  changed from its default value.  \n\n\nThis patch (of 3):\n\nIn the current implementation
  of nilfs2, \"nilfs->ns_first_ino\", which\ngives the first non-reserved inode number,
  is read from the superblock,\nbut its lower limit is not checked.\n\nAs a result,
  if a number that overlaps with the inode number range of\nreserved inodes such as
  the root directory or metadata files is set in the\nsuper block parameter, the inode
  number test macros (NILFS_MDT_INODE and\nNILFS_VALID_INODE) will not function properly.\n\
  \nIn addit"
