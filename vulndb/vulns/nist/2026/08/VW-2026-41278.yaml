title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  ti: vpe: unwind v4l2 device registration on probe error\n\nIf the vpe_top resource
  is missing, vpe_probe() returns -ENODEV after\nv4l2_device_register() has succeeded.
  Probe failures do not call the\ndriver's remove callback, so the v4l2 device remains
  registered on that\nerror path.\n\nRoute that failure through the existing v4l2_device_unregister()
  unwind\nlabel, matching the other errors after v4l2_device_register()."
