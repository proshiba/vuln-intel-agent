title: "openssl_encrypt (pip: openssl-encrypt) versions <= 1.4.8 use suffix-tolerant
  fingerprint matching in enroll_trust_key when binding a plugin-signing trust anchor.
  An operator who confirms a short (forgeable, ~32-bit) GPG key id could unknowingly
  enroll an attacker's colliding key as a trusted anchor, which then vouches for malicious
  plugins under the ENFORCE signature policy. Version 1.4.9 fixes this by requiring
  the confirmed value to exactly match the full primary-key fingerprint (case-insensitive,
  whitespace-stripped)."
