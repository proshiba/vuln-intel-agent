title: "CodeChecker's massStoreRun processing path performs one-shot decompression
  of attacker-controlled, Base64-encoded zlib data without enforcing a maximum decompressed
  size.\n\n\n\nAn authenticated user with permission to store analysis runs can submit
  a highly compressed payload that expands to a significantly larger byte sequence.
  Because the entire decompressed output is materialized in memory before being written
  to a temporary file, a sufficiently large payload may exhaust process or host memory
  and consume substantial disk space, resulting in denial of service."
