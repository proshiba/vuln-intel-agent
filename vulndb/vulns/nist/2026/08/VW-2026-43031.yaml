title: Prowler is a cloud security platform. Prior to 5.33.1, an authenticated 
  user with Lighthouse provider configuration access could supply an unvalidated
  base_url for the openai_compatible provider through POST 
  /api/v1/lighthouse/providers and POST 
  /api/v1/lighthouse/providers/{id}/connection, causing 
  api/src/backend/tasks/jobs/lighthouse_providers.py to send outbound requests, 
  including the API key in the Authorization header, to attacker-controlled or 
  internal endpoints when client.models.list was called. This issue is fixed in 
  version 5.33.1.
