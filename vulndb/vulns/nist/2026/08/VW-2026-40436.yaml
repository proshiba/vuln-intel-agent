title: "The System REST API accepts user-supplied file uploads without enforcing sufficient
  validation on the file type or destination, allowing files to be written to arbitrary
  server-accessible locations. Exploitation requires authenticated administrative
  access with publisher privileges.\n\nSuccessful exploitation permits an authenticated
  publisher to upload files to server-accessible locations. Depending on the deployment
  environment and how uploaded files are handled, this could lead to the execution
  of uploaded content, potentially resulting in remote code execution."
