title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipc/mqueue,
  msg, sem: avoid relying on a stack reference past its expiry\n\ndo_mq_timedreceive
  calls wq_sleep with a stack local address.  The\nsender (do_mq_timedsend) uses this
  address to later call pipelined_send.\n\nThis leads to a very hard to trigger race
  where a do_mq_timedreceive\ncall might return and leave do_mq_timedsend to rely
  on an invalid\naddress, causing the following crash:\n\n  RIP: 0010:wake_q_add_safe+0x13/0x60\n\
  \  Call Trace:\n   __x64_sys_mq_timedsend+0x2a9/0x490\n   do_syscall_64+0x80/0x680\n\
  \   entry_SYSCALL_64_after_hwframe+0x44/0xa9\n  RIP: 0033:0x7f5928e40343\n\nThe
  race occurs as:\n\n1. do_mq_timedreceive calls wq_sleep with the address of `struct\n\
  \   ext_wait_queue` on function stack (aliased as `ewq_addr` here) - it\n   holds
  a valid `struct ext_wait_queue *` as long as the stack has not\n   been overwritten.\n\
  \n2. `ewq_addr` gets added to info->e_wait_q[RECV].list in wq_add, and\n   do_mq_timedsend
  receives it v"
