title: 'A security vulnerability has been detected in HKUDS nanobot up to 0.2.1. Impacted
  is the function ExecTool._guard_command/ExecTool._spawn of the file nanobot/agent/tools/shell.py
  of the component Shell Allowlist Handler. Such manipulation leads to os command
  injection. The attack can be executed remotely. The exploit has been disclosed publicly
  and may be used. Upgrading to version 0.3.0 is recommended to address this issue.
  The name of the patch is 4562. It is advisable to upgrade the affected component.
  Multiple issues were reported to the project. They reacted with a high level of
  professionalism and kindness: "These five reports are variants of the same root
  cause: validation of shell commands containing multiple segments, wrappers, comments,
  or chained commands. The issue was fixed by validating every executable shell segment
  against the configured allowlist".'
