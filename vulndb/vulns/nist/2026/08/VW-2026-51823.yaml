title: "Traffic interception vulnerability in BOSH Director vCenter CPI allows attackers
  positioned between BOSH Director and vCenter to impersonate vCenter REST API and
  capture administrator credentials via HTTP Basic auth, leading to complete virtualization
  infrastructure takeover.\n\n\n\nAn attacker who can intercept traffic between the
  BOSH Director and vCenter can establish a malicious server impersonating the vCenter
  REST API. When the BOSH Director makes CPI calls to perform routine cloud infrastructure
  operations, the attacker captures the vCenter administrator username and password
  transmitted via HTTP Basic authentication.\n\n\n\nThe vulnerability stems from insufficient
  authentication security in the communication protocol between BOSH Director and
