title: "Vulnerability-Lookup contains a server-side request forgery (SSRF) vulnerability
  in the remote-instance synchronization functionality. Remote instance addresses
  were validated only for basic URL syntax before being stored, while the synchronization
  worker later dereferenced these addresses using requests.get() with automatic redirect
  handling and without enforcing network-boundary restrictions. \n\n\nAn authenticated
  administrator with the admin:access permission could configure a remote instance
  whose address points to an internal, loopback, link-local, or cloud metadata HTTP(S)
  service. When synchronization is performed, the Vulnerability-Lookup server would
  issue the request from its own network context. An attacker could also use a publicly
  accessible URL that redirects to an internal destination, because redirects were
  previously followed without revalidating the destination.\n\n\nSuccessful exploitation
