title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: Fix kernel heap address leak in bounce_error_event()\n\nThe comment above bounce_error_event()
  documents that user clients\nshould receive SNDRV_SEQ_EVENT_BOUNCE with the original
  event embedded\nas variable-length data, while kernel clients should receive\nSNDRV_SEQ_EVENT_KERNEL_ERROR
  with a quoted kernel pointer.\n\nHowever, the implementation unconditionally uses\n\
  SNDRV_SEQ_EVENT_KERNEL_ERROR with data.quote.event set to the raw\nstruct snd_seq_event
  pointer for all clients.  When a bounce error\nevent is delivered to a USER_CLIENT
  via snd_seq_read(), the kernel\nheap address in data.quote.event is exposed to userspace
  through\ncopy_to_user() in the fixed-length branch.\n\nThis is a distinct leak path
  from the one addressed by commit\n705dd6dcbc0e (\"ALSA: seq: Clear variable event
