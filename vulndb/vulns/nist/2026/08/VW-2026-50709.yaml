title: "Applications that deserialize execution contexts with Jackson2ExecutionContextStringSerializer
  are vulnerable to a deserialization attack if they use an untrusted data source
  for the job repository. The JobParameterDeserializer does not properly enforce the
  trusted-types allowlist, allowing an attacker to craft malicious input that can
  lead to arbitrary code execution, including known Jackson RCE gadgets.\nSpring Batch
  6.0.0 - 6.0.4\nSpring Batch 5.2.0 - 5.2.6"
