title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath9k: hif_usb: don't dereference hif_dev after re-arming firmware request\n\nath9k_hif_request_firmware()
  re-arms an asynchronous firmware load via\nrequest_firmware_nowait(), passing hif_dev
  as the completion context, and\nthen still dereferences hif_dev:\n\n\tdev_info(&hif_dev->udev->dev,
  \"ath9k_htc: Firmware %s requested\\n\",\n\t\t hif_dev->fw_name);\n\nThe re-armed
  callback ath9k_hif_usb_firmware_cb() runs on the \"events\"\nworkqueue and, when
  the firmware is missing, walks the retry chain into\nath9k_hif_usb_firmware_fail()
  -> complete_all(&hif_dev->fw_done). That\nreleases the wait_for_completion(&hif_dev->fw_done)
  in a concurrent\nath9k_hif_usb_disconnect(), which then kfree()s hif_dev. The trailing\n\
  dev_info() in the frame that re-armed the request can therefore read freed\nmemory
  (hif_dev->udev, the first field of struct hif_device_usb):\n\n  BUG: KASAN: slab-use-after-free
  in ath9k_hif_request_firmware\n  Read of size 8 ..."
