title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/osnoise:
  Use a cpumask to know what threads are kthreads\n\nThe start_kthread() and stop_thread()
  code was not always called with the\ninterface_lock held. This means that the kthread
  variable could be\nunexpectedly changed causing the kthread_stop() to be called
  on it when it\nshould not have been, leading to:\n\n while true; do\n   rtla timerlat
  top -u -q & PID=$!;\n   sleep 5;\n   kill -INT $PID;\n   sleep 0.001;\n   kill -TERM
  $PID;\n   wait $PID;\n  done\n\nCausing the following OOPS:\n\n Oops: general protection
  fault, probably for non-canonical address 0xdffffc0000000002: 0000 [#1] PREEMPT
  SMP KASAN PTI\n KASAN: null-ptr-deref in range [0x0000000000000010-0x0000000000000017]\n\
  \ CPU: 5 UID: 0 PID: 885 Comm: timerlatu/5 Not tainted 6.11.0-rc4-test-00002-gbc754cc76d1b-dirty
  #125 a533010b71dab205ad2f507188ce8c82203b0254\n Hardware name: QEMU Standard PC
  (Q35 + ICH9, 2009), BIOS 1.16.3-debian-1.16.3-2 04/01/2014\n RIP: 0010:hrtime"
