title: A security flaw has been discovered in provectus kafka-ui up to 0.7.2. 
  The affected element is the function executeSmartFilterTest of the file 
  kafka-ui-api/src/main/java/com/provectus/kafka/ui/controller/MessagesController.java
  of the component Groovy Code Handler. The manipulation results in code 
  injection. The attack may be launched remotely. The exploit has been released 
  to the public and may be used for attacks. The project was informed of the 
  problem early through an issue report but has not responded yet.
