title: "An edgecase in SSO implementation in Neo4j Enterprise edition versions prior
  to version 2026.02 can lead to unauthorised access under the following conditions:\n\
  \n\nIf a neo4j admin configures two or more OIDC providers AND configures one or
  more of them to be an authorization provider AND configures one or more of them
  to be authentication-only, then those that are authentication-only will also provide
  authorization. This edgecase becomes a security problem only if the authentication-only
  provider contains groups which have higher privileges than provided by the intended
  (configured) authorization provider.  \n\nWhen using multiple plugins for authentication
  and authorisation, prior to the fix the issue could lead to a plugin configured
  to provide only authentication or authorisation capabilities erroneously providing
  both capabilities. \n\nWe recommend upgrading to versions 2026.02 (or 5.26.22) where
  the issue is fixed."
