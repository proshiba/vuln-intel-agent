title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/virt/sev:
  Revert \"Drop WBINVD before setting MSR_AMD64_SYSCFG_SNP_EN\"\n\nRevert\n\n  99cf1fb58e68
  (\"x86/virt/sev: Drop WBINVD before setting MSR_AMD64_SYSCFG_SNP_EN\").\n\nSection
  8.8 of the SNP spec says:\n\n  Before invoking SNP_INIT_EX with INIT_RMP set to
  1, software must ensure\n  that no CPUs contain dirty cache lines for the memory
  containing the RMP.\n\nCachelines can be moved from cache to cache in a dirty state.
  The\nwbinvd_on_all_cpus() before SNP_INIT_EX flushes the caches for each CPU, but\n\
  if the IPIs for WBINVD race with this dirty cacheline movement, it is possible\n\
  that they may not get flushed, violating the firmware requirement.\n\nDoing wbinvd_on_all_cpus()
  before setting SNPEn is safer since the RMP\ntable is not yet in use.\n\n  [ Heroically
  bisected by Srikanth. ]\n  [ bp: Massage commit message. ]"
