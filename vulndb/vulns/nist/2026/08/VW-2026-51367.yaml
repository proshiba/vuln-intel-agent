title: "In the Linux kernel, the following vulnerability has been resolved:\n\nACPI:
  processor_idle: Mark LPI enter functions as __cpuidle\n\nWhen function tracing or
  Kprobes is enabled, entering an ACPI Low\nPower Idle (LPI) state triggers the following
  RCU splat:\n\n  RCU not on for: acpi_idle_lpi_enter+0x4/0xd8\n  WARNING: CPU: 8
  PID: 0 at include/linux/trace_recursion.h:162 function_trace_call+0x1e8/0x228\n\n\
  The acpi_idle_lpi_enter() function is invoked within the cpuidle\npath after RCU
  has already been disabled for the current local CPU.\nConsequently, ftrace's function_trace_call()
  expects RCU to be\nactively watching before recording trace data, emitting a warning\n\
  if it is not.\n\nFix this by annotating acpi_idle_lpi_enter(), the generic __weak\n\
  stub, and the RISC-V implementation of acpi_processor_ffh_lpi_enter()\nwith __cpuidle.
  This moves these functions into the '.cpuidle.text'\nsection, implicitly disabling
  ftrace instrumentation (notrace) along\nthis sensitive path and preventing trace-induced
  RCU "
