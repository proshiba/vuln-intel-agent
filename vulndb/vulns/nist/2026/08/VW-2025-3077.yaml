title: "In the Linux kernel, the following vulnerability has been resolved:\n\niavf:
  Fix out-of-bounds when setting channels on remove\n\nIf we set channels greater
  during iavf_remove(), and waiting reset done\nwould be timeout, then returned with
  error but changed num_active_queues\ndirectly, that will lead to OOB like the following
  logs. Because the\nnum_active_queues is greater than tx/rx_rings[] allocated actually.\n\
  \nReproducer:\n\n  [root@host ~]# cat repro.sh\n  #!/bin/bash\n\n  pf_dbsf=\"0000:41:00.0\"\
  \n  vf0_dbsf=\"0000:41:02.0\"\n  g_pids=()\n\n  function do_set_numvf()\n  {\n \
  \     echo 2 >/sys/bus/pci/devices/${pf_dbsf}/sriov_numvfs\n      sleep $((RANDOM%3+1))\n\
  \      echo 0 >/sys/bus/pci/devices/${pf_dbsf}/sriov_numvfs\n      sleep $((RANDOM%3+1))\n\
  \  }\n\n  function do_set_channel()\n  {\n      local nic=$(ls -1 --indicator-style=none
  /sys/bus/pci/devices/${vf0_dbsf}/net/)\n      [ -z \"$nic\" ] && { sleep $((RANDOM%3))
  ; return 1; }\n      ifconfig $nic 192.168.18.5 netmask 255.255.255.0\n      ifconfig
  $nic up\n     "
