title: "A denial-of-service vulnerability was identified in multiple TLS listeners
  in Rancher. Both the cattle-cluster-agent component running in downstream clusters
  and the Rancher server itself use the dynamiclistener library to serve TLS traffic.
  Without an effective CN filter configured, dynamiclistener automatically appended
  to each serving certificate any hostname presented via Server Name Indication (SNI)
  in incoming TLS requests.\n\n\n\nAn unauthenticated attacker with network access
  within the affected cluster could send a large number of TLS requests with distinct
  hostnames, causing the serving certificate to accumulate an unbounded number of
  Subject Alternative Names (SANs). Eventually, the certificate grows large enough
  that TLS handshakes fail with an excessive message size error, causing a denial
  of service on the affected listeners."
