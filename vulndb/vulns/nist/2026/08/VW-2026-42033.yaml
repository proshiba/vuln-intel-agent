title: A path traversal vulnerability in AsyncFuncAI deepwiki-open through 
  commit 16f35a0 allows unauthenticated remote attackers to obtain directory 
  listings for arbitrary filesystem paths via the local-repository structure 
  endpoint. The endpoint accepts an absolute filesystem path parameter and 
  returns a directory listing without authentication, as WIKI_AUTH_MODE defaults
  to false. An attacker can enumerate sensitive directory contents on the host 
  system.
