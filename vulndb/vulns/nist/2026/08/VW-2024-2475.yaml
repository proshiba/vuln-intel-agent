title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  x86-android-tablets: Fix use after free on platform_device_register() errors\n\n\
  x86_android_tablet_remove() frees the pdevs[] array, so it should not\nbe used after
  calling x86_android_tablet_remove().\n\nWhen platform_device_register() fails, store
  the pdevs[x] PTR_ERR() value\ninto the local ret variable before calling x86_android_tablet_remove()\n\
  to avoid using pdevs[] after it has been freed."
