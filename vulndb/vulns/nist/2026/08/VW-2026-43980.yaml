title: CKAN MCP Server is a tool for querying CKAN open data portals. Prior to 
  0.4.112, canonicalizeParams in src/utils/cache.ts serializes request 
  parameters with unescaped ampersand, equals-sign, and vertical-bar delimiters,
  allowing different logical parameter sets used by buildCacheKey to collide and
  an attacker to prime a shared cache with a response for a victim's distinct 
  query. This issue is fixed in version 0.4.112.
