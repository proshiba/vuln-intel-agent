title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  host: max3421: Fix shift-out-of-bounds in max3421_hub_control()\n\nThe `max3421_hub_control()`
  function handles USB hub class requests\nto the virtual root hub. In the `default`
  branches of both the\n`ClearPortFeature` and `SetPortFeature` switch statements,
  it modifies\n`max3421_hcd->port_status` by left shifting 1 by the request's `value`\n\
  parameter. However, it does not validate whether this shift will exceed\nthe width
  of `port_status`.\n\nSo if a malicious userspace task with access to the root hub
  via\n/dev/bus/usb/.../001 issues a USBDEVFS_CONTROL ioctl with `wValue`\ngreater
  than or equal to 32, the left shift operation invokes\nshift-out-of-bounds undefined
  behavior. This results in arbitrary\nbit corruption of `port_status`, including
  the normally-immutable\nchange bits, which can bypass internal state checks and
  confuse the\nhub status.\n\nFix this by rejecting requests whose `value` exceeds
  the shift width\nbefore perf"
