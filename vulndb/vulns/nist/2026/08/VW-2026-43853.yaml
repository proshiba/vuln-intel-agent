title: 'A vulnerability was determined in DTStack Taier 1.4.0. Affected by this issue
  is the function FileUtils.deleteDirectory of the file ClusterController.java of
  the component Cluster Creation. This manipulation of the argument clusterName causes
  path traversal. Remote exploitation of the attack is possible. Upgrading to version
  1.5.0 can resolve this issue. Patch name: ec8c59c76aceb04ab3080543ab2d9c6a4b674729.
  The affected component should be upgraded.'
