title: A vulnerability was found in UTT HiPER 1250GW up to 3.2.7-210907-180535. 
  Impacted is the function strcpy of the file /goform/APSecurity_5g. Performing 
  a manipulation of the argument cipher results in stack-based buffer overflow. 
  It is possible to initiate the attack remotely. The exploit has been made 
  public and could be used. The vendor was contacted early about this disclosure
  but did not respond in any way.
