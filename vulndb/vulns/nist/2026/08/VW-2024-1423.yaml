title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  spectrum_acl_tcam: Fix stack corruption\n\nWhen tc filters are first added to a
  net device, the corresponding local\nport gets bound to an ACL group in the device.
  The group contains a list\nof ACLs. In turn, each ACL points to a different TCAM
  region where the\nfilters are stored. During forwarding, the ACLs are sequentially\n\
  evaluated until a match is found.\n\nOne reason to place filters in different regions
  is when they are added\nwith decreasing priorities and in an alternating order so
  that two\nconsecutive filters can never fit in the same region because of their\n\
  key usage.\n\nIn Spectrum-2 and newer ASICs the firmware started to report that
  the\nmaximum number of ACLs in a group is more than 16, but the layout of the\n\
  register that configures ACL groups (PAGT) was not updated to account\nfor that.
  It is therefore possible to hit stack corruption [1] in the\nrare case where more
  than 16 ACLs in a group are required.\n\nFi"
