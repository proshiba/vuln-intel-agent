title: art-template's sub-template resolution logic 
  (src/compile/adapter/resolve-filename.js), used by both the include() and 
  extend() template directives, resolves the target file path via 
  path.resolve(root, filename) with no check afterward that the result remains 
  inside root. Because path.resolve() discards root entirely when filename is an
  absolute path, and does not block '../' traversal sequences, and the resolved 
  path is passed directly to fs.readFileSync() in loader.js with its contents 
  compiled and rendered, an application that lets a sub-template name be 
  influenced by external input (e.g. a query parameter passed into {{include 
  page}}) allows an attacker to read arbitrary files on disk that the Node 
  process can access.
