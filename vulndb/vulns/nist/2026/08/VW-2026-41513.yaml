title: ReadyEcommerce before 4.5.2 contains a stored cross-site scripting (XSS) 
  vulnerability that allows authenticated customers to inject malicious HTML 
  payloads through the chat and support ticket messaging systems by exploiting 
  unsanitized rendering via the v-html directive in Messages.vue, 
  RightChatSidebar.vue, SupportTicketMessages.vue, and SupportTicketDetails.vue.
  Attackers can submit crafted message content that executes arbitrary 
  JavaScript in the browser of any shop owner or administrator who views the 
  message, enabling session cookie theft and account takeover.
