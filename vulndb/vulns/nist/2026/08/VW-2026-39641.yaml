title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  fix sk_dst_cache double-free in xfrm_user_policy()\n\nxfrm_user_policy() clears
  the socket dst cache with __sk_dst_reset(),\ni.e. the non-atomic __sk_dst_set(sk,
  NULL): it reads sk_dst_cache with\nrcu_dereference_protected(), stores NULL and
  dst_release()s the old dst.\nThat is only safe if no other thread modifies sk_dst_cache
  concurrently.\n\nFor a connected UDP socket that does not hold: the transmit fast
  path\n(udp_sendmsg -> sk_dst_check -> sk_dst_reset) resets the cache locklessly\n\
  with an atomic xchg(). A per-socket policy change racing a send can make\nboth sides
  observe the same old dst and each dst_release() it, dropping\nthe socket's single
  reference twice and freeing the xfrm_dst bundle while\nit is still referenced:\n\
  \n  BUG: KASAN: slab-use-after-free in dst_release\n  Write of size 4 at addr ffff88801897b6c0
  by task exploit/155\n  Call Trace:\n   ...\n   dst_release (... ./include/linux/rcuref.h:109)\n\
  \   xfrm_user_p"
