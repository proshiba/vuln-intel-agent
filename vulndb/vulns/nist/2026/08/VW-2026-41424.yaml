title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath6kl: fix OOB read from firmware num_msg in TX complete handler\n\nThe firmware-controlled
  num_msg field (u8, 0-255) drives the loop in\nath6kl_wmi_tx_complete_event_rx()
  without validation against the buffer\nlength. This allows out-of-bounds reads of
  up to 1020 bytes past the\nWMI event buffer when the firmware sends an inflated
  num_msg.\n\nAdd a check that the buffer is large enough to hold the fixed struct\n\
  and the num_msg variable-length entries."
