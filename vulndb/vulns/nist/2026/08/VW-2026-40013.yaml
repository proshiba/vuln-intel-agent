title: A vulnerability has been found in heshengtao super-agent-party up to 
  0.4.1. The impacted element is the function sanitize_proxy_url of the file 
  server.py of the component extension_proxy Route. The manipulation of the 
  argument url leads to server-side request forgery. The attack can be initiated
  remotely. The exploit has been disclosed to the public and may be used. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
