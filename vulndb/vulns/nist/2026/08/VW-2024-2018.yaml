  used today only protects concurrency across a given\ntransmit queue between the
  transmit and reclaiming. This creates an opportunity\nfor the SYSTEMPORT hardware
  to work on corrupted descriptors if we have\nmultiple producers at once which is
  the case when using multiple transmit\nqueues.\n\nThis was particularly noticeable
