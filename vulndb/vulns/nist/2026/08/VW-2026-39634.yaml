title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: tear down new links on vif update error path\n\nWhen ieee80211_vif_update_links()
  adds new links it allocates a link\ncontainer for each and calls ieee80211_link_init()
  (which registers the\nper-link debugfs files with file->private_data pointing into
  the container)\nand ieee80211_link_setup(). If the subsequent drv_change_vif_links()
  fails,\nthe error path restores the old pointers and jumps to 'free', which frees\n\
  the new containers but never removes their debugfs entries or stops the\nlinks.
  The debugfs files survive with file->private_data dangling at the\nfreed container,
  so a later open()+read() (e.g. link-1/txpower)\ndereferences freed memory in ieee80211_if_read_link(),
  a use-after-free.\n\nThe removal path already dismantles links correctly via\nieee80211_tear_down_links(),
  which removes each link's keys and debugfs\nentries and calls ieee80211_link_stop();
  the add path on the error branch\ndoes not. Commit "
