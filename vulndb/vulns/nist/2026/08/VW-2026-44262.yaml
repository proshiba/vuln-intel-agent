title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Fix use-after-free in amdxdna_gem_dmabuf_mmap()\n\nWhen vm_insert_pages() fails,
  the error path calls vma->vm_ops->close(vma)\nwhich internally calls drm_gem_vm_close()
  → drm_gem_object_put(),\nreleasing the GEM object reference acquired at the start
  of the function.\nHowever, the close_vma label then falls through to put_obj, which
  calls\ndrm_gem_object_put() a second time on the same object.\n\nIf the first put
  releases the last reference, the object is freed and the\nsecond put accesses freed
  memory, causing a use-after-free.\n\nFix by returning directly from close_vma instead
  of falling through to\nput_obj, since the close handler already performs all necessary
  cleanup\nincluding the object put."
