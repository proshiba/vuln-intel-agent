title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  fix PTP Call Trace during PTP release\n\nIf a PF reset occurs when the PTP state
  is ICE_PTP_UNINIT, then\nice_ptp_rebuild() will update the state to ICE_PTP_ERROR.
  This will\nresult in the following PTP release call trace during driver unload:\n\
  \n    kernel BUG at lib/list_debug.c:52!\n    ice_ptp_release+0x332/0x3c0 [ice]\n\
  \    ice_deinit_features.part.0+0x10e/0x120 [ice]\n    ice_remove+0x100/0x220 [ice]\n\
  \nThis was observed when passing PF1 through to a VM. ice_ptp_init()\nfails because
  ctrl_pf is NULL and sets the state to ICE_PTP_UNINIT.\n\nFix by detecting the ICE_PTP_UNINIT
  state in ice_ptp_rebuild() and\nreturning without error, preventing the invalid
  state transition to\nICE_PTP_ERROR. The only valid path to ICE_PTP_ERROR is from\n\
  ICE_PTP_RESETTING after a failed rebuild."
