title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndibs:
  initialise dibs->lock in dibs_dev_alloc()\n\ndibs->lock is initialised by dibs_dev_add(),
  but a dibs device can\nalready take interrupts before that call: ism_probe() runs\n\
  ism_dev_init(), and hence request_irq(), before it calls\ndibs_dev_add(). No client
  can have registered a dmb at that point, so\nno dmb interrupt can occur, but a GID
  event interrupt can, and\nism_handle_irq() takes dibs->lock unconditionally on entry,
  before it\ninspects anything else.\n\nInitialise the lock in dibs_dev_alloc() instead,
  so that it is valid as\nsoon as a driver can publish the device to its interrupt
  handler."
