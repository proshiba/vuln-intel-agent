title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  mchp23k256: use SPI match data for chip caps\n\nThe driver stores chip capacity
  information in both the OF match table\nand the SPI id table. Probe currently uses
  of_device_get_match_data(),\nso a non-OF SPI modalias match falls back to mchp23k256_caps
  even when\nthe SPI id table selected a different part.\n\nUse spi_get_device_match_data()
  so SPI id-table driver_data is consumed\nwhen OF match data is absent. This keeps
  the existing default fallback\nwhile avoiding the wrong MTD geometry for id-table-only
  matches."
