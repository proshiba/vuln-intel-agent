title: 'A vulnerability was detected in HKUDS nanobot up to 0.2.1. The affected element
  is the function connect_mcp_servers of the file nanobot/agent/tools/mcp.py of the
  component MCP enabledTools Scope Handler. Performing a manipulation results in improper
  access controls. The attack is possible to be carried out remotely. The exploit
  is now public and may be used. Upgrading to version 0.3.0 is sufficient to fix this
  issue. The patch is named 4436. You should upgrade the affected component. Multiple
  issues were reported to the project. They reacted with a high level of professionalism
  and kindness: "Both reports describe the same root cause: MCP resource and prompt
  wrappers could be registered outside the intended enabledTools scope. The registration
  boundary was corrected".'
