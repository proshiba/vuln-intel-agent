title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/sysfs-schemes:
  put stats for scheme_add_dirs() internal error\n\ndamon_sysfs_scheme_add_dirs()
  setup the tried_regions directory after the\nstats directory setup is completed.\
  \  When the tried_regions directory\nsetup is failed, the setup function ensures
  the reference for the tried\nregions directory is released.  Hence the error path
  should put references\non setup succeeded directory objects, starting from the stats
  directory. \nHowever, the error path is putting the tried_regions directory instead
  of\nthe stats directory.\n\nAs a direct result, the stats directory object is leaked.\
  \  Worse yet, if\nthe tried_regions directory setup failed from the initial allocation,
  the\nscheme->tried_regions field remains uninitialized.  The following\nkobject_put(&scheme->tried_regions->kobj)
