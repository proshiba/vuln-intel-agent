title: "An application using Micrometer Tracing with W3C baggage propagation in the
  Brave bridge is vulnerable to denial of service (DoS) due to unbounded object allocation
  when extracting incoming baggage headers.\n\n\n\nSpecifically, an application is
  vulnerable when all the following are true:\n\n  *  The application uses a vulnerable
  version of io.micrometer:micrometer-tracing-bridge-brave.\n  *  W3C propagation
  is active (either configured manually or active by default, such as in Spring Boot
  3.x+).\n  *  Baggage propagation is enabled (which is the default in Spring Boot
  3.x+) and a baggage manager (such as BraveBaggageManager) is configured to handle
  baggage fields.\n  *  The application processes requests or messages from untrusted
  sources with baggage headers which it normally should not, see:  https://www.w3.org/TR/trace-context/#security-considerations
