title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/perf:
  fix preempt count underflow in fsl_emb_pmu_del\n\nfsl_emb_pmu_del() unconditionally
  calls put_cpu_var(cpu_hw_events) at\nthe 'out:' label, but only calls the matching
  get_cpu_var() after the\n'i < 0' early-return check. When event->hw.idx is negative
  the\nfunction jumps to 'out:' without having taken get_cpu_var(), and the\ntrailing
  put_cpu_var() then issues an unmatched preempt_enable(),\nunderflowing preempt_count.\n\
  \nOn a CONFIG_PREEMPT=y kernel preempt_count would underflow and\neventually present
  as a 'scheduling while atomic' BUG.\n\nMove put_cpu_var() to pair with get_cpu_var()
  so the percpu access is\ncorrectly bracketed and the 'out:' label only handles perf_pmu_enable."
