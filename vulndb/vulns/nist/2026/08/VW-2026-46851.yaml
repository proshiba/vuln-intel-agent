title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Installation and Configuration).   The supported version
  that is affected is 11.2.25.0.000. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via HTTP to compromise Oracle Hyperion Infrastructure
  Technology.  Successful attacks require human interaction from a person other than
  the attacker and while the vulnerability is in Oracle Hyperion Infrastructure Technology,
  attacks may significantly impact additional products (scope change). Successful
  attacks of this vulnerability can result in takeover of Oracle Hyperion Infrastructure
  Technology. CVSS 3.1 Base Score 9.6 (Confidentiality, Integrity and Availability
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H).'
