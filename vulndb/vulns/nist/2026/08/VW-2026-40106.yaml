title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_midi: cancel pending IN work before freeing the midi object\n\nThe f_midi
  driver embeds a work item (midi->work) whose handler,\nf_midi_in_work(), dereferences
  the enclosing struct f_midi through\ncontainer_of().  This work is armed from two
  sites: f_midi_complete(),\non a normal IN-endpoint completion, and f_midi_in_trigger(),
  on an ALSA\nrawmidi output-stream start.\n\nNeither f_midi_disable() nor f_midi_unbind()
  cancels midi->work.\nf_midi_disable() only disables the endpoints and drains the
  in_req_fifo;\nit does not synchronize the work item, and the sound card is released\n\
  asynchronously to the final free of the midi object.\n\nThe midi object is reference-counted
  (midi->free_ref) and is freed in\nf_midi_free() only once both the usb_function
  reference and the rawmidi\nprivate_data reference have been dropped.  In f_midi_unbind(),\n\
  f_midi_disable() runs before the sound card is released, so while the\nUSB endpoints"
