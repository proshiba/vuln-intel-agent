title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ip6tables: mark malformed IPv6 extension headers for hotdrop\n\nThe ah, hbh and
  rt matches check that the fixed extension header is\npresent, then use the header
  length field to derive the advertised\nextension header length for matching.\n\n\
  For the ah match, add the missing advertised-length check. For hbh\nand rt, update
  the existing advertised-length checks. In all three\ncases, set hotdrop to true
  before returning false when the advertised\nextension header length exceeds the
  available skb data.\n\nReturning false treats the packet as a rule mismatch. Set
  hotdrop to\ntrue and drop malformed packets so they cannot bypass rules intended\n\
  to drop packets with these IPv6 extension headers."
