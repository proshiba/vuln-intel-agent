title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: avoid num_encaps underflow on bridge VLAN untag\n\nThe DEV_PATH_BR_VLAN_UNTAG
  case post-decrements info->num_encaps\ninside WARN_ON_ONCE(). num_encaps is u8,
  so if it's already 0 the\ndecrement still happens and wraps it to 255. The break
  only leaves\nthe inner switch -- a later path entry can set info->indev back to\n\
  a real device, and we end up returning with num_encaps == 255.\n\nnft_dev_forward_path()
  then walks info.encap[] (size 2) up to\nnum_encaps, which means an OOB stack read
  and a bogus count copied\ninto the route descriptor.\n\nShould only happen on a
  malformed bridge path stack, hence the WARN,\nbut worth handling sanely. Move the
  decrement out of the WARN.\n\n[ While at this, remove the WARN_ON_ONCE since this
  can only happen\n  with a buggy bridge path stack --pablo ]."
