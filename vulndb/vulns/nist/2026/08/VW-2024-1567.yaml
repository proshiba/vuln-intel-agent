title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSv4:
  Fix a NULL pointer dereference in pnfs_mark_matching_lsegs_return()\n\nCommit de144ff4234f
  changes _pnfs_return_layout() to call\npnfs_mark_matching_lsegs_return() passing
  NULL as the struct\npnfs_layout_range argument. Unfortunately,\npnfs_mark_matching_lsegs_return()
  doesn't check if we have a value here\nbefore dereferencing it, causing an oops.\n\
  \nI'm able to hit this crash consistently when running connectathon basic\ntests
  on NFS v4.1/v4.2 against Ontap."
