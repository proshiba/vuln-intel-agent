title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  deal with integer overflows in kmalloc_reserve()\n\nBlamed commit changed:\n   \
  \ ptr = kmalloc(size);\n    if (ptr)\n      size = ksize(ptr);\n\n    size = kmalloc_size_roundup(size);\n\
  \    ptr = kmalloc(size);\n\nThis allowed various crash as reported by syzbot [1]\n\
  and Kyle Zeng.\n\nProblem is that if @size is bigger than 0x80000001,\nkmalloc_size_roundup(size)
  returns 2^32.\n\nkmalloc_reserve() uses a 32bit variable (obj_size),\nso 2^32 is
  truncated to 0.\n\nkmalloc(0) returns ZERO_SIZE_PTR which is not handled by\nskb
  allocations.\n\nFollowing trace can be triggered if a netdev->mtu is set\nclose
  to 0x7fffffff\n\nWe might in the future limit netdev->mtu to more sensible\nlimit
  (like KMALLOC_MAX_SIZE).\n\nThis patch is based on a syzbot report, and also a report\n\
  and tentative fix from Kyle Zeng.\n\n[1]\nBUG: KASAN: user-memory-access in __build_skb_around
  net/core/skbuff.c:294 [inline]\nBUG: KASAN: user-memory-access in __alloc_skb+0x3c4/0x6e8"
