title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmack:
  tcp: ipv4, fix incorrect labeling\n\nCurrently, Smack mirrors the label of incoming
  tcp/ipv4 connections:\nwhen a label 'foo' connects to a label 'bar' with tcp/ipv4,\n\
  'foo' always gets 'foo' in returned ipv4 packets. So,\n1) returned packets are incorrectly
  labeled ('foo' instead of 'bar')\n2) 'bar' can write to 'foo' without being authorized
  to write.\n\nHere is a scenario how to see this:\n\n* Take two machines, let's call
  them C and S,\n   with active Smack in the default state\n   (no settings, no rules,
  no labeled hosts, only builtin labels)\n\n* At S, add Smack rule 'foo bar w'\n \
  \  (labels 'foo' and 'bar' are instantiated at S at this moment)\n\n* At S, at label
  'bar', launch a program\n   that listens for incoming tcp/ipv4 connections\n\n*
  From C, at label 'foo', connect to the listener at S.\n   (label 'foo' is instantiated
  at C at this moment)\n   Connection succeedes and works.\n\n* Send some data in
  both directions.\n* Coll"
