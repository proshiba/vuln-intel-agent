title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_cluster: reject template conntracks in hash match\n\nxt_cluster_mt() treats any
  non-NULL nf_ct_get() result as a fully\ninitialized conntrack and passes it to xt_cluster_hash().\n\
  \nThis causes a state confusion bug when the raw table CT target attaches\na template
  conntrack to skb->_nfct before normal conntrack processing.\nTemplates carry IPS_TEMPLATE
  status but do not have a valid tuple for\nhashing yet, so xt_cluster_hash() can
  hit its WARN_ON() path on the\nzeroed l3num field.\n\nReject template conntracks
  before hashing them. This matches existing\nnetfilter handling for template objects
  and avoids hashing incomplete\nconntrack state."
