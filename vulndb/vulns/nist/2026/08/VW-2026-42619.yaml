title: PeerTube is an ActivityPub-federated video streaming platform. Prior to 
  8.1.6, ActorFollowModel.updateScore() interpolates the attacker-controlled 
  ActivityPub actor inboxUrl into an SQL query, allowing an unauthenticated 
  remote server to read and write PeerTube database tables, including 
  oAuthToken.accessToken, and take over administrator accounts. This issue is 
  fixed in version 8.1.6.
