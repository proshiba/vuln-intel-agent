title: Typebot is an open-source chatbot builder. In self-hosted versions prior 
  to 3.18.0, the server-side Send Email integration block allows arbitrary 
  reading of local files on the server. The block builds Nodemailer attachments 
  from a typebot variable, and its parseAttachments helper returns the supplied 
  value as a filesystem path whenever it does not start with the application's 
  own base URL, instead of requiring an http or https URL. The Nodemailer 
  transport is created without disableFileAccess or disableUrlAccess, both of 
  which default to false, so an attachment specified as an absolute server path 
  is read from the local filesystem and delivered. Because both the attachment 
  value and the recipient list are attacker-controllable typebot variables, any 
  registered user can publish a bot whose Send Email block attaches an absolute 
  path such as /etc/passwd or /proc/self/environ and mails it to an address they
