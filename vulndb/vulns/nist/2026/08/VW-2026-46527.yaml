title: "The Zephyr kernel validates the k_thread_join() and k_thread_abort() system
  calls (declared __syscall in include/zephyr/kernel.h) through thread_obj_validate()
  in kernel/thread.c. Its default switch branch is the access-denied path, taken when
  k_object_validate() returns -EPERM (the calling user thread was never granted access
  to the target thread object) or -EBADF (the supplied pointer is not a registered
  kernel object of the right type). That branch invoked K_OOPS(K_SYSCALL_VERIFY_MSG(ret,
  \"access denied\")), but K_SYSCALL_VERIFY_MSG treats a true expression as success;
  the non-zero error code ret therefore read as \"verified OK\", the kernel oops was
  never raised, and control fell through to CODE_UNREACHABLE.\n\nBecause k_thread_join()
  and k_thread_abort() are system calls, an unprivileged user-mode thread (under CONFIG_USERSPACE)
  can reach this denial path directly by calling either syscall on a thread object
