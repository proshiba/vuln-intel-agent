title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Fix unpinning of pages when an access is present\n\nsyzkaller found that the calculation
  of batch_last_index should use\n'start_index' since at input to this function the
  batch is either empty or\nit has already been adjusted to cross any accesses so
  it will start at the\npoint we are unmapping from.\n\nGetting this wrong causes
  the unmap to run over the end of the pages\nwhich corrupts pages that were never
  mapped. In most cases this triggers\nthe num pinned debugging:\n\n  WARNING: CPU:
  0 PID: 557 at drivers/iommu/iommufd/pages.c:294 __iopt_area_unfill_domain+0x152/0x560\n\
