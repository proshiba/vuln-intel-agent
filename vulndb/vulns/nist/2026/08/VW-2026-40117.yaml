title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  hid-lenovo-go: cancel cfg_setup work in hid_go_cfg_remove()\n\nhid_go_cfg_probe()
  initialises drvdata.go_cfg_setup and schedules it\nto run 2 ms later:\n\n    INIT_DELAYED_WORK(&drvdata.go_cfg_setup,
  &cfg_setup);\n    schedule_delayed_work(&drvdata.go_cfg_setup, msecs_to_jiffies(2));\n\
  \ncfg_setup() dereferences drvdata.hdev to issue MCU command requests.\nhid_go_cfg_remove()
  tears down sysfs and stops the HID device, but\nnever drains the delayed work. \
  \ If the device is unbound within the\n2 ms scheduling delay (a probe failure rolling
  back via remove, or a\nfast rmmod after probe), the work fires after hid_destroy_device()\n\
  has dropped its reference and released the underlying hdev struct,\nleaving cfg_setup()
  with a stale drvdata.hdev pointer.\n\nMirror the sibling driver hid-lenovo-go-s.c,
  whose hid_gos_cfg_remove()\nalready calls cancel_delayed_work_sync() on its analogous
  work, and\ndrain go_cfg_setup at the top of hid_go_cfg"
