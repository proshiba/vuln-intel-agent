title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  skip rehash for peers already removed from by_id\n\novpn_nl_peer_set_doit() resolves
  the target peer via\novpn_peer_get_by_id() before taking ovpn->lock. In the window
  between\nthe lookup (which only takes a refcount) and the subsequent\nspin_lock_bh(&ovpn->lock),
  a concurrent OVPN_CMD_PEER_DEL, keepalive\nexpiry, or socket teardown can take ovpn->lock
  first, run\novpn_peer_remove() to unhash the peer from all four tables (by_id,\n\
  by_vpn_addr4/6, by_transp_addr) and release the lock. set_doit then\nacquires ovpn->lock
  and calls ovpn_peer_hash_vpn_ip(), which\nre-inserts the now-removed peer back into
  the rehashing tables.\n\nThe same race affects the float path: ovpn_peer_endpoints_update()\n\
  holds only a refcount and acquires ovpn->lock very late (after async\nAEAD decrypt
  and a netlink notification), then rehashes the peer\nin the by_transp_addr table.\n\
