title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix slab-out-of-bounds in init_smb2_rsp_hdr\n\nWhen smb1 mount fails, KASAN detect
  slab-out-of-bounds in\ninit_smb2_rsp_hdr like the following one.\nFor smb1 negotiate(56bytes)
  , init_smb2_rsp_hdr() for smb2 is called.\nThe issue occurs while handling smb1
  negotiate as smb2 server operations.\nAdd smb server operations for smb1 (get_cmd_val,
  init_rsp_hdr,\nallocate_rsp_buf, check_user_session) to handle smb1 negotiate so
  that\nsmb2 server operation does not handle it.\n\n[  411.400423] CIFS: VFS: Use
  of the less secure dialect vers=1.0 is\nnot recommended unless required for access
  to very old servers\n[  411.400452] CIFS: Attempting to mount \\\\192.168.45.139\\\
  homes\n[  411.479312] ksmbd: init_smb2_rsp_hdr : 492\n[  411.479323] ==================================================================\n\
  [  411.479327] BUG: KASAN: slab-out-of-bounds in\ninit_smb2_rsp_hdr+0x1e2/0x1f4
  [ksmbd]\n[  411.479369] Read of size 16 at addr ffff8884"
