title: Unitree G1 EDU firmware through 1.5.2 contains multiple chained 
  vulnerabilities in the BLE GATT server and WiFi provisioning stack that allow 
  unauthenticated proximate attackers to achieve root code execution without 
  pairing or credentials by exploiting an unquoted heredoc variable in the WiFi 
  provisioning script and a buffer overflow in the SSID chunk accumulator. 
  Attackers can send crafted BLE writes to overflow a fixed BSS buffer across 
  BLE connections, corrupting an adjacent mainloop function pointer dispatch 
  entry that is subsequently invoked by the cleanup path passing 
  attacker-controlled data to system() as uid 0.
