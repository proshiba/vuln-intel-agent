title: Headroom's LLM proxy lets a client choose the upstream destination with 
  the x-headroom-base-url request header. _resolve_openai_upstream_base in 
  headroom/proxy/handlers/openai.py accepts the header value, requires only that
  it parse with an http or https scheme and a hostname, and returns it for use 
  as the upstream base; _select_passthrough_base_url in 
  headroom/providers/proxy_routes.py reads the same header for the passthrough 
  routes. No check rejects loopback, link-local, or RFC 1918 destinations, and 
  because the component is a proxy the upstream response is returned to the 
  caller, so the request reaches internal services and cloud metadata addresses 
  and their responses are disclosed. The Authorization header accompanying the 
  request is forwarded unchanged to the caller-designated host. The pip console 
  script binds 127.0.0.1 by default, but the reference docker-compose.yml ships 
  --host 0.0.0.0 with published ports and no required HEADROOM_PROXY_TOKEN, 
  which the server itself warns ab
