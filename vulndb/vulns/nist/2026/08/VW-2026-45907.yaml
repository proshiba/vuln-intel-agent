title: CodeWhale versions before 0.8.64 contain an argument injection 
  vulnerability in the git_blame tool that allows attackers to read arbitrary 
  files by injecting git options into the unvalidated rev parameter. Attackers 
  can supply rev values like --contents=/path/to/file to exfiltrate sensitive 
  files such as SSH keys and credentials through the tool output returned to the
  model.
