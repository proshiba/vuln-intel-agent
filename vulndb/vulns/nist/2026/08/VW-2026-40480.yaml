title: Flowise through 3.1.4 contains a missing authorization vulnerability that
  allows authenticated workspace members to perform unauthorized document store 
  operations by accessing unprotected mutation endpoints. Attackers holding only
  view-level permissions can send direct HTTP requests to the upsert and refresh
  document store routes to trigger document ingestion, refresh vector database 
  contents, consume embedding API credits, and modify knowledge bases used by 
  downstream chatflows.
