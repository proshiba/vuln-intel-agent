title: "Kenwood DNR1007XR USB Incorrect Default Permissions Local Privilege Escalation
  Vulnerability. This vulnerability allows physically present attackers to escalate
  privileges on affected installations of Kenwood DNR1007XR devices. An attacker must
  first obtain the ability to execute low-privileged code on the target system in
  order to exploit this vulnerability.\n\nThe specific flaw exists within the configuration
  of the mount point for the USB filesystem. The issue results from incorrect permissions
  on a directory used by the product. An attacker can leverage this vulnerability
  to escalate privileges and execute arbitrary code in the context of root. Was ZDI-CAN-29070."
