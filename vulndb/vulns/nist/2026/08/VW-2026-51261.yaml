title: A vulnerability was detected in RooCodeInc Roo-Code up to 3.51.1. This 
  vulnerability affects unknown code of the file 
  src/integrations/claude-code/oauth.ts of the component OAuth Callback. The 
  manipulation results in cleartext transmission of sensitive information. The 
  attack may be performed from remote. A high complexity level is associated 
  with this attack. It is stated that the exploitability is difficult. The 
  exploit is now public and may be used. Multiple isses were reported to the 
  vendor beforehand. They explain, that "they all apply to Roo Code, a project 
  we no longer support - the repository was archived a while ago, and we don't 
  encourage anyone to use it." This vulnerability only affects products that are
  no longer supported by the maintainer.
