title: An unsafe dynamic class loading vulnerability exists in the database 
  connection utilities of PaperCut MF and PaperCut NG. The application 
  instantiates database driver classes based on configurable driver names 
  without validating against an allowlist of approved drivers. If an attacker 
  can manipulate system configuration parameters, this enables the execution of 
  arbitrary Java bytecode residing on the application classpath under the 
  security context of the PaperCut server process.
