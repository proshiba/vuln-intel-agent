title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  bound the look-ahead attribute-list entry in ntfs_external_attr_find()\n\nWhen resolving
  an attribute lookup with a non-zero @lowest_vcn,\nntfs_external_attr_find() peeks
  at the next $ATTRIBUTE_LIST entry to\ndecide whether to keep searching, but bounds
  that not-yet-validated\nentry only with \"(u8 *)next_al_entry + 6 < al_end\" (which
  proves just\nbytes 0..6 are in range) and \"(u8 *)next_al_entry + length <= al_end\"\
  \nwith an attacker-controlled, non-8-aligned length. It then reads\nnext_al_entry->lowest_vcn
  (an __le64 at offset 8) and the name at\nnext_al_entry->name_offset, both of which
  can lie past al_end -- the\nexact end of the kvmalloc'd attribute-list buffer (allocated
  at the\non-disk attr_list_size, no rounding). A crafted on-disk $ATTRIBUTE_LIST\n\
  whose last entry sits a few bytes before al_end therefore yields a slab\nout-of-bounds
  read when the inode is read.\n\nValidate the look-ahead entry with ntfs_attr_list_entry_"
