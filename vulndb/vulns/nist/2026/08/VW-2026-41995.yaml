title: An authentication bypass vulnerability in Portainer CE through 2.44.0 
  allows authenticated low-privileged users to bypass Docker proxy authorization
  checks via non-canonical URL normalization, defeating all authorization 
  middleware. The proxy endpoint fails to normalize request paths before 
  applying access controls, allowing crafted requests to be interpreted 
  differently by the proxy and the authorization layer. Successful exploitation 
  grants the attacker root-level access to the underlying Docker host.
