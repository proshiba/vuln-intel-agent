title: "Kenwood DNR1007XR JKGenService Command Injection Local Privilege Escalation
  Vulnerability. This vulnerability allows local attackers to escalate privileges
  on affected installations of Kenwood DNR1007XR devices. An attacker must first obtain
  the ability to execute low-privileged code on the target system in order to exploit
  this vulnerability.\n\nThe specific flaw exists within the JKGenService. The issue
  results from the lack of proper validation of a user-supplied string before using
  it to execute a system call. An attacker can leverage this vulnerability to escalate
  privileges and execute arbitrary code in the context of root. Was ZDI-CAN-29066."
