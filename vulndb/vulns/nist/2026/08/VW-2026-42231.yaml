title: Out-of-bounds write in the firmware for the Intel(R) Slim Bootloader may 
  allow a denial of service. System software adversary with a privileged user 
  combined with a low complexity attack may enable denial of service. This 
  result may potentially occur via local access when attack requirements are 
  present without special internal knowledge and requires no user interaction. 
