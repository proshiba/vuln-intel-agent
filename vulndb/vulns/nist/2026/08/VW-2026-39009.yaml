title: "eParakstītājs 3.0 for Windows before version\n1.10.0 retrieves and executes
  its automatic updates over a channel that is not\nauthenticated or integrity-protected.
  On each launch the application fetches an\nupdate descriptor (XML) over TLS but
  accepts any TLS certificate (a permissive\nTrustManager and a HostnameVerifier that
  always returns true), does not verify\nany digital signature on the update descriptor,
  and does not verify the\nAuthenticode signature or a checksum of the downloaded
  installer before running\nit. A man-in-the-middle attacker able to redirect www.eparaksts.lv
  can serve a\ncrafted update descriptor pointing to an attacker-controlled executable,
  which\nthe client downloads and executes, resulting in arbitrary code execution
  on the\nvictim host."
