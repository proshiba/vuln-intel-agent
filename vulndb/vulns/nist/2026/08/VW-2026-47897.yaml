title: Link Preview JS extracts web links information. Prior to 4.0.4, the 
  resolveDNSHost mitigation in index.ts validates one resolved IP address but 
  fetches the original hostname, allowing an attacker-controlled DNS server to 
  return a public address during validation and a loopback or internal address 
  during the final connection. This DNS rebinding condition bypasses the SSRF 
  protection and can cause the server-side preview fetch to reach internal HTTP 
  resources. Redirect handling is affected by the same validation-to-fetch 
  mismatch. This issue is fixed in version 4.0.4.
