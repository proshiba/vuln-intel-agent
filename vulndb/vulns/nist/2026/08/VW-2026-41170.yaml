title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  restore DACL size on check_add_overflow() to avoid malformed ACL\n\ncheck_add_overflow()
  unconditionally writes the truncated sum into *d\neven on overflow, per its contract
  in include/linux/overflow.h.\nThe four check_add_overflow() guards in set_posix_acl_entries_dacl()\n\
  and set_ntacl_dacl() break out of the ACE-building loops on overflow,\nbut the truncated
  *size is then consumed downstream at the end of\nset_ntacl_dacl():\n\n    pndacl->size
  = cpu_to_le16(le16_to_cpu(pndacl->size) + size);\n\nThis produces an on-wire NT
  ACL whose pndacl->size under-reports the\nbytes actually written by the preceding
  fill_ace_for_sid()/memcpy()\ncalls, yielding a malformed ACL that can trigger out-of-bounds
  reads\nwhen re-parsed by clients or ksmbd itself.\n\nRestore *size to its pre-addition
  value on each overflow branch (via\n`*size -= ace_sz` / `size -= nt_ace_size`) so
  that after the break,\n*size once again holds the cumulative size of "
