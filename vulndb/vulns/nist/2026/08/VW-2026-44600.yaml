title: "In the Linux kernel, the following vulnerability has been resolved:\n\nalloc_tag:
  fix use-after-free in /proc/allocinfo after module unload\n\nallocinfo_start() only
  reinitializes the codetag iterator at position 0. \nFor subsequent reads (position
  > 0), it reuses cached iterator state from\nthe previous batch.  allocinfo_stop()
  drops mod_lock between read batches,\nwhich allows module unload to complete and
  free the module memory that the\ncached iterator still references:\n\n  CPU0 (read)\
  \                        CPU1 (rmmod)\n  ----                               ----\n\
  \  allocinfo_start(pos=0)\n    down_read(mod_lock)\n    allocinfo_show()\n    ...\n\
  \  allocinfo_stop()\n    up_read(mod_lock)\n                                   \
  \  codetag_unload_module()\n                                       kfree(cmod)\n\
  \                                       release_module_tags()\n                \
  \                     ...\n                                     free_mod_mem()\n\
  \  allocinfo_start(pos=N)\n    down_read(mod_lock)\n  "
