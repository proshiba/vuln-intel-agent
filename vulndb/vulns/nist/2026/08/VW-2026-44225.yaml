title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ena: clean up XDP TX queues when regular TX setup fails\n\ncreate_queues_with_size_backoff()
  creates XDP TX queues before setting\nup the regular TX path. If the subsequent
  allocation or creation of\nregular TX queues fails, the error handling paths omit
  the teardown of the\nXDP TX queues, leading to a resource leak.\n\nFix this by explicitly
  destroying the XDP TX queue subset at the two\nmissing failure points.\n\nThe bug
  was first flagged by an experimental analysis tool we are\ndeveloping for kernel
  memory-management bugs while analyzing\nv6.13-rc1. The tool is still under development
  and is not yet publicly\navailable. Manual inspection confirms that the bug is still\n\
  present in v7.1-rc7.\n\nAn x86_64 allyesconfig build showed no new warnings. As
  we do not have\nan ENA device to test with, no runtime testing was able to be performed."
