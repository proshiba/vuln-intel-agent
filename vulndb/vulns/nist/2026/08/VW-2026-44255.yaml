title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  xen: scsiback: Free the command tag on the TMR submit-failure path\n\nscsiback_device_action()
  obtains a command tag in\nscsiback_get_pend_req() and submits a task-management
  request with\ntarget_submit_tmr(). When target_submit_tmr() fails it returns < 0
  and\nscsiback jumps to the err: label, which sends a response but frees\nnothing,
  leaking the tag.\n\nImpact: a pvSCSI guest can leak the command tags of a LUN's
  session,\nstopping the LUN, by issuing VSCSIIF_ACT_SCSI_ABORT or RESET requests\n\
  whenever target_submit_tmr() fails.\n\ntransport_generic_free_cmd() cannot be used
  here. By the time\ntarget_submit_tmr() returns an error it has already run\n__target_init_cmd()
  (so se_cmd->cmd_kref is one, not zero), and on its\ntarget_get_sess_cmd() error
  path it has freed se_cmd->se_tmr_req via\ncore_tmr_release_req() while leaving SCF_SCSI_TMR_CDB
  set and the\npointer dangling. Letting the command release run target_free_cmd_mem()\n\
  wou"
