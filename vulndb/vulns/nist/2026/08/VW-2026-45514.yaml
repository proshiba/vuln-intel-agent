title: JumpServer is an open source bastion host and an operation and 
  maintenance security audit system. From 4.8.0 until 4.10.17, an authenticated 
  user with SFTP permission to an authorized asset can submit crafted traversal 
  paths through the KoKo Web Terminal SFTP feature, causing 
  AssetDir.GetRealPath() in pkg/srvconn/sftp_asset.go to resolve paths outside 
  the intended SFTP root and permit read, list, write, rename, or delete 
  operations under the configured backend account on that asset. This issue is 
  fixed in version 4.10.17.
