title: In OpenStack Aodh before 22.0.1, the alarm list API bypasses project 
  scoping when the all_projects query parameter is set to false. The API checks 
  for the presence of the all_projects key rather than its value; a true value 
  enforces the administrator-only policy, but a false value removes the key and 
  skips the branch that normally restricts results to the caller's project. A 
  non-admin user with the reader role can list alarms from all projects, 
  exposing alarm actions containing trust webhook URLs, Heat signal endpoints, 
  project IDs, and user IDs. The parameter can also be combined with a foreign 
  project_id to target a specific project's alarms. A related concern is that 
  OpenStack Watcher does not apply authorization to its webhook trigger 
