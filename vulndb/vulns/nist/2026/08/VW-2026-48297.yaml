title: '@fastify/busboy is a multipart form-data parser for Node.js. Its multipart
  part-header parser splits header lines only on the two-byte carriage-return line-feed
  sequence, so a lone carriage return or line feed embedded in a part header is not
  treated as a line break and is carried verbatim into the parsed Content-Disposition
  filename and field name handed to the application. An attacker who uploads a file
  whose filename or field name contains a bare carriage return or line feed can inject
  control characters into consumers that trust the parser to return clean values,
  enabling filesystem filename pollution, log forging, or header injection when the
  value is forwarded to a carriage-return-sensitive sink. All versions of @fastify/busboy
  up to and including 3.2.1 are affected. The issue is fixed in version 3.2.2, which
  rejects any header line that still contains a bare carriage return or line feed.
  Users should upgrade to 3.2.2, and consumers such as @fastify/multipart should bump
  their @f'
