title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Fix skb refcnt race after locking changes\n\nThere is a race where skb's
  from the sk_psock_backlog can be referenced\nafter userspace side has already skb_consumed()
  the sk_buff and its refcnt\ndropped to zer0 causing use after free.\n\nThe flow
  is the following:\n\n  while ((skb = skb_peek(&psock->ingress_skb))\n    sk_psock_handle_Skb(psock,
  skb, ..., ingress)\n    if (!ingress) ...\n    sk_psock_skb_ingress\n       sk_psock_skb_ingress_enqueue(skb)\n\
  \          msg->skb = skb\n          sk_psock_queue_msg(psock, msg)\n    skb_dequeue(&psock->ingress_skb)\n\
  \nThe sk_psock_queue_msg() puts the msg on the ingress_msg queue. This is\nwhat
  the application reads when recvmsg() is called. An application can\nread this anytime
  after the msg is placed on the queue. The recvmsg hook\nwill also read msg->skb
  and then after user space reads the msg will call\nconsume_skb(skb) on it effectively
