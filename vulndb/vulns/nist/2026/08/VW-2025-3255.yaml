title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_api: remove block_cb from driver_list before freeing\n\nError handler of tcf_block_bind()
  frees the whole bo->cb_list on error.\nHowever, by that time the flow_block_cb instances
  are already in the driver\nlist because driver ndo_setup_tc() callback is called
  before that up the\ncall chain in tcf_block_offload_cmd(). This leaves dangling
  pointers to\nfreed objects in the list and causes use-after-free[0]. Fix it by also\n\
  removing flow_block_cb instances from driver_list before deallocating them.\n\n\
  [0]:\n[  279.868433] ==================================================================\n\
  [  279.869964] BUG: KASAN: slab-use-after-free in flow_block_cb_setup_simple+0x631/0x7c0\n\
  [  279.871527] Read of size 8 at addr ffff888147e2bf20 by task tc/2963\n\n[  279.873151]
  CPU: 6 PID: 2963 Comm: tc Not tainted 6.3.0-rc6+ #4\n[  279.874273] Hardware name:
  QEMU Standard PC (Q35 + ICH9, 2009), BIOS rel-1.13.0-0-gf21b5a4aeb02-prebuil"
