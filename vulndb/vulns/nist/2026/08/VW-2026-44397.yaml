title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  frag: fix primary_if leak on failed linearization\n\nIf the skb has a frag_list,
  it must be linearized before it can be split\nusing skb_split(). But when this step
  failed, it must not only free the skb\nbut also take care of the reference to the
  already found primary_if."
