title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  FCP: fix OOB write in fcp_meter_ctl_get()\n\nfcp_ioctl_set_meter_map() bounds the
  user-supplied Level Meter map size\nby the driver's own limit of 255\n\n\tif (map.map_size
  < 1 || map.map_size > 255 ||\n\t    map.meter_slots < 1 || map.meter_slots > 255)\n\
  \t\treturn -EINVAL;\n\nand passes it to fcp_add_new_ctl() as the control's channel
  count, where\nit is stored as elem->channels.\n\nEvery control read writes into
  struct snd_ctl_elem_value, whose integer\narray is declared long value[128], so
  the limit is 128, not 255.\nfcp_meter_ctl_get() stores one 64-bit word per channel
  into that array\nwith no bound of its own:\n\n\tfor (i = 0; i < elem->channels;
  i++) {\n\t\tint idx = private->meter_level_map[i];\n\t\tint value = idx < 0 ? 0
  : le32_to_cpu(resp[idx]);\n\n\t\tucontrol->value.integer.value[i] = value;\n\t}\n\
  \nsnd_ctl_elem_read_user() serves that object from\nmemdup_user(_control, sizeof(*control)),
  1224 bytes on LP64 out of\nkmalloc-2048.  offse"
