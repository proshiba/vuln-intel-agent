title: llama.cpp builds b1886 through b7445 contain a null pointer dereference 
  vulnerability in the LLaMA-Android JNI wrapper where the bench_1model() 
  function fails to validate the model context pointer before dereferencing it. 
  Attackers can supply a malicious, corrupt, or truncated model file to trigger 
  a null context condition, causing a SIGSEGV crash that terminates the Android 
  application process and results in denial of service.
