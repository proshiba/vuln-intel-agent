title: Onyx is an open-source AI platform. Prior to 4.3.0, Onyx Enterprise 
  Edition's PATCH /manage/admin/user-group/{user_group_id} and POST 
  /manage/admin/user-group/{user_group_id}/add-users endpoints in 
  ee/onyx/server/user_group/api.py call update_user_group and 
  add_users_to_user_group in ee/onyx/db/user_group.py without enforcing 
  _validate_curator_can_modify_group, allowing a curator to add accounts to 
  arbitrary groups and obtain document access through get_acl_for_user and the 
  OpenSearch access_control_list filter. This issue is fixed in version 4.3.0.
