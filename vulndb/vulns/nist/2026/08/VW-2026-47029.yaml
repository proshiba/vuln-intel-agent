title: "The W3 Total Cache WordPress plugin before 2.10.5 does not properly validate
  the request path it uses to build cache file names, allowing unauthenticated attackers
  to write a file into any existing directory on the server, inside or outside the
  web root, overwriting whatever occupies the target name.\nOn Apache, the same flaw
  overwrites the site's .htaccess files, which breaks the site and can strip hardening
  rules that other security measures rely on."
