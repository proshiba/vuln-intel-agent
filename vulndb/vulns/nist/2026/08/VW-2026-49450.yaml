title: 'Nokogiri before 1.18.4 bundles a vulnerable version of libxslt (prior to 1.1.43)
  that contains two use-after-free vulnerabilities: CVE-2025-24855 (use-after-free
  of the XPath context node due to xsltEvalXPathStringNs leaking xpathCtxt->node)
  and CVE-2024-55549 (use-after-free related to excluded result prefixes/namespaces).
  Processing crafted XSLT can trigger memory corruption. Nokogiri 1.18.4 upgrades
  the bundled libxslt to 1.1.43 to resolve these issues.'
