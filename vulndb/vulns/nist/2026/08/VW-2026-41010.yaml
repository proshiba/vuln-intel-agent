title: A heap out-of-bounds write vulnerability was found in the GStreamer 
  gst-plugins-bad adpcmdec element when decoding IMA/DVI ADPCM audio. 
  Insufficient validation of the per-block sample count for multi-channel 
  streams allows a crafted WAV file to cause writes beyond the allocated output 
  buffer. This can lead to application crash, denial of service, memory 
  corruption, or potentially arbitrary code execution when untrusted media is 
  processed.
