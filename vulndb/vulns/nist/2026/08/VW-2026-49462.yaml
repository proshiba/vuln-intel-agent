title: Winter CMS versions before 1.2.13 contain an incomplete fix for a Twig 
  sandbox escape vulnerability in System\\Twig\\SecurityPolicy that allows 
  authenticated backend users with template-editing permissions to bypass 
  sandbox restrictions. Attackers can exploit method forwarding through Eloquent
  models and query builders using methods like saveQuietly(), deleteQuietly(), 
  increment(), decrement(), and newQuery() to read and modify arbitrary database
  records, execute arbitrary SQL, and achieve remote code execution by injecting
  PHP into template code sections.
