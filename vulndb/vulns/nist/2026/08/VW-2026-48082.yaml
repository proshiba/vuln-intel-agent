title: A security flaw has been discovered in lin-snow Ech0 up to 5.4.1. 
  Affected by this issue is the function MD5Encrypt of the file 
  internal/util/crypto/crypto.go. Performing a manipulation results in risky 
  cryptographic algorithm. Remote exploitation of the attack is possible. The 
  complexity of an attack is rather high. The exploitation is known to be 
  difficult. Upgrading to version 5.4.2 can resolve this issue. The patch is 
  named 9ce19a3b0d0765086a655f45d3a706ec1810404f. It is recommended to upgrade 
  the affected component.
