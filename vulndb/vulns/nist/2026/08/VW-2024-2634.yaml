title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mremap:
  fix address wraparound in move_page_tables()\n\nOn 32-bit platforms, it is possible
  for the expression `len + old_addr <\nold_end` to be false-positive if `len + old_addr`
  wraps around. \n`old_addr` is the cursor in the old range up to which page table
  entries\nhave been moved; so if the operation succeeded, `old_addr` is the *end*
  of\nthe old region, and adding `len` to it can wrap.\n\nThe overflow causes mremap()
  to mistakenly believe that PTEs have been\ncopied; the consequence is that mremap()
  bails out, but doesn't move the\nPTEs back before the new VMA is unmapped, causing
  anonymous pages in the\nregion to be lost.  So basically if userspace tries to mremap()
  a\nprivate-anon region and hits this bug, mremap() will return an error and\nthe
  private-anon region's contents appear to have been zeroed.\n\nThe idea of this check
  is that `old_end - len` is the original start\naddress, and writing the check that
  way also make"
