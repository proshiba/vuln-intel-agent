title: A weakness in the MongoDB C++ Driver's handling of caller-supplied 
  namespace identifiers allows special characters embedded in those identifiers.
  An application that builds a namespace identifier from untrusted input without
  validating it may therefore have its operation directed at a different target 
  than intended. This can result in limited unauthorized read and write access 
  to data belonging to another logical tenant of the affected application.
