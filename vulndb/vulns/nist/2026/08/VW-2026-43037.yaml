title: RustFS is a distributed object storage system built in Rust. Prior to 
  1.0.0-rc.1, RustFS Object Lock enforcement in 
  crates/ecstore/src/bucket/object_lock/objectlock_sys.rs lets 
  check_object_lock_for_deletion, delete_prefix, and lifecycle and scanner 
  sweeps treat ConfigNotFound, unreadable .metadata.bin data, or unparseable 
  metadata as no lock configuration, allowing objects under COMPLIANCE retention
  to be deleted or expired. This issue is fixed in version 1.0.0-rc.1.
