title: 'Vulnerability in the Oracle Product Lifecycle Analytics product of Oracle
  Supply Chain (component: Installation Issues).   The supported version that is affected
  is 3.6.1. Easily exploitable vulnerability allows high privileged attacker with
  network access via Oracle Net to compromise Oracle Product Lifecycle Analytics.  While
  the vulnerability is in Oracle Product Lifecycle Analytics, attacks may significantly
  impact additional products (scope change).  Successful attacks of this vulnerability
  can result in  unauthorized creation, deletion or modification access to critical
  data or all Oracle Product Lifecycle Analytics accessible data as well as  unauthorized
  access to critical data or complete access to all Oracle Product Lifecycle Analytics
  accessible data. CVSS 3.1 Base Score 8.7 (Confidentiality and Integrity impacts).  CVSS
  Vector: (CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N).'
