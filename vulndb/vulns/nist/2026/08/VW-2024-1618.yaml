title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBoth
  cadence-quadspi ->runtime_suspend() and ->runtime_resume()\nimplementations start
  with:\n\n\tstruct cqspi_st *cqspi = dev_get_drvdata(dev);\n\tstruct spi_controller
  *host = dev_get_drvdata(dev);\n\nThis obviously cannot be correct, unless \"struct
  cqspi_st\" is the\nfirst member of \" struct spi_controller\", or the other way
  around, but\nit is not the case. \"struct spi_controller\" is allocated by\ndevm_spi_alloc_host(),
  which allocates an extra amount of memory for\nprivate data, used to store \"struct
  cqspi_st\".\n\nThe ->probe() function of the cadence-quadspi driver then sets the\n\
  device drvdata to store the address of the \"struct cqspi_st\"\nstructure. Therefore:\n\
  \n\tstruct cqspi_st *cqspi = dev_get_drvdata(dev);\n\nis correct, but:\n\n\tstruct
  spi_controller *host = dev_get_drvdata(dev);\n\nis not, as it makes \"host\" point
  not to a \"struct spi_controller\" but\nto the same \"struct cqspi_st\" structure
