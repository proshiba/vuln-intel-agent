title: Grav API Plugin is a RESTful API for Grav CMS that provides full headless
  access to your site's content. Prior to 1.0.6, the Grav API plugin 
  ApiKeyManager::generateKey() stores a declared scopes array, but 
  ApiKeyAuthenticator::authenticate() does not read keyData[scopes] and returns 
  the owning user's complete identity. 
  AbstractApiController::requirePermission() consequently evaluates the full 
  user ACL, so a key issued for a read-only scope can perform every write, 
  delete, and administrative operation available to the owner. This issue is 
  fixed in version 1.0.6.
