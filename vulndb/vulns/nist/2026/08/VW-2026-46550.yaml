title: 'Vulnerability in the MySQL Cluster product of Oracle MySQL (component: Cluster:
  NDB Operator).  Supported versions that are affected are 8.0.0-8.0.47, 8.4.0-8.4.10
  and  9.7.0-9.7.1. Easily exploitable vulnerability allows unauthenticated attacker
  with network access via multiple protocols to compromise MySQL Cluster.  Successful
  attacks of this vulnerability can result in unauthorized ability to cause a hang
  or frequently repeatable crash (complete DOS) of MySQL Cluster as well as  unauthorized
  update, insert or delete access to some of MySQL Cluster accessible data. CVSS 3.1
  Base Score 8.2 (Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H).'
