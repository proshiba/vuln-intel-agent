title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ipset: add missing range check in bitmap_ip_uadt\n\nWhen tb[IPSET_ATTR_IP_TO] is
  not present but tb[IPSET_ATTR_CIDR] exists,\nthe values of ip and ip_to are slightly
  swapped. Therefore, the range check\nfor ip should be done later, but this part
  is missing and it seems that the\nvulnerability occurs.\n\nSo we should add missing
  range checks and remove unnecessary range checks."
