title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  clear control chunk transport if it is being removed\n\nsctp_make_heartbeat_ack()
  caches the destination transport in\nchunk->transport without taking a reference.
  When src_out_of_asoc_ok is\nenabled, the HEARTBEAT ACK may remain queued on control_chunk_list
  instead\nof being transmitted immediately.\n\nIf the peer transport is removed while
  the chunk is still queued,\nsctp_assoc_rm_peer() drops the transport and schedules
  it for RCU freeing,\nbut only clears cached transport pointers in out_chunk_list.\
  \  The queued\ncontrol chunk therefore retains a dangling transport pointer.\n\n\
  Once an ASCONF_ACK clears the suppression and the queued control chunk is\ntransmitted,
  SCTP dereferences the stale transport pointer, leading to a\nuse-after-free.\n\n\
  Fix this by also clearing chunk->transport for queued control chunks in\ncontrol_chunk_list
  when removing the transport."
