title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  fix cifsFileInfo leak on kmalloc failure in deferred close drain paths\n\nIn cifs_close_deferred_file(),
  cifs_close_all_deferred_files(), and\ncifs_close_deferred_file_under_dentry(), when
  a pending deferred close\nis cancelled via cancel_delayed_work(), the subsequent
  kmalloc_obj() to\nadd the file to the local processing list may fail under memory
  pressure.\nThe loop breaks immediately, but the cancelled work is no longer pending\n\
  (it would have called _cifsFileInfo_put()), and the cfile is never added\nto file_head
  for processing.  The cifsFileInfo reference and the open\nserver handle both leak.\n\
  \nFix by saving the cfile that failed allocation in a local variable,\nbreaking
  as before, and calling _cifsFileInfo_put() on it after\nreleasing the lock.  Any
  files later in the iteration are unaffected\nsince their deferred work is still
  pending and will fire normally."
