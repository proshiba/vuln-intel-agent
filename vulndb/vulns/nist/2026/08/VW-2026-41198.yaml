title: "In the Linux kernel, the following vulnerability has been resolved:\n\nila:
  reload IPv6 header after pskb_may_pull in checksum adjust\n\nila_csum_adjust_transport()
  caches ip6h = ipv6_hdr(skb) before calling\npskb_may_pull(). On a non-linear skb
  whose transport header sits in a page\nfragment, pskb_may_pull() can call __pskb_pull_tail()
  / pskb_expand_head()\nand free the old skb head, leaving ip6h dangling; the following\n\
  get_csum_diff(ip6h, p) then reads freed memory. ila_update_ipv6_locator()\nuses
  ip6h (and the iaddr derived from it) again after the csum-adjust\ncall and additionally
  writes the new locator through that pointer.\n\nImpact: a remote IPv6 packet routed
  through a configured ILA\ncsum-adjust-transport route or receive-side mapping triggers
  a\nslab-use-after-free in ila_update_ipv6_locator() (KASAN). The route or\nmapping
  requires CAP_NET_ADMIN to configure, but trigger packets are\nunauthenticated once
  it exists.\n\nReload ip6h after each pskb_may_pull() in ila_csum_adjust_transport()\n\
  bef"
