title: Snipe-IT is an IT asset/license management system. Prior to 8.6.3, a 
  company-scoped user in FMCS floater mode can access users whose company_id is 
  null because broad API queries and bulk web actions do not consistently apply 
  isCurrentUserHasAccess. The /api/v1/users and /api/v1/users/{id}/licenses 
  endpoints can expose personal data and assigned licenses, /users/bulkeditsave 
  can modify out-of-scope profiles, and /users/merge can soft-delete users and 
  transfer assigned assets. This issue is fixed in version 8.6.3.
