title: SAP Approuter does not sufficiently validate certain token content under 
  specific configurations. An unauthenticated attacker could send a specially 
  crafted token to cause sensitive credential material to be sent to an 
  attacker-controlled destination. The attack complexity is high due to 
  non-default preconditions required in the target environment. This results in 
  a high impact on confidentiality and a low impact on integrity and 
  availability.
