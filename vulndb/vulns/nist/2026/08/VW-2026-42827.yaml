title: Malcolm is a network traffic analysis tool suite. Prior to version 
  26.07.0, `safe-extract.py` protects file extraction with libarchive's secure 
  flags, but creates directory entries with a raw 
  `os.makedirs(os.path.join(dest, entry.pathname))` that has no traversal 
  protection. An uploaded malicious archive containing a directory entry with a 
  `../` sequence or an absolute path causes the filebeat processing container to
  create directories outside the intended extraction directory. Version 26.07.0 
  fixes the issue.
