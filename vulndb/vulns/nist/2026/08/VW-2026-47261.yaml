title: Grav Shortcode Core Plugin allows for the development shortcode plugins 
  that utilize the common format utilized by WordPress and BBCode. Prior to 
  6.2.2, Grav Shortcode Core passes shortcode syntax through 
  Security::detectXss() because it contains no literal less-than character, then
  ColorShortcode.php and related attribute handlers concatenate an 
  attacker-controlled parameter into HTML without encoding. An account with 
  admin.pages permission can close the generated attribute and add an event 
  handler, creating stored cross-site scripting that executes for visitors or 
  administrators who view the page. This issue is fixed in version 6.2.2.
