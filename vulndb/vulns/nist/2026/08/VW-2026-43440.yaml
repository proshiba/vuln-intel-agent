title: Integer wraparound in PostgreSQL fuzzystrmatch allows a user to direct 
  writes to a huge range of addresses, executing arbitrary code as the operating
  system user running the database, via extreme inputs to SQL function 
  levenshtein() or levenshtein_less_equal().  Versions before PostgreSQL 18.6, 
  17.11, 16.15, 15.19, and 14.24 are affected.
