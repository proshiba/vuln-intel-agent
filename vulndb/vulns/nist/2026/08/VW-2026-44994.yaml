title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnexthop:
  avoid unlocked f6i_list walk in nh_rt_cache_flush\n\nnh_rt_cache_flush() walks nh->f6i_list
  during an RTNL-serialized nexthop\nreplace without holding nh->lock, racing the
  unlocked IPv6 route\nadd/delete that mutate the list under nh->lock and free fib6_info\n\
  entries (nh_rt_cache_flush() is inlined into rtm_new_nexthop()):\n\n  BUG: KASAN:
  slab-use-after-free in nh_rt_cache_flush (net/ipv4/nexthop.c:2243)\n  Read of size
  8 at addr ffff888012953e18 by task exploit/146\n   nh_rt_cache_flush (net/ipv4/nexthop.c:2243)\n\
  \   replace_nexthop (net/ipv4/nexthop.c:2610)\n   rtm_new_nexthop (net/ipv4/nexthop.c:3323)\n\
  \   rtnetlink_rcv_msg (net/core/rtnetlink.c:7076)\n\nUnlike the other f6i_list walks,
  this one bumps each route's sernum via\nfib6_update_sernum_upto_root(), which needs
  tb6_lock; taking nh->lock\naround it would invert the established tb6_lock -> nh->lock
  order and\ndeadlock. As the only purpose is to invalidate cached dsts,"
