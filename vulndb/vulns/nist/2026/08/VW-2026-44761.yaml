title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Clear rb node linkage when freeing bpf_rb_root\n\nbpf_rb_root_free() detaches the
  root by copying the current rb_root_cached\nand then replacing the live root with
  RB_ROOT_CACHED. It then walks the\ncopied root and drops each object contained in
  the tree.\n\nThis leaves the rb node state intact while dropping the object. If
  the\nobject is refcounted and survives the drop, its bpf_rb_node_kern still\ncontains
  an owner pointer to the freed root and stale rb tree linkage. If\na later bpf_rb_root
  allocation reuses the same address, bpf_rbtree_remove()\ncan incorrectly pass the
  owner check and call rb_erase_cached() on a node\nwhose rb pointers belong to the
  old tree.\n\nMirror the list draining behavior by marking nodes as busy while the
  root\nis being detached, then clear the rb node and release the owner before\ndropping
  the containing object. This makes surviving nodes unowned and\nsafe to reject from
  remove or accept for a later"
