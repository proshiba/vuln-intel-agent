title: "In the Linux kernel, the following vulnerability has been resolved:\n\nax25:
  Fix refcount imbalance on inbound connections\n\nWhen releasing a socket in ax25_release(),
  we call netdev_put() to\ndecrease the refcount on the associated ax.25 device. However,
  the\nexecution path for accepting an incoming connection never calls\nnetdev_hold().
  This imbalance leads to refcount errors, and ultimately\nto kernel crashes.\n\n\
  A typical call trace for the above situation will start with one of the\nfollowing
  errors:\n\n    refcount_t: decrement hit 0; leaking memory.\n    refcount_t: underflow;
  use-after-free.\n\nAnd will then have a trace like:\n\n    Call Trace:\n    <TASK>\n\
  \    ? show_regs+0x64/0x70\n    ? __warn+0x83/0x120\n    ? refcount_warn_saturate+0xb2/0x100\n\
  \    ? report_bug+0x158/0x190\n    ? prb_read_valid+0x20/0x30\n    ? handle_bug+0x3e/0x70\n\
  \    ? exc_invalid_op+0x1c/0x70\n    ? asm_exc_invalid_op+0x1f/0x30\n    ? refcount_warn_saturate+0xb2/0x100\n\
  \    ? refcount_warn_saturate+0xb2/0x100\n    ax25_release+0x2a"
