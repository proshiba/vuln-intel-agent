title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - block s_input when F54 queue is busy\n\nChanging the input (diagnostic
  report type) mid-stream changes the\nreport size. Since V4L2 buffers are allocated
  based on the size at\nstream start, changing the input while streaming could lead
  to a\nheap buffer overflow if the new size is larger than the allocated\nbuffers.\n\
  \nPrevent this by blocking VIDIOC_S_INPUT with -EBUSY if the V4L2 queue\nis busy
  (streaming)."
