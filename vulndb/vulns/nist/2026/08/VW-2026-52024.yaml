title: A vulnerability was determined in LatencyUtils up to 2.0.3. Affected by 
  this issue is the function LatencyStats.recordDetectedPause of the file 
  src/main/java/org/LatencyUtils/LatencyStats.java of the component 
  PauseDetector. Executing a manipulation can lead to memory corruption. The 
  attack needs to be launched locally. The exploit has been publicly disclosed 
  and may be utilized. The project was informed of the problem early through an 
  issue report but has not responded yet.
