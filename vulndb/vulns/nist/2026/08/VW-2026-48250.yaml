title: "Software installed and run as a non-privileged user may conduct improper GPU
  system calls to pass invalid log2 page size when allocating physical pages leading
  to OOB read and/or write due to improper validation of the said value.\n\n\n\nSuch
  crafted log2 page size could lead to 4K pages being treated as higher order pages
  and allowing read and/or write access to the memory beyond 4K threshold."
