title: "Apache::AppSamurai::Util versions through 1.01 for Perl generate predictable
  session authentication keys from the clock and process id in CreateSessionAuthKey.\n\
  \nCreateSessionAuthKey runs five rounds of SHA-256, each over a fresh Time::HiRes
  reading formatted to six decimal places, the running digest, and the process id.
  CreateSession calls it with an empty key source on every login, and the optional
  Keysource directive is the only route to the other branch. The result is 64 hex
  characters. The microsecond field of the first reading takes one of a million values,
  the later readings follow it within microseconds, and the process id is drawn from
  a small range.\n\nThe key is returned to the browser as the session cookie, and
  is combined with the configured server key to compute the session id and to encrypt
  the stored session data. An attacker who knows the second in which a session was
  created and the process id of the worker that created it can enumerate candidate
  keys and recover the vic"
