title: "In versions of the Datadog Android application prior to v545-5.9.2, OnCallNotificationActivity
  is declared exported with no permission guard. A co-installed application can launch
  it with attacker-controlled Intent extras, including a full-screen lock-screen message,
  an arbitrary on-call page ID, and an arbitrary Intent to run inside the Datadog
  process.\r\nThis requires:\r\nA malicious application co-installed on the victim's
  device.\r\nAn active Datadog session in the Android app.\r\nImpact: After a single
  tap on the Acknowledge button, the app sends a forged on-call acknowledgement to
  the backend under the victim's session, launches the attacker-supplied Intent from
  within the Datadog process (reaching otherwise non-exported components), and turns
  on the screen while dismissing the keyguard."
