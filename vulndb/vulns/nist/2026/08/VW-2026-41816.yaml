title: SAP Approuter does not sufficiently validate certain incoming requests 
  before forwarding them to backend destinations. Due to the complexity of the 
  required conditions, an attacker with low privileges could send specially 
  crafted requests to bypass authorization checks and reach protected resources 
  beyond their assigned scope. Successful exploitation could allow the attacker 
  to read sensitive data and perform limited modifications on protected 
  resources, resulting in a high impact on confidentiality and a low impact on 
  integrity. There is no impact on availability.
