title: "This vulnerability exists in the CP Plus CP-XR-DE21-S Router due to the presence
  of hardcoded HTTP Digest authentication credentials in the firmware that are identical
  across all devices running the affected firmware. An attacker with access to the
  local network could exploit this vulnerability by obtaining the hardcoded authentication
  information from the firmware.\n\n \n\nSuccessful exploitation of this vulnerability
  could allow the attacker to gain unauthorized administrative access and perform
  privileged operations on the targeted device."
