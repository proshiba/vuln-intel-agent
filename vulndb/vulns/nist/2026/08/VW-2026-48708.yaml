title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  evdev - sanitize event type index when fetching event masks\n\nThe user-supplied
  event type index passed to EVIOCGMASK / EVIOCSMASK\nioctls is used to index the
  static counts array in evdev_get_mask_cnt()\nand client evmasks array in evdev_get_mask().\n\
  \nWhile the event type is architecturally bounded by EV_CNT, speculative\nexecution
  may mispredict bounds checks and perform out-of-bounds loads.\n\nSanitize the event
  type index in evdev_get_mask_cnt() branchlessly using\narray_index_mask_nospec().
  This clamps the index to 0 for safe array\naccess and forces the returned count
  to 0 speculatively when the index\nis out of bounds.\n\nWe do not need additional
  array_index_nospec() calls in evdev_get_mask()\nbecause evdev_get_mask_cnt() speculatively
  forces the count (and\nresulting xfer_size) to 0 for out-of-bounds types, preventing
  any\nspeculative memory access to client evmasks array."
