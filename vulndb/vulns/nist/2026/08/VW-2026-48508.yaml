title: LeafWiki is a self-hosted wiki. Prior to version 0.10.2, page titles 
  returned by the search API could be rendered as raw HTML in the frontend. A 
  user with editor or administrator permissions could create or modify a page 
  title containing an HTML/JavaScript payload. When another user searched for a 
  matching term, the payload could execute in the victim’s browser. The impact 
  depends on deployment configuration. With `--public-access` enabled, 
  unauthenticated visitors could be affected. In authenticated-only deployments,
  the issue could be used for cross-user XSS against logged-in users who can 
  access search results. The issue has been fixed in version 0.10.2 by ensuring 
  that author-controlled page titles in search results are not interpreted as 
  raw HTML by the browser while preserving search result highlighting.
