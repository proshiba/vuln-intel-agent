title: Budibase before 3.40.0 contains server-side request forgery 
  vulnerabilities in OpenAPI query import and REST query execution that allow 
  authenticated builder-level users to bypass DNS pinning protections through 
  DNS rebinding attacks. Attackers can configure hostnames that resolve to 
  public addresses during validation but resolve to loopback or private 
  addresses during actual connection, allowing access to blocked internal HTTP 
  services.
