title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/9p:
  fix race condition on rdma->state in trans_rdma.c\n\nThe rdma->state field is modified
  without holding req_lock in both\nrecv_done() and p9_cm_event_handler(), while rdma_request()
  accesses\nthe same field under the req_lock spinlock. This inconsistent locking\n\
  creates a race condition:\n\n- recv_done() running in softirq completion context
  sets\n  rdma->state = P9_RDMA_FLUSHING without acquiring req_lock\n\n- p9_cm_event_handler()
  modifies rdma->state at multiple points\n  (ADDR_RESOLVED, ROUTE_RESOLVED, ESTABLISHED,
  CLOSED) without\n  req_lock\n\n- rdma_request() uses spin_lock_irqsave(&rdma->req_lock,
  flags) to\n  protect the read-modify-write of rdma->state\n\nThe race can cause
  lost state transitions: recv_done() or the CM\nevent handler could set state to
  FLUSHING/CLOSED while rdma_request()\nis concurrently checking or modifying state
  under the lock, leading to\nthe FLUSHING transition being silently overwritten by
  CLOSING"
