title: "Velociraptor's VQL has a query() plugin which allows running a VQL query in
  a different org or user context. To be able to run as a different user, the calling
  user needs to have the IMPERSONATE permission (usually only given to administrators).
  Velociraptor versions prior to 0.77.2 evaluate this permission against the caller's
  org instead of against the target org.\n\nThis allows an administrator in one org
  to impersonate another user in another org, in which they may not have the IMPERSONATE
  permission."
