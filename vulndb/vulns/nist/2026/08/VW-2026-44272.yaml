title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  avoid leaking the caller's thread keyring via the table device file\n\nThe refactoring
  in commit a28d893eb327 (\"md: port block device access to file\")\naccidentally
  causes the caller's thread keyring to be kept alive long\nbeyond the caller's lifetime.\n\
  \nAs a result, \"cryptsetup luksSuspend\" silently fails to wipe the\nLUKS volume
  key from memory.\n\nIn detail: \"cryptsetup luksOpen\" uses its supposedly ephemeral
  thread\nkeyring to pass the volume key to the kernel. dm-crypt's\ncrypt_set_keyring_key()
  copies the key material into its own\ncrypt_config structure and then drops its
  own reference to the key in\nthe keyring with key_put().\n\nWith this fix, restoring
  pre-v6.9 behavior, the copy in the thread\nkeyring is then promptly garbage collected,
  such that exactly one copy\nof the volume key remains. This single copy is correctly
  wiped from\nmemory on \"cryptsetup luksSuspend\".\n\nWithout this fix, the thread
