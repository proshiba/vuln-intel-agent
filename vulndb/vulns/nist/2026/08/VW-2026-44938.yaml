title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  6fire: Fix UAF at error handling during probe\n\nAlthough 6fire driver had a few
  fixes for dealing with the early error\nhandling during the probe phase, it forgot
  a pending URB before\nfreeing the resources, which may lead to a UAF.\n\nThis patch
  addresses it by doing the almost same cleanup procedure\nlike the normal disconnect
  phase at the error path."
