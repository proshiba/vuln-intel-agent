title: RustFS is a distributed object storage system built in Rust. Prior to 
  1.0.0-beta.12, RustFS handles FTPS MKD in FtpsDriver::mkd in 
  crates/protocols/src/ftps/driver.rs by calling storage.create_bucket without 
  authorize_operation for S3Action::CreateBucket, allowing authenticated FTPS 
  users denied s3:CreateBucket to create buckets. This issue is fixed in version
  1.0.0-beta.12.
