title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpu/buddy:
  bail out of try_harder when alignment cannot be honoured\n\nThe try_harder contiguous
  fallback could return a range whose start\noffset did not match the caller's min_block_size.
  When a candidate's\nstart is misaligned, realign it: free the misaligned run and
  reallocate\nexactly @size at the next lower min_block_size boundary. This keeps
  the\nreturned size unchanged with no surplus to trim, and rejects the request\n\
  only when no aligned candidate fits.\n\nv2: align misaligned candidates down to
  min_block_size instead of\n    bailing out, for both the RHS and LHS paths (Matthew)."
