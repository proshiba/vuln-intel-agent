title: A vulnerability in the internal packet-processing functionality of Cisco 
  Firepower Threat Defense (FTD) Software for the Cisco Firepower 2100 Series 
  could allow an unauthenticated, remote attacker to cause an affected device to
  stop processing traffic, resulting in a denial of service (DoS) condition. The
  vulnerability is due to a logic error, which may prevent ingress buffers from 
  being replenished under specific traffic conditions. An attacker could exploit
  this vulnerability by sending a series of crafted packets to an affected 
  device. A successful exploit could allow the attacker to consume all input 
  buffers, which are shared between all interfaces, leading to a queue wedge 
  condition in all active interfaces. This situation would cause an affected 
  device to stop processing any incoming traffic and result in a DoS condition 
  until the device is reloaded manually.
