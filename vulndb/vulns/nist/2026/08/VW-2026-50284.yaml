title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  fix multiple unsafe decodes in decode_locker()\n\ndecode_locker() in cls_lock_client.c
  contains three unsafe decode\noperations that allow a malicious or compromised OSD
  to trigger\nslab-out-of-bounds reads:\n\n1. ceph_decode_copy() at the locker_id_t
  name field has no preceding\n   bounds check. With p == end after ceph_start_decoding()
  accepts\n   struct_len=0, this reads sizeof(ceph_entity_name) = 9 bytes past\n \
  \  the validated buffer boundary.\n\n2. *p += sizeof(struct ceph_timespec) after
  the locker_info_t header\n   is an unchecked pointer advance. A malicious OSD can
  position p\n   past end, causing all subsequent _safe checks to pass against a\n\
  \   bogus boundary.\n\n3. len = ceph_decode_32(p) has no preceding bounds check,
  and the\n   immediately following *p += len is uncapped. A malicious OSD can\n \
  \  send len=0xffffffff, advancing p gigabytes past end and escaping\n   the decode
  window entirely.\n\nFix all three by repl"
