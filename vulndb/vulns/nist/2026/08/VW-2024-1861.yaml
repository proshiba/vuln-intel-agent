title: "In the Linux kernel, the following vulnerability has been resolved:\n\nubifs:
  Fix races between xattr_{set|get} and listxattr operations\n\nUBIFS may occur some
  problems with concurrent xattr_{set|get} and\nlistxattr operations, such as assertion
  failure, memory corruption,\nstale xattr value[1].\n\nFix it by importing a new
  rw-lock in @ubifs_inode to serilize write\noperations on xattr, concurrent read
  operations are still effective,\njust like ext4.\n\n[1] https://lore.kernel.org/linux-mtd/20200630130438.141649-1-houtao1@huawei.com"
