title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  prevent snt_unacked underflow on CONN_ACK\n\ntipc_sk_conn_proto_rcv() subtracts
  the peer-supplied connection ack count\nfrom the unsigned 16-bit send counter snt_unacked
  without checking that it\ndoes not exceed the number of messages actually outstanding:\n\
  \n\ttsk->snt_unacked -= msg_conn_ack(hdr);\n\nmsg_conn_ack() is read straight from
  a received CONN_MANAGER/CONN_ACK\nmessage. If the ack count is larger than snt_unacked,
  the subtraction\nwraps to a near-maximum value, leaving tsk_conn_cong() permanently
  true\nand starving the connection of further transmits.\n\nValidate the ACK count
  at the start of the CONN_ACK block and drop the\nmessage if it acknowledges more
  messages than are outstanding. A peer (or,\nfor a local connection, the connected
  peer socket) can otherwise wedge a\nTIPC connection's send side by sending an oversized
  connection ack."
