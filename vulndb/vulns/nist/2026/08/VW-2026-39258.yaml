title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  don't free the ASCONF's own transport in DEL-IP processing\n\nsctp_process_asconf()
  caches the transport the ASCONF chunk is processed\nagainst in asconf->transport
  (== chunk->transport, set once in sctp_rcv()).\nFor an ASCONF located through its
  Address Parameter by\n__sctp_rcv_asconf_lookup(), that cached transport corresponds
  to the\nAddress Parameter, which need not be the packet's source address.\n\nsctp_process_asconf_param()
  rejects a DEL-IP for the packet source address\n(ADDIP D8, SCTP_ERROR_DEL_SRC_IP),
  but nothing protects asconf->transport.\nA single ASCONF can therefore carry, in
  order:\n\n    [Address Parameter L] [DEL-IP L] [DEL-IP 0.0.0.0]\n\nwhere L differs
  from the source. The DEL-IP for L passes the D8 check and\ncalls sctp_assoc_rm_peer()
  on the transport that asconf->transport still\npoints at, freeing it (RCU-deferred).
  The following wildcard DEL-IP then\nreuses the now-dangling asconf->transport in
  sctp_as"
