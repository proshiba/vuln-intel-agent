title: rConfig Core 8.0.0 before 8.2.13 contains a path traversal vulnerability 
  that allows authenticated users to read arbitrary files by supplying crafted 
  filenames containing directory traversal sequences to the export download 
  endpoint. Attackers can manipulate the filename parameter with traversal 
  sequences to escape the intended export directory and access files outside it 
  that are readable by the application process.
