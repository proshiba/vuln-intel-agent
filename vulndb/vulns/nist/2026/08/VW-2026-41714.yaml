title: ERPNext is a free and open source Enterprise Resource Planning tool. 
  Prior to 15.111.0 and 16.22.0, the add_ac function in 
  erpnext/accounts/utils.py accepts the ignore_permissions argument without 
  enforcing Account create permission, allowing an authenticated limited user to
  create unauthorized accounting master records and affect financial data 
  integrity and audit trails. This issue is fixed in versions 15.111.0 and 
  16.22.0.
