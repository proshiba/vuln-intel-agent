title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  mgmt: hold reference for hci_conn in mgmt_pending_cmds\n\nDereferencing RCU-protected
  pointers outside critical sections is\ninvalid and may lead to UAF.  Use of hci_conn
  in hci_sync callbacks also\nneeds to hold refcount to avoid UAF.\n\nTake appropriate
  locks for hci_conn lookups, and take refcount for\nhci_conn pointers stored in mgmt_pending_cmd
  so that the pointer stays\nvalid.\n\nWhen accessing conn->state, ensure hdev->lock
  is held to avoid data\nrace."
