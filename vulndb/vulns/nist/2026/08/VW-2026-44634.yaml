title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Sanitize the reply credit grant after parsing\n\nThe out_norqst exit in rpcrdma_reply_handler()
  branches away before\nthe credit clamp, so a reply that matches no pending request
  reaches\nout_post carrying the raw credit value parsed from the wire.\nrpcrdma_post_recvs()
  does not bound its @needed argument: the refill\nloop allocates and chains Receive
  WRs until the count is satisfied or\nallocation fails. A peer that sends a well-formed
  reply carrying an\nunknown XID and an inflated credit grant therefore drives rep\n\
  allocation and Receive posting past re_max_requests on every such\nreply.\n\nMove
  the clamp to immediately after the credit field is parsed,\nahead of the first branch
  that can reach out_post, so every later\nconsumer sees a sanitized value. The cwnd
  update stays on the\nmatched-request path."
