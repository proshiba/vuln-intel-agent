title: The Versa Concerto SD-WAN orchestration platform is vulnerable to an 
  authentication bypass in the Traefik reverse proxy configuration, allowing at 
  attacker to access administrative endpoints. The Spack upload endpoint can be 
  leveraged for a Time-of-Check to Time-of-Use (TOCTOU) write in combination 
  with a race condition to achieve remote code execution via path loading 
  manipulation, allowing an unauthenticated actor to achieve remote code 
  execution (RCE).This issue is known to affect Concerto from 12.1.2 through 
  12.2.0. Additional versions may be vulnerable.
