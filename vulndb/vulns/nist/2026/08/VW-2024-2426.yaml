title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  hisilicon/qm - inject error before stopping queue\n\nThe master ooo cannot be completely
  closed when the\naccelerator core reports memory error. Therefore, the driver\n\
  needs to inject the qm error to close the master ooo. Currently,\nthe qm error is
  injected after stopping queue, memory may be\nreleased immediately after stopping
  queue, causing the device to\naccess the released memory. Therefore, error is injected
  to close master\nooo before stopping queue to ensure that the device does not access\n\
  the released memory."
