title: "The WPvivid — Backup, Migration & Staging WordPress plugin before 0.9.131
  does not sanitise a value taken from an unauthenticated request before using it
  to build a log file path, allowing an attacker holding a site to site transfer key
  to create a log file in any existing writable directory of the site, including the
  web root.\n\nThe file name always carries a fixed suffix and the contents are always
  the WPvivid — Backup, Migration & Staging WordPress plugin before 0.9.131's own
  log header, so only the location of the file is attacker controlled."
