title: authentik is an open-source identity provider. Prior to 2026.2.6 and 
  2026.5.5, a diagnostic action on the LDAP Source API does not enforce the 
  object-level read-authorization filter used by the rest of the API. Any party 
  able to reach the API, including an unauthenticated client, can invoke the 
  diagnostic action against a configured LDAP Source. The server then connects 
  to the upstream directory using the source's configured bind credentials and 
  returns a bounded set of directory entries. The response exposes the 
  distinguished names of those entries and the names of the attributes present 
  on them, revealing directory structure, naming conventions, and the existence 
  of specific accounts and groups, but not attribute values. Deployments without
  a configured LDAP Source are not affected. This issue is fixed in versions 
  2026.2.6 and 2026.5.5.
