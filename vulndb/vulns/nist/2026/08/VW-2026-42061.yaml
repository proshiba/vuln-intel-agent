title: n8n before 2.31.5 and 2.32.x before 2.32.1 contain a path-confinement 
  bypass in the @n8n/computer-use file-search (search_files) tool. A crafted 
  search pattern can bypass the base-directory confinement check and expand to 
  locations outside the configured directory, causing the tool to return the 
  names and contents of arbitrary local files readable by the daemon's OS user. 
  Any deployment where an actor can influence the tool's search input is 
  affected.
