title: A vulnerability was identified in WonderTrader up to 0.9.9. Affected is 
  the function _undone_qty in the library src/WtCore/TraderAdapter.h of the 
  component Pending Order Handler. The manipulation of the argument getUndoneQty
  leads to enforcement of behavioral workflow. The attack is possible to be 
  carried out remotely. The exploit is publicly available and might be used. The
  vendor was contacted early about this disclosure but did not respond in any 
  way.
