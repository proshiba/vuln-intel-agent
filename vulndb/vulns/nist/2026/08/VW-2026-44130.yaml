title: The Cookie Banner for GDPR / CCPA – WPLP Cookie Consent plugin for 
  WordPress is vulnerable to Stored Cross-Site Scripting via the 'regionArray' 
  parameter in all versions up to, and including, 4.3.5 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that will 
  execute whenever a user accesses an injected page. Successful exploitation 
  requires that the site administrator has enabled the 'Support Google Consent 
  Mode (GCM)' setting, which is disabled by default. Additionally, the AJAX 
  handler performs no nonce or capability check, allowing any authenticated user
  including those with Subscriber-level access to overwrite the affected plugin 
  setting.
