title: Vim is an open source, command line text editor. Prior to 9.2.0846, 
  set_sofo() in src/spellfile.c reuses sl_sal_first[] without resetting values 
  left by set_sal_first(), so a crafted spell file containing an SN_SAL section 
  before an SN_SOFO section causes under-counted mapping lists and 
  attacker-influenced writes beyond a heap allocation. This issue is fixed in 
  version 9.2.0846.
