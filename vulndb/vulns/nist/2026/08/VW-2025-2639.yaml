title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sfc: add missing xdp queue reinitialization\n\nAfter rx/tx ring buffer size is changed,
  kernel panic occurs when\nit acts XDP_TX or XDP_REDIRECT.\n\nWhen tx/rx ring buffer
  size is changed(ethtool -G), sfc driver\nreallocates and reinitializes rx and tx
  queues and their buffer\n(tx_queue->buffer).\nBut it misses reinitializing xdp queues(efx->xdp_tx_queues).\n\
  So, while it is acting XDP_TX or XDP_REDIRECT, it uses the uninitialized\ntx_queue->buffer.\n\
  \nA new function efx_set_xdp_channels() is separated from efx_set_channels()\nto
  handle only xdp queues.\n\nSplat looks like:\n   BUG: kernel NULL pointer dereference,
  address: 000000000000002a\n   #PF: supervisor write access in kernel mode\n   #PF:
  error_code(0x0002) - not-present page\n   PGD 0 P4D 0\n   Oops: 0002 [#4] PREEMPT
  SMP NOPTI\n   RIP: 0010:efx_tx_map_chunk+0x54/0x90 [sfc]\n   CPU: 2 PID: 0 Comm:
  swapper/2 Tainted: G      D           5.17.0+ #55 e8beeee8289528f11357029357cf\n\
  \ "
