title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  clamp v9 CRIU control stack checkpoint copy to BO size\n\nCRIU checkpoint copies
  the MQD control stack using cp_hqd_cntl_stack_size\nfrom hardware without bounding
  it to the allocated BO region. If the HW\nfield is larger than the queue's control
  stack allocation, memcpy reads\npast the BO into adjacent GTT memory and can leak
  kernel data to userspace.\n\nStore the page-aligned control stack BO size in mqd_manager
  and clamp\ncheckpoint copies and reported checkpoint sizes to\nmin(cp_hqd_cntl_stack_size,
  mm->ctl_stack_size). Apply the same bound\nfor multi-XCC v9.4.3 checkpoint layout.\n\
  \n(cherry picked from commit 6c2abd0ec09e86c6323010673766f76050e28aa3)"
