title: The MailChimp Forms by MailMunch plugin for WordPress is vulnerable to 
  unauthorized modification of data due to a missing capability check on the 
  `sign_in()` and `sign_up()` AJAX handlers in all versions up to, and 
  including, 3.2.7. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to relink the site's MailMunch integration 
  to an attacker-controlled MailMunch account by submitting attacker-supplied 
  credentials. Once relinked, all subscriber data captured by the plugin's forms
  is delivered to the attacker, and the forms/landing pages rendered on the site
  are pulled from the attacker's MailMunch account.
