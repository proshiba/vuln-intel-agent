title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nft_payload: fix mask build for partial field offload\n\nnft_payload_offload_mask()
  builds the offload match mask for a payload\nexpression that covers only part of
  a header field.  For a partial IPv6\naddress match (field_len = 16, priv_len = 1)
  that shift is 1 << 120, which\nis undefined on the 32-bit int operand.  It also
  trims only one word, so\nthe remaining words stay 0xffffffff (and when priv_len
  is a multiple of 4\nthe trim is skipped entirely), leaving the mask covering more
  bytes than\nthe rule matches.\n\n  UBSAN: shift-out-of-bounds in net/netfilter/nft_payload.c:278:20\n\
  \  shift exponent 120 is too large for 32-bit type 'int'\n  ...\n\nThe match is
  byte-granular and struct nft_data is zero-initialised, so the\ncorrect mask is simply
  the first priv_len bytes set to 0xff. Set those\nbytes directly and drop the word/shift
  trimming; this removes the undefined\nshift and no longer over-masks the trailing
  bytes."
