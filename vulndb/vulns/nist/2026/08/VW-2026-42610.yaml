title: ishankportfolio is a portfolio website. Prior to version 1.0.1, contact 
  form submissions could potentially be exposed due to improperly secured 
  client-side database configuration and insufficient access control policies. 
  Applications using publicly exposed database credentials or permissive 
  database rules may allow unauthorised users to read, modify, or abuse stored 
  form submission data. This could impact personally identifiable information 
  (PII) submitted through the website contact form, including names, email 
  addresses, phone numbers, and messages. The issue has been patched in version 
  1.0.1. Users unable to upgrade immediately can reduce risk by disabling public
  read/write database access, rotating exposed API keys, restricting database 
  policies to authenticated requests only, moving sensitive operations to secure
  backend/serverless functions, and/or monitoring database activity logs for 
  suspicious access.
