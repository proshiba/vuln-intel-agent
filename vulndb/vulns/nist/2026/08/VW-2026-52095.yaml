title: Nodemailer versions before 8.0.5 contain an SMTP command injection 
  vulnerability in the transport name option used in EHLO/HELO commands. The 
  name parameter is concatenated directly into SMTP commands without sanitizing 
  carriage return and line feed characters, allowing attackers to inject 
  arbitrary SMTP commands for email spoofing and phishing attacks.
