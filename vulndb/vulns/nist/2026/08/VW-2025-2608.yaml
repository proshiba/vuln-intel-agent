title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  hugetlb: independent PMD page table shared count\n\nThe folio refcount may be increased
  unexpectly through try_get_folio() by\ncaller such as split_huge_pages.  In huge_pmd_unshare(),
  we use refcount\nto check whether a pmd page table is shared.  The check is incorrect
  if\nthe refcount is increased by the above caller, and this can cause the page\n\
  table leaked:\n\n BUG: Bad page state in process sh  pfn:109324\n page: refcount:0
  mapcount:0 mapping:0000000000000000 index:0x66 pfn:0x109324\n flags: 0x17ffff800000000(node=0|zone=2|lastcpupid=0xfffff)\n\
  \ page_type: f2(table)\n raw: 017ffff800000000 0000000000000000 0000000000000000
  0000000000000000\n raw: 0000000000000066 0000000000000000 00000000f2000000 0000000000000000\n\
  \ page dumped because: nonzero mapcount\n ...\n CPU: 31 UID: 0 PID: 7515 Comm: sh
  Kdump: loaded Tainted: G    B              6.13.0-rc2master+ #7\n Tainted: [B]=BAD_PAGE\n\
  \ Hardware name: QEMU KVM Virtual Machine, BIOS "
