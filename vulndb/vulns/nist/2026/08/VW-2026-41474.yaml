title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: initialize SDIO data work before cleanup\n\nbrcmf_sdio_probe() stores
  the newly allocated bus in sdiodev->bus before\nallocating the ordered workqueue.
  If that allocation fails, the function\njumps to fail and calls brcmf_sdio_remove().\n\
  \nbrcmf_sdio_remove() unconditionally cancels bus->datawork. Initialize the\nwork
  item before the first failure path that can reach brcmf_sdio_remove(),\nso the cleanup
  path always observes a valid work object.\n\nThis issue was found by our static
  analysis tool and then confirmed by\nmanual review of the probe error path and the
  remove-time work drain. The\nproblem pattern is an early setup failure that reaches
  a cleanup helper\nwhich cancels an embedded work item before its initializer has
  run.\n\nA QEMU PoC forced alloc_ordered_workqueue() to fail at the same point in\n\
  brcmf_sdio_probe(), before INIT_WORK(&bus->datawork) is reached. The\nresulting
  fail path calls brcmf_sdio_remove()"
