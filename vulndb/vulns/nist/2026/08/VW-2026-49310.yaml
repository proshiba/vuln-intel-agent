title: The web-based management interface uses a modified uhttpd server with CGI
  shell scripts. The HTTP Basic Authentication username, taken directly from the
  Authorization header without sanitization, is inserted into a shell command 
  string executed via the system() function. By submitting a specially crafted 
  username containing shell metacharacters, an unauthenticated attacker with 
  network access to the device can escape the command context and execute 
  arbitrary commands with root privileges.
