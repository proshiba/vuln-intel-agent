title: Incus is a system container and virtual machine manager. Prior to version
  7.3.0, an unprivileged, project-confined Incus user (a non-admin TLS/RBAC 
  identity with `can_create_images` and `can_create_instances`) can execute 
  arbitrary code as root on the host. A crafted image ships `backup.yaml` as a 
  symlink to a host file. When the root daemon writes the instance's backup 
  file, it follows the symlink. Version 7.3.0 patches the issue.
