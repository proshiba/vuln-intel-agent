title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Improve EP11 CPRB domain handling with ASN.1 parsing\n\nThe zcrypt_msgtype6_send_ep11_cprb()
  function uses fragile struct\noverlays to access and modify the domain field in
  the EP11 CPRB\npayload, creating maintainability and security concerns:\n1. Struct
  overlay approach (pld_hdr) assumes fixed payload structure\n   and doesn't validate
  the actual ASN.1 encoding.\n2. Complex length format detection logic is error-prone
  and doesn't\n   properly validate bounds at each parsing step.\n3. Direct struct
  member access bypasses proper ASN.1 validation.\n\nFix by replacing struct overlays
  with explicit ASN.1 parsing that\nvalidates each field (payload tag/length, function
  tag/length/value,\noptional domain tag/length/value) with proper bounds checking
  at every\nstep. Add asn1_int_encode() helper function to safely write integer\n\
  values with correct endianness conversion. This makes the code\nconsistent with
  the validation patte"
