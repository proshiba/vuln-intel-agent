title: 'In Bouncy Castle for Java FIPS (BC-FJA) before bc-fips 1.0.2.7 (1.0.X series),
  2.0.2 (2.0.X series) and 2.1.3 (2.1.X series), sensitive key material held by the
  AES and DESede engines, the SP 800-90A DRBGs, SymmetricSecretKey and the PBKD and
  scrypt parameter classes was zeroised on garbage collection by overriding Object.finalize.
  Finalization runs at an unspecified time and in an unspecified order and is serviced
  by a single finalizer thread, so where objects carrying a finalizer are allocated
  faster than that thread retires them the pending-finalization queue grows without
  bound: disposal falls arbitrarily far behind, which can contribute to an OutOfMemoryError
  under load, and the key material those objects hold stays resident in the heap for
  as long as they are queued, defeating the purpose of the zeroisation. The behaviour
  was not a problem on Java 8 or Java 11; it is later JVMs, on which finalization
  has been deprecated and progressively de-emphasised, where it becomes one. Dispo'
