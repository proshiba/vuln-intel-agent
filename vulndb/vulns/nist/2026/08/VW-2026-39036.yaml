title: SiYuan versions before v3.7.3 fail to validate the avID parameter on all 
  code branches in attribute-view read endpoints, allowing attackers to 
  construct traversal paths that escape the storage directory. Authenticated 
  users with RoleReader permissions or anonymous clients when publish 
  authentication is disabled can read JSON files outside the attribute-view 
  directory to disclose cross-scope database content.
