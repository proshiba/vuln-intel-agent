title: "Improper Input Validation, Improper Neutralization of Special Elements in
  Output Used by a Downstream Component ('Injection') vulnerability in Apache Camel
  Knative component\n\nThe Knative consumer in camel-knative maps inbound CloudEvent
  attributes onto Camel message headers. In binary content mode the HTTP-header path
  filters Camel-internal headers through KnativeHttpHeaderFilterStrategy, but in structured
  content mode (Content-Type application/cloudevents+json) the CloudEvent extension
  fields are read directly from the JSON body and every extension key is copied into
  the Exchange headers without applying any HeaderFilterStrategy (CloudEventProcessors,
  spec versions 1.0, 1.0.1 and 1.0.2). As a result, an unauthenticated attacker can
  inject Camel-internal headers (e.g. CamelHttpUri, CamelHttpPath, CamelFileName)
  via a structured-mode CloudEvent request, matched case-insensitively against Camel's
