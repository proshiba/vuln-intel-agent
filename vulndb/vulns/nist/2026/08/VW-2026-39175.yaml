title: A security flaw has been discovered in OpenAkita up to 1.27.12. This 
  vulnerability affects unknown code of the file /api/upload of the component 
  File Upload API. The manipulation of the argument File results in cross site 
  scripting. The attack may be performed from remote. A high complexity level is
  associated with this attack. It is stated that the exploitability is 
  difficult. The exploit has been released to the public and may be used for 
  attacks. The vendor was contacted early about this disclosure but did not 
  respond in any way.
