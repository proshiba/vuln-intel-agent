title: A weakness has been identified in vxcontrol PentAGI up to 2.1.0. This 
  affects an unknown part of the file 
  backend/pkg/templates/prompts/pentester.tmpl of the component Tool Management 
  Protocol Handler. Executing a manipulation can lead to sandbox issue. It is 
  possible to launch the attack remotely. The attack requires a high level of 
  complexity. It is indicated that the exploitability is difficult. The exploit 
  has been made available to the public and could be used for attacks. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
