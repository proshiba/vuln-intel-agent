title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  mgmt: fix pending command UAF in EIR updates\n\nMGMT_OP_SET_LOCAL_NAME is handled
  asynchronously on powered controllers\nand can run set_name_sync().  When the controller
  is BR/EDR capable,\nset_name_sync() updates the local name and then rebuilds EIR
  data through\neir_create().  The EIR builder walks hdev->uuids, but the UUID list
  can\nbe changed and entries can be freed by MGMT_OP_ADD_UUID and\nMGMT_OP_REMOVE_UUID.\n\
  \npending_eir_or_class() is meant to serialize management commands that\ncan change
  EIR or the class of device, but it did not include\nMGMT_OP_SET_LOCAL_NAME.  In
  addition, it walked hdev->mgmt_pending\nwithout hdev->mgmt_pending_lock even though
  pending commands are added\nand removed under that mutex.  A racing command completion
  can therefore\nremove and free a pending command while pending_eir_or_class() is
  still\ninspecting it, leading to a use-after-free in the pending-command list or\n\
  allowing a local"
