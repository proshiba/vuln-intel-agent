title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  fix NULL dereference when killing missing key\n\novpn_crypto_kill_key assumes both
  crypto slots are populated and\ndereferences each slot before checking it. That
  is not guaranteed: a\npeer can have only one installed key, and the kill path may
  be asked to\nremove a key that is not present.\n\nRead each slot once while holding
  the crypto state lock, check for NULL\nbefore looking at key_id, and only replace
  the slot that actually\nmatches."
