title: Frappe is a full-stack web application framework. In version 16.31.0 and 
  earlier, the whitelisted toggle_like and mark_as_seen endpoints in 
  frappe/desk/like.py and frappe/desk/doctype/note/note.py do not enforce read 
  permission before modifying _liked_by metadata or a Note seen state. An 
  authenticated user can interact with documents or notes that the user cannot 
  read, disclosing resource existence and modifying resource-associated 
  metadata. No released fixed version is available as of this review.
