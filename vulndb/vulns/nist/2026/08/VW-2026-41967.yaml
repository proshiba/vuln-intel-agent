title: the Undertow AJP listener honours forged ssl_cert and is_ssl AJP 
  attributes without requiring any shared-secret authentication. This enables an
  unauthenticated attacker with direct TCP access to port 8009 to bypass 
  CLIENT-CERT authentication by injecting a forged X.509 certificate via the AJP
  protocol.
