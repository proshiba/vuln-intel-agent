title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: fix wrong pci_get_drvdata type in AER handlers\n\nrtw89 stores an ieee80211_hw
  pointer via pci_set_drvdata() at probe\ntime, but io_error_detected() and io_resume()
  retrieve it as a\nnet_device pointer.  This causes netif_device_detach/attach to\n\
  operate on an ieee80211_hw struct, reading and writing at wrong\noffsets.  The adjacent
  io_slot_reset() already does it correctly.\n\nUse ieee80211_stop_queues/wake_queues
  instead, consistent with\nevery other queue stop/start path in the driver.\n\nTested
  on RTL8852CE by calling the handlers from a test module\nbefore and after the fix."
