title: "Tokens issued to a low-privileged user are not sufficiently restricted, allowing
  them to be used to access product-level Admin REST APIs.\n\nExploitation of this
  vulnerability allows a low-privileged user to invoke the Admin REST APIs of WSO2
  products, potentially leading to full administrative account takeover. This requires
  the attacker to already possess a low-privileged user account and be able to obtain
  a valid token for it."
