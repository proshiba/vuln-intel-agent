title: 'Vulnerability in the Oracle Java SE, Oracle GraalVM for JDK, Oracle GraalVM
  Enterprise Edition product of Oracle Java SE (component: Security).  Supported versions
  that are affected are Oracle Java SE: 8u501, 11.0.32, 17.0.20, 21.0.12, 25.0.4,
  26.0.2; Oracle GraalVM for JDK: 17.0.20 and  21.0.12; Oracle GraalVM Enterprise
  Edition: 21.3.19. Difficult to exploit vulnerability allows unauthenticated attacker
  with network access via multiple protocols to compromise Oracle Java SE, Oracle
  GraalVM for JDK, Oracle GraalVM Enterprise Edition.  Successful attacks of this
  vulnerability can result in  unauthorized read access to a subset of Oracle Java
  SE, Oracle GraalVM for JDK, Oracle GraalVM Enterprise Edition accessible data. Note:
  This vulnerability can only be exploited by supplying data to APIs in the specified
  Component without using Untrusted Java Web Start applications or Untrusted Java
  applets, such as through a web service. CVSS 3.1 Base Score 3.7 (Confidentiality
  impacts).  CVSS Vect'
