title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  elx: efct: Fix refcount leak in efct_hw_io_abort()\n\nWhen efct_hw_reqtag_alloc()
  fails in efct_hw_io_abort(), the error path\nreturns -ENOSPC without releasing the
  reference obtained via\nkref_get_unless_zero() earlier in the function. All other
  error paths\ncorrectly drop the reference. This causes a permanent reference leak
  on the\nio_to_abort object.\n\nAdditionally, the abort_in_progress flag is left
  set to true on this path,\nwhich means future abort attempts for the same I/O will
  immediately return\n-EINPROGRESS even though the abort was never submitted, effectively\n\
  blocking recovery.\n\nFix this by adding the missing kref_put() call and reset abort_in_progress\n\
  to false, matching the cleanup done in the efct_hw_wq_write() failure path\nbelow."
