title: SiYuan versions before v3.7.3 contain a metadata disclosure vulnerability
  in the /api/block/getBlockInfo endpoint that returns document root metadata 
  including title for publish-forbidden documents without publish-access checks.
  Anonymous readers or publish RoleReader tokens can supply a block ID to 
  retrieve the title, notebook, path, root ID, and icon of documents 
  administrators marked as excluded from publishing.
