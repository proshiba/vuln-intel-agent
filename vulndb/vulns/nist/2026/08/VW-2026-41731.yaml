title: Rocket.Chat is an open-source, secure, fully customizable communications 
  platform. Prior to 7.10.14, 8.0.8, 8.1.7, 8.2.7, 8.3.7, 8.4.5, 8.5.2, and 
  8.6.1, the channels.convertToTeam REST endpoint allows an authenticated 
  registered user with the create-team permission to convert an unrelated public
  channel by supplying channelName instead of channelId because the edit-room 
  permission is checked only for channelId. This issue is fixed in versions 
  7.10.14, 8.0.8, 8.1.7, 8.2.7, 8.3.7, 8.4.5, 8.5.2, and 8.6.1.
