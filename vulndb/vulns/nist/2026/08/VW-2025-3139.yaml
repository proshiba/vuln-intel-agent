title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  rds: don't hold sock lock when cancelling work from rds_tcp_reset_callbacks()\n\n\
  syzbot is reporting lockdep warning at rds_tcp_reset_callbacks() [1], for\ncommit
  ac3615e7f3cffe2a (\"RDS: TCP: Reduce code duplication in\nrds_tcp_reset_callbacks()\"\
  ) added cancel_delayed_work_sync() into a section\nprotected by lock_sock() without
  realizing that rds_send_xmit() might call\nlock_sock().\n\nWe don't need to protect
  cancel_delayed_work_sync() using lock_sock(), for\neven if rds_{send,recv}_worker()
  re-queued this work while __flush_work()\n from cancel_delayed_work_sync() was waiting
  for this work to complete,\nretried rds_{send,recv}_worker() is no-op due to the
  absence of RDS_CONN_UP\nbit."
