title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: charger-manager: fix refcount leak in is_full_charged()\n\nIn is_full_charged(),
  power_supply_get_by_name() is called to\nobtain a reference to the fuel_gauge power
  supply. If the\nvoltage check (uV >= desc->fullbatt_uV) succeeds, the function\n\
  returns true directly without releasing the reference, leaking\nthe refcount.\n\n\
  Fix this by setting a flag and jumping to the out label where\npower_supply_put()
  properly drops the reference."
