title: "GNU Emacs for Android is vulnerable to an integer overflow in sfnt_read_name_table()
  in src/sfnt.c. The function computes an allocation size using a 32-bit length value
  from a TrueType font file without overflow checking. On 32-bit targets, a crafted
  font causes the calculation to wrap, resulting in an undersized heap allocation.
  A subsequent read() call writes beyond the buffer, causing a heap buffer overflow.
  An attacker can deliver a malicious font file via email, EWW (Emacs Web Wowser),
  or documents with custom faces, causing Emacs to load it. This can lead to heap
  memory corruption and potential code execution.\n\n\n\n\nThis issue was fixed in
  commit d51a4722316efe0960994d371e1859099894d1ca"
