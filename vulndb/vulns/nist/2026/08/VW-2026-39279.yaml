title: "Improper Handling of Case Sensitivity vulnerability in Erlang Ecosystem Foundation
  oidcc_plug (Oidcc.Plug.Authorize module) renders the user agent session binding
  inert, removing a defense in depth control against replay of a stolen session.\n\
  \nThis vulnerability is associated with program files lib/oidcc/plug/authorize.ex
  and lib/oidcc/plug/authorization_callback.ex, and program routines Oidcc.Plug.Authorize.call/2
  and Oidcc.Plug.AuthorizationCallback.call/2.\n\nOidcc.Plug.Authorize.call/2 reads
  the initiating client's user agent with get_req_header(conn, \"User-Agent\"). Plug
  lowercases incoming header names, but get_req_header/2 matches the supplied key
  exactly and performs no normalization of its own, so the mixed-case lookup always
  returns an empty list and nil is written into the session. On the callback side,
  Oidcc.Plug.AuthorizationCallback treats a stored nil user agent as nothing to compare
  and returns :ok without inspecting the request. The two behaviours combine so that
