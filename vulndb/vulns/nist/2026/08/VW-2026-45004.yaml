title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  skip global block reserve accounting for rescue mounts\n\n[BUG]\nMounting with rescue=ibadroots
  after corrupting the block group tree\nroot triggers a NULL pointer dereference:\n\
  \n  BUG: kernel NULL pointer dereference, address: 0000000000000100\n  RIP: 0010:btrfs_update_global_block_rsv+0x9d/0x1c0
  [btrfs]\n  Call Trace:\n   fill_dummy_bgs+0xd4/0x120 [btrfs]\n   open_ctree+0xc6e/0x1ca0
  [btrfs]\n   btrfs_get_tree+0x50d/0xa40 [btrfs]\n\nThe same crash occurs with a corrupted
  raid stripe tree root, via\nbtrfs_read_block_groups() instead of fill_dummy_bgs().\n\
