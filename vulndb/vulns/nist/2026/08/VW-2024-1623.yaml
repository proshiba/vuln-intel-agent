title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  lpfc: Fix link down processing to address NULL pointer dereference\n\nIf an FC link
  down transition while PLOGIs are outstanding to fabric well\nknown addresses, outstanding
  ABTS requests may result in a NULL pointer\ndereference. Driver unload requests
  may hang with repeated \"2878\" log\nmessages.\n\nThe Link down processing results
  in ABTS requests for outstanding ELS\nrequests. The Abort WQEs are sent for the
  ELSs before the driver had set\nthe link state to down. Thus the driver is sending
  the Abort with the\nexpectation that an ABTS will be sent on the wire. The Abort
  request is\nstalled waiting for the link to come up. In some conditions the driver
  may\nauto-complete the ELSs thus if the link does come up, the Abort completions\n\
  may reference an invalid structure.\n\nFix by ensuring that Abort set the flag to
  avoid link traffic if issued due\nto conditions where the link failed."
