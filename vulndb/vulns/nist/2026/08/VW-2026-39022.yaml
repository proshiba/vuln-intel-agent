title: "Net::SAML2 versions before 0.86 for Perl allow SAML authentication bypass
  via XML signature wrapping because new_from_xml reads assertion identity with document-wide
  XPath instead of the signed subtree.\n\nnew_from_xml reads the NameID, attribute
  values, SessionIndex, audience and other identity fields with document-wide XPath,
  such as //saml:Assertion/saml:AttributeStatement/saml:Attribute and //saml:Subject/saml:NameID,
  which select the first matching element in document order rather than the element
  covered by the verified signature. handle_response confirms that a signature is
  present and, when a cacert is configured, that it chains to the CA, but XML::Sig
  verifies only the element named by the signature's Reference URI, so unsigned sibling
  assertions in the same document are not covered. An attacker who holds any one IdP-signed
  assertion can add an unsigned attacker-authored assertion earlier in document order;
  the signature still verifies and the document-order XPath returns the at"
