title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: Clear ffs_eventfd in ffs_data_clear.\n\nffs_data_clear is indirectly
  called from both ffs_fs_kill_sb and\nffs_ep0_release, so it ends up being called
  twice when userland closes ep0\nand then unmounts f_fs.\nIf userland provided an
  eventfd along with function's USB descriptors, it\nends up calling eventfd_ctx_put
  as many times, causing a refcount\nunderflow.\nNULL-ify ffs_eventfd to prevent these
  extraneous eventfd_ctx_put calls.\n\nAlso, set epfiles to NULL right after de-allocating
  it, for readability.\n\nFor completeness, ffs_data_clear actually ends up being
  called thrice, the\nlast call being before the whole ffs structure gets freed, so
  when this\nspecific sequence happens there is a second underflow happening (but
  not\nbeing reported):\n\n/sys/kernel/debug/tracing# modprobe usb_f_fs\n/sys/kernel/debug/tracing#
  echo ffs_data_clear > set_ftrace_filter\n/sys/kernel/debug/tracing# echo function
  > current_tracer\n/sys"
