title: "In the Linux kernel, the following vulnerability has been resolved:\n\nionic:
  Fix netdev notifier unregister on failure\n\nIf register_netdev() fails, then the
  driver leaks the netdev notifier.\nFix this by calling ionic_lif_unregister() on
  register_netdev()\nfailure. This will also call ionic_lif_unregister_phc() if it
  has\nalready been registered."
