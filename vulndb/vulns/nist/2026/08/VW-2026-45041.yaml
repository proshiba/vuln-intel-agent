title: SiYuan versions before v3.7.4 fail to validate or escape table column 
  width values, allowing stored cross-site scripting injection into style 
  attributes. Attackers can inject malicious payloads through the 
  setAttrViewColWidth API that break out of style attributes and inject event 
  handlers on every table cell, executing arbitrary code in the Electron 
  renderer with Node integration enabled.
