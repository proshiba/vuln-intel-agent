title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  mdb: Fix source list corruption on a failed replace\n\nWhen replacing the source
  list of an MDB remote entry, all existing\nsources are first marked for deletion
  and vxlan_mdb_remote_srcs_add()\nis then called to add the new source list. Sources
  present in the new\nlist have their deletion mark cleared, and any sources left
  marked\nafterwards are removed.\n\nIf vxlan_mdb_remote_srcs_add() fails partway
  through, its error path\ndeletes all entries on the remote's source list. That rollback
  is only\ncorrect for its other caller, vxlan_mdb_remote_add(), where the remote\n\
  was just allocated and the list contains solely entries added during\nthe call.
