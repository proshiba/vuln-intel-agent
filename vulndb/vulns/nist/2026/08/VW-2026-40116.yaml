title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_fs: initialize reset_work at allocation time\n\nffs_fs_kill_sb() unconditionally
  calls cancel_work_sync() on\nffs->reset_work when a functionfs instance is unmounted:\n\
  \n\tffs_data_reset(ffs);\n\tcancel_work_sync(&ffs->reset_work);\n\nHowever ffs->reset_work
  is only ever initialized via INIT_WORK() in\nffs_func_set_alt() and ffs_func_disable(),
  and only on the\nFFS_DEACTIVATED path. That state is reached solely by ffs_data_closed()\n\
  when the instance is mounted with the \"no_disconnect\" option, so for the\ncommon
  case (no \"no_disconnect\", or mounted and unmounted without ever\nbeing deactivated)
  reset_work is never initialized.\n\nffs_data_new() allocates the ffs_data with kzalloc_obj()
  and does not\ninitialize reset_work, and ffs_data_reset()/ffs_data_clear() do not
  touch\nit either, so reset_work.func is left NULL. cancel_work_sync() on such a\n\
  work then trips the WARN_ON(!work->func) guard in __flush_work():\n\n  WARNING: "
