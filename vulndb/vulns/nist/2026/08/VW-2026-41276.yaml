title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-fwnode: Fix subdev owner overwritten in v4l2_async_register_subdev_sensor()\n\
  \nThe v4l2 helper v4l2_async_register_subdev_sensor() calls\nv4l2_async_register_subdev(),
  which is a macro that expands to\n__v4l2_async_register_subdev(sd,THIS_MODULE).
  Since the macro is expanded\ninside v4l2-fwnode.c, THIS_MODULE resolves to the v4l2-fwnode
  module\nrather than the sensor driver module that originally set sd->owner. When\n\
  v4l2-fwnode is built-in, THIS_MODULE evaluates to NULL, which then\noverwrites the
  sensor driver's owner with NULL.\n\nThis causes the problem that the sensor module's
  reference count is never\nincremented during async registration, so the module can
  be removed while\nthe subdevice is still in use by a notifier (e.g., a CSI-2 receiver\n\
  bridge driver).\n\nFix this by renaming v4l2_async_register_subdev_sensor() to\n\
  __v4l2_async_register_subdev_sensor() with an added explicit module\nargument and
  introducing a w"
