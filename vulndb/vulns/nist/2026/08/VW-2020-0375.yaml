title: "A remote code execution vulnerability exists in the way that Windows handles
  objects in memory. An attacker who successfully exploited the vulnerability could
  execute arbitrary code with elevated permissions on a target system.\nTo exploit
  the vulnerability, an attacker who has a domain user account could create a specially
  crafted request, causing Windows to execute arbitrary code with elevated permissions.\n\
  The security update addresses the vulnerability by correcting how Windows handles
  objects in memory."
