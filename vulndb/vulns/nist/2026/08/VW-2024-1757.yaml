title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Mark target gfn of emulated atomic instruction as dirty\n\nWhen emulating an
  atomic access on behalf of the guest, mark the target\ngfn dirty if the CMPXCHG
  by KVM is attempted and doesn't fault.  This\nfixes a bug where KVM effectively
  corrupts guest memory during live\nmigration by writing to guest memory without
  informing userspace that the\npage is dirty.\n\nMarking the page dirty got unintentionally
  dropped when KVM's emulated\nCMPXCHG was converted to do a user access.  Before
  that, KVM explicitly\nmapped the guest page into kernel memory, and marked the page
  dirty during\nthe unmap phase.\n\nMark the page dirty even if the CMPXCHG fails,
  as the old data is written\nback on failure, i.e. the page is still written.  The
  value written is\nguaranteed to be the same because the operation is atomic, but
  KVM's ABI\nis that all writes are dirty logged regardless of the value written.\
