title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  fix NULL pointer dereference in afs_get_tree()\n\nafs_alloc_sbi() uses kzalloc for
  memory allocation. And, if\nctx->dyn_root is not null, as->cell and as->volume are
  null.\nIn trace_afs_get_tree() they are dereferenced.\n\nKASAN error message:\n\n\
  KASAN: null-ptr-deref in range [0x0000000000000000-0x0000000000000007]\nCPU: 2 PID:
  18478 Comm: syz-executor.7 Not tainted 5.10.246-syzkaller #0\nHardware name: QEMU
  Standard PC (i440FX + PIIX, 1996), BIOS 1.12.0-1\n04/01/2014\nRIP: 0010:perf_trace_afs_get_tree+0x1d9/0x550\n\
  include/trace/events/afs.h:1365\n\nCall Trace:\ntrace_afs_get_tree include/trace/events/afs.h:1365
  [inline]\nafs_get_tree+0x922/0x1350 fs/afs/super.c:599\nvfs_get_tree+0x8e/0x300
  fs/super.c:1572\ndo_new_mount fs/namespace.c:3011 [inline]\npath_mount+0x14a5/0x2220
  fs/namespace.c:3341\ndo_mount fs/namespace.c:3354 [inline]\n__do_sys_mount fs/namespace.c:3562
  [inline]\n__se_sys_mount fs/namespace.c:3539 [inline]\n__x64_sys_moun"
