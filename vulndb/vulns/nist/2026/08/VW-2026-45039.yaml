title: SiYuan before v3.7.4 fails to properly escape database menu metadata in 
  HTML interpolation, allowing stored values to execute script when users open 
  group, view, or field-edit menus. Attackers can inject markup through field 
  descriptions or names that close containing elements and execute arbitrary 
  code via event handlers, reaching Node built-ins due to Electron's insecure 
  configuration.
