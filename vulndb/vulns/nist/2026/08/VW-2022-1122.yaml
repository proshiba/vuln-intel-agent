title: "A vulnerability in the management web server of Cisco Firepower Threat Defense
  (FTD) Software could allow an authenticated, remote attacker with high privileges
  to execute configuration commands on an affected system.\r\n\r This vulnerability
  exists because access to HTTPS endpoints is not properly restricted on an affected
  device. An attacker could exploit this vulnerability by sending specific messages
  to the affected HTTPS handler. A successful exploit could allow the attacker to
  perform configuration changes on the affected system, which should be configured
  and managed only through Cisco Firepower Management Center (FMC) Software."
