title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  Make tcp_allowed_congestion_control readonly in non-init netns\n\nCurrently, tcp_allowed_congestion_control
  is global and writable;\nwriting to it in any net namespace will leak into all other
  net\nnamespaces.\n\ntcp_available_congestion_control and tcp_allowed_congestion_control
  are\nthe only sysctls in ipv4_net_table (the per-netns sysctl table) with a\nNULL
  data pointer; their handlers (proc_tcp_available_congestion_control\nand proc_allowed_congestion_control)
  have no other way of referencing a\nstruct net. Thus, they operate globally.\n\n\
  Because ipv4_net_table does not use designated initializers, there is no\neasy way
  to fix up this one \"bad\" table entry. However, the data pointer\nupdating logic
  shouldn't be applied to NULL pointers anyway, so we\ninstead force these entries
  to be read-only.\n\nThese sysctls used to exist in ipv4_table (init-net only), but
  they were\nmoved to the per-net ipv4_net_table, presumably without r"
