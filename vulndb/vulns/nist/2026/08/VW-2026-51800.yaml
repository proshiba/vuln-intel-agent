title: "A NULL\npointer dereference vulnerability exists in TL-WR841N v14 in the UPnP
  service when processing\nSOAP state variable query requests. A specially crafted
  SOAP query may trigger\nunexpected termination or instability of the process hosting
  the UPnP service.\n\n\n\n\n\nSuccessful\nexploitation may result in a denial-of-service
  condition affecting UPnP\ndiscovery, state query, or related management functionality
  until the affected\nprocess is restarted or the device is rebooted."
