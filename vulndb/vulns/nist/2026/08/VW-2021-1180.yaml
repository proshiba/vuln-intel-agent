title: 'Vulnerability in the Advanced Networking Option component of Oracle Database
  Server. Supported versions that are affected are 12.1.0.2, 12.2.0.1 and 19c. Difficult
  to exploit vulnerability allows unauthenticated attacker with network access via
  Oracle Net to compromise Advanced Networking Option. Successful attacks require
  human interaction from a person other than the attacker and while the vulnerability
  is in Advanced Networking Option, attacks may significantly impact additional products.
  Successful attacks of this vulnerability can result in takeover of Advanced Networking
  Option. Note: The July 2021 Critical Patch Update introduces a number of Native
  Network Encryption changes to deal with vulnerability CVE-2021-2351 and prevent
  the use of weaker ciphers. Customers should review: "Changes in Native Network Encryption
  with the July 2021 Critical Patch Update" (Doc ID 2791571.1). CVSS 3.1 Base Score
  8.3 (Confidentiality, Integrity and Availability impacts). CVSS Vector: (CVSS:3.1/AV'
