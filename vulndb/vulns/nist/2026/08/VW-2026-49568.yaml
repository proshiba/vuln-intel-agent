title: Coroot's unauthenticated MCP OAuth dynamic client registration endpoint 
  accepts any syntactically valid redirect URI without validation, allowing 
  attackers to register clients pointing to attacker-controlled hosts. Attackers
  can send authorization URLs to signed-in users, capture their authorization 
  codes upon consent approval, and exchange them for access tokens to hijack MCP
  sessions.
