title: MongoDB Server's handling of a Queryable Encryption maintenance operation
  did not properly validate certain request parameters against the collection's 
  encrypted field configuration before use. An authenticated user with readWrite
  privileges could submit a specially formed request that leads to a server 
  crash or excessive internal writes, resulting in resource exhaustion and 
  corruption of encrypted index data.
