title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/gt:
  Fix NULL deref on sched_engine alloc failure\n\nAvoid using intel_context_put()
  before intel_context_init() in\nexeclists_create_virtual() as the kref_put() inside
  would lead\nto NULL deref on the IOCTL path when sched_engine allocation fails.\n\
  \nDiscovered using AI-assisted static analysis confirmed by\nIntel Product Security.\n\
  \n(cherry picked from commit 4f2a12f2d50e9f48227656e4dcbd6423506be31d)"
