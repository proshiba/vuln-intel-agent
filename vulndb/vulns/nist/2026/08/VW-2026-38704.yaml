title: FreeRDP before 3.29.0 contains a buffer over-disclosure vulnerability in 
  the gateway WebSocket transport (libfreerdp/core/gateway/websocket.c). The 
  client's Pong reply reuses a fixed 1024-byte response stream whose length is 
  not sealed to the actual received Ping payload, so a malicious 
  gateway/WebSocket peer sending a non-empty Ping control frame causes the 
  client to reply with an overlong Pong that discloses bytes beyond the received
  payload (the peer receives the masking key and can unmask the reply). A 
  zero-length Ping reaches an assertion and terminates the client (denial of 
  service).
