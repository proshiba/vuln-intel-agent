title: "A vulnerability in the OSPF protocol of Cisco Secure Firewall ASA Software
  and Cisco Secure FTD Software could allow an unauthenticated, adjacent attacker
  to cause an affected device to reload unexpectedly, resulting in a DoS condition.
  If OSPF authentication is enabled, the attacker must know the secret key to exploit
  this vulnerability.\r\n\r This vulnerability is due to insufficient input validation
  when processing OSPF update packets. An attacker could exploit this vulnerability
  by sending crafted OSPF update packets. A successful exploit could allow the attacker
  to create a buffer overflow, causing the affected device to reload, resulting in
  a DoS condition."
