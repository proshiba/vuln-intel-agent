title: "A denial of service vulnerability exists in the Windows implementation of
  Transport Layer Security (TLS) when it improperly handles certain key exchanges.
  An attacker who successfully exploited the vulnerability could cause a target system
  to stop responding.\nTo exploit this vulnerability, a remote unauthenticated attacker
  could send a specially crafted request to a target system utilizing TLS 1.2 or lower,
  triggering the system to automatically reboot.\nThe update addresses the vulnerability
  by changing the way TLS key exchange messages are validated."
