title: CodeWhale (codewhale / codewhale-tui) versions >= 0.8.41 and < 0.8.64 
  contain an argument injection vulnerability in the git_show tool. The 
  model-supplied rev parameter is passed unvalidated into the git show argv 
  without an --end-of-options sentinel, so a value beginning with --output= is 
  interpreted as a git flag. Because the tool is registered as auto-approved and
  advertised as read-only, an attacker (via a malicious repository combined with
  prompt injection) can cause an unprompted arbitrary file write at the 
  privilege of the invoking user, targeting sensitive files such as 
  ~/.ssh/authorized_keys, ~/.bashrc, or ~/.gitconfig. Fixed in 0.8.64 by adding 
  rev validation.
