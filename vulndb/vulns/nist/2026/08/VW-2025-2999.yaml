title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoundwire:
  qcom: fix storing port config out-of-bounds\n\nThe 'qcom_swrm_ctrl->pconfig' has
  size of QCOM_SDW_MAX_PORTS (14),\nhowever we index it starting from 1, not 0, to
  match real port numbers.\nThis can lead to writing port config past 'pconfig' bounds
  and\noverwriting next member of 'qcom_swrm_ctrl' struct.  Reported also by\nsmatch:\n\
  \n  drivers/soundwire/qcom.c:1269 qcom_swrm_get_port_config() error: buffer overflow
  'ctrl->pconfig' 14 <= 14"
