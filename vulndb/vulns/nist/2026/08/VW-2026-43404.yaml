title: 'Budibase before 3.40.0 contains a NoSQL injection vulnerability in the MongoDB
  datasource integration where user-supplied parameters are enriched with handlebars
  using noEscaping: true and parsed without operator filtering. Attackers can inject
  MongoDB operators through query parameters to bypass per-user access controls, read
  arbitrary documents, execute JavaScript via $where operators, or modify collections
  through update and delete operations.'
