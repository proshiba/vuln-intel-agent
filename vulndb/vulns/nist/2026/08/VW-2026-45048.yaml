title: SiYuan versions before v3.7.4 contain an authentication bypass 
  vulnerability in the WebSocket endpoint caused by differential parsing of 
  query parameters between authentication exemption and session quarantine 
  checks. Unauthenticated attackers can craft a malicious WebSocket URI with 
  duplicated query parameters to bypass access auth code validation and receive 
  the live kernel event stream including document identifiers, titles, and 
  operation logs.
