title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: Validate iph->ihl in nf_flow_ip4_tunnel_proto()\n\nAdd sanity check for
  iph->ihl field in nf_flow_ip4_tunnel_proto() before\nusing it to compute the header
  size, avoiding out-of-bounds access with\nmalformed IP headers.\nWhile at it, use
  iph->protocol instead of the hardcoded IPPROTO_IPIP\nconstant when setting ctx->tun.proto
  and reference ctx->tun.hdr_size\nwhen updating ctx->offset."
