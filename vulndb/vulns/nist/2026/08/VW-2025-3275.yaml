  time we were chasing a bug which looked like a sudden\npermanent failure of networking
  and mmc on some of our devices.\nThe bug was very sensitive to any software changes
  and even more to\nany kernel debug options.\n\nFinally we got a setup where the
  problem was reproducible with\nCONFIG_DMA_API_DEBUG=y and it revealed the issue
