title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/msm/gem:
  prevent integer overflow in msm_ioctl_gem_submit()\n\nThe \"submit->cmd[i].size\"\
  \ and \"submit->cmd[i].offset\" variables are u32\nvalues that come from the user
  via the submit_lookup_cmds() function.\nThis addition could lead to an integer wrapping
  bug so use size_add()\nto prevent that.\n\nPatchwork: https://patchwork.freedesktop.org/patch/624696/"
