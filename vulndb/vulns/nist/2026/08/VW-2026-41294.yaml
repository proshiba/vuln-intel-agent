title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  meson: vdec: Fix memory leak in error path of vdec_open\n\nThe vdec_open() function
  previously jumped directly to\nerr_m2m_release when vdec_init_ctrls() failed, skipping\n\
  release of the m2m context. This caused a resource leak.\n\nFix it by introducing
  a proper err_m2m_ctx_release label\nthat calls v4l2_m2m_ctx_release(sess->m2m_ctx)
  before\nreleasing the m2m device.\n\nThis was identified via kmemleak:\nunreferenced
  object 0xffff0000205d6878 (size 8):\n  comm \"v4l_id\", pid 5289, jiffies 4294938580\n\
  \  hex dump (first 8 bytes):\n    40 d2 49 18 00 00 ff ff                      \
  \    @.I.....\n  backtrace (crc d3204599):\n    kmemleak_alloc+0xc8/0xf0\n    __kvmalloc_node_noprof+0x60c/0x850\n\
  \    v4l2_ctrl_handler_init_class+0x1b4/0x2e8 [videodev]\n    vdec_open+0x1f4/0x788
  [meson_vdec]\n    v4l2_open+0x144/0x460 [videodev]\n    chrdev_open+0x1ac/0x500\n\
  \    do_dentry_open+0x3f0/0xfe8\n    vfs_open+0x68/0x320\n    do_open+0x2d8/0x9a8\n\
  \    pa"
