title: "Subject::new_for_owner() in the zbus_polkit crate encodes the uid entry of
  a unix-process polkit subject as an unsigned 32-bit integer (D-Bus type u), whereas
  the org.freedesktop.PolicyKit1.Authority interface specifies a signed 32-bit integer
  (D-Bus type i). Because of this type mismatch, polkit silently discards the caller-supplied
  UID and instead determines the subject's owner itself by looking up the PID in /proc,
  a lookup that is inherently subject to a time-of-check/time-of-use race.\n\nConsequently,
  an application that passes a UID obtained from a trustworthy source — for example
  SO_PEERCRED Unix socket peer credentials — in order to defend against PID reuse
  receives no protection, and the supplied UID has no effect on the authorization
  decision. A local unprivileged attacker who can cause an authorized process to terminate
  and then win the race to have their own process assigned the same PID can be authorized
  under the identity of the terminated process, bypassing the polkit auth"
