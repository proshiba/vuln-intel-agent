title: Grav CMS 2.0.10 contains a path traversal vulnerability in 
  ImageMedium::watermark(), which passes its unsanitized $image argument to 
  RocketTheme\Toolbox\ResourceLocator\UniformResourceLocator::findResource(). 
  Because the file:// scheme branch only lexically collapses '..' segments 
  without a realpath/containment check, an editor authoring Markdown image 
  syntax with traversal sequences can cause arbitrary image files outside Grav's
  media sandbox to be composited into a carrier image, which is then cached and 
  served from a public, unauthenticated URL — disclosing those files to 
  anonymous visitors.
