title: "In the Linux kernel, the following vulnerability has been resolved:\n\nasync_xor:
  increase src_offs when dropping destination page\n\nNow we support sharing one page
  if PAGE_SIZE is not equal stripe size. To\nsupport this, it needs to support calculating
  xor value with different\noffsets for each r5dev. One offset array is used to record
  those offsets.\n\nIn RMW mode, parity page is used as a source page. It sets\nASYNC_TX_XOR_DROP_DST
  before calculating xor value in ops_run_prexor5.\nSo it needs to add src_list and
  src_offs at the same time. Now it only\nneeds src_list. So the xor value which is
  calculated is wrong. It can\ncause data corruption problem.\n\nI can reproduce this
  problem 100% on a POWER8 machine. The steps are:\n\n  mdadm -CR /dev/md0 -l5 -n3
  /dev/sdb1 /dev/sdc1 /dev/sdd1 --size=3G\n  mkfs.xfs /dev/md0\n  mount /dev/md0 /mnt/test\n\
  \  mount: /mnt/test: mount(2) system call failed: Structure needs cleaning."
