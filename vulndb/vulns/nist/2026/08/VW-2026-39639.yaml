title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  policy: preallocate inexact bins before xfrm_hash_rebuild reinsert\n\nxfrm_hash_rebuild()'s
  first loop preallocates the bins/chains the reinsert\nloop needs, so the reinsert
  (after hlist_del_rcu()) cannot allocate or\nfail. But its guard is inverted: it
  skips policies with prefixlen <\nthreshold and preallocates for the rest.\n\nprefixlen
  < threshold is exactly when policy_hash_bysel() returns NULL and\nthe reinsert takes
  the allocating xfrm_policy_inexact_insert() path. So the\nloop preallocates for
  the exact policies (which never allocate) and skips\nthe inexact ones, whose bin/node
  is then allocated GFP_ATOMIC during\nreinsert. On failure the error path only WARN_ONCE()s
  and continues,\nleaving a poisoned bydst node; the next rebuild's hlist_del_rcu()\n\
  dereferences LIST_POISON2 and takes a GPF. Reachable under memory pressure,\ndeterministic
  via failslab.\n\nInvert the guard so preallocation covers exactly the reinserted
  pol"
