title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncpu:
  hotplug: Preserve per instance callback errors\n\ncpuhp_invoke_callback() unwinds
  earlier callbacks for the same\nhotplug state when one instance fails. The rollback
  path currently\nreuses ret, so a successful rollback can hide the original error
  and\nmake the failed transition look successful.\n\nKeep the rollback result separate
  from the original error."
