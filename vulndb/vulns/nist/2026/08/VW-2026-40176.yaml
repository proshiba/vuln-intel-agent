title: A weakness has been identified in NocteDefensor LudusMCP up to 1.0.24. 
  The affected element is the function SecretDialog.showSecretDialog of the file
  src/utils/secretDialog.ts of the component get_credential_from_user. This 
  manipulation of the argument Description causes command injection. It is 
  possible to launch the attack on the local host. The project was informed of 
  the problem early through an issue report but has not responded yet.
