title: stigmem (pip package stigmem-node) version 0.9.0a1 contains a 
  timestamp-handling mismatch in federation peer-token validation that can cause
  valid peer tokens to be incorrectly treated as expired. This affects the 
  availability and reliability of authenticated federation flows on nodes using 
  federation peer authentication paths. The issue is fixed in 0.9.0a2, which 
  uses the canonical millisecond-based validation path.
