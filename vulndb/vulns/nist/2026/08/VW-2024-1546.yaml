title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_ct: fix skb leak and crash on ooo frags\n\nact_ct adds skb->users before defragmentation.
  If frags arrive in order,\nthe last frag's reference is reset in:\n\n  inet_frag_reasm_prepare\n\
  \    skb_morph\n\nwhich is not straightforward.\n\nHowever when frags arrive out
  of order, nobody unref the last frag, and\nall frags are leaked. The situation is
  even worse, as initiating packet\ncapture can lead to a crash[0] when skb has been
  cloned and shared at the\nsame time.\n\nFix the issue by removing skb_get() before
  defragmentation. act_ct\nreturns TC_ACT_CONSUMED when defrag failed or in progress.\n\
  \n[0]:\n[  843.804823] ------------[ cut here ]------------\n[  843.809659] kernel
  BUG at net/core/skbuff.c:2091!\n[  843.814516] invalid opcode: 0000 [#1] PREEMPT
  SMP\n[  843.819296] CPU: 7 PID: 0 Comm: swapper/7 Kdump: loaded Tainted: G S 6.7.0-rc3
  #2\n[  843.824107] Hardware name: XFUSION 1288H V6/BC13MBSBD, BIOS 1.29 11/25/2022\n\
  [  843"
