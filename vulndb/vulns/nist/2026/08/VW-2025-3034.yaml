title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix incomplete state save in rxe_requester\n\nIf a send packet is dropped by the
  IP layer in rxe_requester()\nthe call to rxe_xmit_packet() can fail with err ==
  -EAGAIN.\nTo recover, the state of the wqe is restored to the state before\nthe
  packet was sent so it can be resent. However, the routines\nthat save and restore
  the state miss a significnt part of the\nvariable state in the wqe, the dma struct
  which is used to process\nthrough the sge table. And, the state is not saved before
  the packet\nis built which modifies the dma struct.\n\nUnder heavy stress testing
  with many QPs on a fast node sending\nlarge messages to a slow node dropped packets
  are observed and\nthe resent packets are corrupted because the dma struct was not\n\
  restored. This patch fixes this behavior and allows the test cases\nto succeed."
