title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix index out of bounds in DCN30 color transformation\n\nThis commit addresses a
  potential index out of bounds issue in the\n`cm3_helper_translate_curve_to_hw_format`
  function in the DCN30 color\nmanagement module. The issue could occur when the index
  'i' exceeds the\nnumber of transfer function points (TRANSFER_FUNC_POINTS).\n\n\
  The fix adds a check to ensure 'i' is within bounds before accessing the\ntransfer
  function points. If 'i' is out of bounds, the function returns\nfalse to indicate
  an error.\n\ndrivers/gpu/drm/amd/amdgpu/../display/dc/dcn30/dcn30_cm_common.c:180
  cm3_helper_translate_curve_to_hw_format() error: buffer overflow 'output_tf->tf_pts.red'
  1025 <= s32max\ndrivers/gpu/drm/amd/amdgpu/../display/dc/dcn30/dcn30_cm_common.c:181
  cm3_helper_translate_curve_to_hw_format() error: buffer overflow 'output_tf->tf_pts.green'
  1025 <= s32max\ndrivers/gpu/drm/amd/amdgpu/../display/dc/dcn30/dcn30_cm_common.c:182"
