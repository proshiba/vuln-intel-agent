title: "In the Linux kernel, the following vulnerability has been resolved:\n\nMIPS:
  DEC: Ensure 32-bit stack location for o32 prom_printf()\n\nIn 64-bit configurations
  calling any firmware entry points from a kernel\nthread other than the initial one
  will result in a situation where the\nstack has been placed in the XKPHYS 64-bit
  memory segment.\n\nConsequently the stack pointer is no longer a 32-bit value and
  when the\n32-bit firmware code called uses 32-bit ALU operations to manipulate the\n\
  stack pointer, the calculated result is incorrect (in fact in the 64-bit\nMIPS ISA
  almost all 32-bit ALU operations will produce an unpredictable\nresult when executed
  on 64-bit data) and control goes astray.\n\nThis may happen when no final console
  driver has been enabled in the\nconfiguration and consequently the initial console
  continues being used\nlate into bootstrap, or with an upcoming change that will
  switch the zs\ndriver to use a platform device, which in turn will make the console\n\
  handover happen only after ot"
