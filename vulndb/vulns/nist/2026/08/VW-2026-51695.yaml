title: JS Recon is a JavaScript enumeration and SAST tool. From 1.2.1-beta.1 
  until 1.3.1-beta.2, the PR Branch Checker workflow in 
  .github/workflows/pr_checker.yml places github.head_ref and 
  github.event.pull_request.head.repo.full_name into BRANCH_NAME and SOURCE_REPO
  and interpolates those untrusted values into a shell gh pr comment command. A 
  remote user who opens a pull request can use shell metacharacters in a branch 
  or fork name to execute commands in the GitHub Actions runner with the 
  workflow's GITHUB_TOKEN, which has pull-requests write permission. This issue 
  is fixed in version 1.3.1-beta.2.
