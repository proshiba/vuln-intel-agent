title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: fix deadlock waiting for ticket during data relocation\n\nWhen performing
  data relocation on a zoned filesystem, BTRFS can deadlock\nin handle_reserve_tickets().
  The relocation process is waiting on a space\nreservation ticket that can never
  be fulfilled, because the relocation\nitself is the operation responsible for freeing
  up that space.\n\nFix this by introducing a new flush state,\nBTRFS_RESERVE_FLUSH_ZONED_RELOCATION,
  specifically for data chunk\nallocation during zoned relocation. Like\nBTRFS_RESERVE_FLUSH_FREE_SPACE_INODE,
  this state uses\npriority_reclaim_data_space() instead of the normal flushing path,
  which\navoids re-entering the relocation code and breaking the deadlock cycle.\n\
  \nIn btrfs_alloc_data_chunk_ondemand(), select this new flush state when the\ninode
  belongs to a data relocation root on a zoned filesystem."
