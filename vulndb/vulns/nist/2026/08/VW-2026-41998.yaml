title: A missing authentication vulnerability in Chaskiq through commit 46dfdd1 
  allows unauthenticated remote attackers to manipulate any tenant Stripe 
  subscription via the stripeCreateIntent GraphQL mutation. The mutation lacks 
  authentication and authorization checks, exposing Stripe payment intent 
  creation to unauthenticated callers. An attacker can create payment intents 
  and alter billing for any tenant without credentials.
