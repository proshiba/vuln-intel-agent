title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: Fix UAF in hci_disconnect_all_sync\n\nUse-after-free can occur in hci_disconnect_all_sync
  if a connection is\ndeleted by concurrent processing of a controller event.\n\n\
  To prevent this the code now tries to iterate over the list backwards\nto ensure
  the links are cleanup before its parents, also it no longer\nrelies on a cursor,
  instead it always uses the last element since\nhci_abort_conn_sync is guaranteed
  to call hci_conn_del.\n\nUAF crash log:\n==================================================================\n\
  BUG: KASAN: slab-use-after-free in hci_set_powered_sync\n(net/bluetooth/hci_sync.c:5424)
  [bluetooth]\nRead of size 8 at addr ffff888009d9c000 by task kworker/u9:0/124\n\n\
  CPU: 0 PID: 124 Comm: kworker/u9:0 Tainted: G        W\n6.5.0-rc1+ #10\nHardware
  name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS\n1.16.2-1.fc38 04/01/2014\nWorkqueue:
  hci0 hci_cmd_sync_work [bluetooth]\nCall Trace:\n <TASK>\n dump_stack_lvl+0"
