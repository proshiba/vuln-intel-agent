title: Scriban versions 6.6.0 through 7.2.0 contain a non-enforcing 
  ExpressionDepthLimit guard that fails to stop recursive descent parsing of 
  deeply nested expressions. Attackers can supply templates with deeply nested 
  parentheses, array initializers, object initializers, or unary operators to 
  trigger an uncatchable StackOverflowException that immediately terminates the 
  host process.
