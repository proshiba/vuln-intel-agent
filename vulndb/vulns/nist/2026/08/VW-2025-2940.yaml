title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  Do not corrupt the pfn list when doing batch carry\n\nIf batch->end is 0 then setting
  npfns[0] before computing the new value of\npfns will fail to adjust the pfn and
  result in various page accounting\ncorruptions. It should be ordered after.\n\n\
