title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  era: fix NULL pointer dereference in metadata_open()\n\nmetadata_open() returns
  NULL when kzalloc_obj() fails, but the\ncaller era_ctr() only checks IS_ERR(md).\
  \  Since IS_ERR(NULL)\nreturns false, the NULL pointer is treated as a valid result\n\
  and later assigned to era->md, leading to a NULL pointer\ndereference when the metadata
  is accessed.\n\nFix this by returning ERR_PTR(-ENOMEM) on allocation failure,\n\
  consistent with dm-cache-metadata.c, dm-thin-metadata.c, and\ndm-clone-metadata.c
  which all use ERR_PTR(-ENOMEM) for the\nsame pattern."
