title: A vulnerability was detected in BEN Group TubeBuddy for YouTube Extension
  up to 5.8.4 on Chrome. This impacts the function TBGlobal.GetToken of the file
  tubebuddymaster1.js. The manipulation of the argument t/c/r results in 
  insufficient verification of data authenticity. It is possible to launch the 
  attack remotely. The exploit is now public and may be used. The vendor was 
  contacted early about this disclosure.
