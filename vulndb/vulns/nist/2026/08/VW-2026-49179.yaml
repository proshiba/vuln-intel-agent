title: "A vulnerability was identified in HashiCorp Vault and Vault Enterprise (“Vault”)
  such that an authenticated attacker may manipulate an identity value referenced
  by a templated policy path to gain unintended access to Vault paths.\n\nAn attacker
  who can control the referenced identity value may include slash ({{/}}) characters
  that Vault interprets as additional path segments when rendering the policy.\n\n\
  This vulnerability, CVE-2026-5006, was fixed in Vault Community Edition 2.0.4 and
  Vault Enterprise 2.0.4, 1.21.9, 1.20.14, and 1.19.20."
