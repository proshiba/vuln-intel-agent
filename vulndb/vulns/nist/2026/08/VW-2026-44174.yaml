title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rt2x00: avoid full teardown before work setup in probe\n\nrt2x00lib_probe_dev()
  uses the full rt2x00lib_remove_dev() teardown for\nall probe failures. However,
  drv_data allocation and workqueue allocation\ncan fail before intf_work, autowakeup_work
  and sleep_work have been\ninitialized.\n\nDo not enter the full remove path until
  the probe has reached the point\nwhere those work items are set up. Return directly
  for drv_data allocation\nfailure, and use a small early cleanup path for workqueue
  allocation\nfailure.\n\nThis issue was found by our static analysis tool and then
  confirmed by\nmanual review of rt2x00lib_probe_dev() and rt2x00lib_remove_dev().
  The\nearly probe exits should not call a common teardown path that assumes the\n\
  later work setup has already completed.\n\nA QEMU PoC forced alloc_ordered_workqueue()
  to fail before the work\ninitializers are reached. The resulting fail path entered\n\
  rt2x00lib_remove_dev(), and DEBU"
