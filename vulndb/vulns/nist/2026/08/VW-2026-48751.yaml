title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbonding:
  alb: re-check primary_is_promisc under RTNL in bond_alb_monitor\n\nbond_alb_monitor()
  reads primary_is_promisc under RCU, then drops RCU and\ntakes RTNL via rtnl_trylock()
  before undoing the promiscuity it set on the\nactive slave. In that window the active
  slave can change under RTNL\n(RTM_DELLINK -> __bond_release_one() -> bond_alb_handle_active_change()),\n\
  which already drops the promiscuity and clears primary_is_promisc. The\nmonitor
  still acts on the stale decision: if the slave was removed with no\nfailover, curr_active_slave
  is now NULL and the deref faults; if it failed\nover, the stale dev_set_promiscuity(-1)
  underflows the new slave's\npromiscuity counter and pins it in IFF_PROMISC.\n\n\
  \  Oops: general protection fault, probably for non-canonical address ...\n  KASAN:
  null-ptr-deref in range [0x0000000000000000-0x0000000000000007]\n  Workqueue: b42
  bond_alb_monitor\n  RIP: 0010:bond_alb_monitor (drivers/net/bonding"
