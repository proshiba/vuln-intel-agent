title: Simple Machines Forum (SMF) through 2.1.7, fixed in commit 6f0dc61, 
  contains an authorization state-confusion vulnerability in the profile loader 
  that allows authenticated low-privileged users to gain administrator access by
  supplying multiple values for the user parameter. Attackers can exploit the 
  mismatch between Profile::$member and User::$me->is_owner during sequential 
  profile loading to be treated as the owner of an administrator profile, 
  enabling unauthorized password changes and full account takeover.
