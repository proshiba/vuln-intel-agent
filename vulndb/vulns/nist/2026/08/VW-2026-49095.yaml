title: Baserow interpolates a user's display name into the rich-text mention 
  markup without HTML encoding. PATCH /api/user/account/ stores the first_name 
  value verbatim, and the mention renderer in 
  web-frontend/modules/core/editor/mention.js builds its element with a template
  literal that places the name into a data-label attribute and the element body 
  unescaped. A name containing a double quote closes that attribute and the 
  opening tag, so following markup lands in the element content. The result is 
  rendered through v-html by the rich-text field components, so any rich-text 
  cell mentioning the account executes the stored script for every workspace 
  member who views the table, without a click. Any workspace member, at the 
  lowest permission level, can set the name and reach every other member of the 
  workspace, and the payload persists until the name is changed or the 
  mentioning row is removed. Version 2.3.0 escapes the value before 
  interpolation.
