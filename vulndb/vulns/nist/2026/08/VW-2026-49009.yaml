  cryptocurrency wallet detail view. Cryptocurrency addresses and blockchain names
  originating from external sources, including the public crowd-sourced ransomwhe.re
  feed, were stored without sufficient validation and later embedded directly into
  an inline JavaScript onclick handler.\n\n\nAlthough Jinja HTML autoescaping was
  applied, it does not provide adequate protection when untrusted data is inserted
  into a JavaScript string inside an HTML attribute. HTML entities such as &#39; are
  decoded by the browser's HTML parser before the resulting attribute is interpreted
  as JavaScript. Consequently, a specially crafted cryptocurrency address containing
