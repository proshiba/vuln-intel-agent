title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/qaic:
  Clean up integer overflow checking in map_user_pages()\n\nThe encode_dma() function
  has some validation on in_trans->size but it\nwould be more clear to move those
  checks to find_and_map_user_pages().\n\nThe encode_dma() had two checks:\n\n\tif
  (in_trans->addr + in_trans->size < in_trans->addr || !in_trans->size)\n\t\treturn
  -EINVAL;\n\nThe in_trans->addr variable is the starting address.  The in_trans->size\n\
  variable is the total size of the transfer.  The transfer can occur in\nparts and
  the resources->xferred_dma_size tracks how many bytes we have\nalready transferred.\n\
  \nThis patch introduces a new variable \"remaining\" which represents the\namount
  we want to transfer (in_trans->size) minus the amount we have\nalready transferred
  (resources->xferred_dma_size).\n\nI have modified the check for if in_trans->size
  is zero to instead check\nif in_trans->size is less than resources->xferred_dma_size.\
  \  If we have\nalready transferred"
