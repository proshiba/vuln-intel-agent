title: "A single ScriptEngine instance is reused for every message on a script-backed
  channel. For JSR-223 engines that report THREADING=null (not thread-safe, e.g. the
  Kotlin kts engine), concurrent message processing can corrupt engine-internal state,
  potentially leaking one message's payload/headers bindings into another message's
  script evaluation or throwing spurious exceptions.\nSpring Integration 7.1.0\nSpring
  Integration 7.0.0 - 7.0.5\nSpring Integration 6.5.0 - 6.5.10\nSpring Integration
  6.4.0 - 6.4.12\nSpring Integration 5.5.21 and earlier"
