title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Prevent PM resume deadlock in hwctx_sync_debug_bo()\n\namdxdna_hwctx_sync_debug_bo()
  invokes the hardware hwctx_sync_debug_bo()\ncallback while holding xdna->dev_lock.\n\
  \nThe callback may call amdxdna_cmd_submit(), which in turn calls\namdxdna_pm_resume_get().
  If the device is suspended,\namdxdna_pm_resume_get() may synchronously execute amdxdna_pm_resume(),\n\
  which also acquires xdna->dev_lock, resulting in a deadlock.\n\nAvoid the deadlock
  by calling amdxdna_pm_resume_get() before holding\nxdna->dev_lock in both amdxdna_hwctx_sync_debug_bo()
  and\namdxdna_drm_config_hwctx_ioctl()"
