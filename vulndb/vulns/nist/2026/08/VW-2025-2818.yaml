title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  xsk: disable txq irq before flushing hw\n\nice_qp_dis() intends to stop a given
  queue pair that is a target of xsk\npool attach/detach. One of the steps is to disable
  interrupts on these\nqueues. It currently is broken in a way that txq irq is turned
  off\n*after* HW flush which in turn takes no effect.\n\nice_qp_dis():\n-> ice_qvec_dis_irq()\n\
  --> disable rxq irq\n--> flush hw\n-> ice_vsi_stop_tx_ring()\n-->disable txq irq\n\
  \nBelow splat can be triggered by following steps:\n- start xdpsock WITHOUT loading
  xdp prog\n- run xdp_rxq_info with XDP_TX action on this interface\n- start traffic\n\
  - terminate xdpsock\n\n[  256.312485] BUG: kernel NULL pointer dereference, address:
  0000000000000018\n[  256.319560] #PF: supervisor read access in kernel mode\n[ \
  \ 256.324775] #PF: error_code(0x0000) - not-present page\n[  256.329994] PGD 0 P4D
  0\n[  256.332574] Oops: 0000 [#1] PREEMPT SMP NOPTI\n[  256.337006] CPU: 3 PID:
  32 Comm: ksoftirqd/3 Tainted: "
