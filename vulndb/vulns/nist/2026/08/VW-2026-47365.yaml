title: "Multiple Cisco products are affected by a vulnerability in the Snort 3 Detection
  Engine that could allow an unauthenticated, remote attacker to cause the Snort 3
  Detection Engine to restart, resulting in an interruption of packet inspection.\r\
  \n\r\nThis vulnerability is due to an error in the JSTokenizer normalization logic
  when the HTTP inspection normalizes JavaScript. An attacker could exploit this vulnerability
  by sending crafted HTTP packets through an established connection that is parsed
  by Snort 3. A successful exploit could allow the attacker to cause a DoS condition
  when the Snort 3 Detection Engine restarts unexpectedly. JSTokenizer is not enabled
  by default."
