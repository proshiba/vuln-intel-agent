title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  mglru: fix stale batch updates after memcg reparenting\n\nThe mglru page table walker
  batches per-generation size deltas in\nwalk->nr_pages while walking page tables
  without holding the lruvec lock. \nThe reset_batch_size() later folds those deltas
  into walk->lruvec under\nthe lruvec lock.\n\nThe page table walker can run concurrently
  with the memcg reparenting path\nas follows:\n\nCPU0                           CPU1\n\
  ====                           ====\n\nwalk_mm\n--> walk_page_range\n    --> update_batch_size\n\
  \        --> walk->nr_pages += delta\n\n                              mem_cgroup_css_offline\n\
  \                              --> memcg_reparent_objcgs\n                     \
  \             --> lock lruvec\n                                      lru_gen_reparent_memcg\n\
  \                                      --> reparent child folios to parent\n   \
  \                                   unlock lruvec\n\n    lock lruvec\n    reset_batch_size\n\
  \    "
