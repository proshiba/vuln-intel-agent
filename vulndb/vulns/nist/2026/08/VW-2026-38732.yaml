title: axios in a Node.js deployment using the HTTP adapter can route requests 
  through an attacker-controlled proxy. axios hardens merged request 
  configuration by creating a null-prototype object, but request interceptors 
  run after the merge; a common immutable interceptor pattern such as 
  {...config} or Object.assign({}, config) converts the hardened config back 
  into a regular object. axios then dispatches that object without re-hardening 
  it, and the Node HTTP adapter reads config.proxy through the prototype chain. 
  If an attacker can pollute Object.prototype.proxy, affected requests can be 
  routed through an attacker-controlled proxy. For plaintext HTTP requests, the 
  proxy can observe Authorization headers, Basic auth from config.auth, method, 
  absolute URL, Host, and request body, and can return its own response. This 
  does not establish browser impact or HTTPS header/body disclosure under normal
  TLS validation. Affected versions are >=0.31.1 (fixed in 0.33.0) and >=1.15.2 
  (fixed in 1.18.0).
