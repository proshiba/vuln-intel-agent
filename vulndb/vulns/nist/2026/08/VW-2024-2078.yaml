title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  hns3: fix kernel crash problem in concurrent scenario\n\nWhen link status change,
  the nic driver need to notify the roce\ndriver to handle this event, but at this
  time, the roce driver\nmay uninit, then cause kernel crash.\n\nTo fix the problem,
  when link status change, need to check\nwhether the roce registered, and when uninit,
  need to wait link\nupdate finish."
