title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/crossbar:
  Use correct index in crossbar_domain_free()\n\ncrossbar_domain_free() resets the
  domain data and then uses the nulled\nout irq_data->hwirq member as index to reset
  the irq_map[] entry and to\nwrite the relevant crossbar register with a safe entry.
  That means it\nnever frees the correct index and keeps the crossbar register connection\n\
  to the source interrupt active.\n\nIf it would not reset the domain data, then this
  would be even worse as\nirq_data->hwirq holds the source interrupt number, but both
  the map and\nregister index need the corresponding GIC SPI number and not the source\n\
  interrupt number. This might even result in an out of bounds access as\nthe source
  interrupt number can be higher than the maximal index space.\n\nFix this by using
  the GIC SPI index from the parent domain's irq_data."
