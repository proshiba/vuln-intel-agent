title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix NULL pointer dereference in module event cache removal\n\nA module-only event
  filter such as \":mod:foo\" is cached with a NULL\nevent_mod->match when foo has
  not been loaded. If a later write tries to\nremove a specific match from the same
  module, remove_cache_mod() passes\nthe NULL cached match to strcmp(), causing a
  NULL pointer dereference.\n\nThe issue can be reproduced from userspace:\n\n  echo
  ':mod:trace_events_kunit_missing' > /sys/kernel/tracing/set_event\n  echo '!foo_bar:mod:trace_events_kunit_missing'
  >> /sys/kernel/tracing/set_event\n\nThe second write must be a concatenation (\"\
  >>\") to not include O_TRUNC as\nthat would cause ftrace_clear_events() to clear
  the cached modules lines.\n\nThe crash was reproduced on x86_64 QEMU while KUnit
  workers contended on\nthe event tracing path:\n\n  BUG: kernel NULL pointer dereference,
  address: 0000000000000000\n  #PF: supervisor read access in kernel mode\n  RIP:
  0010:strcmp"
