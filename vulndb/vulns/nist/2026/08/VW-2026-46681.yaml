title: 'Vulnerability in the Siebel CRM Integration product of Oracle Siebel CRM (component:
  Open Integration).  Supported versions that are affected are 25.12-26.6. Easily
  exploitable vulnerability allows unauthenticated attacker with network access via
  HTTP to compromise Siebel CRM Integration.  Successful attacks require human interaction
  from a person other than the attacker. Successful attacks of this vulnerability
  can result in  unauthorized creation, deletion or modification access to critical
  data or all Siebel CRM Integration accessible data as well as  unauthorized access
  to critical data or complete access to all Siebel CRM Integration accessible data.
  CVSS 3.1 Base Score 8.1 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N).'
