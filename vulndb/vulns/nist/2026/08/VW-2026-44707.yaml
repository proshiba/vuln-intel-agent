title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_flow: Dont expose folded kernel pointers\n\nThe flow classifier falls back to
  addr_fold() for fields that are missing\nfrom packet headers. In map mode, userspace
  controls mask, xor, rshift,\naddend and divisor, and can observe the resulting classid
  through class\nstatistics. This allows a tc classifier in a user/network namespace
  to\nrecover the 32-bit folded value of skb->sk, skb_dst() or skb_nfct().\n\nAlign
  with standard kernel practices for pointer hashing and replace the\nXOR folding
  with a keyed siphash (which is cryptographically secure)"
