title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv4:
  Handle attempt to delete multipath route when fib_info contains an nh reference\n\
  \nGwangun Jung reported a slab-out-of-bounds access in fib_nh_match:\n    fib_nh_match+0xf98/0x1130
  linux-6.0-rc7/net/ipv4/fib_semantics.c:961\n    fib_table_delete+0x5f3/0xa40 linux-6.0-rc7/net/ipv4/fib_trie.c:1753\n\
  \    inet_rtm_delroute+0x2b3/0x380 linux-6.0-rc7/net/ipv4/fib_frontend.c:874\n\n\
  Separate nexthop objects are mutually exclusive with the legacy\nmultipath spec.
  Fix fib_nh_match to return if the config for the\nto be deleted route contains a
  multipath spec while the fib_info\nis using a nexthop object."
