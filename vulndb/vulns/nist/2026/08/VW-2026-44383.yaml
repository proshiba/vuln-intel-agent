title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: cpcap-battery: Fix missing nvmem_device_put() causing reference leak\n\n\
  In cpcap_battery_detect_battery_type(), the reference to an nvmem\ndevice obtained
  via nvmem_device_find() is not released with\nnvmem_device_put() on the success
  or read-failure paths, causing a\npermanent reference leak. The driver’s retry logic
  on subsequent\nbattery property reads can compound this leak, preventing the nvmem\n\
  device from ever being freed.\n\nFound by code review."
