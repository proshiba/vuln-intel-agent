title: gopacket provides packet processing capabilities for Go. Through version 
  1.7.0, multiple layer decoders use attacker-controlled lengths, counts, or 
  offsets before validating them against packet buffers, allowing a crafted 
  packet decoded through DecodingLayerParser or DecodeFromBytes to trigger an 
  unrecovered panic and remotely deny service.  A patch commit is available at 
  210f25f.
