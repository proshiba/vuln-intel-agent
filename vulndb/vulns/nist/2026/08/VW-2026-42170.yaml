title: 'Improper handling of values for some Intel(R) Processors within Ring 0: Kernel,
  Hypervisor and Bare Metal OS may allow an escalation of privilege. Authorized adversary
  with a privileged user combined with a high complexity attack may enable escalation
  of privilege. This result may potentially occur via local access when attack requirements
  are present with special internal knowledge and require no user interaction. The
  potential vulnerability may impact the confidentiality (low), integrity (low) and
  availability (none) of the vulnerable system, resulting in subsequent system confidentiality
  (high), integrity (high) and availability (none) impacts.'
