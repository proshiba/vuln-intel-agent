title: "In the Linux kernel, the following vulnerability has been resolved:\n\nDrivers:
  hv: vmbus: Track decrypted status in vmbus_gpadl\n\nIn CoCo VMs it is possible for
  the untrusted host to cause\nset_memory_encrypted() or set_memory_decrypted() to
  fail such that an\nerror is returned and the resulting memory is shared. Callers
  need to\ntake care to handle these errors to avoid returning decrypted (shared)\n\
  memory to the page allocator, which could lead to functional or security\nissues.\n\
  \nIn order to make sure callers of vmbus_establish_gpadl() and\nvmbus_teardown_gpadl()
  don't return decrypted/shared pages to\nallocators, add a field in struct vmbus_gpadl
  to keep track of the\ndecryption status of the buffers. This will allow the callers
  to\nknow if they should free or leak the pages."
