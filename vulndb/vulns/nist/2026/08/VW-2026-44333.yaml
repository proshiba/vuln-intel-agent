title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  avoid moving extents to occupied clusters\n\nFor non-auto OCFS2_IOC_MOVE_EXT operations,
  userspace supplies a physical\nme_goal.  ocfs2_move_extent() initializes new_phys_cpos
  from that goal and\nexpects ocfs2_probe_alloc_group() to replace it with a free
  run in the\ntarget block group.\n\nThe probe currently leaves *phys_cpos unchanged
  if the scan reaches the\nend of the group without finding a free run.  An occupied
  goal at the last\nbit can therefore survive the probe and be passed to\n__ocfs2_move_extent(),
  which copies file data into a cluster still owned\nby another inode before the bitmap
  is updated.\n\nWhen the probe does find a free run, it also subtracts move_len from
  the\nending bit.  The start of an N-bit run ending at i is i - N + 1, so the\ncurrent
  calculation can report the bit immediately before the free run.\n\nClear *phys_cpos
  before scanning and use the correct free-run start. \nCallers already treat a zero
