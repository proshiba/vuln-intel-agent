title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7921s: fix slab-out-of-bounds access in sdio host\n\nSDIO may need addtional
  511 bytes to align bus operation. If the tailroom\nof this skb is not big enough,
  we would access invalid memory region.\nFor low level operation, increase skb size
  to keep valid memory access in\nSDIO host.\n\nError message:\n[69.951] BUG: KASAN:
