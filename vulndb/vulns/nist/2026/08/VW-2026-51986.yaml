title: "A vulnerability was recently discovered in the rpc.mountd daemon in the nfs-utils
  package for Linux, that allows a NFSv3 client to escalate the\nprivileges assigned
  to it in the /etc/exports file at mount time. In particular, it allows the client
  to access any subdirectory or subtree of an exported directory, regardless of the
  set file permissions, and regardless of any 'root_squash' or 'all_squash' attributes
  that would normally be expected to apply to that client."
