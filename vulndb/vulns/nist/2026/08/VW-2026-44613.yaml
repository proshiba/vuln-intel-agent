title: "In the Linux kernel, the following vulnerability has been resolved:\n\nflow_dissector:
  check device type before reading ETH_ADDRS\n\n__skb_flow_dissect() unconditionally
  reads 12 bytes from eth_hdr(skb)\nwhen FLOW_DISSECTOR_KEY_ETH_ADDRS is requested.
  This assumes the skb\nhas a valid Ethernet header at mac_header, which is not always
  the case.\n\nThe problem can be triggered by:\n 1. Creating a TUN device in L3 mode
  (IFF_TUN, hard_header_len=0)\n 2. Attaching a multiq qdisc with a flower filter
  matching on eth_src\n 3. Sending a packet through AF_PACKET\n\nSince TUN in L3 mode
  has no link-layer header, mac_header points to\nthe L3 data area. The flow dissector
  reads 12 bytes of uninitialized\nskb memory, which then propagates through fl_set_masked_key()
  and is\nused as a rhashtable lookup key in __fl_lookup(), as reported by KMSAN.\n\
  \nRejecting the filter in the control path (at tc filter add time) is\nnot feasible
  because TC filter blocks can be shared between arbitrary\ndevices -- a filter installed
  on"
