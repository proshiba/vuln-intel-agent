title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix callback service message parsers to pass through -EAGAIN\n\nThe AFS filesystem
  client uses an rxrpc server to listen for callback\nnotifications.  Each callback
  call type handler has a delivery function\nthat parses the incoming request stream,
  and this should return -EAGAIN the\nlast packet hasn't yet been seen, but all currently
  queued received data is\nconsumed.  afs_extract_data() does this, but the -EAGAIN
  return is switched\nto 0 inadvertantly\n\nFix callback service message parsers to
  pass through -EAGAIN"
