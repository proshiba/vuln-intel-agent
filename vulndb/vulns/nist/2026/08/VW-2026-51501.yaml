title: An unauthenticated attacker can send an IMAP ID command with a very large
  number of parameters before logging in, which causes memory and CPU usage to 
  grow disproportionately. The login process can be terminated by the 
  out-of-memory handling, which also terminates all other connections handled by
  the same process. This can cause degradation or denial of service for IMAP 
  logins. Limit the number of connections handled by a single imap-login 
  process. This has a performance impact though. Update to non-vulnerable 
  version. No publicly available exploits are known.
