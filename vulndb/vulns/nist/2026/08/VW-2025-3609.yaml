title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/vmemmap/devdax:
  fix kernel crash when probing devdax devices\n\ncommit 4917f55b4ef9 (\"mm/sparse-vmemmap:
  improve memory savings for\ncompound devmaps\") added support for using optimized
  vmmemap for devdax\ndevices.  But how vmemmap mappings are created are architecture
  specific. \nFor example, powerpc with hash translation doesn't have vmemmap mappings\n\
  in init_mm page table instead they are bolted table entries in the\nhardware page
  table\n\nvmemmap_populate_compound_pages() used by vmemmap optimization code is
  not\naware of these architecture-specific mapping.  Hence allow architecture to\n\
  opt for this feature.  I selected architectures supporting\nHUGETLB_PAGE_OPTIMIZE_VMEMMAP
  option as also supporting this feature.\n\nThis patch fixes the below crash on ppc64.\n\
  \nBUG: Unable to handle kernel data access on write at 0xc00c000100400038\nFaulting
  instruction address: 0xc000000001269d90\nOops: Kernel access of bad area, sig: 11
  [#1]"
