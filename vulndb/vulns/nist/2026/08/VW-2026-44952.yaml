title: "In the Linux kernel, the following vulnerability has been resolved:\n\npinctrl:
  devicetree: don't free uninitialized dev_name on error path\n\ndt_remember_or_free_map()
  duplicates dev_name for each map entry. If\nkstrdup_const() fails, dt_free_map()
  frees dev_name in all num_maps\nentries, including entries that have not been initialized.\n\
  \nSome pinctrl drivers, including pinctrl-imx, allocate the map with\nkmalloc()
  and leave dev_name for the core to initialize. The untouched\nentries therefore
  contain uninitialized data which is passed to\nkfree_const().\n\nReproduced on qemu's
  mcimx6ul-evk (pinctrl-imx) with failslab injection\nwhile binding the pinctrl-consuming
  device, under KASAN:\n\n  BUG: KASAN: double-free in dt_free_map+0x34/0xa4\n  Free
  of addr c425a900 by task init/1\n   kfree from dt_free_map+0x34/0xa4\n   dt_free_map
  from dt_remember_or_free_map+0x184/0x198\n   dt_remember_or_free_map from pinctrl_dt_to_map+0x33c/0x4c8\n\
  \   pinctrl_dt_to_map from create_pinctrl+0x9c/0x5c0\n\nInitialize all dev_"
