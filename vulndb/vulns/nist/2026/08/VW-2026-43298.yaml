title: "Loofah is a general library for manipulating and transforming HTML/XML documents
  and fragments, built on top of Nokogiri. From 2.25.0 until 2.25.2, Loofah::HTML5::Scrub.allowed_uri?
  does not reject javascript: or vbscript: URIs whose scheme is split by semicolon-less
  numeric character references such as &#58, &#9, &#10, or &#13. CGI.unescapeHTML
  leaves these references encoded, so allowed_uri? reports the URL safe even though
  a browser decodes an encoded colon or strips encoded whitespace and executes the
  resulting URI scheme. This issue affects only callers that pass HTML-encoded strings
  directly to allowed_uri?; Loofah's default sanitize() path is not affected. This
  issue is fixed in version 2.25.2."
