title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_misc:
  don't leak the user namespace when the mount fails\n\nbm_get_tree() takes a reference
  to the user namespace and hands it to\nget_tree_keyed() as the sget key. sget_fc()
  moves that reference into\nsb->s_fs_info and clears fc->s_fs_info, so from that
  point on the\nsuperblock owns it and bm_free() doesn't see it anymore.\n\nThe superblock
  drops it in ->put_super(). But generic_shutdown_super()\nonly calls ->put_super()
  from inside the if (sb->s_root) branch, so\nnothing releases it when bm_fill_super()
  fails:\n\n- The kzalloc_obj() failure leaves s_root NULL and the whole branch is\n\
  \  skipped.\n\n- A simple_fill_super() failure in the file loop leaves s_root set,
  but\n  s_op still points at simple_super_operations, which has no\n  ->put_super().
  bm_fill_super() installs s_ops only once\n  simple_fill_super() returned success,
  and installing it earlier\n  wouldn't help either because simple_fill_super() overwrites
  s_op.\n\nEithe"
