title: "Data::MuForm::Localizer versions through 0.05 for Perl execute Perl from a
  message catalog header, reached at an arbitrary path because load_lexicon interpolates
  the language attribute into the catalog filename.\n\nload_lexicon builds the catalog
  path by appending `Messages/$lang.po` to the directory holding Localizer.pm, where
  $lang is the language attribute, with no check that it names a bare locale tag.
  A value holding `../` segments walks out of the message directory, so any readable
  path with a `.po` suffix is loaded. While parsing the catalog, extract_header_msgstr
  takes the `Plural-Forms:` header, prefixes `$` to the bare words nplurals, plural
  and n, and passes the rest verbatim into a string that is evaluated: the nplurals
  form evaluates the header expression immediately, and the plural_code form compiles
  it into a subroutine whose body runs when a plural message is localized. A header
  of `nplurals=2; plural=(system('...'),0);` therefore runs that command as the catalog
  loads. T"
