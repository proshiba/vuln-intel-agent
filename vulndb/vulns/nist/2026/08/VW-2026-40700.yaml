title: "Allocation of Resources Without Limits or Throttling vulnerability in DivvyPayHQ
  absinthe_federation allows an unauthenticated remote attacker to abort the Erlang
  VM via crafted _entities representation keys.\n\nEvery key of every object in the
  representations argument of the federation-mandated _entities field is converted
  with String.to_atom/1 by convert_key/2 in lib/absinthe/federation/schema/entities_field.ex.
  representations is typed as the open-ended _Any scalar, so its keys bypass schema
  coercion and the attacker names them freely. Atoms are never garbage collected and
  the BEAM atom table is hard-capped (about 1,048,576 entries by default), so one
  request carrying tens of thousands of unique keys creates that many permanent atoms
  and a handful of such requests exhausts the table and aborts the node. The impact
  is confined to availability: no data is read or altered, and recovery requires restarting
  the application.\n\nThis issue affects absinthe_federation: from 0.1.0 before 0.9.3."
