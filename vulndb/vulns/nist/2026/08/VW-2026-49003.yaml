title: TIM Flow before 26.0.6 contains an improper authorization vulnerability 
  that allows any authenticated user to submit arbitrary SQL queries to a 
  privileged dashboard Excel export endpoint intended for administrative use 
  only. Attackers can craft and submit unauthorized SQL queries to the export 
  endpoint to retrieve sensitive database contents as a downloadable 
  spreadsheet, bypassing role-based access controls.
