title: "** UNSUPPORTED WHEN ASSIGNED ** Deserialization of Untrusted Data vulnerability
  in Apache Shindig.\n\nThis issue affects Apache Shindig: all versions.\n\nUsers
  with access to the Shindig REST API can send specially-crafted requests to trigger
  arbitrary code execution on the server.\n\nAs this project is retired, we do not
  plan to release a version that fixes this issue. Users are recommended to find an
  alternative or restrict access to the instance to trusted users.\n\nNOTE: This vulnerability
  only affects products that are no longer supported by the maintainer."
