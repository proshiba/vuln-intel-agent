title: "The Tutor LMS  WordPress plugin before 4.0.6 does not validate a stored file
  path before using it to stream media, allowing users with the instructor role to
  read arbitrary files on the server, including files outside the web root.\n\nThe
  readable files include the WordPress configuration file, which exposes the database
  credentials and the authentication keys and salts, so authentication cookies can
  be forged."
