title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmt76:
  mt7921: don't assume adequate headroom for SDIO headers\n\nmt7921_usb_sdio_tx_prepare_skb()
  calls mt7921_usb_sdio_write_txwi() and\nmt7921_skb_add_usb_sdio_hdr(), both of which
  blindly assume that\nadequate headroom will be available in the passed skb. This
  assumption\ntypically is satisfied when the skb was allocated in the net core for\n\
  transmission via the mt7921 netdev (although even that is only an\noptimization
  and is not strictly guaranteed), but the assumption is\nsometimes not satisfied
  when the skb originated in the receive path of\nanother netdev and was passed through
  to the mt7921, such as by the\nbridge layer. Blindly prepending bytes to an skb
  is always wrong.\n\nThis commit introduces a call to skb_cow_head() before the call
  to\nmt7921_usb_sdio_write_txwi() in mt7921_usb_sdio_tx_prepare_skb() to\nensure
  that at least MT_SDIO_TXD_SIZE + MT_SDIO_HDR_SIZE bytes can be\npushed onto the
  skb.\n\nWithout this fix, I can"
