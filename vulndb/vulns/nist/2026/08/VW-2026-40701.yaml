title: ZenML 0.94.6 contains a remote code execution vulnerability in the 
  CloudpickleMaterializer component that allows attackers with write access to a
  shared artifact store to execute arbitrary code by planting a malicious pickle
  file. Attackers can replace a stored artifact.pkl file with a crafted 
  cloudpickle payload containing a malicious __reduce__ method, which executes 
  arbitrary system commands when any user or pipeline materializes the artifact 
  through the unsanitized cloudpickle.load() call in 
  cloudpickle_materializer.py.
