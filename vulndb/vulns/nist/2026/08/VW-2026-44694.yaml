title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/dma-iommu:
  Fix wrong scatterlist length assignment in P2PDMA path\n\nIn iommu_dma_map_sg(),
  when handling PCI P2PDMA cases, the DMA length\nof the current scatterlist segment
  `s` is incorrectly assigned from the\nhead entry `sg->length` instead of the current
  entry `s->length`.\n\nThis typo causes all P2PDMA segments in the scatterlist to
  inherit the\nlength of the first segment, leading to corrupted DMA lengths for multi-\n\
  segment scatterlists.\n\nFix this by using `s->length` instead of `sg->length`."
