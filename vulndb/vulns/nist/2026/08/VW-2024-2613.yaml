title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/thp:
  fix deferred split unqueue naming and locking\n\nRecent changes are putting more
  pressure on THP deferred split queues:\nunder load revealing long-standing races,
  causing list_del corruptions,\n\"Bad page state\"s and worse (I keep BUGs in both
  of those, so usually\ndon't get to see how badly they end up without).  The relevant
  recent\nchanges being 6.8's mTHP, 6.10's mTHP swapout, and 6.12's mTHP swapin,\n\
  improved swap allocation, and underused THP splitting.\n\nBefore fixing locking:
  rename misleading folio_undo_large_rmappable(),\nwhich does not undo large_rmappable,
  to folio_unqueue_deferred_split(),\nwhich is what it does.  But that and its out-of-line
  __callee are mm\ninternals of very limited usability: add comment and WARN_ON_ONCEs
  to\ncheck usage; and return a bool to say if a deferred split was unqueued,\nwhich
  can then be used in WARN_ON_ONCEs around safety checks (sparing\ncallers the arcane
  conditionals in __folio"
