  allowing high privilege users such as administrators to conduct PHP Object 
  Injection. The affected feature is a free add-on which is disabled by default,
  and no POP chain is present in the User Profile Builder  WordPress plugin 
  before 4.0.1 itself, so further impact requires a suitable gadget from another
  installed User Profile Builder  WordPress plugin before 4.0.1 or .
