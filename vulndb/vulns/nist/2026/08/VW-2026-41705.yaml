title: A flaw was found in the RHOAI training-operator. This vulnerability 
  allows a user with standard edit or admin roles in any Kubernetes namespace to
  escalate their privileges. Through the creation of training jobs, an attacker 
  can impersonate service accounts, access the host filesystem, and potentially 
  execute arbitrary code remotely. This issue arises from the aggregation of 
  training job permissions onto native Kubernetes edit and admin ClusterRoles, 
  coupled with unrestricted PodTemplateSpec passthrough.
