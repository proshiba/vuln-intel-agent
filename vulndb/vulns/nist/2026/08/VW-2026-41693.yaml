title: A flaw was found in the Data Science Pipelines Operator. This 
  vulnerability allows an unauthenticated attacker to derive sensitive 
  credentials, such as MariaDB root/user passwords and MinIO access/secret keys,
  if they can access the MinIO Route or MariaDB Service. The flaw occurs because
  the operator uses a cryptographically weak pseudo-random number generator 
  (PRNG) to generate these credentials, making them predictable. Successful 
  exploitation could lead to unauthorized access to all pipeline artifacts and 
  metadata, resulting in significant information disclosure.
