title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet:
  fix a possible leak when destroy a ctrl during qp establishment\n\nIn nvmet_sq_destroy
  we capture sq->ctrl early and if it is non-NULL we\nknow that a ctrl was allocated
  (in the admin connect request handler)\nand we need to release pending AERs, clear
  ctrl->sqs and sq->ctrl\n(for nvme-loop primarily), and drop the final reference
  on the ctrl.\n\nHowever, a small window is possible where nvmet_sq_destroy starts
  (as\na result of the client giving up and disconnecting) concurrently with\nthe
  nvme admin connect cmd (which may be in an early stage). But *before*\nkill_and_confirm
  of sq->ref (i.e. the admin connect managed to get an sq\nlive reference). In this
  case, sq->ctrl was allocated however after it was\ncaptured in a local variable
  in nvmet_sq_destroy.\nThis prevented the final reference drop on the ctrl.\n\nSolve
  this by re-capturing the sq->ctrl after all inflight request has\ncompleted, where
  for sure sq->ctrl reference "
