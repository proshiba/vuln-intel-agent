title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  Hold a dma-buf reference for imported BOs\n\nAn imported dma-buf BO is created as
  a ttm_bo_type_sg BO whose\nreservation object is the exporter's dma_buf->resv. The
  importer,\nhowever, only takes a dma-buf reference after a successful\ndma_buf_dynamic_attach().
  Until then nothing keeps the exporter alive,\nso if the exporter is freed while
  the BO still references its resv, a\nlater access to that resv is a use-after-free:\n\
  \n  Oops: general protection fault, probably for non-canonical address\n       \
  \ 0x6b6b6b6b6b6b6b9c\n  Workqueue: ttm ttm_bo_delayed_delete [ttm]\n  RIP: 0010:mutex_can_spin_on_owner+0x3f/0xc0\n\
  \nThis can be reached on two paths:\n\n - dma_buf_dynamic_attach() fails, or\n -
  ttm_bo_init_reserved() fails during BO creation.\n\nIn both cases the BO already
  has bo->base.resv pointing at the exporter\nresv, and sg BOs are always torn down
  via ttm_bo_delayed_delete(), which\nlocks bo->base.resv asynchronously - potenti"
