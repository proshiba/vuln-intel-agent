title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, database backup and restore command builders in 
  packages/server/src/utils/backups/utils.ts and 
  packages/server/src/utils/restore/utils.ts interpolate database names, 
  usernames, and passwords into nested shell command strings passed to 
  child_process.exec(). An authenticated administrator with permission to create
  databases and configure backups can use crafted database configuration fields 
  to execute arbitrary commands inside PostgreSQL, MariaDB, MySQL, MongoDB, or 
  LibSQL containers, exposing database data and credentials and potentially 
  enabling escape when a container is overprivileged. This issue is fixed in 
  version 0.29.13.
