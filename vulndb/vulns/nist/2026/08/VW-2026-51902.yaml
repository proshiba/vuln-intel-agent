title: A vulnerability was identified in NASA cFS up to 7.0.1. Impacted is the 
  function OS_read of the file modules/protocol/tcp/fsw/src/sbn_tcp_if.c of the 
  component SBN TCP Module. Such manipulation of the argument MsgSz leads to 
  buffer overflow. The attack must be carried out from within the local network.
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
