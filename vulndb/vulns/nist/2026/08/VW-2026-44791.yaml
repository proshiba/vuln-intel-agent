title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1,raid10:
  fix error-path detection with md_cloned_bio()\n\nDetect the error path using md_cloned_bio()
  instead of relying\non r1_bio in raid1 or r10_bio->read_slot in raid10, which may
  be\nNULL or -1 after splitting and resubmitting a failed bio.\n\nAs a result, the
  error path may not be recognized and memory\nallocations can incorrectly use GFP_NOIO
  instead of\n(GFP_NOIO | __GFP_HIGH), which can lead to a deadlock under\nmemory
  pressure."
