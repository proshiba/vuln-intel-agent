title: The AutomatorWP – Automator plugin for no-code automations, webhooks & 
  custom integrations in WordPress plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 5.8.4. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to retrieve all ConvertKit form data 
  configured by the site's manager account, exposing integration details 
  intended to be restricted to plugin managers. The required nonce is localized 
  on every admin page load, making it accessible to any authenticated user who 
  can reach /wp-admin.
