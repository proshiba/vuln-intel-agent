title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkernfs:
  fix xattr race condition with multiple superblocks\n\nMultiple superblocks with
  different namespaces can share the same\nkernfs_node when kernfs_test_super() finds
  a matching root but\ndifferent namespace. This means multiple inodes from different\n\
  superblocks can reference the same kernfs_node->iattr->xattrs\nstructure.\n\nThe
  VFS layer only holds per-inode locks during xattr operations,\nwhich is insufficient
  to serialize concurrent xattr modifications on\nthe shared kernfs_node. This can
  lead to race conditions in\nsimple_xattr_set() where the lookup->replace/remove
  sequence is not\natomic with respect to operations from other superblocks.\n\nFix
  this by protecting xattr operations with the existing hashed\nkernfs_locks->open_file_mutex[]
  array, which is already used to\nprotect per-node open file data. The hashed mutex
  array provides\nscalable per-node serialization (scaled by CPU count, up to 1024
  locks\non 32+ CPU systems"
