title: Discourse is an open-source discussion platform. Prior o 2026.1.6, 
  2026.5.2, 2026.6.1, and 2026.7.0, users who were allowed to view a group’s 
  activity, but were not permitted to see shared drafts, could still receive 
  shared-draft entries through the group posts and group mentions endpoints. 
  This could disclose shared-draft topic titles and post excerpt/content, 
  resulting in an information disclosure of unpublished draft material. This 
  issue is fixed in versions 2026.1.6, 2026.5.2, 2026.6.1, and 2026.7.0.
