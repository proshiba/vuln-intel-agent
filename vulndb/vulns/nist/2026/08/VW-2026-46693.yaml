title: 'Vulnerability in the Oracle Hyperion Calculation Manager product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows unauthenticated attacker with network
  access via HTTP to compromise Oracle Hyperion Calculation Manager.  Successful attacks
  of this vulnerability can result in  unauthorized creation, deletion or modification
  access to critical data or all Oracle Hyperion Calculation Manager accessible data
  as well as  unauthorized read access to a subset of Oracle Hyperion Calculation
  Manager accessible data and unauthorized ability to cause a partial denial of service
  (partial DOS) of Oracle Hyperion Calculation Manager. CVSS 3.1 Base Score 7.0 (Confidentiality,
  Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L).'
