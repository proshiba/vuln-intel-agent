title: "A remote code execution vulnerability exists when the Windows Print Spooler
  service improperly performs privileged file operations. An attacker who successfully
  exploited this vulnerability could run arbitrary code with SYSTEM privileges. An
  attacker could then install programs; view, change, or delete data; or create new
  accounts with full user rights.\nUPDATE August 10, 2021: Microsoft has completed
  the investigation and has released security updates to address this vulnerability.
  Please see the Security Updates table for the applicable update for your system.
  We recommend that you install these updates immediately. This security update changes
  the Point and Print default behavior; please see KB5005652."
