title: "Authorization Bypass Through User-Controlled Key in the transaction save endpoint
  in Roskus\nProspero Flow CRM 4.9.1 through 5.14.0 allows a user with transaction
  and accounting\ncreation permissions to disclose another company's bank account
  name, bank name and card\nlast four digits via a bank_account_id or bank_card_id
  belonging to that company in POST\n/transaction/save, which is persisted and rendered
  without any company ownership check."
