title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  use parsed transport offset in SCTP state lookup\n\nset_sctp_state() reads the SCTP
  chunk header again in order to drive the\nIPVS SCTP state table. For IPv6 it computes
  the offset with\nsizeof(struct ipv6hdr), while the surrounding IPVS code uses iph.len
  from\nip_vs_fill_iph_skb(), where ipv6_find_hdr() has already skipped\nextension
  headers and found the real transport header.\n\nThis makes the state machine read
  from the wrong offset for IPv6 SCTP\npackets that carry extension headers. For example,
  an INIT packet with an\n8-byte destination options header can be scheduled correctly
  by\nsctp_conn_schedule(), but set_sctp_state() reads the first byte of the\nSCTP
  verification tag as a DATA chunk type. The connection then moves\nfrom NONE to ESTABLISHED
  instead of INIT1, gets the longer established\ntimeout, and updates the active/inactive
  destination counters\nincorrectly. This happens even though the SCTP handshake has
  not\nc"
