title: Craftplan before 0.5.1 contains a broken access control vulnerability 
  that allows unauthenticated attackers to read sensitive credentials by 
  exploiting an unconditional authorization policy on the Settings resource. 
  Attackers can send a GET request to the settings API endpoint with a valid 
  record ID to retrieve decrypted SMTP passwords, email API keys, and email API 
  secrets due to the read policy using an always-allow authorization check that 
  bypasses all identity verification.
