title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip_gre:
  test csum_start instead of transport header\n\nGRE with TUNNEL_CSUM will apply local
  checksum offload on\nCHECKSUM_PARTIAL packets.\n\nipgre_xmit must validate csum_start
  after an optional skb_pull,\nelse lco_csum may trigger an overflow. The original
  check was\n\n\tif (csum && skb_checksum_start(skb) < skb->data)\n\t\treturn -EINVAL;\n\
  \nThis had false positives when skb_checksum_start is undefined:\nwhen ip_summed
  is not CHECKSUM_PARTIAL. A discussed refinement\nwas straightforward\n\n\tif (csum
  && skb->ip_summed == CHECKSUM_PARTIAL &&\n\t    skb_checksum_start(skb) < skb->data)\n\
  \t\treturn -EINVAL;\n\nBut was eventually revised more thoroughly:\n- restrict the
