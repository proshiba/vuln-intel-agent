title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ufs: core: Fix device management cmd timeout flow\n\nIn the UFS error handling flow,
  the host will send a device management cmd\n(NOP OUT) to the device for link recovery.
  If this cmd times out and\nclearing the doorbell fails, ufshcd_wait_for_dev_cmd()
  will do nothing and\nreturn. hba->dev_cmd.complete struct is not set to NULL.\n\n\
  When this happens, if cmd has been completed by device, then we will call\ncomplete()
  in __ufshcd_transfer_req_compl(). Because the complete struct is\nallocated on the
  stack, the following crash will occur:\n\n  ipanic_die+0x24/0x38 [mrdump]\n  die+0x344/0x748\n\
  \  arm64_notify_die+0x44/0x104\n  do_debug_exception+0x104/0x1e0\n  el1_dbg+0x38/0x54\n\
  \  el1_sync_handler+0x40/0x88\n  el1_sync+0x8c/0x140\n  queued_spin_lock_slowpath+0x2e4/0x3c0\n\
  \  __ufshcd_transfer_req_compl+0x3b0/0x1164\n  ufshcd_trc_handler+0x15c/0x308\n\
  \  ufshcd_host_reset_and_restore+0x54/0x260\n  ufshcd_reset_and_restore+0x28c/0x57c\n\
  \  ufshcd"
