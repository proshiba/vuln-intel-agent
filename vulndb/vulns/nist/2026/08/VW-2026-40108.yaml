title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: drain bus_reset work on device removal\n\nbrcmf_fw_crashed() and the debugfs
  \"reset\" entry both schedule\ndrvr->bus_reset, whose callback recovers drvr through
  container_of()\nand dereferences it.  The removal path frees drvr (brcmf_free ->\n\
  wiphy_free) without draining the work, so a bus_reset callback pending\nor running
  during removal can outlive drvr.\n\nCancellation cannot live in brcmf_detach() or
  brcmf_free(): the work\ncallback reaches teardown through the bus .reset op (PCIe\n\
  brcmf_pcie_reset -> brcmf_detach; SDIO brcmf_sdio_bus_reset ->\nbrcmf_sdiod_remove
  -> brcmf_free), so cancelling there would wait for\nthe running work and deadlock.\n\
  \nAdd a per-bus mutex (bus_reset_lock) and route all arming through\nbrcmf_bus_schedule_reset(),
  which under the lock skips when the bus is\nmarked removing.  Each bus remove entry
