title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  dma-axi-dmac: use DMA pool to manange DMA descriptor\n\nFor architectures like Microblaze
  or arm64 (where this IP is used),\nDMA_DIRECT_REMAP is set which means that dma_alloc_coherent()
  might\nremap (and hence vmalloc()) some memory. This became visible in a design\n\
  where dma_direct_use_pool() is not possible.\n\nWith the above, when calling dma_free_coherent(),
  vunmap() would be\ncalled from softirq context and thus leading to a BUG().\n\n\
  To fix it, use a dma pool that is allocated in\n.device_alloc_chan_resources() and
  allocate blocks from it. The key\npoint is that now dma_pool_free() is used in axi_dmac_free_desc()
  to\nfree the blocks and that just frees the blocks from the pool in the\nsense they
  can be used again. In other words, no actual call to\ndma_free_coherent() happens.
  That only happens when destroying the pool\nin axi_dmac_free_chan_resources() which
  does not happen in any interrupt\ncontext."
