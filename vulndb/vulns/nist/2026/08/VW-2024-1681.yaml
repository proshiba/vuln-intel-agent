title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  fix reference counting on zcrypt card objects\n\nTests with hot-plugging crytpo
  cards on KVM guests with debug\nkernel build revealed an use after free for the
  load field of\nthe struct zcrypt_card. The reason was an incorrect reference\nhandling
  of the zcrypt card object which could lead to a free\nof the zcrypt card object
  while it was still in use.\n\nThis is an example of the slab message:\n\n    kernel:
  0x00000000885a7512-0x00000000885a7513 @offset=1298. First byte 0x68 instead of 0x6b\n\
  \    kernel: Allocated in zcrypt_card_alloc+0x36/0x70 [zcrypt] age=18046 cpu=3 pid=43\n\
  \    kernel:  kmalloc_trace+0x3f2/0x470\n    kernel:  zcrypt_card_alloc+0x36/0x70
  [zcrypt]\n    kernel:  zcrypt_cex4_card_probe+0x26/0x380 [zcrypt_cex4]\n    kernel:\
  \  ap_device_probe+0x15c/0x290\n    kernel:  really_probe+0xd2/0x468\n    kernel:\
  \  driver_probe_device+0x40/0xf0\n    kernel:  __device_attach_driver+0xc0/0x140\n\
  \    kernel:  bus_for_each_drv"
