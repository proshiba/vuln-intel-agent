title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm
  thin metadata: fix metadata snapshot consistency on commit failure\n\n__reserve_metadata_snap()
  and __release_metadata_snap() modify the\nsuperblock's held_root directly in the
  block_manager's buffer. If the\nsubsequent metadata commit fails, the held_root
  gets flushed to disk\nthrough the abort_transaction path, resulting in inconsistent
  metadata.\n\nReproducer 1: __reserve_metadata_snap()\n\n1. Create a 2 MiB metadata
  device and make the region after the 14th\n   block inaccessible, to trigger metadata
  commit failure in the\n   subsequent reserve_metadata_snap operation. The 14th block
  will be\n   the shadow destination for the index block.\n\ndmsetup create tmeta
  --table \"0 112 linear /dev/sdc 0\n112 3984 error\"\n\n2. Create a 16 MiB thin-pool\n\
  \ndmsetup create tdata --table \"0 32768 zero\"\ndd if=/dev/zero of=/dev/mapper/tmeta
  bs=4k count=1\ndmsetup create tpool --table \"0 32768 thin-pool /dev/mapper/tmeta
  \\\n/dev/mapper/tdata 128 0 "
