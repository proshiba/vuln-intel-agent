title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  Fix memory leak in devm_clk_notifier_register()\n\ndevm_clk_notifier_register()
  allocates a devres resource for clk\nnotifier but didn't register that to the device,
  so the notifier didn't\nget unregistered on device detach and the allocated resource
  was leaked.\n\nFix the issue by registering the resource through devres_add().\n\
  \nThis issue was found with kmemleak on a Chromebook."
