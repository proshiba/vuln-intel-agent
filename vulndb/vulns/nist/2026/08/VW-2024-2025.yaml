title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  virtio: fix completion handling\n\nThe driver currently assumes that the notify
  callback is only received\nwhen the device is done with all the queued buffers.\n\
  \nHowever, this is not true, since the notify callback could be called\nwithout
  any of the queued buffers being completed (for example, with\nvirtio-pci and shared
  interrupts) or with only some of the buffers being\ncompleted (since the driver
  makes them available to the device in\nmultiple separate virtqueue_add_sgs() calls).\n\
  \nThis can lead to incorrect data on the I2C bus or memory corruption in\nthe guest
  if the device operates on buffers which are have been freed by\nthe driver.  (The
  WARN_ON in the driver is also triggered.)\n\n BUG kmalloc-128 (Tainted: G      \
  \  W        ): Poison overwritten\n First byte 0x0 instead of 0x6b\n Allocated in
  i2cdev_ioctl_rdwr+0x9d/0x1de age=243 cpu=0 pid=28\n \tmemdup_user+0x2e/0xbd\n \t\
  i2cdev_ioctl_rdwr+0x9d/0x1de\n \ti2cdev_ioctl+0x247/"
