title: NetworkManager did not apply the private_user restriction to the 
  802-1x.ca-path and phase2-ca-path directory-valued connection properties. This
  incomplete fix for CVE-2025-9615 allows an unprivileged local user to point a 
  private WPA-Enterprise (802.1X) connection profile's CA path at an 
  attacker-controlled directory, bypassing server certificate validation and 
  enabling credential theft via a rogue access point.
