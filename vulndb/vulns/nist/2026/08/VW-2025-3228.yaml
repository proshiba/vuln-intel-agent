title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngtp:
  Fix use-after-free in __gtp_encap_destroy().\n\nsyzkaller reported use-after-free
  in __gtp_encap_destroy(). [0]\n\nIt shows the same process freed sk and touched
  it illegally.\n\nCommit e198987e7dd7 (\"gtp: fix suspicious RCU usage\") added lock_sock()\n\
  and release_sock() in __gtp_encap_destroy() to protect sk->sk_user_data,\nbut release_sock()
  is called after sock_put() releases the last refcnt.\n\n[0]:\nBUG: KASAN: slab-use-after-free
  in instrument_atomic_read_write include/linux/instrumented.h:96 [inline]\nBUG: KASAN:
  slab-use-after-free in atomic_try_cmpxchg_acquire include/linux/atomic/atomic-instrumented.h:541
  [inline]\nBUG: KASAN: slab-use-after-free in queued_spin_lock include/asm-generic/qspinlock.h:111
  [inline]\nBUG: KASAN: slab-use-after-free in do_raw_spin_lock include/linux/spinlock.h:186
  [inline]\nBUG: KASAN: slab-use-after-free in __raw_spin_lock_bh include/linux/spinlock_api_smp.h:127
  [inline]\nBUG: KASAN: slab-use"
