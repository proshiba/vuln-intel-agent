title: "Affected versions of Flowintel expose the /my_assignment/user API endpoint
  to any authenticated API user. The endpoint accepts a user_id parameter identifying
  the user whose assignments should be returned, but previously had no role restriction
  beyond general API authentication.\n\n\nAs a result, a lower-privileged authenticated
  user could potentially query another user’s assignment information by supplying
  that user’s identifier.\n\n\nThe fix changes:\n\n\nmethod_decorators = [api_required]\n\
  \n\nto:\n\n\nmethod_decorators = [admin_or_org_admin_required, api_required]\n\n\
  so only administrators or organization administrators can perform cross-user assignment
  queries.\n\nVersion impacted =>3.3.0"
