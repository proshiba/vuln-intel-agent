title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-buf/dma-resv:
  check if the new fence is really later\n\nPreviously when we added a fence to a
  dma_resv object we always\nassumed the the newer than all the existing fences.\n\
  \nWith Jason's work to add an UAPI to explicit export/import that's not\nnecessary
  the case any more. So without this check we would allow\nuserspace to force the
  kernel into an use after free error.\n\nSince the change is very small and defensive
  it's probably a good\nidea to backport this to stable kernels as well just in case
  others\nare using the dma_resv object in the same way."
