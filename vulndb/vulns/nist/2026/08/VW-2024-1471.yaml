title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:emac/emac-mac:
  Fix a use after free in emac_mac_tx_buf_send\n\nIn emac_mac_tx_buf_send, it calls
  emac_tx_fill_tpd(..,skb,..).\nIf some error happens in emac_tx_fill_tpd(), the skb
  will be freed via\ndev_kfree_skb(skb) in error branch of emac_tx_fill_tpd().\nBut
  the freed skb is still used via skb->len by netdev_sent_queue(,skb->len).\n\nAs
  i observed that emac_tx_fill_tpd() haven't modified the value of skb->len,\nthus
  my patch assigns skb->len to 'len' before the possible free and\nuse 'len' instead
  of skb->len later."
