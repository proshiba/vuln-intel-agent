title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  codecs: lpass-tx-macro: Fix enum kcontrol accesses\n\nThe \"DEC0 MODE\" to \"DEC7
  MODE\" controls are enumerated, but\ntx_macro_dec_mode_get() and tx_macro_dec_mode_put()
  access their\nvalue through ucontrol->value.integer.value[0] (a long) instead of\n\
  ucontrol->value.enumerated.item[0] (an unsigned int).\n\nThis same pattern was fixed
  in the sibling drivers by\ncommit bcfe5f76cc40 (\"ASoC: codecs: rx-macro: fix accessing
  array\nout of bounds for enum type\") and\ncommit 0ea5eff7c606 (\"ASoC: codecs:
  va-macro: fix accessing array\nout of bounds for enum type\"), but tx-macro was
  missed.\n\nOn 64-bit kernels built with CONFIG_SND_CTL_DEBUG, the elem value\nsanity
  check catches the 4 bytes written past the enumerated item\nand every read of these
  controls fails with -EINVAL:\n\n  snd-sm8250 sound: control 2:0:0:DEC0 MODE:0: access
  overflow"
