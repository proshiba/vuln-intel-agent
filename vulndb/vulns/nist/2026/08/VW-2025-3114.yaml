title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: Handle lock during peer_id find\n\nath12k_peer_find_by_id() requires that
  the caller hold the\nab->base_lock. Currently the WBM error path does not hold\n\
  the lock and calling that function, leads to the\nfollowing lockdep_assert()in QCN9274:\n\
  \n[105162.160893] ------------[ cut here ]------------\n[105162.160916] WARNING:
  CPU: 3 PID: 0 at drivers/net/wireless/ath/ath12k/peer.c:71 ath12k_peer_find_by_id+0x52/0x60
  [ath12k]\n[105162.160933] Modules linked in: ath12k(O) qrtr_mhi qrtr mac80211 cfg80211
  mhi qmi_helpers libarc4 nvme nvme_core [last unloaded: ath12k(O)]\n[105162.160967]
  CPU: 3 PID: 0 Comm: swapper/3 Tainted: G        W  O       6.1.0-rc2+ #3\n[105162.160972]
  Hardware name: Intel(R) Client Systems NUC8i7HVK/NUC8i7HVB, BIOS HNKBLi70.86A.0056.2019.0506.1527
  05/06/2019\n[105162.160977] RIP: 0010:ath12k_peer_find_by_id+0x52/0x60 [ath12k]\n\
  [105162.160990] Code: 07 eb 0f 39 68 24 74 0a 48 8b 00 48 39 f8 75 f3 31 c0"
