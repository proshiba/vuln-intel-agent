title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/jfs:
  Add check for negative db_l2nbperpage\n\nl2nbperpage is log2(number of blks per
  page), and the minimum legal\nvalue should be 0, not negative.\n\nIn the case of
  l2nbperpage being negative, an error will occur\nwhen subsequently used as shift
  exponent.\n\nSyzbot reported this bug:\n\nUBSAN: shift-out-of-bounds in fs/jfs/jfs_dmap.c:799:12\n\
  shift exponent -16777216 is negative"
