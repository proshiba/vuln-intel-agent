title: "In the Linux kernel, the following vulnerability has been resolved:\n\nintel_th:
  fix MSC output device reference leak\n\nintel_th_output_open() looks up the output
  device with\nbus_find_device_by_devt(), which returns the device with a reference
  that\nmust be dropped after use.\n\ncommit 95fc36a234da (\"intel_th: fix device
  leak on output open()\")\nattempted to drop the reference from intel_th_output_release().
  However,\na successful open replaces file->f_op with the output driver file\noperations
  before returning, so close runs the output driver release\ncallback instead.\n\n\
  For MSC outputs, close runs intel_th_msc_release(), which only removes\nthe per-file
  iterator and does not drop the device reference taken by\nintel_th_output_open().
  Consequently, every successful MSC output open\nleaks one device reference.\n\n\
  Drop the device reference from intel_th_msc_release(), which is the\nrelease path
  actually used for MSC output files. Remove the now-unused\nintel_th_output_release()
  callback from intel_th_out"
