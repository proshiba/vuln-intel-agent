title: "In the Linux kernel, the following vulnerability has been resolved:\n\nptp:
  vmclock: prevent read-only mappings from becoming writable\n\nvmclock_miscdev_mmap()
  rejects writable mappings of the shared vmclock\nABI page with -EROFS, but leaves
  VM_MAYWRITE set.  Userspace can map the\npage read-only and then upgrade it to writable
  with mprotect(), after\nwhich the guest can corrupt the host-written timekeeping
  data (sequence\ncounter, UTC time, TSC offset) that the vmclock ABI defines as read-only.\n\
  \nClear VM_MAYWRITE on the read-only path so the mapping cannot be\nupgraded, as
  i915 does for its read-only objects and as fixed in drm/vc4\n(CVE-2026-68445) and
  drm/panthor (CVE-2024-53071)."
