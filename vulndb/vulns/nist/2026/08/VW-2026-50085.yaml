title: Kimai versions before 2.56.0 fail to restrict the config() Twig function 
  in sandboxed invoice and export templates, allowing administrators to access 
  arbitrary configuration keys. Attackers with admin privileges can upload 
  malicious templates to exfiltrate server-wide secrets including LDAP bind 
  passwords and SAML private keys into invoice or export documents accessible to
  lower-privileged users.
