title: FFmpeg before commit 1c10bcc contains a heap buffer overflow in the RIST 
  protocol reader (libavformat/librist.c). librist_read() ignored its size 
  argument and copied the full received payload length into the caller-provided 
  destination buffer, overflowing it when the payload exceeds the destination 
  size. This is reachable via the async:rist:// URL scheme, where the async 
  wrapper supplies a smaller buffer than the received payload. A remote RIST 
  sender can trigger the overflow by sending a packet whose payload exceeds the 
  caller buffer size.
