title: The Invisible Anti-Spam & CAPTCHA — reCAPTCHA Alternative for All Forms 
  plugin for WordPress is vulnerable to generic SQL Injection via Pattern JSON 
  Keys/Values in all versions up to, and including, 5.1 due to insufficient 
  escaping on the user supplied parameter and lack of sufficient preparation on 
  the existing SQL query. This makes it possible for authenticated attackers, 
  with editor-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database.
