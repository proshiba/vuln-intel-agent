title: The Apple profile generated for the Apple built-in Mail, Calendar and 
  Contacts account to synchronize with HCL Traveler requires the Logon Name and 
  Mail Address to be embedded in them.  The values cannot be changed later on, 
  so the Apple profile generation page asks for those values and reflects them 
  back in the generated Apple profile.  The Apple profile is not usable without 
  additional information and only allows the attacker to attack their own 
  device, but HCL Traveler could at least check that the values submitted and 
  reflected back in the Apple profile are found in the Domino directory entry 
  for the already authenticated user.
