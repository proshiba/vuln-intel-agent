title: MyBB is free and open source forum software. From 1.8.13 until 1.8.40, 
  the installer module does not properly escape user-supplied database 
  configuration values written to the configuration file, resulting in PHP code 
  injection and remote code execution when the installer is available. 
  install/index.php processes the values with addcslashes(), but the $characters
  argument added in MyBB 1.8.13 does not include the backslash character, 
  allowing crafted input to escape the generated PHP string. The uniquely 
  identifying implementation details include introduced in MyBB 1.8.13. This 
  issue is fixed in version 1.8.40.
