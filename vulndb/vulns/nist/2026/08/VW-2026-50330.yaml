title: Midday allows any member of a team to delete it. The delete procedure in 
  apps/api/src/trpc/routers/team.ts authorises the caller with the team-access 
  helper, which returns true for every row in the team-membership table 
  irrespective of the role it records, and the data-layer function it calls 
  re-checks the same helper and nothing else. The neighbouring procedures that 
  remove or update a member in the same router each resolve the caller's role 
  and refuse the request unless it is owner, so the check exists in the file and
  is not applied to deletion. Member is the role an invited user receives, so 
  any invitee can remove the team and every record scoped to it, and the 
  deletion enqueues the cleanup job with the stored bank-connection tokens, 
  which the job then uses against the connected providers. The update procedure 
  in the same router carries no role check either.
