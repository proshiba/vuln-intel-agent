title: SiYuan before v3.7.4 contains an information disclosure vulnerability in 
  the /api/tag/getTag endpoint that returns tag labels and occurrence counts 
  from password-protected documents to unauthenticated readers. Attackers can 
  enumerate tag vocabulary and internal terminology from password-protected 
  documents by calling the tag endpoint without providing the document's publish
  password.
