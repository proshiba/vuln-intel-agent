title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/xen: Initialize Xen timer only once\n\nAdd a check for existing xen timers before
  initializing a new one.\n\nCurrently kvm_xen_init_timer() is called on every\nKVM_XEN_VCPU_ATTR_TYPE_TIMER,
  which is causing the following ODEBUG\ncrash when vcpu->arch.xen.timer is already
  set.\n\nODEBUG: init active (active state 0)\nobject type: hrtimer hint: xen_timer_callbac0\n\
  RIP: 0010:debug_print_object+0x16e/0x250 lib/debugobjects.c:502\nCall Trace:\n__debug_object_init\n\
  debug_hrtimer_init\ndebug_init\nhrtimer_init\nkvm_xen_init_timer\nkvm_xen_vcpu_set_attr\n\
  kvm_arch_vcpu_ioctl\nkvm_vcpu_ioctl\nvfs_ioctl"
