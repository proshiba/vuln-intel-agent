title: FreeRDP before 3.29.0 contains a null pointer dereference vulnerability 
  in smartcard device control request cleanup when reader-state decoding fails. 
  Attackers can send malformed smartcard IRP requests with non-zero cReaders and
  truncated reader-state data to crash the process via null pointer access in 
  free_reader_states functions.
