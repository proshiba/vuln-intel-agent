title: "The LoRaWAN Fragmented Data Block Transport service (subsys/lorawan/services/frag_transport.c)
  does not validate the fragment counter in a received DATA_FRAGMENT command before
  forwarding it to the configured decoder. In frag_transport_package_callback() the
  value frag_counter = hdr->frag_index_n & 0x3FFF is taken directly from the downlink
  payload and passed to the decoder, which derives an array index and flash offset
  as frag_counter - 1. DataFragment fragments are 1-indexed, so a frag_counter of
  0 underflows that arithmetic.\n\nWith the default Semtech/LoRaMAC-node decoder,
  this reaches FragDecoder.FragNbMissingIndex[fragCounter - 1] = 0; in FragDecoderProcess(),
  where fragCounter - 1 evaluates to -1 and writes a uint16_t zero out of bounds,
  just before the array and into the adjacent MatrixM2B recovery-matrix state of the
  static decoder object (CWE-787). A companion write derives a wild flash offset,
  but that path is rejected by the flash_area_write() bounds check. The in-tree low-me"
