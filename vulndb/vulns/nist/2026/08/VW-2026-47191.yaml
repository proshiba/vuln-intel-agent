title: MyBooks is an ebook management web server also known as Talebook. In 
  3.41.2 and earlier, the AdminSettings.post handler for POST 
  /api/admin/settings in webserver/handlers/admin.py applies the auth decorator 
  but does not check the self.admin_user property, unlike the corresponding GET 
  handler. Any authenticated regular user can therefore overwrite server 
  configuration values including SMTP credentials, OAuth client secrets, storage
  paths, security feature flags, and autoreload settings. The 
  process_auth_header function in webserver/handlers/base.py also fails to 
  verify the matched account's active flag, allowing a registered but 
  unactivated account to authenticate and reach the vulnerable handler. 
  Exploitation can disclose secrets through configuration access paths, sabotage
  application behavior, force service restarts, and supply the settings needed 
  for related code-injection attacks. This issue is fixed in version 3.42.0.
