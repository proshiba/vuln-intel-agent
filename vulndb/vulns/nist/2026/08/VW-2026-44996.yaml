title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrds:
  tcp: hold the RCU lock across ipv6_chk_addr() in rds_tcp_laddr_check()\n\nrds_tcp_laddr_check()
  looks up a scoped IPv6 interface with\ndev_get_by_index_rcu(), drops the RCU read-side
  lock, and only then\npasses the bare struct net_device * into ipv6_chk_addr().\n\
  \ndev_get_by_index_rcu() only keeps the device alive within the same RCU\nread-side
  section. After rcu_read_unlock(), a concurrent RTM_DELLINK can\nfree the net_device;
  ipv6_chk_addr() then dereferences the stale pointer\nin __ipv6_chk_addr_and_flags()
  (e.g. l3mdev_master_dev_rcu(dev)), reading\nfreed memory.\n\nKeep the RCU read-side
  lock held across the ipv6_chk_addr() call instead\nof dropping it right after the
  lookup, so the device cannot be freed\nwhile it is in use.\n\n  BUG: KASAN: slab-use-after-free
  in __ipv6_chk_addr_and_flags (... net/ipv6/addrconf.c:1998)\n  Read of size 8 at
  addr ffff8880106ec000 by task exploit/153\n  Call Trace:\n   ...\n   kasan_report
  (mm/k"
