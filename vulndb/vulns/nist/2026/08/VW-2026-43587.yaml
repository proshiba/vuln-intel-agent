title: rsync before 3.5.0 contains a filter rule bypass vulnerability that 
  allows authenticated clients to override module-level filter restrictions by 
  supplying malicious --filter merge file directives. Attackers can inject 
  client-side merge file directives during filter evaluation to introduce rules 
  that supersede daemon module-level restrictions, gaining access to files the 
  module filter was intended to exclude.
