title: Dolibarr before 24.0.0 contains a reflected cross-site scripting 
  vulnerability in the extra fields administration template where the type 
  request parameter is echoed without JavaScript-context encoding into an inline
  script block and no Content-Security-Policy header is emitted. An 
  unauthenticated attacker can cause an authenticated administrator to open a 
  crafted URL to execute arbitrary JavaScript in that session and create a 
  persistent administrator account.
