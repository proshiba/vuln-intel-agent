title: rclone versions before v1.75.0 fail to reject transport downgrades in 
  redirect handling, allowing Basic authorization and Cookie headers to be 
  replayed over plaintext HTTP after same-host HTTPS-to-HTTP redirects. An 
  on-path attacker observing the plaintext hop can capture and reuse credentials
  to perform WebDAV operations with the compromised account's permissions.
