title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  mediatek: mt8183: Release reserved memory on cleanup\n\nThe MT8183 AFE probe can
  assign reserved memory with\nof_reserved_mem_device_init(), but the assignment is
  never released on\ndriver removal or later probe failures.\n\nRegister a devm cleanup
  action so the reserved memory assignment is\nreleased consistently, matching newer
  Mediatek AFE drivers."
