title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wcn36xx: fix OOB read from short trigger BA firmware response\n\nThe firmware response
  length is only checked against sizeof(*rsp) (20\nbytes), but when candidate_cnt
  >= 1, a 22-byte candidate struct is read\nat buf + 20 without verifying the response
  contains it. This causes an\nout-of-bounds read of stale heap data, corrupting the
  BA session state.\n\nAdd validation that the response includes the candidate data."
