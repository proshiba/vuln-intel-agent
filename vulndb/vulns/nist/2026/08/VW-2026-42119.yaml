title: TypeBot is a chatbot builder tool. In version 3.16.1, API tokens (bearer 
  credentials used to authenticate against the builder API) are stored in the 
  database as cleartext strings. An attacker who gains read access to the 
  database (e.g., via SQL injection, backup exposure, or insider access) can 
  extract all API tokens and impersonate any user without requiring a password 
  or multi-factor authentication. Version 3.17.0 fixes the issue.
