title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: ti: am65-cpsw: Fix NULL dereference on XDP_TX\n\nIf number of TX queues
  are set to 1 we get a NULL pointer\ndereference during XDP_TX.\n\n~# ethtool -L
  eth0 tx 1\n~# ./xdp-trafficgen udp -A <ipv6-src> -a <ipv6-dst> eth0 -t 2\nTransmitting
  on eth0 (ifindex 2)\n[  241.135257] Unable to handle kernel NULL pointer dereference
  at virtual address 0000000000000030\n\nFix this by using actual TX queues instead
  of max TX queues\nwhen picking the TX channel in am65_cpsw_ndo_xdp_xmit()."
