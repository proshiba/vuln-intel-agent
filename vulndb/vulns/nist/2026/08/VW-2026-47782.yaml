title: A security flaw has been discovered in liftoff-sr CIPster 
  1802525be27d33e19a9a83c163e331a1d13b1892. The impacted element is the function
  CipAttribute::GetAttrData/CipAttribute::SetAttrData of the file ciptypes.h of 
  the component Generic Attribute Logic. Performing a manipulation results in 
  memory corruption. It is possible to initiate the attack remotely. The exploit
  has been released to the public and may be used for attacks. The patch is 
  named e745d9d4a8ca3a13689066983a1269fe1e567674. It is suggested to install a 
  patch to address this issue.
