title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvdimm/btt:
  Free arenas on btt_init() error paths\n\nThe arenas allocated by discover_arenas()
  or create_arenas() are not\nfreed on some error paths in btt_init(). This leaks
  memory when BTT\ninitialization fails.\n\nCall free_arenas() from the affected error
  paths to release the\nallocations.\n\n[ as: commit message and log edits ]"
