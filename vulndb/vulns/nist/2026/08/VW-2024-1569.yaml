title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthermal:
  intel: hfi: Add syscore callbacks for system-wide PM\n\nThe kernel allocates a memory
  buffer and provides its location to the\nhardware, which uses it to update the HFI
  table. This allocation occurs\nduring boot and remains constant throughout runtime.\n\
  \nWhen resuming from hibernation, the restore kernel allocates a second\nmemory
  buffer and reprograms the HFI hardware with the new location as\npart of a normal
  boot. The location of the second memory buffer may\ndiffer from the one allocated
  by the image kernel.\n\nWhen the restore kernel transfers control to the image kernel,
  its HFI\nbuffer becomes invalid, potentially leading to memory corruption if the\n\
  hardware writes to it (the hardware continues to use the buffer from the\nrestore
  kernel).\n\nIt is also possible that the hardware \"forgets\" the address of the
  memory\nbuffer when resuming from \"deep\" suspend. Memory corruption may also occur\n\
  in such a scenario.\n\nTo prev"
