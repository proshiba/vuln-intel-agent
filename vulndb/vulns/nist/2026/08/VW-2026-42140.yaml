title: A flaw was found in the oauth-server component. This open redirect 
  vulnerability occurs when the 'then' parameter in the grant approval handler 
  is not properly validated. A remote attacker can craft a malicious URL that, 
  when approved or denied by an authenticated user, redirects them to an 
  attacker-controlled website. This could enable phishing attacks, potentially 
  tricking users into revealing sensitive information.
