title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  Shut down BO cache timer before teardown\n\nThe BO cache timer callback schedules
  time_work, and time_work can rearm\nthe timer through vc4_bo_cache_free_old().\n\
  \nvc4_bo_cache_destroy() deletes the timer and then cancels the work, which\ndoes
  not break that cycle: the work being cancelled can rearm the timer,\nand the timer
  then queues work again after teardown.\n\nUse timer_shutdown_sync() instead, so
  the timer cannot be rearmed and the\ncycle ends with cancel_work_sync()."
