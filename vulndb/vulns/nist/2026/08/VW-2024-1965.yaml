title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fix out-of-bounds access in ops_init\n\nnet_alloc_generic is called by net_alloc,
  which is called without any\nlocking. It reads max_gen_ptrs, which is changed under
  pernet_ops_rwsem. It\nis read twice, first to allocate an array, then to set s.len,
  which is\nlater used to limit the bounds of the array access.\n\nIt is possible
  that the array is allocated and another thread is\nregistering a new pernet ops,
  increments max_gen_ptrs, which is then used\nto set s.len with a larger than allocated
  length for the variable array.\n\nFix it by reading max_gen_ptrs only once in net_alloc_generic.
  If\nmax_gen_ptrs is later incremented, it will be caught in net_assign_generic."
