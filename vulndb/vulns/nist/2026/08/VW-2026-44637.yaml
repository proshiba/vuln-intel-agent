title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Initialize re_id before removal registration\n\nrpcrdma_create_id() registers ep->re_rn
  with the rpcrdma ib_client\nbefore returning the new rdma_cm_id to rpcrdma_ep_create().
  However\nrpcrdma_ep_create() currently stores that pointer in ep->re_id only\nafter
  rpcrdma_create_id() returns.\n\nA local administrator can race an NFS/RDMA mount
  against RDMA device\nremoval. If rpcrdma_remove_one() observes the just-registered\n\
  notification before rpcrdma_ep_create() assigns ep->re_id,\nrpcrdma_ep_removal_done()
  calls trace_xprtrdma_device_removal(NULL).\nThe tracepoint dereferences id->device->name
  and copies\nid->route.addr.dst_addr, so the callback can crash the kernel with a\n\
  NULL pointer dereference.\n\nStore the rdma_cm_id in ep->re_id immediately before
  publishing\nep->re_rn. The existing error path still destroys the id directly if\n\
  registration fails; ep is then freed by the caller without using\nep->re_id. Remove
  the later"
