title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  accel: mma8452: handle I2C read error(s) in mma8452_read()\n\nCurrently, If i2c_smbus_read_i2c_block_data()
  fails but\nmma8452_set_runtime_pm_state() succeeds, mma8452_read() returns 0.\n\n\
  As a result, the caller mma8452_read_raw() assumes the read was\nsuccessful and
  proceeds to use a buffer containing uninitialized\nstack memory.\n\nAdd proper checking
  of the I2C read return value and propagate errors\nto the caller."
