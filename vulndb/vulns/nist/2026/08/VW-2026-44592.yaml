title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Guard conntrack opts error writes\n\nThe conntrack lookup and allocation kfuncs
  take an opts pointer\ntogether with an opts__sz argument. The verifier checks only
  the memory\nrange described by opts__sz, but the wrappers unconditionally write\n\
  opts->error whenever the internal lookup or allocation helper returns an\nerror.\n\
  \nFor an invalid size smaller than the end of opts->error, that write can\nland
  outside the verifier-checked range. Keep returning NULL for invalid\narguments,
  but only report the error through opts->error when the\nsupplied size includes the
  field.\n\nThis preserves error reporting for the supported 12-byte and 16-byte\n\
  layouts, and for other invalid sizes that still include opts->error."
