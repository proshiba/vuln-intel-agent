title: The extension passes the user-supplied search query parameter to Apache 
  Solr without restricting advanced Solr query syntax such as wildcards, field 
  selectors and range queries. A remote, unauthenticated attacker can use this 
  syntax to enumerate indexed field names and extract their stored values 
  through boolean- and range-based blind extraction techniques, independent of 
  any site-specific configuration.
