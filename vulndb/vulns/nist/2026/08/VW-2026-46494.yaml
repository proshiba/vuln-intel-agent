title: FUXA is a web-based Process Visualization (SCADA/HMI/Dashboard) software.
  In 1.3.2 and earlier, the allowDashboard authorization gate in 
  server/integrations/node-red/index.js calls authJwt.verify for /nodered 
  without inspecting the decoded identity. When nodeRedEnabled is true, 
  secureEnabled is true, and nodeRedAuthMode is secure, a remote unauthenticated
  attacker can obtain a signed guest token from POST /api/heartbeat and use it 
  to access the RED.httpAdmin editor and flow deployment API. Because the 
  Node-RED configuration has no second adminAuth gate, the attacker can deploy 
  function nodes or invoke fuxa.runScript and runtime.scriptsMgr.runScript, 
  gaining control of FUXA project data, configuration, scripts, 
  filesystem-capable runtime helpers, and potentially operating-system commands 
  when nodeRedUnsafeModules is enabled. This issue is fixed in version 1.3.3.
