title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  reject inverted service ranges from peer bindings\n\ntipc_update_nametbl() inserts
  a binding advertised by a peer node using\nthe lower and upper service-range bounds
  taken directly from the wire,\nwithout checking that lower <= upper. The local bind
  path validates the\nordering (tipc_uaddr_valid()), but the name-distribution path
  does not.\n\nA binding with lower > upper is inserted at the far end of the\nservice-range
  rbtree (keyed on lower) where no lookup or withdrawal can\never match it (service_range_foreach_match()
  requires sr->lower <= end).\nThe publication, its service_range node and the augmented
  rbtree entry\nare then leaked for the lifetime of the namespace, and there is no\n\
  per-peer cap equivalent to TIPC_MAX_PUBL on locally created bindings.\n\nReject
  inverted ranges in the network path as well. A peer node can\notherwise leak unbounded
  binding-table memory by sending PUBLICATION\nitems with lower > upper."
