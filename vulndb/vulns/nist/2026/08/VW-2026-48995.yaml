title: "Ransomlook contains a Redis glob pattern injection vulnerability caused by
  insufficient neutralization of user-controlled input before it is incorporated into
  Redis SCAN MATCH patterns.\n\n\nThe /api/health/<name> endpoint attempted to resolve
  the supplied name to a known group or market, but when resolution failed it fell
  back to using the attacker-controlled value directly in a Redis key pattern. An
  unauthenticated attacker could therefore supply Redis glob metacharacters such as
  *, ?, [ or ] to broaden the SCAN operation beyond the intended group. For example,
  requesting /api/health/* could enumerate health information, mirror slugs, and uptime
  series belonging to all groups and markets, including entities marked as private.\n\
  \n\nSimilar unsafe interpolation was present in /api/crypto/chain/<chain> and in
  the delete_manual_torrent() function. The latter represents a potentially destructive
  sink because a crafted infohash containing glob metacharacters could cause the scan
  to match torrent"
