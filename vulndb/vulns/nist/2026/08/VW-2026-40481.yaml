title: Flowise through 3.1.4 contains an insecure direct object reference 
  vulnerability in the OpenAI Assistants integration that allows authenticated 
  attackers to access credentials belonging to other workspaces by supplying an 
  arbitrary credential UUID to Assistants endpoints without workspace ownership 
  verification. Attackers can enumerate cross-workspace assistant metadata, 
  retrieve file and vector store listings, and upload files into victim 
  workspaces by exploiting the missing workspace-scoped authorization check in 
  the credential lookup logic.
