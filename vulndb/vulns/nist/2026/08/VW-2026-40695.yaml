title: Sonatype Nexus Repository 3 did not immediately terminate a user's active
  login session or revoke their cached permissions when that user's account was 
  deleted, deactivated, or had its password changed. A user whose account was 
  already logged in at the time of one of these actions could continue using 
  their existing session to interact with the repository as though the account 
  were still active, until that session independently expired. Depending on the 
  permissions previously held, this could allow continued unauthorized access to
  read, modify, or delete repository content after access was intended to be 
  revoked.
