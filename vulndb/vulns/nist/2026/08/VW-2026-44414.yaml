title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpu:
  host1x: Fix device reference leak in host1x_device_parse_dt() error path\n\nAfter
  device_initialize(), the embedded struct device in struct\nhost1x_device should
  be released through the device core with\nput_device().\n\nIn host1x_device_add(),
  if host1x_device_parse_dt() fails, the current\nerror path frees the object directly
  with kfree(device). That bypasses\nthe normal device lifetime handling and leaks
  the reference held on the\nembedded struct device.\n\nThe issue was identified by
  a static analysis tool I developed and\nconfirmed by manual review.\n\nFix this
  by using put_device() in the host1x_device_parse_dt() failure\npath."
