title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Cancel special fields on map value recycle\n\nMap update and delete paths currently
  call bpf_obj_free_fields() when a\nvalue is being replaced or recycled. That makes
  field destruction depend\non the context of the update/delete operation. For tracing
  programs this\ncan include NMI context, where referenced kptr destructors, uptr\n\
  unpinning, and graph root destruction are not generally safe.\n\nIntroduce bpf_obj_cancel_fields()
  for the reusable-value path. It only\nperforms NMI-safe cleanup for timer, workqueue,
  and task_work fields.\nFields that need full destruction are left attached to the
  recycled value\nand are destroyed by the final cleanup path instead.\n\nSwitch array
  and hashtab update/delete/recycle paths to this cancel\nhelper. Keep bpf_obj_free_fields()
  for final map destruction and for\nbpf_mem_alloc destructors. Preallocated hashtabs
  do not have allocator\ndestructors, so teardown continues to walk the normal and
  e"
