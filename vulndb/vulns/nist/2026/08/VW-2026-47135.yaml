title: phpMyFAQ before 4.1.7 fails to properly enforce CONFIGURATION_EDIT 
  permission on admin API read endpoints for LDAP, Elasticsearch, OpenSearch, 
  and dashboard configuration, allowing any authenticated user to access 
  sensitive administrative data. Attackers can retrieve LDAP server topology, 
  bind account names, search bases, index statistics, and site analytics by 
  calling these endpoints with a valid session.
