title: Phison PS3111-S11 controller firmware verifies RSA signatures using a 
  public modulus embedded within the firmware image itself rather than anchored 
  in immutable storage. Attackers can generate arbitrary RSA key pairs, sign 
  modified firmware with the private key, embed the matching modulus in the 
  signature segment, and the controller accepts the tampered firmware as valid.
