title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  udp_tunnel: prevent double queueing in udp_tunnel_nic_device_sync\n\nYue Sun reported
  a use-after-free and debugobjects warning in\nudp_tunnel_nic_device_sync_work()
  during concurrent device operations.\n\nThe workqueue core clears the internal pending
  bit before invoking the\nworker. At that point, a concurrent thread can queue the
  work again.\nWhen the already running worker eventually clears the work_pending
  flag\nto 0, it mistakenly clears the flag for the newly queued instance.\nudp_tunnel_nic_unregister()
  then observes work_pending as 0 and frees\nthe structure while the second work item
  is still active in the queue,\nleading to UAF.\n\nFix this by returning early in
  udp_tunnel_nic_device_sync() if\nwork_pending is already set, preventing redundant
  work queueing."
