title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  avoid destroy_workqueue(NULL) on vkms init failure\n\nTwo paths through vmw_vkms_init()
  can leave vmw->crc_workq NULL while\nstill leaving the rest of the driver in a state
  that calls\nvmw_vkms_cleanup() at module unload:\n\n  1. vmw_host_get_guestinfo(GUESTINFO_VBLANK,
  ...) failing or\n     returning an oversized buffer -- the common case on hosts\n\
  \     without a VBLANK guestinfo entry -- early-returned before the\n     workqueue
  allocation.\n  2. alloc_ordered_workqueue() returning NULL on memory pressure.\n\
  \nvmw_vkms_cleanup() then calls destroy_workqueue(NULL), which\ndereferences wq->name
  and panics.\n\nFix the first case by removing the early return: vmw->vkms_enabled\n\
  is already false on the rpci-failure path so no work will ever be\nqueued, and allocating
  the workqueue unconditionally keeps the\ncontrol flow simple.  Fix the second case
  by guarding the cleanup\nwith a NULL check, since alloc_ordered_workqueue() can
  s"
