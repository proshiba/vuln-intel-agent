title: FFmpeg before commit acf5d7c contains a heap buffer overflow in the hvcC 
  box writer. When writing an HEVC configuration record with more NAL units of a
  single type than the count field can represent, the NAL unit count overflows, 
  causing a heap buffer overflow. A crafted HEVC input file triggers the 
  overflow during muxing.
