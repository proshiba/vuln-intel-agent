title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  do not arm the ageing timer on a device that is down\n\nvxlan_changelink() arms
  vxlan->age_timer whenever the requested ageing\ninterval differs from the configured
  one:\n\n\tif (conf.age_interval != vxlan->cfg.age_interval)\n\t\tmod_timer(&vxlan->age_timer,
  jiffies);\n\nThere is no netif_running() test, so the timer is armed even on a device\n\
  that was never brought up.  The only synchronous cancel in the driver is\nthe timer_delete_sync()
  in vxlan_stop(), which is .ndo_stop.\nnetif_close_many() drops devices without IFF_UP
  before\n__dev_close_many() runs, so that cancel is skipped for such a device.\n\n\
  vxlan_setup() sets dev->needs_free_netdev = true and age_timer is a\nmember of struct
  vxlan_dev, so free_netdev() releases the allocation the\ntimer lives in while it
  is still queued on a timer_base.\nexpire_timers() unlinks the entry before it loads
  timer->function, so\nthe timer core writes through the freed object's list pointers"
