title: 'Ech0 before 4.7.3 fails to properly revoke access tokens created with never-expire
  option, allowing attackers to maintain perpetual authenticated access after token
  theft. Three independent revocation mechanisms fail: logout panics on nil ExpiresAt
  field, RevokeToken skips when remainTTL is zero, and admin delete does not blacklist
  the JTI, leaving stolen tokens cryptographically valid until JWT secret rotation.'
