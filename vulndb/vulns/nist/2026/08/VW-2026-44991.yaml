title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  reclaim invalid Tx descriptors in ZC batch path\n\nThe zero-copy Tx batch parser
  stops when it encounters an invalid\ndescriptor. If this happens after one or more
  continuation descriptors,\nthe Tx consumer can be advanced past fragments that are
  neither submitted\nto the driver nor returned to userspace through the completion
  ring.\n\nA similar problem occurs when a packet exceeds xdp_zc_max_segs. The\ndescriptors
  consumed up to the limit are released without completion, and\nthe remaining continuation
  descriptors can subsequently be interpreted\nas the beginning of another packet.\n\
