title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  fix integer overflow in tipc_recvmsg() and tipc_recvstream()\n\nIn tipc_recvmsg(),
  the copy length is computed as:\n\n  copy = min_t(int, dlen - offset, buflen);\n\
  \nbuflen is size_t but min_t(int, ...) casts it to int. When buflen\nexceeds INT_MAX
  (e.g. 0xFFFFFFFF via io_uring provided buffers), it\nwraps negative, wins the comparison,
  and the negative copy length\npropagates to simple_copy_to_iter() where int-to-size_t
  promotion\nmakes it SIZE_MAX, triggering a WARN_ON. tipc_recvstream() has the\n\
  same pattern.\n\n  Kernel panic - not syncing: kernel: panic_on_warn set ...\n \
  \ RIP: 0010:simple_copy_to_iter+0x9e/0xd0 (net/core/datagram.c:521)\n  Call Trace:\n\
  \   __skb_datagram_iter+0x123/0x8b0 (net/core/datagram.c:402)\n   skb_copy_datagram_iter+0x77/0x1a0
  (net/core/datagram.c:534)\n   tipc_recvmsg+0x3d7/0xe80 (net/tipc/socket.c:1934)\n\
  \   io_recvmsg+0x47e/0xda0\n\nFix by changing min_t(int, ...) to min_t(size_t, ...)
  in both\nfunctions."
