title: "The Bluetooth host ATT layer (subsys/bluetooth/host/att.c) associates each
  in-flight ATT TX buffer with its owning channel via the static tx_meta_data_storage[]
  array (data->att_chan = chan). When a buffer's last reference is dropped, its net-buf
  destroy callback defers the completion handling to the system workqueue (att_tx_destroy
  -> att_tx_destroy_work_handler -> att_on_sent_cb -> bt_att_sent), where bt_att_sent
  dereferences the channel and its ATT context (sys_slist_get(&att->reqs)).\n\nWhen
  a peer disconnects while an ATT PDU (a server notification/indication or any response)
  is still in flight in the controller TX path, L2CAP tears the channel down in l2cap_chan_del():
  it runs the disconnected callback and then the released callback (bt_att_released),
  which frees the channel slab slot. Because the in-flight buffer is held by the connection
  TX path rather than the channel's own queue, its deferred destroy work can run after
  the channel has been freed. The att_on_sent_cb guard intend"
