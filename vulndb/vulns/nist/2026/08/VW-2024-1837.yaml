title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  synproxy: Fix out of bounds when parsing TCP options\n\nThe TCP option parser in
  synproxy (synproxy_parse_options) could read\none byte out of bounds. When the length
  is 1, the execution flow gets\ninto the loop, reads one byte of the opcode, and
  if the opcode is\nneither TCPOPT_EOL nor TCPOPT_NOP, it reads one more byte, which
  exceeds\nthe length of 1.\n\nThis fix is inspired by commit 9609dad263f8 (\"ipv4:
  tcp_input: fix stack\nout of bounds when parsing TCP options.\").\n\nv2 changes:\n\
  \nAdded an early return when length < 0 to avoid calling\nskb_header_pointer with
  negative length."
