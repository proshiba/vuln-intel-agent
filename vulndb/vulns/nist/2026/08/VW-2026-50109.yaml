title: The WP Fastest Cache – WordPress Cache Plugin plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via HTTP Host Header in all versions
  up to, and including, 1.5.0 due to insufficient input sanitization and output 
  escaping. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. This requires the Polylang or Polylang Pro plugin to be active 
  and the Combine JS option to be enabled, as these conditions trigger the 
  vulnerable Host-header-to-URL code path that writes attacker-controlled script
  src values into the shared page-cache file served to all subsequent visitors.
