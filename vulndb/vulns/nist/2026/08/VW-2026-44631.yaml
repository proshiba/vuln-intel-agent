title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  fix race in unix socket mediation when peer_path is used\n\nThe holding a reference
  to the peer_sk is not enough to ensure access\nto the peer sk path. Accessing the
  path outside of the state lock\nallows for a race with unix_release_sock(). Fix
  this by taking the\nstate lock and getting a reference to the path under lock.\n\
  \nIdeally for connected sockets we would cache this information so we\ndon't have
  to take the lock here. But for now just fix the race."
