title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngeneve:
  validate inner network offset in geneve_gro_complete()\n\nEven with both paths gated
  on gs->gro_hint, geneve_gro_complete()\nre-derives the inner dispatch type and length
  from the packet and the\ncurrent gs->gro_hint, independently of geneve_gro_receive().
  The two can\ndisagree if gs->gro_hint flips under a concurrent geneve_quiesce()/\n\
  geneve_unquiesce() (sk_user_data is NULL across a synchronize_net()), or if\nthe
  re-read option bytes differ from the ones receive parsed.\n\ngeneve_gro_receive()
  already records the inner network header position in\nNAPI_GRO_CB()->inner_network_offset.
  Have geneve_gro_complete() compute the\noffset it is about to dispatch at, adding
  ETH_HLEN in the ETH_P_TEB case\nwhere eth_gro_complete() steps over the inner MAC
  header, and bail out if\nit lands past inner_network_offset.\n\nUse a lower bound
  rather than exact equality: between gh_len and the inner\nL3 header, geneve_gro_receive()
