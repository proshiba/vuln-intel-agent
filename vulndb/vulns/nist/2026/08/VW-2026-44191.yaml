title: "In the Linux kernel, the following vulnerability has been resolved:\n\nllc:
  fix SAP refcount leak in llc_ui_autobind()\n\nllc_ui_autobind() opens a SAP after
  choosing a dynamic LSAP.\nllc_sap_open() returns a reference owned by the caller,
  and\nllc_sap_add_socket() takes a second reference for the socket's\nmembership
  in the SAP hash tables.\n\nllc_ui_bind() drops the caller's reference after adding
  the socket,\nbut llc_ui_autobind() keeps it. When the socket is closed,\nllc_sap_remove_socket()
  releases only the socket reference, leaving\nthe SAP on llc_sap_list with sk_count
  == 0.\n\nThis is user-visible because repeated autobind and close cycles can consume\n\
  all dynamic SAP values and make later autobinds fail with -EUSERS.\n\nDrop the caller's
  reference after a successful autobind, matching\nllc_ui_bind()'s ownership model."
