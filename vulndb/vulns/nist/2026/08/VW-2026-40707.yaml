title: "In versions of the Datadog Android application prior to v541-5.9.2, BubbleChatActivity
  is exported with no permission guard and accepts a SEND intent with a caller-supplied
  conversation_id. When the activity closes and no in-process session matches that
  ID, it unconditionally cancels notification ID 9201 (the Bits AI chat notification),
  with no check on the caller's identity or ownership of the conversation.\r\nThis
  requires a malicious application co-installed on the victim's device.\r\nImpact:
  A co-installed application can silently dismiss the victim's Bits AI chat notification.
  No chat content is exposed; conversation data remains server-authentication gated
  and is never returned to the caller."
