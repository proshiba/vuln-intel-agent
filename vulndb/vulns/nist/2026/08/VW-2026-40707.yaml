title: "BubbleChatActivity in the Datadog Android application is declared android:exported=\"\
  true\" with no permission guard and accepts a SEND intent with mimeType text/plain.
  The activity reads a conversation_id from Intent extras and, on onDestroy, calls
  BubbleChatNotification.dismiss whenever no active in-process session matches the
  caller-supplied conversation_id.\r\nBubbleChatNotification.dismiss unconditionally
  cancels notification ID 9201 — the hard-coded Bits AI chat notification — using
  NotificationManager.cancel, with no validation of the caller's identity or ownership
  of the supplied conversation_id. A zero-permission co-installed application can
  therefore launch BubbleChatActivity with any random conversation_id; when the activity
  is finished, the Bits AI chat notification is cancelled on the victim device.\r\n\
