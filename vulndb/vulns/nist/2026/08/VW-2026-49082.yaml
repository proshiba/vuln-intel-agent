title: Multiple DrayTek VigorSwitch models contain a buffer overflow 
  vulnerability in the sysreboot function. The vulnerability is caused by unsafe
  concatenation of split valueN data into a fixed-size buffer. A remote attacker
  can trigger this vulnerability via crafted input, causing a denial of service 
  or potentially executing arbitrary commands. Exploitation requires valid 
  administrative credentials for the device's web management interface.
