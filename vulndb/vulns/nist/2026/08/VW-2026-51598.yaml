title: A flaw was found in the file-pvr plugin in GIMP. When processing a 
  specially crafted PVR image file, the VQ (compressed) decoder does not 
  properly perform memory bounds checking. This missing validation results in a 
  heap out-of-bounds read. This issue can result in an application crash, 
  leading to a denial of service or a limited information disclosure of heap 
  memory contents.
