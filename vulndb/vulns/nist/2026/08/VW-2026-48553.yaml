title: AVideo through commit 9c39d8c8 contains a cross-site request forgery 
  vulnerability in channelToGallery.json.php that allows attackers to modify 
  site-wide Gallery configuration by performing unauthorized writes to plugin 
  data. Attackers can craft a cross-site GET request carrying an administrator's
  session cookie to promote arbitrary channels to the front page or delete 
  curated sections without token validation.
