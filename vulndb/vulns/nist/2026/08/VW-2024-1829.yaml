title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: fix vlan tunnel dst refcnt when egressing\n\nThe egress tunnel code uses
  dst_clone() and directly sets the result\nwhich is wrong because the entry might
  have 0 refcnt or be already deleted,\ncausing number of problems. It also triggers
  the WARN_ON() in dst_hold()[1]\nwhen a refcnt couldn't be taken. Fix it by using
  dst_hold_safe() and\nchecking if a reference was actually taken before setting the
  dst.\n\n[1] dmesg WARN_ON log and following refcnt errors\n WARNING: CPU: 5 PID:
  38 at include/net/dst.h:230 br_handle_egress_vlan_tunnel+0x10b/0x134 [bridge]\n\
  \ Modules linked in: 8021q garp mrp bridge stp llc bonding ipv6 virtio_net\n CPU:
  5 PID: 38 Comm: ksoftirqd/5 Kdump: loaded Tainted: G        W         5.13.0-rc3+
  #360\n Hardware name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.14.0-1.fc33
  04/01/2014\n RIP: 0010:br_handle_egress_vlan_tunnel+0x10b/0x134 [bridge]\n Code:
  e8 85 bc 01 e1 45 84 f6 74 90 45 31 f6 85 db 4"
