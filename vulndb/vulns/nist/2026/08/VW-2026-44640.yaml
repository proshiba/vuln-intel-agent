title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  prevent potential lcn remains uninitialized\n\nThe target VCN being sought was not
  found within runs[0], causing\nrun_lookup() to return false. This causes run_lookup_entry()
  to return\nfalse, which in turn results in a len value of 0, and the new parameter\n\
  passed to attr_data_get_block() is NULL. Collectively, these factors\nultimately
  cause attr_data_get_block_locked() to exit prematurely without\ninitializing lcn,
  thereby triggering [1].\n\nTo prevent [1], the clen check within ni_seek_data_or_hole()
  has been\nmoved to occur before the lcn check.\n\n[1]\nBUG: KMSAN: uninit-value
  in ni_seek_data_or_hole+0x24f/0x5f0 fs/ntfs3/frecord.c:2862\n ni_seek_data_or_hole+0x24f/0x5f0
  fs/ntfs3/frecord.c:2862\n ntfs_llseek+0x22a/0x4a0 fs/ntfs3/file.c:1530\n vfs_llseek
  fs/read_write.c:391 [inline]"
