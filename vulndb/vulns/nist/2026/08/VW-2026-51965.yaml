title: SiYuan 3.8.0 contains a path traversal / sensitive file exposure 
  vulnerability in the RenderTemplate function (kernel/model/template.go), 
  reachable via the POST /api/template/render endpoint (kernel/api/template.go).
  The endpoint restricts the supplied path only to the workspace directory 
  (util.IsAbsPathInWorkspace) but, unlike the file API's refuseToAccess() 
  blocklist, applies no sensitive-path exclusion. This allows an authenticated 
  attacker to read sensitive workspace files, including conf/conf.json, which 
  contains the API token and cookie signing key. The issue is fixed in v3.8.1.
