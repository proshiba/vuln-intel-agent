title: A missing authorization vulnerability in Windmill Labs Windmill through 
  1.783.0 allows authenticated operators to write job progress and read job 
  metrics for any job in the workspace regardless of ownership. The job_metrics 
  handlers accept no authorization extractor, bypassing workspace-level access 
  controls. An operator can monitor sensitive job execution data and inject 
  misleading progress for jobs they do not own.
