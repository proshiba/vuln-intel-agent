title: A vulnerability was identified in Nikolaibibo claude-comfyui-mcp 1.0.0. 
  Affected is the function copyFileSync of the file src/tools/utils.ts of the 
  component comfy_upload_image. Such manipulation of the argument image_path 
  leads to path traversal. An attack has to be approached locally. The project 
  was informed of the problem early through an issue report but has not 
  responded yet.
