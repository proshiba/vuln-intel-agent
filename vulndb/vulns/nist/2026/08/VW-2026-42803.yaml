title: Ente provides end-to-end encrypted cloud services and security tools. 
  Prior to 2026.07.28, Ente 2of3 card format version 1 stored the secret byte 
  length and 32-bit FNV-1a checksum in cleartext on every card, allowing someone
  with one card to test candidate secrets offline and recover low-entropy or 
  predictable secrets. This issue is fixed in version 2026.07.28.
