title: The WPAdverts – Classifieds Plugin plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 2.3.2. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for unauthenticated attackers to retrieve 
  internal site configuration data exposed by the classifieds-types REST 
  endpoint, including registered post types, labels, associated taxonomies, form
  scheme metadata, contact options, and custom field meta keys.
