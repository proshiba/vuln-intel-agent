title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, sanitizeCommand in packages/server/src/utils/builders/compose.ts only
  trims whitespace and strips surrounding quotes from compose.command before 
  exportEnvCommand and docker command interpolation, allowing an authenticated 
  user who can update a Compose service to inject shell metacharacters and 
  execute arbitrary commands on the Dokploy host. This issue is fixed in version
  0.29.13.
