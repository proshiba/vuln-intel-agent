title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_misc:
  reject a flag character as the field delimiter\n\nThe registration string starts
  with a user chosen delimiter that\nseparates the individual fields. So that the
  field parsers terminate\neven on a truncated string create_entry() pads the buffer
  with that\nsame delimiter:\n\n\tmemset(buf + count, del, 8);\n\nMost fields are
  scanned for the delimiter with strchr()/scanarg() and\nhappily stop on the padding.
  The flags field is different: instead of\nscanning for the delimiter check_special_flags()
  consumes the flag\ncharacters 'P', 'O', 'C' and 'F' and stops at the first byte
  that is\nnone of them, relying on the trailing delimiter to end the scan.\n\nIf
  the delimiter is itself a flag character the padding no longer acts\nas a terminator.
  The scan swallows all eight padding bytes and keeps\nreading past the end of the
  allocation until it hits a byte that is\nnot a flag character. For example registering\n\
  \n\tPaPEPPxPPiP\n\nwith 'P' "
