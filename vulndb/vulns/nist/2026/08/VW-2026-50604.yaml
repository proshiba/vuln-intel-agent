title: Weblate is a web-based continuous localization platform used to manage 
  software translations. In versions prior to 2026.8, Weblate's object-scoped 
  RSS feeds do not apply the permission checks used elsewhere, allowing 
  unauthorized users to read change-history metadata from private projects and 
  restricted components. On installations that permit anonymous access, this 
  metadata can be retrieved without any authentication. The exposed information 
  can include project and component identities, contributor usernames and full 
  names, action types, timestamps, and translation or unit links, though 
  translated-string content is not included in the feed. Installations using 
  private projects or restricted components are affected. This issue is fixed in
  version 2026.8.
