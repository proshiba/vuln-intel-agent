title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  core: port: Deattach Type-C connector on component unbind\n\nconnector_unbind()
  is the mirror of connector_bind(), but it is missing\nthe symmetric call to typec_deattach()
  that connector_bind() makes via:\n\n    if (port_dev->child)\n        typec_attach(port_dev->connector,
  &port_dev->child->dev);\n\nWhen a Thunderbolt dock is unplugged, two teardown paths
  race:\n\n1. The component framework calls connector_unbind() first, which sets\n\
  \   port_dev->connector = NULL without calling typec_deattach().  This\n   leaves
  port->usb2_dev/port->usb3_dev in struct typec_port pointing at\n   the USB device
  that is about to be freed.\n\n2. usb_disconnect() then calls typec_deattach(port_dev->connector,
  ...),\n   but port_dev->connector is already NULL, so the call is a no-op and\n\
  \   port->usb2_dev is never cleared.\n\n3. Concurrently, UCSI detects a PD partner-disconnect
  event and calls\n   typec_unregister_partner(), which reads port->usb2_de"
