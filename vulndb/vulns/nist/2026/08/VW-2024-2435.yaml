title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hns:
  Fix Use-After-Free of rsv_qp on HIP08\n\nCurrently rsv_qp is freed before ib_unregister_device()
  is called\non HIP08. During the time interval, users can still dereg MR and\nrsv_qp
  will be used in this process, leading to a UAF. Move the\nrelease of rsv_qp after
  calling ib_unregister_device() to fix it."
