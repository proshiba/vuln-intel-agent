title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wcn36xx: fix heap overflow from oversized firmware HAL response\n\nThe firmware
  response dispatcher copies all synchronous HAL responses\ninto the 4096-byte hal_buf
  without validating the response length. A\nresponse exceeding WCN36XX_HAL_BUF_SIZE
  causes a heap buffer overflow\nwith firmware-controlled content.\n\nAdd a bounds
  check on the response length."
