title: UAC (Unix-like Artifacts Collector) versions prior to 3.3.0 contain a 
  command injection vulnerability in the _run_command function that allows 
  attackers to execute arbitrary commands by injecting shell metacharacters into
  untrusted data such as usernames, process names, or filenames. Attackers can 
  exploit this vulnerability through crafted evidence inputs, mounted images 
  with hostile filenames, or tampered artifact definitions to achieve remote 
  code execution on the analyst's host when processing evidence.
