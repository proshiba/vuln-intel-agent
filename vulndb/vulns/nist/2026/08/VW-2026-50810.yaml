title: "Affected versions of Flowintel allow the LOG_FILE configuration value to be
  modified through system settings without restricting it to a filename inside the
  intended log directory.\n\n\nBecause the application constructs the log destination
  from this configurable value, an administrator could set LOG_FILE to an arbitrary
  filesystem path. Since attackers can influence logged content, this enables controlled
  data to be written into unintended files. The upstream commit specifically describes
  an exploitation chain in which an attacker injects a template into a chosen file
  and subsequently abuses application rendering behavior to execute code.\n\nThe patch
  removes LOG_FILE from the web-editable settings, introduces validate_log_file_name()
  to reject absolute paths, traversal, Windows paths, null bytes, and directory components,
  and centralizes log path construction through resolve_log_file_path().\n\nVersion
  impacted: >=3.3.0"
