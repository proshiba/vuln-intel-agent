title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/fair:
  Prevent dead task groups from regaining cfs_rq's\n\nKevin is reporting crashes which
  point to a use-after-free of a cfs_rq\nin update_blocked_averages(). Initial debugging
  revealed that we've\nlive cfs_rq's (on_list=1) in an about to be kfree()'d task
  group in\nfree_fair_sched_group(). However, it was unclear how that can happen.\n\
  \nHis kernel config happened to lead to a layout of struct sched_entity\nthat put
  the 'my_q' member directly into the middle of the object\nwhich makes it incidentally
  overlap with SLUB's freelist pointer.\nThat, in combination with SLAB_FREELIST_HARDENED's
  freelist pointer\nmangling, leads to a reliable access violation in form of a #GP
  which\nmade the UAF fail fast.\n\nMichal seems to have run into the same issue[1].
  He already correctly\ndiagnosed that commit a7b359fc6a37 (\"sched/fair: Correctly
  insert\ncfs_rq's to list on unthrottle\") is causing the preconditions for the\n\
  UAF to happen by re-"
