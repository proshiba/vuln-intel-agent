title: "Exposure of Data Element to Wrong Session vulnerability in ash-project ash_graphql
  can deliver one subscription's resolved records to a different subscriber's topic.\n\
  \nAshGraphql.Subscription.Batcher.do_send/5 reads the resolved batch from the process
  dictionary via Process.get(:batch_resolved) and then unconditionally deletes it.
  That is sound only inside a task the library owns. On the :backpressure_sync and
  :noproc fallbacks do_send/5 runs inline in the publishing caller's process, so if
  a resolver inside an outer do_send/5 triggers another synchronous Ash notification,
  the inner call finds the outer run's value still under :batch_resolved, adopts it
  as its own result, and publishes it to the inner topic, a different subscription
  document with a different actor and tenant. It then deletes the key, so the outer
  run publishes nothing. The key is not namespaced by run, so records cannot be told
  apart. The fix saves, clears, and restores :batch_resolved around each run.\n\n\
  This issue affec"
