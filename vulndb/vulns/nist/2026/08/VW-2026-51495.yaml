title: An unauthenticated attacker can send a truncated quoted argument to the 
  ManageSieve login process, which makes it spin in an infinite loop consuming 
  CPU. This can cause degradation or denial of service for Sieve script 
  management, and repeated connections can consume all available CPU on the 
  server. Monitor system for abnormal CPU usage and kill the offending process. 
  Restrict network access to the ManageSieve service to trusted clients. Update 
  to non-vulnerable version. No publicly available exploits are known.
