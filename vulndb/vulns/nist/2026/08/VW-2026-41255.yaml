title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncdrom:
  fix stack out-of-bounds read in CDROMVOLCTRL\n\nmmc_ioctl_cdrom_volume() first reads
  the audio control mode page into a\n32-byte stack buffer with cgc->buflen set to
  24.  If the device reports a\nblock descriptor, the function increases cgc->buflen
  to include that\ndescriptor and reads the page again.\n\nFor CDROMVOLCTRL, the function
  then builds a MODE SELECT parameter list\nby moving cgc->buffer forward by offset
  - 8 bytes.  This drops the block\ndescriptor from the outgoing payload and leaves
  a new 8-byte mode\nparameter header in front of the audio control page.  However,
  cgc->buflen\nis left unchanged.\n\nWith a standard 8-byte block descriptor, cgc->buffer
  points at buffer + 8\nbut cgc->buflen remains 32.  cdrom_mode_select() therefore
  asks the low\nlevel packet path to write 32 bytes from that adjusted pointer, reading
  8\nbytes past the end of the 32-byte stack buffer.\n\nThis is not hit by CDROMVOLREAD,
  and CDROMVOLCTRL "
