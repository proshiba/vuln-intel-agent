title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  lib/mpi - avoid null pointer deref in mpi_cmp_ui()\n\nDuring NVMeTCP Authentication
  a controller can trigger a kernel\noops by specifying the 8192 bit Diffie Hellman
  group and passing\na correctly sized, but zeroed Diffie Hellamn value.\nmpi_cmp_ui()
  was detecting this if the second parameter was 0,\nbut 1 is passed from dh_is_pubkey_valid().
  This causes the null\npointer u->d to be dereferenced towards the end of mpi_cmp_ui()"
