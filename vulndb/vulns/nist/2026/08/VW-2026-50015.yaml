title: "Improper Authentication vulnerability in Apache Tomcat meant that in some
  circumstances (e.g. CLIENT-CERT, SPNEGO) that a user would be authenticated even
  if the user did not exist in the DataSourceRealm.\n\n\n\nThis issue affects Apache
  Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1
  through 9.0.120.\n\n\n\n\n\n\n\nThe following versions were EOL at the time the
  CVE was created but are \nknown to be affected: from 8.5.0 through 8.5.100, from
  7.0.0 through 7.0.109. Other unsupported versions may also be affected.\n\n\n\n\n\
  \n\n\nUsers are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which
  fix the issue."
