title: Multiple DrayTek VigorAP models contain a buffer overflow vulnerability 
  in the setLan function. The vulnerability is caused by missing length checks 
  during memory copy operations involving the lanVlanId0, lanIp, and lanNetmask 
  fields. A remote attacker can trigger this vulnerability via crafted input, 
  causing a denial of service or potentially executing arbitrary commands. 
  Exploitation requires valid administrative credentials for the device's web 
  management interface.
