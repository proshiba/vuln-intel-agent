title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  brcmfmac: cyw: fix heap overflow on a short auth frame\n\nbrcmf_notify_auth_frame_rx()
  takes the frame length from the firmware\nevent and copies the frame body with the
  management header offset\nsubtracted:\n\n\tu32 mgmt_frame_len = e->datalen - sizeof(struct
  brcmf_rx_mgmt_data);\n\t...\n\tmemcpy(&mgmt_frame->u, frame,\n\t       mgmt_frame_len
  - offsetof(struct ieee80211_mgmt, u));\n\nThe only length check is e->datalen >=
  sizeof(*rxframe), so mgmt_frame_len\ncan be anything from 0 up. offsetof(struct
  ieee80211_mgmt, u) is 24. When\nmgmt_frame_len is below that, the subtraction wraps
  as an unsigned value to\na huge length. The memcpy then runs far past the kzalloc'd
  buffer. A\nmalicious or malfunctioning AP can make the frame short during the\n\
  external SAE auth exchange, so this is a remotely triggered heap overflow.\n\nReject
  frames shorter than the management header offset before the copy."
