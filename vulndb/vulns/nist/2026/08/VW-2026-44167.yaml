title: "In the Linux kernel, the following vulnerability has been resolved:\n\nreset:
  sunxi: fix memory region leak on ioremap failure\n\nIn sunxi_reset_init(), when
  ioremap() fails, the memory region obtained\nvia request_mem_region() is not released,
  leading to a resource leak.\n\nAdd an err_mem_region label to properly release the
  memory region before\nfreeing the data structure."
