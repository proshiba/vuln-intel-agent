title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ipset: Don't use test_bit() in lockless RCU readers in hash types\n\nSashiko pointed
  out that there are a few lockless RCU readers\nusing test_bit() which is a relaxed
  atomic operation and\nprovides no memory barrier guarantees. Use test_bit_acquire()\n\
  instead where the operation may run parallel with add/del/gc,\ni.e. is not one from
  the next cases\n\n- protected by region lock\n- in a set destroy phase\n- in a new/temporary
  set creation phase"
