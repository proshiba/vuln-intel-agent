title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  Reject monmaps advertising zero monitors\n\nA message of type CEPH_MSG_MON_MAP contains
  a monmap that is sent from a\nmonitor to the client. This monmap contains information
  about the\nexisting monitors in the cluster. Currently, a monmap indicating that\n\
  there are zero monitors in the cluster is treated as valid. However, it\nis impossible
  to have zero monitors in the cluster and still receive a\nvalid monmap from a monitor.
  Therefore, such a monmap must be corrupted\nand should be treated as invalid. Furthermore,
  a monmap with a monitor\ncount of zero can subsequently crash the client when attempting
  to open\na session with a monitor in __open_session(). This happens because the\n\
  \"BUG_ON(monc->monmap->num_mon < 1)\" assertion in pick_new_mon() is\ntriggered.\n\
  \nThis patch extends a check in ceph_monmap_decode() to also reject\narriving mon_maps
  with num_mon == 0 rather than only with\nnum_mon > CEPH_MAX_MON.\n\n[ idryomov:
  dr"
