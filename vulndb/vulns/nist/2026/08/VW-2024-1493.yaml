title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  nfc: fix races in nfc_llcp_sock_get() and nfc_llcp_sock_get_sn()\n\nSili Luo reported
  a race in nfc_llcp_sock_get(), leading to UAF.\n\nGetting a reference on the socket
  found in a lookup while\nholding a lock should happen before releasing the lock.\n\
  \nnfc_llcp_sock_get_sn() has a similar problem.\n\nFinally nfc_llcp_recv_snl() needs
  to make sure the socket\nfound by nfc_llcp_sock_from_sn() does not disappear."
