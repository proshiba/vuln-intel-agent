title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rtl2832_sdr: Return queued buffers on start_streaming() failure\n\nThe vb2 framework
  hands buffers to the driver via buf_queue() before\ncalling start_streaming(). \
  \ If start_streaming() returns an error\nwithout first returning those buffers via
  vb2_buffer_done(),\nvb2_start_streaming() fires WARN_ON(owned_by_drv_count) and
  the queued\nbuffers leak.\n\nrtl2832_sdr_start_streaming() had multiple error paths
  that hit this\ntrap: two direct early returns (-ENODEV, -ERESTARTSYS), plus six\n\
  `goto err` paths covering subdev s_power, tuner setup, ADC setup,\nstream-buffer
  allocation, urb allocation, and urb submission failures.\nNone of them returned
  the queued buffers.\n\nThe original function had no distinct success exit and fell
  straight\nthrough into the err label, which previously only did mutex_unlock and\n\
  \"return ret\".  Adding queued-buffer cleanup at err must therefore be\npaired with
  an explicit success return; otherwise ever"
