title: OpenStack Glance before 29.1.1, 30.x before 30.1.1, and 31.0.0 is 
  affected by Server-Side Request Forgery (SSRF). By use of HTTP redirects, an 
  authenticated user can bypass URL validation checks and redirect to internal 
  services. Only glance image import functionality is affected. In particular, 
  the web-download and glance-download import methods are subject to this 
  vulnerability, as is the optional (not enabled by default) ovf_process image 
  import plugin.
