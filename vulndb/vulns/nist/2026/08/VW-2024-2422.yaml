title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: remove unused C2H event ID RTW89_MAC_C2H_FUNC_READ_WOW_CAM to prevent out-of-bounds
  reading\n\nThe handler of firmware C2H event RTW89_MAC_C2H_FUNC_READ_WOW_CAM isn't\n\
  implemented, but driver expects number of handlers is\nNUM_OF_RTW89_MAC_C2H_FUNC_WOW
  causing out-of-bounds access. Fix it by\nremoving ID.\n\nAddresses-Coverity-ID:
  1598775 (\"Out-of-bounds read\")"
