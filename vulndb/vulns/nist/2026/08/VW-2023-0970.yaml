title: A vulnerability in the remote access VPN feature of Cisco Adaptive 
  Security Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) 
  Software could allow an unauthenticated, remote attacker to cause a denial of 
  service (DoS) condition on an affected device. This vulnerability is due to 
  improper handling of HTTPS requests. An attacker could exploit this 
  vulnerability by sending crafted HTTPS requests to an affected system. A 
  successful exploit could allow the attacker to cause resource exhaustion, 
  resulting in a DoS condition.
