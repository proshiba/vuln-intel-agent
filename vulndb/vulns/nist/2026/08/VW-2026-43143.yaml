title: The Microsoft Container Migration Solution Accelerator is a multi-service
  application that provides a multi-agent, AI-driven migration solution for 
  moving container service configurations to Azure Kubernetes Service. In 
  version 2.1.2 and earlier, a security vulnerability was identified in the 
  Container Migration Solution Accelerator, specifically an authenticated IDOR 
  (Insecure Direct Object Reference) that allows users to read, write, and 
  delete processes belonging to other authenticated users. The issue affects 
  multiple API endpoints, where ownership checks are missing, enabling 
  unauthorized access and modification of migration data across users within the
  same organization. The vulnerability is present in both process and file 
