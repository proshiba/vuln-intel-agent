title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  ks7010: potential buffer overflow in ks_wlan_set_encode_ext()\n\nThe \"exc->key_len\"\
  \ is a u16 that comes from the user.  If it's over\nIW_ENCODING_TOKEN_MAX (64) that
  could lead to memory corruption."
