title: Nokogiri before 1.14.3 (CRuby implementation only, when using the 
  packaged libxml2) bundles libxml2 v2.10.3, which is vulnerable to NULL pointer
  dereferences in XML Schema processing (xmlSchemaFixupComplexType, 
  CVE-2023-28484, and xmlSchemaCheckCOSSTDerivedOK). An attacker who supplies a 
  crafted/malformed XML schema can cause libxml2 to dereference a NULL pointer 
  and potentially segfault, resulting in a denial of service. Nokogiri 1.14.3 
  upgrades the packaged libxml2 to v2.10.4 to resolve these issues.
