title: FUXA is a web-based Process Visualization (SCADA/HMI/Dashboard) software.
  In 1.3.2 and earlier, the device-webapi-request Socket.IO handler in 
  server/runtime/index.js permits an authenticated non-admin runtime user to 
  control property.address, causing the FUXA server to issue an outbound HTTP or
  HTTPS request and return the response body to the requesting socket. The 
  attacker can use the server as a read SSRF oracle against reachable internal 
  services or cloud metadata endpoints, with impact depending on the FUXA host's
  deployment network. This issue is fixed in version 1.3.3.
