title: Agno's PythonTools in libs/agno/agno/tools/python.py contains a path 
  traversal vulnerability that allows attackers to read, write, or execute 
  arbitrary files by supplying parent-directory traversal sequences in the 
  file_name argument passed to read_file, save_to_file, or run_python_file tool 
  actions. Attackers can inject traversal sequences such as 
  '../../../../../../etc/passwd' through direct tool invocation or via prompt 
  injection embedded in agent-processed content to escape the intended base_dir 
  boundary and achieve arbitrary file read, arbitrary file write, or arbitrary 
  Python code execution within the process user's authority.
