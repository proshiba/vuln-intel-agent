title: 'BMC FootPrints ITSM versions 20.20.02 through 20.24.01.001 contain a blind
  server-side request forgery vulnerability in the externalfeed/RSS API component
  that allows authenticated attackers to trigger arbitrary outbound requests from
  the server. Attackers can exploit insufficient validation of externally supplied
  resource references to interact with internal services or cause resource exhaustion
  impacting availability. The following hotfixes remediate the vulnerability: 20.20.02,
  20.20.03.002, 20.21.01.001, 20.21.02.002, 20.22.01, 20.22.01.001, 20.23.01, 20.23.01.002,
  and 20.24.01.'
