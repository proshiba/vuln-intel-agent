title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvduse:
  Fix race in vduse_dev_msg_sync and vduse_dev_read_iter\n\nThere is one race case
  in vduse_dev_msg_sync and vduse_dev_read_iter:\n\nvduse_dev_read_iter():\n    lock(msg_lock);\n\
  \    dequeue_msg(send_list);\n    unlock(msg_lock);\nvduse_dev_msg_sync():\n   \
  \ wait_timeout() finish\n    lock(msg_lock);\n    check msg->complete is false\n\
  \        list_del(msg);   <- double list_del() crash!\n\nTo fix this case, we shall
  ensure vduse_msg is on send_list or recv_list\noutside the msg_lock critical section."
