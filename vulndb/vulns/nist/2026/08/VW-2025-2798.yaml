title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: netlink notifier might race to release objects\n\ncommit release path
  is invoked via call_rcu and it runs lockless to\nrelease the objects after rcu grace
  period. The netlink notifier handler\nmight win race to remove objects that the
  transaction context is still\nreferencing from the commit release path.\n\nCall
  rcu_barrier() to ensure pending rcu callbacks run to completion\nif the list of
  transactions to be destroyed is not empty."
