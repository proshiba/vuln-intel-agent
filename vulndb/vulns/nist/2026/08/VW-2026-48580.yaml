title: NLTK versions before 3.10.0 default to ENFORCE=False in pathsec.py, 
  causing all security validation functions to emit warnings instead of raising 
  exceptions. Attackers can bypass path traversal and pickle deserialization 
  protections by exploiting the disabled security controls that are only active 
  when manually enabled.
