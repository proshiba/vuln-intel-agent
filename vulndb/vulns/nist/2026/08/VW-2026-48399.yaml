title: UAC (Unix-like Artifacts Collector) versions prior to 3.3.0 contain a 
  command injection vulnerability in the user substitution logic within 
  parse_artifact.sh where usernames and home directories from /etc/passwd are 
  substituted directly into command strings without escaping before execution 
  via eval. Attackers can inject shell metacharacters such as command 
  substitution syntax or semicolons through crafted usernames or home directory 
  paths in /etc/passwd entries to execute arbitrary commands on the analyst's 
  host system.
