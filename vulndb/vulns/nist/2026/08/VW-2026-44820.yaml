title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Check for page allocation failure correctly in TIO\n\nSashiko notes:\n\n>
  if __snp_alloc_firmware_pages() returns NULL under memory pressure, is it\n> safe
  to pass it directly to page_address()?\n>\n> On architectures without HASHED_PAGE_VIRTUAL,
  page_address(NULL) might\n> compute a deterministic but invalid, non-zero virtual
  address. The\n> subsequent if (tio_status) check would then evaluate to true, and\n\
  > sev_tsm_init_locked() would dereference the invalid pointer.\n\nIndeed, page_address(NULL)
  will return non-NULL garbage here. Fix this by\nchecking the page allocation itself
  for NULL, not the resulting virtual\naddress."
