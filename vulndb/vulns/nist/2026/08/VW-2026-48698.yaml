title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  evdev - fix information leak in evdev_pass_values()\n\nIn evdev_pass_values(), the
  input_event structure is allocated on the\nkernel stack and populated field-by-field.
  However, it is never fully\ninitialized. On architectures where struct input_event
  contains explicit\nor implicit padding (such as the 32-bit __pad field on SPARC64),
  these\npadding bytes are left uninitialized.\n\nWhen this event structure is subsequently
  passed to the client buffer\nand later copied to userspace, the uninitialized padding
  bytes leak\nkernel stack memory, potentially exposing sensitive information.\n\n\
  Similar issues exist in __evdev_queue_syn_dropped and __pass_event.\n\nFix this
  by explicitly zeroing the entire event structure with memset()\nbefore populating
  its fields. This ensures all padding bytes are cleared\nbefore the data crosses
  the security boundary."
