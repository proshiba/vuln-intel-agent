title: ASP-CMS contains a SQL injection vulnerability in the commentList.asp 
  endpoint that allows unauthenticated remote attackers to inject arbitrary SQL 
  by manipulating the id parameter in GET requests to the comment listing 
  script. Attackers can bypass the application's keyword blocklist by 
  interleaving the string 'master' within blocked SQL terms to extract sensitive
  database contents. Exploitation evidence was first observed by the 
  Shadowserver Foundation on 2023-10-18 (UTC).
