title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs3:
  bound to_move in indx_insert_into_root before hdr_insert_head\n\nindx_insert_into_root()
  promotes a full resident $INDEX_ROOT into\n$INDEX_ALLOCATION and copies all non-last
  resident root entries into\na newly allocated INDEX_BUFFER via hdr_insert_head().
  The source\nbyte count 'to_move' is summed from the on-disk resident entry sizes\n\
  and is independent of the destination buffer size, which comes from\nroot->index_block_size
  (via indx->index_bits).\n\nA crafted NTFS image that keeps a valid, full resident
  root but\nshrinks root->index_block_size down to 512 after the root has been\npopulated
  makes hdr_insert_head() memcpy attacker-controlled resident\nentry bytes past the
  end of the kmalloc(1u << indx->index_bits)\nallocation returned by indx_new(). For
  a 512-byte destination and a\nresident root whose non-last entries total 560 bytes,
  the memcpy\noverruns by 120 bytes and a following memmove extends the highest\n\
  written offs"
