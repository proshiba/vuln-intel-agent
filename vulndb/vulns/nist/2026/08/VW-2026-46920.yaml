title: 'Vulnerability in the Oracle Hospitality OPERA 5 Property Services product
  of Oracle Hospitality Applications (component: Opera Servlet).  Supported versions
  that are affected are 5.6.28.0-5.6.28.1. Easily exploitable vulnerability allows
  unauthenticated attacker with network access via HTTP to compromise Oracle Hospitality
  OPERA 5 Property Services.  Successful attacks require human interaction from a
  person other than the attacker. Successful attacks of this vulnerability can result
  in takeover of Oracle Hospitality OPERA 5 Property Services. CVSS 3.1 Base Score
  8.8 (Confidentiality, Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H).'
