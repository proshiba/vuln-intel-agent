title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_qca: Fix driver shutdown on closed serdev\n\nThe driver shutdown callback (which
  sends EDL_SOC_RESET to the device\nover serdev) should not be invoked when HCI device
  is not open (e.g. if\nhci_dev_open_sync() failed), because the serdev and its TTY
  are not open\neither.  Also skip this step if device is powered off\n(qca_power_shutdown()).\n\
  \nThe shutdown callback causes use-after-free during system reboot with\nQualcomm
