title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Fix potential amdxdna_umap lifetime race\n\namdxdna_umap_release() calls the blocking
  mmu_interval_notifier_remove()\nbefore removing the object from abo->mem.umap_list.
  If\naie2_populate_range() runs concurrently, it may obtain a reference to an\namdxdna_umap
  that is being released, leading to a potential use-after-free.\n\nUse kref_get_unless_zero()
  in aie2_populate_range() when acquiring a\nreference. If the reference count has
  already dropped to zero, release\nis in progress and the entry is skipped."
