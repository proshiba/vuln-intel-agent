title: When mail_max_userip_connections is set (default 10) and reached, 
  submission-login can crash with epoll() panic caused by file descriptor 
  handling issues. If running in high-security mode (default for community 
  releases), only the new submission connection gets terminated. If running in 
  high-performance mode (default for Pro releases), all connections handled by 
  the submission-login process will be terminated. The crashes can cause failure
  for user to send a message, or it can cause duplicate messages to be sent. If 
  TLS is not used (in the backend server processing the submission), duplicate 
  deliveries cannot happen, because the crash can only happen at AUTH stage. 
  Limit the number of connections handled by single submission-login process. 
  This has a performance impact though. Update to non-vulnerable version. No 
  publicly available exploits are known.
