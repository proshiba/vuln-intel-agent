title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-buf:
  dma-fence: Fix potential NULL pointer dereference\n\nThe commit mentioned in the
  fixes tag below introduced a mechanism\nthrough which fence producers can fully
  decouple from fence consumers.\nThis, desirable, mechanism is based on the fence's
  signaled-bit as the\n\"decoupling point\".\n\nA sophisticated interaction between
  RCU and atomic instructions attempts\nto ensure that fence consumers can still interact
  with fence producers\nthrough the dma_fence_ops (callback pointers into the producer).\n\
  \nThis is the desired behavior: to check for decoupling, the signaled-bit\nis first
  checked. If it's not yet signaled, RCU ensures that the ops\npointer cannot yet
  be NULL.\n\nHereby, dma_fence_signal_timestamp_locked() first sets the signaled-bit,\n\
  and then sets the ops pointer to NULL. Readers first load the ops\npointer, and
  then check through the signaled-bit whether the pointer can\nlegally be accessed.\n\
