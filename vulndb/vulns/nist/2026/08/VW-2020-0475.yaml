title: 'When accepting a malicious intent from other installed apps, Firefox for Android
  accepted manifests from arbitrary file paths and allowed declaring webapp manifests
  for other origins. This could be used to gain fullscreen access for UI spoofing
  and could also lead to cross-origin attacks on targeted websites. *Note: This issue
  only affected Firefox for Android. Other operating systems are unaffected.*. This
  vulnerability affects Firefox < 83.'
