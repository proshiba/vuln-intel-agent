title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  TDX: Reject concurrent change to CPUID entry count\n\nReject KVM_TDX_INIT_VM if
  userspace changes cpuid.nent between the\ninitial read and the subsequent copy of
  the initialization data.\n\ntdx_td_init() first reads user_data->cpuid.nent to size
  the flexible\nkvm_tdx_init_vm copy.  The copied structure also contains cpuid.nent,\n\
  and that field can differ from the value used to size the allocation if\nuserspace
  modifies the input concurrently.  setup_tdparams_cpuids() later\npasses init_vm->cpuid.nent
  to kvm_find_cpuid_entry2(), which uses it as\nthe array bound for the copied entries.\n\
  \nRequire the copied count to match the value used to size the allocation\nso that
  CPUID parsing cannot access beyond the entries actually copied."
