title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  bttv: fix use after free error due to btv->timeout timer\n\nThere may be some a
  race condition between timer function\nbttv_irq_timeout and bttv_remove. The timer
  is setup in\nprobe and there is no timer_delete operation in remove\nfunction. When
  it hit kfree btv, the function might still be\ninvoked, which will cause use after
  free bug.\n\nThis bug is found by static analysis, it may be false positive.\n\n\
  Fix it by adding del_timer_sync invoking to the remove function.\n\ncpu0       \
  \         cpu1\n                  bttv_probe\n                    ->timer_setup\n\
  \                      ->bttv_set_dma\n                        ->mod_timer;\nbttv_remove\n\
  \  ->kfree(btv);\n                  ->bttv_irq_timeout\n                    ->USE
  btv"
