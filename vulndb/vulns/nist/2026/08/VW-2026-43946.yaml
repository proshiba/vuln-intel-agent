title: 'A vulnerability was identified in Webkul Bagisto up to 2.4.4. Affected by
  this vulnerability is an unknown functionality of the component Customer Item Deletion
  Endpoint. Such manipulation leads to improper access controls. The attack can be
  launched remotely. The exploit is publicly available and might be used. The vendor
  confirms: "The reported issues were already identified through our internal security
  assessment process prior to this notification and are being handled through our
  established internal security and development lifecycle. Some of these items have
  already been addressed, while the remaining items are planned for resolution in
  upcoming product releases."'
