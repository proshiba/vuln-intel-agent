title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfs:
  use nfsi->rwsem to protect traversal of the file lock list\n\nLingfeng identified
  a bug and suggested two solutions, but both appear\nto have issues.\n\nGenerally,
  we cannot release flc_lock while iterating over the file lock\nlist to avoid use-after-free
  (UAF) problems with file locks. However,\nfunctions like nfs_delegation_claim_locks
  and nfs4_reclaim_locks cannot\nadhere to this rule because recover_lock or nfs4_lock_delegation_recall\n\
  may take a long time. To resolve this, NFS switches to using nfsi->rwsem\nfor the
  same protection, and nfs_reclaim_locks follows this approach.\nAlthough nfs_delegation_claim_locks
  uses so_delegreturn_mutex instead,\nthis is inadequate since a single inode can
  have multiple nfs4_state\ninstances. Therefore, the fix is to also use nfsi->rwsem
  in this case.\n\nFurthermore, after commit c69899a17ca4 (\"NFSv4: Update of VFS
