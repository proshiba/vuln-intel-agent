title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  protect XDP configuration with a mutex\n\nThe main threat to data consistency in
  ice_xdp() is a possible asynchronous\nPF reset. It can be triggered by a user or
  by TX timeout handler.\n\nXDP setup and PF reset code access the same resources
  in the following\nsections:\n* ice_vsi_close() in ice_prepare_for_reset() - already
  rtnl-locked\n* ice_vsi_rebuild() for the PF VSI - not protected\n* ice_vsi_open()
  - already rtnl-locked\n\nWith an unfortunate timing, such accesses can result in
  a crash such as the\none below:\n\n[ +1.999878] ice 0000:b1:00.0: Registered XDP
  mem model MEM_TYPE_XSK_BUFF_POOL on Rx ring 14\n[ +2.002992] ice 0000:b1:00.0: Registered
  XDP mem model MEM_TYPE_XSK_BUFF_POOL on Rx ring 18\n[Mar15 18:17] ice 0000:b1:00.0
  ens801f0np0: NETDEV WATCHDOG: CPU: 38: transmit queue 14 timed out 80692736 ms\n\
  [ +0.000093] ice 0000:b1:00.0 ens801f0np0: tx_timeout: VSI_num: 6, Q 14, NTC: 0x0,
  HW_HEAD: 0x0, NTU: 0x0, INT: 0x400000"
