title: "In the Linux kernel, the following vulnerability has been resolved:\n\njffs2:
  fix use-after-free in jffs2_clear_xattr_subsystem\n\nWhen we mount a jffs2 image,
  assume that the first few blocks of\nthe image are normal and contain at least one
  xattr-related inode,\nbut the next block is abnormal. As a result, an error is returned\n\
  in jffs2_scan_eraseblock(). jffs2_clear_xattr_subsystem() is then\ncalled in jffs2_build_filesystem()
  and then again in\njffs2_do_fill_super().\n\nFinally we can observe the following
  report:\n ==================================================================\n BUG:
  KASAN: use-after-free in jffs2_clear_xattr_subsystem+0x95/0x6ac\n Read of size 8
  at addr ffff8881243384e0 by task mount/719\n\n Call Trace:\n  dump_stack+0x115/0x16b\n\
