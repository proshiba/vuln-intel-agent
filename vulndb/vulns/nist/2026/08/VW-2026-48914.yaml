title: fast-uri is a URI parser for Node.js. Its custom parser for bracketed 
  IPv6 literals does not validate the complete IPv6 grammar, so invalid trailing
  text in an authority can be silently discarded and a malformed 
  attacker-controlled host is turned into a different valid IPv6 destination. 
  For example, a bracketed literal with invalid trailing characters is 
  normalized to the unspecified address, which a Node HTTP client then connects 
  to a local service over loopback, and other malformed literals collapse to 
  private-range addresses. No error is set on the parsed result, so an 
  application checking the error field cannot detect the rewrite. An application
  that normalizes untrusted URLs before outbound requests, redirects, proxy 
  routing, or address-policy enforcement can be redirected to a local or private
  IPv6 target, giving a server-side request forgery and address-policy bypass 
  primitive. The affected versions are 2.3.1 up to but not including 2.4.5, 
