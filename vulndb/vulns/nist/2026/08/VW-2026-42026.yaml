title: A broken access control vulnerability in BadChoice Handesk as of 
  2026-07-10 allows any authenticated agent to update ticket records belonging 
  to other teams via the TicketsController@update endpoint. The endpoint calls 
  no authorize() method and performs no team-scoped ownership check. An attacker
  with any agent account can modify, escalate, or corrupt tickets assigned to 
  other teams.
