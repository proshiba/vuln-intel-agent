  err;\n\n    [task]\n    splice_from_pipe_feed\n      ...\n        tls_sw_do_sendpage\n\
  \          if (sk->sk_err) {\n            ret = -sk->sk_err;  // ret is positive\n\
  \n    splice_from_pipe_feed (continued)\n      ret = actor(...)  // ret is still
  positive and interpreted as bytes\n                        // written, resulting
