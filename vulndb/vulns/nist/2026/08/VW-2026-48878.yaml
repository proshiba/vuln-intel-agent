  components/dialog/index.tsx of the component deepMerge. Performing a 
  manipulation of the argument locale results in improperly controlled 
  modification of object prototype attributes. The attack may be initiated 
  remotely. The reported GitHub issue was closed automatically due to 
  inactivity.
