title: phpMyFAQ before v4.1.6 writes content backup ZIP archives to the 
  web-accessible document root at content.zip, exposing sensitive files 
  including database credentials. Unauthenticated attackers can race concurrent 
  requests to download the temporary ZIP file before deletion, or exploit XSS in
  admin contexts to trigger authenticated backups and retrieve the archive.
