title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Copy WQE to local buffer in non-SRQ receive path\n\nFor non-SRQ QPs, the responder
  reads WQE fields directly from the\nshared queue buffer mapped into userspace. This
  allows a malicious\nuser to modify fields like num_sge or sge entries while the
  kernel\nis processing the WQE, leading to out-of-bounds reads in\nrxe_resp_check_length()
  and copy_data().\n\nIntroduce get_recv_wqe() that validates num_sge and copies the
  WQE\nto a kernel-local buffer before processing, matching the approach\nalready
  used for SRQ WQEs in get_srq_wqe(). The srq_wqe buffer is\nreused since SRQ and
  non-SRQ paths are mutually exclusive per QP."
