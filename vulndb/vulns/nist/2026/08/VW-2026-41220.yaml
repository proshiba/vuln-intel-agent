title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs:
  preserve ACL_DONT_CACHE state in forget_cached_acl()\n\nThe ACL_DONT_CACHE state
  is meant to be a constant state for the inode\nfor filesystems that want to opt
  out of posix acl caching.\n\nCommit facd61053cff1 (\"fuse: fixes after adapting
  to new posix acl api\")\nused this facility to opt out of posix acl caching for
  fuse inodes with\nfuse server that does not negotiate FUSE_POSIX_ACL (fc->posix_acl).\n\
  \nThe commit also takes care to gate the forget_all_cached_acls() call in\nfuse_set_acl()
  on fc->posix_acl because there is no need for it, but\nthere are other placed in
  fuse code which call forget_all_cached_acls()\nunconditional to fc->posix_acl and
  those cause the loss of the\nACL_DONT_CACHE state.\n\nThis is not only a functional
  bug. Properly timed, a get_acl() from this\nfuse filesystem can return a stale cached
  value, as was observed in tests,\nbecause set_acl() does not invalidate the unintentional
  acl cache.\n\nWe could fix "
