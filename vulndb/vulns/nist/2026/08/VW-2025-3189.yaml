title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  essiv - Handle EBUSY correctly\n\nAs it is essiv only handles the special return
  value of EINPROGERSS,\nwhich means that in all other cases it will free data related
  to the\nrequest.\n\nHowever, as the caller of essiv may specify MAY_BACKLOG, we
  also need\nto expect EBUSY and treat it in the same way.  Otherwise backlogged\n\
  requests will trigger a use-after-free."
