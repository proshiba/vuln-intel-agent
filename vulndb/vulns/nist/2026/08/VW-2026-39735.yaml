title: nanoMODBUS through v1.23.0 contains an out-of-bounds write in the Modbus 
  client-side recv_read_device_identification_res() function (FC 0x2B/MEI 0x0E, 
  Read Device Identification) in nanomodbus.c. The server-supplied object_length
  field (0-246) is validated only against the remaining PDU size (res_size_left)
  and is never validated against the caller-supplied buffers_length parameter. 
  After copying data with strncpy(buffers_out[buf_index], str, buffers_length), 
  the code unconditionally writes a NUL terminator at 
  buffers_out[buf_index][object_length]. When a malicious or compromised Modbus 
  server sends a response with object_length greater than or equal to the 
  client's buffers_length, this NUL write lands past the end of the 
  caller-provided buffer, corrupting adjacent stack or heap memory on the 
  client.
