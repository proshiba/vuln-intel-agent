title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  fix NPD in bo_meminfo()\n\nWhen a buffer object is purged, its ttm.resource is set
  to NULL via the\nTTM pipeline gutting flow. However, the BO remains in the client's\n\
  object list until userspace explicitly closes the GEM handle. If memory\nstats are
  queried during this time, accessing bo->ttm.resource->mem_type\nwill result in a
  NULL pointer dereference.\n\nFix this by safely skipping purged BOs in bo_meminfo,
  as they no longer\nconsume any memory.\n\nUser is getting NPD on device resume,
  and possible theory is that in\nbo_move(), if we need to evict something to SYSTEM
  to save the CCS state,\nbut the BO is marked as dontneed, this won't trigger a move
  but will\nnuke the pages, leaving us with a NULL bo resource. And the meminfo()\n\
  doesn't look ready to handle a NULL resource.\n\nv2 (Sashiko):\n - There could potentially
  be other cases where we might end up with a\n   NULL resource, so make this a general
  NULL check for now.\n\n("
