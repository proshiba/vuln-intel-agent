title: A SQL injection vulnerability was found in YzmCMS 7.5. The issue occurs 
  in the get_arrchildid() function within 
  application/admin/controller/category.class.php, where the user-controlled 
  parentid parameter is concatenated directly into a FIND_IN_SET() SQL clause 
  without proper sanitization. This allows an authenticated administrator to 
  execute arbitrary SQL queries via boolean-based blind injection, potentially 
  leading to full database compromise.
