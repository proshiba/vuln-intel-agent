title: "Affected versions of cti-transmute contain an SSRF vulnerability in the /fetch_misp_event
  and /misp_search_events endpoints.\n\n\nThe URL validation routine checked whether
  a supplied hostname was itself an IP literal and rejected private, loopback, link-local,
  or reserved IPs. However, ordinary domain names were accepted without resolving
  them first. An attacker could therefore use a hostname whose DNS record pointed
  to an internal address and cause the cti-transmute server to issue requests into
  its internal network. The commit explicitly states that anonymous callers could
  make the server request the internal target and read the response.\n\n\nThe fix
  resolves hostnames using socket.getaddrinfo(), checks that every resolved address
  is globally routable, and additionally places @login_required on both affected MISP
  fetch/search routes."
