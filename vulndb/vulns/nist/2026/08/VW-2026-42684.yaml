title: "A vulnerability in the VPN web services component of Cisco Secure Firewall
  Adaptive Security Appliance (ASA) Software and Cisco Secure Firewall Threat Defense
  (FTD) Software could allow an unauthenticated, remote attacker to conduct a cross-site
  scripting (XSS) attack against a browser that is accessing an affected device.&nbsp;\r\
  \n\r\nThis vulnerability is due to improper validation of user-supplied input in
  HTTP requests. An attacker could exploit this vulnerability by persuading a user
  to follow a link to a malicious website that is designed to submit malicious input
  to the affected application. A successful exploit could allow the attacker to execute
  arbitrary HTML or script code in the browser in the context of the VPN web server."
