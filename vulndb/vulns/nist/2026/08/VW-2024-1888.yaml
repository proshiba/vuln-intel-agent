title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/IPoIB:
  Fix legacy IPoIB due to wrong number of queues\n\nThe cited commit creates child
  PKEY interfaces over netlink will\nmultiple tx and rx queues, but some devices doesn't
  support more than 1\ntx and 1 rx queues. This causes to a crash when traffic is
  sent over the\nPKEY interface due to the parent having a single queue but the child\n\
  having multiple queues.\n\nThis patch fixes the number of queues to 1 for legacy
  IPoIB at the\nearliest possible point in time.\n\nBUG: kernel NULL pointer dereference,
  address: 000000000000036b\nPGD 0 P4D 0\nOops: 0000 [#1] SMP\nCPU: 4 PID: 209665
  Comm: python3 Not tainted 6.1.0_for_upstream_min_debug_2022_12_12_17_02 #1\nHardware
