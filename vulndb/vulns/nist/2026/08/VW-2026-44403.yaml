title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  access unicast_ttvn skb->data only after skb realloc\n\nThe pskb_may_pull() called
  by batadv_get_vid() could reallocate the buffer\nbehind the skb. Variables which
  were pointing to the old buffer need to be\nreassigned to avoid an use-after-free.\n\
  \nThis was done correctly for the ethernet header but missed for the\nunicast_packet
  pointer."
