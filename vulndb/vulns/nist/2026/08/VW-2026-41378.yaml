title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: fix crash in reset link replay\n\nDuring reset recovery, mt7925_vif_connect_iter()
  replays firmware state\nfor links tracked in mvif->valid_links. After MLO link changes
  or MCU\ntimeout recovery, the driver bitmap can temporarily contain a link whose\n\
  mac80211 bss_conf has already gone away.\n\nThis can pass a NULL bss_conf to mt76_connac_mcu_uni_add_dev(),
  matching\nthe crash where x1, the second argument, is NULL:\n\npc : mt76_connac_mcu_uni_add_dev+0x8c/0x1f8
  [mt76_connac_lib]\nlr : mt7925_vif_connect_iter+0x9c/0x168 [mt7925_common]\nx2 :
  ffffff80a77f6018 x1 : 0000000000000000 x0 : ffffff8099402080\nCall trace:\nmt76_connac_mcu_uni_add_dev+0x8c/0x1f8
  [mt76_connac_lib]\nmt7925_vif_connect_iter+0x9c/0x168 [mt7925_common]\nmt7925_mac_reset_work+0x264/0x2f8
  [mt7925_common]\n\nSkip missing bss_conf entries before replaying the link. Non-MLO
  AP/STA\nreset replay is unchanged because the helper still returns &vif->bss_co"
