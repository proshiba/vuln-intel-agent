title: Misskey is an open source, federated social media platform. All Misskey 
  servers running versions 2024.5.0 and later, but prior to 2026.5.4, contain a 
  vulnerability in the Server Announcements API where insufficient permission 
  checks allow attackers to access limited portions of data that they normally 
  couldn't view. This vulnerability occurs whether or not federation is enabled.
