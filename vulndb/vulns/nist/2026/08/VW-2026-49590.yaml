title: A flaw was found in dnsmasq. A remote attacker could exploit an 
  out-of-bounds write vulnerability by sending a specially crafted BOOTREPLY 
  (Bootstrap Protocol Reply) packet to a dnsmasq server configured with the 
  `--dhcp-split-relay` option. This can lead to memory corruption, causing the 
  dnsmasq daemon to crash and resulting in a denial of service (DoS).
