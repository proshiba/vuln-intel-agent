title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ipv6: clear suppressed fib6 rule result\n\nfib6_rule_suppress() drops a suppressed
  route with ip6_rt_put_flags(),\nbut leaves res->rt6 pointing at the released rt6_info.\n\
  \nIf no later rule supplies a replacement, fib6_rule_lookup() still sees\nres.rt6
  and returns that stale dst to its caller. A suppressing rule can\ntherefore leak
  a released route back to rt6_lookup(), and the next put\nhits rcuref_put_slowpath()
  from dst_release().\n\nClear res->rt6 when suppressing the route so suppressed lookups
  fall\nthrough to the null dst instead of reusing the released one."
