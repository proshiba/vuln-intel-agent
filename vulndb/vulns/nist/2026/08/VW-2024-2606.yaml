title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_api: fix xa_insert() error path in tcf_block_get_ext()\n\nThis command:\n\n\
  $ tc qdisc replace dev eth0 ingress_block 1 egress_block 1 clsact\nError: block
  dev insert failed: -EBUSY.\n\nfails because user space requests the same block index
  to be set for\nboth ingress and egress.\n\n[ side note, I don't think it even failed
  prior to commit 913b47d3424e\n  (\"net/sched: Introduce tc block netdev tracking
  infra\"), because this\n  is a command from an old set of notes of mine which used
  to work, but\n  alas, I did not scientifically bisect this ]\n\nThe problem is not
  that it fails, but rather, that the second time\naround, it fails differently (and
  irrecoverably):\n\n$ tc qdisc replace dev eth0 ingress_block 1 egress_block 1 clsact\n\
  Error: dsa_core: Flow block cb is busy.\n\n[ another note: the extack is added by
  me for illustration purposes.\n  the context of the problem is that clsact_init()
  obtains the same\n  &q->ingress_bloc"
