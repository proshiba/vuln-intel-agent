title: "Sony XAV-9500ES RTSP SETUP Buffer Overflow Remote Code Execution Vulnerability.
  This vulnerability allows network-adjacent attackers to execute arbitrary code on
  affected installations of Sony XAV-9500ES devices. Authentication is not required
  to exploit this vulnerability.\n\nThe specific flaw exists within the handling of
  SETUP RTSP packets. The issue results from the lack of proper validation of the
  length of user-supplied data prior to copying it to a fixed-length buffer. An attacker
  can leverage this vulnerability to execute code in the context of the device. Was
  ZDI-CAN-29042."
