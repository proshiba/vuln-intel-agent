title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix busy dentry warning on unmount after DIO\n\nCommit c68337442f03 (\"\
  cifs: Fix busy dentry used after unmounting\") fixed\nthe issue in cifs where deferred
  close of a file led to a dentry reference\ncount not being released in umount, by
  flushing deferredclose_wq in\ncifs_kill_sb() to solve it.\n\nHowever, the cifs DIO
  path suffers from the same busy-dentry problem caused\nby a delayed dentry reference-count
  release:\n\n\t[dio]\t\t\t[cifsd]\t\t\t[close + umount]\nnetfs_unbuffered_write_iter_locked\n\
  ...\n\t\t\t\tcifs_demultiplex_thread\n netfs_unbuffered_write\n  cifs_issue_write\n\
  \  netfs_wait_for_in_progress_stream [1]\n\t\t\t\t...\n\t\t\t\t netfs_write_subrequest_terminated\n\
  \t\t\t\t  netfs_subreq_clear_in_progress\n\t\t\t\t   netfs_wake_collector // wake
  [1]\n\t\t\t\t  netfs_put_subrequest\n netfs_put_request\n  queue_work(system_dfl_wq,
  xxx) [2]\n // dio write return\t\t\t\t\tcifs_close\n\t\t\t\t\t\t\t _cifsFileInfo_put\n\
  \t\t\t\t\t\t\t  // cfile->count 2->1\n\t\t\t\t\t\t\t  --cfile->c"
