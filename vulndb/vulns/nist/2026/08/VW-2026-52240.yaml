title: A flaw has been found in NASA earthdata-search 1.0.0. Affected by this 
  issue is the function OpenSearchGranuleSearchLambda of the file 
  serverless/src/openSearchGranuleSearch/handler.js of the component granules 
  Endpoint. Executing a manipulation of the argument openSearchOsdd can lead to 
  server-side request forgery. The attack can be launched remotely. The exploit 
  has been published and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
