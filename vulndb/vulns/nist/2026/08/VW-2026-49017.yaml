title: "The UMP Stream responder library in lib/midi2/ump_stream_responder.c builds
  reply packets in a 16-byte struct midi_ump (uint32_t data[4]). The builders make_endpoint_info()
  and make_function_block_info() populate only the first two words (res.data[0] and
  res.data[1]) and, before this fix, declared their result as an uninitialised local
  (struct midi_ump res;). The remaining two words (res.data[2], res.data[3]) retain
  stale stack contents.\n\nEndpoint Info and Function Block Info notifications are
  UMP Stream messages (UMP_MT_UMP_STREAM), which are 4 words long, so the full 16-byte
  packet — including the two uninitialised words — is transmitted verbatim by cfg->send().
  The responder is driven by attacker-supplied UMP Stream Endpoint-Discovery / Function-Block-Discovery
  requests via ump_stream_respond(). In the in-tree Network MIDI 2.0 server (subsys/net/lib/midi2/netmidi2.c)
  these requests arrive as UDP datagrams and, with the default no-authentication endpoint,
  a remote peer can establish "
