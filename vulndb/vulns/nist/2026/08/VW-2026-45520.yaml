title: ERPNext is a free and open source Enterprise Resource Planning tool. 
  Prior to 15.111.0 and 16.22.0, limited authenticated users can cross a 
  permission boundary in Frappe safe execution because frappe.render_template is
  exposed without forcing restrict_globals, allowing server-side template 
  injection and remote code execution. This issue is fixed in versions 15.111.0 
  and 16.22.0.
