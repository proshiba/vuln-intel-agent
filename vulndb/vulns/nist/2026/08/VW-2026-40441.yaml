title: llama.cpp builds b5702 through b7653 contain an out-of-bounds read 
  vulnerability in the recurrent memory state restore path that allows attackers
  with write access to the slot save directory to read memory past the end of 
  the allocated cells array. Attackers can craft a malicious slot file with an 
  oversized seq_id value to trigger an out-of-bounds read that leaks heap data 
  including pointer values into server logs, defeating ASLR protections and 
  facilitating further exploitation.
