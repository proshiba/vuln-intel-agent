title: The Really Simple Security  WordPress plugin before 9.8.0 does not check 
  that the user is allowed to install Really Simple Security  WordPress plugin 
  before 9.8.0 before installing one from a user-supplied URL, allowing an 
  administrator of a subsite on a multisite network to install and execute 
  arbitrary code in the network-shared Really Simple Security  WordPress plugin 
  before 9.8.0 directory, which WordPress otherwise reserves to the network 
  administrator. Exploitation requires the network administrator to have enabled
  the Really Simple Security  WordPress plugin before 9.8.0 administration menu 
  for subsites, which is not the default.
