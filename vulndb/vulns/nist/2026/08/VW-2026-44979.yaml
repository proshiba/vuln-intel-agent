title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (adt7470) Fix divide-by-zero TOCTOU crash in fan speed read\n\nIf the fan data becomes
  0 between the FAN_DATA_VALID() check and the\nFAN_PERIOD_TO_RPM() conversion, it
  will result in a divide-by-zero crash\ndue to a race with a concurrent update of
  the cached fan value.\n\nFix a TOCTOU issue by reading fan data once."
