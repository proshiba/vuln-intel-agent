title: 'A vulnerability was found in ggml-org llama.cpp bec4772f6. The impacted element
  is the function deserialize_tensor of the file ggml/src/ggml-rpc/ggml-rpc.cpp of
  the component ggml-RPC Server. Performing a manipulation of the argument op/op_params
  results in deserialization. The attack may be initiated remotely. This vulnerability
  is distinct from CVE-2026-34159 (GHSA-j8rj-fmpv-wcxw, PR #20908), which only added
  a buffer==nullptr rejection in create_node() and does not validate op or op_params.
  The reported GitHub issue was closed automatically due to inactivity.'
