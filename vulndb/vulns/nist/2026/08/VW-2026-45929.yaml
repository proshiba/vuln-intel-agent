title: authentik is an open-source identity provider. Prior to 2026.2.6 and 
  2026.5.5, an inbound SAML Source configured with the non-default USERNAME_LINK
  or EMAIL_LINK user-matching mode interprets an XML comment in a NameID 
  differently from the identity provider's signed assertion. An attacker with an
  account on the source identity provider who can set the account's NameID can 
  inject an XML comment that truncates the value used by authentik to the text 
  before the comment while the signed assertion remains valid. A crafted NameID 
  can therefore truncate to a victim's username or email and bind the attacker's
  external identity to the victim's existing account. This grants full takeover 
  without the victim's password or the identity provider's private key, and the 
  malicious link persists so later logins succeed without the comment. Sources 
  using the default unique-identifier matching mode and authentik's outbound 
  SAML Provider role are not affected. This issue is fixed in versions 2026.2.6 
  and 2
