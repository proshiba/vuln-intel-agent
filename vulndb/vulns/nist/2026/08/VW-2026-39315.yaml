title: Perspective 5.0.0 contains a denial of service vulnerability that allows 
  remote attackers to block the server event loop indefinitely by submitting a 
  crafted expression containing unbounded for or while loop constructs in a 
  TableMakeViewReq message. Attackers can embed an arbitrarily large iteration 
  count in an expression column evaluated once per table row, causing the 
  Tornado IOLoop to block without any iteration cap, deadline, or cancellation 
  check, rendering the server unresponsive to all connected clients.
