title: "Allocation of Resources Without Limits or Throttling in ueberauth guardian
  allows denial of service via unbounded atom creation from attacker-influenced binary
  input.\n\nGuardian.Plug.Keys derives connection and session namespace keys by passing
  arbitrary binaries to String.to_atom/1. base_key/1 in lib/guardian/plug/keys.ex
  converts any binary into the atom :\"guardian_<input>\", and the derived helpers
  claims_key/1, resource_key/1, and token_key/1 create a second atom on top of that.
  key_from_other/1 likewise converts a regex-captured binary through String.to_atom/1.
  The public specs advertise String.t() as a valid argument, so passing a string is
  documented usage, and higher-level entry points such as Guardian.Plug.current_token(conn,
  key: key) thread the caller-supplied key straight into these functions.\n\nString.to_atom/1
  creates a brand-new atom for every previously unseen binary, atoms are never garbage
