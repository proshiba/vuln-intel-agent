title: The Customer Reviews for WooCommerce plugin for WordPress is vulnerable 
  to Stored Cross-Site Scripting via the aggregated review form submission in 
  versions up to and including 5.106.0. This is due to insufficient input 
  sanitization and output escaping on user-supplied review comment text. The 
  plugin accepts review submissions from unauthenticated users through the 
  'cr_local_forms_submit' AJAX action without sanitizing HTML content before 
  storing it via wp_insert_comment(), and later renders this stored content on 
  product pages through comment_text() without proper escaping. This makes it 
  possible for unauthenticated attackers with a valid review form URL 
  (obtainable through review reminder emails sent to customers who placed 
  orders) to inject arbitrary web scripts in pages that will execute whenever a 
  user accesses the affected product page.
