title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: fix CAN frame rx/tx statistics\n\nKCSAN detected a data race within the bcm_rx_handler()
  when two CAN frames\nhave been simultaneously received and processed in a single
  rx op by two\ndifferent CPUs.\n\nUse atomic operations with (signed) long data types
  to access the\nstatistics in the hot path to fix the KCSAN complaint.\n\nAdditionally
  simplify the update and check of statistics overflow by\nusing the atomic operations
  in separate bcm_update_[rx|tx]_stats()\nfunctions. The rx variant runs under bcm_rx_update_lock
  to prevent\nraces when resetting the two rx counters; the tx variant runs under\n\
  bcm_tx_lock and only needs to guard its own counter's overflow.\n\nAs the rx path
  resets its values already at LONG_MAX / 100, there is\nno conflict between the two
  locking domains (bcm_rx_update_lock vs.\nbcm_tx_lock) even for ops that use both
  paths.\n\nThe rx statistics update and the frames_filtered update in\nbcm_rx_changed()
  were "
