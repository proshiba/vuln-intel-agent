title: A vulnerability has been found in cosmicstack-labs mercury-agent up to 
  1.1.12. This vulnerability affects the function 
  PermissionManager.checkShellCommand of the file 
  src/capabilities/permissions.ts of the component run_command Handler. Such 
  manipulation leads to incorrect privilege assignment. The attack may be 
  performed from remote. The exploit has been disclosed to the public and may be
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
