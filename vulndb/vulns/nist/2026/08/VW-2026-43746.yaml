title: Authorization Bypass Through User-Controlled Key (CWE-639) in Fleet 
  Server can lead to information disclosure via Manipulating User-Controlled 
  Variables (CAPEC-77). The authorization decision for artifact downloads relied
  on a client-supplied value that was persisted without being validated against 
  the server-side record of the requesting agent's assignment. An authenticated 
  party in possession of a valid enrolled agent credential could therefore 
  retrieve a policy the agent is not assigned to.
