title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Use sender devcom for MPV master-up\n\nAfter PCIe DPC recovery, mlx5 reloads the
  affected functions and\nreplays multiport affiliation events. In the reported failure,
  the\nfirst relevant device error was:\n\n  pcieport 0000:10:01.1: DPC: containment
  event\n  pcieport 0000:10:01.1: PCIe Bus Error: severity=Uncorrected (Fatal)\n \
  \ pcieport 0000:10:01.1:    [ 5] SDES                   (First)\n\nmlx5 recovered
  the PCI functions and resumed 0000:11:00.1. During\nthat resume, RDMA multiport
  binding replayed\nMLX5_DRIVER_EVENT_AFFILIATION_DONE and mlx5e sent\nMPV_DEVCOM_MASTER_UP.
  The host then panicked with:\n\n  BUG: kernel NULL pointer dereference, address:
  0000000000000010\n  RIP: mlx5_devcom_comp_set_ready+0x5/0x40 [mlx5_core]\n  RDI:
  0000000000000000\n\nCall trace included:\n\n  mlx5_devcom_comp_set_ready\n  mlx5e_devcom_event_mpv\n\
  \  mlx5_devcom_send_event\n  mlx5_ib_bind_slave_port\n  mlx5r_mp_probe\n  mlx5_pci_resume\n\
  \nMPV devcom r"
