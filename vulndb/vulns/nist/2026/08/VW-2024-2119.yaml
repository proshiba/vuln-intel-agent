title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-rdma:
  fix possible use-after-free in transport error_recovery work\n\nWhile nvme_rdma_submit_async_event_work
  is checking the ctrl and queue\nstate before preparing the AER command and scheduling
  io_work, in order\nto fully prevent a race where this check is not reliable the
  error\nrecovery work must flush async_event_work before continuing to destroy\n\
  the admin queue after setting the ctrl state to RESETTING such that\nthere is no
  race .submit_async_event and the error recovery handler\nitself changing the ctrl
  state."
