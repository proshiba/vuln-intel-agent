title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix qgroup reserve overflow the qgroup limit\n\nWe use extent_changeset->bytes_changed
  in qgroup_reserve_data() to record\nhow many bytes we set for EXTENT_QGROUP_RESERVED
  state. Currently the\nbytes_changed is set as \"unsigned int\", and it will overflow
  if we try to\nfallocate a range larger than 4GiB. The result is we reserve less
  bytes\nand eventually break the qgroup limit.\n\nUnlike regular buffered/direct
  write, which we use one changeset for\neach ordered extent, which can never be larger
  than 256M.  For\nfallocate, we use one changeset for the whole range, thus it no
  longer\nrespects the 256M per extent limit, and caused the problem.\n\nThe following
  example test script reproduces the problem:\n\n  $ cat qgroup-overflow.sh\n  #!/bin/bash\n\
  \n  DEV=/dev/sdj\n  MNT=/mnt/sdj\n\n  mkfs.btrfs -f $DEV\n  mount $DEV $MNT\n\n\
  \  # Set qgroup limit to 2GiB.\n  btrfs quota enable $MNT\n  btrfs qgroup limit
  2G $MNT\n\n  # Try to fallocate a 3Gi"
