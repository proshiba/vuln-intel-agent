title: "A vulnerability in the authentication and authorization flows for VPN connections
  in Cisco Adaptive Security Appliance (ASA) Software and Firepower Threat Defense
  (FTD) Software could allow an unauthenticated, remote attacker to establish a connection
  as a different user.\r\n\r This vulnerability is due to a flaw in the authorization
  verifications during the VPN authentication flow. An attacker could exploit this
  vulnerability by sending a crafted packet during a VPN authentication. The attacker
  must have valid credentials to establish a VPN connection. A successful exploit
  could allow the attacker to establish a VPN connection with access privileges from
  a different user."
