title: "An improper input\nvalidation vulnerability in the configuration service for
  processing encrypted\ncredential data has been identified in Tapo C200 v5.  An attacker
  can send oversized crypted\nciphertext values that may trigger exception handling
  failures, due to insufficient\nvalidation, causing the affected device to crash
  or restart.\n\n\n\n\n\nSuccessful\nexploitation may temporarily disrupt HTTPS management
  and monitoring\nfunctionality, resulting in a denial-of-service (DoS) condition
  until the\nservice recovers."
