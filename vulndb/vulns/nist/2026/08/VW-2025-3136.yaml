title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix deadlock due to mbcache entry corruption\n\nWhen manipulating xattr blocks,
  we can deadlock infinitely looping\ninside ext4_xattr_block_set() where we constantly
  keep finding xattr\nblock for reuse in mbcache but we are unable to reuse it because
  its\nreference count is too big. This happens because cache entry for the\nxattr
  block is marked as reusable (e_reusable set) although its\nreference count is too
  big. When this inconsistency happens, this\ninconsistent state is kept indefinitely
  and so ext4_xattr_block_set()\nkeeps retrying indefinitely.\n\nThe inconsistent
  state is caused by non-atomic update of e_reusable bit.\ne_reusable is part of a
  bitfield and e_reusable update can race with\nupdate of e_referenced bit in the
  same bitfield resulting in loss of one\nof the updates. Fix the problem by using
  atomic bitops instead.\n\nThis bug has been around for many years, but it became
  *much* easier\nto hit after commit 65f8b8"
