title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390:
  fix double free of GS and RI CBs on fork() failure\n\nThe pointers for guarded storage
  and runtime instrumentation control\nblocks are stored in the thread_struct of the
  associated task. These\npointers are initially copied on fork() via arch_dup_task_struct()\n\
  and then cleared via copy_thread() before fork() returns. If fork()\nhappens to
  fail after the initial task dup and before copy_thread(),\nthe newly allocated task
  and associated thread_struct memory are\nfreed via free_task() -> arch_release_task_struct().
  This results in\na double free of the guarded storage and runtime info structs\n\
  because the fields in the failed task still refer to memory\nassociated with the
  source task.\n\nThis problem can manifest as a BUG_ON() in set_freepointer() (with\n\
  CONFIG_SLAB_FREELIST_HARDENED enabled) or KASAN splat (if enabled)\nwhen running
  trinity syscall fuzz tests on s390x. To avoid this\nproblem, clear the associated
  pointer field"
