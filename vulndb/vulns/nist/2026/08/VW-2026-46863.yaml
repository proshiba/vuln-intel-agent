title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Installation and Configuration).   The supported version
  that is affected is 11.2.25.0.000. Easily exploitable vulnerability allows low privileged
  attacker with network access via HTTP to compromise Oracle Hyperion Infrastructure
  Technology.  Successful attacks of this vulnerability can result in  unauthorized
  access to critical data or complete access to all Oracle Hyperion Infrastructure
  Technology accessible data as well as  unauthorized update, insert or delete access
  to some of Oracle Hyperion Infrastructure Technology accessible data. CVSS 3.1 Base
  Score 7.1 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N).'
