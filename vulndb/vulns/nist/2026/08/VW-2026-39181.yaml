title: Camaleon CMS through 2.9.2, fixed in commit 88ab703, contains a missing 
  authorization vulnerability on the drafts endpoint that allows any 
  authenticated low-privileged user to create draft posts by bypassing role and 
  permission checks. Attackers can send requests to the drafts endpoint using 
  only session authentication to create unauthorized drafts that appear in the 
  administrative drafts queue.
