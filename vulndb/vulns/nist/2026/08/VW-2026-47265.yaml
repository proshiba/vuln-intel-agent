title: Wazuh is a free and open source platform used for threat prevention, 
  detection, and response. From 4.0.0 until 4.14.6 and 5.0.0-beta2, 
  AuthenticationManager.check_user() in framework/wazuh/rbac/orm.py performs 
  check_password_hash() only when the supplied username exists. A nonexistent 
  username returns immediately, while a valid username causes an expensive 
  bcrypt calculation. An unauthenticated remote attacker can compare 
  authentication response times to enumerate valid Wazuh usernames and use that 
  information in subsequent credential attacks. This issue is fixed in versions 
  4.14.6 and 5.0.0-beta2.
