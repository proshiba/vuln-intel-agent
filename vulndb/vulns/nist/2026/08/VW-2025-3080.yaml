title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_event: call disconnect callback before deleting conn\n\nIn hci_cs_disconnect,
  we do hci_conn_del even if disconnection failed.\n\nISO, L2CAP and SCO connections
  refer to the hci_conn without\nhci_conn_get, so disconn_cfm must be called so they
  can clean up their\nconn, otherwise use-after-free occurs.\n\nISO:\n==========================================================\n\
  iso_sock_connect:880: sk 00000000eabd6557\niso_connect_cis:356: 70:1a:b8:98:ff:a2
  -> 28:3d:c2:4a:7e:da\n...\niso_conn_add:140: hcon 000000001696f1fd conn 00000000b6251073\n\
  hci_dev_put:1487: hci0 orig refcnt 17\n__iso_chan_add:214: conn 00000000b6251073\n\
  iso_sock_clear_timer:117: sock 00000000eabd6557 state 3\n...\nhci_rx_work:4085:
  hci0 Event packet\nhci_event_packet:7601: hci0: event 0x0f\nhci_cmd_status_evt:4346:
  hci0: opcode 0x0406\nhci_cs_disconnect:2760: hci0: status 0x0c\nhci_sent_cmd_data:3107:
  hci0 opcode 0x0406\nhci_conn_del:1151: hci0 hcon 00000000169"
