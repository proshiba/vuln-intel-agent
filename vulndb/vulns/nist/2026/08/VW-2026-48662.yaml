title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/core:
  Fix group leader use-after-free after sibling detach\n\nperf_group_detach() handles
  leader and sibling detach differently. When the\ngroup leader is detached, all siblings
  are promoted to singleton events and\ntheir group_leader pointer is reset to themselves.
  When a sibling is\ndetached, it is removed from the leader's sibling_list, but its\n\
  group_leader pointer is left pointing at the old leader.\n\nThat is harmless when
  the sibling is being closed and freed immediately, as\nin the DETACH_DEAD path.
  It is not safe when the sibling is detached but\nkept alive, such as during CPU
  hotplug with DETACH_GROUP. In that case the\nsibling is removed from the context,
  while its file descriptor can still\nkeep it alive.\n\nA typical failing sequence
  is:\n\n  - A group contains leader L and sibling S.\n  - CPU hot-unplug detaches
  S with DETACH_GROUP, removing it from\n    L->sibling_list but leaving S->group_leader
  == L.\n  - L is late"
