title: "The Hearing Access Service (HAS) GATT server in subsys/bluetooth/audio/has.c
  installs a connection-callback set unconditionally via BT_CONN_CB_DEFINE, so security_changed()
  runs for every connection that establishes security even before the application
  has called bt_has_register(). The service attribute pointers hearing_aid_features_attr,
  preset_control_point_attr, and active_preset_index_attr remain NULL until bt_has_register()
  resolves them and sets has.registered.\n\nWith CONFIG_BT_SETTINGS, settings_set_cb()
  restores each bonded client's persisted context at boot and unconditionally sets
  context->flags to BONDED_CLIENT_INIT_FLAGS (non-zero). When a previously bonded
  peer reconnects and re-establishes security during the startup window before bt_has_register()
  has been called, security_changed() sees the non-zero flags and schedules notify_work_handler,
  which calls bt_gatt_is_subscribed() with a still-NULL attribute pointer. That triggers
  an assertion (__ASSERT(attr, ...) in bt_gatt_i"
