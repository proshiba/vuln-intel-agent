title: "Improper limitation of a pathname to a restricted directory in the aws:downloadContent
  plugin in amazon-ssm-agent before 3.3.4515.0 might allow an authenticated remote
  user whose ssm:SendCommand permission is restricted to the AWS-DownloadContent document,
  to write arbitrary files outside the intended download directory with root privileges,
  via crafted object keys in the S3 source the document is directed to retrieve. This
  issue may lead to arbitrary code execution as root if specific sensitive files are
  overwritten.\n\n\n\nTo remediate this issue, customers should upgrade amazon-ssm-agent
  to version 3.3.4515.0 or later."
