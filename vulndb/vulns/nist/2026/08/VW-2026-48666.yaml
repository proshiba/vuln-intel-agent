title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usx2y: bound the hwdep mmap fault offset\n\nsnd_us428ctls_vm_fault() turns the faulting
  page offset into a kernel\naddress with no bound of any kind:\n\n\toffset = vmf->pgoff
  << PAGE_SHIFT;\n\tvaddr = (char *)(...)->us428ctls_sharedmem + offset;\n\tpage =
  virt_to_page(vaddr);\n\tget_page(page);\n\tvmf->page = page;\n\n\treturn 0;\n\n\
  snd_us428ctls_mmap() checks only the length of the mapping, never the\noffset, and
  us428ctls_sharedmem is a single page from\nalloc_pages_exact().  For a character
  device file_mmap_size_max()\nreturns ULONG_MAX, so the mm layer imposes no ceiling
  either.  Every page\noffset above zero resolves to a struct page outside the object,
  and the\nhandler installs it into the caller's address space read-write; the vma\n\
  is not marked read-only.\n\nThe caller picks the page frame with a single mmap()
  argument and gets\nread-write access to a page of kernel memory it does not own;
  an offset\nthat lands in an unpopulated vme"
