title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  reject non-inline dinodes with i_size and zero i_clusters\n\nOn a volume mounted
  without OCFS2_FEATURE_INCOMPAT_SPARSE_ALLOC, a\nnon-inline regular file with non-zero
  i_size and zero i_clusters is\nstructurally malformed: the extent map declares no
  allocated clusters yet\nthe size header claims content exists.  Keep rejecting that
  shape, but\nexpress it through a shared predicate so the same invariant is available\n\
  to normal inode reads and online filecheck.\n\nThe same zero-cluster shape is also
  malformed for non-inline directories. \nocfs2 directory growth allocates backing
  storage before advancing i_size,\nand ocfs2_dir_foreach_blk_el() later walks until
  ctx->pos reaches\ni_size_read(inode).  A forged directory dinode with a huge i_size
  and no\nclusters would repeatedly fail on holes while advancing through the\nclaimed
  size.\n\nSparse regular files remain exempt: on sparse-alloc volumes, truncate can\n\
  legitimately grow i_si"
