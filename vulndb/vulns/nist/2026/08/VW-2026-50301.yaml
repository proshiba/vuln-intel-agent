title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  core: Fix pointer desynchronization in fb_io_read()\n\nIn fb_io_read(), if copy_to_user()
  performs a partial copy (e.g., due to\na faulty user buffer), the loop adjusts the
  chunk size 'c' and updates\nthe remaining 'count'. However, the hardware 'src' pointer
  has already\nbeen eagerly advanced by the original chunk size.\n\nIf the loop is
  allowed to continue, the read will resume from an\nincorrect, over-advanced offset.
  Since the remaining 'count' was only\ndecremented by the successful bytes, this
  desynchronization causes the\nnext iterations to execute more hardware reads than
  originally bounded,\neventually leading to out-of-bounds I/O reads.\n\nFix this
  by breaking out of the loop immediately upon a partial\ncopy_to_user(). A partial
  copy indicates a faulty user buffer, making\nsubsequent read attempts futile. Breaking
  out ensures we return the\nnumber of successfully read bytes without risking out-of-bounds
  hardware\nacce"
