title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  syscall: Ensure saved x0 is kept in-sync with tracer updates\n\nWhen seccomp support
  was originally added to arm64 in a1ae65b21941\n(\"arm64: add seccomp support\"),
  seccomp was erroneously called _before_\nthe ptrace syscall-enter-stop and therefore
  the tracer could trivially\nmanipulate the syscall register state after the seccomp
  check had\npassed. This was subsequently fixed in a5cd110cb836 (\"arm64/ptrace:
  run\nseccomp after ptrace\") by moving the seccomp check after the tracer has\n\
  run. Unfortunately, a decade later, that fix has been reported to be\nincomplete.\n\
  \nOn arm64, both the first argument to a syscall and its eventual return\nvalue
  are allocated to register x0. In order to facilitate syscall\nrestarting and querying
  of syscall arguments on the syscall exit path,\nthe original value of x0 is stashed
  in 'struct pt_regs::orig_x0' early\nduring the syscall entry path and is returned
  for the first argument by\nsyscall_"
