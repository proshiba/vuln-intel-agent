title: Puwell IP Camera firmware versions 2.x through 4.x contains an 
  authentication bypass vulnerability that allows unauthenticated attackers to 
  access device functions by sending protocol-conforming packets over TCP port 
  23456 without credentials. Attackers can exploit the unvalidated Session field
  in the proprietary control protocol header to access live video streams, 
  control pan and tilt motors, activate audio functions, and remotely restart 
  the device.
