title: Grav API plugin versions before 1.0.13 fail to enforce API key scope caps
  in ConfigController super-scope gates, allowing scoped keys to write scheduler
  configuration. The scope cap is applied only inside requirePermission(), while
  the scheduler and backups gates use a bare isSuperAdmin() check that never 
  consults api_key_scopes. An attacker holding an API key scoped to 
  api.config.write that was minted on a super account can therefore inject 
  arbitrary commands into scheduler.custom_jobs, which Job::run() passes to a 
  Symfony Process, achieving operating system command execution as the web 
  server user.
