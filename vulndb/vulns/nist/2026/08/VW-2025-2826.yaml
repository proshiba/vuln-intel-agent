title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  check changes_pkt_data property for extension programs\n\nWhen processing calls
  to global sub-programs, verifier decides whether\nto invalidate all packet pointers
  in current state depending on the\nchanges_pkt_data property of the global sub-program.\n\
  \nBecause of this, an extension program replacing a global sub-program\nmust be
  compatible with changes_pkt_data property of the sub-program\nbeing replaced.\n\n\
  This commit:\n- adds changes_pkt_data flag to struct bpf_prog_aux:\n  - this flag
  is set in check_cfg() for main sub-program;\n  - in jit_subprogs() for other sub-programs;\n\
  - modifies bpf_check_attach_btf_id() to check changes_pkt_data flag;\n- moves call
  to check_attach_btf_id() after the call to check_cfg(),\n  because it needs changes_pkt_data
  flag to be set:\n\n    bpf_check:\n      ...                             ...\n \
  \   - check_attach_btf_id             resolve_pseudo_ldimm64\n      resolve_pseudo_ldimm64\
  \   -->    bpf_p"
