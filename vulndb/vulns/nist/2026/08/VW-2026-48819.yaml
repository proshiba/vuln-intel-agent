title: justhtml versions <= 1.11.0 (fixed in 1.12.0) do not sufficiently escape 
  HTML-significant characters (angle brackets) in text nodes when converting a 
  parsed document to Markdown via to_markdown(). While a small set of Markdown 
  metacharacters are escaped, characters such as < and > are preserved, so 
  untrusted input that is safe in to_html() — including entity-decoded text 
  (e.g. &lt;script&gt;) or text from RCDATA/RAWTEXT-parsed elements like 
  <title>, <textarea>, <noscript>, and <plaintext> — can be emitted as raw HTML 
  in the Markdown output, enabling a sanitizer bypass and potential cross-site 
  scripting when that output is rendered.
