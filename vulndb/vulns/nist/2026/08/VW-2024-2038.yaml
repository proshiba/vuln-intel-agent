title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix use-after-free after failure to create a snapshot\n\nAt ioctl.c:create_snapshot(),
  we allocate a pending snapshot structure and\nthen attach it to the transaction's
  list of pending snapshots. After that\nwe call btrfs_commit_transaction(), and if
  that returns an error we jump\nto 'fail' label, where we kfree() the pending snapshot
  structure. This can\nresult in a later use-after-free of the pending snapshot:\n\
  \n1) We allocated the pending snapshot and added it to the transaction's\n   list
  of pending snapshots;\n\n2) We call btrfs_commit_transaction(), and it fails either
  at the first\n   call to btrfs_run_delayed_refs() or btrfs_start_dirty_block_groups().\n\
  \   In both cases, we don't abort the transaction and we release our\n   transaction
  handle. We jump to the 'fail' label and free the pending\n   snapshot structure.
