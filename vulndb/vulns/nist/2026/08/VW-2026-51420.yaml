title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_nat: reject unsupported target families\n\nxt_nat SNAT and DNAT target handlers
  assume IP-family conntrack state\nis present and can dereference a NULL pointer
  when instantiated from an\nunsupported family through nft_compat. A bridge-family
  compat rule can\ntherefore trigger a NULL-dereference in nf_nat_setup_info().\n\n\
  Reject non-IP families in xt_nat_checkentry() so unsupported targets\ncannot be
  installed. Keep NFPROTO_INET allowed for valid inet NAT\ncompat users and leave
  the runtime fast path unchanged.\n\n[ The crash was fixed via\n  9dbba7e694ec (\"\
  netfilter: nft_compat: ebtables emulation must reject non-bridge targets\"),\n \
  \ so this patch is no longer critical.\n  Nevertheless, NAT is only relevant for
  ipv4/ipv6, so this extra\n  family check is a good idea in any case. ]"
