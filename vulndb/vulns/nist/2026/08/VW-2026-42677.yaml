title: "A vulnerability in the IKEv2 feature of Cisco Secure Firewall ASA Software
  and Cisco Secure FTD Software could allow an unauthenticated, remote attacker to
  cause a DoS condition on an affected device that may also impact the availability
  of services to devices elsewhere in the network.\r\n\r This vulnerability is due
  to memory exhaustion caused by not freeing memory during IKEv2 packet processing.
  An attacker could exploit this vulnerability by sending crafted IKEv2 packets to
  an affected device. A successful exploit could allow the attacker to exhaust resources,
  causing a DoS condition that will eventually require the device to manually reload."
