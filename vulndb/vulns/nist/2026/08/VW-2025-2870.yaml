title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  mcp2221: prevent a buffer overflow in mcp_smbus_write()\n\nSmatch Warning:\ndrivers/hid/hid-mcp2221.c:388
  mcp_smbus_write() error: __memcpy()\n'&mcp->txbuf[5]' too small (59 vs 255)\ndrivers/hid/hid-mcp2221.c:388
  mcp_smbus_write() error: __memcpy() 'buf'\ntoo small (34 vs 255)\n\nThe 'len' variable
  can take a value between 0-255 as it can come from\ndata->block[0] and it is user
  data. So add an bound check to prevent a\nbuffer overflow in memcpy()."
