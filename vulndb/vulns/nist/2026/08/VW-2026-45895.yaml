title: 'Vim is an open source, command line text editor. Prior to 9.2.0845, StructMembers()
  in runtime/autoload/ccomplete.vim constructs and executes a vimgrep command using
  an insufficiently escaped typeref: or typename: value from a tags file, allowing
  an unterminated collection followed by a command separator to execute arbitrary
  Ex and operating-system commands when a user invokes C omni-completion with CTRL-X
  CTRL-O on a member access whose type is resolved from that tags file. This issue
  is fixed in version 9.2.0845.'
