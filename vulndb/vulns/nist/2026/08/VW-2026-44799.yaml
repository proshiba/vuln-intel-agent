title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cls_bpf: prevent unbounded recursion in offload rollback\n\nQuan Sun reported [1]
  a stack overflow in cls_bpf_offload_cmd().\n\nReproducer on netdevsim: add a skip_sw
  cls_bpf filter, set the\nbpf_tc_accept debugfs knob to 0, then `tc filter replace`.
  The replace\ncalls tc_setup_cb_replace() which fails. cls_bpf_offload_cmd() then\n\
  swaps prog/oldprog and recursively calls itself to roll back. But\nbpf_tc_accept=0
  makes the rollback fail too, which triggers yet another\nrollback frame with the
  same arguments, and so on until the stack is\nexhausted.\n\nbpf_tc_accept is just
  a convenient knob for the reproducer. Any driver\nwhose tc_setup_cb_replace() fails
  twice in a row can hit the same loop,\nso this is not a netdevsim-only issue.\n\n\
  Two ways to fix it:\n\n  1) Have the rollback call tc_setup_cb_add() on oldprog
  instead of\n     re-entering cls_bpf_offload_cmd().\n  2) Mark the rollback frame
  with a flag and skip a second-leve"
