  an svc_rqst is deferred\nwhile the sunrpc tracing subsystem is enabled. svc_revisit()
  sets\ndr->xprt to NULL, so it can't be relied upon in the tracepoint to\nprovide
  the remote's address.\n\nUnfortunately we can't revert the \"svc_deferred_class\"\
  \ hunk in\ncommit ece200ddd54b (\"sunrpc: Save remote presentation address in\n\
