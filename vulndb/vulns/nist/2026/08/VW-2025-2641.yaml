title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  Fix use after free in hci_send_acl\n\nThis fixes the following trace caused by receiving\n\
  HCI_EV_DISCONN_PHY_LINK_COMPLETE which does call hci_conn_del without\nfirst checking
  if conn->type is in fact AMP_LINK and in case it is\ndo properly cleanup upper layers
  with hci_disconn_cfm:\n\n ==================================================================\n\
