title: A security flaw has been discovered in amirsanni 
  Mini-Inventory-and-Sales-Management-System 0.1. Affected is the function 
  Transaction::getAll of the file application/models/Transaction.php. Performing
  a manipulation of the argument orderBy/orderFormat results in sql injection. 
  It is possible to initiate the attack remotely. The exploit has been released 
  to the public and may be used for attacks. The project was informed of the 
  problem early through an issue report but has not responded yet.
