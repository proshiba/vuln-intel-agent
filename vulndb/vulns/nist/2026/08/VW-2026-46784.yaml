title: 'Vulnerability in the Oracle Hyperion Data Relationship Management product
  of Oracle Hyperion (component: Web Client - Unicode).   The supported version that
  is affected is 11.2.23.0.000. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via HTTP to compromise Oracle Hyperion Data Relationship
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  access to critical data or complete access to all Oracle Hyperion Data Relationship
  Management accessible data and unauthorized ability to cause a partial denial of
  service (partial DOS) of Oracle Hyperion Data Relationship Management. CVSS 3.1
  Base Score 8.2 (Confidentiality and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:L).'
