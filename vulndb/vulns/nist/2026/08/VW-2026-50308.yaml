title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  fastopen: only mark MPTFO subflows with SYN data\n\nPassive TCP Fast Open accepts
  a valid-cookie SYN even when it carries\nno data. In that case the child socket's
  receive queue is intentionally\nleft empty.\n\nmptcp_fastopen_subflow_synack_set_params()
  set is_mptfo before checking\nfor queued SYN data. That made data-less TFO SYNs
  hit a WARN and, if\nthe warning was non-fatal, left stale MPTFO state behind. The
  stale\nflag could later trigger a state-confusion bug in\ncheck_fully_established().\n\
  \nOnly mark the subflow as MPTFO after confirming that an SKB was queued.\nReturn
  quietly when the receive queue is empty.\n\nNote that mptcp_subflow_context's is_mptfo
  field is now not just about\nsubflows where the TFO was present, but about MPTFO
  subflow that\nconsumed SYN data. Only having a valid cookie but not carrying data
  is\nnot really \"doing TFO\"."
