title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  skb_linearize the head skb when reassembling msgs\n\nIt's not a good idea to append
  the frag skb to a skb's frag_list if\nthe frag_list already has skbs from elsewhere,
  such as this skb was\ncreated by pskb_copy() where the frag_list was cloned (all
  the skbs\nin it were skb_get'ed) and shared by multiple skbs.\n\nHowever, the new
  appended frag skb should have been only seen by the\ncurrent skb. Otherwise, it
  will cause use after free crashes as this\nappended frag skb are seen by multiple
  skbs but it only got skb_get\ncalled once.\n\nThe same thing happens with a skb
  updated by pskb_may_pull() with a\nskb_cloned skb. Li Shuang has reported quite
  a few crashes caused\nby this when doing testing over macvlan devices:\n\n  [] kernel
  BUG at net/core/skbuff.c:1970!\n  [] Call Trace:\n  []  skb_clone+0x4d/0xb0\n  []\
  \  macvlan_broadcast+0xd8/0x160 [macvlan]\n  []  macvlan_process_broadcast+0x148/0x150
  [macvlan]\n  []  process_one_work+0x1a7"
