title: "Issue summary: OpenSSL CMP response validation passed an unexpected response\n\
  sender distinguished name directly as the format string to `ERR_raise_data()`.\n\
  \nImpact summary: A malicious or intercepted CMP endpoint can crash a CMP client\n\
  that enforces an expected sender or uses a pinned server certificate whose\nsubject
  becomes the default expected sender.\n\nCWE: CWE-134 (Use of Externally-Controlled
  Format String)\n\nDescription: When validating a received CMP message, ossl_cmp_msg_check_update()\n\
  converts the peer-supplied sender distinguished name with X509_NAME_oneline()\n\
  and passes it directly as the format argument to ERR_raise_data(). Percent\ncharacters
  survive the conversion, so a sender DN such as \"CN=%s%n\" reaches\nBIO_vsnprintf()
  as an attacker-controlled format string with no matching variadic\narguments. This
  path is only reached when the caller configures an expected\nsender or pins a server
  certificate, which is the normal configuration for a\nCMP client validating server
  responses."
