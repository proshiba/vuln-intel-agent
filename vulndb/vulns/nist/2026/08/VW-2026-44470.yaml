title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc3-control: Fix TOCTOU in bytes_put and bytes_get\n\nIn sof_ipc3_bytes_put(),
  the size used for the memcpy is derived from\nthe old data->size already in the
  buffer, not the incoming new data's\nsize field. If the new data has a different
  size, the copy length is\nwrong: it may truncate valid data or copy stale bytes.\n\
  \nSimilarly, sof_ipc3_bytes_get() checks data->size against max_size\nwithout accounting
  for the sizeof(struct sof_ipc_ctrl_data) offset\nof the flex array within the allocation.\n\
  \nFix bytes_put to validate and use the incoming data's sof_abi_hdr.size\nfrom ucontrol
  before copying. Fix bytes_get to subtract sizeof(*cdata)\nfrom the bounds check
  to match the actual available space."
