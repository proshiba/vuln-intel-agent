title: ArcadeDB before 26.8.1 fails to bind the authenticated principal on the 
  gRPC transaction executor thread in beginTransaction, allowing authenticated 
  readers to execute JavaScript commands without scripting authorization checks.
  Attackers can execute executeCommand with a transaction ID to run unrestricted
  JavaScript that creates server-wide administrator accounts.
