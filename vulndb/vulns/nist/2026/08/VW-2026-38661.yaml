title: The Gutena Forms – Contact Form, Survey Form, Feedback Form, Booking 
  Form, and Custom Form Builder plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 1.9.0. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for unauthenticated attackers to modify the 
  read/unread status of or permanently trash arbitrary form submission entries 
  belonging to any form. The nonce issued by check_ajax_referer() does not 
  function as an authorization barrier because the nonce action 'gutena_Forms' 
  is emitted to unauthenticated visitors via wp_localize_script() on any public 
  page that contains a Gutena Forms block, making it freely obtainable by 
  anonymous attackers.
