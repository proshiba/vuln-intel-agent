title: NLTK 3.9.4 through 3.10.2 contains a path traversal vulnerability in 
  CrubadanCorpusReader. _load_lang_ngrams joins the corpus root with 
  crubadan_code, the column-0 value read from the corpus table.txt mapping file,
  and opens the result with the builtin open() rather than the pathsec-validated
  opener, so os.path.join discards the root when that value is absolute and the 
  read escapes the corpus directory without the containment check nltk.pathsec 
  applies when ENFORCE is set. An attacker who controls a corpus package can 
  disclose file contents outside the corpus root through lang_freq, limited to 
  paths ending in -3grams.txt whose contents parse as token count lines.
