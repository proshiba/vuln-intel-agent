title: "The user self-signup flow in multiple WSO2 products fails to adequately validate
  user-supplied input. This weakness allows arbitrary unvalidated data to be included
  within user claims, which are then used by downstream processes.\n\nAllowing unvalidated
  input into user claims can lead to various security risks. Malicious or malformed
  data injected during signup could be processed by other parts of the application,
  potentially enabling attacks such as content manipulation, redirection, user interface
  inconsistencies, unauthorized actions, and data exposure. The actual impact depends
  on how the compromised data is consumed and the privileges associated with the affected
  users."
