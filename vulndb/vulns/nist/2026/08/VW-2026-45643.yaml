title: Grav plugin-api before 1.0.15 contains a script injection vulnerability 
  where the SVG sanitizer only checks for the exact extension 'svg', allowing 
  .svgz and .xhtml files to bypass sanitization and be stored unsanitized. 
  Attackers with api.media.write permission can upload files containing 
  executable script payloads that execute in the site origin when accessed by 
  administrators or visitors.
