title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/vmalloc:
  acquire init_mm lock on huge vmap to avoid ptdump UAF\n\nPatch series \"mm: fix
  UAF caused by race between ptdump and vmap pgtable\nfreeing\", v6.\n\nKernel page
  table walkers fall into two broad categories - those ranges\nwhere no exclusion
  is required via walk_kernel_page_table_range_lockless()\nand those where exclusion
  is required via walk_kernel_page_table_range()\nor walk_page_range_debug().\n\n\
  The former category is used only by arm64 arch code operating on ranges it\nboth
  wholly owns and does not concurrently write.\n\nThe latter category consists of
  kernel page table walkers operating on\nranges that are wholly owned (but which
  need exclusion against concurrent\nwriters).\n\nThe lock used for exclusion is the
  mmap lock, and for kernel ranges this\nis the mmap lock on init_mm.\n\nptdump is
  a special case being both the only user of\nwalk_page_range_debug(), and the only
  case in which it walks ranges it\ndoes not own.\n\nThi"
