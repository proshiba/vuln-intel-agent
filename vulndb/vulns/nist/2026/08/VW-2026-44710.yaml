title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  fsl: fsl_audmix: Validate written enum values\n\nfsl_audmix_put_mix_clk_src() and
  fsl_audmix_put_out_src()\nconvert the user-provided enum item with snd_soc_enum_item_to_val()\n\
  before checking whether the item is within the enum's item count.\n\nThe generic
  snd_soc_put_enum_double() helper performs that\nvalidation, but these callbacks
  use the converted value first: the\nclock-source path tests it with BIT(), and the
  output-source path\nindexes the prms transition table with it.\n\nReject out-of-range
  enum items before converting them."
