title: MongoSQL Transition Readiness Tool does not sufficiently encode database 
  metadata before including it in generated HTML. A MongoDB user with write 
  access can introduce crafted metadata that may cause script code to run when 
  another user generates and opens the report, potentially exposing report 
  contents or altering its display.
