title: The Meeting Room Booking System (MRBS) is a PHP-based application for 
  booking meeting rooms. Prior to version 1.12.2, an unauthenticated request can
  be made to redirect the user to a query-specified location. This allows an 
  attacker to create a specially-crafted URL to an MRBS installation that will 
  cause the user who clicks it to be redirected to the attacker-specified 
  redirect URL, which could be a spoofed MRBS login page, for example. Version 
  1.12.2 contains a fix. No known workarounds are available.
