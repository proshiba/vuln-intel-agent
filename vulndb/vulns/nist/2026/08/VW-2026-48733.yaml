title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  validate launch-time metadata size\n\nLaunch-time metadata extends beyond the first
  16 bytes of struct\nxsk_tx_metadata. Reject the request when the registered metadata
  area does\nnot contain the complete field.\n\nSnapshot the validated flags for the
  generic transmit path and use that\nsnapshot for request and completion processing,
  avoiding inconsistent\ndecisions if user space changes the flags concurrently.\n\
  \nNote that only xsk_skb_metadata is properly using the flags,\n__xsk_buff_get_metadata
  ignores them. Next commits address that."
