title: IBM Langflow OSS 1.0.0 through 1.11.1 allows an authenticated attacker to
  execute arbitrary operating system commands in the server process by saving a 
  flow with a crafted type field value and triggering a build of a wrapper flow 
  that references it. This allowed privilege escalation from "authenticated flow
  user" to arbitrary OS-level command execution under the server process 
  identity, bypassing the LANGFLOW_ALLOW_CUSTOM_COMPONENTS=false policy control.
