title: A security vulnerability has been detected in Open5GS 2.8.0. Affected by 
  this issue is the function hss_ogs_diam_s6a_air_cb of the file 
  src/hss/hss-s6a-path.c of the component S6a Authentication-Information-Request
  Handler. Such manipulation of the argument Visited-PLMN-Id leads to heap-based
  buffer overflow. The attack may be performed from remote. The name of the 
  patch is a9c82ee0b590d76a581b0580cb46b598984e2392. A patch should be applied 
  to remediate this issue.
