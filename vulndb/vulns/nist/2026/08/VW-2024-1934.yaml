title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm,
  thp: bail out early in collapse_file for writeback page\n\nCurrently collapse_file
  does not explicitly check PG_writeback, instead,\npage_has_private and try_to_release_page
  are used to filter writeback\npages.  This does not work for xfs with blocksize
  equal to or larger\nthan pagesize, because in such case xfs has no page->private.\n\
  \nThis makes collapse_file bail out early for writeback page.  Otherwise,\nxfs end_page_writeback
  will panic as follows.\n\n  page:fffffe00201bcc80 refcount:0 mapcount:0 mapping:ffff0003f88c86a8
  index:0x0 pfn:0x84ef32\n  aops:xfs_address_space_operations [xfs] ino:30000b7 dentry
  name:\"libtest.so\"\n  flags: 0x57fffe0000008027(locked|referenced|uptodate|active|writeback)\n\
  \  raw: 57fffe0000008027 ffff80001b48bc28 ffff80001b48bc28 ffff0003f88c86a8\n  raw:
  0000000000000000 0000000000000000 00000000ffffffff ffff0000c3e9a000\n  page dumped
  because: VM_BUG_ON_PAGE(((unsigned int) page_ref_count(page) + 127"
