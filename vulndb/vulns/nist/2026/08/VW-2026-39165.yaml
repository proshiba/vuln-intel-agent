title: OPNsense before 26.1.9 contains a stored cross-site scripting 
  vulnerability that allows authenticated attackers to inject arbitrary HTML or 
  JavaScript by embedding payloads in the certificate description field via the 
  trust certificate API. The unsanitized description value is persisted and 
  later rendered in the Dashboard Certificates widget through Certificates.js, 
  which interpolates the raw value into HTML attribute and text content sinks 
  without encoding, causing injected scripts to execute in the browser of any 
  authenticated user who views the Dashboard, enabling session hijacking or 
  credential theft.
