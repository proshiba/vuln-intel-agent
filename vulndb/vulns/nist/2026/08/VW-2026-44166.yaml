title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/spufs:
  fix out-of-bounds access in spufs_mem_mmap_access()\n\nspufs_mem_mmap_access() computes
  the local store offset as\naddress - vma->vm_start, but bounds-checks it against
  vma->vm_end\ninstead of the local store size. On 64-bit, offset is always well\n\
  below vma->vm_end, so the clamp never fires and len stays unbounded\nagainst the
  LS_SIZE buffer returned by ctx->ops->get_ls().\n\nReject offsets at or beyond LS_SIZE
  and clamp len to the remaining\nspace, mirroring the guard already used by spufs_mem_mmap_fault()
  and\nspufs_ps_fault()."
