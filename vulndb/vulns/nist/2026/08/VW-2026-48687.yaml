title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninet:
  frags: publish queues before arming timer\n\ninet_frag_create() arms the fragment
  queue timer before inserting the\nqueue into the fqdir rhashtable. If the namespace
  fragment timeout is\nzero or negative, the timer can run before the queue is published.\n\
  \nThe timer callback then marks the queue complete, tries to remove a node\nthat
  is not in the hash table yet, and drops the anticipated hash\nreference. Creation
  can subsequently publish the completed queue without\nrestoring that reference,
  leaving a stale hash node after the caller drops\nthe remaining reference.\n\nPublish
  the queue first and arm the timer while holding the queue lock.\nThis makes timer
  expiry wait until the queue is visible in the hash table,\nso inet_frag_kill() can
  remove the node and balance the hash reference."
