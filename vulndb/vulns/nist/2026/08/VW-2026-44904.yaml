title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Check return value of __register_event() in trace_module_add_events()\n\ntrace_module_add_events()
  ignores the return value of __register_event()\nand unconditionally calls __add_event_to_tracers()
  for each event.\n\nIf __register_event() fails (for example, if event_init() fails),
  the\ntrace_event_call is not added to ftrace_events list, but\n__add_event_to_tracers()
  still creates a trace_event_file pointing to it.\nIf module loading subsequently
  fails and module memory is freed, tracing\nstate retains a stale trace_event_call
  pointer in trace_event_file,\nleading to a use-after-free when tracefs or tracing
  subsystem operations\nare later executed.\n\nFix this by checking the return value
  of __register_event() and only\ncalling __add_event_to_tracers() if event registration
  succeeded."
