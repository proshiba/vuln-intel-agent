title: "Affected versions of cti-transmute allow authenticated users to add or remove
  emoji reactions on comments without first checking whether those users are authorized
  to view the target comment.\n\n\nThe vulnerable react() handler passed an attacker-controlled
  comment_id directly to comments_repo.toggle_reaction() after only validating that
  the ID existed syntactically and that the requested emoji was permitted. Because
  comment-level visibility was not enforced, a user who could identify the ID of a
  private or otherwise inaccessible comment could modify reaction state on that comment
  despite lacking permission to access it.\n\n\nThe fix retrieves the target comment,
  rejects missing or deleted comments, retrieves its associated conversion, and enforces
  access.can_see_comment(current_user, comment, conversion). Unauthorized requests
  now receive HTTP 403."
