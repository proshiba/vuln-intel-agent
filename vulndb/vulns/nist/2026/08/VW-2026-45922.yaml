title: ePA 3.x Integration implements the authorization workflow and writes 
  Medical Information Objects to Germany's electronic patient record. Prior to 
  1.3.0, ePA 3.x Integration does not neutralize CRLF characters in values used 
  by app/vau/VAUProtokoll.py to construct VAU inner HTTP requests. The 
  build_inner_header function interpolates the uri, host, accept_type, 
  content_type, content_length, USER_AGENT, and insurant_id values into request 
  lines and headers, including x-useragent and x-insurantid. An authenticated 
  attacker who controls a value can inject additional headers into the inner 
  request. Depending on ePA server handling, an injected x-insurantid header can
  expose another patient's records, and injected Authorization headers can 
  bypass the intended authentication or authorization context. Session-derived 
  USER_AGENT input can also poison requests across the session. This issue is 
  fixed in version 1.3.0.
