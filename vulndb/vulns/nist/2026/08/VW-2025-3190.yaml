title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/bnxt_re:
  Prevent handling any completions after qp destroy\n\nHW may generate completions
  that indicates QP is destroyed.\nDriver should not be scheduling any more completion
  handlers\nfor this QP, after the QP is destroyed. Since CQs are active\nduring the
  QP destroy, driver may still schedule completion\nhandlers. This can cause a race
  where the destroy_cq and poll_cq\nrunning simultaneously.\n\nSnippet of kernel panic
  while doing bnxt_re driver load unload in loop.\nThis indicates a poll after the
  CQ is freed. \n\n[77786.481636] Call Trace:\n[77786.481640]  <TASK>\n[77786.481644]
   bnxt_re_poll_cq+0x14a/0x620 [bnxt_re]\n[77786.481658]  ? kvm_clock_read+0x14/0x30\n\
  [77786.481693]  __ib_process_cq+0x57/0x190 [ib_core]\n[77786.481728]  ib_cq_poll_work+0x26/0x80
  [ib_core]\n[77786.481761]  process_one_work+0x1e5/0x3f0\n[77786.481768]  worker_thread+0x50/0x3a0\n\
  [77786.481785]  ? __pfx_worker_thread+0x10/0x10\n[77786.481790]  kthread+0xe2/"
