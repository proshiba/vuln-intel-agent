title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  under NFSv4.1, fix double svc_xprt_put on rpc_create failure\n\nOn error situation
  `clp->cl_cb_conn.cb_xprt` should not be given\na reference to the xprt otherwise
  both client cleanup and the\nerror handling path of the caller call to put it. Better
  to\ndelay handing over the reference to a later branch.\n\n[   72.530665] refcount_t:
  underflow; use-after-free.\n[   72.531933] WARNING: CPU: 0 PID: 173 at lib/refcount.c:28
