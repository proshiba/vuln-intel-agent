  that is affected is 11.2.25.0.000. Difficult to exploit vulnerability allows high
  privileged attacker with logon to the infrastructure where Oracle Hyperion Infrastructure
  Technology executes to compromise Oracle Hyperion Infrastructure Technology.  Successful
  attacks of this vulnerability can result in  unauthorized update, insert or delete
  access to some of Oracle Hyperion Infrastructure Technology accessible data as well
