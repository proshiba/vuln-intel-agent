title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  atlantic: free stranded TX buffers on ring deinit\n\naq_vec_deinit() drains the
  TX rings with a single aq_ring_tx_clean()\ncall, which frees at most AQ_CFG_TX_CLEAN_BUDGET
  (256) descriptors and\nstops at hw_head, which no longer moves once aq_vec_stop()
  has stopped\nthe hardware and NAPI. Completed descriptors beyond the budget and\n\
  everything still posted in [hw_head, sw_tail) keep their skb or\nxdp_frame when
  the interface goes down: aq_vec_ring_free() then frees\nthe buffer ring and the
  references are lost for good.\n\nToday this is a silent memory leak on every interface
  down under\nTX/XDP_TX load. With the conversion of the RX path to page_pool posted\n\
