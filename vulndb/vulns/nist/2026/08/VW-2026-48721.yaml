title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  fix TFO max_qlen accounting across reuseport migration\n\nA listener's TCP_FASTOPEN
  max_qlen stops being accurate and lets through\nfar more pending Fast Open requests
  than it was configured for.\n\nThis only shows up with SO_REUSEPORT listener migration,
  where closing a\nlistener hands its still-pending TFO children over to a surviving
  one.\n\nfastopenq.qlen is charged in tcp_fastopen_create_child() when the child\n\
  is created and uncharged in reqsk_fastopen_remove() when the handshake\ncompletes.\
  \  The uncharge follows rsk_listener of the request the child\npoints at, and inet_reqsk_clone()
  has repointed the child at a new\nrequest owned by the new listener, so the ++ and
  the -- land on two\ndifferent sockets.  The new listener's qlen drifts negative
  and its\nlimit no longer binds.\n\nCharge the new listener during migration, like
  reqsk_queue_migrated()\nalready does for queue->young and queue->qlen."
