title: 'A vulnerability has been found in Webkul Bagisto up to 2.4.4. Affected by
  this vulnerability is an unknown functionality of the file /customer/account/rma/update-status
  of the component RMA State Validation. The manipulation leads to enforcement of
  behavioral workflow. The attack may be initiated remotely. The exploit has been
  disclosed to the public and may be used. The vendor confirms: "The reported issues
  were already identified through our internal security assessment process prior to
  this notification and are being handled through our established internal security
  and development lifecycle. Some of these items have already been addressed, while
  the remaining items are planned for resolution in upcoming product releases."'
