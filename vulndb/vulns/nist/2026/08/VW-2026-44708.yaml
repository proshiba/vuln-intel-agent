title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  topology: Check PCM and DAI name strings before use\n\nTopology objects store several
  PCM and DAI names in fixed-size UAPI\narrays. Other topology parser paths validate
  these fields with bounded\nstrnlen() checks before using them as C strings, but
  the PCM and DAI\npaths still pass some fixed-size arrays directly to strlen(),\n\
  devm_kstrdup(), DAI lookup, and diagnostic prints.\n\nA malformed topology blob
  with a non-NUL-terminated PCM, DAI, or stream\ncapability name can therefore make
  the parser read past the end of the\nfixed-size field.\n\nReject unterminated PCM
  and DAI name fields before consuming them as C\nstrings."
