title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/cpum_sf:
  Handle CPU hotplug remove during sampling\n\nCPU hotplug remove handling triggers
  the following function\ncall sequence:\n\n   CPUHP_AP_PERF_S390_SF_ONLINE  --> s390_pmu_sf_offline_cpu()\n\
  \   ...\n   CPUHP_AP_PERF_ONLINE          --> perf_event_exit_cpu()\n\nThe s390
  CPUMF sampling CPU hotplug handler invokes:\n\n s390_pmu_sf_offline_cpu()\n +-->\
  \  cpusf_pmu_setup()\n       +--> setup_pmc_cpu()\n            +--> deallocate_buffers()\n\
  \nThis function de-allocates all sampling data buffers (SDBs) allocated\nfor that
  CPU at event initialization. It also clears the\nPMU_F_RESERVED bit. The CPU is
  gone and can not be sampled.\n\nWith the event still being active on the removed
  CPU, the CPU event\nhotplug support in kernel performance subsystem triggers the\n\
  following function calls on the removed CPU:\n\n  perf_event_exit_cpu()\n  +-->
  perf_event_exit_cpu_context()\n       +--> __perf_event_exit_context()\n\t    +-->
  __perf_remove_from_co"
