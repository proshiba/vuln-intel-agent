title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  act_api: fix TOCTOU NULL deref on a->goto_chain\n\ntcf_action_exec() handles TC_ACT_GOTO_CHAIN
  by first checking\nrcu_access_pointer(a->goto_chain) and then calling\ntcf_action_goto_chain_exec(),
  which does a second, independent\nrcu_dereference_bh(a->goto_chain) read and immediately
  dereferences\nchain->filter_chain. A concurrent tcf_action_set_ctrlact() (e.g. the
  gact\nreplace path) can clear a->goto_chain between the two reads, so the second\n\
  read returns NULL and tcf_action_goto_chain_exec() dereferences NULL.\n\nFix the
  race by doing a single rcu_dereference_bh() read of a->goto_chain\nin tcf_action_exec(),
  checking it once for NULL, and passing the resulting\nchain pointer into tcf_action_goto_chain_exec().
  This turns the split\ncheck/use into a single check/use on one value."
