title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  softing: fw_parse(): validate firmware record spans\n\nfw_parse() reads a fixed
  record header, a firmware-provided payload,\nand a trailing checksum without knowing
  the end of the firmware blob. A\ntruncated record can therefore make those reads
  exceed the blob.\n\nThe same record also supplies addresses and lengths for writes
  into\nDPRAM. The generic loader uses wrap-prone mixed signed arithmetic for its\n\
  bounds check, while the application loader does not bound the staging\ncopy at all.\n\
  \nPass the firmware end to the parser and validate the full source record.\nUse
  a signed wide offset for generic DPRAM records and validate the\napplication staging
  span against the mapped DPRAM before copying."
