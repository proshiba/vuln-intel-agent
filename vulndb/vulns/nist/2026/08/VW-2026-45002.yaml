title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack_sip: widen NAT rewrite delta to s32 in sip_help_tcp()\n\nsip_help_tcp()
  stores the size change of each NAT-rewritten SIP message\nin s16 diff and accumulates
  it in s16 tdiff, but a single message can\ngrow by more than S16_MAX while the packet
  stays under the 65535\nenlarge_skb() limit: nf_nat_sip() rewrites every matching
  URI, and a long\nContact list expands the message by tens of kilobytes. diff then
  wraps,\nand \"datalen = datalen + diff - msglen\" yields a huge unsigned datalen,\n\
  so the next iteration's ct_sip_get_header() reads past the linearized skb\ntail.\n\
  \nWiden diff, tdiff and the seq_adjust hook to s32. Both are bounded by the\n65535
  byte packet limit, and the seqadj core is already s32\n(nf_ct_seqadj_set() takes
  s32), so no previously accepted input is\nrejected.\n\n  BUG: KASAN: use-after-free
  in ct_sip_get_header (net/netfilter/nf_conntrack_sip.c:464)\n  Read of size 1 at
  addr ffff888010800000 by "
