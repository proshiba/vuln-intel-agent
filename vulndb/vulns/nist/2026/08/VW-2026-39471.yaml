  Discovery Server (LDS) is built with multicast discovery enabled through the 
  MDNSD backend. An unauthenticated remote attacker can send a RegisterServer or
  RegisterServer2 request containing many unique discoveryUrls. This allows 
  remote attackers to cause a denial of service.
