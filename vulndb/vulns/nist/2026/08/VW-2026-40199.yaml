title: OpenChamber 1.11.7 contains an unauthenticated remote code execution 
  vulnerability that allows remote attackers to execute arbitrary shell commands
  by sending crafted POST requests to the /api/fs/exec endpoint, which passes 
  commands verbatim to Node.js spawn() without any allowlist, blocklist, or 
  argument validation. The authentication middleware becomes a no-op when 
  UI_PASSWORD is not configured, matching the default Docker deployment, 
  enabling attackers to execute arbitrary OS commands as the application user 
  and retrieve full command output including stdout, stderr, and exit code from 
  the server response.
