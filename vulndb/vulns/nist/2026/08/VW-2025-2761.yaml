title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/core:
  Fix ib block iterator counter overflow\n\nWhen registering a new DMA MR after selecting
  the best aligned page size\nfor it, we iterate over the given sglist to split each
  entry to smaller,\naligned to the selected page size, DMA blocks.\n\nIn given circumstances
  where the sg entry and page size fit certain\nsizes and the sg entry is not aligned
  to the selected page size, the\ntotal size of the aligned pages we need to cover
  the sg entry is >= 4GB.\nUnder this circumstances, while iterating page aligned
  blocks, the\ncounter responsible for counting how much we advanced from the start
  of\nthe sg entry is overflowed because its type is u32 and we pass 4GB in\nsize.
  This can lead to an infinite loop inside the iterator function\nbecause the overflow
  prevents the counter to be larger\nthan the size of the sg entry.\n\nFix the presented
  problem by changing the advancement condition to\neliminate overflow.\n\nBacktrace:\n\
  [  192.37432"
