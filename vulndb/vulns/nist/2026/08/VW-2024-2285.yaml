title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  add missing check_func_arg_reg_off() to prevent out-of-bounds memory accesses\n\n\
  Currently, it's possible to pass in a modified CONST_PTR_TO_DYNPTR to\na global
  function as an argument. The adverse effects of this is that\nBPF helpers can continue
  to make use of this modified\nCONST_PTR_TO_DYNPTR from within the context of the
  global function,\nwhich can unintentionally result in out-of-bounds memory accesses
  and\ntherefore compromise overall system stability i.e.\n\n[  244.157771] BUG: KASAN:
