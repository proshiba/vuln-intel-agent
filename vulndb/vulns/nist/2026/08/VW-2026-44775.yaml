title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix fast commit wait/wake bit mapping on 64-bit\n\nOn 64-bit, ext4 dynamic inode
  states live in the upper half of i_flags,\nand ext4_test_inode_state() applies the
  corresponding +32 offset.\n\nThe fast-commit wait and wake paths open-coded the
  wait key with the raw\nEXT4_STATE_* value. Add small helpers for the state wait
  word and bit,\nand use them for the FC_COMMITTING and FC_FLUSHING_DATA waits so
  the wait\nkey follows the same mapping as the state helpers."
