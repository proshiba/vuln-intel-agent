title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/gup:
  fix gup_pud_range() for dax\n\nFor dax pud, pud_huge() returns true on x86. So the
  function works as long\nas hugetlb is configured. However, dax doesn't depend on
  hugetlb.\nCommit 414fd080d125 (\"mm/gup: fix gup_pmd_range() for dax\") fixed\n\
  devmap-backed huge PMDs, but missed devmap-backed huge PUDs. Fix this as\nwell.\n\
  \nThis fixes the below kernel panic:\n\ngeneral protection fault, probably for non-canonical
  address 0x69e7c000cc478: 0000 [#1] SMP\n\t< snip >\nCall Trace:\n<TASK>\nget_user_pages_fast+0x1f/0x40\n\
  iov_iter_get_pages+0xc6/0x3b0\n? mempool_alloc+0x5d/0x170\nbio_iov_iter_get_pages+0x82/0x4e0\n\
  ? bvec_alloc+0x91/0xc0\n? bio_alloc_bioset+0x19a/0x2a0\nblkdev_direct_IO+0x282/0x480\n\
  ? __io_complete_rw_common+0xc0/0xc0\n? filemap_range_has_page+0x82/0xc0\ngeneric_file_direct_write+0x9d/0x1a0\n\
