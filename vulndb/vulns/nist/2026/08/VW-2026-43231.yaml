title: An improper validation vulnerability in the instancePostMigration 
  function in lxd/instance_post.go of LXD allows an authenticated attacker with 
  can_create_instances permissions on a restricted project to bypass 
  project-level security restrictions. When migrating an instance between 
  projects, LXD fails to validate the instance's configuration against the 
  target project's enforced restrictions (such as 
  restricted.containers.lowlevel, restricted.devices.*, and 
  restricted.networks.access). An attacker can exploit this by creating a 
  disallowed or high-privilege instance in an unrestricted project and 
  subsequently moving it into the restricted project.
