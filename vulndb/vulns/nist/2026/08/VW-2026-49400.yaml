title: A weakness has been identified in dekdee adobe-xd-mcp 1.0.0. Impacted is 
  an unknown function of the file src/parsers/xd-parser.ts of the component 
  file-access-from-request Endpoint. Executing a manipulation of the argument 
  outputFile/outputDir can lead to path traversal. It is possible to launch the 
  attack remotely. The exploit has been made available to the public and could 
  be used for attacks. The project was informed of the problem early through an 
  issue report but has not responded yet.
