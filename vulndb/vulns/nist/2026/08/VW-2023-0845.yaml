title: "User authentication with username and password credentials is ineffective
  in OpenText (Micro Focus) Visual COBOL, COBOL Server, Enterprise Developer, and
  Enterprise Server (including product variants such as Enterprise Test Server), versions
  7.0 patch updates 19 and 20, 8.0 patch updates 8 and 9, and 9.0 patch update 1,
  when LDAP-based authentication is used with certain configurations. When the vulnerability
  is active, authentication succeeds with any valid username, regardless of whether
  the password is correct; it may also succeed with an invalid username (and any password).
  This allows an attacker with access to the product to impersonate any user.\n\n\
