title: In Apache CXF's DefaultEncryptingCodeDataProvider, a captured 
  authorization code can be redeemed an unlimited number of times due to a flaw 
  in the implementation of the removeCodeGrant functionality. This violates the 
  RFC requirement that "The authorization code MUST NOT be used more than once."
  Users are recommended to upgrade to versions 4.2.3 or 4.1.8 or 3.6.12, which 
  fix this issue.
