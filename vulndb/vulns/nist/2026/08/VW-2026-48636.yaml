title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntls:
  rx: restore msg_iter before TLS 1.3 optimistic retry\n\ntls_decrypt_sg() advances
  msg->msg_iter when it maps user pages for\nthe optimistic TLS 1.3 zero-copy path.
  If the decrypted record turns\nout not to be unpadded application data, tls_decrypt_sw()
  retries into\na kernel skb, but leaves the iterator advanced.\n\nThe subsequent
  copy from the skb then writes decrypted bytes again at\na later point in the caller
  iovecs while recvmsg() reports only the\npost-retry length. A TLS peer can trigger
  this after the receiver\nenables TLS_RX_EXPECT_NO_PAD.\n\nRevert the iterator by
  the number of bytes consumed by the optimistic\nmapping before retrying without
  zero-copy.\n\nAdd a selftest which sends a TLS 1.3 control record with\nTLS_RX_EXPECT_NO_PAD
  enabled and verifies that recvmsg() does not\noverwrite later iovecs beyond the
  returned length."
