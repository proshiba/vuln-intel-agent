title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvmxnet3:
  disable rx data ring on dma allocation failure\n\nWhen vmxnet3_rq_create() fails
  to allocate memory for rq->data_ring.base,\nthe subsequent call to vmxnet3_rq_destroy_all_rxdataring
  does not reset\nrq->data_ring.desc_size for the data ring that failed, which presumably\n\
  causes the hypervisor to reference it on packet reception.\n\nTo fix this bug, rq->data_ring.desc_size
  needs to be set to 0 to tell\nthe hypervisor to disable this feature.\n\n[   95.436876]
  kernel BUG at net/core/skbuff.c:207!\n[   95.439074] invalid opcode: 0000 [#1] PREEMPT
