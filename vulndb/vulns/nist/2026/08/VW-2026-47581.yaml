title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. Prior to 2.3.2, the terminal 
  WebSocket accepts a user-controlled hostConfig.id and 
  src/backend/ssh/host-resolver.ts resolves that host without requiring 
  ownership or explicit access. When no credential is shared with the requester,
  resolveHostById performs an owner credential fallback, and 
  src/backend/ssh/terminal.ts combines that credential with attacker-controlled 
  ip, port, and username values. An authenticated low-privileged user can 
  therefore make Termix authenticate to an attacker-controlled SSH server and 
  disclose another user's stored SSH password or private-key material while the 
  victim user's data key is unlocked. This issue is fixed in version 2.3.2.
