title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix mbss changed flags corruption on 32 bit systems\n\nOn 32-bit systems,
  the size of an unsigned long is 4 bytes,\nwhile a u64 is 8 bytes. Therefore, when
  using\nor_each_set_bit(bit, &bits, sizeof(changed) * BITS_PER_BYTE),\nthe code is
  incorrectly searching for a bit in a 32-bit\nvariable that is expected to be 64
  bits in size,\nleading to incorrect bit finding.\n\nSolution: Ensure that the size
  of the bits variable is correctly\nadjusted for each architecture.\n\n Call Trace:\n\
  \  ? show_regs+0x54/0x58\n  ? __warn+0x6b/0xd4\n  ? ieee80211_link_info_change_notify+0xcc/0xd4
  [mac80211]\n  ? report_bug+0x113/0x150\n  ? exc_overflow+0x30/0x30\n  ? handle_bug+0x27/0x44\n\
  \  ? exc_invalid_op+0x18/0x50\n  ? handle_exception+0xf6/0xf6\n  ? exc_overflow+0x30/0x30\n\
  \  ? ieee80211_link_info_change_notify+0xcc/0xd4 [mac80211]\n  ? exc_overflow+0x30/0x30\n\
  \  ? ieee80211_link_info_change_notify+0xcc/0xd4 [mac80211]\n  ? ieee80211_mesh_work+0xff"
