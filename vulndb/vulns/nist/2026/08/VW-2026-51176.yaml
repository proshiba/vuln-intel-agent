title: Trilium is an open-source hierarchical note-taking application. In 
  versions up to and including 0.103.0, the public share-search endpoint does 
  not enforce the per-note shareCredentials and shareHiddenFromTree controls, 
  allowing an unauthenticated visitor to read the titles, tree paths, and 
  content of protected shared notes. The endpoint authorizes only the ancestor 
  note supplied in the request and then runs a full-text search across the 
  entire published subtree, returning each matching note's title, share 
  identifier, and hierarchical path without re-checking whether that individual 
  note requires a share password or is hidden from the navigation tree. Because 
  the search matches note content, an attacker can enumerate protected notes and
  use the endpoint as a boolean oracle that confirms arbitrary substrings, 
  recovering the full contents of notes that should be gated behind a password. 
  This issue is fixed in version 0.104.0.
