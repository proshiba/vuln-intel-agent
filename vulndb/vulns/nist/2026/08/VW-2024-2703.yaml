title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_event: Fix using rcu_read_(un)lock while iterating\n\nThe usage of rcu_read_(un)lock
  while inside list_for_each_entry_rcu is\nnot safe since for the most part entries
  fetched this way shall be\ntreated as rcu_dereference:\n\n\tNote that the value
  returned by rcu_dereference() is valid\n\tonly within the enclosing RCU read-side
  critical section [1]_.\n\tFor example, the following is **not** legal::\n\n\t\t\
  rcu_read_lock();\n\t\tp = rcu_dereference(head.next);\n\t\trcu_read_unlock();\n\t
  \tx = p->address;\t/* BUG!!! */\n\t\trcu_read_lock();\n\t\ty = p->data;\t/* BUG!!!
  */\n\t\trcu_read_unlock();"
