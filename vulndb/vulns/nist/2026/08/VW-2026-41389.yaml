title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  fix use-after-free on workqueue during remove\n\nIn pdsc_remove(), the workqueue
  is destroyed before pdsc_teardown()\nis called. This ordering allows two paths to
  queue work on the\ndestroyed workqueue:\n\n1. If pdsc_teardown() -> pdsc_devcmd_reset()
  times out, the error\n   path in pdsc_devcmd_locked() queues health_work.\n\n2.
  A NotifyQ event can trigger the ISR and queue work before free_irq()\n   is called
  in pdsc_teardown().\n\nFix by moving destroy_workqueue() after pdsc_teardown() so
  the\nworkqueue outlives every queuer; destroy_workqueue() then flushes any\nwork
  still pending.\n\nDraining the queued work also requires ordering the teardown so
  the\nresources that work touches are freed last:\n\n  - In pdsc_qcq_free(), after
  freeing the interrupt, cancel_work_sync()\n    the queue's work and only then clear
  qcq->intx, so\n    pdsc_process_adminq()'s read of qcq->intx for interrupt-credit\n\
  \    return cannot race with the cle"
