title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB reads in rtw_get_wps_ie()\n\nrtw_get_wps_ie() iterates over IE
  data from network frames without\nvalidating that the IE header and payload fit
  within the remaining\nbuffer before reading them. Specifically:\n\n- in_ie[cnt +
  1] is read without checking cnt + 1 < in_len\n- memcmp(&in_ie[cnt + 2], ...) accesses
  cnt + 2 without bounds check\n- in_ie[cnt + 1] is used as length without verifying
  payload fits\n\nAdd bounds checks at the top of the loop body to break early if
  fewer\nthan 2 bytes remain for the IE header, or if the declared payload\nextends
  past the end of the buffer. Also require at least 4 bytes of\npayload before comparing
  the WPS OUI."
