title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregmap-irq:
  Fix out-of-bounds access when allocating config buffers\n\nWhen allocating the 2D
  array for handling IRQ type registers in\nregmap_add_irq_chip_fwnode(), the intent
  is to allocate a matrix\nwith num_config_bases rows and num_config_regs columns.\n\
  \nThis is currently handled by allocating a buffer to hold a pointer for\neach row
  (i.e. num_config_bases). After that, the logic attempts to\nallocate the memory
  required to hold the register configuration for\neach row. However, instead of doing
  this allocation for each row\n(i.e. num_config_bases allocations), the logic erroneously
  does this\nallocation num_config_regs number of times.\n\nThis scenario can lead
  to out-of-bounds accesses when num_config_regs\nis greater than num_config_bases.
  Fix this by updating the terminating\ncondition of the loop that allocates the memory
  for holding the register\nconfiguration to allocate memory only for each row in
  the matrix.\n\nAmit Pund"
