title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: add missing rcu list annotations and operations\n\nsashiko-bot remarked the
  missing use of list_add_rcu() in\nbcm_[rx|tx]_setup() to have a proper initialized
  bcm_op structure\nwhen bcm_proc_show() traverses the bcm_op's under rcu_read_lock().\n\
  \nTo cover all initial settings of the bcm_op's the list_add_rcu() calls\nare moved
  to the end of the setup code.\n\nWhile at it, also fix the mirroring removal side:
  bcm_release() called\nbcm_remove_op() - which frees the op via call_rcu() - on ops
  that were\nstill linked in bo->tx_ops/bo->rx_ops, without list_del_rcu() first.\n\
  Unlink each op with list_del_rcu() before handing it to bcm_remove_op(),\nmatching
  the existing pattern in bcm_delete_tx_op()/bcm_delete_rx_op()."
