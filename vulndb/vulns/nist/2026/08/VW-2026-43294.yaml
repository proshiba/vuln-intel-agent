title: A flaw was found in search-v2-api. An unauthenticated attacker can 
  exploit this by sending requests with unique random bearer tokens. Each unique
  token creates a permanent entry in the unbounded tokenReviews cache, which is 
  not properly cleared. This can lead to memory exhaustion of the search-api 
  pod, resulting in a Denial of Service (DoS).
