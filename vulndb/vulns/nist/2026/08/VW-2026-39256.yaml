title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  nVMX: Hide shadow VMCS right after VMCLEAR\n\nfree_nested() frees the shadow VMCS
  while vmcs01 still points to it. But\nbecause it is asynchronous with respect to
  loaded_vmcs_clear(), the vCPU\nmight migrate before the pointer is cleared and __loaded_vmcs_clear()\n\
  may then execute VMCLEAR.\n\nThe VMCS needs to stay attached until its explicit
  VMCLEAR completes, but\nthen it can be hidden and the page safely freed."
