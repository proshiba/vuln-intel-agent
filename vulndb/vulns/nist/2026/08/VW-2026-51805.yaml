title: IGEL OS 12 before 12.7.6 and IGEL OS 11 before 11.11.150 contain a boot 
  registry parameter injection vulnerability that allows attackers with physical
  access to execute arbitrary Linux loader parameters by writing to an 
  unencrypted and unsigned configuration area read by the signed bootloader. 
  Attackers can inject malicious kernel command line parameters that execute 
  with boot environment privileges without triggering TPM PCR measurement 
  failures, as the attack does not modify the measured boot code.
