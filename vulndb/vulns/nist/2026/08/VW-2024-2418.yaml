title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  lsm: Add check for BPF LSM return value\n\nA bpf prog returning a positive number
  attached to file_alloc_security\nhook makes kernel panic.\n\nThis happens because
  file system can not filter out the positive number\nreturned by the LSM prog using
  IS_ERR, and misinterprets this positive\nnumber as a file pointer.\n\nGiven that
  hook file_alloc_security never returned positive number\nbefore the introduction
  of BPF LSM, and other BPF LSM hooks may\nencounter similar issues, this patch adds
  LSM return value check\nin verifier, to ensure no unexpected value is returned."
