title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, dockerContextPath accepted by 
  apps/dokploy/components/dashboard/application/build/show.tsx flows through 
  getDockerContextPath in packages/server/src/utils/filesystem/directory.ts into
  the unquoted cd command in packages/server/src/utils/builders/docker-file.ts 
  before execution by execAsync, allowing an authenticated application editor to
  execute arbitrary commands on the Dokploy host. This issue is fixed in version
  0.29.13.
