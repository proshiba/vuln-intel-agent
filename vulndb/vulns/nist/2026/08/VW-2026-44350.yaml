title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmips:
  sched: Fix CPUMASK_OFFSTACK memory corruption\n\nThis patch addresses a critical
  memory management flaw. When\nCONFIG_CPUMASK_OFFSTACK is enabled, cpumask_var_t
  is a pointer.\nConsequently, sizeof(new_mask) evaluates to the pointer size, causing\n\
  copy_from_user() to clobber the mask pointer. Furthermore, the old\nlogic performed
  copy_from_user() before allocating the mask.\n\nFix this by allocating new_mask
  first. To handle variable-sized user\nmasks correctly, use cpumask_size() to truncate
  overly large user masks\nor pad undersized masks with zeros before copying the data
  directly into\nthe allocated buffer."
