title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/mmu: Fix use-after-free on vendor module reload\n\nmmu_destroy_caches() destroys
  pte_list_desc_cache and\nmmu_page_header_cache, but leaves both pointers unchanged.\
  \  The pointers\nlive in kvm.ko, and therefore survive when a vendor module is unloaded\n\
  while kvm.ko remains loaded.\n\nIf creation of pte_list_desc_cache fails during
  a subsequent vendor\nmodule load, its assignment sets pte_list_desc_cache to NULL
  and the\nerror path calls mmu_destroy_caches().  mmu_page_header_cache still\npoints
  to the cache destroyed during the preceding vendor module\nunload.  Passing that
  stale pointer to kmem_cache_destroy() causes a\nslab use-after-free.\n\nReproduce
  the issue on a v7.1.3 kernel with CONFIG_KASAN=y,\nCONFIG_KASAN_GENERIC=y, CONFIG_KVM=m,
  and CONFIG_KVM_INTEL=m.  A\none-shot test hook forces pte_list_desc_cache to NULL
  on the second\ninvocation of kvm_mmu_vendor_module_init():\n\n  1. Load kvm.ko and
