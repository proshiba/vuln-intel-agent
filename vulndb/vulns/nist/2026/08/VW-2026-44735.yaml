title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix deadlock cloning inline extent when using flushoncommit\n\nIn commit b48c980b6a7e
  (\"btrfs: fix deadlock between reflink and\ntransaction commit when using flushoncommit\"\
  ) a deadlock was fixed\nbetween reflinks and transaction commits when the fs is
  mounted with the\nflushoncommit option. This happened when we had to copy an inline
  extent's\ndata to the destination file. However the issue was fixed only for the\n\
  case where the destination offset is 0, it missed the case when the offset\nis greater
  than zero.\n\nFix this by ensuring we get i_size update whenever we copied an inline\n\
  extent's data into the destination file.\n\nSyzbot reported this with the following
  trace:\n\n   INFO: task kworker/u8:3:57 blocked for more than 143 seconds.\n   \
  \      Not tainted syzkaller #0\n   \"echo 0 > /proc/sys/kernel/hung_task_timeout_secs\"\
  \ disables this message.\n   task:kworker/u8:3    state:D stack:21600 pid:57   \
  \ tgid:57    ppid:2      "
