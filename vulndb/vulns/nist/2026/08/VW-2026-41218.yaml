title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfscrypt:
  Avoid dynamic allocation in fscrypt_get_devices()\n\nWhen a blk_crypto_key starts
  being used or is evicted, fs/crypto/ calls\nfscrypt_get_devices() to get the filesystem's
  list of block devices,\nthen iterates over them and calls blk_crypto_config_supported(),\n\
  blk_crypto_start_using_key(), or blk_crypto_evict_key() on each one.\n\nCurrently,
  the block device pointers are placed in a dynamically\nallocated array.  This dynamic
  allocation is problematic because:\n\n- It can fail, especially at the fscrypt_destroy_inline_crypt_key()
  call\n  site when it's invoked for inode eviction under direct reclaim.\n\n- fscrypt_destroy_inline_crypt_key()
  doesn't handle the failure.  It\n  just zeroizes and frees the blk_crypto_key without
  calling\n  blk_crypto_evict_key().  That causes a use-after-free.\n\nFor now, let's
  fix this in the straightforward and easily-backportable\nway by switching to an
