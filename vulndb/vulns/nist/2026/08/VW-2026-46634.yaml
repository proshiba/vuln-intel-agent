title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Common Security).   The supported version that is affected
  is 11.2.25.0.000. Easily exploitable vulnerability allows unauthenticated attacker
  with network access via HTTP to compromise Oracle Hyperion Infrastructure Technology.  Successful
  attacks require human interaction from a person other than the attacker. Successful
  attacks of this vulnerability can result in  unauthorized access to critical data
  or complete access to all Oracle Hyperion Infrastructure Technology accessible data.
  CVSS 3.1 Base Score 6.5 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:N/A:N).'
