title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Fix memory leak if ntfs_read_mft failed\n\nLabel ATTR_ROOT in ntfs_read_mft() sets
  is_root = true and\nni->ni_flags |= NI_FLAG_DIR, then next attr will goto label
  ATTR_ALLOC\nand alloc ni->dir.alloc_run. However two states are not always\nconsistent
  and can make memory leak.\n\n 1) attr_name in ATTR_ROOT does not fit the condition
  it will set\n is_root = true but NI_FLAG_DIR is not set.\n 2) next attr_name in
  ATTR_ALLOC fits the condition and alloc\n ni->dir.alloc_run\n 3) in cleanup function
  ni_clear(), when NI_FLAG_DIR is set, it frees\n ni->dir.alloc_run, otherwise it
  frees ni->file.run\n 4) because NI_FLAG_DIR is not set in this case, ni->dir.alloc_run
  is\n leaked as kmemleak reported:\n\nunreferenced object 0xffff888003bc5480 (size
  64):\n  backtrace:\n    [<000000003d42e6b0>] __kmalloc_node+0x4e/0x1c0\n    [<00000000d8e19b8a>]
  kvmalloc_node+0x39/0x1f0\n    [<00000000fc3eb5b8>] run_add_entry+0x18a/0xa40 [ntfs3]\n\
  \    [<000000"
