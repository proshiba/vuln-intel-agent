title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  validate selector family and prefixlen during match\n\nsyzbot reported a shift-out-of-bounds
  in xfrm_selector_match()\ndue to AF_UNSPEC selector with large prefixlen (e.g. 128)
  matched\nagainst IPv4 flow (when XFRM_STATE_AF_UNSPEC is set).\n\nFix this by:\n\
  \n- Rejecting mismatched families in xfrm_selector_match.\n- Returning false in
  addr4_match if prefixlen > 32.\n- Returning false in addr_match if prefixlen > 128
  (prevents overflow)."
