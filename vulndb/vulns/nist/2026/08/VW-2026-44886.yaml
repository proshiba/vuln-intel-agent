title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  Zero the tile state data array before each BIN job\n\nThe binner BO is a single
  16MB buffer split into 512KB slots that are\nhanded out to jobs at submission time
  and recycled as jobs complete,\nwithout ever being cleared. Each slot holds the
  job's Tile State Data\nArray (TSDA) at its start, followed by the tile allocation
  pool.\n\nWhile the tile allocation pool is only walked by the render thread\nthrough
  branches the binner generated during the current job, the\nTSDA is the PTB's own
  per-tile bookkeeping and is consumed by the\nhardware itself. Although the kernel
  sets the \"Auto-initialise Tile\nState Data Array\" flag in the tile binning mode
  configuration, the\nPTB demonstrably still acts on stale tile state left by the
  slot's\nprevious user: the binner ends up creating invalid command streams\nwith
  invalid primitive streams and branches, which can cause GPU hangs\nas observed in
