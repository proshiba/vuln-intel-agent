title: 'A vulnerability in the SSL file policy implementation of Cisco Firepower Threat
  Defense (FTD) Software that occurs when the SSL/TLS connection is configured with
  a URL Category and the Snort 3 detection engine could allow an unauthenticated,
  remote attacker to cause the Snort 3 detection engine to unexpectedly restart. This
  vulnerability exists because a logic error occurs when a Snort 3 detection engine
  inspects an SSL/TLS connection that has either a URL Category configured on the
  SSL file policy or a URL Category configured on an access control policy with TLS
  server identity discovery enabled. Under specific, time-based constraints, an attacker
  could exploit this vulnerability by sending a crafted SSL/TLS connection through
  an affected device. A successful exploit could allow the attacker to trigger an
