title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Preserve pointer state for commuted arithmetic\n\nWhen scalar += pointer is handled
  in adjust_ptr_min_max_vals(), the\ndestination register inherits the pointer state
  from the source pointer.\nCopying only selected fields is fragile because pointer
  provenance is\ntracked by several bpf_reg_state fields.\n\nUse the caller's temporary
  offset register to preserve the scalar operand\nwhile replacing the destination
  with the full pointer state. This preserves\nthe frame number for PTR_TO_STACK registers
  and keeps parent identity\nfields consistent."
