title: Craft CMS 5.0.0-RC1 before 5.10.6 and 4.0.0-RC1 before 4.18.2 contain an 
  arbitrary file read vulnerability. The create() Twig function restricts class 
  instantiation using a 5-entry blocklist that does not include SplFileObject, 
  allowing an authenticated administrator (with allowAdminChanges=true) to 
  configure a malicious entry type title or URI format that instantiates 
  SplFileObject in a non-sandboxed template context. When a user subsequently 
  creates an entry in the affected section, arbitrary files on the server (such 
  as .env containing the security key and database credentials) are read and 
  rendered as entry titles.
