title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngve:
  fix header buffer corruption with header-split and HW-GRO\n\nThe DQO RX datapath
  programs a per-buffer-queue-descriptor\nheader_buf_addr at post time and reads the
  split header back at\ncompletion time. Both the post and the read currently index
  the\nheader buffer by queue position rather than by the buffer's identity:\n\n \
  \ - post (gve_rx_post_buffers_dqo): header_buf_addr is computed from\n    bufq->tail\n\
  \  - read (gve_rx_dqo): the header is read from desc_idx (the completion\n    queue
