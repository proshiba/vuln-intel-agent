title: "Lemonldap::NG::Portal versions from 2.0.0 before 2.16.9, from 2.17.0 before
  2.21.5, from 2.22.0 before 2.23.3 for Perl allow authentication bypass via an OAuth2
  state parameter stored as an SSO session in the GitHub and LinkedIn backends.\n\n\
  Before redirecting to the identity provider, extractFormInfo() creates the state
  session with the positional call `getApacheSession( undef, 1, 0, 'GitHubState' )`.
  getApacheSession() takes a session id followed by a named argument hash, so the
  trailing arguments become that hash, `kind` defaults to SSO, and the state is written
  to the global session storage as a regular SSO session. Its identifier is handed
  to the unauthenticated visitor as the state parameter of the redirection URL.\n\n\
