title: An attacker that can get Dovecot to relay a message, for example through 
  Sieve redirect or submission relay, can use a crafted line ending in the 
  message body to bypass the outbound protection that prevents message content 
  from being interpreted as SMTP commands. A downstream mail server that hasn't 
  yet fixed the SMTP smuggling vulnerability can be tricked into treating part 
  of the message body as new SMTP commands, allowing injection of spoofed email.
  This is the same vulnerability class as CVE-2023-51764 and CVE-2023-51766. 
  Where you control the receiving mail servers, ensure they reject bare carriage
  returns in message data. Update to non-vulnerable version. No publicly 
  available exploits are known.
