title: "Improper neutralization of input during web page generation in Apache Wicket.\n\
  \norg.apache.wicket.extensions.markup.html.form.palette.component.AbstractOptions,
  which renders the two option lists of a Palette, escapes the id and the display
  value of each option according to the escape-model-strings setting, and wrote the
  attribute names and values returned by getAdditionalAttributes into the <option>
  tag as they came.\n\nAn application is affected where it overrides Palette.getAdditionalAttributesForChoices,
  Palette.getAdditionalAttributesForSelection or AbstractOptions.getAdditionalAttributes
  and returns a value holding data an attacker can influence. These methods return
  null by default, so an application that does not override them is not affected.\n\
  \nAs a workaround, escape the values in the override.\n\nThis issue affects Apache
  Wicket: from 8.0.0 through 8.18.0, from 9.0.0 through 9.23.0, from 10.0.0 through
  10.10.0. Older, unsupported releases from 1.4.0 onwards are also affected. User"
