title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenrisc:
  signal: do not restore privileged SR bits on sigreturn\n\nrestore_sigcontext() copies
  the whole supervision register (SR) from the\nsignal frame and only clears SPR_SR_SM
  before the value is reloaded into\nthe hardware SR (through ESR and l.rfe) on the
  return to user space.  All\nother SR bits are left under user control.\n\nAn unprivileged
  task can thus return from a signal handler through a\ncrafted sigframe that clears
  SPR_SR_DME.  With the data MMU disabled the\nCPU performs no translation or protection
  on data accesses, so the task\ngains read and write access to arbitrary physical
  memory, a local\nprivilege escalation.  SPR_SR_IME, SPR_SR_SUMRA, SPR_SR_LEE, SPR_SR_EPH\n\
  and the cache-enable bits are exposed the same way.  The ptrace GPR regset\nalready
  refuses any change to SR for exactly this reason.\n\nRestore only the arithmetic
  flag bits (F, CY, OV) from the signal frame\nand take every privileged control bit
