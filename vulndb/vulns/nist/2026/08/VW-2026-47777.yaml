title: Neo.mjs contains a command injection vulnerability within the 
  FileSystemService.mjs component of the ai/mcp/server/file-system MCP server, 
  where the checkSyntax() and runPlaywrightTest() functions unsafely interpolate
  caller-controlled absolutePath values into shell commands, enabling arbitrary 
  OS command execution when an AI agent is induced to invoke these tools. Commit
  88c77fc fixes these vulnerabilities.
