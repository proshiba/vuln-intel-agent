title: "In the Linux kernel, the following vulnerability has been resolved:\n\nclk:
  clk-loongson2: Fix potential buffer overflow in flexible-array member access\n\n\
  Flexible-array member `hws` in `struct clk_hw_onecell_data` is annotated\nwith the
  `counted_by()` attribute. This means that when memory is\nallocated for this array,
  the _counter_, which in this case is member\n`num` in the flexible structure, should
  be set to the maximum number of\nelements the flexible array can contain, or fewer.\n\
  \nIn this case, the total number of elements for the flexible array is\ndetermined
  by variable `clks_num` when allocating heap space via\n`devm_kzalloc()`, as shown
  below:\n\n289         struct loongson2_clk_provider *clp;\n\t...\n296         for
  (p = data; p->name; p++)\n297                 clks_num++;\n298\n299         clp
  = devm_kzalloc(dev, struct_size(clp, clk_data.hws, clks_num),\n300             \
  \               GFP_KERNEL);\n\nSo, `clp->clk_data.num` should be set to `clks_num`
  or less, and not\nexceed `clks_num`, as is"
