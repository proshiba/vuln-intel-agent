title: "Invocation of Process Using Visible Sensitive Information in Black Duck blackduck-c-cpp
  1.0.17 through 3.0.6 allows an actor able to execute code within the scanned project's
  build to obtain the Black Duck API token via the ambient process environment, which
  is inherited by subprocesses launched during build capture and signature scanning.
  This applies only where the token is supplied through the BLACKDUCK_API_TOKEN or
  BD_HUB_TOKEN environment variable.\n\n\n\nUpgrading does not remediate prior disclosure;
  any token supplied to an affected version through an environment variable should
  be rotated."
