title: filebrowser through 2.63.23 does not remove share records when a shared 
  file is renamed (only deletion triggers share cleanup). The share record is 
  keyed by path, so it survives the rename and remains dormant (returning 404 
  while the path is empty). When any new, unrelated file later appears at the 
  original shared path — via re-upload, another user with create permission, or 
  a hook — the stale public share link serves that new file under the original 
  link's password and expiry settings, unexpectedly exposing it.
