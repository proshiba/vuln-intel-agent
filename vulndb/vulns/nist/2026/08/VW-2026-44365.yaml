title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  bound copy_lcns dp->page_lcns[] index in analysis pass\n\nIn log_replay()'s analysis
  pass, after find_dp() returns a\nvalid DIR_PAGE_ENTRY for the (target_attr, target_vcn)
  tuple,\nthe copy_lcns block walks lrh->lcns_follow further entries:\n\n\tt16 = le16_to_cpu(lrh->lcns_follow);\n\
  \tfor (i = 0; i < t16; i++) {\n\t    size_t j = (size_t)(le64_to_cpu(lrh->target_vcn)
  -\n\t                        le64_to_cpu(dp->vcn));\n\t    dp->page_lcns[j + i]
  = lrh->page_lcns[i];\n\t}\n\nfind_dp() only validates that target_vcn falls within\n\
  [dp->vcn, dp->vcn + dp->lcns_follow), i.e., that the FIRST\ncluster is covered.\
  \  The walk through the further entries is\nnot bounded against dp->lcns_follow.\
  \  For a malformed LRH\nwhere target_vcn = dp->vcn + dp->lcns_follow - 1 and\nlrh->lcns_follow
  > 1, the i > 0 writes overflow the dp's\nallocated page_lcns[] array.\n\nAdd the
  missing j + lrh->lcns_follow <= dp->lcns_follow guard.\n\nReproduced under UML+KASA"
