title: "Missing Authorization, Exposure of Sensitive Information to an Unauthorized
  Actor vulnerability in Apache CloudStack's Userdata reference APIs.\n\nSeveral userdata-related
  APIs in Apache CloudStack, including deleteUserData, linkUserDataToTemplate, resetUserDataForVirtualMachine,
  deployVirtualMachine, and updateVirtualMachine, exhibit missing or insufficient
  access control validation, potentially allowing cross-tenant/cross-account access
  to userdata resources that belong to other tenants.\n\nThis issue affects Apache
  CloudStack: from 4.18.0.0 through 4.20.3.0 and from 4.21.0.0 through 4.22.1.0.\n\
  \nThe deleteCniConfiguration API, introduced in 4.21.0.0, also exhibits similar
  behaviour and lacks access validation.\n\nUsers are recommended to upgrade to version
  4.20.3.1 or 4.22.1.1 or later, which fixes the issue."
