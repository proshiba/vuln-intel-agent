title: "A vulnerability in the TLS handler of Cisco Firepower Threat Defense (FTD)
  Software could allow an unauthenticated, remote attacker to gain access to sensitive
  information.\r\n\r This vulnerability is due to improper implementation of countermeasures
  against a Bleichenbacher attack on a device that uses SSL decryption policies. An
  attacker could exploit this vulnerability by sending crafted TLS messages to an
  affected device, which would act as an oracle and allow the attacker to carry out
  a chosen-ciphertext attack. A successful exploit could allow the attacker to perform
  cryptanalytic operations that may allow decryption of previously captured TLS sessions
  to the affected device."
