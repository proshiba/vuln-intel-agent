title: OpenBK7231T's /cfg_wifi_set endpoint (src/httpserver/http_fns.c) accepts 
  configuration changes via a plain GET request with no CSRF token. If the 
  `web_admin_password_enabled` parameter is absent from the request, an 
  else-branch silently clears the device's web admin password to an empty 
  string. A one-click CSRF payload (e.g. an <img> tag pointing at /cfg_wifi_set 
  with new SSID/password parameters and web_admin_password_enabled omitted) 
  visited by an authenticated admin's browser both hijacks the device's WiFi 
  configuration and disables its web password protection.
