title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Implement bounds check for stream encoder creation in DCN301\n\n'stream_enc_regs'
  array is an array of dcn10_stream_enc_registers\nstructures. The array is initialized
  with four elements, corresponding\nto the four calls to stream_enc_regs() in the
  array initializer. This\nmeans that valid indices for this array are 0, 1, 2, and
  3.\n\nThe error message 'stream_enc_regs' 4 <= 5 below, is indicating that\nthere
  is an attempt to access this array with an index of 5, which is\nout of bounds.
  This could lead to undefined behavior\n\nHere, eng_id is used as an index to access
  the stream_enc_regs array. If\neng_id is 5, this would result in an out-of-bounds
  access on the\nstream_enc_regs array.\n\nThus fixing Buffer overflow error in dcn301_stream_encoder_create\n\
  reported by Smatch:\ndrivers/gpu/drm/amd/amdgpu/../display/dc/resource/dcn301/dcn301_resource.c:1011
  dcn301_stream_encoder_create() error: buffer overflow 'stream_e"
