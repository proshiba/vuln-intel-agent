title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsuper:
  fix emergency thaw deadlock on frozen block devices\n\ndo_thaw_all_callback() calls
  bdev_thaw() while holding sb->s_umount\nexclusively. If the block device was frozen
  via bdev_freeze() dropping\nthe last block layer freeze reference calls fs_bdev_thaw()
  which\nreacquires s_umount:\n\n  do_thaw_all_callback(sb)\n    super_lock_excl(sb)\
  \                     # holds sb->s_umount\n    bdev_thaw(sb->s_bdev)\n      mutex_lock(&bdev->bd_fsfreeze_mutex)\n\
  \      # bd_fsfreeze_count drops 1 -> 0\n      bd_holder_ops->thaw == fs_bdev_thaw\n\
  \        get_bdev_super(bdev)\n          bdev_super_lock(bdev, true)\n         \
  \   super_lock(sb, true)\n              down_write(&sb->s_umount)     # same task:
  deadlock\n\nThe emergency thaw worker deadlocks against itself holding both\ns_umount
  and bd_fsfreeze_mutex. That fscks any subsequent unmount,\nfreeze, or thaw of that
  filesystem and block device.\n\n  [   81.878470] sysrq: Show Blocked State\n  [\
  \   81"
