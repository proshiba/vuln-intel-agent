title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Fix out-of-bounds write in irdma_copy_user_pgaddrs\n\nThe irdma_copy_user_pgaddrs
  function loops through all of the umem DMA\nblocks to populate the PBLEs and will
  stop when either the last DMA\nblock is reached or palloc->total_cnt is reached.
  The issue is that\nthe logic for checking palloc->total_cnt would only work for
  non-zero\nvalues.\n\nWhen irdma_setup_pbles is called with lvl==0, it\ncalls irdma_copy_user_pgaddrs
  with palloc->total_cnt==0, which means\nthe only way to break out of the loop is
  to reach the last umem DMA\nblock, which means it could end up going beyond the
  fixed size of 4\niwmr->pgaddrmem array that is used in the lvl==0 case.\n\nIn the
  case of QP/CQ/SRQ rings, the value of lvl is determined by a\nseparate input (for
