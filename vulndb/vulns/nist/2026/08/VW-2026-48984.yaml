title: adm-zip 0.5.9 through 0.6.0 follows symbolic links at the extraction 
  destination. Utils.sanitize in util/utils.js enforces containment by comparing
  only the string form of an archive entry name against the resolved extraction 
  root, and Utils.writeFileTo opens the computed destination with 
  fs.openSync(path, "w", 0o666), which resolves symbolic links and carries 
  neither O_NOFOLLOW nor a pre-write fs.lstatSync check. When a path component 
  at the destination already exists as a symbolic link pointing outside the 
  extraction root, extractAllTo, extractAllToAsync and extractEntryTo write the 
  entry contents through that link and then chmod its target, placing 
  attacker-controlled content in a file outside the root without any traversal 
  sequence appearing in the archive. Reaching the write requires overwrite to be
  enabled, because the preceding fs.existsSync check also resolves the link and 
