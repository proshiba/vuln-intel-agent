title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Delay module ref count for \"enable_event\" trigger\n\nTriggers are now delayed
  from freeing, but can still be triggered until\nafter the RCU grace period has ended.
  The freeing of the enable_event data\nis put into the private_data_free() callback,
  but the put of the module\nrefcount is done immediately.\n\nIt is possible that
  if a module is removed that has an event that would\nenable (or disable) it is still
  active, it can read the data of the module\nafter it is removed causing a use-after-free
  bug.\n\nMove the trace_event_put_ref() that releases the module into the delayed\n\
  callback so that the module can not be removed until any reference to its\nevents
  are finished."
