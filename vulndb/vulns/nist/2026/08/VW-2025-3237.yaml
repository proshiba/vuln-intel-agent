title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Add overflow check for attribute size\n\nThe offset addition could overflow and
  pass the used size check given an\nattribute with very large size (e.g., 0xffffff7f)
  while parsing MFT\nattributes. This could lead to out-of-bound memory R/W if we
  try to\naccess the next attribute derived by Add2Ptr(attr, asize)\n\n[   32.963847]
  BUG: unable to handle page fault for address: ffff956a83c76067\n[   32.964301] #PF:
  supervisor read access in kernel mode\n[   32.964526] #PF: error_code(0x0000) -
  not-present page\n[   32.964893] PGD 4dc01067 P4D 4dc01067 PUD 0\n[   32.965316]
  Oops: 0000 [#1] PREEMPT SMP NOPTI\n[   32.965727] CPU: 0 PID: 243 Comm: mount Not
  tainted 5.19.0+ #6\n[   32.966050] Hardware name: QEMU Standard PC (i440FX + PIIX,
  1996), BIOS rel-1.14.0-0-g155821a1990b-prebuilt.qemu.org 04/01/2014\n[   32.966628]
  RIP: 0010:mi_enum_attr+0x44/0x110\n[   32.967239] Code: 89 f0 48 29 c8 48 89 c1
  39 c7 0f 86 94 00 00 00 8b 56 04 "
