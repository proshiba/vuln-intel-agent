title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  hold event_mutex while checkpointing CRIU events\n\nkfd_criu_checkpoint_events()
  counts the entries in p->event_idr via\nkfd_get_num_events(), allocates an array
  sized to that count, and then\nwalks the same IDR to fill it. Neither the count
  nor the walk holds\np->event_mutex.\n\nThe CRIU checkpoint caller holds only p->mutex.
  Event create and destroy\n(kfd_event_create()/kfd_event_destroy()) take p->event_mutex
  and do not\ntake p->mutex, so a second thread in the same process can insert or
  remove\nevents between the count and the walk. If an event is inserted, the walk\n\
  iterates more entries than were counted and writes past the end of the\nev_privs
  allocation; if an event is removed, the walk dereferences an\nentry that is being
  freed.\n\nHold p->event_mutex across the count and the walk so both observe a\n\
  consistent view of p->event_idr. The lock is released before\ncopy_to_user(), which
  only touches the local buffer. T"
