title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/dasd:
  Fix potential NULL pointer dereference\n\ndasd_release_space() checks the implementation
  of the is_ese()\ndiscipline function before calling it to determine if a given device
  is\nan ESE DASD.\n\nThe current usage of the logical AND operator will lead to a
  NULL\npointer dereference as the function is called even if the function\npointer
  is NULL.\n\nFix this by using the logical OR operator."
