title: A vulnerability was identified in jeequan jeepay up to 3.2.9. This 
  vulnerability affects the function WebSecurityConfig of the file 
  jeepay-manager/src/main/java/com/jeequan/jeepay/mgr/ctrl/sysuser/SysLogController.java
  of the component PreAuthorize Handler. The manipulation leads to authorization
  bypass. The attack may be initiated remotely. The exploit is publicly 
  available and might be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
