title: MyBB is free and open source forum software. Prior to 1.8.40, the 
  calendar module does not validate moderation permissions for the destination 
  calendar when moving events. A user with moderation permission for the source 
  calendar can move an event to a calendar where the user has only viewing 
  permission because the do_move action in calendar.php does not check 
  canmoderateevents for the target calendar. The uniquely identifying 
  implementation details include calendar event move, source calendar moderation
  permission, and destination calendar viewing permission. This issue is fixed 
  in version 1.8.40.
