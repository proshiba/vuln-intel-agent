title: KubePi is a Kubernetes multi-cluster management panel. In versions up to 
  and including 1.6.15, the SSO configuration API endpoints are exposed on the 
  same public routing boundary as the SSO login and callback endpoints, so SSO, 
  OIDC, and SAML management operations can be reached without administrator 
  authorization. Because reading, creating, and updating the global SSO 
  configuration is not restricted to administrators, an unauthorized or 
  low-privileged user can inspect or alter the authentication configuration, 
  which under certain conditions can lead to account takeover or privilege 
  escalation. The SSO connectivity-test function can additionally be abused as a
  server-side request forgery primitive, and the user list API returns user 
  objects without consistently clearing authentication-related fields. This 
  issue is fixed in version 2.0.0.
