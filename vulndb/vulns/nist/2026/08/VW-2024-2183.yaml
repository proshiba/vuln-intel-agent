title: "In the Linux kernel, the following vulnerability has been resolved:\n\nionic:
  use dev_consume_skb_any outside of napi\n\nIf we're not in a NAPI softirq context,
  we need to be careful\nabout how we call napi_consume_skb(), specifically we need
  to\ncall it with budget==0 to signal to it that we're not in a\nsafe context.\n\n\
  This was found while running some configuration stress testing\nof traffic and a
  change queue config loop running, and this\ncurious note popped out:\n\n[ 4371.402645]
  BUG: using smp_processor_id() in preemptible [00000000] code: ethtool/20545\n[ 4371.402897]
  caller is napi_skb_cache_put+0x16/0x80\n[ 4371.403120] CPU: 25 PID: 20545 Comm:
  ethtool Kdump: loaded Tainted: G           OE      6.10.0-rc3-netnext+ #8\n[ 4371.403302]
  Hardware name: HPE ProLiant DL360 Gen10/ProLiant DL360 Gen10, BIOS U32 01/23/2021\n\
  [ 4371.403460] Call Trace:\n[ 4371.403613]  <TASK>\n[ 4371.403758]  dump_stack_lvl+0x4f/0x70\n\
  [ 4371.403904]  check_preemption_disabled+0xc1/0xe0\n[ 4371.404051]  napi_skb_cache_put+0x"
