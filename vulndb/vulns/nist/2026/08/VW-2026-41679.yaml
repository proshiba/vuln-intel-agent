title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the WebSocket handlers in apps/dokploy/server/wss/terminal.ts, 
  apps/dokploy/server/wss/docker-container-terminal.ts, 
  apps/dokploy/server/wss/docker-container-logs.ts, and 
  apps/dokploy/server/wss/docker-stats.ts validate organization membership but 
  do not enforce checkServiceAccess, accessedServerIds, or accessedServices, 
  allowing an authenticated organization member to obtain root terminal access 
  and read logs or statistics for restricted servers and services. This issue is
  fixed in version 0.29.13.
