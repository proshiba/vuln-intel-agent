title: Craft CMS versions before 5.10.8 contain a stored cross-site scripting 
  vulnerability in the control panel where draft names are rendered without HTML
  encoding in element chips and cards. A low-privilege user who can create 
  element drafts can inject malicious JavaScript that executes in the browser of
  any higher-privileged user viewing the affected element, allowing account 
  creation and other authenticated actions.
