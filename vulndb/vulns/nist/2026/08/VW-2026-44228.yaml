title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  wwan: t7xx: destroy DMA pool on CLDMA late init failure\n\nt7xx_cldma_late_init()
  creates md_ctrl->gpd_dmapool before\ninitializing the TX and RX rings. If any ring
  initialization\nfails, the error path frees the already initialized rings but\n\
  leaves the DMA pool allocated.\n\nDestroy md_ctrl->gpd_dmapool on the late-init
  failure path\nto avoid leaking the DMA pool."
