title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKEYS:
  trusted: dcp: fix NULL dereference in AEAD crypto operation\n\nWhen sealing or unsealing
  a key blob we currently do not wait for\nthe AEAD cipher operation to finish and
  simply return after submitting\nthe request. If there is some load on the system
  we can exit before\nthe cipher operation is done and the buffer we read from/write
  to\nis already removed from the stack. This will e.g. result in NULL\npointer dereference
  errors in the DCP driver during blob creation.\n\nFix this by waiting for the AEAD
  cipher operation to finish before\nresuming the seal and unseal calls."
