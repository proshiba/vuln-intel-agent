title: MaxKey contains an unauthorized access vulnerability due to a hard-coded 
  JWT signing secret in application-maxkey.properties that allows 
  unauthenticated attackers to forge valid JWT tokens and authenticate as any 
  user by exploiting the password-skipped login endpoint. Attackers can craft a 
  JWT token signed with the publicly known default secret, submit it to the 
  /sign/login/jwt/trust endpoint, and obtain a fully authenticated admin session
  with access to SSO application configuration and downstream application 
  secrets.
