title: "Issue summary: In a server or client configuration with RFC7250 Raw Public
  Keys (RPKs)\nenabled, and only the private key (with no associated certificate)
  configured locally,\na NULL pointer dereference may occur when the remote peer solicits
  raw public keys and\nalso sends the typically omitted \"signature_algorithms_cert\"\
  \ TLS extension.\n\nImpact summary: The impact is limited to a possible Denial of
  Service as a result of\nan application abort, no data disclosure or remote command
  execution are possible.\n\nCWE: CWE-476: NULL Pointer Dereference\n\nDescription:
  While a passing comment in sample code in the documentation suggests\nthat key-only
  RPK configurations are supported, the best-practice RPK configuration\nis to always
  configure a corresponding certificate (possibly self-signed or\nsigned by any convenient
  CA).\n\nWhen the private key is configured along with a matching certificate, the\n\
  \"signature_algorithms_cert\" extension is handled reliably even without the\nfix,
  and peer clients or server"
