title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntls:
  don't leave a full plaintext sk_msg ring unpushed\n\nWhen the copy path in tls_sw_sendmsg_locked()
  adds the fragment that fills\nthe plaintext sk_msg ring, it does not set full_record,
  so the record is\nleft full and unpushed.  A later splice() then adds to an already
  full\nring: sk_msg_page_add() has no fullness check of its own, so sg.end wraps\n\
  onto sg.start and the ring appears empty.  Fragments added after that\noverwrite
  live entries, and sg.size no longer matches what is reachable\nbetween sg.start
  and sg.end, so pushing the record runs the scatterwalk off\nthe end of the scatterlist.\n\
  \nAn unprivileged user can trigger this on a loopback TCP socket with the\n\"tls\"\
  \ ULP attached:\n\n  BUG: kernel NULL pointer dereference, address: 0000000000000008\n\
  \  RIP: 0010:memcpy_from_scatterwalk+0x32/0xc0\n  Call Trace:\n   skcipher_walk_next+0x1d1/0x2c0\n\
  \   gcm_encrypt_aesni_avx+0x1e9/0x220\n   bpf_exec_tx_verdict+0x3bb/0x860\n   tls_sw_"
