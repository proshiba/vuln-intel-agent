title: 'A security flaw has been discovered in Webkul Bagisto up to 2.4.4. Affected
  by this issue is some unknown functionality of the file /admin/customers/view of
  the component Backend Customer Detail Feature. Performing a manipulation of the
  argument ID results in authorization bypass. The attack may be initiated remotely.
  The exploit has been released to the public and may be used for attacks. The vendor
  confirms: "The reported issues were already identified through our internal security
  assessment process prior to this notification and are being handled through our
  established internal security and development lifecycle. Some of these items have
  already been addressed, while the remaining items are planned for resolution in
  upcoming product releases."'
