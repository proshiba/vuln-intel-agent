title: Incorrect ownership assignment in PostgreSQL ALTER TABLE ALTER TYPE 
  command reassigns ownership of dependent statistics objects to the current 
  user.  This wrongly allows the table owner to run DROP STATISTICS and ALTER 
  STATISTICS via this improper ownership.  It wrongly denies those commands to 
  the prior statistics object owner.  DROP TABLE remains able to remove 
  statistics objects, so this exploit achieves nothing in many ownership 
  arrangements.  Versions before PostgreSQL 18.5, 17.11, 16.15, 15.19, and 14.24
  are affected.
