title: Craft CMS versions >= 5.0.0-RC1 before 5.10.6 and >= 4.0.0-RC1 before 
  4.18.2 contain a theoretical path traversal weakness in the 
  ensurePathIsContained function of the Local file system class. The order of 
  operations validates the path before normalization, so normalization could 
  invalidate prior validation assumptions (a desanitization-style issue) and 
  potentially resolve to files outside the intended volume directory. The vendor
  notes the issue is not directly exploitable and no exploitable scenario has 
  been discovered; the fix is recommended for hardening.
