title: A vulnerability has been found in Piwigo 16.3.0. This impacts an unknown 
  function of the component Public Authentication Page. Such manipulation of the
  argument lang leads to cross site scripting. The attack may be performed from 
  remote. A high complexity level is associated with this attack. The 
  exploitability is said to be difficult. The exploit has been disclosed to the 
  public and may be used. Upgrading to version 16.4.0 will fix this issue. The 
  name of the patch is 5277a7dee4b8f1a174f1d69e1e2a4e1c82a3fc9e. It is 
  recommended to upgrade the affected component.
