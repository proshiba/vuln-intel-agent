title: A security vulnerability has been detected in UTT HiPER 1200GW up to 
  2.5.3-170306. This impacts the function strcpy of the file 
  /goform/pptpSrvGlobalConfig. Such manipulation of the argument EncryptionMode 
  leads to stack-based buffer overflow. The attack can be executed remotely. The
  exploit has been disclosed publicly and may be used. The vendor was contacted 
  early about this disclosure but did not respond in any way.
