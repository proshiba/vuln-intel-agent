title: "The OCPP 1.6 client in subsys/net/lib/ocpp/ocpp_j.c contains a stack buffer
  overflow in parse_getconfig_msg(). When handling a GetConfiguration request from
  the central system, the handler copied the attacker-controlled JSON \"key\" string
  into the caller's fixed 50-byte stack buffer (skey[CISTR50], declared in subsys/net/lib/ocpp/ocpp.c)
  using an unbounded strcpy(). The parsed key value points directly into the receive
  buffer, so its length is bounded only by the message size (CONFIG_OCPP_RECV_BUFFER_SIZE,
  default 2048).\n\nThe GetConfiguration message is delivered over the WebSocket connection
  that the charge point opens to its configured central system. The reader thread
  ocpp_wsreader() reads the message into ui->recv_buf and dispatches it to parse_getconfig_msg()
  via the PDU function table. An attacker who controls the central system endpoint,
  or a man-in-the-middle on an unencrypted connection, can send a GetConfiguration
  request whose \"key\" field exceeds 50 bytes and overflow the rea"
