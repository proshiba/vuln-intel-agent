title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Disable preemption in bpf_event_output\n\nWe received report [1] of kernel crash,
  which is caused by\nusing nesting protection without disabled preemption.\n\nThe
  bpf_event_output can be called by programs executed by\nbpf_prog_run_array_cg function
  that disabled migration but\nkeeps preemption enabled.\n\nThis can cause task to
  be preempted by another one inside the\nnesting protection and lead eventually to
  two tasks using same\nperf_sample_data buffer and cause crashes like:\n\n  BUG:
  kernel NULL pointer dereference, address: 0000000000000001\n  #PF: supervisor instruction
  fetch in kernel mode\n  #PF: error_code(0x0010) - not-present page\n  ...\n  ? perf_output_sample+0x12a/0x9a0\n\
  \  ? finish_task_switch.isra.0+0x81/0x280\n  ? perf_event_output+0x66/0xa0\n  ?
  bpf_event_output+0x13a/0x190\n  ? bpf_event_output_data+0x22/0x40\n  ? bpf_prog_dfc84bbde731b257_cil_sock4_connect+0x40a/0xacb\n\
  \  ? xa_load+0x87/0xe0\n  ? __cgroup_bpf_run_filte"
