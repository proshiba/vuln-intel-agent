title: "Relative path traversal vulnerability in Apache Camel Azure-Storage Datalake
  component\n\n\n\nThis issue affects Apache Camel: from 4.0.0 before 4.14.9, from
  4.15.0 before 4.18.4, from 4.19.0 before 4.22.0.\n\n\n\nThe camel-azure-storage-datalake
  component can download an Azure Data Lake Storage Gen2 file to the local filesystem
  through its downloadToFile operation, writing into the directory named by the fileDir
  endpoint option. DataLakeFileOperations.downloadToFile built the local target by
  joining fileDir with the remote path name exactly as the Azure SDK reported it (new
  File(fileDir, fileClientWrapper.getFileName())) and passed the result straight to
  the SDK download call, with no lexical normalization and no check that the resolved
  location stayed inside fileDir. The remote name is not route-controlled data: the
  consumer enumerates the filesystem in DataLakeConsumer.createBatchExchangesFromPath,
  which lists paths and creates one exchange per entry from PathItem.getName() verbatim,
  applyi"
