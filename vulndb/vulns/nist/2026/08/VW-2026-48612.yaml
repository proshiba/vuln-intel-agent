title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix use-after-free of cached ASCONF chunk\n\naddip_last_asconf caches the outstanding
  outbound ASCONF chunk. The normal\nASCONF-ACK completion path releases the chunk
  and clears the pointer.\n\nHowever, sctp_asconf_queue_teardown() releases the cached
  chunk without\nclearing addip_last_asconf. During peer restart handling,\nsctp_sf_do_dupcook_a()
  queues SCTP_CMD_PURGE_ASCONF_QUEUE, which invokes\nsctp_asconf_queue_teardown()
  while the association remains alive and leaves\nthe pointer dangling.\n\nA delayed
  authenticated ASCONF-ACK can then reach sctp_sf_do_asconf_ack(),\nwhich accesses
  the stale chunk and passes it to sctp_process_asconf_ack(),\ncausing a use-after-free
  and a second release.\n\nClearing the pointer exposes a race with T4 expiry. Peer
  restart handling\nqueues the timer stop before the purge, but SCTP_CMD_TIMER_STOP
  uses\ntimer_delete(), which does not wait for a callback already running on\nanother
