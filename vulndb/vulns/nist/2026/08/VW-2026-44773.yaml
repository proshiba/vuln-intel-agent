title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost:
  fix vhost_get_avail_idx for a non empty ring\n\nvhost_get_avail_idx is supposed
  to report whether it has updated\nvq->avail_idx. Instead, it returns whether all
  entries have been\nconsumed, which is usually the same. But not always - in\ndrivers/vhost/net.c
  and when mergeable buffers have been enabled, the\ndriver checks whether the combined
  entries are big enough to store an\nincoming packet. If not, the driver re-enables
  notifications with\navailable entries still in the ring. The incorrect return value
  from\nvhost_get_avail_idx propagates through vhost_enable_notify and causes\nthe
  host to livelock if the guest is not making progress, as vhost will\nimmediately
  disable notifications and retry using the available entries.\n\nThis goes back to
  commit d3bb267bbdcb (\"vhost: cache avail index in\nvhost_enable_notify()\") which
