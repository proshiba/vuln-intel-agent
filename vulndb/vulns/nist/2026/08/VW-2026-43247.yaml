title: SiYuan before v3.7.4 (affected <=v3.7.2) fails to enforce publish-access 
  filters on five filetree path-resolution endpoints (getFullHPathByID, 
  getHPathByID, getPathByID, getIDsByHPath, and getHPathByPath). In publish 
  mode, when Publish.Auth.Enable is false, an unauthenticated (anonymous) reader
  — or any publish reader token — can call these endpoints to enumerate the 
  complete private document tree, mapping notebook names, folder hierarchies, 
  and document titles, and resolving title paths to document IDs, including for 
  documents marked hidden, password-protected, or publish-forbidden.
