title: n8n is a workflow automation platform. In versions prior to 1.123.69, 
  2.33.4, and 2.34.1, the JavaScript Code node's VM sandbox did not freeze the 
  sandbox's Function.prototype, allowing an authenticated user with the ability 
  to create and execute workflows to pollute it from within a Code node 
  execution and recover a reference to the host's globalThis, resulting in a 
  sandbox escape. The full exploit chain additionally depends on specific 
  modules being available as allowlisted imports in the deployment's 
  configuration. The issue is fixed in versions 1.123.69, 2.33.4, and 2.34.1.
