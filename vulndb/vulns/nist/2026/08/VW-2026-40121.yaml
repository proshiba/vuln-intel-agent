title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  amlogic - avoid double cleanup in meson_crypto_probe()\n\nWhen meson_allocate_chanlist()
  fails after a partial allocation, it already\nunwinds the allocated chanlist state
  through its local error path.\nmeson_crypto_probe() then jump to error_flow and
  calls\nmeson_free_chanlist() again, causing the same per-flow resources to be torn\n\
  down twice. In the reproduced failure path, the second teardown\nre-entered crypto_engine_exit()
  on an already destroyed worker and KASAN\nreported a slab-use-after-free in kthread_destroy_worker().\n\
  \nPrevent double-free by handling partial allocation failures locally within\nmeson_allocate_chanlist()
  and skipping the outer cleanup path.\n\nThe bug was first flagged by an experimental
  analysis tool we are\ndeveloping for kernel memory-management bugs while analyzing\n\
  v6.13-rc1. The tool is still under development and is not yet publicly\navailable.\n\
  \nThe bug was reproduced in a QEMU x86_64 guest "
