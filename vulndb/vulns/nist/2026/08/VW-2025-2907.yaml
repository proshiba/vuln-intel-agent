title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix reading strings from synthetic events\n\nThe follow commands caused a crash:\n\
  \n  # cd /sys/kernel/tracing\n  # echo 's:open char file[]' > dynamic_events\n \
  \ # echo 'hist:keys=common_pid:file=filename:onchange($file).trace(open,$file)'
  > events/syscalls/sys_enter_openat/trigger'\n  # echo 1 > events/synthetic/open/enable\n\
  \nBOOM!\n\nThe problem is that the synthetic event field \"char file[]\" will read\n\
  the value given to it as a string without any memory checks to make sure\nthe address
  is valid. The above example will pass in the user space\naddress and the sythetic
  event code will happily call strlen() on it\nand then strscpy() where either one
  will cause an oops when accessing\nuser space addresses.\n\nUse the helper functions
  from trace_kprobe and trace_eprobe that can\nread strings safely (and actually succeed
  when the address is from user\nspace and the memory is mapped in).\n\nNow the above
  can show:\n\n     packagekitd-1"
