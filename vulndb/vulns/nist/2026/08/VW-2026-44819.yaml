title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  atmel-sha204a - fix blocking and non-blocking rng logic\n\nThe blocking and non-blocking
  paths were failing to provide valid entropy\ndue to improper buffer management.
  Reading the buffer starting from byte 1,\nonly fetch the 32 bytes of random data
  from the return message.\n\nTested on an Atmel SHA204A device.\n\nBefore (here for
  blocking), tests showed repeatedly reading reduced bytes.\n$ head -c 32 /dev/hwrng
  | hexdump -C\n00000000  02 28 85 b3 47 40 f2 ee  00 00 00 00 00 00 00 00  |.(..G@..........|\n\
  00000010  00 00 00 00 00 00 00 00  00 00 00 00 00 00 00 00  |................|\n\
  00000020\n\nAfter, the result will be similar to the following:\n$ head -c 32 /dev/hwrng
  | hexdump -C\n00000000  5a fc 3f 13 14 68 fe 06  68 0a bd 04 83 6e 09 69  |Z.?..h..h....n.i|\n\
  00000010  75 ff cf 87 10 84 3b c9  c1 df ae eb 45 53 4c c3  |u.....;.....ESL.|\n\
  00000020"
