title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Initialise reader page order in rb_allocate_cpu_buffer()\n\nIn rb_allocate_cpu_buffer(),
  bpage->order was omitted, leaving it as 0.\nThis is an issue for a ring-buffer with
  subbufs bigger than PAGE_SIZE if\nwhen freed: free_buffer_page() relies on this
  value. Align the value\nwith the actual allocation size (buffer::subbuf_order)."
