title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rtrs-srv:
  Avoid null pointer deref during path establishment\n\nFor RTRS path establishment,
  RTRS client initiates and completes con_num\nof connections. After establishing
  all its connections, the information\nis exchanged between the client and server
  through the info_req message.\nDuring this exchange, it is essential that all connections
  have been\nestablished, and the state of the RTRS srv path is CONNECTED.\n\nSo add
  these sanity checks, to make sure we detect and abort process in\nerror scenarios
  to avoid null pointer deref."
