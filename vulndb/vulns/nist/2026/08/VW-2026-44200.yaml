title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  libata-core: Add NOLPM quirk for PNY CS900 1TB SSD\n\nThe PNY CS900 1TB SSD (Phison
  PS3111-S11, DRAM-less) drops off the bus\nafter entering Device-Initiated Slumber
  during idle. With the default\nmed_power_with_dipm policy the link goes down (SStatus
  1 SControl 300)\nand does not recover, forcing the filesystem read-only. Forcing\n\
  max_performance keeps the link stable across prolonged idle.\n\nAdd a NOLPM quirk
  so link power management is disabled for this drive\nspecifically, leaving it intact
  for other devices on the host."
