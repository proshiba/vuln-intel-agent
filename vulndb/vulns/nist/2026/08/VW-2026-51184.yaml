title: A MongoDB C# driver document-replacement code path omits the 
  element-name/shape validation that the equivalent write paths apply, so a 
  value supplied as a replacement is forwarded to the server without 
  neutralization of query-language special elements. An application that passes 
  untrusted, loosely-typed input as a replacement value therefore allows that 
  input to be interpreted by the database as update logic rather than as data, 
  executing under the application's own database credentials. Applications using
  strongly-typed document mappings are not affected.
