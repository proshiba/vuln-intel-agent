title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfou:
  remove warn in gue_gro_receive on unsupported protocol\n\nDrop the WARN_ON_ONCE
  inn gue_gro_receive if the encapsulated type is\nnot known or does not have a GRO
  handler.\n\nSuch a packet is easily constructed. Syzbot generates them and sets\n\
  off this warning.\n\nRemove the warning as it is expected and not actionable.\n\n\
  The warning was previously reduced from WARN_ON to WARN_ON_ONCE in\ncommit 270136613bf7
  (\"fou: Do WARN_ON_ONCE in gue_gro_receive for bad\nproto callbacks\")."
