title: "Inefficient Algorithmic Complexity vulnerability in the traversal engine in
  rrrene html_sanitize_ex allows an unauthenticated remote attacker to exhaust server
  CPU and memory via a flat run of sibling elements in sanitized HTML. The list clause
  of HtmlSanitizeEx.Traverser.traverse/2 recurses on the tail of a sibling list and
  then evaluates List.flatten([head] ++ tail) over the already flattened result, so
  every one of n siblings copies and re-walks the entire remaining tail. The flattening
  is only needed for the rare case where scrub returns several replacement nodes for
  one node, but the cost is paid across the whole tail at every step, making traversal
  quadratic in sibling count.\n\nThe traverser sits on every public entry point, so
  no particular scrubber or configuration is required and the payload needs only allowed
  tags. A 160 KB body of 20,000 sibling elements occupies a scheduler for roughly
  1.7 seconds, and the cost grows faster than the body does.\n\nThis issue affects
  html_saniti"
