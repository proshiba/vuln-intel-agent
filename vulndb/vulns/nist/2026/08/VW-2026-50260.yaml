title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix off-by-one in rtrefcount btree root level validation\n\nxfs_rtrefcountbt_compute_maxlevels()
  sets\n\n\tmp->m_rtrefc_maxlevels = min(d_maxlevels, r_maxlevels) + 1;\n\nwhere the
  trailing \"+ 1\" already accounts for the inode-root level, so the\ndeepest valid
  on-disk root level is m_rtrefc_maxlevels - 1 and a cursor must\nsatisfy bc_nlevels
  <= bc_maxlevels (= m_rtrefc_maxlevels).\n\nThe two on-disk validation paths, xfs_rtrefcountbt_verify()
  and\nxfs_iformat_rtrefcount(), check the root level with \">\" instead of \">=\"\
  , so a\ncrafted rtreflink (metadir + realtime + reflink) image whose\n/rtgroups/N.refcount
  inode has bb_level == m_rtrefc_maxlevels is accepted on\nmount. xfs_rtrefcountbt_init_cursor()
  then sets bc_nlevels = bb_level + 1,\nexceeding bc_maxlevels by one. Since the xfs_rtrefcountbt_cur
  slab object is\nsized for exactly bc_maxlevels entries, the first btree op on such
