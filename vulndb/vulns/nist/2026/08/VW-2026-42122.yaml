title: AutoGPT is a workflow automation platform for creating, deploying, and 
  managing continuous artificial intelligence agents. Prior to 0.6.70, AutoGPT's
  autogpt_platform/backend/backend/api/features/integrations/router.py 
  webhook_ingress_generic route selected get_webhook_manager(provider) from the 
  untrusted provider URL segment without verifying webhook.provider, allowing a 
  request to /compass/webhooks/{webhook_id}/ingress to use 
  CompassWebhookManager's inherited no-op BaseWebhooksManager.verify_signature 
  instead of GenericWebhooksManager.verify_signature, bypass X-Webhook-Secret 
  for a configured secret_token, and execute a generic webhook graph as its 
  owner. This issue is fixed in version 0.6.70.
