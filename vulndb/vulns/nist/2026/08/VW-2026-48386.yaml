title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost:
  reset the vring metadata cache on vring reconfiguration\n\nvq->meta_iotlb[] caches
  the vhost_iotlb_map that backs each vring\nmetadata region, and iotlb_access_ok()
  returns early on a cache hit,\ntaking the hit as proof that the region has already
  been validated:\n\n\tif (vhost_vq_meta_fetch(vq, addr, len, type))\n\t\treturn true;\n\
  \nThe cache is reset on VHOST_IOTLB_UPDATE and VHOST_IOTLB_INVALIDATE, on\ndevice
  IOTLB (re)initialisation and on vq reset, but not when\nVHOST_SET_VRING_ADDR replaces
  vq->desc, vq->avail and vq->used, nor when\nVHOST_SET_VRING_NUM changes the region
  sizes.\n\nWith a device IOTLB attached both ioctls are accepted while the vq is\n\
  live, and neither validates the addresses at ioctl time: vq_access_ok()\nand vq_log_used_access_ok()
  return true early because the addresses are\nGIOVAs, deferring validation to prefetch
  time.  Once the cache has been\npopulated that deferred validation no longer runs
  -- vq_meta"
