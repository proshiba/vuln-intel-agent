title: A flaw has been found in chetans9 core-php-admin-panel up to 
  90d07ed5aac5e0f09b6a5828d7bb2eb83010763f. This issue affects some unknown 
  processing of the file 
  /Applications/MAMP/htdocs/core-php-admin-panel-master/customers.php. Executing
  a manipulation of the argument filter_col can lead to sql injection. The 
  attack may be launched remotely. The exploit has been published and may be 
  used. This product operates on a rolling release basis, ensuring continuous 
  delivery. Consequently, there are no version details for either affected or 
  updated releases. The vendor was contacted early about this disclosure but did
  not respond in any way.
