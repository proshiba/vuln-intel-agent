title: A weakness in the MongoDB C Driver allows special elements in 
  caller-supplied database and collection name components to pass without 
  sanitization when the driver composes the target namespace for an operation. 
  An application that incorporates untrusted input into these name components 
  can have operations directed at a resource other than the one intended.
