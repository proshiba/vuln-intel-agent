title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Fix locally exploitable BUG_ON in amdxdna_insert_pages()\n\nIn amdxdna_insert_pages(),
  vm_flags_mod() sets VM_MIXEDMAP and clears\nVM_PFNMAP. If an unprivileged userspace
  process mmaps a non-imported GEM\nobject and then calls madvise(MADV_DONTNEED),
  the PTEs will be\nsuccessfully cleared because VM_MIXEDMAP allows this (unlike VM_PFNMAP).\n\
  \nWhen userspace subsequently accesses the memory, drm_gem_shmem_fault()\nhandles
  the page fault and attempts to map the backing shmem page via\nvmf_insert_pfn()
  which calls vmf_insert_pfn_prot(). Because the backing\nshmem page is normal system
  memory (pfn_valid(pfn) is true) and the VMA\nnow has VM_MIXEDMAP set, won't this
  predictably trigger the explicit\nassertion BUG_ON((vma->vm_flags & VM_MIXEDMAP)
  && pfn_valid(pfn))\n\nFix by removing the vm_flags_mod() call and replacing the
  vm_insert_pages()\npre-population with the handle_mm_fault() loop that was already
  used for\nthe impo"
