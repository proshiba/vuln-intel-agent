title: JeecgBoot v3.9.2 is vulnerable to Remote command execution. The CodeNode 
  component of the AI Flow module supports Groovy script execution. While the 
  `SecurityCheck` class employs a blacklist mechanism to intercept dangerous 
  calls, the dynamic nature of Groovy allows this blacklist to be completely 
  bypassed through string concatenation and reflection.
