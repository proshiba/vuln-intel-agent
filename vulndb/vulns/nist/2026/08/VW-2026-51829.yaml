title: The Total processing card payments for WooCommerce WordPress plugin 
  through 7.3 does not validate a user-supplied path before using it to build a 
  server-side verification request, and does not verify the authenticity of the 
  response, allowing unauthenticated attackers to redirect that request to an 
  arbitrary host (disclosing the merchant's payment-gateway credentials) and to 
  forge a success response that marks arbitrary WooCommerce orders as paid.
