title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: Clear variable event pointer on read\n\nsnd_seq_read() copies a queued variable-length
  event header to userspace\nbefore expanding the payload. Queued variable-length
  events use\nSNDRV_SEQ_EXT_CHAINED internally, and data.ext.ptr points at the first\n\
  extension cell.\n\nThe read side strips SNDRV_SEQ_EXT_* bits from data.ext.len before
  the\ncopy, but it leaves data.ext.ptr untouched. A userspace sequencer client\n\
  can therefore write a direct variable event to itself and read back the\nextension-cell
  kernel address from the returned header.\n\nClear the temporary header pointer before
  copy_to_user(). The original\nqueued event remains unchanged and is still passed
  to\nsnd_seq_expand_var_event(), so payload expansion keeps using the\ninternal chain."
