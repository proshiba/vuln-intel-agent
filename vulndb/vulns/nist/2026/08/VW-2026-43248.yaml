title: SiYuan versions before v3.7.4 fail to apply publish-access filtering to 
  the getAttributeViewKeysByID endpoint, allowing authenticated readers to 
  retrieve complete database column schemas including descriptions, select 
  vocabularies, and template expressions. Additionally, getBlockDefIDsByRefText 
  and getBlockRelevantIDs endpoints enumerate workspace-wide block IDs without 
  publish scoping, enabling attackers to discover valid block identifiers across
  publish boundaries and access content from hidden or password-protected 
  documents.
