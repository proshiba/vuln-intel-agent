title: GitPython before 3.1.59 contains an arbitrary file read vulnerability in 
  TagReference.create() where a positional reference parameter bypasses the 
  unsafe option guard. Attackers can supply a reference value like --file=<path>
  to read arbitrary files, with contents returned in the annotated tag message.
