title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  avoid putting unrelated P2P peer on socket release\n\novpn_peer_release_p2p() is
  called when an OVPN UDP socket is being\ndestroyed. It checks the currently published
  P2P peer and releases it only\nif that peer still uses the socket being destroyed.\n\
  \nA peer replacement can publish a new peer before the old UDP socket is\ndestroyed.
  When the old socket destruction path runs afterwards,\novpn_peer_release_p2p() observes
  the new peer through ovpn->peer. Since the\nnew peer uses a different socket, the
  function takes the socket mismatch\nbranch.\n\nThat branch still calls ovpn_peer_put(peer).
  At this point, however, peer\nis the currently published replacement peer, not the
  peer associated with\nthe socket being destroyed. Dropping its reference can free
  it while\novpn->peer still points to it, leading to later use-after-free accesses\n\
  from the peer and socket cleanup paths.\n\nKASAN reports this as a slab-use-after-free
  on the kma"
