title: "In the Linux kernel, the following vulnerability has been resolved:\n\nath11k:
  Fix frames flush failure caused by deadlock\n\nWe are seeing below warnings:\n\n\
  kernel: [25393.301506] ath11k_pci 0000:01:00.0: failed to flush mgmt transmit queue
  0\nkernel: [25398.421509] ath11k_pci 0000:01:00.0: failed to flush mgmt transmit
  queue 0\nkernel: [25398.421831] ath11k_pci 0000:01:00.0: dropping mgmt frame for
  vdev 0, is_started 0\n\nthis means ath11k fails to flush mgmt. frames because wmi_mgmt_tx_work\n\
  has no chance to run in 5 seconds.\n\nBy setting /proc/sys/kernel/hung_task_timeout_secs
  to 20 and increasing\nATH11K_FLUSH_TIMEOUT to 50 we get below warnings:\n\nkernel:
  [  120.763160] INFO: task wpa_supplicant:924 blocked for more than 20 seconds.\n\
  kernel: [  120.763169]       Not tainted 5.10.90 #12\nkernel: [  120.763177] \"\
  echo 0 > /proc/sys/kernel/hung_task_timeout_secs\" disables this message.\nkernel:
  [  120.763186] task:wpa_supplicant  state:D stack:    0 pid:  924 ppid:     1 flags:0x000043a0\n\
  kernel: [  "
