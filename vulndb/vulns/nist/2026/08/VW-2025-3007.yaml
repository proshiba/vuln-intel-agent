title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  fix disconnect vs accept race\n\nDespite commit 0ad529d9fd2b (\"mptcp: fix possible
  divide by zero in\nrecvmsg()\"), the mptcp protocol is still prone to a race between\n\
  disconnect() (or shutdown) and accept.\n\nThe root cause is that the mentioned commit
  checks the msk-level\nflag, but mptcp_stream_accept() does acquire the msk-level
  lock,\nas it can rely directly on the first subflow lock.\n\nAs reported by Christoph
  than can lead to a race where an msk\nsocket is accepted after that mptcp_subflow_queue_clean()
  releases\nthe listener socket lock and just before it takes destructive\nactions
  leading to the following splat:\n\nBUG: kernel NULL pointer dereference, address:
  0000000000000012\nPGD 5a4ca067 P4D 5a4ca067 PUD 37d4c067 PMD 0\nOops: 0000 [#1]
  PREEMPT SMP\nCPU: 2 PID: 10955 Comm: syz-executor.5 Not tainted 6.5.0-rc1-gdc7b257ee5dd
  #37\nHardware name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.11.0-2.el7 04/01/2014\n\
  RIP: 0"
