title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  just wait for more data to be available on the socket\n\nA short read may occur
  while reading the message footer from the\nsocket.  Later, when the socket is ready
  for another read, the\nmessenger invokes all read_partial_*() handlers, including\n\
  read_partial_sparse_msg_data().  The expectation is that\nread_partial_sparse_msg_data()
  would bail, allowing the messenger to\ninvoke read_partial() for the footer and
  pick up where it left off.\n\nHowever read_partial_sparse_msg_data() violates that
  and ends up\ncalling into the state machine in the OSD client.  The sparse-read\n\
  state machine assumes that it's a new op and interprets some piece of\nthe footer
  as the sparse-read header and returns bogus extents/data\nlength, etc.\n\nTo determine
  whether read_partial_sparse_msg_data() should bail, let's\nreuse cursor->total_resid.\
  \  Because once it reaches to zero that means\nall the extents and data have been
  successfully received in"
