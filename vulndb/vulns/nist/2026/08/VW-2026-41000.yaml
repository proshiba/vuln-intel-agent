title: A vulnerability has been found in Uasoft Badaso 3.0.0-alpha. This 
  vulnerability affects the function ApiRequest::class of the file 
  src/Routes/api.php of the component File API. The manipulation leads to 
  permission issues. It is possible to initiate the attack remotely. The exploit
  has been disclosed to the public and may be used. The project was informed of 
  the problem early through an issue report but has not responded yet.
