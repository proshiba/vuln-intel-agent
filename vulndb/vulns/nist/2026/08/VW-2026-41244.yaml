title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  wait on ublk_dev_ready() instead of ub->completion\n\nub->completion is only re-armed
  by a successful START_USER_RECOVERY. If\nthe ublk server sends END_USER_RECOVERY
  without one - e.g. its START\nfailed with -EBUSY and the error was ignored - the
  wait is satisfied by\nthe stale completion of the previous recovery cycle, and the
  device is\nmarked LIVE and the requeue list kicked while the FETCH stream is still\n\
  running and ubq->canceling is still set. The kick redispatches a\npreviously requeued
  request, __ublk_queue_rq_common() sees ->canceling\nand parks it again via __ublk_abort_rq(),
  and after the last FETCH\nclears ->canceling nothing ever kicks the requeue list
  again: the\nrequest is stranded there while holding its tag. If it is the flush\n\
  machinery's flush_rq, every subsequent fsync piles up in uninterruptible\nsleep
  and teardown hangs on tag draining. This matches a report of a\nlost PREFLUSH with
  ext4 on top of ublk"
