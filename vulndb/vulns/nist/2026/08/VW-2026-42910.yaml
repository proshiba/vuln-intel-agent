title: "The userspace syscall verifiers z_vrfy_zsock_sendmsg() and z_vrfy_zsock_recvmsg()
  in subsys/net/lib/sockets/sockets.c snapshot the caller-supplied struct net_msghdr
  into a kernel-side copy with k_usermode_from_copy(), but then re-read the still-live
  user struct for subsequent decisions. The kernel iovec shadow buffer is sized from
  one read of msg->msg_iovlen, while the population loop is bounded by a second, live
  read of the same field.\n\nBecause msg points into ordinary user memory, a cooperating
  second thread in the same memory domain can inflate msg->msg_iovlen in the window
  between the sizing read and the loop test (a classic double-fetch / TOCTOU). The
  population loop then iterates past the number of net_iovec slots actually allocated,
  writing attacker-influenced iov_base/iov_len values beyond the end of the kernel-heap
  shadow buffer. The recvmsg verifier has the same defect on both its inbound and
  result write-back loops.\n\nThe code is reachable from an unprivileged user thread
