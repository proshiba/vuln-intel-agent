title: A flaw in Elasticsearch allows a low-privileged authenticated user to 
  submit a single request containing a crafted user-supplied input. A specific 
  internal component validates the input using a recursive routine and applies 
  no bound to the length of the value being validated, so the validation causes 
  the thread to exhaust its stack. The resulting fatal error is not handled by 
  the surrounding execution paths and terminates the affected node process, 
  producing a denial of service.
