title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoc:
  xilinx: Shutdown and free rx mailbox channel\n\nA mbox rx channel is requested using
  mbox_request_channel_byname() in\nprobe. In remove callback, the rx mailbox channel
  is cleaned up when the\nrx_chan is NULL due to incorrect condition check. The mailbox
  channel is\nnot shutdown and it can receive messages even after the device removal.\n\
  This leads to use after free. Also the channel resources are not freed.\nFix this
  by checking the rx_chan correctly."
