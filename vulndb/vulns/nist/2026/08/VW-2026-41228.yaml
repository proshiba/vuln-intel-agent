title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  guard missing CRUSH type name lookup\n\nLocalized read selection can walk a parent
  bucket whose name exists in\nthe CRUSH map while its type has no matching entry
  in type_names.\nget_immediate_parent() then dereferences a NULL type_cn and passes
  an\ninvalid pointer into strcmp(), causing a null-ptr-deref.\n\nSkip such malformed
  parent buckets unless both the bucket name and type\nname metadata are present.
  This keeps malformed hierarchy data from\ncrashing locality lookup and safely falls
  back to \"not local\".\n\n[ idryomov: add WARN_ON_ONCE ]"
