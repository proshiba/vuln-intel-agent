title: SiYuan before v3.7.4 contains a cross-site scripting vulnerability in the
  file-tree picker's hover-tooltip generation (app/src/util/pathName.ts, 
  getLeaf()/movePathTo()) used by the 'move/link to' path-selection dialogs, 
  where document metadata fields (bookmark, alias, memo, and an alternate name 
  field) are concatenated into the aria-label HTML attribute without escaping. A
  document crafted with a double quote in any of these fields breaks out of the 
  attribute context and injects arbitrary HTML attributes including inline event
  handlers (e.g., onmouseover). Because every SiYuan Electron BrowserWindow runs
  with nodeIntegration:true, contextIsolation:false, and no CSP, the injected 
  handler gains require('child_process') access, escalating the XSS to arbitrary
  OS command execution when a victim merely hovers over the malicious document 
  entry in the path-picker dialog. Malicious documents reach victims via 
  sharing, sync, or import.
