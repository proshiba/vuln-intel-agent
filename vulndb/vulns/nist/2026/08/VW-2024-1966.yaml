title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/arm-smmu:
  Use the correct type in nvidia_smmu_context_fault()\n\nThis was missed because of
  the function pointer indirection.\n\nnvidia_smmu_context_fault() is also installed
  as a irq function, and the\n'void *' was changed to a struct arm_smmu_domain. Since
  the iommu_domain\nis embedded at a non-zero offset this causes nvidia_smmu_context_fault()\n\
  to miscompute the offset. Fixup the types.\n\n  Unable to handle kernel NULL pointer
  dereference at virtual address 0000000000000120\n  Mem abort info:\n    ESR = 0x0000000096000004\n\
  \    EC = 0x25: DABT (current EL), IL = 32 bits\n    SET = 0, FnV = 0\n    EA =
  0, S1PTW = 0\n    FSC = 0x04: level 0 translation fault\n  Data abort info:\n  \
  \  ISV = 0, ISS = 0x00000004, ISS2 = 0x00000000\n    CM = 0, WnR = 0, TnD = 0, TagAccess
  = 0\n    GCS = 0, Overlay = 0, DirtyBit = 0, Xs = 0\n  user pgtable: 4k pages, 48-bit
  VAs, pgdp=0000000107c9f000\n  [0000000000000120] pgd=0000000000000000, p4d=00000"
