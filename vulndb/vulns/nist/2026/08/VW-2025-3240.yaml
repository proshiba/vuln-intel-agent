title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  fix a signed-integer-overflow bug in tcp_add_backlog()\n\nThe type of sk_rcvbuf
  and sk_sndbuf in struct sock is int, and\nin tcp_add_backlog(), the variable limit
  is caculated by adding\nsk_rcvbuf, sk_sndbuf and 64 * 1024, it may exceed the max
  value\nof int and overflow. This patch reduces the limit budget by\nhalving the
  sndbuf to solve this issue since ACK packets are much\nsmaller than the payload."
