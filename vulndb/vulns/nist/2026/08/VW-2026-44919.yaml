title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_misc:
  use exe_file_deny_write_access() for the interpreter clone\n\nFor MISC_FMT_OPEN_FILE
  entries load_misc_binary() clones the\nregistered interpreter file and denies write
  access to the clone via\nplain deny_write_access(). The clone is installed as\n\
  bprm->interpreter and later released by the exec machinery through\nexe_file_allow_write_access()
  which skips the i_writecount increment\nfor files with FMODE_FSNOTIFY_HSM set.\n\
  \nThe deny and allow side can therefore come to different conclusions\nwhen pre-content
  watches are in play: if a pre-content watch is added\nto the interpreter after registration
  every subsequent exec through\nthat entry takes a write denial on the clone that
  is never paired\nwith a write allowance, driving the interpreter inode's i_writecount\n\
  further down with each exec and leaving the interpreter unwritable\neven after the
  entry and all its users are gone.\n\nTake the write denial via exe_file_deny_w"
