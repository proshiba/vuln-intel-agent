title: "In the Linux kernel, the following vulnerability has been resolved:\n\nima:
  fix out-of-bounds read in xattr_verify()\n\nThe digest-length check in xattr_verify()
  mixes int and size_t:\n\n\tif (xattr_len - sizeof(xattr_value->type) - hash_start
  >=\n\t\t\tiint->ima_hash->length)\n\nsizeof() yields size_t, so the usual arithmetic
  conversions promote\nthe whole left-hand side to unsigned 64-bit before the subtraction\n\
  runs. For a truncated xattr this underflows instead of going negative:\na 1-byte
  IMA_XATTR_DIGEST_NG xattr (xattr_len == 1, hash_start == 1)\nturns \"1 - 1 - 1\"\
  \ into SIZE_MAX, which is trivially >= ima_hash->length.\nThe check then passes
  and the following memcmp() reads\niint->ima_hash->length bytes starting past the
  end of the buffer\nvfs_getxattr_alloc() allocated for it.\n\nNothing upstream clamps
  xattr_len back into a safe range first:\nima_get_hash_algo() only special-cases
  xattr_len < 2 to pick a default\nalgorithm, and evm_verifyxattr() returns INTEGRITY_UNKNOWN
  rather than\nfailing when no HM"
