title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  check return value of nvmet_tcp_set_queue_sock\n\nThe return value of nvmet_tcp_set_queue_sock()
  is currently ignored in\nnvmet_tcp_tls_handshake_done(). If it fails (e.g., due
  to the socket\nnot being in TCP_ESTABLISHED state), the socket callbacks will not
  be\nproperly set, leading to queue and socket leakage.\n\nFix this by capturing
  the return value and calling\nnvmet_tcp_schedule_release_queue() on failure to ensure
  proper cleanup."
