title: When Zabbix Agent was installed on Windows into a custom installation 
  directory, the installer did not verify whether the selected directory had 
  secure access permissions. If the target directory allowed unauthorized users 
  to modify its contents, an attacker could place a malicious DLL that could 
  later be loaded by the application, resulting in DLL sideloading. The 
  installer has been hardened to detect potentially unsafe installation 
  directories and now requires explicit user confirmation before proceeding with
  installation in such locations. This reduces the risk of accidental 
  installation into directories with inappropriate permissions while preserving 
  compatibility with existing deployment scenarios.
