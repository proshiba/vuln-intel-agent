title: "In the Linux kernel, the following vulnerability has been resolved:\n\npmdomain:
  imx: Fix i.MX8MP VC8000E power up sequence\n\nPer errata[1]:\nERR050531: VPU_NOC
  power down handshake may hang during VC8000E/VPUMIX\npower up/down cycling.\nDescription:
  VC8000E reset de-assertion edge and AXI clock may have a\ntiming issue.\nWorkaround:
  Set bit2 (vc8000e_clk_en) of BLK_CLK_EN_CSR to 0 to gate off\nboth AXI clock and
  VC8000E clock sent to VC8000E and AXI clock sent to\nVPU_NOC m_v_2 interface during
  VC8000E power up(VC8000E reset is\nde-asserted by HW)\n\nAdd a bool variable is_errata_err050531
  in\n'struct imx8m_blk_ctrl_domain_data' to represent whether the workaround\nis
  needed. If is_errata_err050531 is true, first clear the clk before\npowering up
  gpc, then enable the clk after powering up gpc.\n\n[1] https://www.nxp.com/webapp/Download?colCode=IMX8MP_1P33A"
