title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Check validity of link->type in bpf_link_show_fdinfo()\n\nIf a newly-added link
  type doesn't invoke BPF_LINK_TYPE(), accessing\nbpf_link_type_strs[link->type] may
  result in an out-of-bounds access.\n\nTo spot such missed invocations early in the
  future, checking the\nvalidity of link->type in bpf_link_show_fdinfo() and emitting
  a warning\nwhen such invocations are missed."
