title: Improper enforcement of message integrity in PostgreSQL GSSAPI support 
  allows a user to negotiate GSSAPI contrary to pg_hba.conf rules, via initial 
  direct TLS connection.  Despite a pg_hba.conf that appears to require GSSAPI, 
  the connection may exchange data over TLS encryption alone.  If the TLS 
  settings are more permissive than the GSS settings, the connection may 
  continue with lesser protection.  Within major versions 17-18, minor versions 
  before PostgreSQL 18.5 and 17.11 are affected.  Versions before PostgreSQL 17 
  are unaffected.
