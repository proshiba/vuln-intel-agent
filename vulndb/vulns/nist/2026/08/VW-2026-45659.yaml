title: ArcadeDB before 26.8.1 contains an arbitrary file read vulnerability in 
  the GraalVM JavaScript sandbox allowlist enforcement, which uses unescaped 
  regular expressions to validate package names. Attackers with trigger creation
  privileges can use Java.type() to access java.util.zip.ZipFile or 
  java.util.jar.JarFile classes and read arbitrary files on the host system as 
  the ArcadeDB server process.
