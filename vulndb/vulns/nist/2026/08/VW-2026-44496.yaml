title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/v3d:
  Reject invalid indirect BO handle in indirect CSD setup\n\nv3d_get_cpu_indirect_csd_params()
  looks up the indirect buffer object\nfrom a userspace-supplied handle but never
  checks the result. A bogus\nor stale handle makes drm_gem_object_lookup() return
  NULL, which is\nthen stored in info->indirect and only dereferenced later when the\n\
  indirect CSD job runs, turning a userspace mistake into a NULL pointer\ndereference
  in the kernel.\n\nBail out with -ENOENT as soon as the lookup fails, so the bad
  handle is\nrejected at submission time."
