title: Crater's NotePolicy checks only a blanket Bouncer ability 
  (manage-all-notes / view-all-notes) with no company-ownership comparison, 
  unlike InvoicePolicy and other sibling policies which additionally verify 
  $user->hasCompany($model->company_id). NotesController's show(), update(), and
  destroy() actions authorize via $this->authorize('view notes'/'manage notes') 
  without passing the target Note model, and Note's company-scoping 
  (scopeWhereCompany) is applied only in the list endpoint, not in 
  show/update/destroy. Any authenticated user of one company can read, edit, or 
  delete another company's notes by ID. This is a distinct finding from the 
  previously reported CustomerPolicy company-ownership omission (a different 
  policy class and controller).
