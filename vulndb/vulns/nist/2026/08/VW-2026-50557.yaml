title: Stomper 5e2741e is vulnerable to Use-After-Free. When a single client 
  repeatedly issues SUBSCRIBE commands for the same destination over one 
  connection and then closes that connection, the broker performs incorrect 
  cleanup of its internal subscription structures. This results in a heap 
  use-after-free during StompClient destruction, causing the broker process to 
  crash. An unauthenticated client can exploit this to reliably trigger a denial
  of service.
