title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  f_fs: Fix use-after-free for epfile\n\nConsider a case where ffs_func_eps_disable
  is called from\nffs_func_disable as part of composition switch and at the\nsame
  time ffs_epfile_release get called from userspace.\nffs_epfile_release will free
  up the read buffer and call\nffs_data_closed which in turn destroys ffs->epfiles
  and\nmark it as NULL. While this was happening the driver has\nalready initialized
  the local epfile in ffs_func_eps_disable\nwhich is now freed and waiting to acquire
  the spinlock. Once\nspinlock is acquired the driver proceeds with the stale value\n\
  of epfile and tries to free the already freed read buffer\ncausing use-after-free.\n\
  \nFollowing is the illustration of the race:\n\n      CPU1                     \
  \             CPU2\n\n   ffs_func_eps_disable\n   epfiles (local copy)\n\t\t\t\t\
  \tffs_epfile_release\n\t\t\t\t\tffs_data_closed\n\t\t\t\t\tif (last file closed)\n\
  \t\t\t\t\tffs_data_reset\n\t\t\t\t\tffs_data_clear\n\t\t\t\t\tffs_epfiles_destroy\n\
  s"
