title: Nexus Repository 3 CE/Pro versions 3.0.0 through 3.94.x contain an 
  incorrect authorization vulnerability (CWE-863) in the repository-creation 
  user interface. An individual user account holding a delegated 
  repository-admin privilege scoped to a specific repository format could create
  a repository of a different, unauthorized format, because authorization was 
  checked against one request field while a separate, attacker-controlled field 
  determined the repository format actually created. This does not affect the 
  anonymous user, which cannot hold this privilege by default. Fixed in version 
  3.95.0.
