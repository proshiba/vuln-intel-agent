title: Due to a Missing Authorization Check vulnerability in SAP Manufacturing 
  Integration and Intelligence, an unauthenticated attacker could send crafted 
  requests to the Cost Servlet using specific parameter values. If processed by 
  the application, these requests enable access to backend operations. 
  Successful exploitation could allow the attacker to read, create, modify, or 
  delete application-managed business data, resulting in a limited impact on the
  confidentiality, integrity, and availability of the affected system.
