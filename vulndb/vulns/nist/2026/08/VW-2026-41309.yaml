title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  Release VFCT ACPI table reference\n\namdgpu_acpi_vfct_bios() fetches the VFCT table
  with acpi_get_table()\nbut never releases it. acpi_get_table() takes a reference
  on the\ntable (incrementing its validation_count and mapping it on the 0->1\ntransition);
  without a paired acpi_put_table() the mapping is leaked\non every call, whether
  or not a matching VBIOS image is found.\n\nRoute all exit paths after the table
  is acquired through a common\nacpi_put_table(). The VBIOS image is copied out with
  kmemdup() before\nthe table is released, so it remains valid for the caller.\n\n\
  (cherry picked from commit ca5988682b4cba4cd125a0fa99b2de1239164ae4)"
