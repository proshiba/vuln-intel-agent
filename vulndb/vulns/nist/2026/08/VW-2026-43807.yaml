title: Budibase before 3.40.0 contains an unauthenticated SQL injection 
  vulnerability in webhook-triggered automations with EXECUTE_QUERY steps. 
  Attackers can POST attacker-controlled JSON to the webhook trigger endpoint to
  inject SQL payloads that execute with builder-configured database credentials,
  enabling data exfiltration, modification, and persistence in connected 
  datasources like Snowflake.
