title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  ensure valid f_path for page cache sharing\n\nPreviously, backing files for page
  cache sharing were set up with\nf_path left as NULL (only f_inode was valid).  It
  worked, but a recent\nmincore fix relies on f_path.mnt and crashes (found by \"\
  erofs/028\" on\n7.2-rc4):\n\n BUG: kernel NULL pointer dereference, address: 0000000000000018\n\
  \ #PF: supervisor read access in kernel mode\n #PF: error_code(0x0000) - not-present
  page\n PGD 0 P4D 0\n Oops: Oops: 0000 [#1] SMP PTI\n CPU: 3 UID: 0 PID: 675528 Comm:
  fincore Not tainted 7.2.0-rc4-00002-g[]-dirty #1 PREEMPT(lazy)\n Hardware name:
  Red Hat KVM, BIOS 1.16.0-4.al8 04/01/2014\n RIP: 0010:__do_sys_mincore+0xc0/0x2c0\n\
  \ ...\n\nSpecify valid paths using valid disconnected dentries together with\nerofs_ishare_mnt
  instead of leaving f_path empty, so they are more\nlike real backing files in a
  pseudo filesystem and standard\nbacking_file_open() can be used directly."
