title: Hugging Face peft's LoRA-GA and CorDA initialization modules 
  (src/peft/tuners/lora/corda.py lines ~102 and ~163, and 
  src/peft/tuners/lora/loraga.py line ~101) call torch.load() on 
  config-specified cache/covariance files without weights_only=True, bypassing 
  peft's own safe-loading wrapper used elsewhere in the codebase. Because 
  torch.load() without weights_only=True performs full pickle deserialization, 
  loading a malicious cache or covariance file (e.g. a shared/downloaded LoRA-GA
  or CorDA cache) results in arbitrary code execution.
