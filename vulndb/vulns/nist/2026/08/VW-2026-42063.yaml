title: n8n before 1.123.67, 2.31.5, and 2.32.1 contains a SQL injection 
  vulnerability in the PostgresTrigger node, which interpolates user-supplied 
  identifier parameters (channel, function, and trigger names) into SQL 
  statements without proper escaping. An authenticated user can inject arbitrary
  SQL executed against the connected PostgreSQL database with the configured 
  credential's privileges, allowing full read and write access.
