title: "The USB device-side CDC NCM class control-to-host handler usbd_cdc_ncm_cth
  in subsys/usb/device_next/class/usbd_cdc_ncm.c builds a fixed-size response for
  the GET_NTB_PARAMETERS (28-byte struct ntb_parameters) and GET_NTB_INPUT_SIZE (8-byte
  struct ntb_input_size) class requests and copies the whole structure into the control
  DATA IN buffer with net_buf_add_mem(buf, ..., sizeof(...)), ignoring the host-supplied
  wLength.\n\nThe control DATA IN buffer is allocated by the USB stack with a capacity
  of exactly wLength bytes (usbd_ep_ctrl_data_in_alloc -> udc_ctrl_data_alloc -> net_buf_alloc_len(&udc_ep_pool,
  wLength); no round-up is applied for the IN endpoint). Because net_buf_add_mem/net_buf_simple_add
  only bounds the copy with an __ASSERT_NO_MSG, which is compiled out in production
  builds, a host that issues one of these standard CDC NCM control requests with a
  wLength smaller than the response structure (e.g. wLength = 1) causes the handler
  to memcpy up to 27 bytes past the end of the allo"
