title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  pca953x: fix pca953x_irq_bus_sync_unlock regmap lock\n\nLocking is disabled in the
  regmap config as this driver uses its own\nlock. This means that all calls to regmap
  functions (read or write) must\nhold the i2c_lock. The function pca953x_irq_bus_sync_unlock()
  did not do\nthis, and it was therefore possible that multiple threads could cause
  an\nincorrect register to be read/written.\n\nA previous patch partly fixed this,
  but only protected the write to the\ninterrupt mask register, and not the read from
  the direction register."
