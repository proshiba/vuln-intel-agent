title: "A path traversal vulnerability existed in the handling of MISP object template
  names during STIX 2 import and MISP-to-STIX 2 export.\n\nMISP object names are passed
  to PyMISP's object-template resolution mechanism, which constructs a filesystem
  path by joining the configured MISP object-template directory, the object name,
  and definition.json. An object name originating from untrusted STIX or MISP content
  was not sufficiently restricted before being used in this filesystem path.\n\nAn
  attacker able to supply a crafted object name containing path separators or traversal
  sequences such as ../ could therefore cause template resolution to escape the expected
  template directory and attempt to load a definition.json file from another location
  accessible to the process.\n\nDuring STIX 2 import, an attacker-controlled x_misp_name
  from a custom STIX object could directly reach this template-resolution mechanism.\n\
