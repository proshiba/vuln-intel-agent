title: A vulnerability was detected in Model Context Protocol mcp-rdf-explorer 
  1.0.0. Affected is the function explore_url of the file 
  src/mcp-rdf-explorer/server.py of the component MCP Server. Performing a 
  manipulation of the argument url results in server-side request forgery. The 
  attack may be initiated remotely. The exploit is now public and may be used. 
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
