title: "The implementation of this ioctl attempts to acquire locks on all channels
  in a sync group.  If locking a channel would block, it releases the sync group list
  lock and sleeps.  Upon reawakening, it is possible that the sync group structure
  is freed, but the implementation did not handle this possibility.\n\n On a system
  with a multiple audio devices, an unprivileged local user can exploit this use-after-free
  to escalate privileges."
