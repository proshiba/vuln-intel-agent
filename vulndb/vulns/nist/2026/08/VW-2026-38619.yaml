title: "An OS command injection vulnerability exists in the VPN module of TP-Link
  AXE75 V1 routers. This vulnerability allows an adjacent, authenticated attacker
  to execute arbitrary commands on the device by importing a specially crafted VPN
  client configuration file. The issue arises from improper filtering of special characters. \n\
  \nSuccessful exploitation of this vulnerability may enable an attacker to gain full
  control of the affected device, potentially compromising configuration integrity,
  network security, and service availability."
