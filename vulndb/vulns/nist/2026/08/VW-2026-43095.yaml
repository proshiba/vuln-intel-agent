title: Apache Airflow's Task SDK did not mask the contents of a Variable whose 
  JSON value is a list, so secrets stored in that shape appeared in cleartext in
  task logs and in the Rendered Templates UI. Masking was applied only when the 
  deserialized value was a string or a dict; a list at the top level matched 
  neither and was returned unmasked. Any authenticated user able to read the 
  logs or rendered templates of a task that references such a Variable could 
  recover the values, with no special configuration required. This is the 
  list-shaped counterpart of CVE-2026-59244, whose fix covered the dict case 
  only, so deployments that upgraded in response to that advisory remain 
  affected and must upgrade again. Users are advised to upgrade to 
  apache-airflow 3.3.1 or later.
