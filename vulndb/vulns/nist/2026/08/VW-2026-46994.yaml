title: The Speed Optimizer – The All-In-One Performance-Boosting Plugin plugin 
  for WordPress is vulnerable to Stored Cross-Site Scripting via Image Tag 
  Attributes in all versions up to, and including, 7.8.0 due to insufficient 
  input sanitization and output escaping. This makes it possible for 
  authenticated attackers, with contributor-level access and above, to inject 
  arbitrary web scripts in pages that will execute whenever a user accesses an 
  injected page. This is only exploitable when the site administrator has 
  enabled the Lazy Load Media option in the plugin settings.
