title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  add depth limit to indx_find_buffer to prevent stack overflow\n\nindx_find_buffer()
  recursively descends the B+ tree index with no depth\nlimit.  A crafted NTFS image
  with circular index node references causes\nunbounded recursion, overflowing the
  kernel stack and panicking the\nsystem.\n\nThis is reachable by mounting a malicious
  NTFS filesystem (e.g. from a\nUSB drive via desktop automount) and deleting a file
  whose index entry\ntriggers the rebalancing fallback path in indx_delete_entry().\n\
  \nAdd a depth parameter and bail out with -EINVAL when it reaches the\nfnd->nodes
  array bound, matching the constraint already enforced by\nfnd_push() in indx_find().\n\
  \nThe related function indx_find() was previously patched for a similar\ninfinite-loop
  issue (commit 1732053c8a6b), but indx_find_buffer() was\nmissed."
