title: SiYuan v3.7.4-alpha.1 (a pre-release; the endpoint does not exist in 
  stable v3.7.3 or earlier) contains an information disclosure vulnerability in 
  the /api/av/getAttributeViewFieldViews endpoint. The route is registered with 
  CheckAuth only and applies no publish-access filtering, so reader-role callers
  can retrieve the complete database view structure — every view's name, icon, 
  layout type, and per-field Hidden flag — for any database whose avID is 
  supplied, regardless of authorization. The issue was introduced by commit 
  acfc02ee8 and fixed in v3.7.4.
