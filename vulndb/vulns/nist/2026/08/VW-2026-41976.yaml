title: A flaw was found in iperf3. A remote attacker can exploit this 
  vulnerability by sending crafted control-channel JSON with oversized numeric 
  parameters, such as `parallel` and `len`, which are not properly validated by 
  the server. This improper input validation can lead to excessive stream and 
  thread creation, as well as large buffer allocations, causing resource 
  exhaustion. Consequently, this can result in a Denial of Service (DoS) on the 
  affected iperf3 server.
