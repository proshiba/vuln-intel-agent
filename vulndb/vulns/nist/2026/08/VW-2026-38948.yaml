title: 'A weakness has been identified in mz-automation libiec61850 up to 1.6.1. This
  issue affects the function checkDataSetAccess of the file src/iec61850/server/mms_mapping/mms_mapping.c
  of the component MMS Request Handler. This manipulation causes out-of-bounds read.
  The attack can be initiated remotely. The exploit has been made available to the
  public and could be used for attacks. Upgrading to version 1.6.2 is capable of addressing
  this issue. Patch name: 062062daf4cb50c7aa76e01d6fb4d58fc9278a7d. Upgrading the
  affected component is recommended. The vendor was contacted early about this disclosure.'
