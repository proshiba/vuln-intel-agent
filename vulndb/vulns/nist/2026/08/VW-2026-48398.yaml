title: UAC (Unix-like Artifacts Collector) versions prior to 3.3.0 contain a 
  command injection vulnerability in the _command_collector function where 
  foreach command output lines are substituted directly into command strings via
  sed without proper escaping before being evaluated with eval. Attackers can 
  exploit this by crafting malicious filenames or artifact definitions 
  containing shell metacharacters such as command substitution syntax or 
  semicolons to execute arbitrary commands on the analyst's host system.
