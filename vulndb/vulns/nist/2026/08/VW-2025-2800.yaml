title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/hfi1:
  Correctly move list in sc_disable()\n\nCommit 13bac861952a (\"IB/hfi1: Fix abba
  locking issue with sc_disable()\")\nincorrectly tries to move a list from one list
  head to another.  The\nresult is a kernel crash.\n\nThe crash is triggered when
  a link goes down and there are waiters for a\nsend to complete.  The following signature
  is seen:\n\n  BUG: kernel NULL pointer dereference, address: 0000000000000030\n\
  \  [...]\n  Call Trace:\n   sc_disable+0x1ba/0x240 [hfi1]\n   pio_freeze+0x3d/0x60
  [hfi1]\n   handle_freeze+0x27/0x1b0 [hfi1]\n   process_one_work+0x1b0/0x380\n  \
  \ ? process_one_work+0x380/0x380\n   worker_thread+0x30/0x360\n   ? process_one_work+0x380/0x380\n\
  \   kthread+0xd7/0x100\n   ? kthread_complete_and_exit+0x20/0x20\n   ret_from_fork+0x1f/0x30\n\
  \nThe fix is to use the correct call to move the list."
