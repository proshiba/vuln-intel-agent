title: Vim is an open source, command line text editor. Prior to 9.2.0842, the 
  socket server backend in src/socketserver.c accepts unbounded client 
  connections in socketserver_accept(), causing descriptors to overflow fd_set 
  structures in src/channel.c and fixed-size struct pollfd arrays in 
  src/os_unix.c, which allows a local process that can connect to the server 
  socket to corrupt stack memory or terminate the Vim server. This issue is 
  fixed in version 9.2.0842.
