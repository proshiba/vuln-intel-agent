title: Activepieces is an open source AI workflow automation platform. Prior to 
  0.80.0, the worker's code-compilation pipeline builds the on-disk path for a 
  Code step from the step's name and passes that path to a shell-invoked build 
  command. A step name containing shell metacharacters can break out of the 
  intended build invocation and execute arbitrary commands during compilation 
  before any code sandbox is created. An authenticated user with permission to 
  create or edit a flow can execute commands as the worker process user, read 
  and write the worker filesystem, exfiltrate environment secrets, and reach 
  internal services available to the worker. This issue is fixed in version 
  0.80.0.
