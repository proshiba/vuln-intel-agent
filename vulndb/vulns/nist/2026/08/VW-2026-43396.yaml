title: SiYuan versions before v3.7.4 contain an information disclosure 
  vulnerability in the getBookmarkLabels endpoint that returns all bookmark 
  labels in the workspace without publish-access filtering. Anonymous readers 
  and publish-mode readers can obtain the complete bookmark vocabulary across 
  the workspace, disclosing subject matter and organizational information from 
  inaccessible documents.
