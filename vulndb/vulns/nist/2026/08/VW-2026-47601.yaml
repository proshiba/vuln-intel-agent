  arbitrary system commands, potentially resulting in full device compromise.\n\n\n\
  \n\n\n\nSuccessful exploitation may allow arbitrary command execution with elevated
  privileges, compromising the confidentiality, integrity, and availability of the
  affected device and network traffic passing through it."
