title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix hole runlist memory leak in insert range error path\n\nntfs_non_resident_attr_insert_range()
  allocates hole_rl before mapping the\nwhole runlist. If ntfs_attr_map_whole_runlist()
  fails, the error path drops\nni->runlist.lock and returns without freeing hole_rl.
  This leaks memory\nof sizeof(*hole_rl) * 2 bytes.\n\nFix this memory leak by freeing
  hole_rl before returning from\nthat error path, matching the later error paths in
  the same function."
