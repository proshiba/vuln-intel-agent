title: "The Masteriyo LMS  WordPress plugin before 2.3.3 does not sanitise and escape
  a quiz field before outputting it back in a page, and grants its instructor role
  the ability to store unfiltered HTML, allowing such users to perform Stored Cross-Site
  Scripting attacks against any visitor of the affected page, including administrators.\n\
  This affects default single-site installations. Sites running multisite, or defining
  DISALLOW_UNFILTERED_HTML, are not affected as the capability is not granted there."
