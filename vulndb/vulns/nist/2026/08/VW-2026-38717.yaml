title: FreeRDP Windows client before 3.29.0 contains a heap buffer overflow 
  vulnerability in the clipboard virtual channel when processing 
  CLIPRDR_FILE_CONTENTS_RESPONSE PDUs without validating the server-provided 
  size against the destination buffer. A malicious RDP server can send a 
  response with a data payload significantly larger than requested, causing 
  arbitrary heap memory corruption that may enable remote code execution when a 
  user performs a paste operation.
