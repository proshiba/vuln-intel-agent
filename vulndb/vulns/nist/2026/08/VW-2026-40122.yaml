title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  us144mkii: capture_urb_complete: redundant usb_anchor_urb corrupts anchor list on
  each resubmission\n\nIn capture_urb_complete(), usb_anchor_urb() is called on every\n\
  completion callback, but the URB is already anchored from the\ninitial submission
  in tascam_trigger_start(). Each redundant call\ncorrupts the anchor's doubly-linked
  list and inflates the URB\nrefcount. When usb_kill_anchored_urbs() traverses the
  list during\nstream stop / suspend / disconnect, the corrupted list leads to\nuse-after-free.\n\
  \nRemove the redundant usb_anchor_urb() from the resubmit path."
