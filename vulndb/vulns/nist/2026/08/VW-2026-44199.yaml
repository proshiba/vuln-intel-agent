title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  libata-core: Reject an invalid concurrent positioning ranges count\n\nata_dev_config_cpr()
  takes the number of range descriptors from buf[0]\nof the concurrent positioning
  ranges log (up to 255), which the device\nreports independently of the log size
  in the GPL directory. The count is\nthen walked at a fixed 32-byte stride in two
  places with no bound: the\nlog read here, and the INQUIRY VPD page B9h emitter,
  which writes one\ndescriptor per range into the fixed 2048-byte ata_scsi_rbuf. A
  device\nreporting a count larger than its own log overflows the read buffer (up\n\
  to 7704 bytes past a 512-byte slab), and a count above 62 overflows the\nresponse
  buffer on the emit side.\n\nBound the count once, on probe, against both the log
  the device returned\nand the number of descriptors the VPD B9h response buffer can
  hold\n(ATA_DEV_MAX_CPR, derived from the rbuf size). Reject an out-of-range\ncount
  with a warning; this keeps the emitte"
