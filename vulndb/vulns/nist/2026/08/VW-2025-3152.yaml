title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  don't attempt to queue IO under RCU protection\n\ndm looks up the table for IO based
  on the request type, with an\nassumption that if the request is marked REQ_NOWAIT,
  it's fine to\nattempt to submit that IO while under RCU read lock protection. This\n\
  is not OK, as REQ_NOWAIT just means that we should not be sleeping\nwaiting on other
  IO, it does not mean that we can't potentially\nschedule.\n\nA simple test case
  demonstrates this quite nicely:\n\nint main(int argc, char *argv[])\n{\n       \
  \ struct iovec iov;\n        int fd;\n\n        fd = open(\"/dev/dm-0\", O_RDONLY
  | O_DIRECT);\n        posix_memalign(&iov.iov_base, 4096, 4096);\n        iov.iov_len
  = 4096;\n        preadv2(fd, &iov, 1, 0, RWF_NOWAIT);\n        return 0;\n}\n\n\
  which will instantly spew:\n\nBUG: sleeping function called from invalid context
  at include/linux/sched/mm.h:306\nin_atomic(): 0, irqs_disabled(): 0, non_block:
  0, pid: 5580, name: dm-nowait\npreempt_count: 0, expe"
