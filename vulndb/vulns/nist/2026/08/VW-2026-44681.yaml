title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  watchdog: fix refcount tracking races\n\nBlamed commit converted the untracked dev_hold()/dev_put()
  calls\nin the watchdog code to use the tracked dev_hold_track()/dev_put_track()\n\
  (which were later renamed/interfaced to netdev_hold() and netdev_put()).\n\nBy introducing
  dev->watchdog_dev_tracker to store the\nreference tracking information without adding
  synchronization\nbetween netdev_watchdog_up() and dev_watchdog(), it enabled the\n\
  race condition where this pointer could be overwritten or freed\nconcurrently, leading
  to the list corruption crash syzbot reported:\n\nlist_del corruption, ffff888114a18c00->next
  is NULL\n kernel BUG at lib/list_debug.c:52 !\nOops: invalid opcode: 0000 [#1] SMP
  KASAN PTI\nCPU: 1 UID: 0 PID: 91 Comm: kworker/u8:5 Not tainted syzkaller #0 PREEMPT(lazy)\n\
  Hardware name: Google Google Compute Engine/Google Compute Engine, BIOS Google 05/09/2026\n\
  Workqueue: events_unbound linkwatch_event\n RIP: 0010:__li"
