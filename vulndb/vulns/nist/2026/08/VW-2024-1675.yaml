title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate request buffer size in smb2_allocate_rsp_buf()\n\nThe response buffer should
  be allocated in smb2_allocate_rsp_buf\nbefore validating request. But the fields
  in payload as well as smb2 header\nis used in smb2_allocate_rsp_buf(). This patch
  add simple buffer size\nvalidation to avoid potencial out-of-bounds in request buffer."
