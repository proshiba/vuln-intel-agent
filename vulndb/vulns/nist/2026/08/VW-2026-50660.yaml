title: A security vulnerability has been detected in danielpopamd 
  linkedin-ads-mcp 1.0.0. Affected by this vulnerability is the function 
  fs.readFileSync of the file src/tools/campaign-management.ts of the component 
  Media Upload. Such manipulation of the argument filePath leads to path 
  traversal. The attack may be performed from remote. The exploit has been 
  disclosed publicly and may be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
