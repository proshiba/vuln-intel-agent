title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6/addrconf:
  fix a potential refcount underflow for idev\n\nNow in addrconf_mod_rs_timer(), reference
  idev depends on whether\nrs_timer is not pending. Then modify rs_timer timeout.\n\
  \nThere is a time gap in [1], during which if the pending rs_timer\nbecomes not
  pending. It will miss to hold idev, but the rs_timer\nis activated. Thus rs_timer
  callback function addrconf_rs_timer()\nwill be executed and put idev later without
  holding idev. A refcount\nunderflow issue for idev can be caused by this.\n\n\t\
  if (!timer_pending(&idev->rs_timer))\n\t\tin6_dev_hold(idev);\n\t\t  <--------------[1]\n\
  \tmod_timer(&idev->rs_timer, jiffies + when);\n\nTo fix the issue, hold idev if
  mod_timer() return 0."
