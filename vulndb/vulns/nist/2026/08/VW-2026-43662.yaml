title: Next AI Draw.io through 0.4.16 contains a server-side request forgery 
  vulnerability in the POST /api/parse-url endpoint due to hostname validation 
  that only checks string patterns without DNS resolution. Unauthenticated 
  attackers can supply hostnames that bypass string validation but resolve to 
  internal addresses, allowing them to reach arbitrary internal HTTP services 
  and exfiltrate responses including cloud metadata.
