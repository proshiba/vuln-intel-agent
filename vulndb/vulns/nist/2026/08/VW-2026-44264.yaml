title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndma-fence:
  Make dma_fence_dedup_array() robust against 0-count input\n\ndma_fence_dedup_array()
  returns 1 when called with num_fences == 0:\nthe for-loop body never executes, j
  stays at 0, and the final\n`return ++j` yields 1. This contradicts both the kernel-doc
  (\"Return:\nNumber of unique fences remaining in the array\") and the natural\n\
  expectation that 0 input gives 0 output.\n\nThe caller __dma_fence_unwrap_merge()
  bails out via the\n`if (count == 0 || count == 1)` fast path and so is save.\n\n\
  But amdgpu_userq_wait_*() could reach the dedup call with a zero local\ncount and
  dereference an uninitialized fence slot in the array.\n\nMake the contract match
  the documentation by returning 0 early. This\nalso skips an unnecessary sort() call
  on an empty array."
