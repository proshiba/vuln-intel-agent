title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  sh: rz-dmac: Move interrupt request after everything is set up\n\nOnce the interrupt
  is requested, the interrupt handler may run immediately.\nSince the IRQ handler
  can access channel->ch_base, which is initialized\nonly after requesting the IRQ,
  this may lead to invalid memory access.\nLikewise, the IRQ thread may access uninitialized
  data (the ld_free,\nld_queue, and ld_active lists), which may also lead to issues.\n\
  \nRequest the interrupts only after everything is set up. To keep the error\npath
  simpler, use dmam_alloc_coherent() instead of dma_alloc_coherent()."
