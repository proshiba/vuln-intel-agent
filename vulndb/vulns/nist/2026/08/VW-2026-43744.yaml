title: Allocation of Resources Without Limits or Throttling (CWE-770) in Kibana 
  can lead to denial of service via Excessive Allocation (CAPEC-130). An 
  authenticated user who is authorized to manage maintenance windows could 
  submit a specially crafted, malformed payload that causes the Kibana process 
  to consume excessive resources. Kibana becomes unresponsive for all users and 
  does not recover without manual intervention.
