title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  uvcvideo: Fix crash during unbind if gpio unit is in use\n\nWe used the wrong device
  for the device managed functions. We used the\nusb device, when we should be using
  the interface device.\n\nIf we unbind the driver from the usb interface, the cleanup
  functions\nare never called. In our case, the IRQ is never disabled.\n\nIf an IRQ
  is triggered, it will try to access memory sections that are\nalready free, causing
  an OOPS.\n\nWe cannot use the function devm_request_threaded_irq here. The devm_*\n\
  clean functions may be called after the main structure is released by\nuvc_delete.\n\
  \nLuckily this bug has small impact, as it is only affected by devices\nwith gpio
  units and the user has to unbind the device, a disconnect will\nnot trigger this
  error."
