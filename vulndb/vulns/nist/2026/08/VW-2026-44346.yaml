title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/damon/sysfs-schemes:
  fix dir put orders in access_pattern_add_dirs()\n\nPatch series \"mm/damon/sysfs-schemes:
  fix wrong directories put orders in\nerror paths\".\n\nError paths of damon_sysfs_access_pattern_add_dirs()
  and\ndamon_sysfs_scheme_add_dirs() functions put references to directories in\n\
  wrong orders.  As a result, uninitialized memory dereference and/or\nmemory leak
  can happen.  Fix those.\n\n\nThis patch (of 2):\n\nIn access_pattern_add_dirs(),
  error handling path puts references starting\nfrom setup failed directories.  If
  the failure happpened from the initial\nallication in the setup functions, uninitialized
  memory dereference\nhappen.  The allocation failures will not commonly happen, but
  the\nconsequence is quite bad.  Fix the wrong reference put orders.\n\nThe issue
  was discovered [1] by Sashiko."
