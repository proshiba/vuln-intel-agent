title: A flaw was found in the user-event metrics recording of Keycloak. When 
  metrics are enabled, the system records raw error messages from failed account
  operations as Prometheus metric labels. Because these error messages can 
  include user-supplied input like nonexistent client IDs, an authenticated user
  can create a massive number of unique metric entries, eventually exhausting 
  system memory and causing the service to crash or become unavailable.
