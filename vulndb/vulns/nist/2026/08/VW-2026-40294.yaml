title: Ground Station prior to 0.6.0 contains an unauthenticated 
  denial-of-service vulnerability in the Socket.IO server's service_control 
  event handler that allows any unauthenticated network peer to forcibly 
  terminate the ground-station process by sending a single restart_service 
  command. Attackers can connect to the Socket.IO server on port 7000 without 
  credentials due to disabled authentication enforcement and a wildcard CORS 
  policy, then emit the service_control event to terminate all active 
  satellite-tracking sessions, SDR recording pipelines, demodulators, decoders, 
  and rotator controllers, with repeated triggering possible in Docker 
  deployments to create a persistent denial-of-service condition.
