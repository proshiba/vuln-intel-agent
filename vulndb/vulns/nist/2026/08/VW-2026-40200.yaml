title: OpenChamber 1.11.7 contains a path traversal vulnerability in the 
  file-serving endpoints /api/fs/read, /api/fs/stat, and /api/fs/raw that allows
  unauthenticated remote attackers to read arbitrary files by supplying the 
  allowOutsideWorkspace=true query parameter alongside an absolute path, 
  bypassing the workspace boundary check in resolveReadPathFromContext. 
  Attackers can exploit the vacuous isPathWithinRoot guard to read sensitive 
  files such as the JWT signing secret, SSH private keys, API credentials, and 
  environment variables, enabling full authentication bypass by forging session 
  cookies on password-protected deployments.
