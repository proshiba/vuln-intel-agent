title: NLTK versions before 3.10.3 contain a remote code execution vulnerability
  in allowlisted pickle loaders that trust entire module namespaces instead of 
  specific safe callables. Attackers can craft malicious pickle payloads 
  invoking dangerous in-namespace functions like ReppTokenizer._execute and 
  numpy.f2py.crackfortran.myeval through pickle REDUCE to execute arbitrary 
  commands during model or tokenizer artifact loading.
