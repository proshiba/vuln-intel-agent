title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  fix ilock leak on error in xfs_dq_get_next_id\n\nxfs_dq_get_next_id() takes the
  quota inode ILOCK before calling\nxfs_iread_extents().  If xfs_iread_extents() fails,
  the function returns\nimmediately without releasing the lock, leaking the quota
  inode ILOCK.\nThis can leave the quota inode locked and cause subsequent quota\n\
  operations to hang.\n\nFix this by jumping to a common unlock path on error instead
  of returning\ndirectly."
