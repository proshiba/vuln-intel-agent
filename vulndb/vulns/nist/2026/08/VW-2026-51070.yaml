title: openssl_encrypt versions before 1.4.9 contain a weak key derivation 
  vulnerability in the D-Bus CryptoService.EncryptFile handler that uses 
  unstretched SHA-256 instead of Argon2id. Attackers can perform offline 
  password guessing against encrypted files roughly six to seven orders of 
  magnitude faster than documented protection by exploiting the missing key 
  stretching and hash rounds.
