title: Ninja Tables Pro 5.2.11 contains an embedded malicious code vulnerability
  introduced via a tampered plugin build served through a decommissioned update 
  server. The tampered build introduced a rogue PHP file 
  (app/Library/updater/NinjaTableDataSync.php) that established a backdoor REST 
  API endpoint, dropped persistent PHP files in mu-plugins and uploads 
  directories, installed a passwordless administrator account, and registered 
  scheduled tasks that survived plugin removal.
