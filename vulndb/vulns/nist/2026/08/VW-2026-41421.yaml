title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  carl9170: fix OOB read from off-by-two in TX status handler\n\nThe bounds check
  in carl9170_tx_process_status() uses\n`i > ((cmd->hdr.len / 2) + 1)` which is off
  by two, allowing\n2 extra iterations past valid _tx_status entries when the firmware-\n\
  controlled hdr.ext exceeds hdr.len/2. Fix by using the correct\ncomparison `i >=
  (cmd->hdr.len / 2)`."
