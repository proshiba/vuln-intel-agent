title: A flaw was found in dracut. The die() error-handling function writes its 
  message into a shell script under the initramfs emergency-hook directory 
  without properly shell-quoting it. When the message contains data derived from
  the DHCP ROOT_PATH option, an attacker on the adjacent network who controls a 
  rogue DHCP server can inject a command-substitution sequence that executes as 
  root the next time dracut sources its emergency hook scripts during standard 
  boot-failure handling.
