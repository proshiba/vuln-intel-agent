title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  mvebu: free generic chips on unbind\n\nirq_alloc_domain_generic_chips() allocates
  generic chip data that must\nbe freed via irq_domain_remove_generic_chips(). The
  devres action\nmvebu_gpio_remove_irq_domain() only called irq_domain_remove(), which\n\
  only frees the generic chips if IRQ_DOMAIN_FLAG_DESTROY_GC is set.\nCall irq_domain_remove_generic_chips()
  explicitly before\nirq_domain_remove() instead."
