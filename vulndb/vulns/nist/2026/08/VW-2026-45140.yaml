title: Scriban versions 3.0.0 through 7.2.0 contain a denial of service 
  vulnerability in the array multiplication operator that allocates memory 
  without enforcing LoopLimit or overflow-safe arithmetic checks. Attackers can 
  supply a large integer multiplier in a template to force multi-gigabyte memory
  allocations, causing resource exhaustion and availability degradation.
