title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio-net:
  fix overflow inside virtnet_rq_alloc\n\nWhen the frag just got a page, then may
  lead to regression on VM.\nSpecially if the sysctl net.core.high_order_alloc_disable
  value is 1,\nthen the frag always get a page when do refill.\n\nWhich could see
  reliable crashes or scp failure (scp a file 100M in size\nto VM).\n\nThe issue is
  that the virtnet_rq_dma takes up 16 bytes at the beginning\nof a new frag. When
  the frag size is larger than PAGE_SIZE,\neverything is fine. However, if the frag
  is only one page and the\ntotal size of the buffer and virtnet_rq_dma is larger
  than one page, an\noverflow may occur.\n\nThe commit f9dac92ba908 (\"virtio_ring:
  enable premapped mode whatever\nuse_dma_api\") introduced this problem. And we reverted
  some commits to\nfix this in last linux version. Now we try to enable it and fix
  this\nbug directly.\n\nHere, when the frag size is not enough, we reduce the buffer
  len to fix\nthis problem."
