title: Nexus Repository 3 did not fully sandbox JEXL expressions used in Content
  Selectors. An account holding the nexus:selectors:create permission could 
  construct an expression that read Java object properties not intended to be 
  exposed to the expression engine, disclosing internal JVM class metadata such 
  as class and classloader names. This issue does not permit method invocation, 
  object construction, or arbitrary code execution. This has been fixed by 
  restricting property access in the JEXL sandbox to the intended data types.
