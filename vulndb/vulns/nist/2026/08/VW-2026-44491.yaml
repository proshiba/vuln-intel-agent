title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  mcast: Fix potential UAF in MLD delayed work\n\nA race condition exists between
  device teardown and incoming MLD query\nprocessing, leading to a Use-After-Free
  in the MLD delayed work.\n\nDuring device destruction, the primary reference to
  inet6_dev is dropped,\nwhich can drop its refcount to 0. The actual freeing of inet6_dev
  memory\nis deferred via RCU.\n\nConcurrently, the packet receive path runs under
  RCU read lock and obtains\nthe inet6_dev pointer. Because the memory is RCU-protected,
  CPU-0 can\nsafely dereference inet6_dev even if its refcount has hit 0.\n\nHowever,
  if CPU-0 calls igmp6_event_query() and schedules delayed work, it\nattempts to acquire
  a reference using in6_dev_hold(). This increments the\nrefcount from 0 to 1, triggering
  a \"refcount_t: addition on 0\" warning.\nSince the inet6_dev memory is still scheduled
  to be freed after the RCU\ngrace period, the device is freed while the work is still
  scheduled.\nWhen"
