title: FirmaCheck for Windows before 1.3.16 contains a DLL hijacking 
  vulnerability that allows local attackers to execute arbitrary code by placing
  a crafted openssl.cnf file in the unvalidated C:\Program Files (x86)\Common 
  Files\SSL\ directory path. Attackers can write a malicious OpenSSL 
  configuration file referencing an attacker-controlled DLL to achieve code 
  execution at startup process privilege level when FirmaCheck.exe runs 
  automatically at system startup.
