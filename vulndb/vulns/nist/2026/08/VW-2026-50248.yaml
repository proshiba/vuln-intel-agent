title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc4-topology: Refresh copier IPC payload before widget setup\n\nThe ipc_config_data
  buffer for copier widgets is built once during\nipc_prepare (called from sof_pcm_setup_connected_widgets)
  and cached\nfor reuse. For host copiers this buffer contains the copier_data with\n\
  gtw_cfg.node_id (host DMA ID). For DAI copiers it additionally includes\na dma_config_tlv
  trailer with stream_id and dma_channel_id for HDA link\nDMA.\n\nOn suspend/resume,
  both host and link DMA streams are released and\nre-allocated with potentially different
  stream tags. The underlying\ncopier_data and dma_config_tlv structures are correctly
  updated by\nhost_config and sdw_hda_dai_hw_params respectively. However, since the\n\
  widget list (spcm->stream[].list) persists across suspend,\nsof_pcm_hw_params skips
  sof_pcm_setup_connected_widgets and ipc_prepare\nnever runs again to rebuild ipc_config_data.
