title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  serialize qdisc_rtab_list against concurrent get/put\n\nqdisc_get_rtab() and qdisc_put_rtab()
  mutate the process-global singly\nlinked list qdisc_rtab_list and a plain non-atomic
  'int refcnt' with no\nlock. This was only safe because every caller historically
  held the RTNL\nmutex, which serialized all rate-table lookups, inserts and frees.\n\
  \nThat invariant no longer holds. cls_flower sets\nTCF_PROTO_OPS_DOIT_UNLOCKED,
  so tc_new_tfilter() keeps rtnl_held == false\nfor it and sets TCA_ACT_FLAGS_NO_RTNL.
  That flag propagates through\ntcf_exts_validate_ex() -> tcf_action_init() -> tcf_action_init_1()
  ->\ntcf_police_init(), which calls qdisc_get_rtab()/qdisc_put_rtab() with the\n\
  RTNL mutex NOT held. Two RTM_NEWTFILTER requests on different CPUs, each\nadding
  a flower filter with a police action carrying the same rate, then\nrace on qdisc_rtab_list
  and on the non-atomic refcnt, leading to a\nuse-after-free / double-free of the"
