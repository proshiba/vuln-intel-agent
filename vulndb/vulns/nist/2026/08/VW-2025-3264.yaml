title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  TC, Fix using eswitch mapping in nic mode\n\nCited patch is using the eswitch object
  mapping pool while\nin nic mode where it isn't initialized. This results in the\n\
  trace below [0].\n\nFix that by using either nic or eswitch object mapping pool\n\
  depending if eswitch is enabled or not.\n\n[0]:\n[  826.446057] ==================================================================\n\
  [  826.446729] BUG: KASAN: slab-use-after-free in mlx5_add_flow_rules+0x30/0x490
