title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  airoha: Fix potential use-after-free in airoha_ppe_deinit()\n\nairoha_ppe_deinit()
  replaces the NPU pointer with NULL via\nrcu_replace_pointer() but does not wait
  for existing RCU readers\nto exit before calling ppe_deinit() and airoha_npu_put().
  This can\ncause a use-after-free if a reader in an RCU read-side critical\nsection
  still holds a reference to the NPU when it is freed.\n\nThe init path (airoha_ppe_init)
  already calls synchronize_rcu()\nafter rcu_assign_pointer(), but the deinit path
  introduced in\ncommit 6abcf751bc08 (\"net: airoha: Fix schedule while atomic in\n\
  airoha_ppe_deinit()\") omitted the matching barrier when switching\nfrom rcu_read_lock()/rcu_dereference()
  to rcu_replace_pointer().\n\nAdd synchronize_rcu() before ppe_deinit() to ensure
  all existing\nRCU readers have completed before the NPU resources are released."
