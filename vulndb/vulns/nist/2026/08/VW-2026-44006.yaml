title: Netatalk is a Free and Open Source file server suite for Unix-like 
  operating systems. In versions 3.1.19 through 4.4.2, a  stack-based buffer 
  overflow exists in the copydir() function of Netatalk's afpd daemon due to an 
  integer underflow in the calculation of the remaining buffer size used for 
  path construction. copydir() is a utility function called when a file 
  operation crosses a device boundary inside an AFP shared volume, which the 
  standard library's renameat() cannot handle. The function attempts to track 
  available buffer space using srem and drem for source and destination paths. 
  Incorrect arithmetic causes both srem and drem to underflow to SIZE_MAX. 
  Consequently, boundary checks against strlen(de->d_name) always pass, allowing
  strcpy() to append filenames into nearly full stack buffers. Version 4.4.3 
  patches the issue. As a workaround, configure each AFP shared volume to be 
  structured as a single file system, in other words no subdirectory of a shared
