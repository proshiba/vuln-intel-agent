title: "In the Linux kernel, the following vulnerability has been resolved:\n\nskbuff:
  skb_segment, Call zero copy functions before using skbuff frags\n\nCommit bf5c25d60861
  (\"skbuff: in skb_segment, call zerocopy functions\nonce per nskb\") added the call
  to zero copy functions in skb_segment().\nThe change introduced a bug in skb_segment()
  because skb_orphan_frags()\nmay possibly change the number of fragments or allocate
  new fragments\naltogether leaving nrfrags and frag to point to the old values. This
  can\ncause a panic with stacktrace like the one below.\n\n[  193.894380] BUG: kernel
  NULL pointer dereference, address: 00000000000000bc\n[  193.895273] CPU: 13 PID:
  18164 Comm: vh-net-17428 Kdump: loaded Tainted: G           O      5.15.123+ #26\n\
  [  193.903919] RIP: 0010:skb_segment+0xb0e/0x12f0\n[  194.021892] Call Trace:\n\
  [  194.027422]  <TASK>\n[  194.072861]  tcp_gso_segment+0x107/0x540\n[  194.082031]\
  \  inet_gso_segment+0x15c/0x3d0\n[  194.090783]  skb_mac_gso_segment+0x9f/0x110\n\
  [  194.095016]  __skb_gso_"
