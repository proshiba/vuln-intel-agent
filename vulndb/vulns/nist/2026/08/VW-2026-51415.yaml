title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  vub300: defer reset until cmd_mutex is unlocked\n\nvub300_cmndwork_thread() holds
  cmd_mutex while it sends a command and\nwaits for the command response.  If the
  response wait times out,\n__vub300_command_response() kills the command URBs and
  then synchronously\nresets the USB device through usb_reset_device().\n\nThat reset
  path re-enters the driver through vub300_pre_reset(), which\nalso takes cmd_mutex.\
  \  The worker therefore tries to acquire the same\nmutex recursively while it is
  still holding it from the command path.\n\nThis issue was found by our static analysis
  tool and then manually\nreviewed against the current tree.\n\nThe grounded PoC kept
  the real worker and timeout/reset carrier:\n\n  vub300_cmndwork_thread()\n  __vub300_command_response()\n\
  \  usb_lock_device_for_reset()\n  usb_reset_device()\n  vub300_pre_reset()\n\nLockdep
  reported the same-task recursive acquisition on cmd_mutex:\n\n  WARNING: possible
  recursive locking "
