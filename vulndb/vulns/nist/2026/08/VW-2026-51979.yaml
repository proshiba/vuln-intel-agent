title: A vulnerability was detected in sambitraj Student Management System up to
  56ba287f2e9031523ccb4244cb6e3fe530e4e5d5. Affected by this issue is the 
  function mysqli_query of the file student_dashboard.php of the component 
  Student Dashboard. The manipulation of the argument roll_no results in 
  improper authorization. The attack may be performed from remote. The exploit 
  is now public and may be used. This product utilizes a rolling release system 
  for continuous delivery, and as such, version information for affected or 
  updated releases is not disclosed. The project was informed of the problem 
  early through an issue report but has not responded yet.
