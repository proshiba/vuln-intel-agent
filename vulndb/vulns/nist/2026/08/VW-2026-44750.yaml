title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  amd: acp-sdw-legacy: Bound DAI link iteration\n\ncreate_sdw_dailinks() walks soc_dais
  until it finds an entry with\ninitialised cleared, but soc_dais is allocated with
  exactly num_ends\nentries. If all entries are initialised, the loop reads past the
  end of\nthe array.\n\nThis was reported by KASAN:\n\n  BUG: KASAN: slab-out-of-bounds
  in mc_probe+0x26b3/0x2774 [snd_acp_sdw_legacy_mach]\n  Read of size 1\n\nPass the
  allocated entry count to create_sdw_dailinks() and stop before\nreading past the
  array."
