title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  oss: Fix PCM OSS buffer allocation overflow\n\nWe've got syzbot reports hitting
  INT_MAX overflow at vmalloc()\nallocation that is called from snd_pcm_plug_alloc().\
  \  Although we\napply the restrictions to input parameters, it's based only on the\n\
  hw_params of the underlying PCM device.  Since the PCM OSS layer\nallocates a temporary
  buffer for the data conversion, the size may\nbecome unexpectedly large when more
  channels or higher rates is given;\nin the reported case, it went over INT_MAX,
  hence it hits WARN_ON().\n\nThis patch is an attempt to avoid such an overflow and
  an allocation\nfor too large buffers.  First off, it adds the limit of 1MB as the\n\
  upper bound for period bytes.  This must be large enough for all use\ncases, and
  we really don't want to handle a larger temporary buffer\nthan this size.  The size
  check is performed at two places, where the\noriginal period bytes is calculated
  and where the plugin buffer size"
