title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Tighten cgroup storage cookie checks for prog arrays\n\nThe fix in commit abad3d0bad72
  (\"bpf: Fix oob access in cgroup local\nstorage\") is still incomplete. The prog-array
  compatibility check\ntreats a program with no cgroup storage as compatible with
  any stored\nstorage cookie. This allows a storage-less program to bridge a tail\n\
  call chain between an entry program and a storage-using callee even\nthough cgroup
  local storage at runtime still follows the caller's\ncontext, that is, A -> B(no
  storage) -> C(storage) path.\n\nRequiring exact cookie equality would break the
  legitimate case of a\nstorage-less leaf program being tail called from a storage-using
  one.\nInstead, only accept a zero storage cookie if the program cannot\nperform
  tail calls itself. This keeps A -> B(no storage) working\nwhile rejecting the A
  -> B(no storage) -> C(storage) bridge."
