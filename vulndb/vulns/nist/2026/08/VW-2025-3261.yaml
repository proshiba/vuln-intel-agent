title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  flower: fix filter idr initialization\n\nThe cited commit moved idr initialization
  too early in fl_change() which\nallows concurrent users to access the filter that
  is still being\ninitialized and is in inconsistent state, which, in turn, can cause
  NULL\npointer dereference [0]. Since there is no obvious way to fix the ordering\n\
  without reverting the whole cited commit, alternative approach taken to\nfirst insert
  NULL pointer into idr in order to allocate the handle but\nstill cause fl_get()
  to return NULL and prevent concurrent users from\nseeing the filter while providing
  miss-to-action infrastructure with valid\nhandle id early in fl_change().\n\n[ \
  \ 152.434728] general protection fault, probably for non-canonical address 0xdffffc0000000000:
  0000 [#1] SMP KASAN\n[  152.436163] KASAN: null-ptr-deref in range [0x0000000000000000-0x0000000000000007]\n\
  [  152.437269] CPU: 4 PID: 3877 Comm: tc Not tainted 6.3.0-rc4+ #5\n[  15"
