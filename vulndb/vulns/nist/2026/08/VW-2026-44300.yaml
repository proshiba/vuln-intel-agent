title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-apple:
  Prevent shared tags across queues on Apple A11\n\nOn Apple A11, tags of pending
  commands must be unique across the admin\nand IO queues, else the firmware crashes
  with\n\"duplicate tag error for tag N\", with N being the tag.\n\nApply the existing
  workaround for M1 of reserving two tags for the admin\nqueue to A11."
