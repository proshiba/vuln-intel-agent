title: "In the Linux kernel, the following vulnerability has been resolved:\n\niavf:
  Fix use-after-free in free_netdev\n\nWe do netif_napi_add() for all allocated q_vectors[],
  but potentially\ndo netif_napi_del() for part of them, then kfree q_vectors and
  leave\ninvalid pointers at dev->napi_list.\n\nReproducer:\n\n  [root@host ~]# cat
  repro.sh\n  #!/bin/bash\n\n  pf_dbsf=\"0000:41:00.0\"\n  vf0_dbsf=\"0000:41:02.0\"\
  \n  g_pids=()\n\n  function do_set_numvf()\n  {\n      echo 2 >/sys/bus/pci/devices/${pf_dbsf}/sriov_numvfs\n\
  \      sleep $((RANDOM%3+1))\n      echo 0 >/sys/bus/pci/devices/${pf_dbsf}/sriov_numvfs\n\
  \      sleep $((RANDOM%3+1))\n  }\n\n  function do_set_channel()\n  {\n      local
  nic=$(ls -1 --indicator-style=none /sys/bus/pci/devices/${vf0_dbsf}/net/)\n    \
  \  [ -z \"$nic\" ] && { sleep $((RANDOM%3)) ; return 1; }\n      ifconfig $nic 192.168.18.5
  netmask 255.255.255.0\n      ifconfig $nic up\n      ethtool -L $nic combined 1\n\
  \      ethtool -L $nic combined 4\n      sleep $((RANDOM%3))\n  }\n\n  function
  on_exit()\n  {\n      "
