title: An HTTP request smuggling vulnerability in the HTTP App Server of 
  Progress MarkLogic Server before 11.3.6 and 12.0.3 allows a remote attacker to
  bypass authentication and authorization checks, hijack a legitimate user's 
  session, or capture credentials. The vulnerability occurs when a crafted HTTP 
  request containing both Content-Length and Transfer-Encoding headers causes a 
  reverse proxy and MarkLogic Server to interpret request boundaries 
  differently.
