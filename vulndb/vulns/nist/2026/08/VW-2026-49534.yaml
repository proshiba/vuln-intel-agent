title: OpenEXR is the reference implementation and specification for the EXR 
  image format, widely used in the motion picture industry. OpenEXR versions 
  before 3.2.11, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13 are vulnerable 
  on ILP32 builds to an out-of-bounds read. The vulnerability is reached when a 
  crafted uncompressed deep-tile EXR causes the sample-count table size 
  calculation in OpenEXRCore decoding.c to wrap before unpack_sample_table() 
  iterates over the full attacker-controlled tile dimensions, allowing denial of
  service. This issue is fixed in versions 3.2.11, 3.3.13, and 3.4.14.
