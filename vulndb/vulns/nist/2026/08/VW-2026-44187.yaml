title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndibs:
  loopback: validate offset and size in move_data()\n\nThe loopback move_data() performs
  a memcpy into the registered DMB\nwithout checking whether offset + size exceeds
  the DMB length.  Unlike\nreal ISM hardware, which enforces memory region bounds
  natively, the\nsoftware loopback has no such protection.\n\nA peer-supplied out-of-bounds
  offset or oversized write would result in\nan OOB write past the allocated kernel
  buffer.  Add an explicit bounds\ncheck before the memcpy to reject such requests
  with -EINVAL."
