title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  sanitize MFT references returned from ntfs_lookup_inode_by_name()\n\nntfs_lookup_inode_by_name()
  returns MFT references read from directory\nindex entries on disk. These values
  are untrusted, but the function can\ncurrently return an error-marked MFT reference
  to its callers without\nvalidating it.\n\nCallers later decode lookup failures with
  MREF_ERR(). A crafted NTFS image\ncan set the MREF error bit while leaving the low
  bits as an arbitrary\nvalue, causing callers to consume a bogus pseudo-errno instead
  of treating\nthe lookup result as corrupted on-disk metadata.\n\nFix this at the
  source by normalizing every error-marked MFT reference\nreturned from ntfs_lookup_inode_by_name()
  to ERR_MREF(-EIO). Apply this to\nall four directory lookup return paths so every
  caller gets a validated\nresult without needing additional checks or an API change.\n\
  \nThis keeps the sanitization in the common lookup helper, which is cleaner\nthan
  du"
