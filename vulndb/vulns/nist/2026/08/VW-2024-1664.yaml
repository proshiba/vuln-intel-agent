title: A flaw was found in the SAML client registration in Keycloak that could 
  allow an administrator to register malicious JavaScript URIs as Assertion 
  Consumer Service POST Binding URLs (ACS), posing a Cross-Site Scripting (XSS) 
  risk. This issue may allow a malicious admin in one realm or a client with 
  registration access to target users in different realms or applications, 
  executing arbitrary JavaScript in their contexts upon form submission. This 
  can enable unauthorized access and harmful actions, compromising the 
  confidentiality, integrity, and availability of the complete KC instance.
