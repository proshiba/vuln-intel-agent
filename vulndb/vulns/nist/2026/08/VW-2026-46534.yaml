title: Blueprint Studio is a VS Code-like file editor for Home Assistant 
  configuration files. Prior to 2.5.2, Blueprint Studio configured Git's 
  credential.helper store when saving Git credentials, causing Git 
  credential-store to persist usernames and access tokens in plaintext in the 
  .git-credentials file for the user running Home Assistant. Tokens could remain
  outside Blueprint Studio's intended Home Assistant storage and be read by 
  other users or processes with access to the same filesystem context. The 
  persistent helper configuration also affected later Git operations beyond the 
  immediate Blueprint Studio action. This issue is fixed in version 2.5.2.
