title: "Tobit Laboratories AG TeamDavid's Webbox application handles password changes
  using a function triggered by \nincluding the string \"(editini)\" in the file path,
  writing the new \npassword to the specified \"Archive.ini\" file. However, the application\
  \ \ndoes not verify that the provided path actually refers to an \n\"Archive.ini\"\
  \ file. If an attacker specifies a different file with \nexcessive size, a buffer
  overflow occurs. This vulnerability allows an \nunauthenticated attacker to crash
  the server, resulting in denial of \nservice. This issue affects TeamDavid through
  Rollout 524."
