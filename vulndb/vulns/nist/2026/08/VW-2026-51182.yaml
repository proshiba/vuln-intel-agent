title: The MongoDB Rust Driver does not neutralize special characters in a 
  caller-supplied target identifier before embedding it in the request it sends 
  to the server. An actor able to influence that identifier in an application 
  using the driver may cause write operations to be applied to an unintended 
  target within the same deployment using the application's own credentials. 
  This may result in unauthorized modification of data belonging to another 
  logical boundary enforced by the application.
