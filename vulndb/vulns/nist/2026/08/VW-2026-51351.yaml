title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - add response length checks\n\nThe driver processes response data from
  device buffers without verifying\nthat the device actually sent enough data. This
  can lead to\nout-of-bounds reads or processing stale data.\n\nAdd checks for the
  expected response length before accessing the\nbuffers."
