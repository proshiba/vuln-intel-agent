title: "The \"stringprep\" module didn't process characters from RFC 3454 tables \n\
  B.2 or B.3 correctly: the latest Unicode codepoint attributes were used \ninstead
  of the specified Unicode 3.2.0. This behavior would cause \nmismatches when processing
  domain names using IDNA 2003 (the \"idna\" \ncodec) and the in_table_b2() function
  of the \"stringprep\" module. This \nonly affects domain names containing characters
  that were not previously\n registered or had their Unicode attributes such as case-folding\
  \ \nbehavior updated since Unicode 3.2.0."
