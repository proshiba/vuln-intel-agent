title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  rawnand: pl353: fix probe resource allocation\n\nDuring probe(), the devm_ioremap()
  is called with the parent device\ninstead of the current one. So when the module
  is unloaded, the register\narea isn't released.\n\nTarget the pl35x device in the
  devm_ioremap() instead of its parent."
