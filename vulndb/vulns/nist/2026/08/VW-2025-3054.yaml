title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfsd:
  clean up potential nfsd_file refcount leaks in COPY codepath\n\nThere are two different
  flavors of the nfsd4_copy struct. One is\nembedded in the compound and is used directly
  in synchronous copies. The\nother is dynamically allocated, refcounted and tracked
  in the client\nstruture. For the embedded one, the cleanup just involves releasing
  any\nnfsd_files held on its behalf. For the async one, the cleanup is a bit\nmore
  involved, and we need to dequeue it from lists, unhash it, etc.\n\nThere is at least
  one potential refcount leak in this code now. If the\nkthread_create call fails,
  then both the src and dst nfsd_files in the\noriginal nfsd4_copy object are leaked.\n\
  \nThe cleanup in this codepath is also sort of weird. In the async copy\ncase, we'll
  have up to four nfsd_file references (src and dst for both\nflavors of copy structure).
