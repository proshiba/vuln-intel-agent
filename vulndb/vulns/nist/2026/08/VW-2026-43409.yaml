title: GitPython before 3.1.55 fails to disable environment variable expansion 
  in Remote.create() and Submodule.add() URL handling, allowing attackers to 
  exfiltrate secrets by supplying URLs containing variable references. Attackers
  can craft URLs with environment variable tokens that are expanded into 
  .git/config and .gitmodules, then transmitted to attacker-controlled hosts 
  during fetch or pull operations.
