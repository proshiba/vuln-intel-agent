title: "OpenMeter contains a stored, or second-order, SQL injection vulnerability
  in the handling of customer usage-attribution values.\n\n\n\nAn attacker who can
  create or update a customer can store a malicious value in the usageAttribution.key
  or usageAttribution.subjectKeys fields. When that customer is subsequently used
  in a meter or event query, OpenMeter inserts the stored value into a ClickHouse
  WITH map(...) expression using string concatenation.\n\nOpenMeter versions from
  v1.0.0-beta.218 through v1.0.0-beta.231 are affected."
