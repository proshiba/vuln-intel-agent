title: "tls_opt_dtls_peer_connection_id_value_get() in subsys/net/lib/sockets/sockets_tls.c,
  which handles getsockopt(SOL_TLS, TLS_DTLS_PEER_CID_VALUE), passed the caller-supplied
  optval directly to mbedtls_ssl_get_peer_cid() without verifying the buffer was at
  least MBEDTLS_SSL_CID_OUT_LEN_MAX (default 32) bytes. mbedtls_ssl_get_peer_cid()
  copies the peer-negotiated DTLS Connection ID (length 1..MBEDTLS_SSL_CID_OUT_LEN_MAX)
  into that buffer without a destination-size parameter, so a caller-supplied optlen
  smaller than the CID causes a write of up to 31 bytes past the buffer end.\n\nIn
  CONFIG_USERSPACE builds the getsockopt syscall verifier (z_vrfy_zsock_getsockopt)
  bounce-buffers the user's optval into a kernel allocation of exactly optlen bytes
  (k_usermode_alloc_from_copy -> z_thread_malloc), so an unprivileged user thread
  that passes a small optlen on a connected DTLS socket with Connection ID enabled
  induces a kernel-heap buffer overflow, with the overflowing content being the remote
  peer's "
