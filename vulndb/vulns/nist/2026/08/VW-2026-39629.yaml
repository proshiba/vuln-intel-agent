title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmpls:
  fix NULL deref in mpls_valid_fib_dump_req() on CONFIG_INET=n\n\nOn CONFIG_INET=n
  builds, mpls_valid_fib_dump_req() walks the parsed\nattribute table itself instead
  of calling ip_valid_fib_dump_req(). The\nRTA_OIF arm passes tb[RTA_OIF] to nla_get_u32()
  without checking it is\npresent, so an RTM_GETROUTE dump for AF_MPLS with strict
  checking and no\nRTA_OIF hits a NULL dereference.\n\nRTM_GETROUTE is RTNL_KIND_GET,
  which rtnetlink_rcv_msg() permits without\nCAP_NET_ADMIN, so an unprivileged user
  can trigger it.\n\n  Oops: general protection fault, probably for non-canonical
  address\n        0xdffffc0000000000: 0000 [#1] SMP KASAN NOPTI\n  KASAN: null-ptr-deref
  in range [0x0000000000000000-0x0000000000000007]\n  RIP: 0010:mpls_valid_fib_dump_req
  (net/mpls/af_mpls.c:2189)\n  Call Trace:\n   mpls_dump_routes (net/mpls/af_mpls.c:2236)\n\
  \   netlink_dump (net/netlink/af_netlink.c:2331)\n   __netlink_dump_start (net/netlink/af_netlink.c:2"
