title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  fix page fault due to max surface definition mismatch\n\nDC driver is using two
  different values to define the maximum number of\nsurfaces: MAX_SURFACES and MAX_SURFACE_NUM.
  Consolidate MAX_SURFACES as\nthe unique definition for surface updates across DC.\n\
  \nIt fixes page fault faced by Cosmic users on AMD display versions that\nsupport
  two overlay planes, since the introduction of cursor overlay\nmode.\n\n[Nov26 21:33]
  BUG: unable to handle page fault for address: 0000000051d0f08b\n[  +0.000015] #PF:
  supervisor read access in kernel mode\n[  +0.000006] #PF: error_code(0x0000) - not-present
