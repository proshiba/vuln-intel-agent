title: Type confusion regarding input of PostgreSQL ctid data type selectivity 
  estimator allows an object creator to view a calculation derived from the 
  value of an arbitrary 4-byte span of memory, via a chosen non-ctid input.  
  While the calculation loses precision, substantial memory value recovery 
  appears possible.  Versions before PostgreSQL 18.5, 17.11, 16.15, 15.19, and 
  14.24 are affected.
