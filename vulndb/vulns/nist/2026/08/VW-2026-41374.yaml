title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  hvs/v3d: Fix null dereference in unbind\n\nThe hvs and v3d drivers use dev_get_drvdata(master)
  in their unbind\nfunctions. Since the vc4-drm gets removed before its dependent
  drivers\n(vc4_hvs/vc4_v3d) the vc4_hvs_unbind/vc4_v3d_unbind functions try to\n\
  get drvdata of its master and fails with a null dereference error.\n\nUse the data
  pointer passed to the unbind functions directly instead of\ndev_get_drvdata(master).
  This avoids using potentially freed memory."
