title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/amd/brs:
  Fix kernel address leakage\n\nA user-only branch stack can contain branches that
  originate from\nthe kernel. As a result, kernel addresses are exposed to user space\n\
  even when PERF_SAMPLE_BRANCH_USER is requested. On AMD processors\nsupporting X86_FEATURE_BRS
  (Zen 3 only), perf can still report entries\nsuch as SYSRET/interrupt returns for
  which the branch-from addresses\nare in the kernel.\n\nE.g.\n\n  $ perf record -j
  any,u -c 4000 -e branch-brs -o - -- \\\n        perf bench syscall basic --loop
  1000 | \\\n        perf script -i - -F brstack|tr ' ' '\\n'| \\\n        grep -E
  '0x[89a-f][0-9a-f]{15}'\n\n  ...\n  0xffffffff810001c4/0x72e2e32955eb/-/-/-/0//-\n\
  \  0xffffffff810001c4/0x72e2d94a9821/-/-/-/0//-\n  0xffffffff810001c4/0x72e2d94ffa1b/-/-/-/0//-\n\
  \  ...\n\nBRS provides no hardware branch filtering, so privilege level\nfiltering
  is performed entirely in software. However, amd_brs_match_plm()\nonly validates
  the branch-to ad"
