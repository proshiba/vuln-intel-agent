title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  sm501fb: Fix buffer errors in OF binding code\n\nThe code that gets the frame buffer
  mode from OF has 'use after free',\n'buffer overrun' and memory leaks.\n\ninfo->edid_data
  isn't free if the probe functions fail or if\npd->def_mode is set.\n\nIf both the
  CRT and PANEL are enabled info->edid_data is used after\nbeing freed and is freed
  twice.\n\nThe string returned by of_get_property(np, \"mode\", &len) is just\nwritten
  over either the static \"640x480-16@60\" or the module parameter\nstring without
  any regard for the length (which is most likely longer).\n\nUse kstrump() for the
  OF mode and free everything before freeing 'info."
