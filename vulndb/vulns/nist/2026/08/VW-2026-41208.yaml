title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/x25:
  fix use-after-free in x25_kill_by_neigh()\n\nx25_kill_by_neigh() walks the global
  X.25 socket list looking for sockets\nattached to a terminating neighbour. x25_list_lock
  protects list membership\nwhile the lookup is in progress, but it does not pin a
  socket's lifetime\nafter the lock is dropped.\n\nThe function currently drops x25_list_lock
  before calling lock_sock(s). A\nconcurrent close can run x25_release(), remove the
  same socket from\nx25_list, and drop the last socket reference in that window. The
  neighbour\nteardown path can then lock or inspect a freed struct sock/struct x25_sock.\n\
  \nTake sock_hold(s) while x25_list_lock still proves that the list entry is\nlive,
  then drop the temporary reference after the socket has been locked,\nrechecked,
  and released. Recheck x25_sk(s)->neighbour after lock_sock(),\nbecause another path
  may have disconnected the socket before this path\nacquired the socket lock. Restart
  the list"
