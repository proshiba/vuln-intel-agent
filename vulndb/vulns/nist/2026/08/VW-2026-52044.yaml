title: A vulnerability was found in Cozmoslabs Profile Builder Plugin up to 
  3.16.1 on WordPress. The impacted element is the function 
  wppb_ajax_simple_avatar of the file /wp-admin/admin-ajax.php of the component 
  Avatar Simple Upload AJAX Handler. Performing a manipulation results in 
  unrestricted upload. The attack is possible to be carried out remotely. The 
  exploit has been made public and could be used. Upgrading to version 3.16.2 is
  sufficient to resolve this issue. It is suggested to upgrade the affected 
  component.
