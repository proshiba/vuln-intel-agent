title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  n_gsm: fix race condition in status line change on dead connections\n\ngsm_cleanup_mux()
  cleans up the gsm by closing all DLCIs, stopping all\ntimers, removing the virtual
  tty devices and clearing the data queues.\nThis procedure, however, may cause subsequent
  changes of the virtual modem\nstatus lines of a DLCI. More data is being added the
  outgoing data queue\nand the deleted kick timer is restarted to handle this. At
  this point many\nresources have already been removed by the cleanup procedure. Thus,
  a\nkernel panic occurs.\n\nFix this by proving in gsm_modem_update() that the cleanup
  procedure has\nnot been started and the mux is still alive.\n\nNote that writing
  to a virtual tty is already protected by checks against\nthe DLCI specific connection
  state."
