title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudp:
  fix potential use-after-free in tunnel segmentation\n\n__skb_udp_tunnel_segment()
  gets the UDP header before ensuring the\ntunnel header is in the skb head. If the
  pull reallocates skb->head,\nthe saved UDP header pointer is no longer valid.\n\n\
  Get the UDP header after the pull to avoid a potential use-after-free."
