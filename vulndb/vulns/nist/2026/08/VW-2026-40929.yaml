title: A vulnerability was determined in MingSoft MCMS up to 3.0.6. This affects
  the function ModelDataImpl.queryDiyFormData of the file 
  /mdiy/form/data/list.do of the component ms-mdiy. Executing a manipulation of 
  the argument formFields can lead to sql injection. The attack may be performed
  from remote. The exploit has been publicly disclosed and may be utilized. The 
  vendor was contacted early about this disclosure but did not respond in any 
  way.
