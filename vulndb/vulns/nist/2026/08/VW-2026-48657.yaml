title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  fix huge_zero_pfn race\n\nPatch series \"mm/huge_memory: fix huge_zero_pfn race\"\
  , v2.\n\nThere is a subtle race in the reference-counted huge_zero_folio\nimplementation.\n\
  \nThe fast path atomic logic fails to account for the fact that the shrinker\n(which
  drops the final huge_zero_refcount pin) can overwrite huge_zero_pfn\nwith the ~0UL
  sentinel value in shrink_huge_zero_folio_scan() after a\nracing get_huge_zero_folio()
  installed a valid value there.\n\nThis results in huge_zero_folio being correctly
  set but huge_zero_pfn\nbeing set incorrectly and thus is_huge_zero_pfn() and consequently\n\
  is_huge_zero_pmd() will misidentify the huge zero folio as being an\nordinary THP
  folio.\n\nThis can result in the huge zero folio being split and otherwise treated\n\
  incorrectly.\n\nThe solution to this is very subtle as there is an atomic fast path,
  and\nthus ordering in weakly ordered architectures has to be treated very\ncarefully.\n\
  \nTh"
