title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Check the validity of nr_words in bpf_iter_bits_new()\n\nCheck the validity of nr_words
  in bpf_iter_bits_new(). Without this\ncheck, when multiplication overflow occurs
  for nr_bits (e.g., when\nnr_words = 0x0400-0001, nr_bits becomes 64), stack corruption
  may occur\ndue to bpf_probe_read_kernel_common(..., nr_bytes = 0x2000-0008).\n\n\
  Fix it by limiting the maximum value of nr_words to 511. The value is\nderived from
  the current implementation of BPF memory allocator. To\nensure compatibility if
  the BPF memory allocator's size limitation\nchanges in the future, use the helper
  bpf_mem_alloc_check_size() to\ncheck whether nr_bytes is too larger. And return
  -E2BIG instead of\n-ENOMEM for oversized nr_bytes."
