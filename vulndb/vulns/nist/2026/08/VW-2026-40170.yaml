title: A vulnerability has been found in MissionSquad mcp-api up to 1.11.8. The 
  impacted element is the function this.packageService.installPackage of the 
  file src/controllers/packages.ts of the component NPM Package Version Handler.
  The manipulation leads to command injection. It is possible to initiate the 
  attack remotely. Upgrading to version 1.11.9 is sufficient to resolve this 
  issue. The identifier of the patch is 
  a40f54d4533ba6618e1749383a245900eeb024c1. The affected component should be 
  upgraded.
