title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows high privileged attacker with logon to
  the infrastructure where Oracle Hyperion Financial Management executes to compromise
  Oracle Hyperion Financial Management.  Successful attacks of this vulnerability
  can result in  unauthorized update, insert or delete access to some of Oracle Hyperion
  Financial Management accessible data as well as  unauthorized read access to a subset
  of Oracle Hyperion Financial Management accessible data. CVSS 3.1 Base Score 3.0
  (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:H/UI:N/S:U/C:L/I:L/A:N).'
