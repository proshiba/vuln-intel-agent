title: "Improper input validation vulnerability in Apache Camel Atmosphere Websocket
  component.\n\n\n\nThis issue affects Apache Camel: from 4.0.0 before 4.14.9, from
  4.15.0 before 4.18.4, from 4.19.0 before 4.22.0.\n\n\n\nThe camel-atmosphere-websocket
  producer selects which connected WebSocket peers a message is delivered to through
  Exchange headers, and the string values of those headers sat outside the Camel namespace:
  websocket.connectionKey and websocket.connectionKey.list, along with websocket.sendToAll,
  websocket.eventType and websocket.errorType. WebsocketEndpoint extends ServletEndpoint
  and so inherits HttpHeaderFilterStrategy, which filters only the Camel and camel
  prefixes; the dotted names therefore fell outside the filtered namespace and were
  admitted in both directions by every HTTP-family consumer. In a route bridging an
  HTTP consumer into an atmosphere-websocket producer, an external sender could supply
  the list header and take over the producer's dispatch decision. WebsocketProducer."
