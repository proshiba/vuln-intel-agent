title: A security vulnerability has been detected in Open Asset Import Library 
  Assimp 17c12da. The impacted element is the function 
  Assimp::MDLImporter::GenerateOutputMeshes_3DGS_MDL7 of the file 
  code/AssetLib/MDL/MDLLoader.cpp of the component 3DGS MDL7 Model Output Mesh 
  Generator. The manipulation leads to buffer overflow. Remote exploitation of 
  the attack is possible. The exploit has been disclosed publicly and may be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
