title: "In the Linux kernel, the following vulnerability has been resolved:\n\nPCI:
  Check ROM header and data structure addr before accessing\n\nWe meet a crash when
  running stress-ng on x86_64 machine:\n\n  BUG: unable to handle page fault for address:
  ffa0000007f40000\n  RIP: 0010:pci_get_rom_size+0x52/0x220\n  Call Trace:\n  <TASK>\n\
  \    pci_map_rom+0x80/0x130\n    pci_read_rom+0x4b/0xe0\n    kernfs_file_read_iter+0x96/0x180\n\
  \    vfs_read+0x1b1/0x300\n\nOur analysis reveals that the ROM space's start address
  is\n0xffa0000007f30000, and size is 0x10000. Because of broken ROM space,\nbefore
  calling readl(pds), the pds's value is 0xffa0000007f3ffff, which is\nalready pointed
  to the ROM space end, invoking readl() would read 4 bytes\ntherefore cause an out-of-bounds
  access and trigger a crash.  Fix this by\nadding image header and data structure
  checking.\n\nWe also found another crash on arm64 machine:\n\n  Unable to handle
  kernel paging request at virtual address ffff8000dd1393ff\n  Mem abort info:\n \
  \ ESR = 0x000000009"
