title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  atm: ueagle-atm: wait for pre-firmware load in .disconnect()\n\nueagle-atm uses
  the asynchronous request_firmware_nowait() in .probe(),\nbut does not wait for its
  completion, not even in .disconnect(); so, if the\ndevice is unplugged meanwhile,
  its teardown runs concurrently with that.\n\nEven though this inconsistency is worth
  addressing on its own, it has also\ntriggered several bug reports in syzbot over
  the years (some auto-closed)\nwhere the firmware sysfs fallback mechanism (CONFIG_FW_LOADER_USER_HELPER)\n\
  creates a firmware subdirectory in the device directory during its removal,\nwhich
  might hit unexpected conditions in kernfs, apparently, depending at\nwhich point
  the add and remove operations raced. (See links.)\n\nThe pattern is:\n\nusb ?-?:
  Direct firmware load for ueagle-atm/eagle?.fw failed with error -2\nusb ?-?: Falling
  back to sysfs fallback for: ueagle-atm/eagle?.fw\n<ERROR>\nCall trace:\n ...\n kernfs_create_dir_ns"
