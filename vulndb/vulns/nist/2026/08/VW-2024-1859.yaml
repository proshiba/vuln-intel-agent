title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  tmc-etf: Fix global-out-of-bounds in tmc_update_etf_buffer()\n\ncommit 6f755e85c332
  (\"coresight: Add helper for inserting synchronization\npackets\") removed trailing
  '\\0' from barrier_pkt array and updated the\ncall sites like etb_update_buffer()
  to have proper checks for barrier_pkt\nsize before read but missed updating tmc_update_etf_buffer()
  which still\nreads barrier_pkt past the array size resulting in KASAN out-of-bounds\n\
  bug. Fix this by adding a check for barrier_pkt size before accessing\nlike it is
  done in etb_update_buffer().\n\n BUG: KASAN: global-out-of-bounds in tmc_update_etf_buffer+0x4b8/0x698\n\
  \ Read of size 4 at addr ffffffd05b7d1030 by task perf/2629\n\n Call trace:\n  dump_backtrace+0x0/0x27c\n\
  \  show_stack+0x20/0x2c\n  dump_stack+0x11c/0x188\n  print_address_description+0x3c/0x4a4\n\
