title: "Statamic CMS's user-augmentation resolver, AugmentedUser::get() in src/Auth/AugmentedUser.php,
  contains an explicit case for the `two_factor_recovery_codes` handle that returns
  the user's raw two-factor recovery codes with no access restriction: `if ($handle
  === 'two_factor_recovery_codes') { return new Value($this->data->get('two_factor_recovery_codes'),
  ...); }`. Unlike sensitive fields such as password/password_hash, which are excluded
  from AugmentedUser entirely, two_factor_recovery_codes is neither excluded from
  augmentation nor present in Statamic's Antlers variable guard lists (guardedVariablePatterns/guardedContentVariablePatterns
