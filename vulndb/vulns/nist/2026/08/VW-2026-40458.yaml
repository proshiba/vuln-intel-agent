title: OpenReception's appointment booking software provides an end-to-end 
  encrypted appointment booking platform. Versions prior to 1.0.2 don't throttle
  failed passphrase login attempts. An attacker can submit unlimited wrong 
  passphrase guesses against any known email address, capped only by the Argon2 
  verification cost (about 100 milliseconds per attempt on the tested host, 
  giving 10 attempts per second sustained). The same backend implements a 
  working per-account throttle on the WebAuthn challenge endpoint, which returns
  HTTP 429 after roughly 19 attempts. The passphrase branch simply does not 
  invoke that throttle, leaving a supported high-value login path unprotected 
  against credential stuffing and dictionary attacks. The asymmetry confirms 
  this is an oversight rather than a design choice. The throttle infrastructure 
  exists, is wired into the same auth backend, and works on the WebAuthn path. 
