title: "The SF32LB MPI QSPI NOR flash driver (drivers/flash/flash_sf32lb_mpi_qspi_nor.c)
  validated the flash offset and length on its read and write paths with the test
  (offset + size) > data->size. Because offset is a signed off_t while size is unsigned,
  a negative offset is converted to a large unsigned value and the addition can wrap
  to a small result that passes the check. The read path then performs memcpy(dst,
  (void *)(data->base + offset), size) and the write path programs flash at offset
  and cache-invalidates data->base + offset, in both cases accessing memory outside
  the mapped flash window. The driver's erase path already rejected negative offsets,
  but read and write did not.\n\nIn builds with CONFIG_USERSPACE, flash_read and flash_write
  are syscalls whose verifiers validate the device object and the caller's buffer
  but deliberately delegate offset bounds checking to the driver. An unprivileged
  thread that has been granted access to this flash device can therefore call the
  syscall with"
