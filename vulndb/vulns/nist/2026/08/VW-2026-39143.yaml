title: Authorization handling for Parameter Context validation requests in 
  Apache NiFi 1.10.0 through 2.10.0 allows clients with read access to submit 
  proposed Parameter values. The proposed values override current configuration,
  enabling users with read access to invoke predefined component validation 
  methods with alternative settings. Apache NiFi installations that do not 
  implement different levels of authorization for viewing and modifying 
  Parameter Context configuration are not subject to this vulnerability. 
  Upgrading to Apache NiFi 2.11.0 is the recommended mitigation, requiring write
  access to submit Parameter Context validation requests.
