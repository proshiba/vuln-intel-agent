title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  Fix corrupted packets for XDP_SHARED_UMEM\n\nFix an issue in XDP_SHARED_UMEM mode
  together with aligned mode where\npackets are corrupted for the second and any further
  sockets bound to\nthe same umem. In other words, this does not affect the first
  socket\nbound to the umem. The culprit for this bug is that the initialization\n\
  of the DMA addresses for the pre-populated xsk buffer pool entries was\nnot performed
  for any socket but the first one bound to the umem. Only\nthe linear array of DMA
  addresses was populated. Fix this by populating\nthe DMA addresses in the xsk buffer
  pool for every socket bound to the\nsame umem."
