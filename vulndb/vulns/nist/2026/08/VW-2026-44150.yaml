title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinder:
  cache secctx size before release zeroes it\n\nbinder_transaction() bounds the scatter-gather
  buffer area with\nsg_buf_end_offset and subtracts the aligned LSM context size because\n\
  the secctx is written at the tail of that area.  The subtraction reads\nlsmctx.len,
  but that field has already been cleared by the time the\nline runs:\n\n    security_secid_to_secctx(secid,
  &lsmctx)   /* lsmctx.len set */\n    lsmctx_aligned_size = ALIGN(lsmctx.len, sizeof(u64))\n\
  \    extra_buffers_size += lsmctx_aligned_size\n    ...\n    security_release_secctx(&lsmctx)\
  \            /* memset zeroes len */\n    ...\n    sg_buf_end_offset = sg_buf_offset
  + extra_buffers_size\n                        - ALIGN(lsmctx.len, sizeof(u64)) /*
  ALIGN(0,8) */\n\nsecurity_release_secctx() does memset(cp, 0, sizeof(*cp)), so lsmctx.len\n\
  reads back as 0 and the subtraction contributes nothing, leaving\nsg_buf_end_offset
  too large by the aligned secctx size on every\n"
