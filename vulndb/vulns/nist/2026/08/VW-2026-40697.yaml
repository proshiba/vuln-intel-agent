title: Nexus Repository 3 did not sufficiently restrict which HikariCP 
  connection-pool properties could be set through the DataStore configuration 
  API. A user holding the nx-datastores-update permission could set the 
  connectionInitSql property to execute arbitrary SQL against the configured 
  database on every new connection. On the default H2 database backend, this 
  could be leveraged to achieve remote code execution as the Nexus process user.
