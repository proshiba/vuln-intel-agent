title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/imagination:
  Fix user array stride in pvr_set_uobj_array()\n\npvr_set_uobj_array() copies an
  array of kernel objects to a userspace\narray whose element size is described by
  out->stride. When out->stride\nis different from the kernel object size, the slow
  path advances the\nuserspace pointer by the kernel object size and the kernel pointer
  by the\nuserspace stride.\n\nThis reverses the intended layout. For larger userspace
  strides, later\ncopies read from the wrong kernel addresses. For smaller userspace\n\
  strides, later copies are written at the wrong userspace offsets. The\npadding clear
  is also done only for the first element instead of the\npadding area for each element.\n\
  \nAdvance the userspace pointer by out->stride and the kernel pointer by\nobj_size,
  and clear per-element padding while the current userspace\npointer is still available."
