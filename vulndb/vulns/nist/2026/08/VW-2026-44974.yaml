title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: clear iso_data always when detaching conn from hcon\n\nWhen setting conn->hcon
  = NULL, also conn->hcon->iso_data = NULL is\nnecessary, otherwise later iso_conn_free()
  will UAF.\n\nFix clearing of iso_data in iso_sock_disconn()\n\nFixes KASAN: slab-use-after-free
  in iso_conn_hold_unless_zero on\niso_sock_release() followed by hci_abort_conn_sync()."
