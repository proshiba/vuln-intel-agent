title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix memory leak in ath12k_wifi7_dp_rx_h_verify_tkip_mic()\n\nIn ath12k_wifi7_dp_rx_h_verify_tkip_mic(),
  the call to\nath12k_dp_rx_check_nwifi_hdr_len_valid() may return false when the\n\
  NWIFI header length is invalid, causing the function to abort early with\n-EINVAL.\n\
  \nWhen this happens, the error propagates to\nath12k_wifi7_dp_rx_h_defrag(), which
  clears first_frag by setting it\nto NULL. As a result, the corresponding MSDU is
  no longer referenced\nby the defragmentation path and is never freed.\n\nThis leads
  to a memory leak for the affected MSDU on this error path.\nProper cleanup is required
  to ensure the MSDU is released when header\nvalidation fails during TKIP MIC verification.\n\
  \nTested-on: WCN7850 hw2.0 PCI WLAN.HMT.1.1.c5-00302-QCAHMTSWPL_V1.0_V2.0_SILICONZ-1.115823.3"
