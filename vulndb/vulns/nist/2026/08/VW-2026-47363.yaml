title: "Multiple Cisco products are affected by vulnerabilities in the Snort 3 VBA
  feature that could allow an unauthenticated, remote attacker to cause the Snort
  3 Detection Engine to crash.\r\n\r\nThese vulnerabilities are due to improper error
  checking when decompressing VBA data. An attacker could exploit these vulnerabilities
  by sending crafted VBA data to the Snort 3 Detection Engine on the targeted device.
  A successful exploit could allow the attacker to cause the Snort 3 Detection Engine
  to unexpectedly restart, causing a DoS condition."
