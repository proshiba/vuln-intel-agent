title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpaa2-eth:
  put MAC endpoint device on disconnect\n\nfsl_mc_get_endpoint() returns the MAC endpoint
  device with a reference\ntaken through device_find_child(). The Ethernet connect
  path stores that\ndevice in mac->mc_dev and keeps it for the lifetime of the connected
  MAC\nobject.\n\nHowever, the disconnect path only disconnects and closes the MAC
  before\nfreeing the dpaa2_mac object. It does not drop the endpoint device\nreference
  stored in mac->mc_dev, so every successful connect leaks that\ndevice reference
  when the MAC is later disconnected.\n\nDrop the endpoint device reference after
  closing the MAC and before\nfreeing the dpaa2_mac object."
