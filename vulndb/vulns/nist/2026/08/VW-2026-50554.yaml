title: A Broken Access Control vulnerability exists in ThingsBoard Professional 
  Edition (PE) 4.21 and below, within the Alarms comments functionality. An 
  authenticated customer user can manipulate the respective API request 
  parameters to create or modify system-generated alarm comments. This allows 
  unauthorized impersonation of system messages and modification of trusted 
  system-owned data, resulting in vertical privilege escalation and potential 
  integrity violations.
