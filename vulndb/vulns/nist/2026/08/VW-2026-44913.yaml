title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: stop fast-leave after deleting a port group\n\nbr_multicast_leave_group()
  iterates mp->ports with pp = &p->next in\nits fast-leave path. After br_multicast_del_pg()
  removes p,\ncontinuing the loop advances pp through the deleted entry.\n\nIf multicast-to-unicast
  was enabled, the bridge can hold multiple port\ngroups for the same port and group
  with different source MAC\naddresses. Once multicast-to-unicast is disabled,\nbr_port_group_equal()
  matches those entries by port only. A fast leave\ncan then delete one entry and
  continue from its stale next pointer,\nleaving mp->ports pointing at a deleted port
  group.\n\nFast leave only needs to remove one matching port group. Break after\n\
  br_multicast_del_pg() so the loop stops before dereferencing the\nremoved entry."
