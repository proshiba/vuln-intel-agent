title: OpenEXR is the reference implementation and specification for the EXR 
  image file format, widely used in the motion picture industry. In versions 
  3.3.0 through 3.3.12 and 3.4.0 through 3.4.13, the PyOpenEXR Python bindings 
  contain a heap out-of-bounds write triggered when reading a crafted deep 
  scanline EXR file. When a deep file declares a literal channel named left 
  alongside layer-prefixed RGB channels left.R, left.G, and left.B, the wrapper 
  processes the literal left channel first and allocates a scalar deep sample 
  array for it, then reuses that same array as the coalesced destination for the
  prefixed RGB group. The deep reader registers sample slices with an RGB stride
  (three lanes) into storage that was allocated with scalar shape, so decoding 
  the deep samples writes past the allocation. Opening such a file through the 
  default public Python API, OpenEXR.File(path), causes a heap buffer overflow 
  during normal deep sample decode, leading to memory corruption and a crash. 
