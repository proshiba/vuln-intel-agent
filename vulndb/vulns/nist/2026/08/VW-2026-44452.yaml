title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Nullify irqfd->producer if updating IRTE for bypass fails\n\nNullify irqfd->producer
  if updating the IRTE for bypass fails, as leaving a\ndangling pointer will result
  in a use-after-free if the irqfd is reachable\nthrough KVM's routing, but the producer
  is freed separately.  E.g. for VFIO\nPCI, the producer is embedded in struct \"\
  vfio_pci_irq_ctx\" and freed when\nthe vector is disabled, which can happen independent
  of routing updates.\n\n[sean: drop PPC change, massage changelog]"
