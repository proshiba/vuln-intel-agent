title: Nagios Core before 4.5.14 and Nagios XI before 2026R1.7 are vulnerable to
  authenticated remote code execution via unfiltered NOTIFICATION-family macro 
  substitution through the com_data parameter. When a notification command 
  references $NOTIFICATIONCOMMENT$ or $NOTIFICATIONAUTHOR$ in a shell-reachable 
  position, authenticated UI users can run arbitrary commands as the nagios 
  user. Exploitation requires a non-default configuration in which a 
  notification command references these macros in a shell-executed command line.
