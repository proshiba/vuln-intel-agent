title: PLANET GS-4210-16P2S V3 firmware before 3.441b260626 contains an 
  authenticated OS command injection vulnerability in /cgi-bin/dispatcher.cgi. 
  The web_smtp_test_post handler incorporates a caller-supplied SMTP server 
  value directly into a shell command without sanitization. A remote attacker 
  with administrator web credentials can send a crafted SMTP server value to 
  execute arbitrary operating-system commands on the device.
