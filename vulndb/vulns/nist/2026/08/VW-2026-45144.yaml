title: Scriban before 7.0.0 (affected versions <= 6.6.0) contains a 
  denial-of-service vulnerability in which the LimitToString safety limit 
  (default 1MB) can be bypassed because ObjectToString resets the per-call 
  length counter (_currentToStringLength) on every top-level call and 
  StringBuilderOutput enforces no cumulative output-size limit. An attacker who 
  can supply a template can render a near-limit string repeatedly in a loop, 
  allocating approximately 1GB of memory and causing an out-of-memory condition 
  that crashes the host application.
