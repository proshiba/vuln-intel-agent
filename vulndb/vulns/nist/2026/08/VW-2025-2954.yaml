title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  conntrack: dccp: copy entire header to stack buffer, not just basic one\n\nEric
  Dumazet says:\n  nf_conntrack_dccp_packet() has an unique:\n\n  dh = skb_header_pointer(skb,
  dataoff, sizeof(_dh), &_dh);\n\n  And nothing more is 'pulled' from the packet,
  depending on the content.\n  dh->dccph_doff, and/or dh->dccph_x ...)\n  So dccp_ack_seq()
  is happily reading stuff past the _dh buffer.\n\nBUG: KASAN: stack-out-of-bounds
  in nf_conntrack_dccp_packet+0x1134/0x11c0\nRead of size 4 at addr ffff000128f66e0c
  by task syz-executor.2/29371\n[..]\n\nFix this by increasing the stack buffer to
  also include room for\nthe extra sequence numbers and all the known dccp packet
  type headers,\nthen pull again after the initial validation of the basic header.\n\
  \nWhile at it, mark packets invalid that lack 48bit sequence bit but\nwhere RFC
  says the type MUST use them.\n\nCompile tested only.\n\nv2: first skb_header_pointer()
  now needs to adjust the siz"
