title: A vulnerability has been found in Shandong Hoteam PDM Product Data 
  Management System up to 8.3.10. The impacted element is the function 
  GetStoredClassByFilter of the file /Base/BaseService.asmx/DataService. The 
  manipulation of the argument FilterString leads to sql injection. Remote 
  exploitation of the attack is possible. The exploit has been disclosed to the 
  public and may be used. The vendor was contacted early about this disclosure 
  but did not respond in any way.
