title: "Incorrect Authorization vulnerability in ash-project ash_sql allows a caller
  to receive an aggregate value computed over rows a more restrictive filter should
  have excluded, disclosing counts, sums, or lists across an authorization or tenancy
  boundary.\n\nAshSql.Aggregate.different_queries?/2 reports two aggregate queries
  as different only when their filter and their sort both differ. Aggregate queries
  rarely carry a sort, so two aggregates that share a name but carry entirely different
  filters compare as identical. The colliding aggregate keeps its name and is treated
  as already computed, and select_aggregates returns the first-registered variant's
  value. The same name reaches the builder twice with different filters when actor
  or tenant context is stamped into each aggregate's query, so a narrowly filtered
  aggregate can be served the value of a previously registered broad one.\n\nThis
  issue affects ash_sql: from 0.1.0 before 0.7.1."
