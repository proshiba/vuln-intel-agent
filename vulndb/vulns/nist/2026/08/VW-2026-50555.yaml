title: stomper 5e2741e is vulnerable to Denial of Service. A malicious client 
  can send partial STOMP frames and keep the TCP connections open, which, 
  combined with the broker s use of edge-triggered epoll (EPOLLET) and MSG_PEEK 
  in recv(), causes sockets to enter a permanent half-read state. When enough 
  such connections accumulate, the broker stops receiving any further epoll 
  events for those sockets and eventually hangs in epoll_wait, effectively 
  refusing to process new messages.
