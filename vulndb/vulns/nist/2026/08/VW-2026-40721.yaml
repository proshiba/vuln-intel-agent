title: In sol commit 373d848 (2024-12-12), the broker does not fully release 
  resources when handling malformed or duplicate CONNECT packets. When clients 
  send invalid CONNECT packets - either due to repeated attempts or failed 
  authentication - the server may silently drop the connection or send a CONNACK
  but fail to close the session or deallocate internal resources. This behavior 
  allows an attacker to create numerous half-open connections that consume 
  memory and file descriptors indefinitely, potentially triggering the Linux OOM
  killer and causing a denial of service.
