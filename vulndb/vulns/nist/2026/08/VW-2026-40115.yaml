  (device sdc): allowing degraded mounts\n  BTRFS info (device sdc): turning on async
  discard\n  BTRFS info (device sdc): enabling free space tree\n  Unable to handle
  kernel NULL pointer dereference at virtual address 0000000000000018\n  user pgtable:
