  btrfs/242 can randomly fail with the\nfollowing NULL pointer dereference:\n\n  run
  fstests btrfs/242 at 2026-06-01 10:25:08\n  BTRFS: device fsid d4d7f234-487c-4787-88e4-47a8b68c9874
