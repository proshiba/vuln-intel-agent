title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  do not trim a device which is not writeable\n\n[BUG]\nThere is a bug report that
  btrfs/242 can randomly fail with the\nfollowing NULL pointer dereference:\n\n  run
  fstests btrfs/242 at 2026-06-01 10:25:08\n  BTRFS: device fsid d4d7f234-487c-4787-88e4-47a8b68c9874
  devid 1 transid 9 /dev/sdc (8:32) scanned by mount (122609)\n  BTRFS info (device
  sdc): first mount of filesystem d4d7f234-487c-4787-88e4-47a8b68c9874\n  BTRFS info
  (device sdc): using crc32c checksum algorithm\n  BTRFS warning (device sdc): devid
  2 uuid fbe72d72-3272-482d-80fb-ab88ed398192 is missing\n  BTRFS warning (device
  sdc): devid 2 uuid fbe72d72-3272-482d-80fb-ab88ed398192 is missing\n  BTRFS info
  (device sdc): allowing degraded mounts\n  BTRFS info (device sdc): turning on async
  discard\n  BTRFS info (device sdc): enabling free space tree\n  Unable to handle
  kernel NULL pointer dereference at virtual address 0000000000000018\n  user pgtable:
  4k pages, 48-bit "
