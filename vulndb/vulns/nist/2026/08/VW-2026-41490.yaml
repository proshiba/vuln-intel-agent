title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Prevent rereg_mr for non-mem regions\n\nWhen a QP/CQ/SRQ is created, a two step
  process is used\nwhere the buffer is allocated in userspace and explicitly\nregistered
  with the normal reg_mr mechanism prior to creating\nthe actual QP/CQ/SRQ object.\n\
  \nThese special registrations are indicated via an ABI field\nso the driver knows
  that they do not have a valid mkey and\nto skip the actual CQP command submission.\n\
  \nSince these are real MR objects from the core's perspective,\nit is possible for
  a user application to invoke rereg_mr on them\nand cause a real CQP op to be emitted
  with the zero-initialized\nmkey value of 0.\n\nFix this by preventing rereg_mr on
  these special regions."
