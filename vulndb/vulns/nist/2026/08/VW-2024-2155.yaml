title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudp:
  Set SOCK_RCU_FREE earlier in udp_lib_get_port().\n\nsyzkaller triggered the warning
  [0] in udp_v4_early_demux().\n\nIn udp_v[46]_early_demux() and sk_lookup(), we do
  not touch the refcount\nof the looked-up sk and use sock_pfree() as skb->destructor,
  so we check\nSOCK_RCU_FREE to ensure that the sk is safe to access during the RCU
  grace\nperiod.\n\nCurrently, SOCK_RCU_FREE is flagged for a bound socket after being
  put\ninto the hash table.  Moreover, the SOCK_RCU_FREE check is done too early\n\
  in udp_v[46]_early_demux() and sk_lookup(), so there could be a small race\nwindow:\n\
  \n  CPU1                                 CPU2\n  ----                          \
  \       ----\n  udp_v4_early_demux()                 udp_lib_get_port()\n  |   \
  \                                 |- hlist_add_head_rcu()\n  |- sk = __udp4_lib_demux_lookup()\
  \    |\n  |- DEBUG_NET_WARN_ON_ONCE(sk_is_refcounted(sk));\n                   \
  \                    `- sock_set_fla"
