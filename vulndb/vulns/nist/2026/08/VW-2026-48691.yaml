title: "In the Linux kernel, the following vulnerability has been resolved:\n\npacket:
  synchronize pressure clearing with ring reconfiguration\n\npacket_set_ring() updates
  the RX ring state under sk_receive_queue.lock,\nbut used to publish the tpacket
  receive mode through po->prot_hook.func\nafter releasing that lock. packet_poll()
  and packet_recvmsg() can then\nrun the pressure clearing path after the ring has
  been cleared while\nstill seeing tpacket_rcv, causing __packet_rcv_has_room() to
  dereference\nstale or NULL ring storage.\n\nMove the existing receive hook assignment
  into the same\nsk_receive_queue.lock section as the ring state update. Keep the\n\
  assignment otherwise unchanged, including on TX ring reconfiguration, to\navoid
  adding behavior changes that are not required for the fix.\n\nSerialize packet_recvmsg()
  pressure clearing with the same queue lock\nonly after PACKET_SOCK_PRESSURE has
  been observed. If the flag is clear\nand the socket has moved away from tpacket_rcv,
  packet_set_ring() has\nalready"
