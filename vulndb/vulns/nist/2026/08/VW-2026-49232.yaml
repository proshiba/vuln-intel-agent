title: Adminer 4.6.0 through 5.5.0 (fixed in 5.5.1) contains an incomplete fix 
  for a prior X-Forwarded-Prefix vulnerability (GHSA-8478-xrj3-h9c2). The 
  validation guard (bootstrap.inc.php) only rejects prefixes matching ^/[^/], 
  blocking //evil.com but allowing values such as /\evil.com whose second 
  character is a backslash. Because browsers normalize backslash to forward 
  slash, a network-path reference survives into REQUEST_URI and reaches 
  cookie_path(), affecting the Set-Cookie Path attribute. Exploitation requires 
  that clients can set the X-Forwarded-Prefix header (a misconfigured or absent 
  reverse proxy). Impact is limited to anomalous cookie-path scoping.
