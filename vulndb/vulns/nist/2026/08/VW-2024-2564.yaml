title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsecretmem:
  disable memfd_secret() if arch cannot set direct map\n\nReturn -ENOSYS from memfd_secret()
  syscall if !can_set_direct_map().  This\nis the case for example on some arm64 configurations,
  where marking 4k\nPTEs in the direct map not present can only be done if the direct
  map is\nset up at 4k granularity in the first place (as ARM's break-before-make\n\
  semantics do not easily allow breaking apart large/gigantic pages).\n\nMore precisely,
  on arm64 systems with !can_set_direct_map(),\nset_direct_map_invalid_noflush() is
  a no-op, however it returns success\n(0) instead of an error.  This means that memfd_secret
  will seemingly\n\"work\" (e.g.  syscall succeeds, you can mmap the fd and fault
  in pages),\nbut it does not actually achieve its goal of removing its memory from
  the\ndirect map.\n\nNote that with this patch, memfd_secret() will start erroring
  on systems\nwhere can_set_direct_map() returns false (arm64 with\nCONFIG_RODATA_FUL"
