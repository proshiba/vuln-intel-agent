title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  sdhci-esdhc-imx: disable irq during suspend to fix unhandled interrupt\n\nWhen using
  WIFI out-of-band wakeup, an \"irq xxx: nobody cared\" warning\noccurs. This happens
  because the usdhc interrupt is not disabled during\nsystem suspend when device_may_wakeup()
  returns false.\n\nThe sequence of events leading to this issue:\n1. System enters
  suspend without disabling usdhc interrupt\n(because device_may_wakeup() returns
  false for usdhc device)\n2. WIFI out-of-band wakeup triggers system resume via GPIO
  interrupt\n3. WIFI sends a Card interrupt before usdhc has fully resumed\n4. usdhc
  is still in runtime suspend state and cannot handle the\ninterrupt properly\n5.
  The unhandled interrupt triggers \"nobody cared\" warning\n\nFix this by unconditionally
  disabling the usdhc interrupt during suspend\nand re-enabling it during resume,
  regardless of the wakeup capability.\nThis ensures no interrupts are processed during
  the suspend/resume\ntra"
