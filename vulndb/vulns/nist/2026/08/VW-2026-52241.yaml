title: A vulnerability has been found in armink struct2json 1.0. This affects 
  the function S2J_STRUCT_GET_string_ELEMENT in the library 
  struct2json/inc/s2jdef.h of the component JSON Deserialization. The 
  manipulation of the argument valuestring leads to null pointer dereference. 
  The attack may be initiated remotely. The exploit has been disclosed to the 
  public and may be used. The vendor was contacted early about this disclosure 
  but did not respond in any way.
