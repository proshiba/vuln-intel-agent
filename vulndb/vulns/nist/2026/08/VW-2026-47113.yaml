title: "nnn does not sanitize the path variable. An attacker can create a directory
  on a shared filesystem, removable media, or inside an extracted archive whose name
  contains a single quote followed by shell syntax. If the victim enters that directory
  in nnn and uses the batch copy or move workflow, the crafted directory name is embedded
  into the generated shell command and the injected payload executes with the privileges
  of the nnn process.\n\n\nMaintainer of this project was notified about this vulnerability.
  It might has been addressed, but the maintainer did not provide a vulnerable version
  range. Only version 5.2 was tested and confirmed as vulnerable."
