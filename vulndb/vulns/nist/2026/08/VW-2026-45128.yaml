title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  algif_skcipher - force synchronous processing on trees without ctx->state\n\nThe
  AIO/async path in skcipher_recvmsg() passes the socket-wide ctx->iv\ndirectly into
  the skcipher request. After io_submit() the socket lock is\ndropped and the request
  is processed asynchronously, so a concurrent\nsendmsg(ALG_SET_IV) can overwrite
  ctx->iv and make the in-flight request\nrun under an attacker-controlled IV. For
  CTR/stream modes this is\nIV/keystream reuse and lets an unprivileged user recover
  the plaintext of\na concurrent operation.\n\nSnapshotting ctx->iv into per-request
  storage for the async path is not\nsufficient. For ciphers with statesize == 0 -
