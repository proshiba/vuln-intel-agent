title: A flaw was found in multicloud-integrations, a component of Red Hat 
  Advanced Cluster Management (RHACM). This vulnerability allows an 
  authenticated user, referred to as a tenant, to manipulate the GitOpsCluster 
  controller. By exploiting this, a tenant can redirect sensitive spoke cluster 
  bearer tokens from secure locations to a namespace they control. This 
  unauthorized access to tokens can lead to the disclosure of critical 
  information and bypass security policies within ArgoCD AppProjects.
