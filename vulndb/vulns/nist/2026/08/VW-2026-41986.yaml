title: The Windows installer deployed Npcap leaving its access restriction 
  option at the insecure default value, so the driver was accessible to every 
  local user of the host instead of being restricted to administrators only. A 
  local user without administrative privileges could use the Npcap driver to 
  capture the traffic reaching the host, which discloses information belonging 
  both to the host and to other systems on the same network segment, and to send
  arbitrary raw packets on that segment.
