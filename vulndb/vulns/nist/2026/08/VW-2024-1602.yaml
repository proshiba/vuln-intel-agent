title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Change acpi_core_pic[NR_CPUS] to acpi_core_pic[MAX_CORE_PIC]\n\nWith default config,
  the value of NR_CPUS is 64. When HW platform has\nmore then 64 cpus, system will
  crash on these platforms. MAX_CORE_PIC\nis the maximum cpu number in MADT table
  (max physical number) which can\nexceed the supported maximum cpu number (NR_CPUS,
  max logical number),\nbut kernel should not crash. Kernel should boot cpus with
  NR_CPUS, let\nthe remainder cpus stay in BIOS.\n\nThe potential crash reason is
  that the array acpi_core_pic[NR_CPUS] can\nbe overflowed when parsing MADT table,
  and it is obvious that CORE_PIC\nshould be corresponding to physical core rather
  than logical core, so it\nis better to define the array as acpi_core_pic[MAX_CORE_PIC].\n\
  \nWith the patch, system can boot up 64 vcpus with qemu parameter -smp 128,\notherwise
  system will crash with the following message.\n\n[    0.000000] CPU 0 Unable to
  handle kernel paging request "
