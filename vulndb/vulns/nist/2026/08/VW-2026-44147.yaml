title: "In the Linux kernel, the following vulnerability has been resolved:\n\nliveupdate:
  validate session type before performing operation\n\nThe sessions ioctls are not
  applicable to all session types. PRESERVE_FD\nis only applicable to outgoing sessions.
  RETRIEVE_FD and FINISH are only\nvalid for incoming session. Calling a incoming
  ioctl on an outgoing\nsession is invalid and can cause file handlers to run into
  unexpected\nerrors.\n\nFor example, a user can create a (outgoing) session, preserve
  a memfd,\nand then immediately do a retrieve without doing a kexec in between.\n\
  This would result in memfd's retrieve handler to run. The handlers\nexpects to be
  called from a post-kexec context, and will try to do a\nkho_restore_vmalloc() or
  kho_restore_folio() to try and restore memory.\n\nKHO catches this (thanks to KHO_PAGE_MAGIC)
  and returns an error, but\nsince this is considered an internal error and KHO throws
  out a bunch of\nWARN()s.\n\nAssociate a type with each ioctl op and validate the
  type in\nluo_session_"
