title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  avoid data corruption caused by decline\n\nWe found a data corruption issue during
  testing of SMC-R on Redis\napplications.\n\nThe benchmark has a low probability
  of reporting a strange error as\nshown below.\n\n\"Error: Protocol error, got \"\
  \\xe2\" as reply type byte\"\n\nFinally, we found that the retrieved error data
  was as follows:\n\n0xE2 0xD4 0xC3 0xD9 0x04 0x00 0x2C 0x20 0xA6 0x56 0x00 0x16 0x3E
  0x0C\n0xCB 0x04 0x02 0x01 0x00 0x00 0x20 0x00 0x00 0x00 0x00 0x00 0x00 0x00\n0x00
  0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0xE2\n\nIt is quite obvious that this
  is a SMC DECLINE message, which means that\nthe applications received SMC protocol
  message.\nWe found that this was caused by the following situations:\n\nclient \
  \                 server\n        ¦  clc proposal\n        ------------->\n    \
  \    ¦  clc accept\n        <-------------\n        ¦  clc confirm\n        ------------->\n\
  wait llc confirm\n\t\t\tsend llc confirm\n        ¦faile"
