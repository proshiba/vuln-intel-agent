title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: oss: Serialize readq reset state with q->lock\n\nsnd_seq_oss_readq_clear()
  resets qlen, head, and tail without\nq->lock even though the normal reader and producer
  paths serialize the\nsame ring state under that spinlock. A reset can therefore
  race\nsnd_seq_oss_readq_free() or snd_seq_oss_readq_put_event() and leave\nstale
  records in the queue, drop freshly queued ones, or report the\nwrong readiness after
  wakeup. KCSAN reports a data race between\nsnd_seq_oss_readq_clear() and snd_seq_oss_readq_free().\n\
  \nTake q->lock while clearing the ring and resetting input_time. Factor\nthe enqueue
  logic into a caller-locked helper so\nsnd_seq_oss_readq_put_timestamp() updates
  its suppression state under\nthe same lock instead of racing the reset path.\n\n\
  The buggy scenario involves two paths, with each column showing the\norder within
  that path:\n\nreset path:                      locked readq updater:\n1. snd_seq_oss_reset()
  or        "
