title: rsync before 3.5.0 contains a time-of-check to time-of-use (TOCTOU) race 
  condition vulnerability in the non-daemon receiver's destination directory 
  handling that allows an attacker who can manipulate destination path parent 
  components to redirect file writes to unintended locations. Attackers can 
  substitute a symlink for a component of the destination path between the path 
  resolution and chdir() call, causing the receiver's working directory to be 
  established outside the intended destination tree so that subsequent 
  relative-path file writes land in unintended filesystem locations.
