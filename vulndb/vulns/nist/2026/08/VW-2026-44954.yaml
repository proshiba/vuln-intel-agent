title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  use memcmp() to compare ClientGUIDs\n\nClientGUID is a fixed-size binary value and
  can contain embedded NUL\nbytes. strncmp() stops comparing at the first NUL byte,
  so different\nClientGUID values can incorrectly be treated as equal.\n\nUse memcmp()
  in SMB3 multichannel session binding and\nFSCTL_VALIDATE_NEGOTIATE_INFO to compare
  all SMB2_CLIENT_GUID_SIZE\nbytes."
