title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  nat_keepalive: avoid double free on send error\n\nnat_keepalive_send() frees the
  keepalive skb whenever the IPv4 or IPv6\nsend helper reports an error.\n\nThat cleanup
  is only correct before the skb is handed to the output\npath. Once ip_build_and_send_pkt()
  or ip6_xmit() takes ownership, the\nnetworking stack may already have consumed the
  skb before returning an\nerror, so freeing it again is unsafe.\n\nHandle the pre-handoff
  failure cases inside nat_keepalive_send_ipv4()\nand nat_keepalive_send_ipv6(), where
  the caller still owns the skb, and\nkeep nat_keepalive_send() responsible only for
  family dispatch and the\nunsupported-family cleanup path."
