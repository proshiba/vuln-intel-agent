title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/iommufd:
  Fix IOPF group ownership UAF\n\niopf_group_alloc() links each last-page IOPF group
  into the generic IOPF\npending list before invoking the domain fault handler.\n\
  iommufd_fault_iopf_handler() also queued an accepted group in the\nIOMMUFD deliver
  list without removing it from the generic pending list.\n\nWhen detach or HWPT replacement
  drops the device's IOPF reference count\nto zero, an IOMMU driver may call iopf_queue_remove_device().
  That\nfunction responds to and frees groups through the generic pending list\nwithout
  removing the same groups from IOMMUFD's deliver list or response\nxarray. A later
  read, response, or cleanup can then access the freed\ngroup and cause a UAF.\n\n\
  Fix this by dequeuing an accepted group from the generic pending list\nbefore IOMMUFD
  queues it for userspace response.\nMake iopf_group_response() send a response regardless
  of pending-list\nmembership, so the dequeued group can still be complet"
