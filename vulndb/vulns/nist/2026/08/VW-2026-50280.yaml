title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  fix OOB read in decode_watchers() via missing bounds check\n\nceph_start_decoding()
  validates that struct_len bytes remain in the\nbuffer after the encoding header,
  but accepts struct_len=0 as valid:\nceph_decode_need(p, end, 0, bad) always passes.
  When a malicious or\ncompromised OSD sends an obj_list_watch_response_t reply with\n\
  struct_len=0, ceph_start_decoding() returns success with p == end,\nleaving zero
  bytes guaranteed for subsequent reads.\n\nThe immediately following ceph_decode_32(p)
  in decode_watchers() has\nno preceding bounds check. With p == end this is a 4-byte
  read past\nthe validated buffer boundary. The garbage value is then passed\ndirectly
  to kzalloc_objs() as the watcher count.\n\nThe sibling function decode_watcher()
