title: A flaw was found in iperf3. A remote unauthenticated attacker can exploit
  a vulnerability in the `JSON_read()` function, which accepts a peer-controlled
  message length and allocates memory without an upper bound. This allows the 
  attacker to trigger excessive memory consumption, leading to a Denial of 
  Service (DoS) through memory exhaustion, severe slowdown, or termination of 
  the iperf3 service.
