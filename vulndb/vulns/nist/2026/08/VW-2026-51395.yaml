title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/test:
  Fix __fortify_panic\n\nFix a runtime assertion in setup_xor_mapping(). Fortify complains
  that it\nis potentially overflowing the xormaps array per __counted_by(nr_maps).\n\
  Quiet the false positive by initializing @nr_maps earlier.\n\n memcpy: detected
  buffer overflow: 32 byte write of buffer size 0\n WARNING: lib/string_helpers.c:1036
  at __fortify_report+0x4d/0xa0, CPU#8: modprobe/2728\n Call Trace:\n  __fortify_panic+0xd/0xf\n\
  \  setup_xor_mapping+0x6c/0xa0 [cxl_translate]\n\n[ dj: Fixed up @nr_entries to
  @nr_maps in commit log. ]"
