title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  reset full ip_vs_seq structs in ip_vs_conn_new\n\nCommit 9a05475cebdd (\"ipvs: avoid
  kmem_cache_zalloc in\nip_vs_conn_new\") changed ip_vs_conn_new() to allocate an
  ip_vs_conn\nobject with kmem_cache_alloc().  The function then initializes many\n\
  fields explicitly, but only resets in_seq.delta and out_seq.delta in the\ntwo struct
  ip_vs_seq members.\n\nThat leaves init_seq and previous_delta uninitialized.  This
  is normally\nharmless while the corresponding IP_VS_CONN_F_IN_SEQ or\nIP_VS_CONN_F_OUT_SEQ
  flag is clear.  For connections learned from a sync\nmessage, however, ip_vs_proc_conn()
  preserves those flags from\nIP_VS_CONN_F_BACKUP_MASK and passes opt=NULL when the
  message omits\nIPVS_OPT_SEQ_DATA.  In that case the new connection can be hashed
  with\nSEQ flags set but with the rest of in_seq/out_seq still containing stale\n\
  slab data.\n\nWhen a packet for such a connection is later handled by an IPVS\n\
  application helper, vs_fix_se"
