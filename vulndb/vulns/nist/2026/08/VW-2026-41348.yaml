title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/dp/mst:
  fix OOB reads on 2-byte fields in sideband reply parsers\n\nThree sideband reply
  parsers read 16-bit fields as:\n\n  val = (raw->msg[idx] << 8) | (raw->msg[idx+1]);\n\
  \nand check bounds only after the fact. When idx == raw->curlen,\nraw->msg[idx+1]
  reads one byte past the received message data into\nthe following struct fields
  (curchunk_len, curchunk_idx, curlen).\n\nAffected functions:\n - drm_dp_sideband_parse_enum_path_resources_ack()\n\
  \   full_payload_bw_number and avail_payload_bw_number fields\n - drm_dp_sideband_parse_allocate_payload_ack()\n\
  \   allocated_pbn field\n - drm_dp_sideband_parse_query_payload_ack()\n   allocated_pbn
  field\n\nFix by using a single combined check (idx + 2 > curlen) before each\n2-byte
  read. Since the check is strictly tighter than idx > curlen,\nno separate step is
  needed.\n\n[added fixes tag]"
