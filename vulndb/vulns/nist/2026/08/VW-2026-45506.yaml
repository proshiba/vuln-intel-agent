title: FreeCAD is a free and open-source multiplatform 3D parametric modeler. 
  From 0.19 until 1.1.1, src/Mod/BIM/bimcommands/BimProjectManager.py in the BIM
  Project Manager Load Template flow passes attacker-controlled FCStd Meta 
  property values for wpposition, wpu, wpv, and wpaxis directly to eval(), 
  allowing arbitrary Python code execution when a user loads a malicious BIM 
  project template. This issue is fixed in version 1.1.1.
