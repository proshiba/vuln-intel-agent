title: rclone before v1.75.0 fails to sanitize IBM IAM bearer tokens and SSE-C 
  encryption keys during S3 redirect callbacks, allowing credentials to be 
  preserved across scheme or host changes. Attackers observing network traffic 
  from a trusted endpoint can capture reusable IBM IAM tokens on same-host 
  HTTPS-to-HTTP downgrades or SSE-C keys on cross-origin redirects to access 
  protected S3 objects.
