title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  migrate_device: fix pte_pfn/pte_dirty called on non-present PTE\n\npte_pfn() and
  pte_dirty() have undefined behaviour when called on a\nnon-present PTE. In migrate_vma_collect_pmd(),
  these functions may be\ninvoked on non-present entries (e.g., device-private entries),
  leading\nto potential crashes from pte_pfn() or incorrect dirty folio accounting\n\
  from pte_dirty(). Fix both by guarding with pte_present() checks."
