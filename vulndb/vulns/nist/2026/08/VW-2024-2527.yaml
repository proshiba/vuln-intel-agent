title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: Fix multiple init when debugfs is disabled\n\nIf bt_debugfs is not created
  successfully, which happens if either\nCONFIG_DEBUG_FS or CONFIG_DEBUG_FS_ALLOW_ALL
  is unset, then iso_init()\nreturns early and does not set iso_inited to true. This
  means that a\nsubsequent call to iso_init() will result in duplicate calls to\n\
  proto_register(), bt_sock_register(), etc.\n\nWith CONFIG_LIST_HARDENED and CONFIG_BUG_ON_DATA_CORRUPTION
  enabled, the\nduplicate call to proto_register() triggers this BUG():\n\n  list_add
  double add: new=ffffffffc0b280d0, prev=ffffffffbab56250,\n    next=ffffffffc0b280d0.\n\
  \  ------------[ cut here ]------------\n  kernel BUG at lib/list_debug.c:35!\n\
  \  Oops: invalid opcode: 0000 [#1] PREEMPT SMP PTI\n  CPU: 2 PID: 887 Comm: bluetoothd
  Not tainted 6.10.11-1-ao-desktop #1\n  RIP: 0010:__list_add_valid_or_report+0x9a/0xa0\n\
  \  ...\n    __list_add_valid_or_report+0x9a/0xa0\n    proto_register+0x2b5/0x340\n\
  \    iso"
