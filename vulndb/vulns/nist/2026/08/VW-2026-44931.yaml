title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: Fix DMA buffer out-of-bounds write when fill_max is set\n\nWhen a USB
  audio endpoint requests full packet transfers via the fill_max\ndescriptor flag,
  data_ep_set_params() promotes ep->curpacksize to\nep->maxpacksize. However, maxsize
  is left at the original sample-rate\nderived value.\n\nSince u->buffer_size is allocated
  as maxsize * packets, the resulting\nDMA buffer is far too small for the requested
  transfer length. When the\nUSB host controller streams up to curpacksize bytes per
  packet, it writes\npast the end of the buffer via DMA, corrupting kernel heap memory.\n\
  \nUpdate maxsize to curpacksize when fill_max is set so that the allocated\nDMA
  buffer size matches the actual transfer request size.\n\n[ changed to reassign maxsize
  only when ep->fill_max is set -- tiwai ]"
