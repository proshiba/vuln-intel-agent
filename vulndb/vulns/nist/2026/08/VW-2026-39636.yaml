title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnexthop:
  initialize extack in nh_res_bucket_migrate()\n\nnh_res_bucket_migrate() passes an
  uninitialized netlink_ext_ack to\ncall_nexthop_res_bucket_notifiers(). When\nnh_notifier_res_bucket_info_init()
