title: The execute_ruby tool is documented as a read-only Ruby sandbox and is 
  enforced by a pattern denylist together with replacements for the 
  process-spawning methods on Kernel. The pseudo-terminal library's spawn entry 
  points are neither in the denylist nor replaced, so a normal tool call could 
  reach them and start a shell, executing commands as the account running the 
  server and outside the guarded methods. The denylist was introduced with the 
  tool in 1.4.0 and never covered those entry points through 1.6.0. Version 
  1.6.1 restricts the requires the sandbox permits to a data-only list and 
  blocks dynamic dispatch to execution entry points; 2.0.0 removes the tool.
