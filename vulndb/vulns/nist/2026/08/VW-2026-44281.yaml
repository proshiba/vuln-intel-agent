title: "In the Linux kernel, the following vulnerability has been resolved:\n\nio_uring/bpf-ops:
  reject re-registration of an already-bound ops\n\nio_install_bpf() only rejects
  a second registration on the ctx side\n(ctx->bpf_ops) and sets the per-map back-pointer
  ops->priv\nunconditionally. The struct_ops link path never advances a map past\n\
  BPF_STRUCT_OPS_STATE_READY, so the same io_uring_bpf_ops map can be\nregistered
  more than once, and bpf_io_reg() re-resolves the target ring\nvia fget(ops->ring_fd)
  on every call. A caller can therefore point the\nsame ring_fd at a different io_ring_ctx
  between two BPF_LINK_CREATE\ncalls.\n\nThe second registration passes the ctx->bpf_ops
  check (the new ctx has\nnone) and overwrites ops->priv, orphaning the first ctx.
  Teardown\n(io_eject_bpf()/bpf_io_unreg()) only reaches a ctx through ops->priv,
  so\nthe orphaned ctx is never torn down: its ctx->loop_step keeps pointing\ninto
