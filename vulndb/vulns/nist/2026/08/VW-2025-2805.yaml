title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  fix use-after-free bug in refresh_cache_worker()\n\nThe UAF bug occurred because
  we were putting DFS root sessions in\ncifs_umount() while DFS cache refresher was
  being executed.\n\nMake DFS root sessions have same lifetime as DFS tcons so we
  can avoid\nthe use-after-free bug is DFS cache refresher and other places that\n\
  require IPCs to get new DFS referrals on.  Also, get rid of mount\ngroup handling
  in DFS cache as we no longer need it.\n\nThis fixes below use-after-free bug catched
  by KASAN\n\n[ 379.946955] BUG: KASAN: use-after-free in __refresh_tcon.isra.0+0x10b/0xc10
  [cifs]\n[ 379.947642] Read of size 8 at addr ffff888018f57030 by task kworker/u4:3/56\n\
  [ 379.948096]\n[ 379.948208] CPU: 0 PID: 56 Comm: kworker/u4:3 Not tainted 6.2.0-rc7-lku
  #23\n[ 379.948661] Hardware name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS\nrel-1.16.0-0-gd239552-rebuilt.opensuse.org
  04/01/2014\n[ 379.949368] Workqueue: cifs-dfscache refresh_cache_wo"
