title: Grav CMS before 2.0.16 contains a symlink following vulnerability in 
  Scheduler Job::createLockFile() that allows local attackers to overwrite 
  arbitrary files by pre-creating symlinks at predictable lock file paths in the
  world-writable temp directory. Attackers can place a symlink at the 
  predictable lock path pointing to any file the web server process can write 
  to, and the next scheduled job run will follow the symlink and overwrite the 
  target file's content with the job ID string.
