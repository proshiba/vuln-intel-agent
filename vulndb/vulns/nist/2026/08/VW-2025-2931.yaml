title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  cavium - prevent integer overflow loading firmware\n\nThe \"code_length\" value
  comes from the firmware file.  If your firmware\nis untrusted realistically there
  is probably very little you can do to\nprotect yourself.  Still we try to limit
  the damage as much as possible.\nAlso Smatch marks any data read from the filesystem
  as untrusted and\nprints warnings if it not capped correctly.\n\nThe \"ntohl(ucode->code_length)
  * 2\" multiplication can have an\ninteger overflow."
