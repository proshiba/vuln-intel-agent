title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni40e:
  remove read access to debugfs files\n\nThe 'command' and 'netdev_ops' debugfs files
  are a legacy debugging\ninterface supported by the i40e driver since its early days
  by commit\n02e9c290814c (\"i40e: debugfs interface\").\n\nBoth of these debugfs
  files provide a read handler which is mostly useless,\nand which is implemented
  with questionable logic. They both use a static\n256 byte buffer which is initialized
  to the empty string. In the case of\nthe 'command' file this buffer is literally
  never used and simply wastes\nspace. In the case of the 'netdev_ops' file, the last
  command written is\nsaved here.\n\nOn read, the files contents are presented as
  the name of the device\nfollowed by a colon and then the contents of their respective
  static\nbuffer. For 'command' this will always be \"<device>: \". For 'netdev_ops',\n\
  this will be \"<device>: <last command written>\". But note the buffer is\nshared
  between all devices operated by this"
