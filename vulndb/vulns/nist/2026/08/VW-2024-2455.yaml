title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  don't readahead the relocation inode on RST\n\nOn relocation we're doing readahead
  on the relocation inode, but if the\nfilesystem is backed by a RAID stripe tree
  we can get ENOENT (e.g. due to\npreallocated extents not being mapped in the RST)
  from the lookup.\n\nBut readahead doesn't handle the error and submits invalid reads
  to the\ndevice, causing an assertion in the scatter-gather list code:\n\n  BTRFS
  info (device nvme1n1): balance: start -d -m -s\n  BTRFS info (device nvme1n1): relocating
  block group 6480920576 flags data|raid0\n  BTRFS error (device nvme1n1): cannot
  find raid-stripe for logical [6481928192, 6481969152] devid 2, profile raid0\n \
  \ ------------[ cut here ]------------\n  kernel BUG at include/linux/scatterlist.h:115!\n\
  \  Oops: invalid opcode: 0000 [#1] PREEMPT SMP PTI\n  CPU: 0 PID: 1012 Comm: btrfs
  Not tainted 6.10.0-rc7+ #567\n  RIP: 0010:__blk_rq_map_sg+0x339/0x4a0\n  RSP: 0018:ffffc90001a43820
  EFLAGS: 00"
