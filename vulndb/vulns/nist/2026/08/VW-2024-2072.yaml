title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: WARN on vNMI + NMI window iff NMIs are outright masked\n\nWhen requesting an
  NMI window, WARN on vNMI support being enabled if and\nonly if NMIs are actually
  masked, i.e. if the vCPU is already handling an\nNMI.  KVM's ABI for NMIs that arrive
  simultanesouly (from KVM's point of\nview) is to inject one NMI and pend the other.\
  \  When using vNMI, KVM pends\nthe second NMI simply by setting V_NMI_PENDING, and
  lets the CPU do the\nrest (hardware automatically sets V_NMI_BLOCKING when an NMI
  is injected).\n\nHowever, if KVM can't immediately inject an NMI, e.g. because the
  vCPU is\nin an STI shadow or is running with GIF=0, then KVM will request an NMI\n\
  window and trigger the WARN (but still function correctly).\n\nWhether or not the
