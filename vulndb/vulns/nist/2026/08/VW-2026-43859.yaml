title: The W3 Total Cache plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Comment Author Name in all versions up to, and 
  including, 2.10.3 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page. 
  This vulnerability is only exploitable when the Lazy Load Images feature of W3
  Total Cache is enabled, as the unsafe re-emission occurs exclusively within 
  the LazyLoad mutator's img tag rewriting step.
