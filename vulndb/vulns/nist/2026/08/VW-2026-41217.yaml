title: "In the Linux kernel, the following vulnerability has been resolved:\n\nftrace:
  Add global mutex to serialize trace_parser access\n\nIn ftrace, the trace_parser
  structure is allocated and initialized when\na trace file is opened, and is subsequently
  used across write and release\nhandlers to parse user input.\n\nThe affected handler
  paths and their specific functions are:\n  - Open paths: ftrace_regex_open(), ftrace_graph_open()\n\
  \  - Write paths: ftrace_regex_write(), ftrace_graph_write()\n  - Release paths:
  ftrace_regex_release(), ftrace_graph_release()\n\nIf userspace opens a trace file
  descriptor and shares it across multiple\nthreads, concurrent write calls will race
  on the parser's internal state,\nspecifically the 'idx', 'cont', and 'buffer' fields,
  leading to corrupted\ninput or undefined behavior.\n\nFix this by adding a global
  mutex, parser_lock, to serialize all access\nto trace_parser across write and release
  paths, preventing concurrent\ncorruption of parser state."
