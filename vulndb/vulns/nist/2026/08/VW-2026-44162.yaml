title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: validate extension-frame layout before RX\n\nExtension frames only have
  the extension header at the regular 802.11\nheader offset. The generic RX path can
  still reach helpers and interface\ndispatch code that read regular header address
  fields before unsupported\nextension subtypes are dropped.\n\nmac80211 currently
  only handles S1G beacon extension frames. Drop other\nextension subtypes before
  they can reach regular-header RX processing.\nFor S1G beacons, linearize the SKB
  with the management-frame path and\nrequire the fixed S1G beacon header, including
  optional fixed fields\nindicated by frame control, before generic RX dispatch.\n\
  \nRoute S1G beacons through the station/default-link RX path without\nregular-header
  station lookup. Avoid regular-header address reads in the\nmac80211 RX paths that
  process S1G extension beacons, including\naccept-frame, duplicate-detection, address-copy,
  and MLO\naddress-translation pat"
