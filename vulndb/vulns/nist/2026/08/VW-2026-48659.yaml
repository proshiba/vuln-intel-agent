title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Prevent subbuf order change when resizing is disabled\n\nBecause ring_buffer_subbuf_order_set()
  frees buffer pages, we can't\nallow it when resizing is disabled. A non-consuming
  reader is at risk of\nuse-after-free (rb_advance_iter()).\n\nReturn -EBUSY on resize_disabled,
  matching ring_buffer_resize()\nbehaviour."
