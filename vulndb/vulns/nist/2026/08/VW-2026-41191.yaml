title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrtase:
  Workaround for TX hang caused by hardware packet parsing\n\nThe hardware performs
  packet parsing before packet transmission.\nParsing incomplete IPv4, IPv6, TCP,
  or UDP headers may trigger a TX\nhang because the hardware parser expects additional
  protocol header\ndata that is not present in the packet.\n\nThe hardware performs
  additional PTP parsing on UDP packets identified\nby destination ports 319/320 at
  the expected UDP destination port\noffset.\n\nIf such a packet has transport data
  smaller than RTASE_MIN_PAD_LEN,\nthe hardware parser expects additional packet data
  and may trigger a\nTX hang.\n\nTo avoid these hardware issues, the driver applies
  the following\nworkarounds.\n\nDrop malformed packets that may trigger this hardware
  issue before\ntransmission.\n\nFor IPv4 non-initial fragments, the hardware does
  not check the\nfragment offset before parsing the expected transport header location.\n\
