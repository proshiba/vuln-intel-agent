title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  wwan: t7xx: check skb_clone in control TX\n\nt7xx_port_ctrl_tx() clones each skb
  fragment before passing it to the\nport transmit path. The clone is used immediately
  to set cloned->len, so\nan skb_clone() failure results in a NULL pointer dereference.\n\
  \nCheck the clone before using it. If previous fragments were already\nqueued, preserve
  the driver's existing partial-write behavior by\nreturning the number of bytes submitted
  so far."
