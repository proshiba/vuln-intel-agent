title: "Zephyr's Precision Time Protocol receive handler ptp_msg_post_recv() in subsys/net/lib/ptp/msg.c
  takes the 4-bit message type straight off the wire via ptp_msg_type() (msg->header.type_major_sdo_id
  & 0xF, range 0-15) and uses it to index the msg_size[] table. That table only defines
  entries up to PTP_MSG_MANAGEMENT (0xD), giving it ARRAY_SIZE == 14. Before the fix
  there was no upper-bound check, so the undefined types 0xE and 0xF indexed one or
  two int slots past the end of the array — an out-of-bounds read of adjacent read-only
  data.\n\nThe out-of-bounds value is then reused as a length: it gates msg_size[type]
  > cnt, and when it is small or negative it makes cnt - msg_size[type] a large positive
  budget passed to msg_tlv_post_recv(), whose TLV loop then walks the message suffix
  past the received bytes, performing further out-of-bounds reads and in-place byte-swap
  writes on memory beyond the message slab.\n\nThe defect is reached directly from
  the network: ptp_port_event_gen() in subsys/ne"
