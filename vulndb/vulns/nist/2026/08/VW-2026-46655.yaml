title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Installation and Configuration).   The supported version
  that is affected is 11.2.25.0.000. Difficult to exploit vulnerability allows unauthenticated
  attacker with logon to the infrastructure where Oracle Hyperion Infrastructure Technology
  executes to compromise Oracle Hyperion Infrastructure Technology.  Successful attacks
  require human interaction from a person other than the attacker. Successful attacks
  of this vulnerability can result in  unauthorized creation, deletion or modification
  access to critical data or all Oracle Hyperion Infrastructure Technology accessible
  data as well as  unauthorized access to critical data or complete access to all
  Oracle Hyperion Infrastructure Technology accessible data. CVSS 3.1 Base Score 6.3
  (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:N).'
