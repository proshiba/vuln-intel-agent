title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ses: Handle enclosure with just a primary component gracefully\n\nThis reverts commit
  3fe97ff3d949 (\"scsi: ses: Don't attach if enclosure\nhas no components\") and introduces
  proper handling of case where there are\nno detected secondary components, but primary
  component (enumerated in\nnum_enclosures) does exist. That fix was originally proposed
  by Ding Hui\n<dinghui@sangfor.com.cn>.\n\nCompletely ignoring devices that have
  one primary enclosure and no\nsecondary one results in ses_intf_add() bailing completely\n\
  \n\tscsi 2:0:0:254: enclosure has no enumerated components\n        scsi 2:0:0:254:
  Failed to bind enclosure -12ven in valid configurations such\n\neven on valid configurations
  with 1 primary and 0 secondary enclosures as\nbelow:\n\n\t# sg_ses /dev/sg0\n\t\
  \  3PARdata  SES               3321\n\tSupported diagnostic pages:\n\t  Supported
  Diagnostic Pages [sdp] [0x0]\n\t  Configuration (SES) [cf] [0x1]\n\t  Short Enclosure
  Status (SES) "
