title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  aa_label_alloc use aa_label_free on alloc failure\n\naa_label_alloc() allocates
  a secid before allocating or taking the label\nproxy. If the later proxy step fails,
  the error path only freed the label\nmemory, leaking any resources initialized by
  aa_label_init().\n\nUse aa_label_free() on the failure path so partially initialized
  labels\nrelease their secid and other label resources before the backing memory
  is\nfreed."
