title: "CTI-Transmute contained a cross-site request forgery vulnerability in the
  administrative user deletion functionality. The /account/delete/<id> endpoint accepted
  HTTP GET requests for an operation that modified application state.\n\nAn unauthenticated
  remote attacker could construct a malicious link or embed a request targeting this
  endpoint and induce an authenticated CTI-Transmute administrator to visit the attacker-controlled
  content. If the administrator had an active session, the browser would automatically
  include the administrator’s session credentials, causing the selected user account
  to be deleted without the administrator intentionally confirming the operation.\n\
