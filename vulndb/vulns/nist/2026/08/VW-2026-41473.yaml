title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: bound element ID read when checking non-inheritance\n\ncfg80211_is_element_inherited()
  reads the first data octet of the\ncandidate element (id = elem->data[0]) to look
  it up in an extension\nnon-inheritance list. It does so after testing elem->id,
  but without\nverifying that the element actually has a data octet. A zero-length\n\
  extension element (WLAN_EID_EXTENSION with length 0) therefore makes it\nread one
  octet past the end of the element.\n\n_ieee802_11_parse_elems_full() runs this check
  for every element of a\nframe once a non-inheritance context exists -- e.g. while
  parsing a\nper-STA profile of a Multi-Link element in a (re)association response,\n\
  or a non-transmitted BSS profile -- so a crafted frame from an AP can\ntrigger a
  one-octet slab-out-of-bounds read during element parsing:\n\n  BUG: KASAN: slab-out-of-bounds
  in cfg80211_is_element_inherited\n  Read of size 1 ... in net/wireless/scan.c\n\n\
  Return early ("
