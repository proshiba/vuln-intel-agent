title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/histograms:
  Add histograms to hist_vars if they have referenced variables\n\nHist triggers can
  have referenced variables without having direct\nvariables fields. This can be the
  case if referenced variables are added\nfor trigger actions. In this case the newly
  added references will not\nhave field variables. Not taking such referenced variables
  into\nconsideration can result in a bug where it would be possible to remove\nhist
  trigger with variables being refenced. This will result in a bug\nthat is easily
  reproducable like so\n\n$ cd /sys/kernel/tracing\n$ echo 'synthetic_sys_enter char[]
  comm; long id' >> synthetic_events\n$ echo 'hist:keys=common_pid.execname,id.syscall:vals=hitcount:comm=common_pid.execname'
  >> events/raw_syscalls/sys_enter/trigger\n$ echo 'hist:keys=common_pid.execname,id.syscall:onmatch(raw_syscalls.sys_enter).synthetic_sys_enter($comm,
  id)' >> events/raw_syscalls/sys_enter/trigger\n$ echo '!hist:keys"
