title: "nnn is vulnerable to Out-of-Bound write vulnerability. Due to lack of validation
  of attacker-controlled length fields deserialized from a session file, a crafted
  session file can cause nnn to write data beyond the bounds of fixed-size global
  buffers when loaded with the -s option. An attacker who can place a malicious session
  file in the victim's nnn session directory can exploit this to corrupt adjacent
  global state.\n\n\n\n\nMaintainer of this project was notified about this vulnerability.
  It might has been addressed, but the maintainer did not provide a vulnerable version
  range. Only version 5.2 was tested and confirmed as vulnerable."
