title: Twenty is an open-source CRM (customer relationship management) platform.
  Prior to 2.15.0, Twenty allowed a workspace administrator with the DATA_MODEL 
  permission to supply settings.asExpression for the system TS_VECTOR field 
  searchVector through PATCH /rest/metadata/fields/:id or the updateOneField 
  GraphQL mutation, causing buildSqlColumnDefinition in 
  packages/twenty-server/src/engine/twenty-orm/workspace-schema-manager/utils/build-sql-column-definition.util.ts
  to concatenate unescaped input into GENERATED ALWAYS AS (...) and execute 
  arbitrary PostgreSQL statements as the application database user. This issue 
  is fixed in version 2.15.0.
