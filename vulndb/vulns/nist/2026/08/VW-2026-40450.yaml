title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. The new-client booking flow in versions 1.0.1 and
  prior consists of three calls: `bootstrap-challenge` (returns a 16-bit PoW challenge
  with `difficulty=4` leading hex zeroes), `bootstrap-verify` (validates the PoW and
  issues a Bearer booking access token), and `create-new-client` (consumes the token
  and creates the tunnel and first appointment). The token correctly binds to `tenantId`,
  `tunnelId`, `clientPublicKey`, and `emailHash`, but never to `channelId`. The `bootstrap-challenge`
  request schema does not even accept a `channelId`, and the issued token's payload
  contains no channel information. Independently, the service function `createNewClientWithAppointment`
  checks only `channel.archived = false`. The `channel.isPublic` check that protects
  `addAppointmentToTunnel` is missing in the new-client path. The combination means:
