title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pci: Fix NULL dereference on AIBV allocation failure\n\nThe airq_iv_create()
  can return NULL on failure, but the return value was\nnever checked. If it fails,
  zdev->aibv will be NULL and fail when\ndereferenced in kvm_zpci_set_airq(). Add
  a NULL check and free the\npreviously allocated AISB bit and zdev->aisb on failure."
