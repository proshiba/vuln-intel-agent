title: "ATutor is vulnerable to Stored Cross Site Scripting in registration functionality.  An
  attacker can register a new account and enter a JavaScript payload in the phone
  field during registration. When any authenticated user visits the attacker's public profile,
  the profile template echoes the phone value without output encoding and the browser
  executes the payload leading to the theft of user's session cookie.\n\n\n\n\nProduct
  is no longer actively supported and the vulnerabilities have not been fixed. Only
  version 2.2.4 was tested and confirmed as vulnerable, other versions were not tested
  but might also be vulnerable."
