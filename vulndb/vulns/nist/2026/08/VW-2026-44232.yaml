title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  tegra: do not call pinctrl for GPIO direction\n\ntegra_gpio_direction_input() and
  tegra_gpio_direction_output() already\nprogram the GPIO controller direction registers
  directly. The additional\npinctrl_gpio_direction_input/output() calls do not add
  a Tegra pinctrl\noperation, because the Tegra pinmux ops provide GPIO request/free\n\
  handling but no gpio_set_direction hook.\n\nThe extra call still enters the pinctrl
  core and takes pctldev->mutex.\nShared GPIO users can call the direction path while
  holding their\nper-line spinlock, so this otherwise redundant pinctrl direction
  call can\nsleep in an atomic context.\n\nThis was found by our static analysis tool
  and then confirmed by manual\nreview of tegra_gpio_probe(), the Tegra GPIO direction
  callbacks and the\nTegra pinctrl ops. The reviewed path has a default non-sleeping\n\
  struct gpio_chip while the direction callback still enters the pinctrl\nmutex path.\n\
