title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Prevent user-triggered null deref on QP create\n\nPreviously, the user QP creation
  path would only attempt to\npopulate iwqp->iwpbl if the user-provided req.user_wqe_bufs\n\
  field was non-zero. The problem is that iwqp->iwpbl is\nunconditionally dereferenced
  later on in irdma_setup_virt_qp.\n\nWhile there was a check for iwqp->iwpbl != NULL,
  this check\nwould only occur if req.user_wqe_bufs was non-zero. The end\nresult
  is that a user could send a zero user_wqe_bufs value\nand trigger a null ptr deref.\n\
  \nFix this by unconditionally calling irdma_get_pbl and bailing\nif it fails, similar
  to the CQ and SRQ paths."
