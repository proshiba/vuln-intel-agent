title: Type confusion in PostgreSQL pg_restore_attribute_stats() allows an 
  object creator to execute arbitrary code as the operating system user running 
  the database, via conflation of range and multirange values.  Within major 
  version 18, minor versions before PostgreSQL 18.5 are affected.  Versions 
  before PostgreSQL 18 are unaffected.
