title: "A vulnerability exists in the Dynamic DNS (DDNS) functionality of TP-Link
  Omada Gateways. During communication with a third-party DDNS service, authentication
  credentials are transmitted over an unencrypted channel. An attacker who can observe or
  manipulate traffic between an affected device and the DDNS service may obtain sensitive
  authentication information or interfere with DDNS update operations. Exploitation
  requires DDNS to be configured, communication with an external DDNS service, and
  attacker visibility or control of the relevant network path. \n\n\n\n\n\nSuccessful
  exploitation may result in disclosure of DDNS account credentials, unauthorized
  access to DDNS management functionality, or modification of DNS records associated
  with the affected deployment."
