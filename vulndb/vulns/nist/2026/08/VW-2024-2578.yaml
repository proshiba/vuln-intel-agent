title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix error propagation of split bios\n\nThe purpose of btrfs_bbio_propagate_error()
  shall be propagating an error\nof split bio to its original btrfs_bio, and tell
  the error to the upper\nlayer. However, it's not working well on some cases.\n\n\
  * Case 1. Immediate (or quick) end_bio with an error\n\nWhen btrfs sends btrfs_bio
  to mirrored devices, btrfs calls\nbtrfs_bio_end_io() when all the mirroring bios
  are completed. If that\nbtrfs_bio was split, it is from btrfs_clone_bioset and its
  end_io function\nis btrfs_orig_write_end_io. For this case, btrfs_bbio_propagate_error()\n\
  accesses the orig_bbio's bio context to increase the error count.\n\nThat works
  well in most cases. However, if the end_io is called enough\nfast, orig_bbio's (remaining
  part after split) bio context may not be\nproperly set at that time. Since the bio
  context is set when the orig_bbio\n(the last btrfs_bio) is sent to devices, that
