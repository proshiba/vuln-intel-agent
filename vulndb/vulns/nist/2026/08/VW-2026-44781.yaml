title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject exclusive maps as inner maps in map-in-map\n\nAn exclusive map (created with
  excl_prog_hash) is bound to a single\nprogram by hash: check_map_prog_compatibility()
  refuses to load any\nprogram whose digest does not match map->excl_prog_sha. That
  check\nonly runs for maps a program references directly, i.e. its used_maps.\nA
  map reached at runtime through a map-of-maps is never in used_maps,\nand bpf_map_meta_equal()
  does not consider excl_prog_sha, so an\nexclusive map can be inserted into a non-exclusive
  outer map and\nthen looked up and mutated by an unrelated program, bypassing the\n\
  exclusivity guarantee.\n\nFor the signed loader this defeats the metadata map exclusivity
  check\nadded in the signed loader: the cached map->sha[] is validated against\n\
  the signed hash while another program on a hostile host rewrites the\nfrozen map's
  contents through the outer map."
