title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndriver
  core: use READ_ONCE() for dev->driver in dev_has_sync_state()\n\ndev_has_sync_state()
  reads dev->driver twice without holding\ndevice_lock() -- once for the NULL check
  and once to dereference\n->sync_state. Some callers only hold device_links_write_lock,
  which\ndoesn't prevent a concurrent unbind from clearing dev->driver via\ndevice_unbind_cleanup().\n\
  \nFix it by reading dev->driver exactly once with READ_ONCE(), pairing\nwith the
  WRITE_ONCE() in device_set_driver()."
