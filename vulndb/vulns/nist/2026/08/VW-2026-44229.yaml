title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: ti: icssg: guard PA stat lookups\n\nicssg_ndo_get_stats64() unconditionally
  calls emac_get_stat_by_name()\nwith FW PA stat names regardless of whether the PA
  stats block is\npresent on the hardware.  emac_get_stat_by_name() already guards
  the\nPA stats lookup with `if (emac->prueth->pa_stats)`; when that pointer\nis NULL
  the lookup falls through to netdev_err() and returns -EINVAL.\nBecause ndo_get_stats64
  is polled regularly by the networking stack\nthis produces thousands of log entries
  of the form:\n\n  icssg-prueth icssg1-eth end0: Invalid stats FW_RX_ERROR\n\nA secondary
  consequence is that the int(-EINVAL) return value is\nimplicitly widened to a near-ULLONG_MAX
  unsigned value when accumulated\ninto the __u64 fields of rtnl_link_stats64, silently
  corrupting the\nrx_errors, rx_dropped and tx_dropped counters reported by `ip -s
  link`.\n\nEvery other PA-aware code path in the driver is already guarded with\n\
  the same `"
