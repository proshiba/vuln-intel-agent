title: A vulnerability has been found in CTFd up to 3.8.4. The affected element 
  is the function _is_safe_url of the file CTFd/utils/validators/__init__.py. 
  Such manipulation of the argument Next leads to open redirect. The attack can 
  be launched remotely. The exploit has been disclosed to the public and may be 
  used. The name of the patch is 5d8515842fd1ab2c3a9f2dde9ffca907aa334ea9. 
  Upgrading the affected component is recommended.
