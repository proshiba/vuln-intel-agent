title: The SAML Single Sign On  WordPress plugin before 5.4.7 does not verify 
  the signature of a SAML response before storing the certificate it carries, 
  and offers an administrator a one-click control that promotes that stored 
  certificate to the site's trusted signing certificate, allowing 
  unauthenticated attackers to have a certificate of their own trusted and then 
  authenticate as any user, including an administrator.
