title: "A vulnerability in the processing of Galois/Counter Mode (GCM)-encrypted Internet
  Key Exchange version 2 (IKEv2) IPsec traffic of Cisco Secure Firewall Adaptive Security
  Appliance (ASA) Software and Cisco Secure Firewall Threat Defense (FTD) Software
  could allow an authenticated, remote attacker to cause a denial of service (DoS)
  condition on an affected device.\r\n\r This vulnerability is due to the allocation
  of an insufficiently sized block of memory. An attacker could exploit this vulnerability
  by sending crafted GCM-encrypted IPsec traffic to an affected device. A successful
  exploit could allow the attacker to cause an unexpected reload of the device, resulting
  in a DoS condition. To exploit this vulnerability, the attacker must have valid
  credentials to establish a VPN connection with the affected device."
