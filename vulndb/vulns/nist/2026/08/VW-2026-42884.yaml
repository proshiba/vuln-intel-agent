title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_ffa: Fix NULL dereference in ffa_partition_info_get()\n\nffa_partition_info_get()
  passes uuid_str directly to uuid_parse()\nwithout a NULL check. When a caller passes
  NULL, uuid_parse() ->\n__uuid_parse() -> uuid_is_valid() dereferences the pointer,
  causing\na kernel panic:\n\n  |  Unable to handle kernel NULL pointer dereference
  at virtual address\n  |  0000000000000040\n  |  pc : uuid_parse+0x40/0xac\n  | \
  \ lr : ffa_partition_info_get+0x1c/0x94 [arm_ffa]\n\nAdd a NULL guard before uuid_parse()
  so a NULL argument returns\n-ENODEV instead of crashing. Callers are expected to
  always supply\na valid partition UUID, so NULL is not a supported input."
