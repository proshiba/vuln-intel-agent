title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  tun: unlink NAPI from device on destruction\n\nSyzbot found a race between tun file
  and device destruction.\nNAPIs live in struct tun_file which can get destroyed before\n\
  the netdev so we have to del them explicitly. The current\ncode is missing deleting
  the NAPI if the queue was detached\nfirst."
