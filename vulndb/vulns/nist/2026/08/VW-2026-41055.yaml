title: The RSS Aggregator by Feedzy  WordPress plugin before 5.2.6 does not 
  verify that the requesting user owns or is allowed to edit the import job 
  named in the request, allowing users with author-level access and above to 
  permanently delete the posts created by another user's import job, reset its 
  deduplication and scheduling state, disable it, or clear its error log. One of
  the affected actions performs no object-type check either, so arbitrary posts 
  and pages can also be unpublished regardless of who owns them.
