title: A security flaw has been discovered in azer react-analyzer-mcp up to 
  335f2a3585f265e2e88352b59b10d3b478d678b0. Affected by this vulnerability is 
  the function generateProjectDocs of the file src/index.ts of the component 
  analyze-projec. The manipulation of the argument projectName results in path 
  traversal. The attack is only possible with local access. This product 
  implements a rolling release for ongoing delivery, which means version 
  information for affected or updated releases is unavailable. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
