title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnexthop:
  take nh->lock for f6i_list walks in replace check and notify\n\nfib6_check_nh_list()
  and __nexthop_replace_notify() walk nh->f6i_list\nduring an RTNL-serialized nexthop
  replace without holding nh->lock. IPv6\nRTM_NEWROUTE/RTM_DELROUTE run without RTNL
  and mutate that list under\nnh->lock (fib6_add_rt2node_nh(), fib6_purge_rt()), so
  both walks race a\nconcurrent route delete that unlinks and frees a fib6_info:\n\
  \n  BUG: KASAN: slab-use-after-free in rt6_fill_node.isra.0 (net/ipv6/route.c:5799)\n\
  \  Read of size 4 at addr ffff888014607e64 by task exploit/143\n   rt6_fill_node.isra.0
  (net/ipv6/route.c:5799)\n   fib6_rt_update (net/ipv6/route.c:6412)\n   __nexthop_replace_notify
  (net/ipv4/nexthop.c:2542)\n   rtm_new_nexthop (net/ipv4/nexthop.c:2554)\n   rtnetlink_rcv_msg
  (net/core/rtnetlink.c:7076)\n\n  BUG: KASAN: slab-use-after-free in fib6_check_nh_list
  (net/ipv4/nexthop.c:1605)\n  Read of size 8 at addr ffff888014a7d068 by task"
