title: The Query Wrangler plugin for WordPress is vulnerable to Remote Code 
  Execution in all versions up to, and including, 1.5.57 via the 'options' 
  parameter parameter. This is due to missing capability check and nonce 
  verification on the wp_ajax_qw_form_ajax handler, combined with unsanitized 
  attacker-controlled options fully replacing saved query options and being 
  passed directly to call_user_func_array() guarded only by function_exists(). 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to execute code on the server. Exploitation requires only 
  that at least one query row exists in the database, as the query_id is a small
  enumerable integer with no further access control.
