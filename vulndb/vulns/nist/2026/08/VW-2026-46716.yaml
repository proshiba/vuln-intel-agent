title: 'Vulnerability in the Oracle Hyperion Profitability and Cost Management product
  of Oracle Hyperion (component: Deployment).   The supported version that is affected
  is 11.2.25.0.000. Easily exploitable vulnerability allows unauthenticated attacker
  with network access via HTTP to compromise Oracle Hyperion Profitability and Cost
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Oracle Hyperion
  Profitability and Cost Management accessible data as well as  unauthorized access
  to critical data or complete access to all Oracle Hyperion Profitability and Cost
  Management accessible data. CVSS 3.1 Base Score 9.1 (Confidentiality and Integrity
  impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N).'
