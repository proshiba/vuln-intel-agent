title: A vulnerability was found in EnzoVezzaro mcp-dominican-layer up to 
  39dd373786712650097ad31db27d5c477c8f9c82. This affects the function parse-pdf 
  of the file src/index.ts of the component PDF Parsing. Performing a 
  manipulation of the argument pdfUrl results in server-side request forgery. It
  is possible to initiate the attack remotely. The exploit has been made public 
  and could be used. The project was informed of the problem early through an 
  issue report but has not responded yet.
