title: "Microsoft is investigating reports of a remote code execution vulnerability
  in MSHTML that affects Microsoft Windows. Microsoft is aware of targeted attacks
  that attempt to exploit this vulnerability by using specially-crafted Microsoft
  Office documents.\nAn attacker could craft a malicious ActiveX control to be used
  by a Microsoft Office document that hosts the browser rendering engine. The attacker
  would then have to convince the user to open the malicious document. Users whose
  accounts are configured to have fewer user rights on the system could be less impacted
  than users who operate with administrative user rights.\nMicrosoft Defender Antivirus
  and Microsoft Defender for Endpoint both provide detection and protections for the
  known vulnerability. Customers should keep antimalware products up to date. Customers
  who utilize automatic updates do not need to take additional action. Enterprise
