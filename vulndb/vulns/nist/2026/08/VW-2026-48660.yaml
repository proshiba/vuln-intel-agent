title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  bitblit: bound-check glyph index in bit_cursor()\n\nbit_cursor() fetches the glyph
  under the cursor with\n\n\tc = scr_readw(vc_pos);\n\tsrc = vc_font.data + ((c &
  charmask) * w * height);\n\nwhere charmask is 0x1ff when vc_hi_font_mask is set.
  The screen buffer\nvalue comes directly from scr_readw() and may be larger than
  the current\nfont's glyph count.\n\nSyzkaller triggers this via vcs_write(). The
  Call Trace shows\nvcs_write() in vc_screen.c writing an arbitrary 16-bit value with\n\
  writev() to /dev/vcsa, which vcs_write_buf() in vc_screen.c stores via\nvcs_scr_writew()
  without checking charcount. The stored value is later\nread in bit_cursor() in bitblit.c.\n\
  \nWhen the font is changed from a font with 512 glyphs to a font with\n256 glyphs,
  the screen buffer can retain characters with the high\nbit set from the previous
  mode, which could also produce the same\nout-of-bounds access.\n\n  BUG: KASAN:
  global-out-of-bounds in soft_curso"
