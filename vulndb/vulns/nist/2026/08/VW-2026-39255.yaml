title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Check for invalid/obsolete root *after* making MMU pages available\n\nCheck
  for a \"stale\" page fault, i.e. for an invalid and/or obsolete root,\nafter making
  MMU pages available for the shadow MMU.  If reclaiming shadow\npages zaps an in-use
  root, i.e. marks it invalid, then KVM will attempt to\nmap memory into an invalid
  root.  On its own, populating an invalid root is\n\"fine\", but because child shadow
  pages inherit their parent's role, any\nchildren created during the map/fetch will
  be created as invalid pages,\nthus violating KVM's invariant that invalid pages
  are never on the list of\nactive MMU pages.\n\nNote, the underlying flaw has existed
  since KVM first started tracking\ninvalid roots in 2008 (commit 2e53d63acba7, \"\
  KVM: MMU: ignore zapped root\npagetables\"), but the true badness only came along
  in 2020 (Linux 5.9)\nwith the invariant that invalid shadow pages can't be on the
  list of\nactive pages.\n\nNote #2, inheri"
