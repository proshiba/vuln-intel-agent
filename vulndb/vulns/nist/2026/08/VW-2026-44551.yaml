title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  reject undersized DACLs before parsing ACEs\n\nparse_dacl() limits the attacker-controlled
  ACE count by comparing it\nwith the number of minimal ACEs that fit in the DACL
  size. The DACL size\nfield is 16 bits, but the expression subtracts sizeof(struct
  smb_acl).\nBecause sizeof() is unsigned, a DACL size smaller than the ACL header\n\
  underflows to a large size_t.\n\nA malicious client can reach this with:\n\nSMB2_SET_INFO
  (InfoType=SMB2_O_INFO_SECURITY)\n  -> smb2_set_info_sec()\n  -> set_info_sec()\n\
  \  -> parse_sec_desc()\n  -> parse_dacl()\n     -> init_acl_state(..., 0xffff)\n\
  \     -> init_acl_state(..., 0xffff)\n     -> kmalloc_objs(..., 0xffff)\n\nThus
  a malformed security descriptor can make num_aces pass the guard\nand drive large
  temporary ACL state and pointer-array allocations.\n\nReject DACLs smaller than
  struct smb_acl before doing the subtraction,\nso the ACE count check cannot be bypassed
  by the underflow."
