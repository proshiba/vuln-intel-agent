title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmemcg:
  protect concurrent access to mem_cgroup_idr\n\nCommit 73f576c04b94 (\"mm: memcontrol:
  fix cgroup creation failure after\nmany small jobs\") decoupled the memcg IDs from
  the CSS ID space to fix the\ncgroup creation failures.  It introduced IDR to maintain
  the memcg ID\nspace.  The IDR depends on external synchronization mechanisms for\n\
  modifications.  For the mem_cgroup_idr, the idr_alloc() and idr_replace()\nhappen
  within css callback and thus are protected through cgroup_mutex\nfrom concurrent
  modifications.  However idr_remove() for mem_cgroup_idr\nwas not protected against
  concurrency and can be run concurrently for\ndifferent memcgs when they hit their
  refcnt to zero.  Fix that.\n\nWe have been seeing list_lru based kernel crashes
  at a low frequency in\nour fleet for a long time.  These crashes were in different
  part of\nlist_lru code including list_lru_add(), list_lru_del() and reparenting\n\
  code.  Upon further inspection, "
