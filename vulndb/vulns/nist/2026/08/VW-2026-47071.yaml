title: Joomla Extension - balbooa.com - Pre-auth Payment Amount Tampering in 
  Balbooa Forms < 2.4.3.2 - The stripeCharges and payAuthorize endpoints accept 
  the charge total from a client-controlled request parameter and forward it to 
  the payment gateway without recomputing it from the form's configured product 
  prices. Neither endpoint enforces authentication or CSRF checks. An 
  unauthenticated attacker can purchase any priced item for an arbitrary amount 
  (e.g., $0.01), and can additionally forge line items, quantities, and 
  shipping.
