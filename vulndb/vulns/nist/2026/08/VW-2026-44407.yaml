title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/boot:
  Validate console=uart8250 baud rate to fix early boot hang\n\nWhen the baud rate
  is empty, 0, invalid, or overflows to 0 when stored\nas an int, the system will
  hang during early boot because of a division\nby zero in early_serial_init().\n\n\
  Fall back to DEFAULT_BAUD when the resulting baud rate is 0 to prevent\nan early
  system hang."
