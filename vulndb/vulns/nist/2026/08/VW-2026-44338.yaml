title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkho:
  make sure scratch size is always aligned by CMA_MIN_ALIGNMENT_BYTES\n\nWhen using
  scratch_scale, the scratch sizes are rounded up to\nCMA_MIN_ALIGNMENT_BYTES since
  they will be released as MIGRATE_CMA. This\nis not done when using fixed scratch
  sizes via command line. This can\nresult in user specifying a size which is not
  aligned, and thus kernel\nreleasing a pageblock that is only partially scratch.\n\
  \nDo the rounding up for both cases in scratch_size_update()."
