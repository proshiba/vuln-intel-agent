title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Bound synthetic-field strings with seq_buf\n\nThe synthetic field helpers build
  a prefixed synthetic variable name and\na generated hist command in fixed MAX_FILTER_STR_VAL
  buffers. The\ncurrent code appends those strings with raw strcat(), so long key
  lists,\nfield names, or saved filters can run past the end of the staging\nbuffers.\n\
  \nBuild both strings with seq_buf and propagate -E2BIG if either the\nsynthetic
  variable name or the generated command exceeds\nMAX_FILTER_STR_VAL. This keeps the
  existing tracing-side limit while\nusing the helper intended for bounded command
  construction.\n\n[ sdr: Moved struct seq_buf *s for upside-down x-mas tree formatting
  ]"
