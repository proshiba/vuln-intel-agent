title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  Fix system crash due to lack of free space in LFS\n\nWhen f2fs tries to checkpoint
  during foreground gc in LFS mode, system\ncrash occurs due to lack of free space
  if the amount of dirty node and\ndentry pages generated by data migration exceeds
  free space.\nThe reproduction sequence is as follows.\n\n - 20GiB capacity block
  device (null_blk)\n - format and mount with LFS mode\n - create a file and write
  20,000MiB\n - 4k random write on full range of the file\n\n RIP: 0010:new_curseg+0x48a/0x510
  [f2fs]\n Code: 55 e7 f5 89 c0 48 0f af c3 48 8b 5d c0 48 c1 e8 20 83 c0 01 89 43
