title: PapersGPT for Zotero 0.6.1 contains a remote code execution vulnerability
  that allows attackers to execute arbitrary JavaScript by returning malicious 
  code from an LLM endpoint that is passed unsanitized to window.eval() in 
  views.ts. Attackers can exploit this through prompt injection in PDFs, MITM 
  interception of API requests, or a malicious custom LLM endpoint to execute 
  arbitrary code in Zotero's chrome-privileged context, enabling file 
  read/write, process execution, and access to all Zotero data.
