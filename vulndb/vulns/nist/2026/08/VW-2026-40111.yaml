title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  core: fix NULL-deref on adapter registration failure\n\nIf adapter registration
  ever fails the release callback would trigger a\nNULL-pointer dereference as the
  completion struct has not been\ninitialised.\n\nNote that before the offending commit
  this would instead have resulted\nin a minor memory leak of the adapter name."
