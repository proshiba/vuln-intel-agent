title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  fix pre-auth out-of-bounds read on snaptrace in ceph_handle_caps()\n\nceph_handle_caps()
  reads snap_trace_len from the wire-format\nceph_mds_caps header and uses it unconditionally
  to build a fake\nend pointer (snaptrace + snaptrace_len) that is later handed to\n\
  ceph_update_snap_trace() in the CEPH_CAP_OP_IMPORT case:\n\n    snaptrace     =
  h + 1;\n    snaptrace_len = le32_to_cpu(h->snap_trace_len);\n    p             =
  snaptrace + snaptrace_len;\n    ...\n    case CEPH_CAP_OP_IMPORT:\n        if (snaptrace_len)
  {\n            ...\n            if (ceph_update_snap_trace(mdsc, snaptrace,\n  \
  \                                     snaptrace + snaptrace_len,\n             \
  \                          false, &realm)) { ... }\n\nceph_update_snap_trace() then
  decodes a struct ceph_mds_snap_realm\nfrom snaptrace using ceph_decode_need(&p,
  e, sizeof(*ri), bad)\nwith the attacker-supplied fake end e == snaptrace + snaptrace_len.\n\
  With snaptrace_le"
