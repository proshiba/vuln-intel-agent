title: 'Wazuh is a free and open source platform used for threat prevention, detection,
  and response. From 4.5.0 until 4.14.6 and 5.0.0-beta2, compare_wazuh_versions()
  in src/shared/version_op.c copies the attacker-controlled enrollment V: field into
  a 10-byte stack buffer with strncpy() but does not explicitly terminate the buffer.
  The function is reachable before authentication through wazuh-authd on TCP port
  1515 when anonymous TLS enrollment is enabled. A version string of at least nine
  non-null bytes can cause strchr() and strtok() to read beyond ver2 and can make
  strtok() write a null byte into adjacent stack memory, allowing a remote denial
  of service. This issue is fixed in versions 4.14.6 and 5.0.0-beta2.'
