title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  Forward wakeup to smc socket waitqueue after fallback\n\nWhen we replace TCP with
  SMC and a fallback occurs, there may be\nsome socket waitqueue entries remaining
  in smc socket->wq, such\nas eppoll_entries inserted by userspace applications.\n\
  \nAfter the fallback, data flows over TCP/IP and only clcsocket->wq\nwill be woken
  up. Applications can't be notified by the entries\nwhich were inserted in smc socket->wq
  before fallback. So we need\na mechanism to wake up smc socket->wq at the same time
  if some\nentries remaining in it.\n\nThe current workaround is to transfer the entries
  from smc socket->wq\nto clcsock->wq during the fallback. But this may cause a crash\n\
  like this:\n\n general protection fault, probably for non-canonical address 0xdead000000000100:
  0000 [#1] PREEMPT SMP PTI\n CPU: 3 PID: 0 Comm: swapper/3 Kdump: loaded Tainted:
  G E     5.16.0+ #107\n RIP: 0010:__wake_up_common+0x65/0x170\n Call Trace:\n  <IRQ>\n\
  \  __wake_u"
