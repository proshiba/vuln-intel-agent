title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpaa2-switch:
  put MAC endpoint device on disconnect\n\nfsl_mc_get_endpoint() returns the MAC endpoint
  device with a reference\ntaken through device_find_child(). The switch port connect
  path stores\nthat device in mac->mc_dev and keeps it for the lifetime of the connected\n\
  MAC object.\n\nHowever, the disconnect path only closes the MAC and frees the dpaa2_mac\n\
  object. It does not drop the endpoint device reference stored in\nmac->mc_dev, so
  every successful connect leaks that device reference when\nthe MAC is later disconnected.\n\
  \nDrop the endpoint device reference before freeing the dpaa2_mac object."
