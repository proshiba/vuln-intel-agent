title: FiftyOne renders a dataset field's description as markup. The sidebar 
  field-information component at 
  app/packages/core/src/components/FieldLabelAndInfo/index.tsx passes the 
  description string to React's dangerouslySetInnerHTML, and no layer between 
  storage and render escapes or sanitises it; the neighbouring info values in 
  the same component are rendered as React children and are escaped, so the 
  description is the only raw path. A description is free-form text held in the 
  dataset schema, so it persists in the database and travels with an exported or
  published dataset. Opening a dataset obtained from another party and hovering 
  the field runs the stored markup in the application's origin. That origin is 
  shared with the FiftyOne server, whose media route returns the contents of a 
  caller-named absolute path and which is unauthenticated in the open-source 
  server, so the injected script can read local files and reach the dataset and 
  operator endpoints as the viewing user.
