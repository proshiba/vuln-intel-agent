title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ipset: do not update comments from kernel-side hash adds\n\nmtype_resize() copies
  comment pointers with memcpy(), not the comment\nobjects themselves. During the
  window after an entry has been copied but\nbefore the table swap and backlog replay,
  the old table is still\npublished for packet-side updates while the replacement-table
  entry\nalready holds the same ip_set_comment_rcu pointer.\n\nIf xt_SET --add-set
  ... --exist hits that old entry in this window,\nmtype_add() calls ip_set_init_comment()
  even though packet-side adds\ncarry no comment payload. That call frees the shared
  comment through the\nold entry, so the replacement-table entry now holds a stale
  pointer.\nWhen the queued add is replayed on the new table, mtype_add() calls\n\
  ip_set_init_comment() again and strlen() dereferences the stale pointer.\n\nFix
  this in mtype_add() by skipping ip_set_init_comment() when\next->target marks a
  packet-side add. Userspace add"
