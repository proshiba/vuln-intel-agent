title: stigmem-node before 0.9.0a12 contains a broken object level authorization
  (cross-tenant BOLA) vulnerability in the quarantine review endpoints. On 
  multi-tenant deployments running the opt-in stigmem-plugin-multi-tenant, the 
  list/count queries and _get_quarantined_fact in routes/quarantine.py lacked a 
  tenant_id predicate and the garden lookup was not tenant-scoped, allowing a 
  tenant administrator with only a plain tenant write capability to list, read, 
  and admit or reject quarantined facts belonging to other tenants via the 
  /v1/quarantine endpoints. Default single-tenant deployments are not affected.
