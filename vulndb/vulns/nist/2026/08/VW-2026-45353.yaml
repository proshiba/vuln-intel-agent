title: "The flash_copy() system call is verified by z_vrfy_flash_copy() in drivers/flash/flash_util.c.
  On builds with CONFIG_USERSPACE enabled, this handler is the kernel-side trust boundary
  for a user-mode caller. Prior to the fix it validated only the output buffer (K_SYSCALL_MEMORY_WRITE)
  and passed the two struct device * arguments, src_dev and dst_dev, directly into
  the implementation without any object validation — unlike every sibling flash syscall,
  which guards its device pointer with K_SYSCALL_DRIVER_FLASH.\n\nA user-mode thread
  fully controls the values of src_dev/dst_dev and the contents of its own address
  space. The implementation z_impl_flash_copy() dereferences these pointers and calls
  through their driver-API function tables (e.g. api->get_parameters(dst_dev), flash_read(src_dev,
  ...), flash_write(dst_dev, ...)). By supplying a pointer to a forged struct device
  whose api table contains attacker-chosen function pointers, an unprivileged thread
  can cause the kernel to call arbitrary"
