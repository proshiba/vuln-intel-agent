title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  emac: Fix NULL pointer dereference in emac_probe\n\nMove devm_request_irq() after
  devm_platform_ioremap_resource() so that\ndev->emacp is mapped before the interrupt
  handler can fire.  An early\ninterrupt hitting emac_irq() would dereference the
  NULL dev->emacp and\ncrash.\n\nAlso remove redundant error message. devm_platform_ioremap_resource()\n\
  already returns an error message with dev_err_probe()."
