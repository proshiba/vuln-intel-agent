title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  cdns3 fix use-after-free at workaround 2\n\nBUG: KFENCE: use-after-free read in
  __list_del_entry_valid+0x10/0xac\n\ncdns3_wa2_remove_old_request()\n{\n\t...\n\t\
  kfree(priv_req->request.buf);\n\tcdns3_gadget_ep_free_request(&priv_ep->endpoint,
  &priv_req->request);\n\tlist_del_init(&priv_req->list);\n\t^^^ use after free\n\t\
  ...\n}\n\ncdns3_gadget_ep_free_request() free the space pointed by priv_req,\nbut
  priv_req is used in the following list_del_init().\n\nThis patch move list_del_init()
  before cdns3_gadget_ep_free_request()."
