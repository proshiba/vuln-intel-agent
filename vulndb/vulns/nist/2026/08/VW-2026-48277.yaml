title: "Improper Neutralization of Special Elements used in an OS Command ('OS Command
  Injection') vulnerability in Apache CloudStack's NAS backup provider plugin. The
  addBackupRepository API (available since 4.20.0.0) and updateBackupRepository API
  (introduced in 4.22.0.0) accept unsanitized command options for the backup repository.
  A malicious operator account can exploit this to inject arbitrary commands that
  execute on the KVM hypervisor host when any account subsequently performs a backup
  restore.\n\nThis issue affects Apache CloudStack: from 4.20.0.0 through 4.20.3.0
  and from 4.21.0.0 through 4.22.1.0.\n\nUsers are recommended to upgrade to version
  4.20.3.1 or 4.22.1.1 or later, which fixes the issue."
