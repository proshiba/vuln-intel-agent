title: Discourse is an open-source discussion platform. Prior to 2026.1.6, 
  2026.5.2, 2026.6.1, and 2026.7.1, on sites with category group moderation 
  enabled, the review queue could include an excerpt (and permalink) of the 
  private message attached to a flag, even when the reviewing category moderator
  was not a participant in that message. These notify_moderators flag messages 
  are addressed only to moderators and, for core flags, to a category's 
  moderation groups as they existed when the flag was raised, so a category 
  group moderator could read flag-discussion content they were not authorized to
  see. This affects official plugins that create such messages and core flags 
  raised before a moderator's group was granted moderation of the category. Only
  the confidentiality of a limited excerpt of these flag-related private 
  messages is affected; no content can be modified or deleted. This issue is 
  fixed in versions 2026.1.6, 2026.5.2, 2026.6.1, and 2026.7.1.
