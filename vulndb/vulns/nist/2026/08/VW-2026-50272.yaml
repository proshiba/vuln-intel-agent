title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio_ccw:
  Move cp cleanup out of not operational\n\nThe fsm_notoper() routine is called when
  the device has been\nlost, and is (by definition) no longer operational. Since this\n\
  can happen asynchronously from the normal behavior of the\ndriver, the cleanup may
  happen when holding other locks\nin the calling sequence (notably, the cio subchannel
  lock).\n\nPush the cleanup of the private->cp resources to a workqueue,\nwhere it
  can be done out from under that lock sequence and\na future patch can safely manage
  the locking requirements."
