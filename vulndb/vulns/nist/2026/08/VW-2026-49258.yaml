title: Grav before 2.0.16 contains an incomplete default denylist in the Twig 
  sandbox configuration that fails to block access to system configuration 
  secrets. Attackers with page-edit permission can use config.get() or 
  config.toArray() in Twig templates to retrieve sensitive values like 
  system.cache.redis.password when config_access is enabled.
