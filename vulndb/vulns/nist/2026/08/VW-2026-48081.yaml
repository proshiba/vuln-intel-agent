title: Incorrect privilege assignment in the ClickHouse connector deployment 
  template in Amazon Athena Federated Query prior to v2026.17.1 could allow an 
  authenticated remote user to read arbitrary AWS Secrets Manager secrets in the
  deploying account by pointing the connector's connection string at an 
  unrelated secret and at a database endpoint under the user's control, causing 
  the connector to transmit the secret to that endpoint. To remediate this 
  issue, users should upgrade to aws-athena-query-federation connectors version 
  v2026.17.1 or later and ensure that any forked or derivative code is patched 
  to incorporate the new fixes. Alternatively, to remediate this issue, users 
  should redeploy the connector with the current template and supply a non-empty
  SecretNamePrefix value.
