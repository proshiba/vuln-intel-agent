title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA:
  Fix use-after-free in rxe_queue_cleanup\n\nOn error handling path in rxe_qp_from_init()
  qp->sq.queue is freed and\nthen rxe_create_qp() will drop last reference to this
  object. qp clean up\nfunction will try to free this queue one time and it causes
  UAF bug.\n\nFix it by zeroing queue pointer after freeing queue in rxe_qp_from_init()."
