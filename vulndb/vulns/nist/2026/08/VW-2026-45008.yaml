title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthunderbolt:
  Prevent XDomain delayed work use-after-free on disconnect\n\ntb_xdp_handle_request()
  runs on system_wq and queues\nxd->state_work via queue_delayed_work() in three request
  handlers:\nPROPERTIES_CHANGED_REQUEST, UUID_REQUEST (via start_handshake),\nand
  LINK_STATE_CHANGE_REQUEST.  Similarly, update_xdomain() queues\nxd->properties_changed_work
  when local properties change.\n\nConcurrently, tb_xdomain_remove() calls stop_handshake()
  which does\ncancel_delayed_work_sync() on both delayed works.  Later,\ntb_xdomain_unregister()
  calls device_unregister() which eventually\nfrees the xdomain.  Since commit 559c1e1e0134
  (\"thunderbolt: Run\ntb_xdp_handle_request() in system workqueue\") moved the request\n\
  handler off tb->wq, the handler and the remove path are no longer\nserialized. \
  \ If queue_delayed_work() executes after\ncancel_delayed_work_sync() but before
  the xdomain is freed, the\ndelayed work fires on a freed object.\n\nAdd xd"
