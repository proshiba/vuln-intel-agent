title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix memory leak in ieee80211_register_hw()\n\nIf kmemdup() fails while
  copying supported band structures, the error\npath jumps to fail_rate. This skips
  rate_control_deinitialize() and\nleaks the initialized local->rate_ctrl.\n\nFix
  this by adding a fail_band label that shares the rate-control cleanup\npath before
  falling through to the remaining teardown.\n\nThe bug was first flagged by an experimental
  analysis tool we are\ndeveloping for kernel memory-management bugs while analyzing\n\
  v6.13-rc1. The tool is still under development and is not yet publicly\navailable.
  Manual inspection confirms that the bug is still present in\nv7.1-rc7.\n\nAn x86_64
  allyesconfig build showed no new warnings. As we do not have a\nsuitable mac80211
  device/driver combination to test with, no runtime\ntesting was able to be performed."
