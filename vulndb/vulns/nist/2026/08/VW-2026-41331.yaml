title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/imagination:
  acquire vm_ctx->lock before mapping memory to GPU VM\n\nThe drm gpuvm code doesn't
  protect find operation against map operation,\nand the driver needs to ensure a
  map operation shouldn't happen when a\nfind operation is in progress.\n\nIn some
  cases a find operation will be in progress when doing map/unmap\noperations, and
  the find operation will do a NULL pointer dereference.\n\nAn example of the stack
  trace of such NULL dereference is shown below:\n\n```\nUnable to handle kernel access
  to user memory without uaccess routines at\nvirtual address 0000000000000010\n\n\
  [<ffffffff01e989d4>] drm_gpuva_find+0x28/0x6c [drm_gpuvm]\n[<ffffffff01ed3a40>]
  pvr_vm_unmap+0x34/0x68 [powervr]\n[<ffffffff01ec69da>] pvr_ioctl_vm_unmap+0x2e/0x50
  [powervr]\n[<ffffffff8080ce0a>] drm_ioctl_kernel+0x8e/0xdc\n[<ffffffff8080d016>]
  drm_ioctl+0x1be/0x3e0\n[<ffffffff802bec3e>] __riscv_sys_ioctl+0xba/0xc4\n[<ffffffff80d858b2>]
  do_trap_ecall_u+0x23e/0"
