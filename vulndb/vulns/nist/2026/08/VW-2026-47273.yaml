title: Flow-Like is a platform for building end-to-end use cases. Prior to 
  version 1.0.4, `GET /api/v1/apps/{app_id}/invoke/presign` grants Azure Blob 
  Storage SAS credentials with write and delete access to app content to any app
  member that has `ExecuteEvents`, even when that member lacks `ReadFiles` and 
  `WriteFiles`. The route treats file permissions as optional after the 
  `ExecuteEvents` gate. When the caller has neither file permission, it selects 
  `CredentialsAccess::InvokeNone`. In the Azure credential provider, 
  `InvokeNone` still mints a `content_sas_token` for `apps/{app_id}` with 
  `sp=rwdl`, plus user-content and log SAS tokens. The returned shared 
  credential is enough for the low-privilege caller to directly write or delete 
  blobs under the app content prefix. Version 1.0.4 patches the issue. Flow-Like
  Studio and the hosted Flow-Like Web App are not affected. These deployments 
  use AWS-backed storage. Self-hosted deployments are only affected if they use 
  Azure Blob Storage as the storage
