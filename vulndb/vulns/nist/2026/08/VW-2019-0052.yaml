title: A vulnerability in the TCP proxy functionality for Cisco Adaptive 
  Security Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) 
  Software could allow an unauthenticated, remote attacker to cause the device 
  to restart unexpectedly, resulting in a denial of service (DoS) condition. The
  vulnerability is due to an error in TCP-based packet inspection, which could 
  cause the TCP packet to have an invalid Layer 2 (L2)-formatted header. An 
  attacker could exploit this vulnerability by sending a crafted TCP packet 
  sequence to the targeted device. A successful exploit could allow the attacker
  to cause a DoS condition.
