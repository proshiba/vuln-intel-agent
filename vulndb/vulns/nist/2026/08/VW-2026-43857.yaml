title: A vulnerability was identified in feedmob fm-mcp-servers 0.0.3. Affected 
  by this vulnerability is the function downloadReport of the file 
  src/smadex-reporting/src/index.ts of the component Download Endpoint. The 
  manipulation of the argument downloadUrl leads to server-side request forgery.
  The attack can only be performed from a local environment. The exploit is 
  publicly available and might be used. The project was informed of the problem 
  early through an issue report but has not responded yet.
