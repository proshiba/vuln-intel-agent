title: mise manages dev tools like node, python, cmake, and terraform. Prior to 
  2026.7.1, release tar archives record mise/bin/mise with user and group ID 
  1001 and packaging/standalone/install.envsubst extracts and moves it without 
  normalizing ownership, allowing a local user with those IDs to replace a 
  root-installed executable, especially when MISE_INSTALL_PATH targets a shared 
  location such as /usr/local/bin. This issue is fixed in version 2026.7.1.
