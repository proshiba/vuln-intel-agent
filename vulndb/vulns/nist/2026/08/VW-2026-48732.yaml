title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  validate metadata when processing requests\n\nThe zero-copy path validates TX metadata
  while obtaining the descriptor\ncontext, then reads it again later when preparing
  the hardware request.\nUser space can change the metadata between those operations
  and bypass the\noriginal validation.\n\nValidate the metadata in xsk_tx_metadata_request()
  and use the resulting\nflags snapshot for every feature check. Read request fields
  once so all\nzero-copy drivers process only values observed after successful\nvalidation."
