title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlocking/rt:
  Fix the incorrect RCU protection in rt_spin_unlock()\n\nrt_spin_unlock() releases
  the RCU protection before unlocking the\nlock. That opens the door for the following
  UAF scenario:\n\n T1\t\t\t\t\tT2\n spin_lock(&p->lock);\t\trcu_read_lock();\n invalidate(p);\t
  \t\tp = rcu_dereference(ptr);\n rcu_assign_pointer(ptr, NULL);\tif (!p) return;\n\
  \ spin_unlock(&p->lock);\t\tspin_lock(&p->lock)\n \t\t\t\t   lock(&lock->lock);\n\
  \t\t\t\t   rcu_read_lock();\n kfree_rcu(p);\t\t\trcu_read_unlock();\n\t\t\t\t....\n\
  \t\t\t\tspin_unlock(&p->lock)\n\t\t\t\t  rcu_read_unlock(); // Ends grace period\n\
  \ rcu_do_batch()\n   kfree(p);\n\t\t\t    UAF ->\t  rt_mutex_cmpxchg_release(&lock->lock...)\n\
  \nRegular spinlocks keep preemption disabled accross the unlock operation,\nwhich
  provides full RCU protection, but the RT substitution fails to\nresemble that. Same
  applies for the rwlock substitution.\n\nMove the rcu_read_unlock() invocation past
  the unlock operations to match\nthe non-RT semantics. T"
