  checks, allowing any authenticated user (including one holding only 
  low-privilege, read-only permissions) to execute arbitrary operating system 
  commands on the host. Successful exploitation results in code execution in the
  context of the ScadaLTS server process (root), leading to full compromise of 
  the underlying system.
