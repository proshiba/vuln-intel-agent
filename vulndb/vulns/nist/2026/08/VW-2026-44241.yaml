title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  macsec: fix use-after-free of metadata_dst on RX SC delete\n\nWhen an offloaded
  MACsec RX SC is deleted, macsec_del_rxsc_ctx() freed\nthe per-SC metadata_dst with
  metadata_dst_free(), which kfree()s the\nobject unconditionally and ignores the
  dst reference count. The RX\ndatapath in mlx5e_macsec_offload_handle_rx_skb() looks
  up the SC under\nrcu_read_lock() via xa_load(), takes a reference with dst_hold()
  and\nattaches the dst to the skb with skb_dst_set(). A reader that already\nobtained
  the rx_sc pointer can race with the delete path and operate on\nfreed memory.\n\n\
  Fix the owner side by dropping the reference with dst_release() instead\nof freeing
  unconditionally, and convert the RX datapath to\ndst_hold_safe() so a reader racing
  the SC delete cannot attach a dst\nwhose last reference was just dropped; only attach
  it when a reference\nwas actually taken.\n\nmlx5e_macsec_add_rxsc() also published
  sc_xarray_element via xa_"
