title: NLTK before 3.10.0 contains an arbitrary local file read vulnerability in
  StreamBackedCorpusView that bypasses pathsec.ENFORCE by calling 
  builtins.open() directly instead of pathsec.open(). Attackers who control the 
  fileid argument can read arbitrary local files regardless of the ENFORCE 
  setting, including sensitive system files and application credentials.
