title: 'Improper authentication in the Intel(R) TDX module for some Intel(R) platforms
  within Ring 0: Trust Domain may allow an information disclosure and escalation of
  privilege. System software adversary with a privileged user combined with a high
  complexity attack may enable escalation of privilege. This result may potentially
  occur via local access when attack requirements are present without special internal
  knowledge and requires no user interaction. The potential vulnerability may impact
  the confidentiality (high), integrity (high) and availability (none) of the vulnerable
  system, resulting in subsequent system confidentiality (low), integrity (low) and
  availability (none) impacts.'
