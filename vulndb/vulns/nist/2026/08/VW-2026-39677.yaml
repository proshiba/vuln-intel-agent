  (pkg/auth/requests/impersonate.go). An authenticated Rancher user with the default
  user\n global role can gain full administrative access to the Rancher control \n\
  plane and transitively to all downstream clusters it manages.\n\nThis issue affects
  Rancher: from 2.11.0 before 2.11.16, from 2.12.0 before 2.12.12, from 2.13.0 before
  2.13.8, and from 2.14.0 before 2.14.2."
