title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix the error handler of rfkill config\n\nWhen the core rfkill config throws
  error, it should free the\nallocated resources. Currently it is not freeing the
  core pdev\ncreate resources. Avoid this issue by calling the core pdev\ndestroy
  in the error handler of core rfkill config.\n\nFound this issue in the code review
  and it is compile tested only."
