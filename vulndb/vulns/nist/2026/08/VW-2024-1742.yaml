title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  bridge: confirm multicast packets before passing them up the stack\n\nconntrack
  nf_confirm logic cannot handle cloned skbs referencing\nthe same nf_conn entry,
  which will happen for multicast (broadcast)\nframes on bridges.\n\n Example:\n \
  \   macvlan0\n       |\n      br0\n     /  \\\n  ethX    ethY\n\n ethX (or Y) receives
  a L2 multicast or broadcast packet containing\n an IP packet, flow is not yet in
  conntrack table.\n\n 1. skb passes through bridge and fake-ip (br_netfilter)Prerouting.\n\
  \    -> skb->_nfct now references a unconfirmed entry\n 2. skb is broad/mcast packet.
  bridge now passes clones out on each bridge\n    interface.\n 3. skb gets passed
  up the stack.\n 4. In macvlan case, macvlan driver retains clone(s) of the mcast
  skb\n    and schedules a work queue to send them out on the lower devices.\n\n \
  \   The clone skb->_nfct is not a copy, it is the same entry as the\n    original
  skb.  The macvlan rx handler then returns RX"
