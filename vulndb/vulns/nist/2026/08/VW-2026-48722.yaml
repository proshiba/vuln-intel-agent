title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Disable EOP for TPA on all chips to prevent data corruption\n\nEOP (End of frame
  padding) on the AGG ring may cause overlapping of\nzero padding at the end of one
  segment with the next segment's data.\nIf Relaxed Ordering (RO) is enabled, the
  zero padding may overwrite\nvalid data in the next segment and corrupt the data.\
  \  Older chips\n(P5 and older) do not automatically disable RO when EOP is enabled.\n\
  On some ARM systems, data corruption was reported on 57508 (P5)\nchips with RO enabled.\n\
  \nAlways disable EOP on all chips on the AGG rings when TPA is enabled\nto fix the
  data corruption."
