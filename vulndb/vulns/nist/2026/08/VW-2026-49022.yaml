title: Netis NC63 firmware through V3.0.0.3327 contains a stack-based buffer 
  overflow vulnerability that allows unauthenticated remote attackers to 
  overwrite saved stack state by submitting an oversized Base64-encoded password
  to the login handler in /bin/netis.cgi. Attackers can exploit the custom 
  Base64 decoder's lack of output length validation against the fixed-size stack
  buffer to achieve remote code execution with root privileges, as the Boa web 
  server executes the CGI environment as root.
