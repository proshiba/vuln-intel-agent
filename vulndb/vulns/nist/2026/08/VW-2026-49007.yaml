title: "Improper Neutralization of Special Elements used in an OS Command in the package
  manager component of Black Duck blackduck-c-cpp before 3.0.7 allows an actor able
  to create a file within the scanned build directory to execute operating system
  commands as the account running the scan.\n\n\n\nFilesystem paths encountered while
  traversing the scanned directory are interpolated into command strings that are
  executed through a shell without quoting or escaping, so shell metacharacters within
  those paths are interpreted rather than treated as literal text. No control over
  the build command or the tool's configuration is required."
