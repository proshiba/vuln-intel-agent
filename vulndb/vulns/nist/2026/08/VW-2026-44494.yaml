title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf/x86/amd/core:
  Avoid enabling BRS from the SVM reload path\n\nBranch Sampling (BRS) and Last Branch
  Record (LBR) are mutually\nexclusive hardware features, and users of both are tracked
  via\ncpuc->lbr_users.\n\nWhen SVM is toggled on a CPU, the host perf events are
  reprogrammed to\nupdate the HostOnly filter bit (set when virtualization is enabled,\n\
  cleared when it is disabled). On PerfMonV2-capable processors, this\nreprogramming
  is performed by calling amd_pmu_enable_all() to rewrite\nthe event selectors. However,
  amd_pmu_enable_all() also calls\namd_brs_enable_all(), which enables BRS whenever
  cpuc->lbr_users > 0.\nHaving active LBR events satisfies this gating on processors
  that have\nLBR but not BRS. The kernel then tries to set the BRS enable bit in\n\
  DebugExtnCfg (MSR 0xc000010f). Since that bit is deprecated on such\nhardware, the
  write results in a #GP:\n\n  Call Trace:\n   <IRQ>\n   amd_pmu_enable_all+0x1d/0x90\n\
  \   amd_pmu_d"
