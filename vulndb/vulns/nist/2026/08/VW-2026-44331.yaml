title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix UBSAN array-index-out-of-bounds in ocfs2_sum_rightmost_rec\n\n[BUG]\nOn-disk
  corruption setting l_next_free_rec to 0 in an inode's embedded\nextent list triggers
  a UBSAN panic on the next write to that file.\n\n[CAUSE]\nocfs2_sum_rightmost_rec()
  computes\ni = le16_to_cpu(el->l_next_free_rec) - 1\nand accesses el->l_recs[i] without
  validating i. When l_next_free_rec\nis 0, i becomes -1; when l_next_free_rec exceeds
  l_count, i falls\npast the end of the array. Either case violates the\n__counted_by_le(l_count)
  annotation on l_recs[] and triggers UBSAN.\n\n[FIX]\nValidate the inode's embedded
  extent list when the inode is read, in\nocfs2_validate_inode_block(): l_count must
  be non-zero and no larger\nthan the inode block can hold, and l_next_free_rec must
  not exceed\nl_count. A corrupt list is rejected at read time, before the b-tree\n\
  code can index l_recs[] out of bounds."
