title: "The Zephyr virtio driver does not validate the descriptor-chain head id that
  the virtio device writes into the used ring. In virtio_isr() (drivers/virtio/virtio_common.c),
  the device-written vq->used->ring[idx].id is used directly as an index into vq->recv_cbs[]
  and vq->desc[], which are both allocated with exactly vq->num entries. recv_cbs[]
  holds {cb, opaque} callback entries, and the indexed callback pointer is then invoked
  as cbe.cb(cbe.opaque, used_len).\n\nBecause the id is consumed as a 16-bit value
  with no bound check, a malicious or compromised virtio backend (an untrusted hypervisor,
  or an untrusted hardware/peer-processor virtio device on a PCI or MMIO transport)
  can supply an id far beyond vq->num. This causes an out-of-bounds read of a {function
  pointer, argument} pair from heap memory beyond recv_cbs[], after which the driver
  calls that attacker-shaped pointer in the guest's interrupt context. No guest privileges
  or user interaction are required; the backend triggers it by "
