title: The Booking calendar, Appointment Booking System plugin for WordPress is 
  vulnerable to authorization bypass in all versions up to, and including, 
  3.2.36. This is due to the plugin not properly verifying that a user is 
  authorized to perform an action. This makes it possible for unauthenticated 
  attackers to mark arbitrary reservations as paid or completed, cancel 
  legitimate payments, auto-approve reservations, and trigger transactional 
  booking emails by writing attacker-supplied payment status and transaction 
  data directly into the payments table. The auto-approval of reservations is 
  only triggered when the 'enable_psuccess_approval' site option is enabled, but
  payment status manipulation and email dispatch are exploitable regardless of 
  that setting.
