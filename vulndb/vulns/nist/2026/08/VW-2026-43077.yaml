title: Apache Airflow's secrets masker did not mask `var.json` Variable values 
  whose value is a dict in the Rendered Templates UI — the dict value failed an 
  `isinstance(str)` guard — so a secret stored as a JSON Variable and referenced
  in a template via `var.json` was displayed in cleartext to any user with 
  access to that task's Rendered Templates view. Users are advised to upgrade to
  apache-airflow 3.3.1 or later, which masks nested Variable values regardless 
  of type.
