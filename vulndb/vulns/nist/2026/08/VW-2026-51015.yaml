title: "DJI drones contain an FTP service that uses hardcoded credentials shared across
  affected models and permits authenticated users to upload files without limits on
  file size, file count, or total storage consumed in **/blackbox/upgrade/**, as well
  as overwrite existing files in that directory. An attacker with access to the drone's
  internal network or USB RNDIS interface can exhaust the available storage, preventing
  the aircraft from writing flight records, logs, and telemetry and potentially preventing
  subsequent firmware updates. Uploaded files persist across reboot and factory reset.\n\
  \nAffected models are DJI Neo until 01.00.0400, DJI Neo 2 until 01.00.0500, DJI
  Flip until 01.00.1200, DJI Air 3 until 01.00.1600, DJI Air 3S until 01.00.1400,
  DJI Avata 2 until 01.00.0400, DJI Avata 360 until 01.00.0300, DJI Mavic 3 until
  01.00.1400, DJI Mavic 3 Classic until 01.00.0800, DJI Mavic 3 Pro until 01.01.0700,
  DJI Mavic 4 Pro until 01.00.0500, DJI Mini 2 until 01.07.0200, DJI Mini 3 until
  01.00"
