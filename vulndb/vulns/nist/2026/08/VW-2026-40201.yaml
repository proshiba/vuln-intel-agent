title: Dell Virtual Storage Integrator for VMware vSphere Client, versions prior
  to 10.11.1.0, contain(s) a Sensitive Information Disclosure vulnerability. An 
  unauthenticated remote attacker could potentially exploit this vulnerability, 
  leading to information disclosure and session hijacking. This vulnerability is
  considered critical as it allows an unauthenticated attacker to obtain active 
  session credentials and fully impersonate authenticated users, including 
  administrators. Dell recommends customers to upgrade at the earliest 
  opportunity.
