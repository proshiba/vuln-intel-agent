title: Unrestricted Upload of File with Dangerous Type in the product photo 
  upload in Roskus Prospero Flow CRM before 5.16.0 allows an authenticated user 
  holding the create product permission (routine Seller role) to execute 
  arbitrary JavaScript in the application origin. The photo validation rule 
  classifies the file only by its content (magic bytes) and rejects only a fixed
  list of PHP extensions, while ProductSaveController::save() names the stored 
  file using the client-supplied extension and copies it into the public web 
  root. A file that begins with an image header and carries an HTML extension 
  passes validation, is stored under public/asset/upload/product/, and is served
  with a text/html content type, turning the upload into first-party stored 
  script execution.
