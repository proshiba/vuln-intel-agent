title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  airoha: Fix DMA direction for NPU mailbox buffer\n\nairoha_npu_send_msg() always
  maps the mailbox buffer with DMA_TO_DEVICE,\nbut some callers expect the NPU to
  write response data back into the\nsame buffer:\n\n- airoha_npu_wlan_msg_get() (NPU_OP_GET):
  NPU writes response into\n  the buffer, then the caller reads it via memcpy()\n\
  - airoha_npu_ppe_stats_setup() (NPU_OP_SET): NPU writes back\n  npu_stats_addr field
  in the response\n\nOn non-cache-coherent architectures like EN7581 (Cortex-A53 without\n\
  hardware cache coherency for NPU DMA), DMA_TO_DEVICE unmap is a no-op\n— it does
  not invalidate the CPU cache. If the NPU-written cache line\nis still present in
  the CPU cache when the caller reads the buffer,\nthe CPU observes stale data instead
  of the NPU response.\n\nThis is a timing-sensitive bug: small mailbox buffers (~24
