title: Perspective 5.0.0 contains a path traversal vulnerability that allows 
  unauthenticated remote attackers to read arbitrary files from the server 
  filesystem by including literal ../ segments in HTTP request URL paths. 
  Attackers can bypass the insufficient query-string-stripping sanitization to 
  traverse outside the configured asset root directory and retrieve sensitive 
  files such as system credentials and application secrets, with results exposed
  cross-origin due to a wildcard Access-Control-Allow-Origin header set on all 
  responses.
