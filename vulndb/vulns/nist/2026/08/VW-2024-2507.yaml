title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (ibmpex) Fix possible UAF when ibmpex_register_bmc() fails\n\nSmatch report warning
  as follows:\n\ndrivers/hwmon/ibmpex.c:509 ibmpex_register_bmc() warn:\n  '&data->list'
  not removed from list\n\nIf ibmpex_find_sensors() fails in ibmpex_register_bmc(),
  data will\nbe freed, but data->list will not be removed from driver_data.bmc_data,\n\
  then list traversal may cause UAF.\n\nFix by removeing it from driver_data.bmc_data
  before free()."
