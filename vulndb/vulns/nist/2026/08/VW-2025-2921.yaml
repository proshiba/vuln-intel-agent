title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix delayed allocation bug in ext4_clu_mapped for bigalloc + inline\n\nWhen converting
  files with inline data to extents, delayed allocations\nmade on a file system created
  with both the bigalloc and inline options\ncan result in invalid extent status cache
  content, incorrect reserved\ncluster counts, kernel memory leaks, and potential
  kernel panics.\n\nWith bigalloc, the code that determines whether a block must be\n\
  delayed allocated searches the extent tree to see if that block maps\nto a previously
  allocated cluster.  If not, the block is delayed\nallocated, and otherwise, it isn't.\
  \  However, if the inline option is\nalso used, and if the file containing the block
  is marked as able to\nstore data inline, there isn't a valid extent tree associated
  with\nthe file.  The current code in ext4_clu_mapped() calls\next4_find_extent()
  to search the non-existent tree for a previously\nallocated cluster anyway, which
  typically finds n"
