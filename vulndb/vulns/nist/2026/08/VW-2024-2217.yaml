title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  make cow_file_range_inline() honor locked_page on error\n\nThe btrfs buffered write
  path runs through __extent_writepage() which\nhas some tricky return value handling
  for writepage_delalloc().\nSpecifically, when that returns 1, we exit, but for other
  return values\nwe continue and end up calling btrfs_folio_end_all_writers(). If
  the\nfolio has been unlocked (note that we check the PageLocked bit at the\nstart
  of __extent_writepage()), this results in an assert panic like\nthis one from syzbot:\n\
  \n  BTRFS: error (device loop0 state EAL) in free_log_tree:3267: errno=-5 IO failure\n\
  \  BTRFS warning (device loop0 state EAL): Skipping commit of aborted transaction.\n\
  \  BTRFS: error (device loop0 state EAL) in cleanup_transaction:2018: errno=-5 IO
  failure\n  assertion failed: folio_test_locked(folio), in fs/btrfs/subpage.c:871\n\
  \  ------------[ cut here ]------------\n  kernel BUG at fs/btrfs/subpage.c:871!\n\
  \  Oops: invalid opcode: 0"
