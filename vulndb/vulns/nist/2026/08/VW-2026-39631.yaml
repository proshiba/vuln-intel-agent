title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  p54: validate RX frame length in p54_rx_eeprom_readback()\n\np54_rx_eeprom_readback()
  copies the requested EEPROM slice out of a\ndevice-supplied readback frame without
  checking that the skb actually holds\nthat many bytes. Commit da1b9a55ff11 (\"wifi:
  p54: prevent buffer-overflow in\np54_rx_eeprom_readback()\") closed the destination
  overflow by copying a\nfixed priv->eeprom_slice_size (and rejecting a mismatched
  advertised len),\nbut the source side is still unbounded: nothing verifies the frame
  is long\nenough to supply that many bytes.\n\nA malicious USB device can send a
  short frame whose advertised len matches\npriv->eeprom_slice_size while the payload
  is truncated. The equality check\npasses and memcpy() reads past the end of the
  skb, leaking adjacent heap:\n\n  BUG: KASAN: slab-out-of-bounds in p54_rx (drivers/net/wireless/intersil/p54/txrx.c:507)\n\
  \  Read of size 1016 at addr ffff88800f077114 by task swapper/0/0\n  Call T"
