title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: Correct data type for scan index to avoid infinite loop\n\nA kernel soft
  lockup was observed during Wi-Fi scanning on the 6GHz band.\nThe CPU becomes stuck
  in rtw89_hw_scan_add_chan_ax for over 20 seconds,\nleading to a system panic.\n\n\
  RIP points to 0f b6 c3 (movzbl %bl, %eax), which zero-extends\nthe low 8 bits of
  RBX into RAX.\nRBX (the counter i) has reached a huge value: 0x137466a1.\n\n  watchdog:
  BUG: soft lockup - CPU#2 stuck for 26s! [kworker/u16:4:6124]\n  Workqueue: events_unbound
