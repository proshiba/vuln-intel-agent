title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  enetc: fix potential divide-by-zero when num_vsi is zero\n\nFor i.MX94 series, all
  the standalone ENETCs do not support SR-IOV, so\npf->caps.num_vsi is zero. This
  leads to a divide-by-zero in\nenetc4_default_rings_allocation() when distributing
  rings among PF and\nVFs.\n\nDivision by zero is undefined behavior in C. On ARM64,
  the UDIV/SDIV\ninstructions silently return zero rather than raising an exception,
  so\nthe issue does not cause a visible crash. However, relying on this\nbehavior
  is incorrect and poses a cross-platform compatibility risk.\n\nAdd an explicit check
  for num_vsi == 0 and return early after the PF's\nrings have been configured."
