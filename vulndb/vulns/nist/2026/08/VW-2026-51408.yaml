title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp - Treat zero-length cert chain as query for blob lengths\n\nWhen handling a
  PDH export, treat a zero-length userspace cert chain buffer\nas a request to query
  the length of the relevant blobs.  Failure to account\nfor the zero-length buffer
  trips a BUG_ON() when running with\nCONFIG_DEBUG_VIRTUAL=y due to trying to get
  the physical address of the\nZERO_SIZE_PTR (returned by kzalloc() on the bogus allocation).\n\
