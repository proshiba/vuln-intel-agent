title: "Affected versions of cti-transmute fail to apply comment-level access-control
  rules when generating evaluation report exports. Although normal comment retrieval
  filters comments according to conversion visibility, comment privacy, ownership,
  authorship, and administrative privileges, build_evaluation_report() previously
  included all evaluation comments without applying those rules.\n\n\nConsequently,
  a user who was authorized to view a conversion could export its evaluation report
  as Markdown or PDF and obtain private evaluation comments that should only have
  been visible to the conversion owner, the comment author, or an administrator. The
  leaked report data also contained the comment author's name. The fix passes the
  requesting user into the report builder and filters every evaluation comment using
  the shared access.can_see_comment() authorization function."
