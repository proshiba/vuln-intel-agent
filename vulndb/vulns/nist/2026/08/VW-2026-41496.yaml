title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/mad:
  Drop unmatched RMPP responses before reassembly\n\nKernel-handled RMPP receive processing
  starts reassembly for active\nDATA responses before the response is matched to an
  outstanding send.\nThe normal match happens later, after ib_process_rmpp_recv_wc()
  has\neither assembled a complete message or consumed the segment.\n\nThat ordering
  lets an unsolicited response that routes to a kernel\nRMPP agent by the high TID
  bits allocate or extend RMPP receive state\nbefore the full TID and source address
  are checked against a real\nrequest. A reordered burst can therefore reach the receive-side\n\
