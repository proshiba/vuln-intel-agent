title: "In the Linux kernel, the following vulnerability has been resolved:\n\nSUNRPC:
  Fix UAF in svc_tcp_listen_data_ready()\n\nAfter the listener svc_sock is freed,
  and before invoking svc_tcp_accept()\nfor the established child sock, there is a
  window that the newsock\nretaining a freed listener svc_sock in sk_user_data which
  cloning from\nparent. In the race window, if data is received on the newsock, we
  will\nobserve use-after-free report in svc_tcp_listen_data_ready().\n\nReproduce
  by two tasks:\n\n1. while :; do rpc.nfsd 0 ; rpc.nfsd; done\n2. while :; do echo
  \"\" | ncat -4 127.0.0.1 2049 ; done\n\nKASAN report:\n\n  ==================================================================\n\
  \  BUG: KASAN: slab-use-after-free in svc_tcp_listen_data_ready+0x1cf/0x1f0 [sunrpc]\n\
  \  Read of size 8 at addr ffff888139d96228 by task nc/102553\n  CPU: 7 PID: 102553
  Comm: nc Not tainted 6.3.0+ #18\n  Hardware name: VMware, Inc. VMware Virtual Platform/440BX
  Desktop Reference Platform, BIOS 6.00 11/12/2020\n  Call Trace:\n   <IRQ"
