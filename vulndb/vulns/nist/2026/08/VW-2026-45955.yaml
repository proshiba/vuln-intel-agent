title: A flaw was found in the submariner-operator component. The 
  `submariner-k8s-broker-cluster` Role, which is assigned to joined clusters, 
  possesses excessive permissions. This allows a compromised cluster to alter 
  network configurations, specifically by overwriting other clusters' endpoint 
  information. Consequently, an attacker can redirect inter-cluster tunnel 
  traffic, enabling a Man-in-the-Middle (MITM) attack across the entire cluster 
  mesh.
