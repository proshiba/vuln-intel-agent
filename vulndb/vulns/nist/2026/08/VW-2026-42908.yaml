title: "The Intel ALH digital-audio-interface driver function dai_alh_get_properties()
  in drivers/dai/intel/alh/alh.c used a caller-supplied int stream_id with no range
  validation. The value indexes the fixed-size static const uint8_t alh_handshake_map[64]
  array and scales a FIFO register address, so an out-of-range stream_id produces
  an out-of-bounds read of one byte at an attacker-chosen signed offset from the array.
  That byte is written into prop->dma_hs_id and the resulting struct dai_properties
  is copied back to the caller, leaking it.\n\ndai_get_properties_copy() is a Zephyr
  __syscall, and its verifier z_vrfy_dai_get_properties_copy() (drivers/dai/dai_handlers.c)
  validates only the device-object permission and the destination buffer, not stream_id.
  A user-mode thread that has been granted access to the ALH DAI device object can
  therefore call the syscall with an arbitrary stream_id, crossing the userspace/kernel
  sandbox boundary.\n\nThe impact is a one-byte-per-call arbitrary-offset kernel i"
