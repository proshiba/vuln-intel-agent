title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: ensure no dangling hcon references in iso_conn\n\nAfter iso_conn_del(), ISO
  sockets should not dereference the hcon any\nmore.  Currently, clearing iso_conn::hcon
  relies on iso_conn_del()\nreleasing the last reference to the iso_conn.\n\nSimplify
  this by explicitly clearing conn->hcon in iso_conn_del(), to\navoid more complex
  reasoning on races about who holds the last\nreference."
