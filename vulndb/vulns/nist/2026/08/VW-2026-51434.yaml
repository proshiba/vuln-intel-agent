title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  imx: Fix slave registration race and error handling\n\nIn i2c_imx_reg_slave(), the
  slave pointer was assigned before\npm_runtime_resume_and_get().  If pm_runtime_resume_and_get()
  failed,\nthe error path returned without clearing i2c_imx->slave, leaving it\nnon-NULL
  and causing all subsequent registration attempts to fail\nwith -EBUSY.\n\nAdditionally,
  because this driver uses a shared IRQ, the interrupt\nhandler i2c_imx_isr() can
  execute concurrently and, after acquiring\nslave_lock, dereference i2c_imx->slave.\
  \  The previous fix attempt\nadded a lockless i2c_imx->slave = NULL on the error
  path, but that\ncould race with the ISR under the lock and still cause a NULL pointer\n\
  dereference.\n\nFix both issues by deferring the assignment of i2c_imx->slave and\n\
  i2c_imx->last_slave_event to after a successful resume, and by\nperforming the assignment
  inside the slave_lock critical section.\nThis guarantees that the slave pointer
  is never"
