title: ArcadeDB before 26.7.2 (arcadedb-engine) allows trigger scripts to look 
  up host classes in java.lang.* (via Java.type) because ScriptTriggerExecutor 
  adds java.lang.* to the allowed packages. An authenticated user with 
  UPDATE_SCHEMA permission can create a JavaScript trigger that invokes 
  java.lang.Runtime.getRuntime().exec() (or ProcessBuilder), achieving OS 
  command execution when the trigger fires.
