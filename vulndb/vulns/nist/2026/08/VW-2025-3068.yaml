title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  hisi_sas: Grab sas_dev lock when traversing the members of sas_dev.list\n\nWhen
  freeing slots in function slot_complete_v3_hw(), it is possible that\nsas_dev.list
  is being traversed elsewhere, and it may trigger a NULL\npointer exception, such
  as follows:\n\n==>cq thread                    ==>scsi_eh_6\n\n                \
  \                ==>scsi_error_handler()\n\t\t\t\t  ==>sas_eh_handle_sas_errors()\n\
  \t\t\t\t    ==>sas_scsi_find_task()\n\t\t\t\t      ==>lldd_abort_task()\n==>slot_complete_v3_hw()\
  \              ==>hisi_sas_abort_task()\n  ==>hisi_sas_slot_task_free()\t      \
  \  ==>dereg_device_v3_hw()\n    ==>list_del_init()        \t\t  ==>list_for_each_entry_safe()\n\
  \n[ 7165.434918] sas: Enter sas_scsi_recover_host busy: 32 failed: 32\n[ 7165.434926]
  sas: trying to find task 0x00000000769b5ba5\n[ 7165.434927] sas: sas_scsi_find_task:
  aborting task 0x00000000769b5ba5\n[ 7165.434940] hisi_sas_v3_hw 0000:b4:02.0: slot
  complete: task(00000000769b5ba5"
