title: A flaw was found in libkcapi. When performing one-shot symmetric cipher 
  operations on large inputs (over 64 KiB) in stateful modes such as Counter 
  (CTR) or Cipher Block Chaining (CBC), the library improperly reuses the 
  Initialization Vector (IV) for each internal data chunk. A remote attacker 
  could potentially exploit this by making an application that uses libkcapi 
  process specially crafted large inputs. This can lead to a significant 
  weakening of data confidentiality, as the repeated IV use can expose 
  relationships in encrypted plaintext, and may also affect data integrity by 
  causing incorrect cryptographic processing.
