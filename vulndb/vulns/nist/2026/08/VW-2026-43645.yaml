title: "Form::Processor::Field::HtmlArea versions from 0.06 through 1.162360 for Perl
  allow attacker selected method dispatch and resource exhaustion via an HTML::Tidy
  diagnostic that validate passes to add_error as a Locale::Maketext template.\n\n\
  validate runs HTML::Tidy over the submitted markup and passes each resulting message
  to add_error as its first argument, which add_error hands to the language handle
  as the Locale::Maketext message key. The default handle's lexicon sets `_AUTO`,
  so a message that is not a lexicon entry is compiled as a bracket notation template
  instead of being looked up. Tidy diagnostics quote the offending attribute name
  or value, so a bracket group in the submitted markup reaches the template position,
  where the first token of the group names a method called on the language handle
  and the remaining tokens are its arguments. A group such as `[0]` makes the compile
  croak, and neither the field nor the handle catches it, so the exception leaves
