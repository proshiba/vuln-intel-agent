title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  Fix leak of SQ timestamp buffer on teardown\n\nThe send-queue timestamp ring is
  allocated with qmem_alloc() when\ntimestamping is used, but otx2_free_sq_res() never
  freed sq->timestamps,\nleaking that memory across ifdown and device removal.  Add
  the missing\nqmem_free() alongside the other SQ companion buffers."
