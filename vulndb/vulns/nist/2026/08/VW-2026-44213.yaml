title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix stack buffer overflow in multichannel session-key copy\n\nCommit 4b706360ffb7
  (\"ksmbd: fix multichannel binding and enforce channel\nlimit\") moved the binding-path
  session key out of the session-wide\nsess->sess_key (CIFS_KEY_SIZE = 40) into a
  new per-channel buffer, and\nsized both that buffer and the on-stack copy used during
  binding with\nSMB2_NTLMV2_SESSKEY_SIZE (16):\n\n\tstruct channel {\n\t\tchar\tsess_key[SMB2_NTLMV2_SESSKEY_SIZE];\t
  /* 16 */\n\t\t...\n\t};\n\n\tntlm_authenticate() / krb5_authenticate():\n\t\tchar
  channel_key[SMB2_NTLMV2_SESSKEY_SIZE] = {};\t/* 16 */\n\t\tchar *auth_key = conn->binding
  ? channel_key : sess->sess_key;\n\nThe two writers that fill this destination still
  bound the copy length\nagainst CIFS_KEY_SIZE (40), not against the 16-byte buffer:\n\
  \n\tksmbd_decode_ntlmssp_auth_blob() (NTLM key exchange):\n\t\tif (sess_key_len
  > CIFS_KEY_SIZE)\t/* 40 */\n\t\t\treturn -EINVAL;\n\t\tarc4_crypt(ctx_arc4, sess_key,\n\
  \t\t\t   (char *)a"
