title: OpenCode Studio before 2.4.4 contains a missing authentication 
  vulnerability that allows unauthenticated remote attackers to read arbitrary 
  files within the temp and static/music directories by directly accessing the 
  GET /api/tmp/:tmpFile and GET /api/music/:fileName endpoints. Attackers can 
  retrieve intermediate audio, video artifacts, and subtitles belonging to other
  users' jobs, and additionally delete any video by ID through the 
  unauthenticated DELETE /api/short-video/:videoId endpoint.
