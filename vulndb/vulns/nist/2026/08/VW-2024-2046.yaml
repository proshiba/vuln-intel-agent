title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrpmsg:
  char: Fix race between the release of rpmsg_ctrldev and cdev\n\nstruct rpmsg_ctrldev
  contains a struct cdev. The current code frees\nthe rpmsg_ctrldev struct in rpmsg_ctrldev_release_device(),
  but the\ncdev is a managed object, therefore its release is not predictable\nand
  the rpmsg_ctrldev could be freed before the cdev is entirely\nreleased, as in the
