title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  reserve space for inline xattr before attaching reflink tree\n\nOne of our customers
  reported a crash and a corrupted ocfs2 filesystem. \nThe crash was due to the detection
  of corruption.  Upon troubleshooting,\nthe fsck -fn output showed the below corruption\n\
  \n[EXTENT_LIST_FREE] Extent list in owner 33080590 claims 230 as the next free chain
  record,\nbut fsck believes the largest valid value is 227.  Clamp the next record
  value? n\n\nThe stat output from the debugfs.ocfs2 showed the following corruption\n\
  where the \"Next Free Rec:\" had overshot the \"Count:\" in the root metadata\n\
  block.\n\n        Inode: 33080590   Mode: 0640   Generation: 2619713622 (0x9c25a856)\n\
  \        FS Generation: 904309833 (0x35e6ac49)\n        CRC32: 00000000   ECC: 0000\n\
  \        Type: Regular   Attr: 0x0   Flags: Valid\n        Dynamic Features: (0x16)
  HasXattr InlineXattr Refcounted\n        Extended Attributes Block: 0  Extended
  Attributes Inline Size"
