title: "The DHCPv4 client helper net_dhcpv4_msg_type_name() in subsys/net/lib/dhcpv4/dhcpv4.c
  indexes a static 8-element const char * name table after a faulty bounds check.
  The guard used msg_type <= sizeof(name) instead of msg_type <= ARRAY_SIZE(name);
  sizeof returns the byte size of the pointer array (32 on 32-bit, 64 on 64-bit targets)
  rather than the element count of 8, so message-type values from 9 up to that byte
  size pass the check and cause name[msg_type - 1] to read past the end of the array.\n\
  \nThe msg_type value originates from the DHCP MESSAGE TYPE option, which is read
  as an unchecked raw byte from a received packet (net_pkt_read_u8) and passed unmodified
  into the lookup. A DHCP server, or any host able to inject a spoofed DHCP reply
  onto the client's link, can therefore drive the index out of bounds. The out-of-range
  slot yields a garbage const char * that is then dereferenced by a %s log conversion.\n\
