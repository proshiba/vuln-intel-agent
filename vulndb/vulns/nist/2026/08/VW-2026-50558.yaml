title: Stomper 5e2741e is vulnerable to Use-After-Free. When a client sends 
  multiple CONNECT frames on the same TCP connection, and subsequently another 
  client (or a later connection) sends SEND frames to a destination previously 
  subscribed on that connection, the broker may dereference a pointer to a 
  StompStreamSocket object that has already been freed. This results in a heap 
  use-after-free and process crash. Because the protocol does not authenticate 
  or restrict such sequences by default.
