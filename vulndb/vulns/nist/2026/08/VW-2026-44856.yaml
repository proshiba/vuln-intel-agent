title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Clear Present bit before tearing down scalable-mode context entry\n\ndevice_pasid_table_teardown()
  zeroes the 128-bit scalable-mode context\nentry with context_clear_entry() while
  the Present bit is still set. This\ncreates a window where the hardware can fetch
  a torn entry, with some\nfields already zeroed while Present is still set, leading
  to unpredictable\nbehavior or spurious faults. The context-cache invalidation is
  issued only\nafter the entry has been zeroed, and intel_pasid_free_table() then
  frees\nthe PASID directory pages, so the IOMMU can keep walking a stale Present=1\n\
  entry that points at freed memory.\n\nWhile x86 provides strong write ordering,
  the compiler may reorder the two\n64-bit writes to the entry, and the hardware fetch
  is not guaranteed to be\natomic with respect to multiple CPU writes.\n\nCommit c1e4f1dccbe9d
