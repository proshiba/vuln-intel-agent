title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  preserve pmd_swp_uffd_wp on device-private PMD downgrade\n\nchange_non_present_huge_pmd()
  rewrites a writable device-private PMD swap\nentry into a readable one without carrying
  pmd_swp_uffd_wp() across.  The\nPTE-level change_softleaf_pte() does this correctly;
  mirror that here,\nmatching what copy_huge_pmd() does for the fork path.  Without
  the carry,\na plain mprotect() over a UFFD_WP-marked device-private THP strips the
  bit\nand the trap is bypassed on swap-in."
