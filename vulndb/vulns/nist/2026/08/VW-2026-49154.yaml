title: The guard checker in Rocq Prover treats a parameter of a nested mutual 
  fixpoint as uniform without examining calls between the different bodies of 
  that fixpoint. find_uniform_parameters in kernel/inductive.ml inspects only 
  self-recursive calls, so when no body calls itself the function concludes that
  every parameter is uniform. A parameter that grows through a cross-call from 
  one body to another therefore keeps the subterm specification it inherited 
  from the enclosing fixpoint, and a recursive call guarded by that 
  specification is accepted although the argument is not structurally smaller. A
  non-terminating definition is admitted as structurally decreasing, which 
  yields a term whose value equals its own successor and so a proof of False, 
  from which any proposition follows. The proof requires no axioms, plugins or 
  unsafe flags and Print Assumptions reports it as closed under the global 
  context. Introduced in Coq 8.20 and fixed in Rocq 9.2.0.
