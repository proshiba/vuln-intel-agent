title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKEYS:
  trusted: dcp: fix improper sg use with CONFIG_VMAP_STACK=y\n\nWith vmalloc stack
  addresses enabled (CONFIG_VMAP_STACK=y) DCP trusted\nkeys can crash during en- and
  decryption of the blob encryption key via\nthe DCP crypto driver. This is caused
  by improperly using sg_init_one()\nwith vmalloc'd stack buffers (plain_key_blob).\n\
  \nFix this by always using kmalloc() for buffers we give to the DCP crypto\ndriver."
