title: A security flaw has been discovered in Linux Foundation Magma 1.9.0. This
  impacts an unknown function of the component NGSetupRequest Handler. 
  Performing a manipulation of the argument NG-IoT-DefaultPagingDRX results in 
  improper input validation. Remote exploitation of the attack is possible. The 
  exploit has been released to the public and may be used for attacks. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
