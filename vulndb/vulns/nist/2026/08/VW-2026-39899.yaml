title: 'BMC FootPrints ITSM versions 20.20.02 through 20.24.01.001 contain an authentication
  bypass vulnerability due to improper enforcement of security filters on restricted
  REST API endpoints and servlets. Unauthenticated remote attackers can bypass access
  controls to invoke restricted functionality and gain unauthorized access to application
  data and modify system resources. The following hotfixes remediate the vulnerability:
  20.20.02, 20.20.03.002, 20.21.01.001, 20.21.02.002, 20.22.01, 20.22.01.001, 20.23.01,
