title: The endpoint ‘/ws/apiprensa/getVideoUltimasSeccion’ contains an SQL 
  injection vulnerability in the id_seccion parameter. The parameter is directly
  embedded in a complex SQL query that includes grouping and sorting operations.
  By injecting SQL syntax, an attacker can disrupt the query structure and cause
  database errors, exposing the internal logic of the queries. The complexity of
  the query increases the potential impact, as it could allow for broader 
  manipulation of the content retrieval logic.
