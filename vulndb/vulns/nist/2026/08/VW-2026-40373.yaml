title: A flaw was found in Epiphany. An issue in how the browser reads web 
  addresses allows attackers to fake the domain name shown in the address bar. 
  If a user clicks a specially crafted link containing a colon (for example, 
  [https://trusted.com:80@attacker.com/](https://trusted.com:80@attacker.com/)),
  the address bar and security menus will display the safe website (trusted.com)
  but it will actually load the attacker website (attacker.com) on the screen. 
  This allows attackers to create convincing phishing pages to trick users into 
  trusting a malicious site.
