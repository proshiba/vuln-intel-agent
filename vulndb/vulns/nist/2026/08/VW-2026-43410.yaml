title: GitPython before 3.1.54 contains an incomplete denylist in 
  unsafe_git_clone_options that omits --template, allowing attackers to achieve 
  arbitrary command execution during clone operations. Attackers can supply 
  --template pointing to a directory containing malicious post-checkout hooks 
  that execute when git clones the repository.
