title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpu:
  host1x: Fix iommu_map_sgtable() return value check\n\nCommit \"iommu: return full
  error code from iommu_map_sg[_atomic]()\"\nchanged iommu_map_sgtable() to return
  an ssize_t and negative values\nin error cases, rather than a size_t and a zero.\n\
  \npin_job() also was incorrectly assigning to 'int', which could cause\noverflows
  into negative values.\n\nUpdate pin_job() to correctly check for errors from iommu_map_sgtable."
