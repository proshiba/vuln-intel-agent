title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Fix divide-by-zero in calculate_mcache_setting on zero viewport\n\nIf a plane reaches
  calculate_mcache_setting with a zero-area viewport,\ncalculate_mcache_setting exits
  early with num_mcaches == 0 and\nmvmpg_width/height == 0. This will cause a divide-by-zero
  panic and can\nalso cause an underflow on num_mcaches.\n\nFix this by changing calculate_mcache_setting
  to bool and adding guards\nafter each calculate_mcache_row_bytes call. If num_mcaches
  or\nmvmpg_width/height is zero, return a false. Callers will propagate the\nfailure
  as a rejected mode, which prevents the panic.\n\n(cherry picked from commit 29c0f7c655f47bcbd575ff75e58480df6ec3c9da)"
