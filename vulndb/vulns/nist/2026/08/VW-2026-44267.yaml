title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm-verity:
  fix buffer overflow in FEC calculation\n\nThere's a buffer overflow in dm-verity-fec:\n\
  \nif (neras && *neras <= v->fec->roots)\n\tfio->erasures[(*neras)++] = i;\n\nThis
  allows *neras to reach roots + 1 (the post-increment pushes it past\nroots). This
  value is then passed as no_eras to decode_rs8(). Inside the\nRS decoder (lib/reed_solomon/decode_rs.c:113-121),
  the erasure locator\npolynomial loop writes lambda[j] where j can reach nroots +
  1 — one\nelement past the end of lambda[] (which is sized nroots + 1, valid\nindices
  0..nroots). The out-of-bounds write lands on syn[0], corrupting\nthe syndrome buffer."
