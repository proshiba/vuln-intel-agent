title: Dolibarr before 24.0.0 contains a SQL injection vulnerability in the 
  users REST API that allows authenticated attackers with user-read rights to 
  extract sensitive data by splicing unsanitized filter parameters into SQL 
  WHERE clauses without column restrictions. Attackers can perform binary search
  on numeric fields and LIKE prefix iteration on string fields to recover salary
  figures and password verifiers omitted from normal API responses, while raw 
  database error messages in the same endpoint enable column name enumeration.
