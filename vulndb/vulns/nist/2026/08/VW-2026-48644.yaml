title: "In the Linux kernel, the following vulnerability has been resolved:\n\novl:
  don't warn when the mount is completed from another user namespace\n\nfsopen() records
  the caller's user namespace in fc->user_ns and hands\nback an ordinary file descriptor.
  Nothing ties the task that calls\nfsconfig(FSCONFIG_CMD_CREATE) to the task that
  created the context. The\nfd is inherited across fork() and exec() and it can be
  passed over a\nunix socket.\n\nCompleting a context from another user namespace
  is allowed on purpose.\nvfs_cmd_create() authorizes the create with mount_capable(),
  which for\nFS_USERNS_MOUNT checks ns_capable(fc->user_ns, CAP_SYS_ADMIN), and that\n\
  succeeds for a task holding CAP_SYS_ADMIN in an ancestor of fc->user_ns.\nSo an
  unprivileged task can reach the WARN_ON() in ovl_fill_super():\ncreate a user and
  a mount namespace in a child, call fsopen(\"overlay\")\nthere, send the fscontext
  fd to the parent and let the parent issue\nFSCONFIG_CMD_CREATE. Both namespaces
  come from a plain unshare(1) and "
