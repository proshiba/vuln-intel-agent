title: Krayin CRM before 2.2.4 contains a blind SQL injection vulnerability in 
  the leads DataGrid that allows authenticated users with leads access to inject
  arbitrary SQL into a HAVING clause by manipulating the rotten_lead[in] query 
  parameter, which is concatenated without parameterized binding directly into a
  havingRaw() call in LeadDataGrid.php. Attackers can exploit this flaw using 
  time-based and boolean-based blind injection techniques to extract the entire 
  database contents, including user credential hashes, CRM records, and 
  application configuration data.
