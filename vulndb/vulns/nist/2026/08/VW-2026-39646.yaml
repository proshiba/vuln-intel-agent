title: The AI Chatbot & Workflow Automation by AIWU plugin for WordPress is 
  vulnerable to Sensitive Information Exposure in all versions up to, and 
  including, 1.4.6. This is due to the `getCurrentTaskResults()` method in 
  `modules/workspace/controller.php` being accessible without authentication or 
  authorization checks. The method is not included in the workspace controller's
  `getNoncedMethods()` array, the base `getPermissions()` returns an empty 
  array, and all AJAX actions are registered with `wp_ajax_nopriv_` hooks 
  (`classes/frame.php:282`). When tasks are created via features like the Bulk 
  Post Generator, the task parameters — including the OpenAI API key in 
  plaintext, AI prompts, keywords, and full AI model configuration — are stored 
  in the database and returned in the JSON response. This makes it possible for 
  unauthenticated attackers to enumerate sequential task IDs and retrieve 
  sensitive configuration data including API keys.
