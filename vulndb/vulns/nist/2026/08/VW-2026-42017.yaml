title: A broken access control vulnerability in Peppermint Lab Peppermint 
  through commit ba6e217 exists because the Config.roles_active flag defaults to
  false, causing all permission checks on ticket, client, and user handlers to 
  behave as no-ops on default installations. All authenticated users bypass 
  ownership and administrative access controls. An attacker with any user 
  account can read, modify, or delete tickets, clients, and users belonging to 
  any other account.
