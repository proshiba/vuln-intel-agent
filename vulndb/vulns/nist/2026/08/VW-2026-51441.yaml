title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/util:
  don't read __page_2 for order-1 folios in snapshot_page()\n\nsnapshot_page() currently
  reads __page_2 after checking nr_pages > 1, but\nit should only do so when nr_pages
  > 2.\n\nIf an order-1 folio is allocated at the end of a vmemmap section,\n__page_2
  will not exist and reading it will cause a fault.\n\nDuring DLPAR memory remove
  on a 22 TB ppc64le LPAR, snapshot_page() oopsed\non the page isolation path while
  reading an order-1 folio's __page_2 from\nan adjacent absent section (unmapped vmemmap).\n\
  \nFix this to avoid reading memmap that doesn't exist (e.g., a vmemmap\nhole)."
