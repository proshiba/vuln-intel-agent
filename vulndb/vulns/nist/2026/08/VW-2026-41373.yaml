title: "In the Linux kernel, the following vulnerability has been resolved:\n\namt:
  re-read skb header pointers after every pull\n\nSeveral AMT receive and transmit
  paths cache a pointer into the skb head\n(ip_hdr(), ipv6_hdr(), eth_hdr() or the
  AMT message header) and then call\na helper that can reallocate that head before
  the cached pointer is used\nagain.  pskb_may_pull(), ip_mc_may_pull(), ipv6_mc_may_pull(),\n\
  iptunnel_pull_header(), ip_mc_check_igmp() and ipv6_mc_check_mld() can all\nfree
  the old head and move the data, so a pointer taken before the call\ndangles afterwards
  and the later access is a use-after-free of the freed\nhead.\n\nThe affected sites
  are:\n\n  amt_rcv() caches ip_hdr() before amt_parse_type() pulls, then reads\n\
  \  iph->saddr.\n\n  amt_dev_xmit() caches ip_hdr()/ipv6_hdr() before ip_mc_check_igmp()/\n\
  \  ipv6_mc_check_mld() and pskb_may_pull(), then reads the group address.\n\n  amt_multicast_data_handler()
  caches eth_hdr() before pskb_may_pull(),\n  then writes the L2 header.\n\n  amt_members"
