title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  Free BPID bitmap on setup failure\n\nnix_setup_bpids() allocates bp->bpids with
  rvu_alloc_bitmap(), which uses\na plain kcalloc(). If any of the following devm_kcalloc()
  allocations for\nthe BPID mapping arrays fails, the function returns without freeing
  the\nbitmap. Free the BPID bitmap before returning from those error paths."
