title: A broken access control vulnerability in BadChoice Handesk as of 
  2026-07-10 allows any authenticated agent to overwrite lead records belonging 
  to other teams via the LeadsController@update endpoint. The endpoint performs 
  no authorization check, and the Lead model has guarded set to an empty array 
  making all columns mass-assignable. An attacker with any agent account can 
  corrupt lead data across team boundaries.
