title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Fix missing dirty page tracking in {pte,pmd}_wrprotect()\n\nWhen hardware page table
  walker (PTW) is enabled on LoongArch, the CPU\nmay set _PAGE_DIRTY directly in the
  page table entry during a write TLB\nmiss, without going through the software TLB
  store handler. The software\nTLB store handler (tlbex.S:254) sets both _PAGE_DIRTY
  and_PAGE_MODIFIED\ntogether:\n\n    ori t0, t0, (_PAGE_VALID | _PAGE_DIRTY | _PAGE_MODIFIED)\n\
  \nSince hardware PTW only sets _PAGE_DIRTY, the software-only bit, i.e.\n_PAGE_MODIFIED
  is left unchanged. This creates a window where a PTE has\n_PAGE_DIRTY set (hardware
  knows the page is dirty) but _PAGE_MODIFIED\nclear (software is unaware).\n\nWhen
  fork()/clone() triggers copy-on-write, __copy_present_ptes() calls\npte_wrprotect(),
