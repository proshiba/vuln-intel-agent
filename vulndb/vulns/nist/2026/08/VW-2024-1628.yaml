title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncfg80211:
  call cfg80211_stop_ap when switch from P2P_GO type\n\nIf the userspace tools switch
  from NL80211_IFTYPE_P2P_GO to\nNL80211_IFTYPE_ADHOC via send_msg(NL80211_CMD_SET_INTERFACE),
  it\ndoes not call the cleanup cfg80211_stop_ap(), this leads to the\ninitialization
  of in-use data. For example, this path re-init the\nsdata->assigned_chanctx_list
  while it is still an element of\nassigned_vifs list, and makes that linked list
  corrupt."
