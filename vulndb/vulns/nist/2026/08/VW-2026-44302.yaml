title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  uniphier: Fix completion initialization order before devm_request_irq()\n\nThe driver
  calls devm_request_irq() before initializing the completion\nused by the interrupt
  handler. Because the interrupt may occur immediately\nafter devm_request_irq(),
  the handler may execute before init_completion().\n\nThis may result in calling
  complete() on an uninitialized completion,\ncausing undefined behavior. This has
  been observed with KASAN.\n\nFix this by initializing the completion before registering
  the IRQ."
