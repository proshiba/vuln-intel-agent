title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: ax88179_178a: fix skb leak in ax88179_tx_fixup()\n\nWhen the interface has
  NETIF_F_SG enabled and skb_linearize() fails in\nax88179_tx_fixup(), the function
  returns NULL without freeing the skb.\n\nusbnet_start_xmit() treats a NULL return
  from tx_fixup() as a drop\n(info->flags does not set FLAG_MULTI_PACKET for this
  driver), jumping\nto the \"drop\" label where it does `if (skb) dev_kfree_skb_any(skb)`.\n\
  Because tx_fixup() returned NULL, the local skb variable in\nusbnet_start_xmit()
  is NULL, so the original skb is never freed — a\nmemory leak on every TX frame whose
  linearization fails (i.e. under\nmemory pressure).\n\nFree the skb before returning,
  matching the error handling already used\nfor the pskb_expand_head() failure path
  in the same function."
