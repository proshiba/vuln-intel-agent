title: TypeBot is a chatbot builder tool. Versions prior to 3.17.0 allow a 
  low-privilege guest member of a workspace to exfiltrate stored 
  OpenAI-compatible API keys by invoking the OpenAI model-listing helper with an
  attacker-controlled `baseUrl`. The vulnerable path decrypts the selected 
  workspace credential, creates an OpenAI client with the secret in both 
  `apiKey` and the explicit `api-key` header, and then sends the outbound 
  request to the caller-supplied URL. Because the permission check accepts any 
  readable workspace member and `listCredentials` reveals credential identifiers
  to guests, a guest can force the server to deliver the workspace secret to 
  attacker infrastructure. Version 3.17.0 patches the issue.
