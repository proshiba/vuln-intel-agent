title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_ncm: Fix UAF ncm object at re-bind after usb ep transport error\n\nWhen
  ncm function is working and then stop usb0 interface for link down,\neth_stop()
  is called. At this piont, accidentally if usb transport error\nshould happen in
  usb_ep_enable(), 'in_ep' and/or 'out_ep' may not be enabled.\n\nAfter that, ncm_disable()
  is called to disable for ncm unbind\nbut gether_disconnect() is never called since
  'in_ep' is not enabled.\n\nAs the result, ncm object is released in ncm unbind\n\
  but 'dev->port_usb' associated to 'ncm->port' is not NULL.\n\nAnd when ncm bind
  again to recover netdev, ncm object is reallocated\nbut usb0 interface is already
  associated to previous released ncm object.\n\nTherefore, once usb0 interface is
  up and eth_start_xmit() is called,\nreleased ncm object is dereferrenced and it
  might cause use-after-free memory.\n\n[function unlink via configfs]\n  usb0: eth_stop
  dev->port_usb=ffffff9b179c3200\n  --> err"
