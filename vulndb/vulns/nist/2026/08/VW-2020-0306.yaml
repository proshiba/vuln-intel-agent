title: A vulnerability in the DHCP module of Cisco Adaptive Security Appliance 
  (ASA) Software and Cisco Firepower Threat Defense (FTD) Software could allow 
  an unauthenticated, remote attacker to cause a denial of service (DoS) 
  condition on the affected device. The vulnerability is due to incorrect 
  processing of certain DHCP packets. An attacker could exploit this 
  vulnerability by sending a crafted DHCP packet to the affected device. A 
  successful exploit could allow the attacker to cause a DoS condition on the 
  affected device.
