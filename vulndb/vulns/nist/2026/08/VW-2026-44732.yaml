title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlockd:
  Avoid hashing uninitialized bytes in nlm4svc_lookup_file()\n\nfile_hash() digests
  the first LOCKD_FH_HASH_SIZE bytes of\nnfs_fh.data when bucketing nlm_files[], independent
  of fh.size.\nCommit 3de744ee4e45 (\"lockd: Use xdrgen XDR functions for the\nNLMv4
  TEST procedure\") set .pc_argzero to zero for the converted\nprocedures and moved
  file-handle population into\nnlm4svc_lookup_file(), which copies only xdr_lock->fh.len
  bytes\ninto lock->fh.data.\n\nWhen an NLMv4 client presents a file handle shorter
  than\nLOCKD_FH_HASH_SIZE, bytes fh.len..31 retain whatever the argument\nbuffer
  held from an earlier request.  The same wire handle then\nhashes to different buckets
  across calls; nlm_lookup_file() misses\nthe existing nlm_file entry, and lock-state
  lookups fail.\n\nZero only the tail bytes that file_hash() would otherwise consume.\n\
  Handles of LOCKD_FH_HASH_SIZE or larger already populate every byte\nthat file_hash()
  reads."
