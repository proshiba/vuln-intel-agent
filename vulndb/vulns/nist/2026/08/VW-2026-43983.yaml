title: "A use-after-free exists in the Zephyr second-generation work queue (kernel/work.c)
  in the handling of delayable work timeouts. When a delayable work item's timeout
  has been dequeued and its handler work_timeout() is in flight (blocked acquiring
  the work-queue spinlock), a concurrent cancellation does not wait for that handler
  to finish. In unschedule_locked() the pre-fix code called z_abort_timeout(), which
  for an already-announcing record returns -EINVAL without removing it; cancel_async_locked()
  then observes the work as idle, so even k_work_cancel_delayable_sync() and k_work_flush_delayable()
  return without blocking on the in-flight handler.\n\nBecause those are the APIs
  the kernel header documents as the safe way to cancel before freeing a k_work_delayable,
  a caller that frees the object immediately after a successful sync cancel can race
  the still-pending handler. work_timeout() subsequently dereferences the freed record:
  it reads to->dticks via z_is_timeout_handler_canceled() and, "
