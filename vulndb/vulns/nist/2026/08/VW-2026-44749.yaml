title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  amd: acp-sdw-sof: Bound DAI link iteration\n\ncreate_sdw_dailinks() walks sof_dais
  until it finds an entry with\ninitialised cleared, but sof_dais is allocated with
  exactly num_ends\nentries. If all entries are initialised, the loop reads past the
  end of\nthe array.\n\nPass the allocated entry count to create_sdw_dailinks() and
  stop before\nreading past the array."
