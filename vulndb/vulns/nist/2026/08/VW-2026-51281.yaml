title: Wazuh is an open-source security platform providing unified XDR and SIEM 
  protection for endpoints and cloud workloads. In versions 4.14.0 through 
  4.14.6, a low-privilege API user can read the cleartext cluster key from a 
  configuration endpoint that fails to redact it. The REST API provides a 
  masking control, mask_sensitive_config, that redacts sensitive fields such as 
  authd.pass and cluster.key from configuration responses for users who lack 
  update-config permission, and every config-read endpoint carries this 
  decorator except GET /cluster/local/config. That endpoint, backed by 
  read_config_wrapper, is gated only by cluster:read and returns the local 
  node's cluster configuration including the cleartext key, whereas its siblings
  return the same value masked. As a result, any account with the default 
