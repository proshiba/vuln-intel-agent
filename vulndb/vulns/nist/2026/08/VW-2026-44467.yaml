title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  qrtr: fix 32-bit integer overflow in qrtr_endpoint_post()\n\nqrtr_endpoint_post()
  validates an incoming packet with\n\n\tif (!size || len != ALIGN(size, 4) + hdrlen)\n\
  \t\tgoto err;\n\nwhere size comes from the wire. On 32-bit, size_t is 32 bits and\n\
  ALIGN(size, 4) wraps to 0 for size >= 0xfffffffd, so the check\npasses and skb_put_data(skb,
  data + hdrlen, size) writes past the\nhdrlen-sized skb and oopses the kernel. 64-bit
  is unaffected.\n\nThis is the 32-bit residual of ad9d24c9429e2 (\"net: qrtr: fix
  OOB\nRead in qrtr_endpoint_post\"), which fixed only the 64-bit case.\n\nReject
  any size that cannot fit the buffer before the ALIGN."
