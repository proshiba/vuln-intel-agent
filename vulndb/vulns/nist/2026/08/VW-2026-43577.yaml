title: "Issue summary: When an OpenSSL QUIC server (Listener SSL object) processes\n\
  valid QUIC Initial packets for unknown destination connection IDs, it\ncan allocate
  and queue new incoming channels without enforcing any limit.\n\nImpact summary:
  A remote peer that can make many Initial packets reach the\nserver listener faster
  than the application accepts connections, can cause the\nmemory allocated to store
  the per-channel state to grow without any limits,\npotentially making the QUIC listener
  unavailable and causing Denial of Service.\n\nCWE: CWE-770: Allocation of Resources
  Without Limits or Throttling\n\nDescription: The function that handles inbound QUIC
  packets uses\nConnection-Id from the packet header to find an existing connection\n\
  (QUIC channel). If no existing connection is found and the packet\ntype is INITIAL,
  the function treats the packet as a new connection. It\nallocates a new channel
  object and inserts it into a queue where it\nwaits to be accepted by the local application
  with SSL_accept("
