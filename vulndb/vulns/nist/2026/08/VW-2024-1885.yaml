title: "In the Linux kernel, the following vulnerability has been resolved:\n\nceph:
  blocklist the kclient when receiving corrupted snap trace\n\nWhen received corrupted
  snap trace we don't know what exactly has\nhappened in MDS side. And we shouldn't
  continue IOs and metadatas\naccess to MDS, which may corrupt or get incorrect contents.\n\
  \nThis patch will just block all the further IO/MDS requests\nimmediately and then
  evict the kclient itself.\n\nThe reason why we still need to evict the kclient just
  after\nblocking all the further IOs is that the MDS could revoke the caps\nfaster."
