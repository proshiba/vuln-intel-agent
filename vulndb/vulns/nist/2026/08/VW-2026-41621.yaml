title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the WebSocket handler in apps/dokploy/server/wss/terminal.ts 
  validates a session but does not authorize access to the requested server. An 
  authenticated user can connect to /terminal?serverId=local, select the special
  serverId=local branch, and obtain an interactive terminal on the Dokploy host 
  without an organization role or server-access check. This issue is fixed in 
  version 0.29.13.
