title: A vulnerability was found in Typora up to 1.13.8/1.14.6. This 
  vulnerability affects unknown code of the component Mermaid Rendering Engine. 
  The manipulation of the argument classDef/style results in cross site 
  scripting. The attack may be launched remotely. The exploit has been made 
  public and could be used. Upgrading to version 1.14.8 is able to resolve this 
  issue. You should upgrade the affected component. The vendor was contacted 
  early, responded in a very professional manner and quickly released a fixed 
  version of the affected product.
