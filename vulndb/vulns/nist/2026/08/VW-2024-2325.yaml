title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/vmalloc:
  fix page mapping if vm_area_alloc_pages() with high order fallback to order 0\n\n\
  The __vmap_pages_range_noflush() assumes its argument pages** contains\npages with
  the same page shift.  However, since commit e9c3cda4d86e (\"mm,\nvmalloc: fix high
  order __GFP_NOFAIL allocations\"), if gfp_flags includes\n__GFP_NOFAIL with high
  order in vm_area_alloc_pages() and page allocation\nfailed for high order, the pages**
  may contain two different page shifts\n(high order and order-0).  This could lead
  __vmap_pages_range_noflush() to\nperform incorrect mappings, potentially resulting
  in memory corruption.\n\nUsers might encounter this as follows (vmap_allow_huge
  = true, 2M is for\nPMD_SIZE):\n\nkvmalloc(2M, __GFP_NOFAIL|GFP_X)\n    __vmalloc_node_range_noprof(vm_flags=VM_ALLOW_HUGE_VMAP)\n\
  \        vm_area_alloc_pages(order=9) ---> order-9 allocation failed and fallback
  to order-0\n            vmap_pages_range()\n                vmap_pag"
