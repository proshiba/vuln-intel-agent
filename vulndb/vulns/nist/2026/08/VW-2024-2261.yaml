title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/virtio:
  Fix GEM handle creation UAF\n\nUserspace can guess the handle value and try to race
  GEM object creation\nwith handle close, resulting in a use-after-free if we dereference
  the\nobject after dropping the handle's reference.  For that reason, dropping\n\
  the handle's reference must be done *after* we are done dereferencing\nthe object."
