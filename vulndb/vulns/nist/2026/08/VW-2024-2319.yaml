title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  pm: only decrement add_addr_accepted for MPJ req\n\nAdding the following warning
  ...\n\n  WARN_ON_ONCE(msk->pm.add_addr_accepted == 0)\n\n... before decrementing
  the add_addr_accepted counter helped to find a\nbug when running the \"remove single
  subflow\" subtest from the\nmptcp_join.sh selftest.\n\nRemoving a 'subflow' endpoint
  will first trigger a RM_ADDR, then the\nsubflow closure. Before this patch, and
  upon the reception of the\nRM_ADDR, the other peer will then try to decrement this\n\
  add_addr_accepted. That's not correct because the attached subflows have\nnot been
  created upon the reception of an ADD_ADDR.\n\nA way to solve that is to decrement
  the counter only if the attached\nsubflow was an MP_JOIN to a remote id that was
  not 0, and initiated by\nthe host receiving the RM_ADDR."
