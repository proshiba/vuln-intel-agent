title: CakePHP is a rapid development framework for PHP. Prior to versions 
  4.5.12, 4.6.5, 5.1.8, 5.2.14, and 5.3.7 on their respective release lines, 
  custom mail headers added with Message::setHeaders() or Message::addHeaders() 
  do not have CRLF bytes removed, allowing header injection when user-controlled
  data is used in message headers. This issue is fixed in versions 4.5.12, 
  4.6.5, 5.1.8, 5.2.14, and 5.3.7.
