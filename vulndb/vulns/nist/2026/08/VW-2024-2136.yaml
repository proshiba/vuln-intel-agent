title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvdpa/mlx5:
  add validation for VIRTIO_NET_CTRL_MQ_VQ_PAIRS_SET command\n\nWhen control vq receives
  a VIRTIO_NET_CTRL_MQ_VQ_PAIRS_SET command\nrequest from the driver, presently there
  is no validation against the\nnumber of queue pairs to configure, or even if multiqueue
  had been\nnegotiated or not is unverified. This may lead to kernel panic due to\n\
  uninitialized resource for the queues were there any bogus request\nsent down by
  untrusted driver. Tie up the loose ends there."
