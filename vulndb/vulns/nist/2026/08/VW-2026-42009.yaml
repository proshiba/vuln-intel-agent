title: An insecure direct object reference vulnerability in Attendize through 
  commit 9289acb allows any authenticated event organiser to bulk import 
  attendees into events belonging to other accounts via the postImportAttendee 
  endpoint. The endpoint loads the target event by ID without verifying 
  ownership against the requesting organiser account. An attacker can inject 
  bulk attendee data into any event in the system regardless of account 
  boundaries.
