title: A flaw was found in libdm. A local attacker could craft a malicious 
  Logical Volume Manager (LVM) metadata configuration with deeply nested 
  structures. This could lead to uncontrolled recursion in the libdm 
  configuration file parser, exhausting the stack and causing any LVM command 
  reading the metadata to crash. This vulnerability results in a Denial of 
  Service (DoS) for affected systems.
