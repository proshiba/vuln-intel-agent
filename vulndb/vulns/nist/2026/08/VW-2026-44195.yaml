title: "In the Linux kernel, the following vulnerability has been resolved:\n\nirqchip/irq-riscv-imsic-early:
  Fix fwnode leak on state setup failure\n\nimsic_early_acpi_init() allocates a firmware
  node before setting up the\nIMSIC state. If imsic_setup_state() fails, the function
  returns without\nfreeing the allocated fwnode.\n\nFree the fwnode and clear the
  global pointer on this error path, matching\nthe cleanup already done when imsic_early_probe()
  fails.\n\n[ tglx: Use a common cleanup path instead of copying code around ]"
