title: "A vulnerability in the geolocation access control feature of Cisco Firepower
  Threat Defense (FTD) Software could allow an unauthenticated, remote attacker to
  bypass an access control policy.\r\n\r This vulnerability is due to improper assignment
  of geolocation data. An attacker could exploit this vulnerability by sending traffic
  through an affected device. A successful exploit could allow the attacker to bypass
  a geolocation-based access control policy and successfully send traffic to a protected
  device."
