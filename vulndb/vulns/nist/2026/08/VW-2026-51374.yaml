title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Avoid double-unpin of DOORBELL/MMIO BOs on free\n\namdgpu_amdkfd_gpuvm_free_memory_of_gpu()
  unpinned DOORBELL and MMIO\nremap BOs (which are pinned at allocation time) before
  checking whether\nthe BO is still mapped to the GPU. When the BO is still mapped,
  the\nfunction returns -EBUSY and leaves the BO alive, but it has already\nbeen unpinned.
  The BO is then unpinned again when it is finally freed\nduring process teardown,
  triggering a ttm_bo_unpin() underflow warning:\n\n  WARNING: CPU: 18 PID: 15066
  at ttm/ttm_bo.c:650 amdttm_bo_unpin+0x6d/0x80 [amdttm]\n  Workqueue: kfd_process_wq
  kfd_process_wq_release [amdgpu]\n  RIP: 0010:amdttm_bo_unpin+0x6d/0x80 [amdttm]\n\
  \  Call Trace:\n   amdgpu_bo_unpin+0x1a/0x90 [amdgpu]\n   amdgpu_amdkfd_gpuvm_unpin_bo+0x31/0xb0
  [amdgpu]\n   amdgpu_amdkfd_gpuvm_free_memory_of_gpu+0x3bf/0x460 [amdgpu]\n   kfd_process_free_outstanding_kfd_bos+0xd4/0x170
  [amdgpu]\n   kfd_process_wq_release+0x109/0"
