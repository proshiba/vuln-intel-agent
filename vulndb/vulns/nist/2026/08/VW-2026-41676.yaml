title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the apiCreateCertificate schema in 
  packages/server/src/db/schema/certificate.ts accepts a client-supplied 
  certificatePath, and packages/server/src/services/certificate.ts joins that 
  value to the certificate root without confinement. An authenticated user with 
  certificate create or delete permission can use certificatePath to write 
  attacker-controlled certificate content outside the intended directory or 
  delete an out-of-root directory. This vulnerability is fixed in 0.29.13.
