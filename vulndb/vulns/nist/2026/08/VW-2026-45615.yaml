title: A vulnerability was detected in EricLBuehler Mistral.rs up to 0.8.22. 
  Affected by this issue is the function convert_gguf_to_hf_tokenizer of the 
  file mistralrs-core/src/gguf/gguf_tokenizer.rs of the component GGUF 
  Tokenizer. The manipulation of the argument 
  eos_token_id/bos_token_id/unknown_token_id results in out-of-bounds read. The 
  attack can be executed remotely. The exploit is now public and may be used. 
  Upgrading to version 0.8.23 can resolve this issue. The patch is identified as
  cd5297e2ea5cb27c790bdcf2f3c2f1064a81d55e. Upgrading the affected component is 
  recommended.
