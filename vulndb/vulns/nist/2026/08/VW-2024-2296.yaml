title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  sc16is7xx: fix invalid FIFO access with special register set\n\nWhen enabling access
  to the special register set, Receiver time-out and\nRHR interrupts can happen. In
  this case, the IRQ handler will try to read\nfrom the FIFO thru the RHR register
  at address 0x00, but address 0x00 is\nmapped to DLL register, resulting in erroneous
  FIFO reading.\n\nCall graph example:\n    sc16is7xx_startup(): entry\n    sc16is7xx_ms_proc():
  entry\n    sc16is7xx_set_termios(): entry\n    sc16is7xx_set_baud(): DLH/DLL = $009C
  --> access special register set\n    sc16is7xx_port_irq() entry            --> IIR
  is 0x0C\n    sc16is7xx_handle_rx() entry\n    sc16is7xx_fifo_read(): --> unable
  to access FIFO (RHR) because it is\n                               mapped to DLL
  (LCR=LCR_CONF_MODE_A)\n    sc16is7xx_set_baud(): exit --> Restore access to general
  register set\n\nFix the problem by claiming the efr_lock mutex when accessing the
  Special\nregister s"
