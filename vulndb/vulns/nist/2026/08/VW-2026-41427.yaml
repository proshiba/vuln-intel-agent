title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatchdog:
  airoha: Prevent division by zero when clock frequency is zero\n\nclk_get_rate()
  can return 0 when the clock provider is not properly\nconfigured or the clock is
  unmanaged. The driver uses wdt_freq as a\ndivisor directly in airoha_wdt_probe()
  to compute max_timeout and in\nairoha_wdt_get_timeleft() to compute the remaining
  time, which results\nin a division by zero.\n\nAdd a check for wdt_freq == 0 in
  probe and return -EINVAL with\ndev_err_probe() to prevent the division by zero and
  provide a\ndiagnostic message."
