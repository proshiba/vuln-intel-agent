title: "Google::Auth versions before 0.09 for Perl allow server side request forgery
  and credential exfiltration via unvalidated URLs taken from the credentials JSON.\n\
  \nThe URLs the library requests are read from the credentials JSON, and their hosts
  were not checked against the universe domain before the request. For an external_account
  configuration, retrieve_subject_token fetched credential_source.url with headers
  from the same JSON, and fetch_access_token posted the subject token to token_url,
  then sent the STS access token it received to service_account_impersonation_url
  in an Authorization: Bearer header. The authorized_user, impersonated_service_account
  and service_account configurations posted the client secret and refresh token, the
  source access token, and a signed JWT assertion to their own JSON-supplied token_uri
  or impersonation URL.\n\nAny caller that builds credentials from a configuration
