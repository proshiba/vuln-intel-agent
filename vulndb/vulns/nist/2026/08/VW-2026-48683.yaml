title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfutex:
  Prevent robust futex exit race some more\n\nA robust futex unlock stores 0 over
  the whole futex value - wiping\nFUTEX_WAITERS - and wakes a single waiter. That
  wakeup is a one-shot\nnotification: the protocol relies on its recipient to either
  acquire the\nfutex (and eventually unlock while aware of the remaining contention)
  or\nre-arm FUTEX_WAITERS before sleeping again.  If the woken waiter is killed\n\
  before it can do either, the kernel must jump in and wake the next task\ndown the
  line.\n\nThis is a known complication of the futex protocol with a previous\npartial
  fix in commit ca16d5bee598 (\"futex: Prevent robust futex exit\nrace\"). Unfortunately,
  that fix is insufficient.\n\nIf a third task re-acquired the futex through the uncontended
  fast\npath in the meantime, the notification is lost: robust exit processing\nsees
  that it is owned by another task and does nothing, while the new\nowner sees no
  FUTEX_WAITERS when it unlock"
