title: "In the Linux kernel, the following vulnerability has been resolved:\n\nperf
  tools: Use perf_env__get_cpu_topology() in machine__resolve()\n\nmachine__resolve()
  accesses env->cpu[al->cpu].socket_id after checking\nal->cpu >= 0 and env->cpu !=
  NULL, but without validating al->cpu\nagainst env->nr_cpus_avail.  Since al->cpu
  comes from the untrusted\nperf.data sample, a crafted file with a large CPU index
  causes an\nout-of-bounds heap read.\n\nUse perf_env__get_cpu_topology() which validates
  both NULL and bounds.\nAlso bounds-check al->cpu before the cast to struct perf_cpu
  (int16_t):\nwithout this, values like 65536 silently truncate to 0, bypassing the\n\
  accessor's internal check and returning CPU 0's topology."
