title: "In versions of the Datadog Android application prior to v554-5.9.4, two Room-backed
  SQLite databases store sensitive content in plaintext: LocalNotificationDatabase
  (notification title, message, recipient, service, tags, and on-call/incident deep
  links) and SearchRecentDatabase (the user's full in-app search history). \r\nImpact:
  Any actor able to bypass the app sandbox can read these databases in plaintext."
