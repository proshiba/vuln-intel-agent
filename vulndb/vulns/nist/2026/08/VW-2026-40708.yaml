title: "The Datadog Android application stores operationally sensitive content in
  plaintext SQLite databases via Room. Two databases were reviewed: LocalNotificationDatabase
  (table local_notifications, columns including title, message, recipient, service,
  tags, and on-call/incident deeplinks) and SearchRecentDatabase (table search_recents,
  storing every in-app search query the user typed).\r\nA repository-wide search for
  SQLCipher, SupportFactory, openHelperFactory, or any Room encryption configuration
  returns no matches. Databases are stored as cleartext SQLite files in /data/data/com.datadog.app/databases/.
  At-rest protection therefore depends solely on the Android application sandbox —
  the standard Android baseline, adequate for many applications but flagged here as
  a hardening recommendation because the stored content is operationally sensitive
  (customer infrastructure monitoring metadata, incident notification recipients,
  and free-text search queries that may reveal service names, dashboard"
