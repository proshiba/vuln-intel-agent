title: The The kk Star Ratings – Rate Post & Collect User Feedbacks plugin for 
  WordPress is vulnerable to arbitrary shortcode execution in all versions up 
  to, and including, 5.4.10.3. This is due to the software allowing users to 
  execute an action that does not properly validate the 'payload' value before 
  running do_shortcode. This makes it possible for unauthenticated attackers to 
  execute arbitrary shortcodes.
