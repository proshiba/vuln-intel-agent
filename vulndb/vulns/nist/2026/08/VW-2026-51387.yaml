title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  lzo: reject compressed segment that overflows the compressed input\n\nlzo_decompress_bio()
  validates each on-disk segment length seg_len only\nagainst the workspace cbuf size,
  not against the compressed input size\n(compressed_len, the total folio bytes of
  the bio).  A crafted extent can\ncarry a segment whose seg_len passes the cbuf check
  but runs past the end\nof the bio, so copy_compressed_segment() walks off the last
  folio:\nget_current_folio() then returns the NULL folio from bio_next_folio(), and\n\
  with CONFIG_BTRFS_ASSERT disabled (default) folio_size(NULL) faults.\n\n BUG: KASAN:
  null-ptr-deref in lzo_decompress_bio (fs/btrfs/lzo.c:383)\n Read of size 8 at addr
  0000000000000000 by task kworker/u8:1/29\n Workqueue: btrfs-endio simple_end_io_work\n\
  \  kasan_report (mm/kasan/report.c:590)\n  lzo_decompress_bio (fs/btrfs/lzo.c:383)\n\
  \  end_bbio_compressed_read (fs/btrfs/compression.c:1065)\n  btrfs_bio_end_io (fs/btrfs/bio.c:1"
