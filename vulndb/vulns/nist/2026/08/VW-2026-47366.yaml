title: "Multiple Cisco products are affected by a vulnerability in the Snort 3 detection
  engine that could allow an unauthenticated, remote attacker to cause the Snort 3
  Detection Engine to restart, resulting in an interruption of packet inspection.&nbsp;\r\
  \n\r\nThis vulnerability is due to incomplete error checking when parsing the Multicast
  DNS fields of the HTTP header. An attacker could exploit this vulnerability by sending
  crafted HTTP packets through an established connection to be parsed by Snort 3.
  A successful exploit could allow the attacker to cause a DoS condition when the
  Snort 3 Detection Engine unexpectedly restarts."
