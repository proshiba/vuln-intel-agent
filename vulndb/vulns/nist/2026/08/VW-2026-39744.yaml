title: dr_libs dr_wav.h (all versions through current master) contains an 
  integer overflow in W64 CUE chunk metadata parsing. In 
  drwav__metadata_process_chunk(), a stage-1 capacity estimate truncates the 
  64-bit W64 chunk sizeInBytes to size_t before dividing by 
  DRWAV_CUE_POINT_BYTES; on 32-bit builds this truncation causes the 
  pre-allocated extra metadata capacity to be computed incorrectly. The 
  subsequent read in drwav__read_cue_to_metadata_obj() computes the actual cue 
  point count and allocation size using the full-precision, attacker-controlled 
  cuePointCount field without cross-checking it against the stage-1 capacity 
  estimate, and the only bounds enforcement on the resulting memory region 
  (drwav__metadata_get_memory()) is a DRWAV_ASSERT, which compiles to a no-op 
  under -DNDEBUG (the default for release builds). A crafted W64 WAV file can 
  therefore cause a heap buffer overflow in any 32-bit application parsing 
  untrusted WAV metadata.
