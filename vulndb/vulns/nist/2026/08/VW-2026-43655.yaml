title: "The 'podman quadlet install --replace' command opens the existing destination
  file with O_CREATE|O_WRONLY but omits O_TRUNC. When the initial reflink copy attempt
  fails (common on non-reflink-capable filesystems including many RHEL default XFS
  configurations), the fallback in ReflinkOrCopy uses io.Copy which performs a non-truncating
  write. If the original Quadlet is larger than the new Quadlet, the file is not truncated
  and content from the original is preserved. The command completes with no warning.\n\
  \nThere is no risk of information leakage as the user already had access to the
  Quadlet in order to replace it, and in most cases, this would only lead to invalid
  Quadlet files. However, security-related options from the end of the old Quadlet
  could be included in the new Quadlet, and if the truncation resulted in a valid
  Quadlet file, this could result in undesirable behavior. For example, running podman
