title: "Allocation of Resources Without Limits or Throttling vulnerability in ash-project
  ash_admin lets any client that can reach the admin LiveView exhaust the BEAM atom
  table and crash the entire node.\n\nTwo LiveView event handlers interned atoms from
  unvalidated client input: AshAdmin.PageLive's set_actor built modules from the resource/domain
  payload with Module.concat/1, and AshAdmin.Components.Resource.Show's calculate
  converted every submitted form key with String.to_atom/1. Atoms are never garbage
  collected and the table is capped, so flooding either event with random names mints
  a new atom per request until the VM aborts, taking down every application on the
  node. The fix resolves the submitted resource/domain against the known shown resources
  and maps calculation keys to declared arguments, so no client-supplied string is
  interned.\n\nThis issue affects ash_admin: from 0.1.0 before 1.3.1."
