title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  fix qentry overwrite for CONFIRM_LINK and ADD_LINK_CONT in smc_llc_event_handler()\n\
  \nThe SMC_LLC_CONFIRM_LINK / SMC_LLC_ADD_LINK_CONT branch in\nsmc_llc_event_handler()
  stores an incoming qentry into the local LLC flow\nwithout first checking whether
  a qentry is already pending. If a malicious or\nbuggy peer sends a second CONFIRM_LINK
  or ADD_LINK_CONT request while a flow is\nactive and flow->qentry is already set,
  smc_llc_flow_qentry_set() overwrites the\npointer without freeing the previous allocation,
  leaking one kmalloc-96 object\nper spurious message.\n\nThe sibling SMC_LLC_DELETE_LINK
  branch already has the correct !flow->qentry\nguard. Apply the same guard to the
  CONFIRM_LINK/ADD_LINK_CONT branch so that a\nduplicate message when qentry is already
  occupied falls through to break and is\nfreed by the kfree(qentry) at the out: label,
  rather than silently leaking the\nexisting allocation.\n\nThe response direction
  (smc"
