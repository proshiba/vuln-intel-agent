title: rsync 3.2.3 before 3.5.0 contains an out-of-bounds write in 
  parse_size_arg() where the return value of snprintf() is used directly as an 
  index into a .bss-segment array without bounds checking. When snprintf 
  truncates the formatted size string, the return value equals the number of 
  characters that would have been written including the truncated portion, and 
  this value may exceed the array length. The subsequent indexed write targets 
  memory outside the intended array bounds, corrupting .bss memory.
