title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm:
  don't try to NUMA-migrate COW pages that have other uses\n\nOded Gabbay reports
  that enabling NUMA balancing causes corruption with\nhis Gaudi accelerator test
  load:\n\n \"All the details are in the bug, but the bottom line is that somehow,\n\
  \  this patch causes corruption when the numa balancing feature is\n  enabled AND
  we don't use process affinity AND we use GUP to pin pages\n  so our accelerator
  can DMA to/from system memory.\n\n  Either disabling numa balancing, using process
  affinity to bind to\n  specific numa-node or reverting this patch causes the bug
  to\n  disappear\"\n\nand Oded bisected the issue to commit 09854ba94c6a (\"mm: do_wp_page()\n\
  simplification\").\n\nNow, the NUMA balancing shouldn't actually be changing the
  writability\nof a page, and as such shouldn't matter for COW.  But it appears it\n\
  does.  Suspicious.\n\nHowever, regardless of that, the condition for enabling NUMA
  faults in\nchange_pte_range() is nonsensical.  "
