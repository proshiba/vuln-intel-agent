title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  Fix pdsc_check_pci_health function to use work thread\n\nWhen the driver notices
  fw_status == 0xff it tries to perform a PCI\nreset on itself via pci_reset_function()
  in the context of the driver's\nhealth thread. However, pdsc_reset_prepare calls\n\
  pdsc_stop_health_thread(), which attempts to stop/flush the health\nthread. This
  results in a deadlock because the stop/flush will never\ncomplete since the driver
  called pci_reset_function() from the health\nthread context. Fix by changing the
  pdsc_check_pci_health_function()\nto queue a newly introduced pdsc_pci_reset_thread()
  on the pdsc's\nwork queue.\n\nUnloading the driver in the fw_down/dead state uncovered
  another issue,\nwhich can be seen in the following trace:\n\nWARNING: CPU: 51 PID:
  6914 at kernel/workqueue.c:1450 __queue_work+0x358/0x440\n[...]\nRIP: 0010:__queue_work+0x358/0x440\n\
  [...]\nCall Trace:\n <TASK>\n ? __warn+0x85/0x140\n ? __queue_work+0x358/0x440\n\
  \ ? report_bug"
