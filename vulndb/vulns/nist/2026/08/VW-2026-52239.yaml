title: Keep Backup Daily plugin for WordPress before 2.1.4 contains a sensitive 
  information exposure vulnerability that allows unauthenticated attackers to 
  trigger a full MySQL database dump by accessing the publicly exposed 
  `kbd_cron_process` parameter without authentication. Attackers can predict the
  partially predictable dump filename based on the database name, a limited 
  random range, and the current Unix timestamp to download the generated backup 
  from the publicly accessible uploads directory.
