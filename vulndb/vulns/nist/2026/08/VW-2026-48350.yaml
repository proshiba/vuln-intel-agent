title: Incus is a system container and virtual machine manager. Prior to version
  7.3.0, when migrating an instance to another cluster member, user-supplied 
  configuration overrides (including security-critical keys like 
  `security.privileged` and `raw.lxc`) are applied without any project 
  restriction enforcement, allowing a restricted project user to escalate to a 
  privileged container and escape to the host. Version 7.3.0 patches the issue.
