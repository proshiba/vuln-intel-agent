title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  Move kvm_io_bus_get_dev() locking responsibilities to callers\n\nkvm_io_bus_get_dev()
  returns a device that is only matched by the\naddress, and nothing else. This can
  cause a lifetime issue if\nthe matched device is not the expected type, as by the
  time\nthe caller can introspect the object, it might be gone (the srcu\nlock having
  been dropped).\n\nGiven that there is only a single user of this helper, the simplest\n\
  option is to move the locking responsibility to the caller, which\ncan keep the
  srcu lock held for as long as it wants.\n\nNote that this aligns with other kvm_io_bus*()
  helpers, which\nalready require the srcu lock to be held by the callers."
