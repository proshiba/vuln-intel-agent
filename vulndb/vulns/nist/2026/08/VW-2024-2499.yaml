title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  fix SRCU protection of nvme_ns_head list\n\nWalking the nvme_ns_head siblings list
  is protected by the head's srcu\nin nvme_ns_head_submit_bio() but not nvme_mpath_revalidate_paths().\n\
  Removing namespaces from the list also fails to synchronize the srcu.\nConcurrent
  scan work can therefore cause use-after-frees.\n\nHold the head's srcu lock in nvme_mpath_revalidate_paths()
  and\nsynchronize with the srcu, not the global RCU, in nvme_ns_remove().\n\nObserved
  the following panic when making NVMe/RDMA connections\nwith native multipath on
  the Rocky Linux 8.6 kernel\n(it seems the upstream kernel has the same race condition).\n\
  Disassembly shows the faulting instruction is cmp 0x50(%rdx),%rcx;\ncomputing capacity
  != get_capacity(ns->disk).\nAddress 0x50 is dereferenced because ns->disk is NULL.\n\
  The NULL disk appears to be the result of concurrent scan work\nfreeing the namespace
  (note the log line in the middle of the panic).\n\n[37314"
