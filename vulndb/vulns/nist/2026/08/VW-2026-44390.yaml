title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsunrpc:
  wait for in-flight TLS handshake callback when cancel loses race\n\nWhen wait_for_completion_interruptible_timeout()
  in\nsvc_tcp_handshake() returns 0 (timeout) or -ERESTARTSYS (signal) and\ntls_handshake_cancel()
  then returns false, handshake_complete() has\nwon the cancellation race: it has
  set HANDSHAKE_F_REQ_COMPLETED and\nis about to invoke svc_tcp_handshake_done(),
  but the callback's\nside effects on xpt_flags and on svsk->sk_handshake_done have
  not\nyet committed.\n\nThe current code reads xpt_flags immediately to decide whether
  the\nsession succeeded. Two races result.\n\nIf the callback has executed set_bit(XPT_TLS_SESSION)
  but not yet\nclear_bit(XPT_HANDSHAKE), svc_tcp_handshake() sees a session,\nenqueues
  the transport, and returns. svc_xprt_received() then\nclears XPT_BUSY, a worker
  thread picks the transport up, the\ndispatcher in svc_handle_xprt() observes XPT_HANDSHAKE
  still set,\nand xpo_handshake is invoked a s"
