title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  nsm: only unlock nsm_dev on post-lock error paths\n\nnsm_dev_ioctl() jumps to the
  common out label even when the initial\ncopy_from_user() fails before nsm->lock
  has been taken.  The error path\nthen blindly unlocks a mutex that was never acquired.\n\
  \nThis issue was found by our static analysis tool and then manually\nreviewed against
  the current tree.\n\nThe grounded PoC kept the miscdevice ioctl entry and the pre-lock\n\
  copy_from_user(&raw, argp, _IOC_SIZE(cmd)) failure path by issuing\nNSM_IOCTL_RAW
  with an invalid user pointer.  That failure reaches the\nshared out label before
  mutex_lock(&nsm->lock).  Lockdep reported:\n\n  WARNING: bad unlock balance detected!\n\
  \  exploit/193 is trying to release lock (&global_nsm.lock) at:\n  nsm_dev_ioctl+0x5f/0xcf
  [vuln_msv]\n  but there are no more locks to release!\n  no locks held by exploit/193.\n\
  \nReturn immediately on the pre-lock copy_from_user() failure and keep the\ncommon
  unlock lab"
