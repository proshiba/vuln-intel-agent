title: ArcadeDB (com.arcadedb:arcadedb-server) versions <= 26.7.3 contain an 
  insecure direct object reference (IDOR) vulnerability in the Raft cluster-info
  endpoints (GetClusterHandler and PostBootstrapStateHandler), which 
  authenticate but do not authorize access. On an ArcadeDB HA cluster (only 
  reachable when arcadedb.ha.enabled is set and the ha-raft module is loaded), 
  any authenticated user — including one granted access to only one database or 
  none — can enumerate the full server database registry and retrieve 
  per-database metadata such as database names, last transaction IDs, bootstrap 
  fingerprints, and peer/leader cluster topology, resulting in cross-database 
  information disclosure. Fixed in 26.8.1.
