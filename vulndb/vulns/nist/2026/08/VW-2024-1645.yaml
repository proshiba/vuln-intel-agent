title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: core: Add TMF to tmr_list handling\n\nAn abort that is responded to by iSCSI
  itself is added to tmr_list but does\nnot go to target core. A LUN_RESET that goes
  through tmr_list takes a\nrefcounter on the abort and waits for completion. However,
  the abort will\nbe never complete because it was not started in target core.\n\n\
  \ Unable to locate ITT: 0x05000000 on CID: 0\n Unable to locate RefTaskTag: 0x05000000
  on CID: 0.\n wait_for_tasks: Stopping tmf LUN_RESET with tag 0x0 ref_task_tag 0x0
  i_state 34 t_state ISTATE_PROCESSING refcnt 2 transport_state active,stop,fabric_stop\n\
  \ wait for tasks: tmf LUN_RESET with tag 0x0 ref_task_tag 0x0 i_state 34 t_state
  ISTATE_PROCESSING refcnt 2 transport_state active,stop,fabric_stop\n...\n INFO:
  task kworker/0:2:49 blocked for more than 491 seconds.\n task:kworker/0:2     state:D
  stack:    0 pid:   49 ppid:     2 flags:0x00000800\n Workqueue: events target_tmr_work
  [target_core_mod]\n"
