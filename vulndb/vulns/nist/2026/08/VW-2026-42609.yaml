title: TypeBot is a chatbot builder tool. Versions prior to 3.17.0 allow a 
  low-privilege guest member of a workspace to obtain a live Google Sheets OAuth
  access token for that workspace by calling the Google Sheets helper 
  `getAccessToken`. The vulnerable path checks only whether the caller has read 
  access to the workspace, decrypts the stored Google OAuth credential, 
  refreshes or retrieves the access token through the Google client, and returns
  the raw bearer token directly to the caller. Because guest members can also 
  enumerate credential identifiers, a guest can mint and reuse the workspace's 
  Google access token outside Typebot. Version 3.17.0 patches the issue.
