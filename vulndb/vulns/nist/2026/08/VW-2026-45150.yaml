title: Scriban before 7.0.0 (affected versions <= 6.6.0) contains a stack 
  overflow vulnerability in nested array initializer parsing. Deeply nested 
  array initializers recurse through a path (ParseArrayInitializer → 
  ParseExpression → ParseArrayInitializer) that is not covered by the 
  ExpressionDepthLimit counter added in the fix for GHSA-wgh7-7m3c-fx25. An 
  attacker who can supply untrusted input to Template.Parse can trigger an 
  uncatchable StackOverflowException that immediately terminates the process, 
  even with the default ExpressionDepthLimit enabled.
