title: "A vulnerability in the memory management handling for the Snort 3 Detection
  Engine of Cisco Secure Firewall Threat Defense (FTD) Software could allow an unauthenticated,
  remote attacker to cause the Snort 3 Detection Engine to restart.\r\n\r\nThis vulnerability
  is due to a logic error in memory management when a device is performing Snort 3
  SSL packet inspection. An attacker could exploit this vulnerability by sending crafted
  SSL packets&nbsp;through an established connection to be parsed by the Snort 3 Detection
  Engine. A successful exploit could allow the attacker to cause a denial of service
  (DoS) condition when the Snort 3 Detection Engine unexpectedly restarts."
