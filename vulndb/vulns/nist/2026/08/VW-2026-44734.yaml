title: "In the Linux kernel, the following vulnerability has been resolved:\n\nixgbe:
  do not configure xps for XDP queues\n\nnetif_set_xps_queue() should not be called
  for an XDP Tx queue, since such\nqueues are not netdev-exposed. On systems with
  number of CPUs >=64, on E610\nadapter, netdev is configured with maximum number
  queue pairs being 63\n(due to MSI-X assignment), but configuring XDP results in
  64 XDP queues.\n\nSo, during XDP program load, when netif_set_xps_queue() is called
  for the\nlast XDP queue, we get a WARNING with a call trace and KASAN report\nafterwards
  (if enabled).\n\n[ 2012.699800] WARNING: net/core/dev.c:2854 at __netif_set_xps_queue+0x116a/0x1e40,
  CPU#36: xdpsock/103668\n[...]\n[ 2012.700029] RIP: 0010:__netif_set_xps_queue+0x116a/0x1e40\n\
  [ 2012.700035] Code: b6 34 06 48 89 f8 83 e0 07 83 c0 01 40 38 f0 7c 09 40 84 f6
  0f 85 03 0a 00 00 0f b7 44 24 40 66 43 89 44 6a 18 e9 01 fb ff ff <0f> 0b e9 f2
  ee ff ff 44 8b 44 24 44 45 85 c0 74 50 4d 85 e4 0f 84\n[ 2012.700040] RSP: 0018:ffff88823"
