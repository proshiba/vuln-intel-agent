title: PaperCut NG/MF contains an observable timing discrepancy in its 
  authentication component. An unauthenticated remote attacker can exploit this 
  vulnerability to perform username enumeration by measuring response times 
  during login attempts. The system executes a password hash comparison only 
  when a valid account is supplied, creating a measurable timing oracle that 
  reveals account existence.
