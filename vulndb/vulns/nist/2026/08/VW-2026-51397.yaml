title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wlcore: enable the right set of ciphers\n\nThe firmware version number check for
  IGTK introduced in\ncommit c34dbc5900b0 (\"wifi: wlcore: Add support for IGTK key\"\
  )\n\nlets the amount of ciphers decrease on every boot of a too old firmware and\n\
  that is practically happening. It also does not take into account other\nchips than
  the wl18xx. On some wl128x, the following can be observed\nwhen connecting via nm
  to a common ap:\n\n[  484.113311] wlcore: WARNING could not set keys\n[  484.117828]
  wlcore: ERROR Could not add or replace key\n[  484.123016] wlan0: failed to set
  key (5, ff:ff:ff:ff:ff:ff) to hardware (-5)\n[  484.123046] wlcore: Hardware recovery
  in progress. FW ver: Rev 7.3.10.0.142\n[  484.139923] wlcore: pc: 0x0, hint_sts:
  0x00000048 count: 1\n[  484.145721] wlcore: down\n[  484.148986] ieee80211 phy0:
  Hardware restart was requested\n[  484.610473] wlcore: firmware booted (Rev 7.3.10.0.142)\n\
