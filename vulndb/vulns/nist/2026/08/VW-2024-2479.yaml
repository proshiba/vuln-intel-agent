title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncifs:
  Fix buffer overflow when parsing NFS reparse points\n\nReparseDataLength is sum
  of the InodeType size and DataBuffer size.\nSo to get DataBuffer size it is needed
  to subtract InodeType's size from\nReparseDataLength.\n\nFunction cifs_strndup_from_utf16()
  is currentlly accessing buf->DataBuffer\nat position after the end of the buffer
  because it does not subtract\nInodeType size from the length. Fix this problem and
  correctly subtract\nvariable len.\n\nMember InodeType is present only when reparse
  buffer is large enough. Check\nfor ReparseDataLength before accessing InodeType
  to prevent another invalid\nmemory access.\n\nMajor and minor rdev values are present
  also only when reparse buffer is\nlarge enough. Check for reparse buffer size before
  calling reparse_mkdev()."
