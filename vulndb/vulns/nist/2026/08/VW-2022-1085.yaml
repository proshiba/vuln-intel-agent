title: An issue was discovered in Insyde InsydeH2O with Kernel 5.0 before 
  05.08.42, Kernel 5.1 before 05.16.42, Kernel 5.2 before 05.26.42, Kernel 5.3 
  before 05.35.42, Kernel 5.4 before 05.42.51, and Kernel 5.5 before 05.50.51. 
  An SMM memory corruption vulnerability in FvbServicesRuntimeDxe allows a 
  possible attacker to write fixed or predictable data to SMRAM. Exploiting this
  issue could lead to escalating privileges to SMM.
