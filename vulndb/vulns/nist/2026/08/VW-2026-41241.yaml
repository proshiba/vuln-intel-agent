title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmptcp:
  fix stale skb->sk reference on subflow close\n\nThe backlog list is updated by mptcp_data_ready()
  under\nmptcp_data_lock(). The cleanup of backlog references to a closing\nsubflow,
  however, was performed in mptcp_close_ssk(), before\n__mptcp_close_ssk() acquires
  the ssk lock, and while holding neither\nthe ssk lock nor mptcp_data_lock().\n\n\
  Because that traversal ran without mptcp_data_lock(), concurrent softirq\nRX processing
  on another CPU (subflow_data_ready() -> mptcp_data_ready()\n-> __mptcp_add_backlog(),
  under mptcp_data_lock()) could add a backlog\nentry referencing the ssk while the
  cleanup loop was in progress. Such\nan entry could be missed by the cleanup, or
  the concurrent list update\ncould corrupt the traversal, leaving skb->sk pointing
  at the ssk after\nit is freed.\n\nA later mptcp_backlog_purge() then dereferences
  the stale pointer,\ntriggering a warning in inet_sock_destruct() (ssk->sk_rmem_alloc
  != 0)\nfollowe"
