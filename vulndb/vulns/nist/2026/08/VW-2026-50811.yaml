title: "Affected versions of Flowintel render Mermaid blocks contained in stored case
  notes without sufficiently neutralizing attacker-controlled markup. Because Mermaid
  note content is persisted and later rendered for other users, an attacker with permission
  to create or edit a note could store a crafted Mermaid payload that results in JavaScript
  execution when another user views the affected case note.\n\nThe patch adds explicit
  Mermaid detection and HTML escaping around the token content before the generated
  Mermaid wrapper is returned. It also moves the wrapping logic earlier in page initialization
  so Markdown instances are protected consistently.\n\nVersion impacted >= 3.3.0"
