title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  stm32: dcmi: unregister notifier on probe failure\n\ndcmi_graph_init() registers
  the async notifier before dcmi_probe() toggles\nthe reset line. If reset_control_assert()
  or reset_control_deassert()\nfails afterwards, probe returns through err_cleanup
  and the driver core\nwill not call dcmi_remove().\n\nUnregister the notifier before
  cleaning it up on that error path,\nmatching the successful remove path and the
  V4L2 async notifier lifetime\nrules.\n\n[hverkuil: added Fixes tag]"
