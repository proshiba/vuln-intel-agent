title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  mt7621: avoid corruption of shared interrupt trigger state\n\nThe bank-shared fields
  like 'rising' and 'falling' are modified using\nnon-atomic read-modify-write operations.
  Since every gpio chip instance\nrepresents an entire bank of 32 pins, if 'mediatek_gpio_irq_type()'
  is\ncalled concurrently for different IRQs on the same bank a possible overwrite\n\
  of each other's configuration is possible. Thus, protect this state with\n'gpio_generic_lock_irqsave'
  lock in the same way it is handled in irp_chip\n'mediatek_gpio_irq_mask()' and 'mediatek_gpio_irq_unmask()'
  callbacks."
