title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rtrs-clt:
  Reset cid to con_num - 1 to stay in bounds\n\nIn the function init_conns(), after
  the create_con() and create_cm() for\nloop if something fails. In the cleanup for
  loop after the destroy tag, we\naccess out of bound memory because cid is set to
  clt_path->s.con_num.\n\nThis commits resets the cid to clt_path->s.con_num - 1,
  to stay in bounds\nin the cleanup loop later."
