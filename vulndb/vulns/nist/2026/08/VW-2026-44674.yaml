title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsockmap:
  Fix use-after-free in udp_bpf_recvmsg()\n\nsyzbot reported use-after-free of struct
  sk_msg in sk_msg_recvmsg(). [0]\n\nsk_msg_recvmsg() peeks sk_msg from psock->ingress_msg
  under a lock,\nbut its processing is lockless.\n\nThus, sk_msg_recvmsg() must be
  serialised by callers, otherwise\nmultiple threads could touch the same sk_msg.\n\
  \nFor example, TCP uses lock_sock(), and AF_UNIX uses unix_sk(sk)->iolock.\n\nInitially,
  udp_bpf_recvmsg() had used lock_sock(), but the cited\ncommit removed it.\n\nLet's
  serialise sk_msg_recvmsg() with lock_sock() in udp_bpf_recvmsg().\n\nNote that holding
  spin_lock_bh(&sk->sk_receive_queue.lock) is not\nan option due to copy_page_to_iter()
  in sk_msg_recvmsg().\n\n[0]:\nBUG: KASAN: slab-use-after-free in sk_msg_recvmsg+0xb54/0xc30
  net/core/skmsg.c:428\nRead of size 4 at addr ffff88814cdcf000 by task syz.0.24/6020\n\
  \nCPU: 1 UID: 0 PID: 6020 Comm: syz.0.24 Not tainted syzkaller #0 PREEMPT(full)\n\
  Hardware "
