title: In MongoDB Connector for BI, the description text of a collection's JSON 
  schema validator is incorporated into the comment text of the DDL returned by 
  SHOW CREATE statements without complete escaping of backslash characters. A 
  user with permission to modify a collection's schema validator, in deployments
  configured to build their SQL schema from those validators, can cause 
  additional SQL text to be embedded in that generated output. If an operator or
  automated tool later replays that generated statement against a SQL server, 
  the additional text is executed with the privileges of that session.
