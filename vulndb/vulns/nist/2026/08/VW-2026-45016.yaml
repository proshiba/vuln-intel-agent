title: A vulnerability was detected in opensourcepos Open Source Point of Sale 
  up to 3.4.2. This affects the function Login::index of the file 
  app/Config/Filters.php of the component Login Endpoint. The manipulation 
  results in improper restriction of excessive authentication attempts. The 
  attack may be launched remotely. The attack requires a high level of 
  complexity. It is indicated that the exploitability is difficult. The exploit 
  is now public and may be used. The project was informed of the problem early 
  through an issue report but has not responded yet.
