title: "In the Linux kernel, the following vulnerability has been resolved:\n\npower:
  supply: max17040: handle missing status supplier\n\nMAX17040 does not report charger
  state itself, so the driver forwards\nPOWER_SUPPLY_PROP_STATUS to a supplier power
  supply. If no supplier is\nregistered, power_supply_get_property_from_supplier()
  returns -ENODEV and\nleaves the output value untouched.\n\nmax17040_get_property()
  currently ignores that error and returns success,\nso userspace can read an uninitialized
  status value from the battery power\nsupply. This happens on systems that use the
  fuel gauge without a charger\nsupplier relationship in firmware.\n\nReturn POWER_SUPPLY_STATUS_UNKNOWN
  when no supplier provides STATUS, and\npropagate other supplier lookup errors."
