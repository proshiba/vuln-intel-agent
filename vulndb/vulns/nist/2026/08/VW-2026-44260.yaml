title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  reject user command submission without a command BO\n\namdxdna_drm_submit_execbuf()
  passes the user-supplied command BO handle\nstraight into amdxdna_cmd_submit() with
  drv_cmd == NULL. When the handle\nis AMDXDNA_INVALID_BO_HANDLE (0), the block that
  fetches job->cmd_bo is\nskipped, leaving it NULL, and no check rejects it on the
  user path (the\n!job->cmd_bo guard lives inside the != INVALID branch).\n\nThe job
  is then armed and pushed to the DRM scheduler.\naie2_sched_job_run() takes the drv_cmd
  == NULL path and calls\namdxdna_cmd_set_state(job->cmd_bo) -> amdxdna_gem_vmap(NULL)
  ->\nto_gobj(NULL)->dev, a NULL pointer dereference in the drm_sched worker.\nA process
  with access to the accel node on a system with a probed AMD NPU\ncan trigger a kernel
  oops with a single AMDXDNA_EXEC_CMD ioctl\n(cmd_handles = 0).\n\nOnly internal driver
  commands (SYNC_DEBUG_BO / ATTACH_DEBUG_BO)\nlegitimately pass AMDXDNA_INVALID_BO_HANDLE"
