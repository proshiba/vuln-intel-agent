title: "RansomLook contains insufficient resource validation in the analysis PDF generation
  functionality. Analysis documents are converted from Markdown to HTML and passed
  to WeasyPrint for PDF rendering. Prior to the fix, WeasyPrint used its default URL
  fetcher, allowing resource references contained in an analysis to be resolved without
  restrictions.\n\nAn authenticated attacker able to create or modify an analysis
  could embed crafted resource references using schemes such as file:// or http://.
  When the analysis was subsequently rendered as PDF, WeasyPrint would process these
  references with the privileges and network access of the RansomLook server.\n\n\
  A malicious file:// reference could cause the renderer to access arbitrary files
  readable by the RansomLook process, potentially exposing sensitive configuration,
  credentials, or other local data through rendered resources. Network URLs could
  cause the server to initiate requests to localhost, internal network services, or
