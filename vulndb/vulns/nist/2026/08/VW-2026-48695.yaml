title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  stop estimator after disabled calc phase\n\nIPVS estimator kthread 0 starts with
  zeroed chain and tick limits until\nits initial calculation phase completes. If
  network namespace teardown\nclears ipvs->enable during that phase, ip_vs_est_calc_phase()
  can return\nwithout installing positive limits.\n\nThe kthread can then continue
  into its main loop and drain\nest_temp_list with zero chain_max, tick_max and est_max_count
  values.\nEach enqueue consumes one available tick row, but est_count never\nreaches
  the zero est_max_count value. After all rows are consumed, the\nrow lookup returns
  IPVS_EST_NTICKS and ip_vs_enqueue_estimator() writes\npast the ticks and tick_len
  arrays.\n\nExit kthread 0 after the calculation phase if the kthread is stopping
  or\nIPVS has been disabled. That keeps temporary estimators from being\ndrained
  after the limits failed to initialize.\n\nEstimator kthreads can now self-exit before
  teardown or reload stop"
