title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix overrunning reservations in ringbuf\n\nThe BPF ring buffer internally is implemented
  as a power-of-2 sized circular\nbuffer, with two logical and ever-increasing counters:
  consumer_pos is the\nconsumer counter to show which logical position the consumer
  consumed the\ndata, and producer_pos which is the producer counter denoting the
  amount of\ndata reserved by all producers.\n\nEach time a record is reserved, the
  producer that \"owns\" the record will\nsuccessfully advance producer counter. In
  user space each time a record is\nread, the consumer of the data advanced the consumer
  counter once it finished\nprocessing. Both counters are stored in separate pages
  so that from user\nspace, the producer counter is read-only and the consumer counter
  is read-write.\n\nOne aspect that simplifies and thus speeds up the implementation
