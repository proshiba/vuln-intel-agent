title: "In the Linux kernel, the following vulnerability has been resolved:\n\npmdomain:
  imx93-blk-ctrl: Extract PHY as shared domain for DSI/CSI\n\nThe MIPI DSI and CSI
  domains share control bits for clock and reset, which\ncan lead to incorrect behavior
  if one domain disables the shared resource\nwhile the other is still active.\n\n\
  To fix the issue, introduce a shared MIPI PHY power domain to own the\ncommon resources
  and make DSI and CSI its subdomains. This ensures the\nshared bits are properly
  managed and not disabled while still in use."
