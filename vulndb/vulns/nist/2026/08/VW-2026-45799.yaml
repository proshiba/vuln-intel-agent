title: A flaw was found in the governance-policy-addon-controller component of 
  Red Hat Advanced Cluster Management for Kubernetes. A user with permissions to
  annotate the namespaced ManagedClusterAddOn resource can override the 
  governance-policy container image. This allows an attacker to run a controlled
  image with cluster-admin privileges on the managed cluster, leading to 
  arbitrary code execution and privilege escalation.
