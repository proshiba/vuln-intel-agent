title: A weakness has been identified in Razer RzUpdateService 1.10.14.0. 
  Affected by this vulnerability is an unknown functionality of the file 
  C:\Program Files (x86)\Razer\RzUpdateEngineService\RzUpdateService.exe of the 
  component Named Pipe Handler. Executing a manipulation of the argument 
  lpThreadParameter can lead to improper privilege management. The attack 
  requires local access. The exploit has been made available to the public and 
  could be used for attacks. The vendor was contacted early about this 
  disclosure.
