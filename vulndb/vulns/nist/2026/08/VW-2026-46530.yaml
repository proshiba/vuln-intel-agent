title: 'fastify is a fast and low overhead web framework for Node.js. Impact: the
  fix for CVE-2026-3635 added a guard on the forwarded-header reads used to derive
  the request host, protocol, hostname, ip, and ips values, checking the connecting
  address. That guard closes the IP, CIDR, and custom-function forms of trustProxy
  correctly, because those forms compile to predicates that inspect the connecting
  address. The hop-count form, where trustProxy is set to a number, compiles to a
  predicate that structurally ignores the address, so the guard is always satisfied
  for any hop count of one or more. Applications configured with a numeric trustProxy
  value, such as trustProxy set to 1 for a single reverse proxy, remain vulnerable:
  an attacker who can reach the Fastify origin directly, bypassing the front-facing
  proxy, can spoof the forwarded request fields exactly as in the unpatched version.
  The impact class matches the parent CVE-2026-3635, including host injection in generated
  URLs, HTTPS-enforce'
