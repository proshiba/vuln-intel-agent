title: 'LMDeploy deserializes disaggregated-serving peer messages with pickle. The
  handle_zmq_recv coroutine in lmdeploy/pytorch/disagg/conn/engine_conn.py reads peer-to-peer
  cache-free requests with recv_pyobj(), which deserializes the received bytes with
  pickle.loads(), and the isinstance check against DistServeCacheFreeRequest runs
  only after deserialization has already completed. The peer that supplies those bytes
  is caller-controlled: p2p_connect passes remote_engine_endpoint_info.zmq_address
  from the request body to connect() on the ZMQ PULL socket, and the POST /distserve/p2p_initialize
  and /distserve/p2p_connect endpoints in lmdeploy/serve/openai/api_server.py apply
  no authentication unless the server is started with api_keys, which defaults to
  None. A remote attacker can direct an engine to pull from a ZMQ endpoint under their
  control and execute arbitrary code in the engine process. Deployments that do not
  enable disaggregated serving are not affected, because the receive loop is onl'
