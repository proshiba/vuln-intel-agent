title: SiYuan versions up to and including v3.7.2 (fixed in v3.7.4) contain an 
  information disclosure vulnerability in the /api/asset/getFileAnnotation 
  endpoint, which returns .sya PDF-annotation file content without a 
  publish-access check. Because the endpoint is gated only by CheckAuth (unlike 
  the /assets/* route, which enforces publish access and password), an anonymous
  reader (when publish authentication is disabled) or any publish RoleReader who
  knows an asset path can read the private PDF annotations (highlights and 
  notes) of publish-forbidden, password-protected, or unpublished documents. The
  issue is limited to non-encrypted notebooks; encrypted-box annotations are not
  exposed.
