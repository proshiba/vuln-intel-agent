title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: uvc: clamp SEND_RESPONSE length to the response buffer\n\nuvc_send_response()
  builds the UVC control response from a user-supplied\nstruct uvc_request_data:\n\
  \n\treq->length = min_t(unsigned int, uvc->event_length, data->length);\n\t...\n\
  \tmemcpy(req->buf, data->data, req->length);\n\nreq->length is clamped to uvc->event_length,
  which is taken from the\nhost control request wLength (up to UVC_MAX_REQUEST_SIZE,
  64), and to\ndata->length, which comes from the UVCIOC_SEND_RESPONSE ioctl and is\n\
  only checked for being negative.  The source buffer data->data is only\n60 bytes,
  so a response with uvc->event_length and data->length both\ngreater than 60 makes
  memcpy() read past the end of data->data.\n\nClamp req->length to sizeof(data->data)
  as well."
