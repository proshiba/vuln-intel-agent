title: A stack-based buffer overflow vulnerability exists in BlueZ, the Linux 
  Bluetooth protocol stack. A remote user within Bluetooth radio range can send 
  a specially crafted Extended Inquiry Response (EIR) packet that causes a 
  buffer overflow when the target device performs Bluetooth discovery. This 
  vulnerability can lead to a Denial of Service (DoS) by crashing the bluetoothd
  service and may allow for arbitrary code execution.
