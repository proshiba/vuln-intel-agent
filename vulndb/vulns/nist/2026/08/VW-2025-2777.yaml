title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix use-after-free in ntfs_attr_find()\n\nPatch series \"ntfs: fix bugs about Attribute\"\
  , v2.\n\nThis patchset fixes three bugs relative to Attribute in record:\n\nPatch
  1 adds a sanity check to ensure that, attrs_offset field in first\nmft record loading
  from disk is within bounds.\n\nPatch 2 moves the ATTR_RECORD's bounds checking earlier,
  to avoid\ndereferencing ATTR_RECORD before checking this ATTR_RECORD is within\n\
  bounds.\n\nPatch 3 adds an overflow checking to avoid possible forever loop in\n\
  ntfs_attr_find().\n\nWithout patch 1 and patch 2, the kernel triggersa KASAN use-after-free\n\
  detection as reported by Syzkaller.\n\nAlthough one of patch 1 or patch 2 can fix
  this, we still need both of\nthem.  Because patch 1 fixes the root cause, and patch
  2 not only fixes\nthe direct cause, but also fixes the potential out-of-bounds bug.\n\
