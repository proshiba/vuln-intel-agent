title: 'The FiboSearch  WordPress plugin before 1.34.1 does not consistently exclude
  password-protected products from its unauthenticated AJAX endpoints, allowing unauthenticated
  users to disclose and enumerate password-protected products and their metadata without
  entering the product password. Two endpoints are affected: the autocomplete search
  endpoint (dgwt_wcas_ajax_search) and the Details Panel endpoint (dgwt_wcas_result_details)
  when queried for taxonomy details.'
