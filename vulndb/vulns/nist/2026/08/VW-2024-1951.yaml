title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  fix page frag corruption on page fault\n\nSteffen reported a TCP stream corruption
  for HTTP requests\nserved by the apache web-server using a cifs mount-point\nand
  memory mapping the relevant file.\n\nThe root cause is quite similar to the one
  addressed by\ncommit 20eb4f29b602 (\"net: fix sk_page_frag() recursion from\nmemory
  reclaim\"). Here the nested access to the task page frag\nis caused by a page fault
  on the (mmapped) user-space memory\nbuffer coming from the cifs file.\n\nThe page
  fault handler performs an smb transaction on a different\nsocket, inside the same
  process context. Since sk->sk_allaction\nfor such socket does not prevent the usage
  for the task_frag,\nthe nested allocation modify \"under the hood\" the page frag\n\
  in use by the outer sendmsg call, corrupting the stream.\n\nThe overall relevant
  stack trace looks like the following:\n\nhttpd 78268 [001] 3461630.850950:     \
  \ probe:tcp_sendmsg_locked:\n        ffffffff9146"
