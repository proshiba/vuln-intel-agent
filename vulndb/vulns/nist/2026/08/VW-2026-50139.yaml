title: The personal access token removal query selects 
  from PersonalAccessTokenDB but filters on columns of Session, with no join 
  between them. SQLAlchemy resolves that as an implicit cross join, so the 
  filter does not constrain the delete to the calling user's own token in the 
  way the code reads as intending. This way a user can delete all personal 
  access tokens in the system.
