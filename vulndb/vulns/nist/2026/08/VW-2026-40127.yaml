title: "Apache Polaris did not consistently validate storage locations supplied during
  table and view registration.\n\nAn authenticated principal with permission to register
  a table or view could, depending on the affected release and registration path,
  cause Polaris to use the catalog's storage credentials to read a caller-selected
  Iceberg metadata file before verifying that the file was within the catalog's allowed
  storage locations.\n\nIf the catalog's underlying credentials could read an object
  outside that boundary, this could disclose limited information from the object.\n\
  \n\nPolaris could also accept registration metadata located within an allowed location
  that contained references to storage locations outside the allowed boundary.\n\n\
  This second condition did not itself cause Polaris to read the referenced external
  locations during registration.\n\n\nThe demonstrated impact is limited to confidentiality.\n\
  \nNo unauthorized data modification or availability impact has been demonstrated.\n\
