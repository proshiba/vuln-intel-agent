title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix overflow in passthrough ioctl bounds check\n\nsmb2_ioctl_query_info()
  validates the PASSTHRU_FSCTL response payload\nbefore copying it to userspace.\n\
  \nThe payload offset and length both come from 32-bit fields. The bounds\ncheck
  currently adds OutputOffset and qi.input_buffer_length directly, so\nthe addition
  can wrap in 32-bit arithmetic before the result is compared\nagainst the response
  buffer length.\n\nA malicious server can use a large OutputOffset and a small OutputCount\n\
  to make the wrapped sum pass the bounds check. The later copy_to_user()\nthen reads
  from io_rsp + OutputOffset, outside the response buffer.\n\nUse size_add() for the
  offset plus length check so overflow is treated as\nout of bounds."
