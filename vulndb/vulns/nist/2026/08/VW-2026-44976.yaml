title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  udp_tunnel: fix memory leak in udp_tunnel_nic_unregister()\n\nsyzbot reported a
  memory leak [1] in the UDP tunnel NIC offload code.\n\nWhen device registration
  fails (e.g. in register_netdevice()), netdev core\nunwinds by sending a single NETDEV_UNREGISTER
  notification. If work was queued\nduring NETDEV_REGISTER (utn->work_pending is set),
  udp_tunnel_nic_unregister()\nreturns early:\n\n\tif (utn->work_pending)\n\t\treturn;\n\
  \nBecause failed registrations do not enter netdev_wait_allrefs_any(), no\nsubsequent
  NETDEV_UNREGISTER rebroadcast will ever occur. As a result, the\nstruct udp_tunnel_nic
  allocated in udp_tunnel_nic_alloc() is leaked\npermanently.\n\nFix this by removing
  the early return. Instead, synchronously cancel any\npending work with cancel_delayed_work_sync()
  before freeing @utn.\n\nTo be able to call cancel_delayed_work_sync() while holding
  RTNL (the work also\nneeds RTNL), switch udp_tunnel_nic_device_sync_work() to rtnl_"
