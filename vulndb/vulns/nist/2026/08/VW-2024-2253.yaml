title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntty:
  serial: qcom-geni-serial: fix slab-out-of-bounds on RX FIFO buffer\n\nDriver's probe
  allocates memory for RX FIFO (port->rx_fifo) based on\ndefault RX FIFO depth, e.g.
  16.  Later during serial startup the\nqcom_geni_serial_port_setup() updates the
  RX FIFO depth\n(port->rx_fifo_depth) to match real device capabilities, e.g. to
  32.\n\nThe RX UART handle code will read \"port->rx_fifo_depth\" number of words\n\
  into \"port->rx_fifo\" buffer, thus exceeding the bounds.  This can be\nobserved
  in certain configurations with Qualcomm Bluetooth HCI UART\ndevice and KASAN:\n\n\
  \  Bluetooth: hci0: QCA Product ID   :0x00000010\n  Bluetooth: hci0: QCA SOC Version\
  \  :0x400a0200\n  Bluetooth: hci0: QCA ROM Version  :0x00000200\n  Bluetooth: hci0:
  QCA Patch Version:0x00000d2b\n  Bluetooth: hci0: QCA controller version 0x02000200\n\
  \  Bluetooth: hci0: QCA Downloading qca/htbtfw20.tlv\n  bluetooth hci0: Direct firmware
  load for qca/htbtfw20.tlv failed with e"
