title: The Code Embed WordPress plugin prior to version 2.6.1 is vulnerable to 
  stored Cross-Site Scripting (XSS) through the external URL embed feature in 
  post content. The vulnerable code scans rendered content for URL embed tokens,
  fetches the remote URL, and inserts the remote response body into the page 
  without output sanitization or an `unfiltered_html` capability check. This 
  allows a Contributor attacker to submit a pending post containing an 
  inert-looking URL token that executes attacker-controlled JavaScript when an 
  Administrator or Editor previews or reviews the post. This is distinct from 
  CVE-2026-2512, which affected custom field meta values up to version 2.5.1. 
  This vector affects version 2.6 and uses the documented external URL embed 
  feature in post content. This particular issue is patched in version 2.6.1.
