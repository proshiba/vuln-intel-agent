title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid10:
  reset read_slot when reusing r10bio for discard\n\nput_all_bios() always drops devs[i].bio,
  but it only drops\ndevs[i].repl_bio when r10_bio->read_slot < 0. If discard reuses
  an\nr10bio that was previously used for a read, read_slot can still be\nnon-negative,
  and discard cleanup can skip bio_put() on repl_bio.\n\nReset read_slot to -1 when
  preparing an r10bio for discard so the\nreplacement bio is always released correctly."
