title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Handle layout stid in nfsd4_drop_revoked_stid()\n\nnfsd4_drop_revoked_stid() has
  no SC_TYPE_LAYOUT case, so when a\nclient sends FREE_STATEID for an admin-revoked
  layout stid, the\ndefault branch releases cl_lock and returns without unhashing
  or\nreleasing the stid.  The stid remains in the IDR and on the\nper-client list
  until the client is destroyed.\n\nRemove the layout stid from the per-client list
  and call\nnfs4_put_stid() to drop the creation reference.  When the\nrefcount reaches
  zero, nfsd4_free_layout_stateid() handles the\nremaining cleanup: cancelling the
  fence worker, removing from\nthe per-file list, and freeing the slab object."
