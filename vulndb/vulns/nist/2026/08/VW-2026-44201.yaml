title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  HWS, fix matcher leak on resize target setup failure\n\nhws_bwc_matcher_move() allocates
  a replacement matcher before setting it\nas the resize target. If mlx5hws_matcher_resize_set_target()
  fails, the\nreplacement matcher is not attached anywhere and is leaked.\n\nFix the
  leak by destroying the replacement matcher before returning from\nthe resize-target
  failure path.\n\nThe bug was first flagged by an experimental analysis tool we are\n\
  developing for kernel memory-management bugs while analyzing\nv6.13-rc1. The tool
  is still under development and is not yet publicly\navailable. Manual inspection
  confirms that the bug is still\npresent in v7.1.1.\n\nAn x86_64 allyesconfig build
  showed no new warnings. As we do not have a\nmlx5 HWS-capable device to test with,
  no runtime testing was able to be\nperformed."
