title: filebrowser versions before 2.63.19 contain an out-of-scope file deletion
  vulnerability in the TUS upload cache eviction mechanism that allows 
  authenticated users with only Create permission to delete arbitrary files 
  outside their scope. Attackers can swap an ancestor directory with a symlink 
  during the cache TTL window to redirect the raw os.Remove call to an 
  out-of-scope target, bypassing ScopedFs scope guards and Perm.Delete checks.
