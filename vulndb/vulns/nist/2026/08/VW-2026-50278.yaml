title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/vfio_ccw:
  Free all memory if cp_init() fails\n\nThe routine cp_free() is called to unpin/free
  any memory once an I/O\nis completed successfully, or if cp_prefetch() fails. But
  if cp_init()\nfails, and cp->initialized is not enabled, the same routine cannot
  be\nused to free all the memory.\n\nAn attempt to address this exists in ccwchain_handle_ccw(),
  where a\nsingle call to ccwchain_free() is made for the currently-processed\nCCW
  segment. But this will leak other segments (created as a result\nof a Transfer in
  Channel) that had been allocated as part of the same\nchannel program.\n\nAddress
  this by performing the cleanup outside of the recursive\nccwchain_handle_ccw()/ccwchain_loop_tic()
  logic."
