title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  fw_tracer, return NULL on create error\n\nTracer creation can fail by returning
  either NULL or ERR_PTR.\nThe return value is stored without a check on the device,
  and users\ntreat ERR_PTR and NULL the same way.\nThis also causes a crash in the
  core dump logic, which is missing the\nERR_PTR check and ends up dereferencing it,
  as shown in the trace below.\n\nSwitch tracer creation to return NULL on failure
  only, so callers only\nneed a single NULL check.\n\n  Internal error: Oops: 0000000096000006
  [#1]  SMP\n  Modules linked in: mlx5_ib ib_uverbs ib_core ipv6 mlx5_core\n  CPU:
  1 UID: 0 PID: 12 Comm: kworker/u16:0 Not tainted 6.19.7 #1 PREEMPT(none)\n  Workqueue:
  mlx5_health0001:01:00.0 mlx5_fw_reporter_err_work [mlx5_core]\n  pstate: a3400009
  (NzCv daif +PAN -UAO +TCO +DIT -SSBS BTYPE=--)\n  pc : mlx5_fw_tracer_trigger_core_dump_general+0x58/0xe0
  [mlx5_core]\n  lr : mlx5_fw_tracer_trigger_core_dump_general+0x40/0xe0 [mlx5_core"
