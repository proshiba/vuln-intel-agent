title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - fix heap-buffer-overflow in ims_pcu_process_data()\n\nThe `ims_pcu_process_data()`
  processes incoming URB data byte by byte.\nHowever, it fails to check if the `read_pos`
  index exceeds\nIMS_PCU_BUF_SIZE.\n\nIf a malicious USB device sends a packet larger
  than IMS_PCU_BUF_SIZE,\n`read_pos` will increment indefinitely. Moreover, since
  `read_pos` is\nlocated immediately after `read_buf`, the attacker can overwrite\n\
  `read_pos` itself to arbitrarily control the index.\n\nThis manipulated `read_pos`
  is subsequently used in\n`ims_pcu_handle_response()` to copy data into `cmd_buf`,
  leading to a\nheap buffer overflow.\n\nSpecifically, an attacker can overwrite the
  `cmd_done.wait.head` located\nat offset 136 relative to `cmd_buf` in the `ims_pcu_handle_response()`.\n\
  Consequently, when the driver calls `complete(&pcu->cmd_done)`, it\ntriggers a control
