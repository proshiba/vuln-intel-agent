title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Take mmap_lock in zap_pages()\n\nzap_vma_range() requires the owning mm's mmap_lock
  to be held.\n\nTaking mmap_read_lock under arena->lock would AB-BA against\narena_vm_close()
  and arena_map_mmap(), both of which run with\nmmap_write_lock held and then acquire
  arena->lock. Instead drop\narena->lock, mmget_not_zero() the vma's mm, take mmap_read_lock,
  and\nre-resolve the vma via find_vma() since it may have been unmapped or\nreplaced
  while waiting.\n\nTrack processed vmls with a per-call generation in vml->zap_gen
  and\nserialize zap_pages() callers with a new arena->zap_mutex so\nconcurrent callers
  on different uaddr ranges do not mark each other's\nvmls processed before the zap
  is done."
