title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  reject command submission on devices without a submit op\n\namdxdna_cmd_submit()
  calls xdna->dev_info->ops->cmd_submit()\nunconditionally, but only aie2_dev_ops
  defines that callback.\naie4_vf_ops (the AIE4 SR-IOV virtual function) does not,
  so a user\nAMDXDNA_EXEC_CMD ioctl on an AIE4 device reaches a NULL function-pointer\n\
  call and oopses the kernel. AIE4 submits work through a mapped user queue\nand doorbell,
  not this ioctl path.\n\nReject the submission early with -EOPNOTSUPP when the device
  provides no\ncmd_submit op, so the shared EXEC ioctl is a clean no-op on such devices.\n\
  \nFound by 0sec automated security-research tooling (https://0sec.ai)."
