title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Don't move a peeked OOB message onto the pending queue\n\nrxrpc_recvmsg_oob() takes
  a received oob message off recvmsg_oobq and,\nif a response is needed, moves it
  onto the pending_oobq tree. However,\nonly the unlink from recvmsg_oobq is guarded
  by MSG_PEEK; the move onto\npending_oobq always runs.\n\nAs a result, reading a
  challenge with MSG_PEEK leaves the skb on\nrecvmsg_oobq while also adding it to
  pending_oobq. Since struct\nsk_buff's rbnode shares storage with its next and prev
  pointers,\nrb_insert_color() overwrites the list linkage, and the skb, which holds\n\
  a single reference, becomes reachable from both queues at once.\n\nWhen the socket
  is closed both queues are drained in turn. While\ndraining recvmsg_oobq, __skb_unlink()
  follows the next and prev\npointers that rbnode has overwritten and writes to a
