title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/dp/mst:
  fix buffer overflows in sideband chunk accumulation\n\ndrm_dp_sideband_append_payload()
  has three related bugs when processing\ndevice-provided sideband reply data:\n\n\
  1. Zero-length curchunk_len underflow: msg_len is a 6-bit field taken\n   directly
  from the DP sideband header. If a device sends msg_len=0,\n   curchunk_len is set
  to zero. The condition (curchunk_idx >= curchunk_len)\n   is immediately true, and
  curchunk_len-1 wraps to 255 (u8 underflow).\n   drm_dp_msg_data_crc4() reads 255
  bytes from chunk[48], then memcpy()\n   writes 255 bytes into msg[], both far out
  of bounds.\n\n2. chunk[48] overflow: curchunk_len can reach 63 (6-bit field). chunk[]
  is\n   only 48 bytes. Multi-iteration payload assembly appends 16-byte blocks\n\
  \   until curchunk_idx reaches curchunk_len, writing up to 15 bytes past\n   the
  end of chunk[] into msg[].\n\n3. msg[256] overflow: each chunk contributes (curchunk_len-1)
  bytes to\n   msg[]. N"
