title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  ump: fix double free of out_cvts on rawmidi error\n\nsnd_ump_attach_legacy_rawmidi()
  allocates the legacy conversion array\nump->out_cvts and, on the snd_rawmidi_new()
  error path, frees it with\nkfree() but leaves ump->out_cvts pointing at the freed
  memory.  When the\nendpoint is later torn down, snd_ump_endpoint_free() frees ump->out_cvts\n\
  a second time, resulting in a double free.\n\nThe host snd-usb-audio driver attaches
  the legacy rawmidi for any USB\nMIDI 2.0 (UMP) device, so a device that makes snd_rawmidi_new()
  fail\nreaches this path on enumeration.\n\nClear ump->out_cvts after freeing it
  on the error path so it is not\nfreed again during teardown.\n\nDiscovered by XBOW,
  triaged by Baul Lee <baul.lee@xbow.com>"
