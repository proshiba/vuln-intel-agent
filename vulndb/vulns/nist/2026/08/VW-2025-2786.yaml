title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix use-after-free bug of ns_writer on remount\n\nIf a nilfs2 filesystem is downgraded
  to read-only due to metadata\ncorruption on disk and is remounted read/write, or
  if emergency read-only\nremount is performed, detaching a log writer and synchronizing
  the\nfilesystem can be done at the same time.\n\nIn these cases, use-after-free
  of the log writer (hereinafter\nnilfs->ns_writer) can happen as shown in the scenario
  below:\n\n Task1                               Task2\n --------------------------------\
  \    ------------------------------\n nilfs_construct_segment\n   nilfs_segctor_sync\n\
  \     init_wait\n     init_waitqueue_entry\n     add_wait_queue\n     schedule\n\
  \                                     nilfs_remount (R/W remount case)\n\t\t\t\t\
  \       nilfs_attach_log_writer\n                                         nilfs_detach_log_writer\n\
  \                                           nilfs_segctor_destroy\n            \
  \                      "
