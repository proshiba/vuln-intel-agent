title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  dst_metadata: fix false-positive memcpy overflow in tun_dst_unclone\n\nkmalloc_flex()
  in metadata_dst_alloc() sets __counted_by for the\nstructure to the options_len,
  which is then initialized to zero.\nLater, we're initializing the structure by copying
  the tunnel info\ntogether with the options, and this triggers a warning for a potential\n\
  memcpy overflow, since the compiler estimates that the options can't\nfit into the
  structure, even though the memory for them is actually\nallocated.\n\n memcpy: detected
  buffer overflow: 104 byte write of buffer size 96\n WARNING: CPU: X PID: Y at lib/string_helpers.c:1036
  __fortify_report\n  skb_tunnel_info_unclone+0x179/0x190\n  geneve_xmit+0x7fe/0xe00\n\
  \nThe issue is triggered when built with clang and source fortification.\n\nFix
  that by doing the copy in two stages: first - the main data with\nthe options_len,
  then the options.  This way the correct length should\nbe known at the time of t"
