title: NLTK versions before 3.10.3 contain a path sandbox bypass vulnerability 
  in corpus-reader constructors that allows attackers to read files outside the 
  intended data root. Attackers can supply arbitrary corpus root paths to 
  LinThesaurusCorpusReader and PanLexLiteCorpusReader constructors to access 
  filesystem content and SQLite databases outside the pathsec sandbox boundary.
