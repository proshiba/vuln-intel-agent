title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  rebase copied fsdlm LVB pointers in locking_state\n\nThe locking_state debugfs iterator
  snapshots struct ocfs2_lock_res by\nvalue under ocfs2_dlm_tracking_lock and later
  formats that copy in\nocfs2_dlm_seq_show().  That is fine for the inline fields,
  but the\nuserspace fsdlm stack stores the LVB through lksb_fsdlm.sb_lvbptr.  Once\n\
  the iterator drops the tracking lock, a copied non-NULL sb_lvbptr still\npoints
  into the original lockres owner, so teardown can free that\ncontainer before the
  debugfs dump walks the raw LVB bytes.\n\nRebase the copied sb_lvbptr to the copied
  l_lksb before dumping the raw\nLVB.  The seq snapshot already carries the inline
  LVB storage reserved in\nstruct ocfs2_dlm_lksb, so the debugfs reader can dump the
  copied bytes\nwithout borrowing the original lockres lifetime.\n\nThe buggy scenario
  involves two paths, with each column showing the order\nwithin that path:\n\nlocking_state
  reader:                 "
