title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject redirect helpers without a bpf_net_context\n\nThe bpf_redirect*() helpers
  and skb_do_redirect() obtain the per-task\nbpf_redirect_info via bpf_net_ctx_get_ri(),
  which dereferences the\ncurrent->bpf_net_context unconditionally. That context is
  established\non the paths that run tc BPF such as sch_handle_{ingress,egress}(),\n\
  *except* for the case where {cls,act}_bpf was attached to a proper\nqdisc. A program
  running from there reaches the NULL deref in two ways:\n\n* It calls bpf_redirect()
  directly, which dereferences the context at\n  the top of the helper:\n\n     tc
  qdisc add dev eth0 root handle 1: red limit 1MB min 10KB max 20KB \\\n        avpkt
  1000 burst 100 qevent early_drop block 10\n     tc filter add block 10 pref 1 bpf
  obj redirect.o\n\n* It simply returns TC_ACT_REDIRECT without helper call: tcf_qevent_handle()\n\
  \  then dispatches to skb_do_redirect(), which dereferences the context\n\nRather
  than extending bpf_ne"
