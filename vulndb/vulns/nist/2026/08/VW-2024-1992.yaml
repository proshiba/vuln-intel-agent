title: "In the Linux kernel, the following vulnerability has been resolved:\n\nof:
  module: add buffer overflow check in of_modalias()\n\nIn of_modalias(), if the buffer
  happens to be too small even for the 1st\nsnprintf() call, the len parameter will
  become negative and str parameter\n(if not NULL initially) will point beyond the
  buffer's end. Add the buffer\noverflow check after the 1st snprintf() call and fix
  such check after the\nstrlen() call (accounting for the terminating NUL char)."
