title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrtnetlink:
  make sure to refresh master_dev/m_ops in __rtnl_newlink()\n\nWhile looking at one
  unrelated syzbot bug, I found the replay logic\nin __rtnl_newlink() to potentially
  trigger use-after-free.\n\nIt is better to clear master_dev and m_ops inside the
  loop,\nin case we have to replay it."
