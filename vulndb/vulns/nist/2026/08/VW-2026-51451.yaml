title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (sht3x) Fix unaligned accesses\n\nSashiko reports:\n\nIn sht3x_update_client(),
  the 16-bit temperature and humidity values are\nextracted from a stack-allocated
  byte array using be16_to_cpup(). The\npointers passed to this function are calculated
  as buf and buf + 3. Since\nthe difference between the two pointers is an odd number
  of bytes, at\nleast one of them is guaranteed to be at an unaligned offset.\n\n\
  This will trigger an alignment fault on strict-alignment architectures\nsuch as
  ARMv5 or SPARC, resulting in a kernel panic.\n\nFix the problem by using get_unaligned_be16()
  instead of be16_to_cpup(),\nand put_unaligned_be16() instead of cpu_to_be16()."
