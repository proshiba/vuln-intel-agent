title: A flaw was found in the Data Science Pipelines Operator (DSPO). A 
  namespace editor can exploit a vulnerability in the 
  spec.database.customExtraParams field, which allows for the injection of 
  dangerous parameters into the MySQL Data Source Name (DSN) string. By 
  manipulating these parameters, an attacker can enable LOCAL INFILE 
  functionality and exfiltrate sensitive files, such as the service account 
  token, from the operator pod. This can lead to privilege escalation, allowing 
  a namespace editor to gain cluster-admin privileges.
