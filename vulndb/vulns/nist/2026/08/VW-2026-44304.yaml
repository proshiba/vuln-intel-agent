title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntpm:
  Make the TPM character devices non-seekable\n\nThe TPM character devices expose
  a sequential command/response\ninterface, but their open handlers leave FMODE_PREAD
  and FMODE_PWRITE\nenabled.\n\nAfter a command leaves a response pending, pread(fd,
  buf, 16, 0x1400)\npasses 0x1400 as *off to tpm_common_read(). The transfer length
  is\nbounded by response_length, but the offset is used unchecked when\nforming data_buffer
  + *off. A sufficiently large offset therefore causes\nan out-of-bounds heap read
  through copy_to_user() and, if the copy\nsucceeds, an out-of-bounds zero-write through
  the following memset().\n\nPositional I/O does not provide coherent semantics for
  this interface.\nAn arbitrary pread offset cannot represent how much of a response
  has\nbeen consumed sequentially. The write callback always stores a command\nat
  the start of data_buffer, while pwrite() does not update file->f_pos\nand can leave
  the sequential read cursor"
