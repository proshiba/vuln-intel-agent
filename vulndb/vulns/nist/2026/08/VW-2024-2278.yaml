  VF messages during teardown\")\nintroduced a driver state flag, ICE_VF_DEINIT_IN_PROGRESS,
  which is\nintended to prevent some issues with concurrently handling messages from\n\
  VFs while tearing down the VFs.\n\nThis change was motivated by crashes caused while
  tearing down and\nbringing up VFs in rapid succession.\n\nIt turns out that the
  fix actually introduces issues with the VF driver\ncaused because the PF no longer
  responds to any messages sent by the VF\nduring its .remove routine. This results
