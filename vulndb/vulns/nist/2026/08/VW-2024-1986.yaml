title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: Fix div-by-zero in l2cap_le_flowctl_init()\n\nl2cap_le_flowctl_init() can
  cause both div-by-zero and an integer\noverflow since hdev->le_mtu may not fall
  in the valid range.\n\nMove MTU from hci_dev to hci_conn to validate MTU and stop
  the connection\nprocess earlier if MTU is invalid.\nAlso, add a missing validation
  in read_buffer_size() and make it return\nan error value if the validation fails.\n\
  Now hci_conn_add() returns ERR_PTR() as it can fail due to the both a\nkzalloc failure
  and invalid MTU value.\n\ndivide error: 0000 [#1] PREEMPT SMP KASAN NOPTI\nCPU:
  0 PID: 67 Comm: kworker/u5:0 Tainted: G        W          6.9.0-rc5+ #20\nHardware
  name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.15.0-1 04/01/2014\nWorkqueue:
  hci0 hci_rx_work\nRIP: 0010:l2cap_le_flowctl_init+0x19e/0x3f0 net/bluetooth/l2cap_core.c:547\n\
  Code: e8 17 17 0c 00 66 41 89 9f 84 00 00 00 bf 01 00 00 00 41 b8 02 00 00 00 4c\n\
  89 fe 4c 89 e2 89 d9"
