title: vLLM up to and including 0.17.0 allows remote attackers to cause a Denial
  of Service via memory exhaustion. The AsyncMediaIO.fetch_audio and 
  AsyncMediaIO.fetch_image functions in multimodal/inputs.py fetch user-supplied
  media URLs using aiohttp and call r.read() without enforcing a maximum 
  response size, allowing an attacker to exhaust server memory by providing a 
  URL to an arbitrarily large file.
