title: "The Infineon Airoc Wi-Fi driver's transmit callback airoc_mgmt_send() in drivers/wifi/infineon/airoc_wifi.c
  allocates a net_buf from the fixed airoc_pool for every outbound packet. When whd_network_send_ethernet_data()
  returns a synchronous failure, the underlying WHD library does not take ownership
  of the buffer, but the pre-fix driver returned -EIO without releasing it. Each failed
  transmit therefore permanently leaks one buffer from the pool.\n\nairoc_pool is
  small and fixed (AIROC_WIFI_TX_PACKET_POOL_COUNT + AIROC_WIFI_RX_PACKET_POOL_COUNT,
  default 20 buffers) and is shared by WHD's whd_host_buffer_get callback for both
  transmit and receive. Once enough send failures have leaked the pool dry, airoc_wifi_host_buffer_get()
  returns WHD_BUFFER_ALLOC_FAIL for all subsequent allocations, so both transmit and
  the WHD-driven receive path fail and Wi-Fi connectivity is lost until the device
  is rebooted.\n\nThe leak occurs only on the transmit error path. A Wi-Fi-adjacent
  attacker can influence "
