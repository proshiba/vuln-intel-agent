title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/mm:
  Fix handling of _PAGE_UNUSED pte bit\n\nThe _PAGE_UNUSED softbit should not really
  be lying around. Its sole\npurpose is to signal to try_to_unmap_one() and try_to_migrate_one()\n\
  that the page can be discarded instead of being moved / swapped.\n\nKVM has no way
  to know why a page is being unmapped, so it sets the bit\non userspace ptes corresponding
  to unused guest pages every time they\nget unmapped. KVM has no reasonable way to
  clear the bit once the page\nis in use again.\n\nWhile set_ptes() checks and clears
  the bit, other paths that set new\nptes did not. This led to used pages being thrown
  out as if they were\nunused, causing guest corruption.\n\nFix the issue by clearing
  the _PAGE_UNUSED bit for present ptes in\nset_pte(), i.e. whenever a present pte
  is getting set. The check in\nset_ptes() is then redundant and can be removed.\n\
  \nAlso fix gmap_helper_try_set_pte_unused() to only set the bit if the\npte is present;
