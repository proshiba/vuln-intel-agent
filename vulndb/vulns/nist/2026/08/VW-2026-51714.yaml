title: Hermes Agent 0.18.2 prior to 0.19.0 contains a supply chain vulnerability
  in its bundled MCP catalog that allows a remote attacker to execute arbitrary 
  code by compromising a third-party upstream repository referenced via a 
  mutable branch rather than a pinned commit SHA. An attacker who compromises 
  the upstream repository can propagate malicious code to every host that 
  installs the affected catalog entry, with no further action required by the 
  operator.
