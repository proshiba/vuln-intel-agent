title: An OS command injection vulnerability in wg-easy 15.3.0 allows users with
  the clients.create permission to execute arbitrary commands as root by 
  injecting newline-delimited WireGuard PostUp directives into the client name 
  field. The client name is written to the WireGuard configuration file without 
  neutralizing newline characters, allowing injection of arbitrary directives 
  that are executed by wg-quick with root privileges. An attacker with 
  clients.create permission achieves root code execution on the host.
