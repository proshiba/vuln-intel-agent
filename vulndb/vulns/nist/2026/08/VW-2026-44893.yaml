title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  ems_usb: validate CPC message lengths\n\nems_usb_read_bulk_callback() walks CPC
  messages packed in one USB\nreceive buffer.\n\nCheck that each declared message
  fits in the URB payload. Also require the\ntype-specific payload to cover the fields
  used by the CAN, state, error and\noverrun handlers."
