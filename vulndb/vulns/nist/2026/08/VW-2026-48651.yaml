title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNTB:
  ntb_netdev: Preserve RX queue depth on allocation failure\n\nntb_netdev_rx_handler()
  hands the received skb to the network stack\nbefore allocating its replacement.
  If the allocation fails, nothing is\nreposted. Every failure therefore takes one
  buffer out of the RX queue\nwhile the interface remains up, and enough failures
  eventually stall\nreception.\n\nA retry path could refill the queue later, but ntb_netdev
  has none.\nAllocate the replacement first instead. If that fails, drop the packet\n\
  and repost the same skb. This keeps the queue full and lets packet\ndelivery resume
  as soon as memory is available again."
