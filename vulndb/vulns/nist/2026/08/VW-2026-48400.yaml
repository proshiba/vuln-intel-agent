title: Checkmate is an open-source, self-hosted tool designed to track and 
  monitor server hardware, uptime, response times, and incidents in real-time 
  with beautiful visualizations. Prior to 3.9.1, the public POST 
  /api/v1/auth/register route in server/src/api/routes/authRoutes.ts passes 
  multipart profileImage uploads through in-memory Multer parsing before 
  registration validation, without file-size, file-count, or MIME-type limits in
  server/src/api/middleware/upload.ts. An unauthenticated attacker can submit 
  concurrent oversized files that are buffered before invalid registration or 
  invite-token checks reject the request, exhausting memory and crashing or 
  destabilizing the backend. This issue is fixed in version 3.9.1.
