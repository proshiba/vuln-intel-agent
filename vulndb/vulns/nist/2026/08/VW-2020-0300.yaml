title: 'A vulnerability in the web services interface of Cisco Adaptive Security Appliance
  (ASA) Software and Cisco Firepower Threat Defense (FTD) Software could allow an
  unauthenticated, remote attacker to retrieve memory contents on an affected device,
  which could lead to the disclosure of confidential information. The vulnerability
  is due to a buffer tracking issue when the software parses invalid URLs that are
  requested from the web services interface. An attacker could exploit this vulnerability
  by sending a crafted GET request to the web services interface. A successful exploit
  could allow the attacker to retrieve memory contents, which could lead to the disclosure
  of confidential information. Note: This vulnerability affects only specific AnyConnect
  and WebVPN configurations. For more information, see the Vulnerable Products section.'
