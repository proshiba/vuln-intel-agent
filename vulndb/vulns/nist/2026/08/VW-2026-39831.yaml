title: A flaw was found in the SAML broker component of Keycloak, which is used 
  to manage identity federation and user authentication. The issue occurs 
  because the IdP-initiated Single Sign-On endpoint fails to check if a provider
  is restricted to account linking only. This allows an attacker with control 
  over a linked upstream identity to bypass login restrictions and gain full 
  access to a local user account.
