title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: support IPIP tunnel with direct xmit\n\nThe combination of IPIP tunnel
  with direct xmit, eg. bridge device,\nbreaks because no dst_entry is provided to
  check the skb headroom and to\nset the iph->frag_off field. This leads to invalid
  dst usage and can\ntrigger a crash in the tunnel transmit path.\n\nFix this by moving
  dst_cache and dst_cookie out of the runtime union so\nthat they can be shared by
  neighbour, xfrm, and direct tunnel flows.\nFor FLOW_OFFLOAD_XMIT_DIRECT tuples carrying
  tunnel metadata, preserve\nroute state in these shared fields and release it through
  the common\ndst release path.\n\nSince dst_entry is now available to the three supported
  xmit modes and\ndst_release() already deals with NULL dst, remove the xmit type
  check\nin nft_flow_dst_release(). Moreover, skip the check if the dst entry\nis
  NULL in nf_flow_dst_check() which is now the case for the direct\nxmit case.\n\n\
  Based on patch from Rein "
