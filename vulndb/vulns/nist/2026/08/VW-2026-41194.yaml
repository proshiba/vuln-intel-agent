title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenvswitch:
  fix GSO userspace truncation underflow\n\nOVS_ACTION_ATTR_TRUNC currently stores
  a delta from the original skb\nlength in OVS_CB(skb)->cutlen. When a later userspace
  action segments a\nGSO skb, queue_gso_packets() reuses that delta for each smaller
  segment.\nA segment can then reach queue_userspace_packet() with cutlen greater\n\
  than skb->len, underflowing the length passed to skb_zerocopy().\n\nStore the maximum
  preserved length instead and bound each consumer\nagainst the current skb length.
  Use U32_MAX as the no-truncation\nsentinel so the value remains valid if skb geometry
  changes before a\nconsumer handles it."
