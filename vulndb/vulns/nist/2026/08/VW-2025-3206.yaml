title: "In the Linux kernel, the following vulnerability has been resolved:\n\nixgbe:
  Fix panic during XDP_TX with > 64 CPUs\n\nCommit 4fe815850bdc (\"ixgbe: let the
  xdpdrv work with more than 64 cpus\")\nadds support to allow XDP programs to run
  on systems with more than\n64 CPUs by locking the XDP TX rings and indexing them
  using cpu % 64\n(IXGBE_MAX_XDP_QS).\n\nUpon trying this out patch on a system with
  more than 64 cores,\nthe kernel paniced with an array-index-out-of-bounds at the
  return in\nixgbe_determine_xdp_ring in ixgbe.h, which means ixgbe_determine_xdp_q_idx\n\
  was just returning the cpu instead of cpu % IXGBE_MAX_XDP_QS.  An example\nsplat:\n\
  \n ==========================================================================\n\
  \ UBSAN: array-index-out-of-bounds in\n /var/lib/dkms/ixgbe/5.18.6+focal-1/build/src/ixgbe.h:1147:26\n\
  \ index 65 is out of range for type 'ixgbe_ring *[64]'\n ==========================================================================\n\
  \ BUG: kernel NULL pointer dereference, address: 00000000"
