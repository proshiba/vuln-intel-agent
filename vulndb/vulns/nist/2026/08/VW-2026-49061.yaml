title: Multiple DrayTek VigorSwitch models contain a command injection 
  vulnerability in the jsonstatus function. The vulnerability is caused by 
  insufficient filtering of the usescript, usefile, and option fields before 
  command execution. A remote attacker can trigger this vulnerability via 
  crafted input to execute arbitrary commands with root privileges. Exploitation
  requires valid administrative credentials for the device's web management 
  interface.
