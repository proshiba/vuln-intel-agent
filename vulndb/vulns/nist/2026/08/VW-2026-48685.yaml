title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  ebt_nflog: pin the NFLOG backend\n\nnf_log_unregister() runs after the per-net teardown
  so its final RCU\ngrace period also drains readers that obtained the logger from
  a per-net\nbinding.  However, ebt_nflog passes an explicit ULOG log type to\nnf_log_packet()
  without holding a reference on the selected logger module,\nunlike the xt_NFLOG
  and nft_log frontends.\n\nAn ebtables nflog rule can therefore remain callable while
  nfnetlink_log\nis unloaded.  The resulting interleaving is:\n\n  CPU 0         \
  \                      CPU 1\n  nfnetlink_log_fini()\n    unregister_pernet_subsys()\n\
  \      kfree(nfnl_log_pernet(net))\n                                      ebt_nflog_tg()\n\
  \                                        nf_log_packet()\n                     \
  \                     nfulnl_log_packet()\n                                    \
  \        instance_lookup_get_rcu()\n\nThe global ULOG logger is still registered
  at this point, so CPU 1\n"
