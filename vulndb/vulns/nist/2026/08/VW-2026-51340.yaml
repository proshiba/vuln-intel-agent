title: The WPMU DEV Dashboard plugin for WordPress is vulnerable to 
  Authentication Bypass in all versions up to, and including, 5.0.1. This is due
  to inconsistent and ambiguous HMAC message construction between the 
  unauthenticated `wdpsso_step1` and `wdpsso_step2` AJAX actions, where step 1 
  signs and discloses an unseparated concatenation of the token, state, 
  redirect, and domain values, while step 2 verifies an unseparated 
  concatenation that omits the domain field. This makes it possible for 
  unauthenticated attackers, on sites connected to WPMU DEV with Hub SSO enabled
  and mapped to an administrator, to obtain a valid HMAC from step 1 and replay 
  it to step 2 by moving the domain value into the redirect field, resulting in 
  an authenticated administrator session.
