title: 'Vulnerability in the Oracle Demand Planning product of Oracle Supply Chain
  (component: Internal Operations).  Supported versions that are affected are 12.1
  and  12.2. Easily exploitable vulnerability allows unauthenticated attacker with
  network access via HTTP to compromise Oracle Demand Planning.  Successful attacks
  of this vulnerability can result in  unauthorized access to critical data or complete
  access to all Oracle Demand Planning accessible data as well as  unauthorized update,
  insert or delete access to some of Oracle Demand Planning accessible data. CVSS
  3.1 Base Score 8.2 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N).'
