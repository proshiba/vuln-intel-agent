title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ipw2100: fix potential memory leak in ipw2100_pci_init_one()\n\nThe memory allocated
  in the ipw2100_alloc_device() function is not freed\nin some of the error paths
  in ipw2100_pci_init_one(). Fix that by\nconverting the direct return into a goto
  to the error path return.\n\nThe error path when pci_enable_device() fails cannot
  jump to fail, since\nat this point priv is not set, so perform error handling inline."
