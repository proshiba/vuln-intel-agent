title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  mlxbf: Fix use-after-free in mlxbf_i2c_init_resource()\n\nIf devm_platform_get_and_ioremap_resource()
  returns an error,\nmlxbf_i2c_init_resource() frees tmp_res before reading tmp_res->io
  to\nget the error code. This results in a use-after-free.\n\nSave the error code
  before freeing tmp_res."
