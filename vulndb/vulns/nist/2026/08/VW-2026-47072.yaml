title: "Joomla Extension - balbooa.com - Pre-auth PHP Code Injection in Balbooa Forms
  < 2.4.3.2 - CWE-94 / CWE-95 | CVSS 3.1: 9.8 Critical (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)\n\
  The form's optional custom-PHP post-submission handler is executed via eval(). The
  [URL parameter = X] shortcode is substituted with the raw, unescaped value of a
  query parameter, letting an unauthenticated attacker inject arbitrary PHP that executes
  server-side. The CSRF token needed to reach the endpoint is itself disclosed anonymously
  via a separate task, so it provides no real protection. Exploitability requires
  the form to have a custom-PHP handler configured (a documented builder feature)
  referencing that shortcode, and no reCAPTCHA on the submit button."
