title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86/intel/tpmi:
  use cleanup helpers in mem_write()\n\nIn mem_write(), the temporary array returned
  by\nparse_int_array_user() must be released on all exit paths.\nConvert the array
  variable to use cleanup.h scope-based\ncleanup so it is freed automatically on return.\n\
  \nThis also moves the array declaration next to\nparse_int_array_user() as required
  by cleanup.h usage\nguidelines."
