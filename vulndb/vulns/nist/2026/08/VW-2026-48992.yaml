title: "RansomLook contains an authorization flaw in its legacy database export functionality
  that can allow unauthenticated remote users to retrieve information intended to
  remain private.\n\nThe /export/<database> endpoint permits selected internal databases
  to be exported without requiring authentication. While limited filtering is performed
  for some entity databases, other exportable databases are returned directly without
  consistently applying the application's private-entity access restrictions. As a
  result, information associated with groups, markets, posts, or other records marked
  as private may be included in an export accessible to an unauthenticated requester.\n\
  \nAn attacker able to reach the RansomLook web application can request the affected
  export endpoint and retrieve data that should only be available to authorized users.
