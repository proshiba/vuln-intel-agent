title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoc:
  qcom: pmic_glink_altmode: fix drm bridge use-after-free\n\nA recent DRM series purporting
  to simplify support for \"transparent\nbridges\" and handling of probe deferrals
  ironically exposed a\nuse-after-free issue on pmic_glink_altmode probe deferral.\n\
  \nThis has manifested itself as the display subsystem occasionally failing\nto initialise
  and NULL-pointer dereferences during boot of machines like\nthe Lenovo ThinkPad
  X13s.\n\nSpecifically, the dp-hpd bridge is currently registered before all\nresources
  have been acquired which means that it can also be\nderegistered on probe deferrals.\n\
  \nIn the meantime there is a race window where the new aux bridge driver\n(or PHY
  driver previously) may have looked up the dp-hpd bridge and\nstored a (non-reference-counted)
  pointer to the bridge which is about to\nbe deallocated.\n\nWhen the display controller
  is later initialised, this triggers a\nuse-after-free when attaching the bridges:\n\
  \n\tdp -"
