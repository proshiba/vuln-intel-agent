title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  v4l2-ctrls: validate HEVC active reference counts\n\nHEVC slice parameters are shared
  stateless V4L2 controls, but the common\nvalidation path does not verify the active
  L0/L1 reference counts before\ndriver-specific code consumes them.\n\nThe original
  report came from Cedrus, but the active count bounds are\nnot Cedrus-specific. Validate
  them in the common HEVC slice control path\nso stateless HEVC drivers get the same
  basic guarantees as soon as the\ncontrol is queued.\n\nDo not reject ref_idx_l0/ref_idx_l1
  entries here. Existing userspace may\nuse out-of-range sentinel values such as 0xff
  for missing references, and\nsome hardware can use that information for concealment.
  Keep this common\ncheck limited to the active reference counts."
