title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfou:
  Fix null-ptr-deref in GRO.\n\nWe observed a null-ptr-deref in fou_gro_receive()
  while shutting down\na host.  [0]\n\nThe NULL pointer is sk->sk_user_data, and the
  offset 8 is of protocol\nin struct fou.\n\nWhen fou_release() is called due to netns
  dismantle or explicit tunnel\nteardown, udp_tunnel_sock_release() sets NULL to sk->sk_user_data.\n\
  Then, the tunnel socket is destroyed after a single RCU grace period.\n\nSo, in-flight
  udp4_gro_receive() could find the socket and execute the\nFOU GRO handler, where
  sk->sk_user_data could be NULL.\n\nLet's use rcu_dereference_sk_user_data() in fou_from_sock()
  and add NULL\nchecks in FOU GRO handlers.\n\n[0]:\nBUG: kernel NULL pointer dereference,
  address: 0000000000000008\n PF: supervisor read access in kernel mode\n PF: error_code(0x0000)
  - not-present page\nPGD 80000001032f4067 P4D 80000001032f4067 PUD 103240067 PMD
  0\nSMP PTI\nCPU: 0 PID: 0 Comm: swapper/0 Not tainted 5.10.216-204.855.amzn2."
