title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  ete: Always save state on power down\n\nSystem register ETMs and ETE are unlikely
  to be preserved on CPU power\ndown. The ETE DT binding also never documented\n\"\
  arm,coresight-loses-context-with-cpu\" so nobody would have legitimately\nbeen able
  to use that binding to fix it and ACPI has no such binding at\nall.\n\nFix it by
  hard coding the setting for sysreg ETMs (ETE is always sysreg)\nor ACPI boots. Use
  a local variable when setting up save_state so that\nit's immune to concurrent probing
  when devices have different\nconfigurations which is an issue with modifying the
  global.\n\nThis fixes the following error when using Coresight with ACPI on the
  FVP\nwhich supports CPU PM:\n\n  coresight ete0: External agent took claim tag\n\
  \  WARNING: drivers/hwtracing/coresight/coresight-core.c:248 at coresight_disclaim_device_unlocked+0xe0/0xe8,
  CPU#0: perf/117"
