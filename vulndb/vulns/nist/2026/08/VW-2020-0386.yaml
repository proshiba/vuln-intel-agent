title: "An elevation of privilege vulnerability exists when the Windows Printer Service
  improperly validates file paths while loading printer drivers. An authenticated
  attacker who successfully exploited this vulnerability could run arbitrary code
  with elevated system privileges.\nTo exploit this vulnerability, an attacker would
  first have to log on to the system. An attacker could then run a specially crafted
  application that could exploit the vulnerability and take control of an affected
  system.\nThe update addresses this vulnerability by correcting how the Windows Printer
  Service validates file paths."
