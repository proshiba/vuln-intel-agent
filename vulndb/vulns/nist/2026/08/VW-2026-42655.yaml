title: Taubyte Tau v1.1.10 contains a missing authorization vulnerability in the
  services/auth HTTP service that allows any authenticated user to read or 
  permanently delete another tenant's project by supplying an arbitrary project 
  ID to the GET and DELETE /projects/{id} endpoints. The GitHubTokenHTTPAuth 
  middleware only validates that a caller presents a valid GitHub OAuth token 
  without verifying ownership or access rights to the target project, enabling 
  attackers with any valid GitHub token to invoke bare KV-store operations such 
  as projects.Fetch and project.Delete against any project ID to achieve 
  cross-tenant project takeover.
