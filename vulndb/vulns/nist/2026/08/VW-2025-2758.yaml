title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fix NULL pointer in skb_segment_list\n\nCommit 3a1296a38d0c (\"net: Support GRO/GSO
  fraglist chaining.\")\nintroduced UDP listifyed GRO. The segmentation relies on
  frag_list being\nuntouched when passing through the network stack. This assumption
  can be\nbroken sometimes, where frag_list itself gets pulled into linear area,\n\
  leaving frag_list being NULL. When this happens it can trigger\nfollowing NULL pointer
  dereference, and panic the kernel. Reverse the\ntest condition should fix it.\n\n\
  [19185.577801][    C1] BUG: kernel NULL pointer dereference, address:\n...\n[19185.663775][\
  \    C1] RIP: 0010:skb_segment_list+0x1cc/0x390\n...\n[19185.834644][    C1] Call
  Trace:\n[19185.841730][    C1]  <TASK>\n[19185.848563][    C1]  __udp_gso_segment+0x33e/0x510\n\
  [19185.857370][    C1]  inet_gso_segment+0x15b/0x3e0\n[19185.866059][    C1]  skb_mac_gso_segment+0x97/0x110\n\
  [19185.874939][    C1]  __skb_gso_segment+0xb2/0x160\n[19185.883646][    C1]"
