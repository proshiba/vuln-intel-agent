title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  fix peer refcount leak in TCP error paths\n\nWhen either the TCP RX or TX error
  path calls ovpn_peer_hold() followed\nby schedule_work(&peer->tcp.defer_del_work),
  and the work item is already\npending from the other path, schedule_work() returns
  false and the work\nruns only once. Since ovpn_tcp_peer_del_work() calls ovpn_peer_put()\n\
  exactly once, the extra reference taken by the losing path is never\ndropped, leaking
  the peer object.\n\nThe race window:\n\n  CPU0 (strparser/RX error):       CPU1
  (tcp_tx_work/TX error):\n  ovpn_peer_hold()   <- refcnt+1   ovpn_peer_hold()   <-
  refcnt+2\n  schedule_work()    <- queued      schedule_work()    <- NO-OP\n    \
  \                                (work already pending)\n  ovpn_tcp_peer_del_work
  runs:\n    ovpn_peer_del()\n    ovpn_peer_put()  <- refcnt+1\n                 \
  \                  <- peer never freed\n\nFix by checking the return value of schedule_work()
  in both paths and\ncalling ovp"
