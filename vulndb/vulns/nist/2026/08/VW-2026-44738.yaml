title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix invalid pointer dereference in __btrfs_run_delayed_refs()\n\nIn the beginning
  of the loop, we try to obtain a locked delayed ref head,\nif 'locked_ref' is currently
  NULL, by calling btrfs_select_ref_head(),\nwhich can return an error pointer. If
  the error pointer is -EAGAIN we do\na continue and go back to the beginning of the
  loop, which will not try\nagain to call btrfs_select_ref_head() since 'locked_ref'
  is no longer\nNULL but it's ERR_PTR(-EAGAIN), and then we do:\n\n   spin_lock(&locked_ref->lock);\n\
  \nagainst a ERR_PTR(-EAGAIN) value, generating an invalid pointer\ndereference.\n\
  \nFix this by ensuring that 'locked_ref' is set to NULL when\nbtrfs_select_ref_head()
  returns ERR_PTR(-EAGAIN) and incrementing 'count'\nas well, to prevent infinite
  looping. We do this by doing a goto to the\nbottom of the loop that already sets
  'locked_ref' to NULL and does a\ncond_resched(), with an increment to 'count' right
  before the goto"
