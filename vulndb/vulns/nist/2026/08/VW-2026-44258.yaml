title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/ivpu:
  Reject firmware log with size smaller than header\n\nfw_log_from_bo() validates
  the tracing buffer header_size and that the\nlog fits within the BO, but never checks
  that log->size is at least\nlog->header_size. fw_log_print_buffer() then computes:\n\
  \n  u32 data_size = log->size - log->header_size;\n\nwhich underflows to a near-U32_MAX
  value when firmware reports a log whose\nsize is smaller than its header. That huge
  data_size defeats the\nlog_start/log_end bounds clamps added by commit dd1311bcf0e6
  (\"accel/ivpu:\nAdd bounds checks for firmware log indices\"), so fw_log_print_lines()
  reads\nfar past the small real data region of the BO. A size of 0 also makes\nfw_log_from_bo()
  advance the offset by 0, causing the callers to loop\nforever on the same header.\n\
  \nReject logs whose size is smaller than the header (which also rejects\nsize ==
  0)."
