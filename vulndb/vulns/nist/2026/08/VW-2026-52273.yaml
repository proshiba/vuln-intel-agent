title: A flaw has been found in MegaEase EaseProbe up to 2.3.0. Affected is the 
  function realIP of the file web/server.go of the component Middleware. This 
  manipulation of the argument X-Forwarded-For/X-Real-IP/True-Client-IP causes 
  improper access controls. The attack can be initiated remotely. The exploit 
  has been published and may be used. The vendor was contacted early about this 
  disclosure but did not respond in any way.
