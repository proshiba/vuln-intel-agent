title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: Protect UUID list traversal\n\nThe hci_sync conversion moved class-of-device
  and EIR generation from an\nHCI request built under hdev->lock to asynchronous command
  sync work.\nThe worker holds hdev->req_lock, but that lock does not serialize access\n\
  to hdev->uuids against add_uuid() and remove_uuid(), which update the\nlist under
  hdev->lock.\n\nThe following interleaving can therefore occur:\n\n  CPU0 (command
  sync work)       CPU1 (management socket)\n  fetch uuid from the list\n        \
  \                        list_del(&uuid->list)\n                               \
  \ kfree(uuid)\n  read uuid->size\n\nKASAN reports the resulting use-after-free:\n\
  \n  BUG: KASAN: slab-use-after-free in eir_create+0xb8f/0xee0\n  Read of size 1
  at addr ffff88810dbd8620 by task kworker/u17:0/87\n  Workqueue: hci0 hci_cmd_sync_work\n\
  \  Call Trace:\n   eir_create+0xb8f/0xee0\n   hci_update_eir_sync+0x1c0/0x330\n\
  \   hci_cmd_sync_work+0x13c/0x290\n   p"
