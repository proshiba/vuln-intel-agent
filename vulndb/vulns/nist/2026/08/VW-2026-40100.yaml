title: A security flaw has been discovered in poco-ai poco-agent up to 0.5.4. 
  Affected is the function WorkspaceManager._setup_session_persistence of the 
  file executor/app/core/workspace.py of the component Claude File Handler. The 
  manipulation results in incomplete cleanup. The attack may be performed from 
  remote. Attacks of this nature are highly complex. The exploitability is told 
  to be difficult. The exploit has been released to the public and may be used 
  for attacks.
