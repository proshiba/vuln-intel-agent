title: "Multiple Cisco products are affected by a vulnerability in the Snort 3 VBA
  feature that could allow an unauthenticated, remote attacker to cause the Snort
  3 Detection Engine to crash.\r\n\r\nThis vulnerability is due to improper range
  checking when decompressing VBA data, which is user controlled. An attacker could
  exploit this vulnerability by sending crafted VBA data to the Snort 3 Detection
  Engine on the targeted device. A successful exploit could allow the attacker to
  cause an overflow of heap data, which could cause a DoS condition."
