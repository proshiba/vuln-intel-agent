title: "In the Linux kernel, the following vulnerability has been resolved:\n\neventfs:
  Fix use-after-free in eventfs_remove_rec()\n\neventfs_remove_rec() recursively removes
  the child at the current loop\nposition. After the recursive call returns, list_for_each_entry()
  advances\nby reading list.next from the removed child.\n\nIf free_ei() drops the
  final reference, release_ei() reuses the list/rcu\nunion to queue an SRCU callback.
  The child may be freed before that read.\nThe eventfs_mutex serializes list updates,
  but it does not keep the removed\nchild alive or prevent the SRCU callback from
  running.\n\nUse list_for_each_entry_safe() to save the next sibling before recursively\n\
  removing the current child."
