title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath10k: add peer map clean up for peer delete in ath10k_sta_state()\n\nWhen peer
  delete failed in a disconnect operation, use-after-free\ndetected by KFENCE in below
  log. It is because for each vdev_id and\naddress, it has only one struct ath10k_peer,
  it is allocated in\nath10k_peer_map_event(). When connected to an AP, it has more
  than\none HTT_T2H_MSG_TYPE_PEER_MAP reported from firmware, then the\narray peer_map
  of struct ath10k will be set muti-elements to the\nsame ath10k_peer in ath10k_peer_map_event().
  When peer delete failed\nin ath10k_sta_state(), the ath10k_peer will be free for
  the 1st peer\nid in array peer_map of struct ath10k, and then use-after-free happened\n\
  for the 2nd peer id because they map to the same ath10k_peer.\n\nAnd clean up all
  peers in array peer_map for the ath10k_peer, then\nuser-after-free disappeared\n\
  \npeer map event log:\n[  306.911021] wlan0: authenticate with b0:2a:43:e6:75:0e\n\
  [  306.957187] a"
