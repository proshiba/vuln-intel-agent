title: The All-in-One WP Migration Unlimited Extension plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting via the 'ai1wm_backups_path' 
  parameter in all versions up to, and including, 2.84. This is due to 
  insufficient input sanitization and output escaping on user-supplied 
  attributes combined with missing authorization checks on the settings() 
  function. This makes it possible for authenticated attackers, with 
  Subscriber-level access and above, to inject arbitrary web scripts in pages 
  that will execute whenever an administrator accesses the plugin settings page.
  The vulnerability was partially patched in version 2.84.
