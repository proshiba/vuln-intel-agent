title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: validate frame length in bcm_rx_setup() for RTR replies\n\nbcm_tx_setup() validates
  cf->len against the CAN/CAN FD DLC limits\nbefore installing frames for TX_SETUP,
  but bcm_rx_setup() never did\nthe same for the RTR-reply frame configured via RX_SETUP
  with\nRX_RTR_FRAME."
