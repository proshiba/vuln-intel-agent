title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/huge_memory:
  unlock i_mmap_rwsem before releasing after-split folios\n\n__folio_split() keeps
  dereferencing the mapping after the split:\nshmem_uncharge(mapping->host) and remap_page()
  while the folios are still\nfrozen/locked, and i_mmap_unlock_read(mapping) at the
  very end, after the\nafter-split folios have been unlocked and freed.\n\nNothing
  holds an inode reference across that.  The split relies on @folio\n-- which the
  beyond-EOF drop loop never removes, as it starts at\nfolio_next(folio) -- staying
  locked and in the page cache to hold off\neviction.  But the unlock loop unlocks
  @folio before i_mmap_unlock_read()\nruns.  If the caller's @lock_at is a tail beyond
  EOF, as memory_failure()\npasses when splitting a poisoned tail of a shmem THP that
  reaches past\ni_size during truncation, it too is gone from the page cache; so once\n\
  @folio is unlocked no locked, in-cache folio pins the inode, and a\nconcurrent final
  iput() can ev"
