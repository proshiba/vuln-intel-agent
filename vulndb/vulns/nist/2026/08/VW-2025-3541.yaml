title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Validate BOOT record_size\n\nWhen the NTFS BOOT record_size field < 0, it represents
  a\nshift value. However, there is no sanity check on the shift result\nand the sbi->record_bits
  calculation through blksize_bits() assumes\nthe size always > 256, which could lead
  to NPD while mounting a\nmalformed NTFS image.\n\n[  318.675159] BUG: kernel NULL
  pointer dereference, address: 0000000000000158\n[  318.675682] #PF: supervisor read
