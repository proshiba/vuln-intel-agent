title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm:
  Don't unref the same fb many times by mistake due to deadlock handling\n\nIf we
  get a deadlock after the fb lookup in drm_mode_page_flip_ioctl()\nwe proceed to
  unref the fb and then retry the whole thing from the top.\nBut we forget to reset
  the fb pointer back to NULL, and so if we then\nget another error during the retry,
  before the fb lookup, we proceed\nthe unref the same fb again without having gotten
  another reference.\nThe end result is that the fb will (eventually) end up being
  freed\nwhile it's still in use.\n\nReset fb to NULL once we've unreffed it to avoid
  doing it again\nuntil we've done another fb lookup.\n\nThis turned out to be pretty
  easy to hit on a DG2 when doing async\nflips (and CONFIG_DEBUG_WW_MUTEX_SLOWPATH=y).
  The first symptom I\nsaw that drm_closefb() simply got stuck in a busy loop while
  walking\nthe framebuffer list. Fortunately I was able to convince it to oops\ninstead,
