title: "In the Linux kernel, the following vulnerability has been resolved:\n\nice:
  fix FDIR CTRL VSI resource leak in ice_reset_all_vfs()\n\nResetting all VFs causes
  resource leak on VFs with FDIR filters\nenabled as CTRL VSIs are only invalidated
  and not freed. Fix by using\nice_vf_ctrl_vsi_release() instead of ice_vf_ctrl_invalidate_vsi()
  which\naligns behavior with the ice_reset_vf() function.\n\nReproduction:\n  echo
  1 > /sys/class/net/$pf/device/sriov_numvfs\n  ethtool -N $vf flow-type ether proto
  0x9000 action 0\n  echo 1 > /sys/class/net/$pf/device/reset"
