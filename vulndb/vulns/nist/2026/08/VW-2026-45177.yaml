title: A security flaw has been discovered in Open Asset Import Library Assimp 
  17c12da. Impacted is the function Assimp::Compression::decompressBlock of the 
  file code/Common/Compression.cpp of the component File Parser. Performing a 
  manipulation results in heap-based buffer overflow. The attack may be 
  initiated remotely. The exploit has been released to the public and may be 
  used for attacks. The project was informed of the problem early through an 
  issue report but has not responded yet.
