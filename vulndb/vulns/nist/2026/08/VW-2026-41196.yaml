title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmac802154:
  llsec: reject frames shorter than the authentication tag\n\nllsec_do_decrypt_auth()
  computes the associated-data length for the\nAEAD request as\n\n\tassoclen += datalen
  - authlen;\n\nwhere datalen is the number of bytes after the MAC header and authlen\n\
  (4, 8 or 16) is the length of the authentication tag. Nothing verifies\nthat the
  frame actually carries at least authlen payload bytes. A\nsecured frame whose payload
  is shorter than the tag makes\ndatalen - authlen negative; assoclen is then passed
  to\naead_request_set_ad() as an unsigned value close to 4 GiB, so\ncrypto_aead_decrypt()
  walks far off the end of the scatterlist that\nonly spans the real frame.\n\nThe
  frame is fully attacker-controlled and reaches this path from any\nIEEE 802.15.4
  peer in radio range. Reject frames whose payload is\nshorter than the authentication
  tag before the subtraction.\n\nDynamically reproduced on a KASAN kernel as a general-protection-faul"
