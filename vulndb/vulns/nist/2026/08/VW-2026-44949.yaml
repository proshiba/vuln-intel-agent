title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: Update x2APIC MSR intercepts if AVIC is inhibited while L2 is active\n\nAlways
  update x2APIC MSR intercepts for L1 when AVIC is deactivated, even\nif L2 is active
  and KVM is using a separate MSR bitmap to run L2.  If AVIC\nis fully enabled prior
  to running L2, and is then inhibited while L2 is\nactive (for a VM-scoped inhibit),
  then KVM will run L1 with AVIC disabled,\nbut with x2APIC MSR intercepts disabled,
  i.e. will allow L1 to read most of\nthe host's APIC state, send arbitrary interrupts,
  change task priority, and\nultimately trivially DoS the host.\n\nE.g. sending a
  self-IPI in L1 on HYPERV_REENLIGHTENMENT_VECTOR, 0xee, with\nCONFIG_HYPERV=n in
  the host kernel as a \"safe\" PoC, yields:\n\n  Spurious interrupt (vector 0xee)
  on CPU#425. Acked\n\nAnd hacking KVM to abuse kvm_set_posted_intr_wakeup_handler()
  to register a\nhandler and WARN on POSTED_INTR_WAKEUP_VECTOR yields:\n\n  ------------[
  cut here ]------------\n  WARNI"
