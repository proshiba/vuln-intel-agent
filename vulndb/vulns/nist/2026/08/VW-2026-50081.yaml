title: Kimai before 2.64.0 contains a missing authorization vulnerability in the
  ProjectViewController export route (report_project_view_export). The 
  authorization guards are attached to the sibling __invoke method rather than 
  at the class level, so the export route inherits no authorization checks. Any 
  authenticated user, including a plain ROLE_USER without the project_reporting 
  permission, can download the project overview export - which returns the same 
  dataset as the protected report - disclosing customer names, project names, 
  currency, budget type, and aggregate totals across all customers. Actual 
  financial figures remain protected in the export template.
