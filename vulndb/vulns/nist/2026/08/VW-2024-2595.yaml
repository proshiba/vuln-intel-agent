title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  vertexcom: mse102x: Fix possible double free of TX skb\n\nThe scope of the TX skb
  is wider than just mse102x_tx_frame_spi(),\nso in case the TX skb room needs to
  be expanded, we should free the\nthe temporary skb instead of the original skb.
  Otherwise the original\nTX skb pointer would be freed again in mse102x_tx_work(),
  which leads\nto crashes:\n\n  Internal error: Oops: 0000000096000004 [#2] PREEMPT
  SMP\n  CPU: 0 PID: 712 Comm: kworker/0:1 Tainted: G      D            6.6.23\n \
  \ Hardware name: chargebyte Charge SOM DC-ONE (DT)\n  Workqueue: events mse102x_tx_work
  [mse102x]\n  pstate: 20400009 (nzCv daif +PAN -UAO -TCO -DIT -SSBS BTYPE=--)\n \
  \ pc : skb_release_data+0xb8/0x1d8\n  lr : skb_release_data+0x1ac/0x1d8\n  sp :
  ffff8000819a3cc0\n  x29: ffff8000819a3cc0 x28: ffff0000046daa60 x27: ffff0000057f2dc0\n\
  \  x26: ffff000005386c00 x25: 0000000000000002 x24: 00000000ffffffff\n  x23: 0000000000000000
  x22: 0000000000000001 x21: ffff000"
