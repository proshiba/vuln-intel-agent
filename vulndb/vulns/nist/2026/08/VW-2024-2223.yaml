title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  Return non-zero value from tipc_udp_addr2str() on error\n\ntipc_udp_addr2str() should
  return non-zero value if the UDP media\naddress is invalid. Otherwise, a buffer
  overflow access can occur in\ntipc_media_addr_printf(). Fix this by returning 1
  on an invalid UDP\nmedia address."
