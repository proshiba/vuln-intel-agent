title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  reject optional IPTFS templates in outbound policies\n\nsyzbot reported a stack-out-of-bounds
  read in xfrm_state_find()\nwhich flows from xfrm_tmpl_resolve_one().\n\nCommit 3d776e31c841
  (\"xfrm: Reject optional tunnel/BEET mode\ntemplates in outbound policies\") disallowed
  optional tunnel and\nBEET in outbound policies to prevent this. Later when IPTFS\n\
  added, it was not covered by that fix and can still trigger\nthe out-of-bounds read;\n\
  \nExtend the check to disallow optional IPTFS in outbound policies\nas well. IPTFS
  should be identical to tunnel mode.\nIN and FWD policies are not affected: xfrm_tmpl_resolve_one()\n\
  is only reachable via the outbound path.\n\nReproducer, before:\n\nip link add dummy0
  type dummy\nip link set dummy0 up\nip addr add 10.1.1.1/24 dev dummy0\nip xfrm policy
  add src 10.1.1.1/32 dst 10.1.1.2/32 dir out tmpl\n  src fc00::dead:1 dst fc00::dead:2
  proto esp reqid 1 mode iptfs\n  level use tmpl src fc00::dead:1 dst"
