title: Kestra is an open-source, event-driven orchestration platform. Prior to 
  2.0.0-rc6, Kestra's cli/src/main/resources/application.yml serves Micronaut 
  management endpoints on port 8081 without authentication even when Basic Auth 
  protects /api/v1/** on port 8080, allowing unauthenticated GET /env requests 
  to disclose resolved configuration and POST /loggers/{name} requests to change
  runtime log levels. This issue is fixed in 2.0.0-rc6.
