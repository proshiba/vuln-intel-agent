title: A flaw was found in open-iscsi's iscsiuio component. This vulnerability 
  involves an integer underflow and out-of-bounds read during Dynamic Host 
  Configuration Protocol for IPv6 (DHCPv6) packet parsing. Specifically, crafted
  DHCPv6 Advertise traffic with a short User Datagram Protocol (UDP) length can 
  cause the DHCPv6 payload length to underflow. An unauthenticated attacker on 
  an adjacent network segment can exploit this by sending specially crafted IPv6
  UDP traffic while the client is in an active DHCPv6 exchange, leading to a 
  denial of service due to a process crash or service disruption.
