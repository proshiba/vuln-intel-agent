title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFS:
  Fix a potential data corruption\n\nWe must ensure that the subrequests are joined
  back into the head before\nwe can retransmit a request. If the head was not on the
  commit lists,\nbecause the server wrote it synchronously, we still need to add it
  back\nto the retransmission list.\nAdd a call that mirrors the effect of nfs_cancel_remove_inode()
  for\nO_DIRECT."
