title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: fix tx ident leak for commands without a response\n\nCommit 6c3ea155e5ee
  (\"Bluetooth: L2CAP: Fix not tracking outstanding\nTX ident\") changed ident allocation
  to use an IDA, releasing idents in\nl2cap_put_ident() when the matching response
  command is received.\n\nBut identifiers allocated for commands that have no response
  defined\nare never released. In particular L2CAP_LE_CREDITS is sent repeatedly for\n\
  the lifetime of an LE CoC channel, so a peer streaming data to the\nhost exhausts
  the 1-255 ident range after 254 credit packets. From\nthen on l2cap_get_ident()
  fails:\n\n    kernel: Bluetooth: Unable to allocate ident: -28\n\nand every subsequent
  L2CAP_LE_CREDITS packet is sent with ident 0,\nwhich is invalid (Core Spec, Vol
  3, Part A, Section 4: \"Signaling\nidentifier 0x00 is an invalid identifier and
  shall never be used in\nany command\"). Remote stacks that validate the ident drop
  these\ncommands, never receive n"
