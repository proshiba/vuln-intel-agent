title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstmmac:
  Clear variable when destroying workqueue\n\nCurrently when suspending driver and
  stopping workqueue it is checked whether\nworkqueue is not NULL and if so, it is
  destroyed.\nFunction destroy_workqueue() does drain queue and does clear variable,
  but\nit does not set workqueue variable to NULL. This can cause kernel/module\n\
  panic if code attempts to clear workqueue that was not initialized.\n\nThis scenario
  is possible when resuming suspended driver in stmmac_resume(),\nbecause there is
  no handling for failed stmmac_hw_setup(),\nwhich can fail and return if DMA engine
  has failed to initialize,\nand workqueue is initialized after DMA engine.\nShould
  DMA engine fail to initialize, resume will proceed normally,\nbut interface won't
  work and TX queue will eventually timeout,\ncausing 'Reset adapter' error.\nThis
  then does destroy workqueue during reset process.\nAnd since workqueue is initialized
  after DMA engine and can be skipped"
