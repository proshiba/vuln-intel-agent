title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  fix double brelse() the buffer of the extents path\n\nIn ext4_ext_try_to_merge_up(),
  set path[1].p_bh to NULL after it has been\nreleased, otherwise it may be released
  twice. An example of what triggers\nthis is as follows:\n\n  split2    map    split1\n\
  |--------|-------|--------|\n\next4_ext_map_blocks\n ext4_ext_handle_unwritten_extents\n\
  \  ext4_split_convert_extents\n   // path->p_depth == 0\n   ext4_split_extent\n\
  \     // 1. do split1\n     ext4_split_extent_at\n       |ext4_ext_insert_extent\n\
  \       |  ext4_ext_create_new_leaf\n       |    ext4_ext_grow_indepth\n       |\
  \      le16_add_cpu(&neh->eh_depth, 1)\n       |    ext4_find_extent\n       | \
  \     // return -ENOMEM\n       |// get error and try zeroout\n       |path = ext4_find_extent\n\
  \       |  path->p_depth = 1\n       |ext4_ext_try_to_merge\n       |  ext4_ext_try_to_merge_up\n\
  \       |    path->p_depth = 0\n       |    brelse(path[1].p_bh)  ---> not set to
  NULL here\n       |// ze"
