title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7921: drop TXRX_NOTIFY on non-mmio buses\n\nPKT_TYPE_TXRX_NOTIFY is an mmio-only
  event, but mt7921_rx_check() and\nmt7921_queue_rx_skb() dispatch it to mt7921_mac_tx_free()
  on every bus.\nmt7921_mac_tx_free() cleans the DMA tx queues with\nmt76_queue_tx_cleanup(),
  which calls queue_ops->tx_cleanup(). Only the\nmmio queue ops implement that callback;
  on USB and SDIO it is NULL, so\na TXRX_NOTIFY there calls a NULL pointer in the
  RX worker:\n\n  BUG: kernel NULL pointer dereference, address: 0000000000000000\n\
  \  RIP: 0010:0x0\n  Call Trace:\n   mt7921_mac_tx_free+0x64/0x310 [mt7921_common]\n\
  \   mt7921_rx_check+0x5f/0xf0 [mt7921_common]\n   mt76u_rx_worker+0x1b9/0x620 [mt76_usb]\n\
  \nDrop the event on non-mmio buses via mt76_is_mmio(), as in\ncommit 5683e1488aa9
  (\"wifi: mt76: connac: do not check WED status for\nnon-mmio devices\")."
