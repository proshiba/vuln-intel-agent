title: A stack-based buffer overflow vulnerability exists in ELAN 
  Microelectronics Corp. ELAN Smart-Pad on Windows (ETD.sys and ETDSMBus.sys). 
  During Intel SMBus recovery, ETDSMBus.sys does not enforce an upper-bound 
  check on the hardware-derived report count, allowing an out-of-range value to 
  be forwarded to ETD.sys where it is used as a loop counter for a stack buffer 
  copy without destination size validation. A local attacker with standard user 
  privileges can trigger a kernel bugcheck (BSOD 0xF7 
  DRIVER_OVERRAN_STACK_BUFFER), resulting in denial of service. This issue 
  affects ELAN Smart-Pad through ETD24.21.52.3.
