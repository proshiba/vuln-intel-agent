title: "In the Linux kernel, the following vulnerability has been resolved:\n\nopenrisc:
  Fix jump_label smp syncing\n\nThe original commit 8c30b0018f9d (\"openrisc: Add
  jump label support\")\ncopies from arm64 and does not properly consider how icache
  invalidation\non remote cores works in OpenRISC.  On OpenRISC remote icaches need
  to\nbe invalidated otherwise static key's may remain state after updating.\n\nFix
  SMP cache syncing by:\n\n 1. Properly invalidate remote core icaches on SMP systems
  by using\n    icache_all_inv.  The old code uses kick_all_cpus_sync() which runs
  a\n    no-op IPI function call on remote CPU's which does execute a lot of\n   \
  \ code and flushes many cache lines in the process, but does not flush\n    all
  and it's not correct on OpenRISC.\n 2. For architectures that do not have WRITETHROUGH
  caches be sure\n    to flush the dcache after patching.\n\nTo test this I first
  reproduced the issue using a custom test module\n[0].  The test confirmed that some
  icache lines maintained stale\nstatic_key"
