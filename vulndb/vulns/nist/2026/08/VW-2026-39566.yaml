title: 'The Orbit Fox: Duplicate Page, Menu Icons, SVG Support, Cookie Notice, Custom
  Fonts & More WordPress plugin before 3.0.8 does not sanitize uploaded SVG files
  when its SVG upload feature is enabled, allowing authenticated users with the upload
  capability (Author and above by default, without the unfiltered_html capability)
  to upload SVG files containing JavaScript that executes in the site context when
  the file is viewed, leading to Stored Cross-Site Scripting.'
