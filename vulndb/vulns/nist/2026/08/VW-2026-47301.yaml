title: A flaw was found in the `cluster-proxy-addon` component of Multicluster 
  Engine for Kubernetes. This vulnerability allows an unauthenticated attacker, 
  who can access the user-facing route, to bypass authentication and 
  authorization checks. By manipulating URL path segments, the attacker can 
  proxy requests to arbitrary services across any managed cluster. This enables 
  unauthorized access to internal services that would otherwise be protected, 
  potentially leading to information disclosure or further compromise of the 
  cluster environment.
