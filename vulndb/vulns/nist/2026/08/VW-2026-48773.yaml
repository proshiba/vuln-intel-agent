title: A vulnerability has been found in Systerel S2OPC up to 1.7.3. Impacted is
  the function SOPC_NodeMgtHelperInternal_AddVariableNodeAttributes of the file 
  src/ClientServer/address_space/internal/sopc_node_mgt_helper_internal.c of the
  component AddNodes Service. The manipulation of the argument UserAccessLevel 
  leads to out-of-bounds read. It is possible to initiate the attack remotely. A
  high degree of complexity is needed for the attack. The exploitability is 
  considered difficult. The exploit has been disclosed to the public and may be 
  used. The identifier of the patch is aafbd37d381b618312ebdf5ddf57027f62c14fdd.
  It is suggested to install a patch to address this issue.
