title: Weblate is a web-based localization tool. In versions prior to 2026.7, 
  several endpoints look up objects in a globally scoped manner rather than 
  restricting the lookup to projects the user can access, so they return HTTP 
  403 (Forbidden) instead of 404 (Not Found) when a user requests an object they
  are not authorized to see. This difference lets unauthorized users infer 
  whether a given object exists in a private Weblate project. The issue has been
  fixed in version 2026.7.
