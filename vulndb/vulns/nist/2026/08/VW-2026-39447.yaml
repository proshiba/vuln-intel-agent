title: OpenSIPS is a Session Initiation Protocol (SIP) server implementation. In
  versions 4.0.0 and prior, processing a SIP message with a header name longer 
  than 255 bytes causes a stack buffer overflow when sip_to_json() is called in 
  the routing script. Function sip_to_json() (modules/sipmsgops/sipmsgops.c) 
  copies SIP header names into a fixed 255-byte stack buffer without bounds 
  checking, performing a memcpy of the full header-name length even though the 
  SIP parser imposes no such limit (a header name can be roughly 65000 bytes). 
  As a result, when a routing script calls sip_to_json(), a SIP message with a 
  header name longer than 255 bytes triggers a stack buffer overflow in which 
  both the length and content of the overwrite are attacker-controlled, 
  corrupting the saved frame pointer and return address. A single 
  unauthenticated UDP packet to the SIP port (5060) can crash the process or, on
  builds without stack protections, hijack the return address to achieve remote 
