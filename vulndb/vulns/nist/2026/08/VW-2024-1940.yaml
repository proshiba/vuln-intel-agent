title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  codecs: wcd934x: handle channel mappping list correctly\n\nCurrently each channel
  is added as list to dai channel list, however\nthere is danger of adding same channel
  to multiple dai channel list\nwhich endups corrupting the other list where its already
  added.\n\nThis patch ensures that the channel is actually free before adding to\n\
  the dai channel list and also ensures that the channel is on the list\nbefore deleting
  it.\n\nThis check was missing previously, and we did not hit this issue as\nwe were
  testing very simple usecases with sequence of amixer commands."
