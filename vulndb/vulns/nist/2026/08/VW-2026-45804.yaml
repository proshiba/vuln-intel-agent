title: Hoppscotch is an open source API development ecosystem. Prior to 
  2026.6.0, the team, teamMembers.user, RESTHistory, GQLHistory, 
  currentRESTSession, currentGQLSession, environments, globalEnvironments, and 
  settings GraphQL paths expose another workspace member's private User data, 
  while toggleHistoryStarStatus and removeRequestFromHistory in the UserHistory 
  service accept another user's history identifier without enforcing userUid 
  ownership, allowing an authenticated workspace member to read private request 
  history, session data, request contents, authorization headers, environment 
  values, and settings and to modify or delete the victim's private history 
  entries. This issue is fixed in version 2026.6.0.
