title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntunnels:
  fix out of bounds access when building IPv6 PMTU error\n\nIf the ICMPv6 error is
  built from a non-linear skb we get the following\nsplat,\n\n  BUG: KASAN: slab-out-of-bounds
  in do_csum+0x220/0x240\n  Read of size 4 at addr ffff88811d402c80 by task netperf/820\n\
  \  CPU: 0 PID: 820 Comm: netperf Not tainted 6.8.0-rc1+ #543\n  ...\n   kasan_report+0xd8/0x110\n\
  \   do_csum+0x220/0x240\n   csum_partial+0xc/0x20\n   skb_tunnel_check_pmtu+0xeb9/0x3280\n\
  \   vxlan_xmit_one+0x14c2/0x4080\n   vxlan_xmit+0xf61/0x5c00\n   dev_hard_start_xmit+0xfb/0x510\n\
  \   __dev_queue_xmit+0x7cd/0x32a0\n   br_dev_queue_push_xmit+0x39d/0x6a0\n\nUse
  skb_checksum instead of csum_partial who cannot deal with non-linear\nSKBs."
