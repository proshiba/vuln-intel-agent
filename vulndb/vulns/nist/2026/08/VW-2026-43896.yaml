title: Grav CMS before 2.0.13 contains a remote code execution vulnerability in 
  the Flex Objects plugin settings validation that allows authenticated users to
  execute arbitrary code by uploading a ZIP file containing PHP code. Attackers 
  can bypass routine name validation by using array notation instead of string 
  notation, call the unZip routine with a malicious archive, and write PHP files
  to the web root for execution.
