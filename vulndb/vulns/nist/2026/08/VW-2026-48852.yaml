title: A vulnerability was identified in the-momentum open-wearables up to 
  0.6.2. This impacts the function redeem_invitation_code of the file 
  backend/app/api/routes/v1/user_invitation_code.py of the component Public 
  Invitation-Code Redemption Endpoint. The manipulation of the argument code 
  leads to missing authentication. Remote exploitation of the attack is 
  possible. The project was informed of the problem early through an issue 
  report but has not responded yet.
