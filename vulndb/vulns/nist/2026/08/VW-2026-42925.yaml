title: The Cookie Consent  WordPress plugin before 0.0.10 does not correctly 
  enforce its intended administrator-only capability check on its 
  consent-settings REST routes, so they fall back to an authentication-only 
  gate, allowing any authenticated user such as a subscriber to update the 
  Cookie Consent  WordPress plugin before 0.0.10's consent settings and, on 
  sites connected to the vendor's paid plan, read stored visitor consent logs.
