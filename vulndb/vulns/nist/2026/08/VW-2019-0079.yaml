title: Multiple vulnerabilities in the CLI of Cisco FXOS Software and Cisco 
  Firepower Threat Defense (FTD) Software could allow an authenticated, local 
  attacker to execute commands on the underlying operating system (OS) with root
  privileges. These vulnerabilities are due to insufficient input validation. An
  attacker could exploit these vulnerabilities by including crafted arguments to
  specific CLI commands. A successful exploit could allow the attacker to 
  execute commands on the underlying OS with root privileges.
