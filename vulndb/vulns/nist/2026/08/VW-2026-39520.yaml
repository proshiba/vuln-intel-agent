title: A vulnerability was determined in Poesis Rhymix CMS up to 2.1.33. This 
  impacts the function procImporterAdminCheckXmlFile of the file 
  modules/importer/importer.admin.controller.php of the component Data Import 
  Module. This manipulation of the argument filename causes server-side request 
  forgery. The attack is possible to be carried out remotely. The exploit has 
  been publicly disclosed and may be utilized. Upgrading to version 2.1.34 will 
  fix this issue. It is recommended to upgrade the affected component.
