title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Installation and Configuration).   The supported version
  that is affected is 11.2.25.0.000. Easily exploitable vulnerability allows unauthenticated
  attacker with network access via multiple protocols to compromise Oracle Hyperion
  Infrastructure Technology.  While the vulnerability is in Oracle Hyperion Infrastructure
  Technology, attacks may significantly impact additional products (scope change).  Successful
  attacks of this vulnerability can result in  unauthorized access to critical data
  or complete access to all Oracle Hyperion Infrastructure Technology accessible data.
  CVSS 3.1 Base Score 8.6 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N).'
