title: The wp-downloadmanager WordPress plugin, in version 1.68.11 (also 
  affecting the 6.9.4 release line), allows an admin-privileged user 
  (current_user_can('manage_downloads')) to upload arbitrary files via 
  download-add.php with no extension or MIME-type validation of any kind - no 
  wp_check_filetype_and_ext, no validate_file, and no extension blocklist exist 
  anywhere in the upload handler.
