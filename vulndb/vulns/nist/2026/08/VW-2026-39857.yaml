title: "Neo4j's Bolt modern handshake decoder treats an overlong capability bit mask
  the same way it treats a truncated bit mask. When an unauthenticated client sends
  a selected protocol version followed by 32 continuation bytes in the capability
  mask, the decoder resets the reader index and waits for more bytes instead of rejecting
  the protocol message and closing the channel.\n\n\n\nBecause the same unread bytes
  remain at the front of the decoder buffer, appending a terminating byte later does
  not recover the connection. The decoder re-reads the same first 32 continuation
  bytes, returns without producing a handshake-finalization message, and leaves the
  channel open.\n\n\n\nThis can be triggered before authentication by any client that
  can reach the Bolt connector."
