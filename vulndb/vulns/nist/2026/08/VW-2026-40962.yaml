title: An integer overflow vulnerability in the HTTP chunked transfer encoding 
  parser in tinyproxy up to and including version 1.11.3 allows an 
  unauthenticated remote attacker to cause a denial of service (DoS). The issue 
  occurs because chunk size values are parsed using strtol without properly 
  validating overflow conditions (e.g., errno == ERANGE).
