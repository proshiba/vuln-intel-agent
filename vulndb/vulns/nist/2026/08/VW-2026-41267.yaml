title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wilc1000: validate assoc response length before subtracting header\n\nwilc_parse_assoc_resp_info()
  computes the trailing IE length as\n\n\ties_len = buffer_len - sizeof(*res);\n\n\
  without first checking that buffer_len is at least sizeof(struct\nwilc_assoc_resp)
  (6 bytes). buffer_len is the length reported for a\nreceived association response
  (host_int_parse_assoc_resp_info() passes\nhif_drv->assoc_resp / assoc_resp_info_len
  straight in) and must be\nvalidated before the driver accesses the fixed header.\n\
  \nFor a frame shorter than the 6-byte fixed header, the subtraction wraps.\nFor
  a four-byte response the result is truncated to a u16 ies_len of\n65534, so kmemdup()
  then attempts to copy 65534 bytes starting at\nbuffer + sizeof(*res), beyond the
  valid association-response data\n(CWE-125). A response shorter than four bytes can
  also cause an\nout-of-bounds read of res->status_code at offsets 2 and 3.\n\nReject
  frames too short to h"
