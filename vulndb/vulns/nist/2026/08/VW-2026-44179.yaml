title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncgroup/cpuset:
  rebind mm mempolicy to effective_mems, not mems_allowed\n\nCreating a child cpuset
  where cpuset.mems is never set leads to a div/0\nwhen a VMA mempolicy with MPOL_F_RELATIVE_NODES
  rebinds in response to a\nCPU hotplug event.\n\nReproduction steps:\n 1) Create
  a cgroup w/ cpuset controls (do not set cpuset.mems)\n 2) Move the task into the
  child cpuset\n 3) Create a VMA mempolicy for that task with MPOL_F_RELATIVE_NODES\n\
  \ 4) unplug and hotplug a cpu\n      echo 0 > /sys/devices/system/cpu/cpu1/online\n\
  \      echo 1 > /sys/devices/system/cpu/cpu1/online\n 5) mempolicy rebind does a
  div/0 in mpol_relative_nodemask on the\n    call to __nodes_fold()\n\nThe cpuset
  code passes (cs->mems_allowed) which is not guaranteed to have\nnodes to the rebind
  routine.  Use cs->effective_mems instead, which is\nguaranteed to have a non-empty
  nodemask once we reach that code path.\n\n[ david: add a comment, slightly rephrase
  description ]"
