title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  flowtable: fix and simplify IP6IP6 tunnel handling\n\nFix nf_flow_ip6_tunnel_proto()
  to use pskb_may_pull() instead of\nskb_header_pointer() to ensure the outer IPv6
  header is in the skb\nheadroom, which is required for subsequent packet processing.
  Move\nctx->offset update inside the IPPROTO_IPV6 conditional block since it\nshould
  only be adjusted when an IP6IP6 tunnel is actually detected.\nSimplify the rx path
  by removing ipv6_skip_exthdr() and checking\nip6h->nexthdr directly, as the flowtable
  fast path only handles simple\nIP6IP6 encapsulation without extension headers.\n\
  Drop the tunnel encapsulation limit destination option support from the\ntx path
  to match, since the rx path no longer handles extension headers.\nRemove the encap_limit
  parameter from nf_flow_offload_ipv6_forward(),\nnf_flow_tunnel_ip6ip6_push() and
  nf_flow_tunnel_v6_push(), along with\nthe ipv6_tel_txoption struct and related headroom/MTU
  adjustme"
