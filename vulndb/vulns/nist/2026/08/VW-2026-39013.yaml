title: "CTI-Transmute contains an uncontrolled resource-consumption vulnerability
  in the unauthenticated /activity_timeline endpoint. The endpoint accepts a user-controlled
  days query parameter that was not restricted to a reasonable range.\n\nA remote,
  unauthenticated attacker could submit an excessively large value for this parameter,
  causing the application to retrieve and process activity data over an arbitrarily
  large period. This could consume excessive database, CPU, or memory resources, delay
  the processing of concurrent requests, or trigger an internal server error. Repeated
  requests could further degrade the availability of the CTI-Transmute website.\n\n\
  The vulnerability is corrected by clamping the requested timeline range to a minimum
  of one day and a maximum of 1,095 days."
