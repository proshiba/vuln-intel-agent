title: electerm is an open-sourced 
  terminal/ssh/sftp/telnet/serialport/RDP/VNC/Spice/ftp client. Prior to 
  3.15.120, electerm allows a malicious RDP server to write attacker-controlled 
  content outside the selected save directory because the RDP clipboard download
  path in src/client/components/rdp/file-transfer.js passes the 
  server-controlled CLIPRDR filename fileInfo.name to osResolve without 
  sanitization. This issue is fixed in version 3.15.120.
