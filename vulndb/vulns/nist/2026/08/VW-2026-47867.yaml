title: "Aeon load_human_activity_segmentation_datasets Code Injection Remote Code
  Execution Vulnerability. This vulnerability allows remote attackers to execute arbitrary
  code on affected installations of aeon. User interaction is required to exploit
  this vulnerability in that the target must visit a malicious page or open a malicious
  file.\n\nThe specific flaw exists within the load_human_activity_segmentation_datasets
  method. The issue results from the lack of proper validation of a user-supplied
  string before using it to execute Python code. An attacker can leverage this vulnerability
  to execute code in the context of the current process. Was ZDI-CAN-29160."
