title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  fib6: fix NULL deref in fib6_walk_continue() on multi-batch dump\n\ninet6_dump_fib()
  saves its progress in cb->args[1] as a positional\nindex within the current hash
  chain.  Between batches, a concurrent\nfib6_new_table() can insert a new table at
  the chain head, shifting\nall existing entries.  The saved index then lands on a
  different\ntable, causing fib6_dump_table() to set w->root to the wrong table\n\
  while w->node still points into the previous one.\nfib6_walk_continue() dereferences
  w->node->parent (NULL) and panics:\n\n  BUG: kernel NULL pointer dereference, address:
  0000000000000008\n  RIP: 0010:fib6_walk_continue+0x6e/0x170\n  Call Trace:\n   <TASK>\n\
  \   fib6_dump_table.isra.0+0xc5/0x240\n   inet6_dump_fib+0xf6/0x420\n   rtnl_dumpit+0x30/0xa0\n\
  \   netlink_dump+0x15b/0x460\n   netlink_recvmsg+0x1d6/0x2a0\n   ____sys_recvmsg+0x17a/0x190\n\
  \nFix by storing tb->tb6_id in cb->args[1] instead of a positional\nindex.  On resume,
  skip e"
