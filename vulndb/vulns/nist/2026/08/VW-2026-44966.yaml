title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: fix race of kfree vs kref_get_unless_zero\n\nhci_conn::iso_data is accessed
  and modified without lock or RCU.\nThis leads to a race\n\n    [Task hdev->workqueue]\
  \                 \t[Task 2]\n    iso_recv                                    iso_conn_put(conn)\n\
  \      conn = LOAD hcon->iso_data                  iso_conn_free(conn)\n      iso_conn_hold_unless_zero(conn)\
  \               hcon->iso_data = NULL\n                                        \
  \            kfree(conn)\n        kref_get_unless_zero(&conn->ref) /* UAF */\n\n\
  and also to races in iso_conn_add() vs. iso_conn_free().\n\nFix by adding spinlock
  hci_conn::proto_lock and using it to guard\nhci_conn::iso_data."
