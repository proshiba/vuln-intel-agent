title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvsock:
  remove vsock from connected table when connect is interrupted by a signal\n\nvsock_connect()
  expects that the socket could already be in the\nTCP_ESTABLISHED state when the
  connecting task wakes up with a signal\npending. If this happens the socket will
  be in the connected table, and\nit is not removed when the socket state is reset.
  In this situation it's\ncommon for the process to retry connect(), and if the connection
  is\nsuccessful the socket will be added to the connected table a second\ntime, corrupting
  the list.\n\nPrevent this by calling vsock_remove_connected() if a signal is received\n\
  while waiting for a connection. This is harmless if the socket is not in\nthe connected
  table, and if it is in the table then removing it will\nprevent list corruption
  from a double add.\n\nNote for backporting: this patch requires d5afa82c977e (\"\
  vsock: correct\nremoval of socket from the list\"), which is in all current stable
  trees\nexc"
