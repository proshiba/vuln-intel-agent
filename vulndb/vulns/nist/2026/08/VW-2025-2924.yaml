title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Fix double release compute pasid\n\nIf kfd_process_device_init_vm returns failure
  after vm is converted to\ncompute vm and vm->pasid set to compute pasid, KFD will
  not take\npdd->drm_file reference. As a result, drm close file handler maybe\ncalled
  to release the compute pasid before KFD process destroy worker to\nrelease the same
  pasid and set vm->pasid to zero, this generates below\nWARNING backtrace and NULL
  pointer access.\n\nAdd helper amdgpu_amdkfd_gpuvm_set_vm_pasid and call it at the
  last step\nof kfd_process_device_init_vm, to ensure vm pasid is the original pasid\n\
  if acquiring vm failed or is the compute pasid with pdd->drm_file\nreference taken
  to avoid double release same pasid.\n\n amdgpu: Failed to create process VM object\n\
  \ ida_free called for id=32770 which is not allocated.\n WARNING: CPU: 57 PID: 72542
  at ../lib/idr.c:522 ida_free+0x96/0x140\n RIP: 0010:ida_free+0x96/0x140\n Call Trace:\n\
  \  amdgpu_pasid_free"
