title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  wcn36xx: fix OOB read from firmware count in PRINT_REG_INFO indication\n\nThe firmware-controlled
  rsp->count field is used as the loop bound for\nindexing into the flexible rsp->regs[]
  array without validation against\nthe message length. A count exceeding the actual
  data causes out-of-\nbounds reads from the heap-allocated message buffer.\n\nAdd
  a check that count fits within the received message."
