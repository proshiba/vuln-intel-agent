title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  validate stream count in sctp_process_strreset_inreq()\n\nWhen processing a RESET_IN_REQUEST
  from a peer,\nsctp_process_strreset_inreq() derives the stream count from the\n\
  parameter length but does not check whether the resulting\nRESET_OUT_REQUEST would
  exceed SCTP_MAX_CHUNK_LEN.\n\nThe OUT request header (sctp_strreset_outreq, 16 bytes)
  is 8 bytes\nlarger than the IN request header (sctp_strreset_inreq, 8 bytes).\n\
  Generally, the IP payload is bounded to 65535 bytes, so the stream\nlist cannot
  be large enough to trigger the overflow. However, on\ninterfaces with MTU > 65535
  (e.g., loopback with IPv6 jumbograms), a\nstream list that fits within the incoming
  IN parameter can cause a\n__u16 overflow in sctp_make_strreset_req() when computing
  the OUT\nrequest size, leading to an undersized skb allocation and a kernel\nBUG:\n\
  \n  net/core/skbuff.c:207         skb_panic\n  net/core/skbuff.c:2625        skb_put\n\
  \  net/sctp/sm_make_chunk."
