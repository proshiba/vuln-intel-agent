title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: close a re-opened queue timer in the destructor\n\nqueue_delete() closes the
  queue timer, then frees it. snd_seq_timer_close()\nclears q->timer->timeri. snd_use_lock_sync()
  then drains borrowers, and\nsnd_seq_timer_delete() frees q->timer.\n\nA borrower
  can re-open the timer inside that window. A SET_QUEUE_CLIENT\nthat took a queueptr()
  use_lock reference before the queue was unlinked\nruns snd_seq_timer_open() after
  the close. Open refuses re-open only while\ntimeri is set, and the close just cleared
  it, so it re-opens timeri.\n\nsnd_seq_timer_delete() does not close that instance.
  Its snd_seq_timer_stop()\nis a no-op, because running was cleared first. So it frees
  q->timer with the\ninstance still live. The queue is freed next.\n\nThe instance
  stays on the global timer with callback_data pointing at the\nfreed queue. A non-owner
  START on the unlocked queue arms it. The next tick\nderefs the freed queue in snd_seq_timer_in"
