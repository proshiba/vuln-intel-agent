title: A security flaw has been discovered in MZ Automation libiec61850 up to 
  1.6.1. This affects the function SVReceiver_stopThreadless of the file 
  src/sampled_values/sv_subscriber.c of the component ASDU Element Handler. 
  Performing a manipulation results in heap-based buffer overflow. The attack 
  must be initiated from a local position. The exploit has been released to the 
  public and may be used for attacks. Upgrading to version 1.6.2 is able to 
  mitigate this issue. The patch is named 
  a96bd674e0238276dd1387d31d52e55229d0771e. The affected component should be 
  upgraded.
