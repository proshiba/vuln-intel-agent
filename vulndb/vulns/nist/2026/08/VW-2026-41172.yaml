title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix check in amdgpu_hmm_invalidate_gfx\n\nFor a short moment during alloc/free the
  userptr BO is not part of his VM,\nso bo->vm_bo can be NULL.\n\nKeep a reference
  to the VM root PD as parent of the userptr BO so that\nwe can always use that to
  wait for all submissions of the VM instead of\nonly the one involving the userptr
  BO.\n\n(cherry picked from commit 631849ff5d603841e74f19f4a5e30fe1f7d7cf30)"
