title: "In the Linux kernel, the following vulnerability has been resolved:\n\novpn:
  fix use after free in unlock_ovpn()\n\nunlock_ovpn() iterates over the release_list
  using llist_for_each_entry()\nand drops the peer reference inside the loop body
  via ovpn_peer_put().\n\nIf this drops the last reference, the peer is eventually
  freed. However,\nllist_for_each_entry() reads peer->release_entry.next in the loop
  advance\nexpression, which runs after the body. By that time the peer may have\n\
  already been freed, resulting in a use after free when advancing to the\nnext list
  entry.\n\nFix this by using llist_for_each_entry_safe(), which caches the next\n\
  pointer before executing the loop body."
