title: AgenticSeek (commit fc242c7) contains an unauthenticated remote code 
  execution vulnerability that allows any network-adjacent attacker to execute 
  arbitrary commands by submitting crafted queries to the unprotected POST 
  /query API endpoint bound to 0.0.0.0:7777 with wildcard CORS. Attackers can 
  send unauthenticated HTTP requests that cause the autonomous agent to generate
  and execute shell commands through BashInterpreter using subprocess.Popen with
  shell=True and safety=False, bypassing the incomplete command blocklist to 
  achieve full host-level code execution.
