title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Fix iommu domain lifetime race during device removal\n\nWhen force_iova mode is
  enabled, amdxdna_remove() frees xdna->domain. If\namdxdna_gem_obj_free() is called
  after device removal, it may attempt to\naccess xdna->domain, resulting in a use-after-free.\n\
  \nFix the race by adding freeing xdna->domain as a managed release action,\nso its
  lifetime is managed by DRM and remains valid until all managed\nresources are released."
