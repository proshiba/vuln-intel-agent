title: Sieve CPU resource usage is tracked in the compiled script, so an 
  attacker that has valid credentials can reset the accounting by repeatedly 
  changing the active script. Compiled script files are also not removed when a 
  script is deleted or renamed. The configured Sieve CPU limit can be bypassed, 
  allowing sustained CPU consumption, and the leftover files increase disk 
  consumption. Both can cause degradation of service for mail delivery. Monitor 
  system for abnormal CPU usage and disk consumption. Update to non-vulnerable 
  version. No publicly available exploits are known.
