title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/qeth:
  validate user buffer length in SNMP and ARP query ioctls\n\nqeth_snmp_command()
  and qeth_l3_arp_query() allocate a buffer sized by\na user-supplied length (udata_len)
  without checking a lower bound, then\nset udata_offset to a fixed non-zero value
  and pass both to a reply\ncallback. The callback bounds-checks the copy with\n\n\
  \        if ((udata_len - udata_offset) < len)\n\nBoth fields are u32, so a udata_len
  smaller than udata_offset makes the\nsubtraction wrap and the check pass, and the
  following memcpy() writes\npast the allocation. A udata_len of 0 also yields ZERO_SIZE_PTR
  from\nkzalloc(), which the existing NULL check does not catch.\n\nReject buffers
  smaller than udata_offset before allocating, so the\ncallback subtraction can no
  longer underflow."
