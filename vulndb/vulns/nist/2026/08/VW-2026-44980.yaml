title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (adt7470) Fix busy-loop and I2C flooding in update thread\n\nWhen userspace configures
  'auto_update_interval' to 0 via sysfs, the\nbackground kthread executes schedule_timeout_interruptible(0),
  which\nreturns immediately.\n\nIf 'num_temp_sensors' is concurrently or previously
  set to 0, the\nmsleep_interruptible() delay inside adt7470_read_temperatures() also\n\
  becomes 0. This combination forces the background thread into a tight,\nunbounded
  busy-loop, hogging the CPU and flooding the I2C bus with a\ncontinuous stream of
  transactions.\n\nFix this vulnerability by raising the lower limit of the clamp_val
  in\nauto_update_interval_store() from 0 to 500 milliseconds. This guarantees\na
  reasonable minimum sleep window between sensor updates, protecting the\nsystem from
  intentional or accidental I2C bus denial of service."
