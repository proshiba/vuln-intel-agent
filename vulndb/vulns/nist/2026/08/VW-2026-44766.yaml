title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  reject FITRIM ranges shorter than a cluster\n\nocfs2_trim_mainbm() trims the global
  bitmap in cluster units, but its\ntoo-short range validation only checks sb->s_blocksize.\n\
  \nOn filesystems with a cluster size larger than the block size, a FITRIM\nrange
  that is at least one block but shorter than one cluster is accepted\nand shifted
  down to len == 0.  The later start + len - 1 and len -= ... \narithmetic then underflows
  and can drive trimming past the requested\nrange.\n\nReject ranges shorter than
  s_clustersize instead.  That preserves the\nexisting -EINVAL behavior for requests
  that cannot discard even one\nallocation unit and keeps zero-cluster trims out of
  the group walk."
