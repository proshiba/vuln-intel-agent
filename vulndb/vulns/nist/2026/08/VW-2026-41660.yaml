title: TBEA TLogger V2.1.0.0B0.0.0.0 contains multiple unauthenticated 
  denial-of-service vulnerabilities in its web server. An unauthenticated remote
  attacker can invoke specific HTTP endpoints to reboot or reset the device, 
  clear application data, or terminate the web server through a segmentation 
  fault. In addition, multiple action endpoints process attacker-controlled 
  parameters using unsafe string operations such as sprintf() and strcat() 
  without adequate bounds checking, allowing crafted input to trigger buffer 
  overflows and crash the web server. The affected endpoints include onRestart, 
  onReset, ClearData, uploadInvFile, getIndiaRPData, YearCaparity, 
  TotalfaultData, recordData, InvHistoryData, CollectHistoryData, InvFaultData, 
  GetPortTableByParm, and UpdatePortConfig.
