title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  reject zero bucket types in crush_decode\n\nCRUSH bucket type 0 is reserved for
  devices.  The mapper relies on\nthat invariant and uses type 0 to identify leaf
  devices.\n\nIf crush_decode() accepts a bucket with type 0, a malformed CRUSH map\n\
  can make the mapper treat a negative bucket ID as a device and pass it\nto is_out(),
  which then indexes the OSD weight array with a negative\nvalue.\n\nReject zero bucket
  types while decoding the CRUSH map so the invalid\nstate never reaches the mapper."
