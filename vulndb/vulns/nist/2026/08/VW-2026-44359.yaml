title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fix mrec_lock ABBA deadlock in rename\n\nntfs_file_fsync(), ntfs_dir_fsync() and
  __ntfs_write_inode() lock an\ninode's mrec_lock before taking the mrec_lock of its
  parent directory.\n\nntfs_rename() takes old_ni->mrec_lock and old_dir_ni->mrec_lock\n\
  before taking new_ni->mrec_lock for an existing target, or\nnew_dir_ni->mrec_lock
  for a cross-directory rename.\nThis can deadlock when ntfs_file_fsync() or __ntfs_write_inode()
  holds\nthe target inode, or when ntfs_dir_fsync() holds a child target\ndirectory,
  while rename() holds the parent directory and waits for the\ntarget.\n\nFix this
  by locking the existing target inode before taking any parent\ndirectory mrec_lock.
  For cross-directory renames where the target parent\nis a descendant of the source
  parent, lock the target parent before the\nsource parent so the directory order
  matches the child-to-parent order used\nby ntfs_file_fsync(), ntfs_dir_fsync(),
  and __ntfs_write_inode("
