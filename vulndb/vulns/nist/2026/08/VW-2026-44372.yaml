title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  skip extent mft records in writeback to prevent deadlock\n\nThis patch fixes the
  ABBA deadlock between extent_lock and extent\nmrec_lock triggered by xfstests generic/113,
  that occurs since the commit\n6994acf33bae (\"ntfs: use base mft_no when looking
  up base inode for\n\t\textent record\").\n\nPath A (inode writeback):\n  VFS writeback\n\
  \    -> ntfs_write_inode()\n      -> __ntfs_write_inode()\n        -> mutex_lock(&ni->extent_lock)\n\
  \        -> mutex_lock(&tni->mrec_lock)\n\nPath B (MFT folio writeback):\n  VFS
  writeback of $MFT dirty folios\n    -> ntfs_mft_writepages()\n      -> ntfs_write_mft_block()\n\
  \        -> ntfs_may_write_mft_record()\n          -> holds one extent mrec_lock
  from a previous iteration\n          -> tries to acquire another base inode extent_lock\n\
  \nBy removing all extent_lock and extent mrec_lock acquisition from the MFT\nfolio
  writeback path, the ABBA lock ordering is eliminated:\n\nPath A: __ntfs_write_inode():
  e"
