title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/remotes:
  Fix leak in trace_remote_alloc_buffer() error path\n\nIf page allocation fails in
  trace_remote_alloc_buffer(), desc->nr_cpus\nis not yet incremented for the current
  CPU. As a consequence, on error,\nhalf-allocated rb_desc will not be freed in trace_remote_free_buffer().\n\
  \nIncrement desc->nr_cpus as soon as the first allocation for the current\nCPU has
  succeeded."
