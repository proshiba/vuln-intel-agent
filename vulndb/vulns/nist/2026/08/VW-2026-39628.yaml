title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix unsol_bcast_probe_resp double free on alloc failure\n\nieee80211_set_unsol_bcast_probe_resp()
  calls kfree_rcu() on the old\ntemplate before allocating the replacement. If the
  kzalloc() then fails,\nit returns -ENOMEM while link->u.ap.unsol_bcast_probe_resp
  still points\nat the object already queued for freeing. A later update or AP teardown\n\
  re-queues that same rcu_head; the second free is caught by KASAN when the\nRCU sheaf
  is processed in softirq:\n\n  BUG: KASAN: double-free in rcu_free_sheaf (mm/slub.c:5850)\n\
  \  Free of addr ffff88800d06f300 by task exploit/145\n   ...\n   __rcu_free_sheaf_prepare
  (mm/slub.c:2634 mm/slub.c:2940)\n   rcu_free_sheaf (mm/slub.c:5850)\n   rcu_core
  (kernel/rcu/tree.c:2617 kernel/rcu/tree.c:2869)\n   handle_softirqs (kernel/softirq.c:622)\n\
  \  The buggy address belongs to the cache kmalloc-128 of size 128\n\nQueue the old
  object for kfree_rcu() only after the new one is published,\nmatchi"
