title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/guc:
  Fix buffer overflow in steered register list allocation\n\nThe size calculation
  for the steered register extarray uses only the\ngeometry DSS mask (g_dss_mask)
  to determine the number of entries to\nallocate:\n\n  total = bitmap_weight(gt->fuse_topo.g_dss_mask,
  ...) * steer_reg_num;\n\nHowever, the filling loop uses for_each_dss_steering(),
  which iterates\nover for_each_dss(), defined as the union of g_dss_mask and c_dss_mask\n\
  (geometry + compute DSS). On platforms with compute-only DSS bits, the\nloop writes
  past the allocated buffer, corrupting adjacent slab objects.\n\nThis manifests as
  list_del corruption and SLUB redzone overwrites during\ndrm_managed_release on device
  unbind, since the overflow corrupts the\ndrmres list_head of neighboring allocations.\n\
  \nFix by computing the allocation size using the union of both DSS masks,\nmatching
  the iteration pattern of for_each_dss_steering().\n\n--\nv2:\n- use bitmap_weighted_or("
