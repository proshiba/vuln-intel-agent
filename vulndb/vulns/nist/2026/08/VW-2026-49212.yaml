title: A flaw has been found in Faveo Helpdesk up to 2.0.3. This impacts the 
  function FormController::post_ticket_reply of the file 
  app/Http/Controllers/Client/helpdesk/FormController.php of the component 
  post-ticket-reply Endpoint. This manipulation causes missing authentication. 
  The attack can be initiated remotely. The exploit has been published and may 
  be used. The project was informed of the problem early through an issue report
  but has not responded yet.
