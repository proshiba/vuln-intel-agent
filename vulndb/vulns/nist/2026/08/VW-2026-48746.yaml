title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amxdna:
  Fix page-insertion errors in amdxdna_insert_pages()\n\nTwo error paths in amdxdna_insert_pages()
  called vma->vm_ops->close(vma)\nbefore returning an error code to the caller.  This
  is incorrect:\namdxdna_gem_obj_mmap() registers an HMM interval notifier before
  calling\namdxdna_insert_pages(), and on a hard error it jumps to hmm_unreg to undo\n\
  that registration.  Calling vm_ops->close() manually — which drops the\nshmem pages_pin_count
  and the GEM object reference that backs the VMA —\nbefore the mmap syscall has even
  returned causes those resources to be\nreleased while the VMA is still alive.  The
  kernel VMA teardown will call\nvm_ops->close() a second time when the process later
  unmaps the range,\nproducing a reference count underflow.\n\nReplace both hard-error
  returns with a deferred-fault approach that keeps\nthe VMA alive and retries page
  insertion through the HMM range-fault path."
