title: Scriban before 7.2.2 contains an access-modifier bypass vulnerability in 
  TypedObjectAccessor that allows template code to write CLR object properties 
  without setter-visibility checks. Attackers can modify properties with 
  private, internal, or init-only setters, and perform mass assignment on 
  public-setter properties, permanently altering live host objects after 
  template rendering.
