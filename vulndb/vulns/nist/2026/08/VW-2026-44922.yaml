title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: fix tid_tx use-after-free on BA session stop\n\nieee80211_stop_tx_ba_cb()
  hands tid_tx to kfree_rcu() through\nieee80211_remove_tid_tx(), and then reads tid_tx->ndp
  after dropping\nsta->lock:\n\n\tieee80211_remove_tid_tx(sta, tid);\t/* kfree_rcu(tid_tx,
  rcu_head) */\n\t...\n\tspin_unlock_bh(&sta->lock);\n\n\tif (start_txq)\n\t\tieee80211_agg_start_txq(sta,
  tid, false);\n\n\tif (send_delba)\n\t\tieee80211_send_delba(..., tid_tx->ndp);\n\
  \nThat read is not covered by an RCU read-side critical section, and it runs\nin
  preemptible process context: both callers hold the wiphy mutex, reaching\nit either
  from the ieee80211_ba_session_work() wiphy work or from\nieee80211_sta_tear_down_BA_sessions()
  during station teardown.\nSoftirqs can run in that window too, both from the local_bh_enable()
  that\nends ieee80211_agg_start_txq() and from any interrupt exit, so the RCU\ncallback
  can free tid_tx before the read.\n\nDriving the function from a test"
