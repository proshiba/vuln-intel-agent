title: "Spring Batch's FlatFileItemReader supports files where a single logical record
  spans multiple physical lines — for example, a CSV field that contains embedded
  newlines wrapped in quotes. A specially crafted input file could exploit the way
  the reader assembles those multi-line records to consume excessive CPU time and
  memory, causing the batch job to stall or run out of memory.\nSpring Batch 6.0.0
  - 6.0.4\nSpring Batch 5.2.0 - 5.2.6\nSpring Batch 4.3.0 - 4.3.13"
