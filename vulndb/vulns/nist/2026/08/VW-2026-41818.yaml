title: Due to a Cross-Site Scripting (XSS) vulnerability in SAP NetWeaver 
  Application Server ABAP, an authenticated attacker could generate a malicious 
  link and make it publicly accessible. If an authenticated victim accesses this
  link, the injected input is processed and reflected within the DOM on the 
  client side during page rendering, resulting in the execution of malicious 
  content in the victim's browser context. Successful exploitation could result 
  in a high impact to the confidentiality and a low impact to the integrity of 
  the system, while availability remains unaffected.
