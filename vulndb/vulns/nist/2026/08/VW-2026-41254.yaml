title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  stratix10-svc: fix memory leaks and list corruption bugs\n\nFix a memory leak when
  gen_pool_alloc() fails by freeing pmem on the error\npath. Switch pmem allocation
  from devm_kzalloc() to kzalloc() with\nexplicit kfree() in the free path to match
  its list-managed lifetime.\nRemove the erroneous list_del(&svc_data_mem) which corrupted
  the list head\non failed lookups."
