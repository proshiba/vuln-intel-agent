title: "Issue summary: Receiving a DTLS record for a future epoch while a handshake\n\
  is in progress causes OpenSSL to buffer far more memory than the record\nitself
  requires.\n\nImpact summary: A peer can use a small amount of network traffic to
  make an\nOpenSSL DTLS endpoint retain a disproportionately large amount of memory,\n\
  which may lead to a Denial of Service.\n\nCWE: CWE-405: Asymmetric Resource Consumption
  (Amplification)\n\nDescription: While a DTLS handshake is in progress, a peer may
  legitimately\nhave already moved on to the next epoch (for example, having sent
  its\nChangeCipherSpec and Finished messages) before the local endpoint has\nprocessed
  the same transition, typically because of reordering on the\nunderlying UDP transport.
  OpenSSL buffers such early records so that they\ncan be processed once the local
  endpoint catches up.\n\nBuffering a record currently retains the entire read buffer
