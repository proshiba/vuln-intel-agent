title: Capstone is a disassembly framework. Prior to version 6.0.0-Alpha9, 
  Capstone's public `cs_insn_name()` API forwards caller-supplied instruction 
  IDs directly to the selected architecture backend. Most backends validate the 
  ID before indexing instruction-name tables, but the M68K and RISCV backends 
  have missing or incomplete bounds checks. On a Capstone handle opened for M68K
  or RISCV, a caller-controlled invalid instruction ID can trigger an 
  out-of-bounds read and crash the process. The demonstrated impact is 
  availability loss in applications or bindings that expose instruction-name 
  lookup to untrusted IDs. No code execution or data disclosure was 
  demonstrated. Version 6.0.0-Alpha9 patches the issue.
