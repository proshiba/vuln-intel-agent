title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  serialize kernel accept preallocation with socket teardown\n\nrxrpc_kernel_charge_accept()
  reads rx->backlog without any\nsocket/backlog synchronization and passes that raw
  pointer into\nrxrpc_service_prealloc_one(). A concurrent rxrpc_discard_prealloc()\n\
  sets rx->backlog = NULL and frees the backlog rings, so a kernel\npreallocation
  worker can keep using a freed struct rxrpc_backlog\nwhile updating *_backlog_head/tail
  and array slots.\n\nSerialize the state check and backlog lookup with the socket
  lock,\nand reject kernel preallocation once teardown has disabled\nlistening or
  discarded the service backlog."
