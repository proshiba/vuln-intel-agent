title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix missing cleanup on rollforward recovery error\n\nIn an error injection test
  of a routine for mount-time recovery, KASAN\nfound a use-after-free bug.\n\nIt turned
  out that if data recovery was performed using partial logs\ncreated by dsync writes,
  but an error occurred before starting the log\nwriter to create a recovered checkpoint,
  the inodes whose data had been\nrecovered were left in the ns_dirty_files list of
  the nilfs object and\nwere not freed.\n\nFix this issue by cleaning up inodes that
  have read the recovery data if\nthe recovery routine fails midway before the log
  writer starts."
