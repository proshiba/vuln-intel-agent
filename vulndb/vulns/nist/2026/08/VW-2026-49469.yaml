title: rclone serve s3 before 1.74.4 contains a path traversal vulnerability 
  that allows attackers to read and overwrite root-level files by using dot-dot 
  segments in S3 object keys. Attackers can send requests with object keys like 
  ../root-secret.txt to escape the bucket namespace and access files in the 
  serve root directory.
