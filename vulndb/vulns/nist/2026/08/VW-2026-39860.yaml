title: A vulnerability was determined in imranrisal-dev 
  Student-Management-System 
  18ea7904c339e0c7b0234724a79c939ce6191def/a8d43a29aaf267e7ca97171d6dbb44057bcd7f8c.
  This affects the function storeProfileImage of the file 
  student_profile_pic.php of the component Shared Upload Helper. Executing a 
  manipulation of the argument choose_file can lead to unrestricted upload. The 
  attack can be executed remotely. The exploit has been publicly disclosed and 
  may be utilized. This product implements a rolling release for ongoing 
  delivery, which means version information for affected or updated releases is 
  unavailable. The vendor was contacted early about this disclosure but did not 
  respond in any way.
