title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvduse:
  hold vduse_lock across IDR lookup in open path\n\nvduse_dev_open() looks up struct
  vduse_dev through the IDR and then\nacquires dev->lock only after vduse_lock has
  been dropped.\n\nThis leaves a window where a concurrent VDUSE_DESTROY_DEV can remove
  the\nsame object from the IDR and free it before the open path locks the\ndevice,
  leading to a use-after-free.\n\nClose this race by keeping vduse_lock held until
  dev->lock has been\nacquired in the open path, matching the lock ordering already
  used by\nthe destroy path."
