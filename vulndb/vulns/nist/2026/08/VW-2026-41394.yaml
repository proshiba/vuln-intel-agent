title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  serialize udp bearer replicast list updates\n\ntipc_udp_rcast_add() and cleanup_bearer()
  both update ub->rcast.list with\nlist_add_rcu() / list_del_rcu(), but nothing serializes
  them. The add runs\nfrom the encap receive softirq (via tipc_udp_rcast_disc()) without\n\
  rtnl_lock(), so it can race the cleanup delete and corrupt the list:\n\n  list_del
  corruption. prev->next should be ffff8880298d7ab8,\n    but was ffff88802449ad38.
  (prev=ffff888027e3ec98)\n  kernel BUG at lib/list_debug.c:62!\n  RIP: __list_del_entry_valid_or_report+0x17a/0x200\n\
  \  Workqueue: events cleanup_bearer\n  Call Trace:\n   cleanup_bearer (net/tipc/udp_media.c:811)\n\
  \   process_one_work (kernel/workqueue.c:3302)\n   worker_thread (kernel/workqueue.c:3466)\n\
  \nThe bearer can be enabled from an unprivileged user namespace, as the\nTIPCv2
  generic-netlink ops carry no GENL_ADMIN_PERM.\n\nAdd a spinlock to struct udp_bearer
  and take it around the list_add_rcu()\nin tipc"
