title: Server-side request forgery (SSRF) in the /har/test endpoint in QD 
  20220208 through 20250803. Fetcher.build_request() in libs/fetcher.py 
  constructs an httpclient.HTTPRequest from user-supplied JSON without 
  validating URL scheme, host, or IP range. The /har/test handler does not 
  require authentication, enabling unauthenticated remote attackers to force the
  QD server to send arbitrary HTTP requests to internal network resources and 
  cloud metadata endpoints. validate_cert is set to False, disabling TLS 
  verification.
