title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7996: Fix possible NULL pointer dereference in mt7996_mac_write_txwi_80211()\n\
  \nFor injected frames (e.g. via radiotap), mac80211 can pass\ninfo->control.vif
  = NULL, as explicitly noted in struct ieee80211_tx_info.\nCheck vif pointer before
  executing ieee80211_vif_is_mld() in\nmt7996_mac_write_txwi_80211 routine in order
  to avoid a possible NULL\npointer dereference."
