title: "In the Linux kernel, the following vulnerability has been resolved:\n\nx86/bugs:
  Make Safe-RET robust against interrupt injection\n\nAn attacker injecting interrupts
  while the Safe-RET mitigation executes\non machines affected by SRSO can neutralize
  the safe return sequence,\npotentially leading to data leakage through speculative
  execution.\n\nFixup register state as if the Safe-RET sequence executed successfully\n\
  by \"emulating\" it, in a manner of speaking, and avoid executing a RET\ninstruction
  after returning from the interrupt."
