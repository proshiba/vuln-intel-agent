title: Ghidra before 12.1.3 contains an uncontrolled resource consumption 
  vulnerability in the PDB parser that allows attackers to terminate the Ghidra 
  process by supplying a crafted PDB file with an oversized parameters section. 
  The AbstractPdb deserialization routine reads all remaining parameters into an
  unbounded list, causing uncontrolled heap growth that triggers an 
  OutOfMemoryError which bypasses exception handling and crashes the 
  application.
