title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate session id and tree id in the compound request\n\nThis patch validate session
  id and tree id in compound request.\nIf first operation in the compound is SMB2
  ECHO request, ksmbd bypass\nsession and tree validation. So work->sess and work->tcon
  could be NULL.\nIf secound request in the compound access work->sess or tcon, It
  cause\nNULL pointer dereferecing error."
