title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - fix type confusion in CDC union descriptor parsing\n\nThe driver currently
  trusts the bMasterInterface0 from the CDC union\ndescriptor without verifying that
  it matches the interface being\nprobed. This could lead to the driver overwriting
  the private data of\nanother interface.\n\nValidate that the control interface found
  in the descriptor is indeed\nthe one we are probing."
