title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirewire:
  ohci: fix NULL pointer dereference in ar_context_release\n\nDuring the error handling
  path of the driver's probe function, a NULL\npointer dereference can occur in ar_context_release().\n\
  \nWhen pci_probe() fails early (e.g., if pcim_enable_device() or MMIO mapping\n\
  fails), the devres cleanup mechanism invokes release_ohci(). This function\nunconditionally
  calls ar_context_release() to clean up the asynchronous\nreceive contexts. However,
  if ar_context_init() was not yet called,\nctx->ohci remains NULL (as the fw_ohci
  structure is zero-initialized by\ndevres_alloc()).\n\nar_context_release() immediately
  dereferences ctx->ohci to get the dev\npointer before checking if the context was
  actually initialized, leading to\na crash:\n\nOops: general protection fault, probably
  for non-canonical address\n0xdffffc0000000001: 0000 [#1] SMP KASAN NOPTI\nKASAN:
  null-ptr-deref in range [0x0000000000000008-0x000000000000000f]\nRIP: 0010:ar_co"
