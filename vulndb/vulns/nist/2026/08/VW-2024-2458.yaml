title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  rtw89: avoid to add interface to list twice when SER\n\nIf SER L2 occurs during
  the WoWLAN resume flow, the add interface flow\nis triggered by ieee80211_reconfig().
  However, due to\nrtw89_wow_resume() return failure, it will cause the add interface
  flow\nto be executed again, resulting in a double add list and causing a kernel\n\
  panic. Therefore, we have added a check to prevent double adding of the\nlist.\n\
  \nlist_add double add: new=ffff99d6992e2010, prev=ffff99d6992e2010, next=ffff99d695302628.\n\
