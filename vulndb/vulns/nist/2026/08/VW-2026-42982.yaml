title: NetBSD's hdaudio(4) driver in sys/dev/hdaudio/hdaudio.c contains a 
  missing access control vulnerability that allows unprivileged local attackers 
  to invoke the HDAUDIO_FGRP_SETCONFIG ioctl without elevated permissions by 
  exploiting the absence of an access check on /dev/hdaudioN device nodes. 
  Attackers can repeatedly issue HDAUDIO_FGRP_SETCONFIG from one thread while 
  keeping DMA and IRQs live from a second thread to trigger a use-after-free 
  race condition in hdafg_detach() between stream_stop() and 
  stream_disestablish(), where a latched DMA interrupt dereferences a freed 
  callback pointer, resulting in outcomes ranging from audio-subsystem denial of
  service and kernel panic to potential local kernel privilege escalation.
