title: A weakness has been identified in pkp pkp-lib 3.3.0/3.4.0/3.5.0. This 
  vulnerability affects the function setData of the file 
  classes/user/form/APIProfileForm.php of the component API Key Generation. 
  Executing a manipulation of the argument apiKey can lead to insufficient 
  entropy. The attack may be performed from remote. This attack is characterized
  by high complexity. It is stated that the exploitability is difficult. This 
  patch is called 529b5df878e571ccc727647f7748eafc1466b041. It is best practice 
  to apply a patch to resolve this issue.
