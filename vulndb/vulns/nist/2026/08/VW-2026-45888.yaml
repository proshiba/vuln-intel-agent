title: Vvveb is a powerful and easy to use CMS with page builder to build 
  websites, blogs or ecommerce stores. Prior to 1.0.8.4, Vvveb backend post 
  operations allow a low-privileged Author to access posts owned by another 
  Author. The admin/controller/content/posts.php controller permits 
  filter[admin_id] to replace the server-selected admin_id restriction and 
  accepts a caller-controlled post_id for duplicate and delete actions, while 
  admin/sql/sqlite/post.sql does not consistently enforce post.admin_id. An 
  attacker can view post metadata, discover post identifiers, duplicate posts, 
  or delete posts and related content, exposing private drafts and causing 
  content pollution, data loss, or business disruption. This issue is fixed in 
  version 1.0.8.4.
