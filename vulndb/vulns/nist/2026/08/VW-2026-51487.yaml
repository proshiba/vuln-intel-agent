title: An unauthenticated attacker can crash the ManageSieve login process by 
  sending a small malformed command before authenticating. If running in 
  high-security mode (default for community releases), only the attacker's own 
  connection is terminated. If running in high-performance mode (default for Pro
  releases), all connections handled by the same managesieve-login process are 
  terminated. Repeating the attack can cause denial of service for Sieve script 
  management. Restrict network access to the ManageSieve service to trusted 
  clients. Update to non-vulnerable version. No publicly available exploits are 
  known.
