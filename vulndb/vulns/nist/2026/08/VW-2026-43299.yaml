title: kin-openapi is a Go project for handling OpenAPI files. Prior to 0.144.0,
  ValidationHandler.Load() in openapi3filter/validation_handler.go silently 
  replaces a nil AuthenticationFunc with NoopAuthenticationFunc, which returns 
  nil without checking credentials. This substitution causes every OpenAPI 
  security requirement to be satisfied for unauthenticated requests when an 
  application relies on ValidationHandler as its enforcement middleware. The 
  no-op callback prevents the fail-closed ErrAuthenticationServiceMissing path 
  from being reached and forwards the request to protected handlers that may 
  require an API key, OAuth token, or another security scheme. This issue is 
  fixed in version 0.144.0.
