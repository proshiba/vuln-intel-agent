title: Flowise versions 2.2.4 through 3.1.4 contain a missing authorization 
  vulnerability in the POST /api/v1/openai-assistants-file/download endpoint 
  that allows unauthenticated attackers to access private files by exploiting 
  the endpoint's inclusion in the global authentication whitelist, which 
  bypasses all session and API key verification. Attackers can supply valid 
  chatflowId, chatId, and fileName identifiers to retrieve files from any 
  chatflow on the instance, including private chatflows belonging to other 
  workspaces or organizations.
