title: Spacebar Server before commit dcfd910 contains a missing authorization 
  vulnerability that allows any authenticated attacker to add themselves to 
  arbitrary group DM channels by sending a PUT request to the channels recipient
  endpoint without membership verification. Attackers can exploit the unguarded 
  PUT /channels/{channel_id}/recipients/{user_id} handler to join private group 
  DMs, read complete message history, post messages as a participant, and 
  force-add third-party users without their consent.
