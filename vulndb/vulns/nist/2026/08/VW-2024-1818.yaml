title: "In the Linux kernel, the following vulnerability has been resolved:\n\nraid1:
  fix use-after-free for original bio in raid1_write_request()\n\nr1_bio->bios[] is
  used to record new bios that will be issued to\nunderlying disks, however, in raid1_write_request(),
  r1_bio->bios[]\nwill set to the original bio temporarily. Meanwhile, if blocked
  rdev\nis set, free_r1bio() will be called causing that all r1_bio->bios[]\nto be
  freed:\n\nraid1_write_request()\n r1_bio = alloc_r1bio(mddev, bio); -> r1_bio->bios[]
  is NULL\n for (i = 0;  i < disks; i++) -> for each rdev in conf\n  // first rdev
  is normal\n  r1_bio->bios[0] = bio; -> set to original bio\n  // second rdev is
  blocked\n  if (test_bit(Blocked, &rdev->flags))\n   break\n\n if (blocked_rdev)\n\
  \  free_r1bio()\n   put_all_bios()\n    bio_put(r1_bio->bios[0]) -> original bio
  is freed\n\nTest scripts:\n\nmdadm -CR /dev/md0 -l1 -n4 /dev/sd[abcd] --assume-clean\n\
  fio -filename=/dev/md0 -ioengine=libaio -rw=write -bs=4k -numjobs=1 \\\n    -iodepth=128
  -name=test -direct=1\nech"
