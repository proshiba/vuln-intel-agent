title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  Fix race at socket teardown\n\nFix a race in the xsk socket teardown code that can
  lead to a NULL pointer\ndereference splat. The current xsk unbind code in xsk_unbind_dev()
  starts by\nsetting xs->state to XSK_UNBOUND, sets xs->dev to NULL and then waits
  for any\nNAPI processing to terminate using synchronize_net(). After that, the release\n\
  code starts to tear down the socket state and free allocated memory.\n\n  BUG: kernel
  NULL pointer dereference, address: 00000000000000c0\n  PGD 8000000932469067 P4D
  8000000932469067 PUD 0\n  Oops: 0000 [#1] PREEMPT SMP PTI\n  CPU: 25 PID: 69132
  Comm: grpcpp_sync_ser Tainted: G          I       5.16.0+ #2\n  Hardware name: Dell
  Inc. PowerEdge R730/0599V5, BIOS 1.2.10 03/09/2015\n  RIP: 0010:__xsk_sendmsg+0x2c/0x690\n\
  \  [...]\n  RSP: 0018:ffffa2348bd13d50 EFLAGS: 00010246\n  RAX: 0000000000000000
  RBX: 0000000000000040 RCX: ffff8d5fc632d258\n  RDX: 0000000000400000 RSI: ffffa2348bd13e10
  RDI: ffff"
