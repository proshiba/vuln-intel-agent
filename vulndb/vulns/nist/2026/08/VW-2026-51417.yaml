title: "In the Linux kernel, the following vulnerability has been resolved:\n\nufs:
  core: tracing: Do not dereference pointers in TP_printk()\n\nThe trace events in
  drivers/ufs/core/ufs_trace.h were converted to take a\npointer to the hba structure
  as an argument for the tracepoint and then in\nTP_printk() the printing of the dev_name
  from the ring buffer was\nconverted to using the dev dereferenced pointer from the
  hba saved\npointer.\n\nThis is not allowed as the TP_printk() is executed at the
  time the trace\nevent is read from /sys/kernel/tracing/trace file. That can happen\n\
  literally, seconds, minutes, hours, weeks, days, or even months later!\nThere is
  no guarantee that the hba pointer will still exist by the time it\nis dereferenced
  when the \"trace\" file is read.\n\nInstead, save the device name from the hba pointer
  at the time the\ntracepoint is called and place it into the ring buffer event. Then
