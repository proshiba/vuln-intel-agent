title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  L2CAP: fix UAF in l2cap_le_connect_rsp\n\nl2cap_le_connect_rsp() obtains a channel
  via\n__l2cap_get_chan_by_ident() but neither holds a reference nor uses\nl2cap_chan_hold_unless_zero()
  before locking and operating on it.\nA concurrent l2cap_chan_del() triggered by
  a remote disconnect can\nfree the channel between the lookup and l2cap_chan_lock(),
  causing\na use-after-free.\n\nThe BR/EDR counterpart l2cap_connect_rsp() and the
  sibling handler\nl2cap_le_command_rej() already use l2cap_chan_hold_unless_zero()\n\
  to safely hold a reference, but l2cap_le_connect_rsp() was left\nunprotected.\n\n\
  Fix by adding l2cap_chan_hold_unless_zero() after the ident lookup\nand l2cap_chan_put()
  on the exit path, consistent with other L2CAP\nresponse handlers."
