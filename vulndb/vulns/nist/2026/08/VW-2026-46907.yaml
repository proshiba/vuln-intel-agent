title: 'Vulnerability in the Oracle Agile PLM MCAD Connector product of Oracle Supply
  Chain (component: CAX Client).   The supported version that is affected is 3.6.
  Difficult to exploit vulnerability allows low privileged attacker with network access
  via HTTP to compromise Oracle Agile PLM MCAD Connector.  Successful attacks require
  human interaction from a person other than the attacker. Successful attacks of this
  vulnerability can result in  unauthorized access to critical data or complete access
  to all Oracle Agile PLM MCAD Connector accessible data. CVSS 3.1 Base Score 4.8
  (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:U/C:H/I:N/A:N).'
