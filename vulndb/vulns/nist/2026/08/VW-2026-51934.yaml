title: "Improperly Controlled Modification of Dynamically-Determined Object Attributes
  vulnerability in ash-project ash_oban allows a user whose input reaches the :args
  option of AshOban.build_trigger/3 to retarget an update or destroy trigger at another
  record, including across tenants.\n\nbuild_trigger/3 builds the trusted job arguments
  with atom keys (:primary_key, :tenant, :action_arguments) and merges the caller's
  :args underneath so the trusted values win on collision. Because Oban job arguments
  round-trip through JSON, the caller's keys arrive as strings, so Map.merge sees
  no collision and both keys survive. When the job is persisted the JSON object is
  de-duplicated keeping the last (string) key, and the worker reads the caller's value.
  The documentation describes :args as unable to affect the action, so an application
  that forwards user input into it for uniqueness scoping is exposed to authorization
  bypass and tenant isolation breaks.\n\nThis issue affects ash_oban: from 0.2.5 before
  0.8."
