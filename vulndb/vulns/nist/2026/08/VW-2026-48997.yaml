title: "RansomLook contains a path traversal vulnerability in the handling of the
  screen field associated with group posts. The GroupPost.get API handler concatenates
  the database-controlled screen value directly with the application's source/ directory
  and opens the resulting path without verifying that the resolved file remains within
  the intended directory.\n\nBecause the screen field is free-form and can be populated
  either through the administrative post editor or through data imported from a remote
  RansomLook instance, a malicious upstream instance can provide traversal sequences
  such as ../config/generic.json. When the affected post is subsequently retrieved
  through the API, RansomLook resolves and reads the attacker-controlled path and
  returns the contents of the referenced file Base64-encoded in the API response.\n\
  \nThis can allow an attacker (being admin) controlling imported post data to read
  arbitrary files accessible to the RansomLook process, potentially exposing sensitive
  configurat"
