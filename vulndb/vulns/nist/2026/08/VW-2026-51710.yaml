title: In MongoDB Connector for BI, MongoDB object names such as collection, 
  field, and index names are placed into the quoted identifiers of the DDL text 
  returned by SHOW CREATE statements without escaping the identifier delimiter. 
  A user with permission to write to a sampled MongoDB collection can choose a 
  name that closes the quoted identifier early, so that additional SQL text 
  becomes part of the generated output. If an operator or automated tool later 
  replays that generated statement against a SQL server, the additional text is 
  executed with the privileges of that session.
