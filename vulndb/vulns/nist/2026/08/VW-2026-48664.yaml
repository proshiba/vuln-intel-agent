title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  us144mkii: re-anchor capture URBs on resubmission\n\ncapture_urb_complete() resubmits
  each capture URB without anchoring it:\n\n\tusb_get_urb(urb);\n\tret = usb_submit_urb(urb,
  GFP_ATOMIC);\n\nAnchoring is a property of a submission, not of the URB.  The giveback\n\
  path calls usb_unanchor_urb() before urb->complete(), so an URB\nresubmitted from
  its own completion handler is off the anchor.  The\ncapture URBs are anchored once,
  at stream start, so from the first\ncompletion onward tascam->capture_anchor is
  empty.\n\ntascam_free_urbs(), tascam_disconnect(), tascam_suspend() and the\nstop-work
  path all call usb_kill_anchored_urbs(&tascam->capture_anchor)\nto reap the capture
  URBs before anything is freed.  With the anchor empty\nthose calls return immediately
  and the URBs stay queued on the host\ncontroller.\n\ntascam_free_urbs() then returns
  the capture transfer buffers with\nusb_free_coherent(), and snd_card_free() releases
  the snd_ca"
