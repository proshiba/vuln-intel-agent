title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  check connect-related permissions on TCP Fast Open\n\nSimilar to Landlock, SELinux
  was not updated when TCP Fast Open\nsupport was introduced to ensure connect-related
  permissions are\nchecked when using TCP Fast Open. Update its socket_sendmsg() hook
  to\ncall selinux_socket_connect() when MSG_FASTOPEN is passed."
