title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnilfs2:
  fix state management in error path of log writing function\n\nAfter commit a694291a6211
  (\"nilfs2: separate wait function from\nnilfs_segctor_write\") was applied, the
  log writing function\nnilfs_segctor_do_construct() was able to issue I/O requests
  continuously\neven if user data blocks were split into multiple logs across segments,\n\
  but two potential flaws were introduced in its error handling.\n\nFirst, if nilfs_segctor_begin_construction()
  fails while creating the\nsecond or subsequent logs, the log writing function returns
  without\ncalling nilfs_segctor_abort_construction(), so the writeback flag set on\n\
  pages/folios will remain uncleared.  This causes page cache operations to\nhang
  waiting for the writeback flag.  For example,\ntruncate_inode_pages_final(), which
  is called via nilfs_evict_inode() when\nan inode is evicted from memory, will hang.\n\
  \nSecond, the NILFS_I_COLLECTED flag set on normal inodes remain uncleared. "
