title: "Kenwood DNR1007XR Firmware Update Link Following Code Execution Vulnerability.
  This vulnerability allows physically present attackers to execute arbitrary code
  on affected installations of Kenwood DNR1007XR devices. Authentication is not required
  to exploit this vulnerability.\n\nThe specific flaw exists within the firmware update
  process. By creating a symbolic link, an attacker can abuse the service to move
  a file to an arbitrary location. An attacker can leverage this vulnerability to
  execute code in the context of root. Was ZDI-CAN-28751."
