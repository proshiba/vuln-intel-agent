title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  fix NULL h_transaction deref in ocfs2_assure_trans_credits\n\n[BUG]\nA direct write
  over unwritten extents can panic the kernel in\nocfs2_assure_trans_credits() when
  the journal aborts during DIO\ncompletion. The crash is a general protection fault
  from a NULL pointer\ndereference.\n\n[CAUSE]\nocfs2_dio_end_io_write() loops over
  a direct write's unwritten extents,\nmarking each written under a single journal
  handle. If the journal\naborts (for example after an I/O error) while the extent
  tree is being\nupdated, the handle is left aborted with its transaction pointer\n\
  cleared. The extent merge treats that failure as not critical and\nreports success,
  so the loop keeps using the handle.\nocfs2_assure_trans_credits() reads the handle's
  remaining credits\nwithout first checking whether the handle is aborted, and that
  read\ndereferences the cleared transaction pointer.\n\n[FIX]\nA journal abort is
  recorded in the handle itself, so call"
