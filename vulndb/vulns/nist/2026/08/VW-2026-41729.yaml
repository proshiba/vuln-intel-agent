title: AnythingLLM is an application that turns pieces of content into context 
  that any LLM can use as references during chatting. From 1.0.0 to 1.15.0, 
  AnythingLLM's unauthenticated account-recovery flow in 
  server/utils/PasswordRecovery/index.js uses recoverAccount() to deduplicate 
  the raw recoveryCodes values before trimming them, so one valid code submitted
  twice with different surrounding whitespace can satisfy the two-code check. 
  Each normalized value can also match the same stored hash instead of consuming
  a distinct hash. An attacker who knows the target username and one recovery 
  code can call POST /api/system/recover-account in multi-user mode, receive a 
  password-reset token, and use POST /api/system/reset-password to take over the
  account, including an administrator account.
