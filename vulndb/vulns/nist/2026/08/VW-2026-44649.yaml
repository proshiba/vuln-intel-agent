title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  adc: xilinx-ams: fix out-of-bounds channel lookup in event handling\n\nams_event_to_channel()
  may return a pointer past the end of\ndev->channels when no matching scan_index
  is found. This can lead\nto invalid memory access in ams_handle_event().\n\nAdd
  a bounds check in ams_event_to_channel() and return NULL when\nno channel is found.
  Also guard the caller to safely handle this\ncase."
