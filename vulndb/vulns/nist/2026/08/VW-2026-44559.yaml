title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_teql: Introduce slaves_lock to avoid race condition and UAF\n\nThe teql master->slaves
  singly linked list is not protected against\nmultiple writes. It can be mod'ed concurently
  from teql_master_xmit(),\nteql_dequeue(), teql_init() and teql_destroy() without
  holding any list\nlock or RCU protection.\n\nzdi-disclosures@trendmicro.com has
  demonstrated that the qdisc is freed\nafter an RCU grace period, but teql_master_xmit()
  running on another\nCPU can still hold a stale pointer into the list, resulting
  in a\nslab-use-after-free:\n\nBUG: KASAN: slab-use-after-free in teql_master_xmit+0xf0f/0x16b0\n\
  Read of size 8 at addr ffff888013fb0440 by task poc/332\nFreed 512-byte region [ffff888013fb0400,
  ffff888013fb0600) (kmalloc-512)\n\nThe fix?\nAdd a per-master slaves_lock spinlock
  that serializes all mutations of\nmaster->slaves and the NEXT_SLAVE() links in teql_destroy()
