title: PostGIS before 3.7.0beta2 contains an out-of-bounds read vulnerability 
  that allows attackers to cause memory disclosure or a server crash by 
  supplying a malformed FlatGeobuf buffer. The FlatGeobuf property metadata 
  decoder verifies that a string length field is present but fails to verify 
  that the subsequent string body is contained within the supplied buffer before
  materializing it into a SQL-visible value, enabling memory disclosure or 
  denial of service.
