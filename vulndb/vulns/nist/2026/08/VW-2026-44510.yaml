title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix publication race for priv->channel_stats[]\n\nmlx5e_channel_stats_alloc() publishes
  a new entry to\npriv->channel_stats[] and then increments priv->stats_nch as a\n\
  publication token, but neither store carries any memory barrier:\n\n\tpriv->channel_stats[ix]
  = kvzalloc_node(...);\n\tif (!priv->channel_stats[ix])\n\t\treturn -ENOMEM;\n\t\
  priv->stats_nch++;\n\nConcurrent readers compute the loop bound from priv->stats_nch
  and\nthen dereference priv->channel_stats[i] using plain accesses, e.g.\n\n\tfor
  (i = 0; i < priv->stats_nch; i++) {\n\t\tstruct mlx5e_channel_stats *cs = priv->channel_stats[i];\n\
  \t\t... cs->rq.packets ...\n\t}\n\nOn weakly-ordered architectures (ARM, PowerPC,
  RISC-V) the writes to\nchannel_stats[ix] and stats_nch may become visible to other
  CPUs out\nof program order. A reader can observe stats_nch == N while still\nseeing
  channel_stats[N-1] == NULL, leading to a NULL pointer\ndereference in the channel_stats
  loop.\n\nThis"
