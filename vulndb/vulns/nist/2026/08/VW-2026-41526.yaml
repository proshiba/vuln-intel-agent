title: goose is general-purpose AI agent that runs on your machine. Prior to 
  1.44.0, the `goose review` command runs the system `git` executable to gather 
  the diff for review without stripping attacker-controlled Git configuration. A
  malicious repository whose `.git/config` sets [`core] fsmonitor = <command>` 
  causes Git to execute that command on the host during the index refresh 
  performed by `git diff HEAD`. The command runs before goose contacts a model 
  and without a submitted prompt, model call, tool approval, or trust prompt. 
  The context-gathering Git process is not sandboxed and is outside goose's 
  tool-permission model. Arbitrary commands run with the privileges and 
  environment of the user running goose, allowing file access or modification 
  and exfiltration of environment secrets and provider API keys. The vulnerable 
  Git invocations are built by git_command() in 
  crates/goose-cli/src/commands/review/handler.rs and are used by 
  touched_files() and collect_diff() for `git diff --name-only HE
