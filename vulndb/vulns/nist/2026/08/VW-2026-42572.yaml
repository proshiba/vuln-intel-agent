title: Activepieces is an open source AI workflow automation platform. Prior to 
  0.82.0, the POST 
  /api/v1/projects/:projectId/mcp-server/validate-agent-mcp-tool endpoint makes 
  an outbound HTTP or SSE request to a user-supplied serverUrl without URL 
  validation or SSRF protection. An authenticated user can cause the 
  Activepieces server to connect to internal services, cloud metadata endpoints,
  or arbitrary external hosts and probe network reachability from the 
  Activepieces host. This issue is fixed in version 0.82.0.
