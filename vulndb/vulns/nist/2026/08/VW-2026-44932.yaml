title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: fix OOB write in snd_usbmidi_akai_output()\n\nsnd_usbmidi_akai_output()
  computes its fill-loop bound\n\n\tbuf_end = ep->max_transfer - MAX_AKAI_SYSEX_LEN
  - 1;\n\nas a signed int, so a small device-advertised bulk-OUT max_transfer\nmakes
  buf_end negative.  The loop guard then compares the u32\nurb->transfer_buffer_length
  against that negative int: the usual\narithmetic conversion turns buf_end into a
  large unsigned value, so the\nguard stays true and each iteration keeps appending
  SysEx framing and\npayload bytes past the end of the URB transfer buffer, which
  is only\nmax_transfer bytes long.\n\nA USB device that advertises a tiny bulk-OUT
  endpoint can therefore\ntrigger an attacker-length- and content-controlled heap
  out-of-bounds\nwrite when a process writes to the created /dev/snd/midiC*D* node.\n\
  \nReturn early when there is no room for even one SysEx, so the loop is\nnever entered
  with a bound that would wrap.  The lo"
