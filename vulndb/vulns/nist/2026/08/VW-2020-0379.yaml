title: "An elevation of privilege vulnerability exists when Windows improperly handles
  errors tied to Remote Access Common Dialog. An attacker who successfully exploited
  the vulnerability could run arbitrary code with elevated privileges.\nTo exploit
  this vulnerability an attacker would need to physically access the booted machine
  to reach the logon screen. An attacker could then exploit the vulnerability and
  take control of an affected system.\nThe update addresses the vulnerability by correcting
  how the Windows handles errors tied to Remote Access Common Dialog."
