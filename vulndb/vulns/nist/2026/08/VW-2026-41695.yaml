title: A flaw was found in ml-metadata. The statically-linked gRPC stack in 
  ml-metadata is outdated, making it vulnerable to known HTTP/2 denial of 
  service (DoS) issues. An in-cluster attacker, with network access to the MLMD 
  pod, could exploit these vulnerabilities by sending specially crafted HTTP/2 
  requests. This could lead to a denial of service by crashing the MLMD pod, 
  disrupting all pipeline runs in the affected namespace.
