title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  Fix MCIA register buffer overflow on 32 dword reads\n\nThe MCIA register can return
  up to 32 dwords (128 bytes) when the device\nadvertises the mcia_32dwords capability,
  but struct\nmlx5_ifc_mcia_reg_bits only defines dword_0..11, leaving room for just\n\
  12 dwords (48 bytes) of data.\n\nmlx5_query_mcia() clamps the read size to mlx5_mcia_max_bytes()
  and then\nmemcpy()s that many bytes out of the register, potentially reading past\n\
  the end of the 'out' buffer. On kernels built with FORTIFY_SOURCE this\nis caught
  as a buffer overflow while reading the module EEPROM via\nethtool:\n\n  detected
  buffer overflow in memcpy\n  kernel BUG at lib/string_helpers.c:1048!\n  RIP: 0010:fortify_panic+0x13/0x20\n\
  \  Call Trace:\n   mlx5_query_mcia.isra.0+0x200/0x210 [mlx5_core]\n   mlx5_query_module_eeprom_by_page+0x4a/0xa0
  [mlx5_core]\n   mlx5e_get_module_eeprom_by_page+0xbb/0x120 [mlx5_core]\n   eeprom_prepare_data+0xf3/0x170\n\
  \   ethnl_default_d"
