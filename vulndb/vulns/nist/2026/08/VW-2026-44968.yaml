title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: avoid deadlocks in iso_sock_timeout\n\niso_sock_timeout() takes lock_sock,
  so sync disabling the timer while\nholding that lock may deadlock.\n\niso_sock_timeout()
  may also run concurrently with iso_conn_del(), which\nleads to UAF\n\n        [Task
  1]                      [Task hdev->workqueue]\n        iso_sock_timeout       \
  \       iso_conn_del\n          iso_conn_hold_unless_zero     iso_chan_del\n   \
  \                        `------------> iso_conn_put\n                         \
  \             caller frees hcon\n          iso_conn_put\n            iso_conn_free\n\
  \              conn->hcon->iso_data = NULL; /* UAF */\n\nFix the deadlock by removing
  the disable from the lock_sock sections.\nMove the timer from iso_conn to iso_pinfo
  to decouple it from iso_conn\nwhich may need to be freed in lock_sock section. Convert
  some of the\nclear_timer to disable_timer."
