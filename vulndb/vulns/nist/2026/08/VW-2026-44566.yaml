title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (pmbus/core) honor vrm_version in pmbus_data2reg_vid()\n\npmbus_data2reg_vid() hardcoded
  the VR11 encoding regardless of the\nvrm_version configured by the driver, while
  pmbus_reg2data_vid()\nalready switched on it. Any driver that selects a non-VR11
  VID mode\nand exposes a regulator (or hwmon vout setter) sent dangerously\nwrong
  codes to PMBUS_VOUT_COMMAND -- e.g. an nvidia195mv part asked\nfor 200 mV got the
  VR11 clamp to 500 mV encoded as 0xB2, which the\nchip interprets as 1080 mV.\n\n\
  Mirror pmbus_reg2data_vid() so writes round-trip with reads."
