title: CKAN MCP Server is a tool for querying CKAN open data portals. Prior to 
  0.4.112, the ckan_get_mqa_quality and ckan_get_mqa_quality_details tools in 
  src/tools/quality.ts use isValidMqaServer to validate the server_url parameter
  with a prefix-only regular expression for dati.gov.it, allowing suffix-host 
  and URL-userinfo values to target an attacker-controlled host and return a 
  spoofed response. This issue is fixed in version 0.4.112.
