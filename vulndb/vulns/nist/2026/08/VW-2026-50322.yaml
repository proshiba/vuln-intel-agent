title: one-api gates one of its two channel-pinning paths and not the other. 
  middleware/auth.go permits a request to name a specific channel either through
  a suffix on the API key or through a URL path parameter. The suffix path is 
  reached only after model.IsAdmin succeeds and otherwise rejects the caller, 
  while the path-parameter branch sets the selected-channel value from 
  c.Param("channelid") with no role check at all. The route carrying that 
  parameter sits behind token authentication only, so any account holding a 
  valid API token reaches it. The value flows to the distributor, which loads 
  the channel by integer identifier with no scoping to the caller's user or 
  group, and then sets the outbound Authorization header to that channel's 
  stored key and directs the request at the channel's base URL. A low-privilege 
