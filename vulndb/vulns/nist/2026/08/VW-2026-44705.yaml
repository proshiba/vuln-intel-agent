title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fib_rules: Don't dump dying fib_rule in fib_rules_dump().\n\nrocker_router_fib_event()
  calls fib_rule_get() during RCU dump.\n\nIf the fib_rule is dying, refcount_inc()
  will complain about it.\n\nLet's call refcount_inc_not_zero() in fib_rules_dump()."
