title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the backup.restoreBackupWithLogs tRPC subscription passes the 
  databaseName parameter to restore builders in 
  packages/server/src/utils/restore/utils.ts, where PostgreSQL, MariaDB, MySQL, 
  and MongoDB commands embed the value in nested shell text executed by Node.js 
  exec. An authenticated user with backup:restore permission can supply a 
  crafted databaseName that the host /bin/sh expands before docker exec, 
  resulting in arbitrary commands running in the Docker-privileged host context.
  This issue is fixed in version 0.29.13.
