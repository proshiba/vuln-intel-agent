title: GitLab has remediated a vulnerability in the GitLab AI Gateway component 
  affecting all versions of the AI Gateway from 18.10 to 19.0.12, 19.1 to 
  19.1.7, and 19.2 to 19.2.2 that could have allowed an authenticated user with 
  Duo Agent Platform access to redirect outbound model requests to an 
  externally-controlled endpoint via a crafted inline flow configuration that 
  overrides the HTTP Host header, resulting in disclosure of Google Cloud Vertex
  cloud service credentials and private signing keys.
