title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfhandle:
  reject detached mounts in capable_wrt_mount()\n\nThe recent fhandle RCU fix moved
  the mount namespace capability check\ninto capable_wrt_mount(), so a non-NULL mnt_namespace
  survives the\nns_capable() dereference. The helper still assumes the later\nREAD_ONCE(mount->mnt_ns)
  must be non-NULL because may_decode_fh()\nchecked is_mounted() first.\n\nThat assumption
  is not stable. A detached mount from\nopen_tree(..., OPEN_TREE_CLONE) can be dissolved
  on fput while\nopen_by_handle_at() is between those checks, and umount_tree() can\n\
  clear mount->mnt_ns. If the helper observes NULL, it dereferences\nmnt_ns->user_ns
  and panics.\n\nReturn false when the RCU read observes a detached mount. This keeps\n\
  the relaxed permission path conservative: a mount no longer attached\nto a namespace
  cannot authorize open_by_handle_at() access."
