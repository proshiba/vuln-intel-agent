title: "Nozomi Networks Labs identified a CWE-362: Concurrent Execution using Shared
  Resource with Improper Synchronization ('Race Condition') vulnerability in the configuration
  and process-image management functionality of KUNBUS piControl in version 2.6.2
  that allows a local authenticated attacker to trigger use-after-free and invalid
  pointer dereferences on kernel configuration objects, resulting in kernel memory
  corruption and denial of service, by issuing concurrent crafted requests through
  the piControl character device."
