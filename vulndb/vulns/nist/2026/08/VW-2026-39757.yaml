title: OpenBK7231T's CHANNEL_SetLabel (src/cmnds/cmd_channels.c) stores channel 
  labels received via the MQTT SetChannelLabel command using strdup with no HTML
  sanitization. CHANNEL_GetLabel returns these labels unsanitized, and they are 
  rendered via hprintf255 at 15+ locations in src/httpserver/http_fns.c with no 
  HTML encoding.
