title: "Issue summary: OpenSSL CMP password based protection verification only\nchecks
  whether the protectionAlg parameter was not NULL and not its\nASN.1 type, before
  treating it as a PBMParameter. A crafted message can\ncontain a parameter of a different
  type, which is then dereferenced as an\ninvalid pointer.\n\nImpact summary: A remote,
  unauthenticated attacker can crash an application\nacting as a CMP server that accepts
  PBM-protected messages, or a CMP client\ntalking to a malicious or intercepted CMP
  server, resulting in a Denial of\nService.\n\nCWE: CWE-476: NULL Pointer Dereference\n\
  \nDescription: When verifying the password-based MAC protection of a CMP\nmessage,
  OpenSSL library reads the protectionAlg algorithm parameter with\nX509_ALGOR_get0(),
  which returns both the parameter type and its value\npointer. The value is then
  cast to an ASN1_STRING and treated as the\nexpected PBMParameter after only checking
  that pointer is not NULL. The\nparameter type returned by X509_ALGOR_get0() was
  never consulte"
