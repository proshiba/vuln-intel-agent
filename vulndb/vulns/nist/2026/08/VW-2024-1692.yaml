title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86/pmu: Disable support for adaptive PEBS\n\nDrop support for virtualizing adaptive
  PEBS, as KVM's implementation is\narchitecturally broken without an obvious/easy
  path forward, and because\nexposing adaptive PEBS can leak host LBRs to the guest,
  i.e. can leak\nhost kernel addresses to the guest.\n\nBug #1 is that KVM doesn't
  account for the upper 32 bits of\nIA32_FIXED_CTR_CTRL when (re)programming fixed
  counters, e.g\nfixed_ctrl_field() drops the upper bits, reprogram_fixed_counters()\n\
  stores local variables as u8s and truncates the upper bits too, etc.\n\nBug #2 is
  that, because KVM _always_ sets precise_ip to a non-zero value\nfor PEBS events,
  perf will _always_ generate an adaptive record, even if\nthe guest requested a basic
  record.  Note, KVM will also enable adaptive\nPEBS in individual *counter*, even
  if adaptive PEBS isn't exposed to the\nguest, but this is benign as MSR_PEBS_DATA_CFG
