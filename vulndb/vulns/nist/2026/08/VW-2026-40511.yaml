title: "AIL Framework contained a reflected cross-site scripting vulnerability in
  the /tag/add_tags endpoint. When an error occurred while processing a tag operation,
  the application returned the error value directly as an HTML response using str(res[0]).\n\
  \nIf attacker-controlled input was included in the generated error message, a crafted
  request could cause arbitrary HTML or JavaScript to be reflected in the response
  without appropriate output encoding. An attacker could exploit the vulnerability
  by convincing an authenticated AIL Framework user to open a specially crafted link.\n\
  \nSuccessful exploitation could allow JavaScript to execute in the victim’s browser
  within the security context of the AIL Framework application. Depending on the victim’s
  privileges and the application’s protections, the attacker could perform actions
  using the victim’s session, access information available to the victim, or modify
  data through authenticated application requests.\n\nThe vulnerability requires user
