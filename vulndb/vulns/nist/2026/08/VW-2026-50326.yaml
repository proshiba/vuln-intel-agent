title: IDURAR ERP CRM changes the password of whichever account a request names 
  rather than the account making the request. The update handler in 
  backend/src/controllers/middlewaresControllers/createUserController/updatePassword.js
  resolves the authenticated user from the request that the token middleware 
  populated, then issues its update against a filter built from the identifier 
  in the URL path, and never compares the two. The route is mounted behind the 
  administrator token check only, so any valid administrator session is 
  sufficient, and the sole ownership-like guard in the handler rejects a single 
  hardcoded demo address. A caller can therefore set an arbitrary password on 
  any other administrator account and sign in as it. The read handler in the 
  same controller directory accepts an identifier the same way, which supplies 
  the identifiers needed to pick a target.
