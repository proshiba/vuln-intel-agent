title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxprtrdma:
  Check frwr_wp_create() during connect\n\nfrwr_wp_create() creates the singleton
  Memory Region used to encode\npadding for Write chunks whose payload length is not
  XDR-aligned. Its\nfailure paths return a negative errno and leave ep->re_write_pad_mr
  set\nto NULL.\n\nrpcrdma_xprt_connect() currently ignores that return value. If\n\
  frwr_wp_create() fails after the rest of the connection setup succeeds,\nxprt_rdma_connect_worker()
  treats the connection attempt as successful\nand sets XPRT_CONNECTED. A later NFS/RDMA
  read with a non-4-byte-aligned\nreceive page length reaches rpcrdma_encode_write_list(),
  passes the NULL\nwrite-pad MR to encode_rdma_segment(), and dereferences it.\n\n\
  This is locally triggerable on an NFS/RDMA client after a connect or\nreconnect
  hits a local MR allocation, DMA-map, MR-map, or post-send\nfailure; a remote peer
  alone cannot force the local MR setup failure.\n\nCheck the return value and fail
