title: A flaw was found in the multicloud-operators-channel component of Red Hat
  Advanced Cluster Management (RHACM). This vulnerability allows a compromised 
  agent from a managed cluster to gain unauthorized access to sensitive 
  information. Specifically, the agent can read all Secrets and ConfigMaps 
  within any Channel namespace on the hub, potentially exposing credentials for 
  other tenants' Git and Helm repositories. This could lead to significant 
  information disclosure.
