title: The frontend management plugin attributed a newly created event to the 
  submitting user's organizer record only when the request supplied no organizer
  of its own. The accompanying permission check confirmed only that the 
  submitting user held any organizer role. A user with frontend event management
  access could therefore create an event that is attributed to another 
  organizer.
