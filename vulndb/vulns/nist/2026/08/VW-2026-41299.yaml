title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  chips-media: wave5: Move src_buf Removal to finish_encode\n\nDuring encoder processing,
  there is a case where the IRQ response could\nreturn the buffer back to userspace
  via v4l2_m2m_buf_done call. In this\ntime, userspace could queue up this same buffer
  before start_encode removes\nthe index from the ready queue. This would then lead
  to a case where the\nbuffer in the ready queue could be a self loop due to the\n\
  WRITE_ONCE(prev->next, new) call in __list_add.\n\nWhen __list_del is finally called,
  the loop is already made so nothing\npoints back to ready queue list head and pointers
  are poisoned.\n\nA buffer should not be marked as DONE before the buffer is removed
  from\nm2m ready queue. Move removal entirely to finish_encode."
