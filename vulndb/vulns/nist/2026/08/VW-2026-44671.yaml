title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntcp:
  ipv6: clamp default adverting MSS to avoid GSO_BY_FRAGS (0xFFFF)\n\nWhen MTU is
  large, ip6_default_advmss() can return IPV6_MAXPLEN (65535).\nThis is interpreted
  by TCP as mss_clamp, allowing the MSS to reach 65535.\n\nHowever, 0xFFFF is also
  used as a magic value GSO_BY_FRAGS in the kernel.\nIf a TCP packet with gso_size=0xFFFF
  is passed to skb_segment(), it will\nbe mistakenly treated as GSO_BY_FRAGS, leading
  to a NULL pointer\ndereference because local TCP packets do not use frag_list.\n\
  \nFix this by returning min(IPV6_MAXPLEN, GSO_BY_FRAGS - 1) (65534) from\nip6_default_advmss()
  when MTU is large.\n\nAlso update the stale comment in ip6_default_advmss() which
  suggested\nthat IPV6_MAXPLEN is returned to mean \"any MSS\"."
