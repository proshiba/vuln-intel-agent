title: A flaw was found in Open Cluster Management (OCM), the technology 
  underlying Red Hat Advanced Cluster Management (ACM). Improper validation of 
  Kubernetes client certificate renewal allows a managed cluster administrator 
  to forge a client certificate that can be approved by the OCM controller. This
  enables cross-cluster privilege escalation and may allow an attacker to gain 
  control over other managed clusters, including the hub cluster.
