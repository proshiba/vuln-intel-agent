title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/mmiotrace:
  Add NULL check for mmio_trace_array in logging functions\n\nmmio_trace_rw() and
  mmio_trace_mapping() retrieve mmio_trace_array into\ntr and pass it to __trace_mmiotrace_rw()
  and __trace_mmiotrace_map().\nIf these functions are invoked while mmio_trace_array
  is NULL (e.g. before\ninitialization or after disabled), accessing tr->array_buffer.buffer
  will\nresult in a NULL pointer dereference crash.\n\nFix this by adding an explicit
  NULL check for tr at the beginning of\n__trace_mmiotrace_rw() and __trace_mmiotrace_map()."
