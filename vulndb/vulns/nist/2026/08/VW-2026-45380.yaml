title: INDI (Instrument Neutral Distributed Interface) indiserver through 
  2.2.4.2, fixed in commit 96bbd7f, contains a stack buffer overflow 
  vulnerability that allows unauthenticated remote attackers to crash the daemon
  by sending malformed XML with mismatched tags whose names exceed 1024 bytes. 
  Attackers can send a single TCP packet on port 7624 with mismatched XML tags 
  to trigger an unbounded sprintf() write into a fixed 1024-byte stack buffer in
  MsgQueue.cpp, terminating the daemon and disrupting all active client and 
  driver sessions.
