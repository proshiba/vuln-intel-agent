title: Notepad++ is a free and open-source source code editor. Prior to 8.9.7, 
  the WinGup decompress function joins untrusted ZIP entry names to unzipDestTo 
  without canonical containment validation, allowing an entry such as 
  ../mimeTools/mimeTools.dll to overwrite a DLL in a sibling plugin directory 
  and execute attacker-controlled code when Notepad++ next loads that plugin. 
  This issue is fixed in version 8.9.7.
