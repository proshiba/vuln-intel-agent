title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  LAG, Fix off-by-one in single-FDB error rollback\n\nOn failure at index i, the reverse
  cleanup loop in\nmlx5_lag_create_single_fdb() starts from i, so the failed index\n\
  itself is rolled back. That can operate on uninitialized state or\ndouble-tear-down
  a rule the add_one path already self-rolled-back.\n\nStart the rollback from i -
  1 so only successfully-installed entries\nare undone."
