title: OpenEXR is the reference implementation and specification for the EXR 
  image format, widely used in the motion picture industry. OpenEXR versions 
  before 3.2.11, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13 can return an 
  out-of-bounds pointer from TypedDeepImageChannel::row() when a crafted deep 
  EXR has a nonzero dataWindow origin. This vulnerability occurs because the API
  combines zero-based row access with an absolute-coordinate-adjusted base 
  pointer, allowing a crash or limited information disclosure. This issue is 
  fixed in versions 3.2.11, 3.3.13, and 3.4.14.
