title: GitPython versions before 3.1.54 contain a remote code execution 
  vulnerability in the check_unsafe_options guard that can be bypassed by 
  smuggling git options inside single-character kwarg values. Attackers can 
  supply crafted option dictionaries to clone_from, fetch, pull, push, 
  ls_remote, iter_commits, blame, or archive methods to execute arbitrary OS 
  commands via the --upload-pack parameter.
