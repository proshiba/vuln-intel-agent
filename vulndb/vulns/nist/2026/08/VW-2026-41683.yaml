title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, Dokploy allows an authenticated low-privilege member to execute 
  arbitrary commands on the control-plane host because the volumeName field 
  accepted by volumeBackup.create and volumeBackup.runManually is interpolated 
  without quoting in packages/server/src/utils/volume-backups/backup.ts and 
  executed through child_process.exec, with Docker socket access making 
  execution host/root-equivalent. This issue is fixed in version 0.29.13.
