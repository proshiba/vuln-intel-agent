title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_qca: Clear memdump state on invalid dump size\n\nqca_controller_memdump() allocates
  qca->qca_memdump before processing\nthe first dump packet. For a sequence-zero packet
  it then disables IBS,\nmarks memdump collection active, and reads the advertised
  dump size.\n\nIf the controller reports a zero dump size, the error path frees the\n\
  local qca_memdump object and returns without clearing qca->qca_memdump\nor undoing
  the collection state. A later memdump work item initializes\nits local pointer from
  qca->qca_memdump and skips allocation when that\npointer is non-NULL, so it can
  operate on freed memory. The stale\ncollection and IBS-disabled flags can also leave
  waiters or later\ntransmit handling blocked behind an aborted dump.\n\nClear the
  saved pointer and memdump state before returning from the\ninvalid-size path, matching
  the cleanup used when hci_devcd_init() fails.\n\nA static analysis checker reported
  the stale memd"
