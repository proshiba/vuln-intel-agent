title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndax/kmem:
  account for partial discontiguous resource upon removal\n\nWhen dev_dax_kmem_probe()
  partially succeeds (at least one range is\nmapped) but a subsequent range fails
  request_mem_region() or\nadd_memory_driver_managed(), the probe silently continues,
  ultimately\nreturning success, but with the corresponding range resource NULL'ed
  out.\n\ndev_dax_kmem_remove() iterates over all dax_device ranges regardless of
  if\nthe underlying resource exists.  When remove_memory() is called later, it\n\
  returns 0 because the memory was never added which causes\ndev_dax_kmem_remove()
  to incorrectly assume the (nonexistent) resource can\nbe removed and attempts cleanup
  on a NULL pointer.\n\nFix this by skipping these ranges altogether, noting that
  these cases are\nconsidered success, such that the cleanup is still reached when
  all\nactually-added ranges are successfully removed."
