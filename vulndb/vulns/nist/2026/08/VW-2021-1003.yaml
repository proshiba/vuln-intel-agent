  Address Translation (NAT) feature of Cisco Adaptive Security Appliance (ASA) Software
  and Firepower Threat Defense (FTD) Software could allow an unauthenticated, remote
  attacker to bypass the ALG and open unauthorized connections with a host located
  behind the ALG. For more information about these vulnerabilities, see the Details
  section of this advisory. Note: These vulnerabilities have been publicly discussed
  as NAT Slipstreaming.'
