title: "DJI drones transmit DUML (DJI Universal Markup Language) protocol messages
  over BLE (Bluetooth Low Energy) without encryption. When a client attempts to connect
  to the drone over Wi-Fi, or when the drone is switched to QuickTransfer mode, the
  DJI Fly application exchanges DUML messages with the drone over BLE, including the
  Wi-Fi credentials. An attacker within BLE range can passively sniff this traffic
  and recover the credentials in cleartext, including the drone's Wi-Fi PSK, SSID,
  and trusted identifier UUID. Obtaining these credentials allows the attacker to
  join the drone's internal Wi-Fi network, interact with network services exposed
  by the drone, and decrypt Wi-Fi traffic exchanged between the drone and the legitimate
  user.\n\n* An attacker within BLE range recovers the Wi-Fi SSID and PSK in cleartext,
