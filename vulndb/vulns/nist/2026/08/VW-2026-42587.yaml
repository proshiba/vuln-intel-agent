title: 'Exposure of sensitive information caused by incorrect data forwarding during
  transient execution for some Intel(R) Processors within Ring 0: Hypervisor and Kernel
  may allow information disclosure. System software adversary with a privileged user
  combined with a high complexity attack may enable data exposure. This result may
  potentially occur via local access when attack requirements are not present without
  special internal knowledge and requires no user interaction. The potential vulnerability
  may impact the confidentiality (none), integrity (none) and availability (none)
  of the vulnerable system, resulting in subsequent system confidentiality (high),
  integrity (none) and availability (none) impacts.'
