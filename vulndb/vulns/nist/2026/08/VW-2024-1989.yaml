title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: mst: fix vlan use-after-free\n\nsyzbot reported a suspicious rcu usage[1]
  in bridge's mst code. While\nfixing it I noticed that nothing prevents a vlan to
  be freed while\nwalking the list from the same path (br forward delay timer). Fix
  the rcu\nusage and also make sure we are not accessing freed memory by making\n\
  br_mst_vlan_set_state use rcu read lock.\n\n[1]\n WARNING: suspicious RCU usage\n\
  \ 6.9.0-rc6-syzkaller #0 Not tainted\n -----------------------------\n net/bridge/br_private.h:1599
  suspicious rcu_dereference_protected() usage!\n ...\n stack backtrace:\n CPU: 1
  PID: 8017 Comm: syz-executor.1 Not tainted 6.9.0-rc6-syzkaller #0\n Hardware name:
  Google Google Compute Engine/Google Compute Engine, BIOS Google 03/27/2024\n Call
  Trace:\n  <IRQ>\n  __dump_stack lib/dump_stack.c:88 [inline]\n  dump_stack_lvl+0x241/0x360
  lib/dump_stack.c:114\n  lockdep_rcu_suspicious+0x221/0x340 kernel/locking/lockdep.c:6712\n\
  \  nbp_vlan_group n"
