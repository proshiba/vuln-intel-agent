title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  support non-r10 register spill/fill to/from stack in precision tracking\n\nUse instruction
  (jump) history to record instructions that performed\nregister spill/fill to/from
  stack, regardless if this was done through\nread-only r10 register, or any other
  register after copying r10 into it\n*and* potentially adjusting offset.\n\nTo make
  this work reliably, we push extra per-instruction flags into\ninstruction history,
  encoding stack slot index (spi) and stack frame\nnumber in extra 10 bit flags we
  take away from prev_idx in instruction\nhistory. We don't touch idx field for maximum
  performance, as it's\nchecked most frequently during backtracking.\n\nThis change
  removes basically the last remaining practical limitation of\nprecision backtracking
  logic in BPF verifier. It fixes known\ndeficiencies, but also opens up new opportunities
