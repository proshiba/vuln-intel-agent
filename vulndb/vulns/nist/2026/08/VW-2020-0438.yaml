title: "An elevation of privilege vulnerability exists when the Windows Common Log
  File System (CLFS) driver improperly handles objects in memory. An attacker who
  successfully exploited this vulnerability could run processes in an elevated context.\n\
  To exploit the vulnerability, an attacker would first have to log on to the system,
  and then run a specially crafted application to take control over the affected system.\n\
  The security update addresses the vulnerability by correcting how CLFS handles objects
  in memory."
