title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntee:
  amdtee: fix use-after-free vulnerability in amdtee_close_session\n\nThere is a potential
  race condition in amdtee_close_session that may\ncause use-after-free in amdtee_open_session.
  For instance, if a session\nhas refcount == 1, and one thread tries to free this
  session via:\n\n    kref_put(&sess->refcount, destroy_session);\n\nthe reference
  count will get decremented, and the next step would be to\ncall destroy_session().
  However, if in another thread,\namdtee_open_session() is called before destroy_session()
  has completed\nexecution, alloc_session() may return 'sess' that will be freed up\n\
  later in destroy_session() leading to use-after-free in\namdtee_open_session.\n\n\
  To fix this issue, treat decrement of sess->refcount and removal of\n'sess' from
  session list in destroy_session() as a critical section, so\nthat it is executed
  atomically."
