title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix race in read_extent_buffer_pages()\n\nThere are reports from tree-checker that
  detects corrupted nodes,\nwithout any obvious pattern so possibly an overwrite in
  memory.\nAfter some debugging it turns out there's a race when reading an extent\n\
  buffer the uptodate status can be missed.\n\nTo prevent concurrent reads for the
  same extent buffer,\nread_extent_buffer_pages() performs these checks:\n\n    /*
  (1) */\n    if (test_bit(EXTENT_BUFFER_UPTODATE, &eb->bflags))\n        return 0;\n\
  \n    /* (2) */\n    if (test_and_set_bit(EXTENT_BUFFER_READING, &eb->bflags))\n\
  \        goto done;\n\nAt this point, it seems safe to start the actual read operation.
  Once\nthat completes, end_bbio_meta_read() does\n\n    /* (3) */\n    set_extent_buffer_uptodate(eb);\n\
  \n    /* (4) */\n    clear_bit(EXTENT_BUFFER_READING, &eb->bflags);\n\nNormally,
  this is enough to ensure only one read happens, and all other\ncallers wait for
  it to finish before returning"
