title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrxrpc:
  Fix handling of received connection abort\n\nFix the handling of a connection abort
  that we've received.  Though the\nabort is at the connection level, it needs propagating
  to the calls on that\nconnection.  Whilst the propagation bit is performed, the
  calls aren't then\nwoken up to go and process their termination, and as no further
  input is\nforthcoming, they just hang.\n\nAlso add some tracing for the logging
  of connection aborts."
