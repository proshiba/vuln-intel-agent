title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmac802154:
  remove interfaces with RCU list deletion\n\nQueue wake, stop, and disable paths
  walk local->interfaces under RCU.\nThe bulk hardware teardown path removes entries
  with list_del(), so an\nasynchronous transmit completion can follow a poisoned list
  node in\nieee802154_wake_queue().\n\nUse list_del_rcu() as in the single-interface
  removal path. The following\nunregister_netdevice() waits for in-flight RCU readers
  before freeing the\nnetdevice, so no separate grace-period wait is needed."
