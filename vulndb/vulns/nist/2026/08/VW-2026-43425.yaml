title: Heap buffer overflow in PostgreSQL regexp allows the query author to 
  execute arbitrary code as the operating system user running the database, via 
  text that would not pass encoding validation.  This shares heritage with 
  CVE-2026-2006, but this case involved unanticipated data growth when 
  round-tripped through pg_wchar.  Versions before PostgreSQL 18.5, 17.11, 
  16.15, 15.19, and 14.24 are affected.
