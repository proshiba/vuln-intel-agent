title: n8n versions before 1.123.67, 2.31.5, and 2.32.1 contain an arbitrary 
  file write vulnerability in the Edit Image node, which passes its output 
  format parameter to the underlying image library without validation. An 
  authenticated user able to run workflows can supply a crafted format value to 
  write arbitrary files outside the node's working directory on the n8n 
  instance.
