title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  Fix dev use-after-free in xfrm async resumption\n\nxfrm async resumption hold skb->dev
  refcnt until after transport_finish.\nHowever, xfrm_rcv_cb may modify skb->dev to
  tunnel dev without taking\ndevice reference, such as vti_rcv_cb. The subsequent
  async resumption\nwill decrement the tunnel device's reference count, which lead
  to uaf\nof tunnel dev and refcnt leak of orig dev as below:\n\nunregister_netdevice:
  waiting for vti1 to become free. Usage count = -2\n\nStash the original skb->dev
  to fix refcnt imbalance. The new skb->dev set\nby xfrm_rcv_cb can race with device
  teardown. Extend rcu protection over\nxfrm_rcv_cb and transport_finish to prevent
  races."
