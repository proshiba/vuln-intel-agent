title: n8n before 1.123.67, 2.31.5, and 2.32.1 contains a credential 
  authorization bypass in the HTTP Request node. An authenticated member with 
  edit access to a shared workflow can reference another user's credential while
  specifying the credential type via an expression. Because the pre-execution 
  permission check compares the unresolved expression instead of the resolved 
  credential type, the ownership check is skipped and the credential is loaded 
  at execution time, allowing the member to use or exfiltrate a credential they 
  were not granted. Exploitation requires knowing the target credential's 
  identifier.
