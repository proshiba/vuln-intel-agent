title: FreeRDP before 3.29.0 contains integer overflow vulnerabilities in the 
  audio input redirection channel (audin) across ALSA, sndio, WinMM, and OpenSL 
  ES backends that fail to validate the FramesPerPacket parameter from RDP 
  servers. Attackers can supply a malicious FramesPerPacket value causing 
  allocation size wraparound, resulting in heap-based buffer overflow on ALSA or
  denial of service on all platforms.
