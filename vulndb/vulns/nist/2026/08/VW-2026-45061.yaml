title: A vulnerability has been found in Evergreen up to 
  3.14.11/3.15.11/3.16.5/3.17-beta1. The affected element is an unknown function
  of the file /osrf-gateway-v1 of the component open-ils.fielder OpenSRF 
  Service. Such manipulation leads to sql injection. The attack can be executed 
  remotely. The exploit has been disclosed to the public and may be used. 
  Upgrading to version 3.14.12, 3.15.12, 3.16.6 and 3.17-beta2 is sufficient to 
  fix this issue. The affected component should be upgraded.
