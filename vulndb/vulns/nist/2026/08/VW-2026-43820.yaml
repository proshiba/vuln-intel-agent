title: FreePBX is an open source IP PBX. From 17.0.1 until 17.0.7, the FreePBX 
  Music on Hold module permits dangerous command-line options for 
  /usr/bin/mpg123 and other allowed players in validateCustomConfiguration() in 
  Music.class.php. An authenticated administrator can use options that write 
  files, open control channels, or create Asterisk call files because 
  applicationUsesDisallowedPlayerOption() does not reject those arguments, 
  resulting in arbitrary command execution as the asterisk service user. This 
  issue is fixed in version 17.0.7.
