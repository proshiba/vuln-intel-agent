title: "Affected versions of cti-transmute render data obtained from a remote MISP
  instance into the event-browser interface using HTML interpolation. Because fields
  such as event IDs, event information, organization names, tags, tag colors, TLP
  labels, distribution labels, and error/flash text may be controlled by the remote
  MISP server, a malicious or compromised remote instance could return crafted values
  that inject HTML or script-capable content into the cti-transmute interface.\n\n\
  \nThe patch explicitly notes that remote-derived values must not reach innerHTML,
  and replaces string-built rows and badges with DOM nodes populated through textContent.
  It also restricts remote-controlled tag colors to six-digit hexadecimal values,
  preventing malicious CSS values such as url(...)."
