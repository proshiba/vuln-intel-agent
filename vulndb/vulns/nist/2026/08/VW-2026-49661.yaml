title: Mesop is a Python-based UI framework that allows users to build web 
  applications. Prior to 1.3.3, applications running in debug mode expose a GET 
  /hot-reload endpoint whose unbounded loop depends on the user-supplied counter
  parameter, allowing an unauthenticated attacker to hold worker threads with 
  high counter values until the worker pool is exhausted and the server becomes 
  unavailable. A single unauthenticated attacker can crash the Mesop server with
  minimal effort. Because the attack leverages worker exhaustion, the server 
  remains unresponsive until it is manually restarted. This issue is fixed in 
  version 1.3.3.
