title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmisc:
  fastrpc: take fl->lock when moving mmaps on interrupted invoke\n\nWhen an invoke
  is interrupted by a signal,\nwait_for_completion_interruptible() returns -ERESTARTSYS
  and\nfastrpc_internal_invoke() moves every buffer from fl->mmaps onto\ncctx->invoke_interrupted_mmaps.
  This list_del()/list_add_tail() walk\nruns without holding fl->lock, the lock that
  serialises fl->mmaps in\nfastrpc_req_mmap() and fastrpc_req_munmap() everywhere
  else.\n\nTake fl->lock around the move, matching every other fl->mmaps accessor."
