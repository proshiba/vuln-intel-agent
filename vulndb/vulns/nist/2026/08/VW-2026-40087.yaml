title: "The Ajax processor within the Carbon console fails to adequately protect state-changing
  operations from Cross-Site Request Forgery (CSRF) attacks. Specifically, it utilizes
  the HTTP GET method for these operations, and while the SameSite=Lax cookie attribute
  is employed for mitigation, this mechanism is bypassed as it permits cookies to
  be sent with cross-origin top-level navigation requests, including GET requests.
  This allows an attacker to trick an authenticated user's browser into unknowingly
  executing unintended actions.\n\nAn attacker can exploit this vulnerability to perform
  unauthorized state-altering requests on behalf of authenticated users. This could
  lead to consequences such as data modification, account changes, or other actions
  that could result in data compromise or loss of user control over their account.
  However, this attack is only feasible if the Carbon console and related services
  are exposed to the public internet, which is not recommended according to WSO2's
  securi"
