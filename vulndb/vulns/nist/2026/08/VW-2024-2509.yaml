title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  Fix an unsafe loop on the list\n\nThe kernel may crash when deleting a genetlink
  family if there are still\nlisteners for that family:\n\nOops: Kernel access of
  bad area, sig: 11 [#1]\n  ...\n  NIP [c000000000c080bc] netlink_update_socket_mc+0x3c/0xc0\n\
  \  LR [c000000000c0f764] __netlink_clear_multicast_users+0x74/0xc0\n  Call Trace:\n\
  __netlink_clear_multicast_users+0x74/0xc0\ngenl_unregister_family+0xd4/0x2d0\n\n\
  Change the unsafe loop on the list to a safe one, because inside the\nloop there
  is an element removal from this list."
