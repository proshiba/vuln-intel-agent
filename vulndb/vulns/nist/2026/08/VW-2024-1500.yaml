title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Reject sk_msg egress redirects to non-TCP sockets\n\nWith a SOCKMAP/SOCKHASH
  map and an sk_msg program user can steer messages\nsent from one TCP socket (s1)
  to actually egress from another TCP\nsocket (s2):\n\ntcp_bpf_sendmsg(s1)\t\t// =
  sk_prot->sendmsg\n  tcp_bpf_send_verdict(s1)\t// __SK_REDIRECT case\n    tcp_bpf_sendmsg_redir(s2)\n\
  \      tcp_bpf_push_locked(s2)\n\ttcp_bpf_push(s2)\n\t  tcp_rate_check_app_limited(s2)
  // expects tcp_sock\n\t  tcp_sendmsg_locked(s2)\t // ditto\n\nThere is a hard-coded
  assumption in the call-chain, that the egress\nsocket (s2) is a TCP socket.\n\n\
  However in commit 122e6c79efe1 (\"sock_map: Update sock type checks for\nUDP\")
  we have enabled redirects to non-TCP sockets. This was done for the\nsake of BPF
  sk_skb programs. There was no indention to support sk_msg\nsend-to-egress use case.\n\
  \nAs a result, attempts to send-to-egress through a non-TCP socket lead to a\ncrash
  due to invalid downcast from so"
