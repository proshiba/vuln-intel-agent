title: "act starts an HTTP Artifacts V4 backend whenever a workflow uses actions/upload-artifact@v4
  or actions/download-artifact@v4. The control-plane RPCs of that backend, including
  CreateArtifact, GetSignedArtifactURL, ListArtifacts, FinalizeArtifact and DeleteArtifact,
  accept a caller-supplied workflow_run_backend_id and never check that it belongs
  to the requester: validateRunIDV4 in pkg/artifacts/artifacts_v4.go parses the value
  and returns it with the comparison against the requesting task's run ID left commented
  out. The signed URLs the backend issues are authenticated by an HMAC whose key is
  hardcoded to the four bytes 0xba 0xdb 0xee 0xf0, identical in every build, computed
  over a concatenation of endpoint, expiry, artifact name and task ID with no length
  prefix or delimiter, so signatures are both forgeable and ambiguous between differing
  artifact name and task ID pairs. The --artifact-server-addr flag defaults to the
  host's outbound address rather than loopback, leaving the backend r"
