title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  sur40 - fix input device registration ordering\n\nIn sur40_probe(), input_register_device()
  was previously called early before\nthe V4L2 video device and vb2_queue components
  were fully initialized. If\nuserspace opened the input device immediately upon registration,
  sur40_open()\nwould trigger and start the sur40_poll() worker thread. This worker
  thread\ninvokes sur40_process_video() and accesses the uninitialized vb2_queue\n\
  structure, leading to a data race and potential system crash.\n\nFurthermore, if
  V4L2 or video registration failed after input_register_device()\nsucceeded, the
  error path fell through to calling input_free_device() on a\nsuccessfully registered
  device instead of input_unregister_device(), corrupting\ninput core state.\n\nMove
  input_register_device() to the very end of sur40_probe(). This ensures\nthe V4L2
  and video queue structures are fully initialized before polling can\nstart, and
