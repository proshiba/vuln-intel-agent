title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  bpf_local_storage: Always use bpf_mem_alloc in PREEMPT_RT\n\nIn PREEMPT_RT, kmalloc(GFP_ATOMIC)
  is still not safe in non preemptible\ncontext. bpf_mem_alloc must be used in PREEMPT_RT.
  This patch is\nto enforce bpf_mem_alloc in the bpf_local_storage when CONFIG_PREEMPT_RT\n\
  is enabled.\n\n[   35.118559] BUG: sleeping function called from invalid context
  at kernel/locking/spinlock_rt.c:48\n[   35.118566] in_atomic(): 1, irqs_disabled():
  0, non_block: 0, pid: 1832, name: test_progs\n[   35.118569] preempt_count: 1, expected:
  0\n[   35.118571] RCU nest depth: 1, expected: 1\n[   35.118577] INFO: lockdep is
  turned off.\n    ...\n[   35.118647]  __might_resched+0x433/0x5b0\n[   35.118677]\
  \  rt_spin_lock+0xc3/0x290\n[   35.118700]  ___slab_alloc+0x72/0xc40\n[   35.118723]\
  \  __kmalloc_noprof+0x13f/0x4e0\n[   35.118732]  bpf_map_kzalloc+0xe5/0x220\n[ \
  \  35.118740]  bpf_selem_alloc+0x1d2/0x7b0\n[   35.118755]  bpf_local_storage_update+0x2fa/0x8"
