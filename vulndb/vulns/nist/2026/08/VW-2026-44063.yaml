title: "PAX Technology Q80 Application Installer Signature Verification Bypass Remote
  Code Execution Vulnerability. This vulnerability allows network-adjacent attackers
  to execute arbitrary code on affected installations of PAX Technology Q80. Authentication
  is not required to exploit this vulnerability.\n\nThe specific flaw exists within
  the application installer. The issue results from the lack of proper verification
  of a cryptographic signature before installing an application. An attacker can leverage
  this in conjunction with other vulnerabilities to execute code in the context of
  root. Was ZDI-CAN-30585."
