  fetch RPC variants, FS.FetchData and FS.FetchData64, and\nLinux's afs client switches
  between them when talking to a non-YFS server\nif the read size, the file position
  or the sum of the two have the upper 32\nbits set of the 64-bit value.\n\nThis is
  a problem, however, since the file position and length fields of\nFS.FetchData are
  *signed* 32-bit values.\n\nFix this by capturing the capability bits obtained from
  the fileserver when\nit's sent an FS.GetCapabilities RPC, rather than just discarding
  them, and\nthen picking out the VICED_CAPABILITY_64BITFILES flag.  This can then
  be\nused to decide whether to use FS.FetchData or FS.FetchData64 - and also\nFS.StoreData
