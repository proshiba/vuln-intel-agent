title: A flaw was found in sblim-cmpi-base. Insecure temporary file creation in 
  the provider registration scripts allows a local unprivileged user to perform 
  a symlink attack. By creating a symlink in a world-writable directory, an 
  attacker can redirect privileged writes to an arbitrary file during script 
  execution in a privileged context. This can lead to the overwrite of 
  root-owned files, potentially disrupting system services or operation. 
  Exploitation is conditional on the script running with elevated privileges and
  may be mitigated by sticky-directory symlink protections.
