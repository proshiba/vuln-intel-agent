title: 'A security vulnerability has been detected in FishCodeTech Muteki up to 0.2.5.
  The affected element is an unknown function of the file .claude/settings.json of
  the component Default Local Worker Backend. The manipulation leads to os command
  injection. The attack can be initiated remotely. The exploit has been disclosed
  publicly and may be used. The issue was closed with the comment (translated from
  Chinese): "The project will be refactored and shut down."'
