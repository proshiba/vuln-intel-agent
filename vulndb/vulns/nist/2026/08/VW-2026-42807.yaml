title: FreeCAD is a free and open-source multiplatform 3D parametric modeler. 
  Prior to 1.1.2, PropertyFileIncluded::Restore() in src/App/PropertyFile.cpp 
  concatenates an attacker-controlled file or data attribute from Document.xml 
  with the document transient path without rejecting directory components, 
  absolute paths, or parent traversal. A crafted .FCStd archive with a matching 
  FileIncluded XML attribute and ZIP entry can therefore write 
  attacker-controlled content to arbitrary locations accessible to the FreeCAD 
  user, potentially enabling persistence, credential compromise, configuration 
  replacement, or code execution. This issue is fixed in version 1.1.2.
