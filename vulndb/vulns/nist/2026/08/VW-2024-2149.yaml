  toshiba_acpi: Fix array out-of-bounds access\n\nIn order to use toshiba_dmi_quirks[]
  together with the standard DMI\nmatching functions, it must be terminated by a empty
  entry.\n\nSince this entry is missing, an array out-of-bounds access occurs\nevery
  time the quirk list is processed.\n\nFix this by adding the terminating empty entry."
