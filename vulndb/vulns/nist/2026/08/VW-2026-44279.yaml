title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,fork:
  wipe ->bpf_storage before bailouts that access it\n\nCurrently, copy_process() can
  bail out to free_task() before p->bpf_storage\nhas been initialized, with this call
  graph (shown here for the\n!CONFIG_MEMCG case):\n\ncopy_process\n  dup_task_struct\n\
  \    arch_dup_task_struct\n      [copies the entire task_struct, including ->bpf_storage
  member]\n  [RLIMIT_NPROC check fails]\n  delayed_free_task\n    free_task\n    \
  \  bpf_task_storage_free\n        rcu_dereference(task->bpf_storage)\n        bpf_local_storage_destroy\n\
  \nIn this case, the nascent task's ->bpf_storage member that\nbpf_local_storage_destroy()
  operates on is a plain copy of the parent's\n->bpf_storage pointer, not a real initialized
  pointer.\nThis leads to badness (kernel hangs, UAF).\n\nThis is reachable as long
  as the process calling fork() has been inserted\ninto a task storage map."
