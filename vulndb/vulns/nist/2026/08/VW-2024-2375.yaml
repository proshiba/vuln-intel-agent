title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  Check debug trap enable before write dbg_ev_file\n\nIn interrupt context, write
  dbg_ev_file will be run by work queue. It\nwill cause write dbg_ev_file execution
  after debug_trap_disable, which\nwill cause NULL pointer access.\nv2: cancel work
  \"debug_event_workarea\" before set dbg_ev_file as NULL."
