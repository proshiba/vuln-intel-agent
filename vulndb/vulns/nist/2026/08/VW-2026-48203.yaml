title: An attacker that can reach a container's published TCP port may be able 
  to force the host's forwarding process to buffer an unbounded amount of that 
  client's data in memory, for as long as the backend container connection takes
  to complete — with no cap on how much accumulates or how long the wait can be 
  stretched. This vulnerability is addressed in container version 1.2.0.
