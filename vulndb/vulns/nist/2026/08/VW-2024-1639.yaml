title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  algif_hash - Remove bogus SGL free on zero-length error path\n\nWhen a zero-length
  message is hashed by algif_hash, and an error\nis triggered, it tries to free an
  SG list that was never allocated\nin the first place.  Fix this by not freeing the
  SG list on the\nzero-length error path."
