title: GitPython before 3.1.58 fails to validate submodule names from 
  .gitmodules files, allowing attackers to create Git repositories at arbitrary 
  filesystem paths outside the intended clone directory. Attackers can craft 
  malicious repositories with traversal sequences in submodule names that 
  GitPython processes during submodule initialization, creating 
  attacker-controlled Git repositories at escaped filesystem locations.
