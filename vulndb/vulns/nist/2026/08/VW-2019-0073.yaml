title: Multiple vulnerabilities in the multi-instance feature of Cisco Firepower
  Threat Defense (FTD) Software could allow an authenticated, local attacker to 
  escape the container for their FTD instance and execute commands with root 
  privileges in the host namespace. These vulnerabilities are due to 
  insufficient protections on the underlying filesystem. An attacker could 
  exploit these vulnerabilities by modifying critical files on the underlying 
  filesystem. A successful exploit could allow the attacker to execute commands 
  with root privileges within the host namespace. This could allow the attacker 
  to impact other running FTD instances.
