title: Metacat is data repository software that helps researchers preserve, 
  share, and discover data. Metacat versions 2.0.0 through 3.4.0 contain an 
  unauthenticated SQL injection vulnerability in the `/cn/v1/object` and 
  `/cn/v2/object` REST API endpoints due to unsanitized user input that can be 
  passed through to the backend SQL database. The `nodeId` parameter can be 
  modified to inject SQL commands, and the results are returned in error 
  messages. Metacat appends the user-supplied data into the sql query without 
  sanitization or parameterization. This allows extraction of arbitrary data 
  from the underlying PostgresQL database, fully exposing protected information 
  to the attacker. This is accomplished by leveraging the error reporting 
  mechanisms in Metacat, where SQL error responses are mirrored back to the 
  caller in the XML error message returned by Metacat. One approach, for 
