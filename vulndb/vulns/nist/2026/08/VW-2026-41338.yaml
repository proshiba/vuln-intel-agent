title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/rtp:
  Add RING_FORCE_TO_NONPRIV_DENY to OA whitelists\n\nUnconditionally whitelisting
  OA registers is a security violation. Set\nRING_FORCE_TO_NONPRIV_DENY bit in OA
  nonpriv slots, so that OA registers\ndon't get whitelisted by default after probe,
  gt reset, resume and engine\nreset.\n\n(cherry picked from commit 90511bdcfda97211c01f1d945d4ea616578d8fca)"
