title: An attacker that has valid credentials can select a compression algorithm
  for the IMAP connection whose decompression state requires a large amount of 
  memory, and open several such connections. The memory limit of the process is 
  reached with only a few connections, terminating the process and all 
  connections it handles, which can cause degradation or denial of service for 
  IMAP. Disable IMAP compression. Alternatively limit the number of connections 
  handled by a single imap-login process, though this has a performance impact. 
  Update to non-vulnerable version. No publicly available exploits are known.
