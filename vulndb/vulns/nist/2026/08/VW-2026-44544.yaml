title: "In the Linux kernel, the following vulnerability has been resolved:\n\nafs:
  Fix reinitialisation of the inode, in particular ->lock_work\n\nIt seems that initalising
  afs_vnode::lock_work a single time in the slab's\ninit function isn't sufficient
  for work_structs.  This results in the\nDEBUG_OBJECTS debugging stuff producing
  a warning occasionally when running\nthe generic/131 xfstest:\n\n ODEBUG: activate
  not available (active state 0) object: 0000000016d8760f object type: work_struct
  hint: afs_lock_work+0x0/0x220\n WARNING: lib/debugobjects.c:629 at debug_print_object+0x4b/0x90,
  CPU#3: locktest/7695\n ...\n CPU: 3 UID: 0 PID: 7695 Comm: locktest Tainted: G S\
  \                  7.1.0-build3+ #2771 PREEMPT\n ...\n RIP: 0010:debug_print_object+0x65/0x90\n\
  \ ...\n Call Trace:\n  <TASK>\n  ? __pfx_afs_lock_work+0x10/0x10\n  debug_object_activate+0x122/0x170\n\
  \  insert_work+0x25/0x60\n  __queue_work+0x2e0/0x340\n  queue_delayed_work_on+0x48/0x70\n\
  \  afs_fl_release_private+0x57/0x70\n  locks_release_private+0x5c/0xa0\n  "
