title: "In the Linux kernel, the following vulnerability has been resolved:\n\neventfs:
  Use children field for rcu head and add memory barriers\n\nWhen an eventfs inode
  is freed, it sets ei->is_freed and then uses its\nei->list to add it to the srcu
  link list as the list field is a union with\nthe rcu list head. As the ei->list
  is used to iterate over an SRCU\nprotected list without taking the eventfs_mutex,
  there's nothing stopping\nthe iteration over that list to see the ei->rcu instead
  of the ei->list\nand it will read a corrupt target.\n\nTo fix this, change the union
  of the rcu list head with the children list.\nOn freeing the eventfs inode, set
  the is_free and execute a smp_wmb()\nbefore adding the eventfs inode to the SRCU
  list.\n\nOn iteration of the ei->children list, at the start, execute a smp_rmb()\n\
  and then read the is_freed of the ei to see if the children list is still\nvalid.
  If is_freed is set, then the ei_child read is not valid and the\nloop should exit
  immediately."
