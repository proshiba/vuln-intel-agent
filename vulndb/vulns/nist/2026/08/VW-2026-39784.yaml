title: The wiseCampaign – WooCommerce Conversions Made Easy plugin for WordPress
  is vulnerable to unauthorized modification and disclosure of data due to every
  one of its REST API endpoints being registered with `permission_callback => 
  '__return_true'` in all versions up to, and including, 1.1.16. This makes it 
  possible for unauthenticated attackers to read and modify the plugin's banner,
  stockbar, and core settings — including saving/updating banner records, 
  toggling stockbar/feature flags, changing the active banner, and uploading 
  background-image files via wp_handle_upload() — without any nonce or 
  capability check.
