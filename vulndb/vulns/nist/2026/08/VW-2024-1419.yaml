title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntls:
  fix race between async notify and socket close\n\nThe submitting thread (one which
  called recvmsg/sendmsg)\nmay exit as soon as the async crypto handler calls complete()\n\
  so any code past that point risks touching already freed data.\n\nTry to avoid the
  locking and extra flags altogether.\nHave the main thread hold an extra reference,
  this way\nwe can depend solely on the atomic ref counter for\nsynchronization.\n\
  \nDon't futz with reiniting the completion, either, we are now\ntightly controlling
  when completion fires."
