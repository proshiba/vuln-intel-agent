title: Domoticz versions prior to 2026.3 contains a stored cross-site scripting 
  vulnerability in the mobile dashboard that allows authenticated attackers to 
  inject arbitrary HTML and JavaScript by updating Text or Alert subtype device 
  values through the API. The mobile dashboard renders device data via 
  ng-bind-html with only an nl2br() transform that performs no HTML escaping, 
  allowing attackers to store malicious payloads that execute in any 
  administrator's browser upon viewing the mobile dashboard, enabling session 
  cookie theft and account takeover.
