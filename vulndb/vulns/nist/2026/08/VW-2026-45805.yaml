title: n8n is an open source workflow automation platform. Prior to 1.123.64, 
  2.29.8, and 2.30.1, the Git node clone operation allows an authenticated 
  workflow user to swap a validated directory for a symlink before cloning, 
  planting a crafted repository in the community node directory that loads as a 
  custom JavaScript node after restart and executes arbitrary code on the 
  server. This issue is fixed in versions 1.123.64, 2.29.8, and 2.30.1.
