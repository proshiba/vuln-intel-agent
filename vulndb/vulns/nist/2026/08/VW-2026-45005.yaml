title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  zoned: fix deadlock between metadata writeback and transaction commit\n\nWhen writing
  out metadata extent buffers in a zoned filesystem,\nbtree_writepages() holds fs_info->zoned_meta_io_lock
  across the whole\nwriteback loop, including the call to btrfs_check_meta_write_pointer()
  ->\ncheck_bg_is_active().\n\nFor the tree-log block group, check_bg_is_active()
  may fail to activate\nthe zone and fall back to btrfs_zone_finish_one_bg() to free
  an active\nzone. That path waits for the running transaction to commit while still\n\
  holding zoned_meta_io_lock, but the committer needs that same lock to\nwrite out
  the tree extents, so the two tasks deadlock:\n\n  Task A (kworker, metadata writeback)\
  \      Task B (fsstress, transaction commit)\n  ------------------------------------\
  \      -------------------------------------\n  wb_workfn()                    \
  \           btrfs_commit_transaction(T)\n   btree_writepages()                 \
  \       "
