title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/rockchip:
  dw_dp: Fix null-ptr-deref in dw_dp_remove()\n\nAttempting to access driver data
  in the platform driver ->remove()\ncallback may lead to a null pointer dereference
  since there is no\nguaranty that the component ->bind() callback invoking\nplatform_set_drvdata()
  was executed.\n\nA common scenario is when Rockchip DRM driver didn't manage to
  run\ncomponent_bind_all() because of an (unrelated) error causing early\nreturn
  from rockchip_drm_bind().\n\nDrop the unnecessary call to platform_get_drvdata()
  and, instead,\nreference the target device structure via platform_device."
