title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfirmware:
  arm_ffa: Fix Endpoint Memory Access Descriptor offset calculation\n\nUse the descriptor's
  `ep_mem_offset` to calculate the start of the endpoint\nmemory access array and
  to comply with the FF-A spec instead of defaulting\nto `sizeof(struct ffa_mem_region)`.\n\
  This requires moving `ffa_mem_region_additional_setup()` earlier in the setup\n\
  flow.\nAlso, add sanity checks to ensure the calculated descriptor offsets do not\n\
  exceed `max_fragsize`."
