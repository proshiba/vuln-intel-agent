  Fix potential buffer overflowin nfs_sysfs_link_rpc_client()\n\nname is char[64]
  where the size of clnt->cl_program->name remains\nunknown. Invoking strcat() directly
  will also lead to potential buffer\noverflow. Change them to strscpy() and strncat()
  to fix potential\nissues."
