title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath6kl: fix use-after-free in aggr_reset_state()\n\nThe aggr_reset_state() function
  uses timer_delete() (non-synchronous)\nfor the aggregation timer before proceeding
  to delete TID state and\nbefore the structure is freed by callers like aggr_module_destroy().\n\
  \nIf the timer callback (aggr_timeout) is executing when aggr_reset_state()\nis
  called, the callback will continue to access aggr_conn fields like\nrx_tid[] and
  stat[] which may be freed immediately after by\nkfree(aggr_info->aggr_conn) in aggr_module_destroy().\n\
  \nAdditionally, the timer callback can re-arm itself via mod_timer() while\naggr_reset_state()
  is running, creating a more complex race condition.\n\nUse timer_delete_sync() instead
  to ensure any running timer callback\nhas completed before returning."
