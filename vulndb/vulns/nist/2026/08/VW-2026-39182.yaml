title: Microweber CMS through 2.0.20 contains a stored cross-site scripting 
  vulnerability in the content tagging system that allows admin-authenticated 
  attackers to inject arbitrary JavaScript by submitting malicious payloads via 
  the tag_names parameter of the GET /api/save_content_admin endpoint, bypassing
  three independent sanitization controls including XSS middleware that ignores 
  GET requests, a strip_unsafe() function that only matches double-quoted 
  onerror attributes, and a titlecase normalizer that passes HTML decimal 
  entity-encoded payloads through unchanged. Attackers can store malicious 
  scripts that execute without user interaction for every visitor to the public 
  blog page and within the admin post editor, enabling session riding through 
  same-origin fetch requests using the CSRF token embedded in the page.
