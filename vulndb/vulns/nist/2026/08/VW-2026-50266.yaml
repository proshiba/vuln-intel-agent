title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Pad trailing CCA or EP11 message with zeros\n\nThe both functions xcrb_msg_to_type6cprb_msgx()
  and\nxcrb_msg_to_type6_ep11cprb_msgx() copy the user space message into a\nkernel
  buffer based on the message length. But on further processing\nthe message is supposed
  to be 4 byte length adjusted. Thus up to 3\nbytes of uninitialized kernel memory
  are forwarded to further\nprocessing steps and may unwanted expose kernel memory
  to the crypto\ncard firmware.\n\nThis patch contains code to pad the gap between
  user space copied\nmessage and message buffer length sent down to further processing
  of\nthe CCA or EP11 message to zeros."
