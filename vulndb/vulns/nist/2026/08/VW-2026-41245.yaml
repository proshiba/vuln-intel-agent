title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix union collision of module and refcnt for dynamic events\n\nIn 'struct trace_event_call',
  the 'module' pointer and the 'refcnt'\natomic variable share the same memory space
  in a union. For dynamic\nevents, the union member is 'refcnt', which acts as an
  active\nreference counter.\n\nWhen a dynamic event (such as kprobe, uprobe, fprobe,
  eprobe, or\nwprobe) has a non-zero reference count (e.g. due to active event\ntriggers
  or perf attachments), its 'call->module' evaluates to a\nsmall non-zero integer
  instead of NULL.\n\nWhen filtering or setting events for a specific module (e.g.,
  writing\n':mod:<module>' to 'set_event'), the code in\n'__ftrace_set_clr_event_nolock()'
  and 'update_event_fields()' reads\n'call->module' directly without checking whether
  the event is dynamic.\nThis causes the kernel to treat the small integer (refcnt)
  as a\n'struct module' pointer, leading to a NULL/invalid pointer dereference\n(Oops)
  when derefe"
