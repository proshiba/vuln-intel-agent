title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/bridge:
  cdns-dsi: Replace deprecated UNIVERSAL_DEV_PM_OPS()\n\nThe deprecated UNIVERSAL_DEV_PM_OPS()
  macro uses the provided callbacks\nfor both runtime PM and system sleep. This causes
  the DSI clocks to be\ndisabled twice: once during runtime suspend and again during
  system\nsuspend, resulting in a WARN message from the clock framework when\nattempting
  to disable already-disabled clocks.\n\n[   84.384540] clk:231:5 already disabled\n\
  [   84.388314] WARNING: CPU: 2 PID: 531 at /drivers/clk/clk.c:1181 clk_core_disable+0xa4/0xac\n\
  ...\n[   84.579183] Call trace:\n[   84.581624]  clk_core_disable+0xa4/0xac\n[ \
  \  84.585457]  clk_disable+0x30/0x4c\n[   84.588857]  cdns_dsi_suspend+0x20/0x58
  [cdns_dsi]\n[   84.593651]  pm_generic_suspend+0x2c/0x44\n[   84.597661]  ti_sci_pd_suspend+0xbc/0x15c\n\
  [   84.601670]  dpm_run_callback+0x8c/0x14c\n[   84.605588]  __device_suspend+0x1a0/0x56c\n\
  [   84.609594]  dpm_suspend+0x17c/0x21c\n[   84.613165]  dpm"
