title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  libfc: Fix use after free in fc_exch_abts_resp()\n\nfc_exch_release(ep) will decrease
  the ep's reference count. When the\nreference count reaches zero, it is freed. But
  ep is still used in the\nfollowing code, which will lead to a use after free.\n\n\
  Return after the fc_exch_release() call to avoid use after free."
