title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxen/gntdev:
  fix error handling in ioctl\n\nWhen gntdev_ioctl_map_grant_ref() fails to copy the
  operation result\nback to userspace after successfully adding the mapping to the
  list,\nthe error path returns -EFAULT without releasing the reference\nacquired
  by gntdev_alloc_map(). The mapping remains in priv->maps\nwith a refcount of 1,
  causing a memory leak and a dangling list\nentry.\n\nAdditionally, gntdev_add_map()
  may modify map->index to avoid overlap\nwith existing mappings. Therefore, the index
  returned to userspace\nmust be obtained after gntdev_add_map() completes.\n\nFix
  this by holding the mutex across gntdev_add_map(), retrieving\nthe correct index,
  and copy_to_user(). If copy_to_user() fails,\nremove the mapping from the list and
  release the reference while\nstill holding the lock.\n\n\nFix these issues by properly
  handling all error cases."
