title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix NULL pointer dereference in rhash table destroy\n\nWhen unbinding the
  ath12k driver, kernel NULL pointer dereferences\noccur in irq_work_sync() called
  from rhashtable_destroy().\n\nTwo hash tables are affected:\n1. ath12k_link_sta
  hash table in ath12k_base\n2. ath12k_dp_link_peer hash table in ath12k_dp\n\nThe
  issue happens because the destroy functions are called unconditionally\nin cleanup
  paths, but the hash tables are only initialized late in their\nrespective init functions.
  If the device was never fully started or if the\ninit functions failed before initializing
  the hash tables, the pointers\nwill be NULL. The issues are always reproducible
  from a VM because the MSI\naddressing initialization is failing.\n\nCall trace for
  ath12k_link_sta_rhash_tbl_destroy:\n RIP: irq_work_sync+0x1e/0x70\n rhashtable_destroy+0x12/0x60\n\
  \ ath12k_link_sta_rhash_tbl_destroy+0x19/0x40 [ath12k]\n ath12k_core_stop+0xe/0x80
  [ath12k]\n ath1"
