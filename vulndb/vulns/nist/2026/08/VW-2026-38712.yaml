title: FreeRDP before 3.29.0 contains client-side heap use-after-free 
  vulnerabilities in the async update message proxy for RAIL WINDOW_STATE_ORDER 
  and NOTIFY_ICON_STATE_ORDER when AsyncUpdate is enabled. When a malicious or 
  compromised RDP server sends crafted update orders, the message proxy 
  shallow-copies structures containing nested parser-owned pointers (e.g., 
  titleInfo.string, windowRects, visibilityRects, icon buffers). The parser 
  frees those nested buffers after the callback returns, so the queued async 
  message later dispatches stale pointers, potentially causing memory corruption
  or a client crash.
