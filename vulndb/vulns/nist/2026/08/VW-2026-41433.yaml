title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: fix NULL pointer dereference in ath11k_hal_srng_access_begin\n\nIn ATH11K_QMI_EVENT_FW_READY,
  ATH11K_FLAG_REGISTERED is set\nunconditionally even when ath11k_core_qmi_firmware_ready()
  fails.\nThis leaves the driver in an inconsistent state where\ninitialization is
  considered complete although the firmware ready\nhandling did not finish successfully.
  During the subsequent SSR,\nthe driver enters the restart path based on this incorrect
  state\nand dereferences uninitialized srng members, resulting in a NULL\npointer
  dereference.\n\nCall trace:\n  ath11k_hal_srng_access_begin+0xc/0x60 [ath11k] (P)\n\
  \  ath11k_ce_cleanup_pipes+0x17c/0x180 [ath11k]\n  ath11k_core_restart+0x40/0x168
  [ath11k]\n\nFix this by:\n- skipping firmware_ready if ATH11K_FLAG_REGISTERED is
  already set\n- setting ATH11K_FLAG_REGISTERED only when firmware_ready succeeds\n\
  - setting ATH11K_FLAG_QMI_FAIL and aborting the FW_READY handling\non error\n\n\
  Tested-on: WCN"
