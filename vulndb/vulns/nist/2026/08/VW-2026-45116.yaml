title: The User Login History plugin for WordPress is vulnerable to SQL 
  Injection via the 'blog_id' parameter in all versions up to, and including, 
  2.1.7. This is due to insufficient escaping on the user supplied parameter and
  lack of sufficient preparation on the existing SQL query. This makes it 
  possible for authenticated attackers, with Administrator-level access and 
  above, to append additional SQL queries into already existing queries that can
  be used to extract sensitive information from the database. This is only 
  exploitable on multisite installations.
