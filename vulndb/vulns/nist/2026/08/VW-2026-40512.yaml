title: "AIL Framework contains a stored cross-site scripting vulnerability in the
  crawler domain view. Crawled URLs were embedded directly into the JavaScript onclick
  handler used to display a stored screenshot, without context-appropriate encoding.\n\
  \nAn attacker who can cause a specially crafted URL to be recorded in the crawler
  history can inject JavaScript syntax into the stored URL value. The payload remains
  stored by AIL and is subsequently included in the domain view. When an authenticated
  analyst clicks the screenshot icon associated with the malicious URL, the injected
  JavaScript executes in the analyst’s browser within the security context of the
  AIL Framework application.\n\nSuccessful exploitation could allow an attacker to
  access information available to the analyst’s session, modify displayed content,
  or perform application actions using the analyst’s privileges. Exploitation requires
  the victim to interact with the affected screenshot entry.\n\nThe vulnerability
  was corrected by seria"
