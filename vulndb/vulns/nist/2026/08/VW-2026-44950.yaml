title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  x86: Cancel delayed I/O APIC EOI handling before destroying vCPUs\n\nCancel (and
  flush) the I/O APIC's delayed EOI handling work during the\n\"pre VM destroy\" phase,
  before vCPUs are destroyed, as processing the EOI\nbroadcast will inject another
  IRQ if the line is asserted, i.e. will try\nto deliver an IRQ to the target vCPU(s).\
  \  Canceling the work after vCPUs\nare destroyed leads to UAF if the delayed work
  is processed after vCPUs are\ndestroyed.\n\n  BUG: KASAN: slab-use-after-free in
  __kvm_irq_delivery_to_apic_fast+0x9bf/0xa20 arch/x86/kvm/lapic.c:1250\n  Read of
  size 8 at addr ffff8880499abea0 by task kworker/1:2/1218\n\n  CPU: 1 UID: 0 PID:
  1218 Comm: kworker/1:2 Not tainted 7.1.0-rc7 #5 PREEMPT(lazy)\n  Hardware name:
  QEMU Ubuntu 25.10 PC v2 (i440FX + PIIX, + 10.1 machine, 1996), BIOS 1.16.3-debian-1.16.3-2
  04/01/2014\n  Workqueue: events kvm_ioapic_eoi_inject_work\n  Call Trace:\n   <TASK>\n\
  \   __dump_stack lib/dump_stack.c"
