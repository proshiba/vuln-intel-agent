title: "Multiple Cisco products are affected by a vulnerability in the Snort 3 Visual
  Basic for Applications (VBA) feature which could allow an unauthenticated, remote
  attacker to cause the Snort 3 Detection Engine to crash.&nbsp;\r\n&nbsp;\r\nThis
  vulnerability is due to lack of proper error checking when decompressing VBA data.
  An attacker could exploit this vulnerability by sending a crafted VBA data to the
  Snort 3 Detection Engine on the targeted device. A successful exploit could allow
  the attacker to cause the Snort 3 Detection Engine to unexpectedly restart causing
  a a denial of service (DoS) condition."
