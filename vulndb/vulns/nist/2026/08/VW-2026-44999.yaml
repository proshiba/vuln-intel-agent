title: "In the Linux kernel, the following vulnerability has been resolved:\n\nkeys:
  make keyring key-chunk byte order agree with keyring_diff_objects()\n\nkeyring_get_key_chunk()
  loads description bytes into the index chunk low\naddress first, while keyring_diff_objects()
  numbers the first differing\nbit from the low end and folds the absolute byte index
  into the level\nwithout removing the inline-prefix offset the level already carries.\n\
  The two disagree on byte order and bit position, so the array can be\ntold two keys
  first differ at a bit that does not differ in the chunk\nthe walker uses, letting
  crafted descriptions collide into one node.\n\nLoad the chunk in the order keyring_diff_objects()
  assumes and drop the\ninline-prefix length when folding the byte index into the
  level.  This\nonly changes the in-memory ordering used to place keys within a keyring;\n\
  add, search and read of non-colliding keys are unaffected."
