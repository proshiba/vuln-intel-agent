title: The WP Courses LMS – Online Courses Builder, eLearning Courses, Courses 
  Solution, Education Courses plugin for WordPress is vulnerable to Insecure 
  Direct Object Reference in all versions up to, and including, 3.2.29 via the 
  'resultID' parameter due to missing validation on a user controlled key. This 
  makes it possible for authenticated attackers, with custom-level access and 
  above, to read any other user's quiz answers and scores by enumerating the 
  incrementing resultID value via the wpcq_get_quiz_result AJAX action. The only
  access control on this endpoint is a nonce check (wpc_nonce) that is exposed 
  to every logged-in user on the frontend, providing no meaningful authorization
  barrier.
