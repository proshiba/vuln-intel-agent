title: KubePi is a Kubernetes multi-cluster management panel. In versions up to 
  and including 2.0.0, cluster-scoped APIs do not consistently validate 
  per-cluster access, allowing an authenticated user with cluster management 
  permissions to operate on clusters outside the scope they were granted. 
  Because the affected endpoints act on cluster-specific data without confirming
  that the requesting user is authorized for that particular cluster, a user 
  assigned management rights over one cluster can, under certain role and 
  cluster configurations, read or modify data in clusters they should not 
  manage. This issue is fixed in version 2.0.1.
