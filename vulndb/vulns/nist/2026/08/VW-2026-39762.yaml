title: Zigbee2MQTT's ExternalJSExtension.getFilePath 
  (lib/extension/externalJS.ts) joins a parameter received via an MQTT message 
  (topic zigbee2mqtt/bridge/request/extension/save) into the extensions base 
  path using path.join(basePath, name) with no sanitization. The extension 
  handler only validates that the name ends in .js/.mjs/.cjs, writes the file, 
  and then dynamically imports it via Node.js import, achieving remote code 
  execution.
