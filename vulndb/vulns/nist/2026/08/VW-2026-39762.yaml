title: Zigbee2MQTT's ExternalJSExtension.getFilePath() 
  (lib/extension/externalJS.ts) joins a `name` parameter received via an MQTT 
  message (topic zigbee2mqtt/bridge/request/extension/save) into the extensions 
  base path using path.join(basePath, name) with no sanitization. Because 
  path.join() resolves `../` sequences, a name such as `../../tmp/evil.js` 
  escapes the intended extensions directory. The extension handler only 
  validates that the name ends in .js/.mjs/.cjs, writes the file, and then 
  dynamically imports it via Node.js import(), achieving remote code execution. 
  Requires the `enable_external_js` config option (off by default, but commonly 
  enabled in legacy installs) and MQTT broker access, which is frequently 
  unauthenticated in real deployments. The identical unsanitized getFilePath() 
  is also used by the extension-removal handler, enabling arbitrary file 
  deletion.
