title: webpack-dev-middleware resolves a request to a local file in 
  getFilenameFromUrl by testing the request pathname against a traversal guard 
  and then slicing it at a fixed character offset. The guard, UP_PATH_REGEXP 
  applied to path.normalize(`./${pathname}`), only matches ".." that stands as a
  whole path segment, while the containment test is the string comparison 
  pathname.startsWith(publicPathPathname) and the file path is built as 
  path.join(outputPath, pathname.slice(publicPathPathname.length)). When the 
  configured publicPath has no trailing slash, a request such as GET 
  /assets../.env against publicPath /assets yields the pathname /assets../.env, 
  whose only dot-dot sits inside the segment "assets.." and so passes the guard,
  but the offset slice cuts within that segment and hands "../.env" to 
  path.join, resolving one directory above outputPath. Reading a file from that 
  path requires the middleware to be backed by the physical filesystem, which 
  happens when writeToDisk is true or a custom
