title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  af_alg - Fix missing initialisation affecting gcm-aes-s390\n\nFix af_alg_alloc_areq()
  to initialise areq->first_rsgl.sgl.sgt.sgl to point\nto the scatterlist array in
  areq->first_rsgl.sgl.sgl.\n\nWithout this, the gcm-aes-s390 driver will oops when
  it tries to do\ngcm_walk_start() on req->dst because req->dst is set to the value
  of\nareq->first_rsgl.sgl.sgl by _aead_recvmsg() calling\naead_request_set_crypt().\n\
  \nThe problem comes if an empty ciphertext is passed: the loop in\naf_alg_get_rsgl()
  just passes straight out and doesn't set areq->first_rsgl\nup.\n\nThis isn't a problem
  on x86_64 using gcmaes_crypt_by_sg() because, as far\nas I can tell, that ignores
  req->dst and only uses req->src[*].\n\n[*] Is this a bug in aesni-intel_glue.c?\n\
  \nThe s390x oops looks something like:\n\n Unable to handle kernel pointer dereference
  in virtual kernel address space\n Failing address: 0000000a00000000 TEID: 0000000a00000803\n\
  \ Fault in home sp"
