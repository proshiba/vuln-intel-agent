title: Integer wraparound in PostgreSQL 32-bit builds of pltcl and plperl allows
  an object creator to cause the server to undersize an allocation and write 
  out-of-bounds via crafted function bodies.  This may execute arbitrary code as
  the operating system user running the database.  CVE-2026-6473 had fixed 
  similar problems.  Versions before PostgreSQL 18.5, 17.11, 16.15, 15.19, and 
  14.24 are affected.
