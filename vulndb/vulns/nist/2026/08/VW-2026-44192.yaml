title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-pf:
  fix SQB pointer leak on init failure\n\notx2_init_hw_resources() initializes SQ
  aura and pool resources before\nseveral later setup steps. On failure, err_free_sq_ptrs
  only frees SQB\npages, leaving the per-SQ sqb_ptrs arrays behind.\n\nUse otx2_free_sq_res()
  for the SQ unwind path and let it free sqb_ptrs\neven when sq->sqe has not been
  allocated yet.\n\nThe bug was first flagged by an experimental analysis tool we
  are\ndeveloping for kernel memory-management bugs while analyzing\nv6.13-rc1. The
  tool is still under development and is not yet publicly\navailable. Manual inspection
  confirms that the bug is still\npresent in v7.1.1.\n\nAn x86_64 allyesconfig build
  showed no new warnings. As we do not have an\nOcteonTX2 PF device and the corresponding
  AF mailbox setup to test with,\nno runtime testing was able to be performed."
