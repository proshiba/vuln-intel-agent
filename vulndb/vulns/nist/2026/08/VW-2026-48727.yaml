title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost-scsi:
  reject feature changes after endpoint\n\nvhost_scsi_setup_vq_cmds() runs from VHOST_SCSI_SET_ENDPOINT
  and allocates\neach command's protection scatterlist array (prot_sgl) according
  to the\nacknowledged VIRTIO_SCSI_F_T10_PI bit.  The command pools are not rebuilt\n\
  when VHOST_SET_FEATURES changes that bit later.\n\nAlthough virtio feature bits
  must not change after feature negotiation,\nvhost_scsi_set_features() currently
  accepts such a request after the\nendpoint is active and updates acked_features.\
  \  Enabling T10-PI after\nendpoint setup therefore leaves prot_sgl NULL while the
  I/O path follows\nthe new feature bit.\n\nFor a 129-page protection payload, vhost_scsi_mapal()
  passes the missing\nfirst chunk to sg_alloc_table_chained():\n\n  sg_alloc_table_chained(table,
  129, first_chunk=NULL,\n                         nents_first_chunk=inline_sg_cnt)\n\
  \nsg_pool_index() then hits:\n\n  BUG_ON(nents > SG_CHUNK_SIZE);   /* 129 > 128"
