title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvfio/qat:
  fix f_pos race in qat_vf_resume_write()\n\nqat_vf_resume_write() checks filp->f_pos
  before taking migf->lock, but\ncopies into the migration-state buffer after taking
  the lock and\nre-reading the shared file position.\n\nTwo concurrent writers could
  therefore pass the bounds check with the\nold offset, then have the second writer
  copy after the first advanced\nf_pos, writing past the end of the migration-state
  buffer.\n\nTake migf->lock before doing the boundary checks."
