title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnfp:
  Check resource mutex allocation\n\nnfp_cpp_resource_find() allocates a CPP mutex
  handle for the matching\nresource-table entry and then reports success.  nfp_resource_try_acquire()\n\
  immediately passes that handle to nfp_cpp_mutex_trylock().\n\nHowever, nfp_cpp_mutex_alloc()
  returns NULL on failure.  If that happens\nfor a matching table entry, the resource
  lookup still returns success and\nthe following trylock dereferences a NULL mutex
  pointer while opening the\nresource.\n\nnfp_resource_acquire() already treats failure
  to allocate the table mutex\nas -ENOMEM.  Do the same for the resource mutex and
  fail the lookup before\npublishing the rest of the resource handle.\n\nThis issue
  was found by a static analysis checker and confirmed by\nmanual source review."
