title: "In the Linux kernel, the following vulnerability has been resolved:\n\nf2fs:
  remove WARN_ON in f2fs_is_valid_blkaddr\n\nSyzbot triggers two WARNs in f2fs_is_valid_blkaddr
  and\n__is_bitmap_valid. For example, in f2fs_is_valid_blkaddr,\nif type is DATA_GENERIC_ENHANCE
  or DATA_GENERIC_ENHANCE_READ,\nit invokes WARN_ON if blkaddr is not in the right
  range.\nThe call trace is as follows:\n\n f2fs_get_node_info+0x45f/0x1070\n read_node_page+0x577/0x1190\n\
  \ __get_node_page.part.0+0x9e/0x10e0\n __get_node_page\n f2fs_get_node_page+0x109/0x180\n\
  \ do_read_inode\n f2fs_iget+0x2a5/0x58b0\n f2fs_fill_super+0x3b39/0x7ca0\n\nFix
  these two WARNs by replacing WARN_ON with dump_stack."
