title: Dokploy is a free, self-hostable Platform as a Service (PaaS). In 0.28.8 
  and earlier, an authenticated user who can create or update file mounts for a 
  service can inject shell metacharacters into filePath, causing Dokploy to 
  execute attacker-controlled commands on the configured remote managed server 
  over SSH. In the default deployment model, this yields direct remote host RCE 
  from the web interface.
