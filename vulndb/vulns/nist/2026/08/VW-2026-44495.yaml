title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  cake: reject overhead values that underflow length\n\nCAKE accepts signed overhead
  values and stores them in an s16, but the\nadjusted packet length calculation uses
  unsigned arithmetic.  A negative\neffective length can therefore wrap to a large
  value.\n\nSuch configurations make rate accounting depend on integer wraparound\n\
  rather than on the packet size userspace intended to model.  A static\nnetlink lower
  bound is not enough because packets reaching CAKE can be\nsmaller than any reasonable
  manual-overhead allowance.\n\nFold the signed overhead adjustment into the existing
  datapath MPU clamp\nso negative adjusted lengths are clamped before link-layer framing\n\
  adjustments."
