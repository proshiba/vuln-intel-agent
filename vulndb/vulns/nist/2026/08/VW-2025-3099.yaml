title: "In the Linux kernel, the following vulnerability has been resolved:\n\nring-buffer:
  Do not swap cpu_buffer during resize process\n\nWhen ring_buffer_swap_cpu was called
  during resize process,\nthe cpu buffer was swapped in the middle, resulting in incorrect
  state.\nContinuing to run in the wrong state will result in oops.\n\nThis issue
  can be easily reproduced using the following two scripts:\n/tmp # cat test1.sh\n\
  //#! /bin/sh\nfor i in `seq 0 100000`\ndo\n         echo 2000 > /sys/kernel/debug/tracing/buffer_size_kb\n\
  \         sleep 0.5\n         echo 5000 > /sys/kernel/debug/tracing/buffer_size_kb\n\
  \         sleep 0.5\ndone\n/tmp # cat test2.sh\n//#! /bin/sh\nfor i in `seq 0 100000`\n\
  do\n        echo irqsoff > /sys/kernel/debug/tracing/current_tracer\n        sleep
  1\n        echo nop > /sys/kernel/debug/tracing/current_tracer\n        sleep 1\n\
  done\n/tmp # ./test1.sh &\n/tmp # ./test2.sh &\n\nA typical oops log is as follows,
  sometimes with other different oops logs.\n\n[  231.711293] WARNING: CPU: 0 PID:
  9 at kerne"
