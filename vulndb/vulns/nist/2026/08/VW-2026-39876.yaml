title: IBM Langflow OSS 1.0.0 through 1.10.3 could allow an authenticated 
  attacker to execute unintended code during Agentic Assistant validation due to
  improper handling of LLM‑generated components. The application executes 
  model‑generated Python code in the backend during validation prior to user 
  approval, which may allow an attacker to trigger side effects such as outbound
  network access, file system interaction, or data exfiltration with the 
  privileges of the Langflow backend process.
