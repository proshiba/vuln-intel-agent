title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvmet-tcp:
  fix page fragment cache leak in error path\n\nIn nvmet_tcp_alloc_queue(), when a
  connection is closed during the\nallocation process (e.g., nvmet_tcp_set_queue_sock()
  returns -ENOTCONN),\nthe error handling jumps to out_destroy_sq and then to out_ida_remove\n\
  without draining the page fragment cache.\n\nAlthough nvmet_tcp_free_cmd() is called
  in some error paths to release\nindividual page fragments, the underlying page cache
  reference held by\nqueue->pf_cache is never released. The first allocation using
  pf_cache\nis the call to nvmet_tcp_alloc_cmd() for queue->connect, which happens\n\
  after ida_alloc() returns successfully. This results in a page leak each\ntime a
  connection fails during allocation, which could lead to memory\nexhaustion over
  time if connections are repeatedly opened and closed.\n\nFix this by calling page_frag_cache_drain()
  before freeing the queue\nstructure in the out_ida_remove label."
