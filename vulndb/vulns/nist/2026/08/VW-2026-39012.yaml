title: "CTI-Transmute is affected by a server-side request forgery vulnerability in
  the evaluation report PDF-generation functionality.\n\nUser-controlled CTI content,
  including conversion names, descriptions, and comments, is converted from Markdown
  to HTML and rendered as a PDF using WeasyPrint. Before the patch, the renderer used
  WeasyPrint’s default URL-fetching behavior without restricting the protocols or
  destinations that could be referenced by the generated HTML.\n\nAn attacker able
  to supply content included in an evaluation report could inject crafted resource
  references using schemes such as http://, https://, or file://. When the report
  was rendered, CTI-Transmute could fetch these resources using the application server’s
  network connectivity and filesystem privileges.\n\nSuccessful exploitation could
  allow an attacker to:\n\n  *  access services available only from the CTI-Transmute
  server or its internal network;\n  *  probe internal hosts and service endpoints;\n\
  \  *  retrieve local files "
