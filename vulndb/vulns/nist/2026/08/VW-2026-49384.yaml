title: "Issue summary: QUIC server may double free QRX (QUIC record layer RX) object\n\
  when channel creation fails for initial packet.\n\nImpact summary: Double free leads
  to heap corruption, which typically results in \ntermination of QUIC server process,
  leading to Denial of Service. There is so\nfar no evidence that this double free
  is exploitable for remote code execution,\nthus it is considered highly improbable.\n\
  \nCWE: CWE-415: Double Free\n\nDescription: In order to validate initial packet,
  OpenSSL QUIC stack default\npacket handler (port_default_packet_handler()) creates
  a so-called QRX object.\nIf the initial packet validates successfully with QRX object,
  the default packet\nhandler proceeds to channel (connection object) creation. The
  QRX object used\nfor packet validation is passed to port_bind_channel(), so it becomes
  part of\nthe newly created connection. If port_bind_channel() fails, then it also
