title: "Issue summary: QUIC server may double free QRX (QUIC record layer RX) object\n\
  when channel creation fails for initial packet.\n\nImpact summary: Double free leads
  to heap corruption, which typically results in \ntermination of QUIC server process,
  leading to Denial of Service. There is so\nfar no evidence that this double free
  is exploitable for remote code execution,\nthus it is considered highly improbable.\n\
