title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvc_screen:
  reload load of struct vc_data pointer in vcs_write() to avoid UAF\n\nAfter a call
  to console_unlock() in vcs_write() the vc_data struct can be\nfreed by vc_port_destruct().
  Because of that, the struct vc_data pointer\nmust be reloaded in the while loop
  in vcs_write() after console_lock() to\navoid a UAF when vcs_size() is called.\n\
  \nSyzkaller reported a UAF in vcs_size().\n\nBUG: KASAN: slab-use-after-free in
  vcs_size (drivers/tty/vt/vc_screen.c:215)\nRead of size 4 at addr ffff8880beab89a8
  by task repro_vcs_size/4119\n\nCall Trace:\n <TASK>\n__asan_report_load4_noabort
  (mm/kasan/report_generic.c:380)\nvcs_size (drivers/tty/vt/vc_screen.c:215)\nvcs_write
  (drivers/tty/vt/vc_screen.c:664)\nvfs_write (fs/read_write.c:582 fs/read_write.c:564)\n\
  ...\n <TASK>\n\nAllocated by task 1213:\nkmalloc_trace (mm/slab_common.c:1064)\n\
  vc_allocate (./include/linux/slab.h:559 ./include/linux/slab.h:680\n    drivers/tty/vt/vt.c:1078
  drivers/tty/vt/vt"
