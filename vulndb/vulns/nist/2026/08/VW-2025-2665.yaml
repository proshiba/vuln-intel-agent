title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/gem:
  add missing boundary check in vm_access\n\nA missing bounds check in vm_access()
  can lead to an out-of-bounds read\nor write in the adjacent memory area, since the
  len attribute is not\nvalidated before the memcpy later in the function, potentially
  hitting:\n\n[  183.637831] BUG: unable to handle page fault for address: ffffc90000c86000\n\
  [  183.637934] #PF: supervisor read access in kernel mode\n[  183.637997] #PF: error_code(0x0000)
  - not-present page\n[  183.638059] PGD 100000067 P4D 100000067 PUD 100258067 PMD
  106341067 PTE 0\n[  183.638144] Oops: 0000 [#2] PREEMPT SMP NOPTI\n[  183.638201]
  CPU: 3 PID: 1790 Comm: poc Tainted: G      D           5.17.0-rc6-ci-drm-11296+
  #1\n[  183.638298] Hardware name: Intel Corporation CoffeeLake Client Platform/CoffeeLake
  H DDR4 RVP, BIOS CNLSFWR1.R00.X208.B00.1905301319 05/30/2019\n[  183.638430] RIP:
  0010:memcpy_erms+0x6/0x10\n[  183.640213] RSP: 0018:ffffc90001763d48 EFLAGS: 0"
