title: An SQL injection vulnerability in Friendica through the 2026.08-dev 
  branch allows unauthenticated remote attackers to execute arbitrary SQL 
  statements via the photo-view order parameter. The parameter is concatenated 
  unescaped into a SHOW COLUMNS query via a bare PDO::query() call, enabling 
  stacked statement injection. An unauthenticated attacker can read, modify, or 
  delete the entire database.
