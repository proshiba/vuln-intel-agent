title: Akaunting's shared download route 
  (app/Http/Controllers/Common/Uploads.php::download, reachable at 
  uploads/{id}/download behind only generic auth middleware) fetched the 
  requested Media record by ID with no verification that it belonged to the 
  requesting portal customer's own company, allowing any authenticated portal 
  customer to download any other company's uploaded files by guessing or 
  enumerating media IDs.
