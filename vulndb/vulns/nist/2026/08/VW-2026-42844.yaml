title: Kestra is an open-source, event-driven orchestration platform. Prior to 
  2.0.0-rc6, Kestra's 
  worker/src/main/java/io/kestra/worker/endpoint/WorkerEndpoint.java serves GET 
  /worker without authentication and serializes the complete live Task object, 
  which can expose commands, environment variables, HTTP headers, connection 
  details, plaintext credentials, and execution identifiers while the main API 
  on port 8080 remains protected. This issue is fixed in 2.0.0-rc6.
