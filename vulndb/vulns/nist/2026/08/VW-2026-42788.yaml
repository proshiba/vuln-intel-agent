title: The GeoDirectory – WP Business Directory Plugin and Classified Listings 
  Directory plugin for WordPress is vulnerable to arbitrary file deletion due to
  insufficient file path validation in the delete_revision function in all 
  versions up to, and including, 2.8.169. This makes it possible for 
  authenticated attackers, with subscriber-level access and above, to delete 
  arbitrary files on the server, which can easily lead to remote code execution 
  when the right file is deleted (such as wp-config.php). By placing 
  post_type=attachment exclusively in the query string to bypass the consistency
  check, an attacker can convert an auto-draft GeoDirectory listing into a 
  WordPress attachment with attacker-controlled file paths injected into 
  attachment metadata, which the delete_revision handler then dereferences and 
  unlinks without any post-type or path validation.
