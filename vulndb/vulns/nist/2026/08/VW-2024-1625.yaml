title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  ufs: core: Improve SCSI abort handling\n\nThe following has been observed on a test
  setup:\n\nWARNING: CPU: 4 PID: 250 at drivers/scsi/ufs/ufshcd.c:2737 ufshcd_queuecommand+0x468/0x65c\n\
  Call trace:\n ufshcd_queuecommand+0x468/0x65c\n scsi_send_eh_cmnd+0x224/0x6a0\n\
  \ scsi_eh_test_devices+0x248/0x418\n scsi_eh_ready_devs+0xc34/0xe58\n scsi_error_handler+0x204/0x80c\n\
  \ kthread+0x150/0x1b4\n ret_from_fork+0x10/0x30\n\nThat warning is triggered by
  the following statement:\n\n\tWARN_ON(lrbp->cmd);\n\nFix this warning by clearing
  lrbp->cmd from the abort handler."
