title: SiYuan versions before v3.7.3 contain an information disclosure 
  vulnerability in the getHeadingDeleteTransaction, getHeadingLevelTransaction, 
  and getHeadingInsertTransaction endpoints that return rendered block DOM 
  without publish-access checks. Anonymous readers or publish RoleReader tokens 
  can supply a heading block ID to read full rendered content of 
  publish-disabled documents that should be restricted.
