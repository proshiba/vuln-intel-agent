title: Odysseus before commit 87babb5 contains a server-side request forgery 
  vulnerability that allows admin-privileged attackers to direct the server to 
  probe internal network resources by supplying arbitrary URLs to the embedding 
  endpoint configuration without scheme, host, IP range, or DNS rebind 
  validation. Attackers can submit loopback addresses, RFC 1918 ranges, or 
  link-local addresses through the embedding endpoint API to partially read 
  responses from cloud instance metadata services, internal APIs, and other 
  hosts reachable from the server.
