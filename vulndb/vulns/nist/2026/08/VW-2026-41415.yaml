title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  atm: ueagle-atm: reject descriptors that confuse probe and disconnect\n\nuea_probe()
  distinguishes a pre-firmware device from a post-firmware one\nusing the USB id (UEA_IS_PREFIRM()),
  and stores a different object as the\ninterface data in each case: a 'struct completion'
  for a pre-firmware\ndevice (to be waited on in .disconnect()), or a 'struct usbatm_data'
  for a\npost-firmware one.\n\nuea_disconnect() instead tells the two apart by the
  number of interfaces\nof the active configuration (a pre-firmware device exposes
  a single\ninterface, ADI930 has 2 and eagle has 3), and casts the interface data\n\
  accordingly.\n\nBecause the two handlers use different criteria, a crafted device
  that\nadvertises a pre-firmware id together with a multi-interface descriptor\n\
  (or a post-firmware id with a single interface) makes them disagree: the\nsmall
  'struct completion' stored by uea_probe() is then passed to\nusbatm_usb_disconnect(),
  which cast"
