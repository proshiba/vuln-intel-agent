title: A weakness has been identified in Systerel S2OPC up to 1.7.3. This 
  affects the function LockedStaMac_ProcessMsg_DeleteMonitoredItemsResponse of 
  the file src/ClientServer/frontend/client_wrapper/internal/state_machine.c of 
  the component DeleteMonitoredItemsRequest Handler. This manipulation causes 
  out-of-bounds read. The attack can only be executed locally. The exploit has 
  been made available to the public and could be used for attacks. The vendor 
  was contacted early about this disclosure but did not respond in any way.
