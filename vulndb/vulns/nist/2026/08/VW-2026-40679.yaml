title: A vulnerability was detected in WonderTrader up to 0.9.9. Impacted is the
  function TraderDD::queryTrades of the file src/TraderDD/TraderDD.cpp. The 
  manipulation of the argument FID_JYLB results in enforcement of behavioral 
  workflow. The attack can be launched remotely. A high complexity level is 
  associated with this attack. The exploitability is considered difficult. The 
  exploit is now public and may be used. The vendor was contacted early about 
  this disclosure but did not respond in any way.
