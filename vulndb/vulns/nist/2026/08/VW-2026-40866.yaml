title: "CTI-Transmute contains a stored cross-site scripting vulnerability caused
  by insufficient neutralization of Vue template expression delimiters in server-rendered
  user-controlled data.\n\nAn unauthenticated attacker can create a public conversion
  whose name or description contains a malicious Vue expression using the application's
  configured [[ ... ]] delimiters. User profile names may provide an additional injection
  vector. Although Jinja HTML escaping is applied, the resulting value is subsequently
  included in a DOM region compiled by Vue.\n\nVue interprets the attacker-controlled
  value as a template expression rather than ordinary text. By accessing the JavaScript
  Function constructor from within the expression, an attacker can execute arbitrary
  JavaScript in the security context of the CTI-Transmute origin. The application's
  nonce-based Content Security Policy does not prevent exploitation because the Vue
  runtime compiler requires the unsafe-eval policy exception.\n\nThe malicious payload"
