title: Documize Community's attachment download route 
  (domain/attachment/endpoint.go, Download function, registered via AddPublic 
  with no auth middleware) accepts a `secure` query parameter and grants access 
  whenever the parameter is simply non-empty (len(secureToken) > 0), without 
  comparing it to any server-stored value. Any non-empty string, such as 
  ?secure=x, bypasses authentication entirely and allows downloading any 
  organization's attachments. Sibling handlers in the same file (togglePublish, 
  delete) correctly enforce session-based authorization, confirming this is an 
  inconsistency rather than intended design.
