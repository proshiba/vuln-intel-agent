title: The Optimole – Optimize Images | Convert WebP & AVIF | CDN & Lazy Load | 
  Image Optimization plugin for WordPress is vulnerable to Stored Cross-Site 
  Scripting via the 'a' (above_fold_images) parameter in all versions up to, and
  including, 4.2.10 due to insufficient input sanitization and output escaping. 
  This makes it possible for unauthenticated attackers to inject arbitrary web 
  scripts in pages that will execute whenever a user accesses an injected page.
