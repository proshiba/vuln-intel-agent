title: Deskflow is a keyboard and mouse sharing app. From 1.17.0 until 
  continuous build 1.26.0.296, a malicious Deskflow server can send an 
  odd-length DSOP vector to ServerProxy::setOptions() in 
  src/lib/client/ServerProxy.cpp, causing the missing value after the final 
  option key to be read beyond the vector during the 
  PacketStreamFilter::filterEvent to ServerProxy::handleData() to 
  ServerProxy::parseHandshakeMessage() call chain and crash the connected 
  client. This issue is fixed in continuous build 1.26.0.296.
