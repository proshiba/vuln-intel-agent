title: 'In Eclipse Theia versions up to and including 1.73.1, the `@theia/filesystem`
  backend binds `POST /file-upload` in every filesystem-enabled deployment. The handler
  takes an attacker-supplied absolute path from the multipart `uri` field and calls
  `fs.move(tmp, target, { overwrite: true })` with no workspace confinement and no
  authentication. In browser (non-Electron) deployments the connection token is enforced
  only on WebSocket upgrades; the HTTP middleware in `@theia/core` re-issues the cookie
  and calls `next()` without rejecting tokenless HTTP requests. Because `multipart/form-data`
  is a CORS-safelisted request type, a cross-origin web page can trigger the write
  with no preflight and no credentials, resulting in an unauthenticated arbitrary
  file write outside the workspace to any absolute path the backend process can write.
  This can escalate to remote code execution, for example by overwriting a startup-executed
  file such as `~/.bashrc`. Electron mode uses a separate `ElectronSecurit'
