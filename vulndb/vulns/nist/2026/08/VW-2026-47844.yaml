title: "Parallels RAS Client RDP Backend Service Exposed Dangerous Function Local
  Privilege Escalation Vulnerability. This vulnerability allows local attackers to
  escalate privileges on affected installations of Parallels RAS Client. An attacker
  must first obtain the ability to execute low-privileged code on the target system
  in order to exploit this vulnerability.\n\nThe specific flaw exists within the RAS
  RDP Backend Service. The issue results from an exposed dangerous function. An attacker
  can leverage this vulnerability to escalate privileges and execute arbitrary code
  in the context of SYSTEM. Was ZDI-CAN-29220."
