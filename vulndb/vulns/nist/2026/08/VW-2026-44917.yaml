title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbinfmt_misc:
  don't let an 'F' entry pin its own instance\n\nAn entry registered with 'F' opens
  its interpreter at registration time\nand holds that file until the entry is freed.
  Any entry nobody removes\nby hand only gets closed once the binfmt_misc superblock
  is shut down.\nIf the interpreter lives on a mount that keeps that superblock alive
  the\ntwo pin each other:\n\n    binfmt_misc sb -> inode -> entry -> interp_file
  -> vfsmount -> binfmt_misc sb\n\nTL;DR the file is never closed. Once the mount
  namespace is gone there\nis nothing left to unregister through either.\n\nThere
  are two ways to trigger this bug:\n\n- Point the interpreter at the instance itself.
  Its files are regular\n  files owned by the mounter and both bm_get_inode() and\n\
  \  simple_fill_super() leave i_op at empty_iops. So notify_change() falls\n  back
  to simple_setattr() and chmod +x works. We never set SB_I_NOEXEC\n  and so open_exec()
