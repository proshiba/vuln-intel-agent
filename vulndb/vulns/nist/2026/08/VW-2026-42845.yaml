title: Kestra is an open-source, event-driven orchestration platform. Prior to 
  2.0.0, Kestra's 
  core/src/main/java/io/kestra/core/runners/pebble/functions/HttpFunction.java 
  passes the user-controlled http() uri argument to URI.create() and the 
  server-side HTTP client without restricting private, loopback, or link-local 
  destinations, allowing an unauthenticated attacker to import and execute a 
  flow that accesses internal services or cloud metadata.
