title: "RansomLook contains an authorization weakness in the web-based configuration
  editor exposed through the /admin/config endpoint. The endpoint requires an authenticated
  session but does not perform an explicit privilege or administrator authorization
  check before allowing access to configuration-management functionality.\n\nAn authenticated
  low-privileged user able to access the endpoint can submit crafted configuration
  values that are written directly to the application's config/generic.json file.
  The affected functionality permits modification of configuration sections including
  notification, LDAP, SMTP, and general application settings. Successful exploitation
  could therefore allow an attacker to alter security-sensitive application behavior,
  redirect integrations or notifications, modify authentication-related configuration,
  disrupt external services, or render the RansomLook installation unavailable.\n\n\
