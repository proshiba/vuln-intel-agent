title: Ech0 before 4.4.3 lacks authorization checks on system log endpoints 
  allowing any authenticated non-admin user to read and stream all server logs. 
  Attackers can access historical logs and real-time log streams via GET 
  /api/system/logs, GET /api/system/logs/stream, and WS /ws/system/logs to 
  gather reconnaissance data including internal file paths, error stack traces, 
  and application state.
