title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Inject SEA if guest VNCR isn't normal memory\n\nWhen constructing an
  L1 VNCR mapping, KVM unconditionally uses cacheable\nmemory attributes, even if
  the underlying PFN isn't memory. This gets\nparticularly hairy if the endpoint doesn't
  support cacheable memory\nattributes, potentially throwing an SError on writeback...\n\
  \nWhile KVM does permit cacheable memory attributes on certain PFNMAP\nVMAs, kvm_translate_vncr()
  isn't currently grabbing the VMA. So do the\nsimpler thing for now and just reject
  everything that isn't memory."
