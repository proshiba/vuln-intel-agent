title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  fix NAPI leak in XDP enable error path\n\nDuring XDP enablement in veth, if xdp_rxq_info_reg()
  or\nxdp_rxq_info_reg_mem_model() fails, the driver rolls back the changes.\n\nHowever,
  the rollback loop:\n\tfor (i--; i >= start; i--) {\n\ndecrements the loop index
  'i' before the first iteration. This\ncorrectly skips unregistering the rxq for
  the failed index 'i' (as\nregistration failed or was already cleaned up), but it
  also\nerroneously skips calling netif_napi_deli() for rq[i].xdp_napi.\n\nSince netif_napi_add()
  was already called for index 'i', this leaves\na dangling napi_struct in the device's
  napi_list. When the veth\ndevice is later destroyed, the freed queue memory (which
  contains the\nleaked NAPI structure) can be reused.\n\nThe subsequent device teardown
  iterates the NAPI list and\ncorrupts the reallocated memory, leading to UAF.\n\n\
  Fix this by explicitly deleting the NAPI association for the failed\nindex 'i' before
  rolling "
