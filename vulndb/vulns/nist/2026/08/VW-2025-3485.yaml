title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  svm range restore work deadlock when process exit\n\nkfd_process_notifier_release
  flush svm_range_restore_work\nwhich calls svm_range_list_lock_and_flush_work to
  flush deferred_list\nwork, but if deferred_list work mmput release the last user,
  it will\ncall exit_mmap -> notifier_release, it is deadlock with below backtrace.\n\
  \nMove flush svm_range_restore_work to kfd_process_wq_release to avoid\ndeadlock.
  Then svm_range_restore_work take task->mm ref to avoid mm is\ngone while validating
  and mapping ranges to GPU.\n\nWorkqueue: events svm_range_deferred_list_work [amdgpu]\n\
  Call Trace:\n wait_for_completion+0x94/0x100\n __flush_work+0x12a/0x1e0\n __cancel_work_timer+0x10e/0x190\n\
  \ cancel_delayed_work_sync+0x13/0x20\n kfd_process_notifier_release+0x98/0x2a0 [amdgpu]\n\
  \ __mmu_notifier_release+0x74/0x1f0\n exit_mmap+0x170/0x200\n mmput+0x5d/0x130\n\
  \ svm_range_deferred_list_work+0x104/0x230 [amdgpu]\n process_one_work+0x220/0x3c0"
