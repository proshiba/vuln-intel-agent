title: "Cleartext Storage of Sensitive Information vulnerability in ash-project ash_paper_trail
  allows an attacker with read access to the generated version resource to recover
  sensitive values nested inside embedded resources, unions, or lists.\n\nsensitive_attributes
  :redact and :ignore only act on the tracked resource's top-level attributes. maybe_redact_changes/3
  and the stored-action-input path in AshPaperTrail.Resource.Changes.CreateNewVersion
  derive the sensitive set from the resource's own attributes and never descend into
  embedded, union, or list values, so a non-sensitive attribute or action argument
  that holds an embed with a sensitive? field (for example an accepted credentials
  embed carrying a token) is written to the version table in cleartext.\n\nThis issue
  affects ash_paper_trail: from 0.3.0 before 0.7.0."
