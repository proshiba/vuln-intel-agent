title: libcrux-ecdh and libcrux-ed25519 before 0.0.6, and libcrux-psq before 
  0.0.7, contain cryptographic implementation bugs. libcrux-ecdh did not 
  properly check length and clamping during X25519 secret validation (and had a 
  broken clamping check for imported X25519 secret keys); libcrux-ed25519 
  performed a duplicated clamping step during key generation; and libcrux-psq 
  panicked instead of propagating an AEADError. These were fixed in the 
  respective patched releases.
