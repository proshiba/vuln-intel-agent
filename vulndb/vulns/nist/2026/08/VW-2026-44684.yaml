title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_codel: Do not call qdisc_tree_reduce_backlog during peek before restoring qlen\n\
  \nWhenever codel drops packets during peek, it calls\nqdisc_tree_reduce_backlog.
  An issue arises because it calls\nqdisc_tree_reduce_backlog before it reincrements
  the qlen. If qlen drops\nto zero, but peek returns an skb, the parent's qlen_notify
  callback will\nbe executed even though codel still has 1 packet on the queue and,
  thus,\nwill mistakenly deactivate the parent's class causing issues like a wild\n\
  memory access when qfq has codel as a child:\n\n[   36.339843][  T370] Oops: general
  protection fault, probably for non-canonical address 0xfbd59c0000000024: 0000 [#1]
  SMP KASAN NOPTI\n[   36.340408][  T370] KASAN: maybe wild-memory-access in range
  [0xdead000000000120-0xdead000000000127]\n[   36.340737][  T370] CPU: 2 UID: 0 PID:
  370 Comm: tc Not tainted 7.1.0-rc5-00287-g66e13b626592 #87 PREEMPT(full)\n[   36.341113][\
  \  T370] Hardware "
