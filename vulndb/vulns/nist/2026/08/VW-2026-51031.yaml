title: The get-html-skeleton tool fetched a URL the caller supplied after 
  checking only its syntax. The handler in src/tools/common/get_html_skeleton.ts
  validated the url argument with isValidHttpUrl from src/utils/generic.ts, 
  which confirmed the string began with an http or https scheme and parsed as a 
  URL and inspected neither the host name nor the address it resolves to. 
  Loopback, link-local and private ranges therefore passed, including the 
  address cloud providers use to serve instance metadata. The unchecked URL was 
  handed to the web-browser actor and the fetched document was returned in the 
  tool response, so any caller of the MCP server could make it request an 
  endpoint reachable only from the host and read the result, including instance 
  credentials. Version 0.9.12 removes the tool.
