title: openssl_encrypt before 1.4.9 fails to re-derive and validate fingerprints
  when loading identities from identity.json, allowing attackers to substitute 
  public keys in identity stores. Attackers can replace legitimate public keys 
  with their own while maintaining the claimed fingerprint, enabling silent key 
  substitution where encryption uses attacker keys and signature verification 
  appears valid.
