title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  message: mptlan: Fix use after free bug in mptlan_remove() due to race condition\n\
  \nmptlan_probe() calls mpt_register_lan_device() which initializes the\n&priv->post_buckets_task
  workqueue. A call to\nmpt_lan_wake_post_buckets_task() will subsequently start the
  work.\n\nDuring driver unload in mptlan_remove() the following race may occur:\n\
  \nCPU0                  CPU1\n\n                    |mpt_lan_post_receive_buckets_work()\n\
  mptlan_remove()     |\n  free_netdev()     |\n    kfree(dev);     |\n          \
  \          |\n                    | dev->mtu\n                    |   //use\n\n\
  Fix this by finishing the work prior to cleaning up in mptlan_remove().\n\n[mkp:
  we really should remove mptlan instead of attempting to fix it]"
