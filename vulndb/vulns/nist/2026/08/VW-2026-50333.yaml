title: An issue was discovered in LibreNMS 1.65. A remote authenticated attacker
  with normal privileges can extract all the information from the LibreNMS 
  database via a SQL injection in the sort parameter in the /ajax_table.php API 
  endpoint. This affects address-search.inc.php, alertlog.inc.php, 
  arp-search.inc.php, as-selection.inc.php, bills.inc.php, device_mibs.inc.php, 
  device_oids.inc.php, edit-ports.inc.php, eventlog.inc.php, inventory.inc.php, 
  ix-list.inc.php, ix-peers.inc.php, mempool-edit.inc.php, mempool.inc.php, 
  mibs.inc.php, poll-log.inc.php, processor-edit.inc.php, processor.inc.php, 
  routing-edit.inc.php, sensors-common.inc.php, storage-edit.inc.php, 
  storage.inc.php, tnmsneinfo.inc.php, and toner.inc.php (in 
  includes/html/table).
