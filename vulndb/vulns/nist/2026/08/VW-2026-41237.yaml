title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuserfaultfd:
  prevent registration of special VMAs\n\nVova Tokarev says:\n\n  userfaultfd allows
  registration on shadow stack VMAs.  With userfaultfd\n  access, you can register
  on the shadow stack, discard a page ... and\n  inject a page with chosen return
  addresses via UFFDIO_COPY.\n\nUpdate vma_can_userfault() to reject VM_SHADOW_STACK.\n\
  \nWhile on it, also reject VM_SPECIAL so that if a driver would implement\nvm_uffd_ops,
  it wouldn't be possible to register special VMAs with\nuserfaultfd.\n\nSince VM_SPECIAL
  includes VM_DONTEXPAND which is set but hugetlb, exclude\nhugetlb VMAs from the
  check for VM_SPECIAL."
