title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: convert pmsr_free_wk to wiphy_work to fix deadlock\n\nWhen a netlink socket
  that owns a PMSR session is closed,\ncfg80211_release_pmsr() clears the request's
  nl_portid and queues\npmsr_free_wk to call cfg80211_pmsr_process_abort() asynchronously.\n\
  \nIf the interface tears down concurrently, cfg80211_pmsr_wdev_down()\nis called
  under wiphy_lock and calls cancel_work_sync(&pmsr_free_wk)\nto wait for any running
  work. The work function acquires wiphy_lock\nvia guard(wiphy) before calling process_abort.\n\
  \nThis is a deadlock: wdev_down holds wiphy_lock and blocks inside\ncancel_work_sync();
  pmsr_free_wk blocks trying to acquire that same\nwiphy_lock. Neither thread can
  proceed.\n\nThe same deadlock is reachable from cfg80211_leave_locked(), which\n\
  calls cfg80211_pmsr_wdev_down() for all interface types under\nwiphy_lock.\n\nFix
  this by converting pmsr_free_wk from a plain work_struct to a\nwiphy_work. The wiphy_work
  dispatche"
