title: The LiteSpeed Cache plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via Comment Content in all versions up to, and including,
  7.8.1 due to insufficient input sanitization and output escaping. This makes 
  it possible for unauthenticated attackers to inject arbitrary web scripts in 
  pages that will execute whenever a user accesses an injected page. A comment 
  payload crafted exclusively from decimal numeric character references (e.g. 
  &#34;, &#60;, &#62;) placed inside an allowed element such as &lt;code&gt; 
  bypasses WordPress's wp_kses sanitization, as kses does not treat a 
  data-settings="..." substring within text content as an HTML attribute, 
  allowing the malicious payload to reach the vulnerable function. For this to 
  be exploitable, the site must allow users with previously approved comments to
  write new comments, and the require_name_email setting must be disabled.
