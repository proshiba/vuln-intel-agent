title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  check smcd_v2_ext_offset when receiving proposal msg\n\nWhen receiving proposal
  msg in server, the field smcd_v2_ext_offset in\nproposal msg is from the remote
  client and can not be fully trusted.\nOnce the value of smcd_v2_ext_offset exceed
  the max value, there has\nthe chance to access wrong address, and crash may happen.\n\
  \nThis patch checks the value of smcd_v2_ext_offset before using it."
