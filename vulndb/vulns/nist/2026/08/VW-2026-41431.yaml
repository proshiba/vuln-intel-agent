title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (corsair-cpro) Stop device IO before calling hid_hw_stop\n\nCalling hid_hw_stop()
  does not stop the device IO.\nThis results in a race condition between hid_input_report()
  and the point\nimmediately following the execution of hid_device_io_start() within\n\
  the driver probe function. If the probe operation fails after \"io start\"\nhas
  been initiated, this race condition will result in a UAF vulnerability.\n\nFix the
  problem by calling hid_device_io_stop() before calling\nhid_hw_stop()."
