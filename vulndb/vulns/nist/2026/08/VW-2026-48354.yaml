title: Paperclip before 0.3.1 in default local_trusted mode fails to validate 
  Host headers, allowing attackers to execute arbitrary commands via DNS 
  rebinding. An attacker can craft a malicious webpage that, when visited by a 
  developer running Paperclip locally, uses DNS rebinding to make authenticated 
  API requests and execute commands through the process adapter.
