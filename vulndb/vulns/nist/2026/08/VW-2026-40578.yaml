title: "The Webbox of TeamDavid by Tobit Laboratories AG constructs redirect URLs
  using user-supplied input, \nwhich is appended to the redirect target in a 302 HTTP
  response. By \nusing URL-encoded characters such as “%2e” (representing a dot),
  an \nattacker can manipulate the portion of the URL following the top-level \ndomain
  (TLD). If a similar, registerable TLD exists (for example, if \n“.com” is the application’s
  domain, and “.company” is available for \nregistration), an attacker can craft a
  URL to redirect users to a \nmalicious “.company” domain. By using URL-encoded line
  feeds, it becomes\n possible to insert arbitrary response headers in the server's
  HTTP \nresponse.\n\n\n\nThis issue affects TeamDavid through Rollout 524."
