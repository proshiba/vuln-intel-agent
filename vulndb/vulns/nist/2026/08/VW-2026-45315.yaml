title: UpTrain is an open-source platform to evaluate and improve generative AI 
  applications. In version 0.7.1 and prior, the `/new_run` endpoint is 
  vulnerable to remote code execution via the `checks` and `metadata` 
  parameters. Any user that has access to UpTrain and a valid authentication 
  method may be able to execute arbitrary code in the context of the host 
  running UpTrain, which in most cases will be the docker container as suggested
  by the documentation. As of time of publication, no known patch is available.
