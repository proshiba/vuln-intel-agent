title: A flaw was found in file-roller. When opening or extracting a malicious 
  7z or RAR archive containing a file entry with an excessively long path, 
  file-roller's progress-line parsing copies the path into a fixed-size stack 
  buffer using an unbounded string copy. This can trigger a stack buffer 
  overflow and cause file-roller to terminate, resulting in a denial of service.
  To exploit this flaw, a victim must open or extract the crafted archive using 
  file-roller.
