  when processing SOAP action requests. A specially crafted SOAP action request containing
  unexpected XML content may cause the UPnP daemon to terminate unexpectedly.\n\n\n\
  \n\n\n\n\nSuccessful exploitation may result in a denial-of-service condition affecting
