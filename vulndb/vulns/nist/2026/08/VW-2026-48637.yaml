title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  fix skb length accounting after XDP frag adjustment\n\nveth exposes non-linear skb
  fragments through an xdp_buff. If an XDP\nprogram adjusts the fragment area, veth_xdp_rcv_skb()
  copies\nxdp_frags_size back to skb->data_len but leaves skb->len containing the\n\
  old fragment contribution.\n\nAfter a fragment shrink, this makes skb_headlen()
  larger than the actual\nlinear area. In the reproduced UDP receive path, __skb_datagram_iter()\n\
  copied 1024 bytes past the actual linear tail to userspace, starting at\nstruct
  skb_shared_info. The copied bytes included the affected skb's\nnr_frags, xdp_frags_size,
  and a kernel pointer from\nskb_shinfo(skb)->frags[0]. Real packet data was displaced
  by the same\namount and truncated at the end.\n\nSubtract the old data_len before
  replacing it and add the new data_len\nafterwards, keeping skb->len and skb->data_len
  synchronized.\n\nAdditionally, bpf_xdp_pull_data() can advance data_end while leaving"
