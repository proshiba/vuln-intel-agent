title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/hdcp:
  check streams[] bounds before overflow\n\nThe data->streams[] overflow check is
  done after the buffer overflow has\nalready happened. Move the overflow check before
  the write.\n\nSide note, emitting a warning splat with a backtrace might be overkill\n\
  here, but prefer not changing the behaviour other than not doing the\noverrun.\n\
  \nDiscovered using AI-assisted static analysis confirmed by Intel Product\nSecurity.\n\
  \n(cherry picked from commit 9284ab3b6e776c315883ac2611283d263c9460fd)"
