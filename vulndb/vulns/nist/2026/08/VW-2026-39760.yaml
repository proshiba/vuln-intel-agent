title: rust-iot-platform's AuthToken request-guard implementation 
  (api/src/main.rs) only checks whether the Authorization HTTP header is 
  present, and never validates its value against any session, token store, or 
  signature. Any request carrying an arbitrary non-empty Authorization header 
  (e.g. ) satisfies the guard, granting access to every endpoint protected only 
  by this request guard.
