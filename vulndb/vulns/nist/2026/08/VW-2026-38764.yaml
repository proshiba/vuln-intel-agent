title: "Improper Verification of Cryptographic Signature in ueberauth guardian allows
  an unauthenticated attacker to revoke a victim's session with a forged token.\n\n\
  Guardian.revoke/3 in lib/guardian.ex decodes the supplied token with peek/1, which
  performs no signature verification (it only base64-decodes the JWT header and payload).
  The resulting unverified claims are forwarded directly to the configured token module's
  revoke callback and the implementation's on_revoke callback, a state-mutating sink.
  The sibling operations refresh/2 and exchange/4 both call decode_and_verify first,
  so the signature is checked before anything acts on the claims; revoke/3 is the
  only state-mutating path that acts on claims without verifying the signature.\n\n\
  An attacker who knows or guesses a victim's identifying claim values (jti, sub)
  can forge a JWT carrying those claims, sign it with an arbitrary key, and submit
  it to any endpoint that funnels a caller-supplied token into Guardian.revoke/3 (the
  standard logo"
