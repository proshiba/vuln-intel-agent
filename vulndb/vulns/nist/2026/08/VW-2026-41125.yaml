title: An improper authorization vulnerability in daptin through v0.12.34 allows
  unauthenticated remote attackers to read, create, update, and delete usergroup
  records. The permission check functions (CanRead, CanPeek, CanCreate, 
  CanUpdate, CanDelete, CanRefer) in server/permission/permission.go return true
  whenever p.UserId equals the requesting userId, but fail to reject the 
  null/zero reference — unlike CanExecute, which explicitly guards it.
