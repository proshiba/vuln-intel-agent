  fail early if address range parameters are invalid\n\nThe comment on top of `struct
  damon_region` clearly says that\n\n    For any use case, @ar should be non-zero
  positive size.\n\nwhich is now verified in damon_verify_new_region() if the kernel
  is built\nwith DAMON_DEBUG_SANITY.\n\nThe WARN_ONCE() can be triggered if the mtier
  sample module is enabled\nbefore node{0,1}_{start,end}_addr have been properly initialized,
