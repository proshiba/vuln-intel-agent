title: "In the Linux kernel, the following vulnerability has been resolved:\n\nplatform/x86:
  intel-hid: Protect ACPI notify handler against recursion\n\nSince commit e2ffcda16290
  (\"ACPI: OSL: Allow Notify () handlers to run on\nall CPUs\") ACPI notify handlers
  like the intel-hid notify_handler() may\nrun on multiple CPU cores racing with themselves.\n\
  \nOn convertibles and detachables (matched by DMI chassis-type 31 and 32 in\ndmi_auto_add_switch[])
  the SW_TABLET_MODE input device is registered\nlazily from notify_handler() on the
  first tablet-mode event, via\nintel_hid_switches_setup(). When two such events race
  on different CPUs\nboth can pass the !priv->switches check and register the priv->switches\n\
  input device twice, resulting in a duplicate sysfs entry and a subsequent\nNULL
  pointer dereference.\n\nThis is the same class of bug fixed by commit e075c3b13a0a
  (\"platform/x86:\nintel-vbtn: Protect ACPI notify handler against recursion\") for
  the\nsibling intel-vbtn driver.\n\nProtect intel-hid notify_handler() fro"
