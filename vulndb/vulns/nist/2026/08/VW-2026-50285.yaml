title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  ml-ioh: use raw_spinlock_t for the register lock\n\nioh_irq_type() is registered
  as the irq_chip .irq_set_type callback and\ntakes chip->spinlock with spin_lock_irqsave().\
  \  This callback is reached\nfrom __setup_irq() -> __irq_set_trigger() -> chip->irq_set_type()
  while\nthe caller holds desc->lock, a raw_spinlock_t, with hardirqs disabled.\n\
  That context is not sleepable, but on PREEMPT_RT a regular spinlock_t is\nan rtmutex-backed
  sleeping lock, so acquiring it there is invalid.\nioh_irq_enable() and ioh_irq_disable()
  take the same lock from the\n.irq_enable/.irq_disable callbacks, which are likewise
  invoked with\ndesc->lock held.\n\nConvert the register lock to raw_spinlock_t. \
