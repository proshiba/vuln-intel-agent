title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  sc16is7xx: fix TX fifo corruption\n\nSometimes, when a packet is received on channel
  A at almost the same time\nas a packet is about to be transmitted on channel B,
  we observe with a\nlogic analyzer that the received packet on channel A is transmitted
  on\nchannel B. In other words, the Tx buffer data on channel B is corrupted\nwith
  data from channel A.\n\nThe problem appeared since commit 4409df5866b7 (\"serial:
  sc16is7xx: change\nEFR lock to operate on each channels\"), which changed the EFR
  locking to\noperate on each channel instead of chip-wise.\n\nThis commit has introduced
  a regression, because the EFR lock is used not\nonly to protect the EFR registers
  access, but also, in a very obscure and\nundocumented way, to protect access to
  the data buffer, which is shared by\nthe Tx and Rx handlers, but also by each channel
  of the IC.\n\nFix this regression first by switching to kfifo_out_linear_ptr() in\n\
  sc16is7xx_handle_tx() to e"
