title: "In the Linux kernel, the following vulnerability has been resolved:\n\nliveupdate:
  fix u-a-f in luo_file_unpreserve_files() and luo_file_finish()\n\nIn luo_file_unpreserve_files()
  and luo_file_finish(), reorder\nmodule_put() and xa_erase() to ensure the file handler
  module remains\npinned while its operations are being accessed.\n\nSpecifically,
  luo_get_id() dereferences fh->ops->get_id, so the module\nreference must be held
  until after xa_erase() (which calls luo_get_id)\ncompletes.\n\nFor luo_file_finish(),
  this requires moving the module_put() call out of\nthe luo_file_finish_one() helper
  and into the main loop of\nluo_file_finish() itself."
