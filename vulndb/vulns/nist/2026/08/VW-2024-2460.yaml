title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/guc_submit:
  add missing locking in wedged_fini\n\nAny non-wedged queue can have a zero refcount
  here and can be running\nconcurrently with an async queue destroy, therefore dereferencing
  the\nqueue ptr to check wedge status after the lookup can trigger UAF if\nqueue
  is not wedged.  Fix this by keeping the submission_state lock held\naround the check
  to postpone the free and make the check safe, before\ndropping again around the
  put() to avoid the deadlock.\n\n(cherry picked from commit d28af0b6b9580b9f90c265a7da0315b0ad20bbfd)"
