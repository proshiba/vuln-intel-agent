title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix netfs_create_write_req() to handle async cache object creation\n\nnetfs_create_write_req()
  will skip caching if the fscache cookie is\ndisabled, but this is a problem because
  async cache object creation might\nnot have got far enough yet that has been enabled
  - thereby causing the\ncall to fscache_begin_write_operation() to be skipped.\n\n\
  Fix this by removing the checks on the cookie and delegating this to\nfscache_begin_write_operation()."
