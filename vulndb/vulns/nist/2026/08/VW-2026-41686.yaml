title: "The UpdateHub firmware-update agent's probe handler (z_impl_updatehub_probe()
  in subsys/mgmt/updatehub/updatehub.c) parses the JSON metadata returned by the update
  server into a fixed two-level nested-array struct. After parsing it validates only
  the outer array length (objects_len != 2) and then dereferences objects[1].objects[0].objects.sha256sum
  via strlen() without checking that the inner object array of element [1] is non-empty.\n\
  \nThe metadata is attacker-influenceable network input: the agent fetches it over
  CoAP from the configured UpdateHub server during its routine OTA probe. A malicious
  or compromised update server (or, when DTLS is disabled, a network man-in-the-middle)
  can return a response whose second outer object array is empty. Because the parse
  target is zero-initialised, the corresponding objects[1].objects[0].objects.sha256sum
  pointer is NULL, and the subsequent strlen() dereferences address zero. The same
  defect exists in both the 'any boards' and 'some boards' metad"
