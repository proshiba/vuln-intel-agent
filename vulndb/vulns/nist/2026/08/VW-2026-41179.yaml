title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu/vce:
  fix integer overflow in image size\n\nFix a security vulnerability where malicious
  VCE command streams\nwith oversized dimensions (e.g. 65536×65536) cause 32-bit integer\n\
  overflow, wrapping the calculated buffer size to 0. This bypasses\nvalidation and
  allows GPU firmware to perform out-of-bound memory\naccess.\n\nThe fix uses 64-bit
  arithmetic to detect overflow and rejects\ninvalid dimensions before they reach
  the hardware.\n\nV2: remove redundant check\nV3: modify max height value\nV4: remove
  size64\n\n(cherry picked from commit cbe408dba581755ad1279a487ec786d8927d778d)"
