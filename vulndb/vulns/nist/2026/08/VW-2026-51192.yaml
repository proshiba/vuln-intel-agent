title: A weakness has been identified in RooCodeInc Roo-Code up to 3.51.1. 
  Affected by this issue is the function ExecaTerminalProcess of the component 
  README File Handler. Executing a manipulation can lead to code injection. The 
  attack can be executed remotely. The exploit has been made available to the 
  public and could be used for attacks. Multiple isses were reported to the 
  vendor beforehand. They explain, that "they all apply to Roo Code, a project 
  we no longer support - the repository was archived a while ago, and we don't 
  encourage anyone to use it." This vulnerability only affects products that are
  no longer supported by the maintainer.
