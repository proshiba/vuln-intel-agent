title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmac80211:
  fix use-after-free in CCMP/GCMP RX\n\nWhen PN checking is done in mac80211, for
  fragmentation we need\nto copy the PN to the RX struct so we can later use it to
  do a\ncomparison, since commit bf30ca922a0c (\"mac80211: check defrag\nPN against
  current frame\").\n\nUnfortunately, in that commit I used the 'hdr' variable without\n\
  it being necessarily valid, so use-after-free could occur if it\nwas necessary to
  reallocate (parts of) the frame.\n\nFix this by reloading the variable after the
  code that results\nin the reallocations, if any.\n\nThis fixes https://bugzilla.kernel.org/show_bug.cgi?id=214401."
