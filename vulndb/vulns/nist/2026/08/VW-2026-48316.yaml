title: 'A weakness has been identified in Dolibarr up to 23.0.4. This affects an unknown
  part of the file htdocs/user/card.php of the component Account Handler. This manipulation
  of the argument ID causes improper authorization. The attack may be initiated remotely.
  The exploit has been made available to the public and could be used for attacks.
