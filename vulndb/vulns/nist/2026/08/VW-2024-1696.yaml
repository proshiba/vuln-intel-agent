title: "In the Linux kernel, the following vulnerability has been resolved:\n\nuserfaultfd:
  change src_folio after ensuring it's unpinned in UFFDIO_MOVE\n\nCommit d7a08838ab74
  (\"mm: userfaultfd: fix unexpected change to src_folio\nwhen UFFDIO_MOVE fails\"\
  ) moved the src_folio->{mapping, index} changing to\nafter clearing the page-table
  and ensuring that it's not pinned.  This\navoids failure of swapout+migration and
  possibly memory corruption.\n\nHowever, the commit missed fixing it in the huge-page
  case."
