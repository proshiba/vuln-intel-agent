title: Improper input validation in some firmware for some Intel(R) Active 
  Management Technology (Intel(R) AMT) and some Intel(R) Standard Manageability 
  may allow a denial of service. Network adversary with an unauthenticated user 
  combined with a low complexity attack may enable denial of service. This 
  result may potentially occur via network access when attack requirements are 
  present without special internal knowledge and requires no user interaction. 
  The potential vulnerability may impact the confidentiality (none), integrity 
  (none) and availability (high) of the vulnerable system, resulting in 
  subsequent system confidentiality (none), integrity (none) and availability 
  (none) impacts.
