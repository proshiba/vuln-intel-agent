title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  Avoid using invalid osd indices from primary_temp\n\nA corrupted osdmap received
  from a Ceph monitor or OSD may contain osd\nindices in its pg_temp, primary_temp,
  pg_upmap, and pg_upmap_items parts\nthat don't exist, i.e., that are greater than
  max_osd or smaller than\nCEPH_HOMELESS_OSD (-1). These indices are used to create
  the up and\nacting set in ceph_pg_to_up_acting_osds(), called from calc_target().\n\
  While most of these osd indices are checked, the one from primary_temp\nis not.
  Subsequently, this may lead to calc_target() returning this\n(potentially invalid)
  index as target osd for a (linger) request.\nBecause the osd_state, osd_weight,
  and osd_addr arrays only contain\nmax_osd entries (with indices 0 to max_osd -1),
  this leads to\nout-of-bounds accesses when trying to read values from these arrays.\n\
  \nThis patch fixes the issue by adding a check to get_temp_osds(), so that\nonly
  valid osd indices from primary_temp "
