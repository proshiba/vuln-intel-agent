title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  cfg80211: validate EHT MLE before MLD ID read\n\ncfg80211_gen_new_ie() copies ML
  probe response elements from\nthe parent frame when the parent EHT multi-link element
  has an\nMLD ID matching the nontransmitted BSSID index.\n\nThe code only checked
  that the extension element had more than\none byte before calling ieee80211_mle_get_mld_id().
  That helper\nassumes a BASIC MLE with enough common info and documents that\ncallers
  must first use ieee80211_mle_type_ok().\n\nAttack chain:\nmalicious AP sends a short
  EHT MLE in an MBSSID beacon.\ncfg80211_inform_bss_frame_data() stores the copied
  IE buffer.\ncfg80211_parse_mbssid_data() builds the nontransmitted BSS IE.\ncfg80211_gen_new_ie()
  sees the EHT MLE in the parent frame.\nieee80211_mle_get_mld_id() then reads past
  the IE boundary.\n\nValidate the MLE type and size before reading the MLD ID. This\n\
