title: An unrestricted file upload vulnerability in Cockpit CMS 2.6.0 allows 
  authenticated users to upload files of any extension including PHP scripts via
  the asset upload endpoint. The allowed_uploads configuration defaults to 
  wildcard (*) and uploaded files are stored in a web-accessible directory. An 
  attacker with any authenticated account can upload a PHP webshell and execute 
  arbitrary OS commands on the server.
