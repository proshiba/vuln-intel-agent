title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  libata-core: Fix double free on error\n\nIf e.g. the ata_port_alloc() call in ata_host_alloc()
  fails, we will jump\nto the err_out label, which will call devres_release_group().\n\
  devres_release_group() will trigger a call to ata_host_release().\nata_host_release()
  calls kfree(host), so executing the kfree(host) in\nata_host_alloc() will lead to
  a double free:\n\nkernel BUG at mm/slub.c:553!\nOops: invalid opcode: 0000 [#1]
  PREEMPT SMP NOPTI\nCPU: 11 PID: 599 Comm: (udev-worker) Not tainted 6.10.0-rc5 #47\n\
  Hardware name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.16.3-2.fc40 04/01/2014\n\
  RIP: 0010:kfree+0x2cf/0x2f0\nCode: 5d 41 5e 41 5f 5d e9 80 d6 ff ff 4d 89 f1 41
