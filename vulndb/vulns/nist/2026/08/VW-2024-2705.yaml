title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbnxt_en:
  Fix aggregation ID mask to prevent oops on 5760X chips\n\nThe 5760X (P7) chip's
  HW GRO/LRO interface is very similar to that of\nthe previous generation (5750X
  or P5).  However, the aggregation ID\nfields in the completion structures on P7
  have been redefined from\n16 bits to 12 bits.  The freed up 4 bits are redefined
  for part of the\nmetadata such as the VLAN ID.  The aggregation ID mask was not
  modified\nwhen adding support for P7 chips.  Including the extra 4 bits for the\n\
  aggregation ID can potentially cause the driver to store or fetch the\npacket header
  of GRO/LRO packets in the wrong TPA buffer.  It may hit\nthe BUG() condition in
  __skb_pull() because the SKB contains no valid\npacket header:\n\nkernel BUG at
  include/linux/skbuff.h:2766!\nOops: invalid opcode: 0000 1 PREEMPT SMP NOPTI\nCPU:
  4 UID: 0 PID: 0 Comm: swapper/4 Kdump: loaded Tainted: G           OE      6.12.0-rc2+
  #7\nTainted: [O]=OOT_MODULE, [E]=UNSIGNED"
