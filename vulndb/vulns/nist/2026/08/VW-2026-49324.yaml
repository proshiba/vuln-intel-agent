title: The extension validates the HMAC of a frontend employee edit link only in
  the action that renders the edit form, not in the action that persists the 
  change. An unauthenticated visitor who knows the UID of a visible employee 
  record can send a direct POST request to the update action and overwrite that 
  record without a valid edit link or any ownership check.
