title: Liman is open source server management software. Prior to 2.2.2 - 1103, 
  an OS command injection vulnerability in the log rotation configuration 
  endpoint allows an authenticated administrator to execute arbitrary operating 
  system commands on the Liman server. The `ip_address` parameter is embedded 
  directly into a shell command without sanitization, enabling shell escape via 
  single-quote injection. This is fixed in 2.2.2 - 1103.
