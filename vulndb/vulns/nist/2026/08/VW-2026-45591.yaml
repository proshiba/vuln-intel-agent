title: Onyx is an open-source AI platform. Prior to 3.1.10, 3.2.14, and 4.0.0, 
  Onyx's GET /api/mcp/servers and GET /api/mcp/servers/persona/{persona_id} 
  endpoints expose another user's OAuth Authorization header because 
  OnyxTokenStorage.set_tokens and OnyxTokenStorage.set_client_info in 
  backend/onyx/server/features/mcp/api.py copy per-user tokens into a shared 
  admin MCPConnectionConfig row and _db_mcp_server_to_api_mcp_server returns 
  that row through auth_template.headers to any BASIC_ACCESS user. This issue is
  fixed in versions 3.1.10, 3.2.14, and 4.0.0.
