title: BigBlueButton is an open-source virtual classroom. Prior to 3.0.23, 
  BigBlueButton exposed /bigbluebutton/api/handleJoinExistingUser through 
  bigbluebutton-web/grails-app/controllers/org/bigbluebutton/web/controllers/ApiController.groovy.
  A requester able to supply an existingUserID for an active participant could 
  reuse that participant's session and impersonate the participant in the same 
  meeting because handleJoinExistingUser was a routable controller action rather
  than a private helper. This issue is fixed in version 3.0.23.
