title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Fix RB-tree corruption in probe error path\n\nThe info->node RB-tree member is zero-initialized
  via kzalloc. If\na device does not support ATS, the device_rbtree_insert() call
  is\nskipped. If a subsequent probe step fails, the error path jumps to\ndevice_rbtree_remove(),
  which misinterprets the zeroed node as\na tree root and corrupts the device RB-tree.\n\
  \nFix this by explicitly initializing the RB-node as empty using\nRB_CLEAR_NODE()
  during initialization and guarding the removal with\nRB_EMPTY_NODE()."
