title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost/net:
  complete zerocopy ubufs only once\n\nvhost-net initializes one ubuf_info per outstanding
  zerocopy TX\ndescriptor and hands it to the backend socket.  The networking stack
  may\nthen clone a zerocopy skb before all skb references are released.  For\nexample,
  batman-adv fragmentation reaches skb_split(), which calls\nskb_zerocopy_clone()
  and increments the same ubuf_info refcount.\n\nvhost_zerocopy_complete() currently
  treats every ubuf callback as a\ncompleted vhost descriptor.  It dereferences ubuf->ctx,
  writes the\ndescriptor completion state, and drops the vhost_net_ubuf_ref even when\n\
  the callback only releases a cloned skb reference.  A backend reset can\ntherefore
  wait for and free the vhost_net_ubuf_ref while another cloned\nskb still carries
  the same ubuf_info.  A later completion then\ndereferences the freed ubufs pointer.\n\
  \nKASAN reports the stale completion as:\n\n  BUG: KASAN: slab-use-after-free in
  vhost_zerocopy"
