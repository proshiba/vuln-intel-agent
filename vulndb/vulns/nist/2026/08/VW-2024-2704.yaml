title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: do not defer rule destruction via call_rcu\n\nnf_tables_chain_destroy
  can sleep, it can't be used from call_rcu\ncallbacks.\n\nMoreover, nf_tables_rule_release()
  is only safe for error unwinding,\nwhile transaction mutex is held and the to-be-desroyed
  rule was not\nexposed to either dataplane or dumps, as it deactives+frees without\n\
  the required synchronize_rcu() in-between.\n\nnft_rule_expr_deactivate() callbacks
  will change ->use counters\nof other chains/sets, see e.g. nft_lookup .deactivate
  callback, these\nmust be serialized via transaction mutex.\n\nAlso add a few lockdep
  asserts to make this more explicit.\n\nCalling synchronize_rcu() isn't ideal, but
  fixing this without is hard\nand way more intrusive.  As-is, we can get:\n\nWARNING:
  .. net/netfilter/nf_tables_api.c:5515 nft_set_destroy+0x..\nWorkqueue: events nf_tables_trans_destroy_work\n\
  RIP: 0010:nft_set_destroy+0x3fe/0x5c0\nCall Trace:\n <TASK>\n nf_tables_t"
