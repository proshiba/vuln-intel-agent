title: BISHENG before 2.6.0 contains a remote code execution vulnerability in 
  the workflow run_once endpoint that allows authenticated users to execute 
  arbitrary Python code. Attackers can submit crafted Code node definitions to 
  the POST /api/v1/workflow/run_once endpoint, which executes them with exec() 
  without sandboxing, gaining access to filesystem, credentials, and internal 
  network resources.
