title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/user_events:
  Fix use-after-free in user_event_mm_dup()\n\nuser_event_mm_dup() walks the parent
  mm's enabler list locklessly under\nrcu_read_lock() during fork() (from copy_process());
  it does not take\nevent_mutex:\n\n\trcu_read_lock();\n\tlist_for_each_entry_rcu(enabler,
  &old_mm->enablers, mm_enablers_link)\n\t\tenabler->event = user_event_get(orig->event);\n\
  \nuser_event_enabler_destroy() removes an enabler from that list with\nlist_del_rcu()
  and then, without waiting for a grace period, drops the\nenabler's user_event reference
  with user_event_put() and frees the enabler\nwith kfree(). A reader that loaded
  the enabler before the list_del_rcu()\ncan still be walking it, which leads to two
  use-after-frees:\n\n - kfree(enabler) frees the enabler while that reader dereferences\n\
  \   enabler->event.\n\n - user_event_put() may drop the last reference to the user_event,
