title: A security vulnerability has been detected in yaojingang GEOFlow up to 
  2.1.0. This affects an unknown part of the file 
  app/Http/Controllers/Site/HomeController.php of the component JSON-LD Theme 
  Handler. The manipulation of the argument Search leads to cross site 
  scripting. The attack is possible to be carried out remotely. The exploit has 
  been disclosed publicly and may be used. Upgrading to version 2.1.1 is able to
  mitigate this issue. The identifier of the patch is 
  67abfd864a15d169a78429f3290c91cb3b93e849. Upgrading the affected component is 
  recommended.
