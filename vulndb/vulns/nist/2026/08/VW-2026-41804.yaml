title: SAP BusinessObjects Business Intelligence Platform (Web Intelligence) 
  allows a low-privileged attacker to upload a specially crafted spreadsheet 
  file containing malicious external references. When the file is processed as a
  data source, the affected component resolves these references and exposes the 
  contents of sensitive server-side files within the resulting report. This 
  results in a high impact on confidentiality, with no impact on integrity and 
  availability.
