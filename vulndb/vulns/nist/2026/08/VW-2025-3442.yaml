title: An Expected Behavior Violation [CWE-440] vulnerability in WatchGuard 
  Fireware OS may allow an attacker to bypass the Fireware OS boot time system 
  integrity check and prevent the Firebox from shutting down in the event of a 
  system integrity check failure. The on-demand system integrity check in the 
  Fireware Web UI will correctly show a failed system integrity check message in
  the event of a failure.
