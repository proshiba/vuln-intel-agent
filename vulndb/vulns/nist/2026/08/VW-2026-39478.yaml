title: A weakness has been identified in Ehco1996 django-sspanel up to 
  2023.12.26. This affects the function TicketDetailView of the file 
  apps/sspanel/views.py of the component Support Ticket Handler. Executing a 
  manipulation can lead to authorization bypass. The attack can be executed 
  remotely. The vendor was contacted early about this disclosure but did not 
  respond in any way. This vulnerability only affects products that are no 
  longer supported by the maintainer.
