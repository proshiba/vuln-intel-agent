title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  LAG, MPESW, Fix missing complete() on devcom error\n\nmlx5_mpesw_work() returned
  without calling complete() when\nmlx5_lag_get_devcom_comp() returned NULL. A caller
  that queued the\nwork and waited on mpesww->comp would block indefinitely.\n\nFunnel
  the early-return path through a new \"complete\" label so the\nwaiter is always
  woken."
