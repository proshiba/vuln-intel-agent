title: "The background service of ABP or AES runs as NT AUTHORITY\\SYSTEM and implements
  a file-based inter-process communication (IPC) mechanism protected by AES encryption.
  Because the encryption key file is readable by standard users and protected using
  DPAPI. Any authenticated local user can recover the key and forge valid IPC requests.
  Furthermore, the service does not check the identity of the requesting process and
  validates destination paths using an insufficient substring check. A local attacker
  can submit crafted encrypted requests containing directory traversal sequences to
  perform arbitrary file reads and arbitrary file writes as NT AUTHORITY\\SYSTEM,
  leading to full local privilege escalation.\nAffected products and versions include:
  ABP (ASUSTOR Backup Plan) 2.0.7.10171 and earlier as well as AES (ASUSTOR EZSync)
  1.1.1.3113 and earlier."
