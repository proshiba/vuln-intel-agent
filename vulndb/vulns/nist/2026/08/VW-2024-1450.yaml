title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix race between transaction aborts and fsyncs leading to use-after-free\n\nThere
  is a race between a task aborting a transaction during a commit,\na task doing an
  fsync and the transaction kthread, which leads to an\nuse-after-free of the log
  root tree. When this happens, it results in a\nstack trace like the following:\n\
  \n  BTRFS info (device dm-0): forced readonly\n  BTRFS warning (device dm-0): Skipping
  commit of aborted transaction.\n  BTRFS: error (device dm-0) in cleanup_transaction:1958:
  errno=-5 IO failure\n  BTRFS warning (device dm-0): lost page write due to IO error
  on /dev/mapper/error-test (-5)\n  BTRFS warning (device dm-0): Skipping commit of
  aborted transaction.\n  BTRFS warning (device dm-0): direct IO failed ino 261 rw
  0,0 sector 0xa4e8 len 4096 err no 10\n  BTRFS error (device dm-0): error writing
  primary super block to device 1\n  BTRFS warning (device dm-0): direct IO failed
  ino 261 rw 0,0 sector 0x12e0"
