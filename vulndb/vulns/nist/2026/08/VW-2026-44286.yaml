title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: fix data race on rx_stamp/rx_ifindex in bcm_rx_handler()\n\nFor an rx op subscribed
  on all interfaces (ifindex == 0), the same op\nis registered once in the shared
  per-netns wildcard filter list, so\nbcm_rx_handler() can run concurrently on different
  CPUs for frames\narriving on different net devices.\n\nop->rx_stamp and op->rx_ifindex
  were written before bcm_rx_update_lock was\ntaken, allowing concurrent writers to
  race each other - including a torn\nstore of the 64-bit rx_stamp on 32-bit platforms.\n\
  \nBeyond a torn store bcm_send_to_user() must report the timestamp/ifindex\nof the
  very same frame whose content it is delivering. So the assignment\nis placed in
  the same unbroken bcm_rx_update_lock section as the content\ncomparison.\n\nAs a
  side effect, the RTR-request frame feature (which never reach\nbcm_send_to_user())
  no longer updates rx_stamp/rx_ifindex, since only\nthe notification path needs them."
