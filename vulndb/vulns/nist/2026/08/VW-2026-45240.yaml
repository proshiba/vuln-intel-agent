title: openssl_encrypt versions before 1.4.6 contain a key derivation flaw in 
  sequential XOR composition mode where the last stage cancels out during key 
  generation. When configured with a single KDF and no prior hashing stage, 
  attackers can bypass memory-hard key derivation and perform offline password 
  cracking at SHA-256 speed instead of the configured KDF cost.
