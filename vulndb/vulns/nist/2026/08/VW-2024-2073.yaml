title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/drm_file:
  Fix pid refcounting race\n\n<maarten.lankhorst@linux.intel.com>, Maxime Ripard\n\
  <mripard@kernel.org>, Thomas Zimmermann <tzimmermann@suse.de>\n\nfilp->pid is supposed
  to be a refcounted pointer; however, before this\npatch, drm_file_update_pid() only
  increments the refcount of a struct\npid after storing a pointer to it in filp->pid
  and dropping the\ndev->filelist_mutex, making the following race possible:\n\nprocess
  A               process B\n=========               =========\n                 \
  \       begin drm_file_update_pid\n                        mutex_lock(&dev->filelist_mutex)\n\
  \                        rcu_replace_pointer(filp->pid, <pid B>, 1)\n          \
  \              mutex_unlock(&dev->filelist_mutex)\nbegin drm_file_update_pid\nmutex_lock(&dev->filelist_mutex)\n\
  rcu_replace_pointer(filp->pid, <pid A>, 1)\nmutex_unlock(&dev->filelist_mutex)\n\
  get_pid(<pid A>)\nsynchronize_rcu()\nput_pid(<pid B>)   *** pid B reaches refc"
