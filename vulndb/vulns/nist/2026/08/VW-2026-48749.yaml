title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipvs:
  avoid out-of-bounds write in ip_vs_nat_icmp\n\nSashiko warns that local attacker
  can modify the packet\nwhile it is processed by IPVS. Some places read the\nIP ihl
  field multiple times which can cause out-of-bounds\naccess. One such place is ip_vs_nat_icmp
  where we\ncan write after the validated area.\n\nFix it by providing ciph argument
  just like it is done for\nIPv6 and use ciph->len as offset to the embedded transport\n\
  header.\n\nModify some IPv4 header checks by reading the ihl field\nonly once."
