title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/srpt:
  fix integer overflow in immediate data length check\n\nimm_buf->len is a user-controlled
  uint32_t received from the network.\nAdding it to imm_data_offset without overflow
  checking allows a\nmalicious initiator to send len=0xFFFFFFFF, causing req_size
  to wrap\naround to a small value, bypassing the bounds check, and subsequently\n\
  passing a ~4GB length to sg_init_one().\n\nUse check_add_overflow() to detect wrapping
  before the comparison."
