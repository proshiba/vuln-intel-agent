title: "In the Linux kernel, the following vulnerability has been resolved:\n\npacket:
  use consistent hard_header_len in TX_RING send path\n\ntpacket_snd() reads dev->hard_header_len
  independently for skb\nallocation and header construction in tpacket_fill_skb().
  Concurrent\nnetdevice reconfiguration can therefore make the reserved headroom\n\
  smaller than the amount later pushed, or make copylen - hard_header_len\nnegative.\n\
  \nSnapshot hard_header_len once before processing ring frames and use it\nfor the
  frame limit, headroom allocation, copy length, and skb\nconstruction. Pass the snapshot
  to tpacket_fill_skb().\n\nThe separate SOCK_DGRAM consistency problem between hard_header_len
  and\nheader_ops->create is not addressed here."
