title: Weblate is a web-based continuous localization platform used to manage 
  software translations. In versions prior to 2026.7, an authenticated user with
  access to a project can retrieve the change history of restricted components 
  in that project through nested API change endpoints, even without permission 
  to view those components directly. The nested endpoints do not apply the 
  component-level access checks enforced on the direct component views, so the 
  requester can enumerate changes for components that should be hidden from 
  them. The exposed data can include the restricted component's identity, 
  translation and unit links, and change payload fields such as source or 
  translated string content in the target, old, and details values. This issue 
  is fixed in version 2026.7.
