title: The Manual Image Crop WordPress plugin before 1.15 does not perform any 
  capability check or nonce verification on the authenticated AJAX action that 
  crops attachment images; its only guard passes for any logged-in user. A 
  subscriber-level user can therefore supply an arbitrary attachment ID and 
  overwrite that attachment's generated intermediate-size image (for example its
  thumbnail) and mutate its stored metadata, regardless of who owns the media. 
  This is a cross-user integrity/defacement issue over the Media Library. The 
  action also has no nonce, so it is additionally susceptible to CSRF.
