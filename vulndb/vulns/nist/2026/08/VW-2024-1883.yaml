title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsched/psi:
  Fix use-after-free in ep_remove_wait_queue()\n\nIf a non-root cgroup gets removed
  when there is a thread that registered\ntrigger and is polling on a pressure file
  within the cgroup, the polling\nwaitqueue gets freed in the following path:\n\n\
  \ do_rmdir\n   cgroup_rmdir\n     kernfs_drain_open_files\n       cgroup_file_release\n\
  \         cgroup_pressure_release\n           psi_trigger_destroy\n\nHowever, the
  polling thread still has a reference to the pressure file and\nwill access the freed
  waitqueue when the file is closed or upon exit:\n\n fput\n   ep_eventpoll_release\n\
  \     ep_free\n       ep_remove_wait_queue\n         remove_wait_queue\n\nThis results
  in use-after-free as pasted below.\n\nThe fundamental problem here is that cgroup_file_release()
  (and\nconsequently waitqueue's lifetime) is not tied to the file's real lifetime.\n\
  Using wake_up_pollfree() here might be less than ideal, but it is in line\nwith
  the comment at commit 4"
