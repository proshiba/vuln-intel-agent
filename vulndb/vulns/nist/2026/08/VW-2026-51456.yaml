title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  validate external BO copy bounds for both stride paths\n\nvmw_external_bo_copy()
  trusts caller-supplied offsets, strides, and\nheights and operates on imported dma-buf
  vmaps:\n\n  - The equal-stride memcpy() bound was clamped after subtracting the\n\
  \    offsets from dst_size and src_size; an offset larger than the BO\n    size
  wraps the unsigned subtraction to a huge value and the\n    resulting memcpy() runs
  off the end of the vmap.  dst_stride *\n    height is also a u32 multiplication
  that can overflow.\n  - The non-equal-stride row-by-row path had no bound at all.\
  \  The\n    loop touches bytes through offset + (height - 1) * stride +\n    width_in_bytes,
  with only a WARN_ON(dst_stride < width_in_bytes),\n    and could likewise step past
  the end of either mapping.\n\nThe offsets and strides are derived from STDU/SOU
  plane state, so a\nconfigured CRTC submitting a crafted atomic commit on an imported\n\
  framebuffer can reach"
