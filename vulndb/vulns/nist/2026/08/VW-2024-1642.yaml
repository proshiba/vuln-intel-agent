title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni40e:
  Do not allow untrusted VF to remove administratively set MAC\n\nCurrently when PF
  administratively sets VF's MAC address and the VF\nis put down (VF tries to delete
  all MACs) then the MAC is removed\nfrom MAC filters and primary VF MAC is zeroed.\n\
  \nDo not allow untrusted VF to remove primary MAC when it was set\nadministratively
  by PF.\n\nReproducer:\n1) Create VF\n2) Set VF interface up\n3) Administratively
  set the VF's MAC\n4) Put VF interface down\n\n[root@host ~]# echo 1 > /sys/class/net/enp2s0f0/device/sriov_numvfs\n\
  [root@host ~]# ip link set enp2s0f0v0 up\n[root@host ~]# ip link set enp2s0f0 vf
  0 mac fe:6c:b5:da:c7:7d\n[root@host ~]# ip link show enp2s0f0\n23: enp2s0f0: <BROADCAST,MULTICAST,UP,LOWER_UP>
  mtu 1500 qdisc mq state UP mode DEFAULT group default qlen 1000\n    link/ether
  3c:ec:ef:b7:dd:04 brd ff:ff:ff:ff:ff:ff\n    vf 0     link/ether fe:6c:b5:da:c7:7d
  brd ff:ff:ff:ff:ff:ff, spoof checking on, link-state auto, trus"
