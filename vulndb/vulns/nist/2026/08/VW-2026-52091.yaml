title: A vulnerability was detected in yaojingang GEOFlow up to 2.1.0. This 
  vulnerability affects the function unlink of the file 
  app/Http/Controllers/Admin/ImageLibraryController.php of the component Image 
  Library Cleanup. The manipulation of the argument file_path results in path 
  traversal. The attack may be performed from remote. The exploit is now public 
  and may be used. Upgrading to version 2.1.1 is able to resolve this issue. The
  patch is identified as 67abfd864a15d169a78429f3290c91cb3b93e849. It is 
  recommended to upgrade the affected component.
