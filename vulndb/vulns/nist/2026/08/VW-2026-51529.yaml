title: Budibase versions before 3.41.3 contain a missing authorization 
  vulnerability in the POST /api/resources/duplicate endpoint that allows 
  authenticated builders to inject tables, automations, queries, and screens 
  into any other application without holding any role in the destination 
  workspace. Attackers can inject resources by specifying an arbitrary 
  destination workspace ID in the request body, then trigger injected 
  automations with outgoing webhooks to exfiltrate data from victim 
  applications.
