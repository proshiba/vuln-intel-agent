title: "Tie::Hash::Regex versions before 2.0.0 for Perl will throw an exception on
  unparseable lookup keys.\n\nThe FETCH, EXISTS and DELETE methods throw an exception
  when on malformed regular expressions.\n\nEach method falls back to a regex match
  when the key is not already stored in the hash, compiling the caller's key with
  a bare qr// and no eval guard. A key that is not a valid regular expression pattern,
  such as a single unmatched bracket, dies.\n\nAn application that looks up externally
  supplied strings in a tied hash will die on an invalid key."
