title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  prevent use-after-free due to open_cached_dir error paths\n\nIf open_cached_dir()
  encounters an error parsing the lease from the\nserver, the error handling may race
  with receiving a lease break,\nresulting in open_cached_dir() freeing the cfid while
  the queued work is\npending.\n\nUpdate open_cached_dir() to drop refs rather than
  directly freeing the\ncfid.\n\nHave cached_dir_lease_break(), cfids_laundromat_worker(),
  and\ninvalidate_all_cached_dirs() clear has_lease immediately while still\nholding
  cfids->cfid_list_lock, and then use this to also simplify the\nreference counting
  in cfids_laundromat_worker() and\ninvalidate_all_cached_dirs().\n\nFixes this KASAN
  splat (which manually injects an error and lease break\nin open_cached_dir()):\n\
  \n==================================================================\nBUG: KASAN:
  slab-use-after-free in smb2_cached_lease_break+0x27/0xb0\nRead of size 8 at addr
  ffff88811cc24c10 by task kworker/"
