title: Puwell IP Camera firmware versions 2.x through 4.x contains an 
  unauthenticated command injection vulnerability that allows remote attackers 
  to execute arbitrary operating system commands by sending a crafted JSON 
  payload to the DebugShell interface exposed on TCP port 34567. Attackers can 
  exploit the lack of authentication and input sanitization in the binary 
  protocol service to pass arbitrary commands directly to the underlying 
  operating system, achieving root-level code execution and complete device 
  compromise.
