title: "In the Linux kernel, the following vulnerability has been resolved:\n\nskbuff:
  fix coalescing for page_pool fragment recycling\n\nFix a use-after-free when using
  page_pool with page fragments. We\nencountered this problem during normal RX in
  the hns3 driver:\n\n(1) Initially we have three descriptors in the RX queue. The
  first one\n    allocates PAGE1 through page_pool, and the other two allocate one\n\
  \    half of PAGE2 each. Page references look like this:\n\n                RX_BD1
  _______ PAGE1\n                RX_BD2 _______ PAGE2\n                RX_BD3 _________/\n\
  \n(2) Handle RX on the first descriptor. Allocate SKB1, eventually added\n    to
  the receive queue by tcp_queue_rcv().\n\n(3) Handle RX on the second descriptor.
  Allocate SKB2 and pass it to\n    netif_receive_skb():\n\n    netif_receive_skb(SKB2)\n\
  \      ip_rcv(SKB2)\n        SKB3 = skb_clone(SKB2)\n\n    SKB2 and SKB3 share a
  reference to PAGE2 through\n    skb_shinfo()->dataref. The other ref to PAGE2 is
  still held by\n    RX_BD3:\n\n              "
