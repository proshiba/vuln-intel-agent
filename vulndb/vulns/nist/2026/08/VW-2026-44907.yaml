title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvxlan:
  use pskb_network_may_pull() for transmit path header pulls\n\nIn vxlan_xmit(), arp_reduce(),
  and vxlan_mdb_entry_skb_get(), pskb_may_pull() was\nbeing called to verify the availability
  of network layer headers (ARP, IPv6/ND,\nIP/IPv6 MDB keys).\n\nHowever, during transmit
  skb->data points to the MAC header, so skb_network_offset(skb)\nis ETH_HLEN (14
  bytes). Using pskb_may_pull(skb, len) only checks len bytes from skb->data\nrather
  than skb_network_offset(skb) + len, which can leave part of the network header\n\
  in non-linear frags.\n\nReplace these remaining pskb_may_pull() calls with pskb_network_may_pull()
  to properly\naccount for the MAC header offset."
