title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  atmel-mci: Fix use-after-free in atmci_remove due to race condition\n\nIn atmci_probe,
  &host->bh_work is bound with atmci_work_func, and\natmci_interrupt, atmci_timeout_timer
  and atmci_dma_complete can all\nqueue this work on system_bh_wq.\n\nIf we remove
  the module, atmci_remove makes cleanup and the memory\nallocated for host with devm_kzalloc()
  is released after the remove\ncallback returns, while the work mentioned above may
  still be pending\nor running. The sequence of operations that may lead to a UAF
  bug is\nas follows:\n\nCPU0                                      CPU1\n\n      \
  \                                    | atmci_interrupt\n                       \
  \                   | queue_work(system_bh_wq,\n                               \
  \           |            &host->bh_work)\natmci_remove                         \
  \     |\natmci_cleanup_slot(...)                   |\natmci_writel(host, ATMCI_IDR,
  ~0UL)       |\ntimer_delete_sync(&hos"
