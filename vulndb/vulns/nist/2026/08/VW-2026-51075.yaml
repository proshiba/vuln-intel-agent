title: openssl_encrypt (pip package openssl-encrypt) versions <= 1.4.8 do not 
  redact the keyserver bearer token passed as the positional argument to 
  'keyserver set-token' in the --debug argv dump, because 
  sanitize_argv_for_debug fails to sanitize it. As a result the token is printed
  in cleartext to stderr under --debug (even without --unsafe-show-secrets), 
  persisting the credential in logs and terminal history. Fixed in 1.4.9.
