title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  Fix a use after free in siw_alloc_mr\n\nOur code analyzer reported a UAF.\n\nIn
  siw_alloc_mr(), it calls siw_mr_add_mem(mr,..). In the implementation of\nsiw_mr_add_mem(),
  mem is assigned to mr->mem and then mem is freed via\nkfree(mem) if xa_alloc_cyclic()
  failed. Here, mr->mem still point to a\nfreed object. After, the execution continue
  up to the err_out branch of\nsiw_alloc_mr, and the freed mr->mem is used in siw_mr_drop_mem(mr).\n\
  \nMy patch moves \"mr->mem = mem\" behind the if (xa_alloc_cyclic(..)<0) {}\nsection,
  to avoid the uaf."
