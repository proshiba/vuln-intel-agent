title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  most: video: avoid double free on video register failure\n\ncomp_register_videodev()
  allocates a video_device with\nvideo_device_alloc() and releases it if video_register_device()
  fails.\n\nThis can double free the video_device when __video_register_device()\n\
  reaches device_register() and that call fails:\n\n  video_register_device()\n  \
  \  -> __video_register_device()\n       -> device_register() fails\n          ->
  put_device(&vdev->dev)\n             -> v4l2_device_release()\n                ->
  vdev->release(vdev)\n                   -> video_device_release(vdev)\n\n  comp_register_videodev()\n\
  \    -> video_device_release(mdev->vdev)\n\nUse video_device_release_empty() while
  registering the device so that\nregistration failure paths do not free mdev->vdev
  through vdev->release().\ncomp_register_videodev() then releases mdev->vdev exactly
  once on failure.\nRestore video_device_release() after successful registration so
  the\nregister"
