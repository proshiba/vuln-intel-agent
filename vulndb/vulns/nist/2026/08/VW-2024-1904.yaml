title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/jfs:
  Add validity check for db_maxag and db_agpref\n\nBoth db_maxag and db_agpref are
  used as the index of the\ndb_agfree array, but there is currently no validity check
  for\ndb_maxag and db_agpref, which can lead to errors.\n\nThe following is related
  bug reported by Syzbot:\n\nUBSAN: array-index-out-of-bounds in fs/jfs/jfs_dmap.c:639:20\n\
  index 7936 is out of range for type 'atomic_t[128]'\n\nAdd checking that the values
  of db_maxag and db_agpref are valid\nindexes for the db_agfree array."
