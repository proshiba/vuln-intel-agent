title: SAP Approuter does not enforce cross-site request forgery protection on 
  the authentication flow by default. An unauthenticated attacker could craft a 
  malicious link and trick a victim into following it. Successful exploitation 
  could allow the attacker to bind the victim's session to an 
  attacker-controlled identity, resulting in a low impact on integrity. There is
  no impact on confidentiality and availability.
