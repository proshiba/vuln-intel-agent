title: Renovate versions from 42.68.1 before 42.96.3 (and from 42.68.1 before 
  43.4.4), including corresponding Docker images (renovate/renovate, 
  mend/renovate-ce, renovate-ee-server, renovate-ee-worker >=13.3.0 <13.6.0), 
  fail to restrict environment variables to an allowlist when spawning child 
  processes. As a result, child processes (e.g. npm install, postUpgradeTasks, 
  postUpdateOptions) gain full access to all environment variables of the 
  Renovate process, allowing insider or outside attackers to exfiltrate secrets 
  accessible to the Renovate deployment.
