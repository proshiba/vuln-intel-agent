title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  libertas: fix memory leak in helper_firmware_cb()\n\nhelper_firmware_cb() neglects
  to free the single-stage firmware image\nafter a successful async load, leading
  to a memory leak in the USB\nfirmware-download path.\n\nFix this memory leak by
  calling release_firmware() immediately after\nlbs_fw_loaded() returns.\n\nThe bug
  was first flagged by an experimental analysis tool we are\ndeveloping for kernel
  memory-management bugs while analyzing\nv6.13-rc1. The tool is still under development
  and is not yet publicly\navailable. Manual inspection confirms that the bug is still
  present in\nthe current wireless tree.\n\nAn x86_64 allyesconfig build showed no
  new warnings. As we do not have\ncompatible Libertas USB hardware for exercising
  this firmware-download\npath, no runtime testing was able to be performed."
