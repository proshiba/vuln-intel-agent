title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: fix stale rx/tx ops after device removal\n\nRX: an RX_SETUP update(!) for an
  existing op skipped can_rx_register()\nunconditionally, even when a concurrent NETDEV_UNREGISTER
  had already\ntorn down its registration (op->rx_reg_dev == NULL). This silently\n\
  did not re-enable frame delivery for that updated filter. bcm_rx_setup()\nnow re-registers
  in that case, while leaving rx_ops with ifindex = 0\n(all CAN devices) which never
  carry a tracked rx_reg_dev registered as-is.\n\nTX: bcm_notify() only handled bo->rx_ops
  on NETDEV_UNREGISTER, leaving\ntx_ops with an active cyclic transmission re-arming
  its hrtimer\nindefinitely to execute bcm_tx_timeout_handler(). Cancelling the hrtimer\n\
