title: A missing authentication vulnerability in Chaskiq through commit 46dfdd1 
  allows unauthenticated remote attackers to mint Stripe Billing Portal sessions
  for any tenant via the stripeCustomerPortal GraphQL mutation. The mutation 
  performs no authentication or authorization checks before creating a customer 
  portal session linked to any tenant Stripe account. An attacker can access and
  manage subscription data for any tenant without credentials.
