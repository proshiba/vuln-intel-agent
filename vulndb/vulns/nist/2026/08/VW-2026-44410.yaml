title: "In the Linux kernel, the following vulnerability has been resolved:\n\nleds:
  uleds: Fix potential buffer overread\n\nThe name string supplied by userspace is
  not guaranteed to be\nnull-terminated, so using strchr() on it might result in a
  buffer\noverread. The same thing will happen when said string is used by\nthe LED
  class device.\n\nFix this by using strnchr() instead and explicitly check that\n\
  the name string is properly null-terminated."
