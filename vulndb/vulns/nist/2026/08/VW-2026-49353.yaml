title: A flaw was found in the JWT Bearer authorization grant implementation 
  within the keycloak-services component of Red Hat Build of Keycloak. This 
  component handles various OAuth2 and OpenID Connect grant types used for 
  issuing access tokens. The issue occurs because the JWT Bearer grant fails to 
  check if a client requires user consent before issuing a token. This allows an
  authenticated attacker with valid client credentials and a trusted identity 
  provider assertion to bypass the consent requirement and obtain unauthorized 
  access to a user account at a consent-gated client.
