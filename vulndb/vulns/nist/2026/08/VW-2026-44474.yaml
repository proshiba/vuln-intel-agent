title: "In the Linux kernel, the following vulnerability has been resolved:\n\nVDUSE:
  avoid leaking information to userspace\n\nThe bounceing is not necessarily page
  aligned, so current VDUSE can\nleak kernel information through mapping bounce pages
  to\nuserspace. Allocate bounce pages with __GFP_ZERO to avoid leaking\ninformation
  to userspace."
