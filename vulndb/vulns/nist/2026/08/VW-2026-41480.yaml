title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: defer link RX stats percpu free to RCU\n\nsta_remove_link() frees a removed
  MLO link's RX stats percpu buffer right\naway, but defers only the link container
  to RCU:\n\n\tsta_info_free_link(&alloc->info);\n\tkfree_rcu(alloc, rcu_head);\n\n\
  The RX fast path reads link_sta under rcu_read_lock and writes the percpu\nstats.
  A reader that resolved link_sta before the removal keeps the\npointer. The container
  stays alive from the kfree_rcu, so the read still\nworks. But the percpu block it
  points to is already freed. This needs\nuses_rss. That is when pcpu_rx_stats exists.\n\
  \nThe full STA teardown frees the deflink stats only after\nsynchronize_net(). The
  link removal path had no such barrier. The race is\nhard to win in practice, but
  the free should still wait for RCU.\n\nFree the link together with its data from
  a single RCU callback, so the\npercpu block is reclaimed only after readers drain."
