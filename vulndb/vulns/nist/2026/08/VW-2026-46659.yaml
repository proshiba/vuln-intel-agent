title: 'Vulnerability in the Oracle Hyperion Infrastructure Technology product of
  Oracle Hyperion (component: Installation and Configuration).   The supported version
  that is affected is 11.2.25.0.000. Easily exploitable vulnerability allows high
  privileged attacker with logon to the infrastructure where Oracle Hyperion Infrastructure
  Technology executes to compromise Oracle Hyperion Infrastructure Technology.  Successful
  attacks of this vulnerability can result in  unauthorized update, insert or delete
  access to some of Oracle Hyperion Infrastructure Technology accessible data and
  unauthorized ability to cause a partial denial of service (partial DOS) of Oracle
  Hyperion Infrastructure Technology. CVSS 3.1 Base Score 3.4 (Integrity and Availability
  impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:U/C:N/I:L/A:L).'
