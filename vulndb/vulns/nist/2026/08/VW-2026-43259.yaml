title: A flaw was found in the cluster-curator-controller component. A local 
  user, by creating a ClusterCurator resource with a specific naming convention,
  can trigger the creation of a cluster-scoped ClusterRoleBinding. This allows 
  the user to escalate their privileges from namespace-local access to 
  cluster-wide control. This privilege escalation grants broad permissions, 
  including the ability to access and manipulate secrets, manage cluster 
  actions, and delete hosted clusters or node pools.
