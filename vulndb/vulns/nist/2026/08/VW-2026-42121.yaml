title: SeaweedFS is a distributed storage system. Prior to 4.24, the 
  weed/server/filer_server_handlers.go allowed_prefixes authorization check used
  strings.HasPrefix on raw path strings, so a filer JWT scoped to /tenant1 also 
  authorized sibling paths such as /tenant1234, /tenant1-old, and 
  /tenant1backup, enabling cross-tenant reads and writes with a valid scoped 
  token. This issue is fixed in version 4.24.
