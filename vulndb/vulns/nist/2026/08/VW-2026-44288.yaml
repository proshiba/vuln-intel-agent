title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: extend bcm_tx_lock usage for data and timer updates\n\nStage new CAN frame
  content for an existing tx op into a kmalloc()'d\nbuffer and validate it there,
  mirroring the approach already used in\nbcm_rx_setup(). Only copy the validated
  data into op->frames while\nholding op->bcm_tx_lock, so bcm_can_tx() and bcm_tx_timeout_handler()\n\
  can no longer observe a partially updated or unvalidated frame.\n\nAdd a missing
  error path for memcpy_from_msg() when copying CAN frame\ndata from userspace.\n\n\
  Also move the kt_ival1/kt_ival2/ival1/ival2 updates in bcm_tx_setup()\nunder op->bcm_tx_lock,
  and read kt_ival1/kt_ival2/count under the same\nlock in bcm_tx_set_expiry() and
  bcm_tx_timeout_handler(), closing the\ntorn 64-bit ktime_t read on 32-bit platforms."
