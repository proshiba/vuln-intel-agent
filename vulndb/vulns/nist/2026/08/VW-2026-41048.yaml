title: "The BricksForge WordPress plugin before 3.1.8.8 does not verify the identity
  of the requester when processing a password change submitted through one of its
  form actions, allowing unauthenticated attackers to set an arbitrary password for
  any user, including administrators, and take over their account.\n\nExploitation
  requires the site to have a form using the BricksForge WordPress plugin before 3.1.8.8's
  password reset action in its update mode. The server-side current-password verification
  option for that action is disabled by default, so the vulnerable state is the default
  one once the action is used."
