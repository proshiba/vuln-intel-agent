title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  qcom: camss: Remove use_count guard in stop_streaming\n\nThe use_count check was
  introduced so that multiple concurrent Raw Data\nInterfaces RDIs could be driven
  by different virtual channels VCs on the\nCSIPHY input driving the video pipeline.\n\
  \nThis is an invalid use of use_count though as use_count pertains to the\nnumber
  of times a video entity has been opened by user-space not the number\nof active
  streams.\n\nIf use_count and stream-on count don't agree then stop_streaming() will\n\
  break as is currently the case and has become apparent when using CAMSS\nwith libcamera's
  released softisp 0.3.\n\nThe use of use_count like this is a bit hacky and right
  now breaks regular\nusage of CAMSS for a single stream case. Stopping qcam results
  in the splat\nbelow, and then it cannot be started again and any attempts to do
  so fails\nwith -EBUSY.\n\n[ 1265.509831] WARNING: CPU: 5 PID: 919 at drivers/media/common/videobuf2/videobuf2-core.c"
