title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  Fix connection failure handling\n\nIn case immediate MPA request processing fails,
  the newly\ncreated endpoint unlinks the listening endpoint and is\nready to be dropped.
  This special case was not handled\ncorrectly by the code handling the later TCP
  socket close,\ncausing a NULL dereference crash in siw_cm_work_handler()\nwhen dereferencing
  a NULL listener. We now also cancel\nthe useless MPA timeout, if immediate MPA request\n\
  processing fails.\n\nThis patch furthermore simplifies MPA processing in general:\n\
  Scheduling a useless TCP socket read in sk_data_ready() upcall\nis now surpressed,
  if the socket is already moved out of\nTCP_ESTABLISHED state."
