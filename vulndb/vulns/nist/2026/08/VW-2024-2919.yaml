title: "A vulnerability in the management and VPN web servers for Cisco Adaptive Security
  Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) Software could
  allow an unauthenticated, remote attacker to cause the device to reload unexpectedly,
  resulting in a denial of service (DoS) condition.\r\n\r This vulnerability is due
  to incomplete error checking when parsing an HTTP header. An attacker could exploit
  this vulnerability by sending a crafted HTTP request to a targeted web server on
  a device. A successful exploit could allow the attacker to cause a DoS condition
  when the device reloads."
