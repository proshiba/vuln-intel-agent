title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing:
  Fix mmiotrace possible NULL dereferencing of hiter->dev\n\nIf the mmio_pipe_open()
  fails to find a PCI device, the hiter->dev\nwill be assigned to NULL. The mmiotrace
  read() function dereferences the\nhiter->dev if hiter exists.\n\nChange the test
  of the read to not only check hiter being NULL, but also\nthe hiter->dev before
  dereferencing it."
