title: Spacebar Server before commit 8d126f4 contains a cross-channel message 
  deletion vulnerability in the single-delete and bulk-delete message handlers 
  that fail to scope message queries to the requested channel. Authenticated 
  users with MANAGE_MESSAGES permission in any controlled channel can delete 
  arbitrary messages in other channels by routing delete requests through their 
  own channel.
