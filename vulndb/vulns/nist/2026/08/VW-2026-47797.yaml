title: "ATutor is vulnerable to Insecure Direct Object Reference (IDOR) attack in
  profile picture related endpoints. Any authenticated user, including a student,
  can supply another user's member_id in a POST request to the profile album endpoint
  and permanently delete that user's profile picture, including those of instructors
  and administrators.\n\n\nProduct is no longer actively supported and the vulnerabilities
  have not been fixed. Only version 2.2.4 was tested and confirmed as vulnerable,
  other versions were not tested but might also be vulnerable."
