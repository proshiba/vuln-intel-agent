title: "If configured as a server, CodeMeter Runtime before versions 8.41a and 9.10
  accepts requests with opcode 0x5e, which contain the data length and\nthe data itself.
  Missing bounds checking on the data length value can lead to out of bounds reads,
  causing a\nsegmentation fault that ultimately crashes the CodeMeter Runtime."
