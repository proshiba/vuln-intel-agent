title: 'OpenChoreo is a complete, open-source developer platform for Kubernetes. Prior
  to 1.0.4, 1.1.4, and 1.2.0-rc.2, OpenChoreo Workflow Plane templates under samples/getting-started/workflow-templates/
  interpolated developer-controlled workflow parameters into shell program text executed
  through sh -c instead of passing the values through container.env, allowing arbitrary
  commands to run in workflow pods while affected privileged Podman templates lacked
  hostUsers: false. This issue is fixed in versions 1.0.4, 1.1.4, and 1.2.0-rc.2.'
