title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  Move jump_label_init() before parse_early_param()\n\nWhen enabling both CONFIG_MEM_ALLOC_PROFILING=y
  and\nCONFIG_MEM_ALLOC_PROFILING_ENABLED_BY_DEFAULT=y, then diabling memory\nprofiling
  by adding the boot parameter 'sysctl.vm.mem_profiling=0' will\ncause the kernel
  failed to boot.\n\nAfter analysis, this is because jump_label_init() must be called
  before\nparse_early_param(), the early param handlers may modify static keys by\n\
  static_branch_enable/disable().\n\nFix this by moving jump_label_init() to before
  parse_early_param(). The\nsolution is similar to other architectures."
