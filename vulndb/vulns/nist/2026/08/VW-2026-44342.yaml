title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/proc/task_mmu:
  do not warn on seeing non-migration pmd entry\n\nPatch series \"mm/hmm: A fix and
  a selftest\", v3.\n\nPatch 1 fixes a stale warning present from the time when only
  migration\nsoftleaf entries were supported at the PMD level.\n\nPatch 2 adds some
  code into hmm-tests.c which exercises the pagemap path\nfor PMD device-private entries.\n\
  \n\nThis patch (of 2):\n\npagemap_pmd_range_thp() warns if a non-present PMD is
  not a migration\nentry.  This became false once device-private entries at the PMD
  level\nwere added.\n\nTherefore, remove the stale migration-only assertion."
