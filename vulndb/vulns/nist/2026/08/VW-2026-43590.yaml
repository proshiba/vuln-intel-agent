title: rsync before 3.5.0 contains multiple command and argument injection 
  vulnerabilities that allow attackers to execute arbitrary commands by 
  supplying malicious input through several code paths, including the 
  RSYNC_CONNECT_PROG environment variable, daemon hooks, the rsync-ssl wrapper, 
  and remote-shell command newline injection. Attackers can inject shell 
  metacharacters or newline characters into unsanitized user-supplied values 
  such as hostnames and hostspecs to execute arbitrary commands under the 
  privileges of the rsync process or the invoking user.
