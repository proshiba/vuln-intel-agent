title: gitoxide before 0.52.1 fails to validate submodule names from .gitmodules
  configuration, allowing path traversal when deriving submodule git 
  directories. Attackers can craft malicious submodule names with traversal 
  segments to redirect state() and open() functions to repositories outside 
  .git/modules, causing repository confusion and inspection of 
  attacker-controlled repositories.
