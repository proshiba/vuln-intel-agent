title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  Call iso_exit() on module unload\n\nIf iso_init() has been called, iso_exit() must
  be called on module\nunload. Without that, the struct proto that iso_init() registered
  with\nproto_register() becomes invalid, which could cause unpredictable\nproblems
  later. In my case, with CONFIG_LIST_HARDENED and\nCONFIG_BUG_ON_DATA_CORRUPTION
  enabled, loading the module again usually\ntriggers this BUG():\n\n  list_add corruption.
  next->prev should be prev (ffffffffb5355fd0),\n    but was 0000000000000068. (next=ffffffffc0a010d0).\n\
  \  ------------[ cut here ]------------\n  kernel BUG at lib/list_debug.c:29!\n\
  \  Oops: invalid opcode: 0000 [#1] PREEMPT SMP PTI\n  CPU: 1 PID: 4159 Comm: modprobe
  Not tainted 6.10.11-4+bt2-ao-desktop #1\n  RIP: 0010:__list_add_valid_or_report+0x61/0xa0\n\
  \  ...\n    __list_add_valid_or_report+0x61/0xa0\n    proto_register+0x299/0x320\n\
  \    hci_sock_init+0x16/0xc0 [bluetooth]\n    bt_init+0x68/0xd0 [bluetooth]\n  \
  \  _"
