title: "CTI-Transmute is affected by a stored cross-site scripting (XSS) vulnerability
  in the conversion graph used to visualise converted MISP and STIX content.\n\nAttacker-controlled
  values originating from converted CTI data were passed to multiple HTML-parsing
  sinks in the graph user interface without sufficient neutralisation. In particular,
  node labels, node sublabels, edge labels, node properties, edge properties, and
  node types could contain crafted HTML or JavaScript content.\n\nThe Pivotick graph
  library renders some of these values through HTML-parsing operations. Consequently,
  a malicious value such as an HTML element containing an event handler could be interpreted
  as markup rather than displayed as plain text. The first remediation explicitly
  notes that Pivotick rendered node and edge labels as HTML and therefore introduced
  escaping before data was handed to the graph renderer.\n\nA separate vulnerable
