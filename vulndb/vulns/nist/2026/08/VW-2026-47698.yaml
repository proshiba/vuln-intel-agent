title: A flaw was found in FreeIPA. When a trust relationship is configured 
  between FreeIPA and Active Directory, Active Directory users can bypass 
  authentication for FreeIPA services, including the portal, SMB server, and 
  LDAP directory. This is possible by impersonating a client name in the Ticket 
  Granting Service (TGS) due to FreeIPA services not verifying Privilege 
  Attribute Certificate (PAC) certificates. This vulnerability could allow an 
  authenticated Active Directory user to escalate their privileges within the 
  FreeIPA domain.
