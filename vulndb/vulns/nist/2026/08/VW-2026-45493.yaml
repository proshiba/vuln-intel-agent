title: ApostropheCMS is an open-source Node.js content management system. Prior 
  to 2.17.6, sanitizeHtml() can pass disallowed executable markup through 
  packages/sanitize-html/index.js when textarea or xmp is included in 
  allowedTags because a literal solidus after the raw-text end-tag name is 
  treated as text by htmlparser2 and the ontext handler emits that content 
  without escaping, while a browser parses the following img onerror markup as 
  active HTML. This issue is fixed in version 2.17.6.
