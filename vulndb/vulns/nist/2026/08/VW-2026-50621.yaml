title: SeaweedFS is a distributed storage system for files and blobs. In 
  versions 4.39 and earlier, the S3 API accepts an external OIDC JWT sent 
  directly in the Authorization header and maps it to an IAM role without 
  enforcing that role's trust policy, so a federated user can assume a role they
  are not permitted to hold. The standard STS AssumeRoleWithWebIdentity path 
  rejects such a token when the role's trust policy does not trust the token's 
  federated provider, but the direct S3 bearer path validates only the token 
  itself and then authenticates as the mapped role and evaluates that role's 
  attached S3 permissions. As a result, a valid OIDC user whose token would be 
  denied the role through STS can obtain the role's S3 access, including object 
  read, write, and delete, by presenting the raw OIDC JWT directly to the S3 
  API. This issue is fixed in version 4.40
