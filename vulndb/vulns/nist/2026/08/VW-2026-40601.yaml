title: "Out-of-bounds Read vulnerability in Apache Fory C++ deserialization.\n\nThis
  issue affects Apache Fory C++ versions from 0.14.0 before 1.5.0 when deserializing
  structs containing tagged integer fields. A crafted input payload may trigger an
  out-of-bounds heap read in the tagged integer fast-path deserializer, potentially
  causing information disclosure or denial of service.\n\n\nUsers are recommended
  to upgrade to Apache Fory 1.5.0, which fixes this issue. Applications that do not
  use Apache Fory C++ or do not use tagged integer fields are not affected."
