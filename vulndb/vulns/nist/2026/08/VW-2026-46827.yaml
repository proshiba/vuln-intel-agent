title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows unauthenticated attacker with logon to
  the infrastructure where Oracle Hyperion Financial Management executes to compromise
  Oracle Hyperion Financial Management.  Successful attacks require human interaction
  from a person other than the attacker. Successful attacks of this vulnerability
  can result in  unauthorized update, insert or delete access to some of Oracle Hyperion
  Financial Management accessible data. CVSS 3.1 Base Score 2.5 (Integrity impacts).  CVSS
  Vector: (CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N).'
