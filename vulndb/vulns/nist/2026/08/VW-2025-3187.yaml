title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  fix UAF issue in nfqnl_nf_hook_drop() when ops_init() failed\n\nWhen the ops_init()
  interface is invoked to initialize the net, but\nops->init() fails, data is released.
  However, the ptr pointer in\nnet->gen is invalid. In this case, when nfqnl_nf_hook_drop()
  is invoked\nto release the net, invalid address access occurs.\n\nThe process is
  as follows:\nsetup_net()\n\tops_init()\n\t\tdata = kzalloc(...)   ---> alloc \"\
  data\"\n\t\tnet_assign_generic()  ---> assign \"date\" to ptr in net->gen\n\t\t\
  ...\n\t\tops->init()           ---> failed\n\t\t...\n\t\tkfree(data);          --->
  ptr in net->gen is invalid\n\t...\n\tops_exit_list()\n\t\t...\n\t\tnfqnl_nf_hook_drop()\n\
  \t\t\t*q = nfnl_queue_pernet(net) ---> q is invalid\n\nThe following is the Call
  Trace information:\nBUG: KASAN: use-after-free in nfqnl_nf_hook_drop+0x264/0x280\n\
  Read of size 8 at addr ffff88810396b240 by task ip/15855\nCall Trace:\n<TASK>\n\
  dump_stack_lvl+0x8e/0xd1\nprint_report+0x155/0x454\nkasan_report+0x"
