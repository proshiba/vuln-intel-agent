title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  spectrum_acl_tcam: Fix possible use-after-free during activity update\n\nThe rule
  activity update delayed work periodically traverses the list of\nconfigured rules
  and queries their activity from the device.\n\nAs part of this task it accesses
  the entry pointed by 'ventry->entry',\nbut this entry can be changed concurrently
  by the rehash delayed work,\nleading to a use-after-free [1].\n\nFix by closing
  the race and perform the activity query under the\n'vregion->lock' mutex.\n\n[1]\n\
  BUG: KASAN: slab-use-after-free in mlxsw_sp_acl_tcam_flower_rule_activity_get+0x121/0x140\n\
  Read of size 8 at addr ffff8881054ed808 by task kworker/0:18/181\n\nCPU: 0 PID:
  181 Comm: kworker/0:18 Not tainted 6.9.0-rc2-custom-00781-gd5ab772d32f7 #2\nHardware
  name: Mellanox Technologies Ltd. MSN3700/VMOD0005, BIOS 5.11 01/06/2019\nWorkqueue:
  mlxsw_core mlxsw_sp_acl_rule_activity_update_work\nCall Trace:\n <TASK>\n dump_stack_lvl+0xc6/0x120\n\
  \ print_report+0xc"
