title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmctp:
  serial: handle zero-length frames to prevent rx buffer overflow\n\nThe MCTP serial
  receive state machine reads a frame length byte in\nmctp_serial_push_header() case
  2 and validates it upper-bound-only:\n\n\tif (c > MCTP_SERIAL_FRAME_MTU) {\n\t\t
  dev->rxstate = STATE_ERR;\n\t} else {\n\t\tdev->rxlen = c;\n\t\tdev->rxpos = 0;\n\
  \t\tdev->rxstate = STATE_DATA;\n\t\t...\n\t}\n\nA length of zero passes this check,
  so rxlen is set to 0 and the state\nmachine advances to STATE_DATA. In mctp_serial_push()
  STATE_DATA, the\nincoming byte is stored and rxpos incremented before the terminator
  is\n\n\tdev->rxbuf[dev->rxpos] = c;\n\tdev->rxpos++;\n\tdev->rxstate = STATE_DATA;\n\
  \tif (dev->rxpos == dev->rxlen) {\n\t\tdev->rxpos = 0;\n\t\tdev->rxstate = STATE_TRAILER;\n\
  \t}\n\nWith rxlen == 0 the \"rxpos == rxlen\" terminator can never fire (rxpos is\n\
  already 1 on the first data byte), so subsequent bytes are written past\nthe end
  of the fixed 74-byte rxbuf, which is the last member"
