title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_IDLETIMER: fix panic that occurs when timer_type has garbage value\n\nCurrently,
  when the rule related to IDLETIMER is added, idletimer_tg timer\nstructure is initialized
  by kmalloc on executing idletimer_tg_create\nfunction. However, in this process
  timer->timer_type is not defined to\na specific value. Thus, timer->timer_type has
  garbage value and it occurs\nkernel panic. So, this commit fixes the panic by initializing\n\
  timer->timer_type using kzalloc instead of kmalloc.\n\nTest commands:\n    # iptables
  -A OUTPUT -j IDLETIMER --timeout 1 --label test\n    $ cat /sys/class/xt_idletimer/timers/test\n\
  \      Killed\n\nSplat looks like:\n    BUG: KASAN: user-memory-access in alarm_expires_remaining+0x49/0x70\n\
  \    Read of size 8 at addr 0000002e8c7bc4c8 by task cat/917\n    CPU: 12 PID: 917
  Comm: cat Not tainted 5.14.0+ #3 79940a339f71eb14fc81aee1757a20d5bf13eb0e\n    Hardware
  name: QEMU Standard PC (Q35 + ICH9, 2009), BIOS 1"
