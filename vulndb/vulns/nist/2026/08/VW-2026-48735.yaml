title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  require at least 16 bytes of TX metadata\n\nAF_XDP accepts a TX metadata length
  as small as eight bytes, but every\nsupported request needs the flags plus at least
  one eight-byte request\nfield. Such short metadata also lets the kernel read beyond
  the registered\narea.\n\nRequire 16 bytes rather than sizeof(struct xsk_tx_metadata)
  to preserve\ncompatibility with applications that do not use launch-time metadata."
