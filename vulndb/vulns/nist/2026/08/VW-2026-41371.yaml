title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  auth: verify auth requirement when auth_chunk is NULL\n\nsctp_auth_chunk_verify()
  returns true unconditionally when\nchunk->auth_chunk is NULL, silently skipping
  authentication.\nThis is incorrect when:\n\n1. skb_clone() failed in the BH receive
  path, leaving auth_chunk\n   NULL. In sctp_endpoint_bh_rcv() asoc is NULL for new\n\
  \   connections, so the early sctp_auth_recv_cid() check cannot\n   catch this.\n\
  \n2. No AUTH chunk precedes COOKIE-ECHO, so skb_clone() is never\n   called and
  auth_chunk remains NULL.\n\nFix by checking sctp_auth_recv_cid() when auth_chunk
  is NULL:\nif authentication is required, return false to drop the chunk;\notherwise
  continue normally."
