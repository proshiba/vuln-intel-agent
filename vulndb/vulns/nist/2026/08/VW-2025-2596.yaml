title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  mpi3mr: Fix corrupt config pages PHY state is switched in sysfs\n\nThe driver, through
  the SAS transport, exposes a sysfs interface to\nenable/disable PHYs in a controller/expander
  setup.  When multiple PHYs\nare disabled and enabled in rapid succession, the persistent
  and current\nconfig pages related to SAS IO unit/SAS Expander pages could get\n\
  corrupted.\n\nUse separate memory for each config request."
