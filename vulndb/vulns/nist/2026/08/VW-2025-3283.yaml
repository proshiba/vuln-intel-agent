title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Fix data race on CQP request done\n\nKCSAN detects a data race on cqp_request->request_done
  memory location\nwhich is accessed locklessly in irdma_handle_cqp_op while being\n\
  updated in irdma_cqp_ce_handler.\n\nAnnotate lockless intent with READ_ONCE/WRITE_ONCE
  to avoid any\ncompiler optimizations like load fusing and/or KCSAN warning.\n\n\
  [222808.417128] BUG: KCSAN: data-race in irdma_cqp_ce_handler [irdma] / irdma_wait_event
  [irdma]\n\n[222808.417532] write to 0xffff8e44107019dc of 1 bytes by task 29658
  on cpu 5:\n[222808.417610]  irdma_cqp_ce_handler+0x21e/0x270 [irdma]\n[222808.417725]\
  \  cqp_compl_worker+0x1b/0x20 [irdma]\n[222808.417827]  process_one_work+0x4d1/0xa40\n\
  [222808.417835]  worker_thread+0x319/0x700\n[222808.417842]  kthread+0x180/0x1b0\n\
  [222808.417852]  ret_from_fork+0x22/0x30\n\n[222808.417918] read to 0xffff8e44107019dc
  of 1 bytes by task 29688 on cpu 1:\n[222808.417995]  irdma_wait_event+0x1e2/0x2c0
  [irdma]\n["
