title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  imx: fix locked bus on SMBus block-read of 0 (IRQ)\n\nSMBus 3.1 6.5.7 allows a Block
  Read byte count of 0, but the\ninterrupt-driven block-read state machine rejects
  it as -EPROTO. Worse,\nit returns without a NACK+STOP: the next receive cycle has
  already\nstarted, so the target keeps holding SDA and the bus stays stuck until
  a\npower cycle of this i2c controller.\n\nAccept count=0: NACK the in-flight dummy
  byte (TXAK) and set msg->len to\n2 so i2c_imx_isr_read_continue() emits STOP via
  its normal last-byte\npath. The dummy byte is discarded; block-read callers only
  consume\nbuf[0..count-1].\n\nReading I2DR has likewise already armed the next byte
  on the\ncount > I2C_SMBUS_BLOCK_MAX error path, so NACK it (TXAK) before aborting\n\
  with -EPROTO; otherwise the failing transfer's STOP cannot complete and\nthe bus
  stays held.\n\nThe atomic path regressed earlier (v3.16) and is fixed separately;
  this\npatch covers only the v6.13 state-mac"
