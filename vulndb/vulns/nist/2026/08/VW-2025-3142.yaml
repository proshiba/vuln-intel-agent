  elevator int del_gendisk\")\nmove rq_qos_exit() from disk_release() to del_gendisk(),
  this will\nintroduce some problems:\n\n1) If rq_qos_add() is triggered by enabling
  iocost/iolatency through\n   cgroupfs, then it can concurrent with del_gendisk(),
  it's not safe to\n   write 'q->rq_qos' concurrently.\n\n2) Activate cgroup policy
  that is relied on rq_qos will call\n   rq_qos_add() and blkcg_activate_policy(),
  and if rq_qos_exit() is\n   called in the middle, null-ptr-dereference will be triggered
  in\n   blkcg_activate_policy().\n\n3) blkg_conf_open_bdev() can call blkdev_get_no_open()
  first to find the\n   disk, then if rq_qos_exit() from del_gendisk() is done before\n\
  \   rq_qos_add(), then memory will be leaked.\n\nThis patch add a new disk level
