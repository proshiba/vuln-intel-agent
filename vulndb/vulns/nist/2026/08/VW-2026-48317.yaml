title: "A parser state isolation vulnerability in misp-stix could cause data from
  a previously processed STIX document to be retained and incorporated into the MISP
  event generated from a subsequent document when the same parser instance is reused.\n\
  \nSeveral STIX 1 and STIX 2 parser components maintained per-document state that
  was not completely cleared between conversions. In the STIX 2 parser, galaxy and
  galaxy-cluster information, including custom galaxy clusters, could survive a parser
  reset and subsequently be associated with objects from another bundle.\n\nThe STIX
  1 parsers were affected by the same underlying state-management issue. Depending
  on the parser type, retained information could include galaxies, references, passive
  DNS bookkeeping, package titles, dates, and timestamps. As a result, parsing a second
  STIX package with an already-used parser could produce a MISP event containing information
  that was present only in the previously processed package. For example, a generated
  event"
