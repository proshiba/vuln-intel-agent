title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrqspinlock:
  Reset tail when preserving queue on deadlock\n\nCurrently, the destruction of the
  waiter queue is suppressed for\nrqspinlock in cases where a deadlock is detected.
  Deadlock checks happen\nrelatively frequently (on entry for AA, within 1ms for ABBA),
  and waiter\nthreads may not be involved in locking scenarios involving deadlocks.\n\
  Thus, it is useful to not flush the queue and let other waiters take a\nstab at
  acquiring the lock after we detect a deadlock and exit.\n\nHowever, we need to follow
  the same logic as what we did previously for\nthe waitq_timeout label: reset the
  tail, and if we cannot, signal the\nnext waiter appropriately. In case of deadlocks,
