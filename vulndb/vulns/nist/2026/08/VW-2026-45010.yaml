title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mpls: initialize rtm_tos in mpls_getroute()\n\nmpls_getroute() builds the RTM_NEWROUTE
  reply to an RTM_GETROUTE\nrequest by filling a struct rtmsg allocated from an skb
  whose data\narea is not zeroed (alloc_skb(NLMSG_GOODSIZE, ...)). It sets every\n\
  field of the header except rtm_tos:\n\n\tr = nlmsg_data(nlh);\n\tr->rtm_family\t
  = AF_MPLS;\n\tr->rtm_dst_len\t= 20;\n\tr->rtm_src_len\t= 0;\n\tr->rtm_table\t= RT_TABLE_MAIN;\n\
  \tr->rtm_type\t= RTN_UNICAST;\n\tr->rtm_scope\t= RT_SCOPE_UNIVERSE;\n\tr->rtm_protocol
  = rt->rt_protocol;\n\tr->rtm_flags\t= 0;\n\nstruct rtmsg has no padding, so the
  one uninitialised byte rtm_tos\n(offset 3) is copied straight to user space on recvmsg(),
  leaking a\nbyte of uninitialised heap memory. This is in contrast to\nmpls_dump_route(),
  which fills the very same header and does set\nrtm_tos = 0.\n\nInitialize rtm_tos
  to 0, matching mpls_dump_route().\n\nReproduced with KMSAN by adding an MPLS route
  and issuing a\nnon-RTM_F_FIB_MAT"
