title: The Pinpoint Booking System – Version 2 plugin for WordPress is 
  vulnerable to Price Manipulation via the `cart_data` parameter in all versions
  up to, and including, 2.9.9.6.8. This is due to the 
  `dopbsp_woocommerce_add_to_cart` AJAX action being registered via 
  `wp_ajax_nopriv_*` with no authentication, no nonce verification, and no 
  server-side recalculation of pricing — the `update` handler reads 
  `price_total` directly from the attacker-controlled `cart_data` POST parameter
  and persists it to the database via `$wpdb->insert()` without validating it 
  against the calendar's configured pricing. The 
  `woocommerce_before_calculate_totals` callback subsequently reads the stored 
  attacker-supplied value back from the database and passes it directly to 
  `$product->set_price()` without recomputing from calendar settings. This makes
