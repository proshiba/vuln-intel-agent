title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  fix auxiliary device add/del races\n\nTwo paths add or delete the same slot (pf->vfs[vf_id].padev):
  a VF's\npdsc_reset_done() and the PF's devlink enable_vnet/disable_vnet handler.\n\
  They serialize on config_lock, but neither guards the slot under it\ncorrectly.\n\
  \nadd() registers and stores a new auxiliary device without first checking\nthe
  slot, so a second add of an already-populated slot leaks the first\ndevice. del()
  makes that check outside config_lock, so two concurrent\ndels can both pass it;
  the first clears the slot, and the second\ndereferences a NULL pointer.\n\nCheck
  and update the slot under config_lock in both paths."
