title: A flaw was found in jwcrypto. A remote attacker can send a specially 
  crafted JSON Web Encryption (JWE) token containing numerous period delimiters.
  This malformed token can force the JWE.deserialize() function to allocate 
  excessive memory, leading to a MemoryError. This issue results in a denial of 
  service (DoS) for services that process untrusted JWE values.
