title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracefs:
  Use generic inode RCU for synchronizing freeing\n\nWith structure layout randomization
  enabled for 'struct inode' we need to\navoid overlapping any of the RCU-used / initialized-only-once
  members,\ne.g. i_lru or i_sb_list to not corrupt related list traversals when making\n\
  use of the rcu_head.\n\nFor an unlucky structure layout of 'struct inode' we may
  end up with the\nfollowing splat when running the ftrace selftests:\n\n[<...>] list_del
  corruption, ffff888103ee2cb0->next (tracefs_inode_cache+0x0/0x4e0 [slab object])
  is NULL (prev is tracefs_inode_cache+0x78/0x4e0 [slab object])\n[<...>] ------------[
  cut here ]------------\n[<...>] kernel BUG at lib/list_debug.c:54!\n[<...>] invalid
  opcode: 0000 [#1] PREEMPT SMP KASAN\n[<...>] CPU: 3 PID: 2550 Comm: mount Tainted:
  G                 N  6.8.12-grsec+ #122 ed2f536ca62f28b087b90e3cc906a8d25b3ddc65\n\
  [<...>] Hardware name: QEMU Standard PC (i440FX + PIIX, 1996), BIOS 1.14.0-2 0"
