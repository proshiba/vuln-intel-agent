title: "Improper handling of case sensitivity (CWE-178) in the identity zone authorization
  check in the Identity Zone Endpoint in Cloud Foundry UAA allows a remote authenticated
  attacker holding only the zones.write authority to bypass the intended restriction
  that this authority does not grant access to the privileged uaa (system) identity
  zone, by referring to the zone identifier in a non-lowercase form (e.g. UAA) in
  the request path and body. The authorization layer performs a case-sensitive comparison
  against the system zone identifier, while the underlying MySQL persistence layer
  resolves identifiers case-insensitively under its default collation, so the request
  is authorized incorrectly and is then resolved against the real system zone record.
  This allows the attacker to overwrite the system zone's JWT signing key with attacker-controlled
  key material, forge JWTs claiming the admin client and administrator scopes, and
  fully compromise UAA and any Cloud Foundry deployment that trusts it. "
