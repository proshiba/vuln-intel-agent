title: A flaw was found in the SAML metadata import functionality of the 
  keycloak-services component, which is the core engine for identity brokering 
  in Red Hat Build of Keycloak. When importing identity provider metadata that 
  lacks specific usage attributes for keys, the system incorrectly disables 
  signature validation for SAML responses even if a signing certificate is 
  provided. This issue allows an unauthenticated attacker to forge a SAML 
  response and gain unauthorized access to a user account by knowing their 
  external identifier.
