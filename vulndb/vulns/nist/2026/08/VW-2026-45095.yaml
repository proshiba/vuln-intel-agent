title: The WC Vendors – WooCommerce Multivendor, WooCommerce Marketplace, 
  Product Vendors plugin for WordPress is vulnerable to generic SQL Injection 
  via the 'status' parameter in all versions up to, and including, 2.7.0 due to 
  insufficient escaping on the user supplied parameter and lack of sufficient 
  preparation on the existing SQL query. This makes it possible for 
  authenticated attackers, with shop manager-level access and above, to append 
  additional SQL queries into already existing queries that can be used to 
  extract sensitive information from the database. The sanitize_text_field 
  callback strips HTML but leaves SQL metacharacters intact, and wp_magic_quotes
  slash protection does not apply because WP_REST_Server::serve_request() calls 
  wp_unslash() on GET parameters before the sanitize callback executes.
