title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: Remove proc entry when dev is unregistered.\n\nsyzkaller reported a warning
  in bcm_connect() below. [0]\n\nThe repro calls connect() to vxcan1, removes vxcan1,
  and calls\nconnect() with ifindex == 0.\n\nCalling connect() for a BCM socket allocates
  a proc entry.\nThen, bcm_sk(sk)->bound is set to 1 to prevent further connect().\n\
  \nHowever, removing the bound device resets bcm_sk(sk)->bound to 0\nin bcm_notify().\n\
  \nThe 2nd connect() tries to allocate a proc entry with the same\nname and sets
  NULL to bcm_sk(sk)->bcm_proc_read, leaking the\noriginal proc entry.\n\nSince the
  proc entry is available only for connect()ed sockets,\nlet's clean up the entry
  when the bound netdev is unregistered.\n\n[0]:\nproc_dir_entry 'can-bcm/2456' already
  registered\nWARNING: CPU: 1 PID: 394 at fs/proc/generic.c:376 proc_register+0x645/0x8f0
  fs/proc/generic.c:375\nModules linked in:\nCPU: 1 PID: 394 Comm: syz-executor403
  Not tainted 6.10.0-rc7-g852e42cc"
