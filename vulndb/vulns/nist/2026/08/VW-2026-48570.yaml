title: "The MC4WP: Mailchimp for WordPress plugin for WordPress is vulnerable to Stored
  Cross-Site Scripting via the form response message post meta fields (e.g., 'text_subscribed',
  'text_error') in all versions up to, and including, 4.12.0 due to insufficient input
  sanitization and output escaping. This makes it possible for authenticated attackers,
  with Author-level access and above, to inject arbitrary web scripts in pages that
  will execute whenever a user accesses an injected page."
