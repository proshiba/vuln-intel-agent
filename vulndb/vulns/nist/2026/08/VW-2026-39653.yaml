title: changedetection.io's /settings save handler builds an update dict from 
  form.data['application'] and blind-merges it into the stored application 
  settings via .update(). Because WTForms represents an unchecked checkbox as 
  False rather than 'unchanged', and only the 'password' field is special-cased 
  against this problem, a POST to /settings that omits the 
  api_access_token_enabled field (e.g. a minimal scripted request) silently 
  disables API key enforcement for the entire REST API, exposing the full watch 
  list, history, and configuration to unauthenticated requests.
