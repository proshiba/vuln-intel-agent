title: "The openUrl function in @a2ui/web_core passes an agent-controlled URL directly
  to window.open() without validating the URI scheme. A malicious agent can supply
  a javascript: URI as the url argument of a Button component's functionCall action.
  When the user clicks the rendered button, arbitrary JavaScript executes in the victim
  application's browser origin, constituting a stored/reflected XSS with Critical
  severity. No non-default configuration is required; the Basic Catalog is enabled
  by default."
