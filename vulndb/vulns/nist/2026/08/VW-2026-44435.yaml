title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  vesafb: fix memory leak in vesafb_probe()\n\nSince commit 73ce73c30ba9 (\"fbdev:
  Transfer video= option strings to\ncaller; clarify ownership\") the string returned
  from fb_get_options()\nis expected to be freed by the caller. But the string is
  not freed in\nvesafb_probe(). Fix that by freeing the option string after setup."
