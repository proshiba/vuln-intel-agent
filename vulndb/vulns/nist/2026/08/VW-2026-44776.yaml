title: "In the Linux kernel, the following vulnerability has been resolved:\n\nconfigfs_lookup():
  don't leave ->s_dentry dangling on failure\n\nNormally ->s_dentry is cleared when
  dentry it's pointing to becomes\nnegative (on eviction, realistically).  However,
  that only happens\nif dentry gets to be positive in the first place; in case of
  inode\nallocation failure dentry never becomes positive, so ->d_iput()\nis not called
  at all.\n\nWe do part of what normally would've been done by configfs_d_iput()\n\
  (dropping the reference to configfs_dirent) manually, but we do\nnot clear ->s_dentry
  there.  Sloppy as it is, it does not matter in\ncase of configfs_create_{dir,link}()
  - there configfs_dirent does\nnot survive dropping the sole reference to it.\n\n\
  However, for configfs_lookup() it *does* survive, with a dangling\npointer to soon
  to be freed dentry sitting it its ->s_dentry.\n\nSubsequent getdents(2) in that
  directory will end up dereferencing\nthat pointer in order to pick the inode number.\
  \  Use after free...\n\nT"
