title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  macsec: Fix offload support for NETDEV_UNREGISTER event\n\nCurrent macsec netdev
  notify handler handles NETDEV_UNREGISTER event by\nreleasing relevant SW resources
  only, this causes resources leak in case\nof macsec HW offload, as the underlay
  driver was not notified to clean\nit's macsec offload resources.\n\nFix by calling
  the underlay driver to clean it's relevant resources\nby moving offload handling
  from macsec_dellink() to macsec_common_dellink()\nwhen handling NETDEV_UNREGISTER
  event."
