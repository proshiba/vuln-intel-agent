title: "In the Linux kernel, the following vulnerability has been resolved:\n\nof:
  reserved_mem: avoid post-init UAF when alloc_reserved_mem_array() fails\n\nThe global
  pointer 'reserved_mem' continues to reference the\nreserved_mem_array which lives
  in __initdata if\nalloc_reserved_mem_array() fails. of_reserved_mem_lookup() is\n\
  exported for post-init use, that would dereference freed memory\nand trigger a use-after-free.\n\
  \nSo reset reserved_mem_count to 0 when alloc_reserved_mem_array()\nfails."
