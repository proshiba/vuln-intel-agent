title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe:
  prevent UAF around preempt fence\n\nThe fence lock is part of the queue, therefore
  in the current design\nanything locking the fence should then also hold a ref to
  the queue to\nprevent the queue from being freed.\n\nHowever, currently it looks
  like we signal the fence and then drop the\nqueue ref, but if something is waiting
  on the fence, the waiter is\nkicked to wake up at some later point, where upon waking
  up it first\ngrabs the lock before checking the fence state. But if we have already\n\
  dropped the queue ref, then the lock might already be freed as part of\nthe queue,
  leading to uaf.\n\nTo prevent this, move the fence lock into the fence itself so
  we don't\nrun into lifetime issues. Alternative might be to have device level\n\
  lock, or only release the queue in the fence release callback, however\nthat might
  require pushing to another worker to avoid locking issues.\n\nReferences: https://gitlab.freedesktop.org/drm/xe/kern"
