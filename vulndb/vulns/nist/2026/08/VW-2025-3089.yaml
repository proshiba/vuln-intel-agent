title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm:
  Update ipcomp_scratches with NULL when freed\n\nCurrently if ipcomp_alloc_scratches()
  fails to allocate memory\nipcomp_scratches holds obsolete address. So when we try
  to free the\npercpu scratches using ipcomp_free_scratches() it tries to vfree non\n\
  existent vm area. Described below:\n\nstatic void * __percpu *ipcomp_alloc_scratches(void)\n\
  {\n        ...\n        scratches = alloc_percpu(void *);\n        if (!scratches)\n\
  \                return NULL;\nipcomp_scratches does not know about this allocation
  failure.\nTherefore holding the old obsolete address.\n        ...\n}\n\nSo when
  we free,\n\nstatic void ipcomp_free_scratches(void)\n{\n        ...\n        scratches
  = ipcomp_scratches;\nAssigning obsolete address from ipcomp_scratches\n\n      \
  \  if (!scratches)\n                return;\n\n        for_each_possible_cpu(i)\n\
  \               vfree(*per_cpu_ptr(scratches, i));\nTrying to free non existent
  page, causing warning: trying to vfree\ne"
