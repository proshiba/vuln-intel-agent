title: "In the Linux kernel, the following vulnerability has been resolved:\n\npds_core:
  fix deadlock between reset thread and remove\n\npci_reset_function() acquires device_lock
  before performing the reset.\npdsc_remove() is called by the PCI core with device_lock
  already held.\nIf pdsc_pci_reset_thread() is running when pdsc_remove() is called,\n\
  destroy_workqueue() will block waiting for the work to complete, while\nthe work
  is blocked waiting for device_lock - deadlock.\n\nUse pci_try_reset_function() which
  uses pci_dev_trylock() internally.\nThis acquires both the device lock and the PCI
  config access lock\nwithout blocking - if either lock is contended, it returns -EAGAIN\n\
  immediately. This avoids the deadlock while also ensuring proper\nconfig space access
  serialization during the reset.\n\nThe pci_dev_get/put calls are also removed as
  they were unnecessary -\nthe driver-owned workqueue is destroyed in pdsc_remove(),
  guaranteeing\nthe work completes before remove returns. The PCI core holds its\n\
