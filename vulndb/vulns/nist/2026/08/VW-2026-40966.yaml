title: Tinyproxy through 1.11.3 is vulnerable to HTTP request parsing 
  desynchronization due to a case-sensitive comparison of the Transfer-Encoding 
  header in src/reqs.c. The is_chunked_transfer function uses strcmp to compare 
  the header value against "chunked", even though RFC 7230 specifies that 
  transfer-coding names are case-insensitive.
