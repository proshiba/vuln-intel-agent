title: Ruby LSP is an implementation of the language server protocol for Ruby. 
  Several workspace-level settings in the Ruby LSP VS Code extension prior to 
  version 0.10.4 could override the path to the Ruby executable, the version 
  manager executables, or the Bundler `Gemfile` used at startup. A malicious 
  repository containing a `.vscode/settings.json` could set these values to 
  attacker-controlled targets. Opening and trusting the repository would then 
  execute code with the privileges of the developer. The Ruby LSP gem and 
  clients of the language server in other editors are not affected. Version 
  0.10.4 of the Ruby LSP VS Code extension fixes the issue.
