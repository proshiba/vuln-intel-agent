title: "The ARM PL011 UART driver in drivers/serial/uart_pl011.c fails to acknowledge
  receive error interrupts. On the PL011, the framing, parity, break, and overrun
  error interrupts (PL011_IMSC_ERROR_MASK) are cleared only by writing the interrupt-clear
  register UARTICR; reading the data register clears the RX interrupt and the per-byte
  RSR status but not the error interrupt status in MIS. The interrupt service routine
  pl011_isr() acknowledged only the CTS modem-status interrupt and never wrote icr
  for the error bits, so an asserted error interrupt remains pending after the ISR
  returns.\n\nWhen an application enables error-interrupt reporting via the public
  uart_irq_err_enable() API, an attacker who controls the serial peer can deterministically
  assert these error bits by injecting line errors on the RX line — a baud/stop-bit
  mismatch or mid-character break (framing/break error), a flipped parity bit (parity
  error), or FIFO flooding (overrun error). Because the error interrupt is never cleared,"
