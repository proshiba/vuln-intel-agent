title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mwifiex: use the subframe length when parsing A-MSDU TDLS frames\n\nmwifiex_11n_dispatch_amsdu_pkt()
  splits an A-MSDU with\nieee80211_amsdu_to_8023s() and walks the resulting subframes.
  For each\nsubframe it passes the subframe data pointer to\nmwifiex_process_tdls_action_frame(),
  but pairs it with skb->len, the\nlength of the A-MSDU parent, instead of rx_skb->len:\n\
  \n\trx_skb = __skb_dequeue(&list);\n\trx_hdr = (struct rx_packet_hdr *)rx_skb->data;\n\
  \tif (ISSUPP_TDLS_ENABLED(priv->adapter->fw_cap_info) &&\n\t    ntohs(rx_hdr->eth803_hdr.h_proto)
  == ETH_P_TDLS) {\n\t\tmwifiex_process_tdls_action_frame(priv, (u8 *)rx_hdr,\n\t\t\
  \t\t\t\t  skb->len);\n\t}\n\nThe parent is not a valid description of that buffer,
  and may not be\nvalid memory at all. ieee80211_amsdu_to_8023s() ends with\n\n\t\
  if (!reuse_skb)\n\t\tdev_kfree_skb(skb);\n\nand it only sets reuse_skb when the
  parent is linear, is not a\nhead_frag, and is being consumed as the *last* subframe.
  So "
