title: "In the Linux kernel, the following vulnerability has been resolved:\n\nefi:
  libstub: only free priv.runtime_map when allocated\n\npriv.runtime_map is only allocated
  when efi_novamap is not set.\nOtherwise, it is an uninitialized value.  In the error
  path, it is freed\nunconditionally.  Avoid passing an uninitialized value to free_pool.\n\
  Free priv.runtime_map only when it was allocated.\n\nThis bug was discovered and
  resolved using Coverity Static Analysis\nSecurity Testing (SAST) by Synopsys, Inc."
