title: A security vulnerability has been detected in Open Asset Import Library 
  Assimp up to 6.0.2. The impacted element is the function 
  MD5Importer::MakeDataUnique of the file code/AssetLib/MD5/MD5Loader.cpp. The 
  manipulation of the argument iNewIndex leads to heap-based buffer overflow. 
  The attack can only be performed from a local environment. The identifier of 
  the patch is bf9dabb617c46e5133dac65cca6bff177917afcb. Applying a patch is the
  recommended action to fix this issue.
