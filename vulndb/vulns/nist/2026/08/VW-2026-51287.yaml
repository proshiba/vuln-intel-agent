title: WatchGuard Dimension provides a client-side lock/unlock UI control for 
  management changes. The server-side configuration endpoint does not enforce 
  this lock/unlock workflow state, allowing an authenticated administrator to 
  submit configuration changes directly to the endpoint without first completing
  the UI unlock step. This allows an authenticated read-write administrator 
  session to bypass the intended editing workflow and overwrite configuration 
  changes being made by another concurrent administrator session.
