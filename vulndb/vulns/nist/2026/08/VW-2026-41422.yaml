title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  carl9170: bound memcpy length in cmd callback to prevent OOB read\n\nWhen the firmware
  sends a command response with a length mismatch,\ncarl9170_cmd_callback() logs the
  mismatch and calls carl9170_restart()\nbut then falls through to memcpy(ar->readbuf,
  buffer + 4, len - 4).\nSince len comes from the firmware and can exceed ar->readlen,
  this\ncopies more data than the readbuf was allocated for.\n\nBound the memcpy to
  min(len - 4, ar->readlen) so that the response\nis still completed -- avoiding repeated
  restarts from queued garbage --\nwhile preventing an overread past the response
  buffer."
