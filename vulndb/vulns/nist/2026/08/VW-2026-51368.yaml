title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  lwtunnel: Drop skb metadata before LWT encapsulation\n\nskb metadata is meant for
  passing information between XDP and TC. It lives\nin the skb headroom, immediately
  before skb->data. LWT programs cannot\naccess the __sk_buff->data_meta pseudo-pointer
  to metadata.\n\nHowever, LWT encapsulation prepends outer headers, moving skb->data
  back\nover the headroom where the metadata sits. On an RX-originated (forwarded)\n\
  packet that still carries XDP metadata this goes wrong in two different\nways, depending
  on the encap type:\n\n1. Non-BPF LWT encaps (mpls, seg6, ioam6 ...) call skb_push()/skb_pull()\n\
  \   and silently overwrite the metadata that sits in the headroom.\n\n2) BPF LWT
  xmit calls bpf_skb_change_head(), which uses skb_data_move().\n   That helper expects
  metadata immediately before skb->data. But since\n   the IP output path runs LWT
  xmit before neighbour output has built\n   the outgoing L2 header, for forwarded
  packets skb->"
