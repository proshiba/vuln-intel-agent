title: A unauthenticated remote peer may lead rsyslogd to crash due to a flaw in
  the optional imptcp module. A crafted input sequence during oversize-frame 
  recovery can cause an invalid internal message length and terminate rsyslogd. 
  No confidentiality or integrity impact, privilege escalation, or code 
  execution has been identified. imtcp and the default imptcp framing modes are 
  not affected.
