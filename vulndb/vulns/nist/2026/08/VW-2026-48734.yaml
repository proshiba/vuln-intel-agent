title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxsk:
  clear metadata pointer when no timestamp is requested\n\nUser space can change metadata
  flags after request processing. Rereading\nthem during completion can therefore
  make the kernel write a timestamp\nthat was not requested when the packet was submitted.\n\
  \nClear the metadata pointer during request processing unless timestamp\ncompletion
  is requested. Completion handling can then use the pointer\nitself instead of rereading
  the flags.\n\nOn the mlx5 multi-packet WQE path metadata is evaluated per batch:\n\
  xsk_tx_metadata_request() runs only for the descriptor that starts a\nsession, just
  like the checksum offload that is applied once through the\nshared WQE. Only that
  descriptor's pointer is reset, so completion\nhandling can record a timestamp for
  the other descriptors of the session\nregardless of their own XDP_TXMD_FLAGS_TIMESTAMP
  bit. The write stays\ninside the metadata area; the single-WQE, other zero-copy,
  and generic\npa"
