title: "In the Linux kernel, the following vulnerability has been resolved:\n\nexec:
  fix unsigned loop counter wrap in transfer_args_to_stack()\n\nThe stop value is
  derived from bprm->p >> PAGE_SHIFT. The index variable\nis an unsigned long. If
  bprm->p drops below PAGE_SIZE and stop becomes\nzero the loop condition index >=
  stop is always true.\n\nAfter the index == 0 iteration the decrement wraps to ULONG_MAX
  and\nbprm->page[ULONG_MAX] reads sizeof(void *) bytes in front of the array.\nThe
  pointer has wrapped to -1. That garbage pointer is then passed to\nkmap_local_page()
  and PAGE_SIZE bytes are copied from wherever that\nlands into the stack of the process
  being created. And the loop doesn't\nterminate either...\n\nGetting there only requires
  bprm->p < PAGE_SIZE. On !MMU\nbprm_set_stack_limit() and bprm_hit_stack_limit()
  are empty. So the only\nconstraint on how far bprm->p is pushed down is valid_arg_len(),
  i.e.\nthat each individual string still fits in what is left.\n\nbprm->p starts
  at PAGE_SIZE * MAX_ARG_"
