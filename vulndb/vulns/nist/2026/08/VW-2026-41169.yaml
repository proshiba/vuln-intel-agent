title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  bound DACL dedup walk to copied ACEs\n\nset_ntacl_dacl() can stop copying ACEs before
  consuming the full input\nDACL when size accounting overflows.\n\nWhen that happens,
  num_aces reflects only the ACEs that were actually\ncopied into the output DACL,
  but set_posix_acl_entries_dacl() still\nreceives nt_num_aces and uses it to walk
  the existing ACE array during\ndedup.\n\nThat makes the dedup walk scan past the
  copied ACE array and inspect\nbuffer tail that does not contain valid ACEs.\n\n\
  Split the two meanings currently carried by the NT ACE count. Pass the\nnumber of
  copied NT ACEs to bound the dedup walk, and preserve the\noriginal \"input DACL
  had NT ACEs\" state separately for the\nEveryone/default ACL fallback.\n\nThis keeps
  the dedup walk aligned with the ACEs that are actually\npresent in the rebuilt DACL."
