title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu:
  Restore lost return in iommu_report_device_fault()\n\nWhen iommu_report_device_fault
  gets called with a partial fault it is\nsupposed to collect the fault into the group
  and then return.\n\nInstead the return was accidently deleted which results in trying
  to\nprocess the fault and an eventual crash.\n\nDeleting the return was a typo,
  put it back."
