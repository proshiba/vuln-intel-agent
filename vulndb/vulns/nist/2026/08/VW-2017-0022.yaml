title: 'A vulnerability in the detection engine that handles Secure Sockets Layer
  (SSL) packets for Cisco Firepower System Software could allow an unauthenticated,
  remote attacker to cause a denial of service (DoS) condition because the Snort process
  unexpectedly restarts. This vulnerability affects Cisco Firepower System Software
  prior to the first fixed release when it is configured with an SSL Decrypt-Resign
  policy. More Information: CSCvb62292. Known Affected Releases: 6.0.1 6.1.0 6.2.0.
