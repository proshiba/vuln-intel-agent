title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/packet:
  avoid fanout hook re-registration after unregister\n\npacket_set_ring() temporarily
  detaches a socket from packet delivery while\nreconfiguring its ring. It records
  the previous running state, clears\npo->num, unregisters the protocol hook when
  needed, drops po->bind_lock,\nand later restores po->num and re-registers the hook
  from the saved\nwas_running value.\n\nThat unlocked window can race with NETDEV_UNREGISTER.
  The notifier can\nobserve the socket as not running, skip __unregister_prot_hook(),
  and\ninvalidate the per-socket binding by setting po->ifindex to -1 and clearing\n\
  po->prot_hook.dev. A one-member fanout group can still retain its shared\nfanout
  hook device pointer. When packet_set_ring() resumes, re-registering\nsolely from
  the stale was_running state can re-add the fanout hook after\nthe device has been
  unregistered.\n\nTreat po->ifindex == -1 as an invalidated binding after reacquiring\n\
  po->bind_lock. This "
