title: "ATutor is vulnerable to Cross-Site Request Forgery (CSRF) in profile update
  functionality. An attacker can craft a malicious website which, when visited by
  an authenticated victim, submits a forged request to the system. Due to the lack
  of proper CSRF token implementation, the forged request is processed successfully,
  allowing an attacker to modify profile fields of an existing user.\n\n\n\n\n\n\n\
  Product is no longer actively supported and the vulnerabilities have not been fixed.
  Only version 2.2.4 was tested and confirmed as vulnerable, other versions were not
  tested but might also be vulnerable."
