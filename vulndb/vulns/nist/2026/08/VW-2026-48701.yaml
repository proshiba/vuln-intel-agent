title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvt:
  add permission check for KDSKBMETA ioctl\n\nKDSKBMETA modifies keyboard meta mode
  but lacks the !perm check that all\nother keyboard setter ioctls in vt_k_ioctl()
  enforce, allowing a process\nto change meta mode on a non-controlling console without
  authorization."
