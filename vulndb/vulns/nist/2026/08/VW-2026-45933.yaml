title: A flaw was found in the `submariner-operator` component of Red Hat 
  Advanced Cluster Management for Kubernetes. This vulnerability allows a 
  cluster administrator, or any user with permissions to modify the Submariner 
  Custom Resource (CR), to specify an unvalidated image path. This lack of 
  validation enables an attacker to execute arbitrary code with elevated 
  privileges across the entire cluster, including control-plane nodes, by 
  deploying a malicious image.
