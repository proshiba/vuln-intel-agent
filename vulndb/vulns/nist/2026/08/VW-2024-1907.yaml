title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix possible out-of-bound read in ath12k_htt_pull_ppdu_stats()\n\nlen is
  extracted from HTT message and could be an unexpected value in\ncase errors happen,
  so add validation before using to avoid possible\nout-of-bound read in the following
  message iteration and parsing.\n\nThe same issue also applies to ppdu_info->ppdu_stats.common.num_users,\n\
  so validate it before using too.\n\nThese are found during code review.\n\nCompile
  test only."
