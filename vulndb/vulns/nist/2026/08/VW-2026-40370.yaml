title: The WPC Name Your Price for WooCommerce WordPress plugin before 2.2.5 
  does not enforce its server-side price allowlist for products configured in 
  "Select" price mode, allowing an unauthenticated visitor to add such a product
  to the cart at an arbitrary value below the merchant-defined allowed prices 
  and commit a real order at that price (revenue loss / underpriced orders). 
  This is a distinct, unfixed vector from CVE-2025-12115, whose 2.2.0 fix only 
  addressed applying a custom price to products where Name Your Price is 
  disabled and left the Select-mode allowlist unenforced through 2.2.4.
