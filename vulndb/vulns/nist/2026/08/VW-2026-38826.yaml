title: Keycloak provides authorization services that allow administrators to 
  restrict access to resources based on time policies (for example, only 
  allowing access during business hours). A flaw was discovered where a user can
  include a fake time value in their authorization request that overrides the 
  actual server time. This allows the user to bypass these time-based 
  restrictions and access protected resources at unauthorized times.
