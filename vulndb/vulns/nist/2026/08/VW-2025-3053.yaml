title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntunnels:
  fix kasan splat when generating ipv4 pmtu error\n\nIf we try to emit an icmp error
  in response to a nonliner skb, we get\n\nBUG: KASAN: slab-out-of-bounds in ip_compute_csum+0x134/0x220\n\
  Read of size 4 at addr ffff88811c50db00 by task iperf3/1691\nCPU: 2 PID: 1691 Comm:
  iperf3 Not tainted 6.5.0-rc3+ #309\n[..]\n kasan_report+0x105/0x140\n ip_compute_csum+0x134/0x220\n\
  \ iptunnel_pmtud_build_icmp+0x554/0x1020\n skb_tunnel_check_pmtu+0x513/0xb80\n vxlan_xmit_one+0x139e/0x2ef0\n\
  \ vxlan_xmit+0x1867/0x2760\n dev_hard_start_xmit+0x1ee/0x4f0\n br_dev_queue_push_xmit+0x4d1/0x660\n\
  \ [..]\n\nip_compute_csum() cannot deal with nonlinear skbs, so avoid it.\nAfter
  this change, splat is gone and iperf3 is no longer stuck."
