title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Use correct encap attribute during invalidation\n\nWith introduction of post action
  infrastructure most of the users of encap\nattribute had been modified in order
  to obtain the correct attribute by\ncalling mlx5e_tc_get_encap_attr() helper instead
  of assuming encap action\nis always on default attribute. However, the cited commit
  didn't modify\nmlx5e_invalidate_encap() which prevents it from destroying correct
  modify\nheader action which leads to a warning [0]. Fix the issue by using correct\n\
  attribute.\n\n[0]:\n\nFeb 21 09:47:35 c-237-177-40-045 kernel: WARNING: CPU: 17
