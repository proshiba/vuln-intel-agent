title: Nexus Repository 3 contained an endpoint used to change the administrator
  account password during initial onboarding. This endpoint did not verify that 
  onboarding was still in progress before allowing the password change, relying 
  instead on the presence of a local onboarding artifact. As a result, an 
  account holding the nexus:* permission could invoke the endpoint outside the 
  intended onboarding flow to replace the administrator password, and existing 
  sessions were not invalidated after the change.
