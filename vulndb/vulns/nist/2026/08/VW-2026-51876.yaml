title: Rodauth before 2.47.0 contains an authentication bypass vulnerability in 
  the jwt_refresh route that issues new JWT access tokens without requiring a 
  refresh token. Attackers can present an access token to the refresh route via 
  non-POST methods to obtain a new valid access token, enabling indefinite 
  account access with temporary token possession.
