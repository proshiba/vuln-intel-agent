title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlandlock:
  Fix LANDLOCK_SCOPE_SIGNAL bypass on the SIGIO path\n\nLANDLOCK_SCOPE_SIGNAL must
  prevent a sandboxed process from signaling\nprocesses outside its Landlock domain.\
  \  It can be bypassed through the\nasynchronous SIGIO delivery path.\n\nA sandboxed
  process that owns any file or socket can arm it with\nfcntl(fd, F_SETOWN, -pgid),
  fcntl(fd, F_SETSIG, SIGKILL) and O_ASYNC, so\nthat an I/O event makes the kernel
  deliver the chosen signal to the\nwhole process group.  As the head of its process
  group's task list (the\ndefault position right after fork()) that group can also
  hold the\nnon-sandboxed process that launched it, e.g. a supervisor or a security\n\
  monitor.  The sandbox can thus kill or signal the processes\nLANDLOCK_SCOPE_SIGNAL
  is meant to protect from it.\n\nThe scope is enforced in hook_file_send_sigiotask()
  against the Landlock\ndomain recorded at F_SETOWN time, not the live domain of the
  sender.\ncontrol_current_fowner("
