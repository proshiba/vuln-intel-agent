title: "Net::OAuth versions before 0.33 for Perl check HMAC-SHA1, HMAC-SHA256 and
  PLAINTEXT signatures with a non-constant-time comparison in verify.\n\nEach of the
  three compares the signature carried in the message against the locally computed
  one with the eq operator, which returns as soon as the two strings differ. The time
  taken to reject a signature varies with the length of the matching prefix. RSA-SHA1
  is not affected, as it verifies through the RSA key object rather than by comparing
  strings.\n\nA client that can submit messages and time the replies may recover a
  valid signature one byte at a time rather than searching the whole signature space.
  Under PLAINTEXT the value compared against is the signature key itself, so the search
  recovers consumer_secret and token_secret."
