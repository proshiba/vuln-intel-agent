title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  xts - Handle EBUSY correctly\n\nAs it is xts only handles the special return value
  of EINPROGRESS,\nwhich means that in all other cases it will free data related to
  the\nrequest.\n\nHowever, as the caller of xts may specify MAY_BACKLOG, we also
  need\nto expect EBUSY and treat it in the same way.  Otherwise backlogged\nrequests
  will trigger a use-after-free."
