title: ILIAS before versions 9.22, 10.10, and 11.3 contains an unauthenticated 
  PHP object injection vulnerability that allows unauthenticated attackers to 
  execute arbitrary code by injecting serialized objects through the LTI 
  authentication endpoint and triggering deserialization via the Shibboleth 
  back-channel logout endpoint. Attackers can write arbitrary serialized objects
  into session storage, then exploit an available POP gadget through the logout 
  endpoint's unrestricted deserialization to write attacker-controlled PHP 
  content to a web-accessible path and achieve remote code execution as the web 
  server user.
