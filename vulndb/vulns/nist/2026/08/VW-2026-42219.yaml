title: 'Time-of-check time-of-use race condition for the Intel(R) NPU Driver for Windows
  for all versions within Ring 1: Device Drivers may allow a denial of service. Unprivileged
  software adversary with an authenticated user combined with a high complexity attack
  may enable denial of service. This result may potentially occur via local access
  when attack requirements are present without special internal knowledge and requires
  no user interaction. The potential vulnerability may impact the confidentiality
  (none), integrity (low) and availability (high) of the vulnerable system, resulting
  in subsequent system confidentiality (none), integrity (none) and availability (none)
  impacts.'
