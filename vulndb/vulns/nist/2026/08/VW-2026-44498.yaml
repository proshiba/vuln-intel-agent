title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/liquidio:
  drop cached VF pci_dev LUT\n\nThe PF SR-IOV enable path caches VF pci_dev pointers
  in\ndpiring_to_vfpcidev_lut[] by iterating with pci_get_device(). Those\nentries
  do not own a reference, because the iterator drops the previous\ndevice reference
  on each step. The cached pointer is then dereferenced\nlater when handling OCTEON_VF_FLR_REQUEST.\n\
  \nReplace the cached VF mapping with runtime lookup on the mailbox DPI\nring: derive
  the VF index from q_no, resolve the VF via exported PCI\nIOV helpers, validate it
  with the PF pointer and VF ID, then issue\npcie_flr() and drop the reference with
  pci_dev_put(). Remove the\nunused VF lookup table initialization and cleanup."
