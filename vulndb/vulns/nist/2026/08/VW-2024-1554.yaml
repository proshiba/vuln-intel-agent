  lantiq: fix memory corruption in RX ring\n\nIn a situation where memory allocation
  or dma mapping fails, an\ninvalid address is programmed into the descriptor. This
  can lead\nto memory corruption. If the memory allocation fails, DMA should\nreuse
  the previous skb and mapping and drop the packet. This patch\nalso increments rx
  drop counter."
