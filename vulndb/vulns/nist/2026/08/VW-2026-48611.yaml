title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  clear new_transport when removing a peer\n\nsctp_process_asconf_param() stores a
  newly added peer transport in\nasoc->new_transport. After all parameters in the
  ASCONF chunk have been\nprocessed, sctp_sf_do_asconf() uses this pointer to send
  a HEARTBEAT to the\nnew transport.\n\nAn authenticated ASCONF from a remote SCTP
  peer can add a transport and\nremove it again with a wildcard DEL-IP parameter in
  the same chunk. The\nwildcard deletion preserves the transport on which the ASCONF
  arrived, but\nremoves the newly added transport through\nsctp_assoc_del_nonprimary_peers().
  The removal does not clear\nasoc->new_transport, leaving it pointing to the removed
  transport.\n\nsctp_sf_do_asconf() then creates a HEARTBEAT whose chunk->transport
  points\nto the removed transport without holding a transport reference. During\n\
  local address replacement, src_out_of_asoc_ok keeps this HEARTBEAT on\ncontrol_chunk_list.
