title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_qca: fix NULL pointer dereference in qca_setup() for non-serdev device\n\nhu->serdev
  is NULL for hci_uart attached via non-serdev paths, but\nqca_setup() unconditionally
  calls serdev_device_get_drvdata(hu->serdev)\nand dereferences the result, causing
  a NULL pointer dereference.\n\nFix by guarding the dereference with a NULL check,
  consistent with the\nrest of qca_setup()."
