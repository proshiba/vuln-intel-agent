title: Cudy WR3000 2.0 running firmware before 2.5.24 contains an OS command 
  injection vulnerability that allows authenticated attackers to execute 
  arbitrary OS commands with root privileges by sending unsanitized input 
  through the mesh MQTT command interface. The sync_command binary forwards 
  unsanitized input directly to a shell execution sink in command.lua, enabling 
  attackers with access to the MQTT broker to exploit the default-enabled 
  command execution path to achieve full root-level system compromise.
