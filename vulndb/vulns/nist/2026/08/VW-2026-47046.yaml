title: "The ZFS_IOC_USERSPACE_MANY ioctl, used by zfs-userspace(8), truncated a 64-bit
  output buffer size to a 32-bit integer for the kernel allocation, but used the original
  64-bit size as the buffer limit when writing records.\n\nA local user with the \"\
  userused\" delegated ZFS permission can trigger a kernel heap overflow via the ZFS_IOC_USERSPACE_MANY
  ioctl, potentially escalating privileges."
