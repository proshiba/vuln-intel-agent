title: A flaw was found in Feast. An authorization bypass vulnerability exists 
  in the /materialize and /materialize-incremental endpoints. By sending a 
  specially crafted request that omits the feature_views field, an attacker can 
  bypass intended permission checks. This allows an unauthenticated remote 
  attacker, or any authenticated user, to trigger a full re-materialization of 
  all feature views. The consequence is a Denial of Service (DoS) due to data 
  corruption and significant resource consumption across all tenants.
