title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mvneta: re-enable percpu interrupt on resume\n\nOn Marvell MPIC platforms (Armada
  370/XP/38x), mvneta uses a percpu\nIRQ disable/enable scheme for NAPI: the ISR (mvneta_percpu_isr)
  calls\ndisable_percpu_irq() to mask the MPIC per-CPU interrupt and schedules\nNAPI
  poll, which calls enable_percpu_irq() on completion to unmask.\n\nIf suspend occurs
  while NAPI poll is pending (between\ndisable_percpu_irq in the ISR and enable_percpu_irq
  in poll\ncompletion), the interrupt is never re-enabled:\n\n  1. mvneta_percpu_isr:
  disable_percpu_irq() + napi_schedule()\n     => MPIC masked, percpu_enabled cpumask
  bit cleared\n  2. NAPI poll does not complete before suspend proceeds\n     (on
  PREEMPT_RT this is highly likely since softirqs run in\n     ksoftirqd which gets
  frozen; on non-RT it can happen when\n     softirq processing is deferred to ksoftirqd)\n\
  \  3. mvneta_stop_dev => napi_disable(): cancels the pending poll\n     without
  executing"
