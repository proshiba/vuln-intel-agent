title: An improper restriction of URL schemes and destinations in the 
  SmartCenter browserseturl command in the Telefunken TE24553B45V2DZ Smart TV 
  running on the Vestel MB181 / Voltron181 / TiVo OS platform allows an attacker
  with access to the same local network to cause the embedded browser to issue 
  requests to unintended loopback/internal destinations, including 127.0.0.1 
  addresses. In demonstrated scenarios, requests initiated through the 
  SmartCenter browserseturl mechanism could reach an internal service and 
  receive a successful response, although the same destination was not reachable
  through normal browser navigation. The issue affects firmware version 
  V2.78.0.0 and is fixed in firmware version V2.85.2.0.
