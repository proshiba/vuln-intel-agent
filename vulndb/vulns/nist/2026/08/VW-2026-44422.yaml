title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack_sip: validate skb_dst() before accessing it\n\ntc ingress and openvswitch
  do not guarantee routing information to be\navailable. These subsystems use the
  conntrack helper infrastructure, and\nthe SIP helper relies on the skb_dst() to
  be present if\nsip_external_media is set to 1 (which is disabled by default as a
  module\nparameter).\n\nThis effectively disables the sip_external_media toggle for
  these\nsubsystems without resulting in a crash."
