title: Budibase before 3.38.1 contains a server-side request forgery 
  vulnerability in the REST datasource integration that fails to validate HTTP 
  redirects against the IP blacklist. Attackers with Builder role can configure 
  a REST datasource pointing to an external server that returns a redirect to 
  internal IP addresses, bypassing blacklist protection to access cloud metadata
  endpoints and internal services.
