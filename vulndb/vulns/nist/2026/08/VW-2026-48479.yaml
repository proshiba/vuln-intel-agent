title: Microsoft UFO open-source framework for intelligent automation across 
  devices and platforms. Prior to 3.0.8, 
  ufo/client/mcp/http_servers/linux_mcp_server.py binds a FastMCP streamable 
  HTTP server to localhost:8010 but does not validate the Host, Origin, or 
  Sec-Fetch-Site headers. An attacker-controlled web page can use DNS rebinding 
  to reach the local /mcp endpoint, enumerate tool schemas through tools/list, 
  and invoke execute_command with a valid UFO_MCP_API_KEY to read files or 
  execute allowed operating system commands as the victim's user. This issue is 
  fixed in version 3.0.8.
