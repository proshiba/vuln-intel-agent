title: "ATutor Gameme module allows users to upload files of any type and extension
  without restriction. Due to improper handling of file uploads, files are stored
  in a web-accessible location before their content is validated. An authenticated
  attacker who knows a valid course_id can upload a server-executable malicious script.
  The uploaded file can then be requested over HTTP, resulting in remote code execution
  as the web server process user. In most cases, course_id=0 can be used, as it commonly
  represents the global context.\n\n\n\n\nProduct is no longer actively supported
  and the vulnerabilities have not been fixed. Only version 2.2.4 was tested and confirmed
  as vulnerable, other versions were not tested but might also be vulnerable."
