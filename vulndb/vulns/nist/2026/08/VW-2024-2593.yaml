title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  reinitialize delayed ref list after deleting it from the list\n\nAt insert_delayed_ref()
  if we need to update the action of an existing\nref to BTRFS_DROP_DELAYED_REF, we
  delete the ref from its ref head's\nref_add_list using list_del(), which leaves
  the ref's add_list member\nnot reinitialized, as list_del() sets the next and prev
  members of the\nlist to LIST_POISON1 and LIST_POISON2, respectively.\n\nIf later
  we end up calling drop_delayed_ref() against the ref, which can\nhappen during merging
  or when destroying delayed refs due to a transaction\nabort, we can trigger a crash
  since at drop_delayed_ref() we call\nlist_empty() against the ref's add_list, which
  returns false since\nthe list was not reinitialized after the list_del() and as
  a consequence\nwe call list_del() again at drop_delayed_ref(). This results in an\n\
  invalid list access since the next and prev members are set to poison\npointers,
  resulting in a splat if C"
