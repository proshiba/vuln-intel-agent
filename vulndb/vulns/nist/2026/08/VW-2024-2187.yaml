title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/dasd:
  Fix invalid dereferencing of indirect CCW data pointer\n\nFix invalid dereferencing
  of indirect CCW data pointer in\ndasd_eckd_dump_sense() that leads to a kernel panic
  in error cases.\n\nWhen using indirect addressing for DASD CCWs (IDAW) the CCW CDA
  pointer\ndoes not contain the data address itself but a pointer to the IDAL.\nThis
  needs to be translated from physical to virtual as well before\nusing it.\n\nThis
  dereferencing is also used for dasd_page_cache and also fixed\nalthough it is very
  unlikely that this code path ever gets used."
