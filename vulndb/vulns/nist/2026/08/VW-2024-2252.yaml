title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: change DMA direction while mapping reinjected packets\n\nFor fragmented
  packets, ath12k reassembles each fragment as a normal\npacket and then reinjects
  it into HW ring. In this case, the DMA\ndirection should be DMA_TO_DEVICE, not DMA_FROM_DEVICE.
  Otherwise,\nan invalid payload may be reinjected into the HW and\nsubsequently delivered
  to the host.\n\nGiven that arbitrary memory can be allocated to the skb buffer,\n\
  knowledge about the data contained in the reinjected buffer is lacking.\nConsequently,
  there’s a risk of private information being leaked.\n\nTested-on: QCN9274 hw2.0
  PCI WLAN.WBE.1.1.1-00209-QCAHKSWPL_SILICONZ-1"
