title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/irdma:
  Fix a window for use-after-free\n\nDuring a destroy CQ an interrupt may cause processing
  of a CQE after CQ\nresources are freed by irdma_cq_free_rsrc(). Fix this by moving
  the call\nto irdma_cq_free_rsrc() after the irdma_sc_cleanup_ceqes(), which is\n\
  called under the cq_lock."
