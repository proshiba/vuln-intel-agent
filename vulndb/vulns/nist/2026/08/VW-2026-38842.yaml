title: "Zephyr's Bluetooth Mesh subnet key management leaks one PSA Crypto key slot
  on every subnet-key teardown. In subsys/bluetooth/mesh/subnet.c, net_keys_create()
  imports the Private Beacon Key into a PSA key slot under CONFIG_BT_MESH_PRIV_BEACONS
  (enabled by default), but subnet_keys_destroy() guarded the matching psa_destroy_key()
  with CONFIG_BT_MESH_V1d1. That Kconfig symbol was removed when explicit Mesh 1.0.1
  support was dropped, so the destroy branch became permanently dead code and the
  import is never balanced by a destroy.\n\nThe imbalanced teardown is reached every
  time subnet keys are destroyed: deleting a subnet (Config Server NetKey Delete),
  completing a Key Refresh Procedure (which retires the old key set), and resetting/re-provisioning
  the node. The over-the-air triggers are processed only under the node's device key,
  so they are exercisable by the provisioner or network administrator that owns the
  node, reachable over the Bluetooth Mesh network.\n\nWith the default CONFIG_MBEDTL"
