title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd:
  Bound the early ACPI HID map\n\nThe ivrs_acpihid command-line parser appends entries
  to a fixed\nfour-element early_acpihid_map array. Unlike the sibling IOAPIC and
  HPET\nparsers, it does not reject a fifth entry before incrementing the map size.\n\
  \nCheck the capacity at the common found label before parsing the HID and\nUID or
  writing the entry."
