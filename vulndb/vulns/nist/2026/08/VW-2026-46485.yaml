title: "The Sierra Wireless HL7800 cellular modem driver (drivers/modem/vendor_standalone/hl7800.c,
  located at drivers/modem/hl7800.c in v4.4.0 and earlier) parses AT responses with
  roughly twenty handlers that call net_buf_linearize(value, sizeof(value), *buf,
  0, len) into a 128-byte stack buffer and then write value[out_len] = 0. Because
  net_buf_linearize() (lib/net_buf/buf.c) can return a count equal to its destination-length
  argument, a field that exactly fills the buffer makes the terminating NUL land one
  byte past the end, a single-byte out-of-bounds write into adjacent stack memory.\n\
  \nThe +KCELLMEAS cell-measurement handler on_cmd_atcmdinfo_rssi() is worse: it passed
  the wire length len as the destination size (net_buf_linearize(value, len, *buf,
