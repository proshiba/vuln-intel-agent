title: "The Secret Type Management REST API does not correctly isolate access controls
  when deleting a secret type. The on-delete cascade logic, when triggered, fails
  to enforce organizational boundaries, leading to the removal of secrets associated
  with that type across all organizations.\n\nExploitation of this vulnerability can
  result in the unintended deletion of secrets across the entire deployment, potentially
  causing configuration failures, service interruptions, and a denial-of-service condition.
  This vulnerability requires delete permissions for the Secret Type Management REST
  API, which are by default only granted to administrators."
