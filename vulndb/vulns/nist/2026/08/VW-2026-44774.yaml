title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  fix KASAN slab-out-of-bounds in amdgpu_coredump ring dump\n\nThe ring content dump
  in amdgpu_coredump() uses two separate loops over\nadev->rings[]: the first counts
  rings with unsignalled fences to size\nthe allocation, and the second copies ring
  data into the allocated\nbuffers.\n\nBoth loops use the same condition to skip rings:\n\
  \n    atomic_read(&ring->fence_drv.last_seq) == ring->fence_drv.sync_seq\n\nBecause
  last_seq is an atomic that is updated concurrently by the fence\nsignalling path,
  additional rings may appear unsignalled in the second\nloop that were signalled
  during the first. When this happens, idx\nexceeds the allocated ring_count and the
  store to coredump->rings[idx]\nwrites past the end of the kcalloc-ed buffer.\n\n\
  This was found during IGT stressful test amd_queue_reset which\ntriggers random
  GPU resets. The OVERSIZE subtest\n(CMD_STREAM_EXEC_INVALID_PACKET_LENGTH_OVERSIZE
