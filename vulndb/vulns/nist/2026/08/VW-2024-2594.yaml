title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64/sve:
  Discard stale CPU state when handling SVE traps\n\nThe logic for handling SVE traps
  manipulates saved FPSIMD/SVE state\nincorrectly, and a race with preemption can
  result in a task having\nTIF_SVE set and TIF_FOREIGN_FPSTATE clear even though the
  live CPU state\nis stale (e.g. with SVE traps enabled). This has been observed to
  result\nin warnings from do_sve_acc() where SVE traps are not expected while\nTIF_SVE
  is set:\n\n|         if (test_and_set_thread_flag(TIF_SVE))\n|                 WARN_ON(1);
  /* SVE access shouldn't have trapped */\n\nWarnings of this form have been reported
  intermittently, e.g.\n\n  https://lore.kernel.org/linux-arm-kernel/CA+G9fYtEGe_DhY2Ms7+L7NKsLYUomGsgqpdBj+QwDLeSg=JhGg@mail.gmail.com/\n\
  \  https://lore.kernel.org/linux-arm-kernel/000000000000511e9a060ce5a45c@google.com/\n\
  \nThe race can occur when the SVE trap handler is preempted before and\nafter manipulating
  the saved FPSIMD/SVE state, starting"
