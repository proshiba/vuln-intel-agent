title: SWE-agent's trajectory inspector (sweagent inspector), confirmed in 
  v1.1.0, is an HTTP server that joins request paths to the trajectory directory
  in its /trajectory/ handler without rejecting parent-directory ('..') 
  references, bypassing the built-in path sanitization. The server binds all 
  interfaces (0.0.0.0), applies wildcard CORS, and requires no authentication. 
  An unauthenticated network client (or a malicious web page via CORS) can use 
  path traversal sequences to read files outside the intended directory. Because
  the read sink parses targets as trajectory JSON, disclosure is constrained to 
  JSON files shaped like a trajectory, which can contain repository contents, 
  command output, and secrets/API keys.
