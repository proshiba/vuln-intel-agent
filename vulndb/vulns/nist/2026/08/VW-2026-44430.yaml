title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: ipc3-control: Validate size in snd_sof_update_control\n\nIn snd_sof_update_control(),
  firmware-provided cdata->num_elems is\nchecked against local_cdata->data->size but
  never against the actual\nallocation size. If local_cdata->data->size was previously
  set to an\ninconsistent value, the memcpy could write past the allocated buffer.\n\
  \nAdd a bounds check to ensure num_elems fits within the available space\nin the
  ipc_control_data allocation before copying."
