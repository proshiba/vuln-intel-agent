title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfork:
  only invoke khugepaged, ksm hooks if no error\n\nThere is no reason to invoke these
  hooks early against an mm that is in an\nincomplete state.\n\nThe change in commit
  d24062914837 (\"fork: use __mt_dup() to duplicate\nmaple tree in dup_mmap()\") makes
  this more pertinent as we may be in a\nstate where entries in the maple tree are
  not yet consistent.\n\nTheir placement early in dup_mmap() only appears to have
  been meaningful\nfor early error checking, and since functionally it'd require a
  very small\nallocation to fail (in practice 'too small to fail') that'd only occur
  in\nthe most dire circumstances, meaning the fork would fail or be OOM'd in\nany
  case.\n\nSince both khugepaged and KSM tracking are there to provide optimisations\n\
  to memory performance rather than critical functionality, it doesn't\nreally matter
