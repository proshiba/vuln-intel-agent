title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  zfcp: Fix double free of FSF request when qdio send fails\n\nWe used to use the
  wrong type of integer in 'zfcp_fsf_req_send()' to cache\nthe FSF request ID when
  sending a new FSF request. This is used in case the\nsending fails and we need to
  remove the request from our internal hash\ntable again (so we don't keep an invalid
  reference and use it when we free\nthe request again).\n\nIn 'zfcp_fsf_req_send()'
  we used to cache the ID as 'int' (signed and 32\nbit wide), but the rest of the
  zfcp code (and the firmware specification)\nhandles the ID as 'unsigned long'/'u64'
  (unsigned and 64 bit wide [s390x\nELF ABI]).  For one this has the obvious problem
  that when the ID grows\npast 32 bit (this can happen reasonably fast) it is truncated
  to 32 bit\nwhen storing it in the cache variable and so doesn't match the original
  ID\nanymore.  The second less obvious problem is that even when the original ID\n\
