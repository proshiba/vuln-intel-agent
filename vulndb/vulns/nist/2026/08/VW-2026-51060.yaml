title: openssl-encrypt (pip package, versions <= 1.4.8) fails to sanitize 
  filenames read from untrusted drive data (outside the AES-GCM authenticated 
  manifest) before printing them in the verify-usb command's output. An attacker
  can plant filenames containing terminal cursor-movement and erase-line control
  bytes that repaint a forged PASSED verdict on screen, masking actual tamper 
  detection. Fixed in 1.4.9 by routing drive-derived names through 
  sanitize_for_display().
