title: "DjangoCRM's massmail module renders user-controlled EmlMessage fields (subject,
  content) through Django's Template constructor with no sanitization, in at least
  three locations: message_previews.py builds an f-string embedding message.subject/message.content
  directly into a Template call; email_creators.py passes eml_message.subject directly
  as a template string to Template; and helpers.py contains the same f-string interpolation
  pattern."
