title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  keep chunk->transport in step with the list it is queued on\n\n__sctp_outq_flush_rtx()
  moves a gap-acked chunk onto another transport's\ntransmitted list without updating
  chunk->transport:\n\n\tif (chunk->tsn_gap_acked) {\n\t\tlist_move_tail(&chunk->transmitted_list,\n\
  \t\t\t       &transport->transmitted);\n\t\tcontinue;\n\t}\n\nThe chunk then sits
  on a live transport's list while chunk->transport still\nnames a different one.\
  \  If that transport is removed - sctp_assoc_rm_peer()\nfrom an ASCONF Delete-IP
  - sctp_transport_free() RCU-frees it and the chunk\nis left with a dangling pointer.\
  \  sctp_assoc_rm_peer() scrubs\npeer->transmitted and asoc->outqueue.out_chunk_list,
  but the chunk is on\nneither.\n\nThe pointer is not followed while tsn_gap_acked
  is set.  A SACK that\nreneges on the TSN clears the flag, and the next SACK reaches\n\
  \n\ttchunk->transport->flight_size -= sctp_data_size(tchunk);\n\ninside the freed
  transport.  KASAN reports a slab"
