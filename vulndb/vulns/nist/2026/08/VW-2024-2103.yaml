title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix kernel crash during resume\n\nCurrently during resume, QMI target memory
  is not properly handled, resulting\nin kernel crash in case DMA remap is not supported:\n\
  \nBUG: Bad page state in process kworker/u16:54  pfn:36e80\npage: refcount:1 mapcount:0
  mapping:0000000000000000 index:0x0 pfn:0x36e80\npage dumped because: nonzero _refcount\n\
  Call Trace:\n bad_page\n free_page_is_bad_report\n __free_pages_ok\n __free_pages\n\
  \ dma_direct_free\n dma_free_attrs\n ath12k_qmi_free_target_mem_chunk\n ath12k_qmi_msg_mem_request_cb\n\
  \nThe reason is:\nOnce ath12k module is loaded, firmware sends memory request to
  host. In case\nDMA remap not supported, ath12k refuses the first request due to
  failure in\nallocating with large segment size:\n\nath12k_pci 0000:04:00.0: qmi
  firmware request memory request\nath12k_pci 0000:04:00.0: qmi mem seg type 1 size
  7077888\nath12k_pci 0000:04:00.0: qmi mem seg type 4 size 8454144\nath12k_pci 0000:04:00.0:
  q"
