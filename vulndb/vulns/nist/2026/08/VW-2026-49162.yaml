title: Mistune is a Python Markdown parser with renderers and plugins. Versions 
  3.3.0 through 3.3.2 are vulnerable to DoS through deeply nested tokens. HTML 
  rendering creates deeply nested emphasis tokens from consecutive asterisk 
  characters, and recursive rendering in HTMLRenderer.render_token() can exceed 
  Python's recursion limit and raise RecursionError, allowing crafted Markdown 
  to crash a parsing process. This issue is fixed in version 3.3.3
