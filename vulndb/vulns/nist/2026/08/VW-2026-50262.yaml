title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  disallow multiple FENCE chunks in one submit\n\namdgpu_cs_pass1() dispatches on
  chunk_id once per chunk without\nrejecting repeated ids. p->uf_bo is a single-slot
  field, so a\nsubmission carrying two AMDGPU_CHUNK_ID_FENCE chunks runs\namdgpu_cs_p1_user_fence()
  twice, and the second run overwrites\np->uf_bo with a freshly referenced BO without
  dropping the reference\ntaken by the first.\n\namdgpu_cs_parser_fini() only unrefs
  the final p->uf_bo, so every FENCE\nchunk but the last leaks a BO reference. The
  leaked BO outlives handle\nclose and process exit.\n\nReject duplicate FENCE chunks
  the same way commit fec5f8e8c6bc\n(\"drm/amdgpu: disallow multiple BO_HANDLES chunks
  in one submit\") did\nfor p->bo_list.\n\n(cherry picked from commit 665b1fc2a1845206408f9a2c6da67101789edb82)"
