title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  msft: fix slab-use-after-free in msft_do_close()\n\nTying the msft->data lifetime
  to hdev by freeing it in\nhci_release_dev() to fix the following case:\n\n[use]\n\
  msft_do_close()\n  msft = hdev->msft_data;\n  if (!msft)                      ...(1)
  <- passed.\n    return;\n  mutex_lock(&msft->filter_lock); ...(4) <- used after
  freed.\n\n[free]\nmsft_unregister()\n  msft = hdev->msft_data;\n  hdev->msft_data
  = NULL;         ...(2)\n  kfree(msft);                    ...(3) <- msft is freed.\n\
  \n==================================================================\nBUG: KASAN:
  slab-use-after-free in __mutex_lock_common\nkernel/locking/mutex.c:587 [inline]\n\
  BUG: KASAN: slab-use-after-free in __mutex_lock+0x8f/0xc30\nkernel/locking/mutex.c:752\n\
  Read of size 8 at addr ffff888106cbbca8 by task kworker/u5:2/309"
