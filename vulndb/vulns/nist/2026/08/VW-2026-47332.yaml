title: A flaw was found in search-v2-operator. The operator's ClusterRole has 
  permissions equivalent to a cluster administrator, allowing it to impersonate 
  other entities, write Role-Based Access Control (RBAC) configurations, approve
  Certificate Signing Requests (CSRs), and manage ManifestWork. This grants 
  excessive privileges beyond what is necessary for the operator's intended 
  function, potentially leading to privilege escalation within the cluster.
