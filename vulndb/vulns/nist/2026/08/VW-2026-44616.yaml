title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  hold socket lock when dumping endpoints in sctp_diag\n\nSCTP_DIAG endpoint dumping
  was traversing endpoint address lists without\nholding lock_sock(), while those
  lists could change concurrently via\nsocket operations (e.g., bindx changes). This
  creates a race where\nnla_reserve() counts addresses under RCU protection, but the
  subsequent\ncopy may see fewer entries, potentially leaking uninitialized memory
  to\nuserspace.\n\nFix this by:\n\n- Taking a reference on each endpoint during hash
  traversal\n- Moving socket operations (lock_sock()) outside read_lock_bh()\n- Serializing
  address list access during dump\n- Reworking sctp_for_each_endpoint() to support
  restart-based traversal\n  with (net, pos) tracking\n\nAlso:\n\n- Add WARN_ON_ONCE()
  for inconsistent address counts\n- Fix idiag_states filtering for LISTEN vs association
  cases\n- Skip dumping endpoints being freed (ep->base.dead)\n- Move dump position
  tracking into iterator, rem"
