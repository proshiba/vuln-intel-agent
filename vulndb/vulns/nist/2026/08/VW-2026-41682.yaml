title: Dokploy is a free, self-hostable Platform as a Service (PaaS). From 
  0.29.2 until 0.29.13, schedule.create and schedule.update in 
  apps/dokploy/server/api/routers/schedule.ts derive serviceId from 
  applicationId or composeId and execute the owner/admin host-schedule gate only
  in the alternative branch, allowing a member with access to one application to
  attach its applicationId to a dokploy-server schedule and run a supplied 
  script as root through schedule.runManually. This issue is fixed in version 
  0.29.13.
