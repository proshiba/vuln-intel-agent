title: The KiviCare – Clinic & Patient Management System (EHR) plugin for 
  WordPress is vulnerable to generic SQL Injection via the 'searchTerm' 
  parameter in all versions up to, and including, 4.5.1 due to insufficient 
  escaping on the user supplied parameter and lack of sufficient preparation on 
  the existing SQL query. This makes it possible for authenticated attackers, 
  with custom-level access and above, to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. Exploitation requires a KiviCare custom role with the 
  'settings_view' permission (e.g., Doctor or Receptionist), meaning standard 
  WordPress subscribers cannot exploit this without a KiviCare-assigned role.
