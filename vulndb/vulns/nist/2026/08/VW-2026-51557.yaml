title: grpc-gateway v2.28.0 is vulnerable to Incorrect Access Control. The 
  application processes the X-HTTP-Method-Override header in ServeMux.ServeHTTP 
  without restricting allowed methods. When a POST request with Content-Type 
  application/x-www-form-urlencoded includes this header, the request method is 
  rewritten to an arbitrary attacker-supplied value before routing. This allows 
  bypassing method-based access controls enforced by upstream proxies or WAFs.
