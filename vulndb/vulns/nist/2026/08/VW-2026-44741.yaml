title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: validate skb length in testmode query\n\nIn mt7925_tm_query(), the
  response skb from mt76_mcu_send_and_get_msg()\nis used in a memcpy without validating
  its length:\n\n  memcpy(evt_resp, skb->data + 8, MT7925_EVT_RSP_LEN);\n\nwhere MT7925_EVT_RSP_LEN
  is 512. If the firmware returns a response\nshorter than 520 bytes (8 + 512), this
  reads beyond the skb data\nbuffer. The over-read data is then returned to userspace
  via nla_put()\nin mt7925_testmode_dump().\n\nAdd a length check before the memcpy
  to ensure the skb contains\nsufficient data."
