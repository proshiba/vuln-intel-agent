title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - fix use-after-free and double-free in disconnect\n\nims_pcu_disconnect()
  only intended to perform cleanup when the primary\n(control) interface is unbound.
  However, it currently relies on the\ninterface class to distinguish between control
  and data interfaces.\nA malicious device could present a data interface with the
  same class\nas the control interface, leading to premature cleanup and potential\n\
  use-after-free or double-free.\n\nSwitch to verifying that the interface being disconnected
  is indeed\nthe control interface."
