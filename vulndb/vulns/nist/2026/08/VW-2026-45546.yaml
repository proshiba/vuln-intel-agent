title: "Pandora contains a stored cross-site scripting (XSS) vulnerability in the
  rendering of URL observables. A URL extracted from or associated with an analyzed
  file was inserted directly into the inline JavaScript onclick handler used by the
  Submit to Lookyloo action.\n\n\nAlthough the value was subject to HTML escaping
  by the template engine, it was embedded inside a JavaScript string within an HTML
  attribute. An attacker-controlled URL containing specially crafted characters could
  therefore break out of the JavaScript string and inject arbitrary JavaScript code.\n\
  \n\nThe malicious script would execute in the context of the Pandora web application
  when a victim interacts with the affected Submit to Lookyloo control. Successful
  exploitation could allow an attacker to access information available to the victim's
  browser or perform actions using the victim's authenticated Pandora session.\n\n\
  \nThe patch removes the observable value from the inline JavaScript handler. The
