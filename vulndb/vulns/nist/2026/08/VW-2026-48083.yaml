title: "Improper input validation in the Time Series Visual Builder (TSVB) plugin
  in OpenSearch Dashboards allows an authenticated remote user to execute arbitrary
  code on the server via a crafted JSON payload to the metrics visualization API endpoint.
  This issue is a form of prototype pollution that enables remote code execution. \n\
  \n\n\nTo remediate this issue, users should upgrade to OpenSearch Dashboards 3.8
  or later."
