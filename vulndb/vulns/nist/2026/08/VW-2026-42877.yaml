title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/imagination:
  Fit paired fragment job in the correct CCCB\n\nFor geometry jobs with a paired fragment
  job, at the moment, the\nDRM scheduler's prepare_job() callback:\n\n- checks for
  internal (driver) dependencies for the geometry job;\n- calls into pvr_queue_get_paired_frag_job_dep()
  to check for external\n  dependencies for the fragment job (the two jobs are submitted
  together\n  but the common scheduler code doesn't know about it, so this needs to\n\
  \  be done at this point in time);\n- calls into the prepare_job() callback again,
  but for the fragment job,\n  to check its internal dependencies as well, passing
  the fragment job's\n  drm_sched_job and the geometry job's drm_sched_entity / pvr_queue.\n\
  \nThe problem with the last step is that pvr_queue_prepare_job() doesn't\nalways
  take the mismatched fragment job and geometry queue into account,\nin particular
