title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  microchip: vcap: fix races on the shared Super VCAP block\n\nThe VCAP instances
  on a chip are not independent, yet they are locked\nindependently. On sparx5 and
  lan969x the IS0 and IS2 instances are\nbacked by the same Super VCAP hardware block
  and share its cache and\ncommand registers: every access drives the shared VCAP_SUPER_CTRL\n\
  register and moves data through the shared cache registers.\n\nAccessing one instance
  therefore races with accessing another. The\nper-instance admin->lock cannot prevent
  this, as each instance takes a\ndifferent lock.\n\nThe locking issue is mostly disguised
  by the fact that the core usage of\nthe vcap api runs under rtnl. However, the full
  rule dump in debugfs\ndecodes rules straight from hardware (a READ command followed
  by a cache\nread) and runs outside rtnl, so it races a concurrent tc-flower rule\n\
  write to another Super VCAP instance.\n\nBesides corrupting the dump, the read repopulates
  the sh"
