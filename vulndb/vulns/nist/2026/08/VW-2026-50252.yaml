title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  don't swallow dquot recovery verification errors\n\nxlog_recover_dquot_commit_pass2()
  validates the recovered dquot with\nxfs_dqblk_verify() and, on failure, sets error
  = -EFSCORRUPTED and jumps\nto out_release.  But out_release unconditionally returns
  0, so the\ncorruption error is discarded: the caller xlog_recover_items_pass2()\n\
  sees success, log recovery proceeds as if the dquot were valid, and the\ncorrupt
  quota buffer can be written back to disk."
