title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  Fix use-after-free bugs caused by sco_sock_timeout\n\nWhen the sco connection is
  established and then, the sco socket\nis releasing, timeout_work will be scheduled
  to judge whether\nthe sco disconnection is timeout. The sock will be deallocated\n\
  later, but it is dereferenced again in sco_sock_timeout. As a\nresult, the use-after-free
  bugs will happen. The root cause is\nshown below:\n\n    Cleanup Thread        \
  \       |      Worker Thread\nsco_sock_release                 |\n  sco_sock_close\
  \                 |\n    __sco_sock_close             |\n      sco_sock_set_timer\
  \         |\n        schedule_delayed_work    |\n  sco_sock_kill               \
  \   |    (wait a time)\n    sock_put(sk) //FREE          |  sco_sock_timeout\n \
  \                                |    sock_hold(sk) //USE\n\nThe KASAN report triggered
  by POC is shown below:\n\n[   95.890016] ==================================================================\n\
  [   95.890496]"
