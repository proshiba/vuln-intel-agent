title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  pin conn during async oplock break notification\n\nsmb2_oplock_break_noti() and
  smb2_lease_break_noti() store a ksmbd_conn\npointer in an async ksmbd_work and then
  queue that work on ksmbd-io.  The\nwork only increments conn->r_count, which prevents
  teardown from passing\nthe pending-request wait after the increment, but it does
  not pin the\nstruct ksmbd_conn object.\n\nIf connection teardown races with an oplock
  break notification, the last\nconn reference can be dropped before the queued worker
  finishes.  The\nworker then uses the freed conn in ksmbd_conn_write() and\nksmbd_conn_r_count_dec().\n\
  \nTake a real conn reference when publishing the conn pointer to the async\nwork
  item, and drop it after the notification work has decremented\nr_count.  Apply the
  same lifetime rule to lease break notification, which\nuses the same work->conn
  pattern."
