title: TBEA TLogger V2.1.0.0B0.0.0.0 exposes a UART interface on the device's 
  circuit board without sufficient protection. A physically proximate attacker 
  can connect to the UART interface and observe the device boot process and 
  runtime debug output. The disclosed information includes operating system 
  details, software versions, network configuration, filesystem paths, and other
  implementation and debugging information that may assist an attacker in 
  further compromising the device.
