title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  pfcp: allocate per-cpu tstats for PFCP netdevs\n\nPFCP uses dev_get_tstats64() as
  its ndo_get_stats64 callback, but\npfcp_link_setup() does not request NETDEV_PCPU_STAT_TSTATS.\
  \  The net\ncore therefore leaves dev->tstats NULL for PFCP devices.\n\nCreating
  a PFCP rtnetlink device can immediately ask the new netdev for\nstats while building
  the RTM_NEWLINK notification.  That reaches\ndev_get_tstats64() and dereferences
  the NULL dev->tstats pointer.\n\nSet pcpu_stat_type to NETDEV_PCPU_STAT_TSTATS during
  PFCP link setup so\nthe net core allocates the storage expected by dev_get_tstats64()."
