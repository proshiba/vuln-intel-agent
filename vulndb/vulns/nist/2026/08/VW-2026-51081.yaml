title: openssl_encrypt before 1.4.9 fails to validate KDF cost parameters in 
  encrypted file metadata and keystore headers, allowing attackers to trigger 
  unbounded memory allocation. Attackers can craft malicious encrypted files 
  declaring arbitrarily large Argon2, scrypt, or balloon KDF parameters to 
  exhaust system memory and crash the process without authentication.
