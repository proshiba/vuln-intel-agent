title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndmaengine:
  tegra: Fix burst size calculation\n\nCurrently, the Tegra GPC DMA hardware requires
  the transfer length to\nbe a multiple of the max burst size configured for the channel.
  When a\nclient requests a transfer where the length is not evenly divisible by\n\
  the configured max burst size, the DMA hangs with partial burst at\nthe end.\n\n\
  Fix this by reducing the burst size to the largest power-of-2 value\nthat evenly
  divides the transfer length. For example, a 40-byte\ntransfer with a 16-byte max
  burst will now use an 8-byte burst\n(40 / 8 = 5 complete bursts) instead of causing
  a hang.\n\nThis issue was observed with the PL011 UART driver where TX DMA\ntransfers
  of arbitrary lengths were stuck."
