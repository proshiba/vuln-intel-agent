title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  esd_usb: kill anchored URBs before freeing netdevs\n\nesd_usb_disconnect() frees
  each CAN netdev with free_candev() inside\nits per-netdev loop and only calls unlink_all_urbs(dev)
  afterwards.\nThe per-netdev private data (struct esd_usb_net_priv) is embedded in\n\
  the net_device allocation returned by alloc_candev(), so once\nfree_candev() has
  run, dev->nets[i] points to freed memory.\nunlink_all_urbs() then dereferences the
  freed dev->nets[i] to kill the\nper-netdev TX anchor (usb_kill_anchored_urbs(&priv->tx_submitted)),\n\
  clear active_tx_jobs, and reset priv->tx_contexts[].\n\nReorder the teardown so
  the anchored URBs are killed before the netdevs\nare freed, matching other CAN/USB
  drivers in the same directory such as\nems_usb, usb_8dev and mcba_usb, which unregister,
  then unlink, then\nfree: unregister the netdevs first (which stops their TX queues),
  call\nunlink_all_urbs(dev) once, then free the netdevs.\n\nThis issue was foun"
