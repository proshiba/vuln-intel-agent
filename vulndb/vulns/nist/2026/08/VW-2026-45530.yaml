title: Typemill before 2.26.0 contains an authorization bypass vulnerability in 
  the media file download route that allows unauthenticated attackers to access 
  restricted files by submitting path-equivalent URL variants. Attackers can 
  substitute normalized path forms such as dot-slash prefixes, double slashes, 
  or percent-encoded sequences to pass role-based restriction checks while the 
  filesystem resolves the request to the protected file, enabling unauthorized 
  file download without credentials.
