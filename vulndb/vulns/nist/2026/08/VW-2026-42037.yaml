title: A server-side request forgery vulnerability in Pinry through 2.1.13 
  allows unauthenticated remote attackers to make the server issue HTTP requests
  to arbitrary internal or external hosts via the pin-from-URL feature. The 
  feature passes the user-supplied URL directly to requests.get() without host 
  or IP validation, and ALLOW_NEW_REGISTRATIONS defaults to true enabling 
  anonymous triggering. An attacker can reach internal services or cloud 
  metadata endpoints from the server.
