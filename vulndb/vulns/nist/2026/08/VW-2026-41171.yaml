title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate num_subauth when copying ACE in set_ntacl_dacl\n\nset_ntacl_dacl() copies
  each ACE from the attacker-controlled stored\nsecurity descriptor verbatim into
  the response DACL without checking\nsid.num_subauth. The ACE bytes (including an
  unchecked num_subauth)\noriginate from an authenticated SMB2_SET_INFO(SecInfo=DACL)
  that is\nstored raw via ksmbd_vfs_set_sd_xattr(); parse_dacl() rejects a bad ACE\n\
  with `break` rather than an error, so parse_sec_desc() still returns\nsuccess and
  the malformed SD reaches the xattr intact.\n\nOn a subsequent SMB2_QUERY_INFO(SecInfo=DACL)
  for an inode carrying a\nPOSIX access ACL, build_sec_desc() -> set_ntacl_dacl()
  ->\nset_posix_acl_entries_dacl() walks the copied ACEs and reads\n\n    ntace->sid.sub_auth[ntace->sid.num_subauth
  - 1]\n\nwith num_subauth taken straight from the stored SD. Since sub_auth[]\nis
  fixed at SID_MAX_SUB_AUTHORITIES (15), a crafted num_subauth (e.g.\n255) drives
