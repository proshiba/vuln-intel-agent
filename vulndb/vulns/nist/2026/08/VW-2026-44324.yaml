title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  spi-nor: swp: Improve locking user experience\n\nIn the case of the first block
  being locked (or the few first blocks),\nif the user want to fully unlock the device
  it has two possibilities:\n- either it asks to unlock the entire device, and this
  works;\n- or it asks to unlock just the block(s) that are currently locked,\n  which
  fails.\n\nIt fails because the conditions \"can_be_top\" and \"can_be_bottom\" are\n\
  true. Indeed, in this case, we unlock everything, so the TB bit does not\nmatter.
  However in the current implementation, use_top would be true (as\nthis is the favourite
  option) and lock_len, which in practice should be\nreduced down to 0, is set to
  \"nor->params->size - (ofs + len)\" which is\na positive number. This is wrong.\n\
