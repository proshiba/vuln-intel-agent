title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/x25:
  fix use-after-free of the socket by its timers\n\nThe x25 timers are armed with
  mod_timer() and cancelled with\ntimer_delete(), so a pending timer holds no reference
  on the socket and a\ncancel does not wait for a callback already running on another
  CPU.\n\nx25_heartbeat_expiry() also rearms unconditionally, so it can reinstall\n\
  sk->sk_timer after __x25_destroy_socket() has passed its cancel point.\nThe following
  __sock_put() frees the socket while the timer is still\nqueued, and the next expiry
  uses freed memory.  KASAN reports a\nslab-use-after-free on the kmalloc-2k object
  freed by close().\n\ntimer_delete_sync() cannot be used here: x25_heartbeat_expiry()
  and\nx25_timer_expiry() both reach the cancels from inside the timer they\nwould
  wait on, through __x25_destroy_socket() and x25_disconnect().\n\nArm the timers
