title: "FastGPT is an open-source LLM platform for building AI applications on a knowledge
  base. In versions prior to 4.15.2, the WeChat (iLink) share-channel endpoints authorize
  requests using only the public shareId, with no authenticated identity or team-ownership
  check. As a result, an unauthenticated attacker who knows a victim team's shareId
  can take that team's WeChat bot offline or hijack the channel to their own bot:
  the logout endpoint is gated only by an existence check yet wipes the outLink's
  stored WeChat token, and the QR-code status endpoint performs no authorization at
  all and writes attacker-supplied bot credentials into the outLink identified by
  shareId. By generating a QR for a victim shareId, scanning it with their own WeChat,
  and calling the status endpoint, an attacker binds the victim team's app to the
  attacker's bot, exposing the app's private responses, displacing the legitimate
  binding, and consuming the victim's resources. The shareId is exposed in every shared
  chat "
