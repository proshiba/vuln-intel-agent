title: 'Vulnerability in the Oracle Hyperion Financial Management product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows low privileged attacker with network access
  via HTTP to compromise Oracle Hyperion Financial Management.  Successful attacks
  require human interaction from a person other than the attacker and while the vulnerability
  is in Oracle Hyperion Financial Management, attacks may significantly impact additional
  products (scope change). Successful attacks of this vulnerability can result in  unauthorized
  access to critical data or complete access to all Oracle Hyperion Financial Management
  accessible data as well as  unauthorized update, insert or delete access to some
  of Oracle Hyperion Financial Management accessible data. CVSS 3.1 Base Score 7.6
  (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:L/A:N).'
