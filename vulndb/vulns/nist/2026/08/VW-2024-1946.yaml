title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  pch_can: pch_can_rx_normal: fix use after free\n\nAfter calling netif_receive_skb(skb),
  dereferencing skb is unsafe.\nEspecially, the can_frame cf which aliases skb memory
  is dereferenced\njust after the call netif_receive_skb(skb).\n\nReordering the lines
  solves the issue."
