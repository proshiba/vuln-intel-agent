title: "Data::Entropy versions before 0.010 for Perl read remote entropy sources over
  plain HTTP.\n\nThe Data::Entropy::RawSource::RandomOrg and Data::Entropy::RawSource::RandomnumbersInfo
  remote sources are accessed over plain HTTP.\n\nThe Data::Entropy::RawSource::RandomOrg
  integrity check trivially matches any non-empty byte string.\n\nAny on-path attacker,
  such as open WiFi, a compromised ISP, captive portal, or a hostile egress proxy
  substitutes the response and thereby chooses the bytes returned by rand_bits and
  rand_int for every application that selected one of these sources via with_entropy_source.
  The _checkbuf method response is equally attacker-controlled, so the retry/sleep
  behaviour is steerable too."
