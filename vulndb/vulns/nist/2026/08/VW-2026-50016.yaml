title: "Uncontrolled Resource Consumption vulnerability in Apache Tomcat via an allocation
  leak in the HTTP/2 backlog tracking when a stream is reset\n\n\n\nThis issue affects
  Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from
  9.0.39 through 9.0.120.\n\n\n\nThe following versions were EOL at the time the CVE
  was created but are \nknown to be affected: from 8.5.59 through 8.5.100. Other unsupported
  versions may also be affected.\n\n\n\nUsers are recommended to upgrade to version
  11.0.25, 10.1.58 or 9.0.121, which fix the issue."
