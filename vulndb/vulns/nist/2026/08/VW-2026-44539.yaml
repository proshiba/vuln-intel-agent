title: "In the Linux kernel, the following vulnerability has been resolved:\n\niomap:
  release pages on atomic dio size mismatch\n\nIf bio_iov_iter_get_pages() or the
  bounce helper succeeds but builds a\nshort bio, the REQ_ATOMIC size check rejects
  it before submission.  The\nold error path only dropped the bio reference, leaving
  any pages already\nattached to the bio unreleased.\n\nRelease or unbounce the pages
  before falling through to out_put_bio on\nthis error path.\n\nThis bug was reported
  by sashiko:\nhttps://sashiko.dev/#/patchset/20260608073134.95964-1-changfengnan%40bytedance.com"
