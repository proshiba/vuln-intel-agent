title: Ech0 through 4.2.1 contains a server-side request forgery vulnerability 
  in the validateWebhookURL function (webhook_setting_service.go), which only 
  validates literal IP addresses via net.ParseIP() and fails to reject hostnames
  that DNS-resolve to private or internal IPs (e.g., 169.254.169.254.nip.io). An
  attacker with admin privileges can create a webhook with such a hostname to 
  bypass validation and cause the server to make requests to internal services, 
  cloud metadata endpoints, and private network resources. The issue is fixed in
  4.4.3.
