title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix double put of @cfile in smb2_set_path_size()\n\nIf smb2_compound_op()
  is called with a valid @cfile and returned\n-EINVAL, we need to call cifs_get_writable_path()
  before retrying it\nas the reference of @cfile was already dropped by previous call.\n\
  \nThis fixes the following KASAN splat when running fstests generic/013\nagainst
  Windows Server 2022:\n\n  CIFS: Attempting to mount //w22-fs0/scratch\n  run fstests
  generic/013 at 2024-09-02 19:48:59\n  ==================================================================\n\
  \  BUG: KASAN: slab-use-after-free in detach_if_pending+0xab/0x200\n  Write of size
  8 at addr ffff88811f1a3730 by task kworker/3:2/176\n\n  CPU: 3 UID: 0 PID: 176 Comm:
  kworker/3:2 Not tainted 6.11.0-rc6 #2\n  Hardware name: QEMU Standard PC (Q35 +
  ICH9, 2009), BIOS 1.16.3-2.fc40\n  04/01/2014\n  Workqueue: cifsoplockd cifs_oplock_break
  [cifs]\n  Call Trace:\n   <TASK>\n   dump_stack_lvl+0x5d/0x80\n   ? detach_i"
