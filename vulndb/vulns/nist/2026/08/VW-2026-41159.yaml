title: "entr is vulnerable to Heap-based buffer overflow in run_utility() function.
  The function allocates a fixed-size heap buffer using malloc(ARG_MAX) and copies
  command-line arguments into it. It advances the destination pointer based on the
  return value of strlcpy(), which returns the total length of the source string rather
  than the number of bytes written. When the buffer is exactly filled, the remaining
  size underflows as an unsigned size_t, causing subsequent copies to write out of
  bounds. This can be triggered by supplying command-line arguments whose combined
  length fills the buffer, or via the /_ substitution feature which expands a short
  token into a longer pathname at runtime. The local attacker can cause memory corruption,
  process abort, and denial of service. \n\n\nThis issue was fixed in commit 2467fe0"
