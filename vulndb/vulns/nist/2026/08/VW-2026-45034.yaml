title: The Link Library plugin for WordPress is vulnerable to arbitrary file 
  deletion due to insufficient file path validation in the ll_delete_link_fields
  function in all versions up to, and including, 7.9.4 This makes it possible 
  for unauthenticated attackers to delete arbitrary files on the server, which 
  can easily lead to remote code execution when the right file is deleted (such 
  as wp-config.php). Exploitation requires the administrator to have enabled the
  'Delete local file on link deletion' plugin option (disabled by default) and 
  to subsequently permanently delete the attacker-submitted link, which is a 
  routine moderation action.
