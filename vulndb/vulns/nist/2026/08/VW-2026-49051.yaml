title: Multiple DrayTek VigorAP models contain a command injection vulnerability
  in the ExportSettings function. The vulnerability is caused by insufficient 
  filtering of the backupkey, backuptype, and realtime fields before command 
  execution. A remote attacker can trigger this vulnerability via crafted input 
  to execute arbitrary commands with root privileges. Exploitation requires 
  valid administrative credentials for the device's web management interface.
