title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/ct:
  prevent UAF in send_recv()\n\nEnsure we serialize with completion side to prevent
  UAF with fence going\nout of scope on the stack, since we have no clue if it will
  fire after\nthe timeout before we can erase from the xa. Also we have some dependent\n\
  loads and stores for which we need the correct ordering, and we lack the\nneeded
  barriers. Fix this by grabbing the ct->lock after the wait, which\nis also held
  by the completion side.\n\nv2 (Badal):\n - Also print done after acquiring the lock
  and seeing timeout.\n\n(cherry picked from commit 52789ce35c55ccd30c4b67b9cc5b2af55e0122ea)"
