title: Agno up to and including 2.5.8 is vulnerable to Remote Code Execution 
  (RCE) via prompt injection. The PythonTools and ShellTools components pass 
  unsanitized, LLM-generated arguments directly to execution sinks including 
  exec(), runpy.run_path(), and subprocess.run(). An unauthenticated attacker 
  can exploit this by embedding malicious instructions in content processed by 
  the agent (such as web pages or documents), allowing for arbitrary code and OS
  command execution on the host server.
