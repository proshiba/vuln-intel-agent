title: A flaw was found in acm-search-v2-rhel9. An attacker with administrative 
  privileges on the hub cluster, specifically with patch access to the Search 
  Custom Resource (CR), could exploit a vulnerability in the 
  `Collector.ImageOverride` field. This allows the attacker to deploy an 
  arbitrary container image across all managed clusters. The consequence is 
  remote code execution (RCE), enabling the attacker to execute commands and 
  potentially access sensitive information across the entire fleet of managed 
  clusters.
