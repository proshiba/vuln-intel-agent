title: "Sony XAV-9500ES l2_reassemble_sdu Heap-based Buffer Overflow Remote Code Execution
  Vulnerability. This vulnerability allows network-adjacent attackers to execute arbitrary
  code on affected installations of Sony XAV-9500ES devices. An attacker must first
  obtain the ability to pair a malicious Bluetooth device with the target system in
  order to exploit this vulnerability.\n\nThe specific flaw exists within the handling
  of Bluetooth L2CAP packets. The issue results from the lack of proper validation
  of the length of user-supplied data prior to copying it to a heap-based buffer.
  An attacker can leverage this vulnerability to execute code in the context of the
  device. Was ZDI-CAN-29072."
