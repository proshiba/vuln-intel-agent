title: A flaw was found in multicluster-global-hub. During a 
  ManagedClusterMigration, the system incorrectly grants all managed hubs read 
  access to a shared communication topic. This allows a compromised managed hub 
  to intercept and collect sensitive bootstrap kubeconfigs, which contain API 
  server tokens intended for other hubs. These tokens have an extended validity 
  of approximately 9.86 years, significantly increasing the risk of unauthorized
  access and information disclosure to other managed clusters.
