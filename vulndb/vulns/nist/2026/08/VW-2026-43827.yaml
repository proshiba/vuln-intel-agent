title: OpenChoreo is a complete, open-source developer platform for Kubernetes. 
  From 1.2.0-rc.1 until 1.2.0, internal/openchoreo-api/api/handlers/exec.go and 
  internal/openchoreo-api/api/handlers/wirelogs.go authorize component:exec and 
  wirelogs:view using the caller-supplied project query parameter instead of 
  comp.Spec.Owner.ProjectName, allowing a user with a project-scoped grant to 
  execute commands in and read wirelogs from components owned by other projects 
  in the same namespace. This vulnerability is fixed in 1.2.0.
