title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  dwc3: Wait unconditionally after issuing EndXfer command\n\nCurrently all controller
  IP/revisions except DWC3_usb3 >= 310a\nwait 1ms unconditionally for ENDXFER completion
  when IOC is not\nset. This is because DWC_usb3 controller revisions >= 3.10a\nsupports
  GUCTL2[14: Rst_actbitlater] bit which allows polling\nCMDACT bit to know whether
  ENDXFER command is completed.\n\nConsider a case where an IN request was queued,
  and parallelly\nsoft_disconnect was called (due to ffs_epfile_release). This\neventually
  calls stop_active_transfer with IOC cleared, hence\nsend_gadget_ep_cmd() skips waiting
  for CMDACT cleared during\nEndXfer. For DWC3 controllers with revisions >= 310a,
  we don't\nforcefully wait for 1ms either, and we proceed by unmapping the\nrequests.
  If ENDXFER didn't complete by this time, it leads to\nSMMU faults since the controller
  would still be accessing those\nrequests.\n\nFix this by ensuring ENDXFER completion
  by adding"
