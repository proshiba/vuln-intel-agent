title: 'Vulnerability in the Siebel Apps - Self Service product of Oracle Siebel CRM
  (component: Helpdesk/Training).  Supported versions that are affected are 17.0-26.6.
  Easily exploitable vulnerability allows unauthenticated attacker with network access
  via HTTP to compromise Siebel Apps - Self Service.  Successful attacks require human
  interaction from a person other than the attacker and while the vulnerability is
  in Siebel Apps - Self Service, attacks may significantly impact additional products
  (scope change). Successful attacks of this vulnerability can result in  unauthorized
  creation, deletion or modification access to critical data or all Siebel Apps -
  Self Service accessible data as well as  unauthorized access to critical data or
  complete access to all Siebel Apps - Self Service accessible data. CVSS 3.1 Base
  Score 9.3 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N).'
