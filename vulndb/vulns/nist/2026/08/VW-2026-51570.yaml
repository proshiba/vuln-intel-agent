title: "CVE-2025-40843 https://github.com/advisories/GHSA-5xf2-f6ch-6p8r  was fixed
  by replacing unchecked strcpy() with a bounded safe_strcpy() helper.\nAt ldlogger-tool-gcc.c:129 the
  destination passed to that helper is fullPath + 2, but the size\npassed down is
  the full PATH_MAX. safe_strcpy() is strncpy(), which NUL-pads the\ndestination out
  to the whole n, so this site writes 4096 bytes into the 4094 that remain — a\n2-byte
  stack overflow on every invocation, independent of the input path's length.\n\n\n\
  \nThis issue affects CodeChecker: through 6.28.2."
