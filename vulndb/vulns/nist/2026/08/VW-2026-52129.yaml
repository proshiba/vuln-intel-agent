title: ILIAS versions before 9.22, 10.0 through 10.9, and 11.0 through 11.2 
  contain an arbitrary file read vulnerability in the SOAP addFile method that 
  allows authenticated users to read server files by supplying crafted XML with 
  COPY-mode imports. Attackers can construct absolute file paths through an 
  unsandboxed import directory and retrieve sensitive files including 
  configuration files containing database credentials and setup passwords.
