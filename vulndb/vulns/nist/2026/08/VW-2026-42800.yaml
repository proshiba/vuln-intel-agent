title: DB-GPT v0.8.1 contains an unauthenticated path traversal vulnerability 
  that allows remote attackers to write arbitrary files to any location on the 
  server by injecting directory traversal sequences into the user_id HTTP header
  of the Python file-upload endpoint. Attackers can send a crafted multipart 
  upload request with a traversal-poisoned user_id header to escape the intended
  upload directory and write attacker-controlled content to locations such as 
  Python startup hooks, cron directories, or agent scripts, resulting in remote 
  code execution.
