title: A Stored Cross-Site Scripting (XSS) vulnerability exists in the Meeting 
  location field of the Create/Edit Conference functionality in TrueConf Server 
  v5.5.2.10813. The injected payload is stored via the meeting_room parameter 
  and executed when users visit the Conference Info page, allowing attackers to 
  achieve full Account Takeover (ATO). This issue is caused by improper 
  sanitization of user-supplied input in the meeting_room field.
