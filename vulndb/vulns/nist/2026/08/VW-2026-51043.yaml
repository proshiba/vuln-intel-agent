title: The OpenFaaS gateway registers GET /system/telemetry in gateway/main.go 
  and, when basic_auth is enabled, wraps each administrative /system/* handler 
  in auth.DecorateWithBasicAuth. TelemetryHandler was left out of that wrap 
  block from 0.27.11, which introduced the route, until 0.27.14, which added it.
  On an affected gateway the route therefore reaches the forwarding proxy with 
  no credential check and returns whatever the configured provider serves for 
  /system/telemetry, so any client that can reach the gateway port can read the 
  provider's telemetry regardless of the basic_auth setting. The exposed content
  depends on the provider, and covers resource and invocation metrics for faasd 
  and pod or cluster state for faas-netes.
