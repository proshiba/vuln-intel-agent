title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  pcm: oss: Fix race at SNDCTL_DSP_SYNC\n\nThere is a small race window at snd_pcm_oss_sync()
  that is called from\nOSS PCM SNDCTL_DSP_SYNC ioctl; namely the function calls\n\
  snd_pcm_oss_make_ready() at first, then takes the params_lock mutex\nfor the rest.\
  \  When the stream is set up again by another thread\nbetween them, it leads to
  inconsistency, and may result in unexpected\nresults such as NULL dereference of
  OSS buffer as a fuzzer spotted\nrecently.\n\nThe fix is simply to cover snd_pcm_oss_make_ready()
  call into the same\nparams_lock mutex with snd_pcm_oss_make_ready_locked() variant."
