title: "In the Linux kernel, the following vulnerability has been resolved:\n\nieee802154:
  ca8210: fix pointer truncation in kfifo on 64-bit\n\nca8210_test_int_driver_write()
  and ca8210_test_int_user_read() exchange\na kmalloc'd buffer pointer through a struct
  kfifo, but pass a literal\n'4' as the byte count to kfifo_in()/kfifo_out().\n\n\
  This is correct on 32-bit (pointer = 4 bytes), but on 64-bit only the\nlow 4 bytes
  of the 8-byte pointer are written into the FIFO. The reader\nthen reads back 4 bytes
  into an 8-byte local pointer variable, leaving\nthe upper 4 bytes uninitialized
  stack data. The first dereference of\nthe reconstructed pointer (fifo_buffer[1])
  accesses an arbitrary kernel\naddress and generally results in an oops.\n\nUse sizeof(fifo_buffer)
  so the byte count matches pointer width on every\narchitecture.\n\nThe driver has
  no architecture restriction in Kconfig, so any 64-bit\nbuild with CONFIG_IEEE802154_CA8210_DEBUGFS=y
  is exposed. Issue has\nbeen latent since the driver was added in 2017 because"
