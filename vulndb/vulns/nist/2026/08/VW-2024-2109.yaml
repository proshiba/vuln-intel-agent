title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/rxe:
  Fix responder length checking for UD request packets\n\nAccording to the IBA specification:\n\
  If a UD request packet is detected with an invalid length, the request\nshall be
  an invalid request and it shall be silently dropped by\nthe responder. The responder
  then waits for a new request packet.\n\ncommit 689c5421bfe0 (\"RDMA/rxe: Fix incorrect
  responder length checking\")\ndefers responder length check for UD QPs in function
  `copy_data`.\nBut it introduces a regression issue for UD QPs.\n\nWhen the packet
  size is too large to fit in the receive buffer.\n`copy_data` will return error code
  -EINVAL. Then `send_data_in`\nwill return RESPST_ERR_MALFORMED_WQE. UD QP will transfer
  into\nERROR state."
