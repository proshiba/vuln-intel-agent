title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/siw:
  Fix endpoint/socket association handling\n\nDisassociating a socket from an endpoint
  via siw_socket_disassoc() may\nrelease the last reference on that endpoint and free
  it. Therefore, don't\nclear the endpoints socket pointer after calling that function,
  but\nwithin.\n\nThis fixes a:\n\n  BUG: KASAN: slab-use-after-free in siw_cm_work_handler
  (drivers/infiniband/sw/siw/siw_cm.c:1053 drivers/infiniband/sw/siw/siw_cm.c:1075)\n\
  \nwhich occurred after processing a malformed MPA request during connection\nestablishment,
  causing the new endpoint to be closed."
