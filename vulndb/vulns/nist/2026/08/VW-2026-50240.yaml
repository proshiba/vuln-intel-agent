title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  core: pair EH runtime PM get and put\n\nshost->eh_noresume is currently consulted
  twice in one error handling\niteration: once before scsi_autopm_get_host() and once
  again before\nscsi_autopm_put_host().\n\nThat is racy when a PM-triggered error
  path flips shost->eh_noresume\nwhile the SCSI EH thread is still running.\n\nThe
  problem flow looks like this:\nPM path\n  ufshcd_set_dev_pwr_mode()\n    shost->eh_noresume
  = 1\n    ufshcd_execute_start_stop  <-- trigger EH\n    ...\n    shost->eh_noresume
  = 0\n\nEH path\n  scsi_error_handler()\n    if (!shost->eh_noresume)\n      scsi_autopm_get_host()\
  \  <-- skipped\n    ...\n    if (!shost->eh_noresume)\n       scsi_autopm_put_host()\
  \  <-- executed later\n\nIn that case one EH iteration can skip autoresume on entry
  and still\ndrop a runtime PM reference on exit. That leaves an unmatched runtime
  PM\nput and can trigger a runtime PM usage count underflow.\n\nFix this by making
  eh_noresume a regular bo"
