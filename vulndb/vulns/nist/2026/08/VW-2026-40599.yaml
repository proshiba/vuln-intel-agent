title: "Heap type confusion vulnerability in Apache Fory C++ deserialization.\n\n\
  This issue affects Apache Fory C++ versions from 0.14.0 before 1.5.0. A crafted
  input payload can bypass type compatibility checks during polymorphic smart-pointer
  deserialization, causing an object of an incompatible type to be treated as the
  declared base type. This may result in undefined behavior and potentially lead to
  denial of service or arbitrary code execution.\n\n\nUsers are recommended to upgrade
  to Apache Fory 1.5.0, which fixes this issue. Applications not using Apache Fory
  C++ polymorphic smart-pointer deserialization are not affected."
