title: Nexus Repository 3 contains a Server-Side Request Forgery (SSRF) 
  vulnerability in the email configuration verification feature. A user holding 
  the nexus:settings:update permission could submit arbitrary host and port 
  values to the email test/verification endpoint, causing the server to attempt 
  outbound network connections to internal or otherwise restricted network 
  addresses. Differences in the server's response could be used to infer whether
  internal hosts and ports are reachable. This issue affects Nexus Repository 3 
  CE/Pro versions up to and including 3.94.1, and is fixed in version 3.95.0.
