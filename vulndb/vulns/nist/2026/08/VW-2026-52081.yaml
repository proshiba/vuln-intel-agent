title: A security flaw has been discovered in valkey-io valkey 9.1.0. The 
  affected element is the function handleClientsBlockedOnKey of the file 
  src/blocked.c of the component Blocked-on-keys Subsystem. The manipulation 
  results in use after free. The attack may be performed from remote. A high 
  complexity level is associated with this attack. The exploitability is 
  described as difficult. The exploit has been released to the public and may be
  used for attacks. The patch is identified as 
  b2fb0e13f5b4c8c2fb63dcfc2c37a067a0d6d20b. Applying a patch is advised to 
  resolve this issue.
