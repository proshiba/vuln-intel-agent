title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/panthor:
  validate firmware interface structure sizes\n\niface_fw_to_cpu_addr() only checks
  that the firmware-provided MCU virtual\naddress points inside the shared section.
  The returned pointer is later\nused as a full firmware interface structure, so accepting
  an address near\nthe end of the shared section can still lead to out-of-bounds accesses.\n\
  \nPass the expected object size to iface_fw_to_cpu_addr() and reject ranges\nthat
  do not fit entirely in the shared section."
