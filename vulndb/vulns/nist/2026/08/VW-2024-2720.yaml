title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  mscc: ocelot: fix incorrect IFH SRC_PORT field in ocelot_ifh_set_basic()\n\nPackets
  injected by the CPU should have a SRC_PORT field equal to the\nCPU port module index
  in the Analyzer block (ocelot->num_phys_ports).\n\nThe blamed commit copied the
  ocelot_ifh_set_basic() call incorrectly\nfrom ocelot_xmit_common() in net/dsa/tag_ocelot.c.
  Instead of calling\nwith \"x\", it calls with BIT_ULL(x), but the field is not a
  port mask,\nbut rather a single port index.\n\n[ side note: this is the technical
  debt of code duplication :( ]\n\nThe error used to be silent and doesn't appear
  to have other\nuser-visible manifestations, but with new changes in the packing\n\
  library, it now fails loudly as follows:\n\n------------[ cut here ]------------\n\
  Cannot store 0x40 inside bits 46-43 - will truncate\nsja1105 spi2.0: xmit timed
  out\nWARNING: CPU: 1 PID: 102 at lib/packing.c:98 __pack+0x90/0x198\nsja1105 spi2.0:
  timed out polling for tstamp\nCPU: 1 "
