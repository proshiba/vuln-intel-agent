title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - bound the F54 report size to the allocated buffer\n\nrmi_f54_work()
  reads a diagnostics report from the device into\nf54->report_data, sizing the transfer
  with rmi_f54_get_report_size():\n\n\treport_size = rmi_f54_get_report_size(f54);\n\
  \t...\n\tfor (i = 0; i < report_size; i += F54_REPORT_DATA_SIZE) {\n\t\tint size
  = min(F54_REPORT_DATA_SIZE, report_size - i);\n\t\t...\n\t\trmi_read_block(.., f54->report_data
  + i, size);\n\t}\n\nreport_data is allocated once at probe from F54's own electrode
  counts\n(array3_size(f54->num_tx_electrodes, f54->num_rx_electrodes, sizeof(u16))),\n\
  but rmi_f54_get_report_size() computes the size from\ndrv_data->num_*_electrodes
  when those are set, i.e. from the F55\nfunction's electrode counts. Both counts
  come straight from device\nqueries (F54 and F55 each report up to 255 electrodes)
  and nothing\nconstrains the F55 counts to the F54 ones.\n\nA malicious or malfunctioning
  RMI4 device that report"
