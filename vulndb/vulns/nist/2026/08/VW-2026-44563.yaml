title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (aspeed-g6-pwm-tach) Guard fan RPM calculation against divide-by-zero\n\nSashiko
  reports:\n\nIn the aspeed-g6-pwm-tacho driver, the aspeed_tach_val_to_rpm() function\n\
  calculates the fan RPM using the tachometer value. However, it does not\ncheck if
  the tachometer value is zero before performing the division.\n\nIf the hardware
  reports a tachometer value of 0 (which can happen due to\nan extremely fast pulse,
  a stuck edge, or a hardware glitch), the\ncalculated tach_div evaluates to 0. The
  subsequent call to do_div() with\ntach_div as the divisor triggers a divide-by-zero
  exception, leading to\na kernel panic.\n\nCheck the divisor against zero to fix
  the problem."
