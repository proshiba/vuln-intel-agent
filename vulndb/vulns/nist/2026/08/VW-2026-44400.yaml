title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  tt: avoid request storms during pending request\n\nbatadv_send_tt_request() allocates
  a tt_req_node when none exists for the\ndestination originator node. This should
  prevent that a multiple TT\nrequests are send at the same time to an originator.\n\
  \nBut if allocation of the send buffer failed, this request must be cleaned\nup
  again. But indicator for such a failure is \"ret == false\". But the\nactual implementation
  is checking for \"ret == true\".\n\nThe check must be inverted to not loose the
  information about the TT\nrequest directly after it was attempted to be sent out.
  This should avoid\npotential request storms."
