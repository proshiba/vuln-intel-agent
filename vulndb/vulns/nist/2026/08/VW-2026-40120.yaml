title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb/client:
  Fix error code in smb2_aead_req_alloc()\n\nThe \"*num_sgs\" variable is a u32 so
  \"ERR_PTR(*num_sgs)\" doesn't work.\nWe would have to do something similar to the
  previous line where it's\ncast to int and then long.  However, it's simpler to store
  the return in\nan int ret variable.\n\nThis bug would eventually result in a crash
  when dereference the invalid\nerror pointer."
