title: 'Vulnerability in the Oracle Hyperion Financial Reporting product of Oracle
  Hyperion (component: Server).   The supported version that is affected is 11.2.25.0.000.
  Difficult to exploit vulnerability allows unauthenticated attacker with access to
  the physical communication segment attached to the hardware where the Oracle Hyperion
  Financial Reporting executes to compromise Oracle Hyperion Financial Reporting.  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all Oracle Hyperion Financial Reporting
  accessible data as well as  unauthorized access to critical data or complete access
  to all Oracle Hyperion Financial Reporting accessible data. CVSS 3.1 Base Score
  6.8 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N).'
