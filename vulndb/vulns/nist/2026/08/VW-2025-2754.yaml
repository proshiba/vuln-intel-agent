title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix PTE marker handling in hugetlb_change_protection()\n\nPatch series \"mm/hugetlb:
  uffd-wp fixes for hugetlb_change_protection()\".\n\nPlaying with virtio-mem and
  background snapshots (using uffd-wp) on\nhugetlb in QEMU, I managed to trigger a
  VM_BUG_ON().  Looking into the\ndetails, hugetlb_change_protection() seems to not
  handle uffd-wp correctly\nin all cases.\n\nPatch #1 fixes my test case.  I don't
  have reproducers for patch #2, as it\nrequires running into migration entries.\n\
  \nI did not yet check in detail yet if !hugetlb code requires similar care.\n\n\n\
  This patch (of 2):\n\nThere are two problematic cases when stumbling over a PTE
  marker in\nhugetlb_change_protection():\n\n(1) We protect an uffd-wp PTE marker
  a second time using uffd-wp: we will\n    end up in the \"!huge_pte_none(pte)\"\
  \ case and mess up the PTE marker.\n\n(2) We unprotect a uffd-wp PTE marker: we
  will similarly end up in the\n    \"!huge_pte_none(pte)\" cas"
