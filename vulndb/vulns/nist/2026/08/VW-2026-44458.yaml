title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: vgic: Check the interrupt is still ours before migrating it\n\nvgic_prune_ap_list()
  drops both ap_list_lock and irq_lock while migrating\nan interrupt to another vCPU.
  After reacquiring the locks it only checks\nthat the affinity is unchanged (target_vcpu
  == vgic_target_oracle(irq))\nbefore moving the interrupt, which assumes that an
  interrupt whose affinity\nis preserved is still queued on this vCPU's ap_list.\n\
  \nThat assumption no longer holds if the interrupt is taken off the ap_list\nwhile
  the locks are dropped. vgic_flush_pending_lpis() removes the\ninterrupt from the
  list and sets irq->vcpu to NULL, but leaves\nenabled/pending/target_vcpu untouched.
  As the interrupt is still enabled\nand pending, vgic_target_oracle() returns the
  same target_vcpu, so the\naffinity check passes and list_del() is run a second time
  on an entry that\nhas already been removed.\n\nAlso check that the interrupt is
  still assigned to this vCP"
