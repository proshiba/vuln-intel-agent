title: "A vulnerability in the Cisco FXOS Software CLI feature for Cisco Secure Firewall
  ASA Software and Secure FTD Software could allow an authenticated, local attacker
  to execute arbitrary commands on the underlying operating system with root-level
  privileges. To exploit this vulnerability, the attacker must have valid administrative
  credentials on an affected device.\r\n\r This vulnerability is due to insufficient
  input validation of user-supplied command arguments. An attacker could exploit this
  vulnerability by submitting crafted input for specific CLI commands. A successful
  exploit could allow the attacker to execute commands on the underlying operating
  system with root-level privileges."
