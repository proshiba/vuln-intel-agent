title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbridge:
  stp: Fix a potential use-after-free when deleting a bridge\n\nThe three STP timers
  are not supposed to be armed while the bridge is\nadministratively down. They are
  synchronously deactivated when the\nbridge is put administratively down and the
  various call sites check for\n'IFF_UP' before arming them.\n\nThis check is missing
  from br_topology_change_detection() and it is\npossible to engineer a situation
  in which the topology change timer is\narmed while the bridge is administratively
  down, resulting in a\nuse-after-free [1] when the bridge is deleted.\n\nFix by adding
  the missing check and for good measures synchronously\nshutdown the three timers
  when the bridge is deleted.\n\n[1]\nODEBUG: free active (active state 0) object:
  ffff88811662b9b0 object type: timer_list hint: br_topology_change_timer_expired
  (net/bridge/br_stp_timer.c:120)\nWARNING: lib/debugobjects.c:629 at debug_print_object+0x1bc/0x450,
  CPU#9: ip/359"
