title: 'Vulnerability in the Oracle Agile Engineering Data Management product of Oracle
  Supply Chain (component: Engineering Communication Interface).   The supported version
  that is affected is 6.2.1. Difficult to exploit vulnerability allows unauthenticated
  attacker with network access via HTTP to compromise Oracle Agile Engineering Data
  Management.  Successful attacks of this vulnerability can result in  unauthorized
  update, insert or delete access to some of Oracle Agile Engineering Data Management
  accessible data as well as  unauthorized read access to a subset of Oracle Agile
  Engineering Data Management accessible data. CVSS 3.1 Base Score 4.8 (Confidentiality
  and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N).'
