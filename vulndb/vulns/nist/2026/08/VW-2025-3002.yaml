title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntracing/synthetic:
  Fix races on freeing last_cmd\n\nCurrently, the \"last_cmd\" variable can be accessed
  by multiple processes\nasynchronously when multiple users manipulate synthetic_events
  node\nat the same time, it could lead to use-after-free or double-free.\n\nThis
  patch add \"lastcmd_mutex\" to prevent \"last_cmd\" from being accessed\nasynchronously.\n\
  \n================================================================\n\nIt's easy
  to reproduce in the KASAN environment by running the two\nscripts below in different
  shells.\n\nscript 1:\n        while :\n        do\n                echo -n -e '\\\
  x88' > /sys/kernel/tracing/synthetic_events\n        done\n\nscript 2:\n       \
  \ while :\n        do\n                echo -n -e '\\xb0' > /sys/kernel/tracing/synthetic_events\n\
  \        done\n\n================================================================\n\
  double-free scenario:\n\n    process A                       process B\n-------------------\
  \             "
