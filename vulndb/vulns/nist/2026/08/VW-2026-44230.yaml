title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  sit: require CAP_NET_ADMIN in the device netns for changelink\n\nipip6_changelink()
  operates on at most two netns, dev_net(dev) and the\ntunnel link netns t->net. They
  differ once the device is created in or\nmoved to a netns other than the one the
  request runs in. The rtnl\nchangelink path checks CAP_NET_ADMIN only against dev_net(dev),
  so a\ncaller privileged there but not in t->net can rewrite a tunnel that\nlives
  in t->net.\n\nGate ipip6_changelink() on rtnl_dev_link_net_capable() at its top,\n\
  before any attribute is parsed. sit was the one tunnel type not covered\nby the
  recent series that added this check to the other changelink()\nhandlers."
