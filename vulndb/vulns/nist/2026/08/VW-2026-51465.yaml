title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/zcrypt:
  Fix wrong domain value verification with EP11 CPRBs\n\nThere is a wrong upper limit
  check for the domain value when an EP11\nCPRB is processed for sending to a crypto
  card. This check is only\nactive on custom device nodes but may lead to access heap
  memory\nbehind perms->adm when an administrative CPRB is sent.\nAdd correct limit
  (AP_DOMAINS = 256) checking to fix this."
