title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/vt-d:
  Avoid WARNING in sva unbind path\n\nThe Intel IOMMU driver allows SVA on devices
  even if they do not support\nPCI/PRI. Commit 39c20c4e83b9 (\"iommu/vt-d: Only handle
  IOPF for SVA when\nPRI is supported\") modified the SVA bind path to allow this
  configuration\nby skipping IOPF enablement when PRI is missing. However, it failed
  to\nupdate the unbind path.\n\nThis creates an imbalance: the unbind path attempts
  to disable IOPF for\na device that never had it enabled, triggering a WARNING in\n\
  intel_iommu_disable_iopf():\n\n WARNING: drivers/iommu/intel/iommu.c:3475 at intel_iommu_disable_iopf+0x4f/0x90d\n\
  \ Call Trace:\n  <TASK>\n  blocking_domain_set_dev_pasid+0x50/0x70\n  iommu_detach_device_pasid+0x89/0xc0\n\
  \  iommu_sva_unbind_device+0x73/0x150\n  xe_vm_close_and_put+0x4d2/0x1200 [xe]\n\
  \nFix this by bypassing IOPF operations for SVA domains on non-PRI hardware\nin
  both the bind and unbind paths."
