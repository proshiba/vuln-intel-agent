title: A vulnerability was found in Wavlink WL-NU516U1 708c073-mt7628. This 
  impacts the function change_password of the file nas.cgi. The manipulation of 
  the argument User1Passwd results in stack-based buffer overflow. The attack 
  can be executed remotely. The exploit has been made public and could be used. 
  The affected component should be upgraded. The vendor was contacted early, 
  responded in a very professional manner and quickly released a fixed version 
  of the affected product.
