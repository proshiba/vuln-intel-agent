title: A vulnerability was detected in Blix Email Blue Mail Calendar App 
  2.2.305. Impacted is the function 
  FileDirectory.getDataColumn/FileDirectory.getFileFromUri of the component 
  react-native-receive-sharing-intent. The manipulation of the argument 
  _display_name results in path traversal. The attack is only possible with 
  local access. The exploit is now public and may be used. The vendor was 
  contacted early about this disclosure but did not respond in any way.
