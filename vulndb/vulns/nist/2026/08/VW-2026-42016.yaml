title: A broken access control vulnerability in Ladybird Web Solution Faveo 
  Helpdesk 2.0.3 allows any self-registered customer to read ticket 
  conversations belonging to other customers via the v1 REST API. The API 
  verifies the existence of the requested ticket but not ownership, enabling any
  authenticated user to access arbitrary ticket threads including internal agent
  notes containing sensitive information.
