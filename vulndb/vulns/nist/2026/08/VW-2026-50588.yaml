title: "LimeSurvey Community Edition 7.0.5 contains a stored cross-site scripting
  vulnerability in the Survey Menu Entries administration page. An authenticated user
  with the global settings:read permission can create a survey menu entry containing
  attacker-controlled data. The value is stored in the surveymenu_entries.data field
  and later inserted into a single-quoted HTML title attribute without context-appropriate
  encoding.\n\nThis issue affects LimeSurvey: 7.0.5."
