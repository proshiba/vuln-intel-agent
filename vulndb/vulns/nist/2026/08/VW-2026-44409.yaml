title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmfd:
  sm501: Fix reference leak on failed device registration\n\nWhen platform_device_register()
  fails in sm501_register_device(), the\nembedded struct device in pdev has already
  been initialized by\ndevice_initialize(), but the failure path only reports the
  error and\nreturns without dropping the device reference for the current platform\n\
  device:\n\n  sm501_register_device()\n    -> platform_device_register(pdev)\n  \
  \     -> device_initialize(&pdev->dev)\n       -> setup_pdev_dma_masks(pdev)\n \
  \      -> platform_device_add(pdev)\n\nThis leads to a reference leak when platform_device_register()
  fails.\nFix this by calling platform_device_put() before returning the error.\n\n\
  The issue was identified by a static analysis tool I developed and\nconfirmed by
  manual review."
