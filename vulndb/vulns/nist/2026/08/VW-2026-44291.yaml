title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: fix lockless bound/ifindex race and silent RX_SETUP failure\n\nbcm_sendmsg()
  reads bo->ifindex and checks bo->bound before taking\nlock_sock(), while bcm_notify(),
  bcm_connect() and bcm_release() all\nmutate both fields under that same lock. Because
  the lockless reads\nand the locked writes are unordered with respect to each other,
  a\nracing bcm_notify() (device unregister) or bcm_connect() (concurrent\nbind on
  another thread sharing the socket) can make bcm_sendmsg()\nobserve an inconsistent
  combination, e.g. a stale bound=1 together\nwith the now-cleared ifindex=0, silently
  turning a socket bound to a\nspecific CAN interface into one that also matches \"\
  any\" interface.\n\nKeep the lockless bo->bound check purely as a fast-path reject,
  and\nmove the ifindex read (and a bo->bound re-check) into the locked\nsection,
  where every writer already serializes. This removes the\npossibility of observing
  the two fields torn against "
