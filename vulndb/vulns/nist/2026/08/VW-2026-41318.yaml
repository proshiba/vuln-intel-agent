title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/bios:
  range check LFP Data Block panel_type2\n\nWhile the panel_type from LFP Data Block
  is range checked, panel_type2\nis not. Add a few helpers for range checking, and
  use them to not only\ncheck panel_type2, but also improve clarity and correctness
  in the panel\ntype selection.\n\nDiscovered using AI-assisted static analysis confirmed
  by Intel Product\nSecurity.\n\nv2:\n- Fix commit message typo (Michał)\n- Add is_panel_type_pnp()
  (Ville)\n\n(cherry picked from commit c9ebe5d2f25729d6cfbbb1235d640bf67f9275df)"
