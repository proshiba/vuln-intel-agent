title: 'Insufficient verification of data authenticity for some Intel(R) Trust Domain
  Extensions (Intel(R) TDX) within Ring 0: Hypervisor may allow an information disclosure.
  A system software adversary with a privileged user access combined with a high complexity
  attack may enable data exposure. This result may potentially occur via local access
  when attack requirements are present without any user interaction. The potential
  vulnerability may impact the confidentiality (high), integrity (low) and no effect
  on availability. Subsequent system impacts include reduced confidentiality (low),
  integrity (low), and no effect on availability.'
