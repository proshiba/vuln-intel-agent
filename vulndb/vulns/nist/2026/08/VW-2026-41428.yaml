title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwatchdog:
  pretimeout: Fix UAF in watchdog_unregister_governor()\n\nWhen a watchdog governor
  is unregistered, it updates existing watchdog\ndevices that were using this governor
  by falling back to `default_gov`.\n\nIf the governor being unregistered is currently
  set as `default_gov`,\nthe `default_gov` is never cleared.  This leads to 2 use-after-free\n\
  issues:\n1. New watchdog devices registered after this point will inherit the\n\
  \   dangling `default_gov`.\n2. Existing watchdog devices using the unregistered
  governor will have\n   their `wdd->gov` reassigned to the dangling `default_gov`.\n\
  \nFix the UAF by clearing `default_gov` if it matches the governor being\nunregistered."
