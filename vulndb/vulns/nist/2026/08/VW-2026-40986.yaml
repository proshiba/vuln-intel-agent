title: A security vulnerability has been detected in adafap api-mcp up to 
  92b9a5d04acfec165c7d4ef852496593aa87be06. This affects the function 
  customAxios of the file app/api/proxy/route.ts of the component Proxy API 
  Endpoint. The manipulation of the argument url leads to server-side request 
  forgery. The attack is possible to be carried out remotely. This product 
  adopts a rolling release strategy to maintain continuous delivery. Therefore, 
  version details for affected or updated releases cannot be specified. The 
  project was informed of the problem early through an issue report but has not 
  responded yet.
