title: "The kernel queue helper z_queue_node_peek() in kernel/queue.c dereferences
  a node taken from a queue's data_q list, reading the node's flag byte and, for items
  enqueued via k_queue_alloc_append/alloc_prepend, the data pointer of an internally
  allocated alloc_node struct. The implementations of z_impl_k_queue_peek_head() and
  z_impl_k_queue_peek_tail() performed this read-and-dereference without holding the
  queue's spinlock, while every other accessor of the same list — including k_queue_get(),
  which unlinks a node and k_free()s its backing alloc_node — operates under that
  lock.\n\nBecause peek was unsynchronized, a concurrent k_queue_get() on the same
  queue (on an SMP build, or under preemption/ISR concurrency) can free the node between
  the moment peek obtains the node pointer and the moment it dereferences it. The
  peek then reads flag bits and a data pointer out of freed, potentially re-allocated
  heap memory and returns a stale or dangling pointer to its caller. k_fifo and k_lifo
