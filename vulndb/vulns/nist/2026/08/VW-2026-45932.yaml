title: A flaw was found in the Submariner operator. This vulnerability allows 
  for the exposure of a long-lived broker service account (SA) bearer token 
  within the Submariner Custom Resource (CR) specification. An attacker with 
  access to the cluster's etcd database or through `kubectl get` commands could 
  obtain this token. The possession of this token grants full control over the 
  mesh network, enabling unauthorized management of network resources such as 
  endpoints and secrets.
