title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: qcom: reject stream disable with no active interface\n\nhandle_uaudio_stream_req()
  resolves an interface index with\ninfo_idx_from_ifnum(), which returns -EINVAL when
  no interface matches.\nThe enable branch and the response: cleanup label both guard
  against a\nnegative index, but the disable branch does not: it forms\ninfo = &uadev[pcm_card_num].info[info_idx]
  and dereferences it.\n\nuadev[].info is a pointer allocated only when a stream is
  first enabled,\nso a negative info_idx on the disable path is unsafe in two ways:\n\
  \n - If the card was never enabled, .info is NULL and &info[-EINVAL] is a\n   wild
  pointer; reading info->data_ep_pipe faults (kernel oops).\n\n - If the card was
  enabled at least once (.info allocated) and the\n   disable names an interface that
  does not match, &info[-EINVAL] points\n   before the allocation; info->data_ep_pipe
  / info->sync_ep_pipe are an\n   out-of-bounds slab read and, when non-z"
