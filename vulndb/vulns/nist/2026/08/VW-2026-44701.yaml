title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_hfsc: Don't make class passive twice\n\nupdate_vf() is called from two places
  for the same class during a single\ndequeue when the class's child qdisc (e.g. codel/fq_codel)
  drops its last\npackets while dequeuing:\n\n1. The child calls qdisc_tree_reduce_backlog(),
  which, now that the child\n   is empty, invokes hfsc_qlen_notify() -> update_vf(cl,
  0, 0) and turns\n   the class passive (cl_nactive is decremented up the hierarchy).\n\
  \n2. hfsc_dequeue() then calls update_vf(cl, qdisc_pkt_len(skb), cur_time)\n   to
  charge the dequeued bytes.\n\nOn the second call the class is already passive, but
  its child qdisc is\nstill empty, so update_vf() arms go_passive again:\n\n     \
  \ if (cl->qdisc->q.qlen == 0 && cl->cl_flags & HFSC_FSC)\n              go_passive
  = 1;\n\nThe leaf is then skipped by the cl_nactive == 0 check inside the loop,\n\
  which does not clear go_passive, so the stale go_passive propagates to the\nparent
  and decrements"
