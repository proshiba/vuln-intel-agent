title: In versions of Spring Security's OAuth2 Authorization Server module 7.0.0
  through 7.0.4, when Dynamic Client Registration is explicitly enabled, the 
  registration endpoint performs insufficient validation of certain client 
  metadata fields supplied by the registering client. An attacker who possesses 
  a valid Initial Access Token can register a malicious client with crafted 
  metadata, which, depending on server configuration and how the metadata is 
  later rendered or used, may result in Stored Cross-Site Scripting (XSS), 
  Privilege Escalation, or Server-Side Request Forgery (SSRF).
