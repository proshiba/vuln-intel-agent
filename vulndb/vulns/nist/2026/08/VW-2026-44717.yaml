title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci: validate codec capability element length\n\nRead Local Codec Capabilities returns
  a sequence of capability elements.\nEach element starts with a one-byte length followed
  by that many payload\nbytes.\n\nhci_read_codec_capabilities() checks that the skb
  contains the length\nbyte, but then validates only caps->len against the remaining
  skb\nlength.  A malformed controller response with one remaining byte and\ncaps->len
  set to one passes that check even though the element needs two\nbytes.  The parser
  then records a two-byte capability and copies one\nbyte beyond the advertised response
  payload into the codec list.\n\nValidate the full element size, including the length
  byte, before adding\nit to the accumulated capability length.  This preserves all
  well-formed\ncapability elements and drops only truncated controller responses."
