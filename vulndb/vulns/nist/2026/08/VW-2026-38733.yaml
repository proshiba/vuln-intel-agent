title: axios versions 0.31.1 before 0.33.0 and 1.15.1 before 1.18.0 contain an 
  incomplete depth-limit bypass in toFormData.js when serializing objects with 
  top-level keys ending in '{}'. Attackers who control object keys and nested 
  values passed to axios form or parameter serialization can trigger a 
  RangeError from JSON.stringify, causing denial of service in the affected 
  request path.
