title: "Exposure of Sensitive Information to an Unauthorized Actor vulnerability in
  Apache CloudStack's LDAP authentication plugin while listing LDAP providers.\n\n\
  \n\n\n\n\n\n\n\n\n\nLDAP configurations can be listed by any authenticated user
  with access to the listLdapConfigurations API. By default, this API is available
  to all default roles.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThis issue affects Apache
  CloudStack: from 4.2.0.0 through 4.20.3.0 and from 4.21.0.0 through 4.22.1.0.\n\n\
  Users are recommended to upgrade to version 4.20.3.1 or 4.22.1.1 or later, which
  fixes the issue."
