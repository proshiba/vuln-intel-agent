title: Insertion of sensitive information into log file in the subsystem for the
  Intel(R) AMT and Intel(R) Standard Manageability may allow an information 
  disclosure. Network adversary with a privileged user combined with a high 
  complexity attack may enable data exposure. This result may potentially occur 
  via network access when attack requirements are not present without special 
  internal knowledge and requires no user interaction. The potential 
  vulnerability may impact the confidentiality (high), integrity (none) and 
  availability (none) of the vulnerable system, resulting in subsequent system 
  confidentiality (none), integrity (none) and availability (none) impacts.
