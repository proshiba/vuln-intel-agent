  crafted RTSP frame data containing oversized length values, resulting in\nout-of-bounds
  heap writes. \n\n\n\n\n\nSuccessful\nexploitation can crash the RTSP service and
  trigger a device reboot, resulting\nin a temporary denial-of-service condition."
