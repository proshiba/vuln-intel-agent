title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_tables: make nft_object rhltable per table\n\nThe nft_object rhltable is global,
  this allows for accessing objects\nthat are being dismangled from lookup path by
  other existing netns.\nGiven the nft_obj_destroy() releases the object inmediately,
  this might\nlead to use-after-free of these objects that are being released.\nMake
  the existing rhltable per table to address this issue to deal with\nwith the nft_rcv_nl_event()
  path too.\n\nUpdate nft_obj_lookup() to take the table as non-const, otherwise,\n\
  compiler complains when passing the objname_ht to rhltable_lookup()."
