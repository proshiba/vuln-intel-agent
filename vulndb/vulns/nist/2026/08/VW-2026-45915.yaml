title: Saleor is an e-commerce platform. From 3.14.67 until 3.21.67, 3.22.63, 
  and 3.23.22, a broken authorization check in saleor/permission/utils.py can 
  incorrectly authorize unauthenticated GraphQL requests. The flaw permits 
  anonymous callers to use the channelUpdate() mutation to change channel order 
  settings such as allowUnpaidOrders even when the response reports 
  PermissionDenied. The same permission utility can expose hidden objects 
  through the pageType() and translation() queries, including attributes whose 
  visibleInStorefront field is false and that should be visible only to users 
  with management permissions. This issue is fixed in versions 3.21.67, 3.22.63,
  and 3.23.22.
