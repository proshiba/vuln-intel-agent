title: "In the Linux kernel, the following vulnerability has been resolved:\n\napparmor:
  release exe file resources on path failure\n\nget_current_exe_path() takes both
  an exe_file reference and a path\nreference before resolving the path name. If aa_path_name()
  failed, it\nreturned immediately and leaked both references.\n\nRoute the failure
  through the common cleanup path so fput() and path_put()\nalways run after the references
  are acquired."
