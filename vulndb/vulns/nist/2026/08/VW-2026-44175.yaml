title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  free mlx5_st_idx_data on final dealloc\n\nWorkloads that repeatedly allocate and
  release mkeys carrying TPH\nsteering-tag hints (e.g. churning RDMA MRs) leak one\n\
  struct mlx5_st_idx_data per cycle; kmemleak flags it as unreferenced\nand the kmalloc
  slab grows over time.\n\nWhen the last reference to an ST table entry is dropped,\n\
  mlx5_st_dealloc_index() removed the entry from idx_xa but the backing\nmlx5_st_idx_data
  allocation was never freed.\n\nFree idx_data after the xa_erase() so the lifetime
  of the bookkeeping\nstruct matches the lifetime of the ST entry it tracks."
