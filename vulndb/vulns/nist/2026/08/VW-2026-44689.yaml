title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncxl/region:
  Resolve region deletion races\n\nSungwoo noticed that the sysfs trigger to delete
  a region may try to delete\na region multiple times. It also has no exclusion relative
  to the kernel\nreleasing the region via CXL root device teardown.\n\nInstead of
  installing new cxl root devres actions per region, use the\nexisting root decoder
  unregistration event to remove all remaining regions.\nAn xarray of regions replaces
  a devres list of regions.\n\nThis handles 3 separate issues with the old approach:\n\
  \n1/ sysfs users racing to delete the same region: no longer possible now\n   that
  the regions_lock is held over the lookup and deletion.\n\n2/ multiple actions triggering
  deletion of the same region: solved by\n   erasing regions while holding @regions_lock,
  and only proceeding on\n   successful erasure.\n\n3/ userspace racing devres_release_all()
  to trigger the devres not found\n   warning: solved by sysfs unregistration not
  requirin"
