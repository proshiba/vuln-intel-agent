title: DataEase versions before 2.10.26 omit object-level authorization checks 
  on geographic information, dashboard linkage, and chart detail REST endpoints,
  allowing authenticated users to access resources belonging to other users. 
  Attackers can overwrite or delete map geometry, modify dashboard linkages, and
  retrieve chart metadata and configuration for resources they do not own by 
  supplying arbitrary identifiers in requests.
