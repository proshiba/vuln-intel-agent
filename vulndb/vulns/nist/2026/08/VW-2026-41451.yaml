title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Fix use-after-free of mm_struct in job scheduler\n\namdxdna_cmd_submit() stores
  current->mm in job->mm without holding any\nreference. aie2_sched_job_run() later
  access job->mm from the DRM\nscheduler worker thread. With only a raw pointer and
  no structural\nreference, the mm_struct can be freed before the scheduler runs the
  job.\n\nFix this by calling mmgrab() to hold a structural mm_count reference for\n\
  the lifetime of the job, paired with mmdrop() in every cleanup path."
