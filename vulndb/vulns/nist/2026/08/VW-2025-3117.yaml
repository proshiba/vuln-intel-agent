title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix reference state management for synchronous callbacks\n\nCurrently, verifier
  verifies callback functions (sync and async) as if\nthey will be executed once,
  (i.e. it explores execution state as if the\nfunction was being called once). The
  next insn to explore is set to\nstart of subprog and the exit from nested frame
  is handled using\ncurframe > 0 and prepare_func_exit. In case of async callback
  it uses a\ncustomized variant of push_stack simulating a kind of branch to set up\n\
  custom state and execution context for the async callback.\n\nWhile this approach
  is simple and works when callback really will be\nexecuted only once, it is unsafe
  for all of our current helpers which\nare for_each style, i.e. they execute the
  callback multiple times.\n\nA callback releasing acquired references of the caller
  may do so\nmultiple times, but currently verifier sees it as one call inside the\n\
