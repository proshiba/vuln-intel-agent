title: SiYuan versions before v3.7.4 contain an information disclosure 
  vulnerability in the getAttributeViewBacklinks endpoint that consults the 
  forbidden access list instead of the visibility list when filtering backlinks.
  Anonymous readers can supply a publicly visible database row identifier to 
  discover hidden-tier documents that reference it, receiving the database name,
  row title, and document path of hidden documents.
