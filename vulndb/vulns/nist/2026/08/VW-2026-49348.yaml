title: "SQL injection in Hive Metastore direct SQL partition-name resolution in Apache
  Hive before 4.2.1 on all platforms allows authenticated users with access to Hive
  Metastore APIs to read, modify, or affect unintended partition metadata (including
  statistics updates, truncation targets, and file-metadata cache operations) via
  crafted partition names in metastore RPC requests when direct SQL is enabled (the
  default). Users are recommended to upgrade to version 4.2.1, which fixes this issue.\n\
  \nDetails about the issue:\nSeveral Hive Metastore RPCs resolve partitions by full
  partition name (PART_NAME) through direct-SQL helpers. In those paths, client-supplied
  partition names are embedded into SQL using string concatenation (DirectSqlUpdatePart.quoteString()
  → '...') instead of bind parameters. A partition name containing a single quote
  (and crafted SQL) can alter the generated WHERE clause so that lookups intended
  for one partition match additional rows. That can affect reads, stats updates, tr"
