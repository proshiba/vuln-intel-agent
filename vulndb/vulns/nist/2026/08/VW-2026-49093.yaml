title: OAuth2 Proxy honours a client-supplied X-Forwarded-Uri header when 
  deciding whether a request may skip authentication, because the guard added 
  for CVE-2026-40575 is inert in the default reverse-proxy configuration. 
  GetRequestURI in pkg/requests/util/util.go prefers that header over the real 
  request URI whenever CanTrustForwardedHeaders returns true, and isAllowedPath 
  in oauthproxy.go matches the skip_auth_routes and skip_auth_regex allow list 
  against the resulting path. CanTrustForwardedHeaders in 
  pkg/apis/middleware/scope.go grants that trust when the caller's address is in
  the trusted proxy set, and buildTrustedProxyNetSet falls back to 
  defaultTrustedProxyIPs, which is 0.0.0.0/0 and ::/0, whenever reverse proxy 
  mode is enabled without trusted_proxy_ip configured. Every client is therefore
