title: ApostropheCMS is an open-source Node.js content management system. In 
  4.32.0 and earlier, PATCH /api/v1/article/:id accepts the inherited path 
  toString.call and passes it through the utility module to apos.util.set() and 
  apos.util.get(), allowing an authenticated editor to overwrite the shared 
  Object.prototype.toString function's call property and cause a persistent 
  process-wide denial of service until restart.
