title: MCPHub is a unified hub for centrally managing and dynamically 
  orchestrating multiple MCP servers/APIs into separate endpoints with flexible 
  routing strategies. Prior to version 1.0.29, MCPHub's PUT /api/system-config 
  endpoint (handler updateSystemConfig) performs no authorization check. It is 
  protected only by the app-wide authentication middleware and a rate limiter — 
  it never inspects req.user.isAdmin. This issue has been patched in version 
  1.0.29.
