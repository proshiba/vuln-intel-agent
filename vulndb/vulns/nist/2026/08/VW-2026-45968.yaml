title: Context7 through 2.1.2 contains a prompt injection vulnerability that 
  allows attackers to execute malicious instructions in connected AI coding 
  agents by injecting unsanitized content through the Custom AI Instructions 
  feature served via the MCP server. Attackers can poison the custom 
  instructions to exfiltrate credentials from environment files to an 
  attacker-controlled service and perform destructive file deletion on the 
  victim's machine when the agent makes a routine library documentation request.
