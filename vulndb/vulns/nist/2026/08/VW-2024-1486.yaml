title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  Stop looking for coalesced MMIO zones if the bus is destroyed\n\nAbort the walk
  of coalesced MMIO zones if kvm_io_bus_unregister_dev()\nfails to allocate memory
  for the new instance of the bus.  If it can't\ninstantiate a new bus, unregister_dev()
  destroys all devices _except_ the\ntarget device.   But, it doesn't tell the caller
  that it obliterated the\nbus and invoked the destructor for all devices that were
  on the bus.  In\nthe coalesced MMIO case, this can result in a deleted list entry\n\
  dereference due to attempting to continue iterating on coalesced_zones\nafter future
  entries (in the walk) have been deleted.\n\nOpportunistically add curly braces to
  the for-loop, which encompasses\nmany lines but sneaks by without braces due to
  the guts being a single\nif statement."
