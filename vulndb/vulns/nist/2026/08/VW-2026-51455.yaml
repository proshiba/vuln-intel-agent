title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: vgic: Avoid double-deactivate of IRQs in the nested context\n\nIn the nested
  state, the physical interrupt has already been\ndeactivated through the HW bit in
  the LR. The extra deactivation\nwould be harmless but can hit an errata case on
  AmpereOne, so\navoid it here.\n\nOn AmpereOne, deactivating a physical interrupt
  through\nICC_DIR_EL1 or ICC_EOIR1_EL1 (depending on EOImode) which is not\nactive,
  but is the highest priority pending interrupt causes the\ncpu to lose the interrupt
  pending state and also prevents the\ndelivery of future interrupts."
