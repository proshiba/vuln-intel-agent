title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: free AP_VLAN bc_buf SKBs outside IRQ lock\n\nieee80211_do_stop() removes
  AP_VLAN packets from the parent AP\nps->bc_buf while holding ps->bc_buf.lock with
  IRQs disabled. It then\ncalls ieee80211_free_txskb() before dropping the lock.\n\
  \nieee80211_free_txskb() is not just a passive SKB release. For SKBs with\nTX status
  state it can report a dropped frame through cfg80211/nl80211,\nand that path can
  reach netlink tap transmit. This is the same reason\nthe pending queue cleanup in
  ieee80211_do_stop() already unlinks SKBs\nunder the queue lock and frees them after
  IRQ state is restored.\n\nThe buggy scenario involves two paths, with each column
  showing the\norder within that path:\n\nAP_VLAN management TX:             AP_VLAN
  stop:\n1. attach ACK-status state         1. clear the running state\n2. queue a
  multicast SKB on        2. take ps->bc_buf.lock with IRQs\n   parent ps->bc_buf\
  \                  disabled\n              "
