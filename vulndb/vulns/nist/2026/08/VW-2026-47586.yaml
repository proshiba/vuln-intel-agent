title: Lemmy is a link aggregator and forum for the fediverse. Prior to 0.19.19 
  and 1.0.0-beta.1, Lemmy's login endpoint in 
  crates/api/api/src/local_user/login.rs returns different errors depending on 
  whether the username_or_email value exists. 
  LocalUserView::find_by_email_or_name propagates a NotFound response for an 
  unknown account, while an existing account with a wrong password returns 
  LemmyErrorType::IncorrectLogin. This observable response discrepancy, 
  including HTTP 404 for a nonexistent account and HTTP 400 for an incorrect 
  password on an existing account, allows an unauthenticated attacker to confirm
  registered usernames or email addresses and use the results for targeted 
  credential attacks or social engineering. This issue is fixed in versions 
  0.19.19 and 1.0.0-beta.1.
