title: "In the Linux kernel, the following vulnerability has been resolved:\n\npppoe:
  reload header pointer after dev_hard_header()\n\npppoe_sendmsg() saves a pointer
  to the PPPoE header before calling\ndev_hard_header(). Device header callbacks are
  allowed to reallocate the\nskb head, invalidating pointers into it.\n\nThis can
  happen when a send is blocked in copy_from_user() while the first\nnon-Ethernet
  port is added to an empty team device. The team's delegated\nGRE header callback
  then expands the skb head. PPPoE subsequently writes\nsix bytes through the stale
  pointer into the freed head.\n\nReload the PPPoE header through the skb's network-header
  offset after\ndevice header creation. pskb_expand_head() updates that offset when
  it\nrelocates the head."
