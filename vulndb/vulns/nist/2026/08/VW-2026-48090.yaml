title: A flaw was found in the multicloud-operators-subscription component. This
  vulnerability allows a tenant, who has the ability to create HelmRelease 
  custom resources (CRs), to bypass existing security controls. The system's 
  HelmRelease controller processes Helm chart templates using its own elevated 
  ServiceAccount privileges without proper validation. This enables the tenant 
  to deploy arbitrary resources across the entire cluster, leading to a 
  significant security compromise.
