title: "ToolJet is the open-source foundation am AI-native platform for building and
  deploying internal tools, workflows and AI agents. Prior to 3.20.207, the ToolJet
  Database HTTP API in server/src/modules/tooljet-db/controller.ts authorizes operations
  against the :organizationId URL path value without verifying that the caller belongs
  to that organization. JwtAuthGuard validates the tj-workspace-id header against
  the caller's memberships, while server/src/modules/tooljet-db/ability/index.ts grants
  VIEW_TABLES, VIEW_TABLE, and JOIN_TABLES without binding them to the path organization.
  An authenticated user can set tj-workspace-id to the user's own workspace and target
  another workspace through GET /api/tooljet-db/organizations/:organizationId/tables,
  GET /api/tooljet-db/organizations/:organizationId/table/:tableName, POST /api/tooljet-db/organizations/:organizationId/join,
  and the related table-management routes, allowing disclosure of table names, schemas,
