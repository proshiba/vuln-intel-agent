title: The Mercado Pago Node.js SDK interpolates caller-supplied identifiers 
  into API request paths without percent-encoding them, so characters that are 
  structural in a URL survive into the outgoing request. The payment (get, 
  capture, cancel), paymentRefund (create, total, list, get), advancedPayment 
  (get, capture, cancel, update, updateReleaseDate) and disbursementRefund 
  (create, createAll, listAll) clients build their path as a template literal, 
  for example RestClient.fetch(`/v1/payments/${id}`, ...) in 
  src/clients/payment/get/index.ts. A dot-dot or slash sequence in the 
  identifier is normalised by the WHATWG URL parser and redirects the request to
  a different endpoint, and a question mark appends attacker-chosen query 
  parameters, in both cases carrying the merchant's own access token. An 
  application that forwards an identifier influenced by an untrusted party into 
  one of these methods without an ownership check therefore allows that party to
