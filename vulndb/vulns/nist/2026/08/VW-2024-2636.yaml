title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  fs, lock FTE when checking if active\n\nThe referenced commits introduced a two-step
  process for deleting FTEs:\n\n- Lock the FTE, delete it from hardware, set the hardware
  deletion function\n  to NULL and unlock the FTE.\n- Lock the parent flow group,
  delete the software copy of the FTE, and\n  remove it from the xarray.\n\nHowever,
  this approach encounters a race condition if a rule with the same\nmatch value is
  added simultaneously. In this scenario, fs_core may set the\nhardware deletion function
  to NULL prematurely, causing a panic during\nsubsequent rule deletions.\n\nTo prevent
  this, ensure the active flag of the FTE is checked under a lock,\nwhich will prevent
  the fs_core layer from attaching a new steering rule to\nan FTE that is in the process
  of deletion.\n\n[  438.967589] MOSHE: 2496 mlx5_del_flow_rules del_hw_func\n[  438.968205]
  ------------[ cut here ]------------\n[  438.968654] refcount_t: decrement hit 0;
  leak"
