title: An OS command injection vulnerability in duhow/xiaoai-patch through 
  commit fb07049 allows a remote attacker to execute arbitrary system commands 
  on Xiaomi smart speakers running the patch. The /mute and /unmute endpoint 
  handlers in api/main.py pass the user-supplied silent query parameter directly
  to os.system() without sanitization, enabling command injection via shell 
  metacharacters.
