title: "The OCPP 1.6 client in subsys/net/lib/ocpp/ocpp.c reconstructs a session handle
  and PDU id from the uid field of a CALLRESULT message. In ocpp_process_server_msg()
  the code calls atoi(strtok_r(uid, \"-\", &tmp)) without checking the strtok_r return
  value. When the server-supplied uid is empty or contains no - delimiter, strtok_r()
  returns NULL and atoi(NULL) dereferences a NULL pointer, which is undefined behaviour.\n\
  \nThe uid originates from network data: parse_rpc_msg() in subsys/net/lib/ocpp/ocpp_j.c
  JSON-parses a frame received from the OCPP central system over TCP/WebSocket and
  copies the server-controlled string into the local buffer. A malicious or compromised
  central system, or a man-in-the-middle on a non-TLS ws:// connection, can return
  a malformed uid to reach the defect. No authentication beyond the existing server
  connection (or MITM position) is required, and the reconstructed pointer is membership-validated
  by ocpp_session_is_valid(), so the impact is limited to the NULL der"
