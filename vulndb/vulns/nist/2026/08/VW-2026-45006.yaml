title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/arm-smmu-v3-iommufd:
  Require exactly one Stream ID for a vDEVICE\n\narm_vsmmu_vsid_to_sid() maps a guest's
  vSID to a single physical Stream ID\ntaken from master->streams[0], assuming a device
  has exactly one stream. A\ndevice with several streams gets only its first one mapped,
  so a guest vSID\ninvalidation cannot reach the others' ATC and IOTLB entries; a
  device with\nnone makes master->streams a ZERO_SIZE_PTR, read out of bounds.\n\n\
  Add an arm_vsmmu_vdevice_init() op to reject the vDEVICE with -EOPNOTSUPP\nwhen
  master->num_streams is not one, rather than mapping it silently."
