title: Faker generates massive amounts of fake data in the browser and Node.js. 
  Prior to 10.5.0, the faker.helpers.fake method in src/modules/helpers/eval.ts 
  allows attacker-controlled fake templates to access the Function constructor 
  through fakeEval.resolveProperty when a function returns another function, 
  enabling arbitrary JavaScript code execution. This issue is fixed in version 
  10.5.0.
