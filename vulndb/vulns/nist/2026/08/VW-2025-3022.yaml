title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnull_blk:
  fix poll request timeout handling\n\nWhen doing io_uring benchmark on /dev/nullb0,
  it's easy to crash the\nkernel if poll requests timeout triggered, as reported by
  David. [1]\n\nBUG: kernel NULL pointer dereference, address: 0000000000000008\n\
  Workqueue: kblockd blk_mq_timeout_work\nRIP: 0010:null_timeout_rq+0x4e/0x91\nCall
  Trace:\n ? null_timeout_rq+0x4e/0x91\n blk_mq_handle_expired+0x31/0x4b\n bt_iter+0x68/0x84\n\
  \ ? bt_tags_iter+0x81/0x81\n __sbitmap_for_each_set.constprop.0+0xb0/0xf2\n ? __blk_mq_complete_request_remote+0xf/0xf\n\
  \ bt_for_each+0x46/0x64\n ? __blk_mq_complete_request_remote+0xf/0xf\n ? percpu_ref_get_many+0xc/0x2a\n\
  \ blk_mq_queue_tag_busy_iter+0x14d/0x18e\n blk_mq_timeout_work+0x95/0x127\n process_one_work+0x185/0x263\n\
  \ worker_thread+0x1b5/0x227\n\nThis is indeed a race problem between null_timeout_rq()
  and null_poll().\n\nnull_poll()\t\t\t\tnull_timeout_rq()\n  spin_lock(&nq->poll_lock)\n\
