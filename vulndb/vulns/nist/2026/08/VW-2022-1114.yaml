title: "A vulnerability in the Simple Network Management Protocol (SNMP) feature of
  Cisco Adaptive Security Appliance (ASA) Software and Cisco Firepower Threat Defense
  (FTD) Software could allow an authenticated, remote attacker to cause a denial of
  service (DoS) condition on an affected device.\r\n\r This vulnerability is due to
  insufficient input validation. An attacker could exploit this vulnerability by sending
  a crafted SNMP request to an affected device. A successful exploit could allow the
  attacker to cause the affected device to reload, resulting in a DoS condition."
