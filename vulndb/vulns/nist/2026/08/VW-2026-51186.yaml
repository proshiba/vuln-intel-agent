title: A weakness in the client-side encryption configuration surface of the 
  MongoDB C# Driver causes sensitive key-management credential material supplied
  by the application to be reproduced verbatim in the driver's human-readable 
  diagnostic representation of its client settings, instead of being masked as 
  other secret fields are. A party able to read the application's logs, 
  diagnostic output, or a process memory dump may thereby recover the plaintext 
  credentials and use them to decrypt protected field data.
