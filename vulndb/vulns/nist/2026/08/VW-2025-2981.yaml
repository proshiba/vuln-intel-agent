title: "In the Linux kernel, the following vulnerability has been resolved:\n\nNFSD:
  Protect against send buffer overflow in NFSv2 READ\n\nSince before the git era,
  NFSD has conserved the number of pages\nheld by each nfsd thread by combining the
  RPC receive and send\nbuffers into a single array of pages. This works because there
  are\nno cases where an operation needs a large RPC Call message and a\nlarge RPC
  Reply at the same time.\n\nOnce an RPC Call has been received, svc_process() updates\n\
  svc_rqst::rq_res to describe the part of rq_pages that can be\nused for constructing
  the Reply. This means that the send buffer\n(rq_res) shrinks when the received RPC
  record containing the RPC\nCall is large.\n\nA client can force this shrinkage on
  TCP by sending a correctly-\nformed RPC Call header contained in an RPC record that
  is\nexcessively large. The full maximum payload size cannot be\nconstructed in that
  case."
