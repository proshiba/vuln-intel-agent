title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvkm/gsp:
  correctly advance the read pointer of GSP message queue\n\nA GSP event message consists
  three parts: message header, RPC header,\nmessage body. GSP calculates the number
  of pages to write from the\ntotal size of a GSP message. This behavior can be observed
  from the\nmovement of the write pointer.\n\nHowever, nvkm takes only the size of
  RPC header and message body as\nthe message size when advancing the read pointer.
  When handling a\ntwo-page GSP message in the non rollback case, It wrongly takes
  the\nmessage body of the previous message as the message header of the next\nmessage.
  As the \"message length\" tends to be zero, in the calculation of\nsize needs to
  be copied (0 - size of (message header)), the size needs to\nbe copied will be \"\
  0xffffffxx\". It also triggers a kernel panic due to a\nNULL pointer error.\n\n\
  [  547.614102] msg: 00000f90: ff ff ff ff ff ff ff ff 40 d7 18 fb 8b 00 00 00  ........@.......\n\
  [  547.622533] ms"
