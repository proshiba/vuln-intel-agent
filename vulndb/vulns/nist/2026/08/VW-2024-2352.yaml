title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  amd_sfh: free driver_data after destroying hid device\n\nHID driver callbacks aren't
  called anymore once hid_destroy_device() has\nbeen called. Hence, hid driver_data
  should be freed only after the\nhid_destroy_device() function returned as driver_data
  is used in several\ncallbacks.\n\nI observed a crash with kernel 6.10.0 on my T14s
  Gen 3, after enabling\nKASAN to debug memory allocation, I got this output:\n\n\
  \  [   13.050438] ==================================================================\n\
  \  [   13.054060] BUG: KASAN: slab-use-after-free in amd_sfh_get_report+0x3ec/0x530
  [amd_sfh]\n  [   13.054809] psmouse serio1: trackpoint: Synaptics TrackPoint firmware:
  0x02, buttons: 3/3\n  [   13.056432] Read of size 8 at addr ffff88813152f408 by
  task (udev-worker)/479\n\n  [   13.060970] CPU: 5 PID: 479 Comm: (udev-worker) Not
  tainted 6.10.0-arch1-2 #1 893bb55d7f0073f25c46adbb49eb3785fefd74b0\n  [   13.063978]
  Hardware name: LENOVO 21"
