title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid10:
  fix writes_pending and barrier reference leaks on discard failures\n\nraid10_make_request()
  acquires a writes_pending reference with\nmd_write_start() before calling raid10_handle_discard().
  Several failure\npaths in raid10_handle_discard() complete the bio and return without\n\
  releasing the corresponding reference, causing md_write_end() to be\nskipped.\n\n\
  Call md_write_end() before returning from these failure paths to keep\nwrites_pending
  accounting balanced.\n\nAdditionally, discard split allocation failures can occur
  after\nwait_barrier() succeeds. Those paths return without calling\nallow_barrier(),
  leaking the associated barrier reference.\n\nRelease the barrier before returning
  from those paths."
