title: Dinky's SysConfigController.getAll() handler for GET 
  /api/sysConfig/getAll carries a method-level @SaIgnore annotation that 
  short-circuits the class-level @SaCheckLogin, so the Sa-Token interceptor lets
  the request through with no session or role check. Any remote unauthenticated 
  caller who can reach the Dinky HTTP port (8888 by default) receives the full 
  live system configuration (54 entries on a stock v1.2.5 install) with one 
  parameterless GET. Only one credential field 
  (sys.maven.settings.repositoryPassword) has a desensitization handler wired; 
  the other credential-bearing fields (sys.env.settings.dinkyToken, 
  sys.ldap.settings.userPassword, sys.resource.settings.oss.accessKey and 
  secretKey, and sys.dolphinscheduler.settings.token) return in cleartext. A 
  bare install leaks the shipped defaults, including the hardcoded dinkyToken 
  efda1551-7958-4e0f-80a8-dfd107df3e38 and minioadmin/minioadmin OSS keys; once 
