title: The WooCommerce PayPal Payments plugin for WordPress is vulnerable to 
  Sensitive Information Disclosure due to an Insecure Direct Object Reference in
  all versions up to, and including, 3.3.2 via the 
  `enqueue_paypal_insights_script_on_order_received()` function due to missing 
  validation on a user controlled key. This makes it possible for 
  unauthenticated attackers to obtain sensitive order information including 
  order keys, which can then be leveraged to access full customer billing 
  details (name, email, phone, address) via the WooCommerce Store API within a 
  10-minute grace period after order creation.
