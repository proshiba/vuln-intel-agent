title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  qca: fix NVM tag length underflow in TLV parser\n\nIn the TLV_TYPE_NVM branch of
  qca_tlv_check_data() the tag loop bound is\n\"while (idx < length - sizeof(struct
  tlv_type_nvm))\". \"length\" is a signed\nint from the firmware TLV header and sizeof(struct
  tlv_type_nvm) is a\nsize_t (12), so \"length\" is converted to size_t and any firmware-supplied\n\
  \"length\" < 12 makes the subtraction wrap to a huge value. The loop body\nthen
  reads a 12-byte struct tlv_type_nvm past the end of the short\nvmalloc'd firmware
  buffer (and the EDL_TAG_ID_* handlers can write past it).\n\nRewrite the bound as
  \"idx + sizeof(struct tlv_type_nvm) <= length\"; both\noperands are non-negative,
  so it no longer underflows and a \"length\" too\nsmall for one record correctly
  skips the loop.\n\n  BUG: KASAN: vmalloc-out-of-bounds in qca_download_firmware.isra.0
  (drivers/bluetooth/btqca.c:421)\n  Read of size 2 at addr ffffc900000e5004 by task
  kworker/u9:0/52\n  "
