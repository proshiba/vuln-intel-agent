title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrds:
  drop incoming messages that cross network namespace boundaries\n\nrds_find_bound()
  looks up the destination socket using a global\nrhashtable keyed solely on (addr,
  port, scope_id).  Network namespaces\nare not part of the key, so a sender in netns
  A can deliver an incoming\nmessage (inc) to a socket that lives in a different netns
  B.\n\nWhen this happens, inc->i_conn points to an rds_connection whose c_net\nis
  netns A, but the receiving rs lives in netns B.  Once the child\nprocess that created
  netns A exits, cleanup_net() calls\nrds_loop_exit_net() -> rds_loop_kill_conns()
  -> rds_conn_destroy(),\nfreeing that connection.  If the survivor socket in netns
  B still holds\nthe inc, any subsequent dereference of inc->i_conn is a use-after-free.\n\
  \nThere are two dangerous sites in rds_clear_recv_queue():\n  1. inc->i_conn->c_lcong
  (offset 88 of freed rds_connection, size 200)\n     read via rds_recv_rcvbuf_delta()
  -- confirmed by KAS"
