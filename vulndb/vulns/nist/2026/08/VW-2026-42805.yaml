title: ffuf is a fast web fuzzer written in Go. Prior to 2.2.0, ffuf allows a 
  malicious target server to cause an out-of-memory denial of service because 
  the response size guard in pkg/runner/simple.go checks only the compressed 
  Content-Length while io.ReadAll reads gzip, brotli, deflate, transparently 
  decompressed, or chunked response bodies without a decompressed-size bound. 
  This issue is fixed in version 2.2.0.
