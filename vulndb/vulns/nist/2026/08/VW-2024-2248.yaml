title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hns:
  Fix soft lockup under heavy CEQE load\n\nCEQEs are handled in interrupt handler
  currently. This may cause the\nCPU core staying in interrupt context too long and
  lead to soft lockup\nunder heavy load.\n\nHandle CEQEs in BH workqueue and set an
  upper limit for the number of\nCEQE handled by a single call of work handler."
