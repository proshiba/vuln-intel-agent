title: "In the Linux kernel, the following vulnerability has been resolved:\n\nubifs:
  Fix to add refcount once page is set private\n\nMM defined the rule [1] very clearly
  that once page was set with PG_private\nflag, we should increment the refcount in
  that page, also main flows like\npageout(), migrate_page() will assume there is
  one additional page\nreference count if page_has_private() returns true. Otherwise,
  we may\nget a BUG in page migration:\n\n  page:0000000080d05b9d refcount:-1 mapcount:0
  mapping:000000005f4d82a8\n  index:0xe2 pfn:0x14c12\n  aops:ubifs_file_address_operations
  [ubifs] ino:8f1 dentry name:\"f30e\"\n  flags: 0x1fffff80002405(locked|uptodate|owner_priv_1|private|node=0|\n\
  \  zone=1|lastcpupid=0x1fffff)\n  page dumped because: VM_BUG_ON_PAGE(page_count(page)
  != 0)\n  ------------[ cut here ]------------\n  kernel BUG at include/linux/page_ref.h:184!\n\
  \  invalid opcode: 0000 [#1] SMP\n  CPU: 3 PID: 38 Comm: kcompactd0 Not tainted
  5.15.0-rc5\n  RIP: 0010:migrate_page_move_mapping+0xac3/0xe70\n  Call"
