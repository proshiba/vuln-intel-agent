title: CloudNativePG is a platform designed to manage PostgreSQL databases 
  within Kubernetes environments. Prior to 1.28.4 and 1.29.2, CloudNativePG 
  embedded cleartext role passwords in `ALTER ROLE` and `CREATE ROLE` statements
  generated by SetUserPassword in pkg/management/postgres/utils/roles.go and 
  appendPasswordOption in internal/management/controller/roles/postgres.go. When
  pg_stat_statements was preloaded with track_utility enabled and an untrusted 
  tenant held pg_monitor or pg_read_all_stats, the tenant could recover 
  platform-managed superuser or application-owner passwords, reconnect through 
  enabled superuser TCP access, and execute operating system commands in the 
  database pod with `COPY ... FROM PROGRAM`. Clusters using SCRAM-SHA-256 
  verifiers in managed-role Secrets were not affected. This issue is fixed in 
  versions 1.28.4, 1.29.2, and 1.30.0.
