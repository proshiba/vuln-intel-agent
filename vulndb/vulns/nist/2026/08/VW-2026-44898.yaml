title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  openvswitch: fix potential UAF on meter attach failure\n\nWhile attaching a newly
  created meter attach_meter() function makes\nthe new meter visible to other CPUs
  but can still fail afterwards.\nOn failure, it detaches the meter back and returns
  an error.\n\nHowever, this is an unexpected behavior for the ovs_meter_cmd_set()\n\
  that uses a plain kfree(meter) on attach failure without waiting for\nRCU readers
  to stop using it, assuming it was never visible.\n\nThis is never a problem for
  ovs-vswitchd as it always creates meters\nbefore creating any flows that use them.\
  \  But the UAF can be triggered\nwith a custom application using uAPI:\n\n BUG:
  KASAN: slab-use-after-free in ovs_meter_execute (net/openvswitch/meter.c:653)\n\
  \ Read of size 8 at addr ffff88810d152650 by task meter/2508\n\n Call Trace:\n \
  \ ovs_meter_execute (net/openvswitch/meter.c:653)\n  do_execute_actions (net/openvswitch/actions.c:1407)\n\
