title: "Velociraptor allows reading Stacked result sets from the GUI.  Velociraptor's
  multi-tenant design stores sub orgs within the datastore directory. The path requested
  by the GUI is not correctly checked against the prefix deny list, allowing result
  sets to read from denied prefixes.\n\nIn particular, a user with read access to
  the root org can access result sets from child orgs."
