title: "ServiceNow has remediated a sandbox escape security issue that was identified
  in the Now Platform. This security issue could allow an unauthenticated user to
  execute arbitrary code within the Now Platform, potentially leading to more access
  to the Now Platform than intended.  \n\n\n\n\n\nServiceNow deployed a security update
  to hosted instances and ServiceNow provided the update to our partners and self-hosted
  customers. We are not currently aware of malicious exploitation against ServiceNow
  instances. \n\n\n\nWe recommend customers promptly apply appropriate updates or
  upgrade to a patched release if they have not already done so."
