title: "In the Linux kernel, the following vulnerability has been resolved:\n\next2:
  fix ignored return value of generic_write_sync()\n\nFix ext2_dio_write_iter() to
  propagate the error returned by\ngeneric_write_sync() instead of silently discarding
  it, which could\ncause write(2) to return success to userspace on O_SYNC/O_DSYNC
  files\neven when the sync failed.\n\nThe correct pattern, already used in ext2_dax_write_iter()
  in the same\nfile and in ext4, xfs, f2fs among others, is:\n    if (ret > 0)\n \
  \       ret = generic_write_sync(iocb, ret);\n\nFound by Linux Verification Center
  (linuxtesting.org) with SVACE.\n\n[JK: Reflect also filemap_write_and_wait() return
  value]"
