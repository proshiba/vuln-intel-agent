title: openssl_encrypt versions before 1.4.9 fail to sanitize recovery-slot 
  metadata in the desktop GUI, allowing attackers to inject control characters 
  and line separators into the irreversible-removal confirmation dialog. 
  Attackers can craft encrypted files with malicious slot identifiers containing
  bidi overrides or line-separator characters to forge warning text and deceive 
  users during file removal operations.
