title: Fujitsu Research's OneCompression library before 1.2.1 contains an unsafe
  deserialization vulnerability that allows attackers to execute arbitrary code 
  by supplying a crafted model.pt checkpoint file, as 
  QuantizedModelLoader.load_quantized_model_pt() unconditionally calls 
  torch.load with weights_only=False, invoking Python's pickle machinery during 
  deserialization. Attackers can embed malicious __reduce__ methods in a crafted
  model checkpoint to execute arbitrary Python code, including system commands, 
  when the library loads the file from a caller-selected model directory.
