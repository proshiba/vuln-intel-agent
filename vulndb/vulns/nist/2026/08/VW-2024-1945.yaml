title: "In the Linux kernel, the following vulnerability has been resolved:\n\nethtool:
  do not perform operations on net devices being unregistered\n\nThere is a short
  period between a net device starts to be unregistered\nand when it is actually gone.
  In that time frame ethtool operations\ncould still be performed, which might end
  up in unwanted or undefined\nbehaviours[1].\n\nDo not allow ethtool operations after
  a net device starts its\nunregistration. This patch targets the netlink part as
  the ioctl one\nisn't affected: the reference to the net device is taken and the\n\
  operation is executed within an rtnl lock section and the net device\nwon't be found
  after unregister.\n\n[1] For example adding Tx queues after unregister ends up in
  NULL\n    pointer exceptions and UaFs, such as:\n\n      BUG: KASAN: use-after-free
  in kobject_get+0x14/0x90\n      Read of size 1 at addr ffff88801961248c by task
  ethtool/755\n\n      CPU: 0 PID: 755 Comm: ethtool Not tainted 5.15.0-rc6+ #778\n\
  \      Hardware name: QEMU Standard PC "
