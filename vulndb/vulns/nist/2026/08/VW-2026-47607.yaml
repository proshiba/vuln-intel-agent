title: A flaw was found in search-indexer. This vulnerability allows a 
  registered and authenticated managed cluster to tamper with or delete another 
  cluster's indexed search data. This is possible because the delta-sync write 
  paths in search-indexer do not properly restrict UPDATE/DELETE operations to 
  data owned by the calling cluster. An attacker could exploit this by crafting 
  specific user identifiers (UIDs) with a different cluster's prefix.
