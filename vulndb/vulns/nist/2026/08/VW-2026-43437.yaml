title: Type confusion with PostgreSQL "internal" data type arguments allows any 
  user to execute arbitrary code as the operating system user running the 
  database, via calls to functions with that argument type.  Type "internal" 
  represents a class of mutually-incompatible data structures not intended for 
  access from SQL.  The system intended to prevent such function calls, but this
  prevention had gaps.  Versions before PostgreSQL 18.5, 17.11, 16.15, 15.19, 
  and 14.24 are affected.
