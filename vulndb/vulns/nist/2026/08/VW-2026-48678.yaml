title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  8250_of: clear stuck empty-FIFO RX-timeout on LPC32xx\n\nThe NXP LPC32xx UART (PORT_LPC3220)
  can latch an RX character-timeout\ninterrupt while the RX FIFO is empty: IIR reports
  UART_IIR_RX_TIMEOUT\n(0x0c) but LSR.DR is clear. A character timeout is only cleared
  by\nreading RHR, but serial8250_rx_chars() reads RHR only when LSR.DR is\nset, so
  nothing ever clears the condition. The interrupt is\nlevel-triggered and re-fires
  immediately, so on a single-core ARM926\nthe resulting interrupt storm livelocks
  the CPU.\n\nIt is reproducible when userspace repeatedly opens the front-panel port\n\
  (ttyS1): serial8250_do_set_termios() re-enables interrupts on unlock and\nthe handler
  then spins forever with iir=0xcc lsr=0x60 ier=0x05, tripping\nthe soft-lockup detector
  in serial8250_handle_irq_locked().\n\nLPC32xx has no dedicated 8250 glue driver,
  it's driven by the generic\n8250_of. Add a hardware specific handle_irq for PORT_LPC3220,
  wi"
