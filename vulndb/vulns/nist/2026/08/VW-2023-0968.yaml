title: Multiple Cisco products are affected by a vulnerability in the Snort 
  detection engine that could allow an unauthenticated, remote attacker to 
  bypass the configured policies on an affected system. This vulnerability is 
  due to a flaw in the FTP module of the Snort detection engine. An attacker 
  could exploit this vulnerability by sending crafted FTP traffic through an 
  affected device. A successful exploit could allow the attacker to bypass FTP 
  inspection and deliver a malicious payload.
