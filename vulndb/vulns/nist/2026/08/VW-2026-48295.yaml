title: "Improper access control in CloudStack's annotation functionality allows unauthorized comment
  creation and disclosure.\n\n\n\n\nThe addAnnotation and listAnnotation APIs perform
  an ownership check when an entity's UUID is specified, but fail to honor its result
  correctly. This lets any authenticated user write annotations to, and disclose existing
  annotations/comments on, an entity they don't own by simply supplying its UUID.\n\
  \n\n\n\nThis issue affects Apache CloudStack: from 4.15.0.0 through 4.20.3.0 and
  from 4.21.0.0 through 4.22.1.0.\n\n\n\n\n\nUsers are recommended to upgrade to version
  4.20.3.1 or 4.22.1.1 or later, which fixes the issue."
