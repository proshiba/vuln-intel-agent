title: "Improper Authentication vulnerability in Apache Camel Platform HTTP Main component.\n\
  \n\n\nThis issue affects Apache Camel: from 4.8.0 before 4.22.0.\n\n\n\nThe camel-main
  embedded HTTP server can protect its endpoints with JWT authentication, configured
  through authenticationEnabled together with the JWT keystore properties. JWTAuthenticationConfigurer.buildJwtOptions
  returned null when neither jwtIssuer nor jwtAudience was configured, and the caller
  then skipped the JWTAuthOptions.setJWTOptions call entirely, so the Vert.x JWTAuth
  instance was built from the keystore alone. The result was that inbound tokens were
  checked only for signature and expiry: the iss and aud claims were not validated
  at all. Nothing signalled this - the server started normally and reported no warning
  - so a deployment configured the documented way silently enforced less than the
  operator believed it had enabled, and the component documentation itself presented
  signature and expiry checking as the default with issuer"
