title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: validate individual TWT params before driver setup\n\nieee80211_process_rx_twt_action()
  only partially validates a received\nS1G TWT setup frame before queueing it.\n\n\
  An individual agreement can therefore reach ieee80211_s1g_rx_twt_setup()\nwith twt->length
  too short for the full struct ieee80211_twt_params.\n\nThe individual path passes
  twt to drv_add_twt_setup(). Both the tracepoint\nand the driver callback consume
  the complete parameters block, not merely\nreq_type. Do not pass a short individual
  agreement to the driver.\nBroadcast agreements remain unchanged because they are
  rejected locally\nafter accessing only req_type.\n\n[edit commit message to not
  overclaim lack of validation nor\n understate driver impact]"
