title: "OSNEXUS QuantaStor Missing Authentication Remote Code Execution Vulnerability.
  This vulnerability allows remote attackers to execute arbitrary code on affected
  installations of OSNEXUS QuantaStor. Authentication is not required to exploit this
  vulnerability.\n\nThe specific flaw exists within the configuration of Kapacitor.
  The issue results from the lack of authentication prior to allowing access to functionality.
  An attacker can leverage this vulnerability to execute code in the context of root.
  Was ZDI-CAN-30036."
