title: Automatisch reveals whether an address is registered through the response
  to its forgot-password request. The controller at 
  packages/backend/src/controllers/internal/api/v1/users/forgot-password.js 
  looks the address up and chains a not-found throw onto the query, so an 
  address with no account raises an error that the global handler renders as a 
  not-found status, while a registered address proceeds to send the reset 
  message and returns no-content. The route is mounted without authentication. 
  Submitting candidate addresses and comparing the two status codes therefore 
  establishes which addresses hold accounts, with no credential and no rate 
  limiting in the path.
