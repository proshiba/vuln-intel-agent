title: OpenMetadata accepts a caller-supplied post-authentication redirect 
  target and appends the issued token to it. SamlLoginServlet reads the callback
  request parameter and stores it in the HTTP session without comparing it 
  against any configured or registered destination, and the assertion consumer 
  servlet later formats that stored value into a URL carrying the freshly issued
  JWT together with the account's email and name before sending the redirect. 
  The OIDC and OAuth2 handler follows the same pattern with its own redirect 
  parameter and the issued identity token. A request naming a destination the 
  attacker controls therefore causes the server to deliver a valid token for 
  whoever completes the login to that destination. Because the token 
  authenticates API calls as that account, a user who follows such a link and 
  authenticates hands over control of their account. Version 2.0.0 removes the 
  caller-supplied callback parameter; no 1.x release validates it.
