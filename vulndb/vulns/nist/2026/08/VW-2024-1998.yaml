title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Add BPF_PROG_TYPE_CGROUP_SKB attach type enforcement in BPF_LINK_CREATE\n\nbpf_prog_attach
  uses attach_type_to_prog_type to enforce proper\nattach type for BPF_PROG_TYPE_CGROUP_SKB.
  link_create uses\nbpf_prog_get and relies on bpf_prog_attach_check_attach_type\n\
  to properly verify prog_type <> attach_type association.\n\nAdd missing attach_type
  enforcement for the link_create case.\nOtherwise, it's currently possible to attach
  cgroup_skb prog\ntypes to other cgroup hooks."
