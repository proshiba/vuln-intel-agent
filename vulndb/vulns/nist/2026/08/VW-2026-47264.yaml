title: Wazuh is a free and open source platform used for threat prevention, 
  detection, and response. From 4.9.0 until 4.10.4 and 4.14.6, PUT 
  /security/users/{user_id} in api/api/controllers/security_controller.py passes
  request.get("user") instead of request.context['token_info']['sub'] as 
  current_user. remove_nones_to_dict() removes the resulting None value, so the 
  reserved-account protection in framework/wazuh/security.py cannot verify who 
  is making the request. An authenticated user with the users_admin role can 
  overwrite the password of protected administrator accounts with user IDs at or
  below 99, including the wazuh superuser, and gain full administrative control.
  This issue is fixed in versions 4.10.4 and 4.14.6.
