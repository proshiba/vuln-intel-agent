title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: use kfree_rcu for offchannel link in mt76_put_vif_phy_link\n\nmt76_put_vif_phy_link()
  frees the offchannel mlink with plain kfree()\nafter rcu_assign_pointer(NULL). However,
  rcu_assign_pointer only prevents\nfuture RCU readers from obtaining the pointer
  -- it does not wait for\nexisting readers that already hold it via rcu_dereference.\n\
  \nThe TX datapath (e.g. mt7996_mac_write_txwi) dereferences mlink->wcid\nand mlink->idx
  under rcu_read_lock. If a TX softirq obtained the pointer\nvia rcu_dereference just
  before the NULL assignment, it will dereference\nfreed memory after the kfree.\n\
  \nstruct mt76_vif_link already contains an rcu_head field that is unused at\nthis
  free site -- a developer oversight, since the adjacent\nkfree_rcu_mightsleep call
  for rx_sc in the same function shows the\npattern was understood.\n\nReplace kfree(mlink)
  with kfree_rcu(mlink, rcu_head)."
