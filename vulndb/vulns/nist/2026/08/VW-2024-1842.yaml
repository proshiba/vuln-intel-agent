title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/mlx5:
  Fix initializing CQ fragments buffer\n\nThe function init_cq_frag_buf() can be called
  to initialize the current CQ\nfragments buffer cq->buf, or the temporary cq->resize_buf
  that is filled\nduring CQ resize operation.\n\nHowever, the offending commit started
  to use function get_cqe() for\ngetting the CQEs, the issue with this change is that
  get_cqe() always\nreturns CQEs from cq->buf, which leads us to initialize the wrong
  buffer,\nand in case of enlarging the CQ we try to access elements beyond the size\n\
  of the current cq->buf and eventually hit a kernel panic.\n\n [exception RIP: init_cq_frag_buf+103]\n\
