title: Koha's reports/catalogue_stats.pl builds dynamic SQL in sub calculate by 
  interpolating the user-controlled Line and Column request parameters directly 
  into identifier positions of the query (SELECT DISTINCTROW, GROUP BY, ORDER 
  BY) with no whitelist validation. When Line contains itemcallnumber and the 
  cotedigits parameter is truthy, cotedigits is additionally concatenated raw as
  the numeric argument of a LEFT() call. An authenticated staff user holding the
  reports module permission can inject arbitrary SQL and read any table 
  reachable by the Koha database user, including borrowers (password hashes, 
  two-factor secrets, personal data), api_keys, and sessions.
