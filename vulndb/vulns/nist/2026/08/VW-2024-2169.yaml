title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  PPC: Book3S HV: Prevent UAF in kvm_spapr_tce_attach_iommu_group()\n\nAl reported
  a possible use-after-free (UAF) in kvm_spapr_tce_attach_iommu_group().\n\nIt looks
  up `stt` from tablefd, but then continues to use it after doing\nfdput() on the
  returned fd. After the fdput() the tablefd is free to be\nclosed by another thread.
  The close calls kvm_spapr_tce_release() and\nthen release_spapr_tce_table() (via
  call_rcu()) which frees `stt`.\n\nAlthough there are calls to rcu_read_lock() in\n\
  kvm_spapr_tce_attach_iommu_group() they are not sufficient to prevent\nthe UAF,
  because `stt` is used outside the locked regions.\n\nWith an artifcial delay after
  the fdput() and a userspace program which\ntriggers the race, KASAN detects the
  UAF:\n\n  BUG: KASAN: slab-use-after-free in kvm_spapr_tce_attach_iommu_group+0x298/0x720
  [kvm]\n  Read of size 4 at addr c000200027552c30 by task kvm-vfio/2505\n  CPU: 54
  PID: 2505 Comm: kvm-vfio Not tainted 6"
