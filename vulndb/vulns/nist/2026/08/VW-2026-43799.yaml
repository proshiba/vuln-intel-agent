title: 'A malicious GOPROXY was previously capable of forging up to two sumdb tiles
  that allow for a requested module to bypass the GOSUMDB check and persist attacker-controlled
  module content to a local Go module cache. This attack allows for a malicious GOPROXY
  to serve malicious module content that cannot be detected by evaluating the transparency
  log. All tiles are now correctly verified against their parents. In order to determine
  if you have been affected:   rm -r go.sum go.work.sum vendor/ && go mod tidy'
