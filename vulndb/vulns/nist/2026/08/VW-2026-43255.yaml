title: SiYuan versions before v3.7.4 contain a second-order SQL injection 
  vulnerability in attribute-view template columns that expose the queryBlocks 
  function, which executes raw SQL using string substitution instead of 
  parameterized queries. Attackers can distribute malicious SiYuan documents or 
  packages with crafted template columns that execute arbitrary SQL on a 
  victim's kernel when the package is imported and rendered, enabling read and 
  write access across notebooks.
