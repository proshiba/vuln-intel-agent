title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  fix path resolution in ksmbd_vfs_kern_path_create\n\nThe SMB2 open lookup is rooted
  at the share with LOOKUP_BENEATH, but the\ncreate/mkdir/hardlink sink is not: ksmbd_vfs_kern_path_create()
  builds an\nabsolute path with convert_to_unix_name() and resolves it from AT_FDCWD\n\
  via start_creating_path(), so a \"..\" component is walked from the real\nfilesystem
  root and escapes the export.\n\nAn authenticated client races a missing path component
  so the rooted open\nlookup returns -ENOENT (taking the create branch) while the
  same component\nis present (a directory) when the create walk runs; the create then\n\
  resolves \"..\" out of the share.\n\nRoot the create walk at the share like the
  lookup and rename paths already\nare: resolve the parent with vfs_path_parent_lookup(...,
  LOOKUP_BENEATH,\n&share_conf->vfs_path) and create the final component with\nstart_creating_noperm().
  convert_to_unix_name() then has no callers and is\nremoved."
