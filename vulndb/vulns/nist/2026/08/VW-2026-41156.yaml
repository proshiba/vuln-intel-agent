title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntime/jiffies:
  Register jiffies clocksource before usage\n\nTeddy reported that a XEN HVM has a
  long boot delay, which was bisected to\nthe recent enhancements to the negative
  motion detection. It turned out\nthat the jiffies clocksource is used in early boot
  before it is registered,\nwhich leaves the max_delta_raw field at zero. That causes
  the read out to\nbe clamped to the max delta of 0, which means time is not making
  progress.\n\nCure it by ensuring that it is initialized before its first usage in\n\
  timekeeping_init()."
