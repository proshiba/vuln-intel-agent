title: 'A flaw has been found in HKUDS nanobot up to 0.2.1. The impacted element is
  the function ExecTool._prepare_command of the file nanobot/agent/tools/shell.py
  of the component Login-shell Environment Handler. Executing a manipulation can lead
  to information disclosure. The attack requires local access. The exploit has been
  published and may be used. Upgrading to version 0.3.0 is sufficient to resolve this
  issue. This patch is called 4525. The affected component should be upgraded. Multiple
  issues were reported to the project. They reacted with a high level of professionalism
  and kindness: "The report concerns shell startup files reintroducing environment
  variables when command execution defaults to a login shell. The default was changed
  so exec does not use a login shell unless explicitly requested".'
