title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  codecs: hdac_hdmi: Validate written enum value\n\nhdac_hdmi_set_pin_port_mux() uses
  the written enum value to index the\ntexts array before calling snd_soc_dapm_put_enum_double(),
  which validates\nthat the value is within the enum item range.\n\nAn out-of-range
  value can therefore make the driver read past the texts\narray before the helper
  rejects the write. Move the lookup after the helper\nhas accepted the value."
