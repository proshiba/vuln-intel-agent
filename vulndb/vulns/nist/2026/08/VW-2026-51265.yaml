title: A vulnerability was determined in cyberchitta scrapling-fetch-mcp up to 
  0.2.2. The impacted element is the function s_fetch_page/s_fetch_pattern of 
  the file src/scrapling_fetch_mcp/_fetcher.py. Executing a manipulation can 
  lead to server-side request forgery. The attack can be launched remotely. 
  Upgrading to version 0.2.3 is sufficient to resolve this issue. This patch is 
  called 9f6f34e92c55c3d95566ad9c62aca7327d24533a. Upgrading the affected 
  component is advised.
