title: NLTK before 3.10.3 contains a remote code execution vulnerability in 
  AllowlistUnpickler that validates only the pickle module string and not the 
  global name, allowing attackers to resolve dotted names by attribute traversal
  to callables outside the allowlisted namespace. Attackers can craft untrusted 
  transition-parser models that execute arbitrary commands when 
  TransitionParser.parse loads the model through allowlisted_pickle_load.
