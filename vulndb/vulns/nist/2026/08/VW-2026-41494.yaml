title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmtd:
  virt_concat: fix use-after-free in mtd_virt_concat_destroy()\n\nmtd_concat_destroy()
  frees item->concat so calling\nmtd_virt_concat_put_mtd_devices(item->concat) after
  that leads to a\nuse-after-free.\n\nFix it by moving mtd_virt_concat_put_mtd_devices()
  before\nmtd_concat_destroy()."
