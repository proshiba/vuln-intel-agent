title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  meson: aiu: Validate written enum values\n\nThe AIU HDMI and internal codec mux
  put callbacks use the written enum\nvalue with snd_soc_enum_item_to_val() before
  checking whether the value is\nvalid for the enumeration.\n\nReject out-of-range
  values before converting the enum item, matching the\nvalidation already done by
  the G12A HDMI and internal codec mux controls."
