title: WeGIA before 3.9.2 contains an insecure direct object reference 
  vulnerability in the employee profile page that allows authenticated attackers
  to access arbitrary employee records by injecting an id_pessoa parameter 
  through a request extraction function that overwrites the session-derived 
  identifier. Attackers can enumerate all user identifiers to retrieve full 
  profile data for any employee account, including name, CPF, address, contact 
  details, and administrative flags.
