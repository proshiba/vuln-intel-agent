title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfbdev:
  efifb: fix memory leak in efifb_probe()\n\nSince commit 73ce73c30ba9 (\"fbdev: Transfer
  video= option strings to\ncaller; clarify ownership\") the string returned from
  fb_get_options()\nis expected to be freed by the caller, but the string is not freed
  in\nefifb_probe(). Fix that by freeing the option string after setup."
