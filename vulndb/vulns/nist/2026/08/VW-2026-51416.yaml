title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (occ) unregister sysfs devices outside occ lock\n\nocc_active(false) and occ_shutdown()
  unregister sysfs-backed devices while\nocc->lock is held.  hwmon_device_unregister()
  and sysfs_remove_group() can\nwait for active sysfs callbacks to drain, and those
  callbacks can enter the\nOCC update path and try to take occ->lock again.  That
  gives the unregister\npaths the lock ordering occ->lock -> sysfs callback drain,
  while a callback\nhas the opposite edge sysfs callback -> occ->lock.\n\nThis issue
  was found by our static analysis tool and then manually\nreviewed against the current
  tree.\n\nThe grounded PoC kept the real unregister and callback carrier:\n\n  occ_shutdown()\n\
  \  hwmon_device_unregister()\n  occ_show_temp_1()\n  occ_update_response()\n\nLockdep
  reported the circular dependency with occ_shutdown() already\nholding the OCC mutex
  and hwmon_device_unregister() waiting on the sysfs\nside:\n\n  WARNING: possible
