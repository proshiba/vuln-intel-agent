title: "In the Linux kernel, the following vulnerability has been resolved:\n\nIB/mlx5:
  Fix transport-domain rollback and initialize lb mutex earlier\n\nmlx5_ib_alloc_transport_domain()
  allocates a transport domain and then\nmay fail in mlx5_ib_enable_lb(). In that
  case, the allocated TD is leaked.\n\nFix this by deallocating the TD when mlx5_ib_enable_lb()
  returns an\nerror. Also return 0 explicitly in the no-loopback-capability success\n\
  branch, and move dev->lb.mutex initialization to mlx5_ib_stage_init_init()."
