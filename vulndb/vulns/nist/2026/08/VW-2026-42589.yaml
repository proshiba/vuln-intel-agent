title: TypeBot is a chatbot builder tool. Version 3.16.1 has a CSV injection 
  vulnerability in the result export functionality. The application does not 
  sanitize or escape user-supplied input when generating CSV files. An attacker 
  can inject spreadsheet formulas into input fields, which are later executed 
  when an administrator opens the exported CSV in spreadsheet software such as 
  Microsoft Excel or LibreOffice Calc. Version 3.17.0 patches the issue.
