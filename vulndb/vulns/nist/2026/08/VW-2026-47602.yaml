title: A flaw was found in acm-operator-bundle. The build process for this 
  component downloads and runs a script from a remote source without verifying 
  its authenticity or integrity. This script gains access to sensitive 
  credentials, such as GitHub access tokens and registry passwords, used in the 
  build environment. A remote attacker could exploit this vulnerability to 
  inject malicious code, leading to unauthorized access to build resources and 
  potential compromise of the resulting operator bundle.
