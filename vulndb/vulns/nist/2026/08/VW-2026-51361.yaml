title: "In the Linux kernel, the following vulnerability has been resolved:\n\nHID:
  picolcd: prevent NULL pointer dereference in picolcd_send_and_wait()\n\nIn picolcd_send_and_wait(),
  an integer overflow of the signed loop counter\n'k' can theoretically lead to a
  NULL pointer dereference of 'raw_data'.\nIf the loop executes more than INT_MAX
  times, 'k' becomes negative,\nmaking the condition 'k < size' true even when 'size'
  is 0.\n\nChange the type of 'k' to 'unsigned int' to prevent the overflow and\n\
  eliminate the out-of-bounds access.\n\nFound by Linux Verification Center (linuxtesting.org)
  with the Svace static\nanalysis tool.\n\n[jkosina@suse.com: extended hash length]"
