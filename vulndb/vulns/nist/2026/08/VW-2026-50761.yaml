title: "Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')
  vulnerability in Apache APISIX.\n\nA caller who holds valid credentials for one
  entry in the LDAP directory can authenticate through APISIX as a consumer mapped
  to a different entry, one the plugin's configured scope was meant to keep out of
  reach.\n\n\nThis issue affects Apache APISIX: from 2.11.0 through 3.17.0.\n\n\n\n\
  Users are recommended to upgrade to version 3.18.0, which fixes the issue."
