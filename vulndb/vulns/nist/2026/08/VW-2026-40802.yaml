title: Kata Containers is an open source implementation of lightweight Virtual 
  Machines (VMs) that perform like containers. In versions prior to 4.0.0, the 
  kata-agent is vulnerable to an authorization bypass in confidential-guest 
  memory management. In Confidential Containers (CoCo) deployments, the 
  kata-agent enforces an OPA/Rego-based AgentPolicy that must authorize every 
  ttRPC API call, forming the security boundary that prevents an untrusted host 
  from directing the confidential guest. Two ttRPC methods introduced with the 
  mem-agent feature are missing this authorization check, so an untrusted host 
  can invoke them unconditionally regardless of the guest's policy 
  configuration. When mem-agent is enabled (off by default), this lets the host 
  tamper with in-guest memory management by forcing swap, aggressive eviction, 
  or compaction, resulting in attacker-controlled availability and performance 
