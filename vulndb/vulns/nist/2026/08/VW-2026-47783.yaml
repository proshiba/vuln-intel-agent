title: A weakness has been identified in liftoff-sr CIPster 
  1802525be27d33e19a9a83c163e331a1d13b1892. This affects the function 
  CipConnMgrClass::forward_open of the file cipconnectionmanager.cc of the 
  component ForwardOpen Handler. Executing a manipulation of the argument 
  product_code_ can lead to out-of-bounds read. It is possible to launch the 
  attack remotely. The exploit has been made available to the public and could 
  be used for attacks. This patch is called 
  ea870a274bf68dfaa3f511f20e2fff6778fb7b74. A patch should be applied to 
  remediate this issue.
