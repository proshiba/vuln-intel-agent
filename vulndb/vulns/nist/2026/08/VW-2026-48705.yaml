title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  atm: cxacru: properly kill rcv_urb on error in cxacru_cm()\n\nIf cxacru_cm() encounters
  an error while submitting or waiting for snd_urb,\nit aborts and returns the error
  without killing the already submitted\nrcv_urb. This leaves the rcv_urb active.\n\
  \nWhen this happens during initialization (e.g., in cxacru_atm_start()), the\ndriver
  may ignore the error and proceed to call cxacru_poll_status(), which\ninvokes cxacru_cm()
  again. Attempting to submit the still-active rcv_urb\ntriggers a warning in usb_submit_urb():\n\
  \ncxacru 1-1:1.0: send of cm 0x84 failed (-104)\nATM dev 0: cxacru_atm_start: CHIP_ADSL_LINE_START
  returned -104\n------------[ cut here ]------------\nURB ffff88812658d200 submitted
  while active\nWARNING: drivers/usb/core/urb.c:379 at usb_submit_urb+0x79/0x18b0\n\
  drivers/usb/core/urb.c:379\n...\nCall Trace:\n <TASK>\n cxacru_cm+0x21a/0xf10 drivers/usb/atm/cxacru.c:631\n\
  \ cxacru_cm_get_array drivers/usb/atm/cxacru.c:722 [in"
