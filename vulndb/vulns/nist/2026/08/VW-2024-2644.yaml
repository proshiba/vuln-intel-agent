title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetlink:
  terminate outstanding dump on socket close\n\nNetlink supports iterative dumping
  of data. It provides the families\nthe following ops:\n - start - (optional) kicks
  off the dumping process\n - dump  - actual dump helper, keeps getting called until
  it returns 0\n - done  - (optional) pairs with .start, can be used for cleanup\n\
  The whole process is asynchronous and the repeated calls to .dump\ndon't actually
  happen in a tight loop, but rather are triggered\nin response to recvmsg() on the
  socket.\n\nThis gives the user full control over the dump, but also means that\n\
  the user can close the socket without getting to the end of the dump.\nTo make sure
  .start is always paired with .done we check if there\nis an ongoing dump before
