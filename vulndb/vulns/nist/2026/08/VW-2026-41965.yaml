title: "Affected versions of cti-transmute fail to HTML-escape attacker-controlled
  values used in ECharts Sunburst and Treemap tooltip formatters. Slice names may
  originate directly from STIX or MISP data, including STIX types, relationship_type,
  pattern prefixes, and MISP category/type values. Since ECharts interprets the formatter
  return value as HTML, crafted values can inject markup or script-capable content
  into the tooltip.\n\n\nAn attacker who can cause malicious conversion data to be
  processed can therefore inject content that executes when another user views the
  visualization and hovers over the affected slice. The patch replaces direct interpolation
  with dedicated formatter functions that call escapeHtml() on p.name, p.data.value,
  and p.value."
