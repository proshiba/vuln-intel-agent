title: Joomla Extension - joomgalleryfriends.net - Password-Protected Category 
  Bypass via JSON Format in JoomGallery < 4.4.0- An unauthenticated access 
  control bypass exists in JoomGallery's category JSON view. When a gallery 
  category is protected with a password, the HTML view correctly enforces the 
  password gate - but the JSON view ( format=json ) skips this check entirely.
