title: The AutomatorWP – Automator plugin for no-code automations, webhooks & 
  custom integrations in WordPress plugin for WordPress is vulnerable to 
  authorization bypass in all versions up to, and including, 5.8.4. This is due 
  to the plugin not properly verifying that a user is authorized to perform an 
  action. This makes it possible for authenticated attackers, with 
  subscriber-level access and above, to retrieve the site's configured Campaign 
  Monitor mailing list catalog, including all list IDs and names, that should be
  restricted to users with the plugin's manager capability. The required nonce 
  is emitted unconditionally on every WordPress admin page via 
  wp_localize_script, meaning any subscriber visiting /wp-admin/profile.php can 
  obtain it without any elevated access.
