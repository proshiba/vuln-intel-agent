title: "In the Linux kernel, the following vulnerability has been resolved:\n\ni2c:
  imx: fix locked bus on SMBus block-read of 0 (atomic)\n\nSMBus 3.1 6.5.7 allows
  a Block Read byte count of 0, but the atomic\n(polling) path rejects it as -EPROTO.
  Worse, it returns without a\nNACK+STOP: the next receive cycle has already started,
  so the target\nkeeps holding SDA and the bus stays stuck until a power cycle for\n\
  this i2c controller.\n\nReading I2DR to obtain the count likewise arms the next
  byte on the\ncount > I2C_SMBUS_BLOCK_MAX path, which also returned -EPROTO directly\n\
  and left the bus held.\n\nHandle both: NACK the in-flight dummy byte (TXAK) and
  extend msgs->len so\nthe existing last-byte handling emits STOP; the dummy byte
  is discarded.\nA count of 0 is a valid empty block read; a count above\nI2C_SMBUS_BLOCK_MAX
  is still reported as -EPROTO, but only after the bus\nhas been released.\n\nThe
  interrupt-driven path has the same flaw from a later commit and is\nfixed separately,
  as it carries a different Fixes:"
