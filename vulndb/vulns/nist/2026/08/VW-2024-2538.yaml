title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnouveau/dmem:
  Fix vulnerability in migrate_to_ram upon copy error\n\nThe `nouveau_dmem_copy_one`
  function ensures that the copy push command is\nsent to the device firmware but
  does not track whether it was executed\nsuccessfully.\n\nIn the case of a copy error
  (e.g., firmware or hardware failure), the\ncopy push command will be sent via the
  firmware channel, and\n`nouveau_dmem_copy_one` will likely report success, leading
  to the\n`migrate_to_ram` function returning a dirty HIGH_USER page to the user.\n\
  \nThis can result in a security vulnerability, as a HIGH_USER page that may\ncontain
  sensitive or corrupted data could be returned to the user.\n\nTo prevent this vulnerability,
  we allocate a zero page. Thus, in case of\nan error, a non-dirty (zero) page will
  be returned to the user."
