title: Use of Hard-coded Credentials in the human resources component in Roskus 
  Prospero Flow CRM before 5.15.9 allows unauthenticated remote attackers to 
  authenticate as any employee onboarded through the standard flow, knowing only
  their email address, because the employee save controller falls back to the 
  literal password "changeme" and the onboarding form provides no password 
  field.
