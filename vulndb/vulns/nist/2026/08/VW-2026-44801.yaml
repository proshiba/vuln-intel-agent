title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme-multipath:
  fix flex array size in struct nvme_ns_head\n\nstruct nvme_ns_head contains a flexible
  array member, current_path[],\nwhich is indexed using the NUMA node ID:\nhead->current_path[numa_node_id()]\n\
  \nThe structure is currently allocated as:\nsize = sizeof(struct nvme_ns_head) +\n\
  \       (num_possible_nodes() * sizeof(struct nvme_ns *));\nhead = kzalloc(size,
  GFP_KERNEL);\n\nThis allocation assumes that NUMA node IDs are sequential and densely\n\
  packed from 0 .. num_possible_nodes() - 1. While this assumption holds\non many
  systems, it is not always true on some architectures such as\npowerpc.\n\nOn some
  powerpc systems, NUMA node IDs can be sparse. For example:\nNUMA:\n  NUMA node(s):\
  \              6\n  NUMA node0 CPU(s):         80-159\n  NUMA node8 CPU(s):    \
  \     0-79\n  NUMA node252 CPU(s):\n  NUMA node253 CPU(s):\n  NUMA node254 CPU(s):\n\
  \  NUMA node255 CPU(s):\n\nThat is, the possible/online NUMA node IDs are: 0, 8,
  252, 253, 25"
