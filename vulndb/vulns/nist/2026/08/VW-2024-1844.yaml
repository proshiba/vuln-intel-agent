title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  seq: Fix race of snd_seq_timer_open()\n\nThe timer instance per queue is exclusive,
  and snd_seq_timer_open()\nshould have managed the concurrent accesses.  It looks
  as if it's\nchecking the already existing timer instance at the beginning, but\n\
  it's not right, because there is no protection, hence any later\nconcurrent call
  of snd_seq_timer_open() may override the timer\ninstance easily.  This may result
  in UAF, as the leftover timer\ninstance can keep running while the queue itself
  gets closed, as\nspotted by syzkaller recently.\n\nFor avoiding the race, add a
  proper check at the assignment of\ntmr->timeri again, and return -EBUSY if it's
  been already registered."
