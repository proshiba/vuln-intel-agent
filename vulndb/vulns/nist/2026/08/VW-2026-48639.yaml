title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvsock/virtio:
  read virtqueues under worker locks\n\nCommit bd50c5dc182b (\"vsock/virtio: add support
  for device\nsuspend/resume\") made the *_run flags transition from false to true
  when\nrestore installs replacement virtqueues.  The RX, TX and event workers\nread
  their virtqueue before locking and checking the corresponding flag,\nso a worker
  delayed across freeze and restore can observe the replacement\nqueue's running state
  while retaining a pointer to the deleted queue.\n\nRead each virtqueue under its
  mutex after checking the run flag, keeping\nthe pointer and state in the same queue
  generation."
