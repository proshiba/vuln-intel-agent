title: "### Impact\nThe registration component does not validate the text-based _Security
  Question_ CAPTCHA correctly, allowing attackers to bypass the challenge via a specially
  crafted value.\n\n\n[CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N](https://www.first.org/cvss/calculator/3.1#CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N)\n\
  \n### Details\nThe public _Registration_ workflow ([`member.php?action=do_register`](https://github.com/mybb/mybb/blob/mybb_1839/member.php#L262-L307))
  accepts a hidden field `question_id` — expected to match the question session identifier
  (`mybb_questionsessions.sid`) — and validates the challenge answer without a fail-closed
  fallback for invalid identifiers. If the value is blank, forged, or expired, the
  request continues without a question-related error.\n\n### Patches\nMyBB 1.8.(...)
  resolves this issue with the following changes:\n\n- Commit: https://github.com/mybb/mybb/commit/\n\
  \  - `.patch`: https://github.com/mybb/mybb/commit/.patch\n\n### References\n- Release
  Notes: http"
