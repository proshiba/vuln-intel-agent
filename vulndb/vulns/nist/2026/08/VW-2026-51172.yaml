title: "ServiceNow has remediated a SQL injection vulnerability that was identified
  in in the ServiceNow AI platform. This vulnerability could enable an unauthenticated
  user, in certain circumstances, to execute arbitrary SQL statements against the
  instance's underlying database and gain access to, or modify, instance data beyond
  what was intended. \n\n\n\n\n\nServiceNow deployed a security update to hosted instances
  and ServiceNow provided the update to our partners and self-hosted customers. We
  are not currently aware of malicious exploitation against ServiceNow instances. \n\
  \n\n\nWe recommend customers promptly apply appropriate updates or upgrade to a
  patched release if they have not already done so."
