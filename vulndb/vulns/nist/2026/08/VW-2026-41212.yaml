title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/af_iucv:
  fix NULL deref in afiucv_hs_callback_syn()\n\nafiucv_hs_callback_syn() allocates
  the child socket with GFP_ATOMIC.\nIf the allocation fails, nsk is NULL.\n\nThe
  connection-refused path is entered when the listen state check\nfails, the accept
  backlog is full, or nsk is NULL. The code\nunconditionally calls iucv_sock_kill(nsk)
  in that path.\n\niucv_sock_kill() does not accept a NULL socket pointer and immediately\n\
  dereferences sk via sock_flag(sk, SOCK_ZAPPED). When nsk is NULL,\ncalling iucv_sock_kill(nsk)
  results in a NULL pointer dereference.\n\nOnly call iucv_sock_kill() when a child
  socket was successfully\nallocated."
