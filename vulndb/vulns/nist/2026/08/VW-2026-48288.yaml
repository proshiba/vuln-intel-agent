title: "Improper Neutralization of Special Elements used in a Command ('Command Injection')
  vulnerability in Apache CloudStack's run and get diagnostics functionality for the
  system VMs and virtual routers.\n\nAn authenticated user holding the permissions
  required to invoke either `getDiagnosticsData` or `runDiagnostics` can achieve arbitrary
  command execution on the system VM and/or Virtual Router instances, with commands
  running as root (or as the diagnostics-process user, at minimum). This represents
  a full compromise of the affected instance and, depending on network segmentation,
  may provide a foothold for lateral movement within the CloudStack-managed infrastructure,
  including access to guest network traffic handled by the compromised Virtual Router.\n\
  \n\n\nThe getDiagnosticsData and runDiagnostics APIs are restricted to only Admin
  role accounts by default.\n\n\nThis issue affects Apache CloudStack: from 4.20.0.0
