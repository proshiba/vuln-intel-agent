title: "In the Linux kernel, the following vulnerability has been resolved:\n\nthunderbolt:
  Bound the DROM dual link port number before indexing sw->ports\n\ntb_drom_parse_entry_port()
  validates the device-supplied header->index\nagainst sw->config.max_port_number
  before indexing sw->ports[], but the\nsibling field entry->dual_link_port_nr --
  a 6-bit value also read from\nthe DROM -- indexes the same array with no such check.
  A malicious or\nmalformed Thunderbolt device can set dual_link_port_nr beyond the\n\
  allocated sw->ports[] (max_port_number + 1 entries), producing an\nout-of-bounds
  tb_port pointer that is stored and later dereferenced.\n\nReject a port entry whose
  dual_link_port_nr exceeds max_port_number,\nthe same bound already applied to header->index."
