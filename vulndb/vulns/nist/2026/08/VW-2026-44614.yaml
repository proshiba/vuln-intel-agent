title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: qcom: clear opened when stream enable fails\n\nOn enable, subs->opened
  is set before the service_interval is validated;\nan invalid interval jumps to the
  response label without clearing it, so\nthe substream is wedged at -EBUSY until
  a disable or disconnect.\n\nClear subs->opened on the enable error path."
