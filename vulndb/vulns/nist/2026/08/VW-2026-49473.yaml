title: "X-AnyLabeling's model downloader disabled TLS certificate verification. download_with_retry
  in anylabeling/services/auto_labeling/model.py built a context with ssl._create_unverified_context()
  and passed it to urllib.request.urlopen, so neither the certificate chain nor the
  hostname was checked on any model download, and models are fetched over HTTPS from
  the project's release host. Any party positioned to intercept that connection could
  therefore answer it with content of their own choosing. The response is written
  to a .part file and moved into place with os.replace, and the only post-download
  check, safe_check_model, validates the file's format rather than its provenance:
  no hash or signature is compared against an expected value. For an ONNX target the
  substituted file passes onnx.checker.check_model and is then used for inference,
  so the attacker chooses the model that produces the application's annotations. For
  a .pth or .pt target, which the shipped SAM2 video, YOLOE, UPN and op"
