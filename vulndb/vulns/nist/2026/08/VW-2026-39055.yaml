title: '@fastify/aws-lambda version 6.4.0 decorates each Fastify request with request.awsLambda.event
  and request.awsLambda.context, values that applications are documented to use for
  authorization decisions such as reading API Gateway authorizer claims. In the default
  configuration, the getter that populates this decoration reads the client-controlled
  x-apigateway-event and x-apigateway-context HTTP headers before falling back to
  the trusted internal request token, and those reserved headers are not stripped
  from the incoming event. An unauthenticated attacker who can set a single HTTP header
  can therefore forge the entire Lambda proxy event, including the authorizer context,
  and override the genuine one. This results in a full authentication and authorization
  bypass and privilege escalation for any application that trusts request.awsLambda.event
  for identity or access control. Only version 6.4.0 is affected. Patches: upgrade
  to @fastify/aws-lambda 6.4.1, which resolves the decoration only th'
