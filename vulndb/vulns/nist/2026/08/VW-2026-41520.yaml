title: Affected versions of MISP cti-transmute disclose users' email addresses 
  through the account following-list endpoint. When an authenticated user 
  follows another account, get_following() includes the followed user's email 
  field in the API response alongside their name, user ID, and follow date. 
  Because the email address is not required for the functionality and other 
  related user lists omit it, an authenticated attacker could systematically 
  follow users and collect their email addresses. The fix removes user.email 
  from the returned object.
