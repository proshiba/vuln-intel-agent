title: 'Vulnerability in the JD Edwards EnterpriseOne Orchestrator product of Oracle
  JD Edwards (component: E1 IOT Orchestrator Security).  Supported versions that are
  affected are 9.2.0.0-9.2.26.4. Easily exploitable vulnerability allows low privileged
  attacker with network access via HTTP to compromise JD Edwards EnterpriseOne Orchestrator.  Successful
  attacks of this vulnerability can result in  unauthorized creation, deletion or
  modification access to critical data or all JD Edwards EnterpriseOne Orchestrator
  accessible data as well as  unauthorized access to critical data or complete access
  to all JD Edwards EnterpriseOne Orchestrator accessible data. CVSS 3.1 Base Score
  8.1 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N).'
