title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudp:
  skip L4 aggregation for UDP tunnel packets\n\nIf NETIF_F_GRO_FRAGLIST or NETIF_F_GRO_UDP_FWD
  are enabled, and there\nare UDP tunnels available in the system, udp_gro_receive()
  could end-up\ndoing L4 aggregation (either SKB_GSO_UDP_L4 or SKB_GSO_FRAGLIST) at\n\
  the outer UDP tunnel level for packets effectively carrying and UDP\ntunnel header.\n\
  \nThat could cause inner protocol corruption. If e.g. the relevant\npackets carry
  a vxlan header, different vxlan ids will be ignored/\naggregated to the same GSO
  packet. Inner headers will be ignored, too,\nso that e.g. TCP over vxlan push packets
  will be held in the GRO\nengine till the next flush, etc.\n\nJust skip the SKB_GSO_UDP_L4
  and SKB_GSO_FRAGLIST code path if the\ncurrent packet could land in a UDP tunnel,
  and let udp_gro_receive()\ndo GRO via udp_sk(sk)->gro_receive.\n\nThe check implemented
  in this patch is broader than what is strictly\nneeded, as the existing UDP tunnel
  could be "
