title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx4_en:
  Fix an use-after-free bug in mlx4_en_try_alloc_resources()\n\nIn mlx4_en_try_alloc_resources(),
  mlx4_en_copy_priv() is called and\ntmp->tx_cq will be freed on the error path of
  mlx4_en_copy_priv().\nAfter that mlx4_en_alloc_resources() is called and there is
  a dereference\nof &tmp->tx_cq[t][i] in mlx4_en_alloc_resources(), which could lead
  to\na use after free problem on failure of mlx4_en_copy_priv().\n\nFix this bug
  by adding a check of mlx4_en_copy_priv()\n\nThis bug was found by a static analyzer.
  The analysis employs\ndifferential checking to identify inconsistent security operations\n\
  (e.g., checks or kfrees) between two code paths and confirms that the\ninconsistent
  operations are not recovered in the current function or\nthe callers, so they constitute
  bugs.\n\nNote that, as a bug found by static analysis, it can be a false\npositive
  or hard to trigger. Multiple researchers have cross-reviewed\nthe bug.\n\nBuilds
  with"
