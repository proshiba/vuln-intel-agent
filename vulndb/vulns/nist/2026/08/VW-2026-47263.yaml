title: "Secure BootROM of RK3588s SoC is vulnerable to a time-of-check to time-of-use
  attack in case of booting from external media (SPI NOR or NAND, EMMC or SD).\n\n\
  \n\n\nThe code reads the header of the next-stage loader twice. The header contains
  hashes of the executable modules and is signed with a private key, the public part
  of which is verified against the SHA256 digest blown in the OTP.\n\n\n\n\nThe first
  read is only partial and contains only the hashes of the executable modules. The
  second is complete, including the header signature.\n\nAlthough the header is verified
  based on the fully read data, the authenticity of the executable modules is checked
  against the partial data from the first read.\n\n\n\n\nAn attacker with physical
  access to a device containing RK3588s SoC can easily modify the next-stage loader
  data on-the-fly using a low-cost SD-card or SPI NOR/NAND or EMMC emulator. Even
