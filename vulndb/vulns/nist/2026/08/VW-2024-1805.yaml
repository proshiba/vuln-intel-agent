title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  mediatek: vcodec: Fix oops when HEVC init fails\n\nThe stateless HEVC decoder saves
  the instance pointer in the context\nregardless if the initialization worked or
  not. This caused a use after\nfree, when the pointer is freed in case of a failure
  in the deinit\nfunction.\nOnly store the instance pointer when the initialization
  was successful,\nto solve this issue.\n\n Hardware name: Acer Tomato (rev3 - 4)
