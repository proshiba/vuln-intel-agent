title: In OpenStack Keystone before 29.0.3, tokens obtained via OAuth1 access 
  token, application credential, or trust-scoped authentication could create new
  long-lived credentials or authorize new delegations that persist independently
  of, and outlive, the credential used to obtain them. The delegation 
  restrictions that block these operations did not consistently apply to all 
  delegated token types, allowing an OAuth1-scoped token, for example, to create
  application credentials or authorize OAuth1 request tokens despite those 
  operations being restricted for other delegated token types. All Keystone 
  deployments that permit delegated authentication through OAuth1 access tokens,
  application credentials, or trusts are affected.
