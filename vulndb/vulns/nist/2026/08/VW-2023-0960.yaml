title: A vulnerability in the internal packet processing of Cisco Firepower 
  Threat Defense (FTD) Software for Cisco Firepower 2100 Series Firewalls could 
  allow an unauthenticated, remote attacker to cause a denial of service (DoS) 
  condition on an affected device. This vulnerability is due to improper 
  handling of certain packets when they are sent to the inspection engine. An 
  attacker could exploit this vulnerability by sending a series of crafted 
  packets to an affected device. A successful exploit could allow the attacker 
  to deplete all 9,472 byte blocks on the device, resulting in traffic loss 
  across the device or an unexpected reload of the device. If the device does 
  not reload on its own, a manual reload of the device would be required to 
  recover from this state.
