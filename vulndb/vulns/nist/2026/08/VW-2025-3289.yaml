title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/smc:
  use smc_lgr_list.lock to protect smc_lgr_list.list iterate in smcr_port_add\n\n\
  While doing smcr_port_add, there maybe linkgroup add into or delete\nfrom smc_lgr_list.list
  at the same time, which may result kernel crash.\nSo, use smc_lgr_list.lock to protect
  smc_lgr_list.list iterate in\nsmcr_port_add.\n\nThe crash calltrace show below:\n\
  BUG: kernel NULL pointer dereference, address: 0000000000000000\nPGD 0 P4D 0\nOops:
  0000 [#1] SMP NOPTI\nCPU: 0 PID: 559726 Comm: kworker/0:92 Kdump: loaded Tainted:
  G\nHardware name: Alibaba Cloud Alibaba Cloud ECS, BIOS 449e491 04/01/2014\nWorkqueue:
  events smc_ib_port_event_work [smc]\nRIP: 0010:smcr_port_add+0xa6/0xf0 [smc]\nRSP:
  0000:ffffa5a2c8f67de0 EFLAGS: 00010297\nRAX: 0000000000000001 RBX: ffff9935e0650000
  RCX: 0000000000000000\nRDX: 0000000000000010 RSI: ffff9935e0654290 RDI: ffff9935c8560000\n\
  RBP: 0000000000000000 R08: 0000000000000000 R09: ffff9934c0401918\nR10: 0000000000000000
