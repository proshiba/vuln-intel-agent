title: "In the Linux kernel, the following vulnerability has been resolved:\n\nveth:
  convert frag_list skbs before running XDP\n\nA frag_list skb can reach veth with
  data_len set but nr_frags zero.\nveth_convert_skb_to_xdp_buff() only converts skbs
  that are shared,\nlocked, have frags[], or do not have enough headroom. It later
  uses\nskb_is_nonlinear() to decide whether to set XDP_FLAGS_HAS_FRAGS and\nxdp_frags_size.\n\
  \nThat exposes frag_list data to XDP as if it were stored in frags[], but\nfrags[]
  is empty. AF_XDP copy mode can then trust the bogus XDP fragment\nmetadata, walk
  an empty fragment entry, and crash in memcpy() from\n__xsk_rcv().\n\nRoute non-linear
  skbs through skb_pp_cow_data() before exposing them to\nXDP, and only advertise
  XDP frags when the resulting skb has frags[].\nskb_copy_bits() already handles frag_list
  input, and skb_pp_cow_data()\nbuilds frags[] output with skb_add_rx_frag(), which
  is the\nrepresentation XDP multi-buffer expects."
