  hidden system inodes can be linked\ninto directory hierarchy which is an avenue
  for further serious\ncorruption of the filesystem and kernel confusion as noticed
  by syzbot\nfuzzed images. Refuse to access system inodes linked into directory\n\
  hierarchy and vice versa."
