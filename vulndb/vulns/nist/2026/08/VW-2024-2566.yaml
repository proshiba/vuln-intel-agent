title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  Stop the active perfmon before being destroyed\n\nUpon closing the file descriptor,
  the active performance monitor is not\nstopped. Although all perfmons are destroyed
  in `vc4_perfmon_close_file()`,\nthe active performance monitor's pointer (`vc4->active_perfmon`)
  is still\nretained.\n\nIf we open a new file descriptor and submit a few jobs with
  performance\nmonitors, the driver will attempt to stop the active performance monitor\n\
  using the stale pointer in `vc4->active_perfmon`. However, this pointer\nis no longer
  valid because the previous process has already terminated,\nand all performance
  monitors associated with it have been destroyed and\nfreed.\n\nTo fix this, when
  the active performance monitor belongs to a given\nprocess, explicitly stop it before
  destroying and freeing it."
