title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  rtl8723bs: fix OOB read in rtw_get_wpa_ie()\n\nrtw_get_wpa_ie() reads bytes at fixed
  offsets into a vendor-specific\ninformation element without checking that the element
  is long enough,\ncausing an out-of-bounds read for a short trailing IE.\n\nThe function
  locates a vendor-specific IE (EID 221) with rtw_get_ie()\nand then compares a 4-byte
  OUI+type at pbuf + 2 and reads a 2-byte\nversion word at pbuf + 6. Those accesses
  require the IE body to be at\nleast 6 bytes, but rtw_get_ie() only guarantees that
  the element fits\nwithin the buffer; it does not enforce a minimum body length.
  A\nvendor-specific IE whose length byte is 0 to 5, placed at the end of\nthe buffer,
  therefore makes these reads run past the end of the IE and\npast the end of the
  buffer itself.\n\nThe buffer holds information elements taken from received management\n\
