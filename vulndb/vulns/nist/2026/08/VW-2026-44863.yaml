title: "Exposure of data element to wrong session vulnerability in the JSON plugin
  of Apache Struts. Per-request parsing state could be shared across concurrent requests,
  allowing data associated with one request to become observable in another, and configured
  parsing limits not to be enforced as intended. Populating actions from a JSON request
  body is not enabled by default; applications that do not use the JSON plugin are
  not affected.\n\nThis issue affects Apache Struts: 7.2.1.\n\nUsers are recommended
  to upgrade to version 7.3.0, which fixes the issue."
