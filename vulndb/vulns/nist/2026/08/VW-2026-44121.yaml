title: The RapiSafe – Secure Multi File Upload for Contact Form 7 plugin for 
  WordPress is vulnerable to arbitrary file deletion due to insufficient file 
  path validation in the handleAjaxRemoveUpload function in all versions up to, 
  and including, 1.0.4. This makes it possible for unauthenticated attackers to 
  delete arbitrary files on the server, which can easily lead to remote code 
  execution when the right file is deleted (such as wp-config.php). The nonce 
  required to invoke the removal handler is exposed in public-facing JavaScript 
  as RSMFCF7Vars.nonce on every Contact Form 7 page rendering a RapiSafe upload 
  field, making it obtainable by any unauthenticated visitor.
