title: "Improper neutralization of input during web page generation in Apache Wicket.\n\
  \norg.apache.wicket.markup.html.form.Button clears the escape-model-strings flag
  in its constructor, so that the value attribute it writes is not encoded twice —
  ComponentTag already encodes attribute values when it writes the tag. That reasoning
  holds only for the attribute. When the component is attached to a <button> element
  rather than an <input>, it writes its model object into the element body instead,
  and nothing encodes an element body, so markup in the model is rendered as markup.\n\
  \nAn application is affected where it renders a Button on a <button> element and
  that button's model holds data an attacker can influence. Wicket cannot determine
  where a model value comes from, so whether it reaches the page from a request or
  from storage is a property of the application. The subclasses that inherit this
  constructor — AjaxButton, AjaxFallbackButton and WizardButton — are affected on
