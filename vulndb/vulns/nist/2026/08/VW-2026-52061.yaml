  affected element is the function set_range_matrix_on_string_array of the file 
  src/Common/opcua_types/sopc_builtintypes.c of the component String Array Range
  Writing. This manipulation causes out-of-bounds read. The attack is possible 
  to be carried out remotely. The project was informed of the problem early 
  through an issue report but has not responded yet.
