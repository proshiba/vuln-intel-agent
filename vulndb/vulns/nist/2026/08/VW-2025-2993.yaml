title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  Validate buffer length while parsing index\n\nindx_read is called when we have some
  NTFS directory operations that\nneed more information from the index buffers. This
  adds a sanity check\nto make sure the returned index buffer length is legit, or
  we may have\nsome out-of-bound memory accesses.\n\n[  560.897595] BUG: KASAN: slab-out-of-bounds
