title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5:
  Add a timeout to acquire the command queue semaphore\n\nPrevent forced completion
  handling on an entry that has not yet been\nassigned an index, causing an out of
  bounds access on idx = -22.\nInstead of waiting indefinitely for the sem, blocking
  flow now waits for\nindex to be allocated or a sem acquisition timeout before beginning
  the\ntimer for FW completion.\n\nKernel log example:\nmlx5_core 0000:06:00.0: wait_func_handle_exec_timeout:1128:(pid
  185911): cmd[-22]: CREATE_UCTX(0xa04) No done completion"
