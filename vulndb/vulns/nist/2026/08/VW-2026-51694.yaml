title: Kubeflow Pipelines enables users to build and deploy portable, scalable 
  machine learning workflows. Prior to 2.17.0, the Kubeflow Pipelines frontend 
  exposes an unauthenticated server-side request forgery vulnerability through 
  the /_proxy/ route in frontend/server/proxy-middleware.ts. The 
  _routePathWithReferer() function accepts an arbitrary attacker-controlled HTTP
  or HTTPS target and passes its origin to createProxyMiddleware without a host 
  allowlist or filtering for loopback, link-local, RFC1918, or cluster-local 
  addresses. The route remains outside the authorization middleware when 
  ENABLE_AUTHZ=true and is reachable through /apis/v1beta1/_proxy/, 
  /apis/v2beta1/_proxy/, /pipeline/apis/v1beta1/_proxy/, and 
  /pipeline/apis/v2beta1/_proxy/, including through a crafted Referer header. 
