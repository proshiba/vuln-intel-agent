title: "Improper neutralization of input during web page generation in Apache Wicket.\n\
  \norg.apache.wicket.markup.html.form.AbstractSingleSelectChoice, the base class
  of DropDownChoice, writes the body of the default option — the entry shown when
  no choice is selected — into the markup as it is, while every other option body
  in the same select is escaped according to the escape-model-strings setting. The
  body comes from getNullValidDisplayValue() or getNullKeyDisplayValue(), both of
  which are protected, so what they return is not necessarily the plain text the default
  implementation reads from a resource bundle.\n\nAn application is affected where
  it overrides one of those methods and returns a value holding data an attacker can
  influence, or where its own nullValid or null bundle entry holds such a value. The
  bundles shipped with Wicket contain plain text. RadioChoice overrides getDefaultChoice
  to emit no default option and is not affected.\n\nAs a workaround, escape the value
  in the override.\n\nThi"
