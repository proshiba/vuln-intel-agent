title: An insecure direct object reference vulnerability in PhotoPrism through 
  commit bb0b933 allows any user with a valid preview token to retrieve the 
  original-resolution cover photo of any album. The AlbumCover handler does not 
  verify that the requesting user is authorized to access the specified album 
  before serving the cover image. An attacker with any valid preview token can 
  enumerate and download album cover images belonging to other users.
