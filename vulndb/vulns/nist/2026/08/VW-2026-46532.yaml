title: Koha before 26.05.02, 25.11.07, and 25.05.13 contains a stored cross-site
  scripting vulnerability in the purchase suggestion handler that allows 
  authenticated staff users to inject malicious scripts by submitting 
  unsanitized input through the suggestion save operation. Attackers can supply 
  crafted HTML or script content in fields such as title, author, isbn, 
  publishercode, place, collectiontitle, itemtype, and note, which are stored 
  without sanitization and later rendered in the suggestion list template, 
  causing injected scripts to execute in the browser of any staff user who views
  the suggestions.
