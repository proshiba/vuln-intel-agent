title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfsverity:
  Fix bpf_get_fsverity_digest() dynptr assumptions\n\nThe BPF verifier and the dynptr
  abstraction ensure that the memory space\nreferenced by a dynptr remains valid.\
  \  They do not, however, provide any\nguarantee that the contents of the memory
  are stable.  kfuncs are\nexpected to remain memory-safe even if concurrent modifications
  occur.\n\nbpf_get_fsverity_digest() didn't follow that: it could crash if\narg->digest_size
  was concurrently modified.\n\nFix that by using the known-good value hash_alg->digest_size
  instead.\n\nAlso widen 'dynptr_sz' and 'out_digest_sz' to u64 to match the return\n\
  type of __bpf_dynptr_size().  It doesn't appear that it can actually be\nmore than
  INT_MAX currently (since __bpf_dynptr_data_rw() excludes\nfile-based pointers),
  but the correct type might as well be used."
