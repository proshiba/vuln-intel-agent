title: n8n before 1.123.69, 2.33.4, and 2.34.1 contains a PostgREST filter 
  injection vulnerability in the Supabase node's Row Get Many, Delete, and 
  Update operations, which built filter queries by concatenating an 
  expression-bindable value without escaping. An attacker could inject a 
  condition that widened the filter to match every row, turning an intended 
  single-row operation into full-table disclosure, deletion, or modification.
