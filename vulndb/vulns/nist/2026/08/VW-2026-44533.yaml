title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfs:
  Fix writeback error handling\n\nFix the error handling in writeback_iter() loop.\
  \  If an error occurs,\nwriteback_iter() needs to be called again with *error set
  to the error so\nthat it can clean up iteration state.  Further, the current folio
  needs\nunlocking and redirtying."
