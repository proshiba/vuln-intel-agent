title: Omnigent is an open-source AI agent framework and meta-harness for 
  orchestrating coding agents. Prior to 0.3.0, multipart POST /v1/sessions 
  accepts an authenticated user's agent bundle and omnigent/server/bundles.py 
  validate_agent_bundle does not reject a tools..callable dotted Python path. 
  omnigent/runner/tool_dispatch.py _resolve_spec_callable imports the specified 
  module and _execute_spec_callable_tool invokes the resolved function, allowing
  a bundle to select subprocess.check_output and execute a local command with 
  the runner process permissions. This can expose runner files, environment 
  variables, credentials, workspace data, internal services, and availability 
  without administrator access. This issue is fixed in version 0.3.0.
