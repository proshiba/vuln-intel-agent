title: ToolJet before v3.16.208 fails to validate organization membership in 
  database read routes, allowing any authenticated user to access other 
  organizations' table schemas and row data. Attackers can supply arbitrary 
  organization IDs in URL parameters to list tables, retrieve column 
  definitions, and execute join queries to read actual stored data from victim 
  organizations.
