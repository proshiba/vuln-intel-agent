title: A weakness has been identified in WonderTrader up to 0.9.9. This 
  vulnerability affects the function MatchEngine::update_lob of the file 
  src/WtBtCore/MatchEngine.cpp of the component Internal Limit Order Book Cache 
  Handler. This manipulation causes enforcement of behavioral workflow. Remote 
  exploitation of the attack is possible. The exploit has been made available to
  the public and could be used for attacks. The vendor was contacted early about
  this disclosure but did not respond in any way.
