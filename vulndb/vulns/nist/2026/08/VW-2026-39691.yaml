title: DjangoCRM ships with its Django SECRET_KEY hardcoded directly in the 
  committed webcrm/settings.py rather than read from an environment variable. 
  Since this key is used for session signing, CSRF token generation, and 
  password reset tokens, anyone who reads the public repository can forge valid 
  session cookies (including for the superadmin account), forge CSRF tokens, and
  forge password reset tokens, achieving full account takeover.
