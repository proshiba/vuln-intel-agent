title: "In the Linux kernel, the following vulnerability has been resolved:\n\nriscv:
  lib: Fix ZBB strnlen reading past count boundary\n\nThe ZBB-optimized strnlen loop
  loads one word ahead before checking the\naligned boundary:\n\n    REG_L   t1, SZREG(t0)\
  \       // load next word\n    addi    t0, t0, SZREG       // advance\n    orc.b\
  \   t1, t1\n    bgeu    t0, t4, 4f          // boundary check AFTER load\n\nwhere
  t4 = (s + count) & -SZREG.  When s is aligned and count is a\nmultiple of SZREG,
  t4 equals s + count and the loop loads a full word\nstarting at exactly s + count.\
  \  If s + count falls on a page boundary\nwith the next page unmapped, this faults.\n\
  \nFix by computing the aligned boundary from the last valid byte\n(s + count - 1)
  instead of s + count.  This makes the loop stop at the\nword containing the last
  valid byte rather than potentially loading the\nword after it.  The count == 0 case
  is already handled by the beqz\nearly exit.\n\nAlso add a pre-loop guard (bgeu t0,
  t4) for the case where all valid\nbyte"
