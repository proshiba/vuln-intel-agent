title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel/amdxdna:
  Fix leak when pinning ubuf pages\n\nWhen pin_user_pages_fast() returns fewer pages
  than requested, the pages\nthat were successfully pinned are not released, leading
  to a leak.\n\nFix this by unpinning any partially pinned pages before returning
  failure."
