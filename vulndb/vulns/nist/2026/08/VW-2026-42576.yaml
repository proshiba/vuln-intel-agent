title: nanoid is a secure, URL-friendly, unique string ID generator for 
  JavaScript. Prior to versions 3.3.12 and 5.1.11, the nanoid(size) function in 
  index.js and index.cjs coerces the user-influenced size parameter to a signed 
  32-bit integer, allowing a value of 2147483648 to become -2147483648 and 
  corrupt the process-wide CSPRNG poolOffset in fillPool(), which causes 
  subsequent session tokens, CSRF tokens, API keys, and unique identifiers to 
  become the deterministic string "uuuuuuuuuuuuuuuuuuuuu" until the process 
  restarts. This issue is fixed in versions 3.3.12 and 5.1.11.
