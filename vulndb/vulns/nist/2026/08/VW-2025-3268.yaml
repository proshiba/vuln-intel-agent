title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-mq:
  fix tags leak when shrink nr_hw_queues\n\nAlthough we don't need to realloc set->tags[]
  when shrink nr_hw_queues,\nwe need to free them. Or these tags will be leaked.\n\
  \nHow to reproduce:\n1. mount -t configfs configfs /mnt\n2. modprobe null_blk nr_devices=0
  submit_queues=8\n3. mkdir /mnt/nullb/nullb0\n4. echo 1 > /mnt/nullb/nullb0/power\n\
  5. echo 4 > /mnt/nullb/nullb0/submit_queues\n6. rmdir /mnt/nullb/nullb0\n\nIn step
  4, will alloc 9 tags (8 submit queues and 1 poll queue), then\nin step 5, new_nr_hw_queues
  = 5 (4 submit queues and 1 poll queue).\nAt last in step 6, only these 5 tags are
  freed, the other 4 tags leaked."
