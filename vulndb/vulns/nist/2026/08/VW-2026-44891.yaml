title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  kvaser_usb_leaf: kvaser_usb_leaf_wait_cmd(): validate received command extents\n\
  \nThe wait and bulk receive paths walk variable-length commands from a\nUSB buffer.
  A nonzero command shorter than CMD_HEADER_LEN can still be\ndispatched, and the
  wait path copies a matching command into a fixed\ncaller-owned struct kvaser_cmd
  using the device-provided length.\n\nReject nonzero commands that do not contain
  the fixed header or that\nextend beyond the current USB buffer item. In the wait
  path, also reject\na matching command that exceeds the destination before copying
  it."
