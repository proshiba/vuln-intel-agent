title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfs:
  bounds-check buffer log item's dirty bitmap\n\nxlog_recover_do_reg_buffer() replays
  each dirty region described by a\nbuffer log item's bitmap into the buffer read
  for that item:\n\n\tmemcpy(xfs_buf_offset(bp, (uint)bit << XFS_BLF_SHIFT),\n\t\t\
  item->ri_buf[i].iov_base,\n\t\tnbits << XFS_BLF_SHIFT);\n\nThe destination offset
  (bit/nbits, from the logged dirty bitmap) and the\nbuffer size (from the logged
  blf_len) are both attacker-controlled and\notherwise unrelated, yet the only thing
  bounding the copy is an ASSERT(),\nwhich compiles away on production kernels. A
  crafted image logging a\nsmall blf_len together with a bitmap bit past the end of
  that buffer\ndrives the memcpy() past the buffer's allocation, corrupting adjacent\n\
