title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsmb:
  client: fix UAF in smb2_reconnect_server()\n\nThe UAF bug is due to smb2_reconnect_server()
  accessing a session that\nis already being teared down by another thread that is
  executing\n__cifs_put_smb_ses().  This can happen when (a) the client has\nconnection
  to the server but no session or (b) another thread ends up\nsetting @ses->ses_status
  again to something different than\nSES_EXITING.\n\nTo fix this, we need to make
  sure to unconditionally set\n@ses->ses_status to SES_EXITING and prevent any other
  threads from\nsetting a new status while we're still tearing it down.\n\nThe following
  can be reproduced by adding some delay to right after\nthe ipc is freed in __cifs_put_smb_ses()
  - which will give\nsmb2_reconnect_server() worker a chance to run and then accessing\n\
  @ses->ipc:\n\nkinit ...\nmount.cifs //srv/share /mnt/1 -o sec=krb5,nohandlecache,echo_interval=10\n\
  [disconnect srv]\nls /mnt/1 &>/dev/null\nsleep 30\nkdestroy\n[reconnect srv"
