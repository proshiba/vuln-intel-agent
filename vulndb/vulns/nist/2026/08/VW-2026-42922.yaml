title: The Import WP  WordPress plugin before 2.14.23 does not perform any 
  authorization check on one of its export-file download handlers, allowing 
  unauthenticated attackers to download export files generated by 
  administrators, which may contain user personal data such as email addresses, 
  login names and roles. Exploitation requires an unconsumed export to already 
  exist and a low-entropy, time-based download key to be obtained.
