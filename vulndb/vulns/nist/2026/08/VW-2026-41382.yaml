title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mt76: mt7925: guard link STA in decap offload\n\nmt7925_sta_set_decap_offload()
  iterates over the vif valid_links mask\nwhen updating decap offload state for an
  MLO station. The station may not\nhave a link STA for every valid link of the vif,
  so mt792x_sta_to_link()\ncan return NULL for a link that belongs to the vif but
  not to the station.\n\nThe function currently dereferences mlink before checking
  whether the\nlink WCID is ready. If mlink is NULL, setting or clearing\nMT_WCID_FLAG_HDR_TRANS
  dereferences a NULL pointer.\n\nSkip links without a station link before touching
  mlink->wcid."
