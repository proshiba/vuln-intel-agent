title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdgpu:
  Fix context pstate override handling\n\nThere are several problems in the context
  pstate handling code.\n\nThe most serious ones are potential use-after-free and
  NULL pointer\ndereferences at context initialization time. Both are due\namdgpu_ctx_init()
  not holding the adev->pm.stable_pstate_ctx_lock, which\nis otherwise used from both
  sysfs and the context code itself for\nmodifying and clearing the stored context
  pointer.\n\nSecond issue is that context fini can trample over the pstate\nconfiguration
  set via sysfs. This is due the restore state\n(ctx->stable_pstate) being saved at
  context init time, and not if, or when\nthe context actually changes the pstate.
  As the context exits it will\ntherefore incorrectly restore to what was set before
  the sysfs override\nwas requested.\n\nThe simplest fix is to drastically simplify
  how the state is tracked, by\nclearly defining the points at which pstate ownership
