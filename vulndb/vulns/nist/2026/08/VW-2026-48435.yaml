title: VeraCrypt provides disk encryption with strong security based on 
  TrueCrypt. Prior to 1.26.29, non-default builds created with WOLFCRYPT=1 and 
  WOLFCRYPT_BACKEND route SHA-256 and SHA-512 volume-header key derivation 
  through derive_key_sha256 and derive_key_sha512 in src/Crypto/wolfCrypt.c, 
  where the configured iterations value is discarded and wc_HKDF is used instead
  of PBKDF2-HMAC. Changing the PIM or iteration count therefore does not 
  increase derivation cost, allowing an attacker with an affected container, 
  disk image, or volume header to perform substantially cheaper offline password
  guesses. Official precompiled VeraCrypt binaries and normal distribution 
  packages use the standard PBKDF2 backend and are not affected. Volumes created
  by an affected WOLFCRYPT=1 build require backup and recreation because 
  corrected builds derive different keys. This issue is fixed in version 
  1.26.29.
