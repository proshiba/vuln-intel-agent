title: A vulnerability was detected in sambitraj Student-Management-System up to
  56ba287f2e9031523ccb4244cb6e3fe530e4e5d5. Affected by this issue is some 
  unknown functionality of the component Dashboard. The manipulation of the 
  argument roll_no/teacher_name results in sql injection. The attack can be 
  executed remotely. The exploit is now public and may be used. This product 
  implements a rolling release for ongoing delivery, which means version 
  information for affected or updated releases is unavailable. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
