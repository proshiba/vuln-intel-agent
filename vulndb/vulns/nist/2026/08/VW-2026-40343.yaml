title: "The Swagger UI Try-out console within the API Publisher documentation allows
  an external Swagger API definition URL to be loaded, overriding the existing API
  definitions within the Publisher portal.\n\nBy exploiting this vulnerability, malicious
  actors can deceive users into interacting with these overwritten API definitions.
  This could lead to the exposure of sensitive information or the initiation of unintended
  requests to backend services."
