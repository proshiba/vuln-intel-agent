title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pci: Reject adapter interrupt forwarding if already enabled\n\nThe MPCIFC
  instruction doesn't allow registering adapter interrupts without\nfirst unregistering.
  So reject any request to enable interrupt forwarding\nif its already enabled for
  the zPCI device. This also fixes overwriting and\nthus leaking resources when the
  ioctl is called multiple times for the same\ndevice."
