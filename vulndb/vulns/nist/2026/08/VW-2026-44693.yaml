title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  xilinx: use FIFO occupancy register to determine buffer size\n\nThe method the driver
  uses to determine the size of the FIFO has a\nproblem. What it currently does is
  this:\nIt stops the SPI hardware and writes to the TX FIFO register until TX\nFIFO
  FULL asserts in the status register. But the hardware does not only\nhave the FIFO,
  it also has a shift register which can hold a byte. This\ncan be seen, when writing
  a byte to the FIFO (while the SPI hardware is\nstopped,) the TX FIFO EMPTY is still
  empty. So, if we have a FIFO size\nof 16 for example, the current method returns
  a 17.\nThis is a problem, at least when using the driver in irq mode. The same\n\
  size determined for the TX FIFO is also assumed for the RX FIFO. When a\nSPI transaction
  wants to write the amount of the FIFO size or more\nbytes, the following happens,
  for example with 16 bytes FIFO size:\nThe driver stops the SPI hardware and writes
  17 bytes to the TX FIFO"
