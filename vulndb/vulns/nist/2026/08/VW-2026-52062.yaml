title: A vulnerability was identified in Systerel S2OPC up to 1.7.3. The 
  impacted element is the function 
  monitored_item_event_filter_treatment_bs__init_event_filter_ctx_and_result of 
  the file src/ClientServer/services/bgenc/subscription_mgr.c. Such manipulation
  of the argument EventFilter leads to use after free. The attack may be 
  performed from remote. The exploit is publicly available and might be used. 
  The name of the patch is a4cee16a851b971be447a6ed531173702c722b99. It is best 
  practice to apply a patch to resolve this issue.
