title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  don't allow mapping the MMIO HDP page with large pages\n\nWe don't get the right
  offset in that case.  The GPU has\nan unused 4K area of the register BAR space into
  which you can\nremap registers.  We remap the HDP flush registers into this\nspace
  to allow userspace (CPU or GPU) to flush the HDP when it\nupdates VRAM.  However,
  on systems with >4K pages, we end up\nexposing PAGE_SIZE of MMIO space."
