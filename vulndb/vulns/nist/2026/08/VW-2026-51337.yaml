title: The ElementsKit Pro plugin for WordPress is vulnerable to Stored 
  Cross-Site Scripting via the 's' parameter of the Advanced Search REST 
  endpoint in all versions up to, and including, 4.10.1 due to insufficient 
  input sanitization and output escaping. The REST endpoint at 
  /wp-json/elementskit/v1/advanced-search uses permission_callback set to 
  __return_true, allowing unauthenticated access. Search terms are stored in the
  ekit_advanced_search_popular_keyword WordPress option via update_option(). 
  While sanitize_text_field() is applied, it does not encode double quotes, and 
  the stored keywords are rendered in HTML attributes via sprintf without 
  esc_attr(), allowing attribute injection. This makes it possible for 
  unauthenticated attackers to inject arbitrary web scripts in pages that will 
  execute whenever a user triggers the "no results" popular keywords view on 
  pages using the Advanced Search widget.
