title: Malcolm is a network traffic analysis tool suite. Prior to version 
  26.07.0, `safe-extract.py` extracts uploaded archives with no limit on entry 
  count, directory depth, total entries, or output size. A small malicious 
  archive containing a large number of directory or file entries causes the 
  filebeat processing container to create an unbounded number of filesystem 
  objects, exhausting inodes or filesystem metadata and denying service to the 
  processing pipeline and any service sharing the same mount. Version 26.07.0 
  fixes the issue.
