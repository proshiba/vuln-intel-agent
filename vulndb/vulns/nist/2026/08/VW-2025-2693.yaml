title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndpaa2-eth:
  retrieve the virtual address before dma_unmap\n\nThe TSO header was DMA unmapped
  before the virtual address was retrieved\nand then used to free the buffer. This
  meant that we were actually\nremoving the DMA map and then trying to search for
  it to help in\nretrieving the virtual address. This lead to a invalid virtual address\n\
  being used in the kfree call.\n\nFix this by calling dpaa2_iova_to_virt() prior
  to the dma_unmap call.\n\n[  487.231819] Unable to handle kernel paging request
  at virtual address fffffd9807000008\n\n(...)\n\n[  487.354061] Hardware name: SolidRun
  LX2160A Honeycomb (DT)\n[  487.359535] pstate: a0400005 (NzCv daif +PAN -UAO -TCO
  -DIT -SSBS BTYPE=--)\n[  487.366485] pc : kfree+0xac/0x304\n[  487.369799] lr :
  kfree+0x204/0x304\n[  487.373191] sp : ffff80000c4eb120\n[  487.376493] x29: ffff80000c4eb120
  x28: ffff662240c46400 x27: 0000000000000001\n[  487.383621] x26: 0000000000000001
  x25: ffff662246da0cc0 x24:"
