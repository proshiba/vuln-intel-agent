title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Make bpf_refcount_acquire fallible for non-owning refs\n\nThis patch fixes an incorrect
  assumption made in the original\nbpf_refcount series [0], specifically that the
  BPF program calling\nbpf_refcount_acquire on some node can always guarantee that
  the node is\nalive. In that series, the patch adding failure behavior to rbtree_add\n\
  and list_push_{front, back} breaks this assumption for non-owning\nreferences.\n\
  \nConsider the following program:\n\n  n = bpf_kptr_xchg(&mapval, NULL);\n  /* skip
  error checking */\n\n  bpf_spin_lock(&l);\n  if(bpf_rbtree_add(&t, &n->rb, less))
  {\n    bpf_refcount_acquire(n);\n    /* Failed to add, do something else with the
  node */\n  }\n  bpf_spin_unlock(&l);\n\nIt's incorrect to assume that bpf_refcount_acquire
  will always succeed in this\nscenario. bpf_refcount_acquire is being called in a
  critical section\nhere, but the lock being held is associated with rbtree t, which
  isn't\nnecessarily the lock assoc"
