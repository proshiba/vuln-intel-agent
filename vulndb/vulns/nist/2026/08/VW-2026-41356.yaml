title: "In the Linux kernel, the following vulnerability has been resolved:\n\nLoongArch:
  BPF: Fix memory leak in bpf_jit_free()\n\nWhen bpf_int_jit_compile() is called for
  subprograms, it returns early\nduring the first pass (!prog->is_func || extra_pass
  is false), keeping\nctx->offset alive for the subsequent extra pass.\n\nIf JIT compilation
  fails for a later subprogram, the BPF core aborts and\ncalls bpf_jit_free() to clean
  up the first subprogram. However,\nbpf_jit_free() fails to free jit_data->ctx.offset,
  which causes a memory\nleak of the JIT context offsets array.\n\nSo fix this by
  adding the missing kvfree(jit_data->ctx.offset) in\nbpf_jit_free()."
