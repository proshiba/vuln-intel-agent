title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  ethernet: arc: emac: quiesce interrupts before requesting IRQ\n\nNormal RX/TX interrupts
  are enabled later, in arc_emac_open(), so probe\nshould not see interrupt delivery
  in the usual case. However, hardware may\nstill present stale or latched interrupt
  status left by firmware or the\nbootloader.\n\nIf probe later unwinds after devm_request_irq()
  has installed the handler,\nsuch a stale interrupt can still reach arc_emac_intr()
  during teardown and\nrace with release of the associated net_device.\n\nAvoid that
  window by putting the device into a known quiescent state before\nrequesting the
  IRQ: disable all EMAC interrupt sources and clear any\npending EMAC interrupt status
  bits. This keeps the change hardware-focused\nand minimal, while preventing spurious
  IRQ delivery from leftover state."
