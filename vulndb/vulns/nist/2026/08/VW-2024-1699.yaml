title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  br_netfilter: skip conntrack input hook for promisc packets\n\nFor historical reasons,
  when bridge device is in promisc mode, packets\nthat are directed to the taps follow
  bridge input hook path. This patch\nadds a workaround to reset conntrack for these
  packets.\n\nJianbo Liu reports warning splats in their test infrastructure where\n\
  cloned packets reach the br_netfilter input hook to confirm the\nconntrack object.\n\
  \nScratch one bit from BR_INPUT_SKB_CB to annotate that this packet has\nreached
  the input hook because it is passed up to the bridge device to\nreach the taps.\n\
  \n[   57.571874] WARNING: CPU: 1 PID: 0 at net/bridge/br_netfilter_hooks.c:616 br_nf_local_in+0x157/0x180
  [br_netfilter]\n[   57.572749] Modules linked in: xt_MASQUERADE nf_conntrack_netlink
  nfnetlink iptable_nat xt_addrtype xt_conntrack nf_nat br_netfilter rpcsec_gss_krb5
  auth_rpcgss oid_registry overlay rpcrdma rdma_ucm ib_iser libiscsi scsi_transp"
