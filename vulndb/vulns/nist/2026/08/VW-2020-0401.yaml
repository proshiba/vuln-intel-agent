title: "A spoofing vulnerability exists when Microsoft SharePoint Server does not
  properly sanitize a specially crafted web request to an affected SharePoint server.
  An authenticated attacker could exploit the vulnerability by sending a specially
  crafted request to an affected SharePoint server.\nThe attacker who successfully
  exploited the vulnerability could then perform cross-site scripting attacks on affected
  systems and run script in the security context of the current user. These attacks
  could allow the attacker to read content that the attacker is not authorized to
  read, use the victim's identity to take actions on the SharePoint site on behalf
  of the user, such as change permissions and delete content, and inject malicious
  content in the browser of the user.\nThe security update addresses the vulnerability
  by helping to ensure that SharePoint Server properly sanitizes web requests."
