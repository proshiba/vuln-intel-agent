title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  qla2xxx: Wait for io return on terminate rport\n\nSystem crash due to use after
  free.\nCurrent code allows terminate_rport_io to exit before making\nsure all IOs
  has returned. For FCP-2 device, IO's can hang\non in HW because driver has not tear
  down the session in FW at\nfirst sign of cable pull. When dev_loss_tmo timer pops,\n\
  terminate_rport_io is called and upper layer is about to\nfree various resources.
  Terminate_rport_io trigger qla to do\nthe final cleanup, but the cleanup might not
  be fast enough where it\nleave qla still holding on to the same resource.\n\nWait
  for IO's to return to upper layer before resources are freed."
