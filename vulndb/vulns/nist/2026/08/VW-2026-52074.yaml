title: A vulnerability was detected in open62541 up to 1.5.5. Affected by this 
  vulnerability is the function UA_DataValue_backend_copyRange of the file 
  plugins/historydata/ua_history_data_backend_memory.c of the component History 
  Backend. The manipulation results in use after free. The attack can be 
  launched remotely. The exploit is now public and may be used. The project 
  closed the issue report, stating that this is not the official way to report a
  security vulnerability.
