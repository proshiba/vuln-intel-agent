title: "In the Linux kernel, the following vulnerability has been resolved:\n\ntipc:
  clear sock->sk on the failed-insert path in tipc_sk_create()\n\nWhen tipc_sk_create()
  fails to insert the new socket (tipc_sk_insert()\nreturns non-zero), its error path
  frees the sk with sk_free() but leaves\nsock->sk pointing at the freed object:\n\
  \n\tif (tipc_sk_insert(tsk)) {\n\t\tsk_free(sk);\n\t\tpr_warn(\"Socket create failed;
  port number exhausted\\n\");\n\t\treturn -EINVAL;\n\t}\n\nThis is harmless for plain
  socket(): the syscall layer clears sock->ops\nbefore releasing, so tipc_release()
  is never called. It is not harmless\non the accept() path. tipc_accept() creates
  the pre-allocated child\nsocket with tipc_sk_create(net, new_sock, 0, kern); on
  failure it leaves\nnew_sock->sk dangling and new_sock->ops non-NULL, and do_accept()
  then\nfput()s the new file, so __sock_release() -> tipc_release() runs\nlock_sock(new_sock->sk)
  on the freed sk -- a use-after-free write of the\nsk_lock spinlock.\n\ntipc_release()
  already guards this exact "
