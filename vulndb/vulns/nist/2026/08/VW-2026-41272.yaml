title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  timer: drain a slave's callback before its master detaches it\n\nsnd_timer_close_locked()
  drains the closing instance's own in-flight\ncallback (IFLG_CALLBACK) before freeing
  it, but not its slaves'. When a\nmaster instance is closed, remove_slave_links()
  clears each slave's\n->timer; the slave's own close then reads timer == NULL and
  takes the\nbranch that skips the drain entirely (snd_timer_stop_slave() also no-ops\n\
  on a NULL timer). So a slave whose callback is still running when the\nmaster is
  closed is freed underneath the live callback, leading to\nuse-after-free.\n\nDrain
  the slaves too before remove_slave_links() severs them.\nsnd_timer_stop() has already
  taken this instance off the active list, so\nno new slave callback can be queued.
  Take the slaves off the ack list so\na pending one can't fire either, then wait
  for any that is already in\nflight."
