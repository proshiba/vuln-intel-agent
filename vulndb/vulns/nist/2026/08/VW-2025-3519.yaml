title: "In the Linux kernel, the following vulnerability has been resolved:\n\nath11k:
  disable spectral scan during spectral deinit\n\nWhen ath11k modules are removed
  using rmmod with spectral scan enabled,\ncrash is observed. Different crash trace
  is observed for each crash.\n\nSend spectral scan disable WMI command to firmware
  before cleaning\nthe spectral dbring in the spectral_deinit API to avoid this crash.\n\
  \ncall trace from one of the crash observed:\n[ 1252.880802] Unable to handle kernel
  NULL pointer dereference at virtual address 00000008\n[ 1252.882722] pgd = 0f42e886\n\
  [ 1252.890955] [00000008] *pgd=00000000\n[ 1252.893478] Internal error: Oops: 5
  [#1] PREEMPT SMP ARM\n[ 1253.093035] CPU: 0 PID: 0 Comm: swapper/0 Not tainted 5.4.89
  #0\n[ 1253.115261] Hardware name: Generic DT based system\n[ 1253.121149] PC is
  at ath11k_spectral_process_data+0x434/0x574 [ath11k]\n[ 1253.125940] LR is at 0x88e31017\n\
  [ 1253.132448] pc : [<7f9387b8>]    lr : [<88e31017>]    psr: a0000193\n[ 1253.135488]
