title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  set new_stream to NULL after release\n\nIn dm_update_crtc_state(), the skip_modeset
  path releases new_stream\nvia dc_stream_release() but does not set the pointer to
  NULL.\n\nIf a later error (e.g., color management failure) triggers the fail\nlabel,
  the error path calls dc_stream_release() again on the same\ndangling pointer, causing
  a double release and potential use-after-free.\n\nFix this by setting new_stream
  to NULL after the initial release.\n\n(cherry picked from commit 99f3af19073b3ddbfd96e789124cce12c4277b28)"
