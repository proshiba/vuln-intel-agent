title: GitPython before 3.1.59 omits --separate-git-dir from 
  unsafe_git_clone_options, allowing attackers to create arbitrary git 
  directories outside the intended clone destination. Attackers can pass a 
  separate_git_dir parameter to Repo.clone_from() or Repo.clone() to redirect 
  repository metadata to an attacker-controlled filesystem path, enabling 
  arbitrary directory creation and potential hook execution.
