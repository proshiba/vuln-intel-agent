title: Grav is a file-based Web platform. Prior to 2.0.4, Grav allowlists the 
  regex_replace filter and function in system/config/security.yaml, and 
  GravExtension::regexReplace() passes an editor-controlled pattern directly to 
  preg_replace(). When security.twig_content.process_enabled is enabled, an 
  authenticated page editor can publish a catastrophically backtracking pattern 
  that consumes PHP worker CPU and denies service to site visitors. This issue 
  is fixed in version 2.0.4.
