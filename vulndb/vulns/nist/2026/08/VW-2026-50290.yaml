title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  synaptics-rmi4 - propagate F54 worker errors to V4L2 queue\n\nPreviously, rmi_f54_buffer_queue()
  waited for the worker thread to\nfinish but ignored whether it succeeded. If the
  worker failed (e.g.,\ndue to a timeout or register read failure), the queue thread
  would\nsilently return success, delivering stale or uninitialized memory to\nuserspace.\n\
  \nAdd a 'report_error' field to struct f54_data to store the worker's exit\nstatus.
  Check this field in rmi_f54_buffer_queue() after the worker\nfinishes, and mark
  the buffer as VB2_BUF_STATE_ERROR if an error\noccurred."
