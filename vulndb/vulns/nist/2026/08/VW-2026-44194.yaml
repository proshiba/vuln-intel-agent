title: "In the Linux kernel, the following vulnerability has been resolved:\n\ns390/monwriter:
  Reject buffer reuse with different data length\n\nWhen data buffers are reused,
  e.g. for interval sample records, the\nfirst record determines the data length,
  and the size of the buffer for\nuser copy. Current monwriter code does not check
  if the data length was\nchanged for subsequent records, which also would never happen
  for valid\nuser programs.\n\nHowever, a malicious user could change the data length,
  resulting in out\nof bounds user copy to the kernel buffer, and memory corruption.
  By\ndefault, the monwriter misc device is created with root-only permissions,\n\
  so practical impact is typically low.\n\nFix this by checking for changed data length
  and rejecting such records."
