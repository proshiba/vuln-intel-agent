title: PraisonAI is a multi-agent teams system. In versions 1.5.128 through 
  1.6.57, the praisonaiagents.tools.web_crawl_tools.web_crawl() function is 
  vulnerable to server-side request forgery. While it validates the initially 
  supplied URL and blocks direct loopback and private destinations, its default 
  httpx fallback uses httpx.Client(follow_redirects=True) and does not 
  revalidate intermediate or final redirect targets. An attacker who can 
  influence a URL passed to web_crawl(), directly or through an agent or tool 
  workflow, can supply an attacker-controlled public URL that passes the initial
  host check and then redirects to loopback, private-network, or cloud metadata 
  endpoints reachable from the host, with the redirected response body returned 
  in the web_crawl() result. This constitutes an incomplete fix and patch bypass
  for the previously disclosed web_crawl SSRF class (GHSA-qq9r-63f6-v542 / 
