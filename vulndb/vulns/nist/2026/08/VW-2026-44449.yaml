title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Drop bogus WARN for write to ZCR_EL2\n\nIt is entirely possible for a
  guest to write to the ZCR_EL2 sysreg alias\nwhile in a nested context, as it is
  expected if FEAT_NV2 is advertised\nto the L1 hypervisor.\n\nGet rid of the bogus
  WARN which, since the hyp vectors were installed at\nthis point, has the effect
  of a hyp_panic..."
