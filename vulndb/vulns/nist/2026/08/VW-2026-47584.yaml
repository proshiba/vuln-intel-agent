title: Termix is a web-based server management platform with SSH terminal, 
  tunneling, and file editing capabilities. Prior to 2.3.2, the POST 
  /host/db/proxy/test endpoint accepts the singleProxy, proxyChain, and 
  testTarget request fields without validating their destination addresses. The 
  testProxyConnectivity path uses raw TCP and SOCKS connections to 
  attacker-selected hosts and ports, allowing an authenticated user to probe 
  localhost, private networks, link-local metadata services, and other 
  infrastructure reachable from the Termix server. Structured connection errors 
  disclose host reachability and timing information, and successful metadata 
  access can expose cloud credentials. This issue is fixed in version 2.3.2.
