title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvhost_iotlb:
  bound map allocation in add_range\n\nvhost_iotlb_add_range_ctx() only retires an
  old entry when the table\nhas a non-zero limit, has exactly reached that limit and
  has\nVHOST_IOTLB_FLAG_RETIRE set. Non-retiring tables can keep allocating\nentries
  after reaching their configured limit.\n\nExisting vhost devices allocate their
  IOTLB with max_iotlb_entries from\nvhost.c, which defaults to 2048 and is tunable
  by module parameter. Use\nthe caller-provided limit at the allocation point instead
  of adding a\nseparate default in the common IOTLB helper, and reject non-positive\n\
  values in vhost paths that can report an error.\n\nOther vhost IOTLB users should
  not create zero-limit tables when entries\ncan be populated from userspace or guest-controlled
  requests. Add\ncaller-side max_iotlb_entries parameters for mlx5 vDPA, VDUSE and\n\
  vhost-vDPA. Reject non-positive VDUSE and vhost-vDPA values, and require\nat least
