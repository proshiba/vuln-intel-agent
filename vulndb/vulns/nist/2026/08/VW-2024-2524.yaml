title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/mremap:
  fix move_normal_pmd/retract_page_tables race\n\nIn mremap(), move_page_tables()
  looks at the type of the PMD entry and the\nspecified address range to figure out
  by which method the next chunk of\npage table entries should be moved.\n\nAt that
  point, the mmap_lock is held in write mode, but no rmap locks are\nheld yet.  For
  PMD entries that point to page tables and are fully covered\nby the source address
  range, move_pgt_entry(NORMAL_PMD, ...) is called,\nwhich first takes rmap locks,
  then does move_normal_pmd(). \nmove_normal_pmd() takes the necessary page table
  locks at source and\ndestination, then moves an entire page table from the source
  to the\ndestination.\n\nThe problem is: The rmap locks, which protect against concurrent
