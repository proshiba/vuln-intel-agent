title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_pci:
  Fix admin vq cleanup by using correct info pointer\n\nvp_modern_avq_cleanup() and
  vp_del_vqs() clean up admin vq\nresources by virtio_pci_vq_info pointer. The info
  pointer of admin\nvq is stored in vp_dev->admin_vq.info instead of vp_dev->vqs[].\n\
  Using the info pointer from vp_dev->vqs[] for admin vq causes a\nkernel NULL pointer
  dereference bug.\nIn vp_modern_avq_cleanup() and vp_del_vqs(), get the info pointer\n\
  from vp_dev->admin_vq.info for admin vq to clean up the resources.\nAlso make info
  ptr as argument of vp_del_vq() to be symmetric with\nvp_setup_vq().\n\nvp_reset
  calls vp_modern_avq_cleanup, and causes the Call Trace:\n==================================================================\n\
  BUG: kernel NULL pointer dereference, address:0000000000000000\n...\nCPU: 49 UID:
  0 PID: 4439 Comm: modprobe Not tainted 6.11.0-rc5 #1\nRIP: 0010:vp_reset+0x57/0x90
  [virtio_pci]\nCall Trace:\n <TASK>\n...\n ? vp_reset+0x57/0x90 [virtio"
