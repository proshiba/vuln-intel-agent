title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  SVM: Bump asid_generation on CPU online to avoid ASID collision after hotplug\n\n\
  If a vCPU stays scheduled out (or blocked) while the last pCPU it ran\non goes through
  a hotplug cycle (online->offline->online), and the vCPU\nthen resumes execution
  on the same pCPU, then it is possible for it to\nrun with an ASID that has now been
  assigned to a different vCPU,\nresulting in stale TLB translations being used.\n\
  \nsvm_enable_virtualization_cpu() resets asid_generation to 1 and sets\nnext_asid
  to max_asid + 1 on every CPU online event, including hotplug\ncycles.  Because next_asid
  starts beyond the pool boundary, the first\ncall to new_asid() after an online event
  always wraps the pool,\nincrementing asid_generation to 2 and assigning ASIDs starting
  from\nmin_asid.\n\nConsider two vCPUs from different VMs, vCPU-A pinned to CPU-X
  holding\nasid_generation=2 and ASID=N from before the hotplug event:\n\n  1. CPU-X
  goes offline and back onl"
