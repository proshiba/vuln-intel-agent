title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: fix iso_conn related locking and validity issues\n\nsk->sk_state indicates
  whether iso_pi(sk)->conn is valid. Operations\nthat check/update sk_state and access
  conn should hold lock_sock,\notherwise they can race.\n\nThe order of taking locks
  is hci_dev_lock > lock_sock > iso_conn_lock,\nwhich is how it is in connect/disconnect_cfm
  -> iso_conn_del ->\niso_chan_del.\n\nFix locking in iso_connect_cis/bis and sendmsg/recvmsg
  to take lock_sock\naround updating sk_state and conn.\n\niso_conn_del must not occur
  during iso_connect_cis/bis, as it frees the\niso_conn. Hold hdev->lock longer to
  prevent that.\n\nThis should not reintroduce the issue fixed in commit 241f51931c35\n\
  (\"Bluetooth: ISO: Avoid circular locking dependency\"), since the we\nacquire locks
  in order. We retain the fix in iso_sock_connect to release\nlock_sock before iso_connect_*
