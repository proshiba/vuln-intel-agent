title: openssl_encrypt versions before 1.4.0 contain a vulnerability in 
  PublicKeyBundle.from_dict() that creates key bundles from untrusted data 
  without verifying signatures. Attackers can call from_dict() followed by 
  to_identity() without signature verification to encrypt data using 
  attacker-controlled public keys, leaking secrets.
