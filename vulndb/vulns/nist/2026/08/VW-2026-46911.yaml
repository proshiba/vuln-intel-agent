title: 'Vulnerability in the PeopleSoft Enterprise FIN Lease Administration product
  of Oracle PeopleSoft (component: Lease Administration).   The supported version
  that is affected is 9.2. Difficult to exploit vulnerability allows low privileged
  attacker with logon to the infrastructure where PeopleSoft Enterprise FIN Lease
  Administration executes to compromise PeopleSoft Enterprise FIN Lease Administration.  While
  the vulnerability is in PeopleSoft Enterprise FIN Lease Administration, attacks
  may significantly impact additional products (scope change).  Successful attacks
  of this vulnerability can result in  unauthorized creation, deletion or modification
  access to critical data or all PeopleSoft Enterprise FIN Lease Administration accessible
  data as well as  unauthorized access to critical data or complete access to all
  PeopleSoft Enterprise FIN Lease Administration accessible data. CVSS 3.1 Base Score
  7.5 (Confidentiality and Integrity impacts).  CVSS Vector: (CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S'
