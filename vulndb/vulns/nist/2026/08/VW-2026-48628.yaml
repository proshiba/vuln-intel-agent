title: "In the Linux kernel, the following vulnerability has been resolved:\n\nptp:
  ocp: Fix board ID over-read\n\nThe EEPROM board ID is a fixed 13-byte field and
  is not guaranteed to\ncontain a NUL terminator. Passing it directly to\ndevlink_info_version_fixed_put()
  treats it as a C string and may read\nbeyond the field.\n\nFormat at most OCP_BOARD_ID_LEN
  bytes into the existing local buffer\nbefore reporting the ID. Use a precision limit
  because the snprintf()\noutput size alone does not bound the source string scan."
