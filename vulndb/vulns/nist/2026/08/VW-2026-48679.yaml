title: "In the Linux kernel, the following vulnerability has been resolved:\n\nserial:
  8250_dma: Clear stale RX state on shutdown\n\nserial8250_release_dma() terminates
  RX DMA and releases the channel, but\nleaves rx_running set.  If the port is closed
  while an RX transfer is\nactive, the stale state remains while rxchan is NULL until
  the channel is\nrequested again on the next open.\n\nThe DesignWare BUSY workaround
  added by commit a7b9ce39fbe4\n(\"serial: 8250_dw: Ensure BUSY is deasserted\") calls\n\
  serial8250_rx_dma_flush() from the LCR write path during startup.  This\nhappens
  before serial8250_request_dma() obtains a new RX channel.  On\nreopen, the stale
  rx_running state therefore makes the flush path pass a\nNULL channel to dmaengine_pause(),
  causing a kernel Oops.\n\nClear rx_running after terminating RX DMA, matching the
  TX cleanup.  Also\nmake the flush helper return if the DMA object or RX channel
  is not\navailable so startup and teardown paths cannot pass a NULL channel to the\n\
  DMAengine API."
