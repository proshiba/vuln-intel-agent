title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  reject free space cache with more entries than pages\n\nWhen loading a v1 free space
  cache, __load_free_space_cache() takes\nnum_entries and num_bitmaps straight from
  the on-disk\nbtrfs_free_space_header. That header is stored in the tree_root under
  a key\nwith type 0, which the tree-checker has no case for, so neither count is\n\
  validated before the load trusts it.\n\nThe load loops num_entries times and maps
  the next page whenever the current\none runs out, going through io_ctl_check_crc()
  -> io_ctl_map_page(), which\ndoes io_ctl->pages[io_ctl->index++]. But pages[] is
  allocated in\nio_ctl_init() from the cache inode's i_size, not from num_entries:\n\
  \n\tnum_pages = DIV_ROUND_UP(i_size_read(inode), PAGE_SIZE);\n\tio_ctl->pages =
  kcalloc(num_pages, sizeof(struct page *), GFP_NOFS);\n\nSo if num_entries claims
  more records than the pages can hold, io_ctl->index\nruns off the end of pages[].
  The write side never hits this because\nio"
