title: FreeRDP before 3.29.0 (affected versions <= 3.28.0) does not validate 
  CRLF and control characters in the server-controlled RDP redirection 
  TargetNetAddress field. This value is copied into the client's ServerHostname 
  and, when the client connects through an HTTP proxy, is written directly into 
  the proxy CONNECT request line and Host header by http_proxy_connect() without
  filtering. A malicious or compromised RDP server can send a crafted 
  redirection PDU containing embedded control characters to inject arbitrary 
  headers/requests into the HTTP proxy CONNECT request.
