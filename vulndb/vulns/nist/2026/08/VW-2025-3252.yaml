title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: iscsit: Free cmds before session free\n\nCommands from recovery entries
  are freed after session has been closed.\nThat leads to use-after-free at command
  free or NPE with such call trace:\n\nTime2Retain timer expired for SID: 1, cleaning
  up iSCSI session.\nBUG: kernel NULL pointer dereference, address: 0000000000000140\n\
  RIP: 0010:sbitmap_queue_clear+0x3a/0xa0\nCall Trace:\n target_release_cmd_kref+0xd1/0x1f0
  [target_core_mod]\n transport_generic_free_cmd+0xd1/0x180 [target_core_mod]\n iscsit_free_cmd+0x53/0xd0
  [iscsi_target_mod]\n iscsit_free_connection_recovery_entries+0x29d/0x320 [iscsi_target_mod]\n\
  \ iscsit_close_session+0x13a/0x140 [iscsi_target_mod]\n iscsit_check_post_dataout+0x440/0x440
  [iscsi_target_mod]\n call_timer_fn+0x24/0x140\n\nMove cleanup of recovery enrties
  to before session freeing."
