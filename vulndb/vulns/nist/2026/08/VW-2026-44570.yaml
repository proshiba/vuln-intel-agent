title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix insn_aux_data leak on verifier err_free_env path\n\nWhen bpf_check() allocates
  env->insn_aux_data successfully but later\nfails to allocate env->succ, it jumps
  directly to err_free_env.\n\nThe existing vfree(env->insn_aux_data) sits before
  the err_free_env\nlabel, so that direct jump bypasses it and leaks insn_aux_data.\n\
  \nMove vfree(env->insn_aux_data) into err_free_env so all early and late\nexit paths
  release it consistently."
