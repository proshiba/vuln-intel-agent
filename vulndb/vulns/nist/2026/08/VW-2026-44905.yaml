title: "In the Linux kernel, the following vulnerability has been resolved:\n\nublk:
  reset kernel-owned dev_info fields in ublk_ctrl_add_dev()\n\nublk_ctrl_add_dev()
  memcpy()s the userspace ublksrv_ctrl_dev_info into\nub->dev_info and then fixes
  up the fields the driver owns, but misses\n->state and ->ublksrv_pid.\n\nA device
  added with ->state = UBLK_S_DEV_LIVE passes the\n\"->state != UBLK_S_DEV_DEAD\"\
  \ test that ublk_stop_dev_unlocked() uses as its\nproxy for \"a disk is attached\"\
  , while ->ub_disk is still NULL, so DEL_DEV\nright after ADD_DEV oopses in del_gendisk().\
  \  UBLK_S_DEV_QUIESCED plus\nUBLK_F_USER_RECOVERY dies one step earlier, in ublk_force_abort_dev().\
  \  A\npoisoned ->state also gets START_USER_RECOVERY and the char device\nread/write
  path onto a device that was never started, and wedges START_DEV\nat -EEXIST.  A
  poisoned ->ublksrv_pid just makes GET_DEV_INFO report an\nunrelated task as the
  ublk server.\n\nReset both after the memcpy(), as ublk_detach_disk() does.  Userspace
  only\never reads these bac"
