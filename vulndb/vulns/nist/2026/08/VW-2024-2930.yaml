title: Multiple Cisco products are affected by a vulnerability in the Snort 
  Intrusion Prevention System (IPS) rule engine that could allow an 
  unauthenticated, remote attacker to bypass the configured rules on an affected
  system. This vulnerability is due to incorrect HTTP packet handling. An 
  attacker could exploit this vulnerability by sending crafted HTTP packets 
  through an affected device. A successful exploit could allow the attacker to 
  bypass configured IPS rules and allow uninspected traffic onto the network.
