title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/virtio:
  bound EDID block reads to the response buffer\n\nvirtio_get_edid_block() validates
  the read offset only against the\ndevice-supplied resp->size field, never against
  the fixed-size resp->edid\narray. The EDID block index is driven by the device-supplied
  extension\ncount, so a malicious virtio-gpu backend can advertise a large size\n\
  together with a high block count and read far past the array into adjacent\nkernel
  memory, which is then surfaced in the parsed EDID (an out-of-bounds\nread / info
  leak).\n\nAlso reject any read whose end exceeds the size of the edid array.\nConforming
  EDID responses stay within the array and are unaffected."
