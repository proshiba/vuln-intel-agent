title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amd/display:
  Check for tg ops in dce110_set_avmute\n\nSome older DCE timing generators do not
  implement is_tg_enabled in\ntheir ops table. Calling it unconditionally when waiting
  for AV mute\nframes causes a NULL pointer dereference on Southern Islands dGPUs\n\
  when turning the display off over HDMI.\n\nCheck that tg and the required ops exist
  before waiting for frames.\n\n(cherry picked from commit 2686a0c0aaa07bec2e24131835cf27b5fd4935a5)"
