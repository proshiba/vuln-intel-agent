title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  bcm: defer rx_op deallocation to workqueue to fix thrtimer UAF\n\nCommit f1b4e32aca08
  (\"can: bcm: use call_rcu() instead of costly\nsynchronize_rcu()\") replaced synchronize_rcu()
  in bcm_delete_rx_op()\nwith call_rcu() and introduced the RX_NO_AUTOTIMER flag.\n\
  \nHowever, this flag check was omitted for thrtimer in the packet rx\nfast-path.
  During BCM RX operation teardown, a concurrent RCU reader\n(bcm_rx_handler) can
  race and re-arm thrtimer via\nbcm_rx_update_and_send() after call_rcu() has been
  scheduled.  Once\nthe RCU grace period elapses, bcm_op is freed.  The subsequently\n\
  firing thrtimer then dereferences the deallocated op, causing a UAF.\n\nAdding flag
  checks to the rx fast-path (bcm_rx_update_and_send) does not\nfully close the TOCTOU
  race and introduces latency for every CAN frame.\nConversely, calling hrtimer_cancel()
  directly inside the RCU callback\n(softirq context) is fatal as hrtimer_cancel()
  can sleep, triggeri"
