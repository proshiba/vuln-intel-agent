title: AJCloud AJY IPC firmware prior to version 01.10715.11.37 contains a path 
  traversal vulnerability in the jdbhttpd web service that allows 
  unauthenticated remote attackers to read arbitrary files with root privileges 
  by supplying path traversal sequences in the HTTP request URI. Attackers can 
  send crafted HTTP requests to port 80 without authentication to access 
  sensitive files including cleartext RTSP credentials, Wi-Fi SSID and 
  pre-shared key, device serial number, and cloud binding parameters.
