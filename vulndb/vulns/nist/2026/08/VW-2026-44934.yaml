title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  usb-audio: fix use-after-free in ump_to_endpoint()\n\ncreate_midi2_ump() registers
  a card-owned snd_ump_endpoint and stores a\nback-pointer to its per-interface snd_usb_midi2_ump
  object in\nump->private_data, but it never installs an ump->private_free hook and\n\
  never clears that pointer.\n\nIf a later step of snd_usb_midi_v2_create() fails,
  its error path calls\nfree_all_midi2_umps(), which kfree()s the snd_usb_midi2_ump
  object while\nthe already-registered endpoint keeps pointing at it.  The created\n\
  /dev/snd/umpC*D* node stays exposed, so the first operation of any UMP\nopen, ump_to_endpoint(),
  dereferences the dangling ump->private_data and\nreads rmidi->eps[dir] out of freed
  memory.\n\nA malicious USB MIDI 2.0 device that makes creation fail after the\n\
