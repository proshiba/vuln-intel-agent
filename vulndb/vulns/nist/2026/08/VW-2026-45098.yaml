title: "The Youtube Showcase plugin for WordPress is vulnerable to Stored Cross-Site
  Scripting in versions up to, and including, 4.0.4 via the 'emd_mb_meta' shortcode.
  This is due to insufficient input sanitization and output escaping on attachment
  titles referenced by the shortcode's image field: EMD_MB_Helper::image_info() returns
  the attachment's raw post_title, and EMD_MB_Helper::shortcode() interpolates it
  into title=\"%s\" HTML attributes via sprintf() without esc_attr(). This makes it
  possible for authenticated attackers, with author-level access and above (upload_files
  capability required to create the attachment, edit_posts/publish_posts to embed
  the shortcode), to inject arbitrary web scripts in pages that will execute whenever
  a user accesses an injected page."
