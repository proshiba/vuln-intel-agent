title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  target: Bound PR-OUT TransportID parsing to the received buffer\n\ncore_scsi3_decode_spec_i_port()
  and core_scsi3_emulate_register_and_move()\nhand the raw PERSISTENT RESERVE OUT
  parameter buffer to\ntarget_parse_pr_out_transport_id() without telling it how many
  bytes are\nvalid.  For an iSCSI TransportID (FORMAT CODE 01b),\niscsi_parse_pr_out_transport_id()
  locates the \",i,0x\" ISID separator with\nan unbounded strstr() (and on the error
  path prints the name with a further\nunbounded \"%s\").  An initiator can submit
  a TransportID whose iSCSI name\ncontains neither a \",i,0x\" substring nor a NUL
  terminator, filling the\nparameter list to its end, so the scan runs off the end
  of the buffer.\n\nWhen the parameter list spans more than one page the buffer is
  a multi-page\nvmap (transport_kmap_data_sg()), so the over-read walks into the trailing\n\
  vmalloc guard page and oopses (KASAN: vmalloc-out-of-bounds in strstr).  It\nis
  reachable"
