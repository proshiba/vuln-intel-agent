title: nodemailer before 9.0.1 fails to apply disableFileAccess and 
  disableUrlAccess flags to message-level raw option, allowing authenticated 
  attackers to read arbitrary files or perform server-side request forgery by 
  supplying path or href properties. Attackers can exploit this by crafting raw 
  messages with file paths or URLs that bypass the intended sandbox, with 
  fetched content delivered in the outgoing message to attacker-controlled 
  recipients.
