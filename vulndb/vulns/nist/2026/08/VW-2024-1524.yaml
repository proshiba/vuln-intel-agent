title: "In the Linux kernel, the following vulnerability has been resolved:\n\nllc:
  call sock_orphan() at release time\n\nsyzbot reported an interesting trace [1] caused
  by a stale sk->sk_wq\npointer in a closed llc socket.\n\nIn commit ff7b11aa481f
  (\"net: socket: set sock->sk to NULL after\ncalling proto_ops::release()\") Eric
  Biggers hinted that some protocols\nare missing a sock_orphan(), we need to perform
  a full audit.\n\nIn net-next, I plan to clear sock->sk from sock_orphan() and\n\
  amend Eric patch to add a warning.\n\n[1]\n BUG: KASAN: slab-use-after-free in list_empty
  include/linux/list.h:373 [inline]\n BUG: KASAN: slab-use-after-free in waitqueue_active
  include/linux/wait.h:127 [inline]\n BUG: KASAN: slab-use-after-free in sock_def_write_space_wfree
  net/core/sock.c:3384 [inline]\n BUG: KASAN: slab-use-after-free in sock_wfree+0x9a8/0x9d0
  net/core/sock.c:2468\nRead of size 8 at addr ffff88802f4fc880 by task ksoftirqd/1/27\n\
  \nCPU: 1 PID: 27 Comm: ksoftirqd/1 Not tainted 6.8.0-rc1-syzkaller-00049-g6098d87eaf3"
