title: SQL injection in PostgreSQL EXTRACT() deparse allows an object owner to 
  execute arbitrary SQL as a superuser via a hostile object definition.  Attacks
  affect expression deparse consumers broadly, including pg_dump, psql commands 
  like \sf, and any similar usage in non-core tools.  Versions before PostgreSQL
  18.5, 17.11, 16.15, 15.19, and 14.24 are affected.
