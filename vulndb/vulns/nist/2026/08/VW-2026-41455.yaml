title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/vf:
  Fix VF CCS attach/detach race with in-flight BO moves\n\nxe_bo_move() attaches VF
  CCS read/write batch buffers (BBs) to a BO\nafter it transitions NULL/SYSTEM ->
  TT, and detaches them after it\ntransitions TT -> SYSTEM. Both operations were done
  synchronously on\nthe CPU immediately after building the move's copy/clear fence,\n\
  without waiting for that fence to signal. This creates two races with\nVF migration:\n\
  \n- Attach happens too late relative to the copy job it is meant to\n  protect.
  If the copy job is submitted before the CCS BBs are\n  attached, a VF migration
  event that pauses execution mid-copy can\n  observe partially copied CCS metadata
  without the attach state\n  needed to correctly save/restore it.\n\n- Detach happens
  too early relative to the copy job that moves data\n  out of TT. The CCS BBs are
  torn down right after the copy fence is\n  obtained, while the actual blit may still
  be in flight. A VF\n  migratio"
