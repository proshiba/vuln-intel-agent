title: A vulnerability was identified in OpenBoxes up to 0.9.6. This impacts the
  function buildZebraTemplate of the file 
  grails-app/controllers/org/pih/warehouse/core/DocumentController.groovy of the
  component Template Processing. The manipulation leads to improper 
  neutralization of special elements used in a template engine. It is possible 
  to initiate the attack remotely. The exploit is publicly available and might 
  be used. Upgrading to version 0.9.8-hotfix1 and 0.9.8 will fix this issue. The
  identifier of the patch is deeac6a4a7aba86ce99c4bda37142e41d209293e. It is 
  recommended to upgrade the affected component.
