title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  occ: validate poll response sensor blocks\n\nThe OCC poll response parser walks
  a counted list of sensor data blocks.\nIt used the static backing-array capacity
  as the parse boundary, but a\ntransport response makes only data_length bytes current
  and valid. A\ntruncated response can therefore make the parser consume a block header
  or\nblock extent outside the current response.\n\nUse data_length as the parent
  boundary, prove the fixed poll header and\neach current block header before reading
  them, and prove the complete block\nbefore advancing. Keep parsed sensor metadata
  local until the complete\nresponse has passed validation, then publish it. Propagate\n\
  malformed-response errors before publishing the OCC as active."
