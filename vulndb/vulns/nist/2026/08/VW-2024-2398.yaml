title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/client:
  add missing bo locking in show_meminfo()\n\nbo_meminfo() wants to inspect bo state
  like tt and the ttm resource,\nhowever this state can change at any point leading
  to stuff like NPD and\nUAF, if the bo lock is not held. Grab the bo lock when calling\n\
  bo_meminfo(), ensuring we drop any spinlocks first. In the case of\nobject_idr we
  now also need to hold a ref.\n\nv2 (MattB)\n  - Also add xe_bo_assert_held()\n\n\
  (cherry picked from commit 4f63d712fa104c3ebefcb289d1e733e86d8698c7)"
