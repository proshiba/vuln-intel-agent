title: 'A vulnerability was identified in Webkul Bagisto up to 2.4.4. This vulnerability
  affects unknown code of the file /admin/customers of the component Backend Customer
  Behavior Data Endpoint. Such manipulation of the argument ID leads to improper privilege
  management. The attack can be executed remotely. The exploit is publicly available
  and might be used. The vendor confirms: "The reported issues were already identified
  through our internal security assessment process prior to this notification and
  are being handled through our established internal security and development lifecycle.
  Some of these items have already been addressed, while the remaining items are planned
  for resolution in upcoming product releases."'
