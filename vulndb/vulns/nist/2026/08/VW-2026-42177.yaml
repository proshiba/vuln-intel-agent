title: Protection mechanism failure for some Intel(R) Data Center Attestation 
  Primitives (Intel(R) DCAP) may allow information disclosure. Unprivileged 
  software adversary with an unauthenticated user combined with a low complexity
  attack may enable data exposure. This result may potentially occur via network
  access when attack requirements are present with special internal knowledge 
  and requires no user interaction. The potential vulnerability may impact the 
  confidentiality (none), integrity (high) and availability (none) of the 
  vulnerable system, resulting in subsequent system confidentiality (high), 
  integrity (none) and availability (none) impacts.
