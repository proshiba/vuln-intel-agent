title: "A heap-based buffer overflow vulnerability exists in the Dia diagram editor
  WPG file format importer.\n\nIn plug-ins/wpg/wpg-import.c, the WPG import renderer
  allocates a fixed palette with:\n\n    ren->pPal = g_new0(WPGColorRGB, 256);\n\n\
  When handling a WPG_COLORMAP record, the parser reads a start index (i16) and number
  of colors (iNum16) from the file and reads palette data with:\n\n    bRet &= (iNum16
  == (int)fread(&ren->pPal[i16], sizeof(WPGColorRGB), iNum16, f));\n\nThe only bounds-related
  check is `if (i16 >= 0 && i16 <= iSize)`, where iSize is the WPG record size—not
  the palette capacity. There is no validation that i16 is less than 256 or that i16
  + iNum16 does not exceed 256.\n\nA malicious WPG file can supply i16=256 and iNum16=264.
  That causes fread() to write 792 bytes starting at &pPal[256], while the palette
  buffer is only 768 bytes (256 entries × 3 bytes). This overflows into adjacent heap
  metadata and can crash Dia (SIGABRT / malloc corruption errors) or, depending on
  heap layout "
