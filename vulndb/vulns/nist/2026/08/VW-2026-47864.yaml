title: "Sony XAV-9500ES udev USB Rules Authorization Bypass Vulnerability. This vulnerability
  allows physically present attackers to bypass authorization on affected installations
  on Sony XAV-9500ES devices. Authentication is not required to exploit this vulnerability.\n\
  \nThe specific flaw exists within the udev rules. A crafted USB device connected
  to the system can trigger instantiation of otherwise restricted USB device types.
  An attacker can leverage this vulnerability to bypass authorization on the system.
  Was ZDI-CAN-28992."
