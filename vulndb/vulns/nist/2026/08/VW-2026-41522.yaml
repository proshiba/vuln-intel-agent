title: Metacat is data repository software that helps researchers preserve, 
  share, and discover data. Versions 2.x through 2.19.1 and all 1.x versions 
  contain an unauthenticated path traversal in the `archiveEntryName` parameter 
  of the `action=read` endpoint that is part of the original 1.x Metacat API. 
  `ArchiveHandler.readArchiveEntry()` concatenates the user-supplied parameter 
  into a filesystem path without validation, and the surrounding 
  `hasReadPermission()` check is commented out. An unauthenticated remote 
  attacker can read any file accessible to the Tomcat process by sending a 
  single GET request. Proof-of-concept exploits have been demonstrated and 
  verified against this vulnerability, and it should be considered easily 
  exploitable for any Metacat deployment < 3.0.0 by any user with access to the 
  1.x API. Through this vulnerability, production 2.x deployments are exposed to
  credential theft, client certificate and private key exfiltration enabling 
  member node impersonation within the fed
