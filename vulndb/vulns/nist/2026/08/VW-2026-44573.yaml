  fix UAF in cleanup_bearer() due to premature dst_cache_destroy()\n\nTIPC UDP media
  bearer teardown calls dst_cache_destroy() on its\nreplicast caches before calling
  synchronize_net() to wait for\nconcurrent RCU readers (transmitters) to finish:\n\
  \nstatic void cleanup_bearer(struct work_struct *work)\n{\n...\n\tlist_for_each_entry_safe(rcast,
  tmp, &ub->rcast.list, list) {\n\t\tdst_cache_destroy(&rcast->dst_cache);\n\t\tlist_del_rcu(&rcast->list);\n\
  \t\tkfree_rcu(rcast, rcu);\n\t}\n...\n\tdst_cache_destroy(&ub->rcast.dst_cache);\n\
  \tudp_tunnel_sock_release(ub->sk);\n\tsynchronize_net();\n...\n}\n\nThis is highly
  buggy because dst_cache_destroy() immediately frees the\nper-CPU cache memory (free_percpu())
