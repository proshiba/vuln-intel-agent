title: "In the Linux kernel, the following vulnerability has been resolved:\n\niio:
  gts-helper: Fix memory leaks for the error path of iio_gts_build_avail_scale_table()\n\
  \nIf per_time_scales[i] or per_time_gains[i] kcalloc fails in the for loop\nof iio_gts_build_avail_scale_table(),
  the err_free_out will fail to call\nkfree() each time when i is reduced to 0, so
  all the per_time_scales[0]\nand per_time_gains[0] will not be freed, which will
  cause memory leaks.\n\nFix it by checking if i >= 0."
