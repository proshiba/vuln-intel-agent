title: Dokploy is a free, self-hostable Platform as a Service (PaaS). Prior to 
  0.29.13, the buildRemoteDocker() function in 
  packages/server/src/utils/providers/docker.ts interpolates the 
  application-controlled dockerImage value directly into a docker pull shell 
  command. An authenticated user with project access can set a crafted 
  dockerImage through application.update and trigger application.deploy, causing
  execAsync() to execute arbitrary operating-system commands as the Dokploy 
  server process. This issue is fixed in version 0.29.13.
