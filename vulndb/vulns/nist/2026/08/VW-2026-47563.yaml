title: Wekan is open source kanban built with Meteor. Prior to 9.75, 
  models/fileValidation.js interpolated the uploaded fileObj.path into the 
  administrator-configured externalCommandLine at its {file} placeholder and 
  executed the result through asyncExec, which is promisify(exec) and invokes 
  `/bin/sh -c`. On deployments with an external scanner configured, an 
  authenticated user able to upload an attachment could place shell 
  metacharacters such as command substitutions in the filename and execute 
  commands as the Wekan server process. Version 9.75 adds shellQuote() and 
  passes the file path as a POSIX single-quoted argument so shell metacharacters
  cannot escape the placeholder. This issue is fixed in version 9.75.
