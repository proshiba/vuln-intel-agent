title: "In the Linux kernel, the following vulnerability has been resolved:\n\nspi:
  imx: reconfigure for PIO when DMA cannot be started\n\nWhen spi_imx_can_dma() selects
  DMA, the ECSPI is configured for DMA:\nspi_imx_setupxfer() sets CTRL.SMC and clears
  dynamic_burst, and\nspi_imx_dma_transfer() programs the dynamic-burst BURST_LENGTH
  and the\nSDMA watermarks.\n\nIf the DMA descriptor cannot be prepared (dmaengine_prep_slave_single()\n\
  returns NULL), the transfer is failed with SPI_TRANS_FAIL_NO_START and\nfalls back
  to PIO. The dynamic-burst DMA path uses its own bounce\nbuffers instead of the SPI
  core's mapping, so xfer->{tx,rx}_sg_mapped\nare not set and the core's DMA->PIO
  retry is skipped; the driver falls\nback to PIO internally. But none of the DMA-mode
  configuration is\nundone, so the PIO transfer runs with CTRL.SMC set, the wrong
  burst\nlength and dynamic_burst cleared, and the transferred data is corrupted.\n\
  \nThis is easily hit on i.MX8MP boards that describe ECSPI DMA in the\ndevice tree
  but run SDMA "
