title: The Cookie Consent  WordPress plugin before 0.0.10 does not correctly 
  enforce its intended administrator-only capability check on the REST route 
  that stores its geolocation service license key, so the route falls back to an
  authentication-only gate, allowing any authenticated user such as a subscriber
  to overwrite the stored key and disrupt the Cookie Consent  WordPress plugin 
  before 0.0.10's geolocation-based consent banner targeting.
