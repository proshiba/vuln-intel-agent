title: A flaw was found in the Red Hat OpenShift AI (RHOAI) overlay for the 
  training operator. The RHOAI overlay incorrectly aggregates `trainjobs` 
  management permissions into the native Kubernetes `edit ClusterRole`. This 
  allows any user with `edit ClusterRole` permissions in a namespace to create, 
  modify, and delete `TrainJobs`. When combined with a separate vulnerability 
  (TRN-01) that permits arbitrary pod configurations, a remote attacker with 
  namespace editor privileges could exploit this to escalate privileges, 
  potentially leading to arbitrary code execution.
