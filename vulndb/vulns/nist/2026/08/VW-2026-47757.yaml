title: n8n before 2.33.4 and 2.34.x before 2.34.1 contain a remote code 
  execution vulnerability in the @n8n/workflow-sdk node-schema loader used for 
  MCP node-schema loading. The loader derives a node's schema module path 
  directly from the attacker-supplied node type string without validating 
  path-traversal sequences. An authenticated user with global:member privileges 
  can reference malicious files via path traversal, causing code execution in 
  the n8n main process.
