title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  pwc: Drain fill_buf on start_streaming() failure\n\npwc_isoc_init() submits its
  isochronous URBs with\nusb_submit_urb(.., GFP_KERNEL) in a loop. After the first
  URB is\nsubmitted, its completion handler pwc_isoc_handler() can run on another\n\
  CPU before the loop finishes:\n\n  start_streaming()\n    pwc_isoc_init()\n    \
  \  usb_submit_urb(urbs[0], GFP_KERNEL)\n                                  pwc_isoc_handler(urbs[0])\n\
  \                                    pdev->fill_buf =\n                        \
  \              pwc_get_next_fill_buf(pdev)\n      usb_submit_urb(urbs[i>0], ..)\
  \  -> fails\n      pwc_isoc_cleanup(pdev)           /* kills URBs */\n      return
  ret;\n    pwc_cleanup_queued_bufs(pdev, VB2_BUF_STATE_QUEUED)\n\npwc_get_next_fill_buf()
  detaches a buffer from pdev->queued_bufs and\nstores it in pdev->fill_buf. The error
  path in start_streaming() only\ndrains pdev->queued_bufs, so the buffer parked in
  pdev->fill_buf is\nleaked. vb2"
