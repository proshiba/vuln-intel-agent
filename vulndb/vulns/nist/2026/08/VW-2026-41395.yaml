title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/intel:
  Fix out-of-bounds memset in dmar_latency_disable()\n\ndmar_latency_disable() intends
  to zero out only the single\nlatency_statistic entry for the given type, but the
  memset size was\ncomputed as sizeof(*lstat) * DMAR_LATENCY_NUM, which clears the
  entire\narray starting from &lstat[type].\n\nWhen type > 0, this writes beyond the
  end of the allocated array,\ncorrupting adjacent memory.\n\nFix by using sizeof(*lstat)
  to clear only the target entry."
