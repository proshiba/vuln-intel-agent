title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix extent map use-after-free when adding pages to compressed bio\n\nAt add_ra_bio_pages()
  we are accessing the extent map to calculate\n'add_size' after we dropped our reference
  on the extent map, resulting\nin a use-after-free. Fix this by computing 'add_size'
  before dropping our\nextent map reference."
