title: Budibase is an open-source low-code platform. Prior to 3.39.18, 
  packages/server/src/integrations/mysql.ts enabled multipleStatements and 
  inserted an unescaped tableName into a DESCRIBE statement. An attacker able to
  create a MySQL table with a backtick and stacked statement in its name could 
  wait for a Budibase administrator to run schema discovery, causing the second 
  statement to execute. The fix applies quoteMySqlIdentifier before constructing
  the query. This issue is fixed in version 3.39.18.
