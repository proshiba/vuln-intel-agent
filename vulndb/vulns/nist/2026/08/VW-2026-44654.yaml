title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncoresight:
  platform: defer connection counter increment until alloc succeeds\n\ncoresight_add_out_conn()
  increments nr_outconns before calling\ndevm_krealloc_array() and again before devm_kmalloc().
  If either\nallocation fails, the counter is already bumped while the corresponding\n\
  array entry is NULL or uninitialized garbage.\n\ncoresight_add_in_conn() has the
  same problem with nr_inconns and\ndevm_krealloc_array().\n\nIn both cases the probe
  returns -ENOMEM, which causes\ncoresight_get_platform_data() to call coresight_release_platform_data()\n\
  for cleanup. That function iterates up to nr_outconns (or nr_inconns)\nentries and
  dereferences each pointer unconditionally, hitting the NULL\nor garbage entry and
  panicking instead of failing gracefully.\n\nFix by moving the counter increments
  to after all allocations succeed,\nso the struct is always consistent on any error
  path."
