  don't leak snap_rwsem in handle_cap_grant\n\nWhen handle_cap_grant is called on
  an IMPORT op, then the snap_rwsem is\nheld and the function is expected to release
  it before returning. It\ncurrently fails to do that in all cases which could lead
  to a deadlock."
