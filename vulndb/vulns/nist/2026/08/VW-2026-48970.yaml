title: "An authenticated attacker with Editor access or alert.instances.external:write
  can submit an external Alertmanager alert containing a controlled generatorURL.
  The attacker is authorized to create the alert, but not to execute script in another
  user's Grafana session.\n\nGrafana renders alert.generatorURL directly as the Alert
  Details See source LinkButton href without URL-scheme sanitization or a safe-protocol
  allowlist. The click interceptor's :// heuristic can be bypassed by placing ://
  inside a JavaScript comment. When a user with read access clicks See source, the
  browser executes attacker-controlled JavaScript in the Grafana origin with the clicking
  user's permissions."
