title: The OTP Login With Phone Number, OTP Verification WordPress plugin before
  1.8.71 does not limit the number of OTP verification attempts or invalidate a 
  one-time login code after a wrong guess, and an unauthenticated user can 
  request a login code for any account. Because the code is a short numeric OTP,
  an attacker can brute-force it and take over any account, including an 
  administrator's.
