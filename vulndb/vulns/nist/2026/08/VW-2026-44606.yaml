title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid1:
  free r1_bio when REQ_NOWAIT is set and read would block on retry\n\nWhen a read
  is retried, raid1_read_request() may be called with a\npre-allocated r1_bio. If
  wait_read_barrier() fails for a REQ_NOWAIT\nread, the bio is completed and the function
  returns immediately. In this\ncase the existing r1_bio is leaked.\n\nThis fixes
  a leak of pre-allocated r1_bio structures for retried reads."
