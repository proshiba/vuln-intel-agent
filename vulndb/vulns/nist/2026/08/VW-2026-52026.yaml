title: "Origin Validation Error vulnerability in ash-project ash_ai allows a malicious
  web page to bypass the MCP server's DNS-rebinding protection and issue cross-site
  requests to a user's local MCP server with that user's actor.\n\nIn AshAi.Mcp.Server,
  with the default allowed_origins: nil, origin_allowed?/3 accepts an origin when
  uri.host == conn.host and the forwarded scheme is https. Both values are attacker-controlled:
  conn.host comes from the Host header and the scheme is read from the raw x-forwarded-proto
  header with no trusted-proxy check. Under DNS rebinding the browser sends the attacker's
  origin and a matching host, and page JavaScript may set X-Forwarded-Proto: https,
  so the check passes with no TLS or proxy involved. The fix trusts only localhost
  origins by default; other origins require an explicit allowed_origins allowlist.\n\
  \nThis issue affects ash_ai: from 0.8.0 before 1.0.0."
