title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnbd:
  fix uaf in nbd_open\n\nCommit 4af5f2e03013 (\"nbd: use blk_mq_alloc_disk and\nblk_cleanup_disk\"\
  ) cleans up disk by blk_cleanup_disk() and it won't set\ndisk->private_data as NULL
  as before. UAF may be triggered in nbd_open()\nif someone tries to open nbd device
  right after nbd_put() since nbd has\nbeen free in nbd_dev_remove().\n\nFix this
  by implementing ->free_disk and free private data in it."
