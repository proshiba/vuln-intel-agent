title: The Advanced Views – Display Custom Fields (ACF, Pods, MetaBox), Posts, 
  CPT and Woo Products anywhere in Gutenberg, Elementor, Divi, Beaver… plugin 
  for WordPress is vulnerable to Sensitive Information Exposure in all versions 
  up to, and including, 3.9.1 via the register_rest_routes. This makes it 
  possible for authenticated attackers, with subscriber-level access and above, 
  to extract sensitive admin-authored editor content — including template 
  markup, CSS code, JavaScript code, and PHP controller variables — for any 
  Layout or Post Selection post on the site.
