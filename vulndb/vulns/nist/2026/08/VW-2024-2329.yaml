title: "In the Linux kernel, the following vulnerability has been resolved:\n\nigb:
  cope with large MAX_SKB_FRAGS\n\nSabrina reports that the igb driver does not cope
  well with large\nMAX_SKB_FRAG values: setting MAX_SKB_FRAG to 45 causes payload\n\
  corruption on TX.\n\nAn easy reproducer is to run ssh to connect to the machine.\
  \  With\nMAX_SKB_FRAGS=17 it works, with MAX_SKB_FRAGS=45 it fails.  This has\n\
  been reported originally in\nhttps://bugzilla.redhat.com/show_bug.cgi?id=2265320\n\
  \nThe root cause of the issue is that the driver does not take into\naccount properly
  the (possibly large) shared info size when selecting\nthe ring layout, and will
  try to fit two packets inside the same 4K\npage even when the 1st fraglist will
  trump over the 2nd head.\n\nAddress the issue by checking if 2K buffers are insufficient."
