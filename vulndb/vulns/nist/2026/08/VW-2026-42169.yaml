title: Insufficient granularity of access control in some subsystem for some 
  Intel(R) Xeon(R) 6 Scalable processors with Intel(R) TDX may allow an 
  information disclosure. Authorized adversary with an authenticated user 
  combined with a high complexity attack may enable data exposure. This result 
  may potentially occur via local access when attack requirements are present 
  with special internal knowledge and requires no user interaction. The 
  potential vulnerability may impact the confidentiality (none), integrity 
  (none) and availability (none) of the vulnerable system, resulting in 
  subsequent system confidentiality (high), integrity (none) and availability 
  (none) impacts.
