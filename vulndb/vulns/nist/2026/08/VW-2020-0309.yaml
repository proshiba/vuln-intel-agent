title: A vulnerability in the ARP packet processing of Cisco Adaptive Security 
  Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) Software for
  Cisco Firepower 2100 Series Security Appliances could allow an 
  unauthenticated, adjacent attacker to cause an affected device to reload, 
  resulting in a denial of service (DoS) condition on an affected device. The 
  vulnerability is due to incorrect processing of ARP packets received by the 
  management interface of an affected device. An attacker could exploit this 
  vulnerability by sending a series of unicast ARP packets in a short timeframe 
  that would reach the management interface of an affected device. A successful 
  exploit could allow the attacker to consume resources on an affected device, 
  which would prevent the device from sending internal system keepalives and 
  eventually cause the device to reload, resulting in a denial of service (DoS) 
  condition.
