title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvideo:
  fbdev: sm712fb: Fix crash in smtcfb_write()\n\nWhen the sm712fb driver writes three
  bytes to the framebuffer, the\ndriver will crash:\n\n    BUG: unable to handle page
  fault for address: ffffc90001ffffff\n    RIP: 0010:smtcfb_write+0x454/0x5b0\n  \
  \  Call Trace:\n     vfs_write+0x291/0xd60\n     ? do_sys_openat2+0x27d/0x350\n\
  \     ? __fget_light+0x54/0x340\n     ksys_write+0xce/0x190\n     do_syscall_64+0x43/0x90\n\
  \     entry_SYSCALL_64_after_hwframe+0x44/0xae\n\nFix it by removing the open-coded
  endianness fixup-code."
