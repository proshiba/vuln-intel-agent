title: A vulnerability was found in xianrendzw EasyReport up to 
  2.0.17.0522_Beta. Affected is the function execSqlText/previewSqlText of the 
  file DesignerController.java of the component SQL Preview Endpoint. The 
  manipulation of the argument sqlText results in improper neutralization of 
  special elements used in a template engine. The attack can be executed 
  remotely. The exploit has been made public and could be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
