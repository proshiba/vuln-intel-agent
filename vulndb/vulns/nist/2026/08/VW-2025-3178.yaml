title: "In the Linux kernel, the following vulnerability has been resolved:\n\nerofs:
  validate the extent length for uncompressed pclusters\n\nsyzkaller reported a KASAN
  use-after-free:\nhttps://syzkaller.appspot.com/bug?extid=2ae90e873e97f1faf6f2\n\n\
  The referenced fuzzed image actually has two issues:\n - m_pa == 0 as a non-inlined
  pcluster;\n - The logical length is longer than its physical length.\n\nThe first
  issue has already been addressed.  This patch addresses\nthe second issue by checking
  the extent length validity."
