title: Buffer over-read in PostgreSQL pg_trgm index picksplit function reads 
  past end of a heap buffer.  This might allow a table maintainer to infer 
  limited memory values, via the lossy signal of index split choices.  Versions 
  before PostgreSQL 18.5, 17.11, 16.15, 15.19, and 14.24 are affected.
