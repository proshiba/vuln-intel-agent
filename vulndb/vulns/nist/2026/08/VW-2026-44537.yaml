title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncachefiles:
  Fix double unlock in nomem_d_alloc error path\n\nWhen start_creating() fails and
  returns -ENOMEM, it has already\nreleased the parent directory lock in __start_dirop():\n\
  \n    static struct dentry *__start_dirop(...)\n    {\n        ...\n        inode_lock_nested(dir,
  I_MUTEX_PARENT);\n        dentry = lookup_one_qstr_excl(name, parent, lookup_flags);\n\
  \        if (IS_ERR(dentry))\n            inode_unlock(dir);  <-- Lock released
  on error\n        return dentry;\n    }\n\nHowever, the nomem_d_alloc error path
  in cachefiles_get_directory()\nunconditionally calls inode_unlock(d_inode(dir))
  again, causing a\ndouble unlock that corrupts the rwsem state.\n\nThis is a leftover
  from commit 7ab96df840e60 which replaced manual\nlocking with start_creating() but
  failed to update the nomem_d_alloc\npath (while correctly updating mkdir_error and
  lookup_error paths)."
