  typec: fix potential out of bounds in ucsi_ccg_update_set_new_cam_cmd()\n\nThe \"\
  *cmd\" variable can be controlled by the user via debugfs.  That means\n\"new_cam\"\
  \ can be as high as 255 while the size of the uc->updated[] array\nis UCSI_MAX_ALTMODES
  (30).\n\nThe call tree is:\nucsi_cmd() // val comes from simple_attr_write_xsigned()\n\
  -> ucsi_send_command()\n   -> ucsi_send_command_common()\n      -> ucsi_run_command()
  // calls ucsi->ops->sync_control()\n         -> ucsi_ccg_sync_control()"
