title: A security flaw has been discovered in Soarkey StudentManagement and 
  学生信息管理系统 up to e08f7f1d5015af407aa4cca0ada3dea189b4937e. This affects the 
  function CourseDao.course_ranking of the file code/src/dao/CourseDao.java. 
  Performing a manipulation of the argument cno results in sql injection. It is 
  possible to initiate the attack remotely. The exploit has been released to the
  public and may be used for attacks. The project was informed of the problem 
  early through an issue report but has not responded yet.
