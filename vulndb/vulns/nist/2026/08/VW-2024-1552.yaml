title: "In the Linux kernel, the following vulnerability has been resolved:\n\nip6_tunnel:
  make sure to pull inner header in __ip6_tnl_rcv()\n\nsyzbot found __ip6_tnl_rcv()
  could access unitiliazed data [1].\n\nCall pskb_inet_may_pull() to fix this, and
  initialize ipv6h\nvariable after this call as it can change skb->head.\n\n[1]\n\
  \ BUG: KMSAN: uninit-value in __INET_ECN_decapsulate include/net/inet_ecn.h:253
  [inline]\n BUG: KMSAN: uninit-value in INET_ECN_decapsulate include/net/inet_ecn.h:275
  [inline]\n BUG: KMSAN: uninit-value in IP6_ECN_decapsulate+0x7df/0x1e50 include/net/inet_ecn.h:321\n\
