title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  ccp/sev-dev-tsm - bail out early when pdev->bus is NULL\n\ndsm_create() initially
  checks pdev->bus when computing segment_id:\n\n\tu8 segment_id = pdev->bus ? pci_domain_nr(pdev->bus)
  : 0;\n\nBut the next two lines unconditionally dereference pdev->bus via\npcie_find_root_port()
  and especially pci_dev_id(pdev), which expands\nto PCI_DEVID(dev->bus->number, dev->devfn).
  If pdev->bus is in fact\nNULL, segment_id is initialised to 0 but the very next
  statement\ncrashes the kernel.\n\nsmatch flags this:\n\n  drivers/crypto/ccp/sev-dev-tsm.c:253
  dsm_create() error: we\n    previously assumed 'pdev->bus' could be null (see line
  251)\n\nMake the NULL handling consistent: if pdev->bus is NULL the device\nhas
  no PCI context to work with and SEV TIO setup cannot proceed,\nso return -ENODEV
  before any of the bus-dependent lookups. The\nremaining initialisation now runs
  only on the path where pdev->bus\nis known to be valid.\n\nNo change for cal"
