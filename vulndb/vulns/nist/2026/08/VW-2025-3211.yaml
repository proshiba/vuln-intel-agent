title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915/gvt:
  fix gvt debugfs destroy\n\nWhen gvt debug fs is destroyed, need to have a sane check
  if drm\nminor's debugfs root is still available or not, otherwise in case like\n\
  device remove through unbinding, drm minor's debugfs directory has\nalready been
  removed, then intel_gvt_debugfs_clean() would act upon\ndangling pointer like below
  oops.\n\ni915 0000:00:02.0: Direct firmware load for i915/gvt/vid_0x8086_did_0x1926_rid_0x0a.golden_hw_state
  failed with error -2\ni915 0000:00:02.0: MDEV: Registered\nConsole: switching to
  colour dummy device 80x25\ni915 0000:00:02.0: MDEV: Unregistering\nBUG: kernel NULL
  pointer dereference, address: 00000000000000a0\nPGD 0 P4D 0\nOops: 0002 [#1] PREEMPT
  SMP PTI\nCPU: 2 PID: 2486 Comm: gfx-unbind.sh Tainted: G          I        6.1.0-rc8+
  #15\nHardware name: Dell Inc. XPS 13 9350/0JXC1H, BIOS 1.13.0 02/10/2020\nRIP: 0010:down_write+0x1f/0x90\n\
  Code: 1d ff ff 0f 1f 84 00 00 00 00 00 0f 1f 44 00 00 "
