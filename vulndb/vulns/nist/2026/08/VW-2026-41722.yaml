title: Sucuri Security WordPress plugin through version 2.7.3 contains a path 
  traversal vulnerability in the pageIntegritySubmission() method in 
  src/integrity.lib.php that allows authenticated administrators to delete 
  arbitrary files by supplying directory traversal sequences in the 
  sucuriscan_integrity parameter. Attackers can manipulate the unsanitized file 
  path concatenated with ABSPATH to traverse outside the WordPress installation 
  directory and invoke unlink() on sensitive files such as wp-config.php and 
  .htaccess, causing site outage or enabling malicious reinstallation.
