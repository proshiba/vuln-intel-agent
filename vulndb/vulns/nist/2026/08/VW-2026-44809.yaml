title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndm:
  limit target bio polling to one shot\n\ndm_poll_bio() is the ->poll_bio() callback
  for a stacked dm device.\nThe caller only knows about the dm queue, so it may decide
  to do a\nspinning poll if it thinks a single queue is being polled. Passing those\n\
  flags unchanged to the mapped clone lets blk_mq_poll() spin on a target\nqueue from
  inside dm_poll_bio().\n\nWith io_uring IOPOLL on a dm-stripe target this can keep
  a task in\n\n  dm_poll_bio() -> bio_poll() -> blk_mq_poll()\n\nlong enough to trigger
  an RCU CPU stall, before io_uring gets back to\nio_iopoll_check() and its need_resched()
  check.\n\nKeep dm's ->poll_bio() bounded by forcing one-shot polling for target\n\
  bios. The caller can invoke dm_poll_bio() again if it wants to keep\npolling, and
  it also gets a chance to reap completions or reschedule\nbetween passes."
