title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  usb: ipheth: fix carrier_work UAF on disconnect\n\nipheth_sndbulk_callback() re-arms
  the carrier-check work on any\nnon-zero URB status:\n\n\telse\n\t\tschedule_delayed_work(&dev->carrier_work,
  0);\n\nNothing ties that to the interface being up, so the work can be armed\nagain
  after ipheth_close() has already drained it, and stay armed\nuntil the netdev whose
  private area embeds it is freed.\n\nOn unplug with a TX URB in flight, ipheth_disconnect()
  drains the work\nthrough unregister_netdev() -> ipheth_close() ->\ncancel_delayed_work_sync()
  and only then calls ipheth_kill_urbs().\nusb_kill_urb() completes the in-flight
  TX URB with -ENOENT, so\nipheth_sndbulk_callback() runs after the drain and re-arms\n\
  carrier_work.\n\nThe same completion also re-arms the work if the interface is only\n\
  brought down while a TX URB is in flight, and\nipheth_carrier_check_work() then
  keeps re-queueing itself once a\nsecond. unregister_netdev() does not call"
