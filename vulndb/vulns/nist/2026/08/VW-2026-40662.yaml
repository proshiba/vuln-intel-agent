title: Weaver (Fanwei) E-cology 9.0 versions prior to 10.52 contain a file 
  upload vulnerability that allows a remote, unauthenticated attacker to upload 
  arbitrary files, including JSP webshells, by submitting a multipart/form-data 
  POST request to /workrelate/plan/util/uploaderOperate.jsp with arbitrary secId
  and plandetailid field values. Successful exploitation results in remote code 
  execution under the privileges of the application server process. Exploitation
  evidence was first observed by the Shadowserver Foundation on 2023-10-14 
  (UTC).
