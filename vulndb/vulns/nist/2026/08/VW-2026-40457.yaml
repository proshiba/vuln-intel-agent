title: "OpenReception's appointment booking software provides an end-to-end encrypted
  appointment booking platform. Prior to version 1.0.2, the `/api/log` endpoint accepts
  unauthenticated POST requests, applies no schema validation to the message body,
  writes attacker-controlled content directly into the application's stdout log, interprets
  newline characters as real line breaks, and enforces no size or rate limits. Three
  independent abuse modes follow: log injection (forge log lines that look like legitimate
  system events), log volume DoS (saturate the logging pipeline at sustained 100+
  requests per second of small messages), and oversized-payload submission (100 KB
  payloads accepted; larger sizes not tested). The most operationally damaging mode
  is log injection. An attacker can inject lines that an operator scanning logs would
