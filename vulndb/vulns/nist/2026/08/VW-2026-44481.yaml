title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocteontx2-af:
  fix VF bringup affecting PF promiscuous state\n\nMbox handling of nix_set_rx_mode
  for a VF with promiscuous and\nall_multi flags set to false causes deletion of the
  PF's promiscuous\nand allmulti MCAM rules. This occurs because the APIs that\nenable/disable
  these rules operate only on the PF, even when the\nmbox request is made via a VF
  interface.\n\nGuard both rvu_npc_enable_allmulti_entry() and\nrvu_npc_enable_promisc_entry()
  disable paths with an is_vf() check so\nthat a VF bringing up or tearing down its
  interface cannot inadvertently\nclear the PF's MCAM rules."
