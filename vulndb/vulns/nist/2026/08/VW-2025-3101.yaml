title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsoc:
  qcom: qmi_encdec: Restrict string length in decode\n\nThe QMI TLV value for strings
  in a lot of qmi element info structures\naccount for null terminated strings with
  MAX_LEN + 1. If a string is\nactually MAX_LEN + 1 length, this will cause an out
  of bounds access\nwhen the NULL character is appended in decoding."
