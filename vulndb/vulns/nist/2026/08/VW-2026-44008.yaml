title: ImpressCMS contains an authenticated remote code execution vulnerability 
  in the custom tag module that allows authenticated administrators to execute 
  arbitrary PHP code by storing a malicious payload in a custom tag with PHP 
  type enabled. The application decodes HTML-encoded content via 
  undoHtmlSpecialChars() before passing it to eval() in the renderWithPhp() 
  method, bypassing HTML Purifier sanitization, and the payload is triggered on 
  every frontend page load through the preload event system.
