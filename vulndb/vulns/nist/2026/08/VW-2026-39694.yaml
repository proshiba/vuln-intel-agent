title: Book-Management-System's Flask API endpoints /student, /record, /books, 
  /find_stu_book, and /find_not_return_book are missing the @login_required 
  decorator that protects sibling routes (/search_student, /storage) in the same
  file. Because card_id values are sequential integers, the entire student 
  database can be enumerated without authentication.
