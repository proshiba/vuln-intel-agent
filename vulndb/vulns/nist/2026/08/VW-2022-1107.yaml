title: A vulnerability in the DNS inspection handler of Cisco Adaptive Security 
  Appliance (ASA) Software and Firepower Threat Defense (FTD) Software could 
  allow an unauthenticated, remote attacker to cause a denial of service 
  condition (DoS) on an affected device. This vulnerability is due to a lack of 
  proper processing of incoming requests. An attacker could exploit this 
  vulnerability by sending crafted DNS requests at a high rate to an affected 
  device. A successful exploit could allow the attacker to cause the device to 
  stop responding, resulting in a DoS condition.
