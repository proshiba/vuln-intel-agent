title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nft_set_rbtree: fix null deref on element insertion\n\nThere is no guarantee that
  rb_prev() will not return NULL in nft_rbtree_gc_elem():\n\ngeneral protection fault,
  probably for non-canonical address 0xdffffc0000000003: 0000 [#1] PREEMPT SMP KASAN\n\
  KASAN: null-ptr-deref in range [0x0000000000000018-0x000000000000001f]\n nft_add_set_elem+0x14b0/0x2990\n\
  \  nf_tables_newsetelem+0x528/0xb30\n\nFurthermore, there is a possible use-after-free
  while iterating,\n'node' can be free'd so we need to cache the next value to use."
