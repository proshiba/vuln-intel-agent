title: "A vulnerability in the VPN web services component of Cisco Secure Firewall
  Adaptive Security Appliance (ASA) Software and Cisco Secure Firewall Threat Defense
  (FTD) Software could allow an unauthenticated, remote attacker to conduct browser-based
  attacks against users of an affected device.\r\n\r\nThis vulnerability is due to
  improper validation of HTTP requests. An attacker could exploit this vulnerability
  by persuading a user to visit a website that is designed to pass malicious HTTP
  requests to a device that is running Cisco Secure Firewall ASA Software or Cisco
  Secure FTD Software and has web services endpoints supporting VPN features enabled.
  A successful exploit could allow the attacker to reflect malicious input from the
  affected device to the browser that is in use and conduct browser-based attacks,
  including cross-site scripting (XSS) attacks. The attacker is not able to directly
  impact the affected device."
