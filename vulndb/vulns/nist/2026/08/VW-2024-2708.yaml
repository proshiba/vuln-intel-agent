title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf,
  sockmap: Fix race between element replace and close()\n\nElement replace (with a
  socket different from the one stored) may race\nwith socket's close() link popping
  & unlinking. __sock_map_delete()\nunconditionally unrefs the (wrong) element:\n\n\
  // set map[0] = s0\nmap_update_elem(map, 0, s0)\n\n// drop fd of s0\nclose(s0)\n\
  \  sock_map_close()\n    lock_sock(sk)               (s0!)\n    sock_map_remove_links(sk)\n\
  \      link = sk_psock_link_pop()\n      sock_map_unlink(sk, link)\n        sock_map_delete_from_link\n\
  \                                        // replace map[0] with s1\n           \
  \                             map_update_elem(map, 0, s1)\n                    \
  \                      sock_map_update_elem\n                                (s1!)\
  \       lock_sock(sk)\n                                            sock_map_update_common\n\
  \                                              psock = sk_psock(sk)\n          \
  \                           "
