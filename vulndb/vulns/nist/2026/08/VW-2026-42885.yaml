title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  Prevent shader BO mappings from becoming writable\n\nvc4_gem_object_mmap() rejects
  a writable mapping of a validated shader\nBO, but leaves VM_MAYWRITE set.  Userspace
  can map the BO read-only and\nthen turn it writable with mprotect().\n\nValidated
  shader BOs must stay read-only: the validator checks the\ninstructions once and
  the GPU trusts them afterwards.  A writable\nmapping lets userspace rewrite the
  code after validation, bypassing the\nvalidator.\n\nClear VM_MAYWRITE on the read-only
  path so the mapping cannot be\nupgraded, as i915 already does for its read-only
  objects."
