title: A flaw was found in the full-scope-disabled client-policy executor within
  the keycloak-services component. This component is responsible for enforcing 
  security policies during client registration and configuration in Red Hat 
  Build of Keycloak. The issue occurs because the executor only validates the 
  fullScopeAllowed field when it is explicitly provided in a request. By 
  omitting this field, a delegated user can bypass the policy, resulting in a 
  client created with full scope access. This allows the client to obtain tokens
  with unauthorized role mappings.
