title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  misc: usbio: check ibuf_len against rxbuf_len in bulk msg\n\nibuf_len is the bulk
  IN (receive) buffer size, but the EMSGSIZE check\nin usbio_bulk_msg() compares it
  against txbuf_len — the bulk OUT\nendpoint size.  Both are taken independently from
  different endpoints\nin usbio_probe(), so the check is wrong when they differ.\n\
  \nUse rxbuf_len for the IN direction.  This matches the buffer that\nactually holds
  the response data."
