title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  Stop leased rxq before uninstalling its memory provider\n\nnetif_rxq_cleanup_unlease()
  tears down the memory provider that was\ninstalled on a physical RX queue through
  a netkit queue lease. It\ncurrently revokes the provider's DMA mappings before stopping
  the\nphysical queue:\n\n  __netif_mp_uninstall_rxq(virt_rxq, p);            /* DMA
  unmap */\n  __netif_mp_close_rxq(phys_rxq->dev, rxq_idx, p);  /* queue stop */\n\
  \nThis inverts the ordering used by the regular teardown paths (normal\ndevice unregister
  and the io_uring zcrx close path), which stop the\nqueue before revoking the provider's
  mappings.\n\nWith the physical queue still live, its NAPI can keep consuming\nnet_iov
  entries from the page_pool alloc cache after the\n__netif_mp_uninstall_rxq() has
  already cleared their dma_addr,\nopening a window for the device to DMA to a stale
  or zero address.\n\nFix it by swapping the two calls so the queue is stopped (and
