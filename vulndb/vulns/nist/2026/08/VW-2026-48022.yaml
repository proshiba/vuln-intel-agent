  of an affected device can terminate active captive portal sessions, including forcing
  logout of specific users or clearing all active sessions. Affected users must re-authenticate
  to regain access. \n\n\n\nSuccessful exploitation may allow termination of individual
  or all active captive portal sessions, causing temporary service disruption and
  requiring users to re-authenticate."
