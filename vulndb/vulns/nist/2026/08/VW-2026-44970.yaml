title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  ISO: hold sk properly in iso_conn_ready\n\nsk deref in iso_conn_ready must be done
  either under conn->lock, or\nholding a refcount, to avoid concurrent close. conn->sk
  is currently\naccessed without either:\n\n    [Task 1]            [Task 2]\n   \
  \                     iso_sock_release\n    iso_conn_ready\n      sk = conn->sk\n\
  \                          lock_sock(sk)\n                            conn->sk =
  NULL\n      lock_sock(sk)\n                          release_sock(sk)\n        \
  \                  iso_sock_kill(sk)\n       UAF on sk deref\n\nFix possible UAF
  by holding sk refcount in iso_conn_ready().  Also\nrecheck after lock_sock that
  the socket is still valid.  Adjust locking\nso conn->sk is cleared only under lock_sock."
