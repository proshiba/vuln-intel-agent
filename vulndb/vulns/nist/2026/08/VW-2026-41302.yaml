title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  airspy: Return queued buffers on start_streaming() failure\n\nThe vb2 framework
  hands buffers to the driver via buf_queue() before\ncalling start_streaming(). \
  \ If start_streaming() returns an error\nwithout first returning those buffers via
  vb2_buffer_done(),\nvb2_start_streaming() fires WARN_ON(owned_by_drv_count) and
  the queued\nbuffers leak.\n\nairspy_start_streaming() returned -ENODEV early when
  the USB device had\nbeen disconnected (s->udev == NULL) without returning any buffers
  that\nbuf_queue() had already accepted.  Take v4l2_lock first and jump to the\n\
  existing err_clear_bit label, which already drains s->queued_bufs via\nvb2_buffer_done(...,
  VB2_BUF_STATE_QUEUED) before unlocking.\n\nThis mirrors the uvcvideo fix in commit
  4cf3b6fd54eb (\"media: uvcvideo:\nReturn queued buffers on start_streaming() failure\"\
  )."
