title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_conntrack_irc: fix parse_dcc() off-by-one OOB read\n\nparse_dcc() treats data_end
  as an inclusive end pointer, but its only\ncaller passes data_limit = ib_ptr + datalen,
  which points one past the\nlast valid byte.\n\nThe newline search loop iterates
  while tmp <= data_end, so when no\nnewline is present, *tmp is read at tmp == data_end,
  one byte beyond\nthe region filled by skb_header_pointer().\n\nirc_buffer is kmalloc'd
  as MAX_SEARCH_SIZE + 1 bytes and datalen is\ncapped at MAX_SEARCH_SIZE, so the stray
  read does not fault.  The byte\nis uninitialized or stale; if it contains an ASCII
  digit, simple_strtoul\nwill consume it and produce a wrong DCC IP or port in the
  conntrack\nexpectation.  The extra allocation byte is also a fragile guard: if the\n\
