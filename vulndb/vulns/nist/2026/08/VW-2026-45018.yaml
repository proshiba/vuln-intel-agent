title: A vulnerability has been found in mangroup dtale up to 3.22.0. This issue
  affects the function Login of the file dtale/auth.py of the component Login 
  Endpoint. Such manipulation leads to improper restriction of excessive 
  authentication attempts. The attack can be executed remotely. This attack is 
  characterized by high complexity. The exploitability is assessed as difficult.
  The exploit has been disclosed to the public and may be used. The project was 
  informed of the problem early through an issue report but has not responded 
  yet.
