title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pv: fix index value of replaced ASCE\n\nThe index field of the struct page
  corresponding to a guest ASCE should\nbe 0. When replacing the ASCE in s390_replace_asce(),
  the index of the\nnew ASCE should also be set to 0.\n\nHaving the wrong index might
  lead to the wrong addresses being passed\naround when notifying pte invalidations,
  and eventually to validity\nintercepts (VM crash) if the prefix gets unmapped and
  the notifier gets\ncalled with the wrong address."
