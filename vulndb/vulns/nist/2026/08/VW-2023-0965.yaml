title: A vulnerability in the AnyConnect SSL VPN feature of Cisco Adaptive 
  Security Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) 
  Software could allow an unauthenticated, remote attacker to cause a denial of 
  service (DoS) condition on an affected device. This vulnerability is due to an
  implementation error within the SSL/TLS session handling process that can 
  prevent the release of a session handler under specific conditions. An 
  attacker could exploit this vulnerability by sending crafted SSL/TLS traffic 
  to an affected device, increasing the probability of session handler leaks. A 
  successful exploit could allow the attacker to eventually deplete the 
  available session handler pool, preventing new sessions from being established
  and causing a DoS condition.
