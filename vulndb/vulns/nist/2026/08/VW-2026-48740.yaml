title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Fix netns reference imbalance in conntrack kfuncs\n\nThe opts argument of the BPF
  conntrack kfuncs can point to a shared\nmap value.  __bpf_nf_ct_lookup() and __bpf_nf_ct_alloc_entry()
  read\nopts->netns_id separately when acquiring and releasing the network\nnamespace
  reference.\n\nThe reference imbalance can occur as follows:\n\n  CPU 0         \
  \                         CPU 1\n  read opts->netns_id (-1)\n  skip get_net_ns_by_id()\n\
  \                                         write opts->netns_id (id)\n  read opts->netns_id
  (id)\n  put_net(net) /* no matching get */\n\nThe reverse transition leaks the reference.\
  \  Repeating the unmatched put\ncan destroy a live namespace and crash later users.\n\
  \nThe kernel reported:\n\n  Oops: general protection fault, probably for non-canonical
  address\n  KASAN: null-ptr-deref in range [0x00000000000000e8-0x00000000000000ef]\n\
  \  RIP: 0010:bpf_prog_test_run_xdp+0x52c/0x1700\n  Call Trace:\n   __sys_bpf+0x1662/"
