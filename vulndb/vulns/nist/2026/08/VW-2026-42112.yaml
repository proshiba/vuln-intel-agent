title: "Velociraptor's NTFS parsing library mishandles several out of bound and memory
  exhaustion bugs which may be triggered by maliciously crafted NTFS images.\n\nTypically
  Velociraptor's NTFS parser is used on live NTFS filesystems, limiting the opportunity
  of attackers corrupting the filesystem. However, in some applications (e.g.  dead
  disk forensics https://docs.velociraptor.app/docs/forensic/deaddisk/ ) Velociraptor
  may be used on untrusted NTFS image files. \n\nIf an attacker is able to inject
  maliciously corrupted NTFS Volumes they can cause a crash and a Denial of Service."
