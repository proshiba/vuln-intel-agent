title: "LimeSurvey Community Edition 7.0.5 contains an authenticated improper authorization
  vulnerability in the survey menu entry creation endpoint.\n\n\n\nAn authenticated
  user with only the global settings:read permission can directly invoke POST /index.php/admin/menuentries/sa/create and
  create new survey menu entries without the expected settings:update privilege. The
  endpoint also allows the attacker to submit menu IDs that the normal interface and
  intended update workflow restrict for non-superadministrators, enabling unauthorized
  changes to administrative navigation records.\n\n\n\nThis issue affects LimeSurvey:
  7.0.5."
