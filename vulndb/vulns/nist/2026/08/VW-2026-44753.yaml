title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  mac80211: bound S1G TIM PVB walk to the TIM element\n\nieee80211_s1g_check_tim()
  parses the S1G Partial Virtual Bitmap (PVB) of a\nreceived TIM element. The TIM
  is handed in as the element payload:\nieee802_11_parse_elems_full() stores elems->tim
  = elem->data and\nelems->tim_len = elem->datalen (net/mac80211/parse.c), so the
  valid bytes\nare [tim, tim + tim_len).\n\nWhen walking the encoded blocks the function
  passes the walker an end\nsentinel of (const u8 *)tim + tim_len + 2, i.e. two bytes
  past the end of\nthe element. ieee80211_s1g_find_target_block() loops while (ptr
  + 1 <= end)\nand dereferences ptr (and the per-mode ieee80211_s1g_len_*() helpers
  read\n*ptr), so it can read up to two bytes beyond the TIM element -- an\nout-of-bounds
  read of adjacent skb/heap data when the TIM is the last\nelement in the frame. The
  +2 appears to account for the element id/len\nheader, but tim already points past
  that header at the element"
