title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (corsair-psu) Stop device IO before calling hid_hw_stop\n\nhid_hw_stop() does not
  stop the device IO.\n\nThis results in a race condition between hid_input_report()
  and the point\nimmediately following the execution of hid_device_io_start() within\n\
  corsairpsu_probe(). If the probe operation fails after \"io start\" has\nbeen initiated,
  this race condition will result in a uaf vulnerability\n[1].\n\nCPU0\t\t\t\tCPU1\n\
  ====\t\t\t\t====\ncorsairpsu_probe()\n hid_device_io_start()\n  ... unlock driver_input_lock\n\
  \ hid_hw_stop()\n  kfree(hidraw)\t\t\t__hid_input_report()\n\t\t\t\t ... acquire
  driver_input_lock\n\t\t\t\t hid_report_raw_event()\n\t\t\t\t  hidraw_report_event()\n\
  \t\t\t\t   ... access hidraw's list_lock // trigger uaf\n\nConsequently, when corsairpsu_probe()
  fails and hid_hw_stop() needs to\nbe executed, the io_started flag is first cleared
  while holding the\ndriver_input_lock to prevent potential race conditions involving
  input\nreports.\n\n[1]\nBUG: KASAN: s"
