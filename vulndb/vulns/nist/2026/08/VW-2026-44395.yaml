title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  tt: prevent TVLV OOB check overflow\n\nA TT unicast TVLV contains the number of
  VLANs stored in it. This number is\nan u16 and gets multiplied by the size of the
  struct\nbatadv_tvlv_tt_vlan_data (8 bytes). The size can therefore overflow the
  u16\nused to store the tt_vlan_len. All additional safety checks to prevent\nout-of-bounds
  access of the TVLV buffer are invalid due to this overflow.\n\nUsing size_t prevents
  this overflow and ensures that the safety checks\ncompare against the actual buffer
  requirements."
