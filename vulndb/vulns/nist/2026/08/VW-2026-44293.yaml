title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  isotp: serialize TX state transitions under so->rx_lock\n\nThe TX state machine
  (so->tx.state) is driven from three contexts:\nsendmsg() claiming and progressing
  a transfer, the RX path consuming\nFlow Control/echo frames, and two hrtimers timing
  out a stalled\ntransfer. Mixing a lock-free cmpxchg() claim in sendmsg() with\n\
  hrtimer_cancel() calls made under so->rx_lock elsewhere left windows\nwhere a frame
  or timer callback could act on a state that had already\nmoved on, corrupting an
  unrelated transfer.\n\nso->rx_lock now covers the full lifecycle of a TX claim:
  sendmsg()\ntakes it to check so->tx.state is ISOTP_IDLE, switch it to\nISOTP_SENDING,
  bump so->tx_gen and drain the previous transfer's\ntimers - all as one critical
  section. isotp_rcv_fc()/isotp_rcv_cf()\nalready run under this lock via isotp_rcv(),
  and isotp_rcv_echo() now\ntakes it itself, so none of them can ever observe a transfer
