title: "A vulnerability in the CLI of Cisco Secure FTD Software could allow an authenticated,
  local attacker to execute arbitrary commands on the underlying operating system
  as root. To exploit this vulnerability, the attacker must have valid administrative
  credentials on an affected device.\r\n\r\nThis vulnerability is due to insufficient
  input validation of user-supplied command arguments. An attacker could exploit this
  vulnerability by submitting crafted input for a specific CLI command. A successful
  exploit could allow the attacker to execute commands on the underlying operating
  system as&nbsp;root."
