title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  mgmt: fix UAF in pair command cancellation\n\nThe pairing completion and authentication
  failure callbacks look up the\npending MGMT_OP_PAIR_DEVICE command by walking hdev->mgmt_pending.
  The\nlookup returned a command that was still linked on the shared pending list,\n\
  without keeping mgmt_pending_lock held for the later dereference and\nremoval.\n\
  \nA concurrent MGMT_OP_CANCEL_PAIR_DEVICE request can remove and free the\nsame
  pending command before the callback uses it. The reverse race is also\npossible
  when cancel_pair_device() gets a command from pending_find() and a\ncallback removes
  it before the cancel path dereferences it. This can lead\nto a use-after-free and
  a second list_del().\n\nMake the pairing lookup helpers transfer ownership of the
  pending command\nby removing it from hdev->mgmt_pending while holding mgmt_pending_lock.\n\
