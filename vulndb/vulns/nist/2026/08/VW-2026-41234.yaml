title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/page_vma_mapped:
  fix device-private PMD handling\n\nCommit 65edfda6f3f2 (\"mm/rmap: extend rmap and
  migration support\ndevice-private entries\") introduced the concept of device-private
  PMD\nentries, but did not correctly update the rmap walk code to account for\nthem.\n\
  \nAs a result, when page_vma_mapped_walk() encounters device-private PMD\nentries,
  it takes no action other than to acquire the PMD lock and exit.\n\nHowever this
  is highly problematic for two reasons - firstly, device\nprivate entries possess
  a PFN so check_pmd() needs to be called to ensure\nan overlapping PFN range.\n\n\
  Secondly, and more importantly, if PVMW_MIGRATION is set the caller\nassumes the
  returned entry is a migration entry, resulting in memory\ncorruption when the caller
  tries to interpret the device private entry as\nsuch.\n\nIn addition, commit 146287290023
  (\"mm/huge_memory: implement\ndevice-private THP splitting\") allowed device private
  PMDs to be split"
