title: "In the Linux kernel, the following vulnerability has been resolved:\n\next4:
  avoid allocating blocks from corrupted group in ext4_mb_try_best_found()\n\nDetermine
  if the group block bitmap is corrupted before using ac_b_ex in\next4_mb_try_best_found()
  to avoid allocating blocks from a group with a\ncorrupted block bitmap in the following
  concurrency and making the\nsituation worse.\n\next4_mb_regular_allocator\n  ext4_lock_group(sb,
  group)\n  ext4_mb_good_group\n   // check if the group bbitmap is corrupted\n  ext4_mb_complex_scan_group\n\
  \   // Scan group gets ac_b_ex but doesn't use it\n  ext4_unlock_group(sb, group)\n\
  \                           ext4_mark_group_bitmap_corrupted(group)\n          \
  \                 // The block bitmap was corrupted during\n                   \
  \        // the group unlock gap.\n  ext4_mb_try_best_found\n    ext4_lock_group(ac->ac_sb,
  group)\n    ext4_mb_use_best_found\n      mb_mark_used\n      // Allocating blocks
  in block bitmap corrupted group"
