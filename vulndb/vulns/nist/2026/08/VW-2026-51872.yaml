title: pac4j-saml before 6.5.6 does not require signature validation of SAML 
  LogoutRequest messages in SAML2LogoutValidator.validateLogoutRequest(). When 
  an IdP sends no SessionIndex, a session can be destroyed based solely on the 
  NameID, allowing an unauthenticated attacker to submit an unsigned 
  LogoutRequest with a guessed identifier (e.g., an email address used as 
  NameID) to terminate a victim's SAML session.
