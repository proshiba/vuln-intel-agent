title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Respect read-only PFN when mapping L1 VNCR\n\nKVM currently maps the
  L1 VNCR into the host stage-1 by relying entirely\non the permissions of the guest
  stage-1. At the same time, it is\nentirely possible that the backing PFN is read-only
  (e.g. RO memslot),\nmeaning that the L1 VNCR should use at most a read-only mapping.\n\
  \nCache the writability of the PFN in the VNCR TLB and use it to constrain\nthe
  resulting fixmap permissions. Promote VNCR permission faults to an\nSEA in the case
  where the guest attempts to write to a read-only\nendpoint. Conveniently, this also
  plugs a page leak found by Sashiko [*]\nresulting from the early return for a read-only
  PFN."
