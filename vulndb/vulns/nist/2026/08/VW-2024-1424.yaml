title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject variable offset alu on PTR_TO_FLOW_KEYS\n\nFor PTR_TO_FLOW_KEYS, check_flow_keys_access()
  only uses fixed off\nfor validation. However, variable offset ptr alu is not prohibited\n\
  for this ptr kind. So the variable offset is not checked.\n\nThe following prog
  is accepted:\n\n  func#0 @0\n  0: R1=ctx() R10=fp0\n  0: (bf) r6 = r1          \
  \             ; R1=ctx() R6_w=ctx()\n  1: (79) r7 = *(u64 *)(r6 +144)        ; R6_w=ctx()
  R7_w=flow_keys()\n  2: (b7) r8 = 1024                     ; R8_w=1024\n  3: (37)
  r8 /= 1                       ; R8_w=scalar()\n  4: (57) r8 &= 1024            \
  \        ; R8_w=scalar(smin=smin32=0,\n  smax=umax=smax32=umax32=1024,var_off=(0x0;
  0x400))\n  5: (0f) r7 += r8\n  mark_precise: frame0: last_idx 5 first_idx 0 subseq_idx
  -1\n  mark_precise: frame0: regs=r8 stack= before 4: (57) r8 &= 1024\n  mark_precise:
  frame0: regs=r8 stack= before 3: (37) r8 /= 1\n  mark_precise: frame0: regs=r8 stack=
  before 2: "
