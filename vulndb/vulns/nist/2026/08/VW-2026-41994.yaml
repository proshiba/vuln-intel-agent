title: A Server-Side Request Forgery and supply chain flaw was found in the 
  OpenShift Console Helm catalog proxy. A namespace tenant can plant a 
  ProjectHelmChartRepository with an arbitrary URL that the console pod fetches 
  server-side, bypassing tenant egress restrictions. Combined with catalog 
  metadata poisoning and admin-mediated chart installation, this enables 
  privilege escalation.
