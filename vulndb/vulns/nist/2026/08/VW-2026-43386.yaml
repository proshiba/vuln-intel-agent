title: Flowise before 3.1.3 contains a regex-based Python code validator bypass 
  in CSV and Airtable Agent nodes that allows unauthenticated attackers to 
  inject malicious code via prompt injection. Attackers can exploit unblocked 
  pandas functions like pd.read_json() to exfiltrate datasets, perform SSRF 
  against internal services, or achieve code execution through the 
  unauthenticated prediction API.
