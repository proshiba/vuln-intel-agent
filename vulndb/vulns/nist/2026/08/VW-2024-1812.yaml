title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  make sure that WRITTEN is set on all metadata blocks\n\nWe previously would call
  btrfs_check_leaf() if we had the check\nintegrity code enabled, which meant that
  we could only run the extended\nleaf checks if we had WRITTEN set on the header
  flags.\n\nThis leaves a gap in our checking, because we could end up with\ncorruption
  on disk where WRITTEN isn't set on the leaf, and then the\nextended leaf checks
  don't get run which we rely on to validate all of\nthe item pointers to make sure
  we don't access memory outside of the\nextent buffer.\n\nHowever, since 732fab95abe2
  (\"btrfs: check-integrity: remove\nCONFIG_BTRFS_FS_CHECK_INTEGRITY option\") we
  no longer call\nbtrfs_check_leaf() from btrfs_mark_buffer_dirty(), which means we
  only\never call it on blocks that are being written out, and thus have WRITTEN\n\
  set, or that are being read in, which should have WRITTEN set.\n\nAdd checks to
  make sure we have WRITTEN set appropriately, an"
