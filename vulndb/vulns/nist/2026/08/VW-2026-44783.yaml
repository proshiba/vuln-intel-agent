title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath12k: fix NULL deref in change_sta_links for unready link\n\n_ieee80211_set_active_links()
  calls _ieee80211_link_use_channel() for\neach newly-added link and WARN_ON_ONCE()s
  if it fails. The call uses\nassign_on_failure=true, which allows mac80211 to continue
  despite\ndriver failures, but when a mac80211-level channel validation fails\n(e.g.,
  combinations check, DFS, or no available radio),\ndrv_assign_vif_chanctx() is never
  reached. Since ath12k_mac_vdev_create()\nis only called from that path, arvif->is_created
  remains false and\narvif->ar remains NULL for the failed link.\n\nThe subsequent
  drv_change_sta_links() call reaches\nath12k_mac_op_change_sta_links(), which allocates
  an arsta and sets\nahsta->links_map |= BIT(link_id) for the broken link before checking\n\
  whether the link is ready. When the vdev was never created, only\nstation_add()
  is skipped, but the link remains in links_map.\n\nAny subsequent operation iterating"
