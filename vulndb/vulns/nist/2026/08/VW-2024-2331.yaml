title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  dwc3: st: fix probed platform device ref count on probe error path\n\nThe probe
  function never performs any paltform device allocation, thus\nerror path \"undo_platform_dev_alloc\"\
  \ is entirely bogus.  It drops the\nreference count from the platform device being
  probed.  If error path is\ntriggered, this will lead to unbalanced device reference
  counts and\npremature release of device resources, thus possible use-after-free
  when\nreleasing remaining devm-managed resources."
