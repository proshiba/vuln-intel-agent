title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmlxsw:
  spectrum_acl_erp: Fix object nesting warning\n\nACLs in Spectrum-2 and newer ASICs
  can reside in the algorithmic TCAM\n(A-TCAM) or in the ordinary circuit TCAM (C-TCAM).
  The former can\ncontain more ACLs (i.e., tc filters), but the number of masks in
  each\nregion (i.e., tc chain) is limited.\n\nIn order to mitigate the effects of
  the above limitation, the device\nallows filters to share a single mask if their
  masks only differ in up\nto 8 consecutive bits. For example, dst_ip/25 can be represented
  using\ndst_ip/24 with a delta of 1 bit. The C-TCAM does not have a limit on the\n\
  number of masks being used (and therefore does not support mask\naggregation), but
  can contain a limited number of filters.\n\nThe driver uses the \"objagg\" library
  to perform the mask aggregation by\npassing it objects that consist of the filter's
  mask and whether the\nfilter is to be inserted into the A-TCAM or the C-TCAM since
  filters in\ndifferent TCAM"
