title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpu:
  host1x: Allow entries in BO caches to be freed\n\nWhen a buffer object is pinned
  via host1x_bo_pin() with a cache, the\nresulting mapping is kept in the cache so
  it can be reused on subsequent\npins. Each mapping held a reference to the underlying
  host1x_bo (taken\nin tegra_bo_pin / gather_bo_pin), so as long as a mapping was
  cached,\nthe bo itself could not be freed.\n\nHowever, the only way to remove the
  cached mapping was through the free\npath of the buffer object. This meant that
  if a bo got cached, it could\nnever get freed again.\n\nResolve the circularity
  by holding a weak reference to the bo from the\ncache side. This is done by having
  the .pin callbacks not bump the bo's\nrefcount -- instead the common Host1x bo code
  does so, except for the\ncache reference.\n\nAlso move the remove-cache-mapping-on-free
  code into a common function\ninside Host1x code. This is only called from the TegraDRM
