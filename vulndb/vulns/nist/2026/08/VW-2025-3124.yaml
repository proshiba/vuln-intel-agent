title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommufd:
  IOMMUFD_DESTROY should not increase the refcount\n\nsyzkaller found a race where
  IOMMUFD_DESTROY increments the refcount:\n\n       obj = iommufd_get_object(ucmd->ictx,
  cmd->id, IOMMUFD_OBJ_ANY);\n       if (IS_ERR(obj))\n               return PTR_ERR(obj);\n\
  \       iommufd_ref_to_users(obj);\n       /* See iommufd_ref_to_users() */\n  \
  \     if (!iommufd_object_destroy_user(ucmd->ictx, obj))\n\nAs part of the sequence
  to join the two existing primitives together.\n\nAllowing the refcount the be elevated
  without holding the destroy_rwsem\nviolates the assumption that all temporary refcount
  elevations are\nprotected by destroy_rwsem. Racing IOMMUFD_DESTROY with\niommufd_object_destroy_user()
  will cause spurious failures:\n\n  WARNING: CPU: 0 PID: 3076 at drivers/iommu/iommufd/device.c:477
  iommufd_access_destroy+0x18/0x20 drivers/iommu/iommufd/device.c:478\n  Modules linked
  in:\n  CPU: 0 PID: 3076 Comm: syz-executor.0 Not tainted 6.3"
