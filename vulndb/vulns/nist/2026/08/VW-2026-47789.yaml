title: "ATutor is vulnerable to authentication bypass . Although a token validation
  check is present in the auto-login functionality, the values required for token
  validation remain uninitialized in certain code paths. An unauthenticated attacker
  who can determine a user's identifier and registration timestamp can generate a
  valid token and authenticate as an existing user, including administrator, without
  knowing the password.\n\n\n\n\n\nProduct is no longer actively supported and the
  vulnerabilities have not been fixed. Only version 2.2.4 was tested and confirmed
  as vulnerable, other versions were not tested but might also be vulnerable."
