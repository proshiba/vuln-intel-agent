title: "In the Linux kernel, the following vulnerability has been resolved:\n\nocfs2:
  reject dinodes with non-canonical i_mode type\n\nPatch series \"ocfs2: harden inode
  validators against forged metadata\", v2.\n\nThis series adds three structural checks
  to OCFS2 dinode validation so\nmalformed on-disk fields are rejected before ocfs2_populate_inode()
  copies\nthem into the in-core inode.\n\nThe checks cover:\n\n  - i_mode values whose
  type bits do not name a canonical POSIX file\n    type;\n  - non-device dinodes
  whose id1.dev1.i_rdev field is non-zero; and\n  - non-inline dinodes that claim
  non-zero i_size while i_clusters is\n    zero, covering directories unconditionally
  and regular files on\n    non-sparse volumes.\n\nThe normal read path reports these
  through ocfs2_error(), matching the\nexisting suballoc-slot, inline-data, chain-list,
  and refcount checks.  The\nonline filecheck path uses the same structural predicates
  but keeps its\nown reporting contract, returning OCFS2_FILECHECK_ERR_INVALIDINO
  instead\nof ca"
