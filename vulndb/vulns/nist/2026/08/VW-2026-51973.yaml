title: Admidio versions before 5.0.12 contain a broken access control 
  vulnerability in profile_function.php that allows authenticated low-privilege 
  users to read another user's future role memberships. Attackers can bypass 
  profile-level authorization by directly calling the reload_future_memberships 
  endpoint with a victim's user UUID to disclose sensitive membership 
  information.
