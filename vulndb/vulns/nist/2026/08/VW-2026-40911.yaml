title: A vulnerability was found in Pimzino spec-workflow-mcp up to 2.2.6. This 
  issue affects the function ApprovalStorage.createApproval of the file 
  src/tools/approvals.ts. Performing a manipulation of the argument categoryName
  results in path traversal. The attack is only possible with local access. 
  Upgrading to version 2.2.7 is capable of addressing this issue. The patch is 
  named 9c7a7839e690bb4543f0e7481b5740d23808e5fe. It is advisable to upgrade the
  affected component.
