title: A security vulnerability has been detected in OpenBoxes up to 0.9.1. This
  issue affects the function DocumentController of the file 
  grails-app/controllers/org/pih/warehouse/core/DocumentController.groovy of the
  component Document Upload Controller. The manipulation leads to unrestricted 
  upload. It is possible to initiate the attack remotely. The exploit has been 
  disclosed publicly and may be used. Upgrading to version 0.9.2 is capable of 
  addressing this issue. The identifier of the patch is 
  e945d6bfcec29642f514e7d298dfba2cc6cd7cd4. Upgrading the affected component is 
  recommended.
