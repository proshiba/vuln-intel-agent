title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  drop bad gso csum_start and offset in virtio_net_hdr\n\nTighten csum_start and csum_offset
  checks in virtio_net_hdr_to_skb\nfor GSO packets.\n\nThe function already checks
  that a checksum requested with\nVIRTIO_NET_HDR_F_NEEDS_CSUM is in skb linear. But
  for GSO packets\nthis might not hold for segs after segmentation.\n\nSyzkaller demonstrated
  to reach this warning in skb_checksum_help\n\n\toffset = skb_checksum_start_offset(skb);\n\
  \tret = -EINVAL;\n\tif (WARN_ON_ONCE(offset >= skb_headlen(skb)))\n\nBy injecting
  a TSO packet:\n\nWARNING: CPU: 1 PID: 3539 at net/core/dev.c:3284 skb_checksum_help+0x3d0/0x5b0\n\
  \ ip_do_fragment+0x209/0x1b20 net/ipv4/ip_output.c:774\n ip_finish_output_gso net/ipv4/ip_output.c:279
  [inline]\n __ip_finish_output+0x2bd/0x4b0 net/ipv4/ip_output.c:301\n iptunnel_xmit+0x50c/0x930
  net/ipv4/ip_tunnel_core.c:82\n ip_tunnel_xmit+0x2296/0x2c70 net/ipv4/ip_tunnel.c:813\n\
  \ __gre_xmit net/ipv4/ip_gre.c:469 [inline]\n ipgre_xmit"
