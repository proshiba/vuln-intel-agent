title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  arm64: nv: Re-translate VNCR before injecting abort\n\nKVM faults in the VNCR page
  with FOLL_WRITE whenever the guest aborts\nfor a write, similar to how a regular
  stage-2 mapping is handled. It is\nentirely possible that the guest reads from the
  VNCR before writing to\nit, in which case the PFN could only be read-only.\n\nInvalidate
  the VNCR TLB and re-fetch the translation upon taking a VNCR\nabort, allowing the
  host mapping to be faulted in for write the second\ntime around. Interestingly enough,
  this also satisfies the ordering\nrequirements of FEAT_ETS2/3 between descriptor
  updates and MMU faults."
