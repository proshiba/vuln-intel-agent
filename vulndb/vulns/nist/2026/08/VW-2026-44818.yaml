title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndlm:
  fix add msg handle in send_queue ordered\n\nIn a benchmark scenario triggering a
  lot of requests that triggers a lot\nof DLM messages on the network it can be that
  the mh->seq is not ordered\naccording the oldest seq number. This ordering is required
  by\ndlm_receive_ack as \"before(mh->seq, seq)\" will stop to check for older\nsequence
  numbers that are ordered in the tail of \"node->send_queue\".\n\nThe side effects
  of not having it correct ordered regarding\n\"before(mh->seq, seq)\" are refcounting
  issues and use-after free.\n\nI only was able to reproduce this issue in a experimental
  DLM branch\nand a user space DLM benchmark that uses io_uring. After changing this
  I\ndon't experienced any refcounting with the sending buffer issues anymore."
