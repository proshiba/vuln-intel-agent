title: rsync before 3.5.0 contains an improper path handling vulnerability that 
  allows a malicious sender to expand the scope of --delete operations beyond 
  the intended destination subtree by sending a crafted file list that causes 
  rsync to reclassify implied parent directory entries or treat synthetic paths 
  as the transfer root. Attackers can exploit multiple variants including 
  implied parent reclassification, synthetic root path construction, legacy 
  protocol behavior below version 30, and non-directory root handling to cause 
  the receiver to delete files outside the authorized destination directory.
