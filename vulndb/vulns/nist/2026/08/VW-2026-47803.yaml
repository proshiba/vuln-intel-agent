title: WeGIA before 3.9.2 contains an authorization bypass vulnerability in the 
  password change flow that allows any authenticated user to change their 
  account password without providing existing credentials by exploiting the 
  unconditional exclusion of the alterarSenha method from permission checks in 
  controle/control.php. Attackers can manipulate the redir parameter to point to
  alterar_senha.php, routing through verificarSenhaConfig() instead of 
  verificarSenha() to bypass current password verification and convert temporary
  session access into permanent account takeover.
