title: SiYuan versions before v3.8.1 contain a server-side request forgery 
  vulnerability in the http_request and web_fetch agent tools that perform DNS 
  resolution only at guard time without validating the connect-time resolution. 
  Attackers can use DNS rebinding to answer the guard resolution with a public 
  IP and the connect resolution with a private or metadata IP, bypassing the 
  SSRF defense to access cloud instance metadata and internal services.
