title: Flowise before 3.1.3 contains a code injection vulnerability in the 
  Airtable Agent node that allows unauthenticated attackers to execute arbitrary
  Python code by bypassing the pythonCodeValidator blocklist through obfuscation
  techniques. Attackers can send crafted prompts to a chatflow using the 
  Airtable Agent node to inject malicious Python code that executes in an 
  unsandboxed pyodide environment with full access to the host operating system.
