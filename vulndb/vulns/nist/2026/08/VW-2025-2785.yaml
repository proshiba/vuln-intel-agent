title: "In the Linux kernel, the following vulnerability has been resolved:\n\nata:
  libata-transport: fix double ata_host_put() in ata_tport_add()\n\nIn the error path
  in ata_tport_add(), when calling put_device(),\nata_tport_release() is called, it
  will put the refcount of 'ap->host'.\n\nAnd then ata_host_put() is called again,
  the refcount is decreased\nto 0, ata_host_release() is called, all ports are freed
  and set to\nnull.\n\nWhen unbinding the device after failure, ata_host_stop() is
  called\nto release the resources, it leads a null-ptr-deref(), because all\nthe
  ports all freed and null.\n\nUnable to handle kernel NULL pointer dereference at
  virtual address 0000000000000008\nCPU: 7 PID: 18671 Comm: modprobe Kdump: loaded
  Tainted: G            E      6.1.0-rc3+ #8\npstate: 80400009 (Nzcv daif +PAN -UAO
  -TCO -DIT -SSBS BTYPE=--)\npc : ata_host_stop+0x3c/0x84 [libata]\nlr : release_nodes+0x64/0xd0\n\
  Call trace:\n ata_host_stop+0x3c/0x84 [libata]\n release_nodes+0x64/0xd0\n devres_release_all+0xbc/0x1b0\n\
  \ device_unb"
