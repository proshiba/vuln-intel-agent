title: "AIL Framework contains a server-side request forgery (SSRF) vulnerability
  in its crawler submission functionality. A low-privileged authenticated user with
  access to the crawler interface can submit an arbitrary URL for crawling without
  adequate validation of the destination host.\n\n\nThe crawler can therefore be instructed
  to make direct HTTP(S) requests to addresses that should not be reachable by application
  users, including loopback addresses, RFC1918 private networks, link-local addresses,
  and cloud metadata services such as 169.254.169.254.\n\n\nManual crawler tasks bypass
  the existing domain blacklist because they are assigned a non-zero priority, and
  ordinary IP literals are classified as web targets and fetched directly rather than
  through Tor or another proxy. Consequently, an attacker can use the AIL server as
  a network pivot to access services available from the server's network context.\n\
  \n\nResponses generated by these requests, including captured HTML, screenshots,
  and HAR data,"
