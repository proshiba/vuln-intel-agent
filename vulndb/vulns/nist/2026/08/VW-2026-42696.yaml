title: "A vulnerability in the OSPF protocol of Cisco Secure Firewall Adaptive Security
  Appliance (ASA) Software and Cisco Secure Firewall Threat Defense (FTD) Software
  could allow an unauthenticated, adjacent attacker to corrupt memory on an affected
  device, resulting in a denial of service (DoS) condition.\r\n\r This vulnerability
  is due to memory corruption when parsing OSPF protocol packets. An attacker could
  exploit this vulnerability by sending crafted OSPF packets to an affected device.
  A successful exploit could allow the attacker to cause memory corruption causing
  the affected device to reboot, resulting in a DoS condition."
