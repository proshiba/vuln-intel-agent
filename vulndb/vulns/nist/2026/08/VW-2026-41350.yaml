title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/dp/mst:
  fix OOB reads in remote DPCD/I2C sideband reply parsers\n\ndrm_dp_sideband_parse_remote_dpcd_read()
  reads num_bytes from the raw\nmessage and then unconditionally does:\n\n  memcpy(bytes,
  &raw->msg[idx], num_bytes);\n\nwithout checking that idx + num_bytes <= raw->curlen.
  raw->msg[] is\n256 bytes; if a malicious or misbehaving MST hub sets num_bytes larger\n\
  than the remaining payload, the memcpy reads past the received data\ninto whatever
  follows in raw->msg[].\n\ndrm_dp_sideband_parse_remote_i2c_read_ack() has the same
  flaw (noted\nwith a /* TODO check */ comment since the code was introduced).\n\n\
  Fix both functions by using a single combined check\n(idx + num_bytes > curlen)
  before each memcpy. Since num_bytes is u8,\nit is always >= 0, so this strictly
  subsumes the simpler idx > curlen\nform and no separate step is needed.\n\n[added
  missing fixes tag]"
