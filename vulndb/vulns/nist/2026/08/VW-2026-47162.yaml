title: Stigmem before 0.9.0a11 fails to validate the delivery_address parameter 
  when creating webhook subscriptions, allowing authenticated users to specify 
  internal loopback and private network destinations. Attackers can trigger 
  matching fact-change events to cause the Stigmem server to issue server-side 
  HTTP POST requests to internal services, enabling blind SSRF attacks against 
  localhost and private network endpoints.
