title: "In the Linux kernel, the following vulnerability has been resolved:\n\ninet:
  inet_defrag: prevent sk release while still in use\n\nip_local_out() and other functions
  can pass skb->sk as function argument.\n\nIf the skb is a fragment and reassembly
  happens before such function call\nreturns, the sk must not be released.\n\nThis
  affects skb fragments reassembled via netfilter or similar\nmodules, e.g. openvswitch
  or ct_act.c, when run as part of tx pipeline.\n\nEric Dumazet made an initial analysis
  of this bug.  Quoting Eric:\n  Calling ip_defrag() in output path is also implying
  skb_orphan(),\n  which is buggy because output path relies on sk not disappearing.\n\
  \n  A relevant old patch about the issue was :\n  8282f27449bf (\"inet: frag: Always
  orphan skbs inside ip_defrag()\")\n\n  [..]\n\n  net/ipv4/ip_output.c depends on
  skb->sk being set, and probably to an\n  inet socket, not an arbitrary one.\n\n\
  \  If we orphan the packet in ipvlan, then downstream things like FQ\n  packet scheduler
  will not work properly.\n\n"
