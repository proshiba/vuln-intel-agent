title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_ncm: validate datagram bounds in ncm_unwrap_ntb()\n\nWhen unpacking host-supplied
  NTBs, ncm_unwrap_ntb() checks datagram length\nagainst frame_max but does not verify
  that the datagram fits within the\ndeclared block length. Additionally, when decoding
  multiple NTBs from a\nsingle socket buffer, subsequent block lengths are not checked
  against the\nactual remaining buffer data.\n\nWith these checks missing, a malicious
  USB host can specify datagram\noffsets and lengths that point beyond the block,
  or supply secondary NTB\nheaders declaring lengths larger than the buffer. skb_put_data()
  then\ncopies adjacent kernel memory from skb_shared_info into the network skb.\n\
  \nFix this by verifying that sufficient buffer space remains for the NTB\nheader
  before parsing, handling zero-length block declarations, ensuring\nthat block lengths
  never exceed the remaining buffer space, and verifying\nthat each datagram payload
  stays str"
