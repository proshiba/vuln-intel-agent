title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/uaccess:
  correct check for CONFIG_PPC_E500 in mask_user_address()\n\nmask_user_address()
  incorrectly checks for CONFIG_E500 instead of\nCONFIG_PPC_E500, causing mask_user_address_isel()
  to not be used on\nE500 hardware. Fix the check to use the correct name."
