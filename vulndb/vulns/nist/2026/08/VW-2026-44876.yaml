title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  bound DMA command body size against suffix pointer\n\nvmw_cmd_dma() locates the
  DMA suffix at\n\n\t(unsigned long) &cmd->body + header->size - sizeof(*suffix)\n\
  \nwithout checking that header->size is large enough to contain both\ncmd->body
  and the suffix.  An undersized header makes the suffix\npointer underflow back into
  the previous command in the bounce\nbuffer.  The verifier later writes suffix->maximumOffset,
  clobbering\nverified fields of an already-relocated earlier command -- a TOCTOU\n\
  on the device-visible command stream that lets one command rewrite\nanother's GMR
  id, surface id, or other authenticated fields.\n\nReject the command if the body
  is too small for the suffix to fit."
