title: "In Spring AI's tool calling support, the per-request tool list is advertised
  to the model as a boundary but is not fully enforced when a tool call is dispatched.
  Under certain conditions, a tool that was not made available to the current request
  could be invoked, potentially leading to privilege escalation.\nAffected versions:\n\
  Spring AI: 2.0.0\nSpring AI: 1.1.0 through 1.1.8\nSpring AI: 1.0.0 through 1.0.9"
