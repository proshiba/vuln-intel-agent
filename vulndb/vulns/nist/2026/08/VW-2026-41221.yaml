title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/super:
  fix emergency thaw double-unlock of s_umount\n\ndo_thaw_all() iterates over all
  superblocks via __iterate_supers()\nwith SUPER_ITER_EXCL, which acquires s_umount
  exclusively before\ncalling the callback and releases it afterwards. However, the\n\
  callback do_thaw_all_callback() calls thaw_super_locked() which\nunconditionally
  releases s_umount on every code path. This results\nin a second unlock attempt in
  __iterate_supers() that corrupts the\nrwsem state, triggering a DEBUG_RWSEMS warning:\n\
  \n[  182.601148] sysrq: Emergency Thaw of all frozen filesystems\n[  182.601865]
  ------------[ cut here ]------------\n[  182.602375] DEBUG_RWSEMS_WARN_ON((rwsem_owner(sem)
  != current) && !rwsem_test_oflags(sem, RWSEM_NONSPINNABLE)): count = 0x0, magic
  = 0xffff99b1011e5870, owner = 0x0, curr 0xffff99b101b06c80, list not empty\n[  182.603817]
  WARNING: kernel/locking/rwsem.c:1412 at up_write+0xa3/0x170, CPU#2: kworker/2:1/53\n\
  [  182.60457"
