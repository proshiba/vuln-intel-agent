title: The CM Map Locations – Visualize and share your locations in a few clicks
  plugin for WordPress is vulnerable to Limited Arbitrary File Upload in all 
  versions up to, and including, 2.1.8 via the uploadMedia function. This is due
  to insufficient file type validation in the upload handler, which performs 
  incomplete extension filtering without MIME-type checks or upload capability 
  verification before passing attacker-supplied files to move_uploaded_file(). 
  This makes it possible for authenticated attackers, with subscriber-level 
  access and above, to upload files that may be executable, which makes remote 
  code execution possible. The required nonce is exposed to any logged-in 
  Subscriber via the CMLOC_Editor_Images JavaScript object on the front-end 
  location editor page.
