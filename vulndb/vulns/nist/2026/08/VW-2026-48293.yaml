title: "Missing authorization issue for domain admins in CloudStack's host tags listing
  functionality.\n\n\n\n\nDomain Admins, by default, have permission to call the listHostTags
  API, but the API returns host tags for every host in the environment without domain
  scoping. It should instead be restricted to only the hosts dedicated to that admin's
  domain.\n\n\n\n\nThis issue affects Apache CloudStack: from 4.12.0.0 through 4.20.3.0
  and from 4.21.0.0 through 4.22.1.0.\n\n\n\n\nUsers are recommended to upgrade to
  version 4.20.3.1 or 4.22.1.1 or later, which fixes the issue."
