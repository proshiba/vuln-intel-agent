title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  bridge: xmit: make sure we have at least eth header len bytes\n\nsyzbot triggered
  an uninit value[1] error in bridge device's xmit path\nby sending a short (less
  than ETH_HLEN bytes) skb. To fix it check if\nwe can actually pull that amount instead
  of assuming.\n\nTested with dropwatch:\n drop at: br_dev_xmit+0xb93/0x12d0 [bridge]
