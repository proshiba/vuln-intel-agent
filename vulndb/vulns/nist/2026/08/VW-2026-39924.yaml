title: PraisonAI is a multi-agent teams system. In versions 3.9.26 through 
  4.6.57 of praiseonai and 0.12.12 through 1.6.57 of praiseonaiagents, the 
  workflow "include" feature is vulnerable to code execution. 
  Workflow._execute_include() implicitly imports and runs an included recipe's 
  tools.py via a raw importlib.util.spec_from_file_location() and 
  spec.loader.exec_module() call, without honoring the 
  PRAISONAI_ALLOW_TEMPLATE_TOOLS/PRAISONAI_ALLOW_LOCAL_TOOLS autoload opt-in 
  gates or routing through the centralized safe loader that protects the other 
  tools.py autoload paths. As a result, a workflow that includes an 
  attacker-controlled local recipe directory executes arbitrary module-level 
  Python code during include setup, before any child workflow parsing or model 
  call, and the same sink is reachable through the higher-level 
