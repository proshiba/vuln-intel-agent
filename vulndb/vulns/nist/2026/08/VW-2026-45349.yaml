title: "The WNC-M14A2A LTE-M modem driver mishandles unsolicited %NOTIFYEV: events
  in on_cmd_socknotifyev() (drivers/modem/vendor_standalone/wncm14a2a.c). The response
  line is linearized into a fixed 40-byte stack buffer via net_buf_linearize(), which
  caps the copy at 39 bytes and returns out_len <= 39. The two quote-delimiter scanning
  loops, however, were bounded by len — the full CR/LF-delimited frame length returned
  by net_buf_findcrlf() — rather than by out_len.\n\nWhen a %NOTIFYEV: line longer
  than 39 bytes contains no \" within the linearized region, the loop indices p1/p2
  walk past value[39] and read adjacent stack memory until a stray quote byte is found
  or the index reaches len. The over-read string is then passed to strncmp()/atoi()/LOG_*,
  and if a quote byte is found out of bounds the subsequent value[p2] = '\\0' performs
  a single-NUL out-of-bounds stack write at an attacker-influenced offset.\n\nThe
