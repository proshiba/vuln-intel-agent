title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_hashlimit: validate hashtable supports XT_HASHLIMIT_RATE_MATCH\n\nThe XT_HASHLIMIT_RATE_MATCH
  flag mode changes the semantics of the\ndsthash_ent structure which represents an
  entry in the hashtable.  There\nis a union area which uses a different layout to
  express the rate match\nmode.\n\nUpdate .checkentry path to validate the XT_HASHLIMIT_RATE_MATCH
  mode\nflag is requested by two or more different rules that refer to the same\n\
  hashtable. Otherwise, uninitialized access to the burst field in the\nunion is possible.\n\
  \nReject the use of the XT_HASHLIMIT_RATE_MATCH mode flag if set on by\nrevision
  less than 3 too."
