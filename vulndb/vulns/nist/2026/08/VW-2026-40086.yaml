title: "The user impersonation flow in WSO2 Identity Server fails to properly manage
  refresh tokens associated with impersonated sessions. This allows an attacker who
  has obtained an access token for an impersonated user to leverage the refresh token
  grant to obtain new access tokens, extending their ability to act as the legitimate
  user.\n\nAn attacker who gains access to an impersonated user's access token can
  exploit this weakness to renew their authorization. This results in the continued
  ability to perform actions on behalf of the actual user, compromising log integrity
  and traceability by masking the true actor."
