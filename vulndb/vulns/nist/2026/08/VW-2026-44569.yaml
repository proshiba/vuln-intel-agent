title: "In the Linux kernel, the following vulnerability has been resolved:\n\nseg6:
  validate SRH length before reading fixed fields\n\nseg6_validate_srh() reads fixed
  SRH fields such as srh->type and\nsrh->hdrlen before checking that the supplied
  length covers the fixed\nstruct ipv6_sr_hdr fields.\n\nThe BPF SEG6 encap path reaches
  this with a BPF program-supplied pointer\nand length: bpf_lwt_push_encap() and the
  SEG6 local BPF END_B6 and\nEND_B6_ENCAP actions call bpf_push_seg6_encap(), which
  forwards the\nlength to seg6_validate_srh() with no minimum-size guard.  A 2-byte
  SEG6\nencap header can therefore make the validator read srh->type at offset 2\n\
  beyond the caller-supplied buffer.\n\nReject lengths shorter than the fixed SRH
  at the top of\nseg6_validate_srh(), before any field is read.  This fixes the BPF
  helper\npath and keeps the common validator robust."
