title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hns:
  Fix warning in poll cq direct mode\n\nCQs allocated by ib_alloc_cq() always have
  a comp_handler. Though\nin direct mode this handler is never expected to be called,
  it\nis still called when the driver is reset, triggering the following\nWARN_ONCE():\n\
  \nCall trace:\nib_cq_completion_direct+0x38/0x60\nhns_roce_cq_completion+0x54/0x90
  (hns_roce_hw_v2]\nhns_roce_handle_device_err+Ox1c8/0x340 [hns_roce_hw_v2]\nhns_roce_hw_v2_uninit_instance.constprop.0+0x34/0x70
