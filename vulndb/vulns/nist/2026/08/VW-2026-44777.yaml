title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Reject exclusive maps for bpf_map_elem iterators\n\nExclusive maps (aka excl_prog_hash)
  are meant to be reachable only\nfrom the single program whose hash matches. This
  is enforced by\ncheck_map_prog_compatibility() when the map is referenced from a\n\
  program such as signed BPF loaders.\n\nA bpf_map_elem iterator, however, binds its
  target map at attach\ntime in bpf_iter_attach_map() instead of referencing it from
  the\nprogram, so the exclusivity check is never reached. On top of that,\nthe iterator
  exposes the map value as a writable buffer."
