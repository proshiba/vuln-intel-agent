title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/xe/vm:
  Fix BO prefetch with CONSULT_MEM_ADVISE_PREF_LOC\n\nWhen prefetch region is DRM_XE_CONSULT_MEM_ADVISE_PREF_LOC
  for a BO VMA,\nthe code used it as an index into region_to_mem_type[], causing an\n\
  out-of-bounds access since the value is -1.\n\nResolve the preferred location for
  BO VMAs directly: local VRAM on dGFX\n(using the BO's tile placement) or system
  memory on iGPU.\n\nDiscovered using AI-assisted static analysis confirmed by Intel
  Product\nSecurity.\n\nv2:\n-Fix null dereference\n\n(cherry picked from commit d9a4906ac03be9f6ed3f3b45c56c866b867fd75b)"
