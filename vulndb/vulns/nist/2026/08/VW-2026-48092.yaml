title: libvips is a fast image processing library with low memory needs. Prior 
  to version 8.18.3, a crafted many-band TIFF processed through 
  VipsForeignLoadTiff can evade scanline validation in libvips/iofuncs/image.c 
  and cause an integer overflow in vips_image_sanity. The resulting 
  buffer-region calculation can access attacker-controlled negative offsets in 
  mmap-resident allocations, allowing reads or writes of other image data, 
  possible data disclosure through uncompressed .v output, and likely process 
  crashes. Remote code execution has not been demonstrated but cannot be ruled 
  out. This issue is fixed in version 8.18.3.
