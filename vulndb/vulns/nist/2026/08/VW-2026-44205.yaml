title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/sched:
  sch_multiq: Replace direct dequeue call with peek and qdisc_dequeue_peeked\n\nmultiq_dequeue()
  takes a packet from a band's child with a direct\n->dequeue() call after multiq_peek()
  peeked it. When the child is\nnon-work-conserving the peek stashes the skb in the
  child's gso_skb, so\nthe direct dequeue returns a different skb and orphans the
  stash,\ndesyncing the child's qlen/backlog. With a qfq child reached through a\n\
  peeking parent (e.g. tbf) this re-enters the child on an emptied list and\ndereferences
  NULL, panicking the kernel from softirq on ordinary egress.\n\nTake the packet through
  qdisc_dequeue_peeked(), as sch_prio already does\nand as sch_red and sch_sfb were
  just fixed to do. The helper is a no-op\nwhen the child has no stash, so a work-conserving
  child is unaffected."
