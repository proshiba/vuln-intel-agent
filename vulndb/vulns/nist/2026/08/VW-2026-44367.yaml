title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  reject non-resident records for resident-only attributes\n\nThe shared lookup-time
  attribute validator rejects non-resident\n$FILE_NAME and $VOLUME_NAME records because
  their formats require\nresident values and callers handle returned records as resident\n\
  attributes. Other resident-only attribute types still pass through the\ngeneric
  non-resident mapping-pairs checks.\n\nThat leaves real resident/non-resident union
  confusion paths. Inode load\nlooks up $STANDARD_INFORMATION and then reads data.resident.value_offset\n\
  without checking a->non_resident. ntfs_inode_sync_standard_information()\ndoes the
  same when updating the standard information value.\nntfs_write_volume_flags() also
  looks up $VOLUME_INFORMATION and reads\ndata.resident.value_offset directly. $INDEX_ROOT
  callers in dir.c and\nindex.c depend on the same lookup contract before consuming
  the resident\nindex root value.\n\nReject non-resident records for all resident-on"
