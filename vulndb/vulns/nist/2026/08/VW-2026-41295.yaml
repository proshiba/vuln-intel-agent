title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  mali-c55: Fix possible ERR_PTR in enable_streams\n\nThe media_pad_remote_pad_unique()
  function returns either a valid\npointer or an ERR_PTR() on failure (-ENOTUNIQ if
  multiple links are\nenabled, -ENOLINK if no connected pad is found). The return
  value\nwas assigned directly to isp->remote_src and dereferenced in the\nnext line
  without checking for errors, which could lead to an\nERR_PTR dereference.\n\nAdd
  proper error checking with IS_ERR() before dereferencing the\npointer. Also set
  isp->remote_src to NULL on error to maintain\nconsistency with other error paths
  in the function."
