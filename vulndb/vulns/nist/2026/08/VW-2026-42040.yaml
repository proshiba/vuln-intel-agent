title: An SQL injection vulnerability in Koha through 24.11.17, 25.05.12, 
  25.11.06, and 26.05.01 allows authenticated staff with the acquisition => 
  order_receive permission to read arbitrary database contents via the orderby 
  request parameter in acqui/parcels.pl. The parameter is passed to 
  C4::Acquisition::GetInvoices, which allow-lists the column name but 
  concatenates the direction token raw into the SQL ORDER BY clause without 
  validation. Exploitation is blind (time-based) in production and allows 
  extraction of patron PII, staff bcrypt password hashes, and two-factor 
  secrets.
