title: FFmpeg before commit 983dae9 contains an out-of-bounds read in the AV1 
  RTP packetizer (libavformat/rtpenc_av1.c). The keyframe detection loop that 
  searches for a sequence header OBU advanced its pointer and remaining-size 
  counter by the encoded header length plus the OBU payload size without first 
  bounding the OBU size against the remaining data. A crafted OBU size causes 
  the remaining-size counter to wrap to a positive value, causing the next loop 
  iteration to dereference a pointer beyond the end of the packet buffer. A 
  crafted AV1 input packet muxed to RTP triggers the out-of-bounds read.
