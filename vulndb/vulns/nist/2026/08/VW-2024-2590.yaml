title: "An authentication bypass in Palo Alto Networks PAN-OS software enables an
  unauthenticated attacker with network access to the management web interface to
  gain PAN-OS administrator privileges to perform administrative actions, tamper with
  the configuration, or exploit other authenticated privilege escalation vulnerabilities
  like  CVE-2024-9474 https://security.paloaltonetworks.com/CVE-2024-9474 .\n\nThe
  risk of this issue is greatly reduced if you secure access to the management web
  interface by restricting access to only trusted internal IP addresses according
  to our recommended  best practice deployment guidelines https://live.paloaltonetworks.com/t5/community-blogs/tips-amp-tricks-how-to-secure-the-management-access-of-your-palo/ba-p/464431
  .\n\nThis issue is applicable only to PAN-OS 10.2, PAN-OS 11.0, PAN-OS 11.1, and
  PAN-OS 11.2 software.\n\nCloud NGFW and Prisma Access are not impacted by this vulnerability."
