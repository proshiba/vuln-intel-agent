title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ath11k: add srng->lock for ath11k_hal_srng_* in monitor mode\n\nath11k_hal_srng_*
  should be used with srng->lock to protect srng data.\n\nFor ath11k_dp_rx_mon_dest_process()
  and ath11k_dp_full_mon_process_rx(),\nthey use ath11k_hal_srng_* for many times
  but never call srng->lock.\n\nSo when running (full) monitor mode, warning will
  occur:\nRIP: 0010:ath11k_hal_srng_dst_peek+0x18/0x30 [ath11k]\nCall Trace:\n ? ath11k_hal_srng_dst_peek+0x18/0x30
  [ath11k]\n ath11k_dp_rx_process_mon_status+0xc45/0x1190 [ath11k]\n ? idr_alloc_u32+0x97/0xd0\n\
  \ ath11k_dp_rx_process_mon_rings+0x32a/0x550 [ath11k]\n ath11k_dp_service_srng+0x289/0x5a0
  [ath11k]\n ath11k_pcic_ext_grp_napi_poll+0x30/0xd0 [ath11k]\n __napi_poll+0x30/0x1f0\n\
  \ net_rx_action+0x198/0x320\n __do_softirq+0xdd/0x319\n\nSo add srng->lock for them
  to avoid such warnings.\n\nInorder to fetch the srng->lock, should change srng's
  definition from\n'void' to 'struct hal_srng'. And initialize them "
