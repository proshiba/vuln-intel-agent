title: "In the Linux kernel, the following vulnerability has been resolved:\n\nstaging:
  vme_user: fix location monitor leak in tsi148 bridge\n\ntsi148_probe() allocates
  a location monitor resource and links it into\ntsi148_bridge->lm_resources. The
  probe error path frees this list, but\ntsi148_remove() only frees the dma, slave
  and master resource lists, so\nthe location monitor resource is leaked on device
  unbind or module\nunload.\n\nFree the lm_resources list in tsi148_remove() as well,
  before\ntsi148_bridge is freed."
