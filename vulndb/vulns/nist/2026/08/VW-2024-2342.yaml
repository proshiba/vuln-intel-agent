title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vmwgfx:
  Prevent unmapping active read buffers\n\nThe kms paths keep a persistent map active
  to read and compare the cursor\nbuffer. These maps can race with each other in simple
  scenario where:\na) buffer \"a\" mapped for update\nb) buffer \"a\" mapped for compare\n\
  c) do the compare\nd) unmap \"a\" for compare\ne) update the cursor\nf) unmap \"\
  a\" for update\nAt step \"e\" the buffer has been unmapped and the read contents
  is bogus.\n\nPrevent unmapping of active read buffers by simply keeping a count
  of\nhow many paths have currently active maps and unmap only when the count\nreaches
  0."
