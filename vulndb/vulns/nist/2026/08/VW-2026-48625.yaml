title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/page_table_check:
  skip special zero mappings\n\npage_table_check_set() and page_table_check_clear()
  account mappings based\non PageAnon().  Shared zero-page PTEs and huge zero PMDs
  are special\nmappings, but page_table_check can still account them as file-backed\n\
  pages.\n\nAn unprivileged process can populate enough zero mappings to overflow\n\
  file_map_count and hit the existing BUG_ON().  The PTE path can do this\nwith the
  shared zero page, and the PMD path can do the same with huge zero\nmappings.\n\n\
  Skip special zero mappings in the user page-table accounting paths.  Keep\nthe PTE-side
  pte_special() check, and identify huge zero PMDs from the\nmapped folio instead
  of pmd_special().  That covers architectures where\npmd_special() is a no-op without
  adding huge_zero_pfn checks to the\ngeneric counter helpers."
