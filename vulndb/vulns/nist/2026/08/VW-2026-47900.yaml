title: Plate is a rich-text editor with AI and shadcn/ui. Prior to 53.3.2, 
  @platejs/docx-io fetches remote image URLs while converting 
  attacker-controlled HTML through htmlToDocxBlob in a server-side or privileged
  environment. The converter can make requests to internal network resources and
  include the fetched image bytes in the generated DOCX, allowing server-side 
  request forgery with response disclosure. Applications can also incur resource
  consumption from attacker-selected remote responses. This issue is fixed in 
  version 53.3.2.
