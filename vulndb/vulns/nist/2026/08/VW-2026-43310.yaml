title: "PDF::WebKit versions through 1.2 for Perl allow argument injection into wkhtmltopdf
  via meta tags in the source document.\n\nFor an HTML string or file source, the
  constructor collects every <meta name=\"pdf-webkit-KEY\" content=\"VALUE\"> element
  in the document head through _pdf_webkit_meta_tags and turns each one into a wkhtmltopdf
  command line option. KEY is normalized to an option name matching --[a-z0-9-]+ but
  is not checked against an allow list, VALUE is passed through unchanged as the argument
  that follows it, and a VALUE of \"yes\" emits the option as a bare flag. BUILD merges
  the meta derived options last, so they also override the module defaults and the
  options passed to new. Switches such as --enable-local-file-access and --cookie-jar
  are reachable this way. The renderer is executed with an argument list rather than
  a shell command, so this is argument injection and not shell injection.\n\nAny caller
  that renders untrusted HTML lets the document choose the renderer's options and
