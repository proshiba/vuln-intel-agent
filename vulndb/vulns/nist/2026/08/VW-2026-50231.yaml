title: "In the Linux kernel, the following vulnerability has been resolved:\n\neth:
  bnxt: avoid deadlock when canceling IRQ affinity notifier\n\nUnregistering IRQ affinity
  notifiers waits for the callback synchronously.\nbnxt takes the netdev instance
  lock in the notifier (to restart the queue)\nand cancels the work under the same
  lock. This may obviously deadlock.\n\nMove the restart to the async service task.
  The queue restart isn't\nsuper time sensitive. Store the new TPH tag, schedule the
  task.\nSafely canceling the service task is already ironed out.\n\nIn bnxt_request_irq()
  the order of registering notifier, affinity and\ninitial TPH programming has to
  be inverted. I think it was racy\npreviously since user may trigger an update as
  soon as notifier\nis installed.\n\nThere's a small known gap - if pcie_tph_get_cpu_st()
  fails at init\nand the target tag is 0 we may miss programming the entry.\nThis
  does not seem worth fixing, the code has skip-on-failure\nall over the place, anyway."
