title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbatman-adv:
  clean untagged VLAN on netdev registration failure\n\nWhen an mesh interface is
  registered, it creates an untagged struct\nbatadv_meshif_vlan on top of it via the
  NETDEV_REGISTER notifier. But in\nthis process, another receiver of this notification
  can veto the\nregistration. The netdev registration will be aborted because of this
  veto.\n\nThe register_netdevice() call will try to clean up the net_device using\n\
  unregister_netdevice_queue() - which only uses the .priv_destructor to\nfree private
  resources. In this situation, .dellink will not be called.\n\nThe cleanup of the
  untagged batadv_meshif_vlan must thefore be done in the\ndestructor to avoid a leak
  of this object."
