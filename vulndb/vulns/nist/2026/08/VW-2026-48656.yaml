title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  smc: fix splice entry lifetime imbalance in smc_rx_splice\n\nsmc_rx_splice() passes
  pages to splice_to_pipe() before taking the\nreferences that cover the lifetime
  of each splice entry. In the\nVM-backed RMB path, splice_to_pipe() may drop unqueued
  entries through\nsmc_rx_spd_release(), while queued entries are released later via
  the\npipe buffer callback.\n\nThe old post-splice accounting also derives the number
  of queued VM pages\nfrom an offset mutated while building the descriptor, and a
  multi-page\nsplice pairs one sock_hold() with multiple sock_put() calls.\n\nTake
  the page and socket references for every candidate entry before\nsplice_to_pipe(),
  and drop the matching private state, page reference,\nand socket reference from
  smc_rx_spd_release() for entries that never\nget queued. This fixes a refcount imbalance
  that can underflow page\nrefcounts and trigger a use-after-free."
