title: "The non-blocking (asynchronous) JSON parser in jackson-core does not enforce
  the maxNumberLength constraint defined in StreamReadConstraints (default: 1000 characters).
  An attacker able to submit JSON to an application that uses the async parser API
  can supply a number token of arbitrary length, leading to excessive memory allocation
  and potential CPU exhaustion, resulting in a denial of service.\n\n\n\nThe synchronous
  parser enforces this limit correctly, so the constraint is applied inconsistently
  depending on which parsing API the application uses.\n\n\n\nRoot cause: the async
  parsing path in NonBlockingUtf8JsonParserBase and related classes never invokes
  the number length validation methods. Number parsing methods such as _finishNumberIntegralPart()
  accumulate digits into the TextBuffer without any length check, then call _valueComplete()
  to finalize the token. _valueComplete() does not call resetInt() or resetFloat(),
