title: "Vocos instantiates a class named by a configuration file without restricting
  which class may be named. instantiate_class in vocos/pretrained.py takes the class_path
  value from the configuration, splits it into a module and an attribute, imports
  the module with __import__, resolves the attribute with getattr, and calls the result
  as args_class(*args, **kwargs) where kwargs is the config's own init_args mapping.
  No allowlist constrains the dotted path, so a configuration may name any importable
  callable and supply the arguments it is called with. Vocos.from_hparams reaches
  this for each of the feature_extractor, backbone and head entries, and Vocos.from_pretrained
  reaches it with a remote file: it downloads config.yaml from a caller-named Hugging
  Face repository and passes it straight to from_hparams. Loading a model from a repository
  the user does not control therefore executes code of the repository owner's choosing
