title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  validate attribute values on lookup\n\nntfs_attr_find() and ntfs_external_attr_find()
  check that generic\nresident attribute values fit in their attribute records and
  that\nfixed-size resident values are large enough. For variable-length resident\n\
  formats, however, the fixed part is not enough: embedded length fields\ncan still
  point callers past the resident value.\n\nA crafted image can set a small resident
  $FILE_NAME value_length while\nleaving file_name_length large. Callers then trust
  file_name_length and\nread past the resident value when converting or comparing
  the name. This\nwas reproduced with a crafted image under KASAN as a slab-out-of-bounds\n\
  read from the kmalloc-1k MFT record copy. The stack included\nntfs_lookup(), ntfs_iget(),
  ntfs_read_locked_inode(), ntfs_attr_name_get(),\nntfs_ucstonls(), and utf16s_to_utf8s().\n\
  \nAdd a shared attribute value validator and use it before a lookup path\ncan return
  an attribute,"
