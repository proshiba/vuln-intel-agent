title: "Streambert is a cross-platform Electron Desktop App to stream and download
  video content. Prior to version 2.6.0, the open-external IPC handler in src/ipc/downloads.js
  passes a renderer-supplied url directly to Electron's shell.openExternal without
  validating its protocol. A compromised renderer can submit file: URIs or operating-system-specific
  custom schemes, causing the host to open local files, access remote resources through
  registered handlers, or launch scripts and applications supported by those handlers.
  This issue is fixed in version 2.6.0."
