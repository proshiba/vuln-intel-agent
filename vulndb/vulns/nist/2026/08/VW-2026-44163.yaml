title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  ieee80211: validate MLE common info length\n\nieee80211_mle_common_size() uses the
  first common-info octet as the\ncommon information length for all known MLE types.
  However,\nieee80211_mle_size_ok() only validates that octet for Basic, Probe\nRequest,
  and TDLS MLEs.\n\nReconfiguration MLEs also skipped the length octet when calculating
  the\nminimum common size, and Priority Access MLEs skipped validation of the\nadvertised
  common information length.\n\nAccount for the Reconfiguration common-info length
  octet and validate\nthe advertised common information length for all known MLE types.
  Keep\nunknown-type handling unchanged.\n\n[remove now misleading comment]"
