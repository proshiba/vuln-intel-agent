title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblock:
  stop the timeout timer when releasing a never added disk\n\ndisk_release() undoes
  blk_mq_init_allocated_queue() for a disk whose\nprobe failed before add_disk(),
  but it only calls blk_mq_exit_queue().\nNothing there stops q->timeout, and that
  timer rolls forward: it stays\npending until it next expires, not until the last
  request completes.\nSo if the driver issued any I/O before adding the disk, the\n\
  request_queue is freed while still linked into a timer wheel bucket.\n\nCommit 6f8191fdf41d
  (\"block: simplify disk shutdown\") dropped the\nblk_cleanup_queue() call that used
  to stop it.  __del_gendisk() and\nblk_mq_destroy_queue() still do; only the probe
  failure path lost it.\n\nnvme gets there because nvme_update_ns_info() submits Report
  Zones or\nFDP io-mgmt-recv on ns->queue before the disk is added, so a later\nfailure
  - a concurrent reset setting NVME_CTRL_FROZEN, or\ndevice_add_disk() failing - lands
  in put_disk() with the"
