title: "In the Linux kernel, the following vulnerability has been resolved:\n\nscsi:
  core: Fix a use-after-free\n\nThere are two .exit_cmd_priv implementations. Both
  implementations use\nresources associated with the SCSI host. Make sure that these
  resources are\nstill available when .exit_cmd_priv is called by waiting inside\n\
  scsi_remove_host() until the tag set has been freed.\n\nThis commit fixes the following
  use-after-free:\n\n==================================================================\n\
  BUG: KASAN: use-after-free in srp_exit_cmd_priv+0x27/0xd0 [ib_srp]\nRead of size
  8 at addr ffff888100337000 by task multipathd/16727\nCall Trace:\n <TASK>\n dump_stack_lvl+0x34/0x44\n\
  \ print_report.cold+0x5e/0x5db\n kasan_report+0xab/0x120\n srp_exit_cmd_priv+0x27/0xd0
  [ib_srp]\n scsi_mq_exit_request+0x4d/0x70\n blk_mq_free_rqs+0x143/0x410\n __blk_mq_free_map_and_rqs+0x6e/0x100\n\
  \ blk_mq_free_tag_set+0x2b/0x160\n scsi_host_dev_release+0xf3/0x1a0\n device_release+0x54/0xe0\n\
  \ kobject_put+0xa5/0x120\n device_release+0x54/0xe0\n kob"
