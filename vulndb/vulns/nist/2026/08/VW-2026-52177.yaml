title: A flaw was found in SmallRye GraphQL. The number scalar coercion for 
  BigInteger does not properly validate the magnitude of float or string inputs.
  An unauthenticated remote attacker can exploit this by sending a GraphQL query
  containing a large exponent float literal. This can lead to the allocation of 
  extremely large BigInteger objects, causing CPU exhaustion or an 
  OutOfMemoryError, resulting in a denial of service.
