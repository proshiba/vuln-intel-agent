title: "In the Linux kernel, the following vulnerability has been resolved:\n\nregulator:
  core: regulator_lock_two() should test for EDEADLK not EDEADLOCK\n\nCompare against
  -EDEADLK, which is what ww_mutex_lock() actually\nreturns and what every other deadlock
  check in this file already uses.\n\nFunction regulator_lock_two() acquires two regulators
  via\nregulator_lock_nested() -> ww_mutex_lock().  On contention,\nww_mutex_lock()
  returns -EDEADLK, which is the caller's signal to drop\nthe lock it holds and retry
  the acquisition in the canonical order.\n\nHowever, regulator_lock_two() tests the
  return value against -EDEADLOCK\nrather than -EDEADLK.  On most architectures, EDEADLK
  and EDEADLOCK are\nthe same value, so the comparison happens to be correct and the
  bug is\ninvisible.  But on MIPS, SPARC, and PowerPC, those two errors have\ndifferent
  values.  The test is wrong: a genuine -EDEADLK backoff no\nlonger matches -EDEADLOCK,
  so instead of unlocking and retrying, the\ncode falls into WARN_ON(ret) and returns"
