title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncrypto:
  qcom-rng - ensure buffer for generate is completely filled\n\nThe generate function
  in struct rng_alg expects that the destination\nbuffer is completely filled if the
  function returns 0. qcom_rng_read()\ncan run into a situation where the buffer is
  partially filled with\nrandomness and the remaining part of the buffer is zeroed
  since\nqcom_rng_generate() doesn't check the return value. This issue can\nbe reproduced
  by running the following from libkcapi:\n\n    kcapi-rng -b 9000000 > OUTFILE\n\n\
  The generated OUTFILE will have three huge sections that contain all\nzeros, and
  this is caused by the code where the test\n'val & PRNG_STATUS_DATA_AVAIL' fails.\n\
  \nLet's fix this issue by ensuring that qcom_rng_read() always returns\nwith a full
  buffer if the function returns success. Let's also have\nqcom_rng_generate() return
  the correct value.\n\nHere's some statistics from the ent project\n(https://www.fourmilab.ch/random/)
  that shows"
