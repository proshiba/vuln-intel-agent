title: The 爱采集数据采集和发布插件 WordPress plugin through 1.0.0 does not require a 
  per-install secret for one of its unauthenticated endpoints, relying on a 
  hardcoded default, and does not validate the URLs or destination paths it is 
  given, allowing unauthenticated attackers to read arbitrary files from the 
  server, force it to issue arbitrary requests and retrieve the responses, and 
  write attacker-supplied content outside the uploads directory.
