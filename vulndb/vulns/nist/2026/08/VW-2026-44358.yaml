title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  fail attrlist updates when the superblock is inactive\n\ngeneric_shutdown_super()
  clears SB_ACTIVE before evicting cached inodes.\nIf eviction selects the fake inode
  for a base inode's unnamed\n$ATTRIBUTE_LIST attribute, ntfs_evict_big_inode() drops
  the fake inode's\nreference on the base inode while the fake inode is still hashed
  and marked\nI_FREEING.\n\nThat iput can synchronously write back the base inode.
  The writeback path\nmay update mapping pairs and call ntfs_attrlist_update(), which\n\
  unconditionally calls ntfs_attr_iget() for the same $ATTRIBUTE_LIST fake\ninode.
  VFS then finds the I_FREEING inode and waits for eviction to finish,\nbut the current
  task is still inside that eviction path, causing a\nself-deadlock in find_inode().\n\
  \nFix this by mirroring the teardown guard used by __ntfs_write_inode():\nonce SB_ACTIVE
  has been cleared, do not try to iget the attribute-list\nfake inode. Return -EIO
  so teardown aborts the"
