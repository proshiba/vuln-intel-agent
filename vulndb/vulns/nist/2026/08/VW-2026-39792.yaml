title: A flaw was found in Keycloak's Authorization Services. The component 
  responsible for matching request paths to security policies (PathMatcher) does
  not properly normalize URIs before comparison. By adding extra characters like
  a trailing slash or matrix parameters to a URL, an attacker can trick the 
  system into applying a less restrictive security policy than intended. This 
  allows an authenticated user to access administrative or restricted areas they
  should not have permission to see.
