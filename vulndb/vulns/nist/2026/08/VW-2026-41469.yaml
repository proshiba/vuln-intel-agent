title: "In the Linux kernel, the following vulnerability has been resolved:\n\nppp:
  defer channel free to an RCU grace period to fix pppol2tp RX UAF\n\npppol2tp_recv()
  runs in the L2TP UDP-encap softirq RX path:\n\n l2tp_udp_encap_recv() -> l2tp_recv_common()
  -> pppol2tp_recv()\n   -> ppp_input(&po->chan)\n\nIt runs under rcu_read_lock()
  holding only an l2tp_session reference and\ntakes NO reference on the internal PPP
  channel (struct channel,\nchan->ppp) that ppp_input() dereferences.\n\nThe pppox
  socket is SOCK_RCU_FREE, so 'po' and the embedded ppp_channel\nare RCU-safe.  But
  the internal struct channel is a separate allocation\nthat ppp_release_channel()
  frees with a plain kfree():\n\n close(data socket) -> pppol2tp_release() -> pppox_unbind_sock()\n\
  \   -> ppp_unregister_channel() -> ppp_release_channel() -> kfree(pch)\n\nFor a
  channel that is bound (PPPIOCGCHAN) but not attached to a ppp unit\n(no PPPIOCCONNECT,
  pch->ppp == NULL) and not bridged, teardown skips\nboth ppp_disconnect_channel()'s
  synchronize_net()"
