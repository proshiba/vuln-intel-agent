title: "In the Linux kernel, the following vulnerability has been resolved:\n\narm64:
  extable: fix load_unaligned_zeropad() reg indices\n\nIn ex_handler_load_unaligned_zeropad()
  we erroneously extract the data and\naddr register indices from ex->type rather
  than ex->data. As ex->type will\ncontain EX_TYPE_LOAD_UNALIGNED_ZEROPAD (i.e. 4):\n\
  \ * We'll always treat X0 as the address register, since EX_DATA_REG_ADDR is\n \
  \  extracted from bits [9:5]. Thus, we may attempt to dereference an\n   arbitrary
  address as X0 may hold an arbitrary value.\n * We'll always treat X4 as the data
  register, since EX_DATA_REG_DATA is\n   extracted from bits [4:0]. Thus we will
  corrupt X4 and cause arbitrary\n   behaviour within load_unaligned_zeropad() and
  its caller.\n\nFix this by extracting both values from ex->data as originally intended.\n\
  \nOn an MTE-enabled QEMU image we are hitting the following crash:\n Unable to handle
  kernel NULL pointer dereference at virtual address 0000000000000000\n Call trace:\n\
  \  fixup_exception+0xc4/0x1"
