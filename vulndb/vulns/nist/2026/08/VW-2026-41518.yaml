title: Authorization Bypass Through User-Controlled Key in the contact 
  management component in Roskus Prospero Flow CRM before 5.4.8 allows 
  authenticated users of any company to blindly overwrite the contact data of 
  another company and to download that contact's personal data as a vCard via 
  the contact's numeric identifier, because the save and export operations 
  retrieve the record without constraining the query to the authenticated user's
  company.
