title: "The ZFS_IOC_SET_PROP ioctl, used by zfs-set(8), incorrectly validated the
  calling user such that an unprivileged user is able to set metadata on a dataset
  indicating that the dataset has received properties from a zfs-recv(8) stream.\n\
  \nAny local user can set the internal ZFS metadata flag \"$hasrecvd\" on datasets
  via ZFS_IOC_SET_PROP."
