title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  prevent copying too big compressed lzo segment\n\nCompressed length can be corrupted
  to be a lot larger than memory\nwe have allocated for buffer.\nThis will cause memcpy
  in copy_compressed_segment to write outside\nof allocated memory.\n\nThis mostly
  results in stuck read syscall but sometimes when using\nbtrfs send can get #GP\n\
  \n  kernel: general protection fault, probably for non-canonical address 0x841551d5c1000:
  0000 [#1] PREEMPT SMP NOPTI\n  kernel: CPU: 17 PID: 264 Comm: kworker/u256:7 Tainted:
  P           OE     5.17.0-rc2-1 #12\n  kernel: Workqueue: btrfs-endio btrfs_work_helper
  [btrfs]\n  kernel: RIP: 0010:lzo_decompress_bio (./include/linux/fortify-string.h:225
  fs/btrfs/lzo.c:322 fs/btrfs/lzo.c:394) btrfs\n  Code starting with the faulting
  instruction\n  ===========================================\n     0:*  48 8b 06 \
  \               mov    (%rsi),%rax              <-- trapping instruction\n     3:\
  \   48 8d 79 08      "
