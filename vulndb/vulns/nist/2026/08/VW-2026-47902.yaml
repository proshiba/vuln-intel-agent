title: The unstructured library provides open-source components for ingesting 
  and pre-processing images and text documents, such as PDFs, HTML, Word docs, 
  and many more. From 0.4.7 until 0.24.0, the url argument of partition, 
  partition_html, and partition_md is fetched without host validation in 
  unstructured/partition/auto.py, unstructured/partition/html/partition.py, and 
  unstructured/partition/md.py. An attacker who controls that URL can make a 
  server-side ingestion service request loopback addresses, internal HTTP 
  services, or cloud metadata endpoints through direct targets, redirects, or 
  DNS rebinding. The response body is returned as Element text, allowing 
  internal response disclosure, and side-effecting GET endpoints may also be 
  triggered. This issue is fixed in version 0.24.0.
