title: "In the Linux kernel, the following vulnerability has been resolved:\n\nselinux:
  avoid sk_socket dereference in selinux_sctp_bind_connect()\n\nselinux_sctp_bind_connect()
  dereferences sk->sk_socket to pass a\nstruct socket * to selinux_socket_bind() and\n\
  selinux_socket_connect_helper().  However, when the hook is invoked\nfrom the ASCONF
  softirq path (sctp_process_asconf), there is no file\nreference guaranteeing that
  sk->sk_socket is non-NULL.  The setsockopt\ncallers (bindx, connectx, set_primary,
  sendmsg connect) hold a file\nreference and are not affected.\n\nBoth selinux_socket_bind()
  and selinux_socket_connect_helper()\nimmediately resolve sock->sk, never using the
  struct socket * for\nanything else.  Refactor the inner logic into helpers that
  take a\nstruct sock * directly so that selinux_sctp_bind_connect() never needs\n\
  to touch sk->sk_socket at all."
