title: A flaw was found in the Multicluster Engine for Kubernetes ClusterCurator
  controller. A tenant administrator with namespace-scoped privileges can 
  exploit this vulnerability by creating a namespaced ClusterCurator. This 
  action inadvertently grants the tenant administrator the ability to mint a 
  token for a ServiceAccount with cluster-wide administrative authority. This 
  leads to a privilege escalation, allowing the tenant administrator to gain 
  full control over the cluster.
