title: A vulnerability was detected in aaronsb memory-graph up to 
  5cfd2382778837b9f6399080956eee670d00452c. Affected by this vulnerability is 
  the function 
  JsonMemoryStorage.createDomain/JsonMemoryStorage.getMemories/JsonMemoryStorage.saveMemories
  of the file src/tools/memoryTools.ts. The manipulation results in path 
  traversal. The attack must be initiated from a local position. This product 
  operates on a rolling release basis, ensuring continuous delivery. 
  Consequently, there are no version details for either affected or updated 
  releases. The project was informed of the problem early through an issue 
  report but has not responded yet.
