title: n8n before 2.34.1 and 2.33.x before 2.33.4 contains an SSRF protection 
  bypass in the SearXNG Agent tool. The tool sent requests to the user-supplied 
  API URL using a raw HTTP client that did not route through n8n's centralized 
  SSRF protection. On instances with N8N_SSRF_PROTECTION_ENABLED=true, an 
  authenticated user with permission to create SearXNG credentials and configure
  a personal agent could set the API URL to an internal host, causing the n8n 
  server to connect to that host and return the response content through the 
  Agent chat output.
