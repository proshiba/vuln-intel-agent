title: The CheckView  WordPress plugin before 2.3.2 does not restrict its REST 
  API authentication filter to its own routes and unconditionally discards the 
  authentication error raised for any request whose URI merely contains a 
  CheckView  WordPress plugin before 2.3.2-specific string, making it possible 
  for unauthenticated attackers to bypass the REST nonce check and perform any 
  REST action available to a logged-in administrator, such as creating a new 
  administrator account, via a crafted link an administrator is tricked into 
  opening.
