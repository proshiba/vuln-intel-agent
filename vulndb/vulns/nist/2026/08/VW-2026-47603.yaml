title: A vulnerability was found in yangzongzhuan RuoYi-Vue up to 3.9.2. This 
  impacts the function fileDownload/resourceDownload of the file 
  ruoyi-admin/src/main/java/com/ruoyi/web/controller/common/CommonController.java
  of the component Common Download Endpoint. Performing a manipulation of the 
  argument fileName/resource results in path traversal. It is possible to 
  initiate the attack remotely. The exploit has been made public and could be 
  used. The project was informed of the problem early through an issue report 
  but has not responded yet.
