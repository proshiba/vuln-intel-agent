title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmd/raid10:
  fix writes_pending leak on write request failures\n\nraid10_make_request() acquires
  a writes_pending reference with\nmd_write_start() before dispatching write requests.
  Several failure\npaths in raid10_write_request() complete the bio and return without\n\
  reaching the normal write completion path, causing the corresponding\nmd_write_end()
  to be skipped.\n\nMake raid10_write_request() return a status indicating whether
  the write\nrequest was successfully queued. This allows raid10_make_request() to\n\
  release the writes_pending reference with md_write_end() when a write\nrequest fails."
