title: SiYuan versions before v3.7.4 contain a path traversal vulnerability in 
  the getUniqueFilename endpoint that allows anonymous readers to probe 
  filesystem existence without validation or confinement. Attackers can supply 
  arbitrary absolute paths to determine whether files and directories exist on 
  the host, enabling reconnaissance of the filesystem layout and installed 
  software.
