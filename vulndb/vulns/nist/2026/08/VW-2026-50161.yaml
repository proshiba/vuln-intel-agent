title: The Reviews and Rating – Google Reviews plugin for WordPress is 
  vulnerable to Stored Cross-Site Scripting in all versions up to, and 
  including, 5.10. This is due to the wp_display() shortcode handler, used by 
  multiple shortcodes, allowing attacker-controlled html_tags values to define 
  raw HTML tags and then embedding untrusted vicinity content inside those tags.
  This makes it possible for authenticated attackers, with Contributor-level 
  access and above, to inject arbitrary web scripts in pages that will execute 
  whenever a user accesses an injected page.
