title: A vulnerability in the command line interface (CLI) of Cisco Firepower 
  Threat Defense (FTD) Software could allow an authenticated, local attacker 
  with administrative privileges to execute commands on the underlying operating
  system with root privileges. The vulnerability is due to insufficient input 
  validation. An attacker could exploit this vulnerability by executing a 
  specific CLI command that includes crafted arguments. A successful exploit 
  could allow the attacker to execute commands on the underlying OS with root 
  privileges.
