title: FreeRDP before 3.29.0 contains a null pointer dereference vulnerability 
  in smartcard cache request decoders that accept NULL NDR pointers for 
  LookupName in SCARD_IOCTL_READCACHEA and SCARD_IOCTL_WRITECACHEA operations. 
  When smartcard emulation is enabled, attackers can send crafted smartcard 
  cache requests with NULL lookup-name pointers to trigger strlen() on a null 
  pointer, causing client process termination.
