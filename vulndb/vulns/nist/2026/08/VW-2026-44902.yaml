title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  prevent peer transport count overflow\n\nsctp_assoc_add_peer() increments the association's
  16-bit transport_count\nfor every new unique peer. Adding the 65,536th transport
  wraps the count to\nzero.\n\nSCTP sock_diag uses transport_count to reserve the
  INET_DIAG_PEERS payload,\nthen copies one sockaddr_storage for every entry in transport_addr_list.\n\
  After the wrap, a diagnostic dump reserves an empty payload and writes\n8 MiB of
  peer addresses past the skb tail.\n\nReject a new unique peer when transport_count
  has reached U16_MAX. Perform\nthe check after the existing-peer lookup so a duplicate
  address continues\nto return its existing transport at the limit."
