title: Grav before 2.0.16 contains a path traversal vulnerability in 
  MediaUploadTrait::deleteFile() that allows authenticated users with media 
  management permissions to delete arbitrary files by supplying filenames with 
  directory traversal sequences. The method validates only the basename portion 
  of the filename while preserving unvalidated directory paths containing ../ 
  sequences that are passed to unlink(), enabling deletion of files outside the 
  intended media storage directory.
