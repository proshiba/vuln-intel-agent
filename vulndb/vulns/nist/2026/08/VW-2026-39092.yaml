title: A vulnerability was determined in GL-iNet GL-MT3000 up to 4.4.5. The 
  affected element is the function wg-server.generate_publickey of the file 
  /cgi-bin/glc of the component wg-server.so Native Plugin. Executing a 
  manipulation of the argument private_key can lead to command injection. The 
  attack may be launched remotely. The exploit has been publicly disclosed and 
  may be utilized. The vendor was contacted early about this disclosure and 
  confirmed the existence of the vulnerability.
