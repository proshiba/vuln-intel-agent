title: "In the Linux kernel, the following vulnerability has been resolved:\n\naccel:
  ethosu: Fix element size accounting for cmd stream validation\n\nThere are 2 issues
  with the element size handling in the command stream\nvalidation which result in
  too small of a size calculated when the\nelement size is 16/32/64 bits.\n\nFor NHWC
  format, the element size is simply missing from the\ncalculation.\n\nThe bitfield
  for the element size is different between IFM/IFM2 and\nOFM. IFM and IFM2 encode
  the precision in parameter bits 2:3, while OFM\nuses bits 1:2."
