title: A vulnerability was detected in Lspace-io lspace-server up to 
  79f02fe5aa8970b210a6a05cf097155f8d9ffd71. This issue affects the function 
  fileExists/readFile/writeFile/deleteFile of the file src/core/repository.ts of
  the component Repositories File API. Performing a manipulation of the argument
  filePath results in path traversal. The attack is only possible with local 
  access. Continious delivery with rolling releases is used by this product. 
  Therefore, no version details of affected nor updated releases are available. 
  The project was informed of the problem early through an issue report but has 
  not responded yet.
