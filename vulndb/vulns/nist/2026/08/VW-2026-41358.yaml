title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrop_monitor:
  fix size calculations for 64-bit attributes\n\nnet_dm_packet_report_fill() and net_dm_hw_packet_report_fill()
  use\nnla_put_u64_64bit() to append 64-bit attributes (NET_DM_ATTR_PC and\nNET_DM_ATTR_TIMESTAMP).\n\
  \nOn 32-bit architectures without CONFIG_HAVE_EFFICIENT_UNALIGNED_ACCESS,\nnla_put_u64_64bit()
  may append a 4-byte NET_DM_ATTR_PAD attribute for\n64-bit alignment.\n\nHowever,
  net_dm_packet_report_size() and net_dm_hw_packet_report_size()\nused nla_total_size(sizeof(u64))
  instead of nla_total_size_64bit(sizeof(u64)),\nbudgeting 12 bytes instead of up
  to 16 bytes.\n\nThis under-estimation of SKB size can lead to an skb_over_panic()
  when\n__nla_reserve() or skb_put() is subsequently called.\n\nFix this by using
  nla_total_size_64bit(sizeof(u64)) in both size calculations."
