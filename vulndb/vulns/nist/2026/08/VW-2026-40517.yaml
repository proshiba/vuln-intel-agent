title: A flaw was found in udisks2. A local attacker with an active console 
  session can exploit insufficient authorization checking on the 'as-user' 
  option in the org.freedesktop.UDisks2.Filesystem.Mount() D-Bus method. This 
  allows the attacker to spoof the 'as-user' parameter, mounting filesystems on 
  behalf of arbitrary users, including privileged accounts. This can lead to 
  local privilege escalation through mount point injection and manipulation of 
  the mount namespace visible to privileged users.
