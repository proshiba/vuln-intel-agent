title: SiYuan before v3.7.3 contains a SQL injection vulnerability in the 
  /api/filetree/searchDocs endpoint, where the caller-supplied keyword parameter
  is concatenated directly into SQL statements with no escaping or parameter 
  binding. The endpoint is reachable by a publish RoleReader token, or 
  unauthenticated when publish mode is enabled with Publish.Auth.Enable set to 
  false. Because the statement executes on a read-write SQLite handle via a 
  driver that supports stacked (semicolon-separated) statements, an attacker can
  read and modify database content across all cleartext (non-encrypted) 
  notebooks on the instance.
