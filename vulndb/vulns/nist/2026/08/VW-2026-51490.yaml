title: An attacker that has valid credentials can submit a Sieve script 
  containing an extreme numeric literal, which causes an out-of-bounds write 
  when the ManageSieve service compiles the script. This causes memory 
  corruption and an observed crash of the ManageSieve process, resulting in 
  denial of service for script management. This might be able to be used for 
  remote code execution. Disable the ManageSieve service if users do not need 
  remote Sieve script management. Update to non-vulnerable version. No publicly 
  available exploits are known.
