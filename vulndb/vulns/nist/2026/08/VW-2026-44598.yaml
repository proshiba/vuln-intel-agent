title: "In the Linux kernel, the following vulnerability has been resolved:\n\nipv6:
  ioam: fix type confusion of dst_entry\n\nIOAM uses a dummy dst_entry(null_dst) to
  mark that the destination should\nnot be changed after the transformation. This
  dst is stored in the IOAM lwt\nstate and may be passed to dst_cache_set_ip6().\n\
  \nHowever, the IPv6 dst cache path eventually calls rt6_get_cookie(), which\ntreats
  the dst_entry as part of a struct rt6_info. Since the null_dst was\nembedded directly
  as a struct dst_entry in struct ioam6_lwt, this resulted\nin an invalid cast and
  rt6_get_cookie() reading fields from the wrong\nobject.\n\nIn practice, the wrong
  cookie is not used while dst->obsolete is zero, but\nrt6_get_cookie() may also access
  per-cpu value when rt->sernum is\nzero. In this case, rt->sernum aliases ioam6_lwt::cache::reset_ts,
  which\ncan become zero, making this a potential invalid pointer access.\n\nFix this
  by embedding a full struct rt6_info for the dummy IPv6 route and\npassing its dst
  member to the d"
