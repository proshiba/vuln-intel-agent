title: "In the Linux kernel, the following vulnerability has been resolved:\n\nntfs:
  validate resident index root values on lookup\n\nResident $INDEX_ROOT values carry
  index header fields that callers\nconsume after lookup. Some callers already validate
  parts of the layout\nbefore walking entries, but those checks are scattered and
  do not cover\nall root header invariants, such as entries_offset alignment and lower\n\
  bound, index_length, and allocated_size consistency.\n\nThe resident root resize
  paths now keep these header fields consistent\nwhile the value size changes: ntfs_ir_truncate()
  lowers\nindex.allocated_size before shrinking the resident value, and\nntfs_ir_reparent()
  grows the resident value before publishing a larger\nroot header. Lookup-time validation
  can therefore cover these invariants\nwithout tripping over the driver's own resize
  paths.\n\nAdd $INDEX_ROOT to the minimum resident value size table and validate
  the\nresident index header fields before returning the attribute from lookup.\n\
  Require "
