title: "In the Linux kernel, the following vulnerability has been resolved:\n\nusb:
  gadget: f_ncm: Use unsigned int for ndp_index\n\nThe variable ndp_index is declared
  as a signed integer, but it stores\nthe return value of get_ncm(), which is unsigned.\n\
  \nA malicious host can supply a large offset that overflows the signed\nndp_index,
  making it negative. Because ndp_index is compared against\nunsigned bounds, this
  negative value bypasses sanity checks and leads\nto an out-of-bounds read when calculating
  the address of the NDP\nblock (ntb_ptr + ndp_index).\n\nFix this by changing ndp_index
  to unsigned int to ensure consistent\nunsigned comparisons throughout the function."
