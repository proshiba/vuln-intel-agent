title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  xt_rateest: fix u64 truncation in xt_rateest_mt()\n\nOn links faster than ~34 Gbps,
  where byte rate may exceed 2^32-1\n(~ 4.3 GBps), the comparison result becomes incorrect
  because the\ntruncated value no longer reflects the actual estimator rate.\n\nFix
  by changing the local variables to u64."
