title: A vulnerability was found in Open5GS up to 2.7.1. This affects the 
  function hss_ogs_diam_s6a_air_cb/hss_ogs_diam_s6a_ulr_cb of the file 
  src/hss/hss-s6a-path.c of the component Diameter S6a Interface. Performing a 
  manipulation of the argument os.len results in stack-based buffer overflow. It
  is possible to initiate the attack remotely. The exploit has been made public 
  and could be used. Upgrading to version 2.7.2 is able to mitigate this issue. 
  The patch is named e89aa79efe629ae90f59dcdf8847c117d9a7da86. It is suggested 
  to upgrade the affected component.
