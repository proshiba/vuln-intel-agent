title: 'A vulnerability was determined in Open5GS up to 2.7.7. This vulnerability
  affects the function amf_namf_comm_decode_ue_mm_context_list of the file src/amf/namf-handler.c
  of the component AMF. This manipulation of the argument ueContext.mmContextList[*].allowedNssai
  causes memory corruption. The attack can be initiated remotely. The exploit has
  been publicly disclosed and may be utilized. Upgrading to version 2.8.0 is able
  to resolve this issue. Patch name: abf8a836564b966b5141110fc25ed413c4f17522. It
  is recommended to upgrade the affected component.'
