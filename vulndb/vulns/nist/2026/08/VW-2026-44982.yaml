title: "In the Linux kernel, the following vulnerability has been resolved:\n\nhwmon:
  (nct6775-core) Prevent access to unsupported weight registers\n\nSashiko reports:\n\
  \nDuring initialization of the nct6116 chip, the driver sets data->pwm_num\nto 5.
  However, it assigns several NCT6106 register arrays (such as\nNCT6106_REG_WEIGHT_DUTY_STEP,
  NCT6106_REG_WEIGHT_TEMP_SEL, and\nNCT6106_REG_WEIGHT_TEMP_*) to data->REG_PWM and
  data->REG_WEIGHT_TEMP.\nThese arrays only contain 3 elements.\n\nIn nct6775_update_pwm(),
  the driver iterates up to data->pwm_num. If\ndata->has_pwm has bits 3 or 4 set (which
  is structurally possible for\nnct6116), the loop attempts to read elements at index
  3 and 4 from these\n3-element arrays. This results in a global out-of-bounds read,
  which can\nbe caught by KASAN.\n\nFurthermore, the driver uses these garbage out-of-bounds
  values as\nhardware register addresses for subsequent read and write operations.
  This\nleads to invalid hardware register access, potentially causing hardware\n\
