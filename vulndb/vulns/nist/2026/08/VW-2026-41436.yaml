title: "In the Linux kernel, the following vulnerability has been resolved:\n\nUSB:
  serial: io_edgeport: cap received transmit credits\n\nThe interrupt-status packet
  reports transmit credits returned by the\ndevice. edge_interrupt_callback() adds
  the 16-bit value to txCredits\nwithout checking maxTxCredits.\n\nedge_write() uses
  txCredits minus the software FIFO count as the amount\nof data that fits. Since
  the FIFO is allocated with maxTxCredits bytes,\ntxCredits exceeding maxTxCredits
  can cause OOB write in ring buffer.\n\nCap accumulated credits at maxTxCredits.
  Conforming devices should never\nhit the cap."
