title: NLTK versions before 3.10.2 contain a symlink-based sandbox bypass in 
  FramenetCorpusReader that allows attackers to read arbitrary XML files outside
  the corpus root. Attackers can place symlinks with names containing no path 
  separators inside the corpus subdirectory, which pass the path validation 
  guard and are resolved to files outside the intended corpus root when accessed
  via frame_by_name(), _lu_file(), or doc() methods.
