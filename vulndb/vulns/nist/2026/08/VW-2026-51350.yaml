title: "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
  ims-pcu - fix potential infinite loop in CDC union descriptor parsing\n\nThe driver
  parses CDC union descriptors in ims_pcu_get_cdc_union_desc()\nby iterating through
  the extra descriptor data. However, it does not\nverify that the bLength of each
  descriptor is at least 2. A malicious\ndevice could provide a descriptor with bLength
  = 0, leading to an\ninfinite loop in the driver.\n\nAdd a check to ensure bLength
  is at least 2 before proceeding with\nparsing."
