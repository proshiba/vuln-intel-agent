title: Django REST framework is a powerful and flexible toolkit for building Web
  APIs. Prior to 3.17.2, Django REST Framework's rest_framework/renderers.py 
  AdminRenderer.render() uses override_method() to simulate GET and directly 
  invokes view.get() without view.check_permissions() while rendering an invalid
  write request, allowing a 400 Bad Request HTML response to disclose data from 
  a GET representation that the requester is not permitted to access. This issue
  is fixed in version 3.17.2.
