title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate session id and tree id in compound request\n\n`smb2_get_msg()` in smb2_get_ksmbd_tcon()
  and smb2_check_user_session()\nwill always return the first request smb2 header
  in a compound request.\nif `SMB2_TREE_CONNECT_HE` is the first command in compound
  request, will\nreturn 0, i.e. The tree id check is skipped.\nThis patch use ksmbd_req_buf_next()
  to get current command in compound."
