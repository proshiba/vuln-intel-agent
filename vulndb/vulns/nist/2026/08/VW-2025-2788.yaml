title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  gso: fix panic on frag_list with mixed head alloc types\n\nSince commit 3dcbdb134f32
  (\"net: gso: Fix skb_segment splat when\nsplitting gso_size mangled skb having linear-headed
  frag_list\"), it is\nallowed to change gso_size of a GRO packet. However, that commit
  assumes\nthat \"checking the first list_skb member suffices; i.e if either of the\n\
  list_skb members have non head_frag head, then the first one has too\".\n\nIt turns
  out this assumption does not hold. We've seen BUG_ON being hit\nin skb_segment when
  skbs on the frag_list had differing head_frag with\nthe vmxnet3 driver. This happens
  because __netdev_alloc_skb and\n__napi_alloc_skb can return a skb that is page backed
  or kmalloced\ndepending on the requested size. As the result, the last small skb
  in\nthe GRO packet can be kmalloced.\n\nThere are three different locations where
  this can be fixed:\n\n(1) We could check head_frag in GRO and not allow GROing skbs
  with\n    diffe"
