title: An issue was discovered in the resolv gem before 0.7.2 for Ruby. 
  Resolv::DNS::MessageEncoder wrote a DNS label's length into a single octet 
  without checking its range. A label longer than 255 octets had its length 
  stored modulo 256 but the label data was written unchanged, and thus the bytes
  on the wire described a different name than the one the application asked to 
  encode. RFC 1035 section 2.3.4 limits a label to 63 octets, and the two high 
  bits of the length octet are reserved for compression pointers. put_string 
  packed the length with put_pack("C", d.length) and put_label used it for 
  labels, and thus any value from 0 to 255 could end up as a label length octet,
  including the reserved 0x40-0xBF range and the 0xC0-0xFF pointer range. 
  Resolv::DNS::Name.create did not check per-label or total name length either, 
  and thus an attacker-controlled hostname reached the encoder unchanged. An 
  application that resolves an attacker-controlled hostname sends a query whose 
  wire bytes name a domai
