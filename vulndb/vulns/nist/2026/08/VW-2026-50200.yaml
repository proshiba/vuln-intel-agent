title: "A stack-based buffer overflow vulnerability exists in the Dia diagram editor
  when processing Network Bus objects from Dia XML project files.\n\nIn objects/network/bus.c,
  bus_load() reads the number of bus handles from the file attribute \"bus_handles\"\
  \ using attribute_num_data() without validating an upper bound:\n\n    bus->num_handles
  = attribute_num_data(attr);\n\nWhen a bus handle is subsequently moved, bus_handle_moved()
  allocates two temporary arrays on the stack:\n\n    parallel = (real *)g_alloca(num_handles
  * sizeof(real));\n    perp = (real *)g_alloca(num_handles * sizeof(real));\n\nBecause
  num_handles is fully attacker-controlled via the project file, sufficiently large
  values (for example 262144 or higher) cause g_alloca() to consume more stack space
  than the default thread stack limit (typically 8 MB on Linux), resulting in stack
  overflow, SIGSEGV, and potential stack frame / return-address corruption.\n\nAn
  attacker can embed a Bus object with an excessive bus_handles count in a malicio"
