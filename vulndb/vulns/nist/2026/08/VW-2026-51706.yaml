title: The MongoSQL Transition Readiness Tool writes query text and user names 
  read from BI Connector log files into its generated HTML report without 
  encoding them for that output context. A user able to issue queries through 
  the BI Connector can influence log content so that markup supplied in a query 
  is interpreted by the browser when an operator later generates and opens the 
  report, which may disclose other users' logged query text and user names to an
  external party or present misleading content to the operator. Generating a 
  report over logs containing the affected entries and opening that report in a 
  browser is required.
