title: The Seraphinite Accelerator plugin for WordPress is vulnerable to 
  Reflected Cross-Site Scripting via the 'seraph_accel_prep' parameter in 
  versions up to, and including, 2.29.15. This is due to the 
  CacheExtractPreparePageParams() function using PHP's loose inequality operator
  (!=) to compare the expected HMAC string against the JSON-decoded 'nonce' 
  value — supplying the JSON boolean true causes any non-empty HMAC string to 
  compare as loosely equal, bypassing the signature check — combined with 
  insufficient output escaping in the _CbContentFinishSkip() function, which 
  concatenates the attacker-controlled 'selfTest' field directly into the HTML 
  response body. This makes it possible for unauthenticated attackers to inject 
  arbitrary web scripts in pages that execute if they can successfully trick a 
  user into performing an action such as clicking on a specially crafted link.
