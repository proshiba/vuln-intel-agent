title: LeafWiki is a self-hosted wiki. Versions 0.3.0 through 0.10.0 have a path
  traversal vulnerability in LeafWiki’s asset rename functionality. An 
  authenticated user with editor permissions could move files that are 
  accessible to the LeafWiki server process into a page’s asset directory. This 
  could allow sensitive local files, such as the application database, to become
  downloadable as page assets. Users should update to version 0.10.1 or greater.
  As an additional mitigation, operators should ensure that the LeafWiki process
  runs with the least privileges necessary and does not have filesystem access 
  to sensitive files outside the application’s required directories. Until a 
  patch is applied, operators may reduce risk by restricting editor access to 
  trusted users only and by limiting the filesystem permissions of the LeafWiki 
  process.
