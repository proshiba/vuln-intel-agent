title: Wazuh 4.0.0 before 4.14.6 contains a path traversal vulnerability that 
  allows authenticated cluster peers to delete arbitrary directory contents by 
  supplying a traversal-shaped node name in the cluster hello payload without 
  validation. Attackers holding a valid cluster Fernet key can craft a malicious
  node name and disconnect, triggering the master's peer cleanup routine to 
  remove the contents of arbitrary directories within the Wazuh installation 
  path writable by the wazuh user.
