title: "Exposure of Sensitive Information to an Unauthorized Actor vulnerability in
  ash-project ash_cloak allows anyone with access to logs, error trackers, or crash
  reports, or anyone who can trigger a validation error, to recover the plaintext
  of a field the library encrypts.\n\nAshCloak.Transformers.SetUpEncryption removes
  each cloaked attribute from the action's accept list and adds an action argument
  that carries the plaintext into the encryption change. That argument is built with
  sensitive?: attr.sensitive?, inheriting the flag from the source attribute, so a
  cloaked attribute declared without sensitive? true produces a non-sensitive argument.
  It is the only place the cleartext value lives, and the one place Ash will not redact:
  it appears verbatim in inspect(changeset), Ash.Error.Invalid and validation error
  messages, telemetry, :sys dumps, and error-tracker payloads. The generated encrypted
  attribute and decrypt calculation are already hardcoded sensitive.\n\nThis issue
  affects ash_cloak:"
