title: "In the Linux kernel, the following vulnerability has been resolved:\n\nBluetooth:
  hci_sync: Fix advertising data UAFs\n\nhci_find_adv_instance() returns an adv_info
  pointer that is valid only\nwhile hdev->lock is held.  The advertising command-sync
  paths perform\ninstance lookups without that lock and, in some cases, retain the
  pointer\nwhile waiting for a controller response.\n\nAn advertising termination
  event can therefore interleave as follows:\n\n  hci_cmd_sync_work              \
  \   hci_rx_work\n  hci_find_adv_instance()\n  __hci_cmd_sync_status()\n    wait
  for controller reply       hci_dev_lock()\n                                    hci_remove_adv_instance()\n\
  \                                      kfree(adv)\n  adv->scan_rsp_changed = false\n\
  \nKASAN reported:\n\n  BUG: KASAN: slab-use-after-free in hci_set_ext_scan_rsp_data_sync+0x2e1/0x300\n\
  \  Write of size 1 at addr ffff88810a45d21d by task kworker/u17:0/88\n  Workqueue:
  hci0 hci_cmd_sync_work\n  Call Trace:\n   hci_set_ext_scan_rsp_data_sync+0x2e1/0x300"
