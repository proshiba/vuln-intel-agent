title: A vulnerability in the Sourcefire tunnel control channel protocol in 
  Cisco Firepower System Software running on Cisco Firepower Threat Defense 
  (FTD) sensors could allow an authenticated, local attacker to execute specific
  CLI commands with root privileges on the Cisco Firepower Management Center 
  (FMC), or through Cisco FMC on other Firepower sensors and devices that are 
  controlled by the same Cisco FMC. To send the commands, the attacker must have
  root privileges for at least one affected sensor or the Cisco FMC. The 
  vulnerability exists because the affected software performs insufficient 
  checks for certain CLI commands, if the commands are executed via a Sourcefire
  tunnel connection. An attacker could exploit this vulnerability by 
