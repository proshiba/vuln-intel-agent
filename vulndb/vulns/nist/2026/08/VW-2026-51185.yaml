title: Improper neutralization of delimiters in connection-URL construction 
  allows connection-option injection in the MongoDB C# Driver. When an 
  application passes untrusted text into the driver's connection-URL builder and
  round-trips the builder back into a client configuration, the untrusted text 
  is serialized without neutralizing the URL/option delimiters and is then 
  re-parsed as authoritative connection options. A low-privileged user of such 
  an application can thereby introduce or suppress security-relevant connection 
  settings.
