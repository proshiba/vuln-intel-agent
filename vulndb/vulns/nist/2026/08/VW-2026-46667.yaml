title: 'Vulnerability in the Oracle Hyperion Calculation Manager product of Oracle
  Hyperion (component: Security).   The supported version that is affected is 11.2.25.0.000.
  Easily exploitable vulnerability allows unauthenticated attacker with access to
  the physical communication segment attached to the hardware where the Oracle Hyperion
  Calculation Manager executes to compromise Oracle Hyperion Calculation Manager.  Successful
  attacks of this vulnerability can result in  unauthorized access to critical data
  or complete access to all Oracle Hyperion Calculation Manager accessible data. CVSS
  3.1 Base Score 6.5 (Confidentiality impacts).  CVSS Vector: (CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N).'
