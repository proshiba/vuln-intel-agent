title: Runtipi is a personal homeserver orchestrator. In 4.10.0 and earlier, 
  Runtipi accepts symbolic links from an attacker-controlled backup archive and 
  copies them into live application paths during the backup restore flow. An 
  authenticated attacker can plant user-config/app.env as a symlink to an 
  arbitrary reachable path and then send PUT /api/user-config/demoapp3:_user 
  with attacker-controlled appEnv content. FilesystemService.writeTextFile() 
  follows the planted link, allowing content to be written outside the intended 
  restore and user-config directory boundary with Runtipi process permissions. 
  This issue is fixed in version 4.10.1.
