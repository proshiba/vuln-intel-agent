title: A security vulnerability has been detected in sonos tract up to 0.23.4. 
  This impacts the function Tensor::from_raw_dt_align of the file 
  data/src/tensor.rs of the component ONNX Initializer Loader. Such manipulation
  leads to incorrect calculation of buffer size. The attack may be launched 
  remotely. The exploit has been disclosed publicly and may be used. The name of
  the patch is 66b10bda8895f4bfaf8c205361f0125cdf51f99b. It is best practice to 
  apply a patch to resolve this issue.
