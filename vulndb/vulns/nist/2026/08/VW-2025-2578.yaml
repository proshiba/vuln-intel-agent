title: "In the Linux kernel, the following vulnerability has been resolved:\n\nALSA:
  hda: cs35l41: Fix NULL pointer dereference in cs35l41_get_acpi_mute_state()\n\n\
  Return value of a function acpi_evaluate_dsm() is dereferenced  without\nchecking
  for NULL, but it is usually checked for this function.\n\nacpi_evaluate_dsm() may
  return NULL, when acpi_evaluate_object() returns\nacpi_status other than ACPI_SUCCESS,
  so add a check to prevent the crach.\n\nFound by Linux Verification Center (linuxtesting.org)
  with SVACE."
