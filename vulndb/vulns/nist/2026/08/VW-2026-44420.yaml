title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnetfilter:
  nf_nat_sip: reload possible stale data pointer\n\nquoting sashiko:\n ------------------------------------------------------------------------\n\
  \ [..] noticed a potential memory bug and header corruption involving the\n SIP
  NAT helper.\n\n In net/netfilter/nf_nat_sip.c:nf_nat_sip():\n\tif (skb_ensure_writable(skb,
  skb->len)) {\n\t\tnf_ct_helper_log(skb, ct, \"cannot mangle packet\");\n\t\treturn
  NF_DROP;\n\t}\n\tuh = (void *)skb->data + protoff;\n\tuh->dest = ct_sip_info->forced_dport;\n\
  \tif (!nf_nat_mangle_udp_packet(skb, ct, ctinfo, protoff,\n\t\t\t\t      0, 0, NULL,
  0)) {\n\n If a cloned or fragmented SKB is reallocated by skb_ensure_writable(),
  the\n old data buffer is freed. However, nf_nat_sip() fails to update *dptr to\n\
  \ point to the new buffer.\n\n It also appears to use nf_nat_mangle_udp_packet()
  on what could be a TCP\n packet, which would overwrite the sequence number with
  a checksum update.\n -----------------------------------------"
