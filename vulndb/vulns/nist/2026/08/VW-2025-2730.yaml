title: "In the Linux kernel, the following vulnerability has been resolved:\n\npowerpc/pseries/iommu:
  IOMMU incorrectly marks MMIO range in DDW\n\nPower Hypervisor can possibily allocate
  MMIO window intersecting with\nDynamic DMA Window (DDW) range, which is over 32-bit
  addressing.\n\nThese MMIO pages needs to be marked as reserved so that IOMMU doesn't
  map\nDMA buffers in this range.\n\nThe current code is not marking these pages correctly
  which is resulting\nin LPAR to OOPS while booting. The stack is at below\n\nBUG:
  Unable to handle kernel data access on read at 0xc00800005cd40000\nFaulting instruction
  address: 0xc00000000005cdac\nOops: Kernel access of bad area, sig: 11 [#1]\nLE PAGE_SIZE=64K
  MMU=Hash SMP NR_CPUS=2048 NUMA pSeries\nModules linked in: af_packet rfkill ibmveth(X)
  lpfc(+) nvmet_fc nvmet nvme_keyring crct10dif_vpmsum nvme_fc nvme_fabrics nvme_core
  be2net(+) nvme_auth rtc_generic nfsd auth_rpcgss nfs_acl lockd grace sunrpc fuse
  configfs ip_tables x_tables xfs libcrc32c dm_service_time ibmvfc(X"
