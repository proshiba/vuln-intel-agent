title: "In the Linux kernel, the following vulnerability has been resolved:\n\nASoC:
  SOF: topology: validate vendor array size before parsing\n\nsof_parse_token_sets()
  reads array->size while iterating over topology\nprivate data. The loop condition
  only checks that some data remains, so a\nmalformed topology with a truncated trailing
  vendor array can make the\nparser read the size field before a full vendor-array
  header is available.\n\nValidate that the remaining private data contains a complete\n\
  snd_soc_tplg_vendor_array header before reading array->size.\n\nThe declared array
  size check also needs to remain signed. asize is an int,\nbut sizeof(*array) has
  type size_t, so comparing them directly promotes\nnegative asize values to unsigned
  and lets them pass the check,\nas reported in the stable review thread reference
  below.\n\nCast sizeof(*array) to int when validating the declared array size. This\n\
  rejects negative, zero and otherwise too-small sizes before the parser\ndispatches
  to the tuple-specific code."
