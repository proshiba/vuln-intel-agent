title: "In the Linux kernel, the following vulnerability has been resolved:\n\ncan:
  peak_usb: peak_usb_start(): fix double free of transfer buffer on URB submit error\n\
  \nIn peak_usb_start(), each RX URB transfer buffer is allocated with kmalloc()\n\
  and the URB is flagged URB_FREE_BUFFER so that the final usb_free_urb() also\nfrees
  the transfer buffer.\n\nIf usb_submit_urb() fails, the error path frees the buffer
  explicitly with\nkfree(buf) and then calls usb_free_urb(urb). Because URB_FREE_BUFFER
  is set,\nusb_free_urb() -> urb_destroy() frees the same buffer a second time, a
  double\nfree of the transfer buffer.\n\n  BUG: KASAN: double-free in usb_free_urb.part.0+0x91/0xb0\n\
  \  Free of addr ffff8881069ccb80 by task trigger.sh/285\n\n  Call Trace:\n   kfree+0x113/0x3c0\n\
  \   usb_free_urb.part.0+0x91/0xb0\n\nDrop the redundant kfree(buf); usb_free_urb()
  already releases the transfer\nbuffer. This mirrors commit 03819abbeb11 (\"net:
  usb: lan78xx: Fix double free\nissue with interrupt buffer allocation\")."
