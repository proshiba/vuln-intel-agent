title: "In the Linux kernel, the following vulnerability has been resolved:\n\ngpio:
  pch: use raw_spinlock_t for the register lock\n\npch_irq_type() is registered as
  the irq_chip .irq_set_type callback and\ntakes chip->spinlock with spin_lock_irqsave().\
  \  This callback is reached\nfrom __setup_irq() -> __irq_set_trigger() -> chip->irq_set_type()
  while\nthe caller holds desc->lock, a raw_spinlock_t, with hardirqs disabled.\n\
  That context is not sleepable, but on PREEMPT_RT a regular spinlock_t is\nan rtmutex-backed
  sleeping lock, so acquiring it there is invalid.\n\nThis was confirmed on a PREEMPT_RT
  kernel with lockdep\n(PROVE_RAW_LOCK_NESTING and DEBUG_ATOMIC_SLEEP).  A grounded
  PoC mirrored\npch_irq_type()'s locking and drove it through the real genirq carrier\n\
  irq_set_irq_type() -> __irq_set_trigger() -> chip->irq_set_type(), i.e.\nthe same
  __irq_set_trigger() edge that __setup_irq() takes for a\nrequested IRQ.  With the
  original spin_lock_irqsave() edge lockdep\nreported an invalid wait context, immediately "
