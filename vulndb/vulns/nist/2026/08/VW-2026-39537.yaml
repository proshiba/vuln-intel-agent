title: A vulnerability was determined in yeqifu warehouse up to 
  aaf29962ba407d22d991781de28796ee7b4670e4. This issue affects some unknown 
  processing of the file 
  src/main/java/com/yeqifu/sys/controller/FileController.java. This manipulation
  of the argument path causes path traversal. It is possible to initiate the 
  attack remotely. The exploit has been publicly disclosed and may be utilized. 
  This product is using a rolling release to provide continious delivery. 
  Therefore, no version details for affected nor updated releases are available.
  The vendor was contacted early about this disclosure but did not respond in 
  any way.
