title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/page_reporting:
  use system_freezable_wq to fix UAF during suspend\n\nDuring PM freeze (e.g.  S3
  suspend or S4 hibernation), device drivers like\nvirtio_balloon reset their underlying
  virtio devices and delete their\nvirtqueues via vdev->config->del_vqs().\n\nHowever,
  page reporting work (page_reporting_process) was scheduled on the\nglobal system_wq.\
  \  Because system_wq lacks the WQ_FREEZABLE flag, the PM\nfreezer skips it, leaving
  page_reporting_process active during suspend.\n\nIf pages are freed into the buddy
  allocator while suspending (for example,\nwhen core MM invokes the balloon shrinker
  during S4 hibernation image\nsaving), page reporting triggers virtballoon_free_page_report()
  on deleted\nvirtqueues, resulting in a Use-After-Free / General Protection Fault:\n\
  \n    [  196.795226] general protection fault, probably for non-canonical address
  0xaa1436fe70dae6df: 0000 [#1] SMP NOPTI\n    [  196.825967] Workqueue: events page_r"
