title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  VMX: Bury Intel PT virtualization (guest/host mode) behind CONFIG_BROKEN\n\nHide
  KVM's pt_mode module param behind CONFIG_BROKEN, i.e. disable support\nfor virtualizing
  Intel PT via guest/host mode unless BROKEN=y.  There are\nmyriad bugs in the implementation,
  some of which are fatal to the guest,\nand others which put the stability and health
  of the host at risk.\n\nFor guest fatalities, the most glaring issue is that KVM
  fails to ensure\ntracing is disabled, and *stays* disabled prior to VM-Enter, which
  is\nnecessary as hardware disallows loading (the guest's) RTIT_CTL if tracing\n\
  is enabled (enforced via a VMX consistency check).  Per the SDM:\n\n  If the logical
  processor is operating with Intel PT enabled (if\n  IA32_RTIT_CTL.TraceEn = 1) at
  the time of VM entry, the \"load\n  IA32_RTIT_CTL\" VM-entry control must be 0.\n\
