title: "In the Linux kernel, the following vulnerability has been resolved:\n\nudf:
  Do not bother merging very long extents\n\nWhen merging very long extents we try
  to push as much length as possible\nto the first extent. However this is unnecessarily
  complicated and not\nreally worth the trouble. Furthermore there was a bug in the
  logic\nresulting in corrupting extents in the file as syzbot reproducer shows.\n\
  So just don't bother with the merging of extents that are too long\ntogether."
