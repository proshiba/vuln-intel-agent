title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmm/hugetlb:
  fix hugetlb vs. core-mm PT locking\n\nWe recently made GUP's common page table walking
  code to also walk hugetlb\nVMAs without most hugetlb special-casing, preparing for
  the future of\nhaving less hugetlb-specific page table walking code in the codebase.\
  \ \nTurns out that we missed one page table locking detail: page table locking\n\
  for hugetlb folios that are not mapped using a single PMD/PUD.\n\nAssume we have
  hugetlb folio that spans multiple PTEs (e.g., 64 KiB\nhugetlb folios on arm64 with
  4 KiB base page size).  GUP, as it walks the\npage tables, will perform a pte_offset_map_lock()
  to grab the PTE table\nlock.\n\nHowever, hugetlb that concurrently modifies these
  page tables would\nactually grab the mm->page_table_lock: with USE_SPLIT_PTE_PTLOCKS,
  the\nlocks would differ.  Something similar can happen right now with hugetlb\n\
  folios that span multiple PMDs when USE_SPLIT_PMD_PTLOCKS.\n\nThis issue can be
