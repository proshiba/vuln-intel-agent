title: "In the Linux kernel, the following vulnerability has been resolved:\n\nblk-mq:
  cancel blk-mq dispatch work in both blk_cleanup_queue and disk_release()\n\nFor
  avoiding to slow down queue destroy, we don't call\nblk_mq_quiesce_queue() in blk_cleanup_queue(),
  instead of delaying to\ncancel dispatch work in blk_release_queue().\n\nHowever,
  this way has caused kernel oops[1], reported by Changhui. The log\nshows that scsi_device
  can be freed before running blk_release_queue(),\nwhich is expected too since scsi_device
  is released after the scsi disk\nis closed and the scsi_device is removed.\n\nFixes
  the issue by canceling blk-mq dispatch work in both blk_cleanup_queue()\nand disk_release():\n\
  \n1) when disk_release() is run, the disk has been closed, and any sync\ndispatch
  activities have been done, so canceling dispatch work is enough to\nquiesce filesystem
  I/O dispatch activity.\n\n2) in blk_cleanup_queue(), we only focus on passthrough
  request, and\npassthrough request is always explicitly allocated & freed "
