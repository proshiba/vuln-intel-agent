title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmei:
  bus: access mei_device under device_lock on cleanup\n\nFix couple of problems in
  mei_cl_bus_dev_release():\n\nmei_cl_flush_queues() is running without lock.\nbus->file_list
  access after mei_dev_bus_put(bus) can become a\nuse-after-free if this was the last
  reference to bus.\n\nProtect queues cleanup and WARN traversal by device lock there\n\
  to avoid the concurrent access problems.\nMove WARN traversal before mei_dev_bus_put(bus).\n\
  \nThis file uses bus variable name for mei_device, adjust\ncode of mei_cl_bus_dev_release()
  to use bus variable too."
