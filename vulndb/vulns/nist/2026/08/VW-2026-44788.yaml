title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  fix BPF_PROG_QUERY OOB write and cgroup backward compat\n\nBPF_PROG_QUERY writes
  back the 'query.revision' field unconditionally to\nuserspace. If userspace passes
  a smaller 'bpf_attr' structure (e.g. 40\nbytes, which was the layout before the
  addition of 'query.revision'),\nthe kernel performs an out-of-bounds write.\n\n\
  Fix this by propagating the user-provided attribute size 'uattr_size'\ndown to the
  cgroup query handlers, and conditionally skipping writing\nthe revision field to
  userspace when the provided buffer size is\ninsufficient.\n\nquery.revision in bpf_mprog_query
  is structurally identical to the\ncgroup case: a late tail field, written unconditionally.\n\
  \nBut the backward-compat hazard is not the same.\n\nThe min-historical-size test
  is per command, and bpf_mprog_query only\nserves attach types that were born with
  revision in the struct:\n\n- tcx_prog_query -> BPF_TCX_INGRESS/EGRESS\n- netkit_prog_query
  -> BPF_NETKIT_PRIM"
