title: "In the Linux kernel, the following vulnerability has been resolved:\n\nvirtio_net:
  Fix error unwinding of XDP initialization\n\nWhen initializing XDP in virtnet_open(),
  some rq xdp initialization\nmay hit an error causing net device open failed. However,
  previous\nrqs have already initialized XDP and enabled NAPI, which is not the\n\
  expected behavior. Need to roll back the previous rq initialization\nto avoid leaks
  in error unwinding of init code.\n\nAlso extract helper functions of disable and
  enable queue pairs.\nUse newly introduced disable helper function in error unwinding
  and\nvirtnet_close. Use enable helper function in virtnet_open."
