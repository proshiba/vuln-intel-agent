title: NLTK before 3.10.3 fails to validate JVM options passed through the 
  per-call options parameter in the java() function, allowing attackers to 
  inject dangerous JVM flags. Attackers can supply malicious options like 
  -agentpath, -javaagent, or @argfile to Stanford wrapper classes to achieve 
  arbitrary code execution.
