title: "Issue summary: When OpenSSL processes QUIC traffic from a peer that repeatedly\n\
  sends ack-eliciting packets while not acknowledging ACK-only responses, the\nQUIC
  stack can retain ACK-only packet metadata for the lifetime of the\nconnection.\n\
  \nImpact summary: A remote peer that can complete a QUIC handshake can\ncause connection-scoped
  memory growth which may lead to Denial of Service\nthrough memory exhaustion, especially
  with sustained traffic or many concurrent\nQUIC connections.\n\nCWE: CWE-770: Allocation
  of Resources Without Limits or Throttling\n\nDescription: When the OpenSSL QUIC
  stack sends an ACK-only packet,\nthere is no requirement by the QUIC protocol that
  the peer will acknowledge\nthat ACK-only packet (i.e. it is itself not ack-eliciting).
  However, the OpenSSL\nimplementation stores the metadata about the ACK frames regardless.\n\
  In and of itself that's ok, but if a malicious peer establishes a connection, and\n\
  then drives the connection such that ACK-only packets are forced from the \nOp"
