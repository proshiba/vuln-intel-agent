title: phpMyFAQ before 4.1.7 contains an authentication bypass vulnerability in 
  SetupController that allows unauthenticated attackers to run database 
  migrations and create configuration backups when maintenance mode is enabled. 
  Attackers can call POST /api/setup/update-database and POST /api/setup/backup 
  endpoints to execute database updates, disable maintenance mode, and extract 
  database credentials from generated ZIP archives.
