title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet/mlx5e:
  Fix HV VHCA stats agent registration race\n\nmlx5e_hv_vhca_stats_create() registers
  the stats agent through\nmlx5_hv_vhca_agent_create(). The helper publishes the agent
  in\nhv_vhca->agents[type] under agents_lock and immediately schedules an\nasynchronous
  control invalidation on the HV VHCA workqueue before\nreturning to mlx5e.\n\nThe
  asynchronous invalidation invokes the control agent's invalidate\ncallback, which
  reads the hypervisor control block and forwards the\ncommand to mlx5e_hv_vhca_stats_control().
  That callback may either:\n\n  - call cancel_delayed_work_sync(&priv->stats_agent.work),
  or\n  - call queue_delayed_work(priv->wq, &sagent->work, sagent->delay).\n\nHowever,
  the delayed_work and priv->stats_agent.agent are only\ninitialized after mlx5_hv_vhca_agent_create()
  returns to mlx5e:\n\n    agent = mlx5_hv_vhca_agent_create(...);   /* publish +
  invalidate */\n    ...\n    priv->stats_agent.agent = agent;          /"
