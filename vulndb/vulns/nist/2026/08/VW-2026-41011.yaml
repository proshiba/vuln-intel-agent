title: Multiple integer overflow and underflow vulnerabilities were found in the
  GStreamer gst-plugins-ugly ASF demuxer (asfdemux) when parsing header objects 
  from crafted ASF, WMV, or WMA files. Insufficient validation of 
  attacker-controlled length and size values can bypass bounds checks and cause 
  out-of-bounds heap reads. This can result in application crash, denial of 
  service, or limited information disclosure when untrusted media is processed.
