title: OpenEXR is the reference implementation and specification for the EXR 
  image format, widely used in the motion picture industry. From version 3.4.0 
  through 3.4.13, a crafted HTJ2K-compressed EXR can crash OpenEXR during normal
  decode. An HTJ2K-compressed EXR whose JPEG 2000 SIZ fields place the first 
  tile outside the visible image can reach invalid tile and codeblock geometry 
  in the vendored OpenJPH AVX2 decoder, causing a stack out-of-bounds write and 
  denial of service. OpenEXR's HTJ2K path validates the decoded codestream 
  dimensions against the EXR chunk size, but it does not reject SIZ 
  image-offset/tile-grid geometry where the first tile does not intersect the 
  image. This issue is fixed in version 3.4.14.
