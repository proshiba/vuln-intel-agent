title: "Tobit Laboratories AG TeamDavid's Webbox 's search functionality accepts a
  “pathnameroot” \nparameter, which can be set to network locations using UNC paths
  (e.g., \n“\\\\Server\\Share”). The server processes these paths without validation,\
  \ \nresulting in outbound connection attempts to attacker-controlled SMB \nservers.
  This enables unauthenticated attackers to trigger the server to\n authenticate to
  arbitrary SMB endpoints, potentially exposing NTLM \nauthentication information
  (such as NTLM hashes). If outbound \nconnections to port 445 (SMB) are permitted,
  attackers can use this to \nconduct SMB relay or credential theft attacks. Exploitation
  of the \n“pathnameroot” parameter is possible without authentication.\n\nThis issue
  affects TeamDavid through Rollout 524."
