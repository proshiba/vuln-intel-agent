title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/syncobj:
  Fix memory leak in drm_syncobj_find_fence()\n\nCommit 18226ba52159 (\"drm/syncobj:
  reject invalid flags in\ndrm_syncobj_find_fence\") forgot to take into account the
  fact that\ndrm_syncobj_find() takes a reference to syncobj and returns early\nwithout
  dropping the reference, leading to memory leaks.\n\nReported by: Sam Spencer <sam.spencer@arm.com>"
