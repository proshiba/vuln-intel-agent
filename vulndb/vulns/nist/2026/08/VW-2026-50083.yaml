title: Kimai before 2.58.0 contains an authentication bypass vulnerability where
  password reset links remain valid after password changes because the LoginLink
  signature covers only the user id, not the password hash. Attackers who 
  intercept or cache a password reset link can use it up to 2 additional times 
  within a 1-hour window to log in as the user even after the legitimate user 
  has changed their password.
