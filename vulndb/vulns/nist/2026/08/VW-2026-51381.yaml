title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/hns:
  Fix memory leak of bonding resources\n\nIn a corner case of concurrent driver removal
  and driver reset,\nbonding resource is first released in hns_roce_hw_v2_exit() during\n\
  driver removal, and then is allocated again in hns_roce_register_device()\nduring
  driver reset. This leads to memory leak because the release\ntiming has already
  passed. This may also lead to a kernel panic\nas below because of the leaked notifier
  callback:\n\nCall trace:\n  0xffffa20fccc04978 (P)\n  raw_notifier_call_chain+0x20/0x38\n\
  \  call_netdevice_notifiers_info+0x60/0xb8\n  netdev_lower_state_changed+0x4c/0xb8\n\
  \nAs Sashiko suggested, the teardown order of bonding resources should\nbe inverted
  to make sure the resources are released when the driver\nis removed."
