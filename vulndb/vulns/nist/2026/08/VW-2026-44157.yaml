title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmmc:
  sdhci-esdhc-imx: fix esdhc_change_pinstate() to allow default state restore\n\n\
  esdhc_change_pinstate() checks for pins_100mhz and pins_200mhz at the\ntop of the
  function and returns -EINVAL if either is not defined. This\nprevents the default
  case from ever being reached, which means devices\nwith a sleep pinctrl state but
  without high-speed pin states (100mhz/\n200mhz) can never restore their default
  pin configuration.\n\nMove the IS_ERR checks for pins_100mhz and pins_200mhz into
  their\nrespective switch cases."
