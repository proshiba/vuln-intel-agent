title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  validate compound request size before reading StructureSize2\n\nWhen ksmbd validates
  a compound (chained) SMB2 request,\nksmbd_smb2_check_message() reads pdu->StructureSize2
  without first\nchecking that the compound element is large enough to contain it.\n\
  StructureSize2 is a 2-byte field at offset 64\n(__SMB2_HEADER_STRUCTURE_SIZE) from
  the start of each element.\n\nThe compound-walking logic only guarantees that a
  full 64-byte SMB2\nheader is present for the trailing element: when NextCommand
  is 0, len is\nreduced to the number of bytes remaining after next_smb2_rcv_hdr_off.
  A\nremote client can craft a compound request whose last element has exactly\n64
  bytes, so the 2-byte StructureSize2 read at offset 64 extends one byte\npast the
  receive buffer, producing a slab-out-of-bounds read.\n\n  BUG: KASAN: slab-out-of-bounds
  in ksmbd_smb2_check_message (fs/smb/server/smb2misc.c:402)\n  Read of size 2 at
  addr ffff888012ae31ac by t"
