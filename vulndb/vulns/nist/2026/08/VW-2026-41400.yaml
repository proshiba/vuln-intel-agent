title: "In the Linux kernel, the following vulnerability has been resolved:\n\niommu/amd:
  Wait for completion instead of returning early in iommu_completion_wait()\n\nneed_sync
  is a per-IOMMU flag shared by all domains and devices behind\nthat IOMMU. It is
  set whenever a command is queued with sync == true and\ncleared when a completion-wait
  (CWAIT) command is queued. However, a\ncleared need_sync only means that a covering
  CWAIT has been queued, not\nthat all previously queued commands have actually completed
  in hardware.\n\niommu_completion_wait() read need_sync locklessly and returned early\n\
  when it was false. This breaks the \"block until all previously queued\ncommands
  have completed\" contract in a multi-CPU scenario:\n\n  CPU2: queue inv-B      \
  \            => need_sync = true\n  CPU1: queue CWAIT(N); need_sync = false; then
  wait_on_sem(N)\n  CPU2: read need_sync == false      => return 0 (no wait!)\n\n\
  CPU2 returns without waiting for any sequence number even though its\ninv-B may
  not have completed yet (CWA"
