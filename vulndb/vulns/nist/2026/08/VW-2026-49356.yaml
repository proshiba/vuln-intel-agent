title: The All-in-One WP Migration and Backup plugin for WordPress is vulnerable
  to SQL Injection via archive restore functionality in all versions up to, and 
  including, 7.109 due to insufficient escaping on the user supplied parameter 
  and lack of sufficient preparation on the existing SQL query. This makes it 
  possible for unauthenticated attackers to append additional SQL queries into 
  already existing queries that can be used to extract sensitive information 
  from the database. This can be leveraged to obtain the ai1wm_secret_key when a
  site administrator performs an archive restore and achieve remote code 
  execution once able to leverage the ai1wm_secret_key value.
