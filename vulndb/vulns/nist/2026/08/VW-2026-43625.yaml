title: rsync 3.1.0 before 3.5.0 contains an authorization bypass in auth users 
  directive parsing. The auth users parser uses comma-only tokenization when 
  splitting the user list, which fails to correctly handle entries of the form 
  @Group Name where the group name contains a space. The space within the group 
  name causes the parser to split the entry at the space boundary, discarding 
  the deny rule associated with the group. An authenticated user whose username 
  or group membership would be denied by an @Group Name auth users entry can 
  connect to a restricted module because the deny rule is silently discarded 
  during parsing.
