title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/i915:
  clear CRTC color blob pointers after dropping refs\n\nintel_crtc_put_color_blobs()
  drops the CRTC color blob references, but\nleaves the corresponding pointers unchanged.\n\
  \nThis can matter in intel_crtc_prepare_cleared_state(), which frees the\nold CRTC
  hw state before calling intel_dp_tunnel_atomic_clear_stream_bw().\nThe latter can
  fail while looking up the DP tunnel group state, for\nexample with -EDEADLK.\n\n\
  If that happens, the function returns without completing the cleared\nstate preparation.
  The failed atomic state will then be cleared by the\natomic core and intel_crtc_free_hw_state()
  can be called again for the\nsame state, dropping the same blob references again.\n\
  \nClear the blob pointers after dropping the references so repeated cleanup\nof
  the same CRTC hw state is safe.\n\n(cherry picked from commit d5005addb5f68e8a0edce249506757bdc9e3d8c8)"
