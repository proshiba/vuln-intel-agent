title: "In the Linux kernel, the following vulnerability has been resolved:\n\nfs/ntfs3:
  bound attr_off in UpdateResidentValue against data_off\n\nIn do_action()'s UpdateResidentValue
  case (fslog.c:3307),\nlrh->attr_off and lrh->redo_len come from the on-disk LRH.\n\
  When they satisfy aoff + dlen < attr->res.data_off, the\nassignment\n\n\tattr->res.data_size
  = cpu_to_le32(aoff + dlen - data_off);\n\nunderflows to ~4 GiB (e.g. 0xFFFFFFF9
  when aoff=0x10, dlen=1,\ndata_off=0x18).  Subsequent code that reads attr->res.data_size\n\
  to walk the resident attribute payload would then read up to\n4 GiB past the 1024-byte
  MFT record allocation.\n\nThe existing mi_enum_attr() defense in fs/ntfs3/record.c:287\n\
  catches the corrupted data_size on the next attribute walk\nand fails the mount,
  but only on the path that walks all\nattributes.  A read site that picks an attribute
  by name and\nreads its data_size without re-validating is not covered.\nValidate
  aoff against data_off and asize at the source.\n\nReproduced under UML+KASAN on "
