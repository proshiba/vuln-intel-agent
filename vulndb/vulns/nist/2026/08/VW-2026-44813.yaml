title: "In the Linux kernel, the following vulnerability has been resolved:\n\nRDMA/mlx5:
  Fix UMR XLT cleanup on ODP populate failure\n\nmlx5r_umr_update_xlt() allocates
  and DMA maps an XLT buffer with\nmlx5r_umr_create_xlt(). The buffer is released
  by the common cleanup path\nthrough mlx5r_umr_unmap_free_xlt().\n\nAfter mlx5_odp_populate_xlt()
  became fallible, its error path returned\ndirectly and skipped that cleanup. This
  leaks the XLT DMA mapping and\nbuffer. If the emergency XLT page was used, it also
  leaves\nxlt_emergency_page_mutex locked.\n\nBreak out of the loop so execution falls
  through the existing cleanup path."
