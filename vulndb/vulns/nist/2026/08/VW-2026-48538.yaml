title: The Social Login & Sharing buttons with Analytics By SoClever WordPress 
  plugin through 1.2.0 does not perform any authentication, authorisation or 
  nonce checks in one of its publicly accessible login handlers, allowing 
  unauthenticated attackers to obtain a valid session as any existing user, 
  including administrators. In the default case a session as the site's original
  administrator account is obtained without needing to know any account details 
  at all.
