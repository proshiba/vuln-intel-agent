title: 'A vulnerability in the handling of RSA keys on devices running Cisco Adaptive
  Security Appliance (ASA) Software and Cisco Firepower Threat Defense (FTD) Software
  could allow an unauthenticated, remote attacker to retrieve an RSA private key.
  This vulnerability is due to a logic error when the RSA key is stored in memory
  on a hardware platform that performs hardware-based cryptography. An attacker could
  exploit this vulnerability by using a Lenstra side-channel attack against the targeted
  device. A successful exploit could allow the attacker to retrieve the RSA private
  key. The following conditions may be observed on an affected device: This vulnerability
  will apply to approximately 5 percent of the RSA keys on a device that is running
  a vulnerable release of Cisco ASA Software or Cisco FTD Software; not all RSA keys
  are expected to be affected due to mathematical calculations applied to the RSA
  key. The RSA key could be valid but have specific characteristics that make it vulnerable
  to'
