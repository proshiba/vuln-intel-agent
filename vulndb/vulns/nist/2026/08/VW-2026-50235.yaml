title: "In the Linux kernel, the following vulnerability has been resolved:\n\nrseq:
  Prevent hard lockup on granted time slice extension\n\n__exit_to_user_mode_loop()
  invokes rseq_grant_timeslice_extension() with\ninterrupts enabled. If the extension
  is granted it invokes\nhrtimer_rearm_deferred_tif() to ensure that a pending deferred
  hrtimer\nrearm is handled before exiting to user space.\n\nThough this invokes __hrtimer_rearm_deferred()
  which expects to be invoked\nwith interrupts disabled as it takes hrtimer_cpu_base::lock
  with\nraw_spin_lock(). That's a livelock waiting to happen and caught by lockdep:\n\
  \n    WARNING: ./include/linux/hrtimer_rearm.h:17 at irqentry_exit, CPU#1: slice_test\n\
  \    WARNING: inconsistent lock state\n    inconsistent {IN-HARDIRQ-W} -> {HARDIRQ-ON-W}
  usage.\n\nPrevent this by disabling interrupts around the invocation of\nhrtimer_rearm_deferred_tif()
  in rseq_grant_timeslice_extension().\n\n[ tglx: Massaged change log ]"
