title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  nl80211: fix NL80211_ATTR_MLO_LINK_ID off-by-one\n\nSince the netlink attribute
  range validation provides inclusive\nchecking, the *max* of attribute NL80211_ATTR_MLO_LINK_ID
  should be\nIEEE80211_MLD_MAX_NUM_LINKS - 1 otherwise causing an off-by-one.\n\n\
  One crash stack for demonstration:\n==================================================================\n\
  BUG: KASAN: wild-memory-access in ieee80211_tx_control_port+0x3b6/0xca0 net/mac80211/tx.c:5939\n\
