title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbtrfs:
  fix incorrect splitting in btrfs_drop_extent_map_range\n\nIn production we were
  seeing a variety of WARN_ON()'s in the extent_map\ncode, specifically in btrfs_drop_extent_map_range()
  when we have to call\nadd_extent_mapping() for our second split.\n\nConsider the
  following extent map layout\n\n\tPINNED\n\t[0 16K)  [32K, 48K)\n\nand then we call
  btrfs_drop_extent_map_range for [0, 36K), with\nskip_pinned == true.  The initial
  loop will have\n\n\tstart = 0\n\tend = 36K\n\tlen = 36K\n\nwe will find the [0,
  16k) extent, but since we are pinned we will skip\nit, which has this code\n\n\t
  start = em_end;\n\tif (end != (u64)-1)\n\t\tlen = start + len - em_end;\n\nem_end
  here is 16K, so now the values are\n\n\tstart = 16K\n\tlen = 16K + 36K - 16K = 36K\n\
  \nlen should instead be 20K.  This is a problem when we find the next\nextent at
  [32K, 48K), we need to split this extent to leave [36K, 48k),\nhowever the code
  for the split looks like this\n\n\tsplit->start = star"
