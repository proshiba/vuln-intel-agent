title: Apache NiFi 1.5.0 through 2.10.0 support gzip-encoded HTTP requests for 
  the application REST API using a Jersey encoding filter. The framework 
  enforced a configurable maximum request size on the compressed payload rather 
  than the decompressed output, allowing a malicious client to send crafted 
  requests that could consume excessive amounts of memory. Upgrading to Apache 
  NiFi 2.11.0 is the recommended mitigation, which relocates response 
  compression to Jetty Server and disables decompression of gzip-encoded HTTP 
  requests.
