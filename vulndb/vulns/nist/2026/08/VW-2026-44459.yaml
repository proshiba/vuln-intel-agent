title: "In the Linux kernel, the following vulnerability has been resolved:\n\nKVM:
  s390: pci: Fix GISC refcount leak on AIF enable failure\n\nkvm_s390_gisc_register()
  registers the guest ISC before pinning\nthe guest interrupt forwarding pages and
  allocating the AISB bit.\nIf any of the later setup steps fails, the function unwinds
  the\npinned pages and other local state, but does not unregister the\nGISC reference.
  Add the missing kvm_s390_gisc_unregister() to the\nerror unwind path."
