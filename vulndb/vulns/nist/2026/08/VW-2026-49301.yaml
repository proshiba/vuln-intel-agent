title: "Improper Neutralization of Input During Web Page Generation (XSS) vulnerability
  in team-alembic AshAuthentication allows reflected cross-site scripting via the
  confirmation and magic link interaction forms.\n\nWhen a strategy is configured
  with require_interaction? set to true, AshAuthentication serves an intermediate
  HTML page asking the user to confirm the action by submitting a form. Both such
  pages embed a request parameter directly into a hidden input's value attribute without
  HTML escaping: lib/ash_authentication/add_ons/confirmation/confirmation_form.html.eex
  interpolates the confirm parameter, and lib/ash_authentication/strategies/magic_link/sign_in_form.html.eex
  interpolates the magic link token parameter. These templates are compiled with EEx.function_from_file/3
  using plain <%= %> expressions, which perform no escaping, so the parameter is reflected
  verbatim.\n\nNeither accept handler validates the value before rendering it. AshAuthentication.AddOn.Confirmation.Plug.accept/2
  onl"
