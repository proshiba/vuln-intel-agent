title: Wazuh workflows before 44bf114 contain a shell injection vulnerability in
  GitHub Actions that allows attackers to execute arbitrary commands by 
  submitting pull requests with crafted VERSION.json files. Attackers can inject
  shell metacharacters into environment variables that are directly interpolated
  into run steps, enabling command execution and exfiltration of secrets 
  including GITHUB_TOKEN and AWS credentials on self-hosted runners.
