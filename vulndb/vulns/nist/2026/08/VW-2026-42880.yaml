title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnet:
  txgbe: fix heap overflow when reading module EEPROM\n\ntxgbe_read_eeprom_hostif()
  always copies round_up(length, 4) bytes\ninto the caller buffer, which ethtool allocates
  with exactly 'length'\nbytes. A non-4-aligned length therefore causes an out-of-bounds
  write.\nCopy only the remaining bytes on the final dword instead."
