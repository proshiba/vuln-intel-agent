  Implement a crw lock\n\nUnlike the channel_program struct, which covers synchronous
  I/O\nsubmissions and asynchronous interrupts, the CRW region relies\nexclusively
  on asynchronous events coming from hardware.\n\nImplement a lock to manage the list
  of those payloads, to ensure\nthey are read cohesively."
