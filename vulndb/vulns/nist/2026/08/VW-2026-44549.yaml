title: "In the Linux kernel, the following vulnerability has been resolved:\n\nxen/pvcalls:
  bound backend response req_id before indexing rsp[]\n\npvcalls_front_event_handler()
  takes req_id directly from the\nbackend-supplied ring response and uses it to index
  the fixed-size\nbedata->rsp[] array for a memcpy() and a store, with no range check.
  A\nmalicious or buggy backend can set req_id past PVCALLS_NR_RSP_PER_RING\nand drive
  an out-of-bounds write past the bedata allocation.\n\nreq_id was also declared int
  while the wire field rsp->req_id is u32, so\na range check on the signed value alone
  is insufficient: a backend\nreq_id of 0xffffffff becomes -1, passes a >= PVCALLS_NR_RSP_PER_RING\n\
  test and indexes bedata->rsp[-1]. Declare req_id as u32 so a single\nbound covers
  both ends.\n\nA backend that sends an out-of-range req_id has violated the wire\n\
  protocol, so rather than silently dropping the response, log once and\nstop trusting
  the backend: set bedata->disabled. The event handler then\nignores further respons"
