title: "A path traversal flaw was found in WildFly's domain mode\n  implementation.
  The LocalFileRepository.getFile() and\n  getConfigurationFile() methods in\n  wildfly-core/deployment-repository
  do not validate that the\n  resolved file path remains within the configured repository
  or\n  configuration root directories. A remote attacker who has\n  obtained the
  slave host controller secret or compromised a slave\n  host controller can supply
  a crafted relative path containing\n  directory traversal sequences (e.g., ../../etc/passwd)
  via the\n  slave-DC wire protocol, causing the Domain Controller to resolve\n  and
  serve arbitrary files readable by the DC process. This leads\n  to unauthorized
  disclosure of sensitive information such as\n  configuration files, keystores, and
  system credentials."
