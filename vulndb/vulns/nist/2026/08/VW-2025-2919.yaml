title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  dvbdev: adopts refcnt to avoid UAF\n\ndvb_unregister_device() is known that prone
  to use-after-free.\nThat is, the cleanup from dvb_unregister_device() releases the
  dvb_device\neven if there are pointers stored in file->private_data still refer
  to it.\n\nThis patch adds a reference counter into struct dvb_device and delays
  its\ndeallocation until no pointer refers to the object."
