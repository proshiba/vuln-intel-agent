title: SiYuan versions before 3.7.4 contain an unthrottled brute-force 
  vulnerability in the Publish Service Basic Auth implementation 
  (PublishServiceTransport.RoundTrip() in kernel/server/proxy/publish.go). The 
  Publish Service runs on a separate, unauthenticated-by-default listener 
  (default TCP port 6808) and gates named publish-viewer accounts 
  (Conf.Publish.Auth.Accounts) with Basic Auth that has no rate limiting, 
  per-account lockout, or backoff. Unauthenticated remote attackers can submit 
  unlimited password guesses against named accounts to gain access to published 
  notes/notebooks.
