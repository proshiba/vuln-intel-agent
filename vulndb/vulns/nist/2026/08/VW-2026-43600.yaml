title: rsync before 3.5.0 contains a symlink race condition vulnerability in the
  --remove-source-files feature that allows attackers with symlink creation 
  access to cause arbitrary file deletion. Attackers can atomically substitute a
  symlink for a source file between transfer completion and the unlink() call, 
  causing rsync to delete the symlink target rather than the intended source 
  file.
