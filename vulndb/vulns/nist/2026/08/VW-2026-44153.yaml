title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndevice
  property: initialize the remaining fields of fwnode_handle in fwnode_init()\n\n\
  If a firmware node is allocated on the stack (for instance: temporary\nsoftware
  node whose life-time we control) or on the heap - but using a\nnon-zeroing allocation
  function - and initialized using fwnode_init(),\nits secondary pointer will contain
  uninitialized memory which likely\nwill be neither NULL nor IS_ERR() and so may
  end up being dereferenced\n(for example: in dev_to_swnode()). Set fwnode->secondary
  to NULL on\ninitialization. While at it: initialize the remaining fields of struct\n\
  fwnode_handle too just to be sure.\n\n[ Fix typo in commit message. - Danilo ]"
