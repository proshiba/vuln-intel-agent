title: Emlog CMS <= 2.6.14 contains a stored cross-site scripting (XSS) 
  vulnerability in the article publishing module (/admin/article.php). A remote 
  authenticated attacker can inject arbitrary JavaScript code via the article 
  content. When an administrator reviews or previews the submitted article in 
  the backend, the malicious script executes in the admin's browser session, 
  allowing the attacker to perform administrative actions such as creating a 
  backdoor administrator account.
