  patch (two timer callbacks trying\nto cancel each other) can be invoked through
  bpf_map_update_elem as\nwell, or more precisely, freeing map elements containing
  timers. Since\nthis relies on hrtimer_cancel as well, it is prone to the same deadlock\n\
  situation as the previous patch.\n\nIt would be sufficient to use hrtimer_try_to_cancel
  to fix this problem,\nas the timer cannot be enqueued after async_cancel_and_free.
