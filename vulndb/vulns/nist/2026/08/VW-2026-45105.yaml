title: The SureDash – Community, Courses & Member Dashboard plugin for WordPress
  is vulnerable to Stored Cross-Site Scripting via 'draweropenverposition' 
  Block/Shortcode Attribute in all versions up to, and including, 1.10.3 due to 
  insufficient input sanitization and output escaping. This makes it possible 
  for authenticated attackers, with contributor-level access and above, to 
  inject arbitrary web scripts in pages that will execute whenever a user 
  accesses an injected page. The injected payload is stored inside the 
  block-delimiter HTML comment's JSON, which wp_kses_post does not neutralize on
  save, and is only interpolated into the rendered style attribute at display 
  time without esc_attr() escaping, allowing a double-quote to break out of the 
  attribute and introduce arbitrary HTML event handlers.
