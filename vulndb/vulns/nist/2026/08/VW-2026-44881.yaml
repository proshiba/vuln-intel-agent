title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/amdkfd:
  fix QID bit leak in pqm_create_queue()\n\nWhen MES is enabled and amdgpu_amdkfd_alloc_kernel_mem()
  fails during\nthe first queue creation for a process, pqm_create_queue() returns\n\
  early via 'return retval' without going through the err_create_queue\ncleanup label.\n\
  \nThis means clear_bit(*qid, pqm->queue_slot_bitmap) is never called,\nleaving the
  reserved QID bit permanently set in queue_slot_bitmap.\nOver time this leaks QID
  slots, potentially exhausting all available\nqueue slots.\n\nFix this by replacing
  'return retval' with 'goto err_allocate_pqn'\nso that clear_bit() is always called
  on the error path without\ntouching the uninitialized pqn pointer.\n\nAILIKFD-813\n\
  \n(cherry picked from commit a107f74c38edbb80d6ab64dcaeeb292c14e9779f)"
