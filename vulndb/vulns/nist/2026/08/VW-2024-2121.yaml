title: "In the Linux kernel, the following vulnerability has been resolved:\n\nnvme:
  fix a possible use-after-free in controller reset during load\n\nUnlike .queue_rq,
  in .submit_async_event drivers may not check the ctrl\nreadiness for AER submission.
  This may lead to a use-after-free\ncondition that was observed with nvme-tcp.\n\n\
  The race condition may happen in the following scenario:\n1. driver executes its
  reset_ctrl_work\n2. -> nvme_stop_ctrl - flushes ctrl async_event_work\n3. ctrl sends
  AEN which is received by the host, which in turn\n   schedules AEN handling\n4.
  teardown admin queue (which releases the queue socket)\n5. AEN processed, submits
  another AER, calling the driver to submit\n6. driver attempts to send the cmd\n\
  ==> use-after-free\n\nIn order to fix that, add ctrl state check to validate the
  ctrl\nis actually able to accept the AER submission.\n\nThis addresses the above
  race in controller resets because the driver\nduring teardown should:\n1. change
  ctrl state to RESETTING\n2. flush async_event_wo"
