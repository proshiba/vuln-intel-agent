title: FreeRDP is a free implementation of the Remote Desktop Protocol. Prior to
  3.27.0, FreeRDP H.264 decoder backends can return YUV planes sized from the 
  bitstream without comparing the decoded width and height to the RDPGFX surface
  dimensions used to validate region rectangles. A malicious RDP server can 
  provide an AVC420 or AVC444 bitstream whose decoded frame is smaller than the 
  negotiated surface, causing yuv420_context_decode and the YUV-to-RGB 
  conversion paths to read beyond the decoder-owned planes in 
  libfreerdp/codec/h264.c and the selected H.264 backend. This can disclose 
  client memory or crash the client. This issue is fixed in version 3.27.0.
