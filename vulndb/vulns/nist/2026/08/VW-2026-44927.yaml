title: "In the Linux kernel, the following vulnerability has been resolved:\n\nksmbd:
  reject repeated SMB2 NEGOTIATE requests\n\nUnauthenticated client can send multiple
  successful SMB2 NEGOTIATE\nrequests on one connection before SESSION_SETUP. While
  the connection is\nin KSMBD_SESS_NEED_SETUP, smb2_handle_negotiate() accepts another\n\
  SMB3.1.1 NEGOTIATE and overwrites conn->preauth_info with a new allocation.\nOnly
  the final allocation is freed when the connection is released, leaking\none object
  for every additional successful request.\n\nA repeated SMB2 NEGOTIATE after a dialect
  has been selected is a protocol\nviolation. MS-SMB2 section 3.3.5.4 requires the
  server to disconnect\nwithout replying in this case. Set the connection exiting
  when rejecting\nthe request, in addition to suppressing the response.\n\nReject
  SMB2 NEGOTIATE unless the connection is new or is waiting for the\nSMB2 NEGOTIATE
  that follows an SMB1 multi-protocol negotiate. Serialize\nboth SMB1 and SMB2 negotiation
  paths under conn->srv_mut"
