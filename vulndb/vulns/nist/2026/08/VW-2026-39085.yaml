title: "A cryptographic\nweakness exists in the Omada device adoption process.  During
  adoption, authentication credentials associated\nwith site management are transmitted
  using a weak hashing algorithm that does\nnot provide sufficient protection. \n\n\
  \n\n\n\n\n\n\n\nAn attacker who\nsuccessfully intercepts adoption-related authentication
  traffic may be able to\nrecover valid credentials and gain unauthorized access to
  managed devices or\ncontroller-managed environments."
