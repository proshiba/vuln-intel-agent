title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  rtl2832: fix use-after-free in rtl2832_remove()\n\ncancel_delayed_work_sync() is
  called before i2c_mux_del_adapters()\nin rtl2832_remove(). While the cancel waits
  for any running instance\nof i2c_gate_work to finish, it does not prevent the timer
  from being\nrescheduled by a concurrent thread.\n\nDuring probe, the r820t_attach()
  call attempts I2C transfers through\nthe mux adapter. These transfers go through
  i2c_mux_master_xfer(),\nwhich calls rtl2832_deselect() after the transfer completes,\n\
  rescheduling i2c_gate_work via schedule_delayed_work(). If this\ntransfer is still
  in flight when rtl2832_remove() runs,\nrtl2832_deselect() can reschedule i2c_gate_work
  after it has been\ncancelled, causing a use-after-free when kfree(dev) is called.\n\
  \nFix this by calling i2c_mux_del_adapters() before\ncancel_delayed_work_sync().
  Once the mux adapter is unregistered, no\nnew I2C transfers can go through it, so
  rtl2832_deselect() can no\nl"
