title: AVideo contains an unauthenticated arbitrary file write vulnerability in 
  the aVideoEncoderChunk.json.php endpoint that allows remote attackers to write
  up to 4 GB of arbitrary content to the server filesystem via HTTP PUT requests
  without authentication. Attackers can exhaust disk space causing denial of 
  service, poison the video encoding pipeline, or chain this with local file 
  inclusion to achieve remote code execution.
