title: "In the Linux kernel, the following vulnerability has been resolved:\n\nlibceph:
  fix two unsafe bare decodes in decode_lockers()\n\ndecode_lockers() in cls_lock_client.c
  contains two bare decode operations\nthat allow a malicious or compromised OSD to
  trigger slab-out-of-bounds\nreads:\n\n1. ceph_decode_32(p) at the num_lockers field
  has no preceding bounds\n   check. ceph_start_decoding() accepts struct_len=0 as
  valid -- the\n   internal ceph_decode_need(p, end, 0, bad) always passes -- so when
  an\n   OSD sends struct_len=0, ceph_start_decoding() returns success with\n   p
  == end. The immediately following bare ceph_decode_32(p) then reads\n   4 bytes
  past the validated buffer boundary. The garbage value is\n   passed directly to
  kzalloc_objs() as the locker count.\n\n   The sibling function decode_watchers()
  in osd_client.c already uses\n   ceph_decode_32_safe() after its own ceph_start_decoding()
  call.\n   decode_lockers() was the only site using the bare variant.\n\n2. ceph_decode_8(p)
  after the decode"
