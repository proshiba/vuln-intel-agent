title: "In the Linux kernel, the following vulnerability has been resolved:\n\nwifi:
  iwlwifi: dvm: Fix memcpy: detected field-spanning write backtrace\n\nA received
  TKIP key may be up to 32 bytes because it may contain\nMIC rx/tx keys too. These
  are not used by iwl and copying these\nover overflows the iwl_keyinfo.key field.\n\
  \nAdd a check to not copy more data to iwl_keyinfo.key then will fit.\n\nThis fixes
  backtraces like this one:\n\n memcpy: detected field-spanning write (size 32) of
  single field \"sta_cmd.key.key\" at drivers/net/wireless/intel/iwlwifi/dvm/sta.c:1103
  (size 16)\n WARNING: CPU: 1 PID: 946 at drivers/net/wireless/intel/iwlwifi/dvm/sta.c:1103
  iwlagn_send_sta_key+0x375/0x390 [iwldvm]\n <snip>\n Hardware name: Dell Inc. Latitude
  E6430/0H3MT5, BIOS A21 05/08/2017\n RIP: 0010:iwlagn_send_sta_key+0x375/0x390 [iwldvm]\n\
  \ <snip>\n Call Trace:\n  <TASK>\n  iwl_set_dynamic_key+0x1f0/0x220 [iwldvm]\n \
  \ iwlagn_mac_set_key+0x1e4/0x280 [iwldvm]\n  drv_set_key+0xa4/0x1b0 [mac80211]\n\
  \  ieee80211_key_enable_hw_accel+0"
