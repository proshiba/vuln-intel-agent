title: FreeRDP before 3.30.0 (<= 3.29.0) contains a heap-based buffer overflow 
  in the Windows clipboard client's CliprdrStream_Read function 
  (client/Windows/wf_cliprdr.c). When an OLE paste consumer (e.g. explorer.exe) 
  calls IStream::Read with a fixed-size buffer of cb bytes, CliprdrStream_Read 
  requests file contents from the RDP server and then copies the response into 
  the caller's buffer using the server-supplied length (req_fsize) instead of 
  cb. A malicious or compromised RDP server can return an oversized 
  CB_FILECONTENTS_RESPONSE, causing an out-of-bounds write of 
  attacker-controlled data into the paste consumer's heap buffer when a user 
  pastes server-offered clipboard file contents.
