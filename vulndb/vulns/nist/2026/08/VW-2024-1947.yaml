title: "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/vc4:
  kms: Clear the HVS FIFO commit pointer once done\n\nCommit 9ec03d7f1ed3 (\"drm/vc4:
  kms: Wait on previous FIFO users before a\ncommit\") introduced a wait on the previous
  commit done on a given HVS\nFIFO.\n\nHowever, we never cleared that pointer once
  done. Since\ndrm_crtc_commit_put can free the drm_crtc_commit structure directly
  if\nwe were the last user, this means that it can lead to a use-after free\nif we
  were to duplicate the state, and that stale pointer would even be\ncopied to the
  new state.\n\nSet the pointer to NULL once we're done with the wait so that we don't\n\
  carry over a pointer to a free'd structure."
