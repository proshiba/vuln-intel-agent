title: "In the Linux kernel, the following vulnerability has been resolved:\n\nsctp:
  fix auth_chunk_list capacity check in sctp_auth_ep_add_chunkid\n\nsctp_auth_ep_add_chunkid()
  uses SCTP_NUM_CHUNK_TYPES (20) as the\ncapacity limit for ep->auth_chunk_list, allowing
  it to hold up to\n20 chunk entries (param_hdr.length up to 24). However, the copy\n\
  destination asoc->c.auth_chunks in struct sctp_cookie is only\nSCTP_AUTH_MAX_CHUNKS
  (16) entries (20 bytes). When more than 16\nchunks are added, sctp_association_init()
  memcpy overflows the\ndestination by up to 4 bytes.\n\nFix by using SCTP_AUTH_MAX_CHUNKS
  as the capacity limit, matching\nthe destination capacity."
