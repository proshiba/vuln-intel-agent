title: "In the Linux kernel, the following vulnerability has been resolved:\n\nbpf:
  Preserve param->string when parsing mount options\n\nIn bpf_parse_param(), keep
  the value of param->string intact so it can\nbe freed later. Otherwise, the kmalloc
  area pointed to by param->string\nwill be leaked as shown below:\n\nunreferenced
  object 0xffff888118c46d20 (size 8):\n  comm \"new_name\", pid 12109, jiffies 4295580214\n\
  \  hex dump (first 8 bytes):\n    61 6e 79 00 38 c9 5c 7e                      \
