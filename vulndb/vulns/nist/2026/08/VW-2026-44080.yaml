title: A flaw was found in Red Hat Quay's JWT (JSON Web Token) validation for 
  federated robot accounts and single sign-on (SSO) authentication. Multiple 
  issues related to audience verification and the enforcement of `azp` and `sub`
  claims were identified. These flaws could allow an attacker with a 
  validly-signed token from the same identity provider to bypass configured 
  security restrictions. This bypass could lead to unauthorized access by 
  circumventing intended audience, subject, or authorized-client limitations.
