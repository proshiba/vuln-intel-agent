title: "In the Linux kernel, the following vulnerability has been resolved:\n\nmedia:
  i2c: alvium: fix critical pointer access in alvium_ctrl_init\n\nThe current implementation
  of alvium_ctrl_init creates several controls in\nfunction alvium_ctrl_init and uses
  the returned pointer without check. That\ncan cause write access over NULL-pointer
  for several controls. The reworked\ncode checks the pointers before adding flags."
