- "Apply the patch SOI EP2, which upgrades the ActiveMQ version (JMS message broker)
  for the SOI Core to version 5.19.5.\n\nEP2 is a cumulative patch that covers previous
  EP1 patch. EP2 also upgrades the SOI management scripts to the latest version and
  installs an upgraded OpenJDK version 11 to run ActiveMQ MESSAGE BROKER in the newer
  JRE. It also upgrades the ActiveMQ client libraries installed in the WildFly module."
