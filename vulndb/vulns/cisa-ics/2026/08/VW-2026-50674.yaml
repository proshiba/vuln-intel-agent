fixed_versions:
- All customers running ASE2000 versions 2.25 through 2.37 are affected by this 
  issue and are required to upgrade to version 2.38 or later to apply the 
  security fix. Upgrade instructions and user documentation are available at 
  www.ase-systems.com. For detailed, step-by-step guidance on upgrading to the 
  latest version and patching the impacted components, please contact our 
  support team at support@ase-systems.com.
- Avoid using IEC 60870-5-104 over TLS across untrusted or shared networks; 
  place ASE2000 hosts on an isolated, segmented network reachable only by 
  intended peers.
- Restrict write access to the ASE2000 installation directory and its 
  configuration files to trusted administrators only.
