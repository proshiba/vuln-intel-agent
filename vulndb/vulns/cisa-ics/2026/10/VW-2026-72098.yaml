fixed: true
fixed_versions:
- Grid Protection Alliance has added additional validation into serialization 
  logic in openPDC version 2.9.482 and later and openHistorian version 2.8.585 
  and later. Systems using Windows Authentication are additionally protected, as
  they require the attacker to already be authenticated to reach this function.
- Grid Protection Alliance has added additional verification and integrity 
  checks of adapters in openPDC version 2.9.477 and later and openHistorian 
  version 2.8.580 and later.
- Grid Protection Alliance updated the default configuration to bind this 
  interface to the local loopback address only. This change applies to new 
  installations; existing installations upgraded from an earlier version retain 
  their prior configuration and will not receive the new default automatically. 
  Operators should verify their configuration explicitly and update the 
  interface binding if it is still set to accept connections on all interfaces.
