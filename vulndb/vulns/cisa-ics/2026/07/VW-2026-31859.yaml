fixed_versions:
- Tycon Systems did not respond to CISA's attempts at coordination. Users of 
  Tycon Systems TPDIN-Monitor-WEB2 are encouraged to contact Tycon Systems and 
  keep their systems up to date.
- Tycon Systems has released firmware 2.4.5, which resolves this vulnerability 
  by removing cleartext credentials from the web interface response. Further 
  inquiries can be directed to security@tyconsystems.com.
- Tycon Systems has released firmware 2.4.5, which resolves this vulnerability 
  by requiring an administrator username and password to be set before the web 
  interface is served. Further inquiries can be directed to 
  security@tyconsystems.com.
