- "Before applying this update, make sure all previously released errata\nrelevant
  to your system have been applied.\n\nFor details on how to apply this update, refer
  to:\n\nhttps://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.22/html/updating_openshift_data_foundation/updating-ocs-to-odf_rhodf"
- "For details on how to apply this update, which includes the changes described in
  this advisory, refer to:\nhttps://images.redhat.com/"
- "For multicluster engine for Kubernetes, see the following documentation for\ndetails
  on how to install the images:\n\nhttps://access.redhat.com/documentation/en-us/red_hat_advanced_cluster_management_for_kubernetes/2.16/html/clusters/cluster_mce_overview#mce-install-intro"
- "Red Hat OpenShift Pipelines is a cloud-native, continuous integration and\ncontinuous
  delivery (CI/CD) solution based on Kubernetes resources.\nIt uses Tekton building
  blocks to automate deployments across multiple\nplatforms by abstracting away the
  underlying implementation details.\nTekton introduces a number of standard custom
  resource definitions (CRDs)\nfor defining CI/CD pipelines that are portable across
  Kubernetes distributions."
- To install this SUSE Security Update use the SUSE recommended installation 
  methods like YaST online_update or "zypper patch".
