- "Before applying this update, make sure all previously released errata\nrelevant
  to your system have been applied.\n\nFor details on how to apply this update, refer
  to:\n\nhttps://docs.redhat.com/en/documentation/red_hat_openshift_data_foundation/4.22/html/updating_openshift_data_foundation/updating-ocs-to-odf_rhodf"
- "Before applying this update, make sure all previously released errata relevant
  to your system have been applied.\n\nThe steps to apply the upgraded images are
  different depending on the installation plan approval policy you used\nwhen installing
  the cert-manager Operator for Red Hat OpenShift.\n\n- If the approval policy is
  set to `Automatic`, then the Operator will be upgraded automatically when there
  is a\nnew version of the Operator. No further action is required to upgrade. This
  is the default setting.\n\n- If you changed the approval policy to `Manual`, then
  you must manually approve the upgrade to the Operator.\n\nSee https://docs.openshift.com/container-platform/latest/security/cert_manager_operator/index.html
  for additional\ninformation."
- "For more information about Assisted Installer, see the following documentation:\n\
  \nhttps://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/2.13/html/clusters/cluster_mce_overview#cim-intro\n\
  \nFor multicluster engine for Kubernetes, see the following documentation for\n\
  details on how to install the images:\n\nhttps://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/2.13/html/clusters/cluster_mce_overview#mce-install-intro\n\
  \nThis documentation will be available after the general availability release of
  Red Hat Advanced Cluster Management 2.13."
- For more information on the RHWA 4.22-0 release, see 
  https://docs.redhat.com/en/documentation/workload_availability_for_red_hat_openshift/4.22-0
- "NetApp Console Agent: {'link': 'https://mysupport.netapp.com/site/products/all/details/netapp-console/downloads-tab/download/61906/4.9.0',
