- To start using the DevWorkspace Operator, install the DevWorkspace Operator 
  from OpenShift OperatorHub on OpenShift Container Platform 4.16 or higher.
- "You can download the Cryostat 4 on RHEL 9 container images that this update provides
  from the Red Hat Container Registry at registry.access.redhat.com. Installation
  instructions for your platform are available in the Red Hat Container Catalog (see
  the References section).\n\nDockerfiles and scripts should be amended to refer to
  this new image specifically or to the latest image generally."
