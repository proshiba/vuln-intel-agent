  to:\n\nhttps://access.redhat.com/articles/11258\n\nFor supported configurations,
  refer to:\n\nhttps://access.redhat.com/articles/1548993"
- "For OpenShift Container Platform 4.15 see the following documentation, which will
  be updated shortly for this release, for important instructions on how to upgrade
  your cluster and fully apply this asynchronous errata update:\n\nhttps://docs.redhat.com/en/documentation/openshift_container_platform/4.15/html/release_notes/\n\
  \nYou may download the oc tool and use it to inspect release image metadata for
  x86_64, s390x, ppc64le, and aarch64 architectures. The image digests may be found
  at https://quay.io/repository/openshift-release-dev/ocp-release?tab=tags.\n\nThe
  sha values for the release are as follows:\n\n      (For x86_64 architecture)\n\
  \      The image digest is sha256:3ff7652a165409a368a7cdc748c95efc17db0761d467cc85fb355cce14643602\n\
  \n      (For s390x architecture)\n      The image digest is sha256:e719d7719f466aa7584d8776d3f04ced742f5b2f7884fd1a8cb8f6cff259cbab\n\
  \n      (For ppc64le architecture)\n      The image digest is sha256:3c3a437578260fde80a5b9b0a5513d4e016984156c0aa9d361b783ac142d9587\n\
  \n      (For aarch64 architecture)\n      The image digest is sha256:b086a8cedd201aee39e244dd7892d44aa39fc262693a8ea199f14b908018d614\n\
  \nAll OpenShift Container Platform 4.15 users are advised to upgrade to these updated
  packages and images when they are available in the appropriate release channel.
  To check for available updates, use the OpenShift CLI (oc) or web console. Instructions
  for upgrading a cluster are available at https://docs.redhat.com/en/documentation/openshift_container_platform/4.15/html-single/updating_clusters/index#updating-cluster-cli."
- "The container images provided by this update can be downloaded from the\nRed Hat
  container registry at registry.redhat.io using the \"podman pull\" command."
