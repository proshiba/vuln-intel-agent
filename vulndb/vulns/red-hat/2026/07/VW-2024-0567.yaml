  \n      (For aarch64 architecture)\n      The image digest is sha256:2a6ef9f17b82e31a465f3134ecad7e06dd07c70245fae69ccb135c7076ecc33a\n\
  \nAll OpenShift Container Platform 4.18 users are advised to upgrade to these updated
