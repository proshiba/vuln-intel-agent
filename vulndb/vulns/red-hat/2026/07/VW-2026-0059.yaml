- "Before applying this update, make sure all previously released errata relevant\n\
  to your system have been applied.\n\n1. Apply the update\n\nThis update is delivered
  via a package update, not a new installer. To apply the fix, update the necessary
  package:\n\ndnf -y update python3.11-urllib3\n\n(Alternatively, rerunning the current
  rhui-installer will also install this package update automatically.)\n\n2. Restart
  RHUI services\n\nExecute the following command for the update to take effect:\n\n\
  rhui-services-restart\n\n(Alternatively, if you have rerun the installer, this command
  is not needed because rerunning the installer restarts RHUI services automatically.)"
