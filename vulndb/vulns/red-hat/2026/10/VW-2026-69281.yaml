- "Before applying this update, make sure all previously released errata\nrelevant
  to your system have been applied.\n\nFor detailed instructions how to apply this
  update, refer to:\n\nhttps://docs.redhat.com/en/documentation/red_hat_satellite/6.16/html/updating_red_hat_satellite/index\n\
  \nRelease Notes:\n\nProvisioning tokens are now required for all Operating System
  entries with Redhat family set. Attempts to download a unattended template without
  valid token will lead to “a provisioning token is required but a valid one was not
  provided” error.\n\nThis changed behavior will lead to inability to use Generic
  or Subnet Bootdisks, systems using this bootdiks will be not matched with the host
  entry and not boot. To use Bootdisk after applying the errata, either use Full Host
  Bootdisk which uses tokens, or set Administer - Settings - Provisioning - Installation
  token lifetime to zero. This turns off the token enforcement and allows unauthenticated
  parties to use arbitrary MAC addresses in unattended requests to fetch provisioning
  kickstart with possibly sensitive data."
