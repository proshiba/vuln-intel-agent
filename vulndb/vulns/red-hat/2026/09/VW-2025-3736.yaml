fixed_versions:
- "Before applying this update, make sure all previously released errata relevant
  to your system have been applied.\nThe steps to apply the upgraded images are different
  depending on the installation plan approval policy you used when installing the
  cert-manager Operator for Red Hat OpenShift.\n- If the approval policy is set to
  `Automatic`, then the Operator will be upgraded automatically when there is a new
  version of the Operator. No further action is required to upgrade. This is the default
  setting.\n- If you changed the approval policy to `Manual`, then you must manually
  approve the upgrade to the Operator.\nSee 'https://docs.openshift.com/container-
  platform/latest/security/cert_manager_operator/index.html' for additional information."
- To install this SUSE Security Update use the SUSE recommended installation 
  methods like YaST online_update or "zypper patch".
