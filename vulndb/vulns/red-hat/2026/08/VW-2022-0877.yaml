- "Before applying the update, back up your existing installation, including all applications,
  configuration files, databases and database settings, and so on.\n\nThe References
  section of this erratum contains a download link (you must log in to download the
  update)."
- "Before applying this update, back up your existing Red Hat JBoss Enterprise Application
  Platform installation and deployed applications.\n\nFor details on how to apply
  this update, refer to:\n\nhttps://access.redhat.com/articles/11258"
- "Before applying this update, back up your existing Red Hat JBoss Enterprise Application
  Platform installation and deployed applications.\n\nThe References section of this
  erratum contains a download link (you must log in to download the update)."
- "Before applying this update, make sure all previously released errata relevant
  to your system have been applied.\n\nFor details on how to apply this update, refer
  to:\n\nhttps://access.redhat.com/articles/11258"
- "For details on how to apply this update, which includes the changes described in
  this advisory, refer to:\n\nhttps://access.redhat.com/articles/11258"
- "To install this update, do the following:\n \n1. Download the Data Grid 8.3.1 Server
  patch from the customer portal[²].\n2. Back up your existing Data Grid installation.
  You should back up databases, configuration files, and so on.\n3. Install the Data
  Grid 8.3.1 Server patch.\n4. Restart Data Grid to ensure the changes take effect.\n\
  \nFor more information about Data Grid 8.3.1, refer to the 8.3.1 Release Notes[³]"
