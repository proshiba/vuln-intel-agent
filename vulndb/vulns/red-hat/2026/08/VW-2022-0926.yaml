- "Before applying the update, back up your existing installation, including all applications,
  configuration files, databases and database settings, and so on.\n\nInstallation
  instructions are available from the Fuse 7.11.1 product documentation page:\nhttps://access.redhat.com/documentation/en-us/red_hat_fuse/7.11/"
- 'Before applying this update, ensure all previously released errata relevant to
  your system have been applied. For details about how to apply this update, see:
  https://access.redhat.com/articles/11258'
- "For OpenShift Container Platform 4.11 see the following documentation,\nwhich will
  be updated shortly for this release, for important instructions\non how to upgrade
  your cluster and fully apply this asynchronous errata\nupdate:\n\nhttps://docs.openshift.com/container-platform/4.11/release_notes/ocp-4-11-release-notes.html\n\
  \nDetails on how to access this content are available at\nhttps://docs.openshift.com/container-platform/4.11/updating/updating-cluster-cli.html"
- "For on-premise installations, before applying the update, back up your existing
  installation, including all applications, configuration files, databases and database
  settings, and so on.\n\nRed Hat recommends that you halt the server by stopping
  the JBoss Application Server process before installing this update. After installing
  the update, restart the server by starting the JBoss Application Server process.\n\
  \nThe References section of this erratum contains a download link. You must log
  in to download the update."
