- "Before applying the update, back up your existing installation, including all applications,
  configuration files, databases and database settings, and so on.\n\nInstallation
  instructions are available from the Fuse 7.11.1 product documentation page:\nhttps://access.redhat.com/documentation/en-us/red_hat_fuse/7.11/"
- "Before applying the update, back up your existing installation, including all applications,
  configuration files, databases and database settings, and so on.\n\nThe References
  section of this erratum contains a download link (you must log in to download the
  update)."
- 'Before applying this update, ensure all previously released errata relevant to
  your system have been applied. For details about how to apply this update, see:
  https://access.redhat.com/articles/11258'
- "To install this update, do the following:\n \n1. Download the Data Grid 8.4.0 Server
  patch from the customer portal[²].\n2. Back up your existing Data Grid installation.
  You should back up databases, configuration files, and so on.\n3. Install the Data
  Grid 8.4.0 Server patch.\n4. Restart Data Grid to ensure the changes take effect.\n\
  \nFor more information about Data Grid 8.4.0, refer to the 8.4.0 Release Notes[³]"
