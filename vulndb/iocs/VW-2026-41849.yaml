  name: Operation Dream Job
  references:
  - https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/
  summary: Check Point Research は、Lazarus が求人を装った侵入で Microsoft AFD.sys のゼロデイ 
    CVE-2026-68820 を権限昇格に悪用し、カーネルモードルートキット FudModule の新版を展開したと報告した。同一の侵入で 
    MISTPEN、ForestTiger、トロイの木馬 SecurityPDF、新型バックドア Troy が確認されている。また Lazarus は 
    CVE-2025-49113 で Roundcube サーバを侵害し、PHP ウェブシェル RelayShell を C2 
    の中継ノードとして利用していた。
cve: CVE-2026-68820
