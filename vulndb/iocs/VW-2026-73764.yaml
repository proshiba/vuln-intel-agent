  name: GitLab CVE-2026-97229 exploitation attempt against Alpine Linux 
    (2026-10)
  references:
  - https://alpinelinux.org/posts/GitLab-security-incident-CVE-2026-97229.html
  - https://thehackernews.com/2026/10/attacker-tried-to-exploit-alpine-linuxs.html
  - https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  summary: Alpine Linux は自組織の GitLab インスタンスに対する CVE-2026-97229 
    の悪用試行を公表した。公開された経緯では、攻撃者は 2026-10-20 にアカウントを新規登録して探索を開始し、10-21 の主要な攻撃で 
    GitLab がクラッシュして 502 エラーと CI ジョブ失敗が発生した。Alpine は 10-23 に該当アカウントを遮断したが、攻撃者は 
    10-25 から 10-26 に再度侵入を試み失敗しており、10-26 にはアップグレード後も脆弱な状態が続いていたことが判明したため、10-27 から
    10-28 にインスタンスを再構築して全パスワードと秘密鍵を入れ替えた。Alpine 
    は悪用が成功した証拠は見つかっていないが否定もできないとして侵害扱いで対応したと記載している。Alpine の報告を引用した The Hacker 
    News は、攻撃者が Alpine の GitLab コンテナイメージをダウンロードしており、対象の構成に合わせて exploit 
    を調整していたことを示唆すると伝えている。出典はいずれも攻撃者名・キャンペーン名・マルウェア名を示しておらず、IP・ドメイン・ハッシュ等の指標も公開されていないため本エントリは指標を持たない（キャンペーン名は整理用の記述）。CISA
    は 2026-10-29 に本 CVE を KEV に追加している。
