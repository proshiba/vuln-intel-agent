  name: UAT-10147
  references:
  - https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/
  - https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/
  - https://thehackernews.com/2026/08/cisa-adds-six-exploited-flaws-to-kev.html
  summary: Cisco Talos が報告した中国語話者の金銭目的グループ UAT-10147 の活動。世界各地の Windows / Linux 
    ウェブサーバを侵害し、SEO 詐欺とデータ窃取を行う。侵入後の作業に agentic AI（PentestGPT、DeepAudit）を 
    組み込んで規模を拡大している点が特徴とされる。初期侵入には公開ウェブアプリの既知脆弱性を、権限昇格には Linux 
    カーネル／ローカルコンポーネントの既知脆弱性を用いる。展開されるインプラントとして SPECTRE（Linux カーネルルートキット Specter と
    BYOVD を備えるクロスプラットフォーム実装）、Gh0stCringe、Noodle RAT、Quasar 
    RAT、BadIIS、Meterpreter 
    が確認されている。被害はブラジル・ボリビア・中国・カナダ・ベトナムの政府・教育・メディア・技術・ゲーム分野で確認された。CISA は 
    2026-08-26 に本グループが悪用する CVE-2022-0995 / CVE-2015-5287 / CVE-2015-3246 / 
    CVE-2021-23758 を KEV へ追加した。
cve: CVE-2015-5287
