  summary: Cleo Harmony / VLTrader / LexiCom に対する 2024 年 12 月の大量悪用。Huntress は 
    CVE-2024-50623 に対する Cleo の修正がフローを緩和できていないことを PoC 再現で確認し、autoruns/ 
    配下へペイロードを設置する悪用と、Java ベースのインプラント Malichus の投下を報告した（後に迂回そのものへ CVE-2024-55956 
    が採番されている）。SecurityWeek によれば Cl0p がリークサイト上の投稿と同誌への回答で Cleo 攻撃の犯行を認めた。
