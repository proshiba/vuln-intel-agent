  name: N-able N-central authentication bypass exploitation
  references:
  - https://www.huntress.com/blog/n-able-vulnerability-exploitation
  - https://www.n-able.com/blog/n-central-security-update-august-2-2026
  summary: N-able N-central の認証バイパス CVE-2026-18556 と、その不完全な修正である CVE-2026-18577 
    の実悪用。Huntress と N-able は同一の攻撃活動として両 CVE を挙げており、攻撃者は N-central 管理サーバを掌握したのち 
    Take Control 機能で管理下端末へ接続し、Cloudflared サービスを登録して持続的アクセスを確立した。ベンダーと調査元が攻撃元 IP 
    アドレスと接続先ホスト名を公開している。
