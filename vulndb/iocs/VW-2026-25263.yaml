  name: Atlassian Confluence CVE-2023-22518 悪用による Cerber ランサムウェア展開
  references:
  - https://www.rapid7.com/blog/post/2023/11/06/etr-rapid7-observed-exploitation-of-atlassian-confluence-cve-2023-22518/
  - https://www.trendmicro.com/en_us/research/23/k/cerber-ransomware-exploits-cve-2023-22518.html
  summary: Rapid7 MDR は 2023-11-05 に Atlassian Confluence の CVE-2023-22518 
    悪用を観測し、侵入後に単独ホストへ Cerber ランサムウェアが展開されたと報告している。Linux 側では攻撃者ホストから取得したスクリプトを sh
    へ渡し、ELF ランサムウェア /tmp/qnetd を実行して read-me3.txt を残す流れが示されている。Trend Micro は同一 
    CVE の悪用で Windows 版・Linux 版の Cerber が配布され、PowerShell が別の C2 
    から十進エンコードされたペイロードを取得すると記載している。いずれの出典も攻撃者名・キャンペーン名を示しておらず、本エントリの名称は整理用の記述である。
