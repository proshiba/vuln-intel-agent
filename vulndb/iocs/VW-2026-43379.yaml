  summary: CERT Polska が 2026-08-17 に、Zimbra Collaboration Suite の事前認証 OS 
    コマンドインジェクション CVE-2026-73570 を悪用する継続中のキャンペーンを報告した。同 CERT 
    が示した侵害痕跡はログとファイル作成の痕跡のみで、zimbra ユーザによる 
    /opt/zimbra/jetty/webapps/、/opt/zimbra/jetty_base/webapps/、/tmp/ 配下のファイル作成と 
    /var/log/zimbra.log の確認を挙げている。Shadowserver は 2026-08-20 に 155 件、2026-08-25 
    時点で 274 件のインターネット公開インスタンスの侵害を観測したとしている。修正は 2026-07-20 公開の 
    10.1.20。攻撃者・キャンペーン名・マルウェアの帰属はいずれも公開されておらず、IP・ドメイン・ハッシュ等のネットワーク指標も公開されていない。
