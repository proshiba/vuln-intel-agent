  summary: PaperCut NG/MF のデータベース接続ユーティリティにおける安全でない動的クラスロード。CVE-2026-81578 
    のアクセス制御不備と連鎖することで認証前リモートコード実行に至る。PaperCut は 2026-08-27 に実悪用の調査中であると公表し、CISA 
    は 2026-08-31 に KEV へ追加した。Huntress は 2026-08-26 時点の悪用を確認し、投入された Java クラスファイルが
    /data/content/ 配下でコマンドを実行して結果を Udydn.out へ書き出し、痕跡と server.log 
    を削除する挙動を報告している。侵害後は SimpleHelp と AnyDesk が冗長なリモートアクセス経路として設置された（いずれも正規 RMM 
    の悪用であり、マルウェアファミリの命名はされていない）。攻撃者・キャンペーンの帰属は公開されておらず、PaperCut 
    は検証済みのネットワーク指標（IP・ドメイン・URL）を未公開としているため、登録できる指標値は存在しない。
