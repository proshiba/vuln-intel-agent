  summary: SOCRadar が 2026-07-31 に公開したレポートによれば、China-nexus のアクセスブローカー UNC5174 / 
    UNC6586 に関連づけられる SNOWLIGHT 活動が、政府・民間インフラを標的とした攻撃で公開 PoC 
    を組み合わせた複数のエクスプロイトを用いており、その中に CVE-2026-21962 を狙う CVE-2026-21962.py（WebLogic 
    系ターゲット向け）が含まれる。攻撃基盤として 130.94.17.180 が全部入りの攻撃プラットフォーム、130.94.30.168 が 
    SNOWLIGHT 検体の配布に使われ、Meterpreter リスナや GoCobaltStrike の teamserver ログイン元 IP 
    も報告されている。別途 CloudSEK が 2026-03-25 に公開した高対話型 Oracle 
    ハニーポットの観測では、CVE-2026-21962 の PoC が GitHub で公開された 2026-01-22 
    当日から悪用試行が始まり、同月末までに複数の走査元が確認されている。
