  name: N-able N-central September 2026 exploitation
  references:
  - https://www.huntress.com/blog/n-able-vulnerability-exploitation
  summary: Huntress は 2026-09-04、パッチ適用済みの N-central 
    本番環境が侵害された事案の調査を開始し、9月の新たな侵入活動として侵入元 IP と悪性の Cloudflare Tunnel 
    アカウントを公開した。攻撃者は N-able のメールアドレスに .invalid 
    などを付けた管理者アカウントを作成しようとし、/remoteControlAction.do?method=getPierDetails 
    への偵察を行い、資格情報のローテーションを越えて残る持続手段として Cloudflare Tunnel を利用した。N-able は 
    CVE-2026-86218（プレ認証 RCE、CVSS 10.0、HF4 で修正）を「実環境で悪用が観測された」ゼロデイとしているが、Huntress
    は当該侵害でアプライアンスのログが既にローテートしていたため、悪用されたのが CVE-2026-86218 か、9/5 公開の 
    CVE-2026-86206 / CVE-2026-86207 
    の連鎖か、あるいは他の脆弱性かを確定できないと明記している。攻撃者名・キャンペーン名は出典に無い。8月の CVE-2026-18556 / 
    CVE-2026-18577 の活動とは別系統。
cve: CVE-2026-86218
