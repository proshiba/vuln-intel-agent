campaigns:
- actors: []
  first_reported: '2026-08-21T00:00:00Z'
  malware:
  - SLAPSHOT
  - WHIPSHOT
  name: Citrix NetScaler ADC/Gateway zero-day exploitation (September 2026)
  references:
  - https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances
  - https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/
  - https://www.cisa.gov/news-events/alerts/2026/09/27/critical-zero-day-vulnerabilities-exploited-citrix-netscaler-adc-gateway
  - https://www.esentire.com/security-advisories/update-ongoing-exploitation-of-citrix-netscaler-adc-and-netscaler-gateway-vulnerabilities-cve-2026-88771-cve-2026-88772
  - https://www.rapid7.com/blog/post/etr-zero-day-exploitation-of-citrix-netscaler-adc-and-gateway-cve-2026-88771-and-cve-2026-88772
  summary: インターネットに露出した Citrix NetScaler ADC / Gateway を狙い、公開前から進行していた 0-day 
    悪用活動。eSentire TRU は CVE-2026-88771 の悪用を公開 3 週間以上前の 2026-09-05 
    に観測したとしており、Rapid7 は最も早い悪用試行を 2026-09-20T14:28:43 UTC に観測している。攻撃者は PHP 
    ウェブシェルを設置し、Rapid7 が観測した事例では 
    /var/netscaler/logon/LogonPoint/custom/.ctxs.receiver にウェブシェルが置かれ、2026-09-24
    に設置が確認された。CISA は 2026-09-27 に世界規模で活動中の悪用が発生していると公表し、CVE-2026-88771 と 
    CVE-2026-88772 を KEV に追加した。出典はいずれも攻撃者名・キャンペーン名を示しておらず（eSentire は「No 
    attribution for the attacks were provided」と明記）、本エントリの名称は整理用の記述である。eSentire の
    IoC 節は 2 つの CVE を分けずに掲載しているため、指標は両 CVE に共通して記録している。
- actors: []
  first_reported: '2026-10-19T00:00:00Z'
  malware:
  - .slap framework
  - SLAPSHOT
  - WHIPSHOT
  - nsvmd
  - vc scanner
  name: Citrix NetScaler CVE-2026-88771 / CVE-2026-88779 chained intrusion 
    (Rapid7, 2026-10)
  references:
  - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/
  summary: Rapid7 は 2026 年 10 月初旬、影響を受ける 14.1 ビルドの Citrix NetScaler ADC 
    の侵害を調査し、NetScaler の認証および SAML 構成を狙った悪用に晒されていたと記載している。侵入では root 
    でのコード実行が成立し、認証ユーザー名に注入された攻撃者制御のテキストが nsaaad のクラッシュと Pitboss 
    の再起動を引き起こし、再起動後にクラッシュハンドラがそのテキストを処理して root でペイロードを実行する流れが繰り返されたとしている。侵害後は 
    PHP ウェブシェルの設置、外向き C2 と内部トンネリング、DNS・LDAP/Active Directory・管理サービス・VMware 
    vCenter の偵察、NetScaler の設定と鍵素材の持ち出しが行われた。攻撃ツールとして .slap フレームワーク、FreeBSD 向け Go
    プロキシエージェント nsvmd、Go 製偵察ツール vc、Python 製 HTTP トンネル（slapshot.py / 
    whipd.py）が記載されている。Rapid7 は本活動が公開報告の WHIPSHOT/SLAPSHOT 
    キャンペーンと重なるとしつつ、攻撃者名は示しておらず本文では「TA」とのみ呼んでいる。Rapid7 は個々の指標を 2 つの CVE 
    に切り分けていないため、指標は CVE-2026-88771 側にまとめて記録している。
- actors: []
  first_reported: '2026-09-30T00:00:00Z'
  malware:
  - nsmon.pl
  - Platypus agent
  - Sliver
  - update_c08937.pl
  name: Citrix NetScaler CVE-2026-88771 post-exploitation infrastructure 
    (2026-09-30 以降の報告)
  references:
  - https://raw.githubusercontent.com/rtkwlf/wolf-tools/main/pack_alerts/202609-citrix-netscaler-active-exploitation-cve-2026-88771/README.md
  - https://pitscaler.com/netscaler-detection/
  summary: CVE-2026-88771 の悪用後に観測された配布・C2 インフラに関する追加報告。Arctic Wolf は 2026-09-30 
    公開の アラートパックで、NetScaler が 62.133.62.80 から /xd7h/x と 3,752 バイトの Perl スクリプト 
    nsmon.pl を 取得した通信を示し、nsmon.pl が /var/tmp/.nsmon への自己設置・root での 5 分ごとの cron 
    登録・41000-41999 の TCP リッスン・UDP/TCP での check-in を備えると記載している。同パックは Platypus 
    エージェント（シェルスクリプト）が entretiensol.com から取得されたこと、curl/wget による 
    Python・Perl・シェルスクリプトの取得と bash/netcat による リバースシェル接続、Base64 化した実行結果の HTTP 
    送信も挙げている。PitScaler の IoC 集約では、FreeBSD/ELF 版 Sliver インプラントが pylrk.cc を C2 
    とし（実装内に https://www.pylrk.cc がハードコード）、f.pylrk.cc から配布された と記載され、ns.conf と SSL
    秘密鍵を 81.94.239.8 
    へ送出する窃取ペイロードが報告されている。いずれの出典も攻撃者名・キャンペーン名を示しておらず、本エントリ名は整理用の記述である。
- actors: []
  first_reported: '2026-09-28T00:00:00Z'
  malware:
  - Pylrkfbsd
  - SLAPSHOT
  - Sliver
  - WHIPSHOT
  - trojanized Dropbear SSH 2025.88
  - update_c08937.pl
  name: 'Citrix NetScaler CVE-2026-88771 post-exploitation: Sliver implant Pylrkfbsd
    and Dropbear backdoor (watchTowr / Beazley Security, 2026-09 以降)'
  references:
  - https://labs.beazley.security/advisories/BSL-A1216
  - https://watchtowr.com/intelligence/post-exploitation-analysis-artifacts-citrix-netscaler-cve-2026-88771/
  summary: watchTowr Labs と Beazley Security による侵害後フェーズの追加報告。watchTowr は 
    2026-09-28 に大規模な実環境悪用の兆候、2026-09-29 に C2 
    インプラント・ウェブシェル・バックドアへのエスカレーション、2026-09-30 に資格情報と機密情報の大量窃取を観測したとし、観測の大半はOOB 
    コールバックを狙う日和見的な試行で、oast.fun・dnshook.site・webhook.site といった共有サービスに加え 
    ctrxsrv.com のような専用の類似ドメインが使われたと記載している。また trojanized Dropbear SSH 2025.88 
    バックドアが tcp/37512 で待ち受け、Perl ステージャ update_c08937.pl が gw_health アカウントを 
    superuser として再作成し、PHP ウェブシェル .local_journal と Sliver インプラント 
    /var/vpn/ns_helper が設置されたとしている。Beazley Security は 2026-09-20 
    開始とみられるキャンペーンとして、PHP ウェブシェル WHIPSHOT とPython トンネラ SLAPSHOT の展開を挙げ、Sliver 
    で作られた FreeBSD 向けインプラントが "Pylrkfbsd" と名付けられ www.pylrk.cc へ HTTPS（フォールバックは 
    TCP/80 の HTTP）で接続すると記載している。両者とも攻撃者名・キャンペーン名は示していない。なお Beazley の指標表では同じドメインが 
    pyrlnk.cc とも綴られているが、技術解説側の pylrk.cc と矛盾するためpyrlnk 表記は採用していない。Beazley が 
    CVE-2026-88772 に紐づけている IP （154.217.251.226 / 143.198.7.94 / 
    157.254.167.12）は本エントリの対象外とした。
