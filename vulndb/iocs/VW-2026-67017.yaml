campaigns:
- actors: []
  first_reported: '2026-08-21T00:00:00Z'
  malware:
  - SLAPSHOT
  - WHIPSHOT
  name: Citrix NetScaler ADC/Gateway zero-day exploitation (September 2026)
  references:
  - https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances
  - https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/
  - https://www.cisa.gov/news-events/alerts/2026/09/27/critical-zero-day-vulnerabilities-exploited-citrix-netscaler-adc-gateway
  - https://www.esentire.com/security-advisories/update-ongoing-exploitation-of-citrix-netscaler-adc-and-netscaler-gateway-vulnerabilities-cve-2026-88771-cve-2026-88772
  - https://www.rapid7.com/blog/post/etr-zero-day-exploitation-of-citrix-netscaler-adc-and-gateway-cve-2026-88771-and-cve-2026-88772
  summary: インターネットに露出した Citrix NetScaler ADC / Gateway を狙い、公開前から進行していた 0-day 
    悪用活動。eSentire TRU は CVE-2026-88771 の悪用を公開 3 週間以上前の 2026-09-05 
    に観測したとしており、Rapid7 は最も早い悪用試行を 2026-09-20T14:28:43 UTC に観測している。攻撃者は PHP 
    ウェブシェルを設置し、Rapid7 が観測した事例では 
    /var/netscaler/logon/LogonPoint/custom/.ctxs.receiver にウェブシェルが置かれ、2026-09-24
    に設置が確認された。CISA は 2026-09-27 に世界規模で活動中の悪用が発生していると公表し、CVE-2026-88771 と 
    CVE-2026-88772 を KEV に追加した。出典はいずれも攻撃者名・キャンペーン名を示しておらず（eSentire は「No 
    attribution for the attacks were provided」と明記）、本エントリの名称は整理用の記述である。eSentire の
    IoC 節は 2 つの CVE を分けずに掲載しているため、指標は両 CVE に共通して記録している。
- actors: []
  first_reported: '2026-09-30T00:00:00Z'
  malware:
  - nsmon.pl
  - Platypus agent
  - Sliver
  - update_c08937.pl
  name: Citrix NetScaler CVE-2026-88771 post-exploitation infrastructure 
    (2026-09-30 以降の報告)
  references:
  - https://raw.githubusercontent.com/rtkwlf/wolf-tools/main/pack_alerts/202609-citrix-netscaler-active-exploitation-cve-2026-88771/README.md
  - https://pitscaler.com/netscaler-detection/
  summary: CVE-2026-88771 の悪用後に観測された配布・C2 インフラに関する追加報告。Arctic Wolf は 2026-09-30 
    公開の アラートパックで、NetScaler が 62.133.62.80 から /xd7h/x と 3,752 バイトの Perl スクリプト 
    nsmon.pl を 取得した通信を示し、nsmon.pl が /var/tmp/.nsmon への自己設置・root での 5 分ごとの cron 
    登録・41000-41999 の TCP リッスン・UDP/TCP での check-in を備えると記載している。同パックは Platypus 
    エージェント（シェルスクリプト）が entretiensol.com から取得されたこと、curl/wget による 
    Python・Perl・シェルスクリプトの取得と bash/netcat による リバースシェル接続、Base64 化した実行結果の HTTP 
    送信も挙げている。PitScaler の IoC 集約では、FreeBSD/ELF 版 Sliver インプラントが pylrk.cc を C2 
    とし（実装内に https://www.pylrk.cc がハードコード）、f.pylrk.cc から配布された と記載され、ns.conf と SSL
    秘密鍵を 81.94.239.8 
    へ送出する窃取ペイロードが報告されている。いずれの出典も攻撃者名・キャンペーン名を示しておらず、本エントリ名は整理用の記述である。
cve: CVE-2026-88771
