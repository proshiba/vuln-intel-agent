  summary: Microsoft MSTIC は 2021年8月に CVE-2021-40444 を悪用する10件未満の攻撃を観測し、悪性 Office
    文書内の ActiveX コントロール経由で独自の Cobalt Strike Beacon 
    ローダが配布されたと報告している。この初期侵入キャンペーンを DEV-0413 として追跡し、ローダの通信先は Cobalt Strike 
    インフラのクラスタ DEV-0365 
    と結び付けられる基盤で、人間が操作するランサムウェアを含む複数の犯罪キャンペーンに関連すると述べている。oleObjects をホストした基盤の一部は 
    BazaLoader と Trickbot の配布にも関与しており、Mandiant の UNC1878 と重なる DEV-0193 
    に対応する。公開後は RaaS アフィリエイトが公開 PoC を取り込んだとも記している。
