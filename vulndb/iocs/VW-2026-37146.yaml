- actors:
  - UAT-12197
  first_reported: '2026-09-09T00:00:00Z'
  malware:
  - home.jsp (JSP web shell)
  - cmd.jar (JAR command executor)
  name: UAT-12197 Cisco Secure FMC exploitation
  references:
  - https://blog.talosintelligence.com/fmc-ongoing-exploitation/
  summary: 'Cisco Talos が 2026-09-09 に公開した Cisco Secure Firewall Management Center
    の実悪用報告のクラスタ #1。CVE-2026-20079 の悪用に成功した攻撃者が CSM Tomcat の webroot に JSP ベースの Web
    シェル（home.jsp）を設置し、同ディレクトリに置いた cmd.jar で OmniQuery.pl を実行して内部データベースから利用者の認証データ・資格情報を窃取した。攻撃者名は
    Talos の追跡識別子 UAT-12197 のみで、既知グループへの紐付けは出典に無い。'
- actors:
  - UAT-11823
  first_reported: '2026-09-09T00:00:00Z'
  malware:
  - Cyclops Blink
  - Netcat reverse shell
  name: UAT-11823 Cisco Secure FMC exploitation
  references:
  - https://blog.talosintelligence.com/fmc-ongoing-exploitation/
  summary: '同報告のクラスタ #2。Talos は高い確度で UAT-11823（APT アクター、Sandworm とツールが重複すると記述）に帰属させている。CVE-2026-20079
    の悪用または静的資格情報で初期アクセスを得たのち、license.tmp を書き換えて package_info.pl 経由で root 実行させ、Netcat
    リバースシェルで C2 へ接続。管理対象機器の設定を収集・アーカイブして持ち出し、Netcat C2 サーバの 1 つからモジュール型 ELF インプラント
    Cyclops Blink（Sandworm に過去帰属）をダウンロードした。Talos は CVE-2026-20079 と CVE-2026-20316
    の双方を悪用したと高い確度で評価している。'
cve: CVE-2026-20079
