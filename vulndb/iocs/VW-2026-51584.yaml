  name: PaperCut NG/MF CVE-2026-81578 / CVE-2026-82078 zero-day exploitation
  references:
  - https://www.huntress.com/blog/papercut-actively-exploited
  - https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/
  - https://www.helpnetsecurity.com/2026/08/31/papercut-attack-remote-access-tools/
  summary: PaperCut NG/MF の Web 管理インターフェースにおけるアクセス制御不備。CVE-2026-82078 
    の安全でない動的クラスロードと連鎖させることで、認証前の攻撃者が設定を変更し PaperCut サーバプロセス権限で任意の Java 
    バイトコードを実行できる。PaperCut は 2026-08-27 に実悪用の調査中であると公表し、CISA は 2026-08-31 に KEV 
    へ追加した。Huntress は 2026-08-26 時点の悪用を確認し、PaperCut のログから base64 エンコードされた whoami 
    / ver の偵察コマンドと、投入された Java クラスファイル（Udydn.class / Moo97.class）を復元している。侵害後は 
    pc-app.exe が cmd.exe を起動し、SimpleHelp と AnyDesk 
    が永続的なリモートアクセス手段として設置された（いずれも正規 RMM 
    の悪用であり、マルウェアファミリの命名はされていない）。攻撃者・キャンペーンの帰属は公開されておらず、PaperCut 
    は検証済みのネットワーク指標（IP・ドメイン・URL）を未公開としているため、登録できる指標値は存在しない。
