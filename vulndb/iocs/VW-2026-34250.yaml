  summary: 分散 AI フレームワーク Ray のコードインジェクション。The Hacker News（BitSight 
    の報告を引用）によれば、DDoS ボットネット RondoDox の運用者が、公開開示（2025-11-26）の 2 日前にこの脆弱性の PoC 
    を攻撃ツール群へ取り込んでいた。DNS リバインディングと組み合わせることで、Ray 
    を実行中の開発者が悪性サイトを閲覧しただけで任意コード実行に至りうるとされる。CISA は 2026-08-17 に評価を PoC 
    公開から実悪用へ変更し KEV カタログへ追加した。IP・ドメイン・ハッシュ等のネットワーク指標は公開されていない。なお Oligo Security 
    の ShadowRay 2.0 キャンペーンは同じ Ray を狙うが、一次レポートが対象としている脆弱性は CVE-2023-48022 であり、本 
    CVE への帰属は公開されていない。
