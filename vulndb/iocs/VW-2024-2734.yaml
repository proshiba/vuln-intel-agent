  name: Cl0p exploitation of Cleo managed file transfer (Malichus)
  references:
  - https://www.rapid7.com/blog/post/2024/12/10/etr-widespread-exploitation-of-cleo-file-transfer-software-cve-2024-50623/
  - https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
  - https://www.securityweek.com/cve-assigned-to-cleo-vulnerability-as-cl0p-ransomware-group-takes-credit-for-exploitation/
  summary: Cleo Harmony / VLTrader / LexiCom の Autorun 
    ディレクトリ設定を悪用し、認証なしに任意コマンドを実行する攻撃。Huntress は 2024 年 12 月 3 日以降の悪用を確認し、少なくとも 10
    組織の Cleo サーバが侵害されたと報告している。エンコードされた PowerShell が外部 IP へコールバックして JAR 
    ファイルを取得し、Java ベースの実装が設置される。この実装を Huntress は Malichus、Arctic Wolf は Cleopatra
    と呼ぶ。Rapid7 は同じ活動で Cobalt Strike ビーコンの配布も観測した。Cl0p ランサムウェアグループは SecurityWeek 
    に対し一連の攻撃への関与を主張しているが、Rapid7 はその主張を超える帰属は現時点で推測の域だとしている。
cve: CVE-2024-55956
