  name: UAT-11823 Cisco Secure FMC exploitation
  references:
  - https://blog.talosintelligence.com/fmc-ongoing-exploitation/
  summary: 'Cisco Talos が 2026-09-09 に公開した Cisco Secure Firewall Management Center
    の実悪用報告のクラスタ #2。Talos は高い確度で UAT-11823（Sandworm とツールが重複する APT アクター）に帰属させ、CVE-2026-20079
    と CVE-2026-20316 の双方の悪用を高い確度で評価している。低権限ログインを許す CVE-2026-20316 の悪用を示す痕跡として、license.tmp
    を Makeself パッケージとして package_info.pl に root 実行させる手口が挙げられている。Netcat リバースシェルの C2
    から Cyclops Blink をダウンロードした。'
- actors:
