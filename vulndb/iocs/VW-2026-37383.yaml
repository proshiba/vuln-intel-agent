  first_reported: '2026-09-09T00:00:00Z'
  malware:
  - Qilin
  - impacket
  - Invoke-TheHash
  - socks5.py
  name: UAT-11988 Qilin ransomware intrusion via Cisco Secure FMC
  references:
  - https://blog.talosintelligence.com/fmc-ongoing-exploitation/
  summary: '同報告のクラスタ #3。Talos が UAT-11988 として追跡するランサムウェアオペレータが、静的資格情報（CVE-2026-20316）で
    FMC にログインし、package_info.pl に攻撃者作成の license.tmp を root 実行させて広範な偵察（ホスト名・IP、AD サービスアカウントや
    MySQL の資格情報、ドメイン情報）を行い、HTTP GET で持ち出した。その後 Python 製 SOCKS5 プロキシ（socks5.py）と FMC
    から攻撃者ホストへのリバース SSH トンネルで LDAP/LDAPS/Kerberos/SMB/NETBIOS/WinRM のポートを転送し、impacket・Invoke-TheHash・自作
    AV キラーを展開したうえで Qilin ランサムウェアを配備した。'
cve: CVE-2026-20316
