  malware: []
  name: PAN-OS GlobalProtect authentication bypass exploitation by an 
    unidentified actor (2026-05)
  references:
  - https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
  - https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
  summary: Rapid7 と Unit 42 は、PAN-OS GlobalProtect の認証バイパス CVE-2026-0257 
    が実環境で悪用されていると報告している。両者とも攻撃者を特定しておらず、キャンペーン名もマルウェアも示していない。Rapid7 は最も古い悪用を 
    2026-05-17 に、第 2 波を 2026-05-21 に観測し、両波に共通して現れた偽装 MAC 
    アドレスなどの端末識別子から同一の攻撃者と評価している。攻撃元は低価格ホスティング事業者で、第 1 波は Vultr、第 2 波は Dromatics 
    Systems のインフラが使われた。Unit 42 は PoC 公開 (2026-05-29) 以前の活動として 9 件の IP 
    アドレスを挙げ、Advanced URL Filtering がこれらを悪性として識別できるとしている。GlobalProtect 
    ログでは、トンネル確立時に /ssl-vpn/hipreport.esp と /ssl-vpn/getconfig.esp への POST 
    が観測されている。
cve: CVE-2026-0257
