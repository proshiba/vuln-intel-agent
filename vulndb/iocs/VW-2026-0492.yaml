  name: Veeam Backup & Replication CVE-2023-27532 exploitation with FIN7 
    tradecraft (WithSecure, Mar 2023)
  references:
  - https://www.withsecure.com/en/resources-hub/w-labs/fin7-target-veeam-servers/
  summary: WithSecure は 2023-03-28 にインターネット露出した Veeam Backup & Replication 
    サーバ上で始まる侵害を2件観測し、初期侵入は CVE-2023-27532 
    の悪用による可能性が高い（報告中の確度は低〜中）としている。PowerShell ローダ POWERTRASH から DICELOADER（別名 
    Lizar）が展開され、永続化に POWERHOLD、GUP.exe のサイドロードに DUBLOADER が使われた。帰属は更新後の記述で「FIN7 
    または FIN7 の手口を用いる攻撃者」とされている。ネットワーク指標は報告本文ではなく別途公開されているため、この台帳には登録していない。
- actors:
