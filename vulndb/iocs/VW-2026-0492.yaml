  name: Cuba ransomware campaign using the Veeam CVE-2023-27532 exploit 
    (BlackBerry research, Jun 2023)
  references:
  - https://www.bleepingcomputer.com/news/security/cuba-ransomware-uses-veeam-exploit-against-critical-us-organizations/
  summary: BleepingComputer は BlackBerry の調査（2023年6月上旬に観測された攻撃）を引用し、Cuba 
    ランサムウェアが CVE-2023-27532 を設定ファイルからの資格情報窃取に利用したと報じている。標的は米国の重要インフラ組織とラテンアメリカの 
    IT インテグレータで、独自ダウンローダ BugHatch、セキュリティ製品のプロセスを停止する 
    BurntCigar、Zerologon（CVE-2020-1472）などが併用された。一次ソースの BlackBerry 
    ブログは現在参照できず、この報道には IP・ドメイン・ハッシュの指標は含まれていない。
