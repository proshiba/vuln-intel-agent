  summary: 2026-05-19 に Nx Console の悪性バージョン 18.95.0 が Visual Studio 
    Marketplace（12:30-12:48 UTC）と Open VSX（12:33-13:09 UTC）へ公開され、VS Code 
    の自動更新経由で開発者端末へ配布された供給網侵害。Nx の事後報告によれば、ペイロードは Python バックドア cat.py を 
    ~/.local/share/kitty/ へ設置し、macOS では LaunchAgent com.user.kitty-monitor.plist
    で再起動後も残る。侵入経路は上流の悪性依存 @tanstack/zod-adapter@1.166.15 で、CVE-2026-45321 の 
    TanStack 侵害と繋がる。CISA は 2026-05-28 に注意喚起を出した。攻撃者名は出典に無い。
