  name: Apache ActiveMQ CVE-2023-46604 HelloKitty ransomware deployment
  references:
  - https://www.rapid7.com/blog/post/2023/11/01/etr-suspected-exploitation-of-apache-activemq-cve-2023-46604/
  summary: Rapid7 MDR は 2023-10-27 以降、2 つの顧客環境で Apache ActiveMQ の CVE-2023-46604
    の悪用と疑われる活動を検知し、ランサムウェアバイナリの配備が試みられたと報告した。攻撃者は ActiveMQ の java.exe を親プロセスとして 
    msiexec を起動し、172.245.16.125 上の m2.png / m4.png（実体は MSI）を読み込ませ、内部名 dllloader 
    の .NET 実行ファイル経由で EncDll を展開した。Rapid7 は身代金要求文とその他の証拠から HelloKitty 
    ランサムウェアファミリによるものと評価しているが、攻撃者名・キャンペーン名は出典に無い。
cve: CVE-2023-46604
