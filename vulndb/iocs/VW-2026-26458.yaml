campaigns:
- actors: []
  first_reported: '2025-06-17T00:00:00Z'
  malware:
  - Flodrix
  name: Langflow CVE-2025-3248 exploitation deploying Flodrix botnet (Trend 
    Micro, Jun 2025)
  references:
  - https://www.trendmicro.com/en_fi/research/25/f/langflow-vulnerability-flodric-botnet.html
  - https://censys.com/blog/poking-the-flodrix-botnet
  summary: Trend Micro は Langflow の未認証 RCE CVE-2025-3248（/api/v1/validate/code 
    が利用者入力を exec() に渡す）が悪用され、docker という bash ダウンローダが 80.66.75.121 のポート 25565 
    から取得されて、複数アーキテクチャ向けの Flodrix ボットネット ELF を導入すると報告している。Flodrix は LeetHozer 
    系列の亜種と位置づけられ、C&C へは TCP 54707 で接続し、プロセス終了通知を UDP 50445 で送る。Censys は同じ IP 
    をハードコードされた C2 として確認し、露出した NFS 共有から 745 台の感染ホスト（大半が Boa 
    を動かす台湾のネットワークカメラ）を観測したが、被害側資産にあたるためこの台帳には取り込んでいない。攻撃者やキャンペーン名の帰属は両レポートに無い。CISA
    KEV への追加は 2025-05-05、修正版は Langflow 1.3.0。
cve: CVE-2025-3248
