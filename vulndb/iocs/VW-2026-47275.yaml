campaigns:
- actors:
  - Head Mare
  first_reported: '2026-08-12T00:00:00Z'
  malware:
  - PhantomCore
  - PhantomGraph
  name: Head Mare TrueConf Server exploitation (PhantomCore delivery)
  references:
  - https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/
  - https://www.securityweek.com/cisa-urges-immediate-patching-of-exploited-trueconf-vulnerabilities/
  - https://www.cisa.gov/news-events/alerts/2026/08/20/cisa-adds-two-known-exploited-vulnerabilities-catalog
  summary: ハクティビスト集団 Head Mare による TrueConf Server の侵害。SecurityWeek によれば、Head 
    Mare は CVE-2026-72529 と CVE-2026-72530 を悪用して組織の TrueConf サーバを侵害し、サーバ上のファイルの 
    1 つを Web シェルに置き換えた。Web シェルは IT インフラ情報の収集とデータベースへのアクセスに使われ、正規のクライアント インストーラを 
    PhantomCore を導入する不正なものへ差し替えたほか、*nix サーバにバックドアが設置された。Kaspersky ICS-CERT が 
    2026-08-12 に公開した一次レポート（脆弱性は KLCERT-26-057 / KLCERT-26-058 として記載）が Web シェル 
    locale.php、不正インストーラ trueconf_windows_update.exe、PhantomCore / PhantomGraph 
    バックドア、Linux バックドアのハッシュと、攻撃者インフラの IP・ドメインを公開している。C&C には OneDrive と GitHub 
    も悪用されたと記載があるが、これらは正規サービスのため指標には取り込んでいない。CISA は 2026-08-20 に両 CVE を KEV 
    カタログへ追加した。
cve: CVE-2026-72529
