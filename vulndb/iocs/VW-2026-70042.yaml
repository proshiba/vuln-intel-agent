  name: Citrix NetScaler CVE-2026-88779 chained with CVE-2026-88771 in observed 
    intrusions (Rapid7, 2026-10)
  references:
  - https://labs.beazley.security/advisories/BSL-A1216
  - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/
  summary: Rapid7 は 2026 年 10 月初旬に調査した NetScaler ADC の侵害を CVE-2026-88771 と 
    CVE-2026-88779 の連鎖として報告している。SAML 構成の NetScaler 
    に対する悪用でアプライアンスが再起動し、再起動後にクラッシュハンドラが認証ユーザー名へ注入された攻撃者制御のテキストを処理して root 
    でペイロードを実行する、という流れである。Beazley Security も CVE-2026-88779 を SAML 
    のサービス拒否とし、強制再起動が CVE-2026-88771 の注入を発火させる位置づけだと記載している。Rapid7 は個々の指標をどちらの CVE
    かに切り分けていないため、ネットワーク指標とハッシュは 
    CVE-2026-88771（VW-2026-67017）側に記録し、本エントリには追加していない。いずれの出典も攻撃者名・キャンペーン名を示していない。
- actors: []
  first_reported: '2026-10-03T00:00:00Z'
  malware: []
  name: Citrix NetScaler SAML zero-day exploitation (CVE-2026-88779, 2026-10)
  references:
  - https://orca.security/resources/research/citrix-netscaler-zero-day-exploited-in-the-wild-crashes-saml-authentication-services/
  - https://socprime.com/blog/cve-2026-88779-citrix-netscaler-zero-day-exploited-against-saml-deployments/
  - https://www.rapid7.com/blog/post/etr-zero-day-exploitation-of-citrix-netscaler-adc-and-gateway-cve-2026-88771-and-cve-2026-88772
  - https://www.tenable.com/blog/frequently-asked-questions-about-reported-citrix-netscaler-zero-day-vulnerabilities
  summary: SAML を構成した Citrix NetScaler ADC / Gateway を標的とする 0-day 悪用。Rapid7 は本 
    CVE を SAML 処理のメモリオーバーフロー（CVSSv4 8.7、2026-10-04 公開）とし、0-day として悪用が報告され同日 CISA
    KEV に追加されたと記載している。SOC Prime は Citrix が標的型の悪用を観測した後の 2026-10-03 
    に速報を公開したとし、Tenable は Citrix が緩和未適用の NetScaler 環境への標的型攻撃を観測したと記載している。Orca 
    Security は watchTowr Labs が NetScaler ハニーポットの活動を観測して脆弱性を再現したとし、悪用試行で観測された IP
    の遮断を推奨しているが、RCE は Citrix 
    未確認であるとも明記している。出典はいずれも攻撃者名・キャンペーン名を示しておらず、本エントリの名称は整理用の記述である。CVE-2026-88772 
    に紐づく WHIPSHOT / SLAPSHOT は本 CVE の指標ではない（Tenable）。
