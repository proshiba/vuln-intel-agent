  name: Log4Shell exploitation of unpatched VMware Horizon systems (AA22-174A)
  references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-174a
  summary: CISA と USCG CGCYBER の共同アドバイザリ AA22-174A は、未修正の VMware Horizon / 
    Unified Access Gateway サーバに対する Log4Shell (CVE-2021-44228) 
    の悪用を初期アクセスとした侵害を報告している。攻撃者は hmsvc.exe・SvcEdge.exe などのローダ型マルウェアと webshell 
    error_401.jsp を設置し、ハードコードされた C2 へ接続して遠隔操作とデータ持ち出しを行った。ある事例では被害組織の管理サーバから 
    130GB 超のデータが外部 IP へ送信されている。CISA は特定のグループ名を挙げず suspected APT actors と記述している。
cve: CVE-2021-44228
