  name: RomCom
  references:
  - https://www.welivesecurity.com/en/eset-research/update-winrar-tools-now-romcom-and-others-exploiting-zero-day-vulnerability/
  summary: ESET が 2025 年 7 月 18 日に発見した、WinRAR のパストラバーサル脆弱性 CVE-2025-8088 を 0-day
    として悪用する活動。ロシア寄りのグループ RomCom（Storm-0978 / Tropical Scorpius / 
    UNC2596）に高い確度で帰属されている。求人応募を装ったスピアフィッシングで、代替データストリーム（ADS）を仕込んだ RAR 
    書庫を送付し、展開時にスタートアップフォルダへ LNK を配置して永続化する。後続として SnipBot 
    の亜種・RustyClaw・MeltingClaw・RomCom が用いる Mythic 
    エージェントが配布された。標的は欧州とカナダの金融・製造・防衛・物流。ESET は同脆弱性を RomCom 
    の数日後から別の攻撃者も悪用しており、BI.ZONE が独立に発見したとも記している。
cve: CVE-2025-8088
