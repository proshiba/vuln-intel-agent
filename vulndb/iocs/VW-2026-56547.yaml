  name: Rogue ScreenConnect worm-like VBScript chain (August 2026)
  references:
  - https://www.huntress.com/blog/rogue-screenconnect-installations
  - https://www.connectwise.com/company/trust/security-bulletins/2026-09-08-screenconnect-bulletin
  summary: Huntress が 2026-08-20 と 08-24 に無関係な複数組織で観測した、不正な ScreenConnect 
    クライアントを起点とする活動。ソーシャルエンジニアリング（Quick Assist を使ったテクニカルサポート詐欺、フィッシング、Geek Squad 
    返金フォームの検索誘導）で不正 ScreenConnect クライアントを導入させ、wscript.exe で 1.vbs〜4.vbs の 4 段 
    VBScript ローダーを実行する。1.vbs が EDR 有無・RAM・ScreenConnect 既存導入を調べて 3 ビットの状態値を 
    %TEMP%\value.txt に書き、2.vbs/3.vbs が Dropbox から map.txt と AES 
    暗号化ペイロードを取得、4.vbs が PowerShell（runner.ps1 → PyTorchFix.ps1）で復号・実行する。永続化は 
    HKCU の Run キー WindowsServiceHost（WindowsServiceHost.vbs）。011 分岐では wstunnel を
    Themes.exe に偽装して homehub.opik[.]net:443 へトンネルし、XMRig を SearchIndex.exe 
    として実行、脆弱ドライバ WinRing0 を svcdrv64.sys として同梱する。改造された ScreenConnect クライアントが新規 
    Host 接続を検知して同じ 4 つの VBScript を転送・実行させるため、ワーム的に伝播する。Huntress は 2026-09-08 
    の更新で、この file-transfer の挙動が ConnectWise の修正した CVE-2026-84869 
    に対応すると記載した。攻撃者名・キャンペーン名は出典に無い。
cve: CVE-2026-84869
