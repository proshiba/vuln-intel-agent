  summary: Kaspersky は Cuba ランサムウェアのツール群を分析し、C# 製の独自ダンパ Veeamp.exe が Veeam の脆弱性 
    CVE-2022-26500 / CVE-2022-26501 / CVE-2022-26504 を悪用して VeeamBackup SQL 
    データベースへ到達し、Credentials 
    テーブルからユーザ名・暗号化パスワード・復号パスワード・説明を取り出すと述べている。前2件は未認証のリモートコード実行、CVE-2022-26504 
    はドメインユーザによる実行にあたると説明されている。Veeamp は Cuba 専用ではなく Conti や Yanluowang 
    の攻撃でも使われ、報告中の事例では SRV_Service ホスト上で Veeamp の後に Bughatch 
    の活動が続いた。ネットワーク指標とハッシュは本文ではなく別添 PDF にあり、本文からは確認できないためこの台帳には登録していない。
