  name: CVE-2026-59310 global vCenter exploitation (suspected China-nexus APT)
  references:
  - https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html
  - https://medium.com/@quirso_de/global-exploitation-of-cve-2026-59310-by-suspected-chinese-nexus-apt-related-cve-2026-59309-443a79e1466d
  summary: vCenter Syslog サーバのディレクトリトラバーサル CVE-2026-59310 を悪用し root 
    権限を得る世界規模の活動。ドイツの IR 企業 QUIRSO の調査（The Hacker News が 2026-08-17 に報道）によれば、47 
    カ国 361 の固有 IP が侵害され、UTC+08:00 圏の中国語話者による APT の運用と中程度の確度で評価されている。/etc/cron.d/
    に不正な cron ファイル zz-poc59310-syslog.log を書き込み、curl/wget でバックドア linuxFile（別名 
    systemlog / linux_x86）を取得して実行、シェルスクリプト esxi.sh 経由で reverse_ssh 
    バイナリを配置して常駐する。最終的に ESXi ホスト上で .babyk 拡張子を付す Babuk 
    系ランサムウェアの展開に至った事例がある。CVE-2026-59310 の悪用は 2026-08-03 以降、関連する CVE-2026-59309 
    の悪用は 2026-08-01 以降に観測されている。攻撃者グループの固有名は公開されていない。
