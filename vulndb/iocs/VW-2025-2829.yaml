  summary: Huntress が複数環境で観測した、CVE-2025-5777 (CitrixBleed 2) で NetScaler 
    のセッショントークンを窃取し初期アクセスを得る一連の侵入。特権昇格の後にローカル管理者アカウントを作成し、ScreenConnect / Zoho 
    Assist / Netbird といった正規リモート管理ツールで永続化する。1 件では DragonForce 
    ランサムウェアの展開に至った。Huntress は特定の攻撃者名を挙げず、イニシャルアクセスブローカーによる活動と評価している。
