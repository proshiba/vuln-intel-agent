  name: UNC6240 Oracle PeopleSoft CVE-2026-35273 exploitation
  references:
  - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit
  - https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/
  - https://www.oracle.com/security-alerts/alert-cve-2026-35273.html
  summary: Mandiant / GTIG は 2026-05-27 から 06-09 にかけて、金銭目的の攻撃者 
    UNC6240（ShinyHunters）が Oracle PeopleSoft PeopleTools の Environment 
    Management コンポーネントの脆弱性 CVE-2026-35273 をゼロデイとして悪用したと報告した。Oracle 
    の緊急アドバイザリ（2026-06-10）より前の活動である。攻撃者は正規の RMM である MeshCentral（v1.1.59）のサーバを C2 
    ステージング環境として構築し、Microsoft Azure 
    のサービスを装う名称・ドメイン（azurenetfiles.net）に偽装したエージェントを配布した。通知対象となった 100 以上の組織のうち 68%
    が大学・カレッジで、窃取データは 2026-06-09 に ShinyHunters のリークサイトへ公開された。悪用時の到達先として 
    /PSEMHUB/hub と /PSIGW/HttpListeningConnector が挙げられている。Rapid7 によれば CISA は 
    2026-06-12 に本 CVE を KEV へ追加した。
cve: CVE-2026-35273
