  summary: Previdian は 2026-09-24 12:00 UTC 頃、同社の SharePoint ハニーポットに対し単一の送信元 IP 
    から 6 経路・計 12 件の POST による二段構成の悪用試行を観測した。第2段は LosFormatter の ActivitySurrogate
    ガジェットで、AES 復号と Assembly.Load(byte[]) を持つ SdLoader というローダ型を含む生成アセンブリ 
    wt3k3sij.dll を埋め込んでいた。9/25 の追記で、悪用により /_layouts/15/sphealth.aspx 
    というウェブシェルが作成され、2 つの PE32 
    バイナリが用いられることが公開された。出典には攻撃者名・キャンペーン名の記載は無く、観測はハニーポットへの試行であって侵害成立の確認ではない。最終段の暗号化ペイロードは未回収と明記されている。
