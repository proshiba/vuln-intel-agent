campaigns:
- actors: []
  first_reported: '2025-02-24T00:00:00Z'
  malware:
  - LockBit
  - Meterpreter
  - Mimikatz
  name: Confluence CVE-2023-22527 悪用から LockBit ランサムウェアに至る侵入
  references:
  - https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
  summary: The DFIR Report は Confluence の CVE-2023-22527 を初期アクセスに用い、最終的に LockBit
    Black を展開した侵入を公開している。攻撃者は 92.51.2.22 から悪用し、同ホストに置かれた HTA を mshta で取得して 
    Metasploit の Meterpreter を起動、Mimikatz による資格情報窃取、SoftPerfect NetScan 
    での探索、AnyDesk と PDQ Deploy の悪用、Rclone による持ち出しを経てランサムウェアを配布したと記載している。同報告はインフラが
    ShadowSyndicate と関連する可能性に言及するが、確定した帰属ではないとしているため攻撃者名は空のままとしている。正規サービスである 
    AnyDesk 配布元やクラウドストレージのドメインは攻撃者資産ではないため取り込んでいない。
- actors: []
  malware:
  - XMRig
  name: Confluence CVE-2023-22527 悪用によるクリプトジャッキング（XMRig）
  references:
  - https://www.trendmicro.com/en_us/research/24/h/cve-2023-22527-cryptomining.html
  - https://www.trendmicro.com/content/dam/trendmicro/global/en/research/24/h/cve-2023-22527-cryptomining/cryptojacking-via-CVE-2023-22527-ioc.txt
  summary: Trend Micro は CVE-2023-22527 を悪用して XMRig 
    マイナーを設置する複数の活動を報告している。シェルスクリプトの投下、SSH 経由での他ホストへの横展開、競合マイナーや /tmp 
    配下のプロセスの停止、クラウドのセキュリティエージェント無効化、cron による永続化、ログと bash 
    履歴の消去が挙げられている。同報告は攻撃者を名付けておらず、3 組の未特定の攻撃者として整理している。指標は同報告の IoC 
    ファイルに掲載された値で、ロール表記は付されていない。
cve: CVE-2023-22527
