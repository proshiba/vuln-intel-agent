  summary: Cisco Talos が高い確度で単一の高度な脅威アクター UAT-8616 として整理している活動。2026-02-25 
    公開の報告では Cisco Catalyst SD-WAN Controller の CVE-2026-20127 の 0-day 
    悪用を追跡しており、関連する活動は少なくとも 2023 年まで遡るとしている。侵入後はソフトウェアのバージョンダウングレードを経て 
    CVE-2022-20775 を悪用し root へ昇格、その後元のバージョンへ戻す手口が報告されている。2026-05-14 
    公開の続報では、同アクターが CVE-2026-20182 の実環境悪用も行い、SSH 鍵の追加・NETCONF 設定変更・root 
    昇格を試みたとされる。インフラは Talos が追跡する ORB ネットワークと重複する。いずれの報告も公開の IOC 
    値を示していないため、本エントリに指標は登録していない。
