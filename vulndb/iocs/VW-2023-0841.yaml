  name: LockBit 3.0 affiliates exploiting Citrix Bleed (AA23-325A)
  references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-325a
  summary: CISA・FBI・MS-ISAC・ACSC による共同勧告 AA23-325A。LockBit 3.0 のアフィリエイトが 
    NetScaler ADC / Gateway の CVE-2023-4966（Citrix Bleed）でセッションを乗っ取り、認証と MFA 
    を回避して初期アクセスを得ていると報告。勧告は Mag.dll / adobelib.dll 
    などのツール、AnyDesk・Splashtop・Plink といった正規ツールの悪用、および IOC 表を掲載している。
