  first_reported: '2026-07-15T00:00:00Z'
  malware:
  - KNUCKLEBALL
  - ORANGETAIL
  - ROOTRUN
  - Suo5
  name: INC Ransomware exploitation of the SonicWall SMA1000 zero-day chain 
    (UTA0533)
  references:
  - https://www.resecurity.com/blog/article/from-wsproxy-to-root-inc-ransomware-and-sonicwall-sma-exploit-chain
  - https://thehackernews.com/2026/08/inc-ransomware-emerges-as-dominant.html
  summary: SonicWall SMA1000 の /wsproxy 認証バイパス(CVE-2026-15409)と remove_hotfix 
    のパストラバーサル(CVE-2026-15410)を連鎖させ、root 権限を取得する攻撃チェーン。Volexity は公開前からの悪用クラスタを 
    UTA0533 として追跡しており、Resecurity は INC Ransomware 
    がこのチェーンを武器化した主要アクターと報告している。侵害後は setuid バックドア ROOTRUN、Python ローダ 
    KNUCKLEBALL、HTTP プロキシ Suo5、Behinder 系の Java ウェブシェル ORANGETAIL が設置され、tcpdump 
    による LDAP 認証情報の採取も報告されている。被害者への接触には、事件直後に登録されたドメイン helprans.com 
    のメールアドレスが使われた。
cve: CVE-2026-15410
