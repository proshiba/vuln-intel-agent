  summary: Volexity は未知の攻撃者 UTA0576 による Ivanti Connect Secure の 0-day 
    連鎖悪用を報告しており、認証バイパスと RCE を含む CVE-2026-104935 
    に加えて、本稿時点で未修正の権限昇格の脆弱性が連鎖させられたとしている。悪用の開始は 2026-10-03、調査開始は 2026-10-05 
    で、Ivanti の修正と CISA KEV への追加は 2026-10-13 である。侵入後は tcpdump をリネームした dsstatmond 
    による通信傍受と h.py による資格情報の抽出、ml.py / rq5.py による Active Directory 探索、mk.py / 
    rr.py / sp_run.py による Kerberoast とパスワードスプレーが観測されている。Volexity は第 1 
    段のマルウェアやウェブシェルを確認できなかったとしており、公開された指標は攻撃に使われたホスト 1 件のみである。
