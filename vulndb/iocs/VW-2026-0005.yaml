campaigns:
- actors: []
  first_reported: '2026-03-03T00:00:00Z'
  malware:
  - XenShell
  name: Cisco Catalyst SD-WAN Manager chained exploitation (ZeroZenX PoC / 
    XenShell)
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 'Cisco Talos は、未修正の Cisco Catalyst SD-WAN Manager に対し CVE-2026-20133 /
    CVE-2026-20128 / CVE-2026-20122 を連鎖させた未認証侵入が 2026 年 3 月から 4 月にかけて広範に発生したと報告している。ZeroZenX
    Labs が 3 月に公開した PoC とその JSP ウェブシェル（Talos 呼称 XenShell）の利用が大半を占め、Talos は侵入後の活動を
    Cluster #1〜#10 として整理している。これらは UAT-8616 とは別個の複数の脅威クラスタで、出典は各クラスタに攻撃者名を与えていない。指標は
    3 つの CVE を分けずに掲載されているため、本台帳でも 3 件に共通して記録している。'
- actors: []
  first_reported: '2026-03-06T00:00:00Z'
  malware:
  - Godzilla webshell
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #1'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: ZeroZenX Labs の PoC で連鎖脆弱性を悪用し、ファイル名 20251117022131.jsp の Godzilla 
    ウェブシェル亜種を設置したクラスタ。少なくとも 2026-03-06 から活動。掲載 IP は悪用の実行とシェルへの接続の双方に使われた。
- actors: []
  first_reported: '2026-03-10T00:00:00Z'
  malware:
  - Behinder webshell
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #2'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-10 から活動。ファイル名 conf.jsp の Behinder ウェブシェル亜種を設置した。通常の AES
    ではなく Base64 のみでエンコードする改変版。
- actors: []
  first_reported: '2026-03-04T00:00:00Z'
  malware:
  - XenShell
  - Behinder webshell
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #3'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-04 から活動。XenShell を sysv.jsp として設置し、数時間後に Behinder 
    ウェブシェル亜種を sysinit.jsp として追加設置した。
- actors: []
  first_reported: '2026-03-03T00:00:00Z'
  malware:
  - Godzilla webshell
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #4'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-03 から活動。ファイル名 vmurnp_ikp.jsp の Godzilla 
    ウェブシェル亜種を設置した。掲載 IP は本クラスタに帰属するとされる。
- actors: []
  first_reported: '2026-03-13T00:00:00Z'
  malware:
  - AdaptixC2
  - Mythic
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #5'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 2026-03-13 以降、公開レッドチームフレームワーク AdaptixC2 から作成したエージェントを 
    systemd-resolved の名前で設置。TCP バナーは既定値から shadowcore に変更されていた。C2 の 
    194.163.175.135 は 4445/tcp の AdaptixC2 に加え、7443/tcp の Mythic C2 と 31337/tcp 
    の別 AdaptixC2 をホストしていた。
- actors: []
  first_reported: '2026-03-05T00:00:00Z'
  malware:
  - Sliver
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #6'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-05 から、オープンソースの敵対的エミュレーション基盤 Sliver のインプラントを CWan 
    の名前で設置。C2 は mtls://23.27.143.170:443。
- actors: []
  first_reported: '2026-03-25T00:00:00Z'
  malware:
  - XMRig
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #7'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-25 から、シェルスクリプト経由で 83.229.126.195 から XMRig 
    本体と設定ファイルを取得して実行。Talos は同 IP を Cobalt Strike の既知 C2 サーバでもあるとしている。
- actors: []
  first_reported: '2026-03-10T00:00:00Z'
  malware:
  - Nim-based backdoor (NimPlant variant)
  - KScan (QScan)
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #8'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-10 から活動。資産探索ツール KScan を QScan に改名して使い、Nimplant を基にした 
    Nim 製インプラント agent1 を設置した。インプラントは Replit 上の攻撃者払い出しサブドメインから取得され、C2 は 
    http://13.62.52.206:5004。Talos は取得元の接続元 IP を ProtonVPN 
    ノードの可能性が高いとしており、共有サービスのため本台帳には取り込んでいない。
- actors: []
  first_reported: '2026-03-17T00:00:00Z'
  malware:
  - gsocket
  - XMRig
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #9'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-17 から、P2P トンネリングツール gsocket と Monero マイナー XMRig 
    を設置。gsocket は defunct.dat を Base58 デコードして接続先ピア ID を得て、.profile 経由で起動される。
- actors: []
  first_reported: '2026-03-13T00:00:00Z'
  malware:
  - vManage credential stealer (loot_run.sh)
  name: 'Cisco Catalyst SD-WAN Manager post-exploitation Cluster #10'
  references:
  - https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
  summary: 少なくとも 2026-03-13 から、認証情報窃取スクリプト loot_run.sh を設置。admin のハッシュダンプ、REST 
    API 認証に使う JWT 鍵チャンク、vManage の AWS 
    認証情報（AccessKeyId・SecretAccessKey・Token）の取得を試みた。ハードコードしたパスワードで root 
    昇格可否を確認する補助スクリプトも併せて設置された。
cve: CVE-2026-20128
