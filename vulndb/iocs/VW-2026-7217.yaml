  malware:
  - router_init.js
  - tanstack_runner.js
  - '@tanstack/setup'
  name: Mini Shai-Hulud (TanStack npm supply-chain compromise)
  references:
  - https://github.com/advisories/GHSA-g7cv-rxg3-hmpx
  - https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
  summary: 2026-05-11 に @tanstack/* の 42 パッケージへ 84 個の悪性バージョンが npm 
    へ公開された供給網攻撃。GitHub Actions の OIDC 信頼公開バインディングを乗っ取り、正規の発行元 ID のまま資格情報窃取マルウェア 
    router_init.js / tanstack_runner.js を配布した。Socket は活動を Mini Shai-Hulud 
    と呼び、インフラ内のメッセージ With Love TeamPCP から TeamPCP を挙げている。GitHub アカウント zblgg と 
    voicproducoes が攻撃側として advisory に記録されている。
cve: CVE-2026-45321
