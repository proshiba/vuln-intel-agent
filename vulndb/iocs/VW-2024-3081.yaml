campaigns:
- actors:
  - Akira affiliates
  first_reported: '2025-07-21T00:00:00Z'
  malware:
  - Akira
  name: 'Smash and Grab: Akira ransomware campaign targeting SonicWall SSL VPN (Arctic
    Wolf Labs, Sep 2025)'
  references:
  - https://arcticwolf.com/resources/blog/smash-and-grab-aggressive-akira-campaign-targets-sonicwall-vpns/
  summary: Arctic Wolf Labs は 2025-07-21 に始まり公開時点でも継続中のキャンペーンとして、SonicWall 
    ファイアウォールの SSL VPN への不正ログインから数分で内部スキャン・Impacket による SMB 活動が続き、1 時間以内に Akira 
    ランサムウェアが展開される侵入を多数観測したと報告している。SonicWall は本キャンペーンの不正ログインを CVE-2024-40766 
    に結び付けており、同脆弱性のある機器から窃取された資格情報が、修正適用後の機器でも使われた可能性があるという見方が示されている。OTP による MFA 
    が有効なアカウントでも認証が成功しており、Arctic Wolf は MFA 
    回避の手法を説明できていないと明記している。ログイン元はいずれもホスティング事業者の ASN 
    であり、侵入は業種・規模を問わない日和見的なものと評価されている。
- actors: []
  first_reported: '2024-08-01T00:00:00Z'
  malware:
  - Akira
  - Fog
  name: Fog and Akira ransomware intrusions via SonicWall SSL VPN (Arctic Wolf 
    Labs, Oct 2024)
  references:
  - https://arcticwolf.com/resources/blog/arctic-wolf-labs-observes-increased-fog-and-akira-ransomware-activity-linked-to-sonicwall-ssl-vpn/
  summary: Arctic Wolf Labs は 2024 年 8 月初旬以降、SonicWall SSL VPN アカウントを初期アクセスに用いる 
    Fog / Akira ランサムウェア侵入を 30 件以上観測したと報告している。不正な VPN ログインはいずれも VPS ホスティング事業者の IP
    から行われ、複数の侵入で同一インフラが共有されていた。SonicWall が 2024-09-06 に CVE-2024-40766 
    の悪用可能性を示した一方、Arctic Wolf 
    は調査した侵入で同脆弱性が悪用された決定的証拠は得られていないとし、ただし対象機器はすべて同脆弱性の影響を受けるファームウェアで稼働していたと述べている。本台帳の指標はこの留保付きの関連として登録している。
cve: CVE-2024-40766
