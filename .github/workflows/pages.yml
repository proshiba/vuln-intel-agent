name: Deploy vulnerability viewer to Pages

on:
  # Publish when someone merges a change to the ledger or the viewer by hand.
  #
  # This does NOT cover the daily update. Auto-merge lands it with `gh pr merge`
  # using GITHUB_TOKEN, and GitHub does not start workflow runs from pushes made
  # with that token -- so the push below never fires for the bot's merges. That
  # went unnoticed for three days and left the site showing stale data; the
  # workflow_run trigger is what actually covers the daily path.
  push:
    branches: [main]
    paths:
      - "vulndb/index.csv"
      # Threat activity feeds the malware/actor/ioc.* entities in search.json,
      # so merging investigation results must redeploy just like ledger data.
      - "vulndb/iocs/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  # Publish after the daily auto-merge lands new ledger data on main. A workflow
  # completing is its own event, so this fires even though the merge push cannot.
  workflow_run:
    workflows: ["Auto-merge daily advisories"]
    types: [completed]
  # Safety net. Both triggers above depend on event plumbing that fails silently,
  # and the only symptom is a site that quietly stops moving. Redeploying once a
  # day costs a couple of minutes and bounds how stale the site can get.
  schedule:
    - cron: "40 21 * * *"
  # Allow manual redeployment from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer run supersedes an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Do not publish when the daily run failed verification -- main has no new
    # data in that case, and a deployment would only hide the failure.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run and schedule do not carry the merge commit in the
          # default ref, and the site is always built from main regardless of
          # what triggered the run.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        # Lets build_index.py derive the attack-surface class via the shared classifier.
        run: python -m pip install -e .

      - name: Build search index
        run: python web/build_index.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
