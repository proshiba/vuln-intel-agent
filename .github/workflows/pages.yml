name: Deploy vulnerability viewer to Pages

on:
  # Publish after each daily auto-merge lands new ledger data on main.
  push:
    branches: [main]
    paths:
      - "vulndb/index.csv"
      - "web/**"
      - ".github/workflows/pages.yml"
  # Allow manual redeployment from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer run supersedes an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        # Lets build_index.py derive the attack-surface class via the shared classifier.
        run: python -m pip install -e .

      - name: Build search index
        run: python web/build_index.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
