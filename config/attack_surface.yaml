# 初期アクセス面のキュレーション一覧。
#
# 外部公開サーバのうち、初期アクセス（侵入の起点）に悪用されやすい製品を分類ごとに
# 列挙する。台帳エントリのベンダー・製品名がここに一致すると attack_surface_class が
# 付与され、GitHub Pages ビューアや台帳 CSV から「悪用が確認された初期アクセス面」を
# 絞り込める。網羅より確度を優先し、確実なものだけを段階的に追加する。
#
# 判定はベンダー名と製品名の両方一致（大文字小文字を無視した部分一致）で行う。
# IP アドレス・ホスト名・認証情報などの機密情報は決して記載しない。
#
# reach は「侵害されたときにどこまで届くか」を表し、対応優先度の判定に使う。
#
#   network_pivot: 侵害されると内部ネットワークの広い範囲へ到達しうる。VPN 装置や
#                  境界機器、配下の多数の端末を操作できるリモート管理基盤が該当する。
#                  自組織の資産台帳に載っていなくても優先度を引き上げる。
#   service:       侵害の影響がそのサービスとデータに概ね限られる。
#
# 収集ソースを持たないベンダーも、NVD/OSV/JVN などの汎用フィード経由で台帳に入るため
# 登録する価値がある。一致しなければ何も起きないので、登録しておいて損はない。
schema_version: 1
as_of: "2026-08-04"
classes:
  vpn_gateway:
    label: VPN/リモートアクセス
    reach: network_pivot
    products:
      - { vendor: Ivanti, name: Connect Secure }
      - { vendor: Ivanti, name: Policy Secure }
      - { vendor: Pulse Secure, name: Pulse Connect Secure }
      - { vendor: Fortinet, name: FortiOS }
      - { vendor: Fortinet, name: FortiGate }
      - { vendor: Fortinet, name: FortiProxy }
      - { vendor: Palo Alto Networks, name: GlobalProtect }
      - { vendor: Palo Alto Networks, name: PAN-OS }
      - { vendor: Citrix, name: NetScaler ADC }
      - { vendor: Citrix, name: NetScaler Gateway }
      - { vendor: Citrix, name: Gateway }
      - { vendor: Cisco, name: Adaptive Security Appliance }
      - { vendor: Cisco, name: ASA }
      - { vendor: Cisco, name: AnyConnect }
      - { vendor: SonicWall, name: SMA }
      - { vendor: SonicWall, name: SonicOS }
      - { vendor: Check Point, name: Quantum Security Gateway }
      - { vendor: F5, name: BIG-IP }
  webmail_collab:
    label: メール/コラボレーション
    reach: service
    products:
      - { vendor: Microsoft, name: Exchange Server }
      - { vendor: Microsoft, name: SharePoint }
      - { vendor: Atlassian, name: Confluence }
      - { vendor: Zimbra, name: Collaboration }
      - { vendor: Roundcube, name: Webmail }
      # KEV 3件がいずれもランサムウェア悪用（2026-01〜02）。
      - { vendor: SmarterTools, name: SmarterMail }
  rmm_remote_support:
    label: リモート管理/RMM
    # 侵害されると配下の多数の端末をそのまま操作できる。MSP 経由で顧客環境まで
    # 波及した実例があり、2024年以降の KEV 13件のうち6件がランサムウェア悪用。
    reach: network_pivot
    products:
      - { vendor: SimpleHelp, name: SimpleHelp }
      - { vendor: ConnectWise, name: ScreenConnect }
      - { vendor: N-able, name: N-central }
      - { vendor: BeyondTrust, name: Privileged Remote Access }
      - { vendor: BeyondTrust, name: Remote Support }
      - { vendor: Ivanti, name: Endpoint Manager }
      - { vendor: Kaseya, name: VSA }
  file_transfer:
    label: ファイル転送/MFT
    # MOVEit 型の大規模恐喝が繰り返し起きている面。2024年以降の KEV 23件。
    reach: service
    products:
      - { vendor: Progress, name: MOVEit Transfer }
      - { vendor: Progress, name: WS_FTP Server }
      - { vendor: CrushFTP, name: CrushFTP }
      - { vendor: Cleo, name: Harmony }
      - { vendor: Cleo, name: VLTrader }
      - { vendor: Cleo, name: LexiCom }
      - { vendor: Fortra, name: GoAnywhere }
      - { vendor: SolarWinds, name: Serv-U }
      - { vendor: Gladinet, name: CentreStack }
      - { vendor: Gladinet, name: Triofox }
      - { vendor: Wing FTP Server, name: Wing FTP Server }
  business_platform:
    label: 業務基盤/アプリケーションサーバ
    # 外部公開されがちで、侵害されると業務データへ直接届く。2024年以降の KEV 19件。
    reach: service
    products:
      - { vendor: Oracle, name: WebLogic Server }
      - { vendor: Oracle, name: E-Business Suite }
      - { vendor: SAP, name: NetWeaver }
      - { vendor: Splunk, name: Splunk Enterprise }
      - { vendor: Trend Micro, name: Apex One }
      - { vendor: SolarWinds, name: Web Help Desk }
      - { vendor: Apache, name: OFBiz }
  devtools_admin:
    label: 開発/管理基盤
    reach: service
    products:
      - { vendor: GitLab, name: GitLab }
      - { vendor: Atlassian, name: Jira }
      - { vendor: Jenkins, name: Jenkins }
      - { vendor: VMware, name: vCenter Server }
      - { vendor: VMware, name: Horizon }
      - { vendor: Zoho, name: ManageEngine }
      # MOVEit Transfer と WS_FTP Server はここではなく file_transfer に置いた。
  edge_network:
    label: ネットワーク境界機器
    reach: network_pivot
    products:
      - { vendor: Citrix, name: Application Delivery Controller }
      - { vendor: Juniper, name: Junos OS }
      - { vendor: Sophos, name: Firewall }
      - { vendor: Barracuda, name: Email Security Gateway }
      - { vendor: Array Networks, name: AG }
